# =============================================================================
# Gas Station & C-Store Management — Seed Tables (Expert tier)
# =============================================================================

scenario: |
  Gas Station & C-Store Management: fuel pricing & tank inventory (wet stock),
  pump/POS transaction, loyalty & fuel discount, age-restricted item compliance
  check, shift cash reconciliation, vendor (DSD) delivery, car-wash code,
  fuel-margin reporting

domain_name: gas-station-cstore
api_prefix: /

complexity_profile:
  primary_archetype: ledger_reconciliation        # shift cash: book drawer vs counted drawer
  secondary_archetype: pricing_engine              # fuel price + loyalty discount + margin
  complexity_layers:
    - dual_variant_calculation                     # fuel margin: WAC (chronological) vs replacement-cost (forward-looking)
    - cascading_side_effects                        # delivery -> tank -> WAC -> margin; settle -> shift drawer
    - rate_threshold_triggers                       # cash-variance tolerance, low-stock reorder point, age threshold
    - optimistic_concurrency                        # OCC on Shift.version and Tank.version
    - derived_field_reconciliation                  # tank volume, WAC, shift expected drawer, loyalty tier

  entity_topology: flat
  # Peer entities linked by FK references (station_id, tank_id, shift_id, …);
  # only Station sits at the URL root, all others are flat collections under it
  # carrying explicit foreign keys rather than deep nested ownership paths.

  state_machine_shape: parallel
  # Two entities (Shift, FuelTransaction) each carry two INDEPENDENT status axes;
  # additionally Tank is CYCLIC (ACTIVE -> DOWN -> ACTIVE), so the set contains
  # both a cycle and parallel dimensions.

  relationship_patterns:
    - one_to_many        # Station 1—* Tank/Pump/Shift/Delivery/Transaction
    - flat_with_references  # Pump -> Tank, FuelTransaction -> Pump/Shift/LoyaltyAccount
    - cross_aggregate    # FuelTransaction settlement debits Shift.expected_drawer_cents

  role_model: peer_roles
  # CashierAttendant owns shift/transaction operations; StationManager owns
  # pricing/tank/delivery/report; LoyaltyMember acts on own loyalty account.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Station display name" }
      - { name: brand, type: string, source: input, description: "Fuel brand banner" }
      - { name: tax_rate_bp, type: integer, source: input, default: 825, description: "Sales tax in basis points applied to taxable store items (825 = 8.25%)" }
      - { name: cash_variance_tolerance_cents, type: integer, source: input, default: 200, description: "Absolute drawer variance (cents) within which a shift closes BALANCED" }
      - { name: current_utc, type: datetime, source: system, description: "Server business clock; advanced only via POST /_clock/set" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; starts at 1, +1 per mutation" }

  - name: FuelGrade
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: code, type: enum, source: input, description: "REGULAR | MIDGRADE | PREMIUM | DIESEL; unique per station" }
      - { name: octane, type: integer, source: input, description: "Posted octane rating" }
      - { name: current_price_cents, type: integer, source: computed, default: 0, description: "Current posted street price per gallon in cents; set by the latest reprice action" }
      - { name: prior_price_cents, type: integer, source: computed, default: 0, description: "Posted price immediately before the most recent reprice (0 before any reprice)" }
      - { name: weighted_avg_cost_cents, type: number, source: computed, default: 0, description: "Weighted average wet-stock cost per gallon (cents) across all POSTED deliveries to this grade's tanks; recomputed on each delivery post" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Tank
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: fuel_grade_id, type: string, source: input, description: "FK -> FuelGrade.id; grade stored in this tank" }
      - { name: label, type: string, source: input, description: "Physical tank label e.g. T1" }
      - { name: capacity_gallons, type: number, source: input, description: "Maximum holding volume in gallons" }
      - { name: reorder_point_gallons, type: number, source: input, description: "Volume at/below which low_stock becomes true" }
      - { name: volume_gallons, type: number, source: computed, default: 0, description: "Current wet-stock volume; += delivery net gallons, -= dispensed gallons" }
      - { name: low_stock, type: boolean, source: computed, default: false, description: "True when volume_gallons <= reorder_point_gallons" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DOWN — DOWN tanks reject deliveries and dispensing; cycles ACTIVE->DOWN->ACTIVE" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Pump
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; tank this pump draws from" }
      - { name: number, type: integer, source: input, description: "Pump island number; unique per station" }
      - { name: status, type: enum, source: system, default: "IDLE", description: "IDLE | DISPENSING | OUT_OF_SERVICE" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: tank_id, type: string, source: input, description: "FK -> Tank.id; tank being filled" }
      - { name: vendor_name, type: string, source: input, description: "DSD vendor / carrier name" }
      - { name: net_gallons, type: number, source: input, description: "Temperature-compensated net gallons delivered" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Vendor cost per gallon in cents (wet-stock cost)" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "round(net_gallons * unit_cost_cents)" }
      - { name: paid_cash, type: boolean, source: input, default: false, description: "True if driver paid in cash from the drawer (DSD payout)" }
      - { name: shift_id, type: string, source: input, default: null, description: "FK -> Shift.id; shift charged the cash payout when paid_cash is true" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> POSTED -> VOIDED; REJECTED is a revert from DRAFT" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: cashier_user_id, type: string, source: input, description: "X-User-ID of the CashierAttendant who opened the shift" }
      - { name: opening_float_cents, type: integer, source: input, description: "Starting cash placed in the drawer" }
      - { name: cash_sales_cents, type: integer, source: computed, default: 0, description: "Sum of CASH-tendered transaction totals SETTLED during this shift" }
      - { name: cash_payouts_cents, type: integer, source: computed, default: 0, description: "Sum of POSTED cash-paid (paid_cash) delivery invoice_total_cents charged to this shift" }
      - { name: cash_drops_cents, type: integer, source: computed, default: 0, description: "Sum of cash dropped to the safe during this shift" }
      - { name: expected_drawer_cents, type: integer, source: computed, default: 0, description: "opening_float + cash_sales - cash_payouts - cash_drops" }
      - { name: counted_drawer_cents, type: integer, source: input, default: null, description: "Physical cash counted at close" }
      - { name: variance_cents, type: integer, source: computed, default: null, description: "counted_drawer_cents - expected_drawer_cents (set at close)" }
      - { name: lifecycle_status, type: enum, source: system, default: "OPEN", description: "OPEN -> COUNTING -> CLOSED; lifecycle axis" }
      - { name: reconcile_status, type: enum, source: system, default: "PENDING", description: "PENDING -> BALANCED | OVER | SHORT; independent reconciliation axis, set at close" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: FuelTransaction
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: pump_id, type: string, source: input, description: "FK -> Pump.id; pump that dispensed" }
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id; shift the sale belongs to" }
      - { name: loyalty_account_id, type: string, source: input, default: null, description: "FK -> LoyaltyAccount.id; member earning discount/points, null for guest" }
      - { name: gallons, type: number, source: input, description: "Gallons dispensed" }
      - { name: tender, type: enum, source: input, description: "CASH | CARD" }
      - { name: base_price_cents, type: integer, source: computed, description: "FuelGrade.current_price_cents at authorization" }
      - { name: discount_cents_per_gal, type: integer, source: computed, default: 0, description: "Per-gallon loyalty discount applied (tier-based, capped)" }
      - { name: net_price_cents_per_gal, type: integer, source: computed, description: "base_price_cents - discount_cents_per_gal" }
      - { name: total_cents, type: integer, source: computed, description: "round(gallons * net_price_cents_per_gal)" }
      - { name: cogs_cents, type: integer, source: computed, description: "round(gallons * tank weighted_avg_cost_cents) captured at settlement" }
      - { name: payment_status, type: enum, source: system, default: "AUTHORIZED", description: "AUTHORIZED -> CAPTURED -> REFUNDED; payment axis" }
      - { name: settlement_status, type: enum, source: system, default: "UNSETTLED", description: "UNSETTLED -> SETTLED -> REVERSED; settlement axis (independent of payment_status)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: StoreTransaction
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id; shift the sale belongs to" }
      - { name: loyalty_account_id, type: string, source: input, default: null, description: "FK -> LoyaltyAccount.id; member earning points, null for guest" }
      - { name: tender, type: enum, source: input, description: "CASH | CARD" }
      - { name: line_items, type: array, source: input, description: "Array of {sku, name, category, unit_price_cents, qty, taxable, min_age}; min_age>0 marks age-restricted item" }
      - { name: verified_buyer_age, type: integer, source: input, default: null, description: "Operator-verified buyer age from ID scan; required when any line item has min_age>0" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of unit_price_cents*qty over all line items" }
      - { name: tax_cents, type: integer, source: computed, description: "round(taxable_subtotal * tax_rate_bp/10000)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + tax_cents" }
      - { name: settlement_status, type: enum, source: system, default: "SETTLED", description: "SETTLED -> REVERSED; store sales settle immediately at create" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: LoyaltyAccount
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; enrolling station" }
      - { name: phone, type: string, source: input, description: "Member phone; unique per station" }
      - { name: name, type: string, source: input, description: "Member name" }
      - { name: point_balance, type: integer, source: computed, default: 0, description: "Redeemable point balance" }
      - { name: lifetime_points, type: integer, source: computed, default: 0, description: "Cumulative points ever earned; drives tier" }
      - { name: tier, type: enum, source: computed, default: "BRONZE", description: "BRONZE | SILVER | GOLD; derived from lifetime_points thresholds" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: CarWashCode
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; issuing station" }
      - { name: fuel_transaction_id, type: string, source: input, default: null, description: "FK -> FuelTransaction.id; fuel sale that earned the code, null for purchased codes" }
      - { name: package, type: enum, source: input, description: "BASIC | DELUXE | SUPREME" }
      - { name: price_cents, type: integer, source: computed, default: 0, description: "Charged price after loyalty discount; 0 for earned codes" }
      - { name: code_value, type: string, source: system, description: "Issued redemption code string" }
      - { name: expires_at, type: datetime, source: computed, description: "issued effective_at + CODE_TTL_DAYS days" }
      - { name: status, type: enum, source: system, default: "ISSUED", description: "ISSUED -> REDEEMED; ISSUED -> EXPIRED -> ISSUED (reissue revives an expired code)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: MarginReport
    parent: null
    common_fields: false
    fields:
      - { name: station_id, type: string, source: input, description: "Station this report is computed over; supplied in the POST body and echoed back. Not a stored child relationship — the report is an ephemeral computed snapshot, not a queryable resource." }
      - { name: window_start, type: datetime, source: input, description: "Inclusive window start (>=) over FuelTransaction.created_at" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive window end (<) over FuelTransaction.created_at" }
      - { name: cost_basis, type: enum, source: input, default: "WAC", description: "WAC | REPLACEMENT — selects margin variant" }
      - { name: gallons_sold, type: number, source: computed, description: "Sum of gallons over SETTLED non-REVERSED fuel transactions in window" }
      - { name: revenue_cents, type: integer, source: computed, description: "Sum of total_cents over those transactions" }
      - { name: cogs_cents, type: integer, source: computed, description: "Sum of per-grade round(gallons * cost_per_gal) using the selected cost basis" }
      - { name: margin_cents, type: integer, source: computed, description: "revenue_cents - cogs_cents" }
      - { name: margin_pct, type: number, source: computed, description: "round(margin_cents / revenue_cents * 100, 2); 0 when revenue_cents == 0" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---- Tank: CYCLIC (ACTIVE <-> DOWN) ----
  - entity: Tank
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DOWN
        trigger: "POST /tanks/{tankId}/take-down"
        actor: StationManager
        preconditions:
          - "Tank.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "All Pumps with tank_id == this tank and status != OUT_OF_SERVICE -> OUT_OF_SERVICE"
          - "increments Tank.version by 1"
        note: "Taking a tank down cascades pumps OUT_OF_SERVICE so they cannot dispense."

      - from: DOWN
        to: ACTIVE
        trigger: "POST /tanks/{tankId}/restore"
        actor: StationManager
        preconditions:
          - "Tank.status == DOWN (else ERR_INVALID_STATE)"
        side_effects:
          - "All Pumps with tank_id == this tank and status == OUT_OF_SERVICE -> IDLE"
          - "increments Tank.version by 1"
        note: "Cycle: a tank returns to ACTIVE and its pumps come back to IDLE. ACTIVE is reachable again after leaving it."

  # ---- Delivery: linear with revert (DRAFT -> REJECTED) ----
  - entity: Delivery
    initial_state: DRAFT
    terminal_states: [VOIDED, REJECTED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /deliveries/{deliveryId}/post"
        actor: StationManager
        preconditions:
          - "Delivery.status == DRAFT (else ERR_INVALID_STATE)"
          - "Tank.status == ACTIVE (else ERR_TANK_DOWN)"
          - "Tank.volume_gallons + net_gallons <= Tank.capacity_gallons (else ERR_TANK_CAPACITY_EXCEEDED)"
          - "if paid_cash: referenced Shift.lifecycle_status == OPEN (else ERR_SHIFT_NOT_OPEN)"
        side_effects:
          - "Tank.volume_gallons += net_gallons; recompute Tank.low_stock"
          - "Recompute FuelGrade.weighted_avg_cost_cents for the tank's grade (cascade into margin basis)"
          - "if paid_cash: Shift.cash_payouts_cents += invoice_total_cents; recompute Shift.expected_drawer_cents"
          - "increments Delivery.version by 1"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /deliveries/{deliveryId}/reject"
        actor: StationManager
        preconditions:
          - "Delivery.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "increments Delivery.version by 1"
        note: "Revert: a draft delivery rejected on inspection never touches wet stock."

      - from: POSTED
        to: VOIDED
        trigger: "POST /deliveries/{deliveryId}/void"
        actor: StationManager
        preconditions:
          - "Delivery.status == POSTED (else ERR_INVALID_STATE)"
          - "Tank.volume_gallons - net_gallons >= 0 (else ERR_NEGATIVE_VOLUME)"
          - "if paid_cash: referenced Shift.lifecycle_status == OPEN (else ERR_SHIFT_NOT_OPEN)"
        side_effects:
          - "Tank.volume_gallons -= net_gallons; recompute Tank.low_stock"
          - "Recompute FuelGrade.weighted_avg_cost_cents for the tank's grade"
          - "if paid_cash: Shift.cash_payouts_cents -= invoice_total_cents; recompute Shift.expected_drawer_cents (compensating invariant)"
          - "increments Delivery.version by 1"

  # ---- Shift: PARALLEL dimensions (lifecycle_status x reconcile_status) ----
  - entity: Shift
    initial_state: OPEN          # lifecycle axis initial; reconcile axis initial is PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: COUNTING
        trigger: "POST /shifts/{shiftId}/begin-count"
        actor: CashierAttendant
        preconditions:
          - "Shift.lifecycle_status == OPEN (else ERR_INVALID_STATE)"
          - "acting CashierAttendant.X-User-ID == Shift.cashier_user_id (else ERR_NOT_SHIFT_OWNER)"
        side_effects:
          - "No further transactions may settle into this shift (settlement attempts -> ERR_SHIFT_NOT_OPEN)"
          - "increments Shift.version by 1"
        note: "lifecycle axis advances; reconcile_status stays PENDING."

      - from: COUNTING
        to: CLOSED
        trigger: "POST /shifts/{shiftId}/close"
        actor: CashierAttendant
        preconditions:
          - "Shift.lifecycle_status == COUNTING (else ERR_INVALID_STATE)"
          - "expected_<shift>_version matches (else ERR_STALE_VERSION)"
          - "counted_drawer_cents provided and >= 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "Shift.variance_cents = counted_drawer_cents - expected_drawer_cents"
          - "Shift.reconcile_status set on the independent axis: BALANCED if abs(variance) <= cash_variance_tolerance_cents, OVER if variance > tolerance, SHORT if variance < -tolerance"
          - "increments Shift.version by 1"
        note: "Single close transition resolves BOTH axes: lifecycle -> CLOSED and reconcile -> {BALANCED|OVER|SHORT}, which evolve independently of each other."

  # ---- FuelTransaction: PARALLEL dimensions (payment_status x settlement_status) ----
  - entity: FuelTransaction
    initial_state: AUTHORIZED     # payment axis initial; settlement axis initial is UNSETTLED
    terminal_states: []
    transitions:
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /fuel-transactions/{txnId}/capture"
        actor: CashierAttendant
        preconditions:
          - "FuelTransaction.payment_status == AUTHORIZED (else ERR_INVALID_STATE)"
        side_effects:
          - "Pump.status -> IDLE"
          - "increments FuelTransaction.version by 1"
        note: "Payment axis only; settlement_status unaffected."

      - from: UNSETTLED
        to: SETTLED
        trigger: "POST /fuel-transactions/{txnId}/settle"
        actor: CashierAttendant
        preconditions:
          - "FuelTransaction.payment_status == CAPTURED (else ERR_PAYMENT_NOT_CAPTURED)"
          - "FuelTransaction.settlement_status == UNSETTLED (else ERR_INVALID_STATE)"
          - "referenced Shift.lifecycle_status == OPEN (else ERR_SHIFT_NOT_OPEN)"
        side_effects:
          - "FuelTransaction.cogs_cents = round(gallons * tank.weighted_avg_cost_cents)"
          - "if tender == CASH: Shift.cash_sales_cents += total_cents; recompute Shift.expected_drawer_cents"
          - "if loyalty_account_id set: LoyaltyAccount.lifetime_points and point_balance += accrued points; recompute tier"
          - "increments FuelTransaction.version by 1"
        note: "Settlement axis advances independently; payment_status remains CAPTURED."

      - from: SETTLED
        to: REVERSED
        trigger: "POST /fuel-transactions/{txnId}/reverse"
        actor: CashierAttendant
        preconditions:
          - "FuelTransaction.settlement_status == SETTLED (else ERR_INVALID_STATE)"
          - "referenced Shift.lifecycle_status == OPEN (else ERR_SHIFT_NOT_OPEN)"
        side_effects:
          - "if tender == CASH: Shift.cash_sales_cents -= total_cents; recompute Shift.expected_drawer_cents (compensating invariant)"
          - "if loyalty_account_id set: subtract the same accrued points from lifetime_points and point_balance; recompute tier"
          - "FuelTransaction.payment_status -> REFUNDED"
          - "increments FuelTransaction.version by 1"
        note: "Reverse drives settlement_status -> REVERSED AND payment_status -> REFUNDED, demonstrating the two axes are coupled only here, not generally."

  # ---- CarWashCode: CYCLIC (ISSUED -> EXPIRED -> ISSUED) ----
  - entity: CarWashCode
    initial_state: ISSUED
    terminal_states: [REDEEMED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /car-wash-codes/{codeId}/redeem"
        actor: CashierAttendant
        preconditions:
          - "CarWashCode.status == ISSUED (else ERR_INVALID_STATE)"
          - "Station.current_utc < CarWashCode.expires_at (else ERR_CODE_EXPIRED)"
        side_effects:
          - "increments CarWashCode.version by 1"

      - from: ISSUED
        to: EXPIRED
        trigger: "system (automatic during POST /car-wash-codes/{codeId}/redeem when Station.current_utc >= expires_at)"
        actor: system
        preconditions:
          - "Station.current_utc >= CarWashCode.expires_at"
        side_effects:
          - "increments CarWashCode.version by 1"
        note: "Lazily flipped to EXPIRED on a redeem attempt past TTL; the redeem itself is rejected ERR_CODE_EXPIRED."

      - from: EXPIRED
        to: ISSUED
        trigger: "POST /car-wash-codes/{codeId}/reissue"
        actor: StationManager
        preconditions:
          - "CarWashCode.status == EXPIRED (else ERR_INVALID_STATE)"
        side_effects:
          - "CarWashCode.expires_at = Station.current_utc + CODE_TTL_DAYS days"
          - "increments CarWashCode.version by 1"
        note: "Cycle: a manager revives an expired code, returning it to ISSUED (reachable again after leaving)."

# =============================================================================
# Concurrency Rules (§1.2.1) — true CREATE-with-supersede races only
# =============================================================================
concurrency_rules:
  - rule_id: settle-into-stale-shift
    parent_entity: Shift
    write_endpoint: "POST /fuel-transactions/{txnId}/settle"
    occ_field: "expected_shift_version"
    description: |
      Settling a fuel transaction into a Shift whose version has advanced since
      the client last observed it is rejected. A settlement debits the shift
      drawer (cash) or accrues points; if another settlement or a cash-paid
      delivery post has already advanced the shift's version, the current
      writer's view of the drawer is stale and the settle is rejected so the
      drawer math is never applied against an outdated expected_drawer_cents.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: deliver-into-stale-tank
    parent_entity: Tank
    write_endpoint: "POST /deliveries/{deliveryId}/post"
    occ_field: "expected_tank_version"
    description: |
      Posting a delivery against a Tank whose version has advanced since the
      client last observed it is rejected. A post adds net gallons and pushes
      a new weighted-average cost; if another delivery post or a take-down has
      already advanced the tank's version, the current writer's capacity and
      WAC view is stale and the post is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: fuel_pump_price
    trigger: "POST /fuel-transactions (authorization), then frozen on the transaction"
    algorithm: tiered_pricing
    formula: |
      base_price_cents = FuelGrade.current_price_cents   # frozen at authorization
      tier_discount = TIER_DISCOUNT_CENTS[loyalty.tier]  # 0 if no loyalty_account_id
      discount_cents_per_gal = min(tier_discount, MAX_DISCOUNT_CENTS)
      net_price_cents_per_gal = base_price_cents - discount_cents_per_gal
      total_cents = round_half_up(gallons * net_price_cents_per_gal)   # gallons*cents, round to whole cents
    input_set: "single transaction; tier read from the linked LoyaltyAccount at authorization time"
    constants:
      TIER_DISCOUNT_CENTS: { BRONZE: 0, SILVER: 3, GOLD: 5 }
      MAX_DISCOUNT_CENTS: 10
    precision: "whole cents, round_half_up; gallons carried to 3 decimal places"

  - name: tank_wet_stock_balance
    trigger: "delivery post/void and fuel transaction settle/reverse"
    algorithm: aggregation
    formula: |
      volume_gallons starts at 0
      on delivery POST:    volume_gallons += net_gallons
      on delivery VOID:    volume_gallons -= net_gallons
      on fuel settle:      volume_gallons -= gallons   (dispense recorded at settlement)
      on fuel reverse:     volume_gallons += gallons
      low_stock = (volume_gallons <= reorder_point_gallons)
    input_set: "the single tank referenced; only POSTED deliveries and SETTLED (non-REVERSED) transactions move volume"
    precision: "gallons to 3 decimal places; comparison uses <= at the reorder boundary"

  - name: fuel_margin
    trigger: "POST /margin-reports (computed read over a window)"
    algorithm: aggregation
    formula: |
      Window predicate: FuelTransaction.created_at >= window_start AND < window_end,
        settlement_status == SETTLED (REVERSED excluded).
      gallons_sold = sum(gallons)
      revenue_cents = sum(total_cents)
      per grade g:
        cost_per_gal = (cost_basis == WAC) ? FuelGrade[g].weighted_avg_cost_cents
                                            : last POSTED Delivery.unit_cost_cents to a tank of grade g (by effective_at, created_at ASC tie-break)
        grade_cogs = round_half_up(grade_gallons * cost_per_gal)
      cogs_cents = sum(grade_cogs over grades)
      margin_cents = revenue_cents - cogs_cents
      margin_pct = (revenue_cents == 0) ? 0 : round_half_up(margin_cents / revenue_cents * 100, 2)
    input_set: "SETTLED fuel transactions in [window_start, window_end); grades grouped via pump->tank->fuel_grade"
    constants: {}
    precision: "cogs rounded per grade then summed (round-per-grade-then-sum, pinned); margin_pct to 2 decimals round_half_up"
    variants:
      - name: WAC
        when: "cost_basis == WAC (default)"
        difference: "uses the chronological weighted-average wet-stock cost accumulated across all POSTED deliveries"
      - name: REPLACEMENT
        when: "cost_basis == REPLACEMENT"
        difference: "uses the most recent POSTED delivery's unit cost (forward-looking replacement cost), ignoring older lots"

  - name: shift_cash_reconciliation
    trigger: "settlement/payout side-effects update the drawer; final values pinned at POST /shifts/{id}/close"
    algorithm: aggregation
    formula: |
      cash_sales_cents   = sum(total_cents of CASH transactions SETTLED into this shift and not REVERSED)
      cash_payouts_cents = sum(invoice_total_cents of POSTED paid_cash deliveries charged to this shift and not VOIDED)
      cash_drops_cents   = sum(amount_cents of cash drops recorded on this shift)
      expected_drawer_cents = opening_float_cents + cash_sales_cents - cash_payouts_cents - cash_drops_cents
      at close:
        variance_cents = counted_drawer_cents - expected_drawer_cents
        reconcile_status = BALANCED if abs(variance_cents) <= cash_variance_tolerance_cents
                           else OVER if variance_cents > cash_variance_tolerance_cents
                           else SHORT
    input_set: "the single shift; CASH-tender SETTLED transactions, POSTED cash deliveries, and drops linked to it"
    constants: {}
    precision: "whole cents; boundary uses <= for BALANCED (variance exactly at tolerance is BALANCED)"

  - name: loyalty_points_accrual
    trigger: "fuel settle and store create (settlement), reversed on reverse/refund"
    algorithm: weighted_scoring
    formula: |
      base_points = floor(fuel_gallons * POINTS_PER_GALLON)
                    + floor(store_subtotal_cents / 100) * POINTS_PER_DOLLAR
      awarded = floor(base_points * TIER_MULTIPLIER[tier])   # tier read at accrual time
      point_balance += awarded ; lifetime_points += awarded
      tier recomputed: GOLD if lifetime_points >= GOLD_THRESHOLD,
                       SILVER if lifetime_points >= SILVER_THRESHOLD, else BRONZE
    input_set: "single settling transaction; fuel txns carry gallons, store txns carry subtotal_cents"
    constants:
      POINTS_PER_GALLON: 10
      POINTS_PER_DOLLAR: 2
      TIER_MULTIPLIER: { BRONZE: 1.0, SILVER: 1.25, GOLD: 1.5 }
      SILVER_THRESHOLD: 2000
      GOLD_THRESHOLD: 5000
    precision: "floor at each stage in the order shown (multiply by tier then floor), no fractional points"
    variants:
      - name: fuel_accrual
        when: "settling a FuelTransaction"
        difference: "base from gallons only (store term is 0)"
      - name: store_accrual
        when: "settling a StoreTransaction at create"
        difference: "base from subtotal dollars only (fuel term is 0)"

  - name: store_transaction_total
    trigger: "POST /store-transactions"
    algorithm: aggregation
    formula: |
      subtotal_cents = sum(unit_price_cents * qty over all line items)
      taxable_subtotal = sum(unit_price_cents * qty over line items where taxable == true)
      tax_cents = round_half_up(taxable_subtotal * Station.tax_rate_bp / 10000)
      total_cents = subtotal_cents + tax_cents
    input_set: "the line_items array of one transaction"
    precision: "tax computed once on the taxable subtotal then rounded (sum-then-round, pinned), whole cents round_half_up"

  - name: car_wash_price
    trigger: "POST /car-wash-codes (purchased codes)"
    algorithm: tiered_pricing
    formula: |
      list_price = WASH_LIST_CENTS[package]
      wash_discount_pct = TIER_WASH_DISCOUNT_PCT[loyalty.tier]   # 0 if no loyalty
      price_cents = round_half_up(list_price * (1 - wash_discount_pct))
      earned codes (fuel_transaction_id set) have price_cents = 0
    input_set: "single code purchase; tier from optional linked loyalty account"
    constants:
      WASH_LIST_CENTS: { BASIC: 800, DELUXE: 1200, SUPREME: 1600 }
      TIER_WASH_DISCOUNT_PCT: { BRONZE: 0.0, SILVER: 0.10, GOLD: 0.20 }
      CODE_TTL_DAYS: 30
    precision: "whole cents, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for the operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All referenced resources (path ids and FK body fields) exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_referential
    check: "Body well-formed: required fields present, enum values legal, numeric fields non-negative"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 5
    category: business_referential
    check: "Acting CashierAttendant.X-User-ID equals Shift.cashier_user_id for shift-owner-only ops (begin-count, close)"
    error_id: ERR_NOT_SHIFT_OWNER
    http_status: 403
    applies_to: "POST /shifts/{id}/begin-count, POST /shifts/{id}/close"

  - priority: 6
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "Referenced Shift.lifecycle_status == OPEN when settling/reversing transactions or posting/voiding cash deliveries"
    error_id: ERR_SHIFT_NOT_OPEN
    http_status: 409
    applies_to: "POST /fuel-transactions/{id}/settle, /reverse; POST /deliveries/{id}/post, /void (paid_cash)"

  - priority: 8
    category: state
    check: "Fuel transaction payment_status == CAPTURED before settlement"
    error_id: ERR_PAYMENT_NOT_CAPTURED
    http_status: 409
    applies_to: "POST /fuel-transactions/{id}/settle"

  - priority: 9
    category: business_safety
    check: "When any line item has min_age>0, verified_buyer_age must be provided and >= max(min_age) across restricted items"
    error_id: ERR_AGE_VERIFICATION_FAILED
    http_status: 422
    applies_to: "POST /store-transactions"

  - priority: 10
    category: business_safety
    check: "Pump's tank is ACTIVE and pump not OUT_OF_SERVICE before a fuel transaction is authorized"
    error_id: ERR_PUMP_UNAVAILABLE
    http_status: 409
    applies_to: "POST /fuel-transactions"

  - priority: 11
    category: business_safety
    check: "Delivery's tank is ACTIVE before posting a delivery"
    error_id: ERR_TANK_DOWN
    http_status: 409
    applies_to: "POST /deliveries/{id}/post"

  - priority: 12
    category: business_temporal
    check: "Car-wash code not past expires_at when redeeming"
    error_id: ERR_CODE_EXPIRED
    http_status: 409
    applies_to: "POST /car-wash-codes/{id}/redeem"

  - priority: 13
    category: business_constraint
    check: "Posting a delivery must not push Tank.volume_gallons above capacity_gallons; voiding must not drive it negative"
    error_id: "ERR_TANK_CAPACITY_EXCEEDED / ERR_NEGATIVE_VOLUME"
    http_status: 409
    applies_to: "POST /deliveries/{id}/post, /void"

  - priority: 14
    category: business_constraint
    check: "Loyalty redemption points requested must not exceed point_balance"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 409
    applies_to: "POST /loyalty-accounts/{id}/redeem"

  - priority: 15
    category: business_fiscal
    check: "expected_<parent>_version matches current parent version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fuel-transactions/{id}/settle, POST /deliveries/{id}/post, POST /shifts/{id}/close"

  - priority: 16
    category: business_constraint
    check: "Per-station uniqueness: FuelGrade.code, Pump.number, and LoyaltyAccount.phone must each be unique within their station (checked after existence, before fiscal checks)"
    error_id: "ERR_DUPLICATE_GRADE / ERR_DUPLICATE_PUMP / ERR_DUPLICATE_PHONE"
    http_status: 409
    applies_to: "POST /fuel-grades, POST /pumps, POST /loyalty-accounts"

  - priority: 17
    category: business_referential
    check: "Pagination query params in range: 1 <= limit <= 100, offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all list (GET collection) endpoints"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Station ----
  - method: POST
    path: "/stations"
    description: "Create a station"
    roles: [StationManager]
    code: 201
    input: [name, brand, "tax_rate_bp?", "cash_variance_tolerance_cents?"]
    output: Station
    side_effects: ["current_utc initialized to epoch baseline; version=1"]

  - method: GET
    path: "/stations/{stationId}"
    description: "Get a station"
    roles: [StationManager, CashierAttendant, LoyaltyMember]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: POST
    path: "/_clock/set"
    description: "Test-driving: set a station's business clock"
    roles: [StationManager]
    code: 200
    input: [station_id, to_iso8601]
    output: Station
    side_effects: ["Station.current_utc = to_iso8601"]

  # ---- FuelGrade ----
  - method: POST
    path: "/fuel-grades"
    description: "Create a fuel grade for a station"
    roles: [StationManager]
    code: 201
    input: [station_id, code, octane]
    output: FuelGrade
    side_effects: ["current_price_cents=0, weighted_avg_cost_cents=0"]

  - method: GET
    path: "/fuel-grades"
    description: "List fuel grades, filterable by station"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: ["station_id?", "limit?", "offset?"]
    output: FuelGrade[]
    side_effects: []

  - method: GET
    path: "/fuel-grades/{gradeId}"
    description: "Get a fuel grade"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: []
    output: FuelGrade
    side_effects: []

  - method: POST
    path: "/fuel-grades/{gradeId}/reprice"
    description: "Reprice a grade (records prior price, sets new posted price)"
    roles: [StationManager]
    code: 200
    input: [new_price_cents]
    output: FuelGrade
    side_effects: ["FuelGrade.prior_price_cents = current_price_cents; FuelGrade.current_price_cents = new_price_cents; increments FuelGrade.version"]

  # ---- Tank ----
  - method: POST
    path: "/tanks"
    description: "Create a tank for a grade"
    roles: [StationManager]
    code: 201
    input: [station_id, fuel_grade_id, label, capacity_gallons, reorder_point_gallons]
    output: Tank
    side_effects: ["volume_gallons=0, low_stock=(0<=reorder_point), status=ACTIVE"]

  - method: GET
    path: "/tanks"
    description: "List tanks, filterable by station and grade"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: ["station_id?", "fuel_grade_id?", "limit?", "offset?"]
    output: Tank[]
    side_effects: []

  - method: GET
    path: "/tanks/{tankId}"
    description: "Get a tank"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: []
    output: Tank
    side_effects: []

  - method: POST
    path: "/tanks/{tankId}/take-down"
    description: "Take a tank out of service (ACTIVE -> DOWN)"
    roles: [StationManager]
    code: 200
    input: []
    output: Tank
    side_effects: ["status -> DOWN; pumps on tank -> OUT_OF_SERVICE; increments Tank.version"]

  - method: POST
    path: "/tanks/{tankId}/restore"
    description: "Restore a tank to service (DOWN -> ACTIVE)"
    roles: [StationManager]
    code: 200
    input: []
    output: Tank
    side_effects: ["status -> ACTIVE; OUT_OF_SERVICE pumps on tank -> IDLE; increments Tank.version"]

  # ---- Pump ----
  - method: POST
    path: "/pumps"
    description: "Create a pump bound to a tank"
    roles: [StationManager]
    code: 201
    input: [station_id, tank_id, number]
    output: Pump
    side_effects: ["status=IDLE"]

  - method: GET
    path: "/pumps"
    description: "List pumps, filterable by station and tank"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: ["station_id?", "tank_id?", "limit?", "offset?"]
    output: Pump[]
    side_effects: []

  - method: GET
    path: "/pumps/{pumpId}"
    description: "Get a pump"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: []
    output: Pump
    side_effects: []

  # ---- Delivery ----
  - method: POST
    path: "/deliveries"
    description: "Create a DSD delivery in DRAFT"
    roles: [StationManager]
    code: 201
    input: [station_id, tank_id, vendor_name, net_gallons, unit_cost_cents, "paid_cash?", "shift_id?"]
    output: Delivery
    side_effects: ["status=DRAFT; invoice_total_cents = round(net_gallons*unit_cost_cents)"]

  - method: GET
    path: "/deliveries"
    description: "List deliveries, filterable by station, tank, shift"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: ["station_id?", "tank_id?", "shift_id?", "limit?", "offset?"]
    output: Delivery[]
    side_effects: []

  - method: GET
    path: "/deliveries/{deliveryId}"
    description: "Get a delivery"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: []
    output: Delivery
    side_effects: []

  - method: POST
    path: "/deliveries/{deliveryId}/post"
    description: "Post a delivery into wet stock (DRAFT -> POSTED)"
    roles: [StationManager]
    code: 200
    input: [expected_tank_version]
    output: Delivery
    side_effects: ["Tank.volume_gallons += net_gallons; recompute low_stock; recompute FuelGrade.weighted_avg_cost_cents; if paid_cash: Shift.cash_payouts_cents += invoice_total_cents and recompute expected_drawer_cents; increments Tank.version by 1; increments Delivery.version by 1"]

  - method: POST
    path: "/deliveries/{deliveryId}/reject"
    description: "Reject a draft delivery (DRAFT -> REJECTED)"
    roles: [StationManager]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status -> REJECTED; increments Delivery.version"]

  - method: POST
    path: "/deliveries/{deliveryId}/void"
    description: "Void a posted delivery (POSTED -> VOIDED), unwinding wet stock"
    roles: [StationManager]
    code: 200
    input: []
    output: Delivery
    side_effects: ["Tank.volume_gallons -= net_gallons; recompute low_stock; recompute FuelGrade.weighted_avg_cost_cents; if paid_cash: Shift.cash_payouts_cents -= invoice_total_cents and recompute expected_drawer_cents; increments Delivery.version"]

  # ---- Shift ----
  - method: POST
    path: "/shifts"
    description: "Open a cashier shift"
    roles: [CashierAttendant]
    code: 201
    input: [station_id, opening_float_cents]
    output: Shift
    side_effects: ["cashier_user_id = X-User-ID; lifecycle_status=OPEN; reconcile_status=PENDING; cash_sales/payouts/drops=0; expected_drawer_cents=opening_float_cents"]

  - method: GET
    path: "/shifts"
    description: "List shifts, filterable by station"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: ["station_id?", "limit?", "offset?"]
    output: Shift[]
    side_effects: []

  - method: GET
    path: "/shifts/{shiftId}"
    description: "Get a shift"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: []
    output: Shift
    side_effects: []

  - method: POST
    path: "/shifts/{shiftId}/drops"
    description: "Record a cash drop to the safe"
    roles: [CashierAttendant]
    code: 200
    input: [amount_cents]
    output: Shift
    side_effects: ["cash_drops_cents += amount_cents; recompute expected_drawer_cents; increments Shift.version"]

  - method: POST
    path: "/shifts/{shiftId}/begin-count"
    description: "Move shift to COUNTING (lifecycle axis), freezing settlement"
    roles: [CashierAttendant]
    code: 200
    input: []
    output: Shift
    side_effects: ["lifecycle_status -> COUNTING; increments Shift.version"]

  - method: POST
    path: "/shifts/{shiftId}/close"
    description: "Close shift, compute variance and reconcile_status (both axes)"
    roles: [CashierAttendant]
    code: 200
    input: [counted_drawer_cents, expected_shift_version]
    output: Shift
    side_effects: ["variance_cents = counted_drawer_cents - expected_drawer_cents; lifecycle_status -> CLOSED; reconcile_status -> BALANCED|OVER|SHORT; increments Shift.version by 1"]

  # ---- FuelTransaction ----
  - method: POST
    path: "/fuel-transactions"
    description: "Authorize a pump fuel sale"
    roles: [CashierAttendant]
    code: 201
    input: [station_id, pump_id, shift_id, gallons, tender, "loyalty_account_id?"]
    output: FuelTransaction
    side_effects: ["base_price/discount/net_price/total computed and frozen; Pump.status -> DISPENSING; payment_status=AUTHORIZED; settlement_status=UNSETTLED"]

  - method: GET
    path: "/fuel-transactions"
    description: "List fuel transactions, filterable by station, pump, shift, loyalty account"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: ["station_id?", "pump_id?", "shift_id?", "loyalty_account_id?", "limit?", "offset?"]
    output: FuelTransaction[]
    side_effects: []

  - method: GET
    path: "/fuel-transactions/{txnId}"
    description: "Get a fuel transaction"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: []
    output: FuelTransaction
    side_effects: []

  - method: POST
    path: "/fuel-transactions/{txnId}/capture"
    description: "Capture payment (AUTHORIZED -> CAPTURED)"
    roles: [CashierAttendant]
    code: 200
    input: []
    output: FuelTransaction
    side_effects: ["payment_status -> CAPTURED; Pump.status -> IDLE; increments FuelTransaction.version"]

  - method: POST
    path: "/fuel-transactions/{txnId}/settle"
    description: "Settle into shift drawer and accrue points (UNSETTLED -> SETTLED)"
    roles: [CashierAttendant]
    code: 200
    input: [expected_shift_version]
    output: FuelTransaction
    side_effects: ["cogs_cents captured; Tank.volume_gallons -= gallons; if CASH: Shift.cash_sales_cents += total_cents and recompute expected_drawer_cents; if loyalty: accrue points and recompute tier; settlement_status -> SETTLED; increments Shift.version by 1; increments FuelTransaction.version by 1"]

  - method: POST
    path: "/fuel-transactions/{txnId}/reverse"
    description: "Reverse a settled sale (SETTLED -> REVERSED, payment -> REFUNDED)"
    roles: [CashierAttendant]
    code: 200
    input: []
    output: FuelTransaction
    side_effects: ["Tank.volume_gallons += gallons; if CASH: Shift.cash_sales_cents -= total_cents and recompute expected_drawer_cents; if loyalty: subtract accrued points and recompute tier; settlement_status -> REVERSED; payment_status -> REFUNDED; increments FuelTransaction.version"]

  # ---- StoreTransaction ----
  - method: POST
    path: "/store-transactions"
    description: "Ring up a c-store sale with age-restriction compliance"
    roles: [CashierAttendant]
    code: 201
    input: [station_id, shift_id, line_items, tender, "loyalty_account_id?", "verified_buyer_age?"]
    output: StoreTransaction
    side_effects: ["subtotal/tax/total computed; settlement_status=SETTLED; if CASH: Shift.cash_sales_cents += total_cents and recompute expected_drawer_cents; if loyalty: accrue points and recompute tier; increments Shift.version"]

  - method: GET
    path: "/store-transactions"
    description: "List store transactions, filterable by station, shift, loyalty account"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: ["station_id?", "shift_id?", "loyalty_account_id?", "limit?", "offset?"]
    output: StoreTransaction[]
    side_effects: []

  - method: GET
    path: "/store-transactions/{storeTxnId}"
    description: "Get a store transaction"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: []
    output: StoreTransaction
    side_effects: []

  - method: POST
    path: "/store-transactions/{storeTxnId}/reverse"
    description: "Reverse a store sale (SETTLED -> REVERSED)"
    roles: [CashierAttendant]
    code: 200
    input: []
    output: StoreTransaction
    side_effects: ["if CASH: Shift.cash_sales_cents -= total_cents and recompute expected_drawer_cents; if loyalty: subtract accrued points and recompute tier; settlement_status -> REVERSED; increments Shift.version"]

  # ---- LoyaltyAccount ----
  - method: POST
    path: "/loyalty-accounts"
    description: "Enroll a loyalty member"
    roles: [CashierAttendant, LoyaltyMember]
    code: 201
    input: [station_id, phone, name]
    output: LoyaltyAccount
    side_effects: ["point_balance=0, lifetime_points=0, tier=BRONZE"]

  - method: GET
    path: "/loyalty-accounts"
    description: "List loyalty accounts, filterable by station"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: ["station_id?", "limit?", "offset?"]
    output: LoyaltyAccount[]
    side_effects: []

  - method: GET
    path: "/loyalty-accounts/{loyaltyId}"
    description: "Get a loyalty account"
    roles: [StationManager, CashierAttendant, LoyaltyMember]
    code: 200
    input: []
    output: LoyaltyAccount
    side_effects: []

  - method: POST
    path: "/loyalty-accounts/{loyaltyId}/redeem"
    description: "Redeem points for cents value (member self-service)"
    roles: [LoyaltyMember, CashierAttendant]
    code: 200
    input: [points]
    output: LoyaltyAccount
    side_effects: ["point_balance -= points (floor(points/100)*REDEEM_CENTS value returned); lifetime_points unchanged; increments LoyaltyAccount.version"]

  # ---- CarWashCode ----
  - method: POST
    path: "/car-wash-codes"
    description: "Issue a car-wash code (purchased or earned from a fuel transaction)"
    roles: [CashierAttendant]
    code: 201
    input: [station_id, package, "fuel_transaction_id?", "loyalty_account_id?"]
    output: CarWashCode
    side_effects: ["price_cents computed (0 if earned); code_value minted; status=ISSUED; expires_at = current_utc + CODE_TTL_DAYS"]

  - method: GET
    path: "/car-wash-codes"
    description: "List car-wash codes, filterable by station and fuel transaction"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: ["station_id?", "fuel_transaction_id?", "limit?", "offset?"]
    output: CarWashCode[]
    side_effects: []

  - method: GET
    path: "/car-wash-codes/{codeId}"
    description: "Get a car-wash code"
    roles: [StationManager, CashierAttendant]
    code: 200
    input: []
    output: CarWashCode
    side_effects: []

  - method: POST
    path: "/car-wash-codes/{codeId}/redeem"
    description: "Redeem a code (ISSUED -> REDEEMED; lazily flips EXPIRED if past TTL)"
    roles: [CashierAttendant]
    code: 200
    input: []
    output: CarWashCode
    side_effects: ["if current_utc >= expires_at: status -> EXPIRED and reject ERR_CODE_EXPIRED; else status -> REDEEMED; increments CarWashCode.version"]

  - method: POST
    path: "/car-wash-codes/{codeId}/reissue"
    description: "Reissue an expired code (EXPIRED -> ISSUED)"
    roles: [StationManager]
    code: 200
    input: []
    output: CarWashCode
    side_effects: ["expires_at = current_utc + CODE_TTL_DAYS; status -> ISSUED; increments CarWashCode.version"]

  # ---- MarginReport (ephemeral computed snapshot) ----
  - method: POST
    path: "/margin-reports"
    description: "Compute a fuel-margin report over a window using a cost basis; returns the computed snapshot inline"
    roles: [StationManager]
    code: 201
    input: [station_id, window_start, window_end, "cost_basis?"]
    output: MarginReport
    side_effects: ["gallons_sold, revenue_cents, cogs_cents, margin_cents, margin_pct computed over SETTLED fuel transactions in window"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_SHIFT_OWNER, http: 403, condition: "Acting cashier is not the shift's owner for an owner-only shift op" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or FK body field) does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, illegal enum, or negative numeric" }
  - { id: ERR_AGE_VERIFICATION_FAILED, http: 422, condition: "Age-restricted item present but verified_buyer_age missing or below required min_age" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in the correct state for the requested transition" }
  - { id: ERR_SHIFT_NOT_OPEN, http: 409, condition: "Referenced shift is not OPEN when settling/reversing or posting a cash delivery" }
  - { id: ERR_PAYMENT_NOT_CAPTURED, http: 409, condition: "Fuel transaction payment_status is not CAPTURED at settlement" }
  - { id: ERR_PUMP_UNAVAILABLE, http: 409, condition: "Pump is OUT_OF_SERVICE or its tank is DOWN at authorization" }
  - { id: ERR_TANK_DOWN, http: 409, condition: "Delivery target tank is DOWN at post time" }
  - { id: ERR_TANK_CAPACITY_EXCEEDED, http: 409, condition: "Posting a delivery would push volume_gallons above capacity_gallons" }
  - { id: ERR_NEGATIVE_VOLUME, http: 409, condition: "Voiding a delivery would drive volume_gallons negative" }
  - { id: ERR_CODE_EXPIRED, http: 409, condition: "Car-wash code redemption attempted at/after expires_at" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 409, condition: "Redemption points exceed loyalty point_balance" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_DUPLICATE_GRADE, http: 409, condition: "Fuel grade code already exists for the station" }
  - { id: ERR_DUPLICATE_PUMP, http: 409, condition: "Pump number already exists for the station" }
  - { id: ERR_DUPLICATE_PHONE, http: 409, condition: "Loyalty phone already enrolled at the station" }
  - { id: ERR_VALIDATION, http: 422, condition: "Query parameter out of range (e.g., limit > 100 or < 1)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: StationManager
    description: "Owns pricing, tanks, pumps, deliveries, and reporting; cannot ring sales or run shift drawers."
    identity: "opaque"
    exclusive_operations:
      - "POST /stations — create station"
      - "POST /_clock/set — set business clock"
      - "POST /fuel-grades — create grade"
      - "POST /fuel-grades/{id}/reprice — reprice grade"
      - "POST /tanks — create tank"
      - "POST /tanks/{id}/take-down — take tank down"
      - "POST /tanks/{id}/restore — restore tank"
      - "POST /pumps — create pump"
      - "POST /deliveries — create delivery"
      - "POST /deliveries/{id}/post — post delivery"
      - "POST /deliveries/{id}/reject — reject delivery"
      - "POST /deliveries/{id}/void — void delivery"
      - "POST /car-wash-codes/{id}/reissue — reissue expired code"
      - "POST /margin-reports — compute margin report"
    shared_operations:
      - "GET endpoints across stations, grades, tanks, pumps, deliveries, shifts, transactions, loyalty accounts, car-wash codes"

  - name: CashierAttendant
    description: "Runs the register and the shift drawer; rings fuel/store sales, manages transactions and shift lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /shifts — open shift"
      - "POST /shifts/{id}/drops — record cash drop"
      - "POST /shifts/{id}/begin-count — begin count"
      - "POST /shifts/{id}/close — close shift"
      - "POST /fuel-transactions — authorize fuel sale"
      - "POST /fuel-transactions/{id}/capture — capture"
      - "POST /fuel-transactions/{id}/settle — settle"
      - "POST /fuel-transactions/{id}/reverse — reverse"
      - "POST /store-transactions — ring store sale"
      - "POST /store-transactions/{id}/reverse — reverse store sale"
      - "POST /car-wash-codes — issue code"
      - "POST /car-wash-codes/{id}/redeem — redeem code"
    shared_operations:
      - "POST /loyalty-accounts — enroll member (shared with LoyaltyMember)"
      - "POST /loyalty-accounts/{id}/redeem — redeem points (shared with LoyaltyMember)"
      - "GET endpoints across all collections"

  - name: LoyaltyMember
    description: "A customer acting on their own loyalty account."
    identity: "entity_backed:LoyaltyAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /loyalty-accounts — self-enroll (shared with CashierAttendant)"
      - "POST /loyalty-accounts/{id}/redeem — redeem own points (shared with CashierAttendant)"
      - "GET /stations/{id}, GET /loyalty-accounts/{id} — read own account"
