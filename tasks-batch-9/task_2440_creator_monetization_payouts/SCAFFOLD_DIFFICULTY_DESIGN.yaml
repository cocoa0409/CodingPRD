              as: FinanceOperator
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Tips Flat", creator_share_bps: 5000, platform_fee_bps: 5000, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { tips_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 10000, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
              captures: { ev_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods/${p1_id}/close"
              payload: {}
              as: FinanceOperator
            - call: "GET /monetization/earnings-statements"
              payload: { creator_id: "${cr_id}", period_id: "${p1_id}" }
              as: FinanceOperator
              captures: { s1_id: "$.data[0].id", s1_rate: "$.data[0].withholding_rate_bps", s1_wh: "$.data[0].withholding_cents" }
            - call: "POST /monetization/earnings-statements/${s1_id}/finalize"
              payload: {}
              as: FinanceOperator
              captures: { s1_net: "$.data.net_payable_cents" }
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { pre_avail: "$.data.available_balance_cents", pre_state: "$.data.payout_state" }
          trigger:
            - call: "POST /monetization/payouts"
              payload: { creator_id: "${cr_id}" }
              as: FinanceOperator
          assert:
            - "${s1_rate} == 2400 and ${s1_wh} == 1200 and ${s1_net} == 3800"
            - "${pre_avail} == 3800 and ${pre_state} == ACCRUING (so the state row at priority 37 is satisfied and cannot mask the pair)"
            - "trigger returns HTTP 422 with error_id ERR_TAX_DOCUMENTATION_MISSING"
            - "trigger does NOT return HTTP 422 ERR_BELOW_PAYOUT_THRESHOLD (priority 75 loses to priority 47)"
            - "GET /monetization/payouts?creator_id=${cr_id} returns total_count 0"
            - "EarningsStatement.${s1_id}.status == FINALIZED and payout_id == null and withholding_variant == FINAL"
            - "GET /monetization/creators/${cr_id}/ledger-entries returns 2 rows: ACCRUAL +5000 then WITHHOLDING -1200; no WITHHOLDING_TRUE_UP row exists"
            - "Creator.${cr_id}.ledger_balance_cents == 3800"

      - name: revenue_event_content_mismatch_referential_outranks_no_open_period_temporal
        error_category_pair: "business_referential vs business_temporal"
        grounds:
          - "validations.priority_49"
          - "validations.priority_71"
          - errors.ERR_CONTENT_CREATOR_MISMATCH
          - errors.ERR_NO_OPEN_PERIOD_FOR_EVENT
          - entities.ContentItem.fields.creator_id
        distinguishing_aspect: |
          A fourth distinct category pair, both 422s on the same POST
          /monetization/revenue-events call: the referenced ContentItem belongs
          to a different Creator (business_referential row, priority 49) and the
          occurred_at 2026-09-15T00:00:00Z falls outside every OPEN period's
          half-open window (business_temporal row, priority 71). The
          referential row's lower priority number must win, so the response is
          ERR_CONTENT_CREATOR_MISMATCH.
        test_recipe:
          setup:
            - "Two Creators, cA and cB, each follower_count 10000 and watch_time_minutes_365d 240000, both evaluated to ELIGIBLE."
            - "One ContentItem owned by cB, published 2026-07-01T00:00:00Z, still GREEN / MONETIZED."
            - "One ACTIVE ADVERTISING RevenueProduct (8000/2000, min_payable_cents 0)."
            - "Exactly one OPEN EarningsPeriod [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z); no period covers 2026-09-15T00:00:00Z."
            - "No Investigation exists, so the business_safety accrual row at priority 48 is satisfied and cannot mask the pair."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ora A", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Pax B", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cb_id: "$.data.id" }
            - call: "POST /monetization/creators/${ca_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/creators/${cb_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/content-items"
              payload: { creator_id: "${cb_id}", title: "Pax Only Clip", published_at: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ci_b_id: "$.data.id" }
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "ADVERTISING", name: "Ads Standard", creator_share_bps: 8000, platform_fee_bps: 2000, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { ads_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${ca_id}", product_id: "${ads_id}", content_item_id: "${ci_b_id}", gross_amount_cents: 10000, occurred_at: "2026-09-15T00:00:00Z" }
              as: FinanceOperator
          assert:
            - "trigger returns HTTP 422 with error_id ERR_CONTENT_CREATOR_MISMATCH"
            - "trigger does NOT return HTTP 422 ERR_NO_OPEN_PERIOD_FOR_EVENT (priority 71 loses to priority 49)"
            - "GET /monetization/revenue-events?creator_id=${ca_id} returns total_count 0"
            - "GET /monetization/creators/${ca_id}/ledger-entries returns total_count 0"
            - "ContentItem.${ci_b_id}.creator_id == ${cb_id} (unchanged)"
            - "EarningsPeriod.${p1_id}.status == OPEN and statement_count == 0"

      - name: allocate_disbursed_fund_state_outranks_stale_fund_version_occ
        error_category_pair: "state (lifecycle) vs state (optimistic concurrency)"
        grounds:
          - "validations.priority_40"
          - "validations.priority_42"
          - errors.ERR_FUND_NOT_ALLOCATABLE
          - errors.ERR_STALE_FUND_VERSION
          - concurrency_rules.fund-allocate-stale-fund
          - "state_machines.CreatorFund.transitions[ALLOCATED -> DISBURSED]"
        distinguishing_aspect: |
          The remaining pinned pair, and the only one where the OCC row is the
          loser: 1.4 deliberately places the optimistic-concurrency row at
          priority 42, AFTER the lifecycle row at priority 40. A DISBURSED fund
          re-allocated with the version read just after the first allocate
          (2, now stale because disburse advanced it to 3) violates both, and
          the caller must receive 409 ERR_FUND_NOT_ALLOCATABLE rather than 412
          ERR_STALE_FUND_VERSION - "your token is old" must never mask "this
          fund is finished".
        test_recipe:
          setup:
            - "One US Creator, follower_count 10000, watch_time_minutes_365d 240000, evaluated to ELIGIBLE."
            - "One OPEN EarningsPeriod [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z)."
            - "One CreatorFund on that period, total_pool_cents 100000, methodology PRO_RATA_WATCH_TIME, min_watch_time_minutes 0, created at version 1."
            - "The fund was allocated once: the single-member pool takes floor(100000 * wt / wt) == 100000, capped by the default max_allocation_cents 2000000, remainder 0; status ALLOCATED, allocation_run_count 1, recipient_count 1, version 2 - and version 2 is the value the client cached."
            - "The fund was then disbursed: status DISBURSED, disbursed_at stamped, Creator.fund_credit_balance_cents 100000, one FUND_CREDIT LedgerEntry of +100000, version 3."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Quin Fund", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/creator-funds"
              payload: { name: "Solo Fund", period_id: "${p1_id}", total_pool_cents: 100000, methodology: "PRO_RATA_WATCH_TIME", min_watch_time_minutes: 0 }
              as: PlatformAdmin
              captures: { f_id: "$.data.id", f_v1: "$.data.version" }
            - call: "POST /monetization/creator-funds/${f_id}/allocate"
              payload: { expected_fund_version: "${f_v1}" }
              as: FinanceOperator
              captures: { f_v2: "$.data.version", f_alloc: "$.data.allocated_cents", f_rem: "$.data.unallocated_remainder_cents" }
            - call: "POST /monetization/creator-funds/${f_id}/disburse"
              payload: {}
              as: FinanceOperator
              captures: { f_v3: "$.data.version", f_status: "$.data.status" }
          trigger:
            - call: "POST /monetization/creator-funds/${f_id}/allocate"
              payload: { expected_fund_version: "${f_v2}" }
              as: FinanceOperator
          assert:
            - "${f_alloc} == 100000 and ${f_rem} == 0 and ${f_v2} == ${f_v1} + 1"
            - "${f_status} == DISBURSED and ${f_v3} == ${f_v2} + 1 (so ${f_v2} really is stale at trigger time)"
            - "trigger returns HTTP 409 with error_id ERR_FUND_NOT_ALLOCATABLE"
            - "trigger does NOT return HTTP 412 ERR_STALE_FUND_VERSION (the OCC row sits at priority 42, after the lifecycle row at priority 40)"
            - "CreatorFund.${f_id}.status == DISBURSED and allocation_run_count == 1 and recipient_count == 1 and allocated_cents == 100000 and version == ${f_v3}"
            - "GET /monetization/creator-funds/${f_id}/fund-allocations returns exactly one row with status ACTIVE, rank 1, amount_cents 100000 and void_reason null"
            - "Creator.${cr_id}.fund_credit_balance_cents == 100000 and available_balance_cents == 100000"
            - "GET /monetization/creators/${cr_id}/ledger-entries?entry_type=FUND_CREDIT returns total_count 1 with amount_cents == 100000"

  - rule_id: boundary_precision_check
    instances:
      - name: eligibility_follower_and_watch_minimums_are_inclusive
        metric: "Creator.follower_count vs MIN_FOLLOWERS and Creator.watch_time_minutes_365d vs MIN_WATCH_MINUTES_365D"
        endpoint: "POST /monetization/creators/{creator_id}/evaluate"
        grounds:
          - calculations.eligibility_evaluation
          - entities.Creator.fields.follower_count
          - entities.Creator.fields.watch_time_minutes_365d
          - entities.Creator.fields.last_evaluation_failed_criteria
          - "endpoints.PATCH /monetization/creators/{creator_id}/metrics"
        distinguishing_aspect: |
          Both metric gates use >=, so MIN_FOLLOWERS 10000 and
          MIN_WATCH_MINUTES_365D 240000 PASS at equality and fail only one unit
          below. 9999 followers with exactly 240000 watch minutes yields
          INELIGIBLE with exactly ["FOLLOWER_MINIMUM"]; raising the count to
          exactly 10000 via PATCH metrics does NOT itself re-evaluate, and only
          the next evaluate returns ELIGIBLE with an empty criteria array. The
          companion creator one unit below on both metrics pins the declared
          criteria order FOLLOWER_MINIMUM then WATCH_TIME_MINIMUM.
        test_recipe:
          setup:
            - "Creator A created with follower_count 9999 and watch_time_minutes_365d 240000 (one below the follower bound, exactly on the watch bound), eligibility_status PENDING_REVIEW, evaluation_count 0."
            - "Creator B created with follower_count 9999 and watch_time_minutes_365d 239999 (one below both bounds)."
            - "Neither creator has any strike, so the policy short-circuit never fires and the metric gate is always the one evaluated."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Rae Edge", country_code: "GB", follower_count: 9999, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Sam Edge", country_code: "GB", follower_count: 9999, watch_time_minutes_365d: 239999 }
              as: PlatformAdmin
              captures: { cb_id: "$.data.id" }
          trigger:
            - call: "POST /monetization/creators/${ca_id}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { a1_status: "$.data.eligibility_status", a1_crit: "$.data.last_evaluation_failed_criteria", a1_evals: "$.data.evaluation_count" }
            - call: "PATCH /monetization/creators/${ca_id}/metrics"
              payload: { follower_count: 10000 }
              as: PlatformAdmin
              captures: { a2_status: "$.data.eligibility_status", a2_followers: "$.data.follower_count", a2_evals: "$.data.evaluation_count" }
            - call: "POST /monetization/creators/${ca_id}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { a3_status: "$.data.eligibility_status", a3_crit: "$.data.last_evaluation_failed_criteria", a3_evals: "$.data.evaluation_count" }
            - call: "POST /monetization/creators/${cb_id}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { b1_status: "$.data.eligibility_status", b1_crit: "$.data.last_evaluation_failed_criteria" }
          assert:
            - "${a1_status} == INELIGIBLE and ${a1_crit} == ['FOLLOWER_MINIMUM'] and ${a1_evals} == 1 (watch_time exactly 240000 passes)"
            - "${a2_followers} == 10000 and ${a2_status} == INELIGIBLE and ${a2_evals} == 1 (PATCH metrics never re-evaluates)"
            - "${a3_status} == ELIGIBLE and ${a3_crit} == [] and ${a3_evals} == 2 (follower_count exactly 10000 passes)"
            - "Creator.${ca_id}.last_evaluated_at == '2026-08-01T00:00:00.000Z'"
            - "${b1_status} == INELIGIBLE and ${b1_crit} == ['FOLLOWER_MINIMUM', 'WATCH_TIME_MINIMUM'] (declared order, both elements present)"
            - "Creator.${cb_id}.evaluation_count == 1"

      - name: revenue_event_min_payable_is_strictly_below
        metric: "RevenueEvent computed share vs RevenueProduct.min_payable_cents"
        endpoint: "POST /monetization/revenue-events"
        grounds:
          - calculations.revenue_share_split
          - entities.RevenueProduct.fields.min_payable_cents
          - entities.RevenueEvent.fields.status
          - entities.RevenueEvent.fields.creator_share_cents
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          A different metric on a different endpoint: the minimum-payable gate is
          "share < min_payable_cents", strictly below. With
          min_payable_cents 250, a share of exactly 250 ACCRUES and writes an
          ACCRUAL LedgerEntry of +250, while a share of 249 becomes
          BELOW_MINIMUM with creator_share_cents forced to 0 and - because the
          ledger delta is exactly zero - NO LedgerEntry at all. The one-cent
          difference therefore changes both a status and the cardinality of the
          ledger.
        test_recipe:
          setup:
            - "One GB Creator (follower_count 10000, watch_time_minutes_365d 240000) evaluated to ELIGIBLE, lifetime_paid_cents 0 so the tier bonus is 0 bps."
            - "One TIPS RevenueProduct (suitability_sensitive false) with creator_share_bps 5000, platform_fee_bps 5000 and min_payable_cents 250."
            - "One OPEN EarningsPeriod [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z) and no Investigation."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Tao Min", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Tips Gated", creator_share_bps: 5000, platform_fee_bps: 5000, min_payable_cents: 250 }
              as: PlatformAdmin
              captures: { tips_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 500, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
              captures: { at_id: "$.data.id", at_status: "$.data.status", at_share: "$.data.creator_share_cents", at_bps: "$.data.effective_share_bps" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 498, occurred_at: "2026-07-06T00:00:00Z" }
              as: FinanceOperator
              captures: { be_id: "$.data.id", be_status: "$.data.status", be_share: "$.data.creator_share_cents", be_bps: "$.data.effective_share_bps" }
          assert:
            - "${at_bps} == 5000 and ${at_share} == 250 and ${at_status} == ACCRUED (250 is not strictly below 250)"
            - "${be_bps} == 5000 and ${be_share} == 0 and ${be_status} == BELOW_MINIMUM (ROUND_HALF_UP(498*5000/10000) == 249)"
            - "GET /monetization/creators/${cr_id}/ledger-entries returns total_count 1"
            - "that single row has entry_type == ACCRUAL, amount_cents == 250, balance_after_cents == 250, source_entity == REVENUE_EVENT and source_id == ${at_id}"
            - "GET /monetization/creators/${cr_id}/ledger-entries?source_id=${be_id} returns total_count 0 (a zero delta writes nothing)"
            - "Creator.${cr_id}.ledger_balance_cents == 250"
            - "RevenueEvent.${be_id}.period_id == ${p1_id} and gross_amount_cents == 498 (the row still exists; only the payable amount is suppressed)"

      - name: fund_candidate_pool_empty_at_one_minute_above_watch_floor
        metric: "candidate pool cardinality vs CreatorFund.min_watch_time_minutes"
        endpoint: "POST /monetization/creator-funds/{fund_id}/allocate"
        grounds:
          - calculations.fund_allocation
          - "validations.priority_78"
          - errors.ERR_FUND_POOL_EMPTY
          - entities.CreatorFund.fields.min_watch_time_minutes
          - entities.CreatorFund.fields.allocation_run_count
          - entities.CreatorFund.fields.status
        distinguishing_aspect: |
          The zero-count edge rather than a value threshold, and on a third
          endpoint: the pool filter uses watch_time_minutes_365d >=
          min_watch_time_minutes, so a creator with exactly 240000 minutes is
          EXCLUDED at a floor of 240001 (pool cardinality 0 -> 422
          ERR_FUND_POOL_EMPTY with the fund left untouched in DRAFT and
          allocation_run_count still 0) and INCLUDED at a floor of exactly
          240000 (pool cardinality 1 -> the whole pool allocated). One minute of
          watch time flips a whole request between total failure and total
          success.
        test_recipe:
          setup:
            - "One US Creator with follower_count 10000 and watch_time_minutes_365d exactly 240000, evaluated so eligibility_status == ELIGIBLE."
            - "Two OPEN abutting EarningsPeriods, so two live CreatorFunds may coexist."
            - "Fund HIGH on period 1: total_pool_cents 100000, PRO_RATA_WATCH_TIME, min_watch_time_minutes 240001, status DRAFT, version 1."
            - "Fund EXACT on period 2: total_pool_cents 100000, PRO_RATA_WATCH_TIME, min_watch_time_minutes 240000, status DRAFT, version 1."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Uma Floor", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { cr_status: "$.data.eligibility_status" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p2_id: "$.data.id" }
            - call: "POST /monetization/creator-funds"
              payload: { name: "Floor High", period_id: "${p1_id}", total_pool_cents: 100000, methodology: "PRO_RATA_WATCH_TIME", min_watch_time_minutes: 240001 }
              as: PlatformAdmin
              captures: { fh_id: "$.data.id", fh_v: "$.data.version" }
            - call: "POST /monetization/creator-funds"
              payload: { name: "Floor Exact", period_id: "${p2_id}", total_pool_cents: 100000, methodology: "PRO_RATA_WATCH_TIME", min_watch_time_minutes: 240000 }
              as: PlatformAdmin
              captures: { fe_id: "$.data.id", fe_v: "$.data.version" }
          trigger:
            - call: "POST /monetization/creator-funds/${fh_id}/allocate"
              payload: { expected_fund_version: "${fh_v}" }
              as: FinanceOperator
            - call: "POST /monetization/creator-funds/${fe_id}/allocate"
              payload: { expected_fund_version: "${fe_v}" }
              as: FinanceOperator
              captures: { fe_alloc: "$.data.allocated_cents", fe_rem: "$.data.unallocated_remainder_cents", fe_recips: "$.data.recipient_count", fe_status: "$.data.status" }
          assert:
            - "${cr_status} == ELIGIBLE"
            - "trigger step 1 returns HTTP 422 with error_id ERR_FUND_POOL_EMPTY"
            - "CreatorFund.${fh_id}.status == DRAFT and allocation_run_count == 0 and allocated_cents == 0 and unallocated_remainder_cents == 0 and recipient_count == 0 and version == ${fh_v}"
            - "GET /monetization/creator-funds/${fh_id}/fund-allocations returns total_count 0"
            - "trigger step 2 returns HTTP 200 with ${fe_status} == ALLOCATED, ${fe_recips} == 1, ${fe_alloc} == 100000, ${fe_rem} == 0"
            - "GET /monetization/creator-funds/${fe_id}/fund-allocations returns exactly one ACTIVE row with rank 1, amount_cents 100000 and watch_time_minutes_at_allocation 240000"
            - "Creator.${cr_id}.fund_credit_balance_cents == 0 (allocation alone credits nothing)"
            - "GET /monetization/creators/${cr_id}/ledger-entries returns total_count 0"

      - name: treaty_rate_floor_is_a_lower_bound_not_an_override
        metric: "TaxProfile.treaty_rate_bps vs TREATY_MIN_RATE_BPS[country_code]"
        endpoint: "POST /monetization/tax-profiles/{tax_profile_id}/verify"
        grounds:
          - calculations.withholding_rate_resolution
          - entities.TaxProfile.fields.treaty_rate_bps
          - entities.TaxProfile.fields.withholding_rate_bps
          - entities.TaxProfile.fields.tin_provided
          - entities.TaxProfile.fields.treaty_claimed
          - "state_machines.TaxProfile.transitions[SUBMITTED -> VERIFIED]"
        distinguishing_aspect: |
          A fourth metric on a fourth endpoint: the treaty branch resolves to
          max(treaty_rate_bps, TREATY_MIN_RATE_BPS[country]), so a claim BELOW
          the floor is silently lifted (IN, claim 1000 -> 1500) while a claim
          exactly AT the floor is honoured unchanged (JP, claim 1000 -> 1000).
          Two neighbouring guards are pinned in the same recipe: a country whose
          floor is null cannot use a treaty at all (BR, claim 500 -> the
          NRA_DEFAULT_BPS 3000), and a treaty claim without a TIN is discarded
          before the floor is even consulted (DE, floor 0, claim 500,
          tin_provided false -> 3000, not 500 and not 0).
        test_recipe:
          setup:
            - "Four Creators, one each in IN, JP, BR and DE (follower_count 10000, watch_time_minutes_365d 240000); their eligibility is irrelevant to rate resolution and is left at PENDING_REVIEW."
            - "Each has exactly one W8BEN TaxProfile whose country_code matches its creator, in state SUBMITTED, with withholding_rate_bps still at the BACKUP_WITHHOLDING_BPS 2400 placeholder written at create time."
            - "IN profile: tin_provided true, treaty_claimed true, treaty_rate_bps 1000 (below the 1500 floor)."
            - "JP profile: tin_provided true, treaty_claimed true, treaty_rate_bps 1000 (exactly the 1000 floor)."
            - "BR profile: tin_provided true, treaty_claimed true, treaty_rate_bps 500 (BR has a null floor)."
            - "DE profile: tin_provided false, treaty_claimed true, treaty_rate_bps 500 (DE floor is 0)."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Vik IN", country_code: "IN", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { in_id: "$.data.id", in_v: "$.data.version" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Wen JP", country_code: "JP", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { jp_id: "$.data.id", jp_v: "$.data.version" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Xan BR", country_code: "BR", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id", br_v: "$.data.version" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Yaz DE", country_code: "DE", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { de_id: "$.data.id", de_v: "$.data.version" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${in_id}", form_type: "W8BEN", country_code: "IN", tin_provided: true, treaty_claimed: true, treaty_rate_bps: 1000, expected_creator_version: "${in_v}" }
              as: FinanceOperator
              captures: { in_tp: "$.data.id", in_draft_rate: "$.data.withholding_rate_bps" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${jp_id}", form_type: "W8BEN", country_code: "JP", tin_provided: true, treaty_claimed: true, treaty_rate_bps: 1000, expected_creator_version: "${jp_v}" }
              as: FinanceOperator
              captures: { jp_tp: "$.data.id" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${br_id}", form_type: "W8BEN", country_code: "BR", tin_provided: true, treaty_claimed: true, treaty_rate_bps: 500, expected_creator_version: "${br_v}" }
              as: FinanceOperator
              captures: { br_tp: "$.data.id" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${de_id}", form_type: "W8BEN", country_code: "DE", tin_provided: false, treaty_claimed: true, treaty_rate_bps: 500, expected_creator_version: "${de_v}" }
              as: FinanceOperator
              captures: { de_tp: "$.data.id" }
            - call: "POST /monetization/tax-profiles/${in_tp}/submit"
              payload: {}
              as: Creator
              as_user_id: "${in_id}"
            - call: "POST /monetization/tax-profiles/${jp_tp}/submit"
              payload: {}
              as: Creator
              as_user_id: "${jp_id}"
            - call: "POST /monetization/tax-profiles/${br_tp}/submit"
              payload: {}
              as: Creator
              as_user_id: "${br_id}"
            - call: "POST /monetization/tax-profiles/${de_tp}/submit"
              payload: {}
              as: Creator
              as_user_id: "${de_id}"
          trigger:
            - call: "POST /monetization/tax-profiles/${in_tp}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceOperator
              captures: { in_rate: "$.data.withholding_rate_bps", in_status: "$.data.status", in_expires: "$.data.expires_at" }
            - call: "POST /monetization/tax-profiles/${jp_tp}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceOperator
              captures: { jp_rate: "$.data.withholding_rate_bps" }
            - call: "POST /monetization/tax-profiles/${br_tp}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceOperator
              captures: { br_rate: "$.data.withholding_rate_bps" }
            - call: "POST /monetization/tax-profiles/${de_tp}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceOperator
              captures: { de_rate: "$.data.withholding_rate_bps" }
          assert:
            - "${in_draft_rate} == 2400 (a non-VERIFIED profile always carries BACKUP_WITHHOLDING_BPS)"
            - "${in_rate} == 1500 (max(1000, TREATY_MIN_RATE_BPS['IN'] == 1500) lifted the claim)"
            - "${in_rate} != 1000 (the claimed rate is not honoured below the floor)"
            - "${jp_rate} == 1000 (max(1000, TREATY_MIN_RATE_BPS['JP'] == 1000); equality is honoured unchanged)"
            - "${br_rate} == 3000 (TREATY_MIN_RATE_BPS['BR'] is null, so the treaty branch falls back to NRA_DEFAULT_BPS)"
            - "${br_rate} != 500"
            - "${de_rate} == 3000 (tin_provided false discards the treaty claim before the floor is consulted)"
            - "${de_rate} != 0 and ${de_rate} != 500 (DE's floor of 0 is never reached)"
            - "${in_status} == VERIFIED and ${in_expires} == '2029-07-31T00:00:00.000Z' (verified_at 2026-08-01T00:00:00Z + TAX_FORM_VALIDITY_DAYS 1095)"
            - "TaxProfile.${in_tp}.treaty_rate_bps == 1000 (the claimed value is preserved; only withholding_rate_bps is resolved)"
            - "TaxProfile.${in_tp}.verified_at == '2026-08-01T00:00:00.000Z' and rejection_reason == null"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: revenue_event_gated_by_creator_eligibility_dimension
        entity_pair: "RevenueEvent depends on Creator.eligibility_status"
        grounds:
          - validations.priority_38
          - errors.ERR_CREATOR_NOT_ELIGIBLE
          - entities.RevenueEvent.fields.creator_id
          - entities.Creator.fields.eligibility_status
          - "state_machines.Creator.transitions[eligibility_status=PENDING_REVIEW -> eligibility_status=ELIGIBLE]"
          - "state_machines.Creator.transitions[eligibility_status IN {PENDING_REVIEW, ELIGIBLE, INELIGIBLE} -> eligibility_status=SUSPENDED]"
          - calculations.eligibility_evaluation
        distinguishing_aspect: |
          Creating a RevenueEvent is legal or illegal purely as a function of a
          field on a DIFFERENT entity: the same identical POST body is rejected
          409 ERR_CREATOR_NOT_ELIGIBLE while the Creator sits at its birth state
          PENDING_REVIEW, accepted once an unrelated evaluate call moves that
          creator to ELIGIBLE, and rejected again after a PolicyReviewer strike
          moves it to SUSPENDED - with nothing about the RevenueEvent payload,
          the RevenueProduct or the EarningsPeriod changing between the three
          attempts.
        test_recipe:
          setup:
            - "One GB Creator with follower_count 10000 and watch_time_minutes_365d 240000, freshly created so eligibility_status == PENDING_REVIEW and evaluation_count == 0."
            - "One ACTIVE TIPS RevenueProduct (creator_share_bps 5000, platform_fee_bps 5000, min_payable_cents 0)."
            - "One OPEN EarningsPeriod [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z) covering every occurred_at used below, and no Investigation, so priorities 39, 48 and 71 are all satisfied throughout."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Zed Gate", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id", birth_status: "$.data.eligibility_status" }
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Tips Flat", creator_share_bps: 5000, platform_fee_bps: 5000, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { tips_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 10000, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { eval_status: "$.data.eligibility_status" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 10000, occurred_at: "2026-07-06T00:00:00Z" }
              as: FinanceOperator
              captures: { ok_ev_id: "$.data.id", ok_share: "$.data.creator_share_cents" }
            - call: "POST /monetization/creators/${cr_id}/policy-strikes"
              payload: { reason: "Monetising other creators' uploads." }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
              captures: { strike_status: "$.data.eligibility_status" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 10000, occurred_at: "2026-07-07T00:00:00Z" }
              as: FinanceOperator
          assert:
            - "${birth_status} == PENDING_REVIEW"
            - "trigger step 1 returns HTTP 409 with error_id ERR_CREATOR_NOT_ELIGIBLE"
            - "${eval_status} == ELIGIBLE"
            - "trigger step 3 returns HTTP 201 with ${ok_share} == 5000 and RevenueEvent.${ok_ev_id}.status == ACCRUED"
            - "${strike_status} == SUSPENDED"
            - "trigger step 5 returns HTTP 409 with error_id ERR_CREATOR_NOT_ELIGIBLE"
            - "GET /monetization/revenue-events?creator_id=${cr_id} returns total_count 1 (only the middle attempt persisted)"
            - "Creator.${cr_id}.ledger_balance_cents == 5000 and GET /monetization/creators/${cr_id}/ledger-entries returns total_count 1"
            - "EarningsPeriod.${p1_id}.status == OPEN and statement_count == 0"

      - name: payout_submit_gated_by_creator_hold_from_investigation
        entity_pair: "Payout depends on Creator.payout_state, which an Investigation drives"
        grounds:
          - validations.priority_33
          - errors.ERR_PAYOUT_HELD
          - calculations.payout_state_resolution
          - entities.Creator.fields.payout_state
          - entities.Creator.fields.held_cents
          - entities.Investigation.fields.hold_payouts
          - entities.Investigation.fields.hold_amount_cents
          - "state_machines.Creator.transitions[payout_state=ACCRUING -> payout_state=HOLD]"
          - "state_machines.Creator.transitions[payout_state=HOLD -> payout_state IN {ACCRUING, PAYOUT_IN_FLIGHT}]"
          - "state_machines.Investigation.transitions[OPEN -> CLEARED]"
          - "state_machines.Payout.transitions[PENDING -> PROCESSING]"
        distinguishing_aspect: |
          A different entity pair, and a dependency that is transitive through a
          third entity: whether Payout.submit succeeds depends on
          Creator.payout_state, which payout_state_resolution derives from the
          existence of an OPEN Investigation with hold_payouts true. Because
          HOLD strictly outranks PAYOUT_IN_FLIGHT in that ladder, opening the
          investigation AFTER the Payout already exists freezes an in-flight
          Payout in PENDING (409 ERR_PAYOUT_HELD), and clearing the
          investigation - an operation on the Investigation, not the Payout -
          drops the creator back to PAYOUT_IN_FLIGHT and makes the identical
          submit succeed.
        test_recipe:
          setup:
            - "One US Creator, payout_method BANK_TRANSFER, follower_count 10000, watch_time_minutes_365d 240000, evaluated to ELIGIBLE, with a VERIFIED W9 TaxProfile (tin_provided true) so the resolved withholding rate is 0 bps."
            - "A TIPS RevenueProduct (5000/5000, min_payable_cents 0) accrued one event of gross 40000 on 2026-07-05, creator_share_cents 20000."
            - "Period 2026-07 is CLOSED and its statement FINALIZED with net_payable_cents 20000."
            - "A Payout was then created: state PENDING, payable_before_fee_cents 20000, fee_cents 200, amount_cents 19800, the statement attached, Creator.payout_state PAYOUT_IN_FLIGHT and available_balance_cents 0."
            - "PolicyReviewer reviewer-r1 then opened an Investigation with hold_payouts true over [2026-07-01T00:00:00Z, 2026-07-31T23:59:59Z]; because the statement was already attached, hold_amount_cents snapshotted as 0, and payout_state_resolution moved the creator from PAYOUT_IN_FLIGHT to the strictly higher-ranked HOLD."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Abe Held", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 240000, payout_method: "BANK_TRANSFER" }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { cr_v2: "$.data.version" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr_id}", form_type: "W9", country_code: "US", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v2}" }
              as: FinanceOperator
              captures: { tp_id: "$.data.id" }
            - call: "POST /monetization/tax-profiles/${tp_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${cr_id}"
            - call: "POST /monetization/tax-profiles/${tp_id}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceOperator
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Tips Flat", creator_share_bps: 5000, platform_fee_bps: 5000, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { tips_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 40000, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
            - call: "POST /monetization/earnings-periods/${p1_id}/close"
              payload: {}
              as: FinanceOperator
            - call: "GET /monetization/earnings-statements"
              payload: { creator_id: "${cr_id}", period_id: "${p1_id}" }
              as: FinanceOperator
              captures: { s1_id: "$.data[0].id" }
            - call: "POST /monetization/earnings-statements/${s1_id}/finalize"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/payouts"
              payload: { creator_id: "${cr_id}" }
              as: FinanceOperator
              captures: { po_id: "$.data.id", po_amount: "$.data.amount_cents" }
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { state_before_inv: "$.data.payout_state" }
            - call: "POST /monetization/investigations"
              payload: { creator_id: "${cr_id}", scope: "Advertiser complaint about July tips.", violation_window_start: "2026-07-01T00:00:00Z", violation_window_end: "2026-07-31T23:59:59Z", hold_payouts: true }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
              captures: { inv_id: "$.data.id", inv_hold: "$.data.hold_amount_cents" }
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { state_after_inv: "$.data.payout_state" }
          trigger:
            - call: "POST /monetization/payouts/${po_id}/submit"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/investigations/${inv_id}/clear"
              payload: { finding: "Complaint withdrawn; tips are legitimate." }
              as: PolicyReviewer
              as_user_id: "reviewer-r2"
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { state_after_clear: "$.data.payout_state", elig_after_clear: "$.data.eligibility_status" }
            - call: "POST /monetization/payouts/${po_id}/submit"
              payload: {}
              as: FinanceOperator
              captures: { po_state_final: "$.data.state", po_submitted: "$.data.submitted_at" }
          assert:
            - "${po_amount} == 19800 and ${state_before_inv} == PAYOUT_IN_FLIGHT"
            - "${inv_hold} == 0 (available_balance_cents was already 0 because the statement was attached)"
            - "${state_after_inv} == HOLD (HOLD strictly outranks PAYOUT_IN_FLIGHT in payout_state_resolution)"
            - "trigger step 1 returns HTTP 409 with error_id ERR_PAYOUT_HELD"
            - "after trigger step 1, Payout.${po_id}.state == PENDING and submitted_at == null"
            - "trigger step 2 returns HTTP 200 with Investigation.${inv_id}.state == CLEARED, resolved_by_user_id == 'reviewer-r2' and clawback_base_cents == 0"
            - "${state_after_clear} == PAYOUT_IN_FLIGHT (the PENDING Payout is now the highest-ranked clause)"
            - "${elig_after_clear} == ELIGIBLE and Creator.${cr_id}.active_strike_count == 0 (clearing issues no strike)"
            - "trigger step 4 returns HTTP 200 with ${po_state_final} == PROCESSING and ${po_submitted} == '2026-08-01T00:00:00.000Z'"
            - "Creator.${cr_id}.held_cents == 0 and outstanding_clawback_cents == 0 and ledger_balance_cents == 0"
            - "GET /monetization/creators/${cr_id}/ledger-entries returns 3 rows: ACCRUAL +20000, PAYOUT_DEBIT -19800, PAYOUT_FEE -200 (neither the rejected submit nor the clear wrote a ledger entry)"

      - name: period_finalization_derived_from_children_then_blocks_fund_creation
        entity_pair: "EarningsPeriod depends on all its child EarningsStatements; CreatorFund then depends on EarningsPeriod.status"
        grounds:
          - "state_machines.EarningsPeriod.transitions[CLOSED -> FINALIZED]"
          - entities.EarningsPeriod.fields.statement_count
          - entities.EarningsPeriod.fields.finalized_statement_count
          - entities.EarningsPeriod.fields.status
          - "state_machines.EarningsStatement.transitions[PROVISIONAL -> FINALIZED]"
          - validations.priority_63
          - errors.ERR_FUND_PERIOD_FINALIZED
          - entities.CreatorFund.fields.period_id
          - calculations.statement_withholding
        distinguishing_aspect: |
          A third entity pair, and the only dependency in this scaffold that runs
          upward from children to parent and then outward again: the parent
          EarningsPeriod cannot be moved to FINALIZED by any endpoint of its own
          - it flips only when finalized_statement_count reaches statement_count,
          so finalizing the FIRST of two child statements leaves the period in
          CLOSED and finalizing the SECOND flips it. That derived parent state
          then becomes a precondition for a fourth entity: creating a CreatorFund
          against the now-FINALIZED period is rejected 409
          ERR_FUND_PERIOD_FINALIZED, an outcome that no single call in the chain
          touched directly.
        test_recipe:
          setup:
            - "Two GB Creators c1 then c2 (follower_count 10000, watch_time_minutes_365d 240000), both evaluated to ELIGIBLE, neither holding any TaxProfile, so both resolve to BACKUP_WITHHOLDING_BPS 2400."
            - "One TIPS RevenueProduct (5000/5000, min_payable_cents 0)."
            - "One EarningsPeriod [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z) with one ACCRUED event per creator: c1 gross 10000 -> creator_share_cents 5000, c2 gross 20000 -> creator_share_cents 10000."
            - "The period has been CLOSED, creating statements in Creator.created_at ASC order: S1 for c1 (withholding_cents ROUND_HALF_UP(5000*2400/10000) == 1200, net_payable_cents 3800) and S2 for c2 (withholding_cents 2400, net_payable_cents 7600); statement_count == 2, finalized_statement_count == 0, status CLOSED."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Bea One", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { c1_id: "$.data.id" }
            - call: "POST /monetization/creators"
              payload: { display_name: "Cal Two", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { c2_id: "$.data.id" }
            - call: "POST /monetization/creators/${c1_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/creators/${c2_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Tips Flat", creator_share_bps: 5000, platform_fee_bps: 5000, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { tips_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${c1_id}", product_id: "${tips_id}", gross_amount_cents: 10000, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${c2_id}", product_id: "${tips_id}", gross_amount_cents: 20000, occurred_at: "2026-07-06T00:00:00Z" }
              as: FinanceOperator
            - call: "POST /monetization/earnings-periods/${p1_id}/close"
              payload: {}
              as: FinanceOperator
              captures: { closed_status: "$.data.status", closed_count: "$.data.statement_count", closed_fin: "$.data.finalized_statement_count" }
            - call: "GET /monetization/earnings-statements"
              payload: { period_id: "${p1_id}", creator_id: "${c1_id}" }
              as: FinanceOperator
              captures: { s1_id: "$.data[0].id", s1_net: "$.data[0].net_payable_cents" }
            - call: "GET /monetization/earnings-statements"
              payload: { period_id: "${p1_id}", creator_id: "${c2_id}" }
              as: FinanceOperator
              captures: { s2_id: "$.data[0].id", s2_net: "$.data[0].net_payable_cents" }
          trigger:
            - call: "POST /monetization/earnings-statements/${s1_id}/finalize"
              payload: {}
              as: FinanceOperator
            - call: "GET /monetization/earnings-periods/${p1_id}"
              payload: {}
              as: FinanceOperator
              captures: { mid_status: "$.data.status", mid_fin: "$.data.finalized_statement_count" }
            - call: "POST /monetization/earnings-statements/${s2_id}/finalize"
              payload: {}
              as: FinanceOperator
            - call: "GET /monetization/earnings-periods/${p1_id}"
              payload: {}
              as: FinanceOperator
              captures: { end_status: "$.data.status", end_fin: "$.data.finalized_statement_count" }
            - call: "POST /monetization/creator-funds"
              payload: { name: "Too Late Fund", period_id: "${p1_id}", total_pool_cents: 100000, methodology: "PRO_RATA_WATCH_TIME", min_watch_time_minutes: 0 }
              as: PlatformAdmin
          assert:
            - "${closed_status} == CLOSED and ${closed_count} == 2 and ${closed_fin} == 0"
            - "${s1_net} == 3800 and ${s2_net} == 7600"
            - "${mid_status} == CLOSED and ${mid_fin} == 1 (1 of 2 finalized is not enough)"
            - "${end_status} == FINALIZED and ${end_fin} == 2 and statement_count == 2"
            - "EarningsPeriod.${p1_id}.closed_at == '2026-08-01T00:00:00.000Z'"
            - "trigger step 5 returns HTTP 409 with error_id ERR_FUND_PERIOD_FINALIZED"
            - "GET /monetization/creator-funds returns total_count 0"
            - "EarningsStatement.${s1_id}.withholding_variant == FINAL and withholding_cents == 1200 and net_payable_cents == 3800"
            - "EarningsStatement.${s2_id}.withholding_variant == FINAL and withholding_cents == 2400 and net_payable_cents == 7600"
            - "GET /monetization/creators/${c1_id}/ledger-entries?entry_type=WITHHOLDING_TRUE_UP returns total_count 0 (single-event statements have no rounding divergence)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: earnings_period_half_open_interval_permits_abutment
        resource: EarningsPeriod (a global, creator-independent calendar resource)
        interval_semantics: "half-open [period_start, period_end): overlap iff a.start < b.end AND b.start < a.end"
        grounds:
          - validations.priority_67
          - errors.ERR_PERIOD_WINDOW_OVERLAP
          - entities.EarningsPeriod.fields.period_start
          - entities.EarningsPeriod.fields.period_end
          - "endpoints.POST /monetization/earnings-periods"
          - validations.priority_71
          - errors.ERR_NO_OPEN_PERIOD_FOR_EVENT
        distinguishing_aspect: |
          EarningsPeriod windows are HALF-OPEN, so the shared instant between two
          abutting windows belongs to exactly one of them: a period starting at
          the precise 2026-08-01T00:00:00Z end of its predecessor is LEGAL (201),
          while pulling that start back by a single second to
          2026-07-31T23:59:59Z is an overlap and is rejected 409
          ERR_PERIOD_WINDOW_OVERLAP. The same half-open convention is then
          observed from the consumer side: a RevenueEvent at exactly
          2026-08-01T00:00:00Z routes to the SECOND period, never to the first,
          proving period_end is excluded rather than merely unenforced.
          Overlap is also checked irrespective of status - a CLOSED predecessor
          still reserves its window - which distinguishes this resource from
          Investigation windows, where CLEARED occupancy is released.
        test_recipe:
          setup:
            - "Empty DB. One OPEN EarningsPeriod P1 = [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z)."
            - "One GB Creator evaluated to ELIGIBLE and one ACTIVE TIPS RevenueProduct (5000/5000, min_payable_cents 0) so revenue events are admissible whenever a period covers their occurred_at."
          setup_api_calls:
            - call: "POST /monetization/earnings-periods"
