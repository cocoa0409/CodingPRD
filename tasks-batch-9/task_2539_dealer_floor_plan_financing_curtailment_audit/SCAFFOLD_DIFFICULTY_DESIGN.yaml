  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_line_state_error_beats_credit_limit_fiscal_error_on_the_same_fund_call
        grounds:
          - validations[priority=61]
          - validations[priority=110]
          - errors.ERR_CREDIT_LINE_NOT_ACTIVE
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
          - calculations.unit_advance_amount
          - calculations.covenant_dscr
        distinguishing_aspect: |
          The conflicting pair is state (priority 61, 409) against business_fiscal
          (priority 110, 110 - 61 = 49 bands apart, the widest gap in the catalog): one
          single fund call violates BOTH, and the fiscal violation is provable by
          reinstating the line and replaying the identical call, which then returns
          ERR_CREDIT_LIMIT_EXCEEDED. The pair is resolved by re-firing the trigger, not
          by inspecting two different requests.
