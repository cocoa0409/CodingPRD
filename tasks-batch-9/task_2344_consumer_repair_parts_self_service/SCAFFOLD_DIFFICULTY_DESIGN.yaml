      - name: certification_void_restores_the_provider_training_credit_identity
        grounds:
          - calculations.training_credit_conservation
          - state_machines.TrainingCertification.ACTIVE_to_VOIDED
          - errors[ERR_CREDIT_RESTORE_FORBIDDEN]
        distinguishing_aspect: |
          The conserved quantity is training credit units held by a RepairProvider
          (balance + consumed-by-live-certs + forfeited == granted_total): voiding the only
          ACTIVE certification must return the 2 consumed units to balance without touching
          granted_total or forfeited_total, and must additionally suspend the provider whose
          cert coverage the void destroys.
        test_recipe:
          setup:
            - "Region profile US-CA exists."
            - "RepairProvider with technician_count 4 (required_cert_count 1) was granted 6 training credits, so granted_total 6 and balance 6."
            - "One ACTIVE certification for u_tech_1 consumed 2 credits, leaving balance 4 and active_cert_count 1."
            - "The provider was then AUTHORIZED, which required active_cert_count >= 1."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/repair-providers"
              payload: { legal_name: "Harborview Electronics Service", region_code: "US-CA", requested_access_tier: "TIER_2_SAFETY", technician_count: 4 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { provider_id: $.data.id }
            - call: "POST /repair-program/repair-providers/${provider_id}/begin-training"
              payload: { training_credit_grant: 6 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/training-certifications"
              payload: { provider_id: "${provider_id}", technician_user_id: "u_tech_1", course_code: "CRS_HIGH_VOLTAGE", valid_from: "2026-07-15T00:00:00Z", valid_until: "2027-07-15T00:00:00Z", exam_score: 94 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { cert_id: $.data.id }
            - call: "POST /repair-program/repair-providers/${provider_id}/authorization-decision"
              payload: { decision: "AUTHORIZE", decision_reason: "coverage satisfied" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
          trigger:
            - call: "POST /repair-program/training-certifications/${cert_id}/void"
              payload: { void_reason: "exam integrity review overturned the result" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { cert_state: $.data.status }
          assert:
            - "${cert_state} == VOIDED"
            - "TrainingCertification.${cert_id}.credits_consumed == 0"
            - "RepairProvider.${provider_id}.training_credit_balance == 6"
            - "RepairProvider.${provider_id}.training_credit_granted_total == 6"
            - "RepairProvider.${provider_id}.training_credit_forfeited_total == 0"
            - "RepairProvider.${provider_id}.active_cert_count == 0"
            - "RepairProvider.${provider_id}.authorization_status == SUSPENDED"
            - "RepairProvider.${provider_id}.suspension_reason == CERT_COVERAGE_LOST"
