              as: CollectionSiteOperator
              as_user_id: "${site_id}"
            - call: "GET /state-programs/${prog_wa_id}"
              as: Hauler
              as_user_id: "${hauler_id}"
            - call: "GET /state-programs/${prog_wa_id}"
              as: Recycler
              as_user_id: "${recycler_id}"
          assert:
            - "All six reads: HTTP 200 with data.id == ${prog_wa_id} and data.recommended_rate_cents == 1075"
            - "No read changes data.version, which stays 1 across all six calls"

