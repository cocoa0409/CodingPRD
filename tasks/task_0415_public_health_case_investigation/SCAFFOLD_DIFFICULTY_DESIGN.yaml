              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-E", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { ke: $.data.id }
            - call: "POST /surveillance/contacts/${ke}/exposure-events"
              payload: { encounter_date: "2026-03-20T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { ee_ok: $.data.id }
          trigger:
            - call: "POST /surveillance/contacts/${ke}/exposure-events"
              payload: { encounter_date: "2026-03-21T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ENCOUNTER_OUTSIDE_INFECTIOUS_WINDOW"

      - name: monitoring_period_overlap_vs_adjacency_on_contact
        grounds:
          - validations[priority=9]
          - entities.MonitoringPeriod.fields.start_date
          - entities.MonitoringPeriod.fields.end_date
        distinguishing_aspect: |
          Day-range overlap with adjacency-allowed semantics on a Contact's MonitoringPeriods
          (different resource and interval arithmetic than the point-in-window check): a second
          period starting 2026-03-29 (the day the first ends) shares a day and is rejected
          ERR_MONITORING_PERIOD_OVERLAP, while a period starting 2026-03-30 (first end + 1) is
          adjacent and accepted.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1, index case CI interviewed, contact KO elicited."
            - "KO has a SCHEDULED MonitoringPeriod [2026-03-16, 2026-03-29]."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-O", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { ko: $.data.id }
            - call: "POST /surveillance/contacts/${ko}/monitoring-periods"
              payload: { monitoring_type: "QUARANTINE", start_date: "2026-03-16T00:00:00.000Z", end_date: "2026-03-29T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { mp1: $.data.id }
          trigger:
            - call: "POST /surveillance/contacts/${ko}/monitoring-periods"
              payload: { monitoring_type: "QUARANTINE", start_date: "2026-03-29T00:00:00.000Z", end_date: "2026-04-05T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_MONITORING_PERIOD_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contact_count_conserved_under_elicit_then_void
        grounds:
          - state_machines.Contact.ELICITED_to_VOIDED
          - entities.Case.fields.contact_count
        distinguishing_aspect: |
          Conserved quantity Case.contact_count (count of non-VOIDED contacts): pinned as
          contact_count == count of Contacts with source_case_id==case AND status != VOIDED.
          Eliciting a contact (+1) then voiding it (-1) returns contact_count to its pre-action
          value 0 — distinct conserved quantity from the jurisdiction monitoring load.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1, case CI interviewed (contact_count 0)."
            - "Contact KV elicited (contact_count 1)."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-V", exposure_setting: "SOCIAL", proximity_meters: 1.5, cumulative_exposure_minutes: 10, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { kv: $.data.id }
          trigger:
            - call: "POST /surveillance/contacts/${kv}/void"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
          assert:
            - "Contact.${kv}.status == VOIDED"
            - "Case.${ci}.contact_count == 0"

      - name: jurisdiction_monitoring_load_conserved_under_start_then_complete
        grounds:
          - state_machines.Contact.NOTIFIED_to_MONITORING_ACTIVE
          - state_machines.Contact.MONITORING_ACTIVE_to_MONITORING_COMPLETE
          - entities.Jurisdiction.fields.active_monitoring_count
        distinguishing_aspect: |
          Conserved quantity Jurisdiction.active_monitoring_count (count of contacts in
          MONITORING_ACTIVE for that jurisdiction): start-monitoring (+1) then complete-monitoring
          (-1) returns active_monitoring_count to its pre-action value 0 — a different conserved
          quantity (jurisdiction-level monitoring load) than the case-level contact_count.
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1; clock at 2026-04-01 (past quarantine end)."
            - "Case CI interviewed; contact KL elicited, notified, monitoring scheduled and started -> J1.active_monitoring_count 1."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/programs/${prog}/clock/set"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: JurisdictionAdmin
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-L", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { kl: $.data.id }
            - call: "POST /surveillance/contacts/${kl}/queue-notification"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${kl}/record-notification"
              payload: { outcome: "SUCCESS" }
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${kl}/monitoring-periods"
              payload: { monitoring_type: "QUARANTINE", start_date: "2026-03-16T00:00:00.000Z", end_date: "2026-03-29T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts/${kl}/start-monitoring"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/contacts/${kl}/complete-monitoring"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
          assert:
            - "Contact.${kl}.status == MONITORING_COMPLETE"
            - "Jurisdiction.${j1}.active_monitoring_count == 0"
