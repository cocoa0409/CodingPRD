# =============================================================================
# Scaffold Corner Design (§1.9) — Coverage Index for Non-Difficulty Tests
# Homeowners Insurance Underwriting — breadth probe of §1.1–§1.7 surface.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_property_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Property, endpoints]
        distinguishing_aspect: "POST /properties with all required fields returns 201; computed/system fields default (replacement_cost 0, total_insured_value 0, estimate_variant NONE, status ACTIVE, version 1)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { street_address: "100 Main St", state_code: "TX", year_built: 2018, square_footage: 1600, construction_type: "MASONRY", roof_age_years: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
          assert:
            - "Status 201; Property.${prop_id}.status == ACTIVE, replacement_cost == 0, total_insured_value == 0, estimate_variant == NONE, version == 1"
            - "stories defaulted to 1 (omitted in payload)"

      - name: get_property_not_found
        claim_type: Not Found
        grounds: [entities.Property, "errors[ERR_PROPERTY_NOT_FOUND]"]
        distinguishing_aspect: "GET /properties/{id} with a non-existent UUID returns 404 ERR_PROPERTY_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "Status 404 and error_id == ERR_PROPERTY_NOT_FOUND"

      - name: create_property_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Property, "validations[priority=13]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /properties omitting required square_footage returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { street_address: "101 Main St", state_code: "TX", year_built: 2018, construction_type: "FRAME", roof_age_years: 1 }
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "Status 400 and error_id == ERR_INVALID_REQUEST (square_footage missing)"

      - name: create_property_invalid_enum_construction_type
        claim_type: Type Constraints
        grounds: [entities.Property.fields.construction_type, "validations[priority=13]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /properties with construction_type='WOOD' (not in FRAME|MASONRY|FIRE_RESISTIVE) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { street_address: "102 Main St", state_code: "TX", year_built: 2018, square_footage: 1600, construction_type: "WOOD", roof_age_years: 1 }
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "Status 400 and error_id == ERR_INVALID_REQUEST (bad construction_type enum)"

      - name: computed_replacement_cost_ignores_client_value
        claim_type: Computed Fields
        grounds: [entities.Property.fields.replacement_cost, calculations.replacement_cost_estimate]
        distinguishing_aspect: "replacement_cost is server-computed: a client cannot set it via POST /properties; it stays 0 until estimate-replacement-cost is called."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { street_address: "103 Main St", state_code: "TX", year_built: 2018, square_footage: 1600, construction_type: "FRAME", roof_age_years: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
          assert:
            - "Property.${prop_id}.replacement_cost == 0 (no estimate committed yet; any client-supplied value ignored)"

      - name: archived_property_excluded_from_default_list
        claim_type: System Fields
        grounds: [entities.Property.fields.status, endpoints]
        distinguishing_aspect: "Property.status defaults ACTIVE and a freshly created property appears in GET /properties default listing (include_archived omitted)."
        test_recipe:
          setup: ["Two ACTIVE properties."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { street_address: "104 Main St", state_code: "TX", year_built: 2018, square_footage: 1600, construction_type: "FRAME", roof_age_years: 1 }
              as: Agent
              captures: { p1: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "105 Main St", state_code: "TX", year_built: 2019, square_footage: 1700, construction_type: "FRAME", roof_age_years: 2 }
              as: Agent
              captures: { p2: $.data.id }
          trigger:
            - call: "GET /properties"
              payload: {}
              as: Agent
          assert:
            - "Response is an array containing both ${p1} and ${p2}; total_count >= 2; has_more honored per pagination_defaults"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_from_already_submitted_returns_not_draft
        claim_type: Invalid Transitions
        grounds: [state_machines.Application.DRAFT_to_SUBMITTED, "errors[ERR_APPLICATION_NOT_DRAFT]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED Application returns 409 ERR_APPLICATION_NOT_DRAFT; no second quote is generated."
        test_recipe:
          setup: ["A SUBMITTED Application."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { street_address: "20 Repeat St", state_code: "CA", year_built: 2009, square_footage: 2000, construction_type: "FRAME", roof_age_years: 5, stories: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/estimate-replacement-cost"
              payload: { method: "COMPONENT" }
              as: Agent
            - call: "POST /risk-assessments"
              payload: { property_id: "${prop_id}", wildfire_fuel_density: 60, slope_grade_pct: 40, defensible_space_ft: 100, flood_zone: "X", distance_to_coast_mi: 60 }
              as: Underwriter
            - call: "POST /applications"
              payload: { property_id: "${prop_id}", requested_coverage_a: 300000 }
              as: Agent
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Agent
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 and error_id == ERR_APPLICATION_NOT_DRAFT"

      - name: cancel_from_cancelled_returns_not_cancellable
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Policy.ACTIVE_to_CANCELLED, "errors[ERR_POLICY_NOT_CANCELLABLE]"]
        distinguishing_aspect: "A CANCELLED Policy is terminal: a second cancel returns 409 ERR_POLICY_NOT_CANCELLABLE."
        test_recipe:
          setup: ["A CANCELLED Policy (cancelled from PENDING_PAYMENT path via ACTIVE→CANCELLED is not reachable; use ACTIVE→CANCELLED then re-cancel)."]
          setup_api_calls:
            - call: "POST /underwriters"
              payload: { full_name: "Uma UW", authority_limit: 1000000 }
              as: Admin
              captures: { uw_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", license_state: "CA" }
              as: Admin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "21 Term St", state_code: "CA", year_built: 2009, square_footage: 2000, construction_type: "FRAME", roof_age_years: 5, stories: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/estimate-replacement-cost"
              payload: { method: "COMPONENT" }
              as: Agent
            - call: "POST /risk-assessments"
              payload: { property_id: "${prop_id}", wildfire_fuel_density: 60, slope_grade_pct: 40, defensible_space_ft: 100, flood_zone: "X", distance_to_coast_mi: 60 }
              as: Underwriter
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", window_start: 1751300000, window_end: 1751303600 }
              as: Underwriter
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/complete"
              payload: { roof_ok: true, electrical_ok: true, plumbing_ok: true, hvac_ok: true }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /applications"
              payload: { property_id: "${prop_id}", requested_coverage_a: 300000, wind_hail_deductible_pct: 2 }
              as: Agent
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Agent
            - call: "POST /applications/${app_id}/take-review"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_id}"
              captures: { app_v: $.data.version }
            - call: "POST /applications/${app_id}/bind"
              payload: { effective_date: 1751000000, expiration_date: 1782536000, expected_application_version: "${app_v}" }
              as: Underwriter
              as_user_id: "${uw_id}"
            - call: "GET /policies"
              payload: { application_id: "${app_id}" }
              as: Underwriter
              captures: { pol_id: "$.data[0].id" }
            - call: "POST /payments"
              payload: { policy_id: "${pol_id}", purpose: "BINDING", amount: 997.50 }
              as: Agent
            - call: "POST /policies/${pol_id}/cancel"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_id}"
          trigger:
            - call: "POST /policies/${pol_id}/cancel"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First cancel: Policy.${pol_id}.status == CANCELLED. Second cancel: status 409 and error_id == ERR_POLICY_NOT_CANCELLABLE"

      - name: reschedule_from_scheduled_returns_not_failed
        claim_type: Invalid Transitions
        grounds: [state_machines.Inspection.FAILED_to_SCHEDULED, "errors[ERR_INSPECTION_NOT_FAILED]"]
        distinguishing_aspect: "Rescheduling a SCHEDULED (not FAILED) Inspection returns 409 ERR_INSPECTION_NOT_FAILED."
        test_recipe:
          setup: ["A SCHEDULED Inspection."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", license_state: "CA" }
              as: Admin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "22 Resch St", state_code: "CA", year_built: 2009, square_footage: 2000, construction_type: "FRAME", roof_age_years: 5, stories: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", window_start: 1751400000, window_end: 1751403600 }
              as: Underwriter
              captures: { insp1: $.data.id }
          trigger:
            - call: "POST /inspections/${insp1}/reschedule"
              payload: { window_start: 1751500000, window_end: 1751503600 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 and error_id == ERR_INSPECTION_NOT_FAILED"

      - name: failed_inspection_reschedule_resets_flags
        claim_type: Side Effect Execution
        grounds: [state_machines.Inspection.FAILED_to_SCHEDULED, entities.Inspection.fields.passed_count]
        distinguishing_aspect: "Rescheduling a FAILED inspection resets the four 4-point flags to false, passed_count to 0, and returns status SCHEDULED with the new window."
        test_recipe:
          setup: ["A FAILED Inspection (completed 2/4)."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", license_state: "CA" }
              as: Admin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "23 Reset St", state_code: "CA", year_built: 2009, square_footage: 2000, construction_type: "FRAME", roof_age_years: 5, stories: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", window_start: 1751600000, window_end: 1751603600 }
              as: Underwriter
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/complete"
              payload: { roof_ok: true, electrical_ok: true, plumbing_ok: false, hvac_ok: false }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspections/${insp1}/reschedule"
              payload: { window_start: 1751700000, window_end: 1751703600 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { st: $.data.status, pc: $.data.passed_count }
          assert:
            - "After complete: Inspection.${insp1}.status == FAILED and passed_count == 2"
            - "After reschedule: status == SCHEDULED, passed_count == 0, window_start == 1751700000"

      - name: take_review_from_draft_returns_not_submitted
        claim_type: Invalid Transitions
        grounds: [state_machines.Application.SUBMITTED_to_UNDER_REVIEW, "errors[ERR_APPLICATION_NOT_SUBMITTED]"]
        distinguishing_aspect: "take-review on a DRAFT (not SUBMITTED) Application returns 409 ERR_APPLICATION_NOT_SUBMITTED."
        test_recipe:
          setup: ["A DRAFT Application and an Underwriter."]
          setup_api_calls:
            - call: "POST /underwriters"
              payload: { full_name: "Uma UW", authority_limit: 1000000 }
              as: Admin
              captures: { uw_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "24 Draft St", state_code: "CA", year_built: 2009, square_footage: 2000, construction_type: "FRAME", roof_age_years: 5, stories: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
            - call: "POST /applications"
              payload: { property_id: "${prop_id}", requested_coverage_a: 300000 }
              as: Agent
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/take-review"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 and error_id == ERR_APPLICATION_NOT_SUBMITTED"

      - name: bind_boundary_wildfire_already_covered
        claim_type: Precondition Enforcement
        grounds: [state_machines.Application.UNDER_REVIEW_to_BOUND]
        excluded_because:
          difficulty_instance: boundary_precision_check / wildfire_score_80_boundary_declines_bind
          rationale: "The wildfire >= 80 declination precondition is asserted by the named §1.8 boundary instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: wind_hail_deductible_floor_applies
        claim_type: Correct Result
        grounds: [calculations.wind_hail_deductible_amount, entities.Quote.fields.wind_hail_deductible_amount]
        distinguishing_aspect: "wind_hail_deductible_amount = max(coverage*pct/100, MIN_DEDUCTIBLE 2500): coverage 220000 at 1% = 2200 → floored to 2500.00."
        test_recipe:
          setup: ["A submitted Application coverage 220000, deductible 1%."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { street_address: "25 Floor St", state_code: "CA", year_built: 2009, square_footage: 1600, construction_type: "FRAME", roof_age_years: 4, stories: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/estimate-replacement-cost"
              payload: { method: "COMPONENT" }
              as: Agent
              captures: { rc: $.data.replacement_cost }
            - call: "POST /risk-assessments"
              payload: { property_id: "${prop_id}", wildfire_fuel_density: 30, slope_grade_pct: 20, defensible_space_ft: 150, flood_zone: "X", distance_to_coast_mi: 60 }
              as: Underwriter
            - call: "POST /applications"
              payload: { property_id: "${prop_id}", requested_coverage_a: 220000, wind_hail_deductible_pct: 1 }
              as: Agent
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Agent
          assert:
            - "Quote for ${app_id}: wind_hail_deductible_amount == 2500.00 (2200 floored to MIN_DEDUCTIBLE)"

      - name: exclusion_endorsement_negative_delta
        claim_type: Correct Result
        grounds: [calculations.endorsement_premium_delta, entities.Endorsement.fields.premium_delta]
        distinguishing_aspect: "An EXCLUSION endorsement (peril ORDINANCE_LAW) yields premium_delta == -80.00 (negative EXCLUSION_CREDIT)."
        test_recipe:
          setup: ["A DRAFT Application with one DRAFT EXCLUSION ORDINANCE_LAW endorsement."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { street_address: "26 Excl St", state_code: "CA", year_built: 2009, square_footage: 2000, construction_type: "FRAME", roof_age_years: 5, stories: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
            - call: "POST /applications"
              payload: { property_id: "${prop_id}", requested_coverage_a: 300000 }
              as: Agent
              captures: { app_id: $.data.id }
            - call: "POST /endorsements"
              payload: { application_id: "${app_id}", kind: "EXCLUSION", peril_code: "ORDINANCE_LAW" }
              as: Agent
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /endorsements/${e1}/attach"
              payload: {}
              as: Agent
              captures: { d1: $.data.premium_delta }
          assert:
            - "Endorsement.${e1}.status == PENDING and premium_delta == -80.00"

      - name: wildfire_surcharge_only_above_40
        claim_type: Constants Applied
        grounds: [calculations.annual_premium, entities.Quote.fields.base_premium]
        distinguishing_aspect: "wf_mult surcharge applies only when wildfire_score > 40: with FINAL wildfire_score 20 (<=40) on coverage 300000/X/TIER_1/2%, base_premium == 997.50 (no surcharge)."
        test_recipe:
          setup: ["A submitted Application, FINAL wildfire_score 20, coverage 300000, flood X, TIER_1, 2%."]
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", license_state: "CA" }
              as: Admin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { street_address: "27 NoSur St", state_code: "CA", year_built: 2009, square_footage: 2000, construction_type: "FRAME", roof_age_years: 5, stories: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/estimate-replacement-cost"
              payload: { method: "COMPONENT" }
              as: Agent
            - call: "POST /risk-assessments"
              payload: { property_id: "${prop_id}", wildfire_fuel_density: 60, slope_grade_pct: 40, defensible_space_ft: 100, flood_zone: "X", distance_to_coast_mi: 60 }
              as: Underwriter
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", window_start: 1751800000, window_end: 1751803600 }
              as: Underwriter
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/complete"
              payload: { roof_ok: true, electrical_ok: true, plumbing_ok: true, hvac_ok: true }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /applications"
              payload: { property_id: "${prop_id}", requested_coverage_a: 300000, wind_hail_deductible_pct: 2 }
              as: Agent
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Agent
          assert:
            - "Quote for ${app_id}: base_premium == 997.50 (FINAL wildfire_score 20 below 40, wf_mult = 1.0)"

      - name: replacement_cost_variant_divergence_already_covered
        claim_type: Variant Divergence
        grounds: [calculations.replacement_cost_estimate]
        excluded_because:
          difficulty_instance: dual_variant_calc / replacement_cost_component_vs_sqft_blend
          rationale: "COMPONENT vs SQFT_BLEND divergence asserted by the named §1.8 dual-variant instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: submit_coverage_below_replacement_cost
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_COVERAGE_BELOW_REPLACEMENT_COST]"]
        distinguishing_aspect: "Submitting with requested_coverage_a 250000 < committed replacement_cost 274200 returns 422 ERR_COVERAGE_BELOW_REPLACEMENT_COST."
        test_recipe:
          setup: ["A DRAFT Application coverage 250000 on a property whose COMPONENT replacement_cost is 274200."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { street_address: "28 Below St", state_code: "CA", year_built: 2009, square_footage: 2000, construction_type: "FRAME", roof_age_years: 5, stories: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/estimate-replacement-cost"
              payload: { method: "COMPONENT" }
              as: Agent
            - call: "POST /risk-assessments"
              payload: { property_id: "${prop_id}", wildfire_fuel_density: 60, slope_grade_pct: 40, defensible_space_ft: 100, flood_zone: "X", distance_to_coast_mi: 60 }
              as: Underwriter
            - call: "POST /applications"
              payload: { property_id: "${prop_id}", requested_coverage_a: 250000 }
              as: Agent
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "Status 422 and error_id == ERR_COVERAGE_BELOW_REPLACEMENT_COST (250000 < 274200)"

      - name: submit_without_replacement_cost_estimate
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_REPLACEMENT_COST_MISSING]"]
        distinguishing_aspect: "Submitting an Application whose property has no committed estimate (replacement_cost == 0) returns 409 ERR_REPLACEMENT_COST_MISSING."
        test_recipe:
          setup: ["A DRAFT Application on a property with NO estimate committed."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { street_address: "29 NoEst St", state_code: "CA", year_built: 2009, square_footage: 2000, construction_type: "FRAME", roof_age_years: 5, stories: 1 }
              as: Agent
              captures: { prop_id: $.data.id }
            - call: "POST /risk-assessments"
              payload: { property_id: "${prop_id}", wildfire_fuel_density: 60, slope_grade_pct: 40, defensible_space_ft: 100, flood_zone: "X", distance_to_coast_mi: 60 }
              as: Underwriter
            - call: "POST /applications"
              payload: { property_id: "${prop_id}", requested_coverage_a: 300000 }
              as: Agent
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Agent
              captures: { err: $.data.error_id }
          assert:
            - "Status 409 and error_id == ERR_REPLACEMENT_COST_MISSING (replacement_cost == 0)"

      - name: binding_payment_amount_mismatch
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_PAYMENT_AMOUNT_MISMATCH]", state_machines.Policy.PENDING_PAYMENT_to_ACTIVE]
        distinguishing_aspect: "A binding payment of 900.00 against a policy whose annual_premium is 997.50 returns 422 ERR_PAYMENT_AMOUNT_MISMATCH; policy stays PENDING_PAYMENT."
        test_recipe:
          setup: ["A bound Policy PENDING_PAYMENT with annual_premium 997.50."]
          setup_api_calls:
            - call: "POST /underwriters"
              payload: { full_name: "Uma UW", authority_limit: 1000000 }
              as: Admin
              captures: { uw_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", license_state: "CA" }
              as: Admin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
