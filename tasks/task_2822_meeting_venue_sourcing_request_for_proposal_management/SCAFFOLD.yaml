scenario: |
  2822. Meeting Venue Sourcing & Request for Proposal Management (corporate meeting planning team):
  meeting requirement definition with dates, attendee counts, space needs and budget parameters,
  destination and venue shortlisting with site inspection planning, proposal solicitation with
  standardized response formats for rates, concessions and fees, bid comparison with total cost
  modeling including taxes, service charges and audiovisual, contract negotiation on attrition,
  cancellation, force majeure and rebooking credit terms, preferred supplier program compliance and
  rate benchmarking, contract execution, deposit schedule and internal approval routing, post-event
  savings reporting and supplier performance capture
domain_name: meeting-venue-sourcing-rfp
api_prefix: "/sourcing"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Venue and MeetingEvent are peers joined many-to-many through VenueShortlistEntry and through
  # Rfp/Proposal; Rfp carries a self-referential previous_rfp_id edge for negotiation rounds; Contract
  # is a cross-aggregate node referencing MeetingEvent, Proposal and Venue at once.

  state_machine_shape: cyclic
  # Proposal cycles UNDER_REVIEW -> COUNTERED -> REVISED -> UNDER_REVIEW for each negotiation round;
  # MeetingEvent cycles BID_REVIEW -> SOURCING -> BID_REVIEW across RFP rounds; Contract carries two
  # independent parallel dimensions (approval_state x signature_state) that join at EXECUTED.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The SourcingManager who awards a Contract can never decide any of that Contract's ApprovalSteps,
  # and no two steps of one Contract may be decided by the same X-User-ID.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities, 56 endpoints, 46 error codes, 8 calculation rules (3 with divergent variants),
  # 9 state machines (2 non-linear: Proposal cyclic, Contract parallel-dimensional).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: MeetingEvent
    parent: null
    common_fields: true
    fields:
      - name: event_code
        type: string
        source: input
        description: "Planner-assigned sourcing code, globally unique"
        constraints: "unique across MeetingEvent; 3-32 chars"
      - name: name
        type: string
        source: input
        description: "Human-readable meeting name"
      - name: program_type
        type: enum
        source: input
        description: "Meeting program category; joins RateBenchmark together with the Venue tier"
        constraints: "one of {BOARD_MEETING, SALES_KICKOFF, TRAINING, USER_CONFERENCE, INCENTIVE}"
      - name: start_date
        type: string
        source: input
        description: "First arrival date, YYYY-MM-DD in UTC"
      - name: end_date
        type: string
        source: input
        description: "Departure date, YYYY-MM-DD in UTC; must be strictly after start_date"
      - name: nights_span
        type: integer
        source: computed
        description: "end_date minus start_date in whole days; the room-block night count"
      - name: peak_attendees
        type: integer
        source: input
        description: "Peak concurrent attendee count"
        constraints: ">= 1"
      - name: requested_room_nights
        type: integer
        source: input
        description: "Total room nights the planner intends to contract"
        constraints: ">= 1"
      - name: largest_meeting_space_sqft
        type: integer
        source: input
        description: "Largest single general-session space required, in square feet"
        constraints: ">= 0"
      - name: budget_ceiling_usd
        type: number
        source: input
        description: "Hard ceiling on the contracted total cost; enforced at award"
        constraints: "> 0; 2 decimal places"
      - name: preferred_program_only
        type: boolean
        source: input
        default: false
        description: "When true only venues whose program_status_at_shortlist is IN_PROGRAM may be shortlisted or awarded"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Sourcing lifecycle state"
        constraints: "one of {DRAFT, REQUIREMENTS_LOCKED, SOURCING, BID_REVIEW, AWARDED, CONTRACTED, COMPLETED, CANCELLED}"
      - name: sourcing_owner_user_id
        type: string
        source: system
        description: "X-User-ID of the SourcingManager that created the event; opaque operator id"
      - name: shortlisted_venue_count
        type: integer
        source: computed
        default: 0
        description: "Count of this event's VenueShortlistEntry rows whose status IN {SHORTLISTED, INSPECTION_SCHEDULED, INSPECTED, RFP_ISSUED, AWARDED}"
      - name: best_total_cost_usd
        type: number
        source: computed
        description: "Lowest Proposal.total_cost_contracted_usd across this event's live proposals (see calculations.event_sourcing_rollup); null when none"
      - name: awarded_proposal_id
        type: string
        source: computed
        description: "FK -> Proposal.id; the Proposal currently awarded for this event, null before award and cleared when the award is unwound"
      - name: committed_spend_usd
        type: number
        source: computed
        default: 0.00
        description: "Contract.contracted_total_usd of this event's Contract whose signature_state NOT IN {TERMINATED, VOIDED} and approval_state NOT IN {REJECTED, CANCELLED}; 0.00 when none"
      - name: cancellation_liability_usd
        type: number
        source: computed
        default: 0.00
        description: "Accumulated Contract.cancellation_fee_usd charged to this event by contract termination"
      - name: budget_remaining_usd
        type: number
        source: computed
        description: "budget_ceiling_usd - committed_spend_usd - cancellation_liability_usd; see calculations.budget_envelope_invariant"
      - name: savings_recognized_usd
        type: number
        source: computed
        description: "PostEventReport.savings_vs_budget_usd of this event's report; null before the report exists"

  - name: RateBenchmark
    parent: null
    common_fields: false
    fields:
      - name: destination_tier
        type: enum
        source: input
        description: "Destination tier this benchmark covers"
        constraints: "one of {TIER_1, TIER_2, TIER_3}"
      - name: program_type
        type: enum
        source: input
        description: "Program category this benchmark covers"
        constraints: "one of {BOARD_MEETING, SALES_KICKOFF, TRAINING, USER_CONFERENCE, INCENTIVE}"
      - name: benchmark_adr_usd
        type: number
        source: input
        description: "Program-negotiated benchmark average daily rate used for rate benchmarking and savings reporting"
        constraints: "> 0"
      - name: benchmark_service_charge_pct
        type: number
        source: input
        description: "Benchmark service-charge percentage, decimal fraction"
        constraints: ">= 0 and <= 1"
      - name: benchmark_tax_pct
        type: number
        source: input
        description: "Benchmark occupancy-tax percentage, decimal fraction"
        constraints: ">= 0 and <= 1"

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Venue name"
      - name: city
        type: string
        source: input
        description: "Destination city"
      - name: country
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country code"
      - name: destination_tier
        type: enum
        source: input
        description: "Destination tier; joins RateBenchmark together with MeetingEvent.program_type"
        constraints: "one of {TIER_1, TIER_2, TIER_3}"
      - name: guest_rooms_total
        type: integer
        source: input
        description: "Sellable guest rooms; caps the peak rooms per night this venue can block"
        constraints: ">= 1"
      - name: largest_space_sqft
        type: integer
        source: input
        description: "Largest contiguous function space in square feet"
        constraints: ">= 0"
      - name: preferred_supplier_status
        type: enum
        source: input
        default: NONE
        description: "Preferred supplier program standing"
        constraints: "one of {PREFERRED, CONDITIONAL, NONE, SUSPENDED}"
      - name: performance_score
        type: number
        source: computed
        description: "Recency-weighted composite from SupplierPerformanceReview rows (calculations.venue_performance_score, variant RECENCY_WEIGHTED); null with zero reviews"
      - name: performance_score_simple_mean
        type: number
        source: computed
        description: "Unweighted mean composite from the same reviews (calculations.venue_performance_score, variant SIMPLE_MEAN); null with zero reviews"
      - name: performance_review_count
        type: integer
        source: computed
        default: 0
        description: "Count of SupplierPerformanceReview rows referencing this venue"
      - name: blocked_room_nights
        type: integer
        source: computed
        default: 0
        description: "Sum of Contract.contracted_paid_room_nights over this venue's Contracts whose signature_state == EXECUTED; see calculations.room_night_inventory_invariant"

  - name: VenueShortlistEntry
    parent: MeetingEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> MeetingEvent.id; the event being sourced"
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the candidate venue"
      - name: rank_seq
        type: integer
        source: input
        description: "Planner-assigned shortlist ordering, 1 = highest preference"
        constraints: ">= 1; unique per event_id"
      - name: inspection_required
        type: boolean
        source: input
        default: false
        description: "When true this entry cannot be invited to an RFP until it has a COMPLETED SiteInspection"
      - name: status
        type: enum
        source: system
        default: CANDIDATE
        description: "Shortlisting lifecycle state"
        constraints: "one of {CANDIDATE, SHORTLISTED, INSPECTION_SCHEDULED, INSPECTED, RFP_ISSUED, AWARDED, ELIMINATED}"
      - name: program_status_at_shortlist
        type: enum
        source: system
        description: "Snapshot of the venue's program standing at entry creation: IN_PROGRAM when Venue.preferred_supplier_status IN {PREFERRED, CONDITIONAL}, else OUT_OF_PROGRAM; never re-derived afterwards"
        constraints: "one of {IN_PROGRAM, OUT_OF_PROGRAM}"
      - name: elimination_reason
        type: string
        source: system
        description: "Free-text reason recorded when status becomes ELIMINATED; null otherwise"
      - name: inspection_count
        type: integer
        source: computed
        default: 0
        description: "Count of SiteInspection rows on this entry whose status IN {PLANNED, COMPLETED}"

  - name: SiteInspection
    parent: VenueShortlistEntry
    common_fields: true
    fields:
      - name: shortlist_entry_id
        type: string
        source: input
        description: "FK -> VenueShortlistEntry.id; the shortlist entry being inspected"
      - name: venue_id
        type: string
        source: system
        description: "FK -> Venue.id; copied from the parent VenueShortlistEntry.venue_id at creation and never re-derived"
      - name: inspector_user_id
        type: string
        source: input
        description: "Opaque operator id of the inspecting planner"
      - name: window_start
        type: datetime
        source: input
        description: "Inspection window start, ISO 8601 UTC with three fractional digits"
      - name: window_end
        type: datetime
        source: input
        description: "Inspection window end, ISO 8601 UTC; must be strictly after window_start"
      - name: travel_buffer_minutes
        type: integer
        source: input
        default: 90
        description: "Minutes of travel buffer appended to window_end to form the venue occupation interval"
        constraints: ">= 0 and <= 720"
      - name: occupied_until
        type: datetime
        source: computed
        description: "window_end plus travel_buffer_minutes; the exclusive upper bound of this inspection's venue occupation interval"
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: "Inspection lifecycle state"
        constraints: "one of {PLANNED, COMPLETED, CANCELLED}"
      - name: findings_score
        type: integer
        source: system
        description: "Inspector score recorded at completion, 1-5; null while PLANNED"
      - name: cancel_reason
        type: string
        source: system
        description: "Reason recorded when the inspection is cancelled; null otherwise"

  - name: Rfp
    parent: MeetingEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> MeetingEvent.id; the event this solicitation belongs to"
      - name: round_number
        type: integer
        source: input
        description: "Negotiation round; 1 = initial solicitation, 2+ = best-and-final rounds"
        constraints: ">= 1; unique per event_id"
      - name: previous_rfp_id
        type: string
        source: input
        description: "FK -> Rfp.id; the CLOSED round this round supersedes; required when round_number > 1, must be null when round_number == 1"
      - name: response_due_at
        type: datetime
        source: input
        description: "Deadline for venue responses, ISO 8601 UTC; inclusive - a submit at exactly this instant is accepted"
      - name: standard_response_version
        type: enum
        source: input
        description: "Standardized response format version venues must answer in"
        constraints: "one of {V1, V2}"
      - name: instructions
        type: string
        source: input
        description: "Free-text instructions to bidders; null when omitted"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Solicitation lifecycle state"
        constraints: "one of {DRAFT, ISSUED, CLOSED}"
      - name: invited_count
        type: integer
        source: computed
        default: 0
        description: "Count of Proposal rows created by issuing this Rfp"
      - name: submitted_count
        type: integer
        source: computed
        default: 0
        description: "Count of this Rfp's Proposals whose status IN {SUBMITTED, UNDER_REVIEW, COUNTERED, REVISED, AWARDED}"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant at which status became ISSUED; null while DRAFT"
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which status became CLOSED; null before"

  - name: Proposal
    parent: Rfp
    common_fields: true
    fields:
      - name: rfp_id
        type: string
        source: system
        description: "FK -> Rfp.id; the solicitation round this bid answers"
      - name: venue_id
        type: string
        source: system
        description: "FK -> Venue.id; the bidding venue, copied from the invited VenueShortlistEntry.venue_id"
      - name: status
        type: enum
        source: system
        default: INVITED
        description: "Bid lifecycle state"
        constraints: "one of {INVITED, SUBMITTED, UNDER_REVIEW, COUNTERED, REVISED, AWARDED, REJECTED, DECLINED, WITHDRAWN, EXPIRED}"
      - name: room_rate_usd
        type: number
        source: system
        description: "Quoted average daily rate as submitted or last revised; null while INVITED"
      - name: rate_type
        type: enum
        source: system
        description: "Whether room_rate_usd is NET of commission or GROSS"
        constraints: "one of {NET, GROSS}"
      - name: commission_pct
        type: number
        source: system
        description: "Travel-agency commission fraction deducted when rate_type == GROSS"
        constraints: ">= 0 and <= 0.20"
      - name: room_nights_offered
        type: integer
        source: system
        description: "Total room nights the venue will hold, comps included"
      - name: comp_room_ratio
        type: integer
        source: system
        description: "One complimentary room night per this many offered room nights; 0 disables comps"
        constraints: ">= 0"
      - name: resort_fee_usd_per_night
        type: number
        source: system
        description: "Mandatory resort/facility fee charged per paid room night"
      - name: service_charge_pct
        type: number
        source: system
        description: "Service-charge fraction applied to the room+F&B+AV base"
      - name: tax_pct
        type: number
        source: system
        description: "Occupancy/sales tax fraction applied on top of the service charge"
      - name: av_estimate_usd
        type: number
        source: system
        description: "Quoted audiovisual estimate before the volume-tier adjustment"
      - name: fnb_minimum_usd
        type: number
        source: system
        description: "Food-and-beverage minimum the venue requires"
      - name: concession_credit_usd
        type: number
        source: system
        description: "Offered concession credit before the cap in calculations.proposal_total_cost_model"
      - name: attrition_allowance_pct
        type: number
        source: system
        description: "Fraction of the contracted block the group may release without damages"
        constraints: ">= 0 and <= 0.50"
      - name: cancellation_schedule
        type: array
        source: system
        description: "Ordered array of objects {days_before_arrival_min integer, fee_pct number}; consumed by calculations.contract_cancellation_fee"
      - name: force_majeure_scope
        type: enum
        source: system
        description: "Breadth of the force majeure clause offered"
        constraints: "one of {NARROW, STANDARD, BROAD}"
      - name: rebooking_credit_pct
        type: number
        source: system
        description: "Fraction of the cancellation fee the venue will return as rebooking credit"
        constraints: ">= 0 and <= 1"
      - name: net_adr_usd
        type: number
        source: computed
        description: "Commission-adjusted average daily rate; see calculations.proposal_total_cost_model"
      - name: comp_room_nights
        type: integer
        source: computed
        default: 0
        description: "floor(room_nights_offered / comp_room_ratio), or 0 when comp_room_ratio == 0"
      - name: paid_room_nights
        type: integer
        source: computed
        description: "room_nights_offered - comp_room_nights"
      - name: total_cost_contracted_usd
        type: number
        source: computed
        description: "CONTRACTED_BASIS output of calculations.proposal_total_cost_model, recomputed on every submit and revise; the only figure the budget ceiling is tested against"
      - name: total_cost_modeled_usd
        type: number
        source: computed
        description: "total_cost_usd of the most recent BidEvaluation for this proposal, whichever basis it used; null before the first evaluation"
      - name: last_evaluation_basis
        type: enum
        source: computed
        description: "basis of the most recent BidEvaluation; null before the first evaluation"
        constraints: "one of {CONTRACTED_BASIS, ACTUALIZED_BASIS}"
      - name: benchmark_variance_pct
        type: number
        source: computed
        description: "Signed fraction by which net_adr_usd exceeds the matching RateBenchmark.benchmark_adr_usd, 4 decimals; see calculations.rate_benchmark_compliance"
      - name: compliance_status
        type: enum
        source: computed
        default: NOT_EVALUATED
        description: "Preferred-supplier-program compliance verdict from calculations.rate_benchmark_compliance"
        constraints: "one of {NOT_EVALUATED, COMPLIANT, COMPLIANT_WITH_VARIANCE, NON_COMPLIANT}"
      - name: negotiation_round_count
        type: integer
        source: computed
        default: 0
        description: "Count of NegotiationCounter rows on this proposal"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the first submit; null while INVITED"

  - name: BidEvaluation
    parent: Proposal
    common_fields: false
    fields:
      - name: proposal_id
        type: string
        source: system
        description: "FK -> Proposal.id; the bid this evaluation snapshots"
      - name: basis
        type: enum
        source: input
        description: "Which variant of calculations.proposal_total_cost_model produced this row"
        constraints: "one of {CONTRACTED_BASIS, ACTUALIZED_BASIS}"
      - name: evaluated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SourcingManager that ran the evaluation"
      - name: paid_room_nights_used
        type: integer
        source: system
        description: "Room nights the basis charged for: paid_room_nights under CONTRACTED_BASIS, projected_paid_nights under ACTUALIZED_BASIS"
      - name: room_revenue_usd
        type: number
        source: system
        description: "net_adr_usd multiplied by paid_room_nights_used, rounded to cents"
      - name: resort_fee_total_usd
        type: number
        source: system
        description: "resort_fee_usd_per_night multiplied by paid_room_nights_used, rounded to cents"
      - name: av_adjusted_usd
        type: number
        source: system
        description: "Volume-tier-adjusted audiovisual cost"
      - name: fnb_usd
        type: number
        source: system
        description: "Food-and-beverage minimum carried into the model"
      - name: service_charge_usd
        type: number
        source: system
        description: "Service charge on the room+F&B+AV base"
      - name: tax_usd
        type: number
        source: system
        description: "Tax on the room+resort+F&B+AV+service-charge base"
      - name: concession_applied_usd
        type: number
        source: system
        description: "Concession credit after the CONCESSION_CAP_PCT cap"
      - name: attrition_damages_usd
        type: number
        source: system
        description: "Projected attrition damages; always 0.00 under CONTRACTED_BASIS"
      - name: total_cost_usd
        type: number
        source: system
        description: "Total modeled cost for this basis"
      - name: benchmark_adr_usd
        type: number
        source: system
        description: "RateBenchmark.benchmark_adr_usd in force at evaluation time"
      - name: evaluated_at
        type: datetime
        source: system
        description: "Logical-clock instant of the evaluation"

  - name: NegotiationCounter
    parent: Proposal
    common_fields: true
    fields:
      - name: proposal_id
        type: string
        source: system
        description: "FK -> Proposal.id; the bid being countered"
      - name: round_seq
        type: integer
        source: system
        description: "1-based counter sequence within the proposal, assigned in creation order"
      - name: term_category
        type: enum
        source: input
        description: "Which contract term the planner is countering"
        constraints: "one of {RATE, CONCESSION, ATTRITION, CANCELLATION, FORCE_MAJEURE, REBOOKING_CREDIT}"
      - name: proposed_numeric_value
        type: number
        source: input
        description: "Numeric target for RATE, CONCESSION, ATTRITION and REBOOKING_CREDIT counters; null for text-only categories"
      - name: proposed_text_value
        type: string
        source: input
        description: "Text target for CANCELLATION and FORCE_MAJEURE counters; null for numeric categories"
      - name: planner_note
        type: string
        source: input
        description: "Free-text negotiation note; null when omitted"
      - name: initiated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SourcingManager that raised the counter"
      - name: resolution
        type: enum
        source: system
        default: OPEN
        description: "Counter disposition; set by the venue's revise call"
        constraints: "one of {OPEN, ACCEPTED, DECLINED_BY_VENUE}"
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of resolution; null while OPEN"

  - name: Contract
    parent: MeetingEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: system
        description: "FK -> MeetingEvent.id; the event this contract commits"
      - name: proposal_id
        type: string
        source: system
        description: "FK -> Proposal.id; the awarded bid this contract was minted from"
      - name: venue_id
        type: string
        source: system
        description: "FK -> Venue.id; the contracted venue"
      - name: approval_state
        type: enum
        source: system
        default: PENDING_ROUTING
        description: "Internal approval-routing dimension; evolves independently of signature_state"
        constraints: "one of {PENDING_ROUTING, IN_APPROVAL, APPROVED, REJECTED, CANCELLED}"
      - name: signature_state
        type: enum
        source: system
        default: UNSIGNED
        description: "Execution dimension; evolves independently of approval_state and joins with it at EXECUTED"
        constraints: "one of {UNSIGNED, PLANNER_SIGNED, COUNTERSIGNED, EXECUTED, TERMINATED, VOIDED}"
      - name: awarded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SourcingManager that awarded; barred from deciding any ApprovalStep of this contract"
      - name: contracted_room_rate_usd
        type: number
        source: system
        description: "Snapshot of Proposal.net_adr_usd at award"
      - name: contracted_paid_room_nights
        type: integer
        source: system
        description: "Snapshot of Proposal.paid_room_nights at award"
      - name: contracted_room_revenue_usd
        type: number
        source: system
        description: "contracted_room_rate_usd multiplied by contracted_paid_room_nights, rounded to cents; the base for cancellation fees"
      - name: pre_rebate_total_usd
        type: number
        source: system
        description: "Snapshot of Proposal.total_cost_contracted_usd at award; the sole tier input of calculations.contract_volume_rebate"
      - name: volume_rebate_pct
        type: number
        source: system
        description: "Rebate tier selected from pre_rebate_total_usd"
      - name: volume_rebate_usd
        type: number
        source: system
        description: "pre_rebate_total_usd multiplied by volume_rebate_pct, rounded to cents"
      - name: contracted_total_usd
        type: number
        source: computed
        description: "pre_rebate_total_usd minus volume_rebate_usd; drives approval routing thresholds and the deposit schedule"
      - name: peak_rooms_per_night
        type: integer
        source: computed
        description: "ceil(contracted_paid_room_nights / MeetingEvent.nights_span); checked against Venue.guest_rooms_total at execution"
      - name: attrition_allowance_pct
        type: number
        source: system
        description: "Negotiated attrition allowance carried from the awarded proposal"
      - name: cancellation_schedule
        type: array
        source: system
        description: "Negotiated cancellation tiers carried from the awarded proposal"
      - name: force_majeure_scope
        type: enum
        source: system
        description: "Negotiated force majeure breadth; NARROW forces an extra LEGAL approval step"
        constraints: "one of {NARROW, STANDARD, BROAD}"
      - name: rebooking_credit_pct
        type: number
        source: system
        description: "Negotiated rebooking-credit fraction applied to the cancellation fee on termination"
      - name: service_charge_pct
        type: number
        source: system
        description: "Snapshot of Proposal.service_charge_pct at award"
      - name: tax_pct
        type: number
        source: system
        description: "Snapshot of Proposal.tax_pct at award"
      - name: resort_fee_usd_per_night
        type: number
        source: system
        description: "Snapshot of Proposal.resort_fee_usd_per_night at award"
      - name: fnb_minimum_usd
        type: number
        source: system
        description: "Snapshot of Proposal.fnb_minimum_usd at award"
      - name: concession_applied_usd
        type: number
        source: system
        description: "Capped concession credit snapshotted at award; deducted again in the post-event model"
      - name: deposit_total_usd
        type: number
        source: computed
        description: "DEPOSIT_PCT of contracted_total_usd; null until the deposit schedule is generated"
      - name: deposit_paid_usd
        type: number
        source: computed
        default: 0.00
        description: "Sum of DepositInstallment.paid_amount_usd for installments whose status == PAID"
      - name: deposit_outstanding_usd
        type: number
        source: computed
        description: "Sum of DepositInstallment.amount_usd for installments whose status == SCHEDULED; null until the schedule exists"
      - name: approval_step_count
        type: integer
        source: computed
        default: 0
        description: "Count of ApprovalStep rows on this contract"
      - name: planner_signatory_name
        type: string
        source: system
        description: "Name captured when the planner signs; null before"
      - name: venue_signatory_name
        type: string
        source: system
        description: "Name captured when the venue countersigns; null before"
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which signature_state became EXECUTED; null before"
      - name: terminated_at
        type: datetime
        source: system
        description: "Logical-clock instant at which signature_state became TERMINATED; null otherwise"
      - name: cancellation_fee_usd
        type: number
        source: system
        description: "Fee charged by calculations.contract_cancellation_fee at termination; null otherwise"
      - name: rebooking_credit_usd
        type: number
        source: system
        description: "cancellation_fee_usd multiplied by rebooking_credit_pct at termination; null otherwise"
      - name: termination_reason
        type: string
        source: system
        description: "Reason recorded at termination; null otherwise"

  - name: ApprovalStep
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: system
        description: "FK -> Contract.id; the contract this step gates"
      - name: step_seq
        type: integer
        source: system
        description: "1-based position in the approval chain; steps must be decided in ascending step_seq"
      - name: approval_level
        type: enum
        source: system
        description: "Which control this step represents"
        constraints: "one of {PROGRAM_COMPLIANCE, MANAGER, VP, LEGAL}"
      - name: required_role
        type: enum
        source: system
        description: "Role whose X-User-Role may decide this step: ProgramAdmin for PROGRAM_COMPLIANCE, ContractApprover for MANAGER, VP and LEGAL"
        constraints: "one of {ProgramAdmin, ContractApprover}"
      - name: decision
        type: enum
        source: system
        default: PENDING
        description: "Step disposition"
        constraints: "one of {PENDING, APPROVED, REJECTED, SKIPPED}"
      - name: approver_user_id
        type: string
        source: system
        description: "X-User-ID that decided the step; null while PENDING or SKIPPED"
      - name: decision_note
        type: string
        source: system
        description: "Free-text note captured with the decision; null when omitted"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the decision; null while PENDING"

  - name: DepositInstallment
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: system
        description: "FK -> Contract.id; the contract this installment funds"
      - name: installment_seq
        type: integer
        source: system
        description: "1-based installment position; installments must be paid in ascending installment_seq"
      - name: weight_pct
        type: number
        source: system
        description: "Share of Contract.deposit_total_usd this installment carries, from DEPOSIT_WEIGHTS"
      - name: amount_usd
        type: number
        source: system
        description: "Rounded installment amount; the final installment absorbs the rounding residual"
      - name: due_date
        type: string
        source: system
        description: "YYYY-MM-DD, derived from MeetingEvent.start_date minus DEPOSIT_OFFSET_DAYS[installment_seq]"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Installment lifecycle state"
        constraints: "one of {SCHEDULED, PAID, CANCELLED}"
      - name: paid_amount_usd
        type: number
        source: system
        description: "Amount actually paid; null while SCHEDULED or CANCELLED"
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock instant of payment; null while SCHEDULED or CANCELLED"
      - name: payment_reference
        type: string
        source: system
        description: "Treasury reference captured at payment; null when omitted"

  - name: PostEventReport
    parent: MeetingEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: system
        description: "FK -> MeetingEvent.id; the concluded event"
      - name: contract_id
        type: string
        source: system
        description: "FK -> Contract.id; the executed contract the actuals are measured against"
      - name: actual_room_nights
        type: integer
        source: input
        description: "Room nights actually consumed"
        constraints: ">= 0"
      - name: actual_fnb_usd
        type: number
        source: input
        description: "Food-and-beverage actually spent"
        constraints: ">= 0"
      - name: actual_av_usd
        type: number
        source: input
        description: "Audiovisual actually spent"
        constraints: ">= 0"
      - name: attrition_allowed_nights
        type: integer
        source: computed
        description: "floor(Contract.contracted_paid_room_nights * (1 - Contract.attrition_allowance_pct))"
      - name: attrition_shortfall_nights
        type: integer
        source: computed
        description: "max(0, attrition_allowed_nights - actual_room_nights)"
      - name: attrition_charge_usd
        type: number
        source: computed
        description: "attrition_shortfall_nights * Contract.contracted_room_rate_usd * ATTRITION_DAMAGE_PCT, rounded to cents"
      - name: actual_room_cost_usd
        type: number
        source: computed
        description: "Contract.contracted_room_rate_usd * actual_room_nights, rounded to cents"
      - name: realized_service_charge_usd
        type: number
        source: computed
        description: "Service charge on the actual room+F&B+AV base"
      - name: realized_tax_usd
        type: number
        source: computed
        description: "Tax on the actual room+resort+F&B+AV+service-charge base"
      - name: realized_total_usd
        type: number
        source: computed
        description: "Final realized cost including attrition damages and net of the snapshotted concession"
      - name: benchmark_room_cost_usd
        type: number
        source: computed
        description: "RateBenchmark.benchmark_adr_usd * actual_room_nights, rounded to cents"
      - name: savings_vs_benchmark_usd
        type: number
        source: computed
        description: "benchmark_room_cost_usd minus actual_room_cost_usd"
      - name: savings_vs_budget_usd
        type: number
        source: computed
        description: "MeetingEvent.budget_ceiling_usd minus realized_total_usd"
      - name: notes
        type: string
        source: input
        description: "Free-text closeout notes; null when omitted"

  - name: SupplierPerformanceReview
    parent: Venue
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the supplier being scored"
      - name: event_id
        type: string
        source: input
        description: "FK -> MeetingEvent.id; the COMPLETED event the score came from; null when review_source == EXTERNAL"
      - name: review_source
        type: enum
        source: input
        description: "EVENT for a scorecard tied to a COMPLETED event in this system, EXTERNAL for an imported program-history scorecard"
        constraints: "one of {EVENT, EXTERNAL}"
      - name: service_score
        type: integer
        source: input
        description: "Service quality, 1-5"
        constraints: ">= 1 and <= 5"
      - name: value_score
        type: integer
        source: input
        description: "Value for money, 1-5"
        constraints: ">= 1 and <= 5"
      - name: av_quality_score
        type: integer
        source: input
        description: "Audiovisual quality, 1-5"
        constraints: ">= 1 and <= 5"
      - name: responsiveness_score
        type: integer
        source: input
        description: "Responsiveness during sourcing, 1-5"
        constraints: ">= 1 and <= 5"
      - name: composite_score
        type: number
        source: computed
        description: "Weighted composite of the four scores; see calculations.venue_performance_score"
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID that captured the review; opaque operator id"
      - name: comment
        type: string
        source: input
        description: "Free-text comment; null when omitted"

state_machines:
  - entity: MeetingEvent
    state_field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: REQUIREMENTS_LOCKED
        trigger: "POST /sourcing/events/{id}/lock-requirements"
        actor: SourcingManager
        preconditions:
          - "status == DRAFT"
          - "peak_attendees >= 1 and requested_room_nights >= 1 and budget_ceiling_usd > 0"
          - "no VenueShortlistEntry is required to exist yet; shortlisting opens only after this transition"
        side_effects:
          - "no child mutation; requirement fields become immutable inputs for all downstream calculations"
      - from: REQUIREMENTS_LOCKED
        to: SOURCING
        trigger: "POST /sourcing/rfps/{id}/issue (system side effect on the parent event)"
        actor: system
        preconditions:
          - "the issued Rfp.round_number == 1 and Rfp.event_id == this event"
        side_effects:
          - "each invited VenueShortlistEntry.status becomes RFP_ISSUED"
          - "one Proposal per invited entry is created in INVITED"
      - from: SOURCING
        to: BID_REVIEW
        trigger: "POST /sourcing/rfps/{id}/close (system side effect on the parent event)"
        actor: system
        preconditions:
          - "the closed Rfp.event_id == this event and Rfp.status == ISSUED"
        side_effects:
          - "every Proposal of that Rfp whose status == INVITED becomes EXPIRED"
          - "best_total_cost_usd recomputed by calculations.event_sourcing_rollup"
      - from: BID_REVIEW
        to: SOURCING
        trigger: "POST /sourcing/rfps/{id}/issue for an Rfp whose round_number > 1 (system side effect)"
        actor: system
        preconditions:
          - "the issued Rfp.previous_rfp_id references an Rfp of this event whose status == CLOSED"
        side_effects:
          - "one Proposal per invited entry is created in INVITED for the new round"
        note: "This edge plus SOURCING -> BID_REVIEW forms the negotiation-round cycle on MeetingEvent."
      - from: BID_REVIEW
        to: AWARDED
        trigger: "POST /sourcing/events/{id}/award"
        actor: SourcingManager
        preconditions:
          - "status == BID_REVIEW"
          - "the target Proposal.status == UNDER_REVIEW and its Rfp.event_id == this event"
          - "expected_event_version == this event's current version"
          - "at least one BidEvaluation exists on the target Proposal with basis == CONTRACTED_BASIS"
          - "target Proposal.total_cost_contracted_usd <= budget_ceiling_usd"
        side_effects:
          - "a Contract is created with approval_state PENDING_ROUTING and signature_state UNSIGNED, snapshotting the proposal terms and running calculations.contract_volume_rebate"
          - "awarded_proposal_id set to the target Proposal.id"
          - "committed_spend_usd set to Contract.contracted_total_usd and budget_remaining_usd recomputed"
          - "target Proposal.status becomes AWARDED (cascade L1 of the award chain)"
      - from: AWARDED
        to: AWARDED
        trigger: "POST /sourcing/events/{id}/award naming a different Proposal (supersede)"
        actor: SourcingManager
        preconditions:
          - "status == AWARDED"
          - "the existing Contract.signature_state != EXECUTED"
          - "expected_event_version == this event's current version"
        side_effects:
          - "prior Contract.approval_state becomes CANCELLED and its signature_state becomes VOIDED"
          - "prior awarded Proposal.status becomes REJECTED"
          - "awarded_proposal_id, committed_spend_usd and budget_remaining_usd re-point at the new Contract"
        note: "Self-loop; the legitimate supersede that makes concurrency_rules.award-with-stale-event a true race."
      - from: AWARDED
        to: BID_REVIEW
        trigger: "POST /sourcing/approval-steps/{id}/decide with decision REJECTED (system side effect)"
        actor: system
        preconditions:
          - "the rejected step's Contract.event_id == this event and that Contract.signature_state != EXECUTED"
        side_effects:
          - "awarded_proposal_id cleared to null"
          - "committed_spend_usd reset to 0.00 and budget_remaining_usd recomputed"
      - from: AWARDED
        to: CONTRACTED
        trigger: "system join when Contract.signature_state becomes EXECUTED"
        actor: system
        preconditions:
          - "the Contract of this event has approval_state == APPROVED and signature_state == EXECUTED"
        side_effects:
          - "Venue.blocked_room_nights increased by Contract.contracted_paid_room_nights"
          - "awarded VenueShortlistEntry.status becomes AWARDED"
      - from: CONTRACTED
        to: CANCELLED
        trigger: "POST /sourcing/contracts/{id}/terminate (system side effect)"
        actor: system
        preconditions:
          - "the terminated Contract.event_id == this event"
        side_effects:
          - "committed_spend_usd reset to 0.00"
          - "cancellation_liability_usd increased by Contract.cancellation_fee_usd"
          - "budget_remaining_usd recomputed so calculations.budget_envelope_invariant still holds"
      - from: CONTRACTED
        to: COMPLETED
        trigger: "POST /sourcing/events/{id}/post-event-report"
        actor: SourcingManager
        preconditions:
          - "status == CONTRACTED"
          - "the current logical clock is strictly after end_date at 23:59:59.999Z"
          - "no PostEventReport already exists for this event"
        side_effects:
          - "a PostEventReport is created and savings_recognized_usd set to its savings_vs_budget_usd"

  - entity: VenueShortlistEntry
    state_field: status
    initial_state: CANDIDATE
    terminal_states: [AWARDED, ELIMINATED]
    transitions:
      - from: CANDIDATE
        to: SHORTLISTED
        trigger: "POST /sourcing/shortlist-entries/{id}/shortlist"
        actor: SourcingManager
        preconditions:
          - "status == CANDIDATE"
          - "parent MeetingEvent.status IN {REQUIREMENTS_LOCKED, SOURCING, BID_REVIEW}"
          - "Venue.preferred_supplier_status != SUSPENDED"
          - "if MeetingEvent.preferred_program_only == true then program_status_at_shortlist == IN_PROGRAM"
        side_effects:
          - "MeetingEvent.shortlisted_venue_count incremented"
      - from: SHORTLISTED
        to: INSPECTION_SCHEDULED
        trigger: "POST /sourcing/site-inspections (system side effect on the referenced entry)"
        actor: system
        preconditions:
          - "status == SHORTLISTED"
        side_effects:
          - "inspection_count incremented"
      - from: INSPECTION_SCHEDULED
        to: INSPECTED
        trigger: "POST /sourcing/site-inspections/{id}/complete (system side effect)"
        actor: system
        preconditions:
          - "the completed SiteInspection.shortlist_entry_id == this entry"
        side_effects:
          - "no further child mutation"
      - from: INSPECTION_SCHEDULED
        to: SHORTLISTED
        trigger: "POST /sourcing/site-inspections/{id}/cancel (system side effect)"
        actor: system
        preconditions:
          - "after the cancellation, inspection_count == 0"
        side_effects:
          - "inspection_count decremented to 0"
        note: "Revert edge; lets a cancelled inspection be re-planned without eliminating the venue."
      - from: SHORTLISTED
        to: RFP_ISSUED
        trigger: "POST /sourcing/rfps/{id}/issue (system side effect)"
        actor: system
        preconditions:
          - "status IN {SHORTLISTED, INSPECTION_SCHEDULED, INSPECTED}"
          - "if inspection_required == true then status == INSPECTED"
        side_effects:
          - "a Proposal is created for this entry's venue in status INVITED"
      - from: INSPECTED
        to: RFP_ISSUED
        trigger: "POST /sourcing/rfps/{id}/issue (system side effect)"
        actor: system
        preconditions:
          - "status == INSPECTED"
        side_effects:
          - "a Proposal is created for this entry's venue in status INVITED"
      - from: INSPECTION_SCHEDULED
        to: RFP_ISSUED
        trigger: "POST /sourcing/rfps/{id}/issue (system side effect)"
        actor: system
        preconditions:
          - "status == INSPECTION_SCHEDULED and inspection_required == false"
        side_effects:
          - "a Proposal is created for this entry's venue in status INVITED"
      - from: RFP_ISSUED
        to: AWARDED
        trigger: "system join when the event's Contract.signature_state becomes EXECUTED"
        actor: system
        preconditions:
          - "this entry's venue_id == Contract.venue_id and event_id == Contract.event_id"
        side_effects:
          - "no further child mutation"
      - from: RFP_ISSUED
        to: ELIMINATED
        trigger: "POST /sourcing/events/{id}/award (cascade L3) or POST /sourcing/shortlist-entries/{id}/eliminate"
        actor: system
        preconditions:
          - "status NOT IN {AWARDED, ELIMINATED}"
        side_effects:
          - "elimination_reason set to NOT_SELECTED for the award cascade, or to the caller-supplied reason"
          - "every SiteInspection of this entry whose status == PLANNED becomes CANCELLED (cascade L4)"
      - from: CANDIDATE
        to: ELIMINATED
        trigger: "POST /sourcing/shortlist-entries/{id}/eliminate"
        actor: SourcingManager
        preconditions:
          - "status == CANDIDATE"
        side_effects:
          - "elimination_reason set from the request body"
      - from: SHORTLISTED
        to: ELIMINATED
        trigger: "POST /sourcing/shortlist-entries/{id}/eliminate"
        actor: SourcingManager
        preconditions:
          - "status == SHORTLISTED"
        side_effects:
          - "elimination_reason set from the request body"
          - "MeetingEvent.shortlisted_venue_count decremented"
      - from: INSPECTION_SCHEDULED
        to: ELIMINATED
        trigger: "POST /sourcing/shortlist-entries/{id}/eliminate"
        actor: SourcingManager
        preconditions:
          - "status == INSPECTION_SCHEDULED"
        side_effects:
          - "elimination_reason set from the request body"
          - "every SiteInspection of this entry whose status == PLANNED becomes CANCELLED"
          - "MeetingEvent.shortlisted_venue_count decremented"
      - from: INSPECTED
        to: ELIMINATED
        trigger: "POST /sourcing/shortlist-entries/{id}/eliminate"
        actor: SourcingManager
        preconditions:
          - "status == INSPECTED"
        side_effects:
          - "elimination_reason set from the request body"
          - "MeetingEvent.shortlisted_venue_count decremented"

  - entity: SiteInspection
    state_field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /sourcing/site-inspections/{id}/complete"
        actor: SourcingManager
        preconditions:
          - "status == PLANNED"
          - "the current logical clock is at or after window_end"
        side_effects:
          - "findings_score persisted"
          - "parent VenueShortlistEntry.status becomes INSPECTED"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /sourcing/site-inspections/{id}/cancel, or cascade L4 of the award chain"
        actor: SourcingManager
        preconditions:
          - "status == PLANNED"
        side_effects:
          - "cancel_reason persisted"
          - "parent VenueShortlistEntry.inspection_count decremented, and its status reverts to SHORTLISTED when inspection_count reaches 0 and the entry is still INSPECTION_SCHEDULED"
          - "the venue occupation interval [window_start, occupied_until) is released so a later inspection may reuse it"

  - entity: Rfp
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /sourcing/rfps/{id}/issue"
        actor: SourcingManager
        preconditions:
          - "status == DRAFT"
          - "parent MeetingEvent.status IN {REQUIREMENTS_LOCKED, BID_REVIEW}"
          - "at least one VenueShortlistEntry of the event has status IN {SHORTLISTED, INSPECTION_SCHEDULED, INSPECTED}"
          - "every such entry with inspection_required == true has status == INSPECTED"
          - "response_due_at is strictly after the current logical clock"
        side_effects:
          - "issued_at stamped from the logical clock"
          - "one Proposal in INVITED is created per eligible entry; invited_count set to that count"
          - "every eligible VenueShortlistEntry.status becomes RFP_ISSUED"
          - "parent MeetingEvent.status becomes SOURCING"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /sourcing/rfps/{id}/close"
        actor: SourcingManager
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "closed_at stamped from the logical clock"
          - "every Proposal of this Rfp whose status == INVITED becomes EXPIRED"
          - "parent MeetingEvent.status becomes BID_REVIEW and its best_total_cost_usd is recomputed"

  - entity: Proposal
    state_field: status
    initial_state: INVITED
    terminal_states: [AWARDED, REJECTED, DECLINED, WITHDRAWN, EXPIRED]
    transitions:
      - from: INVITED
        to: SUBMITTED
        trigger: "POST /sourcing/proposals/{id}/submit"
        actor: VenueRep
        preconditions:
          - "status == INVITED"
          - "X-User-ID == this Proposal.venue_id"
          - "parent Rfp.status == ISSUED"
          - "the current logical clock is at or before Rfp.response_due_at"
          - "a RateBenchmark exists for (Venue.destination_tier, MeetingEvent.program_type)"
        side_effects:
          - "all quoted terms persisted; submitted_at stamped from the logical clock"
          - "net_adr_usd, comp_room_nights, paid_room_nights and total_cost_contracted_usd recomputed by calculations.proposal_total_cost_model (CONTRACTED_BASIS)"
          - "benchmark_variance_pct and compliance_status recomputed by calculations.rate_benchmark_compliance"
          - "parent Rfp.submitted_count incremented"
          - "MeetingEvent.best_total_cost_usd recomputed by calculations.event_sourcing_rollup"
      - from: INVITED
        to: DECLINED
        trigger: "POST /sourcing/proposals/{id}/decline"
        actor: VenueRep
        preconditions:
          - "status == INVITED"
          - "X-User-ID == this Proposal.venue_id"
        side_effects:
          - "the matching VenueShortlistEntry is left untouched so the planner may re-invite in a later round"
      - from: INVITED
        to: EXPIRED
        trigger: "POST /sourcing/rfps/{id}/close (system side effect)"
        actor: system
        preconditions:
          - "status == INVITED at the moment the parent Rfp closes"
        side_effects:
          - "no further child mutation"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /sourcing/proposals/{id}/evaluate"
        actor: SourcingManager
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, REVISED}"
        side_effects:
          - "a BidEvaluation row is appended for the requested basis"
          - "total_cost_modeled_usd and last_evaluation_basis set from that row"
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /sourcing/proposals/{id}/evaluate with the other basis (re-evaluation)"
        actor: SourcingManager
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "an additional immutable BidEvaluation row is appended; earlier rows are never mutated"
          - "total_cost_modeled_usd and last_evaluation_basis overwritten by the newest row"
      - from: REVISED
        to: UNDER_REVIEW
        trigger: "POST /sourcing/proposals/{id}/evaluate"
        actor: SourcingManager
        preconditions:
          - "status == REVISED"
        side_effects:
          - "a BidEvaluation row is appended against the revised terms"
        note: "Closes the negotiation cycle UNDER_REVIEW -> COUNTERED -> REVISED -> UNDER_REVIEW."
      - from: UNDER_REVIEW
        to: COUNTERED
        trigger: "POST /sourcing/proposals/{id}/counters"
        actor: SourcingManager
        preconditions:
          - "status == UNDER_REVIEW"
          - "expected_proposal_version == this Proposal's current version"
          - "parent Rfp.status == ISSUED"
        side_effects:
          - "a NegotiationCounter row is created with resolution OPEN and round_seq = negotiation_round_count + 1"
          - "negotiation_round_count incremented and version incremented by 1"
      - from: COUNTERED
        to: REVISED
        trigger: "POST /sourcing/proposals/{id}/revise"
        actor: VenueRep
        preconditions:
          - "status == COUNTERED"
          - "X-User-ID == this Proposal.venue_id"
          - "the referenced NegotiationCounter belongs to this proposal and its resolution == OPEN"
        side_effects:
          - "the referenced NegotiationCounter.resolution becomes ACCEPTED when accepted == true, else DECLINED_BY_VENUE, and resolved_at is stamped"
          - "supplied revised_* terms overwrite the corresponding quoted terms"
          - "total_cost_contracted_usd, benchmark_variance_pct and compliance_status recomputed"
          - "MeetingEvent.best_total_cost_usd recomputed by calculations.event_sourcing_rollup"
      - from: UNDER_REVIEW
        to: AWARDED
        trigger: "POST /sourcing/events/{id}/award"
        actor: SourcingManager
        preconditions:
          - "status == UNDER_REVIEW"
          - "at least one BidEvaluation with basis == CONTRACTED_BASIS exists on this proposal"
          - "total_cost_contracted_usd <= MeetingEvent.budget_ceiling_usd"
        side_effects:
          - "cascade L1: a Contract is minted from this proposal's snapshotted terms"
          - "cascade L2: because this proposal became AWARDED, every sibling Proposal of the same Rfp whose status IN {SUBMITTED, UNDER_REVIEW, COUNTERED, REVISED} becomes REJECTED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "cascade L2 of POST /sourcing/events/{id}/award on a sibling proposal"
        actor: system
        preconditions:
          - "a sibling Proposal of the same Rfp became AWARDED"
        side_effects:
          - "cascade L3: because this proposal became REJECTED, its matching VenueShortlistEntry becomes ELIMINATED with elimination_reason NOT_SELECTED"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "cascade L2 of POST /sourcing/events/{id}/award on a sibling proposal"
        actor: system
        preconditions:
          - "a sibling Proposal of the same Rfp became AWARDED"
        side_effects:
          - "cascade L3: because this proposal became REJECTED, its matching VenueShortlistEntry becomes ELIMINATED with elimination_reason NOT_SELECTED"
      - from: COUNTERED
        to: REJECTED
        trigger: "cascade L2 of POST /sourcing/events/{id}/award on a sibling proposal"
        actor: system
        preconditions:
          - "a sibling Proposal of the same Rfp became AWARDED"
        side_effects:
          - "cascade L3: its matching VenueShortlistEntry becomes ELIMINATED with elimination_reason NOT_SELECTED"
          - "every OPEN NegotiationCounter on this proposal keeps resolution OPEN; counters are never retro-resolved"
      - from: REVISED
        to: REJECTED
        trigger: "cascade L2 of POST /sourcing/events/{id}/award on a sibling proposal"
        actor: system
        preconditions:
          - "a sibling Proposal of the same Rfp became AWARDED"
        side_effects:
          - "cascade L3: its matching VenueShortlistEntry becomes ELIMINATED with elimination_reason NOT_SELECTED"
      - from: AWARDED
        to: REJECTED
        trigger: "award supersede, or cascade L3 of POST /sourcing/approval-steps/{id}/decide with decision REJECTED"
        actor: system
        preconditions:
          - "status == AWARDED and the Contract minted from this proposal has signature_state IN {UNSIGNED, PLANNER_SIGNED, COUNTERSIGNED, VOIDED}"
        side_effects:
          - "MeetingEvent.awarded_proposal_id is cleared unless a replacement award set it in the same request"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /sourcing/proposals/{id}/withdraw"
        actor: VenueRep
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, COUNTERED, REVISED}"
          - "X-User-ID == this Proposal.venue_id"
        side_effects:
          - "parent Rfp.submitted_count decremented"
          - "MeetingEvent.best_total_cost_usd recomputed by calculations.event_sourcing_rollup"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /sourcing/proposals/{id}/withdraw"
        actor: VenueRep
        preconditions:
          - "status == UNDER_REVIEW and X-User-ID == this Proposal.venue_id"
        side_effects:
          - "parent Rfp.submitted_count decremented"
          - "MeetingEvent.best_total_cost_usd recomputed"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /sourcing/proposals/{id}/withdraw"
        actor: VenueRep
        preconditions:
          - "status == COUNTERED and X-User-ID == this Proposal.venue_id"
        side_effects:
          - "parent Rfp.submitted_count decremented"
          - "every OPEN NegotiationCounter on this proposal keeps resolution OPEN"
      - from: REVISED
        to: WITHDRAWN
        trigger: "POST /sourcing/proposals/{id}/withdraw"
        actor: VenueRep
        preconditions:
          - "status == REVISED and X-User-ID == this Proposal.venue_id"
        side_effects:
          - "parent Rfp.submitted_count decremented"
          - "MeetingEvent.best_total_cost_usd recomputed"

  - entity: Contract
    state_field: approval_state
    dimension: approval
    initial_state: PENDING_ROUTING
    terminal_states: [APPROVED, REJECTED, CANCELLED]
    note: "Dimension 1 of 2 on Contract. Evolves independently of signature_state; the two dimensions join at signature_state EXECUTED."
    transitions:
      - from: PENDING_ROUTING
        to: IN_APPROVAL
        trigger: "POST /sourcing/contracts/{id}/route-approvals"
        actor: SourcingManager
        preconditions:
          - "approval_state == PENDING_ROUTING"
          - "signature_state NOT IN {TERMINATED, VOIDED}"
        side_effects:
          - "ApprovalStep rows generated by calculations.approval_route_generation; approval_step_count set to their count"
      - from: IN_APPROVAL
        to: APPROVED
        trigger: "POST /sourcing/approval-steps/{id}/decide with decision APPROVED on the highest step_seq (system side effect)"
        actor: system
        preconditions:
          - "every ApprovalStep of this contract has decision == APPROVED"
        side_effects:
          - "join with the signature dimension: when signature_state == COUNTERSIGNED it immediately advances to EXECUTED, otherwise the join waits for the countersignature"
      - from: IN_APPROVAL
        to: REJECTED
        trigger: "POST /sourcing/approval-steps/{id}/decide with decision REJECTED (system side effect, cascade L1)"
        actor: system
        preconditions:
          - "the decided ApprovalStep.contract_id == this contract"
        side_effects:
          - "cascade L2: because approval_state became REJECTED, every remaining ApprovalStep of this contract whose decision == PENDING becomes SKIPPED, and signature_state moves to VOIDED from UNSIGNED, PLANNER_SIGNED or COUNTERSIGNED"
          - "cascade L2: every DepositInstallment of this contract whose status == SCHEDULED becomes CANCELLED"
          - "cascade L3: because signature_state became VOIDED, the awarded Proposal.status becomes REJECTED, MeetingEvent.awarded_proposal_id is cleared, committed_spend_usd resets to 0.00 and MeetingEvent.status returns from AWARDED to BID_REVIEW"
      - from: PENDING_ROUTING
        to: CANCELLED
        trigger: "award supersede on the parent MeetingEvent (system side effect)"
        actor: system
        preconditions:
          - "a new Contract was minted for the same event while this one was not EXECUTED"
        side_effects:
          - "signature_state becomes VOIDED"
      - from: IN_APPROVAL
        to: CANCELLED
        trigger: "award supersede on the parent MeetingEvent (system side effect)"
        actor: system
        preconditions:
          - "a new Contract was minted for the same event while this one was not EXECUTED"
        side_effects:
          - "every PENDING ApprovalStep of this contract becomes SKIPPED"
          - "signature_state becomes VOIDED"

  - entity: Contract
    state_field: signature_state
    dimension: signature
    initial_state: UNSIGNED
    terminal_states: [TERMINATED, VOIDED]
    note: "Dimension 2 of 2 on Contract. The planner may sign before approvals finish; EXECUTED is the fork-join of both dimensions and is reachable from either side."
    transitions:
      - from: UNSIGNED
        to: PLANNER_SIGNED
        trigger: "POST /sourcing/contracts/{id}/sign"
        actor: SourcingManager
        preconditions:
          - "signature_state == UNSIGNED"
          - "approval_state NOT IN {REJECTED, CANCELLED}"
        side_effects:
          - "planner_signatory_name persisted"
        note: "Deliberately does NOT require approval_state == APPROVED; the dimensions are independent."
      - from: PLANNER_SIGNED
        to: COUNTERSIGNED
        trigger: "POST /sourcing/contracts/{id}/countersign"
        actor: VenueRep
        preconditions:
          - "signature_state == PLANNER_SIGNED"
          - "X-User-ID == this Contract.venue_id"
          - "approval_state NOT IN {REJECTED, CANCELLED}"
          - "peak_rooms_per_night + Venue.blocked_room_nights_from_overlapping_executed_contracts <= Venue.guest_rooms_total"
        side_effects:
          - "venue_signatory_name persisted"
          - "when approval_state == APPROVED the contract immediately advances to EXECUTED in the same request"
      - from: COUNTERSIGNED
        to: EXECUTED
        trigger: "system join: countersignature with approval_state == APPROVED, or the final APPROVED step arriving after countersignature"
        actor: system
        preconditions:
          - "signature_state == COUNTERSIGNED and approval_state == APPROVED"
        side_effects:
          - "executed_at stamped from the logical clock"
          - "Venue.blocked_room_nights increased by contracted_paid_room_nights"
          - "the awarded VenueShortlistEntry.status becomes AWARDED"
          - "parent MeetingEvent.status becomes CONTRACTED"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /sourcing/contracts/{id}/terminate"
        actor: SourcingManager
        preconditions:
          - "signature_state == EXECUTED"
          - "the current logical clock is strictly before MeetingEvent.start_date at 00:00:00.000Z"
        side_effects:
          - "cancellation_fee_usd and rebooking_credit_usd computed by calculations.contract_cancellation_fee; terminated_at stamped"
          - "Venue.blocked_room_nights decreased by contracted_paid_room_nights, restoring calculations.room_night_inventory_invariant"
          - "every DepositInstallment of this contract whose status == SCHEDULED becomes CANCELLED and deposit_outstanding_usd becomes 0.00"
          - "MeetingEvent.committed_spend_usd resets to 0.00, cancellation_liability_usd increases by cancellation_fee_usd, and MeetingEvent.status becomes CANCELLED"
      - from: UNSIGNED
        to: VOIDED
        trigger: "approval rejection cascade L2, or award supersede"
        actor: system
        preconditions:
          - "approval_state IN {REJECTED, CANCELLED}"
        side_effects:
          - "cascade L3 on the awarded Proposal and parent MeetingEvent as described on the approval dimension"
      - from: PLANNER_SIGNED
        to: VOIDED
        trigger: "approval rejection cascade L2, or award supersede"
        actor: system
        preconditions:
          - "approval_state IN {REJECTED, CANCELLED}"
        side_effects:
          - "cascade L3 on the awarded Proposal and parent MeetingEvent as described on the approval dimension"
      - from: COUNTERSIGNED
        to: VOIDED
        trigger: "approval rejection cascade L2"
        actor: system
        preconditions:
          - "approval_state == REJECTED"
        side_effects:
          - "cascade L3 on the awarded Proposal and parent MeetingEvent as described on the approval dimension"

  - entity: ApprovalStep
    state_field: decision
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, SKIPPED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /sourcing/approval-steps/{id}/decide with decision APPROVED"
        actor: ContractApprover
        preconditions:
          - "decision == PENDING"
          - "parent Contract.approval_state == IN_APPROVAL"
          - "X-User-Role == required_role"
          - "every ApprovalStep of the same contract with a lower step_seq has decision == APPROVED"
          - "X-User-ID != parent Contract.awarded_by_user_id"
          - "X-User-ID is not already the approver_user_id of another ApprovalStep of the same contract"
        side_effects:
          - "approver_user_id and decided_at persisted"
          - "when this is the highest step_seq, parent Contract.approval_state becomes APPROVED"
      - from: PENDING
        to: REJECTED
        trigger: "POST /sourcing/approval-steps/{id}/decide with decision REJECTED"
        actor: ContractApprover
        preconditions:
          - "decision == PENDING"
          - "parent Contract.approval_state == IN_APPROVAL"
          - "X-User-Role == required_role"
          - "every ApprovalStep of the same contract with a lower step_seq has decision == APPROVED"
          - "X-User-ID != parent Contract.awarded_by_user_id"
        side_effects:
          - "approver_user_id and decided_at persisted"
          - "parent Contract.approval_state becomes REJECTED, starting the three-hop rejection cascade"
      - from: PENDING
        to: SKIPPED
        trigger: "cascade L2 of an approval rejection, or an award supersede cancelling the contract"
        actor: system
        preconditions:
          - "parent Contract.approval_state IN {REJECTED, CANCELLED}"
        side_effects:
          - "approver_user_id stays null; decided_at stays null"

  - entity: DepositInstallment
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /sourcing/deposit-installments/{id}/pay"
        actor: FinanceController
        preconditions:
          - "status == SCHEDULED"
          - "parent Contract.signature_state == EXECUTED"
          - "every DepositInstallment of the same contract with a lower installment_seq has status == PAID"
          - "paid_amount_usd == amount_usd exactly"
        side_effects:
          - "paid_amount_usd, payment_reference and paid_at persisted"
          - "parent Contract.deposit_paid_usd increased by amount_usd and deposit_outstanding_usd decreased by amount_usd"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "contract termination, approval rejection cascade L2, or award supersede"
        actor: system
        preconditions:
          - "parent Contract.signature_state IN {TERMINATED, VOIDED} or approval_state IN {REJECTED, CANCELLED}"
        side_effects:
          - "parent Contract.deposit_outstanding_usd reduced by amount_usd"

concurrency_rules:
  - rule_id: award-with-stale-event
    parent_entity: MeetingEvent
    write_endpoint: "POST /sourcing/events/{id}/award"
    occ_field: "expected_event_version"
    description: |
      Awarding a Proposal against a MeetingEvent whose version has advanced since the client last read
      it is rejected with a stale-version error. The product deliberately allows a later award to
      supersede an earlier one while the prior Contract is not yet EXECUTED, so a second award carrying
      a fresh version legitimately succeeds; only the stale view is refused.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
  - rule_id: counter-with-stale-proposal
    parent_entity: Proposal
    write_endpoint: "POST /sourcing/proposals/{id}/counters"
    occ_field: "expected_proposal_version"
    description: |
      Raising a NegotiationCounter against a Proposal whose version has advanced since the client last
      read it is rejected with a stale-version error. Multiple counters on one proposal are a normal
      negotiation pattern, so a counter carrying a fresh version legitimately succeeds; only the stale
      view is refused.
    error_id: ERR_STALE_PROPOSAL_VERSION
    http_status: 412

calculations:
  - name: proposal_total_cost_model
    trigger: "On POST /sourcing/proposals/{id}/submit and POST /sourcing/proposals/{id}/revise for the CONTRACTED_BASIS figure written to Proposal.total_cost_contracted_usd, and on POST /sourcing/proposals/{id}/evaluate for the requested basis written to a new BidEvaluation row and to Proposal.total_cost_modeled_usd"
    algorithm: tiered_pricing
    formula: |
      # --- shared preamble (both variants) ---
      comp_room_nights = 0 if comp_room_ratio == 0 else floor(room_nights_offered / comp_room_ratio)
      paid_room_nights = room_nights_offered - comp_room_nights
      net_adr_usd      = round(room_rate_usd * (1 - commission_pct), 2) if rate_type == "GROSS"
                         else round(room_rate_usd, 2)
      av_adjusted_usd  = round(av_estimate_usd * 1.00, 2) if av_estimate_usd <= AV_TIER_1_MAX
                         else round(av_estimate_usd * 0.95, 2) if av_estimate_usd <= AV_TIER_2_MAX
                         else round(av_estimate_usd * 0.90, 2)

      # --- nights charged, per variant ---
      # CONTRACTED_BASIS: charge the full contracted block.
      nights_used = paid_room_nights
      attrition_damages_usd = 0.00
      # ACTUALIZED_BASIS: charge a shrunken block and add damages when the shrink
      # falls below the negotiated attrition allowance.
      #   projected_paid_nights = ceil(paid_room_nights * (1 - ATTRITION_SHRINK_ASSUMPTION))
      #   allowance_floor_nights = floor(paid_room_nights * (1 - attrition_allowance_pct))
      #   shortfall_nights = max(0, allowance_floor_nights - projected_paid_nights)
      #   attrition_damages_usd = round(shortfall_nights * net_adr_usd * ATTRITION_DAMAGE_PCT, 2)
      #   nights_used = projected_paid_nights

      # --- pinned evaluation order, identical for both variants ---
      room_revenue_usd     = round(net_adr_usd * nights_used, 2)
      resort_fee_total_usd = round(resort_fee_usd_per_night * nights_used, 2)
      fnb_usd              = fnb_minimum_usd
      service_charge_usd   = round((room_revenue_usd + fnb_usd + av_adjusted_usd) * service_charge_pct, 2)
      # NOTE: resort fees are OUTSIDE the service-charge base but INSIDE the tax base.
      tax_usd              = round((room_revenue_usd + resort_fee_total_usd + fnb_usd
                                    + av_adjusted_usd + service_charge_usd) * tax_pct, 2)
      gross_usd            = room_revenue_usd + resort_fee_total_usd + fnb_usd + av_adjusted_usd
                             + service_charge_usd + tax_usd
      concession_cap_usd   = round(CONCESSION_CAP_PCT * room_revenue_usd, 2)
      concession_applied_usd = min(concession_credit_usd, concession_cap_usd)
      total_cost_usd       = round(gross_usd - concession_applied_usd + attrition_damages_usd, 2)
    input_set: "A single Proposal whose status IN {SUBMITTED, UNDER_REVIEW, COUNTERED, REVISED, AWARDED}; every quoted term is read from that row, never from the parent Rfp or from sibling proposals"
    constants:
      CONCESSION_CAP_PCT: 0.08
      AV_TIER_1_MAX: 10000.00
      AV_TIER_2_MAX: 25000.00
      AV_TIER_1_MULTIPLIER: 1.00
      AV_TIER_2_MULTIPLIER: 0.95
      AV_TIER_3_MULTIPLIER: 0.90
      ATTRITION_SHRINK_ASSUMPTION: 0.12
      ATTRITION_DAMAGE_PCT: 0.80
    precision: "All money to 2 decimal places, round_half_up, applied at each round() shown above; night counts are exact integers via floor/ceil as written"
    variants:
      - name: CONTRACTED_BASIS
        when: "BidEvaluation.basis == CONTRACTED_BASIS, and always for Proposal.total_cost_contracted_usd - the only figure the budget ceiling and the volume-rebate tier read"
        difference: "Charges the full paid_room_nights block and books zero attrition damages"
      - name: ACTUALIZED_BASIS
        when: "BidEvaluation.basis == ACTUALIZED_BASIS, used for the planner's downside view during bid comparison"
        difference: "Charges ceil(paid_room_nights * (1 - ATTRITION_SHRINK_ASSUMPTION)) nights, shrinking room revenue, resort fees, service charge, tax and the concession cap, then adds attrition damages when the shrunken block falls below floor(paid_room_nights * (1 - attrition_allowance_pct))"

  - name: rate_benchmark_compliance
    trigger: "On POST /sourcing/proposals/{id}/submit and POST /sourcing/proposals/{id}/revise, writing Proposal.benchmark_variance_pct and Proposal.compliance_status"
    algorithm: threshold
    formula: |
      benchmark = the single RateBenchmark row whose destination_tier == Venue.destination_tier
                  AND program_type == MeetingEvent.program_type
      # (destination_tier, program_type) is unique, so the candidate set has exactly 0 or 1 rows.
      # Empty set -> reject the submit with ERR_BENCHMARK_NOT_CONFIGURED; never fall back to a default rate.
      benchmark_variance_pct = round((net_adr_usd - benchmark.benchmark_adr_usd)
                                     / benchmark.benchmark_adr_usd, 4)
      if Venue.preferred_supplier_status == "SUSPENDED":
          compliance_status = "NON_COMPLIANT"
      elif Venue.preferred_supplier_status IN {"PREFERRED", "CONDITIONAL"}:
          if benchmark_variance_pct <= 0.0000:                      compliance_status = "COMPLIANT"
          elif benchmark_variance_pct <= MAX_PROGRAM_PREMIUM_PCT:   compliance_status = "COMPLIANT_WITH_VARIANCE"
          else:                                                     compliance_status = "NON_COMPLIANT"
      else:  # preferred_supplier_status == "NONE"
          if benchmark_variance_pct <= 0.0000:                      compliance_status = "COMPLIANT_WITH_VARIANCE"
          else:                                                     compliance_status = "NON_COMPLIANT"
    input_set: "One Proposal, its Venue, its MeetingEvent and the single matching RateBenchmark; no other proposals participate"
    constants:
      MAX_PROGRAM_PREMIUM_PCT: 0.1000
    precision: "benchmark_variance_pct to 4 decimal places, round_half_up; the tier comparisons use <= on the rounded value, so exactly 0.1000 is COMPLIANT_WITH_VARIANCE"

  - name: contract_volume_rebate
    trigger: "On POST /sourcing/events/{id}/award while minting the Contract, writing pre_rebate_total_usd, volume_rebate_pct, volume_rebate_usd and contracted_total_usd"
    algorithm: threshold
    formula: |
      # Circular-looking dependency, pinned: the rebate tier is selected from the PRE-rebate total.
      # Evaluating the tier from contracted_total_usd (which the rebate itself reduces, and which can
      # therefore fall into a lower tier) is explicitly WRONG.
      pre_rebate_total_usd = Proposal.total_cost_contracted_usd   # snapshot at award
      if   pre_rebate_total_usd <  REBATE_TIER_1_MIN: volume_rebate_pct = 0.000
      elif pre_rebate_total_usd <  REBATE_TIER_2_MIN: volume_rebate_pct = 0.020
      else:                                          volume_rebate_pct = 0.035
      volume_rebate_usd    = round(pre_rebate_total_usd * volume_rebate_pct, 2)
      contracted_total_usd = round(pre_rebate_total_usd - volume_rebate_usd, 2)
      # Step 2 never re-enters step 1: contracted_total_usd is a pure output.
    input_set: "Exactly one Proposal (the awarded one) at award time; no other proposal or contract participates"
    constants:
      REBATE_TIER_1_MIN: 150000.00
      REBATE_TIER_2_MIN: 400000.00
      REBATE_TIER_0_PCT: 0.000
      REBATE_TIER_1_PCT: 0.020
      REBATE_TIER_2_PCT: 0.035
    precision: "2 decimal places, round_half_up; tier comparisons use >= on the tier minimums, so a pre_rebate_total_usd of exactly 150000.00 earns 0.020"

  - name: deposit_schedule_allocation
    trigger: "On POST /sourcing/contracts/{id}/deposit-schedule, creating the DepositInstallment rows and writing Contract.deposit_total_usd and deposit_outstanding_usd"
    algorithm: waterfall_allocation
    formula: |
      deposit_total_usd = round(contracted_total_usd * DEPOSIT_PCT, 2)
      # PINNED ROUNDING ORDER: round each installment independently first, then push the residual
      # into the LAST installment. Summing exact shares and rounding once at the end is WRONG and
      # produces a different cent split.
      for seq, weight in enumerate(DEPOSIT_WEIGHTS, start=1):
          amount_usd[seq] = round(deposit_total_usd * weight, 2)
      residual_usd = round(deposit_total_usd - sum(amount_usd[1..3]), 2)
      amount_usd[3] = round(amount_usd[3] + residual_usd, 2)     # residual always lands on seq 3
      due_date[seq] = MeetingEvent.start_date - DEPOSIT_OFFSET_DAYS[seq] days
      status[seq]   = "SCHEDULED"
      deposit_outstanding_usd = amount_usd[1] + amount_usd[2] + amount_usd[3]   # == deposit_total_usd
    input_set: "One Contract whose signature_state == EXECUTED and whose deposit_total_usd is still null; installments are created in ascending installment_seq"
    constants:
      DEPOSIT_PCT: 0.30
      DEPOSIT_WEIGHTS: [0.34, 0.33, 0.33]
      DEPOSIT_OFFSET_DAYS: [180, 90, 30]
    precision: "2 decimal places, round_half_up per installment, then a single residual adjustment on installment_seq 3; the invariant sum(amount_usd) == deposit_total_usd holds exactly"

  - name: contract_cancellation_fee
    trigger: "On POST /sourcing/contracts/{id}/terminate, writing Contract.cancellation_fee_usd and Contract.rebooking_credit_usd"
    algorithm: threshold
    formula: |
      days_to_arrival = floor((MeetingEvent.start_date at 00:00:00.000Z - current_utc) / 86400 seconds)
      # Select the tier with the LARGEST days_before_arrival_min that is <= days_to_arrival.
      # cancellation_schedule always contains a tier with days_before_arrival_min == 0, so the
      # candidate set is never empty.
      tier = argmax(t.days_before_arrival_min for t in cancellation_schedule
                    where t.days_before_arrival_min <= days_to_arrival)
      cancellation_fee_usd  = round(contracted_room_revenue_usd * tier.fee_pct, 2)
      rebooking_credit_usd  = round(cancellation_fee_usd * rebooking_credit_pct, 2)
    input_set: "One EXECUTED Contract, its cancellation_schedule array and the logical clock; the fee base is contracted_room_revenue_usd only - F&B, AV, service charge and tax are never in the base"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "2 decimal places, round_half_up; tier selection uses <= on days_before_arrival_min, so exactly 181 days out still earns the 181-day tier"

  - name: approval_route_generation
    trigger: "On POST /sourcing/contracts/{id}/route-approvals, creating ApprovalStep rows and writing Contract.approval_step_count"
    algorithm: constraint_propagation
    formula: |
      levels = []
      if Venue.preferred_supplier_status IN {"NONE", "CONDITIONAL"}:
          levels.append("PROGRAM_COMPLIANCE")      # always inserted FIRST when present
      levels.append("MANAGER")
      if contracted_total_usd >= VP_THRESHOLD_USD:                                levels.append("VP")
      if contracted_total_usd >= LEGAL_THRESHOLD_USD or force_majeure_scope == "NARROW":
          levels.append("LEGAL")
      # step_seq is assigned 1..N in exactly this list order.
      required_role["PROGRAM_COMPLIANCE"] = "ProgramAdmin"
      required_role["MANAGER"] = required_role["VP"] = required_role["LEGAL"] = "ContractApprover"
      decision[*] = "PENDING"
    input_set: "One Contract in approval_state PENDING_ROUTING plus its Venue's current preferred_supplier_status; the venue status is read live at routing time, NOT the VenueShortlistEntry snapshot"
    constants:
      VP_THRESHOLD_USD: 250000.00
      LEGAL_THRESHOLD_USD: 500000.00
    precision: "Threshold comparisons use >= on contracted_total_usd, so exactly 250000.00 adds the VP step"

  - name: venue_performance_score
    trigger: "On POST /sourcing/venues/{id}/performance-reviews, writing SupplierPerformanceReview.composite_score, Venue.performance_score (RECENCY_WEIGHTED variant) and Venue.performance_review_count"
    algorithm: weighted_scoring
    formula: |
      composite_score = round(0.35 * service_score + 0.25 * value_score
                              + 0.20 * av_quality_score + 0.20 * responsiveness_score, 2)
      # Rank this venue's reviews newest-first: ORDER BY created_at DESC, composite_score DESC.
      # (created_at is the logical-clock instant of capture; id is never a decision input.)
      # RECENCY_WEIGHTED (written to Venue.performance_score):
      #   weight_i = RECENCY_DECAY ** (rank_i - 1)          # rank 1 = newest
      #   performance_score = round(sum(weight_i * composite_i) / sum(weight_i), 2)
      # SIMPLE_MEAN (reported by GET /sourcing/venues/{id} consumers via the audit variant):
      #   performance_score_simple_mean = round(sum(composite_i) / count(i), 2)
    input_set: "Every SupplierPerformanceReview whose venue_id == this Venue, regardless of review_source; no status filter exists because reviews are never retracted"
    constants:
      SERVICE_WEIGHT: 0.35
      VALUE_WEIGHT: 0.25
      AV_QUALITY_WEIGHT: 0.20
      RESPONSIVENESS_WEIGHT: 0.20
      RECENCY_DECAY: 0.7
    precision: "composite_score and both score variants to 2 decimal places, round_half_up; the weighted mean divides before rounding"
    variants:
      - name: RECENCY_WEIGHTED
        when: "Persisted to Venue.performance_score on every review capture"
        difference: "Applies RECENCY_DECAY ** (rank - 1) weights over reviews ordered created_at DESC, so the newest scorecard dominates"
      - name: SIMPLE_MEAN
        when: "Used for preferred-supplier-program eligibility audits, exposed as simple_mean_score on GET /sourcing/venues/{id}"
        difference: "Unweighted arithmetic mean of the same composite scores; diverges from RECENCY_WEIGHTED whenever the reviews are not all equal"

  - name: post_event_savings
    trigger: "On POST /sourcing/events/{id}/post-event-report, writing every computed field of the new PostEventReport and MeetingEvent.savings_recognized_usd"
    algorithm: aggregation
    formula: |
      attrition_allowed_nights   = floor(Contract.contracted_paid_room_nights
                                         * (1 - Contract.attrition_allowance_pct))
      attrition_shortfall_nights = max(0, attrition_allowed_nights - actual_room_nights)
      attrition_charge_usd       = round(attrition_shortfall_nights * Contract.contracted_room_rate_usd
                                         * ATTRITION_DAMAGE_PCT, 2)
      actual_room_cost_usd       = round(Contract.contracted_room_rate_usd * actual_room_nights, 2)
      actual_resort_fee_usd      = round(Contract.resort_fee_usd_per_night * actual_room_nights, 2)
      realized_service_charge_usd = round((actual_room_cost_usd + actual_fnb_usd + actual_av_usd)
                                          * Contract.service_charge_pct, 2)
      realized_tax_usd           = round((actual_room_cost_usd + actual_resort_fee_usd + actual_fnb_usd
                                          + actual_av_usd + realized_service_charge_usd)
                                         * Contract.tax_pct, 2)
      realized_total_usd         = round(actual_room_cost_usd + actual_resort_fee_usd + actual_fnb_usd
                                         + actual_av_usd + realized_service_charge_usd + realized_tax_usd
                                         + attrition_charge_usd - Contract.concession_applied_usd, 2)
      benchmark_room_cost_usd    = round(RateBenchmark.benchmark_adr_usd * actual_room_nights, 2)
      savings_vs_benchmark_usd   = round(benchmark_room_cost_usd - actual_room_cost_usd, 2)
      savings_vs_budget_usd      = round(MeetingEvent.budget_ceiling_usd - realized_total_usd, 2)
    input_set: "The event's single Contract whose signature_state == EXECUTED, the three actual_* inputs from the request body, and the RateBenchmark matching (Venue.destination_tier, MeetingEvent.program_type); the awarded Proposal is never re-read because the Contract carries snapshots"
    constants:
      ATTRITION_DAMAGE_PCT: 0.80
    precision: "2 decimal places, round_half_up at each round() shown; attrition_allowed_nights floors, so a fractional allowance never rounds up in the group's favour"

  - name: event_sourcing_rollup
    trigger: "On every Proposal transition into or out of {SUBMITTED, UNDER_REVIEW, COUNTERED, REVISED}, on POST /sourcing/proposals/{id}/revise, and on POST /sourcing/rfps/{id}/close; writes MeetingEvent.best_total_cost_usd and MeetingEvent.shortlisted_venue_count"
    algorithm: aggregation
    formula: |
      live_proposals = every Proposal p where p.rfp_id IN (Rfp ids of this event)
                       AND p.status IN {SUBMITTED, UNDER_REVIEW, COUNTERED, REVISED}
      # candidate set filter above; ranking below; tie-break below; empty fallback below.
      if live_proposals is empty:
          best_total_cost_usd = null
      else:
          best = the p minimising p.total_cost_contracted_usd;
                 ties broken by the earlier p.created_at (ASC), never by p.id
          best_total_cost_usd = best.total_cost_contracted_usd
      shortlisted_venue_count = count(VenueShortlistEntry e where e.event_id == this event
                                      AND e.status IN {SHORTLISTED, INSPECTION_SCHEDULED,
                                                        INSPECTED, RFP_ISSUED, AWARDED})
    input_set: "All Rfp rounds of the event, not only the newest; a live proposal from round 1 still competes if it was never rejected, withdrawn or expired"
    constants: {}
    precision: "best_total_cost_usd carries the 2-decimal value already stored on the winning Proposal; no re-rounding"

  - name: budget_envelope_invariant
    trigger: "Re-asserted after POST /sourcing/events/{id}/award, after the approval-rejection cascade, and after POST /sourcing/contracts/{id}/terminate"
    algorithm: constraint_propagation
    formula: |
      budget_remaining_usd = round(budget_ceiling_usd - committed_spend_usd
                                   - cancellation_liability_usd, 2)
      # CONSERVED QUANTITY (money, USD): for every MeetingEvent at every observable instant
      #   budget_remaining_usd + committed_spend_usd + cancellation_liability_usd == budget_ceiling_usd
      # award            : committed_spend_usd += Contract.contracted_total_usd
      # supersede/reject : committed_spend_usd -= the voided Contract.contracted_total_usd
      # terminate        : committed_spend_usd -= Contract.contracted_total_usd
      #                    cancellation_liability_usd += Contract.cancellation_fee_usd
    input_set: "One MeetingEvent and its single non-voided Contract; voided, cancelled and terminated contracts contribute 0.00 to committed_spend_usd"
    constants: {}
    precision: "2 decimal places, round_half_up; the identity must hold to the cent with no drift after any forward/compensating pair"

  - name: room_night_inventory_invariant
    trigger: "Re-asserted after a Contract reaches signature_state EXECUTED and after POST /sourcing/contracts/{id}/terminate"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY (room-night inventory, integer nights):
      #   Venue.blocked_room_nights == sum(c.contracted_paid_room_nights
      #                                    for c in Contracts where c.venue_id == Venue.id
      #                                    AND c.signature_state == "EXECUTED")
      # execute   : blocked_room_nights += contracted_paid_room_nights
      # terminate : blocked_room_nights -= contracted_paid_room_nights
      # Capacity guard evaluated at countersignature, before the increment:
      #   overlapping = Contracts c2 where c2.venue_id == Venue.id
      #                 AND c2.signature_state == "EXECUTED"
      #                 AND c2.event.start_date <= this.event.end_date
      #                 AND c2.event.end_date   >= this.event.start_date      # fully-closed day overlap
      #   sum(c2.peak_rooms_per_night) + this.peak_rooms_per_night <= Venue.guest_rooms_total
      peak_rooms_per_night = ceil(contracted_paid_room_nights / MeetingEvent.nights_span)
    input_set: "All Contracts of one Venue; only signature_state == EXECUTED rows count toward blocked_room_nights, and only those whose event date range overlaps count toward the capacity guard"
    constants: {}
    precision: "Exact integers; ceil on peak_rooms_per_night, and the capacity comparison is <= so hitting guest_rooms_total exactly is allowed"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of {SourcingManager, VenueRep, ContractApprover, FinanceController, ProgramAdmin}"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list in section 1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "For VenueRep calls, X-User-ID equals the venue_id of the Proposal or Contract addressed by the path"
    error_id: ERR_VENUE_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /sourcing/proposals/{id}/submit, /decline, /withdraw, /revise; POST /sourcing/contracts/{id}/countersign"
  - priority: 10
    category: existence
    check: "Every id in the path resolves, validated left-to-right"
    error_id: ERR_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "all path-addressed endpoints; the concrete error is ERR_EVENT_NOT_FOUND, ERR_VENUE_NOT_FOUND, ERR_SHORTLIST_ENTRY_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_RFP_NOT_FOUND, ERR_PROPOSAL_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_APPROVAL_STEP_NOT_FOUND, ERR_INSTALLMENT_NOT_FOUND, ERR_BENCHMARK_NOT_FOUND, ERR_REPORT_NOT_FOUND or ERR_REVIEW_NOT_FOUND for the segment that failed"
  - priority: 11
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row"
    error_id: ERR_VENUE_NOT_FOUND
    http_status: 404
    applies_to: "POST /sourcing/events/{id}/shortlist-entries (venue_id), POST /sourcing/events/{id}/rfps (previous_rfp_id), POST /sourcing/events/{id}/award (proposal_id), POST /sourcing/proposals/{id}/revise (counter_id -> ERR_COUNTER_NOT_FOUND), POST /sourcing/venues/{id}/performance-reviews (event_id)"
  - priority: 20
    category: business_constraint
    check: "All required body fields present with the declared type, enum members valid, money fields non-negative with at most 2 decimals, percentage fields within their declared range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 21
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every GET list endpoint"
  - priority: 22
    category: business_temporal
    check: "end_date is strictly after start_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /sourcing/events"
  - priority: 23
    category: business_temporal
    check: "window_end is strictly after window_start"
    error_id: ERR_INVALID_INSPECTION_WINDOW
    http_status: 422
    applies_to: "POST /sourcing/site-inspections"
  - priority: 24
    category: business_constraint
    check: "event_code is not already used by another MeetingEvent"
    error_id: ERR_EVENT_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /sourcing/events"
  - priority: 25
    category: business_constraint
    check: "No RateBenchmark already exists for the (destination_tier, program_type) pair"
    error_id: ERR_BENCHMARK_DUPLICATE
    http_status: 409
    applies_to: "POST /sourcing/rate-benchmarks"
  - priority: 26
    category: business_constraint
    check: "No VenueShortlistEntry already exists for this (event_id, venue_id) pair, and rank_seq is unused within the event"
    error_id: ERR_VENUE_ALREADY_SHORTLISTED
    http_status: 409
    applies_to: "POST /sourcing/events/{id}/shortlist-entries"
  - priority: 27
    category: business_constraint
    check: "No Rfp already exists for this (event_id, round_number) pair"
    error_id: ERR_RFP_ROUND_DUPLICATE
    http_status: 409
    applies_to: "POST /sourcing/events/{id}/rfps"
  - priority: 40
    category: state
    check: "MeetingEvent.status == DRAFT for lock-requirements; IN {REQUIREMENTS_LOCKED, SOURCING, BID_REVIEW} for shortlist-entry creation; IN {REQUIREMENTS_LOCKED, BID_REVIEW} for rfp creation; IN {BID_REVIEW, AWARDED, CONTRACTED} for award (the CONTRACTED case is admitted here only so that priority 46 can report ERR_CONTRACT_ALREADY_EXECUTED); IN {CONTRACTED, COMPLETED} for post-event-report (the COMPLETED case is admitted here only so that priority 84 can report ERR_POST_EVENT_REPORT_EXISTS)"
    error_id: ERR_EVENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /sourcing/events/{id}/lock-requirements, /shortlist-entries, /rfps, /award, /post-event-report"
  - priority: 41
    category: state
    check: "VenueShortlistEntry.status == CANDIDATE for shortlist; NOT IN {AWARDED, ELIMINATED} for eliminate"
    error_id: ERR_SHORTLIST_ENTRY_STATE_INVALID
    http_status: 409
    applies_to: "POST /sourcing/shortlist-entries/{id}/shortlist, /eliminate"
  - priority: 42
    category: state
    check: "Rfp.status == DRAFT for issue and == ISSUED for close"
    error_id: ERR_RFP_STATE_INVALID
    http_status: 409
    applies_to: "POST /sourcing/rfps/{id}/issue, /close"
  - priority: 43
    category: state
    check: "Proposal.status == INVITED for submit and decline; IN {SUBMITTED, UNDER_REVIEW, REVISED} for evaluate; == UNDER_REVIEW for counters and for being awarded; == COUNTERED for revise; IN {SUBMITTED, UNDER_REVIEW, COUNTERED, REVISED} for withdraw"
    error_id: ERR_PROPOSAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /sourcing/proposals/{id}/submit, /decline, /evaluate, /counters, /revise, /withdraw; POST /sourcing/events/{id}/award"
  - priority: 44
    category: state
    check: "SiteInspection.status == PLANNED for complete and cancel, and for complete the logical clock is at or after window_end"
    error_id: ERR_INSPECTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /sourcing/site-inspections/{id}/complete, /cancel"
  - priority: 45
    category: state
    check: "Contract.approval_state == PENDING_ROUTING for route-approvals; signature_state == UNSIGNED for sign; == PLANNER_SIGNED for countersign; == EXECUTED for deposit-schedule and terminate; ApprovalStep.decision == PENDING with parent approval_state == IN_APPROVAL for decide; DepositInstallment.status == SCHEDULED for pay"
    error_id: ERR_CONTRACT_STATE_INVALID
    http_status: 409
    applies_to: "POST /sourcing/contracts/{id}/route-approvals, /sign, /countersign, /deposit-schedule, /terminate; POST /sourcing/approval-steps/{id}/decide; POST /sourcing/deposit-installments/{id}/pay"
  - priority: 46
    category: state
    check: "An award on an event already IN {AWARDED, CONTRACTED} requires the existing Contract.signature_state != EXECUTED; an event in CONTRACTED always has an EXECUTED Contract, so every award naming an UNDER_REVIEW proposal on a CONTRACTED event lands on this rule"
    error_id: ERR_CONTRACT_ALREADY_EXECUTED
    http_status: 409
    applies_to: "POST /sourcing/events/{id}/award"
  - priority: 47
    category: state
    check: "Contract.deposit_total_usd is still null - a deposit schedule is generated at most once per contract"
    error_id: ERR_DEPOSIT_ALREADY_SCHEDULED
    http_status: 409
    applies_to: "POST /sourcing/contracts/{id}/deposit-schedule"
  - priority: 48
    category: state
    check: "expected_event_version equals MeetingEvent.version, and expected_proposal_version equals Proposal.version"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /sourcing/events/{id}/award (ERR_STALE_EVENT_VERSION); POST /sourcing/proposals/{id}/counters (ERR_STALE_PROPOSAL_VERSION)"
  - priority: 50
    category: business_referential
    check: "The parent Rfp of the addressed Proposal has status == ISSUED"
    error_id: ERR_RFP_NOT_OPEN
    http_status: 409
    applies_to: "POST /sourcing/proposals/{id}/submit, /counters"
  - priority: 51
    category: business_referential
    check: "The referenced VenueShortlistEntry has status == SHORTLISTED"
    error_id: ERR_SHORTLIST_ENTRY_NOT_SHORTLISTED
    http_status: 409
    applies_to: "POST /sourcing/site-inspections"
  - priority: 52
    category: business_referential
    check: "The referenced NegotiationCounter belongs to the addressed Proposal and its resolution == OPEN"
    error_id: ERR_COUNTER_NOT_OPEN
    http_status: 409
    applies_to: "POST /sourcing/proposals/{id}/revise"
  - priority: 53
    category: business_referential
    check: "round_number > 1 requires previous_rfp_id to be supplied, to belong to the same event and to have status == CLOSED; round_number == 1 requires previous_rfp_id to be absent"
    error_id: ERR_PREVIOUS_ROUND_NOT_CLOSED
    http_status: 422
    applies_to: "POST /sourcing/events/{id}/rfps"
  - priority: 54
    category: business_referential
    check: "review_source == EVENT requires event_id to reference a MeetingEvent with status == COMPLETED whose awarded Contract.venue_id equals this venue; review_source == EXTERNAL requires event_id to be absent"
    error_id: ERR_REVIEW_EVENT_INVALID
    http_status: 422
    applies_to: "POST /sourcing/venues/{id}/performance-reviews"
  - priority: 55
    category: business_constraint
    check: "Every ApprovalStep of the same contract with a lower step_seq already has decision == APPROVED"
    error_id: ERR_APPROVAL_STEP_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /sourcing/approval-steps/{id}/decide"
  - priority: 56
    category: business_constraint
    check: "X-User-Role equals the ApprovalStep.required_role"
    error_id: ERR_APPROVAL_LEVEL_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /sourcing/approval-steps/{id}/decide"
  - priority: 57
    category: business_safety
    check: "X-User-ID is not the parent Contract.awarded_by_user_id - the planner who awarded may never approve"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /sourcing/approval-steps/{id}/decide"
  - priority: 58
    category: business_safety
    check: "X-User-ID is not already recorded as approver_user_id on another ApprovalStep of the same contract"
    error_id: ERR_DUPLICATE_APPROVER
    http_status: 409
    applies_to: "POST /sourcing/approval-steps/{id}/decide"
  - priority: 60
    category: business_safety
    check: "The Venue's preferred_supplier_status != SUSPENDED"
    error_id: ERR_VENUE_SUSPENDED
    http_status: 422
    applies_to: "POST /sourcing/events/{id}/shortlist-entries, POST /sourcing/shortlist-entries/{id}/shortlist, POST /sourcing/site-inspections, POST /sourcing/events/{id}/award"
  - priority: 62
    category: business_safety
    check: "When MeetingEvent.preferred_program_only == true, the entry's program_status_at_shortlist == IN_PROGRAM"
    error_id: ERR_PREFERRED_PROGRAM_REQUIRED
    http_status: 422
    applies_to: "POST /sourcing/shortlist-entries/{id}/shortlist, POST /sourcing/events/{id}/award"
  - priority: 64
    category: business_safety
    check: "The awarded Proposal.compliance_status != NON_COMPLIANT"
    error_id: ERR_RATE_BENCHMARK_NON_COMPLIANT
    http_status: 422
    applies_to: "POST /sourcing/events/{id}/award"
  - priority: 66
    category: business_constraint
    check: "A RateBenchmark exists for (Venue.destination_tier, MeetingEvent.program_type)"
    error_id: ERR_BENCHMARK_NOT_CONFIGURED
    http_status: 422
    applies_to: "POST /sourcing/proposals/{id}/submit, POST /sourcing/events/{id}/post-event-report"
  - priority: 68
    category: business_constraint
    check: "Venue.largest_space_sqft >= MeetingEvent.largest_meeting_space_sqft"
    error_id: ERR_VENUE_SPACE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /sourcing/events/{id}/shortlist-entries"
  - priority: 70
    category: business_constraint
    check: "At least one VenueShortlistEntry of the event has status IN {SHORTLISTED, INSPECTION_SCHEDULED, INSPECTED}"
    error_id: ERR_NO_SHORTLISTED_VENUES
    http_status: 422
    applies_to: "POST /sourcing/rfps/{id}/issue"
  - priority: 71
    category: business_constraint
    check: "Every eligible entry whose inspection_required == true has status == INSPECTED"
    error_id: ERR_INSPECTION_INCOMPLETE
    http_status: 422
    applies_to: "POST /sourcing/rfps/{id}/issue"
  - priority: 72
    category: business_constraint
    check: "The awarded Proposal has at least one BidEvaluation whose basis == CONTRACTED_BASIS"
    error_id: ERR_BID_EVALUATION_REQUIRED
    http_status: 422
    applies_to: "POST /sourcing/events/{id}/award"
  - priority: 74
    category: business_temporal
    check: "response_due_at is strictly after the current logical clock and strictly before MeetingEvent.start_date at 00:00:00.000Z"
    error_id: ERR_RESPONSE_DUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /sourcing/events/{id}/rfps, POST /sourcing/rfps/{id}/issue"
  - priority: 75
    category: business_temporal
    check: "The current logical clock is at or before Rfp.response_due_at"
    error_id: ERR_RESPONSE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /sourcing/proposals/{id}/submit"
  - priority: 76
    category: business_temporal
    check: "The inspection window does not intersect the parent MeetingEvent's own fully-closed date interval [start_date 00:00:00.000Z, end_date 23:59:59.999Z]"
    error_id: ERR_INSPECTION_WINDOW_OVERLAPS_EVENT
    http_status: 422
    applies_to: "POST /sourcing/site-inspections"
  - priority: 77
    category: business_temporal
    check: "The buffered occupation interval [window_start, window_end + travel_buffer_minutes) does not intersect the buffered interval of any other SiteInspection on the same venue_id whose status IN {PLANNED, COMPLETED}"
    error_id: ERR_INSPECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /sourcing/site-inspections"
  - priority: 78
    category: business_temporal
    check: "The current logical clock is strictly after MeetingEvent.end_date at 23:59:59.999Z"
    error_id: ERR_EVENT_NOT_CONCLUDED
    http_status: 422
    applies_to: "POST /sourcing/events/{id}/post-event-report"
  - priority: 79
    category: business_temporal
    check: "The current logical clock is strictly before MeetingEvent.start_date at 00:00:00.000Z"
    error_id: ERR_TERMINATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /sourcing/contracts/{id}/terminate"
  - priority: 82
    category: business_constraint
    check: "Contract.peak_rooms_per_night plus the summed peak_rooms_per_night of the venue's EXECUTED contracts whose event date range overlaps this event's is <= Venue.guest_rooms_total"
    error_id: ERR_VENUE_ROOM_BLOCK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /sourcing/contracts/{id}/countersign"
  - priority: 84
    category: business_constraint
    check: "No PostEventReport already exists for this MeetingEvent"
    error_id: ERR_POST_EVENT_REPORT_EXISTS
    http_status: 409
    applies_to: "POST /sourcing/events/{id}/post-event-report"
  - priority: 90
    category: business_fiscal
    check: "The awarded Proposal.total_cost_contracted_usd <= MeetingEvent.budget_ceiling_usd (equality is allowed)"
    error_id: ERR_BUDGET_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /sourcing/events/{id}/award"
  - priority: 92
    category: business_fiscal
    check: "Every DepositInstallment of the same contract with a lower installment_seq has status == PAID"
    error_id: ERR_DEPOSIT_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /sourcing/deposit-installments/{id}/pay"
  - priority: 94
    category: business_fiscal
    check: "paid_amount_usd equals DepositInstallment.amount_usd to the cent"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /sourcing/deposit-installments/{id}/pay"
  - priority: 96
    category: business_fiscal
    check: "actual_room_nights <= Contract.contracted_paid_room_nights (the group cannot consume more paid nights than were contracted)"
    error_id: ERR_ACTUALS_EXCEED_CONTRACT
    http_status: 422
    applies_to: "POST /sourcing/events/{id}/post-event-report"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical current UTC instant, which every deadline, inspection-window, cancellation-tier and post-event check reads instead of wall-clock time. The server's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time."
    roles: [SourcingManager, VenueRep, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["replaces the logical clock value used by every subsequent request; stores nothing on any entity"]
  - method: POST
    path: "/sourcing/rate-benchmarks"
    description: "Publish the market rate benchmark for one (destination_tier, program_type) pair; proposals are scored for preferred-program compliance against it."
    roles: [ProgramAdmin]
    code: 201
    input: [destination_tier, program_type, benchmark_adr_usd, benchmark_service_charge_pct, benchmark_tax_pct]
    output: RateBenchmark
    side_effects: ["creates an immutable RateBenchmark row"]
  - method: GET
    path: "/sourcing/rate-benchmarks/{benchmark_id}"
    description: "Read one published rate benchmark."
    roles: [SourcingManager, VenueRep, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: []
    output: RateBenchmark
    side_effects: []
  - method: GET
    path: "/sourcing/rate-benchmarks"
    description: "List published rate benchmarks, optionally narrowed to a tier and/or program type."
    roles: [SourcingManager, VenueRep, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["destination_tier?", "program_type?", "limit?", "offset?"]
    output: RateBenchmark[]
    side_effects: []
  - method: POST
    path: "/sourcing/venues"
    description: "Register a venue in the supplier master with its capacity, tier and initial preferred-program standing."
    roles: [ProgramAdmin]
    code: 201
    input: [name, city, country, destination_tier, guest_rooms_total, largest_space_sqft, "preferred_supplier_status?"]
    output: Venue
    side_effects: ["creates a Venue with performance_score null, performance_review_count 0 and blocked_room_nights 0"]
  - method: PATCH
    path: "/sourcing/venues/{venue_id}/preferred-status"
    description: "Move a venue's preferred supplier program standing, e.g. suspend it after a compliance failure or promote it to PREFERRED."
    roles: [ProgramAdmin]
    code: 200
    input: [preferred_supplier_status]
    output: Venue
    side_effects: ["updates Venue.preferred_supplier_status and increments Venue.version by 1", "already-created VenueShortlistEntry.program_status_at_shortlist snapshots are NOT rewritten", "changes which approval levels calculations.approval_route_generation will emit for contracts routed after this call"]
  - method: GET
    path: "/sourcing/venues/{venue_id}"
    description: "Read one venue including its recency-weighted performance score, simple-mean score and currently blocked room nights."
    roles: [SourcingManager, VenueRep, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: []
    output: Venue
    side_effects: []
  - method: GET
    path: "/sourcing/venues"
    description: "List venues in the supplier master with optional tier, city and program-standing filters."
    roles: [SourcingManager, VenueRep, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["destination_tier?", "city?", "preferred_supplier_status?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []
  - method: POST
    path: "/sourcing/venues/{venue_id}/performance-reviews"
    description: "Capture a supplier performance scorecard for a venue, either tied to a COMPLETED event in this system (review_source EVENT) or imported from outside it (review_source EXTERNAL)."
    roles: [SourcingManager, ProgramAdmin]
    code: 201
    input: [review_source, service_score, value_score, av_quality_score, responsiveness_score, "event_id?", "comment?"]
    output: SupplierPerformanceReview
    side_effects: ["computes composite_score via calculations.venue_performance_score", "increments Venue.performance_review_count and recomputes both Venue.performance_score (RECENCY_WEIGHTED variant) and Venue.performance_score_simple_mean (SIMPLE_MEAN variant)", "increments Venue.version by 1"]
  - method: GET
    path: "/sourcing/performance-reviews/{review_id}"
    description: "Read one supplier performance scorecard."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: []
    output: SupplierPerformanceReview
    side_effects: []
  - method: GET
    path: "/sourcing/performance-reviews"
    description: "List supplier performance scorecards, filterable by venue, source event and review source."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["venue_id?", "event_id?", "review_source?", "limit?", "offset?"]
    output: SupplierPerformanceReview[]
    side_effects: []
  - method: POST
    path: "/sourcing/events"
    description: "Open a meeting sourcing file in DRAFT with its dates, attendee counts, space needs and budget ceiling."
    roles: [SourcingManager]
    code: 201
    input: [event_code, name, program_type, start_date, end_date, peak_attendees, requested_room_nights, largest_meeting_space_sqft, budget_ceiling_usd, "preferred_program_only?"]
    output: MeetingEvent
    side_effects: ["computes nights_span as the count of nights between start_date and end_date", "sets sourcing_owner_user_id to X-User-ID and budget_remaining_usd to budget_ceiling_usd", "seeds committed_spend_usd and cancellation_liability_usd to 0.00 so calculations.budget_envelope_invariant holds from creation"]
  - method: POST
    path: "/sourcing/events/{event_id}/lock-requirements"
    description: "Freeze the meeting requirement definition so shortlisting and solicitation may begin; requirement fields become read-only afterwards."
    roles: [SourcingManager]
    code: 200
    input: []
    output: MeetingEvent
    side_effects: ["MeetingEvent.status DRAFT -> REQUIREMENTS_LOCKED", "increments MeetingEvent.version by 1"]
  - method: GET
    path: "/sourcing/events/{event_id}"
    description: "Read one meeting sourcing file with its rollup fields: shortlisted_venue_count, best_total_cost_usd, awarded_proposal_id, committed_spend_usd, cancellation_liability_usd, budget_remaining_usd and savings_recognized_usd."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: []
    output: MeetingEvent
    side_effects: []
  - method: GET
    path: "/sourcing/events"
    description: "List meeting sourcing files, filterable by lifecycle status, program type and awarded proposal."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["status?", "program_type?", "awarded_proposal_id?", "limit?", "offset?"]
    output: MeetingEvent[]
    side_effects: []
  - method: POST
    path: "/sourcing/events/{event_id}/shortlist-entries"
    description: "Add a candidate venue to this event's destination shortlist at an explicit rank position."
    roles: [SourcingManager]
    code: 201
    input: [venue_id, rank_seq, "inspection_required?"]
    output: VenueShortlistEntry
    side_effects: ["creates a VenueShortlistEntry in CANDIDATE", "snapshots program_status_at_shortlist from the Venue's current preferred_supplier_status, mapping PREFERRED and CONDITIONAL to IN_PROGRAM and NONE to OUT_OF_PROGRAM", "increments MeetingEvent.version by 1"]
  - method: POST
    path: "/sourcing/shortlist-entries/{entry_id}/shortlist"
    description: "Promote a candidate venue onto the confirmed shortlist that will receive the solicitation."
    roles: [SourcingManager]
    code: 200
    input: []
    output: VenueShortlistEntry
    side_effects: ["VenueShortlistEntry.status CANDIDATE -> SHORTLISTED", "increments MeetingEvent.shortlisted_venue_count by 1 and MeetingEvent.version by 1"]
  - method: POST
    path: "/sourcing/shortlist-entries/{entry_id}/eliminate"
    description: "Drop a venue from the shortlist with a recorded reason; any PLANNED site inspection on the entry is cancelled."
    roles: [SourcingManager]
    code: 200
    input: [elimination_reason]
    output: VenueShortlistEntry
    side_effects: ["VenueShortlistEntry.status -> ELIMINATED with elimination_reason stored", "every SiteInspection of this entry in PLANNED becomes CANCELLED with cancel_reason SHORTLIST_ELIMINATED", "decrements MeetingEvent.shortlisted_venue_count when the entry was counted, and increments MeetingEvent.version by 1"]
  - method: GET
    path: "/sourcing/shortlist-entries/{entry_id}"
    description: "Read one shortlist entry including its program-status snapshot and inspection count."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: []
    output: VenueShortlistEntry
    side_effects: []
  - method: GET
    path: "/sourcing/shortlist-entries"
    description: "List shortlist entries, filterable by event, venue and status."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["event_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: VenueShortlistEntry[]
    side_effects: []
  - method: POST
    path: "/sourcing/site-inspections"
    description: "Plan a site inspection for a shortlisted venue in a concrete time window; the venue is occupied for the window plus its travel buffer."
    roles: [SourcingManager]
    code: 201
    input: [shortlist_entry_id, inspector_user_id, window_start, window_end, "travel_buffer_minutes?"]
    output: SiteInspection
    side_effects: ["copies venue_id from the parent VenueShortlistEntry and computes occupied_until as window_end plus travel_buffer_minutes", "VenueShortlistEntry.status SHORTLISTED -> INSPECTION_SCHEDULED and inspection_count incremented", "increments VenueShortlistEntry.version by 1"]
  - method: POST
    path: "/sourcing/site-inspections/{inspection_id}/complete"
    description: "Record the outcome of a site inspection after its window has elapsed."
    roles: [SourcingManager]
    code: 200
    input: [findings_score]
    output: SiteInspection
    side_effects: ["SiteInspection.status PLANNED -> COMPLETED with findings_score stored", "VenueShortlistEntry.status INSPECTION_SCHEDULED -> INSPECTED and its version incremented by 1"]
  - method: POST
    path: "/sourcing/site-inspections/{inspection_id}/cancel"
    description: "Cancel a planned site inspection, releasing the venue's occupied window."
    roles: [SourcingManager]
    code: 200
    input: [cancel_reason]
    output: SiteInspection
    side_effects: ["SiteInspection.status PLANNED -> CANCELLED with cancel_reason stored", "the parent VenueShortlistEntry reverts INSPECTION_SCHEDULED -> SHORTLISTED when no other PLANNED or COMPLETED inspection remains on it, and its version is incremented by 1", "the cancelled window no longer blocks other inspections on the same venue"]
  - method: GET
    path: "/sourcing/site-inspections/{inspection_id}"
    description: "Read one site inspection including its computed occupied_until instant."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: []
    output: SiteInspection
    side_effects: []
  - method: GET
    path: "/sourcing/site-inspections"
    description: "List site inspections, filterable by shortlist entry, venue, inspector and status."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["shortlist_entry_id?", "venue_id?", "inspector_user_id?", "status?", "limit?", "offset?"]
    output: SiteInspection[]
    side_effects: []
  - method: POST
    path: "/sourcing/events/{event_id}/rfps"
    description: "Draft a solicitation round for this event with a standardized response format version and a response deadline; rounds after the first must chain to the CLOSED round they supersede."
    roles: [SourcingManager]
    code: 201
    input: [round_number, response_due_at, standard_response_version, "previous_rfp_id?", "instructions?"]
    output: Rfp
    side_effects: ["creates an Rfp in DRAFT with invited_count 0 and submitted_count 0"]
  - method: POST
    path: "/sourcing/rfps/{rfp_id}/issue"
    description: "Issue the solicitation to every eligible shortlisted venue, minting one INVITED Proposal per venue."
    roles: [SourcingManager]
    code: 200
    input: []
    output: Rfp
    side_effects: ["Rfp.status DRAFT -> ISSUED with issued_at stamped at the logical clock", "creates one Proposal in INVITED per eligible VenueShortlistEntry (status IN {SHORTLISTED, INSPECTION_SCHEDULED, INSPECTED}) in ascending rank_seq order, copying venue_id; these Proposals are discoverable only via GET /sourcing/proposals", "sets Rfp.invited_count to the number of Proposals created", "each source VenueShortlistEntry moves to RFP_ISSUED and its version is incremented by 1", "MeetingEvent.status REQUIREMENTS_LOCKED -> SOURCING, or BID_REVIEW -> SOURCING when round_number > 1, and MeetingEvent.version is incremented by 1"]
  - method: POST
    path: "/sourcing/rfps/{rfp_id}/close"
    description: "Close the solicitation round; venues that never responded expire and the event moves into bid review."
    roles: [SourcingManager]
    code: 200
    input: []
    output: Rfp
    side_effects: ["Rfp.status ISSUED -> CLOSED with closed_at stamped at the logical clock", "every Proposal of this Rfp still in INVITED becomes EXPIRED", "MeetingEvent.status SOURCING -> BID_REVIEW and MeetingEvent.version incremented by 1"]
  - method: GET
    path: "/sourcing/rfps/{rfp_id}"
    description: "Read one solicitation round with its invited and submitted counts."
    roles: [SourcingManager, VenueRep, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: []
    output: Rfp
    side_effects: []
  - method: GET
    path: "/sourcing/rfps"
    description: "List solicitation rounds, filterable by event, superseded round and status."
    roles: [SourcingManager, VenueRep, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["event_id?", "previous_rfp_id?", "status?", "limit?", "offset?"]
    output: Rfp[]
    side_effects: []
  - method: POST
    path: "/sourcing/proposals/{proposal_id}/submit"
    description: "Venue submits its bid in the standardized response format: rates, commission, concessions, fees, F&B minimum, attrition allowance, cancellation schedule, force majeure scope and rebooking credit."
    roles: [VenueRep]
    code: 200
    input: [room_rate_usd, rate_type, commission_pct, room_nights_offered, comp_room_ratio, resort_fee_usd_per_night, service_charge_pct, tax_pct, av_estimate_usd, fnb_minimum_usd, concession_credit_usd, attrition_allowance_pct, cancellation_schedule, force_majeure_scope, rebooking_credit_pct]
    output: Proposal
    side_effects: ["Proposal.status INVITED -> SUBMITTED with submitted_at stamped at the logical clock", "computes net_adr_usd, comp_room_nights, paid_room_nights and total_cost_contracted_usd via the CONTRACTED_BASIS variant of calculations.proposal_total_cost_model", "computes benchmark_variance_pct and compliance_status via calculations.rate_benchmark_compliance", "increments Rfp.submitted_count by 1", "recomputes MeetingEvent.best_total_cost_usd via calculations.event_sourcing_rollup and increments MeetingEvent.version by 1"]
  - method: POST
    path: "/sourcing/proposals/{proposal_id}/decline"
    description: "Venue declines to bid on this solicitation."
    roles: [VenueRep]
    code: 200
    input: []
    output: Proposal
    side_effects: ["Proposal.status INVITED -> DECLINED", "the matching VenueShortlistEntry is left untouched so a later round can still invite the venue"]
  - method: POST
    path: "/sourcing/proposals/{proposal_id}/withdraw"
    description: "Venue withdraws a live bid; open counters stay open as historical record."
    roles: [VenueRep]
    code: 200
    input: []
    output: Proposal
    side_effects: ["Proposal.status -> WITHDRAWN", "decrements Rfp.submitted_count by 1", "recomputes MeetingEvent.best_total_cost_usd via calculations.event_sourcing_rollup and increments MeetingEvent.version by 1"]
  - method: POST
    path: "/sourcing/proposals/{proposal_id}/evaluate"
    description: "Model the total cost of this bid on the requested basis and snapshot the result as an immutable BidEvaluation."
    roles: [SourcingManager]
    code: 201
    input: [basis]
    output: BidEvaluation
    side_effects: ["creates an immutable BidEvaluation carrying every cost component, discoverable via GET /sourcing/proposals/{id}/bid-evaluations", "writes Proposal.total_cost_modeled_usd and last_evaluation_basis from the requested variant of calculations.proposal_total_cost_model, leaving total_cost_contracted_usd untouched", "Proposal.status SUBMITTED or REVISED -> UNDER_REVIEW, or stays UNDER_REVIEW on re-evaluation, and Proposal.version is incremented by 1"]
  - method: POST
    path: "/sourcing/proposals/{proposal_id}/counters"
    description: "Planner counters one negotiable term of a bid under review; guarded by optimistic concurrency on the proposal the planner last read."
    roles: [SourcingManager]
    code: 201
    input: [expected_proposal_version, term_category, "proposed_numeric_value?", "proposed_text_value?", "planner_note?"]
    output: NegotiationCounter
    side_effects: ["creates a NegotiationCounter with resolution OPEN and round_seq = Proposal.negotiation_round_count + 1, discoverable via GET /sourcing/proposals/{id}/negotiation-counters", "Proposal.status UNDER_REVIEW -> COUNTERED and negotiation_round_count incremented", "increments Proposal.version by 1"]
  - method: POST
    path: "/sourcing/proposals/{proposal_id}/revise"
    description: "Venue answers an open counter, accepting or declining it and optionally restating the affected terms; the revised bid is re-costed."
    roles: [VenueRep]
    code: 200
    input: [counter_id, accepted, "revised_room_rate_usd?", "revised_concession_credit_usd?", "revised_attrition_allowance_pct?", "revised_cancellation_schedule?", "revised_force_majeure_scope?", "revised_rebooking_credit_pct?", "revised_av_estimate_usd?", "revised_fnb_minimum_usd?"]
    output: Proposal
    side_effects: ["the referenced NegotiationCounter.resolution becomes ACCEPTED when accepted is true, else DECLINED_BY_VENUE, with resolved_at stamped", "supplied revised_* terms overwrite the corresponding quoted terms on the Proposal", "recomputes net_adr_usd, paid_room_nights, total_cost_contracted_usd, benchmark_variance_pct and compliance_status", "Proposal.status COUNTERED -> REVISED and Proposal.version incremented by 1", "recomputes MeetingEvent.best_total_cost_usd via calculations.event_sourcing_rollup"]
  - method: GET
    path: "/sourcing/proposals/{proposal_id}"
    description: "Read one bid with its computed net ADR, paid room nights, contracted and modeled totals, benchmark variance and compliance verdict."
    roles: [SourcingManager, VenueRep, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: []
    output: Proposal
    side_effects: []
  - method: GET
    path: "/sourcing/proposals"
    description: "List bids, filterable by solicitation round, venue and status; this is the only discovery channel for the INVITED proposals minted by issuing an Rfp."
    roles: [SourcingManager, VenueRep, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["rfp_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: Proposal[]
    side_effects: []
  - method: GET
    path: "/sourcing/proposals/{id}/bid-evaluations"
    description: "List the immutable cost-model snapshots taken for this bid, oldest first."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["basis?", "limit?", "offset?"]
    output: BidEvaluation[]
    side_effects: []
  - method: GET
    path: "/sourcing/proposals/{id}/negotiation-counters"
    description: "List the negotiation counters raised on this bid in ascending round_seq order."
    roles: [SourcingManager, VenueRep, ContractApprover, ProgramAdmin]
    code: 200
    input: ["resolution?", "limit?", "offset?"]
    output: NegotiationCounter[]
    side_effects: []
  - method: GET
    path: "/sourcing/events/{event_id}/cost-comparison"
    description: "Side-by-side bid comparison for this event: one row per live Proposal with its contracted-basis total, actualized-basis total, benchmark variance and compliance verdict, ordered by contracted total ascending then by Proposal.created_at ascending."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: BidComparisonRow[]
    side_effects: ["reads only; recomputes both variants of calculations.proposal_total_cost_model on the fly without writing BidEvaluation rows"]
    output_schema:
      BidComparisonRow:
        proposal_id: "string; FK -> Proposal.id"
        venue_id: "string; FK -> Venue.id"
        venue_name: "string"
        status: "enum; the Proposal's current status"
        total_cost_contracted_usd: "number; CONTRACTED_BASIS variant total"
        total_cost_actualized_usd: "number; ACTUALIZED_BASIS variant total"
        variant_delta_usd: "number; total_cost_contracted_usd minus total_cost_actualized_usd"
        benchmark_variance_pct: "number"
        compliance_status: "enum"
        within_budget: "boolean; total_cost_contracted_usd <= MeetingEvent.budget_ceiling_usd"
  - method: POST
    path: "/sourcing/events/{event_id}/award"
    description: "Award the event to one bid under review, minting the Contract from the awarded terms; rejects every sibling bid, eliminates their shortlist entries and cancels their planned inspections. Guarded by optimistic concurrency on the event the planner last read, because a fresh award legitimately supersedes an earlier one whose contract is not yet executed."
    roles: [SourcingManager]
    code: 201
    input: [proposal_id, expected_event_version, "award_note?"]
    output: Contract
    side_effects: ["Proposal.status UNDER_REVIEW -> AWARDED and the matching VenueShortlistEntry is held for the executed-contract join", "creates a Contract in approval_state PENDING_ROUTING and signature_state UNSIGNED, copying the negotiated terms and computing contracted_room_revenue_usd, pre_rebate_total_usd, volume_rebate_pct, volume_rebate_usd, contracted_total_usd via calculations.contract_volume_rebate and peak_rooms_per_night", "sets Contract.awarded_by_user_id to X-User-ID for the segregation-of-duties check", "cascade L1: MeetingEvent.status BID_REVIEW -> AWARDED (or AWARDED -> AWARDED on supersede), awarded_proposal_id set, committed_spend_usd set to contracted_total_usd and budget_remaining_usd recomputed by calculations.budget_envelope_invariant", "cascade L2: every sibling Proposal of the same Rfp in SUBMITTED, UNDER_REVIEW, COUNTERED or REVISED becomes REJECTED", "cascade L3: each rejected sibling's VenueShortlistEntry becomes ELIMINATED with elimination_reason NOT_SELECTED", "cascade L4: every PLANNED SiteInspection on those eliminated entries becomes CANCELLED with cancel_reason SHORTLIST_ELIMINATED", "on supersede: the previously awarded Proposal becomes REJECTED, its Contract moves to approval_state CANCELLED and signature_state VOIDED, its PENDING ApprovalSteps become SKIPPED and its SCHEDULED DepositInstallments become CANCELLED", "increments MeetingEvent.version by 1"]
  - method: GET
    path: "/sourcing/contracts/{contract_id}"
    description: "Read one contract with both state dimensions, the negotiated risk terms, the rebated total and the deposit rollup."
    roles: [SourcingManager, VenueRep, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/sourcing/contracts"
    description: "List contracts, filterable by event, awarded proposal, venue and either state dimension."
    roles: [SourcingManager, VenueRep, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["event_id?", "proposal_id?", "venue_id?", "approval_state?", "signature_state?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: POST
    path: "/sourcing/contracts/{contract_id}/route-approvals"
    description: "Generate the internal approval route for this contract from its value, its venue's live program standing and its force majeure scope."
    roles: [SourcingManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["creates the ApprovalStep chain via calculations.approval_route_generation with step_seq 1..N, decision PENDING, discoverable via GET /sourcing/contracts/{id}/approval-steps", "sets Contract.approval_step_count and moves approval_state PENDING_ROUTING -> IN_APPROVAL", "increments Contract.version by 1"]
  - method: GET
    path: "/sourcing/contracts/{id}/approval-steps"
    description: "List this contract's approval steps in ascending step_seq order."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["decision?", "limit?", "offset?"]
    output: ApprovalStep[]
    side_effects: []
  - method: GET
    path: "/sourcing/approval-steps/{step_id}"
    description: "Read one approval step with its required role, decision and decider."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: []
    output: ApprovalStep
    side_effects: []
  - method: POST
    path: "/sourcing/approval-steps/{step_id}/decide"
    description: "Record an approval decision on the lowest still-pending step; a rejection unwinds the whole award."
    roles: [ContractApprover, ProgramAdmin]
    code: 200
    input: [decision, "decision_note?"]
    output: ApprovalStep
    side_effects: ["ApprovalStep.decision PENDING -> APPROVED or REJECTED with approver_user_id set to X-User-ID and decided_at stamped at the logical clock", "on APPROVED of the highest step_seq: Contract.approval_state IN_APPROVAL -> APPROVED, and when signature_state is already COUNTERSIGNED the contract joins to EXECUTED with exactly the same side effects countersignature would have fired (executed_at stamped, MeetingEvent.status AWARDED -> CONTRACTED, the awarded VenueShortlistEntry RFP_ISSUED -> AWARDED, Venue.blocked_room_nights increased by contracted_paid_room_nights)", "cascade L1 on REJECTED: Contract.approval_state IN_APPROVAL -> REJECTED", "cascade L2 on REJECTED: Contract.signature_state -> VOIDED, every still-PENDING ApprovalStep of the contract becomes SKIPPED and every SCHEDULED DepositInstallment becomes CANCELLED", "cascade L3 on REJECTED: the awarded Proposal returns to REJECTED, MeetingEvent.status AWARDED -> BID_REVIEW with awarded_proposal_id cleared, committed_spend_usd returned to 0.00 and budget_remaining_usd recomputed", "increments Contract.version by 1"]
  - method: POST
    path: "/sourcing/contracts/{contract_id}/sign"
    description: "Planner signs the contract; approvals may still be in flight because signature and approval are independent state dimensions."
    roles: [SourcingManager]
    code: 200
    input: [planner_signatory_name]
    output: Contract
    side_effects: ["Contract.signature_state UNSIGNED -> PLANNER_SIGNED with planner_signatory_name stored", "increments Contract.version by 1"]
  - method: POST
    path: "/sourcing/contracts/{contract_id}/countersign"
    description: "Venue countersigns; when the approval route has already finished the contract joins straight to EXECUTED and the room block is committed."
    roles: [VenueRep]
    code: 200
    input: [venue_signatory_name]
    output: Contract
    side_effects: ["Contract.signature_state PLANNER_SIGNED -> COUNTERSIGNED with venue_signatory_name stored", "system join to EXECUTED with executed_at stamped when approval_state is already APPROVED", "on EXECUTED: MeetingEvent.status AWARDED -> CONTRACTED, the awarded VenueShortlistEntry moves RFP_ISSUED -> AWARDED and Venue.blocked_room_nights increases by contracted_paid_room_nights per calculations.room_night_inventory_invariant; MeetingEvent.cancellation_liability_usd stays 0.00 until an actual termination charges a fee", "increments Contract.version by 1"]
  - method: POST
    path: "/sourcing/contracts/{contract_id}/deposit-schedule"
    description: "Generate the deposit installment schedule for an executed contract, allocating the deposit across three dated installments."
    roles: [FinanceController]
    code: 200
    input: []
    output: Contract
    side_effects: ["creates three DepositInstallment rows in SCHEDULED via calculations.deposit_schedule_allocation, discoverable via GET /sourcing/contracts/{id}/deposit-installments", "sets Contract.deposit_total_usd, deposit_paid_usd 0.00 and deposit_outstanding_usd", "increments Contract.version by 1"]
  - method: GET
    path: "/sourcing/contracts/{id}/deposit-installments"
    description: "List this contract's deposit installments in ascending installment_seq order."
    roles: [SourcingManager, VenueRep, FinanceController, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DepositInstallment[]
    side_effects: []
  - method: GET
    path: "/sourcing/deposit-installments/{installment_id}"
    description: "Read one deposit installment with its weight, amount, due date and payment record."
    roles: [SourcingManager, VenueRep, FinanceController, ProgramAdmin]
    code: 200
    input: []
    output: DepositInstallment
    side_effects: []
  - method: POST
    path: "/sourcing/deposit-installments/{installment_id}/pay"
    description: "Record payment of a scheduled deposit installment; installments must be paid in sequence and to the exact cent."
    roles: [FinanceController]
    code: 200
    input: [paid_amount_usd, "payment_reference?"]
    output: DepositInstallment
    side_effects: ["DepositInstallment.status SCHEDULED -> PAID with paid_amount_usd, payment_reference and paid_at stamped at the logical clock", "increments Contract.deposit_paid_usd and decrements Contract.deposit_outstanding_usd by the same amount, keeping deposit_total_usd conserved", "increments Contract.version by 1"]
  - method: POST
    path: "/sourcing/contracts/{contract_id}/terminate"
    description: "Cancel an executed contract before the event starts, charging the tiered cancellation fee and issuing the rebooking credit."
    roles: [SourcingManager]
    code: 200
    input: [termination_reason]
    output: Contract
    side_effects: ["Contract.signature_state EXECUTED -> TERMINATED with terminated_at stamped and cancellation_fee_usd plus rebooking_credit_usd computed by calculations.contract_cancellation_fee at the current logical clock", "every SCHEDULED DepositInstallment becomes CANCELLED", "Venue.blocked_room_nights decreases by contracted_paid_room_nights, restoring calculations.room_night_inventory_invariant", "MeetingEvent.status CONTRACTED -> CANCELLED, cancellation_liability_usd set to the charged fee and committed_spend_usd returned to 0.00", "increments Contract.version by 1"]
  - method: POST
    path: "/sourcing/events/{event_id}/post-event-report"
    description: "Close out a concluded event with the actual room nights, F&B and audiovisual spend, computing attrition damages and the savings recognized against both benchmark and budget."
    roles: [SourcingManager]
    code: 201
    input: [actual_room_nights, actual_fnb_usd, actual_av_usd, "notes?"]
    output: PostEventReport
    side_effects: ["creates the single PostEventReport for this event with every attrition and realized-cost field from calculations.post_event_savings", "MeetingEvent.status CONTRACTED -> COMPLETED, savings_recognized_usd set to savings_vs_budget_usd, committed_spend_usd set to realized_total_usd and budget_remaining_usd recomputed", "Venue.blocked_room_nights decreases by Contract.contracted_paid_room_nights now that the block is consumed", "increments MeetingEvent.version by 1"]
  - method: GET
    path: "/sourcing/post-event-reports/{report_id}"
    description: "Read one post-event savings report."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: []
    output: PostEventReport
    side_effects: []
  - method: GET
    path: "/sourcing/post-event-reports"
    description: "List post-event savings reports, filterable by event and contract."
    roles: [SourcingManager, ContractApprover, FinanceController, ProgramAdmin]
    code: 200
    input: ["event_id?", "contract_id?", "limit?", "offset?"]
    output: PostEventReport[]
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed for the endpoint in section 1.5"
  - id: ERR_VENUE_OWNERSHIP_MISMATCH
    http: 403
    condition: "A VenueRep acts on a Proposal or Contract whose venue_id differs from X-User-ID"
  - id: ERR_APPROVAL_LEVEL_ROLE_MISMATCH
    http: 403
    condition: "The caller's role differs from the ApprovalStep.required_role for the step being decided"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The user who awarded the contract attempts to decide one of its approval steps"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "No MeetingEvent exists for the supplied event id"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "No Venue exists for the supplied venue id"
  - id: ERR_SHORTLIST_ENTRY_NOT_FOUND
    http: 404
    condition: "No VenueShortlistEntry exists for the supplied entry id"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "No SiteInspection exists for the supplied inspection id"
  - id: ERR_RFP_NOT_FOUND
    http: 404
    condition: "No Rfp exists for the supplied rfp id, including the previous_rfp_id of a later round"
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: "No Proposal exists for the supplied proposal id, including the proposal_id supplied at award"
  - id: ERR_COUNTER_NOT_FOUND
    http: 404
    condition: "No NegotiationCounter exists for the counter_id supplied on revise"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "No Contract exists for the supplied contract id"
  - id: ERR_APPROVAL_STEP_NOT_FOUND
    http: 404
    condition: "No ApprovalStep exists for the supplied step id"
  - id: ERR_INSTALLMENT_NOT_FOUND
    http: 404
    condition: "No DepositInstallment exists for the supplied installment id"
  - id: ERR_BENCHMARK_NOT_FOUND
    http: 404
    condition: "No RateBenchmark exists for the supplied benchmark id"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "No PostEventReport exists for the supplied report id"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "No SupplierPerformanceReview exists for the supplied review id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, wrong type, unknown enum member, negative money value, more than two decimal places on a money field, or a percentage outside its declared range"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset below 0 on a list endpoint"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "MeetingEvent end_date is not strictly after start_date"
  - id: ERR_INVALID_INSPECTION_WINDOW
    http: 422
    condition: "SiteInspection window_end is not strictly after window_start"
  - id: ERR_EVENT_CODE_DUPLICATE
    http: 409
    condition: "event_code already belongs to another MeetingEvent"
  - id: ERR_BENCHMARK_DUPLICATE
    http: 409
    condition: "A RateBenchmark already exists for the (destination_tier, program_type) pair"
  - id: ERR_VENUE_ALREADY_SHORTLISTED
    http: 409
    condition: "The venue is already on this event's shortlist, or rank_seq is already taken within the event"
  - id: ERR_RFP_ROUND_DUPLICATE
    http: 409
    condition: "An Rfp with this round_number already exists for the event"
  - id: ERR_EVENT_STATE_INVALID
    http: 409
    condition: "The MeetingEvent is not in a status that permits this operation"
  - id: ERR_SHORTLIST_ENTRY_STATE_INVALID
    http: 409
    condition: "The VenueShortlistEntry is not in a status that permits this operation, including eliminating an entry already AWARDED or ELIMINATED"
  - id: ERR_RFP_STATE_INVALID
    http: 409
    condition: "The Rfp is not DRAFT for issue or not ISSUED for close"
  - id: ERR_PROPOSAL_STATE_INVALID
    http: 409
    condition: "The Proposal is not in a status that permits this submit, decline, withdraw, evaluate, counter, revise or award"
  - id: ERR_INSPECTION_STATE_INVALID
    http: 409
    condition: "The SiteInspection is not PLANNED, or completion was attempted before the logical clock reached window_end"
  - id: ERR_CONTRACT_STATE_INVALID
    http: 409
    condition: "The Contract's approval_state or signature_state, or the addressed ApprovalStep's or DepositInstallment's status, does not permit this operation"
  - id: ERR_CONTRACT_ALREADY_EXECUTED
    http: 409
    condition: "An award supersede was attempted while the event's existing Contract is already EXECUTED"
  - id: ERR_DEPOSIT_ALREADY_SCHEDULED
    http: 409
    condition: "A deposit schedule was already generated for this contract"
  - id: ERR_RFP_NOT_OPEN
    http: 409
    condition: "The Proposal's parent Rfp is not in ISSUED, so bids and counters are not accepted"
  - id: ERR_SHORTLIST_ENTRY_NOT_SHORTLISTED
    http: 409
    condition: "A site inspection was planned against an entry that is not SHORTLISTED"
  - id: ERR_COUNTER_NOT_OPEN
    http: 409
    condition: "The referenced NegotiationCounter belongs to a different proposal or is already resolved"
  - id: ERR_APPROVAL_STEP_OUT_OF_ORDER
    http: 409
    condition: "An approval step was decided while a lower step_seq on the same contract is still PENDING"
  - id: ERR_DUPLICATE_APPROVER
    http: 409
    condition: "The caller has already decided another approval step on this contract"
  - id: ERR_INSPECTION_WINDOW_CONFLICT
    http: 409
    condition: "The requested inspection's buffered occupation interval intersects another live inspection's buffered interval on the same venue"
  - id: ERR_POST_EVENT_REPORT_EXISTS
    http: 409
    condition: "A PostEventReport already exists for this event"
  - id: ERR_DEPOSIT_SEQUENCE_VIOLATION
    http: 409
    condition: "An installment was paid while an earlier installment_seq on the same contract is unpaid"
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_event_version does not match the MeetingEvent's current version at award"
  - id: ERR_STALE_PROPOSAL_VERSION
    http: 412
    condition: "expected_proposal_version does not match the Proposal's current version when countering"
  - id: ERR_PREVIOUS_ROUND_NOT_CLOSED
    http: 422
    condition: "A round after the first omits previous_rfp_id, chains to another event's round, or chains to a round that is not CLOSED; or round 1 supplies previous_rfp_id"
  - id: ERR_REVIEW_EVENT_INVALID
    http: 422
    condition: "An EVENT-sourced performance review omits event_id, names an event that is not COMPLETED, or names an event whose awarded contract belongs to a different venue; or an EXTERNAL review supplies event_id"
  - id: ERR_VENUE_SUSPENDED
    http: 422
    condition: "The venue's preferred supplier standing is SUSPENDED, so it cannot be shortlisted, inspected or awarded"
  - id: ERR_PREFERRED_PROGRAM_REQUIRED
    http: 422
    condition: "The event is restricted to preferred suppliers but the entry's program_status_at_shortlist snapshot is OUT_OF_PROGRAM"
  - id: ERR_RATE_BENCHMARK_NON_COMPLIANT
    http: 422
    condition: "The bid being awarded carries compliance_status NON_COMPLIANT against the published rate benchmark"
  - id: ERR_BENCHMARK_NOT_CONFIGURED
    http: 422
    condition: "No RateBenchmark is published for the venue's destination tier and the event's program type"
  - id: ERR_VENUE_SPACE_INSUFFICIENT
    http: 422
    condition: "The venue's largest_space_sqft is smaller than the event's largest_meeting_space_sqft requirement"
  - id: ERR_NO_SHORTLISTED_VENUES
    http: 422
    condition: "The solicitation would be issued to an empty invitee set because no entry of the event is SHORTLISTED, INSPECTION_SCHEDULED or INSPECTED"
  - id: ERR_INSPECTION_INCOMPLETE
    http: 422
    condition: "An eligible entry flagged inspection_required has not reached INSPECTED at issue time"
  - id: ERR_BID_EVALUATION_REQUIRED
    http: 422
    condition: "The bid being awarded has no BidEvaluation on the CONTRACTED_BASIS"
  - id: ERR_RESPONSE_DUE_OUT_OF_RANGE
    http: 422
    condition: "response_due_at is at or before the logical clock, or at or after the event's start_date"
  - id: ERR_RESPONSE_DEADLINE_PASSED
    http: 422
    condition: "A bid was submitted after the Rfp's response_due_at"
  - id: ERR_INSPECTION_WINDOW_OVERLAPS_EVENT
    http: 422
    condition: "The inspection window intersects the parent event's own fully-closed date interval"
  - id: ERR_EVENT_NOT_CONCLUDED
    http: 422
    condition: "A post-event report was filed while the logical clock is still within or before the event's date range"
  - id: ERR_TERMINATION_WINDOW_CLOSED
    http: 422
    condition: "Termination was attempted at or after the event's start_date"
  - id: ERR_VENUE_ROOM_BLOCK_CAPACITY_EXCEEDED
    http: 422
    condition: "Executing this contract would commit more peak rooms per night than the venue holds across overlapping executed contracts"
  - id: ERR_BUDGET_CEILING_EXCEEDED
    http: 422
    condition: "The awarded bid's contracted-basis total exceeds the event's budget_ceiling_usd"
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 422
    condition: "paid_amount_usd differs from the installment's amount_usd"
  - id: ERR_ACTUALS_EXCEED_CONTRACT
    http: 422
    condition: "actual_room_nights exceeds the contract's contracted_paid_room_nights"

roles:
  - name: SourcingManager
    description: "Corporate meeting planner who defines requirements, shortlists venues, runs solicitations, negotiates terms, awards, signs and closes out events"
    identity: "opaque"
    exclusive_operations: ["create and lock meeting events", "add, shortlist and eliminate shortlist entries", "plan, complete and cancel site inspections", "draft, issue and close solicitation rounds", "evaluate bids and raise negotiation counters", "award an event and supersede a prior award", "route a contract for approval", "planner-sign a contract", "terminate an executed contract", "file the post-event savings report"]
    shared_operations: ["read every sourcing artefact", "capture supplier performance reviews (with ProgramAdmin)", "set the logical clock"]
  - name: VenueRep
    description: "Supplier-side representative of exactly one venue who responds to solicitations and countersigns contracts"
    identity: "entity_backed:Venue"
    exclusive_operations: ["submit, decline, withdraw and revise own venue's bids", "countersign own venue's contract"]
    shared_operations: ["read venues, solicitations, own bids, own counters and own contracts", "set the logical clock"]
  - name: ContractApprover
    description: "Internal approver who clears MANAGER, VP and LEGAL control steps on awarded contracts, and who may never approve a contract they awarded"
    identity: "opaque"
    exclusive_operations: ["decide MANAGER, VP and LEGAL approval steps"]
    shared_operations: ["read events, bids, contracts, approval steps and performance reviews", "set the logical clock"]
  - name: FinanceController
    description: "Treasury role that generates deposit schedules and records deposit payments"
    identity: "opaque"
    exclusive_operations: ["generate a contract's deposit schedule", "record payment of a deposit installment"]
    shared_operations: ["read events, bids, contracts, deposit installments and post-event reports", "set the logical clock"]
  - name: ProgramAdmin
    description: "Preferred-supplier program owner who maintains the venue master, publishes rate benchmarks, moves program standings and clears PROGRAM_COMPLIANCE approval steps"
    identity: "opaque"
    exclusive_operations: ["register venues and change preferred supplier standing", "publish rate benchmarks", "decide PROGRAM_COMPLIANCE approval steps"]
    shared_operations: ["read every sourcing artefact", "capture supplier performance reviews (with SourcingManager)", "set the logical clock"]
