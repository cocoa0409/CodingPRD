        claim_type: correct_result
        grounds: [calculations.participation_hold_reconciliation]
        excluded_because:
          difficulty_instance: participation_hold_conserved_across_commit_release
          rationale: "bank_hold + allocated == committed asserted at propose/commit/release checkpoints in the §1.8 compensating-invariant instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Missing X-User-Role/X-User-ID headers AND an unrecognized role value both fail authentication with the same 400 error id before any other check runs."
        test_recipe:
          setup: ["One registered officer exists so a control request can succeed"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
          trigger:
            - { call: "POST /credit/borrowers", payload: { legal_name: "No Headers LLC", naics_code: "332710", relationship_since: "2018-01-01" }, captures: { err1: $.data.error_id } }
            - { call: "POST /credit/borrowers", payload: { legal_name: "Bad Role LLC", naics_code: "332710", relationship_since: "2018-01-01" }, as: SuperUser, as_user_id: "x", captures: { err2: $.data.error_id } }
            - { call: "GET /credit/borrowers", as: RelationshipManager, as_user_id: "${rm}" }
          assert:
            - "no auth headers: status 400, error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "unrecognized role 'SuperUser': status 400, error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not 403 — the role is not recognized at all)"
            - "control GET /credit/borrowers returns an empty array (neither rejected request persisted a borrower)"

      - name: role_check_precedes_body_validation
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "One request violating BOTH authorization (CreditAnalyst creating a borrower) and schema (legal_name missing) returns 403 ERR_INSUFFICIENT_PERMISSIONS — priority 2 beats priority 4."
        test_recipe:
          setup: ["One analyst officer registered"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Andy Analyst" }, as: BankAdmin, captures: { an: $.data.id } }
          trigger:
            - { call: "POST /credit/borrowers", payload: { naics_code: "332710", relationship_since: "2018-01-01" }, as: CreditAnalyst, as_user_id: "${an}", captures: { err: $.data.error_id } }
          assert:
            - "status 403, error_id == ERR_INSUFFICIENT_PERMISSIONS — not 400 ERR_VALIDATION, though legal_name is also missing"

      - name: existence_check_precedes_state_check
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=6]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A transition POST against a nonexistent application id returns 404 ERR_NOT_FOUND — existence (priority 3) beats the from-state check (priority 6) that a real INTAKE application would have failed."
        test_recipe:
          setup: ["Officer rm registered"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
          trigger:
            - { call: "POST /credit/loan-applications/00000000-0000-0000-0000-000000000000/submit", payload: {}, as: RelationshipManager, as_user_id: "${rm}", captures: { err: $.data.error_id } }
          assert:
            - "status 404, error_id == ERR_NOT_FOUND — not 409 ERR_INVALID_STATE"

