# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2451 — Meat Department Cutting Test & Yield Management
#
# Every instance grounds ONLY in elements declared by SCAFFOLD.yaml §1.1–§1.7.
# Every numeric literal in `assert:` was computed by executing the relevant
# §1.3 formula against the pinned setup (Python, Decimal, round_half_up).
#
# Shared fixture vocabulary used by the chains below (all literals):
#   Department "Meat 41" / store_code S041 — all config at its declared defaults
#     (target_margin_pct 0.32, shelf lives 2/5/14, max_safe 4.4, critical 7.0,
#      pickup_slot_capacity 2, sanitation buffer 30, markdown_floor 0.10,
#      shrink_tolerance 0.015, deposit_rate 0.25)
#   Clock is driven to 2026-08-05T08:00:00Z (default startup 2026-08-01T00:00:00Z)
#   P1 = BEEF_RIBEYE_LIP_ON / WHOLE_MUSCLE / USA, gross 100.0, shrink 1.5,
#        invoice 84000, freight 2500, allowance 500
#        -> net_weight_lb 98.50, landed_cost_total_cents 86000,
#           landed_cost_per_lb_cents 873.0964
#   T1 lines on P1 (test_weight_lb 98.50): seq1 SALABLE_CUT 62.0 lb @1450 (RIB01),
#        seq2 GRIND_TRIM 12.0 lb @420 lean 78.0, seq3 GRIND_TRIM 6.5 lb @520
#        lean 92.0, seq4 FAT_BONE_LOSS 18.0 lb @0  -> unaccounted_lb 0.00
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: provisional_vs_final_retail_price_variant_divergence
        grounds:
          - calculations.retail_price_per_lb
          - calculations.retail_price_per_lb.variants.provisional_price
          - calculations.retail_price_per_lb.variants.final_price
          - calculations.subprimal_cost_allocation
          - entities.RetailItem.fields.provisional_price_per_lb_cents
          - entities.RetailItem.fields.final_price_per_lb_cents
          - entities.RetailItem.fields.price_variance_pct
          - state_machines.RetailItem.UNPRICED_to_PROPOSED
          - state_machines.RetailItem.PROPOSED_to_PRICED
        distinguishing_aspect: |
          Both variants price the SAME RetailItem RIB01 from the SAME purchase P1, yet the
          provisional basis (invoice-only 84000/98.50 divided by the book yield 0.62 =
          1375.4708) lands on 2149 while the final basis (the APPROVED test's measured
          allocation 1268.3226, which carries freight and allowance) lands on 1989 — a
          price_variance_pct of exactly -0.0745; this instance lives in the RetailItem
          pricing domain, the sibling instance lives in the ShrinkReconciliation pounds domain.
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; logical clock at 2026-08-05T08:00:00Z."
            - "RetailItem RIB01 (WHOLE_MUSCLE, cost_basis_source CUT_TEST_LINE) exists, price_status PROPOSED with provisional_price_per_lb_cents already stamped from P1's invoice-only basis."
            - "PrimalPurchase P1 is RECEIVED with landed_cost_total_cents 86000 and net_weight_lb 98.50."
            - "CuttingTest T1 on P1 is APPROVED, so RIB01 carries yield_adjusted_cost_per_lb_cents 1268.3226 from its SALABLE_CUT line."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /meat-ops/retail-items/${ri1_id}/price-proposals"
              payload: { primal_purchase_id: "${p1_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t1_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 1, subprimal_code: "RIBEYE_STEAK", disposition: "SALABLE_CUT", yield_weight_lb: 62.0, market_value_per_lb_cents: 1450, retail_item_id: "${ri1_id}" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 2, subprimal_code: "RIBEYE_TRIM_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 12.0, market_value_per_lb_cents: 420, lean_pct: 78.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 3, subprimal_code: "RIBEYE_TRIM_EXTRA_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 6.5, market_value_per_lb_cents: 520, lean_pct: 92.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 4, subprimal_code: "RIBEYE_FAT_BONE", disposition: "FAT_BONE_LOSS", yield_weight_lb: 18.0, market_value_per_lb_cents: 0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "APPROVE" }
              as: MeatManager
              as_user_id: "mgr-01"
          trigger:
            - call: "GET /meat-ops/retail-items/${ri1_id}"
              payload: {}
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_v: $.data.version }
            - call: "POST /meat-ops/retail-items/${ri1_id}/price-activations"
              payload: { expected_retail_item_version: "${ri1_v}", cutting_test_id: "${t1_id}" }
              as: MeatManager
              as_user_id: "mgr-01"
          assert:
            - "RetailItem.${ri1_id}.provisional_price_per_lb_cents == 2149"
            - "RetailItem.${ri1_id}.pricing_yield_pct_snapshot == 0.6294 (refreshed from the APPROVED CuttingTest.salable_yield_pct; it was the book constant 0.62 while the item was PROPOSED)"
            - "RetailItem.${ri1_id}.yield_adjusted_cost_per_lb_cents == 1268.3226"
            - "RetailItem.${ri1_id}.final_price_per_lb_cents == 1989"
            - "RetailItem.${ri1_id}.price_variance_pct == -0.0745"
            - "RetailItem.${ri1_id}.active_price_per_lb_cents == 1989"
            - "RetailItem.${ri1_id}.price_status == PRICED"
            - "RetailItem.${ri1_id}.country_of_origin_label == USA"
            - "RetailItem.${ri1_id}.final_price_per_lb_cents != RetailItem.${ri1_id}.provisional_price_per_lb_cents (delta == -160 cents)"

      - name: shrink_reconciliation_yield_model_vs_physical_count_divergence
        grounds:
          - calculations.shrink_variance_reconciliation
          - calculations.shrink_variance_reconciliation.variants.yield_model_basis
          - calculations.shrink_variance_reconciliation.variants.physical_count_basis
          - calculations.required_fill_derivation
          - calculations.markdown_valuation
          - entities.ShrinkReconciliation.fields.expected_salable_lb
          - entities.ShrinkReconciliation.fields.physical_salable_lb
          - entities.ShrinkReconciliation.fields.variance_pct
          - entities.ShrinkReconciliation.fields.within_tolerance
          - entities.Department.fields.shrink_tolerance_pct
        distinguishing_aspect: |
          On one identical set of two case lines (required 34.50 + 24.00, filled 34.0 + 24.0,
          markdown 2.0, shrink 1.0 + 0.5) the YIELD_MODEL basis reports variance_lb -0.50 /
          variance_pct -0.0085 / within_tolerance true while the PHYSICAL_COUNT basis reports
          -3.50 / -0.0603 / within_tolerance false — the two variants disagree on both the
          number AND the tolerance verdict; the divergence is in ShrinkReconciliation pounds,
          not in the RetailItem price domain of the sibling instance.
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config (shrink_tolerance_pct 0.015); clock at 2026-08-05T08:00:00Z."
            - "RIB01 (WHOLE_MUSCLE) is PRICED with active_price_per_lb_cents 1989; GRD80 (GROUND) is PRICED with active_price_per_lb_cents 569 from a COMPLETED grind blend."
            - "CasePlan CP1 for service_date 2026-08-05 is PUBLISHED with line 1 (RIB01) required_fill_lb 34.50 and line 2 (GRD80) required_fill_lb 24.00."
            - "Line 1 is filled 34.0 lb, marked down 2.0 lb at 1395 and shrunk 1.0 lb; line 2 is filled 24.0 lb and shrunk 0.5 lb."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "GRD80", subprimal_code: "GROUND_CHUCK_80", product_class: "GROUND" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri2_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /meat-ops/retail-items/${ri1_id}/price-proposals"
              payload: { primal_purchase_id: "${p1_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
            - call: "POST /meat-ops/cutting-tests"
              payload: { primal_purchase_id: "${p1_id}", test_weight_lb: 98.5, expected_primal_purchase_version: "${p1_v}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { t1_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 1, subprimal_code: "RIBEYE_STEAK", disposition: "SALABLE_CUT", yield_weight_lb: 62.0, market_value_per_lb_cents: 1450, retail_item_id: "${ri1_id}" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 2, subprimal_code: "RIBEYE_TRIM_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 12.0, market_value_per_lb_cents: 420, lean_pct: 78.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { ctl2_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 3, subprimal_code: "RIBEYE_TRIM_EXTRA_LEAN", disposition: "GRIND_TRIM", yield_weight_lb: 6.5, market_value_per_lb_cents: 520, lean_pct: 92.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { ctl3_id: $.data.id }
            - call: "POST /meat-ops/cutting-tests/${t1_id}/lines"
              payload: { line_seq: 4, subprimal_code: "RIBEYE_FAT_BONE", disposition: "FAT_BONE_LOSS", yield_weight_lb: 18.0, market_value_per_lb_cents: 0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/cutting-tests/${t1_id}/transitions"
              payload: { action: "APPROVE" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "GET /meat-ops/retail-items/${ri1_id}"
              payload: {}
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_v: $.data.version }
            - call: "POST /meat-ops/retail-items/${ri1_id}/price-activations"
              payload: { expected_retail_item_version: "${ri1_v}", cutting_test_id: "${t1_id}" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/retail-items/${ri2_id}/price-proposals"
              payload: { primal_purchase_id: "${p1_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
            - call: "POST /meat-ops/trim-lots"
              payload: { department_id: "${dept_id}", lot_code: "TL-A78", received_lb: 12.0, pack_date: "2026-08-05", cutting_test_line_id: "${ctl2_id}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { tl1_id: $.data.id }
            - call: "POST /meat-ops/trim-lots"
              payload: { department_id: "${dept_id}", lot_code: "TL-B92", received_lb: 6.5, pack_date: "2026-08-05", cutting_test_line_id: "${ctl3_id}" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { tl2_id: $.data.id }
            - call: "POST /meat-ops/grind-runs"
              payload: { department_id: "${dept_id}", target_retail_item_id: "${ri2_id}", declared_coo: "USA", scheduled_start_at: "2026-08-06T06:00:00Z", scheduled_end_at: "2026-08-06T07:00:00Z", target_lean_pct: 81.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { gr1_id: $.data.id }
            - call: "POST /meat-ops/grind-runs/${gr1_id}/inputs"
              payload: { trim_lot_id: "${tl1_id}", input_seq: 1, weight_lb: 12.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/grind-runs/${gr1_id}/inputs"
              payload: { trim_lot_id: "${tl2_id}", input_seq: 2, weight_lb: 3.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/grind-runs/${gr1_id}/transitions"
              payload: { action: "START" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/grind-runs/${gr1_id}/transitions"
              payload: { action: "COMPLETE" }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "GET /meat-ops/retail-items/${ri2_id}"
              payload: {}
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri2_v: $.data.version }
            - call: "POST /meat-ops/retail-items/${ri2_id}/price-activations"
              payload: { expected_retail_item_version: "${ri2_v}", grind_run_id: "${gr1_id}" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/case-plans"
              payload: { department_id: "${dept_id}", service_date: "2026-08-05" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cp1_id: $.data.id }
            - call: "POST /meat-ops/case-plans/${cp1_id}/lines"
              payload: { retail_item_id: "${ri1_id}", line_seq: 1, facings: 4, expected_movement_lb: 30.0 }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cpl1_id: $.data.id }
            - call: "POST /meat-ops/case-plans/${cp1_id}/lines"
              payload: { retail_item_id: "${ri2_id}", line_seq: 2, facings: 5, expected_movement_lb: 40.0 }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { cpl2_id: $.data.id }
            - call: "POST /meat-ops/case-plans/${cp1_id}/transitions"
              payload: { action: "PUBLISH" }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/case-plan-lines/${cpl1_id}/fills"
              payload: { filled_lb: 34.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/case-plan-lines/${cpl2_id}/fills"
              payload: { filled_lb: 24.0 }
              as: MeatCutter
              as_user_id: "cutter-01"
            - call: "POST /meat-ops/case-plan-lines/${cpl1_id}/markdowns"
              payload: { markdown_lb: 2.0, markdown_price_per_lb_cents: 1395 }
              as: PricingAnalyst
              as_user_id: "analyst-01"
            - call: "POST /meat-ops/case-plan-lines/${cpl1_id}/shrink-events"
              payload: { shrink_lb: 1.0 }
              as: MeatManager
              as_user_id: "mgr-01"
            - call: "POST /meat-ops/case-plan-lines/${cpl2_id}/shrink-events"
              payload: { shrink_lb: 0.5 }
              as: MeatManager
              as_user_id: "mgr-01"
          trigger:
            - call: "POST /meat-ops/shrink-reconciliations"
              payload: { department_id: "${dept_id}", period_start_date: "2026-08-05", period_end_date: "2026-08-05", basis: "YIELD_MODEL" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
              captures: { sr_ym_id: $.data.id }
            - call: "POST /meat-ops/shrink-reconciliations"
              payload: { department_id: "${dept_id}", period_start_date: "2026-08-05", period_end_date: "2026-08-05", basis: "PHYSICAL_COUNT" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
              captures: { sr_pc_id: $.data.id }
          assert:
            - "ShrinkReconciliation.${sr_ym_id}.expected_salable_lb == 58.50"
            - "ShrinkReconciliation.${sr_ym_id}.physical_salable_lb == 58.00"
            - "ShrinkReconciliation.${sr_ym_id}.variance_lb == -0.50"
            - "ShrinkReconciliation.${sr_ym_id}.variance_pct == -0.0085"
            - "ShrinkReconciliation.${sr_ym_id}.within_tolerance == true"
            - "ShrinkReconciliation.${sr_pc_id}.expected_salable_lb == 58.00"
            - "ShrinkReconciliation.${sr_pc_id}.physical_salable_lb == 54.50"
            - "ShrinkReconciliation.${sr_pc_id}.variance_lb == -3.50"
            - "ShrinkReconciliation.${sr_pc_id}.variance_pct == -0.0603"
            - "ShrinkReconciliation.${sr_pc_id}.within_tolerance == false"
            - "ShrinkReconciliation.${sr_ym_id}.markdown_dollars_cents == 1188 and ShrinkReconciliation.${sr_pc_id}.markdown_dollars_cents == 1188 (basis-independent)"
            - "ShrinkReconciliation.${sr_ym_id}.shrink_dollars_cents == 2274 and ShrinkReconciliation.${sr_pc_id}.shrink_dollars_cents == 2274 (per-line rounding: 1989 + 285)"
            - "ShrinkReconciliation.${sr_ym_id}.status == DRAFT and ShrinkReconciliation.${sr_pc_id}.status == DRAFT"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: subprimal_allocation_rounds_per_line_then_reconciles_remainder
        grounds:
          - calculations.subprimal_cost_allocation
          - calculations.landed_cost_derivation
          - entities.CuttingTestLine.fields.allocated_cost_cents
          - entities.CuttingTestLine.fields.allocated_cost_per_lb_cents
          - entities.PrimalPurchase.fields.allocated_cost_cents
          - entities.PrimalPurchase.fields.unallocated_cost_cents
          - state_machines.CuttingTest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          This instance exercises mode (b) — a pinned evaluation ORDER: each of the three
          value-bearing lines is rounded individually (78635 / 4408 / 2956 = 85999) and the
          +1 cent remainder is then assigned entirely to the greatest-yield_weight_lb line
          (seq 1 -> 78636); rounding the unrounded shares once at the end would leave seq 1 at
          78635 and the purchase ledger 1 cent short, which the assertion below falsifies.
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z."
            - "PrimalPurchase P1 RECEIVED with landed_cost_total_cents 86000, allocated_cost_cents 0, unallocated_cost_cents 86000."
            - "CuttingTest T1 on P1 is SUBMITTED with its four lines recorded (value weights 89900 / 5040 / 3380 and one zero-value FAT_BONE_LOSS line)."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: StoreAdmin
              as_user_id: "admin-01"
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
