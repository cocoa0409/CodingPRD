              captures: { wo_v3: $.data.version }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { service_mode: "IN_SHOP", scheduled_start: "2026-05-03T13:00:00Z", scheduled_end: "2026-05-03T14:00:00Z", expected_work_order_version: "${wo_v2}" }
              as: ShopOperator
