              as: LicensingBoard
              captures: { lic_ca: $.data.id }
            - call: "POST /payers"
              payload: { name: "Parity", telehealth_parity: true, copay_cents: 2500, covered_state_codes: ["CA"], allowed_amount_cents: 8000 }
              as: ComplianceOfficer
              captures: { payer_par: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat A", email: "a@x.com", residence_state_code: "CA", insurance_payer_id: "${payer_par}" }
              as: Anonymous
              captures: { pat_a: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_a}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_a}"
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "POST /visits/${v_id}/approve"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "GET /visits/${v_id}/claims"
              payload: {}
              as: ComplianceOfficer
              captures: { claim_id: "$.data[0].id" }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /state-licenses/${lic_ca}/suspend"
              payload: { suspension_reason: "board action" }
              as: LicensingBoard
            - call: "GET /claims/${claim_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { claim_status: $.data.status }
          assert:
            - "the Claim is ADJUDICATED before suspend; after suspend Visit.${v_id}.status == VOIDED"
            - "Claim.${claim_id}.status == REVERSED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: state_license_half_open_period_overlap_rejected
        grounds:
          - validations[priority=7]
          - errors[ERR_LICENSE_PERIOD_OVERLAP]
          - entities.StateLicense.fields.effective_date
          - entities.StateLicense.fields.expiration_date
        distinguishing_aspect: |
          HALF-OPEN interval semantics on StateLicense: a second CA license [2026-06-30, 2027-06-30)
          overlapping the existing [2026-01-01, 2026-07-01) is rejected with ERR_LICENSE_PERIOD_OVERLAP;
          an adjacent license starting exactly at the prior expiration (2026-07-01) would be accepted.
          Interval geometry = half-open period containment on the StateLicense resource.
        test_recipe:
          setup:
            - "Physician with an existing ACTIVE CA license [2026-01-01, 2026-07-01)."
          setup_api_calls:
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2026-07-01T00:00:00.000Z" }
              as: LicensingBoard
              captures: { lic1: $.data.id }
          trigger:
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-06-30T00:00:00.000Z", expiration_date: "2027-06-30T00:00:00.000Z" }
              as: LicensingBoard
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_LICENSE_PERIOD_OVERLAP"
            - "GET /physicians/${phys_id}/state-licenses returns total_count == 1 (the overlapping license was not created)"

      - name: visit_point_buffer_slot_conflict_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_VISIT_SLOT_CONFLICT]
          - entities.Visit.fields.scheduled_at
        distinguishing_aspect: |
          POINT-PLUS-SYMMETRIC-BUFFER semantics on Visit (a different interval geometry and a different
          resource than the half-open license): a second visit for the same physician scheduled 29 minutes
          after an existing non-terminal visit is rejected (within the 30-min exclusive buffer); a visit
          exactly 30 minutes later would abut and be accepted.
        test_recipe:
          setup:
            - "Physician licensed CA. Cash patient. Existing REQUESTED visit at 2026-04-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-01T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-01T10:29:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_VISIT_SLOT_CONFLICT"
            - "GET /visits?physician_id=${phys_id} returns total_count == 1 (the conflicting visit was not created)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: suspend_reinstate_conserves_active_license_count
        grounds:
          - state_machines.StateLicense.ACTIVE_to_SUSPENDED
          - state_machines.StateLicense.SUSPENDED_to_ACTIVE
          - entities.Physician.fields.active_license_count
        distinguishing_aspect: |
          CONSERVED QUANTITY = Physician.active_license_count (a COUNT). The forward suspend (decrements)
          paired with its compensating reinstate (increments) leaves active_license_count ==
          count of StateLicense rows with status==ACTIVE, identical to the pre-suspend value (2).
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician with two ACTIVE licenses (CA FULL, TX COMPACT_EXPEDITED), imlc_eligible true. active_license_count == 2."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", imlc_eligible: true, home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
              captures: { lic_ca: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "TX", issuance_type: "COMPACT_EXPEDITED", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
              captures: { lic_tx: $.data.id }
            - call: "POST /state-licenses/${lic_ca}/suspend"
              payload: { suspension_reason: "temporary" }
              as: LicensingBoard
          trigger:
            - call: "POST /state-licenses/${lic_ca}/reinstate"
              payload: {}
              as: LicensingBoard
            - call: "GET /physicians/${phys_id}"
              payload: {}
              as: LicensingBoard
              captures: { alc: $.data.active_license_count }
          assert:
            - "Physician.${phys_id}.active_license_count == 2 (restored to pre-suspend value)"
            - "StateLicense.${lic_ca}.status == ACTIVE"

      - name: approve_then_suspend_reversal_conserves_committed_plan_paid
        grounds:
          - state_machines.Visit.COMPLIANCE_CLEARED_to_APPROVED_INSURANCE
          - state_machines.Claim.ADJUDICATED_to_REVERSED
          - entities.Claim.fields.plan_paid_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = committed plan liability, sum(Claim.plan_paid_cents WHERE status IN
          {SUBMITTED, ADJUDICATED}) (a MONETARY sum, a different type of conserved quantity than the
          license COUNT above). Forward approve commits 5500; the compensating suspension-cascade
          reversal moves the claim to REVERSED, returning the committed-liability sum to its pre-approve value of 0.
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician licensed CA. Parity payer covers CA (copay 2500, allowed 8000). Insured patient."
            - "Cleared insurance visit (list_fee 10000) not yet approved; committed plan_paid sum == 0."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
              captures: { lic_ca: $.data.id }
            - call: "POST /payers"
              payload: { name: "Parity", telehealth_parity: true, copay_cents: 2500, covered_state_codes: ["CA"], allowed_amount_cents: 8000 }
              as: ComplianceOfficer
              captures: { payer_par: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat A", email: "a@x.com", residence_state_code: "CA", insurance_payer_id: "${payer_par}" }
              as: Anonymous
              captures: { pat_a: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_a}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_a}"
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
          trigger:
            - call: "POST /visits/${v_id}/approve"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
            - call: "GET /visits/${v_id}/claims"
              payload: {}
              as: ComplianceOfficer
              captures: { claim_id: "$.data[0].id", committed_after_approve: "$.data[0].plan_paid_cents" }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: ComplianceOfficer
              captures: { adj_plan_paid: $.data.plan_paid_cents }
            - call: "POST /state-licenses/${lic_ca}/suspend"
              payload: { suspension_reason: "board action" }
              as: LicensingBoard
            - call: "GET /claims/${claim_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { claim_status_after_suspend: $.data.status }
          assert:
            - "after approve+adjudicate the Claim plan_paid_cents == 5500 (committed liability rose from 0)"
            - "after suspend Claim.${claim_id}.status == REVERSED, so sum(plan_paid_cents WHERE status IN {SUBMITTED, ADJUDICATED}) == 0 (restored to pre-approve value)"
