      - name: duplicate_gtin_same_standard_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRODUCT_GTIN_EXISTS]", "entities.Product.fields.gtin"]
        distinguishing_aspect: "GTIN uniqueness is scoped per standard: duplicate gtin under the same standard is 409 ERR_PRODUCT_GTIN_EXISTS; the same gtin under a different standard is accepted."
        test_recipe:
          setup: ["two standards NGMO and GF; brand B1; P1 already enrolled under NGMO with gtin G-DUP"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /claim-standards", payload: { claim_code: "GF", name: "Gluten-Free", ingredient_threshold_pct: 0.5, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std2: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P1", gtin: "G-DUP", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std}", name: "P2", gtin: "G-DUP", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { err: $.data.error_id } }
            - { call: "POST /products", payload: { brand_id: "${b1}", standard_id: "${std2}", name: "P3", gtin: "G-DUP", annual_volume_units: 100 }, as: BrandRep, as_user_id: "${b1}", captures: { p3: $.data.id } }
          assert:
            - "same standard + same gtin: error_id == ERR_PRODUCT_GTIN_EXISTS (409)"
            - "different standard + same gtin: created with 201"

      - name: weight_sum_over_one_hundred_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_WEIGHT_SUM_EXCEEDED]", "entities.Ingredient.fields.declared_weight_pct"]
        distinguishing_aspect: "Aggregate boundary: cumulative declared_weight_pct may reach exactly 100 (60.00 + 40.00 accepted) but one more 0.01 tips it to 100.01 -> 422 ERR_WEIGHT_SUM_EXCEEDED."
        test_recipe:
          setup: ["DRAFT product with one 60.00% ingredient"]
          setup_api_calls:
            - { call: "POST /claim-standards", payload: { claim_code: "NGMO", name: "Non-GMO", ingredient_threshold_pct: 0.9, exemption_max_weight_pct: 0.5 }, as: VerifierAdmin, captures: { std: $.data.id } }
            - { call: "POST /brands", payload: { name: "B1", contact_email: "b1@x.com" }, as: VerifierAdmin, captures: { b1: $.data.id } }
