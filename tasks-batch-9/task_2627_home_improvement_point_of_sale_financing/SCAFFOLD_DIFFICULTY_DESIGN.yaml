      - name: enrollment_approval_gated_on_license_verification_state
        grounds:
          - validations.priority_24
          - errors.ERR_LICENSE_NOT_VERIFIED
          - state_machines.MerchantLicense.UNVERIFIED_to_VERIFIED
          - state_machines.MerchantLicense.UNVERIFIED_to_REJECTED
          - state_machines.Merchant.PENDING_REVIEW_to_APPROVED
        distinguishing_aspect: |
          ENTITY PAIR (MerchantLicense -> Merchant): the Merchant transition
          PENDING_REVIEW -> APPROVED is gated on the verification_status of a DIFFERENT
          entity, and the gate is keyed on (trade_type, state_code) as well as on the state,
          so a VERIFIED licence for the wrong state and an UNVERIFIED licence for the right
          state both fail. Only when a licence that matches all three facts reaches VERIFIED
          does the merchant transition, and the failed attempts leave Merchant.version
          untouched.
        test_recipe:
          setup:
            - "TradeRule ROOFING (min_license_months 6) and PromotionPlan DI12-ROOF exist."
            - "Merchant Summit Roofing LLC is registered as ROOFING / TX and is at version 1 in DRAFT."
            - "Licence L1 is ROOFING / TX 2026-01-01 -> 2027-06-30 and stays UNVERIFIED."
            - "Licence L2 is ROOFING / CA 2026-01-01 -> 2027-06-30 and is VERIFIED (a different (trade, state) key, so no coverage overlap with L1)."
            - "The merchant has submitted for review, so enrollment_status == PENDING_REVIEW and version == 2."
            - "Logical clock at 2026-08-01T00:00:00Z, so a 2027-06-30 expiry leaves 10 whole months of coverage — well past min_license_months 6."
          setup_api_calls:
            - call: "POST /trade-rules"
              payload: { trade_type: "ROOFING", max_ticket_cents: 5000000, holdback_pct_bps: 500, max_precompletion_release_bps: 7000, velocity_cap_cents: 15000000, requires_completion_certificate: true, min_license_months: 6 }
