# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1947: Seed Library & Plant Swap Program
# Breadth probe over §1.1-§1.7 claims not covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: entity_member_creation_defaults_applied
        claim_type: creation_defaults
        grounds: ["entities.Member"]
        distinguishing_aspect: "POST /api/members with only required fields yields status ACTIVE, all counters 0, simple_return_rate 0.0, standing_tier STANDARD, effective_borrow_limit 5, credits_balance 0."
        test_recipe:
          setup: ["Site S exists"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "POST /api/members"
              payload: { email: "d@x.com", full_name: "D", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { st: "$.data.status", tier: "$.data.standing_tier", lim: "$.data.effective_borrow_limit", act: "$.data.active_checkout_count", bal: "$.data.credits_balance", ver: "$.data.version" }
          assert:
            - "st == ACTIVE"
            - "tier == STANDARD"
            - "lim == 5"
            - "act == 0"
            - "bal == 0"
            - "ver == 1"

      - name: entity_member_missing_required_email_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Member.fields.email", "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required email on POST /api/members yields ERR_INVALID_REQUEST (400), not a created member."
        test_recipe:
          setup: ["Site S exists"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "POST /api/members"
              payload: { full_name: "No Email", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: entity_lot_duplicate_code_rejected
        claim_type: type_constraints
        grounds: ["entities.SeedLot.fields.lot_code", "validations[priority=8]", "errors[ERR_DUPLICATE_LOT_CODE]"]
        distinguishing_aspect: "A second lot reusing (variety_id, harvest_year, lot_code) is rejected with ERR_DUPLICATE_LOT_CODE; the same lot_code under a different harvest_year IS accepted."
        test_recipe:
          setup: ["Site S, variety V exist"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_6B" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "HERB", approved_zones: ["ZONE_6B"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "DUP", harvest_year: 2026, seeds_received: 50, provisional_viability_pct: 75.00 }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "DUP", harvest_year: 2026, seeds_received: 60, provisional_viability_pct: 80.00 }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "DUP", harvest_year: 2027, seeds_received: 60, provisional_viability_pct: 80.00 }
              as: ProgramAdmin
              captures: { ok_id: "$.data.id" }
          assert:
            - "err == ERR_DUPLICATE_LOT_CODE"
            - "ok_id is a non-null server id (different harvest_year escapes the uniqueness scope)"

      - name: entity_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/seed-lots/{random-uuid} yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/seed-lots/11111111-2222-3333-4444-555555555555"
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: entity_body_fk_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]", "entities.Checkout.fields.packet_id"]
        distinguishing_aspect: "POST /api/checkouts with a nonexistent packet_id yields ERR_NOT_FOUND (body-FK existence, priority 5), distinct from path-id 404."
        test_recipe:
          setup: ["Site S, member M exist"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "99999999-8888-7777-6666-555555555555" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: entity_credit_entry_immutable_append_only
        claim_type: immutability
        grounds: ["entities.CreditEntry"]
        distinguishing_aspect: "CreditEntry (common_fields: false) exposes no update endpoint and no version field; the ledger can only grow by system-appended rows. An EARNED row for SEED_PACKET/GOOD is 2 credits."
        test_recipe:
          setup: ["event E INTAKE_OPEN with one ACCEPTED SEED_PACKET/GOOD item from member M"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_5A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "FLOWER", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2026-09-05T10:00:00Z", end_at: "2026-09-05T12:00:00Z" }
              as: ProgramAdmin
              captures: { e_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/swap-events/${e_id}/open-intake"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/swap-events/${e_id}/intake-items"
              payload: { member_id: "${m_id}", variety_id: "${v_id}", item_type: "SEED_PACKET", condition: "GOOD" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it: "$.data.id" }
            - call: "POST /api/intake-items/${it}/screen"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdmin
          trigger:
            - call: "GET /api/credit-entries?member_id=${m_id}"
              as: ProgramAdmin
              captures: { entry_type: "$.data[0].entry_type", credits: "$.data[0].credits" }
          assert:
            - "entry_type == EARNED"
            - "credits == 2                      # round_half_up(2*1.0) + 0 rarity"
            - "response rows carry id and created_at but no version/updated_at (common_fields: false)"

      - name: entity_packet_code_format_and_sequence
        claim_type: computed_fields
        grounds: ["entities.SeedPacket.fields.packet_code"]
        distinguishing_aspect: "Packed packets are labelled '<lot_code>-<harvest_year>-<seq>' with seq starting 001 and incrementing per lot across separate pack calls."
        test_recipe:
          setup: ["ACTIVE lot L (certified 90.00) with label stock; volunteer approved"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_7A", label_stock_count: 10 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "LBL", harvest_year: 2026, seeds_received: 500, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 50, sprouted_count: 45 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 2, seeds_per_packet: 10 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 1, seeds_per_packet: 10 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { c1: "$.data[0].packet_code", c3: "$.data[2].packet_code" }
          assert:
            - "c1 == 'LBL-2026-001'"
            - "c3 == 'LBL-2026-003'   # sequence continues across separate pack calls"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_checkout_invalid_transition_verify_on_active
        claim_type: invalid_transition
        grounds: ["state_machines.Checkout", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "verify-return on an ACTIVE (never returned) checkout is not in the transition table -> ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["ACTIVE lot, 1 packet, member M with one ACTIVE checkout"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 5 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "VEGETABLE", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "IV1", harvest_year: 2026, seeds_received: 100, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 1, seeds_per_packet: 10 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { p1: "$.data[0].id" }
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /api/checkouts/${c_id}/verify-return"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /api/checkouts/${c_id}"
              as: ProgramAdmin
              captures: { st: "$.data.status" }
          assert:
            - "err == ERR_INVALID_STATE"
            - "st == ACTIVE   # unchanged; no side effects"

      - name: sm_terminal_lockdown_certified_test_recertify
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.GerminationTest", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A CERTIFIED (terminal) GerminationTest rejects a second certify with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["lot with one CERTIFIED PASS test (lot now ACTIVE)"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_7A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "TM1", harvest_year: 2026, seeds_received: 100, provisional_viability_pct: 80.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_ALREADY_TERMINAL"

      - name: sm_initial_states_on_creation
        claim_type: initial_state
        grounds: ["state_machines.SeedLot", "state_machines.SwapEvent", "state_machines.PackingSession", "state_machines.Volunteer"]
        distinguishing_aspect: "Newly created SeedLot is DRAFT, SwapEvent is DRAFT, packing session is SCHEDULED; approve moves Volunteer APPLIED -> ACTIVE."
        test_recipe:
          setup: ["site + variety exist; volunteer created"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_7A" }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id", vol_initial: "$.data.status" }
          trigger:
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "IN1", harvest_year: 2026, seeds_received: 10, provisional_viability_pct: 80.00 }
              as: ProgramAdmin
              captures: { lot_st: "$.data.status" }
            - call: "POST /api/swap-events"
              payload: { site_id: "${s_id}", title: "E", start_at: "2026-10-17T10:00:00Z", end_at: "2026-10-17T12:00:00Z" }
              as: ProgramAdmin
              captures: { ev_st: "$.data.status" }
            - call: "POST /api/packing-sessions"
              payload: { site_id: "${s_id}", title: "PS", start_at: "2026-10-18T09:00:00Z", end_at: "2026-10-18T11:00:00Z", capacity: 3 }
              as: ProgramAdmin
              captures: { ps_st: "$.data.status" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
              captures: { vol_st: "$.data.status" }
          assert:
            - "lot_st == DRAFT"
            - "ev_st == DRAFT"
            - "ps_st == SCHEDULED"
            - "vol_initial == APPLIED"
            - "vol_st == ACTIVE   # approve transition APPLIED -> ACTIVE"

      - name: sm_side_effect_verify_return_reintegrates_packet
        claim_type: side_effect_execution
        grounds: ["state_machines.Checkout.RETURNED_to_VERIFIED", "state_machines.SeedPacket.RETURNED_to_AVAILABLE"]
        distinguishing_aspect: "verify-return on a RETURNED checkout whose lot is still ACTIVE moves the packet RETURNED -> AVAILABLE (reintegration branch), drops member active count to 0, and the packet is borrowable again."
        test_recipe:
          setup: ["ACTIVE lot with 1 packet; member M; checkout returned (RETURNED)"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 5 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "VEGETABLE", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "SE1", harvest_year: 2026, seeds_received: 100, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 1, seeds_per_packet: 10 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { p1: "$.data[0].id" }
            - call: "POST /api/members"
              payload: { email: "m@x.com", full_name: "M", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/checkouts"
              payload: { member_id: "${m_id}", packet_id: "${p1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { c_id: "$.data.id" }
            - call: "POST /api/checkouts/${c_id}/return"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /api/checkouts/${c_id}/verify-return"
              payload: {}
              as: ProgramAdmin
              captures: { c_st: "$.data.status" }
            - call: "GET /api/seed-packets/${p1}"
              as: ProgramAdmin
              captures: { p_st: "$.data.status" }
            - call: "GET /api/members/${m_id}"
              as: ProgramAdmin
              captures: { act: "$.data.active_checkout_count", term: "$.data.terminal_checkout_count", ver_cnt: "$.data.verified_return_count" }
          assert:
            - "c_st == VERIFIED"
            - "p_st == AVAILABLE      # reintegrated because lot is ACTIVE"
            - "act == 0 and term == 1 and ver_cnt == 1"

      - name: sm_double_return_is_invalid_state
        claim_type: idempotency
        grounds: ["state_machines.Checkout", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating POST /checkouts/{id}/return after a successful return is rejected with ERR_INVALID_STATE (return is not a valid trigger from RETURNED)."
        test_recipe:
          setup: ["checkout C in RETURNED"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 5 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "VEGETABLE", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "DR1", harvest_year: 2026, seeds_received: 100, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
