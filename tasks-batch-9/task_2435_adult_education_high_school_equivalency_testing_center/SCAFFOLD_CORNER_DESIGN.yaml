              payload: { enrollment_id: "${e}", limit: 2, offset: 0 }
              as: ProgramCoordinator
            - call: "GET /attendance-entries"
              payload: { enrollment_id: "${e}", status: "VOIDED" }
              as: ProgramCoordinator
          assert:
            - "GET /attendance-entries?enrollment_id=${e}&limit=2&offset=0 returns 200 with exactly 2 items, total_count == 3, has_more == true"
            - "GET /attendance-entries?enrollment_id=${e}&status=VOIDED returns 200 with exactly 1 item whose id == ${ae3}, total_count == 1, has_more == false"
            - "GET /enrollments/${e} reports data.posted_hours == 4.00 after the void"

  - section: state_machines
    instances:
      - name: student_orientation_completion_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.Student.transitions.INTAKE_STARTED_to_ORIENTED
          - endpoints[POST /students/{studentId}/orientation-completion]
        distinguishing_aspect: |
          The orientation transition writes orientation_completed_at from the LOGICAL clock and bumps
          Student.version by exactly 1; nothing else about the student changes (placement_efl_level
          stays null, so the learner is oriented but not yet placeable into a section).
        test_recipe:
          setup:
            - "One student in INTAKE_STARTED; logical clock advanced to 2026-08-04T10:00:00Z."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Pia Renn", email: "pia.renn@example.org", primary_track: "LITERACY" }
              as: ProgramCoordinator
              captures: { s: $.data.id, s_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T10:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
          assert:
            - "POST /students/${s}/orientation-completion returns 200"
            - "data.intake_status == 'ORIENTED' and data.orientation_completed_at == '2026-08-04T10:00:00Z'"
            - "data.version == ${s_v0} + 1"
            - "data.placement_efl_level stays null and data.active_enrollment_count stays 0"

      - name: student_orientation_completion_repeated_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Student.transitions.INTAKE_STARTED_to_ORIENTED
          - validations[priority=30]
          - errors[ERR_INVALID_INTAKE_STATE]
        distinguishing_aspect: |
          The second orientation call is refused with ERR_INVALID_INTAKE_STATE (409) and must NOT
          re-stamp orientation_completed_at with the later clock value - the first timestamp survives.
        test_recipe:
          setup:
            - "One student oriented at clock 2026-08-04T10:00:00Z; clock then advanced to 2026-08-06T10:00:00Z."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Quill Adeyemi", email: "quill.adeyemi@example.org", primary_track: "ESL" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T10:00:00Z" }
              as: Registrar
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T10:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: ProgramCoordinator
              captures: { e1: $.data.error_id }
            - call: "GET /students/${s}"
              payload: {}
              as: Registrar
          assert:
            - "the second POST /students/${s}/orientation-completion returns 409 with data.error_id == 'ERR_INVALID_INTAKE_STATE'"
            - "GET /students/${s} returns 200 with data.intake_status == 'ORIENTED' and data.orientation_completed_at == '2026-08-04T10:00:00Z' (unchanged)"

      - name: center_authorization_decision_on_withdrawn_center_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TestingCenter.terminal_states
          - errors[ERR_CENTER_DECISION_NOT_ALLOWED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / testing_center_authorization_branch_divergent_side_effects
          rationale: "That instance's final two asserts already drive GRANT_FULL against a WITHDRAWN center (409 ERR_CENTER_DECISION_NOT_ALLOWED) and room creation under it (409 ERR_CENTER_NOT_AUTHORIZED)."

      - name: center_grant_provisional_after_full_authorized_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.TestingCenter.transitions.APPLIED_to_FULL_AUTHORIZED
          - validations[priority=30]
          - errors[ERR_CENTER_DECISION_NOT_ALLOWED]
        distinguishing_aspect: |
          FULL_AUTHORIZED has no outbound GRANT_PROVISIONAL edge (only PROVISIONAL -> FULL_AUTHORIZED
          exists), so a downgrade attempt is 409 and must not shrink allowed_subtests or
          max_sessions_per_week - the fork is one-way.
        test_recipe:
          setup:
            - "A center in FULL_AUTHORIZED with all four subtests and max_sessions_per_week 20."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "One Way Center", state_code: "NV" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
          trigger:
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_PROVISIONAL" }
              as: StateAuthority
              captures: { e1: $.data.error_id }
            - call: "GET /testing-centers/${c}"
              payload: {}
              as: StateAuthority
          assert:
            - "the GRANT_PROVISIONAL call returns 409 with data.error_id == 'ERR_CENTER_DECISION_NOT_ALLOWED'"
            - "GET /testing-centers/${c} returns 200 with data.authorization_status == 'FULL_AUTHORIZED', data.allowed_subtests == ['MATH', 'RLA', 'SCIENCE', 'SOCIAL_STUDIES'], data.max_sessions_per_week == 20"

      - name: proctor_renew_decision_from_pending_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Proctor.transitions.LAPSED_to_CERTIFIED
          - validations[priority=30]
          - errors[ERR_PROCTOR_DECISION_NOT_ALLOWED]
        distinguishing_aspect: |
          RENEW is only defined from LAPSED; applying it to a PENDING proctor is 409
          ERR_PROCTOR_DECISION_NOT_ALLOWED and certification_expires_at stays null - RENEW is not a
          synonym for CERTIFY.
        test_recipe:
          setup:
            - "A FULL_AUTHORIZED center with one PENDING proctor."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Renew Guard Center", state_code: "UT" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Rai Osman", daily_hour_cap: 8.00 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p: $.data.id }
          trigger:
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "RENEW", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
              captures: { e1: $.data.error_id }
            - call: "GET /proctors/${p}"
              payload: {}
              as: StateAuthority
          assert:
            - "the RENEW call returns 409 with data.error_id == 'ERR_PROCTOR_DECISION_NOT_ALLOWED'"
            - "GET /proctors/${p} returns 200 with data.certification_status == 'PENDING' and data.certification_expires_at == null"

      - name: proctor_certification_decision_after_revoked_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Proctor.terminal_states
          - state_machines.Proctor.transitions.PENDING_to_REVOKED
          - errors[ERR_PROCTOR_DECISION_NOT_ALLOWED]
        distinguishing_aspect: |
          REVOKED is terminal: REVOKE is legal from PENDING (the cascade is a no-op with no
          assignments), but a following CERTIFY is refused, so a revoked proctor can never be
          re-certified through this endpoint.
        test_recipe:
          setup:
            - "A FULL_AUTHORIZED center with one proctor revoked straight from PENDING."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Revoke Terminal Center", state_code: "AZ" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Suri Bhatt", daily_hour_cap: 8.00 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p: $.data.id }
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "REVOKE" }
              as: StateAuthority
          trigger:
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "CERTIFY", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
              captures: { e1: $.data.error_id }
            - call: "GET /proctors/${p}"
              payload: {}
              as: StateAuthority
          assert:
            - "the REVOKE call returned 200 with data.certification_status == 'REVOKED' and data.assigned_session_count == 0"
            - "the following CERTIFY returns 409 with data.error_id == 'ERR_PROCTOR_DECISION_NOT_ALLOWED'"
            - "GET /proctors/${p} returns 200 with data.certification_status == 'REVOKED' and data.certification_expires_at == null"

      - name: proctor_lapse_then_renew_restores_certified
        claim_type: valid_transition
        grounds:
          - state_machines.Proctor.transitions.CERTIFIED_to_LAPSED
          - state_machines.Proctor.transitions.LAPSED_to_CERTIFIED
          - errors[ERR_PROCTOR_CERTIFICATION_LAPSED]
          - validations[priority=50]
        distinguishing_aspect: |
          The CERTIFIED -> LAPSED edge is evaluated lazily by the assignment attempt itself: the
          request is refused with ERR_PROCTOR_CERTIFICATION_LAPSED *and* the proctor row is already
          LAPSED afterwards; RENEW then closes the cycle back to CERTIFIED and the same assignment
          succeeds.
        test_recipe:
          setup:
            - "FULL_AUTHORIZED center, one ACTIVE room, one proctor CERTIFIED until 2026-08-10T00:00:00Z."
            - "One DRAFT session 2026-08-20T09:00:00Z..12:00:00Z created while the clock was 2026-08-01T00:00:00Z."
            - "Clock then advanced to 2026-08-11T00:00:00Z, past the certification expiry."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Lapse Cycle Center", state_code: "CO" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R-401", seat_capacity: 12, turnaround_buffer_minutes: 45 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Tove Lind", daily_hour_cap: 8.00 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p: $.data.id }
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "CERTIFY", certification_expires_at: "2026-08-10T00:00:00Z" }
              as: StateAuthority
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "MATH", starts_at: "2026-08-20T09:00:00Z", ends_at: "2026-08-20T12:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: StateAuthority
          trigger:
            - call: "POST /exam-sessions/${sess}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { e1: $.data.error_id }
            - call: "GET /proctors/${p}"
              payload: {}
              as: StateAuthority
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "RENEW", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
            - call: "POST /exam-sessions/${sess}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
          assert:
            - "the first proctor-assignment returns 409 with data.error_id == 'ERR_PROCTOR_CERTIFICATION_LAPSED'"
            - "GET /proctors/${p} then returns 200 with data.certification_status == 'LAPSED' (the lazy edge fired before the rejection) and data.certification_expires_at == '2026-08-10T00:00:00Z'"
            - "the RENEW call returns 200 with data.certification_status == 'CERTIFIED' and data.certification_expires_at == '2027-01-01T00:00:00Z'"
            - "the second proctor-assignment returns 200 with data.status == 'SCHEDULED' and data.proctor_id == ${p}"
            - "GET /proctors/${p} afterwards reports data.assigned_session_count == 1"

      - name: class_section_planned_to_in_session_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ClassSection.transitions.PLANNED_to_OPEN
          - validations[priority=30]
          - errors[ERR_SECTION_TRANSITION_NOT_ALLOWED]
        distinguishing_aspect: |
          IN_SESSION is reachable only from OPEN, so PLANNED -> IN_SESSION is refused; the section
          stays PLANNED (and therefore still rejects enrollment at priority 41).
        test_recipe:
          setup:
            - "One PLANNED HSE_PREP section with 10 seats."
          setup_api_calls:
            - call: "POST /class-sections"
              payload: { program_track: "HSE_PREP", title: "Skip A Step", instructor_user_id: "instructor-5", min_efl_level: 1, max_efl_level: 6, seats_total: 10, weekly_hours: 6.00 }
              as: ProgramCoordinator
              captures: { sec: $.data.id }
          trigger:
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "IN_SESSION" }
              as: ProgramCoordinator
              captures: { e1: $.data.error_id }
            - call: "GET /class-sections/${sec}"
              payload: {}
              as: ProgramCoordinator
          assert:
            - "the status-transition to IN_SESSION returns 409 with data.error_id == 'ERR_SECTION_TRANSITION_NOT_ALLOWED'"
            - "GET /class-sections/${sec} returns 200 with data.status == 'PLANNED'"

      - name: class_section_transition_after_closed_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ClassSection.terminal_states
          - errors[ERR_SECTION_TRANSITION_NOT_ALLOWED]
        distinguishing_aspect: |
          CLOSED is terminal: neither OPEN nor IN_SESSION nor a repeated CLOSED is accepted
          afterwards, so a closed section can never resume intake.
        test_recipe:
          setup:
            - "A section taken PLANNED -> OPEN -> CLOSED with no enrollments (the cascade is a no-op)."
          setup_api_calls:
            - call: "POST /class-sections"
              payload: { program_track: "LITERACY", title: "Closed For Good", instructor_user_id: "instructor-6", min_efl_level: 1, max_efl_level: 3, seats_total: 8, weekly_hours: 4.00 }
              as: ProgramCoordinator
              captures: { sec: $.data.id }
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "CLOSED" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "CLOSED" }
              as: ProgramCoordinator
              captures: { e2: $.data.error_id }
          assert:
            - "the reopen attempt returns 409 with data.error_id == 'ERR_SECTION_TRANSITION_NOT_ALLOWED'"
            - "the repeated CLOSED attempt returns 409 with data.error_id == 'ERR_SECTION_TRANSITION_NOT_ALLOWED'"
            - "GET /class-sections/${sec} reports data.status == 'CLOSED', data.seats_taken == 0, data.seats_available == 8"

