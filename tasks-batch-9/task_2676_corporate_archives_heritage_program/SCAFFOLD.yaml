    roles: [ArchivesDirector, Archivist, AccessServicesOfficer]
    code: 200
    input: ["accession_id?", "consent_status?", "transcription_status?", "release_state?", "limit?", "offset?"]
    output: OralHistoryInterview[]
    side_effects: []

  - method: GET
    path: "/oral-history-interviews/{id}"
    description: "Fetch one interview with both state axes and the derived release_state."
    roles: [ArchivesDirector, Archivist, AccessServicesOfficer]
    code: 200
    input: []
    output: OralHistoryInterview
    side_effects: []

  - method: POST
    path: "/oral-history-interviews/{id}/consent"
