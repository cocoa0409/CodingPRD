            - "the REVISE adjudication is 400 rather than 409 even though the report is already in the terminal ACCEPTED state"
            - "the MITIGATION_CREDIT commitment is 400 rather than 409/412 — the enum defect is reported before the state rung and before the version rung, and the version supplied is in fact current"
            - "the string-typed take_units_reported is 400 rather than a stale-version 412, because the permit version moved when the accepted report was filed but the schema rung fires first"
            - "no row changes state: the plan is still IMPLEMENTING, the report is still ACCEPTED, and GET /habitat-conservation-plans/${hcp_id}/changed-circumstance-events is still empty"

      - name: declared_status_codes_separate_creations_from_transitions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /project-actions]
          - endpoints[POST /project-actions/{id}/effect-determination]
