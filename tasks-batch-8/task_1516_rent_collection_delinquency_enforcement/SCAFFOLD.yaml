scenario: |
  Rent Collection & Delinquency Enforcement (property management company): payment channel & posting priority (fees vs rent), grace period & late fee calculation by lease and local caps, partial payment acceptance rules & waiver of default risk, notice to pay or quit generation & service documentation, payment plan agreement & default, returned payment & NSF handling, collections referral after move-out, ledger accuracy & dispute resolution

domain_name: rent-collection-delinquency
api_prefix: /api

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; all money integer cents;
#     all calendar dates are strings "YYYY-MM-DD"; datetimes ISO8601 UTC)
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Property display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter jurisdiction code driving statutory caps" }
      - { name: posting_priority_policy, type: enum, source: input, description: "Waterfall class order: FEES_FIRST pays LATE_FEE/NSF_FEE/PLAN_SETUP_FEE/DAMAGE_FEE before RENT; RENT_FIRST pays RENT first", constraints: "FEES_FIRST | RENT_FIRST" }
      - { name: late_fee_cap_cents, type: integer, source: input, description: "Statutory per-period late fee ceiling; assessed fee = min(raw, cap), fee == cap is allowed" }
      - { name: nsf_fee_cap_cents, type: integer, source: input, description: "Statutory ceiling on a single returned-payment fee" }
      - { name: monthly_waiver_cap_cents, type: integer, source: input, description: "Max sum of waived cents per property per calendar month; reaching exactly the cap is allowed, exceeding it is not" }
      - { name: min_partial_payment_percent, type: integer, source: input, description: "Minimum acceptable partial payment as integer percent 1..100 of total outstanding; min_partial_cents = ceil(total_outstanding_cents * pct / 100); a payment equal to total outstanding is always accepted" }
      - { name: collections_threshold_cents, type: integer, source: input, description: "Minimum chronological move-out balance that may be referred; balance == threshold may be referred (>=)" }
      - { name: notice_cure_period_days, type: integer, source: input, description: "Pay-or-quit cure window; cure_deadline_date = issued_date + this many days" }
      - { name: plan_cooling_off_days, type: integer, source: input, description: "Days after a plan DEFAULTED during which a new plan on that lease is rejected; blocked while (today - defaulted_date).days < plan_cooling_off_days" }
      - { name: plan_setup_fee_cents, type: integer, source: input, description: "Flat plan origination fee charged when pre-fee covered balance >= plan_setup_fee_threshold_cents" }
      - { name: plan_setup_fee_threshold_cents, type: integer, source: input, description: "Pre-fee covered-balance threshold for the setup fee; balance == threshold charges the fee (>=)" }

  - name: Tenant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Tenant legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per tenant" }
      - { name: phone, type: string, source: input, description: "Contact phone", default: "" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; owning property whose policy constants govern this lease" }
      - { name: primary_tenant_id, type: string, source: input, description: "FK -> Tenant.id; tenant responsible for the ledger; Tenant-role callers must match this id" }
      - { name: unit_label, type: string, source: input, description: "Unit identifier; (property_id, unit_label) is the occupancy resource for term-overlap checks" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Full-period rent used by proration and PERCENT_PLUS_DAILY fee math" }
      - { name: due_day, type: integer, source: input, description: "Day of month rent is due", constraints: "1..28" }
      - { name: grace_period_days, type: integer, source: input, description: "Days after due_date before a late fee accrues; days_late = max(0, (today - due_date).days - grace_period_days)" }
      - { name: late_fee_type, type: enum, source: input, description: "Fee formula selector", constraints: "FLAT | PERCENT_PLUS_DAILY" }
      - { name: late_fee_flat_cents, type: integer, source: input, description: "Flat fee once days_late >= 1 (FLAT type)", default: 0 }
      - { name: late_fee_percent_bps, type: integer, source: input, description: "Basis points of the rent charge amount, applied once days_late >= 1 (PERCENT_PLUS_DAILY)", default: 0 }
      - { name: late_fee_daily_cents, type: integer, source: input, description: "Additional cents per day late (PERCENT_PLUS_DAILY)", default: 0 }
      - { name: term_start_date, type: string, source: input, description: "Lease term start, YYYY-MM-DD; half-open interval [start, end)" }
      - { name: term_end_date, type: string, source: input, description: "Lease term end (exclusive), YYYY-MM-DD" }
      - { name: status, type: enum, source: system, description: "Lease lifecycle", default: DRAFT, constraints: "DRAFT | ACTIVE | ENDED" }
      - { name: move_out_date, type: string, source: input, description: "Set by MOVE_OUT transition; YYYY-MM-DD, must be >= term_start_date and <= today", default: null }

  - name: LedgerCharge
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; ledger owner" }
      - { name: kind, type: enum, source: input, description: "Charge class driving waterfall priority; manual creation restricted to RENT and DAMAGE_FEE; LATE_FEE created by sweep, NSF_FEE by payment return, PLAN_SETUP_FEE by plan creation", constraints: "RENT | LATE_FEE | NSF_FEE | PLAN_SETUP_FEE | DAMAGE_FEE" }
      - { name: source, type: enum, source: system, description: "Producing pathway", default: MANUAL, constraints: "MANUAL | SWEEP | PLAN | RETURN" }
      - { name: period_start_date, type: string, source: input, description: "Coverage period start, YYYY-MM-DD; for non-RENT system charges equals the originating charge's period start" }
      - { name: period_end_date, type: string, source: input, description: "Coverage period end (inclusive), YYYY-MM-DD; must be >= period_start_date" }
      - { name: due_date, type: string, source: input, description: "Payment due date, YYYY-MM-DD; drives grace/late-fee math and waterfall ordering" }
      - { name: amount_cents, type: integer, source: input, description: "Face amount; reduced in place only by a RESOLVED_ADJUSTED dispute" }
      - { name: waived_cents, type: integer, source: system, description: "Cumulative waived cents", default: 0 }
      - { name: outstanding_cents, type: integer, source: computed, description: "amount_cents - waived_cents - net applied cents (sum APPLY minus REVERSE allocations); recomputed on every allocation, waiver, reversal, adjustment" }
      - { name: status, type: enum, source: system, description: "OPEN | PARTIALLY_PAID | PAID | WAIVED | VOID; PAID/WAIVED when outstanding reaches 0 (WAIVED only via waive action), VOID when a dispute adjusts amount to 0", default: OPEN, constraints: "OPEN | PARTIALLY_PAID | PAID | WAIVED | VOID" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator, or the literal 'system' for SWEEP/RETURN/PLAN charges; segregation-of-duties anchor for waivers" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease whose ledger receives the payment" }
      - { name: tenant_id, type: string, source: input, description: "FK -> Tenant.id; payer; Tenant-role callers must supply their own id and it must equal the lease's primary_tenant_id" }
      - { name: channel, type: enum, source: input, description: "Tender channel; only ACH and CHECK payments are returnable (NSF)", constraints: "ACH | CARD | CHECK | MONEY_ORDER | CASH" }
      - { name: amount_cents, type: integer, source: input, description: "Tendered amount; fiscal acceptance rules evaluated at POST transition time against current outstanding" }
      - { name: received_date, type: string, source: input, description: "Date funds were received, YYYY-MM-DD; must be <= today", default: "today (server clock)" }
      - { name: status, type: enum, source: system, description: "PENDING on creation; POSTED after the waterfall runs; RETURNED after NSF; RETURNED may be re-posted (re-presentment cycle POSTED -> RETURNED -> POSTED)", default: PENDING, constraints: "PENDING | POSTED | RETURNED" }
      - { name: posted_date, type: string, source: system, description: "Date the most recent POST transition ran", default: null }
      - { name: return_reason_code, type: string, source: input, description: "Bank return reason, recorded on RETURN", default: null }
      - { name: nsf_fee_cents, type: integer, source: input, description: "Requested NSF fee at RETURN; charged fee is min(nsf_fee_cents, property.nsf_fee_cap_cents)", default: null }
      - { name: return_count, type: integer, source: system, description: "Number of RETURN transitions this payment has undergone", default: 0 }

  - name: PaymentAllocation
    parent: null
    common_fields: false
    fields:
      - { name: payment_id, type: string, source: system, description: "FK -> Payment.id; payment this allocation belongs to" }
      - { name: charge_id, type: string, source: system, description: "FK -> LedgerCharge.id; charge receiving (or returning) funds" }
      - { name: direction, type: enum, source: system, description: "APPLY moves payment money onto a charge; REVERSE undoes a prior APPLY on NSF return; both store positive amounts", constraints: "APPLY | REVERSE" }
      - { name: amount_cents, type: integer, source: system, description: "Positive cents allocated; signed semantics come from direction" }
      - { name: allocation_order, type: integer, source: system, description: "1-based waterfall execution order within a single posting run" }
      - { name: note, type: string, source: system, description: "Free-text audit note (e.g. 'nsf-reversal')", default: "" }

  - name: DelinquencyNotice
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease the pay-or-quit notice is issued against" }
      - { name: charge_ids, type: array, source: input, description: "Ordered list of LedgerCharge ids covered by the notice; all must belong to lease_id" }
      - { name: period_start_date, type: string, source: computed, description: "min(period_start_date) over covered charges; closed-day coverage window start" }
      - { name: period_end_date, type: string, source: computed, description: "max(period_end_date) over covered charges; closed-day coverage window end" }
      - { name: amount_demanded_cents, type: integer, source: computed, description: "Sum of covered outstanding + provisional late fee per covered RENT charge with no assessed LATE_FEE yet; recomputed live while DRAFT, frozen at ISSUE" }
      - { name: status, type: enum, source: system, description: "Notice lifecycle", default: DRAFT, constraints: "DRAFT | ISSUED | SERVED | CURED | EXPIRED | CANCELLED" }
      - { name: issued_date, type: string, source: system, description: "Date of ISSUE transition", default: null }
      - { name: cure_deadline_date, type: string, source: computed, description: "issued_date + property.notice_cure_period_days", default: null }
      - { name: service_method, type: enum, source: input, description: "Statutory service method recorded at SERVE", default: null, constraints: "PERSONAL | POSTED_AND_MAILED | CERTIFIED_MAIL" }
      - { name: served_date, type: string, source: input, description: "Date of service; must satisfy issued_date <= served_date <= cure_deadline_date", default: null }
      - { name: served_by_user_id, type: string, source: system, description: "X-User-ID that recorded service", default: null }
      - { name: cancel_reason, type: enum, source: system, description: "Why the notice was cancelled", default: null, constraints: "SUPERSEDED | MOVE_OUT" }

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; lease whose covered charges are rescheduled" }
      - { name: charge_ids, type: array, source: input, description: "Covered LedgerCharge ids; snapshot at creation; all must belong to lease_id" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of creator; approver must differ (segregation of duties)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving PropertyManager", default: null }
      - { name: status, type: enum, source: system, description: "Plan lifecycle", default: DRAFT, constraints: "DRAFT | ACTIVE | CURED | DEFAULTED | CANCELLED" }
      - { name: setup_fee_cents, type: integer, source: computed, description: "plan_setup_fee_cents if pre-fee covered balance >= plan_setup_fee_threshold_cents else 0; evaluated strictly before the fee charge exists (pinned evaluation order)" }
      - { name: scheduled_total_cents, type: integer, source: computed, description: "Sum of covered outstanding at creation + setup_fee_cents; invariant: equals sum of installments[].amount_cents" }
      - { name: installment_count, type: integer, source: input, description: "Number of installments", constraints: "2..12" }
      - { name: first_installment_date, type: string, source: input, description: "YYYY-MM-DD; must be strictly after today; subsequent installments monthly" }
      - { name: installments, type: array, source: computed, description: "Embedded schedule of {sequence_number, due_date, amount_cents, status}; status in PENDING | PAID | MISSED; split = floor(total/count) with remainder cents +1 to the earliest sequence numbers" }
      - { name: missed_installment_count, type: integer, source: computed, description: "Count of installments with status MISSED; >= 2 at sweep flips plan to DEFAULTED" }
      - { name: defaulted_date, type: string, source: system, description: "Date plan entered DEFAULTED; anchor for the cooling-off rule", default: null }
      - { name: cancel_reason, type: enum, source: system, description: "Why the plan was cancelled", default: null, constraints: "SUPERSEDED | MOVE_OUT" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; ledger under dispute" }
      - { name: charge_id, type: string, source: input, description: "FK -> LedgerCharge.id; disputed charge (must belong to lease_id)" }
      - { name: tenant_id, type: string, source: input, description: "FK -> Tenant.id; filer; must equal X-User-ID and the lease's primary_tenant_id" }
      - { name: reason, type: string, source: input, description: "Free-text dispute reason" }
      - { name: status, type: enum, source: system, description: "OPEN -> RESOLVED_UPHELD -> REOPENED -> RESOLVED_* cycle; reopen allowed once", default: OPEN, constraints: "OPEN | RESOLVED_UPHELD | RESOLVED_ADJUSTED | REOPENED" }
      - { name: reopen_count, type: integer, source: system, description: "Number of REOPEN transitions; hard cap 1", default: 0 }
      - { name: adjusted_amount_cents, type: integer, source: input, description: "Required when resolving with outcome ADJUSTED; 0 <= value < charge.amount_cents; 0 voids the charge", default: null }
      - { name: resolution_notes, type: string, source: input, description: "Resolution rationale", default: "" }

  - name: CollectionsReferral
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; created by the move-out cascade when the chronological balance is > 0" }
      - { name: referred_balance_cents, type: integer, source: computed, description: "Chronological-variant move-out balance; recomputed whenever a charge on the lease changes while status is PENDING" }
      - { name: status, type: enum, source: system, description: "PENDING -> REFERRED -> SETTLED | RECALLED; RECALLED -> REFERRED allowed (re-referral cycle); PENDING -> RECALLED when balance drops below threshold", default: PENDING, constraints: "PENDING | REFERRED | SETTLED | RECALLED" }
      - { name: agency_name, type: string, source: input, description: "Collections agency, recorded at REFER", default: null }
      - { name: referred_date, type: string, source: system, description: "Date of most recent REFER", default: null }
      - { name: recall_reason, type: string, source: input, description: "Why the referral was recalled; system sets BALANCE_RESOLVED on auto-recall", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Lease
    initial_state: DRAFT
    terminal_states: [ENDED]
    note: "Misused transitions map to domain errors: MOVE_OUT from ENDED -> ERR_LEASE_ALREADY_ENDED; MOVE_OUT from DRAFT -> ERR_LEASE_NOT_ACTIVE; ACTIVATE from non-DRAFT -> ERR_INVALID_REQUEST. ENDED is a hard terminal state."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/leases/{id}/transition {action: ACTIVATE}"
        actor: PropertyManager
        preconditions:
          - "term_end_date > today (lease not already expired)"
          - "no other Lease with same (property_id, unit_label) in status ACTIVE whose half-open term [term_start_date, term_end_date) intersects this lease's term; adjacency (end == start) is allowed"
        side_effects:
          - "increments Lease.version by 1"
        note: "Term overlap uses half-open semantics: [start, end); touching terms do not conflict."
      - from: ACTIVE
        to: ENDED
        trigger: "POST /api/leases/{id}/transition {action: MOVE_OUT, move_out_date}"
        actor: PropertyManager
        preconditions:
          - "move_out_date >= term_start_date and move_out_date <= today"
        side_effects:
          - "Cascade B link 1: Lease.status := ENDED, Lease.move_out_date := move_out_date"
          - "Cascade B link 2 (caused by lease ending): every DelinquencyNotice of this lease in status DRAFT transitions to CANCELLED with cancel_reason MOVE_OUT"
          - "Cascade B link 2 (caused by lease ending): every PaymentPlan of this lease in status DRAFT or ACTIVE transitions to CANCELLED with cancel_reason MOVE_OUT"
          - "Cascade B link 3 (caused by lease ending): compute move_out_reconciliation chronological variant; if balance > 0, create CollectionsReferral(status PENDING, referred_balance_cents = chronological balance); if balance == 0, no referral is created"
          - "increments Lease.version by 1"
        note: "Existing charges are NOT voided or prorated at move-out; proration lives inside the chronological calculation variant only."

  - entity: LedgerCharge
    initial_state: OPEN
    terminal_states: [PAID, WAIVED, VOID]
    transitions:
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: "system: payment POST waterfall allocates less than outstanding"
        actor: system
        preconditions: ["an APPLY allocation lands on this charge with amount < outstanding_cents"]
        side_effects: ["outstanding_cents recomputed", "increments LedgerCharge.version by 1"]
      - from: OPEN
        to: PAID
        trigger: "system: payment POST waterfall allocates exactly outstanding"
        actor: system
        preconditions: ["net applied cents == amount_cents - waived_cents"]
        side_effects: ["outstanding_cents := 0", "increments LedgerCharge.version by 1"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system: payment POST waterfall completes the charge"
        actor: system
        preconditions: ["net applied cents == amount_cents - waived_cents"]
        side_effects: ["outstanding_cents := 0", "increments LedgerCharge.version by 1"]
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "system: NSF RETURN reversal restores part of the balance"
        actor: system
        preconditions: ["a REVERSE allocation lands and 0 < restored outstanding < amount_cents - waived_cents"]
        side_effects: ["outstanding_cents recomputed", "increments LedgerCharge.version by 1"]
      - from: PAID
        to: OPEN
        trigger: "system: NSF RETURN reversal restores the full balance"
        actor: system
        preconditions: ["REVERSE allocations cancel all APPLY allocations"]
        side_effects: ["outstanding_cents := amount_cents - waived_cents", "increments LedgerCharge.version by 1"]
      - from: PARTIALLY_PAID
        to: OPEN
        trigger: "system: NSF RETURN reversal cancels all remaining applications"
        actor: system
        preconditions: ["net applied cents == 0 after reversal"]
        side_effects: ["outstanding_cents := amount_cents - waived_cents", "increments LedgerCharge.version by 1"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /api/charges/{id}/waive with amount_cents == outstanding_cents"
        actor: PropertyManager
        preconditions: ["caller X-User-ID != created_by_user_id", "cumulative month waivers on the property + amount <= property.monthly_waiver_cap_cents"]
        side_effects: ["waived_cents += amount_cents", "outstanding_cents := 0", "any DRAFT DelinquencyNotice covering this charge recomputes amount_demanded_cents", "any PENDING CollectionsReferral on the lease recomputes referred_balance_cents", "increments LedgerCharge.version by 1"]
      - from: PARTIALLY_PAID
        to: WAIVED
        trigger: "POST /api/charges/{id}/waive with amount_cents == outstanding_cents"
        actor: PropertyManager
        preconditions: ["caller X-User-ID != created_by_user_id", "cumulative month waivers on the property + amount <= property.monthly_waiver_cap_cents"]
        side_effects: ["waived_cents += amount_cents", "outstanding_cents := 0", "any DRAFT DelinquencyNotice covering this charge recomputes amount_demanded_cents", "any PENDING CollectionsReferral on the lease recomputes referred_balance_cents", "increments LedgerCharge.version by 1"]
      - from: OPEN
        to: VOID
        trigger: "system: dispute RESOLVED_ADJUSTED with adjusted_amount_cents == 0"
        actor: system
        preconditions: ["dispute resolution sets amount to 0"]
        side_effects: ["amount_cents := 0", "outstanding_cents := 0", "increments LedgerCharge.version by 1"]
      - from: PARTIALLY_PAID
        to: VOID
        trigger: "system: dispute RESOLVED_ADJUSTED with adjusted_amount_cents == 0"
        actor: system
        preconditions: ["dispute resolution sets amount to 0; existing APPLY allocations remain as historical record"]
        side_effects: ["amount_cents := 0", "outstanding_cents := 0", "increments LedgerCharge.version by 1"]
    note: "Partial waivers and partial dispute adjustments keep the current status and only reduce outstanding_cents. A waive with amount_cents < outstanding_cents is a partial waiver: status unchanged."

  - entity: Payment
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /api/payments/{id}/transition {action: POST}"
        actor: LeasingAgent | PropertyManager
        preconditions:
          - "lease status == ACTIVE"
          - "amount_cents <= total outstanding over the lease's OPEN/PARTIALLY_PAID charges (else ERR_OVERPAYMENT_REJECTED)"
          - "amount_cents == total outstanding OR amount_cents >= ceil(total outstanding * property.min_partial_payment_percent / 100) (else ERR_PARTIAL_BELOW_MINIMUM)"
        side_effects:
          - "runs payment_waterfall_allocation with the property's posting_priority_policy; creates APPLY PaymentAllocation rows in waterfall order"
          - "each affected LedgerCharge recomputes outstanding_cents and status"
          - "posted_date := today"
          - "increments Payment.version by 1"
      - from: POSTED
        to: RETURNED
        trigger: "POST /api/payments/{id}/transition {action: RETURN, reason_code, nsf_fee_cents}"
        actor: LeasingAgent | PropertyManager
        preconditions:
          - "channel in {ACH, CHECK} (else ERR_CHANNEL_NOT_RETURNABLE)"
          - "lease status in {ACTIVE, ENDED} (NSF can arrive after move-out)"
        side_effects:
          - "Cascade A link 1: Payment.status := RETURNED, return_count += 1"
          - "Cascade A link 2 (caused by the return): for every APPLY allocation of this payment, create a REVERSE allocation of equal amount with note 'nsf-reversal'"
          - "Cascade A link 3 (caused by the reversals): each affected LedgerCharge recomputes outstanding_cents and flips status PAID/PARTIALLY_PAID back toward OPEN"
          - "Cascade A link 4 (caused by charge recompute): every DRAFT DelinquencyNotice covering an affected charge recomputes amount_demanded_cents"
          - "Cascade A link 4 (caused by the return): create NSF_FEE LedgerCharge on the lease with amount min(nsf_fee_cents, property.nsf_fee_cap_cents), due today, source RETURN, period equal to today"
          - "any PENDING CollectionsReferral on the lease recomputes referred_balance_cents; if the lease is ENDED and no CollectionsReferral exists for it and the chronological move-out balance after the reversal is > 0, create a PENDING CollectionsReferral carrying that balance"
          - "increments Payment.version by 1"
      - from: RETURNED
        to: POSTED
        trigger: "POST /api/payments/{id}/transition {action: POST} (re-presentment)"
        actor: LeasingAgent | PropertyManager
        preconditions:
          - "lease status == ACTIVE"
          - "amount_cents <= current total outstanding (else ERR_OVERPAYMENT_REJECTED)"
          - "amount_cents == total outstanding OR >= ceil(total outstanding * min_partial_payment_percent / 100) (else ERR_PARTIAL_BELOW_MINIMUM)"
        side_effects:
          - "re-runs payment_waterfall_allocation against CURRENT open charges (the NSF fee charge is itself a fee-class target) and creates a new APPLY allocation set"
          - "each affected LedgerCharge recomputes outstanding_cents and status"
          - "posted_date := today"
          - "increments Payment.version by 1"
        note: "Cycle POSTED -> RETURNED -> POSTED. Re-presentment allocates against the live ledger, not the original set."

  - entity: DelinquencyNotice
    initial_state: DRAFT
    terminal_states: [CURED, EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/notices/{id}/transition {action: ISSUE}"
        actor: PropertyManager
        preconditions:
          - "lease status == ACTIVE"
          - "closed-day coverage window [period_start_date, period_end_date] shares no calendar day with any other notice of the same lease in status ISSUED or SERVED (else ERR_NOTICE_PERIOD_OVERLAP)"
        side_effects:
          - "amount_demanded_cents frozen per notice_demand_amount (provisional variant)"
          - "issued_date := today; cure_deadline_date := today + property.notice_cure_period_days"
          - "increments DelinquencyNotice.version by 1"
      - from: ISSUED
        to: SERVED
        trigger: "POST /api/notices/{id}/transition {action: SERVE, service_method, served_date}"
        actor: PropertyManager
        preconditions:
          - "issued_date <= served_date <= cure_deadline_date (else ERR_NOTICE_SERVICE_WINDOW)"
        side_effects:
          - "served_by_user_id := X-User-ID"
          - "increments DelinquencyNotice.version by 1"
      - from: ISSUED
        to: CURED
        trigger: "system: delinquency sweep"
        actor: system
        preconditions: ["all covered charges have outstanding_cents == 0 and today <= cure_deadline_date"]
        side_effects: ["increments DelinquencyNotice.version by 1"]
      - from: SERVED
        to: CURED
        trigger: "system: delinquency sweep"
        actor: system
        preconditions: ["all covered charges have outstanding_cents == 0 and today <= cure_deadline_date"]
        side_effects: ["increments DelinquencyNotice.version by 1"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system: delinquency sweep"
        actor: system
        preconditions: ["today > cure_deadline_date and some covered charge has outstanding_cents > 0"]
        side_effects: ["increments DelinquencyNotice.version by 1"]
      - from: SERVED
        to: EXPIRED
        trigger: "system: delinquency sweep"
        actor: system
        preconditions: ["today > cure_deadline_date and some covered charge has outstanding_cents > 0"]
        side_effects: ["increments DelinquencyNotice.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "system: superseded by a newer notice creation on the same lease, or lease move-out cascade"
        actor: system
        preconditions: ["a new DelinquencyNotice is created on the same lease, or the lease transitions to ENDED"]
        side_effects: ["cancel_reason := SUPERSEDED or MOVE_OUT", "increments DelinquencyNotice.version by 1"]
    note: "Only one DRAFT notice per lease at a time: creating a notice cancels any existing DRAFT (cancel_reason SUPERSEDED) and bumps Lease.version, which is the OCC-observable mutation."

  - entity: PaymentPlan
    initial_state: DRAFT
    terminal_states: [CURED, DEFAULTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/payment-plans/{id}/transition {action: APPROVE}"
        actor: PropertyManager
        preconditions:
          - "caller X-User-ID != drafted_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
          - "no DelinquencyNotice of the same lease in status SERVED (else ERR_ACTIVE_NOTICE_BLOCKS_PLAN)"
        side_effects:
          - "approved_by_user_id := X-User-ID"
          - "increments PaymentPlan.version by 1"
      - from: ACTIVE
        to: CURED
        trigger: "system: delinquency sweep"
        actor: system
        preconditions: ["every installment has status PAID"]
        side_effects: ["increments PaymentPlan.version by 1"]
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system: delinquency sweep"
        actor: system
        preconditions: ["missed_installment_count >= 2"]
        side_effects:
          - "defaulted_date := today (anchors plan cooling-off)"
          - "increments PaymentPlan.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "system: superseded by a newer plan creation on the same lease, or lease move-out cascade"
        actor: system
        preconditions: ["a new PaymentPlan is created on the same lease, or the lease transitions to ENDED"]
        side_effects: ["cancel_reason := SUPERSEDED or MOVE_OUT", "increments PaymentPlan.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "system: lease move-out cascade"
        actor: system
        preconditions: ["the lease transitions to ENDED"]
        side_effects: ["cancel_reason := MOVE_OUT", "increments PaymentPlan.version by 1"]

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_ADJUSTED]
    transitions:
      - from: OPEN
        to: RESOLVED_UPHELD
        trigger: "POST /api/disputes/{id}/transition {action: RESOLVE, outcome: UPHELD}"
        actor: PropertyManager
        preconditions: []
        side_effects: ["increments Dispute.version by 1"]
      - from: OPEN
        to: RESOLVED_ADJUSTED
        trigger: "POST /api/disputes/{id}/transition {action: RESOLVE, outcome: ADJUSTED, adjusted_amount_cents}"
        actor: PropertyManager
        preconditions: ["0 <= adjusted_amount_cents < charge.amount_cents"]
        side_effects:
          - "Cascade C link 1: LedgerCharge.amount_cents := adjusted_amount_cents (0 sends the charge to VOID)"
          - "Cascade C link 2 (caused by the charge change): charge outstanding_cents recomputed"
          - "Cascade C link 3 (caused by the recompute): every DRAFT DelinquencyNotice covering the charge recomputes amount_demanded_cents, and any PENDING CollectionsReferral recomputes referred_balance_cents; if that balance falls below property.collections_threshold_cents the referral transitions PENDING -> RECALLED with recall_reason BALANCE_RESOLVED"
          - "increments Dispute.version by 1"
      - from: RESOLVED_UPHELD
        to: REOPENED
        trigger: "POST /api/disputes/{id}/transition {action: REOPEN}"
        actor: Tenant
        preconditions:
          - "caller X-User-ID == tenant_id (ownership)"
          - "reopen_count < 1 (else ERR_DISPUTE_REOPEN_EXHAUSTED)"
        side_effects: ["reopen_count += 1", "increments Dispute.version by 1"]
      - from: REOPENED
        to: RESOLVED_UPHELD
        trigger: "POST /api/disputes/{id}/transition {action: RESOLVE, outcome: UPHELD}"
        actor: PropertyManager
        preconditions: []
        side_effects: ["increments Dispute.version by 1"]
      - from: REOPENED
        to: RESOLVED_ADJUSTED
        trigger: "POST /api/disputes/{id}/transition {action: RESOLVE, outcome: ADJUSTED, adjusted_amount_cents}"
        actor: PropertyManager
        preconditions: ["0 <= adjusted_amount_cents < charge.amount_cents"]
        side_effects: ["same Cascade C chain as OPEN -> RESOLVED_ADJUSTED", "increments Dispute.version by 1"]
    note: "Cyclic machine: OPEN -> RESOLVED_UPHELD -> REOPENED -> RESOLVED_*; the loop terminates because reopen_count is capped at 1, after which RESOLVED_UPHELD is effectively terminal."

  - entity: CollectionsReferral
    initial_state: PENDING
    terminal_states: [SETTLED]
    transitions:
      - from: PENDING
        to: REFERRED
        trigger: "POST /api/collections-referrals/{id}/transition {action: REFER, agency_name}"
        actor: PropertyManager
        preconditions:
          - "no Dispute of the same lease in status OPEN or REOPENED (else ERR_BLOCKING_DISPUTE)"
          - "referred_balance_cents >= property.collections_threshold_cents (else ERR_REFERRAL_THRESHOLD_NOT_MET)"
        side_effects: ["referred_date := today", "agency_name := input", "increments CollectionsReferral.version by 1"]
      - from: REFERRED
        to: SETTLED
        trigger: "POST /api/collections-referrals/{id}/transition {action: SETTLE}"
        actor: PropertyManager
        preconditions: []
        side_effects: ["increments CollectionsReferral.version by 1"]
      - from: REFERRED
        to: RECALLED
        trigger: "POST /api/collections-referrals/{id}/transition {action: RECALL, recall_reason}"
        actor: PropertyManager
        preconditions: []
        side_effects: ["increments CollectionsReferral.version by 1"]
      - from: RECALLED
        to: REFERRED
        trigger: "POST /api/collections-referrals/{id}/transition {action: REFER, agency_name}"
        actor: PropertyManager
        preconditions:
          - "no Dispute of the same lease in status OPEN or REOPENED"
          - "referred_balance_cents >= property.collections_threshold_cents"
        side_effects: ["referred_date := today", "agency_name := input", "increments CollectionsReferral.version by 1"]
      - from: PENDING
        to: RECALLED
        trigger: "system: dispute-adjust cascade drops the balance below threshold"
        actor: system
        preconditions: ["recomputed referred_balance_cents < property.collections_threshold_cents"]
        side_effects: ["recall_reason := BALANCE_RESOLVED", "increments CollectionsReferral.version by 1"]
    note: "Cyclic machine: REFERRED -> RECALLED -> REFERRED (re-referral)."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: notice-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /api/notices"
    occ_field: expected_lease_version
    description: |
      Creating a DelinquencyNotice against a Lease whose version has advanced
      since the client last observed it is rejected. Creating a notice cancels
      any existing DRAFT notice on the lease (create-with-supersede), so a
      writer holding a stale lease version would silently supersede a draft it
      never saw; the stale-version check rejects it instead.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-create-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /api/payment-plans"
    occ_field: expected_lease_version
    description: |
      Creating a PaymentPlan against a Lease whose version has advanced since
      the client last observed it is rejected. Creating a plan supersedes any
      existing DRAFT plan on the lease, so a stale writer would cancel a draft
      it never observed; the stale-version check rejects it instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table (all money integer cents; round_half_up at 2dp
#     equivalent = exact integer cents; dates are calendar days)
# =============================================================================
calculations:
  - name: late_fee_assessment
    trigger: "delinquency sweep (POST /api/delinquency-runs) for the final variant; notice demand computation for the provisional variant"
    algorithm: threshold
    formula: |
      days_late = max(0, (as_of_date - charge.due_date).days - lease.grace_period_days)
      if days_late < 1: fee = 0
      elif lease.late_fee_type == FLAT: raw = lease.late_fee_flat_cents
      else: raw = round_half_up(charge.amount_cents * lease.late_fee_percent_bps / 10000) + lease.late_fee_daily_cents * days_late
      fee = min(raw, property.late_fee_cap_cents)   # fee == cap is allowed
      at most one non-VOID LATE_FEE charge per (lease, period) — sweep is idempotent per period
    input_set: "LedgerCharge rows with kind RENT, status in {OPEN, PARTIALLY_PAID}, on leases in status ACTIVE, whose (lease, period) has no existing non-VOID LATE_FEE charge"
    constants:
      DAYS_LATE_FLOOR: 1
    precision: "integer cents, round_half_up"
    variants:
      - name: final
        when: "delinquency sweep at run date"
        difference: "as_of_date = run date; if the fee is > 0 a LATE_FEE LedgerCharge is persisted (due today, source SWEEP, period equal to the rent charge's period)"
      - name: provisional
        when: "notice_demand_amount while a notice is DRAFT or at ISSUE"
        difference: "as_of_date = today + property.notice_cure_period_days (assumes the charge stays unpaid through the cure deadline); never persisted; skipped for a covered RENT charge that already has a non-VOID LATE_FEE"

  - name: payment_waterfall_allocation
    trigger: "Payment transition POST (both initial posting and re-presentment from RETURNED)"
    algorithm: waterfall_allocation
    formula: |
      candidates = LedgerCharge of the lease with status in {OPEN, PARTIALLY_PAID} and outstanding_cents > 0
      class_rank = 0 for kinds {LATE_FEE, NSF_FEE, PLAN_SETUP_FEE, DAMAGE_FEE}, 1 for {RENT}   # FEES_FIRST
      class_rank = 0 for {RENT}, 1 for {LATE_FEE, NSF_FEE, PLAN_SETUP_FEE, DAMAGE_FEE}          # RENT_FIRST
      order: class_rank ASC, then due_date ASC, then created_at ASC (tie-break; ids never used)
      walk in order: alloc_i = min(remaining, outstanding_i); create APPLY PaymentAllocation(allocation_order = i)
      stop when remaining == 0
    input_set: "open charges of the payment's lease at posting time; the payment's amount_cents"
    constants: {}
    precision: "integer cents, exact (sequential fill has no rounding)"
    variants:
      - name: fees_first
        when: "property.posting_priority_policy == FEES_FIRST"
        difference: "fee-class charges are paid to zero before any cent reaches RENT"
      - name: rent_first
        when: "property.posting_priority_policy == RENT_FIRST"
        difference: "RENT charges are paid first; identical payment and ledger produce a different per-charge allocation split"

  - name: plan_setup_fee_evaluation
    trigger: "POST /api/payment-plans"
    algorithm: constraint_propagation
    formula: |
      pinned evaluation order (removes the circularity):
        1. base_balance = sum(outstanding_cents over input charge_ids)           -- BEFORE any fee exists
        2. setup_fee_cents = property.plan_setup_fee_cents if base_balance >= property.plan_setup_fee_threshold_cents else 0
        3. if setup_fee_cents > 0: create PLAN_SETUP_FEE LedgerCharge (due first_installment_date, source PLAN)
        4. scheduled_total_cents = base_balance + setup_fee_cents
      Note the threshold is evaluated on the pre-fee balance: a balance of
      threshold - 1 with the fee notionally added would cross the threshold,
      but step 2 has already fixed the fee at 0.
    input_set: "the plan's charge_ids (all must belong to the lease and be in status OPEN or PARTIALLY_PAID)"
    constants: {}
    precision: "integer cents, exact"
    variants: []

  - name: installment_split
    trigger: "POST /api/payment-plans (after plan_setup_fee_evaluation)"
    algorithm: waterfall_allocation
    formula: |
      per = floor(scheduled_total_cents / installment_count)
      remainder = scheduled_total_cents - per * installment_count
      installments[1..remainder].amount_cents = per + 1      # remainder cents to the EARLIEST sequence numbers
      installments[remainder+1..count].amount_cents = per
      due_date[i] = first_installment_date + (i-1) months
      pinned rounding order: round per-installment FIRST (floor), then distribute the remainder;
      'sum exact shares then round' is the rejected alternative and yields a different first installment
    input_set: "scheduled_total_cents and installment_count of the new plan"
    constants:
      MIN_INSTALLMENTS: 2
      MAX_INSTALLMENTS: 12
    precision: "integer cents; floor per installment then remainder distribution"
    variants: []

  - name: waiver_monthly_cap
    trigger: "POST /api/charges/{id}/waive"
    algorithm: threshold
    formula: |
      month_total = sum of waived cents applied in the current calendar month (by server clock)
                    across all LedgerCharge rows of all leases of the charge's property
      reject if month_total + requested_waiver_cents > property.monthly_waiver_cap_cents
      (month_total + request == cap is allowed)
    input_set: "waive events of the property in the current calendar month"
    constants: {}
    precision: "integer cents, exact"
    variants: []

  - name: move_out_reconciliation
    trigger: "Lease MOVE_OUT transition; also exposed read-only by GET /api/leases/{id}/ledger"
    algorithm: aggregation
    formula: |
      forward_balance_cents  = sum(outstanding_cents) over charges with status in {OPEN, PARTIALLY_PAID}
      chronological_balance_cents = sum over charges with due_date <= move_out_date of:
          RENT charge straddling move_out (period_start_date <= move_out_date < period_end_date):
            occupied_days = (move_out_date - period_start_date).days
            days_in_period = (period_end_date - period_start_date).days + 1
            prorated = round_half_up(amount_cents * occupied_days / days_in_period)
            contribution = max(0, prorated - waived_cents - net_applied_cents)
          any other charge with due_date <= move_out_date: contribution = outstanding_cents
      charges with due_date > move_out_date contribute 0 to the chronological variant
      when the lease is not ENDED (move_out_date is null), the chronological variant uses
        today's date in place of move_out_date and never prorates
      CollectionsReferral.referred_balance_cents always uses the CHRONOLOGICAL variant
    input_set: "all LedgerCharge rows of the lease except VOID"
    constants: {}
    precision: "integer cents, round_half_up on proration"
    variants:
      - name: forward_looking
        when: "ledger read, field forward_balance_cents"
        difference: "face amounts, every open charge counts, including charges due after move-out (acceleration view)"
      - name: chronological
        when: "CollectionsReferral.referred_balance_cents and ledger read field chronological_balance_cents"
        difference: "excludes charges due after move_out_date and prorates the straddling RENT charge; identical ledger data yields a different balance"

  - name: notice_demand_amount
    trigger: "notice creation; any change to a covered charge's outstanding while the notice is DRAFT; frozen at ISSUE"
    algorithm: aggregation
    formula: |
      amount_demanded_cents =
          sum(outstanding_cents over charge_ids)
        + sum over covered RENT charges with outstanding_cents > 0 that have NO existing non-VOID LATE_FEE for the same period:
            late_fee_assessment(provisional variant, as_of = today + property.notice_cure_period_days)
      DRAFT: recomputed on every covered-charge change (allocation, reversal, waiver, dispute adjustment)
      ISSUED and beyond: frozen forever at the issued value
    input_set: "covered charge_ids of the notice"
    constants: {}
    precision: "integer cents, exact"
    variants: []

  - name: plan_installment_evaluation
    trigger: "delinquency sweep (POST /api/delinquency-runs)"
    algorithm: threshold
    formula: |
      for each ACTIVE plan, walking installments by sequence_number ASC:
        covered_paid = sum(net applied cents (APPLY - REVERSE) on the plan's charge_ids
                           from payments with posted_date >= plan activation date)
        installment i is PAID if covered_paid >= cumulative scheduled amount through i
        else MISSED if today > due_date[i]
        else PENDING
      missed_installment_count = count of MISSED; >= 2 flips the plan ACTIVE -> DEFAULTED
      all installments PAID flips ACTIVE -> CURED
    input_set: "ACTIVE PaymentPlan rows, their embedded installments, and net allocations on their charge_ids"
    constants:
      MISSED_TO_DEFAULT: 2
    precision: "integer cents, exact"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is permitted on this endpoint (endpoint.roles), including action-level role checks (RESOLVE is PropertyManager-only, REOPEN is Tenant-only) and ownership checks (Tenant must act on own lease/payments/disputes)", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path resources exist, validated left-to-right (lease, then charge/payment/notice/plan/dispute/referral)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: existence, check: "body FK references exist (property_id, primary_tenant_id, lease_id, tenant_id, every element of charge_ids)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "creation endpoints with FK body fields" }
  - { priority: 5, category: state, check: "OCC: expected_lease_version equals the lease's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /api/notices, POST /api/payment-plans" }
  - { priority: 6, category: state, check: "lease lifecycle gate: payments POST-transition, notices and plans require lease ACTIVE; operations on an ENDED lease that are never allowed fail here (charge creation, payment creation)", error_id: ERR_LEASE_NOT_ACTIVE, http_status: 409, applies_to: "POST /api/payments, POST /api/payments/{id}/transition, POST /api/notices, POST /api/payment-plans, POST /api/leases/{id}/charges" }
  - { priority: 7, category: state, check: "resource transition precondition per its state machine (payment PENDING/RETURNED for POST, POSTED for RETURN; notice DRAFT for ISSUE, ISSUED for SERVE; plan DRAFT for APPROVE; dispute OPEN/REOPENED for RESOLVE, RESOLVED_UPHELD for REOPEN with reopen_count < 1; referral per machine; waive target charge OPEN or PARTIALLY_PAID)", error_id: ERR_PAYMENT_INVALID_TRANSITION, http_status: 409, applies_to: "all /transition endpoints and POST /api/charges/{id}/waive — per-entity error ids: ERR_PAYMENT_INVALID_TRANSITION, ERR_NOTICE_INVALID_TRANSITION, ERR_PLAN_INVALID_TRANSITION, ERR_DISPUTE_INVALID_TRANSITION, ERR_DISPUTE_REOPEN_EXHAUSTED, ERR_REFERRAL_INVALID_TRANSITION, ERR_CHARGE_NOT_WAIVABLE" }
  - { priority: 8, category: business_safety, check: "segregation of duties: plan approver != drafted_by_user_id; waiver caller != charge.created_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /api/payment-plans/{id}/transition, POST /api/charges/{id}/waive" }
  - { priority: 9, category: business_referential, check: "every element of charge_ids belongs to the target lease; dispute.charge_id belongs to dispute.lease_id", error_id: ERR_CHARGE_NOT_ON_LEASE, http_status: 422, applies_to: "POST /api/notices, POST /api/payment-plans, POST /api/disputes" }
  - { priority: 10, category: business_temporal, check: "date coherence: term_start_date < term_end_date; period_end_date >= period_start_date; received_date <= today; move_out_date within [term_start_date, today]; served_date within [issued_date, cure_deadline_date]; first_installment_date strictly after today", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "endpoints accepting dates" }
  - { priority: 11, category: business_temporal, check: "notice service window: served_date must satisfy issued_date <= served_date <= cure_deadline_date", error_id: ERR_NOTICE_SERVICE_WINDOW, http_status: 422, applies_to: "POST /api/notices/{id}/transition {action: SERVE}" }
  - { priority: 12, category: business_temporal, check: "plan schedule: first_installment_date strictly after today (distinct code for schedule violations)", error_id: ERR_INVALID_INSTALLMENT_SCHEDULE, http_status: 422, applies_to: "POST /api/payment-plans" }
  - { priority: 13, category: business_constraint, check: "uniqueness/overlap: no overlapping ACTIVE lease on (property_id, unit_label) with half-open terms; no overlapping notice coverage window on {ISSUED, SERVED} notices; at most one ACTIVE plan per lease; plan cooling-off elapsed; manual charge kind in {RENT, DAMAGE_FEE}; returnable channel in {ACH, CHECK}", error_id: ERR_LEASE_TERM_OVERLAP, http_status: 409, applies_to: "various — per-rule error ids: ERR_LEASE_TERM_OVERLAP, ERR_NOTICE_PERIOD_OVERLAP, ERR_PLAN_EXISTS, ERR_PLAN_COOLING_OFF, ERR_CHANNEL_NOT_RETURNABLE, ERR_INVALID_REQUEST (kind)" }
  - { priority: 14, category: business_constraint, check: "cross-entity gates: no SERVED notice on lease when approving a plan; no OPEN/REOPENED dispute on lease when referring to collections", error_id: ERR_ACTIVE_NOTICE_BLOCKS_PLAN, http_status: 409, applies_to: "POST /api/payment-plans/{id}/transition, POST /api/collections-referrals/{id}/transition — per-rule error ids: ERR_ACTIVE_NOTICE_BLOCKS_PLAN, ERR_BLOCKING_DISPUTE" }
  - { priority: 15, category: business_fiscal, check: "payment acceptance: amount <= total outstanding (ERR_OVERPAYMENT_REJECTED); partial amount >= ceil(outstanding * min_partial_payment_percent / 100) unless amount == total outstanding (ERR_PARTIAL_BELOW_MINIMUM)", error_id: ERR_PARTIAL_BELOW_MINIMUM, http_status: 422, applies_to: "POST /api/payments/{id}/transition {action: POST}" }
  - { priority: 16, category: business_fiscal, check: "waiver fiscal: amount_cents <= charge.outstanding_cents (ERR_WAIVER_EXCEEDS_OUTSTANDING); month_total + amount <= property.monthly_waiver_cap_cents (ERR_WAIVER_CAP_EXCEEDED)", error_id: ERR_WAIVER_EXCEEDS_OUTSTANDING, http_status: 422, applies_to: "POST /api/charges/{id}/waive" }
  - { priority: 17, category: business_fiscal, check: "referral fiscal: referred_balance_cents >= property.collections_threshold_cents", error_id: ERR_REFERRAL_THRESHOLD_NOT_MET, http_status: 422, applies_to: "POST /api/collections-referrals/{id}/transition {action: REFER}" }
  - { priority: 18, category: business_constraint, check: "request shape: required fields present, enum values valid, ids well-formed, no undeclared fields, adjusted_amount_cents in [0, charge.amount_cents) when outcome ADJUSTED", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# 1.5 API Endpoint Table (logical clock default: 2026-08-01T00:00:00Z)
# =============================================================================
endpoints:
  - { method: POST, path: "/api/properties", description: "Create a property with its statutory caps and policy constants", roles: [PropertyManager], code: 201, input: ["name", "state_code", "posting_priority_policy", "late_fee_cap_cents", "nsf_fee_cap_cents", "monthly_waiver_cap_cents", "min_partial_payment_percent", "collections_threshold_cents", "notice_cure_period_days", "plan_cooling_off_days", "plan_setup_fee_cents", "plan_setup_fee_threshold_cents"], output: Property, side_effects: [] }
  - { method: POST, path: "/api/tenants", description: "Register a tenant", roles: [LeasingAgent, PropertyManager], code: 201, input: ["full_name", "email", "phone?"], output: Tenant, side_effects: [] }
  - { method: POST, path: "/api/leases", description: "Create a lease in DRAFT", roles: [LeasingAgent, PropertyManager], code: 201, input: ["property_id", "primary_tenant_id", "unit_label", "monthly_rent_cents", "due_day", "grace_period_days", "late_fee_type", "late_fee_flat_cents?", "late_fee_percent_bps?", "late_fee_daily_cents?", "term_start_date", "term_end_date"], output: Lease, side_effects: [] }
  - { method: GET, path: "/api/leases/{id}", description: "Read one lease", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: [], output: Lease, side_effects: [] }
  - { method: GET, path: "/api/leases", description: "List leases with filters", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: ["property_id?", "primary_tenant_id?", "status?", "limit?", "offset?"], output: "Lease[]", side_effects: [] }
  - { method: POST, path: "/api/leases/{id}/transition", description: "Lease lifecycle: ACTIVATE (DRAFT->ACTIVE, rejects on half-open term overlap on the same unit) or MOVE_OUT (ACTIVE->ENDED, runs Cascade B)", roles: [PropertyManager], code: 200, input: ["action", "move_out_date?"], output: Lease, side_effects: ["increments Lease.version by 1", "MOVE_OUT: cancels DRAFT notices and DRAFT/ACTIVE plans (reason MOVE_OUT), creates PENDING CollectionsReferral iff chronological balance > 0"] }
  - { method: GET, path: "/api/leases/{id}/ledger", description: "Computed reconciliation read: both balance variants plus ledger identity components", roles: [PropertyManager, LeasingAgent], code: 200, input: [], output: { forward_balance_cents: integer, chronological_balance_cents: integer, total_charged_cents: integer, total_waived_cents: integer, total_applied_net_cents: integer, total_outstanding_cents: integer, open_charge_count: integer }, side_effects: [] }
  - { method: POST, path: "/api/leases/{id}/charges", description: "Manually create a charge (kind restricted to RENT or DAMAGE_FEE); allowed while lease is DRAFT or ACTIVE", roles: [LeasingAgent, PropertyManager], code: 201, input: ["kind", "period_start_date", "period_end_date", "due_date", "amount_cents"], output: LedgerCharge, side_effects: [] }
  - { method: GET, path: "/api/leases/{id}/charges", description: "List charges of a lease (FK reverse reachability for LedgerCharge.lease_id)", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: ["status?", "kind?", "limit?", "offset?"], output: "LedgerCharge[]", side_effects: [] }
  - { method: POST, path: "/api/charges/{id}/waive", description: "Waive all or part of a charge's outstanding; full waiver flips status to WAIVED; SoD: caller must differ from created_by_user_id", roles: [PropertyManager], code: 200, input: ["amount_cents", "reason"], output: LedgerCharge, side_effects: ["waived_cents += amount_cents", "outstanding/status recompute", "DRAFT notices covering the charge recompute amount_demanded_cents", "PENDING referrals recompute referred_balance_cents", "increments LedgerCharge.version by 1"] }
  - { method: POST, path: "/api/payments", description: "Record a payment in PENDING (no allocation yet); Tenant callers must pay their own lease", roles: [Tenant, LeasingAgent], code: 201, input: ["lease_id", "tenant_id", "channel", "amount_cents", "received_date?"], output: Payment, side_effects: [] }
  - { method: GET, path: "/api/payments/{id}", description: "Read one payment", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: [], output: Payment, side_effects: [] }
  - { method: GET, path: "/api/payments", description: "List payments with filters (FK reverse for Payment.lease_id and Payment.tenant_id)", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: ["lease_id?", "tenant_id?", "status?", "limit?", "offset?"], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/api/payments/{id}/transition", description: "Payment lifecycle: POST runs the waterfall from PENDING or RETURNED (re-presentment); RETURN records an NSF and runs Cascade A", roles: [LeasingAgent, PropertyManager], code: 200, input: ["action", "reason_code?", "nsf_fee_cents?"], output: Payment, side_effects: ["POST: creates APPLY allocations, recomputes charges", "RETURN: creates REVERSE allocations, recomputes charges, creates NSF_FEE charge, recomputes DRAFT notice demands", "increments Payment.version by 1"] }
  - { method: GET, path: "/api/allocations/{id}", description: "Read one allocation (append-only ledger entry)", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: [], output: PaymentAllocation, side_effects: [] }
  - { method: GET, path: "/api/allocations", description: "List allocations with filters (FK reverse for PaymentAllocation.payment_id and PaymentAllocation.charge_id)", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: ["payment_id?", "charge_id?", "limit?", "offset?"], output: "PaymentAllocation[]", side_effects: [] }
  - { method: POST, path: "/api/notices", description: "Create a pay-or-quit notice in DRAFT; supersedes any existing DRAFT notice on the lease (existing DRAFT -> CANCELLED/SUPERSEDED); OCC-guarded", roles: [LeasingAgent, PropertyManager], code: 201, input: ["lease_id", "charge_ids", "expected_lease_version"], output: DelinquencyNotice, side_effects: ["cancels existing DRAFT notices of the lease (SUPERSEDED)", "computes coverage window and provisional amount_demanded_cents", "increments Lease.version by 1"] }
  - { method: GET, path: "/api/leases/{id}/notices", description: "List notices of a lease (FK reverse for DelinquencyNotice.lease_id)", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: ["status?", "limit?", "offset?"], output: "DelinquencyNotice[]", side_effects: [] }
  - { method: POST, path: "/api/notices/{id}/transition", description: "Notice lifecycle: ISSUE freezes the demand and sets the cure deadline; SERVE records statutory service documentation", roles: [PropertyManager], code: 200, input: ["action", "service_method?", "served_date?"], output: DelinquencyNotice, side_effects: ["increments DelinquencyNotice.version by 1"] }
  - { method: POST, path: "/api/payment-plans", description: "Create a payment plan in DRAFT; supersedes any existing DRAFT plan on the lease; evaluates setup fee (pre-fee balance) then splits installments; OCC-guarded", roles: [Tenant, LeasingAgent, PropertyManager], code: 201, input: ["lease_id", "charge_ids", "installment_count", "first_installment_date", "expected_lease_version"], output: PaymentPlan, side_effects: ["cancels existing DRAFT plans of the lease (SUPERSEDED)", "creates PLAN_SETUP_FEE charge when applicable", "computes installments", "increments Lease.version by 1"] }
  - { method: GET, path: "/api/leases/{id}/payment-plans", description: "List payment plans of a lease (FK reverse for PaymentPlan.lease_id)", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: ["status?", "limit?", "offset?"], output: "PaymentPlan[]", side_effects: [] }
  - { method: GET, path: "/api/payment-plans/{id}", description: "Read one plan including the embedded installment schedule", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: [], output: PaymentPlan, side_effects: [] }
  - { method: POST, path: "/api/payment-plans/{id}/transition", description: "Plan lifecycle: APPROVE (DRAFT->ACTIVE) with segregation of duties and SERVED-notice gate", roles: [PropertyManager], code: 200, input: ["action"], output: PaymentPlan, side_effects: ["increments PaymentPlan.version by 1"] }
  - { method: POST, path: "/api/disputes", description: "Tenant files a dispute against a charge on their own lease", roles: [Tenant], code: 201, input: ["lease_id", "charge_id", "tenant_id", "reason"], output: Dispute, side_effects: [] }
  - { method: GET, path: "/api/disputes/{id}", description: "Read one dispute", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: [], output: Dispute, side_effects: [] }
  - { method: GET, path: "/api/disputes", description: "List disputes with filters (FK reverse for Dispute.lease_id, Dispute.charge_id, Dispute.tenant_id)", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: ["lease_id?", "charge_id?", "tenant_id?", "status?", "limit?", "offset?"], output: "Dispute[]", side_effects: [] }
  - { method: POST, path: "/api/disputes/{id}/transition", description: "Dispute lifecycle: RESOLVE (PropertyManager; outcome UPHELD or ADJUSTED — ADJUSTED runs Cascade C) or REOPEN (Tenant owner, once)", roles: [PropertyManager, Tenant], code: 200, input: ["action", "outcome?", "adjusted_amount_cents?", "resolution_notes?"], output: Dispute, side_effects: ["RESOLVE ADJUSTED: Cascade C (charge amount/outstanding, notice demands, referral balance and possible auto-recall)", "increments Dispute.version by 1"] }
  - { method: POST, path: "/api/collections-referrals/{id}/transition", description: "Referral lifecycle: REFER (from PENDING or RECALLED; gated on open disputes and threshold), SETTLE, RECALL", roles: [PropertyManager], code: 200, input: ["action", "agency_name?", "recall_reason?"], output: CollectionsReferral, side_effects: ["increments CollectionsReferral.version by 1"] }
  - { method: GET, path: "/api/leases/{id}/collections-referrals", description: "List collections referrals of a lease (FK reverse for CollectionsReferral.lease_id)", roles: [PropertyManager, LeasingAgent, Tenant, SystemOps], code: 200, input: ["status?", "limit?", "offset?"], output: "CollectionsReferral[]", side_effects: [] }
  - { method: POST, path: "/api/delinquency-runs", description: "Ops-run checkpoint sweep over the logical clock: assesses final-variant late fees (idempotent per lease+period), evaluates plan installments (MISSED/DEFAULTED/CURED), and cures or expires notices past their deadline. A repeated run with an unchanged clock changes nothing.", roles: [SystemOps], code: 200, input: [], output: { late_fees_assessed_count: integer, installments_marked_missed_count: integer, plans_defaulted_count: integer, plans_cured_count: integer, notices_cured_count: integer, notices_expired_count: integer }, side_effects: ["creates LATE_FEE charges", "flips installment/plan/notice states per machines"] }
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Test-driving logical clock. The server's logical clock starts at exactly 2026-08-01T00:00:00Z before any set call and never falls back to wall-clock time.", roles: [SystemOps], code: 200, input: ["to_iso8601"], output: { current_utc: string }, side_effects: ["sets the logical clock used by every date rule"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers, or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on the endpoint, or action-level role/ownership check failed (Tenant acting on another tenant's lease/payment/dispute; Tenant attempting RESOLVE; non-owner REOPEN)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, malformed id/date, undeclared payload field, adjusted_amount_cents out of range, or manual charge kind outside {RENT, DAMAGE_FEE}" }
  - { id: ERR_LEASE_NOT_ACTIVE, http: 409, condition: "Operation requires lease status ACTIVE (payment posting, notice creation/issue, plan creation) but lease is DRAFT" }
  - { id: ERR_LEASE_ALREADY_ENDED, http: 409, condition: "Operation is forbidden once the lease is ENDED (payment creation/posting, charge creation, notice creation/issue, plan creation)" }
  - { id: ERR_PAYMENT_INVALID_TRANSITION, http: 409, condition: "POST action on a payment not in PENDING or RETURNED; RETURN action on a payment not in POSTED" }
  - { id: ERR_CHANNEL_NOT_RETURNABLE, http: 409, condition: "RETURN attempted on a payment whose channel is not ACH or CHECK" }
  - { id: ERR_NOTICE_INVALID_TRANSITION, http: 409, condition: "ISSUE from a non-DRAFT notice, or SERVE from a non-ISSUED notice" }
  - { id: ERR_NOTICE_SERVICE_WINDOW, http: 422, condition: "served_date outside [issued_date, cure_deadline_date]" }
  - { id: ERR_NOTICE_PERIOD_OVERLAP, http: 409, condition: "Notice coverage window (closed-day) shares a calendar day with another notice of the same lease in status ISSUED or SERVED" }
  - { id: ERR_CHARGE_NOT_WAIVABLE, http: 409, condition: "Waive attempted on a charge in status PAID, WAIVED, or VOID" }
  - { id: ERR_CHARGE_NOT_ON_LEASE, http: 422, condition: "A charge_ids element (or dispute charge_id) belongs to a different lease than the request targets" }
  - { id: ERR_WAIVER_EXCEEDS_OUTSTANDING, http: 422, condition: "Waiver amount_cents exceeds the charge's outstanding_cents" }
  - { id: ERR_WAIVER_CAP_EXCEEDED, http: 422, condition: "Waiver would push the property's calendar-month waived total above monthly_waiver_cap_cents" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Plan approver equals drafted_by_user_id, or waiver caller equals charge.created_by_user_id" }
  - { id: ERR_PARTIAL_BELOW_MINIMUM, http: 422, condition: "Partial payment below ceil(total outstanding * min_partial_payment_percent / 100) and not equal to total outstanding" }
  - { id: ERR_OVERPAYMENT_REJECTED, http: 422, condition: "Payment amount exceeds total outstanding across the lease's open charges" }
  - { id: ERR_PLAN_EXISTS, http: 409, condition: "Plan creation while another plan on the same lease is ACTIVE" }
  - { id: ERR_PLAN_COOLING_OFF, http: 422, condition: "Plan creation within property.plan_cooling_off_days of a prior plan's defaulted_date" }
  - { id: ERR_PLAN_INVALID_TRANSITION, http: 409, condition: "APPROVE attempted on a plan not in DRAFT" }
  - { id: ERR_INVALID_INSTALLMENT_SCHEDULE, http: 422, condition: "first_installment_date not strictly after today, or installment_count outside 2..12" }
  - { id: ERR_ACTIVE_NOTICE_BLOCKS_PLAN, http: 409, condition: "Plan approval while any notice on the lease is SERVED" }
  - { id: ERR_BLOCKING_DISPUTE, http: 409, condition: "Collections REFER while any dispute on the lease is OPEN or REOPENED" }
  - { id: ERR_REFERRAL_THRESHOLD_NOT_MET, http: 422, condition: "REFERRED attempted with referred_balance_cents below property.collections_threshold_cents" }
  - { id: ERR_REFERRAL_INVALID_TRANSITION, http: 409, condition: "Referral transition not allowed from the current status (e.g. SETTLE from PENDING, REFER from REFERRED)" }
  - { id: ERR_DISPUTE_INVALID_TRANSITION, http: 409, condition: "RESOLVE from a non-OPEN/non-REOPENED dispute, or REOPEN from a non-RESOLVED_UPHELD dispute" }
  - { id: ERR_DISPUTE_REOPEN_EXHAUSTED, http: 409, condition: "REOPEN attempted when reopen_count is already 1" }
  - { id: ERR_LEASE_TERM_OVERLAP, http: 409, condition: "ACTIVATE would create overlapping half-open terms on the same (property_id, unit_label)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_lease_version does not match the lease's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PropertyManager
    description: "Portfolio back-office authority: property/lease administration, waivers, notice issuance and service, plan approval, dispute resolution, collections referral"
    identity: opaque
    exclusive_operations:
      - "POST /api/properties"
      - "POST /api/leases/{id}/transition"
      - "POST /api/charges/{id}/waive"
      - "POST /api/notices/{id}/transition"
      - "POST /api/payment-plans/{id}/transition"
      - "POST /api/collections-referrals/{id}/transition"
      - "dispute RESOLVE action"
    shared_operations:
      - "tenant/lease/charge creation, payment posting and returns, notice and plan drafting, all GET reads"
  - name: LeasingAgent
    description: "Front-office operator: onboards tenants and leases, records counter payments and bank returns, drafts notices and plans"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "tenant/lease/charge creation, payment creation and transitions, notice and plan drafting, all GET reads"
  - name: Tenant
    description: "The lease's primary tenant acting on their own ledger: pays, disputes, requests payment plans, reopens an upheld dispute once"
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /api/disputes"
      - "dispute REOPEN action (own disputes only)"
    shared_operations:
      - "payment creation on own lease, plan creation (drafting) on own lease, GET reads scoped to own lease graph"
  - name: SystemOps
    description: "Operations/automation identity driving the delinquency sweep and the logical clock; no business-mutation rights"
    identity: opaque
    exclusive_operations:
      - "POST /api/delinquency-runs"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
