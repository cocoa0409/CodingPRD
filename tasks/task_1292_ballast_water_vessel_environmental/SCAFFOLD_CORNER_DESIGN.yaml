  # ============================================================
  # Section: errors (claim-extraction-guide Table 6 — every error triggerable)
  # ============================================================
  - section: errors
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1: a request with an unrecognized X-User-Role (Anonymous is not in the known role set) is rejected ERR_UNAUTHENTICATED (401) before any role/existence/business check runs."
        test_recipe:
          setup: ["Vessel MV Garganey exists; request sent with X-User-Role: Anonymous (unrecognized) — equivalent to missing auth headers"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "9100056", vessel_name: "MV Garganey", bwms_type: NONE, gross_tonnage: 8000, keel_laid_date: "2016-01-01T00:00:00Z", ballast_capacity_m3: 4000 }
              as: ShoreComplianceOfficer
          trigger:
            - call: "GET /vessels"
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"
            - "HTTP 401"

      - name: err_event_out_of_window_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_OUT_OF_WINDOW]"]
        excluded_because:
          difficulty_instance: event_window_beats_volume_capacity
          rationale: "Triggered and asserted as the winning error in the named §1.8 priority instance."

      - name: err_invalid_state_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: voyage_depart_requires_approved_plan
          rationale: "Triggered by the blocked depart in the named §1.8 instance; also re-asserted across §1.9 invalid-transition instances."

      - name: err_not_found_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_FOUND]"]
        excluded_because:
          difficulty_instance: existence_beats_state_on_hierarchy_mismatch
          rationale: "Asserted as the winning error in the named §1.8 priority instance."

      - name: err_unauthorized_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHORIZED]"]
        excluded_because:
          difficulty_instance: authorization_beats_segregation_of_duties
          rationale: "Asserted as the winning error in the named §1.8 priority instance."

      - name: err_tank_balance_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_TANK_BALANCE_NEGATIVE]"]
        excluded_because:
          difficulty_instance: tank_balance_exactly_zero_then_overdraft
          rationale: "Triggered by the 0.001 m3 overdraft in the named §1.8 boundary instance."

