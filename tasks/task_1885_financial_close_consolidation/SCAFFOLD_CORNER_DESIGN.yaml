        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
          trigger:
            - call: "GET /close/periods"
              payload: {}
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "request without a valid role context yields ERR_UNAUTHENTICATED (401) — simulated by the test harness omitting the header; the endpoint exists and the auth check is priority 1"

      - name: forbidden_role_on_exclusive_endpoint
