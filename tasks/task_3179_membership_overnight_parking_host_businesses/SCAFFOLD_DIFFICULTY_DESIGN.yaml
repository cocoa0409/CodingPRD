            - "the circulating stay occupies D1 until 2026-07-05T10:00 and the 2-hour buffer reaches 2026-07-05T12:00, which is after the new interval's 2026-07-05T11:00 start — the buffer alone is what binds, since 11:00 is already past the unbuffered 10:00 end"
