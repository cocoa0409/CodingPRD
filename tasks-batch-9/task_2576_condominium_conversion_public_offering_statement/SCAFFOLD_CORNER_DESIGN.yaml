      - name: posture_sweep_is_a_no_op_because_the_assessment_already_applied_its_projection
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /conversion-projects/{id}/posture-recalculations]
          - calculations.project_posture_derivation
          - entities.ConversionProject.fields.posture
          - entities.ConversionProject.fields.last_posture_recalculated_at
        distinguishing_aspect: "The sweep endpoint exists only as an idempotent re-derivation, not as the
          mechanism that makes writes visible: because the model is immediate, the assessment's own
          response already leaves suitability_gate PASSED, suitability_score 100.00 and posture RESTRICTED
          (no RECORDED package yet), so the sweep that follows must return byte-identical posture, gate and
          score and change only last_posture_recalculated_at, which moves from null to the clock. Running
          the sweep twice at two different clock instants must move that timestamp twice and nothing else -
          an implementation that only converges the derived posture during the sweep would show
          UNEVALUATED or FROZEN before the first sweep and RESTRICTED after it."
        test_recipe:
          setup:
            - "Project whose SUBMITTED ER-1 has one VERIFIED ROOF component (10000000 cents, RUL 30,
