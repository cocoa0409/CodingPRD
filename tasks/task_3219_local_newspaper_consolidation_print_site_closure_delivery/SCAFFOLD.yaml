    description: "Pause a stop for its declared pause window"
    roles: [DeliveryNetworkManager]
    code: 200
    input: []
    output: DeliveryStop
    side_effects: ["member subscriber contracts pause", "the hub's legal-notice ratio is re-examined (§1.3 is_legal_notice_ratio_compliant); RegionHub.version increments by 1"]

  - method: POST
    path: "/regional-news-ops/delivery-stops/{id}/resume"
    description: "Resume a paused stop once its window has closed"
    roles: [DeliveryNetworkManager]
    code: 200
    input: []
    output: DeliveryStop
    side_effects: ["paused member subscriber contracts reactivate", "the hub's legal-notice ratio is re-examined; RegionHub.version increments by 1"]

  - method: POST
    path: "/regional-news-ops/delivery-stops/{id}/terminate"
    description: "Terminate a stop; the terminal state"
    roles: [DeliveryNetworkManager]
    code: 200
    input: []
    output: DeliveryStop
    side_effects: ["member subscriber contracts move to churned_pending_retention", "the hub's legal-notice ratio is re-examined; RegionHub.version increments by 1"]

  # --- SubscriberContract ---------------------------------------------------
  - method: POST
    path: "/regional-news-ops/delivery-stops/{id}/subscribers"
    description: "Create a subscriber contract on a delivery stop"
    roles: [CustomerService]
    code: 201
    input: [subscriber_ref, remaining_print_issues, paid_through_utc, print_issue_value_cents]
    output: SubscriberContract
    side_effects: ["migration_credit_cents, churn_retention_credit_cents and offer_recommendation computed (§1.3)", "status initialized to active; offer_status and delivery_status initialized to none"]

  - method: GET
    path: "/regional-news-ops/delivery-stops/{id}/subscribers"
    description: "List a stop's subscriber contracts"
    roles: [CustomerService, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: "SubscriberContract[]"
    side_effects: []

  - method: GET
    path: "/regional-news-ops/subscribers/{id}"
    description: "Get one subscriber contract"
    roles: [CustomerService, Subscriber, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: SubscriberContract
    side_effects: []

  - method: GET
    path: "/regional-news-ops/subscribers"
    description: "List subscriber contracts, optionally filtered by stop"
    roles: [CustomerService, Auditor, PlatformAdmin]
    code: 200
    input: ["delivery_stop_id?", "status?", "limit?", "offset?"]
    output: "SubscriberContract[]"
    side_effects: []

  - method: POST
    path: "/regional-news-ops/subscribers/{id}/migrate-digital"
    description: "Migrate a subscriber from print to digital"
    roles: [CustomerService, Subscriber]
    code: 200
    input: []
    output: SubscriberContract
    side_effects: ["status becomes migrated and offer_status becomes accepted", "migration_credit_cents computed (§1.3 subscriber_digital_migration_credit, retained-print-margin variant)"]

  - method: POST
    path: "/regional-news-ops/subscribers/{id}/accept-retention-offer"
    description: "Accept the open retention offer and return the subscriber to active"
    roles: [CustomerService]
    code: 200
    input: []
    output: SubscriberContract
    side_effects: ["status returns to active from churned_pending_retention; offer_status becomes accepted", "the open retention action becomes accepted"]

  - method: POST
    path: "/regional-news-ops/subscribers/{id}/cancel"
    description: "Cancel the subscriber contract"
    roles: [CustomerService, Subscriber]
    code: 200
    input: []
    output: SubscriberContract
    side_effects: ["status becomes churned; churn_retention_credit_cents computed (§1.3 subscriber_digital_migration_credit, refund-responsibility variant)"]

  - method: POST
    path: "/regional-news-ops/subscribers/{id}/refund"
    description: "Refund the subscriber's remaining print issues"
    roles: [CustomerService]
    code: 200
    input: []
    output: SubscriberContract
    side_effects: ["status becomes churned; churn_retention_credit_cents computed (§1.3 subscriber_digital_migration_credit, refund-responsibility variant)"]

  - method: GET
    path: "/regional-news-ops/subscribers/{id}/retention-actions"
    description: "List the retention actions recorded on this subscriber contract"
    roles: [CustomerService, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: "RetentionAction[]"
    side_effects: []

  # --- RetentionAction ------------------------------------------------------
  - method: POST
    path: "/regional-news-ops/subscribers/{id}/retention-actions"
    description: "Offer a retention action to a churning subscriber"
    roles: [CustomerService]
    code: 201
    input: [retention_offer_code, retention_credit_cents, eligibility_policy_id]
    output: RetentionAction
    side_effects: ["cooling_off_expires_utc stamped; status initialized to open"]

  - method: GET
    path: "/regional-news-ops/retention-actions/{id}"
    description: "Get one retention action"
    roles: [CustomerService, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: RetentionAction
    side_effects: []

  - method: POST
    path: "/regional-news-ops/retention-actions/{id}/accept"
    description: "Accept a retention action inside its cooling-off window"
    roles: [CustomerService]
    code: 200
    input: []
    output: RetentionAction
    side_effects: ["status becomes accepted; the parent subscriber contract returns to active"]

  # --- NewsroomPosition -----------------------------------------------------
  - method: POST
    path: "/regional-news-ops/regions/{id}/newsroom-positions"
    description: "Create a newsroom position inside a region"
    roles: [NewsroomOperationsManager]
    code: 201
    input: [role_code, expertise_code, monthly_cost_cents]
    output: NewsroomPosition
    side_effects: ["status initialized to open"]

  - method: GET
    path: "/regional-news-ops/regions/{id}/newsroom-positions"
    description: "List a region's newsroom positions"
    roles: [NewsroomOperationsManager, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: "NewsroomPosition[]"
    side_effects: []

  - method: GET
    path: "/regional-news-ops/newsroom-positions/{id}"
    description: "Get one newsroom position"
    roles: [NewsroomOperationsManager, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: NewsroomPosition
    side_effects: []

  # --- NewsroomChange -------------------------------------------------------
  - method: POST
    path: "/regional-news-ops/newsroom-changes"
    description: "Propose a headcount movement between regions (occ_field expected_hub_version)"
    roles: [NewsroomOperationsManager]
    code: 201
    input: [newsroom_position_id, to_region_id, from_region_id, effective_date, layoff_order_index, requested_slots, expected_hub_version]
    output: NewsroomChange
    side_effects: ["status initialized to proposed", "increments RegionHub.version by 1"]

  - method: GET
    path: "/regional-news-ops/newsroom-changes"
    description: "List newsroom changes, optionally filtered by origin or destination region"
    roles: [NewsroomOperationsManager, Auditor, PlatformAdmin]
    code: 200
    input: ["to_region_id?", "from_region_id?", "limit?", "offset?"]
    output: "NewsroomChange[]"
    side_effects: []

  - method: GET
    path: "/regional-news-ops/newsroom-changes/{id}"
    description: "Get one newsroom change"
    roles: [NewsroomOperationsManager, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: NewsroomChange
    side_effects: []

  - method: GET
    path: "/regional-news-ops/newsroom-positions/{id}/newsroom-changes"
    description: "List the changes recorded against one newsroom position"
    roles: [NewsroomOperationsManager, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: "NewsroomChange[]"
    side_effects: []

  - method: POST
    path: "/regional-news-ops/newsroom-changes/{id}/approve"
    description: "Approve a proposed headcount movement"
    roles: [NewsroomOperationsManager]
    code: 200
    input: []
    output: NewsroomChange
    side_effects: ["status becomes approved"]

  - method: POST
    path: "/regional-news-ops/newsroom-changes/{id}/apply"
    description: "Apply an approved headcount movement on its effective date"
    roles: [NewsroomOperationsManager]
    code: 200
    input: []
    output: NewsroomChange
    side_effects: ["residual_headcount and allocated_slots computed (§1.3 newsroom_allocation_share second pass)", "severance_cost_cents computed (§1.3 newsroom_severance_cost)", "region and hub headcounts recomputed"]

  - method: POST
    path: "/regional-news-ops/newsroom-changes/{id}/reject"
    description: "Reject a proposed headcount movement"
    roles: [NewsroomOperationsManager]
    code: 200
    input: []
    output: NewsroomChange
    side_effects: ["status becomes rejected"]

  - method: POST
    path: "/regional-news-ops/newsroom-changes/{id}/reopen"
    description: "Return an approved but unapplied headcount movement to proposed"
    roles: [NewsroomOperationsManager]
    code: 200
    input: []
    output: NewsroomChange
    side_effects: ["status returns to proposed", "increments RegionHub.version by 1"]

  # --- TitleClosure ---------------------------------------------------------
  - method: POST
    path: "/regional-news-ops/region-hubs/{id}/title-closures"
    description: "Announce the closure of a title"
    roles: [PrintOperationsDirector]
    code: 201
    input: [title_code, archive_retention_years, digital_replacement_url]
    output: TitleClosure
    side_effects: ["status initialized to announced"]

  - method: GET
    path: "/regional-news-ops/region-hubs/{id}/title-closures"
    description: "List a hub's title closures"
    roles: [PrintOperationsDirector, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: "TitleClosure[]"
    side_effects: []

  - method: GET
    path: "/regional-news-ops/title-closures/{id}"
    description: "Get one title closure"
    roles: [PrintOperationsDirector, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: TitleClosure
    side_effects: []

  - method: POST
    path: "/regional-news-ops/title-closures/{id}/publish-notice"
    description: "Publish the statutory closure notice"
    roles: [PrintOperationsDirector]
    code: 200
    input: []
    output: TitleClosure
    side_effects: ["status becomes notice_published"]

  - method: POST
    path: "/regional-news-ops/title-closures/{id}/suspend"
    description: "Suspend a published closure while the hub is under a legal-notice hold"
    roles: [PrintOperationsDirector]
    code: 200
    input: []
    output: TitleClosure
    side_effects: ["status becomes suspended"]

  - method: POST
    path: "/regional-news-ops/title-closures/{id}/resume"
    description: "Resume a suspended closure once the hub's hold clears"
    roles: [PrintOperationsDirector]
    code: 200
