    instances:

      - name: corner_cross_role_exclusive_operations_are_unauthorized
        claim_type: role_cannot_perform_others_exclusive_operations
        grounds:
          - validations[priority=20]
          - errors[ERR_UNAUTHORIZED]
          - roles.PlatformAdmin.exclusive_operations
          - roles.Customer.exclusive_operations
          - roles.PartnerManager.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
        distinguishing_aspect: |
          Four well-formed calls, each made by a role that does not own the operation, all fail
          403 ERR_UNAUTHORIZED at priority 20 — before any resource-scope, state or business check
          could run — and none of them writes a row.
