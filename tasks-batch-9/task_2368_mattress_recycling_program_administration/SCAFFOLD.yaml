# =============================================================================
# task_2368 — Mattress Recycling Program Administration  (seed tables §1.0–§1.7)
# =============================================================================

scenario: |
  2368. Mattress Recycling Program Administration (Bye Bye Mattress / Mattress Recycling Council):
  manufacturer/retailer recycling-fee collection and remittance by state, exempt sale and
  out-of-state shipment fee reconciliation, collection site and transfer-station enrollment with
  volume reporting, hauler routing and per-unit recycling payment, contamination and infestation
  rejection rules, recycler processing certification & commodity output tracking, retailer
  take-back-with-delivery obligation, fee-rate setting to program cost and reserve level

domain_name: mattress-recycling-program
api_prefix: ""            # flat topology: peer collections at the root (/state-programs, /sales-remittances, …)

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat
  # 13 peer collections joined by explicit FK fields; the only nested URL segments are
  # sub-resource reads/creates (exemption-claims, volume-reports, inspections, commodity-output-records).
  state_machine_shape: cyclic
  # SalesRemittance loops UNDER_AUDIT → AMENDMENT_REQUIRED → UNDER_AUDIT (≤2 rounds);
  # CollectionSite loops ENROLLED → SUSPENDED → ENROLLED; Recycler loops CERTIFIED → SUSPENDED → CERTIFIED;
  # PickupOrder carries two independent state axes (fulfillment_status × settlement_status);
  # TakeBackDelivery branches SCHEDULED → {OBLIGATION_MET, OBLIGATION_BREACHED, WAIVED}.
  relationship_patterns:
    - one_to_many
    - self_referential      # SalesRemittance.amends_remittance_id -> SalesRemittance.id
    - cross_aggregate       # PickupOrder joins CollectionSite + Hauler + Recycler across aggregates
  role_model: segregation_of_duties
  # ProgramAdministrator proposes a fee rate but a different administrator user must approve it;
  # the auditor who requested an amendment may not close that audit.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: StateProgram
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter USPS state code; unique across StateProgram", constraints: "exactly 2 uppercase letters; unique" }
      - { name: program_name, type: string, source: input, description: "Statutory program name" }
      - { name: forecast_annual_cost_cents, type: integer, source: input, description: "Forecast annual program cost used by fee_rate_recommendation", constraints: ">= 1" }
      - { name: forecast_annual_units, type: integer, source: input, description: "Forecast annual chargeable units used by fee_rate_recommendation", constraints: ">= 1" }
      - { name: forecast_other_revenue_cents, type: integer, source: input, default: 0, description: "Forecast non-fee revenue (commodity, grants) netted against cost", constraints: ">= 0" }
      - { name: reserve_target_months, type: integer, source: input, description: "Target reserve expressed in months of program cost", constraints: "1..12" }
      - { name: reserve_opening_cents, type: integer, source: input, description: "Opening reserve balance recorded at program creation; immutable afterwards", constraints: ">= 0" }
      - { name: site_credit_cents_per_unit, type: integer, source: input, description: "Per-unit credit paid to enrolled collection sites on accepted volume reports", constraints: ">= 0" }
      - { name: volume_bonus_threshold_units, type: integer, source: input, description: "credited_units >= this value earns the site_volume_credit volume bonus", constraints: ">= 1" }
      - { name: delinquency_alert_threshold, type: integer, source: input, default: 1, description: "delinquent_registrant_count >= this value drives enforcement_posture to ELEVATED", constraints: ">= 1" }
      - { name: fee_collected_cents, type: integer, source: computed, default: 0, description: "= sum(SalesRemittance.fee_paid_cents) - sum(SalesRemittance.fee_refunded_cents) over SalesRemittance rows with state_program_id == this.id and status IN {PAID, UNDER_AUDIT, AMENDMENT_REQUIRED, AUDIT_CLOSED, REFUNDED}" }
      - { name: site_credit_paid_cents, type: integer, source: computed, default: 0, description: "= sum(VolumeReport.credit_cents) over VolumeReport rows with status == ACCEPTED whose collection_site_id belongs to this program" }
      - { name: hauler_payment_paid_cents, type: integer, source: computed, default: 0, description: "= sum(PickupOrder.final_payment_cents) over PickupOrder rows with settlement_status == FINALIZED whose collection_site_id belongs to this program" }
      - { name: reserve_balance_cents, type: integer, source: computed, description: "= reserve_opening_cents + fee_collected_cents - site_credit_paid_cents - hauler_payment_paid_cents (see calculations.program_ledger_reconciliation)" }
      - { name: receivable_cents, type: integer, source: computed, default: 0, description: "= sum(SalesRemittance.balance_due_cents) over SalesRemittance rows with state_program_id == this.id and status == AUDIT_CLOSED" }
      - { name: reserve_coverage_months, type: number, source: computed, description: "Reserve expressed in months of forecast cost, 2 decimal places (see calculations.reserve_coverage_months)" }
      - { name: recommended_rate_cents, type: integer, source: computed, description: "Output of calculations.fee_rate_recommendation for this program's current forecast + reserve state" }
      - { name: enrolled_site_count, type: integer, source: computed, default: 0, description: "Count of CollectionSite rows with state_program_id == this.id and enrollment_status == ENROLLED" }
      - { name: reported_units_total, type: integer, source: computed, default: 0, description: "= sum(VolumeReport.credited_units) over ACCEPTED reports of this program's sites plus sum(TakeBackDelivery.units_takeback_collected) over OBLIGATION_MET / OBLIGATION_BREACHED deliveries to this program's sites" }
      - { name: delinquent_registrant_count, type: integer, source: computed, default: 0, description: "Count of distinct Registrant rows whose compliance_status IN {DELINQUENT, SUSPENDED} and which hold at least one AUDIT_CLOSED remittance of this program with balance_due_cents > 0" }
      - { name: enforcement_posture, type: enum, source: computed, default: "NORMAL", description: "NORMAL | ELEVATED — ELEVATED once delinquent_registrant_count >= delinquency_alert_threshold; blocks fee refunds", constraints: "NORMAL | ELEVATED" }

  - name: FeeRateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: state_program_id, type: string, source: input, description: "FK -> StateProgram.id" }
      - { name: unit_class, type: enum, source: input, description: "MATTRESS | FOUNDATION — the class of unit this rate charges", constraints: "MATTRESS | FOUNDATION" }
      - { name: fee_cents_per_unit, type: integer, source: input, description: "Recycling fee collected per unit sold", constraints: ">= 1" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of this rate's effective interval (ISO 8601 UTC)" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of the effective interval; omit (null) to propose an open-ended rate. When null and a successor is activated for the same (state_program_id, unit_class), it is set to that successor's effective_from.", constraints: "when present, > effective_from" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED -> APPROVED -> ACTIVE -> SUPERSEDED", constraints: "PROPOSED | APPROVED | ACTIVE | SUPERSEDED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramAdministrator that created the proposal (segregation-of-duties input)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving ProgramAdministrator; null while PROPOSED" }
      - { name: recommended_rate_cents_at_proposal, type: integer, source: computed, description: "Snapshot of StateProgram.recommended_rate_cents at proposal time" }
      - { name: band_low_cents, type: integer, source: computed, description: "floor(recommended_rate_cents_at_proposal * 0.80) — lower edge of the accepted proposal band" }
      - { name: band_high_cents, type: integer, source: computed, description: "ceil(recommended_rate_cents_at_proposal * 1.20) — upper edge of the accepted proposal band" }

  - name: Registrant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal entity name" }
      - { name: registrant_type, type: enum, source: input, description: "MANUFACTURER | RETAILER | BOTH — RETAILER and BOTH carry the take-back-with-delivery obligation", constraints: "MANUFACTURER | RETAILER | BOTH" }
      - { name: home_state_code, type: string, source: input, description: "State of the registrant's principal place of business", constraints: "exactly 2 uppercase letters" }
      - { name: compliance_status, type: enum, source: system, default: "COMPLIANT", description: "COMPLIANT | DELINQUENT | SUSPENDED — DELINQUENT once delinquent_balance_cents > 0; SUSPENDED once delinquent_balance_cents >= 1000000", constraints: "COMPLIANT | DELINQUENT | SUSPENDED" }
      - { name: delinquent_balance_cents, type: integer, source: computed, default: 0, description: "= sum(SalesRemittance.balance_due_cents) over this registrant's AUDIT_CLOSED remittances + sum(TakeBackDelivery.breach_penalty_cents) over this registrant's OBLIGATION_BREACHED deliveries" }
      - { name: takeback_breach_count, type: integer, source: computed, default: 0, description: "Count of TakeBackDelivery rows with registrant_id == this.id and status == OBLIGATION_BREACHED" }

  - name: SalesRemittance
    parent: null
    common_fields: true
    fields:
      - { name: registrant_id, type: string, source: input, description: "FK -> Registrant.id" }
      - { name: state_program_id, type: string, source: input, description: "FK -> StateProgram.id" }
      - { name: amends_remittance_id, type: string, source: system, description: "FK -> SalesRemittance.id; null for an original filing, set to the audited parent for an amendment row" }
      - { name: period_code, type: string, source: input, description: "Reporting quarter as YYYYQn (Q1=Jan1-Mar31, Q2=Apr1-Jun30, Q3=Jul1-Sep30, Q4=Oct1-Dec31)", constraints: "matches ^[0-9]{4}Q[1-4]$" }
      - { name: period_start, type: datetime, source: computed, description: "First instant of period_code's quarter (UTC)" }
      - { name: period_end, type: datetime, source: computed, description: "Last day of period_code's quarter at 23:59:59.999Z" }
      - { name: units_sold_mattress, type: integer, source: input, description: "Mattress units sold into the state during the period", constraints: ">= 0" }
      - { name: units_sold_foundation, type: integer, source: input, description: "Foundation units sold into the state during the period", constraints: ">= 0" }
      - { name: amendment_round, type: integer, source: system, default: 0, description: "0 for an original filing; incremented on the audited parent each time an amendment is submitted (max 2)" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant of the DRAFT -> FILED transition; null while DRAFT" }
      - { name: early_filing_qualified, type: boolean, source: computed, default: false, description: "true when filed_at <= period_end + 20 days; drives the 1.5% early-filing discount" }
      - { name: fee_self_assessed_cents, type: integer, source: computed, default: 0, description: "SELF_ASSESSED variant of calculations.remittance_fee_assessment, stamped at FILED" }
      - { name: fee_reconciled_cents, type: integer, source: computed, description: "AUDIT_RECONCILED variant of calculations.remittance_fee_assessment, stamped at AUDIT_CLOSED; null before" }
      - { name: fee_paid_cents, type: integer, source: computed, default: 0, description: "Cash received against this remittance" }
      - { name: fee_refunded_cents, type: integer, source: computed, default: 0, description: "Cash returned against this remittance" }
      - { name: balance_due_cents, type: integer, source: computed, default: 0, description: "= max(0, fee_reconciled_cents - (fee_paid_cents - fee_refunded_cents)) stamped at AUDIT_CLOSED" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | FILED | PAID | UNDER_AUDIT | AMENDMENT_REQUIRED | AUDIT_CLOSED | REFUNDED", constraints: "DRAFT | FILED | PAID | UNDER_AUDIT | AMENDMENT_REQUIRED | AUDIT_CLOSED | REFUNDED" }
      - { name: audit_opened_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramAuditor that opened the audit; null before" }
      - { name: amendment_requested_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramAuditor that most recently requested an amendment; null if none (segregation-of-duties input for audit-close)" }

  - name: ExemptionClaim
    parent: null
    common_fields: true
    fields:
      - { name: remittance_id, type: string, source: system, description: "FK -> SalesRemittance.id" }
      - { name: claim_type, type: enum, source: input, description: "EXEMPT_SALE (statutorily exempt buyer) | OUT_OF_STATE_SHIPMENT (unit shipped outside the program state)", constraints: "EXEMPT_SALE | OUT_OF_STATE_SHIPMENT" }
      - { name: unit_class, type: enum, source: input, description: "MATTRESS | FOUNDATION — the sales line this claim credits", constraints: "MATTRESS | FOUNDATION" }
      - { name: units, type: integer, source: input, description: "Units claimed as non-chargeable", constraints: ">= 1" }
      - { name: documentation_reference, type: string, source: input, description: "Exemption certificate or bill-of-lading reference; null when the registrant has none" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING -> SUBSTANTIATED | DISALLOWED", constraints: "PENDING | SUBSTANTIATED | DISALLOWED" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the adjudicating ProgramAuditor; null while PENDING" }
      - { name: disallow_reason, type: enum, source: system, description: "MISSING_DOCUMENTATION | UNITS_UNSUPPORTED | OUT_OF_SCOPE; null unless status == DISALLOWED", constraints: "MISSING_DOCUMENTATION | UNITS_UNSUPPORTED | OUT_OF_SCOPE" }

  - name: CollectionSite
    parent: null
    common_fields: true
    fields:
      - { name: state_program_id, type: string, source: input, description: "FK -> StateProgram.id" }
      - { name: operator_name, type: string, source: input, description: "Operating organisation of the site" }
      - { name: site_type, type: enum, source: input, description: "COLLECTION_SITE | TRANSFER_STATION | PERMANENT_DROPOFF", constraints: "COLLECTION_SITE | TRANSFER_STATION | PERMANENT_DROPOFF" }
      - { name: region_code, type: string, source: input, description: "Routing region; a hauler is eligible only when its service_regions contains this value" }
      - { name: enrollment_status, type: enum, source: system, default: "APPLIED", description: "APPLIED -> ENROLLED <-> SUSPENDED", constraints: "APPLIED | ENROLLED | SUSPENDED" }
      - { name: contamination_strike_count, type: integer, source: computed, default: 0, description: "Count of FULL_REJECT LoadInspection outcomes charged to this site; 3 strikes force SUSPENDED" }
      - { name: infestation_quarantine_until, type: datetime, source: computed, description: "Set to inspection instant + 14 days whenever a load from this site is rejected with infestation_finding != NONE; new pickup orders are blocked while current_utc < this value" }
      - { name: units_on_hand, type: integer, source: computed, default: 0, description: "Units physically at the site and available to manifest" }
      - { name: units_in_transit, type: integer, source: computed, default: 0, description: "Units manifested on non-terminal pickup orders not yet delivered" }
      - { name: units_at_recycler_count, type: integer, source: computed, default: 0, description: "Units delivered to a recycler and awaiting inspection" }
      - { name: units_recycled_count, type: integer, source: computed, default: 0, description: "Units accepted by a recycler after inspection" }
      - { name: units_written_off_count, type: integer, source: computed, default: 0, description: "Units lost in transit (manifest shrinkage) plus units rejected at inspection" }
      - { name: units_reported_total, type: integer, source: computed, default: 0, description: "Lifetime units credited into this site's custody (accepted volume reports + collected take-back units); conserved quantity of calculations.site_unit_custody_conservation" }
      - { name: suspended_at, type: datetime, source: system, description: "Logical-clock instant of the most recent ENROLLED -> SUSPENDED transition; null if never suspended" }

  - name: VolumeReport
    parent: null
    common_fields: true
    fields:
      - { name: collection_site_id, type: string, source: system, description: "FK -> CollectionSite.id" }
      - { name: period_month, type: string, source: input, description: "Reported month as YYYY-MM; unique per collection_site_id", constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$" }
      - { name: units_mattress, type: integer, source: input, description: "Mattress units collected during the month", constraints: ">= 0" }
      - { name: units_foundation, type: integer, source: input, description: "Foundation units collected during the month", constraints: ">= 0" }
      - { name: credited_units, type: integer, source: computed, default: 0, description: "= units_mattress + units_foundation, stamped at ACCEPTED" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "Output of calculations.site_volume_credit, stamped at ACCEPTED" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED -> ACCEPTED", constraints: "SUBMITTED | ACCEPTED" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock instant of acceptance; null while SUBMITTED" }

  - name: Hauler
    parent: null
    common_fields: true
    fields:
      - { name: state_program_id, type: string, source: input, description: "FK -> StateProgram.id" }
      - { name: company_name, type: string, source: input, description: "Hauling company name" }
      - { name: service_regions, type: array, source: input, description: "Region codes this hauler serves (array of strings)", constraints: "at least 1 element" }
      - { name: per_unit_rate_cents, type: integer, source: input, description: "Per-unit hauling rate; also the primary ranking key of the hauler selector", constraints: ">= 0" }
      - { name: per_km_rate_cents, type: integer, source: input, description: "Per-kilometre route rate", constraints: ">= 0" }
      - { name: max_route_payment_cents, type: integer, source: input, description: "Contractual cap applied to a single route payment", constraints: ">= 1" }
      - { name: max_concurrent_routes, type: integer, source: input, default: 2, description: "Maximum number of buffer-overlapping pickup windows this hauler may hold", constraints: ">= 1" }
      - { name: active_route_count, type: integer, source: computed, default: 0, description: "Count of PickupOrder rows with hauler_id == this.id and fulfillment_status IN {SCHEDULED, PICKED_UP, DELIVERED}; secondary ranking key of the hauler selector" }
      - { name: total_paid_cents, type: integer, source: computed, default: 0, description: "= sum(PickupOrder.final_payment_cents) over this hauler's PickupOrder rows with settlement_status == FINALIZED" }

  - name: Recycler
    parent: null
    common_fields: true
    fields:
      - { name: state_program_id, type: string, source: input, description: "FK -> StateProgram.id" }
      - { name: facility_name, type: string, source: input, description: "Processing facility name" }
      - { name: accepted_unit_classes, type: array, source: input, description: "Unit classes the facility processes (subset of [MATTRESS, FOUNDATION])", constraints: "at least 1 element" }
      - { name: certification_status, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL -> CERTIFIED <-> SUSPENDED", constraints: "PROVISIONAL | CERTIFIED | SUSPENDED" }
      - { name: certified_at, type: datetime, source: system, description: "Logical-clock instant of the most recent transition into CERTIFIED; null while PROVISIONAL" }
      - { name: units_received_count, type: integer, source: computed, default: 0, description: "Units delivered to this facility across all pickup orders" }
      - { name: units_processed_count, type: integer, source: computed, default: 0, description: "Units accepted at inspection (denominator basis of diversion_rate_pct)" }
      - { name: units_rejected_count, type: integer, source: computed, default: 0, description: "Units rejected at inspection (contamination or infestation)" }
      - { name: verified_output_weight_kg, type: number, source: computed, default: 0, description: "= sum(CommodityOutputRecord.output_weight_kg) over this recycler's records with record_status == VERIFIED" }
      - { name: diversion_rate_pct, type: number, source: computed, default: 0, description: "Output of calculations.recycler_diversion_rate, 2 decimal places; gates recertification" }

  - name: PickupOrder
    parent: null
    common_fields: true
    fields:
      - { name: collection_site_id, type: string, source: input, description: "FK -> CollectionSite.id" }
      - { name: hauler_id, type: string, source: system, description: "FK -> Hauler.id; supplied explicitly in the request or chosen by calculations.hauler_selection when omitted" }
      - { name: recycler_id, type: string, source: input, description: "FK -> Recycler.id" }
      - { name: units_manifested, type: integer, source: input, description: "Units loaded out of the site's on-hand stock", constraints: ">= 1" }
      - { name: units_delivered, type: integer, source: computed, description: "Units the hauler delivered to the recycler; null before DELIVERED" }
      - { name: units_accepted, type: integer, source: computed, description: "Units accepted by the recycler after inspection; null before inspection" }
      - { name: route_distance_km, type: number, source: input, description: "Route distance used by calculations.hauler_route_payment", constraints: "> 0" }
      - { name: pickup_window_start, type: datetime, source: input, description: "Inclusive start of the agreed pickup window" }
      - { name: pickup_window_end, type: datetime, source: input, description: "Inclusive end of the agreed pickup window", constraints: "> pickup_window_start" }
      - { name: fulfillment_status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED -> PICKED_UP -> DELIVERED -> CLOSED, or -> CANCELLED (void / site suspension)", constraints: "SCHEDULED | PICKED_UP | DELIVERED | CLOSED | CANCELLED" }
      - { name: settlement_status, type: enum, source: system, default: "UNSETTLED", description: "Independent axis: UNSETTLED -> ESTIMATED -> {FINALIZED | DISPUTED -> FINALIZED}, or UNSETTLED -> VOIDED", constraints: "UNSETTLED | ESTIMATED | DISPUTED | FINALIZED | VOIDED" }
      - { name: estimated_payment_cents, type: integer, source: computed, description: "ROUTE_ESTIMATE variant of calculations.hauler_route_payment, stamped at DELIVERED; null before" }
      - { name: final_payment_cents, type: integer, source: computed, description: "FINAL_SETTLEMENT variant of calculations.hauler_route_payment, stamped at settlement_status == FINALIZED; null before" }
      - { name: hauler_auto_selected, type: boolean, source: computed, default: false, description: "true when hauler_id was resolved by calculations.hauler_selection rather than supplied in the request" }

  - name: LoadInspection
    parent: null
    common_fields: false      # append-only inspection event: id + created_at only
    fields:
      - { name: pickup_order_id, type: string, source: system, description: "FK -> PickupOrder.id; the inspecting recycler is pickup_order.recycler_id" }
      - { name: contaminated_unit_count, type: integer, source: input, description: "Units found wet, soiled or otherwise unprocessable", constraints: ">= 0" }
      - { name: infestation_finding, type: enum, source: input, description: "NONE | BED_BUG | MOLD — any value other than NONE forces FULL_REJECT and quarantines the source site", constraints: "NONE | BED_BUG | MOLD" }
      - { name: contamination_pct, type: number, source: computed, description: "= round_half_up(contaminated_unit_count / pickup_order.units_delivered * 100, 2)" }
      - { name: disposition, type: enum, source: computed, description: "PARTIAL_ACCEPT | FULL_REJECT (see calculations.load_inspection_disposition)", constraints: "PARTIAL_ACCEPT | FULL_REJECT" }
      - { name: units_accepted, type: integer, source: computed, description: "0 on FULL_REJECT; units_delivered - contaminated_unit_count on PARTIAL_ACCEPT" }
      - { name: rejection_reason, type: enum, source: computed, description: "INFESTATION | CONTAMINATION_THRESHOLD; null when disposition == PARTIAL_ACCEPT", constraints: "INFESTATION | CONTAMINATION_THRESHOLD" }
      - { name: inspected_by_user_id, type: string, source: system, description: "X-User-ID of the Recycler role that recorded the inspection" }

  - name: CommodityOutputRecord
    parent: null
    common_fields: true
    fields:
      - { name: recycler_id, type: string, source: system, description: "FK -> Recycler.id" }
      - { name: commodity, type: enum, source: input, description: "STEEL | FOAM | FIBER | WOOD", constraints: "STEEL | FOAM | FIBER | WOOD" }
      - { name: output_weight_kg, type: number, source: input, description: "Outbound weight of the commodity stream", constraints: "> 0" }
      - { name: source_period_month, type: string, source: input, description: "Processing month the output is attributed to, as YYYY-MM", constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$" }
      - { name: record_status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED -> VERIFIED; only VERIFIED weight enters diversion_rate_pct", constraints: "SUBMITTED | VERIFIED" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifying ProgramAuditor; null while SUBMITTED" }

  - name: TakeBackDelivery
    parent: null
    common_fields: true
    fields:
      - { name: registrant_id, type: string, source: input, description: "FK -> Registrant.id" }
      - { name: collection_site_id, type: string, source: input, description: "FK -> CollectionSite.id; the site that receives the taken-back units" }
      - { name: delivery_reference, type: string, source: input, description: "Retailer delivery ticket reference; unique per registrant_id" }
      - { name: units_delivered_new, type: integer, source: input, description: "New units delivered to the customer, i.e. the size of the take-back obligation", constraints: ">= 1" }
      - { name: units_takeback_offered, type: integer, source: input, description: "Units the retailer offered to remove; must be >= units_delivered_new", constraints: ">= 0" }
      - { name: units_takeback_collected, type: integer, source: computed, description: "Units actually removed and delivered to the collection site; null while SCHEDULED" }
      - { name: waiver_reference, type: string, source: system, description: "Customer declination reference recorded by the waive action; null unless status == WAIVED" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED -> OBLIGATION_MET | OBLIGATION_BREACHED | WAIVED", constraints: "SCHEDULED | OBLIGATION_MET | OBLIGATION_BREACHED | WAIVED" }
      - { name: breach_units, type: integer, source: computed, default: 0, description: "= max(0, units_delivered_new - units_takeback_collected) on completion" }
      - { name: breach_penalty_cents, type: integer, source: computed, default: 0, description: "= breach_units * 2500 (TAKEBACK_BREACH_PENALTY_CENTS), charged to the registrant" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: FeeRateSchedule
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /fee-rate-schedules/{id}/approve"
        actor: ProgramAdministrator
        preconditions:
          - "status == PROPOSED"
          - "X-User-ID != proposed_by_user_id (segregation of duties)"
          - "If an ACTIVE schedule exists for (state_program_id, unit_class) and fee_cents_per_unit > that schedule's fee_cents_per_unit, then StateProgram.reserve_coverage_months < 3.00"
        side_effects:
          - "Sets approved_by_user_id = X-User-ID"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /fee-rate-schedules/{id}/activate"
        actor: ProgramAdministrator
        preconditions:
          - "status == APPROVED"
          - "current_utc >= effective_from"
        side_effects:
          - "Any schedule for the same (state_program_id, unit_class) with status == ACTIVE transitions to SUPERSEDED and has effective_to set to this schedule's effective_from"
          - "Recomputes StateProgram.recommended_rate_cents and StateProgram.reserve_coverage_months"
          - "Increments StateProgram.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (cascade of a successor schedule's APPROVED -> ACTIVE transition for the same state_program_id + unit_class)"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "Sets effective_to = successor.effective_from when effective_to is null; leaves an explicitly proposed effective_to unchanged (half-open interval [effective_from, effective_to))"
        note: "A SUPERSEDED schedule remains the rate of record for dates inside its own interval — see calculations.applicable_rate_lookup."

  - entity: SalesRemittance
    initial_state: DRAFT
    terminal_states: [AUDIT_CLOSED, REFUNDED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /sales-remittances/{id}/file"
        actor: Registrant
        preconditions:
          - "status == DRAFT"
          - "Registrant.compliance_status != SUSPENDED"
          - "An applicable FeeRateSchedule (status IN {ACTIVE, SUPERSEDED}) covers period_start and period_end for every unit_class with units_sold_* > 0"
        side_effects:
          - "Sets filed_at = current_utc and early_filing_qualified per calculations.remittance_fee_assessment"
          - "Stamps fee_self_assessed_cents (SELF_ASSESSED variant of calculations.remittance_fee_assessment)"
      - from: FILED
        to: PAID
        trigger: "POST /sales-remittances/{id}/pay"
        actor: Registrant
        preconditions:
          - "status == FILED"
          - "amount_cents == fee_self_assessed_cents"
        side_effects:
          - "Sets fee_paid_cents = amount_cents"
          - "Recomputes StateProgram.fee_collected_cents and StateProgram.reserve_balance_cents (calculations.program_ledger_reconciliation)"
          - "Recomputes StateProgram.reserve_coverage_months and StateProgram.recommended_rate_cents"
      - from: PAID
        to: REFUNDED
        trigger: "POST /sales-remittances/{id}/refund"
        actor: ProgramAdministrator
        preconditions:
          - "status == PAID"
          - "StateProgram.enforcement_posture == NORMAL"
          - "amount_cents <= fee_paid_cents - fee_refunded_cents"
        side_effects:
          - "Sets fee_refunded_cents += amount_cents"
          - "Recomputes StateProgram.fee_collected_cents and StateProgram.reserve_balance_cents (compensating action of the pay transition; calculations.program_ledger_reconciliation)"
          - "Recomputes StateProgram.reserve_coverage_months and StateProgram.recommended_rate_cents"
      - from: PAID
        to: UNDER_AUDIT
        trigger: "POST /sales-remittances/{id}/audit-open"
        actor: ProgramAuditor
        preconditions:
          - "status == PAID"
        side_effects:
          - "Sets audit_opened_by_user_id = X-User-ID"
      - from: UNDER_AUDIT
        to: AMENDMENT_REQUIRED
        trigger: "POST /sales-remittances/{id}/request-amendment"
        actor: ProgramAuditor
        preconditions:
          - "status == UNDER_AUDIT"
          - "amendment_round < 2"
        side_effects:
          - "Sets amendment_requested_by_user_id = X-User-ID"
      - from: AMENDMENT_REQUIRED
        to: UNDER_AUDIT
        trigger: "POST /sales-remittances/{id}/amendments"
        actor: Registrant
        preconditions:
          - "status == AMENDMENT_REQUIRED"
          - "amendment_round < 2"
          - "expected_remittance_version == this.version"
        side_effects:
          - "Increments amendment_round by 1"
          - "Increments this.version by 1"
          - "Creates a new SalesRemittance row in DRAFT with amends_remittance_id = this.id, same registrant_id / state_program_id / period_code and the revised units_sold_* figures"
        note: "Cycle: UNDER_AUDIT -> AMENDMENT_REQUIRED -> UNDER_AUDIT, at most twice (amendment_round <= 2)."
      - from: UNDER_AUDIT
        to: AUDIT_CLOSED
        trigger: "POST /sales-remittances/{id}/audit-close"
        actor: ProgramAuditor
        preconditions:
          - "status == UNDER_AUDIT"
          - "No ExemptionClaim of this remittance has status == PENDING"
          - "X-User-ID != amendment_requested_by_user_id when amendment_requested_by_user_id is not null (segregation of duties)"
        side_effects:
          - "Stamps fee_reconciled_cents (AUDIT_RECONCILED variant of calculations.remittance_fee_assessment)"
          - "Stamps balance_due_cents = max(0, fee_reconciled_cents - (fee_paid_cents - fee_refunded_cents))"
          - "CASCADE hop 2 — because balance_due_cents > 0: Registrant.delinquent_balance_cents += balance_due_cents and Registrant.compliance_status becomes DELINQUENT (or SUSPENDED at >= 1000000)"
          - "CASCADE hop 3 — because that Registrant is now DELINQUENT/SUSPENDED: StateProgram.delinquent_registrant_count += 1 and StateProgram.receivable_cents += balance_due_cents"
          - "CASCADE hop 4 — because delinquent_registrant_count >= StateProgram.delinquency_alert_threshold: StateProgram.enforcement_posture becomes ELEVATED, which blocks further PAID -> REFUNDED transitions in this program"

  - entity: ExemptionClaim
    initial_state: PENDING
    terminal_states: [SUBSTANTIATED, DISALLOWED]
    transitions:
      - from: PENDING
        to: SUBSTANTIATED
        trigger: "POST /exemption-claims/{id}/adjudicate with decision == SUBSTANTIATE"
        actor: ProgramAuditor
        preconditions:
          - "status == PENDING"
          - "SalesRemittance.status == UNDER_AUDIT"
          - "documentation_reference is not null"
        side_effects:
          - "Sets adjudicated_by_user_id = X-User-ID"
      - from: PENDING
        to: DISALLOWED
        trigger: "POST /exemption-claims/{id}/adjudicate with decision == DISALLOW"
        actor: ProgramAuditor
        preconditions:
          - "status == PENDING"
          - "SalesRemittance.status == UNDER_AUDIT"
        side_effects:
          - "Sets adjudicated_by_user_id = X-User-ID and disallow_reason from the request"
          - "Marks the parent remittance's early-filing discount forfeit for the AUDIT_RECONCILED variant (see calculations.remittance_fee_assessment)"
        note: "Branching fork: SUBSTANTIATE and DISALLOW carry different side-effect sets and different downstream fee arithmetic."

  - entity: CollectionSite
    initial_state: APPLIED
    terminal_states: []
    transitions:
      - from: APPLIED
        to: ENROLLED
        trigger: "POST /collection-sites/{id}/enroll"
        actor: ProgramAdministrator
        preconditions:
          - "enrollment_status == APPLIED"
        side_effects:
          - "Increments StateProgram.enrolled_site_count by 1"
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /collection-sites/{id}/suspend"
        actor: ProgramAdministrator
        preconditions:
          - "enrollment_status == ENROLLED"
        side_effects:
          - "Sets suspended_at = current_utc"
          - "Decrements StateProgram.enrolled_site_count by 1"
          - "Every PickupOrder of this site with fulfillment_status IN {SCHEDULED, PICKED_UP} becomes fulfillment_status CANCELLED / settlement_status VOIDED, and its units_manifested move from units_in_transit back to units_on_hand"
      - from: ENROLLED
        to: SUSPENDED
        trigger: "system (cascade of a FULL_REJECT LoadInspection that raises contamination_strike_count to 3)"
        actor: system
        preconditions:
          - "enrollment_status == ENROLLED"
          - "contamination_strike_count >= 3"
        side_effects:
          - "Sets suspended_at = current_utc"
          - "Decrements StateProgram.enrolled_site_count by 1"
          - "Every PickupOrder of this site with fulfillment_status IN {SCHEDULED, PICKED_UP} becomes fulfillment_status CANCELLED / settlement_status VOIDED, and its units_manifested move from units_in_transit back to units_on_hand"
        note: "Automatic arm of the same transition; the strike threshold is evaluated after the inspection's own side effects are applied."
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /collection-sites/{id}/reinstate"
        actor: ProgramAdministrator
        preconditions:
          - "enrollment_status == SUSPENDED"
          - "current_utc >= infestation_quarantine_until, or infestation_quarantine_until is null"
        side_effects:
          - "Resets contamination_strike_count to 0"
          - "Increments StateProgram.enrolled_site_count by 1"
        note: "Cycle ENROLLED -> SUSPENDED -> ENROLLED; the strike counter restarts on reinstatement."

  - entity: VolumeReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /volume-reports/{id}/accept"
        actor: ProgramAdministrator
        preconditions:
          - "status == SUBMITTED"
          - "CollectionSite.enrollment_status == ENROLLED"
        side_effects:
          - "Stamps credited_units and credit_cents (calculations.site_volume_credit) and accepted_at = current_utc"
          - "CollectionSite.units_on_hand += credited_units and CollectionSite.units_reported_total += credited_units"
          - "StateProgram.site_credit_paid_cents += credit_cents, then StateProgram.reserve_balance_cents, reserve_coverage_months, recommended_rate_cents and reported_units_total are recomputed"

  - entity: Recycler
    initial_state: PROVISIONAL
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /recyclers/{id}/certify"
        actor: ProgramAdministrator
        preconditions:
          - "certification_status == PROVISIONAL"
        side_effects:
          - "Sets certified_at = current_utc"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /recyclers/{id}/suspend-certification"
        actor: ProgramAdministrator
        preconditions:
          - "certification_status == CERTIFIED"
        side_effects:
          - "Sets certified_at = null; new PickupOrder rows naming this recycler are rejected while SUSPENDED"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /recyclers/{id}/recertify"
        actor: ProgramAdministrator
        preconditions:
          - "certification_status == SUSPENDED"
          - "diversion_rate_pct >= 75.00 (calculations.recycler_diversion_rate)"
        side_effects:
          - "Sets certified_at = current_utc"
        note: "Cycle CERTIFIED -> SUSPENDED -> CERTIFIED, gated on the verified commodity-output diversion rate."

  - entity: PickupOrder
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PICKED_UP
        trigger: "POST /pickup-orders/{id}/pickup-confirm"
        actor: Hauler
        preconditions:
          - "fulfillment_status == SCHEDULED"
          - "X-User-ID == hauler_id"
        side_effects:
          - "No unit movement: units remain in CollectionSite.units_in_transit"
      - from: PICKED_UP
        to: DELIVERED
        trigger: "POST /pickup-orders/{id}/deliver"
        actor: Hauler
        preconditions:
          - "fulfillment_status == PICKED_UP"
          - "units_delivered <= units_manifested"
        side_effects:
          - "Sets units_delivered"
          - "CollectionSite.units_in_transit -= units_manifested; units_at_recycler_count += units_delivered; units_written_off_count += (units_manifested - units_delivered)"
          - "Recycler.units_received_count += units_delivered"
          - "Advances settlement_status UNSETTLED -> ESTIMATED and stamps estimated_payment_cents (ROUTE_ESTIMATE variant of calculations.hauler_route_payment)"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /pickup-orders/{id}/finalize-settlement"
        actor: ProgramAdministrator
        preconditions:
          - "fulfillment_status == DELIVERED"
          - "settlement_status IN {ESTIMATED, DISPUTED}"
          - "A LoadInspection exists for this pickup order"
        side_effects:
          - "Advances settlement_status to FINALIZED and stamps final_payment_cents (FINAL_SETTLEMENT variant of calculations.hauler_route_payment)"
          - "Hauler.total_paid_cents += final_payment_cents"
          - "StateProgram.hauler_payment_paid_cents += final_payment_cents, then reserve_balance_cents, reserve_coverage_months and recommended_rate_cents are recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pickup-orders/{id}/void"
        actor: CollectionSiteOperator
        preconditions:
          - "fulfillment_status == SCHEDULED"
          - "settlement_status == UNSETTLED"
        side_effects:
          - "Advances settlement_status to VOIDED"
          - "CollectionSite.units_in_transit -= units_manifested and CollectionSite.units_on_hand += units_manifested (compensating action of order creation; conserves calculations.site_unit_custody_conservation)"
          - "Decrements Hauler.active_route_count by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade of the owning CollectionSite entering SUSPENDED)"
        actor: system
        preconditions:
          - "fulfillment_status IN {SCHEDULED, PICKED_UP}"
        side_effects:
          - "Advances settlement_status to VOIDED"
          - "CollectionSite.units_in_transit -= units_manifested and CollectionSite.units_on_hand += units_manifested"
          - "Decrements Hauler.active_route_count by 1"
      - from: PICKED_UP
        to: CANCELLED
        trigger: "system (cascade of the owning CollectionSite entering SUSPENDED)"
        actor: system
        preconditions:
          - "fulfillment_status == PICKED_UP"
        side_effects:
          - "Advances settlement_status to VOIDED"
          - "CollectionSite.units_in_transit -= units_manifested and CollectionSite.units_on_hand += units_manifested"
          - "Decrements Hauler.active_route_count by 1"
    note: |
      Parallel dimensions. fulfillment_status (SCHEDULED -> PICKED_UP -> DELIVERED -> CLOSED | CANCELLED)
      and settlement_status (UNSETTLED -> ESTIMATED -> {FINALIZED | DISPUTED -> FINALIZED} | VOIDED) advance
      independently on the same row: recording an inspection moves settlement_status ESTIMATED -> DISPUTED while
      fulfillment_status stays DELIVERED, and finalize-settlement moves both axes in one call.

  - entity: LoadInspection
    initial_state: RECORDED
    terminal_states: [RECORDED]
    transitions:
      - from: (none)
        to: RECORDED
        trigger: "POST /pickup-orders/{id}/inspections"
        actor: Recycler
        preconditions:
          - "PickupOrder.fulfillment_status == DELIVERED"
          - "PickupOrder.settlement_status == ESTIMATED"
          - "No LoadInspection already exists for this pickup order"
          - "X-User-ID == PickupOrder.recycler_id"
          - "contaminated_unit_count <= PickupOrder.units_delivered"
        side_effects:
          - "Stamps contamination_pct, disposition, units_accepted and rejection_reason (calculations.load_inspection_disposition)"
          - "Sets PickupOrder.units_accepted = this.units_accepted"
          - "Recycler.units_processed_count += units_accepted; Recycler.units_rejected_count += (units_delivered - units_accepted); Recycler.diversion_rate_pct recomputed"
          - "CollectionSite.units_at_recycler_count -= PickupOrder.units_delivered; units_recycled_count += units_accepted; units_written_off_count += (units_delivered - units_accepted)"
          - "CASCADE hop 1 (FULL_REJECT only) — PickupOrder.settlement_status ESTIMATED -> DISPUTED"
          - "CASCADE hop 2 (FULL_REJECT only) — because the load was rejected: CollectionSite.contamination_strike_count += 1, and when rejection_reason == INFESTATION also CollectionSite.infestation_quarantine_until = current_utc + 14 days"
          - "CASCADE hop 3 — because contamination_strike_count reached 3: CollectionSite.enrollment_status ENROLLED -> SUSPENDED with suspended_at = current_utc"
          - "CASCADE hop 4 — because the site was suspended: StateProgram.enrolled_site_count -= 1 and every other PickupOrder of that site in {SCHEDULED, PICKED_UP} becomes CANCELLED/VOIDED with its units_manifested returned from units_in_transit to units_on_hand"

  - entity: TakeBackDelivery
    initial_state: SCHEDULED
    terminal_states: [OBLIGATION_MET, OBLIGATION_BREACHED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: OBLIGATION_MET
        trigger: "POST /take-back-deliveries/{id}/complete-takeback with units_takeback_collected >= units_delivered_new"
        actor: Registrant
        preconditions:
          - "status == SCHEDULED"
          - "CollectionSite.enrollment_status == ENROLLED"
          - "units_takeback_collected <= units_takeback_offered"
        side_effects:
          - "Sets units_takeback_collected, breach_units = 0, breach_penalty_cents = 0"
          - "CollectionSite.units_on_hand += units_takeback_collected and CollectionSite.units_reported_total += units_takeback_collected"
          - "StateProgram.reported_units_total recomputed"
      - from: SCHEDULED
        to: OBLIGATION_BREACHED
        trigger: "POST /take-back-deliveries/{id}/complete-takeback with units_takeback_collected < units_delivered_new"
        actor: Registrant
        preconditions:
          - "status == SCHEDULED"
          - "CollectionSite.enrollment_status == ENROLLED"
          - "units_takeback_collected <= units_takeback_offered"
        side_effects:
          - "Sets units_takeback_collected, breach_units = units_delivered_new - units_takeback_collected, breach_penalty_cents = breach_units * 2500"
          - "CollectionSite.units_on_hand += units_takeback_collected and CollectionSite.units_reported_total += units_takeback_collected"
          - "Registrant.takeback_breach_count += 1 and Registrant.delinquent_balance_cents += breach_penalty_cents; Registrant.compliance_status becomes DELINQUENT when delinquent_balance_cents > 0"
          - "StateProgram.reported_units_total recomputed"
        note: "Branch of the same trigger: the collected-vs-obligated comparison selects the target state and a divergent side-effect set."
      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /take-back-deliveries/{id}/waive"
        actor: Registrant
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "Sets waiver_reference from the request; units_takeback_collected = 0, breach_units = 0, breach_penalty_cents = 0"
          - "No unit movement and no penalty: a documented customer declination discharges the obligation"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: rate-schedule-create-stale-program
    parent_entity: StateProgram
    write_endpoint: "POST /fee-rate-schedules"
    occ_field: "expected_state_program_version"
    description: |
      Creating a FeeRateSchedule proposal against a StateProgram whose version has advanced since the
      client last observed it is rejected. A proposal snapshots recommended_rate_cents and the accepted
      band from the program's forecast + reserve state, and a newly activated schedule (which
      legitimately supersedes the prior rate) or a settled remittance payment moves that state; a
      proposal written from a stale program view would be banded against arithmetic that no longer holds.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: amendment-create-stale-remittance
    parent_entity: SalesRemittance
    write_endpoint: "POST /sales-remittances/{id}/amendments"
    occ_field: "expected_remittance_version"
    description: |
      Submitting an amendment against a SalesRemittance whose version has advanced since the client last
      observed it is rejected. Each accepted amendment legitimately supersedes the registrant's prior
      revised figures and bumps amendment_round, so a submission written from a stale remittance view
      would silently consume one of the two permitted amendment rounds against the wrong baseline.
    error_id: ERR_STALE_REMITTANCE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: applicable_rate_lookup
    trigger: "Whenever a fee rate for a (state_program_id, unit_class, as_of_date) triple is required — inside remittance_fee_assessment for both variants"
    algorithm: interval_merge
    formula: |
      candidates = FeeRateSchedule rows where
          state_program_id == program.id
          AND unit_class == cls
          AND status IN {ACTIVE, SUPERSEDED}
          AND effective_from <= as_of_date
          AND (effective_to IS NULL OR as_of_date < effective_to)     # half-open [from, to)
      if candidates is empty: raise ERR_NO_APPLICABLE_RATE
      # Non-overlap is enforced at proposal time, so candidates holds exactly one row;
      # if more than one ever matched, order by effective_from DESC, then created_at DESC, and take the first.
      return candidates[0].fee_cents_per_unit
    input_set: "FeeRateSchedule rows with status IN {ACTIVE, SUPERSEDED}; PROPOSED and APPROVED schedules are never rate of record"
    constants: {}
    precision: "integer cents"

  - name: remittance_fee_assessment
    trigger: "SalesRemittance DRAFT -> FILED (SELF_ASSESSED variant, stamps fee_self_assessed_cents) and SalesRemittance UNDER_AUDIT -> AUDIT_CLOSED (AUDIT_RECONCILED variant, stamps fee_reconciled_cents)"
    algorithm: chronological
    formula: |
      # Line order is PINNED: FOUNDATION first, then MATTRESS. Rounding order is PINNED:
      # round the per-line discount to whole cents, subtract it inside the line, THEN sum the lines.
      # (Summing gross first and rounding one aggregate discount is explicitly NOT the rule and can
      #  differ by 1 cent per pair of half-cent lines.)
      early = (filed_at <= period_end + 20 days)
      discount_pct =
          0.015  if early AND discount_not_forfeited
          0.000  otherwise
      fee = 0
      for cls in [FOUNDATION, MATTRESS]:                       # PINNED order
          units_sold_cls   = units_sold_foundation if cls == FOUNDATION else units_sold_mattress
          credited_exempt  = sum(ExemptionClaim.units
                                 where remittance_id == this.id
                                   AND unit_class == cls
                                   AND status IN INCLUSION_SET)          # variant-dependent
          chargeable       = max(0, units_sold_cls - credited_exempt)
          rate             = applicable_rate_lookup(program, cls, RATE_DATE)   # variant-dependent
          gross_cents      = chargeable * rate
          discount_cents   = round_half_up(gross_cents * discount_pct)   # per-line rounding
          fee             += gross_cents - discount_cents                # then sum
      return fee
    input_set: "The remittance's own units_sold_* plus its ExemptionClaim rows; the inclusion set of claim statuses and the rate date differ per variant"
    constants:
      EARLY_FILING_DISCOUNT_PCT: 0.015
      EARLY_FILING_WINDOW_DAYS: 20
      FILING_DUE_WINDOW_DAYS: 45
      LINE_ORDER: "[FOUNDATION, MATTRESS]"
    precision: "whole cents, round_half_up, applied per line item before summation"
    variants:
      - name: SELF_ASSESSED
        when: "Stamped at DRAFT -> FILED into fee_self_assessed_cents"
        difference: "RATE_DATE = period_start; INCLUSION_SET = {PENDING, SUBSTANTIATED} (claims count as filed); discount_not_forfeited = true"
      - name: AUDIT_RECONCILED
        when: "Stamped at UNDER_AUDIT -> AUDIT_CLOSED into fee_reconciled_cents"
        difference: "RATE_DATE = period_end (a mid-period rate change therefore prices the whole period at the later rate); INCLUSION_SET = {SUBSTANTIATED} only; discount_not_forfeited = false when any ExemptionClaim of this remittance has status == DISALLOWED"

  - name: fee_rate_recommendation
    trigger: "Recomputed into StateProgram.recommended_rate_cents on POST /state-programs, PATCH /state-programs/{id}/cost-forecast, SalesRemittance pay/refund, FeeRateSchedule APPROVED -> ACTIVE, VolumeReport SUBMITTED -> ACCEPTED and PickupOrder DELIVERED -> CLOSED; read by GET /state-programs/{id}/fee-adequacy and snapshotted into FeeRateSchedule.recommended_rate_cents_at_proposal"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED because the admin surcharge tier is keyed on the pre-surcharge rate
      # while the surcharge is itself part of the rate being set. Steps run exactly 1..7, once.
      1. reserve_target_cents = round_half_up(forecast_annual_cost_cents * reserve_target_months / 12)
      2. reserve_gap_cents    = max(0, reserve_target_cents - reserve_balance_cents)
      3. recoverable_cents    = forecast_annual_cost_cents
                                + round_half_up(reserve_gap_cents / RESERVE_AMORTIZATION_YEARS)
                                - forecast_other_revenue_cents
      4. base_rate_cents      = ceil(recoverable_cents / forecast_annual_units)
      5. admin_surcharge_pct  = 0.06 if base_rate_cents <= 800
                                0.04 if 801 <= base_rate_cents <= 1600
                                0.02 if base_rate_cents >= 1601
                                # PINNED: the tier is selected from base_rate_cents, NOT from the
                                # surcharged result, and is never re-selected after step 6.
      6. recommended_rate_cents = base_rate_cents + round_half_up(base_rate_cents * admin_surcharge_pct)
      7. band_low_cents  = floor(recommended_rate_cents * 0.80)
         band_high_cents = ceil(recommended_rate_cents  * 1.20)
    input_set: "The program's own forecast fields plus reserve_balance_cents as computed by program_ledger_reconciliation at the moment of the trigger"
    constants:
      RESERVE_AMORTIZATION_YEARS: 2
      SURCHARGE_TIER_LOW_MAX_CENTS: 800
      SURCHARGE_TIER_MID_MAX_CENTS: 1600
      SURCHARGE_PCT_LOW_TIER: 0.06
      SURCHARGE_PCT_MID_TIER: 0.04
      SURCHARGE_PCT_HIGH_TIER: 0.02
      BAND_LOW_MULTIPLIER: 0.80
      BAND_HIGH_MULTIPLIER: 1.20
    precision: "integer cents; round_half_up inside steps 1/3/6, ceil in step 4, floor/ceil in step 7"

  - name: reserve_coverage_months
    trigger: "Recomputed into StateProgram.reserve_coverage_months on every mutation of reserve_balance_cents or forecast_annual_cost_cents; read as the approval gate of FeeRateSchedule PROPOSED -> APPROVED"
    algorithm: threshold
    formula: |
      monthly_cost_cents      = round_half_up(forecast_annual_cost_cents / 12)
      reserve_coverage_months = round_half_up(reserve_balance_cents / monthly_cost_cents, 2)
      # Approval gate: a schedule whose fee_cents_per_unit is GREATER than the current ACTIVE rate for
      # (state_program_id, unit_class) may be approved only while
      #     reserve_coverage_months < RATE_INCREASE_COVERAGE_CEILING_MONTHS
      # i.e. exactly 3.00 is already too well funded and is rejected (strict <, not <=).
    input_set: "StateProgram.reserve_balance_cents and forecast_annual_cost_cents only"
    constants:
      RATE_INCREASE_COVERAGE_CEILING_MONTHS: 3.00
    precision: "2 decimal places, round_half_up — the rounded value is what the gate compares, so 14999999 cents against a 5000000-cent monthly cost rounds to 3.00 and is rejected"

  - name: program_ledger_reconciliation
    trigger: "Recomputed on SalesRemittance FILED -> PAID and PAID -> REFUNDED, VolumeReport SUBMITTED -> ACCEPTED, and PickupOrder DELIVERED -> CLOSED"
    algorithm: aggregation
    formula: |
      fee_collected_cents       = sum(SalesRemittance.fee_paid_cents)
                                  - sum(SalesRemittance.fee_refunded_cents)
                                  over SalesRemittance rows with state_program_id == program.id
                                  and status IN {PAID, UNDER_AUDIT, AMENDMENT_REQUIRED, AUDIT_CLOSED, REFUNDED}
      site_credit_paid_cents    = sum(VolumeReport.credit_cents) over reports with status == ACCEPTED
                                  whose collection_site_id belongs to this program
      hauler_payment_paid_cents = sum(PickupOrder.final_payment_cents) over orders with
                                  settlement_status == FINALIZED whose collection_site_id belongs to this program
      reserve_balance_cents     = reserve_opening_cents + fee_collected_cents
                                  - site_credit_paid_cents - hauler_payment_paid_cents
      # INVARIANT (money): for any forward action and its compensating action (pay/refund of the same
      # amount), reserve_balance_cents and fee_collected_cents return to their pre-action values exactly.
    input_set: "Remittances of this program in {PAID, UNDER_AUDIT, AMENDMENT_REQUIRED, AUDIT_CLOSED, REFUNDED}; ACCEPTED volume reports of this program's sites; FINALIZED pickup orders of this program's sites. DRAFT and FILED remittances and SUBMITTED reports are excluded."
    constants: {}
    precision: "integer cents; no rounding — all inputs are already whole cents"

  - name: site_volume_credit
    trigger: "VolumeReport SUBMITTED -> ACCEPTED (stamps VolumeReport.credited_units and VolumeReport.credit_cents)"
    algorithm: threshold
    formula: |
      credited_units   = units_mattress + units_foundation
      volume_bonus_pct = 0.05 if credited_units >= StateProgram.volume_bonus_threshold_units else 0.00
      credit_cents     = round_half_up(credited_units
                                       * StateProgram.site_credit_cents_per_unit
                                       * (1 + volume_bonus_pct))
      # credited_units == 0 is legal: credit_cents == 0, no bonus, and the report still reaches ACCEPTED.
    input_set: "The report's own two unit counts plus the owning program's site_credit_cents_per_unit and volume_bonus_threshold_units"
    constants:
      VOLUME_BONUS_PCT: 0.05
    precision: "whole cents, round_half_up applied once to the bonus-multiplied product"

  - name: hauler_selection
    trigger: "POST /pickup-orders when hauler_id is omitted from the request body"
    algorithm: weighted_scoring
    formula: |
      eligible = Hauler rows where
          state_program_id == CollectionSite.state_program_id
          AND CollectionSite.region_code IN service_regions
          AND buffer_conflicting_route_count(hauler, requested_window) < hauler.max_concurrent_routes
      if eligible is empty: raise ERR_NO_ELIGIBLE_HAULER
      rank by: per_unit_rate_cents ASC,
               then active_route_count ASC,
               then created_at ASC            # final tie-break; `id` is never a decision input
      return eligible[0]
      # buffer_conflicting_route_count is defined in hauler_window_conflict below.
    input_set: "Hauler rows of the site's own program only; no status filter exists because haulers have no lifecycle state"
    constants: {}
    precision: "n/a — selector returns an entity reference"

  - name: hauler_window_conflict
    trigger: "POST /pickup-orders — evaluated for the resolved hauler (explicit hauler_id or selector output)"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals on both ends, plus a symmetric 60-minute turnaround buffer applied to the NEW
      # window only, and an AGGREGATE capacity test (not an exclusive-occupancy test).
      padded_start = requested.pickup_window_start - 60 minutes
      padded_end   = requested.pickup_window_end   + 60 minutes
      conflicting  = count of PickupOrder rows where
                        hauler_id == resolved_hauler.id
                        AND fulfillment_status IN {SCHEDULED, PICKED_UP, DELIVERED}
                        AND padded_start <= existing.pickup_window_end
                        AND existing.pickup_window_start <= padded_end
      if conflicting >= resolved_hauler.max_concurrent_routes: raise ERR_HAULER_WINDOW_CAPACITY_EXCEEDED
    input_set: "PickupOrder rows of the resolved hauler with fulfillment_status IN {SCHEDULED, PICKED_UP, DELIVERED}; CLOSED and CANCELLED orders never conflict"
    constants:
      TURNAROUND_BUFFER_MINUTES: 60
    precision: "minute-resolution timestamp comparison; touching endpoints DO conflict because both ends are inclusive"

  - name: rate_period_overlap
    trigger: "POST /fee-rate-schedules — evaluated against existing schedules for the same (state_program_id, unit_class)"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [effective_from, effective_to): abutment is legal, overlap is not.
      # A null effective_to is treated as +infinity.
      for each existing in FeeRateSchedule where state_program_id == req.state_program_id
                                             AND unit_class == req.unit_class
                                             AND status IN {PROPOSED, APPROVED, ACTIVE}:
          new_to      = req.effective_to  or +infinity
          exist_to    = existing.effective_to or +infinity
          overlaps    = (req.effective_from < exist_to) AND (existing.effective_from < new_to)
          if overlaps: raise ERR_RATE_PERIOD_OVERLAP
      # Consequence: a successor is proposed by abutting the predecessor's exclusive end —
      # req.effective_from == existing.effective_to is accepted, one instant earlier is not.
      # A second open-ended proposal for a pair that already holds an open-ended PROPOSED / APPROVED /
      # ACTIVE schedule always overlaps and is always rejected.
    input_set: "FeeRateSchedule rows of the same (state_program_id, unit_class) with status IN {PROPOSED, APPROVED, ACTIVE}; SUPERSEDED rows are historical and never conflict"
    constants: {}
    precision: "instant comparison; interval start inclusive, interval end exclusive"

  - name: hauler_route_payment
    trigger: "PickupOrder PICKED_UP -> DELIVERED (ROUTE_ESTIMATE variant, stamps estimated_payment_cents) and PickupOrder DELIVERED -> CLOSED (FINAL_SETTLEMENT variant, stamps final_payment_cents)"
    algorithm: tiered_pricing
    formula: |
      distance_cents  = round_half_up(route_distance_km * hauler.per_km_rate_cents)
      raw_cents       = billable_units * hauler.per_unit_rate_cents + distance_cents + STOP_FEE_CENTS
      capped_cents    = min(raw_cents, hauler.max_route_payment_cents)
      floored_cents   = max(capped_cents, MIN_ROUTE_PAYMENT_CENTS)
      handling_cents  = rejected_units * REJECT_HANDLING_CENTS       # FINAL_SETTLEMENT only
      payment_cents   = max(0, floored_cents - handling_cents)
      # The cap is applied BEFORE the floor and BEFORE the rejection deduction — a route that hits the
      # contractual cap still pays the full handling deduction out of the capped amount.
    input_set: "The order's own units and distance plus the resolved hauler's four rate fields; the billable-unit basis and the handling deduction differ per variant"
    constants:
      STOP_FEE_CENTS: 2500
      MIN_ROUTE_PAYMENT_CENTS: 4000
      REJECT_HANDLING_CENTS: 300
    precision: "whole cents, round_half_up on the distance component only"
    variants:
      - name: ROUTE_ESTIMATE
        when: "Stamped at PICKED_UP -> DELIVERED into estimated_payment_cents"
        difference: "billable_units = units_manifested (the manifest, not the scale ticket); rejected_units = 0 so handling_cents is 0"
      - name: FINAL_SETTLEMENT
        when: "Stamped at DELIVERED -> CLOSED into final_payment_cents"
        difference: "billable_units = units_accepted from the LoadInspection; rejected_units = units_delivered - units_accepted, so the handling deduction applies"

  - name: load_inspection_disposition
    trigger: "POST /pickup-orders/{id}/inspections (stamps LoadInspection.contamination_pct, disposition, units_accepted, rejection_reason)"
    algorithm: threshold
    formula: |
      contamination_pct = round_half_up(contaminated_unit_count / pickup_order.units_delivered * 100, 2)
      if infestation_finding != NONE:
          disposition = FULL_REJECT; rejection_reason = INFESTATION;             units_accepted = 0
      elif contamination_pct > MAX_CONTAMINATION_PCT:
          disposition = FULL_REJECT; rejection_reason = CONTAMINATION_THRESHOLD; units_accepted = 0
      else:
          disposition = PARTIAL_ACCEPT; rejection_reason = null
          units_accepted = pickup_order.units_delivered - contaminated_unit_count
      # STRICTLY greater-than: contamination_pct exactly 5.00 is a PARTIAL_ACCEPT, 5.01 is a FULL_REJECT.
      # The rounded 2-decimal value is compared, so 12/240 = 5.00 accepts and 13/240 = 5.42 rejects.
    input_set: "The inspection's own two inputs plus pickup_order.units_delivered"
    constants:
      MAX_CONTAMINATION_PCT: 5.00
      MAX_CONTAMINATION_STRIKES: 3
      INFESTATION_QUARANTINE_DAYS: 14
    precision: "contamination_pct at 2 decimal places, round_half_up, compared with strict >"

  - name: recycler_diversion_rate
    trigger: "Recomputed into Recycler.diversion_rate_pct on POST /pickup-orders/{id}/inspections and POST /commodity-output-records/{id}/verify; read as the gate of Recycler SUSPENDED -> CERTIFIED"
    algorithm: aggregation
    formula: |
      verified_output_weight_kg = sum(CommodityOutputRecord.output_weight_kg
                                     where recycler_id == this.id AND record_status == VERIFIED)
      basis_kg                  = units_processed_count * AVG_UNIT_WEIGHT_KG
      diversion_rate_pct        = 0.00 if basis_kg == 0
                                  else round_half_up(verified_output_weight_kg / basis_kg * 100, 2)
      # Recertification gate: diversion_rate_pct >= MIN_RECERTIFICATION_DIVERSION_PCT (inclusive).
    input_set: "VERIFIED CommodityOutputRecord rows only (SUBMITTED weight is excluded) over units_processed_count accepted units"
    constants:
      AVG_UNIT_WEIGHT_KG: 28.0
      MIN_RECERTIFICATION_DIVERSION_PCT: 75.00
    precision: "2 decimal places, round_half_up; compared with >= at the gate"

  - name: site_unit_custody_conservation
    trigger: "Recomputed after every unit-moving side effect: VolumeReport acceptance, PickupOrder creation / void / cascade cancellation / delivery, LoadInspection recording, TakeBackDelivery completion"
    algorithm: aggregation
    formula: |
      # INVARIANT (physical units) — must hold after every request, including compensations:
      units_reported_total == units_on_hand
                            + units_in_transit
                            + units_at_recycler_count
                            + units_recycled_count
                            + units_written_off_count
      # Bucket transfers, all exact and total-preserving:
      #   accept volume report      : + credited_units      -> units_on_hand      (and units_reported_total)
      #   complete take-back        : + units_collected     -> units_on_hand      (and units_reported_total)
      #   create pickup order       : units_on_hand         -> units_in_transit          (units_manifested)
      #   void / cascade-cancel     : units_in_transit      -> units_on_hand            (units_manifested)
      #   deliver                   : units_in_transit      -> units_at_recycler_count  (units_delivered)
      #                               remainder             -> units_written_off_count  (manifest shrinkage)
      #   inspect                   : units_at_recycler_count -> units_recycled_count   (units_accepted)
      #                               remainder               -> units_written_off_count (rejected units)
    input_set: "The five custody buckets of a single CollectionSite row"
    constants: {}
    precision: "integer units; every transfer moves whole units between buckets and never mints or destroys any"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 10, category: auth,   check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 20, category: auth,   check: "The acting role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 25, category: business_constraint, check: "Request body contains every required field with the declared type / enum membership / numeric constraint", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 26, category: business_constraint, check: "limit within 1..100 and offset >= 0", error_id: ERR_INVALID_PAGINATION, http_status: 400, applies_to: "all list endpoints" }
  - { priority: 30, category: existence, check: "Path and body resource references resolve, validated left-to-right in the path then in body-declaration order", error_id: "ERR_<ENTITY>_NOT_FOUND", http_status: 404, applies_to: all }
  - { priority: 34, category: auth,   check: "For entity_backed roles, X-User-ID equals the resource's own owning FK (Registrant -> registrant_id, CollectionSiteOperator -> collection_site_id, Hauler -> pickup_order.hauler_id, Recycler -> recycler_id / pickup_order.recycler_id)", error_id: ERR_FORBIDDEN_RESOURCE, http_status: 403, applies_to: "all Registrant / CollectionSiteOperator / Hauler / Recycler endpoints" }
  - { priority: 38, category: state,  check: "expected_state_program_version equals StateProgram.version", error_id: ERR_STALE_PROGRAM_VERSION, http_status: 412, applies_to: "POST /fee-rate-schedules" }
  - { priority: 39, category: state,  check: "expected_remittance_version equals SalesRemittance.version", error_id: ERR_STALE_REMITTANCE_VERSION, http_status: 412, applies_to: "POST /sales-remittances/{id}/amendments" }
  - { priority: 42, category: business_constraint, check: "Approver's X-User-ID differs from FeeRateSchedule.proposed_by_user_id; audit-closer's X-User-ID differs from SalesRemittance.amendment_requested_by_user_id when that field is set", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /fee-rate-schedules/{id}/approve, POST /sales-remittances/{id}/audit-close" }
  - { priority: 44, category: state,  check: "FeeRateSchedule.status == PROPOSED for approve; == APPROVED for activate", error_id: ERR_RATE_SCHEDULE_NOT_APPROVABLE, http_status: 409, applies_to: "POST /fee-rate-schedules/{id}/approve, POST /fee-rate-schedules/{id}/activate" }
  - { priority: 45, category: state,  check: "SalesRemittance.status == DRAFT", error_id: ERR_REMITTANCE_NOT_DRAFT, http_status: 409, applies_to: "POST /sales-remittances/{id}/file, POST /sales-remittances/{id}/exemption-claims" }
  - { priority: 46, category: state,  check: "SalesRemittance.status == FILED", error_id: ERR_REMITTANCE_NOT_PAYABLE, http_status: 409, applies_to: "POST /sales-remittances/{id}/pay" }
  - { priority: 47, category: state,  check: "SalesRemittance.status == PAID for audit-open and refund", error_id: ERR_REMITTANCE_NOT_PAID, http_status: 409, applies_to: "POST /sales-remittances/{id}/audit-open, POST /sales-remittances/{id}/refund" }
  - { priority: 48, category: state,  check: "SalesRemittance.status == UNDER_AUDIT for request-amendment and audit-close; == AMENDMENT_REQUIRED for amendments", error_id: ERR_REMITTANCE_NOT_UNDER_AUDIT, http_status: 409, applies_to: "POST /sales-remittances/{id}/request-amendment, POST /sales-remittances/{id}/audit-close, POST /sales-remittances/{id}/amendments" }
  - { priority: 49, category: state,  check: "No ExemptionClaim of the remittance is still PENDING", error_id: ERR_PENDING_EXEMPTION_CLAIMS, http_status: 409, applies_to: "POST /sales-remittances/{id}/audit-close" }
  - { priority: 50, category: state,  check: "ExemptionClaim.status == PENDING and its remittance is UNDER_AUDIT", error_id: ERR_CLAIM_ALREADY_ADJUDICATED, http_status: 409, applies_to: "POST /exemption-claims/{id}/adjudicate" }
  - { priority: 51, category: state,  check: "CollectionSite.enrollment_status == APPLIED for enroll; == ENROLLED for suspend; == SUSPENDED for reinstate", error_id: ERR_SITE_ENROLLMENT_STATE_INVALID, http_status: 409, applies_to: "POST /collection-sites/{id}/enroll, POST /collection-sites/{id}/suspend, POST /collection-sites/{id}/reinstate" }
  - { priority: 52, category: state,  check: "VolumeReport.status == SUBMITTED", error_id: ERR_VOLUME_REPORT_NOT_SUBMITTED, http_status: 409, applies_to: "POST /volume-reports/{id}/accept" }
  - { priority: 53, category: state,  check: "PickupOrder.fulfillment_status == SCHEDULED for pickup-confirm and void; == PICKED_UP for deliver; == DELIVERED for inspections and finalize-settlement", error_id: ERR_PICKUP_STATE_INVALID, http_status: 409, applies_to: "POST /pickup-orders/{id}/pickup-confirm, POST /pickup-orders/{id}/deliver, POST /pickup-orders/{id}/inspections, POST /pickup-orders/{id}/finalize-settlement, POST /pickup-orders/{id}/void" }
  - { priority: 54, category: state,  check: "Exactly zero LoadInspection rows exist for the pickup order before recording one; at least one exists before finalize-settlement", error_id: ERR_LOAD_ALREADY_INSPECTED, http_status: 409, applies_to: "POST /pickup-orders/{id}/inspections" }
  - { priority: 55, category: state,  check: "PickupOrder.settlement_status IN {ESTIMATED, DISPUTED} and a LoadInspection exists", error_id: ERR_SETTLEMENT_NOT_READY, http_status: 409, applies_to: "POST /pickup-orders/{id}/finalize-settlement" }
  - { priority: 56, category: state,  check: "Recycler.certification_status == PROVISIONAL for certify; == CERTIFIED for suspend-certification; == SUSPENDED for recertify", error_id: ERR_RECYCLER_CERT_STATE_INVALID, http_status: 409, applies_to: "POST /recyclers/{id}/certify, POST /recyclers/{id}/suspend-certification, POST /recyclers/{id}/recertify" }
  - { priority: 57, category: state,  check: "TakeBackDelivery.status == SCHEDULED", error_id: ERR_TAKEBACK_NOT_SCHEDULED, http_status: 409, applies_to: "POST /take-back-deliveries/{id}/complete-takeback, POST /take-back-deliveries/{id}/waive" }
  - { priority: 58, category: state,  check: "CommodityOutputRecord.record_status == SUBMITTED", error_id: ERR_COMMODITY_RECORD_NOT_SUBMITTED, http_status: 409, applies_to: "POST /commodity-output-records/{id}/verify" }
  - { priority: 60, category: state,  check: "PickupOrder's target Recycler.certification_status == CERTIFIED (cross-entity state dependency PickupOrder -> Recycler)", error_id: ERR_RECYCLER_NOT_CERTIFIED, http_status: 409, applies_to: "POST /pickup-orders" }
  - { priority: 61, category: state,  check: "VolumeReport's CollectionSite.enrollment_status == ENROLLED (cross-entity state dependency VolumeReport -> CollectionSite)", error_id: ERR_SITE_NOT_ENROLLED, http_status: 409, applies_to: "POST /volume-reports/{id}/accept, POST /collection-sites/{id}/volume-reports, POST /pickup-orders, POST /take-back-deliveries/{id}/complete-takeback" }
  - { priority: 62, category: state,  check: "Filing registrant's Registrant.compliance_status != SUSPENDED (cross-entity state dependency SalesRemittance -> Registrant)", error_id: ERR_REGISTRANT_SUSPENDED, http_status: 409, applies_to: "POST /sales-remittances/{id}/file" }
  - { priority: 64, category: business_safety, check: "Source CollectionSite is not under infestation quarantine: infestation_quarantine_until is null or current_utc >= infestation_quarantine_until", error_id: ERR_SITE_QUARANTINED, http_status: 422, applies_to: "POST /pickup-orders" }
  - { priority: 65, category: business_safety, check: "StateProgram.enforcement_posture == NORMAL before money leaves the program", error_id: ERR_PROGRAM_POSTURE_ELEVATED, http_status: 422, applies_to: "POST /sales-remittances/{id}/refund" }
  - { priority: 68, category: business_temporal, check: "The proposed [effective_from, effective_to) interval does not overlap any PROPOSED / APPROVED / ACTIVE schedule of the same (state_program_id, unit_class) — abutment allowed (calculations.rate_period_overlap)", error_id: ERR_RATE_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /fee-rate-schedules" }
  - { priority: 69, category: business_temporal, check: "current_utc >= FeeRateSchedule.effective_from", error_id: ERR_RATE_NOT_YET_EFFECTIVE, http_status: 409, applies_to: "POST /fee-rate-schedules/{id}/activate" }
  - { priority: 70, category: business_temporal, check: "The resolved hauler's buffer-padded conflicting-route count is below max_concurrent_routes (calculations.hauler_window_conflict)", error_id: ERR_HAULER_WINDOW_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /pickup-orders" }
  - { priority: 74, category: business_referential, check: "Named Recycler.state_program_id equals the source CollectionSite.state_program_id", error_id: ERR_RECYCLER_PROGRAM_MISMATCH, http_status: 422, applies_to: "POST /pickup-orders" }
  - { priority: 75, category: business_referential, check: "An explicitly supplied hauler_id belongs to the site's program and its service_regions contains CollectionSite.region_code", error_id: ERR_HAULER_REGION_MISMATCH, http_status: 422, applies_to: "POST /pickup-orders" }
  - { priority: 76, category: business_referential, check: "An applicable FeeRateSchedule exists for period_start and period_end for every unit_class with units_sold_* > 0 (calculations.applicable_rate_lookup)", error_id: ERR_NO_APPLICABLE_RATE, http_status: 422, applies_to: "POST /sales-remittances/{id}/file" }
  - { priority: 78, category: business_constraint, check: "No other SalesRemittance exists with the same (registrant_id, state_program_id, period_code) and amends_remittance_id == null", error_id: ERR_DUPLICATE_REMITTANCE_PERIOD, http_status: 409, applies_to: "POST /sales-remittances" }
  - { priority: 79, category: business_constraint, check: "No other VolumeReport exists for the same (collection_site_id, period_month)", error_id: ERR_DUPLICATE_VOLUME_PERIOD, http_status: 409, applies_to: "POST /collection-sites/{id}/volume-reports" }
  - { priority: 80, category: business_constraint, check: "SalesRemittance.amendment_round < 2", error_id: ERR_AMENDMENT_LIMIT_EXCEEDED, http_status: 409, applies_to: "POST /sales-remittances/{id}/request-amendment, POST /sales-remittances/{id}/amendments" }
  - { priority: 81, category: business_constraint, check: "Sum of this remittance's PENDING + SUBSTANTIATED ExemptionClaim.units for a unit_class does not exceed that class's units_sold_*", error_id: ERR_EXEMPT_UNITS_EXCEED_SALES, http_status: 422, applies_to: "POST /sales-remittances/{id}/exemption-claims" }
  - { priority: 82, category: business_constraint, check: "units_manifested <= CollectionSite.units_on_hand", error_id: ERR_INSUFFICIENT_SITE_UNITS, http_status: 422, applies_to: "POST /pickup-orders" }
  - { priority: 83, category: business_constraint, check: "At least one hauler survives the eligibility filter of calculations.hauler_selection", error_id: ERR_NO_ELIGIBLE_HAULER, http_status: 422, applies_to: "POST /pickup-orders" }
  - { priority: 84, category: business_constraint, check: "units_delivered <= PickupOrder.units_manifested; contaminated_unit_count <= PickupOrder.units_delivered", error_id: ERR_UNITS_EXCEED_MANIFEST, http_status: 422, applies_to: "POST /pickup-orders/{id}/deliver, POST /pickup-orders/{id}/inspections" }
  - { priority: 85, category: business_constraint, check: "units_takeback_offered >= units_delivered_new (one-for-one take-back-with-delivery obligation)", error_id: ERR_TAKEBACK_OFFER_BELOW_DELIVERY, http_status: 422, applies_to: "POST /take-back-deliveries" }
  - { priority: 86, category: business_constraint, check: "units_takeback_collected <= units_takeback_offered", error_id: ERR_TAKEBACK_COLLECTED_ABOVE_OFFER, http_status: 422, applies_to: "POST /take-back-deliveries/{id}/complete-takeback" }
  - { priority: 87, category: business_constraint, check: "Recycler.diversion_rate_pct >= 75.00", error_id: ERR_DIVERSION_RATE_BELOW_MINIMUM, http_status: 422, applies_to: "POST /recyclers/{id}/recertify" }
  - { priority: 90, category: business_fiscal, check: "band_low_cents <= fee_cents_per_unit <= band_high_cents against the snapshot of calculations.fee_rate_recommendation", error_id: ERR_RATE_OUTSIDE_RECOMMENDED_BAND, http_status: 422, applies_to: "POST /fee-rate-schedules" }
  - { priority: 91, category: business_fiscal, check: "When the proposal raises the rate above the current ACTIVE rate for the pair, StateProgram.reserve_coverage_months < 3.00 (strict)", error_id: ERR_RESERVE_ABOVE_INCREASE_CEILING, http_status: 422, applies_to: "POST /fee-rate-schedules/{id}/approve" }
  - { priority: 92, category: business_fiscal, check: "amount_cents == SalesRemittance.fee_self_assessed_cents", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /sales-remittances/{id}/pay" }
  - { priority: 93, category: business_fiscal, check: "amount_cents <= fee_paid_cents - fee_refunded_cents", error_id: ERR_REFUND_EXCEEDS_PAYMENT, http_status: 422, applies_to: "POST /sales-remittances/{id}/refund" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- StateProgram & fee-rate setting -------------------------------------
  - method: POST
    path: "/state-programs"
    description: "Create a state program with its cost forecast, reserve target and opening reserve balance"
    roles: [ProgramAdministrator]
    code: 201
    input: [state_code, program_name, forecast_annual_cost_cents, forecast_annual_units, "forecast_other_revenue_cents?", reserve_target_months, reserve_opening_cents, site_credit_cents_per_unit, volume_bonus_threshold_units, "delinquency_alert_threshold?"]
    output: StateProgram
    side_effects: ["Computes reserve_balance_cents, reserve_coverage_months and recommended_rate_cents (calculations.fee_rate_recommendation); enforcement_posture starts NORMAL"]

  - method: GET
    path: "/state-programs/{id}"
    description: "Read one state program including its ledger and posture fields"
    roles: [ProgramAdministrator, ProgramAuditor, Registrant, CollectionSiteOperator, Hauler, Recycler]
    code: 200
    input: []
    output: StateProgram
    side_effects: []

  - method: PATCH
    path: "/state-programs/{id}/cost-forecast"
    description: "Revise the program's cost/unit/revenue forecast or reserve target; recomputes the recommended rate and coverage"
    roles: [ProgramAdministrator]
    code: 200
    input: ["forecast_annual_cost_cents?", "forecast_annual_units?", "forecast_other_revenue_cents?", "reserve_target_months?"]
    output: StateProgram
    side_effects: ["Recomputes reserve_coverage_months and recommended_rate_cents", "increments StateProgram.version by 1"]

  - method: GET
    path: "/state-programs/{id}/fee-adequacy"
    description: "Computed read of calculations.fee_rate_recommendation and calculations.reserve_coverage_months for the program's current state"
    roles: [ProgramAdministrator, ProgramAuditor]
    code: 200
    input: []
    output: "{ recommended_rate_cents: integer, band_low_cents: integer, band_high_cents: integer, base_rate_cents: integer, admin_surcharge_pct: number, reserve_target_cents: integer, reserve_gap_cents: integer, reserve_balance_cents: integer, reserve_coverage_months: number }"
    side_effects: []

  - method: POST
    path: "/fee-rate-schedules"
    description: "Propose a per-unit recycling fee rate for a (state, unit class) taking effect at effective_from; banded against the program's recommended rate"
    roles: [ProgramAdministrator]
    code: 201
    input: [state_program_id, unit_class, fee_cents_per_unit, effective_from, "effective_to?", expected_state_program_version]
    output: FeeRateSchedule
    side_effects: ["Snapshots recommended_rate_cents_at_proposal, band_low_cents, band_high_cents", "records proposed_by_user_id = X-User-ID", "increments StateProgram.version by 1"]

  - method: GET
    path: "/fee-rate-schedules/{id}"
    description: "Read one fee rate schedule"
    roles: [ProgramAdministrator, ProgramAuditor, Registrant]
    code: 200
    input: []
    output: FeeRateSchedule
    side_effects: []

  - method: GET
    path: "/fee-rate-schedules"
    description: "List fee rate schedules, filterable by program, unit class and status"
    roles: [ProgramAdministrator, ProgramAuditor, Registrant]
    code: 200
    input: ["state_program_id?", "unit_class?", "status?", "limit?", "offset?"]
    output: FeeRateSchedule[]
    side_effects: []

  - method: POST
    path: "/fee-rate-schedules/{id}/approve"
    description: "Approve a proposed rate; a different administrator user than the proposer must act, and a rate increase is blocked while the reserve is at or above the coverage ceiling"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: FeeRateSchedule
    side_effects: ["Sets status APPROVED and approved_by_user_id = X-User-ID"]

  - method: POST
    path: "/fee-rate-schedules/{id}/activate"
    description: "Activate an approved rate on or after its effective_from, superseding the prior ACTIVE rate for the same (program, unit class)"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: FeeRateSchedule
    side_effects: ["Sets status ACTIVE", "prior ACTIVE schedule for the pair becomes SUPERSEDED with effective_to = this.effective_from", "recomputes StateProgram.recommended_rate_cents", "increments StateProgram.version by 1"]

  # ---- Registrants, remittances, exemption claims ---------------------------
  - method: POST
    path: "/registrants"
    description: "Register a manufacturer / retailer participant"
    roles: [ProgramAdministrator]
    code: 201
    input: [legal_name, registrant_type, home_state_code]
    output: Registrant
    side_effects: ["compliance_status starts COMPLIANT with delinquent_balance_cents 0"]

  - method: GET
    path: "/registrants/{id}"
    description: "Read one registrant including compliance status and delinquent balance"
    roles: [ProgramAdministrator, ProgramAuditor, Registrant]
    code: 200
    input: []
    output: Registrant
    side_effects: []

  - method: POST
    path: "/sales-remittances"
    description: "Open a DRAFT quarterly remittance for a registrant in a state program"
    roles: [Registrant]
    code: 201
    input: [registrant_id, state_program_id, period_code, units_sold_mattress, units_sold_foundation]
    output: SalesRemittance
    side_effects: ["Derives period_start / period_end from period_code", "status starts DRAFT with amendment_round 0"]

  - method: GET
    path: "/sales-remittances/{id}"
    description: "Read one remittance including both fee variants and the audit trail fields"
    roles: [ProgramAdministrator, ProgramAuditor, Registrant]
    code: 200
    input: []
    output: SalesRemittance
    side_effects: []

  - method: GET
    path: "/sales-remittances"
    description: "List remittances, filterable by registrant, program, amended parent, status and period"
    roles: [ProgramAdministrator, ProgramAuditor, Registrant]
    code: 200
    input: ["registrant_id?", "state_program_id?", "amends_remittance_id?", "status?", "period_code?", "limit?", "offset?"]
    output: SalesRemittance[]
    side_effects: []

  - method: POST
    path: "/sales-remittances/{id}/exemption-claims"
    description: "Attach an exempt-sale or out-of-state-shipment claim to a DRAFT remittance"
    roles: [Registrant]
    code: 201
    input: [claim_type, unit_class, units, "documentation_reference?"]
    output: ExemptionClaim
    side_effects: ["status starts PENDING; claimed units reduce the SELF_ASSESSED chargeable base at filing"]

  - method: GET
    path: "/sales-remittances/{id}/exemption-claims"
    description: "List the exemption claims attached to a remittance"
    roles: [ProgramAdministrator, ProgramAuditor, Registrant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExemptionClaim[]
    side_effects: []

  - method: POST
    path: "/sales-remittances/{id}/file"
    description: "File the remittance: stamps filed_at, early_filing_qualified and the SELF_ASSESSED fee"
    roles: [Registrant]
    code: 200
    input: []
    output: SalesRemittance
    side_effects: ["status DRAFT -> FILED", "stamps fee_self_assessed_cents via calculations.remittance_fee_assessment (SELF_ASSESSED)"]

  - method: POST
    path: "/sales-remittances/{id}/pay"
    description: "Remit the self-assessed fee in full"
    roles: [Registrant]
    code: 200
    input: [amount_cents]
    output: SalesRemittance
    side_effects: ["status FILED -> PAID, fee_paid_cents = amount_cents", "recomputes StateProgram.fee_collected_cents, reserve_balance_cents, reserve_coverage_months, recommended_rate_cents"]

  - method: POST
    path: "/sales-remittances/{id}/refund"
    description: "Return fee cash to the registrant — the compensating action of pay; blocked while the program's enforcement posture is ELEVATED"
    roles: [ProgramAdministrator]
    code: 200
    input: [amount_cents, reason]
    output: SalesRemittance
    side_effects: ["status PAID -> REFUNDED, fee_refunded_cents += amount_cents", "recomputes StateProgram.fee_collected_cents, reserve_balance_cents, reserve_coverage_months, recommended_rate_cents"]

  - method: POST
    path: "/sales-remittances/{id}/audit-open"
    description: "Open an exemption / fee audit on a paid remittance"
    roles: [ProgramAuditor]
    code: 200
    input: []
    output: SalesRemittance
    side_effects: ["status PAID -> UNDER_AUDIT, audit_opened_by_user_id = X-User-ID"]

  - method: POST
    path: "/exemption-claims/{id}/adjudicate"
    description: "Substantiate or disallow one exemption claim while its remittance is under audit"
    roles: [ProgramAuditor]
    code: 200
    input: [decision, "disallow_reason?"]
    output: ExemptionClaim
    side_effects: ["status PENDING -> SUBSTANTIATED | DISALLOWED", "a DISALLOWED claim forfeits the early-filing discount in the AUDIT_RECONCILED variant"]

  - method: POST
    path: "/sales-remittances/{id}/request-amendment"
    description: "Send an audited remittance back to the registrant for amendment"
    roles: [ProgramAuditor]
    code: 200
    input: [note]
    output: SalesRemittance
    side_effects: ["status UNDER_AUDIT -> AMENDMENT_REQUIRED, amendment_requested_by_user_id = X-User-ID"]

  - method: POST
    path: "/sales-remittances/{id}/amendments"
    description: "Submit revised unit figures against an amendment request; creates a DRAFT amendment row and returns the audited parent to UNDER_AUDIT"
    roles: [Registrant]
    code: 201
    input: [units_sold_mattress, units_sold_foundation, expected_remittance_version]
    output: SalesRemittance
    side_effects: ["Parent status AMENDMENT_REQUIRED -> UNDER_AUDIT with amendment_round += 1 and version += 1", "creates a new SalesRemittance in DRAFT with amends_remittance_id = parent id (the response body is the parent)"]

  - method: POST
    path: "/sales-remittances/{id}/audit-close"
    description: "Close the audit: stamps the AUDIT_RECONCILED fee, the balance due, and cascades delinquency into the registrant and the program"
    roles: [ProgramAuditor]
    code: 200
    input: []
    output: SalesRemittance
    side_effects: ["status UNDER_AUDIT -> AUDIT_CLOSED", "stamps fee_reconciled_cents and balance_due_cents", "cascade: Registrant.delinquent_balance_cents / compliance_status -> StateProgram.delinquent_registrant_count and receivable_cents -> StateProgram.enforcement_posture"]

  # ---- Collection sites and volume reporting -------------------------------
  - method: POST
    path: "/collection-sites"
    description: "Apply a collection site or transfer station to the program"
    roles: [ProgramAdministrator]
    code: 201
    input: [state_program_id, operator_name, site_type, region_code]
    output: CollectionSite
    side_effects: ["enrollment_status starts APPLIED with all five custody buckets at 0"]

  - method: GET
    path: "/collection-sites/{id}"
    description: "Read one collection site including custody buckets, strike count and quarantine window"
    roles: [ProgramAdministrator, ProgramAuditor, CollectionSiteOperator, Hauler, Recycler, Registrant]
    code: 200
    input: []
    output: CollectionSite
    side_effects: []

  - method: GET
    path: "/collection-sites"
    description: "List collection sites, filterable by program and enrollment status"
    roles: [ProgramAdministrator, ProgramAuditor, CollectionSiteOperator, Hauler, Registrant]
    code: 200
    input: ["state_program_id?", "enrollment_status?", "site_type?", "limit?", "offset?"]
    output: CollectionSite[]
    side_effects: []

  - method: POST
    path: "/collection-sites/{id}/enroll"
    description: "Enroll an applied site into the program"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: CollectionSite
    side_effects: ["enrollment_status APPLIED -> ENROLLED", "increments StateProgram.enrolled_site_count"]

  - method: POST
    path: "/collection-sites/{id}/suspend"
    description: "Suspend an enrolled site; cancels its open pickup orders and returns their units to on-hand"
    roles: [ProgramAdministrator]
    code: 200
    input: [reason]
    output: CollectionSite
    side_effects: ["enrollment_status ENROLLED -> SUSPENDED with suspended_at", "decrements StateProgram.enrolled_site_count", "cancels SCHEDULED / PICKED_UP pickup orders and moves units_in_transit back to units_on_hand"]

  - method: POST
    path: "/collection-sites/{id}/reinstate"
    description: "Reinstate a suspended site once any infestation quarantine has expired; resets the strike counter"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: CollectionSite
    side_effects: ["enrollment_status SUSPENDED -> ENROLLED", "contamination_strike_count reset to 0", "increments StateProgram.enrolled_site_count"]

  - method: POST
    path: "/collection-sites/{id}/volume-reports"
    description: "Submit a monthly collected-volume report for the site"
    roles: [CollectionSiteOperator]
    code: 201
    input: [period_month, units_mattress, units_foundation]
    output: VolumeReport
    side_effects: ["status starts SUBMITTED; no credit and no custody movement until acceptance"]

  - method: GET
    path: "/collection-sites/{id}/volume-reports"
    description: "List a site's volume reports"
    roles: [ProgramAdministrator, ProgramAuditor, CollectionSiteOperator]
    code: 200
    input: ["status?", "period_month?", "limit?", "offset?"]
    output: VolumeReport[]
    side_effects: []

  - method: POST
    path: "/volume-reports/{id}/accept"
    description: "Accept a submitted volume report: credits the site per unit with the volume bonus and books the payout against the reserve"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: VolumeReport
    side_effects: ["status SUBMITTED -> ACCEPTED with credited_units and credit_cents (calculations.site_volume_credit)", "CollectionSite.units_on_hand and units_reported_total += credited_units", "StateProgram.site_credit_paid_cents += credit_cents and reserve fields recomputed"]

  # ---- Haulers, recyclers, pickup orders, inspections ----------------------
  - method: POST
    path: "/haulers"
    description: "Enroll a hauler with its service regions and rate card"
    roles: [ProgramAdministrator]
    code: 201
    input: [state_program_id, company_name, service_regions, per_unit_rate_cents, per_km_rate_cents, max_route_payment_cents, "max_concurrent_routes?"]
    output: Hauler
    side_effects: ["active_route_count and total_paid_cents start at 0"]

  - method: GET
    path: "/haulers/{id}"
    description: "Read one hauler including route load and lifetime payments"
    roles: [ProgramAdministrator, ProgramAuditor, Hauler, CollectionSiteOperator]
    code: 200
    input: []
    output: Hauler
    side_effects: []

  - method: GET
    path: "/haulers"
    description: "List haulers, filterable by program"
    roles: [ProgramAdministrator, ProgramAuditor, Hauler, CollectionSiteOperator]
    code: 200
    input: ["state_program_id?", "region_code?", "limit?", "offset?"]
    output: Hauler[]
    side_effects: []

  - method: POST
    path: "/recyclers"
    description: "Enroll a processing facility (starts PROVISIONAL)"
    roles: [ProgramAdministrator]
    code: 201
    input: [state_program_id, facility_name, accepted_unit_classes]
    output: Recycler
    side_effects: ["certification_status starts PROVISIONAL; diversion_rate_pct 0"]

  - method: GET
    path: "/recyclers/{id}"
    description: "Read one recycler including throughput counters and diversion rate"
    roles: [ProgramAdministrator, ProgramAuditor, Recycler, CollectionSiteOperator]
    code: 200
    input: []
    output: Recycler
    side_effects: []

  - method: GET
    path: "/recyclers"
    description: "List recyclers, filterable by program and certification status"
    roles: [ProgramAdministrator, ProgramAuditor, Recycler, CollectionSiteOperator]
    code: 200
    input: ["state_program_id?", "certification_status?", "limit?", "offset?"]
    output: Recycler[]
    side_effects: []

  - method: POST
    path: "/recyclers/{id}/certify"
    description: "Grant processing certification to a provisional facility"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Recycler
    side_effects: ["certification_status PROVISIONAL -> CERTIFIED with certified_at"]

  - method: POST
    path: "/recyclers/{id}/suspend-certification"
    description: "Suspend a facility's certification; new pickup orders to it are refused"
    roles: [ProgramAdministrator]
    code: 200
    input: [reason]
    output: Recycler
    side_effects: ["certification_status CERTIFIED -> SUSPENDED, certified_at cleared"]

  - method: POST
    path: "/recyclers/{id}/recertify"
    description: "Restore certification once the verified commodity-output diversion rate is at least 75.00%"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Recycler
    side_effects: ["certification_status SUSPENDED -> CERTIFIED with certified_at"]

  - method: POST
    path: "/recyclers/{id}/commodity-output-records"
    description: "Record an outbound commodity stream (steel, foam, fiber, wood) for a processing month"
    roles: [Recycler]
    code: 201
    input: [commodity, output_weight_kg, source_period_month]
    output: CommodityOutputRecord
    side_effects: ["record_status starts SUBMITTED; unverified weight does not enter diversion_rate_pct"]

  - method: GET
    path: "/recyclers/{id}/commodity-output-records"
    description: "List a recycler's commodity output records"
    roles: [ProgramAdministrator, ProgramAuditor, Recycler]
    code: 200
    input: ["record_status?", "commodity?", "limit?", "offset?"]
    output: CommodityOutputRecord[]
    side_effects: []

  - method: POST
    path: "/commodity-output-records/{id}/verify"
    description: "Verify a submitted commodity output record so its weight counts toward the diversion rate"
    roles: [ProgramAuditor]
    code: 200
    input: []
    output: CommodityOutputRecord
    side_effects: ["record_status SUBMITTED -> VERIFIED with verified_by_user_id", "recomputes Recycler.verified_output_weight_kg and diversion_rate_pct"]

  - method: POST
    path: "/pickup-orders"
    description: "Dispatch a load from a site to a certified recycler; hauler_id may be omitted to let the server select one per calculations.hauler_selection"
    roles: [CollectionSiteOperator]
    code: 201
    input: [collection_site_id, recycler_id, "hauler_id?", units_manifested, route_distance_km, pickup_window_start, pickup_window_end]
    output: PickupOrder
    side_effects: ["fulfillment_status SCHEDULED / settlement_status UNSETTLED", "sets hauler_id and hauler_auto_selected", "CollectionSite.units_on_hand -= units_manifested and units_in_transit += units_manifested", "increments Hauler.active_route_count"]

  - method: GET
    path: "/pickup-orders/{id}"
    description: "Read one pickup order including both status axes and both payment variants"
    roles: [ProgramAdministrator, ProgramAuditor, CollectionSiteOperator, Hauler, Recycler]
    code: 200
    input: []
    output: PickupOrder
    side_effects: []

  - method: GET
    path: "/pickup-orders"
    description: "List pickup orders, filterable by site, hauler, recycler and either status axis"
    roles: [ProgramAdministrator, ProgramAuditor, CollectionSiteOperator, Hauler, Recycler]
    code: 200
    input: ["collection_site_id?", "hauler_id?", "recycler_id?", "fulfillment_status?", "settlement_status?", "limit?", "offset?"]
    output: PickupOrder[]
    side_effects: []

  - method: POST
    path: "/pickup-orders/{id}/pickup-confirm"
    description: "Hauler confirms the load has been picked up"
    roles: [Hauler]
    code: 200
    input: []
    output: PickupOrder
    side_effects: ["fulfillment_status SCHEDULED -> PICKED_UP; settlement_status unchanged"]

  - method: POST
    path: "/pickup-orders/{id}/deliver"
    description: "Hauler delivers the load to the recycler; stamps the ROUTE_ESTIMATE payment"
    roles: [Hauler]
    code: 200
    input: [units_delivered]
    output: PickupOrder
    side_effects: ["fulfillment_status PICKED_UP -> DELIVERED and settlement_status UNSETTLED -> ESTIMATED", "stamps estimated_payment_cents", "moves site custody buckets and increments Recycler.units_received_count"]

  - method: POST
    path: "/pickup-orders/{id}/inspections"
    description: "Recycler records the incoming-load inspection: contamination count and infestation finding decide partial acceptance or full rejection"
    roles: [Recycler]
    code: 201
    input: [contaminated_unit_count, infestation_finding]
    output: LoadInspection
    side_effects: ["stamps contamination_pct, disposition, units_accepted, rejection_reason", "sets PickupOrder.units_accepted; FULL_REJECT also moves settlement_status ESTIMATED -> DISPUTED", "cascade: site strike count / quarantine -> site suspension at 3 strikes -> program site count and cancellation of that site's open pickup orders", "recomputes Recycler counters and diversion_rate_pct"]

  - method: GET
    path: "/pickup-orders/{id}/inspections"
    description: "List the inspection events recorded against a pickup order"
    roles: [ProgramAdministrator, ProgramAuditor, Recycler, CollectionSiteOperator, Hauler]
    code: 200
    input: ["limit?", "offset?"]
    output: LoadInspection[]
    side_effects: []

  - method: POST
    path: "/pickup-orders/{id}/finalize-settlement"
    description: "Settle the route on inspected units: stamps the FINAL_SETTLEMENT payment and books it against the reserve"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: PickupOrder
    side_effects: ["fulfillment_status DELIVERED -> CLOSED and settlement_status -> FINALIZED", "stamps final_payment_cents", "Hauler.total_paid_cents and StateProgram.hauler_payment_paid_cents += final_payment_cents with reserve fields recomputed"]

  - method: POST
    path: "/pickup-orders/{id}/void"
    description: "Void a scheduled pickup before collection — the compensating action of dispatch; returns the manifested units to the site"
    roles: [CollectionSiteOperator]
    code: 200
    input: [reason]
    output: PickupOrder
    side_effects: ["fulfillment_status SCHEDULED -> CANCELLED and settlement_status -> VOIDED", "units_in_transit -> units_on_hand for units_manifested", "decrements Hauler.active_route_count"]

  # ---- Retailer take-back-with-delivery -----------------------------------
  - method: POST
    path: "/take-back-deliveries"
    description: "Record a retail delivery carrying the one-for-one take-back obligation"
    roles: [Registrant]
    code: 201
    input: [registrant_id, collection_site_id, delivery_reference, units_delivered_new, units_takeback_offered]
    output: TakeBackDelivery
    side_effects: ["status starts SCHEDULED with breach counters at 0"]

  - method: GET
    path: "/take-back-deliveries/{id}"
    description: "Read one take-back delivery"
    roles: [ProgramAdministrator, ProgramAuditor, Registrant, CollectionSiteOperator]
    code: 200
    input: []
    output: TakeBackDelivery
    side_effects: []

  - method: GET
    path: "/take-back-deliveries"
    description: "List take-back deliveries, filterable by registrant, destination site and status"
    roles: [ProgramAdministrator, ProgramAuditor, Registrant, CollectionSiteOperator]
    code: 200
    input: ["registrant_id?", "collection_site_id?", "status?", "limit?", "offset?"]
    output: TakeBackDelivery[]
    side_effects: []

  - method: POST
    path: "/take-back-deliveries/{id}/complete-takeback"
    description: "Report the units actually removed; short collection breaches the obligation and penalises the registrant"
    roles: [Registrant]
    code: 200
    input: [units_takeback_collected]
    output: TakeBackDelivery
    side_effects: ["status SCHEDULED -> OBLIGATION_MET or OBLIGATION_BREACHED", "collected units enter CollectionSite.units_on_hand and units_reported_total", "a breach charges breach_penalty_cents to Registrant.delinquent_balance_cents and flips compliance_status to DELINQUENT"]

  - method: POST
    path: "/take-back-deliveries/{id}/waive"
    description: "Record a documented customer declination, discharging the obligation with no penalty"
    roles: [Registrant]
    code: 200
    input: [waiver_reference]
    output: TakeBackDelivery
    side_effects: ["status SCHEDULED -> WAIVED with units_takeback_collected 0 and no custody movement"]

  # ---- Test-driving endpoint (logical clock) -------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every deadline, quarantine window and effective-date comparison reads that default and never falls back to real wall-clock time."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["All subsequent current_utc reads (filed_at, accepted_at, suspended_at, certified_at, quarantine and effective-date comparisons) use the new value"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID header missing or role not recognised" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role is not listed in the endpoint's roles" }
  - { id: ERR_FORBIDDEN_RESOURCE, http: 403, condition: "Entity-backed role acting on a resource it does not own" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver equals proposer on a rate schedule, or audit-closer equals the auditor that requested the amendment" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, unknown enum member or violated numeric constraint" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside 1..100 or negative offset" }
  - { id: ERR_STATE_PROGRAM_NOT_FOUND, http: 404, condition: "state_program_id does not resolve" }
  - { id: ERR_RATE_SCHEDULE_NOT_FOUND, http: 404, condition: "schedule_id does not resolve" }
  - { id: ERR_REGISTRANT_NOT_FOUND, http: 404, condition: "registrant_id does not resolve" }
  - { id: ERR_REMITTANCE_NOT_FOUND, http: 404, condition: "remittance_id does not resolve" }
  - { id: ERR_EXEMPTION_CLAIM_NOT_FOUND, http: 404, condition: "claim_id does not resolve" }
  - { id: ERR_COLLECTION_SITE_NOT_FOUND, http: 404, condition: "collection_site_id / site_id does not resolve" }
  - { id: ERR_VOLUME_REPORT_NOT_FOUND, http: 404, condition: "report_id does not resolve" }
  - { id: ERR_HAULER_NOT_FOUND, http: 404, condition: "hauler_id does not resolve" }
  - { id: ERR_RECYCLER_NOT_FOUND, http: 404, condition: "recycler_id does not resolve" }
  - { id: ERR_PICKUP_ORDER_NOT_FOUND, http: 404, condition: "pickup_order_id does not resolve" }
  - { id: ERR_COMMODITY_RECORD_NOT_FOUND, http: 404, condition: "record_id does not resolve" }
  - { id: ERR_TAKE_BACK_DELIVERY_NOT_FOUND, http: 404, condition: "delivery_id does not resolve" }
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_state_program_version does not equal StateProgram.version on POST /fee-rate-schedules" }
  - { id: ERR_STALE_REMITTANCE_VERSION, http: 412, condition: "expected_remittance_version does not equal SalesRemittance.version on POST /sales-remittances/{id}/amendments" }
  - { id: ERR_RATE_SCHEDULE_NOT_APPROVABLE, http: 409, condition: "approve on a schedule not in PROPOSED, or activate on a schedule not in APPROVED" }
  - { id: ERR_RATE_NOT_YET_EFFECTIVE, http: 409, condition: "activate called while current_utc < effective_from" }
  - { id: ERR_RATE_PERIOD_OVERLAP, http: 409, condition: "Proposed half-open effective interval overlaps a PROPOSED / APPROVED / ACTIVE schedule of the same (program, unit class)" }
  - { id: ERR_REMITTANCE_NOT_DRAFT, http: 409, condition: "file or exemption-claim create on a remittance not in DRAFT" }
  - { id: ERR_REMITTANCE_NOT_PAYABLE, http: 409, condition: "pay on a remittance not in FILED" }
  - { id: ERR_REMITTANCE_NOT_PAID, http: 409, condition: "audit-open or refund on a remittance not in PAID" }
  - { id: ERR_REMITTANCE_NOT_UNDER_AUDIT, http: 409, condition: "request-amendment / audit-close on a remittance not UNDER_AUDIT, or amendments on one not in AMENDMENT_REQUIRED" }
  - { id: ERR_PENDING_EXEMPTION_CLAIMS, http: 409, condition: "audit-close while at least one ExemptionClaim of the remittance is still PENDING" }
  - { id: ERR_CLAIM_ALREADY_ADJUDICATED, http: 409, condition: "adjudicate on a claim not in PENDING" }
  - { id: ERR_AMENDMENT_LIMIT_EXCEEDED, http: 409, condition: "request-amendment or amendments once amendment_round has reached 2" }
  - { id: ERR_SITE_ENROLLMENT_STATE_INVALID, http: 409, condition: "enroll / suspend / reinstate called from the wrong enrollment_status" }
  - { id: ERR_SITE_NOT_ENROLLED, http: 409, condition: "Volume-report submission or acceptance, pickup dispatch, or take-back completion against a site not in ENROLLED" }
  - { id: ERR_VOLUME_REPORT_NOT_SUBMITTED, http: 409, condition: "accept on a volume report not in SUBMITTED" }
  - { id: ERR_PICKUP_STATE_INVALID, http: 409, condition: "pickup-confirm / deliver / inspections / finalize-settlement / void called from the wrong fulfillment_status" }
  - { id: ERR_LOAD_ALREADY_INSPECTED, http: 409, condition: "A second inspection recorded against the same pickup order" }
  - { id: ERR_SETTLEMENT_NOT_READY, http: 409, condition: "finalize-settlement while settlement_status is not ESTIMATED / DISPUTED or no inspection exists" }
  - { id: ERR_RECYCLER_NOT_CERTIFIED, http: 409, condition: "Pickup dispatch to a recycler whose certification_status is not CERTIFIED" }
  - { id: ERR_RECYCLER_CERT_STATE_INVALID, http: 409, condition: "certify / suspend-certification / recertify called from the wrong certification_status" }
  - { id: ERR_REGISTRANT_SUSPENDED, http: 409, condition: "file called by a registrant whose compliance_status is SUSPENDED" }
  - { id: ERR_TAKEBACK_NOT_SCHEDULED, http: 409, condition: "complete-takeback or waive on a delivery not in SCHEDULED" }
  - { id: ERR_COMMODITY_RECORD_NOT_SUBMITTED, http: 409, condition: "verify on a record not in SUBMITTED" }
  - { id: ERR_HAULER_WINDOW_CAPACITY_EXCEEDED, http: 409, condition: "Resolved hauler already holds max_concurrent_routes buffer-overlapping windows" }
  - { id: ERR_SITE_QUARANTINED, http: 422, condition: "Pickup dispatch from a site whose infestation_quarantine_until is in the future" }
  - { id: ERR_PROGRAM_POSTURE_ELEVATED, http: 422, condition: "Refund attempted while StateProgram.enforcement_posture is ELEVATED" }
  - { id: ERR_RECYCLER_PROGRAM_MISMATCH, http: 422, condition: "Named recycler belongs to a different state program than the source site" }
  - { id: ERR_HAULER_REGION_MISMATCH, http: 422, condition: "Explicit hauler_id is from another program or does not serve the site's region_code" }
  - { id: ERR_NO_APPLICABLE_RATE, http: 422, condition: "No ACTIVE / SUPERSEDED fee rate covers period_start or period_end for a class with units sold" }
  - { id: ERR_DUPLICATE_REMITTANCE_PERIOD, http: 409, condition: "A second original remittance for the same (registrant, program, period_code)" }
  - { id: ERR_DUPLICATE_VOLUME_PERIOD, http: 409, condition: "A second volume report for the same (site, period_month)" }
  - { id: ERR_EXEMPT_UNITS_EXCEED_SALES, http: 422, condition: "Claimed exempt units for a unit class exceed that class's reported units sold" }
  - { id: ERR_INSUFFICIENT_SITE_UNITS, http: 422, condition: "units_manifested exceeds the site's units_on_hand" }
  - { id: ERR_NO_ELIGIBLE_HAULER, http: 422, condition: "The hauler-selection eligibility filter yields an empty candidate pool" }
  - { id: ERR_UNITS_EXCEED_MANIFEST, http: 422, condition: "units_delivered exceeds units_manifested, or contaminated_unit_count exceeds units_delivered" }
  - { id: ERR_TAKEBACK_OFFER_BELOW_DELIVERY, http: 422, condition: "units_takeback_offered is less than units_delivered_new" }
  - { id: ERR_TAKEBACK_COLLECTED_ABOVE_OFFER, http: 422, condition: "units_takeback_collected exceeds units_takeback_offered" }
  - { id: ERR_DIVERSION_RATE_BELOW_MINIMUM, http: 422, condition: "recertify while diversion_rate_pct < 75.00" }
  - { id: ERR_RATE_OUTSIDE_RECOMMENDED_BAND, http: 422, condition: "Proposed fee_cents_per_unit outside [band_low_cents, band_high_cents]" }
  - { id: ERR_RESERVE_ABOVE_INCREASE_CEILING, http: 422, condition: "Approving a rate increase while reserve_coverage_months >= 3.00" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "amount_cents differs from fee_self_assessed_cents" }
  - { id: ERR_REFUND_EXCEEDS_PAYMENT, http: 422, condition: "Refund amount exceeds fee_paid_cents - fee_refunded_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Council program staff: sets up programs, proposes/approves/activates fee rates, enrolls sites, haulers and recyclers, accepts volume reports, finalizes hauler settlements, issues refunds, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /state-programs"
      - "PATCH /state-programs/{id}/cost-forecast"
      - "POST /fee-rate-schedules"
      - "POST /fee-rate-schedules/{id}/approve"
      - "POST /fee-rate-schedules/{id}/activate"
      - "POST /registrants"
      - "POST /sales-remittances/{id}/refund"
      - "POST /collection-sites"
      - "POST /collection-sites/{id}/enroll"
      - "POST /collection-sites/{id}/suspend"
      - "POST /collection-sites/{id}/reinstate"
      - "POST /volume-reports/{id}/accept"
      - "POST /haulers"
      - "POST /recyclers"
      - "POST /recyclers/{id}/certify"
      - "POST /recyclers/{id}/suspend-certification"
      - "POST /recyclers/{id}/recertify"
      - "POST /pickup-orders/{id}/finalize-settlement"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
    note: "Two distinct X-User-IDs are required across propose and approve of the same schedule (segregation of duties)."

  - name: ProgramAuditor
    description: "Independent audit function: opens fee audits, adjudicates exemption claims, requests amendments, closes audits, verifies commodity output records"
    identity: opaque
    exclusive_operations:
      - "POST /sales-remittances/{id}/audit-open"
      - "POST /exemption-claims/{id}/adjudicate"
      - "POST /sales-remittances/{id}/request-amendment"
      - "POST /sales-remittances/{id}/audit-close"
      - "POST /commodity-output-records/{id}/verify"
    shared_operations: ["all GET endpoints"]
    note: "The auditor that requested an amendment may not close that remittance's audit."

  - name: Registrant
    description: "Manufacturer / retailer participant: files and pays remittances, attaches exemption claims, submits amendments, records take-back deliveries"
    identity: "entity_backed:Registrant"
    exclusive_operations:
      - "POST /sales-remittances"
      - "POST /sales-remittances/{id}/exemption-claims"
      - "POST /sales-remittances/{id}/file"
      - "POST /sales-remittances/{id}/pay"
      - "POST /sales-remittances/{id}/amendments"
      - "POST /take-back-deliveries"
      - "POST /take-back-deliveries/{id}/complete-takeback"
      - "POST /take-back-deliveries/{id}/waive"
    shared_operations: ["GET /state-programs/{id}", "GET /registrants/{id}", "GET /fee-rate-schedules", "GET /fee-rate-schedules/{id}", "GET /sales-remittances", "GET /sales-remittances/{id}", "GET /sales-remittances/{id}/exemption-claims", "GET /collection-sites", "GET /collection-sites/{id}", "GET /take-back-deliveries", "GET /take-back-deliveries/{id}"]
    note: "X-User-ID equals Registrant.id; it must match the target remittance's / delivery's registrant_id."

  - name: CollectionSiteOperator
    description: "Site or transfer-station operator: submits monthly volume reports, dispatches loads to recyclers, voids scheduled pickups"
    identity: "entity_backed:CollectionSite"
    exclusive_operations:
      - "POST /collection-sites/{id}/volume-reports"
      - "POST /pickup-orders"
      - "POST /pickup-orders/{id}/void"
    shared_operations: ["GET /state-programs/{id}", "GET /collection-sites", "GET /collection-sites/{id}", "GET /collection-sites/{id}/volume-reports", "GET /haulers", "GET /haulers/{id}", "GET /recyclers", "GET /recyclers/{id}", "GET /pickup-orders", "GET /pickup-orders/{id}", "GET /pickup-orders/{id}/inspections", "GET /take-back-deliveries", "GET /take-back-deliveries/{id}"]
    note: "X-User-ID equals CollectionSite.id; it must match the target site / order's collection_site_id."

  - name: Hauler
    description: "Contract hauler: confirms pickup and delivery of routed loads"
    identity: "entity_backed:Hauler"
    exclusive_operations:
      - "POST /pickup-orders/{id}/pickup-confirm"
      - "POST /pickup-orders/{id}/deliver"
    shared_operations: ["GET /state-programs/{id}", "GET /haulers", "GET /haulers/{id}", "GET /collection-sites/{id}", "GET /pickup-orders", "GET /pickup-orders/{id}", "GET /pickup-orders/{id}/inspections"]
    note: "X-User-ID equals Hauler.id; it must match the order's hauler_id."

  - name: Recycler
    description: "Certified processing facility: records incoming-load inspections and outbound commodity streams"
    identity: "entity_backed:Recycler"
    exclusive_operations:
      - "POST /pickup-orders/{id}/inspections"
      - "POST /recyclers/{id}/commodity-output-records"
    shared_operations: ["GET /state-programs/{id}", "GET /recyclers", "GET /recyclers/{id}", "GET /recyclers/{id}/commodity-output-records", "GET /collection-sites/{id}", "GET /pickup-orders", "GET /pickup-orders/{id}", "GET /pickup-orders/{id}/inspections"]
    note: "X-User-ID equals Recycler.id; it must match the order's recycler_id / the path recycler_id."
