      - name: an_avalanche_clearance_expires_on_the_clock_at_exactly_its_expiry_instant
        claim_type: temporal_validation
        grounds:
          - validations[priority=27]
          - errors[ERR_MITIGATION_NOT_CURRENT]
          - entities.TerrainArea.fields.mitigation_clearance_expires_at
          - state_machines.AvalancheMitigationMission.EXECUTED_to_CLEARED
        distinguishing_aspect: |
          A SKI_CUT clearance is valid for 8 hours and the comparison is strict, so at exactly
          clearance + 8h the terrain is no longer mitigated. Nothing is mutated between the successful
          setup and the failing decision - only the logical clock moves - so an implementation that
          latches "mitigated" as a boolean at clearance time passes every non-temporal test and fails
          here. The second mission then re-clears at the new clock and the same call succeeds with an
          expiry 8 hours later.
        test_recipe:
          setup:
            - "A season OPERATING with an OPEN lift and an avalanche-terrain area that is READY."
            - "Mission M1 (SKI_CUT) was executed by P1 and cleared LOW by P2 at 2026-08-01T00:00:00Z, so mitigation_clearance_expires_at is 2026-08-01T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
