              as: Donor
              as_user_id: "${donor_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /recurring-plans/${plan_id}/pause"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
            - call: "PATCH /partners/${partner_id}"
              payload: { status: "SUSPENDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /recurring-plans/${plan_id}/resume"
              payload: {}
              as: Donor
              as_user_id: "${donor_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PARTNER_SUSPENDED"

