  # =============================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Differentiation required by §0.5: DIFFERENT error-category pairs. Instance 1 pits
  # auth (priority 2) against state (priority 21); instance 2 pits business_safety
  # (priority 33) against business_fiscal (priority 48).
  # =============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_conflict_unauthorized_outranks_invalid_state
        grounds:
          - validations[priority=2]
          - validations[priority=21]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_STATE]
          - endpoints[POST /cdp/activations/{activationId}/dispatch]
        distinguishing_aspect: |
          Category pair auth x state. One call violates BOTH priority 2 (X-User-Role
          PrivacyOfficer is not in the dispatch endpoint's roles) and priority 21 (the activation
          is already DISPATCHED, so DRAFT -> DISPATCHED is not available); the response must be
          ERR_UNAUTHORIZED (403), never ERR_INVALID_STATE (409).
