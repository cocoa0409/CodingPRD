            - "DistributionOrder.${at_id}.landed_cost_cents == 207200"
            - "DistributionOrder.${below_id}.product_cents == 199600"
            - "DistributionOrder.${below_id}.freight_cents == 8089 (raw 3000 + 5988 = 8988, tier 0.10 -> discount round_half_up(898.8) == 899)"
            - "DistributionOrder.${below_id}.landed_cost_cents == 207689"
            - "The lower-volume order therefore lands DEARER in total than the boundary order"

