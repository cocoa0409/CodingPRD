  - section: endpoints
    instances:
      - name: nurse_crud_round_trip_patches_one_field_and_leaves_the_rest_of_the_roster_row_intact
        claim_type: standard_crud
        grounds:
          - endpoints[POST /nurses]
          - endpoints[GET /nurses/{id}]
          - endpoints[GET /nurses]
          - endpoints[PATCH /nurses/{id}]
        distinguishing_aspect: |
          The PATCH is a partial update with four optional fields: sending only
          acuity_capacity_points must leave full_name, both shift bounds and status exactly
          as created while advancing version 1 -> 2 and updated_at to the current clock.
          The collection read is filterable on center_id and status only, so an INACTIVE
          nurse disappears from a status=ACTIVE listing while still being retrievable by id
          — the row is never deleted and no DELETE endpoint exists.
        test_recipe:
          setup:
            - "Two centers, and two nurses at the first center plus one at the second, all ACTIVE at creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr1: $.data.id }
            - call: "POST /infusion-centers"
              payload: { name: "Northgate Away Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr2: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr1}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id, nr1_version: $.data.version, nr1_name: $.data.full_name }
            - call: "POST /nurses"
              payload: { center_id: "${ctr1}", full_name: "Nils Berg", acuity_capacity_points: 8, shift_start_minute: 600, shift_end_minute: 1140 }
              as: Scheduler
              captures: { nr2: $.data.id, nr2_status: $.data.status }
            - call: "POST /nurses"
              payload: { center_id: "${ctr2}", full_name: "Nia Cruz", acuity_capacity_points: 4, shift_start_minute: 480, shift_end_minute: 960, status: "ACTIVE" }
              as: Scheduler
              captures: { nr3: $.data.id }
          trigger:
            - call: "GET /nurses/${nr1}"
              payload: {}
              as: MedicalDirector
              captures: { read_name: $.data.full_name, read_cap: $.data.acuity_capacity_points, read_load: $.data.assigned_acuity_points }
            - call: "GET /nurses"
              payload: { center_id: "${ctr1}", status: "ACTIVE" }
              as: Scheduler
              captures: { list_first: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: Scheduler
            - call: "PATCH /nurses/${nr1}"
              payload: { acuity_capacity_points: 9 }
              as: Scheduler
              captures: { patched_cap: $.data.acuity_capacity_points, patched_name: $.data.full_name, patched_start: $.data.shift_start_minute, patched_end: $.data.shift_end_minute, patched_status: $.data.status, patched_version: $.data.version, patched_updated: $.data.updated_at }
            - call: "PATCH /nurses/${nr2}"
              payload: { status: "INACTIVE" }
              as: Scheduler
              captures: { nr2_now: $.data.status }
            - call: "GET /nurses"
              payload: { center_id: "${ctr1}", status: "ACTIVE" }
              as: Scheduler
              captures: { active_first: "$.data[0].id" }
            - call: "GET /nurses/${nr2}"
              payload: {}
              as: Scheduler
              captures: { nr2_still_there: $.data.id }
          assert:
            - "${read_name} == 'Nora Ade' and ${read_cap} == 6 and ${read_load} == 0"
            - "${nr2_status} == 'ACTIVE' — the omitted status input took its declared default"
            - "The first listing returns exactly 2 rows (both ${ctr1} nurses) and never ${nr3}; ${list_first} is one of them"
            - "${patched_cap} == 9 while ${patched_name} == 'Nora Ade', ${patched_start} == 480, ${patched_end} == 1140 and ${patched_status} == 'ACTIVE'"
            - "${patched_version} == 2 (created at 1) and ${patched_updated} == '2026-08-02T00:00:00Z' while created_at is still '2026-08-01T00:00:00Z'"
            - "${nr2_now} == 'INACTIVE' and the second ACTIVE listing returns exactly 1 row with ${active_first} == ${nr1}"
            - "${nr2_still_there} == ${nr2} — the row survives the status change and GET /nurses with no status filter returns 2 rows for ${ctr1}"
            - "Nurse.${nr3}.center_id == ${ctr2} and is never returned by any ${ctr1}-filtered listing"

      - name: the_reminder_response_action_records_one_outcome_and_refuses_a_second_answer
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /reminder-contacts/{id}/response]
          - validations[priority 51]
          - errors[ERR_REMINDER_ALREADY_ANSWERED]
          - entities.ReminderContact.fields.outcome
        distinguishing_aspect: |
          The action mutates exactly one field on an existing row rather than creating one,
          and its guard is the row's own outcome: NO_RESPONSE accepts an answer,
          anything else is a 409. Answering CONFIRM_ATTENDANCE must NOT touch the
          appointment — the visit is still TENTATIVE with its chair intact afterwards — and
          a second answer, even with the identical outcome value, is refused rather than
          treated as idempotent.
        test_recipe:
          setup:
            - "Standing center, chair, nurse, drug, MID template, one 70 kg patient with an ACTIVE 6-cycle plan and a TENTATIVE visit on 2026-08-10 at 540."
            - "One SMS reminder is sent for that visit."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl1: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id }
            - call: "POST /appointments/${ap1}/reminders"
              payload: { channel: "SMS" }
              as: Scheduler
              captures: { rc1: $.data.id, rc1_outcome: $.data.outcome }
          trigger:
            - call: "POST /reminder-contacts/${rc1}/response"
