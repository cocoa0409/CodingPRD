    code: 201
    input: ["agreement_id", "expected_agreement_version"]
    output: RentalWeek
    side_effects:
      - "RentalWeek created SCHEDULED then auto-transitioned to OPEN within this request"
      - "increments RentalAgreement.version by 1"
      - "RentalAgreement.current_week_number advanced"
      - "weekly_renewal_charge computed provisionally"
  - method: GET
    path: "/program/weeks/{id}"
    description: "Fetch one weekly rental period"
    roles: [PlatformAdmin, FleetOpsAgent, ComplianceOfficer, SupportAgent, Driver]
    code: 200
    input: [""]
    output: RentalWeek
    side_effects: []
  - method: GET
    path: "/program/weeks"
    description: "List weekly periods for an agreement or vehicle"
    roles: [PlatformAdmin, FleetOpsAgent, ComplianceOfficer, SupportAgent]
    code: 200
    input: ["agreement_id?", "vehicle_id?", "week_status?", "payment_status?", "limit?", "offset?"]
    output: RentalWeek[]
    side_effects: []
  - method: POST
    path: "/program/weeks/{id}/mileage"
    description: "Record the miles driven in the week from the platform trip feed or a manual submission"
    roles: [FleetOpsAgent, ComplianceOfficer]
    code: 200
    input: ["miles_driven"]
    output: RentalWeek
    side_effects:
      - "RentalWeek.miles_driven updated"
