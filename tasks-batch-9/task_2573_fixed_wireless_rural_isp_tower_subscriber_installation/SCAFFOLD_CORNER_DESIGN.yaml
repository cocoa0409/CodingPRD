              payload: { measured_tree_line_height_m: 5.5, measured_roof_height_m: 4.0, structure_penetration_allowed: true }
              as: FieldTech
              as_user_id: "tech-1001"
              captures: { status_second_survey: $.data.status, mount_second_survey: $.data.recommended_mounting_type }
          assert:
            - "${status_after_survey} == \"RESURVEY_REQUIRED\", ${mast_after_survey} == 5.0, ${mount_after_survey} == \"ROOF_MAST_GUYED\" and ${resurveys} == 1"
            - "The first reschedule returns HTTP 200 with ${status_after_resched} == \"SCHEDULED\", ${sched_after} == \"2026-08-09T15:00:00Z\" and ${wo_v2} == ${wo_v} + 1"
            - "${mast_kept} == 5.0, ${mount_kept} == \"ROOF_MAST_GUYED\" and ${resurveys_kept} == 1 - reschedule clears nothing and does not count as another resurvey"
            - "The second reschedule returns HTTP 409 with ${err_state} == \"ERR_WORK_ORDER_STATE_INVALID\" because the order is SCHEDULED again"
            - "That failed call leaves scheduled_at at \"2026-08-09T15:00:00Z\" and the version at ${wo_v2}"
            - "The re-survey then succeeds from SCHEDULED: ${status_second_survey} == \"EXCEPTION_PENDING\" and ${mount_second_survey} == \"ROOF_MAST_GUYED\", proving the RESURVEY_REQUIRED -> SCHEDULED loop is genuinely re-enterable"

  - section: errors
    instances:
      - name: every_addressable_resource_family_returns_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TOWER_NOT_FOUND
          - errors.ERR_CIRCUIT_NOT_FOUND
          - errors.ERR_LICENSE_NOT_FOUND
          - errors.ERR_SECTOR_NOT_FOUND
          - errors.ERR_COORDINATION_NOT_FOUND
          - errors.ERR_PLAN_NOT_FOUND
          - errors.ERR_REQUEST_NOT_FOUND
          - errors.ERR_HOLD_NOT_FOUND
          - errors.ERR_SUBSCRIBER_NOT_FOUND
          - errors.ERR_WORK_ORDER_NOT_FOUND
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - errors.ERR_OUTAGE_NOT_FOUND
          - errors.ERR_CREDIT_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: |
          Thirteen distinct 404 codes share one priority row, so the tempting shortcut is a single
          generic ERR_NOT_FOUND or a copy-paste that reuses the first family's code on every route. Each
          route must name its own resource family, and the probe runs against a database that already
          holds one real tower - the codes come from resolving the path id, not from an empty store.
        test_recipe:
          setup:
            - "One real tower exists so the store is non-empty; the probed id 00000000-0000-0000-0000-000000000000 belongs to no row of any type."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { real_tower: $.data.id }
          trigger:
            - call: "GET /towers/00000000-0000-0000-0000-000000000000"
              as: NetworkEngineer
              captures: { err_tower: $.data.error_id }
            - call: "GET /backhaul-circuits/00000000-0000-0000-0000-000000000000"
              as: NetworkEngineer
              captures: { err_circuit: $.data.error_id }
            - call: "GET /spectrum-licenses/00000000-0000-0000-0000-000000000000"
              as: NetworkEngineer
              captures: { err_license: $.data.error_id }
            - call: "GET /sectors/00000000-0000-0000-0000-000000000000"
              as: CapacityPlanner
              captures: { err_sector: $.data.error_id }
            - call: "GET /interference-coordinations/00000000-0000-0000-0000-000000000000"
              as: NetworkEngineer
              captures: { err_coordination: $.data.error_id }
            - call: "GET /service-plans/00000000-0000-0000-0000-000000000000"
              as: SalesAgent
              captures: { err_plan: $.data.error_id }
            - call: "GET /serviceability-requests/00000000-0000-0000-0000-000000000000"
              as: SalesAgent
              captures: { err_request: $.data.error_id }
            - call: "GET /capacity-holds/00000000-0000-0000-0000-000000000000"
              as: SalesAgent
              captures: { err_hold: $.data.error_id }
            - call: "GET /subscribers/00000000-0000-0000-0000-000000000000"
              as: SalesAgent
              captures: { err_subscriber: $.data.error_id }
            - call: "GET /install-work-orders/00000000-0000-0000-0000-000000000000"
              as: FieldTech
              captures: { err_work_order: $.data.error_id }
            - call: "GET /equipment-assignments/00000000-0000-0000-0000-000000000000"
              as: FieldTech
              captures: { err_assignment: $.data.error_id }
            - call: "GET /outage-events/00000000-0000-0000-0000-000000000000"
              as: BillingAdmin
              captures: { err_outage: $.data.error_id }
            - call: "GET /outage-credits/00000000-0000-0000-0000-000000000000"
              as: BillingAdmin
              captures: { err_credit: $.data.error_id }
          assert:
            - "All thirteen reads return HTTP 404"
            - "${err_tower} == \"ERR_TOWER_NOT_FOUND\" and ${err_circuit} == \"ERR_CIRCUIT_NOT_FOUND\""
            - "${err_license} == \"ERR_LICENSE_NOT_FOUND\" and ${err_sector} == \"ERR_SECTOR_NOT_FOUND\""
            - "${err_coordination} == \"ERR_COORDINATION_NOT_FOUND\" and ${err_plan} == \"ERR_PLAN_NOT_FOUND\""
            - "${err_request} == \"ERR_REQUEST_NOT_FOUND\" and ${err_hold} == \"ERR_HOLD_NOT_FOUND\""
            - "${err_subscriber} == \"ERR_SUBSCRIBER_NOT_FOUND\" and ${err_work_order} == \"ERR_WORK_ORDER_NOT_FOUND\""
            - "${err_assignment} == \"ERR_ASSIGNMENT_NOT_FOUND\" and ${err_outage} == \"ERR_OUTAGE_NOT_FOUND\""
            - "${err_credit} == \"ERR_CREDIT_NOT_FOUND\""
            - "The thirteen captured codes are pairwise distinct, and GET /towers/${real_tower} still returns HTTP 200"

