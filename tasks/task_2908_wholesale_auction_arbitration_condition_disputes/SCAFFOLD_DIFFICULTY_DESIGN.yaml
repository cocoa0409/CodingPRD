          assert:
            - "hop 1 — HTTP 201, response.data.allowance_variant == \"NEGOTIATED_ACCEPT\" and response.data.allowance_cents == 200000; GET /arbitration/cases/${case_id}/negotiation-rounds shows the round as ACCEPTED"
            - "hop 2 — GET /arbitration/cases/${case_id} returns status == \"RESOLVED_ALLOWANCE\"; GET /arbitration/sales/${sale1_id} returns arbitration_status == \"RESOLVED\" and open_case_count == 0"
            - "hop 3 — GET /arbitration/sellers/${seller_id}/scorecard returns rolling_window_sales_count == 4, rolling_window_upheld_count == 1, rolling_arbitration_rate_bps == 2500, lifetime_sales_count == 4, lifetime_upheld_count == 1, lifetime_arbitration_rate_bps == 2500"
            - "hop 4 — GET /arbitration/sellers/${seller_id} returns policy_tier == \"BLOCKED\" and blocked_at_utc == \"2026-08-01T00:00:00Z\""
            - "hop 4 — GET /arbitration/sellers/${seller_id}/policy-actions returns exactly 1 row with action_type == \"BLOCK\", from_tier == \"GOOD_STANDING\", to_tier == \"BLOCKED\", rolling_rate_bps_at_action == 2500 and triggered_by_case_id == \"${case_id}\""
            - "hop 5 — GET /arbitration/sales/${sale2_id}, ${sale3_id} and ${sale4_id} each return settlement_hold == true and settlement_status == \"UNSETTLED\""
            - "hop 5 conditional filter — GET /arbitration/sales/${sale1_id} returns settlement_hold == false, because the hold cascade only touches sales whose arbitration_status is NONE and sale 1 is the claimed sale"
            - "GET /arbitration/cases/${case_id}/policy-actions returns the same single BLOCK row, proving the action is attributed to the triggering case"
            - "GET /arbitration/sales/${sale1_id}/ledger-entries returns 0 rows and GET /arbitration/cases/${case_id}/ledger-entries returns exactly the 2 REPAIR_ALLOWANCE rows summing to 0 — the cascade posted no money against the untouched sales"

      - name: third_frivolous_denial_cascades_four_hops_to_inspection_expiry
        grounds:
          - state_machines.Buyer.ACTIVE_to_FEE_HOLD
          - state_machines.Buyer.FEE_HOLD_to_SUSPENDED
          - state_machines.PostSaleInspection.REQUESTED_to_EXPIRED_by_suspension
          - calculations.frivolous_fee_assessment
          - entities.FrivolousFeeAssessment.fields.prior_frivolous_count
        distinguishing_aspect: |
          A four-hop chain whose trigger is a COUNTER crossing a threshold rather than a
          state, and whose last hop reaches an unrelated entity on an unrelated sale: the
          third FRIVOLOUS_DENIED decision assesses a fee that is clipped by the cap,
          pushes frivolous_claim_count to the suspension threshold, moves the buyer from
          FEE_HOLD to the terminal SUSPENDED, and only then expires a PostSaleInspection
          on a fourth sale that no decision in the chain refers to. The first two denials
          prove the chain stops at hop 3 (FEE_HOLD, inspection still REQUESTED).
