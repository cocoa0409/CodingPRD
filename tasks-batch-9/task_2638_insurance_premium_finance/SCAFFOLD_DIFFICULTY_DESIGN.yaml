      - name: note_settlement_residual_zero_across_power_of_attorney_and_carrier_return
        grounds:
          - calculations.deficiency_and_agent_chargeback.settlement_invariant
          - calculations.unearned_finance_charge_rebate
          - calculations.unearned_premium_return_estimate
          - endpoints.POST_agreements_agreement_id_cancellation_executions
          - endpoints.POST_carrier_cancellation_requests_request_id_return_posting
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: note_settlement_residual_cents ==
          (total_of_payments_cents + every non-WAIVED, non-REVERSED late fee)
          - (POSTED payments + total rebate granted + unearned_premium_received_cents
          + deficiency_before_fee + unapplied_credit_cents), which must be 0 once the note is settled.
          Where total_receivable_cents is a balance-sheet identity checked before and after a single
          reversible write, this one is a whole-life closure identity that has to hold across three
          different settlement channels at once - the unearned finance charge rebate granted when the
          power of attorney fires, the unearned premium the carriers actually return, and the residual
          written off as a deficiency - and it is only zero if the rebate is netted against unpaid
          finance charge instead of against principal. The probe is the deficiency FEE: it is new
          revenue rather than a redistribution of the note, so it sits OUTSIDE the identity, and an
          implementation that lets it leak in produces a residual of exactly -5000.
