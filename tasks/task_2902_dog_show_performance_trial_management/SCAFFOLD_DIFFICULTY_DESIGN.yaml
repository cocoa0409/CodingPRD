            - call: "POST /dog-shows/entries/${e2_id}/confirm"
              payload: {}
              as: ShowSecretary
          trigger:
            - call: "POST /dog-shows/entries/${e3_id}/confirm"
              payload: {}
              as: ShowSecretary
          assert:
            - "Entry.${e1_id}.levy_cents == 263"
            - "Entry.${e2_id}.levy_cents == 263"
            - "Entry.${e3_id}.levy_cents == 263"
            - "Show.${show_id}.levy_total_cents == 789"
            - "Show.${show_id}.fee_charged_cents == 11813"
