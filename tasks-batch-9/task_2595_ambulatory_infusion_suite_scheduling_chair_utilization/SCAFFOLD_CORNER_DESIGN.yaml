              captures: { answered: $.data.outcome, answered_id: $.data.id }
            - call: "POST /reminder-contacts/${rc1}/response"
              payload: { outcome: "CONFIRM_ATTENDANCE" }
              as: Scheduler
              captures: { err_again: $.data.error_id }
          assert:
            - "${rc1_outcome} == 'NO_RESPONSE' at creation and sequence_number == 1"
            - "First trigger HTTP status == 200 with ${answered} == 'CONFIRM_ATTENDANCE' and ${answered_id} == ${rc1} — no new row is created"
            - "${err_again} == 'ERR_REMINDER_ALREADY_ANSWERED' with HTTP 409 — the repeat is refused, not silently accepted"
            - "GET /reminder-contacts filtered by appointment_id == ${ap1} still returns exactly 1 row"
            - "Appointment.${ap1}.schedule_status == 'TENTATIVE' and chair_id == ${ch1} — a CONFIRM_ATTENDANCE answer has no scheduling side effect"
            - "Chair.${ch1}.committed_minutes == 240 and Patient.${pt1}.no_show_strikes == 0"

      - name: one_sweep_call_is_global_for_the_first_three_steps_and_center_scoped_for_the_fourth
        claim_type: bulk_action
