  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: audit_finalize_cascade_asset_lost_then_location_recompute_depth3
        grounds:
          - state_machines.AuditReconciliation.DRAFT_to_FINALIZED
          - state_machines.Asset.AVAILABLE_to_LOST
          - entities.Asset.fields.condition
          - entities.Location.fields.physical_balance
          - entities.AuditReconciliation.fields.declared_loss_qty
        distinguishing_aspect: |
          Depth-3 chain from audit finalize: (1) AuditReconciliation -> FINALIZED pins declared_loss_qty=3;
          (2) that mutation marks 3 AVAILABLE Assets LOST; (3) each Asset->LOST itself forces a recompute
          of Location.physical_balance (drops by 3). Each hop is caused by the prior hop, not the finalize
          directly.
        test_recipe:
          setup:
            - "Location L1 OPEN with equity_balance=5 (5 assets issued in via ISSUANCE) and physical_balance=5; counted_physical=2 at finalize -> shortfall 3"
          setup_api_calls:
            - call: "POST /pool-policies"
              payload: { name: "CHEP Blue", currency: "USD" }
              as: PoolAdmin
            - call: "POST /asset-types"
              payload: { code: "PALLET_STD", name: "Standard Pallet", base_daily_rate_cents: 500, replacement_cost_cents: 3000 }
              as: PoolAdmin
              captures: { at_id: $.data.id }
            - call: "POST /accounts"
              payload: { legal_name: "Acme", role_type: "MANUFACTURER", credit_limit_cents: 100000 }
              as: PoolAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "Stock" }
              as: PoolAdmin
              captures: { stock_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", name: "L1" }
              as: PoolAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "X1", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { x1: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "X2", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { x2: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "X3", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { x3: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "X4", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { x4: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "X5", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { x5: $.data.id }
            - call: "POST /transfer-orders"
              payload: { from_location_id: "${stock_id}", to_location_id: "${l1_id}", kind: "ISSUANCE", asset_ids: ["${x1}","${x2}","${x3}","${x4}","${x5}"] }
              as: PoolOperator
              captures: { to_id: $.data.id }
            - call: "POST /transfer-orders/${to_id}/dispatch"
              payload: {}
              as: PoolOperator
            - call: "POST /transfer-orders/${to_id}/receive"
              payload: {}
              as: PoolOperator
            - call: "POST /audit-reconciliations"
              payload: { location_id: "${l1_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-30T00:00:00Z", counted_physical: 2, loss_basis: "REPLACEMENT" }
              as: PoolOperator
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /audit-reconciliations/${audit_id}/finalize"
              payload: {}
              as: PoolOperator
              captures: { qty: $.data.declared_loss_qty }
            - call: "GET /locations/${l1_id}"
              payload: {}
              as: PoolOperator
              captures: { phys: $.data.physical_balance }
          assert:
            - "AuditReconciliation.${audit_id}.declared_loss_qty == 3"
            - "AuditReconciliation.${audit_id}.declared_loss_cents == 9000"
            - "Location.${l1_id}.physical_balance == 2"
            - "Location.${l1_id}.equity_balance == 5"

      - name: transfer_dispatch_cascade_asset_in_transit_then_origin_balance_depth2
        grounds:
          - state_machines.TransferOrder.DRAFT_to_DISPATCHED
          - state_machines.Asset.AVAILABLE_to_IN_TRANSIT
          - entities.Asset.fields.condition
          - entities.Location.fields.physical_balance
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (transfer dispatch, not audit finalize): (1) dispatch
          flips each manifest Asset to IN_TRANSIT; (2) the Assets leaving the origin forces origin
          Location.physical_balance to drop by the manifest size — second link caused by the first.
        test_recipe:
          setup:
            - "Location A OPEN with 3 AVAILABLE assets (physical_balance=3); DRAFT TRANSFER order of all 3 from A to B"
