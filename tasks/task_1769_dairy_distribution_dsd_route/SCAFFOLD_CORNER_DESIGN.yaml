              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { dr2: "$.data.id" }
          trigger:
            - { call: "GET /dairy/drivers/${dr1}/weekly-settlement?week_start=2026-08-10", payload: { week_start: "2026-08-10" }, as: RouteDriver, as_user_id: "${dr1}", captures: { ok_settle: "$.data.settlement_cents" } }
            - { call: "GET /dairy/drivers/${dr1}/weekly-settlement?week_start=2026-08-10", payload: { week_start: "2026-08-10" }, as: RouteDriver, as_user_id: "${dr2}", captures: { err1: "$.data.error_id" } }
            - { call: "GET /dairy/drivers/${dr1}/weekly-settlement?week_start=2026-08-10", payload: { week_start: "2026-08-10" }, as: DistributorOwner, as_user_id: "${d2}", captures: { err2: "$.data.error_id" } }
          assert:
            - "ok_settle == 0 (self-read allowed; empty week settles to 0)"
            - "err1 == ERR_OWNERSHIP_MISMATCH (driver reading another driver's settlement)"
            - "err2 == ERR_OWNERSHIP_MISMATCH (distributor reading a driver it does not employ)"

  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_par_upsert_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[par-upsert-stale-store]", "errors[ERR_STALE_STORE_VERSION]"]
        distinguishing_aspect: "Two sequential par upserts carrying the SAME observed store version: the first succeeds (version 1 -> 2), the second with the stale version is rejected 412 ERR_STALE_STORE_VERSION; refetching and retrying succeeds."
        test_recipe:
          setup: ["Distributor, ACTIVE route, store S1 (version 1), product P1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: TerritoryManager }
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist GA", license_number: "LIC-GA-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-GA", name: "Route GA", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: "$.data.id" }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-GA", name: "Store GA", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: "$.data.id", s_v1: "$.data.version" }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
            - call: "POST /dairy/products"
              payload: { sku: "OCC-1", name: "Occ Prod", units_per_case: 1, shelf_life_days: 30, regulated: false, list_price_cents: 100 }
              as: TerritoryManager
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /dairy/stores/${s1}/standing-pars"
              payload: { product_id: "${p1}", expected_store_version: "${s_v1}", par_mon: 5 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { par1: "$.data.id" }
            - call: "POST /dairy/stores/${s1}/standing-pars"
              payload: { product_id: "${p1}", expected_store_version: "${s_v1}", par_mon: 9 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { err: "$.data.error_id" }
            - { call: "GET /dairy/stores/${s1}", as: Any, captures: { s_v2: "$.data.version" } }
            - call: "POST /dairy/stores/${s1}/standing-pars"
              payload: { product_id: "${p1}", expected_store_version: "${s_v2}", par_mon: 9 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { par2: "$.data.id" }
          assert:
            - "First upsert succeeds; err == ERR_STALE_STORE_VERSION on the stale retry (412)"
            - "s_v2 == s_v1 + 1 (each successful upsert bumps Store.version by exactly 1)"
            - "Third upsert with the fresh version succeeds; StandingPar.${par1}.status == SUPERSEDED"

      - name: occ_announcement_publish_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[announcement-publish-stale-period]", "errors[ERR_STALE_PRICING_PERIOD_VERSION]"]
        distinguishing_aspect: "Publishing with an expected_pricing_period_version captured before another publish is rejected 412 ERR_STALE_PRICING_PERIOD_VERSION; each successful publish bumps PricingPeriod.version by 1."
        test_recipe:
          setup: ["Pricing period 2026-08 (version 1)"]
          setup_api_calls:
            - call: "POST /dairy/pricing-periods"
              payload: { month: "2026-08" }
              as: MarketAdministrator
              captures: { per1: "$.data.id", p_v1: "$.data.version" }
          trigger:
            - call: "POST /dairy/pricing-periods/${per1}/announcements"
              payload: { kind: "PROVISIONAL", class_i_base_cents_per_cwt: 2000, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 299, expected_pricing_period_version: "${p_v1}" }
              as: MarketAdministrator
              captures: { ann1: "$.data.id" }
            - call: "POST /dairy/pricing-periods/${per1}/announcements"
              payload: { kind: "PROVISIONAL", class_i_base_cents_per_cwt: 2050, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 299, expected_pricing_period_version: "${p_v1}" }
              as: MarketAdministrator
              captures: { err: "$.data.error_id" }
            - { call: "GET /dairy/pricing-periods/${per1}", as: Any, captures: { p_v2: "$.data.version" } }
            - call: "POST /dairy/pricing-periods/${per1}/announcements"
              payload: { kind: "PROVISIONAL", class_i_base_cents_per_cwt: 2050, processor_assessment_cents_per_cwt: 35, hauling_cents_per_cwt: 60, diesel_index_cents: 299, expected_pricing_period_version: "${p_v2}" }
              as: MarketAdministrator
              captures: { ann2: "$.data.id" }
          assert:
            - "err == ERR_STALE_PRICING_PERIOD_VERSION (412) for the stale publish"
            - "p_v2 == p_v1 + 1; the fresh-version republish succeeds and supersedes ann1"
            - "PriceAnnouncement.${ann1}.status == SUPERSEDED and PriceAnnouncement.${ann2}.status == ACTIVE"

      - name: occ_store_patch_stale_and_increment
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[store-config-patch-stale]", "entities.Store.fields.pull_window_days"]
        distinguishing_aspect: "PATCH with the creation version succeeds once (pull_window_days 4 -> 6, version 1 -> 2); replaying the same version is rejected 412; computed fields are not patchable."
        test_recipe:
          setup: ["Distributor, ACTIVE route, store S1 (version 1, pull_window_days default 4)"]
          setup_api_calls:
            - call: "POST /dairy/distributors"
              payload: { name: "Dairy Dist GB", license_number: "LIC-GB-1" }
              as: TerritoryManager
              captures: { d1: "$.data.id" }
            - call: "POST /dairy/routes"
              payload: { distributor_id: "${d1}", route_code: "R-GB", name: "Route GB", service_weekdays: ["MON"] }
              as: TerritoryManager
              captures: { r1: "$.data.id" }
            - call: "POST /dairy/stores"
              payload: { route_id: "${r1}", store_code: "S-GB", name: "Store GB", credit_limit_cents: 100000000 }
              as: DistributorOwner
              as_user_id: "${d1}"
              captures: { s1: "$.data.id", s_v1: "$.data.version" }
            - { call: "POST /dairy/routes/${r1}/activate", payload: {}, as: TerritoryManager }
          trigger:
            - { call: "PATCH /dairy/stores/${s1}", payload: { expected_store_version: "${s_v1}", pull_window_days: 6 }, as: DistributorOwner, as_user_id: "${d1}", captures: { s_pull: "$.data.pull_window_days", s_v2: "$.data.version" } }
            - { call: "PATCH /dairy/stores/${s1}", payload: { expected_store_version: "${s_v1}", credit_limit_cents: 5 }, as: DistributorOwner, as_user_id: "${d1}", captures: { err: "$.data.error_id" } }
            - { call: "GET /dairy/stores/${s1}", as: Any, captures: { s_limit_after: "$.data.credit_limit_cents" } }
          assert:
            - "s_pull == 6 and s_v2 == s_v1 + 1"
            - "err == ERR_STALE_STORE_VERSION (replayed version)"
            - "s_limit_after == 100000000 (rejected PATCH applied nothing)"

      - name: rate_threshold_triggers_covered
        claim_type: rate_threshold_triggers
        grounds: ["calculations.temperature_excursion"]
        excluded_because:
          difficulty_instance: excursion_45_minutes_breach_boundary
          rationale: "Cumulative 45.0-minute inclusive boundary asserted there; the instantaneous >50.0F spike asserted in corner trip_qa_review_requires_breach_and_clear_path (51.0F single reading breaches at 1.0 cumulative minute)."

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: ["state_machines.TruckTrip.QA_REVIEW_to_BREACH_CONFIRMED", "state_machines.Store.ACTIVE_to_INACTIVE"]
        excluded_because:
          difficulty_instance: qa_breach_cascade_five_deep
          rationale: "Both cascade chains asserted end-to-end by qa_breach_cascade_five_deep (depth 5) and store_deactivation_cascade_releases_trip_cases (depth 3)."

      - name: dual_variant_calculation_covered
        claim_type: dual_variant_calculation
        grounds: ["calculations.regulated_milk_unit_price", "calculations.return_credit_amount"]
        excluded_because:
          difficulty_instance: invoice_provisional_vs_final_true_up
          rationale: "Both variant pairs asserted with literal deltas: 86c true-up (Invoice domain) and 86c basis divergence (Return domain)."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_covered
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model"]
        excluded_because:
          difficulty_instance: qa_breach_cascade_five_deep
          rationale: "Immediate read-after-write visibility of all cascaded mutations is asserted in the deliver-response corner deliver_response_immediate_consistency and in the cascade asserts (same-request chains observe invoice/memo/order mutations with no delay)."
