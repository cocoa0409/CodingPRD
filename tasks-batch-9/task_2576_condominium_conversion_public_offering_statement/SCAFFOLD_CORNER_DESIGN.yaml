        distinguishing_aspect: "The derivation is first-match top-down, never a combination. This project
          satisfies a FROZEN clause (suitability_gate == FAILED) AND three RESTRICTED clauses (no RECORDED
          package, no EFFECTIVE POS, gate not PASSED) at the same time, so the answer must be FROZEN.
