  - rule_id: cross_entity_state_dependency
    instances:
      - name: appointment_booking_gated_on_pickup_route_publication_state
        grounds:
          - validations[priority=9]
          - state_machines.PickupRoute.status.DRAFT_to_PUBLISHED
          - state_machines.ReturnCase.logistics_status.REQUESTED_to_PICKUP_SCHEDULED
          - endpoints[POST /pickup-appointments]
          - errors.ERR_ROUTE_NOT_PUBLISHED
        distinguishing_aspect: |
          The blocking state lives on the PARENT resource (PickupRoute.status) while every field of
          the request itself is valid: the slot is inside the window, capacity is free, no other
          appointment exists and the version matches. Only publishing the route - a write on a
          different entity, with no change to the appointment payload - makes the identical request
          succeed.
        test_recipe:
          setup:
            - "One QUEEN MEDIUM MattressModel priced 120000 cents, break_in_nights 21, trial_nights 100."
            - "One Customer with a DTC TrialOrder delivered 2026-08-01 and a ReturnCase opened 2026-09-10 in logistics_status REQUESTED."
            - "One PickupRoute in CA on 2026-09-15, window 08:00-18:00, capacity_units 6, left in status DRAFT."
