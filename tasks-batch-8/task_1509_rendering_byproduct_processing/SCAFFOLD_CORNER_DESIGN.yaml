            - "Second finalize by 'pmgr-1': status FINALIZED"

  # ==================================================================
  - section: complexity_layers
    instances:
      - name: occ_order_create_stale_contract_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-create-stale-contract]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating order1 advances CustomerContract.version 3 -> 4; a second create still carrying expected_contract_version 3 is rejected 412 ERR_STALE_VERSION, while a re-read version succeeds."
        test_recipe:
          setup: ["plant; FIXED contract ACTIVE (version 3 after create/submit/approve)"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts", payload: { plant_id: "${plant_id}", customer_name: "Cust A", product_type: "TALLOW", spec_max_moisture_pct: 0.5, spec_max_ffa_pct: 4.0, spec_min_protein_pct: 0, pricing_mode: "FIXED", base_price_cents_per_lb: 50, volume_commitment_lbs: 1000, tier_discounts: [], margin_floor_pct: 15.0, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: SalesManager, as_user_id: "sm-1", captures: { con_id: $.data.id } }
            - { call: "POST /rendering/customer-contracts/${con_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /rendering/customer-contracts/${con_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1", captures: { con_v: $.data.version } }
          trigger:
            - { call: "POST /rendering/sales-orders", payload: { contract_id: "${con_id}", plant_id: "${plant_id}", quantity_lbs: 100, requested_ship_date: "2026-08-20", expected_contract_version: "${con_v}" }, as: SalesManager, as_user_id: "sm-1", captures: { ord1: $.data.id } }
            - { call: "POST /rendering/sales-orders", payload: { contract_id: "${con_id}", plant_id: "${plant_id}", quantity_lbs: 200, requested_ship_date: "2026-08-21", expected_contract_version: "${con_v}" }, as: SalesManager, as_user_id: "sm-1", captures: { err1: $.data.error_id } }
            - { call: "GET /rendering/customer-contracts/${con_id}", as: Any, captures: { con_v2: $.data.version } }
            - { call: "POST /rendering/sales-orders", payload: { contract_id: "${con_id}", plant_id: "${plant_id}", quantity_lbs: 200, requested_ship_date: "2026-08-21", expected_contract_version: "${con_v2}" }, as: SalesManager, as_user_id: "sm-1", captures: { ord2: $.data.id } }
          assert:
            - "Order1 created (201); contract.version advanced by 1 (3 -> 4)"
            - "Second create with stale ${con_v}: ${err1} == ERR_STALE_VERSION (412)"
            - "Third create with fresh ${con_v2} (4): 201, SalesOrder.${ord2} DRAFT"

      - name: occ_stop_create_stale_route_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[stop-create-stale-route]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Adding stop1 advances CollectionRoute.version 1 -> 2; a second stop create carrying expected_route_version 1 is rejected 412 ERR_STALE_VERSION — even though the route is still PLANNED and would otherwise accept the stop."
        test_recipe:
          setup: ["plant; supplier + ACTIVE agreement; vehicle; route PLANNED (version 1)"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 100000, duty_class: "RAW_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r1: $.data.id, rv: $.data.version } }
          trigger:
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 5000, estimated_distance_miles: 10, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s1: $.data.id } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 2, scheduled_window_start: "2026-08-10T10:00:00Z", scheduled_window_end: "2026-08-10T11:00:00Z", estimated_weight_lbs: 4000, estimated_distance_miles: 5, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { err1: $.data.error_id } }
          assert:
            - "Stop1 created (201); route.version now 2"
            - "${err1} == ERR_STALE_VERSION (412); route has exactly 1 stop"

      - name: occ_agreement_amend_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-amend-stale-agreement]", "errors[ERR_STALE_VERSION]", state_machines.SupplierAgreement]
        distinguishing_aspect: "Amend keeps the agreement ACTIVE while bumping version 3 -> 4; a second amend replaying the pre-amend version is rejected 412 ERR_STALE_VERSION — the only deterministic guard since the state machine offers no rejection."
        test_recipe:
          setup: ["plant; supplier; agreement ACTIVE at version 3"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1", captures: { agr_v: $.data.version } }
          trigger:
            - { call: "POST /rendering/supplier-agreements/${agr_id}/amend", payload: { expected_agreement_version: "${agr_v}", per_lb_fee_cents: 4 }, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/amend", payload: { expected_agreement_version: "${agr_v}", per_lb_fee_cents: 5 }, as: ProcurementManager, as_user_id: "pm-2", captures: { err1: $.data.error_id } }
            - { call: "GET /rendering/supplier-agreements/${agr_id}", as: Any }
          assert:
            - "First amend: 200, per_lb_fee_cents == 4, version == ${agr_v} + 1, status still ACTIVE"
            - "Second amend with the stale version: ${err1} == ERR_STALE_VERSION (412); per_lb_fee_cents stays 4"

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.Plant.OPERATING_to_SUSPENDED]
        excluded_because:
          difficulty_instance: odor_confirm_permit_plant_route_cascade
          rationale: "The N-level cascade (odor confirm -> permit count -> permit suspend -> plant posture -> route/stop cancel) is asserted link-by-link in the named §1.8 instance; the strike cascade adds a second trigger in stop_rejection_strike_agreement_cascade."

      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.cook_yield, calculations.pickup_service_fee]
        excluded_because:
          difficulty_instance: cook_yield_theoretical_vs_actual
          rationale: "Variant divergence, selection, and the provisional/final split are asserted with literal values in §1.8 instances cook_yield_theoretical_vs_actual and pickup_fee_provisional_vs_final."

      - name: ops_run_checkpoint_requires_closed_settlement
        claim_type: ops_run_checkpoint
        grounds: ["validations[priority=18]", "errors[ERR_SETTLEMENT_NOT_CLOSED]", endpoints.advance_period]
        distinguishing_aspect: "advance-period against an OPEN (never-closed) settlement fails ERR_SETTLEMENT_NOT_CLOSED (409) and does not increment the epoch; closing first makes the identical call succeed."
        test_recipe:
          setup: ["plant; period-1 settlement still OPEN"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=1", as: Any, captures: { st1: "$.data[0].id" } }
          trigger:
            - { call: "POST /rendering/plants/${plant_id}/advance-period", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1", captures: { err1: $.data.error_id } }
            - { call: "POST /rendering/period-settlements/${st1}/close", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "POST /rendering/plants/${plant_id}/advance-period", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1" }
          assert:
            - "${err1} == ERR_SETTLEMENT_NOT_CLOSED; period stays 1 while OPEN"
            - "After close + advance: current_period_index == 2"

  # ==================================================================
  - section: consistency_model
    instances:
      - name: collect_immediately_visible_across_reads
        claim_type: immediate_visibility
        grounds: [state_machines.RouteStop.ARRIVED_to_COLLECTED, entities.InboundBatch, entities.PeriodSettlement.fields.pickup_fees_accrued_cents]
        distinguishing_aspect: "Immediate consistency: the collect response, the batch reverse-lookup (filtered by route_stop_id), and the settlement read all reflect the mutation without any delay or reconciliation step."
        test_recipe:
          setup: ["plant; supplier + ACTIVE agreement (base 10000, 2/lb, 100/mi, min 0); route DISPATCHED; stop ARRIVED"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "FARM" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/vehicles", payload: { plant_id: "${plant_id}", vehicle_tag: "V1", capacity_lbs: 100000, duty_class: "RAW_MATERIAL" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { veh_id: $.data.id } }
            - { call: "POST /rendering/collection-routes", payload: { plant_id: "${plant_id}", vehicle_id: "${veh_id}", route_code: "R1", service_date: "2026-08-10", scheduled_departure: "2026-08-10T06:00:00Z", scheduled_return: "2026-08-10T18:00:00Z" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { r1: $.data.id, rv: $.data.version } }
            - { call: "POST /rendering/route-stops", payload: { route_id: "${r1}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", plant_id: "${plant_id}", sequence_no: 1, scheduled_window_start: "2026-08-10T08:00:00Z", scheduled_window_end: "2026-08-10T09:00:00Z", estimated_weight_lbs: 5000, estimated_distance_miles: 20, species_tag: "BOVINE", is_dead_stock: false, expected_route_version: "${rv}" }, as: RouteDispatcher, as_user_id: "rd-1", captures: { s1: $.data.id } }
            - { call: "POST /rendering/collection-routes/${r1}/dispatch", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "POST /rendering/route-stops/${s1}/arrive", payload: {}, as: RouteDispatcher, as_user_id: "rd-1" }
          trigger:
            - { call: "POST /rendering/route-stops/${s1}/collect", payload: { actual_weight_lbs: 5000, actual_distance_miles: 20, temperature_f: 62.0 }, as: RouteDispatcher, as_user_id: "rd-1" }
            - { call: "GET /rendering/inbound-batches?route_stop_id=${s1}", as: Any, captures: { bat_id: "$.data[0].id" } }
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=1", as: Any, captures: { st1: "$.data[0].id" } }
            - { call: "GET /rendering/period-settlements/${st1}", as: Any }
            - { call: "GET /rendering/route-stops/${s1}", as: Any }
          assert:
            - "Collect response: status COLLECTED, final_fee_cents == 22000 (10000 + 5000*2 + 20*100, no discount with minimum 0)"
            - "InboundBatch.${bat_id} exists immediately: status RECEIVED, screening_result PENDING, weight_lbs == 5000, route_stop_id == ${s1}"
            - "PeriodSettlement.${st1}.pickup_fees_accrued_cents == 22000 and transport_costs_cents == 3000 in the same read window"
