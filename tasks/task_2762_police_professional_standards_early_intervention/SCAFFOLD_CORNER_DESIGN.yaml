            - "call 1: breached_indicators is the empty list, which is what keeps the score on the boundary instead of 10 points above it"
            - "call 2: HTTP 200; the sweep refreshes the alert that the ingest opened at the WATCH crossing and promotes it"
            - "call 3: ${al_score} == 50.00 and ${al_status} == PLAN_REQUIRED, because promotion requires the score to be at least the ALERT threshold and exactly 50.00 qualifies"
            - "call 5: ${score_after_third_force} == 67.50 - the third USE_OF_FORCE event adds 3.0 of weight, worth 7.50 scaled, and in the same step breaches FORCE_COUNT at exactly 3 for a further flat 10.00, so the score rises by 17.50 rather than 7.50; breached_indicators == [FORCE_COUNT]"
            - "call 5: the alert row still reads composite_score 50.00, because event ingest never refreshes an alert that is already open"
            - "call 7: ${score_after_reset} == 0.00 with ${band_after_reset} == NONE and breached_indicators empty, since every event is now more than 365 days old; the alert row created in 2026 still exists in PLAN_REQUIRED, so the reset is a property of the rolling window and not a deletion"

      - name: the_sustained_untruthfulness_cascade_runs_end_to_end
        claim_type: Cascading side effects
        excluded_because:
          difficulty_instance: "transitive_cascade / untruthfulness_sustained_fires_five_link_cascade"
          rationale: |
            The cascading_side_effects layer is exercised in full by the difficulty queue, which
            walks the five-link chain from a sustained UNTRUTHFULNESS disposition through the
            Discipline creation, the credibility disclosure, the activity event, the recomputed EIS
            score and the alert, and then reverses the entire chain in appeal_overturned_reverses_
            the_whole_cascade, including the ledger and employment-status restoration. The corner
            queue's own errors instance already covers the one downstream code that reversal makes
            reachable, ERR_DISCLOSURE_NOT_ACTIVE. A separate corner instance would duplicate the
            longest chain in the design without adding a distinct claim.

      - name: both_score_and_discipline_variants_agree_with_their_definitions
        claim_type: Dual variant calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / eis_rolling_window_versus_peer_relative_score"
          rationale: |
            The dual_variant_calculation layer has exactly two carriers in this design and both are
            already owned by the difficulty queue: eis_rolling_window_versus_peer_relative_score
            drives GET /officers/{id}/eis-profile with and without variant=PEER_RELATIVE and asserts
            that the two variants disagree on both the score and the band for identical event data,
            including the empty-pool and zero-mean fallbacks, and presumptive_versus_final_discipline_
            matrix_prior_tier asserts the presumptive-versus-final divergence of the discipline
            matrix across a prior-tier change. The corner queue instead covers the variant surface
            through the endpoint queue's computed-read instance, which checks the parameter default.

  # =========================================================================
  # Guide section 9 - Consistency model (§1.0 consistency_model: immediate)
  # =========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_value_is_already_correct_on_the_first_read_after_the_write
        claim_type: Immediate visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints["POST /allegations/{id}/disposition"]
          - calculations.eis_composite_score
        distinguishing_aspect: |
          The declared consistency model is immediate, and the disposition endpoint is the widest
          fan-out in the design: one call writes the allegation, creates a Discipline, appends a
          system-generated activity event, recomputes the officer's EIS score, may create an alert,
          creates a credibility disclosure and increments a counter on the complaint. Immediate
          consistency means none of those are allowed to lag - the response body already carries the
          allegation's own derived fields, and the very next read of every touched entity, with no
          clock advance and no second write in between, already reports the post-cascade values. An
          implementation that defers any of this to the next sweep fails here without failing the
          cascade instance in the difficulty queue.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-05T09:00:00Z and is not advanced anywhere in the trigger."
            - "Internal Affairs holds Commander Reyes and Investigator Ahn; Patrol North holds Sergeant Doyle and Officer Vance; one hearing room."
            - "One UNTRUTHFULNESS allegation of class A against Vance has findings recorded at 80 for / 20 against with policy_compliant false, and the investigation is in PENDING_REVIEW."
            - "Vance has no prior activity events, so every EIS value moves from a known zero."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 16500000, demographic_code: "DG_A", hire_date: "2004-01-05T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-101", full_name: "Investigator Ahn", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 12800000, demographic_code: "DG_B", hire_date: "2011-03-01T00:00:00Z", is_investigator: true, certification_level: 3, max_case_load: 8 }
              as: SystemAdmin
              captures: { inv_a_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-06-01T00:00:00Z" }
              as: SystemAdmin
              captures: { vance_id: $.data.id }
            - call: "POST /hearing-rooms"
              payload: { facility_code: "HQ", room_name: "Interview 1", concurrent_capacity: 1, recording_enabled: true }
              as: SystemAdmin
              captures: { room_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Officer gave a false account in a written report.", incident_datetime: "2026-07-20T22:00:00Z", alleged_injury: false, reported_allegation_types: ["UNTRUTHFULNESS"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { c_id: $.data.id }
            - call: "POST /complaints/${c_id}/allegations"
              payload: { subject_officer_id: "${vance_id}", allegation_type: "UNTRUTHFULNESS", narrative: "False statement in the incident report.", offense_class: "A" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /complaints/${c_id}/investigations"
              payload: { opening_note: "Untruthfulness allegation opened." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { i1_id: $.data.id, i1_v: $.data.version }
            - call: "POST /investigations/${i1_id}/assignments"
              payload: { expected_investigation_version: "${i1_v}", investigator_officer_id: "${inv_a_id}", assignment_note: "Certified level 3." }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /investigations/${i1_id}/interview-sessions"
              payload: { subject_officer_id: "${vance_id}", hearing_room_id: "${room_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z", notice_served_at: "2026-08-01T00:00:00Z", representation_status: "REP_PRESENT" }
              as: Investigator
              as_user_id: "${inv_a_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /interview-sessions/${s1_id}/hold"
              payload: { interview_summary: "Subject interviewed with representation present." }
              as: Investigator
              as_user_id: "${inv_a_id}"
            - call: "POST /investigations/${i1_id}/findings"
              payload: { allegation_findings: [{ allegation_id: "${a1_id}", evidence_weight_for: 80, evidence_weight_against: 20, policy_compliant: false }], summary: "The false statement is documented." }
              as: Investigator
              as_user_id: "${inv_a_id}"
          trigger:
            - call: "POST /allegations/${a1_id}/disposition"
              payload: { disposition: "SUSTAINED", aggravator_count: 0, mitigator_count: 0, rationale: "Sustained untruthfulness." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { disp: $.data.disposition, disp_at: $.data.disposed_at, prior_tier_count: $.data.prior_sustained_count_at_disposition }
            - call: "GET /complaints/${c_id}"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { c_sustained: $.data.sustained_allegation_count, c_status: $.data.status }
            - call: "GET /disciplines"
              payload: { allegation_id: "${a1_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { d_status: "$.data[0].status", d_presumptive: "$.data[0].presumptive_days" }
            - call: "GET /credibility-disclosures"
              payload: { source_allegation_id: "${a1_id}" }
              as: RecordsCustodian
              captures: { cd_status: "$.data[0].status", cd_basis: "$.data[0].basis" }
            - call: "GET /officers/${vance_id}"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { o_score: $.data.eis_score, o_flag: $.data.credibility_disclosure_active }
            - call: "GET /officers/${vance_id}/activity-events"
              payload: { event_type: "COMPLAINT_SUSTAINED" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { ev_weight: "$.data[0].base_weight", ev_generated: "$.data[0].system_generated" }
            - call: "GET /officers/${vance_id}/eis-profile"
              payload: {}
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { prof_score: $.data.composite_score }
          assert:
            - "call 1: HTTP 200 and the response body itself already carries ${disp} == SUSTAINED, ${disp_at} == 2026-08-05T09:00:00Z and ${prior_tier_count} == 0; no follow-up read is needed for the entity that was written"
            - "call 2: ${c_sustained} == 1 and ${c_status} == ADJUDICATION on the first read, with no sweep in between"
            - "call 3: ${d_status} == PROPOSED and ${d_presumptive} == 30 - the Discipline exists and its presumptive figure is already computed, not left null for a later pass"
            - "call 4: ${cd_status} == ACTIVE and ${cd_basis} == UNTRUTHFULNESS_SUSTAINED"
            - "call 5: ${o_score} == 10.00 (one COMPLAINT_SUSTAINED event, base weight 4 times severity 1.0 times assignment 1.0 times SCORE_SCALE 2.5, no indicator breached) and ${o_flag} == true"
            - "call 6: ${ev_weight} == 4 and ${ev_generated} == true - the cascade's own activity event is readable immediately and is marked as system generated"
            - "call 7: ${prof_score} == 10.00, so the computed read and the stored Officer field agree at the same instant rather than converging later"
            - "no call in the trigger advanced the logical clock, so every value above was visible without any passage of time"
