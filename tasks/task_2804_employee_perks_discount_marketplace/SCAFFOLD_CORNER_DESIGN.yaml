        claim_type: cascading_validation
        grounds:
          - validations[priority=90]
          - validations[priority=91]
          - validations[priority=92]
          - errors[ERR_MIN_SPEND_NOT_MET]
          - errors[ERR_VERIFICATION_TOKEN_INVALID]
          - calculations.fraud_risk_score
        distinguishing_aspect: |
          A verify call carrying both a wrong token and a below-minimum gross amount returns
          ERR_MIN_SPEND_NOT_MET, because rule 90 runs before rule 91 and rule 91 before the audit
