          - state_machines.MonitoredProfile.DRAFT_to_ACTIVE
        distinguishing_aspect: "Rung 40 fires before the fiscal rung 43, so a profile with no Identifier rows is refused with ERR_PROFILE_HAS_NO_IDENTIFIER and no PROFILE unit is drawn."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, one DRAFT profile with zero identifiers."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
