        grounds:
          - state_machines.RecallCampaign.INITIATED_to_TERMINATED
          - state_machines.ProductionBatch.RECALLED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: ProductionBatch.status. When a RecallScope is created,
          the batch transitions RELEASED->RECALLED. When the recall is terminated,
          the batch is restored to RELEASED. The invariant is: batch status after
