            - { call: "POST /rescue-ops/adoption-applications/${app}/pay-fee", payload: { amount_cents: -100 }, as: Adopter, as_user_id: "${ad}", captures: { err: $.data.error_id } }
            - { call: "GET /rescue-ops/adoption-applications/${app}", as: AdoptionOfficer, as_user_id: "officer-1", captures: { paid: $.data.fee_paid_cents } }
          assert:
            - "err == ERR_FEE_AMOUNT_INVALID (422)"
            - "paid == 0 (no accrual from the rejected payment)"

      - name: pledge_minimum_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "errors[ERR_PLEDGE_BELOW_MINIMUM]", entities.Sponsorship.fields.monthly_pledge_cents]
        distinguishing_aspect: "monthly_pledge_cents 2499 fails ERR_PLEDGE_BELOW_MINIMUM; exactly 2500 is accepted (>= minimum)."
        test_recipe:
          setup: ["Sponsor SP; horse H in QUARANTINE (resident, sponsorship allowed)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/sponsors", payload: { name: "SP", contact_email: "sp@x.com" }, as: Sponsor, captures: { sp: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/sponsorships", payload: { sponsor_id: "${sp}", horse_id: "${h}", monthly_pledge_cents: 2499 }, as: Sponsor, as_user_id: "${sp}", captures: { err: $.data.error_id } }
            - { call: "POST /rescue-ops/sponsorships", payload: { sponsor_id: "${sp}", horse_id: "${h}", monthly_pledge_cents: 2500 }, as: Sponsor, as_user_id: "${sp}", captures: { st: $.data.status } }
          assert:
            - "err == ERR_PLEDGE_BELOW_MINIMUM (422)"
            - "st == PLEDGED at exactly 2500 cents"

  - section: endpoints
    instances:
      - name: horses_list_pagination
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Pagination contract: limit=2 over 3 horses returns 2 items with total_count 3 and has_more true; offset=2 returns 1 item with has_more false."
        test_recipe:
          setup: ["Three horses intaked"]
          setup_api_calls:
            - { call: "POST /rescue-ops/horses", payload: { name: "A", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/horses", payload: { name: "B", sex: GELDING, breed_class: DRAFT, estimated_weight_lbs: 1400, age_years: 9, body_condition_score: 6, training_level: UNHANDLED }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/horses", payload: { name: "C", sex: MARE, breed_class: PONY, estimated_weight_lbs: 600, age_years: 4, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator }
          trigger:
            - { call: "GET /rescue-ops/horses?limit=2&offset=0", as: IntakeCoordinator }
            - { call: "GET /rescue-ops/horses?limit=2&offset=2", as: IntakeCoordinator }
          assert:
            - "page 1: exactly 2 items, total_count == 3, has_more == true"
            - "page 2 (offset=2): exactly 1 item, total_count == 3, has_more == false"

      - name: applications_filtered_by_horse
        claim_type: listing
        grounds: [entities.AdoptionApplication.fields.horse_id]
        distinguishing_aspect: "The horse_id filter on GET /adoption-applications returns only that horse's applications (1 for H1, 0 for H2) — FK reverse-reachability via filtered list."
        test_recipe:
          setup: ["H1 ADOPTABLE with one SUBMITTED application; H2 in QUARANTINE with none"]
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H1", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 8, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h1: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H2", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 950, age_years: 7, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h2: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h1}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h1}", as: IntakeCoordinator, captures: { q1: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q1}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/horses/${h1}/release-quarantine", payload: { target_status: ADOPTABLE }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/adopters", payload: { full_name: "Ad L", contact_email: "al@x.com", experience_level: EXPERT, has_stall_facility: true }, as: Adopter, captures: { ad: $.data.id } }
            - { call: "POST /rescue-ops/adoption-applications", payload: { adopter_id: "${ad}", horse_id: "${h1}", proposed_pickup_date: "2026-08-25T00:00:00Z" }, as: Adopter, as_user_id: "${ad}", captures: { app: $.data.id } }
          trigger:
            - { call: "GET /rescue-ops/adoption-applications?horse_id=${h1}", as: AdoptionOfficer, as_user_id: "officer-1" }
            - { call: "GET /rescue-ops/adoption-applications?horse_id=${h2}", as: AdoptionOfficer, as_user_id: "officer-1" }
          assert:
            - "?horse_id=${h1}: exactly 1 item with id == ${app}"
            - "?horse_id=${h2}: 0 items, total_count == 0"

      - name: feed_summary_structure_empty_db
        claim_type: computed_read
        grounds: [calculations.feed_supply_projection]
        distinguishing_aspect: "The computed summary always emits all four feed types; with no horses and no stock every entry shows demand 0.00, usable 0, inbound 0, days_of_supply null (zero-demand guard), reorder_required false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /rescue-ops/feed-inventory/summary", as: BarnManager, captures: { summaries: $.data.summaries } }
          assert:
            - "summaries contains exactly 4 entries keyed GRASS_HAY, ALFALFA, GRAIN, SUPPLEMENT"
            - "every entry: daily_demand_lbs == 0.00 AND usable_lbs == 0 AND inbound_ordered_lbs == 0 AND days_of_supply_tight == null AND days_of_supply_committed == null AND reorder_required == false"

      - name: response_envelope_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id + meta.api_request_timestamp + response_type object/array + data; errors carry response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["Horse H exists"]
          setup_api_calls:
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
          trigger:
            - { call: "GET /rescue-ops/horses/${h}", as: IntakeCoordinator }
            - { call: "GET /rescue-ops/horses/00000000-0000-0000-0000-000000000000", as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "success envelope: meta.api_request_id non-empty, meta.api_request_timestamp ISO8601, response_type == object, data.id == ${h}"
            - "error envelope: response_type == error, data.error_id == ERR_NOT_FOUND, data.message non-empty"

  - section: errors
    instances:
      - name: release_date_not_reached
        claim_type: error_triggerable
        grounds: ["errors[ERR_RELEASE_DATE_NOT_REACHED]", calculations.quarantine_release_timing]
        distinguishing_aspect: "Clearing at day 13 of a 14-day quarantine (fresh exam on file) fails ERR_RELEASE_DATE_NOT_REACHED — the first sub-check of the pinned tier-18 order."
        test_recipe:
          setup: ["Horse H in QUARANTINE (start 2026-08-01, min 14); MEDICAL eval COMPLETED 2026-08-13T12:00; clock 2026-08-14T00:00 (day 13)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-13T12:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T00:00:00Z" }, as: SanctuaryDirector }
          trigger:
            - { call: "POST /rescue-ops/quarantine-protocols/${q}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_RELEASE_DATE_NOT_REACHED (release check precedes exam/fever checks)"

      - name: service_specialty_mismatch
        claim_type: error_triggerable
        grounds: ["errors[ERR_SERVICE_SPECIALTY_MISMATCH]", "validations[priority=23]"]
        distinguishing_aspect: "Booking FARRIER_TRIM with a VETERINARIAN practitioner fails ERR_SERVICE_SPECIALTY_MISMATCH on a REHABILITATION horse (outside quarantine so the safety restriction does not mask it)."
        test_recipe:
          setup: ["Horse H in REHABILITATION; veterinarian V registered (no farrier)"]
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 9, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h}", as: IntakeCoordinator, captures: { q: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/horses/${h}/release-quarantine", payload: { target_status: REHABILITATION }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /rescue-ops/care-service-appointments", payload: { horse_id: "${h}", practitioner_id: "${vet_id}", service_type: FARRIER_TRIM, scheduled_start: "2026-08-16T09:00:00Z", scheduled_end: "2026-08-16T09:45:00Z" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SERVICE_SPECIALTY_MISMATCH (FARRIER_TRIM requires specialty FARRIER)"

      - name: bonded_pair_release_violation
        claim_type: error_triggerable
        grounds: ["errors[ERR_BONDED_PAIR_VIOLATION]", "validations[priority=22]"]
        distinguishing_aspect: "Releasing a bonded horse to ADOPTABLE while its companion is still in REHABILITATION (not ADOPTABLE/ADOPTION_PENDING) fails ERR_BONDED_PAIR_VIOLATION."
        test_recipe:
          setup: ["H1 (no companion) and H2 (bonded_companion_id=H1) both cleared from quarantine; H1 released to REHABILITATION; H2's release to ADOPTABLE is the trigger"]
          setup_api_calls:
            - { call: "POST /rescue-ops/practitioners", payload: { name: "Dr V", specialty: VETERINARIAN }, as: SanctuaryDirector, captures: { vet_id: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H1", sex: MARE, breed_class: LIGHT, estimated_weight_lbs: 1000, age_years: 6, body_condition_score: 5, training_level: GREEN }, as: IntakeCoordinator, captures: { h1: $.data.id } }
            - { call: "POST /rescue-ops/horses", payload: { name: "H2", sex: GELDING, breed_class: LIGHT, estimated_weight_lbs: 950, age_years: 7, body_condition_score: 4, training_level: GREEN, bonded_companion_id: "${h1}" }, as: IntakeCoordinator, captures: { h2: $.data.id } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h1}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:00:00Z" }, as: IntakeCoordinator, captures: { ev1: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev1}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "POST /rescue-ops/intake-evaluations", payload: { horse_id: "${h2}", evaluation_type: MEDICAL, scheduled_date: "2026-08-14T12:30:00Z" }, as: IntakeCoordinator, captures: { ev2: $.data.id } }
            - { call: "POST /rescue-ops/intake-evaluations/${ev2}/complete", payload: { outcome: PASS }, as: IntakeCoordinator }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h1}", as: IntakeCoordinator, captures: { q1: "$.data[0].id" } }
            - { call: "GET /rescue-ops/quarantine-protocols?horse_id=${h2}", as: IntakeCoordinator, captures: { q2: "$.data[0].id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SanctuaryDirector }
            - { call: "POST /rescue-ops/quarantine-protocols/${q1}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/quarantine-protocols/${q2}/clear", payload: {}, as: Veterinarian, as_user_id: "${vet_id}" }
            - { call: "POST /rescue-ops/horses/${h1}/release-quarantine", payload: { target_status: REHABILITATION }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /rescue-ops/horses/${h2}/release-quarantine", payload: { target_status: ADOPTABLE }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_BONDED_PAIR_VIOLATION (companion H1 in REHABILITATION, not in {ADOPTABLE, ADOPTION_PENDING})"
            - "Horse.${h2}.status == QUARANTINE (unchanged)"

      - name: body_fk_horse_not_found
        claim_type: error_triggerable
        grounds: ["errors[ERR_HORSE_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "A body FK to a nonexistent horse returns 404 ERR_HORSE_NOT_FOUND at priority 5 — before any state or business rule runs."
        test_recipe:
          setup: ["Adopter AD exists"]
          setup_api_calls:
            - { call: "POST /rescue-ops/adopters", payload: { full_name: "Ad F", contact_email: "af@x.com", experience_level: EXPERT, has_stall_facility: true }, as: Adopter, captures: { ad: $.data.id } }
          trigger:
            - { call: "POST /rescue-ops/adoption-applications", payload: { adopter_id: "${ad}", horse_id: "00000000-0000-0000-0000-000000000000", proposed_pickup_date: "2026-08-25T00:00:00Z" }, as: Adopter, as_user_id: "${ad}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_HORSE_NOT_FOUND with http status 404"

      - name: err_horse_not_adoptable_already_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_HORSE_NOT_ADOPTABLE]"]
        excluded_because:
          difficulty_instance: approve_gated_by_horse_adoptable
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: err_cooling_off_already_covered
        claim_type: error_triggerable
        grounds: ["errors[ERR_COOLING_OFF_ACTIVE]"]
        excluded_because:
          difficulty_instance: finalize_temporal_vs_fiscal_priority
          rationale: "Asserted as the winning error of the named §1.8 priority-pair instance."

