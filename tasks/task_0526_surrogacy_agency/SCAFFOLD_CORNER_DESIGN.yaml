  - section: consistency_model
    instances:
      - name: disbursement_approve_visible_reserved_in_same_response
        claim_type: immediate
        grounds: ["state_machines.Disbursement.REQUESTED_to_APPROVED", "entities.EscrowAccount.fields.reserved_cents"]
        excluded_because:
          difficulty_instance: compensating_invariant / reject_approved_disbursement_conserves_escrow_total
          rationale: "The approve side-effect (reserved += amount, available -= amount) is asserted immediately as the setup end-state of the named §1.8 compensating-invariant instance before its reject trigger."
