        grounds:
          - validations[priority=10]
          - errors[ERR_OR_DOUBLE_BOOKED]
          - entities.SurgeryBooking.fields.or_room
        distinguishing_aspect: |
          OR resource, half-open interval semantics: a booking starting exactly at the prior booking's
          end (03:00 == 03:00) does NOT conflict (touching allowed) and succeeds, while a booking
          overlapping the same OR1 window (01:00-02:00 inside 00:00-03:00) is rejected ERR_OR_DOUBLE_BOOKED.
