scenario: |
  Applicant Tracking System (ATS): job requisition approval, candidate pool,
  EEO/OFCCP data, interview feedback, Offer approval chain, Background Check
  integration, referral bonus, Diversity Goals
domain_name: ats-applicant-tracking
api_prefix: /ats

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable department label"
      - name: cost_center_code
        type: string
        source: input
        description: "Cost center code; unique across departments"
        constraints: "unique"
      - name: hiring_budget_cents
        type: integer
        source: input
        description: "Annual hiring budget in cents; floor 0"
        constraints: ">= 0"
      - name: committed_offer_cents
        type: integer
        source: computed
        description: "Sum of base_salary_cents for offers in {PENDING_APPROVAL, APPROVED, EXTENDED, ACCEPTED} on this department's requisitions"
        default: 0

  - name: JobRequisition
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: "FK -> Department.id"
      - name: title
        type: string
        source: input
        description: "Job title text"
      - name: target_level
        type: enum
        source: input
        description: "Seniority level for diversity stratification"
        constraints: "one of {JUNIOR, MID, SENIOR, STAFF}"
      - name: base_salary_min_cents
        type: integer
        source: input
        description: "Lower bound of base salary band (cents)"
        constraints: ">= 0"
      - name: base_salary_max_cents
        type: integer
        source: input
        description: "Upper bound of base salary band (cents); must be > min"
        constraints: "> base_salary_min_cents"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state — see §1.2 JobRequisition state machine"
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_APPROVAL, APPROVED, REJECTED, CLOSED, CANCELLED}"
      - name: submitter_user_id
        type: string
        source: system
        description: "X-User-ID of the Recruiter who submitted for approval; stamped on DRAFT->PENDING_APPROVAL"
        default: null
      - name: approver_user_id
        type: string
        source: system
        description: "X-User-ID of the HiringManager who approved/rejected; stamped on terminal approval transition"
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: "ISO 8601 timestamp when status became APPROVED"
        default: null
      - name: openings
        type: integer
        source: input
        description: "Number of headcount slots authorised; >= 1"
        constraints: ">= 1"
      - name: filled_count
        type: integer
        source: computed
        description: "Count of Offers on this requisition whose status == ACCEPTED"
        default: 0

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Candidate name"
      - name: email
        type: string
        source: input
        description: "Unique candidate email"
        constraints: "unique"
      - name: source_channel
        type: enum
        source: input
        description: "How the candidate entered the pool"
        constraints: "one of {DIRECT, REFERRAL, AGENCY, JOB_BOARD}"
      - name: referrer_user_id
        type: string
        source: input
        description: "X-User-ID of the Employee who referred; REQUIRED when source_channel == REFERRAL, otherwise null"
        default: null
      - name: eeo_ethnicity
        type: enum
        source: input
        description: "EEO/OFCCP self-identified ethnicity bucket; voluntary, defaults to DECLINED"
        default: DECLINED
        constraints: "one of {WHITE, BLACK, HISPANIC, ASIAN, NATIVE, PACIFIC, TWO_OR_MORE, DECLINED}"
      - name: eeo_gender
        type: enum
        source: input
        description: "EEO/OFCCP self-identified gender bucket; voluntary, defaults to DECLINED"
        default: DECLINED
        constraints: "one of {FEMALE, MALE, NONBINARY, DECLINED}"
      - name: eeo_veteran
        type: boolean
        source: input
        description: "OFCCP veteran self-identification; voluntary, defaults to false"
        default: false
      - name: eeo_disability
        type: boolean
        source: input
        description: "OFCCP disability self-identification; voluntary, defaults to false"
        default: false

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id"
      - name: requisition_id
        type: string
        source: input
        description: "FK -> JobRequisition.id; unique with candidate_id"
        constraints: "unique with candidate_id"
      - name: status
        type: enum
        source: system
        description: "Application lifecycle — see §1.2 Application state machine"
        default: APPLIED
        constraints: "one of {APPLIED, SCREENING, INTERVIEWING, OFFER_EXTENDED, HIRED, REJECTED, WITHDRAWN}"

  - name: Interview
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id"
      - name: round_number
        type: integer
        source: input
        description: "Sequential round index for this application; first round = 1"
        constraints: ">= 1"
      - name: scheduled_at
        type: datetime
        source: input
        description: "ISO 8601 UTC interview start time"
      - name: duration_minutes
        type: integer
        source: input
        description: "Interview block length in minutes; >= 15"
        constraints: ">= 15"
      - name: panel_user_ids
        type: array
        source: input
        description: "Array of Employee X-User-IDs serving on the panel; size 1..5; MUST NOT contain the candidate's referrer_user_id"
      - name: status
        type: enum
        source: system
        description: "Interview state — see §1.2 Interview state machine"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"
      - name: aggregate_score
        type: number
        source: computed
        description: "Mean of submitted InterviewFeedback.score values, rounded HALF_UP to 2dp; null until at least one feedback exists"
        default: null
      - name: recommendation
        type: enum
        source: computed
        description: "Derived from aggregate_score per §1.3 interview_recommendation_rule; null until COMPLETED"
        default: null
        constraints: "one of {STRONG_HIRE, HIRE, NO_HIRE, STRONG_NO_HIRE, null}"

  - name: InterviewFeedback
    parent: null
    common_fields: false
    fields:
      - name: interview_id
        type: string
        source: input
        description: "FK -> Interview.id"
      - name: panelist_user_id
        type: string
        source: input
        description: "X-User-ID of the panelist submitting feedback; must be in interview.panel_user_ids"
      - name: score
        type: integer
        source: input
        description: "Integer score 1..5 inclusive"
        constraints: "1..5"
      - name: comments
        type: string
        source: input
        description: "Free-form text comments"

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> Application.id; unique among non-terminal offers (only one PENDING_APPROVAL/APPROVED/EXTENDED/ACCEPTED offer per application)"
      - name: base_salary_cents
        type: integer
        source: input
        description: "Offered base salary in cents; must lie within requisition's [base_salary_min_cents, base_salary_max_cents]"
      - name: signing_bonus_cents
        type: integer
        source: input
        description: "Signing bonus in cents; >= 0"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Offer lifecycle — see §1.2 Offer state machine"
        default: PENDING_APPROVAL
        constraints: "one of {PENDING_APPROVAL, APPROVED, EXTENDED, ACCEPTED, DECLINED, REJECTED, REVOKED}"
      - name: comp_approver_user_id
        type: string
        source: system
        description: "X-User-ID of the CompApprover who cleared the compensation step (first approver); stamped on PENDING_APPROVAL->APPROVED transition's first half"
        default: null
      - name: vp_approver_user_id
        type: string
        source: system
        description: "X-User-ID of the VP who cleared the executive step (second approver); stamped on the APPROVED transition's second half; MUST differ from submitter_user_id and comp_approver_user_id"
        default: null
      - name: submitter_user_id
        type: string
        source: system
        description: "X-User-ID of the Recruiter who created the offer; stamped on creation"
      - name: extended_at
        type: datetime
        source: system
        description: "ISO 8601 timestamp when offer entered EXTENDED state"
        default: null
      - name: expires_at
        type: datetime
        source: system
        description: "extended_at + 14 days; offer auto-REVOKED if accept not received before this instant"
        default: null

  - name: BackgroundCheck
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; unique"
        constraints: "unique"
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id"
      - name: status
        type: enum
        source: system
        description: "BackgroundCheck lifecycle — see §1.2 BackgroundCheck state machine"
        default: INITIATED
        constraints: "one of {INITIATED, IN_PROGRESS, PASSED, FAILED, CANCELLED}"
      - name: vendor_reference
        type: string
        source: system
        description: "Synthetic external vendor reference id stamped on INITIATED"
      - name: completed_at
        type: datetime
        source: system
        description: "ISO 8601 timestamp when status became PASSED or FAILED"
        default: null

  - name: ReferralBonus
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; unique among non-VOID bonuses"
      - name: referrer_user_id
        type: string
        source: input
        description: "X-User-ID of the Employee receiving the bonus; copied from Candidate.referrer_user_id at creation"
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; the accepted offer that triggered the bonus"
      - name: estimated_amount_cents
        type: integer
        source: computed
        description: "Estimated bonus computed at offer ACCEPTANCE per §1.3 referral_bonus_estimated"
      - name: payable_amount_cents
        type: integer
        source: computed
        description: "Final payable amount computed at background-check PASSED per §1.3 referral_bonus_payable; differs from estimated when background check delayed past 30-day window"
        default: null
      - name: status
        type: enum
        source: system
        description: "ReferralBonus lifecycle — see §1.2 ReferralBonus state machine"
        default: PENDING_BGC
        constraints: "one of {PENDING_BGC, PAYABLE, PAID, VOID}"

  - name: DiversityGoal
    parent: null
    common_fields: true
    fields:
      - name: department_id
        type: string
        source: input
        description: "FK -> Department.id; unique with target_level and period_year"
      - name: target_level
        type: enum
        source: input
        description: "Seniority stratum this goal applies to"
        constraints: "one of {JUNIOR, MID, SENIOR, STAFF}"
      - name: period_year
        type: integer
        source: input
        description: "Calendar year (UTC) the goal applies to"
        constraints: ">= 2000"
      - name: target_underrepresented_pct
        type: number
        source: input
        description: "Goal: percentage of hires within this stratum from underrepresented groups; 0.0..1.0"
        constraints: "0.0..1.0"
      - name: pool_underrepresented_pct
        type: number
        source: computed
        description: "Realised underrepresented percentage across the applicant pool (Application source) within stratum/year per §1.3 diversity_pool_metric"
        default: 0.0
      - name: hire_underrepresented_pct
        type: number
        source: computed
        description: "Realised underrepresented percentage across hires (Application.status == HIRED) within stratum/year per §1.3 diversity_hire_metric"
        default: 0.0

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: JobRequisition
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED, REJECTED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /ats/requisitions/{id}/submit"
        actor: Recruiter
        preconditions:
          - "requisition.openings >= 1"
          - "base_salary_max_cents > base_salary_min_cents"
        side_effects:
          - "set submitter_user_id = X-User-ID"
          - "increment requisition.version"

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /ats/requisitions/{id}/approve"
        actor: HiringManager
        preconditions:
          - "X-User-ID != requisition.submitter_user_id (segregation of duties)"
          - "Department.hiring_budget_cents - Department.committed_offer_cents >= requisition.openings * requisition.base_salary_max_cents (worst-case budget headroom)"
        side_effects:
          - "set approver_user_id = X-User-ID, approved_at = now"
          - "increment requisition.version"

      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /ats/requisitions/{id}/reject"
        actor: HiringManager
        preconditions:
          - "X-User-ID != requisition.submitter_user_id (segregation of duties)"
        side_effects:
          - "set approver_user_id = X-User-ID"
          - "increment requisition.version"

      - from: APPROVED
        to: CLOSED
        trigger: "system: requisition.filled_count == requisition.openings (auto-transition on Offer ACCEPTED)"
        actor: system
        preconditions:
          - "requisition.filled_count == requisition.openings"
        side_effects:
          - "increment requisition.version"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /ats/requisitions/{id}/cancel"
        actor: HiringManager
        preconditions:
          - "no Offer on this requisition is in {ACCEPTED}"
        side_effects:
          - "increment requisition.version"
          - "cascade: every non-terminal Application on this requisition transitions to WITHDRAWN"
          - "cascade: every non-terminal Offer on this requisition transitions to REVOKED (which itself cascades to any non-terminal BackgroundCheck->CANCELLED and any non-PAID ReferralBonus->VOID)"

  - entity: Application
    initial_state: APPLIED
    terminal_states: [HIRED, REJECTED, WITHDRAWN]
    transitions:
      - from: APPLIED
        to: SCREENING
        trigger: "POST /ats/applications/{id}/screen"
        actor: Recruiter
        preconditions:
          - "JobRequisition.status == APPROVED"
        side_effects:
          - "increment application.version"

      - from: SCREENING
        to: INTERVIEWING
        trigger: "system: first Interview created on the application (auto-transition on POST /ats/interviews)"
        actor: system
        preconditions:
          - "first interview scheduled"
        side_effects:
          - "increment application.version"

      - from: INTERVIEWING
        to: OFFER_EXTENDED
        trigger: "system: linked Offer transitions to EXTENDED (auto-transition on POST /ats/offers/{id}/extend)"
        actor: system
        preconditions:
          - "Offer linked to this application is EXTENDED"
        side_effects:
          - "increment application.version"

      - from: OFFER_EXTENDED
        to: HIRED
        trigger: "system: linked Offer transitions to ACCEPTED"
        actor: system
        preconditions:
          - "linked offer.status == ACCEPTED"
        side_effects:
          - "increment application.version"
          - "cascade: every OTHER non-terminal Application by the same candidate transitions to REJECTED"
          - "cascade: bubble JobRequisition.filled_count++ (auto-transition to CLOSED if filled_count == openings)"

      - from: APPLIED
        to: REJECTED
        trigger: "POST /ats/applications/{id}/reject"
        actor: Recruiter
        preconditions: []
        side_effects:
          - "increment application.version"

      - from: SCREENING
        to: REJECTED
        trigger: "POST /ats/applications/{id}/reject"
        actor: Recruiter
        preconditions: []
        side_effects:
          - "increment application.version"

      - from: INTERVIEWING
        to: REJECTED
        trigger: "POST /ats/applications/{id}/reject"
        actor: Recruiter
        preconditions: []
        side_effects:
          - "increment application.version"

      - from: APPLIED
        to: WITHDRAWN
        trigger: "POST /ats/applications/{id}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects:
          - "increment application.version"

      - from: SCREENING
        to: WITHDRAWN
        trigger: "POST /ats/applications/{id}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects:
          - "increment application.version"

      - from: INTERVIEWING
        to: WITHDRAWN
        trigger: "POST /ats/applications/{id}/withdraw"
        actor: Candidate
        preconditions: []
        side_effects:
          - "increment application.version"

  - entity: Interview
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /ats/interviews/{id}/complete"
        actor: Recruiter
        preconditions:
          - "every panelist in panel_user_ids has submitted an InterviewFeedback row"
        side_effects:
          - "recompute aggregate_score (mean of feedback.score, 2dp HALF_UP)"
          - "set recommendation per §1.3 interview_recommendation_rule"
          - "increment interview.version"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ats/interviews/{id}/cancel"
        actor: Recruiter
        preconditions: []
        side_effects:
          - "increment interview.version"

  - entity: Offer
    initial_state: PENDING_APPROVAL
    terminal_states: [ACCEPTED, DECLINED, REJECTED, REVOKED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /ats/offers/{id}/approve"
        actor: CompApprover OR VP
        preconditions:
          - "When called as CompApprover: offer.comp_approver_user_id is null"
          - "When called as VP: offer.comp_approver_user_id is NOT null"
          - "X-User-ID != offer.submitter_user_id (segregation of duties)"
          - "X-User-ID != offer.comp_approver_user_id when role==VP"
          - "Department.hiring_budget_cents - Department.committed_offer_cents - offer.base_salary_cents >= 0 (budget check, both halves)"
        side_effects:
          - "set comp_approver_user_id = X-User-ID on first call (CompApprover); set vp_approver_user_id = X-User-ID on second call (VP)"
          - "increment offer.version"
          - "Offer reaches APPROVED only after BOTH halves complete; intermediate state after CompApprover step is still PENDING_APPROVAL with comp_approver_user_id set"
        note: |
          Two-step approval: first POST advances comp_approver_user_id only and keeps status=PENDING_APPROVAL.
          The second POST (by a distinct VP user) finalises to APPROVED.

      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /ats/offers/{id}/reject"
        actor: CompApprover OR VP
        preconditions:
          - "X-User-ID != offer.submitter_user_id"
        side_effects:
          - "increment offer.version"

      - from: APPROVED
        to: EXTENDED
        trigger: "POST /ats/offers/{id}/extend"
        actor: Recruiter
        preconditions:
          - "JobRequisition.status == APPROVED"
        side_effects:
          - "set extended_at = now, expires_at = now + 14 days"
          - "increment offer.version"
          - "cascade: linked Application transitions SCREENING|INTERVIEWING -> OFFER_EXTENDED"

      - from: EXTENDED
        to: ACCEPTED
        trigger: "POST /ats/offers/{id}/accept"
        actor: Candidate
        preconditions:
          - "now < offer.expires_at"
        side_effects:
          - "increment offer.version"
          - "cascade: create BackgroundCheck with status=INITIATED, offer_id=offer.id, candidate_id=offer.candidate_id"
          - "cascade: if candidate.source_channel==REFERRAL, create ReferralBonus with status=PENDING_BGC and estimated_amount_cents per §1.3"
          - "cascade: bubble Application APPLIED|SCREENING|INTERVIEWING|OFFER_EXTENDED -> HIRED (which cascades to JobRequisition.filled_count++ and may auto-CLOSE the requisition; also cascades to OTHER non-terminal Applications of same candidate -> REJECTED)"

      - from: EXTENDED
        to: DECLINED
        trigger: "POST /ats/offers/{id}/decline"
        actor: Candidate
        preconditions: []
        side_effects:
          - "increment offer.version"

      - from: EXTENDED
        to: REVOKED
        trigger: "system: now >= offer.expires_at (auto-transition via POST /_clock/set_current_utc or scheduler)"
        actor: system
        preconditions:
          - "now >= offer.expires_at"
        side_effects:
          - "increment offer.version"

      - from: APPROVED
        to: REVOKED
        trigger: "POST /ats/offers/{id}/revoke"
        actor: Recruiter
        preconditions: []
        side_effects:
          - "increment offer.version"

      - from: EXTENDED
        to: REVOKED
        trigger: "POST /ats/offers/{id}/revoke"
        actor: Recruiter
        preconditions: []
        side_effects:
          - "increment offer.version"

  - entity: BackgroundCheck
    initial_state: INITIATED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: INITIATED
        to: IN_PROGRESS
        trigger: "POST /ats/background-checks/{id}/start"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "increment background_check.version"

      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /ats/background-checks/{id}/resolve with outcome=PASSED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "set completed_at = now"
          - "increment background_check.version"
          - "cascade: linked ReferralBonus PENDING_BGC -> PAYABLE; recompute payable_amount_cents per §1.3 referral_bonus_payable"

      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /ats/background-checks/{id}/resolve with outcome=FAILED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "set completed_at = now"
          - "increment background_check.version"
          - "cascade: linked Offer EXTENDED|ACCEPTED -> REVOKED"
          - "cascade: linked Application HIRED -> REJECTED"
          - "cascade: linked ReferralBonus PENDING_BGC -> VOID"
          - "cascade: JobRequisition.filled_count-- (may auto re-open from CLOSED to APPROVED; CLOSED is not terminal here, see note)"
        note: |
          A failed background check rolls back the hire. The requisition counts the
          slot back into the open pool, and if the requisition had auto-CLOSED it
          re-opens to APPROVED.

      - from: INITIATED
        to: CANCELLED
        trigger: "system: linked Offer transitions to REVOKED (cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "increment background_check.version"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system: linked Offer transitions to REVOKED (cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "increment background_check.version"

  - entity: ReferralBonus
    initial_state: PENDING_BGC
    terminal_states: [PAID, VOID]
    transitions:
      - from: PENDING_BGC
        to: PAYABLE
        trigger: "system: linked BackgroundCheck transitions to PASSED (cascade)"
        actor: system
        preconditions:
          - "linked BackgroundCheck.status == PASSED"
        side_effects:
          - "recompute payable_amount_cents per §1.3 referral_bonus_payable"
          - "increment referral_bonus.version"

      - from: PAYABLE
        to: PAID
        trigger: "POST /ats/referral-bonuses/{id}/pay"
        actor: PayrollOfficer
        preconditions: []
        side_effects:
          - "increment referral_bonus.version"

      - from: PENDING_BGC
        to: VOID
        trigger: "system: linked BackgroundCheck transitions to FAILED or CANCELLED (cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "increment referral_bonus.version"

      - from: PAYABLE
        to: VOID
        trigger: "POST /ats/referral-bonuses/{id}/void"
        actor: PayrollOfficer
        preconditions: []
        side_effects:
          - "increment referral_bonus.version"

  # No state machine for Department / DiversityGoal / Candidate / InterviewFeedback
  # (configuration / log entities).

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: offer-second-approval-stale-offer
    parent_entity: Offer
    write_endpoint: "POST /ats/offers/{id}/approve"
    occ_field: "expected_offer_version"
    description: |
      The second-half approval call (VP) carries the offer version the client
      last observed. If another writer has advanced the offer version between
      the CompApprover step and the VP step (e.g., a concurrent reject call
      that bumped the version) the VP's approve is rejected. The state
      precondition alone is insufficient because the second-half approve is
      legitimately reachable on the same observed state — only a stale-version
      check distinguishes "I'm acting on the offer I last read" from "the
      offer has shifted under me".
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: requisition-cancel-stale-version
    parent_entity: JobRequisition
    write_endpoint: "POST /ats/requisitions/{id}/cancel"
    occ_field: "expected_requisition_version"
    description: |
      Cancelling a requisition carries the requisition version the client last
      observed. If between the client's read and this call another writer has
      advanced version (e.g., a system auto-transition to CLOSED that the
      client did not see) the cancel is rejected. State-machine
      preconditions alone do not catch this when the prior write was itself
      a legitimate transition with no observable conflict at the new state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: referral_bonus_estimated
    trigger: "Offer EXTENDED->ACCEPTED transition creates ReferralBonus (when candidate.source_channel == REFERRAL)"
    algorithm: tiered_pricing
    formula: |
      level_base_cents := LEVEL_BASE[requisition.target_level]
      # Tiered multiplier by base_salary_cents band:
      if offer.base_salary_cents <  10_000_000:    band_mult := 1.0
      elif offer.base_salary_cents < 15_000_000:   band_mult := 1.25
      elif offer.base_salary_cents < 20_000_000:   band_mult := 1.5
      else:                                        band_mult := 1.75
      raw := level_base_cents * band_mult
      # Diversity uplift: if the candidate self-identifies as an
      # underrepresented group (see UNDERREPRESENTED_SET), add 20%.
      if candidate.eeo_ethnicity in UNDERREPRESENTED_SET or candidate.eeo_disability or candidate.eeo_veteran:
          raw := raw * 1.20
      estimated_amount_cents := round_half_up(raw)  # integer cents
    input_set: "single Offer + linked Candidate + linked JobRequisition"
    constants:
      LEVEL_BASE:
        JUNIOR: 100_000   # $1,000
        MID: 200_000      # $2,000
        SENIOR: 400_000   # $4,000
        STAFF: 600_000    # $6,000
      UNDERREPRESENTED_SET: [BLACK, HISPANIC, NATIVE, PACIFIC, TWO_OR_MORE]
    precision: "integer cents; intermediate band_mult and uplift applied as exact decimals; final round_half_up"

  - name: referral_bonus_payable
    trigger: "BackgroundCheck IN_PROGRESS->PASSED transition (PENDING_BGC->PAYABLE cascade)"
    algorithm: threshold
    formula: |
      # Recompute baseline using referral_bonus_estimated's formula
      # against the CURRENT state of the linked Offer/Candidate/Requisition.
      baseline := referral_bonus_estimated(offer, candidate, requisition)
      delay_days := floor((background_check.completed_at - offer.accepted_at) / 1 day)  # integer floor
      # Decay schedule:
      if delay_days <= 30:        payable := baseline
      elif delay_days <= 60:      payable := round_half_up(baseline * 0.75)
      elif delay_days <= 90:      payable := round_half_up(baseline * 0.50)
      else:                       payable := 0
      payable_amount_cents := payable
    input_set: "single ReferralBonus + linked BackgroundCheck + Offer + Candidate + Requisition"
    constants:
      DECAY_30_DAY_PCT: 0.75
      DECAY_60_DAY_PCT: 0.50
      DECAY_CUTOFF_DAYS: 90
    precision: "integer cents; floor on day count, round_half_up on the decayed value"
    variants:
      - name: estimated
        when: "Captured at Offer ACCEPTED — assumes payment will land within 30 days"
        difference: "Uses delay_days = 0 implicitly (always returns baseline)"
      - name: payable
        when: "Captured at BackgroundCheck PASSED — uses ACTUAL delay between accept and BGC clearance"
        difference: "May produce a strictly smaller integer when BGC clearance is slow"

  - name: diversity_pool_metric
    trigger: "GET /ats/diversity-goals/{id} OR cascade on Application create/update"
    algorithm: aggregation
    formula: |
      # Numerator/denominator over the applicant POOL.
      candidates_in_scope := all Candidate c such that there exists an
          Application a where a.requisition_id ∈ {requisitions of this
          department with target_level == goal.target_level} AND
          year(a.created_at UTC) == goal.period_year AND
          a.status != WITHDRAWN
      # Deduplicate by candidate_id — each unique candidate counts once
      # per (department, level, year) even if they applied to multiple
      # requisitions in scope.
      denom := |candidates_in_scope|
      numer := count of c in candidates_in_scope where
          c.eeo_ethnicity in UNDERREPRESENTED_SET OR c.eeo_disability OR c.eeo_veteran
      if denom == 0: pool_underrepresented_pct := 0.0
      else:          pool_underrepresented_pct := round_half_up(numer / denom, 4)
    input_set: "Applications under goal.department_id requisitions, status != WITHDRAWN, year(created_at)==goal.period_year, target_level matches goal.target_level"
    constants:
      UNDERREPRESENTED_SET: [BLACK, HISPANIC, NATIVE, PACIFIC, TWO_OR_MORE]
    precision: "4 decimal places, round_half_up"

  - name: diversity_hire_metric
    trigger: "Application APPLIED|SCREENING|INTERVIEWING|OFFER_EXTENDED -> HIRED transition AND Application HIRED -> REJECTED transition"
    algorithm: aggregation
    formula: |
      # Numerator/denominator over HIRES only.
      hired_applications := all Application a such that
          a.requisition_id ∈ {requisitions of this department with target_level == goal.target_level} AND
          a.status == HIRED AND
          year(a.updated_at UTC) == goal.period_year
      candidates_hired := { distinct a.candidate_id }
      denom := |candidates_hired|
      numer := count of candidate_id in candidates_hired where
          candidate.eeo_ethnicity in UNDERREPRESENTED_SET OR candidate.eeo_disability OR candidate.eeo_veteran
      if denom == 0: hire_underrepresented_pct := 0.0
      else:          hire_underrepresented_pct := round_half_up(numer / denom, 4)
    input_set: "Applications under goal.department_id requisitions, status==HIRED, year(updated_at)==goal.period_year, target_level matches goal.target_level"
    constants:
      UNDERREPRESENTED_SET: [BLACK, HISPANIC, NATIVE, PACIFIC, TWO_OR_MORE]
    precision: "4 decimal places, round_half_up"

  - name: interview_recommendation_rule
    trigger: "Interview SCHEDULED->COMPLETED transition"
    algorithm: threshold
    formula: |
      # aggregate_score is the mean of feedback.score (1..5), 2dp HALF_UP.
      if aggregate_score >= 4.50:                          recommendation := STRONG_HIRE
      elif aggregate_score >= 3.50 and aggregate_score < 4.50:  recommendation := HIRE
      elif aggregate_score >= 2.50 and aggregate_score < 3.50:  recommendation := NO_HIRE
      else (aggregate_score < 2.50):                       recommendation := STRONG_NO_HIRE
      # Boundaries are >= / < precisely as written. 4.50 exact => STRONG_HIRE.
    input_set: "Interview.aggregate_score (already rounded HALF_UP to 2dp)"
    constants:
      THRESH_STRONG_HIRE: 4.50
      THRESH_HIRE: 3.50
      THRESH_NO_HIRE: 2.50
    precision: "Inputs already rounded to 2dp; thresholds inclusive at low end, exclusive at high end"

  - name: department_committed_offer
    trigger: "Offer enters or leaves any of {PENDING_APPROVAL, APPROVED, EXTENDED, ACCEPTED}"
    algorithm: aggregation
    formula: |
      committed_offer_cents := sum of Offer.base_salary_cents over offers o where
          JobRequisition[o.application_id -> a -> a.requisition_id].department_id == department.id AND
          o.status IN {PENDING_APPROVAL, APPROVED, EXTENDED, ACCEPTED}
    input_set: "Offers on requisitions of this department whose status is in the active set"
    constants: {}
    precision: "integer cents"

# =====================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated resource ids exist; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with {id} segments"

  - priority: 4
    category: existence
    check: "Body-supplied foreign-key ids exist (department_id, candidate_id, requisition_id, application_id, offer_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK fields"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-mutating endpoints"

  - priority: 6
    category: state
    check: "Cross-entity guard: parent/sibling state matches the transition's preconditions (e.g., JobRequisition.status==APPROVED for screen/extend; candidate has accepted offer => block further applications)"
    error_id: ERR_PRECONDITION_FAILED
    http_status: 409
    applies_to: "applications:screen, offers:extend, applications:create"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: X-User-ID must not equal submitter_user_id (requisition approve, offer approve, offer reject)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "requisitions:approve, requisitions:reject, offers:approve, offers:reject"

  - priority: 8
    category: business_safety
    check: "Panelist independence: interview.panel_user_ids MUST NOT contain candidate.referrer_user_id"
    error_id: ERR_PANELIST_CONFLICT
    http_status: 422
    applies_to: "interviews:create"

  - priority: 9
    category: business_safety
    check: "Background-check resolver MUST NOT be the requisition's submitter or approver (independence)"
    error_id: ERR_BGC_INDEPENDENCE
    http_status: 403
    applies_to: "background-checks:resolve"

  - priority: 10
    category: business_referential
    check: "Application uniqueness: (candidate_id, requisition_id) pair is unique"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 422
    applies_to: "applications:create"

  - priority: 11
    category: business_referential
    check: "At most one Offer per Application in non-terminal states {PENDING_APPROVAL, APPROVED, EXTENDED, ACCEPTED}"
    error_id: ERR_DUPLICATE_OFFER
    http_status: 422
    applies_to: "offers:create"

  - priority: 12
    category: business_constraint
    check: "Interview panel size: 1 <= len(panel_user_ids) <= 5; no duplicate ids in array"
    error_id: ERR_INVALID_PANEL
    http_status: 422
    applies_to: "interviews:create"

  - priority: 13
    category: business_constraint
    check: "InterviewFeedback.panelist_user_id MUST be in interview.panel_user_ids"
    error_id: ERR_PANELIST_NOT_ASSIGNED
    http_status: 422
    applies_to: "interview-feedback:create"

  - priority: 14
    category: business_constraint
    check: "Interview cannot be COMPLETED until every panelist has submitted feedback"
    error_id: ERR_FEEDBACK_INCOMPLETE
    http_status: 409
    applies_to: "interviews:complete"

  - priority: 14.5
    category: business_temporal
    check: "Application-level interview overlap: for a given application_id, no two SCHEDULED interviews may have overlapping time intervals. Intervals are half-open [scheduled_at, scheduled_at + duration_minutes); adjacency at the exact boundary (a.end == b.start) is permitted."
    error_id: ERR_INTERVIEW_OVERLAP_APPLICATION
    http_status: 422
    applies_to: "interviews:create"

  - priority: 14.6
    category: business_temporal
    check: "Panelist-level interview overlap: for any panelist_user_id, no two SCHEDULED interviews containing that panelist may have overlapping BUFFERED intervals. The buffered interval is [scheduled_at - 15min, scheduled_at + duration_minutes + 15min); 15-minute travel buffer applied on BOTH ends. Adjacency at the buffered-interval boundary is permitted."
    error_id: ERR_INTERVIEW_OVERLAP_PANELIST
    http_status: 422
    applies_to: "interviews:create"

  - priority: 15
    category: business_temporal
    check: "Offer accept must occur strictly before expires_at; equal-or-greater triggers REVOKED"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "offers:accept"

  - priority: 16
    category: business_constraint
    check: "Offer.base_salary_cents must lie within the linked JobRequisition's [base_salary_min_cents, base_salary_max_cents] inclusive"
    error_id: ERR_SALARY_OUT_OF_BAND
    http_status: 422
    applies_to: "offers:create"

  - priority: 17
    category: business_fiscal
    check: "Approving a Requisition: Department.hiring_budget_cents - Department.committed_offer_cents >= requisition.openings * requisition.base_salary_max_cents (worst-case headroom). NOTE: This safety check fires AFTER segregation-of-duties; on simultaneous failures the SoD error wins per priority order."
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "requisitions:approve"

  - priority: 18
    category: business_fiscal
    check: "Approving an Offer: Department.hiring_budget_cents - (Department.committed_offer_cents - offer.base_salary_cents [if already counted]) - offer.base_salary_cents >= 0; effectively budget must accommodate offer.base_salary_cents net of its existing inclusion. Independent of segregation check (priority 7)."
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "offers:approve"

  - priority: 19
    category: state
    check: "OCC: payload's expected_<parent>_version equals current parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "offers:approve, requisitions:cancel"

  - priority: 20
    category: business_referential
    check: "ReferralBonus eligibility: candidate.source_channel == REFERRAL and candidate.referrer_user_id is not null at Offer ACCEPTED. If candidate.source_channel != REFERRAL no ReferralBonus is created (silent)."
    error_id: ERR_NOT_REFERRAL_ELIGIBLE
    http_status: 422
    applies_to: "(internal cascade — error_id only surfaces on referral-bonuses:create manual endpoint, which is reserved for backfills)"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---------- Department ----------
  - method: POST
    path: "/ats/departments"
    description: "Create a department"
    roles: [PlatformAdmin]
    code: 201
    input: [name, cost_center_code, hiring_budget_cents]
    output: Department
    side_effects: []

  - method: GET
    path: "/ats/departments/{id}"
    description: "Read a department (includes computed committed_offer_cents)"
    roles: [PlatformAdmin, HiringManager, Recruiter]
    code: 200
    input: []
    output: Department
    side_effects: []

  - method: GET
    path: "/ats/departments"
    description: "List departments"
    roles: [PlatformAdmin, HiringManager, Recruiter]
    code: 200
    input: ["limit?", "offset?"]
    output: Department[]
    side_effects: []

  # ---------- JobRequisition ----------
  - method: POST
    path: "/ats/requisitions"
    description: "Create a requisition in DRAFT"
    roles: [Recruiter]
    code: 201
    input: [department_id, title, target_level, base_salary_min_cents, base_salary_max_cents, openings]
    output: JobRequisition
    side_effects:
      - "creates a JobRequisition row with status=DRAFT, version=1"

  - method: GET
    path: "/ats/requisitions/{id}"
    description: "Read a requisition (includes computed filled_count)"
    roles: [PlatformAdmin, HiringManager, Recruiter]
    code: 200
    input: []
    output: JobRequisition
    side_effects: []

  - method: GET
    path: "/ats/requisitions"
    description: "List requisitions, optionally filtered by department_id"
    roles: [PlatformAdmin, HiringManager, Recruiter]
    code: 200
    input: ["limit?", "offset?", "department_id?", "status?"]
    output: JobRequisition[]
    side_effects: []

  - method: POST
    path: "/ats/requisitions/{id}/submit"
    description: "Submit for approval (DRAFT->PENDING_APPROVAL)"
    roles: [Recruiter]
    code: 200
    input: []
    output: JobRequisition
    side_effects:
      - "stamps submitter_user_id; increments requisition.version"

  - method: POST
    path: "/ats/requisitions/{id}/approve"
    description: "Approve (PENDING_APPROVAL->APPROVED)"
    roles: [HiringManager]
    code: 200
    input: []
    output: JobRequisition
    side_effects:
      - "stamps approver_user_id, approved_at; increments requisition.version"

  - method: POST
    path: "/ats/requisitions/{id}/reject"
    description: "Reject (PENDING_APPROVAL->REJECTED)"
    roles: [HiringManager]
    code: 200
    input: []
    output: JobRequisition
    side_effects:
      - "stamps approver_user_id; increments requisition.version"

  - method: POST
    path: "/ats/requisitions/{id}/cancel"
    description: "Cancel an APPROVED requisition (APPROVED->CANCELLED) — OCC-guarded"
    roles: [HiringManager]
    code: 200
    input: [expected_requisition_version]
    output: JobRequisition
    side_effects:
      - "increments requisition.version"
      - "cascade: applications -> WITHDRAWN, offers -> REVOKED (which cascades to BackgroundCheck->CANCELLED, ReferralBonus->VOID)"

  # ---------- Candidate ----------
  - method: POST
    path: "/ats/candidates"
    description: "Add a candidate to the pool"
    roles: [Recruiter]
    code: 201
    input: ["full_name", "email", "source_channel", "referrer_user_id?", "eeo_ethnicity?", "eeo_gender?", "eeo_veteran?", "eeo_disability?"]
    output: Candidate
    side_effects: []

  - method: GET
    path: "/ats/candidates/{id}"
    description: "Read a candidate"
    roles: [Recruiter, HiringManager, PlatformAdmin]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: GET
    path: "/ats/candidates"
    description: "List candidates"
    roles: [Recruiter, HiringManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "source_channel?"]
    output: Candidate[]
    side_effects: []

  # ---------- Application ----------
  - method: POST
    path: "/ats/applications"
    description: "Apply a candidate to a requisition"
    roles: [Recruiter]
    code: 201
    input: [candidate_id, requisition_id]
    output: Application
    side_effects:
      - "creates Application with status=APPLIED, version=1"

  - method: GET
    path: "/ats/applications/{id}"
    description: "Read an application"
    roles: [Recruiter, HiringManager, Candidate, PlatformAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/ats/applications"
    description: "List applications; supports filter by candidate_id, requisition_id, status"
    roles: [Recruiter, HiringManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "candidate_id?", "requisition_id?", "status?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/ats/applications/{id}/screen"
    description: "Advance APPLIED->SCREENING"
    roles: [Recruiter]
    code: 200
    input: []
    output: Application
    side_effects:
      - "increments application.version"

  - method: POST
    path: "/ats/applications/{id}/reject"
    description: "Reject an application from APPLIED|SCREENING|INTERVIEWING"
    roles: [Recruiter]
    code: 200
    input: []
    output: Application
    side_effects:
      - "increments application.version"

  - method: POST
    path: "/ats/applications/{id}/withdraw"
    description: "Candidate withdraws from APPLIED|SCREENING|INTERVIEWING"
    roles: [Candidate]
    code: 200
    input: []
    output: Application
    side_effects:
      - "increments application.version"

  # ---------- Interview ----------
  - method: POST
    path: "/ats/interviews"
    description: "Schedule an interview for an application"
    roles: [Recruiter]
    code: 201
    input: [application_id, round_number, scheduled_at, duration_minutes, panel_user_ids]
    output: Interview
    side_effects:
      - "if first interview on application: cascade application SCREENING->INTERVIEWING"

  - method: GET
    path: "/ats/interviews/{id}"
    description: "Read an interview"
    roles: [Recruiter, HiringManager, PlatformAdmin]
    code: 200
    input: []
    output: Interview
    side_effects: []

  - method: GET
    path: "/ats/interviews"
    description: "List interviews; filter by application_id"
    roles: [Recruiter, HiringManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "application_id?"]
    output: Interview[]
    side_effects: []

  - method: POST
    path: "/ats/interviews/{id}/complete"
    description: "Mark interview COMPLETED; recompute aggregate_score and recommendation"
    roles: [Recruiter]
    code: 200
    input: []
    output: Interview
    side_effects:
      - "recompute aggregate_score and recommendation per §1.3"
      - "increments interview.version"

  - method: POST
    path: "/ats/interviews/{id}/cancel"
    description: "Cancel a SCHEDULED interview"
    roles: [Recruiter]
    code: 200
    input: []
    output: Interview
    side_effects:
      - "increments interview.version"

  # ---------- InterviewFeedback ----------
  - method: POST
    path: "/ats/interview-feedback"
    description: "Submit a panelist feedback row"
    roles: [HiringManager, Recruiter]
    code: 201
    input: [interview_id, panelist_user_id, score, comments]
    output: InterviewFeedback
    side_effects: []

  - method: GET
    path: "/ats/interview-feedback"
    description: "List interview feedback; filter by interview_id"
    roles: [Recruiter, HiringManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "interview_id?"]
    output: InterviewFeedback[]
    side_effects: []

  # ---------- Offer ----------
  - method: POST
    path: "/ats/offers"
    description: "Create an offer in PENDING_APPROVAL"
    roles: [Recruiter]
    code: 201
    input: [application_id, base_salary_cents, signing_bonus_cents]
    output: Offer
    side_effects:
      - "stamps submitter_user_id; sets status=PENDING_APPROVAL, version=1"
      - "department.committed_offer_cents += base_salary_cents (denormalised aggregate)"

  - method: GET
    path: "/ats/offers/{id}"
    description: "Read an offer"
    roles: [Recruiter, HiringManager, CompApprover, VP, PlatformAdmin, Candidate]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/ats/offers"
    description: "List offers; filter by application_id or status"
    roles: [Recruiter, HiringManager, CompApprover, VP, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "application_id?", "status?"]
    output: Offer[]
    side_effects: []

  - method: POST
    path: "/ats/offers/{id}/approve"
    description: "Two-step approval (CompApprover then VP); OCC-guarded on expected_offer_version"
    roles: [CompApprover, VP]
    code: 200
    input: [expected_offer_version]
    output: Offer
    side_effects:
      - "first call (CompApprover): stamps comp_approver_user_id, keeps PENDING_APPROVAL, increments offer.version"
      - "second call (VP): stamps vp_approver_user_id, transitions to APPROVED, increments offer.version"

  - method: POST
    path: "/ats/offers/{id}/reject"
    description: "Reject an offer from PENDING_APPROVAL"
    roles: [CompApprover, VP]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "increments offer.version"
      - "department.committed_offer_cents -= offer.base_salary_cents"

  - method: POST
    path: "/ats/offers/{id}/extend"
    description: "Extend offer to candidate (APPROVED->EXTENDED), set 14-day expiry"
    roles: [Recruiter]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "set extended_at = now, expires_at = now + 14 days"
      - "cascade application -> OFFER_EXTENDED"
      - "increments offer.version"

  - method: POST
    path: "/ats/offers/{id}/accept"
    description: "Candidate accepts (EXTENDED->ACCEPTED)"
    roles: [Candidate]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "increments offer.version"
      - "creates BackgroundCheck INITIATED"
      - "if candidate.source_channel==REFERRAL: creates ReferralBonus PENDING_BGC with estimated_amount_cents per §1.3"
      - "cascade application -> HIRED (which bubbles requisition.filled_count++ and may auto-CLOSE)"
      - "cascade OTHER non-terminal applications by same candidate -> REJECTED"

  - method: POST
    path: "/ats/offers/{id}/decline"
    description: "Candidate declines an EXTENDED offer"
    roles: [Candidate]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "increments offer.version"
      - "department.committed_offer_cents -= offer.base_salary_cents"

  - method: POST
    path: "/ats/offers/{id}/revoke"
    description: "Recruiter revokes an APPROVED or EXTENDED offer"
    roles: [Recruiter]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "increments offer.version"
      - "department.committed_offer_cents -= offer.base_salary_cents"
      - "cascade BackgroundCheck (if any) -> CANCELLED"
      - "cascade ReferralBonus (if any, non-PAID) -> VOID"

  # ---------- BackgroundCheck ----------
  - method: GET
    path: "/ats/background-checks/{id}"
    description: "Read a background check"
    roles: [ComplianceOfficer, HiringManager, PlatformAdmin]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []

  - method: GET
    path: "/ats/background-checks"
    description: "List background checks; filter by offer_id, candidate_id, or status"
    roles: [ComplianceOfficer, HiringManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "offer_id?", "candidate_id?", "status?"]
    output: BackgroundCheck[]
    side_effects: []

  - method: POST
    path: "/ats/background-checks/{id}/start"
    description: "Move INITIATED->IN_PROGRESS"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects:
      - "increments background_check.version"

  - method: POST
    path: "/ats/background-checks/{id}/resolve"
    description: "Resolve IN_PROGRESS->PASSED|FAILED; on FAILED triggers offer/app/referral rollback"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: BackgroundCheck
    side_effects:
      - "set completed_at = now"
      - "PASSED: cascade ReferralBonus -> PAYABLE; recompute payable_amount_cents per §1.3"
      - "FAILED: cascade Offer -> REVOKED, Application -> REJECTED, ReferralBonus -> VOID, decrement requisition.filled_count and re-open if needed"
      - "increments background_check.version"

  # ---------- ReferralBonus ----------
  - method: GET
    path: "/ats/referral-bonuses/{id}"
    description: "Read a referral bonus"
    roles: [PayrollOfficer, HiringManager, PlatformAdmin]
    code: 200
    input: []
    output: ReferralBonus
    side_effects: []

  - method: GET
    path: "/ats/referral-bonuses"
    description: "List referral bonuses; filter by referrer_user_id, candidate_id, offer_id, status"
    roles: [PayrollOfficer, HiringManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "referrer_user_id?", "candidate_id?", "offer_id?", "status?"]
    output: ReferralBonus[]
    side_effects: []

  - method: POST
    path: "/ats/referral-bonuses/{id}/pay"
    description: "Mark a PAYABLE bonus as PAID"
    roles: [PayrollOfficer]
    code: 200
    input: []
    output: ReferralBonus
    side_effects:
      - "increments referral_bonus.version"

  - method: POST
    path: "/ats/referral-bonuses/{id}/void"
    description: "Manually void a PAYABLE bonus"
    roles: [PayrollOfficer]
    code: 200
    input: []
    output: ReferralBonus
    side_effects:
      - "increments referral_bonus.version"

  # ---------- DiversityGoal ----------
  - method: POST
    path: "/ats/diversity-goals"
    description: "Create a diversity goal for (department, level, year)"
    roles: [PlatformAdmin]
    code: 201
    input: [department_id, target_level, period_year, target_underrepresented_pct]
    output: DiversityGoal
    side_effects: []

  - method: GET
    path: "/ats/diversity-goals/{id}"
    description: "Read a diversity goal — recomputes pool_underrepresented_pct and hire_underrepresented_pct per §1.3"
    roles: [PlatformAdmin, HiringManager]
    code: 200
    input: []
    output: DiversityGoal
    side_effects:
      - "computes pool_underrepresented_pct and hire_underrepresented_pct on read"

  - method: GET
    path: "/ats/diversity-goals"
    description: "List diversity goals; filter by department_id, period_year, target_level"
    roles: [PlatformAdmin, HiringManager]
    code: 200
    input: ["limit?", "offset?", "department_id?", "period_year?", "target_level?"]
    output: DiversityGoal[]
    side_effects: []

  # ---------- Test-driving clock endpoint ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the system clock to a fixed ISO 8601 UTC instant; drives offer-expiry auto-transitions"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime, revoked_offer_ids: string[] }"
    side_effects:
      - "any EXTENDED offer whose expires_at <= to_iso8601 transitions to REVOKED with the same cascades as POST /offers/{id}/revoke"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or empty X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role lacks permission for endpoint per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated resource id does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Body-supplied foreign-key id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which this transition is declared"
  - id: ERR_PRECONDITION_FAILED
    http: 409
    condition: "Cross-entity precondition not satisfied (e.g., requisition not APPROVED when screening/extending; candidate already has an accepted offer)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same user attempts both submitter and approver roles, or VP step is taken by the comp-approver / submitter"
  - id: ERR_PANELIST_CONFLICT
    http: 422
    condition: "Interview panel_user_ids contains the candidate's referrer_user_id"
  - id: ERR_BGC_INDEPENDENCE
    http: 403
    condition: "Background-check resolver is the requisition's submitter or approver"
  - id: ERR_DUPLICATE_APPLICATION
    http: 422
    condition: "(candidate_id, requisition_id) pair already exists"
  - id: ERR_DUPLICATE_OFFER
    http: 422
    condition: "An active offer already exists for the application"
  - id: ERR_INVALID_PANEL
    http: 422
    condition: "panel_user_ids size out of [1,5], duplicates present, or empty"
  - id: ERR_PANELIST_NOT_ASSIGNED
    http: 422
    condition: "InterviewFeedback.panelist_user_id is not in interview.panel_user_ids"
  - id: ERR_FEEDBACK_INCOMPLETE
    http: 409
    condition: "Interview cannot be COMPLETED — at least one panelist has not submitted feedback"
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "Offer accept arrived at or after expires_at; offer is REVOKED"
  - id: ERR_INTERVIEW_OVERLAP_APPLICATION
    http: 422
    condition: "Two SCHEDULED interviews on the same application have overlapping [start, start+duration) half-open intervals"
  - id: ERR_INTERVIEW_OVERLAP_PANELIST
    http: 422
    condition: "A panelist is double-booked across two SCHEDULED interviews whose 15-minute-buffered intervals overlap"
  - id: ERR_SALARY_OUT_OF_BAND
    http: 422
    condition: "Offer.base_salary_cents outside the linked requisition's [min, max] band"
  - id: ERR_BUDGET_EXCEEDED
    http: 422
    condition: "Department headroom insufficient for requisition approval or offer approval"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_<parent>_version does not match current parent.version"
  - id: ERR_NOT_REFERRAL_ELIGIBLE
    http: 422
    condition: "Manual referral-bonus creation against a candidate not flagged as REFERRAL or missing referrer_user_id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, type wrong, or constraint violated (panel size, score range, openings>=1, salary band ordering)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: PlatformAdmin
    description: "Operational admin for system configuration (departments, diversity goals, clock)"
    identity: opaque
    exclusive_operations:
      - "POST /ats/departments"
      - "POST /ats/diversity-goals"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on departments, requisitions, candidates, applications, interviews, offers, background-checks, referral-bonuses, diversity-goals"

  - name: Recruiter
    description: "Operational HR — creates requisitions, manages candidates/applications/interviews/offers but cannot approve them"
    identity: opaque
    exclusive_operations:
      - "POST /ats/requisitions, POST /ats/requisitions/{id}/submit"
      - "POST /ats/candidates"
      - "POST /ats/applications, POST /ats/applications/{id}/screen, POST /ats/applications/{id}/reject"
      - "POST /ats/interviews, POST /ats/interviews/{id}/complete, POST /ats/interviews/{id}/cancel"
      - "POST /ats/offers, POST /ats/offers/{id}/extend, POST /ats/offers/{id}/revoke"
    shared_operations:
      - "POST /ats/interview-feedback (with HiringManager)"
      - "GET on requisitions/candidates/applications/interviews/offers/interview-feedback"

  - name: HiringManager
    description: "Approves requisitions (segregated from submitter) and reviews interviews/offers"
    identity: opaque
    exclusive_operations:
      - "POST /ats/requisitions/{id}/approve"
      - "POST /ats/requisitions/{id}/reject"
      - "POST /ats/requisitions/{id}/cancel"
    shared_operations:
      - "POST /ats/interview-feedback (with Recruiter)"
      - "GET on requisitions/candidates/applications/interviews/offers/background-checks/referral-bonuses/diversity-goals/departments"

  - name: CompApprover
    description: "Compensation approver — first leg of Offer two-step approval"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /ats/offers/{id}/approve (first leg)"
      - "POST /ats/offers/{id}/reject"
      - "GET on offers"

  - name: VP
    description: "Executive approver — second leg of Offer two-step approval; segregated from CompApprover and submitter"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /ats/offers/{id}/approve (second leg)"
      - "POST /ats/offers/{id}/reject"
      - "GET on offers"

  - name: ComplianceOfficer
    description: "Drives background checks; segregated from requisition submitter/approver"
    identity: opaque
    exclusive_operations:
      - "POST /ats/background-checks/{id}/start"
      - "POST /ats/background-checks/{id}/resolve"
    shared_operations:
      - "GET on background-checks"

  - name: PayrollOfficer
    description: "Pays out referral bonuses"
    identity: opaque
    exclusive_operations:
      - "POST /ats/referral-bonuses/{id}/pay"
      - "POST /ats/referral-bonuses/{id}/void"
    shared_operations:
      - "GET on referral-bonuses"

  - name: Candidate
    description: "External user representing the applicant; accepts/declines/withdraws"
    identity: opaque
    exclusive_operations:
      - "POST /ats/offers/{id}/accept"
      - "POST /ats/offers/{id}/decline"
      - "POST /ats/applications/{id}/withdraw"
    shared_operations:
      - "GET on own applications and offers"
