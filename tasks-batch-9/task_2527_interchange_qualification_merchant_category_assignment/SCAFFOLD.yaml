scenario: |
  Generate task harder than expert level!

  2527. Interchange Qualification & Merchant Category Assignment (Visa payment network
  operations): merchant category code assignment rules by business type with
  reclassification requests, interchange rate qualification by transaction data quality,
  authorization characteristics and clearing timing, downgrade detection when required data
  elements are missing, program eligibility for small ticket, utility, government and charity
  rates, incentive program enrollment with volume commitments and performance thresholds,
  quarterly rate change publication and acquirer implementation windows, misrepresentation
  investigation and merchant category audits, cross-border and currency conversion assessment
  rules

domain_name: interchange-qualification-mcc-assignment

# Flat/graph topology: every collection is a root-level peer. No nesting prefix.
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  difficulty_target: "expert+ — above the §0.4 Expert band (14 entities, 55 endpoints, 37 error codes, 8 calculations, 10 state machines)"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: AcquirerImplementationWindow is a 3-way junction (Acquirer x RateProgramVersion x
  # ProcessingPlatform); IncentiveEnrollment is a junction (Merchant x IncentiveProgram);
  # TransactionRecord points at SettlementBatch, Merchant and RateProgram simultaneously.
  # No URL nesting: all collections are root-level peers linked by foreign keys.

  state_machine_shape: cyclic
  # Primary shape is cyclic (ReclassificationRequest revision loop
  # UNDER_REVIEW->INFO_REQUESTED->SUBMITTED; IncentiveEnrollment ENROLLED<->PROBATION;
  # IncentiveProgram OPEN<->CLOSED_FULL; Acquirer COMPLIANT<->NON_COMPLIANT).
  # Also present: parallel dimensions on TransactionRecord
  # (authorization_status x qualification_status evolve independently on one row)
  # and branching fork-join on MerchantCategoryAudit
  # (FIELDWORK -> {FINDINGS_SUSTAINED, FINDINGS_CLEARED} -> CLOSED).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # CategoryAnalyst reviews a reclassification request but may never decide it, and the
  # deciding CategoryApprover's X-User-ID must differ from the recorded reviewer_user_id.
  # A ComplianceAuditor who sustained/cleared findings may never close the same audit.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1  Entity-Relationship Table
# =============================================================================
entities:
  - name: ProcessingPlatform
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human label of the acquirer processing platform (e.g. 'PLAT-NA-1')."
        constraints: "1..80 chars, unique"
      - name: region_code
        type: string
        source: input
        description: "Network region the platform serves."
        constraints: "one of NA, EU, AP, LAC, CEMEA"
      - name: max_concurrent_windows
        type: integer
        source: input
        description: "Aggregate capacity: how many AcquirerImplementationWindow rows in status SCHEDULED or IN_PROGRESS may occupy overlapping buffered intervals on this platform."
        constraints: ">= 1"
      - name: blackout_buffer_days
        type: integer
        source: input
        description: "Symmetric blackout buffer in whole days added to BOTH ends of every existing window on this platform before the overlap test in calculations.platform_window_overlap_check."
        constraints: ">= 0"

  - name: Acquirer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Registered acquirer name."
        constraints: "1..120 chars"
      - name: bin_prefix
        type: string
        source: input
        description: "Six-digit issuer/acquirer BIN prefix."
        constraints: "exactly 6 digits, unique across Acquirer"
      - name: platform_id
        type: string
        source: input
        description: "FK -> ProcessingPlatform.id; the platform on which this acquirer schedules rate-change implementation windows."
      - name: country_code
        type: string
        source: input
        description: "ISO-3166 alpha-2 country of the acquirer; compared against Merchant.home_country_code to derive TransactionRecord.cross_border."
        constraints: "exactly 2 uppercase letters"
      - name: settlement_currency
        type: string
        source: input
        description: "ISO-4217 code the acquirer settles in."
        constraints: "exactly 3 uppercase letters"
      - name: compliance_status
        type: enum
        source: system
        description: "COMPLIANT while the acquirer has zero AcquirerImplementationWindow rows in status MISSED; NON_COMPLIANT otherwise. Gates POST /settlement-batches/{id}/finalize."
        default: COMPLIANT
        constraints: "one of COMPLIANT, NON_COMPLIANT"
      - name: missed_window_count
        type: integer
        source: computed
        description: "COUNT of AcquirerImplementationWindow rows with acquirer_id == this.id AND status == MISSED. Recomputed on every window status change."
        default: 0

  - name: MccDefinition
    parent: null
    common_fields: true
    fields:
      - name: mcc_code
        type: string
        source: input
        description: "Four-digit merchant category code."
        constraints: "exactly 4 digits, unique across MccDefinition"
      - name: description
        type: string
        source: input
        description: "Category description as published in the MCC directory."
        constraints: "1..200 chars"
      - name: business_type_key
        type: string
        source: input
        description: "Uppercase business-type key used by calculations.mcc_assignment_selector to map a Merchant to an MCC. Not unique: several MccDefinition rows may share one key."
        constraints: "1..40 chars, uppercase A-Z and underscore"
      - name: program_eligibility
        type: array
        source: input
        description: "Set of special interchange program categories this MCC may qualify for."
        default: "[]"
        constraints: "subset of {SMALL_TICKET, UTILITY, GOVERNMENT, CHARITY}, no duplicates"
      - name: requires_documentation
        type: boolean
        source: input
        description: "When true a Merchant assigned this MCC starts in mcc_status PENDING_VERIFICATION and a reclassification INTO this MCC may only be approved with a supporting_doc_ref on file."
      - name: high_risk
        type: boolean
        source: input
        description: "High-risk flag; used as the primary sort key (false before true) in calculations.mcc_assignment_selector."

  - name: Merchant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Merchant legal entity name."
        constraints: "1..120 chars"
      - name: business_type_key
        type: string
        source: input
        description: "Declared business type; drives calculations.mcc_assignment_selector at creation time."
        constraints: "1..40 chars, uppercase A-Z and underscore"
      - name: acquirer_id
        type: string
        source: input
        description: "FK -> Acquirer.id; the sponsoring acquirer. AcquirerOps callers may only act on merchants whose acquirer_id equals their X-User-ID."
      - name: home_country_code
        type: string
        source: input
        description: "ISO-3166 alpha-2 country of the merchant outlet."
        constraints: "exactly 2 uppercase letters"
      - name: assigned_mcc
        type: string
        source: computed
        description: "The four-digit MCC currently assigned. Matches MccDefinition.mcc_code by value; it is a code, NOT an id reference. Written by calculations.mcc_assignment_selector at creation, by reclassification approval, and by audit sustain-findings."
      - name: mcc_status
        type: enum
        source: system
        description: "Category verification posture; gates transaction submission, reclassification and incentive enrollment."
        default: PENDING_VERIFICATION
        constraints: "one of PENDING_VERIFICATION, VERIFIED, UNDER_REVIEW, MISREPRESENTED"
      - name: mcc_status_before_review
        type: enum
        source: system
        description: "Snapshot of mcc_status taken when a MerchantCategoryAudit opens; restored verbatim by clear-findings."
        default: null
        constraints: "one of PENDING_VERIFICATION, VERIFIED, or null"
      - name: documentation_ref
        type: string
        source: system
        description: "Documentation reference captured by POST /merchants/{id}/verify-category."
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the CategoryAnalyst who verified the category."
        default: null
      - name: downgrade_count_current_quarter
        type: integer
        source: computed
        description: "COUNT of TransactionRecord rows for this merchant with qualification_status == DOWNGRADED whose SettlementBatch.status == FINALIZED and quarter_of(SettlementBatch.batch_date) == quarter_of(current_utc). Recomputed on batch finalize and on record reversal."
        default: 0
      - name: lifetime_net_assessed_cents
        type: integer
        source: computed
        description: "SUM of TransactionRecord.assessed_interchange_cents over rows for this merchant with qualification_status IN {QUALIFIED, DOWNGRADED}. Conserved quantity of calculations.merchant_assessment_ledger_invariant."
        default: 0

  - name: ReclassificationRequest
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the merchant whose category is challenged."
      - name: requested_mcc
        type: string
        source: input
        description: "Four-digit MCC being requested. Must match an existing MccDefinition.mcc_code by value."
        constraints: "exactly 4 digits"
      - name: justification
        type: string
        source: input
        description: "Free-text business justification supplied by the acquirer."
        constraints: "1..1000 chars"
      - name: supporting_doc_ref
        type: string
        source: system
        description: "Documentation reference; null until a resubmit supplies one. Required to approve a request whose requested MCC has requires_documentation == true."
        default: null
      - name: status
        type: enum
        source: system
        description: "Cyclic review lifecycle; SUBMITTED -> UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED is the revision loop."
        default: SUBMITTED
        constraints: "one of SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, SUSPENDED_PENDING_AUDIT, APPROVED, DENIED, SUPERSEDED"
      - name: review_round
        type: integer
        source: system
        description: "Number of times the request has entered SUBMITTED. Starts at 1; incremented by each resubmit. Capped by MAX_REVIEW_ROUNDS."
        default: 1
      - name: reviewer_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the CategoryAnalyst who moved the request to UNDER_REVIEW. Overwritten on each review call."
        default: null
      - name: decider_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the CategoryApprover who decided the request. Must differ from reviewer_user_id."
        default: null
      - name: info_request_note
        type: string
        source: system
        description: "Note recorded by the analyst when requesting more information."
        default: null
      - name: decision_note
        type: string
        source: system
        description: "Note recorded at decision time."
        default: null
      - name: decided_mcc
        type: string
        source: system
        description: "The MCC actually written onto the merchant when the decision was APPROVE; null for DENY."
        default: null
      - name: prior_status_before_suspension
        type: enum
        source: system
        description: "Snapshot of status taken when a MerchantCategoryAudit suspends this request; restored verbatim by audit clear-findings."
        default: null
        constraints: "one of SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, or null"

  - name: RateProgram
    parent: null
    common_fields: true
    fields:
      - name: program_code
        type: string
        source: input
        description: "Stable interchange program code (e.g. 'CPS_RETAIL_STD')."
        constraints: "1..40 chars, unique across RateProgram"
      - name: name
        type: string
        source: input
        description: "Published program name."
        constraints: "1..120 chars"
      - name: category
        type: enum
        source: input
        description: "Program family. Exactly one RateProgram with category STANDARD acts as the unconditional fallback tier."
        constraints: "one of CPS_RETAIL, SMALL_TICKET, UTILITY, GOVERNMENT, CHARITY, STANDARD"
      - name: eligible_mcc_codes
        type: array
        source: input
        description: "Four-digit MCC code strings this program covers. Compared by value against Merchant.assigned_mcc."
        constraints: "non-empty array of 4-digit strings, no duplicates"
      - name: base_rate_bps
        type: integer
        source: input
        description: "Ad-valorem interchange rate in basis points applied to TransactionRecord.amount_cents."
        constraints: "0..1000"
      - name: per_item_fee_cents
        type: integer
        source: input
        description: "Flat per-transaction fee in cents added after the ad-valorem component."
        constraints: "0..500"
      - name: requires_data_elements
        type: array
        source: input
        description: "Clearing data elements that MUST all be present in TransactionRecord.data_elements for this program to remain a candidate."
        default: "[]"
        constraints: "subset of {AUTH_CODE, TERMINAL_ID, TRANSACTION_DATE, CARDHOLDER_ZIP, CUSTOMER_ACCOUNT_REF, TAX_AMOUNT}, no duplicates"
      - name: max_clearing_delay_hours
        type: integer
        source: input
        description: "Maximum TransactionRecord.clearing_delay_hours tolerated by this program. Enforced only by the FINAL_CLEARING_BASED variant of calculations.qualification_evaluation."
        constraints: "0..8760"

  - name: RateProgramVersion
    parent: RateProgram
    common_fields: true
    fields:
      - name: rate_program_id
        type: string
        source: input
        description: "FK -> RateProgram.id; the program this quarterly version restates."
      - name: publication_quarter
        type: string
        source: input
        description: "Quarter label of the rate-change publication."
        constraints: "matches ^(20[0-9]{2})Q[1-4]$"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the version's effective interval (ISO 8601 UTC, three fractional digits)."
      - name: effective_to
        type: datetime
        source: input
        description: "EXCLUSIVE end of the version's effective interval. Interval is half-open [effective_from, effective_to); adjacency (prior.effective_to == this.effective_from) is permitted."
      - name: base_rate_bps
        type: integer
        source: input
        description: "Restated ad-valorem rate published for the quarter."
        constraints: "0..1000"
      - name: per_item_fee_cents
        type: integer
        source: input
        description: "Restated per-item fee published for the quarter."
        constraints: "0..500"
      - name: implementation_deadline
        type: datetime
        source: input
        description: "Last instant an acquirer implementation window may END. Upper bound of the window-bounds check."
      - name: status
        type: enum
        source: system
        description: "Publication lifecycle."
        default: DRAFT
        constraints: "one of DRAFT, PUBLISHED, SUPERSEDED"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant at which publish succeeded. Lower bound of the implementation-window bounds check. Null while DRAFT."
        default: null

  - name: AcquirerImplementationWindow
    parent: null
    common_fields: true
    fields:
      - name: acquirer_id
        type: string
        source: input
        description: "FK -> Acquirer.id; the acquirer that must implement the published rate change."
      - name: rate_program_version_id
        type: string
        source: input
        description: "FK -> RateProgramVersion.id; the published version being implemented. Must be in status PUBLISHED."
      - name: platform_id
        type: string
        source: input
        description: "FK -> ProcessingPlatform.id; the resource whose buffered-interval capacity the window occupies."
      - name: window_start
        type: datetime
        source: input
        description: "INCLUSIVE start of the implementation window. Interval is closed [window_start, window_end]."
      - name: window_end
        type: datetime
        source: input
        description: "INCLUSIVE end of the implementation window."
      - name: status
        type: enum
        source: system
        description: "Window lifecycle; MISSED is set by the logical-clock sweep, COMPLETED_LATE by completing a MISSED window."
        default: SCHEDULED
        constraints: "one of SCHEDULED, IN_PROGRESS, COMPLETED, MISSED, COMPLETED_LATE"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the acquirer started the window."
        default: null
      - name: completion_note
        type: string
        source: system
        description: "Note supplied at completion."
        default: null

  - name: SettlementBatch
    parent: null
    common_fields: true
    fields:
      - name: acquirer_id
        type: string
        source: input
        description: "FK -> Acquirer.id; the acquirer submitting the clearing batch."
      - name: batch_date
        type: string
        source: input
        description: "Calendar date of the clearing batch, used for quarter attribution in downgrade counting and incentive volume windows."
        constraints: "matches ^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      - name: currency_code
        type: string
        source: input
        description: "ISO-4217 settlement currency of the batch. A TransactionRecord whose transaction_currency differs triggers the FX markup branch."
        constraints: "exactly 3 uppercase letters"
      - name: status
        type: enum
        source: system
        description: "Clearing lifecycle. Records may only be added while OPEN; final qualification happens at FINALIZED."
        default: OPEN
        constraints: "one of OPEN, SUBMITTED, FINALIZED"
      - name: record_count
        type: integer
        source: computed
        description: "COUNT of TransactionRecord rows with settlement_batch_id == this.id (all qualification_status values, including REVERSED)."
        default: 0
      - name: total_assessed_cents
        type: integer
        source: computed
        description: "SUM of TransactionRecord.assessed_interchange_cents over rows with settlement_batch_id == this.id AND qualification_status IN {QUALIFIED, DOWNGRADED}. Conserved quantity of calculations.batch_assessment_ledger_invariant."
        default: 0
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock instant at which finalize succeeded."
        default: null

  - name: TransactionRecord
    parent: SettlementBatch
    common_fields: true
    fields:
      - name: settlement_batch_id
        type: string
        source: input
        description: "FK -> SettlementBatch.id; the batch carrying this clearing record."
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the merchant that acquired the transaction."
      - name: amount_cents
        type: integer
        source: input
        description: "Transaction amount in minor units of transaction_currency."
        constraints: "> 0, <= 100000000000"
      - name: transaction_currency
        type: string
        source: input
        description: "ISO-4217 currency the cardholder was billed in."
        constraints: "exactly 3 uppercase letters"
      - name: auth_code
        type: string
        source: input
        description: "Six-character authorization approval code from the authorization message."
        constraints: "exactly 6 chars"
      - name: auth_timestamp
        type: datetime
        source: input
        description: "Instant the authorization was approved."
      - name: clearing_timestamp
        type: datetime
        source: input
        description: "Instant the clearing record was presented. Must be >= auth_timestamp."
      - name: data_elements
        type: array
        source: input
        description: "Clearing data elements actually present in the message. Drives downgrade detection."
        default: "[]"
        constraints: "subset of {AUTH_CODE, TERMINAL_ID, TRANSACTION_DATE, CARDHOLDER_ZIP, CUSTOMER_ACCOUNT_REF, TAX_AMOUNT}, no duplicates"
      - name: authorization_status
        type: enum
        source: system
        description: "First of two INDEPENDENT state dimensions on this row. Moves on auth reversal and on logical-clock auth expiry; never moved by batch finalize."
        default: AUTH_APPROVED
        constraints: "one of AUTH_APPROVED, AUTH_REVERSED, AUTH_EXPIRED"
      - name: qualification_status
        type: enum
        source: system
        description: "Second of two INDEPENDENT state dimensions on this row. Moves on batch finalize and on clearing reversal; never moved by auth reversal or auth expiry."
        default: PENDING
        constraints: "one of PENDING, QUALIFIED, DOWNGRADED, REVERSED"
      - name: clearing_delay_hours
        type: integer
        source: computed
        description: "floor((clearing_timestamp - auth_timestamp) / 3600 seconds). Computed once at record creation and never recomputed."
      - name: cross_border
        type: boolean
        source: computed
        description: "true when Merchant(merchant_id).home_country_code != Acquirer(SettlementBatch(settlement_batch_id).acquirer_id).country_code. Computed once at record creation."
      - name: provisional_rate_program_id
        type: string
        source: computed
        description: "FK -> RateProgram.id; program chosen by the PROVISIONAL_AUTH_BASED variant at record creation."
      - name: qualified_rate_program_id
        type: string
        source: computed
        description: "FK -> RateProgram.id; program chosen by the FINAL_CLEARING_BASED variant at batch finalize. Null while qualification_status == PENDING."
        default: null
      - name: provisional_assessed_cents
        type: integer
        source: computed
        description: "Interchange assessment under provisional_rate_program_id, computed at record creation. Never posted to any ledger."
      - name: assessed_interchange_cents
        type: integer
        source: computed
        description: "Interchange assessment under qualified_rate_program_id, computed at batch finalize. Zeroed by a CLEARING_REVERSAL."
        default: 0
      - name: cross_border_surcharge_cents
        type: integer
        source: computed
        description: "Cross-border component included inside assessed_interchange_cents before the cap/floor clamp."
        default: 0
      - name: fx_markup_cents
        type: integer
        source: computed
        description: "Currency-conversion markup component included inside assessed_interchange_cents before the cap/floor clamp."
        default: 0
      - name: downgrade_reason
        type: enum
        source: system
        description: "Set only when the FINAL_CLEARING_BASED variant selects the STANDARD program; null otherwise."
        default: null
        constraints: "one of MISSING_DATA_ELEMENTS, LATE_CLEARING, TICKET_SIZE_INELIGIBLE, AUTH_MISSING, MCC_INELIGIBLE, or null"
      - name: mcc_at_qualification
        type: string
        source: system
        description: "Snapshot of Merchant.assigned_mcc read at batch finalize. May differ from the MCC in force at record creation."
        default: null
      - name: reversal_type
        type: enum
        source: system
        description: "Which of the two dimensions the reversal acted on."
        default: null
        constraints: "one of AUTH_REVERSAL, CLEARING_REVERSAL, or null"
      - name: reversal_reason
        type: string
        source: system
        description: "Free-text reversal reason."
        default: null

  - name: IncentiveProgram
    parent: null
    common_fields: true
    fields:
      - name: program_name
        type: string
        source: input
        description: "Published incentive program name."
        constraints: "1..120 chars, unique"
      - name: eligible_mcc_codes
        type: array
        source: input
        description: "Four-digit MCC code strings admitted to the program. Compared by value against Merchant.assigned_mcc at enrollment and re-checked whenever the merchant's MCC changes."
        constraints: "non-empty array of 4-digit strings, no duplicates"
      - name: total_capacity_cents
        type: integer
        source: input
        description: "Immutable pool of committable volume. Conserved quantity of calculations.incentive_capacity_ledger_invariant."
        constraints: "> 0"
      - name: min_commitment_cents
        type: integer
        source: input
        description: "Floor on a single enrollment's committed_volume_cents; also the CLOSED_FULL threshold on uncommitted_capacity_cents."
        constraints: "> 0, <= total_capacity_cents"
      - name: reopen_threshold_cents
        type: integer
        source: input
        description: "Once CLOSED_FULL, the program returns to OPEN as soon as uncommitted_capacity_cents >= this value."
        constraints: ">= min_commitment_cents"
      - name: performance_threshold_pct
        type: number
        source: input
        description: "Minimum IncentiveEnrollment.performance_score_pct that keeps an enrollment out of PROBATION. Compared with >=."
        constraints: "0.00..1000.00, two decimal places"
      - name: uncommitted_capacity_cents
        type: integer
        source: computed
        description: "total_capacity_cents minus SUM of IncentiveEnrollment.committed_volume_cents over rows with incentive_program_id == this.id AND status IN {ENROLLED, PROBATION}."
      - name: enrolled_count
        type: integer
        source: computed
        description: "COUNT of IncentiveEnrollment rows with incentive_program_id == this.id AND status IN {ENROLLED, PROBATION}."
        default: 0
      - name: enrollment_state
        type: enum
        source: system
        description: "OPEN while capacity remains; CLOSED_FULL once uncommitted_capacity_cents < min_commitment_cents. Cycles back to OPEN when a release lifts uncommitted_capacity_cents to >= reopen_threshold_cents."
        default: OPEN
        constraints: "one of OPEN, CLOSED_FULL"

  - name: IncentiveEnrollment
    parent: null
    common_fields: true
    fields:
      - name: incentive_program_id
        type: string
        source: input
        description: "FK -> IncentiveProgram.id; the program enrolled into."
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the enrolling merchant."
      - name: committed_volume_cents
        type: integer
        source: input
        description: "Volume the merchant commits to for the measurement window. Debited from the program pool while status IN {ENROLLED, PROBATION}."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "PENDING exists only inside the creating request and is never observable; the create call resolves it to ENROLLED or WAITLISTED before responding. ENROLLED <-> PROBATION is the performance loop."
        default: PENDING
        constraints: "one of PENDING, ENROLLED, WAITLISTED, PROBATION, TERMINATED_SHORTFALL, TERMINATED_INELIGIBLE, WITHDRAWN"
      - name: waitlist_requested
        type: boolean
        source: input
        description: "Client opt-in: when true an otherwise-rejected create is parked as WAITLISTED with no capacity debit instead of erroring."
        default: false
      - name: enrolled_at
        type: datetime
        source: system
        description: "Logical-clock instant at which status first became ENROLLED. Inclusive lower bound of the volume-measurement window."
        default: null
      - name: last_evaluated_basis
        type: enum
        source: system
        description: "Which variant of calculations.incentive_performance_score produced the stored score."
        default: null
        constraints: "one of TRAILING, PROJECTED, or null"
      - name: achieved_volume_cents
        type: integer
        source: computed
        description: "Measured (or projected) transaction volume under the basis recorded in last_evaluated_basis."
        default: 0
      - name: performance_score_pct
        type: number
        source: computed
        description: "round_half_up(achieved_volume_cents * 100 / committed_volume_cents, 2)."
        default: 0.00
      - name: gross_assessed_volume_cents
        type: integer
        source: computed
        description: "Pre-discount assessed interchange over the full measurement window; the ONLY input to the incentive tier lookup."
        default: 0
      - name: tier_code
        type: enum
        source: computed
        description: "Volume tier resolved from gross_assessed_volume_cents (never from net)."
        default: null
        constraints: "one of TIER_0, TIER_1, TIER_2, TIER_3, or null"
      - name: incentive_credit_cents
        type: integer
        source: computed
        description: "round_half_up(gross_assessed_volume_cents * TIER_DISCOUNT_BPS[tier_code] / 10000)."
        default: 0
      - name: net_assessed_volume_cents
        type: integer
        source: computed
        description: "gross_assessed_volume_cents - incentive_credit_cents. Never fed back into the tier lookup."
        default: 0
      - name: probation_count
        type: integer
        source: system
        description: "Number of times this enrollment has entered PROBATION."
        default: 0
      - name: withdrawal_reason
        type: string
        source: system
        description: "Reason recorded on voluntary withdrawal."
        default: null

  - name: MerchantCategoryAudit
    parent: null
    common_fields: true
    fields:
      - name: merchant_id
        type: string
        source: input
        description: "FK -> Merchant.id; the merchant under category audit."
      - name: trigger_reason
        type: enum
        source: input
        description: "Why the audit opened. DOWNGRADE_THRESHOLD is system-only and is rejected on the manual create endpoint."
        constraints: "one of DOWNGRADE_THRESHOLD, RECLASS_SUSPICION, PERIODIC, COMPLAINT"
      - name: status
        type: enum
        source: system
        description: "Fork-join lifecycle: FIELDWORK forks into FINDINGS_SUSTAINED or FINDINGS_CLEARED with disjoint side-effect sets, then both join at CLOSED."
        default: SCHEDULED
        constraints: "one of SCHEDULED, FIELDWORK, FINDINGS_SUSTAINED, FINDINGS_CLEARED, CLOSED"
      - name: auditor_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ComplianceAuditor who started fieldwork. Null while SCHEDULED."
        default: null
      - name: fieldwork_start
        type: datetime
        source: system
        description: "Declared fieldwork start instant."
        default: null
      - name: fieldwork_end
        type: datetime
        source: system
        description: "Declared fieldwork end instant."
        default: null
      - name: correct_mcc
        type: string
        source: system
        description: "The MCC the auditor determined to be correct; written onto Merchant.assigned_mcc when findings are sustained."
        default: null
      - name: findings_note
        type: string
        source: system
        description: "Auditor narrative recorded at sustain or clear."
        default: null
      - name: penalty_assessed_cents
        type: integer
        source: computed
        description: "Misrepresentation penalty; non-zero only in status FINDINGS_SUSTAINED and CLOSED-after-sustain."
        default: 0
      - name: mcc_at_audit_open
        type: string
        source: system
        description: "Snapshot of Merchant.assigned_mcc taken when the audit was created."
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ComplianceAuditor who closed the audit; must differ from auditor_user_id."
        default: null

  - name: FxRate
    parent: null
    common_fields: true
    fields:
      - name: base_currency
        type: string
        source: input
        description: "ISO-4217 code of the transaction currency."
        constraints: "exactly 3 uppercase letters"
      - name: quote_currency
        type: string
        source: input
        description: "ISO-4217 code of the settlement currency."
        constraints: "exactly 3 uppercase letters"
      - name: rate
        type: number
        source: input
        description: "Mid-market conversion rate from base_currency to quote_currency."
        constraints: "> 0, up to 6 decimal places"
      - name: markup_bps
        type: integer
        source: input
        description: "Currency-conversion assessment in basis points applied to TransactionRecord.amount_cents when the transaction currency differs from the batch currency."
        constraints: "0..500"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive instant from which this rate row may be selected."

# =============================================================================
# 1.2  State Machine Table
# =============================================================================
state_machines:
  - entity: Merchant
    initial_state: PENDING_VERIFICATION
    terminal_states: [MISREPRESENTED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /merchants (system auto-verify at creation when MccDefinition(assigned_mcc).requires_documentation == false)"
        actor: system
        preconditions:
          - "calculations.mcc_assignment_selector resolved a MccDefinition for business_type_key"
          - "MccDefinition(assigned_mcc).requires_documentation == false"
        side_effects:
          - "sets mcc_status = VERIFIED in the same request that creates the row (PENDING_VERIFICATION is never observable for such merchants)"
        note: "When requires_documentation == true the row is returned in PENDING_VERIFICATION and needs an explicit verify-category call."
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /merchants/{id}/verify-category"
        actor: CategoryAnalyst
        preconditions:
          - "mcc_status == PENDING_VERIFICATION"
          - "documentation_ref is a non-empty string"
        side_effects:
          - "sets documentation_ref to the supplied value"
          - "sets verified_by_user_id = X-User-ID"
          - "increments Merchant.version by 1"
      - from: VERIFIED
        to: UNDER_REVIEW
        trigger: "POST /merchant-category-audits, or the system auto-audit fired by POST /settlement-batches/{id}/finalize when downgrade_count_current_quarter reaches DOWNGRADE_AUDIT_TRIGGER"
        actor: ComplianceAuditor | system
        preconditions:
          - "mcc_status IN {PENDING_VERIFICATION, VERIFIED}"
        side_effects:
          - "sets mcc_status_before_review = the pre-transition mcc_status value"
          - "CASCADE HOP: every ReclassificationRequest with merchant_id == this.id AND status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} snapshots prior_status_before_suspension = status and moves to SUSPENDED_PENDING_AUDIT (processed created_at ASC)"
          - "increments Merchant.version by 1"
      - from: PENDING_VERIFICATION
        to: UNDER_REVIEW
        trigger: "POST /merchant-category-audits"
        actor: ComplianceAuditor
        preconditions:
          - "mcc_status IN {PENDING_VERIFICATION, VERIFIED}"
        side_effects:
          - "sets mcc_status_before_review = PENDING_VERIFICATION"
          - "increments Merchant.version by 1"
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /merchant-category-audits/{id}/clear-findings (when mcc_status_before_review == VERIFIED)"
        actor: ComplianceAuditor
        preconditions:
          - "MerchantCategoryAudit.status == FIELDWORK"
          - "mcc_status == UNDER_REVIEW"
          - "mcc_status_before_review == VERIFIED"
        side_effects:
          - "restores mcc_status = mcc_status_before_review, then sets mcc_status_before_review = null"
          - "COMPENSATION: every ReclassificationRequest with merchant_id == this.id AND status == SUSPENDED_PENDING_AUDIT is restored to prior_status_before_suspension, then prior_status_before_suspension = null (processed created_at ASC)"
          - "increments Merchant.version by 1"
      - from: UNDER_REVIEW
        to: PENDING_VERIFICATION
        trigger: "POST /merchant-category-audits/{id}/clear-findings (when mcc_status_before_review == PENDING_VERIFICATION)"
        actor: ComplianceAuditor
        preconditions:
          - "MerchantCategoryAudit.status == FIELDWORK"
          - "mcc_status_before_review == PENDING_VERIFICATION"
        side_effects:
          - "restores mcc_status = PENDING_VERIFICATION, then sets mcc_status_before_review = null"
          - "increments Merchant.version by 1"
      - from: UNDER_REVIEW
        to: MISREPRESENTED
        trigger: "POST /merchant-category-audits/{id}/sustain-findings"
        actor: ComplianceAuditor
        preconditions:
          - "MerchantCategoryAudit.status == FIELDWORK"
          - "mcc_status == UNDER_REVIEW"
          - "an MccDefinition with mcc_code == correct_mcc exists"
        side_effects:
          - "CASCADE HOP 1: sets assigned_mcc = MerchantCategoryAudit.correct_mcc and mcc_status = MISREPRESENTED"
          - "CASCADE HOP 2 (caused by hop 1, not by the audit call): every IncentiveEnrollment with merchant_id == this.id AND status IN {ENROLLED, PROBATION} whose IncentiveProgram.eligible_mcc_codes no longer contains the NEW assigned_mcc moves to TERMINATED_INELIGIBLE (processed created_at ASC)"
          - "every ReclassificationRequest with merchant_id == this.id AND status == SUSPENDED_PENDING_AUDIT moves to DENIED with decision_note 'auto-denied by sustained category audit'"
          - "increments Merchant.version by 1"
        note: "MISREPRESENTED is terminal for the Merchant lifecycle: no transition leaves it, and it blocks record submission, reclassification and enrollment."

  - entity: ReclassificationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /reclassification-requests/{id}/review"
        actor: CategoryAnalyst
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets reviewer_user_id = X-User-ID (overwriting any prior value)"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /reclassification-requests/{id}/request-info"
        actor: CategoryAnalyst
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "sets info_request_note to the supplied value"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /reclassification-requests/{id}/resubmit"
        actor: AcquirerOps
        preconditions:
          - "status == INFO_REQUESTED"
          - "Merchant(merchant_id).mcc_status NOT IN {UNDER_REVIEW, MISREPRESENTED}"
          - "review_round < MAX_REVIEW_ROUNDS"
        side_effects:
          - "increments review_round by 1"
          - "sets supporting_doc_ref to the supplied value"
          - "clears info_request_note to null"
        note: "This is the revision cycle. The third resubmit attempt (review_round already == MAX_REVIEW_ROUNDS == 3) is rejected with ERR_REVIEW_ROUND_LIMIT_EXCEEDED and the request stays in INFO_REQUESTED."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /reclassification-requests/{id}/decide with decision == APPROVE"
        actor: CategoryApprover
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != reviewer_user_id (segregation of duties)"
          - "an MccDefinition with mcc_code == requested_mcc exists"
          - "MccDefinition(requested_mcc).requires_documentation == false OR supporting_doc_ref is non-null"
        side_effects:
          - "sets decider_user_id = X-User-ID, decision_note, decided_mcc = requested_mcc"
          - "CASCADE HOP 1: sets Merchant.assigned_mcc = requested_mcc; sets Merchant.mcc_status = PENDING_VERIFICATION when MccDefinition(requested_mcc).requires_documentation == true, otherwise leaves mcc_status unchanged"
          - "CASCADE HOP 2 (caused by hop 1): every IncentiveEnrollment for the merchant with status IN {ENROLLED, PROBATION} whose program's eligible_mcc_codes lacks the new MCC moves to TERMINATED_INELIGIBLE (created_at ASC)"
          - "increments Merchant.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /reclassification-requests/{id}/decide with decision == DENY"
        actor: CategoryApprover
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != reviewer_user_id (segregation of duties)"
        side_effects:
          - "sets decider_user_id = X-User-ID, decision_note; decided_mcc stays null"
          - "Merchant.assigned_mcc and Merchant.mcc_status are left untouched"
      - from: SUBMITTED
        to: SUSPENDED_PENDING_AUDIT
        trigger: "system, when a MerchantCategoryAudit opens on the merchant"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "snapshots prior_status_before_suspension = SUBMITTED"
      - from: UNDER_REVIEW
        to: SUSPENDED_PENDING_AUDIT
        trigger: "system, when a MerchantCategoryAudit opens on the merchant"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "snapshots prior_status_before_suspension = UNDER_REVIEW"
      - from: INFO_REQUESTED
        to: SUSPENDED_PENDING_AUDIT
        trigger: "system, when a MerchantCategoryAudit opens on the merchant"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "snapshots prior_status_before_suspension = INFO_REQUESTED"
      - from: SUSPENDED_PENDING_AUDIT
        to: SUBMITTED
        trigger: "system, on POST /merchant-category-audits/{id}/clear-findings when prior_status_before_suspension == SUBMITTED"
        actor: system
        preconditions:
          - "status == SUSPENDED_PENDING_AUDIT"
        side_effects:
          - "clears prior_status_before_suspension to null"
      - from: SUSPENDED_PENDING_AUDIT
        to: UNDER_REVIEW
        trigger: "system, on POST /merchant-category-audits/{id}/clear-findings when prior_status_before_suspension == UNDER_REVIEW"
        actor: system
        preconditions:
          - "status == SUSPENDED_PENDING_AUDIT"
        side_effects:
          - "clears prior_status_before_suspension to null"
      - from: SUSPENDED_PENDING_AUDIT
        to: INFO_REQUESTED
        trigger: "system, on POST /merchant-category-audits/{id}/clear-findings when prior_status_before_suspension == INFO_REQUESTED"
        actor: system
        preconditions:
          - "status == SUSPENDED_PENDING_AUDIT"
        side_effects:
          - "clears prior_status_before_suspension to null"
      - from: SUSPENDED_PENDING_AUDIT
        to: DENIED
        trigger: "system, on POST /merchant-category-audits/{id}/sustain-findings"
        actor: system
        preconditions:
          - "status == SUSPENDED_PENDING_AUDIT"
        side_effects:
          - "sets decision_note = 'auto-denied by sustained category audit'; decider_user_id stays null"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system, on POST /reclassification-requests creating a newer request for the same merchant"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "the newer request is created in SUBMITTED with review_round 1"
      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "system, on POST /reclassification-requests creating a newer request for the same merchant"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "the newer request is created in SUBMITTED with review_round 1"
      - from: INFO_REQUESTED
        to: SUPERSEDED
        trigger: "system, on POST /reclassification-requests creating a newer request for the same merchant"
        actor: system
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "the newer request is created in SUBMITTED with review_round 1"

  - entity: RateProgramVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /rate-program-versions/{id}/publish"
        actor: NetworkAdmin
        preconditions:
          - "status == DRAFT"
          - "no other RateProgramVersion with the same rate_program_id and status == PUBLISHED has a half-open interval [effective_from, effective_to) intersecting this row's interval (calculations.rate_version_window_overlap_check)"
        side_effects:
          - "sets published_at = current_utc"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /_clock/set_current_utc (sweep step 1)"
        actor: system
        preconditions:
          - "status == PUBLISHED"
          - "effective_to <= the new logical-clock value"
        side_effects:
          - "no cascade; AcquirerImplementationWindow rows already pointing at this version keep their own status"

  - entity: AcquirerImplementationWindow
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, COMPLETED_LATE]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /implementation-windows/{id}/start"
        actor: AcquirerOps
        preconditions:
          - "status == SCHEDULED"
          - "RateProgramVersion(rate_program_version_id).status == PUBLISHED"
        side_effects:
          - "sets started_at = current_utc"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /implementation-windows/{id}/complete"
        actor: AcquirerOps
        preconditions:
          - "status == IN_PROGRESS"
        side_effects:
          - "sets completion_note"
          - "recomputes Acquirer.missed_window_count"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /_clock/set_current_utc (sweep step 2)"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, IN_PROGRESS}"
          - "window_end < the new logical-clock value"
        side_effects:
          - "CASCADE HOP 1: recomputes Acquirer.missed_window_count"
          - "CASCADE HOP 2 (caused by hop 1): when Acquirer.missed_window_count > 0 the acquirer moves COMPLIANT -> NON_COMPLIANT, which blocks POST /settlement-batches/{id}/finalize for every batch of that acquirer"
      - from: IN_PROGRESS
        to: MISSED
        trigger: "POST /_clock/set_current_utc (sweep step 2)"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, IN_PROGRESS}"
          - "window_end < the new logical-clock value"
        side_effects:
          - "recomputes Acquirer.missed_window_count; acquirer moves COMPLIANT -> NON_COMPLIANT when the count becomes > 0"
      - from: MISSED
        to: COMPLETED_LATE
        trigger: "POST /implementation-windows/{id}/complete"
        actor: AcquirerOps
        preconditions:
          - "status == MISSED"
        side_effects:
          - "sets completion_note"
          - "COMPENSATION HOP 1: recomputes Acquirer.missed_window_count"
          - "COMPENSATION HOP 2 (caused by hop 1): when the recomputed count reaches 0 the acquirer moves NON_COMPLIANT -> COMPLIANT and finalize is unblocked"

  - entity: Acquirer
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: NON_COMPLIANT
        trigger: "system, when missed_window_count is recomputed to a value > 0"
        actor: system
        preconditions:
          - "compliance_status == COMPLIANT"
          - "missed_window_count > 0 after recomputation"
        side_effects:
          - "POST /settlement-batches/{id}/finalize is rejected with ERR_ACQUIRER_NON_COMPLIANT for every SettlementBatch of this acquirer"
      - from: NON_COMPLIANT
        to: COMPLIANT
        trigger: "system, when missed_window_count is recomputed to 0"
        actor: system
        preconditions:
          - "compliance_status == NON_COMPLIANT"
          - "missed_window_count == 0 after recomputation"
        side_effects:
          - "finalize is unblocked"

  - entity: SettlementBatch
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /settlement-batches/{id}/submit"
        actor: AcquirerOps
        preconditions:
          - "status == OPEN"
        side_effects:
          - "no further TransactionRecord rows may be added"
          - "increments SettlementBatch.version by 1"
        note: "A batch with record_count == 0 may be submitted; the empty batch is a legal boundary case."
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /settlement-batches/{id}/finalize"
        actor: NetworkAdmin
        preconditions:
          - "status == SUBMITTED"
          - "Acquirer(acquirer_id).compliance_status == COMPLIANT"
        side_effects:
          - "sets finalized_at = current_utc"
          - "CASCADE HOP 1: for every member TransactionRecord in created_at ASC order, runs the FINAL_CLEARING_BASED variant of calculations.qualification_evaluation, writing mcc_at_qualification, qualified_rate_program_id, downgrade_reason, cross_border_surcharge_cents, fx_markup_cents, assessed_interchange_cents and moving qualification_status PENDING -> QUALIFIED or PENDING -> DOWNGRADED"
          - "recomputes total_assessed_cents via calculations.batch_assessment_total (round-per-record then sum)"
          - "CASCADE HOP 2 (caused by hop 1): for every affected Merchant, recomputes lifetime_net_assessed_cents and downgrade_count_current_quarter"
          - "CASCADE HOP 3 (caused by hop 2): for every Merchant whose recomputed downgrade_count_current_quarter >= DOWNGRADE_AUDIT_TRIGGER and whose mcc_status IN {PENDING_VERIFICATION, VERIFIED} and which has no MerchantCategoryAudit in status IN {SCHEDULED, FIELDWORK}, the system creates a MerchantCategoryAudit with trigger_reason DOWNGRADE_THRESHOLD in status SCHEDULED, auditor_user_id null, mcc_at_audit_open = assigned_mcc, and moves the merchant to UNDER_REVIEW (merchants processed created_at ASC)"
          - "CASCADE HOP 4 (caused by hop 3): each such merchant's ReclassificationRequest rows in status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} snapshot prior_status_before_suspension and move to SUSPENDED_PENDING_AUDIT"
          - "increments SettlementBatch.version by 1"

  - entity: TransactionRecord
    initial_state: AUTH_APPROVED
    terminal_states: []
    transitions:
      - from: AUTH_APPROVED
        to: AUTH_REVERSED
        trigger: "POST /transaction-records/{id}/reverse with reversal_type == AUTH_REVERSAL"
        actor: AcquirerOps
        preconditions:
          - "authorization_status == AUTH_APPROVED"
        side_effects:
          - "sets reversal_type = AUTH_REVERSAL and reversal_reason"
          - "DIMENSION ISOLATION: qualification_status, assessed_interchange_cents, SettlementBatch.total_assessed_cents and Merchant.lifetime_net_assessed_cents are all left untouched"
        note: "Dimension 1 of 2 (authorization_status). Independent of the qualification dimension below."
      - from: AUTH_APPROVED
        to: AUTH_EXPIRED
        trigger: "POST /_clock/set_current_utc (sweep step 3)"
        actor: system
        preconditions:
          - "authorization_status == AUTH_APPROVED"
          - "qualification_status == PENDING"
          - "(new logical-clock value - auth_timestamp) > AUTH_VALIDITY_HOURS hours"
        side_effects:
          - "no ledger movement; the record stays a member of its batch and remains eligible for finalize, where the AUTH_MISSING downgrade path applies"
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /settlement-batches/{id}/finalize"
        actor: system
        preconditions:
          - "qualification_status == PENDING"
          - "SettlementBatch.status == SUBMITTED at call time"
          - "the FINAL_CLEARING_BASED variant selected a RateProgram whose category != STANDARD"
        side_effects:
          - "writes qualified_rate_program_id, assessed_interchange_cents, mcc_at_qualification; downgrade_reason stays null"
          - "authorization_status is NOT touched"
        note: "Dimension 2 of 2 (qualification_status)."
      - from: PENDING
        to: DOWNGRADED
        trigger: "POST /settlement-batches/{id}/finalize"
        actor: system
        preconditions:
          - "qualification_status == PENDING"
          - "the FINAL_CLEARING_BASED variant selected the RateProgram whose category == STANDARD"
        side_effects:
          - "writes qualified_rate_program_id (the STANDARD program), assessed_interchange_cents, mcc_at_qualification and downgrade_reason per calculations.downgrade_reason_resolution"
          - "contributes +1 to Merchant.downgrade_count_current_quarter"
      - from: QUALIFIED
        to: REVERSED
        trigger: "POST /transaction-records/{id}/reverse with reversal_type == CLEARING_REVERSAL"
        actor: AcquirerOps
        preconditions:
          - "qualification_status IN {QUALIFIED, DOWNGRADED}"
        side_effects:
          - "COMPENSATION HOP 1: sets assessed_interchange_cents = 0, cross_border_surcharge_cents = 0, fx_markup_cents = 0, reversal_type = CLEARING_REVERSAL, reversal_reason"
          - "COMPENSATION HOP 2 (caused by hop 1): recomputes SettlementBatch.total_assessed_cents"
          - "COMPENSATION HOP 3 (caused by hop 1): recomputes Merchant.lifetime_net_assessed_cents and Merchant.downgrade_count_current_quarter"
          - "authorization_status is NOT touched"
      - from: DOWNGRADED
        to: REVERSED
        trigger: "POST /transaction-records/{id}/reverse with reversal_type == CLEARING_REVERSAL"
        actor: AcquirerOps
        preconditions:
          - "qualification_status IN {QUALIFIED, DOWNGRADED}"
        side_effects:
          - "same three compensation hops as QUALIFIED -> REVERSED; additionally the merchant's downgrade_count_current_quarter drops by 1 because the row no longer counts as DOWNGRADED"

  - entity: IncentiveProgram
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED_FULL
        trigger: "system, after any capacity debit (POST /incentive-enrollments or a waitlist promotion)"
        actor: system
        preconditions:
          - "enrollment_state == OPEN"
          - "uncommitted_capacity_cents < min_commitment_cents after the debit"
        side_effects:
          - "further POST /incentive-enrollments calls with waitlist_requested false are rejected with ERR_ENROLLMENT_CLOSED"
      - from: CLOSED_FULL
        to: OPEN
        trigger: "system, after any capacity release (withdraw, TERMINATED_INELIGIBLE, TERMINATED_SHORTFALL)"
        actor: system
        preconditions:
          - "enrollment_state == CLOSED_FULL"
          - "uncommitted_capacity_cents >= reopen_threshold_cents after the release"
        side_effects:
          - "CASCADE: promotes the single WAITLISTED IncentiveEnrollment of this program with the smallest created_at (ties impossible: created_at is unique per row within a program) to ENROLLED when its committed_volume_cents <= uncommitted_capacity_cents, debiting the pool; if the earliest WAITLISTED row does not fit, NO promotion occurs and no later row is considered"

  - entity: IncentiveEnrollment
    initial_state: PENDING
    terminal_states: [TERMINATED_SHORTFALL, TERMINATED_INELIGIBLE, WITHDRAWN]
    transitions:
      - from: PENDING
        to: ENROLLED
        trigger: "POST /incentive-enrollments (capacity available)"
        actor: system
        preconditions:
          - "IncentiveProgram.enrollment_state == OPEN"
          - "committed_volume_cents <= IncentiveProgram.uncommitted_capacity_cents"
          - "Merchant.mcc_status == VERIFIED"
          - "Merchant.assigned_mcc IN IncentiveProgram.eligible_mcc_codes"
        side_effects:
          - "sets enrolled_at = current_utc"
          - "debits IncentiveProgram.uncommitted_capacity_cents by committed_volume_cents and increments enrolled_count by 1"
          - "increments IncentiveProgram.version by 1"
      - from: PENDING
        to: WAITLISTED
        trigger: "POST /incentive-enrollments with waitlist_requested == true while the program cannot admit the commitment"
        actor: system
        preconditions:
          - "waitlist_requested == true"
          - "IncentiveProgram.enrollment_state == CLOSED_FULL OR committed_volume_cents > IncentiveProgram.uncommitted_capacity_cents"
        side_effects:
          - "NO capacity debit; enrolled_at stays null"
          - "increments IncentiveProgram.version by 1"
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system, on the CLOSED_FULL -> OPEN capacity-release cascade"
        actor: system
        preconditions:
          - "status == WAITLISTED"
          - "this row has the smallest created_at among the program's WAITLISTED rows"
          - "committed_volume_cents <= IncentiveProgram.uncommitted_capacity_cents"
        side_effects:
          - "sets enrolled_at = current_utc"
          - "debits IncentiveProgram.uncommitted_capacity_cents and increments enrolled_count by 1"
      - from: ENROLLED
        to: PROBATION
        trigger: "POST /incentive-enrollments/{id}/evaluate-performance"
        actor: NetworkAdmin
        preconditions:
          - "status == ENROLLED"
          - "performance_score_pct < IncentiveProgram.performance_threshold_pct (strict less-than; equality keeps the enrollment ENROLLED)"
        side_effects:
          - "increments probation_count by 1"
          - "capacity stays debited; uncommitted_capacity_cents is unchanged because PROBATION is inside the committed set"
      - from: PROBATION
        to: ENROLLED
        trigger: "POST /incentive-enrollments/{id}/evaluate-performance"
        actor: NetworkAdmin
        preconditions:
          - "status == PROBATION"
          - "performance_score_pct >= IncentiveProgram.performance_threshold_pct"
        side_effects:
          - "probation_count is NOT decremented (it is a lifetime counter)"
        note: "ENROLLED <-> PROBATION is the performance cycle; an enrollment may oscillate any number of times."
      - from: PROBATION
        to: TERMINATED_SHORTFALL
        trigger: "POST /incentive-enrollments/{id}/evaluate-performance"
        actor: NetworkAdmin
        preconditions:
          - "status == PROBATION"
          - "performance_score_pct < IncentiveProgram.performance_threshold_pct"
        side_effects:
          - "RELEASE HOP 1: credits committed_volume_cents back to IncentiveProgram.uncommitted_capacity_cents and decrements enrolled_count by 1"
          - "RELEASE HOP 2 (caused by hop 1): when enrollment_state == CLOSED_FULL and the credited uncommitted_capacity_cents >= reopen_threshold_cents, the program moves CLOSED_FULL -> OPEN"
          - "RELEASE HOP 3 (caused by hop 2): the earliest-created WAITLISTED enrollment of the program is promoted to ENROLLED if it fits"
      - from: ENROLLED
        to: TERMINATED_INELIGIBLE
        trigger: "system, when the merchant's assigned_mcc changes (audit sustain-findings or reclassification approval) and the new MCC is not in the program's eligible_mcc_codes"
        actor: system
        preconditions:
          - "status IN {ENROLLED, PROBATION}"
          - "Merchant.assigned_mcc NOT IN IncentiveProgram.eligible_mcc_codes after the MCC change"
        side_effects:
          - "RELEASE HOP 1: credits committed_volume_cents back to uncommitted_capacity_cents and decrements enrolled_count by 1"
          - "RELEASE HOP 2 (caused by hop 1): program moves CLOSED_FULL -> OPEN when uncommitted_capacity_cents >= reopen_threshold_cents"
          - "RELEASE HOP 3 (caused by hop 2): earliest-created WAITLISTED enrollment is promoted to ENROLLED if it fits"
      - from: PROBATION
        to: TERMINATED_INELIGIBLE
        trigger: "system, when the merchant's assigned_mcc changes to an MCC outside the program"
        actor: system
        preconditions:
          - "status IN {ENROLLED, PROBATION}"
          - "Merchant.assigned_mcc NOT IN IncentiveProgram.eligible_mcc_codes after the MCC change"
        side_effects:
          - "same three release hops as ENROLLED -> TERMINATED_INELIGIBLE"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /incentive-enrollments/{id}/withdraw"
        actor: AcquirerOps
        preconditions:
          - "status IN {ENROLLED, PROBATION, WAITLISTED}"
        side_effects:
          - "sets withdrawal_reason"
          - "RELEASE HOP 1: credits committed_volume_cents back to uncommitted_capacity_cents and decrements enrolled_count by 1"
          - "RELEASE HOP 2 (caused by hop 1): program moves CLOSED_FULL -> OPEN when uncommitted_capacity_cents >= reopen_threshold_cents"
          - "RELEASE HOP 3 (caused by hop 2): earliest-created WAITLISTED enrollment is promoted to ENROLLED if it fits"
      - from: PROBATION
        to: WITHDRAWN
        trigger: "POST /incentive-enrollments/{id}/withdraw"
        actor: AcquirerOps
        preconditions:
          - "status IN {ENROLLED, PROBATION, WAITLISTED}"
        side_effects:
          - "same release hops as ENROLLED -> WITHDRAWN"
      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /incentive-enrollments/{id}/withdraw"
        actor: AcquirerOps
        preconditions:
          - "status IN {ENROLLED, PROBATION, WAITLISTED}"
        side_effects:
          - "sets withdrawal_reason; NO capacity credit occurs because a WAITLISTED row never debited the pool (invariant preserved)"

  - entity: MerchantCategoryAudit
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: FIELDWORK
        trigger: "POST /merchant-category-audits/{id}/start-fieldwork"
        actor: ComplianceAuditor
        preconditions:
          - "status == SCHEDULED"
          - "fieldwork_start < fieldwork_end"
        side_effects:
          - "sets auditor_user_id = X-User-ID, fieldwork_start, fieldwork_end"
      - from: FIELDWORK
        to: FINDINGS_SUSTAINED
        trigger: "POST /merchant-category-audits/{id}/sustain-findings"
        actor: ComplianceAuditor
        preconditions:
          - "status == FIELDWORK"
          - "X-User-ID == auditor_user_id"
          - "an MccDefinition with mcc_code == correct_mcc exists"
        side_effects:
          - "sets correct_mcc, findings_note and penalty_assessed_cents per calculations.misrepresentation_penalty"
          - "FORK BRANCH A CASCADE: Merchant moves UNDER_REVIEW -> MISREPRESENTED with assigned_mcc = correct_mcc, which terminates ineligible enrollments, which releases program capacity, which may reopen the program and promote a waitlisted enrollment"
          - "SUSPENDED_PENDING_AUDIT reclassification requests for the merchant move to DENIED"
      - from: FIELDWORK
        to: FINDINGS_CLEARED
        trigger: "POST /merchant-category-audits/{id}/clear-findings"
        actor: ComplianceAuditor
        preconditions:
          - "status == FIELDWORK"
          - "X-User-ID == auditor_user_id"
        side_effects:
          - "sets findings_note; penalty_assessed_cents stays 0; correct_mcc stays null"
          - "FORK BRANCH B CASCADE: Merchant.mcc_status is restored from mcc_status_before_review and assigned_mcc is left untouched"
          - "SUSPENDED_PENDING_AUDIT reclassification requests for the merchant are restored to prior_status_before_suspension"
          - "no IncentiveEnrollment is touched"
      - from: FINDINGS_SUSTAINED
        to: CLOSED
        trigger: "POST /merchant-category-audits/{id}/close"
        actor: ComplianceAuditor
        preconditions:
          - "status IN {FINDINGS_SUSTAINED, FINDINGS_CLEARED}"
          - "X-User-ID != auditor_user_id (segregation of duties: the auditor who reached the finding may not close it)"
        side_effects:
          - "sets closed_by_user_id = X-User-ID; penalty_assessed_cents is frozen"
        note: "Join point of the fork."
      - from: FINDINGS_CLEARED
        to: CLOSED
        trigger: "POST /merchant-category-audits/{id}/close"
        actor: ComplianceAuditor
        preconditions:
          - "status IN {FINDINGS_SUSTAINED, FINDINGS_CLEARED}"
          - "X-User-ID != auditor_user_id"
        side_effects:
          - "sets closed_by_user_id = X-User-ID; the merchant becomes auditable again (a new MerchantCategoryAudit may be created)"

# =============================================================================
# 1.2.1  Concurrency Rules  (OCC on the parent's `version` — the only sanctioned
#        write-write conflict mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: record-add-stale-batch
    parent_entity: SettlementBatch
    write_endpoint: "POST /settlement-batches/{id}/transaction-records"
    occ_field: "expected_batch_version"
    description: |
      Adding a clearing record to a SettlementBatch whose version has advanced since
      the client last observed it is rejected. Adding a second, different record to
      the same OPEN batch is legitimate product behaviour, so the rejection cannot be
      derived from any state precondition: the guard is purely the stale version the
      client carries, because each accepted record recomputes record_count and
      total_assessed_cents and advances SettlementBatch.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reclass-create-stale-merchant
    parent_entity: Merchant
    write_endpoint: "POST /reclassification-requests"
    occ_field: "expected_merchant_version"
    description: |
      Creating a ReclassificationRequest against a Merchant whose version has advanced
      since the client last observed it is rejected. This captures the case where a
      newer request has already been filed and legitimately superseded the prior one
      (SUBMITTED/UNDER_REVIEW/INFO_REQUESTED -> SUPERSEDED), or where a verify-category
      or audit cascade has since rewritten the merchant's category posture, making the
      submitting client's view of the merchant stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: enrollment-create-stale-program
    parent_entity: IncentiveProgram
    write_endpoint: "POST /incentive-enrollments"
    occ_field: "expected_incentive_program_version"
    description: |
      Creating an IncentiveEnrollment against an IncentiveProgram whose version has
      advanced since the client last observed it is rejected. A second enrollment for a
      different merchant against the same program is legitimate while capacity remains,
      so no state precondition covers this; the guard is the stale version, because every
      accepted enrollment (or waitlist parking) redraws uncommitted_capacity_cents,
      enrolled_count and enrollment_state and advances IncentiveProgram.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3  Calculation Rules Table
# =============================================================================
calculations:
  - name: mcc_assignment_selector
    trigger: "POST /merchants — assigns Merchant.assigned_mcc from business_type_key"
    algorithm: selector_policy
    formula: |
      # (a) eligibility filter — candidate set, explicit predicate over entity fields
      candidates = [ d for d in MccDefinition
                       if d.business_type_key == merchant.business_type_key ]
      # (d) empty-set fallback
      if candidates is empty:
          reject with ERR_MCC_NOT_DEFINED (422); no Merchant row is created
      # (b) ranking expression — two ordered sort keys, both entity fields
      #     key 1: high_risk ascending (false sorts before true)
      #     key 2: mcc_code ascending (lexicographic over the 4-digit string)
      # (c) tie-break when both keys tie: created_at ASC (never `id`)
      chosen = sort(candidates, key=(d.high_risk, d.mcc_code, d.created_at))[0]
      merchant.assigned_mcc = chosen.mcc_code
      merchant.mcc_status   = PENDING_VERIFICATION if chosen.requires_documentation
                              else VERIFIED
    input_set: "All MccDefinition rows (configuration entity, no status field, none excluded)."
    constants: {}
    precision: "exact string comparison; no numeric rounding"
    variants: []

  - name: clearing_delay_hours
    trigger: "POST /settlement-batches/{id}/transaction-records — computed once, never recomputed"
    algorithm: threshold
    formula: |
      delta_seconds = epoch_seconds(clearing_timestamp) - epoch_seconds(auth_timestamp)
      if delta_seconds < 0: reject with ERR_CLEARING_BEFORE_AUTH (422)
      clearing_delay_hours = floor(delta_seconds / 3600)
    input_set: "The single record being created."
    constants: {}
    precision: "integer hours, floor (truncate toward zero); a 23h59m59s delay yields 23"
    variants: []

  - name: qualification_evaluation
    trigger: "POST /settlement-batches/{id}/transaction-records (PROVISIONAL_AUTH_BASED) and POST /settlement-batches/{id}/finalize (FINAL_CLEARING_BASED)"
    algorithm: selector_policy
    formula: |
      mcc = merchant.assigned_mcc AS OF the evaluation instant
      elig = MccDefinition(mcc_code == mcc).program_eligibility   # e.g. {SMALL_TICKET}

      # (a) eligibility filter over RateProgram — every clause is an explicit predicate
      candidates = [ rp for rp in RateProgram if ALL of:
          C1  mcc IN rp.eligible_mcc_codes
          C2  rp.category == 'STANDARD'  OR  rp.category == 'CPS_RETAIL'
                                         OR  rp.category IN elig
          C3  set(rp.requires_data_elements) is a subset of set(record.data_elements)
          C4  rp.category != 'SMALL_TICKET'  OR  record.amount_cents <= SMALL_TICKET_MAX_CENTS
          C5  rp.category == 'STANDARD'
                OR record.authorization_status == 'AUTH_APPROVED'
          C6  VARIANT-DEPENDENT clearing-timing clause (see variants below)
      ]
      # (d) empty-set fallback
      if candidates is empty:
          reject with ERR_NO_QUALIFYING_RATE_PROGRAM (422)

      # (b) ranking expression — cheapest total cost to the merchant at this ticket size.
      #     The per-item fee is amortised into basis points BEFORE comparison, and that
      #     amortisation is itself rounded, so ranking is fully integer-deterministic.
      cost_bps(rp) = rp.base_rate_bps
                     + round_half_up(rp.per_item_fee_cents * 10000 / record.amount_cents)
      # (c) tie-break, applied in order: cost_bps ASC, then base_rate_bps ASC,
      #     then created_at ASC.  `id` is NEVER consulted.
      selected = sort(candidates, key=(cost_bps(rp), rp.base_rate_bps, rp.created_at))[0]

      # outcome mapping
      if selected.category == 'STANDARD':
          status = DOWNGRADED ; downgrade_reason = calculations.downgrade_reason_resolution
      else:
          status = QUALIFIED  ; downgrade_reason = null
    input_set: |
      All RateProgram rows (configuration, no status filter). The merchant MCC read is
      variant-dependent: PROVISIONAL reads Merchant.assigned_mcc at record-creation time,
      FINAL re-reads it at finalize time and snapshots it into
      TransactionRecord.mcc_at_qualification.
    constants:
      SMALL_TICKET_MAX_CENTS: 1500
    precision: "cost_bps amortisation uses round_half_up to whole basis points"
    variants:
      - name: PROVISIONAL_AUTH_BASED
        when: "POST /settlement-batches/{id}/transaction-records, at record creation"
        difference: |
          Clause C6 is OMITTED ENTIRELY — clearing timing is not yet considered an
          acquirer commitment, so a program is a candidate no matter how large
          record.clearing_delay_hours is. Writes provisional_rate_program_id and
          provisional_assessed_cents. Does NOT write qualification_status (stays PENDING),
          does NOT write assessed_interchange_cents, and posts to NO ledger.
      - name: FINAL_CLEARING_BASED
        when: "POST /settlement-batches/{id}/finalize, per member record in created_at ASC order"
        difference: |
          Clause C6 is ENFORCED as
          `rp.category == 'STANDARD' OR record.clearing_delay_hours <= rp.max_clearing_delay_hours`,
          and the merchant MCC is re-read at finalize time. Writes
          qualified_rate_program_id, assessed_interchange_cents, mcc_at_qualification,
          downgrade_reason and moves qualification_status. For identical stored inputs the
          two variants therefore select DIFFERENT programs, and produce DIFFERENT cent
          amounts, whenever clearing_delay_hours exceeds the cheapest candidate's
          max_clearing_delay_hours or the merchant's MCC changed in between.

  - name: downgrade_reason_resolution
    trigger: "POST /settlement-batches/{id}/finalize, only for records the FINAL variant routes to the STANDARD program"
    algorithm: constraint_propagation
    formula: |
      # reference program: the cheapest NON-STANDARD program the merchant's MCC could
      # ever reach, ignoring this record's data quality. Selector is fully pinned.
      ref_candidates = [ rp for rp in RateProgram if
                           mcc IN rp.eligible_mcc_codes
                           AND rp.category != 'STANDARD'
                           AND (rp.category == 'CPS_RETAIL' OR rp.category IN elig) ]
      if ref_candidates is empty:
          downgrade_reason = MCC_INELIGIBLE ; stop
      ref = sort(ref_candidates, key=(rp.base_rate_bps, rp.created_at))[0]

      # first failing check in THIS FIXED ORDER wins; evaluation stops at the first hit
      1. if set(ref.requires_data_elements) NOT subset of set(record.data_elements):
             MISSING_DATA_ELEMENTS
      2. elif record.clearing_delay_hours > ref.max_clearing_delay_hours:
             LATE_CLEARING
      3. elif ref.category == 'SMALL_TICKET' and record.amount_cents > SMALL_TICKET_MAX_CENTS:
             TICKET_SIZE_INELIGIBLE
      4. elif record.authorization_status != 'AUTH_APPROVED':
             AUTH_MISSING
      5. else:
             MCC_INELIGIBLE
    input_set: "All RateProgram rows; the single record being finalized."
    constants:
      SMALL_TICKET_MAX_CENTS: 1500
    precision: "n/a (enum output)"
    variants: []

  - name: interchange_assessment
    trigger: "POST /settlement-batches/{id}/transaction-records (into provisional_assessed_cents) and POST /settlement-batches/{id}/finalize (into assessed_interchange_cents)"
    algorithm: tiered_pricing
    formula: |
      program = the RateProgram selected by calculations.qualification_evaluation
      batch   = SettlementBatch(record.settlement_batch_id)
      acq     = Acquirer(batch.acquirer_id)

      # STEP 1 — ad-valorem component, rounded to whole cents BEFORE the flat fee is added
      ad_valorem = round_half_up(record.amount_cents * program.base_rate_bps / 10000)
      base       = ad_valorem + program.per_item_fee_cents

      # STEP 2 — cross-border component (conditional branch on a derived boolean)
      if record.cross_border:                      # merchant.home_country_code != acq.country_code
          cross_border_surcharge_cents =
              max(CROSS_BORDER_MIN_CENTS,
                  round_half_up(record.amount_cents * CROSS_BORDER_RATE_BPS / 10000))
      else:
          cross_border_surcharge_cents = 0

      # STEP 3 — currency-conversion component (second conditional branch)
      if record.transaction_currency != batch.currency_code:
          fx_pool = [ f for f in FxRate if f.base_currency == record.transaction_currency
                                       and f.quote_currency == batch.currency_code
                                       and f.effective_from <= current_utc ]
          if fx_pool is empty: reject with ERR_FX_RATE_UNAVAILABLE (422)
          fx = sort(fx_pool, key=(f.effective_from DESC, f.created_at DESC))[0]
          fx_markup_cents = round_half_up(record.amount_cents * fx.markup_bps / 10000)
      else:
          fx_markup_cents = 0

      # STEP 4 — nested clamp: cap first, then floor.  Order is pinned; swapping the two
      #          changes the answer whenever cap < floor.
      raw    = base + cross_border_surcharge_cents + fx_markup_cents
      capped = min(raw, round_half_up(record.amount_cents * ASSESSMENT_CAP_BPS / 10000))
      result = max(capped, ASSESSMENT_FLOOR_CENTS)
    input_set: "The single record, its batch, the batch's acquirer, the selected RateProgram, and the FxRate rows effective at the evaluation instant."
    constants:
      CROSS_BORDER_RATE_BPS: 40
      CROSS_BORDER_MIN_CENTS: 15
      ASSESSMENT_CAP_BPS: 350
      ASSESSMENT_FLOOR_CENTS: 8
    precision: "every round_half_up produces whole cents; there are no fractional cents anywhere in the pipeline"
    variants: []

  - name: batch_assessment_total
    trigger: "POST /settlement-batches/{id}/finalize (after every member record is assessed) and POST /transaction-records/{id}/reverse with reversal_type CLEARING_REVERSAL"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER — round per record, THEN sum.
      #   total = SUM( round_half_up(r.amount_cents * bps / 10000) + per_item ... )
      # It is FORBIDDEN to accumulate the unrounded ad-valorem products and round once at
      # the end. The two orders differ: for two records of amount_cents 1200 on a 254 bps
      # program with per_item_fee_cents 10, round-then-sum yields 30+10+30+10 = 80, while
      # sum-then-round yields round_half_up(60.96) + 20 = 81.
      total_assessed_cents = 0
      for r in TransactionRecord
              where r.settlement_batch_id == batch.id
                and r.qualification_status IN {QUALIFIED, DOWNGRADED}
              ordered by r.created_at ASC:          # order is immaterial to the sum but pinned anyway
          total_assessed_cents += r.assessed_interchange_cents   # already whole cents
    input_set: |
      (a) source: TransactionRecord rows of this batch with qualification_status IN
      {QUALIFIED, DOWNGRADED}; rows in PENDING or REVERSED are EXCLUDED.
      (b) window: the whole batch, no time bound.
      (c) order: created_at ASC (sum is order-independent, but the traversal is pinned so
      partial-failure behaviour is well defined).
    constants: {}
    precision: "whole cents; each addend was already rounded by calculations.interchange_assessment"
    variants: []

  - name: merchant_downgrade_counter
    trigger: "POST /settlement-batches/{id}/finalize and POST /transaction-records/{id}/reverse"
    algorithm: aggregation
    formula: |
      downgrade_count_current_quarter = COUNT of TransactionRecord r where
          r.merchant_id == merchant.id
          AND r.qualification_status == DOWNGRADED
          AND SettlementBatch(r.settlement_batch_id).status == FINALIZED
          AND quarter_of(SettlementBatch(r.settlement_batch_id).batch_date)
              == quarter_of(current_utc)
      # quarter_of(d): Q1 = Jan 1 .. Mar 31, Q2 = Apr 1 .. Jun 30,
      #                Q3 = Jul 1 .. Sep 30, Q4 = Oct 1 .. Dec 31, all UTC.
      # AUDIT TRIGGER: after the recomputation, if the value >= DOWNGRADE_AUDIT_TRIGGER
      # the finalize cascade opens a MerchantCategoryAudit (see §1.2 SettlementBatch
      # SUBMITTED -> FINALIZED, cascade hop 3). Comparison is >=, not >, so exactly
      # DOWNGRADE_AUDIT_TRIGGER downgrades is enough.
    input_set: |
      (a) source: TransactionRecord with qualification_status == DOWNGRADED whose batch is
      FINALIZED; PENDING, QUALIFIED and REVERSED rows are EXCLUDED.
      (b) window: the calendar quarter containing current_utc, inclusive on both ends
      (first day 00:00:00.000 through last day 23:59:59.999 UTC), matched on
      SettlementBatch.batch_date.
      (c) tie-break: none needed — the result is a count.
    constants:
      DOWNGRADE_AUDIT_TRIGGER: 3
    precision: "integer count"
    variants: []

  - name: merchant_assessment_ledger_invariant
    trigger: "invariant — MUST hold after POST /settlement-batches/{id}/finalize and after POST /transaction-records/{id}/reverse"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 1 of 2: merchant-level monetary assessment ledger.
      Merchant.lifetime_net_assessed_cents
        == SUM( r.assessed_interchange_cents
                for r in TransactionRecord
                where r.merchant_id == Merchant.id
                  and r.qualification_status IN {QUALIFIED, DOWNGRADED} )

      # And, per batch:
      SettlementBatch.total_assessed_cents
        == SUM( r.assessed_interchange_cents
                for r in TransactionRecord
                where r.settlement_batch_id == SettlementBatch.id
                  and r.qualification_status IN {QUALIFIED, DOWNGRADED} )

      # Forward action:      finalize     -> record moves PENDING -> QUALIFIED/DOWNGRADED,
      #                                      assessed_interchange_cents posted to both sums.
      # Compensating action: CLEARING_REVERSAL -> record moves to REVERSED and
      #                                      assessed_interchange_cents is set to 0.
      # After the pair, BOTH sums equal exactly the sum over the surviving
      # QUALIFIED/DOWNGRADED rows. Zero drift is permitted: an implementation that
      # decrements a cached counter instead of re-deriving it, or that forgets to zero
      # assessed_interchange_cents, breaks this equality.
    input_set: "All TransactionRecord rows of the merchant / batch, filtered on qualification_status IN {QUALIFIED, DOWNGRADED}."
    constants: {}
    precision: "exact integer equality; no tolerance"
    variants: []

  - name: incentive_capacity_ledger_invariant
    trigger: "invariant — MUST hold after every POST /incentive-enrollments, /withdraw, /evaluate-performance and after every MCC-change cascade"
    algorithm: waterfall_allocation
    formula: |
      # CONSERVED QUANTITY 2 of 2: committable volume capacity (a reservation pool,
      # not money).
      IncentiveProgram.total_capacity_cents
        == IncentiveProgram.uncommitted_capacity_cents
         + SUM( e.committed_volume_cents
                for e in IncentiveEnrollment
                where e.incentive_program_id == IncentiveProgram.id
                  and e.status IN {ENROLLED, PROBATION} )

      # WAITLISTED, WITHDRAWN, TERMINATED_SHORTFALL and TERMINATED_INELIGIBLE rows are
      # OUTSIDE the committed set and contribute nothing.
      # Forward actions:      create-with-capacity, waitlist promotion  (debit)
      # Compensating actions: withdraw, TERMINATED_SHORTFALL, TERMINATED_INELIGIBLE (credit)
      # Withdrawing a WAITLISTED row is a no-op on the pool — it never debited — so the
      # equality must still hold with zero drift.
      # Allocation order for promotions: the program's WAITLISTED rows are considered in
      # created_at ASC order and ONLY the single earliest row is examined; if it does not
      # fit, no later row is promoted (strict head-of-line, no best-fit search).
    input_set: "All IncentiveEnrollment rows of the program, filtered on status IN {ENROLLED, PROBATION} for the committed sum."
    constants: {}
    precision: "exact integer equality; no tolerance"
    variants: []

  - name: incentive_performance_score
    trigger: "POST /incentive-enrollments/{id}/evaluate-performance"
    algorithm: forward_looking
    formula: |
      # measurement base (shared by both variants)
      rows = [ r for r in TransactionRecord
                 if r.merchant_id == enrollment.merchant_id
                and r.qualification_status IN {QUALIFIED, DOWNGRADED}
                and SettlementBatch(r.settlement_batch_id).status == FINALIZED
                and SettlementBatch(r.settlement_batch_id).batch_date
                      >= date_of(enrollment.enrolled_at)            # INCLUSIVE
                and SettlementBatch(r.settlement_batch_id).batch_date
                      <= date_of(current_utc) ]                     # INCLUSIVE
      cq        = quarter_of(current_utc)
      prior     = SUM(r.amount_cents for r in rows
                        if quarter_of(batch_date(r)) is strictly before cq)
      current_q = SUM(r.amount_cents for r in rows
                        if quarter_of(batch_date(r)) == cq)

      achieved_volume_cents = <variant-specific, see variants>
      performance_score_pct = round_half_up(
                                  achieved_volume_cents * 100
                                  / enrollment.committed_volume_cents, 2)

      # threshold routing (comparison is >=; equality keeps/returns the row to ENROLLED)
      if status == ENROLLED  and score <  program.performance_threshold_pct -> PROBATION
      if status == ENROLLED  and score >= program.performance_threshold_pct -> ENROLLED (no move)
      if status == PROBATION and score >= program.performance_threshold_pct -> ENROLLED
      if status == PROBATION and score <  program.performance_threshold_pct -> TERMINATED_SHORTFALL
    input_set: |
      (a) source: TransactionRecord with qualification_status IN {QUALIFIED, DOWNGRADED}
      whose SettlementBatch.status == FINALIZED. PENDING and REVERSED rows and records in
      OPEN/SUBMITTED batches are EXCLUDED.
      (b) window: SettlementBatch.batch_date from date_of(enrolled_at) INCLUSIVE through
      date_of(current_utc) INCLUSIVE, then partitioned by calendar quarter relative to
      quarter_of(current_utc).
      (c) tie-break: none — both aggregates are sums.
    constants: {}
    precision: "achieved_volume_cents is a whole-cent integer; performance_score_pct is round_half_up to 2 decimal places"
    variants:
      - name: TRAILING
        when: "POST /incentive-enrollments/{id}/evaluate-performance with basis == 'TRAILING'"
        difference: |
          achieved_volume_cents = prior. Volume booked in the CURRENT (partial) quarter is
          discarded entirely — only completed quarters count.
      - name: PROJECTED
        when: "POST /incentive-enrollments/{id}/evaluate-performance with basis == 'PROJECTED'"
        difference: |
          The current partial quarter is annualised up to a full quarter and added:
            days_in_quarter = total calendar days in cq (90/91/92 depending on the quarter)
            elapsed_days    = whole days from the first day of cq (INCLUSIVE) through
                              date_of(current_utc) (INCLUSIVE), so the first day of a
                              quarter yields elapsed_days == 1 (never 0)
            projected_current = round_half_up(current_q * days_in_quarter / elapsed_days)
            achieved_volume_cents = prior + projected_current
          For identical stored rows the two variants therefore produce different
          achieved_volume_cents and different performance_score_pct, and can route the same
          enrollment to PROBATION under TRAILING while leaving it ENROLLED under PROJECTED.

  - name: incentive_tier_and_credit
    trigger: "POST /incentive-enrollments/{id}/evaluate-performance (runs after calculations.incentive_performance_score, in the same request)"
    algorithm: tiered_pricing
    formula: |
      # This looks circular: the volume tier is a function of assessed volume, and the
      # discount the tier grants reduces assessed volume. The evaluation order below is
      # PINNED so the value is well defined; there is NO second pass and NO fixed-point
      # iteration.
      #
      # STEP 1 — gross, over the FULL measurement window (never quarter-partitioned,
      #          never variant-dependent):
      gross_assessed_volume_cents = SUM( r.assessed_interchange_cents
          for r in TransactionRecord
          where r.merchant_id == enrollment.merchant_id
            and r.qualification_status IN {QUALIFIED, DOWNGRADED}
            and SettlementBatch(r.settlement_batch_id).status == FINALIZED
            and date_of(enrollment.enrolled_at) <= SettlementBatch.batch_date
                                                <= date_of(current_utc) )
      # STEP 2 — tier is resolved from GROSS and from gross ONLY:
      tier_code = TIER_3 if gross >= 50000000
             else TIER_2 if gross >= 20000000
             else TIER_1 if gross >=  5000000
             else TIER_0
      # STEP 3 — credit from the tier's bps:
      incentive_credit_cents = round_half_up(gross_assessed_volume_cents
                                             * TIER_DISCOUNT_BPS[tier_code] / 10000)
      # STEP 4 — net:
      net_assessed_volume_cents = gross_assessed_volume_cents - incentive_credit_cents
      # STEP 5 — the tier is NOT recomputed from net. An implementation that re-runs
      #          STEP 2 on net_assessed_volume_cents produces a different, WRONG credit
      #          whenever the discount pushes net below the tier's lower breakpoint
      #          (e.g. gross 20000005 -> TIER_2 -> credit 120000 -> net 19880005, which
      #          would fall back to TIER_1 and a credit of 50000 on a second pass).
    input_set: |
      (a) source: TransactionRecord with qualification_status IN {QUALIFIED, DOWNGRADED} in
      FINALIZED batches; PENDING and REVERSED rows EXCLUDED.
      (b) window: SettlementBatch.batch_date from date_of(enrolled_at) INCLUSIVE through
      date_of(current_utc) INCLUSIVE — no quarter partitioning.
      (c) tie-break: none; the aggregate is a sum. Tier breakpoints are inclusive lower
      bounds (>=), exclusive upper bounds.
    constants:
      TIER_DISCOUNT_BPS: { TIER_0: 0, TIER_1: 25, TIER_2: 60, TIER_3: 100 }
      TIER_1_FLOOR_CENTS: 5000000
      TIER_2_FLOOR_CENTS: 20000000
      TIER_3_FLOOR_CENTS: 50000000
    precision: "round_half_up to whole cents on the credit; net is exact integer subtraction"
    variants: []

  - name: rate_version_window_overlap_check
    trigger: "POST /rate-program-versions/{id}/publish"
    algorithm: interval_merge
    formula: |
      # INTERVAL SEMANTICS A: HALF-OPEN [effective_from, effective_to), capacity 1,
      # ZERO buffer. Adjacency is legal: prior.effective_to == this.effective_from does
      # NOT collide, so a program can hand off from one quarter to the next with no gap.
      rivals = [ v for v in RateProgramVersion
                   if v.rate_program_id == this.rate_program_id
                  and v.id != this.id
                  and v.status == PUBLISHED ]
      overlaps(a, b) = (a.effective_from < b.effective_to)
                       and (b.effective_from < a.effective_to)   # STRICT `<` on both sides
      if any(overlaps(this, v) for v in rivals):
          reject with ERR_RATE_VERSION_WINDOW_OVERLAP (409)
      # A one-millisecond intrusion (this.effective_from == rival.effective_to - 1ms) DOES
      # collide; exact equality of the shared endpoint does NOT.
    input_set: |
      (a) source: RateProgramVersion rows of the SAME rate_program_id with status ==
      PUBLISHED. DRAFT and SUPERSEDED rivals are EXCLUDED, and versions of other programs
      are EXCLUDED.
      (b) window: the candidate's own half-open effective interval.
      (c) order: none needed — the test is existential, not order-sensitive.
    constants: {}
    precision: "millisecond-resolution instants; comparisons are strict on both bounds"
    variants: []

  - name: platform_window_overlap_check
    trigger: "POST /implementation-windows"
    algorithm: interval_merge
    formula: |
      # INTERVAL SEMANTICS B: CLOSED [window_start, window_end], SYMMETRIC BUFFER of
      # ProcessingPlatform.blackout_buffer_days inflated onto every EXISTING window, and
      # an AGGREGATE CAPACITY of ProcessingPlatform.max_concurrent_windows rather than a
      # capacity of one. This is deliberately different arithmetic from
      # calculations.rate_version_window_overlap_check.
      plat = ProcessingPlatform(this.platform_id)
      rivals = [ w for w in AcquirerImplementationWindow
                   if w.platform_id == this.platform_id
                  and w.id != this.id
                  and w.status IN {SCHEDULED, IN_PROGRESS} ]
      buffered(w) = [ w.window_start - plat.blackout_buffer_days * 86400 s,
                      w.window_end   + plat.blackout_buffer_days * 86400 s ]
      collides(w) = (this.window_start <= buffered(w).end)
                    and (buffered(w).start <= this.window_end)      # NON-STRICT `<=`, both sides
      colliding_count = COUNT(w in rivals where collides(w))
      if colliding_count >= plat.max_concurrent_windows:
          reject with ERR_PLATFORM_WINDOW_CONFLICT (409)
      # Touching endpoints DO collide here (closed intervals), the opposite of semantics A,
      # and two windows that are geometrically disjoint still collide once the buffer is
      # applied.
    input_set: |
      (a) source: AcquirerImplementationWindow rows on the SAME platform_id with status IN
      {SCHEDULED, IN_PROGRESS}. COMPLETED, COMPLETED_LATE and MISSED rows are EXCLUDED, and
      windows on other platforms are EXCLUDED. Rivals belonging to OTHER acquirers are
      INCLUDED — the platform is a shared resource.
      (b) window: the candidate's own closed interval versus each rival's buffered closed
      interval.
      (c) order: none needed — the test is a count against a capacity.
    constants: {}
    precision: "buffer is whole days converted to seconds; comparisons are non-strict"
    variants: []

  - name: implementation_window_bounds_check
    trigger: "POST /implementation-windows"
    algorithm: threshold
    formula: |
      v = RateProgramVersion(this.rate_program_version_id)
      if not (this.window_start >= v.published_at
              and this.window_end <= v.implementation_deadline):
          reject with ERR_IMPLEMENTATION_WINDOW_OUT_OF_BOUNDS (422)
      # Both bounds are INCLUSIVE: window_start == published_at is legal and
      # window_end == implementation_deadline is legal.
    input_set: "The single candidate window and its referenced RateProgramVersion."
    constants: {}
    precision: "millisecond-resolution instants; both comparisons non-strict"
    variants: []

  - name: misrepresentation_penalty
    trigger: "POST /merchant-category-audits/{id}/sustain-findings"
    algorithm: threshold
    formula: |
      penalty_assessed_cents = max(
          MIN_PENALTY_CENTS,
          round_half_up(Merchant.lifetime_net_assessed_cents
                        * MISREPRESENTATION_PENALTY_BPS / 10000) )
      # The merchant's ledger is read BEFORE the MCC is rewritten, so the penalty reflects
      # the volume booked under the misrepresented category.
    input_set: "Merchant.lifetime_net_assessed_cents as of the sustain call, before any cascade runs."
    constants:
      MISREPRESENTATION_PENALTY_BPS: 2500
      MIN_PENALTY_CENTS: 5000
    precision: "round_half_up to whole cents, then floored at MIN_PENALTY_CENTS"
    variants: []

  - name: logical_clock_sweep
    trigger: "POST /_clock/set_current_utc"
    algorithm: chronological
    formula: |
      # The sweep runs in EXACTLY this step order; within each step rows are processed
      # created_at ASC. `id` is never consulted.
      # STEP 1: every RateProgramVersion with status == PUBLISHED and
      #         effective_to <= new_clock  ->  SUPERSEDED
      # STEP 2: every AcquirerImplementationWindow with status IN {SCHEDULED, IN_PROGRESS}
      #         and window_end < new_clock ->  MISSED; then each affected Acquirer's
      #         missed_window_count is recomputed and COMPLIANT -> NON_COMPLIANT fires when
      #         the count is > 0
      # STEP 3: every TransactionRecord with authorization_status == AUTH_APPROVED and
      #         qualification_status == PENDING and
      #         (new_clock - auth_timestamp) > AUTH_VALIDITY_HOURS hours -> AUTH_EXPIRED
      # The clock may move backwards; the sweep is applied for ANY new value, and no step
      # ever un-does a prior sweep's effect.
    input_set: "All RateProgramVersion, AcquirerImplementationWindow and TransactionRecord rows matching each step's status filter."
    constants:
      AUTH_VALIDITY_HOURS: 720
      DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00.000Z"
    precision: "millisecond-resolution instants; step 2 uses strict `<`, step 1 uses non-strict `<=`, step 3 uses strict `>`"
    variants: []

# ============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's roles list in the section 1.5 table"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id embedded in the request PATH resolves to a stored row, validated left-to-right in path order"
    error_id: "ERR_PLATFORM_NOT_FOUND | ERR_ACQUIRER_NOT_FOUND | ERR_MCC_DEFINITION_NOT_FOUND | ERR_MERCHANT_NOT_FOUND | ERR_RATE_PROGRAM_NOT_FOUND | ERR_RATE_VERSION_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_RECORD_NOT_FOUND | ERR_RECLASS_REQUEST_NOT_FOUND | ERR_INCENTIVE_PROGRAM_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_FX_RATE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 4
    category: existence
    check: "every id supplied in the request BODY resolves to a stored row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_PLATFORM_NOT_FOUND | ERR_ACQUIRER_NOT_FOUND | ERR_MERCHANT_NOT_FOUND | ERR_RATE_VERSION_NOT_FOUND | ERR_INCENTIVE_PROGRAM_NOT_FOUND"
    http_status: 404
    applies_to: "POST /acquirers, POST /implementation-windows, POST /merchants, POST /reclassification-requests, POST /settlement-batches, POST /settlement-batches/{id}/transaction-records, POST /incentive-enrollments, POST /merchant-category-audits"

  - priority: 5
    category: business_constraint
    check: "request body is well formed: required fields present and non-null, enums within their declared domain, integer money and bps fields >= 0, amount_cents >= 1, committed_volume_cents >= 1, ISO-8601 timestamps parseable, ISO-4217 currency codes 3 uppercase letters, mcc_code exactly 4 digits, window_start < window_end, effective_from < effective_to, fieldwork_start <= fieldwork_end, data_elements a list of unique uppercase tokens, and decision in {APPROVE, DENY}"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 6
    category: auth
    check: "when X-User-Role is AcquirerOps, the X-User-ID must equal the acquirer_id that owns the target resource (Merchant.acquirer_id, SettlementBatch.acquirer_id, AcquirerImplementationWindow.acquirer_id, the Merchant behind a ReclassificationRequest or IncentiveEnrollment, or the acquirer_id in the body)"
    error_id: ERR_ACQUIRER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles list includes AcquirerOps"

  - priority: 7
    category: state
    check: "the target resource's own status permits the requested transition per its section 1.2 state machine, and POST /implementation-windows references a RateProgramVersion in status PUBLISHED (generic catch-all for state preconditions with no dedicated code)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /rate-program-versions/{id}/publish, POST /implementation-windows, POST /implementation-windows/{id}/start, POST /implementation-windows/{id}/complete, POST /merchants/{id}/verify-category, POST /reclassification-requests/{id}/review, POST /reclassification-requests/{id}/request-info, POST /reclassification-requests/{id}/resubmit, POST /reclassification-requests/{id}/decide, POST /transaction-records/{id}/reverse, POST /incentive-enrollments/{id}/evaluate-performance, POST /incentive-enrollments/{id}/withdraw, POST /merchant-category-audits/{id}/start-fieldwork, POST /merchant-category-audits/{id}/sustain-findings, POST /merchant-category-audits/{id}/clear-findings, POST /merchant-category-audits/{id}/close, POST /settlement-batches/{id}/submit, POST /settlement-batches/{id}/finalize"

  - priority: 8
    category: state
    check: "the target SettlementBatch.status is OPEN when adding a transaction record"
    error_id: ERR_BATCH_NOT_OPEN
    http_status: 409
    applies_to: "POST /settlement-batches/{id}/transaction-records"

  - priority: 9
    category: state
    check: "the target IncentiveProgram.enrollment_state is OPEN; when it is CLOSED_FULL an enrollment is admissible only if the request sets waitlist_requested true"
    error_id: ERR_ENROLLMENT_CLOSED
    http_status: 409
    applies_to: "POST /incentive-enrollments"

  - priority: 10
    category: state
    check: "expected_batch_version equals the stored SettlementBatch.version (concurrency_rules: record-add-stale-batch)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /settlement-batches/{id}/transaction-records"

  - priority: 11
    category: state
    check: "expected_merchant_version equals the stored Merchant.version (concurrency_rules: reclass-create-stale-merchant)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /reclassification-requests"

  - priority: 12
    category: state
    check: "expected_incentive_program_version equals the stored IncentiveProgram.version (concurrency_rules: enrollment-create-stale-program)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /incentive-enrollments"

  - priority: 13
    category: business_safety
    check: "the referenced Merchant.mcc_status is not MISREPRESENTED — a merchant proven to have misrepresented its category is frozen out of every downstream money or category operation"
    error_id: ERR_MERCHANT_MISREPRESENTED
    http_status: 409
    applies_to: "POST /reclassification-requests, POST /settlement-batches/{id}/transaction-records, POST /incentive-enrollments, POST /merchants/{id}/verify-category"

  - priority: 14
    category: business_safety
    check: "the referenced Merchant.mcc_status is not UNDER_REVIEW — while a category audit is open the merchant's category may not be re-litigated and it may not take on new incentive commitments"
    error_id: ERR_MERCHANT_UNDER_CATEGORY_REVIEW
    http_status: 409
    applies_to: "POST /reclassification-requests, POST /incentive-enrollments, POST /merchants/{id}/verify-category"

  - priority: 15
    category: business_safety
    check: "the referenced Merchant.mcc_status is VERIFIED before the merchant may be enrolled in an incentive program"
    error_id: ERR_MERCHANT_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /incentive-enrollments"

  - priority: 16
    category: business_safety
    check: "the owning Acquirer.compliance_status is COMPLIANT before a settlement batch may be finalized — an acquirer with a missed rate-change implementation window may not book interchange at the new rates"
    error_id: ERR_ACQUIRER_NON_COMPLIANT
    http_status: 409
    applies_to: "POST /settlement-batches/{id}/finalize"

  - priority: 17
    category: business_safety
    check: "the deciding CategoryApprover's X-User-ID differs from ReclassificationRequest.reviewer_user_id — the analyst who reviewed a reclassification may not also approve or deny it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reclassification-requests/{id}/decide"

  - priority: 18
    category: business_safety
    check: "the closing ComplianceAuditor's X-User-ID differs from MerchantCategoryAudit.auditor_user_id — the auditor who performed the fieldwork may not close their own audit"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /merchant-category-audits/{id}/close"

  - priority: 19
    category: business_temporal
    check: "clearing_timestamp >= auth_timestamp on a submitted transaction record (equality is legal and yields a clearing delay of zero hours)"
    error_id: ERR_CLEARING_BEFORE_AUTH
    http_status: 422
    applies_to: "POST /settlement-batches/{id}/transaction-records"

  - priority: 20
    category: business_temporal
    check: "the implementation window lies inside its rate program version's publication-to-deadline envelope: window_start >= RateProgramVersion.published_at AND window_end <= RateProgramVersion.implementation_deadline, both bounds inclusive (calculations.implementation_window_bounds_check)"
    error_id: ERR_IMPLEMENTATION_WINDOW_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /implementation-windows"

  - priority: 21
    category: business_constraint
    check: "publishing a rate program version must not overlap any other PUBLISHED version of the same rate program under half-open interval semantics (calculations.rate_version_window_overlap_check)"
    error_id: ERR_RATE_VERSION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /rate-program-versions/{id}/publish"

  - priority: 22
    category: business_constraint
    check: "the number of SCHEDULED or IN_PROGRESS windows on the same platform whose buffer-inflated closed interval touches the candidate window must be below ProcessingPlatform.max_concurrent_windows (calculations.platform_window_overlap_check)"
    error_id: ERR_PLATFORM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /implementation-windows"

  - priority: 23
    category: business_constraint
    check: "natural-key uniqueness: MccDefinition.mcc_code globally unique; RateProgram.program_code globally unique; Acquirer.bin_prefix globally unique; RateProgramVersion unique on (rate_program_id, publication_quarter); SettlementBatch unique on (acquirer_id, batch_date, currency_code); FxRate unique on (base_currency, quote_currency, effective_from); TransactionRecord.auth_code unique within a settlement batch"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /mcc-definitions, POST /rate-programs, POST /acquirers, POST /rate-programs/{id}/versions, POST /settlement-batches, POST /fx-rates, POST /settlement-batches/{id}/transaction-records"

  - priority: 24
    category: business_constraint
    check: "ReclassificationRequest.review_round is strictly below MAX_REVIEW_ROUNDS (3) before another information request may be issued"
    error_id: ERR_REVIEW_ROUND_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /reclassification-requests/{id}/request-info"

  - priority: 25
    category: business_referential
    check: "the requested_mcc / correct_mcc value names an existing MccDefinition.mcc_code"
    error_id: ERR_MCC_NOT_DEFINED
    http_status: 422
    applies_to: "POST /reclassification-requests, POST /merchant-category-audits/{id}/sustain-findings"

  - priority: 26
    category: business_referential
    check: "at least one MccDefinition exists whose business_type_key equals the merchant's business_type_key, so calculations.mcc_assignment_selector can resolve an assigned_mcc"
    error_id: ERR_MCC_NOT_DEFINED
    http_status: 422
    applies_to: "POST /merchants"

  - priority: 27
    category: business_referential
    check: "the merchant's assigned MccDefinition.program_eligibility contains the incentive program's required category, i.e. the merchant's assigned_mcc appears in IncentiveProgram.eligible_mcc_codes"
    error_id: ERR_MCC_NOT_ELIGIBLE_FOR_PROGRAM
    http_status: 422
    applies_to: "POST /incentive-enrollments"

  - priority: 28
    category: business_referential
    check: "at least one RateProgram is selectable for the record under calculations.qualification_evaluation — the STANDARD fallback program must exist"
    error_id: ERR_NO_QUALIFYING_RATE_PROGRAM
    http_status: 422
    applies_to: "POST /settlement-batches/{id}/transaction-records, POST /settlement-batches/{id}/finalize"

  - priority: 29
    category: business_referential
    check: "when transaction_currency differs from SettlementBatch.currency_code, an FxRate row exists for (transaction_currency, batch currency) whose effective_from is at or before the clearing_timestamp"
    error_id: ERR_FX_RATE_UNAVAILABLE
    http_status: 422
    applies_to: "POST /settlement-batches/{id}/transaction-records, POST /settlement-batches/{id}/finalize"

  - priority: 30
    category: business_referential
    check: "when the target MccDefinition.requires_documentation is true, a non-empty documentation_ref or supporting_doc_ref accompanies the request"
    error_id: ERR_DOCUMENTATION_REQUIRED
    http_status: 422
    applies_to: "POST /merchants/{id}/verify-category, POST /reclassification-requests/{id}/resubmit"

  - priority: 31
    category: business_constraint
    check: "the merchant has no IncentiveEnrollment in status PENDING, ENROLLED, WAITLISTED or PROBATION on the same incentive program"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /incentive-enrollments"

  - priority: 32
    category: business_fiscal
    check: "committed_volume_cents >= IncentiveProgram.min_commitment_cents"
    error_id: ERR_COMMITMENT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /incentive-enrollments"

  - priority: 33
    category: business_fiscal
    check: "committed_volume_cents <= IncentiveProgram.uncommitted_capacity_cents (skipped when the enrollment is admitted to the waitlist rather than enrolled)"
    error_id: ERR_INCENTIVE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /incentive-enrollments"

# ============================================================================
# 1.5 API Endpoint Table
# ============================================================================
endpoints:
  # ---- ProcessingPlatform ----------------------------------------------------
  - method: POST
    path: "/processing-platforms"
    description: "Register an acquirer processing platform, declaring its concurrent-window capacity and its symmetric blackout buffer."
    roles: [NetworkAdmin]
    code: 201
    input: ["name", "region_code", "max_concurrent_windows", "blackout_buffer_days"]
    output: ProcessingPlatform
    side_effects: []

  - method: GET
    path: "/processing-platforms/{id}"
    description: "Fetch one processing platform."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: ProcessingPlatform
    side_effects: []

  - method: GET
    path: "/processing-platforms"
    description: "List processing platforms."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["region_code?", "limit?", "offset?"]
    output: ProcessingPlatform[]
    side_effects: []

  # ---- Acquirer --------------------------------------------------------------
  - method: POST
    path: "/acquirers"
    description: "Register an acquirer on a platform. Starts in compliance_status COMPLIANT with missed_window_count 0."
    roles: [NetworkAdmin]
    code: 201
    input: ["name", "bin_prefix", "platform_id", "country_code", "settlement_currency"]
    output: Acquirer
    side_effects: ["sets compliance_status = COMPLIANT", "sets missed_window_count = 0"]

  - method: GET
    path: "/acquirers/{id}"
    description: "Fetch one acquirer, including its recomputed missed_window_count and compliance_status."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: Acquirer
    side_effects: []

  - method: GET
    path: "/acquirers"
    description: "List acquirers, filterable by owning platform (reverse-reachability for Acquirer.platform_id) and compliance posture."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["platform_id?", "compliance_status?", "limit?", "offset?"]
    output: Acquirer[]
    side_effects: []

  # ---- MccDefinition ---------------------------------------------------------
  - method: POST
    path: "/mcc-definitions"
    description: "Publish a merchant category code definition: its business-type key, the special interchange programs it may qualify for, and its documentation and high-risk flags."
    roles: [NetworkAdmin]
    code: 201
    input: ["mcc_code", "description", "business_type_key", "program_eligibility", "requires_documentation", "high_risk"]
    output: MccDefinition
    side_effects: []

  - method: GET
    path: "/mcc-definitions/{id}"
    description: "Fetch one MCC definition."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: MccDefinition
    side_effects: []

  - method: GET
    path: "/mcc-definitions"
    description: "List MCC definitions, filterable by business_type_key and mcc_code, ordered by high_risk ASC then mcc_code ASC — the same ordering calculations.mcc_assignment_selector uses."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["business_type_key?", "mcc_code?", "high_risk?", "limit?", "offset?"]
    output: MccDefinition[]
    side_effects: []

  # ---- RateProgram -----------------------------------------------------------
  - method: POST
    path: "/rate-programs"
    description: "Define an interchange rate program: its eligible MCCs, its ad-valorem and per-item components, the clearing data elements it demands and its clearing-delay tolerance. Exactly one program with category STANDARD must exist as the unconditional fallback."
    roles: [NetworkAdmin]
    code: 201
    input: ["program_code", "name", "category", "eligible_mcc_codes", "base_rate_bps", "per_item_fee_cents", "requires_data_elements", "max_clearing_delay_hours"]
    output: RateProgram
    side_effects: []

  - method: GET
    path: "/rate-programs/{id}"
    description: "Fetch one rate program."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: RateProgram
    side_effects: []

  - method: GET
    path: "/rate-programs"
    description: "List rate programs, filterable by category."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["category?", "program_code?", "limit?", "offset?"]
    output: RateProgram[]
    side_effects: []

  # ---- RateProgramVersion ----------------------------------------------------
  - method: POST
    path: "/rate-programs/{id}/versions"
    description: "Draft a quarterly rate-change version of a program. Created in status DRAFT; the half-open [effective_from, effective_to) interval is not checked for overlap until publish."
    roles: [NetworkAdmin]
    code: 201
    input: ["publication_quarter", "effective_from", "effective_to", "base_rate_bps", "per_item_fee_cents", "implementation_deadline"]
    output: RateProgramVersion
    side_effects: ["sets status = DRAFT", "sets published_at = null"]

  - method: POST
    path: "/rate-program-versions/{id}/publish"
    description: "Publish a drafted quarterly rate change. Runs calculations.rate_version_window_overlap_check against other PUBLISHED versions of the same program under half-open interval semantics."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: RateProgramVersion
    side_effects: ["transitions status DRAFT -> PUBLISHED", "sets published_at = current logical clock", "opens the implementation-window envelope [published_at, implementation_deadline]"]

  - method: GET
    path: "/rate-program-versions/{id}"
    description: "Fetch one rate program version."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: RateProgramVersion
    side_effects: []

  - method: GET
    path: "/rate-program-versions"
    description: "List rate program versions, filterable by owning program (reverse-reachability for RateProgramVersion.rate_program_id), status and publication quarter."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["rate_program_id?", "status?", "publication_quarter?", "limit?", "offset?"]
    output: RateProgramVersion[]
    side_effects: []

  # ---- AcquirerImplementationWindow ------------------------------------------
  - method: POST
    path: "/implementation-windows"
    description: "Schedule an acquirer's implementation window for a published rate change. Runs calculations.implementation_window_bounds_check (priority 20) BEFORE calculations.platform_window_overlap_check (priority 22), so a window that is both out of envelope and platform-conflicting reports ERR_IMPLEMENTATION_WINDOW_OUT_OF_BOUNDS."
    roles: [AcquirerOps, NetworkAdmin]
    code: 201
    input: ["acquirer_id", "rate_program_version_id", "platform_id", "window_start", "window_end"]
    output: AcquirerImplementationWindow
    side_effects: ["sets status = SCHEDULED", "occupies one unit of ProcessingPlatform.max_concurrent_windows for the buffered interval"]

  - method: POST
    path: "/implementation-windows/{id}/start"
    description: "Acquirer begins implementing the published rate change."
    roles: [AcquirerOps, NetworkAdmin]
    code: 200
    input: []
    output: AcquirerImplementationWindow
    side_effects: ["transitions status SCHEDULED -> IN_PROGRESS", "sets started_at = current logical clock"]

  - method: POST
    path: "/implementation-windows/{id}/complete"
    description: "Acquirer reports the rate change implemented. From IN_PROGRESS the window becomes COMPLETED; from MISSED it becomes COMPLETED_LATE, which recomputes the acquirer's missed_window_count and can restore compliance_status NON_COMPLIANT -> COMPLIANT."
    roles: [AcquirerOps, NetworkAdmin]
    code: 200
    input: ["completion_note"]
    output: AcquirerImplementationWindow
    side_effects: ["transitions status IN_PROGRESS -> COMPLETED or MISSED -> COMPLETED_LATE", "recomputes Acquirer.missed_window_count", "transitions Acquirer.compliance_status NON_COMPLIANT -> COMPLIANT when the recomputed count reaches 0", "releases the platform capacity unit"]

  - method: GET
    path: "/implementation-windows/{id}"
    description: "Fetch one implementation window."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: AcquirerImplementationWindow
    side_effects: []

  - method: GET
    path: "/implementation-windows"
    description: "List implementation windows, filterable by acquirer, rate program version and platform (reverse-reachability for all three of this entity's FKs) and by status."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["acquirer_id?", "rate_program_version_id?", "platform_id?", "status?", "limit?", "offset?"]
    output: AcquirerImplementationWindow[]
    side_effects: []

  # ---- Merchant --------------------------------------------------------------
  - method: POST
    path: "/merchants"
    description: "Board a merchant under an acquirer. Runs calculations.mcc_assignment_selector on business_type_key to derive assigned_mcc; when the selected MccDefinition.requires_documentation is false the merchant is auto-verified to mcc_status VERIFIED, otherwise it stays PENDING_VERIFICATION."
    roles: [AcquirerOps, NetworkAdmin]
    code: 201
    input: ["legal_name", "business_type_key", "acquirer_id", "home_country_code"]
    output: Merchant
    side_effects: ["runs calculations.mcc_assignment_selector to set assigned_mcc", "sets mcc_status = VERIFIED when the chosen MCC does not require documentation, else PENDING_VERIFICATION", "sets downgrade_count_current_quarter = 0 and lifetime_net_assessed_cents = 0"]

  - method: POST
    path: "/merchants/{id}/verify-category"
    description: "CategoryAnalyst verifies a documentation-gated merchant category. Requires a non-empty documentation_ref when the assigned MccDefinition.requires_documentation is true."
    roles: [CategoryAnalyst]
    code: 200
    input: ["documentation_ref"]
    output: Merchant
    side_effects: ["transitions mcc_status PENDING_VERIFICATION -> VERIFIED", "stores documentation_ref", "sets verified_by_user_id = acting X-User-ID"]

  - method: GET
    path: "/merchants/{id}"
    description: "Fetch one merchant with its recomputed assigned_mcc, downgrade_count_current_quarter and lifetime_net_assessed_cents."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: Merchant
    side_effects: []

  - method: GET
    path: "/merchants"
    description: "List merchants, filterable by sponsoring acquirer (reverse-reachability for Merchant.acquirer_id), category posture and assigned MCC."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["acquirer_id?", "mcc_status?", "assigned_mcc?", "business_type_key?", "limit?", "offset?"]
    output: Merchant[]
    side_effects: []

  # ---- ReclassificationRequest -----------------------------------------------
  - method: POST
    path: "/reclassification-requests"
    description: "Acquirer challenges a merchant's assigned MCC. Carries expected_merchant_version for the reclass-create-stale-merchant OCC rule. Any live request on the same merchant is SUPERSEDED by the new one."
    roles: [AcquirerOps]
    code: 201
    input: ["merchant_id", "requested_mcc", "justification", "expected_merchant_version"]
    output: ReclassificationRequest
    side_effects: ["sets status = SUBMITTED and review_round = 1", "transitions any prior SUBMITTED / UNDER_REVIEW / INFO_REQUESTED request on the same merchant to SUPERSEDED", "increments Merchant.version by 1"]

  - method: POST
    path: "/reclassification-requests/{id}/review"
    description: "CategoryAnalyst takes the request under review and is recorded as reviewer_user_id."
    roles: [CategoryAnalyst]
    code: 200
    input: []
    output: ReclassificationRequest
    side_effects: ["transitions status SUBMITTED -> UNDER_REVIEW", "sets reviewer_user_id = acting X-User-ID (overwriting any prior round's reviewer)"]

  - method: POST
    path: "/reclassification-requests/{id}/request-info"
    description: "CategoryAnalyst returns the request for more information. Refused once review_round has reached MAX_REVIEW_ROUNDS (3)."
    roles: [CategoryAnalyst]
    code: 200
    input: ["info_request_note"]
    output: ReclassificationRequest
    side_effects: ["transitions status UNDER_REVIEW -> INFO_REQUESTED", "stores info_request_note"]

  - method: POST
    path: "/reclassification-requests/{id}/resubmit"
    description: "Acquirer supplies the requested documentation and re-enters the review cycle, incrementing review_round."
    roles: [AcquirerOps]
    code: 200
    input: ["supporting_doc_ref"]
    output: ReclassificationRequest
    side_effects: ["transitions status INFO_REQUESTED -> SUBMITTED", "increments review_round by 1", "stores supporting_doc_ref"]

  - method: POST
    path: "/reclassification-requests/{id}/decide"
    description: "CategoryApprover approves or denies. The acting X-User-ID must differ from reviewer_user_id (segregation of duties). On APPROVE the merchant's assigned_mcc is rewritten, which can cascade IncentiveEnrollment rows to TERMINATED_INELIGIBLE and release incentive capacity."
    roles: [CategoryApprover]
    code: 200
    input: ["decision", "decision_note"]
    output: ReclassificationRequest
    side_effects: ["transitions status UNDER_REVIEW -> APPROVED or UNDER_REVIEW -> DENIED", "sets decider_user_id = acting X-User-ID", "on APPROVE sets decided_mcc and rewrites Merchant.assigned_mcc, incrementing Merchant.version by 1", "on APPROVE cascades IncentiveEnrollment rows whose program no longer lists the new MCC to TERMINATED_INELIGIBLE and releases their committed capacity", "stores decision_note"]

  - method: GET
    path: "/reclassification-requests/{id}"
    description: "Fetch one reclassification request."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: ReclassificationRequest
    side_effects: []

  - method: GET
    path: "/reclassification-requests"
    description: "List reclassification requests, filterable by merchant (reverse-reachability for ReclassificationRequest.merchant_id) and status."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["merchant_id?", "status?", "requested_mcc?", "limit?", "offset?"]
    output: ReclassificationRequest[]
    side_effects: []

  # ---- FxRate ----------------------------------------------------------------
  - method: POST
    path: "/fx-rates"
    description: "Publish a currency-conversion rate row with its assessment markup in basis points, selectable from effective_from onward."
    roles: [NetworkAdmin]
    code: 201
    input: ["base_currency", "quote_currency", "rate", "markup_bps", "effective_from"]
    output: FxRate
    side_effects: []

  - method: GET
    path: "/fx-rates/{id}"
    description: "Fetch one FX rate row."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: FxRate
    side_effects: []

  - method: GET
    path: "/fx-rates"
    description: "List FX rate rows, filterable by currency pair, ordered effective_from DESC then created_at DESC — the same ordering calculations.interchange_assessment uses to pick the applicable row."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["base_currency?", "quote_currency?", "limit?", "offset?"]
    output: FxRate[]
    side_effects: []

  # ---- SettlementBatch / TransactionRecord -----------------------------------
  - method: POST
    path: "/settlement-batches"
    description: "Open a clearing batch for an acquirer on a calendar date in a settlement currency. Unique on (acquirer_id, batch_date, currency_code)."
    roles: [AcquirerOps, NetworkAdmin]
    code: 201
    input: ["acquirer_id", "batch_date", "currency_code"]
    output: SettlementBatch
    side_effects: ["sets status = OPEN", "sets record_count = 0 and total_assessed_cents = 0"]

  - method: POST
    path: "/settlement-batches/{id}/transaction-records"
    description: "Add a clearing record to an OPEN batch. Carries expected_batch_version for the record-add-stale-batch OCC rule. Runs calculations.clearing_delay_hours and the PROVISIONAL_AUTH_BASED variant of calculations.qualification_evaluation, storing provisional_rate_program_id and provisional_assessed_cents. Because the response is the TransactionRecord, the batch's new version must be re-read via GET /settlement-batches/{id} before the next add."
    roles: [AcquirerOps, NetworkAdmin]
    code: 201
    input: ["merchant_id", "amount_cents", "transaction_currency", "auth_code", "auth_timestamp", "clearing_timestamp", "data_elements", "expected_batch_version"]
    output: TransactionRecord
    side_effects: ["sets authorization_status = AUTH_APPROVED and qualification_status = PENDING", "computes clearing_delay_hours and cross_border", "runs calculations.qualification_evaluation variant PROVISIONAL_AUTH_BASED to set provisional_rate_program_id", "runs calculations.interchange_assessment on the provisional program to set provisional_assessed_cents", "increments SettlementBatch.version by 1", "increments SettlementBatch.record_count by 1"]

  - method: POST
    path: "/settlement-batches/{id}/submit"
    description: "Close the batch to further records and present it for clearing."
    roles: [AcquirerOps, NetworkAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["transitions status OPEN -> SUBMITTED", "increments SettlementBatch.version by 1"]

  - method: POST
    path: "/settlement-batches/{id}/finalize"
    description: "Finalize clearing. Requires the owning Acquirer.compliance_status COMPLIANT. Runs the FINAL_CLEARING_BASED variant of calculations.qualification_evaluation on every PENDING record, then calculations.downgrade_reason_resolution, calculations.interchange_assessment and calculations.batch_assessment_total (round per record, then sum). Downgrades roll up into Merchant.downgrade_count_current_quarter and can fire the automatic DOWNGRADE_THRESHOLD category audit."
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["transitions status SUBMITTED -> FINALIZED and sets finalized_at", "transitions each PENDING record's qualification_status to QUALIFIED or DOWNGRADED", "sets qualified_rate_program_id, assessed_interchange_cents, cross_border_surcharge_cents, fx_markup_cents, downgrade_reason and mcc_at_qualification on every record", "sets SettlementBatch.total_assessed_cents via calculations.batch_assessment_total", "recomputes Merchant.downgrade_count_current_quarter and Merchant.lifetime_net_assessed_cents", "creates a MerchantCategoryAudit with trigger_reason DOWNGRADE_THRESHOLD and moves the merchant to mcc_status UNDER_REVIEW when the recomputed downgrade count reaches DOWNGRADE_AUDIT_TRIGGER", "suspends any live ReclassificationRequest on an audited merchant to SUSPENDED_PENDING_AUDIT", "increments SettlementBatch.version by 1"]

  - method: POST
    path: "/transaction-records/{id}/reverse"
    description: "Reverse a record on exactly one of its two independent dimensions: AUTH_REVERSAL moves authorization_status AUTH_APPROVED -> AUTH_REVERSED and leaves qualification_status untouched; CLEARING_REVERSAL moves qualification_status QUALIFIED or DOWNGRADED -> REVERSED, zeroes the record's money and rolls the delta back out of the batch and merchant ledgers."
    roles: [AcquirerOps, NetworkAdmin]
    code: 200
    input: ["reversal_type", "reversal_reason"]
    output: TransactionRecord
    side_effects: ["on AUTH_REVERSAL transitions authorization_status AUTH_APPROVED -> AUTH_REVERSED", "on CLEARING_REVERSAL transitions qualification_status QUALIFIED|DOWNGRADED -> REVERSED", "on CLEARING_REVERSAL zeroes assessed_interchange_cents, cross_border_surcharge_cents and fx_markup_cents", "on CLEARING_REVERSAL decrements SettlementBatch.total_assessed_cents, Merchant.lifetime_net_assessed_cents and Merchant.downgrade_count_current_quarter by exactly the reversed record's contribution", "stores reversal_type and reversal_reason"]

  - method: GET
    path: "/settlement-batches/{id}"
    description: "Fetch one settlement batch with its recomputed record_count, total_assessed_cents and current version — the canonical source of expected_batch_version for the next record add."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []

  - method: GET
    path: "/settlement-batches"
    description: "List settlement batches, filterable by acquirer (reverse-reachability for SettlementBatch.acquirer_id) and status."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["acquirer_id?", "status?", "batch_date?", "limit?", "offset?"]
    output: SettlementBatch[]
    side_effects: []

  - method: GET
    path: "/transaction-records/{id}"
    description: "Fetch one transaction record with both state dimensions and every computed money component."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: TransactionRecord
    side_effects: []

  - method: GET
    path: "/transaction-records"
    description: "List transaction records, filterable by batch, merchant and either rate-program reference (reverse-reachability for all four of this entity's FKs) and by qualification status."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["settlement_batch_id?", "merchant_id?", "provisional_rate_program_id?", "qualified_rate_program_id?", "qualification_status?", "authorization_status?", "limit?", "offset?"]
    output: TransactionRecord[]
    side_effects: []

  # ---- IncentiveProgram / IncentiveEnrollment ---------------------------------
  - method: POST
    path: "/incentive-programs"
    description: "Publish a volume-commitment incentive program with an immutable capacity pool, a per-enrollment minimum commitment, a reopen threshold and a performance threshold percentage."
    roles: [NetworkAdmin]
    code: 201
    input: ["program_name", "eligible_mcc_codes", "total_capacity_cents", "min_commitment_cents", "reopen_threshold_cents", "performance_threshold_pct"]
    output: IncentiveProgram
    side_effects: ["sets enrollment_state = OPEN", "sets uncommitted_capacity_cents = total_capacity_cents", "sets enrolled_count = 0"]

  - method: GET
    path: "/incentive-programs/{id}"
    description: "Fetch one incentive program with its recomputed uncommitted_capacity_cents, enrolled_count and current version — the canonical source of expected_incentive_program_version."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: []

  - method: GET
    path: "/incentive-programs"
    description: "List incentive programs."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["enrollment_state?", "limit?", "offset?"]
    output: IncentiveProgram[]
    side_effects: []

  - method: POST
    path: "/incentive-enrollments"
    description: "Enrol a VERIFIED merchant into an incentive program against a volume commitment. Carries expected_incentive_program_version for the enrollment-create-stale-program OCC rule. When capacity is short and waitlist_requested is true the enrollment is parked as WAITLISTED with no capacity debit; when waitlist_requested is false the fiscal check rejects it. The transient PENDING state is never observable — the response is already ENROLLED or WAITLISTED."
    roles: [AcquirerOps]
    code: 201
    input: ["incentive_program_id", "merchant_id", "committed_volume_cents", "waitlist_requested?", "expected_incentive_program_version"]
    output: IncentiveEnrollment
    side_effects: ["sets status = ENROLLED and enrolled_at = current logical clock when capacity admits the commitment, else WAITLISTED", "on ENROLLED debits IncentiveProgram.uncommitted_capacity_cents by committed_volume_cents and increments enrolled_count", "transitions IncentiveProgram.enrollment_state OPEN -> CLOSED_FULL when the remaining uncommitted capacity falls below min_commitment_cents", "increments IncentiveProgram.version by 1"]

  - method: POST
    path: "/incentive-enrollments/{id}/evaluate-performance"
    description: "Score an enrollment against its commitment. basis selects the variant of calculations.incentive_performance_score (TRAILING or PROJECTED); calculations.incentive_tier_and_credit then runs in the same request, resolving tier_code from gross_assessed_volume_cents ONLY. A score strictly below IncentiveProgram.performance_threshold_pct moves ENROLLED -> PROBATION; a score at or above it moves PROBATION -> ENROLLED; a second consecutive shortfall from PROBATION terminates the enrollment."
    roles: [NetworkAdmin]
    code: 200
    input: ["basis"]
    output: IncentiveEnrollment
    side_effects: ["sets last_evaluated_basis, achieved_volume_cents and performance_score_pct", "sets gross_assessed_volume_cents, tier_code, incentive_credit_cents and net_assessed_volume_cents", "transitions status ENROLLED -> PROBATION and increments probation_count on a shortfall", "transitions status PROBATION -> ENROLLED when the score recovers", "transitions status PROBATION -> TERMINATED_SHORTFALL on a repeat shortfall, releasing the committed capacity"]

  - method: POST
    path: "/incentive-enrollments/{id}/withdraw"
    description: "Merchant's acquirer voluntarily withdraws the enrollment, releasing any capacity it held and potentially reopening the program and promoting the head of the waitlist."
    roles: [AcquirerOps, NetworkAdmin]
    code: 200
    input: ["withdrawal_reason"]
    output: IncentiveEnrollment
    side_effects: ["transitions status ENROLLED|PROBATION|WAITLISTED -> WITHDRAWN", "credits IncentiveProgram.uncommitted_capacity_cents by committed_volume_cents when the enrollment held capacity", "transitions IncentiveProgram.enrollment_state CLOSED_FULL -> OPEN when the released capacity reaches reopen_threshold_cents", "promotes the head-of-line WAITLISTED enrollment to ENROLLED when the reopened capacity admits its commitment", "increments IncentiveProgram.version by 1"]

  - method: GET
    path: "/incentive-enrollments/{id}"
    description: "Fetch one incentive enrollment with its scoring and tier fields."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: IncentiveEnrollment
    side_effects: []

  - method: GET
    path: "/incentive-enrollments"
    description: "List incentive enrollments, filterable by program and merchant (reverse-reachability for both of this entity's FKs) and by status; ordered created_at ASC, which is the head-of-line order used for waitlist promotion."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["incentive_program_id?", "merchant_id?", "status?", "limit?", "offset?"]
    output: IncentiveEnrollment[]
    side_effects: []

  # ---- MerchantCategoryAudit --------------------------------------------------
  - method: POST
    path: "/merchant-category-audits"
    description: "Open a merchant category audit. trigger_reason MISREPRESENTATION_COMPLAINT or ROUTINE_SAMPLING are the only manually admissible values; DOWNGRADE_THRESHOLD is reserved for the automatic audit fired by batch finalize. Snapshots the merchant's category posture and freezes any live reclassification request."
    roles: [ComplianceAuditor]
    code: 201
    input: ["merchant_id", "trigger_reason"]
    output: MerchantCategoryAudit
    side_effects: ["sets status = SCHEDULED", "sets mcc_at_audit_open = Merchant.assigned_mcc and penalty_assessed_cents = 0", "snapshots Merchant.mcc_status into mcc_status_before_review and transitions mcc_status to UNDER_REVIEW", "snapshots and suspends any SUBMITTED / UNDER_REVIEW / INFO_REQUESTED ReclassificationRequest on the merchant to SUSPENDED_PENDING_AUDIT", "increments Merchant.version by 1"]

  - method: POST
    path: "/merchant-category-audits/{id}/start-fieldwork"
    description: "ComplianceAuditor begins fieldwork and is recorded as auditor_user_id. This is the fork point: exactly one of sustain-findings or clear-findings may follow."
    roles: [ComplianceAuditor]
    code: 200
    input: ["fieldwork_start", "fieldwork_end"]
    output: MerchantCategoryAudit
    side_effects: ["transitions status SCHEDULED -> FIELDWORK", "sets auditor_user_id = acting X-User-ID", "stores fieldwork_start and fieldwork_end"]

  - method: POST
    path: "/merchant-category-audits/{id}/sustain-findings"
    description: "Auditor sustains the misrepresentation finding: rewrites the merchant's assigned_mcc to correct_mcc, moves the merchant to the terminal MISREPRESENTED state, assesses calculations.misrepresentation_penalty from the pre-rewrite ledger, denies the frozen reclassification request, and cascades incentive enrollments that the new MCC makes ineligible — releasing their capacity, which can reopen the program and promote its waitlist head."
    roles: [ComplianceAuditor]
    code: 200
    input: ["correct_mcc", "findings_note"]
    output: MerchantCategoryAudit
    side_effects: ["transitions status FIELDWORK -> FINDINGS_SUSTAINED", "sets penalty_assessed_cents via calculations.misrepresentation_penalty read BEFORE the MCC rewrite", "rewrites Merchant.assigned_mcc to correct_mcc and transitions Merchant.mcc_status UNDER_REVIEW -> MISREPRESENTED", "transitions the merchant's SUSPENDED_PENDING_AUDIT ReclassificationRequest to DENIED", "cascades IncentiveEnrollment rows in ENROLLED or PROBATION whose program does not list correct_mcc to TERMINATED_INELIGIBLE and credits their committed capacity back", "transitions IncentiveProgram.enrollment_state CLOSED_FULL -> OPEN and promotes the head-of-line WAITLISTED enrollment when the released capacity admits it", "increments Merchant.version and IncentiveProgram.version by 1"]

  - method: POST
    path: "/merchant-category-audits/{id}/clear-findings"
    description: "Auditor clears the merchant: restores mcc_status verbatim from mcc_status_before_review and restores the frozen reclassification request verbatim from prior_status_before_suspension. Leaves assigned_mcc, all money and all enrollments untouched."
    roles: [ComplianceAuditor]
    code: 200
    input: ["findings_note"]
    output: MerchantCategoryAudit
    side_effects: ["transitions status FIELDWORK -> FINDINGS_CLEARED", "restores Merchant.mcc_status from mcc_status_before_review", "restores the merchant's SUSPENDED_PENDING_AUDIT ReclassificationRequest to prior_status_before_suspension", "leaves penalty_assessed_cents at 0", "increments Merchant.version by 1"]

  - method: POST
    path: "/merchant-category-audits/{id}/close"
    description: "Join point: closes the audit from either fork branch. The acting X-User-ID must differ from auditor_user_id (segregation of duties)."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: MerchantCategoryAudit
    side_effects: ["transitions status FINDINGS_SUSTAINED -> CLOSED or FINDINGS_CLEARED -> CLOSED", "sets closed_by_user_id = acting X-User-ID", "preserves penalty_assessed_cents from the sustained branch"]

  - method: GET
    path: "/merchant-category-audits/{id}"
    description: "Fetch one merchant category audit."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: []
    output: MerchantCategoryAudit
    side_effects: []

  - method: GET
    path: "/merchant-category-audits"
    description: "List merchant category audits, filterable by merchant (reverse-reachability for MerchantCategoryAudit.merchant_id), status and trigger reason. This is the only discovery channel for the audit that batch finalize creates by cascade."
    roles: [NetworkAdmin, AcquirerOps, CategoryAnalyst, CategoryApprover, ComplianceAuditor]
    code: 200
    input: ["merchant_id?", "status?", "trigger_reason?", "limit?", "offset?"]
    output: MerchantCategoryAudit[]
    side_effects: []

  # ---- Test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. The startup default is exactly 2026-08-01T00:00:00Z and the clock MUST NOT fall back to wall-clock time before the first call. Every set runs calculations.logical_clock_sweep in its three pinned steps, each processing matching rows created_at ASC: (1) PUBLISHED RateProgramVersion rows whose effective_to <= the new clock become SUPERSEDED; (2) SCHEDULED or IN_PROGRESS AcquirerImplementationWindow rows whose window_end < the new clock become MISSED, after which each affected Acquirer's missed_window_count is recomputed and COMPLIANT -> NON_COMPLIANT fires when it exceeds zero; (3) TransactionRecord rows with authorization_status AUTH_APPROVED and qualification_status PENDING whose age past auth_timestamp exceeds AUTH_VALIDITY_HOURS (720) become AUTH_EXPIRED."
    roles: [NetworkAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["advances or rewinds the logical clock", "runs calculations.logical_clock_sweep step 1 over RateProgramVersion", "runs calculations.logical_clock_sweep step 2 over AcquirerImplementationWindow and Acquirer", "runs calculations.logical_clock_sweep step 3 over TransactionRecord"]

# ============================================================================
# 1.6 Error Code Catalog
# ============================================================================
errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_ACQUIRER_SCOPE_VIOLATION
    http: 403
    condition: "an AcquirerOps caller's X-User-ID is not the acquirer_id that owns the target merchant, batch, window, reclassification request or enrollment"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the deciding approver's X-User-ID equals ReclassificationRequest.reviewer_user_id, or the closing auditor's X-User-ID equals MerchantCategoryAudit.auditor_user_id"

  # --- existence ---
  - id: ERR_PLATFORM_NOT_FOUND
    http: 404
    condition: "no ProcessingPlatform with the supplied id"
  - id: ERR_ACQUIRER_NOT_FOUND
    http: 404
    condition: "no Acquirer with the supplied id"
  - id: ERR_MCC_DEFINITION_NOT_FOUND
    http: 404
    condition: "no MccDefinition with the supplied id"
  - id: ERR_MERCHANT_NOT_FOUND
    http: 404
    condition: "no Merchant with the supplied id"
  - id: ERR_RATE_PROGRAM_NOT_FOUND
    http: 404
    condition: "no RateProgram with the supplied id"
  - id: ERR_RATE_VERSION_NOT_FOUND
    http: 404
    condition: "no RateProgramVersion with the supplied id"
  - id: ERR_WINDOW_NOT_FOUND
    http: 404
    condition: "no AcquirerImplementationWindow with the supplied id"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "no SettlementBatch with the supplied id"
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "no TransactionRecord with the supplied id"
  - id: ERR_RECLASS_REQUEST_NOT_FOUND
    http: 404
    condition: "no ReclassificationRequest with the supplied id"
  - id: ERR_INCENTIVE_PROGRAM_NOT_FOUND
    http: 404
    condition: "no IncentiveProgram with the supplied id"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "no IncentiveEnrollment with the supplied id"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "no MerchantCategoryAudit with the supplied id"
  - id: ERR_FX_RATE_NOT_FOUND
    http: 404
    condition: "no FxRate with the supplied id"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, out-of-domain enum value (including trigger_reason DOWNGRADE_THRESHOLD on a manual audit create), negative money or bps value, amount_cents below 1, malformed timestamp or currency code, mcc_code not exactly four digits, window_start not before window_end, effective_from not before effective_to, or decision outside {APPROVE, DENY}"

  # --- state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource's status does not permit the requested transition, or POST /implementation-windows references a RateProgramVersion whose status is not PUBLISHED"
  - id: ERR_BATCH_NOT_OPEN
    http: 409
    condition: "a transaction record is added to a SettlementBatch whose status is not OPEN"
  - id: ERR_ENROLLMENT_CLOSED
    http: 409
    condition: "an enrollment is created against an IncentiveProgram in enrollment_state CLOSED_FULL without waitlist_requested true"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_batch_version, expected_merchant_version or expected_incentive_program_version does not equal the stored parent version"

  # --- safety / compliance ---
  - id: ERR_MERCHANT_MISREPRESENTED
    http: 409
    condition: "the referenced Merchant.mcc_status is the terminal MISREPRESENTED"
  - id: ERR_MERCHANT_UNDER_CATEGORY_REVIEW
    http: 409
    condition: "the referenced Merchant.mcc_status is UNDER_REVIEW because a category audit is open"
  - id: ERR_MERCHANT_NOT_VERIFIED
    http: 409
    condition: "an incentive enrollment is attempted for a merchant whose mcc_status is not VERIFIED"
  - id: ERR_ACQUIRER_NON_COMPLIANT
    http: 409
    condition: "a settlement batch is finalized while the owning Acquirer.compliance_status is NON_COMPLIANT"

  # --- temporal ---
  - id: ERR_CLEARING_BEFORE_AUTH
    http: 422
    condition: "clearing_timestamp is strictly earlier than auth_timestamp on a submitted transaction record"
  - id: ERR_IMPLEMENTATION_WINDOW_OUT_OF_BOUNDS
    http: 422
    condition: "window_start precedes RateProgramVersion.published_at or window_end exceeds RateProgramVersion.implementation_deadline"

  # --- constraint ---
  - id: ERR_RATE_VERSION_WINDOW_OVERLAP
    http: 409
    condition: "publishing a version whose half-open [effective_from, effective_to) interval overlaps another PUBLISHED version of the same rate program"
  - id: ERR_PLATFORM_WINDOW_CONFLICT
    http: 409
    condition: "the count of SCHEDULED or IN_PROGRESS windows on the platform whose blackout-buffered closed interval touches the candidate reaches ProcessingPlatform.max_concurrent_windows"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "a natural key already exists: mcc_code, program_code, bin_prefix, (rate_program_id, publication_quarter), (acquirer_id, batch_date, currency_code), (base_currency, quote_currency, effective_from), or auth_code within a batch"
  - id: ERR_REVIEW_ROUND_LIMIT_EXCEEDED
    http: 422
    condition: "an information request is issued when ReclassificationRequest.review_round has already reached MAX_REVIEW_ROUNDS (3)"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "the merchant already has a PENDING, ENROLLED, WAITLISTED or PROBATION enrollment on the same incentive program"

  # --- referential / eligibility ---
  - id: ERR_MCC_NOT_DEFINED
    http: 422
    condition: "the supplied requested_mcc or correct_mcc names no MccDefinition, or no MccDefinition exists for the merchant's business_type_key"
  - id: ERR_MCC_NOT_ELIGIBLE_FOR_PROGRAM
    http: 422
    condition: "the merchant's assigned_mcc is absent from IncentiveProgram.eligible_mcc_codes"
  - id: ERR_NO_QUALIFYING_RATE_PROGRAM
    http: 422
    condition: "no RateProgram is selectable for the record because the mandatory STANDARD fallback program does not exist"
  - id: ERR_FX_RATE_UNAVAILABLE
    http: 422
    condition: "transaction_currency differs from the batch currency and no FxRate row for the pair has effective_from at or before clearing_timestamp"
  - id: ERR_DOCUMENTATION_REQUIRED
    http: 422
    condition: "the target MccDefinition.requires_documentation is true but documentation_ref or supporting_doc_ref is empty or absent"

  # --- fiscal ---
  - id: ERR_COMMITMENT_BELOW_MINIMUM
    http: 422
    condition: "committed_volume_cents is below IncentiveProgram.min_commitment_cents"
  - id: ERR_INCENTIVE_CAPACITY_EXCEEDED
    http: 409
    condition: "committed_volume_cents exceeds IncentiveProgram.uncommitted_capacity_cents on a non-waitlisted enrollment"

# ============================================================================
# 1.7 RBAC Matrix
# ============================================================================
roles:
  - name: NetworkAdmin
    description: "Visa network operations. Owns the reference data (platforms, acquirers, MCC directory, rate programs, quarterly rate versions, FX rates, incentive programs), finalizes clearing batches, scores incentive performance and drives the logical clock. Cannot verify, review, decide or audit merchant categories — those sit with the category and compliance roles."
    identity: "opaque"
    exclusive_operations:
      - "POST /processing-platforms"
      - "POST /acquirers"
      - "POST /mcc-definitions"
      - "POST /rate-programs"
      - "POST /rate-programs/{id}/versions"
      - "POST /rate-program-versions/{id}/publish"
      - "POST /fx-rates"
      - "POST /incentive-programs"
      - "POST /settlement-batches/{id}/finalize"
      - "POST /incentive-enrollments/{id}/evaluate-performance"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /implementation-windows"
      - "POST /implementation-windows/{id}/start"
      - "POST /implementation-windows/{id}/complete"
      - "POST /merchants"
      - "POST /settlement-batches"
      - "POST /settlement-batches/{id}/transaction-records"
      - "POST /settlement-batches/{id}/submit"
      - "POST /transaction-records/{id}/reverse"
      - "POST /incentive-enrollments/{id}/withdraw"
      - "all GET endpoints"

  - name: AcquirerOps
    description: "Acquirer-side operations. X-User-ID is the acting Acquirer's id, so every merchant, batch, window, reclassification request and enrollment it touches must roll up to that acquirer. Boards merchants, submits clearing, files reclassification requests and enrols merchants in incentive programs."
    identity: "entity_backed:Acquirer"
    exclusive_operations:
      - "POST /reclassification-requests"
      - "POST /reclassification-requests/{id}/resubmit"
      - "POST /incentive-enrollments"
    shared_operations:
      - "POST /implementation-windows"
      - "POST /implementation-windows/{id}/start"
      - "POST /implementation-windows/{id}/complete"
      - "POST /merchants"
      - "POST /settlement-batches"
      - "POST /settlement-batches/{id}/transaction-records"
      - "POST /settlement-batches/{id}/submit"
      - "POST /transaction-records/{id}/reverse"
      - "POST /incentive-enrollments/{id}/withdraw"
      - "all GET endpoints"

  - name: CategoryAnalyst
    description: "Merchant category analyst. Verifies documentation-gated categories and works the reclassification review cycle (review, request-info). May NEVER decide a reclassification request — that is CategoryApprover's exclusive operation, and the analyst recorded as reviewer_user_id is additionally barred by the segregation-of-duties check."
    identity: "opaque"
    exclusive_operations:
      - "POST /merchants/{id}/verify-category"
      - "POST /reclassification-requests/{id}/review"
      - "POST /reclassification-requests/{id}/request-info"
    shared_operations:
      - "all GET endpoints"

  - name: CategoryApprover
    description: "Merchant category approver. Its only write is the reclassification decision, and only when its X-User-ID differs from the request's reviewer_user_id. Cannot review, cannot request information, cannot verify a category."
    identity: "opaque"
    exclusive_operations:
      - "POST /reclassification-requests/{id}/decide"
    shared_operations:
      - "all GET endpoints"

  - name: ComplianceAuditor
    description: "Misrepresentation and category-audit function. Opens audits, performs fieldwork, sustains or clears findings and closes audits — with the closer required to be a different X-User-ID from the fieldwork auditor. Cannot touch rate programs, clearing or enrollments."
    identity: "opaque"
    exclusive_operations:
      - "POST /merchant-category-audits"
      - "POST /merchant-category-audits/{id}/start-fieldwork"
      - "POST /merchant-category-audits/{id}/sustain-findings"
      - "POST /merchant-category-audits/{id}/clear-findings"
      - "POST /merchant-category-audits/{id}/close"
    shared_operations:
      - "all GET endpoints"
