            - call: "POST /pollination-contracts/${c2_id}/sign"
              payload: {}
              as: ContractCoordinator
              captures: { c2_v0: $.data.version }
            - call: "POST /pollination-contracts/${c2_id}/placements"
              payload: { hive_id: "${h1_id}", placement_start: "2026-02-14T00:00:00Z", removal_due: "2026-02-28T00:00:00Z" }
              as: ContractCoordinator
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /hive-placements/${p2_id}/confirm"
              payload: { expected_contract_version: "${c2_v0}" }
              as: ContractCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_HIVE_DOUBLE_BOOKED"
            - "HivePlacement.${p2_id}.status == PROPOSED"

      - name: contract_site_aggregate_capacity_exceeded_over_window
        grounds:
          - validations[priority=12]
          - state_machines.HivePlacement.PROPOSED_to_CONFIRMED
          - errors[ERR_SITE_CAPACITY_EXCEEDED]
          - entities.PollinationContract.fields.max_hives_on_site
        distinguishing_aspect: "Resource PollinationContract (a DIFFERENT entity than Hive) with aggregate-capacity semantics: confirming a third DISTINCT hive whose window overlaps two already-confirmed ones exceeds max_hives_on_site=2 -> ERR_SITE_CAPACITY_EXCEEDED; this counts SUM of overlapping hives, not single-hive exclusivity."
        test_recipe:
          setup:
            - "Clock 2026-01-06; Apiary CA ACTIVE-registered; three inspected hives H1,H2,H3 (forward 100)."
            - "Contract C1 SIGNED, max_hives_on_site=2; H1,H2 CONFIRMED over [2026-02-04,2026-03-06); H3 placement PROPOSED over the same window."
          setup_api_calls:
