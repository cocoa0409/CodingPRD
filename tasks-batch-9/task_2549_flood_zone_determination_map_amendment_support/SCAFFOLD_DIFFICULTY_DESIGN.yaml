            - "base FL chain: community, lender, panel seq 1, ROOFTOP property, structure -12.0, folio principal 28000000, ORIGINATION determination -> required_coverage_cents 25000000"
            - "MANDATORY_PURCHASE notice sent at 2026-08-01 -> response_deadline_at 2026-09-15, cooldown window = [2026-08-01, 2026-09-20] inclusive (NOTICE_COOLDOWN_DAYS = 5)"
