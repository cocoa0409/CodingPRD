            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30 }
              as: DispatchManager
            - call: "POST /equipment"
              payload: { asset_tag: "EQ-CC4", equipment_type: "PLOW", age_months: 2, assigned_route_id: "${route_id}" }
              as: DispatchManager
            - call: "POST /weather-readings"
              payload: { region_zip: "70006", snow_depth_in: 2.1, observed_at: "2026-01-17T06:00:00Z" }
