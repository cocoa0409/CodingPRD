  - method: GET
    path: "/cooperatives/{cid}/share-ledger-entries/{eid}"
    description: "Get one ledger entry"
    roles: [PlatformAdmin, BoardOfficer, BoardMember, ManagingAgent, Shareholder]
    code: 200
    input: []
    output: ShareLedgerEntry
    side_effects: []

  # --- Charge schedules ---
  - method: POST
    path: "/cooperatives/{cid}/charge-schedules"
    description: "Create a draft charge schedule (OCC-guarded)"
    roles: [BoardOfficer]
    code: 201
    input: [fiscal_year, annual_operating_budget_cents, allocation_method, effective_from, effective_to, expected_cooperative_version]
    output: ChargeSchedule
    side_effects:
      - "schedule_status = DRAFT"
      - "Increments Cooperative.version"

  - method: GET
    path: "/cooperatives/{cid}/charge-schedules"
