      - name: deal_create_refuses_a_rejected_buyer_and_admits_a_conditional_one
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_11_ERR_OFFTAKER_NOT_QUALIFIED
          - endpoints.POST_/ppa/deals
          - state_machines.Offtaker.UNDER_REVIEW_to_REJECTED
        distinguishing_aspect: |
          The deal's own payload is identical in both calls; only the state of a
          different entity decides the outcome. A REJECTED buyer cannot be structured
          at all, while a CONDITIONAL buyer can be structured and negotiated and is
          stopped only later at signing - so the admissible set here is
          {QUALIFIED, CONDITIONAL} and not {QUALIFIED}. The refusal must also leave no
          trace: the project's reserved capacity is unchanged.
        test_recipe:
          setup:
            - "One buyer decided REJECT and one buyer decided CONDITIONAL, plus a 100 MW project. Both deals would be identical 25.000 MW VIRTUAL_CFD structures."
