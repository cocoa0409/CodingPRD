              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { ob_id: $.data.id }
            - call: "POST /dtc/orders/${ob_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/shipments"
              payload: { order_id: "${ob_id}", carrier_enrollment_id: "${ce_id}" }
