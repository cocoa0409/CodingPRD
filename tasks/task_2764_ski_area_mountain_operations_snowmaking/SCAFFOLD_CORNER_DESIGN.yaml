      - name: role_slots_are_exclusive_for_every_role_except_liftie_float
        claim_type: conditional_validation
        grounds:
          - validations[priority=38]
          - errors[ERR_LIFT_ROLE_SLOT_CONFLICT]
          - entities.LiftStaffAssignment.fields.role_on_lift
        distinguishing_aspect: |
          One rule with a single carved-out enum value: at most one ASSIGNED row per role_on_lift,
          except LIFTIE_FLOAT which may repeat without limit. Both directions are exercised on the same
          lift with the same shift window - two LIFTIE_FLOAT rows must be accepted while a second TOP_OP
          and a second MID_LOAD must both be rejected - so an implementation that hard-codes the exception
          to the wrong role, or that treats every role as repeatable, fails on one of the four triggers.
        test_recipe:
          setup:
            - "A lift with ASSIGNED operators OP-1 (TOP_OP) and OP-2 (BOTTOM_OP) over 2026-08-01T00:00:00Z to 16:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-1", role_on_lift: "TOP_OP", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-2", role_on_lift: "BOTTOM_OP", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
          trigger:
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-9", role_on_lift: "TOP_OP", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
              captures: { err: $.data.error_id }
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-9", role_on_lift: "LIFTIE_FLOAT", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-10", role_on_lift: "LIFTIE_FLOAT", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-11", role_on_lift: "MID_LOAD", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-12", role_on_lift: "MID_LOAD", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
              captures: { err: $.data.error_id }
            - call: "GET /mountain-ops/lifts/${lift_id}"
              payload: {  }
              as: LiftOpsManager
          assert:
            - "Trigger 1: HTTP 409 with data.error_id == 'ERR_LIFT_ROLE_SLOT_CONFLICT' - TOP_OP is occupied by OP-1."
            - "Trigger 2: HTTP 201 - the first LIFTIE_FLOAT row."
            - "Trigger 3: HTTP 201 - a second LIFTIE_FLOAT row on the same lift and the same window is explicitly allowed."
            - "Trigger 4: HTTP 201 - MID_LOAD was unoccupied."
            - "Trigger 5: HTTP 409 with data.error_id == 'ERR_LIFT_ROLE_SLOT_CONFLICT' - MID_LOAD is not the carved-out role."
            - "Trigger 6: the lift staffed_operator_count == 5 (OP-1, OP-2, OP-9, OP-10, OP-11); the two rejected attempts contributed nothing."
            - "No trigger reports ERR_OPERATOR_DOUBLE_BOOKED: OP-9 through OP-12 are distinct operator codes, so priority 39 cannot mask priority 38."

      - name: explosive_missions_need_a_blaster_and_ski_cuts_need_an_available_partner
        claim_type: conditional_validation
        grounds:
          - validations[priority=21]
          - validations[priority=22]
          - errors[ERR_BLASTER_CERT_REQUIRED]
          - errors[ERR_SKI_CUT_PARTNER_REQUIRED]
          - state_machines.AvalancheMitigationMission.PLANNED_to_EXECUTED
        distinguishing_aspect: |
          Two preconditions on the same endpoint that are selected by the method enum: EXPLOSIVE checks
          an attribute of the acting patroller, while SKI_CUT checks the existence of a DIFFERENT patroller
          who is on duty and AVAILABLE. The partner rule is therefore satisfiable or not without touching
          the request or the acting patroller at all - the two peers are simply taken off duty - and the
          acting patroller himself must not count as his own partner, which is the corner an
          implementation that counts all on-duty patrollers of the season gets wrong.
        test_recipe:
          setup:
            - "A season with an avalanche-terrain area and three patrollers: P1 (EMT, blaster), P2 (PARAMEDIC, blaster) and P3 (EMT, NOT blaster), all on duty and AVAILABLE."
          setup_api_calls:
