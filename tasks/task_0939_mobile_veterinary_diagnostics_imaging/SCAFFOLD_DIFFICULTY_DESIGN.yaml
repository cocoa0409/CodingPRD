  - rule_id: non_linear_state_machine
    instances:
      - name: study_workflow_cycles_back_through_decline_and_hand_back
        grounds:
          - state_machines.Study.workflow.ASSIGNED_to_ACQUIRED
          - state_machines.Study.workflow.READ_IN_PROGRESS_to_ACQUIRED
          - state_machines.ReadAssignment.OFFERED_to_DECLINED
          - state_machines.ReadAssignment.ACCEPTED_to_HANDED_BACK
          - entities.Study.fields.read_attempt_count
        distinguishing_aspect: |
          The Study workflow axis is cyclic on the ENTITY Study: it leaves
          ACQUIRED for ASSIGNED, returns to ACQUIRED on a decline, leaves again
          for ASSIGNED and then READ_IN_PROGRESS, and returns to ACQUIRED a
          second time on a hand-back — while read_attempt_count ratchets 0 -> 1
          -> 2 and is never given back.
        test_recipe:
          setup:
            - "one TELERAD study uploaded by its clinic and image-QC ACCEPTED, so it is read-ready with read_attempt_count == 0"
            - "one ACTIVE specialist privileged for ULTRASOUND and CANINE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Telerad Partner Vet", address_zone: "Z6" }
              as: PlatformAdmin
              captures: { cl_t: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Hub QC Tech", certified_modalities: ["ULTRASOUND"] }
              as: PlatformAdmin
              captures: { tc_t: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Dr Vale", modality_privileges: ["ULTRASOUND"], species_privileges: ["CANINE"], stat_eligible: false }
              as: PlatformAdmin
              captures: { sp_t: $.data.id }
            - call: "POST /referrals"
              payload: { clinic_id: "${cl_t}", patient_name: "Nico", species: "CANINE", study_kind: "TELERAD", requested_modality: "ULTRASOUND", priority: "ROUTINE", clinical_history: "chronic cough" }
              as: ClinicUser
              as_user_id: "${cl_t}"
              captures: { rf_t: $.data.id }
            - call: "POST /referrals/${rf_t}/accept"
              payload: {}
              as: Scheduler
            - call: "POST /appointments"
              payload: { referral_id: "${rf_t}" }
              as: Scheduler
              captures: { ap_t: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${ap_t}", modality: "ULTRASOUND", body_region: "THORAX" }
              as: ClinicUser
              as_user_id: "${cl_t}"
              captures: { s_t: $.data.id }
            - call: "POST /studies/${s_t}/upload"
              payload: { image_count: 14 }
              as: ClinicUser
              as_user_id: "${cl_t}"
            - call: "POST /studies/${s_t}/qc"
              payload: { qc_result: "ACCEPTED" }
              as: FieldTech
              as_user_id: "${tc_t}"
            - call: "GET /studies/${s_t}"
              payload: {}
              as: Scheduler
              captures: { st_v1: $.data.version }
          trigger:
            - call: "POST /read-assignments"
              payload: { study_id: "${s_t}", specialist_id: "${sp_t}", expected_study_version: "${st_v1}" }
              as: Scheduler
              captures: { ag_1: $.data.id }
            - call: "POST /read-assignments/${ag_1}/decline"
              payload: { decline_reason: "outside subspecialty" }
              as: Specialist
              as_user_id: "${sp_t}"
            - call: "GET /studies/${s_t}"
              payload: {}
              as: Scheduler
              captures: { st_v2: $.data.version, wf_after_decline: $.data.workflow_status }
            - call: "POST /read-assignments"
              payload: { study_id: "${s_t}", specialist_id: "${sp_t}", expected_study_version: "${st_v2}" }
              as: Scheduler
              captures: { ag_2: $.data.id }
            - call: "POST /read-assignments/${ag_2}/accept"
              payload: {}
              as: Specialist
              as_user_id: "${sp_t}"
            - call: "POST /read-assignments/${ag_2}/hand-back"
              payload: { decline_reason: "conflict of interest" }
              as: Specialist
              as_user_id: "${sp_t}"
          assert:
            - "${wf_after_decline} == ACQUIRED"
            - "Study.${s_t}.workflow_status == ACQUIRED"
            - "Study.${s_t}.qc_status == ACCEPTED"
            - "Study.${s_t}.read_attempt_count == 2"
            - "ReadAssignment.${ag_1}.status == DECLINED"
            - "ReadAssignment.${ag_1}.attempt_number == 1"
            - "ReadAssignment.${ag_2}.status == HANDED_BACK"
            - "ReadAssignment.${ag_2}.attempt_number == 2"
            - "Specialist.${sp_t}.open_read_count == 0"
            - "Specialist.${sp_t}.workload_score == 0"

      - name: referral_return_resubmit_revision_loop_twice
        grounds:
          - state_machines.Referral.SUBMITTED_to_RETURNED
          - state_machines.Referral.RETURNED_to_SUBMITTED
          - entities.Referral.fields.return_reason
          - entities.Referral.fields.clinical_history
        distinguishing_aspect: |
          A cycle on a DIFFERENT entity from the study-read cycle: Referral
          traverses SUBMITTED -> RETURNED -> SUBMITTED twice with no cap, and
          only the second resubmitted clinical_history survives, proving the
          loop overwrites rather than appends.
        test_recipe:
          setup:
            - "one ACTIVE clinic and one referral submitted without clinical history"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
