      - name: submit_with_zero_lines_empty_set
        grounds:
          - validations[priority=44]
          - errors.ERR_NO_CERTIFIED_LINES
          - entities.LoanCertification.fields.certified_total_cents
          - state_machines.LoanCertification.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Empty-collection boundary on a third metric (the count of CertificationLine rows) reached
          through a third endpoint (POST /loan-certifications/{id}/submit): a claim with exactly zero
          lines has certified_total_cents 0 and is rejected with ERR_NO_CERTIFIED_LINES, while the
          statutory-space check that would otherwise fire on a zero total is never reached.
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with an EFFECTIVE PlanAmendment."
            - "One Employee with one payroll period of 1000000 cents compensation and 20000 cents deferral, so remaining_qslp_space_cents is 2280000 and the fiscal check would pass."
