              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /program-periods"
              payload: { quarter_code: "2026Q3", start_date: "2026-07-01", end_date: "2026-09-30", operating_cost_cents: 1000 }
              as: ProgramAdmin
            - call: "POST /redemption-centers"
              payload: { site_name: "Bend Redemption Center", x_miles: 0.0, y_miles: 0.0, accepted_materials: ["ALUMINUM", "GLASS", "PET_PLASTIC", "HDPE_PLASTIC"], accepts_all_materials: true, daily_account_cap_containers: 300, opening_cash_cents: 50000 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /redemption-centers/${center_id}/machines"
              payload: { asset_tag: "RVM-1001", accepted_material: "PET_PLASTIC" }
              as: ProgramAdmin
            - call: "POST /redemption-centers/${center_id}/status-changes"
              payload: { action: "ACTIVATE" }
              as: ProgramAdmin
            - call: "POST /redeemer-accounts"
              payload: { holder_name: "Dana Reyes", account_code: "ACCT-1001", bag_drop_enrolled: true }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /bag-drops"
              payload: { account_id: "${acct_id}", center_id: "${center_id}", tag_code: "BAG-1001", declared_count: 150 }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { bag_id: $.data.id, bag_ver: $.data.version }
            - call: "POST /bag-drops/${bag_id}/count-results"
              payload: { counted_quantities: [100, 50], expected_bag_drop_version: "${bag_ver}" }
              as: PlantCounter
            - call: "POST /redeemer-accounts/${acct_id}/status-changes"
              payload: { action: "FLAG", reason: "identity check pending on the drop bags" }
              as: ProgramAdmin
          trigger:
            - call: "POST /bag-drops/${bag_id}/settlement-actions"
              payload: { action: "CREDIT" }
              as: CenterOperator
              as_user_id: "${center_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger response status is 409 and $.data.error_id == ERR_ACCOUNT_FLAGGED"
            - "RedeemerAccount.${acct_id}.status == FLAGGED"
            - "BagDrop.${bag_id}.status == COUNTED"
            - "BagDrop.${bag_id}.counted_total == 150"
            - "BagDrop.${bag_id}.variance_pct == 0"
            - "BagDrop.${bag_id}.variance_flag == false"
            - "BagDrop.${bag_id}.final_credit_cents == 1450"
            - "BagDrop.${bag_id}.adjustment_cents == 250"
            - "BagDrop.${bag_id}.settled_at == null"
            - "RedeemerAccount.${acct_id}.credit_balance_cents == 1200"

  - rule_id: resource_temporal_overlap
    instances:

      - name: machine_session_cooldown_halfopen_window_boundary
        grounds:
          - calculations.machine_session_cooldown
          - validations[priority=27]
          - errors[ERR_MACHINE_COOLDOWN_ACTIVE]
          - state_machines.ReverseVendingMachine.COUNTING_to_IDLE
          - state_machines.ReverseVendingMachine.IDLE_to_COUNTING
        distinguishing_aspect: |
          One machine cannot host two counting sessions whose separation is under five minutes:
          with last_session_closed_at 2026-08-05T09:10:00Z a SESSION_OPEN at 09:14:59 is refused
          with ERR_MACHINE_COOLDOWN_ACTIVE while the same call at exactly 09:15:00 succeeds,
          because the blocked window is half-open at its upper end.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T09:00:00Z; OPERATIONAL center with one PET_PLASTIC machine"
            - "One anonymous CENTER MACHINE_COUNT visit in count_status OPEN naming that machine"
            - "A first counting session opened at 09:00:00Z and closed at 09:10:00Z, so last_session_closed_at is 2026-08-05T09:10:00Z and status is IDLE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /redemption-centers"
