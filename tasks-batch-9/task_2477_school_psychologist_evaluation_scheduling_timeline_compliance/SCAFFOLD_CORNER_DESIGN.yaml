            - "assigned_school_ids: [\"${s1}\"] returns HTTP 201"

  - section: state_machines
    instances:
      - name: consent_event_creates_evaluation_in_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Referral.INTAKE_RECEIVED_to_CONSENTED
          - state_machines.Evaluation.assessment_status.initial_state
          - state_machines.Evaluation.compliance_status.initial_state
          - calculations.evaluation_timeline_clock
        distinguishing_aspect: "The consent event is the only way an Evaluation is born: the new row starts at PENDING_ASSIGNMENT / ON_TRACK with clock_start_date taken from effective_at's UTC date and both dimensions at their declared initial states."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one School; one INITIAL 2-domain referral in INTAKE_RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
              payload: { name: "Larchmont Elementary", building_code: "LM31", grade_band: "ELEMENTARY", concurrent_meeting_capacity: 2, enrollment_count: 410 }
              as: DistrictAdmin
              captures: { s1: $.data.id }
            - call: "POST /psych-services/referrals"
              payload: { school_id: "${s1}", student_local_id: "STU-12", referral_type: "INITIAL", requested_domains: ["COGNITIVE", "ACADEMIC"] }
              as: IntakeCoordinator
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /psych-services/referrals/${r1}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-12" }
              as: IntakeCoordinator
              captures: { eval1: $.data.active_evaluation_id }
          assert:
            - "Referral.${r1}.status == CONSENTED, consent_received_at == \"2026-08-01T09:00:00Z\", last_consent_event_type == CONSENT_RECEIVED, parent_signature_reference == \"SIG-12\""
            - "Evaluation.${eval1}.assessment_status == PENDING_ASSIGNMENT and compliance_status == ON_TRACK (both initial states)"
            - "Evaluation.${eval1}.clock_start_date == \"2026-08-01\", base_due_date == \"2026-09-30\", statutory_due_date == \"2026-09-30\", credited_exclusion_days == 0, elapsed_statutory_days == 0, days_remaining == 60"
            - "Evaluation.${eval1}.caseload_points == 6 (3 base + 1 extra domain + 0 interpreter + 2 INITIAL), psychologist_id == null, reassignment_count == 0, protocol_units_consumed == 0, version == 1"

      - name: protocol_order_approve_then_receive_credits_stock
        claim_type: valid_transition
        grounds:
          - state_machines.ProtocolOrder.SUBMITTED_to_APPROVED
          - state_machines.ProtocolOrder.APPROVED_to_RECEIVED
          - endpoints["POST /psych-services/protocol-orders/{order_id}/receive"]
          - entities.AssessmentInstrument.fields.protocol_stock_count
        distinguishing_aspect: "The manual review branch: an order above the auto-approve threshold needs an explicit DistrictAdmin APPROVE (recording decided_by_user_id, auto_approved staying false) before receipt credits instrument stock."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one AssessmentInstrument with protocol_unit_cost_cents 1799 and protocol_stock_count 0."
            - "One non-rush order for 30 booklets: unit 1709, base 51270, discount 3589, no rush, no handling fee -> total 47681 > 40000, so it lands in SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/assessment-instruments"
              payload: { name: "WIAT-4", instrument_code: "WIAT4", protocol_stock_count: 0, protocol_units_per_administration: 1, protocol_unit_cost_cents: 1799, license_seat_total: 1, license_expires_on: "2027-06-30", supported_language_editions: ["en"] }
              as: DistrictAdmin
              captures: { inst: $.data.id }
            - call: "POST /psych-services/protocol-orders"
              payload: { instrument_id: "${inst}", quantity_requested: 30, rush_flag: false }
              as: PsychServicesSupervisor
              captures: { order1: $.data.id }
            - call: "POST /psych-services/protocol-orders/${order1}/decision"
              payload: { decision: "APPROVE" }
              as: DistrictAdmin
          trigger:
            - call: "POST /psych-services/protocol-orders/${order1}/receive"
              payload: { received_quantity: 30 }
              as: PsychServicesSupervisor
          assert:
            - "Before the trigger ProtocolOrder.${order1}.total_cost_cents == 47681, auto_approved == false, status == APPROVED and decided_by_user_id is the DistrictAdmin's X-User-ID"
            - "After the trigger ProtocolOrder.${order1}.status == RECEIVED and received_quantity == 30"
            - "AssessmentInstrument.${inst}.protocol_stock_count == 30 (credited by exactly received_quantity)"
            - "GET /psych-services/assessment-instruments/${inst}/protocol-orders returns 1 row whose status == RECEIVED"

