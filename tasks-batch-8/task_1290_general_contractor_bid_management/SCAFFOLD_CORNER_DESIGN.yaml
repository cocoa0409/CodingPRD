        distinguishing_aspect: "Leveling writes are gated to package states {BIDDING_CLOSED, TABULATED}: attempts while PUBLISHED and while RECOMMENDATION_PENDING both fail with ERR_LEVELING_LOCKED."
        test_recipe:
