            - "Assignment.${asg_id}.appearance_fee_cents == 20000"

      - name: cancel_cascade_releases_assignment_then_reverts_posture_depth2
        grounds:
          - state_machines.Job.CONFIRMED_to_CANCELLED
          - state_machines.Assignment.ACTIVE_to_RELEASED
          - calculations.compute_staffing_posture
          - entities.Job.fields.staffing_posture
        distinguishing_aspect: |
          Depth-2 chain triggered by cancel (a different trigger than adjourn): (A) Job
          CONFIRMED->CANCELLED, which (B) flips each ACTIVE Assignment to RELEASED, whose
          release in turn recomputes staffing_posture to UNSTAFFED. The release of the
          window is caused by the cancel cascade, not directly issued by the caller.
        test_recipe:
          setup:
            - "A CONFIRMED job (posture READY) with one ACTIVE reporter assignment."
          setup_api_calls:
            - call: "POST /attorneys"
              payload: { full_name: "A Eight", firm_name: "Eight LLP", bar_state: "CA", email: "a8@x.com" }
              as: ScheduleCoordinator
