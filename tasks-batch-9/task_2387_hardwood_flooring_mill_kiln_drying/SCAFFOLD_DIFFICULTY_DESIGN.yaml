            - "GET /mill/byproduct-batches?flooring_lot_id={lot1} returns total_count 3."

  - rule_id: cross_entity_state_dependency
    rule_summary: "Two operations are gated by the state of a different entity: charge loading depends on the chamber state, and prefinish hold release depends on the derived product line posture."
    instances:
      - name: charge_load_blocked_by_chamber_in_maintenance
        summary: "A fully allocated SCHEDULED charge cannot be loaded while its chamber is in MAINTENANCE; after complete_maintenance the same call succeeds."
        mechanism: "Guarded transition: KilnCharge SCHEDULED -> LOADED requires KilnChamber.status == AVAILABLE, a state held on another entity."
        entities_touched: [KilnCharge, KilnChamber, GreenReceipt]
        rules_referenced: [green_board_feet_conservation]
        test_recipe:
          setup: "Charge A on chamber K1 with 5800 accepted board feet allocated; the chamber is then taken into MAINTENANCE."
