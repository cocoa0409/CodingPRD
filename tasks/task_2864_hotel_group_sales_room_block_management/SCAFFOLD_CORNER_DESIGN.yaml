    grounds:
    - response_envelope.error
    - errors[ERR_UNAUTHENTICATED]
    - errors[ERR_UNAUTHORIZED]
    - errors[ERR_ACCOUNT_NOT_FOUND]
    - errors[ERR_INVALID_REQUEST]
    - errors[ERR_LEAD_INVALID_STATE]
    - errors[ERR_INVALID_DATE_RANGE]
