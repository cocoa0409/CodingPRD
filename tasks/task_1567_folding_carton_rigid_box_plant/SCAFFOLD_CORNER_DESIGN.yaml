          - calculations.provisional_quote
        distinguishing_aspect: "billable_quantity 2499 -> 45c (print 112455) vs 2500 -> 38c (print 95000): the tier break at 2500 is inclusive-lower. Both jobs are DIGITAL with provisional subtotals 189295 and 171840."
        test_recipe:
          setup: ["one customer"]
          setup_api_calls:
            - { call: "POST /plant/customers", payload: { name: "Acme", brand_code: "ACM" }, as: PlantAdmin, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 2499, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { r1: $.data.route_type, s1: $.data.provisional_subtotal_cents, t1: $.data.provisional_total_cents } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", quantity_ordered: 2500, blank_w_cin: 900, blank_h_cin: 600, grain_rotation_allowed: true, substrate_code: "SBS18", caliper_pts: 18, finish_coat: false, finish_foil: false, finish_emboss: false, required_ink_slots: [], requires_retail_compliance: false }, as: PlantAdmin, captures: { r2: $.data.route_type, s2: $.data.provisional_subtotal_cents, t2: $.data.provisional_total_cents } }
          assert:
            - "qty 2499: route DIGITAL (${r1}), print line 2499*45=112455 -> subtotal 189295 (${s1})"
            - "qty 2500: route DIGITAL (${r2}), print line 2500*38=95000 -> subtotal 171840 (${s2})"
