          assert:
            - "the first GET returns basis_return_count == 0, avg_monthly_tax_liability_cents == 500000, required_bond_cents == 1500000, posted_bond_cents == 0, bond_deficiency_cents == 1500000"
            - "ReturnSchedule.${s_sch_gas}.total_gallons == 0.00 and line_count == 0, and the filing passes the declared-vs-derived reconciliation because both sides are 0.00"
            - "MonthlyReturn.${s_ret_id}.filing_status == FILED with taxable_gallons_total == 0.00, tax_due_cents == 0, days_late == 0, total_remittance_cents == 0"
