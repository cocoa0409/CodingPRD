  - rule_id: non_linear_state_machine
    instances:

      - name: rep_access_status_cycles_credentialed_suspended_credentialed
        grounds:
          - state_machines.VendorRep.CREDENTIALED_to_SUSPENDED
          - state_machines.VendorRep.SUSPENDED_to_CREDENTIALED
          - state_machines.Credential.VERIFIED_to_EXPIRED
          - calculations.rep_credential_posture
          - entities.VendorRep.fields.suspension_reason
          - entities.VendorRep.fields.reinstated_at_utc
          - entities.VendorRep.fields.ever_credentialed
        distinguishing_aspect: |
          Cyclic re-entry on the VendorRep access_status machine: the rep returns to a state it has
          already occupied (CREDENTIALED -> SUSPENDED -> CREDENTIALED) and the second occupancy is
          NOT identical to the first — ever_credentialed stays true, suspension_reason is cleared back
          to NONE, and reinstated_at_utc is now populated. A linear reading of the machine would
          either refuse the second CREDENTIALED entry or lose suspension_reason.
        test_recipe:
          setup:
            - "Facility LK-05 and Vendor NEUROV exist; rep Priya Nandi holds all four required credentials VERIFIED."
            - "The IMMUNIZATION_INFLUENZA credential expires exactly at 2026-09-01T00:00:00Z; the other three expire 2027-07-01T00:00:00Z."
            - "At the 2026-08-01T00:00:00Z default clock the influenza credential is 31 days out, which is beyond EXPIRY_WARNING_DAYS (14), so credential_posture is COMPLIANT and access_status is CREDENTIALED."
            - "The clock is then moved to exactly 2026-09-01T00:00:00Z and one sweep is run: the influenza credential expires (equality expires), posture becomes LAPSED and the rep is SUSPENDED with suspension_reason CREDENTIAL_LAPSED."
