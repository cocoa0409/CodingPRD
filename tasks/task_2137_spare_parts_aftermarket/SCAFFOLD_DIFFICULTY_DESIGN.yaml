      - name: air_freight_net_benefit_exactly_at_threshold_backorders
        grounds:
          - calculations.emergency_air_freight_decision
          - entities.WorkOrderPartLine.fields.decision_net_benefit_cents
          - endpoints["POST /aftermarket/work-orders/{id}/part-lines"]
        distinguishing_aspect: |
          A third boundary on yet another metric and endpoint: ceil(35.0*2)=70 billable kg give
          an air cost of exactly 150000 against a 250000 downtime cost, so
          decision_net_benefit_cents is exactly 100000 — equal to AIR_APPROVAL_THRESHOLD_CENTS.
          The comparison is strictly greater-than, so the line must BACKORDER and no
          EMERGENCY_AIR order may be created.
        test_recipe:
          setup:
            - "one ACTIVE DESIRABLE price rule with base_uplift_pct 0.35, max_uplift_pct 0.60, min_margin_pct 0.20"
            - "a GOLD dealer, so the PLATINUM + MACHINE_DOWN override branch cannot fire"
