              payload: { market_id: "${mkt}", data_window_id: "${w2}", included_channel_ids: ["${chl}"], control_variables: ["PRICE_INDEX", "MACRO_INDEX"], seasonality_mode: "WEEK_OF_YEAR", carryover_attribution_mode: "EFFECT_PERIOD", holdout_periods: 1 }
              as: Modeler
              as_user_id: "md-1"
              captures: { run2: "$.data.id" }
          trigger:
            - call: "POST /mmm/model-runs/${run1}/fit"
              as: Modeler
              as_user_id: "md-1"
            - call: "POST /mmm/model-runs/${run2}/fit"
              as: Modeler
              as_user_id: "md-1"
          assert:
            - "Call 1 returns 422 with data.error_id == ERR_NO_SPEND_OBSERVATIONS - the priority-56 referential rule wins even though the priority-70 lag rule is violated by the very same window."
            - "Call 1 does NOT return ERR_LAG_WINDOW_INCOMPLETE and does NOT return ERR_DATA_WINDOW_NOT_SEALED (W1 is SEALED)."
            - "Call 2 returns 422 with data.error_id == ERR_LAG_WINDOW_INCOMPLETE - W2 satisfies rule 56 with four spend rows, so the lower-priority rule finally surfaces."
            - "Both runs are unchanged after their failed fits: GET /mmm/model-runs/${run1} and GET /mmm/model-runs/${run2} both show fit_status == PENDING and version == 1."
            - "GET /mmm/channel-contributions?model_run_id=${run1} and the same query for ${run2} both return total_count == 0."
            - "The two calls differ only in which window they target, which is what makes the priority ordering falsifiable rather than an artefact of one missing implementation."
      - name: period_alignment_half_open_versus_closed_window_interval
        claim_type: temporal_validation
        grounds:
          - "validations priority 68 (business_temporal) - period_start_date lies inside the HALF-OPEN range [window_start_date, window_end_date) and is aligned to the granularity grid, else ERR_PERIOD_NOT_ALIGNED (422)"
          - "validations priority 68 note - the deliberate contrast with priority 66, which uses the CLOSED range for window-versus-window conflict detection"
          - "validations priority 66 (business_temporal) - ERR_DATA_WINDOW_OVERLAP (409); a window occupies the CLOSED interval and granularity is part of the conflict key"
        distinguishing_aspect: |
          The exclusive end date 2026-08-31 is simultaneously OUTSIDE the half-open period range (an
          observation there is ERR_PERIOD_NOT_ALIGNED) and INSIDE the closed conflict interval (a WEEKLY
          window starting there is ERR_DATA_WINDOW_OVERLAP), and both facts must hold at once - so an
          implementation that uses one interval convention for both rules fails one of the two halves.
          
        test_recipe:
          setup:
            - "Market US_CORE with one WEEKLY window W1 [2026-08-03, 2026-08-31), expected_period_count 4 and grid dates 2026-08-03, 08-10, 08-17, 08-24."
            - "Channel A_SEARCH exists so spend rows can be attempted as well as sales rows."
            - "The window version is read once so the two spend attempts can carry a well-formed expected_data_window_version and fail on the period rule rather than on optimistic concurrency."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
