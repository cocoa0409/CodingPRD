  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: climate_windows_use_half_open_intervals_keyed_by_zone_and_regime
        grounds:
          - validations[priority=29]
          - state_machines.ClimateStrategy.ACTIVE_to_SUPERSEDED
          - entities.ClimateStrategy.fields.regime
          - concurrency_rules[climate-strategy-create-stale-zone]
          - errors[ERR_CLIMATE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics are HALF-OPEN [window_start, window_end) and the resource key is the pair
          (Zone, regime). Touching at a shared endpoint is therefore legal, a one-hour genuine overlap on
          the same regime is rejected, and the same overlapping clock times on the other regime are legal
          because NIGHT is a different occupancy track from DAY.
        test_recipe:
          setup:
            - "Clock at 2026-08-06T00:00:00Z and one zone with a thermal screen, supplemental lighting and a CHP tie."
            - "One ACTIVE DAY strategy occupying 2026-08-07T06:00 to 2026-08-07T18:00."
            - "Zone.version is re-read immediately before every create because each accepted strategy bumps it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZA-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zone_a: $.data.id, zv0: $.data.version }
            - call: "POST /climate-strategies"
              payload: { zone_id: "${zone_a}", regime: "DAY", window_start: "2026-08-07T06:00:00Z", window_end: "2026-08-07T18:00:00Z", temp_setpoint_c: 21.5, rh_setpoint_pct: 78, co2_setpoint_ppm: 900, lighting_hours: 6, screen_position_pct: 40, expected_zone_version: "${zv0}" }
              as: GrowerManager
              captures: { s1: $.data.id, s1_status: $.data.status }
            - call: "GET /zones/${zone_a}"
              as: GrowerManager
              captures: { zv1: $.data.version }
          trigger:
            - call: "POST /climate-strategies"
              payload: { zone_id: "${zone_a}", regime: "DAY", window_start: "2026-08-07T18:00:00Z", window_end: "2026-08-08T02:00:00Z", temp_setpoint_c: 18.0, rh_setpoint_pct: 82, co2_setpoint_ppm: 420, lighting_hours: 4, screen_position_pct: 80, expected_zone_version: "${zv1}" }
              as: GrowerManager
              captures: { s2: $.data.id, s2_status: $.data.status }
            - call: "GET /zones/${zone_a}"
              as: GrowerManager
              captures: { zv2: $.data.version }
            - call: "POST /climate-strategies"
              payload: { zone_id: "${zone_a}", regime: "DAY", window_start: "2026-08-07T17:00:00Z", window_end: "2026-08-07T23:00:00Z", temp_setpoint_c: 20.0, rh_setpoint_pct: 80, co2_setpoint_ppm: 600, lighting_hours: 4, screen_position_pct: 50, expected_zone_version: "${zv2}" }
              as: GrowerManager
              captures: { err_overlap: $.data.error_id }
            - call: "POST /climate-strategies"
              payload: { zone_id: "${zone_a}", regime: "NIGHT", window_start: "2026-08-07T17:00:00Z", window_end: "2026-08-07T23:00:00Z", temp_setpoint_c: 17.5, rh_setpoint_pct: 85, co2_setpoint_ppm: 420, lighting_hours: 0, screen_position_pct: 100, expected_zone_version: "${zv2}" }
              as: GrowerManager
              captures: { s4: $.data.id, s4_status: $.data.status }
          assert:
            - "${s1_status} == ACTIVE"
            - "${s2_status} == ACTIVE"
            - "the S2 window starts exactly where S1 ends, and a half-open interval makes that adjacency a non-overlap"
            - "${err_overlap} == ERR_CLIMATE_WINDOW_OVERLAP"
            - "the S3 create returns HTTP 409 because 17:00-18:00 is a positive-duration intersection with S1 on the same regime"
            - "${s4_status} == ACTIVE"
            - "the S4 create succeeds on the identical clock times because (Zone, NIGHT) is a different resource from (Zone, DAY)"
            - "ClimateStrategy.${s1}.status == ACTIVE"
            - "ClimateStrategy.${s2}.status == ACTIVE"
            - "ClimateStrategy.${s4}.status == ACTIVE"
            - "exactly three ClimateStrategy rows exist on Zone ${zone_a}"
            - "Zone.${zone_a}.version == ${zv2} + 1"

      - name: worker_double_booking_uses_a_closed_window_widened_by_the_travel_buffer
        grounds:
          - validations[priority=30]
          - domain_constants.WORKER_BUFFER_MINUTES
          - calculations.labor_standard_cost.variants.planned
          - entities.Worker.fields.committed_hours
          - errors[ERR_WORKER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Different interval semantics on a different resource entity: the resource is a Worker, not a
          (Zone, regime) pair, and the test is a CLOSED window widened by WORKER_BUFFER_MINUTES 30 on both
          sides with a positive-duration overlap requirement. A task starting 20 minutes after the first
          one ends is rejected, while one starting exactly 30 minutes after - touching the widened
          endpoint - is accepted.
        test_recipe:
          setup:
            - "Clock at 2026-08-06T00:00:00Z, one zone with a 20000.00 USD labor budget, one crop cycle in TRANSPLANTED."
            - "One ACTIVE HARVEST worker at 19.50 USD/h with productivity_index 1.05."
            - "One SCHEDULED task T_a occupying 2026-08-07T07:00 to 2026-08-07T11:00, so the buffered window is 06:30 to 11:30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZA-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zone_a: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { var_tom: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zone_a}", variety_id: "${var_tom}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cyc_a: $.data.id }
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /workers"
              payload: { full_name: "Hana Ito", skill: "HARVEST", hourly_rate_usd: 19.50, productivity_index: 1.05, status: "ACTIVE" }
              as: GrowerManager
              captures: { w_harv: $.data.id }
            - call: "POST /labor-tasks"
              payload: { zone_id: "${zone_a}", crop_cycle_id: "${cyc_a}", worker_id: "${w_harv}", task_type: "HARVEST", window_start: "2026-08-07T07:00:00Z", window_end: "2026-08-07T11:00:00Z", planned_units: 2000, standard_units_per_hour: 520 }
              as: GrowerManager
              captures: { task_a: $.data.id, task_a_hours: $.data.planned_hours, task_a_cost: $.data.planned_cost_usd }
          trigger:
            - call: "POST /labor-tasks"
              payload: { zone_id: "${zone_a}", crop_cycle_id: "${cyc_a}", worker_id: "${w_harv}", task_type: "HARVEST", window_start: "2026-08-07T11:20:00Z", window_end: "2026-08-07T15:00:00Z", planned_units: 2000, standard_units_per_hour: 520 }
              as: GrowerManager
              captures: { err_double: $.data.error_id }
            - call: "POST /labor-tasks"
              payload: { zone_id: "${zone_a}", crop_cycle_id: "${cyc_a}", worker_id: "${w_harv}", task_type: "HARVEST", window_start: "2026-08-07T11:30:00Z", window_end: "2026-08-07T15:00:00Z", planned_units: 2000, standard_units_per_hour: 520 }
              as: GrowerManager
              captures: { task_c: $.data.id, task_c_hours: $.data.planned_hours, task_c_cost: $.data.planned_cost_usd }
          assert:
            - "${task_a_hours} == 3.66"
            - "${task_a_cost} == 71.37"
            - "${err_double} == ERR_WORKER_DOUBLE_BOOKED"
            - "the 11:20 create returns HTTP 409 because 11:20 falls strictly inside T_a's buffered window ending 11:30"
            - "${task_c_hours} == 3.66"
            - "${task_c_cost} == 71.37"
            - "the 11:30 create succeeds because touching the widened endpoint is a zero-duration intersection, not a conflict"
            - "LaborTask.${task_a}.status == SCHEDULED"
            - "LaborTask.${task_c}.status == SCHEDULED"
            - "Worker.${w_harv}.committed_hours == 7.32"
            - "Zone.${zone_a}.labor_budget_committed_usd == 142.74"
            - "Zone.${zone_a}.labor_budget_remaining_usd == 19857.26"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: zone_labor_budget_money_is_conserved_across_task_create_and_cancel
        grounds:
          - state_machines.LaborTask.SCHEDULED_to_CANCELLED
          - calculations.labor_standard_cost.variants.planned
          - entities.Zone.fields.labor_budget_committed_usd
          - entities.Zone.fields.labor_budget_remaining_usd
          - entities.Worker.fields.committed_hours
        distinguishing_aspect: |
          Conserved quantity is MONEY: labor_budget_committed_usd + labor_budget_remaining_usd must equal
          the zone's 20000.00 USD labor_budget_usd at every point in the chain, and cancelling the task
          must return exactly 149.96 - not a recomputed or re-rounded amount - so no cent drifts.
        test_recipe:
          setup:
            - "Clock at 2026-08-06T00:00:00Z, one zone with labor_budget_usd 20000.00, one crop cycle in TRANSPLANTED."
            - "One ACTIVE HARVEST worker at 19.50 USD/h with productivity_index 1.05."
            - "One SCHEDULED task for 4200 units at a 520 units/hour standard, so planned_cost_usd is 149.96 and planned_hours is 7.69."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZA-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zone_a: $.data.id, budget_at_birth: $.data.labor_budget_remaining_usd }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { var_tom: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zone_a}", variety_id: "${var_tom}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cyc_a: $.data.id }
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /workers"
              payload: { full_name: "Hana Ito", skill: "HARVEST", hourly_rate_usd: 19.50, productivity_index: 1.05, status: "ACTIVE" }
              as: GrowerManager
              captures: { w_harv: $.data.id }
            - call: "POST /labor-tasks"
              payload: { zone_id: "${zone_a}", crop_cycle_id: "${cyc_a}", worker_id: "${w_harv}", task_type: "HARVEST", window_start: "2026-08-07T07:00:00Z", window_end: "2026-08-07T16:00:00Z", planned_units: 4200, standard_units_per_hour: 520 }
              as: GrowerManager
              captures: { task_m: $.data.id, task_m_cost: $.data.planned_cost_usd }
            - call: "GET /zones/${zone_a}"
              as: GrowerManager
              captures: { committed_mid: $.data.labor_budget_committed_usd, remaining_mid: $.data.labor_budget_remaining_usd }
            - call: "GET /workers/${w_harv}"
              as: GrowerManager
              captures: { worker_hours_mid: $.data.committed_hours }
          trigger:
            - call: "POST /labor-tasks/${task_m}/transitions"
              payload: { to_status: "CANCELLED", cancel_reason: "WEATHER" }
              as: GrowerManager
          assert:
            - "${budget_at_birth} == 20000.00"
            - "${task_m_cost} == 149.96"
            - "${committed_mid} == 149.96"
            - "${remaining_mid} == 19850.04"
            - "${committed_mid} + ${remaining_mid} == 20000.00"
            - "${worker_hours_mid} == 7.69"
            - "LaborTask.${task_m}.status == CANCELLED"
            - "LaborTask.${task_m}.cancel_reason == WEATHER"
            - "Zone.${zone_a}.labor_budget_committed_usd == 0.00"
            - "Zone.${zone_a}.labor_budget_remaining_usd == 20000.00"
            - "Zone.${zone_a}.labor_budget_committed_usd + Zone.${zone_a}.labor_budget_remaining_usd == 20000.00"
            - "Worker.${w_harv}.committed_hours == 0.00"

      - name: harvest_lot_graded_pounds_are_conserved_across_allocate_and_revoke
        grounds:
          - state_machines.LotAllocation.PROVISIONAL_to_REVOKED
          - calculations.commitment_waterfall_allocation
          - calculations.commitment_payout.variants.provisional
          - entities.HarvestLot.fields.available_a_lbs
          - entities.RetailProgram.fields.at_risk_week_count
        distinguishing_aspect: |
          Conserved quantity is MASS, not money: allocated_a_lbs + available_a_lbs must always equal the
          lot's graded grade_a_lbs of 1200.00, and revoking the allocation must hand back exactly the
          1000.00 pounds it took while the week's advisory penalty rolls back to its pre-run value.
        test_recipe:
          setup:
            - "Clock at 2026-08-31T06:00:00Z, one zone, one crop cycle in PRODUCTION."
            - "One ACTIVE A_ONLY program committing 1000.00 lbs with a 0.40 USD/lb shortfall penalty, and one OPEN 2026-W36 week starting 2026-08-31."
            - "One 2000.00 lb lot harvested 2026-08-31, GRADED at 1200 / 700 / 100 and COLD_HELD."
            - "One allocation run has moved 1000.00 A pounds into a PROVISIONAL allocation and the week to ALLOCATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZA-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zone_a: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { var_tom: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zone_a}", variety_id: "${var_tom}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cyc_a: $.data.id }
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T06:00:00Z" }
              as: GrowerManager
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "PRODUCTION" }
              as: GrowerManager
            - call: "POST /workers"
              payload: { full_name: "Hana Ito", skill: "HARVEST", hourly_rate_usd: 19.50, productivity_index: 1.05, status: "ACTIVE" }
              as: GrowerManager
              captures: { w_harv: $.data.id }
            - call: "POST /retail-programs"
              payload: { retailer_name: "Northline Grocers", program_code: "NL-TOV-A", grade_spec: "A_ONLY", weekly_commitment_lbs: 1000.00, price_per_lb_usd: 1.85, shortfall_penalty_per_lb_usd: 0.40, priority_rank: 1, status: "ACTIVE" }
              as: GrowerManager
              captures: { prog_m: $.data.id, at_risk_at_birth: $.data.at_risk_week_count }
            - call: "POST /commitment-weeks"
              payload: { program_id: "${prog_m}", iso_week: "2026-W36", week_start_date: "2026-08-31" }
              as: GrowerManager
              captures: { wk_m: $.data.id, penalty_before_run: $.data.provisional_penalty_usd }
            - call: "POST /harvest-lots"
              payload: { crop_cycle_id: "${cyc_a}", harvest_date: "2026-08-31", gross_weight_lbs: 2000.00 }
              as: HarvestSupervisor
              as_user_id: "${w_harv}"
              captures: { lot_m: $.data.id }
            - call: "POST /harvest-lots/${lot_m}/grade"
              payload: { grade_a_lbs: 1200.00, grade_b_lbs: 700.00, cull_lbs: 100.00 }
              as: HarvestSupervisor
              as_user_id: "${w_harv}"
              captures: { avail_a_after_grade: $.data.available_a_lbs }
            - call: "POST /harvest-lots/${lot_m}/cold-chain-events"
              payload: { to_status: "PRECOOLED", pulp_temp_c: 10.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /harvest-lots/${lot_m}/cold-chain-events"
              payload: { to_status: "COLD_HELD", pulp_temp_c: 6.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /allocation-runs"
              payload: { week_start_date: "2026-08-31" }
              as: GrowerManager
              captures: { wk_m_status_after_run: "$.data[0].status", wk_m_alloc_after_run: "$.data[0].allocated_lbs" }
            - call: "GET /lot-allocations"
              payload: { lot_id: "${lot_m}", commitment_week_id: "${wk_m}" }
              as: GrowerManager
              captures: { alloc_m: "$.data[0].id", alloc_m_lbs: "$.data[0].allocated_lbs" }
            - call: "GET /harvest-lots/${lot_m}"
              as: GrowerManager
              captures: { allocated_a_mid: $.data.allocated_a_lbs, available_a_mid: $.data.available_a_lbs }
          trigger:
            - call: "POST /lot-allocations/${alloc_m}/transitions"
              payload: { to_status: "REVOKED", revoked_reason: "QUALITY_HOLD" }
              as: GrowerManager
          assert:
            - "${at_risk_at_birth} == 0"
            - "${penalty_before_run} == 400.00"
            - "${avail_a_after_grade} == 1200.00"
            - "${wk_m_status_after_run} == ALLOCATED"
            - "${wk_m_alloc_after_run} == 1000.00"
            - "${alloc_m_lbs} == 1000.00"
            - "${allocated_a_mid} == 1000.00"
            - "${available_a_mid} == 200.00"
            - "${allocated_a_mid} + ${available_a_mid} == 1200.00"
            - "LotAllocation.${alloc_m}.status == REVOKED"
            - "LotAllocation.${alloc_m}.revoked_reason == QUALITY_HOLD"
            - "HarvestLot.${lot_m}.allocated_a_lbs == 0.00"
            - "HarvestLot.${lot_m}.available_a_lbs == 1200.00"
            - "HarvestLot.${lot_m}.allocated_a_lbs + HarvestLot.${lot_m}.available_a_lbs == 1200.00"
            - "HarvestLot.${lot_m}.grade_a_lbs == 1200.00"
            - "CommitmentWeek.${wk_m}.status == OPEN"
            - "CommitmentWeek.${wk_m}.allocated_lbs == 0.00"
            - "CommitmentWeek.${wk_m}.fill_rate_pct == 0.00"
            - "CommitmentWeek.${wk_m}.provisional_shortfall_lbs == 1000.00"
            - "CommitmentWeek.${wk_m}.provisional_penalty_usd == 400.00"
