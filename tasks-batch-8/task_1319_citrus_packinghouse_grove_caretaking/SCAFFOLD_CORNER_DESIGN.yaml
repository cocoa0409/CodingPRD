      - name: grower_terminate_blocked_with_open_balance
        claim_type: violation_to_error
        grounds: [state_machines.Grower.ACTIVE_to_TERMINATED, "errors[ERR_GROWER_NOT_ACTIVE]"]
        distinguishing_aspect: "Terminate requires zero caretaking balance; after payoff it succeeds and cancels the grower's SCHEDULED caretaking orders as a side effect."
        test_recipe:
          setup: ["Grower with ISSUED invoice (20000) and a second SCHEDULED MOW order"]
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-ER8", display_name: "Terminate Groves" }, as: PackinghouseAdmin, captures: { er8_g: "$.data.id" } }
