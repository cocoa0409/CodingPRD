      - name: certificate_expiry_sweep_and_reinstate_block
        claim_type: Violation to Error
        grounds: [state_machines.Certificate.SUSPENDED_to_ACTIVE, "errors[ERR_CERTIFICATE_EXPIRED]"]
        distinguishing_aspect: "After the clock passes expires_at, reinstating a SUSPENDED certificate is 422 ERR_CERTIFICATE_EXPIRED, and the next read flips the stored status to EXPIRED via the lazy sweep (terminal)."
        test_recipe:
          setup: "Certificate issued 2026-09-01 (expires 2028-08-31), suspended at once; clock advanced to 2028-09-01."
          setup_api_calls:
            - *k_clock
            - *k_sys
            - *k_lab
            - *k_camp
            - *k_begin
            - *k_certify
            - *k_getcert
            - call: "POST /evote/certificates/${cert_id}/transitions"
              payload: { to_state: "SUSPENDED", reason: "review" }
              as: CertificationAuthority
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /evote/certificates/${cert_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: CertificationAuthority
              captures: { err: $.data.error_id }
            - call: "GET /evote/certificates/${cert_id}"
              payload: {}
              as: CertificationAuthority
              captures: { cstat: $.data.status }
          assert:
            - "reinstate past expiry: 422 ERR_CERTIFICATE_EXPIRED"
            - "the following read reports status == EXPIRED (lazy sweep flips and locks the row)"

