        distinguishing_aspect: "Finalizing statement S2 with a contract version captured before S1's finalize (which bumped contract.version) is rejected 412 ERR_STALE_CONTRACT_VERSION; the §1.8 chains only exercise the OCC happy path."
        test_recipe:
          setup: ["A contract with two CLOSED periods seq1 and seq2 each with a DRAFT statement; finalize seq1 first to bump contract.version, making the seq2 client's earlier-read version stale."]
