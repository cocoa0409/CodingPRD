  - rule_id: boundary_precision_check
    instances:
      - name: letters_exactly_three_with_decline_passes
        grounds:
          - calculations.usable_letter_count
          - state_machines.TenureCase.EXTERNAL_REVIEW_to_DEPT_COMMITTEE
        distinguishing_aspect: |
          Boundary on the usable-letter COUNT metric via close-solicitation:
          of 4 invitations exactly 3 reach LETTER_RECEIVED (1 DECLINED never
          counts); 3 >= MIN_EXTERNAL_LETTERS passes — one fewer letter would
          fail with ERR_INSUFFICIENT_EXTERNAL_LETTERS.
        test_recipe:
          setup:
            - "Case in EXTERNAL_REVIEW with 4 invitations: 3 LETTER_RECEIVED, 1 DECLINED; completed SATISFACTORY midterm; eligible DEPARTMENT committee exists"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/candidates", payload: { full_name: "Cand L", employee_id: "E1300", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_l: $.data.id } }
