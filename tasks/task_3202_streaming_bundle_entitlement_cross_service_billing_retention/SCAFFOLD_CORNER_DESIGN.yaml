# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Streaming Bundle Entitlement, Cross-Service Billing & Retention
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: register_account_missing_email_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.SubscriberAccount.fields.email
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /streaming/subscriber-accounts without email is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /streaming/subscriber-accounts"
              payload: { full_name: "No Email" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: register_account_duplicate_email_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=28]
          - errors[ERR_DUPLICATE_EMAIL]
        distinguishing_aspect: "Second registration with the same email is rejected ERR_DUPLICATE_EMAIL (409); email uniqueness is global."
        test_recipe:
          setup: ["one account with email dup@x.com exists"]
          setup_api_calls:
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "dup@x.com", full_name: "First" }
              as: Anonymous
          trigger:
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "dup@x.com", full_name: "Second" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_EMAIL"

      - name: system_fields_id_and_version_server_generated
        claim_type: system_fields
        grounds:
          - entities.SubscriberAccount
        distinguishing_aspect: "Client-supplied id/created_at/version inputs are ignored; server mints id (UUID), created_at == logical clock default 2026-09-01T00:00:00Z, version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "sys@x.com", full_name: "Sys Fields" }
              as: Anonymous
              captures: { sa_id: $.data.id, sa_created: $.data.created_at, sa_v: $.data.version }
          assert:
            - "sa_id is a server-minted UUID (not client supplied)"
            - "sa_created == 2026-09-01T00:00:00Z (logical clock default)"
            - "sa_v == 1"

      - name: account_defaults_credit_and_counts_zero
        claim_type: defaults
        grounds:
          - entities.SubscriberAccount.fields.account_credit_cents
          - entities.SubscriberAccount.fields.retention_redemption_count
        distinguishing_aspect: "Fresh account has account_credit_cents == 0, retention_redemption_count == 0, grandfathered fields null, account_status == ACTIVE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "def@x.com", full_name: "Defaults" }
              as: Anonymous
              captures: { sa_id: $.data.id }
          assert:
            - "SubscriberAccount.${sa_id}.account_credit_cents == 0"
            - "SubscriberAccount.${sa_id}.retention_redemption_count == 0"
            - "SubscriberAccount.${sa_id}.grandfathered_price_cents == null"
            - "SubscriberAccount.${sa_id}.account_status == ACTIVE"

      - name: profile_kids_mode_forces_cap_computed
        claim_type: computed_fields
        grounds:
          - entities.ServiceProfile.fields.maturity_rating_cap
          - entities.ServiceProfile.fields.kids_mode
        distinguishing_aspect: "Creating a profile with kids_mode=true and maturity_rating_cap=TV_MA stores the cap as TV_PG (input overridden by kids_mode rule)."
        test_recipe:
          setup: ["subscriber exists"]
          setup_api_calls:
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "kids@x.com", full_name: "Kids" }
              as: Anonymous
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS", kids_mode: true, maturity_rating_cap: "TV_MA" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_id: $.data.id }
          assert:
            - "ServiceProfile.${prof_id}.maturity_rating_cap == TV_PG"
            - "ServiceProfile.${prof_id}.kids_mode == true"

      - name: watchlist_count_derived_field_reconciliation
        claim_type: computed_fields
        grounds:
          - entities.ServiceProfile.fields.watchlist_count
          - endpoints.DELETE_watchlist_item
        distinguishing_aspect: "watchlist_count tracks add (+1) and remove (-1): after two adds and one remove it reads exactly 1."
        test_recipe:
          setup: ["subscriber with LINKED DPLUS profile (default cap TV_MA)"]
          setup_api_calls:
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "wl@x.com", full_name: "WL" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /streaming/service-profiles/${prof_id}/watchlist-items"
              payload: { title_id: "t1", title_maturity: "TV_G" }
              as: Subscriber
              as_user_id: "${sa_id}"
            - call: "POST /streaming/service-profiles/${prof_id}/watchlist-items"
              payload: { title_id: "t2", title_maturity: "TV_MA" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { item2: $.data.id }
            - call: "DELETE /streaming/service-profiles/${prof_id}/watchlist-items/${item2}"
              as: Subscriber
              as_user_id: "${sa_id}"
          trigger:
            - call: "GET /streaming/service-profiles/${prof_id}"
              as: Subscriber
              as_user_id: "${sa_id}"
          assert:
            - "ServiceProfile.${prof_id}.watchlist_count == 1"

      - name: plan_immutability_no_version_field
        claim_type: immutability
        grounds:
          - entities.Plan
        distinguishing_aspect: "Plan carries common_fields: false: the GET response exposes id and created_at but NO version or updated_at field, and the plan is unchanged by unrelated mutations elsewhere."
        test_recipe:
          setup: ["one plan exists; an unrelated subscriber registers (a mutation that must not touch the plan)"]
          setup_api_calls:
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "im1@x.com", full_name: "IM One" }
              as: Anonymous
          trigger:
            - call: "GET /streaming/plans/DPLUS_ADS"
              as: PlatformAdmin
          assert:
            - "response data has id and created_at fields"
            - "response data has NO version field and NO updated_at field"
            - "Plan.monthly_price_cents == 799 (unchanged by unrelated account creation)"

      - name: get_account_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET with a well-formed but non-existent account UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB except a PlatformAdmin caller"]
          setup_api_calls: []
          trigger:
            - call: "GET /streaming/subscriber-accounts/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: list_plans_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints.GET_plans
        distinguishing_aspect: "GET /streaming/plans returns envelope with response_type array and pagination fields limit/offset/total_count/has_more with defaults 10/0; after creating 3 plans total_count == 3."
        test_recipe:
          setup: ["three plans created"]
          setup_api_calls:
            - call: "POST /streaming/plans"
              payload: { plan_code: "P1", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "P2", plan_kind: "STANDALONE", service_scope: ["HULU"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 899, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "P3", plan_kind: "BUNDLE", service_scope: ["DPLUS", "HULU"], ad_tier: "AD_FREE", monthly_price_cents: 1999, component_weights: { DPLUS: 0.5, HULU: 0.5 }, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
          trigger:
            - call: "GET /streaming/plans"
              as: PlatformAdmin
          assert:
            - "response envelope contains meta.api_request_id and response_type == array"
            - "data has total_count == 3, limit == 10, offset == 0, has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: subscription_initial_state_pending_then_active
        claim_type: initial_state
        grounds:
          - state_machines.Subscription.lifecycle_status
          - state_machines.Entitlement.PROVISIONING_to_ACTIVE
        distinguishing_aspect: "Synchronous provisioning means the create response already shows lifecycle_status == ACTIVE (PENDING_ENTITLEMENT is transient); observable initial terminal-state bubble."
        test_recipe:
          setup: ["plans, account, billing account, DPLUS profile"]
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "sm1@x.com", full_name: "SM One" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
          trigger:
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id, sub_status: $.data.lifecycle_status }
          assert:
            - "create response lifecycle_status == ACTIVE"
            - "GET /streaming/subscriptions/${sub_id}/entitlements shows 1 entitlement ACTIVE"

      - name: cancel_terminal_subscription_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Subscription.lifecycle_status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From terminal CANCELLED, every further transition trigger fails; cancel of an already-CANCELLED subscription returns 409 ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["subscription created and cancelled with immediate_effect; clock advanced one day so finalize fired"]
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "sm2@x.com", full_name: "SM Two" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/subscriptions/${sub_id}/cancel"
              payload: { immediate_effect: true }
              as: Subscriber
              as_user_id: "${sa_id}"
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /streaming/subscriptions/${sub_id}/cancel"
              payload: { immediate_effect: true }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Subscription.${sub_id}.lifecycle_status == CANCELLED (unchanged)"

      - name: double_cancel_idempotency_second_fails
        claim_type: idempotency
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCEL_SCHEDULED
        distinguishing_aspect: "Repeating the same cancel trigger: first returns 200 CANCEL_SCHEDULED; the identical second call fails 409 ERR_INVALID_STATE — no silent no-op."
        test_recipe:
          setup: ["ACTIVE subscription"]
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "sm3@x.com", full_name: "SM Three" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/subscriptions/${sub_id}/cancel"
              payload: { immediate_effect: false }
              as: Subscriber
              as_user_id: "${sa_id}"
          trigger:
            - call: "POST /streaming/subscriptions/${sub_id}/cancel"
              payload: { immediate_effect: false }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Subscription.${sub_id}.lifecycle_status == CANCEL_SCHEDULED (unchanged)"

      - name: rescind_after_finalization_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - validations[priority=13]
          - state_machines.Subscription.CANCEL_SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Clock-set at/after cancel_effective_at finalizes first (CANCEL_SCHEDULED -> CANCELLED); the subsequent rescind hits the state check and returns 409 ERR_INVALID_STATE — terminal lockdown of the rescind window."
        test_recipe:
          setup: ["subscription cancelled at period end (cancel_effective_at 2026-10-01); clock set to exactly 2026-10-01"]
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "sm4@x.com", full_name: "SM Four" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/subscriptions/${sub_id}/cancel"
              payload: { immediate_effect: false }
              as: Subscriber
              as_user_id: "${sa_id}"
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /streaming/subscriptions/${sub_id}/rescind-cancellation"
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Subscription.${sub_id}.lifecycle_status == CANCELLED"
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: migration_void_terminal_then_confirm_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Migration.migration_status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Migration VOIDED is terminal; confirming a voided migration returns 409 ERR_INVALID_STATE (OCC would pass — state check precedes it per priority 6 < 24)."
        test_recipe:
          setup: ["standalone subscription, bundle plan, migration quoted then voided"]
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DUO_PREMIUM", plan_kind: "BUNDLE", service_scope: ["DPLUS", "HULU"], ad_tier: "AD_FREE", monthly_price_cents: 1999, component_weights: { DPLUS: 0.45, HULU: 0.55 }, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "sm5@x.com", full_name: "SM Five" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /streaming/migrations"
              payload: { from_subscription_id: "${sub_id}", target_plan_code: "DUO_PREMIUM" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { mig_id: $.data.id, mig_v: $.data.version }
            - call: "POST /streaming/migrations/${mig_id}/void"
              as: Subscriber
              as_user_id: "${sa_id}"
          trigger:
            - call: "POST /streaming/migrations/${mig_id}/confirm"
              payload: { expected_migration_version: "${mig_v}" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: invoice_retry_on_paid_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Invoice.FAILED_to_PAID
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "retry-payment requires invoice_status == FAILED; retrying an already-PAID invoice returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["subscription created; its INITIAL invoice is PAID"]
          setup_api_calls:
            - call: "POST /streaming/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /streaming/plans"
              payload: { plan_code: "DPLUS_ADS", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
              as: PlatformAdmin
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "sm6@x.com", full_name: "SM Six" }
              as: Anonymous
              captures: { sa_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/billing-accounts"
              payload: { biller_type: "PLATFORM", biller_reference: "platform" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { ba_id: $.data.id }
            - call: "POST /streaming/subscriber-accounts/${sa_id}/service-profiles"
              payload: { service: "DPLUS" }
              as: Subscriber
              as_user_id: "${sa_id}"
              captures: { prof_dplus: $.data.id }
            - call: "POST /streaming/subscriptions"
              payload: { subscriber_account_id: "${sa_id}", billing_account_id: "${ba_id}", plan_code: "DPLUS_ADS", dplus_service_profile_id: "${prof_dplus}" }
              as: Subscriber
              as_user_id: "${sa_id}"
