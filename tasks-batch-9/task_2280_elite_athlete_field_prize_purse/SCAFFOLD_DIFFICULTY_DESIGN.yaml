  # ===========================================================================
  # RULE 8 — resource_temporal_overlap (3 instances; different interval
  #          semantics AND different resource entities)
  # ===========================================================================

  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_fluid_station_closed_integer_interval_with_adjacency_buffer
        grounds:
          - calculations.fluid_slot_occupancy
          - errors.ERR_FLUID_SLOT_CONFLICT
          - entities.FluidStationSlot.fields.table_position
          - validations[priority=14]
        distinguishing_aspect: >-
          Resource: table positions on one FluidStationSlot table, with CLOSED INTEGER intervals
          [table_position, table_position + bottle_count - 1] plus an ADJACENCY_BUFFER of 1, so a
          touching neighbour is ILLEGAL and exactly one free position must separate two slots — [3,4]
          blocks [5,6] but permits [6,7]. Falsifiable in one sentence: an implementation using bare
          closed-interval intersection accepts [5,6], and one using half-open arithmetic accepts [5,6]
          as well; only the buffered rule rejects [5,6] and accepts [6,7].
        test_recipe:
          setup: >-
            Edition FIELD_OPEN. Three ACCEPTED, bibbed ELITE MALE athletes. Athlete A holds a slot at
            station_km 10.0 covering positions 3..4 (table_position 3, bottle_count 2).
