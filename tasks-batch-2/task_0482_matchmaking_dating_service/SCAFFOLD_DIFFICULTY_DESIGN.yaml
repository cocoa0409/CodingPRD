              payload: { coach_user_id: "coach-1", start_at: "2026-06-10T20:20:00Z", end_at: "2026-06-10T21:00:00Z" }
              as: Matchmaker
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COACHING_BUFFER_CONFLICT"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: decline_refunds_guarantee_pool_conserved
        grounds:
          - state_machines.Introduction.SUGGESTED_to_DECLINED
          - calculations.guarantee_remaining
          - calculations.guarantee_consume_on_suggest
        distinguishing_aspect: |
          Conserved quantity = the guarantee credit pool: (guarantee_remaining_forecast + sum of
          credits_consumed by open/committed introductions) MUST equal membership.guaranteed_introductions
          before and after a SUGGEST+DECLINE pair. A decline refunds exactly what the suggest consumed (net 0).
        test_recipe:
          setup:
            - "member_a on a plan guaranteeing 8; one introduction is SUGGESTED (consumes 1, forecast 7), then DECLINED (refunds 1, forecast back to 8)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 12000, term_months: 6, guaranteed_introductions: 8, priority_match_enabled: false, included_coaching_sessions: 3, coaching_value_cents: 5000, background_check_addon_cents: 2500 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /members"
              payload: { email: "a13@x.com", full_name: "A13", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { a_id: $.data.id }
            - call: "POST /members/${a_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { a_scr: $.data.id }
            - call: "POST /members/${a_id}/screenings/${a_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${a_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${a_id}/preferences"
              payload: { seeking_gender: "FEMALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${a_id}"
            - call: "POST /members"
              payload: { email: "b17@x.com", full_name: "B17", birth_date: "1992-01-01T00:00:00Z", city: "NYC", gender: "FEMALE" }
              as: ScreeningOfficer
              captures: { b_id: $.data.id }
            - call: "POST /members/${b_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { b_scr: $.data.id }
            - call: "POST /members/${b_id}/screenings/${b_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${b_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "PUT /members/${b_id}/preferences"
              payload: { seeking_gender: "MALE", min_age: 25, max_age: 45, max_distance_band: 0, attribute_weights: { education: 80, lifestyle: 80, values: 80 } }
              as: Member
              as_user_id: "${b_id}"
            - call: "GET /members/${a_id}"
              payload: {}
              as: Matchmaker
              captures: { a_v: $.data.version }
            - call: "POST /introductions"
              payload: { member_a_id: "${a_id}", member_b_id: "${b_id}", expected_member_a_version: "${a_v}" }
              as: Matchmaker
              captures: { intro_id: $.data.id, intro_v: $.data.version }
          trigger:
            - call: "POST /introductions/${intro_id}/respond"
              payload: { response: "DECLINED", expected_introduction_version: "${intro_v}" }
              as: Member
              as_user_id: "${b_id}"
            - call: "GET /members/${a_id}"
              payload: {}
              as: Matchmaker
              captures: { forecast: $.data.guarantee_remaining_forecast, committed: $.data.guarantee_remaining_committed }
          assert:
            - "Member.${a_id}.guarantee_remaining_forecast == 8"
            - "Member.${a_id}.guarantee_remaining_committed == 8"

      - name: background_check_cancel_refunds_wallet_conserved
        grounds:
          - state_machines.BackgroundCheck.ORDERED_to_CANCELLED
          - entities.Member.fields.wallet_credit_cents
          - entities.BackgroundCheck.fields.fee_charged_cents
        distinguishing_aspect: |
          Conserved quantity = member wallet cents (a money pool, distinct from the integer credit pool):
          ordering a background check charges fee F, cancelling refunds exactly F to wallet_credit_cents, so
          the net wallet delta across order+cancel is 0.
        test_recipe:
          setup:
            - "member_a ACTIVE on a plan whose background_check_addon_cents = 2500; orders a check (fee 2500) then cancels it; wallet returns to 2500 net of the refund."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 12000, term_months: 6, guaranteed_introductions: 8, priority_match_enabled: false, included_coaching_sessions: 3, coaching_value_cents: 5000, background_check_addon_cents: 2500 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /members"
              payload: { email: "a14@x.com", full_name: "A14", birth_date: "1990-01-01T00:00:00Z", city: "NYC", gender: "MALE" }
              as: ScreeningOfficer
              captures: { a_id: $.data.id }
            - call: "POST /members/${a_id}/screenings"
              payload: { questionnaire_score: 90, identity_verified: true }
              as: ScreeningOfficer
              captures: { a_scr: $.data.id }
            - call: "POST /members/${a_id}/screenings/${a_scr}/decide"
              payload: { decision: "APPROVED" }
              as: ScreeningOfficer
            - call: "POST /members/${a_id}/memberships"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /members/${a_id}/background-checks"
              payload: { provider_ref: "PRV-2" }
              as: ScreeningOfficer
              captures: { chk_id: $.data.id, fee: $.data.fee_charged_cents }
          trigger:
            - call: "POST /members/${a_id}/background-checks/${chk_id}/cancel"
              payload: {}
              as: ScreeningOfficer
            - call: "GET /members/${a_id}"
              payload: {}
              as: ScreeningOfficer
              captures: { wallet: $.data.wallet_credit_cents }
          assert:
            - "BackgroundCheck.${chk_id}.status == CANCELLED"
            - "Member.${a_id}.wallet_credit_cents == 2500"
