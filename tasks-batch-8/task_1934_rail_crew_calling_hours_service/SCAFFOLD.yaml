    code: 200
    input: []
    output: ExtraBoardSlot
    side_effects: []

  - method: POST
    path: "/api/jobs"
    description: "Bulletin a job."
    roles: [CrewManager]
    code: 201
    input: [job_symbol, craft, origin_terminal, report_time, crew_required]
    output: Job
    side_effects: ["job_status BULLETINED"]

  - method: GET
    path: "/api/jobs"
    description: "List jobs."
    roles: [CrewManager, CrewCaller, Employee]
    code: 200
    input: ["craft?", "job_status?", "limit?", "offset?"]
