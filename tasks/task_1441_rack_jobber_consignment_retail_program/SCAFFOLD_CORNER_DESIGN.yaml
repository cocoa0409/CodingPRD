      - name: product_discontinued_blocks_directive
        claim_type: conditional_validation
        grounds: ["validations[priority=24]", "errors[ERR_PRODUCT_DISCONTINUED]"]
        distinguishing_aspect: "A DISCONTINUED product cannot receive new price directives; existing directives are untouched."
        test_recipe:
          setup: ["ACTIVE agreement; product then DISCONTINUED via PATCH"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "DiscCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
