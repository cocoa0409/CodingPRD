          assert:
            - "first dispatch: error_id == ERR_VENDOR_NOT_ACTIVE; order stays CONSENT_CAPTURED"
            - "after reinstate (SUSPENDED -> ACTIVE): dispatch succeeds, fulfillment_status == DISPATCHED, vendor.active_order_count == 1"

