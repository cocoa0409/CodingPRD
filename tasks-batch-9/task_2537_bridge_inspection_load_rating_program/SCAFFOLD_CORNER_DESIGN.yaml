          assert:
            - "The inspection create returns 404 with data.error_id == ERR_PERSONNEL_NOT_FOUND - the bridge path segment resolved, so the failure is the body FK"
            - "GET /scour-evaluations/<unknown> returns 404 with data.error_id == ERR_RATING_RECORD_NOT_FOUND (LoadRating, ScourEvaluation and PlanOfAction share this family)"
            - "GET /permit-applications/<unknown> returns 404 with data.error_id == ERR_PERMIT_NOT_FOUND"
            - "GET /project-candidates/<unknown> returns 404 with data.error_id == ERR_PROGRAM_RECORD_NOT_FOUND (ProgramCycle, ProjectCandidate and FederalSubmission share this family)"
            - "Every one of the four responses carries the declared error envelope: success false, data.error_id and data.message, and no bridge-shaped payload leaks into data"

      - name: inspection_create_naming_another_inspector_returns_403
