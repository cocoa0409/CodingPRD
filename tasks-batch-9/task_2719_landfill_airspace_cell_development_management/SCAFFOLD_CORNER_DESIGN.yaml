  - section: rbac
    instances:

      - name: each_declared_role_can_invoke_one_of_its_own_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - endpoints[POST /landfills]
          - endpoints[POST /cells]
          - endpoints[POST /liner-qa-packages/{liner_qa_package_id}/begin-review]
          - endpoints[POST /aerial-surveys]
          - endpoints[POST /special-waste-approvals]
          - endpoints[POST /host-community-agreements]
          - endpoints[POST /waste-loads]
          - endpoints[POST /cells/{cell_id}/authorize-waste-placement]
        distinguishing_aspect: "All eight §1.7 roles are exercised on one site in one test: the five opaque roles plus the two entity-backed roles acting with their own landfill id, and PlatformAdmin. Nothing here is refused — this is the positive baseline the two rejection instances are measured against."
        test_recipe:
          setup:
            - "Canonical activation chain for Landfill LF and Cell C-1: PlatformAdmin registers the landfill, SiteOperator builds and activates C-1, CqaEngineer approves the liner package, FinanceOfficer files and certifies the closure estimate and funds assurance, RegulatoryAgency authorizes waste placement, and an EXECUTED host agreement plus OperatingDay D-1 for 2026-08-01 exist."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
