- section: consistency_model
  instances:
  - name: close_response_reflects_all_cascaded_mutations
    claim_type: immediate_consistency
    grounds:
    - complexity_profile.consistency_model
    - state_machines.Loan
    distinguishing_aspect: 'Immediate consistency: the close response itself carries closing_status CLOSED and entitlement_charged_cents 5000000;
      follow-up reads of the fee assessment, account, and occupancy certificate agree without delay.'
    test_recipe:
      setup:
      - fully approved loan limm ($200,000, 0 down) with VALUE_ISSUED appraisal
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Imm
          ssn_last4: '2040'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          vimm: $.data.id
      - call: POST /va-loans/veterans/${vimm}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${vimm}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coeimm: $.data.id
      - call: POST /va-loans/coe-requests/${coeimm}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: POST /va-loans/veterans/${vimm}/loans
        payload:
          coe_id: ${coeimm}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 20000000
          down_payment_cents: 0
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          limm: $.data.id
      - call: POST /va-loans/appraisers
        payload:
          name: App IM
          region: SOUTH
        as: ProgramAdmin
        as_user_id: admin-1
        captures:
          appIM: $.data.id
      - call: POST /va-loans/loans/${limm}/appraisal-requests
        payload: {}
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          aprimm: $.data.id
      - call: POST /va-loans/appraisal-requests/${aprimm}/submit-report
        payload:
          outcome: VALUE_ISSUED
          appraised_value_cents: 20000000
        as: Appraiser
        as_user_id: ${appIM}
      - call: POST /va-loans/loans/${limm}/underwriting-decisions
        payload:
          gross_monthly_income_cents: 600000
          new_housing_payment_cents: 150000
          other_obligations_annual_cents: []
          family_size: 4
          region: SOUTH
        as: Underwriter
        as_user_id: uw-1
      trigger:
      - call: POST /va-loans/loans/${limm}/close
        payload:
          closing_date: '2026-03-10'
          first_payment_due_date: '2026-05-01'
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          limm_cl: $.data.closing_status
          limm_charge: $.data.entitlement_charged_cents
      - call: GET /va-loans/loans/${limm}/funding-fee-assessments
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          feeimm: $.data[0].status
      - call: GET /va-loans/veterans/${vimm}/entitlement-account
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          acimm: $.data[0].total_charged_cents
      assert:
      - 'close response: closing_status == CLOSED, entitlement_charged_cents == 5000000'
      - 'same-request consistency: fee assessment already COLLECTED, account total_charged_cents == 5000000'
