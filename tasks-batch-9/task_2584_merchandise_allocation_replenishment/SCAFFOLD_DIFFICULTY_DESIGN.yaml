      - name: assortment_action_execute_gated_by_the_shared_items_lifecycle_state
        grounds:
          - validations[priority:10]
          - calculations.assortment_remedy_selection
          - state_machines[Item].transitions[BROKEN->CONSOLIDATION_PENDING]
          - errors.ERR_ITEM_LIFECYCLE_BLOCKED
          - endpoints.POST /allocation/assortment-actions/{actionId}/execute
        distinguishing_aspect: |
          Three PENDING AssortmentActions all belong to the same Item, so executing any one of them
          changes whether the other two are executable: the first execute drives the Item BROKEN ->
          CONSOLIDATION_PENDING, and the priority-10 rule then blocks every remaining action because a
          remedy is already in flight. The actions themselves never leave PENDING, and cancel - which has
          no lifecycle gate - still works on them, proving the block comes from the Item and not from the
          action's own state.
