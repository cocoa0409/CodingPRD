          ERR_CUSTOMER_DOUBLE_BOOKED — a different resource entity and interval semantics
          than the buffered specialist rule.
        test_recipe:
          setup:
            - "One customer with a confirmed 10:00-11:00 appointment on specialist 1 requests an overlapping 10:30-11:30 appointment on specialist 2."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "rt2@x.com", full_name: "RT Two", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Stylist E", specialties: ["ADAPTIVE"], buffer_minutes: 0 }
              as: StoreManager
              captures: { spec1: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Stylist F", specialties: ["ADAPTIVE"], buffer_minutes: 0 }
              as: StoreManager
              captures: { spec2: $.data.id }
            - call: "POST /appointments"
              payload: { specialist_id: "${spec1}", start_at: "2026-07-06T10:00:00Z", end_at: "2026-07-06T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { a_one: $.data.id }
            - call: "POST /appointments/${a_one}/transition"
              payload: { action: "CONFIRM" }
              as: StoreManager
            - call: "POST /appointments"
              payload: { specialist_id: "${spec2}", start_at: "2026-07-06T10:30:00Z", end_at: "2026-07-06T11:30:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { a_two: $.data.id }
          trigger:
            - call: "POST /appointments/${a_two}/transition"
              payload: { action: "CONFIRM" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CUSTOMER_DOUBLE_BOOKED"
            - "StylingAppointment.${a_two}.status == REQUESTED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_restores_inventory_reserved
        grounds:
          - state_machines.Order.UNFULFILLED_to_CANCELLED
          - calculations.inventory_availability
          - entities.ProductVariant.fields.inventory_reserved
          - entities.ProductVariant.fields.inventory_on_hand
        distinguishing_aspect: |
          Conserved quantity = physical inventory: reserving 3 units at add-line then
          cancelling the order must leave inventory_reserved back at 0 and
          inventory_on_hand unchanged at 10 (no unit drift). Pinned:
          inventory_on_hand stays 10, inventory_reserved returns to 0.
        test_recipe:
          setup:
            - "A variant with inventory_on_hand 10; an order reserves 3 via one line, then is cancelled before shipping."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "ci1@x.com", full_name: "CI One", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", inventory_on_hand: 10 }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "CANCEL" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "ProductVariant.${v1}.inventory_reserved == 0"
            - "ProductVariant.${v1}.inventory_on_hand == 10"
            - "ProductVariant.${v1}.inventory_available == 10"

      - name: order_cancel_restores_loyalty_points_balance
        grounds:
          - state_machines.Order.UNFULFILLED_to_CANCELLED
          - entities.Customer.fields.loyalty_points_balance
          - entities.Customer.fields.loyalty_lifetime_points
        distinguishing_aspect: |
          Conserved quantity = loyalty points balance (a different conserved quantity
          than inventory): redeeming 100 points at checkout then cancelling restores
          loyalty_points_balance to 200, while loyalty_lifetime_points is untouched at
          200 throughout.
        test_recipe:
          setup:
            - "Customer pre-seeded to 200 loyalty points; an order that redeems 100 at checkout (balance 100), then cancelled before shipping."
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "ci2@x.com", full_name: "CI Two", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { delta_points: 200 }
              as: StoreManager
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", inventory_on_hand: 10 }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/checkout"
              payload: { loyalty_redeem_points: 100 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "CANCEL" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Customer.${cust_id}.loyalty_points_balance == 200"
            - "Customer.${cust_id}.loyalty_lifetime_points == 200"
