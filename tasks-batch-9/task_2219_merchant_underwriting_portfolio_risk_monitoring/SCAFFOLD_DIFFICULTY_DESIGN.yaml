              as: RiskAnalyst
            - call: "POST /settlement-batches"
              payload: { merchant_id: "${m_id_m}", period_start_date: "2026-04-01", period_end_date: "2026-04-01", gross_volume_cents: 1000000 }
              as: PortfolioController
            - call: "POST /_clock/set_current_utc"
