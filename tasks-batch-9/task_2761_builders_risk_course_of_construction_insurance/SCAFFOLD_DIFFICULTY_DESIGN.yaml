# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance below grounds exclusively in SCAFFOLD.yaml §1.1-§1.7. All asserted money
# figures are integer cents pre-computed from the pinned formulas in §1.3.
# Shared fixture vocabulary used by the setup chains:
#   FX-A  project "Harborline Logistics Center": NON_COMBUSTIBLE / WIND_TIER_2 / NEW_CONSTRUCTION,
#         hard_cost 2000000000, 2026-09-01 -> 2027-06-01 (273 days), engineering_grade B,
#         submission_risk_score 28; policy term 2026-09-01 -> 2027-06-30 (302 days),
#         ELEVATED_100K (occurrence deductible 10000000), limit 2500000000,
#         daily_delay_rate 1200000, SOFT_COST 300000000 + DELAY_IN_COMPLETION 250000000
#         => quoted_premium 2750440.
#   FX-B  project "Gulfside Frame Towers": FRAME / FLOOD_A, hard_cost 7500000000,
#         submission_risk_score exactly 75 (referral boundary); policy term 364 days,
#         HIGH_250K, referral load 0.10 => quoted_premium 22423995.
#   FX-D  project "Cedar Lane Cottages": FIRE_RESISTIVE / INLAND, hard_cost 312500000,
#         no coverage parts => premium exactly at the 250000 minimum-premium floor.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: project_risk_score_submission_basis_versus_audit_basis
        grounds:
          - calculations.project_risk_score
          - entities.ConstructionProject.fields.submission_risk_score
          - entities.ConstructionProject.fields.audit_risk_score
          - state_machines.ExtensionEndorsement.REQUESTED_to_APPROVED
          - state_machines.Claim.REPORTED_to_ADJUSTED
        distinguishing_aspect: |
          The dual variant lives on the ConstructionProject risk-scoring domain: SUBMISSION_BASIS
          scores the project as submitted (gross TIV including the uninsured existing structure,
          planned duration, no claim history) while AUDIT_BASIS re-scores the same row from the
          insured TIV, the extension-adjusted completion date and the count of adjusted claims,
          so one entity carries two different scores for the same underlying facts (28 vs 37).
        test_recipe:
          setup:
            - "FX-A project screened to ELIGIBLE with submission_risk_score 28 (12 construction + 12 CAT + 4 value + 0 duration + 0 renovation)."
            - "FX-A policy IN_FORCE with MATERIALS_ON_SITE, IN_TRANSIT, SOFT_COST and DELAY_IN_COMPLETION parts scheduled and quoted_premium_cents 2750440."
            - "One APPROVED 120-day extension endorsement, so adjusted_completion_date is 2027-09-29 and the audit duration is 393 days (14 months)."
            - "One claim in adjustment_status ADJUSTED, contributing 5 claim points to the audit basis only."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Logistics Center", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B", loss_control_report_ref: "LC-2761-A" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version, sub_score: $.data.submission_risk_score }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", includes_existing_structure: false, deductible_tier: "ELEVATED_100K", limit_cents: 2500000000, daily_delay_rate_cents: 1200000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 1000000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "IN_TRANSIT", sublimit_cents: 200000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "SOFT_COST", sublimit_cents: 300000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "DELAY_IN_COMPLETION", sublimit_cents: 250000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/named-insured-interests"
              payload: { policy_id: "${pl1}", party_name: "Harborline Owner LLC", party_role: "OWNER", insurable_interest_pct: 100, loss_payee_priority: 1 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { int1: $.data.id }
            - call: "POST /builders-risk/named-insured-interests/${int1}/acknowledge"
              payload: {}
              as: LossPayee
              as_user_id: "${int1}"
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { prem: $.data.quoted_premium_cents }
            - call: "POST /builders-risk/policies/${pl1}/bind"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/incept"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "GET /builders-risk/policies/${pl1}"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1v: $.data.version }
            - call: "POST /builders-risk/extension-endorsements"
              payload: { policy_id: "${pl1}", expected_policy_version: "${pl1v}", requested_extension_days: 120, slip_reason: "WEATHER", revised_completion_date: "2027-09-29T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { en1: $.data.id, ap1: $.data.additional_premium_cents }
            - call: "POST /builders-risk/extension-endorsements/${en1}/decision"
              payload: { decision: "APPROVE" }
              as: UnderwritingManager
              as_user_id: "um-001"
            - call: "POST /builders-risk/claims"
              payload: { policy_id: "${pl1}", peril: "WIND", loss_date: "2027-01-15T00:00:00Z", description: "Wind uplift damaged staged roof panels" }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { cl1: $.data.id }
            - call: "POST /builders-risk/claims/${cl1}/adjust"
              payload: { outcome: "ADJUST", adjustment_basis: "ACTUAL_LOSS", loss_items: [{ part_type: "IN_TRANSIT", gross_loss_cents: 12345670 }] }
              as: ClaimAdjuster
              as_user_id: "ca-001"
          trigger:
            - call: "GET /builders-risk/projects/${p1}"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { final_sub: $.data.submission_risk_score, final_aud: $.data.audit_risk_score }
          assert:
            - "ConstructionProject.${p1}.submission_risk_score == 28 and is unchanged by the extension and the claim"
            - "ConstructionProject.${p1}.audit_risk_score == 37 (12 + 12 + 4 value + 4 duration + 5 claim)"
            - "final_aud - final_sub == 9"
            - "ExtensionEndorsement.${en1}.additional_premium_cents == 1529976 and ExtensionEndorsement.${en1}.slip_factor == 1.40"
            - "BuildersRiskPolicy.${pl1}.adjusted_completion_date == 2027-09-29T00:00:00Z and BuildersRiskPolicy.${pl1}.cumulative_extension_days == 120"
            - "Claim.${cl1}.indemnity_cents == 2345670 and Claim.${cl1}.uncovered_cents == 10000000"
      - name: claim_indemnity_reconstruction_cost_versus_actual_loss
        grounds:
          - calculations.claim_indemnity_allocation
          - entities.Claim.fields.adjustment_basis
          - entities.Claim.fields.continuing_pm_weeks
          - entities.Claim.fields.allocation_lines
          - state_machines.Claim.REPORTED_to_ADJUSTED
        distinguishing_aspect: |
          This dual variant sits on a different entity domain from the risk-score instance: it is
          loss valuation on Claim, not scoring on ConstructionProject. RECONSTRUCTION_COST applies
          the 1.08 rebuild uplift per line and indemnifies 6 weeks of continuing project management,
          while ACTUAL_LOSS pays documented invoices with no uplift and no PM, so two claims with
          byte-identical loss items settle 5205967 cents apart.
        test_recipe:
          setup:
            - "FX-A policy IN_FORCE with MATERIALS_ON_SITE 1000000000, IN_TRANSIT 200000000 and SOFT_COST 300000000 parts, occurrence deductible 10000000, no prior erosion."
            - "Two REPORTED claims on that policy with identical loss facts: MATERIALS_ON_SITE 45678920 and IN_TRANSIT 12345670."
            - "No loss payments issued, so every CoveragePart.eroded_cents is 0 for both adjustments."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Logistics Center", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", includes_existing_structure: false, deductible_tier: "ELEVATED_100K", limit_cents: 2500000000, daily_delay_rate_cents: 1200000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 1000000000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { cp_mos: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "IN_TRANSIT", sublimit_cents: 200000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "SOFT_COST", sublimit_cents: 300000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "DELAY_IN_COMPLETION", sublimit_cents: 250000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/named-insured-interests"
              payload: { policy_id: "${pl1}", party_name: "Harborline Owner LLC", party_role: "OWNER", insurable_interest_pct: 100, loss_payee_priority: 1 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { int1: $.data.id }
            - call: "POST /builders-risk/named-insured-interests/${int1}/acknowledge"
              payload: {}
              as: LossPayee
              as_user_id: "${int1}"
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/bind"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/incept"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/claims"
              payload: { policy_id: "${pl1}", peril: "FIRE", loss_date: "2027-02-10T00:00:00Z", description: "Fire damage to stored assemblies and a shipment in transit" }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { cl_r: $.data.id }
            - call: "POST /builders-risk/claims"
              payload: { policy_id: "${pl1}", peril: "FIRE", loss_date: "2027-02-10T00:00:00Z", description: "Same loss facts, invoice-documented basis" }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { cl_a: $.data.id }
          trigger:
            - call: "POST /builders-risk/claims/${cl_r}/adjust"
              payload: { outcome: "ADJUST", adjustment_basis: "RECONSTRUCTION_COST", continuing_pm_weeks: 6, loss_items: [{ part_type: "MATERIALS_ON_SITE", gross_loss_cents: 45678920 }, { part_type: "IN_TRANSIT", gross_loss_cents: 12345670 }] }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { ind_r: $.data.indemnity_cents }
            - call: "POST /builders-risk/claims/${cl_a}/adjust"
              payload: { outcome: "ADJUST", adjustment_basis: "ACTUAL_LOSS", continuing_pm_weeks: 6, loss_items: [{ part_type: "MATERIALS_ON_SITE", gross_loss_cents: 45678920 }, { part_type: "IN_TRANSIT", gross_loss_cents: 12345670 }] }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { ind_a: $.data.indemnity_cents }
          assert:
            - "Claim.${cl_r}.indemnity_cents == 53230557 (39333234 MATERIALS_ON_SITE net of the 10000000 deductible + 13333324 IN_TRANSIT + 563999 continuing PM)"
            - "Claim.${cl_a}.indemnity_cents == 48024590 (35678920 + 12345670, no uplift, no PM)"
            - "ind_r - ind_a == 5205967"
            - "Claim.${cl_r}.allocation_lines has 3 entries and the SOFT_COST entry's allocated_cents == 563999"
            - "Claim.${cl_a}.allocation_lines has 2 entries and no SOFT_COST entry, because continuing_pm_weeks is ignored on ACTUAL_LOSS"
            - "Claim.${cl_r}.uncovered_cents == 10000000 and Claim.${cl_a}.uncovered_cents == 10000000"
  - rule_id: combinatorial_formula
    instances:
      - name: quote_premium_component_stack_mode_a
        grounds:
          - calculations.quote_premium
          - entities.BuildersRiskPolicy.fields.insured_tiv_cents
          - entities.BuildersRiskPolicy.fields.deductible_tier
          - entities.CoveragePart.fields.sublimit_cents
          - state_machines.BuildersRiskPolicy.DRAFT_to_QUOTED
          - state_machines.BuildersRiskPolicy.QUOTED_to_DRAFT
        distinguishing_aspect: |
          Mode (a): the premium is a non-linear stack of five inputs - construction-type rate
          selection, CAT-zone load, a max(0, months - 12) duration step, a soft-cost component read
          from a *different entity's* rows (the CoveragePart schedule), a conditional renovation
          load, a tiered deductible credit and a final max() against the minimum-premium floor.
          Editing one sublimit on a child row re-prices the parent, which no additive formula does.
        test_recipe:
          setup:
            - "FX-A project ELIGIBLE (submission_risk_score 28, below the 75 referral threshold)."
            - "FX-A DRAFT policy: 302-day term, ELEVATED_100K (6% credit), limit 2500000000."
            - "Coverage schedule carrying SOFT_COST 300000000, DELAY_IN_COMPLETION 250000000 and the MATERIALS_ON_SITE 1000000000 part every quote requires, so the soft-cost component rates 5500 units of $1,000 at 60 cents each - MATERIALS_ON_SITE contributes nothing to that component."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Logistics Center", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", includes_existing_structure: false, deductible_tier: "ELEVATED_100K", limit_cents: 2500000000, daily_delay_rate_cents: 1200000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id, tiv: $.data.insured_tiv_cents }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "SOFT_COST", sublimit_cents: 300000000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { cp_soft: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "DELAY_IN_COMPLETION", sublimit_cents: 250000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 1000000000 }
              as: Underwriter
              as_user_id: "uw-001"
          trigger:
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { prem1: $.data.quoted_premium_cents, st1: $.data.status }
            - call: "POST /builders-risk/policies/${pl1}/reopen"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "PATCH /builders-risk/coverage-parts/${cp_soft}"
              payload: { sublimit_cents: 100000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { prem2: $.data.quoted_premium_cents }
          assert:
            - "BuildersRiskPolicy.${pl1}.insured_tiv_cents == 2000000000 and original_term_days == 302"
            - "prem1 == 2750440 (base 2200000 + CAT 396000 + duration 0 + soft 330000 + renovation 0 = 2926000, less the 6% credit 175560)"
            - "st1 == QUOTED because submission_risk_score 28 < 75"
            - "prem2 == 2637640 after the SOFT_COST sublimit drops to 100000000 (soft component 210000, subtotal 2806000, credit 168360)"
            - "prem1 - prem2 == 112800, so a single child-row edit moves the parent's premium"
      - name: claim_allocation_round_per_line_then_sum_mode_b
        grounds:
          - calculations.claim_indemnity_allocation
          - entities.Claim.fields.indemnity_cents
          - entities.Claim.fields.allocation_lines
          - state_machines.Claim.REPORTED_to_ADJUSTED
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-line-then-sum for the 1.08 reconstruction uplift.
          The two gross amounts are chosen so the pinned order yields 62666558 while the forbidden
          sum-then-round order yields 62666557, and that single cent propagates into the asserted
          indemnity - a test that fails loudly if the implementation rounds once at the end.
        test_recipe:
          setup:
            - "FX-A policy IN_FORCE with MATERIALS_ON_SITE 1000000000, IN_TRANSIT 200000000 and SOFT_COST 300000000, occurrence deductible 10000000, zero prior erosion."
            - "One REPORTED claim whose loss items are 45678920 and 12345670 - both congruent to 20 modulo 25, so each line rounds up individually."
            - "continuing_pm_weeks 0 so the divergence is purely the uplift rounding, not the PM term."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Logistics Center", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", includes_existing_structure: false, deductible_tier: "ELEVATED_100K", limit_cents: 2500000000, daily_delay_rate_cents: 1200000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 1000000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "IN_TRANSIT", sublimit_cents: 200000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "SOFT_COST", sublimit_cents: 300000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/named-insured-interests"
              payload: { policy_id: "${pl1}", party_name: "Harborline Owner LLC", party_role: "OWNER", insurable_interest_pct: 100, loss_payee_priority: 1 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { int1: $.data.id }
            - call: "POST /builders-risk/named-insured-interests/${int1}/acknowledge"
              payload: {}
              as: LossPayee
              as_user_id: "${int1}"
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/bind"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/incept"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/claims"
              payload: { policy_id: "${pl1}", peril: "FIRE", loss_date: "2027-02-10T00:00:00Z", description: "Fire damage - rounding-sensitive gross amounts" }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { cl2: $.data.id }
          trigger:
            - call: "POST /builders-risk/claims/${cl2}/adjust"
              payload: { outcome: "ADJUST", adjustment_basis: "RECONSTRUCTION_COST", continuing_pm_weeks: 0, loss_items: [{ part_type: "MATERIALS_ON_SITE", gross_loss_cents: 45678920 }, { part_type: "IN_TRANSIT", gross_loss_cents: 12345670 }] }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { ind2: $.data.indemnity_cents }
          assert:
            - "the MATERIALS_ON_SITE allocation line's covered_basis_cents == 49333234 (round_half_up(45678920 * 1.08))"
