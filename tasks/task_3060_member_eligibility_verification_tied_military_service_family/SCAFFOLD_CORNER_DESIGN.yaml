# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Member Eligibility Verification Tied to Military Service & Family Lineage
#
# Breadth probe over every claim §1.1–§1.7 declares that §1.8 does not already
# exercise. Corners already covered by §1.8 appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: eligibility_case_create_returns_system_defaults
        claim_type: Creation
        grounds:
          - entities.EligibilityCase
          - endpoints.POST_/membership/eligibility-cases
        distinguishing_aspect: "A DIRECT_SERVICE case created with only the three required inputs comes back 201 in INTAKE with version 1, null member_id / sponsor / relationship fields, adoption_or_divorce_flag defaulting to false, and server-minted id/created_at/updated_at."
        test_recipe:
          setup:
            - "Empty database; default logical clock 2026-09-01T00:00:00Z (never set)."
          setup_api_calls: []
          trigger:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Wes Warden", applicant_dob: "1986-04-04", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { case_w: $.data.id }
          assert:
            - "response status 201, response_type object, meta.api_request_id and meta.api_request_timestamp present"
            - "EligibilityCase.${case_w}.status == INTAKE, version == 1"
            - "EligibilityCase.${case_w}.member_id is null and eligibility_category is null"
            - "EligibilityCase.${case_w}.sponsor_member_id is null, claimed_relationship is null, adoption_or_divorce_flag == false"
            - "id, created_at, updated_at are non-null and system-generated"

      - name: member_get_returns_stored_row_with_member_number
        claim_type: Retrieval
        grounds:
          - entities.Member
          - endpoints.GET_/membership/members/{memberId}
        distinguishing_aspect: "GET on an approved member round-trips every stored field, including the zero-padded 10-digit member_number 0000000001 for the first minted member and lineage_depth 0 for a direct-service member."
        test_recipe:
          setup:
            - "One approved direct-service member M (the first member in the database)."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "First Member", applicant_dob: "1980-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_fm: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_fm}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-5", service_start_date: "2001-01-01", service_end_date: "2007-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_fm: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_fm}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2007-02-01", covers_service_record_id: "${sr_fm}", content_hash: "fm1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_fm}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_fm}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_fm}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_fm: $.data.member_id }
          trigger:
            - call: "GET /membership/members/${m_fm}"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-A"
          assert:
            - "Member.${m_fm}.member_number == \"0000000001\""
            - "Member.${m_fm}.legal_name == \"First Member\", eligibility_category == VETERAN_HONORABLE, lineage_depth == 0, status == ACTIVE, deployment_posture == NONE"

      - name: members_list_pagination_defaults
        claim_type: Listing
        grounds:
          - endpoints.GET_/membership/members
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /membership/members with no pagination params applies the envelope defaults limit 10 / offset 0 and reports total_count and has_more; creating 2 members yields total_count 2, has_more false."
        test_recipe:
          setup:
            - "Two approved direct-service members (two independent case chains)."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "List One", applicant_dob: "1981-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_l1: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_l1}/service-records"
              payload: { branch: "NAVY", component: "RESERVE", rank_grade: "E-4", service_start_date: "2002-01-01", service_end_date: "2008-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_l1: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_l1}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2008-02-01", covers_service_record_id: "${sr_l1}", content_hash: "ls1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_l1}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_l1}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_l1}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "List Two", applicant_dob: "1982-02-02", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_l2: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_l2}/service-records"
              payload: { branch: "NAVY", component: "RESERVE", rank_grade: "E-4", service_start_date: "2003-01-01", service_end_date: "2009-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_l2: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_l2}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2009-02-01", covers_service_record_id: "${sr_l2}", content_hash: "ls2" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_l2}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_l2}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_l2}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
          trigger:
            - call: "GET /membership/members"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response meta carries total_count == 2, has_more == false, limit == 10, offset == 0 (defaults applied)"
            - "response_type == array and data contains exactly 2 members"

      - name: member_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /membership/members/{random-uuid} against an empty members table returns 404 ERR_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /membership/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND and response_type == error"

      - name: eligibility_case_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - entities.EligibilityCase
        distinguishing_aspect: "POST /membership/eligibility-cases without applicant_dob fails ERR_INVALID_REQUEST (400); the FAMILY_DERIVATION basis without sponsor_member_id likewise fails ERR_INVALID_REQUEST at priority 4 before any sponsor lookup."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "No Dob", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { err_rq: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: service_record_computed_service_days
        claim_type: Computed Fields
        grounds:
          - entities.ServiceRecord.fields.service_days
        distinguishing_aspect: "service_days is computed from the submitted dates: 2000-01-01 to 2000-01-11 yields 10; a client-supplied service_days value in the payload is ignored."
        test_recipe:
          setup:
            - "Case in INTAKE."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Day Counter", applicant_dob: "1979-09-09", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_dc: $.data.id }
          trigger:
            - call: "POST /membership/eligibility-cases/${c_dc}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-3", service_start_date: "2000-01-01", service_end_date: "2000-01-11", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_dc: $.data.id }
          assert:
            - "ServiceRecord.${sr_dc}.service_days == 10"
            - "ServiceRecord.${sr_dc}.service_verified == false (system default, never client-set)"

      - name: eligibility_case_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=4]
          - entities.EligibilityCase.fields.basis_type
        distinguishing_aspect: "basis_type \"ALIEN_SERVICE\" is not a declared enum member and is rejected ERR_INVALID_REQUEST; an address with effective_to earlier than effective_from is rejected ERR_ADDRESS_OVERLAP."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Enum Err", applicant_dob: "1980-01-01", basis_type: "ALIEN_SERVICE" }
              as: EligibilityApplicant
              captures: { err_enum: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: member_system_fields_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Member
        distinguishing_aspect: "Member rows exist only as a side effect of case approval — there is no client-driven member create; member_number, lineage_depth, product_matrix_cache are all system/computed and appear on the approved case's minted member without any client input."
        test_recipe:
          setup:
            - "Approved family case (sponsor already ACTIVE)."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Sys Parent", applicant_dob: "1970-05-05", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_sp: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_sp}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-6", service_start_date: "1990-01-01", service_end_date: "1996-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_sp: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_sp}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "1996-02-01", covers_service_record_id: "${sr_sp}", content_hash: "sp1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_sp}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_sp}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_sp}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_sp: $.data.member_id }
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Sys Child", applicant_dob: "1995-05-05", basis_type: "FAMILY_DERIVATION", sponsor_member_id: "${m_sp}", claimed_relationship: "CHILD" }
              as: EligibilityApplicant
              captures: { c_sc: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_sc}/evidence"
              payload: { doc_type: "BIRTH_CERTIFICATE", issuing_authority: "TX VR", issued_on: "1995-06-01", content_hash: "sc1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_sc}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_sc}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_sc: $.data.member_id }
          trigger:
            - call: "GET /membership/members/${m_sc}"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-A"
          assert:
            - "Member.${m_sc}.lineage_depth == 1 and Member.${m_sc}.sponsor_member_id == ${m_sp} (both system-derived, never client input)"
            - "Member.${m_sc}.member_number == Member.${m_sp}.member_number + 1 (sequential issuance)"

      - name: household_creation_requires_resolvable_primary_member
        claim_type: Parent Relationships
        grounds:
          - entities.Household.fields.primary_member_id
          - validations[priority=11]
        distinguishing_aspect: "POST /membership/households with a random primary_member_id UUID fails ERR_INVALID_REFERENCE (422); with a real member it succeeds and auto-links the primary."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /membership/households"
              payload: { household_name: "Ghost House", primary_member_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
              as: VerificationOfficer
              as_user_id: "officer-A"
              captures: { err_fk: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REFERENCE, HTTP 422"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: case_decide_from_intake_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.EligibilityCase
        distinguishing_aspect: "Deciding a case still in INTAKE (never submitted) is not a listed from-state for decide — ERR_INVALID_STATE, and no member is minted."
        test_recipe:
          setup:
            - "Case in INTAKE with record and evidence attached but never submitted."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Skip Submit", applicant_dob: "1984-08-08", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_ss: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_ss}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-5", service_start_date: "2004-01-01", service_end_date: "2010-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_ss: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_ss}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2010-02-01", covers_service_record_id: "${sr_ss}", content_hash: "ss1" }
              as: EligibilityApplicant
          trigger:
            - call: "POST /membership/eligibility-cases/${c_ss}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { err_is: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; EligibilityCase.${c_ss}.status remains INTAKE and member_id is null"

      - name: deceased_member_rejects_all_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Member
          - state_machines.EligibilityCase
        distinguishing_aspect: "Two terminal lockdowns: (a) eligibility-loss on a DECEASED member fails ERR_INVALID_STATE; (b) decide on a DENIED case fails ERR_INVALID_STATE (excluded — covered by §1.8 state_beats_business_safety_on_case_decide; only the member leg is exercised here)."
        test_recipe:
          setup:
            - "Member M approved ACTIVE then marked DECEASED (no beneficiary)."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Late Larry", applicant_dob: "1955-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_ll: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_ll}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-7", service_start_date: "1975-01-01", service_end_date: "1985-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_ll: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_ll}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "1985-02-01", covers_service_record_id: "${sr_ll}", content_hash: "ll1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_ll}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_ll}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_ll}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_ll: $.data.member_id }
            - call: "POST /membership/members/${m_ll}/deceased"
              payload: {}
              as: BenefitsOfficer
          trigger:
            - call: "POST /membership/members/${m_ll}/eligibility-loss"
              payload: { loss_type: "DOCUMENTATION_REVOKED" }
              as: VerificationOfficer
              as_user_id: "officer-A"
              captures: { err_term: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; Member.${m_ll}.status remains DECEASED"
            - "No SurvivorSupportCase exists for ${m_ll} (no beneficiary supplied and no family members) — GET /membership/members/${m_ll}/survivor-cases returns an empty array"

      - name: reinstate_from_active_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Member.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "POST reinstate on an ACTIVE member is not a listed from-state — ERR_INVALID_STATE; version unchanged."
        test_recipe:
          setup:
            - "Member M ACTIVE (freshly approved)."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Active Amy", applicant_dob: "1988-03-03", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_aa: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_aa}/service-records"
              payload: { branch: "NAVY", component: "ACTIVE_DUTY", rank_grade: "E-6", service_start_date: "2008-01-01", service_end_date: "2014-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_aa: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_aa}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2014-02-01", covers_service_record_id: "${sr_aa}", content_hash: "aa1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_aa}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_aa}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_aa}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_aa: $.data.member_id }
          trigger:
            - call: "POST /membership/members/${m_aa}/reinstate"
              payload: {}
              as: VerificationOfficer
              as_user_id: "officer-A"
              captures: { err_ra: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; Member.${m_aa}.status remains ACTIVE and version unchanged"

      - name: survivor_grant_side_effects_all_applied
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SurvivorSupportCase.OPEN_to_GRANTED
        distinguishing_aspect: "Covered end-to-end by §1.8 cascade instance — here only the survivor-case row fields are pinned: status GRANTED, continuance fields populated, transfer_household_id set to the deceased member's household."
        test_recipe:
          setup:
            - "Deceased member D in household H_D; spouse beneficiary B; survivor case SC OPEN."
          setup_api_calls:
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Side Sid", applicant_dob: "1971-01-01", basis_type: "DIRECT_SERVICE" }
              as: EligibilityApplicant
              captures: { c_sd: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_sd}/service-records"
              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-8", service_start_date: "1992-01-01", service_end_date: "2012-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_sd: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_sd}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2012-02-01", covers_service_record_id: "${sr_sd}", content_hash: "sd1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_sd}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_sd}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${c_sd}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { m_sd: $.data.member_id }
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Side Sue", applicant_dob: "1973-02-02", basis_type: "FAMILY_DERIVATION", sponsor_member_id: "${m_sd}", claimed_relationship: "SPOUSE" }
              as: EligibilityApplicant
              captures: { c_su: $.data.id }
            - call: "POST /membership/eligibility-cases/${c_su}/evidence"
              payload: { doc_type: "MARRIAGE_CERTIFICATE", issuing_authority: "WA VR", issued_on: "1998-06-01", content_hash: "su1" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_su}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${c_su}/decide"
