  - velocity_limit_cents?
  output: Counterparty
  side_effects:
  - status initialised to ACTIVE
  - 'AuditEvent appended: action=counterparty.created'
- method: GET
  path: /counterparties/{id}
  description: Read one counterparty including its derived effective velocity limit
  roles:
  - PlatformAdmin
  - LedgerController
  - PaymentOpsAnalyst
  - PaymentOpsApprover
  - PaymentApprover
  - PaymentInitiator
  - CounterpartyUser
  - Auditor
