      - name: delivery_window_capacity_is_an_aggregate_over_overlapping_days
        claim_type: Aggregate validation
        grounds:
          - validations[priority=61]
          - errors[ERR_DELIVERY_SLOT_CAPACITY]
        distinguishing_aspect: "Two consignments per calendar day are permitted and a third whose closed window touches an already doubly-booked day is refused."
        excluded_because:
          difficulty_instance: augmentation_delivery_windows_are_closed_intervals_with_per_day_capacity_two
          rationale: "That instance books two overlapping windows, refuses a third on the shared day and accepts a fourth that starts the day after, covering the aggregate claim and the closed-interval boundary."

      - name: store_state_check_precedes_the_license_check_on_activation
        claim_type: Priority conflict
        grounds:
          - validations[priority=40]
          - validations[priority=52]
        distinguishing_aspect: "A suspended store with a lapsed licence violates both rules and must surface the priority-40 state error."
        excluded_because:
          difficulty_instance: store_state_error_precedes_license_safety_error_on_stage_activation
          rationale: "That instance constructs the double violation and asserts the priority-40 error wins, then repairs the state to show the priority-52 error surfacing next."

      - name: disclosure_check_precedes_the_augmentation_cap_check
        claim_type: Priority conflict
        grounds:
          - validations[priority=53]
          - validations[priority=80]
        distinguishing_aspect: "A consignment that is both undisclosed and over the cap must fail on disclosure (53) rather than on the fiscal cap (80)."
        excluded_because:
          difficulty_instance: augmentation_disclosure_safety_precedes_cap_fiscal_error_on_receive
          rationale: "That instance receives an over-cap undisclosed consignment, asserts ERR_AUGMENTATION_DISCLOSURE_MISSING, then files the disclosure to reveal ERR_AUGMENTATION_CAP_EXCEEDED underneath."

      - name: stage_windows_are_half_open_for_overlap_purposes
        claim_type: Temporal validation
        grounds:
          - validations[priority=60]
          - errors[ERR_STAGE_WINDOW_OVERLAP]
        distinguishing_aspect: "Back-to-back stages sharing a boundary date do not overlap, while a one-day intrusion does."
        excluded_because:
          difficulty_instance: markdown_stage_windows_are_half_open_so_shared_boundary_dates_do_not_overlap
          rationale: "That instance accepts the shared-boundary successor and refuses the one-day-earlier variant with ERR_STAGE_WINDOW_OVERLAP, which is the half-open claim in full."

