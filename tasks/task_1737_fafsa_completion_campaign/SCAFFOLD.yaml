# =============================================================================
# FAFSA Completion Campaign — seed tables (SCAFFOLD.yaml, §1.0–§1.7)
# Difficulty: harder-than-expert (15 entities, dual-variant calcs, cyclic +
# parallel state machines, depth-3 cascades, OCC, k-anonymity reporting)
# =============================================================================

scenario: |
  FAFSA Completion Campaign (state FAFSA completion initiative): senior list &
  completion status data matching, event scheduling & volunteer/expert staffing,
  family document checklist & language support, verification-selected follow-up
  support, state grant deadline vs federal deadline tracking, special-circumstance
  (independent student) referral, completion rate reporting by subgroup, privacy &
  consent for status data

domain_name: fafsa-completion-campaign
api_prefix: /fafsa

complexity_profile:
  primary_archetype: compliance_audit        # consent-gated PII, k-anonymity, audit cascades
  secondary_archetype: event_sourcing        # AidRecord.current_status is a projection over AidStatusEvent stream
  complexity_layers:
    - dual_variant_calculation               # completion_rate; event_staffing_coverage
    - cascading_side_effects                 # snapshot→senior→case→specialist chains
    - optimistic_concurrency                 # OCC on SeniorRecord.version and Campaign.version
    - rate_threshold_triggers                # no_show_limit suspension; caseload OVERLOADED flip
  entity_topology: flat                      # all collections directly under /fafsa; FK references
  state_machine_shape: parallel              # SeniorRecord carries match_status × fafsa_status axes; several cyclic machines
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                            # SupportCase.case_type drives per-type resolve preconditions
  role_model: peer_roles                     # scoped SchoolCoordinator tenancy + opaque ops roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# All datetimes ISO 8601 UTC; all dates ISO 8601. Monetary values integer cents.
# =============================================================================
entities:
  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign display name" }
      - { name: academic_year, type: string, source: input, description: "Aid year label, e.g. '2027-2028'" }
      - { name: state_grant_deadline, type: datetime, source: input, description: "State grant priority deadline; submitted_at <= this (inclusive) counts as ON_TRACK_STATE" }
      - { name: federal_deadline, type: datetime, source: input, description: "Federal FAFSA deadline; campaign auto-closes after it" }
      - { name: total_budget_cents, type: integer, source: input, description: "Total event budget in cents" }
      - { name: auto_confirm_threshold, type: number, source: input, default: 0.90, description: "match_score >= this -> MatchLink starts AUTO_CONFIRMED" }
      - { name: review_floor, type: number, source: input, default: 0.60, description: "match_score >= this (and < auto_confirm_threshold) -> SUGGESTED; below -> AUTO_REJECTED" }
      - { name: min_subgroup_size, type: integer, source: input, default: 5, description: "k-anonymity: report rows with eligible_count < this are suppressed" }
      - { name: max_caseload, type: integer, source: input, default: 25, description: "Specialist active_case_count > this -> OVERLOADED" }
      - { name: no_show_limit, type: integer, source: input, default: 3, description: "no_show_count >= this -> StaffProfile SUSPENDED" }
      - { name: min_recognition_seniors, type: integer, source: input, default: 10, description: "Schools with fewer eligible seniors are UNRATED and excluded from tier distribution" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | STATE_GRACE | CLOSED" }
      - { name: committed_budget_cents, type: integer, source: computed, description: "Sum of cost_estimate_cents of events in {PUBLISHED, IN_PROGRESS}" }
      - { name: spent_budget_cents, type: integer, source: computed, description: "Sum of actual_cost_cents of COMPLETED events" }
      - { name: budget_balance_cents, type: integer, source: computed, description: "total_budget_cents - committed_budget_cents - spent_budget_cents" }

  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: name, type: string, source: input, description: "School name" }
      - { name: district_code, type: string, source: input, description: "District identifier used in matching and reporting" }
      - { name: school_code, type: string, source: input, description: "School identifier used in matching" }
      - { name: status, type: enum, source: system, description: "INVITED | ENROLLED | SUSPENDED" }
      - { name: recognition_tier, type: enum, source: computed, default: "UNRATED", description: "GOLD | SILVER | BRONZE | UNRATED; recomputed on report publish (recognition_tier calc)" }

  - name: StaffProfile
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: full_name, type: string, source: input, description: "Staff/volunteer full name" }
      - { name: capabilities, type: array, source: input, description: "Subset of {EVENT_STAFF, AID_EXPERT, CASE_SPECIALIST}" }
      - { name: languages, type: array, source: input, description: "ISO language codes the person can support" }
      - { name: background_check_status, type: enum, source: system, default: "PENDING", description: "PENDING | CLEARED | EXPIRED" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | OVERLOADED | SUSPENDED" }
      - { name: confirmed_hours_total, type: number, source: computed, default: 0, description: "Sum of duration_hours of own StaffAssignments in {CONFIRMED, CHECKED_IN}" }
      - { name: no_show_count, type: integer, source: computed, default: 0, description: "Assignments marked NO_SHOW" }
      - { name: active_case_count, type: integer, source: computed, default: 0, description: "SupportCases assigned with status in {OPEN, IN_REVIEW, AWAITING_FAMILY, ESCALATED}" }

  - name: SeniorRecord
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id" }
      - { name: student_ref, type: string, source: input, description: "School-local student identifier; unique per school" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: dob, type: string, source: input, description: "Date of birth, ISO date" }
      - { name: home_language, type: string, source: input, description: "Primary home language ISO code" }
      - { name: subgroup_tags, type: array, source: input, default: [], description: "Reporting subgroup tags (e.g. FOSTER_YOUTH, ELL, LOW_INCOME)" }
      - { name: efc_band, type: enum, source: input, default: "MID", description: "LOW | MID | HIGH family-contribution band" }
      - { name: dependency_status, type: enum, source: system, default: "DEPENDENT", description: "DEPENDENT | INDEPENDENT | PENDING_REVIEW" }
      - { name: match_status, type: enum, source: system, description: "UNMATCHED | SUGGESTED | MATCHED (parallel axis 1)" }
      - { name: fafsa_status, type: enum, source: system, description: "NO_RECORD | STARTED | SUBMITTED | VERIFICATION_SELECTED | COMPLETE (parallel axis 2; mirrors confirmed link's AidRecord)" }
      - { name: submitted_at, type: datetime, source: computed, description: "Earliest effective_date of linked AidRecord events with status in {SUBMITTED, VERIFICATION_SELECTED, COMPLETE}; null when none" }
      - { name: deadline_classification, type: enum, source: computed, description: "NOT_SUBMITTED | ON_TRACK_STATE | STATE_MISSED_FEDERAL_OPEN | LATE" }
      - { name: current_match_link_id, type: string, source: computed, description: "Id of this senior's MatchLink in CONFIRMED or AUTO_CONFIRMED status, else null (back-pointer; navigate via MatchLink.senior_record_id)" }
      - { name: data_visibility, type: enum, source: computed, description: "NORMAL | RESTRICTED; NORMAL iff a GRANTED ConsentRecord with scope STATUS_DETAIL exists for this senior (RESTRICTED at creation)" }

  - name: AidRecord
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: external_ref, type: string, source: input, description: "State aid-agency student key; unique per campaign" }
      - { name: full_name, type: string, source: input, description: "Name as reported on the aid record" }
      - { name: dob, type: string, source: input, description: "Date of birth, ISO date" }
      - { name: school_code, type: string, source: input, description: "School code reported on the aid record" }
      - { name: district_code, type: string, source: input, description: "District code reported on the aid record" }
      - { name: current_status, type: enum, source: computed, description: "STARTED | SUBMITTED | VERIFICATION_SELECTED | COMPLETE; projection over AidStatusEvent stream" }
      - { name: last_effective_date, type: string, source: computed, description: "effective_date of the winning AidStatusEvent" }

  - name: AidStatusEvent
    parent: null
    common_fields: false
    fields:
      - { name: aid_record_id, type: string, source: system, description: "FK -> AidRecord.id" }
      - { name: fafsa_status, type: enum, source: input, description: "STARTED | SUBMITTED | VERIFICATION_SELECTED | COMPLETE" }
      - { name: effective_date, type: string, source: input, description: "ISO date the status took effect at the source agency" }
      - { name: source, type: string, source: input, default: "IMPORT", description: "Free-form import batch label" }

  - name: MatchLink
    parent: null
    common_fields: true
    fields:
      - { name: senior_record_id, type: string, source: input, description: "FK -> SeniorRecord.id" }
      - { name: aid_record_id, type: string, source: input, description: "FK -> AidRecord.id" }
      - { name: match_score, type: number, source: computed, description: "Weighted sum of score_components (match_score calc)" }
      - { name: score_components, type: object, source: computed, description: "{dob_exact, name_exact, school_code_match, district_match} booleans" }
      - { name: status, type: enum, source: system, description: "SUGGESTED | AUTO_CONFIRMED | CONFIRMED | REJECTED | AUTO_REJECTED | INVALIDATED" }

  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - { name: senior_record_id, type: string, source: input, description: "FK -> SeniorRecord.id" }
      - { name: scopes, type: array, source: input, description: "Non-empty subset of {STATUS_DETAIL, OUTREACH, DATA_SHARE}" }
      - { name: granted_by, type: enum, source: input, description: "PARENT | ADULT_STUDENT" }
      - { name: status, type: enum, source: system, description: "GRANTED | REVOKED | EXPIRED" }
      - { name: expires_at, type: datetime, source: input, description: "Optional; null = no expiry. System flips GRANTED -> EXPIRED once clock passes" , default: null }

  - name: CompletionEvent
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: start_time, type: datetime, source: input, description: "Event window start (half-open)" }
      - { name: end_time, type: datetime, source: input, description: "Event window end (half-open); must be > start_time" }
      - { name: capacity, type: integer, source: input, description: "Max REGISTERED EventRegistrations (>= 1)" }
      - { name: cost_estimate_cents, type: integer, source: input, description: "Committed to campaign budget on publish" }
      - { name: actual_cost_cents, type: integer, source: system, description: "Set at completion; null until then", default: null }
      - { name: required_expert_count, type: integer, source: input, description: "Min CONFIRMED EXPERT assignments required to publish" }
      - { name: supported_languages, type: array, source: input, description: "Languages the event must cover with CONFIRMED staff to publish" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: staffing_coverage, type: object, source: computed, description: "Read-only on GET: {committed: {expert_ratio, staff_count, language_complete}, pipeline: {...}} per event_staffing_coverage calc" }

  - name: StaffAssignment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> CompletionEvent.id" }
      - { name: staff_profile_id, type: string, source: input, description: "FK -> StaffProfile.id" }
      - { name: assigned_role, type: enum, source: input, description: "VOLUNTEER | EXPERT" }
      - { name: status, type: enum, source: system, description: "INVITED | ACCEPTED | CONFIRMED | CHECKED_IN | NO_SHOW | DECLINED | CANCELLED" }
      - { name: duration_hours, type: number, source: computed, description: "(event.end_time - event.start_time) / 3600, 2 decimal places" }

  - name: EventRegistration
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> CompletionEvent.id" }
      - { name: senior_record_id, type: string, source: input, description: "FK -> SeniorRecord.id" }
      - { name: status, type: enum, source: system, description: "REGISTERED | CANCELLED" }

  - name: DocumentChecklist
    parent: null
    common_fields: true
    fields:
      - { name: senior_record_id, type: string, source: input, description: "FK -> SeniorRecord.id" }
      - { name: language, type: string, source: computed, description: "Copied from SeniorRecord.home_language at generation" }
      - { name: template_key, type: enum, source: computed, description: "DEPENDENT_STANDARD | INDEPENDENT_STANDARD; keyed on dependency_status at generation/regeneration. Templates: DEPENDENT_STANDARD = [STUDENT_ID, STUDENT_TAX_RETURN, PARENT_TAX_RETURN, BANK_STATEMENT]; INDEPENDENT_STANDARD = [STUDENT_ID, STUDENT_TAX_RETURN, DEPENDENCY_OVERRIDE_FORM] (items created in this order)" }
      - { name: status, type: enum, source: system, description: "GENERATED | IN_PROGRESS | COMPLETE | ARCHIVED" }

  - name: ChecklistItem
    parent: null
    common_fields: true
    fields:
      - { name: checklist_id, type: string, source: system, description: "FK -> DocumentChecklist.id" }
      - { name: doc_type, type: enum, source: system, description: "STUDENT_ID | STUDENT_TAX_RETURN | PARENT_TAX_RETURN | BANK_STATEMENT | DEPENDENCY_OVERRIDE_FORM" }
      - { name: status, type: enum, source: system, description: "PENDING | RECEIVED | VERIFIED | REJECTED | WAIVED" }
      - { name: waivable, type: boolean, source: computed, description: "true iff doc_type in {BANK_STATEMENT, DEPENDENCY_OVERRIDE_FORM}" }

  - name: SupportCase
    parent: null
    common_fields: true
    fields:
      - { name: senior_record_id, type: string, source: input, description: "FK -> SeniorRecord.id" }
      - { name: assigned_specialist_id, type: string, source: computed, description: "FK -> StaffProfile.id; null when selector pool empty" }
      - { name: case_type, type: enum, source: input, description: "VERIFICATION_FOLLOWUP | SPECIAL_CIRCUMSTANCE" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REVIEW | AWAITING_FAMILY | ESCALATED | PAUSED | RESOLVED | CANCELLED" }
      - { name: previous_status, type: enum, source: system, description: "Status captured when PAUSED; restored on resume; null otherwise", default: null }
      - { name: resolution_outcome, type: enum, source: system, description: "VERIFICATION_COMPLETED | INDEPENDENT_CONFIRMED | NOT_QUALIFIED; null until resolved", default: null }
      - { name: notes, type: string, source: input, description: "Free-form case notes", default: "" }

  - name: CompletionReport
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: variant, type: enum, source: input, description: "SUBMISSION_BASED | PROCESSED_BASED" }
      - { name: status, type: enum, source: system, description: "GENERATED | PUBLISHED | SUPERSEDED" }
      - { name: rows, type: array, source: computed, description: "One object per surviving subgroup row: {dimension, key, eligible_count, completed_count, state_deadline_met_count, rate}; rows with eligible_count < min_subgroup_size suppressed" }
      - { name: eligible_count, type: integer, source: computed, description: "Campaign-wide eligible seniors (unsuppressed totals)" }
      - { name: completed_count, type: integer, source: computed, description: "Campaign-wide completed seniors per variant" }
      - { name: overall_rate, type: number, source: computed, description: "round_half_up(1000 * completed_count / eligible_count) / 10 from UNSUPPRESSED totals; null when eligible_count == 0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /fafsa/campaigns/{id}/activate"
        actor: CampaignAdmin
        preconditions:
          - "Campaign in DRAFT (ERR_CAMPAIGN_NOT_DRAFT)"
        side_effects: []
      - from: OPEN
        to: STATE_GRACE
        trigger: "system (POST /_clock/set_current_utc advances clock at or past state_grant_deadline)"
        actor: system
        preconditions:
          - "clock now >= campaign.state_grant_deadline and < federal_deadline"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "system (clock set at or past federal_deadline while OPEN)"
        actor: system
        preconditions:
          - "clock now >= campaign.federal_deadline"
        side_effects:
          - "CLOSE CASCADE: all DRAFT/PUBLISHED CompletionEvents of this campaign -> CANCELLED (their cancel cascades fire: non-terminal StaffAssignments -> CANCELLED with hours release, REGISTERED EventRegistrations -> CANCELLED, committed budget released)"
          - "All SupportCases of this campaign's seniors in {OPEN, IN_REVIEW, AWAITING_FAMILY, ESCALATED, PAUSED} -> CANCELLED; each assigned specialist's active_case_count decremented (OVERLOADED recovery re-evaluated)"
          - "IN_PROGRESS events are left for manual completion (not cancelled)"
      - from: STATE_GRACE
        to: CLOSED
        trigger: "system (clock set at or past federal_deadline while STATE_GRACE)"
        actor: system
        preconditions:
          - "clock now >= campaign.federal_deadline"
        side_effects:
          - "Same CLOSE CASCADE as OPEN -> CLOSED"

  - entity: School
    initial_state: INVITED
    terminal_states: []
    transitions:
      - from: INVITED
        to: ENROLLED
        trigger: "POST /fafsa/schools/{id}/enroll"
        actor: CampaignAdmin
        preconditions:
          - "School in INVITED (ERR_SCHOOL_NOT_INVITED)"
          - "Parent Campaign in OPEN (ERR_CAMPAIGN_NOT_OPEN)"
        side_effects: []
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /fafsa/schools/{id}/suspend"
        actor: CampaignAdmin
        preconditions:
          - "School in ENROLLED (ERR_SCHOOL_NOT_ENROLLED)"
        side_effects:
          - "All DRAFT/PUBLISHED CompletionEvents of this school -> CANCELLED (assignment/registration/budget cascades fire); COMPLETED/IN_PROGRESS events untouched"
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /fafsa/schools/{id}/reinstate"
        actor: CampaignAdmin
        preconditions:
          - "School in SUSPENDED (ERR_SCHOOL_NOT_SUSPENDED)"
          - "Parent Campaign in OPEN (ERR_CAMPAIGN_NOT_OPEN)"
        side_effects: []

  - entity: StaffProfile
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OVERLOADED
        trigger: "system (after a SupportCase assignment pushes active_case_count > campaign.max_caseload)"
        actor: system
        preconditions:
          - "active_case_count > max_caseload"
        side_effects:
          - "Excluded from specialist selector pool while OVERLOADED"
      - from: OVERLOADED
        to: ACTIVE
        trigger: "system (after a case resolve/cancel/pause drops active_case_count <= max_caseload)"
        actor: system
        preconditions:
          - "active_case_count <= max_caseload"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (event completion marks a NO_SHOW that brings no_show_count >= campaign.no_show_limit)"
        actor: system
        preconditions:
          - "no_show_count >= no_show_limit"
        side_effects:
          - "CONTAGION: this staff member's INVITED/ACCEPTED/CONFIRMED StaffAssignments on events with start_time > clock now -> CANCELLED (hours released for CONFIRMED)"
      - from: OVERLOADED
        to: SUSPENDED
        trigger: "system (same NO_SHOW threshold rule)"
        actor: system
        preconditions:
          - "no_show_count >= no_show_limit"
        side_effects:
          - "Same contagion cascade as ACTIVE -> SUSPENDED"

  - entity: SeniorRecord
    initial_state: "match_status=UNMATCHED, fafsa_status=NO_RECORD (parallel axes)"
    terminal_states: []
    transitions:
      # --- Axis 1: match_status ---
      - from: UNMATCHED
        to: SUGGESTED
        trigger: "POST /fafsa/match-links producing a SUGGESTED link for this senior"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNMATCHED
        to: MATCHED
        trigger: "POST /fafsa/match-links producing an AUTO_CONFIRMED link"
        actor: system
        preconditions: []
        side_effects:
          - "current_match_link_id set"
          - "fafsa_status initialized from linked AidRecord.current_status; submitted_at/deadline_classification recomputed; if status is VERIFICATION_SELECTED the verification auto-case cascade fires"
          - "MATCHED cascade: DocumentChecklist generated with template keyed on dependency_status"
      - from: SUGGESTED
        to: MATCHED
        trigger: "POST /fafsa/match-links/{id}/confirm"
        actor: MatchReviewer
        preconditions: []
        side_effects:
          - "Same MATCHED side effects as UNMATCHED -> MATCHED"
      - from: SUGGESTED
        to: UNMATCHED
        trigger: "POST /fafsa/match-links/{id}/reject"
        actor: MatchReviewer
        preconditions: []
        side_effects: []
      - from: MATCHED
        to: UNMATCHED
        trigger: "POST /fafsa/match-links/{id}/invalidate"
        actor: MatchReviewer
        preconditions: []
        side_effects:
          - "current_match_link_id cleared to null"
          - "fafsa_status retained (historical), but subsequent AidStatusEvents no longer propagate"
          - "DocumentChecklist for this senior -> ARCHIVED (items frozen)"
      # --- Axis 2: fafsa_status (projection-driven via confirmed link) ---
      - from: NO_RECORD
        to: STARTED
        trigger: "system (confirmed link applied or AidStatusEvent projection update)"
        actor: system
        preconditions: []
        side_effects: ["submitted_at/deadline_classification recomputed"]
      - from: NO_RECORD
        to: SUBMITTED
        trigger: "system (same)"
        actor: system
        preconditions: []
        side_effects: ["submitted_at/deadline_classification recomputed"]
      - from: NO_RECORD
        to: VERIFICATION_SELECTED
        trigger: "system (same)"
        actor: system
        preconditions: []
        side_effects: ["VERIFICATION CASCADE: auto-create SupportCase(VERIFICATION_FOLLOWUP) unless one is already non-terminal; selector assigns specialist and bumps active_case_count; if no GRANTED consent with STATUS_DETAIL the case starts PAUSED with previous_status=OPEN"]
      - from: NO_RECORD
        to: COMPLETE
        trigger: "system (same)"
        actor: system
        preconditions: []
        side_effects: ["submitted_at/deadline_classification recomputed"]
      - from: STARTED
        to: SUBMITTED
        trigger: "system (projection update)"
        actor: system
        preconditions: []
        side_effects: ["submitted_at/deadline_classification recomputed"]
      - from: STARTED
        to: VERIFICATION_SELECTED
        trigger: "system (projection update)"
        actor: system
        preconditions: []
        side_effects: ["VERIFICATION CASCADE (as above)"]
      - from: STARTED
        to: COMPLETE
        trigger: "system (projection update)"
        actor: system
        preconditions: []
        side_effects: ["submitted_at/deadline_classification recomputed"]
      - from: SUBMITTED
        to: VERIFICATION_SELECTED
        trigger: "system (projection update)"
        actor: system
        preconditions: []
        side_effects: ["VERIFICATION CASCADE (as above)"]
      - from: SUBMITTED
        to: COMPLETE
        trigger: "system (projection update)"
        actor: system
        preconditions: []
        side_effects:
          - "submitted_at/deadline_classification recomputed"
          - "AUTO-RESOLVE: open VERIFICATION_FOLLOWUP case (any of OPEN/IN_REVIEW/AWAITING_FAMILY/ESCALATED) -> RESOLVED with resolution_outcome=VERIFICATION_COMPLETED; specialist active_case_count decremented"
      - from: VERIFICATION_SELECTED
        to: COMPLETE
        trigger: "system (projection update)"
        actor: system
        preconditions: []
        side_effects:
          - "submitted_at/deadline_classification recomputed"
          - "AUTO-RESOLVE (as above)"
      - from: VERIFICATION_SELECTED
        to: SUBMITTED
        trigger: "system (projection update; agency correction)"
        actor: system
        preconditions: []
        side_effects: ["submitted_at/deadline_classification recomputed"]

  - entity: AidRecord
    initial_state: "current_status = initial_status from create"
    terminal_states: []
    transitions:
      - from: ANY
        to: "<event status>"
        trigger: "POST /fafsa/aid-records/{id}/status-events (projection)"
        actor: system
        preconditions:
          - "event.effective_date >= current last_effective_date (else event stored but projection unchanged)"
        side_effects:
          - "current_status and last_effective_date updated from winning event (max by effective_date, tie -> max created_at)"
          - "If a CONFIRMED/AUTO_CONFIRMED MatchLink points at this AidRecord, the linked SeniorRecord.fafsa_status transition fires (with its cascades)"

  - entity: MatchLink
    initial_state: "SUGGESTED | AUTO_CONFIRMED | AUTO_REJECTED (by score band)"
    terminal_states: [REJECTED, AUTO_REJECTED, INVALIDATED]
    transitions:
      - from: SUGGESTED
        to: CONFIRMED
        trigger: "POST /fafsa/match-links/{id}/confirm"
        actor: MatchReviewer
        preconditions:
          - "Link in SUGGESTED (ERR_MATCH_LINK_NOT_SUGGESTED)"
        side_effects:
          - "SeniorRecord match axis UNMATCHED/SUGGESTED -> MATCHED with its cascades"
      - from: SUGGESTED
        to: REJECTED
        trigger: "POST /fafsa/match-links/{id}/reject"
        actor: MatchReviewer
        preconditions:
          - "Link in SUGGESTED (ERR_MATCH_LINK_NOT_SUGGESTED)"
        side_effects:
          - "SeniorRecord match axis SUGGESTED -> UNMATCHED"
      - from: CONFIRMED
        to: INVALIDATED
        trigger: "POST /fafsa/match-links/{id}/invalidate"
        actor: MatchReviewer
        preconditions:
          - "Link in CONFIRMED or AUTO_CONFIRMED (ERR_MATCH_LINK_NOT_CONFIRMED)"
        side_effects:
          - "SeniorRecord match axis MATCHED -> UNMATCHED cascade (checklist ARCHIVED)"
      - from: AUTO_CONFIRMED
        to: INVALIDATED
        trigger: "POST /fafsa/match-links/{id}/invalidate"
        actor: MatchReviewer
        preconditions:
          - "Link in CONFIRMED or AUTO_CONFIRMED (ERR_MATCH_LINK_NOT_CONFIRMED)"
        side_effects:
          - "Same as CONFIRMED -> INVALIDATED"

  - entity: ConsentRecord
    initial_state: GRANTED
    terminal_states: []
    transitions:
      - from: GRANTED
        to: REVOKED
        trigger: "POST /fafsa/consent-records/{id}/revoke"
        actor: SchoolCoordinator
        preconditions:
          - "Consent in GRANTED (ERR_CONSENT_NOT_GRANTED)"
        side_effects:
          - "SeniorRecord.data_visibility -> RESTRICTED"
          - "That visibility flip cascades: this senior's SupportCases in {OPEN, IN_REVIEW, AWAITING_FAMILY, ESCALATED} -> PAUSED with previous_status preserved; each pause decrements the assigned specialist's active_case_count (OVERLOADED recovery re-evaluated)"
          - "This senior's REGISTERED EventRegistrations -> CANCELLED (capacity freed)"
      - from: REVOKED
        to: GRANTED
        trigger: "POST /fafsa/consent-records/{id}/regrant"
        actor: SchoolCoordinator
        preconditions:
          - "Consent in REVOKED (ERR_CONSENT_NOT_REVOKED)"
          - "No other GRANTED consent exists for this senior (ERR_CONSENT_ALREADY_ACTIVE)"
        side_effects:
          - "SeniorRecord.data_visibility -> NORMAL"
          - "PAUSED SupportCases of this senior resume to their previous_status; specialist active_case_count re-incremented"
          - "EventRegistrations are NOT auto-restored (asymmetric compensation)"
      - from: GRANTED
        to: EXPIRED
        trigger: "system (clock set past expires_at)"
        actor: system
        preconditions:
          - "expires_at non-null and clock now >= expires_at"
        side_effects:
          - "Same cascade as GRANTED -> REVOKED"

  - entity: CompletionEvent
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /fafsa/events/{id}/publish"
        actor: SchoolCoordinator
        preconditions:
          - "Event in DRAFT (ERR_EVENT_NOT_DRAFT)"
          - "start_time > clock now (ERR_EVENT_IN_PAST)"
          - "Venue buffer: no PUBLISHED/IN_PROGRESS event at same school whose window is within 30 minutes of this window (ERR_EVENT_OVERLAP_BUFFER)"
          - "Staffing invariant: CONFIRMED EXPERT assignments >= required_expert_count AND every language in supported_languages held by >= 1 CONFIRMED assignee (ERR_STAFFING_INVARIANT_NOT_MET)"
          - "Budget: committed + cost_estimate_cents <= total_budget_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "Campaign.committed_budget_cents += cost_estimate_cents (increments Campaign.version)"
      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /fafsa/events/{id}/unpublish"
        actor: SchoolCoordinator
        preconditions:
          - "Event in PUBLISHED (ERR_EVENT_NOT_PUBLISHED)"
        side_effects:
          - "Campaign.committed_budget_cents -= cost_estimate_cents (increments Campaign.version)"
          - "REGISTERED EventRegistrations -> CANCELLED; StaffAssignments unchanged"
      - from: PUBLISHED
        to: IN_PROGRESS
        trigger: "system (clock set at or past start_time)"
        actor: system
        preconditions:
          - "clock now >= start_time"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /fafsa/events/{id}/complete"
        actor: SchoolCoordinator
        preconditions:
          - "Event in IN_PROGRESS (ERR_EVENT_NOT_IN_PROGRESS)"
          - "Fiscal: spent + actual_cost_cents <= total_budget_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "Campaign.committed_budget_cents -= cost_estimate_cents; spent_budget_cents += actual_cost_cents"
          - "INVITED/ACCEPTED StaffAssignments -> CANCELLED"
          - "CONFIRMED StaffAssignments -> NO_SHOW; staff no_show_count++ ; if no_show_count >= no_show_limit the SUSPENDED contagion cascade fires"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fafsa/events/{id}/cancel (or cascade: school suspend / campaign close)"
        actor: SchoolCoordinator
        preconditions:
          - "Event in DRAFT or PUBLISHED (ERR_EVENT_NOT_CANCELLABLE)"
        side_effects:
          - "Non-terminal StaffAssignments (INVITED/ACCEPTED/CONFIRMED) -> CANCELLED; CONFIRMED hours released"
          - "REGISTERED EventRegistrations -> CANCELLED"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /fafsa/events/{id}/cancel (or cascade)"
        actor: SchoolCoordinator
        preconditions:
          - "Event in DRAFT or PUBLISHED (ERR_EVENT_NOT_CANCELLABLE)"
        side_effects:
          - "Campaign.committed_budget_cents -= cost_estimate_cents"
          - "Same assignment/registration cascades as DRAFT -> CANCELLED"

  - entity: StaffAssignment
    initial_state: INVITED
    terminal_states: [CHECKED_IN, NO_SHOW, DECLINED, CANCELLED]
    transitions:
      - from: INVITED
        to: ACCEPTED
        trigger: "POST /fafsa/staff-assignments/{id}/accept"
        actor: StaffMember
        preconditions:
          - "Assignment in INVITED (ERR_ASSIGNMENT_NOT_INVITED)"
          - "X-User-ID == staff_profile_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: []
      - from: INVITED
        to: DECLINED
        trigger: "POST /fafsa/staff-assignments/{id}/decline"
        actor: StaffMember
        preconditions:
          - "Assignment in INVITED (ERR_ASSIGNMENT_NOT_INVITED)"
          - "X-User-ID == staff_profile_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: []
      - from: ACCEPTED
        to: CONFIRMED
        trigger: "POST /fafsa/staff-assignments/{id}/confirm"
        actor: SchoolCoordinator
        preconditions:
          - "Assignment in ACCEPTED (ERR_ASSIGNMENT_NOT_ACCEPTED)"
          - "Staff background_check_status == CLEARED (ERR_BACKGROUND_CHECK_NOT_CLEARED)"
          - "No double-booking: staff has no CONFIRMED/CHECKED_IN assignment on an event whose [start,end) overlaps this event's (half-open; touching endpoints allowed) (ERR_STAFF_DOUBLE_BOOKED)"
        side_effects:
          - "StaffProfile.confirmed_hours_total += duration_hours"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /fafsa/staff-assignments/{id}/check-in"
        actor: SchoolCoordinator
        preconditions:
          - "Assignment in CONFIRMED (ERR_ASSIGNMENT_NOT_CONFIRMED)"
          - "Parent event in IN_PROGRESS (ERR_EVENT_NOT_IN_PROGRESS)"
        side_effects: []
      - from: INVITED
        to: CANCELLED
        trigger: "POST /fafsa/staff-assignments/{id}/cancel (or cascades)"
        actor: SchoolCoordinator
        preconditions:
          - "Assignment in INVITED/ACCEPTED/CONFIRMED (ERR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects: []
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /fafsa/staff-assignments/{id}/cancel (or cascades)"
        actor: SchoolCoordinator
        preconditions:
          - "Assignment in INVITED/ACCEPTED/CONFIRMED (ERR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /fafsa/staff-assignments/{id}/cancel (or cascades)"
        actor: SchoolCoordinator
        preconditions:
          - "Assignment in INVITED/ACCEPTED/CONFIRMED (ERR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects:
          - "StaffProfile.confirmed_hours_total -= duration_hours (compensation)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "system (event completion)"
        actor: system
        preconditions: []
        side_effects:
          - "StaffProfile.confirmed_hours_total -= duration_hours"
          - "StaffProfile.no_show_count += 1; threshold check for SUSPENDED"

  - entity: EventRegistration
    initial_state: REGISTERED
    terminal_states: [CANCELLED]
    transitions:
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /fafsa/event-registrations/{id}/cancel (or cascades: event cancel/unpublish, consent revoke/expire, campaign close)"
        actor: SchoolCoordinator
        preconditions:
          - "Registration in REGISTERED (ERR_REGISTRATION_NOT_ACTIVE)"
        side_effects: []

  - entity: DocumentChecklist
    initial_state: GENERATED
    terminal_states: [ARCHIVED]
    transitions:
      - from: GENERATED
        to: IN_PROGRESS
        trigger: "system (first ChecklistItem leaves PENDING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "system (every item in {VERIFIED, WAIVED})"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLETE
        to: IN_PROGRESS
        trigger: "system (special-circumstance regeneration appends PENDING items, or an item re-enters PENDING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GENERATED
        to: ARCHIVED
        trigger: "system (match link invalidated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: ARCHIVED
        trigger: "system (match link invalidated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLETE
        to: ARCHIVED
        trigger: "system (match link invalidated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ChecklistItem
    initial_state: PENDING
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: PENDING
        to: RECEIVED
        trigger: "POST /fafsa/checklist-items/{id}/receive"
        actor: SchoolCoordinator
        preconditions:
          - "Item in PENDING or REJECTED (ERR_ITEM_NOT_PENDING)"
          - "Parent checklist in GENERATED/IN_PROGRESS (ERR_CHECKLIST_ARCHIVED)"
        side_effects: ["Checklist status re-evaluated"]
      - from: REJECTED
        to: RECEIVED
        trigger: "POST /fafsa/checklist-items/{id}/receive"
        actor: SchoolCoordinator
        preconditions:
          - "Item in PENDING or REJECTED (ERR_ITEM_NOT_PENDING)"
        side_effects: ["Checklist status re-evaluated"]
      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /fafsa/checklist-items/{id}/verify"
        actor: SchoolCoordinator
        preconditions:
          - "Item in RECEIVED (ERR_ITEM_NOT_RECEIVED)"
        side_effects: ["Checklist status re-evaluated (may flip to COMPLETE)"]
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /fafsa/checklist-items/{id}/reject"
        actor: SchoolCoordinator
        preconditions:
          - "Item in RECEIVED (ERR_ITEM_NOT_RECEIVED)"
        side_effects: ["Checklist status re-evaluated"]
      - from: PENDING
        to: WAIVED
        trigger: "POST /fafsa/checklist-items/{id}/waive (or system auto-waive on regeneration)"
        actor: Specialist
        preconditions:
          - "Item in PENDING (ERR_ITEM_NOT_PENDING)"
          - "Item waivable (ERR_ITEM_NOT_WAIVABLE)"
          - "Acting specialist has a non-terminal SupportCase for this senior (ERR_CASE_NOT_FOUND_FOR_SPECIALIST)"
        side_effects: ["Checklist status re-evaluated (may flip to COMPLETE)"]

  - entity: SupportCase
    initial_state: "OPEN (PAUSED with previous_status=OPEN when created without STATUS_DETAIL consent)"
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /fafsa/support-cases/{id}/accept"
        actor: Specialist
        preconditions:
          - "Case in OPEN (ERR_CASE_NOT_ACTIONABLE)"
          - "assigned_specialist_id non-null (ERR_CASE_UNASSIGNED)"
          - "X-User-ID == assigned_specialist_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: []
      - from: IN_REVIEW
        to: AWAITING_FAMILY
        trigger: "POST /fafsa/support-cases/{id}/request-documents"
        actor: Specialist
        preconditions:
          - "Case in IN_REVIEW (ERR_CASE_NOT_ACTIONABLE)"
          - "X-User-ID == assigned_specialist_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: []
      - from: AWAITING_FAMILY
        to: IN_REVIEW
        trigger: "POST /fafsa/support-cases/{id}/documents-received"
        actor: Specialist
        preconditions:
          - "Case in AWAITING_FAMILY (ERR_CASE_NOT_ACTIONABLE)"
          - "X-User-ID == assigned_specialist_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: []
      - from: IN_REVIEW
        to: ESCALATED
        trigger: "POST /fafsa/support-cases/{id}/escalate"
        actor: Specialist
        preconditions:
          - "Case in IN_REVIEW or AWAITING_FAMILY (ERR_CASE_NOT_ACTIONABLE)"
          - "X-User-ID == assigned_specialist_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: []
      - from: AWAITING_FAMILY
        to: ESCALATED
        trigger: "POST /fafsa/support-cases/{id}/escalate"
        actor: Specialist
        preconditions:
          - "Case in IN_REVIEW or AWAITING_FAMILY (ERR_CASE_NOT_ACTIONABLE)"
          - "X-User-ID == assigned_specialist_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects: []
      - from: IN_REVIEW
        to: RESOLVED
        trigger: "POST /fafsa/support-cases/{id}/resolve"
        actor: Specialist
        preconditions:
          - "Case in IN_REVIEW or ESCALATED (ERR_CASE_NOT_ACTIONABLE)"
          - "X-User-ID == assigned_specialist_id (ERR_OWNERSHIP_VIOLATION)"
          - "VERIFICATION_FOLLOWUP: senior's DocumentChecklist status == COMPLETE (ERR_CHECKLIST_NOT_COMPLETE); resolution_outcome forced VERIFICATION_COMPLETED"
          - "SPECIAL_CIRCUMSTANCE: payload resolution_outcome in {INDEPENDENT_CONFIRMED, NOT_QUALIFIED} required (ERR_DETERMINATION_REQUIRED)"
        side_effects:
          - "assigned specialist active_case_count -= 1 (OVERLOADED recovery re-evaluated)"
          - "If SPECIAL_CIRCUMSTANCE resolved INDEPENDENT_CONFIRMED: SeniorRecord.dependency_status DEPENDENT/PENDING_REVIEW -> INDEPENDENT; REGENERATION: existing checklist (if any) re-templated to INDEPENDENT_STANDARD — items whose doc_type is not in the new template and whose status is PENDING/REJECTED -> WAIVED (system); RECEIVED/VERIFIED items kept; missing new-template items appended PENDING; checklist status re-evaluated (COMPLETE -> IN_PROGRESS possible)"
          - "If SPECIAL_CIRCUMSTANCE resolved NOT_QUALIFIED: dependency_status PENDING_REVIEW -> DEPENDENT"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /fafsa/support-cases/{id}/resolve"
        actor: Specialist
        preconditions: ["Same as IN_REVIEW -> RESOLVED"]
        side_effects: ["Same as IN_REVIEW -> RESOLVED"]
      - from: OPEN
        to: PAUSED
        trigger: "system (consent revoke/expire cascade)"
        actor: system
        preconditions: []
        side_effects: ["previous_status <- OPEN; specialist active_case_count -= 1"]
      - from: IN_REVIEW
        to: PAUSED
        trigger: "system (consent cascade)"
        actor: system
        preconditions: []
        side_effects: ["previous_status <- IN_REVIEW; specialist active_case_count -= 1"]
      - from: AWAITING_FAMILY
        to: PAUSED
        trigger: "system (consent cascade)"
        actor: system
        preconditions: []
        side_effects: ["previous_status <- AWAITING_FAMILY; specialist active_case_count -= 1"]
      - from: ESCALATED
        to: PAUSED
        trigger: "system (consent cascade)"
        actor: system
        preconditions: []
        side_effects: ["previous_status <- ESCALATED; specialist active_case_count -= 1"]
      - from: PAUSED
        to: "<previous_status>"
        trigger: "system (consent regrant cascade)"
        actor: system
        preconditions: []
        side_effects: ["status <- previous_status; previous_status <- null; specialist active_case_count += 1 (OVERLOADED re-evaluated)"]

  - entity: CompletionReport
    initial_state: GENERATED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: GENERATED
        to: PUBLISHED
        trigger: "POST /fafsa/completion-reports/{id}/publish"
        actor: CampaignAdmin
        preconditions:
          - "Report in GENERATED (ERR_REPORT_NOT_GENERATED)"
          - "OCC: expected_campaign_version matches Campaign.version (ERR_STALE_VERSION)"
          - "Campaign in OPEN or STATE_GRACE (ERR_CAMPAIGN_NOT_OPEN)"
        side_effects:
          - "Prior PUBLISHED report of this campaign -> SUPERSEDED"
          - "recognition_tier recomputed for all schools (recognition_tier calc)"
          - "increments Campaign.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (a different report of the same campaign is published)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; both pass the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: match-link-create-stale-senior
    parent_entity: SeniorRecord
    write_endpoint: "POST /fafsa/match-links"
    occ_field: expected_senior_record_version
    description: |
      Creating a MatchLink against a SeniorRecord whose version has advanced
      since the client last observed it is rejected. Creating a link mutates
      the senior (match axis + version bump); a reviewer acting on a stale
      view (e.g., after a prior AUTO_REJECTED link already advanced the
      version) must re-read before proposing another match.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: report-publish-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /fafsa/completion-reports/{id}/publish"
    occ_field: expected_campaign_version
    description: |
      Publishing a CompletionReport against a Campaign whose version has
      advanced since the client last observed it is rejected. Publication
      supersedes the currently published report; the supersede decision must
      be based on the current campaign view (budget commits, status flips,
      and prior publishes all advance Campaign.version).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: match_score
    trigger: "POST /fafsa/match-links (computed once at creation, then frozen)"
    algorithm: weighted_scoring
    formula: |
      components (all deterministic string/date equality, case-insensitive trimmed for names):
        dob_exact          = (SeniorRecord.dob == AidRecord.dob)                                -> weight 0.40
        name_exact         = (SeniorRecord.full_name == AidRecord.full_name, case-insensitive)  -> weight 0.35
        school_code_match  = (SeniorRecord.school.school_code == AidRecord.school_code)         -> weight 0.15
        district_match     = (SeniorRecord.school.district_code == AidRecord.district_code)     -> weight 0.10
      match_score = sum of weights of true components (0.00 .. 1.00, exact tenths arithmetic)
      Band assignment (uses parent Campaign thresholds):
        score >= auto_confirm_threshold            -> initial status AUTO_CONFIRMED
        review_floor <= score < auto_confirm_threshold -> initial status SUGGESTED
        score < review_floor                        -> initial status AUTO_REJECTED
    input_set: "The SeniorRecord and AidRecord named in the request (must share campaign)"
    constants:
      W_DOB: 0.40
      W_NAME: 0.35
      W_SCHOOL: 0.15
      W_DISTRICT: 0.10
    precision: "2 decimal places, exact decimal arithmetic (weights sum to 1.00)"

  - name: completion_rate
    trigger: "POST /fafsa/completion-reports (rows and totals frozen at generation)"
    algorithm: aggregation
    formula: |
      eligible(S) for a senior S of the campaign, ALL required:
        S.match_status == MATCHED
        exists ConsentRecord for S with status == GRANTED and scope DATA_SHARE in scopes
        S.school.status == ENROLLED
      completed(S): per variant:
        SUBMISSION_BASED: S.fafsa_status in {SUBMITTED, VERIFICATION_SELECTED, COMPLETE}
        PROCESSED_BASED:  S.fafsa_status == COMPLETE
      state_deadline_met(S): S.submitted_at != null and S.submitted_at <= campaign.state_grant_deadline
      Rows computed for dimensions LANGUAGE (home_language), EFC_BAND, SCHOOL (school id+name as key):
        per key: eligible_count, completed_count, state_deadline_met_count
        row.rate = round_half_up(1000 * completed_count / eligible_count) / 10  (1 decimal, percent)
        row suppressed (omitted from rows[]) when eligible_count < campaign.min_subgroup_size
      Campaign totals use UNSUPPRESSED data (suppressed students still count in totals):
        eligible_count, completed_count
        overall_rate = round_half_up(1000 * completed_count / eligible_count) / 10
        overall_rate = null when eligible_count == 0
      NOTE (rounding order pinned): overall_rate is ALWAYS computed from totals,
      never as an average of the rounded row rates.
    input_set: "All SeniorRecords whose school.campaign_id == report.campaign_id, filtered as above"
    precision: "rates to 1 decimal place, round_half_up"
    variants:
      - name: SUBMISSION_BASED
        when: "report.variant == SUBMISSION_BASED"
        difference: "completed set includes SUBMITTED and VERIFICATION_SELECTED (counts intent-to-file)"
      - name: PROCESSED_BASED
        when: "report.variant == PROCESSED_BASED"
        difference: "completed set restricted to COMPLETE (fully processed only)"

  - name: deadline_classification
    trigger: "On every SeniorRecord fafsa axis projection update and on campaign activation"
    algorithm: threshold
    formula: |
      submitted_at = min(effective_date) over the linked AidRecord's AidStatusEvents
                     with fafsa_status in {SUBMITTED, VERIFICATION_SELECTED, COMPLETE};
                     null when the senior has no confirmed link or no such event.
      classification:
        submitted_at == null                          -> NOT_SUBMITTED
        submitted_at <= state_grant_deadline          -> ON_TRACK_STATE   (inclusive)
        state_grant_deadline < submitted_at <= federal_deadline -> STATE_MISSED_FEDERAL_OPEN
        submitted_at > federal_deadline               -> LATE
      Date comparison at day granularity (a datetime is truncated to its UTC date first).
    input_set: "AidStatusEvents of the AidRecord referenced by SeniorRecord.current_match_link_id"
    precision: "day granularity, inclusive upper bounds"

  - name: event_staffing_coverage
    trigger: "GET /fafsa/events/{id} (computed on read; also gates publish with the COMMITTED_ONLY variant)"
    algorithm: aggregation
    formula: |
      Let E = confirmed EXPERT assignments (status == CONFIRMED, assigned_role == EXPERT)
      Let V = confirmed assignments of any role (status == CONFIRMED)
      committed_expert_ratio = E / max(required_expert_count, 1)
      language_covered(lang) = exists CONFIRMED assignment whose staff.languages contains lang
      committed_language_complete = all languages in supported_languages covered
      Publish uses COMMITTED_ONLY: E >= required_expert_count AND committed_language_complete.
      (With required_expert_count == 0 and supported_languages == [] the invariant
      is trivially satisfied; the ratio fields remain display-only.)
      Response object staffing_coverage exposes BOTH variants for identical data:
        committed:  { expert_ratio: E / max(required_expert_count,1), staff_count: V,
                      language_complete: committed_language_complete }
        pipeline:   same fields computed over statuses {ACCEPTED, CONFIRMED}
      Ratios emitted with 2 decimals, round_half_up.
    input_set: "StaffAssignments of this event, filtered by status per variant"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: committed
        when: "publish gating and the committed block of staffing_coverage"
        difference: "only CONFIRMED assignments count"
      - name: pipeline
        when: "the pipeline block of staffing_coverage"
        difference: "ACCEPTED and CONFIRMED assignments count (optimistic view)"

  - name: recognition_tier
    trigger: "POST /fafsa/completion-reports/{id}/publish (recomputed for all schools of the campaign)"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency pinned to a strict evaluation order:
      (1) raw_rate[s] = SUBMISSION_BASED completion rate (percent, 1 decimal) for every
          school s with status ENROLLED, using the same eligibility filter as completion_rate.
      (2) Eligible-for-ranking set R = { s : eligible seniors of s >= campaign.min_recognition_seniors }.
          Schools outside R get recognition_tier = UNRATED.
      (3) Distribution cutoffs over sorted ascending rates of R (N = |R|):
            c70 = value at 1-based index ceil(0.70 * N)
            c40 = value at 1-based index ceil(0.40 * N)
      (4) Tier per school in R: rate >= c70 -> GOLD; rate >= c40 -> SILVER; else BRONZE.
          (Boundaries inclusive: a rate exactly equal to a cutoff takes the higher tier.)
      A school's own rate participates in the distribution that sets its cutoffs;
      the pinned order (rates -> cutoffs -> tiers) makes the result well-defined.
    input_set: "Schools of the campaign with status ENROLLED"
    constants:
      GOLD_PCT: 70
      SILVER_PCT: 40
    precision: "rates 1 decimal before ranking; nearest-rank percentile via ceil"

  - name: subgroup_suppression
    trigger: "Inside completion_rate row materialization"
    algorithm: threshold
    formula: |
      For each candidate row: if eligible_count < campaign.min_subgroup_size -> row omitted.
      eligible_count == min_subgroup_size is INCLUDED (strict less-than suppression).
      Totals (eligible_count, completed_count, overall_rate) always include suppressed students.
    input_set: "Candidate report rows"
    precision: "integer counts, strict < comparison"

  - name: specialist_selection
    trigger: "SupportCase creation (auto verification case or manual POST /fafsa/support-cases)"
    algorithm: selector_policy
    formula: |
      Candidate pool: StaffProfiles of the same campaign with
        capability CASE_SPECIALIST in capabilities AND status == ACTIVE.
      Ranking (deterministic, no id usage):
        1. language_match DESC (1 if senior.home_language in staff.languages else 0)
        2. active_case_count ASC
        3. created_at ASC   (final tie-break; never id)
      Winner gets assigned_specialist_id; winner.active_case_count += 1;
      if that pushes the winner OVER campaign.max_caseload -> status OVERLOADED.
      Empty pool: assigned_specialist_id stays null; case remains OPEN until
      POST /fafsa/support-cases/{id}/assign is used.
    input_set: "StaffProfiles with campaign_id == senior.school.campaign_id"
    precision: "integer counts"

  - name: staff_hours_accrual
    trigger: "StaffAssignment confirm (+), cancel of CONFIRMED (-), NO_SHOW marking (-)"
    algorithm: aggregation
    formula: |
      duration_hours(a) = (event.end_time - event.start_time) / 3600, 2 decimals round_half_up
      confirmed_hours_total = sum(duration_hours) over the staff member's assignments
                              with status in {CONFIRMED, CHECKED_IN}
      INVARIANT: confirm followed by cancel of the same assignment returns
      confirmed_hours_total to its pre-confirm value exactly.
    input_set: "StaffAssignments of the StaffProfile"
    precision: "2 decimal places, round_half_up per assignment before summation"

  - name: caseload_invariant
    trigger: "Case create/assign (+), resolve/cancel (-), pause (-), resume (+)"
    algorithm: aggregation
    formula: |
      active_case_count(p) = count of SupportCases with assigned_specialist_id == p.id
                             and status in {OPEN, IN_REVIEW, AWAITING_FAMILY, ESCALATED}
      INVARIANT: a consent revoke (pause) followed by regrant (resume) of the same
      consent returns active_case_count to its pre-revoke value exactly.
      OVERLOADED flip: count > campaign.max_caseload -> OVERLOADED;
      recovery when count <= campaign.max_caseload.
    input_set: "SupportCases assigned to the StaffProfile"
    precision: "integer counts"

  - name: budget_ledger
    trigger: "Event publish (+committed), unpublish/cancel (-committed), complete (-committed, +spent)"
    algorithm: waterfall_allocation
    formula: |
      committed_budget_cents = sum(cost_estimate_cents) over events in {PUBLISHED, IN_PROGRESS}
      spent_budget_cents     = sum(actual_cost_cents)   over events in {COMPLETED}
      budget_balance_cents   = total_budget_cents - committed_budget_cents - spent_budget_cents
      INVARIANT: publish followed by cancel of the same event returns
      budget_balance_cents to its pre-publish value exactly.
      Publish gate: committed + cost_estimate_cents <= total_budget_cents (ERR_BUDGET_EXCEEDED)
      Complete gate: spent + actual_cost_cents   <= total_budget_cents (ERR_BUDGET_EXCEEDED)
    input_set: "CompletionEvents whose school.campaign_id == campaign.id"
    precision: "integer cents"

  - name: overlap_checks
    trigger: "StaffAssignment create and confirm (staff); CompletionEvent publish (venue)"
    algorithm: interval_merge
    formula: |
      STAFF DOUBLE-BOOKING (resource: StaffProfile; half-open intervals):
        For new event window [s1,e1) vs each existing CONFIRMED/CHECKED_IN assignment's
        event window [s2,e2): conflict iff s1 < e2 AND s2 < e1.
        Touching endpoints (e1 == s2 or e2 == s1) are ALLOWED.
        Checked at create against CONFIRMED/CHECKED_IN; re-checked at confirm against
        CONFIRMED/CHECKED_IN (state may have changed since create).
      VENUE BUFFER (resource: School; buffered intervals):
        At publish, for each PUBLISHED/IN_PROGRESS event of the same school with
        window [s2,e2): conflict iff the gap between the windows is < 30 minutes,
        i.e. overlap OR (s1 - e2) < 30min when s1 >= e2 OR (s2 - e1) < 30min when s2 >= e1.
        A gap of exactly 30 minutes is ALLOWED (>= comparison).
    input_set: "StaffAssignments / CompletionEvents as scoped above"
    constants:
      VENUE_BUFFER_MINUTES: 30
    precision: "minute granularity"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 2
    category: auth
    check: "Scope/ownership: SchoolCoordinator may only touch own school's resources (school_id == X-User-ID); StaffMember/Specialist may only act on own assignments/cases"
    error_id: "ERR_SCHOOL_SCOPE_VIOLATION | ERR_OWNERSHIP_VIOLATION"
    http_status: 403
    applies_to: "scoped write endpoints"
  - priority: 3
    category: existence
    check: "Request shape: required fields present, no unknown fields, enum values valid, datetime/date/integer formats parse"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Path ids and body FK references exist, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND (per resource)"
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "Target entity in a state that permits the operation (per §1.2 preconditions; includes campaign OPEN/STATE_GRACE gates and school ENROLLED gates)"
    error_id: "state error family (ERR_CAMPAIGN_NOT_OPEN, ERR_SCHOOL_NOT_ENROLLED, ERR_EVENT_NOT_DRAFT, ERR_EVENT_NOT_PUBLISHED, ERR_EVENT_NOT_IN_PROGRESS, ERR_EVENT_NOT_CANCELLABLE, ERR_ASSIGNMENT_NOT_INVITED, ERR_ASSIGNMENT_NOT_ACCEPTED, ERR_ASSIGNMENT_NOT_CONFIRMED, ERR_ASSIGNMENT_NOT_CANCELLABLE, ERR_MATCH_LINK_NOT_SUGGESTED, ERR_MATCH_LINK_NOT_CONFIRMED, ERR_CASE_NOT_ACTIONABLE, ERR_CASE_UNASSIGNED, ERR_REGISTRATION_NOT_ACTIVE, ERR_ITEM_NOT_PENDING, ERR_ITEM_NOT_RECEIVED, ERR_CHECKLIST_ARCHIVED, ERR_REPORT_NOT_GENERATED, ERR_CONSENT_NOT_GRANTED, ERR_CONSENT_NOT_REVOKED, ERR_SCHOOL_NOT_INVITED, ERR_SCHOOL_NOT_SUSPENDED, ERR_CAMPAIGN_NOT_DRAFT)"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 6
    category: business_safety
    check: "Privacy consent: operation needs a GRANTED ConsentRecord with the required scope for the senior (OUTREACH for event registration)"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 403
    applies_to: "POST /fafsa/event-registrations"
  - priority: 6
    category: business_safety
    check: "Staff background_check_status == CLEARED before confirming an assignment"
    error_id: ERR_BACKGROUND_CHECK_NOT_CLEARED
    http_status: 409
    applies_to: "POST /fafsa/staff-assignments/{id}/confirm"
  - priority: 7
    category: business_referential
    check: "Cross-aggregate integrity: match link senior+aid record share one campaign; staff assignment's staff and event share one campaign"
    error_id: ERR_CROSS_CAMPAIGN_REFERENCE
    http_status: 422
    applies_to: "POST /fafsa/match-links, POST /fafsa/staff-assignments"
  - priority: 8
    category: business_temporal
    check: "Window sanity and overlap: event end_time > start_time (ERR_EVENT_WINDOW_INVALID); event start_time in future at create/publish (ERR_EVENT_IN_PAST); staff double-booking (ERR_STAFF_DOUBLE_BOOKED); venue 30-min buffer (ERR_EVENT_OVERLAP_BUFFER)"
    error_id: "ERR_EVENT_WINDOW_INVALID | ERR_EVENT_IN_PAST | ERR_STAFF_DOUBLE_BOOKED | ERR_EVENT_OVERLAP_BUFFER"
    http_status: 409
    applies_to: "POST /fafsa/events, POST /fafsa/events/{id}/publish, POST /fafsa/staff-assignments, POST /fafsa/staff-assignments/{id}/confirm"
  - priority: 9
    category: business_constraint
    check: "Uniqueness/capacity/aggregate constraints: student_ref unique per school (ERR_DUPLICATE_STUDENT_REF); external_ref unique per campaign (ERR_DUPLICATE_EXTERNAL_REF); one non-terminal MatchLink per senior (ERR_LINK_ALREADY_EXISTS); one non-terminal assignment per (event, staff) (ERR_DUPLICATE_ASSIGNMENT); one GRANTED consent per senior (ERR_CONSENT_ALREADY_ACTIVE); one non-terminal case per (senior, case_type) (ERR_CASE_ALREADY_OPEN); one REGISTERED registration per (event, senior) (ERR_DUPLICATE_REGISTRATION); capacity (ERR_EVENT_FULL); staffing invariant (ERR_STAFFING_INVARIANT_NOT_MET); capability match (ERR_STAFF_LACKS_CAPABILITY); waivability (ERR_ITEM_NOT_WAIVABLE); specialist has case for senior (ERR_CASE_NOT_FOUND_FOR_SPECIALIST); verification resolve needs COMPLETE checklist (ERR_CHECKLIST_NOT_COMPLETE); determination payload required (ERR_DETERMINATION_REQUIRED)"
    error_id: "constraint error family"
    http_status: 409
    applies_to: "create/action endpoints as listed"
  - priority: 10
    category: business_fiscal
    check: "Budget: publish requires committed + cost_estimate_cents <= total_budget_cents; complete requires spent + actual_cost_cents <= total_budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /fafsa/events/{id}/publish, POST /fafsa/events/{id}/complete"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# Roles: CampaignAdmin, SchoolCoordinator, StaffMember, Specialist, MatchReviewer,
# DataImporter. "ALL" below expands to all six roles.
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call): 2026-08-01T00:00:00Z. Advancing the clock fires system transitions: campaign OPEN->STATE_GRACE at state_grant_deadline, OPEN/STATE_GRACE->CLOSED at federal_deadline (with CLOSE CASCADE), PUBLISHED events -> IN_PROGRESS at start_time, GRANTED consents -> EXPIRED at expires_at."
    roles: [CampaignAdmin]
    code: 200
    input: [to_iso8601]
    output: { "now": "string" }
    side_effects: ["clock-driven system transitions as described"]

  # --- Campaign ---
  - method: POST
    path: "/fafsa/campaigns"
    description: "Create campaign in DRAFT"
    roles: [CampaignAdmin]
    code: 201
    input: [name, academic_year, state_grant_deadline, federal_deadline, total_budget_cents, "auto_confirm_threshold?", "review_floor?", "min_subgroup_size?", "max_caseload?", "no_show_limit?", "min_recognition_seniors?"]
    output: Campaign
    side_effects: ["budgets initialized to 0; status DRAFT"]
  - method: GET
    path: "/fafsa/campaigns"
    description: "List campaigns (paginated)"
    roles: [CampaignAdmin, SchoolCoordinator, StaffMember, Specialist, MatchReviewer, DataImporter]
    code: 200
    input: ["limit?", "offset?"]
    output: "Campaign[]"
    side_effects: []
  - method: GET
    path: "/fafsa/campaigns/{id}"
    description: "Get campaign incl. computed budget fields"
    roles: [CampaignAdmin, SchoolCoordinator, StaffMember, Specialist, MatchReviewer, DataImporter]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: POST
    path: "/fafsa/campaigns/{id}/activate"
    description: "DRAFT -> OPEN"
    roles: [CampaignAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: ["status -> OPEN"]

  # --- School ---
  - method: POST
    path: "/fafsa/schools"
    description: "Create school in INVITED"
    roles: [CampaignAdmin]
    code: 201
    input: [campaign_id, name, district_code, school_code]
    output: School
    side_effects: []
  - method: GET
    path: "/fafsa/schools"
    description: "List schools (filterable)"
    roles: [CampaignAdmin, SchoolCoordinator, StaffMember, Specialist, MatchReviewer, DataImporter]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: "School[]"
    side_effects: []
  - method: GET
    path: "/fafsa/schools/{id}"
    description: "Get school incl. recognition_tier"
    roles: [CampaignAdmin, SchoolCoordinator, StaffMember, Specialist, MatchReviewer, DataImporter]
    code: 200
    input: []
    output: School
    side_effects: []
  - method: POST
    path: "/fafsa/schools/{id}/enroll"
    description: "INVITED -> ENROLLED (campaign must be OPEN)"
    roles: [CampaignAdmin]
    code: 200
    input: []
    output: School
    side_effects: []
  - method: POST
    path: "/fafsa/schools/{id}/suspend"
    description: "ENROLLED -> SUSPENDED; cancels DRAFT/PUBLISHED events with cascades"
    roles: [CampaignAdmin]
    code: 200
    input: []
    output: School
    side_effects: ["event cancel cascades"]
  - method: POST
    path: "/fafsa/schools/{id}/reinstate"
    description: "SUSPENDED -> ENROLLED (campaign must be OPEN)"
    roles: [CampaignAdmin]
    code: 200
    input: []
    output: School
    side_effects: []

  # --- StaffProfile ---
  - method: POST
    path: "/fafsa/staff-profiles"
    description: "Create staff profile (ACTIVE, background PENDING)"
    roles: [CampaignAdmin]
    code: 201
    input: [campaign_id, full_name, capabilities, languages]
    output: StaffProfile
    side_effects: []
  - method: GET
    path: "/fafsa/staff-profiles"
    description: "List staff profiles (filterable)"
    roles: [CampaignAdmin, SchoolCoordinator, StaffMember, Specialist, MatchReviewer, DataImporter]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: "StaffProfile[]"
    side_effects: []
  - method: GET
    path: "/fafsa/staff-profiles/{id}"
    description: "Get staff profile incl. computed counters"
    roles: [CampaignAdmin, SchoolCoordinator, StaffMember, Specialist, MatchReviewer, DataImporter]
    code: 200
    input: []
    output: StaffProfile
    side_effects: []
  - method: POST
    path: "/fafsa/staff-profiles/{id}/background-check"
    description: "Record background check outcome"
    roles: [CampaignAdmin]
    code: 200
    input: [result]
    output: StaffProfile
    side_effects: ["background_check_status <- result (CLEARED | EXPIRED)"]

  # --- SeniorRecord ---
  - method: POST
    path: "/fafsa/senior-records"
    description: "Add senior-list record (school ENROLLED, campaign OPEN/STATE_GRACE); student_ref unique per school"
    roles: [SchoolCoordinator]
    code: 201
    input: [school_id, student_ref, full_name, dob, home_language, "subgroup_tags?", "efc_band?"]
    output: SeniorRecord
    side_effects: ["match_status UNMATCHED; fafsa_status NO_RECORD; dependency_status DEPENDENT"]
  - method: GET
    path: "/fafsa/senior-records"
    description: "List seniors (filterable; SchoolCoordinator scoped to own school; consent masking applies to fafsa_status/submitted_at/deadline_classification/current_match_link_id)"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist, MatchReviewer]
    code: 200
    input: ["school_id?", "match_status?", "fafsa_status?", "subgroup_tag?", "limit?", "offset?"]
    output: "SeniorRecord[]"
    side_effects: []
  - method: GET
    path: "/fafsa/senior-records/{id}"
    description: "Get senior; without GRANTED consent scope STATUS_DETAIL the fields fafsa_status, submitted_at, deadline_classification, current_match_link_id are returned as null"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist, MatchReviewer]
    code: 200
    input: []
    output: SeniorRecord
    side_effects: []

  # --- AidRecord / AidStatusEvent ---
  - method: POST
    path: "/fafsa/aid-records"
    description: "Import aid record with initial status event; external_ref unique per campaign"
    roles: [DataImporter]
    code: 201
    input: [campaign_id, external_ref, full_name, dob, school_code, district_code, initial_status, effective_date]
    output: AidRecord
    side_effects: ["creates first AidStatusEvent; projection applies; confirmed-link cascades may fire"]
  - method: GET
    path: "/fafsa/aid-records"
    description: "List aid records (filterable)"
    roles: [CampaignAdmin, MatchReviewer, DataImporter]
    code: 200
    input: ["campaign_id?", "current_status?", "limit?", "offset?"]
    output: "AidRecord[]"
    side_effects: []
  - method: GET
    path: "/fafsa/aid-records/{id}"
    description: "Get aid record incl. projection fields"
    roles: [CampaignAdmin, MatchReviewer, DataImporter]
    code: 200
    input: []
    output: AidRecord
    side_effects: []
  - method: POST
    path: "/fafsa/aid-records/{id}/status-events"
    description: "Append status event; projection updates when effective_date >= last_effective_date (tie: later created_at wins); linked-senior cascades fire on change"
    roles: [DataImporter]
    code: 201
    input: [fafsa_status, effective_date, "source?"]
    output: AidStatusEvent
    side_effects: ["projection update; VERIFICATION CASCADE / AUTO-RESOLVE may fire on linked senior"]
  - method: GET
    path: "/fafsa/aid-records/{id}/status-events"
    description: "List status events of an aid record (chronological)"
    roles: [CampaignAdmin, MatchReviewer, DataImporter]
    code: 200
    input: ["limit?", "offset?"]
    output: "AidStatusEvent[]"
    side_effects: []

  # --- MatchLink ---
  - method: POST
    path: "/fafsa/match-links"
    description: "Propose a match; computes match_score; initial status by score band; OCC on SeniorRecord.version"
    roles: [MatchReviewer]
    code: 201
    input: [senior_record_id, aid_record_id, expected_senior_record_version]
    output: MatchLink
    side_effects: ["increments SeniorRecord.version by 1", "senior match axis transition per band", "AUTO_CONFIRMED fires the MATCHED cascade (checklist generation; verification auto-case if applicable)"]
  - method: GET
    path: "/fafsa/match-links"
    description: "List match links (filterable)"
    roles: [CampaignAdmin, MatchReviewer, DataImporter]
    code: 200
    input: ["senior_record_id?", "aid_record_id?", "status?", "limit?", "offset?"]
    output: "MatchLink[]"
    side_effects: []
  - method: GET
    path: "/fafsa/match-links/{id}"
    description: "Get match link incl. score_components"
    roles: [CampaignAdmin, MatchReviewer, DataImporter]
    code: 200
    input: []
    output: MatchLink
    side_effects: []
  - method: POST
    path: "/fafsa/match-links/{id}/confirm"
    description: "SUGGESTED -> CONFIRMED; fires MATCHED cascade"
    roles: [MatchReviewer]
    code: 200
    input: []
    output: MatchLink
    side_effects: ["senior -> MATCHED", "checklist generated", "fafsa_status initialized from aid record (+ cascades)"]
  - method: POST
    path: "/fafsa/match-links/{id}/reject"
    description: "SUGGESTED -> REJECTED; senior back to UNMATCHED"
    roles: [MatchReviewer]
    code: 200
    input: []
    output: MatchLink
    side_effects: ["senior match axis -> UNMATCHED"]
  - method: POST
    path: "/fafsa/match-links/{id}/invalidate"
    description: "CONFIRMED/AUTO_CONFIRMED -> INVALIDATED; senior UNMATCHED; checklist ARCHIVED"
    roles: [MatchReviewer]
    code: 200
    input: []
    output: MatchLink
    side_effects: ["senior match axis -> UNMATCHED", "checklist -> ARCHIVED"]

  # --- ConsentRecord ---
  - method: POST
    path: "/fafsa/consent-records"
    description: "Grant consent (GRANTED); one GRANTED consent per senior"
    roles: [SchoolCoordinator]
    code: 201
    input: [senior_record_id, scopes, granted_by, "expires_at?"]
    output: ConsentRecord
    side_effects: ["data_visibility recomputed (may flip RESTRICTED -> NORMAL; PAUSED cases resume when STATUS_DETAIL restored)"]
  - method: GET
    path: "/fafsa/consent-records"
    description: "List consents (filterable)"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist, MatchReviewer]
    code: 200
    input: ["senior_record_id?", "status?", "limit?", "offset?"]
    output: "ConsentRecord[]"
    side_effects: []
  - method: GET
    path: "/fafsa/consent-records/{id}"
    description: "Get consent"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist, MatchReviewer]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []
  - method: POST
    path: "/fafsa/consent-records/{id}/revoke"
    description: "GRANTED -> REVOKED with pause/cancel cascade"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["visibility RESTRICTED", "non-terminal cases PAUSED (previous_status preserved, caseload decremented)", "REGISTERED registrations CANCELLED"]
  - method: POST
    path: "/fafsa/consent-records/{id}/regrant"
    description: "REVOKED -> GRANTED; resumes PAUSED cases; registrations NOT restored"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: ["visibility NORMAL", "PAUSED cases resume to previous_status (caseload re-incremented)"]

  # --- CompletionEvent ---
  - method: POST
    path: "/fafsa/events"
    description: "Create event in DRAFT (own school, ENROLLED, campaign OPEN/STATE_GRACE)"
    roles: [SchoolCoordinator]
    code: 201
    input: [school_id, title, start_time, end_time, capacity, cost_estimate_cents, required_expert_count, supported_languages]
    output: CompletionEvent
    side_effects: []
  - method: GET
    path: "/fafsa/events"
    description: "List events (filterable)"
    roles: [CampaignAdmin, SchoolCoordinator, StaffMember, Specialist, MatchReviewer, DataImporter]
    code: 200
    input: ["school_id?", "status?", "limit?", "offset?"]
    output: "CompletionEvent[]"
    side_effects: []
  - method: GET
    path: "/fafsa/events/{id}"
    description: "Get event incl. staffing_coverage with both committed and pipeline variants"
    roles: [CampaignAdmin, SchoolCoordinator, StaffMember, Specialist, MatchReviewer, DataImporter]
    code: 200
    input: []
    output: CompletionEvent
    side_effects: []
  - method: POST
    path: "/fafsa/events/{id}/publish"
    description: "DRAFT -> PUBLISHED; validates future start, venue buffer, staffing invariant, budget; commits budget"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: CompletionEvent
    side_effects: ["committed_budget_cents += cost_estimate_cents", "increments Campaign.version by 1"]
  - method: POST
    path: "/fafsa/events/{id}/unpublish"
    description: "PUBLISHED -> DRAFT; releases budget; cancels registrations"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: CompletionEvent
    side_effects: ["committed_budget_cents -= cost_estimate_cents", "registrations CANCELLED"]
  - method: POST
    path: "/fafsa/events/{id}/cancel"
    description: "DRAFT/PUBLISHED -> CANCELLED with assignment/registration/budget cascades"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: CompletionEvent
    side_effects: ["non-terminal assignments CANCELLED (hours released)", "registrations CANCELLED", "committed budget released if was PUBLISHED"]
  - method: POST
    path: "/fafsa/events/{id}/complete"
    description: "IN_PROGRESS -> COMPLETED; records actual cost; marks NO_SHOWs (threshold contagion)"
    roles: [SchoolCoordinator]
    code: 200
    input: [actual_cost_cents]
    output: CompletionEvent
    side_effects: ["committed -= cost_estimate_cents; spent += actual_cost_cents", "INVITED/ACCEPTED assignments CANCELLED", "CONFIRMED -> NO_SHOW with suspension contagion"]

  # --- StaffAssignment ---
  - method: POST
    path: "/fafsa/staff-assignments"
    description: "Invite staff to event (event DRAFT/PUBLISHED; capability match; same campaign; overlap pre-check vs CONFIRMED/CHECKED_IN)"
    roles: [SchoolCoordinator]
    code: 201
    input: [event_id, staff_profile_id, assigned_role]
    output: StaffAssignment
    side_effects: []
  - method: GET
    path: "/fafsa/staff-assignments"
    description: "List assignments (filterable)"
    roles: [CampaignAdmin, SchoolCoordinator, StaffMember, Specialist]
    code: 200
    input: ["event_id?", "staff_profile_id?", "status?", "limit?", "offset?"]
    output: "StaffAssignment[]"
    side_effects: []
  - method: GET
    path: "/fafsa/staff-assignments/{id}"
    description: "Get assignment"
    roles: [CampaignAdmin, SchoolCoordinator, StaffMember, Specialist]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []
  - method: POST
    path: "/fafsa/staff-assignments/{id}/accept"
    description: "INVITED -> ACCEPTED (self only)"
    roles: [StaffMember]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []
  - method: POST
    path: "/fafsa/staff-assignments/{id}/decline"
    description: "INVITED -> DECLINED (self only)"
    roles: [StaffMember]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []
  - method: POST
    path: "/fafsa/staff-assignments/{id}/confirm"
    description: "ACCEPTED -> CONFIRMED; background check + double-booking gate; accrues hours"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["confirmed_hours_total += duration_hours"]
  - method: POST
    path: "/fafsa/staff-assignments/{id}/cancel"
    description: "INVITED/ACCEPTED/CONFIRMED -> CANCELLED; releases hours for CONFIRMED"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["hours release when CONFIRMED"]
  - method: POST
    path: "/fafsa/staff-assignments/{id}/check-in"
    description: "CONFIRMED -> CHECKED_IN (event must be IN_PROGRESS)"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []

  # --- EventRegistration ---
  - method: POST
    path: "/fafsa/event-registrations"
    description: "Register senior for event (PUBLISHED; consent OUTREACH; capacity; duplicate check; senior's school ENROLLED)"
    roles: [SchoolCoordinator]
    code: 201
    input: [event_id, senior_record_id]
    output: EventRegistration
    side_effects: []
  - method: GET
    path: "/fafsa/event-registrations"
    description: "List registrations (filterable)"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist]
    code: 200
    input: ["event_id?", "senior_record_id?", "status?", "limit?", "offset?"]
    output: "EventRegistration[]"
    side_effects: []
  - method: GET
    path: "/fafsa/event-registrations/{id}"
    description: "Get registration"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist]
    code: 200
    input: []
    output: EventRegistration
    side_effects: []
  - method: POST
    path: "/fafsa/event-registrations/{id}/cancel"
    description: "REGISTERED -> CANCELLED"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: EventRegistration
    side_effects: []

  # --- DocumentChecklist / ChecklistItem ---
  - method: GET
    path: "/fafsa/document-checklists"
    description: "List checklists (filterable by senior)"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist, MatchReviewer]
    code: 200
    input: ["senior_record_id?", "status?", "limit?", "offset?"]
    output: "DocumentChecklist[]"
    side_effects: []
  - method: GET
    path: "/fafsa/document-checklists/{id}"
    description: "Get checklist"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist, MatchReviewer]
    code: 200
    input: []
    output: DocumentChecklist
    side_effects: []
  - method: GET
    path: "/fafsa/document-checklists/{id}/items"
    description: "List items of a checklist, in template order"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist, MatchReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ChecklistItem[]"
    side_effects: []
  - method: POST
    path: "/fafsa/checklist-items/{id}/receive"
    description: "PENDING/REJECTED -> RECEIVED"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: ChecklistItem
    side_effects: ["checklist status re-evaluated"]
  - method: POST
    path: "/fafsa/checklist-items/{id}/verify"
    description: "RECEIVED -> VERIFIED"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: ChecklistItem
    side_effects: ["checklist status re-evaluated (may reach COMPLETE)"]
  - method: POST
    path: "/fafsa/checklist-items/{id}/reject"
    description: "RECEIVED -> REJECTED"
    roles: [SchoolCoordinator]
    code: 200
    input: []
    output: ChecklistItem
    side_effects: ["checklist status re-evaluated"]
  - method: POST
    path: "/fafsa/checklist-items/{id}/waive"
    description: "PENDING -> WAIVED (waivable items only; specialist with non-terminal case for the senior)"
    roles: [Specialist]
    code: 200
    input: []
    output: ChecklistItem
    side_effects: ["checklist status re-evaluated (may reach COMPLETE)"]

  # --- SupportCase ---
  - method: POST
    path: "/fafsa/support-cases"
    description: "Open a case manually (SPECIAL_CIRCUMSTANCE referral sets senior dependency_status PENDING_REVIEW); one non-terminal case per (senior, case_type); selector auto-assigns specialist"
    roles: [SchoolCoordinator]
    code: 201
    input: [senior_record_id, case_type, "notes?"]
    output: SupportCase
    side_effects: ["specialist_selection auto-assign", "SPECIAL_CIRCUMSTANCE: dependency_status -> PENDING_REVIEW"]
  - method: GET
    path: "/fafsa/support-cases"
    description: "List cases (filterable)"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist]
    code: 200
    input: ["senior_record_id?", "assigned_specialist_id?", "status?", "case_type?", "limit?", "offset?"]
    output: "SupportCase[]"
    side_effects: []
  - method: GET
    path: "/fafsa/support-cases/{id}"
    description: "Get case"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist]
    code: 200
    input: []
    output: SupportCase
    side_effects: []
  - method: POST
    path: "/fafsa/support-cases/{id}/assign"
    description: "Assign/reassign specialist (must be ACTIVE with CASE_SPECIALIST capability)"
    roles: [CampaignAdmin]
    code: 200
    input: [specialist_id]
    output: SupportCase
    side_effects: ["caseload counters shift between old/new specialist; OVERLOADED re-evaluated"]
  - method: POST
    path: "/fafsa/support-cases/{id}/accept"
    description: "OPEN -> IN_REVIEW (assigned specialist only)"
    roles: [Specialist]
    code: 200
    input: []
    output: SupportCase
    side_effects: []
  - method: POST
    path: "/fafsa/support-cases/{id}/request-documents"
    description: "IN_REVIEW -> AWAITING_FAMILY"
    roles: [Specialist]
    code: 200
    input: []
    output: SupportCase
    side_effects: []
  - method: POST
    path: "/fafsa/support-cases/{id}/documents-received"
    description: "AWAITING_FAMILY -> IN_REVIEW"
    roles: [Specialist]
    code: 200
    input: []
    output: SupportCase
    side_effects: []
  - method: POST
    path: "/fafsa/support-cases/{id}/escalate"
    description: "IN_REVIEW/AWAITING_FAMILY -> ESCALATED"
    roles: [Specialist]
    code: 200
    input: []
    output: SupportCase
    side_effects: []
  - method: POST
    path: "/fafsa/support-cases/{id}/resolve"
    description: "IN_REVIEW/ESCALATED -> RESOLVED; per-type preconditions; special-circumstance determination side effects"
    roles: [Specialist]
    code: 200
    input: ["resolution_outcome?"]
    output: SupportCase
    side_effects: ["active_case_count -= 1", "INDEPENDENT_CONFIRMED triggers dependency flip + checklist regeneration"]

  # --- CompletionReport ---
  - method: POST
    path: "/fafsa/completion-reports"
    description: "Generate report (status GENERATED) with frozen rows/totals per variant; k-anonymity suppression applied; requires campaign OPEN or STATE_GRACE (ERR_CAMPAIGN_NOT_OPEN)"
    roles: [CampaignAdmin]
    code: 201
    input: [campaign_id, variant]
    output: CompletionReport
    side_effects: []
  - method: GET
    path: "/fafsa/completion-reports"
    description: "List reports (filterable)"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist, MatchReviewer, DataImporter]
    code: 200
    input: ["campaign_id?", "status?", "limit?", "offset?"]
    output: "CompletionReport[]"
    side_effects: []
  - method: GET
    path: "/fafsa/completion-reports/{id}"
    description: "Get report incl. rows"
    roles: [CampaignAdmin, SchoolCoordinator, Specialist, MatchReviewer, DataImporter]
    code: 200
    input: []
    output: CompletionReport
    side_effects: []
  - method: POST
    path: "/fafsa/completion-reports/{id}/publish"
    description: "GENERATED -> PUBLISHED; OCC on Campaign.version; supersedes prior PUBLISHED; recomputes recognition tiers"
    roles: [CampaignAdmin]
    code: 200
    input: [expected_campaign_version]
    output: CompletionReport
    side_effects: ["prior PUBLISHED -> SUPERSEDED", "recognition_tier recomputed for all schools", "increments Campaign.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_SCHOOL_SCOPE_VIOLATION, http: 403, condition: "SchoolCoordinator acting on a resource whose school_id != X-User-ID" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "StaffMember/Specialist acting on an assignment/case whose staff_profile_id/assigned_specialist_id != X-User-ID" }
  # --- not found ---
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "Campaign id does not exist" }
  - { id: ERR_SCHOOL_NOT_FOUND, http: 404, condition: "School id does not exist" }
  - { id: ERR_STAFF_PROFILE_NOT_FOUND, http: 404, condition: "StaffProfile id does not exist" }
  - { id: ERR_SENIOR_RECORD_NOT_FOUND, http: 404, condition: "SeniorRecord id does not exist" }
  - { id: ERR_AID_RECORD_NOT_FOUND, http: 404, condition: "AidRecord id does not exist" }
  - { id: ERR_MATCH_LINK_NOT_FOUND, http: 404, condition: "MatchLink id does not exist" }
  - { id: ERR_CONSENT_RECORD_NOT_FOUND, http: 404, condition: "ConsentRecord id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "CompletionEvent id does not exist" }
  - { id: ERR_STAFF_ASSIGNMENT_NOT_FOUND, http: 404, condition: "StaffAssignment id does not exist" }
  - { id: ERR_EVENT_REGISTRATION_NOT_FOUND, http: 404, condition: "EventRegistration id does not exist" }
  - { id: ERR_CHECKLIST_NOT_FOUND, http: 404, condition: "DocumentChecklist id does not exist" }
  - { id: ERR_CHECKLIST_ITEM_NOT_FOUND, http: 404, condition: "ChecklistItem id does not exist" }
  - { id: ERR_SUPPORT_CASE_NOT_FOUND, http: 404, condition: "SupportCase id does not exist" }
  - { id: ERR_COMPLETION_REPORT_NOT_FOUND, http: 404, condition: "CompletionReport id does not exist" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, invalid enum value, or malformed datetime/date/integer" }
  # --- state ---
  - { id: ERR_CAMPAIGN_NOT_DRAFT, http: 409, condition: "activate requires DRAFT" }
  - { id: ERR_CAMPAIGN_NOT_OPEN, http: 409, condition: "Operation requires campaign OPEN (or OPEN/STATE_GRACE where stated); CLOSED blocks all child writes" }
  - { id: ERR_SCHOOL_NOT_INVITED, http: 409, condition: "enroll requires INVITED" }
  - { id: ERR_SCHOOL_NOT_ENROLLED, http: 409, condition: "Operation requires school ENROLLED" }
  - { id: ERR_SCHOOL_NOT_SUSPENDED, http: 409, condition: "reinstate requires SUSPENDED" }
  - { id: ERR_EVENT_NOT_DRAFT, http: 409, condition: "publish requires DRAFT" }
  - { id: ERR_EVENT_NOT_PUBLISHED, http: 409, condition: "Operation requires event PUBLISHED" }
  - { id: ERR_EVENT_NOT_IN_PROGRESS, http: 409, condition: "complete/check-in requires event IN_PROGRESS" }
  - { id: ERR_EVENT_NOT_CANCELLABLE, http: 409, condition: "cancel requires DRAFT or PUBLISHED" }
  - { id: ERR_ASSIGNMENT_NOT_INVITED, http: 409, condition: "accept/decline requires INVITED" }
  - { id: ERR_ASSIGNMENT_NOT_ACCEPTED, http: 409, condition: "confirm requires ACCEPTED" }
  - { id: ERR_ASSIGNMENT_NOT_CONFIRMED, http: 409, condition: "check-in requires CONFIRMED" }
  - { id: ERR_ASSIGNMENT_NOT_CANCELLABLE, http: 409, condition: "cancel requires INVITED/ACCEPTED/CONFIRMED" }
  - { id: ERR_MATCH_LINK_NOT_SUGGESTED, http: 409, condition: "confirm/reject requires SUGGESTED" }
  - { id: ERR_MATCH_LINK_NOT_CONFIRMED, http: 409, condition: "invalidate requires CONFIRMED or AUTO_CONFIRMED" }
  - { id: ERR_CASE_NOT_ACTIONABLE, http: 409, condition: "Case not in a state permitting this action (includes PAUSED and terminal)" }
  - { id: ERR_CASE_UNASSIGNED, http: 409, condition: "accept requires assigned_specialist_id non-null" }
  - { id: ERR_REGISTRATION_NOT_ACTIVE, http: 409, condition: "cancel requires REGISTERED" }
  - { id: ERR_ITEM_NOT_PENDING, http: 409, condition: "receive/waive requires PENDING (receive also accepts REJECTED)" }
  - { id: ERR_ITEM_NOT_RECEIVED, http: 409, condition: "verify/reject requires RECEIVED" }
  - { id: ERR_CHECKLIST_ARCHIVED, http: 409, condition: "Item operations blocked when parent checklist is ARCHIVED" }
  - { id: ERR_REPORT_NOT_GENERATED, http: 409, condition: "publish requires GENERATED" }
  - { id: ERR_CONSENT_NOT_GRANTED, http: 409, condition: "revoke requires GRANTED" }
  - { id: ERR_CONSENT_NOT_REVOKED, http: 409, condition: "regrant requires REVOKED" }
  # --- business ---
  - { id: ERR_CONSENT_REQUIRED, http: 403, condition: "No GRANTED ConsentRecord with the required scope for this senior" }
  - { id: ERR_BACKGROUND_CHECK_NOT_CLEARED, http: 409, condition: "confirm requires background_check_status CLEARED" }
  - { id: ERR_CROSS_CAMPAIGN_REFERENCE, http: 422, condition: "Referenced entities belong to different campaigns" }
  - { id: ERR_EVENT_WINDOW_INVALID, http: 400, condition: "end_time <= start_time" }
  - { id: ERR_EVENT_IN_PAST, http: 409, condition: "start_time is not strictly after clock now at create or publish" }
  - { id: ERR_STAFF_DOUBLE_BOOKED, http: 409, condition: "Half-open window overlap with an existing CONFIRMED/CHECKED_IN assignment of this staff member" }
  - { id: ERR_EVENT_OVERLAP_BUFFER, http: 409, condition: "Another PUBLISHED/IN_PROGRESS event at the same school within the 30-minute venue buffer" }
  - { id: ERR_DUPLICATE_STUDENT_REF, http: 409, condition: "student_ref already exists for this school" }
  - { id: ERR_DUPLICATE_EXTERNAL_REF, http: 409, condition: "external_ref already exists for this campaign" }
  - { id: ERR_LINK_ALREADY_EXISTS, http: 409, condition: "A non-terminal MatchLink already exists for this senior" }
  - { id: ERR_DUPLICATE_ASSIGNMENT, http: 409, condition: "A non-terminal StaffAssignment already exists for this (event, staff)" }
  - { id: ERR_CONSENT_ALREADY_ACTIVE, http: 409, condition: "A GRANTED ConsentRecord already exists for this senior" }
  - { id: ERR_CASE_ALREADY_OPEN, http: 409, condition: "A non-terminal SupportCase already exists for this (senior, case_type)" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "A REGISTERED registration already exists for this (event, senior)" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "REGISTERED count >= capacity" }
  - { id: ERR_STAFFING_INVARIANT_NOT_MET, http: 409, condition: "Publish staffing invariant fails (expert count or language coverage)" }
  - { id: ERR_STAFF_LACKS_CAPABILITY, http: 409, condition: "EXPERT assignment requires AID_EXPERT capability; case assign requires CASE_SPECIALIST" }
  - { id: ERR_ITEM_NOT_WAIVABLE, http: 422, condition: "waive on an item whose doc_type is not waivable" }
  - { id: ERR_CASE_NOT_FOUND_FOR_SPECIALIST, http: 409, condition: "waive requires the acting specialist to hold a non-terminal case for this senior" }
  - { id: ERR_CHECKLIST_NOT_COMPLETE, http: 409, condition: "VERIFICATION_FOLLOWUP resolve requires checklist COMPLETE" }
  - { id: ERR_DETERMINATION_REQUIRED, http: 400, condition: "SPECIAL_CIRCUMSTANCE resolve requires resolution_outcome in {INDEPENDENT_CONFIRMED, NOT_QUALIFIED}" }
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "Publish/complete would push committed/spent beyond total_budget_cents" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CampaignAdmin
    description: "State agency operator: campaign/school/staff administration, background checks, case assignment, report generation and publication, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /fafsa/campaigns; POST /fafsa/campaigns/{id}/activate"
      - "POST /fafsa/schools; enroll/suspend/reinstate"
      - "POST /fafsa/staff-profiles; POST /fafsa/staff-profiles/{id}/background-check"
      - "POST /fafsa/completion-reports; POST /fafsa/completion-reports/{id}/publish"
      - "POST /fafsa/support-cases/{id}/assign"
    shared_operations: ["all GET list/single endpoints"]
  - name: SchoolCoordinator
    description: "School-level coordinator; X-User-ID is the id of their School; manages senior list, consents, events, staffing, registrations, checklist items, case referrals for OWN school only"
    identity: "entity_backed:School"
    exclusive_operations:
      - "POST /fafsa/senior-records"
      - "POST /fafsa/consent-records; revoke; regrant"
      - "POST /fafsa/events; publish/unpublish/cancel/complete"
      - "POST /fafsa/staff-assignments; confirm/cancel/check-in"
      - "POST /fafsa/event-registrations; cancel"
      - "POST /fafsa/checklist-items/{id}/receive|verify|reject"
      - "POST /fafsa/support-cases"
    shared_operations: ["GET campaigns/schools/staff-profiles/seniors/consents/events/assignments/registrations/checklists/items/cases/reports"]
  - name: StaffMember
    description: "Volunteer/expert; X-User-ID is the id of their StaffProfile; responds to own assignment invitations"
    identity: "entity_backed:StaffProfile"
    exclusive_operations:
      - "POST /fafsa/staff-assignments/{id}/accept"
      - "POST /fafsa/staff-assignments/{id}/decline"
    shared_operations: ["GET campaigns/schools/staff-profiles/events/assignments/reports"]
  - name: Specialist
    description: "Financial-aid specialist; X-User-ID is the id of their StaffProfile; works assigned support cases and waives checklist items"
    identity: "entity_backed:StaffProfile"
    exclusive_operations:
      - "POST /fafsa/support-cases/{id}/accept|request-documents|documents-received|escalate|resolve"
      - "POST /fafsa/checklist-items/{id}/waive"
    shared_operations: ["GET campaigns/schools/staff-profiles/seniors/consents/events/assignments/registrations/checklists/items/cases/reports"]
  - name: MatchReviewer
    description: "Data-match reviewer (opaque operator); proposes/confirms/rejects/invalidates match links"
    identity: opaque
    exclusive_operations:
      - "POST /fafsa/match-links; confirm; reject; invalidate"
    shared_operations: ["GET campaigns/schools/seniors/consents/aid-records/status-events/match-links/checklists/items/reports"]
  - name: DataImporter
    description: "Aid-data import operator (opaque); manages AidRecords and AidStatusEvents"
    identity: opaque
    exclusive_operations:
      - "POST /fafsa/aid-records"
      - "POST /fafsa/aid-records/{id}/status-events"
    shared_operations: ["GET campaigns/schools/aid-records/status-events/match-links/reports"]
