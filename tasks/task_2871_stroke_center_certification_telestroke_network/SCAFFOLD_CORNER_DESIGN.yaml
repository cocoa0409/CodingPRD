      assert:
      - ${lk1_id} == ${lk2_id} == ${lk3_id} == ${lk4_id} == ERR_LKW_REQUIRED, all HTTP 422
      - 'the third rejection proves the rule is bidirectional: supplying last_known_well_at under UNKNOWN_WAKE_UP is just as invalid as omitting it under EXACT'
