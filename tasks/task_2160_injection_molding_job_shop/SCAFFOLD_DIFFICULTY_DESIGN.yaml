            - { call: "GET /presses/${p150_id}", payload: {}, as: ProcessEngineer, captures: { press_v1: $.data.version } }
            - { call: "POST /production-jobs/${job_id}/schedule", payload: { expected_press_version: "${press_v1}" }, as: ProcessEngineer }
            - { call: "POST /production-jobs/${job_id}/stage-material", payload: { resin_lot_id: "${lot_id}" }, as: ProcessEngineer }
            - { call: "POST /production-jobs/${job_id}/start", payload: {}, as: ProcessEngineer }
            - { call: "GET /production-jobs/${job_id}", payload: {}, as: ProcessEngineer, captures: { job_v1: $.data.version } }
            - { call: "POST /production-reports", payload: { job_id: "${job_id}", shots: 1000, short_shot_shots: 25, good_parts: 3800, scrap_parts: 200, virgin_grams: 36000, regrind_grams: 4000, run_minutes: 700, expected_job_version: "${job_v1}" }, as: ProcessEngineer, captures: { rep_id: $.data.id } }
          trigger:
            - { call: "POST /production-reports/${rep_id}/reverse", payload: { reason: "shift report keyed against the wrong job" }, as: QualityEngineer }
          assert:
            - "immediately before the reverse call ResinLot.${lot_id}.qty_grams_remaining == 464000 and Mold.${mold_id}.total_shot_count == 1000"
            - "after the reverse call ProductionReport.${rep_id}.is_reversed == true"
            - "after the reverse call ResinLot.${lot_id}.qty_grams_remaining == 500000"
            - "after the reverse call Mold.${mold_id}.total_shot_count == 0 and Mold.${mold_id}.shots_since_pm == 0"
            - "after the reverse call ProductionJob.${job_id}.total_shots == 0, parts_molded_total == 0, good_parts_total == 0, scrap_parts_total == 0 and total_run_minutes == 0"
            - "after the reverse call ProductionJob.${job_id}.job_direct_cost_cents == 0, job_overhead_cents == 0 and job_total_cost_cents == 0"
            - "after the reverse call ProductionJob.${job_id}.first_pass_yield_bp == 10000 and actual_cycle_time_sec == null"
            - "ResinLot.${lot_id}.status == RELEASED and ProductionJob.${job_id}.run_status == RUNNING throughout"

      - name: job_cancellation_conserves_press_committed_minutes
        grounds:
          - calculations.press_capacity_ledger
          - state_machines.ProductionJob.DRAFT_to_SCHEDULED
          - state_machines.ProductionJob.SCHEDULED_to_CANCELLED
          - state_machines.ProductionJob.STAGED_to_UNSTAGED
          - entities.Press.fields.committed_minutes_scheduled
        distinguishing_aspect: |
          Conserved quantity two is a different KIND of quantity — press TIME CAPACITY in whole
          minutes, pinned as Press.committed_minutes_scheduled == sum of durations over jobs
          whose run_status IN {SCHEDULED, RUNNING}. Scheduling reserves 480 minutes and the
          compensating cancel returns the ledger to exactly 0, while the resin mass ledger is
          untouched at 500000 g because cancelling consumes no material.
        test_recipe:
          setup:
            - "Mold M-1 PPAP_APPROVED on press P-150; ResinLot L-77 of 500 kg RELEASED."
            - "A single job is SCHEDULED for 2026-09-10T08:00Z-16:00Z (480 minutes) and STAGED, so Press.committed_minutes_scheduled is 480."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /presses", payload: { press_code: "P-150", tonnage: 150, shot_size_grams_max: 400, hourly_rate_cents: 7200 }, as: PlantAdmin, captures: { p150_id: $.data.id } }
