      - name: corner_restricted_party_flag_unwinds_four_cascade_links_in_one_write
        claim_type: cascading_side_effects
        grounds:
          - complexity_layers.cascading_side_effects
          - endpoints.PATCH /foreign-buyers/{buyer_id}/restricted-party-flag
          - calculations.sailing_capacity_ledger
          - calculations.license_value_consumption
          - state_machines.ExportOrder.transitions.BOOKED_to_COMPLIANCE_BLOCKED
        distinguishing_aspect: "One buyer-level write has to unwind four dependent ledgers in order: order to COMPLIANCE_BLOCKED, booking to CANCELLED with the reserved cancel_reason, sailing capacity released so a FULL sailing reopens, and license value released so an EXHAUSTED licence reactivates — plus the screening reset to INITIATED with ruleset_version incremented. The sailing is sized so booked_weight_kg exactly equals capacity_weight_kg and the licence is sized to be fully consumed, so both the FULL to OPEN and the EXHAUSTED to ACTIVE edges are on their boundary. A second, still-DRAFT order proves cascade link 1 filters on fulfillment_status instead of touching every order of the buyer."
        test_recipe:
          setup:
            - "screening decided LICENSE_REQUIRED with ECCN 5A992 and a licence of exactly 25000.00 licensed value"
            - "sailing capacity exactly 1200.000 kg so the single booking makes it FULL"
            - "a second order for the same buyer is left in DRAFT and must be untouched"
