            - "Project RVT1 with exactly one link TR01-A01 that is TESTED_PASS with latest_test_outcome PASS and record_state RECORDED"
            - "A WarrantyRegistration on that project in registration_state DRAFT under STANDARD_15Y"
            - "completeness_pct_strict is 0.00 and warranty_status is NOT_ELIGIBLE before the trigger"
