            - "HapContract.${contract_id}.hap_ledger_balance_cents == 29718500"
            - "${rec_requested} == 211500 and ${rec_paid_hap} == 211500 and ${rec_paid_claims} == 70000 and ${rec_ledger} == 29718500 and ${rec_variance} == 0 and ${rec_periods} == 1"

      - name: opt_out_notice_rescission_is_blocked_by_an_issued_enhanced_voucher
