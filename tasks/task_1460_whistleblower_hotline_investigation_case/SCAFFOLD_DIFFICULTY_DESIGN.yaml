scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: routing_workload_count_vs_weighted_selector
        grounds:
          - calculations.routing_workload
          - calculations.routing_selector
          - entities.StaffMember.fields.weighted_caseload
          - entities.StaffMember.fields.active_case_count
        distinguishing_aspect: |
          Investigator-domain dual variant: over the identical ACTIVE assignment set,
          simple_count ranks invA first (1 < 3) while severity_weighted ranks invB first
          (3 < 8); the selector uses severity_weighted, so invB wins the new case.
        test_recipe:
          setup:
            - "Staff: intake (INTAKE), off (OFFICER), invA and invB (INVESTIGATION, max_active_cases 5)"
            - "invA has 1 ACTIVE assignment on a CRITICAL case (weighted 8, count 1)"
            - "invB has 3 ACTIVE assignments on LOW cases (weighted 3, count 3)"
            - "Target case is TRIAGED with severity MEDIUM"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Alice A", email: "a@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_invA: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Bob B", email: "b@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_invB: $.data.id } }
            # invA: one CRITICAL case activated
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-a1", captures: { ca1: $.data.id } }
            - { call: "POST /hotline/cases/${ca1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: EXECUTIVE, financial_exposure_band: HIGH_1M, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { ca1_v: $.data.version } }
            - { call: "POST /hotline/cases/${ca1}/assignments", payload: { expected_case_version: "${ca1_v}", investigator_id: "${s_invA}", override_reason: "Language coverage" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { asg_a1: $.data.id } }
            - { call: "POST /hotline/assignments/${asg_a1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${asg_a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            # invB: three LOW cases activated
            - { call: "POST /hotline/cases", payload: { channel: PHONE, category: OTHER, description: "Allegation of minor policy lapse one", region: EAST, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-b1", captures: { cb1: $.data.id } }
            - { call: "POST /hotline/cases/${cb1}/triage", payload: { confirmed_category: OTHER, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { cb1_v: $.data.version } }
            - { call: "POST /hotline/cases/${cb1}/assignments", payload: { expected_case_version: "${cb1_v}", investigator_id: "${s_invB}", override_reason: "Rotation" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { asg_b1: $.data.id } }
            - { call: "POST /hotline/assignments/${asg_b1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${asg_b1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/cases", payload: { channel: EMAIL, category: OTHER, description: "Allegation of minor policy lapse two", region: EAST, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-b2", captures: { cb2: $.data.id } }
            - { call: "POST /hotline/cases/${cb2}/triage", payload: { confirmed_category: OTHER, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { cb2_v: $.data.version } }
            - { call: "POST /hotline/cases/${cb2}/assignments", payload: { expected_case_version: "${cb2_v}", investigator_id: "${s_invB}", override_reason: "Rotation" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { asg_b2: $.data.id } }
            - { call: "POST /hotline/assignments/${asg_b2}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${asg_b2}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/cases", payload: { channel: MAIL, category: OTHER, description: "Allegation of minor policy lapse three", region: WEST, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-b3", captures: { cb3: $.data.id } }
            - { call: "POST /hotline/cases/${cb3}/triage", payload: { confirmed_category: OTHER, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { cb3_v: $.data.version } }
            - { call: "POST /hotline/cases/${cb3}/assignments", payload: { expected_case_version: "${cb3_v}", investigator_id: "${s_invB}", override_reason: "Rotation" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { asg_b3: $.data.id } }
            - { call: "POST /hotline/assignments/${asg_b3}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${asg_b3}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            # target case
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of vendor kickback scheme", region: EAST, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-t1", captures: { ct: $.data.id } }
            - { call: "POST /hotline/cases/${ct}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { ct_v: $.data.version } }
          trigger:
            - { call: "POST /hotline/cases/${ct}/assignments", payload: { expected_case_version: "${ct_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { asg_t_inv: $.data.investigator_id, asg_t_mode: $.data.selection_mode } }
          assert:
            - "CaseAssignment.${asg_t_inv} selected investigator == ${s_invB}"
            - "asg_t_mode == AUTO"
            - "StaffMember.${s_invA}.active_case_count == 1 and StaffMember.${s_invA}.weighted_caseload == 8"
            - "StaffMember.${s_invB}.active_case_count == 3 and StaffMember.${s_invB}.weighted_caseload == 3"
            - "simple_count would pick invA (1 < 3); severity_weighted picks invB (3 < 8) — same inputs, divergent winner"

      - name: days_to_close_calendar_vs_hold_adjusted
        grounds:
          - calculations.days_to_close
          - entities.AuditCommitteeReport.fields.avg_days_to_close_calendar
          - entities.AuditCommitteeReport.fields.avg_days_to_close_hold_adjusted
        distinguishing_aspect: |
          Case-metric dual variant (different domain from routing workload): one closure,
          received 2026-08-02, closure_ready 2026-09-11, a legal hold covering
          2026-08-10..2026-08-19 (10 distinct UTC dates) — calendar variant reports 40.0,
          hold-adjusted variant reports 30.0 for the identical closure set.
        test_recipe:
          setup:
            - "Staff: intake, off1, off2, inv"
            - "One case fully investigated (UNSUSTANTIATED determination submitted), with a hold placed by off1 covering 2026-08-10..2026-08-19 and released by off2"
            - "Clock moved to 2026-09-11T00:00:00Z before review approval"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Oscar Officer", email: "officer2@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off2: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: EthicsPlatformAdmin }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: SAFETY, description: "Allegation of unsafe warehouse practice", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-d1", captures: { c1: $.data.id } }
            - { call: "POST /hotline/cases/${c1}/triage", payload: { confirmed_category: SAFETY, subject_seniority: EXECUTIVE, financial_exposure_band: HIGH_1M, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { c1_v: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { asg1: $.data.id } }
            - { call: "POST /hotline/assignments/${asg1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${asg1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: WITNESS, interviewee_identifier: "witness-1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { iv1: $.data.id } }
            - { call: "POST /hotline/interviews/${iv1}/conclude", payload: { outcome: CONDUCTED, summary: "Interview conducted on site with the witness present throughout." }, as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/evidence-items", payload: { case_id: "${c1}", evidence_type: DOCUMENT, description: "Expense report PDF export", checksum: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", captured_at: "2026-08-03T00:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { ev1: $.data.id } }
            - { call: "POST /hotline/evidence-items/${ev1}/seal", as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "GET /hotline/cases/${c1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { c1_v2: $.data.version } }
            - { call: "POST /hotline/cases/${c1}/determinations", payload: { finding: UNSUBSTANTIATED, rationale: "Evidence reviewed shows the allegation is not supported on the balance of proof.", expected_case_version: "${c1_v2}" }, as: Investigator, as_user_id: "${s_inv}", captures: { det1: $.data.id } }
            - { call: "POST /hotline/determinations/${det1}/submit", as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/legal-holds", payload: { case_id: "${c1}", start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-19T00:00:00Z", reason: "Pending litigation review" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { hold1: $.data.id } }
            - { call: "POST /hotline/legal-holds/${hold1}/release", as: ComplianceOfficer, as_user_id: "${s_off2}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-11T00:00:00Z" }, as: EthicsPlatformAdmin }
            - { call: "POST /hotline/determinations/${det1}/review", payload: { decision: APPROVE, review_notes: "Reviewed and accepted.", notice_summary: "Case closed with no findings disclosed." }, as: ComplianceOfficer, as_user_id: "${s_off2}" }
          trigger:
            - { call: "POST /hotline/audit-committee-reports", payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "${s_off}", captures: { avg_cal: $.data.avg_days_to_close_calendar, avg_adj: $.data.avg_days_to_close_hold_adjusted, tot: $.data.total_closures } }
          assert:
            - "report.total_closures == 1 (single case: received 2026-08-02, closure_ready 2026-09-11)"
            - "avg_cal == 40.0 (calendar variant: 40 whole days)"
            - "avg_adj == 30.0 (hold-adjusted variant: 40 minus 10 distinct hold-covered dates 2026-08-10..2026-08-19)"
            - "avg_cal != avg_adj — identical closure set, dual-variant divergence of exactly the hold-covered days"

  # =====================================================================
  # Rule 2 — combinatorial_formula
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: severity_score_band_edge_mode_a
        grounds:
          - calculations.severity_score
          - entities.HotlineCase.fields.severity
          - entities.HotlineCase.fields.sla_days
        distinguishing_aspect: |
          Mode (a) combinatorial formula: 4 additive inputs with tiered band selection;
          score 75 hits the CRITICAL band inclusively (>= 75) while 70 stays HIGH, and
          sla_days switches 30 vs 60 on the band.
        test_recipe:
          setup:
            - "Staff: intake; two freshly created cases A and B in RECEIVED"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-s1", captures: { ca: $.data.id } }
            - { call: "POST /hotline/cases", payload: { channel: PHONE, category: SAFETY, description: "Allegation of unsafe loading dock practice", region: SOUTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-s2", captures: { cb: $.data.id } }
          trigger:
            - { call: "POST /hotline/cases/${ca}/triage", payload: { confirmed_category: FRAUD, subject_seniority: EXECUTIVE, financial_exposure_band: HIGH_1M, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { sev_a: $.data.severity, sla_a: $.data.sla_days } }
            - { call: "POST /hotline/cases/${cb}/triage", payload: { confirmed_category: SAFETY, subject_seniority: EXECUTIVE, financial_exposure_band: HIGH_1M, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { sev_b: $.data.severity, sla_b: $.data.sla_days } }
          assert:
            - "Case A: score 30+25+20+0 == 75 -> sev_a == CRITICAL (band boundary >= 75 inclusive)"
            - "sla_a == 30 (CRITICAL SLA)"
            - "Case B: score 25+25+20+0 == 70 -> sev_b == HIGH (one achievable step below boundary)"
            - "sla_b == 60 (HIGH SLA)"

      - name: org_substantiation_rate_nested_rounding_mode_b
        grounds:
          - calculations.org_substantiation_rate
          - entities.AuditCommitteeReport.fields.org_substantiation_rate
          - entities.AuditCommitteeReport.fields.pooled_substantiation_rate
        distinguishing_aspect: |
          Mode (b) nested rounding: per-region rates rounded to 4dp first then averaged
          (NORTH 1/2 = 0.5000, SOUTH 0/1 = 0.0000 -> org 0.2500) versus pooling all cases
          then dividing (1/3 = 0.3333); the scaffold pins the nested order, so 0.2500 is
          correct and 0.3333 is the pinned reference variant.
        test_recipe:
          setup:
            - "Staff: intake, off1, off2, inv"
            - "Three closures in window [2026-08-01, 2026-09-01): NORTH case N1 SUBSTANTIATED, NORTH case N2 UNSUBSTANTIATED, SOUTH case S1 UNSUBSTANTIATED; all closure_ready_at on 2026-08-05"
            - "N1 (SUBSTANTIATED) passes through REMEDIATION via one remediation action that is REJECTED, satisfying the close-out rule (>= 1 action exists, zero open)"
          setup_api_calls:
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ingrid Intake", email: "intake@corp.example", department: "Ethics", capabilities: [INTAKE], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_int: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Olivia Officer", email: "officer@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Oscar Officer", email: "officer2@corp.example", department: "Ethics", capabilities: [OFFICER], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_off2: $.data.id } }
            - { call: "POST /hotline/staff-members", payload: { display_name: "Ian Vest", email: "investigator@corp.example", department: "Ops", capabilities: [INVESTIGATION], max_active_cases: 5 }, as: EthicsPlatformAdmin, captures: { s_inv: $.data.id } }
            # --- N1: NORTH, SUBSTANTIATED ---
            - { call: "POST /hotline/cases", payload: { channel: WEB_PORTAL, category: FRAUD, description: "Allegation of expense fraud in Q2", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-n1", captures: { cn1: $.data.id } }
            - { call: "POST /hotline/cases/${cn1}/triage", payload: { confirmed_category: FRAUD, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { cn1_v: $.data.version } }
            - { call: "POST /hotline/cases/${cn1}/assignments", payload: { expected_case_version: "${cn1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { an1: $.data.id } }
            - { call: "POST /hotline/assignments/${an1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${an1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${cn1}", interviewee_role: WITNESS, interviewee_identifier: "w-n1", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { ivn1: $.data.id } }
            - { call: "POST /hotline/interviews/${ivn1}/conclude", payload: { outcome: CONDUCTED, summary: "Interview conducted on site with the witness present throughout." }, as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/evidence-items", payload: { case_id: "${cn1}", evidence_type: DOCUMENT, description: "Ledger extract page one", checksum: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", captured_at: "2026-08-03T00:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { evn1: $.data.id } }
            - { call: "POST /hotline/evidence-items/${evn1}/seal", as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "GET /hotline/cases/${cn1}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { cn1_v2: $.data.version } }
            - { call: "POST /hotline/cases/${cn1}/determinations", payload: { finding: SUBSTANTIATED, rationale: "Evidence reviewed shows the policy violation is supported beyond reasonable doubt.", expected_case_version: "${cn1_v2}" }, as: Investigator, as_user_id: "${s_inv}", captures: { dn1: $.data.id } }
            - { call: "POST /hotline/determinations/${dn1}/submit", as: Investigator, as_user_id: "${s_inv}" }
            # --- N2: NORTH, UNSUBSTANTIATED ---
            - { call: "POST /hotline/cases", payload: { channel: EMAIL, category: HARASSMENT, description: "Allegation of hostile workplace conduct", region: NORTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-n2", captures: { cn2: $.data.id } }
            - { call: "POST /hotline/cases/${cn2}/triage", payload: { confirmed_category: HARASSMENT, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { cn2_v: $.data.version } }
            - { call: "POST /hotline/cases/${cn2}/assignments", payload: { expected_case_version: "${cn2_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { an2: $.data.id } }
            - { call: "POST /hotline/assignments/${an2}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "POST /hotline/assignments/${an2}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${cn2}", interviewee_role: WITNESS, interviewee_identifier: "w-n2", scheduled_start: "2026-08-04T10:00:00Z", scheduled_end: "2026-08-04T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { ivn2: $.data.id } }
            - { call: "POST /hotline/interviews/${ivn2}/conclude", payload: { outcome: CONDUCTED, summary: "Interview conducted on site with the witness present throughout." }, as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/evidence-items", payload: { case_id: "${cn2}", evidence_type: EMAIL, description: "Email thread export bundle", checksum: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", captured_at: "2026-08-04T00:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { evn2: $.data.id } }
            - { call: "POST /hotline/evidence-items/${evn2}/seal", as: IntakeSpecialist, as_user_id: "${s_int}" }
            - { call: "GET /hotline/cases/${cn2}", as: ComplianceOfficer, as_user_id: "${s_off}", captures: { cn2_v2: $.data.version } }
            - { call: "POST /hotline/cases/${cn2}/determinations", payload: { finding: UNSUBSTANTIATED, rationale: "Evidence reviewed shows the allegation is not supported on the balance of proof.", expected_case_version: "${cn2_v2}" }, as: Investigator, as_user_id: "${s_inv}", captures: { dn2: $.data.id } }
            - { call: "POST /hotline/determinations/${dn2}/submit", as: Investigator, as_user_id: "${s_inv}" }
            # --- S1: SOUTH, UNSUBSTANTIATED ---
            - { call: "POST /hotline/cases", payload: { channel: PHONE, category: DATA_PRIVACY, description: "Allegation of customer data mishandling", region: SOUTH, subject_employee_ids: [] }, as: HotlineReporter, as_user_id: "anon-s1", captures: { cs1: $.data.id } }
            - { call: "POST /hotline/cases/${cs1}/triage", payload: { confirmed_category: DATA_PRIVACY, subject_seniority: STAFF, financial_exposure_band: NONE, reporter_vulnerability: NONE, triage_decision: PROCEED }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { cs1_v: $.data.version } }
