              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4", battery_pct: 50 }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
          trigger:
            - call: "POST /agencies/${ag}/devices/${dev}/undock"
              payload: {}
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/devices/${dev}/dock"
              payload: {}
              as: DeviceCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:59:59Z" }
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/devices/${dev}/undock"
              payload: {}
              as: DeviceCoordinator
              captures: { batt1: $.data.battery_pct }
            - call: "POST /agencies/${ag}/devices/${dev}/dock"
              payload: {}
              as: DeviceCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:59:59Z" }
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/devices/${dev}/undock"
              payload: {}
              as: DeviceCoordinator
              captures: { batt2: $.data.battery_pct }
          assert:
            - "batt1 == 50 (3599 seconds docked: floor(3599/3600) == 0 hours -> gain 0; a ceil implementation would report 60, a round implementation 50 — the literal 50 pins floor over ceil)"
            - "batt2 == 60 (3600 seconds docked: floor == 1 hour -> gain min(10, 100-50) == 10; headroom not binding)"
            - "Device.${dev}.docked_at is null and dock_status == UNDOCKED after the final undock"

