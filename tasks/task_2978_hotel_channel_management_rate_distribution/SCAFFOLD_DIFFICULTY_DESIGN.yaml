            - "InventoryDay.${inv_11_id}.allocated_units == 9, committed_units == 2, shared_pool_units == 0, overbooking_ceiling_units == 11, pooled_state == EXHAUSTED"
            - "InventoryDay.${inv_11_id} invariant: 11 == 9 + 2 + 0"
            - "The following 1-unit request is refused with HTTP 409 and data.error_id == ERR_ALLOCATION_EXCEEDS_CEILING (6 + 3 + 2 + 1 == 12 > 11 on 2026-09-11, even though 2026-09-12 would have room)"
            - "RoomType.${king_id}.version == 3 after the accepted allotment and still 3 after the refused one (a refused allotment spends no version)"
            - "ChannelAllocation.${ota1_alloc_id}.allocation_state == OPEN with consumed_units == 0 - the BRAND bookings drew from the pool, not from the OTA1 allotment"

      - name: rate_mismatch_delta_equal_to_tolerance_stays_in_sync_on_both_signs
        grounds:
          - calculations.rate_mismatch_evaluation
          - calculations.job_dispatch_resolution
          - entities.Property.fields.rate_mismatch_tolerance_cents
          - entities.Channel.fields.mismatch_alert_count
        distinguishing_aspect: |
          Boundary on the MONEY metric at POST /distribution/channel-mappings/{id}/observed-rates:
          abs(delta) == rate_mismatch_tolerance_cents 200 is IN_SYNC and 201 is MISMATCHED on BOTH
          signs (25200/24800 vs 25201/24799), and the channel's mismatch_alert_count tracks the
          mapping in and out of MISMATCHED rather than counting events.
        test_recipe:
          setup:
            - "Property HTL-SFO with rate_mismatch_tolerance_cents 200; room type KING; channel OTA1 with sell_adjustment_bp 0 and a HEALTHY connection."
            - "Rate plan BAR ACTIVE at 25000 with floor 18000 (version 2 after activation); one VERIFIED, IN_PARITY mapping BAR x OTA1 x KING."
            - "BAR is patched (ceiling 40000 -> 41000, which leaves resolved_base_amount_cents at 25000) so a RATE batch is queued, and dispatching it applies the single job, setting the mapping's last_pushed_rate_cents to the promotion-free distributed rate 25000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750, sell_adjustment_bp: 0 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
              captures: { bar_v: $.data.version }
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_id: $.data.id }
            - call: "POST /distribution/channel-mappings/${map_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
            - call: "PATCH /distribution/rate-plans/${bar_id}"
              payload: { expected_rate_plan_version: "${bar_v}", ceiling_amount_cents: 41000 }
              as: RevenueManager
            - call: "GET /distribution/distribution-batches"
              payload: { property_id: "${prop_id}", payload_kind: "RATE" }
              as: ChannelOpsEngineer
              captures: { batch_id: "$.data[0].id" }
            - call: "POST /distribution/distribution-batches/${batch_id}/dispatch"
              payload: {}
              as: ChannelOpsEngineer
          trigger:
            - call: "POST /distribution/channel-mappings/${map_id}/observed-rates"
              payload: { observed_rate_cents: 25200, observed_stay_date: "2026-09-10" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-mappings/${map_id}/observed-rates"
              payload: { observed_rate_cents: 25201, observed_stay_date: "2026-09-10" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-mappings/${map_id}/observed-rates"
              payload: { observed_rate_cents: 24800, observed_stay_date: "2026-09-10" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-mappings/${map_id}/observed-rates"
              payload: { observed_rate_cents: 24799, observed_stay_date: "2026-09-10" }
              as: ChannelOpsEngineer
          assert:
            - "After the dispatch: ChannelMapping.${map_id}.last_pushed_rate_cents == 25000, last_push_at == 2026-08-25T00:00:00.000Z, mismatch_state == UNKNOWN (observed_rate_cents is still null)"
            - "observed 25200: ChannelMapping.${map_id}.mismatch_delta_cents == 200 and mismatch_state == IN_SYNC (equal to the tolerance is NOT a mismatch)"
            - "observed 25201: mismatch_delta_cents == 201 and mismatch_state == MISMATCHED, and Channel.${ota1_id}.mismatch_alert_count == 1"
            - "observed 24800: mismatch_delta_cents == -200 and mismatch_state == IN_SYNC, and Channel.${ota1_id}.mismatch_alert_count == 0 (the negative boundary behaves identically)"
            - "observed 24799: mismatch_delta_cents == -201 and mismatch_state == MISMATCHED, and Channel.${ota1_id}.mismatch_alert_count == 1"
            - "ChannelMapping.${map_id}.observed_stay_date == 2026-09-10 and mapping_state stays VERIFIED throughout (a mismatch alert is not a mapping error)"

      - name: analytics_window_exactly_mix_window_days_is_accepted_and_empty_set_is_refused
        grounds:
          - calculations.channel_mix_ranking
          - validations[priority=22]
          - validations[priority=23]
          - entities.Property.fields.mix_window_days
        distinguishing_aspect: |
          Boundary on the DAYS metric at GET /distribution/properties/{id}/channel-mix: an inclusive
          window of exactly mix_window_days 30 is accepted, 31 days is ERR_ANALYTICS_WINDOW_INVALID,
          and a well-formed 18-day window that happens to contain zero room nights is
          ERR_NO_ELIGIBLE_CHANNEL - a different metric and a different endpoint from the units and
          money boundaries above.
        test_recipe:
          setup:
            - "Property HTL-SFO with mix_window_days 30; room type KING; channel OTA1 (commission_bp 1750) with a HEALTHY connection."
            - "Rate plan BAR ACTIVE at 25000 with APPROVED MEMBER10 (PERCENT 1000, 2026-09-01..2026-09-30) and GEO10USD (AMOUNT 1000, 2026-09-10..2026-09-11, US-CA)."
            - "One CONFIRMED reservation on OTA1 for 2026-09-10 x 3 nights, member from US-CA: nightly 21500 / 21500 / 22500, gross 65500, commission 11464, net 54036."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750, allows_member_rate: true, geo_market_codes: ["US-CA"] }
              as: PlatformAdmin
