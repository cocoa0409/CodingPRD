  # ===========================================================================
  - section: endpoints
    instances:

      - name: panel_status_patch_updates_and_readback_matches
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/ipa/physicians/{id}/panel-status
          - endpoints.GET_/ipa/physicians/{id}
          - state_machines.PhysicianMember.panel_dimension
        distinguishing_aspect: |
          The only update endpoint in the API is the panel-status PATCH, and it
          must behave as a real update: the response body carries the new
          panel_status, an independent GET reads the same value back, version
          increments by exactly 1 per PATCH, and the credential dimension is
          untouched. Reopening works here because capitation_posture is CURRENT,
          which separates this happy path from the posture-gated case.
        test_recipe:
          setup:
            - "Agreement AGR_E1 ACTIVE with capitation_posture CURRENT and one ACTIVE physician on an OPEN panel."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements"
              payload: { payer_name: "Corner Panel Patch Health", payer_tax_id: "94-3000072", delegation_scope: "FULL_RISK", base_pmpm_cents: 20000, reconciliation_method: "ROSTER_SNAPSHOT", ibnr_method: "COMPLETION_FACTOR", ibnr_completion_factor_bps: 8000, target_claims_pmpm_cents: 15000, professional_pool_share_bps: 6000, institutional_pool_share_bps: 4000, quality_withhold_bps: 700, stop_loss_attachment_cents: 5000000, reinsurance_recovery_bps: 9000, max_panel_size: 5 }
              as: IpaAdmin
              captures: { agr_e1: "$.data.id" }
            - call: "POST /ipa/delegation-agreements/${agr_e1}/state"
              payload: { to_state: "ACTIVE" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_e1}/physicians"
              payload: { npi: "5500000001", full_name: "Dr Panel Patch", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
              captures: { p_e1: "$.data.id" }
            - call: "POST /ipa/physicians/${p_e1}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_e1}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
              captures: { p_e1_v0: "$.data.version" }
          trigger:
            - call: "PATCH /ipa/physicians/${p_e1}/panel-status"
              payload: { panel_status: "CLOSED_TO_NEW" }
              as: NetworkManager
              captures: { p_e1_panel_1: "$.data.panel_status", p_e1_v1: "$.data.version" }
            - call: "GET /ipa/physicians/${p_e1}"
              as: NetworkManager
              captures: { p_e1_panel_read: "$.data.panel_status", p_e1_cred_read: "$.data.credential_status", p_e1_v_read: "$.data.version" }
            - call: "PATCH /ipa/physicians/${p_e1}/panel-status"
              payload: { panel_status: "OPEN" }
              as: NetworkManager
              captures: { p_e1_panel_2: "$.data.panel_status", p_e1_v2: "$.data.version" }
            - call: "GET /ipa/delegation-agreements/${agr_e1}/physicians"
              payload: { panel_status: "OPEN", limit: 10, offset: 0 }
              as: NetworkManager
          assert:
            - "${p_e1_panel_1} == \"CLOSED_TO_NEW\" and ${p_e1_v1} == ${p_e1_v0} + 1"
            - "${p_e1_panel_read} == \"CLOSED_TO_NEW\" and ${p_e1_v_read} == ${p_e1_v1} — the GET is a faithful readback and does not itself write"
            - "${p_e1_cred_read} == \"ACTIVE\" — the credential dimension is untouched by a panel PATCH"
            - "${p_e1_panel_2} == \"OPEN\" and ${p_e1_v2} == ${p_e1_v1} + 1 — reopen is permitted while capitation_posture is CURRENT"
            - "call 4 returns exactly 1 row, total_count == 1, containing ${p_e1}"

      - name: claim_state_action_endpoint_enforces_its_own_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/ipa/downstream-claims/{id}/state
        excluded_because:
          difficulty_instance: non_linear_state_machine / downstream_claim_denial_appeal_cycle_and_branch
          rationale: "Every branch of that action endpoint is driven there — approve, deny, appeal back to RECEIVED, the refused third appeal, and the VOIDED branch gated on appeal_count == 2 — which covers both halves of the action-endpoint claim."

      - name: stop_loss_recovery_links_pool_and_enrollee_with_snapshot_fields
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/ipa/stop-loss-recoveries
          - calculations.stop_loss_recovery
          - entities.StopLossRecovery
        distinguishing_aspect: |
          The create takes only pool_id and enrollee_id and must derive the whole
          money row from that pair: attachment_cents is snapshotted from the
          agreement (1000), eligible_paid_cents is summed from PAID claims of
          THAT enrollee in THAT pool (6000), excess is 5000 and recovery is
          round_half_up(5000 * 9000 / 10000) = 4500. A recovery for the same
          enrollee must not pick up claims from another pool, so the second
          enrollee's 3000 claim in the same pool must not leak into the first
          enrollee's eligible_paid_cents.
        test_recipe:
          setup:
            - "Agreement AGR_E3 (stop_loss_attachment_cents 1000, reinsurance_recovery_bps 9000) with a PROFESSIONAL 2026 pool funded 40000, two enrollees, and PAID claims of 6000 (enrollee A) and 3000 (enrollee B)."
