            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractApprover
              as_user_id: "u-approver-01"
            - call: "GET /inventory-assets/${asset_id}"
              as: ActivationManager
              as_user_id: "u-act-01"
              captures: { asset_v: $.data.version }
            - call: "POST /asset-bookings"
              payload: { entitlement_id: "${ent_id}", inventory_asset_id: "${asset_id}", window_start: "2026-09-10T18:00:00Z", window_end: "2026-09-10T21:00:00Z", units_booked: 4, expected_inventory_asset_version: "${asset_v}" }
              as: ActivationManager
              as_user_id: "u-act-01"
              captures: { booking_id: $.data.id }
