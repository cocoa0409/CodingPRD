        excluded_because:
          difficulty_instance: "transitive_cascade / license_terminate_three_hop_entitlement_settlement_cascade"
          rationale: "The three-hop cascade with its FINAL settlement, seat revocation and session pricing is asserted end-to-end in that difficulty instance."

      - name: license_activation_guarded_by_manufacturer_parity_state
        claim_type: guarded_transition
        grounds:
          - state_machines.License.DRAFT_to_ACTIVE
          - errors[ERR_PARITY_NON_COMPLIANT]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / license_activation_depends_on_manufacturer_parity_state"
          rationale: "That instance already blocks activation on a NON_COMPLIANT OEM and then unblocks it by repricing the manufacturer, covering both sides of the guard."

  # ===========================================================================
  # From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:

      - name: entitlement_charge_per_vehicle_provisional_correct_result
        claim_type: correct_result
        grounds:
          - calculations.entitlement_charge
          - entities.ShopEntitlement.fields.vin_quota
          - endpoints."POST /entitlements"
        distinguishing_aspect: |
          The PER_VEHICLE branch of PROVISIONAL is a single rounding over
          per_vehicle_fee_cents * vin_quota * tier_mult = 2500 * 40 * 0.85 = 85000 with no
          per-line step and no seat factor, and the debit lands on data_credit_balance_cents
          leaving exactly 15000 of the 100000 funded.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; SystemArea POWERTRAIN exists"
            - "Manufacturer ACME COMPLIANT with an ACTIVE PER_VEHICLE License (per_vehicle_fee_cents 2500)"
            - "Shop 'Bay Auto' tier PRO funded 100000"
