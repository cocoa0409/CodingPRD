              as: EngagementLead
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
            - call: "POST /engagements/${eng_id}/start"
              payload: {}
              as: EngagementLead
              captures: { eng_v2: $.data.version }
            - call: "POST /scans"
              payload: { engagement_id: "${eng_id}", expected_engagement_version: "${eng_v2}" }
              as: EngagementLead
              captures: { scan_a: $.data.id }
          trigger:
            - call: "POST /scans"
              payload: { engagement_id: "${eng_id}", expected_engagement_version: "${eng_v2}" }
              as: EngagementLead
              captures: { err: $.data.error_id }
          assert:
            - "second POST /scans with the stale ${eng_v2} returns ERR_STALE_VERSION (412)"

      - name: occ_correct_audit_version_on_evidence_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[evidence-create-stale-audit]
          - endpoints["POST /evidence"]
          - entities.ComplianceAudit.fields.version
        distinguishing_aspect: "Submitting evidence with the CURRENT audit version (freshly read after begin-fieldwork bumped it) succeeds with 201; the OCC happy path complements the stale-version negative."
        test_recipe:
          setup:
            - "Audit in FIELDWORK; submitter reads the post-fieldwork version and submits evidence with it."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "OCC2", tier: "ESSENTIAL", retainer_hours_per_period: 50 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /audits"
              payload: { client_id: "${client_id}", framework: "SOC2", required_control_count: 2 }
              as: Auditor
              captures: { audit_id: $.data.id }
            - call: "POST /audits/${audit_id}/begin-fieldwork"
              payload: {}
              as: Auditor
              captures: { av1: $.data.version }
          trigger:
            - call: "POST /evidence"
              payload: { audit_id: "${audit_id}", control_ref: "CC6.1", expected_audit_version: "${av1}" }
              as: Auditor
              as_user_id: "sub-occ2"
              captures: { evid_id: $.data.id }
          assert:
            - "POST /evidence returns 201 with AuditEvidence.status == SUBMITTED (correct OCC version accepted)"

      - name: scan_complete_debits_ledger_consumed
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Scan.RUNNING_to_COMPLETED
          - entities.RetainerLedger.fields.hours_consumed
        distinguishing_aspect: "Already covered: scan-complete debiting hours_consumed and releasing over-reservation is asserted end-to-end in the §1.8 retainer dual-variant instance."
        excluded_because:
          difficulty_instance: dual_variant_calc / dual_variant_retainer_optimistic_vs_actual
          rationale: "The scan-completion ledger cascade (hours_consumed += actual_hours, reserved released) is asserted verbatim by the retainer dual-variant difficulty instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_posture_visible_in_same_response
        claim_type: immediate
        grounds:
          - entities.Client.fields.posture
          - state_machines.Incident.DETECTED_to_ESCALATED
        distinguishing_aspect: "The consistency model is immediate: after escalate, the very next GET /clients/{id} shows posture == LOCKDOWN with no lag (no eventual reconciliation step)."
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_alert_promote_incident_escalate_lockdown_depth3
          rationale: "Immediate visibility of the recomputed posture after escalate is asserted directly in the depth-3 cascade difficulty instance (GET /clients shows LOCKDOWN right after escalate)."
