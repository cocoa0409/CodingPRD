              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id", eng_v0: "$.data.version" }
          trigger:
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "ORCH", seats_allocated: 400, base_price_cents: 8000, price_ceiling_cents: 10000, dynamic_pricing_enabled: true, subscription_eligible: true }
              captures: { tier_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: BoxOfficeManager
          assert:
            - "201 for the tier; the engagement read then shows the combined state (lifecycle_status 'DRAFT', financial_clearance 'UNASSESSED', ticketing_status 'TIERS_DRAFT')."
            - "risk_score 0 and risk_tier 'LOW' are untouched: drafting tiers does not trigger §1.3 financial_risk_score."
            - "projected_gross_cents is still 0 - §1.3 engagement_margin PROJECTED only runs on assess-risk and on-sale, not on tier creation."
            - "engagement.version == ${eng_v0} (still 1), exactly as §1.5 declares for this endpoint, while the new tier row has its own version 1."

      - name: labor_hours_reported_on_draft_engagement_is_rejected
        claim_type: guarded_transitions
        grounds:
          - "§1.2 LaborCall ESTIMATED -> WORKED requires engagement.lifecycle_status IN {CONFIRMED, PERFORMED} - a cross-entity guard."
          - "§1.6 ERR_ENGAGEMENT_NOT_CONFIRMED (409); §1.4 priority 40."
          - "§1.5 POST /engagements/{id}/labor-calls carries no lifecycle precondition, so calls may be estimated while DRAFT."
        distinguishing_aspect: >-
          Pins the asymmetry that makes this guard interesting: estimating a call
          on a DRAFT engagement is legal, but reporting hours against it is not.
          The guard lives on a DIFFERENT entity from the one being transitioned,
          so an implementation that only inspects call.status accepts the write.
        test_recipe:
          setup:
            - "Grand Hall, rental client 'Meridian Dance Company' (credit A) and UnionDepartment STAGEHANDS (roster 20, 5000/h, defaults 1.5 / 2.0 / 4 h / 3500) exist."
            - "A DRAFT RENTAL engagement (load-in 2026-10-01T08:00Z, performance 2026-10-02T19:00Z-22:00Z, load-out 2026-10-03T02:00Z) exists with facility_fee_cents 700000."
            - "One labor call was estimated inside that window: crew 4, 2026-10-01T08:00Z-12:00Z, so §1.3 labor_cost ESTIMATE gives max(4, call_minimum 4) = 4 straight hours -> round_half_up(4 * 5000) = 20000 per crew member -> 80000, and engagement.labor_estimate_total_cents is 80000."
            - "Nothing has been cleared, deposited, assessed or confirmed, so the engagement is still DRAFT."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /union-departments"
              as: CenterAdmin
              payload: { department: "STAGEHANDS", roster_size: 20, straight_hourly_rate_cents: 5000 }
              captures: { dept_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Guarded Hours Probe", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/labor-calls"
              as: TechnicalDirector
              payload: { union_department_id: "${dept_id}", crew_size: 4, call_start_utc: "2026-10-01T08:00:00Z", call_end_utc: "2026-10-01T12:00:00Z" }
              captures: { call_id: "$.data.id" }
          trigger:
            - call: "POST /labor-calls/${call_id}/report-hours"
              as: TechnicalDirector
              payload: { actual_hours: 4, meal_break_taken: true }
              captures: { err: "$.data.error_id" }
            - call: "GET /engagements/${engagement_id}/labor-calls"
              as: TechnicalDirector
          assert:
            - "409 ERR_ENGAGEMENT_NOT_CONFIRMED - the call itself was in the correct ESTIMATED source state, so only the cross-entity guard can have rejected it."
            - "The call is still ESTIMATED with actual_hours null, meal_break_taken null and actual_cost_cents 0."
            - "estimated_cost_cents is still 80000 and engagement.labor_estimate_total_cents is still 80000."
            - "The call's version is unchanged at 1 - the rejected report wrote nothing."

      - name: accepting_fee_that_turns_margin_negative_escalates_a_cleared_engagement
        claim_type: cross_entity_side_effect
        grounds:
          - "§1.2 Engagement.financial_clearance CLEARED -> ESCALATED, `system, cascaded from POST /fee-negotiations/{id}/accept`, precondition projected_margin_cents < 0 after the accepted guarantee is written."
          - "§1.2 DRAFT -> CONFIRMED requires financial_clearance IN {CLEARED, ESCALATED_APPROVED}."
          - "§1.3 engagement_margin PROJECTED and §1.6 ERR_CLEARANCE_REQUIRED (422)."
        distinguishing_aspect: >-
          A cascade that runs backwards through the workflow: accepting a fee
          (a negotiation-entity write) revokes an already-granted clearance on
          the parent and thereby blocks a confirmation that would have succeeded
          moments earlier. The follow-on confirm proves the revocation is real
          and not cosmetic, and it reaches the priority-80 clearance check only
          because the rider was cleared first (priority 40 would otherwise win).
        test_recipe:
          setup:
            - "Grand Hall and artist 'Cadence Quartet' exist (guarantee_floor_cents 200000, historical_sell_through_pct 0.8, routing window 2026-09-01 -> 2026-12-31)."
            - "A PRESENTED engagement exists on Grand Hall (2026-10-11T19:00Z-22:00Z), version 1, and one ACTIVE tier ORCH (100 seats, base 10000) gives §1.3 projected_gross_cents = round_half_up(10000 * 100 * 0.8) = 800000."
            - "Risk was assessed with no negotiation open: fee_basis 0 -> exposure 0, routing slack min(40, 80) = 40 days >= 14 -> 0, lead 71 days -> 0.20 * (1 - 71/120) = 0.081667, sell-through 0.10 * 0.2 = 0.02; score = round_half_up(100 * 0.101667) = 10 -> LOW -> financial_clearance CLEARED, projected_margin_cents = 800000 - 250000 = 550000. The engagement is now at version 2."
            - "Round 1 was then opened at 700000 / 0.10 (above the 200000 floor), taking the engagement to version 3; the round is OFFERED."
            - "The artist's representative submitted a rider inside every limit (1000 kg, 200 A, 2 universes), the technical director reviewed it to CAPABLE and cleared it, and none of those three calls touches engagement.version."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
