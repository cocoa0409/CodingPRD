            - call: "POST /api/cards/${c_id}/access-grants"
              payload: { zone_id: "${z_id}", clearance: "STANDARD", valid_from: "2026-08-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }
              as: SecurityOfficer
              captures: { g_id: $.data.id }
            - { call: "POST /api/cards/${c_id}/report-lost", payload: {}, as: CardHolder, as_user_id: "${h_id}" }
          trigger:
            - call: "POST /api/access-events"
              payload: { card_id: "${c_id}", zone_id: "${z_id}" }
              as: DoorController
              captures: { ev_dec: $.data.decision, ev_reason: $.data.deny_reason }
            - call: "GET /api/access-grants/${g_id}"
              payload: {}
              as: SecurityOfficer
              captures: { g_status: $.data.status, g_reason: $.data.suspended_reason }
          assert:
            - "AccessEvent: decision == DENIED, deny_reason == CARD_NOT_ACTIVE"
            - "AccessGrant.${g_id}: status == SUSPENDED, suspended_reason == CARD_FROZEN (freeze cascade)"

      - name: cancel_enrollment_voids_approved_change_request
        claim_type: side_effect_execution
        grounds: ["state_machines.MealPlanEnrollment.ACTIVE_to_CANCELLED", "state_machines.PlanChangeRequest.APPROVED_to_VOID", "entities.PlanChangeRequest.fields.void_reason"]
        distinguishing_aspect: "Cancelling an ACTIVE enrollment before the deferred execution week voids its APPROVED change request with void_reason ENROLLMENT_CANCELLED and posts the cancel credit; no successor is created at the next advance-week."
        test_recipe:
          setup: ["Term T-CVC OPEN at week 2; plans P-CVC-A / P-CVC-B published; holder with ACTIVE enrollment and an APPROVED change request (effective week 3)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/terms"
              payload: { term_code: "T-CVC", name: "CVC", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "WEEKLY" }
              as: DiningServicesManager
              captures: { t_id: $.data.id }
            - call: "POST /api/meal-plans"
              payload: { plan_code: "P-CVC-A", name: "A", weekly_swipe_allowance: 5, dining_dollar_allocation_cents: 10000, price_cents: 90000, eligible_holder_types: ["STUDENT_COMMUTER"] }
              as: DiningServicesManager
              captures: { pa_id: $.data.id }
            - call: "POST /api/meal-plans"
              payload: { plan_code: "P-CVC-B", name: "B", weekly_swipe_allowance: 10, dining_dollar_allocation_cents: 20000, price_cents: 120000, eligible_holder_types: ["STUDENT_COMMUTER"] }
              as: DiningServicesManager
              captures: { pb_id: $.data.id }
            - { call: "POST /api/meal-plans/${pa_id}/publish", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/meal-plans/${pb_id}/publish", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/terms/${t_id}/open", payload: {}, as: DiningServicesManager }
            - call: "POST /api/card-holders"
              payload: { university_id: "U96002", full_name: "Lin Void", email: "lin@x.edu", holder_type: "STUDENT_COMMUTER", housing_status: "COMMUTER" }
              as: CardOfficeAdmin
              captures: { h_id: $.data.id }
            - call: "POST /api/card-holders/${h_id}/enrollments"
              payload: { plan_id: "${pa_id}", term_id: "${t_id}" }
              as: DiningServicesManager
              captures: { e_id: $.data.id }
            - { call: "POST /api/terms/${t_id}/advance-week", payload: {}, as: DiningServicesManager }
            - call: "GET /api/enrollments/${e_id}"
              payload: {}
              as: DiningServicesManager
              captures: { e_v: $.data.version }
            - call: "POST /api/enrollments/${e_id}/change-requests"
              payload: { new_plan_id: "${pb_id}", expected_enrollment_version: "${e_v}" }
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { cr_id: $.data.id }
            - { call: "POST /api/change-requests/${cr_id}/approve", payload: {}, as: DiningServicesManager }
          trigger:
            - { call: "POST /api/enrollments/${e_id}/cancel", payload: {}, as: DiningServicesManager }
            - call: "GET /api/change-requests/${cr_id}"
              payload: {}
              as: DiningServicesManager
              captures: { cr_status: $.data.status, cr_void: $.data.void_reason }
            - { call: "POST /api/terms/${t_id}/advance-week", payload: {}, as: DiningServicesManager }
            - call: "GET /api/enrollments"
              payload: { supersedes_enrollment_id: "${e_id}" }
              as: DiningServicesManager
              captures: { }
          assert:
            - "After cancel: PlanChangeRequest.${cr_id}.status == VOID with void_reason == ENROLLMENT_CANCELLED"
            - "The VOID request is not re-executed: advance-week produces no successor enrollment (successors list empty)"
            - "MealPlanEnrollment.${e_id}.status == CANCELLED with credit_cents == 84375 (cancel at week 2: earned round_half_up(90000*1/16) == 5625)"
