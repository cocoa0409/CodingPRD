          setup:
            - "A portfolio with only 30000000 cents of capital, so the 36540000 cent commitment implied by a 36000000 offer cannot be reserved."
            - "A deal in NEGOTIATION whose offer of 36000000 cents is SENT with expires_at 2026-09-30T00:00:00Z."
