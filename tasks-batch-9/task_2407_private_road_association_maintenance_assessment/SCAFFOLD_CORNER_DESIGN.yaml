# §1.9 Scaffold Corner Design — breadth probe over the claim-extraction guide's nine sections.
# Every `section:` value and every `claim_type:` value below is taken from
# references/claim-extraction-guide.md; no categories are invented here.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub instead of a test_recipe.
scaffold_corner_design:

  - section: entities
    instances:

      - name: parcel_creation_returns_computed_share_units_and_is_readable_by_id
        claim_type: creation
        grounds:
          - endpoints[POST /parcels]
          - endpoints[GET /parcels/{parcel_id}]
          - entities.Parcel.fields.frontage_share_units
          - entities.Parcel.fields.trip_share_units
          - calculations.parcel_share_units
        distinguishing_aspect: "POST /parcels returns 201 with every input field echoed and both share-unit fields computed at creation (290.0 frontage units, 208.0 trip units), and GET /parcels/{id} returns byte-identical values inside the declared success envelope."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-08-01T00:00:00Z."
            - "One Association and one RoadSegment exist; no parcels yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AssociationSecretary
              as_user_id: "sec-1"
            - call: "POST /associations"
              payload: { name: "Ridge Hollow Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Ridge Hollow Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P41", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { p1_id: $.data.id }
            - call: "GET /parcels/${p1_id}"
              payload: {}
              as: AssessmentClerk
              as_user_id: "clerk-1"
          assert:
            - "POST /parcels returns HTTP 201 with response_type object and a meta block carrying api_request_id and api_request_timestamp"
            - "the created Parcel reads road_segment_id == the segment id, deed_book_page DB120-P41, frontage_feet 290, usage_class RESIDENTIAL_YEAR_ROUND, trips_per_day 6, covenant_recorded true"
            - "Parcel.frontage_share_units == 290.0 (290 * 1.00 for RESIDENTIAL_YEAR_ROUND)"
            - "Parcel.trip_share_units == 208.0 (6 * 25 + 290 * 0.20)"
            - "Parcel.status == ACTIVE and Parcel.parent_parcel_id is null"
            - "GET /parcels/{p1_id} returns HTTP 200 with the identical id, frontage_share_units 290.0, trip_share_units 208.0 and version 1"

      - name: parcel_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /parcels]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three parcels on one segment, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true; limit 2 / offset 2 returns 1 row with has_more false; limit 101 is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One Association, one RoadSegment, exactly three ACTIVE parcels on that segment."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cedar Draw Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Cedar Draw Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB121-P01", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pa_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB121-P02", frontage_feet: 240, usage_class: "SEASONAL", trips_per_day: 2, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pb_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB121-P03", frontage_feet: 200, usage_class: "AGRICULTURAL", trips_per_day: 1, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pc_id: $.data.id }
          trigger:
            - call: "GET /parcels"
              payload: { road_segment_id: "${seg_id}", limit: 2, offset: 0 }
              as: AssessmentClerk
              as_user_id: "clerk-1"
            - call: "GET /parcels"
              payload: { road_segment_id: "${seg_id}", limit: 2, offset: 2 }
              as: AssessmentClerk
              as_user_id: "clerk-1"
            - call: "GET /parcels"
              payload: { road_segment_id: "${seg_id}", limit: 101 }
              as: AssessmentClerk
              as_user_id: "clerk-1"
              captures: { err_limit: $.data.error_id }
          assert:
            - "page 1 returns HTTP 200 with response_type array, exactly 2 data rows, total_count 3, has_more true, limit 2 and offset 0"
            - "page 2 returns exactly 1 data row, total_count 3, has_more false, limit 2 and offset 2"
            - "the union of the two pages is exactly {pa_id, pb_id, pc_id} with no row repeated across pages"
            - "the limit 101 request returns HTTP 400 with error_id ERR_INVALID_REQUEST because limit must sit in 1..100"

      - name: assessment_charge_get_with_an_unknown_id_returns_charge_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /assessment-charges/{charge_id}]
          - validations[priority=5]
          - errors[ERR_CHARGE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid UUID that matches no AssessmentCharge row returns HTTP 404 ERR_CHARGE_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty DB apart from the logical clock; no AssessmentCharge rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AssessmentClerk
              as_user_id: "clerk-1"
          trigger:
            - call: "GET /assessment-charges/00000000-0000-0000-0000-0000000000c1"
              payload: {}
              as: AssessmentClerk
              as_user_id: "clerk-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response is HTTP 404 with response_type error and data.error_id == ERR_CHARGE_NOT_FOUND"
            - "data.message is a non-empty string and no charge row is created by the read"

      - name: member_create_missing_required_deed_recorded_date_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /members]
          - entities.Member.fields.deed_recorded_date
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /members with owner_name, parcel_id and deed_book_page but no deed_recorded_date returns HTTP 400 ERR_INVALID_REQUEST and creates no Member row."
        test_recipe:
          setup:
            - "One Association, one RoadSegment, one ACTIVE covenant-recorded Parcel, zero Members."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Bell Hollow Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Bell Hollow Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB122-P07", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "A. Whitcomb", deed_book_page: "DB122-P07" }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { err: $.data.error_id }
            - call: "GET /members"
              payload: { parcel_id: "${p1_id}" }
              as: AssociationSecretary
              as_user_id: "sec-1"
          assert:
            - "the create returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /members?parcel_id=... returns total_count 0: the rejected request persisted nothing"

      - name: association_create_omitting_optional_inputs_applies_declared_defaults
        claim_type: defaults
        grounds:
          - endpoints[POST /associations]
          - entities.Association.fields.default_voting_basis
          - entities.Association.fields.delinquency_interest_basis
          - entities.Association.fields.quorum_bps
          - entities.Association.fields.reserve_posture
        distinguishing_aspect: "Creating an Association with only name and reserve_target_cents yields default_voting_basis PER_PARCEL, delinquency_interest_basis STATUTORY, quorum_bps 5000, reserve_balance_cents 0, reserve_funding_ratio 0 and reserve_posture UNDERFUNDED."
        test_recipe:
          setup:
            - "Empty DB; the clock is pinned so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AssociationSecretary
              as_user_id: "sec-1"
          trigger:
            - call: "POST /associations"
              payload: { name: "Quarry Lane Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "GET /associations/${assoc_id}"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-1"
          assert:
            - "the created Association reads default_voting_basis == PER_PARCEL and delinquency_interest_basis == STATUTORY"
            - "quorum_bps == 5000"
            - "reserve_balance_cents == 0, reserve_funding_ratio == 0 and reserve_posture == UNDERFUNDED"
            - "version == 1 and the GET returns the same six values, proving the defaults were persisted rather than only rendered"

      - name: member_create_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - endpoints[POST /members]
          - entities.Member.fields.standing_status
          - entities.Member.fields.encumbered_principal_cents
          - entities.Member.fields.restricted_days_used
          - calculations.member_standing_reconciliation
        distinguishing_aspect: "A create payload carrying standing_status GOOD_STANDING and encumbered_principal_cents 999999 is ignored: the row is written with standing_status PENDING_DEED_VERIFICATION and encumbered_principal_cents 0."
        test_recipe:
          setup:
            - "One Association, one RoadSegment, one ACTIVE covenant-recorded Parcel."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Hollis Spur Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Hollis Spur", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB123-P11", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "R. Mireles", deed_book_page: "DB123-P11", deed_recorded_date: "2019-04-11", standing_status: "GOOD_STANDING", encumbered_principal_cents: 999999, restricted_days_used: 40 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { m1_id: $.data.id }
          assert:
            - "Member.standing_status == PENDING_DEED_VERIFICATION, not the supplied GOOD_STANDING"
            - "Member.access_status == UNRESTRICTED"
            - "Member.encumbered_principal_cents == 0 and Member.restricted_days_used == 0, not the supplied 999999 and 40"
            - "Member.deed_verified_at is null"

      - name: parcel_create_system_fields_are_server_generated_extra_field_ignored
        claim_type: system_fields
        grounds:
          - endpoints[POST /parcels]
          - entities.Parcel.fields.parent_parcel_id
          - entities.Parcel.fields.status
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server, and a client-supplied parent_parcel_id is ignored: the created Parcel reads parent_parcel_id null and version 1."
        test_recipe:
          setup:
            - "One Association, one RoadSegment, one existing parcel whose id is used as the bogus parent_parcel_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AssociationSecretary
              as_user_id: "sec-1"
            - call: "POST /associations"
              payload: { name: "Fox Run Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Fox Run Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB124-P01", frontage_feet: 200, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 2, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB124-P02", frontage_feet: 240, usage_class: "SEASONAL", trips_per_day: 2, covenant_recorded: true, parent_parcel_id: "${pa_id}", status: "SUBDIVIDED", version: 9 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { pb_id: $.data.id }
          assert:
            - "the created Parcel has a server-minted id different from pa_id"
            - "Parcel.parent_parcel_id == null despite the payload naming pa_id"
            - "Parcel.status == ACTIVE despite the payload naming SUBDIVIDED"
            - "Parcel.version == 1 despite the payload naming 9, and created_at == updated_at == 2026-08-01T00:00:00Z"

      - name: road_segment_and_roll_create_with_invalid_enum_and_range_values_rejected
        claim_type: type_constraints
        grounds:
          - endpoints[POST /road-segments]
          - endpoints[POST /parcels]
          - endpoints[POST /assessment-rolls]
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Three shape violations each return HTTP 400 ERR_INVALID_REQUEST: an unknown surface_type enum member, frontage_feet 0 against the declared > 0 constraint, and fiscal_year 2019 below the declared 2020..2100 range."
        test_recipe:
          setup:
            - "One Association and one RoadSegment exist so that only the shape constraint under test can fail."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Miller Ridge Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Miller Ridge Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Miller Ridge Spur", length_feet: 900, width_feet: 22, max_grade_pct: 8, surface_type: "ASPHALT", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 1 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB125-P01", frontage_feet: 0, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 2, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { err_range: $.data.error_id }
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2019, fy_start_date: "2019-01-01", fy_end_date: "2019-12-31", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              as_user_id: "clerk-1"
              captures: { err_year: $.data.error_id }
          assert:
            - "the ASPHALT surface_type request returns HTTP 400 with error_id ERR_INVALID_REQUEST and no RoadSegment is created"
            - "the frontage_feet 0 request returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the fiscal_year 2019 request returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "after all three rejections GET /road-segments?association_id=... returns total_count 1"

      - name: parcel_create_with_an_unknown_road_segment_returns_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /parcels]
          - entities.Parcel.fields.road_segment_id
          - validations[priority=6]
          - errors[ERR_ROAD_SEGMENT_NOT_FOUND]
        distinguishing_aspect: "A body foreign key that resolves to nothing is a 404 ERR_ROAD_SEGMENT_NOT_FOUND, distinct from the 400 shape error: the field is present and well formed but references no row."
        test_recipe:
          setup:
            - "One Association and one real RoadSegment exist; the payload names a different, non-existent segment id."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Pine Bench Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Pine Bench Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /parcels"
              payload: { road_segment_id: "00000000-0000-0000-0000-0000000000f9", deed_book_page: "DB126-P01", frontage_feet: 240, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 3, covenant_recorded: true }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { err: $.data.error_id }
            - call: "GET /parcels"
              payload: { road_segment_id: "${seg_id}" }
              as: AssociationSecretary
              as_user_id: "sec-1"
          assert:
            - "the create returns HTTP 404 with error_id ERR_ROAD_SEGMENT_NOT_FOUND"
            - "GET /parcels?road_segment_id=... returns total_count 0: nothing was attached to the real segment either"

      - name: award_with_a_bid_from_another_project_returns_bid_project_mismatch
        claim_type: flat
        grounds:
          - endpoints[POST /maintenance-projects/{project_id}/award]
          - entities.ContractorBid.fields.project_id
          - validations[priority=36]
          - errors[ERR_BID_PROJECT_MISMATCH]
        distinguishing_aspect: "With the flat topology, referential integrity is checked pairwise: a bid_id that exists but whose project_id points at the sibling project returns ERR_BID_PROJECT_MISMATCH rather than awarding across projects."
        test_recipe:
          setup:
            - "One Association, one RoadSegment, two GRADING projects with non-overlapping windows, one bonded SUBMITTED bid on each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RoadCommissioner
              as_user_id: "rc-1"
            - call: "POST /associations"
              payload: { name: "Tanner Gap Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Tanner Gap Main", length_feet: 1600, width_feet: 22, max_grade_pct: 8, surface_type: "GRAVEL", turnout_count: 1, turnaround_present: true, bridge_present: false, culvert_count: 2 }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "GRADING", window_start_date: "2026-08-05", window_end_date: "2026-08-08" }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { proj_a: $.data.id, proj_a_v: $.data.version }
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "GRADING", window_start_date: "2026-08-20", window_end_date: "2026-08-23" }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { proj_b: $.data.id, proj_b_v: $.data.version }
            - call: "POST /maintenance-projects/${proj_a}/contractor-bids"
              payload: { contractor_name: "Basin Grading LLC", amount_cents: 400000, bond_on_file: true, expected_project_version: "${proj_a_v}" }
              as: Contractor
              as_user_id: "c-1"
              captures: { bid_a: $.data.id }
            - call: "POST /maintenance-projects/${proj_b}/contractor-bids"
              payload: { contractor_name: "Basin Grading LLC", amount_cents: 350000, bond_on_file: true, expected_project_version: "${proj_b_v}" }
              as: Contractor
              as_user_id: "c-1"
              captures: { bid_b: $.data.id }
          trigger:
            - call: "POST /maintenance-projects/${proj_a}/award"
              payload: { bid_id: "${bid_b}" }
              as: RoadCommissioner
              as_user_id: "rc-2"
              captures: { err: $.data.error_id }
          assert:
            - "the award returns HTTP 409 with error_id ERR_BID_PROJECT_MISMATCH"
            - "project A is still BID_SOLICITATION with awarded_bid_id null, awarded_amount_cents 0 and reserve_draw_cents 0"
            - "bid_b is still SUBMITTED and bid_a is still SUBMITTED: no cross-project rejection cascade ran"
            - "the association still reads reserve_balance_cents 0 and reserve_posture UNDERFUNDED"

  - section: state_machines
    instances:

      - name: roll_certification_moves_draft_to_certified_and_freezes_one_charge_per_parcel
        claim_type: valid_transition
        grounds:
          - state_machines.AssessmentRoll.DRAFT_to_CERTIFIED
          - endpoints[POST /assessment-rolls/{roll_id}/certify]
