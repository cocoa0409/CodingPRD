      - name: only_a_blocking_conflict_filed_during_drafting_bounces_the_request
        claim_type: Conditional cascade
        grounds:
          - state_machines.DraftingRequest.DRAFTING_to_RETURNED_FOR_CLARIFICATION
          - state_machines.StatutoryConflict.null_to_OPEN.side_effects
        distinguishing_aspect: "Three conflict filings on one request separate the guard from the counters: a BLOCKING conflict filed in RESEARCH raises the counters but leaves the status RESEARCH; an ADVISORY conflict filed in DRAFTING raises advisory_conflict_count only; the BLOCKING conflict filed in DRAFTING is the sole filing that moves the status to RETURNED_FOR_CLARIFICATION."
        test_recipe:
          setup:
            - "CONVENED session; request dr assigned to d1 and sitting in RESEARCH; senior counsel rc available."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
