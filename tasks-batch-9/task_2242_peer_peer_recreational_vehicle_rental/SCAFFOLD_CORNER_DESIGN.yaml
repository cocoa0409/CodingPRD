              as: PlatformAdmin
              captures: { owner2_id: "$.data.id" }
          trigger:
            - call: "POST /rv-marketplace/listings/${listing_id}/archive"
              as: Owner
              as_user_id: "${owner2_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSPECTION_PHOTO"
                zone: "INTERIOR"
                image_ref: "s3://insp/interloper.jpg"
                expected_listing_version: "${listing_v} + 13"
              as: Owner
              as_user_id: "${owner2_id}"
              captures: { err2: "$.data.error_id" }
            - call: "POST /rv-marketplace/bookings/${booking_id}/approve"
              as: Owner
              as_user_id: "${owner2_id}"
              captures: { err3: "$.data.error_id" }
          assert:
            - "every trigger step: response 403 and data.error_id == 'ERR_NOT_RESOURCE_OWNER'"
            - "GET /rv-marketplace/listings/${listing_id} returns data.listing_status == 'LISTED' and data.version == 14"
            - "GET /rv-marketplace/bookings/${booking_id} returns data.trip_status == 'REQUESTED'"
            - "GET /rv-marketplace/vehicle-documents with listing_id == ${listing_id} returns total_count == 8"

      - name: metering_and_return_are_genuinely_shared_between_owner_and_renter
        claim_type: shared_operations_allowed
        grounds:
          - roles.Owner.shared_operations
