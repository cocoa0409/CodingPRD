            - call: "POST /duct-sealing/seal-jobs"
              payload: { duct_system_id: "${ds1_id}", pre_test_id: "${pre1_id}", technician_id: "${tech1_id}", scheduled_start_at: "2026-08-02T13:00:00Z", scheduled_end_at: "2026-08-02T18:00:00Z", target_leakage_cfm: 60.0, expected_duct_system_version: "${ds1_v_fresh}" }
