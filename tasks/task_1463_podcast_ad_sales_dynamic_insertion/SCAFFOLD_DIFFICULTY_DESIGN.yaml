  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: campaign_activation_requires_approved_copy
        grounds:
          - state_machines.Campaign.DRAFT_to_ACTIVE
          - state_machines.AdCopy.SUBMITTED_to_APPROVED
          - errors[ERR_NO_APPROVED_COPY]
        distinguishing_aspect: |
          Entity pair Campaign x AdCopy: the campaign's DRAFT->ACTIVE transition
          is gated on a DIFFERENT entity — at least one AdCopy of the campaign in
          APPROVED; with only a SUBMITTED copy the activation fails, and it
          succeeds only after the copy's own state machine reaches APPROVED.
        test_recipe:
          setup:
            - "Direct advertiser; DRAFT campaign; one PRODUCED_AUDIO copy that is SUBMITTED (not yet APPROVED)"
          setup_api_calls:
            - call: "POST /adnet/advertisers"
              payload: { name: "GateCo", category: "FINTECH" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CG", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 100, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
          trigger:
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
          assert:
            - "First ACTIVATE fails with ERR_NO_APPROVED_COPY (copy still SUBMITTED)"
            - "After the copy reaches APPROVED, the second ACTIVATE succeeds and Campaign.${cmp}.status == ACTIVE"

      - name: invoice_issue_blocked_by_offered_makegood
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.MakeGood.OFFERED_to_DECLINED
          - errors[ERR_MAKE_GOOD_OUTSTANDING]
        distinguishing_aspect: |
          Entity pair Invoice x MakeGood: the invoice's DRAFT->ISSUED transition
          is gated on a DIFFERENT entity — no MakeGood of the campaign in
          OFFERED; issuance fails while the offer stands and succeeds only after
          the make-good reaches DECLINED.
        test_recipe:
          setup:
            - "Direct advertiser; campaign ACTUAL_DELIVERY booked 1000 cpm 2000; 800 qualified deliveries measured; campaign ENDED; invoice DRAFT with shortfall 200; MakeGood OFFERED"
          setup_api_calls:
            - call: "POST /adnet/shows"
              payload: { title: "Gate FM", content_category: "NEWS", avg_downloads_30d: 10000 }
              as: AdOps
              captures: { sh: $.data.id }
            - call: "POST /adnet/episodes"
              payload: { show_id: "${sh}", title: "E1", publish_at: "2026-08-01T00:00:00Z", measurement_window_days: 30, slot_capacity: 2 }
              as: AdOps
              captures: { ep: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "GateBrand", category: "AUTOMOTIVE" }
              as: AdOps
              captures: { adv: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${adv}", name: "CI", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 1000, cpm_cents: 2000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
              captures: { cmp: $.data.id }
            - call: "POST /adnet/ad-copies"
              payload: { campaign_id: "${cmp}", kind: "PRODUCED_AUDIO", script_text: "spot" }
              as: Advertiser
              as_user_id: "${adv}"
              captures: { cpy: $.data.id }
            - call: "POST /adnet/ad-copies/${cpy}/submit"
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/ad-copies/${cpy}/review"
              payload: { action: "APPROVE" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/line-items"
              payload: { campaign_id: "${cmp}", show_id: "${sh}", ad_format: "PRODUCED_SPOT", position: "MID_ROLL", reserved_impressions: 500, priority: 10, ad_copy_id: "${cpy}" }
              as: AdOps
              captures: { li: $.data.id }
            - call: "POST /adnet/line-items/${li}/transition"
              payload: { action: "ACTIVATE" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "PUBLISH" }
              as: AdOps
            - call: "POST /adnet/downloads"
              payload: { episode_id: "${ep}", listener_key_prefix: "P", count: 800, occurred_at: "2026-08-05T00:00:00Z", user_agent_class: "HUMAN" }
              as: Ingestion
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:01Z" }
              as: AdOps
            - call: "POST /adnet/episodes/${ep}/transition"
              payload: { action: "FINALIZE_MEASUREMENT" }
              as: AdOps
            - call: "POST /adnet/campaigns/${cmp}/transition"
              payload: { action: "END" }
              as: AdOps
            - call: "POST /adnet/invoices"
              payload: { campaign_id: "${cmp}" }
              as: Finance
              captures: { inv: $.data.id }
            - call: "GET /adnet/make-goods"
              payload: { campaign_id: "${cmp}" }
              as: Finance
              captures: { mg: "$.data[0].id" }
          trigger:
            - call: "POST /adnet/invoices/${inv}/transition"
              payload: { action: "ISSUE" }
              as: Finance
            - call: "POST /adnet/make-goods/${mg}/transition"
              payload: { action: "DECLINE" }
              as: Advertiser
              as_user_id: "${adv}"
            - call: "POST /adnet/invoices/${inv}/transition"
              payload: { action: "ISSUE" }
              as: Finance
          assert:
            - "First ISSUE fails with ERR_MAKE_GOOD_OUTSTANDING while MakeGood.${mg}.status == OFFERED"
            - "After DECLINE, ISSUE succeeds: Invoice.${inv}.status == ISSUED and make_good_credit_cents == 400"

