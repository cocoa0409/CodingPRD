            - "rollover fired despite FROZEN lifecycle — the two state dimensions are not coupled"

  # ==========================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and >= 2; different triggers)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: activate_cascade_depth3
        grounds:
          - state_machines.RateSheet.SCHEDULED_to_EFFECTIVE
          - state_machines.RateSheet.EFFECTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-3 chain from POST /rate-sheets/{id}/activate: activation supersedes S_old (link 1);
          supersession reprices variable accounts and grandfatheres term accounts (link 2); each
          repriced account with a >= 10 bp drop spawns a RATE_CHANGE_ADVERSE notice (link 3) — plus
