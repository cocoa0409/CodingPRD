# =============================================================================
# Task 0571 — racquet-club — §1.9 Scaffold Corner Design (breadth probe)
# Enumerates testable claims of §1.1–§1.7 not already covered by §1.8.
# Same structured-call contract & §1.5 reachability as §1.8. Clock default
# 2026-05-01T00:00:00Z. Names are unique across §1.8 and §1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: court_create_returns_all_fields
        claim_type: Creation
        grounds: [entities.Court, endpoints]
        distinguishing_aspect: "POST /racquet/courts with all required fields returns 201, status AVAILABLE, and a server-minted id/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /racquet/courts"
              payload: { name: "Outdoor 3", surface: "CLAY", location_type: "OUTDOOR", hourly_rate_cents: 3000, has_ball_machine: false, ball_machine_fee_cents: 0 }
              as: FrontDesk
              captures: { court_id: "$.data.id", v: "$.data.version" }
          assert:
            - "Court.${court_id}.status == AVAILABLE"
            - "Court.${court_id}.version == 1"
            - "Court.${court_id}.location_type == OUTDOOR"

      - name: member_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Member"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /racquet/members/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /racquet/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: member_create_missing_required_email
        claim_type: Required Fields
        grounds:
          - "entities.Member.fields.email"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /racquet/members omitting the required email returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /racquet/members"
              payload: { full_name: "No Email" }
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: court_create_invalid_enum_surface
        claim_type: Type Constraints
        grounds:
          - "entities.Court.fields.surface"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /racquet/courts with surface outside {HARD,CLAY,GRASS} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /racquet/courts"
              payload: { name: "Bad", surface: "WOOD", location_type: "INDOOR", hourly_rate_cents: 3000 }
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: reservation_default_guest_count_is_zero
        claim_type: Defaults
        grounds: [entities.Reservation.fields.guest_count]
        distinguishing_aspect: "Booking without guest_count applies the default 0; an off-peak credit hour with no guest/ball-machine yields provisional_fee_cents 0."
        test_recipe:
          setup: ["PREMIER plan, a court (no ball machine), a member with ACTIVE subscription."]
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: false, ball_machine_fee_cents: 0 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "De Fault", email: "def@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T11:00:00Z" }
              as: FrontDesk
              captures: { res_id: "$.data.id" }
          assert:
            - "Reservation.${res_id}.guest_count == 0"
            - "Reservation.${res_id}.provisional_fee_cents == 0"
            - "Reservation.${res_id}.credits_used == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_reservation_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Reservation.BOOKED_to_CANCELLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling a reservation already in CANCELLED returns ERR_INVALID_STATE; no further side effects fire."
        test_recipe:
          setup: ["PREMIER member with ACTIVE subscription, one reservation already CANCELLED."]
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: false, ball_machine_fee_cents: 0 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Re Cancel", email: "rc@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T11:00:00Z" }
              as: FrontDesk
              captures: { res_id: "$.data.id" }
            - call: "POST /racquet/reservations/${res_id}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /racquet/reservations/${res_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Subscription.${sub_id}.court_credits_remaining == 8"

      - name: reopen_available_court_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Court.MAINTENANCE_to_AVAILABLE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Reopening a court that is already AVAILABLE returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["One AVAILABLE court."]
          setup_api_calls:
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/courts/${court_id}/reopen"
              payload: {}
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: retired_court_maintenance_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Court.AVAILABLE_to_RETIRED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A RETIRED court is terminal — a subsequent maintenance transition returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["One court retired from AVAILABLE."]
          setup_api_calls:
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/courts/${court_id}/retire"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /racquet/courts/${court_id}/maintenance"
              payload: {}
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Court.${court_id}.status == RETIRED"

      - name: freeze_already_frozen_subscription_invalid_state
        claim_type: Idempotency
        grounds:
          - "state_machines.Subscription.ACTIVE_to_FROZEN"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Freezing a subscription already FROZEN returns ERR_INVALID_STATE (not a second freeze_count increment)."
        test_recipe:
          setup: ["A member with an ACTIVE subscription already frozen once."]
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Fr Ozen", email: "fr@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
            - call: "POST /racquet/subscriptions/${sub_id}/freeze"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /racquet/subscriptions/${sub_id}/freeze"
              payload: {}
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Subscription.${sub_id}.freeze_count == 1"

  # ===========================================================================
  - section: calculations
    instances:
      - name: tournament_seeding_bracket_slots_deterministic
        claim_type: Correct Result
        grounds: [calculations.competition_seeding, entities.Participant.fields.bracket_slot, state_machines]
        distinguishing_aspect: "Starting a TOURNAMENT with draw_size 2 assigns bracket_slot by seed ASC — seed-1 participant gets bracket_slot 1, seed-2 gets 2."
        test_recipe:
          setup: ["A TOURNAMENT (draw_size 2, entry_fee 0) with two ACTIVE participants seeded 1 and 2."]
          setup_api_calls:
            - call: "POST /racquet/competitions"
              payload: { name: "Spring Open", format: "TOURNAMENT", draw_size: 2, entry_fee_cents: 0 }
              as: FrontDesk
              captures: { comp_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Seed One", email: "so@x.com" }
              as: FrontDesk
              captures: { m1_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Seed Two", email: "st@x.com" }
              as: FrontDesk
              captures: { m2_id: "$.data.id" }
            - call: "POST /racquet/participants"
              payload: { competition_id: "${comp_id}", member_id: "${m1_id}", seed: 1 }
              as: FrontDesk
              captures: { p1_id: "$.data.id" }
            - call: "POST /racquet/participants"
              payload: { competition_id: "${comp_id}", member_id: "${m2_id}", seed: 2 }
              as: FrontDesk
              captures: { p2_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/competitions/${comp_id}/start"
              payload: {}
              as: FrontDesk
          assert:
            - "Participant.${p1_id}.bracket_slot == 1"
            - "Participant.${p2_id}.bracket_slot == 2"
            - "Competition.${comp_id}.status == IN_PROGRESS"

      - name: reservation_offpeak_hour_is_peak_false
        claim_type: Correct Result
        grounds: [calculations.reservation_charge, entities.Reservation.fields.is_peak]
        distinguishing_aspect: "A booking starting at 16:00 UTC (just before PEAK_START_HOUR 17) has is_peak false and no surcharge."
        test_recipe:
          setup: ["BASIC plan (0 credits), a court (rate 4000), a member with ACTIVE BASIC subscription."]
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Basic", tier: "BASIC", monthly_fee_cents: 3000, monthly_court_credits: 0, peak_access: true, guest_fee_cents: 2000, freeze_limit: 1 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000, has_ball_machine: false, ball_machine_fee_cents: 0 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Off Peak", email: "op@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-05T16:00:00Z", end_time: "2026-05-05T17:00:00Z" }
              as: FrontDesk
              captures: { res_id: "$.data.id" }
          assert:
            - "Reservation.${res_id}.is_peak == false"
            - "Reservation.${res_id}.provisional_fee_cents == 4000"

  # ===========================================================================
  - section: validations
    instances:
      - name: booking_in_past_rejected
        claim_type: Temporal validation
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_BOOKING_IN_PAST]"
        distinguishing_aspect: "With the clock at 2026-05-10, a booking whose start_time is 2026-05-05 (past) returns ERR_BOOKING_IN_PAST."
        test_recipe:
          setup: ["A court and a member with ACTIVE subscription; clock advanced to 2026-05-10."]
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Pa St", email: "ps@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
            - call: "POST /racquet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: FrontDesk
          trigger:
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T11:00:00Z" }
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_BOOKING_IN_PAST"

      - name: booking_window_exceeded_rejected
        claim_type: Temporal validation
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_BOOKING_WINDOW_EXCEEDED]"
        distinguishing_aspect: "With the clock at the default 2026-05-01, a booking 19 days ahead (2026-05-20 > MAX_ADVANCE_DAYS 14) returns ERR_BOOKING_WINDOW_EXCEEDED."
        test_recipe:
          setup: ["A court and a member with ACTIVE subscription; clock at default 2026-05-01."]
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Wi Ndow", email: "wn@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-20T10:00:00Z", end_time: "2026-05-20T11:00:00Z" }
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_BOOKING_WINDOW_EXCEEDED"

      - name: checkin_outside_window_rejected
        claim_type: Temporal validation
        grounds:
          - "validations[priority=8]"
          - "state_machines.Reservation.BOOKED_to_CHECKED_IN"
          - "errors[ERR_CHECKIN_WINDOW]"
        distinguishing_aspect: "Checking in while the clock (default 2026-05-01) is far before the reservation window [start-30m, end) returns ERR_CHECKIN_WINDOW."
        test_recipe:
          setup: ["A BOOKED reservation at 2026-05-14T10:00 with the clock still at default 2026-05-01."]
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/courts"
              payload: { name: "Indoor 1", surface: "HARD", location_type: "INDOOR", hourly_rate_cents: 4000 }
              as: FrontDesk
              captures: { court_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Ch Eck", email: "ce@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
            - call: "POST /racquet/reservations"
              payload: { court_id: "${court_id}", member_id: "${member_id}", start_time: "2026-05-14T10:00:00Z", end_time: "2026-05-14T11:00:00Z" }
              as: FrontDesk
              captures: { res_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/reservations/${res_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_CHECKIN_WINDOW"

      - name: freeze_limit_reached_rejected
        claim_type: Conditional validation
        grounds:
          - "validations[priority=9]"
          - "state_machines.Subscription.ACTIVE_to_FROZEN"
          - "errors[ERR_FREEZE_LIMIT_REACHED]"
        distinguishing_aspect: "On a plan with freeze_limit 1, a second freeze (after freeze+unfreeze) is rejected with ERR_FREEZE_LIMIT_REACHED because freeze_count (1) is not < freeze_limit (1)."
        test_recipe:
          setup: ["A member with an ACTIVE subscription on a plan whose freeze_limit is 1, already frozen and unfrozen once (freeze_count 1)."]
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Basic", tier: "BASIC", monthly_fee_cents: 3000, monthly_court_credits: 0, peak_access: true, guest_fee_cents: 2000, freeze_limit: 1 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Li Mit", email: "lm@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
            - call: "POST /racquet/subscriptions/${sub_id}/freeze"
              payload: {}
              as: FrontDesk
            - call: "POST /racquet/subscriptions/${sub_id}/unfreeze"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /racquet/subscriptions/${sub_id}/freeze"
              payload: {}
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_FREEZE_LIMIT_REACHED"
            - "Subscription.${sub_id}.freeze_count == 1"

      - name: renew_before_period_end_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=6]"
          - "state_machines.Subscription.ACTIVE_to_ACTIVE"
          - "errors[ERR_RENEW_NOT_DUE]"
        distinguishing_aspect: "Renewing a fresh subscription while the clock (2026-05-01) is before current_period_end (2026-05-31) returns ERR_RENEW_NOT_DUE."
        test_recipe:
          setup: ["A member with a fresh ACTIVE subscription (period ends 2026-05-31); clock at default."]
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/members"
              payload: { full_name: "Re New", email: "rn@x.com" }
              as: FrontDesk
              captures: { member_id: "$.data.id" }
            - call: "POST /racquet/subscriptions"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /racquet/subscriptions/${sub_id}/renew"
              payload: {}
              as: FrontDesk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.data.error_id == ERR_RENEW_NOT_DUE"

      - name: second_subscription_for_member_rejected
        claim_type: Aggregate validation
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_SUBSCRIPTION_EXISTS]"
        distinguishing_aspect: "Creating a second subscription for a member who already holds a non-CANCELLED subscription returns ERR_SUBSCRIPTION_EXISTS."
        test_recipe:
          setup: ["A member with one ACTIVE subscription."]
          setup_api_calls:
            - call: "POST /racquet/membership-plans"
              payload: { name: "Premier", tier: "PREMIER", monthly_fee_cents: 5000, monthly_court_credits: 8, peak_access: true, guest_fee_cents: 1500, freeze_limit: 2 }
              as: FrontDesk
              captures: { plan_id: "$.data.id" }
            - call: "POST /racquet/members"
