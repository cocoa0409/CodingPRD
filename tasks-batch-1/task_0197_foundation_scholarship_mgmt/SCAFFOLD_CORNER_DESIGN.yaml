# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Foundation Scholarship Management — Expert
# Breadth probe: every testable claim §1.1-§1.7 surfaces that §1.8 does not
# already cover. Sections / claim_types come from references/claim-extraction-guide.md.
# All setup_api_calls reuse §1.5 endpoints; all formula-derived asserts are literals.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_scholarship_fund_returns_201_with_system_fields
        claim_type: Creation
        grounds: ["endpoints.\"POST /scholarship-funds\"", "entities.ScholarshipFund.fields.status"]
        distinguishing_aspect: "POST /scholarship-funds with all required fields -> 201; status==DRAFT, committed_cents==0, disbursed_cents==0, available_cents==endowment_cents, version==1, id+created_at present."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "F1", endowment_cents: 1000000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
          assert:
            - "response.status == 201"
            - "ScholarshipFund.${fund_id}.status == DRAFT"
            - "ScholarshipFund.${fund_id}.committed_cents == 0"
            - "ScholarshipFund.${fund_id}.disbursed_cents == 0"
            - "ScholarshipFund.${fund_id}.available_cents == 1000000"
            - "ScholarshipFund.${fund_id}.version == 1"

      - name: create_fund_default_award_term_is_fall
        claim_type: Defaults
        grounds: ["entities.ScholarshipFund.fields.award_term"]
        distinguishing_aspect: "Omitting award_term on fund create applies default FALL."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "F2", endowment_cents: 500000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
          assert:
            - "ScholarshipFund.${fund_id}.award_term == FALL"

      - name: create_fund_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["endpoints.\"POST /scholarship-funds\"", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing endowment_cents on fund create -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "NoEndow" }
              as: FoundationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: get_fund_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["endpoints.\"GET /scholarship-funds/{fundId}\"", "errors[ERR_FUND_NOT_FOUND]"]
        distinguishing_aspect: "GET /scholarship-funds/{nonexistent} -> ERR_FUND_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /scholarship-funds/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FoundationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_FUND_NOT_FOUND"

      - name: list_funds_pagination_envelope
        claim_type: Listing
        grounds: ["endpoints.\"GET /scholarship-funds\"", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /scholarship-funds returns paginated array with total_count and has_more in the envelope meta/data."
        test_recipe:
          setup: ["two funds created"]
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "A", endowment_cents: 100000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds"
              payload: { fund_name: "B", endowment_cents: 100000 }
              as: FoundationAdmin
          trigger:
            - call: "GET /scholarship-funds"
              payload: { limit: 1, offset: 0 }
              as: FoundationAdmin
          assert:
            - "response.status == 200"
            - "response.data length == 1"
            - "total_count == 2"
            - "has_more == true"

      - name: list_funds_invalid_pagination_returns_error
        claim_type: Listing
        grounds: ["endpoints.\"GET /scholarship-funds\"", "errors[ERR_INVALID_PAGINATION]"]
        distinguishing_aspect: "GET /scholarship-funds with limit above max (101) -> ERR_INVALID_PAGINATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /scholarship-funds"
              payload: { limit: 101, offset: 0 }
              as: FoundationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_PAGINATION"

      - name: applicant_self_reported_gpa_out_of_range_rejected
        claim_type: Type Constraints
        grounds: ["entities.Applicant.fields.self_reported_gpa", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Applicant create with self_reported_gpa=4.50 (above 4.0) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_name: "X", email: "x@x.edu", self_reported_gpa: 4.50, residency_state: "CA", field_of_study: "CS", institution_id: "I" }
              as: Applicant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: rubric_score_input_out_of_range_rejected
        claim_type: Type Constraints
        grounds: ["entities.RubricScore.fields.academic_score", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "RubricScore create with academic_score=150 (above 100) -> ERR_INVALID_REQUEST (400); reachable through POST /rubric-scores after an ASSIGNED slot exists."
        test_recipe:
          setup: ["member RA ASSIGNED to a DRAFT application app_id"]
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "RS Fund", endowment_cents: 500000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 2.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 500000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applicants"
              payload: { full_name: "Z", email: "z@x.edu", self_reported_gpa: 3.0, residency_state: "CA", field_of_study: "CS", institution_id: "I" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${applicant_id}", requested_amount_cents: 100000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /committee-members"
              payload: { full_name: "RA", email: "ra@x.edu", expertise_field: "CS" }
              as: CommitteeMember
              captures: { mem_a: $.data.id }
            - call: "POST /committee-assignments"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_a}" }
              as: FoundationAdmin
          trigger:
            - call: "POST /rubric-scores"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_a}", academic_score: 150, need_score: 50, essay_score: 50 }
              as: CommitteeMember
              as_user_id: "${mem_a}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: recommendation_immutable_has_no_version_field
        claim_type: Immutability
        grounds: ["entities.Recommendation.common_fields", "endpoints.\"POST /recommendations\""]
        distinguishing_aspect: "Recommendation has common_fields:false -> response carries id and created_at but no version or updated_at; there is no update endpoint."
        test_recipe:
          setup: ["a DRAFT application app_id exists"]
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "Imm Fund", endowment_cents: 500000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 2.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 500000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applicants"
              payload: { full_name: "Z", email: "z@x.edu", self_reported_gpa: 3.0, residency_state: "CA", field_of_study: "CS", institution_id: "I" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${applicant_id}", requested_amount_cents: 100000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /recommendations"
              payload: { application_id: "${app_id}", recommender_name: "R", document_uri: "s3://r" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Recommendation.${rec_id}.id is present"
            - "Recommendation.${rec_id} has no version field"

      - name: application_create_rejected_when_applicant_id_missing_row
        claim_type: Parent Relationships
        grounds: ["entities.Application.fields.applicant_id", "errors[ERR_APPLICANT_NOT_FOUND]"]
        distinguishing_aspect: "Application create referencing a non-existent applicant_id -> ERR_APPLICANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["fund OPEN exists"]
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "FK Fund", endowment_cents: 500000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 2.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 500000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
          trigger:
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "00000000-0000-0000-0000-000000000000", requested_amount_cents: 100000 }
              as: FoundationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_APPLICANT_NOT_FOUND"

      - name: fund_computed_ledger_fields_ignore_client_input
        claim_type: Computed Fields
        grounds: ["entities.ScholarshipFund.fields.committed_cents", "endpoints.\"POST /scholarship-funds\""]
        distinguishing_aspect: "committed_cents is source:computed; even if a client sends committed_cents in the body it is ignored and initialized to 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "Ign", endowment_cents: 1000000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
          assert:
            - "ScholarshipFund.${fund_id}.committed_cents == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: open_fund_twice_rejected_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.ScholarshipFund.DRAFT_to_OPEN", "errors[ERR_FUND_STATE_INVALID]"]
        distinguishing_aspect: "Fund already OPEN -> a second open returns ERR_FUND_STATE_INVALID (409); no state change."
        test_recipe:
          setup: ["fund OPEN"]
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "Twice", endowment_cents: 500000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 2.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 500000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
          trigger:
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_FUND_STATE_INVALID"
            - "ScholarshipFund.${fund_id}.status == OPEN"

      - name: open_fund_without_criteria_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ScholarshipFund.DRAFT_to_OPEN", "errors[ERR_CRITERIA_REQUIRED]"]
        distinguishing_aspect: "Opening a DRAFT fund that has no EligibilityCriteria -> ERR_CRITERIA_REQUIRED (409)."
        test_recipe:
          setup: ["fund DRAFT with NO criteria"]
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "NoCrit", endowment_cents: 500000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
          trigger:
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_CRITERIA_REQUIRED"

      - name: duplicate_eligibility_criteria_rejected
        claim_type: Precondition Enforcement
        grounds: ["endpoints.\"POST /eligibility-criteria\"", "errors[ERR_DUPLICATE_CRITERIA]"]
        distinguishing_aspect: "A second EligibilityCriteria on a fund already holding one -> ERR_DUPLICATE_CRITERIA (409)."
        test_recipe:
          setup: ["fund DRAFT already has one criteria"]
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "DupCrit", endowment_cents: 500000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 2.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 500000 }
              as: FoundationAdmin
          trigger:
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 3.00, required_residency_state: "CA", required_field_of_study: "ANY", max_award_cents: 600000 }
              as: FoundationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_DUPLICATE_CRITERIA"

      - name: submit_without_recommendation_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Application.DRAFT_to_SUBMITTED", "errors[ERR_RECOMMENDATION_REQUIRED]"]
        distinguishing_aspect: "Submitting an application with a transcript but no recommendation -> ERR_RECOMMENDATION_REQUIRED (409)."
        test_recipe:
          setup: ["DRAFT application with a transcript but zero recommendations on an OPEN fund"]
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "NoRec", endowment_cents: 500000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 2.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 500000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applicants"
              payload: { full_name: "Z", email: "z@x.edu", self_reported_gpa: 3.0, residency_state: "CA", field_of_study: "CS", institution_id: "I" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${applicant_id}", requested_amount_cents: 100000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /transcripts"
              payload: { application_id: "${app_id}", document_uri: "s3://t", verified_gpa: 3.0 }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_RECOMMENDATION_REQUIRED"
            - "Application.${app_id}.status == DRAFT"

      - name: submit_without_transcript_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Application.DRAFT_to_SUBMITTED", "errors[ERR_TRANSCRIPT_REQUIRED]"]
        distinguishing_aspect: "Submitting an application with a recommendation but no transcript -> ERR_TRANSCRIPT_REQUIRED (409)."
        test_recipe:
          setup: ["DRAFT application with a recommendation but zero transcripts on an OPEN fund"]
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "NoTx", endowment_cents: 500000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 2.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 500000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applicants"
              payload: { full_name: "Z", email: "z@x.edu", self_reported_gpa: 3.0, residency_state: "CA", field_of_study: "CS", institution_id: "I" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${applicant_id}", requested_amount_cents: 100000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /recommendations"
              payload: { application_id: "${app_id}", recommender_name: "R", document_uri: "s3://r" }
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_TRANSCRIPT_REQUIRED"

      - name: start_review_not_eligible_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Application.SUBMITTED_to_UNDER_REVIEW", "errors[ERR_NOT_ELIGIBLE]"]
        distinguishing_aspect: "An application whose eligibility_matched==false cannot move SUBMITTED -> UNDER_REVIEW -> ERR_NOT_ELIGIBLE (409)."
        test_recipe:
          setup: ["application SUBMITTED but eligibility_matched==false (verified_gpa below min_gpa); fund REVIEW; one ASSIGNED member"]
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "Inelig Fund", endowment_cents: 500000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 3.50, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 500000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applicants"
              payload: { full_name: "Lo", email: "lo@x.edu", self_reported_gpa: 3.9, residency_state: "CA", field_of_study: "CS", institution_id: "I" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${applicant_id}", requested_amount_cents: 100000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /recommendations"
              payload: { application_id: "${app_id}", recommender_name: "R", document_uri: "s3://r" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /transcripts"
              payload: { application_id: "${app_id}", document_uri: "s3://t", verified_gpa: 2.50 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /committee-members"
              payload: { full_name: "RA", email: "ra@x.edu", expertise_field: "CS" }
              as: CommitteeMember
              captures: { mem_a: $.data.id }
            - call: "POST /committee-assignments"
              payload: { application_id: "${app_id}", committee_member_id: "${mem_a}" }
              as: FoundationAdmin
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /scholarship-funds/${fund_id}/begin-review"
              payload: {}
              as: FoundationAdmin
          trigger:
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: FoundationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_NOT_ELIGIBLE"
            - "Application.${app_id}.status == SUBMITTED"

      - name: start_review_without_committee_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Application.SUBMITTED_to_UNDER_REVIEW", "errors[ERR_NO_COMMITTEE_ASSIGNED]"]
        distinguishing_aspect: "An eligible SUBMITTED application with zero ASSIGNED committee assignments cannot start review -> ERR_NO_COMMITTEE_ASSIGNED (409)."
        test_recipe:
          setup: ["eligible application SUBMITTED; fund REVIEW; no committee assignment"]
          setup_api_calls:
            - call: "POST /scholarship-funds"
              payload: { fund_name: "NoCom Fund", endowment_cents: 500000 }
              as: FoundationAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /eligibility-criteria"
              payload: { fund_id: "${fund_id}", min_gpa: 2.00, required_residency_state: "ANY", required_field_of_study: "ANY", max_award_cents: 500000 }
              as: FoundationAdmin
            - call: "POST /scholarship-funds/${fund_id}/open"
              payload: {}
              as: FoundationAdmin
            - call: "POST /applicants"
              payload: { full_name: "Lu", email: "lu@x.edu", self_reported_gpa: 3.0, residency_state: "CA", field_of_study: "CS", institution_id: "I" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { fund_id: "${fund_id}", applicant_id: "${applicant_id}", requested_amount_cents: 100000 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /recommendations"
              payload: { application_id: "${app_id}", recommender_name: "R", document_uri: "s3://r" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /transcripts"
              payload: { application_id: "${app_id}", document_uri: "s3://t", verified_gpa: 3.0 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /scholarship-funds/${fund_id}/begin-review"
              payload: {}
              as: FoundationAdmin
          trigger:
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: FoundationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_NO_COMMITTEE_ASSIGNED"

