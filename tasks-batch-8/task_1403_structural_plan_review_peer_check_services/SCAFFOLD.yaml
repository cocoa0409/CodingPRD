# =============================================================================
# Task 1403: Structural Plan Review & Peer Check Services — scaffold seed tables
# Third-party structural plan review firm: scope/code-edition applicability,
# load path & lateral verification, deficiency comment cycles, resubmittals,
# state seal / responsible-charge rules, deferred submittals, turnaround & fee
# schedule, and the sealed review record for the building department.
# =============================================================================

scenario: |
  Structural Plan Review & Peer Check Services (third-party plan review firm):
  plan review scope & code edition applicability, load path & lateral system
  verification, calculation review & deficiency comment generation, comment
  response cycle & resubmittal, seal/responsible charge requirements by state,
  deferred submittal review (trusses/anchors), review turnaround & fee schedule,
  review record for building department

domain_name: structural-plan-review
api_prefix: /plan-review

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - optimistic_concurrency        # OCC on ReviewCycle.version for assignment supersede
    - cascading_side_effects        # approve / cancel / resubmit chains across 3+ entities
    - dual_variant_calculation      # estimated vs final fee; BUSINESS vs CALENDAR SLA
    - version_pinning_on_approval   # engagement pins jurisdiction rule snapshot at registration

  entity_topology: flat             # all collections top-level under /plan-review; FK links in bodies/queries
  state_machine_shape: cyclic       # engagement revision loop; comment OPEN→ADDRESSED→REOPENED loop; deferred resubmit loop
  relationship_patterns:
    - one_to_many                   # engagement → cycles/comments/deferred; comment → responses
    - cross_aggregate               # engagement → jurisdiction + reviewer-of-record; assignment → cycle + reviewer
  role_model: segregation_of_duties # waiver by a chief reviewer who is NOT the reviewer of record; coordinator vs reviewer split
  consistency_model: immediate

  entity_count: 9
  state_machine_count: 6
  calculation_count: 8
  validation_layers: 10
  endpoint_count: 38
  error_code_count: 41
  role_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter US state code; unique across jurisdictions", constraints: "unique; uppercase 2 letters" }
      - { name: ibc_edition, type: enum, source: input, description: "Adopted building code edition: IBC_2018 | IBC_2021 | IBC_2024" }
      - { name: asce7_edition, type: enum, source: input, description: "Adopted loads standard: ASCE7_16 | ASCE7_22" }
      - { name: fee_method, type: enum, source: input, description: "VALUATION (tiered on declared valuation) | SQUARE_FOOTAGE (per-sqft by building type)" }
      - { name: turnaround_days, type: integer, source: input, description: "Base review turnaround in days; interpreted per sla_mode" }
      - { name: sla_mode, type: enum, source: input, description: "BUSINESS (skip Sat/Sun, due at end of Nth business day) | CALENDAR (received_at + N*24h)" }
      - { name: free_resubmittal_cycles, type: integer, source: input, default: 2, description: "Cycles included in base fee before per-cycle resubmittal fee applies" }
      - { name: requires_se_seal, type: boolean, source: input, default: false, description: "Whether records must be sealed by an SE-licensed (not merely PE) engineer" }
      - { name: allows_deferred_submittals, type: boolean, source: input, default: true, description: "Whether deferred submittals (trusses/anchors) are permitted in this jurisdiction" }

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Reviewer full name" }
      - { name: licenses, type: array, source: input, description: "Array of {state_code, license_type: PE|SE, license_number, expires_on (ISO date YYYY-MM-DD)}" }
      - { name: max_concurrent_assignments, type: integer, source: input, default: 3, description: "Maximum number of ACTIVE review assignments the reviewer may hold at once" }
      - { name: active_assignment_count, type: integer, source: computed, description: "Count of ReviewAssignments with reviewer_id = this reviewer and status ACTIVE" }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: project_name, type: string, source: input, description: "Project display name" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; governing jurisdiction whose rules are pinned at creation" }
      - { name: applicant_contact_id, type: string, source: input, description: "Opaque Applicant user id owning this engagement (X-User-ID must match for applicant actions)" }
      - { name: reviewer_of_record_id, type: string, source: input, description: "FK -> Reviewer.id; engineer in responsible charge; must hold a license for the pinned state" }
      - { name: building_type, type: enum, source: input, description: "RESIDENTIAL | COMMERCIAL | INDUSTRIAL | ESSENTIAL_FACILITY" }
      - { name: risk_category, type: enum, source: input, description: "ASCE 7 risk category: I | II | III | IV" }
      - { name: scope, type: enum, source: input, description: "FULL_REVIEW | LATERAL_ONLY | PEER_REVIEW" }
      - { name: declared_valuation_cents, type: integer, source: input, description: "Declared construction valuation in cents; amendable while REGISTERED or IN_PROGRESS" }
      - { name: floor_area_sqft, type: integer, source: input, description: "Gross floor area; amendable while REGISTERED or IN_PROGRESS" }
      - { name: requested_expedite, type: boolean, source: input, default: false, description: "Expedited turnaround requested (fee surcharge + halved SLA); amendable while REGISTERED or IN_PROGRESS" }
      - { name: pinned_state_code, type: string, source: computed, description: "Snapshot of jurisdiction.state_code at creation; never changes afterwards" }
      - { name: pinned_ibc_edition, type: enum, source: computed, description: "Snapshot of jurisdiction.ibc_edition at creation (version-pinning on registration)" }
      - { name: pinned_asce7_edition, type: enum, source: computed, description: "Snapshot of jurisdiction.asce7_edition at creation" }
      - { name: pinned_fee_method, type: enum, source: computed, description: "Snapshot of jurisdiction.fee_method at creation" }
      - { name: pinned_turnaround_days, type: integer, source: computed, description: "Snapshot of jurisdiction.turnaround_days at creation" }
      - { name: pinned_sla_mode, type: enum, source: computed, description: "Snapshot of jurisdiction.sla_mode at creation" }
      - { name: pinned_free_resubmittal_cycles, type: integer, source: computed, description: "Snapshot of jurisdiction.free_resubmittal_cycles at creation" }
      - { name: pinned_requires_se_seal, type: boolean, source: computed, description: "Snapshot of jurisdiction.requires_se_seal at creation" }
      - { name: pinned_allows_deferred_submittals, type: boolean, source: computed, description: "Snapshot of jurisdiction.allows_deferred_submittals at creation" }
      - { name: estimated_fee_cents, type: integer, source: computed, description: "Fee estimated at registration (scoped base + expedite component; zero resubmittal/deferred components); never recomputed" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Final fee computed at record seal using current valuation/area, actual cycle count, and approved deferred items; null until seal", constraints: "null until ReviewRecord sealed" }
      - { name: cycle_count, type: integer, source: computed, description: "Number of ReviewCycles created for this engagement" }
      - { name: unresolved_comment_count, type: integer, source: computed, description: "DeficiencyComments of this engagement with status IN {OPEN, ADDRESSED, REOPENED}" }
      - { name: deferred_pending_count, type: integer, source: computed, description: "DeferredSubmittals of this engagement with status IN {REGISTERED, SUBMITTED, REJECTED}" }
      - { name: status, type: enum, source: system, description: "REGISTERED | IN_PROGRESS | APPROVED | COMPLETED | CANCELLED" }

  - name: ReviewCycle
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: cycle_number, type: integer, source: computed, description: "1-based monotonic sequence per engagement (= engagement.cycle_count after increment)" }
      - { name: documents_ref, type: string, source: input, description: "URI of the submitted plan set for this cycle" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock timestamp at cycle creation" }
      - { name: due_at, type: datetime, source: computed, description: "Turnaround deadline per turnaround_sla calculation (pinned_turnaround_days, pinned_sla_mode, requested_expedite)" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock timestamp when the cycle reached COMMENTS_ISSUED or APPROVED; null otherwise", constraints: "null until completion" }
      - { name: is_on_time, type: boolean, source: computed, description: "completed_at <= due_at, computed at completion; null until then", constraints: "null until completion" }
      - { name: load_path_confirmed, type: boolean, source: system, description: "Load path verification attestation recorded at approve time; false until approved" }
      - { name: lateral_system_confirmed, type: boolean, source: system, description: "Lateral system verification attestation recorded at approve time; false until approved" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REVIEW | COMMENTS_ISSUED | APPROVED | SUPERSEDED | CANCELLED" }

  - name: ReviewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ReviewCycle.id" }
      - { name: reviewer_id, type: string, source: input, description: "FK -> Reviewer.id" }
      - { name: assigned_at, type: datetime, source: system, description: "Logical clock timestamp at assignment creation" }
      - { name: ended_at, type: datetime, source: system, description: "Logical clock timestamp when assignment left ACTIVE; null while ACTIVE", constraints: "null while ACTIVE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED | RELEASED" }

  - name: DeficiencyComment
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: computed, description: "FK -> Engagement.id; copied from the cycle's engagement at creation" }
      - { name: raised_in_cycle_id, type: string, source: input, description: "FK -> ReviewCycle.id; cycle in which the comment was raised (must be IN_REVIEW)" }
      - { name: raised_by_reviewer_id, type: string, source: system, description: "FK -> Reviewer.id; set from X-User-ID at creation" }
      - { name: code_section_ref, type: string, source: input, description: "Code section cited (e.g. '1604.3', '2308.6.1')" }
      - { name: reference_edition, type: enum, source: input, description: "IBC_2018 | IBC_2021 | IBC_2024; MUST equal engagement.pinned_ibc_edition" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL; CRITICAL comments cannot be waived" }
      - { name: category, type: enum, source: input, description: "LOAD_PATH | LATERAL_SYSTEM | CALCULATION | DETAILING | DEFERRED_COORDINATION" }
      - { name: comment_text, type: string, source: input, description: "Deficiency description" }
      - { name: response_count, type: integer, source: computed, description: "Number of CommentResponses posted against this comment" }
      - { name: status, type: enum, source: system, description: "OPEN | ADDRESSED | REOPENED | VERIFIED | WAIVED" }

  - name: CommentResponse
    parent: null
    common_fields: false
    fields:
      - { name: comment_id, type: string, source: system, description: "FK -> DeficiencyComment.id" }
      - { name: responder_contact_id, type: string, source: system, description: "Opaque Applicant user id from X-User-ID" }
      - { name: response_text, type: string, source: input, description: "Applicant's response describing how the deficiency was addressed" }

  - name: DeferredSubmittal
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: item_type, type: enum, source: input, description: "TRUSS | ANCHOR | STEEL_CONNECTION | CURTAIN_WALL | OTHER_DELEGATED" }
      - { name: description, type: string, source: input, description: "Deferred item description" }
      - { name: documents_ref, type: string, source: system, description: "URI of deferred design documents; null until first submit", constraints: "null until SUBMITTED" }
      - { name: rejection_reason, type: string, source: system, description: "Reviewer note recorded at reject; null otherwise", constraints: "null unless REJECTED" }
      - { name: status, type: enum, source: system, description: "REGISTERED | SUBMITTED | REJECTED | APPROVED" }

  - name: ReviewRecord
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; exactly one record per engagement (created when the engagement first reaches APPROVED)" }
      - { name: record_number, type: string, source: system, description: "Human-readable record number: 'RR-' + pinned_state_code + '-' + zero-padded engagement.cycle_count at creation" }
      - { name: pinned_ibc_edition, type: enum, source: system, description: "Snapshot of engagement.pinned_ibc_edition; refreshed if a later cycle re-approves" }
      - { name: pinned_asce7_edition, type: enum, source: system, description: "Snapshot of engagement.pinned_asce7_edition; refreshed on re-approval" }
      - { name: cycle_count_snapshot, type: integer, source: system, description: "engagement.cycle_count at the most recent approval; refreshed on re-approval" }
      - { name: sealed_by_reviewer_id, type: string, source: system, description: "FK -> Reviewer.id; null until sealed", constraints: "null until SEALED" }
      - { name: sealed_at, type: datetime, source: system, description: "Logical clock timestamp at seal; null until sealed", constraints: "null until SEALED" }
      - { name: transmitted_at, type: datetime, source: system, description: "Logical clock timestamp when transmitted to the building department; null until transmitted", constraints: "null until TRANSMITTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SEALED | TRANSMITTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Engagement
    initial_state: REGISTERED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REGISTERED
        to: IN_PROGRESS
        trigger: "system (first ReviewCycle created for this engagement)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: APPROVED
        trigger: "system (a ReviewCycle of this engagement transitions to APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "If no ReviewRecord exists for this engagement: create one in DRAFT with pinned_ibc_edition/pinned_asce7_edition snapshots and cycle_count_snapshot = engagement.cycle_count"
          - "If a DRAFT ReviewRecord already exists (re-approval after revision): refresh pinned_* snapshots and cycle_count_snapshot"
          - "increments Engagement.version by 1"

      - from: APPROVED
        to: IN_PROGRESS
        trigger: "system (revision ReviewCycle created on an APPROVED engagement)"
        actor: system
        preconditions:
          - "The engagement's ReviewRecord (if any) is still DRAFT — revision is impossible once the record is SEALED or TRANSMITTED (ERR_RECORD_ALREADY_SEALED)"
        side_effects: []

      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /plan-review/engagements/{id}/cancel"
        actor: ReviewCoordinator
        preconditions: []
        side_effects:
          - "All non-terminal ReviewCycles (OPEN, IN_REVIEW, COMMENTS_ISSUED) → CANCELLED"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /plan-review/engagements/{id}/cancel"
        actor: ReviewCoordinator
        preconditions: []
        side_effects:
          - "All non-terminal ReviewCycles (OPEN, IN_REVIEW, COMMENTS_ISSUED) → CANCELLED"

      - from: APPROVED
        to: COMPLETED
        trigger: "system (ReviewRecord transitions to TRANSMITTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReviewCycle
    initial_state: OPEN
    terminal_states: [APPROVED, SUPERSEDED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "system (first ReviewAssignment created for this cycle)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: COMMENTS_ISSUED
        trigger: "POST /plan-review/cycles/{id}/issue-comments"
        actor: Reviewer
        preconditions:
          - "Actor (X-User-ID) is the reviewer on this cycle's ACTIVE assignment (ERR_NOT_ASSIGNED_REVIEWER)"
          - "At least one DeficiencyComment raised in this cycle, OR at least one DeficiencyComment of the engagement currently REOPENED awaiting a new response round (ERR_NO_COMMENTS_TO_ISSUE)"
        side_effects:
          - "completed_at = logical clock now; is_on_time = (completed_at <= due_at)"

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /plan-review/cycles/{id}/approve"
        actor: Reviewer
        preconditions:
          - "Actor (X-User-ID) is the reviewer on this cycle's ACTIVE assignment (ERR_NOT_ASSIGNED_REVIEWER)"
          - "engagement.unresolved_comment_count == 0 (ERR_UNRESOLVED_COMMENTS_REMAIN)"
          - "Request payload load_path_confirmed == true AND lateral_system_confirmed == true (ERR_VERIFICATION_INCOMPLETE)"
        side_effects:
          - "completed_at = logical clock now; is_on_time = (completed_at <= due_at)"
          - "load_path_confirmed and lateral_system_confirmed stored on the cycle"
          - "All ACTIVE ReviewAssignments of this cycle → COMPLETED"
          - "Engagement IN_PROGRESS → APPROVED (cascade; see Engagement machine: creates/refreshes DRAFT ReviewRecord)"

      - from: COMMENTS_ISSUED
        to: SUPERSEDED
        trigger: "system (a new ReviewCycle is created for the same engagement)"
        actor: system
        preconditions: []
        side_effects:
          - "All ACTIVE ReviewAssignments of this cycle → COMPLETED"

      - from: OPEN
        to: CANCELLED
        trigger: "system (engagement cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "All ACTIVE ReviewAssignments of this cycle → RELEASED (frees reviewer capacity)"

      - from: IN_REVIEW
        to: CANCELLED
        trigger: "system (engagement cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "All ACTIVE ReviewAssignments of this cycle → RELEASED (frees reviewer capacity)"

      - from: COMMENTS_ISSUED
        to: CANCELLED
        trigger: "system (engagement cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "All ACTIVE ReviewAssignments of this cycle → RELEASED (frees reviewer capacity)"

  - entity: ReviewAssignment
    initial_state: ACTIVE
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (cycle APPROVED or SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "ended_at = logical clock now; reviewer.active_assignment_count -= 1"

      - from: ACTIVE
        to: RELEASED
        trigger: "POST /plan-review/assignments/{id}/release OR system (cycle CANCELLED, or a replacement ReviewAssignment created on the same cycle)"
        actor: "ReviewCoordinator or system"
        preconditions:
          - "Assignment is ACTIVE (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "ended_at = logical clock now; reviewer.active_assignment_count -= 1"

  - entity: DeficiencyComment
    initial_state: OPEN
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: OPEN
        to: ADDRESSED
        trigger: "POST /plan-review/comments/{id}/responses"
        actor: Applicant
        preconditions:
          - "X-User-ID == engagement.applicant_contact_id (ERR_NOT_ENGAGEMENT_APPLICANT)"
          - "The engagement's current non-terminal cycle is COMMENTS_ISSUED (ERR_COMMENT_NOT_AWAITING_RESPONSE)"
        side_effects:
          - "CommentResponse row created; response_count += 1; engagement.unresolved_comment_count unchanged (ADDRESSED is still unresolved)"

      - from: REOPENED
        to: ADDRESSED
        trigger: "POST /plan-review/comments/{id}/responses"
        actor: Applicant
        preconditions:
          - "X-User-ID == engagement.applicant_contact_id (ERR_NOT_ENGAGEMENT_APPLICANT)"
          - "The engagement's current non-terminal cycle is COMMENTS_ISSUED (ERR_COMMENT_NOT_AWAITING_RESPONSE)"
        side_effects:
          - "CommentResponse row created; response_count += 1; engagement.unresolved_comment_count unchanged"

      - from: ADDRESSED
        to: VERIFIED
        trigger: "POST /plan-review/comments/{id}/verify"
        actor: Reviewer
        preconditions:
          - "The engagement's current non-terminal cycle is IN_REVIEW (ERR_NO_ACTIVE_REVIEW_CYCLE)"
          - "Actor (X-User-ID) is the reviewer on the current cycle's ACTIVE assignment (ERR_NOT_ASSIGNED_REVIEWER)"
        side_effects:
          - "engagement.unresolved_comment_count -= 1"

      - from: ADDRESSED
        to: REOPENED
        trigger: "POST /plan-review/comments/{id}/reopen"
        actor: Reviewer
        preconditions:
          - "The engagement's current non-terminal cycle is IN_REVIEW (ERR_NO_ACTIVE_REVIEW_CYCLE)"
          - "Actor (X-User-ID) is the reviewer on the current cycle's ACTIVE assignment (ERR_NOT_ASSIGNED_REVIEWER)"
          - "reopen_note present in payload (ERR_INVALID_REQUEST)"
        side_effects:
          - "engagement.unresolved_comment_count unchanged (REOPENED is still unresolved)"

      - from: OPEN
        to: WAIVED
        trigger: "POST /plan-review/comments/{id}/waive"
        actor: ChiefReviewer
        preconditions:
          - "severity != CRITICAL (ERR_CRITICAL_COMMENT_NOT_WAIVERABLE)"
          - "X-User-ID != engagement.reviewer_of_record_id — segregation of duties: the reviewer of record may not waive findings on their own engagement (ERR_WAIVER_SEGREGATION_VIOLATION)"
        side_effects:
          - "engagement.unresolved_comment_count -= 1"

      - from: ADDRESSED
        to: WAIVED
        trigger: "POST /plan-review/comments/{id}/waive"
        actor: ChiefReviewer
        preconditions:
          - "severity != CRITICAL (ERR_CRITICAL_COMMENT_NOT_WAIVERABLE)"
          - "X-User-ID != engagement.reviewer_of_record_id (ERR_WAIVER_SEGREGATION_VIOLATION)"
        side_effects:
          - "engagement.unresolved_comment_count -= 1"

      - from: REOPENED
        to: WAIVED
        trigger: "POST /plan-review/comments/{id}/waive"
        actor: ChiefReviewer
        preconditions:
          - "severity != CRITICAL (ERR_CRITICAL_COMMENT_NOT_WAIVERABLE)"
          - "X-User-ID != engagement.reviewer_of_record_id (ERR_WAIVER_SEGREGATION_VIOLATION)"
        side_effects:
          - "engagement.unresolved_comment_count -= 1"

  - entity: DeferredSubmittal
    initial_state: REGISTERED
    terminal_states: [APPROVED]
    transitions:
      - from: REGISTERED
        to: SUBMITTED
        trigger: "POST /plan-review/deferred-submittals/{id}/submit"
        actor: Applicant
        preconditions:
          - "X-User-ID == engagement.applicant_contact_id (ERR_NOT_ENGAGEMENT_APPLICANT)"
        side_effects:
          - "documents_ref stored; engagement.deferred_pending_count unchanged (SUBMITTED is still pending)"

      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /plan-review/deferred-submittals/{id}/submit"
        actor: Applicant
        preconditions:
          - "X-User-ID == engagement.applicant_contact_id (ERR_NOT_ENGAGEMENT_APPLICANT)"
        side_effects:
          - "documents_ref replaced; rejection_reason cleared to null; engagement.deferred_pending_count unchanged"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /plan-review/deferred-submittals/{id}/approve"
        actor: Reviewer
        preconditions:
          - "X-User-ID == engagement.reviewer_of_record_id (ERR_NOT_RESPONSIBLE_CHARGE)"
        side_effects:
          - "engagement.deferred_pending_count -= 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plan-review/deferred-submittals/{id}/reject"
        actor: Reviewer
        preconditions:
          - "X-User-ID == engagement.reviewer_of_record_id (ERR_NOT_RESPONSIBLE_CHARGE)"
          - "rejection_reason present in payload (ERR_INVALID_REQUEST)"
        side_effects:
          - "rejection_reason stored; engagement.deferred_pending_count unchanged (REJECTED is still pending)"

  - entity: ReviewRecord
    initial_state: DRAFT
    terminal_states: [TRANSMITTED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /plan-review/records/{id}/seal"
        actor: Reviewer
        preconditions:
          - "X-User-ID == engagement.reviewer_of_record_id — responsible charge (ERR_NOT_RESPONSIBLE_CHARGE)"
          - "engagement.status == APPROVED (ERR_ENGAGEMENT_NOT_APPROVED)"
          - "Sealer holds a license with state_code == engagement.pinned_state_code (ERR_LICENSE_STATE_MISMATCH)"
          - "That license's expires_on >= current logical date (ERR_LICENSE_WINDOW_INSUFFICIENT)"
          - "If engagement.pinned_requires_se_seal: that license's license_type == SE (ERR_SE_SEAL_REQUIRED)"
          - "engagement.deferred_pending_count == 0 (ERR_DEFERRED_SUBMITTALS_OUTSTANDING)"
        side_effects:
          - "sealed_by_reviewer_id = X-User-ID; sealed_at = logical clock now"
          - "engagement.final_fee_cents computed per final_fee calculation (actual cycle_count, approved deferred items, current valuation/area)"
          - "increments Engagement.version by 1"

      - from: SEALED
        to: TRANSMITTED
        trigger: "POST /plan-review/records/{id}/transmit"
        actor: ReviewCoordinator
        preconditions: []
        side_effects:
          - "transmitted_at = logical clock now"
          - "Engagement APPROVED → COMPLETED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-cycle
    parent_entity: ReviewCycle
    write_endpoint: "POST /plan-review/assignments"
    occ_field: expected_cycle_version
    description: |
      Creating a ReviewAssignment against a ReviewCycle whose version has
      advanced since the client last observed it is rejected. Creating an
      assignment legitimately supersedes any existing ACTIVE assignment on the
      cycle (reassignment), so a writer holding a stale cycle version would
      silently release an assignment it never observed. The OCC check runs at
      the state-precondition stage, before any business validation.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_fee
    trigger: "engagement creation (POST /plan-review/engagements)"
    algorithm: tiered_pricing
    formula: |
      if engagement.pinned_fee_method == VALUATION:
        v = declared_valuation_cents
        tier1 = min(v, VAL_T1_LIMIT) * VAL_T1_RATE
        tier2 = max(0, min(v, VAL_T2_LIMIT) - VAL_T1_LIMIT) * VAL_T2_RATE
        tier3 = max(0, v - VAL_T2_LIMIT) * VAL_T3_RATE
        base = tier1 + tier2 + tier3
      else:  # SQUARE_FOOTAGE
        base = floor_area_sqft * SQFT_RATE[building_type]
      base = max(base, MIN_BASE_FEE_CENTS)
      scoped_base = round_half_up(base * SCOPE_MULT[scope])          # rounding step 1
      expedite_component = round_half_up(scoped_base * EXPEDITE_SURCHARGE_RATE) if requested_expedite else 0   # rounding step 2, on the ROUNDED scoped_base
      estimated_fee_cents = scoped_base + expedite_component         # registration-time: zero cycles used, no deferred items
    input_set: "The engagement being created; fee parameters from its pinned jurisdiction snapshot"
    constants:
      VAL_T1_LIMIT: 10000000        # cents ($100,000)
      VAL_T1_RATE: 0.01
      VAL_T2_LIMIT: 50000000        # cents ($500,000 cumulative)
      VAL_T2_RATE: 0.0075
      VAL_T3_RATE: 0.005
      SQFT_RATE: { RESIDENTIAL: 40, COMMERCIAL: 55, INDUSTRIAL: 45, ESSENTIAL_FACILITY: 70 }   # cents per sqft
      MIN_BASE_FEE_CENTS: 50000
      SCOPE_MULT: { FULL_REVIEW: 1.0, LATERAL_ONLY: 0.6, PEER_REVIEW: 0.8 }
      EXPEDITE_SURCHARGE_RATE: 0.5
    precision: "integer cents; round_half_up applied at exactly the two pinned steps (scoped_base, then expedite_component); tier arithmetic is exact in cents"
    variants:
      - name: estimated
        when: "at registration"
        difference: "computed with cycle_count = 0 and zero approved deferred items (resubmittal and deferred components are always 0); never recomputed afterwards, even if valuation/area are later amended"

  - name: final_fee
    trigger: "record seal (POST /plan-review/records/{id}/seal)"
    algorithm: tiered_pricing
    formula: |
      base and scoped_base and expedite_component computed exactly as in estimated_fee,
      but using the engagement's CURRENT declared_valuation_cents / floor_area_sqft /
      requested_expedite (i.e. reflecting any amendments)
      resubmittal_component = RESUBMITTAL_FEE_CENTS * max(0, engagement.cycle_count - engagement.pinned_free_resubmittal_cycles)
      deferred_component = sum over DeferredSubmittals of this engagement with status APPROVED of round_half_up(scoped_base * DEFERRED_ITEM_FEE_RATE)   # per-item rounding, THEN sum
      final_fee_cents = scoped_base + expedite_component + resubmittal_component + deferred_component   # all integer cents; no further rounding
    input_set: "The engagement being sealed; its ReviewCycles (all statuses); its DeferredSubmittals with status APPROVED only"
    constants:
      RESUBMITTAL_FEE_CENTS: 75000
      DEFERRED_ITEM_FEE_RATE: 0.05
    precision: "integer cents; round_half_up; per-item deferred fee rounded BEFORE summing (per-item-then-sum order is pinned and observable)"
    variants:
      - name: final
        when: "at record seal"
        difference: "uses actual cycle_count (resubmittal fees), actual approved deferred items, and amended valuation/area — diverges from estimated whenever cycles exceed the free allowance or inputs were amended"

  - name: turnaround_sla
    trigger: "review cycle creation (POST /plan-review/cycles)"
    algorithm: threshold
    formula: |
      effective_days = ceil(pinned_turnaround_days / 2) if engagement.requested_expedite else pinned_turnaround_days
      # pinned order: halve the day count FIRST (ceil), THEN apply the day-counting mode
      if engagement.pinned_sla_mode == CALENDAR:
        due_at = received_at + effective_days * 24h
      else:  # BUSINESS
        d = date(received_at)
        repeat effective_days times:
          d = d + 1 day
          while d is Saturday or Sunday: d = d + 1 day
        due_at = datetime(d, 23:59:59.999Z)
      # the received day itself is never counted in BUSINESS mode
    input_set: "The cycle being created; pinned_turnaround_days / pinned_sla_mode / requested_expedite from its engagement"
    constants: {}
    precision: "millisecond precision on due_at; BUSINESS due_at is always end-of-day 23:59:59.999Z"
    variants:
      - name: business_days
        when: "pinned_sla_mode == BUSINESS"
        difference: "skips Saturdays/Sundays and lands at end-of-day — produces a strictly later due_at than CALENDAR for the same received_at and day count"
      - name: calendar_days
        when: "pinned_sla_mode == CALENDAR"
        difference: "plain received_at + N*24h, preserving time-of-day"

  - name: on_time_evaluation
    trigger: "cycle completion (transitions IN_REVIEW -> COMMENTS_ISSUED and IN_REVIEW -> APPROVED)"
    algorithm: threshold
    formula: |
      completed_at = logical clock now
      is_on_time = (completed_at <= due_at)   # equality counts as on time
    input_set: "The completing cycle"
    constants: {}
    precision: "millisecond comparison; completed_at == due_at exactly yields is_on_time = true"

  - name: reviewer_active_load
    trigger: "assignment create, assignment release, cycle APPROVED/SUPERSEDED/CANCELLED (system), engagement cancel cascade"
    algorithm: aggregation
    formula: |
      reviewer.active_assignment_count = count of ReviewAssignments where reviewer_id = reviewer.id and status == ACTIVE
      capacity gate on assignment creation: reject when reviewer.active_assignment_count >= reviewer.max_concurrent_assignments
      (at max_concurrent_assignments exactly the gate rejects; at max-1 it admits)
    input_set: "ReviewAssignments of the reviewer with status ACTIVE only (COMPLETED/RELEASED excluded)"
    constants: {}
    precision: "integer count; >= comparison is inclusive at the boundary"

  - name: unresolved_comment_count
    trigger: "comment creation, response, verify, reopen, waive; read at cycle approval"
    algorithm: aggregation
    formula: |
      engagement.unresolved_comment_count = count of DeficiencyComments where engagement_id = engagement.id
        and status IN {OPEN, ADDRESSED, REOPENED}
      # ADDRESSED counts as unresolved: a response is not verified until a reviewer verifies it in a later cycle
      cycle approval gate: reject when unresolved_comment_count > 0 (only exactly 0 admits approval)
    input_set: "DeficiencyComments of the engagement with status in {OPEN, ADDRESSED, REOPENED} (VERIFIED and WAIVED excluded)"
    constants: {}
    precision: "integer count; approval boundary is exactly 0"

  - name: deferred_pending_count
    trigger: "deferred submittal register, approve; read at record seal"
    algorithm: aggregation
    formula: |
      engagement.deferred_pending_count = count of DeferredSubmittals where engagement_id = engagement.id
        and status IN {REGISTERED, SUBMITTED, REJECTED}
      # REJECTED remains pending (awaiting resubmittal); only APPROVED leaves the pending set
      seal gate: reject when deferred_pending_count > 0
    input_set: "DeferredSubmittals of the engagement with status in {REGISTERED, SUBMITTED, REJECTED} (APPROVED excluded)"
    constants: {}
    precision: "integer count; seal boundary is exactly 0"

  - name: cycle_numbering
    trigger: "review cycle creation"
    algorithm: aggregation
    formula: |
      engagement.cycle_count += 1
      cycle.cycle_number = engagement.cycle_count   # 1-based, monotonic, never reused even after cancellation
    input_set: "The engagement receiving a new cycle"
    constants: {}
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's declared roles list"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Request body shape: required fields present, enum values valid, types correct"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: auth
    check: "Pagination params: 1 <= limit <= 100, offset >= 0"
    error_id: ERR_INVALID_PAGINATION_PARAMETERS
    http_status: 400
    applies_to: "all list GET endpoints"

  - priority: 5
    category: existence
    check: "Resource ids in path (validated left-to-right), then id fields in body (jurisdiction_id, reviewer_of_record_id, engagement_id, cycle_id, reviewer_id) must exist"
    error_id: "ERR_JURISDICTION_NOT_FOUND | ERR_REVIEWER_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_COMMENT_NOT_FOUND | ERR_DEFERRED_SUBMITTAL_NOT_FOUND | ERR_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids in path or body"

  - priority: 6
    category: state
    check: "Ownership/identity: Applicant actions require X-User-ID == engagement.applicant_contact_id; cycle review actions require X-User-ID == reviewer on the cycle's ACTIVE assignment; seal and deferred approve/reject require X-User-ID == engagement.reviewer_of_record_id"
    error_id: "ERR_NOT_ENGAGEMENT_APPLICANT | ERR_NOT_ASSIGNED_REVIEWER | ERR_NOT_RESPONSIBLE_CHARGE"
    http_status: 403
    applies_to: "applicant-scoped and reviewer-scoped action endpoints"

  - priority: 7
    category: state
    check: "Target entity state precondition for the requested transition (incl. OCC: expected_cycle_version must equal cycle.version on POST /plan-review/assignments)"
    error_id: "ERR_ENGAGEMENT_NOT_ACTIVE | ERR_ENGAGEMENT_NOT_AMENDABLE | ERR_CYCLE_STILL_ACTIVE | ERR_RECORD_ALREADY_SEALED | ERR_CYCLE_NOT_IN_REVIEW | ERR_NO_COMMENTS_TO_ISSUE | ERR_COMMENT_NOT_AWAITING_RESPONSE | ERR_COMMENT_NOT_ADDRESSED | ERR_NO_ACTIVE_REVIEW_CYCLE | ERR_INVALID_STATE_TRANSITION | ERR_ENGAGEMENT_NOT_APPROVED | ERR_RECORD_INVALID_STATE | ERR_STALE_CYCLE_VERSION"
    http_status: "409 (412 for ERR_STALE_CYCLE_VERSION)"
    applies_to: "state transition endpoints and POST /plan-review/assignments"

  - priority: 8
    category: business_safety
    check: "Regulatory/licensing: engagement creation requires reviewer_of_record to hold a license for the jurisdiction state; assignment requires a license covering the pinned state with expires_on >= cycle due date; seal requires a state license unexpired at seal date plus SE type when pinned_requires_se_seal; CRITICAL comments cannot be waived; waiver may not be performed by the reviewer of record"
    error_id: "ERR_LICENSE_STATE_MISMATCH | ERR_LICENSE_WINDOW_INSUFFICIENT | ERR_SE_SEAL_REQUIRED | ERR_CRITICAL_COMMENT_NOT_WAIVERABLE | ERR_WAIVER_SEGREGATION_VIOLATION"
    http_status: "422 (403 for ERR_WAIVER_SEGREGATION_VIOLATION)"
    applies_to: "POST /plan-review/engagements, POST /plan-review/assignments, POST /plan-review/records/{id}/seal, POST /plan-review/comments/{id}/waive"

  - priority: 9
    category: business_constraint
    check: "Constraint satisfaction: jurisdiction state_code unique; reviewer capacity (active_assignment_count >= max rejects); comment reference_edition == engagement.pinned_ibc_edition; cycle approval requires unresolved_comment_count == 0 and both verification booleans true; deferred registration requires pinned_allows_deferred_submittals"
    error_id: "ERR_DUPLICATE_JURISDICTION_STATE | ERR_REVIEWER_CAPACITY_EXCEEDED | ERR_CODE_EDITION_MISMATCH | ERR_UNRESOLVED_COMMENTS_REMAIN | ERR_VERIFICATION_INCOMPLETE | ERR_DEFERRED_NOT_PERMITTED"
    http_status: "409 (422 for ERR_CODE_EDITION_MISMATCH, ERR_VERIFICATION_INCOMPLETE, ERR_DEFERRED_NOT_PERMITTED)"
    applies_to: "creation and transition endpoints as listed"

  - priority: 10
    category: business_referential
    check: "Referential completeness across children: seal requires deferred_pending_count == 0 (all deferred submittals APPROVED)"
    error_id: ERR_DEFERRED_SUBMITTALS_OUTSTANDING
    http_status: 409
    applies_to: "POST /plan-review/records/{id}/seal"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Jurisdiction (configuration) ---
  - method: POST
    path: "/plan-review/jurisdictions"
    description: "Register a jurisdiction (state) with its adopted code editions, fee method, and turnaround policy"
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, ibc_edition, asce7_edition, fee_method, turnaround_days, sla_mode, "free_resubmittal_cycles?", "requires_se_seal?", "allows_deferred_submittals?"]
    output: Jurisdiction
    side_effects: ["state_code uniqueness enforced (ERR_DUPLICATE_JURISDICTION_STATE)"]

  - method: GET
    path: "/plan-review/jurisdictions/{id}"
    description: "Get a jurisdiction"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: PUT
    path: "/plan-review/jurisdictions/{id}"
    description: "Update jurisdiction rule parameters; existing engagements keep their pinned snapshots — changes apply only to engagements created afterwards"
    roles: [PlatformAdmin]
    code: 200
    input: ["ibc_edition?", "asce7_edition?", "fee_method?", "turnaround_days?", "sla_mode?", "free_resubmittal_cycles?", "requires_se_seal?", "allows_deferred_submittals?"]
    output: Jurisdiction
    side_effects: ["increments Jurisdiction.version by 1"]

  # --- Reviewer ---
  - method: POST
    path: "/plan-review/reviewers"
    description: "Register a reviewer with licenses and capacity limit"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, licenses, "max_concurrent_assignments?"]
    output: Reviewer
    side_effects: ["active_assignment_count initialized to 0"]

  - method: GET
    path: "/plan-review/reviewers/{id}"
    description: "Get a reviewer (incl. computed active_assignment_count)"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: []
    output: Reviewer
    side_effects: []

  # --- Engagement ---
  - method: POST
    path: "/plan-review/engagements"
    description: "Register a plan review engagement; pins the jurisdiction rule snapshot and computes estimated_fee_cents"
    roles: [ReviewCoordinator]
    code: 201
    input: [project_name, jurisdiction_id, applicant_contact_id, reviewer_of_record_id, building_type, risk_category, scope, declared_valuation_cents, floor_area_sqft, "requested_expedite?"]
    output: Engagement
    side_effects:
      - "pinned_* fields copied from the jurisdiction"
      - "estimated_fee_cents computed (estimated variant)"
      - "reviewer_of_record must hold a license for pinned_state_code (ERR_LICENSE_STATE_MISMATCH)"
      - "status = REGISTERED; cycle_count = 0; unresolved_comment_count = 0; deferred_pending_count = 0"

  - method: GET
    path: "/plan-review/engagements"
    description: "List engagements with optional filters"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: ["jurisdiction_id?", "reviewer_of_record_id?", "status?", "limit?", "offset?"]
    output: "Engagement[]"
    side_effects: []

  - method: GET
    path: "/plan-review/engagements/{id}"
    description: "Get an engagement (incl. fees, counts, pinned snapshot)"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: PUT
    path: "/plan-review/engagements/{id}"
    description: "Amend valuation/area/expedite while REGISTERED or IN_PROGRESS; affects only the final fee — estimated_fee_cents is never recomputed"
    roles: [ReviewCoordinator]
    code: 200
    input: ["declared_valuation_cents?", "floor_area_sqft?", "requested_expedite?"]
    output: Engagement
    side_effects: ["rejected with ERR_ENGAGEMENT_NOT_AMENDABLE once APPROVED/COMPLETED/CANCELLED; increments Engagement.version by 1"]

  - method: POST
    path: "/plan-review/engagements/{id}/cancel"
    description: "Cancel an engagement (REGISTERED or IN_PROGRESS only)"
    roles: [ReviewCoordinator]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "status → CANCELLED (ERR_ENGAGEMENT_NOT_ACTIVE from APPROVED/COMPLETED/CANCELLED)"
      - "all non-terminal ReviewCycles → CANCELLED; their ACTIVE assignments → RELEASED"

  # --- ReviewCycle ---
  - method: POST
    path: "/plan-review/cycles"
    description: "Open a review cycle (initial submittal or resubmittal); supersedes a COMMENTS_ISSUED prior cycle"
    roles: [ReviewCoordinator, Applicant]
    code: 201
    input: [engagement_id, documents_ref]
    output: ReviewCycle
    side_effects:
      - "Applicant caller must match engagement.applicant_contact_id (ERR_NOT_ENGAGEMENT_APPLICANT)"
      - "engagement must be REGISTERED, IN_PROGRESS, or APPROVED (ERR_ENGAGEMENT_NOT_ACTIVE); APPROVED additionally requires its record still DRAFT (ERR_RECORD_ALREADY_SEALED)"
      - "an existing OPEN or IN_REVIEW cycle blocks creation (ERR_CYCLE_STILL_ACTIVE); an existing COMMENTS_ISSUED cycle → SUPERSEDED and its ACTIVE assignments → COMPLETED"
      - "cycle_count += 1; cycle_number assigned; received_at = logical clock now; due_at computed per turnaround_sla"
      - "engagement REGISTERED → IN_PROGRESS, or APPROVED → IN_PROGRESS (revision)"
      - "increments Engagement.version by 1"

  - method: GET
    path: "/plan-review/cycles"
    description: "List review cycles with optional filters"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: ["engagement_id?", "status?", "limit?", "offset?"]
    output: "ReviewCycle[]"
    side_effects: []

  - method: GET
    path: "/plan-review/cycles/{id}"
    description: "Get a review cycle (incl. due_at, is_on_time, version)"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: []
    output: ReviewCycle
    side_effects: []

  - method: POST
    path: "/plan-review/cycles/{id}/issue-comments"
    description: "Issue the deficiency comment letter to the applicant; completes the review pass"
    roles: [Reviewer]
    code: 200
    input: []
    output: ReviewCycle
    side_effects:
      - "IN_REVIEW → COMMENTS_ISSUED"
      - "completed_at set; is_on_time computed"

  - method: POST
    path: "/plan-review/cycles/{id}/approve"
    description: "Approve the cycle (clean approval or after all comments verified/waived); cascades to engagement approval and record creation"
    roles: [Reviewer]
    code: 200
    input: [load_path_confirmed, lateral_system_confirmed]
    output: ReviewCycle
    side_effects:
      - "IN_REVIEW → APPROVED; completed_at set; is_on_time computed"
      - "load_path_confirmed / lateral_system_confirmed stored"
      - "cycle's ACTIVE assignments → COMPLETED"
      - "engagement IN_PROGRESS → APPROVED; DRAFT ReviewRecord created or refreshed"

  # --- ReviewAssignment ---
  - method: POST
    path: "/plan-review/assignments"
    description: "Assign a reviewer to a cycle (OCC-guarded; supersedes any ACTIVE assignment on that cycle)"
    roles: [ReviewCoordinator]
    code: 201
    input: [cycle_id, reviewer_id, expected_cycle_version]
    output: ReviewAssignment
    side_effects:
      - "expected_cycle_version must equal cycle.version (ERR_STALE_CYCLE_VERSION, 412); success increments ReviewCycle.version by 1"
      - "cycle must be OPEN or IN_REVIEW (ERR_CYCLE_NOT_ASSIGNABLE)"
      - "reviewer license must cover pinned_state_code with expires_on >= date(cycle.due_at) (ERR_LICENSE_STATE_MISMATCH / ERR_LICENSE_WINDOW_INSUFFICIENT)"
      - "reviewer.active_assignment_count must be < max_concurrent_assignments (ERR_REVIEWER_CAPACITY_EXCEEDED)"
      - "any existing ACTIVE assignment on the cycle → RELEASED (its reviewer count decremented)"
      - "reviewer.active_assignment_count += 1; cycle OPEN → IN_REVIEW on first assignment"

  - method: GET
    path: "/plan-review/assignments"
    description: "List assignments with optional filters"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: ["cycle_id?", "reviewer_id?", "status?", "limit?", "offset?"]
    output: "ReviewAssignment[]"
    side_effects: []

  - method: GET
    path: "/plan-review/assignments/{id}"
    description: "Get an assignment"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: []

  - method: POST
    path: "/plan-review/assignments/{id}/release"
    description: "Release an ACTIVE assignment (compensating action for assignment creation)"
    roles: [ReviewCoordinator]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: ["ACTIVE → RELEASED; reviewer.active_assignment_count -= 1; ended_at set"]

  # --- DeficiencyComment / CommentResponse ---
  - method: POST
    path: "/plan-review/comments"
    description: "Raise a deficiency comment during an in-review cycle"
    roles: [Reviewer]
    code: 201
    input: [raised_in_cycle_id, code_section_ref, reference_edition, severity, category, comment_text]
    output: DeficiencyComment
    side_effects:
      - "cycle must be IN_REVIEW (ERR_CYCLE_NOT_IN_REVIEW); actor must be the cycle's assigned reviewer (ERR_NOT_ASSIGNED_REVIEWER)"
      - "reference_edition must equal engagement.pinned_ibc_edition (ERR_CODE_EDITION_MISMATCH)"
      - "engagement_id copied from cycle; raised_by_reviewer_id = X-User-ID"
      - "status = OPEN; engagement.unresolved_comment_count += 1"

  - method: GET
    path: "/plan-review/comments"
    description: "List deficiency comments with optional filters"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: ["engagement_id?", "raised_in_cycle_id?", "raised_by_reviewer_id?", "status?", "limit?", "offset?"]
    output: "DeficiencyComment[]"
    side_effects: []

  - method: GET
    path: "/plan-review/comments/{id}"
    description: "Get a deficiency comment"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: []
    output: DeficiencyComment
    side_effects: []

  - method: POST
    path: "/plan-review/comments/{id}/responses"
    description: "Applicant responds to a deficiency comment (flips OPEN/REOPENED → ADDRESSED)"
    roles: [Applicant]
    code: 201
    input: [response_text]
    output: CommentResponse
    side_effects:
      - "comment → ADDRESSED; response_count += 1; unresolved_comment_count unchanged"
      - "requires comment status OPEN or REOPENED and the engagement's current non-terminal cycle COMMENTS_ISSUED (ERR_COMMENT_NOT_AWAITING_RESPONSE)"

  - method: GET
    path: "/plan-review/comments/{id}/responses"
    description: "List responses for a comment (chronological)"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: "CommentResponse[]"
    side_effects: []

  - method: POST
    path: "/plan-review/comments/{id}/verify"
    description: "Assigned reviewer of the current in-review cycle accepts the response (ADDRESSED → VERIFIED)"
    roles: [Reviewer]
    code: 200
    input: []
    output: DeficiencyComment
    side_effects: ["comment → VERIFIED; engagement.unresolved_comment_count -= 1"]

  - method: POST
    path: "/plan-review/comments/{id}/reopen"
    description: "Assigned reviewer rejects the response (ADDRESSED → REOPENED)"
    roles: [Reviewer]
    code: 200
    input: [reopen_note]
    output: DeficiencyComment
    side_effects: ["comment → REOPENED; unresolved_comment_count unchanged"]

  - method: POST
    path: "/plan-review/comments/{id}/waive"
    description: "Chief reviewer waives a non-CRITICAL comment (segregation of duties: never the reviewer of record)"
    roles: [ChiefReviewer]
    code: 200
    input: [justification]
    output: DeficiencyComment
    side_effects: ["comment OPEN/ADDRESSED/REOPENED → WAIVED; engagement.unresolved_comment_count -= 1"]

  # --- DeferredSubmittal ---
  - method: POST
    path: "/plan-review/deferred-submittals"
    description: "Register a deferred submittal item (trusses/anchors/delegated design) on an engagement"
    roles: [Applicant]
    code: 201
    input: [engagement_id, item_type, description]
    output: DeferredSubmittal
    side_effects:
      - "caller must own the engagement (ERR_NOT_ENGAGEMENT_APPLICANT)"
      - "engagement must be IN_PROGRESS or APPROVED (ERR_ENGAGEMENT_NOT_ACTIVE)"
      - "engagement.pinned_allows_deferred_submittals must be true (ERR_DEFERRED_NOT_PERMITTED)"
      - "status = REGISTERED; engagement.deferred_pending_count += 1"

  - method: GET
    path: "/plan-review/deferred-submittals"
    description: "List deferred submittals with optional filters"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: ["engagement_id?", "status?", "limit?", "offset?"]
    output: "DeferredSubmittal[]"
    side_effects: []

  - method: GET
    path: "/plan-review/deferred-submittals/{id}"
    description: "Get a deferred submittal"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: []
    output: DeferredSubmittal
    side_effects: []

  - method: POST
    path: "/plan-review/deferred-submittals/{id}/submit"
    description: "Applicant submits (or resubmits after rejection) deferred design documents"
    roles: [Applicant]
    code: 200
    input: [documents_ref]
    output: DeferredSubmittal
    side_effects: ["REGISTERED or REJECTED → SUBMITTED; documents_ref stored"]

  - method: POST
    path: "/plan-review/deferred-submittals/{id}/approve"
    description: "Reviewer of record approves a submitted deferred item"
    roles: [Reviewer]
    code: 200
    input: []
    output: DeferredSubmittal
    side_effects: ["SUBMITTED → APPROVED; engagement.deferred_pending_count -= 1"]

  - method: POST
    path: "/plan-review/deferred-submittals/{id}/reject"
    description: "Reviewer of record rejects a submitted deferred item"
    roles: [Reviewer]
    code: 200
    input: [rejection_reason]
    output: DeferredSubmittal
    side_effects: ["SUBMITTED → REJECTED; rejection_reason stored"]

  # --- ReviewRecord ---
  - method: GET
    path: "/plan-review/records"
    description: "List review records with optional filters (0 or 1 per engagement)"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: ["engagement_id?", "sealed_by_reviewer_id?", "status?", "limit?", "offset?"]
    output: "ReviewRecord[]"
    side_effects: []

  - method: GET
    path: "/plan-review/records/{id}"
    description: "Get a review record"
    roles: [PlatformAdmin, ReviewCoordinator, Reviewer, ChiefReviewer, Applicant]
    code: 200
    input: []
    output: ReviewRecord
    side_effects: []

  - method: POST
    path: "/plan-review/records/{id}/seal"
    description: "Reviewer of record seals the record (license + SE + deferred-completeness gates); computes the engagement's final fee"
    roles: [Reviewer]
    code: 200
    input: []
    output: ReviewRecord
    side_effects:
      - "DRAFT → SEALED; sealed_by_reviewer_id and sealed_at set"
      - "engagement.final_fee_cents computed (final variant); increments Engagement.version by 1"

  - method: POST
    path: "/plan-review/records/{id}/transmit"
    description: "Transmit the sealed record to the building department; completes the engagement"
    roles: [ReviewCoordinator]
    code: 200
    input: []
    output: ReviewRecord
    side_effects: ["SEALED → TRANSMITTED (ERR_RECORD_INVALID_STATE otherwise); engagement APPROVED → COMPLETED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: "datetime" }
    side_effects: ["all subsequent system timestamps (received_at, due_at, completed_at, sealed_at, ...) use this clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Caller role not in the endpoint's roles list"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, invalid enum value, or wrong type"
  - id: ERR_INVALID_PAGINATION_PARAMETERS
    http: 400
    condition: "limit < 1 or > 100, or offset < 0"
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "No jurisdiction with the given id"
  - id: ERR_REVIEWER_NOT_FOUND
    http: 404
    condition: "No reviewer with the given id"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "No engagement with the given id"
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "No review cycle with the given id"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No review assignment with the given id"
  - id: ERR_COMMENT_NOT_FOUND
    http: 404
    condition: "No deficiency comment with the given id"
  - id: ERR_DEFERRED_SUBMITTAL_NOT_FOUND
    http: 404
    condition: "No deferred submittal with the given id"
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "No review record with the given id"
  - id: ERR_DUPLICATE_JURISDICTION_STATE
    http: 409
    condition: "A jurisdiction with the same state_code already exists"
  - id: ERR_LICENSE_STATE_MISMATCH
    http: 422
    condition: "Reviewer holds no license whose state_code equals the engagement's pinned_state_code (at engagement creation, assignment, or seal)"
  - id: ERR_LICENSE_WINDOW_INSUFFICIENT
    http: 422
    condition: "Reviewer's state license expires before the cycle due date (assignment) or before the seal date (record seal)"
  - id: ERR_SE_SEAL_REQUIRED
    http: 422
    condition: "Engagement's pinned_requires_se_seal is true but the sealer's state license is PE, not SE"
  - id: ERR_ENGAGEMENT_NOT_ACTIVE
    http: 409
    condition: "Operation requires engagement in REGISTERED/IN_PROGRESS (cancel), IN_PROGRESS/APPROVED (deferred register), or non-terminal (cycle creation); engagement is APPROVED/COMPLETED/CANCELLED as applicable"
  - id: ERR_ENGAGEMENT_NOT_AMENDABLE
    http: 409
    condition: "PUT engagement attempted when status is APPROVED, COMPLETED, or CANCELLED"
  - id: ERR_CYCLE_STILL_ACTIVE
    http: 409
    condition: "New cycle creation while an OPEN or IN_REVIEW cycle exists on the engagement (strict single-cycle-slot exclusion)"
  - id: ERR_RECORD_ALREADY_SEALED
    http: 409
    condition: "Revision cycle creation on an APPROVED engagement whose record is SEALED or TRANSMITTED"
  - id: ERR_CYCLE_NOT_IN_REVIEW
    http: 409
    condition: "Comment raise, issue-comments, or approve attempted on a cycle not in IN_REVIEW"
  - id: ERR_CYCLE_NOT_ASSIGNABLE
    http: 409
    condition: "Assignment attempted on a cycle not in OPEN or IN_REVIEW"
  - id: ERR_NO_COMMENTS_TO_ISSUE
    http: 409
    condition: "issue-comments with zero comments raised in the cycle and no REOPENED comments awaiting a response round"
  - id: ERR_UNRESOLVED_COMMENTS_REMAIN
    http: 409
    condition: "Cycle approval with unresolved_comment_count > 0"
  - id: ERR_VERIFICATION_INCOMPLETE
    http: 422
    condition: "Cycle approval without load_path_confirmed and lateral_system_confirmed both true"
  - id: ERR_CODE_EDITION_MISMATCH
    http: 422
    condition: "Comment reference_edition differs from engagement.pinned_ibc_edition"
  - id: ERR_COMMENT_NOT_AWAITING_RESPONSE
    http: 409
    condition: "Response attempted on a comment not in OPEN/REOPENED, or while the engagement's current non-terminal cycle is not COMMENTS_ISSUED"
  - id: ERR_COMMENT_NOT_ADDRESSED
    http: 409
    condition: "Verify or reopen attempted on a comment not in ADDRESSED"
  - id: ERR_NO_ACTIVE_REVIEW_CYCLE
    http: 409
    condition: "Verify/reopen attempted while the engagement's current non-terminal cycle is not IN_REVIEW"
  - id: ERR_NOT_ENGAGEMENT_APPLICANT
    http: 403
    condition: "X-User-ID does not equal engagement.applicant_contact_id for an applicant-scoped action"
  - id: ERR_NOT_ASSIGNED_REVIEWER
    http: 403
    condition: "X-User-ID is not the reviewer on the relevant cycle's ACTIVE assignment"
  - id: ERR_NOT_RESPONSIBLE_CHARGE
    http: 403
    condition: "X-User-ID does not equal engagement.reviewer_of_record_id for seal or deferred approve/reject"
  - id: ERR_WAIVER_SEGREGATION_VIOLATION
    http: 403
    condition: "Chief reviewer attempting to waive a comment IS the engagement's reviewer of record"
  - id: ERR_CRITICAL_COMMENT_NOT_WAIVERABLE
    http: 422
    condition: "Waive attempted on a CRITICAL severity comment"
  - id: ERR_DEFERRED_NOT_PERMITTED
    http: 422
    condition: "Deferred submittal registration while engagement.pinned_allows_deferred_submittals is false"
  - id: ERR_DEFERRED_SUBMITTALS_OUTSTANDING
    http: 409
    condition: "Record seal while deferred_pending_count > 0"
  - id: ERR_ENGAGEMENT_NOT_APPROVED
    http: 409
    condition: "Record seal while the engagement is not APPROVED (e.g. reopened to IN_PROGRESS by a revision cycle)"
  - id: ERR_RECORD_INVALID_STATE
    http: 409
    condition: "Seal attempted on a non-DRAFT record, or transmit attempted on a non-SEALED record"
  - id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http: 409
    condition: "Assignment would raise reviewer.active_assignment_count above max_concurrent_assignments (rejects at count == max)"
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version does not equal the cycle's current version (OCC)"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "Any other transition not permitted from the entity's current state (e.g. releasing a non-ACTIVE assignment)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Firm platform operator; manages jurisdictions, reviewer registry, and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /plan-review/jurisdictions"
      - "PUT /plan-review/jurisdictions/{id}"
      - "POST /plan-review/reviewers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: ReviewCoordinator
    description: "Intake/scheduling coordinator; registers engagements, opens cycles, manages assignments, transmits records"
    identity: opaque
    exclusive_operations:
      - "POST /plan-review/engagements"
      - "PUT /plan-review/engagements/{id}"
      - "POST /plan-review/engagements/{id}/cancel"
      - "POST /plan-review/assignments"
      - "POST /plan-review/assignments/{id}/release"
      - "POST /plan-review/records/{id}/transmit"
    shared_operations:
      - "POST /plan-review/cycles (shared with Applicant)"
      - "All GET endpoints"

  - name: Reviewer
    description: "Licensed plan review engineer; raises and resolves comments, reviews deferred submittals, seals records"
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /plan-review/cycles/{id}/issue-comments"
      - "POST /plan-review/cycles/{id}/approve"
      - "POST /plan-review/comments"
      - "POST /plan-review/comments/{id}/verify"
      - "POST /plan-review/comments/{id}/reopen"
      - "POST /plan-review/deferred-submittals/{id}/approve"
      - "POST /plan-review/deferred-submittals/{id}/reject"
      - "POST /plan-review/records/{id}/seal"
    shared_operations:
      - "All GET endpoints"

  - name: ChiefReviewer
    description: "Senior engineer with waiver authority; segregation of duties forbids waiving on engagements where they are reviewer of record"
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /plan-review/comments/{id}/waive"
    shared_operations:
      - "All GET endpoints"

  - name: Applicant
    description: "Design-firm contact who owns the engagement; responds to comments, registers and submits deferred items, may resubmit plan sets"
    identity: "opaque (X-User-ID must equal engagement.applicant_contact_id for applicant-scoped actions)"
    exclusive_operations:
      - "POST /plan-review/comments/{id}/responses"
      - "POST /plan-review/deferred-submittals"
      - "POST /plan-review/deferred-submittals/{id}/submit"
    shared_operations:
      - "POST /plan-review/cycles (shared with ReviewCoordinator)"
      - "All GET endpoints"
