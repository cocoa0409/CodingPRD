      - name: precision_rounds_each_agreement_contribution_before_the_diversified_sum
        claim_type: Precision
        excluded_because:
          difficulty_instance: per_agreement_contribution_rounded_before_summation_in_forecast
          rationale: "Rule 2 instance 2 already pins the rounding order and mode: three RESIDENTIAL_MULTIFAMILY agreements at 1010/2035/3060 kW under WEEKEND_REDUCED give per-agreement contributions 450.86, 908.42 and 1365.98 that sum to 2725.26 and a coincident demand of 2943.28, where rounding after summation would yield 2943.29."

      - name: waterfall_allocation_fills_the_cheapest_asset_before_the_next
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: merit_order_nested_min_max_with_storage_nameplate_sizing
          rationale: "Rule 2 instance 1 already exercises the full waterfall: cheapest-first filling, the nested min/max effective-capacity sizing that caps thermal storage at storage_capacity_kwh / 4, the min_stable_output skip that does not consume a merit rank, and the remainder left as unserved demand."

      - name: dual_variant_forecast_produces_two_different_coincident_demands
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: forecast_weather_normal_vs_actual_weighted_variant_divergence
          rationale: "Rule 1 instance 1 already publishes the same forecast under both variants and pins the divergence (coincident demand 7475.76 provisional versus 7470.47 final) together with the blended degree-hour inputs."

      - name: variant_switch_reconciles_the_billing_ledger_delta
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: invoice_estimated_vs_actual_true_up_variant_reconciliation
          rationale: "Rule 1 instance 2 already covers the variant switch end to end: the ESTIMATED invoice at 116819.63, the ACTUAL_TRUE_UP at 84836.00, the ratchet that only the true-up writes, and the resulting agreement balance delta."

      - name: reservation_intervals_are_merged_over_a_half_open_window
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: loop_capacity_ceiling_sweep_over_half_open_reservation_windows
          rationale: "Rule 8 instance 1 already tests the half-open [start, end) semantics of the reservation sweep, including the peer whose window ends exactly on the candidate's start date and is therefore excluded from the overlap total."

  - section: Validations
    instances:
      - name: role_check_and_foreign_key_check_win_over_lower_priority_rules
        claim_type: Priority Ordering
        grounds:
          - validations[priority 2 ERR_UNAUTHORIZED]
          - validations[priority 4 ERR_PLAN_NOT_FOUND]
          - validations[priority 5 ERR_FK_NOT_FOUND]
          - validations[priority 8 ERR_DUPLICATE_CODE]
          - validations[priority 9 ERR_CUSTOMER_CLASS_MISMATCH]
          - validations[priority 9 ERR_SEGMENT_CYCLE]
        distinguishing_aspect: "Three different priority pairs are exercised in one fixture and none of them is the pair used in §1.8: role check (2) beats plain existence (4) so an unknown plan id under the wrong role returns 403 not 404; foreign-key resolution (5) beats the class-compatibility check (9); and code uniqueness (8) beats the upstream-graph check (9)."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-Y1 (HEATING) with PipeSegment SEG-Y1, and a second NetworkLoop LOOP-Y2 (HEATING) with PipeSegment SEG-Y2."
            - "RateSchedule RS-U (UNIVERSITY). No DispatchPlan is created at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Y1", name: "Yard Loop One", service_mode: "HEATING", design_supply_temp_c: 90.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 5000.0 }
              as: SystemController
              captures: { loop_y1_id: $.data.id }
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Y2", name: "Yard Loop Two", service_mode: "HEATING", design_supply_temp_c: 90.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 5000.0 }
              as: SystemController
              captures: { loop_y2_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_y1_id}", code: "SEG-Y1", length_m: 500.0, diameter_mm: 200, install_year: 2015, insulation_class: "A", buried_depth_m: 1.3 }
              as: NetworkEngineer
              captures: { seg_y1_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_y2_id}", code: "SEG-Y2", length_m: 500.0, diameter_mm: 200, install_year: 2015, insulation_class: "A", buried_depth_m: 1.3 }
              as: NetworkEngineer
              captures: { seg_y2_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-U", customer_class: "UNIVERSITY", fixed_service_charge: 1500.00, demand_charge_per_kw: 11.00, minimum_bill_amount: 4500.00, tiers: [{ load_factor_max: 35.0, energy_rate_per_mwh: 85.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 66.00 }] }
              as: BillingAnalyst
              captures: { rs_u_id: $.data.id }
          trigger:
            - call: "POST /district-energy/dispatch-plans/00000000-0000-0000-0000-0000000000ff/review"
              payload: { decision: "APPROVE" }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { review_error_id: $.data.error_id }
            - call: "POST /district-energy/connection-agreements"
              payload: { loop_id: "${loop_y1_id}", rate_schedule_id: "00000000-0000-0000-0000-0000000000fe", customer_name: "Ghost Tariff Customer", customer_class: "HOSPITAL", reserved_capacity_kw: 500.0, service_mode: "HEATING", service_start_date: "2026-09-01T00:00:00Z", service_end_date: "2027-09-01T00:00:00Z" }
              as: BillingAnalyst
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_y1_id}", code: "SEG-Y1", length_m: 300.0, diameter_mm: 150, install_year: 2016, insulation_class: "A", buried_depth_m: 1.2, upstream_segment_id: "${seg_y2_id}" }
              as: NetworkEngineer
          assert:
            - "the review response status is 403 and ${review_error_id} == ERR_UNAUTHORIZED, not 404 ERR_PLAN_NOT_FOUND"
            - "the connection-agreement response status is 404 with data.error_id == ERR_FK_NOT_FOUND, not 409 ERR_CUSTOMER_CLASS_MISMATCH"
            - "the second pipe-segment response status is 409 with data.error_id == ERR_DUPLICATE_CODE, not 409 ERR_SEGMENT_CYCLE"
            - "GET /district-energy/pipe-segments?loop_id=${loop_y1_id} has total_count == 1"
            - "GET /district-energy/connection-agreements?loop_id=${loop_y1_id} has total_count == 0"

      - name: order_count_check_runs_before_the_unserved_demand_check_on_submit
        claim_type: Cascading validation
        grounds:
          - validations[priority 15 ERR_PLAN_HAS_NO_ORDERS]
          - validations[priority 16 ERR_INSUFFICIENT_GENERATION]
          - calculations.merit_order_dispatch
        distinguishing_aspect: "A plan whose only asset has min_stable_output_kw 4000.0 against a 756.00 kW block produces zero DispatchOrder rows and 756.00 kW of unserved demand, so both submit-time checks are violated at once; the priority-15 order-count check must answer first because the priority-16 check would otherwise report an unserved-demand failure that is really an empty-plan failure."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-V (HEATING) with one ProductionAsset V_H (rated 5000.0, min_stable_output_kw 4000.0) — eligible, so optimize itself succeeds."
            - "ACTIVE agreement CV1 (UNIVERSITY, reserved 1000.0) and PUBLISHED forecast F4 with coincident_demand_kw 756.00."
