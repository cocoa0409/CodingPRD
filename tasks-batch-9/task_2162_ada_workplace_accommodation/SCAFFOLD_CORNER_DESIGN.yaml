        distinguishing_aspect: "X-User-Role Employee with an X-User-ID that resolves to no Employee row is rejected 401 ERR_UNKNOWN_ACTOR, distinct from the 403 role and ownership failures."
        test_recipe:
          setup:
            - "A PUBLISHED profile and one real employee exist, but the acting id is a random UUID."
          setup_api_calls:
