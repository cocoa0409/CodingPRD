scenario: "433. Customs Brokerage & Import Compliance (CBP / ACE): entry filing (7501) & HTS classification, duty/tax/MPF/HMF calculation, valuation & country-of-origin, ISF (10+2) & manifest, FTA/preference (USMCA) claim, PGA (FDA/USDA) review, bond & periodic monthly statement, post-summary correction/protest"
domain_name: "customs-brokerage-import-compliance"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation        # provisional (filing) duty vs final (liquidated) duty
    - cascading_side_effects          # release/liquidation cascades across lines, bond, statement
    - derived_field_reconciliation    # entry.total_duties_owed, bond.outstanding_liability, statement.statement_total_cents
    - optimistic_concurrency          # CREATE-with-supersede on PSC/Protest against a LIQUIDATED entry

  entity_topology: flat
  # Peer entities linked by foreign keys; Importer/Entry/Bond/Statement reference
  # each other by id, no deep URL nesting. EntryLine is the one nested child.

  state_machine_shape: branching
  # Entry forks at CBP review into RELEASED vs HOLD_EXAM, and PGAReview forks into
  # MAY_PROCEED vs HOLD vs REFUSED with divergent side effects; ISF and Bond add
  # revert/cycle behavior. Not a straight linear pipeline.

  relationship_patterns:
    - one_to_many        # Entry has many EntryLine; Importer has many Entry; Statement has many Entry
    - flat               # CustomsEntry -> Importer, -> Bond, -> ISFFiling by FK
    - cross_aggregate    # PostSummaryCorrection references a LIQUIDATED CustomsEntry across aggregates

  role_model: segregation_of_duties
  # A LicensedBroker files and classifies; a separate CBPOfficer reviews/releases/
  # liquidates; the same broker user that filed an entry cannot also be the officer
  # that reviews it. ImporterUser owns its own importer record; AccountAdmin sets up
  # importers/bonds/system clock.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Importer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Importer of record legal name.
        constraints: non-empty
      - name: ior_number
        type: string
        source: input
        description: Importer of Record number (EIN/CBP-assigned). Unique across all Importers.
        constraints: unique, non-empty
      - name: owner_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the ImporterUser who owns this importer record.
      - name: continuous_bond_id
        type: string
        source: computed
        description: "FK -> Bond.id; the most recently activated CONTINUOUS bond for this importer, or null if none. Set by Bond activation side effect."
        default: null
      - name: status
        type: enum
        source: system
        description: Importer account status.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Bond
    parent: null
    common_fields: true
    fields:
      - name: importer_id
        type: string
        source: input
        description: "FK -> Importer.id; the importer this bond secures."
      - name: bond_type
        type: enum
        source: input
        description: Customs bond type.
        constraints: "one of {CONTINUOUS, SINGLE_ENTRY}"
      - name: limit_cents
        type: integer
        source: input
        description: Bond limit (liability ceiling) in integer cents.
        constraints: ">= 0"
      - name: outstanding_liability_cents
        type: integer
        source: computed
        description: Sum of total_duties_owed_cents over all non-terminal CustomsEntry rows secured by this bond. Reconciled on every entry filing, release, liquidation, and PSC.
        default: 0
      - name: status
        type: enum
        source: system
        description: Bond lifecycle status.
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, SATURATED, TERMINATED}"

  - name: ISFFiling
    parent: null
    common_fields: true
    fields:
      - name: importer_id
        type: string
        source: input
        description: "FK -> Importer.id; importer filing the ISF (10+2)."
      - name: bill_of_lading
        type: string
        source: input
        description: Ocean bill of lading number the ISF binds to. Unique across ISFFiling rows.
        constraints: unique, non-empty
      - name: vessel_eta
        type: datetime
        source: input
        description: Scheduled vessel arrival (ETA) at US port, ISO 8601 UTC.
      - name: data_element_count
        type: integer
        source: input
        description: Number of the 10 importer ISF data elements supplied (the "10" of 10+2).
        constraints: "0..10"
      - name: filed_at
        type: datetime
        source: system
        description: Server clock time the ISF transitioned DRAFT->FILED, ISO 8601 UTC, or null while DRAFT.
        default: null
      - name: late_filing
        type: boolean
        source: computed
        description: True when filed_at is strictly later than (vessel_eta minus ISF_CUTOFF_HOURS). Computed at FILED transition.
        default: false
      - name: status
        type: enum
        source: system
        description: ISF lifecycle status.
        default: DRAFT
        constraints: "one of {DRAFT, FILED, MATCHED, CANCELLED}"

  - name: CustomsEntry
    parent: null
    common_fields: true
    fields:
      - name: importer_id
        type: string
        source: input
        description: "FK -> Importer.id; importer of record for this entry."
      - name: bond_id
        type: string
        source: input
        description: "FK -> Bond.id; the bond securing this entry. Must be ACTIVE and belong to importer_id."
      - name: isf_filing_id
        type: string
        source: input
        description: "FK -> ISFFiling.id; the ISF that must be MATCHED before release. Nullable at DRAFT."
        default: null
      - name: statement_id
        type: string
        source: computed
        description: "FK -> MonthlyStatement.id; the periodic monthly statement this entry was scheduled onto at release, or null."
        default: null
      - name: entry_type
        type: enum
        source: input
        description: Entry type code.
        constraints: "one of {CONSUMPTION_01, WAREHOUSE_21, FTZ_06}"
      - name: country_of_origin
        type: string
        source: input
        description: ISO 3166 alpha-2 country of origin for the entry (e.g., CN, MX, CA, DE).
        constraints: 2-letter uppercase
      - name: entry_date
        type: datetime
        source: input
        description: Declared entry date, ISO 8601 UTC. Used to select the duty rate epoch.
      - name: provisional_total_cents
        type: integer
        source: computed
        description: Provisional grand total (duty + MPF + HMF + tax) computed at FILED using claimed preferences. See calc compute_entry_charges variant=provisional.
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: Final liquidated grand total computed at LIQUIDATED after PGA outcomes and verified preferences. Null until liquidation. See calc compute_entry_charges variant=final.
        default: null
      - name: total_duties_owed_cents
        type: integer
        source: computed
        description: The currently-owed grand total tracked on the bond and statement; equals provisional_total_cents while FILED/RELEASED, final_total_cents once LIQUIDATED.
        default: 0
      - name: filed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the LicensedBroker who filed the entry. Set at DRAFT->FILED. Used for segregation-of-duties at review.
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the CBPOfficer who reviewed the entry. Set at FILED->RELEASED or FILED->HOLD_EXAM.
        default: null
      - name: status
        type: enum
        source: system
        description: Entry lifecycle status.
        default: DRAFT
        constraints: "one of {DRAFT, FILED, HOLD_EXAM, RELEASED, LIQUIDATED, CANCELLED}"

  - name: EntryLine
    parent: CustomsEntry
    common_fields: true
    fields:
      - name: entry_id
        type: string
        source: input
        description: "FK -> CustomsEntry.id; the entry this line belongs to. Entry must be DRAFT to add lines."
      - name: hts_code
        type: string
        source: input
        description: 10-digit Harmonized Tariff Schedule code, classifies the merchandise.
        constraints: 10 digits
      - name: customs_value_cents
        type: integer
        source: input
        description: Declared transaction value of the merchandise on this line, in cents (before additions).
        constraints: "> 0"
      - name: assists_cents
        type: integer
        source: input
        description: Dutiable additions to value (assists, royalties, packing) added to customs value. See calc compute_line_dutiable_value.
        default: 0
        constraints: ">= 0"
      - name: quantity
        type: integer
        source: input
        description: Number of units on the line (for specific-rate and PGA threshold checks).
        constraints: "> 0"
      - name: preference_claim
        type: enum
        source: input
        description: FTA/preference program claimed for this line.
        default: NONE
        constraints: "one of {NONE, USMCA}"
      - name: pga_flag
        type: enum
        source: input
        description: Partner Government Agency jurisdiction the line is subject to.
        default: NONE
        constraints: "one of {NONE, FDA, USDA}"
      - name: dutiable_value_cents
        type: integer
        source: computed
        description: customs_value_cents + assists_cents. Recomputed when the line is created. See calc compute_line_dutiable_value.
        default: 0
      - name: line_duty_cents
        type: integer
        source: computed
        description: Computed duty for this line at the last charge computation; 0 when a verified USMCA preference applies. See calc compute_line_duty.
        default: 0
      - name: preference_verified
        type: boolean
        source: computed
        description: True once the entry liquidates with the USMCA claim accepted (origin == an FTA-eligible country). Null/false otherwise.
        default: false

  - name: PGAReview
    parent: null
    common_fields: true
    fields:
      - name: entry_id
        type: string
        source: input
        description: "FK -> CustomsEntry.id; the entry under PGA review."
      - name: agency
        type: enum
        source: input
        description: Reviewing partner government agency.
        constraints: "one of {FDA, USDA}"
      - name: decision
        type: enum
        source: system
        description: PGA disposition.
        default: PENDING
        constraints: "one of {PENDING, MAY_PROCEED, HOLD, REFUSED}"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the CBPOfficer who recorded the decision.
        default: null

  - name: ExamSlot
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: enum
        source: input
        description: Centralized Examination Station the slot is booked at (the physical resource whose calendar must not double-book).
        constraints: "one of {CES_LAX, CES_JFK}"
      - name: entry_id
        type: string
        source: input
        description: "FK -> CustomsEntry.id; the entry being physically examined in this slot. Entry must be HOLD_EXAM."
      - name: window_start
        type: datetime
        source: input
        description: Slot start instant, ISO 8601 UTC. Interval is treated as half-open [window_start, window_end).
      - name: window_end
        type: datetime
        source: input
        description: Slot end instant, ISO 8601 UTC. Must be strictly after window_start. Interval [window_start, window_end) is half-open so back-to-back slots (one's end == next's start) do NOT overlap.
      - name: status
        type: enum
        source: system
        description: Exam slot status.
        default: BOOKED
        constraints: "one of {BOOKED, RELEASED_SLOT, CANCELLED_SLOT}"

  - name: MonthlyStatement
    parent: null
    common_fields: true
    fields:
      - name: importer_id
        type: string
        source: input
        description: "FK -> Importer.id; importer whose entries roll up onto this statement."
      - name: period_month
        type: string
        source: input
        description: Statement period in YYYY-MM. Unique per (importer_id, period_month).
        constraints: "YYYY-MM"
      - name: statement_total_cents
        type: integer
        source: computed
        description: Sum of total_duties_owed_cents over all CustomsEntry rows whose statement_id equals this statement and status in {RELEASED, LIQUIDATED}. Reconciled on scheduling and liquidation.
        default: 0
      - name: entry_count
        type: integer
        source: computed
        description: Number of CustomsEntry rows scheduled onto this statement.
        default: 0
      - name: status
        type: enum
        source: system
        description: Statement lifecycle status.
        default: OPEN
        constraints: "one of {OPEN, SETTLED}"

  - name: PostSummaryCorrection
    parent: null
    common_fields: true
    fields:
      - name: entry_id
        type: string
        source: input
        description: "FK -> CustomsEntry.id; the LIQUIDATED entry being corrected/protested."
      - name: filing_kind
        type: enum
        source: input
        description: Whether this is a post-summary correction or a formal protest.
        constraints: "one of {PSC, PROTEST}"
      - name: corrected_value_delta_cents
        type: integer
        source: input
        description: Signed change to total dutiable value claimed by the filer, in cents (may be negative for a refund claim).
      - name: adjustment_cents
        type: integer
        source: computed
        description: Signed duty adjustment computed from corrected_value_delta_cents at GRANT. See calc compute_psc_adjustment.
        default: 0
      - name: status
        type: enum
        source: system
        description: Correction/protest lifecycle status.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, GRANTED, DENIED}"

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: Bond
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /bonds/{id}/activate"
        actor: AccountAdmin
        preconditions:
          - "bond.status == PENDING"
          - "bond.limit_cents >= 0"
        side_effects:
          - "set bond.status = ACTIVE"
          - "if bond.bond_type == CONTINUOUS: set Importer(importer_id).continuous_bond_id = bond.id"
          - "increments Bond.version by 1"
        note: "A bond must be ACTIVE before it can secure any entry filing."
      - from: ACTIVE
        to: SATURATED
        trigger: "system: bond.outstanding_liability_cents reaches/exceeds bond.limit_cents after an entry-filing reconciliation"
        actor: system
        preconditions:
          - "bond.status == ACTIVE"
          - "bond.outstanding_liability_cents >= bond.limit_cents"
        side_effects:
          - "set bond.status = SATURATED"
        note: "Auto-transition; once SATURATED, further filings against this bond are rejected with ERR_BOND_SATURATED until liability drops below the limit again."
      - from: SATURATED
        to: ACTIVE
        trigger: "system: bond.outstanding_liability_cents drops strictly below bond.limit_cents after a liquidation or PSC reconciliation"
        actor: system
        preconditions:
          - "bond.status == SATURATED"
          - "bond.outstanding_liability_cents < bond.limit_cents"
        side_effects:
          - "set bond.status = ACTIVE"
        note: "Recovery edge: a liquidation that lowers an entry's owed total can free the bond."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /bonds/{id}/terminate"
        actor: AccountAdmin
        preconditions:
          - "bond.status == ACTIVE"
          - "bond.outstanding_liability_cents == 0"
        side_effects:
          - "set bond.status = TERMINATED"
          - "if Importer(importer_id).continuous_bond_id == bond.id: set Importer.continuous_bond_id = null"
          - "increments Bond.version by 1"

  - entity: ISFFiling
    initial_state: DRAFT
    terminal_states: [CANCELLED, MATCHED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /isf-filings/{id}/file"
        actor: LicensedBroker
        preconditions:
          - "isf.status == DRAFT"
          - "isf.data_element_count == 10"
        side_effects:
          - "set isf.filed_at = clock.now"
          - "set isf.late_filing = (clock.now > vessel_eta - ISF_CUTOFF_HOURS)"
          - "set isf.status = FILED"
          - "increments ISFFiling.version by 1"
        note: "All 10 importer data elements required before an ISF may be filed."
      - from: FILED
        to: MATCHED
        trigger: "system: a CustomsEntry referencing this isf_filing_id is RELEASED"
        actor: system
        preconditions:
          - "isf.status == FILED"
        side_effects:
          - "set isf.status = MATCHED"
        note: "Bubble-up: entry release matches the manifest to the ISF."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /isf-filings/{id}/cancel"
        actor: LicensedBroker
        preconditions:
          - "isf.status == DRAFT"
        side_effects:
          - "set isf.status = CANCELLED"
          - "increments ISFFiling.version by 1"

  - entity: CustomsEntry
    initial_state: DRAFT
    terminal_states: [LIQUIDATED, CANCELLED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /entries/{id}/file"
        actor: LicensedBroker
        preconditions:
          - "entry.status == DRAFT"
          - "entry has >= 1 EntryLine"
          - "Bond(entry.bond_id).status == ACTIVE"
          - "entry.isf_filing_id is set and ISFFiling(isf_filing_id).status == FILED"
          - "for every line with pga_flag != NONE, a PGAReview row exists for (entry, that agency)"
        side_effects:
          - "compute each EntryLine.dutiable_value_cents and line_duty_cents (provisional: USMCA claim trusted)"
          - "compute entry.provisional_total_cents via compute_entry_charges variant=provisional"
          - "set entry.total_duties_owed_cents = entry.provisional_total_cents"
          - "set entry.filed_by_user_id = X-User-ID"
          - "set entry.status = FILED"
          - "reconcile Bond(entry.bond_id).outstanding_liability_cents += entry.total_duties_owed_cents (cascade: may auto-transition bond ACTIVE->SATURATED)"
          - "increments CustomsEntry.version by 1"
        note: "Filing the 7501. Provisional charges trust the USMCA claim and treat all PGA-flagged lines as proceedable."
      - from: FILED
        to: RELEASED
        trigger: "POST /entries/{id}/review (action=RELEASE)"
        actor: CBPOfficer
        preconditions:
          - "entry.status == FILED"
          - "X-User-ID != entry.filed_by_user_id  (segregation of duties)"
          - "every PGAReview for this entry has decision == MAY_PROCEED"
          - "ISFFiling(entry.isf_filing_id).status == FILED"
        side_effects:
          - "set entry.reviewed_by_user_id = X-User-ID"
          - "set entry.status = RELEASED"
          - "transition ISFFiling(entry.isf_filing_id) FILED->MATCHED (cascade)"
          - "schedule entry onto the OPEN MonthlyStatement for (importer_id, period_month of clock.now), creating it if none exists; set entry.statement_id and recompute statement.statement_total_cents and statement.entry_count (cascade)"
          - "increments CustomsEntry.version by 1"
      - from: FILED
        to: HOLD_EXAM
        trigger: "POST /entries/{id}/review (action=HOLD)"
        actor: CBPOfficer
        preconditions:
          - "entry.status == FILED"
          - "X-User-ID != entry.filed_by_user_id  (segregation of duties)"
          - "at least one PGAReview for this entry has decision in {HOLD, REFUSED} OR action explicitly HOLD"
        side_effects:
          - "set entry.reviewed_by_user_id = X-User-ID"
          - "set entry.status = HOLD_EXAM"
          - "increments CustomsEntry.version by 1"
        note: "Branch divergent from RELEASE: no statement scheduling, no ISF match."
      - from: HOLD_EXAM
        to: RELEASED
        trigger: "POST /entries/{id}/review (action=RELEASE)"
        actor: CBPOfficer
        preconditions:
          - "entry.status == HOLD_EXAM"
          - "X-User-ID != entry.filed_by_user_id"
          - "every PGAReview for this entry has decision == MAY_PROCEED"
        side_effects:
          - "set entry.status = RELEASED"
          - "transition ISFFiling(entry.isf_filing_id) FILED->MATCHED (cascade)"
          - "transition every BOOKED ExamSlot with entry_id == entry.id to RELEASED_SLOT (cascade)"
          - "schedule entry onto the OPEN MonthlyStatement for (importer_id, period_month of clock.now); set entry.statement_id and recompute statement totals (cascade)"
          - "increments CustomsEntry.version by 1"
        note: "Revert/recovery edge after exam cleared."
      - from: RELEASED
        to: LIQUIDATED
        trigger: "POST /entries/{id}/liquidate"
        actor: CBPOfficer
        preconditions:
          - "entry.status == RELEASED"
          - "X-User-ID != entry.filed_by_user_id"
        side_effects:
          - "recompute each EntryLine.line_duty_cents (final: USMCA accepted only if country_of_origin in FTA_ELIGIBLE_ORIGINS; set EntryLine.preference_verified accordingly)"
          - "compute entry.final_total_cents via compute_entry_charges variant=final"
          - "set entry.total_duties_owed_cents = entry.final_total_cents (delta D = final - provisional)"
          - "set entry.status = LIQUIDATED"
          - "reconcile Bond(entry.bond_id).outstanding_liability_cents += D (cascade: may auto-transition bond SATURATED->ACTIVE if it drops below limit)"
          - "recompute MonthlyStatement(entry.statement_id).statement_total_cents (cascade from the bond/entry delta)"
          - "increments CustomsEntry.version by 1"
        note: "Final liquidation reconciles provisional vs final across line duty, bond, and statement."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /entries/{id}/cancel"
        actor: LicensedBroker
        preconditions:
          - "entry.status == DRAFT"
        side_effects:
          - "set entry.status = CANCELLED"
          - "increments CustomsEntry.version by 1"

  - entity: PGAReview
    initial_state: PENDING
    terminal_states: [MAY_PROCEED, REFUSED]
    transitions:
      - from: PENDING
        to: MAY_PROCEED
        trigger: "POST /pga-reviews/{id}/decide (decision=MAY_PROCEED)"
        actor: CBPOfficer
        preconditions:
          - "pga.decision == PENDING"
          - "CustomsEntry(pga.entry_id).status in {FILED, HOLD_EXAM}"
        side_effects:
          - "set pga.decision = MAY_PROCEED"
          - "set pga.reviewed_by_user_id = X-User-ID"
          - "increments PGAReview.version by 1"
      - from: PENDING
        to: HOLD
        trigger: "POST /pga-reviews/{id}/decide (decision=HOLD)"
        actor: CBPOfficer
        preconditions:
          - "pga.decision == PENDING"
          - "CustomsEntry(pga.entry_id).status in {FILED, HOLD_EXAM}"
        side_effects:
          - "set pga.decision = HOLD"
          - "set pga.reviewed_by_user_id = X-User-ID"
          - "increments PGAReview.version by 1"
        note: "HOLD blocks entry RELEASE until upgraded to MAY_PROCEED."
      - from: HOLD
        to: MAY_PROCEED
        trigger: "POST /pga-reviews/{id}/decide (decision=MAY_PROCEED)"
        actor: CBPOfficer
        preconditions:
          - "pga.decision == HOLD"
          - "CustomsEntry(pga.entry_id).status in {FILED, HOLD_EXAM}"
        side_effects:
          - "set pga.decision = MAY_PROCEED"
          - "increments PGAReview.version by 1"
        note: "Cyclic recovery: HOLD can be upgraded to MAY_PROCEED."
      - from: HOLD
        to: REFUSED
        trigger: "POST /pga-reviews/{id}/decide (decision=REFUSED)"
        actor: CBPOfficer
        preconditions:
          - "pga.decision == HOLD"
          - "CustomsEntry(pga.entry_id).status in {FILED, HOLD_EXAM}"
        side_effects:
          - "set pga.decision = REFUSED"
          - "increments PGAReview.version by 1"
        note: "Terminal refusal; the entry can never be RELEASED once any PGAReview is REFUSED."

  - entity: ExamSlot
    initial_state: BOOKED
    terminal_states: [RELEASED_SLOT, CANCELLED_SLOT]
    transitions:
      - from: BOOKED
        to: RELEASED_SLOT
        trigger: "system: the examined CustomsEntry transitions HOLD_EXAM->RELEASED"
        actor: system
        preconditions:
          - "slot.status == BOOKED"
        side_effects:
          - "set slot.status = RELEASED_SLOT"
        note: "Cross-entity bubble: clearing the exam frees the station slot."
      - from: BOOKED
        to: CANCELLED_SLOT
        trigger: "POST /exam-slots/{id}/cancel"
        actor: CBPOfficer
        preconditions:
          - "slot.status == BOOKED"
        side_effects:
          - "set slot.status = CANCELLED_SLOT"
          - "increments ExamSlot.version by 1"
        note: "Cancelling a BOOKED slot frees its interval so a later booking on the same station/window no longer overlaps."

  - entity: PostSummaryCorrection
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /post-summary-corrections/{id}/grant"
        actor: CBPOfficer
        preconditions:
          - "psc.status == SUBMITTED"
          - "CustomsEntry(psc.entry_id).status == LIQUIDATED"
        side_effects:
          - "compute psc.adjustment_cents via compute_psc_adjustment"
          - "set CustomsEntry(entry_id).final_total_cents += psc.adjustment_cents and total_duties_owed_cents = final_total_cents"
          - "reconcile Bond(entry.bond_id).outstanding_liability_cents += psc.adjustment_cents (cascade: may auto-transition bond between ACTIVE and SATURATED)"
          - "recompute MonthlyStatement(entry.statement_id).statement_total_cents (cascade)"
          - "set psc.status = GRANTED"
          - "increments PostSummaryCorrection.version by 1"
        note: "Compensating-style adjustment; the named conserved quantity bond.outstanding_liability_cents must equal sum of entry owed totals after the cascade."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /post-summary-corrections/{id}/deny"
        actor: CBPOfficer
        preconditions:
          - "psc.status == SUBMITTED"
          - "CustomsEntry(psc.entry_id).status == LIQUIDATED"
        side_effects:
          - "set psc.adjustment_cents = 0"
          - "set psc.status = DENIED"
          - "increments PostSummaryCorrection.version by 1"

  - entity: MonthlyStatement
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: SETTLED
        trigger: "POST /monthly-statements/{id}/settle"
        actor: AccountAdmin
        preconditions:
          - "statement.status == OPEN"
          - "every CustomsEntry with this statement_id has status == LIQUIDATED"
        side_effects:
          - "set statement.status = SETTLED"
          - "increments MonthlyStatement.version by 1"
        note: "A statement settles only once all its entries have liquidated."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: psc-create-stale-entry
    parent_entity: CustomsEntry
    write_endpoint: "POST /post-summary-corrections"
    occ_field: "expected_entry_version"
    description: |
      Submitting a PostSummaryCorrection against a CustomsEntry whose version has
      advanced since the client last observed it is rejected. A PSC legitimately
      supersedes the prior fiscal state of the entry, so two non-overlapping
      submissions against the same liquidated entry are both individually valid
      under the product spec; the entry's version is the serialization point. A
      submission carrying a stale expected_entry_version (an earlier liquidation
      or an earlier granted PSC has since bumped the entry's version) is rejected
      with a precondition-failed result.
    error_id: ERR_STALE_ENTRY_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: compute_line_dutiable_value
    trigger: "POST /entries/{id}/lines (line creation) and recomputed at entry FILED"
    algorithm: aggregation
    formula: |
      dutiable_value_cents = customs_value_cents + assists_cents
    input_set: "single EntryLine; assists_cents defaults to 0 when omitted"
    constants: {}
    precision: "integer cents, no rounding (inputs already cents)"

  - name: compute_line_duty
    trigger: "entry FILED (provisional) and entry LIQUIDATED (final)"
    algorithm: threshold
    formula: |
      base = round_half_up( dutiable_value_cents * DUTY_RATE_BPS / 10000 )
      # DUTY_RATE_BPS is selected by the first 2 digits (chapter) of hts_code:
      #   chapter "61" or "62" (apparel) -> 1650 bps
      #   chapter "84" or "85" (machinery/electronics) -> 250 bps
      #   any other chapter -> 500 bps (general)
      # Preference application:
      #   provisional variant: if preference_claim == USMCA -> line_duty_cents = 0
      #   final variant:       if preference_claim == USMCA AND
      #                           entry.country_of_origin in FTA_ELIGIBLE_ORIGINS
      #                           -> line_duty_cents = 0, preference_verified = true
      #                        else line_duty_cents = base, preference_verified = false
      #   no preference: line_duty_cents = base
    input_set: "a single EntryLine of an entry; chapter taken from hts_code[0:2]"
    constants:
      DUTY_RATE_BPS_APPAREL: 1650
      DUTY_RATE_BPS_MACHINERY: 250
      DUTY_RATE_BPS_GENERAL: 500
      FTA_ELIGIBLE_ORIGINS: ["MX", "CA"]
    precision: "2-step: per-line round_half_up to integer cents, THEN sum across lines (round-then-sum is pinned; see compute_entry_charges)"
    variants:
      - name: provisional
        when: "computed at entry FILED"
        difference: "USMCA claim is trusted unconditionally (line_duty_cents=0 for any USMCA line regardless of country_of_origin)."
      - name: final
        when: "computed at entry LIQUIDATED"
        difference: "USMCA zero-duty applies only if country_of_origin in FTA_ELIGIBLE_ORIGINS; otherwise the full base duty is restored and preference_verified=false."

  - name: compute_entry_charges
    trigger: "entry FILED (variant=provisional) and entry LIQUIDATED (variant=final)"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED (circular-looking dependency resolved):
      # 1) total_dutiable_value = sum over lines of dutiable_value_cents
      # 2) total_duty = sum over lines of line_duty_cents     (round-PER-LINE then sum)
      # 3) mpf_raw = round_half_up( total_dutiable_value * MPF_RATE_BPS / 10000 )
      #    mpf = min( MPF_MAX_CENTS, max( MPF_MIN_CENTS, mpf_raw ) )   # ad valorem with floor & ceiling
      #    MPF is waived entirely (mpf = 0) when EVERY line has a *verified* USMCA
      #    preference in the variant being computed (provisional: every line claims
      #    USMCA; final: every line preference_verified == true).
      # 4) hmf applies ONLY to ocean entries; here HMF applies to every entry whose
      #    entry_type != FTZ_06:
      #      hmf = round_half_up( total_dutiable_value * HMF_RATE_BPS / 10000 )   # no cap
      #      FTZ_06 entries: hmf = 0
      # 5) tax = round_half_up( total_dutiable_value * EXCISE_TAX_BPS / 10000 ) when
      #      ANY line has pga_flag == FDA (excise proxy), else 0
      # 6) grand_total = total_duty + mpf + hmf + tax
    input_set: "all EntryLine rows of the entry; line duties already computed per the active variant"
    constants:
      MPF_RATE_BPS: 35          # 0.3464% rounded to 0.35% for the benchmark
      MPF_MIN_CENTS: 3215       # statutory MPF floor
      MPF_MAX_CENTS: 62333      # statutory MPF ceiling
      HMF_RATE_BPS: 13          # 0.125% rounded to 0.13%
      EXCISE_TAX_BPS: 200       # 2.00% proxy excise/processing tax for FDA-regulated goods
      ISF_CUTOFF_HOURS: 24      # ISF must be on file >= 24h before vessel_eta; entry_date may not precede (vessel_eta - 24h)
    precision: "round_half_up to integer cents at each component; round-per-line-then-sum for duty (NOT sum-then-round)"
    variants:
      - name: provisional
        when: "entry FILED"
        difference: "uses provisional line duties; MPF waiver tested against claimed USMCA on every line."
      - name: final
        when: "entry LIQUIDATED"
        difference: "uses final line duties; MPF waiver tested against preference_verified on every line; tax uses final pga state."

  - name: compute_psc_adjustment
    trigger: "PostSummaryCorrection GRANTED"
    algorithm: threshold
    formula: |
      # Signed duty adjustment on a granted PSC/PROTEST.
      # effective_rate_bps is the entry-weighted blended duty rate at liquidation:
      #   effective_rate_bps = round_half_up( entry.final_total_cents_duty_component
      #                                       * 10000 / total_dutiable_value )
      # For the benchmark, use the GENERAL rate when the entry had no verified
      # preference, else the preference makes the delta duty-free:
      #   if every line preference_verified == true:
      #       adjustment_cents = 0   # value change is duty-free under USMCA
      #   else:
      #       adjustment_cents = round_half_up( corrected_value_delta_cents
      #                                         * DUTY_RATE_BPS_GENERAL / 10000 )
      # PROTEST adjustments and PSC adjustments use the same formula; only the
      # filing_kind label differs.
    input_set: "a single PostSummaryCorrection and its referenced LIQUIDATED entry"
    constants:
      DUTY_RATE_BPS_GENERAL: 500
    precision: "round_half_up to integer cents; sign preserved (negative delta -> refund)"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted to perform the requested operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource referenced in the path or body FK exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints taking a path id or FK"
  - priority: 4
    category: business_referential
    check: "an ImporterUser may only act on / file against an Importer it owns (Importer.owner_user_id == X-User-ID)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /entries, POST /isf-filings, POST /importers/{id} reads scoped to owner"
  - priority: 5
    category: state
    check: "target resource is in the correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: business_constraint
    check: "segregation of duties: the CBPOfficer reviewing/liquidating an entry must not be the user who filed it (X-User-ID != entry.filed_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /entries/{id}/review, POST /entries/{id}/liquidate"
  - priority: 7
    category: business_referential
    check: "the bond securing an entry must belong to the same importer as the entry (Bond.importer_id == entry.importer_id)"
    error_id: ERR_BOND_IMPORTER_MISMATCH
    http_status: 422
    applies_to: "POST /entries, POST /entries/{id}/file"
  - priority: 8
    category: business_safety
    check: "an entry may not be RELEASED while any PGAReview on it has decision in {PENDING, HOLD}, and never if any is REFUSED"
    error_id: ERR_PGA_NOT_CLEARED
    http_status: 409
    applies_to: "POST /entries/{id}/review (action=RELEASE)"
  - priority: 9
    category: business_safety
    check: "an entry may not be FILED unless its referenced ISFFiling is in status FILED"
    error_id: ERR_ISF_NOT_FILED
    http_status: 409
    applies_to: "POST /entries/{id}/file"
  - priority: 10
    category: business_constraint
    check: "an ISFFiling may not transition DRAFT->FILED unless data_element_count == 10"
    error_id: ERR_ISF_INCOMPLETE
    http_status: 422
    applies_to: "POST /isf-filings/{id}/file"
  - priority: 11
    category: business_temporal
    check: "an entry's entry_date must not be earlier than the referenced ISFFiling.vessel_eta minus ISF_CUTOFF_HOURS (manifest/entry ordering)"
    error_id: ERR_ENTRY_PRECEDES_MANIFEST
    http_status: 422
    applies_to: "POST /entries/{id}/file"
  - priority: 12
    category: business_constraint
    check: "hts_code must be exactly 10 digits; country_of_origin must be a 2-letter uppercase ISO code; period_month must match YYYY-MM"
    error_id: ERR_INVALID_FORMAT
    http_status: 422
    applies_to: "POST /entries/{id}/lines, POST /entries, POST /monthly-statements"
  - priority: 13
    category: business_constraint
    check: "ior_number unique across Importers; bill_of_lading unique across ISFFilings"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /importers, POST /isf-filings"
  - priority: 14
    category: business_fiscal
    check: "filing an entry must not drive the securing bond's outstanding_liability_cents strictly above bond.limit_cents (the filing itself is rejected, not merely saturating)"
    error_id: ERR_BOND_INSUFFICIENT
    http_status: 422
    applies_to: "POST /entries/{id}/file"
  - priority: 15
    category: business_fiscal
    check: "an entry may not be FILED against a bond already in status SATURATED"
    error_id: ERR_BOND_SATURATED
    http_status: 409
    applies_to: "POST /entries/{id}/file"
  - priority: 16
    category: business_constraint
    check: "OCC: expected_entry_version on PSC submission must equal the entry's current version"
    error_id: ERR_STALE_ENTRY_VERSION
    http_status: 412
    applies_to: "POST /post-summary-corrections"
  - priority: 17
    category: business_temporal
    check: "an ExamSlot may only be booked for an entry whose status == HOLD_EXAM; window_end must be strictly after window_start"
    error_id: ERR_INVALID_EXAM_WINDOW
    http_status: 422
    applies_to: "POST /exam-slots"
  - priority: 18
    category: business_temporal
    check: "a new ExamSlot must not overlap any BOOKED ExamSlot on the SAME station_code; intervals are half-open [start, end) so adjacency (a.end == b.start) does NOT collide; overlap = (a.window_start < b.window_end AND b.window_start < a.window_end)"
    error_id: ERR_EXAM_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /exam-slots"
  - priority: 19
    category: business_temporal
    check: "creating a MonthlyStatement whose period_month names a calendar month that overlaps any existing OPEN statement for the same importer is rejected; statement periods are whole calendar months treated as closed [month-first-day, month-last-day], so two statements for the same (importer, month) collide (same-month duplicate)"
    error_id: ERR_STATEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /monthly-statements"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Importer ----
  - method: POST
    path: "/importers"
    description: "Create an importer of record."
    roles: [AccountAdmin]
    code: 201
    input: [name, ior_number, owner_user_id]
    output: Importer
    side_effects: ["importer created with status=ACTIVE, continuous_bond_id=null"]
  - method: GET
    path: "/importers/{id}"
    description: "Fetch an importer."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: []
    output: Importer
    side_effects: []
  - method: GET
    path: "/importers"
    description: "List importers, optionally filtered by owner or active continuous bond."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: ["limit?", "offset?", "owner_user_id?", "continuous_bond_id?"]
    output: Importer[]
    side_effects: []

  # ---- Bond ----
  - method: POST
    path: "/bonds"
    description: "Create a bond securing an importer (status starts PENDING)."
    roles: [AccountAdmin]
    code: 201
    input: [importer_id, bond_type, limit_cents]
    output: Bond
    side_effects: ["bond created with status=PENDING, outstanding_liability_cents=0"]
  - method: GET
    path: "/bonds/{id}"
    description: "Fetch a bond."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: []
    output: Bond
    side_effects: []
  - method: GET
    path: "/bonds"
    description: "List bonds, optionally filtered by importer."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: ["limit?", "offset?", "importer_id?"]
    output: Bond[]
    side_effects: []
  - method: POST
    path: "/bonds/{id}/activate"
    description: "Activate a PENDING bond."
    roles: [AccountAdmin]
    code: 200
    input: []
    output: Bond
    side_effects: ["status PENDING->ACTIVE", "CONTINUOUS bond sets Importer.continuous_bond_id", "increments Bond.version by 1"]
  - method: POST
    path: "/bonds/{id}/terminate"
    description: "Terminate an ACTIVE bond with zero outstanding liability."
    roles: [AccountAdmin]
    code: 200
    input: []
    output: Bond
    side_effects: ["status ACTIVE->TERMINATED", "clears Importer.continuous_bond_id if it was this bond", "increments Bond.version by 1"]

  # ---- ISF ----
  - method: POST
    path: "/isf-filings"
    description: "Create an ISF (10+2) filing in DRAFT."
    roles: [LicensedBroker, ImporterUser]
    code: 201
    input: [importer_id, bill_of_lading, vessel_eta, data_element_count]
    output: ISFFiling
    side_effects: ["isf created status=DRAFT"]
  - method: GET
    path: "/isf-filings/{id}"
    description: "Fetch an ISF filing."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: []
    output: ISFFiling
    side_effects: []
  - method: GET
    path: "/isf-filings"
    description: "List ISF filings, optionally filtered by importer."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: ["limit?", "offset?", "importer_id?"]
    output: ISFFiling[]
    side_effects: []
  - method: POST
    path: "/isf-filings/{id}/file"
    description: "Transition an ISF DRAFT->FILED (requires all 10 data elements)."
    roles: [LicensedBroker]
    code: 200
    input: []
    output: ISFFiling
    side_effects: ["sets filed_at, late_filing", "status DRAFT->FILED", "increments ISFFiling.version by 1"]
  - method: POST
    path: "/isf-filings/{id}/cancel"
    description: "Cancel a DRAFT ISF."
    roles: [LicensedBroker]
    code: 200
    input: []
    output: ISFFiling
    side_effects: ["status DRAFT->CANCELLED", "increments ISFFiling.version by 1"]

  # ---- CustomsEntry ----
  - method: POST
    path: "/entries"
    description: "Create a customs entry (7501) in DRAFT."
    roles: [LicensedBroker, ImporterUser]
    code: 201
    input: ["importer_id", "bond_id", "isf_filing_id?", "entry_type", "country_of_origin", "entry_date"]
    output: CustomsEntry
    side_effects: ["entry created status=DRAFT, totals=0"]
  - method: GET
    path: "/entries/{id}"
    description: "Fetch an entry."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: []
    output: CustomsEntry
    side_effects: []
  - method: GET
    path: "/entries"
    description: "List entries, optionally filtered by importer, bond, isf, or statement."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: ["limit?", "offset?", "importer_id?", "bond_id?", "isf_filing_id?", "statement_id?"]
    output: CustomsEntry[]
    side_effects: []
  - method: POST
    path: "/entries/{id}/lines"
    description: "Add an HTS line to a DRAFT entry."
    roles: [LicensedBroker, ImporterUser]
    code: 201
    input: ["hts_code", "customs_value_cents", "assists_cents?", "quantity", "preference_claim?", "pga_flag?"]
    output: EntryLine
    side_effects: ["line created", "computes dutiable_value_cents"]
  - method: GET
    path: "/entries/{id}/lines"
    description: "List the HTS lines of an entry."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: EntryLine[]
    side_effects: []
  - method: POST
    path: "/entries/{id}/file"
    description: "File the entry (DRAFT->FILED); computes provisional charges and reconciles the bond."
    roles: [LicensedBroker]
    code: 200
    input: []
    output: CustomsEntry
    side_effects: ["computes provisional charges", "sets filed_by_user_id", "status DRAFT->FILED", "bond liability += provisional total (may saturate bond)", "increments CustomsEntry.version by 1"]
  - method: POST
    path: "/entries/{id}/review"
    description: "CBP review of a FILED/HOLD_EXAM entry; action RELEASE or HOLD."
    roles: [CBPOfficer]
    code: 200
    input: [action]
    output: CustomsEntry
    side_effects: ["sets reviewed_by_user_id", "RELEASE: status->RELEASED, ISF FILED->MATCHED, schedules onto monthly statement", "HOLD: status->HOLD_EXAM", "increments CustomsEntry.version by 1"]
  - method: POST
    path: "/entries/{id}/liquidate"
    description: "Liquidate a RELEASED entry; computes final charges and reconciles bond + statement."
    roles: [CBPOfficer]
    code: 200
    input: []
    output: CustomsEntry
    side_effects: ["computes final charges & preference_verified", "status RELEASED->LIQUIDATED", "bond liability += (final-provisional) delta (may de-saturate bond)", "recomputes statement total", "increments CustomsEntry.version by 1"]
  - method: POST
    path: "/entries/{id}/cancel"
    description: "Cancel a DRAFT entry."
    roles: [LicensedBroker]
    code: 200
    input: []
    output: CustomsEntry
    side_effects: ["status DRAFT->CANCELLED", "increments CustomsEntry.version by 1"]

  # ---- PGA Review ----
  - method: POST
    path: "/pga-reviews"
    description: "Open a PGA (FDA/USDA) review on an entry."
    roles: [LicensedBroker, CBPOfficer]
    code: 201
    input: [entry_id, agency]
    output: PGAReview
    side_effects: ["pga review created decision=PENDING"]
  - method: GET
    path: "/pga-reviews/{id}"
    description: "Fetch a PGA review."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: []
    output: PGAReview
    side_effects: []
  - method: GET
    path: "/pga-reviews"
    description: "List PGA reviews, optionally filtered by entry."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: ["limit?", "offset?", "entry_id?"]
    output: PGAReview[]
    side_effects: []
  - method: POST
    path: "/pga-reviews/{id}/decide"
    description: "Record a PGA disposition (MAY_PROCEED / HOLD / REFUSED)."
    roles: [CBPOfficer]
    code: 200
    input: [decision]
    output: PGAReview
    side_effects: ["sets decision and reviewed_by_user_id", "increments PGAReview.version by 1"]

  # ---- Exam Slot (Centralized Examination Station scheduling) ----
  - method: POST
    path: "/exam-slots"
    description: "Book a centralized examination station slot for a HOLD_EXAM entry; rejects overlapping windows on the same station."
    roles: [CBPOfficer]
    code: 201
    input: [station_code, entry_id, window_start, window_end]
    output: ExamSlot
    side_effects: ["exam slot created status=BOOKED"]
  - method: GET
    path: "/exam-slots/{id}"
    description: "Fetch an exam slot."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: []
    output: ExamSlot
    side_effects: []
  - method: GET
    path: "/exam-slots"
    description: "List exam slots, optionally filtered by entry or station."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: ["limit?", "offset?", "entry_id?", "station_code?"]
    output: ExamSlot[]
    side_effects: []
  - method: POST
    path: "/exam-slots/{id}/cancel"
    description: "Cancel a BOOKED exam slot, freeing its interval."
    roles: [CBPOfficer]
    code: 200
    input: []
    output: ExamSlot
    side_effects: ["status BOOKED->CANCELLED_SLOT", "increments ExamSlot.version by 1"]

  # ---- Monthly Statement ----
  - method: POST
    path: "/monthly-statements"
    description: "Create an OPEN monthly statement for an importer/period."
    roles: [AccountAdmin]
    code: 201
    input: [importer_id, period_month]
    output: MonthlyStatement
    side_effects: ["statement created status=OPEN, totals=0"]
  - method: GET
    path: "/monthly-statements/{id}"
    description: "Fetch a monthly statement."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: []
    output: MonthlyStatement
    side_effects: []
  - method: GET
    path: "/monthly-statements"
    description: "List monthly statements, optionally filtered by importer."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: ["limit?", "offset?", "importer_id?"]
    output: MonthlyStatement[]
    side_effects: []
  - method: POST
    path: "/monthly-statements/{id}/settle"
    description: "Settle an OPEN statement once all its entries are LIQUIDATED."
    roles: [AccountAdmin]
    code: 200
    input: []
    output: MonthlyStatement
    side_effects: ["status OPEN->SETTLED", "increments MonthlyStatement.version by 1"]

  # ---- Post-Summary Correction / Protest ----
  - method: POST
    path: "/post-summary-corrections"
    description: "Submit a post-summary correction or protest against a LIQUIDATED entry (OCC on the entry)."
    roles: [LicensedBroker, ImporterUser]
    code: 201
    input: [entry_id, filing_kind, corrected_value_delta_cents, expected_entry_version]
    output: PostSummaryCorrection
    side_effects: ["psc created status=SUBMITTED"]
  - method: GET
    path: "/post-summary-corrections/{id}"
    description: "Fetch a PSC/protest."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: []
    output: PostSummaryCorrection
    side_effects: []
  - method: GET
    path: "/post-summary-corrections"
    description: "List PSCs/protests, optionally filtered by entry."
    roles: [AccountAdmin, ImporterUser, LicensedBroker, CBPOfficer]
    code: 200
    input: ["limit?", "offset?", "entry_id?"]
    output: PostSummaryCorrection[]
    side_effects: []
  - method: POST
    path: "/post-summary-corrections/{id}/grant"
    description: "Grant a PSC/protest; applies the duty adjustment and reconciles bond + statement."
    roles: [CBPOfficer]
    code: 200
    input: []
    output: PostSummaryCorrection
    side_effects: ["computes adjustment_cents", "entry final_total += adjustment", "bond liability += adjustment", "recomputes statement total", "status SUBMITTED->GRANTED", "increments PostSummaryCorrection.version by 1"]
  - method: POST
    path: "/post-summary-corrections/{id}/deny"
    description: "Deny a PSC/protest (no fiscal effect)."
    roles: [CBPOfficer]
    code: 200
    input: []
    output: PostSummaryCorrection
    side_effects: ["adjustment_cents=0", "status SUBMITTED->DENIED", "increments PostSummaryCorrection.version by 1"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock time. Used for ISF cutoff and statement-period determinism."
    roles: [AccountAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource (path id or FK) does not exist"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "ImporterUser acting on an importer it does not own"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource not in a valid state for the requested transition"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "CBPOfficer reviewing/liquidating an entry they themselves filed"
  - id: ERR_BOND_IMPORTER_MISMATCH
    http: 422
    condition: "entry's bond_id belongs to a different importer than the entry"
  - id: ERR_PGA_NOT_CLEARED
    http: 409
    condition: "entry RELEASE attempted while a PGAReview is PENDING/HOLD, or any is REFUSED"
  - id: ERR_ISF_NOT_FILED
    http: 409
    condition: "entry FILE attempted while its ISFFiling is not in status FILED"
  - id: ERR_ISF_INCOMPLETE
    http: 422
    condition: "ISF file attempted with data_element_count != 10"
  - id: ERR_ENTRY_PRECEDES_MANIFEST
    http: 422
    condition: "entry_date earlier than vessel_eta - ISF_CUTOFF_HOURS"
  - id: ERR_INVALID_FORMAT
    http: 422
    condition: "hts_code not 10 digits, country_of_origin not 2-letter, or period_month not YYYY-MM"
  - id: ERR_DUPLICATE
    http: 409
    condition: "duplicate ior_number or bill_of_lading"
  - id: ERR_BOND_INSUFFICIENT
    http: 422
    condition: "filing would drive bond outstanding_liability strictly above bond.limit_cents"
  - id: ERR_BOND_SATURATED
    http: 409
    condition: "filing attempted against a bond already in status SATURATED"
  - id: ERR_STALE_ENTRY_VERSION
    http: 412
    condition: "expected_entry_version on PSC submission does not match the entry's current version"
  - id: ERR_VALIDATION
    http: 422
    condition: "a required input field is missing or fails a basic type/range check (e.g., customs_value_cents <= 0, data_element_count out of 0..10)"
  - id: ERR_NO_LINES
    http: 422
    condition: "entry FILE attempted with zero EntryLine rows"
  - id: ERR_INVALID_EXAM_WINDOW
    http: 422
    condition: "exam slot booked for a non-HOLD_EXAM entry, or window_end not strictly after window_start"
  - id: ERR_EXAM_SLOT_OVERLAP
    http: 409
    condition: "new exam slot's half-open interval overlaps a BOOKED slot on the same station_code"
  - id: ERR_STATEMENT_PERIOD_OVERLAP
    http: 409
    condition: "new monthly statement's calendar-month period overlaps an existing OPEN statement for the same importer"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: AccountAdmin
    description: "Operational admin: sets up importers, bonds, monthly statements, the system clock; settles statements."
    identity: "opaque"
    exclusive_operations:
      - "POST /importers"
      - "POST /bonds"
      - "POST /bonds/{id}/activate"
      - "POST /bonds/{id}/terminate"
      - "POST /monthly-statements"
      - "POST /monthly-statements/{id}/settle"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /* (all read endpoints)"
  - name: ImporterUser
    description: "Importer of record self-service: owns its importer record, may draft ISF/entries/lines and file PSCs for its own importer."
    identity: "entity_backed:Importer"
    exclusive_operations: []
    shared_operations:
      - "POST /isf-filings (own importer)"
      - "POST /entries (own importer)"
      - "POST /entries/{id}/lines (own importer)"
      - "POST /post-summary-corrections (own importer)"
      - "GET /* (read endpoints)"
  - name: LicensedBroker
    description: "Licensed customs broker: classifies HTS, files ISF and entries, opens PGA reviews, submits PSC/protest on behalf of importers."
    identity: "opaque"
    exclusive_operations:
      - "POST /isf-filings/{id}/file"
      - "POST /isf-filings/{id}/cancel"
      - "POST /entries/{id}/file"
      - "POST /entries/{id}/cancel"
    shared_operations:
      - "POST /isf-filings"
      - "POST /entries"
      - "POST /entries/{id}/lines"
      - "POST /pga-reviews"
      - "POST /post-summary-corrections"
      - "GET /* (read endpoints)"
  - name: CBPOfficer
    description: "CBP officer: reviews/releases/holds entries, records PGA decisions, liquidates, and grants/denies PSCs/protests. Subject to segregation of duties (cannot review an entry they filed)."
    identity: "opaque"
    exclusive_operations:
      - "POST /entries/{id}/review"
      - "POST /entries/{id}/liquidate"
      - "POST /pga-reviews/{id}/decide"
      - "POST /exam-slots"
      - "POST /exam-slots/{id}/cancel"
      - "POST /post-summary-corrections/{id}/grant"
      - "POST /post-summary-corrections/{id}/deny"
    shared_operations:
      - "POST /pga-reviews"
      - "GET /* (read endpoints)"
