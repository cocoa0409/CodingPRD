  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: field_remaining_sqft_conservation
        grounds:
          - calculations.field_availability
          - state_machines.HarvestBatch.PENDING_to_COMPLETE
          - state_machines.HarvestBatch.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = FIELD AREA (sqft). Invariant per crop cycle:
          remaining_sqft + sum(sellable_sqft of non-CANCELLED COMPLETE batches)
          == field_sqft. Forward action (complete: -1000) pairs with the
          compensating shape (cancel of a PENDING batch: zero drift), and the
          availability check nets PENDING reservations so two batches of
          25000 + 20000 sqft cannot both be created against 40000 remaining.
        test_recipe:
          setup:
            - "Field 40000 sqft READY, quality passing; batch A 250 PREMIUM pallets (sellable 25000) PENDING; batch B 200 PREMIUM pallets (sellable 20000) rejected at create (25000 + 20000 > 40000 availability net of pending); smaller batch C 100 pallets (10000) accepted; batch A completed (remaining 15000); batch C cancelled (no drift)"
          setup_api_calls:
            - call: "POST /price-configs"
              payload: { name: "Std 2026" }
              as: FarmManager
            - call: "POST /variety-configs"
              payload: { name: "Tifway 419 Bermuda" }
              as: FarmManager
              captures: { v_id: $.data.id }
            - call: "POST /fields"
              payload: { name: "North 40", variety_id: "${v_id}", field_sqft: 40000, last_planted_at: "2026-05-01T00:00:00Z", mow_count: 4, last_mowed_at: "2026-07-31T06:00:00Z", soil_moisture_pct: 45, health_score: 82 }
              as: FarmManager
              captures: { f_id: $.data.id, f_v: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 250, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-02", expected_field_version: "${f_v}" }
              as: HarvestSupervisor
              captures: { ba_id: $.data.id }
            - call: "GET /fields/${f_id}"
              payload: {}
              as: FarmManager
              captures: { f_v2: $.data.version }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 200, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-02", expected_field_version: "${f_v2}" }
              as: HarvestSupervisor
              captures: { err_big: $.data.error_id }
            - call: "POST /harvest-batches"
              payload: { field_id: "${f_id}", grade: "PREMIUM", pallet_count: 100, shortfall_slabs: 0, shortfall_rolls: 0, scheduled_date: "2026-08-02", expected_field_version: "${f_v2}" }
              as: HarvestSupervisor
              captures: { bc_id: $.data.id }
            - call: "POST /harvest-batches/${ba_id}/complete"
              payload: { actual_harvest_start: "2026-08-02T06:00:00Z", actual_harvest_end: "2026-08-02T07:00:00Z" }
              as: HarvestSupervisor
            - call: "POST /harvest-batches/${bc_id}/cancel"
              payload: {}
              as: HarvestSupervisor
          trigger:
            - call: "GET /fields/${f_id}"
              payload: {}
              as: FarmManager
              captures: { f_rem: $.data.remaining_sqft }
          assert:
            - "${err_big} == ERR_BATCH_YIELD_EXCEEDS_AVAILABLE  # 25000 PENDING reservation leaves only 15000"
            - "HarvestBatch.${bc_id}.status == CANCELLED"
            - "Field.${f_id}.remaining_sqft == 15000  # 40000 - 25000 (complete) - 0 (cancel of PENDING never decrements)"
            - "invariant: 15000 + 25000 == 40000"

      - name: order_money_conservation_across_checks_and_payments
        grounds:
          - calculations.order_balance_reconciliation
          - calculations.delivery_check_window
