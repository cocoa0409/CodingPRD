# SCAFFOLD_CORNER_DESIGN.yaml - task 2834 Brokered Deposit & Listing Service Funding Compliance
#
# Breadth probe over SCAFFOLD.yaml's 1.1-1.7 surface, walked section by section
# against references/claim-extraction-guide.md. Sections and claim_type values are
# taken from that guide only; no new categories are invented.
#
# Shared operator identities (same convention as SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   op_admin -> SystemAdmin        op_desk  -> FundingDeskOfficer
#   op_comp  -> ComplianceReviewer op_alm   -> TreasuryController
#   op_exam  -> Examiner           BrokerRepresentative uses a Broker.id as X-User-ID
# Logical clock is pinned at 2026-08-01T00:00:00Z unless an instance moves it.
# Every instance starts from an empty database.

scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_institution_creation_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.Institution
          - endpoints[POST /institutions]
        distinguishing_aspect: "POST /institutions with all seven declared inputs returns 201 and every Institution field, with the four wholesale buckets at 0, rate_cap_regime EXEMPT and concentration_posture OPEN."
        test_recipe:
          setup:
            - "Empty database; logical clock set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /institutions"
              payload: { legal_name: "Corner Bank NA", cert_id: "CERT-9001", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 30000000000, total_liabilities_cents: 45000000000, tier1_capital_cents: 4000000000, liquidity_buffer_cents: 900000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          assert:
            - "HTTP 201; the envelope has meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "Institution.${inst_id}.legal_name == \"Corner Bank NA\" and cert_id == \"CERT-9001\""
            - "Institution.${inst_id}.rate_cap_regime == EXEMPT (derived from WELL_CAPITALIZED)"
            - "Institution.${inst_id}.brokered_deposits_cents == 0, listing_service_deposits_cents == 0, reciprocal_deposits_cents == 0"
            - "Institution.${inst_id}.total_deposits_cents == 30000000000 (core only)"
            - "Institution.${inst_id}.wholesale_funding_ratio_bps == 0 and single_broker_max_ratio_bps == 0"
            - "Institution.${inst_id}.concentration_posture == OPEN and breached_metric_count == 0"
            - "Institution.${inst_id}.version == 1 and id, created_at, updated_at are all present and non-null"

      - name: corner_institution_retrieval_returns_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints[GET /institutions/{id}]
        distinguishing_aspect: "GET /institutions/{id} returns exactly the row POST created, byte-for-byte on every persisted field, with no recomputation drift."
        test_recipe:
          setup:
            - "One Institution created at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Corner Bank NA", cert_id: "CERT-9002", core_deposits_cents: 30000000000, total_liabilities_cents: 45000000000, tier1_capital_cents: 4000000000, liquidity_buffer_cents: 900000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "GET /institutions/${inst_id}"
              as: TreasuryController
              as_user_id: "op_alm"
          assert:
            - "HTTP 200 and data.id == ${inst_id}"
            - "data.cert_id == \"CERT-9002\" and data.total_liabilities_cents == 45000000000"
            - "data.version == 1 and data.updated_at == the created_at returned by POST (no write happened between)"
            - "data.total_deposits_cents == 30000000000 and data.concentration_posture == OPEN"

      - name: corner_national_rate_cap_listing_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints[GET /national-rate-caps]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /national-rate-caps honours limit/offset and reports total_count 3 with has_more true on the first page and false on the second."
        test_recipe:
          setup:
            - "Three NationalRateCap publications for three different tenor buckets."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /national-rate-caps"
              payload: { tenor_bucket: "NON_MATURITY", published_national_rate_bps: 400, effective_date: "2026-07-01" }
              as: SystemAdmin
            - call: "POST /national-rate-caps"
              payload: { tenor_bucket: "DAYS_1_30", published_national_rate_bps: 410, effective_date: "2026-07-01" }
              as: SystemAdmin
            - call: "POST /national-rate-caps"
              payload: { tenor_bucket: "DAYS_31_90", published_national_rate_bps: 420, effective_date: "2026-07-01" }
              as: SystemAdmin
          trigger:
            - call: "GET /national-rate-caps"
              payload: { limit: 2, offset: 0 }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "GET /national-rate-caps"
              payload: { limit: 2, offset: 2 }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "GET /national-rate-caps"
              payload: { tenor_bucket: "DAYS_31_90" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
          assert:
            - "page 1: response_type == \"array\", total_count == 3, has_more == true, limit == 2, offset == 0, and 2 rows returned"
            - "page 2: total_count == 3, has_more == false, offset == 2, and 1 row returned"
            - "the filtered read returns total_count == 1 with cap_bps == 495 (420 + 75) and non_maturity_cap_bps == 470 (420 + 50)"
            - "no row carries a version field - NationalRateCap is immutable"

      - name: corner_unknown_ids_return_typed_not_found_errors
        claim_type: Not Found
        grounds:
          - errors[ERR_INSTITUTION_NOT_FOUND]
          - errors[ERR_BROKER_NOT_FOUND]
          - errors[ERR_PLACEMENT_NOT_FOUND]
          - errors[ERR_FILING_NOT_FOUND]
        distinguishing_aspect: "Each addressed-but-absent id yields its own typed 404 rather than a generic one, and an absent FK referenced in a body yields the referenced entity's 404, not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /institutions/00000000-0000-0000-0000-0000000000aa"
              as: SystemAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /brokers/00000000-0000-0000-0000-0000000000bb"
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { e2: $.data.error_id }
            - call: "GET /deposit-placements/00000000-0000-0000-0000-0000000000cc"
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { e3: $.data.error_id }
            - call: "GET /call-report-filings/00000000-0000-0000-0000-0000000000dd"
              as: Examiner
              as_user_id: "op_exam"
              captures: { e4: $.data.error_id }
            - call: "POST /deposit-programs"
              payload: { institution_id: "00000000-0000-0000-0000-0000000000aa", program_name: "Orphan Program", funding_channel_claim: "CORE", product_type: "SAVINGS", tenor_days: 0, offered_rate_bps: 100, early_withdrawal_penalty_days: 0, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { e5: $.data.error_id }
          assert:
            - "${e1} == ERR_INSTITUTION_NOT_FOUND with HTTP 404"
            - "${e2} == ERR_BROKER_NOT_FOUND with HTTP 404"
            - "${e3} == ERR_PLACEMENT_NOT_FOUND with HTTP 404"
            - "${e4} == ERR_FILING_NOT_FOUND with HTTP 404"
            - "${e5} == ERR_INSTITUTION_NOT_FOUND with HTTP 404 - a dangling body FK is a 404, not a 400"
            - "every error body has response_type == \"error\" and data.message present"

      - name: corner_missing_required_fields_rejected
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /institutions]
          - endpoints[POST /deposit-programs]
        distinguishing_aspect: "Omitting any input field that has no declared default returns ERR_INVALID_REQUEST (400) and persists nothing; the fields with defaults may be omitted freely."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Corner Bank NA", cert_id: "CERT-9005", core_deposits_cents: 30000000000, total_liabilities_cents: 45000000000, tier1_capital_cents: 4000000000, liquidity_buffer_cents: 900000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /institutions"
              payload: { legal_name: "No Cert Bank NA", core_deposits_cents: 1, total_liabilities_cents: 1, tier1_capital_cents: 0, liquidity_buffer_cents: 0 }
              as: SystemAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", funding_channel_claim: "CORE", product_type: "SAVINGS", tenor_days: 0, offered_rate_bps: 100, early_withdrawal_penalty_days: 0, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { e2: $.data.error_id }
            - call: "POST /institutions/${inst_id}/call-report-filings"
              payload: { report_period: "2026Q2", rc_e_brokered_reported_cents: 0, rc_o_listing_reported_cents: 0 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_INVALID_REQUEST with HTTP 400 (cert_id absent, no default declared)"
            - "${e2} == ERR_INVALID_REQUEST with HTTP 400 (program_name absent)"
            - "${e3} == ERR_INVALID_REQUEST with HTTP 400 (rc_e_core_reported_cents absent)"
            - "GET /institutions returns total_count == 1 and GET /deposit-programs returns total_count == 0 - no partial rows were written"

      - name: corner_omitted_optional_inputs_take_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Broker.fields.fee_bps
          - entities.Institution.fields.capital_category
          - entities.DepositProgram.fields.principal_erosion_allowed
          - entities.DepositProgram.fields.reciprocal_arrangement_cents
        distinguishing_aspect: "Every input field carrying a declared default is materialised at that default when omitted: capital_category WELL_CAPITALIZED, fee_bps 0, principal_erosion_allowed false, rollover_enabled false, reciprocal_arrangement_cents 0, local_prevailing_rate_bps null."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /institutions"
              payload: { legal_name: "Default Bank NA", cert_id: "CERT-9006", core_deposits_cents: 30000000000, total_liabilities_cents: 45000000000, tier1_capital_cents: 4000000000, liquidity_buffer_cents: 900000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Default Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: false, fee_structure: "FLAT_FEE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", program_name: "Default Core Savings", funding_channel_claim: "CORE", product_type: "SAVINGS", tenor_days: 0, offered_rate_bps: 100, early_withdrawal_penalty_days: 0, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_id: $.data.id }
          assert:
            - "Institution.${inst_id}.capital_category == WELL_CAPITALIZED and rate_cap_regime == EXEMPT"
            - "Broker.${brk_id}.fee_bps == 0 and fee_flat_cents == 0 and diligence_status == NOT_STARTED and approved_agreement_count == 0"
            - "DepositProgram.${prog_id}.principal_erosion_allowed == false, pass_through_insurance == false, rollover_enabled == false"
            - "DepositProgram.${prog_id}.reciprocal_arrangement_cents == 0 and local_prevailing_rate_bps == null"
            - "DepositProgram.${prog_id}.broker_id == null and agreement_id == null and outstanding_principal_cents == 0"
            - "DepositProgram.${prog_id}.state == PENDING_CLASSIFICATION and governing_classification_id == null"

      - name: corner_computed_fields_derived_not_supplied
        claim_type: Computed Fields
        grounds:
          - calculations.tenor_bucket_assignment
          - entities.DepositPlacement.fields.maturity_date
          - entities.Institution.fields.total_deposits_cents
        distinguishing_aspect: "maturity_date, tenor_bucket and total_deposits_cents are absent from every endpoint's input: and are derived - a 45-day placement issued 2026-08-01 matures 2026-09-15 in bucket DAYS_31_90, and a NON_MATURITY program keeps bucket NON_MATURITY despite tenor_days 0."
        test_recipe:
          setup:
            - "Institution plus an OPEN_FOR_PLACEMENT brokered TIME_DEPOSIT program (agreement approved, classification determined and attested)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Derive Bank NA", cert_id: "CERT-9007", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 30000000000, total_liabilities_cents: 45000000000, tier1_capital_cents: 4000000000, liquidity_buffer_cents: 900000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Derive Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: true, fee_structure: "FLAT_FEE", fee_flat_cents: 10000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-9007", fee_structure: "FLAT_FEE", fee_flat_cents: 10000, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { agr_id: $.data.id }
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "START_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Derive Brokered CD", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 45, offered_rate_bps: 470, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /deposit-classifications"
              payload: { program_id: "${prog_id}", expected_program_version: "${prog_v}", rationale_code: "PLACEMENT_DISCRETION_PRONG" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs/${prog_id}/state-actions"
              payload: { action: "ATTEST_CLASSIFICATION" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", program_name: "Derive Core MMDA", funding_channel_claim: "CORE", product_type: "MONEY_MARKET", tenor_days: 0, offered_rate_bps: 200, early_withdrawal_penalty_days: 0, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_nm_id: $.data.id }
          trigger:
            - call: "POST /deposit-placements"
              payload: { program_id: "${prog_id}", principal_cents: 1000000000, rate_bps: 470, issue_date: "2026-08-01", tenor_days: 45 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { pl_id: $.data.id }
            - call: "POST /deposit-placements/${pl_id}/funding-actions"
              payload: { action: "ACTIVATE" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
          assert:
            - "DepositProgram.${prog_id}.tenor_bucket == DAYS_31_90 (45 days) and DepositProgram.${prog_nm_id}.tenor_bucket == NON_MATURITY (MONEY_MARKET, tenor_days 0)"
            - "DepositPlacement.${pl_id}.maturity_date == \"2026-09-15\" and tenor_bucket == DAYS_31_90 - neither is an input field on POST /deposit-placements"
            - "DepositPlacement.${pl_id}.classified_as == BROKERED, snapshotted from the program's governing classification at ACTIVATE"
            - "Institution.${inst_id}.total_deposits_cents == 31000000000 and brokered_deposits_cents == 1000000000 - both derived, never supplied"
            - "Institution.${inst_id}.wholesale_funding_ratio_bps == 322 (floor(1000000000 * 10000 / 31000000000))"
            - "DepositProgram.${prog_id}.outstanding_principal_cents == 1000000000"

      - name: corner_system_fields_stamped_from_path_and_headers
        claim_type: System Fields
        grounds:
          - entities.BrokerAgreement.fields.broker_id
          - entities.BrokerAgreement.fields.prepared_by_user_id
          - entities.BrokerAgreement.fields.status
        distinguishing_aspect: "BrokerAgreement.broker_id comes from the path segment and prepared_by_user_id from X-User-ID; id, created_at, updated_at and version are server-minted, and status starts at DRAFT with diligence_score 0."
        test_recipe:
          setup:
            - "One Broker registered by op_desk."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Stamp Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: true, fee_structure: "BASIS_POINT_FEE", fee_bps: 12 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
          trigger:
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-9008", fee_structure: "BASIS_POINT_FEE", fee_bps: 12, termination_notice_days: 45, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { agr_id: $.data.id }
          assert:
            - "HTTP 201 and BrokerAgreement.${agr_id}.broker_id == ${brk_id}, taken from the path, never from the body"
            - "BrokerAgreement.${agr_id}.prepared_by_user_id == \"op_desk\" and reviewed_by_user_id == null"
            - "BrokerAgreement.${agr_id}.status == DRAFT, diligence_score == 0, rfi_round_count == 0, accrued_fee_cents == 0"
            - "BrokerAgreement.${agr_id}.version == 1 with id, created_at and updated_at all server-minted"
            - "GET /brokers/${brk_id}/agreements returns total_count == 1 containing ${agr_id}"

      - name: corner_type_and_range_violations_rejected
        claim_type: Type Constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.DepositProgram.fields.funding_channel_claim
          - entities.BrokerAgreement.fields.aml_program_score
        distinguishing_aspect: "An undeclared enum member, a negative *_cents value, a diligence sub-score above 100 and a malformed date each return ERR_INVALID_REQUEST (400) before any business rule runs."
        test_recipe:
          setup:
            - "One Institution and one Broker exist so the requests fail on shape alone, not on referential integrity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Shape Bank NA", cert_id: "CERT-9009", core_deposits_cents: 30000000000, total_liabilities_cents: 45000000000, tier1_capital_cents: 4000000000, liquidity_buffer_cents: 900000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Shape Brokers LLC", broker_type: "DEPOSIT_BROKER", has_placement_discretion: true, fee_structure: "FLAT_FEE", fee_flat_cents: 10000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
          trigger:
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", program_name: "Bad Enum Program", funding_channel_claim: "WHOLESALE_FUNDING", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 400, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { e1: $.data.error_id }
            - call: "POST /institutions"
              payload: { legal_name: "Negative Bank NA", cert_id: "CERT-9010", core_deposits_cents: -1, total_liabilities_cents: 45000000000, tier1_capital_cents: 4000000000, liquidity_buffer_cents: 900000000 }
              as: SystemAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-9009", fee_structure: "FLAT_FEE", fee_flat_cents: 10000, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 101, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { e3: $.data.error_id }
            - call: "POST /institutions/${inst_id}/call-report-filings"
              payload: { report_period: "2026-Q2", rc_e_brokered_reported_cents: 0, rc_o_listing_reported_cents: 0, rc_e_core_reported_cents: 0 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { e4: $.data.error_id }
          assert:
            - "${e1} == ERR_INVALID_REQUEST with HTTP 400 - WHOLESALE_FUNDING is not a funding_channel_claim member"
            - "${e2} == ERR_INVALID_REQUEST with HTTP 400 - core_deposits_cents must be >= 0"
            - "${e3} == ERR_INVALID_REQUEST with HTTP 400 - aml_program_score must be within 0..100"
            - "${e4} == ERR_INVALID_REQUEST with HTTP 400 - report_period must match ^[0-9]{4}Q[1-4]$"
            - "GET /deposit-programs returns total_count == 0 and GET /brokers/${brk_id}/agreements returns total_count == 0"

      - name: corner_immutable_entities_expose_no_version_or_update_path
        claim_type: Immutability
        grounds:
          - entities.NationalRateCap
          - entities.DepositClassification
          - entities.RateCapCheck
        distinguishing_aspect: "The three common_fields:false entities (NationalRateCap, DepositClassification, RateCapCheck) return no version field and 1.5 declares no PATCH or action endpoint that mutates them; a superseding determination is a new row, not an edit."
        test_recipe:
          setup:
