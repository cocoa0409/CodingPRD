            - { call: "GET /entries/${en_sb}/result", payload: {}, as: Any, captures: { pts_sb: "$.data[0].points", plc_sb: "$.data[0].place" } }
            - { call: "GET /entries/${en_sd}/result", payload: {}, as: Any, captures: { pts_sd: "$.data[0].points", plc_sd: "$.data[0].place" } }
            - { call: "GET /teams/${team_s}", payload: {}, as: Any, captures: { tot_s: "$.data.provisional_points" } }
