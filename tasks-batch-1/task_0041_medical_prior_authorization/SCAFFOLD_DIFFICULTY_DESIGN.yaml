              as: Payer
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SERVICE", procedure_code: "CPT-PAUSE", requested_units: 1, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "CHART_NOTE", line_item_cost_cents: 0, uri: "s3://pz1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/start-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: Payer
            - call: "POST /review-decisions"
              payload: { request_id: "${req_id}", reviewer_id: "${reviewer_id}", outcome: "PEND", pend_reason: "INSUFFICIENT_EVIDENCE" }
