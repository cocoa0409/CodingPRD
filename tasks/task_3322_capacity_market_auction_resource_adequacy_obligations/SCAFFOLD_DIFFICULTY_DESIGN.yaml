  - rule_id: non_linear_state_machine
    instances:
      - name: commitment_replacement_loop_revert_and_reapply
        grounds:
          - state_machines.CapacityCommitment.ACTIVE_to_REPLACEMENT_PENDING
          - state_machines.CapacityCommitment.REPLACEMENT_PENDING_to_ACTIVE
          - concurrency_rules[replacement-create-stale-commitment]
        distinguishing_aspect: |
          Cyclic shape on CapacityCommitment: ACTIVE -> REPLACEMENT_PENDING ->
          ACTIVE on reject (committed_mw unchanged) and again ACTIVE ->
          REPLACEMENT_PENDING on a fresh replacement — the loop is traversable
          more than once on the same commitment.
