      # -----------------------------------------------------------------------
      # V7 — PAIR-4: the conflict between ERR_CUSTOMER_NOT_ACTIVE (60) and
      # ERR_WARRANTY_RESERVE_EXHAUSTED (76) cannot be posed on approve, because
      # the only route to a non-ACTIVE customer VOIDS the open claim and rung 43
      # pre-empts both. Both members are shown reachable in isolation.
      # -----------------------------------------------------------------------
      - name: val_priority_conflict_pair4_customer_suspension_voids_the_claim_before_the_reserve_gate
        claim_type: "Priority conflict"
        grounds:
          - validation_rules.priority_43
          - validation_rules.priority_60
          - validation_rules.priority_76
          - errors.ERR_CUSTOMER_NOT_ACTIVE
          - errors.ERR_WARRANTY_RESERVE_EXHAUSTED
          - errors.ERR_CLAIM_INVALID_STATE
          - calculations.warranty_payout
          - endpoints.POST_/customers/{customer_id}/suspend
          - endpoints.POST_/warranty-claims/{warranty_claim_id}/approve
        distinguishing_aspect: "With a 50000-cent reserve and a 304000-cent net payout, approving the claim of an ACTIVE customer returns 409 ERR_WARRANTY_RESERVE_EXHAUSTED; suspending that customer to violate PAIR-4 member A instead VOIDS the UNDER_REVIEW claim through the suspend cascade, so the retried approve returns 409 ERR_CLAIM_INVALID_STATE and neither pair member's error can ever be the response on approve."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVY is identical to PM-CVW in geometry but carries msrp_cents 400000 and initial_warranty_reserve_cents 50000 with warranty_basis PRO_RATA_AGE."
            - "Customer CUS-CVW is ACTIVE and acknowledged the storage guidance at exactly the delivery instant 2026-08-01T12:00:00Z."
            - "Hulls fu1 and fu2 were produced from PO-CVW, stored at WH-CVA, shipped on SHP-CVW and DELIVERED at 2026-08-01T12:00:00Z."
            - "ProductModel PM-CVY reads warranty_reserve_cents 50000 and warranty_paid_cents 0; no claim exists yet."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - &cvY_pm
              call: "POST /product-models"
              payload: { model_code: "PM-CVY", hull_type: "CANOE", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 10.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 1.0000, nest_factor: 0.5000, unit_weight_kg: 40.000, msrp_cents: 400000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 50000, seasonal_family: "PADDLE" }
