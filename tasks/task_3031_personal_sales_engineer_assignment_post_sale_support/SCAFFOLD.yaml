# =============================================================================
# §1.0–§1.7 PRD Benchmark Scaffold
# Task: task_3031_personal_sales_engineer_assignment_post_sale_support
# =============================================================================

scenario: |
  Personal Sales Engineer Assignment & Post-Sale Support (Sweetwater): customer-to-sales-engineer assignment persisting across the account lifetime with commission attribution, consultative quoting for compatible audio and instrument systems with dependency checking, guitar setup and inspection before shipment with per-instrument documentation, free extended warranty administration and service-center repair routing, tech support entitlement tied to purchase history with escalation to a service department, backorder and preorder allocation across engineers' customer books, gear exchange and trial period handling for tone-sensitive returns, engineer training certification and product knowledge assessment

domain_name: personal-sales-engineer-support
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# §1.0 Response Envelope (FIXED — emitted verbatim)
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Engineer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Engineer display name" }
      - { name: email, type: string, source: input, description: "Work email", constraints: "unique across Engineer" }
      - { name: region, type: enum, source: input, description: "MIDWEST | SOUTH | WEST | EAST" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | OFFBOARDED" }
      - { name: max_book_size, type: integer, source: input, default: 120, description: "Maximum number of book rows this engineer may hold" }
      - { name: active_book_size, type: integer, source: computed, default: 0, description: "Count of Assignment rows for this engineer with status == ACTIVE" }
      - { name: certified_family_count, type: integer, source: computed, default: 0, description: "Count of distinct product_family among this engineer's CertificationAttempt rows with certified == true" }
      - { name: seniority_tier, type: enum, source: computed, default: TIER_1, description: "TIER_1 | TIER_2 | TIER_3 — derived by calculations.engineer_seniority_tier" }
      - { name: commission_cap_bps, type: integer, source: computed, default: 5000, description: "Maximum engineer commission share in basis points, from seniority_tier" }
      - { name: lifetime_commission_cents, type: integer, source: computed, default: 0, description: "Sum of finalized engineer_commission_cents across quotes this engineer authored with status RESERVED and fully shipped" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer display name" }
      - { name: email, type: string, source: input, description: "Customer email", constraints: "unique across Customer" }
      - { name: home_state, type: string, source: input, description: "Two-letter home state code" }
      - { name: account_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | PREMIUM | STUDIO — drives restocking fee bps" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ACTIVE | CLOSED" }
      - { name: assigned_engineer_id, type: string, source: computed, description: "Mirror of the engineer_id on this customer's ACTIVE Assignment; null when no Assignment is ACTIVE" }
      - { name: purchased_instrument_count, type: integer, source: computed, default: 0, description: "Count of QuoteLine rows whose quote_id resolves to a Quote with customer_id == this Customer.id, status IN {RESERVED, INSPECTION_PENDING, INSPECTED, SHIPPED, EXCHANGED}" }
      - { name: lifetime_gear_credit_cents, type: integer, source: computed, default: 0, description: "Conserved money balance: sum of restocking fees credited by completed exchanges, minus credits consumed by restocking" }
      - { name: tech_support_entitlement, type: enum, source: computed, default: NONE, description: "NONE | BASIC | EXTENDED — derived by calculations.customer_tech_support_entitlement" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the account this engineer owns" }
      - { name: engineer_id, type: string, source: input, description: "FK -> Engineer.id; the engineer holding the book" }
      - { name: reason_code, type: enum, source: input, description: "NEW_ACCOUNT | PERMANENT_TRANSFER | REGION_CHANGE | TEMPORARY_COVERAGE" }
      - { name: commission_share_bps, type: integer, source: input, default: 5000, description: "Requested engineer share of the quote commission pool, in basis points; capped by Engineer.commission_cap_bps" }
      - { name: effective_until, type: datetime, source: input, description: "Coverage end instant; required when reason_code == TEMPORARY_COVERAGE, null otherwise" }
      - { name: sequence, type: integer, source: system, default: 1, description: "Monotone reassignment index within the customer's book, starting at 1" }
      - { name: assigned_at, type: datetime, source: system, description: "Logical-clock instant the assignment first became ACTIVE; null while PENDING_ACCEPT" }
      - { name: status, type: enum, source: system, default: PENDING_ACCEPT, description: "PENDING_ACCEPT | ACTIVE | ENDED" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the account the quote is written for" }
      - { name: engineer_id, type: string, source: input, description: "FK -> Engineer.id; the consultative author and commission earner" }
      - { name: package_type, type: enum, source: input, description: "SYSTEM_PACKAGE | INSTRUMENT_ONLY | ACCESSORY_ONLY" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | RESERVED | REJECTED | CANCELLED" }
      - { name: bundle_ready, type: boolean, source: computed, default: false, description: "True when every line's dependency edges resolve and all member families are covered" }
      - { name: dependency_closure_size, type: integer, source: computed, default: 0, description: "Count of distinct QuoteLine rows in the transitive dependency closure rooted at the package anchor" }
      - { name: gross_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of QuoteLine.line_total_cents over all lines, per precision rule" }
      - { name: reserved_at, type: datetime, source: system, description: "Logical-clock instant the quote became RESERVED; null otherwise" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version; bumped by every reservation" }

  - name: QuoteLine
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the owning quote" }
      - { name: product_id, type: string, source: system, description: "Product referenced by product_code; resolved at line creation" }
      - { name: product_code, type: string, source: input, description: "Catalog code of the audio or instrument product" }
      - { name: product_family, type: enum, source: computed, description: "GUITAR | AMPLIFIER | INTERFACE | MICROPHONE | EFFECT_PEDAL | ACCESSORY" }
      - { name: is_anchor, type: boolean, source: input, default: false, description: "True on the single line that anchors the dependency closure" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Catalog price resolved from the product at line creation" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Units on this line", constraints: ">= 1" }
      - { name: requires_line_id, type: string, source: input, description: "FK -> QuoteLine.id; self-referential dependency edge to a prerequisite line; null for roots" }
      - { name: bundle_discount_bps, type: integer, source: computed, default: 0, description: "6667 when the line's Quote has package_type SYSTEM_PACKAGE, else 0" }
      - { name: line_total_cents, type: integer, source: computed, description: "= quantity * round_half_up(unit_price_cents * (10000 - bundle_discount_bps) / 10000, 2); per-unit round then multiply per precision rule" }

  - name: InstrumentUnit
    parent: null
    common_fields: true
    fields:
      - { name: quote_line_id, type: string, source: input, description: "FK -> QuoteLine.id; the line that sold this serialized instrument" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique across InstrumentUnit", constraints: "unique across InstrumentUnit" }
      - { name: model_code, type: string, source: input, description: "Instrument model code" }
      - { name: setup_status, type: enum, source: system, default: PENDING_SETUP, description: "PENDING_SETUP | IN_SETUP | SETUP_COMPLETE | INSPECTED | SHIPPED" }
      - { name: setup_technician_id, type: string, source: input, description: "Opaque technician operator id performing the bench setup" }
      - { name: action_height_mm, type: number, source: input, description: "Measured string action at the 12th fret in millimetres" }
      - { name: relief_mm, type: number, source: input, description: "Measured neck relief in millimetres" }
      - { name: intonation_offset_cents, type: integer, source: input, description: "Measured intonation deviation in cents" }
      - { name: inspection_overall, type: enum, source: computed, default: PASS, description: "PASS | CONDITIONAL | FAIL — folded from the four measurement checks" }
      - { name: modified_since_setup, type: boolean, source: computed, default: false, description: "True when any measurement changes after INSPECTED; forces re-inspection" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical-clock instant the instrument left the bench; null until SHIPPED" }

  - name: WarrantyPlan
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the registered owner" }
      - { name: instrument_unit_id, type: string, source: input, description: "FK -> InstrumentUnit.id; the serialized covered instrument" }
      - { name: term_months, type: integer, source: input, default: 24, description: "Coverage term in months", constraints: "in {12, 24, 36}" }
      - { name: starts_on, type: datetime, source: computed, description: "Coverage anchor instant, derived at activation" }
      - { name: expires_on, type: datetime, source: computed, description: "= starts_on + term_months" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ACTIVE | CLAIM_OPEN | REPAIR_IN_PROGRESS | EXPIRED | VOIDED" }
      - { name: repair_rounds_used, type: integer, source: computed, default: 0, description: "Count of completed WarrantyClaims for this plan" }
      - { name: remaining_repair_rounds, type: integer, source: computed, default: 3, description: "= max(0, 3 - repair_rounds_used)" }

  - name: WarrantyClaim
    parent: WarrantyPlan
    common_fields: true
    fields:
      - { name: warranty_plan_id, type: string, source: input, description: "FK -> WarrantyPlan.id; the plan being drawn on" }
      - { name: reported_fault, type: string, source: input, description: "Free-text fault description from the customer" }
      - { name: service_center_id, type: string, source: input, description: "FK -> ServiceCenter.id; routed repair center" }
      - { name: status, type: enum, source: system, default: PENDING_ROUTING, description: "PENDING_ROUTING | ROUTED | CLOSED" }
      - { name: routed_at, type: datetime, source: system, description: "Logical-clock instant the claim was routed; null until ROUTED" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock instant the claim closed; null until CLOSED" }

  - name: ServiceCenter
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Service center display name" }
      - { name: region, type: enum, source: input, description: "MIDWEST | SOUTH | WEST | EAST" }
      - { name: capacity_slots, type: integer, source: input, description: "Maximum concurrent open repair tickets" }
      - { name: open_ticket_count, type: integer, source: computed, default: 0, description: "Count of WarrantyClaim rows routed here with status IN {ROUTED}" }
      - { name: accepted_families, type: array, source: input, description: "Product families this center is authorized to repair" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | SUSPENDED" }

  - name: SupportTicket
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the requesting account" }
      - { name: subject, type: string, source: input, description: "Short issue summary" }
      - { name: channel, type: enum, source: input, description: "PHONE | EMAIL | CHAT" }
      - { name: service_center_id, type: string, source: input, description: "FK -> ServiceCenter.id; the escalation desk the ticket names; null until triage" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | IN_TRIAGE | ESCALATED | RESOLVED" }
      - { name: required_entitlement, type: enum, source: computed, default: BASIC, description: "Entitlement level required to open: BASIC or EXTENDED" }
      - { name: escalated_at, type: datetime, source: system, description: "Logical-clock instant the ticket escalated; null until ESCALATED" }
      - { name: escalated_by, type: string, source: system, description: "Opaque operator id that filed the escalation; null until ESCALATED" }
      - { name: prior_service_center_id, type: string, source: system, description: "Service center the ticket was last routed to before escalation; null otherwise" }
      - { name: escalation_seq, type: integer, source: system, default: 0, description: "Monotone escalation index within the ticket, starting at 1" }
      - { name: escalation_count, type: integer, source: computed, default: 0, description: "Number of SERVICE_DEPARTMENT_ESCALATION ledger rows appended for this ticket" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Catalog code; unique across Product", constraints: "unique across Product" }
      - { name: display_name, type: string, source: input, description: "Catalog display name" }
      - { name: product_family, type: enum, source: input, description: "GUITAR | AMPLIFIER | INTERFACE | MICROPHONE | EFFECT_PEDAL | ACCESSORY" }
      - { name: unit_price_cents, type: integer, source: input, description: "Catalog list price in cents", constraints: ">= 0" }
      - { name: required_family, type: enum, source: input, description: "Product family that must also be present for this product to be usable; null when standalone" }
      - { name: requires_certification, type: boolean, source: input, default: false, description: "True when the selling engineer must be certified in this product_family" }
      - { name: in_catalog, type: boolean, source: input, default: true, description: "False when the product is discontinued and cannot be newly quoted" }

  - name: Backorder
    parent: null
    common_fields: true
    fields:
      - { name: quote_line_id, type: string, source: input, description: "FK -> QuoteLine.id; the line this backorder fulfills" }
      - { name: engineer_id, type: string, source: input, description: "FK -> Engineer.id; the engineer whose book owns the claim" }
      - { name: variant_bps, type: integer, source: input, default: 6000, description: "Requested unit share in basis points used by the provisional allocation estimate" }
      - { name: preorder_open_at, type: datetime, source: input, description: "Logical-clock instant preorders first attach to this backorder" }
      - { name: units_requested, type: integer, source: input, default: 1, description: "Units the engineer's book wants", constraints: ">= 0" }
      - { name: units_filled, type: integer, source: computed, default: 0, description: "Units already allocated to this backorder by the most recent waterfall allocation" }
      - { name: overcommit_estimate_units, type: integer, source: computed, default: 0, description: "Provisional allocation estimate for the current pool; diverges from units_filled" }
      - { name: alloc_sequence, type: integer, source: system, description: "Monotone allocation sequence assigned at creation; the chronological tie-break key" }
      - { name: eta_deadline, type: datetime, source: computed, description: "= preorder_open_at + 30 days; last instant a preorder may be honored via GET /backorders" }
      - { name: status, type: enum, source: system, default: PREORDER_PENDING, description: "PREORDER_PENDING | ALLOCATION_SWEEP | PARTIALLY_FILLED | BOARD_FILLED | RECEIVING | SHIPPED | CANCELLED" }

  - name: GearExchange
    parent: null
    common_fields: true
    fields:
      - { name: quote_line_id, type: string, source: input, description: "FK -> QuoteLine.id; the line being exchanged" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the exchanging account" }
      - { name: reason, type: enum, source: input, description: "TONE_MISMATCH | DEFECT_DOA | WRONG_MODEL | CHANGED_MIND" }
      - { name: trial_start_date, type: datetime, source: computed, description: "Logical-clock instant the trial period began, set at exchange open" }
      - { name: trial_end_date, type: datetime, source: computed, description: "= trial_start_date + 14 days" }
      - { name: days_remaining, type: integer, source: computed, description: "= max(0, ceil((trial_end_date - clock_now)/1 day))" }
      - { name: restocking_fee_bps, type: integer, source: computed, default: 0, description: "Fee rate from calculations.gear_exchange_restocking_fee" }
      - { name: restocking_fee_cents, type: integer, source: computed, default: 0, description: "= round_half_up(quote_line.line_total_cents * restocking_fee_bps / 10000)" }
      - { name: refund_credit_cents, type: integer, source: computed, default: 0, description: "= quote_line.line_total_cents - restocking_fee_cents; credited to Customer.lifetime_gear_credit_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | TRIAL_ACTIVE | RETURN_REQUESTED | EXCHANGED | DENIED | CANCELLED" }

  - name: CertificationAttempt
    parent: null
    common_fields: true
    fields:
      - { name: engineer_id, type: string, source: input, description: "FK -> Engineer.id; the certified engineer" }
      - { name: product_family, type: enum, source: input, description: "GUITAR | AMPLIFIER | INTERFACE | MICROPHONE | EFFECT_PEDAL | ACCESSORY" }
      - { name: score_pct, type: integer, source: input, description: "Assessment score as a whole percentage", constraints: "0 .. 100" }
      - { name: attempt_index, type: integer, source: computed, default: 1, description: "1-based attempt counter within (engineer_id, product_family)" }
      - { name: eligible_to_retake, type: boolean, source: computed, default: true, description: "False once attempt_index reaches 3 without certification" }
      - { name: certified, type: boolean, source: computed, description: "True when score_pct >= 80; a derived flag, never client-settable", constraints: "boolean" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | PASSED | FAILED | EXPIRED" }
      - { name: assessed_at, type: datetime, source: system, description: "Logical-clock instant the attempt was graded" }
      - { name: expires_at, type: datetime, source: computed, description: "= assessed_at + 12 months; last instant certified remains true" }

  - name: EscalationLedger
    parent: null
    common_fields: true
    fields:
      - { name: support_ticket_id, type: string, source: input, description: "FK -> SupportTicket.id; the escalated ticket" }
      - { name: service_center_id, type: string, source: input, description: "FK -> ServiceCenter.id; the desk the escalation was routed to" }
      - { name: event_type, type: enum, source: system, default: SERVICE_DEPARTMENT_ESCALATION, description: "SERVICE_DEPARTMENT_ESCALATION | ESCALATION_WITHDRAWN" }
      - { name: escalation_seq, type: integer, source: system, description: "1 + max(EscalationLedger.escalation_seq) over the same support_ticket_id; the stable ordering key" }
      - { name: posted_at, type: datetime, source: system, description: "Logical-clock instant the ledger row was appended" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Assignment
    initial_state: PENDING_ACCEPT
    terminal_states: []
    shape: cyclic
    transitions:
      - from: PENDING_ACCEPT
        to: ACTIVE
        trigger: "POST /assignments/{id}/accept"
        actor: Engineer
        preconditions:
          - "Assignment.status == PENDING_ACCEPT"
          - "Engineer.status of Assignment.engineer_id == ACTIVE"
          - "Engineer.active_book_size of Assignment.engineer_id < Engineer.max_book_size of the same engineer"
          - "no other Assignment for Assignment.customer_id has status IN {ACTIVE} (book exclusivity)"
        side_effects:
          - "Assignment.assigned_at stamped from the logical clock"
          - "Assignment.sequence set to 1 + max(Assignment.sequence) over Assignments for the same customer_id, or 1 when the book is empty"
          - "Engineer.active_book_size incremented by 1 for the holding engineer"
          - "Customer.assigned_engineer_id set to Assignment.engineer_id"
          - "calculations.customer_tech_support_entitlement recomputed on Customer (hop 1 of cascade assignment_entitlement_escalation)"
      - from: PENDING_ACCEPT
        to: ENDED
        trigger: "POST /assignments/{id}/decline"
        actor: Engineer
        preconditions:
          - "Assignment.status == PENDING_ACCEPT"
        side_effects:
          - "Customer.assigned_engineer_id left unchanged (still null)"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /assignments/{id}/end"
        actor: SalesEngineerOps | PlatformAdmin
        preconditions:
          - "Assignment.status == ACTIVE"
        side_effects:
          - "Customer.assigned_engineer_id set to null (hop 1 of cascade assignment_entitlement_escalation)"
          - "calculations.customer_tech_support_entitlement recomputed on Customer, which downgrades tech_support_entitlement to NONE when no other instrument purchase history supports BASIC (hop 2)"
          - "each open SupportTicket of the same customer with status IN {OPEN, IN_TRIAGE} whose required_entitlement == EXTENDED moves to ESCALATED and stamps escalated_at from the logical clock and escalated_by from the acting operator id (hop 3)"
          - "each such escalated SupportTicket increments ServiceCenter.open_ticket_count for its named service center (hop 4)"
          - "Engineer.active_book_size decremented by 1 for the releasing engineer"
      - from: ENDED
        to: ACTIVE
        trigger: "POST /assignments/{id}/reopen"
        actor: SalesEngineerOps | PlatformAdmin
        preconditions:
          - "Assignment.status == ENDED"
          - "Engineer.status of Assignment.engineer_id == ACTIVE"
          - "Engineer.active_book_size of Assignment.engineer_id < Engineer.max_book_size of the same engineer"
          - "the re-proposed assigned_at interval [new assigned_at, null) does not overlap the half-open interval [assigned_at, ended_at) of any ENDED Assignment for the same customer_id (adjacency at an identical instant is permitted)"
        side_effects:
          - "Assignment.assigned_at restamped from the logical clock"
          - "Assignment.sequence incremented by 1"
          - "Customer.assigned_engineer_id set to Assignment.engineer_id"
          - "Engineer.active_book_size incremented by 1 for the holding engineer"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    shape: branching_with_cycle
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /quotes/{id}/submit"
        actor: Engineer
        preconditions:
          - "Quote.status == DRAFT"
          - "Quote.bundle_ready == true (every line's requires_line_id resolves and every Product.required_family is covered)"
          - "the customer's Assignment for Quote.customer_id has status ACTIVE and Assignment.engineer_id == Quote.engineer_id"
        side_effects:
          - "Quote.status set to SUBMITTED"
          - "calculations.engineer_commission_cents computed with variant provisional against the quote gross subtotal"
      - from: SUBMITTED
        to: RESERVED
        trigger: "POST /quotes/{id}/reserve"
        actor: Engineer
        preconditions:
          - "Quote.status == SUBMITTED"
          - "Quote.bundle_ready == true"
          - "the customer's Assignment for Quote.customer_id has status ACTIVE (cross-entity state dependency on Assignment)"
          - "no Backorder for any QuoteLine of this quote has status IN {BOARD_FILLED, SHIPPED}"
        side_effects:
          - "Quote.reserved_at stamped from the logical clock"
          - "Quote.version incremented by 1"
          - "each QuoteLine of this quote creates one Backorder with alloc_sequence = 1 + max(Backorder.alloc_sequence) and status PREORDER_PENDING"
          - "Quote.bundle_ready recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /quotes/{id}/reject"
        actor: SalesEngineerOps
        preconditions:
          - "Quote.status == SUBMITTED"
        side_effects:
          - "Quote.bundle_ready recomputed to false"
      - from: RESERVED
        to: SUBMITTED
        trigger: "POST /quotes/{id}/amend"
        actor: Engineer
        preconditions:
          - "Quote.status == RESERVED"
          - "no Backorder for any QuoteLine of this quote has status IN {BOARD_FILLED, SHIPPED, RECEIVING}"
        side_effects:
          - "Quote.reserved_at cleared to null"
          - "Quote.version incremented by 1"
          - "Backorders created by the prior reserve transition whose status == ALLOCATION_SWEEP are set to CANCELLED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /quotes/{id}/cancel"
        actor: Engineer | SalesEngineerOps
        preconditions:
          - "Quote.status IN {DRAFT, REJECTED}"
        side_effects:
          - "Quote.version incremented by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /quotes/{id}/reopen"
        actor: Engineer
        preconditions:
          - "Quote.status == REJECTED"
        side_effects:
          - "Quote.bundle_ready recomputed"

  - entity: WarrantyPlan
    initial_state: PENDING
    terminal_states: [VOIDED]
    shape: cyclic
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /warranty-plans/{id}/activate"
        actor: SalesEngineerOps
        preconditions:
          - "WarrantyPlan.status == PENDING"
          - "the InstrumentUnit named by WarrantyPlan.instrument_unit_id has setup_status == SHIPPED"
          - "WarrantyPlan.starts_on (provided at activation) is not after the logical clock by more than 0 days"
        side_effects:
          - "WarrantyPlan.expires_on recomputed as starts_on + term_months"
          - "WarrantyPlan.remaining_repair_rounds recomputed as max(0, 3 - repair_rounds_used)"
      - from: ACTIVE
        to: CLAIM_OPEN
        trigger: "POST /warranty-claims"
        actor: SupportAgent
        preconditions:
          - "WarrantyPlan.status IN {ACTIVE, EXPIRED}"
          - "WarrantyPlan.remaining_repair_rounds > 0"
          - "the logical clock is not after WarrantyPlan.expires_on; a claim on an EXPIRED plan is admitted only when repair_rounds_used < 3"
        side_effects:
          - "WarrantyPlan.status set to CLAIM_OPEN"
      - from: EXPIRED
        to: CLAIM_OPEN
        trigger: "POST /warranty-claims"
        actor: SupportAgent
        preconditions:
          - "WarrantyPlan.status == EXPIRED"
          - "WarrantyPlan.repair_rounds_used < 3"
        side_effects:
          - "WarrantyPlan.status set to CLAIM_OPEN"
      - from: CLAIM_OPEN
        to: REPAIR_IN_PROGRESS
        trigger: "POST /warranty-claims/{id}/route"
        actor: SupportAgent
        preconditions:
          - "WarrantyClaim.status == PENDING_ROUTING"
          - "ServiceCenter.status of WarrantyClaim.service_center_id == OPEN (cross-entity state dependency on ServiceCenter)"
          - "ServiceCenter.open_ticket_count of WarrantyClaim.service_center_id < ServiceCenter.capacity_slots (aggregate capacity, not pairwise interval)"
          - "WarrantyClaim reported product family is a member of ServiceCenter.accepted_families"
        side_effects:
          - "WarrantyClaim.status set to ROUTED"
          - "WarrantyClaim.routed_at stamped from the logical clock"
          - "ServiceCenter.open_ticket_count incremented by 1 for the routed center"
          - "WarrantyPlan.status set to REPAIR_IN_PROGRESS"
      - from: REPAIR_IN_PROGRESS
        to: CLAIM_OPEN
        trigger: "POST /warranty-claims/{id}/reopen"
        actor: SupportAgent
        preconditions:
          - "WarrantyClaim.status == ROUTED"
          - "the logical clock is not after WarrantyPlan.expires_on"
        side_effects:
          - "WarrantyClaim.status set to PENDING_ROUTING"
          - "WarrantyClaim.routed_at cleared to null"
          - "ServiceCenter.open_ticket_count decremented by 1 for the previously routed center"
          - "WarrantyPlan.status set to CLAIM_OPEN"
      - from: REPAIR_IN_PROGRESS
        to: ACTIVE
        trigger: "POST /warranty-claims/{id}/close"
        actor: SupportAgent
        preconditions:
          - "WarrantyClaim.status == ROUTED"
        side_effects:
          - "WarrantyClaim.status set to CLOSED"
          - "WarrantyClaim.closed_at stamped from the logical clock"
          - "WarrantyPlan.repair_rounds_used incremented by 1 (hop 1 of cascade warranty_rounds_exhaustion)"
          - "WarrantyPlan.remaining_repair_rounds recomputed as max(0, 3 - repair_rounds_used) (hop 2)"
          - "when WarrantyPlan.remaining_repair_rounds == 0 the plan translates to EXPIRED (hop 3)"
          - "ServiceCenter.open_ticket_count decremented by 1 for the routed center (hop 4, transitively consuming the capacity the claim held)"
          - "WarrantyPlan.status set to ACTIVE when remaining_repair_rounds > 0, otherwise EXPIRED"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /warranty-plans/{id}/void"
        actor: PlatformAdmin
        preconditions:
          - "WarrantyPlan.status IN {PENDING, ACTIVE, EXPIRED}"
        side_effects:
          - "WarrantyPlan.status set to VOIDED"
          - "every WarrantyClaim of this plan with status IN {PENDING_ROUTING, ROUTED} moves to CLOSED"

  - entity: InstrumentUnit
    initial_state: PENDING_SETUP
    terminal_states: [SHIPPED]
    shape: branching_with_cycle
    transitions:
      - from: PENDING_SETUP
        to: IN_SETUP
        trigger: "POST /instrument-units/{id}/start-setup"
        actor: SetupTechnician
        preconditions:
          - "InstrumentUnit.setup_status == PENDING_SETUP"
          - "the QuoteLine named by InstrumentUnit.quote_line_id belongs to a Quote with status IN {RESERVED}"
        side_effects:
          - "InstrumentUnit.setup_technician_id set from the acting operator id"
          - "InstrumentUnit.inspection_overall set to PASS (baseline)"
          - "InstrumentUnit.modified_since_setup set to false"
      - from: IN_SETUP
        to: SETUP_COMPLETE
        trigger: "POST /instrument-units/{id}/complete-setup"
        actor: SetupTechnician
        preconditions:
          - "InstrumentUnit.setup_status == IN_SETUP"
          - "the request supplies action_height_mm, relief_mm and intonation_offset_cents"
        side_effects:
          - "InstrumentUnit.action_height_mm, relief_mm, intonation_offset_cents stored from the request"
          - "calculations.instrument_inspection_verdict computed with variant preliminary and stored on InstrumentUnit.inspection_overall"
      - from: SETUP_COMPLETE
        to: INSPECTED
        trigger: "POST /instrument-units/{id}/record-inspection"
        actor: SetupTechnician
        preconditions:
          - "InstrumentUnit.setup_status == SETUP_COMPLETE"
        side_effects:
          - "calculations.instrument_inspection_verdict computed with variant final and stored on InstrumentUnit.inspection_overall"
          - "InstrumentUnit.modified_since_setup set to false"
      - from: INSPECTED
        to: SHIPPED
        trigger: "POST /instrument-units/{id}/ship"
        actor: SetupTechnician | SalesEngineerOps
        preconditions:
          - "InstrumentUnit.setup_status == INSPECTED"
          - "InstrumentUnit.inspection_overall IN {PASS, CONDITIONAL}"
          - "InstrumentUnit.modified_since_setup == false"
          - "the InstrumentUnit's Quote has status == RESERVED (cross-entity state dependency on Quote)"
        side_effects:
          - "InstrumentUnit.shipped_at stamped from the logical clock"
          - "Customer.purchased_instrument_count recomputed for the quote's customer"
      - from: INSPECTED
        to: IN_SETUP
        trigger: "POST /instrument-units/{id}/restart-setup"
        actor: SetupTechnician
        preconditions:
          - "InstrumentUnit.setup_status == INSPECTED"
          - "InstrumentUnit.inspection_overall == FAIL or InstrumentUnit.modified_since_setup == true"
        side_effects:
          - "InstrumentUnit.setup_status set to IN_SETUP and inspection_overall reset to PASS"
          - "InstrumentUnit.modified_since_setup set to false"
      - from: SETUP_COMPLETE
        to: IN_SETUP
        trigger: "POST /instrument-units/{id}/restart-setup"
        actor: SetupTechnician
        preconditions:
          - "InstrumentUnit.setup_status IN {SETUP_COMPLETE, INSPECTED}"
        side_effects:
          - "InstrumentUnit.setup_status set to IN_SETUP"

  - entity: Backorder
    initial_state: PREORDER_PENDING
    terminal_states: [SHIPPED, CANCELLED]
    shape: branching
    transitions:
      - from: PREORDER_PENDING
        to: ALLOCATION_SWEEP
        trigger: "POST /backorders/{id}/start-sweep"
        actor: SalesEngineerOps
        preconditions:
          - "Backorder.status == PREORDER_PENDING"
          - "Backorder.units_filled == 0"
          - "the logical clock is not after Backorder.preorder_open_at + 30 days (preorder expiry window is half-open; at exactly the deadline the preorder is still honored)"
        side_effects:
          - "Backorder.overcommit_estimate_units recomputed with variant preliminary (provisional requirements-first estimate)"
      - from: ALLOCATION_SWEEP
        to: PARTIALLY_FILLED
        trigger: "POST /backorders/{id}/finalize-allocation"
        actor: SalesEngineerOps
        preconditions:
          - "Backorder.status == ALLOCATION_SWEEP"
          - "the final allocation yields 0 < units_filled < units_requested"
        side_effects:
          - "Backorder.units_filled recomputed with variant final (hop 1: the pool_units argument depletes this claim's share)"
          - "when units_filled < units_requested the containing Quote loses its full reservation: Quote.status set to SUBMITTED and Quote.reserved_at cleared (hop 2)"
          - "every other Backorder of the same quote still in PREORDER_PENDING or ALLOCATION_SWEEP is set to CANCELLED (hop 3)"
          - "Backorder.overcommit_estimate_units recomputed with variant provisional"
      - from: ALLOCATION_SWEEP
        to: BOARD_FILLED
        trigger: "POST /backorders/{id}/finalize-allocation"
        actor: SalesEngineerOps
        preconditions:
          - "Backorder.status == ALLOCATION_SWEEP"
          - "the final allocation yields units_filled >= units_requested and units_requested > 0"
        side_effects:
          - "Backorder.units_filled recomputed with variant final"
          - "Backorder.overcommit_estimate_units recomputed with variant provisional"
      - from: PARTIALLY_FILLED
        to: RECEIVING
        trigger: "POST /backorders/{id}/start-receiving"
        actor: SalesEngineerOps
        preconditions:
          - "Backorder.status == PARTIALLY_FILLED"
        side_effects:
          - "Backorder.status set to RECEIVING"
      - from: PARTIALLY_FILLED
        to: ALLOCATION_SWEEP
        trigger: "POST /backorders/{id}/start-sweep"
        actor: SalesEngineerOps
        preconditions:
          - "Backorder.status == PARTIALLY_FILLED"
          - "the logical clock is not after Backorder.preorder_open_at + 30 days"
        side_effects:
          - "Backorder.units_filled reset to 0 before the next sweep"
          - "Backorder.overcommit_estimate_units recomputed with variant preliminary"
      - from: BOARD_FILLED
        to: RECEIVING
        trigger: "POST /backorders/{id}/start-receiving"
        actor: SalesEngineerOps
        preconditions:
          - "Backorder.status == BOARD_FILLED"
        side_effects:
          - "Backorder.status set to RECEIVING"
      - from: RECEIVING
        to: SHIPPED
        trigger: "POST /backorders/{id}/ship"
        actor: SalesEngineerOps
        preconditions:
          - "Backorder.status == RECEIVING"
        side_effects:
          - "Backorder.status set to SHIPPED"
      - from: PREORDER_PENDING
        to: CANCELLED
        trigger: "POST /backorders/{id}/cancel"
        actor: SalesEngineerOps | Engineer
        preconditions:
          - "Backorder.status IN {PREORDER_PENDING, ALLOCATION_SWEEP, PARTIALLY_FILLED, BOARD_FILLED}"
        side_effects:
          - "Backorder.status set to CANCELLED"
      - from: ALLOCATION_SWEEP
        to: PREORDER_PENDING
        trigger: "POST /backorders/{id}/reset-sweep"
        actor: SalesEngineerOps
        preconditions:
          - "Backorder.status IN {ALLOCATION_SWEEP, PARTIALLY_FILLED}"
        side_effects:
          - "Backorder.units_filled reset to 0"
          - "Backorder.overcommit_estimate_units recomputed with variant preliminary"

  - entity: GearExchange
    initial_state: DRAFT
    terminal_states: [EXCHANGED, DENIED, CANCELLED]
    shape: compound
    transitions:
      - from: DRAFT
        to: TRIAL_ACTIVE
        trigger: "POST /gear-exchanges/{id}/start-trial"
        actor: SupportAgent
        preconditions:
          - "GearExchange.status == DRAFT"
          - "the customer's Assignment for GearExchange.customer_id has status ACTIVE"
        side_effects:
          - "GearExchange.trial_start_date stamped from the logical clock"
          - "GearExchange.trial_end_date recomputed as trial_start_date + 14 days"
          - "calculations.gear_exchange_restocking_fee computed with variant provisional and stored on GearExchange"
      - from: TRIAL_ACTIVE
        to: RETURN_REQUESTED
        trigger: "POST /gear-exchanges/{id}/request-return"
        actor: SupportAgent
        preconditions:
          - "GearExchange.status == TRIAL_ACTIVE"
          - "GearExchange.reason == TONE_MISMATCH"
        side_effects:
          - "GearExchange.days_remaining recomputed from the logical clock"
          - "calculations.gear_exchange_restocking_fee recomputed with variant final and stored on GearExchange"
      - from: TRIAL_ACTIVE
        to: DENIED
        trigger: "POST /gear-exchanges/{id}/request-return"
        actor: SupportAgent
        preconditions:
          - "GearExchange.status == TRIAL_ACTIVE"
          - "GearExchange.reason != TONE_MISMATCH"
        side_effects:
          - "GearExchange.days_remaining recomputed from the logical clock"
      - from: RETURN_REQUESTED
        to: EXCHANGED
        trigger: "POST /gear-exchanges/{id}/complete"
        actor: SupportAgent
        preconditions:
          - "GearExchange.status == RETURN_REQUESTED"
          - "the logical clock is not after GearExchange.trial_end_date (the trial window is half-open; at exactly trial_end_date the exchange is still honored)"
        side_effects:
          - "GearExchange.refund_credit_cents recomputed as quote_line.line_total_cents - restocking_fee_cents with variant final"
          - "Customer.lifetime_gear_credit_cents incremented by GearExchange.refund_credit_cents (hop 1 of cascade exchange_credit_conservation)"
          - "GearExchange.restocking_fee_cents credited to Customer.lifetime_gear_credit_cents as a fee offset in the same mutation (hop 2, keeping the conservation invariant exact)"
      - from: RETURN_REQUESTED
        to: TRIAL_ACTIVE
        trigger: "POST /gear-exchanges/{id}/withdraw-return"
        actor: SupportAgent
        preconditions:
          - "GearExchange.status == RETURN_REQUESTED"
          - "the logical clock is not after GearExchange.trial_end_date"
        side_effects:
          - "GearExchange.status set to TRIAL_ACTIVE"
      - from: TRIAL_ACTIVE
        to: CANCELLED
        trigger: "POST /gear-exchanges/{id}/cancel"
        actor: SupportAgent
        preconditions:
          - "GearExchange.status IN {DRAFT, TRIAL_ACTIVE, RETURN_REQUESTED}"
        side_effects:
          - "GearExchange.status set to CANCELLED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /gear-exchanges/{id}/cancel"
        actor: SupportAgent
        preconditions:
          - "GearExchange.status IN {DRAFT, TRIAL_ACTIVE, RETURN_REQUESTED}"
        side_effects:
          - "GearExchange.status set to CANCELLED"

  - entity: SupportTicket
    initial_state: OPEN
    terminal_states: [RESOLVED]
    shape: linear_with_escalation
    transitions:
      - from: OPEN
        to: IN_TRIAGE
        trigger: "POST /support-tickets/{id}/triage"
        actor: SupportAgent
        preconditions:
          - "SupportTicket.status == OPEN"
          - "Customer.tech_support_entitlement of SupportTicket.customer_id IN {BASIC, EXTENDED}"
        side_effects:
          - "SupportTicket.required_entitlement recomputed: EXTENDED when the customer has at least one WarrantyPlan with status IN {ACTIVE, CLAIM_OPEN, REPAIR_IN_PROGRESS}, otherwise BASIC"
      - from: IN_TRIAGE
        to: ESCALATED
        trigger: "POST /support-tickets/{id}/escalate"
        actor: SupportAgent
        preconditions:
          - "SupportTicket.status == IN_TRIAGE"
          - "SupportTicket.required_entitlement == EXTENDED"
          - "SupportTicket.service_center_id names a ServiceCenter (the escalation desk)"
        side_effects:
          - "SupportTicket.escalated_at stamped from the logical clock"
          - "SupportTicket.escalated_by set from the acting operator id"
          - "SupportTicket.escalation_seq set to 1 + max(EscalationLedger.escalation_seq) over this support_ticket_id (hop 2 of cascade assignment_entitlement_escalation)"
          - "one EscalationLedger row appended with event_type SERVICE_DEPARTMENT_ESCALATION, service_center_id from the ticket, and the assigned escalation_seq (hop 3)"
          - "ServiceCenter.open_ticket_count incremented by 1 for that service center (hop 4)"
          - "SupportTicket.escalation_count incremented by 1"
      - from: ESCALATED
        to: IN_TRIAGE
        trigger: "POST /support-tickets/{id}/de-escalate"
        actor: ServiceDepartment
        preconditions:
          - "SupportTicket.status == ESCALATED"
        side_effects:
          - "SupportTicket.escalated_at cleared to null"
          - "one EscalationLedger row appended with event_type ESCALATION_WITHDRAWN"
          - "ServiceCenter.open_ticket_count decremented by 1 for the ticket's named center"
      - from: IN_TRIAGE
        to: RESOLVED
        trigger: "POST /support-tickets/{id}/resolve"
        actor: SupportAgent
        preconditions:
          - "SupportTicket.status == IN_TRIAGE"
        side_effects:
          - "SupportTicket.status set to RESOLVED"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /support-tickets/{id}/resolve"
        actor: ServiceDepartment
        preconditions:
          - "SupportTicket.status IN {IN_TRIAGE, ESCALATED}"
        side_effects:
          - "SupportTicket.status set to RESOLVED"
          - "ServiceCenter.open_ticket_count decremented by 1 for the ticket's named center when the ticket was ESCALATED"

  - entity: Customer
    initial_state: PENDING
    terminal_states: [CLOSED]
    shape: branching
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /customers/{id}/activate"
        actor: SalesEngineerOps
        preconditions:
          - "Customer.status == PENDING"
        side_effects:
          - "Customer.assigned_engineer_id left null until an Assignment becomes ACTIVE"
      - from: ACTIVE
        to: PENDING
        trigger: "POST /customers/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Customer.status == ACTIVE"
        side_effects:
          - "every Assignment for this customer_id with status IN {PENDING_ACCEPT, ACTIVE} moves to ENDED"
          - "Engineer.active_book_size decremented by 1 for each such Assignment's engineer"
          - "Customer.assigned_engineer_id set to null"
      - from: PENDING
        to: CLOSED
        trigger: "POST /customers/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "Customer.status IN {PENDING, ACTIVE}"
        side_effects:
          - "Customer.status set to CLOSED"
          - "every Assignment for this customer_id still ACTIVE moves to ENDED and Engineer.active_book_size is decremented for each holder"
          - "Customer.assigned_engineer_id set to null"

  - entity: CertificationAttempt
    initial_state: SCHEDULED
    terminal_states: [EXPIRED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /certification-attempts/{id}/grade"
        actor: SalesEngineerOps
        preconditions:
          - "CertificationAttempt.status == SCHEDULED"
          - "CertificationAttempt.score_pct >= 80"
        side_effects:
          - "CertificationAttempt.certified set to true"
          - "CertificationAttempt.assessed_at stamped from the logical clock"
          - "CertificationAttempt.expires_at recomputed as assessed_at + 12 months"
          - "Engineer.certified_family_count recomputed for the engineer"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /certification-attempts/{id}/grade"
        actor: SalesEngineerOps
        preconditions:
          - "CertificationAttempt.status == SCHEDULED"
          - "CertificationAttempt.score_pct < 80"
        side_effects:
          - "CertificationAttempt.certified set to false"
          - "CertificationAttempt.attempt_index recomputed as 1 + count of prior CertificationAttempt rows for the same (engineer_id, product_family)"
          - "CertificationAttempt.eligible_to_retake set to false when attempt_index >= 3"
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /certification-attempts/{id}/reschedule"
        actor: SalesEngineerOps
        preconditions:
          - "CertificationAttempt.status == FAILED"
          - "CertificationAttempt.eligible_to_retake == true"
        side_effects:
          - "CertificationAttempt.score_pct cleared to null"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-reserve-stale-quote
    parent_entity: Quote
    write_endpoint: "POST /quotes/{id}/reserve"
    occ_field: "expected_quote_version"
    description: |
      Reserving a Quote whose version has advanced since the client last
      observed it is rejected. This captures the case where an amend that
      legitimately returns the quote to SUBMITTED has bumped its version, so
      the current writer's view of the quote is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: assignment-create-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /assignments"
    occ_field: "expected_customer_version"
    description: |
      Creating a new Assignment against a Customer whose version has advanced
      since the client last observed it is rejected, capturing the case where
      another writer has already ended the customer's prior ACTIVE Assignment
      (which bumps Customer.assigned_engineer_id and Customer.version), so the
      current writer's view of the customer's book is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: engineer_commission_cents
    trigger: "Quote.transitions.DRAFT_to_SUBMITTED stores the provisional value; InstrumentUnit.transitions.INSPECTED_to_SHIPPED recomputes the final value once every QuoteLine of the quote is SHIPPED"
    algorithm: dual_variant
    formula: |
      pool_cents = round_half_up(quote.gross_subtotal_cents * COMMISSION_POOL_BPS / 10000, 2)
      share_bps = min(assignment.commission_share_bps, engineer.commission_cap_bps)
      # variant provisional: the full-pool share, applied when the quote is authored
      provisional_cents = round_half_up(pool_cents * share_bps / 10000, 2)
      # variant final: the pool is prorated by the fraction of line value actually shipped
      shipped_value_cents = sum(line.line_total_cents for line in quote.lines if line.instrument_shipped)
      final_cents = round_half_up(pool_cents * share_bps / 10000 * shipped_value_cents / quote.gross_subtotal_cents, 2)
    input_set: "All QuoteLine rows of the quote; the final variant counts only lines whose InstrumentUnit.setup_status == SHIPPED"
    constants:
      COMMISSION_POOL_BPS: 800
    precision: "2 decimal places applied to the cent value, round_half_up; share basis points are integers and are never floored per line"
    variants:
      - name: provisional
        when: "quote is SUBMITTED and no instrument has shipped yet"
        difference: "credits the engineer the full pool share before shipment, so it exceeds the final variant whenever any line remains unshipped"
      - name: final
        when: "every QuoteLine of the quote has a shipped InstrumentUnit"
        difference: "prorates the pool by shipped line value, so identical quote data yields a strictly smaller number than the provisional variant whenever shipped_value_cents < gross_subtotal_cents"

  - name: warranty_service_fee_cents
    trigger: "WarrantyPlan.transitions.CLAIM_OPEN_to_REPAIR_IN_PROGRESS stores the provisional value; WarrantyPlan.transitions.REPAIR_IN_PROGRESS_to_ACTIVE recomputes the final value on claim close"
    algorithm: dual_variant
    formula: |
      # variant provisional: per-round bench fee, charged when a claim opens
      provisional_cents = BASE_ROUND_FEE_CENTS * (warranty_plan.repair_rounds_used + 1)
      # variant final: term-scaled flat service fee, charged when the claim closes
      final_cents = round_half_up(BASE_ROUND_FEE_CENTS * warranty_plan.term_months / 24, 2)
    input_set: "The WarrantyPlan of the WarrantyClaim; repair_rounds_used is read before the closing transition increments it"
    constants:
      BASE_ROUND_FEE_CENTS: 2500
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "a claim routes against the plan (WarrantyClaim moves PENDING_ROUTING -> ROUTED)"
        difference: "grows with each successive repair round and ignores term_months"
      - name: final
        when: "the claim closes and the plan returns to ACTIVE or expires"
        difference: "is term-scaled and round-count-independent, so on a 36-month plan it exceeds a first-round provisional by exactly 1250 cents"

  - name: package_bundle_price_cents
    trigger: "POST /quotes/{id}/submit recomputes the quote package price"
    algorithm: combinatorial_nested
    formula: |
      # pinned evaluation order (the tier is keyed on a subtotal that the line
      # discounts already reduced; the order below is normative):
      #   step 1 - per-unit line price
      #   step 2 - sum reduced line totals into subtotal_cents
      #   step 3 - choose tier_bps from subtotal_cents
      #   step 4 - apply tier_bps once to subtotal_cents
      line_unit_cents = round_half_up(product.unit_price_cents * (10000 - SYSTEM_LINE_DISCOUNT_BPS) / 10000, 2)
      subtotal_cents = sum(line.quantity * line_unit_cents for line in quote.lines)
      tier_bps = TIER_HIGH_BPS if subtotal_cents >= TIER_HIGH_CENTS else (TIER_MID_BPS if subtotal_cents >= TIER_MID_CENTS else 0)
      package_bundle_price_cents = round_half_up(subtotal_cents * (10000 - tier_bps) / 10000, 2)
    input_set: "Only quotes with package_type == SYSTEM_PACKAGE receive the line discount (SYSTEM_LINE_DISCOUNT_BPS); INSTRUMENT_ONLY and ACCESSORY_ONLY quotes skip step 1 and use raw unit_price_cents"
    constants:
      SYSTEM_LINE_DISCOUNT_BPS: 6667
      TIER_HIGH_CENTS: 500000
      TIER_HIGH_BPS: 1000
      TIER_MID_CENTS: 200000
      TIER_MID_BPS: 500
    precision: "2 decimal places, round_half_up, applied per unit in step 1 and once more in step 4"
    variants:
      - name: subtotal_then_tier
        when: "always — the pinned order"
        difference: "keys the tier on the already-discounted subtotal, so a package that would have crossed TIER_MID_CENTS at raw prices stays in the lower tier"

  - name: instrument_inspection_verdict
    trigger: "InstrumentUnit.transitions.IN_SETUP_to_SETUP_COMPLETE stores the provisional value; InstrumentUnit.transitions.SETUP_COMPLETE_to_INSPECTED recomputes the final value"
    algorithm: combinatorial_nested
    formula: |
      # per-measurement checks are rounded first, then folded (pinned order)
      action_ok = 0.50 <= round_half_up(instrument.action_height_mm, 2) <= 2.00
      relief_ok = round_half_up(instrument.relief_mm, 2) >= 0.05
      intonation_ok = abs(instrument.intonation_offset_cents) <= 5
      checks_passed = (1 if action_ok else 0) + (1 if relief_ok else 0) + (1 if intonation_ok else 0)
      # variant preliminary (at SETUP_COMPLETE)
      preliminary = PASS if checks_passed == 3 else (CONDITIONAL if checks_passed == 2 else FAIL)
      # variant final (at INSPECTED) — a failed intonation check is disqualifying
      final = PASS if checks_passed == 3 else (CONDITIONAL if checks_passed == 2 and intonation_ok else FAIL)
    input_set: "The three stored measurements on the InstrumentUnit at the instant of evaluation"
    constants:
      ACTION_MIN_MM: 0.50
      ACTION_MAX_MM: 2.00
      RELIEF_MIN_MM: 0.05
      INTONATION_TOLERANCE_CENTS: 5
    precision: "measurements rounded to 2 decimal places before comparison; the verdict itself is an enum"
    variants:
      - name: preliminary
        when: "bench setup completes, before the recorded inspection pass"
        difference: "returns CONDITIONAL for any two-of-three pass, including when the failing check is intonation"
      - name: final
        when: "the inspection is recorded"
        difference: "returns FAIL when two checks pass but intonation is the one that failed, so a 2-of-3 instrument can be CONDITIONAL pre-inspection and FAIL after"

  - name: backorder_allocation_units
    trigger: "Backorder.transitions.PREORDER_PENDING_to_ALLOCATION_SWEEP recomputes Backorder.overcommit_estimate_units; Backorder.transitions.ALLOCATION_SWEEP_to_PARTIALLY_FILLED and ALLOCATION_SWEEP_to_BOARD_FILLED recompute Backorder.units_filled"
    algorithm: waterfall_allocation
    formula: |
      pool_units = total units received into the shared pool for this backorder group
      ordered = backorders sorted by alloc_sequence ASC, then by preorder_open_at ASC, then by created_at ASC
      # variant preliminary (overcommit_estimate_units): each backorder is
      #   measured against the pool independently, so the estimates may sum
      #   above pool_units
      overcommit_estimate_units = min(units_requested, pool_units)
      # variant final (units_filled): a single pass that depletes the pool
      remaining = pool_units
      for bo in ordered:
          granted = min(bo.units_requested, remaining)
          bo.units_filled = granted
          remaining = remaining - granted
    input_set: "Backorders for the same product, status IN {ALLOCATION_SWEEP, PARTIALLY_FILLED, BOARD_FILLED}; CANCELLED and SHIPPED rows are excluded"
    constants:
      OVERCOMMIT_ALLOWED: true
    precision: "integer units; no fraction of a unit is ever allocated"
    variants:
      - name: preliminary
        when: "the sweep starts"
        difference: "gives every backorder its own view of the pool, so the estimates total more than the pool while the final variant conserves it"
      - name: final
        when: "the allocation is finalized"
        difference: "walks alloc_sequence ASC and stops once the pool is exhausted, so later backorders receive strictly less than their preliminary estimate"

  - name: gear_exchange_restocking_fee
    trigger: "GearExchange.transitions.DRAFT_to_TRIAL_ACTIVE stores the provisional value; GearExchange.transitions.TRIAL_ACTIVE_to_RETURN_REQUESTED recomputes the final value"
    algorithm: combinatorial_nested
    formula: |
      base_bps = currency_bps(gear_exchange.reason)      # TONE_MISMATCH 1500, DEFECT_DOA 0, WRONG_MODEL 800, CHANGED_MIND 2500
      tier_adjust_bps = tier_bps(customer.account_tier)  # STANDARD 0, PREMIUM -500, STUDIO -1000
      days_bps = NEAR_EXPIRY_BPS if gear_exchange.days_remaining < NEAR_EXPIRY_DAYS else 0
      effective_bps = max(0, base_bps + tier_adjust_bps + days_bps)
      # variant provisional: reason rate only, evaluated before tier/days are known
      provisional_cents = round_half_up(quote_line.line_total_cents * base_bps / 10000, 2)
      # variant final: full composed rate
      final_cents = round_half_up(quote_line.line_total_cents * effective_bps / 10000, 2)
    input_set: "The GearExchange and its owning QuoteLine and Customer; DEFECT_DOA always yields effective_bps 0"
    constants:
      REASON_BPS_TONE_MISMATCH: 1500
      REASON_BPS_DEFECT_DOA: 0
      REASON_BPS_WRONG_MODEL: 800
      REASON_BPS_CHANGED_MIND: 2500
      TIER_ADJUST_BPS_STANDARD: 0
      TIER_ADJUST_BPS_PREMIUM: -500
      TIER_ADJUST_BPS_STUDIO: -1000
      NEAR_EXPIRY_DAYS: 3
      NEAR_EXPIRY_BPS: 500
    precision: "integer cents, round_half_up, applied once to the line total"
    variants:
      - name: provisional
        when: "the trial starts"
        difference: "charges the raw reason rate with no tier discount and no near-expiry surcharge"
      - name: final
        when: "the return is requested"
        difference: "folds tier discount and near-expiry surcharge into one rate, so a STUDIO customer returning at TONE_MISMATCH pays 500 bps rather than the provisional 1500 bps"

  - name: customer_tech_support_entitlement
    trigger: "Assignment.transitions.PENDING_ACCEPT_to_ACTIVE and Assignment.transitions.ACTIVE_to_ENDED recompute Customer.tech_support_entitlement"
    algorithm: weighted_scoring
    formula: |
      has_active_assignment = exists Assignment where customer_id == customer.id and status == ACTIVE
      has_warranty_in_force = exists WarrantyPlan where customer_id == customer.id and status IN {ACTIVE, CLAIM_OPEN, REPAIR_IN_PROGRESS}
      entitlement = EXTENDED if has_warranty_in_force else (BASIC if (has_active_assignment and customer.purchased_instrument_count >= 1) else NONE)
    input_set: "The customer's Assignment rows with status ACTIVE and WarrantyPlan rows with status IN {ACTIVE, CLAIM_OPEN, REPAIR_IN_PROGRESS}"
    constants:
      MIN_PURCHASES_FOR_BASIC: 1
    precision: "enum output; no rounding"
    variants:
      - name: assignment_backed
        when: "no warranty is in force"
        difference: "requires both an ACTIVE Assignment and at least one shipped instrument to reach BASIC, and drops to NONE the moment the assignment ends"

  - name: engineer_seniority_tier
    trigger: "CertificationAttempt.transitions.SCHEDULED_to_PASSED and SCHEDULED_to_FAILED recompute Engineer.seniority_tier and Engineer.commission_cap_bps"
    algorithm: threshold
    formula: |
      certified = engineer.certified_family_count
      if certified >= TIER_3_MIN: tier, cap_bps = TIER_3, 7500
      elif certified >= TIER_2_MIN: tier, cap_bps = TIER_2, 6500
      else: tier, cap_bps = TIER_1, 5000
    input_set: "CertificationAttempt rows for the engineer with certified == true and expires_at after the logical clock"
    constants:
      TIER_2_MIN: 2
      TIER_3_MIN: 4
    precision: "enum output; caps are integer basis points"
    variants:
      - name: certification_gated
        when: "always"
        difference: "an expired certification (expires_at at or before the logical clock) is excluded from certified_family_count, so the tier can fall back down"

  - name: quote_dependency_closure_size
    trigger: "POST /quotes/{id}/lines and POST /quotes/{id}/submit recompute Quote.dependency_closure_size and Quote.bundle_ready"
    algorithm: topological
    formula: |
      anchor = the single QuoteLine of the quote with is_anchor == true
      closure = {anchor}
      frontier = [anchor]
      while frontier:
          line = frontier.pop()
          for candidate in quote.lines:
              if candidate.requires_line_id == line.id and candidate not in closure:
                  closure.add(candidate); frontier.append(candidate)
      dependency_closure_size = len(closure)
      bundle_ready = (all(line.requires_line_id is null or line.requires_line_id in quote.lines for line in closure)
                      and all(product.required_family is null or any(member.product_family == product.required_family for member in closure) for product in closure.products))
    input_set: "The quote's own QuoteLine rows only; a requires_line_id pointing outside the quote makes bundle_ready false"
    constants:
      REQUIRE_ANCHOR: true
    precision: "integer count; a cycle among requires_line_id edges raises ERR_DEPENDENCY_CYCLE instead of returning a size"
    variants:
      - name: anchored
        when: "the quote has exactly one is_anchor line"
        difference: "closure is measured from the anchor, so lines that depend on nothing and nothing depends on are excluded from the size even though they are quoted"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present on every authenticated endpoint"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except GET /health, POST /products, POST /service-centers, POST /engineers, POST /customers"
  - priority: 2
    category: auth
    check: "the acting X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints with a restricted role list"
  - priority: 3
    category: existence
    check: "every path-segment resource exists, validated left-to-right; a missing Customer raises ERR_CUSTOMER_NOT_FOUND, a missing Quote raises ERR_QUOTE_NOT_FOUND, a missing Engineer raises ERR_ENGINEER_NOT_FOUND, a missing InstrumentUnit raises ERR_INSTRUMENT_UNIT_NOT_FOUND"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying an id path segment"
  - priority: 4
    category: existence
    check: "every referenced resource named in the request body exists (product_code resolves to a Product, service_center_id to a ServiceCenter, requires_line_id to a QuoteLine of the same quote)"
    error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /quotes/{id}/lines, POST /warranty-claims, POST /backorders"
  - priority: 5
    category: state
    check: "the target resource is in a state admitted by the transition's from: set"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /{id}/<action> transition endpoints"
  - priority: 6
    category: business_safety
    check: "an InstrumentUnit may only be shipped when inspection_overall IN {PASS, CONDITIONAL} and modified_since_setup == false; a FAIL verdict or a post-inspection measurement edit blocks shipment"
    error_id: ERR_INSPECTION_NOT_PASSED
    http_status: 422
    applies_to: "POST /instrument-units/{id}/ship"
  - priority: 7
    category: business_constraint
    check: "a quote line's requires_line_id must resolve within the same quote and the dependency edges must be acyclic; a cycle raises ERR_DEPENDENCY_CYCLE and a dangling edge raises ERR_DEPENDENCY_MISSING"
    error_id: ERR_DEPENDENCY_CYCLE
    http_status: 422
    applies_to: "POST /quotes/{id}/lines, POST /quotes/{id}/submit"
  - priority: 8
    category: business_referential
    check: "the customer has an Assignment with status ACTIVE whose engineer_id equals the quote's engineer_id; a quote cannot be submitted or reserved on an unassigned or reassigned account"
    error_id: ERR_CUSTOMER_ASSIGNMENT_REQUIRED
    http_status: 422
    applies_to: "POST /quotes/{id}/submit, POST /quotes/{id}/reserve, POST /gear-exchanges/{id}/start-trial"
  - priority: 9
    category: business_constraint
    check: "an Engineer's active_book_size must remain below max_book_size; accepting or reopening an assignment that would reach max_book_size or beyond is rejected"
    error_id: ERR_BOOK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /assignments/{id}/accept, POST /assignments/{id}/reopen"
  - priority: 10
    category: business_constraint
    check: "a serial_number may back at most one InstrumentUnit"
    error_id: ERR_SERIAL_ALREADY_REGISTERED
    http_status: 409
    applies_to: "POST /instrument-units"
  - priority: 11
    category: business_temporal
    check: "the requested assignment coverage window [assigned_at, effective_until) must not overlap the half-open interval [assigned_at, ended_at) of any ENDED Assignment for the same customer that has a later sequence value; adjacency at an identical instant is permitted"
    error_id: ERR_ASSIGNMENT_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /assignments, POST /assignments/{id}/reopen"
  - priority: 12
    category: business_temporal
    check: "a backorder sweep must start on or before preorder_open_at + 30 days; at exactly the deadline the sweep is still admitted"
    error_id: ERR_PREORDER_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /backorders/{id}/start-sweep"
  - priority: 13
    category: business_temporal
    check: "a gear exchange may only complete on or before trial_end_date; at exactly trial_end_date the exchange is still admitted, past it the exchange is rejected"
    error_id: ERR_TRIAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /gear-exchanges/{id}/complete"
  - priority: 14
    category: business_constraint
    check: "a backorder must request at least one unit; units_requested == 0 defines an empty candidate set and is rejected rather than returning an empty allocation"
    error_id: ERR_ZERO_ALLOCATION_REQUEST
    http_status: 422
    applies_to: "POST /backorders"
  - priority: 15
    category: business_constraint
    check: "a warranty claim requires remaining_repair_rounds > 0; a plan whose remaining_repair_rounds is exactly 0 admits no further claim"
    error_id: ERR_REPAIR_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /warranty-claims"
  - priority: 16
    category: business_fiscal
    check: "an Assignment's commission_share_bps must not exceed the engineer's commission_cap_bps; at exactly commission_cap_bps the share is admitted, one basis point above it is rejected"
    error_id: ERR_COMMISSION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /assignments"
  - priority: 17
    category: business_constraint
    check: "an instrument may only ship while its owning Quote is RESERVED; an instrument whose quote has been amended back to SUBMITTED is held at the bench"
    error_id: ERR_QUOTE_NOT_RESERVED
    http_status: 409
    applies_to: "POST /instrument-units/{id}/ship"
  - priority: 18
    category: business_referential
    check: "a warranty claim may only route to a service center whose accepted_families contains the reported product family"
    error_id: ERR_SERVICE_CENTER_FAMILY_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/route"
  - priority: 19
    category: existence
    check: "a missing WarrantyPlan path segment raises ERR_WARRANTY_PLAN_NOT_FOUND"
    error_id: ERR_WARRANTY_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /warranty-plans/{id}/activate, POST /warranty-plans/{id}/void"
  - priority: 20
    category: existence
    check: "a missing Backorder path segment raises ERR_BACKORDER_NOT_FOUND"
    error_id: ERR_BACKORDER_NOT_FOUND
    http_status: 404
    applies_to: "all /backorders/{id}/<action> endpoints"
  - priority: 21
    category: existence
    check: "a missing GearExchange path segment raises ERR_GEAR_EXCHANGE_NOT_FOUND"
    error_id: ERR_GEAR_EXCHANGE_NOT_FOUND
    http_status: 404
    applies_to: "all /gear-exchanges/{id}/<action> endpoints"
  - priority: 22
    category: state
    check: "an action on a resource already in a terminal state (SHIPPED, CANCELLED, EXCHANGED, DENIED, RESOLVED, VOIDED, CLOSED) raises ERR_ALREADY_TERMINAL"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all /{id}/<action> transition endpoints whose entity has terminal_states"
  - priority: 23
    category: auth
    check: "a required request-body field is absent, raising ERR_MISSING_REQUIRED_FIELD rather than a state error"
    error_id: ERR_MISSING_REQUIRED_FIELD
    http_status: 400
    applies_to: "all POST endpoints with required input fields"
  - priority: 24
    category: business_constraint
    check: "a field value outside its declared enum or numeric range (term_months not in {12,24,36}, score_pct outside 0..100, quantity below 1) raises ERR_INVALID_FIELD_VALUE"
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 400
    applies_to: "POST /warranty-plans, POST /certification-attempts, POST /quotes/{id}/lines"
  - priority: 25
    category: business_constraint
    check: "triage requires the customer's purchase-history entitlement to be at least BASIC; NONE raises ERR_ENTITLEMENT_REQUIRED"
    error_id: ERR_ENTITLEMENT_REQUIRED
    http_status: 403
    applies_to: "POST /support-tickets/{id}/triage"
  - priority: 26
    category: business_constraint
    check: "escalation requires the ticket to name an escalation service center, otherwise ERR_ESCALATION_DESK_REQUIRED"
    error_id: ERR_ESCALATION_DESK_REQUIRED
    http_status: 422
    applies_to: "POST /support-tickets/{id}/escalate"
  - priority: 27
    category: business_constraint
    check: "escalation requires the named escalation desk to have a free slot; a full desk raises ERR_SERVICE_CENTER_CAPACITY_FULL_AT_ESCALATION"
    error_id: ERR_SERVICE_CENTER_CAPACITY_FULL_AT_ESCALATION
    http_status: 422
    applies_to: "POST /support-tickets/{id}/escalate"
  - priority: 28
    category: business_constraint
    check: "a failed certification attempt that already reached attempt_index 3 cannot be rescheduled, raising ERR_RETAKE_NOT_ELIGIBLE"
    error_id: ERR_RETAKE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /certification-attempts/{id}/reschedule"
  - priority: 29
    category: business_constraint
    check: "a non-TONE_MISMATCH return request is denied with ERR_RETURN_REASON_NOT_ELIGIBLE rather than silently accepted"
    error_id: ERR_RETURN_REASON_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /gear-exchanges/{id}/request-return"
  - priority: 30
    category: business_fiscal
    check: "an allocation call with a negative pool raises ERR_ALLOCATION_POOL_NEGATIVE before any waterfall walk"
    error_id: ERR_ALLOCATION_POOL_NEGATIVE
    http_status: 422
    applies_to: "POST /backorders/{id}/start-sweep, POST /backorders/{id}/finalize-allocation"
  - priority: 31
    category: existence
    check: "an unknown Engineer path segment raises ERR_ENGINEER_NOT_FOUND"
    error_id: ERR_ENGINEER_NOT_FOUND
    http_status: 404
    applies_to: "GET /engineers/{id}"
  - priority: 32
    category: existence
    check: "an unknown Quote path segment raises ERR_QUOTE_NOT_FOUND"
    error_id: ERR_QUOTE_NOT_FOUND
    http_status: 404
    applies_to: "GET /quotes/{id}, POST /quotes/{id}/submit"
  - priority: 33
    category: existence
    check: "an unknown InstrumentUnit path segment raises ERR_INSTRUMENT_UNIT_NOT_FOUND"
    error_id: ERR_INSTRUMENT_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /instrument-units/{id}"
  - priority: 34
    category: state
    check: "an expected_quote_version or expected_customer_version that does not match the parent's current version raises ERR_STALE_VERSION"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /quotes/{id}/reserve, POST /assignments"
  - priority: 35
    category: business_constraint
    check: "reason_code TEMPORARY_COVERAGE requires effective_until while a non-temporary reason must not carry one, otherwise ERR_TEMPORARY_COVERAGE_UNTIL_REQUIRED"
    error_id: ERR_TEMPORARY_COVERAGE_UNTIL_REQUIRED
    http_status: 422
    applies_to: "POST /assignments"
  - priority: 36
    category: business_constraint
    check: "routing a claim to a service center whose open_ticket_count has reached capacity_slots raises ERR_SERVICE_CENTER_CAPACITY_FULL"
    error_id: ERR_SERVICE_CENTER_CAPACITY_FULL
    http_status: 422
    applies_to: "POST /warranty-claims/{id}/route"
  - priority: 37
    category: state
    check: "routing a claim to a service center whose status is SUSPENDED raises ERR_SERVICE_CENTER_SUSPENDED"
    error_id: ERR_SERVICE_CENTER_SUSPENDED
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/route"
  - priority: 38
    category: business_referential
    check: "escalating a ticket whose required_entitlement is BASIC raises ERR_ESCALATION_NOT_PERMITTED"
    error_id: ERR_ESCALATION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /support-tickets/{id}/escalate"
  - priority: 39
    category: business_constraint
    check: "a quote whose requires_line_id dangles outside the quote or whose bundle_ready is false at submit raises ERR_DEPENDENCY_MISSING"
    error_id: ERR_DEPENDENCY_MISSING
    http_status: 422
    applies_to: "POST /quotes/{id}/submit"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving / configuration surface ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Server default before any call is 2026-09-01T00:00:00Z; the clock never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
  - method: POST
    path: "/engineers"
    description: "Create a sales engineer"
    roles: [PlatformAdmin, SalesEngineerOps]
    code: 201
    input: [full_name, email, region, "max_book_size?"]
    output: Engineer
    side_effects: ["Engineer.seniority_tier recomputed via calculations.engineer_seniority_tier"]
  - method: POST
    path: "/customers"
    description: "Register a customer account"
    roles: [Anonymous, SalesEngineerOps]
    code: 201
    input: [full_name, email, home_state, "account_tier?"]
    output: Customer
  - method: POST
    path: "/products"
    description: "Register a catalog product"
    roles: [PlatformAdmin]
    code: 201
    input: [product_code, display_name, product_family, unit_price_cents, "required_family?", "requires_certification?", "in_catalog?"]
    output: Product
  - method: POST
    path: "/service-centers"
    description: "Register a repair service center"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region, capacity_slots, accepted_families]
    output: ServiceCenter
  - method: POST
    path: "/service-centers/{id}/suspend"
    description: "Suspend a service center so it accepts no further claim routes"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ServiceCenter
    side_effects: ["ServiceCenter.status -> SUSPENDED"]
  - method: POST
    path: "/service-centers/{id}/reopen"
    description: "Return a suspended service center to service"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ServiceCenter
    side_effects: ["ServiceCenter.status -> OPEN"]
  # ---- reads / reverse-reachability ----
  - method: GET
    path: "/engineers/{id}"
    description: "Fetch one engineer"
    roles: [PlatformAdmin, SalesEngineerOps, Anonymous]
    code: 200
    input: []
    output: Engineer
  - method: GET
    path: "/engineers"
    description: "List engineers"
    roles: [PlatformAdmin, SalesEngineerOps, Anonymous]
    code: 200
    input: ["region?", "status?", "limit?", "offset?"]
    output: Engineer[]
  - method: GET
    path: "/customers/{id}"
    description: "Fetch one customer"
    roles: [PlatformAdmin, SalesEngineerOps, SupportAgent, Anonymous]
    code: 200
    input: []
    output: Customer
  - method: GET
    path: "/customers"
    description: "List customers"
    roles: [PlatformAdmin, SalesEngineerOps, SupportAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Customer[]
  - method: GET
    path: "/products"
    description: "List catalog products"
    roles: [PlatformAdmin, SalesEngineerOps, Engineer, Anonymous]
    code: 200
    input: ["product_family?", "in_catalog?", "limit?", "offset?"]
    output: Product[]
  - method: GET
    path: "/service-centers"
    description: "List service centers"
    roles: [PlatformAdmin, SupportAgent, SalesEngineerOps]
    code: 200
    input: ["region?", "status?", "limit?", "offset?"]
    output: ServiceCenter[]
  - method: GET
    path: "/assignments/{id}"
    description: "Fetch one assignment"
    roles: [PlatformAdmin, SalesEngineerOps, Engineer]
    code: 200
    input: []
    output: Assignment
  - method: GET
    path: "/assignments"
    description: "List assignments, filterable by engineer book or customer"
    roles: [PlatformAdmin, SalesEngineerOps, Engineer]
    code: 200
    input: ["engineer_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
  - method: GET
    path: "/quotes/{id}"
    description: "Fetch one quote"
    roles: [PlatformAdmin, SalesEngineerOps, Engineer]
    code: 200
    input: []
    output: Quote
  - method: GET
    path: "/quotes"
    description: "List quotes"
    roles: [PlatformAdmin, SalesEngineerOps, Engineer]
    code: 200
