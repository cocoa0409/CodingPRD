            - call: "POST /pilgrims/${pil_x_id}/payments"
              payload: { amount_cents: 200000, method: "ACH" }
              as: FinanceController
            - call: "POST /pilgrims/${pil_y_id}/payments"
              payload: { amount_cents: 200000, method: "ACH" }
              as: FinanceController
            - call: "POST /pilgrims/${pil_x_id}/rooming"
