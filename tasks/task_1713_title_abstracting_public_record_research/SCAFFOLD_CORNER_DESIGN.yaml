scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: order_creation_applies_defaults_and_computed_fields
        claim_type: creation
        grounds:
          - entities.AbstractOrder
          - calculations.order_fee_provisional
          - calculations.sla_due_and_late_credit
          - calculations.liability_cap
        distinguishing_aspect: "A STANDARD order created without sla_tier/liability_tier applies both defaults and computes all derived fields at creation under the default logical clock."
        test_recipe:
          setup: ["empty database; logical clock unset (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_801", property_address: "10 Cedar St", county: "Travis", state_code: "TX", legal_description_text: "LOT 1 BLK A", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_801
              captures: { ord: $.data.id, v: $.data.version }
          assert:
            - "response data.sla_tier == STANDARD and data.liability_tier == STANDARD (defaults applied)"
            - "response data.status == RECEIVED and data.version == 1"
            - "response data.received_at == 2026-08-01T00:00:00Z (logical clock default)"
            - "response data.due_at == 2026-08-04T00:00:00Z (received + 72h STANDARD)"
            - "response data.scope_start_date == 1996-01-15"
            - "response data.provisional_fee_cents == 60000 (40000 + 8*2500, no premium)"
            - "response data.accrued_fees_cents == 40000 and data.liability_cap_cents == 120000 (min(3*40000, 200000))"
            - "response data.open_curative_count == 0, data.legal_hold == false, data.is_overdue == false, data.final_fee_cents == null"

      - name: order_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.AbstractOrder.fields.provisional_fee_cents
        distinguishing_aspect: "Client-supplied values for computed fields are ignored: the server computes provisional_fee_cents from constants regardless of the request body."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_802", property_address: "11 Cedar St", county: "Travis", state_code: "TX", legal_description_text: "LOT 2 BLK A", search_period_years: 30, effective_date: "2026-01-15", provisional_fee_cents: 1 }
              as: Client
              as_user_id: client_802
              captures: { prov: $.data.provisional_fee_cents }
          assert:
            - "HTTP 201 and captured prov == 60000 (client-supplied 1 ignored)"

      - name: order_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting required field county yields ERR_VALIDATION (400) before any existence or state check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_803", property_address: "12 Cedar St", state_code: "TX", legal_description_text: "LOT 3 BLK A", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_803
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_VALIDATION and HTTP status == 400"

      - name: order_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_ORDER_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent order UUID yields ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/abstract-orders/00000000-0000-4000-8000-000000000000"
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_ORDER_NOT_FOUND and HTTP status == 404"

      - name: record_document_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.RecordDocument.fields.instrument_type
        distinguishing_aspect: "instrument_type outside the declared enum (WILL) is rejected with ERR_VALIDATION (400) at priority 3, before existence checks."
        test_recipe:
          setup: ["order with one IN_PROGRESS assignment"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_804", property_address: "13 Cedar St", county: "Travis", state_code: "TX", legal_description_text: "LOT 4 BLK A", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_804
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_804", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "WILL", grantor_name: "A Smith", grantee_name: "B Jones", instrument_number: "INST-804-A", recording_date: "2010-01-01" }
              as: Abstracter
              as_user_id: abs_804
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_VALIDATION and HTTP status == 400"

      - name: record_document_chain_break_flag_computed
        claim_type: computed_fields
        grounds:
          - calculations.chain_break_detection
          - entities.RecordDocument.fields.chain_break_flag
        distinguishing_aspect: "chain_break_flag is computed from grantor/grantee continuity against the prior deed: mismatched grantor -> true; matching grantor -> false."
        test_recipe:
          setup: ["order with one IN_PROGRESS CHAIN_OF_TITLE assignment"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_805", property_address: "14 Cedar St", county: "Travis", state_code: "TX", legal_description_text: "LOT 5 BLK A", search_period_years: 40, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_805
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_805", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A Smith", grantee_name: "B Jones", instrument_number: "INST-805-A", recording_date: "2000-01-01" }
              as: Abstracter
              as_user_id: abs_805
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "Bob Jones", grantee_name: "C Lee", instrument_number: "INST-805-B", recording_date: "2005-01-01", prior_document_id: "${d1}" }
              as: Abstracter
              as_user_id: abs_805
              captures: { brk: $.data.chain_break_flag }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "B Jones", grantee_name: "C Lee", instrument_number: "INST-805-C", recording_date: "2006-01-01", prior_document_id: "${d1}" }
              as: Abstracter
              as_user_id: abs_805
              captures: { nobrk: $.data.chain_break_flag }
          assert:
            - "captured brk == true (grantor 'Bob Jones' != prior grantee 'B Jones' — grantor/grantee index continuity broken)"
            - "captured nobrk == false (exact trimmed match)"

      - name: search_assignment_created_in_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.SearchAssignment
        distinguishing_aspect: "A new SearchAssignment starts in IN_PROGRESS with zeroed derived counters; creating it moves the order RECEIVED -> SEARCH_IN_PROGRESS."
        test_recipe:
          setup: ["one order in RECEIVED"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_806", property_address: "15 Cedar St", county: "Travis", state_code: "TX", legal_description_text: "LOT 6 BLK A", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_806
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_806", search_type: "LIEN_JUDGMENT_TAX", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id, st: $.data.status }
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { ost: $.data.status }
          assert:
            - "captured st == IN_PROGRESS with document_count == 0, verified_count == 0, revision_count == 0 on the same response"
            - "captured ost == SEARCH_IN_PROGRESS (first-assignment side effect)"

      - name: record_documents_list_filters_and_pagination
        claim_type: listing
        grounds:
          - endpoints GET /api/record-documents
          - response_envelope
        distinguishing_aspect: "The filtered list honors instrument_type filtering and limit/offset pagination with total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["order with one assignment holding three documents (2 DEED, 1 LIEN)"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_807", property_address: "16 Cedar St", county: "Travis", state_code: "TX", legal_description_text: "LOT 7 BLK A", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_807
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_807", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A", grantee_name: "B", instrument_number: "INST-807-A", recording_date: "2001-01-01" }
              as: Abstracter
              as_user_id: abs_807
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "B", grantee_name: "C", instrument_number: "INST-807-B", recording_date: "2002-01-01" }
              as: Abstracter
              as_user_id: abs_807
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "LIEN", grantor_name: "C", grantee_name: "IRS", instrument_number: "INST-807-C", recording_date: "2003-01-01" }
              as: Abstracter
              as_user_id: abs_807
          trigger:
            - call: "GET /api/record-documents?order_id=${ord}&instrument_type=DEED"
              as: OperationsManager
            - call: "GET /api/record-documents?order_id=${ord}&limit=1&offset=0"
              as: OperationsManager
          assert:
            - "DEED-filtered list returns exactly 2 rows (total_count == 2)"
            - "limit=1 page returns 1 row with total_count == 3 and has_more == true (envelope pagination fields present)"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: verify_verified_document_returns_409
        claim_type: invalid_transition
        grounds:
          - state_machines.RecordDocument
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "VERIFIED is terminal for RecordDocument; a second verify is rejected with ERR_INVALID_STATE and no counters change."
        test_recipe:
          setup: ["order, assignment, one VERIFIED document"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_811", property_address: "20 Elm St", county: "Travis", state_code: "TX", legal_description_text: "LOT 1 BLK B", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_811
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_811", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A", grantee_name: "B", instrument_number: "INST-811-A", recording_date: "2001-01-01" }
              as: Abstracter
              as_user_id: abs_811
              captures: { doc: $.data.id }
            - call: "POST /api/record-documents/${doc}/verify"
              payload: {}
              as: Abstracter
              as_user_id: abs_811
          trigger:
            - call: "POST /api/record-documents/${doc}/verify"
              payload: {}
              as: Abstracter
              as_user_id: abs_811
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE and HTTP status == 409"

      - name: cancel_delivered_order_returns_409
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AbstractOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "DELIVERED is terminal: cancel after delivery is rejected with ERR_INVALID_STATE; nothing is refunded or cascaded."
        test_recipe:
          setup: ["STANDARD order fully delivered (no retrievals)"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_812", property_address: "21 Elm St", county: "Travis", state_code: "TX", legal_description_text: "LOT 2 BLK B", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_812
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_812", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A", grantee_name: "B", instrument_number: "INST-812-A", recording_date: "2001-01-01" }
              as: Abstracter
              as_user_id: abs_812
              captures: { doc: $.data.id }
            - call: "POST /api/record-documents/${doc}/verify"
              payload: {}
              as: Abstracter
              as_user_id: abs_812
            - call: "POST /api/search-assignments/${asg}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_812
            - call: "POST /api/search-assignments/${asg}/accept"
              payload: {}
              as: Examiner
              as_user_id: ex_812
            - call: "GET /api/abstract-orders/${ord}"
              as: OperationsManager
              captures: { ord_v: $.data.version }
            - call: "POST /api/abstract-reports"
              payload: { order_id: "${ord}", title: "Report 812", expected_abstract_order_version: "${ord_v}" }
              as: Abstracter
              as_user_id: abs_812
              captures: { rep: $.data.id }
            - call: "POST /api/abstract-reports/${rep}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_812
            - call: "POST /api/abstract-reports/${rep}/start-review"
              payload: { review_slot_start: "2026-08-02T10:00:00Z", review_slot_end: "2026-08-02T11:00:00Z" }
              as: Examiner
              as_user_id: ex_812
            - call: "POST /api/abstract-reports/${rep}/approve"
              payload: {}
              as: Examiner
              as_user_id: ex_812
            - call: "POST /api/abstract-orders/${ord}/deliver"
              payload: {}
              as: OperationsManager
          trigger:
            - call: "POST /api/abstract-orders/${ord}/cancel"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE and HTTP status == 409"
            - "GET order still shows status DELIVERED with final_fee_cents == 40000"

      - name: void_document_terminal_then_verify_returns_409
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RecordDocument
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "VOID is terminal for RecordDocument: verify after void is rejected."
        test_recipe:
          setup: ["order, assignment, one VOID document"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_813", property_address: "22 Elm St", county: "Travis", state_code: "TX", legal_description_text: "LOT 3 BLK B", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_813
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_813", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A", grantee_name: "B", instrument_number: "INST-813-A", recording_date: "2001-01-01" }
              as: Abstracter
              as_user_id: abs_813
              captures: { doc: $.data.id }
            - call: "POST /api/record-documents/${doc}/void"
              payload: { reason: "entered in error" }
              as: OperationsManager
          trigger:
            - call: "POST /api/record-documents/${doc}/verify"
              payload: {}
              as: Abstracter
              as_user_id: abs_813
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE and HTTP status == 409"

      - name: submit_assignment_with_unexamined_document_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=16]
          - errors[ERR_DOCUMENTS_NOT_EXAMINED]
        distinguishing_aspect: "Submit is blocked while any linked document is still REPORTED — the examiner only sees fully examined work."
        test_recipe:
          setup: ["order, IN_PROGRESS assignment, one REPORTED document"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_814", property_address: "23 Elm St", county: "Travis", state_code: "TX", legal_description_text: "LOT 4 BLK B", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_814
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_814", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
            - call: "POST /api/record-documents"
              payload: { order_id: "${ord}", assignment_id: "${asg}", instrument_type: "DEED", grantor_name: "A", grantee_name: "B", instrument_number: "INST-814-A", recording_date: "2001-01-01" }
              as: Abstracter
              as_user_id: abs_814
          trigger:
            - call: "POST /api/search-assignments/${asg}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_814
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_DOCUMENTS_NOT_EXAMINED and HTTP status == 409"

      - name: submit_empty_assignment_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=15]
          - errors[ERR_EMPTY_ASSIGNMENT]
        distinguishing_aspect: "Submit with zero non-VOID documents is rejected with ERR_EMPTY_ASSIGNMENT (422) — an empty abstract is never examinable."
        test_recipe:
          setup: ["order, IN_PROGRESS assignment with no documents"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_815", property_address: "24 Elm St", county: "Travis", state_code: "TX", legal_description_text: "LOT 5 BLK B", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_815
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_815", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /api/search-assignments/${asg}/submit"
              payload: {}
              as: Abstracter
              as_user_id: abs_815
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_EMPTY_ASSIGNMENT and HTTP status == 422"

      - name: accept_in_progress_assignment_returns_409
        claim_type: invalid_transition
        grounds:
          - state_machines.SearchAssignment
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Accept is only declared from SUBMITTED; accepting an IN_PROGRESS assignment is rejected."
        test_recipe:
          setup: ["order, IN_PROGRESS assignment"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_816", property_address: "25 Elm St", county: "Travis", state_code: "TX", legal_description_text: "LOT 6 BLK B", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_816
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
              payload: { order_id: "${ord}", abstracter_ref: "abs_816", search_type: "CHAIN_OF_TITLE", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T17:00:00Z" }
              as: OperationsManager
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /api/search-assignments/${asg}/accept"
              payload: {}
              as: Examiner
              as_user_id: ex_816
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE and HTTP status == 409"

      - name: order_cancel_cascades_and_reverses_posted_fees
        claim_type: side_effect_execution
        grounds:
          - state_machines.AbstractOrder
          - state_machines.SearchAssignment
          - state_machines.CountyRetrieval
        distinguishing_aspect: "Cascade-down with compensation: cancelling a SEARCH_IN_PROGRESS order cancels its assignment and reverses its posted retrieval fee, restoring accrued_fees_cents to the pre-post value."
        test_recipe:
          setup: ["STANDARD order in SEARCH_IN_PROGRESS with one assignment and one FEE_POSTED PER_DOCUMENT retrieval (accrued 42500)"]
          setup_api_calls:
            - call: "POST /api/abstract-orders"
              payload: { client_ref: "client_817", property_address: "26 Elm St", county: "Travis", state_code: "TX", legal_description_text: "LOT 7 BLK B", search_period_years: 30, effective_date: "2026-01-15" }
              as: Client
              as_user_id: client_817
              captures: { ord: $.data.id }
            - call: "POST /api/search-assignments"
