            - "Runbook.${rb1_id}.readiness_score != 100.00 — the sum-then-round order is explicitly not the pinned one"
            - "Runbook.${rb1_id}.status == VALIDATED and Runbook.${rb1_id}.validated_at == 2026-08-01T00:00:00Z"
            - "RecoveryGroup.${g1_id}.posture == READY because 99.99 >= 80.00"
            - "RecoveryGroup.${g1_id}.current_runbook_id == ${rb1_id}"

      - name: impact_surcharge_keyed_on_provisional_band_not_final_band
        grounds:
