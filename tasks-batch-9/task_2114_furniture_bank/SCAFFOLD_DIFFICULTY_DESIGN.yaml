              payload: { client_id: "${cl_id}", agency_id: "${ag_id}", requested_categories: ["BED"], urgency: "ROUTINE", home_visit_completed: true, bed_bug_attestation: true }
              as: CaseManager
              as_user_id: "${ag_id}"
              captures: { ref_id: "$.data.id" }
            - call: "POST /referrals/${ref_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "${ag_id}"
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /referrals/${ref_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_REFERRAL_NOT_SUBMITTED"
            - "HTTP status of the trigger is 409"
            - "Referral.${ref_id}.status == APPROVED"
            - "PartnerAgency.${ag_id}.quota_used == 1"
