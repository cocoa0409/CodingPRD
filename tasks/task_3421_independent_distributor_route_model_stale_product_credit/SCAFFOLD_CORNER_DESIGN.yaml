  # ===========================================================================
  - section: state_machines
    instances:

      - name: territory_relisted_after_settle_sells_to_new_distributor
        claim_type: Valid Transition (cyclic resale)
        grounds:
          - state_machines.Territory.EXITING_to_AVAILABLE
          - state_machines.Territory.LISTED_to_UNDER_AGREEMENT
          - validations[priority=11]
        distinguishing_aspect: "The territory lifecycle loops: after settle it returns AVAILABLE, can be LISTED again, and a new agreement for a different distributor reuses the exact same [2026-09-01, 2027-09-01) interval — the old agreement is EXITED (terminal) so the overlap rule does not fire."
        test_recipe:
          setup: ["Financed agreement fully exited and settled at clock 2026-09-08; territory back to AVAILABLE; a second distributor registered."]
          setup_api_calls:
            - *c_clock
            - *c_bakery
            - *c_terr
            - *c_terr_list
            - *c_dist
            - *c_agr_fin
            - *c_plan
            - *c_disburse
            - *c_activate_fin
            - *c_clock0908
            - call: "POST /agreements/${agrf_id}/exit"
              payload: { mode: "VOLUNTARY" }
              as: RouteOpsManager
            - call: "GET /agreements/${agrf_id}/transfers"
              payload: {}
              as: CreditAnalyst
              captures: { tr_r_id: "$.data[0].id" }
            - call: "POST /transfers/${tr_r_id}/settle"
              payload: {}
              as: CreditAnalyst
            - call: "POST /distributors"
              payload: { legal_name: "NewRoute Ventures", credit_limit_cents: 150000 }
              as: CompanyAdmin
              captures: { dist_n_id: $.data.id }
          trigger:
            - call: "POST /territories/${terr_id}/list-for-sale"
              payload: {}
              as: CompanyAdmin
              captures: { terr_rel: $.data.status }
            - call: "POST /agreements"
              payload: { territory_id: "${terr_id}", distributor_id: "${dist_n_id}", bakery_id: "${bakery_id}", purchase_price_cents: 1100000, financed_amount_cents: 0, discount_pct: 0.18, start_date: "2026-09-01", end_date: "2027-09-01" }
              as: RouteOpsManager
              captures: { agr_n_id: $.data.id }
          assert:
            - "terr_rel == LISTED (AVAILABLE -> LISTED on the cyclic territory machine)"
            - "the resale agreement is created (201) with status DRAFT despite the identical interval, because the prior agreement is EXITED"
            - "Territory.${terr_id}.status == UNDER_AGREEMENT and Distributor.${dist_n_id}.status == PROSPECT until activation"

      - name: claim_auto_expiry_at_close_covered
        claim_type: violation_to_error
        grounds:
          - state_machines.StaleReturnClaim.SUBMITTED_to_DENIED
        excluded_because:
          difficulty_instance: production_close_delinquency_standing_cascade
          rationale: "AUTO_EXPIRED denial at production-day close is asserted there (claim filed 2026-09-06, close 2026-09-16)."

      - name: third_strike_auto_suspension_covered
        claim_type: violation_to_error
        grounds:
          - calculations.agreement_strike_count
        excluded_because:
          difficulty_instance: audit_strike_auto_suspend_cascade_releases_capacity
          rationale: "The strike_count >= 3 auto-suspend and its order-cancellation cascade are asserted there end to end."

      - name: valuation_variant_divergence_covered
        claim_type: Variant Divergence
        grounds:
          - calculations.transfer_valuation
        excluded_because:
          difficulty_instance: transfer_valuation_voluntary_vs_for_cause_variants
          rationale: "Both variants computed and asserted with literal valuations (1050000 vs 850000)."

      - name: capacity_exact_boundary_covered
        claim_type: Boundary
        grounds:
          - errors.ERR_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: confirm_capacity_exact_fit_allowed_one_over_rejected
          rationale: "Equality-allowed and one-over-rejected both asserted there."

      - name: state_vs_temporal_priority_covered
        claim_type: Priority Ordering
        grounds:
          - validations[priority=7]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: order_submit_state_gate_beats_lead_time
          rationale: "Dual-failure priority asserted there; the referential-vs-temporal sibling is claim_submit_sku_referential_beats_window_temporal."
