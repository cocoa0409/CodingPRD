  # =========================================================================
  # Cross-Cutting Complexity Layers — OCC stale version
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: grading_commit_stale_source_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[grading-commit-stale-cohort]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Committing a PLANNED grading event with a deliberately stale expected_source_cohort_version (captured-version minus 1) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["GradingEvent G1 PLANNED on source Cohort C1 (captured version)."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T2", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t2: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /grading-events"
              payload: { source_cohort_id: "${c1}", planned_splits: [ { label: "all", fish_count: 100, target_tank_id: "${t2}", avg_weight_g: 55 } ] }
              as: FarmTechnician
              captures: { g1: $.data.id }
            - call: "POST /grading-events/${g1}/plan"
              payload: {}
              as: FarmTechnician
          trigger:
            - call: "POST /grading-events/${g1}/commit"
              payload: { expected_source_cohort_version: "${c1_v} - 1" }
              as: FarmTechnician
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_VERSION (stale source cohort version)."

      - name: sales_confirm_stale_lot_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[sales-confirm-stale-lot]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Confirming a SalesOrder with a stale expected_lot_version (captured lot version minus 1) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["ProductLot LotA AVAILABLE; SalesOrder with a valid 10kg line."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
