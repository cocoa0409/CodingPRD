            as_user_id: "${cust_id}"
          - call: "POST /pools/${pool_id}/activate"
            payload: {}
            as: IssuerOfficer
            as_user_id: "${iss_id}"
            captures: { pool_v: $.data.version }
        trigger:
          - call: "POST /investor-reports"
            payload: { pool_id: "${pool_id}", period_month: "2026-09", collection_rate_bps: 10000, expected_pool_version: "${pool_v}" }
            as: IssuerOfficer
            as_user_id: "${iss_id}"
            captures: { err: $.data.error_id }
          - call: "POST /investor-reports"
            payload: { pool_id: "${pool_id}", period_month: "2026-10", collection_rate_bps: 10000, expected_pool_version: "${pool_v}" }
            as: IssuerOfficer
            as_user_id: "${iss_id}"
            captures: { rep_2: $.data.id }
        assert:
          - "same-month report rejected with ERR_DUPLICATE_REPORT_PERIOD (422)"
          - "adjacent-month report accepted: InvestorReport.${rep_2}.period_month == 2026-10 and status == DRAFT"
          - "monthly granule equality — not half-open interval arithmetic — drives the rejection"

- rule_id: compensating_invariant
  instances:
    - name: advance_obligation_settle_reimburse_roundtrip
      grounds:
        - calculations.advance_conservation
        - state_machines.LiquidityAdvance
        - state_machines.PassThroughPayment
      distinguishing_aspect: |
        Conserved quantity: global open-advance cents. Settle-as-advance adds
        7500 and the paired reimbursement subtracts exactly 7500, restoring the
        global total to zero with no drift — verified by reading the issuer's
        advance_obligation_cents after both halves of the round trip.
      test_recipe:
        setup:
          - "Issuer ACTIVE; LIVE pool with one loan 1200000 cents at note 850 bps, pool note 750 bps; empty P_AND_I account; auto report accepted -> payment DUE 7500 cents (floor(1200000*750/10000/12) = 7500)."
