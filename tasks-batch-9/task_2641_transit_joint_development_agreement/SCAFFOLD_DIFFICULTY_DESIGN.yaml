# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: transit-joint-development-agreement (api_prefix /jda)
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every numeric assert below was computed by executing the corresponding
# calculations[].formula with its constants; no estimates.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: readiness_score_preliminary_versus_certified_variant_divergence
        grounds:
          - calculations.readiness_composite_score
          - entities.ReadinessAssessment.fields.variant_applied
          - entities.AgencySite.fields.readiness_composite_score
          - state_machines.ReadinessAssessment.DRAFT_to_CERTIFIED
        distinguishing_aspect: |
          The PRELIMINARY variant is an unweighted mean that ignores encumbrance_count and
          AgencySite.federal_interest_pct, so the identical stored assessment row scores 71.25 as a
          DRAFT and 70.00 once certified under the weighted-and-penalised CERTIFIED variant — a
          divergence of exactly 1.25 points on the site-readiness domain.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "One AgencySite acquired with FEDERAL_GRANT money and federal_interest_pct 2.5, status INVENTORIED"
            - "One DRAFT ReadinessAssessment on that site with environmental 80, utility 75, access 70, entitlement 60 and encumbrance_count 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-A-001", name: "Alder Street Park-and-Ride", address_line: "1400 Alder St", parcel_area_sqft: 86000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1, assessment_notes: "Intake screen" }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id, pre_score: $.data.composite_score, pre_variant: $.data.variant_applied, pre_tier: $.data.tier }
          trigger:
            - call: "POST /jda/assessments/${asmt_a}/certify"
              payload: { }
              as: RealEstateOfficer
              captures: { cert_score: $.data.composite_score }
          assert:
            - "${pre_score} == 71.25"
            - "${pre_variant} == PRELIMINARY"
            - "${pre_tier} == null"
            - "${cert_score} == 70.00"
            - "ReadinessAssessment.${asmt_a}.composite_score == 70.00"
            - "ReadinessAssessment.${asmt_a}.variant_applied == CERTIFIED"
            - "ReadinessAssessment.${asmt_a}.tier == READY"
            - "ReadinessAssessment.${asmt_a}.status == CERTIFIED"
            - "AgencySite.${site_a}.readiness_composite_score == 70.00"
            - "AgencySite.${site_a}.readiness_tier == READY"
            - "AgencySite.${site_a}.status == ASSESSED"
            - "${pre_score} - ${cert_score} == 1.25"

      - name: valuation_floor_fmv_strict_versus_below_market_divergence
        grounds:
          - calculations.permissible_transfer_floor
          - entities.ValuationDetermination.fields.transfer_basis
          - entities.ValuationDetermination.fields.permissible_floor_cents
          - concurrency_rules[valuation-create-stale-site]
        distinguishing_aspect: |
          This dual variant lives on a different entity domain — money on ValuationDetermination, not
          readiness scoring on ReadinessAssessment: from one identical appraisal of 48500000 cents the
          FMV_STRICT basis floors the transfer at 48500000 while TRANSIT_SUPPORTIVE_BELOW_MARKET floors
          it at 36375000, exactly 12125000 cents lower, and both rows still record the same
          transit_supportive_credit_cents of 12125000.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "One AgencySite with federal_interest_pct 2.5, certified READY and released for solicitation"
            - "One FMV_STRICT ValuationDetermination already recorded for that site with appraised_value_cents 48500000, transit_supportive_use_pct 60, affordable_units_pct 25"
            - "The site's current version re-read after the first valuation bumped it, so the second valuation carries a fresh expected_site_version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-A-002", name: "Birch Yard Surplus Parcel", address_line: "22 Birch Yard Rd", parcel_area_sqft: 74000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id }
            - call: "POST /jda/assessments/${asmt_a}/certify"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/sites/${site_a}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
            - call: "GET /jda/sites/${site_a}"
              payload: { }
              as: ValuationOfficer
              captures: { site_v1: $.data.version }
            - call: "POST /jda/sites/${site_a}/valuations"
              payload: { method: "INCOME_APPROACH", appraised_value_cents: 48500000, transit_supportive_use_pct: 60, affordable_units_pct: 25, transfer_basis: "FMV_STRICT", effective_date: "2026-08-20", expected_site_version: "${site_v1}" }
              as: ValuationOfficer
              captures: { val_strict: $.data.id, floor_strict: $.data.permissible_floor_cents, credit_strict: $.data.transit_supportive_credit_cents }
            - call: "GET /jda/sites/${site_a}"
              payload: { }
              as: ValuationOfficer
              captures: { site_v2: $.data.version }
          trigger:
            - call: "POST /jda/sites/${site_a}/valuations"
              payload: { method: "INCOME_APPROACH", appraised_value_cents: 48500000, transit_supportive_use_pct: 60, affordable_units_pct: 25, transfer_basis: "TRANSIT_SUPPORTIVE_BELOW_MARKET", effective_date: "2026-08-20", expected_site_version: "${site_v2}" }
              as: ValuationOfficer
              captures: { val_below: $.data.id, floor_below: $.data.permissible_floor_cents, credit_below: $.data.transit_supportive_credit_cents }
          assert:
            - "${floor_strict} == 48500000"
            - "${floor_below} == 36375000"
            - "${floor_strict} - ${floor_below} == 12125000"
            - "${credit_strict} == 12125000"
            - "${credit_below} == 12125000"
            - "ValuationDetermination.${val_strict}.federal_interest_floor_cents == 1212500"
            - "ValuationDetermination.${val_below}.federal_interest_floor_cents == 1212500"
            - "ValuationDetermination.${val_strict}.status == DRAFT"
            - "ValuationDetermination.${val_below}.status == DRAFT"
            - "AgencySite.${site_a}.federal_interest_basis_cents == 1212500"
            - "AgencySite.${site_a}.federal_interest_unencumbered_cents == 1212500"

  - rule_id: combinatorial_formula
    instances:
      - name: agency_revenue_credit_tier_keyed_on_pre_credit_subtotal
        grounds:
          - calculations.annual_revenue_to_agency
          - calculations.consideration_value
          - entities.JointDevelopmentAgreement.fields.capital_credit_cents
          - entities.JointDevelopmentAgreement.fields.annual_revenue_to_agency_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order: capital_credit_cents is
          keyed on the PRE-credit subtotal 2600000 (tier T2, rate 0.08 + 0.03 affordable bonus = 0.11),
          producing 286000 and an annual revenue of 2314000; keying the tier on the post-credit total
          instead lands in tier T1 and yields 2438020 from the same stored inputs.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "AgencySite certified READY (composite 70.00), released, then moved to UNDER_AGREEMENT by an award"
            - "Prequalified developer with debarment_status CLEAR"
            - "Solicitation RFP with benchmark_value_cents 48500000 and affordable_housing_min_pct 15, issued then closed with one responsive proposal"
            - "Proposal GROUND_LEASE ranked 1, awarded, with an ACTIVE ExclusiveNegotiationPeriod 2026-08-15..2027-01-15"
            - "CERTIFIED TRANSIT_SUPPORTIVE_BELOW_MARKET valuation with permissible_floor_cents 36375000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-A-003", name: "Cedar Transit Center Air Rights", address_line: "300 Cedar Ave", parcel_area_sqft: 91000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id }
            - call: "POST /jda/assessments/${asmt_a}/certify"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/sites/${site_a}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/developers"
              payload: { legal_name: "Alder Transit Partners LLC", contact_email: "dev-a@example.com", prequalified: true, debarment_status: "CLEAR" }
              as: RealEstateOfficer
              captures: { dev_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/solicitations"
              payload: { solicitation_type: "RFP", response_deadline: "2026-09-15T00:00:00Z", benchmark_value_cents: 48500000, affordable_housing_min_pct: 15, min_proposals_required: 1, joint_use_required: false }
              as: RealEstateOfficer
              captures: { sol_a: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/issue"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/solicitations/${sol_a}/proposals"
              payload: { developer_id: "${dev_a}", proposed_structure: "GROUND_LEASE", proposed_annual_rent_cents: 2400000, affordable_units: 50, total_units: 200, transit_ridership_uplift: 600, design_compliance_score: 88, joint_use_committed: false }
              as: Developer
              as_user_id: "${dev_a}"
              captures: { prop_a: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/close"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/solicitations/${sol_a}/award"
              payload: { proposal_id: "${prop_a}", negotiation_start_date: "2026-08-15", negotiation_end_date: "2027-01-15" }
              as: RealEstateOfficer
            - call: "GET /jda/sites/${site_a}"
              payload: { }
              as: ValuationOfficer
              captures: { site_v1: $.data.version }
            - call: "POST /jda/sites/${site_a}/valuations"
              payload: { method: "INCOME_APPROACH", appraised_value_cents: 48500000, transit_supportive_use_pct: 60, affordable_units_pct: 25, transfer_basis: "TRANSIT_SUPPORTIVE_BELOW_MARKET", effective_date: "2026-08-20", expected_site_version: "${site_v1}" }
              as: ValuationOfficer
              captures: { val_a: $.data.id }
            - call: "POST /jda/valuations/${val_a}/certify"
              payload: { }
              as: ValuationOfficer
          trigger:
            - call: "POST /jda/agreements"
              payload: { site_id: "${site_a}", developer_id: "${dev_a}", proposal_id: "${prop_a}", valuation_id: "${val_a}", structure: "GROUND_LEASE", term_years: 20, base_rent_cents: 2000000, revenue_share_pct: 0.05, projected_gross_revenue_cents: 12000000, affordable_units_committed: 50, total_units: 200, site_area_share_pct: 60, joint_use_committed: false }
              as: RealEstateOfficer
              captures: { jda_a: $.data.id, credit: $.data.capital_credit_cents, annual: $.data.annual_revenue_to_agency_cents, consideration: $.data.consideration_value_cents }
          assert:
            - "${credit} == 286000"
            - "${annual} == 2314000"
            - "${annual} != 2438020"
            - "${consideration} == 46280000"
            - "JointDevelopmentAgreement.${jda_a}.capital_credit_cents == 286000"
            - "JointDevelopmentAgreement.${jda_a}.annual_revenue_to_agency_cents == 2314000"
            - "JointDevelopmentAgreement.${jda_a}.consideration_value_cents == 46280000"
            - "JointDevelopmentAgreement.${jda_a}.negotiation_status == DRAFTING"
            - "JointDevelopmentAgreement.${jda_a}.federal_approval_status == NOT_SUBMITTED"

      - name: maintenance_allocation_rounds_each_line_then_sums
        grounds:
          - calculations.maintenance_cost_allocation
          - entities.MaintenanceCharge.fields.line_items
          - entities.SharedFacility.fields.cost_share_pct_developer
          - entities.MaintenanceCharge.fields.developer_share_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding whose order is pinned and observable: three line items of 41250 at a
          0.35 developer share round to 14438 each and sum to developer_share_cents 43314, whereas
          summing first and rounding once gives 43313; the one-cent gap is the assertion, and the
          agency share absorbs the residue so the two shares still total 123750.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "AgencySite UNDER_AGREEMENT with a DRAFTING JointDevelopmentAgreement on it"
            - "One SharedFacility on the site with maintenance_responsibility SHARED and cost_share_pct_developer 0.35"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /jda/sites"
              payload: { site_code: "TJD-A-004", name: "Dogwood Station Plaza", address_line: "88 Dogwood Way", parcel_area_sqft: 65000, acquisition_funding_source: "FEDERAL_GRANT", federal_interest_pct: 2.5, transit_facility_present: false }
              as: RealEstateOfficer
              captures: { site_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/assessments"
              payload: { environmental_score: 80, utility_score: 75, access_score: 70, entitlement_score: 60, encumbrance_count: 1 }
              as: RealEstateOfficer
              captures: { asmt_a: $.data.id }
            - call: "POST /jda/assessments/${asmt_a}/certify"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/sites/${site_a}/release-for-solicitation"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/developers"
              payload: { legal_name: "Alder Transit Partners LLC", contact_email: "dev-a@example.com", prequalified: true, debarment_status: "CLEAR" }
              as: RealEstateOfficer
              captures: { dev_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/solicitations"
              payload: { solicitation_type: "RFP", response_deadline: "2026-09-15T00:00:00Z", benchmark_value_cents: 48500000, affordable_housing_min_pct: 15, min_proposals_required: 1, joint_use_required: false }
              as: RealEstateOfficer
              captures: { sol_a: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/issue"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/solicitations/${sol_a}/proposals"
              payload: { developer_id: "${dev_a}", proposed_structure: "GROUND_LEASE", proposed_annual_rent_cents: 2400000, affordable_units: 50, total_units: 200, transit_ridership_uplift: 600, design_compliance_score: 88, joint_use_committed: false }
              as: Developer
              as_user_id: "${dev_a}"
              captures: { prop_a: $.data.id }
            - call: "POST /jda/solicitations/${sol_a}/close"
              payload: { }
              as: RealEstateOfficer
            - call: "POST /jda/solicitations/${sol_a}/award"
              payload: { proposal_id: "${prop_a}", negotiation_start_date: "2026-08-15", negotiation_end_date: "2027-01-15" }
              as: RealEstateOfficer
            - call: "GET /jda/sites/${site_a}"
              payload: { }
              as: ValuationOfficer
              captures: { site_v1: $.data.version }
            - call: "POST /jda/sites/${site_a}/valuations"
              payload: { method: "INCOME_APPROACH", appraised_value_cents: 48500000, transit_supportive_use_pct: 60, affordable_units_pct: 25, transfer_basis: "TRANSIT_SUPPORTIVE_BELOW_MARKET", effective_date: "2026-08-20", expected_site_version: "${site_v1}" }
              as: ValuationOfficer
              captures: { val_a: $.data.id }
            - call: "POST /jda/valuations/${val_a}/certify"
              payload: { }
              as: ValuationOfficer
            - call: "POST /jda/agreements"
              payload: { site_id: "${site_a}", developer_id: "${dev_a}", proposal_id: "${prop_a}", valuation_id: "${val_a}", structure: "GROUND_LEASE", term_years: 20, base_rent_cents: 2000000, revenue_share_pct: 0.05, projected_gross_revenue_cents: 12000000, affordable_units_committed: 50, total_units: 200, site_area_share_pct: 60, joint_use_committed: false }
              as: RealEstateOfficer
              captures: { jda_a: $.data.id }
            - call: "POST /jda/sites/${site_a}/shared-facilities"
              payload: { facility_type: "PLAZA", total_bay_capacity: 6, maintenance_responsibility: "SHARED", cost_share_pct_developer: 0.35 }
              as: TransitOperationsManager
              captures: { sf_a: $.data.id }
          trigger:
            - call: "POST /jda/shared-facilities/${sf_a}/maintenance-charges"
              payload: { jda_id: "${jda_a}", period_start: "2026-08-01", period_end: "2026-08-31", line_items: [ { description: "Plaza sweeping", cost_cents: 41250 }, { description: "Elevator service", cost_cents: 41250 }, { description: "Lighting", cost_cents: 41250 } ] }
              as: TransitOperationsManager
              captures: { chg_a: $.data.id, dev_share: $.data.developer_share_cents, agy_share: $.data.agency_share_cents, tot: $.data.total_cost_cents }
          assert:
            - "${tot} == 123750"
            - "${dev_share} == 43314"
            - "${dev_share} != 43313"
            - "${agy_share} == 80436"
            - "${dev_share} + ${agy_share} == 123750"
            - "MaintenanceCharge.${chg_a}.effective_share_applied == 0.35"
            - "MaintenanceCharge.${chg_a}.developer_share_cents == 43314"
            - "MaintenanceCharge.${chg_a}.agency_share_cents == 80436"

  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_parallel_dimensions_with_revision_cycle
        grounds:
          - state_machines.JointDevelopmentAgreement.AGENCY_REVIEW_to_REVISION_REQUESTED
          - state_machines.JointDevelopmentAgreement.REVISION_REQUESTED_to_DRAFTING
          - state_machines.JointDevelopmentAgreement.NOT_SUBMITTED_to_SUBMITTED
          - state_machines.JointDevelopmentAgreement.SUBMITTED_to_FTA_APPROVED
          - entities.JointDevelopmentAgreement.fields.negotiation_status
          - entities.JointDevelopmentAgreement.fields.federal_approval_status
        distinguishing_aspect: |
          JointDevelopmentAgreement carries two independent dimensions on one row: the agreement completes a
          full negotiation cycle DRAFTING -> AGENCY_REVIEW -> REVISION_REQUESTED -> DRAFTING -> AGENCY_REVIEW
          -> BOARD_APPROVED while federal_approval_status advances NOT_SUBMITTED -> SUBMITTED -> FTA_APPROVED
          under a different role and endpoint, and the federal advance leaves negotiation_status at
          BOARD_APPROVED untouched.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "AgencySite UNDER_AGREEMENT with a CERTIFIED BELOW_MARKET valuation (floor 36375000)"
            - "DRAFTING JointDevelopmentAgreement with revenue_share_pct 0.05 (annual revenue 2314000)"
            - "The agreement has been submitted, sent back for revision, amended to revenue_share_pct 0.06, resubmitted, board-approved, and a federal disposition request has been filed"
