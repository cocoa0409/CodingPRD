            - "with dated_date 2027-03-01 a STRICT_FIVE_YEAR review would later scan the half-open window [2022-03-01, 2027-03-01)"

  - section: state_machines
    instances:

      - name: every_entity_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines[BondIssue].initial_state
          - state_machines[Undertaking.status].initial_state
          - state_machines[Undertaking.compliance_posture].initial_state
          - state_machines[AnnualReportCycle].initial_state
          - state_machines[CycleContentItem].initial_state
          - state_machines[MaterialEventNotice].initial_state
          - state_machines[DirectPlacement].initial_state
          - state_machines[OfficialStatement].initial_state
          - state_machines[DisseminationEngagement].initial_state
        distinguishing_aspect: >-
          Undertaking carries TWO state machines on two different fields, so a fresh undertaking
          must simultaneously report status ACTIVE and compliance_posture COMPLIANT; an
          implementation that models only one status field cannot satisfy both. CycleContentItem
          is never POSTed, so its NOT_STARTED initial state must be produced by the cycle-creation
          cascade.
