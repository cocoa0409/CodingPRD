      - name: priority_conflict_pattern_covered_by_difficulty_design
        claim_type: Priority conflict
        grounds:
          - validations[priority=57]
          - validations[priority=99]
        excluded_because:
          difficulty_instance: send_frozen_state_outranks_insufficient_liquidity_fiscal
          rationale: "That difficulty instance already violates the freeze rule at priority 57 and the liquidity rule at priority 99 in one request and pins ERR_PARTICIPANT_SEND_FROZEN as the reported error, which is exactly the priority-conflict claim for this pair; a second corner instance would restate it."

      - name: conditional_validation_pattern_covered_by_difficulty_design
        claim_type: Conditional validation
        grounds:
          - validations[priority=65]
          - validations[priority=92]
        excluded_because:
          difficulty_instance: model_safety_outranks_per_transaction_constraint
          rationale: "The participation-model capability rule only applies when the participant is configured RECEIVE_ONLY or RECEIVE_AND_REQUEST_FOR_PAYMENT, and that difficulty instance already exercises the configured-and-violating case against the always-on per-transaction rule; the with-config-absent half is covered here by transfer_at_exact_per_transaction_limit_admitted."

