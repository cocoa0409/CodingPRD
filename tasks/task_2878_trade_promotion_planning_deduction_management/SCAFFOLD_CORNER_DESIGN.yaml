              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { err_resend: $.data.error_id }
          assert:
            - "${wo_status} == WRITTEN_OFF"
            - "${err_second_write_off} == ERR_DISPUTE_STATE_INVALID with HTTP 409"
            - "${err_recovery} == ERR_DISPUTE_STATE_INVALID with HTTP 409"
            - "${err_resend} == ERR_DISPUTE_STATE_INVALID with HTTP 409"
            - "Deduction.${ded_id}.status == WRITTEN_OFF and Dispute.${disp_id}.write_off_amount == 100.00"
            - "Customer.${cust_id}.write_off_ytd_amount == 100.00 and .open_deduction_amount == 0.00"

