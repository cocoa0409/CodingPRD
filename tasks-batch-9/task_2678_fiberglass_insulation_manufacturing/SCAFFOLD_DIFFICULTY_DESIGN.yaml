  - rule_id: compensating_invariant
    instances:
      - name: cullet_charge_reversal_preserves_total_glass_mass
        grounds:
          - state_machines.CulletBatch.CHARGED_to_STAGED
          - calculations.cullet_charge_allocation
          - entities.Plant.cullet_on_hand_kg
          - entities.Plant.cullet_charged_kg_ytd
          - entities.ProductionRun.virgin_batch_kg
          - concurrency_rules.cullet-batch-stage-stale-plant
        distinguishing_aspect: |
          The conserved quantity is MASS, split across two ledgers at once. On the
          plant, cullet_on_hand_kg + cullet_charged_kg_ytd must stay equal to
          cullet_received_kg_ytd (3100.00) before and after the reversal; on the run,
          cullet_charged_kg + virgin_batch_kg must stay equal to total_charge_kg
          (10000.00). The compensation is therefore a swap in two places, not a
          deletion: reversing 1400.00 kg of cullet must ADD 1400.00 kg of virgin
          batch, so an implementation that merely decrements the cullet figure leaves
          the run 1400.00 kg short and is caught. cullet_fraction is re-derived, not
          left stale, and total_charge_kg_ytd is deliberately untouched.
        test_recipe:
          setup:
            - "Plant NWK has max_cullet_fraction 0.30 and cullet_restrict_fraction 0.28, melt_posture OPEN."
            - "Three CulletBatch rows are STAGED against the plant: 1200.00 kg, 1400.00 kg and 500.00 kg TRIM, staged with successive expected_plant_version values re-read between calls."
            - "Plant ledgers read cullet_received_kg_ytd 3100.00, cullet_on_hand_kg 3100.00, cullet_charged_kg_ytd 0.00."
            - "Run RUN-A for PL-A on line 1 was started at target_pull_kg 9200, so total_charge_kg == 10000.00 and allowed_cullet_kg == 3000.00; the waterfall charged batch 1 and batch 2 (1200.00 + 1400.00 == 2600.00) and SKIPPED batch 3 whole because 3100.00 would exceed 3000.00."
            - "RUN-A is therefore MELTING with cullet_charged_kg 2600.00, virgin_batch_kg 7400.00 and cullet_fraction 0.2600, and the plant reads cullet_on_hand_kg 500.00, cullet_charged_kg_ytd 2600.00, total_charge_kg_ytd 10000.00, cullet_fraction_ytd 0.2600 -- still OPEN, since 0.2600 < 0.28."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id", pv1: "$.data.version" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
            - call: "POST /cullet-batches"
              payload: { plant_id: "${plant_id}", source_type: "TRIM", mass_kg: 1200.00, expected_plant_version: "${pv1}" }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { batch_1: "$.data.id" }
            - call: "GET /plants/${plant_id}"
              payload: {}
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { pv2: "$.data.version" }
            - call: "POST /cullet-batches"
              payload: { plant_id: "${plant_id}", source_type: "TRIM", mass_kg: 1400.00, expected_plant_version: "${pv2}" }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { batch_2: "$.data.id" }
            - call: "GET /plants/${plant_id}"
              payload: {}
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { pv3: "$.data.version" }
            - call: "POST /cullet-batches"
              payload: { plant_id: "${plant_id}", source_type: "TRIM", mass_kg: 500.00, expected_plant_version: "${pv3}" }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { batch_3: "$.data.id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_a}", line_index: 1, scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T14:00:00Z", target_pull_kg: 9200, zone_setpoints_f: [470, 470, 470, 470] }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { run_a: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: CorporateOps
            - call: "POST /production-runs/${run_a}/start-melt"
              payload: { cullet_batch_ids: ["${batch_1}", "${batch_2}", "${batch_3}"] }
              as: PlantOperator
              as_user_id: "${plant_id}"
          trigger:
            - call: "POST /cullet-batches/${batch_2}/reverse"
              payload: { reversal_note: "Wet cullet found in the pile after charging" }
              as: PlantOperator
              as_user_id: "${plant_id}"
          assert:
            - "CulletBatch.${batch_2}.status == STAGED and charged_run_id == null, while ${batch_1}.status == CHARGED and ${batch_3}.status == STAGED with charged_run_id == null"
            - "run ledger — ProductionRun.${run_a}.cullet_charged_kg == 1200.00 and virgin_batch_kg == 8800.00, i.e. the 1400.00 kg of cullet was REPLACED by virgin batch, not simply removed"
            - "run invariant — ProductionRun.${run_a}.total_charge_kg == 10000.00 both before and after the trigger, and cullet_charged_kg + virgin_batch_kg == 10000.00 in both states (2600.00 + 7400.00 before, 1200.00 + 8800.00 after)"
            - "ProductionRun.${run_a}.cullet_fraction == 0.1200 (1200.00 / 10000.00), re-derived rather than left at 0.2600"
            - "ProductionRun.${run_a}.allowed_cullet_kg == 3000.00 and run_status == MELTING, both unchanged"
            - "plant ledger — Plant.${plant_id}.cullet_on_hand_kg == 1900.00 (500.00 + the returned 1400.00) and cullet_charged_kg_ytd == 1200.00"
            - "plant invariant — Plant.${plant_id}.cullet_received_kg_ytd == 3100.00 before and after, and cullet_on_hand_kg + cullet_charged_kg_ytd == 3100.00 in both states (500.00 + 2600.00 before, 1900.00 + 1200.00 after)"
            - "Plant.${plant_id}.cullet_fraction_ytd == 0.1200 and total_charge_kg_ytd == 10000.00 -- the denominator is deliberately NOT rewound by a reversal"
            - "Plant.${plant_id}.melt_posture == OPEN with posture_reason == null: the pre-trigger 0.2600 never reached cullet_restrict_fraction 0.28, and the reversal only moves it further away"
            - "Plant.${plant_id}.cullet_rejected_kg_ytd == 0.00 -- a reversal is not a rejection"

      - name: allocation_line_revoke_restores_lot_coverage_and_order_ledger
        grounds:
          - state_machines.AllocationLine.ALLOCATED_to_REVOKED
          - state_machines.InventoryLot.ALLOCATED_to_AVAILABLE
          - state_machines.ChannelOrder.ALLOCATED_to_BACKORDERED
          - calculations.lot_allocation_ledger
          - calculations.channel_allocation_waterfall
        distinguishing_aspect: |
          A different conserved quantity in a different subsystem: coverage AREA on an
          InventoryLot, where allocated_sqft + available_sqft must stay equal to the
          immutable produced_sqft (10560.00) across the revocation, while three
          dependent ledgers -- the lot, the ChannelOrder and the AllocationCycle --
          are each rewound in the same operation. Unlike the cullet reversal, nothing
          is swapped into a sibling bucket on the same row: the compensation releases
          capacity outward, and the cycle's allocatable_sqft (8976.00) must survive
          untouched so the freed supply is re-proposable. revoke_reason must be
          MANUAL_REVOKE, distinguishing an operator revoke from the LOT_QUARANTINED
