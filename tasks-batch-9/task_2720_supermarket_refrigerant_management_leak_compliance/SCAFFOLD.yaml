scenario: |
  2720. Supermarket Refrigerant Management & Leak Compliance (supermarket refrigeration compliance):
  refrigerant inventory by store, system and charge size with regulatory applicability thresholds,
  leak rate calculation using industry methods with rolling twelve-month tracking, leak repair
  deadlines with verification testing and extension request criteria, retrofit or retire plans
  required after repeated threshold exceedance, technician certification verification and recovery
  equipment requirements, service record retention including cylinder tracking and reclaim
  documentation, transition planning to lower global warming potential refrigerants with equipment
  compatibility, regulatory reporting, inspection response and penalty exposure management
domain_name: supermarket-refrigerant-leak-compliance
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys carried in request bodies; no nested
  # ownership chains in URL paths. Every child collection is discoverable via a
  # filtered list endpoint (`GET /<children>?<fk_field>=`), never via nesting.

  state_machine_shape: cyclic
  # LeakEvent loops VERIFICATION_PENDING -> VERIFICATION_FAILED -> (new repair
  # attempt) -> VERIFICATION_PENDING and branches on failure count;
  # RetrofitPlan loops SUBMITTED -> REJECTED -> SUBMITTED; Technician and
  # RecoveryEquipment loop between ACTIVE/SUSPENDED and
  # CERTIFIED/VERIFICATION_OVERDUE; RefrigerantSystem carries two independent
  # state axes (operational_status x compliance_state).

  relationship_patterns:
    - one_to_many          # Store -> RefrigerantSystem, LeakEvent -> RepairAttempt
    - self_referential     # RefrigerantSystem.replaced_by_system_id -> RefrigerantSystem.id
    - cross_aggregate      # ServiceRecord binds RefrigerantSystem + Technician + RecoveryEquipment + Cylinder
    - polymorphic: false

  role_model: segregation_of_duties
  # The technician who performed a RepairAttempt may not perform the FOLLOWUP
  # VerificationTest for the same LeakEvent; the Regulator user who opened an
  # Inspection may not close it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Supermarket banner + location label" }
      - { name: store_code, type: string, source: input, description: "Operator-assigned store code", constraints: "globally unique; ERR_DUPLICATE_IDENTIFIER on collision" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of the store" }
      - { name: region, type: enum, source: input, description: "Operating region bucket", constraints: "WEST | MIDWEST | SOUTH | NORTHEAST" }
      - { name: compliance_status, type: enum, source: computed, description: "Store posture derived from its systems and leak events (calc store_compliance_posture)", default: COMPLIANT, constraints: "COMPLIANT | AT_RISK | NON_COMPLIANT" }
      - { name: total_regulated_charge_lbs, type: number, source: computed, description: "Sum of full_charge_lbs over this store's RefrigerantSystem rows with applicability == REGULATED and operational_status == ACTIVE; 1 decimal" }
      - { name: regulated_system_count, type: integer, source: computed, description: "Count of this store's RefrigerantSystem rows with applicability == REGULATED and operational_status == ACTIVE" }
      - { name: open_leak_event_count, type: integer, source: computed, description: "Count of LeakEvent rows on this store's systems whose status NOT IN {VERIFIED_CLOSED, VOIDED}" }
      - { name: overdue_leak_event_count, type: integer, source: computed, description: "Count of LeakEvent rows on this store's systems whose status IN {REPAIR_OVERDUE, VERIFICATION_OVERDUE}" }
      - { name: mandated_retrofit_count, type: integer, source: computed, description: "Count of this store's RefrigerantSystem rows whose compliance_state == RETROFIT_MANDATED" }
      - { name: chronic_leaker_flag, type: boolean, source: computed, description: "True when at least one of this store's systems has compliance_state IN {CHRONIC_EXCEEDANCE, RETROFIT_MANDATED}", default: false }
      - { name: vented_loss_lbs, type: number, source: computed, description: "Accumulated refrigerant mass reported as lost to atmosphere across non-voided ServiceRecord rows on this store's systems; 1 decimal", default: 0.0 }
      - { name: penalty_exposure_total_usd, type: number, source: computed, description: "Sum of penalty_exposure_usd over this store's Inspection rows with status IN {OPEN, RESPONDED, ESCALATED}; 2 decimals", default: 0.00 }

  - name: RefrigerantType
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "ASHRAE designation, e.g. R-404A", constraints: "globally unique; ERR_DUPLICATE_IDENTIFIER on collision" }
      - { name: gwp, type: integer, source: input, description: "100-year global warming potential", constraints: ">= 0" }
      - { name: pressure_class, type: enum, source: input, description: "Service pressure class driving technician cert type and recovery equipment match", constraints: "LOW | HIGH | VERY_HIGH" }
      - { name: ods_class, type: enum, source: input, description: "Ozone-depleting / chemical family class", constraints: "CFC | HCFC | HFC | HFO | NATURAL" }
      - { name: phasedown_status, type: enum, source: input, description: "Regulatory availability of the refrigerant", constraints: "ALLOWED | RESTRICTED_NEW_EQUIPMENT | PROHIBITED" }

  - name: RefrigerantSystem
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; the supermarket that owns the system" }
      - { name: refrigerant_type_id, type: string, source: input, description: "FK -> RefrigerantType.id; current charge chemistry, replaced by a completed retrofit" }
      - { name: replaced_by_system_id, type: string, source: system, description: "FK -> RefrigerantSystem.id; set on retirement when a replacement system is named; null otherwise", default: null }
      - { name: system_category, type: enum, source: input, description: "Regulatory category selecting the leak-rate trigger threshold", constraints: "COMMERCIAL_REFRIGERATION | INDUSTRIAL_PROCESS_REFRIGERATION | COMFORT_COOLING" }
      - { name: full_charge_lbs, type: number, source: input, description: "Nameplate full charge in pounds", constraints: "> 0; 1 decimal" }
      - { name: initial_charge_lbs, type: number, source: input, description: "Charge in the system at registration; ledger origin for the charge projection", constraints: ">= 0 and <= full_charge_lbs; 1 decimal" }
      - { name: current_charge_lbs, type: number, source: computed, description: "Ledger projection: initial_charge_lbs + SUM(added - recovered - lost) over non-voided ServiceRecord rows with performed_at <= clock; 1 decimal" }
      - { name: installed_on, type: datetime, source: input, description: "ISO 8601 UTC installation instant; earliest legal performed_at for a ServiceRecord" }
      - { name: leak_rate_method, type: enum, source: input, description: "Industry method used for the stored leak_rate_pct", default: ROLLING_AVERAGE, constraints: "ROLLING_AVERAGE | ANNUALIZING" }
      - { name: leak_rate_pct, type: number, source: computed, description: "Leak rate under leak_rate_method (calc system_leak_rate_pct); 1 decimal", default: 0.0 }
      - { name: leak_rate_baseline_at, type: datetime, source: computed, description: "Baseline instant for the ANNUALIZING method: latest of installed_on, the performed_at of the newest FOLLOWUP VerificationTest with result PASS on this system, and the completed_at of the newest COMPLETED RetrofitPlan on this system" }
      - { name: applicability, type: enum, source: computed, description: "REGULATED when full_charge_lbs >= 50.0, else EXEMPT", constraints: "REGULATED | EXEMPT" }
      - { name: threshold_pct, type: number, source: computed, description: "Leak-rate trigger threshold for system_category (20.0 / 30.0 / 10.0)" }
      - { name: required_certification_type, type: enum, source: computed, description: "TYPE_I when full_charge_lbs < 5.0; else TYPE_III when refrigerant pressure_class == LOW; else TYPE_II", constraints: "TYPE_I | TYPE_II | TYPE_III" }
      - { name: exceedance_count_12mo, type: integer, source: computed, description: "Count of LeakEvent rows on this system with status != VOIDED and detected_at in (clock - 365 days, clock]", default: 0 }
      - { name: operational_status, type: enum, source: computed, description: "State axis 1 - physical lifecycle", default: ACTIVE, constraints: "ACTIVE | RETIRED" }
      - { name: compliance_state, type: enum, source: computed, description: "State axis 2 - regulatory posture, evolves independently of operational_status", default: COMPLIANT, constraints: "COMPLIANT | LEAK_OPEN | CHRONIC_EXCEEDANCE | RETROFIT_MANDATED | RETIRED_EXEMPT" }
      - { name: retrofit_due_on, type: datetime, source: computed, description: "clock + 90 days, stamped when compliance_state becomes RETROFIT_MANDATED; null otherwise", default: null }
      - { name: retired_on, type: datetime, source: computed, description: "Clock instant of the retirement transition; null while ACTIVE", default: null }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Certified technician name" }
      - { name: epa_certification_number, type: string, source: input, description: "Section 608 certification number", constraints: "globally unique; ERR_DUPLICATE_IDENTIFIER on collision" }
      - { name: certification_type, type: enum, source: input, description: "Section 608 certification class held", constraints: "TYPE_I | TYPE_II | TYPE_III | UNIVERSAL" }
      - { name: certification_expires_on, type: datetime, source: input, description: "ISO 8601 UTC expiry instant of the certification" }
      - { name: status, type: enum, source: computed, description: "Employment/eligibility state", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }
      - { name: suspension_reason_code, type: string, source: computed, description: "Reason code recorded by the last status-change to SUSPENDED; null while ACTIVE", default: null }
      - { name: repair_attempt_count, type: integer, source: computed, description: "Count of RepairAttempt rows whose technician_id == this Technician.id", default: 0 }

  - name: RecoveryEquipment
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store the recovery machine is stationed at" }
      - { name: assigned_technician_id, type: string, source: input, description: "FK -> Technician.id; custodian of the machine (informational; does not constrain who may use it)" }
      - { name: equipment_serial, type: string, source: input, description: "Manufacturer serial of the recovery machine", constraints: "globally unique; ERR_DUPLICATE_IDENTIFIER on collision" }
      - { name: certified_to_standard, type: enum, source: input, description: "Recovery efficiency standard the machine is certified against", constraints: "AHRI_740_2016 | AHRI_740_1998" }
      - { name: certified_for_pressure_class, type: enum, source: input, description: "Pressure class the machine is certified to recover", constraints: "LOW | HIGH | VERY_HIGH" }
      - { name: last_verification_on, type: datetime, source: input, description: "ISO 8601 UTC instant of the last annual equipment verification" }
      - { name: status, type: enum, source: computed, description: "Verification standing; VERIFICATION_OVERDUE blocks all service work", default: CERTIFIED, constraints: "CERTIFIED | VERIFICATION_OVERDUE" }

  - name: Cylinder
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store holding the cylinder" }
      - { name: refrigerant_type_id, type: string, source: input, description: "FK -> RefrigerantType.id; chemistry the cylinder holds" }
      - { name: cylinder_serial, type: string, source: input, description: "DOT cylinder serial", constraints: "globally unique; ERR_DUPLICATE_IDENTIFIER on collision" }
      - { name: nominal_capacity_lbs, type: number, source: input, description: "DOT nominal capacity in pounds", constraints: "> 0; 1 decimal" }
      - { name: initial_contents_lbs, type: number, source: input, description: "Contents at registration", constraints: ">= 0 and <= nominal_capacity_lbs * 0.80; 1 decimal" }
      - { name: current_contents_lbs, type: number, source: computed, description: "initial_contents_lbs - SUM(added) + SUM(recovered) over non-voided ServiceRecord rows citing this cylinder, then overwritten by reclaim shipment (0.0) and reclaim certification (reclaimed_quantity_lbs); 1 decimal" }
      - { name: shipped_for_reclaim_lbs, type: number, source: computed, description: "Mass handed to the reclaimer and not yet certified back; 1 decimal", default: 0.0 }
      - { name: fill_limit_lbs, type: number, source: computed, description: "nominal_capacity_lbs * 0.80, rounded half-up to 1 decimal (DOT 80 percent fill rule)" }
      - { name: disposition, type: enum, source: computed, description: "Cylinder lifecycle state", default: VIRGIN, constraints: "VIRGIN | RECOVERED | SENT_FOR_RECLAIM | RECLAIMED" }
      - { name: shipped_on, type: datetime, source: computed, description: "Clock instant of the reclaim shipment; null before", default: null }
      - { name: reclaimer_name, type: string, source: input, description: "EPA-certified reclaimer that received the cylinder; set by the shipment call, re-asserted by the certification call", default: null }
      - { name: reclaim_certificate_number, type: string, source: input, description: "Reclaimer certificate number; null until certification", default: null }
      - { name: reclaimed_quantity_lbs, type: number, source: input, description: "Mass certified as reclaimed to AHRI-700 purity; null until certification", default: null }
      - { name: purity_verified, type: boolean, source: input, description: "Reclaimer attestation that AHRI-700 purity was met", default: null }
      - { name: reclaim_issued_on, type: datetime, source: input, description: "Certificate issue instant reported by the reclaimer", default: null }

  - name: ServiceRecord
    parent: null
    common_fields: true
    fields:
      - { name: system_id, type: string, source: input, description: "FK -> RefrigerantSystem.id; system serviced" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; must equal X-User-ID of the acting Technician" }
      - { name: recovery_equipment_id, type: string, source: input, description: "FK -> RecoveryEquipment.id; machine used for recovery/evacuation" }
      - { name: cylinder_id, type: string, source: input, description: "FK -> Cylinder.id; cylinder charged from or recovered into; required when refrigerant_added_lbs > 0 or refrigerant_recovered_lbs > 0", default: null }
      - { name: leak_event_id, type: string, source: input, description: "FK -> LeakEvent.id; set when the work is attributable to an open leak event", default: null }
      - { name: service_type, type: enum, source: input, description: "Nature of the work performed", constraints: "ADD_REFRIGERANT | RECOVER_REFRIGERANT | LEAK_REPAIR | RETROFIT_CONVERSION | ROUTINE_MAINTENANCE" }
      - { name: refrigerant_added_lbs, type: number, source: input, description: "Mass moved cylinder -> system", default: 0.0, constraints: ">= 0; 1 decimal" }
      - { name: refrigerant_recovered_lbs, type: number, source: input, description: "Mass moved system -> cylinder", default: 0.0, constraints: ">= 0; 1 decimal" }
      - { name: refrigerant_lost_lbs, type: number, source: input, description: "Mass quantified as vented/lost system -> atmosphere", default: 0.0, constraints: ">= 0; 1 decimal" }
      - { name: performed_at, type: datetime, source: input, description: "ISO 8601 UTC start instant of the service visit", constraints: ">= system.installed_on and <= logical clock" }
      - { name: duration_minutes, type: integer, source: input, description: "On-site duration in whole minutes", constraints: ">= 1 and <= 1440" }
      - { name: occupies_until, type: datetime, source: computed, description: "performed_at + duration_minutes; end of the technician/equipment occupation interval" }
      - { name: equipment_released_at, type: datetime, source: computed, description: "occupies_until + 60 minutes decontamination buffer; the buffered end used when the next job on the same machine carries a different refrigerant_type_id" }
      - { name: system_charge_after_lbs, type: number, source: computed, description: "Snapshot of RefrigerantSystem.current_charge_lbs immediately after this record was applied; 1 decimal" }
      - { name: leak_rate_pct_after, type: number, source: computed, description: "Snapshot of RefrigerantSystem.leak_rate_pct immediately after this record was applied; 1 decimal" }
      - { name: retention_until, type: datetime, source: computed, description: "performed_at + 3 calendar years; raised to linked_leak_event.closed_at + 3 calendar years when the linked LeakEvent closes" }
      - { name: voided, type: boolean, source: computed, description: "True once the record has been compensated by the void endpoint", default: false }
      - { name: voided_at, type: datetime, source: computed, description: "Clock instant of the void; null while voided == false", default: null }
      - { name: void_reason_code, type: string, source: computed, description: "Reason code supplied to the void endpoint; null while voided == false", default: null }

  - name: LeakEvent
    parent: null
    common_fields: true
    fields:
      - { name: system_id, type: string, source: input, description: "FK -> RefrigerantSystem.id; system whose leak rate crossed the threshold" }
      - { name: triggering_service_record_id, type: string, source: system, description: "FK -> ServiceRecord.id; the ADD_REFRIGERANT / LEAK_REPAIR record whose leak-rate recomputation opened this event; null for manually declared events", default: null }
      - { name: detected_at, type: datetime, source: input, description: "ISO 8601 UTC detection instant; equals the triggering record's performed_at for cascaded events" }
      - { name: detection_method, type: enum, source: input, description: "How the exceedance was found", constraints: "LEAK_RATE_CALCULATION | MANUAL_INSPECTION | AUTOMATED_MONITORING" }
      - { name: leak_rate_pct_at_detection, type: number, source: computed, description: "RefrigerantSystem.leak_rate_pct at the moment of detection; 1 decimal" }
      - { name: threshold_pct_applied, type: number, source: computed, description: "RefrigerantSystem.threshold_pct frozen at detection; 1 decimal" }
      - { name: initial_repair_deadline, type: datetime, source: computed, description: "detected_at + 30 days; never moves once stamped" }
      - { name: repair_deadline, type: datetime, source: computed, description: "initial_repair_deadline + extension_days_granted_total days; the enforced deadline" }
      - { name: verification_deadline, type: datetime, source: computed, description: "newest RepairAttempt.repair_completed_at + 10 days; null until the first repair attempt", default: null }
      - { name: extension_days_granted_total, type: integer, source: computed, description: "Sum of granted_days over this event's ExtensionRequest rows with status == APPROVED", default: 0 }
      - { name: extension_days_remaining, type: integer, source: computed, description: "30 - extension_days_granted_total; the conserved half of the extension day budget", default: 30 }
      - { name: repair_attempt_count, type: integer, source: computed, description: "Count of RepairAttempt rows on this event", default: 0 }
      - { name: failed_verification_count, type: integer, source: computed, description: "Count of VerificationTest rows on this event with result == FAIL", default: 0 }
      - { name: last_repair_completed_at, type: datetime, source: computed, description: "repair_completed_at of the newest RepairAttempt on this event; null until the first attempt", default: null }
      - { name: late_repair_flag, type: boolean, source: computed, description: "True when any RepairAttempt on this event has was_late == true", default: false }
      - { name: status, type: enum, source: computed, description: "Compliance lifecycle state", default: OPEN, constraints: "OPEN | VERIFICATION_PENDING | FOLLOWUP_PENDING | VERIFICATION_FAILED | REPAIR_OVERDUE | VERIFICATION_OVERDUE | RETROFIT_MANDATED | VERIFIED_CLOSED | VOIDED" }
      - { name: closed_at, type: datetime, source: computed, description: "Clock instant the event reached VERIFIED_CLOSED or VOIDED; null while open", default: null }

  - name: RepairAttempt
    parent: null
    common_fields: false
    fields:
      - { name: leak_event_id, type: string, source: input, description: "FK -> LeakEvent.id; event being repaired" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; must equal X-User-ID of the acting Technician" }
      - { name: recovery_equipment_id, type: string, source: input, description: "FK -> RecoveryEquipment.id; machine used during the repair" }
      - { name: attempt_number, type: integer, source: computed, description: "1-based ordinal among this event's attempts ordered by repair_completed_at ASC, created_at ASC" }
      - { name: repair_method_code, type: enum, source: input, description: "Repair technique applied", constraints: "BRAZE_JOINT | REPLACE_VALVE | REPLACE_GASKET | TIGHTEN_FITTING | REPLACE_COIL" }
      - { name: repair_completed_at, type: datetime, source: input, description: "ISO 8601 UTC instant the repair was finished", constraints: ">= leak_event.detected_at and <= logical clock" }
      - { name: was_late, type: boolean, source: computed, description: "True when repair_completed_at > leak_event.repair_deadline as of this write", default: false }
      - { name: outcome, type: enum, source: computed, description: "Verification standing of this attempt", default: AWAITING_VERIFICATION, constraints: "AWAITING_VERIFICATION | VERIFIED | FAILED_VERIFICATION | SUPERSEDED" }

  - name: VerificationTest
    parent: null
    common_fields: false
    fields:
      - { name: leak_event_id, type: string, source: input, description: "FK -> LeakEvent.id; event being verified" }
      - { name: repair_attempt_id, type: string, source: input, description: "FK -> RepairAttempt.id; the attempt under test; must be the newest attempt on the event with outcome == AWAITING_VERIFICATION" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; must equal X-User-ID of the acting Technician" }
      - { name: test_method_code, type: enum, source: input, description: "Verification test technique", constraints: "PRESSURE_DECAY | ELECTRONIC_DETECTOR | BUBBLE_TEST | ULTRASONIC" }
      - { name: performed_at, type: datetime, source: input, description: "ISO 8601 UTC instant the test was run", constraints: ">= repair_attempt.repair_completed_at and <= logical clock" }
      - { name: result, type: enum, source: input, description: "Test outcome", constraints: "PASS | FAIL" }
      - { name: measured_leak_rate_pct, type: number, source: input, description: "Instrument-measured leak rate at test time", default: null, constraints: ">= 0; 1 decimal" }
      - { name: test_sequence, type: enum, source: computed, description: "INITIAL_VERIFICATION when the event was IN {VERIFICATION_PENDING, VERIFICATION_OVERDUE} at write time; FOLLOWUP_VERIFICATION when it was FOLLOWUP_PENDING", constraints: "INITIAL_VERIFICATION | FOLLOWUP_VERIFICATION" }
      - { name: was_late, type: boolean, source: computed, description: "True when performed_at > leak_event.verification_deadline as of this write", default: false }

  - name: ExtensionRequest
    parent: null
    common_fields: true
    fields:
      - { name: leak_event_id, type: string, source: input, description: "FK -> LeakEvent.id; event whose repair_deadline the request targets" }
      - { name: reason_code, type: enum, source: input, description: "Statutory extension ground", constraints: "PARTS_UNAVAILABLE | INDUSTRIAL_PROCESS_SHUTDOWN_REQUIRED | PERMIT_PENDING | SUPPLY_CHAIN_DELAY" }
      - { name: requested_days, type: integer, source: input, description: "Additional repair days requested", constraints: ">= 1 and <= 30" }
      - { name: justification, type: string, source: input, description: "Narrative justification filed with the agency", constraints: "length >= 10" }
      - { name: granted_days, type: integer, source: computed, description: "Days actually granted by the Regulator; null unless status == APPROVED", default: null }
      - { name: requested_at, type: datetime, source: computed, description: "Clock instant at creation" }
      - { name: expires_at, type: datetime, source: computed, description: "requested_at + 15 days; a still-PENDING request is swept to EXPIRED past this instant" }
      - { name: decided_at, type: datetime, source: computed, description: "Clock instant of the Regulator decision; null while PENDING", default: null }
      - { name: revoked_at, type: datetime, source: computed, description: "Clock instant of revocation; null unless status == REVOKED", default: null }
      - { name: revocation_reason_code, type: string, source: computed, description: "Reason code supplied to the revocation call; null unless status == REVOKED", default: null }
      - { name: deadline_before, type: datetime, source: computed, description: "Snapshot of leak_event.repair_deadline taken at creation, used to restore the deadline on revocation" }
      - { name: deadline_after, type: datetime, source: computed, description: "leak_event.repair_deadline immediately after the grant; null unless the request was ever APPROVED", default: null }
      - { name: status, type: enum, source: computed, description: "Request lifecycle state", default: PENDING, constraints: "PENDING | APPROVED | DENIED | EXPIRED | REVOKED" }

  - name: RetrofitPlan
    parent: null
    common_fields: true
    fields:
      - { name: system_id, type: string, source: input, description: "FK -> RefrigerantSystem.id; system to be retrofitted or retired" }
      - { name: target_refrigerant_type_id, type: string, source: input, description: "FK -> RefrigerantType.id; lower-GWP target chemistry; required when plan_type == RETROFIT, must be null when plan_type == RETIRE", default: null }
      - { name: plan_type, type: enum, source: input, description: "Conversion strategy", constraints: "RETROFIT | RETIRE" }
      - { name: due_on, type: datetime, source: input, description: "Operator-committed completion instant filed with the agency", constraints: "> logical clock at creation" }
      - { name: estimated_cost_usd, type: number, source: input, description: "Capital estimate filed with the plan", constraints: ">= 0.01 and <= 5000000.00; 2 decimals" }
      - { name: gwp_reduction_pct, type: number, source: computed, description: "round_half_up((source_gwp - target_gwp) / source_gwp * 100, 1), floored at 0.0; 0.0 for RETIRE plans" }
      - { name: compatibility_score, type: number, source: computed, description: "Weighted equipment-compatibility score (calc retrofit_compatibility_score); 1 decimal; 100.0 for RETIRE plans" }
      - { name: compatibility_result, type: enum, source: computed, description: "COMPATIBLE when compatibility_score >= 75.0; CONDITIONALLY_COMPATIBLE when >= 50.0; else INCOMPATIBLE", constraints: "COMPATIBLE | CONDITIONALLY_COMPATIBLE | INCOMPATIBLE" }
      - { name: mandated, type: boolean, source: computed, description: "True when the system's compliance_state was RETROFIT_MANDATED at plan creation", default: false }
      - { name: submitted_at, type: datetime, source: computed, description: "Clock instant of the newest submission; null while never submitted", default: null }
      - { name: submission_count, type: integer, source: computed, description: "Number of times the plan has been submitted (a resubmission after REJECTED increments it)", default: 0 }
      - { name: decided_at, type: datetime, source: computed, description: "Clock instant of the newest Regulator decision; null before", default: null }
      - { name: rejection_reason_code, type: string, source: computed, description: "Reason code from the newest REJECT decision; null otherwise", default: null }
      - { name: completed_at, type: datetime, source: computed, description: "Clock instant of the completion call; null before", default: null }
      - { name: status, type: enum, source: computed, description: "Plan lifecycle state", default: DRAFT, constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | IN_PROGRESS | COMPLETED | SUPERSEDED" }

  - name: RegulatoryReport
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; reporting entity" }
      - { name: report_type, type: enum, source: input, description: "Filing type", constraints: "ANNUAL_LEAK_RATE | CHRONIC_LEAKER_NOTIFICATION | RETROFIT_NOTIFICATION" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the reporting period" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive end of the reporting period", constraints: "> period_start" }
      - { name: leaked_lbs_method, type: enum, source: input, description: "Industry method used to quantify leaked mass for the period", constraints: "CHARGE_BASED | BALANCE_BASED" }
      - { name: total_leaked_lbs, type: number, source: computed, description: "Leaked mass for the period under leaked_lbs_method (calc store_period_leaked_lbs); 1 decimal" }
      - { name: included_system_count, type: integer, source: computed, description: "Count of the store's RefrigerantSystem rows with applicability == REGULATED and installed_on <= period_end that entered the computation" }
      - { name: due_on, type: datetime, source: computed, description: "period_end + 60 days filing grace" }
      - { name: submitted_at, type: datetime, source: computed, description: "Clock instant of the newest submission; null while DRAFT and never submitted", default: null }
      - { name: submission_count, type: integer, source: computed, description: "Number of submissions (a resubmission after REJECTED increments it)", default: 0 }
      - { name: days_late, type: integer, source: computed, description: "Whole days from due_on to submitted_at, floored at 0; 0 until submitted", default: 0 }
      - { name: base_assessment_usd, type: number, source: computed, description: "165.00 * days_late; 2 decimals", default: 0.00 }
      - { name: administrative_surcharge_usd, type: number, source: computed, description: "Bracketed surcharge on base_assessment_usd (calc late_filing_assessment); 2 decimals", default: 0.00 }
      - { name: late_filing_assessment_usd, type: number, source: computed, description: "base_assessment_usd + administrative_surcharge_usd; 2 decimals", default: 0.00 }
      - { name: decided_at, type: datetime, source: computed, description: "Clock instant of the newest Regulator decision; null before", default: null }
      - { name: rejection_reason_code, type: string, source: computed, description: "Reason code from the newest REJECT decision; null otherwise", default: null }
      - { name: status, type: enum, source: computed, description: "Filing lifecycle state", default: DRAFT, constraints: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; inspected store" }
      - { name: inspector_name, type: string, source: input, description: "Agency inspector of record" }
      - { name: citations, type: array, source: input, description: "Array of objects { citation_code: string, severity: MINOR|MODERATE|MAJOR, violation_days: integer >= 0 }; may be empty", default: [] }
      - { name: opened_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the Regulator that opened the inspection (operator identifier, not an entity id)" }
      - { name: opened_at, type: datetime, source: computed, description: "Clock instant at creation" }
      - { name: response_deadline, type: datetime, source: computed, description: "opened_at + 30 days" }
      - { name: chronic_multiplier_applied, type: number, source: computed, description: "1.00 / 1.25 / 1.50 for store compliance_status COMPLIANT / AT_RISK / NON_COMPLIANT at the last recomputation; 2 decimals", default: 1.00 }
      - { name: penalty_exposure_usd, type: number, source: computed, description: "Per-citation-rounded exposure capped at 250000.00 (calc inspection_penalty_exposure); 2 decimals", default: 0.00 }
      - { name: capped, type: boolean, source: computed, description: "True when the uncapped sum exceeded 250000.00", default: false }
      - { name: responded_at, type: datetime, source: computed, description: "Clock instant of the store response; null before", default: null }
      - { name: response_summary, type: string, source: input, description: "Narrative response filed by the store; null before the response call", default: null }
      - { name: corrective_action_code, type: enum, source: input, description: "Corrective action asserted by the store; null before the response call", default: null, constraints: "REPAIRS_COMPLETED | RETROFIT_PLANNED | RECORDS_CORRECTED | TRAINING_COMPLETED" }
      - { name: escalated_at, type: datetime, source: computed, description: "Clock instant the response deadline lapsed during a compliance run; null otherwise", default: null }
      - { name: closed_at, type: datetime, source: computed, description: "Clock instant of closure; null before", default: null }
      - { name: closed_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the Regulator that closed the inspection; must differ from opened_by_user_id", default: null }
      - { name: closure_note, type: string, source: input, description: "Closure narrative; null before closure", default: null }
      - { name: status, type: enum, source: computed, description: "Inspection lifecycle state", default: OPEN, constraints: "OPEN | RESPONDED | ESCALATED | CLOSED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- RefrigerantSystem: axis 1 of 2 (operational_status) ------------------
  - entity: RefrigerantSystem
    state_field: operational_status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    note: |
      Axis 1 of two independent state dimensions on the same row. A system may
      be operational_status == ACTIVE while compliance_state == RETROFIT_MANDATED,
      or operational_status == RETIRED while compliance_state == RETIRED_EXEMPT.
      Nothing on axis 2 can move axis 1 and vice versa, except the single
      documented coupling in ACTIVE_to_RETIRED below.
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /systems/{id}/retirement"
        actor: ComplianceManager
        preconditions:
          - "system.operational_status == ACTIVE"
          - "system.current_charge_lbs == 0.0 exactly (all refrigerant recovered) else ERR_SYSTEM_CHARGE_NOT_RECOVERED"
          - "every LeakEvent with system_id == this system has status IN {VERIFIED_CLOSED, VOIDED} else ERR_OPEN_LEAK_EVENT_BLOCKS_RETIREMENT"
          - "when replacement_system_id is supplied it must resolve to a RefrigerantSystem with operational_status == ACTIVE and store_id == this system's store_id else ERR_CROSS_STORE_RESOURCE"
        side_effects:
          - "set retired_on = logical clock"
          - "set replaced_by_system_id = replacement_system_id when supplied"
          - "set compliance_state = RETIRED_EXEMPT (the only cross-axis coupling)"
          - "recompute Store.total_regulated_charge_lbs, Store.regulated_system_count, Store.compliance_status (calc store_compliance_posture)"
          - "increments RefrigerantSystem.version by 1"

  # ---- RefrigerantSystem: axis 2 of 2 (compliance_state) -------------------
  - entity: RefrigerantSystem
    state_field: compliance_state
    initial_state: COMPLIANT
    terminal_states: [RETIRED_EXEMPT]
    note: |
      Axis 2 is written only by cascades: it is never set by a request body.
      Precedence when several conditions hold at once (pinned, highest first):
      RETIRED_EXEMPT > RETROFIT_MANDATED > CHRONIC_EXCEEDANCE > LEAK_OPEN > COMPLIANT.
    transitions:
      - from: COMPLIANT
        to: LEAK_OPEN
        trigger: "system event: a LeakEvent is opened on this system (cascade from POST /service-records or POST /leak-events)"
        actor: system
        preconditions:
          - "system.applicability == REGULATED"
          - "system.exceedance_count_12mo < 2 after the new event is counted"
        side_effects:
          - "Store.open_leak_event_count += 1 and Store.compliance_status recomputed -> AT_RISK (calc store_compliance_posture)"
          - "every Inspection of the store with status IN {OPEN, RESPONDED, ESCALATED} recomputes chronic_multiplier_applied and penalty_exposure_usd (calc inspection_penalty_exposure)"
      - from: LEAK_OPEN
        to: CHRONIC_EXCEEDANCE
        trigger: "system event: a LeakEvent is opened while exceedance_count_12mo reaches 2 (cascade from POST /service-records or POST /leak-events)"
        actor: system
        preconditions:
          - "system.exceedance_count_12mo >= 2 after the new event is counted"
        side_effects:
          - "Store.chronic_leaker_flag = true and Store.compliance_status recomputed"
          - "every Inspection of the store with status IN {OPEN, RESPONDED, ESCALATED} recomputes penalty_exposure_usd"
      - from: LEAK_OPEN
        to: RETROFIT_MANDATED
        trigger: "system event: a LeakEvent on this system reaches RETROFIT_MANDATED (cascade from POST /verification-tests with result FAIL)"
        actor: system
        preconditions:
          - "the leak event's failed_verification_count >= 2"
        side_effects:
          - "set retrofit_due_on = logical clock + 90 days"
          - "Store.mandated_retrofit_count += 1, Store.chronic_leaker_flag = true, Store.compliance_status -> NON_COMPLIANT"
          - "every Inspection of the store with status IN {OPEN, RESPONDED, ESCALATED} recomputes chronic_multiplier_applied -> 1.50 and penalty_exposure_usd"
      - from: CHRONIC_EXCEEDANCE
        to: RETROFIT_MANDATED
        trigger: "system event: a LeakEvent on this system reaches RETROFIT_MANDATED (cascade from POST /verification-tests with result FAIL)"
        actor: system
        preconditions:
          - "the leak event's failed_verification_count >= 2"
        side_effects:
          - "set retrofit_due_on = logical clock + 90 days"
          - "Store.mandated_retrofit_count += 1, Store.compliance_status -> NON_COMPLIANT"
          - "every Inspection of the store with status IN {OPEN, RESPONDED, ESCALATED} recomputes penalty_exposure_usd"
      - from: RETROFIT_MANDATED
        to: COMPLIANT
        trigger: "POST /retrofit-plans/{id}/completion"
        actor: ComplianceManager
        preconditions:
          - "plan.status == IN_PROGRESS"
          - "no LeakEvent on this system has status IN {REPAIR_OVERDUE, VERIFICATION_OVERDUE}"
        side_effects:
          - "set refrigerant_type_id = plan.target_refrigerant_type_id when plan.plan_type == RETROFIT"
          - "set leak_rate_baseline_at = plan.completed_at, recompute leak_rate_pct, required_certification_type and threshold_pct"
          - "clear retrofit_due_on to null"
          - "every LeakEvent on this system with status == RETROFIT_MANDATED transitions to VERIFIED_CLOSED"
          - "Store.mandated_retrofit_count -= 1, Store.chronic_leaker_flag and Store.compliance_status recomputed"
          - "every Inspection of the store with status IN {OPEN, RESPONDED, ESCALATED} recomputes penalty_exposure_usd"
          - "increments RefrigerantSystem.version by 1"
      - from: LEAK_OPEN
        to: COMPLIANT
        trigger: "system event: the system's last non-terminal LeakEvent reaches VERIFIED_CLOSED or VOIDED (cascade from POST /verification-tests or POST /service-records/{id}/void)"
        actor: system
        preconditions:
          - "no LeakEvent on this system has status NOT IN {VERIFIED_CLOSED, VOIDED}"
          - "system.exceedance_count_12mo < 2"
        side_effects:
          - "Store.open_leak_event_count and Store.compliance_status recomputed"
          - "every Inspection of the store with status IN {OPEN, RESPONDED, ESCALATED} recomputes chronic_multiplier_applied and penalty_exposure_usd"
      - from: COMPLIANT
        to: RETIRED_EXEMPT
        trigger: "POST /systems/{id}/retirement"
        actor: ComplianceManager
        preconditions: ["see RefrigerantSystem.ACTIVE_to_RETIRED preconditions"]
        side_effects: ["Store aggregates recomputed"]
      - from: LEAK_OPEN
        to: RETIRED_EXEMPT
        trigger: "POST /systems/{id}/retirement (retirement executed against an APPROVED or IN_PROGRESS RETIRE plan while a leak event is still open)"
        actor: ComplianceManager
        preconditions:
          - "see RefrigerantSystem.ACTIVE_to_RETIRED preconditions"
          - "the retirement names an APPROVED or IN_PROGRESS RetrofitPlan with plan_type == RETIRE"
        side_effects:
          - "every non-terminal LeakEvent on this system transitions to VOIDED"
          - "Store.open_leak_event_count, Store.compliance_status and every live Inspection's penalty_exposure_usd recomputed"
      - from: RETROFIT_MANDATED
        to: RETIRED_EXEMPT
        trigger: "POST /systems/{id}/retirement (retire-instead-of-retrofit outcome)"
        actor: ComplianceManager
        preconditions:
          - "see RefrigerantSystem.ACTIVE_to_RETIRED preconditions"
          - "the retirement names an APPROVED or IN_PROGRESS RetrofitPlan with plan_type == RETIRE"
        side_effects:
          - "every LeakEvent on this system with status == RETROFIT_MANDATED transitions to VOIDED"
          - "Store.mandated_retrofit_count -= 1; Store.compliance_status and every live Inspection's penalty_exposure_usd recomputed"

  # ---- LeakEvent: cyclic + branching --------------------------------------
  - entity: LeakEvent
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED, VOIDED]
    note: |
      Cyclic: VERIFICATION_PENDING -> VERIFICATION_FAILED -> (new RepairAttempt)
      -> VERIFICATION_PENDING, and the self-loop VERIFICATION_PENDING ->
      VERIFICATION_PENDING when a second attempt supersedes an unverified one.
      Branching: a FAIL forks on failed_verification_count - below 2 it lands in
      VERIFICATION_FAILED (repairable), at 2 or more it lands in
      RETROFIT_MANDATED, and the two branches carry disjoint side-effect sets.
      A FAIL from VERIFICATION_OVERDUE forks identically.
      Verification is two-stage: the INITIAL test moves the event to
      FOLLOWUP_PENDING, only a FOLLOWUP PASS closes it.
    transitions:
      - from: NEW
        to: OPEN
        trigger: "POST /leak-events, or system event: leak-rate recomputation on POST /service-records yields leak_rate_pct >= system.threshold_pct"
        actor: ComplianceManager | system
        preconditions:
          - "system.operational_status == ACTIVE else ERR_SYSTEM_RETIRED"
          - "system.applicability == REGULATED else ERR_INVALID_REQUEST (exempt systems carry no leak obligation)"
          - "no LeakEvent on this system has status NOT IN {VERIFIED_CLOSED, VOIDED}; a manual POST is rejected with ERR_OPEN_LEAK_EVENT_EXISTS, and the cascade from POST /service-records silently creates nothing"
        side_effects:
          - "stamp leak_rate_pct_at_detection = system.leak_rate_pct and threshold_pct_applied = system.threshold_pct"
          - "stamp initial_repair_deadline = detected_at + 30 days and repair_deadline = initial_repair_deadline"
          - "set extension_days_remaining = 30, extension_days_granted_total = 0"
          - "cascade link 2: RefrigerantSystem.exceedance_count_12mo recomputed and compliance_state advances COMPLIANT -> LEAK_OPEN (or LEAK_OPEN -> CHRONIC_EXCEEDANCE at count 2)"
          - "cascade link 3: Store.open_leak_event_count / chronic_leaker_flag / compliance_status recomputed (calc store_compliance_posture)"
          - "cascade link 4: every Inspection of the store with status IN {OPEN, RESPONDED, ESCALATED} recomputes chronic_multiplier_applied and penalty_exposure_usd (calc inspection_penalty_exposure)"
      - from: OPEN
        to: VERIFICATION_PENDING
        trigger: "POST /repair-attempts"
        actor: Technician
        preconditions:
          - "leak_event.status == OPEN"
          - "repair_completed_at >= leak_event.detected_at else ERR_REPAIR_BEFORE_DETECTION"
          - "technician ACTIVE, certification unexpired and of an accepted type for the system"
        side_effects:
          - "RepairAttempt.attempt_number = leak_event.repair_attempt_count + 1, outcome = AWAITING_VERIFICATION"
          - "RepairAttempt.was_late = (repair_completed_at > leak_event.repair_deadline); leak_event.late_repair_flag ORed with it"
          - "leak_event.repair_attempt_count += 1, last_repair_completed_at = repair_completed_at"
          - "leak_event.verification_deadline = repair_completed_at + 10 days"
          - "Technician.repair_attempt_count += 1"
      - from: REPAIR_OVERDUE
        to: VERIFICATION_PENDING
        trigger: "POST /repair-attempts (late repair is accepted, never blocked)"
        actor: Technician
        preconditions: ["leak_event.status == REPAIR_OVERDUE", "repair_completed_at >= leak_event.detected_at"]
        side_effects:
          - "same attempt bookkeeping as OPEN_to_VERIFICATION_PENDING"
          - "leak_event.late_repair_flag = true"
          - "Store.overdue_leak_event_count recomputed; Store.compliance_status may fall back to AT_RISK; every Inspection of the store with status IN {OPEN, RESPONDED, ESCALATED} recomputes penalty_exposure_usd"
      - from: VERIFICATION_FAILED
        to: VERIFICATION_PENDING
        trigger: "POST /repair-attempts (re-repair after a failed verification)"
        actor: Technician
        preconditions: ["leak_event.status == VERIFICATION_FAILED", "leak_event.failed_verification_count < 2"]
        side_effects: ["same attempt bookkeeping as OPEN_to_VERIFICATION_PENDING"]
      - from: VERIFICATION_PENDING
        to: VERIFICATION_PENDING
        trigger: "POST /repair-attempts (second attempt filed before the pending attempt was verified)"
        actor: Technician
        preconditions: ["leak_event.status == VERIFICATION_PENDING"]
        side_effects:
          - "every RepairAttempt on this event with outcome == AWAITING_VERIFICATION is set to SUPERSEDED before the new row is written"
          - "leak_event.verification_deadline recomputed from the new repair_completed_at + 10 days"
      - from: VERIFICATION_PENDING
        to: FOLLOWUP_PENDING
        trigger: "POST /verification-tests with result == PASS"
        actor: Technician
        preconditions:
          - "repair_attempt_id is the newest RepairAttempt on the event with outcome == AWAITING_VERIFICATION else ERR_REPAIR_ATTEMPT_NOT_CURRENT"
          - "performed_at >= repair_attempt.repair_completed_at"
        side_effects:
          - "VerificationTest.test_sequence = INITIAL_VERIFICATION"
          - "VerificationTest.was_late = (performed_at > leak_event.verification_deadline)"
          - "leak_event.verification_deadline = performed_at + 10 days (window for the follow-up test)"
      - from: VERIFICATION_OVERDUE
        to: FOLLOWUP_PENDING
        trigger: "POST /verification-tests with result == PASS (late initial verification)"
        actor: Technician
        preconditions: ["leak_event.status == VERIFICATION_OVERDUE"]
        side_effects:
          - "VerificationTest.test_sequence = INITIAL_VERIFICATION, was_late = true"
          - "Store.overdue_leak_event_count recomputed; Store.compliance_status recomputed; every Inspection of the store with status IN {OPEN, RESPONDED, ESCALATED} recomputes penalty_exposure_usd"
      - from: FOLLOWUP_PENDING
        to: VERIFIED_CLOSED
        trigger: "POST /verification-tests with result == PASS"
        actor: Technician
        preconditions:
          - "leak_event.status == FOLLOWUP_PENDING"
          - "technician_id is NOT the technician_id of any RepairAttempt on this event else ERR_SEGREGATION_OF_DUTIES_VERIFICATION"
        side_effects:
          - "VerificationTest.test_sequence = FOLLOWUP_VERIFICATION"
          - "the newest AWAITING_VERIFICATION RepairAttempt outcome -> VERIFIED"
          - "leak_event.closed_at = logical clock"
          - "every non-voided ServiceRecord with leak_event_id == this event has retention_until raised to max(existing, closed_at + 3 calendar years)"
          - "RefrigerantSystem.leak_rate_baseline_at = performed_at, leak_rate_pct recomputed, compliance_state LEAK_OPEN -> COMPLIANT when no other non-terminal event remains and exceedance_count_12mo < 2"
          - "Store aggregates and every Inspection of the store with status IN {OPEN, RESPONDED, ESCALATED} recompute penalty_exposure_usd"
      - from: VERIFICATION_PENDING
        to: VERIFICATION_FAILED
        trigger: "POST /verification-tests with result == FAIL, failed_verification_count after increment < 2"
        actor: Technician
        preconditions: ["repair_attempt_id is the newest AWAITING_VERIFICATION attempt"]
        side_effects:
          - "leak_event.failed_verification_count += 1"
          - "the tested RepairAttempt outcome -> FAILED_VERIFICATION"
          - "no system or store field changes on this branch"
      - from: FOLLOWUP_PENDING
        to: VERIFICATION_FAILED
        trigger: "POST /verification-tests with result == FAIL, failed_verification_count after increment < 2"
        actor: Technician
        preconditions: ["leak_event.status == FOLLOWUP_PENDING"]
        side_effects: ["leak_event.failed_verification_count += 1", "the tested RepairAttempt outcome -> FAILED_VERIFICATION"]
      - from: VERIFICATION_PENDING
        to: RETROFIT_MANDATED
        trigger: "POST /verification-tests with result == FAIL, failed_verification_count after increment >= 2"
        actor: Technician
        preconditions: ["repair_attempt_id is the newest AWAITING_VERIFICATION attempt"]
        side_effects:
          - "cascade link 1: leak_event.failed_verification_count += 1 (reaches 2); the tested RepairAttempt outcome -> FAILED_VERIFICATION"
          - "cascade link 2: because the event reached RETROFIT_MANDATED, RefrigerantSystem.compliance_state -> RETROFIT_MANDATED and retrofit_due_on = logical clock + 90 days"
          - "cascade link 3: because the system became RETROFIT_MANDATED, Store.mandated_retrofit_count += 1, Store.chronic_leaker_flag = true and Store.compliance_status -> NON_COMPLIANT"
          - "cascade link 4: because the store became NON_COMPLIANT, every Inspection of the store with status IN {OPEN, RESPONDED, ESCALATED} recomputes chronic_multiplier_applied -> 1.50 and penalty_exposure_usd"
      - from: FOLLOWUP_PENDING
        to: RETROFIT_MANDATED
        trigger: "POST /verification-tests with result == FAIL, failed_verification_count after increment >= 2"
        actor: Technician
        preconditions: ["leak_event.status == FOLLOWUP_PENDING"]
        side_effects: ["identical four-link cascade as VERIFICATION_PENDING_to_RETROFIT_MANDATED"]
      - from: VERIFICATION_OVERDUE
        to: VERIFICATION_FAILED
        trigger: "POST /verification-tests with result == FAIL, failed_verification_count after increment < 2"
        actor: Technician
        preconditions: ["leak_event.status == VERIFICATION_OVERDUE"]
        side_effects: ["leak_event.failed_verification_count += 1", "VerificationTest.was_late = true", "Store.overdue_leak_event_count and compliance_status recomputed"]
      - from: OPEN
        to: REPAIR_OVERDUE
        trigger: "POST /compliance-runs (sweep step 1: repair_deadline < as_of)"
        actor: system
        preconditions: ["leak_event.repair_deadline < as_of instant of the run"]
        side_effects:
          - "Store.overdue_leak_event_count += 1 and Store.compliance_status -> NON_COMPLIANT"
          - "every Inspection of the store with status IN {OPEN, RESPONDED, ESCALATED} recomputes chronic_multiplier_applied -> 1.50 and penalty_exposure_usd"
      - from: VERIFICATION_FAILED
        to: REPAIR_OVERDUE
        trigger: "POST /compliance-runs (sweep step 1: repair_deadline < as_of)"
        actor: system
        preconditions: ["leak_event.repair_deadline < as_of instant of the run"]
        side_effects: ["Store.overdue_leak_event_count += 1 and Store.compliance_status -> NON_COMPLIANT", "open Inspections recompute penalty_exposure_usd"]
      - from: VERIFICATION_PENDING
        to: VERIFICATION_OVERDUE
        trigger: "POST /compliance-runs (sweep step 2: verification_deadline < as_of)"
        actor: system
        preconditions: ["leak_event.verification_deadline is not null and < as_of instant of the run"]
        side_effects: ["Store.overdue_leak_event_count += 1 and Store.compliance_status -> NON_COMPLIANT", "open Inspections recompute penalty_exposure_usd"]
      - from: FOLLOWUP_PENDING
        to: VERIFICATION_OVERDUE
        trigger: "POST /compliance-runs (sweep step 2: verification_deadline < as_of)"
        actor: system
        preconditions: ["leak_event.verification_deadline < as_of instant of the run"]
        side_effects: ["Store.overdue_leak_event_count += 1 and Store.compliance_status -> NON_COMPLIANT", "open Inspections recompute penalty_exposure_usd"]
      - from: RETROFIT_MANDATED
        to: VERIFIED_CLOSED
        trigger: "POST /retrofit-plans/{id}/completion"
        actor: ComplianceManager
        preconditions: ["plan.system_id == leak_event.system_id", "plan.status == IN_PROGRESS"]
        side_effects:
          - "leak_event.closed_at = logical clock"
          - "RefrigerantSystem.compliance_state RETROFIT_MANDATED -> COMPLIANT, retrofit_due_on -> null"
          - "Store.mandated_retrofit_count -= 1 and Store.compliance_status recomputed"
          - "open Inspections recompute penalty_exposure_usd"
      - from: OPEN
        to: VOIDED
        trigger: "POST /service-records/{id}/void (compensation of the record that opened the event)"
        actor: ComplianceManager
        preconditions:
          - "leak_event.triggering_service_record_id == the voided record's id"
          - "leak_event.repair_attempt_count == 0 and no VerificationTest references the event else ERR_VOID_NOT_PERMITTED"
        side_effects:
          - "leak_event.closed_at = logical clock"
          - "RefrigerantSystem.exceedance_count_12mo recomputed (the VOIDED event drops out) and compliance_state LEAK_OPEN -> COMPLIANT"
          - "Store.open_leak_event_count / chronic_leaker_flag / compliance_status recomputed"
          - "open Inspections recompute chronic_multiplier_applied and penalty_exposure_usd"
      - from: REPAIR_OVERDUE
        to: VOIDED
        trigger: "POST /service-records/{id}/void"
        actor: ComplianceManager
        preconditions: ["same as OPEN_to_VOIDED"]
        side_effects: ["same as OPEN_to_VOIDED plus Store.overdue_leak_event_count recomputed"]

  # ---- ExtensionRequest: branching + compensation --------------------------
  - entity: ExtensionRequest
    initial_state: PENDING
    terminal_states: [DENIED, EXPIRED, REVOKED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /extension-requests/{id}/decision with decision == APPROVE"
        actor: Regulator
        preconditions:
          - "request.status == PENDING else ERR_INVALID_STATE_TRANSITION"
          - "granted_days <= request.requested_days else ERR_GRANTED_DAYS_EXCEED_REQUESTED"
          - "granted_days <= leak_event.extension_days_remaining else ERR_EXTENSION_DAY_CAP_EXCEEDED"
          - "leak_event.status NOT IN {VERIFIED_CLOSED, VOIDED} else ERR_LEAK_EVENT_TERMINAL"
        side_effects:
          - "set granted_days, decided_at = logical clock"
          - "leak_event.extension_days_granted_total += granted_days; leak_event.extension_days_remaining = 30 - extension_days_granted_total"
          - "leak_event.repair_deadline = initial_repair_deadline + extension_days_granted_total days; record deadline_after"
          - "if leak_event.status == REPAIR_OVERDUE and the new repair_deadline >= logical clock, leak_event returns to OPEN and Store.overdue_leak_event_count / compliance_status are recomputed"
      - from: PENDING
        to: DENIED
        trigger: "POST /extension-requests/{id}/decision with decision == DENY"
        actor: Regulator
        preconditions: ["request.status == PENDING"]
        side_effects: ["set decided_at = logical clock", "granted_days stays null; leak_event.repair_deadline unchanged"]
      - from: PENDING
        to: EXPIRED
        trigger: "POST /compliance-runs (sweep step 3: expires_at < as_of)"
        actor: system
        preconditions: ["request.status == PENDING and request.expires_at < as_of instant of the run"]
        side_effects: ["no deadline movement; the leak event keeps its current repair_deadline"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /extension-requests/{id}/revocation (compensating action)"
        actor: Regulator
        preconditions: ["request.status == APPROVED", "leak_event.status NOT IN {VERIFIED_CLOSED, VOIDED}"]
        side_effects:
          - "set revoked_at = logical clock and revocation_reason_code"
          - "leak_event.extension_days_granted_total -= granted_days; leak_event.extension_days_remaining = 30 - extension_days_granted_total (the budget invariant granted_total + remaining == 30 holds before and after)"
          - "leak_event.repair_deadline restored to request.deadline_before exactly (no drift)"
          - "if the restored repair_deadline < logical clock the leak event moves OPEN -> REPAIR_OVERDUE and Store.overdue_leak_event_count / compliance_status are recomputed"

  # ---- RetrofitPlan: branching with revert (cyclic) ------------------------
  - entity: RetrofitPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED]
    note: "SUBMITTED -> REJECTED -> SUBMITTED is a true loop; submission_count counts the laps."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /retrofit-plans/{id}/submission"
        actor: ComplianceManager
        preconditions:
          - "plan.status IN {DRAFT, REJECTED}"
          - "plan.compatibility_result != INCOMPATIBLE else ERR_RETROFIT_INCOMPATIBLE"
          - "target RefrigerantType.phasedown_status != PROHIBITED else ERR_TARGET_REFRIGERANT_PROHIBITED"
          - "system.operational_status == ACTIVE else ERR_SYSTEM_RETIRED"
        side_effects: ["submitted_at = logical clock", "submission_count += 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /retrofit-plans/{id}/submission (resubmission after rejection)"
        actor: ComplianceManager
        preconditions: ["plan.status == REJECTED", "plan.compatibility_result != INCOMPATIBLE"]
        side_effects: ["submitted_at = logical clock", "submission_count += 1", "rejection_reason_code cleared to null"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /retrofit-plans/{id}/decision with decision == APPROVE"
        actor: Regulator
        preconditions: ["plan.status == SUBMITTED"]
        side_effects: ["decided_at = logical clock"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /retrofit-plans/{id}/decision with decision == REJECT"
        actor: Regulator
        preconditions: ["plan.status == SUBMITTED", "rejection_reason_code supplied else ERR_INVALID_REQUEST"]
        side_effects: ["decided_at = logical clock", "rejection_reason_code stored"]
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /service-records with service_type == RETROFIT_CONVERSION on the plan's system"
        actor: Technician
        preconditions: ["exactly one RetrofitPlan on the system has status == APPROVED"]
        side_effects: ["plan.status -> IN_PROGRESS (cross-entity bubble-up from the service ledger)"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /retrofit-plans/{id}/completion"
        actor: ComplianceManager
        preconditions:
          - "plan.status == IN_PROGRESS"
          - "no LeakEvent on the plan's system has status IN {REPAIR_OVERDUE, VERIFICATION_OVERDUE}"
        side_effects:
          - "completed_at = logical clock"
          - "system refrigerant_type_id / leak_rate_baseline_at / required_certification_type / threshold_pct / compliance_state updated per RefrigerantSystem.RETROFIT_MANDATED_to_COMPLIANT"
          - "every LeakEvent on the system with status == RETROFIT_MANDATED -> VERIFIED_CLOSED"
          - "increments RefrigerantSystem.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /retrofit-plans (a newer plan is filed for the same system)"
        actor: ComplianceManager
        preconditions: ["the superseded plan.status == DRAFT"]
        side_effects: ["status -> SUPERSEDED; the plan can never be submitted again"]

  # ---- RegulatoryReport: cyclic resubmission -------------------------------
  - entity: RegulatoryReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /regulatory-reports/{id}/submission"
        actor: ComplianceManager
        preconditions: ["report.status IN {DRAFT, REJECTED}"]
        side_effects:
          - "submitted_at = logical clock, submission_count += 1"
          - "total_leaked_lbs and included_system_count recomputed (calc store_period_leaked_lbs)"
          - "days_late, base_assessment_usd, administrative_surcharge_usd and late_filing_assessment_usd computed (calc late_filing_assessment)"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /regulatory-reports/{id}/decision with decision == ACCEPT"
        actor: Regulator
        preconditions: ["report.status == SUBMITTED"]
        side_effects: ["decided_at = logical clock"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /regulatory-reports/{id}/decision with decision == REJECT"
        actor: Regulator
        preconditions: ["report.status == SUBMITTED", "rejection_reason_code supplied"]
        side_effects: ["decided_at = logical clock", "rejection_reason_code stored", "the period stops blocking new report periods for the same store and report_type"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /regulatory-reports/{id}/submission (resubmission)"
        actor: ComplianceManager
        preconditions: ["report.status == REJECTED"]
        side_effects: ["submitted_at = logical clock, submission_count += 1, assessments recomputed at the new submission instant"]

  # ---- Inspection: branching + late-response loop --------------------------
  - entity: Inspection
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /inspections/{id}/response"
        actor: StoreManager
        preconditions: ["inspection.status == OPEN", "X-User-ID == inspection.store_id else ERR_STORE_SCOPE_VIOLATION"]
        side_effects: ["responded_at = logical clock, response_summary and corrective_action_code stored"]
      - from: OPEN
        to: ESCALATED
        trigger: "POST /compliance-runs (sweep step 5: response_deadline < as_of and status == OPEN)"
        actor: system
        preconditions: ["inspection.response_deadline < as_of instant of the run"]
        side_effects: ["escalated_at = logical clock", "penalty_exposure_usd recomputed with the store's current multiplier"]
      - from: ESCALATED
        to: RESPONDED
        trigger: "POST /inspections/{id}/response (late response)"
        actor: StoreManager
        preconditions: ["inspection.status == ESCALATED"]
        side_effects: ["responded_at = logical clock", "escalated_at retained as evidence of the lapse"]
      - from: RESPONDED
        to: CLOSED
        trigger: "POST /inspections/{id}/closure"
        actor: Regulator
        preconditions:
          - "inspection.status == RESPONDED"
          - "X-User-ID != inspection.opened_by_user_id else ERR_SEGREGATION_OF_DUTIES_INSPECTION"
        side_effects: ["closed_at = logical clock, closed_by_user_id = X-User-ID", "Store.penalty_exposure_total_usd recomputed (a CLOSED inspection leaves the exposure pool)"]

  # ---- Cylinder: linear chain of custody ----------------------------------
  - entity: Cylinder
    initial_state: VIRGIN
    terminal_states: []
    transitions:
      - from: VIRGIN
        to: RECOVERED
        trigger: "POST /service-records with refrigerant_recovered_lbs > 0 citing this cylinder"
        actor: Technician
        preconditions: ["cylinder.current_contents_lbs + refrigerant_recovered_lbs <= cylinder.fill_limit_lbs else ERR_CYLINDER_FILL_LIMIT_EXCEEDED"]
        side_effects: ["current_contents_lbs += refrigerant_recovered_lbs", "disposition -> RECOVERED (recovered refrigerant may not be recharged until reclaimed)"]
      - from: RECOVERED
        to: SENT_FOR_RECLAIM
        trigger: "POST /cylinders/{id}/reclaim-shipment"
        actor: ComplianceManager
        preconditions: ["cylinder.disposition == RECOVERED", "cylinder.current_contents_lbs > 0"]
        side_effects: ["shipped_for_reclaim_lbs = current_contents_lbs; current_contents_lbs = 0.0 (mass conserved across the two buckets)", "shipped_on = logical clock, reclaimer_name stored"]
      - from: SENT_FOR_RECLAIM
        to: RECLAIMED
        trigger: "POST /cylinders/{id}/reclaim-certification"
        actor: ComplianceManager
        preconditions:
          - "cylinder.disposition == SENT_FOR_RECLAIM"
          - "purity_verified == true else ERR_RECLAIM_PURITY_NOT_VERIFIED"
          - "reclaimed_quantity_lbs <= cylinder.shipped_for_reclaim_lbs else ERR_RECLAIM_QUANTITY_EXCEEDS_SHIPPED"
        side_effects:
          - "current_contents_lbs = reclaimed_quantity_lbs; shipped_for_reclaim_lbs -= reclaimed_quantity_lbs (the residue stays in the reclaim bucket, so total mass is unchanged)"
          - "reclaim_certificate_number, reclaimer_name, purity_verified, reclaim_issued_on stored"
          - "disposition -> RECLAIMED (the cylinder may again feed ADD_REFRIGERANT work)"

  # ---- Technician: cyclic eligibility ------------------------------------
  - entity: Technician
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /technicians/{id}/status-change with new_status == SUSPENDED"
        actor: ComplianceManager
        preconditions: ["technician.status == ACTIVE else ERR_INVALID_STATE_TRANSITION"]
        side_effects: ["suspension_reason_code stored", "all further ServiceRecord / RepairAttempt / VerificationTest writes by this technician fail with ERR_TECHNICIAN_SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /technicians/{id}/status-change with new_status == ACTIVE"
        actor: ComplianceManager
        preconditions: ["technician.status == SUSPENDED"]
        side_effects: ["suspension_reason_code cleared to null"]

  # ---- RecoveryEquipment: cyclic verification standing --------------------
  - entity: RecoveryEquipment
    initial_state: CERTIFIED
    terminal_states: []
    transitions:
      - from: CERTIFIED
        to: VERIFICATION_OVERDUE
        trigger: "POST /compliance-runs (sweep step 4: last_verification_on + 365 days < as_of)"
        actor: system
        preconditions: ["equipment.last_verification_on + 365 days < as_of instant of the run"]
        side_effects: ["all further ServiceRecord / RepairAttempt writes citing this machine fail with ERR_RECOVERY_EQUIPMENT_NOT_CERTIFIED"]
      - from: VERIFICATION_OVERDUE
        to: CERTIFIED
        trigger: "POST /recovery-equipment/{id}/verification"
        actor: ComplianceManager
        preconditions: ["verified_on <= logical clock else ERR_TIMESTAMP_AFTER_CLOCK"]
        side_effects: ["last_verification_on = verified_on", "status -> CERTIFIED"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on RefrigerantSystem.version only)
# =============================================================================
concurrency_rules:
  - rule_id: service-record-create-stale-system
    parent_entity: RefrigerantSystem
    write_endpoint: "POST /service-records"
    occ_field: "expected_system_version"
    description: |
      Recording service against a RefrigerantSystem whose version has advanced
      since the client last read it is rejected. A service record is a legitimate
      repeatable write - nothing in the state machine forbids a second record -
      so the only way to protect the charge projection and the rolling leak-rate
      recomputation from a stale client view is a version precondition on the
      parent system.
    error_id: ERR_STALE_SYSTEM_VERSION
    http_status: 412
  - rule_id: retrofit-plan-create-supersede-stale-system
    parent_entity: RefrigerantSystem
    write_endpoint: "POST /retrofit-plans"
    occ_field: "expected_system_version"
    description: |
      Creating a RetrofitPlan for a system whose version has advanced since the
      client last read it is rejected. A newly filed plan legitimately supersedes
      any DRAFT plan on the same system (RetrofitPlan.DRAFT_to_SUPERSEDED), so a
      second create would otherwise succeed and silently discard a plan the
      client never saw.
    error_id: ERR_STALE_SYSTEM_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: system_charge_projection
    trigger: "On POST /service-records, on POST /service-records/{id}/void, and on RetrofitPlan.IN_PROGRESS_to_COMPLETED; writes RefrigerantSystem.current_charge_lbs and ServiceRecord.system_charge_after_lbs"
    algorithm: projection
    formula: |
      current_charge_lbs = round_half_up(
          system.initial_charge_lbs
        + SUM(r.refrigerant_added_lbs     for r in ledger)
        - SUM(r.refrigerant_recovered_lbs for r in ledger)
        - SUM(r.refrigerant_lost_lbs      for r in ledger), 1)
      # ledger = ServiceRecord rows with system_id == system.id
      #          AND voided == false
      #          AND performed_at <= logical clock
      #          replayed in order (performed_at ASC, created_at ASC)
    input_set: "Non-voided ServiceRecord rows only; a voided record leaves the ledger and the projection is fully recomputed, never patched incrementally."
    constants:
      LEDGER_SORT: "performed_at ASC, created_at ASC (never id)"
    precision: "1 decimal place, round_half_up, decimal arithmetic"

  - name: system_leak_rate_pct
    trigger: "On POST /service-records (any record with refrigerant_added_lbs > 0), on POST /service-records/{id}/void, on LeakEvent.FOLLOWUP_PENDING_to_VERIFIED_CLOSED, and on RetrofitPlan.IN_PROGRESS_to_COMPLETED; writes RefrigerantSystem.leak_rate_pct and ServiceRecord.leak_rate_pct_after"
    algorithm: threshold
    formula: |
      # -- variant selected by system.leak_rate_method --------------------
      added_rolling = SUM(r.refrigerant_added_lbs for r in ledger
                          if r.performed_at >  clock - 365 days       # EXCLUSIVE lower bound
                          and r.performed_at <= clock)                # INCLUSIVE upper bound
      leak_rate_ROLLING_AVERAGE = round_half_up(added_rolling / system.full_charge_lbs * 100, 1)

      baseline      = system.leak_rate_baseline_at
      days_elapsed  = max(1, floor((clock - baseline) / 86400 seconds))
      added_since   = SUM(r.refrigerant_added_lbs for r in ledger
                          if r.performed_at > baseline and r.performed_at <= clock)
      leak_rate_ANNUALIZING = round_half_up(
          added_since / system.full_charge_lbs * (365 / days_elapsed) * 100, 1)

      # -- threshold comparison (>= , not >) ------------------------------
      threshold_pct = LEAK_THRESHOLDS[system.system_category]
      triggers_leak_event = (system.applicability == 'REGULATED'
                             and leak_rate_pct >= threshold_pct)
    input_set: "Only ServiceRecord rows with voided == false, service_type IN {ADD_REFRIGERANT, LEAK_REPAIR, RETROFIT_CONVERSION} and refrigerant_added_lbs > 0 enter either numerator. RECOVER_REFRIGERANT and ROUTINE_MAINTENANCE rows never do. Systems with applicability == EXEMPT still get a leak_rate_pct but never open a LeakEvent."
    constants:
      ROLLING_WINDOW_DAYS: 365
      ANNUALIZING_MIN_DAYS: 1
      LEAK_THRESHOLDS: { COMMERCIAL_REFRIGERATION: 20.0, INDUSTRIAL_PROCESS_REFRIGERATION: 30.0, COMFORT_COOLING: 10.0 }
    precision: "1 decimal place, round_half_up, applied once at the end of the selected variant"
    variants:
      - name: ROLLING_AVERAGE
        when: "system.leak_rate_method == ROLLING_AVERAGE (default)"
        difference: "Divides the trailing-365-day additions by the nameplate charge with no time normalisation; a slow chronic leak inside a long window is diluted."
      - name: ANNUALIZING
        when: "system.leak_rate_method == ANNUALIZING"
        difference: "Divides only the additions since leak_rate_baseline_at and multiplies by 365/days_elapsed, so a short interval since the last passing verification amplifies the same mass. Identical ledgers give different numbers: 10.0 lbs added on a 100.0 lb system 90 days after the baseline is 10.0 percent rolling but 40.6 percent annualized, which crosses a 20.0 threshold the rolling variant never reaches."

  - name: leak_deadline_schedule
    trigger: "On LeakEvent.NEW_to_OPEN, on every LeakEvent transition into VERIFICATION_PENDING or FOLLOWUP_PENDING, and on ExtensionRequest.PENDING_to_APPROVED / APPROVED_to_REVOKED; writes LeakEvent.initial_repair_deadline, repair_deadline and verification_deadline"
    algorithm: interval_merge
    formula: |
      initial_repair_deadline = detected_at + 30 days                     # stamped once, immutable
      repair_deadline         = initial_repair_deadline
                                + extension_days_granted_total days       # recomputed from scratch on every grant/revocation
      verification_deadline   = (newest RepairAttempt.repair_completed_at) + 10 days
      # after an INITIAL PASS the window is re-based for the follow-up test:
      verification_deadline   = (INITIAL VerificationTest.performed_at) + 10 days
      overdue_repair       = repair_deadline       < as_of      # strict <, so deadline == as_of is still on time
      overdue_verification = verification_deadline < as_of
    input_set: "extension_days_granted_total counts only ExtensionRequest rows with status == APPROVED; DENIED, EXPIRED and REVOKED rows contribute zero."
    constants:
      INITIAL_REPAIR_WINDOW_DAYS: 30
      VERIFICATION_WINDOW_DAYS: 10
      EXTENSION_DAY_CAP: 30
      EXTENSION_REQUEST_TTL_DAYS: 15
      RETROFIT_DUE_DAYS: 90
    precision: "Whole-day arithmetic on UTC instants; no timezone or DST adjustment"

  - name: extension_day_budget
    trigger: "On ExtensionRequest.PENDING_to_APPROVED and ExtensionRequest.APPROVED_to_REVOKED; writes LeakEvent.extension_days_granted_total and LeakEvent.extension_days_remaining"
    algorithm: aggregation
    formula: |
      extension_days_granted_total = SUM(er.granted_days for er in ExtensionRequest
                                         if er.leak_event_id == event.id
                                         and er.status == 'APPROVED')
      extension_days_remaining     = 30 - extension_days_granted_total
      # CONSERVED QUANTITY (invariant, must hold after every forward action and
      # after every compensating revocation):
      #   extension_days_granted_total + extension_days_remaining == 30
      # and repair_deadline == initial_repair_deadline + extension_days_granted_total days
    input_set: "APPROVED requests only. A REVOKED request drops out of the sum, which is what restores the deadline exactly."
    constants: { EXTENSION_DAY_CAP: 30 }
    precision: "Integer days"

  - name: total_refrigerant_mass_invariant
    trigger: "Audited on POST /service-records, POST /service-records/{id}/void, POST /cylinders/{id}/reclaim-shipment and POST /cylinders/{id}/reclaim-certification; no field stores it, every one of those calls must leave it unchanged"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY over one Store's four mass buckets:
      TOTAL_MASS(store) = round_half_up(
            SUM(sys.current_charge_lbs        for sys in store's RefrigerantSystem rows)
          + SUM(cyl.current_contents_lbs      for cyl in store's Cylinder rows)
          + SUM(cyl.shipped_for_reclaim_lbs   for cyl in store's Cylinder rows)
          + store.vented_loss_lbs, 1)
      # ADD_REFRIGERANT      : cylinder -> system            (TOTAL_MASS unchanged)
      # RECOVER_REFRIGERANT  : system   -> cylinder          (TOTAL_MASS unchanged)
      # refrigerant_lost_lbs : system   -> store.vented_loss_lbs (TOTAL_MASS unchanged)
      # reclaim shipment     : cylinder.current -> cylinder.shipped (TOTAL_MASS unchanged)
      # reclaim certification: cylinder.shipped -> cylinder.current, residue stays shipped
      # void                 : exact reversal of the record's three movements
    input_set: "All RefrigerantSystem and Cylinder rows of the store regardless of operational_status or disposition, plus the store's vented_loss_lbs accumulator."
    constants: {}
    precision: "1 decimal place, round_half_up; every movement is itself 1-decimal so no rounding drift is possible"

  - name: store_compliance_posture
    trigger: "On every LeakEvent status change, every RefrigerantSystem compliance_state or operational_status change, and on POST /compliance-runs; writes Store.compliance_status, chronic_leaker_flag, open_leak_event_count, overdue_leak_event_count, mandated_retrofit_count, total_regulated_charge_lbs, regulated_system_count, vented_loss_lbs, penalty_exposure_total_usd"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER inside a single request - the posture looks
      # circular (an inspection's multiplier reads the store posture, the store
      # posture reads system states, system states read leak events, and a leak
      # event was itself opened by the record being processed), so the order is
      # fixed and every step reads the values written by the previous step:
      #   1. system_charge_projection  (RefrigerantSystem.current_charge_lbs)
      #   2. system_leak_rate_pct      (RefrigerantSystem.leak_rate_pct)
      #   3. LeakEvent creation / status transitions
      #   4. RefrigerantSystem.exceedance_count_12mo then compliance_state
      #   5. Store aggregates + Store.compliance_status  (this formula)
      #   6. inspection_penalty_exposure for every Inspection of the store with
      #      status IN {OPEN, RESPONDED, ESCALATED}, reading the POST-update
      #      Store.compliance_status from step 5 (never the pre-update value)
      #   7. Store.penalty_exposure_total_usd = SUM of those exposures
      compliance_status =
        'NON_COMPLIANT' if (mandated_retrofit_count > 0 or overdue_leak_event_count > 0)
        else 'AT_RISK'  if (open_leak_event_count  > 0 or chronic_leaker_flag)
        else 'COMPLIANT'
      chronic_leaker_flag = ANY(sys.compliance_state IN {'CHRONIC_EXCEEDANCE','RETROFIT_MANDATED'})
    input_set: "Systems of the store regardless of operational_status for chronic/retrofit counts; only operational_status == ACTIVE AND applicability == REGULATED systems for total_regulated_charge_lbs and regulated_system_count. LeakEvent rows with status IN {VERIFIED_CLOSED, VOIDED} are excluded from both leak counts."
    constants: {}
    precision: "Integer counts; 1 decimal for charge sums; 2 decimals for penalty sums"

  - name: store_period_leaked_lbs
    trigger: "On POST /regulatory-reports and on every RegulatoryReport transition into SUBMITTED; writes RegulatoryReport.total_leaked_lbs and included_system_count"
    algorithm: aggregation
    formula: |
      included = [sys for sys in store's RefrigerantSystem rows
                  if sys.applicability == 'REGULATED'
                  and sys.installed_on <= report.period_end]
      window_end = min(report.period_end, logical clock)

      # variant CHARGE_BASED
      total_CHARGE_BASED = round_half_up(SUM(
          r.refrigerant_added_lbs
          for sys in included
          for r in non-voided ServiceRecord rows of sys
          if r.performed_at >= report.period_start          # INCLUSIVE both ends
          and r.performed_at <= window_end
          and r.service_type IN {'ADD_REFRIGERANT','LEAK_REPAIR','RETROFIT_CONVERSION'}), 1)

      # variant BALANCE_BASED
      charge_at(sys, t) = round_half_up(sys.initial_charge_lbs + SUM(
          added - recovered - lost for non-voided records of sys with performed_at <= t), 1)
      total_BALANCE_BASED = round_half_up(SUM(
            charge_at(sys, report.period_start)
          + SUM(r.refrigerant_added_lbs     in window)
          - SUM(r.refrigerant_recovered_lbs in window)
          - charge_at(sys, window_end)
          for sys in included), 1)
    input_set: "REGULATED systems installed on or before period_end; non-voided ServiceRecord rows only; boundaries inclusive on both ends of [period_start, min(period_end, clock)]. EXEMPT systems are excluded from both variants and from included_system_count."
    constants: {}
    precision: "1 decimal place, round_half_up, applied once per variant after the outer sum"
    variants:
      - name: CHARGE_BASED
        when: "report.leaked_lbs_method == CHARGE_BASED"
        difference: "Counts every pound added during the period as leaked. A top-up that restores a previously undercharged system is charged in full."
        # 80.0 lb opening on a 100.0 lb nameplate, one 20.0 lb top-up in period -> 20.0
      - name: BALANCE_BASED
        when: "report.leaked_lbs_method == BALANCE_BASED"
        difference: "Nets the opening and closing ledger charge against the additions, so mass that stayed in the system is not counted as leaked. Same ledger as above yields 80.0 + 20.0 - 0.0 - 100.0 == 0.0, a 20.0 lb divergence from CHARGE_BASED on identical data."

  - name: inspection_penalty_exposure
    trigger: "On POST /inspections, on POST /inspections/{id}/response, on Inspection.RESPONDED_to_ESCALATED (via POST /compliance-runs) and whenever store_compliance_posture step 6 runs; writes Inspection.penalty_exposure_usd and Store.penalty_exposure_total_usd"
    algorithm: tiered_pricing
    formula: |
      # PER-CITATION ROUNDING (combinatorial mode b): each citation is rounded to
      # 2 decimals on its own, THEN the rounded amounts are summed, THEN the cap
      # is applied. Summing the raw products and rounding once at the end gives a
      # different answer and is wrong.
      multiplier = PENALTY_MULTIPLIER[store.compliance_status]     # read AFTER the store posture update
      for citation in inspection.citations:                        # payload order, index ASC
          raw_c   = PENALTY_PER_DAY[citation.severity] * citation.violation_days * multiplier
          rounded_c = round_half_up(raw_c, 2)
      subtotal = SUM(rounded_c)
      penalty_exposure_usd = min(subtotal, 250000.00)
      # Two MINOR citations of 1 day each at multiplier 1.50:
      #   per-citation: round(275.55*1*1.50,2)=413.33 each -> 826.66
      #   sum-then-round (WRONG):  round(826.65,2)         -> 826.65
    input_set: "Every citation in Inspection.citations regardless of severity; citations with violation_days == 0 contribute 0.00 but are still enumerated. Inspections with status == CLOSED are frozen and are never recomputed."
    constants:
      PENALTY_PER_DAY: { MINOR: 275.55, MODERATE: 1250.00, MAJOR: 4500.00 }
      PENALTY_MULTIPLIER: { COMPLIANT: 1.00, AT_RISK: 1.25, NON_COMPLIANT: 1.50 }
      PENALTY_STATUTORY_CAP_USD: 250000.00
    precision: "2 decimal places, round_half_up, applied once per citation before summation; the cap is a hard min() with no further rounding"

  - name: late_filing_assessment
    trigger: "On RegulatoryReport.DRAFT_to_SUBMITTED and RegulatoryReport.REJECTED_to_SUBMITTED; writes RegulatoryReport.days_late, base_assessment_usd, administrative_surcharge_usd and late_filing_assessment_usd"
    algorithm: tiered_pricing
    formula: |
      days_late = max(0, floor((submitted_at - (period_end + 60 days)) / 86400 seconds))
      base_assessment_usd  = round_half_up(165.00 * days_late, 2)

      # BRACKET KEYED ON base_assessment_usd ALONE (combinatorial mode c).
      # The surcharge rate is selected from the base component only, never from
      # the running total and never from the total after the surcharge is added:
      surcharge_rate = 0.05 if base_assessment_usd <  1000.00
                  else 0.10 if base_assessment_usd <  5000.00
                  else 0.18
      administrative_surcharge_usd = round_half_up(base_assessment_usd * surcharge_rate, 2)
      late_filing_assessment_usd   = round_half_up(base_assessment_usd + administrative_surcharge_usd, 2)
      # days_late == 6 -> base 990.00 -> rate 0.05 -> surcharge 49.50 -> total 1039.50
      # keying the bracket on a total that already includes a surcharge would give
      # 990.00 -> 1039.50 -> rate 0.10 -> 1089.00, which is wrong.
    input_set: "A single report; nothing is aggregated. A report submitted on or before period_end + 60 days has days_late == 0 and all three money fields are 0.00."
    constants:
      FILING_GRACE_DAYS: 60
      LATE_FILING_BASE_PER_DAY_USD: 165.00
      SURCHARGE_BRACKETS: "base < 1000.00 -> 0.05; 1000.00 <= base < 5000.00 -> 0.10; base >= 5000.00 -> 0.18"
    precision: "2 decimal places, round_half_up on base, on surcharge, and on the total"

  - name: retrofit_compatibility_score
    trigger: "On POST /retrofit-plans and on RetrofitPlan.DRAFT_to_SUBMITTED; writes RetrofitPlan.compatibility_score and compatibility_result"
    algorithm: weighted_scoring
    formula: |
      cur = current RefrigerantType of the system, tgt = target RefrigerantType of the plan
      gwp_component      = 100.0 * max(0, (cur.gwp - tgt.gwp)) / max(1, cur.gwp)
      pressure_component = 100.0 if cur.pressure_class == tgt.pressure_class else 40.0
      family_component   = 100.0 if cur.ods_class == tgt.ods_class
                      else  70.0 if {cur.ods_class, tgt.ods_class} == {'HFC','HFO'}
                      else  50.0
      compatibility_score = round_half_up(
            0.45 * gwp_component
          + 0.30 * pressure_component
          + 0.25 * family_component, 1)
      compatibility_result = 'COMPATIBLE'               if compatibility_score >= 75.0
                       else 'CONDITIONALLY_COMPATIBLE'  if compatibility_score >= 50.0
                       else 'INCOMPATIBLE'
      # R-404A(gwp 3922, HIGH, HFC) -> R-448A(1387, HIGH, HFC) = 84.1 COMPATIBLE
      # R-404A -> R-245fa(1030, LOW, HFC)                      = 70.2 CONDITIONALLY_COMPATIBLE
      # R-290 (3, HIGH, NATURAL) -> R-404A(3922, HIGH, HFC)    = 42.5 INCOMPATIBLE
    input_set: "Exactly the two RefrigerantType rows named by the system and the plan; no other plan, system or record participates."
    constants:
      COMPAT_WEIGHTS: { gwp: 0.45, pressure: 0.30, family: 0.25 }
      COMPAT_THRESHOLDS: { COMPATIBLE: 75.0, CONDITIONALLY_COMPATIBLE: 50.0 }
    precision: "1 decimal place, round_half_up, applied once to the weighted sum; the three components are NOT pre-rounded, so weights always sum to exactly 1.00 and no drift accumulates"

  - name: service_record_retention_until
    trigger: "On POST /service-records; writes ServiceRecord.retention_until"
    algorithm: chronological
    formula: |
      retention_until = performed_at + 3 CALENDAR years, normalised to 00:00:00Z
      # calendar-year addition, not 1095 days: 2026-08-01T00:00:00Z -> 2029-08-01T00:00:00Z
      # a 02-29 performed_at clamps to 02-28 of the target year
      purgeable = retention_until <= clock
    input_set: "Each ServiceRecord independently; voiding a record does not shorten or clear retention_until, because the void itself must remain auditable."
    constants: { RETENTION_YEARS: 3 }
    precision: "UTC date normalised to midnight; calendar arithmetic with 02-29 -> 02-28 clamping"

  - name: chronic_exceedance_count
    trigger: "On LeakEvent.NEW_to_OPEN and on POST /service-records/{id}/void; writes RefrigerantSystem.exceedance_count_12mo and drives RefrigerantSystem.compliance_state"
    algorithm: aggregation
    formula: |
      exceedance_count_12mo = COUNT(ev for ev in LeakEvent
                                    if ev.system_id == system.id
                                    and ev.status != 'VOIDED'
                                    and ev.detected_at >  clock - 365 days   # EXCLUSIVE lower
                                    and ev.detected_at <= clock)             # INCLUSIVE upper
      chronic = exceedance_count_12mo >= 2
    input_set: "All non-VOIDED LeakEvent rows in the trailing window including VERIFIED_CLOSED ones - a repaired leak still counts as an exceedance. VOIDED events never count."
    constants: { CHRONIC_EXCEEDANCE_COUNT: 2, ROLLING_WINDOW_DAYS: 365 }
    precision: "Integer count"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST violated rule determines the response and no later rule is
#     evaluated, so a request violating two rules always surfaces the lower
#     priority number's error_id)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "The caller's X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Request body parses as JSON, every required input field is present, every field has the declared type, every enum field carries a declared value, and every numeric field respects its declared range (charges/quantities >= 0, granted_days >= 1, violation_days >= 0, citations entries well-formed)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 4
    category: existence
    check: "Path {id} resolves to an existing Store"
    error_id: ERR_STORE_NOT_FOUND
    http_status: 404
    applies_to: "GET /stores/{id}"

  - priority: 4
    category: existence
    check: "Path {id} resolves to an existing RefrigerantSystem"
    error_id: ERR_SYSTEM_NOT_FOUND
    http_status: 404
    applies_to: "GET /systems/{id}, GET /systems/{id}/leak-rate-projection, POST /systems/{id}/retirement"

  - priority: 4
    category: existence
    check: "Path {id} resolves to an existing RefrigerantType, Technician, RecoveryEquipment, Cylinder, ServiceRecord, LeakEvent, RepairAttempt, VerificationTest, ExtensionRequest, RetrofitPlan, RegulatoryReport or Inspection as required by the route"
    error_id: "ERR_REFRIGERANT_TYPE_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_RECOVERY_EQUIPMENT_NOT_FOUND | ERR_CYLINDER_NOT_FOUND | ERR_SERVICE_RECORD_NOT_FOUND | ERR_LEAK_EVENT_NOT_FOUND | ERR_REPAIR_ATTEMPT_NOT_FOUND | ERR_VERIFICATION_TEST_NOT_FOUND | ERR_EXTENSION_REQUEST_NOT_FOUND | ERR_RETROFIT_PLAN_NOT_FOUND | ERR_REGULATORY_REPORT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND"
    http_status: 404
    applies_to: "every GET /<collection>/{id} and every POST /<collection>/{id}/<action>"

  - priority: 5
    category: existence
    check: "Every foreign key in the request body resolves to an existing row (store_id, system_id, refrigerant_type_id, target_refrigerant_type_id, technician_id, recovery_equipment_id, cylinder_id, leak_event_id, repair_attempt_id, service_record_id)"
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"

  - priority: 6
    category: auth
    check: "When X-User-Role == Technician, X-User-ID must equal the technician_id named in the body (a technician may only file records, repair attempts and verification tests under their own identity)"
    error_id: ERR_TECHNICIAN_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /service-records, POST /repair-attempts, POST /verification-tests"

  - priority: 7
    category: auth
    check: "When X-User-Role == StoreManager, X-User-ID must equal the store_id owning the target resource (a store manager is scoped to a single store)"
    error_id: ERR_STORE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /inspections/{id}/response, GET /stores/{id}, GET /systems/{id}"

  - priority: 8
    category: state
    check: "expected_system_version equals the current RefrigerantSystem.version (optimistic concurrency, §1.2.1)"
    error_id: ERR_STALE_SYSTEM_VERSION
    http_status: 412
    applies_to: "POST /service-records, POST /retrofit-plans"

  - priority: 9
    category: state
    check: "The requested transition exists in the target entity's §1.2 transition list for its current state"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 10
    category: state
    check: "The RefrigerantSystem's operational_status is not RETIRED"
    error_id: ERR_SYSTEM_RETIRED
    http_status: 409
    applies_to: "POST /service-records, POST /retrofit-plans, POST /systems/{id}/retirement"

  - priority: 11
    category: state
    check: "The LeakEvent is not in a terminal status (VERIFIED_CLOSED or VOIDED)"
    error_id: ERR_LEAK_EVENT_TERMINAL
    http_status: 409
    applies_to: "POST /repair-attempts, POST /verification-tests, POST /extension-requests"

  - priority: 12
    category: state
    check: "The ServiceRecord has voided == false"
    error_id: ERR_SERVICE_RECORD_ALREADY_VOIDED
    http_status: 409
    applies_to: "POST /service-records/{id}/void"

  - priority: 13
    category: state
    check: "The system has no LeakEvent in a non-terminal status when a new leak event would be auto-opened; the existing event is advanced instead of duplicated"
    error_id: ERR_OPEN_LEAK_EVENT_EXISTS
    http_status: 409
    applies_to: "POST /leak-events"

  - priority: 14
    category: business_safety
    check: "The named Technician has status == ACTIVE (not SUSPENDED)"
    error_id: ERR_TECHNICIAN_SUSPENDED
    http_status: 422
    applies_to: "POST /service-records, POST /repair-attempts, POST /verification-tests"

  - priority: 15
    category: business_safety
    check: "The named Technician's certification_expires_on is on or after the work timestamp (performed_at / repair_completed_at)"
    error_id: ERR_TECHNICIAN_CERT_EXPIRED
    http_status: 422
    applies_to: "POST /service-records, POST /repair-attempts, POST /verification-tests"

  - priority: 16
    category: business_safety
    check: "The Technician's certification_type satisfies the system's required_certification_type (TYPE_I for <= 5 lb appliances, TYPE_II for high-pressure, TYPE_III for low-pressure; UNIVERSAL satisfies all three)"
    error_id: ERR_TECHNICIAN_CERT_TYPE_INVALID
    http_status: 422
    applies_to: "POST /service-records, POST /repair-attempts"

  - priority: 17
    category: business_safety
    check: "The named RecoveryEquipment has status == CERTIFIED and last_verification_on within 365 days of performed_at"
    error_id: ERR_RECOVERY_EQUIPMENT_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /service-records with service_type IN {ADD_REFRIGERANT, RECOVER_REFRIGERANT, RETROFIT_CONVERSION}"

  - priority: 18
    category: business_safety
    check: "RecoveryEquipment.certified_for_pressure_class equals the RefrigerantType.pressure_class of the refrigerant being handled"
    error_id: ERR_RECOVERY_EQUIPMENT_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /service-records with service_type IN {ADD_REFRIGERANT, RECOVER_REFRIGERANT, RETROFIT_CONVERSION}"

  - priority: 19
    category: business_safety
    check: "Segregation of duties: the technician_id performing a VerificationTest must differ from the technician_id of the RepairAttempt being verified"
    error_id: ERR_SEGREGATION_OF_DUTIES_VERIFICATION
    http_status: 422
    applies_to: "POST /verification-tests"

  - priority: 20
    category: business_safety
    check: "Segregation of duties: the X-User-ID closing an Inspection must differ from Inspection.opened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_INSPECTION
    http_status: 422
    applies_to: "POST /inspections/{id}/closure"

  - priority: 21
    category: business_referential
    check: "The Cylinder's refrigerant_type_id equals the target RefrigerantSystem's refrigerant_type_id (ADD_REFRIGERANT / RECOVER_REFRIGERANT), or equals the RetrofitPlan's target_refrigerant_type_id (RETROFIT_CONVERSION)"
    error_id: ERR_REFRIGERANT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /service-records"

  - priority: 22
    category: business_referential
    check: "A cylinder with disposition == SENT_FOR_RECLAIM may not be charged into a system; only VIRGIN, RECOVERED or RECLAIMED cylinders may be used"
    error_id: ERR_UNRECLAIMED_REFRIGERANT_REUSE
    http_status: 422
    applies_to: "POST /service-records with service_type == ADD_REFRIGERANT"

  - priority: 23
    category: business_referential
    check: "The RecoveryEquipment and Cylinder named on a ServiceRecord must have the same store_id as the RefrigerantSystem being serviced (Technicians are not store-scoped)"
    error_id: ERR_CROSS_STORE_RESOURCE
    http_status: 422
    applies_to: "POST /service-records, POST /repair-attempts"

  - priority: 24
    category: business_referential
    check: "Cross-reference agreement: on POST /repair-attempts the body's system_id must be the system_id of the named LeakEvent (the system_id is an asserted cross-check, not a stored field); on POST /verification-tests the named RepairAttempt's leak_event_id must equal the body's leak_event_id"
    error_id: ERR_LEAK_EVENT_SYSTEM_MISMATCH
    http_status: 422
    applies_to: "POST /repair-attempts, POST /verification-tests"

  - priority: 25
    category: business_referential
    check: "A VerificationTest must name the LeakEvent's current (newest by repair_completed_at ASC, created_at ASC) RepairAttempt whose outcome is AWAITING_VERIFICATION; SUPERSEDED and already-verified attempts are rejected"
    error_id: ERR_REPAIR_ATTEMPT_NOT_CURRENT
    http_status: 422
    applies_to: "POST /verification-tests"

  - priority: 26
    category: business_referential
    check: "reason_code INDUSTRIAL_PROCESS_SHUTDOWN_REQUIRED is only available when the system's system_category == INDUSTRIAL_PROCESS_REFRIGERATION, and PERMIT_PENDING is only available when the system carries an APPROVED or IN_PROGRESS RetrofitPlan"
    error_id: ERR_EXTENSION_REASON_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /extension-requests"

  - priority: 27
    category: business_referential
    check: "The RetrofitPlan's target_refrigerant_type must have phasedown_status != PROHIBITED"
    error_id: ERR_TARGET_REFRIGERANT_PROHIBITED
    http_status: 422
    applies_to: "POST /retrofit-plans, POST /retrofit-plans/{id}/submission"

  - priority: 28
    category: business_referential
    check: "A RetrofitPlan with plan_type == RETROFIT must name a target_refrigerant_type_id; a plan with plan_type == RETIRE must omit it"
    error_id: ERR_RETROFIT_TARGET_REQUIRED
    http_status: 422
    applies_to: "POST /retrofit-plans"

  - priority: 29
    category: business_temporal
    check: "No timestamp field in the body may be later than the current logical clock (performed_at, repair_completed_at, detected_at, reclaim_issued_on, period_end)"
    error_id: ERR_TIMESTAMP_AFTER_CLOCK
    http_status: 422
    applies_to: "all POST endpoints carrying a physical-world timestamp"

  - priority: 30
    category: business_temporal
    check: "ServiceRecord.performed_at must be on or after the system's installed_on"
    error_id: ERR_SERVICE_DATE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /service-records"

  - priority: 31
    category: business_temporal
    check: "RepairAttempt.repair_completed_at must be on or after the LeakEvent.detected_at"
    error_id: ERR_REPAIR_BEFORE_DETECTION
    http_status: 422
    applies_to: "POST /repair-attempts"

  - priority: 32
    category: business_temporal
    check: "A technician's labour intervals must not overlap. The interval of a ServiceRecord is HALF-OPEN [performed_at, occupies_until) where occupies_until == performed_at + duration_minutes: a new record starting exactly when the previous one ends is allowed."
    error_id: ERR_TECHNICIAN_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /service-records, POST /repair-attempts"

  - priority: 33
    category: business_temporal
    check: "A recovery machine's occupancy interval is CLOSED and decontamination-buffered: [performed_at, equipment_released_at] where equipment_released_at == performed_at + duration_minutes + 60 minutes. Two records on the same equipment whose buffered closed intervals share even a single instant collide - unlike the technician rule, touching endpoints DO conflict."
    error_id: ERR_EQUIPMENT_DECONTAMINATION_CONFLICT
    http_status: 409
    applies_to: "POST /service-records"

  - priority: 34
    category: business_temporal
    check: "A store may not hold two RegulatoryReport rows with overlapping [period_start, period_end] INCLUSIVE date ranges unless the earlier one is in status REJECTED; a shared endpoint date is an overlap"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /regulatory-reports"

  - priority: 35
    category: business_temporal
    check: "An ExtensionRequest may only be filed while the LeakEvent's repair_deadline has not yet passed, and may only be decided within EXTENSION_REQUEST_TTL_DAYS (15) of requested_at"
    error_id: ERR_EXTENSION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /extension-requests, POST /extension-requests/{id}/decision"

  - priority: 36
    category: business_constraint
    check: "granted_days must not exceed requested_days"
    error_id: ERR_GRANTED_DAYS_EXCEED_REQUESTED
    http_status: 422
    applies_to: "POST /extension-requests/{id}/decision"

  - priority: 37
    category: business_constraint
    check: "The sum of APPROVED granted_days on a LeakEvent must not exceed EXTENSION_DAY_CAP (30) days; the check runs against the post-approval total"
    error_id: ERR_EXTENSION_DAY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /extension-requests/{id}/decision"

  - priority: 38
    category: business_constraint
    check: "A RetrofitPlan may only be submitted when compatibility_result != INCOMPATIBLE, or when plan_type == RETIRE"
    error_id: ERR_RETROFIT_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /retrofit-plans/{id}/submission"

  - priority: 39
    category: business_constraint
    check: "Recovering refrigerant into a cylinder must not push current_contents_lbs above fill_limit_lbs (80 percent of nominal_capacity_lbs, DOT fill rule)"
    error_id: ERR_CYLINDER_FILL_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /service-records with service_type == RECOVER_REFRIGERANT"

  - priority: 40
    category: business_constraint
    check: "Charging refrigerant out of a cylinder must not drive current_contents_lbs below 0.0"
    error_id: ERR_INSUFFICIENT_CYLINDER_CONTENTS
    http_status: 422
    applies_to: "POST /service-records with service_type IN {ADD_REFRIGERANT, RETROFIT_CONVERSION}"

  - priority: 41
    category: business_constraint
    check: "The projected system charge after the record must not exceed full_charge_lbs"
    error_id: ERR_CHARGE_EXCEEDS_NAMEPLATE
    http_status: 422
    applies_to: "POST /service-records"

  - priority: 42
    category: business_constraint
    check: "The projected system charge after the record must not fall below 0.0"
    error_id: ERR_NEGATIVE_SYSTEM_CHARGE
    http_status: 422
    applies_to: "POST /service-records"

  - priority: 43
    category: business_constraint
    check: "A system may only be retired once current_charge_lbs == 0.0 (all refrigerant recovered)"
    error_id: ERR_SYSTEM_CHARGE_NOT_RECOVERED
    http_status: 422
    applies_to: "POST /systems/{id}/retirement"

  - priority: 44
    category: business_constraint
    check: "A system with a non-terminal LeakEvent may not be retired unless the retirement is executed against an APPROVED or IN_PROGRESS RetrofitPlan with plan_type == RETIRE"
    error_id: ERR_OPEN_LEAK_EVENT_BLOCKS_RETIREMENT
    http_status: 422
    applies_to: "POST /systems/{id}/retirement"

  - priority: 45
    category: business_constraint
    check: "reclaimed_quantity_lbs must not exceed the cylinder's shipped_for_reclaim_lbs"
    error_id: ERR_RECLAIM_QUANTITY_EXCEEDS_SHIPPED
    http_status: 422
    applies_to: "POST /cylinders/{id}/reclaim-certification"

  - priority: 46
    category: business_constraint
    check: "A reclaim certification must carry purity_verified == true (AHRI-700) before the cylinder may return to RECLAIMED"
    error_id: ERR_RECLAIM_PURITY_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /cylinders/{id}/reclaim-certification"

  - priority: 47
    category: business_constraint
    check: "Scoped identifiers must be unique: Store.store_code, Technician.epa_certification_number, Cylinder.cylinder_serial, RecoveryEquipment.equipment_serial and RefrigerantType.name are each globally unique"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /stores, POST /systems, POST /technicians, POST /cylinders, POST /recovery-equipment, POST /refrigerant-types"

  - priority: 48
    category: business_constraint
    check: "A ServiceRecord may only be voided while retention_until has not been reached and no VerificationTest with result == PASS depends on it"
    error_id: ERR_VOID_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /service-records/{id}/void"

  - priority: 49
    category: business_fiscal
    check: "RetrofitPlan.estimated_cost_usd must be > 0.00 and <= 5000000.00"
    error_id: ERR_PLAN_COST_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /retrofit-plans"

# =============================================================================
# 1.5 API Endpoint Table
#   Flat topology: no nested creation paths. Every child collection is reachable
#   from its parent via a filtered list endpoint carrying the FK as a query
#   parameter. All money is JSON number, all timestamps ISO 8601 UTC with a
#   trailing Z.
# =============================================================================
endpoints:
  # --------------------------------------------------------------- Store
  - method: POST
    path: "/stores"
    description: "Register a supermarket store. Posture fields start at COMPLIANT with zero counts."
    roles: [PlatformAdmin, ComplianceManager]
    code: 201
    input: [name, store_code, state_code, region]
    output: Store
    side_effects: ["compliance_status = COMPLIANT", "all posture counters = 0", "vented_loss_lbs = 0.0", "penalty_exposure_total_usd = 0.00"]

  - method: GET
    path: "/stores"
    description: "List stores, newest first is NOT used - ordering is created_at ASC then id is never consulted."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["region?", "compliance_status?", "chronic_leaker_flag?", "limit?", "offset?"]
    output: Store[]
    side_effects: []

  - method: GET
    path: "/stores/{id}"
    description: "Fetch one store with its live posture aggregates. A StoreManager may only read their own store."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: Store
    side_effects: []

  # ----------------------------------------------------- RefrigerantType
  - method: POST
    path: "/refrigerant-types"
    description: "Register a refrigerant chemistry with its GWP, pressure class, chemical family and phasedown standing."
    roles: [PlatformAdmin, ComplianceManager]
    code: 201
    input: [name, gwp, pressure_class, ods_class, phasedown_status]
    output: RefrigerantType
    side_effects: []

  - method: GET
    path: "/refrigerant-types"
    description: "List refrigerant chemistries, optionally filtered by phasedown standing or chemical family."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["phasedown_status?", "ods_class?", "limit?", "offset?"]
    output: RefrigerantType[]
    side_effects: []

  - method: GET
    path: "/refrigerant-types/{id}"
    description: "Fetch one refrigerant chemistry."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: RefrigerantType
    side_effects: []

  # ---------------------------------------------------- RefrigerantSystem
  - method: POST
    path: "/systems"
    description: "Register a refrigeration system at a store. applicability, threshold_pct and required_certification_type are derived from full_charge_lbs, system_category and the refrigerant's pressure_class; leak_rate_baseline_at is seeded to installed_on."
    roles: [ComplianceManager]
    code: 201
    input: [store_id, refrigerant_type_id, system_category, full_charge_lbs, initial_charge_lbs, installed_on, "leak_rate_method?"]
    output: RefrigerantSystem
    side_effects:
      - "applicability = REGULATED when full_charge_lbs >= 50.0 else EXEMPT"
      - "threshold_pct from LEAK_THRESHOLDS[system_category]"
      - "required_certification_type derived from full_charge_lbs and refrigerant pressure_class"
      - "current_charge_lbs = initial_charge_lbs; leak_rate_pct = 0.0; leak_rate_baseline_at = installed_on"
      - "operational_status = ACTIVE; compliance_state = COMPLIANT; version = 1"
      - "recompute store_compliance_posture for the owning Store (regulated_system_count, total_regulated_charge_lbs)"

  - method: GET
    path: "/systems"
    description: "List refrigeration systems filtered by owning store, refrigerant chemistry, replacement linkage or either state axis."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["store_id?", "refrigerant_type_id?", "replaced_by_system_id?", "applicability?", "operational_status?", "compliance_state?", "limit?", "offset?"]
    output: RefrigerantSystem[]
    side_effects: []

  - method: GET
    path: "/systems/{id}"
    description: "Fetch one refrigeration system including current_charge_lbs, leak_rate_pct, exceedance_count_12mo and version (read this immediately before any write that carries expected_system_version)."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: RefrigerantSystem
    side_effects: []

  - method: GET
    path: "/systems/{id}/leak-rate-projection"
    description: "Computed read: what-if leak rate for this system under either industry method as of any instant, without writing anything. Used to compare the ROLLING_AVERAGE and ANNUALIZING variants over identical ledger data."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["method?", "as_of?"]
    output: { system_id: string, method: string, leak_rate_pct: number, refrigerant_added_lbs_in_window: number, window_start: string, window_end: string, threshold_pct: number, would_trigger_leak_event: boolean }
    side_effects: []

  - method: POST
    path: "/systems/{id}/retirement"
    description: "Retire a system. Requires current_charge_lbs == 0.0; a non-terminal LeakEvent blocks retirement unless retrofit_plan_id names an APPROVED or IN_PROGRESS RETIRE plan. Naming replacement_system_id sets replaced_by_system_id."
    roles: [ComplianceManager]
    code: 200
    input: [retirement_reason_code, "retrofit_plan_id?", "replacement_system_id?"]
    output: RefrigerantSystem
    side_effects:
      - "operational_status ACTIVE -> RETIRED; retired_on = clock"
      - "compliance_state -> RETIRED_EXEMPT (highest precedence, overrides CHRONIC_EXCEEDANCE and RETROFIT_MANDATED)"
      - "replaced_by_system_id = replacement_system_id when supplied"
      - "any non-terminal LeakEvent on the system -> VOIDED with closed_at = clock"
      - "recompute store_compliance_posture (regulated_system_count, mandated_retrofit_count, open_leak_event_count, compliance_status)"
      - "recompute inspection_penalty_exposure for the store's OPEN/RESPONDED/ESCALATED inspections"

  # ------------------------------------------------------------ Technician
  - method: POST
    path: "/technicians"
    description: "Register a Section 608 certified technician. Technicians are not store-scoped."
    roles: [ComplianceManager]
    code: 201
    input: [full_name, epa_certification_number, certification_type, certification_expires_on]
    output: Technician
    side_effects: ["status = ACTIVE", "repair_attempt_count = 0"]

  - method: GET
    path: "/technicians"
    description: "List technicians filtered by certification class or eligibility status."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["certification_type?", "status?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []

  - method: GET
    path: "/technicians/{id}"
    description: "Fetch one technician."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: POST
    path: "/technicians/{id}/status-change"
    description: "Suspend or reinstate a technician (Technician.ACTIVE_to_SUSPENDED / SUSPENDED_to_ACTIVE). A SUSPENDED technician may file no service record, repair attempt or verification test."
    roles: [ComplianceManager]
    code: 200
    input: [new_status, reason_code]
    output: Technician
    side_effects:
      - "status = new_status; suspension_reason_code = reason_code on SUSPENDED, null on ACTIVE"
      - "no historical record is rewritten - suspension is forward-looking only"

  # ------------------------------------------------------ RecoveryEquipment
  - method: POST
    path: "/recovery-equipment"
    description: "Register a recovery machine at a store, certified to an AHRI-740 revision for one pressure class."
    roles: [ComplianceManager]
    code: 201
    input: [store_id, assigned_technician_id, equipment_serial, certified_to_standard, certified_for_pressure_class, last_verification_on]
    output: RecoveryEquipment
    side_effects: ["status = CERTIFIED when last_verification_on is within 365 days of the clock, else VERIFICATION_OVERDUE"]

  - method: GET
    path: "/recovery-equipment"
    description: "List recovery machines filtered by station store, custodian technician or verification standing."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["store_id?", "assigned_technician_id?", "status?", "certified_for_pressure_class?", "limit?", "offset?"]
    output: RecoveryEquipment[]
    side_effects: []

  - method: GET
    path: "/recovery-equipment/{id}"
    description: "Fetch one recovery machine."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: RecoveryEquipment
    side_effects: []

  - method: POST
    path: "/recovery-equipment/{id}/verification"
    description: "Record an annual equipment verification (RecoveryEquipment.VERIFICATION_OVERDUE_to_CERTIFIED and CERTIFIED_to_CERTIFIED refresh)."
    roles: [ComplianceManager]
    code: 200
    input: [verified_on]
    output: RecoveryEquipment
    side_effects: ["last_verification_on = verified_on", "status -> CERTIFIED"]

  # -------------------------------------------------------------- Cylinder
  - method: POST
    path: "/cylinders"
    description: "Register a DOT cylinder. fill_limit_lbs is derived as 80 percent of nominal_capacity_lbs."
    roles: [ComplianceManager]
    code: 201
    input: [store_id, refrigerant_type_id, cylinder_serial, nominal_capacity_lbs, initial_contents_lbs]
    output: Cylinder
    side_effects:
      - "fill_limit_lbs = round_half_up(nominal_capacity_lbs * 0.80, 1)"
      - "current_contents_lbs = initial_contents_lbs; shipped_for_reclaim_lbs = 0.0"
      - "disposition = VIRGIN"

  - method: GET
    path: "/cylinders"
    description: "List cylinders filtered by holding store, chemistry or lifecycle disposition."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["store_id?", "refrigerant_type_id?", "disposition?", "limit?", "offset?"]
    output: Cylinder[]
    side_effects: []

  - method: GET
    path: "/cylinders/{id}"
    description: "Fetch one cylinder including current_contents_lbs, shipped_for_reclaim_lbs and reclaim documentation."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: Cylinder
    side_effects: []

  - method: POST
    path: "/cylinders/{id}/reclaim-shipment"
    description: "Ship a recovered cylinder to an EPA-certified reclaimer (Cylinder.RECOVERED_to_SENT_FOR_RECLAIM). Mass moves from current_contents_lbs to shipped_for_reclaim_lbs; the store's total refrigerant mass is unchanged."
    roles: [ComplianceManager]
    code: 200
    input: [reclaimer_name]
    output: Cylinder
    side_effects:
      - "shipped_for_reclaim_lbs += current_contents_lbs; current_contents_lbs = 0.0"
      - "disposition -> SENT_FOR_RECLAIM; shipped_on = clock; reclaimer_name recorded"

  - method: POST
    path: "/cylinders/{id}/reclaim-certification"
    description: "Record an AHRI-700 reclaim certificate (Cylinder.SENT_FOR_RECLAIM_to_RECLAIMED). reclaimed_quantity_lbs returns to current_contents_lbs; any unreclaimed residue stays in shipped_for_reclaim_lbs so total mass is conserved."
    roles: [ComplianceManager]
    code: 200
    input: [reclaim_certificate_number, reclaimed_quantity_lbs, purity_verified, reclaim_issued_on, "reclaimer_name?"]
    output: Cylinder
    side_effects:
      - "current_contents_lbs = reclaimed_quantity_lbs"
      - "shipped_for_reclaim_lbs -= reclaimed_quantity_lbs"
      - "disposition -> RECLAIMED; certificate fields recorded"

  # --------------------------------------------------------- ServiceRecord
  - method: POST
    path: "/service-records"
    description: "File a service record against a system. Carries expected_system_version for optimistic concurrency (§1.2.1 service-record-create-stale-system): read GET /systems/{id} immediately before this call, because every cascade bumps the version."
    roles: [Technician]
    code: 201
    input: [system_id, technician_id, recovery_equipment_id, service_type, performed_at, duration_minutes, expected_system_version, "cylinder_id?", "leak_event_id?", "refrigerant_added_lbs?", "refrigerant_recovered_lbs?", "refrigerant_lost_lbs?"]
    output: ServiceRecord
    side_effects:
      - "occupies_until = performed_at + duration_minutes; equipment_released_at = occupies_until + 60 minutes"
      - "retention_until = performed_at + 3 calendar years"
      - "cylinder current_contents_lbs adjusted (-added, +recovered) and disposition VIRGIN -> RECOVERED on a recovery"
      - "Store.vented_loss_lbs += refrigerant_lost_lbs"
      - "recompute system_charge_projection -> RefrigerantSystem.current_charge_lbs and system_charge_after_lbs"
      - "recompute system_leak_rate_pct under the system's leak_rate_method -> leak_rate_pct and leak_rate_pct_after"
      - "when applicability == REGULATED and leak_rate_pct >= threshold_pct and no non-terminal LeakEvent exists: auto-open a LeakEvent (LeakEvent.NEW_to_OPEN) with detected_at = performed_at, detection_method = LEAK_RATE_CALCULATION, triggering_service_record_id = this record"
      - "recompute chronic_exceedance_count -> exceedance_count_12mo; compliance_state -> LEAK_OPEN or CHRONIC_EXCEEDANCE by pinned precedence"
      - "recompute store_compliance_posture for the owning Store"
      - "recompute inspection_penalty_exposure for the store's OPEN/RESPONDED/ESCALATED inspections using the post-update Store.compliance_status"
      - "increments RefrigerantSystem.version by 1"

  - method: GET
    path: "/service-records"
    description: "List service records filtered by system, technician, machine, cylinder, linked leak event, work type or void state."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["system_id?", "technician_id?", "recovery_equipment_id?", "cylinder_id?", "leak_event_id?", "service_type?", "voided?", "limit?", "offset?"]
    output: ServiceRecord[]
    side_effects: []

  - method: GET
    path: "/service-records/{id}"
    description: "Fetch one service record including its charge and leak-rate snapshots and retention_until."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: ServiceRecord
    side_effects: []

  - method: POST
    path: "/service-records/{id}/void"
    description: "Compensate a service record. The record leaves the ledger and every derived quantity is recomputed from scratch, never patched: charge, leak rate, leak-event existence, exceedance count, store posture and penalty exposure all reverse exactly, and the store's total refrigerant mass is unchanged."
    roles: [ComplianceManager]
    code: 200
    input: [void_reason_code]
    output: ServiceRecord
    side_effects:
      - "voided = true; voided_at = clock; void_reason_code recorded"
      - "cylinder movements reversed (+added, -recovered); Store.vented_loss_lbs -= refrigerant_lost_lbs"
      - "recompute system_charge_projection and system_leak_rate_pct from the surviving ledger"
      - "a LeakEvent whose triggering_service_record_id == this record and whose status is still OPEN is VOIDED (LeakEvent.OPEN_to_VOIDED)"
      - "recompute chronic_exceedance_count and RefrigerantSystem.compliance_state"
      - "recompute store_compliance_posture and inspection_penalty_exposure"
      - "increments RefrigerantSystem.version by 1"

  # ------------------------------------------------------------- LeakEvent
  - method: POST
    path: "/leak-events"
    description: "Declare a leak event found outside the leak-rate calculation (manual inspection or automated monitoring). Rejected when the system already carries a non-terminal event."
    roles: [ComplianceManager, Regulator]
    code: 201
    input: [system_id, detected_at, detection_method]
    output: LeakEvent
    side_effects:
      - "status = OPEN; leak_rate_pct_at_detection and threshold_pct_applied frozen from the system"
      - "initial_repair_deadline = repair_deadline = detected_at + 30 days"
      - "extension_days_granted_total = 0; extension_days_remaining = 30"
      - "recompute chronic_exceedance_count -> exceedance_count_12mo; compliance_state -> LEAK_OPEN or CHRONIC_EXCEEDANCE"
      - "recompute store_compliance_posture and inspection_penalty_exposure"

  - method: GET
    path: "/leak-events"
    description: "List leak events filtered by system, triggering service record or compliance status."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["system_id?", "triggering_service_record_id?", "status?", "limit?", "offset?"]
    output: LeakEvent[]
    side_effects: []

  - method: GET
    path: "/leak-events/{id}"
    description: "Fetch one leak event with its deadlines, extension budget and failure counters."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: LeakEvent
    side_effects: []

  # ---------------------------------------------------------- RepairAttempt
  - method: POST
    path: "/repair-attempts"
    description: "Record a completed repair on an open leak event. Filing a second attempt while a verification is pending supersedes the earlier attempt (LeakEvent.VERIFICATION_PENDING_to_VERIFICATION_PENDING self-loop)."
    roles: [Technician]
    code: 201
    input: [leak_event_id, system_id, technician_id, recovery_equipment_id, repair_method_code, repair_completed_at]
    output: RepairAttempt
    side_effects:
      - "attempt_number = 1-based ordinal by repair_completed_at ASC, created_at ASC"
      - "was_late = repair_completed_at > leak_event.repair_deadline; LeakEvent.late_repair_flag ORed in"
      - "any prior RepairAttempt with outcome == AWAITING_VERIFICATION -> SUPERSEDED"
      - "LeakEvent.status -> VERIFICATION_PENDING; repair_attempt_count += 1"
      - "LeakEvent.last_repair_completed_at = repair_completed_at; verification_deadline = repair_completed_at + 10 days"
      - "Technician.repair_attempt_count += 1"

  - method: GET
    path: "/repair-attempts"
    description: "List repair attempts filtered by leak event, technician, machine or verification standing."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["leak_event_id?", "technician_id?", "recovery_equipment_id?", "outcome?", "limit?", "offset?"]
    output: RepairAttempt[]
    side_effects: []

  - method: GET
    path: "/repair-attempts/{id}"
    description: "Fetch one repair attempt. RepairAttempt is immutable (common_fields false): no updated_at, no version, no update endpoint."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: RepairAttempt
    side_effects: []

  # -------------------------------------------------------- VerificationTest
  - method: POST
    path: "/verification-tests"
    description: "Record a verification test on the leak event's current repair attempt. Segregation of duties: the tester must not be the technician who performed the attempt. A PASS on the INITIAL sequence opens a follow-up window; a PASS on the FOLLOWUP sequence closes the event; the second FAIL on an event mandates a retrofit."
    roles: [Technician]
    code: 201
    input: [leak_event_id, repair_attempt_id, technician_id, test_method_code, performed_at, result, "measured_leak_rate_pct?"]
    output: VerificationTest
    side_effects:
      - "test_sequence = INITIAL_VERIFICATION when the event was VERIFICATION_PENDING or VERIFICATION_OVERDUE, FOLLOWUP_VERIFICATION when it was FOLLOWUP_PENDING"
      - "was_late = performed_at > leak_event.verification_deadline"
      - "PASS on INITIAL: RepairAttempt.outcome -> VERIFIED; LeakEvent -> FOLLOWUP_PENDING; verification_deadline = performed_at + 10 days"
      - "PASS on FOLLOWUP: LeakEvent -> VERIFIED_CLOSED with closed_at = clock; RefrigerantSystem.leak_rate_baseline_at = performed_at; leak_rate_pct recomputed; compliance_state -> COMPLIANT or CHRONIC_EXCEEDANCE; linked ServiceRecord.retention_until raised to closed_at + 3 calendar years"
      - "FAIL with failed_verification_count < 2 after the increment: RepairAttempt.outcome -> FAILED_VERIFICATION; LeakEvent -> VERIFICATION_FAILED"
      - "FAIL with failed_verification_count >= 2 after the increment: LeakEvent -> RETROFIT_MANDATED; RefrigerantSystem.compliance_state -> RETROFIT_MANDATED with retrofit_due_on = clock + 90 days; Store.mandated_retrofit_count += 1 and compliance_status -> NON_COMPLIANT; inspection_penalty_exposure recomputed at the 1.50 multiplier"
      - "recompute store_compliance_posture and inspection_penalty_exposure in every branch"

  - method: GET
    path: "/verification-tests"
    description: "List verification tests filtered by leak event, attempt, tester or outcome."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["leak_event_id?", "repair_attempt_id?", "technician_id?", "result?", "test_sequence?", "limit?", "offset?"]
    output: VerificationTest[]
    side_effects: []

  - method: GET
    path: "/verification-tests/{id}"
    description: "Fetch one verification test. VerificationTest is immutable (common_fields false): no updated_at, no version, no update endpoint."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: VerificationTest
    side_effects: []

  # ------------------------------------------------------- ExtensionRequest
  - method: POST
    path: "/extension-requests"
    description: "File a repair-deadline extension request with the agency. deadline_before snapshots the event's current repair_deadline so a later revocation can restore it exactly."
    roles: [ComplianceManager]
    code: 201
    input: [leak_event_id, reason_code, requested_days, justification]
    output: ExtensionRequest
    side_effects:
      - "status = PENDING; requested_at = clock; expires_at = clock + 15 days"
      - "deadline_before = leak_event.repair_deadline"
      - "granted_days, decided_at, deadline_after, revoked_at all null"

  - method: GET
    path: "/extension-requests"
    description: "List extension requests filtered by leak event or lifecycle status."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["leak_event_id?", "status?", "reason_code?", "limit?", "offset?"]
    output: ExtensionRequest[]
    side_effects: []

  - method: GET
    path: "/extension-requests/{id}"
    description: "Fetch one extension request including its deadline snapshots."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: ExtensionRequest
    side_effects: []

  - method: POST
    path: "/extension-requests/{id}/decision"
    description: "Regulator approves or denies a pending request (ExtensionRequest.PENDING_to_APPROVED / PENDING_to_DENIED). An approval extends the leak event's repair_deadline; the extension day budget is capped at 30 days per event."
    roles: [Regulator]
    code: 200
    input: [decision, "granted_days?", "denial_reason_code?"]
    output: ExtensionRequest
    side_effects:
      - "APPROVE: status -> APPROVED; granted_days recorded; decided_at = clock"
      - "APPROVE: LeakEvent.extension_days_granted_total recomputed from APPROVED rows; extension_days_remaining = 30 - total; repair_deadline = initial_repair_deadline + total days; deadline_after = the new repair_deadline"
      - "APPROVE: a LeakEvent in REPAIR_OVERDUE returns to OPEN when the new repair_deadline is no longer in the past"
      - "DENY: status -> DENIED; decided_at = clock; no deadline field moves"

  - method: POST
    path: "/extension-requests/{id}/revocation"
    description: "Regulator revokes an approved extension (ExtensionRequest.APPROVED_to_REVOKED). The compensation is exact: the granted days leave the budget and the leak event's repair_deadline returns to deadline_before with no drift."
    roles: [Regulator]
    code: 200
    input: [revocation_reason_code]
    output: ExtensionRequest
    side_effects:
      - "status -> REVOKED; revoked_at = clock; revocation_reason_code recorded"
      - "LeakEvent.extension_days_granted_total recomputed without this row; extension_days_remaining restored; repair_deadline == deadline_before exactly"
      - "the LeakEvent returns to REPAIR_OVERDUE when the restored repair_deadline is already in the past"
      - "recompute store_compliance_posture and inspection_penalty_exposure"

  # ----------------------------------------------------------- RetrofitPlan
  - method: POST
    path: "/retrofit-plans"
    description: "File a retrofit-or-retire plan for a system. Carries expected_system_version for optimistic concurrency (§1.2.1 retrofit-plan-create-supersede-stale-system) because a newly filed plan supersedes any DRAFT plan on the same system: read GET /systems/{id} immediately before this call."
    roles: [ComplianceManager]
    code: 201
    input: [system_id, plan_type, due_on, estimated_cost_usd, expected_system_version, "target_refrigerant_type_id?"]
    output: RetrofitPlan
    side_effects:
      - "status = DRAFT; submission_count = 0"
      - "gwp_reduction_pct and compatibility_score / compatibility_result computed (retrofit_compatibility_score); a RETIRE plan scores 100.0 COMPATIBLE with gwp_reduction_pct 0.0"
      - "mandated = true when the system's compliance_state == RETROFIT_MANDATED at creation"
      - "any other DRAFT plan on the same system -> SUPERSEDED (RetrofitPlan.DRAFT_to_SUPERSEDED)"
      - "increments RefrigerantSystem.version by 1"

  - method: GET
    path: "/retrofit-plans"
    description: "List retrofit plans filtered by system, target chemistry or lifecycle status."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["system_id?", "target_refrigerant_type_id?", "status?", "plan_type?", "mandated?", "limit?", "offset?"]
    output: RetrofitPlan[]
    side_effects: []

  - method: GET
    path: "/retrofit-plans/{id}"
    description: "Fetch one retrofit plan including its compatibility scoring."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: RetrofitPlan
    side_effects: []

  - method: POST
    path: "/retrofit-plans/{id}/submission"
    description: "Submit a DRAFT or REJECTED plan to the agency (RetrofitPlan.DRAFT_to_SUBMITTED / REJECTED_to_SUBMITTED - the revision loop). A plan whose compatibility_result is INCOMPATIBLE cannot be submitted unless plan_type == RETIRE."
    roles: [ComplianceManager]
    code: 200
    input: ["submission_note?"]
    output: RetrofitPlan
    side_effects:
      - "status -> SUBMITTED; submitted_at = clock; submission_count += 1"
      - "compatibility_score and compatibility_result recomputed against the current chemistries"

  - method: POST
    path: "/retrofit-plans/{id}/decision"
    description: "Regulator approves or rejects a submitted plan (RetrofitPlan.SUBMITTED_to_APPROVED / SUBMITTED_to_REJECTED)."
    roles: [Regulator]
    code: 200
    input: [decision, "rejection_reason_code?"]
    output: RetrofitPlan
    side_effects:
      - "APPROVE: status -> APPROVED; decided_at = clock; rejection_reason_code cleared"
      - "REJECT: status -> REJECTED; decided_at = clock; rejection_reason_code recorded; the plan may be resubmitted"

  - method: POST
    path: "/retrofit-plans/{id}/completion"
    description: "Close out an APPROVED or IN_PROGRESS plan against the RETROFIT_CONVERSION service record that executed it. A RETROFIT plan re-points the system at the target chemistry and clears the retrofit mandate; the leak event that mandated it closes."
    roles: [ComplianceManager]
    code: 200
    input: [service_record_id]
    output: RetrofitPlan
    side_effects:
      - "status APPROVED -> IN_PROGRESS -> COMPLETED; completed_at = clock"
      - "RETROFIT: RefrigerantSystem.refrigerant_type_id = target_refrigerant_type_id; required_certification_type re-derived from the new pressure_class"
      - "RefrigerantSystem.leak_rate_baseline_at = completed_at; leak_rate_pct recomputed; retrofit_due_on = null"
      - "RefrigerantSystem.compliance_state RETROFIT_MANDATED -> COMPLIANT (or CHRONIC_EXCEEDANCE when exceedance_count_12mo is still >= 2)"
      - "any LeakEvent on the system in RETROFIT_MANDATED -> VERIFIED_CLOSED with closed_at = clock"
      - "recompute store_compliance_posture and inspection_penalty_exposure"
      - "increments RefrigerantSystem.version by 1"

  # ------------------------------------------------------- RegulatoryReport
  - method: POST
    path: "/regulatory-reports"
    description: "Open a DRAFT filing for a store and reporting period. total_leaked_lbs is quantified under the chosen industry method (store_period_leaked_lbs); overlapping non-REJECTED periods for the same store are rejected."
    roles: [ComplianceManager]
    code: 201
    input: [store_id, report_type, period_start, period_end, leaked_lbs_method]
    output: RegulatoryReport
    side_effects:
      - "status = DRAFT; submission_count = 0; due_on = period_end + 60 days"
      - "total_leaked_lbs and included_system_count computed under leaked_lbs_method"
      - "days_late, base_assessment_usd, administrative_surcharge_usd, late_filing_assessment_usd all 0"

  - method: GET
    path: "/regulatory-reports"
    description: "List filings filtered by store, filing type or lifecycle status."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["store_id?", "report_type?", "status?", "leaked_lbs_method?", "limit?", "offset?"]
    output: RegulatoryReport[]
    side_effects: []

  - method: GET
    path: "/regulatory-reports/{id}"
    description: "Fetch one filing including its leaked-mass quantification and late-filing assessment."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: RegulatoryReport
    side_effects: []

  - method: POST
    path: "/regulatory-reports/{id}/submission"
    description: "Submit a DRAFT or REJECTED filing (RegulatoryReport.DRAFT_to_SUBMITTED / REJECTED_to_SUBMITTED). The late-filing assessment is computed here: the administrative surcharge bracket is selected from base_assessment_usd alone."
    roles: [ComplianceManager]
    code: 200
    input: ["submission_note?"]
    output: RegulatoryReport
    side_effects:
      - "status -> SUBMITTED; submitted_at = clock; submission_count += 1"
      - "total_leaked_lbs and included_system_count recomputed against the ledger as of the clock"
      - "days_late, base_assessment_usd, administrative_surcharge_usd and late_filing_assessment_usd computed (late_filing_assessment)"

  - method: POST
    path: "/regulatory-reports/{id}/decision"
    description: "Regulator accepts or rejects a submitted filing (RegulatoryReport.SUBMITTED_to_ACCEPTED / SUBMITTED_to_REJECTED). A REJECTED filing no longer blocks an overlapping period."
    roles: [Regulator]
    code: 200
    input: [decision, "rejection_reason_code?"]
    output: RegulatoryReport
    side_effects:
      - "ACCEPT: status -> ACCEPTED; decided_at = clock"
      - "REJECT: status -> REJECTED; decided_at = clock; rejection_reason_code recorded"

  # ------------------------------------------------------------- Inspection
  - method: POST
    path: "/inspections"
    description: "Regulator opens an inspection with a citation array. penalty_exposure_usd is the per-citation-rounded, multiplier-scaled, statutorily capped exposure. opened_by_user_id records the acting X-User-ID for segregation of duties at closure."
    roles: [Regulator]
    code: 201
    input: [store_id, inspector_name, citations]
    output: Inspection
    side_effects:
      - "status = OPEN; opened_at = clock; response_deadline = opened_at + 30 days"
      - "opened_by_user_id = X-User-ID"
      - "chronic_multiplier_applied from the store's current compliance_status"
      - "penalty_exposure_usd computed (inspection_penalty_exposure); capped = true when the uncapped sum exceeded 250000.00"
      - "Store.penalty_exposure_total_usd recomputed"

  - method: GET
    path: "/inspections"
    description: "List inspections filtered by store or lifecycle status."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: GET
    path: "/inspections/{id}"
    description: "Fetch one inspection including its live penalty exposure and applied multiplier."
    roles: [PlatformAdmin, ComplianceManager, Technician, StoreManager, Regulator]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: POST
    path: "/inspections/{id}/response"
    description: "Store files its inspection response (Inspection.OPEN_to_RESPONDED / ESCALATED_to_RESPONDED). A StoreManager may only respond for their own store."
    roles: [StoreManager, ComplianceManager]
    code: 200
    input: [response_summary, corrective_action_code]
    output: Inspection
    side_effects:
      - "status -> RESPONDED; responded_at = clock; response fields recorded"
      - "penalty_exposure_usd recomputed at the store's current multiplier"
      - "Store.penalty_exposure_total_usd recomputed"

  - method: POST
    path: "/inspections/{id}/closure"
    description: "Regulator closes a RESPONDED inspection (Inspection.RESPONDED_to_CLOSED). Segregation of duties: the closing X-User-ID must differ from opened_by_user_id. A CLOSED inspection is frozen - its exposure is never recomputed again and it leaves Store.penalty_exposure_total_usd."
    roles: [Regulator]
    code: 200
    input: [closure_note]
    output: Inspection
    side_effects:
      - "status -> CLOSED; closed_at = clock; closed_by_user_id = X-User-ID; closure_note recorded"
      - "penalty_exposure_usd frozen at its last computed value"
      - "Store.penalty_exposure_total_usd recomputed without this inspection"

  # ------------------------------------------------- operational endpoints
  - method: POST
    path: "/compliance-runs"
    description: "Advance the compliance epoch: sweep every deadline against the logical clock in a PINNED order - (1) repair-overdue, (2) verification-overdue, (3) extension expiry, (4) equipment verification lapse, (5) inspection escalation - each pass ordered by its deadline ASC then created_at ASC, then recompute every affected store's posture and penalty exposure."
    roles: [PlatformAdmin]
    code: 200
    input: ["store_id?"]
    output: { swept_repair_overdue_leak_event_ids: array, swept_verification_overdue_leak_event_ids: array, expired_extension_request_ids: array, overdue_equipment_ids: array, escalated_inspection_ids: array, stores_recomputed_count: integer, as_of: string }
    side_effects:
      - "LeakEvent OPEN with repair_deadline < clock -> REPAIR_OVERDUE"
      - "LeakEvent VERIFICATION_PENDING or FOLLOWUP_PENDING with verification_deadline < clock -> VERIFICATION_OVERDUE"
      - "ExtensionRequest PENDING with expires_at < clock -> EXPIRED"
      - "RecoveryEquipment CERTIFIED with last_verification_on + 365 days < clock -> VERIFICATION_OVERDUE"
      - "Inspection OPEN with response_deadline < clock -> ESCALATED with escalated_at = clock"
      - "store_compliance_posture and inspection_penalty_exposure recomputed for every touched store"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical current UTC instant, which every deadline, window and expiry rule reads. The startup default is exactly 2026-08-01T00:00:00Z - before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string, previous_utc: string }
    side_effects: ["the logical clock used by every calculation, deadline check and sweep is set to current_utc; no entity is mutated by this call alone"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not one of the five declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "The caller's role is not listed in the target endpoint's roles (e.g. a Technician calling POST /retrofit-plans)" }
  - { id: ERR_TECHNICIAN_IDENTITY_MISMATCH, http: 403, condition: "X-User-Role == Technician but X-User-ID differs from the technician_id in the body" }
  - { id: ERR_STORE_SCOPE_VIOLATION, http: 403, condition: "X-User-Role == StoreManager but X-User-ID is not the store_id owning the target resource" }

  # ---- request shape
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed JSON, missing required field, wrong type, undeclared enum value, or a numeric field outside the ranges enumerated by validations[priority=3]; field-specific numeric bounds that carry their own error_id (for example RetrofitPlan.estimated_cost_usd -> ERR_PLAN_COST_OUT_OF_RANGE at priority 49) are NOT reported as ERR_INVALID_REQUEST" }

  # ---- existence
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "store_id in the path or body matches no Store" }
  - { id: ERR_REFRIGERANT_TYPE_NOT_FOUND, http: 404, condition: "refrigerant_type_id or target_refrigerant_type_id matches no RefrigerantType" }
  - { id: ERR_SYSTEM_NOT_FOUND, http: 404, condition: "system_id, replacement_system_id or the path id matches no RefrigerantSystem" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "technician_id or assigned_technician_id matches no Technician" }
  - { id: ERR_RECOVERY_EQUIPMENT_NOT_FOUND, http: 404, condition: "recovery_equipment_id or the path id matches no RecoveryEquipment" }
  - { id: ERR_CYLINDER_NOT_FOUND, http: 404, condition: "cylinder_id or the path id matches no Cylinder" }
  - { id: ERR_SERVICE_RECORD_NOT_FOUND, http: 404, condition: "service_record_id or the path id matches no ServiceRecord" }
  - { id: ERR_LEAK_EVENT_NOT_FOUND, http: 404, condition: "leak_event_id or the path id matches no LeakEvent" }
  - { id: ERR_REPAIR_ATTEMPT_NOT_FOUND, http: 404, condition: "repair_attempt_id or the path id matches no RepairAttempt" }
  - { id: ERR_VERIFICATION_TEST_NOT_FOUND, http: 404, condition: "The path id matches no VerificationTest" }
  - { id: ERR_EXTENSION_REQUEST_NOT_FOUND, http: 404, condition: "The path id matches no ExtensionRequest" }
  - { id: ERR_RETROFIT_PLAN_NOT_FOUND, http: 404, condition: "retrofit_plan_id or the path id matches no RetrofitPlan" }
  - { id: ERR_REGULATORY_REPORT_NOT_FOUND, http: 404, condition: "The path id matches no RegulatoryReport" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "The path id matches no Inspection" }

  # ---- concurrency (§1.2.1 - the only sanctioned write-write conflict mechanism)
  - { id: ERR_STALE_SYSTEM_VERSION, http: 412, condition: "expected_system_version does not equal the current RefrigerantSystem.version on POST /service-records or POST /retrofit-plans" }

  # ---- state
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "The requested action is not a declared transition from the entity's current state (e.g. approving an already-DENIED extension request, submitting an APPROVED plan, closing an OPEN inspection that was never responded to)" }
  - { id: ERR_SYSTEM_RETIRED, http: 409, condition: "The target RefrigerantSystem has operational_status == RETIRED" }
  - { id: ERR_LEAK_EVENT_TERMINAL, http: 409, condition: "The target LeakEvent is VERIFIED_CLOSED or VOIDED" }
  - { id: ERR_SERVICE_RECORD_ALREADY_VOIDED, http: 409, condition: "POST /service-records/{id}/void on a record whose voided is already true" }
  - { id: ERR_OPEN_LEAK_EVENT_EXISTS, http: 409, condition: "POST /leak-events for a system that already carries a non-terminal LeakEvent" }

  # ---- business_safety
  - { id: ERR_TECHNICIAN_SUSPENDED, http: 422, condition: "The named Technician has status == SUSPENDED" }
  - { id: ERR_TECHNICIAN_CERT_EXPIRED, http: 422, condition: "The named Technician's certification_expires_on is before the work timestamp" }
  - { id: ERR_TECHNICIAN_CERT_TYPE_INVALID, http: 422, condition: "The Technician's certification_type does not satisfy the system's required_certification_type (UNIVERSAL satisfies all)" }
  - { id: ERR_RECOVERY_EQUIPMENT_NOT_CERTIFIED, http: 422, condition: "The named RecoveryEquipment is VERIFICATION_OVERDUE or its last_verification_on is more than 365 days before performed_at" }
  - { id: ERR_RECOVERY_EQUIPMENT_INCOMPATIBLE, http: 422, condition: "RecoveryEquipment.certified_for_pressure_class differs from the handled RefrigerantType.pressure_class" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VERIFICATION, http: 422, condition: "The verifying technician_id equals the technician_id of the RepairAttempt under test" }
  - { id: ERR_SEGREGATION_OF_DUTIES_INSPECTION, http: 422, condition: "The X-User-ID closing an inspection equals Inspection.opened_by_user_id" }

  # ---- business_referential
  - { id: ERR_REFRIGERANT_TYPE_MISMATCH, http: 422, condition: "The cylinder's refrigerant_type_id does not match the system's current chemistry (or the retrofit target chemistry on a RETROFIT_CONVERSION)" }
  - { id: ERR_UNRECLAIMED_REFRIGERANT_REUSE, http: 422, condition: "ADD_REFRIGERANT from a cylinder whose disposition == SENT_FOR_RECLAIM" }
  - { id: ERR_CROSS_STORE_RESOURCE, http: 422, condition: "The RecoveryEquipment or Cylinder named on a record belongs to a different Store than the system" }
  - { id: ERR_LEAK_EVENT_SYSTEM_MISMATCH, http: 422, condition: "The body's system_id is not the LeakEvent's system, or the named RepairAttempt belongs to a different LeakEvent" }
  - { id: ERR_REPAIR_ATTEMPT_NOT_CURRENT, http: 422, condition: "The named RepairAttempt is not the event's newest attempt with outcome == AWAITING_VERIFICATION" }
  - { id: ERR_EXTENSION_REASON_NOT_APPLICABLE, http: 422, condition: "reason_code INDUSTRIAL_PROCESS_SHUTDOWN_REQUIRED on a non-industrial system, or PERMIT_PENDING without an APPROVED / IN_PROGRESS RetrofitPlan" }
  - { id: ERR_TARGET_REFRIGERANT_PROHIBITED, http: 422, condition: "The retrofit target RefrigerantType has phasedown_status == PROHIBITED" }
  - { id: ERR_RETROFIT_TARGET_REQUIRED, http: 422, condition: "plan_type == RETROFIT without target_refrigerant_type_id, or plan_type == RETIRE with one" }

  # ---- business_temporal
  - { id: ERR_TIMESTAMP_AFTER_CLOCK, http: 422, condition: "A physical-world timestamp in the body is later than the logical clock" }
  - { id: ERR_SERVICE_DATE_OUT_OF_RANGE, http: 422, condition: "performed_at is earlier than the system's installed_on" }
  - { id: ERR_REPAIR_BEFORE_DETECTION, http: 422, condition: "repair_completed_at is earlier than the leak event's detected_at" }
  - { id: ERR_TECHNICIAN_SCHEDULE_CONFLICT, http: 409, condition: "The technician's half-open interval [performed_at, occupies_until) overlaps an existing non-voided assignment; abutting intervals do NOT conflict" }
  - { id: ERR_EQUIPMENT_DECONTAMINATION_CONFLICT, http: 409, condition: "The machine's closed decontamination-buffered interval [performed_at, equipment_released_at] shares any instant with an existing non-voided occupation; abutting intervals DO conflict" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "A non-REJECTED RegulatoryReport for the same store has an inclusive [period_start, period_end] range sharing at least one day" }
  - { id: ERR_EXTENSION_WINDOW_CLOSED, http: 422, condition: "An extension is filed after the leak event's repair_deadline has passed, or decided more than 15 days after requested_at" }

  # ---- business_constraint
  - { id: ERR_GRANTED_DAYS_EXCEED_REQUESTED, http: 422, condition: "granted_days > requested_days on an extension approval" }
  - { id: ERR_EXTENSION_DAY_CAP_EXCEEDED, http: 422, condition: "The post-approval sum of APPROVED granted_days on the leak event would exceed 30" }
  - { id: ERR_RETROFIT_INCOMPATIBLE, http: 422, condition: "Submitting a RETROFIT plan whose compatibility_result == INCOMPATIBLE" }
  - { id: ERR_CYLINDER_FILL_LIMIT_EXCEEDED, http: 422, condition: "A recovery would push cylinder current_contents_lbs above fill_limit_lbs (DOT 80 percent rule)" }
  - { id: ERR_INSUFFICIENT_CYLINDER_CONTENTS, http: 422, condition: "A charge would drive cylinder current_contents_lbs below 0.0" }
  - { id: ERR_CHARGE_EXCEEDS_NAMEPLATE, http: 422, condition: "The projected system charge after the record would exceed full_charge_lbs" }
  - { id: ERR_NEGATIVE_SYSTEM_CHARGE, http: 422, condition: "The projected system charge after the record would fall below 0.0" }
  - { id: ERR_SYSTEM_CHARGE_NOT_RECOVERED, http: 422, condition: "Retirement attempted while current_charge_lbs > 0.0" }
  - { id: ERR_OPEN_LEAK_EVENT_BLOCKS_RETIREMENT, http: 422, condition: "Retirement attempted with a non-terminal LeakEvent and no APPROVED / IN_PROGRESS RETIRE plan" }
  - { id: ERR_RECLAIM_QUANTITY_EXCEEDS_SHIPPED, http: 422, condition: "reclaimed_quantity_lbs exceeds the cylinder's shipped_for_reclaim_lbs" }
  - { id: ERR_RECLAIM_PURITY_NOT_VERIFIED, http: 422, condition: "A reclaim certification carries purity_verified == false" }
  - { id: ERR_DUPLICATE_IDENTIFIER, http: 409, condition: "store_code, epa_certification_number, cylinder_serial, equipment_serial or RefrigerantType name collides with an existing row" }
  - { id: ERR_VOID_NOT_PERMITTED, http: 422, condition: "Voiding a record whose retention_until has passed, or on which a PASS VerificationTest depends" }

  # ---- business_fiscal
  - { id: ERR_PLAN_COST_OUT_OF_RANGE, http: 422, condition: "estimated_cost_usd is <= 0.00 or > 5000000.00" }

# =============================================================================
# 1.7 RBAC Matrix (segregation_of_duties)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator of the compliance platform. Owns the epoch (compliance runs) and the logical clock; never files or decides compliance artifacts."
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance-runs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /stores"
      - "POST /refrigerant-types"
      - "all GET reads"

  - name: ComplianceManager
    description: "Corporate refrigerant compliance lead. Configures the asset inventory, files extension requests, retrofit plans and regulatory reports, voids service records, and manages cylinder reclaim documentation. Cannot decide its own filings."
    identity: "opaque"
    exclusive_operations:
      - "POST /systems"
      - "POST /systems/{id}/retirement"
      - "POST /technicians"
      - "POST /technicians/{id}/status-change"
      - "POST /recovery-equipment"
      - "POST /recovery-equipment/{id}/verification"
      - "POST /cylinders"
      - "POST /cylinders/{id}/reclaim-shipment"
      - "POST /cylinders/{id}/reclaim-certification"
      - "POST /service-records/{id}/void"
      - "POST /extension-requests"
      - "POST /retrofit-plans"
      - "POST /retrofit-plans/{id}/submission"
      - "POST /retrofit-plans/{id}/completion"
      - "POST /regulatory-reports"
      - "POST /regulatory-reports/{id}/submission"
    shared_operations:
      - "POST /stores"
      - "POST /refrigerant-types"
      - "POST /leak-events"
      - "POST /inspections/{id}/response"
      - "all GET reads"

  - name: Technician
    description: "EPA Section 608 certified service technician. The only role that may file service records, repair attempts and verification tests, and may only act under their own identity."
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /service-records"
      - "POST /repair-attempts"
      - "POST /verification-tests"
    shared_operations:
      - "all GET reads"

  - name: StoreManager
    description: "Manager of a single supermarket. Reads their own store's compliance posture and files inspection responses; X-User-ID is the Store id."
    identity: "entity_backed:Store"
    exclusive_operations: []
    shared_operations:
      - "POST /inspections/{id}/response"
      - "all GET reads"

  - name: Regulator
    description: "Agency inspector and adjudicator. Opens and closes inspections, declares leak events found on inspection, and decides extension requests, retrofit plans and regulatory filings. Never files the artifacts it decides, and cannot close an inspection it opened."
    identity: "opaque"
    exclusive_operations:
      - "POST /inspections"
      - "POST /inspections/{id}/closure"
      - "POST /extension-requests/{id}/decision"
      - "POST /extension-requests/{id}/revocation"
      - "POST /retrofit-plans/{id}/decision"
      - "POST /regulatory-reports/{id}/decision"
    shared_operations:
      - "POST /leak-events"
      - "all GET reads"
