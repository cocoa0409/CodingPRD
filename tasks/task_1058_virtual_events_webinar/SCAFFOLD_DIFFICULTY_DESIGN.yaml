            - call: "POST /api/booths"
              payload: { sponsor_id: "${sp_id}", headline: "Umbrella Booth", lead_quota: 3 }
              as: SponsorUser
              as_user_id: "${sp_id}"
              captures: { booth_id: $.data.id }
            - call: "POST /api/booths/${booth_id}/submit"
              payload: {}
              as: SponsorUser
              as_user_id: "${sp_id}"
              captures: { contract_before: $.data.state }
          trigger:
            - call: "POST /api/booths/${booth_id}/approve"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
              captures: { err: $.data.error_id }
          assert:
            - "${contract_before} == SUBMITTED"
            - "${err} == ERR_CONTRACT_NOT_SIGNED"
            - "HTTP status == 409"
