            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Chairman's office transfer with folder list", transfer_instrument_reference: "IT-2026-094" }
              as: Archivist
            - call: "POST /accessions/${acc_id}/process"
