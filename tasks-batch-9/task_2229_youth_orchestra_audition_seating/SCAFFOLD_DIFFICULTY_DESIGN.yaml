          trigger:
            - call: "POST /placements/${pl2_id}/accept"
              payload: { instrument_loan_requested: false }
              as: Guardian
              as_user_id: "${m2_id}"
            - call: "POST /seat-assignments/${seat1_id}/vacate"
              payload: {}
              as: ArtisticDirector
          assert:
            - "Checkpoint 1, before the trigger: SectionQuota.${q_violin_id}.filled_count == 1 and balance_state == BALANCED; GET /seat-assignments?section_quota_id=${q_violin_id}&status=ACTIVE total_count == 1; GET /placements?ensemble_id=${ens_id}&status=ACCEPTED total_count == 1; GET /placements?ensemble_id=${ens_id}&status=OFFERED total_count == 1; Ensemble.${ens_id}.offered_count == 1; Season.${season_id}.status == PLACEMENT"
            - "Checkpoint 2, after trigger call 1: SectionQuota.${q_violin_id}.filled_count == 2 and balance_state == FULL; ACTIVE seat count == 2; ACCEPTED placement count == 2; OFFERED placement count == 0 and Ensemble.${ens_id}.offered_count == 0; Ensemble.${ens_id}.seated_count == 2 and roster_state == SEATED; Season.${season_id}.seated_ensemble_count == 1 and status == IN_SEASON"
            - "Checkpoint 3, after trigger call 2: SeatAssignment.${seat1_id}.status == VACATED; SectionQuota.${q_violin_id}.filled_count == 1 and balance_state == BALANCED; ACTIVE seat count == 1; Placement.${pl1_id}.status == RELEASED so ACCEPTED placement count == 1; the three counts agree again"
            - "Ensemble.${ens_id}.seated_count == 1, roster_state == FORMING, offered_count == 0, and Season.${season_id}.seated_ensemble_count == 0 while Season.${season_id}.status remains IN_SEASON (no reverse season transition exists)"
            - "calculations.waitlist_promotion found an empty queue, so GET /placements?ensemble_id=${ens_id}&status=OFFERED still returns total_count == 0 and no placement gained a waitlist_rank"
            - "The one surviving ACTIVE seat belongs to member 2 and chair_ranking has renumbered it to chair_number == 1 with is_principal == true"

