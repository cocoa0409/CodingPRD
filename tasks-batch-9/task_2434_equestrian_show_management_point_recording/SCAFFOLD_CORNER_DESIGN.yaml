      - name: regional_show_cap_truncates_the_third_win
        claim_type: constants_applied
        grounds:
          - calculations.rider_standing_points.variants.regional_scale
          - calculations.rider_standing_points.constants.REGIONAL_SHOW_CAP
          - calculations.rider_standing_points.constants.REGIONAL_PLACING_CAP
          - endpoints.GET_/riders/{id}/standings
        distinguishing_aspect: |
          REGIONAL_SHOW_CAP is a per-rider, per-show ceiling of 20 applied at credit
          time against the points already accepted for that rider. A rider who wins
          three classes earns 8 + 8 + 8 = 24 raw, but the third win is TRUNCATED to
          4 so the total lands exactly on 20 — it is not dropped to 0 and it is not
          left at 8 with a capped read-time total. The runner-up (5 + 5 + 5 = 15)
          proves the cap does not touch riders below it, and the national ladder
          (10 + 10 + 10 = 30.0) proves the cap is regional-only.
