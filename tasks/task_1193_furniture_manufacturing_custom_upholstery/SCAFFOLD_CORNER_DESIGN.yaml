      - name: error_envelope_shape_on_forbidden
        claim_type: standard_crud
        grounds: ["response_envelope", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "The error envelope is uniform: a 403 carries meta.api_request_id, response_type 'error', and data.error_id/data.message keys."
        test_recipe:
          setup: ["Nothing needed"]
          setup_api_calls: []
          trigger:
            - call: "POST /mill/cells"
              payload: { cell_code: "C-X", cell_type: "CUTTING", capacity_slots: 1, certifications: [] }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "403; response_type == 'error'; data.error_id == ERR_INSUFFICIENT_PERMISSIONS; data.message present; meta.api_request_id present"

