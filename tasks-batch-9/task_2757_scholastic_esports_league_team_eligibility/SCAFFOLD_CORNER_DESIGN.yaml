            - "Team.${tm_a_id}.integrity_score == 100.00 and Team.${tm_b_id}.integrity_score == 100.00 — the fifth tiebreaker cannot separate them either"
            - "Season.${se_id}.match_point_pool == 0"

      - name: scholarship_multiplier_pays_half_on_probation_and_nothing_when_unevaluated
        claim_type: constants_applied
        grounds:
          - calculations.showcase_scholarship_award
          - calculations.showcase_scholarship_award.constants.ACADEMIC_MULTIPLIER
          - calculations.showcase_scholarship_award.constants.PERFORMANCE_BONUS_RATE
          - validations[priority=59]
          - errors[ERR_ALREADY_NOMINATED]
        distinguishing_aspect: |
          Two multiplier rows that are easy to omit: PROBATION pays
          round_half_up(150000 * 0.5) == 75000 provisional, BRONZE, bonus
          round_half_up(75000 * 0.05) == 3750, award 78750; and a student who has never
          had a posting is UNEVALUATED, which pays 0 provisional, still lands in BRONZE
          and yields a 0 award rather than a null or a crash on a missing map key.
          Re-nominating the PROBATION student then returns 409 ERR_ALREADY_NOMINATED and
          must not recompute the award.
        test_recipe:
          setup:
            - "TERM_SNAPSHOT district (min_gpa 2.0, probation_gpa_floor 1.75), school, certified coach, title, season, one DRAFT team"
            - "Student P with a 1.800 posting (PROBATION) holding a SUB slot; student U with no postings at all holding a second SUB slot"
