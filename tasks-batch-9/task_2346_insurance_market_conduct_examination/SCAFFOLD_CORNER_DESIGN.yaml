              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { crit_id: "$.data.id", crit_exposure: "$.data.restitution_exposure_cents" }
            - call: "POST /market-conduct/criticisms/${crit_id}/responses"
              payload: { position: "CONCUR", narrative: "The carrier concurs with the documentation finding and has retrained its staff." }
              as: InsurerRespondent
              as_user_id: "${aurora_id}"
            - call: "POST /market-conduct/criticisms/${crit_id}/finalize"
              payload: { disposition: "SUSTAINED", penalty_units: 5, disposition_note: "Criticism sustained after review of the carrier rebuttal." }
              as: SupervisingExaminer
              as_user_id: "22222222-2222-2222-2222-222222222222"
            - call: "GET /market-conduct/examinations/${exam_id}"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_v: "$.data.version" }
            - call: "POST /market-conduct/examinations/${exam_id}/corrective-action-plans"
              payload: { expected_examination_version: "${exam_v}", milestone_count: 4, completion_due_date: "2027-03-31", narrative: "The carrier commits to reunderwriting the affected claim inventory and retraining adjusters." }
              as: InsurerRespondent
              as_user_id: "${aurora_id}"
              captures: { plan_id: "$.data.id" }
            - call: "POST /market-conduct/corrective-action-plans/${plan_id}/review"
              payload: { decision: "APPROVE", review_note: "The department accepts the remediation plan as filed." }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
            - call: "GET /market-conduct/examinations/${exam_id}"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_v2: "$.data.version" }
            - call: "POST /market-conduct/examinations/${exam_id}/consent-orders"
              payload: { expected_examination_version: "${exam_v2}", order_number: "NV-MC-2026-0042", penalty_variant: "PER_VIOLATION" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { order_id: "$.data.id", order_restitution: "$.data.restitution_cents" }
            - call: "POST /market-conduct/consent-orders/${order_id}/execute"
              payload: { signed_by: "M. Halloran, President and CEO" }
              as: InsurerRespondent
              as_user_id: "${aurora_id}"
          trigger:
            - call: "POST /market-conduct/collaborations/${collab_id}/allocate-restitution"
              as: MultistateCoordinator
              as_user_id: "55555555-5555-5555-5555-555555555555"
              captures: { e1: "$.data.error_id" }
            - call: "GET /market-conduct/collaborations/${collab_id}"
              as: MultistateCoordinator
              as_user_id: "55555555-5555-5555-5555-555555555555"
              captures: { c_status: "$.data.status", c_alloc: "$.data.allocated_total_cents" }
            - call: "GET /market-conduct/examinations/${exam_id}/exposure-summary"
              as: MultistateCoordinator
              as_user_id: "55555555-5555-5555-5555-555555555555"
              captures: { sum_r: "$.data.aggregate_restitution_cents", sum_u: "$.data.penalty_units_total" }
          assert:
            - "allocate-restitution returns 409 with error_id == ERR_RESTITUTION_NOT_CONSERVED"
            - "The consent order is EXECUTED and the collaboration is ACTIVE, so the state and order gates were both satisfied - this is not ERR_ENFORCEMENT_RECORD_STATE_INVALID and not ERR_ORDER_NOT_EXECUTED"
            - "The collaboration is still ACTIVE with allocated_total_cents == 0 and is not driven to SETTLED"
            - "exposure-summary confirms aggregate_restitution_cents == 0 while penalty_units_total == 5 - the penalty is real and only the restitution pool is empty"

      - name: err_data_call_not_awaiting_response_on_a_dispositioned_production
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DATA_CALL_NOT_AWAITING_RESPONSE
          - validations[priority 40 ERR_DATA_CALL_NOT_AWAITING_RESPONSE]
        distinguishing_aspect: |
          Responding is legal only from ISSUED or OVERDUE, so a second answer on an already answered or
          already dispositioned production is refused.
        excluded_because:
          difficulty_instance: state_priority_40_beats_constraint_priority_65_on_data_call_respond
          rationale: "That difficulty instance sends a second response that both breaks the awaiting-response state and over-produces against the request, and asserts that the state code answers rather than the records code - which exercises this error on the same endpoint."

      - name: err_criticism_state_invalid_outside_the_rebuttal_window
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CRITICISM_STATE_INVALID
          - validations[priority 40 ERR_CRITICISM_STATE_INVALID]
        distinguishing_aspect: |
          Answering demands ISSUED while rebutting and finalising demand RESPONDED, so every off-phase call
          on a criticism answers with this one code.
        excluded_because:
          difficulty_instance: criticism_rebuttal_cycle_loops_to_issued_and_terminates_at_round_bound
          rationale: "That difficulty instance walks the ISSUED-RESPONDED cycle repeatedly and asserts the refusal at each off-phase point, covering both the answer side and the rebuttal side of this code."

      - name: err_enforcement_record_state_invalid_on_plan_order_and_panel
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ENFORCEMENT_RECORD_STATE_INVALID
          - validations[priority 40 ERR_ENFORCEMENT_RECORD_STATE_INVALID]
        distinguishing_aspect: |
          Plan review demands PROPOSED, order execution demands DRAFT and allocation demands ACTIVE, so one
          code guards three enforcement records.
        excluded_because:
          difficulty_instance: consent_order_gate_reads_plan_state_not_plan_existence
          rationale: "That difficulty instance reviews an already-reviewed plan and asserts this refusal, and its companion allocation instance covers the panel and order forms of the same code."

      - name: err_exam_already_terminal_after_withdrawal
        claim_type: error_triggerable
        grounds:
          - errors.ERR_EXAM_ALREADY_TERMINAL
          - validations[priority 40 ERR_EXAM_ALREADY_TERMINAL]
        distinguishing_aspect: |
          Once an examination is ABORTED or PUBLISHED every further write on it or on any of its children is
          refused with this code ahead of the endpoint's own state gate.
        excluded_because:
          difficulty_instance: abort_cascades_children_insurer_counters_and_closes_the_cycle
          rationale: "That difficulty instance aborts a fully populated examination and then replays writes against the examination and its children, asserting this code in preference to each endpoint's own state error."

      - name: err_insurer_not_examinable_for_a_withdrawn_carrier
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INSURER_NOT_EXAMINABLE
          - validations[priority 50 ERR_INSURER_NOT_EXAMINABLE]
        distinguishing_aspect: |
          A WITHDRAWN carrier can be neither examined from scratch nor carried past the scope lock, so the
          licence is re-read at lock time rather than trusted from creation time.
        excluded_because:
          difficulty_instance: lock_scope_blocked_by_withdrawn_insurer_license
          rationale: "That difficulty instance withdraws the carrier's licence after the examination has been created and then attempts the lock, asserting this refusal and the fact that the licence is re-read rather than cached."

      - name: err_scope_area_not_tested_before_criticism
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SCOPE_AREA_NOT_TESTED
          - validations[priority 51 ERR_SCOPE_AREA_NOT_TESTED]
        distinguishing_aspect: |
          A criticism may only cite an area whose whole sample has been reviewed, so a partially reviewed
          area is refused even when the examination stage is correct.
        excluded_because:
          difficulty_instance: safety_priority_51_beats_constraint_priority_66_on_criticism_issuance
          rationale: "That difficulty instance issues a criticism against a partially reviewed area with an inflated affected_file_count and asserts that this code answers ahead of the affected-files code."

      - name: err_rebuttal_rounds_exhausted_at_the_third_round
        claim_type: error_triggerable
        grounds:
          - errors.ERR_REBUTTAL_ROUNDS_EXHAUSTED
          - validations[priority 54 ERR_REBUTTAL_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          The negotiation loop is bounded at three response rounds, after which the department must dispose
          of the criticism rather than rebut again.
        excluded_because:
          difficulty_instance: criticism_rebuttal_cycle_loops_to_issued_and_terminates_at_round_bound
          rationale: "That difficulty instance consumes all three rounds and asserts this refusal on the fourth attempt, together with the counter values at every intermediate hop."

      - name: err_exam_window_conflict_on_overlapping_fieldwork
        claim_type: error_triggerable
        grounds:
          - errors.ERR_EXAM_WINDOW_CONFLICT
          - validations[priority 55 ERR_EXAM_WINDOW_CONFLICT]
        distinguishing_aspect: |
          A carrier may not be under two non-terminal examinations whose half-open fieldwork windows
          intersect, while windows that merely touch are allowed.
        excluded_because:
          difficulty_instance: examination_fieldwork_windows_are_half_open_per_insurer
          rationale: "That difficulty instance places a second examination so that its start equals the first one's end - allowed - and then one day earlier - refused - which pins the half-open comparison and exercises this code."

      - name: err_due_date_out_of_window_beyond_fieldwork_end
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUE_DATE_OUT_OF_WINDOW
          - validations[priority 56 ERR_DUE_DATE_OUT_OF_WINDOW]
        distinguishing_aspect: |
          A response due date must fall on or after the logical clock date and on or before the fieldwork
          end date, with the upper bound inclusive.
        excluded_because:
          difficulty_instance: data_call_due_dates_need_a_three_day_gap_within_one_scope_area
          rationale: "That difficulty instance issues data calls at the exact fieldwork end date and one day past it, asserting acceptance and then this refusal alongside the buffer rule on the same endpoint."

      - name: err_data_call_window_conflict_inside_the_buffer
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DATA_CALL_WINDOW_CONFLICT
          - validations[priority 57 ERR_DATA_CALL_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Two live data calls on one scope area must be at least three days apart, and exactly three days
          is allowed because the comparison is strict.
        excluded_because:
          difficulty_instance: data_call_due_dates_need_a_three_day_gap_within_one_scope_area
          rationale: "That difficulty instance issues a second data call at a two-day gap and then at a three-day gap on the same area, asserting this refusal and then acceptance at the exact boundary."

      - name: err_cap_not_approved_at_order_drafting
        claim_type: error_triggerable
        grounds:
          - errors.ERR_CAP_NOT_APPROVED
          - validations[priority 60 ERR_CAP_NOT_APPROVED]
        distinguishing_aspect: |
          A consent order may only be drafted once a corrective action plan has been approved, and a plan
          that merely exists is not enough.
        excluded_because:
          difficulty_instance: consent_order_gate_reads_plan_state_not_plan_existence
          rationale: "That difficulty instance drafts an order against an examination holding a PROPOSED and then a REJECTED plan, asserting this refusal in both cases and success only after approval."

      - name: err_order_not_executed_at_allocation
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ORDER_NOT_EXECUTED
          - validations[priority 61 ERR_ORDER_NOT_EXECUTED]
        distinguishing_aspect: |
          Multistate restitution may only be allocated once the carrier has signed the consent order, so a
          drafted order does not unlock the sweep.
        excluded_because:
          difficulty_instance: multistate_allocation_requires_an_executed_consent_order
          rationale: "That difficulty instance attempts allocation against a DRAFT order and asserts this refusal, then executes the order and asserts the sweep succeeds unchanged - and the publication form of the same code is covered by the endpoints section."

      - name: err_no_tolerance_breach_on_an_egregious_criticism
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NO_TOLERANCE_BREACH
          - validations[priority 62 ERR_NO_TOLERANCE_BREACH]
        distinguishing_aspect: |
          An EGREGIOUS criticism is only available on an area whose error rate has breached its tolerance,
          so the severity ladder is gated on measured results.
        excluded_because:
          difficulty_instance: tolerance_breach_at_exact_error_rate_equality
          rationale: "That difficulty instance tests an area at exactly its tolerance and one error below it, issuing an EGREGIOUS criticism in both cases and asserting this refusal only in the unbreached one."

      - name: err_records_exceed_request_on_an_over_production
        claim_type: error_triggerable
        grounds:
          - errors.ERR_RECORDS_EXCEED_REQUEST
          - validations[priority 65 ERR_RECORDS_EXCEED_REQUEST]
        distinguishing_aspect: |
          A carrier may not submit more records than were requested, which keeps completeness bounded at
          100 percent.
        excluded_because:
          difficulty_instance: state_priority_40_beats_constraint_priority_65_on_data_call_respond
          rationale: "That difficulty instance sends an over-production on an ISSUED data call - where this code is the answer - and again on an already answered one, where the state code takes precedence."

      - name: err_affected_files_exceed_errors_on_criticism_issuance
        claim_type: error_triggerable
        grounds:
          - errors.ERR_AFFECTED_FILES_EXCEED_ERRORS
          - validations[priority 66 ERR_AFFECTED_FILES_EXCEED_ERRORS]
        distinguishing_aspect: |
          A criticism cannot claim more affected files than the area actually produced as errors, tying the
          narrative to the measured sample.
        excluded_because:
          difficulty_instance: safety_priority_51_beats_constraint_priority_66_on_criticism_issuance
          rationale: "That difficulty instance issues a criticism with an inflated affected_file_count against a fully tested area - where this code is the answer - and against a partially reviewed one, where the untested-area code wins."

      - name: err_response_incomplete_below_the_acceptance_floor
        claim_type: error_triggerable
        grounds:
          - errors.ERR_RESPONSE_INCOMPLETE
          - validations[priority 67 ERR_RESPONSE_INCOMPLETE]
        distinguishing_aspect: |
          A production may only be accepted at an effective completeness of at least 95 percent, measured
          after the late penalty rather than on the raw ratio.
        excluded_because:
          difficulty_instance: data_call_acceptance_at_exact_effective_completeness_boundary
          rationale: "That difficulty instance accepts a production at exactly 95.00 effective completeness and refuses one a hundredth below it, which exercises this code at its boundary."

      - name: err_penalty_cap_exceeded_on_the_gross_penalty
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PENALTY_CAP_EXCEEDED
          - validations[priority 70 ERR_PENALTY_CAP_EXCEEDED]
        distinguishing_aspect: |
          The statutory ceiling is measured on the gross penalty before the cooperation credit, so an order
          whose net penalty sits under the cap can still be refused.
        excluded_because:
          difficulty_instance: consent_order_credit_tier_is_keyed_on_subtotal_not_restitution
          rationale: "That difficulty instance drafts orders on either side of the cap with the credit deliberately straddling it, asserting this refusal on the gross figure rather than on the net one."
