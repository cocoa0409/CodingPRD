  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: voucher_void_restores_money_invariant_exactly
        grounds:
          - calculations.residency_budget_ledger
          - state_machines.PaymentVoucher.SUBMITTED_to_APPROVED
          - state_machines.PaymentVoucher.APPROVED_to_VOIDED
          - entities.Residency.fields.available_cents
          - entities.Residency.fields.disbursed_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY. Approval moves exactly 31454 cents from
          encumbered to disbursed and voiding moves exactly the same 31454 back,
