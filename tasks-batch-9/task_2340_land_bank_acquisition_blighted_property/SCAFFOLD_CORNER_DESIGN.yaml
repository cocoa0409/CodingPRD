              payload: { legal_name: "Vera Lindqvist", applicant_type: "INDIVIDUAL", contact_email: "vera@example.com" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /land-bank/applicants"
              payload: { legal_name: "Walter Nkemdirim", applicant_type: "INDIVIDUAL", contact_email: "walter@example.com" }
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { appl_b_id: $.data.id }
            - call: "POST /land-bank/disposition-applications"
