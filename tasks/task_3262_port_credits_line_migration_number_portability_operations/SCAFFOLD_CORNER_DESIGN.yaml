          trigger:
            - call: "GET /portability/migration-requests/${mr}"
              as: CustomerService
          assert:
            - "MigrationRequest.${mr}.migration_state == APPROVED"
            - "MigrationRequest.${mr}.cutover_completed_at == null"
            - "MigrationRequest.${mr}.carried_mdn == null"
      - name: customer_reads_own_labels_only_through_scoped_lists
        claim_type: multi_tenancy
        grounds:
          - roles[Customer].identity
          - endpoints["GET /portability/accounts/{id}/subscriber-lines"]
