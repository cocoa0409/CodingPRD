            - "HospiceElection.${he_id}.current_period_number == 2"
            - "HospiceElection.${he_id}.current_period_end == 2026-11-29T00:00:00.000Z"
            - "HospiceElection.${he_id}.cumulative_benefit_days == 180"

  # =========================================================================
  # Consistency model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: death_cascade_effects_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints["POST /palliative/patients/{id}/death-events"]
          - calculations.patient_active_daily_mme
        distinguishing_aspect: "The consistency model is immediate: the death-event response body already shows program_status DECEASED, records_frozen true, active_daily_mme 0.0 and open_symptom_count 0, with no second read required."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE with one ACTIVE MedicationOrder contributing 30.0 and one OPEN SymptomAssessment on an ACTIVE CarePlan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2052", full_name: "Bram Oyelaran", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/medication-orders"
              payload: { patient_id: "${p_id}", drug: "MORPHINE_PO", dose_amount: 30, days_supply: 14 }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { mo_id: $.data.id }
            - call: "POST /palliative/medication-orders/${mo_id}/attestations"
              payload: { attestation_type: "VERIFICATION" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/care-plans"
              payload: { patient_id: "${p_id}", plan_title: "Plan", problem_list: ["pain"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_id: $.data.id }
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: {}
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/symptom-assessments"
              payload: { patient_id: "${p_id}", care_plan_id: "${cp_id}", reporter_type: "SELF", item_pain: 6, item_dyspnea: 6, item_nausea: 6, item_anxiety: 6, item_fatigue: 6 }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /palliative/patients/${p_id}/death-events"
              payload: { pronouncing_clinician_user_id: "u_physician_1" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { returned_status: $.data.program_status, returned_mme: $.data.active_daily_mme }
          assert:
            - "${returned_status} == DECEASED"
            - "${returned_mme} == 0.0"
            - "The death-event response body itself has records_frozen true and open_symptom_count 0"
            - "MedicationOrder.${mo_id}.status == DISCONTINUED"
            - "CarePlan.${cp_id}.status == CLOSED"
            - "SymptomAssessment.${sa_id}.triage_status == RESOLVED"
