  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_repayment_create_stale_statement_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[repayment-create-stale-statement]
          - errors[ERR_STALE_VERSION]
          - validations[priority=16]
        distinguishing_aspect: |
          Two strictly-sequential repayment creates: the first carries the correct
          expected_statement_version and succeeds (advancing Statement.version via its clear cascade);
          a second create still carrying the pre-advance version is rejected with ERR_STALE_VERSION (412).
        test_recipe:
          setup:
            - "CHARGE company; settled tx 40000; statement CLOSED+ISSUED (DUE). Client observed statement version V0 at issue."
          setup_api_calls:
            - call: "POST /companies"
              payload: { legal_name: "Occ Co", credit_limit_cents: 1000000, billing_model: "CHARGE" }
              as: FinanceAdmin
              captures: { co: "$.data.id" }
            - call: "GET /statements"
              payload: { company_id: "${co}" }
              as: FinanceAdmin
              captures: { stmt1: "$.data[0].id" }
            - call: "POST /employees"
              payload: { company_id: "${co}", email: "h34@acme.com", full_name: "H", employee_role: "CARDHOLDER" }
              as: FinanceAdmin
              captures: { emp_h: "$.data.id" }
            - call: "POST /spend-policies"
              payload: { company_id: "${co}", name: "Std", per_transaction_limit_cents: 500000, approval_threshold_cents: 1000000 }
              as: FinanceAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /cards"
              payload: { company_id: "${co}", employee_id: "${emp_h}", spend_policy_id: "${pol}", form_factor: "VIRTUAL", card_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { card: "$.data.id" }
            - call: "POST /cards/${card}/transactions"
              payload: { merchant_name: "M", mcc_code: "5999", amount_cents: 40000 }
              as: FinanceAdmin
              captures: { tx: "$.data.id" }
            - call: "POST /transactions/${tx}/clear"
              payload: {}
              as: FinanceAdmin
            - call: "POST /transactions/${tx}/settle"
              payload: { settled_amount_cents: 40000 }
              as: FinanceAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { company_id: "${co}", to_iso8601: "2026-06-30T00:00:00Z" }
              as: FinanceAdmin
            - call: "POST /statements/${stmt1}/close"
              payload: {}
              as: FinanceAdmin
            - call: "POST /statements/${stmt1}/issue"
              payload: {}
              as: FinanceAdmin
              captures: { v0: "$.data.version" }
            - call: "POST /repayments"
              payload: { statement_id: "${stmt1}", amount_cents: 10000, expected_statement_version: "${v0}" }
              as: FinanceAdmin
              captures: { rp1: "$.data.id" }
            - call: "POST /repayments/${rp1}/clear"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /repayments"
              payload: { statement_id: "${stmt1}", amount_cents: 10000, expected_statement_version: "${v0}" }
              as: FinanceAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 412"
            - "data.error_id == ERR_STALE_VERSION"

      - name: version_increments_on_card_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Card.fields.status
          - state_machines.Card.ACTIVE_to_FROZEN
        distinguishing_aspect: "A Card created at version 1, after one freeze mutation, reports version 2 (version increments by one per mutation)."
