  - rule_id: resource_temporal_overlap
    instances:
      - name: schedule_slot_changeover_buffer_half_open
        grounds:
          - validations[priority=7]
          - entities.ScheduleSlot.fields.mold_id
        distinguishing_aspect: |
          Interval semantics on MachineLine: half-open windows [start, end) plus a
          mold-dependent changeover buffer — order2's slot starting exactly at
          order1's end (gap 0) is rejected when the slot mold snapshots differ
          (null vs M8 -> 90 min buffer), but a gap of exactly 90 min passes
          (>= inclusive). The companion instance uses closed-interval semantics on
          a different resource (dock doors), where touching endpoints collide.
        test_recipe:
          setup:
            - "Qualified spec; order1 SCHEDULED on line L1 [2026-08-02T10:00,14:00) while NO mold was installed (slot mold_id null); mold M8 then installed; order2 DRAFT"
