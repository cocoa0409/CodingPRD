            - call: "POST /metric-snapshots"
              payload: { seller_id: "${sb_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 2100, delivered_or_refunded_volume: 2010, defect_claims_pending: 0, defect_claims_substantiated: 20, late_shipments: 84, pre_fulfillment_cancellations: 0, shipments_total: 2100, shipments_with_valid_tracking: 1995, source: "PLATFORM_PIPELINE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /metric-snapshots"
              payload: { seller_id: "${sc_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", order_volume: 2100, delivered_or_refunded_volume: 2020, defect_claims_pending: 0, defect_claims_substantiated: 20, late_shipments: 84, pre_fulfillment_cancellations: 0, shipments_total: 2100, shipments_with_valid_tracking: 1995, source: "PLATFORM_PIPELINE" }
