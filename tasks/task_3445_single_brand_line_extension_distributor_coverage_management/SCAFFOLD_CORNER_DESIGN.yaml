# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3445_single_brand_line_extension_distributor_coverage_management
# Breadth probe: every claim §1.1-§1.7 declares that SCAFFOLD_DIFFICULTY_DESIGN
# does not already exercise. §1.8-covered corners appear as excluded_because
# stubs. Logical-clock default (no set_current_utc call): 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: brand_create_returns_defaults_and_envelope
        claim_type: Creation
        grounds:
          - entities.Brand
          - endpoints.POST_/brand-ops/brands
          - response_envelope
        distinguishing_aspect: "A brand created with only name and legal_entity_name returns 201 with status OPERATING, posture NORMAL, dilution 0, identity share 10000, risk 0, equity_budget_bps defaulted to 10000, version 1 — the computed fields are populated in the creation response itself."
        test_recipe:
          setup:
            - "Empty database; logical clock at the startup default 2026-09-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - &k_brand
              call: "POST /brand-ops/brands"
              payload: { name: "Multi-Use Brand", legal_entity_name: "Multi-Use Products Co" }
              as: BrandManager
              captures: { brand_id: $.data.id }
          assert:
            - "the response status is 201, response_type is object, and meta.api_request_id and meta.api_request_timestamp are present"
            - "Brand.${brand_id}.status == OPERATING and lockdown_reason is null"
            - "Brand.${brand_id}.protection_posture == NORMAL, dilution_consumed_bps == 0, core_identity_share_bps == 10000, genericization_risk_bps == 0"
            - "Brand.${brand_id}.equity_budget_bps == 10000 (default applied)"
            - "the response carries non-null id, created_at, updated_at and version == 1"

      - name: formulation_get_roundtrips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Formulation
          - endpoints.GET_/brand-ops/formulations/{id}
        distinguishing_aspect: "Every stored formulation field round-trips through GET exactly as posted, including the null master_formulation_id and the DRAFT initial status."
        test_recipe:
          setup:
            - "Brand with line CORE; formulation v1 with 4 components."
          setup_api_calls:
            - *k_brand
            - &k_line_core
              call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "CORE", name: "Core Multi-Use", is_core: true, target_channels: ["HARDWARE"] }
              as: BrandManager
              captures: { line_id: $.data.id }
            - &k_form
              call: "POST /brand-ops/product-lines/${line_id}/formulations"
              payload: { version_label: "v1", component_codes: ["C1", "C2", "C3", "C4"], voc_class: "STANDARD" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { form_id: $.data.id }
          trigger:
            - call: "GET /brand-ops/formulations/${form_id}"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
          assert:
            - "the response status is 200"
            - "Formulation.${form_id}.version_label == v1 and component_codes == [C1, C2, C3, C4]"
            - "Formulation.${form_id}.voc_class == STANDARD and master_formulation_id is null"
            - "Formulation.${form_id}.status == DRAFT and sealed_at is null"
            - "Formulation.${form_id}.product_line_id == ${line_id}"

      - name: distributors_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/brand-ops/distributors
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three distributors on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false; omitting both applies the defaults limit 10, offset 0."
        test_recipe:
          setup:
            - "Brand and market US; three distributors created."
          setup_api_calls:
            - *k_brand
            - &k_market
              call: "POST /brand-ops/markets"
              payload: { country_code: "US", name: "United States", registration_required: false, voc_regime: "STANDARD", allowed_channels: ["HARDWARE", "AUTOMOTIVE", "INDUSTRIAL", "MASS"] }
              as: RegulatoryAffairs
              captures: { market_id: $.data.id }
            - &k_dist
              call: "POST /brand-ops/distributors"
              payload: { legal_name: "Ace Distribution", home_market_id: "${market_id}", channels_served: ["HARDWARE"], credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { dist_id: $.data.id, dist_v1: $.data.version }
            - call: "POST /brand-ops/distributors"
              payload: { legal_name: "Beta Wholesale", home_market_id: "${market_id}", channels_served: ["MASS"], credit_limit_cents: 2000000 }
              as: ChannelManager
            - call: "POST /brand-ops/distributors"
              payload: { legal_name: "Cobalt Trade", home_market_id: "${market_id}", channels_served: ["INDUSTRIAL"], credit_limit_cents: 3000000 }
              as: ChannelManager
          trigger:
            - call: "GET /brand-ops/distributors"
              payload: { limit: 2, offset: 0 }
              as: ChannelManager
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /brand-ops/distributors?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /brand-ops/distributors with no parameters returns 3 rows and applies limit 10 / offset 0"
            - "rows are ordered by created_at ascending"

      - name: distributor_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/brand-ops/distributors/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the path produces 404 ERR_NOT_FOUND with the error envelope, not a 400 or 500."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /brand-ops/distributors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ChannelManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: brand_create_missing_legal_entity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Brand.fields.legal_entity_name
          - errors.ERR_INVALID_REQUEST
          - validations[priority=4]
        distinguishing_aspect: "legal_entity_name is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST and no brand row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /brand-ops/brands"
              payload: { name: "Incomplete Brand" }
              as: BrandManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /brand-ops/product-lines and every other list remain empty (nothing persisted)"

      - name: brand_create_with_computed_field_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Brand.fields.protection_posture
          - validations[priority=4]
        distinguishing_aspect: "protection_posture is source computed; a client-supplied value in the create body is ignored and the response still shows the computed NORMAL."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /brand-ops/brands"
              payload: { name: "Spoofed Brand", legal_entity_name: "Spoof Co", protection_posture: "CRITICAL" }
              as: BrandManager
              captures: { brand_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Brand.${brand_id}.protection_posture == NORMAL (the supplied CRITICAL was ignored, not stored)"

      - name: sell_through_report_carries_no_version_or_updated_at
        claim_type: Immutability
        grounds:
          - entities.SellThroughReport
        distinguishing_aspect: "SellThroughReport declares common_fields false: its create response carries id and created_at plus business fields, but no version and no updated_at; net_units is computed as max(0, sold - returned)."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z. Brand with LAUNCHED core line; distributor APPROVED with one ACTIVE assignment."
          setup_api_calls:
            - *k_brand
            - *k_market
            - &k_mfr1
              call: "POST /brand-ops/contract-manufacturers"
              payload: { legal_name: "Alpha Blending Co", site_country: "US", capabilities: ["BLENDING"] }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { mfr1_id: $.data.id }
            - &k_mfr1q
              call: "POST /brand-ops/contract-manufacturers/${mfr1_id}/qualify"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &k_mfr2
              call: "POST /brand-ops/contract-manufacturers"
              payload: { legal_name: "Beta Filling Inc", site_country: "US", capabilities: ["AEROSOL_FILL"] }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { mfr2_id: $.data.id }
            - &k_mfr2q
              call: "POST /brand-ops/contract-manufacturers/${mfr2_id}/qualify"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - *k_line_core
            - *k_form
            - &k_seal
              call: "POST /brand-ops/formulations/${form_id}/seal"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &k_g1
              call: "POST /brand-ops/confidentiality-grants"
              payload: { manufacturer_id: "${mfr1_id}", formulation_id: "${form_id}", component_scope: ["C1", "C2"], expires_on: "2027-12-31T00:00:00Z", grant_reason: "PRODUCTION" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { g1_id: $.data.id }
            - &k_g1g
              call: "POST /brand-ops/confidentiality-grants/${g1_id}/grant"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &k_g1a
              call: "POST /brand-ops/confidentiality-grants/${g1_id}/activate"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &k_g2
              call: "POST /brand-ops/confidentiality-grants"
              payload: { manufacturer_id: "${mfr2_id}", formulation_id: "${form_id}", component_scope: ["C3", "C4"], expires_on: "2027-12-31T00:00:00Z", grant_reason: "PRODUCTION" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { g2_id: $.data.id }
            - &k_g2g
              call: "POST /brand-ops/confidentiality-grants/${g2_id}/grant"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &k_g2a
              call: "POST /brand-ops/confidentiality-grants/${g2_id}/activate"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - &k_review
              call: "POST /brand-ops/product-lines/${line_id}/brand-review"
              payload: { decision: "APPROVE" }
              as: BrandManager
            - &k_pack
              call: "POST /brand-ops/product-lines/${line_id}/pack-formats"
              payload: { size_ml: 311, delivery_system: "AEROSOL", channel_restrictions: ["HARDWARE"], case_pack_qty: 12 }
              as: SupplyPlanner
              captures: { pack_id: $.data.id, pack_v1: $.data.version }
            - &k_tool
              call: "POST /brand-ops/pack-formats/${pack_id}/tool"
              payload: {}
              as: SupplyPlanner
              captures: { pack_v2: $.data.version }
            - &k_price
              call: "POST /brand-ops/pack-formats/${pack_id}/price-lists"
              payload: { channel: "HARDWARE", list_price_cents: 499, map_price_cents: 300, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_pack_format_version: "${pack_v2}" }
              as: PricingAnalyst
              captures: { pl1_id: $.data.id }
            - &k_enterprod
              call: "POST /brand-ops/pack-formats/${pack_id}/enter-production"
              payload: {}
              as: SupplyPlanner
            - &k_launch
              call: "POST /brand-ops/product-lines/${line_id}/launch"
              payload: {}
              as: BrandManager
            - *k_dist
            - &k_dist_app
              call: "POST /brand-ops/distributors/${dist_id}/approve"
              payload: {}
              as: ChannelManager
              captures: { dist_v2: $.data.version }
            - &k_asg
              call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "HARDWARE", exclusive: true, starts_on: "2026-08-01", ends_on: "2027-07-31", annual_quota_units: 1200, expected_distributor_version: "${dist_v2}" }
              as: ChannelManager
              captures: { asg_id: $.data.id }
            - &k_asg_act
              call: "POST /brand-ops/coverage-assignments/${asg_id}/activate"
              payload: {}
              as: ChannelManager
          trigger:
            - call: "POST /brand-ops/distributors/${dist_id}/sell-through-reports"
              payload: { coverage_assignment_id: "${asg_id}", period_month: "2026-08", units_sold: 7, units_returned: 2 }
              as: DistributorContact
              as_user_id: "${dist_id}"
              captures: { report_id: $.data.id, report_net: $.data.net_units }
          assert:
            - "the response status is 201 and data carries id, created_at, distributor_id, coverage_assignment_id, period_month, units_sold, units_returned"
            - "data does NOT contain version or updated_at keys (common_fields false)"
            - "net_units == 5 (7 sold minus 2 returned)"

      - name: second_core_line_and_duplicate_line_code_rejected
        claim_type: Type Constraints
        grounds:
          - errors.ERR_CORE_LINE_EXISTS
          - errors.ERR_DUPLICATE_LINE_CODE
          - entities.ProductLine.fields.is_core
          - entities.ProductLine.fields.line_code
        distinguishing_aspect: "Per-brand uniqueness: a second is_core line on the same brand is ERR_CORE_LINE_EXISTS and a reused line_code is ERR_DUPLICATE_LINE_CODE, while the same line_code on a different brand succeeds."
        test_recipe:
          setup:
            - "Brand A with line CORE (is_core true); brand B empty."
          setup_api_calls:
            - *k_brand
            - *k_line_core
            - call: "POST /brand-ops/brands"
              payload: { name: "Second Brand", legal_entity_name: "Second Products Co" }
              as: BrandManager
              captures: { brand_b_id: $.data.id }
          trigger:
            - call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "CORE-2", name: "Another Core", is_core: true, target_channels: ["MASS"] }
              as: BrandManager
              captures: { error_id: $.data.error_id }
            - call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "CORE", name: "Duplicate Code", is_core: false, target_channels: ["MASS"] }
              as: BrandManager
              captures: { error_id_2: $.data.error_id }
            - call: "POST /brand-ops/brands/${brand_b_id}/product-lines"
              payload: { line_code: "CORE", name: "Same Code Other Brand", is_core: true, target_channels: ["MASS"] }
              as: BrandManager
              captures: { line_b_id: $.data.id }
          assert:
            - "second core line: 409 with error_id == ERR_CORE_LINE_EXISTS"
            - "duplicate line_code on the same brand: 409 with error_id == ERR_DUPLICATE_LINE_CODE"
            - "the same line_code on brand B succeeds with 201"

      - name: formulation_component_count_limits
        claim_type: Type Constraints
        grounds:
          - entities.Formulation.fields.component_codes
          - errors.ERR_COMPONENT_LIMIT_EXCEEDED
          - errors.ERR_INSUFFICIENT_COMPONENTS
        distinguishing_aspect: "Component count constraints are asymmetric: creation rejects more than 12 components (ERR_COMPONENT_LIMIT_EXCEEDED) but accepts 2, while sealing then rejects the 2-component draft (ERR_INSUFFICIENT_COMPONENTS)."
        test_recipe:
          setup:
            - "Brand with line CORE."
          setup_api_calls:
            - *k_brand
            - *k_line_core
          trigger:
            - call: "POST /brand-ops/product-lines/${line_id}/formulations"
              payload: { version_label: "v-fat", component_codes: ["C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13"], voc_class: "STANDARD" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /brand-ops/product-lines/${line_id}/formulations"
              payload: { version_label: "v-thin", component_codes: ["C1", "C2"], voc_class: "STANDARD" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { thin_id: $.data.id }
            - call: "POST /brand-ops/formulations/${thin_id}/seal"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { error_id_2: $.data.error_id }
          assert:
            - "13 components at create: 422 with error_id == ERR_COMPONENT_LIMIT_EXCEEDED"
            - "2 components at create: 201 (creation tolerates a small draft)"
            - "sealing the 2-component draft: 422 with error_id == ERR_INSUFFICIENT_COMPONENTS"
            - "Formulation.${thin_id}.status remains DRAFT"

      - name: market_country_code_is_unique
        claim_type: Type Constraints
        grounds:
          - entities.Market.fields.country_code
          - errors.ERR_MARKET_CODE_EXISTS
        distinguishing_aspect: "A second market with country_code US is rejected with ERR_MARKET_CODE_EXISTS even when every other field differs."
        test_recipe:
          setup:
            - "Market US exists."
          setup_api_calls:
            - *k_market
          trigger:
            - call: "POST /brand-ops/markets"
              payload: { country_code: "US", name: "United States Duplicate", registration_required: true, voc_regime: "STRICT", allowed_channels: ["MASS"] }
              as: RegulatoryAffairs
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_MARKET_CODE_EXISTS"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: discontinued_line_rejects_all_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ProductLine
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "DISCONTINUED is terminal: brand-review, launch and a second discontinue on a discontinued line all fail with 409 ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup:
            - "Brand with line EXT-1 in PILOT (sealed formulation), then discontinued."
          setup_api_calls:
            - *k_brand
            - call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "EXT-1", name: "Doomed Extension", is_core: false, target_channels: ["HARDWARE"] }
              as: BrandManager
              captures: { line_id: $.data.id }
            - *k_form
            - *k_seal
            - *k_review
            - call: "POST /brand-ops/product-lines/${line_id}/discontinue"
              payload: {}
              as: BrandManager
          trigger:
            - call: "POST /brand-ops/product-lines/${line_id}/brand-review"
              payload: { decision: "APPROVE" }
              as: BrandManager
              captures: { error_id: $.data.error_id }
            - call: "POST /brand-ops/product-lines/${line_id}/launch"
              payload: {}
              as: BrandManager
              captures: { error_id_2: $.data.error_id }
            - call: "POST /brand-ops/product-lines/${line_id}/discontinue"
              payload: {}
              as: BrandManager
              captures: { error_id_3: $.data.error_id }
          assert:
            - "all three triggers return 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "ProductLine.${line_id}.status remains DISCONTINUED"

      - name: third_brand_review_rejection_auto_discontinues
        claim_type: valid_transition
        grounds:
          - state_machines.ProductLine.FORMULATION_to_DISCONTINUED
          - entities.ProductLine.fields.brand_review_attempts
          - calculations.brand_equity_consumption
        distinguishing_aspect: "The third REJECT decision auto-transitions the line to DISCONTINUED with brand_review_attempts frozen at 3, and because the line never reached PILOT it contributes 0 to brand dilution consumption."
        test_recipe:
          setup:
            - "Brand with line EXT-R in FORMULATION (sealed formulation)."
          setup_api_calls:
            - *k_brand
            - call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "EXT-R", name: "Thrice Rejected", is_core: false, target_channels: ["HARDWARE", "MASS"] }
              as: BrandManager
              captures: { line_id: $.data.id }
            - *k_form
            - *k_seal
          trigger:
            - call: "POST /brand-ops/product-lines/${line_id}/brand-review"
              payload: { decision: "REJECT" }
              as: BrandManager
            - call: "POST /brand-ops/product-lines/${line_id}/brand-review"
              payload: { decision: "REJECT" }
              as: BrandManager
            - call: "POST /brand-ops/product-lines/${line_id}/brand-review"
              payload: { decision: "REJECT" }
              as: BrandManager
              captures: { st: $.data.status, att: $.data.brand_review_attempts }
            - call: "GET /brand-ops/brands/${brand_id}"
              payload: {}
              as: BrandManager
              captures: { consumed: $.data.dilution_consumed_bps }
          assert:
            - "the third REJECT returns status == DISCONTINUED and brand_review_attempts == 3"
            - "Brand.${brand_id}.dilution_consumed_bps == 0 (a never-approved line freezes no cost and contributes nothing)"

      - name: registration_reject_revise_resubmit_loop
        claim_type: valid_transition
        grounds:
          - state_machines.MarketRegistration.SUBMITTED_to_REJECTED
          - state_machines.MarketRegistration.REJECTED_to_DRAFT
          - entities.MarketRegistration.fields.revise_count
        distinguishing_aspect: "The registration review loop SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED -> ACTIVE increments revise_count exactly once and the resubmission is approvable."
        test_recipe:
          setup:
            - "Brand with PILOT core line; market DE registration_required true; registration DRAFT with expires_on 2027-01-01T00:00:00Z."
          setup_api_calls:
            - *k_brand
            - *k_line_core
            - *k_form
            - *k_seal
            - *k_review
            - call: "POST /brand-ops/markets"
              payload: { country_code: "DE", name: "Germany", registration_required: true, voc_regime: "STANDARD", allowed_channels: ["HARDWARE"] }
              as: RegulatoryAffairs
              captures: { market_de_id: $.data.id }
            - call: "POST /brand-ops/market-registrations"
              payload: { market_id: "${market_de_id}", product_line_id: "${line_id}", formulation_id: "${form_id}", expires_on: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
              captures: { reg_id: $.data.id }
            - call: "POST /brand-ops/market-registrations/${reg_id}/submit"
              payload: {}
              as: RegulatoryAffairs
          trigger:
            - call: "POST /brand-ops/market-registrations/${reg_id}/reject"
              payload: { reason: "dossier incomplete" }
              as: RegulatoryAffairs
              captures: { st1: $.data.status }
            - call: "POST /brand-ops/market-registrations/${reg_id}/revise"
              payload: {}
              as: RegulatoryAffairs
              captures: { st2: $.data.status, rc: $.data.revise_count }
            - call: "POST /brand-ops/market-registrations/${reg_id}/submit"
              payload: {}
              as: RegulatoryAffairs
              captures: { st3: $.data.status }
            - call: "POST /brand-ops/market-registrations/${reg_id}/approve"
              payload: { registration_number: "REG-DE-1001" }
              as: RegulatoryAffairs
              captures: { st4: $.data.status, reg_no: $.data.registration_number }
          assert:
            - "reject -> REJECTED; revise -> DRAFT with revise_count == 1; resubmit -> SUBMITTED; approve -> ACTIVE"
