            - "Project.${proj}.status == SUBSTANTIALLY_COMPLETE  (unchanged)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: payapp_billing_window_half_open_overlap_rejected
        grounds:
          - validations[priority=8]
          - entities.PayApplication.fields.period_from
          - errors[ERR_BILLING_PERIOD_OVERLAP]
        distinguishing_aspect: >
          Half-open interval semantics on the PayApplication billing-window
          resource: a new window [2026-01-15, 2026-02-15) overlaps an existing
          CERTIFIED window [2026-01-01, 2026-01-31) because 2026-01-15 <
          2026-01-31. Adjacency (period_from == prior period_to) would NOT
          overlap; this instance forces a genuine interior overlap rejection.
        test_recipe:
          setup:
            - "Project + SOV; PayApplication 1 with window [2026-01-01, 2026-01-31) created, billed, submitted, CERTIFIED (project version 2)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "WinP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 100000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/certify"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
              captures: { pv2: $.data.version }
            - call: "GET /projects/${proj}"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
              captures: { pv_cur: $.data.version }
          trigger:
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 2, period_from: "2026-01-15T00:00:00.000Z", period_to: "2026-02-15T00:00:00.000Z", expected_project_version: "${pv_cur}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_BILLING_PERIOD_OVERLAP  (2026-01-15 < 2026-01-31, half-open interior overlap)"

      - name: inspection_window_closed_interval_buffer_conflict_rejected
        grounds:
          - validations[priority=9]
          - entities.InspectionWindow.fields.buffer_minutes
          - errors[ERR_INSPECTION_BUFFER_CONFLICT]
        distinguishing_aspect: >
          Closed-interval-with-buffer semantics on a different resource
          (InspectionWindow): an existing BOOKED slot [10:00, 11:00] with
          buffer 30 min blocks a new slot [11:15, 12:00] because the 15-minute
          gap is strictly less than 30 — unlike pay-app windows, even
          non-overlapping but too-close intervals conflict. Different interval
          arithmetic (gap-vs-buffer vs interior-overlap), different resource.
        test_recipe:
          setup:
            - "Project created; one InspectionWindow BOOKED [2026-03-01T10:00, 2026-03-01T11:00] with buffer_minutes 30."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "InspP", owner_user_id: "owner-1", original_contract_sum_cents: 500000 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
            - call: "POST /inspection-windows"
              payload: { project_id: "${proj}", inspector_name: "City A", scheduled_start: "2026-03-01T10:00:00.000Z", scheduled_end: "2026-03-01T11:00:00.000Z", buffer_minutes: 30 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { iw1: $.data.id }
          trigger:
            - call: "POST /inspection-windows"
              payload: { project_id: "${proj}", inspector_name: "City B", scheduled_start: "2026-03-01T11:15:00.000Z", scheduled_end: "2026-03-01T12:00:00.000Z", buffer_minutes: 30 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INSPECTION_BUFFER_CONFLICT  (15-min gap < 30-min buffer)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: retainage_conservation_certify_then_release
        grounds:
          - state_machines.PayApplication.SUBMITTED_to_CERTIFIED
          - state_machines.RetentionRelease.REQUESTED_to_APPROVED
          - entities.Project.fields.retainage_held_cents
          - entities.SovLine.fields.retainage_withheld_to_date_cents
        distinguishing_aspect: >
          Conserved quantity = retainage dollars. The forward action (certify)
          and its compensating action (retention release) must always preserve
          the invariant Project.retainage_held_cents == sum over ACTIVE SovLine
          of retainage_withheld_to_date_cents. After certify held=45000=30000+15000;
          after a 40000 release held=5000=0+5000 — the equality holds at both
          points with zero drift.
        test_recipe:
          setup:
            - "Project + SOV (001 600000, 002 400000); PayApplication 1 certified (held 45000: 001 30000, 002 15000), project version 2."
            - "RetentionRelease for 40000 requested (ev 2)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "RetConsP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "002", description: "Framing", scheduled_value_cents: 400000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov2: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 300000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov2}", work_completed_this_period_cents: 100000, materials_stored_cents: 50000 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/certify"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
              captures: { pv2: $.data.version }
            - call: "POST /retention-releases"
              payload: { project_id: "${proj}", amount_cents: 40000, expected_project_version: "${pv2}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { rr: $.data.id }
            - call: "GET /projects/${proj}"
              payload: {}
              as: Owner
              as_user_id: "owner-1"
              captures: { pv_cur: $.data.version }
          trigger:
            - call: "POST /retention-releases/${rr}/approve"
              payload: { expected_project_version: "${pv_cur}" }
              as: Owner
              as_user_id: "owner-1"
          assert:
            - "Project.${proj}.retainage_held_cents == 5000  (45000 - 40000)"
            - "SovLine.${sov1}.retainage_withheld_to_date_cents == 0 and SovLine.${sov2}.retainage_withheld_to_date_cents == 5000"
            - "Invariant: Project.${proj}.retainage_held_cents == SovLine.${sov1}.retainage_withheld_to_date_cents + SovLine.${sov2}.retainage_withheld_to_date_cents == 5000  (no drift)"

      - name: contract_sum_conservation_change_order_approve
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - entities.Project.fields.revised_contract_sum_cents
          - entities.SovLine.fields.scheduled_value_cents
          - validations[priority=11]
        distinguishing_aspect: >
          A different conserved quantity = contract-sum dollars. The balancing
          rule sum(line_edit deltas) == change_order_amount_cents guarantees the
          invariant Project.revised_contract_sum_cents == sum over ACTIVE SovLine
          of scheduled_value_cents survives a CO approval: before 1000000 ==
          600000 + 400000; after a +150000 CO (ADJUST +100000, ADD +50000)
          1150000 == 700000 + 400000 + 50000, zero drift.
        test_recipe:
          setup:
            - "Project + SOV (001 600000, 002 400000); CO-1 (+150000, ADJUST 001 +100000, ADD 003 +50000) submitted."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "SumConsP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
              as: Owner
              as_user_id: "owner-1"
              captures: { proj: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "002", description: "Framing", scheduled_value_cents: 400000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov2: $.data.id }
            - call: "POST /change-orders"
              payload: { project_id: "${proj}", co_number: "CO-1", change_order_amount_cents: 150000, line_edits: [ { action: "ADJUST", item_no: "001", scheduled_value_delta_cents: 100000 }, { action: "ADD", item_no: "003", description: "Sitework", scheduled_value_delta_cents: 50000 } ] }
              as: Contractor
              as_user_id: "gc-1"
              captures: { co1: $.data.id }
            - call: "POST /change-orders/${co1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Owner
              as_user_id: "owner-1"
              captures: { pv_cur: $.data.version }
          trigger:
            - call: "POST /change-orders/${co1}/approve"
              payload: { expected_project_version: "${pv_cur}" }
              as: Owner
              as_user_id: "owner-1"
          assert:
            - "Project.${proj}.revised_contract_sum_cents == 1150000"
            - "SovLine.${sov1}.scheduled_value_cents == 700000; new item_no 003 line scheduled_value_cents == 50000; SovLine.${sov2}.scheduled_value_cents == 400000"
            - "Invariant: Project.${proj}.revised_contract_sum_cents == sum of ACTIVE SovLine.scheduled_value_cents == 1150000  (no drift)"
