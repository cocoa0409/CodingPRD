              as: RiskOfficer
              captures: { dn_err_18: $.data.error_id }
            - call: "GET /shows/${dn_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { dn_sh_status_after: $.data.show_status, dn_sh_override_after: $.data.exposure_override_limit_cents, dn_sh_sales_after: $.data.sales_status }
            - call: "GET /ticket-tiers"
              payload: { show_id: "${dn_sh_id}" }
              as: TalentBuyer
            - call: "GET /budget-lines"
              payload: { show_id: "${dn_sh_id}" }
              as: TourAccountant
          assert:
            - "ALL EIGHTEEN PROBES ARE 403 ERR_ROLE_FORBIDDEN — ${dn_err_1} through ${dn_err_18} are each ERR_ROLE_FORBIDDEN with HTTP 403; no probe returns 401 (both headers were present), 404, 409 or 422"
            - "OWNERSHIP OF THE MARKET LEDGER IS EXCLUSIVE — the TalentBuyer cannot create a market (${dn_err_1}) or grant itself an exposure override (${dn_err_2}), and ${dn_sh_override_after} is still null"
            - "BOOKING AND DEAL-MAKING ARE EXCLUSIVE — the TourAccountant cannot book a show (${dn_err_3}), the RiskOfficer cannot write an offer (${dn_err_4}), and the TalentBuyer can neither accept (${dn_err_5}) nor counter (${dn_err_6}) its own offer: the negotiation has two sides and one role cannot play both"
            - "INVENTORY IS EXCLUSIVE — the VenueOperator cannot create a tier in its own room (${dn_err_7}), the RiskOfficer cannot put the show on sale (${dn_err_8}) and ${dn_sh_sales_after} == PRE_SALE, the ArtistRep cannot convert its own hold to a comp (${dn_err_9}), and GET /ticket-tiers?show_id=${dn_sh_id} still returns total_count 1"
            - "THE SETTLEMENT BOOK IS EXCLUSIVE IN BOTH DIRECTIONS — the TalentBuyer cannot add a budget line (${dn_err_10}) and GET /budget-lines?show_id=${dn_sh_id} still returns total_count 1; the RiskOfficer can neither verify an invoice (${dn_err_11}) nor open (${dn_err_12}), calculate (${dn_err_13}) or pay (${dn_err_14}) a settlement; the TourAccountant can neither reopen one (${dn_err_15}) nor answer for the artist (${dn_err_16})"
            - "THE CLAIM PATH IS EXCLUSIVE — the TourAccountant cannot file an insurance claim (${dn_err_17}) and the RiskOfficer cannot process refunds (${dn_err_18}); the two halves of the cancellation workflow are deliberately split"
            - "AUTHORIZATION PRECEDES EXISTENCE — probes 11 and 13 through 18 name ids that do not exist and are STILL 403, never 404: priority 2 is evaluated before priorities 10, 13 and 14, so an unauthorized caller cannot use error ids to discover which rows exist"
            - "NOTHING WAS WRITTEN — ${dn_sh_status_after} == CONFIRMED, and no market, show, offer, tier, budget line or settlement was created by any of the eighteen refused calls"

      - name: shared_operations_are_open_to_every_role_that_declares_them
        claim_type: Shared operations
        grounds:
          - "roles[TalentBuyer].shared_operations"
          - "roles[ArtistRep].shared_operations"
          - "roles[VenueOperator].shared_operations"
          - "roles[TourAccountant].shared_operations"
          - "roles[RiskOfficer].shared_operations"
        distinguishing_aspect: "Every shared write operation in §1.7 is exercised by EACH role listed against it, and each pair is driven from the half that the previous instance did not use: the VenueOperator sells tickets, the RiskOfficer approves an invoice and pauses sales, the ArtistRep and the VenueOperator each place and release a hold of the only kind they may touch, the VenueOperator papers an invoice and disputes one, and the RiskOfficer opens a cancellation event. The subtlety a naive implementation misses is that sharing an endpoint does not mean sharing its whole surface: POST /ticket-holds is open to three roles but the ArtistRep may only create ARTIST_HOLD and the VenueOperator only PRODUCTION_HOLD, and POST /budget-lines/{id}/variance-decision is open to two roles but only the RiskOfficer may decide a RISK_OFFICER line. The housekeeping endpoint is included here too, because POST /_clock/set_current_utc is shared by all five roles while POST /_ops/run is shared by only three."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Market Shared Market limit 5000000; Venue Shared Hall capacity 1000, facility fee 0, ticket tax 0; Artists Shared Act One and Shared Act Two."
            - "Show S1 (Act One, 2026-12-02T02:00Z) and Show S2 (Act Two, 2026-12-09T02:00Z) in the same hall on disjoint load windows; both CONFIRMED on an accepted FLAT_GUARANTEE offer of 100000 with expense cap 300000, both ON_SALE / SELLING with one GA tier of 300 seats at 5000."
            - "Budget lines: L1 = S1 PRODUCTION 200000 deductible, L2 = S1 MARKETING 100000, L3 = S2 PRODUCTION 100000. Market committed guarantee 200000 of 5000000 (utilization 4.00, posture OPEN)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Shared Market", region_code: "SR", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { sr_mk_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${sr_mk_id}", name: "Shared Hall", gross_capacity: 1000, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { sr_vn_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Shared Act One", agency: "Shr Talent", tier: "THEATER", historical_sellthrough_pct: 62.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { sr_a1_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Shared Act Two", agency: "Shr Talent", tier: "THEATER", historical_sellthrough_pct: 58.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { sr_a2_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${sr_a1_id}", venue_id: "${sr_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { sr_s1_id: $.data.id, sr_s1_v: $.data.version }
            - call: "POST /shows"
              payload: { artist_id: "${sr_a2_id}", venue_id: "${sr_vn_id}", event_at: "2026-12-09T02:00:00.000Z", load_in_at: "2026-12-08T14:00:00.000Z", load_out_at: "2026-12-09T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { sr_s2_id: $.data.id, sr_s2_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${sr_s1_id}", expected_show_version: "${sr_s1_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 100000, deposit_cents: 0, expense_cap_cents: 300000 }
              as: TalentBuyer
              captures: { sr_o1_id: $.data.id }
            - call: "POST /offers/${sr_o1_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${sr_o1_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${sr_a1_id}"
            - call: "POST /offers"
              payload: { show_id: "${sr_s2_id}", expected_show_version: "${sr_s2_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 100000, deposit_cents: 0, expense_cap_cents: 300000 }
              as: TalentBuyer
              captures: { sr_o2_id: $.data.id }
            - call: "POST /offers/${sr_o2_id}/submit"
