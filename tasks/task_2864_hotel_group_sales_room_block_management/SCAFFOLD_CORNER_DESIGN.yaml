      assert:
      - r_status == FINALIZED and r_finalizer == "ac-002"
      - r_short == 9 and r_damages == 159732
      - r_anc == 450000 and r_gross == 609732
      - r_rebate == 0 (billable_room_nights is 0, so 750 * 0 beats the cap of 152433)
      - r_net == 609732, r_snapshot == 0.01 and r_incentive == 6097, r_total == 603635
      - e_refinalize == ERR_RECONCILIATION_ALREADY_FINALIZED with HTTP 409
      - e_settled == ERR_RECEIVABLE_ALREADY_SETTLED with HTTP 409 — the POSTED charge can no longer be
        unwound
      - e_billed == ERR_BLOCK_ALREADY_BILLED with HTTP 409
      - c_status == COMPLETED, c_damages == 159732, c_rebate == 0 and c_recv == 609732 (450000 + 159732
        - 0)
      - b_inv == CLOSED and b_bill == SETTLED
      - tier == 0.03 and repeats == 1
  - name: state_gate_outranks_the_fiscal_gate_on_rooming_list_writes
    claim_type: priority_conflict
    grounds:
    - validations[priority=12]
    - validations[priority=29]
    - errors[ERR_BLOCK_ALLOTMENT_EXCEEDED]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / block_not_open_outranks_block_allotment_exceeded
      rationale: The named §1.8 instance constructs a reservation that violates both priority 12 and priority
        29 at once and asserts ERR_BLOCK_NOT_OPEN, plus the control leg that isolates ERR_BLOCK_ALLOTMENT_EXCEEDED
        on an OPEN block.
  - name: event_conclusion_outranks_the_block_cutoff_gate_on_reconciliations
    claim_type: priority_conflict
    grounds:
    - validations[priority=17]
    - validations[priority=22]
    - errors[ERR_EVENT_NOT_CONCLUDED]
    - errors[ERR_BLOCKS_NOT_CUT_OFF]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / event_not_concluded_outranks_blocks_not_cut_off
      rationale: Both reconciliation gates are violated simultaneously in the named §1.8 instance, which
        asserts ERR_EVENT_NOT_CONCLUDED first and then isolates ERR_BLOCKS_NOT_CUT_OFF after the clock
        moves past departure.
  - name: accept_is_gated_on_the_absence_of_a_pending_study
    claim_type: cross_entity_validation
    grounds:
    - validations[priority=18]
    - errors[ERR_DISPLACEMENT_NOT_APPROVED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / quote_accept_gated_on_no_pending_displacement_analysis
      rationale: The cross-entity gate — a quote's acceptability depends on the DisplacementAnalysis rows
        of its lead — is exactly the named §1.8 instance, which covers both the no-APPROVED and the still-PENDING
        halves of priority 18.
  - name: group_ceiling_is_an_aggregate_over_the_half_open_stay_range
    claim_type: aggregate_validation
    grounds:
    - validations[priority=28]
    - errors[ERR_GROUP_CEILING_EXCEEDED]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / group_ceiling_half_open_stay_range_adjacency
      rationale: The named §1.8 instance drives held + committed rooms to exactly group_ceiling_rooms
        and then one over it, and uses an adjacent-stay lead to prove the range is half-open.
  - name: function_space_overlap_includes_the_turnover_buffer
    claim_type: temporal_validation
    grounds:
    - validations[priority=25]
    - errors[ERR_FUNCTION_SPACE_CONFLICT]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / function_space_hold_45_minute_turnover_buffer
      rationale: Priority 25's buffered-interval overlap test, including the exactly-adjacent and one-minute-inside-the-buffer
        cases, is the named §1.8 instance.
  - name: charge_posting_is_gated_on_the_contract_being_signed
    claim_type: cross_entity_validation
    grounds:
    - validations[priority=10]
    - state_machines.AncillaryCharge.QUOTED_to_POSTED
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / ancillary_charge_post_gated_on_contract_signed
      rationale: The named §1.8 instance posts against a contract in each non-SIGNED state and asserts
        the refusal, then posts successfully after signature.
- section: endpoints
  instances:
  - name: envelope_and_pagination_shape_on_object_and_array_reads
    claim_type: standard_crud
    grounds:
    - response_envelope.success
    - response_envelope.pagination_defaults
    - endpoints["GET /group-sales/inventory-days"]
    - validations[priority=3]
    distinguishing_aspect: |
      Both response shapes are checked against §1.0 in one instance: an object read carries response_type "object" with the entity inline under data, and an array read carries response_type "array" plus the four pagination fields with the declared defaults (limit 10, offset 0). The three rejected query strings pin the documented bounds — limit 0 and limit 101 are outside 1..100 and a negative offset is invalid — which priority 3 answers with 400 rather than silently clamping.
    test_recipe:
      setup:
      - clock 2026-08-01T00:00:00Z; one CORPORATE account; three InventoryDay rows for 2026-11-09..11
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SystemOperator
        as_user_id: op-001
      - call: POST /group-sales/accounts
        payload: {name: Northwind Manufacturing, market_segment: CORPORATE, billing_contact_email: ap@northwind.example}
        as: SalesManager
        as_user_id: sm-001
        captures: {acct_id: $.data.id}
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-09', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-10', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-11', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      trigger:
      - call: GET /group-sales/accounts/${acct_id}
        payload: {}
        as: RevenueManager
        as_user_id: rm-001
        captures: {obj_name: $.data.name}
      - call: GET /group-sales/inventory-days
        payload: {}
        as: RevenueManager
        as_user_id: rm-001
        captures: {row0: '$.data[0].stay_date'}
      - call: GET /group-sales/inventory-days
        payload: {limit: 0}
        as: RevenueManager
        as_user_id: rm-001
        captures: {e_limit_low: $.data.error_id}
      - call: GET /group-sales/inventory-days
        payload: {limit: 101}
        as: RevenueManager
        as_user_id: rm-001
        captures: {e_limit_high: $.data.error_id}
      - call: GET /group-sales/inventory-days
        payload: {offset: -1}
        as: RevenueManager
        as_user_id: rm-001
        captures: {e_offset: $.data.error_id}
      assert:
      - the object read has response_type "object", meta.api_request_id, meta.api_request_timestamp and
        obj_name == "Northwind Manufacturing"; it carries no pagination fields
      - the unparameterised list read has response_type "array" with limit == 10, offset == 0, total_count
        == 3, has_more == false and row0 == "2026-11-09"
      - e_limit_low == ERR_INVALID_REQUEST with HTTP 400 (limit 0 is below the minimum of 1)
      - e_limit_high == ERR_INVALID_REQUEST with HTTP 400 (limit 101 is above the maximum of 100)
      - e_offset == ERR_INVALID_REQUEST with HTTP 400
  - name: the_clock_endpoint_moves_the_lead_time_scoring_tier
    claim_type: action_endpoint
    grounds:
    - endpoints["POST /_clock/set_current_utc"]
    - calculations.lead_qualification_score
    - entities.Lead.fields.qualification_score
    distinguishing_aspect: |
      The logical clock is the only source of 'now', and the lead-time component of the qualification score reads it: from 2026-05-01 the 2026-11-09 arrival is 192 days out, which earns the top band of 20 instead of the 12 earned from 2026-08-01, so the identical lead scores round_half_up(37 * 1.2) = 44 rather than 35. An implementation that uses wall-clock time cannot produce 44 at all.
    test_recipe:
      setup:
      - clock set to 2026-05-01T00:00:00Z before the lead is created; CORPORATE account; InventoryDay
        rows for 2026-11-09..11 with transient_adr_cents 21000; the lead is otherwise identical to the
        canonical one (2026-11-09 -> 2026-11-12, peak 4, 12 room nights, 100 sqft)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-05-01T00:00:00Z'}
        as: SystemOperator
        as_user_id: op-001
      - call: POST /group-sales/accounts
        payload: {name: Northwind Manufacturing, market_segment: CORPORATE, billing_contact_email: ap@northwind.example}
        as: SalesManager
        as_user_id: sm-001
        captures: {acct_id: $.data.id}
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-09', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-10', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-11', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/concession-packages
        payload: {name: Corporate Standard, room_rate_discount_pct: 0.0725, comp_room_ratio: 40, rebate_per_room_night_cents: 750,
          banquet_discount_pct: 0.1, av_discount_pct: 0.15, parking_discount_pct: 0.05, min_peak_rooms: 4,
          min_total_room_nights: 12, max_discount_stack_pct: 0.45}
        as: RevenueManager
        as_user_id: rm-001
        captures: {pkg_id: $.data.id}
      - call: POST /group-sales/leads
        payload: {account_id: '${acct_id}', program_name: Northwind Sales Kickoff, arrival_date: '2026-11-09',
          departure_date: '2026-11-12', peak_rooms: 4, total_requested_room_nights: 12, meeting_space_sqft_needed: 100,
          decision_deadline_at: '2026-09-15T00:00:00Z'}
        as: SalesManager
        as_user_id: sm-001
        captures: {lead_id: $.data.id}
      trigger:
      - call: POST /group-sales/leads/${lead_id}/qualify
        payload: {}
        as: SalesManager
        as_user_id: sm-001
        captures: {early_score: $.data.qualification_score, early_value: $.data.estimated_room_night_value_cents,
          early_status: $.data.status}
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SystemOperator
        as_user_id: op-001
        captures: {now: $.data.current_utc}
      - call: GET /group-sales/leads/${lead_id}
        payload: {}
        as: SalesManager
        as_user_id: sm-001
        captures: {score_after_clock: $.data.qualification_score}
      assert:
      - early_score == 44 — 192 days of lead time is >= 180, so the component is 20 and 37 * 1.2 = 44.4
        rounds to 44
      - early_value == 206640 — the room-night value does not depend on the clock
      - early_status == QUALIFIED
      - now == "2026-08-01T00:00:00.000Z"
      - score_after_clock == 44 — the score is frozen on the row at qualification and is NOT re-derived
        when the clock later moves
