              captures: { task1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/start"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          trigger:
            - call: "POST /inventory-integrity/count-tasks/${task1}/submit"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 409 and data.error_id == \"ERR_NO_COUNT_LINES\", never \"ERR_COUNT_COVERAGE_BELOW_MIN\""
            - "GET /inventory-integrity/count-tasks/${task1} reads coverage_pct 0.00, which independently violates the priority-84 rule that was not allowed to run"
            - "the task is still \"IN_PROGRESS\" with counted_line_count 0"
            - "after one HANDHELD line covering TEE-001 is added the same submit returns 200 with coverage_pct 100.00"

      - name: count_task_zero_length_window_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_91_ERR_INVALID_WINDOW
        distinguishing_aspect: "window_end must be STRICTLY after window_start, so a zero-length window that opens exactly on the due date passes the priority-90 due check and is then rejected by the priority-91 range check."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100 and an ACTIVE HANDHELD schedule whose next_due_date is 2026-08-01."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 422 and data.error_id == \"ERR_INVALID_WINDOW\""
            - "GET /inventory-integrity/count-tasks?count_schedule_id=${sched1} returns total_count 0"
            - "the schedule's next_due_date is untouched at 2026-08-01"
            - "the same request with window_end one second later returns 201"

      - name: count_line_for_item_outside_task_category_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_62_ERR_ITEM_CATEGORY_MISMATCH
          - validations.priority_63_ERR_ITEM_NOT_STOCKED_AT_STORE
        distinguishing_aspect: "Validity depends on a second entity: the counted item's own category must equal the task's. PAN-01 is properly stocked at the store, so the priority-63 check would pass — only the cross-entity category comparison fails."
        test_recipe:
          setup:
            - "Categories APPAREL and HOME; Store S100; Vendor VEND1; Item TEE-001 in APPAREL and Item PAN-01 in HOME."
            - "Stock positions at S100 for BOTH items, so the item-not-stocked rule cannot fire."
            - "An OPEN ShrinkPeriod covering the window and a started APPAREL count task."
