  - rule_id: resource_temporal_overlap
    instances:
      - name: line_campaign_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.campaign_line_occupation
          - errors[ERR_CAMPAIGN_WINDOW_CONFLICT]
          - entities.ProcessingCampaign.fields.window_start
          - entities.ProcessingCampaign.fields.window_end
        distinguishing_aspect: |
          The line is the exclusive resource and its occupancy is HALF-OPEN: a campaign starting at
          exactly the instant the incumbent ends is accepted (touching, not overlapping), while a
          campaign starting one millisecond before that instant is rejected with
          ERR_CAMPAIGN_WINDOW_CONFLICT - the same pair of windows differing by 1 ms flips the
          verdict, and the rejected campaign leaves no row behind.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00.000Z, one campus, one HYDROMET NICKEL_RICH line HYD-1 with throughput_kg_per_hour 100.0 and the default changeover_buffer_hours 6."
            - "No campaigns exist on the line yet."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 100.0 }
              as: PlatformAdmin
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-08-02T00:00:00.000Z", planned_input_kg: 1000.0 }
              as: PlantOperator
              captures: { camp_a: "$.data.id" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-03T00:00:00.000Z", planned_input_kg: 1000.0 }
              as: PlantOperator
              captures: { camp_b: "$.data.id" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-02T23:59:59.999Z", window_end: "2026-08-04T00:00:00.000Z", planned_input_kg: 1000.0 }
              as: PlantOperator
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-03T00:00:00.000Z", window_end: "2026-08-04T00:00:00.000Z", planned_input_kg: 1000.0 }
              as: PlantOperator
              captures: { camp_d: "$.data.id" }
            - call: "GET /recycling/campaigns"
              payload: { line_id: "${line_id}" }
              as: PlantOperator
              captures: { camp_total: "$.data[0].id" }
          assert:
            - "Campaign A returns HTTP 200 and ${camp_a} has status SCHEDULED"
            - "Campaign B returns HTTP 200 even though its window_start equals A's window_end (half-open adjacency, same family so no changeover gap is required)"
            - "The third call returns HTTP 409 with error.error_id == ERR_CAMPAIGN_WINDOW_CONFLICT because 2026-08-02T23:59:59.999Z < B.window_end"
            - "Campaign D returns HTTP 200: window_start exactly equal to B.window_end is accepted"
            - "GET /recycling/campaigns?line_id=${line_id} reports total_count == 3 - the rejected candidate created no row"
            - "ProcessingCampaign.${camp_d}.window_start == 2026-08-03T00:00:00.000Z and ${camp_total} is a non-null campaign id on this line"

      - name: line_changeover_buffer_requires_positive_gap_between_families
        grounds:
          - calculations.campaign_line_occupation
          - errors[ERR_CHANGEOVER_BUFFER_VIOLATION]
          - entities.ProcessingLine.fields.changeover_buffer_hours
          - endpoints[POST /recycling/processing-lines/{line_id}/replumb]
        distinguishing_aspect: |
          Non-overlapping windows are still refused when the neighbours belong to DIFFERENT
          chemistry families: with the line re-plumbed to IRON_PHOSPHATE, an IRON_PHOSPHATE
          campaign 5 hours after the NICKEL_RICH incumbent ends fails with
          ERR_CHANGEOVER_BUFFER_VIOLATION while the same campaign moved to exactly the 6-hour
          buffer is accepted - so the exclusion zone extends past the window itself and the
          comparison is a non-strict >= on the gap, the mirror image of the same-family gap of 0
          that the adjacency instance accepts.
        test_recipe:
