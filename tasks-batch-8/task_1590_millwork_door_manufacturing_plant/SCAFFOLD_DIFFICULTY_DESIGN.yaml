            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-9002", species: "MAPLE", profile_code: "PR-2", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
