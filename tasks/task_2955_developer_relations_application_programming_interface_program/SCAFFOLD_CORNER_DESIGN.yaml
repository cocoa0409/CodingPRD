              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /api-products/${p1_id}/versions"
              payload: { semver: "1.0.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { v1_id: $.data.id }
              # the version row is created with version 1
            - call: "GET /api-products/${p1_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_ver_before: $.data.version }
          trigger:
            - call: "POST /api-versions/${v1_id}/promote"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
          assert:
            - "HTTP 200 with data.lifecycle_state == GENERAL_AVAILABILITY"
            - "data.deprecation_announced_at == null, sunset_at == null, required_notice_days == null"
            - "data.version == 2 (the write bumped the version row's own OCC counter)"
            - "GET /api-products/${p1_id} still reports version == ${p1_ver_before}"
            - "GET /api-products/${p1_id}/versions?lifecycle_state=GENERAL_AVAILABILITY returns total_count == 1"

      - name: checkpoint_expires_lease_once_expiry_is_behind_the_clock
        claim_type: Valid Transition
        grounds:
          - state_machines.SandboxLease ACTIVE -> EXPIRED
          - endpoints.POST /program-checkpoints
          - entities.SandboxLease.fields.closed_reason
        distinguishing_aspect: >-
          This transition has no endpoint of its own: it fires only as checkpoint step 1, and
          it must stamp closed_reason CHECKPOINT_EXPIRY (not the RELEASED path's null) while
          reporting the lease id in expired_lease_ids. A checkpoint run before the expiry
          instant must leave the lease ACTIVE and return an empty array.
