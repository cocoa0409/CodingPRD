            - *k_agr_act
            - *k_open
            - call: "POST /shifts"
              payload: { stand_id: "${stand_id}", starts_at: "2026-09-02T07:00:00Z", ends_at: "2026-09-02T09:00:00Z", is_peak: false }
              as: StandOperator
