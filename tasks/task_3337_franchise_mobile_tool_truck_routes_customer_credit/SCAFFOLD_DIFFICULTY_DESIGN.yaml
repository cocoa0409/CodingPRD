            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: POWER_TOOLS, lines: [{ product_id: "${p1_id}", quantity: 3, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o1_id: "$.data.id" } }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: CONFIRM }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/sales-orders/${o1_id}/status", payload: { action: DELIVER }, as: RouteSalesRep, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-14T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /retail/credit-accounts/${a1_id}", payload: {}, as: CreditOfficer, captures: { a1_accrued_pre: "$.data.accrued_finance_charge_cents", a1_principal_pre: "$.data.principal_balance_cents", a1_avail_pre: "$.data.credit_available_cents" } }
            - { call: "POST /retail/credit-accounts/${a1_id}/payments", payload: { amount_cents: 20000, collection_source: TRUCK_COLLECTION, expected_week_start: "2026-09-14T00:00:00Z" }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { pm1_id: "$.data.id" } }
          trigger:
            - { call: "POST /retail/credit-accounts/${a1_id}/payments/${pm1_id}/status", payload: { action: COLLECT }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { pm_applied: "$.data.charge_applied_cents" } }
            - { call: "GET /retail/credit-accounts/${a1_id}", payload: {}, as: CreditOfficer, captures: { a1_principal_post: "$.data.principal_balance_cents", a1_avail_post: "$.data.credit_available_cents", a1_accrued_post: "$.data.accrued_finance_charge_cents" } }
            - { call: "POST /retail/credit-accounts/${a1_id}/payments/${pm1_id}/status", payload: { action: REVERSE }, as: CreditOfficer }
            - { call: "GET /retail/credit-accounts/${a1_id}", payload: {}, as: CreditOfficer, captures: { a1_principal_restored: "$.data.principal_balance_cents", a1_avail_restored: "$.data.credit_available_cents", a1_accrued_restored: "$.data.accrued_finance_charge_cents", a1_balance_restored: "$.data.current_balance_cents" } }
