      - name: usage_throttle_at_exactly_eighty_percent_of_cap
        grounds:
          - calculations.data_usage_posture
          - endpoints.POST_/agdata/machines/{id}/telemetry-ingest
          - entities.DataPlan.fields.usage_posture
        distinguishing_aspect: "Metric: accumulated megabytes against the tier cap. STANDARD cap 20480 MB; the >= semantics make exactly 16384 MB (80.00%) THROTTLED while 16383 MB stays NORMAL, and exactly 20480 MB is EXHAUSTED and blocks the next ingest with ERR_MACHINE_POSTURE_BLOCKED."
        test_recipe:
          setup:
            - "Two machines M1 and M2 in one organization, each with a PROVISIONED modem and an ACTIVE STANDARD plan (cap 20480 MB). Machines are not dealer-activated (telemetry ingest does not require it)."
