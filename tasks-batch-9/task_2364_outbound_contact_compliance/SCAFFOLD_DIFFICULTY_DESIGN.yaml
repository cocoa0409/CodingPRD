- rule_id: non_linear_state_machine
  instances:
  - name: agent_script_revision_loop_counts_two_cycles
    grounds:
    - state_machines.AgentScript.DRAFT_to_IN_REVIEW
    - state_machines.AgentScript.IN_REVIEW_to_DRAFT
    - state_machines.AgentScript.IN_REVIEW_to_APPROVED
    - entities.AgentScript.fields.review_cycle_count
    distinguishing_aspect: 'Cyclic shape on AgentScript: DRAFT -> IN_REVIEW -> DRAFT traversed twice before approval, with review_cycle_count == 2 proving the loop count is recorded rather than the row being reset.'
    test_recipe:
      setup:
      - logical clock at 2026-08-03T00:00:00Z
      - one DRAFT VOICE script covering CA that has been through two request-changes rounds and is back IN_REVIEW
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/agent-scripts
        payload:
          name: CA VOICE Script
          channel: VOICE
          disclosure_blocks:
          - IDENTIFICATION
          - PURPOSE
          - OPT_OUT
          recording_consent_mode: ONE_PARTY
          covered_state_codes:
          - CA
        as: CampaignManager
        captures:
          scr_id: $.data.id
      - call: POST /compliance/agent-scripts/${scr_id}/submit-review
        payload: {}
        as: CampaignManager
      - call: POST /compliance/agent-scripts/${scr_id}/request-changes
        payload:
          change_note: Add the opt-out sentence verbatim
        as: ComplianceOfficer
        as_user_id: officer-script-approver
      - call: POST /compliance/agent-scripts/${scr_id}/submit-review
        payload: {}
        as: CampaignManager
      - call: POST /compliance/agent-scripts/${scr_id}/request-changes
        payload:
          change_note: Name the seller in the identification block
        as: ComplianceOfficer
        as_user_id: officer-script-approver
      - call: POST /compliance/agent-scripts/${scr_id}/submit-review
        payload: {}
        as: CampaignManager
      trigger:
      - call: POST /compliance/agent-scripts/${scr_id}/approve
        payload:
          approval_note: Third pass acceptable
        as: ComplianceOfficer
        as_user_id: officer-script-approver
      assert:
      - AgentScript.${scr_id}.status == APPROVED
      - AgentScript.${scr_id}.review_cycle_count == 2
      - AgentScript.${scr_id}.change_note == null (the last submit-review cleared it)
      - AgentScript.${scr_id}.approved_by_user_id == "officer-script-approver"
      - AgentScript.${scr_id}.approved_at == "2026-08-03T00:00:00.000Z"
      - AgentScript.${scr_id}.version == 7 (create + 3 submit-review + 2 request-changes + approve)
