      - name: the_compensation_consultant_cannot_approve_a_peer_group
        claim_type: role_denial
        grounds:
          - roles.CompConsultant
          - roles.CompCommitteeChair
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
          - endpoints[POST /exec-comp/peer-groups/{id}/approve]
        distinguishing_aspect: |
          Approval is the chair's exclusive operation even though the consultant owns every other peer-group call:
          the consultant who built and screened the group is refused with ERR_ROLE_NOT_PERMITTED (403) and the group
          stays SCREENED, while the identical call from the chair succeeds — so authority, not workflow position,
          decides.
        test_recipe:
          setup:
            - "ACME issuer, BRVO peer and a SCREENED one-peer RAW_MEDIAN group, all created by the consultant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Bravo Corp", ticker: "BRVO", is_issuer: false, gics_sector: "TECH", revenue_usd: 8000000000, market_cap_usd: 16000000000, share_price_usd: 40.00, ceo_tdc_usd: 12000000 }
              as: CompConsultant
              captures: { bravo_id: $.data.id }
            - call: "POST /exec-comp/peer-groups"
              payload: { issuer_company_id: "${acme_id}", fiscal_year: 2026, benchmark_basis: "RAW_MEDIAN" }
              as: CompConsultant
              captures: { pg_id: $.data.id, pg_v0: $.data.version }
            - call: "POST /exec-comp/peer-groups/${pg_id}/members"
              payload: { peer_company_id: "${bravo_id}", inclusion_reason: "SIZE_MATCH", expected_peer_group_version: "${pg_v0}" }
              as: CompConsultant
            - call: "POST /exec-comp/peer-groups/${pg_id}/screen"
              payload: {}
              as: CompConsultant
          trigger:
            - call: "POST /exec-comp/peer-groups/${pg_id}/approve"
              payload: {}
              as: CompConsultant
              captures: { err_role: $.data.error_id }
            - call: "POST /exec-comp/peer-groups/${pg_id}/approve"
              payload: {}
              as: CompCommitteeChair
              as_user_id: "chair-001"
          assert:
            - "${err_role} == 'ERR_ROLE_NOT_PERMITTED' with HTTP status 403"
            - "after the refused call PeerGroup.${pg_id}.status == SCREENED and approved_by_user_id is null"
            - "PeerGroup.${pg_id}.version == 3 — the refused call did not bump it"
            - "the chair's call returns 200 with PeerGroup.${pg_id}.status == APPROVED"
            - "PeerGroup.${pg_id}.approved_by_user_id == 'chair-001' and version == 4"

      - name: a_named_executive_officer_cannot_read_another_officers_award
        claim_type: role_ops
        grounds:
          - roles.NamedExecutiveOfficer
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations.priority_5_ERR_NOT_RESOURCE_OWNER
          - endpoints[GET /exec-comp/payout-awards/{id}]
        distinguishing_aspect: |
          The officer role is row-scoped rather than endpoint-scoped: the CFO passes the priority-2 role check on
          GET /payout-awards/{id} and is then refused at priority 5 with ERR_NOT_RESOURCE_OWNER (403) for the CEO's
          award, yet the same role on the same endpoint returns 200 for the CFO's own award.
        test_recipe:
