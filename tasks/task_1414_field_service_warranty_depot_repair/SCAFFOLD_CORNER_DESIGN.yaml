            - { call: "POST /depot/rmas/${rma}/qa-release", as: DepotTechnician, as_user_id: "tech-2", payload: { outcome: "PASS" } }
          assert:
            - "First qa-release rejected with error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Second qa-release succeeds: ServiceRMA.${rma}.status == READY_TO_SHIP"

      - name: scrap_segregated_from_goodwill_grantor
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.ServiceRMA.QUOTE_DECLINED_to_SCRAPPED]
        distinguishing_aspect: "SoD across roles: the WarrantyAdministrator who granted goodwill (wa-1) cannot scrap the same RMA; another manager can. Goodwill regeneration recomputes the quote with discount_pct 25 -> total 7492."
        test_recipe:
          setup: ["OOW RMA in AWAITING_QUOTE_APPROVAL; goodwill partial 25% applied by wa-1 (quote Q2 total 7492); customer declines Q2 -> QUOTE_DECLINED"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2024-01-01", ship_date: "2024-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 20, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] } }
            - { call: "POST /depot/rmas/${rma}/warranty-override", as: WarrantyAdministrator, as_user_id: "wa-1", payload: { override_coverage: "GOODWILL_PARTIAL", goodwill_pct: 25, reason: "loyalty" } }
            - { call: "GET /depot/rmas/${rma}/quotes", as: DepotTechnician, captures: { q2: "$.data[1].id", q2_total: "$.data[1].total_cents" } }
            - { call: "POST /depot/quotes/${q2}/decline", as: Customer, as_user_id: "${cust}", payload: {} }
          trigger:
            - { call: "POST /depot/rmas/${rma}/scrap", as: DepotManager, as_user_id: "wa-1", payload: {} , captures: { err: $.data.error_id } }
            - { call: "POST /depot/rmas/${rma}/scrap", as: DepotManager, as_user_id: "mgr-1", payload: {} }
          assert:
            - "Quote.${q2}.total_cents == 7492 (subtotal 9250; discount round(9250*0.25)=2313; taxable 6937; tax round(6937*0.08)=555)"
            - "Quote.${q2}.discount_pct == 25 and quote_seq == 2 (Q1 superseded by override)"
            - "ServiceRMA.${rma}.coverage_path == GOODWILL_PARTIAL"
            - "First scrap rejected with error_id == ERR_SEGREGATION_OF_DUTIES (actor == warranty_override_by)"
            - "Second scrap succeeds: ServiceRMA.${rma}.status == SCRAPPED and Unit.${unit}.disposition == SCRAPPED"
            - "ServiceRMA.${rma}.settlement_total_cents == 0 (no approved quote, no loaner fees)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: monitoring_recurrence_reopens_escalation
        claim_type: valid_transition
        grounds: [state_machines.EngineeringEscalation.MONITORING_to_OPEN, entities.EngineeringEscalation.fields.recurrence_count]
        distinguishing_aspect: "Cyclic reopen: a MONITORING escalation for (model, failure code) flips back to OPEN with recurrence_count 1 when another RMA of the same model and code closes inside the monitoring window."
        test_recipe:
          setup: ["Manual escalation on RMA-X resolved at 2026-08-01 (MONITORING until 2026-10-30); RMA-X cancelled; new RMA-Z same unit+code driven to CLOSED"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5, recurring_failure_threshold: 3 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
