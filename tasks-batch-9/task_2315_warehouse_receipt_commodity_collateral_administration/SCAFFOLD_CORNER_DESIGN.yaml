              as_user_id: "reg-001"
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_STATE"
            - "Warehouse.${wh_id}.license_state == APPLIED"
            - "Warehouse.${wh_id}.version == 1"

      - name: license_decision_on_denied_warehouse_rejected
