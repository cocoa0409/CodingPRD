              as: SupplyChainAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /supply/products/${sp_id}/registration-events"
              payload: { event: "SUBMIT" }
              as: RegulatorySpecialist
            - call: "POST /supply/products/${sp_id}/registration-events"
              payload: { event: "APPROVE" }
              as: RegulatorySpecialist
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-C1", product_id: "${sp_id}", quantity: 100, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
              captures: { l1_id: $.data.id }
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-C2", product_id: "${sp_id}", quantity: 100, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
              captures: { l2_id: $.data.id }
            - call: "POST /supply/manufacturing-lots"
              payload: { lot_code: "LOT-C3", product_id: "${sp_id}", quantity: 100, manufacture_date: "2026-08-01", expiry_date: "2027-08-01" }
              as: ManufacturingPlanner
              captures: { l3_id: $.data.id }
            - call: "POST /supply/sterilization-batches"
              payload: { batch_code: "B-CH-1", chamber_id: "CH-1", scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T12:00:00Z", lot_ids: ["${l1_id}"] }
              as: ManufacturingPlanner
          trigger:
            - call: "POST /supply/sterilization-batches"
              payload: { batch_code: "B-CH-2", chamber_id: "CH-1", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T14:00:00Z", lot_ids: ["${l2_id}"] }
              as: ManufacturingPlanner
              captures: { err: $.data.error_id }
            - call: "POST /supply/sterilization-batches"
              payload: { batch_code: "B-CH-3", chamber_id: "CH-1", scheduled_start: "2026-09-10T12:00:00Z", scheduled_end: "2026-09-10T14:00:00Z", lot_ids: ["${l2_id}"] }
              as: ManufacturingPlanner
              captures: { b3_id: $.data.id }
          assert:
            - "Overlapping window (10:00-14:00 vs 08:00-12:00): HTTP 409 ERR_CHAMBER_WINDOW_OVERLAP"
            - "Adjacent window (12:00-14:00 starts exactly at existing end): HTTP 201 — half-open semantics allow touching windows"
            - "L2 sterilization_batch_id == ${b3_id} after the successful adjacent booking"
      - name: rebate_periods_closed_interval_adjacency
        grounds:
          - validations[priority=8.4]
          - errors[ERR_REBATE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Interval semantics CLOSED-INCLUSIVE on resource (facility, gpo_name)
          rebate coverage: [2026-01-01, 2026-03-31] vs [2026-03-31, 2026-06-30]
          collides because the shared boundary date belongs to both — the
          exact opposite adjacency rule from the chamber half-open windows,
          on a different resource entity.
        test_recipe:
          setup:
            - "Facility F; claim CL1 for GPO-A covering closed period 2026-01-01..2026-03-31"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac RB", health_system_name: "HS RB", facility_type: "ACUTE_CARE", ship_to_address: "15 Chestnut Blvd" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/rebate-claims"
              payload: { facility_id: "${fac_id}", gpo_name: "GPO-A", period_start: "2026-01-01", period_end: "2026-03-31", eligible_purchase_cents: 250000, private_label_share: 0.10, compliant: true }
              as: GPOAnalyst
              captures: { cl1_id: $.data.id }
          trigger:
            - call: "POST /supply/rebate-claims"
              payload: { facility_id: "${fac_id}", gpo_name: "GPO-A", period_start: "2026-03-31", period_end: "2026-06-30", eligible_purchase_cents: 300000, private_label_share: 0.10, compliant: true }
              as: GPOAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /supply/rebate-claims"
              payload: { facility_id: "${fac_id}", gpo_name: "GPO-A", period_start: "2026-04-01", period_end: "2026-06-30", eligible_purchase_cents: 300000, private_label_share: 0.10, compliant: true }
              as: GPOAnalyst
              captures: { cl3_id: $.data.id }
            - call: "POST /supply/rebate-claims"
              payload: { facility_id: "${fac_id}", gpo_name: "GPO-B", period_start: "2026-01-01", period_end: "2026-03-31", eligible_purchase_cents: 300000, private_label_share: 0.10, compliant: true }
              as: GPOAnalyst
              captures: { cl4_id: $.data.id }
          assert:
            - "Claim sharing the boundary date 2026-03-31: HTTP 409 ERR_REBATE_PERIOD_OVERLAP (closed intervals touch)"
            - "Claim starting 2026-04-01: HTTP 201 (first non-overlapping day after a closed interval)"
            - "Same dates under a different gpo_name: HTTP 201 (overlap scope is facility + GPO)"

  - rule_id: compensating_invariant
    instances:
      - name: stock_issue_receipt_pair_conserves_on_hand
        grounds:
          - endpoints."POST /supply/inventory-programs/{id}/stock-events"
          - entities.InventoryProgram.fields.positions
        distinguishing_aspect: |
          Conserved quantity is PHYSICAL STOCK UNITS: a forward ISSUE of 30
          paired with its compensating RECEIPT of 30 (and an ADJUST -5 / +5
          pair) leaves on_hand exactly at its initial 50, satisfying
          on_hand == initial_on_hand + sum(quantity_delta) with zero drift.
        test_recipe:
          setup:
            - "Facility F; product PX; InventoryProgram with position {PX, par 100, reorder_point 10, on_hand 50}"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac K", health_system_name: "HS K", facility_type: "CLINIC", ship_to_address: "16 Magnolia St" }
              as: SupplyChainAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "KX-1", name: "Stock item K", brand_type: "BRANDED", category: "WOUND_CARE", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 10 }
              as: SupplyChainAdmin
              captures: { px_id: $.data.id }
            - call: "POST /supply/inventory-programs"
              payload: { facility_id: "${fac_id}", program_type: "OR_CORE", positions: [ { product_id: "${px_id}", par_level: 100, reorder_point: 10, on_hand: 50 } ] }
              as: SupplyChainAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /supply/inventory-programs/${prog_id}/stock-events"
              payload: { product_id: "${px_id}", quantity_delta: -30, event_type: "ISSUE" }
              as: SupplyChainAdmin
              captures: { pos_after_issue: "$.data.positions[0].on_hand" }
            - call: "POST /supply/inventory-programs/${prog_id}/stock-events"
              payload: { product_id: "${px_id}", quantity_delta: 30, event_type: "RECEIPT" }
              as: SupplyChainAdmin
              captures: { pos_after_pair: "$.data.positions[0].on_hand" }
            - call: "POST /supply/inventory-programs/${prog_id}/stock-events"
              payload: { product_id: "${px_id}", quantity_delta: -5, event_type: "CYCLE_COUNT_ADJUST" }
              as: SupplyChainAdmin
            - call: "POST /supply/inventory-programs/${prog_id}/stock-events"
              payload: { product_id: "${px_id}", quantity_delta: 5, event_type: "CYCLE_COUNT_ADJUST" }
              as: SupplyChainAdmin
              captures: { pos_final: "$.data.positions[0].on_hand" }
          assert:
            - "After ISSUE -30: on_hand == 20"
            - "After compensating RECEIPT +30: on_hand == 50 (forward + compensating pair restores the conserved quantity exactly)"
            - "After ADJUST -5 / +5 pair: on_hand == 50"
            - "Invariant holds: 50 == 50 + (-30 + 30) + (-5 + 5); no drift across the event sequence"
      - name: disruption_partition_invariant_across_decisions
        grounds:
          - entities.SupplyDisruption.fields.remaining_pool
          - state_machines.SupplyDisruption.MITIGATING_to_RESOLVED
          - concurrency_rules[disruption-allocation-stale-version]
        distinguishing_aspect: |
          Conserved quantity is the SCARCITY PARTITION (different from
          physical stock): allocated_total + approved_sub_total +
          remaining_pool == disrupted_quantity after every allocation post and
          every APPROVE/REJECT decision, including the terminal auto-resolve.
        test_recipe:
          setup:
            - "Facility F1; disrupted product DP (EXAM_GLOVES, ACTIVE); substitute SP (EXAM_GLOVES, REGISTERED, ACTIVE)"
            - "Disruption D disrupted_quantity 100"
          setup_api_calls:
            - call: "POST /supply/facilities"
              payload: { name: "Fac Q", health_system_name: "HS Q", facility_type: "ACUTE_CARE", ship_to_address: "17 Juniper Way" }
              as: SupplyChainAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "QD-1", name: "Glove A", brand_type: "BRANDED", category: "EXAM_GLOVES", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 20 }
              as: SupplyChainAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "QS-1", name: "Glove B", brand_type: "PRIVATE_LABEL", category: "EXAM_GLOVES", sterile: false, device_class: "CLASS_I", units_per_case: 1, each_price_cents: 22 }
              as: SupplyChainAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /supply/products/${sp_id}/registration-events"
              payload: { event: "SUBMIT" }
              as: RegulatorySpecialist
            - call: "POST /supply/products/${sp_id}/registration-events"
              payload: { event: "APPROVE" }
              as: RegulatorySpecialist
            - call: "POST /supply/supply-disruptions"
              payload: { product_id: "${dp_id}", disrupted_quantity: 100, reason: "RECALL", severity: "CRITICAL", expected_resolution_date: "2026-11-01" }
              as: SupplyChainAdmin
              captures: { dis_id: $.data.id, dis_v1: $.data.version }
          trigger:
            - call: "POST /supply/supply-disruptions/${dis_id}/allocations"
              payload: { facility_id: "${f1_id}", quantity: 40, expected_disruption_version: "${dis_v1}" }
              as: SupplyChainAdmin
              captures: { allocated_1: $.data.allocated_total, pool_1: $.data.remaining_pool }
            - call: "POST /supply/supply-disruptions/${dis_id}/substitution-requests"
              payload: { action: "REQUEST", facility_id: "${f1_id}", proposed_product_id: "${sp_id}", covered_quantity: 60 }
              as: FacilitySupplyDirector
              as_user_id: "${f1_id}"
              captures: { req1_id: "$.data.substitution_requests[0].request_id" }
            - call: "POST /supply/supply-disruptions/${dis_id}/substitution-requests"
              payload: { action: "DECIDE", request_id: "${req1_id}", decision: "REJECT", rationale: "not latex-free equivalent" }
              as: Clinician
              as_user_id: "clin-2"
              captures: { dis_v4: $.data.version, approved_1: $.data.approved_sub_total, pool_2: $.data.remaining_pool }
            - call: "POST /supply/supply-disruptions/${dis_id}/allocations"
              payload: { facility_id: "${f1_id}", quantity: 25, expected_disruption_version: "${dis_v4}" }
              as: SupplyChainAdmin
              captures: { allocated_2: $.data.allocated_total, pool_3: $.data.remaining_pool }
            - call: "POST /supply/supply-disruptions/${dis_id}/substitution-requests"
              payload: { action: "REQUEST", facility_id: "${f1_id}", proposed_product_id: "${sp_id}", covered_quantity: 35 }
              as: FacilitySupplyDirector
              as_user_id: "${f1_id}"
              captures: { req2_id: "$.data.substitution_requests[1].request_id" }
            - call: "POST /supply/supply-disruptions/${dis_id}/substitution-requests"
              payload: { action: "DECIDE", request_id: "${req2_id}", decision: "APPROVE", rationale: "acceptable after spec review" }
              as: Clinician
              as_user_id: "clin-2"
              captures: { fin_status: $.data.status, fin_alloc: $.data.allocated_total, fin_sub: $.data.approved_sub_total, fin_pool: $.data.remaining_pool }
          assert:
            - "After allocation of 40: allocated_total == 40, remaining_pool == 60, approved_sub_total == 0 (40 + 0 + 60 == 100)"
            - "REJECT of the 60-unit request conserves the partition: approved_sub_total stays 0, remaining_pool stays 60 (60 + 0 + 60 would be drift; rejected requests consume nothing)"
            - "After allocation of 25: allocated_total == 65, remaining_pool == 35 (65 + 0 + 35 == 100)"
            - "After APPROVE of 35: approved_sub_total == 35, remaining_pool == 0, covered_quantity == 100 -> status == RESOLVED (65 + 35 + 0 == 100)"
            - "The invariant allocated_total + approved_sub_total + remaining_pool == 100 held at every step"
