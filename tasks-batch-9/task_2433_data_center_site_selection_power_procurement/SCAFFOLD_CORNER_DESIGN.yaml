    instances:
      - name: derived_fields_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.utility_capacity_ledger
          - calculations.site_capital_commitment
        distinguishing_aspect: "Consistency is immediate across aggregates: the reserve-capacity response itself already carries reserved_mw 300 and network_upgrade_cost_usd 26945136.00, and reads of the utility and of the site issued straight afterwards show the re-derived ledger and capital totals with no intervening write or delay."
        test_recipe:
          setup:
            - "Site Alpha screened at Piedmont Power with a 300 MW application in STUDY_COMPLETE after a 240 / 66 / 12 MW study at diversity_factor 0.92."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /candidate-sites/${s1_id}/screen"
              payload: { transmission_headroom_mw: 240, fiber_route_count: 3, seismic_hazard_index: 0.20, flood_hazard_index: 0.45, wind_hazard_index: 0.30, craft_labor_supply_index: 1600, construction_peak_headcount: 2000, wage_premium_pct: 0.10, cooling_type: "EVAPORATIVE", annual_water_demand_mgal: 250 }
              as: SiteScreeningAnalyst
              as_user_id: "user_analyst_1"
            - call: "POST /interconnection-applications"
              payload: { site_id: "${s1_id}", utility_id: "${u_id}", requested_mw: 300, window_start: "2029-01-01T00:00:00Z", window_end: "2029-12-31T00:00:00Z" }
              as: SiteScreeningAnalyst
              captures: { a1_id: $.data.id }
            - call: "POST /interconnection-applications/${a1_id}/submit"
              payload: {}
              as: SiteScreeningAnalyst
            - call: "POST /interconnection-applications/${a1_id}/load-studies"
              payload: { it_load_mw: 240, cooling_load_mw: 66, ancillary_load_mw: 12, diversity_factor: 0.92 }
              as: UtilityPlanner
              as_user_id: "${u_id}"
          trigger:
            - call: "POST /interconnection-applications/${a1_id}/reserve-capacity"
              payload: {}
              as: UtilityPlanner
              as_user_id: "${u_id}"
            - call: "GET /utilities/${u_id}"
              payload: {}
              as: UtilityPlanner
              as_user_id: "${u_id}"
            - call: "GET /candidate-sites/${s1_id}"
              payload: {}
              as: SiteScreeningAnalyst
            - call: "GET /siting-programs/${p_id}"
              payload: {}
              as: PortfolioDirector
          assert:
            - "the reserve-capacity response body already shows status CAPACITY_RESERVED, reserved_mw == 300, diversified_peak_mw == 293.52 and network_upgrade_cost_usd == 26945136.00"
            - "the immediately following GET /utilities/${u_id} shows reserved_capacity_mw == 300.0 and available_capacity_mw == 200.0 with their sum equal to total_transmission_capacity_mw"
            - "the immediately following GET /candidate-sites/${s1_id} shows site_capital_commitment_usd == 27305136.00 and energization_risk_tier == ON_TRACK"
            - "the immediately following GET /siting-programs/${p_id} shows committed_load_mw == 0 and program_status == SCREENING (a reservation is not an energization commitment)"
            - "no re-read is required for any of the four values to be correct"
