              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/scorecards"
              payload: { period_start_date: "2026-08-12", period_end_date: "2026-08-13" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { sc_watch_id: "$.data.id" }
            - call: "POST /recruitment/applications/${a1_id}/decision"
              payload: { decision: "ADMIT" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { a1_v1: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/applications/${a1_id}/milestones"
