              payload: {}
              as: Coordinator
            - call: "POST /turnovers/${t1}/start"
              payload: {}
              as: Cleaner
              as_user_id: "${cc}"
          trigger:
            - call: "POST /issue-reports"
              payload: { turnover_id: "${t1}", issue_type: "MAINTENANCE", severity: "MEDIUM", description: "shower valve drips continuously", estimated_cost_cents: 4000 }
              as: Cleaner
              as_user_id: "${cc}"
              captures: { i1: "$.data.id", i1_status: "$.data.status", i1_prop: "$.data.property_id", i1_by: "$.data.reported_by_cleaner_id", i1_notified: "$.data.owner_notified_at", i1_charge: "$.data.guest_chargeable" }
            - call: "GET /properties/${p1}"
              payload: {}
              as: Coordinator
              captures: { open1: "$.data.open_issue_count" }
            - call: "POST /issue-reports/${i1}/dispatch"
              payload: { vendor_name: "Hill Country Plumbing", scheduled_at: "2026-08-08T18:00:00Z", blocks_checkin: true }
              as: Coordinator
              captures: { r1: "$.data.id", r1_status: "$.data.status", r1_blocks: "$.data.blocks_checkin", r1_issue: "$.data.issue_report_id", r1_prop: "$.data.property_id", r1_cost: "$.data.actual_cost_cents", r1_done: "$.data.completed_at" }
            - call: "GET /issue-reports/${i1}"
              payload: {}
              as: Coordinator
              captures: { i1_after: "$.data.status" }
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { block1: "$.data.blocking_repair_order_id", t1_status1: "$.data.status" }
            - call: "GET /bookings/${b_in}"
              payload: {}
              as: Coordinator
              captures: { gate1: "$.data.checkin_gate", notice1: "$.data.guest_notice_code", b_in_status: "$.data.status" }
            - call: "POST /issue-reports/${i1}/dispatch"
              payload: { vendor_name: "Second Vendor", scheduled_at: "2026-08-08T19:00:00Z" }
              as: Coordinator
              captures: { e1: "$.data.error_id" }
            - call: "GET /repair-orders"
              payload: { issue_report_id: "${i1}" }
              as: Coordinator
            - call: "GET /repair-orders/${r1}"
              payload: {}
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { r1_vendor: "$.data.vendor_name", r1_sched: "$.data.scheduled_at" }
            - call: "GET /issue-reports"
              payload: { property_id: "${p1}", status: "DISPATCHED" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { own_issue: "$.data[0].id", own_sev: "$.data[0].severity" }
            - call: "GET /issue-reports"
              payload: { property_id: "${p1}", status: "REPORTED" }
              as: Coordinator
          assert:
            - "${open0} == 0 (declared default) and ${gate0} == OPEN with ${notice0} == NONE and ${block0} is null"
            - "${i1_status} == REPORTED - 4000 < 5000 and MEDIUM < HIGH, so the owner-notification cascade does not fire"
            - "${i1_prop} == ${p1}, ${i1_by} == ${cc} (both computed, not supplied), ${i1_notified} is null, ${i1_charge} == false"
            - "${open1} == 1 - the property's derived counter moved on issue creation"
            - "${r1_status} == DISPATCHED, ${r1_blocks} == true, ${r1_issue} == ${i1}, ${r1_prop} == ${p1}"
            - "${r1_cost} is null and ${r1_done} is null on a fresh order"
            - "${i1_after} == DISPATCHED and ${block1} == ${r1} - the cross-aggregate stamp landed"
            - "${gate1} == BLOCKED, ${notice1} == CHECKIN_DELAYED, ${b_in_status} == SCHEDULED - the gate dimension moved without touching occupancy"
            - "${t1_status1} == IN_PROGRESS - a blocking repair does not by itself halt the clean"
            - "${e1} == ERR_INVALID_ISSUE_STATE (409) - DISPATCHED is not a dispatchable state"
            - "GET /repair-orders?issue_report_id=${i1} returns total_count == 1 - the refused second dispatch minted nothing"
            - "${r1_vendor} == Hill Country Plumbing and ${r1_sched} == 2026-08-08T18:00:00Z read back by the owner of ${p1}"
            - "${own_issue} == ${i1} and ${own_sev} == MEDIUM with total_count == 1 - the owner sees its own property's dispatched issue"
            - "GET /issue-reports?property_id=${p1}&status=REPORTED returns total_count == 0 - the status filter follows the row out of REPORTED"

      - name: corner_ep_clock_endpoint_returns_no_entity_and_drives_every_system_timestamp
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /_clock/set_current_utc"]
          - entities.Property.fields.created_at
        distinguishing_aspect: |
          The clock endpoint is the only §1.5 route with output None: it returns no entity envelope
          at all, and its single side effect is to move the logical now that every system timestamp
          reads. Rows created before and after a jump therefore carry created_at values equal to the
          two clock readings rather than to wall-clock time, and moving the clock does not touch any
          existing row's updated_at.
        test_recipe:
          setup:
            - "A fresh system with the logical clock set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com" }
              as: PlatformAdmin
              captures: { p1: "$.data.id", p1_created: "$.data.created_at", p1_updated: "$.data.updated_at", p1_v: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-102", name: "Rainey Studio", zone_code: "ZONE_A", size_tier: "STUDIO", owner_contact_email: "owner2@example.com" }
              as: PlatformAdmin
              captures: { p2_created: "$.data.created_at" }
            - call: "GET /properties/${p1}"
              payload: {}
              as: PlatformAdmin
              captures: { p1_created2: "$.data.created_at", p1_updated2: "$.data.updated_at", p1_v2: "$.data.version" }
          assert:
            - "POST /_clock/set_current_utc returns HTTP 200 with no data entity (output None) - nothing to read back"
            - "${p1_created} == 2026-08-01T00:00:00Z and ${p1_updated} == 2026-08-01T00:00:00Z and ${p1_v} == 1"
            - "${p2_created} == 2026-08-05T09:30:00Z - the second row reads the moved clock"
            - "${p1_created2} == 2026-08-01T00:00:00Z, ${p1_updated2} == 2026-08-01T00:00:00Z, ${p1_v2} == 1 - moving the clock is not a write to existing rows"

      - name: corner_ep_turnover_list_filters_compose_conjunctively_with_limit_and_offset
        claim_type: Standard CRUD
        grounds:
          - endpoints["GET /turnovers"]
          - complexity_profile.relationship_patterns
        distinguishing_aspect: |
          GET /turnovers exposes six filters plus limit/offset, and they must AND together rather
          than replace each other: property_id alone sees three rows, adding turn_type narrows to
          two, adding a status that contradicts the other filters yields an empty page with
          total_count 0 (not a 404), and total_count always describes the FILTERED population while
          limit/offset slice only the current page.
        test_recipe:
          setup:
            - "Property P1 with three turnovers: T1 SAME_DAY (out 08-08 16:00Z / in 08-08 21:00Z), T2 OVERNIGHT (out 08-12 16:00Z / in 08-13 21:00Z), T3 VACANT (out 08-16 16:00Z, no incoming)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b2: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-2", guest_name: "Guest Two", checkin_at: "2026-08-11T21:00:00Z", checkout_at: "2026-08-12T16:00:00Z" }
              as: Coordinator
              captures: { b3: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-2", guest_name: "Guest Three", checkin_at: "2026-08-13T21:00:00Z", checkout_at: "2026-08-16T16:00:00Z" }
              as: Coordinator
              captures: { b4: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b1}", incoming_booking_id: "${b2}" }
              as: Coordinator
              captures: { t1: "$.data.id", t1_type: "$.data.turn_type" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b3}", incoming_booking_id: "${b4}" }
              as: Coordinator
              captures: { t2: "$.data.id", t2_type: "$.data.turn_type" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b4}" }
              as: Coordinator
              captures: { t3: "$.data.id", t3_type: "$.data.turn_type" }
          trigger:
            - call: "GET /turnovers"
              payload: { property_id: "${p1}" }
              as: Coordinator
              captures: { all_first: "$.data[0].id" }
            - call: "GET /turnovers"
              payload: { property_id: "${p1}", status: "PENDING_ASSIGNMENT", limit: 2, offset: 0 }
              as: Coordinator
              captures: { pg1_a: "$.data[0].id", pg1_b: "$.data[1].id" }
            - call: "GET /turnovers"
              payload: { property_id: "${p1}", status: "PENDING_ASSIGNMENT", limit: 2, offset: 2 }
              as: Coordinator
              captures: { pg2_a: "$.data[0].id" }
            - call: "GET /turnovers"
              payload: { property_id: "${p1}", turn_type: "SAME_DAY" }
              as: Coordinator
              captures: { sd_first: "$.data[0].id" }
            - call: "GET /turnovers"
              payload: { property_id: "${p1}", turn_type: "SAME_DAY", status: "COMPLETED" }
              as: Coordinator
            - call: "GET /turnovers"
              payload: { outgoing_booking_id: "${b4}" }
              as: Coordinator
              captures: { by_out: "$.data[0].id" }
            - call: "GET /turnovers"
              payload: { incoming_booking_id: "${b4}" }
              as: Coordinator
              captures: { by_in: "$.data[0].id" }
          assert:
            - "${t1_type} == SAME_DAY, ${t2_type} == OVERNIGHT, ${t3_type} == VACANT"
            - "GET /turnovers?property_id=${p1} returns total_count == 3 and has_more == false"
            - "the first page (limit 2, offset 0) returns 2 rows with total_count == 3 and has_more == true; ${pg1_a} == ${t1} and ${pg1_b} == ${t2} (creation order)"
            - "the second page (limit 2, offset 2) returns 1 row with total_count == 3 and has_more == false; ${pg2_a} == ${t3} - total_count describes the population, not the page"
            - "${sd_first} == ${t1} with total_count == 1 - turn_type ANDs with property_id"
            - "turn_type=SAME_DAY combined with status=COMPLETED returns HTTP 200, an empty data array and total_count == 0 - a contradictory conjunction is empty, never a 404"
            - "${by_out} == ${t3} and ${by_in} == ${t2} - the same booking id resolves differently on the two FK filters"

      - name: corner_ep_turnover_creation_links_two_bookings_that_must_both_exist
        claim_type: Cross-reference link
        grounds:
          - endpoints["POST /turnovers"]
          - entities.Turnover.fields.outgoing_booking_id
          - entities.Turnover.fields.incoming_booking_id
          - errors.ERR_BOOKING_NOT_FOUND
        distinguishing_aspect: |
          POST /turnovers is the scaffold's only endpoint that links two rows of the SAME entity in
          different roles, so the link check runs twice and the failure is ambiguous unless both
          arms are probed independently: an unknown outgoing id and an unknown incoming id both give
          ERR_BOOKING_NOT_FOUND, naming one booking in both slots collapses the interval and is
          refused by the ordering rule rather than the window rule, and a successful link is readable
          from either side while leaving both bookings' own state alone.
        test_recipe:
          setup:
            - "Property P1 with bookings OUT-1 (checkout 08-08 16:00Z) and IN-1 (checkin 08-08 21:00Z); MISSING = 33333333-3333-3333-3333-333333333333."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id", b_out_v: "$.data.version" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id", b_in_v: "$.data.version" }
          trigger:
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "33333333-3333-3333-3333-333333333333", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { e1: "$.data.error_id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "33333333-3333-3333-3333-333333333333" }
              as: Coordinator
              captures: { e2: "$.data.error_id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_out}" }
              as: Coordinator
              captures: { e3: "$.data.error_id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", t1_out: "$.data.outgoing_booking_id", t1_in: "$.data.incoming_booking_id", t1_type: "$.data.turn_type" }
            - call: "GET /bookings/${b_out}"
              payload: {}
              as: Coordinator
              captures: { out_status: "$.data.status", out_v: "$.data.version" }
            - call: "GET /bookings/${b_in}"
              payload: {}
              as: Coordinator
              captures: { in_gate: "$.data.checkin_gate", in_v: "$.data.version" }
          assert:
            - "${e1} == ERR_BOOKING_NOT_FOUND (404) for the unknown outgoing arm"
            - "${e2} == ERR_BOOKING_NOT_FOUND (404) for the unknown incoming arm - the same code, raised by a different slot"
            - "${e3} == ERR_INVALID_TIME_INTERVAL (422) - a booking used as both sides has incoming.checkin_at 2026-08-05T21:00:00Z < outgoing.checkout_at 2026-08-08T16:00:00Z, so priority 19 fires before the window rule at priority 22"
            - "${t1_out} == ${b_out} and ${t1_in} == ${b_in} and ${t1_type} == SAME_DAY with HTTP 201"
            - "GET /turnovers?outgoing_booking_id=${b_out} and GET /turnovers?incoming_booking_id=${b_in} each return total_count == 1 with the same id ${t1} - the link is readable from both sides"
            - "${out_status} == SCHEDULED, ${in_gate} == OPEN, ${out_v} == ${b_out_v} == 1 and ${in_v} == ${b_in_v} == 1 - linking is not a write to either booking"

      - name: corner_ep_action_endpoint_preconditions_are_enforced_before_the_transition
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /turnovers/{id}/complete"]
          - endpoints["POST /checklist-tasks/{id}/review"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / turnover_rework_cycle_awaiting_to_rework_and_back
          rationale: "That instance drives review and complete as action endpoints across a full rework loop, asserting each precondition refusal and each resulting transition, which is this row's claim in full."

      - name: corner_ep_bulk_restock_entries_are_applied_per_line_in_the_order_supplied
        claim_type: Bulk action
        grounds:
          - endpoints["POST /checklist-tasks/{id}/submit"].input.restock_entries
        excluded_because:
          difficulty_instance: combinatorial_formula / restock_chargeback_per_line_rounding_before_summation
          rationale: "The only bulk payload in the scaffold is restock_entries[]; that instance submits a multi-line batch and asserts one StockMovement per entry in the supplied order plus the per-line-then-sum charge, covering the bulk semantics."

  # ===========================================================================
  - section: errors
    instances:
      - name: corner_err_each_of_the_ten_not_found_codes_is_triggerable_and_entity_specific
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PROPERTY_NOT_FOUND
          - errors.ERR_CLEANER_NOT_FOUND
          - errors.ERR_BOOKING_NOT_FOUND
          - errors.ERR_TURNOVER_NOT_FOUND
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - errors.ERR_CHECKLIST_TASK_NOT_FOUND
          - errors.ERR_SUPPLY_LINE_NOT_FOUND
          - errors.ERR_ISSUE_REPORT_NOT_FOUND
          - errors.ERR_REPAIR_ORDER_NOT_FOUND
          - errors.ERR_QUALITY_AUDIT_NOT_FOUND
          - errors.ERR_STOCK_MOVEMENT_NOT_FOUND
          - errors.ERR_PAY_LINE_NOT_FOUND
        distinguishing_aspect: |
          Twelve distinct 404 codes exist and a generic ERR_NOT_FOUND would satisfy none of them, so
          each is driven through a route whose FIRST path segment addresses that entity, using one
          shared unknown UUID. ERR_CHECKLIST_TASK_NOT_FOUND has no single-resource GET, so it is
          driven through POST /checklist-tasks/{id}/submit, which also shows that the existence
          check at priority 5 precedes the state and evidence checks on an action route.
        test_recipe:
          setup:
            - "An empty system with the clock at 2026-08-01T00:00:00Z."
            - "MISSING = 33333333-3333-3333-3333-333333333333 is a well-formed UUID that matches no row of any entity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /properties/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: PlatformAdmin
              captures: { e1: "$.data.error_id" }
            - call: "GET /cleaners/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: PlatformAdmin
              captures: { e2: "$.data.error_id" }
            - call: "GET /bookings/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: Coordinator
              captures: { e3: "$.data.error_id" }
            - call: "GET /turnovers/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: Coordinator
              captures: { e4: "$.data.error_id" }
            - call: "GET /assignments/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: Coordinator
              captures: { e5: "$.data.error_id" }
            - call: "POST /checklist-tasks/33333333-3333-3333-3333-333333333333/submit"
              payload: { note: "nothing here" }
              as: Cleaner
              as_user_id: "cleaner-x"
              captures: { e6: "$.data.error_id" }
            - call: "GET /supply-lines/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: Coordinator
              captures: { e7: "$.data.error_id" }
            - call: "GET /issue-reports/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: Coordinator
              captures: { e8: "$.data.error_id" }
            - call: "GET /repair-orders/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: Coordinator
              captures: { e9: "$.data.error_id" }
            - call: "GET /quality-audits/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { e10: "$.data.error_id" }
            - call: "GET /stock-movements/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: Coordinator
              captures: { e11: "$.data.error_id" }
            - call: "GET /pay-lines/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: Coordinator
              captures: { e12: "$.data.error_id" }
          assert:
            - "${e1} == ERR_PROPERTY_NOT_FOUND, ${e2} == ERR_CLEANER_NOT_FOUND, ${e3} == ERR_BOOKING_NOT_FOUND, ${e4} == ERR_TURNOVER_NOT_FOUND - all HTTP 404"
            - "${e5} == ERR_ASSIGNMENT_NOT_FOUND, ${e6} == ERR_CHECKLIST_TASK_NOT_FOUND, ${e7} == ERR_SUPPLY_LINE_NOT_FOUND - all HTTP 404"
            - "${e8} == ERR_ISSUE_REPORT_NOT_FOUND, ${e9} == ERR_REPAIR_ORDER_NOT_FOUND, ${e10} == ERR_QUALITY_AUDIT_NOT_FOUND - all HTTP 404"
            - "${e6} is NOT ERR_PHOTO_REQUIRED or ERR_INVALID_TASK_STATE - priority 5 runs before priorities 12 and 15"
            - "${e11} == ERR_STOCK_MOVEMENT_NOT_FOUND and ${e12} == ERR_PAY_LINE_NOT_FOUND (404) - the two append-only ledger reads carry their own codes"
            - "Every response body carries the envelope shape { error_id, message } with no partial entity payload"

      - name: corner_err_invalid_request_covers_missing_enum_range_and_datetime_variants
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_REQUEST
          - validations[priority=3]
        distinguishing_aspect: |
          One 400 code has to cover five structurally different shape failures, and each is driven
          separately so an implementation that only checks for missing keys still fails: a missing
          required field, an out-of-enum value, an integer under its declared floor, an integer over
          its declared ceiling, an unparseable datetime, and a restock entry missing its qty_used.
          None of them may leave a row behind.
        test_recipe:
          setup:
            - "Property P1 'AUS-101' exists at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com" }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "NO-GUEST", checkin_at: "2026-09-01T21:00:00Z", checkout_at: "2026-09-03T16:00:00Z" }
              as: Coordinator
              captures: { e1: "$.data.error_id" }
            - call: "POST /properties"
