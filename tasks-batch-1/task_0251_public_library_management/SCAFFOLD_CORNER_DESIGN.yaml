  - section: rbac
    instances:
      - name: unauthenticated_unknown_role_returns_401
        claim_type: Violation → Error
        grounds: ['validations[priority=1]', 'errors[ERR_UNAUTHENTICATED]']
        distinguishing_aspect: "A request with an unknown X-User-Role value is rejected 401 ERR_UNAUTHENTICATED before any business logic."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /library/branches"
              payload: {}
              as: Ghost
              captures: { err: $.data.error_id }
          assert:
            - "Response 401 ERR_UNAUTHENTICATED (X-User-Role 'Ghost' is not a known role)"

      - name: patron_cannot_create_branch_returns_forbidden
        claim_type: Cannot perform other role exclusive op
        grounds: [roles.Patron, roles.BranchManager, 'endpoints["POST /library/branches"]', 'errors[ERR_FORBIDDEN]']
        distinguishing_aspect: "A Patron calling POST /library/branches (a BranchManager-exclusive op) is rejected 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["A registered patron acting with role Patron."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "RbacBr" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Rbac Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /library/branches"
              payload: { name: "Sneaky Branch" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 403 ERR_FORBIDDEN (Patron cannot create branches)"

      - name: patron_cannot_cancel_another_patrons_hold_returns_forbidden
        claim_type: peer_roles ownership
        grounds: [roles.Patron, 'endpoints["POST /library/holds/{id}/cancel"]', 'validations[priority=2]', 'errors[ERR_FORBIDDEN]']
        distinguishing_aspect: "A Patron cancelling a hold owned by a different patron (X-User-ID != Hold.patron_id) is rejected 403 ERR_FORBIDDEN (entity_backed ownership)."
        test_recipe:
          setup: ["Patron B owns a WAITING hold; Patron A attempts to cancel it."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "OwnBr", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Own Pat A" }
              as: Librarian
              captures: { pa_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Own Pat B" }
              as: Librarian
              captures: { pb_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000030", title_text: "Own Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-OW", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${pa_id}" }
              as: Librarian
            - call: "POST /library/holds"
              payload: { title_id: "${t_id}", patron_id: "${pb_id}" }
              as: Patron
              as_user_id: "${pb_id}"
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /library/holds/${h_id}/cancel"
              payload: {}
              as: Patron
              as_user_id: "${pa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 403 ERR_FORBIDDEN (Patron A does not own hold ${h_id})"

      - name: librarian_cannot_waive_fine_returns_forbidden
        claim_type: Cannot perform other role exclusive op
        grounds: [roles.Librarian, roles.BranchManager, 'endpoints["POST /library/fines/{id}/waive"]', 'errors[ERR_FORBIDDEN]']
        distinguishing_aspect: "A Librarian calling POST /library/fines/{id}/waive (BranchManager-exclusive) is rejected 403 ERR_FORBIDDEN; pay is shared but waive is not."
        test_recipe:
          setup: ["A patron with an UNPAID lost fine."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "WaBr", loan_period_days: 7, block_threshold_cents: 100000 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Wa Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000031", title_text: "Wa Book", default_replacement_cents: 1500 }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-WA", acquired_on: "2026-06-01T00:00:00Z", condition_factor: 1.0 }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
            - call: "POST /library/loans/${ln_id}/declare-lost"
              payload: { flat_replacement: true }
              as: Librarian
            - call: "GET /library/fines?patron_id=${p_id}&settlement_status=UNPAID"
              payload: {}
              as: Librarian
              captures: { fine_id: "$.data[0].id" }
          trigger:
            - call: "POST /library/fines/${fine_id}/waive"
              payload: {}
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Response 403 ERR_FORBIDDEN (waive is BranchManager-exclusive)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_resource_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[reservation-create-stale-resource]', 'endpoints["POST /library/reservations"]', entities.BookableResource.fields.version]
        distinguishing_aspect: "A reservation create carrying the CURRENT BookableResource.version succeeds (201) and bumps the resource version by 1."
        test_recipe:
          setup: ["IN_SERVICE COMPUTER resource just created (version 1)."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "OccOkBr" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Occ Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/resources"
              payload: { branch_id: "${br_id}", resource_kind: "COMPUTER", label: "Occ PC", capacity: 3 }
              as: BranchManager
              captures: { rs_id: $.data.id, rs_v: $.data.version }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Librarian
          trigger:
            - call: "POST /library/reservations"
              payload: { resource_id: "${rs_id}", patron_id: "${p_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", expected_resource_version: "${rs_v}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { st: $.data.status }
            - call: "GET /library/resources/${rs_id}"
              payload: {}
              as: Librarian
              captures: { rs_v_after: $.data.version }
          assert:
            - "Reservation created 201 status REQUESTED; BookableResource.${rs_id}.version == 2 (bumped from 1)"

      - name: occ_stale_resource_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[reservation-create-stale-resource]', 'errors[ERR_STALE_RESOURCE_VERSION]', 'validations[priority=12]']
        excluded_because:
          difficulty_instance: computer_aggregate_capacity_overlap
          rationale: "The stale-version OCC reject path on POST /library/reservations is exercised by the capacity overlap §1.8 instance, which re-reads resource.version after each create precisely because a stale value would 412; the direct negative is its complement using expected_resource_version: ${rs_v} - 1."

      - name: declare_lost_cascade_chain_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.Loan.ACTIVE_to_LOST, entities.Patron.fields.borrowing_status]
        excluded_because:
          difficulty_instance: declare_lost_cascade_to_patron_block_depth4
          rationale: "The N-level cascade end-to-end (Loan->Copy->Fine->Patron.total_owed->borrowing_status) is the subject of the named §1.8 transitive_cascade instance."

      - name: ebook_expiry_releases_license_derived_field
        claim_type: derived_field_reconciliation
        grounds: [state_machines.EbookLoan.ACTIVE_to_EXPIRED, calculations.pool_license_availability, 'endpoints["POST /library/license-pools/{id}/run-expiry"]']
        distinguishing_aspect: "After the clock passes expires_at, run-expiry flips the e-book loan ACTIVE->EXPIRED and the derived pool.available_licenses reconciles back to total_licenses."
        test_recipe:
          setup: ["Pool total_licenses=2 with one ACTIVE e-book loan (term 14 days); clock advanced past expires_at."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "ExpBr" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Exp Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000032", title_text: "Exp Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/license-pools"
              payload: { title_id: "${t_id}", total_licenses: 2, loan_term_days: 14 }
              as: Librarian
              captures: { pool_id: $.data.id }
            - call: "POST /library/ebook-loans"
              payload: { pool_id: "${pool_id}", patron_id: "${p_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { el_id: $.data.id }
          trigger:
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: Librarian
            - call: "POST /library/license-pools/${pool_id}/run-expiry"
              payload: {}
              as: Librarian
              captures: { avail: $.data.available_licenses, loaned: $.data.loaned_licenses }
            - call: "GET /library/ebook-loans/${el_id}"
              payload: {}
              as: Librarian
              captures: { st: $.data.status }
          assert:
            - "EbookLoan.${el_id}.status == EXPIRED; LicensePool.${pool_id}.loaned_licenses == 0 and available_licenses == 2"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: checkout_side_effects_visible_in_same_response_immediate
        claim_type: immediate
        grounds: ['endpoints["POST /library/loans"]', state_machines.Copy, entities.Title.fields.available_copy_count]
        distinguishing_aspect: "Immediate consistency: right after a checkout, the next read shows Copy.status ON_LOAN and the title's available_copy_count decremented, with no delay."
        test_recipe:
          setup: ["Title with a single AVAILABLE copy."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "ImmBr", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Imm Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000033", title_text: "Imm Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-IM", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
            - call: "GET /library/copies/${c_id}"
              payload: {}
              as: Librarian
              captures: { cs: $.data.status }
            - call: "GET /library/titles/${t_id}"
              payload: {}
              as: Librarian
              captures: { acc: $.data.available_copy_count }
          assert:
            - "Immediately after checkout: Copy.${c_id}.status == ON_LOAN and Title.${t_id}.available_copy_count == 0"
