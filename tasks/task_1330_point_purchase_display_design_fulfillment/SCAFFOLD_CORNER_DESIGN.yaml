              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/approve"
              payload: { expected_design_version: "${design_v}" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/authorize-production"
              payload: {}
              as: ProgramManager
              captures: { program_v2: $.data.version }
            - call: "POST /pop/stores"
              payload: { program_id: "${program_id}", store_number: "S1", address: "1 Main St" }
              as: ProgramManager
            - call: "POST /pop/production-runs"
              payload: { program_id: "${program_id}", design_id: "${design_id}", overage_pct: 0, expected_program_version: "${program_v2}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /pop/production-runs/${run_id}/authorize"
              payload: {}
              as: ProductionPlanner
            - call: "POST /pop/production-runs/${run_id}/mark-produced"
              payload: {}
              as: ProductionPlanner
            - call: "GET /pop/production-runs/${run_id}/kits"
              payload: {}
              as: WarehouseOperator
              captures: { kit_id: "$.data[0].id" }
            - call: "POST /pop/kits/${kit_id}/mark-kitted"
              payload: {}
              as: WarehouseOperator
            - call: "POST /pop/shipments"
              payload: { kit_id: "${kit_id}", ship_window_start: "2026-08-10T00:00:00Z", ship_window_end: "2026-08-20T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { shipment_id: $.data.id }
            - call: "POST /pop/shipments/${shipment_id}/set-appointment"
              payload: { appointment_at: "2026-08-15T10:00:00Z" }
              as: LogisticsCoordinator
            - call: "POST /pop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pop/shipments/${shipment_id}/ship"
              payload: {}
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WINDOW_VIOLATION (clock before ship_window_start)"
            - "Shipment.${shipment_id}.status == APPOINTMENT_SET"
