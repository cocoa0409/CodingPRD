            - "after CALIBRATED->FINAL the same transition succeeds: CaseReport.${rep_id}.status == LEGAL_REVIEW"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: interviewer_half_open_adjacency
        grounds:
          - errors[ERR_INTERVIEWER_OVERLAP]
          - entities.WitnessInterview.fields.interviewer_id
          - entities.WitnessInterview.fields.scheduled_start
        distinguishing_aspect: |
          Resource interviewer_id with HALF-OPEN [start, end) semantics on
          WitnessInterview: a second interview starting exactly at the first one's
          end (15:00 == 15:00) is accepted, while one starting at 14:30 inside the
          window is rejected with ERR_INTERVIEWER_OVERLAP.
        test_recipe:
          setup:
            - "Case FIELDWORK; interviewer inv-9 already holds I1 [2026-05-10T14:00-15:00Z]"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
