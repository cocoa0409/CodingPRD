  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: temporal_acreage_deadline_inclusive_boundary
        grounds:
          - validations[priority=11]
          - entities.CommodityProgram.fields.acreage_reporting_deadline
          - entities.AcreageReport.fields.status
        distinguishing_aspect: |
          Interval semantics: the acreage-reporting window is CLOSED at the deadline —
          filing AT exactly the deadline (clock == 2026-07-15T00:00:00Z) succeeds, but
          one second past it (2026-07-15T00:00:01Z) is rejected ERR_ACREAGE_DEADLINE_PASSED.
          This is a point-in-time deadline window on CommodityProgram.
        test_recipe:
          setup:
            - "OPEN program acreage_reporting_deadline=2026-07-15T00:00:00Z; a PENDING unit"
            - "Clock advanced to one second past the deadline"
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "SA-15", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
