            - "Full cycle traversed: CONFIRMED -> MISSED -> CONFIRMED -> SERVICED"

      - name: ticket_appeal_branching_divergent_effects
        grounds:
          - state_machines.ContaminationTicket.OPEN_to_UPHELD
          - state_machines.ContaminationTicket.UPHELD_to_APPEALED
          - state_machines.ContaminationTicket.APPEALED_to_OVERTURNED
