              payload: { alarm_site_id: "${site_id}", amount_cents: 6050, tendered_on: "2026-09-05", method: "ACH", allocation_mode: "AUTO_WATERFALL", expected_alarm_site_version: "${site_v_now}" }
              as: BillingClerk
              as_user_id: "bc-02"
              captures: { pay_two_dim_id: $.data.id, pay_two_dim_alloc: $.data.allocated_cents }
          assert:
            - "the response status is 201 and response_type is object"
            - "after the nightly run PenaltyInvoice.${inv1_id}.collections_stage == NOTICE, late_penalty_cents == 550, assessed_cents == 6050, days_delinquent == 5"
            - "after the payment PenaltyInvoice.${inv1_id}.payment_status == PAID with paid_cents == 6050 and outstanding_cents == 0"
            - "PenaltyInvoice.${inv1_id}.collections_stage is STILL NOTICE immediately after payment — the money axis moved without the dunning axis"
            - "PaymentRecord.${pay_two_dim_id}.allocated_cents == 6050 and credited_cents == 0"
            - "a second POST /false-alarm-program/_program-runs/nightly resettles collections_stage to CURRENT and does NOT refund the 550 late penalty"

