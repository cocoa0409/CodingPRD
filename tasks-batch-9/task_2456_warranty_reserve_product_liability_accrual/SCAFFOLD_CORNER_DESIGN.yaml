          assert:
            - "After the approval: ProductFamily.${fam_ex_id}.warranty_reserve_balance_cents == 12000000 and reserve_posture == NORMAL (4000 bps)"
            - "After the first trigger call: FieldAction.${fa_ex_id}.execution_state == IN_PROGRESS, executed_cost_cents == 1000000, and ProductFamily.${fam_ex_id}.warranty_reserve_balance_cents is STILL 12000000"
            - "After the second trigger call: FieldAction.${fa_ex_id}.execution_state == COMPLETED and executed_cost_cents == 1500000"
            - "ProductFamily.${fam_ex_id}.warranty_reserve_balance_cents == 10500000 (12000000 approved campaign less 1500000 completed execution) and reserve_posture == NORMAL (3500 bps)"

      - name: corner_realization_exactly_seventy_five_hundred_bps_holds_base_rating
        claim_type: threshold
        grounds:
          - calculations.supplier_collectability_rating
          - calculations.supplier_recovery_recognized
          - entities.Supplier.fields.realization_bps
        distinguishing_aspect: "3000000 realized against 1000000 written off is realization_bps exactly 7500, which the inclusive REALIZATION_HOLD_BPS comparison keeps at the AAA base rating HIGH instead of downgrading to MEDIUM."
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3 so SETTLED closes can book."
            - "Supplier SUP-RZ: credit_rating AAA, annual_purchase_volume_cents 1000000000, contractual_recovery_cap_bps 2000 -> cap 200000000, base rating HIGH."
            - "Two ASSERTED recoveries on that supplier: R1 asserted 4000000, R2 asserted 1000000."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p_rz_id: $.data.id }
            - call: "POST /warranty/suppliers"
