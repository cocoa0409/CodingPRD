  # ---------------------------------------------------------------------------
  # From Table 5 (Endpoints)
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: c_lots_filtered_by_block
        claim_type: standard_crud
        grounds: ["endpoints.GET /lots", entities.Lot.fields.block_id]
        distinguishing_aspect: "Filtered list returns only lots of the given block (FK reverse-reachability with filter semantics)."
        test_recipe:
          setup: ["grower G with blocks B1, B2; lot L1 on B1; lot L2 on B2"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B2", variety: "FUJI", storage_life_days: 300 }, as: ReceivingClerk, captures: { b2: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b2}", received_bin_count: 3, received_weight_lbs: 2500, avg_color_pct: 70 }, as: ReceivingClerk, captures: { l2: $.data.id } }
          trigger:
            - { call: "GET /lots?block_id=${b1}", payload: {}, as: Admin, captures: { found: "$.data[0].id", total: "$.total_count" } }
          assert:
            - "total == 1"
            - "found == ${l1} (lot L2 on block B2 excluded)"

      - name: c_allocations_filtered_by_room_and_lot
        claim_type: standard_crud
        grounds: ["endpoints.GET /allocations", entities.StorageAllocation.fields.room_id, entities.StorageAllocation.fields.lot_id]
        distinguishing_aspect: "Allocations list filters independently by room_id and lot_id."
        test_recipe:
          setup: ["room R with allocations A1 (lot L1) and A2 (lot L2)"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 4, received_weight_lbs: 3000, avg_color_pct: 75 }, as: ReceivingClerk, captures: { l2: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l2}", bins: 4 }, as: StorageOperator, captures: { a2: $.data.id } }
          trigger:
            - { call: "GET /allocations?lot_id=${l2}", payload: {}, as: Admin, captures: { only: "$.data[0].id", total1: "$.total_count" } }
            - { call: "GET /allocations?room_id=${r1}", payload: {}, as: Admin, captures: { total2: "$.total_count" } }
          assert:
            - "total1 == 1 and only == ${a2}"
            - "total2 == 2"

      - name: c_clock_rejects_backwards
        claim_type: conditional_action
        grounds: ["endpoints.POST /_clock/set_current_utc", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "The logical clock moves forward only; setting it behind the current value is a 400."
        test_recipe:
          setup: ["clock at default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: Admin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Admin, captures: { err: $.data.error_id } }
          assert:
            - "first set succeeds (200)"
            - "err == ERR_INVALID_REQUEST (400) on the backwards set"

      - name: c_response_envelope_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id + response_type object/array + data; error responses carry response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["grower G exists"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
          trigger:
            - { call: "GET /growers/${g1}", payload: {}, as: Admin, captures: { ok_name: $.data.name } }
            - { call: "GET /growers/00000000-0000-0000-0000-000000000000", payload: {}, as: Admin, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "ok_name == Grower One inside the object envelope"
            - "err == ERR_NOT_FOUND and msg is a non-empty string inside the error envelope"

      - name: c_stub_pool_empty_close
        claim_type: conditional_action
