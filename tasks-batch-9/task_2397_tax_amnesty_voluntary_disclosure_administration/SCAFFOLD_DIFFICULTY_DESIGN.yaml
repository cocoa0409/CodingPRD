            - "GET /amnesty/payment-plans/${plan_id}/installments?status=VOIDED returns total_count == 0"
            - "GET /amnesty/enforcement-actions?agreement_id=${agr_id}&origin=BREACH_CASCADE returns total_count == 1 whose status == ABATED and abatement_reason == BREACH_RESCINDED"
            - "Taxpayer.${tp_id}.open_enforcement_action_count == 0"
            - "Taxpayer.${tp_id}.compliance_behavior_score == 100"
            - "AmnestyProgram.${prog_id}.reinstated_total_cents == 0"
            - "AmnestyProgram.${prog_id}.waived_total_cents == 300000"

      - name: payment_reversal_restores_the_cash_ledger_without_touching_the_down_payment
