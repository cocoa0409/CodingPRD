      - name: weigh_in_allowance_consecutive_day_season_cap
        claim_type: threshold
        grounds:
          - calculations.weigh_in_allowance_and_result
          - entities.Season.fields.max_consecutive_day_allowance_lbs
          - entities.Event.fields.consecutive_day_allowance_lbs
          - entities.TournamentEntry.fields.latest_effective_weight_lbs
        distinguishing_aspect: "The per-day consecutive allowance is capped by the season ceiling before it is added to the growth allowance: day 0 gets 1.0, day 1 gets 1.0 + 1.5 == 2.5, and day 2's raw 3.0 is clipped to 2.0 so the allowance is 3.0 and the limit 153.0 — not 154.0. A 153.1 lb reading therefore FAILs, and the FAIL leaves latest_effective_weight_lbs at the day-1 value."
