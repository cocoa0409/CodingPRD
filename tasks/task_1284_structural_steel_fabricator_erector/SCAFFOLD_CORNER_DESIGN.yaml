      - name: start_erection_requires_released_sequence
        claim_type: precondition_enforcement
        grounds: ["state_machines.Job.FABRICATING_to_ERECTING", "errors[ERR_SEQUENCE_NOT_RELEASED]"]
        distinguishing_aspect: "start-erection with no RELEASED sequence fails; after releasing one it succeeds and the job becomes ERECTING (guarded transition)."
        test_recipe:
          setup: ["job FABRICATING with one PLANNED sequence"]
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job SM10", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { j10: $.data.id } }
            - { call: "POST /jobs/${j10}/award", as: FABRICATOR_ADMIN }
