              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { w1_v2: $.data.version }
            - call: "POST /bakery/orders/${o1}/lines"
              payload: { menu_item_id: "${mi_bread}", quantity: 13, expected_offer_window_version: "${w1_v2}" }
              as: Customer
              as_user_id: "${cust_id}"
