endpoints:
  - method: POST
    path: "/ja-programs/_clock/set_current_utc"
    description: "Advance the logical clock; also runs time-driven sweeps (screening/training expiry with their session cascades, session auto-NO_SHOW past the 7-day delivery window). Before any call, the clock reads the fixed default 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock set", "Expiry sweeps: Volunteer screening/training CLEARED|COMPLETED -> EXPIRED when now > *_expires_on", "Auto-NO_SHOW: sessions in SCHEDULED or NEEDS_SUBSTITUTE with now > scheduled_date + 7 days -> NO_SHOW"]

  - method: POST
