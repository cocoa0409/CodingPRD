            - "DispersalActivity.${d1_id}.status == FLAGGED (cascade hop)"
            - "DispersalActivity.${d2_id}.status == FLAGGED (cascade hop)"
            - "The cascade is caused by the revocation transition, not by any direct action on the dispersals"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different error-category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_confirm
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SENIOR_REQUIRED]
        distinguishing_aspect: |
          Different error-category pair: state (priority 5) vs
          business_safety (priority 8). A strike report in DRAFT cannot be
          confirmed; a non-senior biologist cannot confirm a HIGH-risk
          species. When both violations are present, the state error wins.
        test_recipe:
          setup:
            - "Airport A; senior biologist B1; non-senior B2"
            - "Species S1 HIGH risk"
            - "Strike report SR in DRAFT (never submitted)"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KIII", name: "India Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /wildlife/species"
              payload: { common_name: "Bald Eagle", scientific_name: "Haliaeetus leucocephalus", guild: "RAPTOR", risk_tier: "HIGH", body_mass_g: 5500, is_protected_federally: true }
              as: AirportAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-801", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-802", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2026-07-15T10:00:00Z", runway_designator: "09L", aircraft_registration: "N501", species_id: "${sp_id}", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { sr_id: $.data.id }
          trigger:
            # Non-senior B2 attempts confirm on DRAFT report
            - call: "POST /wildlife/strike-reports/${sr_id}/confirm"
              payload: { confirmation_notes: "should fail" }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status 409"
            - "error_id == ERR_INVALID_STATE (state check at priority 5 fires before business_safety at priority 8)"
            - "The error is NOT ERR_SENIOR_REQUIRED even though B2 is not senior"

      - name: business_safety_vs_business_referential_on_dispersal_close
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_TAKE_PERMIT_REQUIRED]
        distinguishing_aspect: |
          Different error-category pair: business_safety (priority 7,
          segregation of duties) vs business_referential (priority 11,
          take permit required). A dispersal close attempted by the same
          biologist who performed it AND with a missing take permit must
          return the segregation-of-duties error, not the permit error.
        test_recipe:
          setup:
            - "Airport A; non-senior B2"
            - "Species S1 LOW risk"
            - "DispersalActivity D in LOGGED with animals_taken_lethal=0, method=PYROTECHNICS, take_permit_id=null"
            - "B2 performed D and attempts to close it (violates segregation AND would need a permit if lethal)"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KJJJ", name: "Juliett Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /wildlife/species"
              payload: { common_name: "House Sparrow", scientific_name: "Passer domesticus", guild: "SONGBIRD", risk_tier: "LOW", body_mass_g: 30, is_protected_federally: false }
              as: AirportAdmin
              captures: { sp_id: $.data.id }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-901", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /wildlife/dispersal-activities"
              payload: { airport_id: "${ap_id}", performed_by_biologist_id: "${b2_id}", performed_at: "2026-07-15T10:00:00Z", method: "PYROTECHNICS", species_id: "${sp_id}", animals_dispersed: 5, animals_taken_lethal: 0 }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { d_id: $.data.id }
          trigger:
            # B2 (performer) attempts to close own dispersal
            - call: "POST /wildlife/dispersal-activities/${d_id}/close"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status 403"
            - "error_id == ERR_SEGREGATION_OF_DUTIES (priority 7 fires before business_referential at priority 11)"
            - "The error is NOT ERR_TAKE_PERMIT_REQUIRED even though the dispersal has no permit reference"

