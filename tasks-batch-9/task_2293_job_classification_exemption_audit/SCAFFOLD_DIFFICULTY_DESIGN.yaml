              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ca-1"
          assert:
            - "ExemptionAnalysis.${an_id}.status == SUBMITTED"
            - "ExemptionAnalysis.${an_id}.weekly_salary_cents_snapshot == 96153"
            - "ExemptionAnalysis.${an_id}.primary_duty_pct_snapshot == 80.0"
