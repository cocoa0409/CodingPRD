            - "${snap_after} == 20000.00, ${pct_after} == 2.0000 and ${prong_after} == PASS (the PATCH re-derives no prong)"
            - "QOZBusiness.${biz_id}.qualification_status == UNTESTED and wcsh_protected_amount == 0.00"

      - name: fund_decertify_action_sets_terminal_certification_and_failed_final
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /qof/funds/{id}/decertify]
          - state_machines.Fund.SELF_CERTIFIED_to_DECERTIFIED
          - entities.Fund.fields.compliance_posture
        distinguishing_aspect: "Decertification is the one place the two independent Fund dimensions couple: a single officer action drives certification_status to the terminal DECERTIFIED and force-sets compliance_posture to FAILED_FINAL from COMPLIANT, and with no elections on the fund the InclusionEvent cascade correctly does nothing."
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund holding one QUALIFIED 1000000.00 asset, whose asset test was certified PASS so compliance_posture is COMPLIANT."
            - "No DeferralElection exists against the fund."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Decertify Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
