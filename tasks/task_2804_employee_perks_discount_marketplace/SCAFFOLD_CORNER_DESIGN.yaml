      - name: employer_admin_redemption_read_returns_403_privacy_even_for_an_absent_id
        claim_type: priority_ordering
        grounds:
          - validations[priority=16]
          - validations[priority=20]
          - errors[ERR_PRIVACY_RESTRICTED]
          - errors[ERR_REDEMPTION_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
          - roles.EmployerAdmin.cannot
        distinguishing_aspect: |
          For an id that matches no row at all, an EmployerAdmin still gets
          ERR_PRIVACY_RESTRICTED (403) from the priority-16 privacy rule rather than the
          priority-20 ERR_REDEMPTION_NOT_FOUND, which is what the same request returns for a
          PlatformAdmin, so the ordering is observable without any redemption existing.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; a single employer Northwind Co exists and no redemption or dispute has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/employers"
              payload: { name: "Northwind Co", region_code: "CA", employee_count_declared: 1, revenue_share_enabled: false, privacy_min_cohort_size: 3 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { employer_id: $.data.id }
          trigger:
            - call: "GET /perks/redemptions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { e_privacy_redemption: $.data.error_id }
            - call: "GET /perks/disputes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { e_privacy_dispute: $.data.error_id }
            - call: "GET /perks/redemptions"
              payload: { employer_id: "${employer_id}" }
              as: EmployerAdmin
              as_user_id: "${employer_id}"
              captures: { e_privacy_list: $.data.error_id }
            - call: "GET /perks/redemptions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { e_not_found: $.data.error_id }
          assert:
            - "${e_privacy_redemption} == ERR_PRIVACY_RESTRICTED with HTTP 403, not ERR_REDEMPTION_NOT_FOUND"
            - "${e_privacy_dispute} == ERR_PRIVACY_RESTRICTED with HTTP 403, not ERR_DISPUTE_NOT_FOUND"
            - "${e_privacy_list} == ERR_PRIVACY_RESTRICTED with HTTP 403: the collection read is closed to the employer too"
            - "${e_not_found} == ERR_REDEMPTION_NOT_FOUND with HTTP 404 for the identical path as PlatformAdmin, which proves rule 16 ran before rule 20"

