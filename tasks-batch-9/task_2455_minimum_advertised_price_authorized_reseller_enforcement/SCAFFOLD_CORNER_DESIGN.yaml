        distinguishing_aspect: "The cyclic REJECT edge increments dispute_rounds 0 -> 1, clears resolution_reason and pushes cure_deadline_at from 2026-08-30 to 2026-09-04 (DISPUTE_EXTENSION_DAYS 5)."
        test_recipe:
