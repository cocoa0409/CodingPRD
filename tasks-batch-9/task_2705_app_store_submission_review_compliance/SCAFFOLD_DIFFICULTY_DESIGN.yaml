      - name: header_role_tenancy_existence_schema_ladder
        grounds:
          - validations[priority=10]
          - validations[priority=15]
          - validations[priority=20]
          - validations[priority=25]
          - validations[priority=28]
          - validations[priority=35]
          - endpoints[POST /submissions/{id}/queue]
          - rbac[ComplianceOfficer]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_CROSS_ACCOUNT_ACCESS_DENIED
          - errors.ERR_SUBMISSION_NOT_FOUND
        distinguishing_aspect: |
          The same endpoint answers five different codes for the same non-existent or foreign
          submission id depending only on which rung of the 10 -> 15 -> 20 -> 25 -> 28 -> 35 ladder
          fires first: an unknown role header is 400 (never 403), an unauthorized role naming a
          non-existent id is 403 ERR_ROLE_NOT_PERMITTED (never 404), a resolvable id owned by
          another account is 403 ERR_CROSS_ACCOUNT_ACCESS_DENIED, an id resolving to nothing is
          404 even with a malformed body, and only then does the DRAFT state produce 409.
        test_recipe:
          setup:
            - "Two independent PublisherAccounts A (Northwind) and B (Eastgate), both ACTIVE"
            - "Account A owns AppRecord com.northwind.wallet with Submission build 10 in state DRAFT"
            - "Account B owns AppRecord com.eastgate.reader with Submission build 10 in state DRAFT"
            - "No pre-review check has been run on either submission; clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - { call: "POST /publisher-accounts", payload: { legal_name: "Northwind Mobile Ltd", contact_email: "ops@northwind.example", membership_paid_through_at: "2027-08-01T00:00:00Z", commerce_program_tier: "STANDARD" }, as: PlatformPolicyAdmin, as_user_id: "u-policy-1", captures: { acct_a_id: "$.data.id", acct_a_v1: "$.data.version" } }
