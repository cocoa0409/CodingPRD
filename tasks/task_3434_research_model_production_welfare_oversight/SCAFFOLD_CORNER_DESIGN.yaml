        claim_type: listing
        grounds: [response_envelope, "endpoints.GET /api/facilities/{id}/rooms"]
        distinguishing_aspect: "Pagination fields total_count and has_more track the full collection under limit/offset slicing: 3 rooms -> limit=2 yields 2 items with has_more true; offset=2 yields 1 item with has_more false."
        test_recipe:
          setup:
            - "one facility with three rooms R1, R2, R3"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "VF", excluded_agents: ["MHV"], cage_capacity: 10 }
              as: FacilityManager
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R2", barrier_level: "MPF", excluded_agents: ["MHV"], cage_capacity: 10 }
              as: FacilityManager
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R3", barrier_level: "CONVENTIONAL", excluded_agents: ["MHV"], cage_capacity: 10 }
              as: FacilityManager
          trigger:
            - call: "GET /api/facilities/${fac_id}/rooms"
              payload: { limit: 2, offset: 0 }
