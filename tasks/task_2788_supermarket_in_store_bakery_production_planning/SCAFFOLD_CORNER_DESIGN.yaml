            - "ProductionRun.${run_id}.actual_units == 0, on_shelf_units == 0, unit_cost_basis_cents == 0, wasted_units_total == 0"
            - "ProductionRun.${run_id}.final_labor_minutes == 27.00 and executed_by_user_id == 'baker-01'"
            - "BakeDay.${bd_id}.produced_units_total == 0, production_cost_cents == 600, actual_labor_minutes == 27.00"
            - "BakeDay.${bd_id}.shrink_cost_basis_pct == 0.0000 and shrink_unit_basis_pct == 0.0000 and markdown_authorization == AUTO"
            - "Ingredient.${flour_id}.on_hand_units == 1940 (2 racks * 30 units consumed despite the zero yield) and replenishment_state == OK"

      - name: run_start_bake_precondition_on_oven_availability
        claim_type: precondition_enforcement
        excluded_because:
          difficulty_instance: run_cannot_start_bake_while_its_oven_is_in_maintenance
          rationale: "That §1.8 cross_entity_state_dependency instance already drives a SCHEDULED run whose oven has moved to MAINTENANCE through start-bake and asserts ERR_OVEN_UNAVAILABLE (409) with the run left in SCHEDULED, which is exactly the precondition_enforcement claim for this transition."

      - name: ingredient_order_receive_branch_selection
        claim_type: branching
        excluded_because:
          difficulty_instance: ingredient_order_receive_forks_to_full_or_short
          rationale: "The §1.8 non_linear_state_machine instance already sends one receive trigger down both forks (RECEIVED_FULL with shortfall 0 and RECEIVED_SHORT with shortfall 10) and asserts the branch-specific side effects, so a separate branching instance would repeat it."

      - name: run_completion_cascade_down_to_ingredients_and_department
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: run_completion_cascades_consumption_reorder_and_commitment
          rationale: "The §1.8 transitive_cascade instance already verifies all four hops of the completion cascade end-to-end (rollups, ingredient consumption, REORDER_DUE auto-order, department commitment), which subsumes the cascade-down claim for this transition."

      - name: waste_void_compensation_reverses_every_original_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: voiding_waste_restores_run_unit_conservation
          rationale: "The §1.8 compensating_invariant instance already asserts that a void reverses each side effect of the waste creation with no drift (units conserved, ratios back to 0.0000, markdown_authorization back to AUTO)."

      - name: run_execution_and_disposition_dimensions_are_independent
        claim_type: parallel
        excluded_because:
          difficulty_instance: production_run_execution_and_disposition_dimensions_move_independently
          rationale: "The §1.8 non_linear_state_machine instance is built precisely on the parallel shape: it moves execution_status while disposition_status is pinned and then moves disposition_status backwards while execution_status stays COMPLETED."

  # ===========================================================================
  - section: calculations
    instances:

      - name: markdown_window_opens_four_hours_before_expiry_and_shuts_at_expiry
        claim_type: constants_applied
        grounds:
          - calculations.markdown_price
          - validations.priority_31
          - validations.priority_30
          - errors.ERR_MARKDOWN_WINDOW_NOT_OPEN
          - errors.ERR_PRODUCT_EXPIRED
        distinguishing_aspect: "MARKDOWN_WINDOW_HOURS 4 and markdown_pct 0.5 are both read from the declared constants: with expires_utc 14:35Z a markdown at 10:34Z is ERR_MARKDOWN_WINDOW_NOT_OPEN, at exactly 10:35Z it succeeds at 75 cents, and at exactly 14:35Z a sibling run is ERR_PRODUCT_EXPIRED — the window is half-open on both ends."
        test_recipe:
          setup:
            - "PLANNED BakeDay on 2026-08-12 with two COMPLETED PAR-CROIS runs (80 units each) on decks 0 and 1, both baked at 04:00Z so ready_utc is 04:35Z and expires_utc is 14:35Z."
            - "No waste attested, so markdown_authorization is AUTO and a Baker may mark down."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Bread Flour", case_pack_units: 45, unit_cost_cents: 10, shelf_life_days: 30, daily_usage_units: 40, reorder_point_units: 120, on_hand_units: 2000, allergen_tags: ["WHEAT"] }
              as: RegionalAdmin
              captures: { flour_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "THAW-FIL", name: "Thaw Filler Danish", production_method: "THAW_AND_SERVE", units_per_rack: 1, proof_minutes: 0, bake_minutes: 0, cool_minutes: 0, base_labor_minutes_per_rack: 0, setup_labor_minutes: 0, unit_retail_cents: 100, shelf_life_hours: 24 }
              as: RegionalAdmin
              captures: { fil_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "PAR-CROIS", name: "Par-baked Croissant", production_method: "PAR_BAKED", units_per_rack: 40, proof_minutes: 0, bake_minutes: 20, cool_minutes: 15, base_labor_minutes_per_rack: 10, setup_labor_minutes: 15, unit_retail_cents: 150, shelf_life_hours: 10, markdown_pct: 0.5, allergen_tags: ["WHEAT"], recipe_lines: [{ ingredient_id: "${flour_id}", units_per_rack: 30 }] }
              as: RegionalAdmin
              captures: { crois_id: $.data.id }
            - call: "POST /bakery/ovens"
              payload: { department_id: "${dept_id}", name: "Deck Oven A", deck_count: 2, rack_capacity_per_deck: 4, changeover_buffer_minutes: 20, allergen_mode: "SHARED" }
              as: RegionalAdmin
              captures: { oven_a_id: $.data.id }
            - call: "POST /bakery/bake-days"
              payload: { department_id: "${dept_id}", business_date: "2026-08-12", labor_budget_minutes: 600, oven_shift_start_utc: "2026-08-12T04:00:00Z", oven_shift_end_utc: "2026-08-12T20:00:00Z" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_id: $.data.id }
            - call: "POST /bakery/bake-days/${bd_id}/forecast-lines"
              payload: { product_id: "${fil_id}", daypart: "MORNING", forecasted_units: 1 }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { bd_v1: $.data.version }
            - call: "POST /bakery/bake-days/${bd_id}/generate-plan"
              payload: { expected_bake_day_version: "${bd_v1}" }
              as: DepartmentManager
              as_user_id: "${dept_id}"
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 2, oven_id: "${oven_a_id}", deck_index: 0, bake_start_utc: "2026-08-12T04:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { run_x_id: $.data.id, run_x_expires: $.data.expires_utc }
            - call: "POST /bakery/production-runs/${run_x_id}/start-bake"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/production-runs/${run_x_id}/complete"
              payload: { actual_units: 80 }
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/production-runs"
              payload: { bake_day_id: "${bd_id}", product_id: "${crois_id}", rack_count: 2, oven_id: "${oven_a_id}", deck_index: 1, bake_start_utc: "2026-08-12T04:00:00Z" }
              as: Baker
              as_user_id: "baker-01"
              captures: { run_y_id: $.data.id }
            - call: "POST /bakery/production-runs/${run_y_id}/start-bake"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /bakery/production-runs/${run_y_id}/complete"
              payload: { actual_units: 80 }
              as: Baker
              as_user_id: "baker-01"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T10:34:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/production-runs/${run_x_id}/markdown"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
              captures: { e_too_early: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T10:35:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/production-runs/${run_x_id}/markdown"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T14:35:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/production-runs/${run_y_id}/markdown"
              payload: {}
              as: Baker
              as_user_id: "baker-01"
              captures: { e_expired: $.data.error_id }
          assert:
            - "${run_x_expires} == 2026-08-12T14:35:00Z (ready 04:35Z + 10 shelf-life hours)"
            - "${e_too_early} == ERR_MARKDOWN_WINDOW_NOT_OPEN with HTTP 422 — one minute before the window opens"
            - "the 10:35:00Z markdown returns HTTP 200 with ProductionRun.${run_x_id}.disposition_status == MARKED_DOWN and markdown_unit_price_cents == 75 (150 * (1 - 0.5))"
            - "${e_expired} == ERR_PRODUCT_EXPIRED with HTTP 422 — exactly at expires_utc is already outside the window"
            - "ProductionRun.${run_y_id}.disposition_status is still ON_SHELF and markdown_unit_price_cents == null"

      - name: shelf_life_cap_is_compared_against_case_pack_rounded_units
        claim_type: threshold
        grounds:
          - calculations.shelf_life_order_cap
          - calculations.ingredient_order_costing
          - validations.priority_49
          - errors.ERR_SHELF_LIFE_OVERSTOCK
        distinguishing_aspect: "The cap (daily_usage_units 20 * shelf_life_days 10 = 200) is applied AFTER case-pack rounding, so a request for 190 units becomes 7 cases of 30 = 210 and is refused, while 180 units becomes 6 cases = 180 and is accepted — the requested figure never decides the outcome."
        test_recipe:
          setup:
            - "Department with freight_surcharge_pct 0.05 and one sugar ingredient: case_pack_units 30, unit_cost_cents 15, daily_usage_units 20, shelf_life_days 10, on_hand 500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40, freight_surcharge_pct: 0.05 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/ingredients"
              payload: { department_id: "${dept_id}", name: "Baker Sugar", case_pack_units: 30, unit_cost_cents: 15, shelf_life_days: 10, daily_usage_units: 20, reorder_point_units: 60, on_hand_units: 500 }
              as: RegionalAdmin
              captures: { sugar_id: $.data.id }
            - call: "GET /bakery/departments/${dept_id}"
              payload: {}
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { dept_v: $.data.version }
          trigger:
            - call: "POST /bakery/ingredient-orders"
              payload: { department_id: "${dept_id}", expected_department_version: "${dept_v}", lines: [{ ingredient_id: "${sugar_id}", required_units: 190 }] }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { e_overstock: $.data.error_id }
            - call: "POST /bakery/ingredient-orders"
              payload: { department_id: "${dept_id}", expected_department_version: "${dept_v}", lines: [{ ingredient_id: "${sugar_id}", required_units: 180 }] }
              as: DepartmentManager
              as_user_id: "${dept_id}"
              captures: { order_id: $.data.id }
          assert:
            - "${e_overstock} == ERR_SHELF_LIFE_OVERSTOCK with HTTP 422 (ceil(190/30) = 7 cases = 210 units > cap 200)"
            - "the rejected call created no IngredientOrder and left BakeryDepartment.${dept_id}.version == ${dept_v}"
            - "IngredientOrder.${order_id} exists with order_status DRAFT, its single line carrying cases == 6, ordered_units == 180 and line_cost_cents == 2835 (180 * 15 * 1.05)"
            - "IngredientOrder.${order_id}.order_total_cents == 2835 and BakeryDepartment.${dept_id}.open_purchase_commitment_cents == 2835"
            - "180 == cap - 20 is under the cap and 210 is over it, so only the rounded figure crossed the threshold"

      - name: decoration_deadline_is_the_slot_start_minus_the_computed_lead_and_is_inclusive
        claim_type: correct_result
        grounds:
          - calculations.decoration_lead_time
          - validations.priority_32
          - errors.ERR_DECORATION_LEAD_TIME_MISSED
          - entities.CustomCakeOrder.fields.decoration_deadline_utc
        distinguishing_aspect: "For a STANDARD 2-tier cake the lead is 120 + 30 * 2 = 180 minutes, putting decoration_deadline_utc at 11:00Z for a 14:00Z slot; a confirm at exactly 11:00Z is accepted and a confirm one minute later on an identical sibling order is ERR_DECORATION_LEAD_TIME_MISSED."
        test_recipe:
          setup:
            - "DRAFT BakeDay on 2026-08-12 with an OPEN 14:00-16:00Z slot (capacity 30) and two identical STANDARD 2-tier orders in INTAKE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T04:00:00Z" }
              as: RegionalAdmin
            - call: "POST /bakery/departments"
              payload: { name: "Store 41 Bakery", store_number: "0041", shrink_budget_pct: 0.03, labor_rate_cents_per_minute: 40 }
              as: RegionalAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /bakery/products"
              payload: { department_id: "${dept_id}", sku: "CAKE-8", name: "8 Inch Round Base", production_method: "THAW_AND_SERVE", units_per_rack: 1, proof_minutes: 0, bake_minutes: 0, cool_minutes: 0, base_labor_minutes_per_rack: 0, setup_labor_minutes: 0, unit_retail_cents: 1800, shelf_life_hours: 48, is_custom_cake_base: true }
              as: RegionalAdmin
