          - entities.Application.fields.ami_pct
        distinguishing_aspect: |
          Numeric-threshold boundary on the AMI income ceiling via POST /applications/{id}/review. Ceiling
          = floor(10,000,000 * 80 / 100) = 8,000,000. Income exactly 8,000,000 satisfies the inclusive
          '<=' and the review to ELIGIBLE succeeds (ami_pct 80.00); income 8,000,001 would fail with
          ERR_INCOME_OVER_LIMIT.
