  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_over_fiscal_on_go_live
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_CONTRACT_INVALID_STATE]
          - errors[ERR_RATE_PARITY_VIOLATION]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the go-live request
          violates BOTH the state precondition (contract is IN_TESTING, not
          READY_FOR_GO_LIVE) AND the parity fiscal rule (rate ratio 11100 > band
          11000 against the other ACTIVE contract); priority 6 beats priority 11,
          so ERR_CONTRACT_INVALID_STATE must be returned.
        test_recipe:
          setup:
            - "Contract A on PPO network fully ACTIVE with EFFECTIVE entry 99213 at 10000 cents"
            - "Contract B on MEDICARE_ADVANTAGE network (same provider) in IN_TESTING with a VALIDATED version whose entry 99213 computes to 11100 (pct 11100 on the same 10000 benchmark)"
            - "ACTIVE RateParityRule (COMMERCIAL_PPO, MEDICARE_ADVANTAGE, band_bps 11000)"
          setup_api_calls:
            - { call: "POST /networks", payload: { name: "PPO-NET", line_of_business: "COMMERCIAL_PPO" }, as: PlanAdmin, captures: { net_id: $.data.id } }
            - { call: "POST /networks", payload: { name: "MA-NET", line_of_business: "MEDICARE_ADVANTAGE" }, as: PlanAdmin, captures: { net_ma: $.data.id } }
            - { call: "POST /medicare-benchmarks", payload: { benchmark_year: 2026, locality_code: "L01", hcpcs_code: "99213", benchmark_amount_cents: 10000 }, as: PlanAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /medicare-benchmarks/${b_id}/publish", as: PlanAdmin }
            - { call: "POST /rate-parity-rules", payload: { line_of_business_a: "COMMERCIAL_PPO", line_of_business_b: "MEDICARE_ADVANTAGE", band_bps: 11000 }, as: PlanAdmin }
            - { call: "POST /providers", payload: { legal_name: "Prov A", tin: "TIN-A", npi: "NPI-A", locality_code: "L01" }, as: PlanAdmin, captures: { prov_id: $.data.id } }
            # Contract A to ACTIVE at rate 10000
            - { call: "POST /providers/${prov_id}/contracts", payload: { network_id: "${net_id}", base_effective_date: "2026-07-01", term_months: 36, escalator_bps: 0, escalator_mode: "ANNIVERSARY", auto_renew: false }, as: ContractManager, captures: { ca_id: $.data.id } }
            - { call: "POST /contracts/${ca_id}/begin-negotiation", as: ContractManager }
            - { call: "POST /contracts/${ca_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${ca_id}/sign", as: ContractLegal, as_user_id: "cl-1" }
            - { call: "POST /contracts/${ca_id}/begin-configuration", as: ConfigurationAnalyst, captures: { ca_v: $.data.version } }
            - { call: "POST /contracts/${ca_id}/versions", payload: { version_number: 1, effective_date: "2026-07-01", expected_contract_version: "${ca_v}" }, as: ContractManager, captures: { va_id: $.data.id } }
            - { call: "POST /contract-versions/${va_id}/fee-schedule-entries", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", rate_type: "PERCENT_OF_MEDICARE", pct_of_medicare_bps: 10000 }, as: ConfigurationAnalyst, captures: { ea_id: $.data.id } }
            - { call: "POST /fee-schedule-entries/${ea_id}/map-benchmark", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${va_id}/load", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${va_id}/validate", as: ConfigurationAnalyst }
            - { call: "POST /contracts/${ca_id}/begin-testing", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${va_id}/simulation-batches", payload: { label: "BA" }, as: ConfigurationAnalyst, captures: { ba_id: $.data.id } }
            - { call: "POST /simulation-batches/${ba_id}/claims", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", service_date: "2026-07-15", billed_cents: 15000, expected_allowed_cents: 10000 }, as: ConfigurationAnalyst }
            - { call: "POST /simulation-batches/${ba_id}/price", as: ConfigurationAnalyst }
            - { call: "POST /simulation-batches/${ba_id}/score", as: ConfigurationAnalyst }
            - { call: "POST /contracts/${ca_id}/mark-ready", as: ConfigurationAnalyst }
            - { call: "POST /contracts/${ca_id}/approve-go-live", as: PlanAdmin }
            # Contract B to IN_TESTING at rate 11100 (parity would fail; state also wrong for go-live)
            - { call: "POST /providers/${prov_id}/contracts", payload: { network_id: "${net_ma}", base_effective_date: "2026-07-01", term_months: 36, escalator_bps: 0, escalator_mode: "ANNIVERSARY", auto_renew: false }, as: ContractManager, captures: { cb_id: $.data.id } }
            - { call: "POST /contracts/${cb_id}/begin-negotiation", as: ContractManager }
            - { call: "POST /contracts/${cb_id}/submit-for-signature", as: ContractManager, as_user_id: "cm-1" }
            - { call: "POST /contracts/${cb_id}/sign", as: ContractLegal, as_user_id: "cl-1" }
            - { call: "POST /contracts/${cb_id}/begin-configuration", as: ConfigurationAnalyst, captures: { cb_v: $.data.version } }
            - { call: "POST /contracts/${cb_id}/versions", payload: { version_number: 1, effective_date: "2026-07-01", expected_contract_version: "${cb_v}" }, as: ContractManager, captures: { vb_id: $.data.id } }
            - { call: "POST /contract-versions/${vb_id}/fee-schedule-entries", payload: { hcpcs_code: "99213", service_category: "OFFICE_VISIT", rate_type: "PERCENT_OF_MEDICARE", pct_of_medicare_bps: 11100 }, as: ConfigurationAnalyst, captures: { eb_id: $.data.id } }
            - { call: "POST /fee-schedule-entries/${eb_id}/map-benchmark", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${vb_id}/load", as: ConfigurationAnalyst }
            - { call: "POST /contract-versions/${vb_id}/validate", as: ConfigurationAnalyst }
            - { call: "POST /contracts/${cb_id}/begin-testing", as: ConfigurationAnalyst }
          trigger:
            - { call: "POST /contracts/${cb_id}/approve-go-live", as: PlanAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CONTRACT_INVALID_STATE (state priority 6 wins over business_fiscal priority 11; NOT ERR_RATE_PARITY_VIOLATION)"
            - "Contract ${cb_id}.contract_status == IN_TESTING (unchanged)"
      - name: safety_over_referential_on_entry_create
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_RATE_BELOW_FLOOR]
          - errors[ERR_BENCHMARK_UNRESOLVABLE]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential (different
          pair from the other instance): the entry create violates BOTH the
          regulatory rate floor (pct 7000 < 8000) AND benchmark referential
          resolvability (no MedicareBenchmark row at all for hcpcs ZZZZZ);
          priority 7 beats priority 10, so ERR_RATE_BELOW_FLOOR must be returned.
        test_recipe:
