scaffold_corner_design:

  # ===================================================================
  # Entities
  # ===================================================================
  - section: entities
    instances:

      - name: corner_create_house_returns_201_with_zeroed_room_counts_and_open_posture
        claim_type: Creation
        grounds:
          - entities.House.fields.total_room_count
          - entities.House.fields.compliance_posture
          - endpoints[POST /co-living/houses]
        distinguishing_aspect: "A freshly created House returns 201 with total_room_count 0, all five room-state buckets 0, compliance_posture OPEN and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock still at its 2026-05-01T00:00:00Z default."
            - "One Host exists."
          setup_api_calls:
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id, house_v: $.data.version }
          assert:
            - "HTTP 201"
            - "House.${house_id}.total_room_count == 0"
            - "House.${house_id}.vacant_room_count == 0 and reserved_room_count == 0 and occupied_room_count == 0 and notice_pending_room_count == 0 and out_of_service_room_count == 0"
            - "House.${house_id}.compliance_posture == OPEN"
            - "${house_v} == 1"
            - "House.${house_id}.monthly_utility_budget_cents == 60000 and host_id == ${host_id}"

      - name: corner_get_room_by_id_returns_stored_room
        claim_type: Retrieval
        grounds:
          - endpoints[GET /co-living/rooms/{id}]
          - entities.Room.fields.occupancy_state
        distinguishing_aspect: "GET /co-living/rooms/{id} returns the exact stored room with occupancy_state VACANT and available_from_date null."
        test_recipe:
          setup:
            - "One host, one house and one room 101 at 25000 cents/week and 100000 cents/month with private_bath true."
          setup_api_calls:
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { room1_id: $.data.id }
          trigger:
            - call: "GET /co-living/rooms/${room1_id}"
              payload: {}
              as: CommunityManager
              as_user_id: "cm-1"
          assert:
            - "HTTP 200"
            - "Room.${room1_id}.room_number == 101 and weekly_rate_cents == 25000 and monthly_rate_cents == 100000"
            - "Room.${room1_id}.private_bath == true"
            - "Room.${room1_id}.occupancy_state == VACANT and available_from_date == null"
            - "Room.${room1_id}.house_id == ${house_id}"

      - name: corner_list_rooms_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /co-living/rooms]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three rooms in the house, limit 2 / offset 0 returns exactly 2 rows with total_count 3 and has_more true; offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "One house with rooms 101, 102 and 103."
          setup_api_calls:
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "102", weekly_rate_cents: 20000, monthly_rate_cents: 80000, private_bath: false }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "103", weekly_rate_cents: 30000, monthly_rate_cents: 120000, private_bath: false }
              as: Host
              as_user_id: "${host_id}"
          trigger:
            - call: "GET /co-living/rooms"
              payload: { house_id: "${house_id}", limit: 2, offset: 0 }
              as: CommunityManager
              as_user_id: "cm-1"
            - call: "GET /co-living/rooms"
              payload: { house_id: "${house_id}", limit: 2, offset: 2 }
              as: CommunityManager
              as_user_id: "cm-1"
          assert:
            - "the first call returns exactly 2 rows with meta pagination total_count == 3 and has_more == true"
            - "the second call returns exactly 1 row with total_count == 3 and has_more == false"
            - "response_type == array on both calls"

      - name: corner_get_membership_with_unknown_uuid_returns_membership_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /co-living/memberships/{id}]
          - errors[ERR_MEMBERSHIP_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown membership UUID returns HTTP 404 with error_id ERR_MEMBERSHIP_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database except one host, so no membership exists."
          setup_api_calls:
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
          trigger:
            - call: "GET /co-living/memberships/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_MEMBERSHIP_NOT_FOUND"
            - "the error envelope has response_type == error and a non-empty message"

      - name: corner_create_room_missing_required_weekly_rate_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /co-living/rooms]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "weekly_rate_cents has source input with no default, so omitting it returns HTTP 422 ERR_INVALID_REQUEST and no Room row is created."
        test_recipe:
          setup:
            - "One host and one house exist; the house has zero rooms."
          setup_api_calls:
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
          trigger:
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", monthly_rate_cents: 100000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "House.${house_id}.total_room_count is still 0"

      - name: corner_create_room_omitting_private_bath_defaults_to_false
        claim_type: Defaults
        grounds:
          - entities.Room.fields.private_bath
          - endpoints[POST /co-living/rooms]
        distinguishing_aspect: "private_bath carries default false, so a create that omits it stores false rather than null."
        test_recipe:
          setup:
            - "One host and one house exist."
          setup_api_calls:
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
          trigger:
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { room1_id: $.data.id }
          assert:
            - "HTTP 201 and Room.${room1_id}.private_bath == false"
            - "Room.${room1_id}.occupancy_state == VACANT"
            - "House.${house_id}.total_room_count == 1 and vacant_room_count == 1"

      - name: corner_application_required_income_derives_from_room_rate_not_declared_income
        claim_type: Computed Fields
        grounds:
          - entities.Application.fields.required_income_cents
          - entities.Application.fields.monthly_equivalent_cents
          - entities.Member.fields.declared_monthly_income_cents
          - calculations.application_income_qualification
        distinguishing_aspect: "required_income_cents is computed from the room's weekly rate (25000 -> 108333 -> 324999) and is entirely independent of Member.declared_monthly_income_cents, which is set to a deliberately misleading 1."
        test_recipe:
          setup:
            - "One house with room 101 at 25000 cents/week."
            - "Member Cyd is onboarded with declared_monthly_income_cents 1."
          setup_api_calls:
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { room1_id: $.data.id }
            - call: "POST /co-living/members"
              payload: { full_name: "Cyd Alvarez", email: "cyd@resident.example", declared_monthly_income_cents: 1 }
              as: PlatformAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /co-living/applications"
              payload: { member_id: "${m3_id}", room_id: "${room1_id}", requested_move_in_date: "2026-05-10", billing_cycle: "WEEKLY" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /co-living/applications/${app_id}/screening-reports"
              payload: { background_result: "CLEAR", verified_monthly_income_cents: 400000, report_reference: "SCR-C1" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { sr_seq: $.data.sequence_number }
          assert:
            - "Application.${app_id}.monthly_equivalent_cents == 108333"
            - "Application.${app_id}.required_income_cents == 324999"
            - "Application.${app_id}.status == SCREENED and screening_round == 1"
            - "${sr_seq} == 1"
            - "Member.${m3_id}.declared_monthly_income_cents is still 1 and had no effect on required_income_cents"

      - name: corner_screening_report_is_append_only_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ScreeningReport
          - endpoints[GET /co-living/applications/{id}/screening-reports]
        distinguishing_aspect: "ScreeningReport declares common_fields false, so each row exposes id and created_at but no version and no updated_at, and there is no update endpoint - a second screening produces a second row with sequence_number 2 rather than mutating the first."
        test_recipe:
          setup:
            - "One house with room 101; member Cyd has a SUBMITTED application that has been screened once at 100000, then decided CONDITIONAL and resubmitted."
          setup_api_calls:
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { room1_id: $.data.id }
            - call: "POST /co-living/members"
              payload: { full_name: "Cyd Alvarez", email: "cyd@resident.example", declared_monthly_income_cents: 100000 }
              as: PlatformAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /co-living/applications"
              payload: { member_id: "${m3_id}", room_id: "${room1_id}", requested_move_in_date: "2026-05-10", billing_cycle: "WEEKLY" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { app_id: $.data.id }
            - call: "POST /co-living/applications/${app_id}/screening-reports"
              payload: { background_result: "CLEAR", verified_monthly_income_cents: 100000, report_reference: "SCR-C1" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { sr1_id: $.data.id }
            - call: "POST /co-living/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /co-living/applications/${app_id}/resubmit"
              payload: {}
              as: Member
              as_user_id: "${m3_id}"
          trigger:
            - call: "POST /co-living/applications/${app_id}/screening-reports"
              payload: { background_result: "FLAGGED", verified_monthly_income_cents: 400000, report_reference: "SCR-C2" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { sr2_id: $.data.id, sr2_seq: $.data.sequence_number }
          assert:
            - "${sr2_id} != ${sr1_id} - the first report was not overwritten"
            - "${sr2_seq} == 2"
            - "GET /co-living/applications/${app_id}/screening-reports returns exactly 2 rows ordered by created_at then sequence_number ascending"
            - "each returned ScreeningReport exposes id and created_at and carries no version field"
            - "Application.${app_id}.screening_round == 2 and status == SCREENED"

      - name: corner_create_application_with_invalid_billing_cycle_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Application.fields.billing_cycle
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "billing_cycle accepts only WEEKLY or MONTHLY, so the value BIWEEKLY returns HTTP 422 ERR_INVALID_REQUEST and creates no Application."
        test_recipe:
          setup:
            - "One house with room 101 and one member."
          setup_api_calls:
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { house_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${house_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: Host
              as_user_id: "${host_id}"
              captures: { room1_id: $.data.id }
            - call: "POST /co-living/members"
              payload: { full_name: "Cyd Alvarez", email: "cyd@resident.example", declared_monthly_income_cents: 400000 }
              as: PlatformAdmin
              captures: { m3_id: $.data.id }
          trigger:
            - call: "POST /co-living/applications"
              payload: { member_id: "${m3_id}", room_id: "${room1_id}", requested_move_in_date: "2026-05-10", billing_cycle: "BIWEEKLY" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "GET /co-living/applications filtered by member_id ${m3_id} returns 0 rows"

      - name: corner_create_room_under_unknown_house_returns_house_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Room.fields.house_id
          - errors[ERR_HOUSE_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: "Room.house_id is a body foreign key, so an unknown house UUID returns HTTP 404 ERR_HOUSE_NOT_FOUND rather than 422."
        test_recipe:
          setup:
            - "One host exists and owns no house."
          setup_api_calls:
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /co-living/rooms"
              payload: { house_id: "00000000-0000-4000-8000-0000000000aa", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_HOUSE_NOT_FOUND"

      - name: corner_member_system_fields_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.Member
          - entities.Member.fields.strike_points
          - entities.Member.fields.standing_band
        distinguishing_aspect: "A newly created Member gets a server-minted dashed UUID id with no type prefix, version 1, created_at equal to the logical clock instant, strike_points 0 and standing_band GOOD."
        test_recipe:
          setup:
            - "Logical clock explicitly pinned to 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /co-living/members"
              payload: { full_name: "Cyd Alvarez", email: "cyd@resident.example", declared_monthly_income_cents: 400000 }
              as: PlatformAdmin
              captures: { m3_id: $.data.id, m3_v: $.data.version }
          assert:
            - "HTTP 201 and ${m3_id} matches the dashed 8-4-4-4-12 UUID shape with no prefix such as mem_"
            - "${m3_v} == 1"
            - "Member.${m3_id}.created_at == 2026-06-01T00:00:00.000Z"
            - "Member.${m3_id}.strike_points == 0 and standing_band == GOOD"

      - name: corner_duplicate_room_number_within_house_returns_duplicate_room_number
        claim_type: Type Constraints
        grounds:
          - entities.Room.fields.room_number
          - errors[ERR_DUPLICATE_ROOM_NUMBER]
          - validations[priority=8]
        distinguishing_aspect: "room_number is unique per house_id, so a second room 101 in the same house returns HTTP 409 ERR_DUPLICATE_ROOM_NUMBER while the same number in a different house is accepted."
        test_recipe:
          setup:
            - "One host with two houses, Peachtree A and Peachtree B; Peachtree A already has room 101."
          setup_api_calls:
            - call: "POST /co-living/hosts"
              payload: { legal_name: "Peachtree Holdings LLC", payout_account_ref: "acct_pt_001", contact_email: "ops@peachtree.example" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree A", address_line1: "12 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 60000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { houseA_id: $.data.id }
            - call: "POST /co-living/houses"
              payload: { host_id: "${host_id}", label: "Peachtree B", address_line1: "14 Peachtree St", city: "Atlanta", state_code: "GA", monthly_utility_budget_cents: 45000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { houseB_id: $.data.id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${houseA_id}", room_number: "101", weekly_rate_cents: 25000, monthly_rate_cents: 100000, private_bath: true }
              as: Host
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /co-living/rooms"
              payload: { house_id: "${houseA_id}", room_number: "101", weekly_rate_cents: 26000, monthly_rate_cents: 104000, private_bath: false }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
            - call: "POST /co-living/rooms"
              payload: { house_id: "${houseB_id}", room_number: "101", weekly_rate_cents: 26000, monthly_rate_cents: 104000, private_bath: false }
              as: Host
              as_user_id: "${host_id}"
              captures: { roomB_id: $.data.id }
          assert:
            - "the first trigger returns HTTP 409 with error_id == ERR_DUPLICATE_ROOM_NUMBER"
            - "House.${houseA_id}.total_room_count is still 1"
            - "the second trigger returns HTTP 201 and Room.${roomB_id}.room_number == 101"
            - "House.${houseB_id}.total_room_count == 1"

  # ===================================================================
  # State machines
  # ===================================================================
  - section: state_machines
    instances:

      - name: corner_membership_starts_in_pending_move_in_and_current
        claim_type: Initial State
        grounds:
          - state_machines.Membership.PENDING_MOVE_IN_to_ACTIVE
          - entities.Membership.fields.tenancy_status
          - entities.Membership.fields.billing_status
          - entities.Membership.fields.deposit_cents
        distinguishing_aspect: "A converted application yields a Membership whose two axes start at PENDING_MOVE_IN and CURRENT, with period_days 7, base_period_rate_cents 25000, deposit_cents 25000 copied from the APPROVED application, and balance_due_cents 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; house Peachtree A with room 101 at 25000 cents/week."
            - "Ada holds an APPROVED WEEKLY application on room 101 with required_deposit_cents 25000."
          setup_api_calls:
            - call: "POST /co-living/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
