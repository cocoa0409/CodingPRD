        distinguishing_aspect: >-
          Version numbers are a per-row write counter, not a global sequence, so after a fully planned
          departure each row's version is exactly the number of writes that touched it: the order was
          written three times, the mission four, the robot four, the plan three and the zone four, and the
          DEPART itself bumps only the mission and the order even though it reads the plan, the robot and
          the zone.
