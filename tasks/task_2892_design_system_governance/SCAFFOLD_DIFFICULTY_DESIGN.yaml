            - "Component.${comp_id}.docs_state == DRAFT and Component.${comp_id}.current_major_version == 1"

  # =========================================================================
  # RULE 8 — resource_temporal_overlap
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: deprecation_windows_touching_at_removal_instant_are_admitted
        grounds:
          - validations[priority=26]
          - validations[priority=25]
          - errors[ERR_DEPRECATION_WINDOW_OVERLAP]
          - calculations.deprecation_notice_window
          - entities.DeprecationPlan.announced_at
        distinguishing_aspect: |
          Resource = a Component, interval = HALF-OPEN [announced_at, removal_at), and the probe
          sits exactly on the shared endpoint: the second plan's announced_at equals the first
          plan's removal_at, which is the one arrangement the half-open rule MUST admit (201).
          The DRAFT state of the first plan still occupies the window, so this is a real
          occupancy test rather than a vacuous one.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `legacy-tabs` EXPERIMENTAL / ACTIVE with no implementations, so required_notice_days == 14 for every plan"
            - "plan A left in DRAFT occupying [2026-08-01T00:00:00.000Z, 2026-09-25T00:00:00.000Z) with actual_notice_days 19 and removal_at - sunset_at == 36 days"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Legacy Tabs", slug: "legacy-tabs", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/deprecation-plans"
              payload: { announced_at: "2026-08-01T00:00:00.000Z", sunset_at: "2026-08-20T00:00:00.000Z", removal_at: "2026-09-25T00:00:00.000Z" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_a: $.data.id, plan_a_state: $.data.state, plan_a_req: $.data.required_notice_days, plan_a_act: $.data.actual_notice_days }
          trigger:
            - call: "POST /design-system/components/${comp_id}/deprecation-plans"
              payload: { announced_at: "2026-09-25T00:00:00.000Z", sunset_at: "2026-10-20T00:00:00.000Z", removal_at: "2026-11-25T00:00:00.000Z" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_b: $.data.id, plan_b_state: $.data.state, plan_b_req: $.data.required_notice_days, plan_b_act: $.data.actual_notice_days }
          assert:
            - "${plan_a_state} == DRAFT and ${plan_a_req} == 14 and ${plan_a_act} == 19"
            - "HTTP status == 201"
            - "${plan_b_state} == DRAFT and ${plan_b_req} == 14 and ${plan_b_act} == 25"
            - "GET /design-system/components/${comp_id}/deprecation-plans returns total_count == 2 (${plan_a} and ${plan_b})"
            - "Component.${comp_id}.lifecycle_state == ACTIVE (drafting plans never moves the lifecycle dimension)"

      - name: adoption_scans_sharing_one_endpoint_instant_collide_for_the_same_kind
        grounds:
          - validations[priority=27]
          - errors[ERR_SCAN_WINDOW_OVERLAP]
          - calculations.team_adoption_index
          - entities.AdoptionScan.window_end_at
        distinguishing_aspect: |
          A DIFFERENT resource (a Team, not a Component) and the OPPOSITE interval convention:
          AdoptionScan windows are CLOSED [window_start_at, window_end_at], so the identical
          arrangement that the previous instance admits — a shared endpoint instant — MUST be
          refused here with 409. The same-instant probe is what makes the closed/half-open
          contrast observable.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `metrics-team`"
            - "one CODE_SCAN AdoptionScan over the closed window [2026-06-01, 2026-06-30] with 90 system / 10 legacy / 0 one-off instances, so adoption_ratio == 90.00 and adoption_index_latest == 63.00 (0.70 * 90.00 + 0.30 * 0.00)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Metrics Team", slug: "metrics-team", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/teams/${team_id}/adoption-scans"
              payload: { scan_kind: "CODE_SCAN", window_start_at: "2026-06-01T00:00:00.000Z", window_end_at: "2026-06-30T00:00:00.000Z", system_instance_count: 90, legacy_instance_count: 10, one_off_instance_count: 0 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { scan1: $.data.id, ratio1: $.data.adoption_ratio }
            - call: "GET /design-system/teams/${team_id}"
              payload: {}
              as: SystemAdmin
              captures: { idx_latest: $.data.adoption_index_latest }
          trigger:
            - call: "POST /design-system/teams/${team_id}/adoption-scans"
              payload: { scan_kind: "CODE_SCAN", window_start_at: "2026-06-30T00:00:00.000Z", window_end_at: "2026-07-31T00:00:00.000Z", system_instance_count: 99, legacy_instance_count: 1, one_off_instance_count: 0 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${ratio1} == 90.00 and ${idx_latest} == 63.00"
            - "${err} == ERR_SCAN_WINDOW_OVERLAP"
            - "HTTP status == 409"
            - "GET /design-system/teams/${team_id}/adoption-scans?scan_kind=CODE_SCAN returns total_count == 1 (only ${scan1})"
            - "Team.${team_id}.adoption_index_latest == 63.00 (the refused 99/1 scan did not move the index)"

      - name: adoption_scan_overlap_is_scoped_per_scan_kind_not_per_team
        grounds:
          - validations[priority=27]
          - calculations.team_adoption_index
          - entities.AdoptionScan.scan_kind
        distinguishing_aspect: |
          Same resource and same closed-interval convention as the previous instance, but the
          overlap key carries an extra dimension: the exclusion is scoped to
          (team_id, scan_kind). A DESIGN_LINT window that overlaps a CODE_SCAN window on the same
          team MUST be admitted (201), which is the only way to show that the scope key is a pair
          and not the team alone.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `metrics-team`"
            - "one CODE_SCAN AdoptionScan over [2026-06-01, 2026-06-30] with 90 system / 10 legacy / 0 one-off (adoption_ratio 90.00)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Metrics Team", slug: "metrics-team", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/teams/${team_id}/adoption-scans"
              payload: { scan_kind: "CODE_SCAN", window_start_at: "2026-06-01T00:00:00.000Z", window_end_at: "2026-06-30T00:00:00.000Z", system_instance_count: 90, legacy_instance_count: 10, one_off_instance_count: 0 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { scan_code: $.data.id, ratio_code: $.data.adoption_ratio }
          trigger:
            - call: "POST /design-system/teams/${team_id}/adoption-scans"
              payload: { scan_kind: "DESIGN_LINT", window_start_at: "2026-06-15T00:00:00.000Z", window_end_at: "2026-07-31T00:00:00.000Z", system_instance_count: 60, legacy_instance_count: 40, one_off_instance_count: 0 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { scan_lint: $.data.id, ratio_lint: $.data.adoption_ratio, lint_kind: $.data.scan_kind }
          assert:
            - "${ratio_code} == 90.00"
            - "HTTP status == 201 (the DESIGN_LINT window [2026-06-15, 2026-07-31] strictly overlaps the CODE_SCAN window and is still admitted)"
            - "${lint_kind} == DESIGN_LINT and ${ratio_lint} == 60.00"
            - "Team.${team_id}.adoption_index_latest == 81.00 (0.70 * 90.00 + 0.30 * 60.00)"
            - "Team.${team_id}.adoption_index_trailing == 81.00 (one row per kind, so the trailing average equals the latest ratio for each kind)"
            - "GET /design-system/teams/${team_id}/adoption-scans returns total_count == 2 (${scan_code} and ${scan_lint})"

  # =========================================================================
  # RULE 9 — compensating_invariant
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: exception_repayment_returns_outstanding_debt_to_its_pre_approval_value
        grounds:
          - state_machines.ExceptionGrant.APPROVED_to_REPAID
          - calculations.exception_debt_points
          - entities.Team.outstanding_debt_points
          - entities.Team.lifetime_debt_points
          - entities.Component.one_off_exception_count
        distinguishing_aspect: |
          Conserved quantity = Team.outstanding_debt_points, which MUST return to exactly its
          pre-approval value (0.00) while the deliberately NON-restored quantity,
          Team.lifetime_debt_points, stays at 10.50 and the grant retains its frozen debt_points
          of 10.50 as a historic record. Repayment is a compensation, not a deletion.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `bespoke-team` with debt_budget_points 40.00, outstanding_debt_points 0.00 and lifetime_debt_points 0.00"
            - "Component `mega-menu` EXPERIMENTAL / ACTIVE"
            - "one ExceptionGrant ONE_OFF_COMPONENT / platform_scope ALL against `mega-menu`, APPROVED: 12 * 1.75 * 0.50 = 10.50 points"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Bespoke Team", slug: "bespoke-team", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id, outstanding_before: $.data.outstanding_debt_points, lifetime_before: $.data.lifetime_debt_points }
            - call: "POST /design-system/components"
              payload: { name: "Mega Menu", slug: "mega-menu", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/exception-grants"
              payload: { requesting_team_id: "${team_id}", substitute_for_component_id: "${comp_id}", exception_kind: "ONE_OFF_COMPONENT", platform_scope: "ALL", justification: "Marketing mega menu across web, iOS and Android for the launch.", expires_at: "2026-12-31T00:00:00.000Z" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { grant_id: $.data.id }
            - call: "POST /design-system/exception-grants/${grant_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "Approved with a repayment plan." }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { pts: $.data.debt_points, pinned: $.data.pinned_maturity_level }
            - call: "GET /design-system/teams/${team_id}"
              payload: {}
              as: SystemAdmin
              captures: { outstanding_after_approve: $.data.outstanding_debt_points, lifetime_after_approve: $.data.lifetime_debt_points }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { exc_count_after_approve: $.data.one_off_exception_count }
          trigger:
            - call: "POST /design-system/exception-grants/${grant_id}/repay"
              payload: { remediation_notes: "Replaced with the system menu component in release 4.3.0." }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { state_after: $.data.state, pts_after: $.data.debt_points, repaid_at: $.data.repaid_at }
          assert:
            - "${outstanding_before} == 0.00 and ${lifetime_before} == 0.00"
            - "${pts} == 10.50 and ${pinned} == EXPERIMENTAL"
            - "${outstanding_after_approve} == 10.50 and ${lifetime_after_approve} == 10.50 and ${exc_count_after_approve} == 1"
            - "HTTP status == 200"
            - "${state_after} == REPAID and ${repaid_at} == 2026-08-01T00:00:00.000Z"
            - "${pts_after} == 10.50 (the frozen amount is retained on the row, not zeroed)"
            - "Team.${team_id}.outstanding_debt_points == 0.00 (exactly the pre-approval value)"
            - "Team.${team_id}.lifetime_debt_points == 10.50 (deliberately NOT restored)"
            - "Team.${team_id}.debt_state == CLEAR"
            - "Component.${comp_id}.one_off_exception_count == 0"

      - name: deprecation_rescission_returns_the_dependency_block_total_but_not_the_demotion
        grounds:
          - state_machines.DeprecationPlan.SUNSET_to_RESCINDED
          - state_machines.Component.STABLE_to_BETA
          - entities.Component.blocked_dependency_count
          - entities.ComponentDependency.compatibility_state
          - entities.DeprecationPlan.blocked_dependent_count
        distinguishing_aspect: |
          A DIFFERENT conserved quantity of a different type — the dependency-block total
          (consumer.blocked_dependency_count, the edge's compatibility_state and the plan's
          blocked_dependent_count all return to their pre-sunset values) — and a DIFFERENT
          non-restored quantity: the consumer's maturity_level stays BETA with
          maturity_demotion_reason UPSTREAM_SUNSET, because a governance demotion is a recorded
          fact and is never auto-promoted by a rescission.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; provider Component `icon-core` EXPERIMENTAL / ACTIVE with no implementations; consumer Component `nav-bar` created with docs_state PUBLISHED"
            - "`nav-bar` has WEB and IOS implementations, each with all-zero AUTOMATED and MANUAL AA audits (conformance 100.00), both SHIPPED, so coverage_state is PARTIAL"
            - "`nav-bar` promoted EXPERIMENTAL -> BETA -> STABLE (governance sweep 100.00 at each gate, docs PUBLISHED)"
            - "a ComponentDependency nav-bar -> icon-core pinned at provider major 1, so compatibility_state is COMPATIBLE and nav-bar.blocked_dependency_count is 0"
            - "a DeprecationPlan on `icon-core` (announced 2026-08-01, sunset 2026-08-20, removal 2026-09-25, guide published) advanced to SUNSET after the clock moves to 2026-08-20, running the three-hop cascade: edge -> SUNSET_PROVIDER, nav-bar.blocked_dependency_count -> 1, plan.blocked_dependent_count -> 1, nav-bar STABLE -> BETA with reason UPSTREAM_SUNSET"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Icon Core", slug: "icon-core", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { prov_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Nav Bar", slug: "nav-bar", owning_team_id: "${team_id}", docs_state: "PUBLISHED" }
              as: DesignSystemLead
              captures: { cons_id: $.data.id }
            - call: "POST /design-system/components/${cons_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/nav-bar-web", package_version: "6.0.0", token_compliance_ratio: 0.98 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_web: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_web}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/nav-web-auto" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_web}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/nav-web-manual" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_web}/ship"
              payload: { package_version: "6.0.0", token_compliance_ratio: 0.98 }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/components/${cons_id}/platform-implementations"
              payload: { platform: "IOS", package_name: "DSNavBar", package_version: "6.0.0", token_compliance_ratio: 0.97 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_ios: $.data.id }
            - call: "POST /design-system/platform-implementations/${impl_ios}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/nav-ios-auto" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_ios}/accessibility-audits"
              payload: { method: "MANUAL", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/nav-ios-manual" }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/platform-implementations/${impl_ios}/ship"
              payload: { package_version: "6.0.0", token_compliance_ratio: 0.97 }
              as: ContributingTeam
              as_user_id: "${team_id}"
            - call: "POST /design-system/components/${cons_id}/promote-maturity"
              payload: { target_maturity_level: "BETA" }
              as: DesignSystemLead
              as_user_id: "lead-1"
            - call: "POST /design-system/components/${cons_id}/promote-maturity"
              payload: { target_maturity_level: "STABLE" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { cons_maturity_before: $.data.maturity_level, cons_coverage: $.data.coverage_state, cons_sweep: $.data.governance_conformance_score }
            - call: "POST /design-system/components/${cons_id}/dependencies"
              payload: { provider_component_id: "${prov_id}", pinned_provider_major: 1 }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { dep_id: $.data.id, dep_state_before: $.data.compatibility_state }
            - call: "POST /design-system/components/${prov_id}/deprecation-plans"
              payload: { announced_at: "2026-08-01T00:00:00.000Z", sunset_at: "2026-08-20T00:00:00.000Z", removal_at: "2026-09-25T00:00:00.000Z", migration_guide_url: "https://ds.example.com/migrate/icon-core" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_id: $.data.id }
            - call: "POST /design-system/deprecation-plans/${plan_id}/migration-guide"
              payload: { migration_guide_url: "https://ds.example.com/migrate/icon-core", publish: true }
              as: DesignSystemLead
              as_user_id: "lead-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/deprecation-plans/${plan_id}/advance"
              payload: {}
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_state_sunset: $.data.state, blocked_dependents: $.data.blocked_dependent_count }
            - call: "GET /design-system/components/${cons_id}"
              payload: {}
              as: DesignSystemLead
              captures: { cons_blocked_mid: $.data.blocked_dependency_count, cons_maturity_mid: $.data.maturity_level, cons_reason_mid: $.data.maturity_demotion_reason }
          trigger:
            - call: "POST /design-system/deprecation-plans/${plan_id}/rescind"
              payload: { reason: "The icon migration slipped a quarter; keeping icon-core active." }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_state_after: $.data.state, blocked_dependents_after: $.data.blocked_dependent_count, rescinded_at: $.data.rescinded_at }
          assert:
            - "${cons_maturity_before} == STABLE and ${cons_coverage} == PARTIAL and ${cons_sweep} == 100.00"
            - "${dep_state_before} == COMPATIBLE"
            - "${plan_state_sunset} == SUNSET and ${blocked_dependents} == 1"
            - "${cons_blocked_mid} == 1 and ${cons_maturity_mid} == BETA and ${cons_reason_mid} == UPSTREAM_SUNSET"
            - "HTTP status == 200"
            - "${plan_state_after} == RESCINDED and ${blocked_dependents_after} == 0 and ${rescinded_at} == 2026-08-20T00:00:00.000Z"
            - "ComponentDependency.${dep_id}.compatibility_state == COMPATIBLE (exactly the pre-sunset value)"
            - "Component.${cons_id}.blocked_dependency_count == 0 (the conserved dependency-block total, restored exactly)"
            - "Component.${prov_id}.lifecycle_state == ACTIVE"
            - "Component.${cons_id}.maturity_level == BETA and Component.${cons_id}.maturity_demotion_reason == UPSTREAM_SUNSET (deliberately NOT restored to STABLE)"
            - "PlatformImplementation.${impl_web}.status == SHIPPED and PlatformImplementation.${impl_ios}.status == SHIPPED and Team.${team_id}.blocked_implementation_count == 0"
