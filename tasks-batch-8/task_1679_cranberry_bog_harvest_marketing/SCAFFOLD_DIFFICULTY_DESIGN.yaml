scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: MemberQuota vs Pool payment)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quota_approved_estimate_vs_acreage_baseline
        grounds:
          - calculations.quota_base_barrels
          - entities.MemberQuota.fields.base_quota_barrels
          - entities.MemberQuota.fields.baseline_quota_barrels
        distinguishing_aspect: |
          For the same member/season/bog inputs, the approved_estimate variant
          (base_quota_barrels = 2300 from the APPROVED estimate) and the
          acreage_baseline variant (baseline_quota_barrels = 10 acres * 200 =
          2000) produce different quota numbers; this instance lives in the
          MemberQuota/yield domain, not the pool-payment domain.
        test_recipe:
          setup:
            - "Member M100 ACTIVE with one ACTIVE 10-acre bog"
            - "Season 2026 (window 2026-09-15..2026-11-15, baseline 200 bbl/acre) OPEN"
            - "Bog has an APPROVED YieldEstimate of 2300 barrels for the season"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/yield-estimates"
              payload: { bog_id: "${b1}", season_id: "${s1}", estimated_barrels: 2300 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { e1: "$.data.id" }
            - call: "POST /coop/yield-estimates/${e1}/transition"
              payload: { to: "APPROVED" }
              as: FieldOfficer
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
          trigger:
            - call: "GET /coop/quotas"
              payload: { member_id: "${m1}", season_id: "${s1}" }
              as: CoopAdmin
              captures: { q_base: "$.data[0].base_quota_barrels", q_base_line: "$.data[0].baseline_quota_barrels" }
          assert:
            - "MemberQuota[0].base_quota_barrels == 2300 (approved_estimate variant)"
            - "MemberQuota[0].baseline_quota_barrels == 2000 (acreage_baseline variant = 10 * 200)"
            - "base_quota_barrels != baseline_quota_barrels for identical underlying bog/season data"

      - name: delivery_provisional_advance_vs_final_settlement
        grounds:
          - calculations.pool_settlement_pricing
          - entities.Delivery.fields.advance_amount
          - entities.PatronageDistribution.fields.gross_amount
        distinguishing_aspect: |
          The same delivery (net 950, grade A, weighted 1045) is valued twice by
          two valid algorithms: the provisional advance variant (522.50 at the
          0.50 advance rate) and the final settlement variant (gross 1800.01 at
          the derived final rate 1.7225); the two money figures differ, and this
          instance lives in the Pool/payment domain, not the quota domain.
        test_recipe:
          setup:
            - "Member ACTIVE, 10-acre ACTIVE bog, season 2026 OPEN (no estimate; quota base 2000 via baseline fallback)"
            - "ReceivingStation capacity 5000; MAIN pool OPEN (advance rate 0.50, retain 0.20)"
            - "One delivery ACCEPTED: gross 1000, tare 50 (net 950), graded A (9/8.5/1.5), weighted 1045"
            - "MAIN pool CLOSED (season auto -> HARVEST_CLOSED), then settled with revenue 2000, costs 200"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "MAIN", provisional_advance_rate_per_barrel: 0.50, retain_pct: 0.20 }
              as: PoolManager
              captures: { p1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 1000 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
            - call: "POST /coop/deliveries/${d1}/receive"
              payload: { gross_barrels: 1000, tare_barrels: 50 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d1}/grade"
              payload: { color_score: 9.0, firmness_score: 8.5, foreign_matter_pct: 1.5 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d1}/accept"
              payload: {}
              as: PoolManager
            - call: "POST /coop/pools/${p1}/transition"
              payload: { to: "CLOSED" }
              as: PoolManager
            - call: "GET /coop/pools/${p1}"
              payload: {}
              as: PoolManager
              captures: { p1_v: "$.data.version" }
          trigger:
            - call: "POST /coop/pools/${p1}/settle"
              payload: { realized_revenue: 2000, operating_costs: 200, expected_pool_version: "${p1_v}" }
              as: PoolManager
              captures: { p_rate: "$.data.final_rate_per_weighted_barrel", p_resid: "$.data.coop_equity_residual" }
            - call: "GET /coop/distributions"
              payload: { pool_id: "${p1}" }
              as: PoolManager
              captures: { dist_gross: "$.data[0].gross_amount", dist_retain: "$.data[0].retain_amount", dist_cash: "$.data[0].cash_amount" }
          assert:
            - "Delivery.${d1}.advance_amount == 522.50 (provisional variant)"
            - "Pool.${p1}.final_rate_per_weighted_barrel == 1.7225"
            - "PatronageDistribution[0].gross_amount == 1800.01 (final variant, != 522.50 advance)"
            - "PatronageDistribution[0].retain_amount == 360.00"
            - "PatronageDistribution[0].cash_amount == 917.51"
            - "Pool.${p1}.coop_equity_residual == -0.01"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (mode (a) tiered branching vs mode (b) pinned rounding order)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: grade_tier_assignment_three_input_branching
        grounds:
          - calculations.delivery_grade_assignment
          - entities.Delivery.fields.grade
          - entities.Delivery.fields.premium_multiplier
        distinguishing_aspect: |
          Mode (a): a 3-input tiered branch — color 9.0/firmness 9.0 would be
          grade A, but foreign_matter_pct 3.0 (> 2.0 A-cap, <= 4.0 B-cap)
          forces the B branch, so the output (grade B, multiplier 1.00) depends
          on non-linear interaction of all three inputs, not on any single
          threshold.
        test_recipe:
          setup:
            - "Member ACTIVE, ACTIVE bog, season 2026 OPEN, station capacity 5000"
            - "Delivery RECEIVED with gross 200, tare 10 (net 190)"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 200 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
            - call: "POST /coop/deliveries/${d1}/receive"
              payload: { gross_barrels: 200, tare_barrels: 10 }
              as: StationOperator
              as_user_id: "${st1}"
          trigger:
            - call: "POST /coop/deliveries/${d1}/grade"
              payload: { color_score: 9.0, firmness_score: 9.0, foreign_matter_pct: 3.0 }
              as: StationOperator
              as_user_id: "${st1}"
              captures: { g_grade: "$.data.grade", g_mult: "$.data.premium_multiplier", g_weighted: "$.data.weighted_barrels" }
          assert:
            - "Delivery.${d1}.grade == \"B\" (A branch blocked by foreign_matter_pct 3.0 > 2.0 despite 9/9 scores)"
            - "Delivery.${d1}.premium_multiplier == 1.00"
            - "Delivery.${d1}.weighted_barrels == 190.00"
            - "Delivery.${d1}.status == GRADED"

      - name: pool_settlement_round_per_member_then_residual
        grounds:
          - calculations.pool_settlement_pricing
          - entities.Pool.fields.coop_equity_residual
          - entities.PatronageDistribution.fields.gross_amount
        distinguishing_aspect: |
          Mode (b): pinned nested rounding — final rate rounded to 4dp FIRST
          (1800/1845 -> 0.9756), then each member gross rounded to 2dp; the
          per-member-then-sum order yields grosses 1019.50 + 780.48 = 1799.98
          and a +0.02 coop_equity_residual, which sum-then-round would not
          produce; rounding order is part of the contract.
        test_recipe:
          setup:
            - "Members M1 (10-acre bog, APPROVED estimate 2300) and M2 (8-acre bog, APPROVED estimate 1500), both ACTIVE"
            - "Season 2026 OPEN; station capacity 10000; MAIN pool OPEN (rate 0.50, retain 0.20)"
            - "M1 delivery: gross 1000 tare 50 -> net 950, grade A -> weighted 1045, advance 522.50"
            - "M2 delivery: gross 840 tare 40 -> net 800, grade B (7.5/7.0/3.0) -> weighted 800, advance 400.00"
            - "MAIN pool CLOSED (season auto HARVEST_CLOSED)"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/members"
              payload: { member_code: "M200", full_name: "Bob Grower" }
              as: CoopAdmin
              captures: { m2: "$.data.id" }
            - call: "POST /coop/members/${m2}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/bogs"
              payload: { name: "South Bog", acres: 8, variety: "BEN_LEAR", sprinkler_demand_gpm: 400 }
              as: GrowerMember
              as_user_id: "${m2}"
              captures: { b2: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/yield-estimates"
              payload: { bog_id: "${b1}", season_id: "${s1}", estimated_barrels: 2300 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { e1: "$.data.id" }
            - call: "POST /coop/yield-estimates/${e1}/transition"
              payload: { to: "APPROVED" }
              as: FieldOfficer
            - call: "POST /coop/yield-estimates"
              payload: { bog_id: "${b2}", season_id: "${s1}", estimated_barrels: 1500 }
              as: GrowerMember
              as_user_id: "${m2}"
              captures: { e2: "$.data.id" }
            - call: "POST /coop/yield-estimates/${e2}/transition"
              payload: { to: "APPROVED" }
              as: FieldOfficer
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 10000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "MAIN", provisional_advance_rate_per_barrel: 0.50, retain_pct: 0.20 }
              as: PoolManager
              captures: { p1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 1000 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
            - call: "POST /coop/deliveries/${d1}/receive"
              payload: { gross_barrels: 1000, tare_barrels: 50 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d1}/grade"
              payload: { color_score: 9.0, firmness_score: 8.5, foreign_matter_pct: 1.5 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d1}/accept"
              payload: {}
              as: PoolManager
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b2}", receiving_station_id: "${st1}", scheduled_date: "2026-10-11", expected_barrels: 900 }
              as: GrowerMember
              as_user_id: "${m2}"
              captures: { d2: "$.data.id" }
            - call: "POST /coop/deliveries/${d2}/receive"
              payload: { gross_barrels: 840, tare_barrels: 40 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d2}/grade"
              payload: { color_score: 7.5, firmness_score: 7.0, foreign_matter_pct: 3.0 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d2}/accept"
              payload: {}
              as: PoolManager
            - call: "POST /coop/pools/${p1}/transition"
              payload: { to: "CLOSED" }
              as: PoolManager
            - call: "GET /coop/pools/${p1}"
              payload: {}
              as: PoolManager
              captures: { p1_v: "$.data.version" }
          trigger:
            - call: "POST /coop/pools/${p1}/settle"
              payload: { realized_revenue: 2000, operating_costs: 200, expected_pool_version: "${p1_v}" }
              as: PoolManager
              captures: { p_rate: "$.data.final_rate_per_weighted_barrel", p_resid: "$.data.coop_equity_residual" }
            - call: "GET /coop/distributions"
              payload: { pool_id: "${p1}", member_id: "${m1}" }
              as: PoolManager
              captures: { g1: "$.data[0].gross_amount", r1: "$.data[0].retain_amount", c1: "$.data[0].cash_amount" }
            - call: "GET /coop/distributions"
              payload: { pool_id: "${p1}", member_id: "${m2}" }
              as: PoolManager
              captures: { g2: "$.data[0].gross_amount", r2: "$.data[0].retain_amount", c2: "$.data[0].cash_amount" }
          assert:
            - "Pool.${p1}.final_rate_per_weighted_barrel == 0.9756 (round4(1800/1845))"
            - "M1 distribution: gross_amount == 1019.50, retain_amount == 203.90, cash_amount == 293.10"
            - "M2 distribution: gross_amount == 780.48, retain_amount == 156.10, cash_amount == 224.38"
            - "Pool.${p1}.coop_equity_residual == 0.02"
            - "1019.50 + 780.48 + 0.02 == 1800.00 (per-member rounding + residual conserves net_pool_value)"

  # ==========================================================================
  # Rule 3 — non_linear_state_machine (Delivery cycle vs Pool cycle)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: delivery_grade_dispute_regrade_cycle
        grounds:
          - state_machines.Delivery.GRADED_to_DISPUTED
          - state_machines.Delivery.DISPUTED_to_GRADED
          - entities.Delivery.fields.dispute_count
        distinguishing_aspect: |
          Delivery machine is cyclic: GRADED -> DISPUTED -> GRADED via a
          re-grade that replaces the scores; the second pass through GRADED
          carries grade B (not the original A) and dispute_count == 1. This
          instance is on Delivery; the sibling instance is on Pool.
        test_recipe:
          setup:
            - "Member ACTIVE, ACTIVE bog, season OPEN, station capacity 5000"
            - "Delivery RECEIVED (gross 200, tare 10, net 190) and graded A (9/9/1.0) -> GRADED"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 200 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
            - call: "POST /coop/deliveries/${d1}/receive"
              payload: { gross_barrels: 200, tare_barrels: 10 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d1}/grade"
              payload: { color_score: 9.0, firmness_score: 9.0, foreign_matter_pct: 1.0 }
              as: StationOperator
              as_user_id: "${st1}"
          trigger:
            - call: "POST /coop/deliveries/${d1}/dispute"
              payload: {}
              as: GrowerMember
              as_user_id: "${m1}"
            - call: "POST /coop/deliveries/${d1}/grade"
              payload: { color_score: 7.5, firmness_score: 7.0, foreign_matter_pct: 3.0 }
              as: StationOperator
              as_user_id: "${st1}"
              captures: { g_grade: "$.data.grade", g_status: "$.data.status", g_disputes: "$.data.dispute_count" }
          assert:
            - "Delivery.${d1}.status == GRADED after the loop (GRADED -> DISPUTED -> GRADED)"
            - "Delivery.${d1}.grade == \"B\" (re-grade replaced the original A)"
            - "Delivery.${d1}.dispute_count == 1"
            - "Delivery.${d1}.weighted_barrels == 190.00"

      - name: pool_close_reopen_cycle
        grounds:
          - state_machines.Pool.CLOSED_to_OPEN
          - state_machines.Pool.OPEN_to_CLOSED
          - state_machines.Season.HARVEST_CLOSED_to_OPEN
        distinguishing_aspect: |
          Pool machine is cyclic: OPEN -> CLOSED -> OPEN via reopen, which also
          cycles the Season (OPEN -> HARVEST_CLOSED -> OPEN) and unlocks quotas;
          after the cycle a pending delivery can still flow to ACCEPTED. This
          instance is on Pool/Season; the sibling instance is on Delivery.
        test_recipe:
          setup:
            - "Member ACTIVE, ACTIVE bog, season OPEN, station capacity 5000, MAIN pool OPEN"
            - "Delivery exists in SCHEDULED (does not block pool close)"
          setup_api_calls:
            - call: "POST /coop/members"
              payload: { member_code: "M100", full_name: "Alice Grower" }
              as: CoopAdmin
              captures: { m1: "$.data.id" }
            - call: "POST /coop/members/${m1}/transition"
              payload: { to: "ACTIVE" }
              as: CoopAdmin
            - call: "POST /coop/bogs"
              payload: { name: "North Bog", acres: 10, variety: "STEVENS", sprinkler_demand_gpm: 500 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { b1: "$.data.id" }
            - call: "POST /coop/seasons"
              payload: { year: 2026, harvest_window_start: "2026-09-15", harvest_window_end: "2026-11-15", baseline_barrels_per_acre: 200 }
              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "MAIN", provisional_advance_rate_per_barrel: 0.50, retain_pct: 0.20 }
              as: PoolManager
              captures: { p1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 200 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
          trigger:
            - call: "POST /coop/pools/${p1}/transition"
              payload: { to: "CLOSED" }
              as: PoolManager
            - call: "GET /coop/seasons/${s1}"
              payload: {}
              as: PoolManager
              captures: { s_closed: "$.data.status" }
            - call: "POST /coop/pools/${p1}/transition"
              payload: { to: "OPEN" }
              as: PoolManager
              captures: { p_status: "$.data.status" }
            - call: "GET /coop/seasons/${s1}"
