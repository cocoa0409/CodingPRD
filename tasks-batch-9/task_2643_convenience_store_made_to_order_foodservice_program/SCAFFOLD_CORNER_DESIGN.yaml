            - "GET /stores/${store_id}/readiness -> units_impaired_count == 1"
            - "GET /stores/${store_id}/readiness -> units_locked_out_count == 0"
            - "GET /holding-units/${unit_id}/temperature-logs?in_range=false -> total_count == 2"

      - name: hot_case_slots_used_reconciles_after_bake_topoff_and_full_discard
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Store.hot_case_slots_used
          - entities.Store.waste_cost_cents_mtd
          - state_machines.ProductionBatch
          - endpoints[POST /production-batches/{id}/bake]
          - endpoints[POST /production-batches/{id}/discard]
        distinguishing_aspect: |
          Store.hot_case_slots_used is a counter maintained by side effects on three different edges, and the
          cycle edge is the trap: PLANNED -> BAKING claims a slot, HOLDING -> BAKING (the top-off) must NOT
          claim a second one for a batch that already holds its slot, and only the write-off that drives
          remaining_qty and reserved_qty to zero releases it. A naive implementation that increments on every
          bake reports 3 slots used for 2 physical batches, and one that decrements on any discard releases a
          slot that still holds 15 pretzels. The waste ledger is reconciled over the same sequence.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; store WAWA-0101 with hot_case_slot_capacity 4"
            - "unit BC-1 banded 135..185 F with 3 slots; pretzel 199c retail / 40c food cost / hold 240 min"
            - "batch A planned in slot 1 with planned_qty 20; batch B planned in slot 2 with planned_qty 10"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id, slots0: $.data.hot_case_slots_used }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 20, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_a: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 2, planned_qty: 10, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_b: $.data.id }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { slots_planned: $.data.hot_case_slots_used }
          trigger:
            - call: "POST /production-batches/${batch_a}/bake"
              payload: {}
              as: KitchenAssociate
              captures: { a_baked: $.data.baked_qty, a_rem: $.data.remaining_qty }
            - call: "POST /production-batches/${batch_b}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { slots_after_bakes: $.data.hot_case_slots_used }
            - call: "POST /production-batches/${batch_a}/pull"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_a}/bake"
              payload: { additional_qty: 5 }
              as: KitchenAssociate
              captures: { a_baked2: $.data.baked_qty, a_rem2: $.data.remaining_qty, a_status2: $.data.status }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { slots_after_topoff: $.data.hot_case_slots_used }
            - call: "POST /production-batches/${batch_a}/pull"
              payload: {}
              as: KitchenAssociate
              captures: { a_v: $.data.version, a_expires: $.data.hold_expires_at }
            - call: "POST /production-batches/${batch_a}/discard"
              payload: { qty: 25, reason: "QUALITY_REJECT", expected_batch_version: "${a_v}" }
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { a_status3: $.data.status, a_rem3: $.data.remaining_qty, a_disc: $.data.discarded_qty }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { slots_after_discard: $.data.hot_case_slots_used, waste_mtd: $.data.waste_cost_cents_mtd }
          assert:
            - "${slots0} == 0"
            - "${slots_planned} == 0"
            - "${a_baked} == 20"
            - "${a_rem} == 20"
            - "${slots_after_bakes} == 2"
            - "${a_baked2} == 25"
            - "${a_rem2} == 25"
            - "${a_status2} == BAKING"
            - "${slots_after_topoff} == 2"
            - "${a_expires} == 2026-08-01T10:00:00Z"
            - "${a_status3} == DISCARDED"
            - "${a_rem3} == 0"
            - "${a_disc} == 25"
            - "${slots_after_discard} == 1"
            - "${waste_mtd} == 1000"
            - "ProductionBatch.${batch_b}.status == BAKING"
            - "GET /production-batches/${batch_a}/waste-logs -> total_count == 1"
            - "GET /stores/${store_id}/readiness -> retail_waste_exposure_cents == 4975"
            - "GET /stores/${store_id}/readiness -> food_cost_waste_cents_mtd == 1000"

      - name: production_batch_list_filters_by_status_then_paginates
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /production-batches]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          total_count must describe the FILTERED set, not the table: with five batches at one store, three of
          them PLANNED, the two pages of a status=PLANNED&limit=2 walk must report total_count 3 on both
          pages, has_more true then false, and return three distinct ids with no overlap and no omission. A
          common defect is counting all five while paginating three, which makes has_more lie on the second
          page. Filters also compose - holding_unit_id plus status narrows to one row - and a mutation
          between pages (baking a PLANNED batch) is immediately reflected in the next filtered count.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; store WAWA-0101 with hot_case_slot_capacity 4"
            - "units BC-1 and BC-2, each banded 135..185 F with 3 slots"
            - "five pretzel batches: BC-1 slots 1, 2, 3 and BC-2 slots 1, 2, created in that order"
            - "the BC-1 slot 1 batch and the BC-2 slot 1 batch have been baked, so exactly three remain PLANNED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_1: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-2", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_2: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_1}", slot_index: 1, planned_qty: 12, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { b1: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_1}", slot_index: 2, planned_qty: 12, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { b2: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_1}", slot_index: 3, planned_qty: 12, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { b3: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_2}", slot_index: 1, planned_qty: 12, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { b4: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_2}", slot_index: 2, planned_qty: 12, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { b5: $.data.id }
            - call: "POST /production-batches/${b1}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${b4}/bake"
              payload: {}
              as: KitchenAssociate
          trigger:
            - call: "GET /production-batches"
              payload: { store_id: "${store_id}" }
              as: StoreManager
              captures: { first_unfiltered: "$.data[0].id" }
            - call: "GET /production-batches"
              payload: { store_id: "${store_id}", status: "PLANNED", limit: 2, offset: 0 }
              as: StoreManager
              captures: { p1_first: "$.data[0].id", p1_second: "$.data[1].id" }
            - call: "GET /production-batches"
              payload: { store_id: "${store_id}", status: "PLANNED", limit: 2, offset: 2 }
              as: StoreManager
              captures: { p2_first: "$.data[0].id" }
            - call: "GET /production-batches"
              payload: { store_id: "${store_id}", status: "BAKING" }
              as: StoreManager
              captures: { baking_first: "$.data[0].id" }
            - call: "GET /production-batches"
              payload: { holding_unit_id: "${unit_2}", status: "PLANNED" }
              as: StoreManager
              captures: { u2_planned_first: "$.data[0].id" }
            - call: "POST /production-batches/${b2}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "GET /production-batches"
              payload: { store_id: "${store_id}", status: "PLANNED" }
              as: StoreManager
              captures: { after_first: "$.data[0].id" }
          assert:
            - "first trigger: total_count == 5, has_more == false, limit == 10, offset == 0, exactly 5 rows"
            - "second trigger: total_count == 3, has_more == true, exactly 2 rows"
            - "third trigger: total_count == 3, has_more == false, exactly 1 row"
            - "the ids {${p1_first}, ${p1_second}, ${p2_first}} are exactly {${b2}, ${b3}, ${b5}} with no overlap between the two pages"
            - "fourth trigger: total_count == 2, has_more == false, rows are ${b1} and ${b4}"
            - "fifth trigger: total_count == 1, has_more == false, ${u2_planned_first} == ${b5}"
            - "seventh trigger: total_count == 2, has_more == false, rows are ${b3} and ${b5}"
            - "${after_first} == ${b3}"
            - "GET /production-batches?store_id=${store_id}&status=PLANNED&offset=99 -> 0 rows, total_count == 3, has_more == false"
            - "GET /production-batches?store_id=${store_id}&limit=101 -> ERR_INVALID_REQUEST with HTTP status 400"
            - "Store.${store_id}.hot_case_slots_used == 3"

      - name: five_level_cascade_from_a_single_out_of_range_reading_corner
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.HoldingUnit.OPERATIONAL_to_IMPAIRED
        excluded_because:
          difficulty_instance: "transitive_cascade / out_of_range_temperature_log_cascades_five_levels_to_store_ledger"
          rationale: "That instance walks the full log -> unit -> batch -> waste-log -> store-ledger chain end to end from one request, which is exactly this layer's claim."

      - name: both_waste_and_points_variants_diverge_corner
        claim_type: dual_variant_calculation
        grounds:
          - calculations.waste_valuation.variants
          - calculations.loyalty_points_accrual.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / waste_valuation_food_cost_vs_retail_diverge_on_quality_discard"
          rationale: "Both variant pairs are covered there and in its sibling loyalty_points_provisional_vs_final_diverge_on_catering_fuel_combo, each asserting both variants and the delta on switch."

  # =========================================================================
  # Section 9 - Consistency Model. consistency_model is `immediate`, so every
  # derived value a write produces must already be present in that write's own
  # response body - no re-read, no lag.
  # =========================================================================
  - section: consistency_model
    instances:
      - name: place_response_carries_totals_promotion_tickets_and_points_at_once
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /orders/{id}/place]
          - calculations.order_total_assembly
          - calculations.promotion_discount
          - calculations.loyalty_points_accrual
        distinguishing_aspect: |
          Placement fans out into five subsystems - pricing, promotion selection, FEFO reservation, kitchen
          ticketing and loyalty accrual - and under an `immediate` model the single 200 response must already
          expose every order-level result: applied_promotion_id, promo_discount_cents 130, total_cents 1167,
          points_provisional 11, daypart_at_placement LUNCH and expected_ready_at 11:03:00Z. Nothing may
          require a follow-up read to become correct, and the sibling rows written in the same request (the
          per-line net amounts, the reserved batch counters, the account balance) must be readable at their
          final values with no delay. The two-line mix makes this sharp: 899 * 1000bp rounds half up to 90
          and 398 * 1000bp rounds half up to 40, so a per-order rounding shortcut yields 130 by luck on the
          total but 129 or 131 once the per-line nets are inspected.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store WAWA-0101 in LUNCH with a PUBLISHED LUNCH plan for 2026-08-01"
            - "hoagie HOAGIE-ITAL 899c SANDWICH prep 180s; pretzel PRETZEL-SOFT 199c PAR_BAKED_CASE"
            - "one HOLDING batch of 40 pretzels in BC-1 slot 1 (hold_expires_at 15:00:00Z)"
            - "promotion LUNCH10: DAYPART_BUNDLE, PCT_PER_LINE 1000bp, cap 100000, stacking_rank 1, valid in LUNCH only"
            - "loyalty account M-A at tier BASIC with points_balance 0"
            - "member order: 1 hoagie plus 2 pretzels, still DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T11:00:00Z" }
              as: KitchenAssociate
              captures: { batch_id: $.data.id }
            - call: "POST /production-batches/${batch_id}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_id}/pull"
              payload: {}
              as: KitchenAssociate
              captures: { b_expires: $.data.hold_expires_at }
            - call: "POST /promotion-rules"
              payload: { code: "LUNCH10", kind: "DAYPART_BUNDLE", discount_kind: "PCT_PER_LINE", discount_bp: 1000, max_discount_cents: 100000, valid_dayparts: ["LUNCH"], stacking_rank: 1 }
              as: ChainAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { member_code: "M-A", email: "a@example.com" }
              as: ChainAdmin
              captures: { mem_a: $.data.id, tier0: $.data.tier }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN", loyalty_account_id: "${mem_a}" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1 }
              as: StoreTerminal
              captures: { line_h: $.data.id, h_gross: $.data.line_gross_cents, h_net_draft: $.data.line_net_cents }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${pretzel_id}", qty: 2 }
              as: StoreTerminal
              captures: { line_p: $.data.id, p_gross: $.data.line_gross_cents, p_reserved_draft: $.data.reserved_qty }
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
              captures:
                sub: $.data.subtotal_gross_cents
                promo: $.data.promo_discount_cents
                applied: $.data.applied_promotion_id
                fee: $.data.service_fee_cents
                total: $.data.total_cents
                pts: $.data.points_provisional
                dp: $.data.daypart_at_placement
                eta: $.data.expected_ready_at
                ps: $.data.production_status
                ss: $.data.settlement_status
          assert:
            - "${tier0} == BASIC"
            - "${h_gross} == 899"
            - "${h_net_draft} == 0"
            - "${p_gross} == 398"
            - "${p_reserved_draft} == 0"
            - "${b_expires} == 2026-08-01T15:00:00Z"
            - "${sub} == 1297"
            - "${promo} == 130"
            - "${applied} == ${promo_id}"
            - "${fee} == 0"
            - "${total} == 1167"
            - "${pts} == 11"
            - "${dp} == LUNCH"
            - "${eta} == 2026-08-01T11:03:00Z"
            - "${ps} == PLACED"
            - "${ss} == UNPAID"
