# =============================================================================
# SCAFFOLD — Volunteer Home Repair Project Selection & Trade Coordination
# (Rebuilding Together affiliate operations)
# =============================================================================

scenario: |
  Volunteer Home Repair Project Selection & Trade Coordination (Rebuilding Together): homeowner application with income, ownership and occupancy verification prioritizing older adults, veterans and people with disabilities, home assessment identifying safety, accessibility and critical repair needs with scope and cost estimation, project selection against available funding, volunteer capacity and skilled trade requirements, national rebuilding day event planning with team leader assignment, material staging and sponsor participation, licensed trade coordination for electrical, plumbing and roofing work that volunteers cannot perform with permits, volunteer safety training, waivers and site supervision, corporate sponsor engagement with team building and funding commitments, post-project follow-up and warranty of repairs

domain_name: volunteer-home-repair
api_prefix: /rebuild

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_note: |
    Expert-plus calibration: difficulty comes from coupling density, not entity
    count — a finite funding pool (base budget + sponsor commitments) is
    reserved against priority-ranked project envelopes, a readiness posture
    derived from trade work orders and material staging gates every rebuild
    event, and two compensating cascades (funding withdrawal, contractor
    suspension) propagate four and three links deep respectively.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FundingCycle
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable cycle name, e.g. 'FY2027 Rebuilding Together'" }
      - { name: fiscal_year, type: integer, source: input, description: "Four-digit program year" }
      - { name: total_budget_cents, type: integer, source: input, description: "Base appropriation in cents before sponsor commitments; must be >= 0" }
      - { name: priority_mode, type: enum, source: input, default: "STANDARD", description: "Scoring variant selector; constraints: STANDARD | HAZARD_PRIORITY" }
      - { name: status, type: enum, source: system, description: "OPEN | SELECTION_OPEN | SEALED | CLOSED" }
      - { name: pool_cents, type: integer, source: computed, description: "total_budget_cents + sum of amount_cents over commitments with status IN {RECEIVED, ALLOCATED}" }
      - { name: reserved_cents, type: integer, source: computed, description: "Sum of reserved_balance_cents over all Projects of this cycle" }
      - { name: spent_cents, type: integer, source: computed, description: "Cumulative outflows: PAID work-order invoices + DELIVERED material-order totals + RESOLVED warranty payouts, net of material RETURNED refunds" }
      - { name: available_cents, type: integer, source: computed, description: "pool_cents - reserved_cents - spent_cents" }

  - name: SelectionRun
    parent: null
    common_fields: true
    fields:
      - { name: funding_cycle_id, type: string, source: input, description: "FK -> FundingCycle.id; cycle this run ranks and selects within" }
      - { name: status, type: enum, source: system, description: "COMPUTED | APPLIED | SUPERSEDED | DISCARDED" }
      - { name: priority_mode_snapshot, type: enum, source: system, description: "Cycle priority_mode frozen at run creation; constraints: STANDARD | HAZARD_PRIORITY" }
      - { name: ranked_application_ids, type: array, source: computed, description: "Eligible applications ordered priority_score DESC, then application created_at ASC" }
      - { name: selected_application_ids, type: array, source: computed, description: "Greedy first-fit subset of ranked_application_ids whose envelopes fit the remaining available_cents at apply time" }
      - { name: applied_at, type: datetime, source: system, description: "ISO8601 UTC timestamp of apply; null until APPLIED" }

  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Corporate sponsor legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: sponsor_tier, type: enum, source: input, default: "COMMUNITY", description: "Engagement tier; constraints: COMMUNITY | REGIONAL | NATIONAL" }

  - name: SponsorshipCommitment
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id" }
      - { name: funding_cycle_id, type: string, source: input, description: "FK -> FundingCycle.id" }
      - { name: amount_cents, type: integer, source: input, description: "Pledged funding in cents; must be > 0" }
      - { name: team_build_event_date, type: datetime, source: input, description: "Optional ISO date the sponsor's team-building day targets; null allowed" }
      - { name: status, type: enum, source: system, description: "PLEDGED | RECEIVED | ALLOCATED | WITHDRAWN" }
      - { name: received_at, type: datetime, source: system, description: "Timestamp funds were marked RECEIVED; null until then" }
      - { name: allocated_amount_cents, type: integer, source: computed, description: "Portion earmarked to selected projects by the waterfall; 0 until an apply allocates" }
      - { name: withdrawn_at, type: datetime, source: system, description: "Timestamp of withdrawal; null until WITHDRAWN" }

  - name: HomeownerApplication
    parent: null
    common_fields: true
    fields:
      - { name: funding_cycle_id, type: string, source: input, description: "FK -> FundingCycle.id; cycle the household applies to" }
      - { name: homeowner_name, type: string, source: input, description: "Primary applicant full name" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO date of birth of primary applicant" }
      - { name: household_size, type: integer, source: input, description: "Occupant count; must be between 1 and 8" }
      - { name: household_income_cents, type: integer, source: input, description: "Annual household income in cents; must be >= 0" }
      - { name: is_veteran, type: boolean, source: input, description: "True if any household member is a veteran" }
      - { name: has_disability, type: boolean, source: input, description: "True if any household member has a disability" }
      - { name: ownership_doc_provided, type: boolean, source: input, description: "True when deed/title documentation is on file" }
      - { name: occupancy_doc_provided, type: boolean, source: input, description: "True when primary-residence documentation is on file" }
      - { name: address, type: string, source: input, description: "Street address of the home" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_VERIFICATION | VERIFIED | REJECTED | ASSESSING | ASSESSED | CANDIDATE | SELECTED | DEFERRED | WITHDRAWN | FULFILLED" }
      - { name: is_older_adult, type: boolean, source: computed, description: "Age >= 62 computed from date_of_birth against the logical clock at creation (calendar birthday math, inclusive)" }
      - { name: priority_score, type: integer, source: computed, description: "applicant_priority_score output; computed at VERIFIED, recomputed when an assessment is SCOPED" }
      - { name: decision_reason, type: string, source: system, description: "Free-text reason recorded on REJECTED or staff DEFERRED; null otherwise" }

  - name: HomeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> HomeownerApplication.id" }
      - { name: scheduled_on, type: datetime, source: input, description: "ISO date the assessor visits; must be on/after the logical clock date" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | SCOPED | CANCELLED" }
      - { name: safety_hazard_max_severity, type: integer, source: input, description: "0..5 highest safety hazard severity observed; supplied at completion" }
      - { name: accessibility_needs_count, type: integer, source: input, description: "Count of distinct accessibility deficiencies; supplied at completion" }
      - { name: critical_systems_notes, type: string, source: input, description: "Free-text critical repair notes; optional at completion" }
      - { name: completed_on, type: datetime, source: system, description: "ISO date completion was recorded; null until COMPLETED" }

  - name: ScopeItem
    parent: null
    common_fields: false
    fields:
      - { name: assessment_id, type: string, source: system, description: "FK -> HomeAssessment.id; assessment whose completion recorded this item (amendment-added items join the project's assessment)" }
      - { name: category, type: enum, source: input, description: "SAFETY | ACCESSIBILITY | CRITICAL_SYSTEMS | ENERGY | GENERAL" }
      - { name: required_trade, type: enum, source: input, description: "NONE | CARPENTRY | ELECTRICAL | PLUMBING | ROOFING | HVAC" }
      - { name: volunteer_performable, type: boolean, source: input, description: "True when unlicensed volunteers may perform the work" }
      - { name: requires_permit, type: boolean, source: input, description: "True when the work legally requires a filed permit" }
      - { name: est_low_cents, type: integer, source: input, description: "Low estimate in cents; must be > 0" }
      - { name: est_high_cents, type: integer, source: input, description: "High estimate in cents; must be >= est_low_cents" }
      - { name: description, type: string, source: input, description: "Scope line description" }
      - { name: status, type: enum, source: system, description: "INCLUDED | DROPPED | COMPLETED" }
      - { name: midpoint_cents, type: integer, source: computed, description: "round_half_up((est_low_cents + est_high_cents) / 2)" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> HomeownerApplication.id; application this project was selected from" }
      - { name: funding_cycle_id, type: string, source: system, description: "FK -> FundingCycle.id; cycle whose pool funds this project" }
      - { name: status, type: enum, source: system, description: "PLANNING | READY | EVENT_SCHEDULED | IN_BUILD | COMPLETED | WARRANTY_ACTIVE | CLOSED | CANCELLED" }
      - { name: cancellation_reason, type: enum, source: system, description: "Null unless CANCELLED; FUNDING_WITHDRAWN | STAFF_DECISION | HOMEOWNER_WITHDRAWN" }
      - { name: readiness_posture, type: enum, source: computed, description: "READY iff every INCLUDED scope item with volunteer_performable=false is covered by a TradeWorkOrder in {SCHEDULED, IN_PROGRESS, PENDING_INSPECTION, INSPECTED, INVOICED, PAID} AND no MaterialOrder of the project is in {ORDERED, STAGED}; else BLOCKED" }
      - { name: provisional_estimate_cents, type: integer, source: computed, description: "project_cost_estimate PROVISIONAL variant over current INCLUDED scope items" }
      - { name: envelope_cents, type: integer, source: computed, description: "funding_envelope output: provisional estimate plus tiered contingency, frozen at selection, recomputed on scope amendment" }
      - { name: reserved_balance_cents, type: integer, source: computed, description: "Unreleased portion of envelope_cents still held against the cycle pool; decremented by PAID invoices and zeroed at COMPLETED/CANCELLED" }
      - { name: reconciled_cost_cents, type: integer, source: computed, description: "project_cost_estimate RECONCILED variant" }
      - { name: priority_score_snapshot, type: integer, source: system, description: "Application priority_score frozen at selection" }
      - { name: completed_on, type: datetime, source: system, description: "ISO date the project reached COMPLETED; null until then" }
      - { name: follow_up_completed_on, type: datetime, source: input, description: "ISO date of the 30-day post-project follow-up visit; setting it on a COMPLETED project opens the warranty period" }
      - { name: warranty_valid_until, type: datetime, source: computed, description: "completed_on + 12 calendar months, inclusive; null until COMPLETED" }

  - name: RebuildEvent
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; site hosting the build day" }
      - { name: name, type: string, source: input, description: "Event name, e.g. 'National Rebuilding Day — Alvarez Home'" }
      - { name: event_date, type: datetime, source: input, description: "ISO calendar date of the build day; must be on/after the logical clock date at creation" }
      - { name: max_volunteers, type: integer, source: input, description: "Site capacity; must be >= 1; the team leader occupies one slot" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | LOCKED | EXECUTED | CANCELLED" }
      - { name: open_slots, type: integer, source: computed, description: "max_volunteers - count of enrollments with status IN {ENROLLED, CONFIRMED, CHECKED_IN}" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: skills, type: array, source: input, default: [], description: "Trade skills from NONE | CARPENTRY | ELECTRICAL | PLUMBING | ROOFING | HVAC" }
      - { name: team_leader_eligible, type: boolean, source: input, default: false, description: "True when certified to supervise a site" }
      - { name: waiver_signed_on, type: datetime, source: input, description: "ISO date the liability waiver was signed; set via PATCH; null until signed" }
      - { name: safety_training_completed_on, type: datetime, source: input, description: "ISO date safety training was completed; set via PATCH by AffiliateStaff; null until completed" }
      - { name: status, type: enum, source: system, description: "REGISTERED | DEACTIVATED" }
      - { name: is_eligible, type: boolean, source: computed, description: "status == REGISTERED AND waiver_signed_on IS NOT NULL AND safety_training_completed_on IS NOT NULL AND safety_training_completed_on + 365 days >= logical clock date (inclusive)" }

  - name: EventEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> RebuildEvent.id" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: is_team_leader, type: boolean, source: input, default: false, description: "True when this enrollment carries site-supervision duty" }
      - { name: status, type: enum, source: system, description: "ENROLLED | CONFIRMED | CHECKED_IN | COMPLETED | NO_SHOW | WITHDRAWN" }

  - name: TradeContractor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Licensed firm name" }
      - { name: trade, type: enum, source: input, description: "CARPENTRY | ELECTRICAL | PLUMBING | ROOFING | HVAC" }
      - { name: license_number, type: string, source: input, description: "State license number" }
      - { name: license_expires_on, type: datetime, source: input, description: "ISO license expiry date; must be >= visit date for scheduled work" }
      - { name: insurance_expires_on, type: datetime, source: input, description: "ISO liability-insurance expiry date; must be >= visit date for scheduled work" }
      - { name: max_concurrent_jobs, type: integer, source: input, default: 1, description: "Maximum distinct work orders whose visit windows share one calendar day" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: strike_count, type: integer, source: system, description: "Failed inspections on record; auto-SUSPENDED at 3; reset to 0 on reinstate" }

  - name: TradeWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: contractor_id, type: string, source: input, description: "FK -> TradeContractor.id" }
      - { name: scope_item_ids, type: array, source: input, description: "Array of ScopeItem ids this order covers; all must be INCLUDED, volunteer_performable=false, share the contractor's trade, belong to the project's assessment, and not be covered by any other non-terminal work order" }
      - { name: trade, type: enum, source: system, description: "Copied from TradeContractor.trade at creation" }
      - { name: status, type: enum, source: system, description: "QUOTE_REQUESTED | QUOTED | APPROVED | SCHEDULED | IN_PROGRESS | PENDING_INSPECTION | INSPECTION_FAILED | INSPECTED | INVOICED | PAID | CANCELLED" }
      - { name: quote_cents, type: integer, source: input, description: "Contractor quote in cents; set via PATCH when moving to QUOTED; null until then" }
      - { name: invoice_cents, type: integer, source: input, description: "Final invoice in cents; set via PATCH when moving to INVOICED; null until then" }
      - { name: permit_number, type: string, source: input, description: "Filed permit number; required at APPROVED when any covered scope item requires_permit" }
      - { name: visit_start, type: datetime, source: input, description: "ISO8601 UTC visit window start; set by schedule endpoint" }
      - { name: visit_end, type: datetime, source: input, description: "ISO8601 UTC visit window end; strictly after visit_start" }
      - { name: inspected_on, type: datetime, source: system, description: "ISO date of the latest inspection; null until inspected" }
      - { name: cancellation_reason, type: string, source: system, description: "Free-text reason when CANCELLED; null otherwise" }

  - name: MaterialOrder
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: supplier, type: string, source: input, description: "Optional supplier name; null allowed" }
      - { name: lines, type: array, source: input, description: "Array of { item_name: string, quantity: integer >= 1, unit_price_dollars: number > 0 }; immutable after creation" }
      - { name: status, type: enum, source: system, description: "ORDERED | STAGED | DELIVERED | RETURNED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "material_order_total: per-line round_half_up(quantity * unit_price_dollars * 100), then summed" }
      - { name: delivery_fee_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * 0.035), computed on the rounded subtotal" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + delivery_fee_cents" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: description, type: string, source: input, description: "Defect description" }
      - { name: claim_amount_cents, type: integer, source: input, description: "Requested remedy cost in cents; must be > 0" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | RESOLVED" }
      - { name: payout_cents, type: integer, source: system, description: "Approved payout set at APPROVED; null until then" }
      - { name: submitted_on, type: datetime, source: system, description: "ISO date the claim was filed (logical clock date)" }
      - { name: resolution_note, type: string, source: input, description: "Free-text note recorded at RESOLVED or DENIED; null allowed" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FundingCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SELECTION_OPEN
        trigger: "PATCH /rebuild/funding-cycles/{id} with status=SELECTION_OPEN"
        actor: PlatformAdmin
        preconditions:
          - "Cycle is OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "increments FundingCycle.version by 1"

      - from: SELECTION_OPEN
        to: SEALED
        trigger: "PATCH /rebuild/funding-cycles/{id} with status=SEALED"
        actor: PlatformAdmin
        preconditions:
          - "Cycle is SELECTION_OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "Every COMPUTED SelectionRun of the cycle -> DISCARDED"
          - "Every HomeownerApplication of the cycle still in CANDIDATE -> DEFERRED with decision_reason 'CYCLE_SEALED'"
          - "increments FundingCycle.version by 1"

      - from: SEALED
        to: CLOSED
        trigger: "PATCH /rebuild/funding-cycles/{id} with status=CLOSED"
        actor: PlatformAdmin
        preconditions:
          - "Cycle is SEALED (ERR_INVALID_STATE)"
          - "Every Project of the cycle is in CLOSED or CANCELLED (ERR_INVALID_STATE)"
        side_effects:
          - "increments FundingCycle.version by 1"

  - entity: SelectionRun
    initial_state: COMPUTED
    terminal_states: [APPLIED, SUPERSEDED, DISCARDED]
    transitions:
      - from: null
        to: COMPUTED
        trigger: "POST /rebuild/funding-cycles/{id}/selection-runs (creation)"
        actor: AffiliateStaff
        preconditions:
          - "Cycle is SELECTION_OPEN (ERR_CYCLE_NOT_SELECTION_OPEN)"
          - "expected_funding_cycle_version matches cycle.version (ERR_STALE_VERSION)"
        side_effects:
          - "ranked_application_ids computed: all cycle applications in CANDIDATE, ordered priority_score DESC, tie-break application created_at ASC"
          - "Any previous SelectionRun of the cycle in COMPUTED -> SUPERSEDED"
          - "increments FundingCycle.version by 1"

      - from: COMPUTED
        to: APPLIED
        trigger: "POST /rebuild/selection-runs/{id}/apply"
        actor: AffiliateStaff
        preconditions:
          - "Run is COMPUTED (ERR_INVALID_STATE)"
          - "Cycle is SELECTION_OPEN (ERR_CYCLE_NOT_SELECTION_OPEN)"
        side_effects:
          - "Greedy first-fit in ranked order: select each application whose funding_envelope fits remaining available_cents, skipping those that do not fit and continuing"
          - "Each selected application -> SELECTED; a Project is created in PLANNING with envelope_cents, reserved_balance_cents = envelope_cents, priority_score_snapshot"
          - "Cycle reserved_cents increases by sum of created envelopes (funding_cycle_ledger)"
          - "sponsor_waterfall_allocation runs: base budget first, then RECEIVED commitments by received_at ASC then created_at ASC; each commitment with allocated_amount_cents > 0 -> ALLOCATED"
          - "increments FundingCycle.version by 1"

  - entity: SponsorshipCommitment
    initial_state: PLEDGED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PLEDGED
        to: RECEIVED
        trigger: "PATCH /rebuild/commitments/{id} with status=RECEIVED"
        actor: AffiliateStaff
        preconditions:
          - "Commitment is PLEDGED (ERR_INVALID_STATE)"
        side_effects:
          - "received_at stamped from logical clock; cycle pool_cents and available_cents increase by amount_cents (funding_cycle_ledger)"

      - from: RECEIVED
        to: ALLOCATED
        trigger: "system (sponsor_waterfall_allocation during selection-run apply)"
        actor: system
        preconditions:
          - "allocated_amount_cents > 0 assigned by the waterfall"
        side_effects:
          - "allocated_amount_cents recorded"

      - from: PLEDGED
        to: WITHDRAWN
        trigger: "PATCH /rebuild/commitments/{id} with status=WITHDRAWN"
        actor: AffiliateStaff
        preconditions:
          - "Commitment is PLEDGED (ERR_INVALID_STATE)"
        side_effects:
          - "withdrawn_at stamped; pool unchanged (PLEDGED funds never entered the pool)"

      - from: RECEIVED
        to: WITHDRAWN
        trigger: "PATCH /rebuild/commitments/{id} with status=WITHDRAWN"
        actor: AffiliateStaff
        preconditions:
          - "Commitment is RECEIVED (ERR_INVALID_STATE)"
        side_effects:
          - "withdrawn_at stamped; pool_cents and available_cents decrease by amount_cents"
          - "CASCADE link 1: funding_cycle_ledger recomputed for the cycle"
          - "CASCADE link 2: while reserved_cents > pool_cents - spent_cents, the lowest-priority cancellable Project (status IN {PLANNING, READY}; order priority_score_snapshot ASC, then Project.created_at DESC) -> CANCELLED with cancellation_reason FUNDING_WITHDRAWN until the invariant is restored"
          - "CASCADE link 3: each cancelled Project releases its reserved_balance_cents, its application -> DEFERRED with decision_reason 'FUNDING_WITHDRAWN', and every non-terminal RebuildEvent of the project -> CANCELLED"
          - "CASCADE link 4: every enrollment of a cascade-cancelled event in {ENROLLED, CONFIRMED, CHECKED_IN} -> WITHDRAWN"

      - from: ALLOCATED
        to: WITHDRAWN
        trigger: "PATCH /rebuild/commitments/{id} with status=WITHDRAWN"
        actor: AffiliateStaff
        preconditions:
          - "Commitment is ALLOCATED (ERR_INVALID_STATE)"
        side_effects:
          - "Same as RECEIVED -> WITHDRAWN, including the full four-link cascade; allocated_amount_cents returns to 0"

  - entity: HomeownerApplication
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN, FULFILLED]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /rebuild/applications (creation)"
        actor: Anonymous
        preconditions:
          - "funding_cycle_id references an existing FundingCycle (ERR_FUNDING_CYCLE_NOT_FOUND)"
        side_effects:
          - "is_older_adult computed from date_of_birth vs logical clock date (calendar birthday math; age >= 62 inclusive)"

      - from: SUBMITTED
        to: UNDER_VERIFICATION
        trigger: "PATCH /rebuild/applications/{id} with status=UNDER_VERIFICATION"
        actor: AffiliateStaff
        preconditions:
          - "Application is SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: UNDER_VERIFICATION
        to: VERIFIED
        trigger: "PATCH /rebuild/applications/{id} with status=VERIFIED"
        actor: AffiliateStaff
        preconditions:
          - "Application is UNDER_VERIFICATION (ERR_INVALID_STATE)"
          - "household_income_cents * 100 <= 80 * AMI_BY_HOUSEHOLD_SIZE[household_size] (ERR_INCOME_LIMIT_EXCEEDED)"
          - "ownership_doc_provided AND occupancy_doc_provided (ERR_VERIFICATION_INCOMPLETE)"
        side_effects:
          - "priority_score computed (applicant_priority_score with hazard bonus 0)"

      - from: UNDER_VERIFICATION
        to: REJECTED
        trigger: "PATCH /rebuild/applications/{id} with status=REJECTED plus decision_reason"
        actor: AffiliateStaff
        preconditions:
          - "Application is UNDER_VERIFICATION (ERR_INVALID_STATE)"
        side_effects:
          - "decision_reason recorded"

      - from: VERIFIED
        to: ASSESSING
        trigger: "system (POST /rebuild/assessments creates an assessment for this application)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSESSED
        to: ASSESSING
        trigger: "system (a new assessment is created while the application is ASSESSED — re-assessment loop)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ASSESSING
        to: ASSESSED
        trigger: "system (the application's latest HomeAssessment reaches SCOPED)"
        actor: system
        preconditions: []
        side_effects:
          - "priority_score recomputed, now including the hazard bonus from the SCOPED assessment when the cycle priority_mode is HAZARD_PRIORITY"

      - from: ASSESSED
        to: CANDIDATE
        trigger: "PATCH /rebuild/applications/{id} with status=CANDIDATE"
        actor: AffiliateStaff
        preconditions:
          - "Application is ASSESSED, which by construction means its latest assessment is SCOPED (ERR_INVALID_STATE)"
        side_effects: []

      - from: CANDIDATE
        to: DEFERRED
        trigger: "PATCH /rebuild/applications/{id} with status=DEFERRED, or system (cycle seal / funding-withdrawal cascade)"
        actor: AffiliateStaff
        preconditions:
          - "Application is CANDIDATE (ERR_INVALID_STATE)"
        side_effects:
          - "decision_reason recorded on staff action"

      - from: DEFERRED
        to: CANDIDATE
        trigger: "PATCH /rebuild/applications/{id} with status=CANDIDATE"
        actor: AffiliateStaff
        preconditions:
          - "Application is DEFERRED (ERR_INVALID_STATE)"
          - "Cycle is OPEN or SELECTION_OPEN (ERR_INVALID_STATE)"
        side_effects: []

      - from: CANDIDATE
        to: SELECTED
        trigger: "system (selection-run apply)"
        actor: system
        preconditions: []
        side_effects:
          - "Project created in PLANNING (see SelectionRun apply)"

      - from: SELECTED
        to: FULFILLED
        trigger: "system (the project's status reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "PATCH /rebuild/applications/{id} with status=WITHDRAWN"
        actor: AffiliateStaff
        preconditions: []
        side_effects: []

      - from: UNDER_VERIFICATION
        to: WITHDRAWN
        trigger: "PATCH /rebuild/applications/{id} with status=WITHDRAWN (staff, or Homeowner whose X-User-ID equals the application id)"
        actor: AffiliateStaff
        preconditions: []
        side_effects: []

      - from: VERIFIED
        to: WITHDRAWN
        trigger: "PATCH /rebuild/applications/{id} with status=WITHDRAWN (staff or owning Homeowner)"
        actor: AffiliateStaff
        preconditions: []
        side_effects: []

      - from: CANDIDATE
        to: WITHDRAWN
        trigger: "PATCH /rebuild/applications/{id} with status=WITHDRAWN (staff or owning Homeowner)"
        actor: AffiliateStaff
        preconditions: []
        side_effects: []

      - from: DEFERRED
        to: WITHDRAWN
        trigger: "PATCH /rebuild/applications/{id} with status=WITHDRAWN (staff or owning Homeowner)"
        actor: AffiliateStaff
        preconditions: []
        side_effects: []

      - from: SELECTED
        to: WITHDRAWN
        trigger: "PATCH /rebuild/applications/{id} with status=WITHDRAWN (staff or owning Homeowner)"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "The linked Project -> CANCELLED with cancellation_reason HOMEOWNER_WITHDRAWN (full project-cancel cascade: events cancelled, enrollments withdrawn, non-terminal work orders cancelled, reserved balance released)"

  - entity: HomeAssessment
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /rebuild/assessments (creation)"
        actor: AffiliateStaff
        preconditions:
          - "Application status IN {VERIFIED, ASSESSING, ASSESSED} (ERR_INVALID_STATE)"
          - "scheduled_on on/after the logical clock date (ERR_INVALID_DATE_RANGE)"
        side_effects:
          - "Application VERIFIED or ASSESSED -> ASSESSING"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /rebuild/assessments/{id}/complete with findings and scope_items"
        actor: Assessor
        preconditions:
          - "Assessment is SCHEDULED (ERR_INVALID_STATE)"
          - "scope_items non-empty; each est_high_cents >= est_low_cents; required_trade == NONE iff volunteer_performable is true (ERR_INVALID_REQUEST)"
        side_effects:
          - "ScopeItem records created in INCLUDED with midpoint_cents computed"
          - "completed_on stamped from logical clock"

      - from: COMPLETED
        to: SCOPED
        trigger: "PATCH /rebuild/assessments/{id} with status=SCOPED"
        actor: AffiliateStaff
        preconditions:
          - "Assessment is COMPLETED (ERR_INVALID_STATE)"
        side_effects:
          - "If this is the application's latest assessment, application ASSESSING -> ASSESSED and priority_score recomputed"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "PATCH /rebuild/assessments/{id} with status=CANCELLED"
        actor: AffiliateStaff
        preconditions:
          - "Assessment is SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: ScopeItem
    initial_state: INCLUDED
    terminal_states: [COMPLETED]
    transitions:
      - from: INCLUDED
        to: DROPPED
        trigger: "POST /rebuild/projects/{id}/scope-amendments naming the item in drop_item_ids"
        actor: AffiliateStaff
        preconditions:
          - "Item is INCLUDED (ERR_INVALID_STATE)"
          - "Item is not covered by a non-terminal TradeWorkOrder (ERR_SCOPE_ITEM_NOT_DROPPABLE)"
        side_effects:
          - "Project provisional_estimate_cents, envelope_cents recomputed; reserved_balance_cents adjusted by the envelope delta; ERR_ENVELOPE_EXCEEDED if the new envelope would push reserved above available headroom"

      - from: DROPPED
        to: INCLUDED
        trigger: "POST /rebuild/projects/{id}/scope-amendments naming the item in restore_item_ids"
        actor: AffiliateStaff
        preconditions:
          - "Item is DROPPED (ERR_INVALID_STATE)"
        side_effects:
          - "Same recomputation as drop"

      - from: INCLUDED
        to: COMPLETED
        trigger: "system (volunteer_performable item: its project's event reaches EXECUTED; licensed-trade item: covering work order reaches INSPECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Project readiness_posture and reconciled_cost_cents recomputed"

  - entity: Project
    initial_state: PLANNING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: null
        to: PLANNING
        trigger: "system (selection-run apply creates the project)"
        actor: system
        preconditions: []
        side_effects:
          - "envelope_cents computed via funding_envelope and frozen; reserved_balance_cents = envelope_cents; cycle reserved_cents += envelope_cents"

      - from: PLANNING
        to: READY
        trigger: "system (readiness_posture first computes READY)"
        actor: system
        preconditions: []
        side_effects: []

      - from: READY
        to: PLANNING
        trigger: "system (readiness_posture drops back to BLOCKED — work-order cancellation, contractor suspension cascade, or new material order)"
        actor: system
        preconditions: []
        side_effects: []

      - from: READY
        to: EVENT_SCHEDULED
        trigger: "system (a RebuildEvent of this project reaches LOCKED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EVENT_SCHEDULED
        to: READY
        trigger: "system (the locked event is CANCELLED while posture remains READY)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EVENT_SCHEDULED
        to: IN_BUILD
        trigger: "system (the locked event reaches EXECUTED, or any project work order reaches IN_PROGRESS — whichever first)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_BUILD
        to: COMPLETED
        trigger: "PATCH /rebuild/projects/{id} with status=COMPLETED"
        actor: AffiliateStaff
        preconditions:
          - "Project is IN_BUILD (ERR_INVALID_STATE)"
          - "Every scope item of the project's assessment is COMPLETED or DROPPED (ERR_INVALID_STATE)"
          - "Every TradeWorkOrder of the project is PAID or CANCELLED (ERR_INVALID_STATE)"
        side_effects:
          - "completed_on stamped from logical clock; warranty_valid_until = completed_on + 12 calendar months (inclusive)"
          - "reserved_balance_cents released to the cycle (cycle reserved_cents -= reserved_balance_cents; reserved_balance_cents -> 0)"
          - "Application SELECTED -> FULFILLED"
          - "reconciled_cost_cents finalized"

      - from: COMPLETED
        to: WARRANTY_ACTIVE
        trigger: "PATCH /rebuild/projects/{id} setting follow_up_completed_on"
        actor: AffiliateStaff
        preconditions:
          - "Project is COMPLETED (ERR_INVALID_STATE)"
          - "follow_up_completed_on >= completed_on (ERR_INVALID_DATE_RANGE)"
        side_effects: []

      - from: WARRANTY_ACTIVE
        to: CLOSED
        trigger: "PATCH /rebuild/projects/{id} with status=CLOSED"
        actor: AffiliateStaff
        preconditions:
          - "Project is WARRANTY_ACTIVE (ERR_INVALID_STATE)"
          - "Logical clock date is after warranty_valid_until (ERR_INVALID_STATE)"
          - "No WarrantyClaim of the project is in {SUBMITTED, APPROVED} (ERR_INVALID_STATE)"
        side_effects: []

      - from: PLANNING
        to: CANCELLED
        trigger: "PATCH /rebuild/projects/{id} with status=CANCELLED (staff), or system (funding-withdrawal / homeowner-withdrawal cascades)"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "reserved_balance_cents released to the cycle"
          - "Non-terminal RebuildEvents -> CANCELLED; their non-terminal enrollments -> WITHDRAWN"
          - "Non-terminal TradeWorkOrders -> CANCELLED"
          - "MaterialOrders in {ORDERED, STAGED} -> RETURNED"
          - "Application -> DEFERRED (reason FUNDING_WITHDRAWN or STAFF_DECISION) or WITHDRAWN (homeowner cascade)"

      - from: READY
        to: CANCELLED
        trigger: "same as PLANNING -> CANCELLED"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "same cascade as PLANNING -> CANCELLED"

      - from: EVENT_SCHEDULED
        to: CANCELLED
        trigger: "same as PLANNING -> CANCELLED"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "same cascade as PLANNING -> CANCELLED"

  - entity: RebuildEvent
    initial_state: DRAFT
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /rebuild/events (creation)"
        actor: AffiliateStaff
        preconditions:
          - "Project status IN {PLANNING, READY, EVENT_SCHEDULED} (ERR_INVALID_STATE)"
          - "event_date on/after the logical clock date (ERR_EVENT_DATE_PAST)"
          - "max_volunteers >= 1 (ERR_INVALID_REQUEST)"
        side_effects: []

      - from: DRAFT
        to: PUBLISHED
        trigger: "PATCH /rebuild/events/{id} with status=PUBLISHED"
        actor: AffiliateStaff
        preconditions:
          - "Event is DRAFT (ERR_INVALID_STATE)"
        side_effects: []

      - from: PUBLISHED
        to: LOCKED
        trigger: "PATCH /rebuild/events/{id} with status=LOCKED"
        actor: AffiliateStaff
        preconditions:
          - "Event is PUBLISHED (ERR_INVALID_STATE)"
          - "At least one enrollment of the event has is_team_leader = true and status IN {ENROLLED, CONFIRMED} (ERR_EVENT_NOT_LOCKABLE)"
          - "Project readiness_posture == READY (ERR_EVENT_NOT_LOCKABLE)"
        side_effects:
          - "Every ENROLLED enrollment of the event -> CONFIRMED"
          - "Project READY -> EVENT_SCHEDULED"

      - from: LOCKED
        to: EXECUTED
        trigger: "PATCH /rebuild/events/{id} with status=EXECUTED"
        actor: AffiliateStaff
        preconditions:
          - "Event is LOCKED (ERR_INVALID_STATE)"
          - "Logical clock date >= event_date (ERR_INVALID_STATE)"
        side_effects:
          - "Every CHECKED_IN enrollment -> COMPLETED; every CONFIRMED enrollment -> NO_SHOW"
          - "All INCLUDED volunteer_performable scope items of the project's assessment -> COMPLETED"
          - "Project EVENT_SCHEDULED -> IN_BUILD"

      - from: DRAFT
        to: CANCELLED
        trigger: "PATCH /rebuild/events/{id} with status=CANCELLED (staff or cascade)"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "Enrollments in {ENROLLED, CONFIRMED, CHECKED_IN} -> WITHDRAWN"

      - from: PUBLISHED
        to: CANCELLED
        trigger: "PATCH /rebuild/events/{id} with status=CANCELLED (staff or cascade)"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "Enrollments in {ENROLLED, CONFIRMED, CHECKED_IN} -> WITHDRAWN"

      - from: LOCKED
        to: CANCELLED
        trigger: "PATCH /rebuild/events/{id} with status=CANCELLED (staff or cascade)"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "Enrollments in {ENROLLED, CONFIRMED, CHECKED_IN} -> WITHDRAWN"
          - "Project EVENT_SCHEDULED -> READY if readiness_posture is still READY"

  - entity: Volunteer
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: null
        to: REGISTERED
        trigger: "POST /rebuild/volunteers (open registration)"
        actor: Anonymous
        preconditions: []
        side_effects: []

      - from: REGISTERED
        to: DEACTIVATED
        trigger: "PATCH /rebuild/volunteers/{id} with status=DEACTIVATED"
        actor: AffiliateStaff
        preconditions:
          - "Volunteer is REGISTERED (ERR_INVALID_STATE)"
        side_effects:
          - "Enrollments in {ENROLLED, CONFIRMED} on events in {PUBLISHED, LOCKED} -> WITHDRAWN"

      - from: DEACTIVATED
        to: REGISTERED
        trigger: "PATCH /rebuild/volunteers/{id} with status=REGISTERED"
        actor: AffiliateStaff
        preconditions:
          - "Volunteer is DEACTIVATED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: EventEnrollment
    initial_state: ENROLLED
    terminal_states: [COMPLETED, NO_SHOW]
    transitions:
      - from: null
        to: ENROLLED
        trigger: "POST /rebuild/enrollments (creation)"
        actor: Volunteer
        preconditions:
          - "Event is PUBLISHED (ERR_EVENT_NOT_PUBLISHED)"
          - "Volunteer is_eligible is true (ERR_VOLUNTEER_NOT_ELIGIBLE)"
          - "open_slots >= 1, i.e. active enrollment count < max_volunteers (ERR_EVENT_AT_CAPACITY)"
          - "No other enrollment of the same volunteer with status IN {ENROLLED, CONFIRMED, CHECKED_IN} exists on an event with the same event_date (ERR_VOLUNTEER_DOUBLE_BOOKED)"
          - "If is_team_leader: volunteer.team_leader_eligible (ERR_INVALID_REQUEST) and no other active team-leader enrollment on the event (ERR_TEAM_LEADER_ALREADY_ASSIGNED)"
          - "X-User-Role Volunteer may only enroll itself: volunteer_id == X-User-ID (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Event open_slots recomputed"

      - from: ENROLLED
        to: CONFIRMED
        trigger: "system (event reaches LOCKED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "PATCH /rebuild/enrollments/{id} with status=CHECKED_IN"
        actor: Volunteer
        preconditions:
          - "Enrollment is CONFIRMED (ERR_INVALID_STATE)"
          - "Logical clock date == event.event_date (ERR_INVALID_STATE)"
          - "Actor is AffiliateStaff, or a Volunteer whose X-User-ID matches the volunteer_id of a team-leader enrollment on the same event (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []

      - from: ENROLLED
        to: WITHDRAWN
        trigger: "PATCH /rebuild/enrollments/{id} with status=WITHDRAWN (owning volunteer or staff), or system cascade"
        actor: Volunteer
        preconditions: []
        side_effects:
          - "Event open_slots recomputed (slot released)"

      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "PATCH /rebuild/enrollments/{id} with status=WITHDRAWN (owning volunteer or staff), or system cascade"
        actor: Volunteer
        preconditions: []
        side_effects:
          - "Event open_slots recomputed"

      - from: WITHDRAWN
        to: ENROLLED
        trigger: "PATCH /rebuild/enrollments/{id} with status=ENROLLED"
        actor: Volunteer
        preconditions:
          - "Enrollment is WITHDRAWN (ERR_INVALID_STATE)"
          - "Event is PUBLISHED (ERR_EVENT_NOT_PUBLISHED)"
          - "Volunteer is_eligible (ERR_VOLUNTEER_NOT_ELIGIBLE)"
          - "open_slots >= 1 (ERR_EVENT_AT_CAPACITY)"
          - "Same-day double-booking check re-run (ERR_VOLUNTEER_DOUBLE_BOOKED)"
          - "Volunteer actor must own the enrollment (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Event open_slots recomputed"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "PATCH /rebuild/enrollments/{id} with status=NO_SHOW (staff), or system when the event EXECUTES while still CONFIRMED"
        actor: AffiliateStaff
        preconditions:
          - "Enrollment is CONFIRMED (ERR_INVALID_STATE)"
        side_effects: []

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (event reaches EXECUTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TradeContractor
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /rebuild/trade-contractors/{id} with status=SUSPENDED, or system when strike_count reaches 3"
        actor: PlatformAdmin
        preconditions:
          - "Contractor is ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE link 1: every work order of the contractor in {QUOTE_REQUESTED, QUOTED, APPROVED, SCHEDULED} -> CANCELLED with cancellation_reason 'CONTRACTOR_SUSPENDED'"
          - "CASCADE link 2: each affected project's readiness_posture recomputed; a project in READY whose posture drops to BLOCKED demotes to PLANNING; a project in EVENT_SCHEDULED whose posture drops stays EVENT_SCHEDULED but its events can no longer execute until re-ready (posture re-checked at EXECUTED)"
          - "increments TradeContractor.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /rebuild/trade-contractors/{id} with status=ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "Contractor is SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "strike_count reset to 0"
          - "increments TradeContractor.version by 1"

      - from: ACTIVE
        to: TERMINATED
        trigger: "PATCH /rebuild/trade-contractors/{id} with status=TERMINATED"
        actor: PlatformAdmin
        preconditions:
          - "Contractor is ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Same work-order cancellation cascade as suspension"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "PATCH /rebuild/trade-contractors/{id} with status=TERMINATED"
        actor: PlatformAdmin
        preconditions:
          - "Contractor is SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Same work-order cancellation cascade as suspension"

  - entity: TradeWorkOrder
    initial_state: QUOTE_REQUESTED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: null
        to: QUOTE_REQUESTED
        trigger: "POST /rebuild/trade-work-orders (creation)"
        actor: AffiliateStaff
        preconditions:
          - "Project status IN {PLANNING, READY} (ERR_INVALID_STATE)"
          - "Contractor exists and is ACTIVE (ERR_CONTRACTOR_NOT_QUALIFIED)"
          - "Every scope_item_id resolves to an INCLUDED scope item of the project's assessment (ERR_SCOPE_ITEM_NOT_FOUND / ERR_INVALID_STATE)"
          - "Every covered item has volunteer_performable = false and required_trade == contractor.trade (ERR_TRADE_MISMATCH)"
          - "No covered item is already covered by another work order not in {CANCELLED} (ERR_SCOPE_ITEM_ALREADY_COVERED)"
        side_effects:
          - "trade copied from contractor"
          - "Project readiness_posture recomputed"

      - from: QUOTE_REQUESTED
        to: QUOTED
        trigger: "PATCH /rebuild/trade-work-orders/{id} with status=QUOTED plus quote_cents"
        actor: TradePartner
        preconditions:
          - "Work order is QUOTE_REQUESTED (ERR_INVALID_STATE)"
          - "Actor's X-User-ID equals work order contractor_id (ERR_NOT_RESOURCE_OWNER)"
          - "quote_cents > 0 (ERR_INVALID_REQUEST)"
        side_effects: []

      - from: QUOTED
        to: APPROVED
        trigger: "PATCH /rebuild/trade-work-orders/{id} with status=APPROVED plus permit_number when required"
        actor: AffiliateStaff
        preconditions:
          - "Work order is QUOTED (ERR_INVALID_STATE)"
          - "If any covered scope item has requires_permit = true, permit_number must be present (ERR_PERMIT_REQUIRED)"
        side_effects: []

      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /rebuild/trade-work-orders/{id}/schedule"
        actor: AffiliateStaff
        preconditions:
          - "Work order is APPROVED (ERR_INVALID_STATE)"
          - "visit_end strictly after visit_start (ERR_INVALID_DATE_RANGE)"
          - "Contractor license_expires_on >= visit_start date AND insurance_expires_on >= visit_start date AND contractor is ACTIVE (ERR_CONTRACTOR_NOT_QUALIFIED)"
          - "Half-open overlap: no other work order of the same contractor in {SCHEDULED, IN_PROGRESS} with visit_start < new.visit_end AND other.visit_start < new.visit_end false (ERR_TRADE_WINDOW_CONFLICT); back-to-back windows where one visit_end equals the other visit_start are permitted"
          - "Day capacity: distinct work orders of the contractor in {SCHEDULED, IN_PROGRESS} sharing the calendar day of visit_start must be < max_concurrent_jobs (ERR_CONTRACTOR_DAY_CAPACITY)"
        side_effects:
          - "visit_start / visit_end recorded"
          - "Project readiness_posture recomputed; PLANNING -> READY may fire"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "PATCH /rebuild/trade-work-orders/{id} with status=IN_PROGRESS"
        actor: AffiliateStaff
        preconditions:
          - "Work order is SCHEDULED (ERR_INVALID_STATE)"
          - "Logical clock date >= visit_start date (ERR_INVALID_STATE)"
        side_effects:
          - "Project EVENT_SCHEDULED -> IN_BUILD if still EVENT_SCHEDULED"

      - from: IN_PROGRESS
        to: PENDING_INSPECTION
        trigger: "PATCH /rebuild/trade-work-orders/{id} with status=PENDING_INSPECTION"
        actor: AffiliateStaff
        preconditions:
          - "Work order is IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects: []

      - from: PENDING_INSPECTION
        to: INSPECTED
        trigger: "POST /rebuild/trade-work-orders/{id}/inspect with outcome=PASSED"
        actor: AffiliateStaff
        preconditions:
          - "Work order is PENDING_INSPECTION (ERR_INVALID_STATE)"
        side_effects:
          - "inspected_on stamped"
          - "Covered scope items -> COMPLETED"
          - "Project readiness_posture and reconciled_cost_cents recomputed"

      - from: PENDING_INSPECTION
        to: INSPECTION_FAILED
        trigger: "POST /rebuild/trade-work-orders/{id}/inspect with outcome=FAILED"
        actor: AffiliateStaff
        preconditions:
          - "Work order is PENDING_INSPECTION (ERR_INVALID_STATE)"
        side_effects:
          - "inspected_on stamped"
          - "CASCADE link 1: contractor strike_count += 1; when strike_count reaches 3 the contractor auto-transitions ACTIVE -> SUSPENDED"
          - "CASCADE link 2 (on auto-suspend): every work order of the contractor in {QUOTE_REQUESTED, QUOTED, APPROVED, SCHEDULED} -> CANCELLED with cancellation_reason 'CONTRACTOR_SUSPENDED'"
          - "CASCADE link 3 (on auto-suspend): each affected project's readiness_posture recomputed; READY projects that lose coverage demote to PLANNING"

      - from: INSPECTION_FAILED
        to: IN_PROGRESS
        trigger: "PATCH /rebuild/trade-work-orders/{id} with status=IN_PROGRESS (rework loop)"
        actor: AffiliateStaff
        preconditions:
          - "Work order is INSPECTION_FAILED (ERR_INVALID_STATE)"
          - "Contractor is ACTIVE (ERR_CONTRACTOR_NOT_QUALIFIED)"
        side_effects: []

      - from: INSPECTED
        to: INVOICED
        trigger: "PATCH /rebuild/trade-work-orders/{id} with status=INVOICED plus invoice_cents"
        actor: TradePartner
        preconditions:
          - "Work order is INSPECTED (ERR_INVALID_STATE)"
          - "Actor's X-User-ID equals work order contractor_id (ERR_NOT_RESOURCE_OWNER)"
          - "invoice_cents > 0 (ERR_INVALID_REQUEST)"
        side_effects: []

      - from: INVOICED
        to: PAID
        trigger: "PATCH /rebuild/trade-work-orders/{id} with status=PAID"
        actor: AffiliateStaff
        preconditions:
          - "Work order is INVOICED (ERR_INVALID_STATE)"
          - "invoice_cents <= project.reserved_balance_cents (ERR_ENVELOPE_EXCEEDED)"
        side_effects:
          - "Cycle spent_cents += invoice_cents; project reserved_balance_cents -= invoice_cents; cycle reserved_cents -= invoice_cents (funding_cycle_ledger)"
          - "Project reconciled_cost_cents recomputed"

      - from: QUOTE_REQUESTED
        to: CANCELLED
        trigger: "PATCH /rebuild/trade-work-orders/{id} with status=CANCELLED (staff or contractor-suspension cascade)"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "Project readiness_posture recomputed; READY may demote to PLANNING"

      - from: QUOTED
        to: CANCELLED
        trigger: "PATCH /rebuild/trade-work-orders/{id} with status=CANCELLED"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "Same posture recompute"

      - from: APPROVED
        to: CANCELLED
        trigger: "PATCH /rebuild/trade-work-orders/{id} with status=CANCELLED"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "Same posture recompute"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "PATCH /rebuild/trade-work-orders/{id} with status=CANCELLED"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "Same posture recompute"

  - entity: MaterialOrder
    initial_state: ORDERED
    terminal_states: [RETURNED]
    transitions:
      - from: null
        to: ORDERED
        trigger: "POST /rebuild/material-orders (creation)"
        actor: AffiliateStaff
        preconditions:
          - "Project status IN {PLANNING, READY, EVENT_SCHEDULED, IN_BUILD} (ERR_INVALID_STATE)"
          - "lines non-empty; every quantity >= 1 and unit_price_dollars > 0 (ERR_INVALID_REQUEST)"
          - "total_cents <= cycle available_cents (ERR_INSUFFICIENT_FUNDING)"
        side_effects:
          - "subtotal_cents, delivery_fee_cents, total_cents computed (material_order_total)"
          - "Project readiness_posture recomputed (a new ORDERED order can drop posture to BLOCKED and demote READY -> PLANNING)"

      - from: ORDERED
        to: STAGED
        trigger: "PATCH /rebuild/material-orders/{id} with status=STAGED"
        actor: AffiliateStaff
        preconditions:
          - "Order is ORDERED (ERR_INVALID_STATE)"
        side_effects: []

      - from: STAGED
        to: DELIVERED
        trigger: "PATCH /rebuild/material-orders/{id} with status=DELIVERED"
        actor: AffiliateStaff
        preconditions:
          - "Order is STAGED (ERR_INVALID_STATE)"
        side_effects:
          - "Cycle spent_cents += total_cents (funding_cycle_ledger)"
          - "Project readiness_posture recomputed; PLANNING -> READY may fire"

      - from: ORDERED
        to: RETURNED
        trigger: "PATCH /rebuild/material-orders/{id} with status=RETURNED (staff or project-cancel cascade)"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "Project readiness_posture recomputed"

      - from: STAGED
        to: RETURNED
        trigger: "PATCH /rebuild/material-orders/{id} with status=RETURNED"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "Project readiness_posture recomputed"

      - from: DELIVERED
        to: RETURNED
        trigger: "PATCH /rebuild/material-orders/{id} with status=RETURNED"
        actor: AffiliateStaff
        preconditions: []
        side_effects:
          - "Cycle spent_cents -= total_cents (refund; funding_cycle_ledger)"
          - "Project readiness_posture recomputed; READY may demote to PLANNING"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, RESOLVED]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /rebuild/warranty-claims (creation)"
        actor: Homeowner
        preconditions:
          - "Project status is WARRANTY_ACTIVE (ERR_PROJECT_NOT_COMPLETED)"
          - "Logical clock date <= project.warranty_valid_until (ERR_WARRANTY_EXPIRED)"
          - "Homeowner actor's X-User-ID equals the project's application_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "submitted_on stamped from logical clock"

      - from: SUBMITTED
        to: APPROVED
        trigger: "PATCH /rebuild/warranty-claims/{id} with status=APPROVED plus payout_cents"
        actor: AffiliateStaff
        preconditions:
          - "Claim is SUBMITTED (ERR_INVALID_STATE)"
          - "payout_cents > 0 and payout_cents <= claim_amount_cents (ERR_INVALID_REQUEST)"
          - "payout_cents <= warranty reserve remaining = min(round_half_up(0.08 * project.reconciled_cost_cents), WARRANTY_CAP_CENTS) - sum of payout_cents over the project's claims in {APPROVED, RESOLVED} (ERR_WARRANTY_CAP_EXCEEDED)"
        side_effects:
          - "payout_cents recorded"

      - from: SUBMITTED
        to: DENIED
        trigger: "PATCH /rebuild/warranty-claims/{id} with status=DENIED plus optional resolution_note"
        actor: AffiliateStaff
        preconditions:
          - "Claim is SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: APPROVED
        to: RESOLVED
        trigger: "PATCH /rebuild/warranty-claims/{id} with status=RESOLVED plus optional resolution_note"
        actor: AffiliateStaff
        preconditions:
          - "Claim is APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "Cycle spent_cents += payout_cents (funding_cycle_ledger)"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: selection-run-create-stale-cycle
    parent_entity: FundingCycle
    write_endpoint: "POST /rebuild/funding-cycles/{cycleId}/selection-runs"
    occ_field: expected_funding_cycle_version
    description: |
      Creating a SelectionRun against a FundingCycle whose version has advanced
      since the client last observed it is rejected. A second run legitimately
      supersedes a prior COMPUTED run, so the only deterministic rejection
      signal is the client's view of the cycle being stale; the server compares
      expected_funding_cycle_version to the current cycle.version and on
      success bumps cycle.version by 1.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: project-scope-amendment-stale-project
    parent_entity: Project
    write_endpoint: "POST /rebuild/projects/{projectId}/scope-amendments"
    occ_field: expected_project_version
    description: |
      Amending a Project's scope against a Project whose version has advanced
      since the client last observed it is rejected, because the amendment
      rebases the frozen envelope and reserved balance that other readers rely
      on; the server compares expected_project_version to the current
      project.version and on success bumps project.version by 1.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: household_income_check
    trigger: "PATCH /rebuild/applications/{id} with status=VERIFIED"
    algorithm: threshold
    formula: |
      All comparisons use integer cents — no floating point:
        ami_cents = AMI_BY_HOUSEHOLD_SIZE[household_size]
        eligible  <=>  household_income_cents * 100 <= INCOME_LIMIT_NUMERATOR * ami_cents
      (INCOME_LIMIT_NUMERATOR is 80, i.e. 80% of area median income, INCLUSIVE:
       income exactly equal to 80% of AMI passes; one cent above fails.)
      Tier selection for the priority multiplier (also integer-only):
        tier = TIER_DEEP   if income_cents * 100 <= 30 * ami_cents
               TIER_LOW    elif income_cents * 100 <= 50 * ami_cents
               TIER_STD    else (already known <= 80% by the eligibility check)
    input_set: "The single HomeownerApplication being verified"
    constants:
      INCOME_LIMIT_NUMERATOR: 80
      AMI_BY_HOUSEHOLD_SIZE: { 1: 5400000, 2: 6170000, 3: 6940000, 4: 7710000, 5: 8330000, 6: 8950000, 7: 9560000, 8: 10180000 }
    precision: "integer cents; ratios never materialized as floats"

  - name: applicant_priority_score
    trigger: "At VERIFIED (hazard term 0) and again when the application's latest assessment reaches SCOPED"
    algorithm: weighted_scoring
    formula: |
      base = OLDER_ADULT_POINTS * (1 if is_older_adult else 0)
           + VETERAN_POINTS * (1 if is_veteran else 0)
           + DISABILITY_POINTS * (1 if has_disability else 0)
      multiplier = 1.5 if tier == TIER_DEEP, 1.25 if TIER_LOW, 1.0 if TIER_STD
      hazard_bonus = 0 (STANDARD mode) — see variant below
      score = clamp(round_half_up(base * multiplier + hazard_bonus), 0, 100)
      Evaluation order is pinned: multiply first, add hazard bonus second,
      round third, clamp last.
    input_set: "The application being scored plus, for the HAZARD_PRIORITY variant, the safety_hazard_max_severity of its latest SCOPED assessment"
    constants:
      OLDER_ADULT_POINTS: 40
      VETERAN_POINTS: 25
      DISABILITY_POINTS: 30
      HAZARD_SEVERITY_POINTS: 10
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
    precision: "integer score, round_half_up before clamp"
    variants:
      - name: STANDARD
        when: "FundingCycle.priority_mode == STANDARD"
        difference: "hazard_bonus = 0; assessment severity never enters the score"
      - name: HAZARD_PRIORITY
        when: "FundingCycle.priority_mode == HAZARD_PRIORITY"
        difference: "hazard_bonus = HAZARD_SEVERITY_POINTS * safety_hazard_max_severity of the latest SCOPED assessment (0 while none is SCOPED), so identical household data scores differently under the two modes"

  - name: project_cost_estimate
    trigger: "Project creation, scope amendment, scope-item completion, work-order invoice/payment, material delivery/return"
    algorithm: aggregation
    formula: |
      Scope-item midpoint: midpoint_cents = round_half_up((est_low_cents + est_high_cents) / 2).
      Scope estimates are labor-inclusive for licensed-trade items and full-cost
      for volunteer-performable items; material orders are tracked separately
      and never enter the provisional estimate.
    input_set: "Scope items of the project's assessment with status INCLUDED (DROPPED and COMPLETED excluded from provisional; see variants)"
    constants: {}
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "Planning and selection (envelope basis)"
        difference: "sum of midpoint_cents over all INCLUDED scope items; actual invoices and material deliveries are ignored"
      - name: RECONCILED
        when: "Reporting during and after the build (reconciled_cost_cents)"
        difference: "sum of invoice_cents over the project's work orders in {INVOICED, PAID} + sum of midpoint_cents over volunteer_performable scope items in {INCLUDED, COMPLETED} not covered by any invoiced/paid work order + sum of total_cents over material orders in {DELIVERED}; provisional midpoints of trade-covered items are dropped once actual invoices exist"

  - name: funding_envelope
    trigger: "Project creation (frozen) and scope amendment (recomputed)"
    algorithm: threshold
    formula: |
      Circular-looking dependency pinned to a fixed evaluation order:
        1. est = provisional_estimate_cents (pre-contingency)
        2. rate = 0.15 if est < TIER1_MAX_CENTS
                  0.10 elif est < TIER2_MAX_CENTS
                  0.05 otherwise
           — the tier is keyed on est BEFORE contingency, never on the
             envelope itself; est == TIER1_MAX_CENTS exactly falls to 0.10.
        3. envelope_cents = round_half_up(est * (1 + rate))
    input_set: "The single project's provisional estimate"
    constants:
      TIER1_MAX_CENTS: 500000
      TIER2_MAX_CENTS: 2000000
    precision: "integer cents, round_half_up"

  - name: material_order_total
    trigger: "MaterialOrder creation"
    algorithm: aggregation
    formula: |
      Rounding order is pinned (per-line first, then sum, then fee):
        1. per line: line_cents = round_half_up(quantity * unit_price_dollars * 100)
        2. subtotal_cents = sum of line_cents
        3. delivery_fee_cents = round_half_up(subtotal_cents * DELIVERY_FEE_RATE)
        4. total_cents = subtotal_cents + delivery_fee_cents
      (Summing raw dollar amounts first and rounding once is a different,
       non-conforming algorithm and yields different cents on fractional
       inputs.)
    input_set: "The order's lines array"
    constants:
      DELIVERY_FEE_RATE: 0.035
    precision: "integer cents, round_half_up at steps 1 and 3"

  - name: funding_cycle_ledger
    trigger: "Commitment RECEIVED/WITHDRAWN; selection-run apply; work-order PAID; material DELIVERED/RETURNED; warranty RESOLVED; project COMPLETED/CANCELLED"
    algorithm: aggregation
    formula: |
      pool_cents      = total_budget_cents + sum(commitment.amount_cents where status IN {RECEIVED, ALLOCATED})
      reserved_cents  = sum(project.reserved_balance_cents) over all Projects of the cycle
      spent_cents     = sum(PAID work-order invoice_cents)
                      + sum(material total_cents where status == DELIVERED)
                      + sum(RESOLVED warranty payout_cents)
      available_cents = pool_cents - reserved_cents - spent_cents
      INVARIANT (compensating): available_cents == pool_cents - reserved_cents - spent_cents
      holds before and after every mutation; a selection (reserved += envelope)
      paired with its cancellation (reserved released) leaves available_cents
      unchanged, as does a material DELIVERED (+total) paired with RETURNED
      (-total) and an invoice PAID (reserved -> spent shift) with any later
      project completion (remainder released).
    input_set: "FundingCycle plus its commitments, projects, work orders, material orders, warranty claims"
    constants: {}
    precision: "integer cents"

  - name: event_capacity_fill
    trigger: "EventEnrollment creation, withdrawal, re-enrollment; event cascade"
    algorithm: threshold
    formula: |
      active_count = count of enrollments with status IN {ENROLLED, CONFIRMED, CHECKED_IN}
      open_slots   = max_volunteers - active_count
      Enrollment creation is rejected when active_count >= max_volunteers
      (boundary: the enrollment that makes active_count == max_volunteers
      SUCCEEDS; the next one fails). A team-leader enrollment occupies one
      slot exactly like any other.
      INVARIANT (compensating): max_volunteers == active_count + open_slots at
      all times; enroll (+1 active) paired with withdraw (-1 active) leaves
      open_slots unchanged.
    input_set: "Enrollments of the single event"
    constants: {}
    precision: "integer counts"

  - name: contractor_window_conflict
    trigger: "TradeWorkOrder schedule"
    algorithm: interval_merge
    formula: |
      Candidate set: other work orders of the SAME contractor with status IN
      {SCHEDULED, IN_PROGRESS}.
      Overlap test (HALF-OPEN intervals): conflict iff
        existing.visit_start < new.visit_end AND new.visit_start < existing.visit_end
      Adjacency is NOT a conflict: existing.visit_end == new.visit_start passes.
      Day-capacity test (separate rule, whole-calendar-day semantics): count of
      candidate work orders whose visit_start calendar day (UTC) equals the new
      visit_start calendar day must be < contractor.max_concurrent_jobs.
    input_set: "Work orders of the contractor in {SCHEDULED, IN_PROGRESS}"
    constants: {}
    precision: "ISO8601 UTC datetimes; day boundaries at 00:00:00Z"

  - name: sponsor_waterfall_allocation
    trigger: "SelectionRun apply"
    algorithm: waterfall_allocation
    formula: |
      need = sum of envelope_cents over projects created by this apply
      Sources consumed in pinned order: (1) cycle total_budget_cents first;
      (2) RECEIVED commitments by received_at ASC, tie-break created_at ASC.
      For each commitment in order:
        allocated_amount_cents = min(commitment.amount_cents, remaining_need)
        remaining_need -= allocated_amount_cents
        if allocated_amount_cents > 0: commitment -> ALLOCATED
      A partially allocated commitment keeps status ALLOCATED with the partial
      amount; its unallocated remainder stays in the pool.
    input_set: "Commitments of the cycle in RECEIVED at apply time; PLEDGED and WITHDRAWN excluded"
    constants: {}
    precision: "integer cents"

  - name: warranty_reserve
    trigger: "WarrantyClaim approval"
    algorithm: threshold
    formula: |
      reserve_cents = min(round_half_up(WARRANTY_RATE * project.reconciled_cost_cents), WARRANTY_CAP_CENTS)
      reserve_remaining = reserve_cents - sum(payout_cents over the project's claims in {APPROVED, RESOLVED})
      Approval requires payout_cents <= reserve_remaining (inclusive boundary:
      payout exactly equal to the remaining reserve succeeds).
      Claim timeliness: submitted_on <= project.warranty_valid_until, where
      warranty_valid_until = completed_on + 12 calendar months, INCLUSIVE —
      a claim filed exactly on the anniversary date is valid.
    input_set: "The project and its warranty claims"
    constants:
      WARRANTY_RATE: 0.08
      WARRANTY_CAP_CENTS: 250000
    precision: "integer cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The presented role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: auth
    check: "Entity-backed ownership: Homeowner X-User-ID equals the resource chain's application id; TradePartner equals work-order contractor_id; Volunteer equals enrollment volunteer_id (or team-leader of the same event for check-in); SponsorRep equals commitment sponsor_id. Role-specific field rules: Homeowner PATCH may only set status=WITHDRAWN; Volunteer PATCH on own record may only set waiver_signed_on; TradePartner PATCH may only set QUOTED (with quote_cents) or INVOICED (with invoice_cents)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints: GET/PATCH /applications/{id} (Homeowner), POST /enrollments, PATCH /enrollments/{id}, PATCH /volunteers/{id}, PATCH /trade-work-orders/{id}, POST /commitments (SponsorRep), POST /warranty-claims (Homeowner)"

  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right, then body FK references (funding_cycle_id, application_id, project_id, event_id, volunteer_id, contractor_id, sponsor_id, scope_item_ids elements). Concrete ids: ERR_FUNDING_CYCLE_NOT_FOUND, ERR_SELECTION_RUN_NOT_FOUND, ERR_SPONSOR_NOT_FOUND, ERR_COMMITMENT_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_SCOPE_ITEM_NOT_FOUND, ERR_PROJECT_NOT_FOUND, ERR_EVENT_NOT_FOUND, ERR_VOLUNTEER_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_CONTRACTOR_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND, ERR_MATERIAL_ORDER_NOT_FOUND, ERR_WARRANTY_CLAIM_NOT_FOUND"
    error_id: "ERR_{RESOURCE}_NOT_FOUND family (see check text for the 15 concrete ids)"
    http_status: 404
    applies_to: "all endpoints with path or body references"

  - priority: 5
    category: business_constraint
    check: "OCC: expected_funding_cycle_version / expected_project_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rebuild/funding-cycles/{id}/selection-runs, POST /rebuild/projects/{id}/scope-amendments"

  - priority: 6
    category: state
    check: "Target entity is in a from-state the transition allows (covers ERR_INVALID_STATE and the specific state errors ERR_CYCLE_NOT_SELECTION_OPEN, ERR_EVENT_NOT_PUBLISHED, ERR_EVENT_NOT_LOCKABLE, ERR_PROJECT_NOT_COMPLETED)"
    error_id: "ERR_INVALID_STATE or specific state error"
    http_status: 409
    applies_to: "all PATCH transition and action endpoints"

  - priority: 7
    category: business_safety
    check: "Volunteer eligibility (waiver signed AND safety training completed within 365 days inclusive AND status REGISTERED) for enrollment; team-leader flag requires team_leader_eligible"
    error_id: ERR_VOLUNTEER_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /rebuild/enrollments, PATCH /rebuild/enrollments/{id} re-enroll"

  - priority: 8
    category: business_safety
    check: "Contractor credentials: status ACTIVE and license_expires_on / insurance_expires_on on/after the visit date at schedule time; ACTIVE at work-order creation and rework"
    error_id: ERR_CONTRACTOR_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /rebuild/trade-work-orders, POST /rebuild/trade-work-orders/{id}/schedule, PATCH IN_PROGRESS rework"

  - priority: 9
    category: business_temporal
    check: "Temporal rules: event_date on/after clock (ERR_EVENT_DATE_PAST); visit_end strictly after visit_start and scheduled_on/follow_up dates sane (ERR_INVALID_DATE_RANGE); contractor half-open window overlap (ERR_TRADE_WINDOW_CONFLICT); volunteer same-calendar-day double booking (ERR_VOLUNTEER_DOUBLE_BOOKED); contractor per-day job count < max_concurrent_jobs (ERR_CONTRACTOR_DAY_CAPACITY); warranty filed by warranty_valid_until inclusive (ERR_WARRANTY_EXPIRED)"
    error_id: "ERR_EVENT_DATE_PAST | ERR_INVALID_DATE_RANGE | ERR_TRADE_WINDOW_CONFLICT | ERR_VOLUNTEER_DOUBLE_BOOKED | ERR_CONTRACTOR_DAY_CAPACITY | ERR_WARRANTY_EXPIRED"
    http_status: 422
    applies_to: "event/work-order/enrollment/warranty/assessment write endpoints"

  - priority: 10
    category: business_constraint
    check: "Constraint rules: event capacity open_slots >= 1 (ERR_EVENT_AT_CAPACITY); one active team leader per event (ERR_TEAM_LEADER_ALREADY_ASSIGNED); trade match and single-coverage of scope items (ERR_TRADE_MISMATCH, ERR_SCOPE_ITEM_ALREADY_COVERED); permit_number required when any covered item requires_permit (ERR_PERMIT_REQUIRED); covered items not droppable (ERR_SCOPE_ITEM_NOT_DROPPABLE); income within 80% AMI and docs on file at verification (ERR_INCOME_LIMIT_EXCEEDED, ERR_VERIFICATION_INCOMPLETE)"
    error_id: "ERR_EVENT_AT_CAPACITY | ERR_TEAM_LEADER_ALREADY_ASSIGNED | ERR_TRADE_MISMATCH | ERR_SCOPE_ITEM_ALREADY_COVERED | ERR_PERMIT_REQUIRED | ERR_SCOPE_ITEM_NOT_DROPPABLE | ERR_INCOME_LIMIT_EXCEEDED | ERR_VERIFICATION_INCOMPLETE"
    http_status: 409
    applies_to: "enrollment, work-order, amendment, verification endpoints"

  - priority: 11
    category: business_fiscal
    check: "Fiscal rules, always last: material order total within available (ERR_INSUFFICIENT_FUNDING); amendment envelope delta within available headroom (ERR_ENVELOPE_EXCEEDED); invoice within project reserved_balance (ERR_ENVELOPE_EXCEEDED); warranty payout within reserve remaining (ERR_WARRANTY_CAP_EXCEEDED)"
    error_id: "ERR_INSUFFICIENT_FUNDING | ERR_ENVELOPE_EXCEEDED | ERR_WARRANTY_CAP_EXCEEDED"
    http_status: 402
    applies_to: "POST /rebuild/material-orders, POST scope-amendments, PATCH PAID, PATCH warranty APPROVED"

# =============================================================================
# §1.5 API Endpoint Table (57 endpoints)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- FundingCycle & SelectionRun ---
  - method: POST
    path: "/rebuild/funding-cycles"
    description: "Create a funding cycle (status OPEN, ledgers zeroed)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, fiscal_year, total_budget_cents, "priority_mode?"]
    output: FundingCycle
    side_effects: ["status OPEN, pool=total_budget, reserved=0, spent=0, available=total_budget"]

  - method: GET
    path: "/rebuild/funding-cycles/{cycleId}"
    description: "Get one funding cycle including computed ledger fields"
    roles: [Any]
    code: 200
    input: []
    output: FundingCycle
    side_effects: []

  - method: PATCH
    path: "/rebuild/funding-cycles/{cycleId}"
    description: "Drive cycle transitions: SELECTION_OPEN | SEALED | CLOSED"
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: FundingCycle
    side_effects: ["State transitions per FundingCycle machine; seal discards COMPUTED runs and defers unselected CANDIDATE applications; increments FundingCycle.version by 1"]

  - method: POST
    path: "/rebuild/funding-cycles/{cycleId}/selection-runs"
    description: "Create + compute a selection run (supersedes prior COMPUTED run). OCC-guarded."
    roles: [AffiliateStaff, PlatformAdmin]
    code: 201
    input: [expected_funding_cycle_version]
    output: SelectionRun
    side_effects: ["ranked_application_ids computed", "prior COMPUTED run -> SUPERSEDED", "increments FundingCycle.version by 1"]

  - method: GET
    path: "/rebuild/selection-runs"
    description: "List selection runs, filterable by cycle"
    roles: [Any]
    code: 200
    input: ["funding_cycle_id?", "limit?", "offset?"]
    output: "SelectionRun[]"
    side_effects: []

  - method: GET
    path: "/rebuild/selection-runs/{runId}"
    description: "Get one selection run with its ranking"
    roles: [Any]
    code: 200
    input: []
    output: SelectionRun
    side_effects: []

  - method: POST
    path: "/rebuild/selection-runs/{runId}/apply"
    description: "Apply a COMPUTED run: greedy first-fit selection, project creation, sponsor waterfall"
