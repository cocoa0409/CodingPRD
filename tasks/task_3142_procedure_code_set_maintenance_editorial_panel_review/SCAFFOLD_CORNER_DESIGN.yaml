            - "the returned http status is 412"

      - name: correct_expected_license_version_reserves_delivery
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[delivery-reserve-stale-license]
          - entities.LicensingAgreement.fields.version
          - entities.ContentDeliveryOrder.fields.delivery_status
        distinguishing_aspect: |
          The positive side of the same OCC rule: presenting the licence version
          read from the activation response reserves the delivery and advances
          the licence version by one.
        test_recipe:
          setup:
            - "One DistributionTerritory on the SITE method and one ACTIVE provider licence"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/distribution-territories"
              payload: { territory_code: "US-APPALACHIA", method: "SITE", edi_payer_network: false, metadata_schema_version: "2026.1" }
              as: LicensingOfficer
