      - name: entry_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Entry.fields.wins, entities.Entry.fields.speaker_points_raw]
        distinguishing_aspect: "Client-supplied values for computed fields (wins, speaker_points_raw) in the create payload are ignored: the created entry reads wins == 0 and speaker_points_raw == 0."
        test_recipe:
          setup: ["tournament, division, school, registration open"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "CI", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
          trigger:
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One", wins: 99, speaker_points_raw: 99 }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e1: $.data.id } }
          assert:
            - "Entry.${e1}.wins == 0 and speaker_points_raw == 0 (client input for computed fields ignored)"
            - "Entry.${e1}.status == REGISTERED and version == 1"

      - name: judge_conflict_immutable_common_fields
        claim_type: immutability
        grounds: [entities.JudgeConflict]
        distinguishing_aspect: "JudgeConflict is declared common_fields: false — its read representation carries id and created_at only, with no version or updated_at fields."
        test_recipe:
          setup: ["tournament, school, one judge"]
          setup_api_calls:
