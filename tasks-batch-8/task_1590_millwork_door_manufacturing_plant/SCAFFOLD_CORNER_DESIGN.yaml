          setup: ["MAPLE/STAIN/SATIN order in FINISHING with one MACHINED opening; two booths batches B1 and B2 cured."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CT-1" }, as: PlantManager, captures: { proj_id: $.data.id } }
