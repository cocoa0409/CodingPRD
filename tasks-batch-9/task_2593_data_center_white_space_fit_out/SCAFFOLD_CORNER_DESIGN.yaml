              payload: { rack_id: "${rack2_id}", busway_id: "${bw_a_id}", feed_side: "A", requested_kw: 40.00, breaker_amps: 100 }
              as: ElectricalContractor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 and ${err} == ERR_HALL_SPARE_CAPACITY_EXCEEDED (100.00 - 80.00 - 25.00 == -5.00)"
            - "Hall.${hall_id}.committed_kw == 40.00, commissioning_reserve_kw == 25.00 and spare_kw == 35.00"
            - "Busway.${bw_a_id}.committed_kw == 40.000 and feed_count == 1"
            - "GET /rack-feeds?rack_id=${rack2_id} returns 0 rows"

      - name: mop_schedule_notification_rule_applies_only_to_multi_tenant_halls
        claim_type: conditional_validation
        grounds:
          - validations[priority=37]
          - errors[ERR_TENANT_NOTIFICATION_INCOMPLETE]
          - entities.Hall.fields.tenant_mode
        distinguishing_aspect: "The notification rule is keyed on hall.tenant_mode: the same HIGH-risk busway MOP schedules with an empty tenant_notified_ids in SINGLE_TENANT hall CX56, but returns ERR_TENANT_NOTIFICATION_INCOMPLETE 422 in MULTI_TENANT hall CX57 whose cage-owning tenant is missing from the list."
