            - { call: "GET /conf/windows/${w}", as: SchoolAdmin, captures: { open_after_block: $.data.slots_open_count } }
            - { call: "POST /conf/slots/${s0}/unblock", payload: {}, as: Teacher, as_user_id: "${t1}", captures: { st2: $.data.status } }
            - { call: "GET /conf/windows/${w}", as: SchoolAdmin, captures: { open_after_unblock: $.data.slots_open_count } }
          assert:
            - "block: slot status BLOCKED; window.slots_open_count == 7"
            - "unblock: slot status OPEN (window PUBLISHED, so no promotion runs); slots_open_count == 8"

      - name: student_withdraw_cascade
        claim_type: side_effect_execution
        grounds: [state_machines.Student.ENROLLED_to_WITHDRAWN]
        distinguishing_aspect: "Withdrawal cancels the student's future CONFIRMED bookings (STUDENT_WITHDRAWN), withdraws WAITING entries, and cancels the REQUESTED interpreter request; slot reopens."
        test_recipe:
          setup: ["window BOOKING_OPEN; student st1 linked T1 with booking on slot 0 (interpreter_language es -> request r) and a WAITING entry for T1 is impossible (booking exists) so use second student st2 of same family with WAITING entry"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
