      - name: questionnaire_submit_by_a_foreign_candidate_is_not_resource_owner
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations[priority=6]
          - roles.Candidate.identity
          - state_machines.LateralQuestionnaire.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          The Candidate role is ENTITY_BACKED, so possessing the role is not the question —
          identity is. Candidate 2 holds a perfectly legal X-User-Role and the target
          questionnaire is in DRAFT with one ACTIVE entry, so every other rung would pass
          and the request would otherwise succeed; only the ownership comparison at rung 6
          can refuse it, and it must be 403 ERR_NOT_RESOURCE_OWNER rather than 404 (the
          resource is not hidden, it is simply not theirs). The rightful owner then submits
          the identical body successfully.
