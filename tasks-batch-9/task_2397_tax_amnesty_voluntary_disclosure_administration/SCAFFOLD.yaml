    input: ["reversal_reason"]
    output: Payment
    side_effects: ["status := REVERSED; reversal_reason := payload.reversal_reason", "every allocation entry is unwound: Installment.paid_cents decreases and PAID installments return to SCHEDULED", "agreement.unapplied_credit_cents -= unapplied_delta_cents; paid_total_cents decreases; payment_status recomputed; SETTLED returns fall back to ASSESSED or FILED", "recomputes AmnestyProgram.collected_cents", "increments Payment.version by 1 and VoluntaryDisclosureAgreement.version by 1"]
    roles: [ProgramAdministrator]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PAYMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PAYMENT_NOT_APPLIED, ERR_REVERSAL_BREAKS_DOWN_PAYMENT]

  # ------------------------------------------------------------ enforcement actions
  - method: POST
    path: /amnesty/enforcement-actions
    purpose: "Draft a post-program enforcement action with the escalated penalty for a non-participant"
    input: ["taxpayer_id", "program_id", "action_type", "base_tax_cents", "agreement_id?"]
    output: EnforcementAction
    side_effects: ["creates EnforcementAction in DRAFT with origin MANUAL and created_by_user_id := X-User-ID", "snapshots escalation_tier_applied, multiplier_applied and behavior_adjustment_applied and computes assessed_penalty_cents by post_program_penalty_assessment"]
    roles: [ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_TAXPAYER_NOT_FOUND, ERR_PROGRAM_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: GET
    path: /amnesty/enforcement-actions
    purpose: "List enforcement actions (FK reverse lookup for taxpayer_id, program_id and agreement_id)"
    input: ["taxpayer_id?", "program_id?", "agreement_id?", "status?", "origin?", "limit?", "offset?"]
    output: EnforcementAction[]
    side_effects: []
    roles: [ProgramAdministrator, DisclosureOfficer, ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_PAGINATION]
  - method: GET
    path: /amnesty/enforcement-actions/{id}
    purpose: "Read one enforcement action with its escalation snapshot"
    input: []
    output: EnforcementAction
    side_effects: []
    roles: [ProgramAdministrator, DisclosureOfficer, ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ENFORCEMENT_ACTION_NOT_FOUND]
  - method: POST
    path: /amnesty/enforcement-actions/{id}/issue
    purpose: "Issue a drafted enforcement action; a second auditor must sign"
    input: []
    output: EnforcementAction
    side_effects: ["status := ISSUED; issued_by_user_id := X-User-ID; issued_at := clock_now", "recomputes Taxpayer.open_enforcement_action_count and compliance_behavior_score", "increments EnforcementAction.version by 1"]
    roles: [ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ENFORCEMENT_ACTION_NOT_FOUND, ERR_ACTION_NOT_DRAFT, ERR_PROGRAM_NOT_CLOSED, ERR_SEGREGATION_OF_DUTIES]
  - method: POST
    path: /amnesty/enforcement-actions/{id}/abate
    purpose: "Abate an issued enforcement action and restore the taxpayer's behavior ledger"
    input: ["abatement_reason"]
    output: EnforcementAction
    side_effects: ["status := ABATED; abatement_reason := payload.abatement_reason", "recomputes Taxpayer.open_enforcement_action_count and compliance_behavior_score", "increments EnforcementAction.version by 1"]
    roles: [ComplianceAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ENFORCEMENT_ACTION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_ACTION_NOT_ISSUED]

  # ------------------------------------------------------------------- test clock
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Test-driving endpoint: set the deterministic logical clock that every temporal rule reads. The default clock value before any call is 2026-08-01T00:00:00Z."
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock used by every temporal validation, accrual and due-date computation; no business entity is modified"]
    roles: [ProgramAdministrator]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

