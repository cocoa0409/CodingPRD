scenario: |
  784. Stock-Media Contributor Platform (Shutterstock/Getty style): contributor onboarding & model/property release, upload & metadata/keyword, review/acceptance & similar-reject, license tier & royalty rate/level, download/earning & payout threshold, exclusivity, takedown/IP, tax form

domain_name: stock-media-contributor
api_prefix: "/"
# Flat topology: multiple top-level collections (/contributors, /assets, /downloads,
# /payouts, /takedowns, /reviews, /license-tiers). Root prefix; each endpoint path is absolute.

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  # flat: peer entities linked by FK references (Asset.contributor_id, Download.asset_id,
  # Payout.contributor_id); no deep parent/child nesting in URL paths.
  state_machine_shape: branching
  # branching: Asset forks IN_REVIEW->{ACCEPTED,REJECTED} with a REJECTED->SUBMITTED revision
  # loop; Download forks {AVAILABLE,REVERSED}; Takedown forks {UPHELD,DISMISSED}.
  relationship_patterns:
    - one_to_many          # Contributor 1:N Asset/TaxForm/ModelRelease/Payout/ExclusivityWindow/EarningAdjustment
    - cross_aggregate      # AssetReview.similar_to_asset_id crosses to a sibling Asset; Download.asset_id crosses aggregate
  role_model: peer_roles
  # peer_roles: Contributor owns creation; Reviewer owns acceptance; ComplianceOfficer owns
  # release/tax/takedown adjudication; FinanceAdmin owns tiers/sales/payouts/clock.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Contributor
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Public contributor name.
        constraints: non-empty, max 120 chars
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of tax residence; "US" is domestic, all others foreign.
        constraints: 2 uppercase letters
      - name: onboarding_status
        type: enum
        source: computed
        description: Lifecycle gate. PENDING until a TaxForm is VERIFIED, then ACTIVE; SUSPENDED when strike_count crosses SUSPEND_STRIKE_THRESHOLD.
        default: PENDING
        constraints: one of {PENDING, ACTIVE, SUSPENDED}
      - name: tax_form_status
        type: enum
        source: computed
        description: MISSING until a TaxForm is submitted; SUBMITTED while pending review; VERIFIED once a TaxForm is VERIFIED; REJECTED if the latest decided TaxForm was rejected.
        default: MISSING
        constraints: one of {MISSING, SUBMITTED, VERIFIED, REJECTED}
      - name: exclusivity
        type: enum
        source: computed
        description: EXCLUSIVE when an ExclusivityWindow with status ACTIVE covers the current logical clock (start_at <= now < end_at); otherwise NON_EXCLUSIVE. Read as a snapshot at download time.
        default: NON_EXCLUSIVE
        constraints: one of {NON_EXCLUSIVE, EXCLUSIVE}
      - name: royalty_level
        type: enum
        source: computed
        description: Career royalty tier derived from lifetime_earnings_cents by calculation contributor_royalty_level.
        default: BRONZE
        constraints: one of {BRONZE, SILVER, GOLD, PLATINUM}
      - name: lifetime_earnings_cents
        type: integer
        source: computed
        description: Conserved career-earnings ledger. Credited when a Download settles (PENDING->AVAILABLE) and by positive EarningAdjustment; debited when an AVAILABLE Download is REVERSED. Never counts PENDING or REVERSED downloads.
        default: 0
        constraints: ">= 0"
      - name: available_balance_cents
        type: integer
        source: computed
        description: Funds eligible for payout. Increased on Download settle and positive EarningAdjustment; decreased by AVAILABLE-Download reversal and by the gross of a REQUESTED/PROCESSING/PAID Payout.
        default: 0
        constraints: may be temporarily negative only via post-payout clawback
      - name: accepted_asset_count
        type: integer
        source: computed
        description: Count of this contributor's Assets currently in status ACCEPTED. Incremented on ACCEPT, decremented on TAKEN_DOWN.
        default: 0
        constraints: ">= 0"
      - name: strike_count
        type: integer
        source: computed
        description: Number of UPHELD TakedownRequests against this contributor's assets.
        default: 0
        constraints: ">= 0"

  - name: TaxForm
    parent: null
    common_fields: true
    fields:
      - name: contributor_id
        type: string
        source: input
        description: "FK -> Contributor.id; owner of this tax form."
      - name: form_type
        type: enum
        source: input
        description: W9 for US persons (0% treaty withholding); W8BEN for foreign persons (treaty_rate_pct or default foreign rate).
        constraints: one of {W9, W8BEN}
      - name: tax_id
        type: string
        source: input
        description: Opaque taxpayer identifier.
        constraints: non-empty
      - name: treaty_rate_pct
        type: number
        source: input
        description: Optional foreign withholding treaty rate for W8BEN; ignored for W9. When omitted for W8BEN, DEFAULT_FOREIGN_WITHHOLDING_PCT applies.
        default: null
        constraints: "0.00 <= treaty_rate_pct <= 0.30 when present"
      - name: status
        type: enum
        source: computed
        description: SUBMITTED on create; VERIFIED or REJECTED after ComplianceOfficer decision.
        default: SUBMITTED
        constraints: one of {SUBMITTED, VERIFIED, REJECTED}
      - name: reject_reason
        type: enum
        source: computed
        description: Populated when status is REJECTED.
        default: null
        constraints: one of {INVALID_ID, MISMATCH, INCOMPLETE}

  - name: ModelRelease
    parent: null
    common_fields: true
    fields:
      - name: contributor_id
        type: string
        source: input
        description: "FK -> Contributor.id; contributor who obtained this release."
      - name: release_type
        type: enum
        source: input
        description: MODEL (recognizable person) or PROPERTY (recognizable private property).
        constraints: one of {MODEL, PROPERTY}
      - name: releaser_name
        type: string
        source: input
        description: Name of the model or property owner who granted the release.
        constraints: non-empty
      - name: status
        type: enum
        source: computed
        description: PENDING on create; VERIFIED or REJECTED after ComplianceOfficer decision.
        default: PENDING
        constraints: one of {PENDING, VERIFIED, REJECTED}
      - name: reject_reason
        type: enum
        source: computed
        description: Populated when status is REJECTED.
        default: null
        constraints: one of {ILLEGIBLE, UNSIGNED, EXPIRED}

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - name: contributor_id
        type: string
        source: input
        description: "FK -> Contributor.id; the uploading contributor."
      - name: model_release_id
        type: string
        source: input
        description: "FK -> ModelRelease.id; required release for a recognizable subject. Null when requires_release is false."
        default: null
      - name: title
        type: string
        source: input
        description: Human-readable asset title.
        constraints: non-empty, max 200 chars
      - name: media_type
        type: enum
        source: input
        description: Media kind.
        constraints: one of {PHOTO, VIDEO, VECTOR}
      - name: content_category
        type: enum
        source: input
        description: COMMERCIAL (licensable for ads) or EDITORIAL (news/documentary). EDITORIAL adds EDITORIAL_BONUS_PCT to royalty rate.
        constraints: one of {COMMERCIAL, EDITORIAL}
      - name: keywords
        type: array
        source: input
        description: Search keyword strings.
        constraints: 1..50 items, each non-empty
      - name: perceptual_hash
        type: string
        source: input
        description: Fixed-length lowercase hex perceptual hash used for similar-reject Hamming comparison.
        constraints: 4..16 hex chars, even length; all compared assets share equal length
      - name: requires_release
        type: boolean
        source: input
        description: True when the asset shows a recognizable person/property and needs a VERIFIED ModelRelease before ACCEPT.
        default: false
      - name: status
        type: enum
        source: computed
        description: Review lifecycle.
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, IN_REVIEW, ACCEPTED, REJECTED, TAKEN_DOWN}
      - name: reject_reason
        type: enum
        source: computed
        description: Populated when status is REJECTED.
        default: null
        constraints: one of {QUALITY, SIMILAR, METADATA, MISSING_RELEASE}

  - name: AssetReview
    parent: null
    common_fields: false
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; the asset being adjudicated."
      - name: decision
        type: enum
        source: input
        description: ACCEPT or REJECT.
        constraints: one of {ACCEPT, REJECT}
      - name: reject_reason
        type: enum
        source: input
        description: Required when decision is REJECT.
        default: null
        constraints: one of {QUALITY, SIMILAR, METADATA, MISSING_RELEASE}
      - name: similar_to_asset_id
        type: string
        source: input
        description: "FK -> Asset.id; the earlier accepted asset a SIMILAR reject collides with. Required only when reject_reason is SIMILAR."
        default: null
      - name: reviewer_id
        type: string
        source: system
        description: Opaque X-User-ID of the deciding Reviewer.

  - name: LicenseTier
    parent: null
    common_fields: true
    fields:
      - name: code
        type: enum
        source: input
        description: Tier identifier; unique across LicenseTiers.
        constraints: one of {STANDARD, ENHANCED, EXTENDED, EDITORIAL}; unique
      - name: base_price_cents
        type: integer
        source: input
        description: Buyer sale price for a download at this tier; becomes Download.sale_price_cents.
        constraints: ">= 1"

  - name: Download
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; the licensed asset (must be ACCEPTED at download time)."
      - name: license_tier_code
        type: enum
        source: input
        description: Selected LicenseTier code.
        constraints: one of {STANDARD, ENHANCED, EXTENDED, EDITORIAL}
      - name: buyer_reference
        type: string
        source: input
        description: Opaque buyer/order reference.
        constraints: non-empty
      - name: sale_price_cents
        type: integer
        source: computed
        description: Snapshot of the selected LicenseTier.base_price_cents at download time.
      - name: royalty_rate_snapshot_pct
        type: number
        source: computed
        description: Contributor royalty rate locked at download time by calculation royalty_rate_selection (uses exclusivity and royalty_level as they were at that instant).
      - name: royalty_amount_cents
        type: integer
        source: computed
        description: Locked contributor earning = round_half_up(sale_price_cents * royalty_rate_snapshot_pct). Never re-derived after creation.
      - name: earning_status
        type: enum
        source: computed
        description: PENDING at creation; AVAILABLE after settle once clock >= available_at; REVERSED on chargeback.
        default: PENDING
        constraints: one of {PENDING, AVAILABLE, REVERSED}
      - name: available_at
        type: datetime
        source: computed
        description: created_at + CLEARING_DAYS; earliest instant the earning may settle.

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: contributor_id
        type: string
        source: input
        description: "FK -> Contributor.id; payee."
      - name: gross_amount_cents
        type: integer
        source: computed
        description: Snapshot of contributor.available_balance_cents at request time.
      - name: withholding_cents
        type: integer
        source: computed
        description: Per-line withholding over the AVAILABLE Download earnings composing the gross, by calculation payout_withholding.
      - name: net_amount_cents
        type: integer
        source: computed
        description: gross_amount_cents - withholding_cents.
      - name: status
        type: enum
        source: computed
        description: Payout lifecycle.
        default: REQUESTED
        constraints: one of {REQUESTED, PROCESSING, PAID, FAILED}

  - name: ExclusivityWindow
    parent: null
    common_fields: true
    fields:
      - name: contributor_id
        type: string
        source: input
        description: "FK -> Contributor.id; the exclusive contributor."
      - name: start_at
        type: datetime
        source: input
        description: Half-open window start (inclusive).
      - name: end_at
        type: datetime
        source: input
        description: Half-open window end (exclusive). Must be strictly after start_at.
      - name: status
        type: enum
        source: computed
        description: ACTIVE on create; only ACTIVE windows count for overlap and for the exclusivity flag.
        default: ACTIVE
        constraints: one of {ACTIVE, CANCELLED}

  - name: EarningAdjustment
    parent: null
    common_fields: true
    fields:
      - name: contributor_id
        type: string
        source: input
        description: "FK -> Contributor.id; credited contributor."
      - name: amount_cents
        type: integer
        source: input
        description: Positive credit added to lifetime_earnings_cents and available_balance_cents (e.g. bonus or correction). Not subject to payout withholding.
        constraints: ">= 1"
      - name: reason
        type: string
        source: input
        description: Free-text justification.
        constraints: non-empty

  - name: TakedownRequest
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; the challenged asset."
      - name: claim_type
        type: enum
        source: input
        description: IP/legal basis of the claim.
        constraints: one of {COPYRIGHT, TRADEMARK, PRIVACY, MODEL_RELEASE}
      - name: claimant_name
        type: string
        source: input
        description: Name of the party asserting the claim.
        constraints: non-empty
      - name: hold_start
        type: datetime
        source: system
        description: Logical clock at filing; start of the closed legal-hold interval.
      - name: hold_end
        type: datetime
        source: system
        description: hold_start + TAKEDOWN_HOLD_DAYS; end of the closed legal-hold interval (inclusive).
      - name: status
        type: enum
        source: computed
        description: OPEN on filing; UPHELD or DISMISSED after ComplianceOfficer decision.
        default: OPEN
        constraints: one of {OPEN, UPHELD, DISMISSED}
      - name: resolution_note
        type: string
        source: computed
        description: Optional adjudication note stored on decision.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Contributor
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system: a TaxForm for this contributor transitions to VERIFIED (POST /tax-forms/{id}/decision decision=VERIFY)"
        actor: system
        preconditions: ["contributor.onboarding_status == PENDING"]
        side_effects:
          - "set contributor.tax_form_status = VERIFIED"
          - "increment contributor.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: a TakedownRequest against this contributor's asset is UPHELD and strike_count reaches SUSPEND_STRIKE_THRESHOLD"
        actor: system
        preconditions: ["contributor.strike_count >= 3 (SUSPEND_STRIKE_THRESHOLD)"]
        side_effects: ["increment contributor.version by 1"]
        note: strike_count is incremented by the takedown uphold side effect before this check.
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: strike_count later drops below SUSPEND_STRIKE_THRESHOLD via TakedownRequest reversal (not modeled as a public endpoint); reachable only if a future dismissal lowers strikes"
        actor: system
        preconditions: ["contributor.strike_count < 3"]
        side_effects: ["increment contributor.version by 1"]
        note: Documented for completeness; no §1.5 endpoint lowers strike_count, so SUSPENDED is effectively sticky.

  - entity: TaxForm
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /tax-forms/{id}/decision decision=VERIFY"
        actor: ComplianceOfficer
        preconditions: ["taxform.status == SUBMITTED"]
        side_effects:
          - "set contributor.tax_form_status = VERIFIED"
          - "if contributor.onboarding_status == PENDING then Contributor PENDING->ACTIVE"
          - "increment taxform.version and contributor.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tax-forms/{id}/decision decision=REJECT"
        actor: ComplianceOfficer
        preconditions: ["taxform.status == SUBMITTED", "reject_reason present"]
        side_effects:
          - "set taxform.reject_reason"
          - "set contributor.tax_form_status = REJECTED"
          - "increment taxform.version and contributor.version by 1"

  - entity: ModelRelease
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /model-releases/{id}/decision decision=VERIFY"
        actor: ComplianceOfficer
        preconditions: ["release.status == PENDING"]
        side_effects: ["increment release.version by 1"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /model-releases/{id}/decision decision=REJECT"
        actor: ComplianceOfficer
        preconditions: ["release.status == PENDING", "reject_reason present"]
        side_effects: ["set release.reject_reason", "increment release.version by 1"]

  - entity: Asset
    initial_state: DRAFT
    terminal_states: [TAKEN_DOWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /assets/{id}/submit"
        actor: Contributor
        preconditions:
          - "asset.status == DRAFT"
          - "keywords non-empty"
          - "if requires_release then model_release_id is set"
        side_effects: ["increment asset.version by 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /assets/{id}/submit (resubmit after fixing metadata)"
        actor: Contributor
        preconditions:
          - "asset.status == REJECTED"
          - "if requires_release then model_release_id is set"
        side_effects: ["clear asset.reject_reason", "increment asset.version by 1"]
        note: Revision loop — this is the cyclic edge of the Asset machine.
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /assets/{id}/claim"
        actor: Reviewer
        preconditions: ["asset.status == SUBMITTED"]
        side_effects: ["increment asset.version by 1"]
      - from: IN_REVIEW
        to: ACCEPTED
        trigger: "POST /assets/{id}/reviews decision=ACCEPT"
        actor: Reviewer
        preconditions:
          - "asset.status == IN_REVIEW"
          - "contributor.onboarding_status == ACTIVE  (cross-entity dependency)"
          - "if asset.requires_release then the referenced ModelRelease.status == VERIFIED  (cross-entity dependency)"
        side_effects:
          - "create AssetReview(decision=ACCEPT)"
          - "increment contributor.accepted_asset_count by 1"
          - "increment asset.version and contributor.version by 1"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /assets/{id}/reviews decision=REJECT"
        actor: Reviewer
        preconditions:
          - "asset.status == IN_REVIEW"
          - "reject_reason present"
          - "if reject_reason == SIMILAR then similar_to_asset_id references an ACCEPTED asset AND hamming(perceptual_hash) <= SIMILAR_MAX_DISTANCE"
        side_effects:
          - "create AssetReview(decision=REJECT, reject_reason, similar_to_asset_id?)"
          - "set asset.reject_reason"
          - "increment asset.version by 1"
        note: Divergent branch from ACCEPT — no accepted_asset_count change; SIMILAR sub-branch also records similar_to_asset_id.
      - from: ACCEPTED
        to: TAKEN_DOWN
        trigger: "system: a TakedownRequest for this asset is UPHELD (POST /takedowns/{id}/decision decision=UPHOLD)"
        actor: system
        preconditions: ["asset.status == ACCEPTED"]
        side_effects:
          - "decrement contributor.accepted_asset_count by 1"
          - "for each Download of this asset with earning_status in {PENDING, AVAILABLE}: Download -> REVERSED (cascade)"
          - "increment contributor.strike_count by 1"
          - "if contributor.strike_count >= SUSPEND_STRIKE_THRESHOLD then Contributor ACTIVE->SUSPENDED"
          - "increment asset.version and contributor.version by 1"

  - entity: Download
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: AVAILABLE
        trigger: "POST /downloads/{id}/settle"
        actor: FinanceAdmin
        preconditions:
          - "download.earning_status == PENDING"
          - "current logical clock >= download.available_at"
        side_effects:
          - "increment contributor.lifetime_earnings_cents by royalty_amount_cents"
          - "increment contributor.available_balance_cents by royalty_amount_cents"
          - "recompute contributor.royalty_level"
          - "increment download.version and contributor.version by 1"
      - from: PENDING
        to: REVERSED
        trigger: "POST /downloads/{id}/reverse (pre-clearing chargeback) OR cascade from Asset ACCEPTED->TAKEN_DOWN"
        actor: FinanceAdmin
        preconditions: ["download.earning_status == PENDING"]
        side_effects:
          - "no balance change (nothing was credited)"
          - "increment download.version by 1"
      - from: AVAILABLE
        to: REVERSED
        trigger: "POST /downloads/{id}/reverse (post-clearing chargeback/clawback) OR cascade from Asset ACCEPTED->TAKEN_DOWN"
        actor: FinanceAdmin
        preconditions: ["download.earning_status == AVAILABLE"]
        side_effects:
          - "decrement contributor.lifetime_earnings_cents by royalty_amount_cents"
          - "decrement contributor.available_balance_cents by royalty_amount_cents"
          - "recompute contributor.royalty_level"
          - "increment download.version and contributor.version by 1"
        note: Compensating action for the settle credit — conserves lifetime_earnings_cents.

  - entity: Payout
    initial_state: REQUESTED
    terminal_states: [PAID, FAILED]
    transitions:
      - from: REQUESTED
        to: PROCESSING
        trigger: "POST /payouts/{id}/process"
        actor: FinanceAdmin
        preconditions: ["payout.status == REQUESTED"]
        side_effects: ["increment payout.version by 1"]
      - from: PROCESSING
        to: PAID
        trigger: "POST /payouts/{id}/complete"
        actor: FinanceAdmin
        preconditions: ["payout.status == PROCESSING"]
        side_effects: ["increment payout.version by 1"]
        note: available_balance was already debited at REQUESTED; completion only confirms disbursement.
      - from: PROCESSING
        to: FAILED
        trigger: "POST /payouts/{id}/complete with settlement failure flag is out of scope; FAILED is set by the same endpoint's reject path"
        actor: FinanceAdmin
        preconditions: ["payout.status == PROCESSING"]
        side_effects:
          - "restore contributor.available_balance_cents by payout.gross_amount_cents"
          - "increment payout.version and contributor.version by 1"
        note: Compensating restore of the funds locked at REQUESTED. Reached via POST /payouts/{id}/complete when disbursement fails.

  - entity: TakedownRequest
    initial_state: OPEN
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /takedowns/{id}/decision decision=UPHOLD"
        actor: ComplianceOfficer
        preconditions: ["takedown.status == OPEN", "asset.status == ACCEPTED"]
        side_effects:
          - "Asset ACCEPTED->TAKEN_DOWN (triggers the full takedown cascade)"
          - "increment takedown.version by 1"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /takedowns/{id}/decision decision=DISMISS"
        actor: ComplianceOfficer
        preconditions: ["takedown.status == OPEN"]
        side_effects: ["set takedown.resolution_note", "increment takedown.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: payout-create-stale-contributor
    parent_entity: Contributor
    write_endpoint: "POST /contributors/{id}/payouts"
    occ_field: "expected_contributor_version"
    description: |
      Requesting a Payout against a Contributor whose version has advanced
      since the client last observed it is rejected. A payout legitimately
      drains the entire available_balance_cents; a second create whose view of
      the contributor is stale (a prior payout, settle, reversal, or adjustment
      has since mutated the contributor and bumped its version) is rejected on
      the stale-version check before any balance arithmetic runs.
    error_id: ERR_STALE_CONTRIBUTOR_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: royalty_rate_selection
    trigger: "POST /downloads (locks royalty_rate_snapshot_pct on the new Download)"
    algorithm: tiered_pricing
    formula: |
      base = ROYALTY_MATRIX[contributor.exclusivity][contributor.royalty_level]
      editorial_bonus = EDITORIAL_BONUS_PCT if asset.content_category == EDITORIAL else 0.00
      rate = min(RATE_CAP_PCT, base + editorial_bonus)
      # exclusivity and royalty_level are read as a SNAPSHOT at download time.
    input_set: "the single Download's asset, and that asset's contributor read at the instant of the POST /downloads call"
    constants:
      ROYALTY_MATRIX:
        NON_EXCLUSIVE: { BRONZE: 0.15, SILVER: 0.20, GOLD: 0.25, PLATINUM: 0.30 }
        EXCLUSIVE:     { BRONZE: 0.25, SILVER: 0.30, GOLD: 0.35, PLATINUM: 0.40 }
      EDITORIAL_BONUS_PCT: 0.05
      RATE_CAP_PCT: 0.45
    precision: "rate is an exact decimal; ≥3 inputs (exclusivity, royalty_level, content_category) with a conditional branch and a nested min cap"

  - name: royalty_amount
    trigger: "POST /downloads (provisional/at_download); referenced again for the at_current_level comparison variant"
    algorithm: aggregation
    formula: |
      sale_price_cents = LicenseTier[license_tier_code].base_price_cents
      royalty_amount_cents = round_half_up(sale_price_cents * royalty_rate_snapshot_pct)
    input_set: "one Download and its selected LicenseTier"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: at_download_snapshot
        when: "the persisted, authoritative value — rate is royalty_rate_snapshot_pct locked at download time"
        difference: "immune to later royalty_level or exclusivity changes; this value is never recomputed"
      - name: at_current_level
        when: "a naive re-derivation using the contributor's CURRENT exclusivity/royalty_level"
        difference: "diverges from at_download_snapshot whenever the contributor's level or exclusivity changed after the download; the system NEVER uses this variant"

  - name: contributor_royalty_level
    trigger: "recomputed whenever contributor.lifetime_earnings_cents changes (Download settle, Download reversal, EarningAdjustment)"
    algorithm: threshold
    formula: |
      L = contributor.lifetime_earnings_cents
      if   L <  LEVEL_SILVER_MIN:   BRONZE
      elif L <  LEVEL_GOLD_MIN:     SILVER      # LEVEL_SILVER_MIN <= L < LEVEL_GOLD_MIN
      elif L <  LEVEL_PLATINUM_MIN: GOLD
      else:                         PLATINUM
    input_set: "single contributor's lifetime_earnings_cents"
    constants:
      LEVEL_SILVER_MIN: 25000
      LEVEL_GOLD_MIN: 100000
      LEVEL_PLATINUM_MIN: 500000
    precision: "inclusive lower bound: exactly 25000 -> SILVER (>=), 24999 -> BRONZE"

  - name: payout_withholding
    trigger: "POST /contributors/{id}/payouts (computes withholding_cents and net_amount_cents on the new Payout)"
    algorithm: aggregation
    formula: |
      rate_w = withholding_rate(contributor)              # see variants
      # PINNED ORDER: withhold per contributing line, round each to a cent, THEN sum.
      lines = [ d for d in Downloads
                if d.asset.contributor_id == contributor.id
                and d.earning_status == AVAILABLE ]        # ordered by created_at ASC (order-independent for a sum)
      withholding_cents = sum( round_half_up(d.royalty_amount_cents * rate_w) for d in lines )
      gross_amount_cents = contributor.available_balance_cents
      net_amount_cents   = gross_amount_cents - withholding_cents
      # EarningAdjustment amounts are part of gross_amount_cents but are NOT withheld.
    input_set: "all Downloads of the contributor with earning_status == AVAILABLE at request time"
    constants:
      DEFAULT_FOREIGN_WITHHOLDING_PCT: 0.30
    precision: "integer cents, round_half_up applied PER LINE before summation (round-then-sum, NOT sum-then-round)"
    variants:
      - name: domestic_w9
        when: "contributor's VERIFIED TaxForm.form_type == W9"
        difference: "rate_w = 0.00 -> withholding_cents = 0, net == gross"
      - name: foreign_w8ben
        when: "contributor's VERIFIED TaxForm.form_type == W8BEN"
        difference: "rate_w = treaty_rate_pct if present else DEFAULT_FOREIGN_WITHHOLDING_PCT (0.30)"

  - name: payout_settlement_amount
    trigger: "POST /contributors/{id}/payouts (dual-variant view of the Payout total)"
    algorithm: aggregation
    formula: |
      provisional_gross = contributor.available_balance_cents
      final_net         = provisional_gross - payout_withholding.withholding_cents
    input_set: "one contributor's available balance and its AVAILABLE download lines"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional_gross
        when: "the amount the contributor requested / expects before deductions"
        difference: "equals available_balance_cents; ignores withholding"
      - name: final_net
        when: "the amount actually disbursed"
        difference: "gross minus per-line withholding; strictly less than gross for any foreign contributor with nonzero rate"

  - name: perceptual_hash_distance
    trigger: "POST /assets/{id}/reviews with reject_reason == SIMILAR"
    algorithm: threshold
    formula: |
      distance = popcount( int(asset.perceptual_hash, 16) XOR int(other.perceptual_hash, 16) )
      # a SIMILAR reject is only valid when distance <= SIMILAR_MAX_DISTANCE
      valid_similar = distance <= SIMILAR_MAX_DISTANCE
    input_set: "the reviewed asset and the asset referenced by similar_to_asset_id (both equal-length hex)"
    constants:
      SIMILAR_MAX_DISTANCE: 5
    precision: "integer bit count; boundary distance == 5 is SIMILAR (<=), distance == 6 is not"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /contributors"
  - priority: 2
    category: auth
    check: "the acting role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every resource named in the path exists, validated left-to-right; also FK bodies (asset_id, contributor_id, model_release_id, similar_to_asset_id, license_tier_code) resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK bodies"
  - priority: 4
    category: business_referential
    check: "a Contributor acting as entity_backed role owns the targeted resource (X-User-ID == resource.contributor_id, transitively via asset)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Contributor-role mutations on contributor-owned resources"
  - priority: 5
    category: state
    check: "OCC: expected_contributor_version equals the current Contributor.version"
    error_id: ERR_STALE_CONTRIBUTOR_VERSION
    http_status: 412
    applies_to: "POST /contributors/{id}/payouts"
  - priority: 6
    category: state
    check: "the target resource is in a state from which the requested transition is defined (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_safety
    check: "contributor.onboarding_status != SUSPENDED for asset submission and payout request"
    error_id: ERR_CONTRIBUTOR_SUSPENDED
    http_status: 403
    applies_to: "POST /assets/{id}/submit, POST /contributors/{id}/payouts"
  - priority: 8
    category: state
    check: "Asset ACCEPT requires its contributor.onboarding_status == ACTIVE"
    error_id: ERR_CONTRIBUTOR_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /assets/{id}/reviews (decision=ACCEPT)"
  - priority: 9
    category: business_referential
    check: "Asset ACCEPT with requires_release==true requires the referenced ModelRelease.status == VERIFIED"
    error_id: ERR_RELEASE_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /assets/{id}/reviews (decision=ACCEPT)"
  - priority: 10
    category: business_temporal
    check: "a new ExclusivityWindow must not overlap an ACTIVE window of the same contributor; half-open [start_at,end_at); touching endpoints allowed"
    error_id: ERR_EXCLUSIVITY_OVERLAP
    http_status: 409
    applies_to: "POST /contributors/{id}/exclusivity-windows"
  - priority: 11
    category: business_temporal
    check: "a new TakedownRequest must be at least TAKEDOWN_BUFFER_DAYS after the closed hold interval [hold_start,hold_end] of any prior UPHELD takedown on the same asset"
    error_id: ERR_TAKEDOWN_HOLD_CONFLICT
    http_status: 409
    applies_to: "POST /assets/{id}/takedowns"
  - priority: 12
    category: business_constraint
    check: "a SIMILAR reject requires perceptual_hash_distance <= SIMILAR_MAX_DISTANCE against similar_to_asset_id"
    error_id: ERR_NOT_SIMILAR_ENOUGH
    http_status: 422
    applies_to: "POST /assets/{id}/reviews (reject_reason=SIMILAR)"
  - priority: 13
    category: business_constraint
    check: "field types, enum membership, keyword/hash format, LicenseTier.code uniqueness, positive amounts, end_at > start_at"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all create/update endpoints"
  - priority: 14
    category: business_fiscal
    check: "payout gross (available_balance_cents) >= PAYOUT_THRESHOLD_CENTS"
    error_id: ERR_BELOW_PAYOUT_THRESHOLD
    http_status: 422
    applies_to: "POST /contributors/{id}/payouts"
  - priority: 15
    category: business_fiscal
    check: "settle requires current logical clock >= download.available_at"
    error_id: ERR_NOT_YET_CLEARED
    http_status: 409
    applies_to: "POST /downloads/{id}/settle"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/contributors"
    description: "Self-register a contributor (PENDING). X-User-ID of the response identifies the new Contributor."
    roles: [Contributor]
    code: 201
    input: [display_name, country_code]
    output: Contributor
    side_effects: ["create Contributor in PENDING with all computed defaults"]
  - method: GET
    path: "/contributors/{id}"
    description: "Read a contributor."
    roles: [Contributor, Reviewer, ComplianceOfficer, FinanceAdmin]
    code: 200
    input: []
    output: Contributor
    side_effects: []
  - method: GET
    path: "/contributors"
    description: "List contributors (paginated)."
    roles: [Contributor, Reviewer, ComplianceOfficer, FinanceAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Contributor[]
    side_effects: []
  - method: POST
    path: "/contributors/{id}/tax-forms"
    description: "Submit a tax form (SUBMITTED); sets contributor.tax_form_status=SUBMITTED."
    roles: [Contributor]
    code: 201
    input: ["form_type", "tax_id", "treaty_rate_pct?"]
    output: TaxForm
    side_effects: ["set contributor.tax_form_status = SUBMITTED", "increment contributor.version by 1"]
  - method: GET
    path: "/contributors/{id}/tax-forms"
    description: "List a contributor's tax forms (reverse lookup for TaxForm.contributor_id)."
    roles: [Contributor, ComplianceOfficer, FinanceAdmin]
    code: 200
    input: []
    output: TaxForm[]
    side_effects: []
  - method: POST
    path: "/tax-forms/{id}/decision"
    description: "Verify or reject a submitted tax form."
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "reject_reason?"]
    output: TaxForm
    side_effects: ["VERIFY: tax_form_status=VERIFIED and Contributor PENDING->ACTIVE if pending", "REJECT: set reject_reason, tax_form_status=REJECTED", "increment contributor.version by 1"]
  - method: POST
    path: "/contributors/{id}/model-releases"
    description: "Submit a model/property release (PENDING)."
    roles: [Contributor]
    code: 201
    input: [release_type, releaser_name]
    output: ModelRelease
    side_effects: []
  - method: GET
    path: "/contributors/{id}/model-releases"
    description: "List a contributor's model releases (reverse lookup for ModelRelease.contributor_id)."
    roles: [Contributor, ComplianceOfficer]
    code: 200
    input: []
    output: ModelRelease[]
    side_effects: []
  - method: POST
    path: "/model-releases/{id}/decision"
    description: "Verify or reject a pending model release."
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "reject_reason?"]
    output: ModelRelease
    side_effects: ["set release.status VERIFIED or REJECTED"]
  - method: POST
    path: "/contributors/{id}/exclusivity-windows"
    description: "Open a half-open exclusivity window; makes exclusivity EXCLUSIVE while the clock lies inside it."
    roles: [Contributor]
    code: 201
    input: [start_at, end_at]
    output: ExclusivityWindow
    side_effects: ["create ExclusivityWindow(status=ACTIVE)", "increment contributor.version by 1"]
  - method: GET
    path: "/contributors/{id}/exclusivity-windows"
    description: "List a contributor's exclusivity windows (reverse lookup for ExclusivityWindow.contributor_id)."
    roles: [Contributor, ComplianceOfficer, FinanceAdmin]
    code: 200
    input: []
    output: ExclusivityWindow[]
    side_effects: []
  - method: POST
    path: "/contributors/{id}/earning-adjustments"
    description: "Post a positive earnings credit (bonus/correction); credits lifetime and available balances and recomputes royalty_level."
    roles: [FinanceAdmin]
    code: 201
    input: [amount_cents, reason]
    output: EarningAdjustment
    side_effects: ["increment contributor.lifetime_earnings_cents and available_balance_cents by amount_cents", "recompute contributor.royalty_level", "increment contributor.version by 1"]
  - method: GET
    path: "/contributors/{id}/earning-adjustments"
    description: "List a contributor's earning adjustments (reverse lookup for EarningAdjustment.contributor_id)."
    roles: [Contributor, FinanceAdmin]
    code: 200
    input: []
    output: EarningAdjustment[]
    side_effects: []
  - method: POST
    path: "/contributors/{id}/payouts"
    description: "Request a payout of the full available balance. OCC-guarded on contributor.version."
    roles: [Contributor]
    code: 201
    input: [expected_contributor_version]
    output: Payout
    side_effects: ["snapshot gross_amount_cents=available_balance_cents", "compute withholding_cents, net_amount_cents", "debit available_balance_cents to 0", "increment contributor.version by 1"]
  - method: GET
    path: "/contributors/{id}/payouts"
    description: "List a contributor's payouts (reverse lookup for Payout.contributor_id)."
    roles: [Contributor, FinanceAdmin]
    code: 200
    input: []
    output: Payout[]
    side_effects: []
  - method: POST
    path: "/assets"
    description: "Create an asset in DRAFT."
    roles: [Contributor]
    code: 201
    input: ["contributor_id", "title", "media_type", "content_category", "keywords", "perceptual_hash", "requires_release?", "model_release_id?"]
    output: Asset
    side_effects: ["create Asset(status=DRAFT)"]
  - method: GET
    path: "/assets/{id}"
    description: "Read an asset."
    roles: [Contributor, Reviewer, ComplianceOfficer, FinanceAdmin]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: GET
    path: "/assets"
    description: "List/filter assets (reverse lookup for Asset.contributor_id and Asset.model_release_id)."
    roles: [Contributor, Reviewer, ComplianceOfficer, FinanceAdmin]
    code: 200
    input: ["contributor_id?", "model_release_id?", "status?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []
  - method: PATCH
    path: "/assets/{id}"
    description: "Edit metadata/keywords/hash while DRAFT or REJECTED."
    roles: [Contributor]
    code: 200
    input: ["title?", "keywords?", "perceptual_hash?"]
    output: Asset
    side_effects: ["increment asset.version by 1"]
  - method: POST
    path: "/assets/{id}/submit"
    description: "Submit or resubmit an asset for review (DRAFT/REJECTED -> SUBMITTED)."
    roles: [Contributor]
    code: 200
    input: []
    output: Asset
    side_effects: ["clear reject_reason on resubmit", "increment asset.version by 1"]
  - method: POST
    path: "/assets/{id}/claim"
    description: "Reviewer claims a submitted asset (SUBMITTED -> IN_REVIEW)."
    roles: [Reviewer]
    code: 200
    input: []
    output: Asset
    side_effects: ["increment asset.version by 1"]
  - method: POST
    path: "/assets/{id}/reviews"
    description: "Record an accept/reject decision (IN_REVIEW -> ACCEPTED/REJECTED)."
    roles: [Reviewer]
    code: 201
    input: ["decision", "reject_reason?", "similar_to_asset_id?"]
    output: AssetReview
    side_effects: ["ACCEPT: accepted_asset_count+1, contributor.version+1", "REJECT: set asset.reject_reason", "increment asset.version by 1"]
  - method: GET
    path: "/reviews"
    description: "List reviews filtered by asset (reverse lookup for AssetReview.asset_id and AssetReview.similar_to_asset_id)."
    roles: [Contributor, Reviewer, ComplianceOfficer]
    code: 200
    input: ["asset_id?", "similar_to_asset_id?", "limit?", "offset?"]
    output: AssetReview[]
    side_effects: []
  - method: GET
    path: "/reviews/{id}"
    description: "Read a single asset review."
    roles: [Contributor, Reviewer, ComplianceOfficer]
    code: 200
    input: []
    output: AssetReview
    side_effects: []
  - method: POST
    path: "/license-tiers"
    description: "Create a license tier (unique code)."
    roles: [FinanceAdmin]
    code: 201
    input: [code, base_price_cents]
    output: LicenseTier
    side_effects: []
  - method: GET
    path: "/license-tiers"
    description: "List license tiers."
    roles: [Contributor, Reviewer, ComplianceOfficer, FinanceAdmin]
    code: 200
    input: []
    output: LicenseTier[]
    side_effects: []
  - method: POST
    path: "/downloads"
    description: "Record a licensing download/sale against an ACCEPTED asset; locks royalty snapshot."
    roles: [FinanceAdmin]
    code: 201
    input: [asset_id, license_tier_code, buyer_reference]
    output: Download
    side_effects: ["snapshot sale_price_cents, royalty_rate_snapshot_pct, royalty_amount_cents, available_at", "earning_status=PENDING"]
  - method: GET
    path: "/downloads"
    description: "List downloads filtered by asset or contributor (reverse lookup for Download.asset_id)."
    roles: [Contributor, FinanceAdmin]
    code: 200
    input: ["asset_id?", "contributor_id?", "limit?", "offset?"]
    output: Download[]
    side_effects: []
  - method: GET
    path: "/downloads/{id}"
    description: "Read a download/earning."
    roles: [Contributor, FinanceAdmin]
    code: 200
    input: []
    output: Download
    side_effects: []
  - method: POST
    path: "/downloads/{id}/settle"
    description: "Settle a cleared PENDING earning to AVAILABLE."
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Download
    side_effects: ["credit lifetime & available balance", "recompute royalty_level", "increment contributor.version by 1"]
  - method: POST
    path: "/downloads/{id}/reverse"
    description: "Chargeback a PENDING or AVAILABLE earning to REVERSED; compensates any prior credit."
    roles: [FinanceAdmin]
    code: 200
    input: [reason]
    output: Download
    side_effects: ["if was AVAILABLE: debit lifetime & available balance, recompute royalty_level, increment contributor.version by 1"]
  - method: POST
    path: "/payouts/{id}/process"
    description: "Advance a payout REQUESTED -> PROCESSING."
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Payout
    side_effects: ["increment payout.version by 1"]
  - method: POST
    path: "/payouts/{id}/complete"
    description: "Complete a payout PROCESSING -> PAID, or -> FAILED when disbursement fails (failure restores balance)."
    roles: [FinanceAdmin]
    code: 200
    input: ["failed?"]
    output: Payout
    side_effects: ["PAID on success", "FAILED restores available_balance_cents and bumps contributor.version"]
  - method: POST
    path: "/assets/{id}/takedowns"
    description: "File an IP/takedown request against an asset; opens a closed legal-hold interval."
    roles: [ComplianceOfficer]
    code: 201
    input: [claim_type, claimant_name]
    output: TakedownRequest
    side_effects: ["set hold_start=clock now, hold_end=hold_start+TAKEDOWN_HOLD_DAYS", "status=OPEN"]
  - method: GET
    path: "/takedowns"
    description: "List takedown requests filtered by asset (reverse lookup for TakedownRequest.asset_id)."
    roles: [Contributor, ComplianceOfficer]
    code: 200
    input: ["asset_id?", "limit?", "offset?"]
    output: TakedownRequest[]
    side_effects: []
  - method: GET
    path: "/takedowns/{id}"
    description: "Read a single takedown request."
    roles: [Contributor, ComplianceOfficer]
    code: 200
    input: []
    output: TakedownRequest
    side_effects: []
  - method: POST
    path: "/takedowns/{id}/decision"
    description: "Uphold (cascade takedown) or dismiss a takedown."
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "resolution_note?"]
    output: TakedownRequest
    side_effects: ["UPHOLD: Asset ACCEPTED->TAKEN_DOWN cascade (reverse downloads, decrement accepted_asset_count, +1 strike, maybe suspend)", "DISMISS: set resolution_note"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [FinanceAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["set logical clock to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or X-User-ID on an authenticated endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path id or FK reference does not resolve"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Contributor acts on a resource it does not own"
  - id: ERR_STALE_CONTRIBUTOR_VERSION
    http: 412
    condition: "expected_contributor_version != current Contributor.version on payout request"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_CONTRIBUTOR_SUSPENDED
    http: 403
    condition: "asset submission or payout request while contributor is SUSPENDED"
  - id: ERR_CONTRIBUTOR_NOT_ACTIVE
    http: 409
    condition: "asset ACCEPT while its contributor is not ACTIVE"
  - id: ERR_RELEASE_NOT_VERIFIED
    http: 422
    condition: "asset ACCEPT with requires_release but linked ModelRelease not VERIFIED"
  - id: ERR_EXCLUSIVITY_OVERLAP
    http: 409
    condition: "new exclusivity window overlaps an ACTIVE window of the same contributor"
  - id: ERR_TAKEDOWN_HOLD_CONFLICT
    http: 409
    condition: "new takedown filed within TAKEDOWN_BUFFER_DAYS of a prior UPHELD hold interval on the same asset"
  - id: ERR_NOT_SIMILAR_ENOUGH
    http: 422
    condition: "SIMILAR reject where hamming distance to similar_to_asset_id exceeds SIMILAR_MAX_DISTANCE"
  - id: ERR_VALIDATION
    http: 422
    condition: "field/type/enum/format violation, non-unique LicenseTier.code, non-positive amount, or end_at <= start_at"
  - id: ERR_BELOW_PAYOUT_THRESHOLD
    http: 422
    condition: "payout gross below PAYOUT_THRESHOLD_CENTS"
  - id: ERR_NOT_YET_CLEARED
    http: 409
    condition: "settle before clock reaches download.available_at"
  - id: ERR_MISSING_REJECT_REASON
    http: 422
    condition: "REJECT decision without reject_reason"
  - id: ERR_MISSING_SIMILAR_TARGET
    http: 422
    condition: "SIMILAR reject without similar_to_asset_id"
  - id: ERR_RELEASE_REQUIRED
    http: 422
    condition: "submit with requires_release==true but no model_release_id set"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Contributor
    description: "Media creator: onboarding, uploads, metadata, releases, tax forms, exclusivity, payouts."
    identity: "entity_backed:Contributor"
    exclusive_operations:
      - "POST /contributors (self-register)"
      - "POST /contributors/{id}/tax-forms"
      - "POST /contributors/{id}/model-releases"
      - "POST /contributors/{id}/exclusivity-windows"
      - "POST /contributors/{id}/payouts"
      - "POST /assets"
      - "PATCH /assets/{id}"
      - "POST /assets/{id}/submit"
    shared_operations:
      - "GET reads on own contributor, assets, downloads, payouts, releases, tax-forms, exclusivity-windows, reviews, license-tiers"
  - name: Reviewer
    description: "Content reviewer: claims and adjudicates asset submissions."
    identity: "opaque"
    exclusive_operations:
      - "POST /assets/{id}/claim"
      - "POST /assets/{id}/reviews"
    shared_operations:
      - "GET reads on contributors, assets, reviews, license-tiers"
  - name: ComplianceOfficer
    description: "Trust & safety / legal: verifies releases and tax forms, files and adjudicates takedowns."
    identity: "opaque"
    exclusive_operations:
