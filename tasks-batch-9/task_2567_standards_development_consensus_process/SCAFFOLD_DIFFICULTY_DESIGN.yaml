      - name: upheld_appeal_cascade_vacates_ballot_and_reopens_work_item_development
        grounds:
          - state_machines.Appeal.ACCEPTED_FOR_REVIEW_to_UPHELD
          - state_machines.Ballot.EVALUATED_to_VACATED
          - state_machines.Draft.APPROVED_to_DRAFTING
          - state_machines.WorkItem.CONSENSUS_APPROVED_to_IN_DEVELOPMENT
          - entities.Draft.fields.carryover_unresolved_negative_count
        distinguishing_aspect: |
          Four hops from a different triggering transition than instance 4a: upholding the appeal with
          remedy VACATE_BALLOT records the remedy (hop 1); because the remedy is VACATE_BALLOT the
