            - { call: "POST /demolition/engineering-surveys/${esb}/transition", payload: { action: "SUBMIT" }, as: StructuralEngineer, as_user_id: "wb-a-1" }
            - { call: "POST /demolition/engineering-surveys/${esb}/transition", payload: { action: "CERTIFY" }, as: PeerReviewEngineer, as_user_id: "wb-p-1" }
