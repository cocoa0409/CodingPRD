  - rule_id: non_linear_state_machine
    instances:

      - name: contact_log_dispute_resubmit_cycle_bounded
        grounds:
          - state_machines.ContactLog.SUBMITTED_to_DISPUTED
          - state_machines.ContactLog.DISPUTED_to_SUBMITTED
          - entities.ContactLog.fields.resubmit_count
          - validations[priority=50]
        distinguishing_aspect: |
          CYCLE on the ContactLog entity: verification_status loops
          SUBMITTED -> DISPUTED -> SUBMITTED twice and the loop is terminated by the
          resubmit_count < 2 guard, so the third resubmit is refused with
          ERR_RESUBMIT_LIMIT_REACHED (409) while the row stays parked in DISPUTED.
        test_recipe:
          setup:
            - "Open Site, CERTIFIED MATH Mentor, MATH NoviceTeacher, ACTIVE MentorMatch."
            - "Clock advanced to 2026-08-07T12:00:00Z."
            - "One contact log dated 2026-08-06, ONE_ON_ONE, 45 minutes."
            - "The log has traversed the loop twice: DISPUTE -> resubmit (45 -> 40 minutes, resubmit_count 1) -> DISPUTE -> resubmit (40 -> 35 minutes, resubmit_count 2) -> DISPUTE, leaving verification_status DISPUTED with resubmit_count 2."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
