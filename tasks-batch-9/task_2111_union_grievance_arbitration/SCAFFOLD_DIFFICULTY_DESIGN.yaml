  - rule_id: non_linear_state_machine
    instances:

      - name: grievance_step_ladder_cycle_two_rounds
        grounds:
          - state_machines.Grievance.ANSWERED_to_APPEALED
          - state_machines.Grievance.APPEALED_to_STEP_MEETING_SCHEDULED
          - state_machines.Grievance.STEP_MEETING_SCHEDULED_to_AWAITING_RESPONSE
          - entities.Grievance.fields.current_step
        distinguishing_aspect: |
          Grievance.status is genuinely cyclic: the sequence STEP_MEETING_SCHEDULED ->
          AWAITING_RESPONSE -> ANSWERED -> APPEALED -> STEP_MEETING_SCHEDULED is traversed
          twice on one row, with current_step advancing 1 -> 2 -> 3 while the status values
          repeat, which no linear pipeline can produce.
