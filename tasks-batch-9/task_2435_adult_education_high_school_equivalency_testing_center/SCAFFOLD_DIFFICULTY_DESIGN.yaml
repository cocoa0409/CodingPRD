            - call: "POST /outcome-records"
              payload: { student_id: "${sa}", funding_period_id: "${fp}", measure_type: "EFL_GAIN", evidence_ref: "NRS-EFL-A" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { oa: $.data.id }
            - call: "POST /outcome-records/${oa}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
            - call: "POST /outcome-records"
              payload: { student_id: "${sb}", funding_period_id: "${fp}", measure_type: "POSTSECONDARY_ENROLLMENT", evidence_ref: "NSC-B" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { ob: $.data.id }
            - call: "POST /outcome-records/${ob}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
            - call: "GET /funding-periods/${fp}"
              payload: {}
              as: StateAuthority
              captures: { fp_v1: $.data.version }
            - call: "POST /funding-periods/${fp}/allocation-run"
              payload: { variant: "FINAL", expected_funding_period_version: "${fp_v1}" }
              as: StateAuthority
            - call: "GET /enrollments/${e}"
              payload: {}
              as: ProgramCoordinator
              captures: { enr_v: $.data.version }
          trigger:
            - call: "POST /attendance-entries/${ae1}/void"
              payload: { void_reason: "Duplicate sign-in", expected_enrollment_version: "${enr_v}" }
              as: ProgramCoordinator
            - call: "GET /funding-periods/${fp}"
              payload: {}
              as: StateAuthority
              captures: { fp_v2: $.data.version }
            - call: "POST /funding-periods/${fp}/allocation-run"
              payload: { variant: "FINAL", expected_funding_period_version: "${fp_v2}" }
              as: StateAuthority
          assert:
            - "checkpoint 1 (after the first run): committed_cents == 24000, available_cents == 1000, 24000 + 1000 == total_cents 25000; ${oa} allocated 10000 COMMITTED, ${ob} allocated 14000 COMMITTED"
            - "checkpoint 2 (after the void): ${oa} status == RESCINDED, allocated_cents == 0, allocation_status == REVOKED; committed_cents == 14000, available_cents == 11000, sum still 25000"
            - "${ob} is untouched by the compensation: still CERTIFIED with allocated_cents == 14000 and allocation_status == COMMITTED"
            - "checkpoint 3 (second run): returns 200 with committed_cents still 14000 and available_cents still 11000, allocation_run_count == 2 - the REVOKED line is not UNALLOCATED so it never re-enters the pool"
            - "at all three checkpoints committed_cents equals the sum of allocated_cents over COMMITTED rows"

      - name: instructional_hours_conserved_across_post_and_void
        conserved_quantity: "Enrollment.posted_hours == the sum of hours over POSTED entries of that enrollment, and Student.total_instructional_hours == the sum of posted_hours across the student's enrollments"
        grounds:
          - calculations.instructional_hour_ledger
          - concurrency_rules[attendance-void-stale-enrollment]
          - errors[ERR_ATTENDANCE_ALREADY_VOIDED]
          - errors[ERR_STALE_ENROLLMENT_VERSION]
        distinguishing_aspect: |
          A third conserved quantity - the hour ledger - held at two levels at once (per enrollment
          and per student across two tracks). A rejected void (stale enrollment version) must subtract
          nothing, and a second void of an already VOIDED entry must not subtract twice, so the two
          aggregates stay exactly reconcilable with the POSTED rows.
        test_recipe:
          setup:
            - "Student PLACED at EFL 2 (PRE_TEST 205 on 2026-08-03)."
            - "Enrollment E1 on an OPEN HSE_PREP section with five POSTED 8.00-hour entries (40.00)."
            - "Enrollment E2 on an OPEN ESL section with two POSTED 5.00-hour entries (10.00)."
            - "Clock at 2026-08-07T12:00:00Z."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Dev Learner", email: "dev@x.test", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-03T09:00:00Z" }
              as: Registrar
              captures: { te_pre: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: StateAuthority
            - call: "POST /test-events/${te_pre}/score"
              payload: { scale_score: 205 }
              as: Instructor
            - call: "POST /class-sections"
              payload: { program_track: "HSE_PREP", title: "HSE Hours", instructor_user_id: "instructor-1", min_efl_level: 1, max_efl_level: 6, seats_total: 10, weekly_hours: 8.00 }
              as: ProgramCoordinator
              captures: { sec1: $.data.id }
            - call: "POST /class-sections/${sec1}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
            - call: "POST /class-sections"
              payload: { program_track: "ESL", title: "ESL Hours", instructor_user_id: "instructor-2", min_efl_level: 1, max_efl_level: 6, seats_total: 10, weekly_hours: 4.00 }
              as: ProgramCoordinator
              captures: { sec2: $.data.id }
            - call: "POST /class-sections/${sec2}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
            - call: "POST /enrollments"
              payload: { student_id: "${s}", class_section_id: "${sec1}" }
              as: ProgramCoordinator
              captures: { e1: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${s}", class_section_id: "${sec2}" }
              as: ProgramCoordinator
              captures: { e2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T12:00:00Z" }
              as: StateAuthority
            - call: "POST /enrollments/${e1}/attendance-entries"
              payload: { attendance_date: "2026-08-03", hours: 8.00 }
              as: Instructor
              captures: { a1: $.data.id }
            - call: "POST /enrollments/${e1}/attendance-entries"
              payload: { attendance_date: "2026-08-04", hours: 8.00 }
              as: Instructor
              captures: { a2: $.data.id }
            - call: "POST /enrollments/${e1}/attendance-entries"
              payload: { attendance_date: "2026-08-05", hours: 8.00 }
              as: Instructor
            - call: "POST /enrollments/${e1}/attendance-entries"
              payload: { attendance_date: "2026-08-06", hours: 8.00 }
              as: Instructor
            - call: "POST /enrollments/${e1}/attendance-entries"
              payload: { attendance_date: "2026-08-07", hours: 8.00 }
              as: Instructor
            - call: "POST /enrollments/${e2}/attendance-entries"
              payload: { attendance_date: "2026-08-05", hours: 5.00 }
              as: Instructor
            - call: "POST /enrollments/${e2}/attendance-entries"
              payload: { attendance_date: "2026-08-06", hours: 5.00 }
              as: Instructor
            - call: "GET /enrollments/${e1}"
              payload: {}
              as: ProgramCoordinator
              captures: { enr_v1: $.data.version }
          trigger:
            - call: "POST /attendance-entries/${a1}/void"
              payload: { void_reason: "Wrong roster", expected_enrollment_version: "${enr_v1}" }
              as: ProgramCoordinator
            - call: "POST /attendance-entries/${a2}/void"
              payload: { void_reason: "Wrong roster", expected_enrollment_version: "${enr_v1}" }
              as: ProgramCoordinator
            - call: "GET /enrollments/${e1}"
              payload: {}
              as: ProgramCoordinator
              captures: { enr_v2: $.data.version }
            - call: "POST /attendance-entries/${a2}/void"
              payload: { void_reason: "Wrong roster", expected_enrollment_version: "${enr_v2}" }
              as: ProgramCoordinator
            - call: "GET /enrollments/${e1}"
              payload: {}
              as: ProgramCoordinator
              captures: { enr_v3: $.data.version }
            - call: "POST /attendance-entries/${a1}/void"
              payload: { void_reason: "Duplicate correction", expected_enrollment_version: "${enr_v3}" }
              as: ProgramCoordinator
          assert:
            - "checkpoint 0: Enrollment ${e1} posted_hours == 40.00, ${e2} posted_hours == 10.00, Student ${s} total_instructional_hours == 50.00"
            - "checkpoint 1 (first void succeeds): ${e1} posted_hours == 32.00, ${e2} still 10.00, student total 42.00, ${e1} post_test_eligible == false"
            - "the stale-version void of ${a2} returns 412 with data.error_id == ERR_STALE_ENROLLMENT_VERSION and subtracts nothing: posted_hours stays 32.00, student total stays 42.00, entry ${a2} stays POSTED"
            - "checkpoint 2 (retry with the fresh version): ${a2} status == VOIDED, ${e1} posted_hours == 24.00, student total == 34.00"
            - "re-voiding ${a1} returns 409 with data.error_id == ERR_ATTENDANCE_ALREADY_VOIDED and no hours are subtracted twice: posted_hours stays 24.00, student total stays 34.00"
            - "GET /attendance-entries?enrollment_id=${e1}&status=POSTED lists exactly three entries summing to 24.00, matching posted_hours"
