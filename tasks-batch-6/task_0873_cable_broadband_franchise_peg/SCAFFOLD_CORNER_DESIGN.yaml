scaffold_corner_design:

  # ---------------- Entities ----------------
  - section: entities
    instances:
      - name: create_franchise_success_defaults
        claim_type: Creation
        grounds:
          - "entities.Franchise"
          - "endpoints.POST /franchises"
        distinguishing_aspect: "POST /franchises with all required fields returns 201; lifecycle_status DRAFT, compliance_status COMPLIANT, version 1, peg_fee_per_sub_cents defaults to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Franchise.${fr_id}.lifecycle_status == DRAFT"
            - "Franchise.${fr_id}.compliance_status == COMPLIANT"
            - "Franchise.${fr_id}.peg_fee_per_sub_cents == 0"
            - "Franchise.${fr_id}.version == 1"

      - name: create_franchise_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Franchise"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /franchises without fee_rate_pct is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: get_franchise_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Franchise"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /franchises/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /franchises/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FranchiseAuthority
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: peg_contribution_default_type_applied
        claim_type: Defaults
        grounds:
          - "entities.PegContribution.fields.contribution_type"
          - "endpoints.POST /peg-contributions"
        distinguishing_aspect: "POST /peg-contributions omitting contribution_type stores CAPITAL_GRANT by default."
        test_recipe:
          setup: ["ACTIVE franchise."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
          trigger:
            - call: "POST /peg-contributions"
              payload: { franchise_id: "${fr_id}", amount_cents: 100000 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { peg_id: $.data.id }
          assert:
            - "PegContribution.${peg_id}.contribution_type == CAPITAL_GRANT"
            - "PegContribution.${peg_id}.status == RECORDED"

  # ---------------- State Machines ----------------
  - section: state_machines
    instances:
      - name: activate_already_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Franchise.lifecycle_DRAFT_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A second POST /franchises/{id}/activate on an ACTIVE franchise returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE franchise."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
          trigger:
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: reopen_open_complaint_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Complaint.RESOLVED_to_REOPENED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /complaints/{id}/reopen on an OPEN (never-resolved) complaint returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE franchise; one OPEN complaint by res-1."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /complaints"
              payload: { franchise_id: "${fr_id}", category: "OTHER", description: "General question" }
              as: Resident
              as_user_id: "res-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /complaints/${c_id}/reopen"
              payload: {}
              as: Resident
              as_user_id: "res-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: deem_before_deadline_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.FranchiseApplication.SUBMITTED_to_DEEMED_APPROVED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /franchise-applications/{id}/deem before current_clock passes decision_deadline returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE franchise; a SUBMITTED TRANSFER application submitted at clock 2026-05-01 (decision_deadline ~2026-08-29); clock still 2026-05-01."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
              captures: { fr_v1: $.data.version }
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "TRANSFER", transferee_name: "NewCo", expected_franchise_version: "${fr_v1}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /franchise-applications/${app_id}/deem"
              payload: {}
              as: Operator
              as_user_id: "${fr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: deemed_approval_after_deadline_transfers_franchise
        claim_type: Valid Transition
        grounds:
          - "state_machines.FranchiseApplication.SUBMITTED_to_DEEMED_APPROVED"
          - "state_machines.Franchise.lifecycle_ACTIVE_to_TRANSFERRED"
        distinguishing_aspect: "Once current_clock > decision_deadline, POST /franchise-applications/{id}/deem moves a TRANSFER app to DEEMED_APPROVED and sets Franchise.lifecycle_status TRANSFERRED."
        test_recipe:
          setup: ["ACTIVE franchise; a SUBMITTED TRANSFER application submitted at 2026-05-01; clock advanced to 2026-09-01 (past decision_deadline)."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
              captures: { fr_v1: $.data.version }
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "TRANSFER", transferee_name: "NewCo", expected_franchise_version: "${fr_v1}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { app_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FranchiseAuthority
          trigger:
            - call: "POST /franchise-applications/${app_id}/deem"
              payload: {}
              as: Operator
              as_user_id: "${fr_id}"
          assert:
            - "FranchiseApplication.${app_id}.status == DEEMED_APPROVED"
            - "Franchise.${fr_id}.lifecycle_status == TRANSFERRED"

      - name: renewal_deny_reverts_franchise_to_active
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.FranchiseApplication.SUBMITTED_to_DENIED"
          - "state_machines.Franchise.lifecycle_ACTIVE_to_RENEWAL_PENDING"
        distinguishing_aspect: "Denying a RENEWAL application returns Franchise.lifecycle_status from RENEWAL_PENDING back to ACTIVE and sets the app DENIED."
        test_recipe:
          setup: ["ACTIVE franchise; a SUBMITTED RENEWAL application (franchise RENEWAL_PENDING)."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
              captures: { fr_v1: $.data.version }
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "RENEWAL", proposed_term_end_date: "2040-01-01", expected_franchise_version: "${fr_v1}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /franchise-applications/${app_id}/decide"
              payload: { decision: "DENY" }
              as: FranchiseAuthority
          assert:
            - "FranchiseApplication.${app_id}.status == DENIED"
            - "Franchise.${fr_id}.lifecycle_status == ACTIVE"

      - name: audit_finalize_clean_restores_report_no_assessment
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.Audit.OPEN_to_COMPLETED_CLEAN"
          - "state_machines.RevenueReport.UNDER_AUDIT_to_ADJUSTED"
        distinguishing_aspect: "Finalizing an audit CLEAN restores the target report to its pre-audit status (PAID) and produces no assessment."
        test_recipe:
          setup: ["ACTIVE franchise; report ACCEPTED then PAID 9169; OPEN audit on the report."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100010, commercial_gross_cents: 50010, advertising_gross_cents: 33330 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /revenue-reports/${rr_id}/accept"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports/${rr_id}/pay"
              payload: { amount_cents: 9169 }
              as: Operator
              as_user_id: "${fr_id}"
            - call: "POST /audits"
              payload: { franchise_id: "${fr_id}", target_report_id: "${rr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31" }
              as: FranchiseAuthority
              captures: { au_id: $.data.id }
          trigger:
            - call: "POST /audits/${au_id}/finalize"
              payload: { finding: "CLEAN" }
              as: FranchiseAuthority
              as_user_id: "authority-lead"
          assert:
            - "Audit.${au_id}.status == COMPLETED_CLEAN"
            - "RevenueReport.${rr_id}.status == PAID"

      - name: revoked_franchise_row_permit_create_from_terminal_blocked
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Franchise.lifecycle_ACTIVE_to_REVOKED"
          - "errors[ERR_FRANCHISE_NOT_ACTIVE]"
        distinguishing_aspect: "After lifecycle REVOKED (terminal), POST /row-permits is refused with ERR_FRANCHISE_NOT_ACTIVE."
        test_recipe:
          setup: ["Franchise activated then REVOKED; a RowSegment exists."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /row-segments"
              payload: { name: "Pine St", length_miles: 0.2, homes_along: 40 }
              as: FranchiseAuthority
              captures: { seg_id: $.data.id }
            - call: "POST /franchises/${fr_id}/revoke"
              payload: {}
              as: FranchiseAuthority
          trigger:
            - call: "POST /row-permits"
              payload: { franchise_id: "${fr_id}", row_segment_id: "${seg_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z", purpose: "conduit" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FRANCHISE_NOT_ACTIVE"
            - "response.status == 409"

  # ---------------- Validations ----------------
  - section: validations
    instances:
      - name: transfer_without_transferee_returns_error
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_TRANSFEREE_REQUIRED]"
          - "endpoints.POST /franchise-applications"
        distinguishing_aspect: "POST /franchise-applications application_type TRANSFER without transferee_name returns ERR_TRANSFEREE_REQUIRED (400)."
        test_recipe:
          setup: ["ACTIVE franchise (version 2)."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
              captures: { fr_v1: $.data.version }
          trigger:
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "TRANSFER", expected_franchise_version: "${fr_v1}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TRANSFEREE_REQUIRED"
            - "response.status == 400"

      - name: renewal_without_term_returns_error
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_TERM_REQUIRED]"
          - "endpoints.POST /franchise-applications"
        distinguishing_aspect: "POST /franchise-applications application_type RENEWAL without proposed_term_end_date returns ERR_TERM_REQUIRED (400)."
        test_recipe:
          setup: ["ACTIVE franchise (version 2)."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
              captures: { fr_v1: $.data.version }
          trigger:
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "RENEWAL", expected_franchise_version: "${fr_v1}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TERM_REQUIRED"
            - "response.status == 400"

      - name: audit_finding_without_underpayment_returns_error
        claim_type: Violation → Error
        grounds:
          - "errors[ERR_AUDIT_NO_UNDERPAYMENT]"
          - "state_machines.Audit.OPEN_to_COMPLETED_FINDING"
        distinguishing_aspect: "Finalizing FINDING with audited gross equal to reported gross (no underpayment) returns ERR_AUDIT_NO_UNDERPAYMENT (409)."
        test_recipe:
          setup: ["ACTIVE franchise; report PAID 9169; OPEN audit on the report."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100010, commercial_gross_cents: 50010, advertising_gross_cents: 33330 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /revenue-reports/${rr_id}/accept"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports/${rr_id}/pay"
              payload: { amount_cents: 9169 }
              as: Operator
              as_user_id: "${fr_id}"
            - call: "POST /audits"
              payload: { franchise_id: "${fr_id}", target_report_id: "${rr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31" }
              as: FranchiseAuthority
              captures: { au_id: $.data.id }
          trigger:
            - call: "POST /audits/${au_id}/finalize"
              payload: { finding: "FINDING", audited_gross_residential_cents: 100010, audited_gross_commercial_cents: 50010, audited_gross_advertising_cents: 33330 }
              as: FranchiseAuthority
              as_user_id: "authority-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_AUDIT_NO_UNDERPAYMENT"
            - "response.status == 409"

      - name: revenue_report_period_end_before_start_returns_error
        claim_type: Type Constraints
        grounds:
          - "errors[ERR_VALIDATION_PERIOD_INVALID]"
          - "endpoints.POST /revenue-reports"
        distinguishing_aspect: "POST /revenue-reports with period_end_date before period_start_date returns ERR_VALIDATION_PERIOD_INVALID (400)."
        test_recipe:
          setup: ["ACTIVE franchise."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
          trigger:
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-03-31", period_end_date: "2026-01-01", residential_gross_cents: 1000, commercial_gross_cents: 0, advertising_gross_cents: 0 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION_PERIOD_INVALID"
            - "response.status == 400"

      - name: revenue_report_pay_wrong_amount_fiscal_mismatch
        claim_type: Violation → Error
        grounds:
          - "validations[priority=65]"
          - "errors[ERR_PAYMENT_AMOUNT_MISMATCH]"
        distinguishing_aspect: "Paying an ACCEPTED report (state ok) with amount != outstanding (fee_due 9169) returns ERR_PAYMENT_AMOUNT_MISMATCH (402); isolates the fiscal check with no competing state failure."
        test_recipe:
          setup: ["ACTIVE franchise; report ACCEPTED (fee_due 9169, unpaid)."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100010, commercial_gross_cents: 50010, advertising_gross_cents: 33330 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /revenue-reports/${rr_id}/accept"
              payload: {}
              as: FranchiseAuthority
          trigger:
            - call: "POST /revenue-reports/${rr_id}/pay"
              payload: { amount_cents: 9000 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PAYMENT_AMOUNT_MISMATCH"
            - "response.status == 402"

  # ---------------- Endpoints ----------------
  - section: endpoints
    instances:
      - name: list_revenue_reports_by_franchise_paginated
        claim_type: Listing
        grounds:
          - "endpoints.GET /revenue-reports"
          - "entities.RevenueReport.fields.franchise_id"
        distinguishing_aspect: "GET /revenue-reports?franchise_id=..&limit=1 returns one item with total_count 2 and has_more true (FK reverse-reachability + pagination)."
        test_recipe:
          setup: ["ACTIVE franchise with two filed reports."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100000, commercial_gross_cents: 0, advertising_gross_cents: 0 }
              as: Operator
              as_user_id: "${fr_id}"
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-04-01", period_end_date: "2026-06-30", residential_gross_cents: 110000, commercial_gross_cents: 0, advertising_gross_cents: 0 }
              as: Operator
              as_user_id: "${fr_id}"
          trigger:
            - call: "GET /revenue-reports?franchise_id=${fr_id}&limit=1&offset=0"
              payload: {}
              as: FranchiseAuthority
          assert:
            - "response.total_count == 2"
            - "response.has_more == true"
            - "len(response.data) == 1"

      - name: list_row_permits_filtered_by_segment
        claim_type: Listing
        grounds:
          - "endpoints.GET /row-permits"
          - "entities.RowPermit.fields.row_segment_id"
        distinguishing_aspect: "GET /row-permits?row_segment_id=.. returns the permits on that segment (FK reverse-reachability for row_segment_id)."
        test_recipe:
          setup: ["ACTIVE franchise; RowSegment; one REQUESTED permit on it."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /row-segments"
              payload: { name: "Cedar Ct", length_miles: 0.1, homes_along: 20 }
              as: FranchiseAuthority
              captures: { seg_id: $.data.id }
            - call: "POST /row-permits"
              payload: { franchise_id: "${fr_id}", row_segment_id: "${seg_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z", purpose: "conduit" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /row-permits?row_segment_id=${seg_id}"
              payload: {}
              as: FranchiseAuthority
          assert:
            - "response.total_count == 1"
            - "response.data[0].id == ${p_id}"

  # ---------------- RBAC ----------------
  - section: rbac
    instances:
      - name: operator_cannot_create_franchise_unauthorized
        claim_type: Role Denial
        grounds:
          - "roles.Operator"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "POST /franchises by Operator returns ERR_UNAUTHORIZED (403); creation is FranchiseAuthority-exclusive."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: Operator
              as_user_id: "someone"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "response.status == 403"

      - name: resident_cannot_resolve_complaint_unauthorized
        claim_type: Role Denial
        grounds:
          - "roles.Resident"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "POST /complaints/{id}/resolve by Resident returns ERR_UNAUTHORIZED (403); resolve is Operator-exclusive."
        test_recipe:
          setup: ["ACTIVE franchise; one OPEN complaint by res-1."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /complaints"
              payload: { franchise_id: "${fr_id}", category: "OTHER", description: "x" }
              as: Resident
              as_user_id: "res-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /complaints/${c_id}/resolve"
              payload: { resolution_note: "not allowed" }
              as: Resident
              as_user_id: "res-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "response.status == 403"

      - name: unauthenticated_request_missing_role_header
        claim_type: Role Denial
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no known X-User-Role returns ERR_UNAUTHENTICATED (401) before any resource lookup."
        test_recipe:
          setup: ["ACTIVE franchise."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
          trigger:
            - call: "GET /franchises/${fr_id}"
              payload: {}
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "response.status == 401"

      - name: operator_cannot_pay_other_franchises_report_not_owner
        claim_type: Role Denial
        grounds:
          - "validations[priority=35]"
          - "errors[ERR_NOT_FRANCHISE_OWNER]"
        distinguishing_aspect: "An Operator whose X-User-ID is franchise B pays a report belonging to franchise A and is refused with ERR_NOT_FRANCHISE_OWNER (403)."
        test_recipe:
          setup: ["Two ACTIVE franchises A and B; an ACCEPTED report on A."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo A", territory_name: "Ward A", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_a_id: $.data.id }
            - call: "POST /franchises/${fr_a_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /franchises"
              payload: { operator_name: "CableCo B", territory_name: "Ward B", homes_in_territory: 8000, road_miles: 40, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_b_id: $.data.id }
            - call: "POST /franchises/${fr_b_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_a_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100010, commercial_gross_cents: 50010, advertising_gross_cents: 33330 }
              as: Operator
              as_user_id: "${fr_a_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /revenue-reports/${rr_id}/accept"
              payload: {}
              as: FranchiseAuthority
          trigger:
            - call: "POST /revenue-reports/${rr_id}/pay"
              payload: { amount_cents: 9169 }
              as: Operator
              as_user_id: "${fr_b_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FRANCHISE_OWNER"
            - "response.status == 403"

      - name: assessment_waive_by_issuer_segregation_of_duties
        claim_type: Role Denial
        grounds:
          - "validations[priority=40]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "The authority user who finalized the audit (issuer authority-lead) attempts to waive the resulting assessment and is refused with ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["ACTIVE franchise; report PAID 9169; clock 2026-07-09; audit finalized FINDING by authority-lead; the 1200 assessment ISSUED."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100010, commercial_gross_cents: 50010, advertising_gross_cents: 33330 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /revenue-reports/${rr_id}/accept"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports/${rr_id}/pay"
              payload: { amount_cents: 9169 }
              as: Operator
              as_user_id: "${fr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-09T00:00:00Z" }
              as: FranchiseAuthority
            - call: "POST /audits"
              payload: { franchise_id: "${fr_id}", target_report_id: "${rr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31" }
              as: FranchiseAuthority
              captures: { au_id: $.data.id }
            - call: "POST /audits/${au_id}/finalize"
              payload: { finding: "FINDING", audited_gross_residential_cents: 120010, audited_gross_commercial_cents: 50010, audited_gross_advertising_cents: 33330 }
              as: FranchiseAuthority
              as_user_id: "authority-lead"
            - call: "GET /audits/${au_id}/assessments"
              payload: {}
              as: FranchiseAuthority
              captures: { as_id: "$.data[0].id" }
          trigger:
            - call: "POST /assessments/${as_id}/waive"
              payload: {}
              as: FranchiseAuthority
              as_user_id: "authority-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "response.status == 403"

  # ---------------- Cross-Cutting Complexity Layers ----------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: franchise_application_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[application-create-stale-franchise]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After one application filing bumps Franchise.version, a second POST /franchise-applications carrying the pre-bump expected_franchise_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE franchise; client observed version 2 (fr_v1); one TRANSFER application already filed (franchise version now 3)."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
              captures: { fr_v1: $.data.version }
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "TRANSFER", transferee_name: "NewCo", expected_franchise_version: "${fr_v1}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { app_a_id: $.data.id }
          trigger:
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "TRANSFER", transferee_name: "OtherCo", expected_franchise_version: "${fr_v1}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.status == 412"

      - name: franchise_application_supersede_withdraws_prior
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[application-create-stale-franchise]"
          - "state_machines.FranchiseApplication.SUBMITTED_to_WITHDRAWN"
        distinguishing_aspect: "Filing a second application with the CURRENT franchise version supersedes the prior SUBMITTED one: the prior becomes WITHDRAWN and the new one is SUBMITTED."
        test_recipe:
          setup: ["ACTIVE franchise; one SUBMITTED TRANSFER application A; franchise version re-read after A."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
              captures: { fr_v1: $.data.version }
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "TRANSFER", transferee_name: "NewCo", expected_franchise_version: "${fr_v1}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { app_a_id: $.data.id }
            - call: "GET /franchises/${fr_id}"
              payload: {}
              as: Operator
              as_user_id: "${fr_id}"
              captures: { fr_v2: $.data.version }
          trigger:
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "TRANSFER", transferee_name: "OtherCo", expected_franchise_version: "${fr_v2}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { app_b_id: $.data.id }
          assert:
            - "FranchiseApplication.${app_a_id}.status == WITHDRAWN"
            - "FranchiseApplication.${app_b_id}.status == SUBMITTED"

      - name: cure_releases_held_applications
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Franchise.compliance_to_CURED"
          - "state_machines.FranchiseApplication.HELD_to_SUBMITTED"
        distinguishing_aspect: "POST /franchises/{id}/cure sets compliance CURED, zeroes unresolved_complaint_count, and returns HELD applications to SUBMITTED."
        test_recipe:
          setup: ["ACTIVE franchise driven IN_VIOLATION by two escalated SERVICE_INTERRUPTION complaints; one application currently HELD."]
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
              captures: { fr_v1: $.data.version }
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "TRANSFER", transferee_name: "NewCo", expected_franchise_version: "${fr_v1}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { app_id: $.data.id }
            - call: "POST /complaints"
              payload: { franchise_id: "${fr_id}", category: "SERVICE_INTERRUPTION", description: "Outage A" }
              as: Resident
              as_user_id: "res-1"
              captures: { c1_id: $.data.id }
            - call: "POST /complaints"
              payload: { franchise_id: "${fr_id}", category: "SERVICE_INTERRUPTION", description: "Outage B" }
              as: Resident
              as_user_id: "res-2"
              captures: { c2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: FranchiseAuthority
            - call: "POST /complaints/${c1_id}/escalate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /complaints/${c2_id}/escalate"
              payload: {}
              as: FranchiseAuthority
          trigger:
            - call: "POST /franchises/${fr_id}/cure"
              payload: {}
              as: FranchiseAuthority
          assert:
            - "Franchise.${fr_id}.compliance_status == CURED"
            - "Franchise.${fr_id}.unresolved_complaint_count == 0"
            - "FranchiseApplication.${app_id}.status == SUBMITTED"

