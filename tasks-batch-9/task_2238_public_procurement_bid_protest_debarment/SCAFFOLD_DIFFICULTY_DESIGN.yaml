            - "B8 reviewed RESPONSIBLE by U-REVIEWER-1 with scores 80 / 85 / 90 (composite 85.00), so S11 is AWARD_PENDING and apparent_low_bid_id is B8"
            - "Award A3 created on S11 for B8 in status PENDING_STAY, award_total_obligation_cents 101500000"
            - "DebarmentProceeding D2 opened on V13 at 2026-08-27T00:00:00Z with cause_code BID_RIGGING, aggravating_factor_codes [BID_RIGGING, FALSE_CERTIFICATION] (35 + 25 = 60), no mitigating codes and interim_suspension false, so V13 stays ELIGIBLE and response_deadline_utc is 2026-09-10T00:00:00Z"
