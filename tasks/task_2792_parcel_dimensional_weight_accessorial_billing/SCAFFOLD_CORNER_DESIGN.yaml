            - "Both rows have source == AUTO, status == ASSESSED and a non-null assessed_basis"
            - "${total} == 5810 (transportation 2660 + accessorials 3150) with surcharge_cents == 0"
            - "Shipment.${p}.delivered_at is null and billing_status is still UNBILLED — a refusal does not bill the parcel"

      - name: the_exception_kind_decides_whether_the_parcel_keeps_moving
        claim_type: conditional_cascade
        grounds:
          - state_machines.Shipment.movement_status.IN_TRANSIT_to_IN_TRANSIT
          - state_machines.Shipment.movement_status.IN_TRANSIT_to_UNDELIVERABLE
          - calculations.accessorial_assessment
        distinguishing_aspect: |
          Two parcels take the same endpoint with different kinds: ADDRESS_CORRECTED leaves
          movement_status at IN_TRANSIT and mints one 2200 charge (so the parcel can still be
          delivered afterwards), while UNDELIVERABLE terminates movement and mints one 1800
          charge — the money side effect fires in both cases, the state change in only one.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (no accessorial overrides) and ServiceLevel EXPRESS."
            - "Two identical parcels 1Z-K-0001 and 1Z-K-0002 (12 x 10 x 8 in, 6.0 lb, zone 2) are IN_TRANSIT, each priced at transportation 2660."
