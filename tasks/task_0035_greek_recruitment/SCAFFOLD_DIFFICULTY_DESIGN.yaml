      - name: ci_chapter_quota_count_conserved_accept_then_rescind
        grounds:
          - state_machines.BidMatch.PROPOSED_to_ACCEPTED
          - state_machines.BidMatch.ACCEPTED_to_DECLINED
          - entities.Chapter.fields.pledged_count
          - entities.Chapter.fields.legacy_pledged_count
        distinguishing_aspect: |
          Different conserved quantity (integer pledged_count, an allocation
          count, not USD cents): forward accept increments pledged_count by
          +1; compensating rescind decrements by -1. Invariant:
            after_pledged_count - before_pledged_count == 0
          across the accept/rescind pair on the same bid. Distinct from the
          dues invariant: cents vs count.
        test_recipe:
          setup:
            - "Same Chapter V from instance A scenario, but a LEGACY bid is accepted then rescinded so both Chapter.pledged_count AND Chapter.legacy_pledged_count must round-trip to their pre-accept values."
