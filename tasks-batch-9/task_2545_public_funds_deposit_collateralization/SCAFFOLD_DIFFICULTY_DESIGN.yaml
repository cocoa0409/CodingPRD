              payload: { window_start: "2026-07-31T00:00:00Z", window_end: "2026-08-01T00:00:00Z", basis: "SUPERVISORY", expected_depository_version: "${dep_v2}" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
            - call: "POST /depositories/${dep_id}/mtm-runs"
              payload: { window_start: "2026-07-31T03:59:00Z", window_end: "2026-08-01T00:00:00Z", basis: "SUPERVISORY", expected_depository_version: "${dep_v2}" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
            - call: "POST /depositories/${dep_id}/mtm-runs"
              payload: { window_start: "2026-07-31T04:00:00Z", window_end: "2026-08-01T00:00:00Z", basis: "SUPERVISORY", expected_depository_version: "${dep_v2}" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { run_2: $.data.id }
          assert:
            - "SETUP RUN: MarkToMarketRun.${run_1} has run_index 1, as_of == 2026-08-01T00:00:00Z, total_required_collateral_cents == 78750000, total_collateral_value_cents == 0, deficiency_cents == 78750000, deficiency_ratio_bps == 10000, outcome == DEFICIENT"
            - "PROBE 1 (window_start == the previous window_end exactly): 409 with error_id ERR_MTM_WINDOW_OVERLAP — CLOSED windows that touch DO intersect"
            - "PROBE 2 (window_start 3h59m after the previous window_end, no intersection): 409 with error_id ERR_MTM_WINDOW_OVERLAP — the 4h buffer is not yet satisfied"
            - "PROBE 3 (window_start exactly MTM_MIN_GAP_HOURS == 4h after the previous window_end): 201, run_index 2"
            - "MarkToMarketRun.${run_2}.deficiency_surcharge_bps_applied == 0 because the snapshot S is 1 and DEFICIENCY_SURCHARGE_TRIGGER_RUNS is 2, so total_required_collateral_cents is still 78750000"
            - "After PROBE 3: Depository.${dep_id}.consecutive_deficiency_runs == 2, mtm_run_index == 2, last_mtm_window_end == 2026-08-01T00:00:00Z, collateral_posture == MARGIN_DEFICIENT (2 < FROZEN_TRIGGER_RUNS)"
            - "GET /depositories/${dep_id}/mtm-runs returns exactly 2 runs; the two rejected probes left no MarkToMarketRun rows and did not bump Depository.version beyond ${dep_v2} + 1"
            - "GET /margin-calls?depository_id=${dep_id} returns exactly 2 ISSUED calls, one per successful run"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: asset_par_conservation_through_allocate_and_release
        grounds:
          - state_machines.PledgeAllocation.ACTIVE_to_RELEASED
          - calculations.allocation_collateral_valuation
          - endpoints.POST_/pledge-allocations/{id}/release
        distinguishing_aspect: |
          The conserved quantity is ONE ASSET'S PAR: pledged_par_cents + available_par_cents ==
          par_value_cents must hold before the pledge, while pledged, and after the release, and the
          release must fully reverse every derived value it created (agreement totals, depository totals,
          account coverage, collateral_status) with no drift — proven by re-pledging the full par afterwards
          and getting the untouched capacity back.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "APPROVED custodian, APPROVED well-capitalized depository, FUNDED DEDICATED DEMAND account with 100,000,000 cents (required 78,750,000)."
            - "EXECUTED dedicated agreement and one ELIGIBLE US_TREASURY asset (haircut 200 bps) with par_value_cents 10,000,000 at 10000 bps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /custodians"
              payload: { name: "First Custody Bank", custodian_type: "TRUST_BANK", tri_party_capable: true, concentration_limit_bps: 10000 }
              as: StateRegulator
              captures: { cust_id: $.data.id }
            - call: "POST /custodians/${cust_id}/approve"
              payload: {}
              as: StateRegulator
            - call: "POST /public-units"
              payload: { name: "Ridge County", unit_type: "COUNTY", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000000, collateral_program_preference: "DEDICATED", reporting_frequency: "MONTHLY" }
              as: StateRegulator
              captures: { unit_id: $.data.id }
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200, insurance_determination_basis: "AGGREGATED_BY_UNIT" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
            - call: "POST /depositories/${dep_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
            - call: "POST /deposit-accounts"
              payload: { depository_id: "${dep_id}", public_unit_id: "${unit_id}", deposit_class: "DEMAND", pledging_mode: "DEDICATED" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { acct_id: $.data.id }
            - call: "POST /deposit-accounts/${acct_id}/deposits"
              payload: { amount_cents: 100000000 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "POST /pledge-agreements"
              payload: { depository_id: "${dep_id}", custodian_id: "${cust_id}", beneficiary_type: "DEPOSIT_ACCOUNT", deposit_account_id: "${acct_id}", agreement_number: "AG-0001", governing_law_state: "OH" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { ag_id: $.data.id }
            - call: "POST /pledge-agreements/${ag_id}/circulate"
              payload: {}
              as: BankCollateralOfficer
              as_user_id: "officer-1"
            - call: "POST /pledge-agreements/${ag_id}/signatures"
              payload: { party: "DEPOSITORY" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /pledge-agreements/${ag_id}/signatures"
              payload: { party: "PUBLIC_UNIT" }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
            - call: "POST /pledge-agreements/${ag_id}/signatures"
              payload: { party: "CUSTODIAN" }
              as: Custodian
              as_user_id: "${cust_id}"
              captures: { ag_v1: $.data.version }
            - call: "POST /collateral-assets"
              payload: { depository_id: "${dep_id}", custodian_id: "${cust_id}", cusip: "912828JJ9", asset_type: "US_TREASURY", par_value_cents: 10000000, market_price_bps: 10000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { asset_id: $.data.id }
          trigger:
            - call: "POST /pledge-allocations"
              payload: { pledge_agreement_id: "${ag_id}", collateral_asset_id: "${asset_id}", allocated_par_cents: 4000000, effective_from: "2026-08-01T00:00:00Z", expected_pledge_agreement_version: "${ag_v1}" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /pledge-allocations/${alloc_id}/release"
              payload: {}
              as: BankCollateralOfficer
              as_user_id: "officer-1"
            - call: "GET /pledge-agreements/${ag_id}"
              payload: {}
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { ag_v2: $.data.version }
            - call: "POST /pledge-allocations"
              payload: { pledge_agreement_id: "${ag_id}", collateral_asset_id: "${asset_id}", allocated_par_cents: 10000000, effective_from: "2026-08-01T00:00:00Z", expected_pledge_agreement_version: "${ag_v2}" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { alloc_full_id: $.data.id }
          assert:
            - "BEFORE: CollateralAsset.${asset_id}.pledged_par_cents == 0, available_par_cents == 10000000, collateral_value_cents == 9800000 — conservation 0 + 10000000 == 10000000"
            - "AFTER ALLOCATE: PledgeAllocation.${alloc_id}.allocated_collateral_value_cents == 3920000 and status == ACTIVE"
            - "AFTER ALLOCATE: CollateralAsset.${asset_id}.pledged_par_cents == 4000000 and available_par_cents == 6000000 — conservation 4000000 + 6000000 == 10000000"
            - "AFTER ALLOCATE: PledgeAgreement.${ag_id}.total_collateral_value_cents == 3920000, active_allocation_count == 1; DepositAccount.${acct_id}.assigned_collateral_value_cents == 3920000, coverage_ratio_bps == 497 (floor of 497.77), collateral_status == DEFICIENT"
            - "AFTER RELEASE: PledgeAllocation.${alloc_id}.status == RELEASED, released_at == 2026-08-01T00:00:00Z, and its allocated_collateral_value_cents no longer contributes to any total"
            - "AFTER RELEASE: CollateralAsset.${asset_id}.pledged_par_cents == 0 and available_par_cents == 10000000 — conservation restored exactly, with no 1-cent drift from the two rounding steps"
            - "AFTER RELEASE: PledgeAgreement.${ag_id}.total_collateral_value_cents == 0 and total_pledged_par_cents == 0; Depository.${dep_id}.total_pledged_collateral_value_cents == 0 and total_pledged_par_cents == 0"
            - "AFTER RELEASE: DepositAccount.${acct_id}.assigned_collateral_value_cents == 0, coverage_ratio_bps == 0, collateral_status == UNSECURED, while required_collateral_cents is unchanged at 78750000"
            - "AFTER RE-PLEDGE of the whole par: 201 (the released allocation freed the full capacity), allocated_collateral_value_cents == 9800000, asset pledged_par_cents == 10000000 and available_par_cents == 0"
            - "AFTER RE-PLEDGE: DepositAccount.${acct_id}.coverage_ratio_bps == 1244 (floor of 1244.44) and collateral_status == DEFICIENT; GET /pledge-allocations?collateral_asset_id=${asset_id} returns 2 rows, one RELEASED and one ACTIVE"

      - name: pooled_program_value_conservation_across_waterfall
        grounds:
          - calculations.pooled_collateral_waterfall
          - entities.PooledCollateralProgram.fields.unallocated_collateral_cents
          - entities.DepositAccount.fields.pooled_allocated_collateral_cents
        distinguishing_aspect: |
          A different conserved quantity on a different resource: the POOL's aggregate value must always
          equal the sum of what the waterfall handed to participants plus what is left unallocated
          (98,000,000 == 82,500,000 + 15,500,000 + 0), across a release that zeroes the pool and a re-pledge
          that restores the identical split. Statutory rank order (SCHOOL_DISTRICT before COUNTY) decides who
          is fully covered, so the identity holds while the individual shares are wildly unequal.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One pooled program with minimum_pool_pct_bps 11000, one APPROVED custodian."
            - "Two public units with POOLED preference: a SCHOOL_DISTRICT (pool_priority_rank 1) and a COUNTY (rank 2)."
            - "One APPROVED well-capitalized depository (1200 bps) enrolled in the pool; one POOLED DEMAND account per unit, each funded with 100,000,000 cents, so each requires 82,500,000 (10500 + 500 POOLED surcharge)."
