      - name: reject_accepted_commitment_restores_exposed_points_exactly
        grounds:
          - state_machines.DataElementCommitment.ACCEPTED_to_REJECTED
          - calculations.exposed_sensitivity_points
          - calculations.vendor_risk_score
          - entities.Application.fields.exposed_sensitivity_points
          - validations[priority=13]
        distinguishing_aspect: |
          ACCEPTED -> REJECTED is the compensating edge: Application
          exposed_sensitivity_points must return to exactly the value it held before
          that row was accepted (2.88 -> 1.44) and the vendor's risk_score must
          follow (1.44 -> 0.72), with zero rounding drift and with the surviving
          sibling untouched at 1.44. A delta-based undo that subtracts an unrounded
          1.4375 leaves 1.4425 and fails.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Vendor V (breach_notification_hours 48, no subprocessors, no incidents) and INSTRUCTIONAL_CONTENT Application A (max_permitted_tier 2)."
            - "A triaged request and a SCREENING review on A."
            - "Two commitments, both tier 1 / 365 days / ANONYMIZE (element_points 1.44 each), both ACCEPTED, so Application.exposed_sensitivity_points is 2.88 and Vendor.risk_score is 1.44."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Brightpath Reading Co", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Brightpath Readers", category: "INSTRUCTIONAL_CONTENT", grade_band_low: 3, grade_band_high: 5, sso_protocol: "LTI13", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/attest-integration"
              payload: { sso_verified: true }
              as: PrivacyOfficeAdmin
            - call: "POST /teachers"
              payload: { full_name: "Ivy Chen", employee_number: "EMP-7041", school_code: "ES-11", grade_bands_taught: [3, 4, 5] }
              as: PrivacyOfficeAdmin
              captures: { t_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Ana Lopez", credential_level: "SENIOR", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /privacy-analysts"
              payload: { full_name: "Lee Park", credential_level: "LEAD", review_capacity_minutes: 2400 }
              as: PrivacyOfficeAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /application-requests"
              payload: { application_id: "${app_id}", requester_teacher_id: "${t_id}", instructional_justification: "Grade seven and eight students use this tool for weekly formative practice aligned to the district scope and sequence, and teachers review item-level results during common planning time to regroup learners and plan targeted reteaching block", requested_data_elements: ["STUDENT_NAME", "GRADE_LEVEL"], student_count_estimate: 300, grade_band_low: 3, grade_band_high: 5 }
              as: Teacher
              as_user_id: "${t_id}"
              captures: { req_id: $.data.id }
            - call: "POST /application-requests/${req_id}/submit"
              payload: {}
              as: Teacher
              as_user_id: "${t_id}"
            - call: "POST /application-requests/${req_id}/triage"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /data-practice-reviews"
              payload: { source_request_id: "${req_id}", assigned_analyst_id: "${an1_id}", framework_set: ["FERPA", "COPPA"], estimated_minutes: 180 }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rev_id: $.data.id }
            - call: "GET /data-practice-reviews/${rev_id}"
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rv1: $.data.version }
            - call: "POST /data-element-commitments"
              payload: { review_id: "${rev_id}", element_code: "STUDENT_NAME", justified_purpose: "Roster identity matching for gradebook sync and report cards.", retention_days: 365, deletion_method: "ANONYMIZE", expected_review_version: "${rv1}" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { cm1_id: $.data.id }
            - call: "GET /data-practice-reviews/${rev_id}"
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { rv2: $.data.version }
            - call: "POST /data-element-commitments"
              payload: { review_id: "${rev_id}", element_code: "GRADE_LEVEL", justified_purpose: "Roster identity matching for gradebook sync and report cards.", retention_days: 365, deletion_method: "ANONYMIZE", expected_review_version: "${rv2}" }
              as: PrivacyAnalyst
              as_user_id: "${an1_id}"
              captures: { cm2_id: $.data.id }
            - call: "POST /data-element-commitments/${cm1_id}/decide"
              payload: { disposition: "ACCEPT" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
            - call: "POST /data-element-commitments/${cm2_id}/decide"
              payload: { disposition: "ACCEPT" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
          trigger:
            - call: "POST /data-element-commitments/${cm2_id}/decide"
              payload: { disposition: "REJECT" }
              as: PrivacyAnalyst
              as_user_id: "${an2_id}"
          assert:
            - "DataElementCommitment.${cm2_id}.status == REJECTED"
            - "DataElementCommitment.${cm1_id}.status == ACCEPTED"
            - "DataElementCommitment.${cm1_id}.element_points == 1.44"
            - "Application.${app_id}.exposed_sensitivity_points == 1.44 (exactly the pre-accept value, not 1.4425 and not 1.45)"
            - "Vendor.${v_id}.risk_score == 0.72"
            - "Vendor.${v_id}.privacy_posture == CLEAR"
            - "a second REJECT on ${cm2_id} returns 409 ERR_COMMITMENT_ALREADY_DECIDED, so the compensation cannot be replayed"
