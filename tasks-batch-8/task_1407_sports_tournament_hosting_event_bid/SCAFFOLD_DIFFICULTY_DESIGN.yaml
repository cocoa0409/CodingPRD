  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: bid_revision_cycle_loop
        grounds:
          - state_machines.Bid.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.Bid.REVISION_REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic machine on Bid (UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED
          -> UNDER_REVIEW): the second submit succeeds from REVISION_REQUESTED
          and increments revision_count to 1 — a pure pipeline would reject the
          second submit. The Match instance exercises a different entity's loop.
        test_recipe:
          setup:
            - "Event E in BIDDING; Bid B with one mandatory requirement VERIFIED (weight 100)"
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { bid_id: $.data.id } }
            - { call: "POST /api/v1/bids/${bid_id}/requirements", payload: { kind: INSURANCE_CERT, is_mandatory: true, weight_points: 100 }, as: CommissionAdmin, captures: { rq1: $.data.id } }
            - { call: "POST /api/v1/requirements/${rq1}/evidence", payload: { evidence_uri: "s3://ev/ins.pdf" }, as: CommissionAdmin, as_user_id: "ops-admin-1" }
            - { call: "POST /api/v1/requirements/${rq1}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/submit", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/bids/${bid_id}/review", payload: {}, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/request-revision", payload: { revision_notes: "need hotel detail" }, as: SanctioningReviewer, as_user_id: "rev-9" }
          trigger:
            - { call: "POST /api/v1/bids/${bid_id}/submit", payload: {}, as: CommissionAdmin, captures: { rc: $.data.revision_count, st: $.data.status } }
            - { call: "POST /api/v1/bids/${bid_id}/review", payload: {}, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/decide", payload: { decision: AWARDED }, as: SanctioningReviewer, as_user_id: "rev-9", captures: { fin: $.data.status } }
          assert:
            - "Bid.${bid_id}.status == SUBMITTED after resubmission (cycle REVISION_REQUESTED -> SUBMITTED traversed)"
            - "Bid.${bid_id}.revision_count == 1"
            - "Second review + decide succeed: Bid.${bid_id}.status == AWARDED"
            - "Event.${ev_id}.posture == AWARDED"

      - name: match_weather_reschedule_cycle
        grounds:
          - state_machines.Match.SCHEDULED_to_WEATHER_DELAYED
          - state_machines.Match.RESCHEDULE_QUEUE_to_SCHEDULED
          - calculations.reschedule_queue_order
        distinguishing_aspect: |
          Cyclic machine on Match (SCHEDULED -> WEATHER_DELAYED ->
          RESCHEDULE_QUEUE -> SCHEDULED): the match returns to SCHEDULED with a
          new window while original_scheduled_start stays pinned at the first
          scheduling — a linear machine could not re-enter SCHEDULED.
        test_recipe:
          setup:
            - "Event lifecycle to LIVE; 2-team division; final match M1 SCHEDULED on field F1 at 2026-10-10T14:00:00Z (slot 90 min)"
