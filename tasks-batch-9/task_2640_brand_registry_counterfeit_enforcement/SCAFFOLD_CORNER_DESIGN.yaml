            - call: "POST /brand-protection/listings/${listing_id}/screen"
              payload: { image_match_score: 1.00, text_match_score: 1.00 }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/claims"
              payload: { brand_id: "${brand_id}", listing_id: "${listing_id}", asserted_registration_id: "${reg_id}", claimed_violation_type: "TRADEMARK" }
              as: EnforcementAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /brand-protection/claims/${claim_id}/substantiate"
              as: EnforcementAnalyst
              captures: { claim_v: $.data.version }
            - call: "POST /brand-protection/evidence-packages"
              payload: { claim_id: "${claim_id}", package_ref: "PKG-1", expected_claim_version: "${claim_v}" }
              as: EnforcementAnalyst
              captures: { pkg_id: $.data.id }
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "LISTING_SCREENSHOT", item_ref: "SS-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "REGISTRATION_CERTIFICATE", item_ref: "CERT-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "MARK_COMPARISON", item_ref: "CMP-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "SELLER_PROFILE_SNAPSHOT", item_ref: "SNAP-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/items"
              payload: { item_type: "PRICE_HISTORY_EXPORT", item_ref: "PRICE-1" }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/evidence-packages/${pkg_id}/seal"
              as: EnforcementAnalyst
            - call: "POST /brand-protection/takedowns"
              payload: { enrollment_id: "${enr_id}", claim_id: "${claim_id}", evidence_package_id: "${pkg_id}" }
              as: EnforcementAnalyst
              captures: { td_id: $.data.id }
            - call: "POST /brand-protection/takedowns/${td_id}/submit"
              as: AuthorizedRepresentative
              as_user_id: "${rep1_id}"
            - call: "POST /brand-protection/takedowns/${td_id}/marketplace-decision"
              payload: { decision: "REMOVED", marketplace_case_ref: "MC-1" }
              as: MarketplaceLiaison
          trigger:
            - call: "GET /brand-protection/brands/${brand_id}/enforcement-metrics"
              as: BrandAdministrator
            - call: "GET /brand-protection/brands/${brand_id}/enforcement-metrics"
              as: LegalCounsel
          assert:
            - "HTTP 200 with listing_removal_rate == 1.0000, decided_takedown_count == 1 and removed_takedown_count == 1"
            - "repeat_infringer_count == 0 (the seller carries one strike only)"
            - "open_case_count == 0 (a first 12.55-point strike escalates nothing, so no case was auto-created)"
            - "enforcement_spend_cents == 0 and equals Brand.${brand_id}.enforcement_spend_cents"
            - "the second read by a different role returns a byte-identical data object and Brand.${brand_id}.version is unchanged by either read"

      - name: listing_index_filters_on_each_state_dimension_and_pages_stably
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /brand-protection/listings]
          - entities.MonitoredListing
        distinguishing_aspect: "The index filters on the two independent state dimensions and on seller: three listings in states NEW, CLEARED and FLAGGED are separable by monitor_status, and limit=1&offset=1 returns the second row of the same stable ordering with total_count still reporting the unpaged size."
        test_recipe:
          setup:
            - "Three monitored listings for one brand: L1 never screened (NEW/NONE), L2 screened to 0.0800 (CLEARED), L3 screened to 0.8620 (FLAGGED/COUNTERFEIT); L3 belongs to a second seller"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { sellerA_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A2SELLER", legal_name: "Guangzhou Export Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { sellerB_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${sellerA_id}", marketplace_code: "AMZ", listing_ref: "B0ACME001", title_text: "ACME 8-inch adjustable wrench", image_hash: "IMGHASH1", price_cents: 9500, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${sellerA_id}", marketplace_code: "AMZ", listing_ref: "B0ACME002", title_text: "Generic chrome spanner set", image_hash: "IMGHASH2", price_cents: 12000, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { l2_id: $.data.id }
            - call: "POST /brand-protection/listings/${l2_id}/screen"
              payload: { image_match_score: 0.10, text_match_score: 0.10 }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${sellerB_id}", marketplace_code: "AMZ", listing_ref: "B0ACME003", title_text: "ACME 8-inch wrench genuine", image_hash: "IMGHASH3", price_cents: 3000, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { l3_id: $.data.id }
            - call: "POST /brand-protection/listings/${l3_id}/screen"
              payload: { image_match_score: 0.92, text_match_score: 0.88 }
              as: EnforcementAnalyst
          trigger:
            - call: "GET /brand-protection/listings?brand_id=${brand_id}&monitor_status=FLAGGED"
              as: MarketplaceLiaison
            - call: "GET /brand-protection/listings?brand_id=${brand_id}&enforcement_status=NONE&limit=1&offset=1"
              as: MarketplaceLiaison
            - call: "GET /brand-protection/listings?seller_id=${sellerA_id}&violation_type=NONE"
              as: MarketplaceLiaison
          assert:
            - "the FLAGGED filter returns HTTP 200, total_count 1 and exactly ${l3_id} with match_score 0.8620, violation_type COUNTERFEIT and price_deviation_factor 0.7000"
            - "L1 is NEW/NONE with match_score null, image_match_score null, text_match_score null and violation_type NONE"
            - "L2 is CLEARED/NONE with match_score 0.0800, price_deviation_factor 0.0000 (price above MSRP clamps to zero) and violation_type NONE"
            - "the enforcement_status=NONE page reports total_count 3 while returning a single row — the second element of the same ordering the unpaged call produced"
            - "the seller-A filter returns total_count 2 (${l1_id} and ${l2_id}) and never ${l3_id}"

      - name: released_seizure_concludes_straight_from_open_without_a_strike
        claim_type: Conditional action
        grounds:
          - endpoints[POST /brand-protection/diversion-investigations/{investigationId}/conclude]
          - state_machines.DiversionInvestigation
        distinguishing_aspect: "RELEASED is the one outcome reachable directly from OPEN, so a seizure can be closed without ever filing evidence — and unlike DIVERSION_CONFIRMED it attributes no strike, escalates nobody and auto-creates no case."
        test_recipe:
          setup:
            - "A RECORDED CBP recordation and one OPEN BORDER_SEIZURE investigation naming a suspected seller"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: CustomsCoordinator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/customs-recordations"
              payload: { brand_id: "${brand_id}", registration_id: "${reg_id}", customs_authority_code: "CBP", nice_class: 8, recorded_on: "2026-07-01", expires_on: "2027-06-30" }
              as: CustomsCoordinator
              captures: { rec_id: $.data.id }
            - call: "POST /brand-protection/customs-recordations/${rec_id}/record"
              payload: { recordation_number: "CBP-0001" }
              as: CustomsCoordinator
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/diversion-investigations"
              payload: { brand_id: "${brand_id}", source_kind: "BORDER_SEIZURE", lot_code: "LOT-77", recordation_id: "${rec_id}", seller_id: "${seller_id}", seizure_ref: "SZ-1", port_code: "USLAX", seized_qty: 400, declared_value_cents: 900000 }
              as: CustomsCoordinator
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/diversion-investigations/${inv_id}/conclude"
              payload: { outcome: "RELEASED", findings_ref: "FIND-1" }
              as: CustomsCoordinator
          assert:
            - "HTTP 200 with status RELEASED and concluded_at == 2026-08-05T08:00:00Z, from an investigation that was never EVIDENCE_SUBMITTED"
            - "DiversionInvestigation.${inv_id}.evidence_ref == null and suspected_distributor_ref == null"
            - "Seller.${seller_id}.standalone_strike_points == 0.00, cluster_strike_points == 0.00 and status == ACTIVE"
            - "GET /brand-protection/cases?brand_id=${brand_id} returns total_count 0 (RELEASED auto-creates no case)"
            - "CustomsRecordation.${rec_id}.status == RECORDED, untouched by the conclusion"

      - name: test_buy_cancel_reverses_the_exact_ledger_charge
        claim_type: Conditional action
        grounds:
          - endpoints[POST /brand-protection/test-buys/{testBuyId}/cancel]
          - calculations.test_buy_billable_total
        excluded_because:
          difficulty_instance: "compensating_invariant / test_buy_cancellation_restores_the_brand_ledger_to_the_cent"
          rationale: "The §1.8 compensating-invariant instance already exercises the cancel endpoint end to end — the exact ledger reversal, the cooling-period input set shrinking and the Brand version bump — so a §1.9 duplicate would add no breadth."

      - name: alias_link_merges_strike_history_into_the_canonical_cluster
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /brand-protection/sellers/{sellerId}/link-alias]
          - calculations.seller_strike_points
        excluded_because:
          difficulty_instance: "dual_variant_calc / seller_standalone_and_cluster_strike_variants_diverge_after_alias_link"
          rationale: "The §1.8 dual-variant instance already links an alias and asserts both variants on both rows plus the escalation re-evaluation across the enlarged cluster, which is the whole substance of this endpoint's association side effect."

      - name: counter_notice_acceptance_reinstates_the_whole_chain
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /brand-protection/counter-notices/{counterNoticeId}/resolve]
          - state_machines.CounterNotice
        excluded_because:
          difficulty_instance: "transitive_cascade / counter_notice_acceptance_reverses_the_removal_chain_four_levels"
          rationale: "The §1.8 transitive-cascade instance already asserts every level of the ACCEPTED branch — takedown REINSTATED, listing REINSTATED, claim back to SUBSTANTIATED and the strike dropped with de-escalation — so the endpoint's side-effect list is fully covered."

      - name: counter_notice_rebuttal_restores_the_removal_without_recharging
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /brand-protection/counter-notices/{counterNoticeId}/resolve]
          - calculations.seller_strike_points
        excluded_because:
          difficulty_instance: "compensating_invariant / rebutted_counter_notice_closes_the_cycle_without_double_counting_the_strike"
          rationale: "The REBUTTED branch's distinguishing behaviour — the strike is neither reversed nor re-charged and the filing deadline is not extended — is exactly what the cited §1.8 instance pins."

      - name: resubmission_returns_a_rejected_notice_to_submitted
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /brand-protection/takedowns/{takedownId}/resubmit]
          - state_machines.TakedownSubmission
        excluded_because:
          difficulty_instance: "non_linear_state_machine / takedown_returns_to_submitted_through_the_resubmission_cycle"
          rationale: "The cited §1.8 instance drives the REJECTED -> SUBMITTED loop with the round_number increment, the fresh deadline and the new package binding; §1.9 keeps only the cap boundary of that loop, which is asserted in the state_machines section."

  - section: rbac
    instances:
      - name: roles_cannot_perform_another_roles_exclusive_operations
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - rbac.roles
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Every exclusive operation is closed to the other five roles: the analyst cannot register a brand, legal counsel cannot activate an enrollment and the liaison cannot create a seller — each is ERR_UNAUTHORIZED (403) and nothing is written, while the owning role succeeds on the identical payload."
        test_recipe:
          setup:
            - "An empty database; a brand plus a DRAFT AMZ enrollment created by their owning roles"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v: $.data.version }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "AMZ", requested_nice_class: 8, expected_brand_version: "${brand_v}" }
              as: BrandAdministrator
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/brands"
              payload: { name: "Rogue Brand", owner_legal_entity: "Rogue LLC", home_jurisdiction: "US", authorized_msrp_cents: 5000, enforcement_budget_cents: 100000 }
              as: EnforcementAnalyst
              captures: { err_id: $.data.error_id }
            - call: "POST /brand-protection/enrollments/${enr_id}/activate"
              as: LegalCounsel
              captures: { err2_id: $.data.error_id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: MarketplaceLiaison
              captures: { err3_id: $.data.error_id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
          assert:
            - "all three cross-role calls return HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "GET /brand-protection/brands returns total_count 1 (the analyst's brand was never created)"
            - "MarketplaceEnrollment.${enr_id}.enrollment_status == SUBMITTED and activated_at == null after legal counsel's attempt"
            - "the analyst's identical seller payload returns HTTP 201, proving the refusal was about the role and not the body"
            - "Seller.${seller_id}.seller_ref == A1SELLER and version == 1"

      - name: unauthenticated_request_is_rejected_before_role_and_payload_checks
        claim_type: Missing authentication
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 runs before everything: a call with no X-Role header is ERR_UNAUTHENTICATED (401) even when the body is also invalid and the role it would have used is unauthorized anyway — the response never mentions ERR_INVALID_REQUEST or ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "A brand exists so the path targets are real"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "ZZZ", seller_ref: "", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: "(no X-Role header sent)"
              captures: { err_id: $.data.error_id }
            - call: "GET /brand-protection/brands/${brand_id}"
              as: "(no X-Role header sent)"
              captures: { err2_id: $.data.error_id }
          assert:
            - "the write returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED, not ERR_INVALID_REQUEST for the blank seller_ref or the unknown marketplace_code ZZZ"
            - "the read returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED even though every role may read"
            - "GET /brand-protection/sellers (authenticated) returns total_count 0"
            - "Brand.${brand_id}.version == 1 (no state was touched)"

      - name: representative_identity_naming_no_designation_row_returns_not_found
        claim_type: Entity-backed identity resolution
        grounds:
          - rbac.roles[AuthorizedRepresentative].identity_notes
          - errors[ERR_REPRESENTATIVE_NOT_FOUND]
        distinguishing_aspect: "The AuthorizedRepresentative role is entity-backed, so X-User-ID must resolve to a real designation row: a syntactically valid id that names no row is ERR_REPRESENTATIVE_NOT_FOUND (404), which is a different failure from a role the endpoint forbids (403)."
        test_recipe:
          setup:
            - "An OPEN case on a brand with no representative designations at all"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/cases"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}" }
              as: LegalCounsel
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/cases/${case_id}/cease-desist"
              payload: { letter_ref: "CD-1" }
              as: AuthorizedRepresentative
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_REPRESENTATIVE_NOT_FOUND"
            - "EnforcementCase.${case_id}.correspondence_status == NONE, cease_desist_sent_by_rep_id == null, cd_sent_at == null and cd_response_due_at == null"
            - "EnforcementCase.${case_id}.version is unchanged at 1"
            - "GET /brand-protection/representatives returns total_count 0"

      - name: representative_without_the_demanded_scope_cannot_send_a_cease_and_desist
        claim_type: Delegated authority scope
        grounds:
          - validations[priority=35]
          - entities.AuthorizedRepresentative.authority_scope
          - errors[ERR_REPRESENTATIVE_SCOPE_INSUFFICIENT]
        distinguishing_aspect: "The cease-and-desist letter demands the SUBMIT_TAKEDOWN scope, so an AUTHORIZE_LITIGATION designation — a perfectly effective, DESIGNATED row under the right ACTIVE enrollment — is ERR_REPRESENTATIVE_SCOPE_INSUFFICIENT (403), while the SUBMIT_TAKEDOWN designation sends the same letter."
        test_recipe:
          setup:
            - "An ACTIVE AMZ enrollment with two designations of disjoint scope: rep_lit AUTHORIZE_LITIGATION and rep_td SUBMIT_TAKEDOWN, both effective now"
            - "One OPEN case for the brand's seller"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v: $.data.version }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "AMZ", requested_nice_class: 8, expected_brand_version: "${brand_v}" }
              as: BrandAdministrator
              captures: { enr_id: $.data.id }
            - call: "POST /brand-protection/enrollments/${enr_id}/activate"
              as: MarketplaceLiaison
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "AUTHORIZE_LITIGATION", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", power_of_attorney_ref: "POA-LIT" }
              as: BrandAdministrator
              captures: { rep_lit_id: $.data.id }
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "SUBMIT_TAKEDOWN", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", power_of_attorney_ref: "POA-TD" }
              as: BrandAdministrator
              captures: { rep_td_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/cases"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}" }
              as: LegalCounsel
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/cases/${case_id}/cease-desist"
              payload: { letter_ref: "CD-1" }
              as: AuthorizedRepresentative
              as_user_id: "${rep_lit_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /brand-protection/cases/${case_id}/cease-desist"
              payload: { letter_ref: "CD-2" }
              as: AuthorizedRepresentative
              as_user_id: "${rep_td_id}"
          assert:
            - "the AUTHORIZE_LITIGATION designation returns HTTP 403 with data.error_id == ERR_REPRESENTATIVE_SCOPE_INSUFFICIENT"
            - "EnforcementCase.${case_id}.correspondence_status == NONE after the refusal"
