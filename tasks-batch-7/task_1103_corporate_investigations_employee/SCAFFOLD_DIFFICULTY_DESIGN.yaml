              as_user_id: "inv-1"
              captures: { f1: $.data.id }
            - { call: "POST /api/findings/${f1}/transition", payload: { to_status: CALIBRATED, consistency_level: MEDIUM, subject_admission: false, finding_type: INCONCLUSIVE }, as: HRBusinessPartner, as_user_id: "hr-1" }
            - call: "GET /api/cases/${case_id}"
