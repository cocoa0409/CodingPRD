          setup: ["Vessel with plan rev1 SUBMITTED"]
          setup_api_calls:
            - call: "POST /vessels"
              payload: { imo_number: "9100057", vessel_name: "MV Hobbyist", bwms_type: TREATMENT_USCG_TYPE_APPROVED, bwms_installation_date: "2025-01-15T00:00:00Z", gross_tonnage: 40000, keel_laid_date: "2010-10-01T00:00:00Z", ballast_capacity_m3: 30000 }
