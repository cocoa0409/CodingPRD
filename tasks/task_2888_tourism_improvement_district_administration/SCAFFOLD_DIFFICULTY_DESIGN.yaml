  - rule_id: non_linear_state_machine
    instances:

      - name: statement_filing_and_payment_dimensions_advance_independently
        grounds:
          - state_machines.AssessmentStatement.filing_status
          - state_machines.AssessmentStatement.payment_status
          - complexity_profile.state_machine_shape
          - calculations.payment_status_derivation
        distinguishing_aspect: |
          AssessmentStatement carries two parallel state dimensions on one row. A payment moves the
          payment dimension while the filing dimension stands still, and an audit moves the filing
          dimension while the payment dimension stands still, so the row passes through
          FILED/PARTIALLY_PAID, AUDITED/PARTIALLY_PAID, AUDITED/PAID_IN_FULL and
          CERTIFIED/PAID_IN_FULL — a combination lattice no single linear machine can express.
        test_recipe:
          setup:
            - "district ACTIVE, period FY2027-Q1 open, statement for b1 filed at 824,500"
            - "one partial remittance of 300,000 already applied, leaving 524,500 outstanding"
            - "period closed so that an audit is admissible"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
            - *k_generate_q1
            - *k_find_st_b1
            - *k_file_st1_824500
            - &k_remit_300000
              call: "POST /assessment-statements/${st1_id}/remittances"
              payload: { amount_cents: 300000, received_on: "2026-08-01T00:00:00Z", method: "ACH" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { rem1_id: "$.data.id" }
            - *k_clock_period_end
            - *k_close_q1
          trigger:
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "AUDIT", audit_note: "reported figures accepted without change" }
              as: IndependentAuditor
              as_user_id: "auditor-01"
            - call: "POST /assessment-statements/${st1_id}/remittances"
              payload: { amount_cents: 524500, received_on: "2026-11-05T00:00:00Z", method: "WIRE" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "POST /assessment-statements/${st1_id}/audit-certification"
              payload: { action: "CERTIFY", audit_note: "certified for the district's annual audit file" }
              as: IndependentAuditor
              as_user_id: "auditor-02"
          assert:
            - "after the partial remittance and before the audit, AssessmentStatement.${st1_id}.filing_status == FILED and payment_status == PARTIALLY_PAID"
            - "after the AUDIT action, AssessmentStatement.${st1_id}.filing_status == AUDITED and payment_status is still PARTIALLY_PAID"
            - "after the second remittance, AssessmentStatement.${st1_id}.filing_status is still AUDITED and payment_status == PAID_IN_FULL"
            - "AssessmentStatement.${st1_id}.principal_paid_cents == 824500"
            - "AssessmentStatement.${st1_id}.total_due_cents == 0"
            - "AssessmentStatement.${st1_id}.credit_balance_cents == 0"
            - "after the CERTIFY action, AssessmentStatement.${st1_id}.filing_status == CERTIFIED and payment_status is still PAID_IN_FULL"
            - "District.${d_id}.collected_to_date_cents == 824500"

      - name: dispute_info_request_cycle_repeats_but_appeal_cycle_is_one_shot
        grounds:
          - state_machines.AssessmentDispute
          - entities.AssessmentDispute.fields.appeal_count
          - validations.ERR_APPEAL_LIMIT_EXCEEDED
        distinguishing_aspect: |
          The dispute machine has two loops with different budgets: UNDER_REVIEW to INFO_REQUESTED and
          back may run any number of times without incrementing appeal_count, while
          RESOLVED_UPHELD back to UNDER_REVIEW is capped at MAX_APPEALS, so the second appeal is
          refused with 409 even though the dispute sits in exactly the same RESOLVED_UPHELD state
          from which the first appeal was granted.
        test_recipe:
          setup:
            - "district ACTIVE, statement for b1 filed at 824,500"
            - "a CALCULATION_ERROR dispute claiming 400,000 filed by the b1 operator"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
            - *k_generate_q1
            - *k_find_st_b1
            - *k_file_st1_824500
            - &k_dispute_calc_error
              call: "POST /assessment-disputes"
              payload: { assessment_statement_id: "${st1_id}", dispute_type: "CALCULATION_ERROR", claimed_adjustment_cents: 400000, dispute_note: "zone rate applied to gross rather than net room revenue" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { dsp_id: "$.data.id" }
          trigger:
            - call: "POST /assessment-disputes/${dsp_id}/proceedings"
              payload: { action: "OPEN_REVIEW", note: "docketed" }
              as: HearingOfficer
              as_user_id: "hearing-01"
            - call: "POST /assessment-disputes/${dsp_id}/proceedings"
              payload: { action: "REQUEST_INFO", note: "provide the nightly rate roll" }
              as: HearingOfficer
              as_user_id: "hearing-01"
            - call: "POST /assessment-disputes/${dsp_id}/proceedings"
              payload: { action: "SUBMIT_RESPONSE", note: "rate roll attached" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "POST /assessment-disputes/${dsp_id}/proceedings"
              payload: { action: "REQUEST_INFO", note: "also provide the occupancy detail" }
              as: HearingOfficer
              as_user_id: "hearing-01"
            - call: "POST /assessment-disputes/${dsp_id}/proceedings"
              payload: { action: "SUBMIT_RESPONSE", note: "occupancy detail attached" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "POST /assessment-disputes/${dsp_id}/resolution"
              payload: { outcome: "UPHELD", resolution_note: "assessment computed correctly" }
              as: HearingOfficer
              as_user_id: "hearing-01"
            - call: "POST /assessment-disputes/${dsp_id}/proceedings"
              payload: { action: "APPEAL", note: "operator appeals the determination" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "POST /assessment-disputes/${dsp_id}/resolution"
              payload: { outcome: "UPHELD", resolution_note: "determination affirmed on appeal" }
              as: HearingOfficer
              as_user_id: "hearing-01"
            - call: "POST /assessment-disputes/${dsp_id}/proceedings"
              payload: { action: "APPEAL", note: "operator attempts a second appeal" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
          assert:
            - "after the two REQUEST_INFO / SUBMIT_RESPONSE cycles, AssessmentDispute.${dsp_id}.status == UNDER_REVIEW and appeal_count == 0"
            - "after the first resolution, AssessmentDispute.${dsp_id}.status == RESOLVED_UPHELD and granted_adjustment_cents == 0"
            - "after the first APPEAL, AssessmentDispute.${dsp_id}.status == UNDER_REVIEW and appeal_count == 1"
            - "after the second resolution, AssessmentDispute.${dsp_id}.status == RESOLVED_UPHELD and appeal_count == 1"
            - "the second APPEAL returns ERR_APPEAL_LIMIT_EXCEEDED with HTTP 409"
            - "AssessmentDispute.${dsp_id}.status is still RESOLVED_UPHELD and appeal_count is still 1 after the refused appeal"
            - "AssessmentStatement.${st1_id}.effective_assessment_cents == 824500, unchanged by any of the proceedings"

  - rule_id: transitive_cascade
    instances:

      - name: delinquency_sweep_cascades_four_hops_into_renewal_petition_support
        grounds:
          - state_machines.AssessmentPeriod.CLOSED_to_DELINQUENCY_SWEPT
          - state_machines.PetitionSignature.VALID_to_DISQUALIFIED
          - calculations.delinquency_charges
          - calculations.petition_support
          - entities.LodgingBusiness.fields.compliance_standing
        distinguishing_aspect: |
          One sweep call sets off a four-link chain in which every link is caused by the mutation the
          previous link wrote: the statement is stamped DELINQUENT, the stamp writes penalty and
          interest, those charges push the property's strike count to 2 and its standing to SUSPENDED,
          and the SUSPENDED standing disqualifies that property's signature on an unrelated OPEN
          renewal petition, collapsing the drive's weighted support from 0.6000 to 0.0000. The first
          sweep deliberately stops at WATCH so only the second sweep completes the chain.
        test_recipe:
          setup:
            - "district ACTIVE with term_years 1, so expiration_date is 2027-08-01 and the 180-day renewal window opens 2027-02-02"
            - "period FY2027-Q1 [2026-08-01, 2026-11-01) due 2026-11-15 grace 10 (deadline 2026-11-25) with b1 filed at 824,500, closed and unpaid"
            - "period FY2027-Q2 [2026-11-01, 2027-02-01) due 2027-02-15 grace 10 (deadline 2027-02-25) with b1 filed at 824,500, closed and unpaid"
            - "an OPEN RENEWAL petition drive created at clock 2027-02-10 and signed by b1, giving weighted support 0.6000 and headcount support 0.2500"
          setup_api_calls:
            - *k_clock_form
            - *k_district
            - *k_b1
            - *k_b2
            - *k_b3
            - *k_b4
            - *k_formation_drive
            - *k_sign_b1
            - *k_tally_formation
            - *k_certify_formation
            - *k_activate
            - *k_period_q1
            - *k_generate_q1
            - *k_find_st_b1
            - *k_file_st1_824500
            - *k_clock_period_end
            - *k_close_q1
            - &k_period_q2
              call: "POST /assessment-periods"
              payload: { district_id: "${d_id}", period_label: "FY2027-Q2", period_start: "2026-11-01T00:00:00Z", period_end: "2027-02-01T00:00:00Z", due_date: "2027-02-15T00:00:00Z", grace_days: 10 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { ap2_id: "$.data.id" }
            - call: "POST /assessment-periods/${ap2_id}/statement-generation"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "GET /assessment-periods/${ap2_id}/statements"
              payload: { lodging_business_id: "${b1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { st1_q2_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-10T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-statements/${st1_q2_id}/filings"
              payload: { reported_room_nights: 2000, reported_gross_room_revenue_cents: 41225000 }
              as: LodgingOperator
              as_user_id: "${b1_id}"
            - call: "POST /petition-drives"
              payload: { district_id: "${d_id}", drive_type: "RENEWAL", closes_at: "2027-04-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { rpd_id: "$.data.id" }
            - call: "POST /petition-drives/${rpd_id}/signatures"
              payload: { lodging_business_id: "${b1_id}" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { rsig_id: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-11T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
