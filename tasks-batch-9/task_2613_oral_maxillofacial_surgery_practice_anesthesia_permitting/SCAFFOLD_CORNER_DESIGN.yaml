              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
              captures: { eval2_id: $.data.id }
          assert:
            - "trigger[0]: HTTP 412 with data.error_id == ERR_STALE_CASE_VERSION"
            - "after trigger[0]: GET /pre-anesthesia-evaluations?case_id=${case_id} still returns total_count == 1 and SurgicalCase version == ${case_v1}"
            - "trigger[2]: HTTP 201 with provisional_risk_score == 15.0 (10 * 3 = 30 core, LOCAL multiplier 0.5) and status DRAFT"
            - "after trigger[2]: two evaluations exist; ${eval1_id} is still DRAFT (only SIGNED or VERIFIED rows are superseded) and clearance_status is NOT_EVALUATED"

