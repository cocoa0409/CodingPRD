          setup:
            - "Logical clock at 2026-09-20T00:00:00Z. One franchisee, one ACTIVE store, one ACTIVE agreement and one shrink audit for [2026-08-01, 2026-09-01) counted to physical_inventory_cents 3850000 against book_inventory_cents 4000000."
