              as: FacilityAdmin
            - call: "POST /reservations/${rs2}/mark-no-show"
              payload: {}
              as: FacilityAdmin
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: FacilityAdmin
              captures: { lv3: $.data.version }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-06-30T10:25:00Z", scheduled_end: "2026-07-01T09:50:00Z", prepaid: false, expected_lot_version: "${lv3}" }
              as: FacilityAdmin
              captures: { rs3: $.data.id }
            - call: "POST /_clock/set"
