              captures: { ct_status: $.data.status, committed_after: $.data.sessions_committed }
          assert:
            - "Case.${case_id}.funding_status == REVOKED"
            - "CounselingSession.${s_scheduled}.status == CANCELLED"
            - "CounselingSession.${s_completed}.status == COMPLETED"
            - "EmployerContract.${c_id}.sessions_committed == 1"
            - "Claim.${claim_id}.status == REJECTED"

      - name: crisis_escalate_creates_referral_bumps_provider_count
        grounds:
          - state_machines.CrisisContact.TRIAGED_to_ESCALATED
          - state_machines.Referral.REQUESTED_to_ACCEPTED
          - entities.Provider.fields.active_referral_count
          - entities.Referral.fields.status
        distinguishing_aspect: "Depth-2 chain from a different trigger (crisis escalate): escalate -> CLINICAL Referral created in REQUESTED (hop1) -> selected Provider.active_referral_count incremented (hop2)."
        test_recipe:
          setup:
