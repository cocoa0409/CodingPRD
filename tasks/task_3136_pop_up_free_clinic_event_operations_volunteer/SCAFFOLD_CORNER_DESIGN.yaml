# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Pop-Up Free Clinic Event Operations & Volunteer Licensing
# =============================================================================
# Breadth probe: enumerates testable claims from SCAFFOLD.yaml §1.1–§1.7 NOT
# already covered by §1.8. Sections and claim_types follow the
# claim-extraction-guide taxonomy.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: clinic_event_creation_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.ClinicEvent]
        distinguishing_aspect: "POST /clinic-events with all required fields returns 201 with posture == PLANNING, all computed counters at 0, version == 1, and server-minted UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-TN-100", name: "Corner Event", host_state_code: "TN", service_date: "2027-01-16", doors_open_utc: "2027-01-16T10:00:00Z", total_patient_capacity: 10 }
              as: EventDirector
              captures: { ce1: $.data.id, ce1_posture: $.data.posture, ce1_v: $.data.version }
          trigger:
            - call: "GET /clinic-events/${ce1}"
              payload: {}
              as: EventDirector
          assert:
            - "ClinicEvent.${ce1}.posture == PLANNING"
            - "ClinicEvent.${ce1}.tickets_issued_count == 0 AND tickets_served_count == 0 AND unmet_demand_count == 0"
            - "ClinicEvent.${ce1}.version == 1"

      - name: clinic_event_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.ClinicEvent, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required total_patient_capacity on event creation fails with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-BAD", name: "No Capacity", host_state_code: "TN", service_date: "2027-01-16", doors_open_utc: "2027-01-16T10:00:00Z" }
              as: EventDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"

      - name: site_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Site, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "site_type outside {ARENA, FAIRGROUND, SCHOOL} is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { site_name: "Stadium", site_type: "STADIUM", state_code: "TN", square_footage: 5000, has_loading_dock: false, power_capacity_kw: 50.0, sterilization_capable: false }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION"

      - name: volunteer_duplicate_email_conflict
        claim_type: creation
        grounds: [entities.Volunteer, "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Second volunteer registration with the same email is rejected with ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["one volunteer registered with email dup@x.com"]
          setup_api_calls:
            - call: "POST /volunteers"
              payload: { full_name: "First", email: "dup@x.com", discipline: "GENERAL", license_number: "", license_state_code: "", license_expiry_date: "" }
              as: VolunteerCoordinator
          trigger:
            - call: "POST /volunteers"
              payload: { full_name: "Second", email: "dup@x.com", discipline: "GENERAL", license_number: "", license_state_code: "", license_expiry_date: "" }
              as: VolunteerCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_EMAIL"

      - name: referral_record_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.ReferralRecord]
        distinguishing_aspect: "ReferralRecord has common_fields: false — responses expose id and created_at but no version/updated_at, and no update/delete endpoint exists for it."
        test_recipe:
          setup:
            - "Event IN_SERVICE; a COMPLETED encounter with requires_followup=true and one referral created in the complete bundle"
          setup_api_calls:
            - call: "POST /sites"
              payload: { site_name: "School RR", site_type: "SCHOOL", state_code: "VA", square_footage: 8000, has_loading_dock: false, power_capacity_kw: 90.0, sterilization_capable: false }
              as: LogisticsCoordinator
              captures: { srr: $.data.id }
            - call: "POST /sites/${srr}/vet"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-VA-RR", name: "Referral Event", host_state_code: "VA", service_date: "2026-10-31", doors_open_utc: "2026-10-31T10:00:00Z", total_patient_capacity: 10 }
              as: EventDirector
              captures: { evrr: $.data.id, evrr_v: $.data.version }
            - call: "POST /clinic-events/${evrr}/site-agreements"
              payload: { site_id: "${srr}", host_org_name: "Board", liability_cap_cents: 5000000, insurance_certificate_ref: "CRR", expected_event_version: "${evrr_v}" }
              as: LogisticsCoordinator
              captures: { agrr: $.data.id }
            - call: "POST /clinic-events/${evrr}/site-agreements/${agrr}/submit"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${evrr}/site-agreements/${agrr}/confirm"
              payload: {}
              as: EventDirector
            - call: "POST /clinic-events/${evrr}/stations"
              payload: { station_label: "M-RR", station_type: "MEDICAL", chair_count: 1, minutes_per_patient: 15, requires_sterilization: false, service_window_open_utc: "2026-10-31T11:00:00Z", service_window_close_utc: "2026-10-31T19:00:00Z" }
              as: LogisticsCoordinator
              captures: { strr: $.data.id }
            - call: "POST /clinic-events/${evrr}/stations/${strr}/mark-set-up"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /volunteers"
              payload: { full_name: "Med RR", email: "mrr@x.com", discipline: "MEDICAL", license_number: "LRR", license_state_code: "VA", license_expiry_date: "2027-06-01" }
              as: VolunteerCoordinator
              captures: { vrr: $.data.id }
            - call: "POST /volunteers/${vrr}/request-verification"
              payload: { clinic_event_id: "${evrr}", reviewer_notes: "ok" }
              as: VolunteerCoordinator
              captures: { lvrr: $.data.id }
            - call: "POST /volunteers/${vrr}/license-verifications/${lvrr}/approve"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /clinic-events/${evrr}/assignments"
              payload: { volunteer_id: "${vrr}", shift_code: "FULL_DAY" }
              as: VolunteerCoordinator
            - call: "GET /clinic-events/${evrr}"
              payload: {}
              as: EventDirector
              captures: { evrr_v2: $.data.version }
            - call: "POST /volunteers/${vrr}/authorize"
              payload: { clinic_event_id: "${evrr}", expected_event_version: "${evrr_v2}" }
              as: VolunteerCoordinator
            - call: "POST /clinic-events/${evrr}/open-doors"
              payload: {}
              as: EventDirector
            - call: "POST /clinic-events/${evrr}/tickets"
              payload: { patient_ref: "P-RR", arrival_utc: "2026-10-31T09:00:00Z", requested_service: "MEDICAL", priority_tier: "STANDARD" }
              as: QueueMarshal
              captures: { trr: $.data.id }
            - call: "POST /clinic-events/${evrr}/tickets/${trr}/call"
              payload: {}
              as: QueueMarshal
            - call: "POST /clinic-events/${evrr}/tickets/${trr}/begin-service"
              payload: { station_id: "${strr}", volunteer_id: "${vrr}", encounter_type: "MEDICAL_CONSULT", findings_summary: "hypertension", requires_followup: true }
              as: StationLead
              captures: { encrr: $.data.id }
            - call: "POST /clinic-events/${evrr}/encounters/${encrr}/complete"
              payload: { referrals: [{ referral_type: "MEDICAL_FOLLOWUP", partner_org_name: "Free Clinic Roanoke", urgency: "ROUTINE", notes: "BP recheck" }] }
              as: StationLead
          trigger:
            - call: "GET /clinic-events/${evrr}/encounters/${encrr}/referrals"
              payload: {}
              as: StationLead
              captures: { ref0: "$.data[0].id" }
          assert:
            - "ReferralRecord list has exactly 1 element with referral_type == MEDICAL_FOLLOWUP"
            - "ReferralRecord response carries id and created_at but no version field (common_fields: false immutability)"

      - name: get_nonexistent_event_returns_404
        claim_type: not_found
        grounds: [entities.ClinicEvent, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /clinic-events/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clinic-events/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EventDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: events_list_pagination_envelope
        claim_type: listing
        grounds: [entities.ClinicEvent, response_envelope]
        distinguishing_aspect: "GET /clinic-events with limit=1 after creating 2 events returns 1 item, total_count == 2, has_more == true."
        test_recipe:
          setup: ["two events created"]
          setup_api_calls:
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-P1", name: "Page1", host_state_code: "TN", service_date: "2027-02-06", doors_open_utc: "2027-02-06T10:00:00Z", total_patient_capacity: 10 }
              as: EventDirector
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-P2", name: "Page2", host_state_code: "TN", service_date: "2027-02-13", doors_open_utc: "2027-02-13T10:00:00Z", total_patient_capacity: 10 }
              as: EventDirector
          trigger:
            - call: "GET /clinic-events?limit=1&offset=0"
              payload: {}
              as: EventDirector
          assert:
            - "response envelope contains pagination fields limit, offset, total_count, has_more"
            - "total_count == 2 AND has_more == true AND len(data) == 1"

      - name: system_fields_ignore_client_input
        claim_type: system_fields
        grounds: [entities.ClinicEvent]
        distinguishing_aspect: "Client-supplied id/version/created_at in a create payload are ignored; server mints its own values."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-SYS", name: "Sys Fields", host_state_code: "TN", service_date: "2027-02-20", doors_open_utc: "2027-02-20T10:00:00Z", total_patient_capacity: 10, id: "11111111-1111-1111-1111-111111111111", version: 99 }
              as: EventDirector
              captures: { sys_id: $.data.id, sys_v: $.data.version }
          assert:
            - "returned id != '11111111-1111-1111-1111-111111111111' (client input ignored)"
            - "returned version == 1 (server-owned)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_terminal_event_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ClinicEvent, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already CANCELLED event fails with ERR_INVALID_STATE; terminal lockdown."
        test_recipe:
          setup: ["Event cancelled once"]
          setup_api_calls:
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-C1", name: "Cancel Twice", host_state_code: "TN", service_date: "2027-03-06", doors_open_utc: "2027-03-06T10:00:00Z", total_patient_capacity: 10 }
              as: EventDirector
              captures: { cev1: $.data.id }
            - call: "POST /clinic-events/${cev1}/cancel"
              payload: {}
              as: EventDirector
          trigger:
            - call: "POST /clinic-events/${cev1}/cancel"
              payload: {}
              as: EventDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "ClinicEvent.${cev1}.posture == CANCELLED"

      - name: open_doors_twice_idempotency_rejected
        claim_type: idempotency
        grounds: [state_machines.ClinicEvent.READY_to_IN_SERVICE]
        distinguishing_aspect: "Second open-doors on an IN_SERVICE event is rejected (ERR_INVALID_STATE) — same trigger twice is not silently accepted."
        test_recipe:
          setup: ["Event fully ready and opened once"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { site_name: "School OD", site_type: "SCHOOL", state_code: "VA", square_footage: 8000, has_loading_dock: false, power_capacity_kw: 90.0, sterilization_capable: false }
              as: LogisticsCoordinator
              captures: { sod: $.data.id }
            - call: "POST /sites/${sod}/vet"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-OD", name: "Open Doors", host_state_code: "VA", service_date: "2027-03-13", doors_open_utc: "2027-03-13T10:00:00Z", total_patient_capacity: 10 }
              as: EventDirector
              captures: { evod: $.data.id, evod_v: $.data.version }
            - call: "POST /clinic-events/${evod}/site-agreements"
              payload: { site_id: "${sod}", host_org_name: "Board", liability_cap_cents: 5000000, insurance_certificate_ref: "COD", expected_event_version: "${evod_v}" }
              as: LogisticsCoordinator
              captures: { agod: $.data.id }
            - call: "POST /clinic-events/${evod}/site-agreements/${agod}/submit"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${evod}/site-agreements/${agod}/confirm"
              payload: {}
              as: EventDirector
            - call: "POST /clinic-events/${evod}/stations"
              payload: { station_label: "M-OD", station_type: "MEDICAL", chair_count: 1, minutes_per_patient: 15, requires_sterilization: false, service_window_open_utc: "2027-03-13T11:00:00Z", service_window_close_utc: "2027-03-13T19:00:00Z" }
              as: LogisticsCoordinator
              captures: { stod: $.data.id }
            - call: "POST /clinic-events/${evod}/stations/${stod}/mark-set-up"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /volunteers"
              payload: { full_name: "Med OD", email: "mod@x.com", discipline: "MEDICAL", license_number: "LOD", license_state_code: "VA", license_expiry_date: "2028-01-01" }
              as: VolunteerCoordinator
              captures: { vod: $.data.id }
            - call: "POST /volunteers/${vod}/request-verification"
              payload: { clinic_event_id: "${evod}", reviewer_notes: "ok" }
              as: VolunteerCoordinator
              captures: { lvod: $.data.id }
            - call: "POST /volunteers/${vod}/license-verifications/${lvod}/approve"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /clinic-events/${evod}/assignments"
              payload: { volunteer_id: "${vod}", shift_code: "FULL_DAY" }
              as: VolunteerCoordinator
            - call: "GET /clinic-events/${evod}"
              payload: {}
              as: EventDirector
              captures: { evod_v2: $.data.version }
            - call: "POST /volunteers/${vod}/authorize"
              payload: { clinic_event_id: "${evod}", expected_event_version: "${evod_v2}" }
              as: VolunteerCoordinator
            - call: "POST /clinic-events/${evod}/open-doors"
              payload: {}
              as: EventDirector
          trigger:
            - call: "POST /clinic-events/${evod}/open-doors"
              payload: {}
              as: EventDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (READY -> IN_SERVICE already consumed)"
            - "ClinicEvent.${evod}.posture == IN_SERVICE"

      - name: ticket_call_requires_in_service_posture
        claim_type: precondition_enforcement
        grounds: [state_machines.PatientTicket.QUEUED_to_CALLED, "errors[ERR_EVENT_POSTURE_FORBIDS]"]
        distinguishing_aspect: "Calling a ticket while the event is not IN_SERVICE fails with ERR_EVENT_POSTURE_FORBIDS even though the ticket itself is QUEUED."
        test_recipe:
          setup: ["Event READY (not opened); one QUEUED ticket cannot exist before IN_SERVICE, so the test issues the ticket AFTER open-doors, then ends service to leave posture TEARDOWN with no active tickets, then reuses a second event — simpler: create event, get to IN_SERVICE, issue ticket, end-service only fails with queued tickets; instead call a ticket on a second event that is SITE_LOCKED"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { site_name: "School TC", site_type: "SCHOOL", state_code: "VA", square_footage: 8000, has_loading_dock: false, power_capacity_kw: 90.0, sterilization_capable: false }
              as: LogisticsCoordinator
              captures: { stc: $.data.id }
            - call: "POST /sites/${stc}/vet"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-TC", name: "Ticket Call", host_state_code: "VA", service_date: "2027-03-20", doors_open_utc: "2027-03-20T10:00:00Z", total_patient_capacity: 10 }
              as: EventDirector
              captures: { evtc: $.data.id, evtc_v: $.data.version }
            - call: "POST /clinic-events/${evtc}/site-agreements"
              payload: { site_id: "${stc}", host_org_name: "Board", liability_cap_cents: 5000000, insurance_certificate_ref: "CTC", expected_event_version: "${evtc_v}" }
              as: LogisticsCoordinator
              captures: { agtc: $.data.id }
            - call: "POST /clinic-events/${evtc}/site-agreements/${agtc}/submit"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${evtc}/site-agreements/${agtc}/confirm"
              payload: {}
              as: EventDirector
            - call: "POST /clinic-events/${evtc}/tickets"
              payload: { patient_ref: "P-TC", arrival_utc: "2027-03-20T09:00:00Z", requested_service: "MEDICAL", priority_tier: "STANDARD" }
              as: QueueMarshal
              captures: { err_issue: $.data.error_id }
          trigger:
            - call: "GET /clinic-events/${evtc}"
              payload: {}
              as: EventDirector
          assert:
            - "error_id on ticket issue == ERR_EVENT_POSTURE_FORBIDS (ticketing is a child mutation gated to IN_SERVICE posture; SITE_LOCKED forbids it)"
            - "ClinicEvent.${evtc}.tickets_issued_count == 0"

      - name: verification_deny_terminal_code_rejects_volunteer
        claim_type: side_effect_execution
        grounds: [state_machines.LicenseVerification.PENDING_to_DENIED, state_machines.Volunteer.VERIFICATION_PENDING_to_REJECTED]
        distinguishing_aspect: "Denying a verification with denial_code UNVERIFIABLE cascades the volunteer to REJECTED; denial with LICENSE_EXPIRED leaves the volunteer eligible to re-request."
        test_recipe:
          setup: ["Two volunteers VERIFICATION_PENDING on the same event"]
          setup_api_calls:
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-DN", name: "Deny Event", host_state_code: "TN", service_date: "2027-04-03", doors_open_utc: "2027-04-03T10:00:00Z", total_patient_capacity: 10 }
              as: EventDirector
              captures: { evdn: $.data.id }
            - call: "POST /volunteers"
              payload: { full_name: "Vol A", email: "vad@x.com", discipline: "DENTAL", license_number: "LA", license_state_code: "TN", license_expiry_date: "2028-01-01" }
              as: VolunteerCoordinator
              captures: { vad: $.data.id }
            - call: "POST /volunteers"
              payload: { full_name: "Vol B", email: "vbd@x.com", discipline: "DENTAL", license_number: "LB", license_state_code: "TN", license_expiry_date: "2028-01-01" }
              as: VolunteerCoordinator
              captures: { vbd: $.data.id }
            - call: "POST /volunteers/${vad}/request-verification"
              payload: { clinic_event_id: "${evdn}", reviewer_notes: "a" }
              as: VolunteerCoordinator
              captures: { lvad: $.data.id }
            - call: "POST /volunteers/${vbd}/request-verification"
              payload: { clinic_event_id: "${evdn}", reviewer_notes: "b" }
              as: VolunteerCoordinator
              captures: { lvbd: $.data.id }
          trigger:
            - call: "POST /volunteers/${vad}/license-verifications/${lvad}/deny"
              payload: { denial_code: "UNVERIFIABLE" }
              as: CredentialingOfficer
            - call: "POST /volunteers/${vbd}/license-verifications/${lvbd}/deny"
              payload: { denial_code: "LICENSE_EXPIRED" }
              as: CredentialingOfficer
          assert:
            - "Volunteer.${vad}.status == REJECTED (terminal denial code cascades)"
            - "Volunteer.${vbd}.status != REJECTED (LICENSE_EXPIRED denial leaves re-request path open)"

      - name: encounter_abandon_returns_ticket_to_queue
        claim_type: compensation
        grounds: [state_machines.PatientEncounter.OPEN_to_ABANDONED]
        distinguishing_aspect: "Abandoning an OPEN encounter compensates by returning the ticket IN_SERVICE -> QUEUED with a new tail queue_position; no encounter/ticket count drift."
        test_recipe:
          setup: ["Event IN_SERVICE; one ticket IN_SERVICE with an OPEN encounter; tickets_issued_count == 1"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { site_name: "School AB", site_type: "SCHOOL", state_code: "VA", square_footage: 8000, has_loading_dock: false, power_capacity_kw: 90.0, sterilization_capable: false }
              as: LogisticsCoordinator
              captures: { sab: $.data.id }
            - call: "POST /sites/${sab}/vet"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events"
              payload: { event_code: "RAM-AB", name: "Abandon Event", host_state_code: "VA", service_date: "2027-04-10", doors_open_utc: "2027-04-10T10:00:00Z", total_patient_capacity: 10 }
              as: EventDirector
              captures: { evab: $.data.id, evab_v: $.data.version }
            - call: "POST /clinic-events/${evab}/site-agreements"
              payload: { site_id: "${sab}", host_org_name: "Board", liability_cap_cents: 5000000, insurance_certificate_ref: "CAB", expected_event_version: "${evab_v}" }
              as: LogisticsCoordinator
              captures: { agab: $.data.id }
            - call: "POST /clinic-events/${evab}/site-agreements/${agab}/submit"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /clinic-events/${evab}/site-agreements/${agab}/confirm"
              payload: {}
              as: EventDirector
            - call: "POST /clinic-events/${evab}/stations"
              payload: { station_label: "M-AB", station_type: "MEDICAL", chair_count: 1, minutes_per_patient: 15, requires_sterilization: false, service_window_open_utc: "2027-04-10T11:00:00Z", service_window_close_utc: "2027-04-10T19:00:00Z" }
              as: LogisticsCoordinator
              captures: { stab: $.data.id }
            - call: "POST /clinic-events/${evab}/stations/${stab}/mark-set-up"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /volunteers"
              payload: { full_name: "Med AB", email: "mab@x.com", discipline: "MEDICAL", license_number: "LAB", license_state_code: "VA", license_expiry_date: "2028-01-01" }
              as: VolunteerCoordinator
              captures: { vab: $.data.id }
            - call: "POST /volunteers/${vab}/request-verification"
              payload: { clinic_event_id: "${evab}", reviewer_notes: "ok" }
              as: VolunteerCoordinator
              captures: { lvab: $.data.id }
            - call: "POST /volunteers/${vab}/license-verifications/${lvab}/approve"
              payload: {}
              as: CredentialingOfficer
            - call: "POST /clinic-events/${evab}/assignments"
              payload: { volunteer_id: "${vab}", shift_code: "FULL_DAY" }
              as: VolunteerCoordinator
            - call: "GET /clinic-events/${evab}"
              payload: {}
