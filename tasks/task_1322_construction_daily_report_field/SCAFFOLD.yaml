  - { id: ERR_DELAY_EVENT_NOT_FOUND, http: 404, condition: "DelayEvent id does not exist" }
  - { id: ERR_OBSERVATION_NOT_FOUND, http: 404, condition: "SafetyObservation id does not exist" }
