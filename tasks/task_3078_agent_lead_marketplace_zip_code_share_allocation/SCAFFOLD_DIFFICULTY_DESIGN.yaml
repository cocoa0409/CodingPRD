          asg9: $.data[0].id
      - call: POST /lead-assignments/${asg9}/accept
        payload:
          expected_lead_version: ${ld9a_v}
        as: Agent
        as_user_id: ${afull}
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-11T00:00:00Z'
        as: PlatformAdmin
      - call: POST /share-orders
        payload:
          market_id: ${mkt9}
          buyer_agent_id: ${afull}
          share_bps: 2000
          duration_days: 30
        as: Agent
        as_user_id: ${afull}
        captures:
          osmall: $.data.id
      - call: POST /share-orders/${osmall}/payments
        payload:
          amount_cents: 4500000
          outcome: SUCCEEDED
          expected_market_version: ${mkt9_v} + 1
        as: Agent
        as_user_id: ${afull}
        captures:
          cap_err: $.data.error_id
      - call: POST /leads
        payload:
          market_id: ${mkt9}
          listing_id: null
          consumer_key: c-race@x.com
          listing_agent_id: null
        as: MarketplaceOps
        captures:
          dup_err: $.data.error_id
      assert:
      - cap_err == ERR_SHARE_CAPACITY_EXCEEDED (priority 7 business_constraint) on the second activation while allocated == 10000
      - dup_err == ERR_DUPLICATE_LEAD (priority 9 business_temporal) on the repeat intake 10 days later
      - when a single lead intake violates both rules, the response error_id is ERR_DUPLICATE_LEAD only when capacity is not also violated — and
        a hypothetical combined failure surfaces ERR_SHARE_CAPACITY_EXCEEDED first because priority 7 precedes priority 9
  - name: expired_offer_vs_not_candidate_conflict
    grounds:
    - validations[priority=8]
    - state_machines.LeadAssignment.OFFERED_to_ACCEPTED
    - errors.ERR_OFFER_EXPIRED
