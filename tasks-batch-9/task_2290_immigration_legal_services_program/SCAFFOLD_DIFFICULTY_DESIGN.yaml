              payload: { matter_id: "${m1_id}", event_type: "INDIVIDUAL_HEARING", starts_at_utc: "2026-09-10T09:00:00.000Z", ends_at_utc: "2026-09-10T11:00:00.000Z", location_code: "EOIRA", assigned_representative_id: "${rep_a_id}" }
              as: ProgramDirector
              captures: { x_event_id: "$.data.id" }
          trigger:
            - call: "POST /calendar-events"
              payload: { matter_id: "${m2_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-10T12:00:00.000Z", ends_at_utc: "2026-09-10T12:30:00.000Z", location_code: "USCISB", assigned_representative_id: "${rep_a_id}" }
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${m2_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-10T11:59:59.999Z", ends_at_utc: "2026-09-10T12:29:59.999Z", location_code: "USCISB", assigned_representative_id: "${rep_a_id}" }
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${m2_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-10T11:00:00.000Z", ends_at_utc: "2026-09-10T11:30:00.000Z", location_code: "EOIRA", assigned_representative_id: "${rep_a_id}" }
              as: ProgramDirector
          assert:
            - "Setup event ${x_event_id} has status 'SCHEDULED' and travel_buffer_minutes == 60."
            - "trigger step 1 returns HTTP 201: X ends 11:00:00.000, the buffer is 60 minutes because 'USCISB' != 'EOIRA', so x_end_effective is exactly 12:00:00.000 and the half-open test candidate.starts_at_utc < x_end_effective is FALSE at 12:00:00.000; the new row has travel_buffer_minutes == 30 (BIOMETRICS)."
            - "trigger step 2 returns HTTP 409 with error_id 'ERR_REPRESENTATIVE_CALENDAR_CONFLICT': 11:59:59.999 < 12:00:00.000 by one millisecond. It must NOT be 'ERR_CLIENT_CALENDAR_CONFLICT' even though the interval also collides with client ${c2_id}'s own 12:00-12:30 event, because geometry A is evaluated before geometry B."
