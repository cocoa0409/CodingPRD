        claim_type: Priority Ordering
        grounds:
          - validations[priority=13]
          - validations[priority=21]
          - errors.ERR_REPORT_NOT_AUDITABLE
          - endpoints[POST /retrans/expiration-sweep]
        distinguishing_aspect: "A swept report violates both the ACCEPTED-state rule at priority 13 and the 180-day window rule at priority 21; the response must be 409 ERR_REPORT_NOT_AUDITABLE, never 422 ERR_AUDIT_WINDOW_EXPIRED."
        test_recipe:
          setup:
            - "One CBS station, one CABLE distributor and one 2027-01 report with no findings"
            - "Clock moved to 2027-08-01 and one sweep run, which accepts the report"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
