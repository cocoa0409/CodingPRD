            - "the response is NOT 422 ERR_NO_ELIGIBLE_ITEMS"
            - "GET /pos-transactions?store_id=${store_id} returns total_count == 0 (nothing is persisted)"
            - "TerminalDeployment.${dep_id}.status == RESERVED"

      - name: all_ineligible_basket_declines_with_no_eligible_items
        claim_type: Violation → Error
        grounds:
          - validations.priority_19_business_fiscal
          - errors.ERR_NO_ELIGIBLE_ITEMS
          - calculations.pos_eligibility_split_tender
        distinguishing_aspect: "Every line is ineligible so the eligible subtotal is 0: the sale is persisted DECLINED with decline_reason_code NO_ELIGIBLE_ITEMS, both tender fields are 0 even though 5000c was offered, and all three SKUs are flagged in request order."
        test_recipe:
          setup:
            - "An authorized store with an ACTIVE deployment."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_depot
            - *k_term
