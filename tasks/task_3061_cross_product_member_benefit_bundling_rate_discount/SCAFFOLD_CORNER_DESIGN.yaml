              as: PlatformAdmin
            - call: "POST /benefits/deposit-enrollments/${r005_en_id}/lapse"
              payload: {}
              as: PlatformAdmin
            - call: "GET /benefits/churn-notices"
              payload: { member_id: "${r005_id}", status: "QUEUED" }
              as: PlatformAdmin
              captures: { r005_note_id: $.data.0.id }
            - call: "POST /benefits/churn-notices/${r005_note_id}/send"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /benefits/churn-notices/${r005_note_id}/acknowledge"
