          - validations[priority=11, ERR_UNABATED_VIOLATION]
          - validations[priority=12, ERR_NOTICE_PERIOD_NOT_ELAPSED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unabated_violation_outranks_notice_period_on_release_decision
          rationale: "That §1.8 instance stages both violations at once and asserts the priority-11 error is reported, then clears it to expose the priority-12 error — the full priority-ordering claim."

