          assert:
            - "every call in the trigger sequence returns its declared success code; no call returns 403"
            - "ProgramAdmin exercised POST /uro/projects, POST /uro/utility-owners, PATCH /uro/projects/{id} and POST /_clock/set_current_utc"
            - "UtilityCoordinator exercised POST /uro/investigations, POST /uro/conflicts, set-resolution, POST /uro/permits, permit decide, plan start-review, plan approve and certify-cleared"
