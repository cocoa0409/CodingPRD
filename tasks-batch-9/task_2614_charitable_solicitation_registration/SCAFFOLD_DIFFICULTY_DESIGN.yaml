  - rule_id: boundary_precision_check
    instances:

      - name: assurance_threshold_exact_boundary_on_gross_revenue_basis
        grounds:
          - calculations.assurance_requirement_derivation
          - entities.StateProfile.fields.review_threshold_cents
          - entities.StateProfile.fields.audit_threshold_cents
          - entities.StateRegistration.fields.required_financial_attestation
        boundary:
          quantity: "FinancialStatement.total_revenue_cents measured against StateProfile.review_threshold_cents = 20000000 and audit_threshold_cents = 200000000"
          comparator: ">= (inclusive at the threshold)"
          at_minus_one: { total_revenue_cents: 19999999, expected: NONE }
          at: { total_revenue_cents: 20000000, expected: REVIEW }
          at_audit: { total_revenue_cents: 200000000, expected: AUDIT }
        distinguishing_aspect: |
          One cent below the review threshold the filing needs no attestation; exactly at the
          threshold it needs REVIEW, because the comparator is inclusive. All three statements
          carry assurance_level AUDIT, so an implementation that copies the statement's own
          assurance_level instead of deriving the requirement from the state threshold reports
          AUDIT for all three and fails the first two assertions.
        test_recipe:
          setup:
            - "StateProfile CA on the GROSS_REVENUE basis with review_threshold_cents 20000000 and audit_threshold_cents 200000000."
            - "Organization with fiscal_year_end_month 6 and has_online_donation_page true."
            - "Three CURRENT FinancialStatements for fiscal years 2024, 2025 and 2026 with total_revenue_cents 19999999, 20000000 and 200000000, each with contributions_cents 1000000 and assurance_level AUDIT."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, online_presence_counts: true, base_filing_fee_cents: 2500, online_surcharge_cents: 1000, per_contract_fee_cents: 1500, filing_fee_cap_cents: 30000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6, has_online_donation_page: true }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2024, total_revenue_cents: 19999999, contributions_cents: 1000000, program_expense_cents: 15000000, fundraising_expense_cents: 3000000, management_expense_cents: 1000000, assurance_level: "AUDIT", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_low_id: $.data.id }
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { org_v2: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2025, total_revenue_cents: 20000000, contributions_cents: 1000000, program_expense_cents: 15000000, fundraising_expense_cents: 3000000, management_expense_cents: 1000000, assurance_level: "AUDIT", expected_organization_version: "${org_v2}" }
              as: ComplianceOfficer
              captures: { fs_at_id: $.data.id }
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { org_v3: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 200000000, contributions_cents: 1000000, program_expense_cents: 15000000, fundraising_expense_cents: 3000000, management_expense_cents: 1000000, assurance_level: "AUDIT", expected_organization_version: "${org_v3}" }
              as: ComplianceOfficer
              captures: { fs_audit_id: $.data.id }
          trigger:
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2024, coverage_start: "2023-07-01T00:00:00Z", coverage_end: "2024-07-01T00:00:00Z", financial_statement_id: "${fs_low_id}" }
              as: ComplianceOfficer
              captures: { reg_low_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2025, coverage_start: "2024-07-01T00:00:00Z", coverage_end: "2025-07-01T00:00:00Z", financial_statement_id: "${fs_at_id}" }
              as: ComplianceOfficer
              captures: { reg_at_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_audit_id}" }
              as: ComplianceOfficer
              captures: { reg_audit_id: $.data.id }
          assert:
            - "StateRegistration.${reg_low_id}.required_financial_attestation == NONE"
            - "StateRegistration.${reg_at_id}.required_financial_attestation == REVIEW"
            - "StateRegistration.${reg_audit_id}.required_financial_attestation == AUDIT"
            - "StateRegistration.${reg_low_id}.filing_fee_cents == 5250"
            - "StateRegistration.${reg_at_id}.filing_fee_cents == 5250"
            - "StateRegistration.${reg_audit_id}.status == DRAFT"

      - name: late_penalty_month_bucket_boundary_at_90_and_91_days
        grounds:
