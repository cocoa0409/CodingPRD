            - { call: "GET /api/training-plans/${p_id}/sessions", as: VisionSpecialist, captures: { s3_status: "$.data[2].status" } }
          assert:
            - "${mid_status} == ACTIVE and ${mid_noshow} == 1  # link 1 only"
            - "${end_status} == SUSPENDED and ${end_noshow} == 2  # link 2: threshold suspension"
            - "${s3_status} == CANCELLED  # link 3: cascade cancels remaining SCHEDULED sessions"

  # ------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pp_referential_beats_fiscal_on_claim_submit
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_FUNDING_NOT_APPROVED]
          - errors[ERR_INSUFFICIENT_FUNDING]
        distinguishing_aspect: |
          Category pair business_referential vs business_fiscal: the claim's
          authorization is DENIED (referential violation) AND its provisional 400
          exceeds the remaining 100 (fiscal violation); the referential error
          ERR_FUNDING_NOT_APPROVED (priority 8) must win over ERR_INSUFFICIENT_FUNDING.
        test_recipe:
          setup:
            - "ACTIVE client, allocated PURCHASE order"
            - "INSURANCE authorization for only 100 cents, submitted then DENIED"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Gus Ren", date_of_birth: "1960-12-01" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 55, contrast_score: 55, field_loss_pct: 30, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-P1", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "INSURANCE", payer_ref: "POL-400", authorized_amount_cents: 100, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-1", captures: { fa_id: $.data.id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/submit", payload: {}, as: FundingCoordinator, as_user_id: "fc-1" }
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "DENY" }, as: PayerAdjudicator, as_user_id: "pa-1" }
            - { call: "POST /api/claims", payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-05-10T00:00:00Z", lines: [ { line_type: "DEVICE", unit_price_cents: 500, quantity: 1 } ] }, as: BillingSpecialist, captures: { cl_id: $.data.id, prov: $.data.provisional_total_cents } }
          trigger:
            - { call: "POST /api/claims/${cl_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1", captures: { err: $.data.error_id } }
            - { call: "GET /api/claims/${cl_id}", as: BillingSpecialist, captures: { cl_status: $.data.status } }
            - { call: "GET /api/funding-authorizations/${fa_id}", as: BillingSpecialist, captures: { rem: $.data.remaining_amount_cents } }
          assert:
            - "${prov} == 400  # provisional computable even on a DENIED authorization"
            - "${err} == ERR_FUNDING_NOT_APPROVED  # priority 8 referential beats priority 11 fiscal (400 > 100)"
            - "${cl_status} == DRAFT"
            - "${rem} == 100  # no reservation leaked by the rejected submit"

      - name: pp_temporal_beats_constraint_on_session_schedule
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_SESSION_OVERLAP]
          - errors[ERR_PLAN_SESSION_CAP]
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint (a different pair
          than referential-vs-fiscal): the request overlaps an existing instructor
          session AND the plan is already at its session cap; the temporal error
          ERR_SESSION_OVERLAP (priority 9) must win over ERR_PLAN_SESSION_CAP.
        test_recipe:
          setup:
            - "ACTIVE client with allocated PURCHASE order"
            - "Training plan total_sessions=1 with one SCHEDULED session for inst-1 at 10:00-11:00 (cap reached)"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Hana Su", date_of_birth: "1951-04-19" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "PHYSICIAN", referring_party: "Dr. Fox" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 40, contrast_score: 45, field_loss_pct: 50, recommended_category: "CCTV" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "CCTV Pro 24", category: "CCTV", list_price_cents: 100000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-P2", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/training-plans", payload: { client_id: "${c_id}", device_order_id: "${o_id}", total_sessions: 1 }, as: VisionSpecialist, captures: { p_id: $.data.id } }
            - { call: "POST /api/training-plans/${p_id}/sessions", payload: { instructor_user_id: "inst-1", scheduled_start: "2026-05-04T10:00:00Z", scheduled_end: "2026-05-04T11:00:00Z" }, as: VisionSpecialist }
          trigger:
            - { call: "POST /api/training-plans/${p_id}/sessions", payload: { instructor_user_id: "inst-1", scheduled_start: "2026-05-04T10:30:00Z", scheduled_end: "2026-05-04T11:30:00Z" }, as: VisionSpecialist, captures: { err: $.data.error_id } }
            - { call: "GET /api/training-plans/${p_id}/sessions", as: VisionSpecialist, captures: { n_sessions: "$.data[0].id" } }
          assert:
            - "${err} == ERR_SESSION_OVERLAP  # priority 9 temporal beats priority 10 cap (1 session already == total_sessions 1)"
            - "GET sessions list still contains exactly 1 session (no partial write)"

  # ------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bp_funding_remaining_exact_equality
        grounds:
          - validations[priority=11]
          - calculations.funding_remaining
          - state_machines.Claim.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Money metric on POST /api/claims/{id}/submit: provisional exactly equal to
          remaining (8000 == 8000) is allowed (<=), while any amount above is
          rejected — pins the >= vs > boundary.
        test_recipe:
          setup:
            - "ACTIVE client, allocated PURCHASE order, APPROVED INSURANCE authorization for exactly 8000 cents"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Ira Mel", date_of_birth: "1947-09-09" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-B1", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "INSURANCE", payer_ref: "POL-500", authorized_amount_cents: 8000, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-1", captures: { fa_id: $.data.id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/submit", payload: {}, as: FundingCoordinator, as_user_id: "fc-1" }
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: PayerAdjudicator, as_user_id: "pa-1" }
          trigger:
            - { call: "POST /api/claims", payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-05-10T00:00:00Z", lines: [ { line_type: "DEVICE", unit_price_cents: 10000, quantity: 1 } ] }, as: BillingSpecialist, captures: { cl1: $.data.id, prov1: $.data.provisional_total_cents } }
            - { call: "POST /api/claims/${cl1}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1", captures: { st1: $.data.status } }
            - { call: "GET /api/funding-authorizations/${fa_id}", as: BillingSpecialist, captures: { rem: $.data.remaining_amount_cents } }
            - { call: "POST /api/claims", payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-05-11T00:00:00Z", lines: [ { line_type: "SHIPPING", unit_price_cents: 2, quantity: 1 } ] }, as: BillingSpecialist, captures: { cl2: $.data.id, prov2: $.data.provisional_total_cents } }
            - { call: "POST /api/claims/${cl2}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1", captures: { err: $.data.error_id } }
          assert:
            - "${prov1} == 8000  # round_half_up(10000*0.80)"
            - "${st1} == SUBMITTED  # 8000 <= 8000: exact equality allowed"
            - "${rem} == 0"
            - "${prov2} == 2  # round_half_up(2*0.80)=1.6 -> 2"
            - "${err} == ERR_INSUFFICIENT_FUNDING  # 2 > 0: one cent over the boundary rejects"

      - name: bp_plan_completion_exact_count
        grounds:
          - state_machines.TrainingPlan.ACTIVE_to_COMPLETED
          - state_machines.TrainingSession.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Count metric on POST /api/training-sessions/{id}/resolve (a different
          endpoint and metric than the funding boundary): the plan completes exactly
          when completed_sessions == total_sessions, not before.
        test_recipe:
          setup:
            - "ACTIVE client with allocated PURCHASE order; plan total_sessions=2 with sessions s1, s2 SCHEDULED"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Jae Min", date_of_birth: "1959-06-17" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "VR_AGENCY", referring_party: "State VR" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-B2", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/training-plans", payload: { client_id: "${c_id}", device_order_id: "${o_id}", total_sessions: 2 }, as: VisionSpecialist, captures: { p_id: $.data.id } }
            - { call: "POST /api/training-plans/${p_id}/sessions", payload: { instructor_user_id: "inst-1", scheduled_start: "2026-05-04T10:00:00Z", scheduled_end: "2026-05-04T11:00:00Z" }, as: VisionSpecialist, captures: { s1: $.data.id } }
            - { call: "POST /api/training-plans/${p_id}/sessions", payload: { instructor_user_id: "inst-1", scheduled_start: "2026-05-04T11:00:00Z", scheduled_end: "2026-05-04T12:00:00Z" }, as: VisionSpecialist, captures: { s2: $.data.id } }
          trigger:
            - { call: "POST /api/training-sessions/${s1}/resolve", payload: { outcome: "COMPLETED" }, as: VisionSpecialist }
            - { call: "GET /api/training-plans/${p_id}", as: VisionSpecialist, captures: { mid_status: $.data.status, mid_done: $.data.completed_sessions } }
            - { call: "POST /api/training-sessions/${s2}/resolve", payload: { outcome: "COMPLETED" }, as: VisionSpecialist }
            - { call: "GET /api/training-plans/${p_id}", as: VisionSpecialist, captures: { end_status: $.data.status, end_done: $.data.completed_sessions } }
          assert:
            - "${mid_status} == ACTIVE and ${mid_done} == 1  # 1 < 2: boundary not yet crossed"
            - "${end_status} == COMPLETED and ${end_done} == 2  # exactly == total_sessions triggers completion"

  # ------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ce_order_requires_final_evaluation
        grounds:
          - validations[priority=8]
          - state_machines.DeviceOrder.PLACED_to_ACTIVE
          - errors[ERR_EVALUATION_NOT_FINAL]
        distinguishing_aspect: |
          Entity pair DeviceOrder -> Evaluation: order creation is gated on the
          evaluation's FINALIZED state; DRAFT rejects, FINALIZED accepts.
        test_recipe:
          setup:
            - "ACTIVE client with ACCEPTED referral; evaluation still DRAFT; MAGNIFIER model exists"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Kip Aldo", date_of_birth: "1966-03-27" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "PHYSICIAN", referring_party: "Dr. Rey" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { err: $.data.error_id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_status: $.data.status } }
          assert:
            - "${err} == ERR_EVALUATION_NOT_FINAL  # DRAFT evaluation gates order creation"
            - "${o_status} == PLACED  # same call succeeds once FINALIZED"

      - name: ce_claim_requires_approved_authorization
        grounds:
          - validations[priority=8]
          - state_machines.Claim.DRAFT_to_SUBMITTED
          - errors[ERR_FUNDING_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair Claim -> FundingAuthorization (a different pair than
          DeviceOrder -> Evaluation): claim submit is gated on APPROVED; SUBMITTED
          rejects, and the same claim submits fine after adjudication.
        test_recipe:
          setup:
            - "ACTIVE client, allocated PURCHASE order, INSURANCE authorization for 50000 in SUBMITTED state"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Luz Per", date_of_birth: "1953-08-08" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "INSURANCE", referring_party: "InsureCo" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-C1", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "INSURANCE", payer_ref: "POL-600", authorized_amount_cents: 50000, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-1", captures: { fa_id: $.data.id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/submit", payload: {}, as: FundingCoordinator, as_user_id: "fc-1" }
            - { call: "POST /api/claims", payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-05-10T00:00:00Z", lines: [ { line_type: "DEVICE", unit_price_cents: 2000, quantity: 1 } ] }, as: BillingSpecialist, captures: { cl_id: $.data.id, prov: $.data.provisional_total_cents } }
          trigger:
            - { call: "POST /api/claims/${cl_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: PayerAdjudicator, as_user_id: "pa-1" }
            - { call: "POST /api/claims/${cl_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1", captures: { st: $.data.status } }
            - { call: "GET /api/funding-authorizations/${fa_id}", as: BillingSpecialist, captures: { rem: $.data.remaining_amount_cents } }
          assert:
            - "${err} == ERR_FUNDING_NOT_APPROVED  # SUBMITTED (not yet APPROVED) gates the claim"
            - "${st} == SUBMITTED  # identical call succeeds after adjudication"
            - "${prov} == 1600 and ${rem} == 48400  # 50000 - 1600"

  # ------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_session_instructor_half_open
        grounds:
          - validations[priority=9]
          - errors[ERR_SESSION_OVERLAP]
        distinguishing_aspect: |
          Resource instructor_user_id with HALF-OPEN [start, end) semantics:
          back-to-back adjacency (start == other.end) is allowed, any strict
          intersection rejected.
        test_recipe:
          setup:
            - "ACTIVE client with allocated PURCHASE order; plan total_sessions=5; session for inst-1 at 10:00-11:00 exists"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Mia Kos", date_of_birth: "1942-01-25" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-S1", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/training-plans", payload: { client_id: "${c_id}", device_order_id: "${o_id}", total_sessions: 5 }, as: VisionSpecialist, captures: { p_id: $.data.id } }
            - { call: "POST /api/training-plans/${p_id}/sessions", payload: { instructor_user_id: "inst-1", scheduled_start: "2026-05-04T10:00:00Z", scheduled_end: "2026-05-04T11:00:00Z" }, as: VisionSpecialist }
          trigger:
            - { call: "POST /api/training-plans/${p_id}/sessions", payload: { instructor_user_id: "inst-1", scheduled_start: "2026-05-04T11:00:00Z", scheduled_end: "2026-05-04T12:00:00Z" }, as: VisionSpecialist, captures: { s_adj: $.data.id } }
            - { call: "POST /api/training-plans/${p_id}/sessions", payload: { instructor_user_id: "inst-1", scheduled_start: "2026-05-04T10:30:00Z", scheduled_end: "2026-05-04T11:30:00Z" }, as: VisionSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent session ${s_adj} created (201)  # half-open: 11:00 start == 11:00 end touches but does not overlap"
            - "${err} == ERR_SESSION_OVERLAP  # 10:30 < 11:00 and 11:30 > 10:00: strict intersection"

      - name: rto_subscription_closed_interval
        grounds:
          - validations[priority=9]
          - errors[ERR_SUBSCRIPTION_OVERLAP]
        distinguishing_aspect: |
          Resource (client, device_model) with CLOSED interval semantics (a different
          geometry than the half-open session rule, on a different resource entity):
          new.period_start == existing.period_end conflicts, one day later is free.
        test_recipe:
          setup:
            - "Client; SCREEN_READER software model (monthly 25000)"
            - "Existing ACTIVE subscription period [2026-05-01, 2026-05-31]"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Nia Tob", date_of_birth: "1975-10-14" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/device-models", payload: { name: "ReadAloud SR", category: "SCREEN_READER", list_price_cents: 0, subscription_monthly_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { client_id: "${c_id}", device_model_id: "${m_id}", period_start: "2026-05-01T00:00:00Z" }, as: BillingSpecialist, captures: { sub1: $.data.id, sub1_end: $.data.period_end } }
          trigger:
            - { call: "POST /api/subscriptions", payload: { client_id: "${c_id}", device_model_id: "${m_id}", period_start: "2026-05-31T00:00:00Z" }, as: BillingSpecialist, captures: { err: $.data.error_id } }
            - { call: "POST /api/subscriptions", payload: { client_id: "${c_id}", device_model_id: "${m_id}", period_start: "2026-06-01T00:00:00Z" }, as: BillingSpecialist, captures: { sub3: $.data.id, sub3_end: $.data.period_end } }
          assert:
            - "${sub1_end} == 2026-05-31T00:00:00Z  # period_start + 30 days"
            - "${err} == ERR_SUBSCRIPTION_OVERLAP  # closed interval: 2026-05-31 <= existing period_end conflicts"
            - "${sub3_end} == 2026-07-01T00:00:00Z and sub3 is ACTIVE  # one day later is free"

  # ------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ci_funding_conservation
        grounds:
          - calculations.funding_remaining
          - state_machines.Claim.SUBMITTED_to_VOIDED
          - state_machines.Claim.PAID_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: authorized funding cents. Every forward/compensating
          pair (submit/void, adjudicate/void) restores remaining_amount_cents so that
          remaining + reserved(SUBMITTED provisional) + paid(PAID payer_pays) ==
          authorized_amount_cents at each step.
        test_recipe:
          setup:
            - "ACTIVE client, allocated PURCHASE order, APPROVED VR authorization for 20000 cents"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Ora Fin", date_of_birth: "1948-12-03" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "VR_AGENCY", referring_party: "State VR" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-V1", condition: "NEW" }, as: ClinicAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "PURCHASE" }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u_id}" }, as: VisionSpecialist }
            - { call: "POST /api/funding-authorizations", payload: { client_id: "${c_id}", payer_type: "VR", payer_ref: "VR-900", authorized_amount_cents: 20000, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-12-31T23:59:59Z" }, as: FundingCoordinator, as_user_id: "fc-1", captures: { fa_id: $.data.id } }
            - { call: "POST /api/funding-authorizations/${fa_id}/submit", payload: {}, as: FundingCoordinator, as_user_id: "fc-1" }
            - { call: "POST /api/funding-authorizations/${fa_id}/adjudicate", payload: { decision: "APPROVE" }, as: PayerAdjudicator, as_user_id: "pa-1" }
          trigger:
            - { call: "POST /api/claims", payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-05-10T00:00:00Z", lines: [ { line_type: "DEVICE", unit_price_cents: 5000, quantity: 1 } ] }, as: BillingSpecialist, captures: { cl1: $.data.id } }
            - { call: "POST /api/claims/${cl1}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1" }
            - { call: "GET /api/funding-authorizations/${fa_id}", as: BillingSpecialist, captures: { rem1: $.data.remaining_amount_cents } }
            - { call: "POST /api/claims/${cl1}/void", payload: {}, as: BillingSpecialist, as_user_id: "bs-1" }
            - { call: "GET /api/funding-authorizations/${fa_id}", as: BillingSpecialist, captures: { rem2: $.data.remaining_amount_cents } }
            - { call: "POST /api/claims", payload: { funding_authorization_id: "${fa_id}", device_order_id: "${o_id}", service_date: "2026-05-12T00:00:00Z", lines: [ { line_type: "DEVICE", unit_price_cents: 5000, quantity: 1 } ] }, as: BillingSpecialist, captures: { cl2: $.data.id } }
            - { call: "POST /api/claims/${cl2}/submit", payload: {}, as: BillingSpecialist, as_user_id: "bs-1" }
            - { call: "GET /api/funding-authorizations/${fa_id}", as: BillingSpecialist, captures: { rem3: $.data.remaining_amount_cents } }
            - { call: "POST /api/claims/${cl2}/adjudicate", payload: { decision: "PAY", allowed_amount_cents: 4000 }, as: PayerAdjudicator, as_user_id: "pa-1", captures: { pp2: $.data.payer_pays_cents } }
            - { call: "GET /api/funding-authorizations/${fa_id}", as: BillingSpecialist, captures: { rem4: $.data.remaining_amount_cents } }
          assert:
            - "${rem1} == 15000  # 20000 - 5000 reserved"
            - "${rem2} == 20000  # void of SUBMITTED fully restores — no drift"
            - "${rem3} == 15000"
            - "${pp2} == 4000  # VR base = allowed; min(4000, 15000+5000) = 4000"
            - "${rem4} == 16000  # 15000 + 5000 - 4000; invariant 16000 + 4000 == 20000 holds"

      - name: ci_unit_account_conservation
        grounds:
          - calculations.unit_pool_counts
          - state_machines.DeviceUnit.IN_STOCK_to_DEPLOYED
          - state_machines.DeviceUnit.DEPLOYED_to_IN_STOCK
        distinguishing_aspect: |
          Conserved quantity: physical unit count per model (a different quantity than
          funding cents). Allocate then return moves a unit between status buckets;
          total_count never changes and in_stock_count returns to its origin.
        test_recipe:
          setup:
            - "MAGNIFIER model with three NEW units; ACTIVE client with FINALIZED evaluation; TRIAL order placed"
          setup_api_calls:
            - { call: "POST /api/clients", payload: { full_name: "Pia Wex", date_of_birth: "1957-05-05" }, as: IntakeCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { client_id: "${c_id}", source_type: "SELF", referring_party: "self" }, as: IntakeCoordinator, captures: { r_id: $.data.id } }
            - { call: "POST /api/referrals/${r_id}/decide", payload: { decision: "ACCEPT" }, as: IntakeCoordinator }
            - { call: "GET /api/clients/${c_id}", as: VisionSpecialist, captures: { c_v: $.data.version } }
            - { call: "POST /api/evaluations", payload: { client_id: "${c_id}", referral_id: "${r_id}", expected_client_version: "${c_v}", acuity_score: 60, contrast_score: 60, field_loss_pct: 20, recommended_category: "MAGNIFIER" }, as: VisionSpecialist, captures: { e_id: $.data.id } }
            - { call: "POST /api/evaluations/${e_id}/finalize", payload: {}, as: VisionSpecialist }
            - { call: "POST /api/device-models", payload: { name: "Magna 5x", category: "MAGNIFIER", list_price_cents: 25000 }, as: ClinicAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-U1", condition: "NEW" }, as: ClinicAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-U2", condition: "NEW" }, as: ClinicAdmin }
            - { call: "POST /api/device-units", payload: { device_model_id: "${m_id}", serial_no: "SN-U3", condition: "NEW" }, as: ClinicAdmin }
            - { call: "POST /api/device-orders", payload: { client_id: "${c_id}", evaluation_id: "${e_id}", device_model_id: "${m_id}", fulfillment_type: "TRIAL", trial_days: 14 }, as: VisionSpecialist, captures: { o_id: $.data.id } }
            - { call: "GET /api/device-models/${m_id}", as: ClinicAdmin, captures: { stock0: $.data.in_stock_count, tot0: $.data.total_count } }
          trigger:
            - { call: "POST /api/device-orders/${o_id}/allocate", payload: { device_unit_id: "${u1}" }, as: VisionSpecialist }
            - { call: "GET /api/device-models/${m_id}", as: ClinicAdmin, captures: { stock1: $.data.in_stock_count, tot1: $.data.total_count } }
            - { call: "POST /api/device-orders/${o_id}/return", payload: {}, as: VisionSpecialist }
            - { call: "GET /api/device-models/${m_id}", as: ClinicAdmin, captures: { stock2: $.data.in_stock_count, tot2: $.data.total_count } }
          assert:
            - "${stock0} == 3 and ${tot0} == 3"
            - "${stock1} == 2 and ${tot1} == 3  # forward action shifts bucket only"
            - "${stock2} == 3 and ${tot2} == 3  # compensating return restores in_stock; total conserved throughout"
