            -> (1) item_list_price rewrites the component's list_price_cents 22050 -> 12600
            -> (2) lot_bundle_list_price rewrites the parent lot's list_price_cents 51975 -> 43470
            -> (3) markdown_price rewrites the parent's current_price_cents to 43470, which is
                   now below CLEARANCE_THRESHOLD_CENTS
            -> (4) clearance_relocation_selector moves the parent out of Front A into the
                   roomiest OPEN clearance zone
            -> (5) floor_zone_utilization is recomputed on BOTH the vacated and the receiving
                   zone, flipping the receiving zone's utilization_state to TIGHT
        distinguishing_aspect: |
          The trigger is a receiving inspection on a lot COMPONENT and the chain runs five
          hops upward and sideways: component price, parent bundle price, parent markdown,
