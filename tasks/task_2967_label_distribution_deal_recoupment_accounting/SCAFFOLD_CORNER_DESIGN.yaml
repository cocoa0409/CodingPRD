      - name: post_term_collection_422_outranks_open_objections_409
        claim_type: priority_ordering
        grounds:
          - validations[priority 10 ERR_POST_TERM_COLLECTION_ACTIVE]
          - validations[priority 11 ERR_OPEN_OBJECTIONS_BLOCK_CLOSE]
          - endpoints[POST /distribution-deals/{id}/close]
        distinguishing_aspect: |
          Closing the deal is blocked by two independent rules at once: the post-term collection
          window has not expired (priority 10, 422) and an OBJECTED statement still has a null
          resolution (priority 11, 409). The temporal rule must be reported first even though the
          objection is the older defect; only after the clock passes post_term_collection_end_date
          does the 409 surface, and only after the objection is DENIED does the close succeed. An
          implementation that evaluates business rules in declaration order or that short-circuits
          on the first failed lookup reports the 409 while the window is still open.
