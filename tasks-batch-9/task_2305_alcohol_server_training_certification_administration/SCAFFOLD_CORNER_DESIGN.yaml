      - name: suspended_account_status_outranks_the_dram_shop_compliance_floor
        claim_type: Priority Ordering
        grounds:
          - validations.priority_17_ERR_ACCOUNT_INVALID_STATE
          - validations.priority_38_ERR_COMPLIANCE_RATE_TOO_LOW
          - entities.EmployerAccount.fields.account_status
        distinguishing_aspect: |
          An account with one MANDATED location and no live assignment reads
          account_compliance_rate_pct 0.00 and is refused with
          ERR_COMPLIANCE_RATE_TOO_LOW; once SUSPENDED the identical request returns
          ERR_ACCOUNT_INVALID_STATE instead, because priority 17 precedes priority 38, and
          the suspended account can no longer buy seat credits either.
        test_recipe:
          setup:
            - "A TX MANDATORY jurisdiction and employer Lone Star Taverns LLC with one ON_PREMISE location and no server assignments."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /state-jurisdictions"
              payload: { state_code: "TX", mandate_type: "MANDATORY", mandated_tracks: ["ON_PREMISE", "OFF_PREMISE"] }
              as: ProgramAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /employer-accounts"
              payload: { legal_name: "Lone Star Taverns LLC", billing_state_code: "TX" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employer-accounts/${emp_id}/locations"
              payload: { location_name: "Alamo Taproom", state_jurisdiction_id: "${tx_id}", premise_type: "ON_PREMISE", annual_premium_cents: 4821734 }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { loc_a_id: $.data.id }
            - call: "GET /employer-accounts/${emp_id}"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { emp_v1: $.data.version }
          trigger:
            - call: "POST /employer-accounts/${emp_id}/dram-shop-documents"
              payload: { insurer_name: "Brazos Mutual", policy_number: "BM-2026-77", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-09-01T00:00:00Z", expected_employer_account_version: "${emp_v1}" }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
            - call: "POST /employer-accounts/${emp_id}/status"
              payload: { account_status: "SUSPENDED", status_reason: "non-payment" }
              as: ProgramAdmin
            - call: "GET /employer-accounts/${emp_id}"
              payload: {}
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { emp_v2: $.data.version }
            - call: "POST /employer-accounts/${emp_id}/dram-shop-documents"
              payload: { insurer_name: "Brazos Mutual", policy_number: "BM-2026-77", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-09-01T00:00:00Z", expected_employer_account_version: "${emp_v2}" }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
            - call: "POST /employer-accounts/${emp_id}/seat-credit-purchases"
              payload: { seat_quantity: 40, unit_price_cents: 2500 }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
          assert:
            - "the first documentation attempt returns 422 with error.code == 'ERR_COMPLIANCE_RATE_TOO_LOW' (account_compliance_rate_pct == 0.00)"
            - "EmployerAccount.${emp_id}.account_status == 'SUSPENDED' after the status call"
            - "the second documentation attempt returns 409 with error.code == 'ERR_ACCOUNT_INVALID_STATE', not ERR_COMPLIANCE_RATE_TOO_LOW"
            - "the seat-credit purchase returns 409 with error.code == 'ERR_ACCOUNT_INVALID_STATE' and seat_credit_balance stays 0"
            - "EmployerAccount.${emp_id}.dram_shop_discount_status == 'NOT_DOCUMENTED' and GET /employer-accounts/${emp_id}/dram-shop-documents returns total_count 0"

      - name: corner_priority_session_state_over_seat_credit_balance
        claim_type: Priority Ordering
        grounds:
          - validations.priority_13_ERR_SESSION_INVALID_STATE
          - validations.priority_37_ERR_INSUFFICIENT_SEAT_CREDITS
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / session_roster_locked_state_outranks_insufficient_seat_credits
          rationale: "That instance violates both rules in one request and asserts that only the priority-13 error surfaces."

      - name: corner_priority_trainer_certification_over_schedule_conflict
        claim_type: Priority Ordering
        grounds:
          - validations.priority_20_ERR_TRAINER_NOT_CERTIFIED
          - validations.priority_32_ERR_TRAINER_SCHEDULE_CONFLICT
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / trainer_certification_gap_outranks_buffered_schedule_conflict
          rationale: "That instance violates the track-certification rule and the buffered overlap rule together and asserts the priority-20 error."

      - name: corner_trainer_buffered_schedule_conflict
        claim_type: Violation → Error
        grounds:
          - validations.priority_32_ERR_TRAINER_SCHEDULE_CONFLICT
        excluded_because:
          difficulty_instance: resource_temporal_overlap / trainer_buffered_closed_interval_rejects_exact_adjacency_but_admits_a_sixty_one_minute_gap
          rationale: "That instance pins the 60-minute buffer on both sides of the closed interval, including the admitted 61-minute gap."

      - name: corner_server_session_window_overlap
        claim_type: Violation → Error
        grounds:
          - validations.priority_33_ERR_SERVER_SESSION_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / server_half_open_enrollment_window_admits_exact_adjacency_but_rejects_a_one_hour_overlap
          rationale: "That instance contrasts the server's half-open window against the trainer's buffered closed interval on the same pair of sessions."

      - name: corner_pinned_approval_staled_by_a_course_revision
        claim_type: Violation → Error
        grounds:
          - validations.priority_19_ERR_APPROVAL_STALE_CONTENT
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / open_exam_blocked_because_a_course_revision_staled_the_pinned_approval
          rationale: "That instance revises the course after the session pinned the approval and asserts the open-exam rejection."

      - name: corner_restricted_server_cannot_be_assigned_at_a_mandated_location
        claim_type: Violation → Error
        grounds:
          - validations.priority_22_ERR_SERVER_WORK_RESTRICTED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / server_assignment_creation_blocked_by_registry_driven_work_restriction
          rationale: "That instance drives the server to RESTRICTED through a registry rejection and then asserts the assignment refusal at a MANDATED location."

