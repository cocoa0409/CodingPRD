        distinguishing_aspect: "Existence (priority 4) beats state/business: claiming a nonexistent post id returns 404 ERR_GIFT_POST_NOT_FOUND even for a fully eligible member."
        test_recipe:
          setup: ["registered member M"]
          setup_api_calls:
            - call: "POST /v1/members"
              payload: { email: "nf@x.com", display_name: "M" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /v1/claims"
              payload: { post_id: "00000000-0000-0000-0000-000000000000" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_GIFT_POST_NOT_FOUND, http 404"

