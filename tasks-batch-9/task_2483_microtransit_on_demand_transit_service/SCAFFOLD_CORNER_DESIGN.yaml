      - name: walk_shed_at_the_zone_standard_is_approved_and_one_meter_over_is_not
        claim_type: violation_to_error
        grounds:
          - validations.priority_26
          - errors.ERR_WALK_DISTANCE_EXCEEDED
        distinguishing_aspect: "The walking-distance standard is enforced at approve, not at create: a 601-metre walk shed is stored happily and only rejected on approval (422), while exactly 600 metres passes because the comparison is inclusive."
        test_recipe:
          setup:
            - "Zone RBM is ACTIVE with max_walk_meters 600."
            - "Stop S_EDGE has walk_shed_meters 600 and stop S_OVER has 601; both are PROPOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
