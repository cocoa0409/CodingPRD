              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
          trigger:
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "UNLEADED", gallons: 100, unit_price_cents: 400, odometer: 10, jurisdiction: "CA" }
              as: Merchant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_ACTIVE_ASSIGNMENT"

