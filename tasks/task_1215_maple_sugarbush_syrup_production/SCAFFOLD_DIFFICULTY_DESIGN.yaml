        as_user_id: ${boiler_id}
      - call: GET /sugarhouse/batches/${batch_id}/intakes
        as: SugarMaker
        as_user_id: ${boiler_id}
      assert:
      - BatchIntake(run1).effective_brix == 1.6   (2.0 - 0.2*floor(60/24))
      - BatchIntake(run2).effective_brix == 2.8   (3.0 - 0.2*floor(36/24))
      - EvaporatorBatch.${batch_id}.input_brix == 2.05
  - name: royalty_per_batch_double_rounding
    grounds:
    - calculations.lease_royalty_accrual
    distinguishing_aspect: "Mode (b) \u2014 nested rounding order pinned: provisional royalty rounds the\nattributable gallons to 2dp FIRST, then applies share_pct and rounds\nagain per batch: round(round(245*1.0/86,2)*0.30,2)\
      \ = round(2.85*0.30,2)\n= round(0.855,2) = 0.86, whereas rounding once at the end would give\nround(2.848837...*0.30,2) = 0.85. Distinct mode from the mode-(a)\nweighted_brix instance.\n"
