# =============================================================================
# Task 1899 — Nurse Licensure Compact & Credential Expiry (hospital nursing
# credentialing) — PRD Benchmark Seed Tables
# =============================================================================

scenario: |
  1899. Nurse Licensure Compact & Credential Expiry (hospital nursing credentialing): license verification at hire & primary source check, multistate privilege eligibility & primary state of residence, expiration monitoring & auto-suspension of scheduling, certification (BLS/ACLS/specialty) tracking, disciplinary action alerts & practice restriction, travel nurse credential packet, competency/annual requirement completion, audit for regulatory survey

domain_name: nurse-licensure-compact
api_prefix: /credentialing

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
    - dual_variant_calculation
  difficulty_target: beyond_expert   # user directive: harder than expert level

  entity_topology: flat              # peer entities joined by FK references; no nested URL ownership
  state_machine_shape: cyclic        # dominant: renewal / reinstatement / resubmission loops; Nurse additionally carries parallel dimensions (status x credential_posture)

  relationship_patterns:
    - one_to_many        # Nurse -> licenses, certs, completions, disciplines, packets
    - many_to_many       # Nurse x Unit via ShiftAssignment junction; Nurse x CompetencySession via SessionBooking junction
    - cross_aggregate    # PrivilegeEvaluation derives from StateLicense + DisciplinaryAction aggregates; PacketItem links to credential rows across aggregates

  role_model: segregation_of_duties  # requester != recorder, creator != attester, acknowledger != adjudicator, assembler != approver

  consistency_model: immediate       # every mutation + cascade is atomic within the request/ops-run that caused it
  list_ordering: "All §1.5 list endpoints return rows in creation order (created_at ASC; rows sharing one clock instant keep insertion sequence). No selector, ranking, or tie-break anywhere uses the random id field."

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Nurse
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Legal full name" }
      - { name: email, type: string, source: input, description: "Work email; unique across nurses" }
      - { name: primary_state_of_residence, type: string, source: input, description: "PSOR: 2-letter state code; drives compact privilege derivation" }
      - { name: employment_type, type: enum, source: input, description: "STAFF | TRAVEL | PER_DIEM" }
      - { name: hire_date, type: string, source: input, description: "ISO date of hire (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, default: ONBOARDING, description: "Lifecycle axis: ONBOARDING | ACTIVE | TERMINATED" }
      - { name: credential_posture, type: enum, source: computed, default: SCHEDULING_SUSPENDED, description: "Derived gating axis: CLEAR | SCHEDULING_SUSPENDED | PRACTICE_RESTRICTED; see calculation credential_posture_evaluation" }
      - { name: multistate_privilege_status, type: enum, source: computed, default: NONE, description: "ELIGIBLE_MULTISTATE | SINGLE_STATE_ONLY | NONE; see calculation privilege_scope_determination" }
      - { name: practice_scope, type: array, source: computed, default: "[]", description: "Sorted list of state codes the nurse may practice in; [] when NONE" }
      - { name: open_encumbrance_count, type: integer, source: computed, default: 0, description: "Count of DisciplinaryAction rows for this nurse with status ADJUDICATED" }

  - name: StateLicense
    parent: null
    common_fields: true
    fields:
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; owning nurse" }
      - { name: state_code, type: string, source: input, description: "Issuing state, 2-letter code" }
      - { name: license_number, type: string, source: input, description: "Board license number; unique per (state_code, license_number)" }
      - { name: license_class, type: enum, source: input, description: "RN | APRN" }
      - { name: multistate_flag, type: boolean, source: input, description: "True only if board issued with multistate privilege; requires state_code in COMPACT_STATES" }
      - { name: issued_on, type: string, source: input, description: "ISO date issued" }
      - { name: expires_on, type: string, source: input, description: "ISO date; license is valid THROUGH this date inclusive (expires when current_date > expires_on)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PENDING_VERIFICATION | VERIFIED | ACTIVE | EXPIRED | ENCUMBERED | SURRENDERED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; used for segregation-of-duties on attest" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of attesting PrimarySourceVerifier; null until attested" }

  - name: PrimarySourceVerification
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> StateLicense.id; license under verification" }
      - { name: channel, type: enum, source: input, description: "NURSYS | BOARD_PORTAL | MANUAL_REVIEW" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | VERIFIED | DISCREPANCY | UNREACHABLE" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of requester; recorder must differ (segregation)" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of PrimarySourceVerifier who recorded the result" }
      - { name: verified_on, type: string, source: system, description: "ISO date (logical clock) when outcome VERIFIED recorded; null otherwise" }
      - { name: valid_through, type: string, source: system, description: "= verified_on + PSV_VALIDITY_DAYS; freshness is inclusive: valid when current_date <= valid_through" }
      - { name: discrepancy_note, type: string, source: input, description: "Required when outcome is DISCREPANCY; optional otherwise" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; owning nurse" }
      - { name: cert_type, type: enum, source: input, description: "BLS | ACLS | PALS | CCRN | CNOR | OCN" }
      - { name: issuing_body, type: string, source: input, description: "Issuing organization (e.g., AHA)" }
      - { name: obtained_on, type: string, source: input, description: "ISO date obtained" }
      - { name: expires_on, type: string, source: input, description: "ISO date; valid THROUGH this date inclusive" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED | REVOKED" }

  - name: DisciplinaryAction
    parent: null
    common_fields: true
    fields:
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; subject nurse" }
      - { name: license_id, type: string, source: input, description: "FK -> StateLicense.id; required iff scope == LICENSE, must be null iff scope == PRIVILEGE" }
      - { name: scope, type: enum, source: input, description: "LICENSE (action against one license) | PRIVILEGE (action against compact privilege)" }
      - { name: action_type, type: enum, source: input, description: "REPRIMAND | PROBATION | SUSPENSION | REVOCATION" }
      - { name: effective_on, type: string, source: input, description: "ISO date; must be <= current_date at creation" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | UNDER_REVIEW | ADJUDICATED | DISMISSED | RESOLVED" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of creating ComplianceOfficer" }
      - { name: acknowledged_by_user_id, type: string, source: system, description: "X-User-ID of acknowledging ComplianceOfficer" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of adjudicating ComplianceOfficer; must differ from acknowledged_by_user_id" }
      - { name: resolution_note, type: string, source: input, description: "Required on resolve" }

  - name: CredentialPacket
    parent: null
    common_fields: true
    fields:
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; packet subject (travel nurse credential packet)" }
      - { name: target_unit_id, type: string, source: input, description: "FK -> Unit.id; unit the packet credentiates the nurse for" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | VOIDED" }
      - { name: readiness_score, type: number, source: computed, default: 0, description: "See calculation packet_readiness_score; 4 decimal places" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of assembling CredentialingSpecialist; approver/reviewer must differ (segregation)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of approving/rejecting specialist" }
      - { name: rejection_reason, type: string, source: input, description: "Required on reject" }

  - name: PacketItem
    parent: null
    common_fields: true
    fields:
      - { name: packet_id, type: string, source: system, description: "FK -> CredentialPacket.id; items are materialized by packet creation" }
      - { name: item_type, type: enum, source: system, description: "LICENSE_VERIFICATION | BLS | ACLS | COMPETENCY_ANNUAL | ATTESTATION" }
      - { name: critical, type: boolean, source: system, description: "True for LICENSE_VERIFICATION, BLS, unit-required certs (e.g., ACLS) and COMPETENCY_ANNUAL; false for ATTESTATION" }
      - { name: weight, type: integer, source: system, description: "Scoring weight: LICENSE_VERIFICATION 40, BLS 20, ACLS 20, COMPETENCY_ANNUAL 15, ATTESTATION 5" }
      - { name: status, type: enum, source: system, default: MISSING, description: "MISSING | SUBMITTED | VERIFIED | WAIVED | INVALIDATED" }
      - { name: evidence_ref, type: string, source: input, description: "Evidence reference supplied at submit-evidence" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of evidence submitter (the nurse)" }
      - { name: source_credential_id, type: string, source: system, description: "Credential row (StateLicense/Certification/CompetencyCompletion id) that satisfied this item at verify time; drives INVALIDATED cascade" }

  - name: CompetencyRequirement
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique requirement code, e.g. ANNUAL_SKILLS" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: validity_months, type: integer, source: input, description: "Validity length in whole months (ROLLING mode)" }
      - { name: window_mode, type: enum, source: input, description: "ROLLING (completed_on + validity_months) | FISCAL (next fiscal-year end >= completed_on; fiscal year ends FISCAL_MONTH_DAY)" }
      - { name: mandatory, type: boolean, source: input, description: "Mandatory requirements gate credential_posture" }
      - { name: applies_to, type: array, source: input, description: "Employment types this requirement applies to: subset of [STAFF, TRAVEL, PER_DIEM]" }

  - name: CompetencyCompletion
    parent: null
    common_fields: true
    fields:
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; completing nurse" }
      - { name: requirement_id, type: string, source: input, description: "FK -> CompetencyRequirement.id; satisfied requirement" }
      - { name: completed_on, type: string, source: input, description: "ISO date of completion; must be <= current_date" }
      - { name: expires_on, type: string, source: computed, description: "See calculation competency_expiry_date (ROLLING vs FISCAL variants)" }
      - { name: status, type: enum, source: system, default: CURRENT, description: "CURRENT | LAPSED | SUPERSEDED" }
      - { name: source, type: enum, source: system, default: MANUAL, description: "MANUAL | SESSION" }
      - { name: session_booking_id, type: string, source: system, description: "FK -> SessionBooking.id; set when source == SESSION, null otherwise" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Unit name; unique" }
      - { name: required_cert_types, type: array, source: input, default: "[]", description: "Cert types (e.g. [ACLS]) a nurse must hold ACTIVE to be assigned or packet-approved for this unit" }
      - { name: scheduled_hours_total, type: number, source: computed, default: 0, description: "Sum of hours over this unit's ShiftAssignments with status in {SCHEDULED, IN_PROGRESS}; 2 decimals" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "Count of this unit's ShiftAssignments with status in {SCHEDULED, IN_PROGRESS}" }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; assigned nurse" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; assigned unit" }
      - { name: starts_at, type: datetime, source: input, description: "ISO8601 UTC start; date must be within [current_date, current_date + SCHEDULING_HORIZON_DAYS]" }
      - { name: ends_at, type: datetime, source: input, description: "ISO8601 UTC end; must be strictly after starts_at" }
      - { name: hours, type: number, source: computed, description: "round_half_up((ends_at - starts_at) minutes / 60, 2)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED | AUTO_CANCELLED" }
      - { name: was_clear_at_start, type: boolean, source: system, description: "Stamped true when transitioned to IN_PROGRESS (start requires posture CLEAR); null until started" }
      - { name: cancel_reason, type: string, source: system, description: "MANUAL | POSTURE_SCHEDULING_SUSPENDED | POSTURE_PRACTICE_RESTRICTED | NURSE_TERMINATED" }

  - name: CompetencySession
    parent: null
    common_fields: true
    fields:
      - { name: requirement_id, type: string, source: input, description: "FK -> CompetencyRequirement.id; requirement taught in this session" }
      - { name: title, type: string, source: input, description: "Session title" }
      - { name: starts_at, type: datetime, source: input, description: "ISO8601 UTC session start" }
      - { name: ends_at, type: datetime, source: input, description: "ISO8601 UTC session end; strictly after starts_at" }
      - { name: capacity, type: integer, source: input, description: "Max bookings; booking rejected when booked_count >= capacity" }
      - { name: booked_count, type: integer, source: computed, default: 0, description: "Count of existing SessionBooking rows for this session" }

  - name: SessionBooking
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> CompetencySession.id; from path" }
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; booked nurse" }
      - { name: attended, type: boolean, source: system, default: false, description: "Set true by the complete endpoint" }
      - { name: completion_id, type: string, source: system, description: "FK -> CompetencyCompletion.id; completion row created on complete; null until then" }

  - name: PrivilegeEvaluation
    parent: null
    common_fields: false   # append-only event log: id + created_at only; no updates, no version
    fields:
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id; evaluated nurse" }
      - { name: trigger_reason, type: enum, source: system, description: "MANUAL | PSOR_CHANGE | LICENSE_CHANGE | DISCIPLINE_CHANGE | SWEEP" }
      - { name: resulting_status, type: enum, source: system, description: "ELIGIBLE_MULTISTATE | SINGLE_STATE_ONLY | NONE" }
      - { name: resulting_scope, type: array, source: system, description: "Sorted state codes; full COMPACT_STATES when ELIGIBLE_MULTISTATE" }
      - { name: home_license_id, type: string, source: system, description: "StateLicense.id selected as home license by the selector rule; null when none eligible" }

  - name: AuditRun
    parent: null
    common_fields: true
    fields:
      - { name: window_start, type: string, source: input, description: "ISO date; inclusive window start; must be < window_end" }
      - { name: window_end, type: string, source: input, description: "ISO date; inclusive window end; must be <= current_date" }
      - { name: per_unit_sample_size, type: integer, source: input, description: "Max nurses sampled per unit (>= 1)" }
      - { name: status, type: enum, source: system, default: INITIATED, description: "INITIATED | FIELD_WORK | FINDINGS_ISSUED | CLOSED" }
      - { name: sampled_nurse_ids, type: array, source: system, default: "[]", description: "Deterministic sample computed at begin-fieldwork (see selector rule)" }
      - { name: point_in_time_rate, type: number, source: computed, description: "Variant POINT_IN_TIME of nurse_credential_validity_rate; null until issue-findings" }
      - { name: shift_incidence_rate, type: number, source: computed, description: "Variant SHIFT_INCIDENCE of nurse_credential_validity_rate; null until issue-findings" }
      - { name: projected_deficiency_count, type: number, source: computed, description: "See calculation survey_deficiency_projection (per-stratum rounding, pinned order); null until issue-findings" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creating ComplianceOfficer" }

  - name: AuditFinding
    parent: null
    common_fields: true
    fields:
      - { name: audit_run_id, type: string, source: system, description: "FK -> AuditRun.id; findings are created by issue-findings" }
      - { name: nurse_id, type: string, source: system, description: "FK -> Nurse.id; deficient sampled nurse" }
      - { name: finding_type, type: enum, source: system, description: "LICENSE_NOT_CURRENT_IN_WINDOW | CERTIFICATION_NOT_CURRENT_IN_WINDOW | COMPETENCY_NOT_CURRENT_IN_WINDOW" }
      - { name: detail, type: string, source: system, description: "Names the deficient slot (e.g., cert_type BLS or requirement code)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | REMEDIATED | ACCEPTED_RISK" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Nurse
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    note: "Two independent axes on one row (parallel dimensions): status (lifecycle) x credential_posture (derived gating). status transitions only via the endpoints below; credential_posture transitions only via credential_posture_evaluation recompute triggers."
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: POST /credentialing/nurses/{nurseId}/activate
        actor: CredentialingSpecialist
        preconditions:
          - "status == ONBOARDING (else ERR_INVALID_NURSE_STATE)"
          - "At least one StateLicense with status == ACTIVE (else ERR_HIRE_REQUIREMENTS_UNMET)"
          - "Derived practice_scope contains FACILITY_STATE (else ERR_HIRE_REQUIREMENTS_UNMET)"
        side_effects:
          - "credential_posture recompute via credential_posture_evaluation (may remain SCHEDULING_SUSPENDED if BLS/competency gaps exist)"
      - from: ONBOARDING
        to: TERMINATED
        trigger: POST /credentialing/nurses/{nurseId}/terminate
        actor: CredentialingSpecialist
        preconditions:
          - "status != TERMINATED (else ERR_INVALID_NURSE_STATE)"
        side_effects:
          - "credential_posture := SCHEDULING_SUSPENDED (forced terminal snapshot)"
      - from: ACTIVE
        to: TERMINATED
        trigger: POST /credentialing/nurses/{nurseId}/terminate
        actor: CredentialingSpecialist
        preconditions:
          - "status != TERMINATED (else ERR_INVALID_NURSE_STATE)"
        side_effects:
          - "Every ShiftAssignment with status == SCHEDULED and starts_at > now -> AUTO_CANCELLED (cancel_reason NURSE_TERMINATED); each cancellation decrements its Unit.scheduled_hours_total by assignment.hours and Unit.active_assignment_count by 1"
          - "Every CredentialPacket with status in {DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED} -> VOIDED"
          - "credential_posture := SCHEDULING_SUSPENDED (forced terminal snapshot)"
      - from: "*"
        to: "(credential_posture axis: CLEAR | SCHEDULING_SUSPENDED | PRACTICE_RESTRICTED)"
        trigger: "system recompute (calculation credential_posture_evaluation) fired by: license/certification/completion/discipline create or transition, shift create/cancel/auto-cancel, privilege evaluation, PATCH PSOR, activate, expiry sweep"
        actor: system
        preconditions: []
        side_effects:
          - "When posture flips to any non-CLEAR value: every ShiftAssignment with status == SCHEDULED and starts_at > now -> AUTO_CANCELLED (cancel_reason = 'POSTURE_' + new posture); each such cancellation decrements its Unit.scheduled_hours_total and active_assignment_count; AND every CredentialPacket with status == APPROVED -> VOIDED"
          - "The unit-derived requirement set is snapshotted BEFORE these cancellations and is NOT recomputed within the same trigger (pinned evaluation order; see calculation credential_posture_evaluation)"

  - entity: StateLicense
    initial_state: DRAFT
    terminal_states: [SURRENDERED]
    transitions:
      - from: DRAFT
        to: PENDING_VERIFICATION
        trigger: POST /credentialing/state-licenses/{licenseId}/submit
        actor: CredentialingSpecialist
        preconditions:
          - "status == DRAFT (else ERR_INVALID_LICENSE_STATE)"
        side_effects: []
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "system: a PrimarySourceVerification for this license records outcome VERIFIED (POST /credentialing/primary-source-verifications/{psvId}/record-result)"
        actor: system
        preconditions:
          - "license.status == PENDING_VERIFICATION (PSV VERIFIED recorded against VERIFIED/EXPIRED licenses does not change license status)"
        side_effects: []
      - from: PENDING_VERIFICATION
        to: DRAFT
        trigger: "system: a PrimarySourceVerification for this license records outcome DISCREPANCY"
        actor: system
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: ACTIVE
        trigger: POST /credentialing/state-licenses/{licenseId}/attest
        actor: PrimarySourceVerifier
        preconditions:
          - "status == VERIFIED (else ERR_INVALID_LICENSE_STATE)"
          - "X-User-ID != license.created_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
          - "Exists a PSV row for this license with status VERIFIED and valid_through >= current_date (no fresh VERIFIED PSV -> ERR_PSV_STALE)"
        side_effects:
          - "verified_by_user_id := X-User-ID"
          - "Nurse privilege re-derivation (privilege_scope_determination); if resulting_status/scope change, append PrivilegeEvaluation (trigger_reason LICENSE_CHANGE) and update nurse fields"
          - "Nurse.credential_posture recompute"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /credentialing/_ops/expiry-sweep when expires_on < current_date"
        actor: system
        preconditions:
          - "expires_on < current_date (date comparison; expires_on == current_date stays ACTIVE)"
        side_effects:
          - "Nurse privilege re-derivation; append PrivilegeEvaluation (trigger_reason SWEEP) if changed"
          - "Nurse.credential_posture recompute (may trigger the posture cascade: future shifts -> AUTO_CANCELLED, Unit counters decremented, APPROVED packets -> VOIDED)"
      - from: ENCUMBERED
        to: EXPIRED
        trigger: "system: POST /credentialing/_ops/expiry-sweep when expires_on < current_date"
        actor: system
        preconditions:
          - "expires_on < current_date"
        side_effects:
          - "Nurse privilege re-derivation; append PrivilegeEvaluation (trigger_reason SWEEP) if changed"
          - "Posture remains PRACTICE_RESTRICTED while the ADJUDICATED discipline is open (encumbrance, not expiry, drives restriction)"
      - from: EXPIRED
        to: ACTIVE
        trigger: POST /credentialing/state-licenses/{licenseId}/renew
        actor: CredentialingSpecialist
        preconditions:
          - "status == EXPIRED, OR (status == ACTIVE AND (expires_on - current_date).days <= RENEWAL_WINDOW_DAYS) — otherwise ERR_INVALID_LICENSE_STATE / ERR_RENEWAL_WINDOW_NOT_OPEN"
          - "Exists a PSV row with status VERIFIED and valid_through >= current_date (no fresh VERIFIED PSV -> ERR_PSV_STALE)"
          - "new_expires_on > current_date (else ERR_INVALID_DATE_RANGE)"
          - "No DisciplinaryAction with scope LICENSE on this license and status ADJUDICATED (if one exists, the renewal lands in ENCUMBERED instead — see next transition)"
        side_effects:
          - "expires_on := new_expires_on"
          - "Nurse privilege re-derivation (LICENSE_CHANGE eval appended if changed) + credential_posture recompute"
      - from: EXPIRED
        to: ENCUMBERED
        trigger: POST /credentialing/state-licenses/{licenseId}/renew
        actor: CredentialingSpecialist
        preconditions:
          - "All preconditions of EXPIRED -> ACTIVE, AND a DisciplinaryAction with scope LICENSE on this license and status ADJUDICATED exists"
        side_effects:
          - "expires_on := new_expires_on; license returns encumbered until the discipline is resolved"
          - "Nurse privilege re-derivation + credential_posture recompute"
      - from: ACTIVE
        to: ENCUMBERED
        trigger: "system: a DisciplinaryAction with scope LICENSE naming this license is adjudicated SUSTAINED with action_type in {SUSPENSION, REVOCATION}"
        actor: system
        preconditions: []
        side_effects:
          - "Nurse privilege re-derivation; append PrivilegeEvaluation (trigger_reason DISCIPLINE_CHANGE) if changed"
          - "Nurse.credential_posture recompute -> PRACTICE_RESTRICTED (posture cascade fires)"
      - from: ENCUMBERED
        to: ACTIVE
        trigger: "system: the DisciplinaryAction that encumbered this license transitions ADJUDICATED -> RESOLVED"
        actor: system
        preconditions:
          - "expires_on >= current_date (if expires_on < current_date, lands in EXPIRED instead)"
        side_effects:
          - "Nurse privilege re-derivation; append PrivilegeEvaluation (trigger_reason DISCIPLINE_CHANGE) if changed"
          - "Nurse.credential_posture recompute"
      - from: ENCUMBERED
        to: EXPIRED
        trigger: "system: the DisciplinaryAction that encumbered this license transitions ADJUDICATED -> RESOLVED while expires_on < current_date"
        actor: system
        preconditions: []
        side_effects:
          - "Nurse privilege re-derivation + credential_posture recompute"
      - from: DRAFT
        to: SURRENDERED
        trigger: POST /credentialing/state-licenses/{licenseId}/surrender
        actor: ComplianceOfficer
        preconditions:
          - "status != SURRENDERED (else ERR_INVALID_LICENSE_STATE)"
        side_effects:
          - "Nurse privilege re-derivation (LICENSE_CHANGE eval appended if changed) + credential_posture recompute"
      - from: PENDING_VERIFICATION
        to: SURRENDERED
        trigger: POST /credentialing/state-licenses/{licenseId}/surrender
        actor: ComplianceOfficer
        preconditions: ["status != SURRENDERED"]
        side_effects: ["Nurse privilege re-derivation + credential_posture recompute"]
      - from: VERIFIED
        to: SURRENDERED
        trigger: POST /credentialing/state-licenses/{licenseId}/surrender
        actor: ComplianceOfficer
        preconditions: ["status != SURRENDERED"]
        side_effects: ["Nurse privilege re-derivation + credential_posture recompute"]
      - from: ACTIVE
        to: SURRENDERED
        trigger: POST /credentialing/state-licenses/{licenseId}/surrender
        actor: ComplianceOfficer
        preconditions: ["status != SURRENDERED"]
        side_effects: ["Nurse privilege re-derivation (LICENSE_CHANGE eval appended if changed) + credential_posture recompute"]
      - from: EXPIRED
        to: SURRENDERED
        trigger: POST /credentialing/state-licenses/{licenseId}/surrender
        actor: ComplianceOfficer
        preconditions: ["status != SURRENDERED"]
        side_effects: ["Nurse privilege re-derivation + credential_posture recompute"]
      - from: ENCUMBERED
        to: SURRENDERED
        trigger: POST /credentialing/state-licenses/{licenseId}/surrender
        actor: ComplianceOfficer
        preconditions: ["status != SURRENDERED"]
        side_effects: ["Nurse privilege re-derivation + credential_posture recompute"]

  - entity: PrimarySourceVerification
    initial_state: REQUESTED
    terminal_states: [VERIFIED, DISCREPANCY, UNREACHABLE]
    transitions:
      - from: REQUESTED
        to: VERIFIED
        trigger: POST /credentialing/primary-source-verifications/{psvId}/record-result
        actor: PrimarySourceVerifier
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_PSV_STATE)"
          - "X-User-ID != requested_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_on := current_date; valid_through := verified_on + PSV_VALIDITY_DAYS"
          - "resolved_by_user_id := X-User-ID"
          - "If license.status == PENDING_VERIFICATION: license -> VERIFIED"
      - from: REQUESTED
        to: DISCREPANCY
        trigger: POST /credentialing/primary-source-verifications/{psvId}/record-result
        actor: PrimarySourceVerifier
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_PSV_STATE)"
          - "X-User-ID != requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "discrepancy_note present (else ERR_INVALID_REQUEST)"
        side_effects:
          - "resolved_by_user_id := X-User-ID"
          - "If license.status == PENDING_VERIFICATION: license -> DRAFT"
      - from: REQUESTED
        to: UNREACHABLE
        trigger: POST /credentialing/primary-source-verifications/{psvId}/record-result
        actor: PrimarySourceVerifier
        preconditions:
          - "status == REQUESTED (else ERR_INVALID_PSV_STATE)"
          - "X-User-ID != requested_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "resolved_by_user_id := X-User-ID; license status unchanged (a new PSV may be requested)"

  - entity: Certification
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /credentialing/_ops/expiry-sweep when expires_on < current_date"
        actor: system
        preconditions: ["expires_on < current_date (expires_on == current_date stays ACTIVE)"]
        side_effects:
          - "Every PacketItem with source_credential_id == this cert and status == VERIFIED -> INVALIDATED; owning packet readiness_score recomputed; if that packet's status == APPROVED -> VOIDED"
          - "Nurse.credential_posture recompute (posture cascade may fire)"
      - from: EXPIRED
        to: ACTIVE
        trigger: POST /credentialing/certifications/{certId}/renew
        actor: CredentialingSpecialist
        preconditions:
          - "status == EXPIRED (else ERR_INVALID_CERTIFICATION_STATE)"
          - "new_expires_on > current_date (else ERR_INVALID_DATE_RANGE)"
        side_effects:
          - "expires_on := new_expires_on"
          - "Nurse.credential_posture recompute (INVALIDATED packet items are NOT auto-restored; they need fresh submit-evidence)"
      - from: ACTIVE
        to: REVOKED
        trigger: POST /credentialing/certifications/{certId}/revoke
        actor: ComplianceOfficer
        preconditions: ["status in {ACTIVE, EXPIRED} (else ERR_INVALID_CERTIFICATION_STATE)"]
        side_effects:
          - "Every PacketItem with source_credential_id == this cert and status == VERIFIED -> INVALIDATED; packet readiness recompute; APPROVED packet -> VOIDED"
          - "Nurse.credential_posture recompute"
      - from: EXPIRED
        to: REVOKED
        trigger: POST /credentialing/certifications/{certId}/revoke
        actor: ComplianceOfficer
        preconditions: ["status in {ACTIVE, EXPIRED}"]
        side_effects: ["Nurse.credential_posture recompute"]

  - entity: DisciplinaryAction
    initial_state: REPORTED
    terminal_states: [DISMISSED, RESOLVED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: POST /credentialing/disciplinary-actions/{actionId}/acknowledge
        actor: ComplianceOfficer
        preconditions: ["status == REPORTED (else ERR_INVALID_DISCIPLINE_STATE)"]
        side_effects: ["acknowledged_by_user_id := X-User-ID"]
      - from: UNDER_REVIEW
        to: ADJUDICATED
        trigger: POST /credentialing/disciplinary-actions/{actionId}/adjudicate with outcome == SUSTAINED
        actor: ComplianceOfficer
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_DISCIPLINE_STATE)"
          - "X-User-ID != acknowledged_by_user_id (segregation of duties, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "adjudicated_by_user_id := X-User-ID; Nurse.open_encumbrance_count += 1"
          - "If scope == LICENSE and action_type in {SUSPENSION, REVOCATION}: the named license -> ENCUMBERED"
          - "If scope == PRIVILEGE: nurse privilege re-derivation downgrades ELIGIBLE_MULTISTATE -> SINGLE_STATE_ONLY (scope := [primary_state_of_residence]); append PrivilegeEvaluation (DISCIPLINE_CHANGE)"
          - "If action_type in {PROBATION, SUSPENSION, REVOCATION}: Nurse.credential_posture recompute -> PRACTICE_RESTRICTED (posture cascade fires: future shifts AUTO_CANCELLED with reason POSTURE_PRACTICE_RESTRICTED, Unit counters decremented, APPROVED packets VOIDED)"
          - "REPRIMAND: no license, privilege, or posture change (record only)"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: POST /credentialing/disciplinary-actions/{actionId}/adjudicate with outcome == DISMISSED
        actor: ComplianceOfficer
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_DISCIPLINE_STATE)"
          - "X-User-ID != acknowledged_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["adjudicated_by_user_id := X-User-ID"]
      - from: ADJUDICATED
        to: RESOLVED
        trigger: POST /credentialing/disciplinary-actions/{actionId}/resolve
        actor: ComplianceOfficer
        preconditions:
          - "status == ADJUDICATED (else ERR_INVALID_DISCIPLINE_STATE)"
          - "current_date >= effective_on + MIN_ACTIVE_DAYS[action_type] (else ERR_RESOLUTION_PREMATURE)"
        side_effects:
          - "Nurse.open_encumbrance_count -= 1"
          - "If scope == LICENSE and action_type in {SUSPENSION, REVOCATION}: named license ENCUMBERED -> ACTIVE (expires_on >= current_date) or -> EXPIRED (expires_on < current_date)"
          - "If scope == PRIVILEGE: nurse privilege re-derivation restores pre-action status; append PrivilegeEvaluation (DISCIPLINE_CHANGE)"
          - "Nurse.credential_posture recompute (lifts PRACTICE_RESTRICTED when this was the last open encumbrance)"

  - entity: CredentialPacket
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /credentialing/credential-packets/{packetId}/submit
        actor: Nurse
        preconditions:
          - "status == DRAFT or REJECTED (else ERR_INVALID_PACKET_STATE)"
          - "Acting nurse is packet.nurse_id (else ERR_OWNERSHIP_VIOLATION)"
          - "Every PacketItem of this packet has status in {SUBMITTED, VERIFIED, WAIVED} (else ERR_PACKET_ITEMS_INCOMPLETE)"
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: POST /credentialing/credential-packets/{packetId}/resubmit
        actor: Nurse
        preconditions:
          - "status == REJECTED (else ERR_INVALID_PACKET_STATE)"
          - "Acting nurse is packet.nurse_id (else ERR_OWNERSHIP_VIOLATION)"
          - "Every PacketItem has status in {SUBMITTED, VERIFIED, WAIVED} (else ERR_PACKET_ITEMS_INCOMPLETE)"
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /credentialing/credential-packets/{packetId}/start-review
        actor: CredentialingSpecialist
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_PACKET_STATE)"
          - "X-User-ID != packet.created_by_user_id (segregation, else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /credentialing/credential-packets/{packetId}/approve
        actor: CredentialingSpecialist
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_PACKET_STATE)"
          - "X-User-ID != packet.created_by_user_id (segregation, else ERR_SEGREGATION_OF_DUTIES)"
          - "Every PacketItem has status in {VERIFIED, WAIVED} (else ERR_PACKET_ITEMS_INCOMPLETE)"
          - "Nurse.status == ACTIVE AND Nurse.credential_posture == CLEAR (else ERR_NURSE_NOT_CLEAR)"
        side_effects: ["reviewed_by_user_id := X-User-ID"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /credentialing/credential-packets/{packetId}/reject
        actor: CredentialingSpecialist
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_PACKET_STATE)"
          - "X-User-ID != packet.created_by_user_id (segregation, else ERR_SEGREGATION_OF_DUTIES)"
          - "rejection_reason present (else ERR_INVALID_REQUEST)"
        side_effects: ["reviewed_by_user_id := X-User-ID"]
      - from: APPROVED
        to: VOIDED
        trigger: "system: nurse posture flips to any non-CLEAR value, OR a PacketItem of this packet transitions VERIFIED -> INVALIDATED, OR nurse is terminated"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: VOIDED
        trigger: "system: nurse is terminated"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: VOIDED
        trigger: "system: nurse is terminated"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: VOIDED
        trigger: "system: nurse is terminated"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PacketItem
    initial_state: MISSING
    terminal_states: [WAIVED]
    transitions:
      - from: MISSING
        to: SUBMITTED
        trigger: POST /credentialing/packet-items/{itemId}/submit-evidence
        actor: Nurse
        preconditions:
          - "status in {MISSING, INVALIDATED} (else ERR_INVALID_ITEM_STATE)"
          - "Acting nurse owns the parent packet (packet.nurse_id == X-User-ID, else ERR_OWNERSHIP_VIOLATION)"
          - "Parent packet status in {DRAFT, REJECTED} (else ERR_INVALID_PACKET_STATE)"
        side_effects: ["evidence_ref := input; submitted_by_user_id := X-User-ID"]
      - from: INVALIDATED
        to: SUBMITTED
        trigger: POST /credentialing/packet-items/{itemId}/submit-evidence
        actor: Nurse
        preconditions: ["same as MISSING -> SUBMITTED"]
        side_effects: ["evidence_ref := input; submitted_by_user_id := X-User-ID"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: POST /credentialing/packet-items/{itemId}/verify
        actor: CredentialingSpecialist
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_ITEM_STATE)"
          - "Evidence holds on the server side (else ERR_ITEM_EVIDENCE_INVALID): LICENSE_VERIFICATION requires an ACTIVE StateLicense for the nurse; BLS/ACLS require an ACTIVE Certification of that cert_type; COMPETENCY_ANNUAL requires a CURRENT CompetencyCompletion for a mandatory applicable requirement; ATTESTATION requires only evidence_ref"
        side_effects:
          - "source_credential_id := the credential row used as evidence (null for ATTESTATION)"
          - "Parent packet readiness_score recomputed"
      - from: MISSING
        to: WAIVED
        trigger: POST /credentialing/packet-items/{itemId}/waive
        actor: CredentialingSpecialist
        preconditions:
          - "status in {MISSING, SUBMITTED} (else ERR_INVALID_ITEM_STATE)"
          - "critical == false (else ERR_ITEM_NOT_WAIVABLE)"
        side_effects: ["Parent packet readiness_score recomputed"]
      - from: SUBMITTED
        to: WAIVED
        trigger: POST /credentialing/packet-items/{itemId}/waive
        actor: CredentialingSpecialist
        preconditions: ["same as MISSING -> WAIVED"]
        side_effects: ["Parent packet readiness_score recomputed"]
      - from: VERIFIED
        to: INVALIDATED
        trigger: "system: the credential row named by source_credential_id lapses (license EXPIRED/ENCUMBERED/SURRENDERED, cert EXPIRED/REVOKED, completion LAPSED/SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "Parent packet readiness_score recomputed"
          - "If parent packet status == APPROVED: packet -> VOIDED"

  - entity: CompetencyCompletion
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: LAPSED
        trigger: "system: POST /credentialing/_ops/expiry-sweep when expires_on < current_date"
        actor: system
        preconditions: ["expires_on < current_date (expires_on == current_date stays CURRENT)"]
        side_effects:
          - "PacketItems with source_credential_id == this completion and status VERIFIED -> INVALIDATED; packet readiness recompute; APPROVED packet -> VOIDED"
          - "Nurse.credential_posture recompute"
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system: a new CompetencyCompletion is created for the same (nurse_id, requirement_id)"
        actor: system
        preconditions: []
        side_effects: ["PacketItems sourced from this completion -> INVALIDATED only if they have status VERIFIED (they may re-verify against the new completion)"]
      - from: LAPSED
        to: SUPERSEDED
        trigger: "system: a new CompetencyCompletion is created for the same (nurse_id, requirement_id)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ShiftAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, AUTO_CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: POST /credentialing/shift-assignments/{shiftId}/start
        actor: NurseManager
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_SHIFT_STATE)"
          - "starts_at <= now < ends_at (else ERR_SHIFT_NOT_STARTABLE)"
          - "Nurse.credential_posture == CLEAR at start (else ERR_NURSE_NOT_CLEAR)"
        side_effects:
          - "was_clear_at_start := true (posture precondition guarantees the stamp value)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /credentialing/shift-assignments/{shiftId}/complete
        actor: NurseManager
        preconditions: ["status == IN_PROGRESS (else ERR_INVALID_SHIFT_STATE)"]
        side_effects: ["Unit counters unchanged on completion; hours remain counted until... note: COMPLETED assignments leave the {SCHEDULED, IN_PROGRESS} counter set, so Unit.scheduled_hours_total -= hours and active_assignment_count -= 1 on completion"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /credentialing/shift-assignments/{shiftId}/cancel
        actor: NurseManager
        preconditions: ["status == SCHEDULED (else ERR_INVALID_SHIFT_STATE)"]
        side_effects:
          - "cancel_reason := MANUAL"
          - "Unit.scheduled_hours_total -= hours; Unit.active_assignment_count -= 1"
          - "Nurse.credential_posture recompute (the cancelled assignment's unit requirements leave the snapshot set on the NEXT recompute)"
      - from: SCHEDULED
        to: AUTO_CANCELLED
        trigger: "system: nurse posture flips to non-CLEAR and starts_at > now, or nurse terminated"
        actor: system
        preconditions: ["starts_at > now (IN_PROGRESS assignments are never auto-cancelled)"]
        side_effects:
          - "cancel_reason := POSTURE_SCHEDULING_SUSPENDED | POSTURE_PRACTICE_RESTRICTED | NURSE_TERMINATED"
          - "Unit.scheduled_hours_total -= hours; Unit.active_assignment_count -= 1"

  - entity: AuditRun
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: FIELD_WORK
        trigger: POST /credentialing/audit-runs/{runId}/begin-fieldwork
        actor: ComplianceOfficer
        preconditions: ["status == INITIATED (else ERR_INVALID_AUDIT_STATE)"]
        side_effects:
          - "sampled_nurse_ids computed: per unit (units iterated by created_at ASC), candidates = nurses with >= 1 COMPLETED ShiftAssignment in that unit whose starts_at date is within [window_start, window_end] inclusive; rank by completed-shift-count in that unit DESC, tie-break nurse.created_at ASC; take first per_unit_sample_size"
      - from: FIELD_WORK
        to: FINDINGS_ISSUED
        trigger: POST /credentialing/audit-runs/{runId}/issue-findings
        actor: ComplianceOfficer
        preconditions: ["status == FIELD_WORK (else ERR_INVALID_AUDIT_STATE)"]
        side_effects:
          - "For each sampled nurse, evaluate credential slots as of window_end (date-based, sweep-independent): practice-authority slot, BLS slot, and one slot per mandatory applicable CompetencyRequirement; each deficient slot -> one AuditFinding (OPEN) with matching finding_type"
          - "point_in_time_rate, shift_incidence_rate (nurse_credential_validity_rate variants) and projected_deficiency_count (survey_deficiency_projection) computed and stored"
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: POST /credentialing/audit-runs/{runId}/close
        actor: ComplianceOfficer
        preconditions:
          - "status == FINDINGS_ISSUED (else ERR_INVALID_AUDIT_STATE)"
          - "No AuditFinding of this run has status OPEN (else ERR_AUDIT_FINDINGS_OPEN)"
        side_effects: []

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [REMEDIATED, ACCEPTED_RISK]
    transitions:
      - from: OPEN
        to: REMEDIATED
        trigger: POST /credentialing/audit-findings/{findingId}/remediate
        actor: ComplianceOfficer
        preconditions: ["status == OPEN (else ERR_INVALID_FINDING_STATE)"]
        side_effects: []
      - from: OPEN
        to: ACCEPTED_RISK
        trigger: POST /credentialing/audit-findings/{findingId}/accept-risk
        actor: ComplianceOfficer
        preconditions: ["status == OPEN (else ERR_INVALID_FINDING_STATE)"]
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: nurse-patch-stale-version
    parent_entity: Nurse
    write_endpoint: "PATCH /credentialing/nurses/{nurseId}"
    occ_field: expected_nurse_version
    description: |
      A PATCH against a Nurse whose version has advanced past the version the
      client last observed is rejected. This captures the case where another
      writer has just changed the nurse (e.g., a PSOR change that re-derived
      privileges) and the current writer's base view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: privilege-eval-stale-nurse
    parent_entity: Nurse
    write_endpoint: "POST /credentialing/privilege-evaluations"
    occ_field: expected_nurse_version
    description: |
      Creating a PrivilegeEvaluation against a Nurse whose version has advanced
      since the client last observed it is rejected. Each successful evaluation
      legitimately supersedes the prior current determination (the evaluation
      log is append-only), so a stale base version means the writer evaluated
      privileges against an out-of-date license/discipline picture.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: competency_expiry_date
    trigger: "CompetencyCompletion creation (manual or via session-booking complete)"
    algorithm: projection
    formula: |
      if requirement.window_mode == ROLLING:
        expires_on = completed_on + requirement.validity_months months
        (same day-of-month; if the target month lacks that day, use the target month's last day)
      if requirement.window_mode == FISCAL:
        expires_on = the first occurrence of FISCAL_MONTH_DAY (month-day) that is >= completed_on
        (a completion dated exactly on the fiscal-year end expires that same day)
      Lapse rule (sweep): completion is CURRENT while current_date <= expires_on; LAPSED when current_date > expires_on.
    input_set: "the new CompetencyCompletion's completed_on and its CompetencyRequirement's window_mode/validity_months"
    constants:
      FISCAL_MONTH_DAY: "06-30"
    precision: "whole ISO dates; no time component"
    variants:
      - name: ROLLING
        when: "requirement.window_mode == ROLLING"
        difference: "expiry is anniversary-based (completed_on + validity_months)"
      - name: FISCAL
        when: "requirement.window_mode == FISCAL"
        difference: "expiry is the next fiscal-year-end >= completed_on; identical completed_on values therefore yield different expires_on than ROLLING"

  - name: nurse_credential_validity_rate
    trigger: "POST /credentialing/audit-runs/{runId}/issue-findings"
    algorithm: aggregation
    formula: |
      Required slots per sampled nurse (evaluated purely from dates as of window_end, independent of sweep-driven statuses):
        slot 1 practice_authority: valid iff exists StateLicense of nurse with expires_on >= window_end AND status not in {SURRENDERED}
        slot 2 bls: valid iff exists Certification of nurse with cert_type == BLS, expires_on >= window_end, status != REVOKED
        slots 3..n: one per mandatory CompetencyRequirement whose applies_to contains nurse.employment_type:
                    valid iff exists CompetencyCompletion (nurse, requirement) with expires_on >= window_end
      POINT_IN_TIME variant (pooled):
        point_in_time_rate = round_half_up(100 * valid_slots / total_slots across ALL sampled nurses, 2)
        (total_slots == 0 -> rate 100.0)
      SHIFT_INCIDENCE variant:
        shift_incidence_rate = round_half_up(100 * count(shifts) where was_clear_at_start == true / count(shifts), 2)
        over all ShiftAssignments with status == COMPLETED, nurse in sample, starts_at date within [window_start, window_end] inclusive
        (denominator == 0 -> rate 100.0, vacuous compliance)
    input_set: "AuditRun.sampled_nurse_ids; their StateLicense/Certification/CompetencyCompletion rows; COMPLETED ShiftAssignments in the window"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: POINT_IN_TIME
        when: "stored as AuditRun.point_in_time_rate"
        difference: "measures slot validity as of window_end; a nurse whose BLS expired after her shifts scores below 100"
      - name: SHIFT_INCIDENCE
        when: "stored as AuditRun.shift_incidence_rate"
        difference: "measures the was_clear_at_start stamp over completed shifts in the window; identical data yields a different number than POINT_IN_TIME whenever credentials lapsed after the shifts ran"

  - name: packet_readiness_score
    trigger: "packet creation (score 0), every PacketItem transition (submit-evidence, verify, waive, INVALIDATED cascade)"
    algorithm: weighted_scoring
    formula: |
      items = PacketItems of the packet (materialized at creation):
        base set: LICENSE_VERIFICATION (weight 40, critical), BLS (20, critical), COMPETENCY_ANNUAL (15, critical), ATTESTATION (5, not critical)
        plus ACLS (20, critical) iff packet.target_unit.required_cert_types contains ACLS
      credit(status): VERIFIED = 1.0, WAIVED = 0.5, SUBMITTED = 0.25, MISSING = 0, INVALIDATED = 0
      raw = round_half_up( sum(weight_i * credit_i) / sum(weight_i), 4 )
      critical cap: if any critical item has status in {MISSING, INVALIDATED}: score = min(raw, CRITICAL_CAP)
      else score = raw
    input_set: "PacketItems of one CredentialPacket"
    constants:
      CRITICAL_CAP: 0.49
      WAIVER_CREDIT: 0.5
      SUBMITTED_CREDIT: 0.25
    precision: "4 decimal places, round_half_up"

  - name: survey_deficiency_projection
    trigger: "POST /credentialing/audit-runs/{runId}/issue-findings"
    algorithm: tiered_pricing
    formula: |
      For each unit u that contributed sampled nurses (units processed in created_at ASC order):
        P_u = count of candidate nurses in unit u (>= 1 COMPLETED shift in window)
        s_u = count sampled from unit u = min(per_unit_sample_size, P_u)
        d_u = count of sampled nurses in unit u with >= 1 deficient slot as of window_end
        proj_u = round_half_up(d_u / s_u * P_u, 2)      # per-stratum rounding FIRST (pinned order)
      projected_deficiency_count = round_half_up( sum(proj_u), 0 )   # integer round of the SUM of rounded strata
      Pinned order is normative: rounding each stratum to 2 decimals BEFORE summing is the required
      behavior; rounding strata to integers first, or summing unrounded fractions, yields different
      values (e.g., strata 2.5 + 1.5: pinned -> round(4.00) = 4; integer-first -> 3 + 2 = 5).
      Units with zero candidates contribute nothing; if no unit has candidates, projected_deficiency_count = 0.
    input_set: "AuditRun sample and deficiency evaluation per unit"
    constants: {}
    precision: "strata 2 decimals round_half_up, final 0 decimals round_half_up"

  - name: credential_posture_evaluation
    trigger: "any license/certification/completion/discipline create or transition; shift create/cancel/auto-cancel; privilege evaluation; PATCH PSOR; nurse activate; expiry sweep"
    algorithm: constraint_propagation
    formula: |
      Pinned evaluation order (normative — the dependency is circular-looking because the
      requirement set depends on assignments whose existence was gated on posture):
        (1) Snapshot the unit-derived requirement set FIRST: U = set of required_cert_types over all
            units having >= 1 ShiftAssignment of this nurse with status in {SCHEDULED, IN_PROGRESS}
            evaluated at this instant. Cancellations triggered by step (4) do NOT shrink U within
            this evaluation (no oscillation; a later recompute may clear the nurse after remediation).
        (2) Base requirement set R = {BLS cert} union {mandatory CompetencyRequirements with
            employment_type in applies_to} union U.
        (3) Evaluate in order:
            a. If nurse.status != ACTIVE -> posture := SCHEDULING_SUSPENDED (ONBOARDING/TERMINATED snapshot). STOP.
            b. If any DisciplinaryAction of nurse has status == ADJUDICATED and action_type in
               {PROBATION, SUSPENSION, REVOCATION} -> PRACTICE_RESTRICTED. STOP.
            c. Practice authority: FACILITY_STATE must be in the derived practice_scope
               (privilege_scope_determination) else SCHEDULING_SUSPENDED. STOP.
            d. Deficit check: every cert in R needs an ACTIVE Certification of that type; every
               competency in R needs a CURRENT CompetencyCompletion. Any deficit -> SCHEDULING_SUSPENDED.
            e. Otherwise CLEAR.
        (4) If the new posture differs from the stored one: persist; if it flipped to non-CLEAR,
            fire the posture cascade exactly once (future SCHEDULED shifts -> AUTO_CANCELLED with
            reason 'POSTURE_' + posture; Unit counters decremented per cancelled shift; APPROVED
            packets -> VOIDED).
    input_set: "one Nurse; her StateLicenses, Certifications, CompetencyCompletions, DisciplinaryActions, ShiftAssignments, and the Units behind them"
    constants:
      FACILITY_STATE: "TX"
    precision: "enum result; deterministic"

  - name: privilege_scope_determination
    trigger: "POST /credentialing/privilege-evaluations (explicit, OCC-guarded); embedded inside credential_posture_evaluation; license/discipline transitions and PATCH PSOR (auto-append PrivilegeEvaluation when the derived result changes)"
    algorithm: constraint_propagation
    formula: |
      home license selector: candidates = StateLicenses of nurse with status == ACTIVE and
        state_code == nurse.primary_state_of_residence; rank by expires_on DESC, tie-break created_at ASC.
      open_privilege_encumbrance = exists DisciplinaryAction of nurse with scope == PRIVILEGE and status == ADJUDICATED.
      Derivation:
        if home license exists AND home license.multistate_flag AND PSOR in COMPACT_STATES
           AND NOT open_privilege_encumbrance:
              status = ELIGIBLE_MULTISTATE; scope = COMPACT_STATES (sorted ASC)
        elif home license exists AND home license.multistate_flag AND PSOR in COMPACT_STATES
           AND open_privilege_encumbrance:
              status = SINGLE_STATE_ONLY; scope = [PSOR]
        else:
              active_states = sorted distinct state_codes of the nurse's ACTIVE StateLicenses
              status = SINGLE_STATE_ONLY if active_states non-empty else NONE
              scope = active_states (or [] when NONE)
      The explicit endpoint always appends a PrivilegeEvaluation row (trigger_reason MANUAL) and
      increments Nurse.version; embedded derivations append a row only when status or scope changed.
    input_set: "one Nurse's StateLicenses and ADJUDICATED DisciplinaryActions"
    constants:
      COMPACT_STATES: ["AZ", "CO", "FL", "GA", "MD", "NC", "TN", "TX"]
      FACILITY_STATE: "TX"
    precision: "deterministic set algebra"

  - name: weekly_rolling_hours
    trigger: "POST /credentialing/shift-assignments (validation)"
    algorithm: aggregation
    formula: |
      For a new assignment with start datetime s:
        window = [midnight_utc(date(s)) - 6 days, midnight_utc(date(s)) + 1 day)   # half-open, 7 calendar days
        consider the nurse's ShiftAssignments with status in {SCHEDULED, IN_PROGRESS, COMPLETED}
          whose [starts_at, ends_at) overlaps the window (s1 < window_end AND window_start < e1)
        total_minutes = sum of (ends_at - starts_at) in whole minutes over those assignments
                        + (new ends_at - starts_at) in whole minutes
        reject iff total_minutes > WEEKLY_HOUR_CAP_MINUTES      # exactly 3600 minutes is ALLOWED
      Displayed hours per assignment: round_half_up(minutes / 60, 2); the cap compares integer minutes, never rounded hours.
    input_set: "one Nurse's non-cancelled ShiftAssignments overlapping the window"
    constants:
      WEEKLY_HOUR_CAP_MINUTES: 3600   # 60.0 hours
    precision: "integer minutes for the cap; 2 decimals round_half_up for stored hours"

  - name: expiry_monitoring_buckets
    trigger: "GET /credentialing/monitoring/expiry-report"
    algorithm: threshold
    formula: |
      days_to_expiry = expires_on - current_date (integer days; negative when past)
      bucket: days < 0 -> EXPIRED; 0 <= days <= CRITICAL_DAYS -> CRITICAL;
              CRITICAL_DAYS < days <= WARNING_DAYS -> WARNING; days > WARNING_DAYS -> OK
      Included rows (date-driven, NOT sweep-status-driven):
        StateLicenses with status in {VERIFIED, ACTIVE, ENCUMBERED, EXPIRED} (DRAFT and PENDING_VERIFICATION excluded)
        Certifications with status in {ACTIVE, EXPIRED} (REVOKED excluded)
        CompetencyCompletions with status in {CURRENT, LAPSED} (SUPERSEDED excluded)
      Optional nurse_id filter. Sort: days_to_expiry ASC, tie-break created_at ASC.
    input_set: "all credential rows of the three kinds above (optionally one nurse)"
    constants:
      CRITICAL_DAYS: 30
      WARNING_DAYS: 60
    precision: "integer days"

  - name: psv_freshness
    trigger: "POST /credentialing/state-licenses/{licenseId}/attest and .../renew; POST /credentialing/primary-source-verifications/{psvId}/record-result (sets the fields)"
    algorithm: threshold
    formula: |
      On VERIFIED result: verified_on := current_date; valid_through := verified_on + PSV_VALIDITY_DAYS.
      A PSV is fresh iff status == VERIFIED AND valid_through >= current_date (inclusive boundary:
      valid_through == current_date is still fresh).
      attest/renew require at least one fresh VERIFIED PSV; otherwise (none VERIFIED, or all
      stale) -> ERR_PSV_STALE.
    input_set: "PrimarySourceVerification rows of one StateLicense"
    constants:
      PSV_VALIDITY_DAYS: 180
    precision: "whole ISO dates"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role must be one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 2.5
    category: auth
    check: "Entity-backed ownership: role Nurse may only act on resources whose owning nurse_id == X-User-ID (packet submit/resubmit, item submit-evidence, own completions)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "Nurse-role endpoints"

  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: business_referential
    check: "Body FK references must exist (nurse_id, license_id, unit_id/target_unit_id, requirement_id) -> domain 404; cross-row consistency: license_id must belong to nurse_id (ERR_CROSS_NURSE_REFERENCE), requirement.applies_to must contain nurse.employment_type (ERR_REQUIREMENT_NOT_APPLICABLE), scope == LICENSE requires license_id present and scope == PRIVILEGE requires license_id absent (ERR_INVALID_REQUEST)"
    error_id: "ERR_NURSE_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_REQUIREMENT_NOT_FOUND | ERR_CROSS_NURSE_REFERENCE | ERR_REQUIREMENT_NOT_APPLICABLE | ERR_INVALID_REQUEST"
    http_status: 404
    applies_to: "POST endpoints with body FKs"

  - priority: 4.5
    category: state
    check: "OCC: endpoints declaring expected_nurse_version require it to equal the nurse's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /credentialing/nurses/{nurseId}; POST /credentialing/privilege-evaluations"

  - priority: 5
    category: state
    check: "Target entity must be in a valid from-state for the requested transition (license submit/attest/renew/surrender, PSV record-result, cert renew/revoke, discipline acknowledge/adjudicate/resolve, packet submit/start-review/approve/reject/resubmit, item submit-evidence/verify/waive, shift start/complete/cancel, audit begin-fieldwork/issue-findings/close, finding remediate/accept-risk, nurse activate/terminate). Also state gates on RELATED entities: disciplinary-actions creation requires nurse.status == ACTIVE (ERR_INVALID_NURSE_STATE); shift creation requires nurse.status == ACTIVE (ERR_INVALID_NURSE_STATE) and then credential_posture == CLEAR (ERR_NURSE_NOT_CLEAR); packet approve requires nurse ACTIVE and CLEAR (ERR_INVALID_NURSE_STATE / ERR_NURSE_NOT_CLEAR)."
    error_id: "ERR_INVALID_LICENSE_STATE | ERR_INVALID_PSV_STATE | ERR_INVALID_CERTIFICATION_STATE | ERR_INVALID_DISCIPLINE_STATE | ERR_INVALID_PACKET_STATE | ERR_INVALID_ITEM_STATE | ERR_INVALID_SHIFT_STATE | ERR_INVALID_AUDIT_STATE | ERR_INVALID_FINDING_STATE | ERR_INVALID_NURSE_STATE | ERR_INVALID_BOOKING_STATE"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_safety
    check: "Safety/compliance: segregation-of-duties user checks (attest vs created_by; record-result vs requested_by; adjudicate vs acknowledged_by; packet review vs created_by) ERR_SEGREGATION_OF_DUTIES; shift create requires every unit.required_cert_types member to have an ACTIVE Certification (ERR_UNIT_CERT_REQUIREMENT_UNMET); attest/renew require fresh VERIFIED PSV (ERR_PSV_STALE); multistate_flag=true requires state_code in COMPACT_STATES (ERR_MULTISTATE_NON_COMPACT_STATE); nurse activate requires >= 1 ACTIVE license and FACILITY_STATE in derived scope (ERR_HIRE_REQUIREMENTS_UNMET); item verify requires evidence to hold (ERR_ITEM_EVIDENCE_INVALID)"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_UNIT_CERT_REQUIREMENT_UNMET | ERR_PSV_STALE | ERR_MULTISTATE_NON_COMPACT_STATE | ERR_HIRE_REQUIREMENTS_UNMET | ERR_ITEM_EVIDENCE_INVALID"
    http_status: 403
    applies_to: "mutation endpoints as listed"

  - priority: 7
    category: business_constraint
    check: "Constraint satisfaction: shift overlap for the same nurse over half-open [starts_at, ends_at) among {SCHEDULED, IN_PROGRESS} (ERR_SHIFT_OVERLAP); session booked_count >= capacity (ERR_SESSION_FULL); duplicate booking of same nurse in same session (ERR_BOOKING_DUPLICATE); at most one CredentialPacket per nurse in {DRAFT, SUBMITTED, UNDER_REVIEW} (ERR_ACTIVE_PACKET_EXISTS); packet submit/approve item completeness (ERR_PACKET_ITEMS_INCOMPLETE); waive requires critical == false (ERR_ITEM_NOT_WAIVABLE); audit close requires no OPEN findings (ERR_AUDIT_FINDINGS_OPEN); unique (state_code, license_number) and unique email and unique requirement code and unique unit name (ERR_DUPLICATE_RESOURCE); booking delete requires attended == false (ERR_INVALID_BOOKING_STATE)"
    error_id: "ERR_SHIFT_OVERLAP | ERR_SESSION_FULL | ERR_BOOKING_DUPLICATE | ERR_ACTIVE_PACKET_EXISTS | ERR_PACKET_ITEMS_INCOMPLETE | ERR_ITEM_NOT_WAIVABLE | ERR_AUDIT_FINDINGS_OPEN | ERR_DUPLICATE_RESOURCE | ERR_INVALID_BOOKING_STATE"
    http_status: 409
    applies_to: "mutation endpoints as listed"

  - priority: 8
    category: business_temporal
    check: "Temporal: shift start_date < current_date (ERR_SHIFT_IN_PAST); shift start_date > current_date + SCHEDULING_HORIZON_DAYS (ERR_SCHEDULING_HORIZON_EXCEEDED); shift start outside [starts_at, ends_at) at start (ERR_SHIFT_NOT_STARTABLE); ends_at <= starts_at (ERR_INVALID_DATE_RANGE); discipline effective_on > current_date (ERR_DISCIPLINE_EFFECTIVE_FUTURE); resolve before effective_on + MIN_ACTIVE_DAYS[action_type] (ERR_RESOLUTION_PREMATURE); ACTIVE-license renew when (expires_on - current_date).days > RENEWAL_WINDOW_DAYS (ERR_RENEWAL_WINDOW_NOT_OPEN); new_expires_on <= current_date (ERR_INVALID_DATE_RANGE); audit window_start >= window_end or window_end > current_date (ERR_INVALID_DATE_RANGE); completion completed_on > current_date (ERR_INVALID_DATE_RANGE); session-booking complete before session.ends_at (ERR_SESSION_NOT_ENDED)"
    error_id: "ERR_SHIFT_IN_PAST | ERR_SCHEDULING_HORIZON_EXCEEDED | ERR_SHIFT_NOT_STARTABLE | ERR_INVALID_DATE_RANGE | ERR_DISCIPLINE_EFFECTIVE_FUTURE | ERR_RESOLUTION_PREMATURE | ERR_RENEWAL_WINDOW_NOT_OPEN | ERR_SESSION_NOT_ENDED"
    http_status: 422
    applies_to: "mutation endpoints as listed"

  - priority: 9
    category: business_fiscal
    check: "Labor budget: weekly_rolling_hours total_minutes > WEEKLY_HOUR_CAP_MINUTES for the new assignment's 7-day window (ERR_WEEKLY_HOURS_EXCEEDED)"
    error_id: ERR_WEEKLY_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /credentialing/shift-assignments"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Nurses ---
  - { method: POST, path: "/credentialing/nurses", description: "Create nurse (status ONBOARDING, posture SCHEDULING_SUSPENDED, privilege NONE)", roles: [CredentialingSpecialist], code: 201, input: [full_name, email, primary_state_of_residence, employment_type, hire_date], output: Nurse, side_effects: ["initial privilege derivation (scope computed; no PrivilegeEvaluation row appended on create)"] }
  - { method: GET, path: "/credentialing/nurses", description: "List nurses with filters and pagination", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["status?", "credential_posture?", "employment_type?", "limit?", "offset?"], output: "Nurse[]", side_effects: [] }
  - { method: GET, path: "/credentialing/nurses/{nurseId}", description: "Get one nurse (includes computed posture/privilege fields)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: Nurse, side_effects: [] }
  - { method: PATCH, path: "/credentialing/nurses/{nurseId}", description: "Update nurse profile incl. PSOR; OCC-guarded; increments nurse.version by 1", roles: [CredentialingSpecialist], code: 200, input: ["full_name?", "email?", "primary_state_of_residence?", "employment_type?", expected_nurse_version], output: Nurse, side_effects: ["increments Nurse.version by 1", "on primary_state_of_residence change: privilege re-derivation, PrivilegeEvaluation appended (PSOR_CHANGE) if result changed, posture recompute"] }
  - { method: POST, path: "/credentialing/nurses/{nurseId}/activate", description: "ONBOARDING -> ACTIVE; requires >= 1 ACTIVE license and FACILITY_STATE in derived scope", roles: [CredentialingSpecialist], code: 200, input: [], output: Nurse, side_effects: ["status -> ACTIVE", "credential_posture recompute"] }
  - { method: POST, path: "/credentialing/nurses/{nurseId}/terminate", description: "-> TERMINATED; cascades: future SCHEDULED shifts AUTO_CANCELLED (NURSE_TERMINATED), non-terminal packets VOIDED, posture forced SCHEDULING_SUSPENDED", roles: [CredentialingSpecialist], code: 200, input: [], output: Nurse, side_effects: ["status -> TERMINATED", "shift auto-cancel cascade decrements Unit.scheduled_hours_total and active_assignment_count", "packets -> VOIDED"] }

  # --- State Licenses ---
  - { method: POST, path: "/credentialing/state-licenses", description: "Create license (DRAFT); multistate_flag requires compact state_code", roles: [CredentialingSpecialist], code: 201, input: [nurse_id, state_code, license_number, license_class, multistate_flag, issued_on, expires_on], output: StateLicense, side_effects: ["created_by_user_id := X-User-ID"] }
  - { method: GET, path: "/credentialing/state-licenses", description: "List licenses (FK reverse lookup by nurse_id)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["nurse_id?", "state_code?", "status?", "limit?", "offset?"], output: "StateLicense[]", side_effects: [] }
  - { method: GET, path: "/credentialing/state-licenses/{licenseId}", description: "Get one license", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: StateLicense, side_effects: [] }
  - { method: POST, path: "/credentialing/state-licenses/{licenseId}/submit", description: "DRAFT -> PENDING_VERIFICATION", roles: [CredentialingSpecialist], code: 200, input: [], output: StateLicense, side_effects: ["status -> PENDING_VERIFICATION"] }
  - { method: POST, path: "/credentialing/state-licenses/{licenseId}/attest", description: "VERIFIED -> ACTIVE; segregation vs created_by; requires fresh VERIFIED PSV", roles: [PrimarySourceVerifier], code: 200, input: [], output: StateLicense, side_effects: ["status -> ACTIVE", "verified_by_user_id := X-User-ID", "privilege re-derivation (LICENSE_CHANGE eval if changed)", "posture recompute"] }
  - { method: POST, path: "/credentialing/state-licenses/{licenseId}/renew", description: "EXPIRED -> ACTIVE (or ENCUMBERED when an open LICENSE-scope adjudication exists); ACTIVE renewable only within RENEWAL_WINDOW_DAYS of expiry; requires fresh VERIFIED PSV", roles: [CredentialingSpecialist], code: 200, input: [new_expires_on], output: StateLicense, side_effects: ["expires_on := new_expires_on", "status -> ACTIVE or ENCUMBERED", "privilege re-derivation + posture recompute"] }
  - { method: POST, path: "/credentialing/state-licenses/{licenseId}/surrender", description: "Any non-terminal status -> SURRENDERED (terminal)", roles: [ComplianceOfficer], code: 200, input: [], output: StateLicense, side_effects: ["status -> SURRENDERED", "privilege re-derivation (LICENSE_CHANGE eval if changed) + posture recompute"] }

  # --- Primary Source Verifications ---
  - { method: POST, path: "/credentialing/primary-source-verifications", description: "Request a PSV for a license in PENDING_VERIFICATION, VERIFIED, or EXPIRED status", roles: [CredentialingSpecialist], code: 201, input: [license_id, channel], output: PrimarySourceVerification, side_effects: ["status REQUESTED", "requested_by_user_id := X-User-ID"] }
  - { method: GET, path: "/credentialing/primary-source-verifications", description: "List PSVs (FK reverse lookup by license_id)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["license_id?", "status?", "limit?", "offset?"], output: "PrimarySourceVerification[]", side_effects: [] }
  - { method: GET, path: "/credentialing/primary-source-verifications/{psvId}", description: "Get one PSV", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: PrimarySourceVerification, side_effects: [] }
  - { method: POST, path: "/credentialing/primary-source-verifications/{psvId}/record-result", description: "REQUESTED -> VERIFIED | DISCREPANCY | UNREACHABLE; segregation vs requester; VERIFIED sets verified_on=clock date and valid_through=+180d and moves a PENDING_VERIFICATION license to VERIFIED; DISCREPANCY moves it back to DRAFT", roles: [PrimarySourceVerifier], code: 200, input: [outcome, "discrepancy_note?"], output: PrimarySourceVerification, side_effects: ["status -> outcome", "verified_on/valid_through set on VERIFIED", "license PENDING_VERIFICATION -> VERIFIED (or -> DRAFT on DISCREPANCY)"] }

  # --- Certifications ---
  - { method: POST, path: "/credentialing/certifications", description: "Record a certification (ACTIVE immediately)", roles: [CredentialingSpecialist], code: 201, input: [nurse_id, cert_type, issuing_body, obtained_on, expires_on], output: Certification, side_effects: ["status ACTIVE", "posture recompute"] }
  - { method: GET, path: "/credentialing/certifications", description: "List certifications (FK reverse lookup by nurse_id)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["nurse_id?", "cert_type?", "status?", "limit?", "offset?"], output: "Certification[]", side_effects: [] }
  - { method: GET, path: "/credentialing/certifications/{certId}", description: "Get one certification", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: Certification, side_effects: [] }
  - { method: POST, path: "/credentialing/certifications/{certId}/renew", description: "EXPIRED -> ACTIVE with new_expires_on > current_date", roles: [CredentialingSpecialist], code: 200, input: [new_expires_on], output: Certification, side_effects: ["expires_on := new_expires_on", "status -> ACTIVE", "posture recompute (INVALIDATED packet items are not restored)"] }
  - { method: POST, path: "/credentialing/certifications/{certId}/revoke", description: "ACTIVE|EXPIRED -> REVOKED (terminal); invalidates sourced packet items", roles: [ComplianceOfficer], code: 200, input: [], output: Certification, side_effects: ["status -> REVOKED", "sourced VERIFIED PacketItems -> INVALIDATED; APPROVED packets -> VOIDED", "posture recompute"] }

  # --- Disciplinary Actions ---
  - { method: POST, path: "/credentialing/disciplinary-actions", description: "Report a disciplinary action (REPORTED); nurse must be ACTIVE; license_id required iff scope == LICENSE and must belong to nurse_id", roles: [ComplianceOfficer], code: 201, input: [nurse_id, scope, action_type, effective_on, "license_id?"], output: DisciplinaryAction, side_effects: ["status REPORTED", "reported_by_user_id := X-User-ID"] }
  - { method: GET, path: "/credentialing/disciplinary-actions", description: "List disciplinary actions (FK reverse lookup)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["nurse_id?", "license_id?", "status?", "limit?", "offset?"], output: "DisciplinaryAction[]", side_effects: [] }
  - { method: GET, path: "/credentialing/disciplinary-actions/{actionId}", description: "Get one disciplinary action", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: DisciplinaryAction, side_effects: [] }
  - { method: POST, path: "/credentialing/disciplinary-actions/{actionId}/acknowledge", description: "REPORTED -> UNDER_REVIEW", roles: [ComplianceOfficer], code: 200, input: [], output: DisciplinaryAction, side_effects: ["acknowledged_by_user_id := X-User-ID"] }
  - { method: POST, path: "/credentialing/disciplinary-actions/{actionId}/adjudicate", description: "UNDER_REVIEW -> ADJUDICATED (outcome SUSTAINED) or DISMISSED; segregation vs acknowledger; SUSTAINED fires the encumbrance cascade (license ENCUMBERED / privilege downgrade / posture PRACTICE_RESTRICTED)", roles: [ComplianceOfficer], code: 200, input: [outcome], output: DisciplinaryAction, side_effects: ["open_encumbrance_count += 1 on SUSTAINED", "license ENCUMBERED when scope LICENSE + SUSPENSION/REVOCATION", "privilege re-derivation + PrivilegeEvaluation (DISCIPLINE_CHANGE) when scope PRIVILEGE", "posture recompute; posture cascade when PROBATION/SUSPENSION/REVOCATION"] }
  - { method: POST, path: "/credentialing/disciplinary-actions/{actionId}/resolve", description: "ADJUDICATED -> RESOLVED after MIN_ACTIVE_DAYS[action_type]; compensation cascade lifts encumbrance", roles: [ComplianceOfficer], code: 200, input: [resolution_note], output: DisciplinaryAction, side_effects: ["open_encumbrance_count -= 1", "license ENCUMBERED -> ACTIVE or EXPIRED by expiry date", "privilege re-derivation + PrivilegeEvaluation (DISCIPLINE_CHANGE)", "posture recompute"] }

  # --- Credential Packets (travel nurse) ---
  - { method: POST, path: "/credentialing/credential-packets", description: "Create packet (DRAFT) and materialize PacketItems from the base set + target unit requirements; at most one packet per nurse in {DRAFT, SUBMITTED, UNDER_REVIEW}", roles: [CredentialingSpecialist], code: 201, input: [nurse_id, target_unit_id], output: CredentialPacket, side_effects: ["created_by_user_id := X-User-ID", "PacketItems materialized in the FIXED order LICENSE_VERIFICATION, BLS, ACLS (iff target unit.required_cert_types contains ACLS), COMPETENCY_ANNUAL, ATTESTATION (readiness_score 0)"] }
  - { method: GET, path: "/credentialing/credential-packets", description: "List packets (FK reverse lookup by nurse_id / target_unit_id)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["nurse_id?", "target_unit_id?", "status?", "limit?", "offset?"], output: "CredentialPacket[]", side_effects: [] }
  - { method: GET, path: "/credentialing/credential-packets/{packetId}", description: "Get one packet (includes computed readiness_score)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: CredentialPacket, side_effects: [] }
  - { method: POST, path: "/credentialing/credential-packets/{packetId}/submit", description: "DRAFT -> SUBMITTED by the owning nurse; all items must be SUBMITTED/VERIFIED/WAIVED", roles: [Nurse], code: 200, input: [], output: CredentialPacket, side_effects: ["status -> SUBMITTED"] }
  - { method: POST, path: "/credentialing/credential-packets/{packetId}/start-review", description: "SUBMITTED -> UNDER_REVIEW; segregation vs created_by", roles: [CredentialingSpecialist], code: 200, input: [], output: CredentialPacket, side_effects: ["status -> UNDER_REVIEW"] }
  - { method: POST, path: "/credentialing/credential-packets/{packetId}/approve", description: "UNDER_REVIEW -> APPROVED; segregation vs created_by; all items VERIFIED/WAIVED; nurse ACTIVE and CLEAR", roles: [CredentialingSpecialist], code: 200, input: [], output: CredentialPacket, side_effects: ["status -> APPROVED", "reviewed_by_user_id := X-User-ID"] }
  - { method: POST, path: "/credentialing/credential-packets/{packetId}/reject", description: "UNDER_REVIEW -> REJECTED; segregation vs created_by", roles: [CredentialingSpecialist], code: 200, input: [rejection_reason], output: CredentialPacket, side_effects: ["status -> REJECTED", "reviewed_by_user_id := X-User-ID"] }
  - { method: POST, path: "/credentialing/credential-packets/{packetId}/resubmit", description: "REJECTED -> SUBMITTED by the owning nurse; all items must be SUBMITTED/VERIFIED/WAIVED", roles: [Nurse], code: 200, input: [], output: CredentialPacket, side_effects: ["status -> SUBMITTED"] }

  # --- Packet Items ---
  - { method: GET, path: "/credentialing/packet-items", description: "List packet items (FK reverse lookup by packet_id)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["packet_id?", "status?", "limit?", "offset?"], output: "PacketItem[]", side_effects: [] }
  - { method: GET, path: "/credentialing/packet-items/{itemId}", description: "Get one packet item", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: PacketItem, side_effects: [] }
  - { method: POST, path: "/credentialing/packet-items/{itemId}/submit-evidence", description: "MISSING|INVALIDATED -> SUBMITTED by the owning nurse; packet must be DRAFT or REJECTED", roles: [Nurse], code: 200, input: [evidence_ref], output: PacketItem, side_effects: ["status -> SUBMITTED", "submitted_by_user_id := X-User-ID"] }
  - { method: POST, path: "/credentialing/packet-items/{itemId}/verify", description: "SUBMITTED -> VERIFIED; server checks the underlying credential evidence holds; records source_credential_id", roles: [CredentialingSpecialist], code: 200, input: [], output: PacketItem, side_effects: ["status -> VERIFIED", "source_credential_id recorded", "packet readiness_score recomputed"] }
  - { method: POST, path: "/credentialing/packet-items/{itemId}/waive", description: "MISSING|SUBMITTED -> WAIVED; only non-critical items", roles: [CredentialingSpecialist], code: 200, input: [waive_reason], output: PacketItem, side_effects: ["status -> WAIVED", "packet readiness_score recomputed"] }

  # --- Competency Requirements & Completions ---
  - { method: POST, path: "/credentialing/competency-requirements", description: "Create a competency/annual requirement (config)", roles: [ComplianceOfficer], code: 201, input: [code, name, validity_months, window_mode, mandatory, applies_to], output: CompetencyRequirement, side_effects: [] }
  - { method: GET, path: "/credentialing/competency-requirements", description: "List requirements", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["window_mode?", "limit?", "offset?"], output: "CompetencyRequirement[]", side_effects: [] }
  - { method: GET, path: "/credentialing/competency-requirements/{reqId}", description: "Get one requirement", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: CompetencyRequirement, side_effects: [] }
  - { method: POST, path: "/credentialing/competency-completions", description: "Record a completion (CURRENT); supersedes prior CURRENT/LAPSED rows for the same (nurse, requirement); computes expires_on per window_mode; Nurse role may only record own", roles: [Nurse, CredentialingSpecialist], code: 201, input: [nurse_id, requirement_id, completed_on], output: CompetencyCompletion, side_effects: ["prior completions for (nurse_id, requirement_id) -> SUPERSEDED", "expires_on computed (competency_expiry_date)", "posture recompute"] }
  - { method: GET, path: "/credentialing/competency-completions", description: "List completions (FK reverse lookup)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["nurse_id?", "requirement_id?", "session_booking_id?", "status?", "limit?", "offset?"], output: "CompetencyCompletion[]", side_effects: [] }
  - { method: GET, path: "/credentialing/competency-completions/{completionId}", description: "Get one completion", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: CompetencyCompletion, side_effects: [] }

  # --- Units ---
  - { method: POST, path: "/credentialing/units", description: "Create a unit with required cert types", roles: [NurseManager], code: 201, input: [name, "required_cert_types?"], output: Unit, side_effects: [] }
  - { method: GET, path: "/credentialing/units", description: "List units", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["limit?", "offset?"], output: "Unit[]", side_effects: [] }
  - { method: GET, path: "/credentialing/units/{unitId}", description: "Get one unit (includes computed staffing counters)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: Unit, side_effects: [] }

  # --- Shift Assignments ---
  - { method: POST, path: "/credentialing/shift-assignments", description: "Book a shift; gates in priority order: nurse ACTIVE -> posture CLEAR -> unit cert requirements -> half-open overlap -> past/horizon -> weekly 60h cap", roles: [NurseManager], code: 201, input: [nurse_id, unit_id, starts_at, ends_at], output: ShiftAssignment, side_effects: ["status SCHEDULED", "hours computed", "Unit.scheduled_hours_total += hours; active_assignment_count += 1"] }
  - { method: GET, path: "/credentialing/shift-assignments", description: "List shift assignments (FK reverse lookup)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["nurse_id?", "unit_id?", "status?", "limit?", "offset?"], output: "ShiftAssignment[]", side_effects: [] }
  - { method: GET, path: "/credentialing/shift-assignments/{shiftId}", description: "Get one shift assignment", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: ShiftAssignment, side_effects: [] }
  - { method: POST, path: "/credentialing/shift-assignments/{shiftId}/start", description: "SCHEDULED -> IN_PROGRESS within [starts_at, ends_at); posture must still be CLEAR; stamps was_clear_at_start = true", roles: [NurseManager], code: 200, input: [], output: ShiftAssignment, side_effects: ["status -> IN_PROGRESS", "was_clear_at_start := true"] }
  - { method: POST, path: "/credentialing/shift-assignments/{shiftId}/complete", description: "IN_PROGRESS -> COMPLETED; releases unit staffing counters", roles: [NurseManager], code: 200, input: [], output: ShiftAssignment, side_effects: ["status -> COMPLETED", "Unit.scheduled_hours_total -= hours; active_assignment_count -= 1"] }
  - { method: POST, path: "/credentialing/shift-assignments/{shiftId}/cancel", description: "SCHEDULED -> CANCELLED (manual); releases unit counters; triggers posture recompute", roles: [NurseManager], code: 200, input: [], output: ShiftAssignment, side_effects: ["status -> CANCELLED", "cancel_reason := MANUAL", "Unit.scheduled_hours_total -= hours; active_assignment_count -= 1", "posture recompute"] }

  # --- Competency Sessions & Bookings ---
  - { method: POST, path: "/credentialing/competency-sessions", description: "Create a competency session with capacity", roles: [NurseManager], code: 201, input: [requirement_id, title, starts_at, ends_at, capacity], output: CompetencySession, side_effects: [] }
  - { method: GET, path: "/credentialing/competency-sessions", description: "List sessions (FK reverse lookup by requirement_id)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["requirement_id?", "limit?", "offset?"], output: "CompetencySession[]", side_effects: [] }
  - { method: GET, path: "/credentialing/competency-sessions/{sessionId}", description: "Get one session", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: CompetencySession, side_effects: [] }
  - { method: POST, path: "/credentialing/competency-sessions/{sessionId}/bookings", description: "Book a nurse into a session; aggregate-capacity overlap semantics: fully overlapping bookings allowed while booked_count < capacity; duplicate nurse booking rejected", roles: [NurseManager], code: 201, input: [nurse_id], output: SessionBooking, side_effects: ["SessionBooking created (attended false)", "session.booked_count += 1"] }
  - { method: GET, path: "/credentialing/session-bookings", description: "List bookings (FK reverse lookup by session_id / nurse_id / completion_id)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["session_id?", "nurse_id?", "completion_id?", "limit?", "offset?"], output: "SessionBooking[]", side_effects: [] }
  - { method: GET, path: "/credentialing/session-bookings/{bookingId}", description: "Get one booking", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: SessionBooking, side_effects: [] }
  - { method: POST, "path": "/credentialing/session-bookings/{bookingId}/complete", description: "Mark attendance after session end; creates a CompetencyCompletion (source SESSION, completed_on = session start date) superseding prior rows; posture recompute", roles: [NurseManager], code: 200, input: [], output: SessionBooking, side_effects: ["attended := true", "CompetencyCompletion created and linked (completion_id)", "prior completions superseded", "posture recompute"] }
  - { method: DELETE, path: "/credentialing/session-bookings/{bookingId}", description: "Delete a booking (frees capacity); only when attended == false", roles: [NurseManager], code: 204, input: [], output: null, side_effects: ["session.booked_count -= 1"] }

  # --- Privilege Evaluations (NLC) ---
  - { method: POST, path: "/credentialing/privilege-evaluations", description: "Explicit multistate-privilege re-evaluation; OCC-guarded on nurse version; always appends a PrivilegeEvaluation row (MANUAL) and increments nurse.version by 1", roles: [CredentialingSpecialist], code: 201, input: [nurse_id, expected_nurse_version], output: PrivilegeEvaluation, side_effects: ["privilege_scope_determination run", "PrivilegeEvaluation appended (trigger_reason MANUAL)", "nurse.multistate_privilege_status/practice_scope updated", "increments Nurse.version by 1", "posture recompute"] }
  - { method: GET, path: "/credentialing/privilege-evaluations", description: "List evaluation events (FK reverse lookup by nurse_id)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["nurse_id?", "limit?", "offset?"], output: "PrivilegeEvaluation[]", side_effects: [] }
  - { method: GET, path: "/credentialing/privilege-evaluations/{evalId}", description: "Get one evaluation event", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: PrivilegeEvaluation, side_effects: [] }

  # --- Audit Runs & Findings (regulatory survey) ---
  - { method: POST, path: "/credentialing/audit-runs", description: "Create an audit run (INITIATED) over an inclusive date window", roles: [ComplianceOfficer], code: 201, input: [window_start, window_end, per_unit_sample_size], output: AuditRun, side_effects: ["status INITIATED", "created_by_user_id := X-User-ID"] }
  - { method: GET, path: "/credentialing/audit-runs", description: "List audit runs", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["status?", "limit?", "offset?"], output: "AuditRun[]", side_effects: [] }
  - { method: GET, path: "/credentialing/audit-runs/{runId}", description: "Get one audit run (includes computed rates and projection)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: AuditRun, side_effects: [] }
  - { method: POST, path: "/credentialing/audit-runs/{runId}/begin-fieldwork", description: "INITIATED -> FIELD_WORK; computes the deterministic sample", roles: [ComplianceOfficer], code: 200, input: [], output: AuditRun, side_effects: ["sampled_nurse_ids computed (rank: completed-shift-count DESC in unit, tie-break nurse.created_at ASC)"] }
  - { method: POST, path: "/credentialing/audit-runs/{runId}/issue-findings", description: "FIELD_WORK -> FINDINGS_ISSUED; creates OPEN AuditFindings per deficient slot; computes point_in_time_rate, shift_incidence_rate, projected_deficiency_count", roles: [ComplianceOfficer], code: 200, input: [], output: AuditRun, side_effects: ["AuditFinding rows created", "rates + projection computed"] }
  - { method: POST, path: "/credentialing/audit-runs/{runId}/close", description: "FINDINGS_ISSUED -> CLOSED; requires zero OPEN findings", roles: [ComplianceOfficer], code: 200, input: [], output: AuditRun, side_effects: ["status -> CLOSED"] }
  - { method: GET, path: "/credentialing/audit-findings", description: "List findings (FK reverse lookup)", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["audit_run_id?", "nurse_id?", "status?", "limit?", "offset?"], output: "AuditFinding[]", side_effects: [] }
  - { method: GET, path: "/credentialing/audit-findings/{findingId}", description: "Get one finding", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: [], output: AuditFinding, side_effects: [] }
  - { method: POST, path: "/credentialing/audit-findings/{findingId}/remediate", description: "OPEN -> REMEDIATED", roles: [ComplianceOfficer], code: 200, input: [], output: AuditFinding, side_effects: ["status -> REMEDIATED"] }
  - { method: POST, path: "/credentialing/audit-findings/{findingId}/accept-risk", description: "OPEN -> ACCEPTED_RISK", roles: [ComplianceOfficer], code: 200, input: [], output: AuditFinding, side_effects: ["status -> ACCEPTED_RISK"] }

  # --- Monitoring & Ops (logical clock / expiry checkpoint) ---
  - { method: GET, path: "/credentialing/monitoring/expiry-report", description: "Computed read: expiry buckets per credential (expiry_monitoring_buckets); date-driven, independent of sweep status", roles: [CredentialingSpecialist, PrimarySourceVerifier, NurseManager, ComplianceOfficer, Nurse, SystemOperator], code: 200, input: ["nurse_id?", "limit?", "offset?"], output: "{ rows: array }", side_effects: [] }
  - { method: POST, path: "/credentialing/_clock/set_current_utc", description: "Test-driving logical clock. Startup default (before any set) is exactly 2026-08-01T00:00:00Z and NEVER falls back to wall-clock time. All date comparisons (expiry, freshness, horizons, windows) read this clock.", roles: [SystemOperator], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock set (no entity mutations; expiry changes happen only via the sweep)"] }
  - { method: POST, path: "/credentialing/_ops/expiry-sweep", description: "Ops-run checkpoint: applies time-based transitions in pinned order (1. licenses ACTIVE/ENCUMBERED with expires_on < current_date -> EXPIRED; 2. certifications ACTIVE past expiry -> EXPIRED (+packet-item invalidation cascade); 3. completions CURRENT past expiry -> LAPSED (+invalidation cascade); 4. posture recompute for every affected nurse (+posture cascade); 5. privilege re-derivation (SWEEP eval rows when changed)). Idempotent: a second sweep at the same clock changes nothing.", roles: [SystemOperator], code: 200, input: [], output: "{ licenses_expired: integer, certifications_expired: integer, completions_lapsed: integer, postures_changed: integer, shifts_auto_cancelled: integer, packets_voided: integer, privilege_evaluations_appended: integer }", side_effects: ["per-license/cert/completion transitions as above with their cascades"] }

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth & authorization ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role value not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Declared role lacks permission for this endpoint" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed Nurse role acting on a resource owned by a different nurse" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempted both sides of a segregated step (request/record, create/attest, acknowledge/adjudicate, assemble/review)" }
  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (validated left-to-right)" }
  - { id: ERR_NURSE_NOT_FOUND, http: 404, condition: "Body nurse_id does not reference an existing nurse" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "Body license_id does not reference an existing license" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Body unit_id/target_unit_id does not reference an existing unit" }
  - { id: ERR_REQUIREMENT_NOT_FOUND, http: 404, condition: "Body requirement_id does not reference an existing requirement" }
  # --- Referential / input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, type mismatch, unknown field, invalid enum value, missing conditional field (discrepancy_note, rejection_reason, resolution_note, license_id for scope LICENSE)" }
  - { id: ERR_CROSS_NURSE_REFERENCE, http: 422, condition: "license_id belongs to a different nurse than the request's nurse_id" }
  - { id: ERR_REQUIREMENT_NOT_APPLICABLE, http: 422, condition: "requirement.applies_to does not contain the nurse's employment_type" }
  # --- State ---
  - { id: ERR_INVALID_LICENSE_STATE, http: 409, condition: "License not in a valid from-state for submit/attest/renew/surrender or PSV creation" }
  - { id: ERR_INVALID_PSV_STATE, http: 409, condition: "PSV not in REQUESTED for record-result" }
  - { id: ERR_INVALID_CERTIFICATION_STATE, http: 409, condition: "Certification not in a valid from-state for renew/revoke" }
  - { id: ERR_INVALID_DISCIPLINE_STATE, http: 409, condition: "DisciplinaryAction not in a valid from-state for acknowledge/adjudicate/resolve" }
  - { id: ERR_INVALID_PACKET_STATE, http: 409, condition: "CredentialPacket not in a valid from-state for the requested transition (also gates item evidence submission)" }
  - { id: ERR_INVALID_ITEM_STATE, http: 409, condition: "PacketItem not in a valid from-state for submit-evidence/verify/waive" }
  - { id: ERR_INVALID_SHIFT_STATE, http: 409, condition: "ShiftAssignment not in a valid from-state for start/complete/cancel" }
  - { id: ERR_INVALID_AUDIT_STATE, http: 409, condition: "AuditRun not in a valid from-state for begin-fieldwork/issue-findings/close" }
  - { id: ERR_INVALID_FINDING_STATE, http: 409, condition: "AuditFinding not OPEN for remediate/accept-risk" }
  - { id: ERR_INVALID_NURSE_STATE, http: 409, condition: "Nurse not in a valid status for the operation (activate from non-ONBOARDING; terminate twice; discipline or shift creation on a non-ACTIVE nurse)" }
  - { id: ERR_INVALID_BOOKING_STATE, http: 409, condition: "SessionBooking already attended (delete) or otherwise not actionable" }
  - { id: ERR_NURSE_NOT_CLEAR, http: 409, condition: "Nurse.credential_posture != CLEAR for shift creation/start or packet approval" }
  - { id: ERR_HIRE_REQUIREMENTS_UNMET, http: 409, condition: "Activation requires >= 1 ACTIVE license and FACILITY_STATE within derived practice scope" }
  - { id: ERR_PSV_STALE, http: 422, condition: "VERIFIED PSV rows exist but all have valid_through < current_date" }
  # --- Safety / compliance ---
  - { id: ERR_UNIT_CERT_REQUIREMENT_UNMET, http: 403, condition: "Shift create: nurse lacks an ACTIVE Certification for a type in unit.required_cert_types" }
  - { id: ERR_MULTISTATE_NON_COMPACT_STATE, http: 422, condition: "multistate_flag true with a state_code outside COMPACT_STATES" }
  - { id: ERR_ITEM_EVIDENCE_INVALID, http: 422, condition: "Item verify: underlying credential evidence does not hold (no ACTIVE license/cert of type, no CURRENT mandatory completion)" }
  # --- Constraint ---
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "New [starts_at, ends_at) collides with the nurse's existing SCHEDULED/IN_PROGRESS assignment (half-open semantics: touching endpoints allowed)" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "booked_count >= capacity for the session" }
  - { id: ERR_BOOKING_DUPLICATE, http: 409, condition: "Nurse already has a booking in this session" }
  - { id: ERR_ACTIVE_PACKET_EXISTS, http: 409, condition: "Nurse already has a CredentialPacket in DRAFT, SUBMITTED, or UNDER_REVIEW" }
  - { id: ERR_PACKET_ITEMS_INCOMPLETE, http: 409, condition: "Packet submit/resubmit requires all items SUBMITTED/VERIFIED/WAIVED; approve requires all VERIFIED/WAIVED" }
  - { id: ERR_ITEM_NOT_WAIVABLE, http: 422, condition: "Waive attempted on a critical PacketItem" }
  - { id: ERR_AUDIT_FINDINGS_OPEN, http: 409, condition: "Audit close attempted while OPEN findings remain" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Uniqueness violated: nurse email, (state_code, license_number), requirement code, unit name" }
  # --- Temporal ---
  - { id: ERR_SHIFT_IN_PAST, http: 422, condition: "Shift start_date < current_date" }
  - { id: ERR_SCHEDULING_HORIZON_EXCEEDED, http: 422, condition: "Shift start_date > current_date + SCHEDULING_HORIZON_DAYS (90)" }
  - { id: ERR_SHIFT_NOT_STARTABLE, http: 422, condition: "now outside [starts_at, ends_at) at shift start" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "ends_at <= starts_at; new_expires_on <= current_date; audit window_start >= window_end or window_end > current_date; completed_on > current_date" }
  - { id: ERR_DISCIPLINE_EFFECTIVE_FUTURE, http: 422, condition: "disciplinary effective_on > current_date" }
  - { id: ERR_RESOLUTION_PREMATURE, http: 422, condition: "resolve before effective_on + MIN_ACTIVE_DAYS[action_type] (REPRIMAND 0, PROBATION 90, SUSPENSION 30, REVOCATION 365)" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 422, condition: "ACTIVE license renewal attempted with (expires_on - current_date).days > RENEWAL_WINDOW_DAYS (60)" }
  - { id: ERR_SESSION_NOT_ENDED, http: 422, condition: "session-booking complete attempted before session.ends_at" }
  # --- Fiscal ---
  - { id: ERR_WEEKLY_HOURS_EXCEEDED, http: 422, condition: "weekly_rolling_hours: total_minutes > 3600 in the assignment's 7-day window" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_nurse_version does not match the nurse's current version (OCC)" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: CredentialingSpecialist
    description: "Credentialing office staff; assembles and reviews credential records, packets, and renewals"
    identity: opaque
    exclusive_operations:
      - "POST /credentialing/nurses; PATCH /credentialing/nurses/{id}; activate; terminate"
      - "POST /credentialing/state-licenses + submit + renew"
      - "POST /credentialing/primary-source-verifications"
      - "POST /credentialing/certifications + renew"
      - "POST /credentialing/credential-packets + start-review + approve + reject"
      - "POST /credentialing/packet-items/{id}/verify + waive"
      - "POST /credentialing/privilege-evaluations"
    shared_operations:
      - "POST /credentialing/competency-completions (shared with Nurse)"
      - "all GET endpoints (shared with every role)"

  - name: PrimarySourceVerifier
    description: "Independent verifier performing primary-source checks and license attestation (segregated from record creators)"
    identity: opaque
    exclusive_operations:
      - "POST /credentialing/primary-source-verifications/{id}/record-result"
      - "POST /credentialing/state-licenses/{id}/attest"
    shared_operations:
      - "all GET endpoints (shared with every role)"

  - name: NurseManager
    description: "Nursing unit manager; owns units, scheduling, competency sessions and bookings"
    identity: opaque
    exclusive_operations:
      - "POST /credentialing/units"
      - "POST /credentialing/shift-assignments + start + complete + cancel"
      - "POST /credentialing/competency-sessions + bookings; session-bookings complete; DELETE session-bookings"
    shared_operations:
      - "all GET endpoints (shared with every role)"

  - name: ComplianceOfficer
    description: "Compliance office; owns disciplinary actions, revocations, surrenders, requirement configuration, and survey audits"
    identity: opaque
    exclusive_operations:
      - "POST /credentialing/disciplinary-actions + acknowledge + adjudicate + resolve"
      - "POST /credentialing/certifications/{id}/revoke"
      - "POST /credentialing/state-licenses/{id}/surrender"
      - "POST /credentialing/competency-requirements"
      - "POST /credentialing/audit-runs + begin-fieldwork + issue-findings + close; findings remediate + accept-risk"
    shared_operations:
      - "all GET endpoints (shared with every role)"

  - name: Nurse
    description: "The credentialed nurse acting on her own records"
    identity: "entity_backed:Nurse"
    exclusive_operations:
      - "POST /credentialing/credential-packets/{id}/submit + resubmit (own packets only)"
      - "POST /credentialing/packet-items/{id}/submit-evidence (own packets only)"
    shared_operations:
      - "POST /credentialing/competency-completions (own nurse_id only)"
      - "all GET endpoints (shared with every role)"

  - name: SystemOperator
    description: "Operations principal driving the logical clock and the expiry checkpoint"
    identity: opaque
    exclusive_operations:
      - "POST /credentialing/_clock/set_current_utc"
      - "POST /credentialing/_ops/expiry-sweep"
    shared_operations:
      - "all GET endpoints (shared with every role)"
