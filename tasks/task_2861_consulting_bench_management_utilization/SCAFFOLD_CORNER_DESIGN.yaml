      - name: period_state_outranks_hour_overallocation_on_close
        claim_type: Priority Ordering
        grounds:
          - validations[priority=14]
          - validations[priority=33]
          - errors[ERR_PERIOD_STATE_INVALID]
          - errors[ERR_HOUR_OVERALLOCATION]
          - calculations.utilization_period_metrics
        distinguishing_aspect: "The same already-overallocated period is closed twice: while its period_end_on is still in the future the caller gets ERR_PERIOD_STATE_INVALID (14), and once the clock has passed the end date the very same request gets ERR_HOUR_OVERALLOCATION (33) — proving the ordering and that an overallocated period can never be closed at all."
