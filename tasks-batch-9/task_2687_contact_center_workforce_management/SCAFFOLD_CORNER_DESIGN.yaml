              captures: { b2_status: "$.data.status", b2_template: "$.data.awarded_shift_template_id" }
          assert:
            - "r1_status == \"AWARDED\", r1_rate == 1.0000 and slots_awarded_after_r1 == 1"
            - "the trigger answers 409 with err == \"ERR_TEMPLATE_SLOTS_EXHAUSTED\""
            - "err is NOT \"ERR_PREFERENCE_FLOOR_NOT_MET\": the slots gate at priority 160 runs before the floor gate at 175"
            - "r2_status == \"SCORING\" -- the refused award left the round where it was"
            - "r2_rate is null, r2_awarded == 0 and r2_unfilled == 0"
            - "b2_status == \"SUBMITTED\" and b2_template is null -- the sweep's in-memory UNFILLED marking was never persisted"
            - "GET /schedule-shifts filtered to planning_cycle_id ${cyc_id} still returns total_count 1 (only A1's DRAFT shift from R-1)"

      - name: award_below_preference_floor_rejected
