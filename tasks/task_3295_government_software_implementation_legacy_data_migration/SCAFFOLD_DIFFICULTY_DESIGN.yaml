scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: retainage_withheld_until_go_live_execution
    grounds:
    - calculations.milestone_payment
    - state_machines.Milestone.READY_FOR_REVIEW_to_ACCEPTED
    - state_machines.GoLiveEvent.APPROVED_to_EXECUTED
    distinguishing_aspect: "Milestone billing on a contract (fiscal domain): the RETAINAGE_HELD variant pays 90% at acceptance and releases the 10% retained portion\
      \ only when a GoLiveEvent reaches EXECUTED \u2014 a different observable payout schedule than PAYMENT_ON_ACCEPTANCE for identical billable amounts."
    test_recipe:
      setup:
      - 'Logical clock 2026-09-01; agency REV; contract awarded with two phases; phase 1 ACTIVE with two milestones: M-POA (PAYMENT_ON_ACCEPTANCE, 1,000,000 cents)
        and M-RET (RETAINAGE_HELD, 1,000,000 cents); all criteria satisfied.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /programs/agencies
        payload:
          agency_code: REV
          display_name: Dept of Revenue
        as: PlatformAdmin
        captures:
          ag_id: $.data.id
      - call: POST /programs/contracts
        payload:
          agency_id: ${ag_id}
          solicitation_number: RFP-2026-001
          vendor_name: TylerTech
          contract_value_cents: 500000000
        as: ProcurementOfficer
        captures:
          co_id: $.data.id
          co_v: $.data.version
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: POSTED
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: Q&A_OPEN
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: Q&A_CLOSED
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: EVALUATION
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: AWARD_PENDING
        as: ProcurementOfficer
      - call: GET /programs/contracts/${co_id}
        payload: {}
        as: ProcurementOfficer
        captures:
          co_v5: $.data.version
      - call: POST /programs/contracts/${co_id}/award
        payload:
          expected_contract_version: ${co_v5}
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/phases
        payload:
          sequence_no: 1
          name: ANALYSIS
          planned_start_on: '2026-10-01'
          planned_end_on: '2026-12-31'
        as: ImplementationManager
        captures:
          ph1: $.data.id
      - call: POST /programs/contracts/${co_id}/phases
        payload:
          sequence_no: 2
          name: CONFIGURATION
          planned_start_on: '2026-10-01'
          planned_end_on: '2026-12-31'
        as: ImplementationManager
        captures:
          ph2: $.data.id
      - call: POST /programs/contracts/${co_id}/start-implementation
        payload: {}
        as: ImplementationManager
      - call: POST /programs/phases/${ph1}/milestones
        payload:
          code: M-POA
          description: M-POA
          billable_amount_cents: 1000000
          billing_variant: PAYMENT_ON_ACCEPTANCE
        as: ImplementationManager
        captures:
          ms_poa: $.data.id
      - call: POST /programs/phases/${ph1}/milestones
        payload:
          code: M-RET
          description: M-RET
          billable_amount_cents: 1000000
          billing_variant: RETAINAGE_HELD
        as: ImplementationManager
        captures:
          ms_ret: $.data.id
      - call: POST /programs/milestones/${ms_poa}/submit
        payload: {}
        as: VendorProjectManager
        as_user_id: vendor-pm-1
      - call: POST /programs/milestones/${ms_ret}/submit
        payload: {}
        as: VendorProjectManager
        as_user_id: vendor-pm-1
      trigger:
      - call: POST /programs/milestones/${ms_poa}/accept
        payload: {}
        as: AgencyProjectManager
        as_user_id: agency-pm-9
      - call: POST /programs/milestones/${ms_ret}/accept
        payload: {}
        as: AgencyProjectManager
        as_user_id: agency-pm-9
        captures:
          ms_ret_state: $.data.status
      assert:
      - Milestone.${ms_poa} payable at acceptance == 1000000 cents (full amount, no retainage)
      - Milestone.${ms_ret} payable at acceptance == 900000 cents and retained == 100000 cents
      - payable + retained == billable_amount_cents == 1000000 for M-RET (conservation)
      - Milestone.${ms_ret}.status == ACCEPTED
  - name: reconciliation_forward_vs_chronological_sign_flip
    grounds:
    - calculations.reconciliation_variance
    - state_machines.MigrationBatch.LOADED_to_RECONCILED
    distinguishing_aspect: "Legacy data reconciliation (migration domain): identical loaded rows reconcile within tolerance under FORWARD but fail under CHRONOLOGICAL\
      \ when a record's signed value flips the running accumulator sign during legacy_primary_key-ordered replay \u2014 dual variants over the same batch produce\
      \ divergent within_tolerance verdicts."
    test_recipe:
      setup:
      - "Contract in IMPLEMENTATION; batch ACCOUNTS_RECEIVABLE (tolerance 100 cents) with expected_record_count=3, expected_net_value_cents=500; three loaded records\
        \ keyed K1=+400, K2=-700, K3=+800: chronological running totals +400, -300, +500 \u2014 K2 flips the sign negative vs the final positive total so CHRONOLOGICAL\
        \ excludes it (value 1200, delta 700 > tolerance), while FORWARD nets 500 (delta 0, within tolerance)."
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /programs/agencies
        payload:
          agency_code: REV
          display_name: Dept of Revenue
        as: PlatformAdmin
        captures:
          ag_id: $.data.id
      - call: POST /programs/contracts
        payload:
          agency_id: ${ag_id}
          solicitation_number: RFP-2026-001
          vendor_name: TylerTech
          contract_value_cents: 500000000
        as: ProcurementOfficer
        captures:
          co_id: $.data.id
          co_v: $.data.version
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: POSTED
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: Q&A_OPEN
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: Q&A_CLOSED
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: EVALUATION
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/transition
        payload:
          target: AWARD_PENDING
        as: ProcurementOfficer
      - call: GET /programs/contracts/${co_id}
        payload: {}
        as: ProcurementOfficer
        captures:
          co_v5: $.data.version
      - call: POST /programs/contracts/${co_id}/award
        payload:
          expected_contract_version: ${co_v5}
        as: ProcurementOfficer
      - call: POST /programs/contracts/${co_id}/phases
        payload:
          sequence_no: 1
          name: MIGRATION
          planned_start_on: '2026-10-01'
          planned_end_on: '2026-12-31'
        as: ImplementationManager
        captures:
          ph1: $.data.id
      - call: POST /programs/contracts/${co_id}/start-implementation
        payload: {}
        as: ImplementationManager
      - call: POST /programs/contracts/${co_id}/migration-batches
        payload:
          domain: ACCOUNTS_RECEIVABLE
          source_system_label: LEGACY-AR
          expected_record_count: 3
          expected_net_value_cents: 500
        as: DataMigrationLead
        captures:
          batch_id: $.data.id
      - call: POST /programs/migration-batches/${batch_id}/records
        payload:
          records:
          - legacy_primary_key: K1
            field_payload:
              acct: a1
            signed_value_cents: 400
          - legacy_primary_key: K2
            field_payload:
              acct: a2
            signed_value_cents: -700
          - legacy_primary_key: K3
            field_payload:
              acct: a3
            signed_value_cents: 800
        as: DataMigrationLead
      - call: POST /programs/migration-batches/${batch_id}/extract
        payload: {}
        as: DataMigrationLead
      - call: POST /programs/migration-batches/${batch_id}/cleanse
        payload:
          resolutions: {}
        as: DataMigrationLead
      - call: POST /programs/migration-batches/${batch_id}/load
        payload: {}
        as: DataMigrationLead
      trigger:
      - call: POST /programs/migration-batches/${batch_id}/reconcile
        payload: {}
        as: DataMigrationLead
        as_user_id: dml-1
        captures:
          batch_state: $.data.status
      - call: GET /programs/migration-batches/${batch_id}/reconciliation-reports
        payload: {}
        as: DataMigrationLead
      assert:
      - ReconciliationReport(run_variant=FORWARD).value_delta_cents == 0 and within_tolerance == true
      - ReconciliationReport(run_variant=CHRONOLOGICAL).loaded_net_value_cents == 1200 (K2 excluded), value_delta_cents == 700, within_tolerance == false
      - MigrationBatch.${batch_id}.status == RECONCILE_FAILED because at least one variant is out of tolerance
- rule_id: combinatorial_formula
  instances:
  - name: readiness_score_weighted_floor_boundary
    grounds:
    - calculations.readiness_score
    - state_machines.GoLiveEvent.READINESS_CHECKED_to_APPROVED
    - validations[priority=5]
    distinguishing_aspect: "Weighted readiness (mode (a): 6 components, weights 25/25/20/15/10/5, conditional on child-state sets, floored once at the end): with\
      \ 1-of-2 milestones accepted the score is 82 \u2014 above the >=80 approve gate \u2014 while accepting zero milestones yields 57 and blocks approval; the exact\
      \ floor-once order is observable at the boundary."
    test_recipe:
      setup:
      - Contract in IMPLEMENTATION; 2 phases each with 1 accepted-or-not milestone; 1 batch ACCEPTED; 1 interface CERTIFIED; 1 UAT cycle PASSED; 1 workflow APPROVED;
        no training completions.
