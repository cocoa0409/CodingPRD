              as: Operator
              as_user_id: "${op_id}"
              captures: { sa2_id: $.data.id }
          assert:
            - "HTTP 201 with StaffAssignment.${sa2_id}.status == SCHEDULED"
            - "GET /facilities/${fac_id}/staff-assignments returns exactly two SCHEDULED rows"

      - name: voided_inspection_no_longer_blocks_the_scheduling_window
        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=29]", state_machines.Inspection.SCHEDULED_to_VOIDED]
        distinguishing_aspect: "The conflict set is restricted to inspections in SCHEDULED, IN_PROGRESS, SUBMITTED or FINALIZED, so once the 09:00-11:00 visit is VOIDED a 12:00 visit that previously collided is accepted."
        test_recipe:
          setup: ["A ROUTINE inspection scheduled 2026-05-02T09:00:00Z to 11:00:00Z has been voided by the health authority."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-02T09:00:00Z", scheduled_end_at: "2026-05-02T11:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { i1_id: $.data.id }
            - call: "POST /inspections/${i1_id}/transition"
              payload: { action: "VOID" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-02T12:00:00Z", scheduled_end_at: "2026-05-02T13:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { i2_id: $.data.id }
          assert:
            - "HTTP 201 with Inspection.${i2_id}.workflow_status == SCHEDULED"
            - "Inspection.${i1_id}.workflow_status == VOIDED"
            - "GET /inspections?facility_id=${fac_id}&workflow_status=SCHEDULED returns exactly one row, ${i2_id}"

      - name: routine_inspection_outside_the_declared_season_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=30]", "errors[ERR_OUT_OF_SEASON]"]
        distinguishing_aspect: "A ROUTINE visit scheduled for 2026-05-02 at a facility whose season runs 2026-06-01 to 2026-08-31 is rejected with ERR_OUT_OF_SEASON (409); a COMPLAINT visit on the same date would be allowed."
        test_recipe:
          setup: ["A seasonal pool whose season runs 2026-06-01 to 2026-08-31."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Lakeside Recreation District", contact_email: "permits@lakeside.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Lakeside Seasonal Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2, is_seasonal: true, season_start_date: "2026-06-01", season_end_date: "2026-08-31" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-02T09:00:00Z", scheduled_end_at: "2026-05-02T10:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "COMPLAINT", scheduled_start_at: "2026-05-02T09:00:00Z", scheduled_end_at: "2026-05-02T10:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { ci_id: $.data.id }
          assert:
            - "The ROUTINE request returns 409 with data.error_id == ERR_OUT_OF_SEASON"
            - "The COMPLAINT request returns 201 with Inspection.${ci_id}.workflow_status == SCHEDULED"
            - "Facility.${fac_id}.operating_posture == CLOSED and posture_reason == PERMIT_MISSING"

      - name: reopen_request_with_a_stale_verification_reading_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=28]", "errors[ERR_VERIFICATION_READING_STALE]"]
        distinguishing_aspect: "A reading sampled 90 minutes before the clock exceeds REOPEN_READING_MAX_AGE_MINUTES (60) and the reopen request is rejected with ERR_VERIFICATION_READING_STALE (409), leaving the order in OPEN."
        test_recipe:
          setup: ["A CHEMICAL closure order is OPEN; the clock reads 2026-05-01T03:00:00Z and the only reading on file was sampled at 01:30."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /closure-orders"
              payload: { facility_id: "${fac_id}", closure_reason: "CHEMICAL", expected_facility_version: "${fac_v}" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { co_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T01:30:00Z" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_id}/water-readings"
              payload: { sampled_at: "2026-05-01T01:30:00Z", source: "REOPEN_VERIFICATION", free_chlorine_ppm: 2.5, combined_chloramine_ppm: 0.1, ph: 7.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T03:00:00Z" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /closure-orders/${co_id}/reopen-request"
              payload: { verification_reading_id: "${rd_id}" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_VERIFICATION_READING_STALE"
            - "ClosureOrder.${co_id}.status == OPEN with reopen_requested_at == null and verification_reading_id == null"

      - name: reopen_request_with_a_reading_from_another_facility_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=9]", "errors[ERR_READING_FACILITY_MISMATCH]"]
        distinguishing_aspect: "The reading resolves and is fresh, but belongs to pool B while the closure order is on pool A, so the request is rejected with ERR_READING_FACILITY_MISMATCH (409) rather than ERR_VERIFICATION_READING_STALE."
        test_recipe:
          setup: ["One operator owns two pools; pool A has an OPEN CHEMICAL closure order and pool B has a fresh IN_RANGE reading."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Twin Pools Trust", contact_email: "ops@twinpools.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
