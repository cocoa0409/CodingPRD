              payload: { claim_id: "${claim_id}", property_address: "X", loss_type: "FIRE" }
              as: Dispatcher
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /restoration/chambers"
              payload: { job_id: "${job_id}", room_label: "R1", floor_area_sqft: 300, wet_wall_linear_ft: 0, dehu_ppd_rating: 70, dry_standard_pct: 12 }
              as: Technician
              as_user_id: "tech-x"
              captures: { ch1: $.data.id }
          assert:
            - "DryingChamber.${ch1}.air_movers_required == 5"
            - "DryingChamber.${ch1}.dehumidifiers_required == 5"

