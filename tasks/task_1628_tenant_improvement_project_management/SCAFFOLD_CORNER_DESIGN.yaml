              as: LandlordPM
              captures: { lease_a: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_b}", tenant_id: "${tenant_b}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_b: $.data.id }
            - call: "POST /api/leases/${lease_a}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_b}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_b}/ti-projects"
              payload: { project_name: "TI-B", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_b: $.data.id }
            - call: "POST /api/ti-projects/${proj_b}/work-letters"
              payload: { scope_description: "TI", allowance_offer_cents: 50000000, work_delineation: "SPLIT" }
              as: LandlordPM
              captures: { wl_b: $.data.id }
            - call: "POST /api/work-letters/${wl_b}/propose"
              as: LandlordPM
          trigger:
            - call: "POST /api/work-letters/${wl_b}/accept"
              as: TenantRep
              as_user_id: "${tenant_a}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_SCOPE, HTTP 403 (tenant A does not own lease B)"
            - "WorkLetter.${wl_b}.status == PROPOSED (unchanged)"
