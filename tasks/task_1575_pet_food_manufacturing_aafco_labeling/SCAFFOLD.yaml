  # --- RecallAction ---
  - method: POST
    path: "/petfood/recall-actions"
    description: "Initiate a recall; cascades batches -> RECALLED and lots -> RECALLED, sets formula open_recall_flag, increments brand open_recall_count"
    roles: [QAApprover]
    code: 201
    input: [formula_id, scope_batch_ids, recall_class, reason]
    output: RecallAction
    side_effects:
      - "cascade: in-scope ProductionBatch rows in {COMPLETED, ON_HOLD} -> RECALLED"
      - "cascade: BatchLotCode rows of in-scope batches in {ACTIVE, QUARANTINED, RELEASED} -> RECALLED; affected_lot_count set"
      - "sets Formula.open_recall_flag = true"
      - "increments BrandOwner.open_recall_count by 1"
  - method: GET
    path: "/petfood/recall-actions/{id}"
    description: "Fetch one recall"
    roles: [PlatformAdmin, QAApprover, QualityAnalyst]
