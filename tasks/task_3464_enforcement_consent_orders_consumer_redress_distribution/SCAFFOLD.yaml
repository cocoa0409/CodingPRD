# =============================================================================
# SCAFFOLD — Enforcement Consent Orders & Consumer Redress Distribution (FTC)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml. Neither design key appears here.
# =============================================================================

scenario: |
  Enforcement Consent Orders & Consumer Redress Distribution (Federal Trade Commission):
  investigation initiation from complaints, referrals and market monitoring with civil
  investigative demands, settlement negotiation producing consent orders with conduct
  prohibitions, compliance reporting and monetary relief, order compliance monitoring over
  multi-year terms with reporting requirements and violation penalties, monetary judgment
  collection including asset tracing and suspended judgments based on inability to pay,
  redress fund administration with claimant identification from company records and claims
  processing, claim rate management and residual fund disposition when checks go uncashed,
  refund check issuance with fraud warnings since scammers target recipients, public comment
  periods on proposed consent agreements

domain_name: enforcement-consent-orders
api_prefix: /enforcement

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: graph          # peer entities woven by FK references; flat URLs
  state_machine_shape: cyclic     # negotiation withdrawal loop + report resubmission loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SubjectCompany
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the company under scrutiny" }
      - { name: complaint_count_90d, type: integer, source: input, default: 0, description: "Consumer complaints received in the trailing 90 days; externally ingested, supplied at intake", constraints: "integer >= 0" }
      - { name: risk_tier, type: enum, source: computed, description: "Derived from complaint_count_90d per calculation complaint_velocity_risk_tier: STANDARD | ELEVATED | CRITICAL" }

  - name: Investigation
    parent: null
    common_fields: true
    fields:
      - { name: subject_company_id, type: string, source: input, description: "FK -> SubjectCompany.id; the company under investigation" }
      - { name: origin, type: enum, source: input, description: "COMPLAINT | REFERRAL | MARKET_MONITORING — what initiated the investigation" }
      - { name: summary, type: string, source: input, description: "Allegation summary text" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the StaffAttorney who opened the investigation" }
      - { name: status, type: enum, source: system, description: "INTAKE | PRELIMINARY_REVIEW | EVIDENCE_GATHERING | NEGOTIATING | SETTLED | CLOSED_NO_ACTION | CLOSED_ORDER_ENTERED" }

  - name: CivilInvestigativeDemand
    parent: null
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: system, description: "FK -> Investigation.id; taken from the URL path" }
      - { name: subject_matter, type: string, source: input, description: "Description of the documents/testimony demanded" }
      - { name: response_due_date, type: datetime, source: input, description: "ISO8601 deadline by which the company must respond" }
      - { name: response_document_ref, type: string, source: input, description: "Document reference supplied by the company when responding; null until responded", default: null }
      - { name: responded_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the response; null until RESPONDED" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | QUASH_PETITIONED | ENFORCED | RESPONDED | WITHDRAWN" }

  - name: ConsentOrder
    parent: null
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: system, description: "FK -> Investigation.id; taken from the URL path" }
      - { name: subject_company_id, type: string, source: system, description: "Denormalized mirror of the parent investigation's subject_company_id, frozen at creation (not a navigable FK)" }
      - { name: negotiating_attorney_user_id, type: string, source: system, description: "X-User-ID of the StaffAttorney who drafted the order; used by segregation-of-duties checks" }
      - { name: monetary_relief_cents, type: integer, source: input, description: "Total equitable monetary relief agreed in the settlement; becomes the judgment amount", constraints: "integer > 0" }
      - { name: max_penalty_cents, type: integer, source: input, description: "Per-violation penalty accrual cap for this order", constraints: "integer > 0" }
      - { name: reporting_frequency_months, type: integer, source: input, description: "Cadence of mandatory compliance reports during monitoring", constraints: "one of 3, 6, 12" }
      - { name: monitoring_term_years, type: integer, source: input, description: "Length of the compliance monitoring term in whole years", constraints: "integer 1..20" }
      - { name: conduct_prohibitions, type: array, source: input, description: "Non-empty array of prohibition clause strings the company must observe" }
      - { name: proposal_round, type: integer, source: system, default: 1, description: "1 for the first proposal; increments each time the order is re-proposed after a withdrawal to DRAFT" }
      - { name: monitoring_started_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when IN_MONITORING begins" }
      - { name: monitoring_ends_at, type: datetime, source: computed, default: null, description: "= monitoring_started_at + monitoring_term_years years; null until monitoring starts" }
      - { name: finalized_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the FINAL transition" }
      - { name: finalized_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the Commissioner who finalized the order" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_PUBLIC_COMMENT | FINAL | IN_MONITORING | EXPIRED | TERMINATED" }

  - name: PublicCommentPeriod
    parent: null
    common_fields: true
    fields:
      - { name: consent_order_id, type: string, source: system, description: "FK -> ConsentOrder.id; the order being commented on" }
      - { name: round, type: integer, source: system, description: "Matches the consent order's proposal_round at the time this period is opened" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp of the propose transition" }
      - { name: closes_at, type: datetime, source: computed, description: "= opened_at + COMMENT_PERIOD_DAYS days (30)" }
      - { name: comments, type: array, source: system, default: [], description: "Append-only array of {author_email, body, submitted_at} objects" }
      - { name: comment_count, type: integer, source: computed, default: 0, description: "= length of comments array" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | VOIDED" }

  - name: ComplianceReport
    parent: null
    common_fields: true
    fields:
      - { name: consent_order_id, type: string, source: system, description: "FK -> ConsentOrder.id; taken from the URL path" }
      - { name: submitted_by_company_id, type: string, source: system, description: "X-User-ID of the submitting CompanyRepresentative (equals the order's subject_company_id when valid)" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the reporting window (closed-interval semantics)" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive end of the reporting window; must be strictly after period_start" }
      - { name: report_document_ref, type: string, source: input, description: "Reference to the submitted compliance report document" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | DEFICIENT" }
      - { name: deficiency_notes, type: string, source: system, default: null, description: "Monitor's notes when marked DEFICIENT; cleared on resubmission" }
      - { name: resubmission_count, type: integer, source: system, default: 0, description: "Increments each time a DEFICIENT report is resubmitted" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceMonitor who last accepted or marked deficient" }

  - name: ViolationPenalty
    parent: null
    common_fields: true
    fields:
      - { name: consent_order_id, type: string, source: system, description: "FK -> ConsentOrder.id; taken from the URL path" }
      - { name: severity, type: enum, source: input, description: "STANDARD | AGGRAVATED | EGREGIOUS — selects the per-day civil penalty rate" }
      - { name: detected_on, type: datetime, source: input, description: "Date the violation was detected" }
      - { name: description, type: string, source: input, description: "Description of the prohibited conduct observed" }
      - { name: assessed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceMonitor who assessed the penalty" }
      - { name: provisional_days, type: integer, source: computed, description: "= PROVISIONAL_PROJECTION_DAYS (30) — forward-looking projection horizon" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "= min(severity_rate * provisional_days, order.max_penalty_cents)" }
      - { name: cured_on, type: datetime, source: input, default: null, description: "Date the violation was cured; supplied at confirmation" }
      - { name: final_days, type: integer, source: computed, default: null, description: "= max(1, whole days from detected_on to cured_on)" }
      - { name: final_amount_cents, type: integer, source: computed, default: null, description: "= min(severity_rate * final_days, order.max_penalty_cents)" }
      - { name: confirmed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the confirming ComplianceMonitor; must differ from assessed_by_user_id" }
      - { name: status, type: enum, source: system, description: "ASSESSED_PROVISIONAL | CONFIRMED | PAID | WAIVED" }

  - name: MonetaryJudgment
    parent: null
    common_fields: true
    fields:
      - { name: consent_order_id, type: string, source: system, description: "FK -> ConsentOrder.id; taken from the URL path; at most one judgment per order" }
      - { name: amount_cents, type: integer, source: input, description: "Judgment amount (mirrors the order's monetary relief)", constraints: "integer > 0" }
      - { name: collected_cents, type: integer, source: computed, default: 0, description: "= sum of COLLECTION payments minus sum of REVERSAL payments" }
      - { name: outstanding_cents, type: integer, source: computed, description: "= amount_cents - collected_cents" }
      - { name: collection_status, type: enum, source: system, description: "OUTSTANDING | PARTIALLY_COLLECTED | SATISFIED — parallel dimension 1" }
      - { name: suspension_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | REINSTATED — parallel dimension 2 (inability-to-pay suspension)" }
      - { name: sworn_total_assets_cents, type: integer, source: system, default: null, description: "Sworn asset total submitted with an inability-to-pay suspension request" }
      - { name: asset_trace_log, type: array, source: system, default: [], description: "Append-only array of {found_assets_cents, trace_ref, traced_at} produced by the asset-traces endpoint" }

  - name: RedressFund
    parent: null
    common_fields: true
    fields:
      - { name: judgment_id, type: string, source: system, description: "FK -> MonetaryJudgment.id; 1:1, auto-created when the judgment is entered" }
      - { name: consent_order_id, type: string, source: system, description: "Denormalized mirror of the judgment's consent_order_id (not a navigable FK)" }
      - { name: total_collected_cents, type: integer, source: computed, default: 0, description: "Mirror of judgment.collected_cents; synced on every payment/reversal" }
      - { name: admin_reserve_cents, type: integer, source: computed, default: 0, description: "Administration reserve per calculation redress_waterfall step 2" }
      - { name: distributable_pool_cents, type: integer, source: computed, default: 0, description: "= total_collected_cents - admin_reserve_cents, per redress_waterfall step 3" }
      - { name: allocated_cents, type: integer, source: computed, default: 0, description: "Sum of final awards committed but not yet disbursed or released" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Sum of amounts on CASHED refund checks" }
      - { name: available_cents, type: integer, source: computed, default: 0, description: "= distributable_pool_cents - allocated_cents - disbursed_cents (before residual disposition)" }
      - { name: residual_cents, type: integer, source: computed, default: 0, description: "Amount moved out of the fund at residual disposition" }
      - { name: residual_disposition, type: enum, source: system, default: NONE, description: "NONE | CY_PRES | TREASURY_ESCHEAT — decided by final claim rate vs CY_PRES_MIN_CLAIM_RATE" }
      - { name: residual_recipient_name, type: string, source: input, default: null, description: "Cy pres recipient named at residual disposition" }
      - { name: status, type: enum, source: system, description: "ACCUMULATING | OPEN_FOR_CLAIMS | CLAIMS_CLOSED | DISBURSING | RESIDUAL_DISPOSITION | CLOSED" }

  - name: Claimant
    parent: null
    common_fields: true
    fields:
      - { name: redress_fund_id, type: string, source: system, description: "FK -> RedressFund.id; taken from the URL path" }
      - { name: full_name, type: string, source: input, description: "Consumer full name" }
      - { name: email, type: string, source: input, description: "Consumer contact email" }
      - { name: identified_from, type: enum, source: input, description: "COMPANY_RECORDS | CLAIMS_PROCESS — how the claimant was identified" }
      - { name: notified_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when the claimant was notified of the fund" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | NOTIFIED | CLAIMED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: claimant_id, type: string, source: input, description: "FK -> Claimant.id; the filing claimant" }
      - { name: redress_fund_id, type: string, source: input, description: "FK -> RedressFund.id; must equal the claimant's fund" }
      - { name: documented_loss_cents, type: integer, source: input, description: "Claimant-documented loss", constraints: "integer > 0" }
      - { name: eligible_loss_cents, type: integer, source: computed, default: null, description: "= min(documented_loss_cents, LOSS_CAP_CENTS); set at approval" }
      - { name: provisional_award_cents, type: integer, source: computed, default: null, description: "Waterfall award computed against the currently approved claim set; recomputed on every approval" }
      - { name: final_award_cents, type: integer, source: computed, default: null, description: "Waterfall award frozen at the fund's DISBURSING transition" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the FundAdministrator who approved the claim; used by segregation-of-duties checks" }
      - { name: denial_reason, type: string, source: system, default: null, description: "Reason recorded when the claim is denied" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | PAYMENT_PENDING | PAID | DENIED" }

  - name: RefundCheck
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; taken from the URL path" }
      - { name: redress_fund_id, type: string, source: system, description: "Denormalized mirror of the claim's redress_fund_id (not a navigable FK)" }
      - { name: amount_cents, type: integer, source: computed, description: "= claim.final_award_cents frozen at issuance" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance" }
      - { name: stale_after, type: datetime, source: computed, description: "= issued_at + CHECK_STALE_DAYS days (90); at/after this instant the check auto-transitions ISSUED -> STALE" }
      - { name: reissue_deadline, type: datetime, source: computed, description: "= issued_at + CHECK_REISSUE_WINDOW_DAYS days (180); reissue of the claim's check at/after this instant is rejected" }
      - { name: original_check_id, type: string, source: system, default: null, description: "Id of the VOIDED check this check reissues; null for the first issuance (plain reference, not a navigable FK)" }
      - { name: fraud_warning_text, type: string, source: system, description: "FRAUD_WARNING_TEXT constant stamped on every issued check" }
      - { name: cashed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of cashing" }
      - { name: voided_reason, type: string, source: system, default: null, description: "Reason recorded when the check is voided" }
      - { name: status, type: enum, source: system, description: "ISSUED | CASHED | STALE | VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Investigation
    initial_state: INTAKE
    terminal_states: [CLOSED_NO_ACTION, CLOSED_ORDER_ENTERED]
    transitions:
      - from: INTAKE
        to: PRELIMINARY_REVIEW
        trigger: "POST /enforcement/investigations/{id}/transition target_state=PRELIMINARY_REVIEW"
        actor: StaffAttorney
        preconditions: ["status == INTAKE (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: []
      - from: PRELIMINARY_REVIEW
        to: EVIDENCE_GATHERING
        trigger: "POST /enforcement/investigations/{id}/transition target_state=EVIDENCE_GATHERING"
        actor: StaffAttorney
        preconditions: ["status == PRELIMINARY_REVIEW"]
        side_effects: []
      - from: EVIDENCE_GATHERING
        to: NEGOTIATING
        trigger: "POST /enforcement/investigations/{id}/transition target_state=NEGOTIATING"
        actor: StaffAttorney
        preconditions: ["status == EVIDENCE_GATHERING"]
        side_effects: []
      - from: NEGOTIATING
        to: EVIDENCE_GATHERING
        trigger: "POST /enforcement/investigations/{id}/transition target_state=EVIDENCE_GATHERING"
        actor: StaffAttorney
        preconditions: ["status == NEGOTIATING"]
        side_effects: []
        note: "Negotiation breakdown loop — negotiation can collapse back into evidence gathering any number of times."
      - from: NEGOTIATING
        to: SETTLED
        trigger: "system (automatic on consent order creation against this investigation)"
        actor: system
        preconditions: ["status == NEGOTIATING"]
        side_effects: ["Investigation.status -> SETTLED"]
      - from: SETTLED
        to: CLOSED_ORDER_ENTERED
        trigger: "system (automatic when any consent order of this investigation reaches FINAL)"
        actor: system
        preconditions: ["status == SETTLED"]
        side_effects: []
      - from: INTAKE
        to: CLOSED_NO_ACTION
        trigger: "POST /enforcement/investigations/{id}/transition target_state=CLOSED_NO_ACTION"
        actor: StaffAttorney
        preconditions: ["status IN {INTAKE, PRELIMINARY_REVIEW, EVIDENCE_GATHERING}"]
        side_effects: []
      - from: PRELIMINARY_REVIEW
        to: CLOSED_NO_ACTION
        trigger: "POST /enforcement/investigations/{id}/transition target_state=CLOSED_NO_ACTION"
        actor: StaffAttorney
        preconditions: ["status IN {INTAKE, PRELIMINARY_REVIEW, EVIDENCE_GATHERING}"]
        side_effects: []
      - from: EVIDENCE_GATHERING
        to: CLOSED_NO_ACTION
        trigger: "POST /enforcement/investigations/{id}/transition target_state=CLOSED_NO_ACTION"
        actor: StaffAttorney
        preconditions: ["status IN {INTAKE, PRELIMINARY_REVIEW, EVIDENCE_GATHERING}"]
        side_effects: []

  - entity: CivilInvestigativeDemand
    initial_state: DRAFT
    terminal_states: [RESPONDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /enforcement/cids/{id}/transition target_state=ISSUED"
        actor: StaffAttorney
        preconditions:
          - "status == DRAFT"
          - "parent Investigation.status == EVIDENCE_GATHERING (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: ISSUED
        to: RESPONDED
        trigger: "POST /enforcement/cids/{id}/transition target_state=RESPONDED with response_document_ref"
        actor: CompanyRepresentative
        preconditions:
          - "status == ISSUED"
          - "X-User-ID == parent investigation's subject_company_id (else ERR_SUBJECT_COMPANY_MISMATCH)"
          - "response_document_ref provided (else ERR_INVALID_REQUEST)"
          - "logical clock < response_due_date (else ERR_CID_RESPONSE_OVERDUE)"
        side_effects: ["responded_at = now"]
      - from: ISSUED
        to: QUASH_PETITIONED
        trigger: "POST /enforcement/cids/{id}/transition target_state=QUASH_PETITIONED"
        actor: CompanyRepresentative
        preconditions:
          - "status == ISSUED"
          - "X-User-ID == parent investigation's subject_company_id (else ERR_SUBJECT_COMPANY_MISMATCH)"
        side_effects: []
      - from: QUASH_PETITIONED
        to: ENFORCED
        trigger: "POST /enforcement/cids/{id}/transition target_state=ENFORCED"
        actor: StaffAttorney
        preconditions: ["status == QUASH_PETITIONED"]
        side_effects: []
        note: "Court enforces the CID; the overdue check no longer applies to the enforced response."
      - from: ENFORCED
        to: RESPONDED
        trigger: "POST /enforcement/cids/{id}/transition target_state=RESPONDED with response_document_ref"
        actor: CompanyRepresentative
        preconditions:
          - "status == ENFORCED"
          - "X-User-ID == parent investigation's subject_company_id (else ERR_SUBJECT_COMPANY_MISMATCH)"
          - "response_document_ref provided (else ERR_INVALID_REQUEST)"
        side_effects: ["responded_at = now"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /enforcement/cids/{id}/transition target_state=WITHDRAWN"
        actor: StaffAttorney
        preconditions: ["status IN {DRAFT, ISSUED}"]
        side_effects: []
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /enforcement/cids/{id}/transition target_state=WITHDRAWN"
        actor: StaffAttorney
        preconditions: ["status IN {DRAFT, ISSUED}"]
        side_effects: []

  - entity: ConsentOrder
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: IN_PUBLIC_COMMENT
        trigger: "POST /enforcement/consent-orders/{id}/transition target_state=IN_PUBLIC_COMMENT"
        actor: StaffAttorney
        preconditions:
          - "status == DRAFT"
          - "expected_consent_order_version == current version (else ERR_STALE_ORDER_VERSION)"
        side_effects:
          - "Creates a new PublicCommentPeriod (status OPEN, round = proposal_round, opened_at = now, closes_at = now + 30 days)"
          - "increments ConsentOrder.version by 1"
      - from: IN_PUBLIC_COMMENT
        to: DRAFT
        trigger: "POST /enforcement/consent-orders/{id}/transition target_state=DRAFT"
        actor: StaffAttorney
        preconditions:
          - "status == IN_PUBLIC_COMMENT"
          - "expected_consent_order_version == current version"
        side_effects:
          - "The OPEN PublicCommentPeriod for this order -> VOIDED"
          - "proposal_round += 1"
          - "increments ConsentOrder.version by 1"
        note: "Withdrawal-to-renegotiation cycle: a proposed agreement can be pulled back after comments arrive."
      - from: IN_PUBLIC_COMMENT
        to: FINAL
        trigger: "POST /enforcement/consent-orders/{id}/transition target_state=FINAL"
        actor: Commissioner
        preconditions:
          - "status == IN_PUBLIC_COMMENT"
          - "expected_consent_order_version == current version"
          - "the latest PublicCommentPeriod for this order (highest round) has status == CLOSED (else ERR_COMMENT_PERIOD_OPEN)"
        side_effects:
          - "finalized_at = now; finalized_by_user_id = X-User-ID"
          - "parent Investigation.status -> CLOSED_ORDER_ENTERED (bubble-up)"
          - "increments ConsentOrder.version by 1"
      - from: FINAL
        to: IN_MONITORING
        trigger: "POST /enforcement/consent-orders/{id}/transition target_state=IN_MONITORING"
        actor: Commissioner
        preconditions:
          - "status == FINAL"
          - "expected_consent_order_version == current version"
          - "no other ConsentOrder for the same subject_company_id with status == IN_MONITORING whose half-open window [monitoring_started_at, monitoring_ends_at) overlaps [now, now + monitoring_term_years years) (else ERR_MONITORING_TERM_OVERLAP; adjacency is NOT overlap)"
        side_effects:
          - "monitoring_started_at = now; monitoring_ends_at = now + monitoring_term_years years"
          - "increments ConsentOrder.version by 1"
      - from: IN_MONITORING
        to: EXPIRED
        trigger: "system (automatic clock sweep when logical clock >= monitoring_ends_at)"
        actor: system
        preconditions: ["status == IN_MONITORING and now > monitoring_ends_at — strictly greater; at exactly monitoring_ends_at the order remains IN_MONITORING"]
        side_effects: ["increments ConsentOrder.version by 1"]
      - from: IN_MONITORING
        to: TERMINATED
        trigger: "POST /enforcement/consent-orders/{id}/transition target_state=TERMINATED"
        actor: Commissioner
        preconditions:
          - "status == IN_MONITORING"
          - "expected_consent_order_version == current version"
        side_effects: ["increments ConsentOrder.version by 1"]
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /enforcement/consent-orders/{id}/transition target_state=TERMINATED"
        actor: Commissioner
        preconditions:
          - "status == DRAFT"
          - "expected_consent_order_version == current version"
        side_effects: ["increments ConsentOrder.version by 1"]

  - entity: PublicCommentPeriod
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system (automatic clock sweep when logical clock >= closes_at)"
        actor: system
        preconditions: ["status == OPEN and now >= closes_at"]
        side_effects: []
        note: "Half-open semantics on the close boundary: at exactly closes_at the period is CLOSED and further comments are rejected."
      - from: OPEN
        to: VOIDED
        trigger: "system (side effect of the parent ConsentOrder's IN_PUBLIC_COMMENT -> DRAFT withdrawal)"
        actor: system
        preconditions: ["status == OPEN"]
        side_effects: []

  - entity: ComplianceReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /enforcement/compliance-reports/{id}/transition target_state=ACCEPTED"
        actor: ComplianceMonitor
        preconditions: ["status == SUBMITTED"]
        side_effects: ["reviewed_by_user_id = X-User-ID"]
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /enforcement/compliance-reports/{id}/transition target_state=DEFICIENT with deficiency_notes"
        actor: ComplianceMonitor
        preconditions:
          - "status == SUBMITTED"
          - "deficiency_notes provided (else ERR_INVALID_REQUEST)"
        side_effects: ["reviewed_by_user_id = X-User-ID", "deficiency_notes = input"]
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /enforcement/compliance-reports/{id}/transition target_state=SUBMITTED with report_document_ref"
        actor: CompanyRepresentative
        preconditions:
          - "status == DEFICIENT"
          - "X-User-ID == consent order's subject_company_id (else ERR_SUBJECT_COMPANY_MISMATCH)"
          - "report_document_ref provided (else ERR_INVALID_REQUEST)"
        side_effects:
          - "resubmission_count += 1"
          - "deficiency_notes = null"
        note: "Resubmission cycle: a deficient report can be cured and resubmitted any number of times until ACCEPTED."

  - entity: ViolationPenalty
    initial_state: ASSESSED_PROVISIONAL
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: ASSESSED_PROVISIONAL
        to: CONFIRMED
        trigger: "POST /enforcement/violation-penalties/{id}/transition target_state=CONFIRMED with cured_on"
        actor: ComplianceMonitor
        preconditions:
          - "status == ASSESSED_PROVISIONAL"
          - "cured_on provided and >= detected_on (else ERR_INVALID_REQUEST)"
          - "X-User-ID != assessed_by_user_id (segregation of duties, else ERR_SOD_PENALTY_CONFIRM)"
        side_effects:
          - "confirmed_by_user_id = X-User-ID"
          - "final_days and final_amount_cents computed per civil_penalty_accrual (final variant)"
      - from: ASSESSED_PROVISIONAL
        to: WAIVED
        trigger: "POST /enforcement/violation-penalties/{id}/transition target_state=WAIVED"
        actor: ComplianceMonitor
        preconditions:
          - "status IN {ASSESSED_PROVISIONAL, CONFIRMED}"
          - "X-User-ID != assessed_by_user_id (segregation of duties, else ERR_SOD_PENALTY_CONFIRM)"
        side_effects: []
      - from: CONFIRMED
        to: WAIVED
        trigger: "POST /enforcement/violation-penalties/{id}/transition target_state=WAIVED"
        actor: ComplianceMonitor
        preconditions:
          - "status IN {ASSESSED_PROVISIONAL, CONFIRMED}"
          - "X-User-ID != assessed_by_user_id (segregation of duties, else ERR_SOD_PENALTY_CONFIRM)"
        side_effects: []
      - from: CONFIRMED
        to: PAID
        trigger: "POST /enforcement/violation-penalties/{id}/transition target_state=PAID"
        actor: CompanyRepresentative
        preconditions:
          - "status == CONFIRMED"
          - "X-User-ID == consent order's subject_company_id (else ERR_SUBJECT_COMPANY_MISMATCH)"
        side_effects: []

  - entity: MonetaryJudgment
    initial_state: OUTSTANDING
    terminal_states: []
    note: "Two parallel state dimensions on one entity: collection_status (OUTSTANDING | PARTIALLY_COLLECTED | SATISFIED) evolves with payments; suspension_status (ACTIVE | SUSPENDED | REINSTATED) evolves with inability-to-pay rulings. They are independent except that payments are blocked while suspension_status == SUSPENDED."
    transitions:
      - from: OUTSTANDING
        to: PARTIALLY_COLLECTED
        trigger: "POST /enforcement/judgments/{id}/payments kind=COLLECTION with 0 < collected_cents_after < amount_cents"
        actor: CompanyRepresentative
        preconditions:
          - "suspension_status != SUSPENDED (else ERR_JUDGMENT_SUSPENDED)"
          - "parent RedressFund.status IN {ACCUMULATING, OPEN_FOR_CLAIMS} (else ERR_COLLECTION_WINDOW_CLOSED)"
          - "payment amount_cents <= outstanding_cents (else ERR_PAYMENT_EXCEEDS_OUTSTANDING)"
        side_effects:
          - "collected_cents += amount_cents; outstanding_cents recomputed"
          - "RedressFund.total_collected_cents synced to collected_cents"
          - "If RedressFund.status == ACCUMULATING and total_collected_cents >= FUND_OPEN_MINIMUM_CENTS: RedressFund -> OPEN_FOR_CLAIMS, and every Claimant of that fund in IDENTIFIED -> NOTIFIED (notified_at = now); RedressFund.version increments"
          - "increments MonetaryJudgment.version by 1"
      - from: PARTIALLY_COLLECTED
        to: PARTIALLY_COLLECTED
        trigger: "POST /enforcement/judgments/{id}/payments kind=COLLECTION (partial) or kind=REVERSAL (still above zero)"
        actor: CompanyRepresentative
        preconditions: ["same as the OUTSTANDING -> PARTIALLY_COLLECTED row; REVERSAL additionally requires amount_cents <= collected_cents (else ERR_REVERSAL_EXCEEDS_COLLECTED)"]
        side_effects: ["same cascade set as the OUTSTANDING -> PARTIALLY_COLLECTED row"]
      - from: PARTIALLY_COLLECTED
        to: SATISFIED
        trigger: "POST /enforcement/judgments/{id}/payments kind=COLLECTION bringing collected_cents == amount_cents"
        actor: CompanyRepresentative
        preconditions: ["same as above"]
        side_effects: ["same cascade set as above"]
      - from: OUTSTANDING
        to: SATISFIED
        trigger: "POST /enforcement/judgments/{id}/payments kind=COLLECTION paying the full amount in one call"
        actor: CompanyRepresentative
        preconditions: ["same as above"]
        side_effects: ["same cascade set as above"]
      - from: PARTIALLY_COLLECTED
        to: OUTSTANDING
        trigger: "POST /enforcement/judgments/{id}/payments kind=REVERSAL bringing collected_cents == 0"
        actor: CompanyRepresentative
        preconditions: ["suspension_status != SUSPENDED", "amount_cents <= collected_cents (else ERR_REVERSAL_EXCEEDS_COLLECTED)"]
        side_effects:
          - "collected_cents -= amount_cents; outstanding_cents recomputed"
          - "RedressFund.total_collected_cents synced to collected_cents"
          - "increments MonetaryJudgment.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /enforcement/judgments/{id}/transition target_state=SUSPENDED with sworn_total_assets_cents"
        actor: Commissioner
        preconditions:
          - "suspension_status == ACTIVE (dimension transition; collection_status unchanged)"
          - "sworn_total_assets_cents provided (else ERR_INVALID_REQUEST)"
          - "sworn_total_assets_cents < outstanding_cents * SUSPENSION_MAX_ASSET_RATIO (0.10) — strict less-than (else ERR_SUSPENSION_THRESHOLD_NOT_MET)"
        side_effects: ["sworn_total_assets_cents recorded", "increments MonetaryJudgment.version by 1"]
      - from: SUSPENDED
        to: REINSTATED
        trigger: "POST /enforcement/judgments/{id}/transition target_state=REINSTATED"
        actor: Commissioner
        preconditions:
          - "suspension_status == SUSPENDED"
          - "asset_trace_log is non-empty (else ERR_NO_COMPLETED_ASSET_TRACE)"
          - "latest asset_trace_log entry (by traced_at) has found_assets_cents >= outstanding_cents * SUSPENSION_MAX_ASSET_RATIO (else ERR_SUSPENSION_THRESHOLD_NOT_MET)"
        side_effects: ["increments MonetaryJudgment.version by 1"]

  - entity: RedressFund
    initial_state: ACCUMULATING
    terminal_states: [CLOSED]
    transitions:
      - from: ACCUMULATING
        to: OPEN_FOR_CLAIMS
        trigger: "system (automatic when a judgment payment or reversal syncs total_collected_cents >= FUND_OPEN_MINIMUM_CENTS)"
        actor: system
        preconditions: ["status == ACCUMULATING", "total_collected_cents >= FUND_OPEN_MINIMUM_CENTS (1000000)"]
        side_effects:
          - "Every Claimant of this fund in IDENTIFIED -> NOTIFIED (notified_at = now)"
          - "increments RedressFund.version by 1"
        note: "This transition is system-only; a manual transition request with target_state=OPEN_FOR_CLAIMS is rejected with ERR_INVALID_STATE_TRANSITION."
      - from: OPEN_FOR_CLAIMS
        to: CLAIMS_CLOSED
        trigger: "POST /enforcement/redress-funds/{id}/transition target_state=CLAIMS_CLOSED"
        actor: FundAdministrator
        preconditions:
          - "status == OPEN_FOR_CLAIMS"
          - "expected_redress_fund_version == current version (else ERR_STALE_FUND_VERSION)"
          - "no Claim of this fund in FILED or UNDER_REVIEW (else ERR_UNRESOLVED_CLAIMS_EXIST)"
        side_effects:
          - "admin_reserve_cents and distributable_pool_cents recomputed per redress_waterfall steps 1-3"
          - "increments RedressFund.version by 1"
      - from: CLAIMS_CLOSED
        to: DISBURSING
        trigger: "POST /enforcement/redress-funds/{id}/transition target_state=DISBURSING"
        actor: FundAdministrator
        preconditions:
          - "status == CLAIMS_CLOSED"
          - "expected_redress_fund_version == current version"
        side_effects:
          - "final_award_cents computed for every APPROVED claim per redress_waterfall step 4 (final variant, frozen)"
          - "allocated_cents = sum of final_award_cents over APPROVED claims; available_cents = distributable_pool_cents - allocated_cents"
          - "increments RedressFund.version by 1"
      - from: DISBURSING
        to: RESIDUAL_DISPOSITION
        trigger: "POST /enforcement/redress-funds/{id}/transition target_state=RESIDUAL_DISPOSITION with residual_recipient_name"
        actor: FundAdministrator
        preconditions:
          - "status == DISBURSING"
          - "expected_redress_fund_version == current version"
          - "residual_recipient_name provided (else ERR_INVALID_REQUEST)"
          - "every RefundCheck of this fund's claims is in CASHED or VOIDED (else ERR_CHECKS_OUTSTANDING)"
        side_effects:
          - "final claim_rate computed per residual_disposition_rule; residual_disposition = CY_PRES if claim_rate >= 0.60 else TREASURY_ESCHEAT"
          - "residual_cents = available_cents; available_cents = 0; residual_recipient_name recorded"
          - "increments RedressFund.version by 1"
      - from: RESIDUAL_DISPOSITION
        to: CLOSED
        trigger: "POST /enforcement/redress-funds/{id}/transition target_state=CLOSED"
        actor: FundAdministrator
        preconditions:
          - "status == RESIDUAL_DISPOSITION"
          - "expected_redress_fund_version == current version"
        side_effects: ["increments RedressFund.version by 1"]

  - entity: Claimant
    initial_state: IDENTIFIED
    terminal_states: []
    transitions:
      - from: IDENTIFIED
        to: NOTIFIED
        trigger: "system (fund opening cascade, or immediate at creation when the fund is already OPEN_FOR_CLAIMS)"
        actor: system
        preconditions: ["fund status == OPEN_FOR_CLAIMS"]
        side_effects: ["notified_at = now"]
      - from: NOTIFIED
        to: CLAIMED
        trigger: "system (automatic when the claimant files a Claim)"
        actor: system
        preconditions: ["status == NOTIFIED"]
        side_effects: []

  - entity: Claim
    initial_state: FILED
    terminal_states: [DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /enforcement/claims/{id}/transition target_state=UNDER_REVIEW"
        actor: FundAdministrator
        preconditions: ["status == FILED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /enforcement/claims/{id}/transition target_state=APPROVED"
        actor: FundAdministrator
        preconditions:
          - "status == UNDER_REVIEW"
          - "parent RedressFund.status == OPEN_FOR_CLAIMS (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "eligible_loss_cents = min(documented_loss_cents, LOSS_CAP_CENTS)"
          - "provisional_award_cents recomputed for EVERY APPROVED claim of the fund per redress_waterfall (provisional variant)"
          - "increments Claim.version by 1; RedressFund.version increments (derived-field reconciliation)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /enforcement/claims/{id}/transition target_state=DENIED with denial_reason"
        actor: FundAdministrator
        preconditions:
          - "status == UNDER_REVIEW"
          - "denial_reason provided (else ERR_INVALID_REQUEST)"
        side_effects: ["denial_reason = input", "increments Claim.version by 1"]
      - from: APPROVED
        to: PAYMENT_PENDING
        trigger: "system (automatic when a refund check is issued for the claim)"
        actor: system
        preconditions: ["status == APPROVED"]
        side_effects: ["increments Claim.version by 1"]
      - from: PAYMENT_PENDING
        to: PAID
        trigger: "system (cascade when the claim's RefundCheck is CASHED)"
        actor: system
        preconditions: ["status == PAYMENT_PENDING"]
        side_effects: ["increments Claim.version by 1"]
      - from: PAYMENT_PENDING
        to: APPROVED
        trigger: "system (cascade when the claim's ISSUED or STALE RefundCheck is VOIDED)"
        actor: system
        preconditions: ["status == PAYMENT_PENDING"]
        side_effects: ["increments Claim.version by 1"]
        note: "Check-void compensation loop: voiding an uncashed check returns the claim to APPROVED so a replacement check can be issued within the reissue window."

  - entity: RefundCheck
    initial_state: ISSUED
    terminal_states: [CASHED, VOIDED]
    transitions:
      - from: ISSUED
        to: CASHED
        trigger: "POST /enforcement/refund-checks/{id}/transition target_state=CASHED"
        actor: DisbursementOfficer
        preconditions: ["status == ISSUED"]
        side_effects:
          - "cashed_at = now"
          - "Claim PAYMENT_PENDING -> PAID"
          - "RedressFund.allocated_cents -= amount_cents; disbursed_cents += amount_cents (ledger sync); RedressFund.version increments"
      - from: ISSUED
        to: STALE
        trigger: "system (automatic clock sweep when logical clock >= stale_after)"
        actor: system
        preconditions: ["status == ISSUED", "now >= stale_after"]
        side_effects: []
      - from: ISSUED
        to: VOIDED
        trigger: "POST /enforcement/refund-checks/{id}/transition target_state=VOIDED with voided_reason"
        actor: DisbursementOfficer
        preconditions:
          - "status IN {ISSUED, STALE}"
          - "voided_reason provided (else ERR_INVALID_REQUEST)"
        side_effects:
          - "voided_reason = input"
          - "Claim PAYMENT_PENDING -> APPROVED (compensation) — always fires, since only ISSUED/STALE checks are voidable"
          - "the claim reversion releases the allocation: RedressFund.allocated_cents -= amount_cents; available_cents += amount_cents; RedressFund.version increments"
      - from: STALE
        to: VOIDED
        trigger: "POST /enforcement/refund-checks/{id}/transition target_state=VOIDED with voided_reason"
        actor: DisbursementOfficer
        preconditions:
          - "status IN {ISSUED, STALE}"
          - "voided_reason provided (else ERR_INVALID_REQUEST)"
        side_effects: ["same cascade set as ISSUED -> VOIDED"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: order-transition-stale-version
    parent_entity: ConsentOrder
    write_endpoint: "POST /enforcement/consent-orders/{orderId}/transition"
    occ_field: expected_consent_order_version
    description: |
      A ConsentOrder transition request carrying an expected_consent_order_version
      that no longer matches the order's current version is rejected. This captures
      the case where the client's view of the order predates a committed transition
      (e.g., a withdrawal-and-reproposal that already advanced the version), so the
      stale writer's transition is refused instead of being applied on a moved base.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: fund-transition-stale-version
    parent_entity: RedressFund
    write_endpoint: "POST /enforcement/redress-funds/{fundId}/transition"
    occ_field: expected_redress_fund_version
    description: |
      A RedressFund transition request carrying an expected_redress_fund_version
      that no longer matches the fund's current version is rejected. Claim approvals
      and payment-cascade ledger syncs advance the fund's version between the
      administrator's last read and the transition call, so a stale version proves
      the administrator's view of the fund is out of date.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: complaint_velocity_risk_tier
    trigger: "on SubjectCompany creation (and whenever complaint_count_90d is supplied)"
    algorithm: threshold
    formula: |
      if complaint_count_90d >= CRITICAL_MIN (50):  risk_tier = CRITICAL
      elif complaint_count_90d >= ELEVATED_MIN (10): risk_tier = ELEVATED
      else:                                          risk_tier = STANDARD
      Boundary: exactly 10 is ELEVATED, exactly 50 is CRITICAL (>= semantics).
    input_set: "the SubjectCompany's complaint_count_90d integer"
    constants:
      ELEVATED_MIN: 10
      CRITICAL_MIN: 50
    precision: "integer comparison, no rounding"
    note: "Investigations with origin=MARKET_MONITORING require risk_tier IN {ELEVATED, CRITICAL} (ERR_MONITORING_THRESHOLD_NOT_MET otherwise)."

  - name: civil_penalty_accrual
    trigger: "provisional variant: on ViolationPenalty creation; final variant: on the CONFIRMED transition"
    algorithm: tiered_pricing
    formula: |
      rate(severity) = RATE_STANDARD_PER_DAY_CENTS | RATE_AGGRAVATED_PER_DAY_CENTS | RATE_EGREGIOUS_PER_DAY_CENTS
      provisional variant:
        provisional_days = PROVISIONAL_PROJECTION_DAYS (30)
        provisional_amount_cents = min(rate(severity) * provisional_days, ConsentOrder.max_penalty_cents)
      final variant (at CONFIRMED with cured_on):
        final_days = max(1, floor((cured_on - detected_on) / 86400 seconds))
        final_amount_cents = min(rate(severity) * final_days, ConsentOrder.max_penalty_cents)
    input_set: "the ViolationPenalty's severity, detected_on, cured_on; the parent ConsentOrder's max_penalty_cents"
    constants:
      RATE_STANDARD_PER_DAY_CENTS: 1000000
      RATE_AGGRAVATED_PER_DAY_CENTS: 4353000
      RATE_EGREGIOUS_PER_DAY_CENTS: 5000000
      PROVISIONAL_PROJECTION_DAYS: 30
    precision: "integer cents; day count floored to whole days, minimum 1"
    variants:
      - name: provisional
        when: "at assessment time, before the violation is cured"
        difference: "uses the fixed 30-day forward projection instead of actual cure duration; provisional and final amounts differ for identical severity/detection inputs whenever the actual cure duration differs from 30 days"
      - name: final
        when: "at the CONFIRMED transition once cured_on is known"
        difference: "uses actual whole days from detected_on to cured_on (minimum 1), replacing the provisional figure"

  - name: redress_waterfall
    trigger: "provisional variant: on every Claim approval (recomputed for all APPROVED claims of the fund); final variant: on the fund's CLAIMS_CLOSED -> DISBURSING transition; reserve/pool recomputed again at OPEN_FOR_CLAIMS -> CLAIMS_CLOSED"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is PINNED (do not reorder — steps 2-4 depend on earlier steps):
      (1) For every APPROVED claim of the fund: eligible_i = min(documented_loss_cents_i, LOSS_CAP_CENTS).
          total_eligible = sum(eligible_i). If no APPROVED claims, total_eligible = 0.
      (2) admin_reserve_cents = min(ceil(total_eligible * ADMIN_RESERVE_RATE), ADMIN_RESERVE_CAP_CENTS).
          (ceil applies at whole-cent granularity; e.g. 0.10 * 3500000 = 350000 exactly.)
      (3) distributable_pool_cents = total_collected_cents - admin_reserve_cents.
      (4) Awards:
          if total_eligible == 0: every award is 0.
          elif distributable_pool_cents >= total_eligible: award_i = eligible_i (full compensation).
          else (pro-rata):
            award_i = floor(distributable_pool_cents * eligible_i / total_eligible)   [per-claim floor FIRST]
            remainder = distributable_pool_cents - sum(award_i)
            then distribute the remainder one cent at a time to claims ordered by
            created_at ASC (earliest approved claim first) until remainder == 0. [rounding order pinned:
            floor per claim, THEN cent-by-cent remainder by created_at ASC]
      provisional variant: total_collected_cents and the APPROVED set are read at approval time;
        awards remain mutable. final variant: computed once at DISBURSING and frozen into
        final_award_cents.
    input_set: "Claims of the fund with status == APPROVED (FILED, UNDER_REVIEW, DENIED, PAID excluded); RedressFund.total_collected_cents"
    constants:
      LOSS_CAP_CENTS: 2500000
      ADMIN_RESERVE_RATE: 0.10
      ADMIN_RESERVE_CAP_CENTS: 500000
      FUND_OPEN_MINIMUM_CENTS: 1000000
    precision: "integer cents; floor per claim before remainder distribution; created_at ASC remainder order (never id)"
    variants:
      - name: provisional
        when: "on each claim approval while the fund is OPEN_FOR_CLAIMS"
        difference: "computed against the current APPROVED set and current total_collected_cents, so an early-approved claim's provisional award can shrink when later claims are approved against the same collected pool"
      - name: final
        when: "at the CLAIMS_CLOSED -> DISBURSING transition"
        difference: "computed against the frozen APPROVED set and frozen total_collected_cents (collections are closed), then written to final_award_cents and never recomputed"

  - name: residual_disposition_rule
    trigger: "on the fund's DISBURSING -> RESIDUAL_DISPOSITION transition"
    algorithm: threshold
    formula: |
      identified_count = count of Claimant rows of the fund (any status)
      approved_count   = count of Claims of the fund that reached APPROVED at any point
                         (status IN {APPROVED, PAID}, i.e., excluding DENIED and excluding
                          claims that never left FILED/UNDER_REVIEW before CLAIMS_CLOSED)
      claim_rate = 0 if identified_count == 0 else approved_count / identified_count
      residual_disposition = CY_PRES if claim_rate >= CY_PRES_MIN_CLAIM_RATE (0.60) else TREASURY_ESCHEAT
      residual_cents = available_cents (uncashed / unawarded money remaining)
    input_set: "all Claimant rows of the fund; all Claim rows of the fund"
    constants:
      CY_PRES_MIN_CLAIM_RATE: 0.60
    precision: "rational comparison; exactly 0.60 qualifies as CY_PRES (>= semantics)"

  - name: check_lifecycle_timing
    trigger: "on clock-set sweep (staleness), on check issuance (deadlines), on reissue attempts"
    algorithm: chronological
    formula: |
      stale_after = issued_at + CHECK_STALE_DAYS days (90)
      reissue_deadline = issued_at + CHECK_REISSUE_WINDOW_DAYS days (180)
      Sweep rule: a check with status == ISSUED transitions to STALE when now >= stale_after
      (at exactly stale_after the check is STALE — >= semantics).
      Reissue rule: POST /claims/{id}/checks for a claim whose prior check is VOIDED succeeds
      only while now < reissue_deadline of the ORIGINAL check in the chain; at or after the
      deadline it fails with ERR_REISSUE_WINDOW_EXPIRED.
    input_set: "RefundCheck rows of the fund's claims; the logical clock"
    constants:
      CHECK_STALE_DAYS: 90
      CHECK_REISSUE_WINDOW_DAYS: 180
      COMMENT_PERIOD_DAYS: 30
      SUSPENSION_MAX_ASSET_RATIO: 0.10
      FRAUD_WARNING_TEXT: "WARNING: The FTC never requires payment or personal information to cash a refund check. Anyone who demands money or information in exchange for your refund is a scammer."
    precision: "ISO8601 timestamps compared at second precision; >= at the boundary instant"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number fires first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint (per §1.5 roles); for target-scoped transition endpoints, the role must also be permitted for the requested target_state"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path parameters resolve left-to-right: each templated resource id must exist (and belong to its parent in the path)"
    error_id: "ERR_*_NOT_FOUND (entity-specific)"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "Request body well-formed: required fields present, enum values in their declared sets, integer/datetime types valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 5
    category: state
    check: "The target entity's current state permits the requested transition or action (state-machine from-state membership; includes ERR_JUDGMENT_SUSPENDED for payments on a SUSPENDED judgment and ERR_FUND_NOT_DISBURSING for check issuance outside DISBURSING)"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_JUDGMENT_SUSPENDED | ERR_FUND_NOT_DISBURSING"
    http_status: 409
    applies_to: "all transition/action endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version in the request equals the parent entity's current version"
    error_id: "ERR_STALE_ORDER_VERSION | ERR_STALE_FUND_VERSION"
    http_status: 412
    applies_to: "POST /enforcement/consent-orders/{id}/transition, POST /enforcement/redress-funds/{id}/transition"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: penalty confirm/waive X-User-ID != assessed_by_user_id (ERR_SOD_PENALTY_CONFIRM); refund-check issuance X-User-ID != claim.approved_by_user_id (ERR_SOD_CHECK_ISSUE)"
    error_id: "ERR_SOD_PENALTY_CONFIRM | ERR_SOD_CHECK_ISSUE"
    http_status: 403
    applies_to: "POST /enforcement/violation-penalties/{id}/transition, POST /enforcement/claims/{id}/checks"
  - priority: 8
    category: business_safety
    check: "Regulatory cooling-off: ConsentOrder FINAL transition requires the latest PublicCommentPeriod (highest round) to be CLOSED"
    error_id: ERR_COMMENT_PERIOD_OPEN
    http_status: 409
    applies_to: "POST /enforcement/consent-orders/{id}/transition target_state=FINAL"
  - priority: 9
    category: business_temporal
    check: "Deadline checks: CID response before response_due_date; comment posting while period OPEN; check reissue before the original check's reissue_deadline"
    error_id: "ERR_CID_RESPONSE_OVERDUE | ERR_COMMENT_PERIOD_CLOSED | ERR_REISSUE_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "CID RESPONDED transition, POST /enforcement/comment-periods/{id}/comments, POST /enforcement/claims/{id}/checks (reissue)"
  - priority: 10
    category: business_temporal
    check: "Interval overlap: a new ComplianceReport's closed interval [period_start, period_end] must not overlap any non-DEFICIENT existing report's interval on the same order (touching endpoints DO overlap); a ConsentOrder entering IN_MONITORING must not produce a half-open [monitoring_started_at, monitoring_ends_at) overlap with another IN_MONITORING order of the same subject_company_id (touching endpoints do NOT overlap)"
    error_id: "ERR_REPORTING_PERIOD_OVERLAP | ERR_MONITORING_TERM_OVERLAP"
    http_status: 409
    applies_to: "POST /enforcement/consent-orders/{id}/compliance-reports, POST /enforcement/consent-orders/{id}/transition target_state=IN_MONITORING"
  - priority: 11
    category: business_constraint
    check: "Uniqueness/cardinality: at most one MonetaryJudgment per ConsentOrder (ERR_JUDGMENT_ALREADY_EXISTS); at most one Claim per Claimant (ERR_CLAIM_ALREADY_FILED); at most one non-VOIDED RefundCheck per Claim (ERR_CHECK_ALREADY_OUTSTANDING)"
    error_id: "ERR_JUDGMENT_ALREADY_EXISTS | ERR_CLAIM_ALREADY_FILED | ERR_CHECK_ALREADY_OUTSTANDING"
    http_status: 409
    applies_to: "POST /enforcement/consent-orders/{id}/judgment, POST /enforcement/claims, POST /enforcement/claims/{id}/checks"
  - priority: 12
    category: business_referential
    check: "Cross-entity referential integrity: Claim.redress_fund_id must equal the claimant's fund (ERR_CLAIM_FUND_MISMATCH); a ComplianceReport's submitter X-User-ID must equal the order's subject_company_id (ERR_REPORT_COMPANY_MISMATCH — intentionally checked AFTER the temporal overlap rule, so a wrong-company submission on an overlapping window reports the overlap)"
    error_id: "ERR_CLAIM_FUND_MISMATCH | ERR_REPORT_COMPANY_MISMATCH"
    http_status: 400
    applies_to: "POST /enforcement/claims, POST /enforcement/consent-orders/{id}/compliance-reports"
  - priority: 13
    category: business_constraint
    check: "Claim filing ownership: X-User-ID must equal claimant_id (ERR_CLAIMANT_IDENTITY_MISMATCH); CID response/quash and judgment payment ownership: X-User-ID must equal the subject company id (ERR_SUBJECT_COMPANY_MISMATCH); aggregate gate: fund claims-close requires zero FILED/UNDER_REVIEW claims (ERR_UNRESOLVED_CLAIMS_EXIST); residual disposition requires all checks terminal (ERR_CHECKS_OUTSTANDING)"
    error_id: "ERR_CLAIMANT_IDENTITY_MISMATCH | ERR_SUBJECT_COMPANY_MISMATCH | ERR_UNRESOLVED_CLAIMS_EXIST | ERR_CHECKS_OUTSTANDING"
    http_status: 403
    applies_to: "POST /enforcement/claims, CID transitions, POST /enforcement/judgments/{id}/payments, fund transitions"
    note: "ERR_UNRESOLVED_CLAIMS_EXIST and ERR_CHECKS_OUTSTANDING return 409; the two ownership mismatches return 403."
  - priority: 14
    category: business_fiscal
    check: "Money limits: payment amount <= outstanding_cents (ERR_PAYMENT_EXCEEDS_OUTSTANDING); reversal amount <= collected_cents (ERR_REVERSAL_EXCEEDS_COLLECTED); suspension requires sworn assets strictly below 10% of outstanding (ERR_SUSPENSION_THRESHOLD_NOT_MET); MARKET_MONITORING origin requires risk_tier != STANDARD (ERR_MONITORING_THRESHOLD_NOT_MET)"
    error_id: "ERR_PAYMENT_EXCEEDS_OUTSTANDING | ERR_REVERSAL_EXCEEDS_COLLECTED | ERR_SUSPENSION_THRESHOLD_NOT_MET | ERR_MONITORING_THRESHOLD_NOT_MET"
    http_status: 422
    applies_to: "payments, judgment transitions, POST /enforcement/investigations"
    note: "ERR_MONITORING_THRESHOLD_NOT_MET is an intake-threshold rule grouped with the fiscal/threshold tier by domain convention: the agency gates cheap intake channels last, after all structural checks."

# =============================================================================
# §1.5 API Endpoint Table
# (GET endpoints list every concrete role; "Any" is not a role. The logical
#  clock endpoint lives OUTSIDE the api_prefix under /_clock.)
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z (never wall-clock). Each set performs the auto-transition sweep: comment periods close at/after closes_at, ISSUED checks go STALE at/after stale_after, IN_MONITORING orders EXPIRE once the clock is strictly past monitoring_ends_at."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["runs the auto-transition sweep"]

  - method: POST
    path: "/enforcement/subject-companies"
    description: "Register a subject company"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, "complaint_count_90d?"]
    output: SubjectCompany
    side_effects: ["risk_tier computed per complaint_velocity_risk_tier"]

  - method: GET
    path: "/enforcement/subject-companies/{companyId}"
    description: "Get a subject company"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: []
    output: SubjectCompany
    side_effects: []

  - method: POST
    path: "/enforcement/investigations"
    description: "Open an investigation against a subject company"
    roles: [StaffAttorney]
    code: 201
    input: [subject_company_id, origin, summary]
    output: Investigation
    side_effects: ["status = INTAKE", "opened_by_user_id = X-User-ID", "MARKET_MONITORING origin gated by risk_tier (ERR_MONITORING_THRESHOLD_NOT_MET)"]

  - method: GET
    path: "/enforcement/investigations"
    description: "List investigations, filterable"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: ["subject_company_id?", "status?", "limit?", "offset?"]
    output: "Investigation[]"
    side_effects: []

  - method: GET
    path: "/enforcement/investigations/{investigationId}"
    description: "Get an investigation"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: []
    output: Investigation
    side_effects: []

  - method: POST
    path: "/enforcement/investigations/{investigationId}/transition"
    description: "Move an investigation along its machine: PRELIMINARY_REVIEW, EVIDENCE_GATHERING, NEGOTIATING, CLOSED_NO_ACTION"
    roles: [StaffAttorney]
    code: 200
    input: [target_state]
    output: Investigation
    side_effects: ["state transition per Investigation machine", "increments Investigation.version by 1"]

  - method: POST
    path: "/enforcement/investigations/{id}/cids"
    description: "Draft a civil investigative demand under an investigation"
    roles: [StaffAttorney]
    code: 201
    input: [subject_matter, response_due_date]
    output: CivilInvestigativeDemand
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/enforcement/investigations/{id}/cids"
    description: "List CIDs of an investigation"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CivilInvestigativeDemand[]"
    side_effects: []

  - method: POST
    path: "/enforcement/cids/{cidId}/transition"
    description: "CID lifecycle: ISSUED (StaffAttorney), RESPONDED (CompanyRepresentative, needs response_document_ref), QUASH_PETITIONED (CompanyRepresentative), ENFORCED (StaffAttorney), WITHDRAWN (StaffAttorney)"
    roles: [StaffAttorney, CompanyRepresentative]
    code: 200
    input: [target_state, "response_document_ref?"]
    output: CivilInvestigativeDemand
    side_effects: ["state transition per CID machine", "increments CivilInvestigativeDemand.version by 1"]

  - method: POST
    path: "/enforcement/investigations/{id}/consent-orders"
    description: "Draft a consent order for an investigation in NEGOTIATING"
    roles: [StaffAttorney]
    code: 201
    input: [monetary_relief_cents, max_penalty_cents, reporting_frequency_months, monitoring_term_years, conduct_prohibitions]
    output: ConsentOrder
    side_effects: ["status = DRAFT", "parent Investigation -> SETTLED", "negotiating_attorney_user_id = X-User-ID", "subject_company_id denormalized from the investigation"]

  - method: GET
    path: "/enforcement/investigations/{id}/consent-orders"
    description: "List consent orders of an investigation"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ConsentOrder[]"
    side_effects: []

  - method: GET
    path: "/enforcement/consent-orders/{orderId}"
    description: "Get a consent order"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: []
    output: ConsentOrder
    side_effects: []

  - method: POST
    path: "/enforcement/consent-orders/{orderId}/transition"
    description: "Order lifecycle (OCC-guarded): IN_PUBLIC_COMMENT and DRAFT-withdrawal by StaffAttorney; FINAL, IN_MONITORING, TERMINATED by Commissioner"
    roles: [StaffAttorney, Commissioner]
    code: 200
    input: [target_state, expected_consent_order_version]
    output: ConsentOrder
    side_effects: ["state transition per ConsentOrder machine incl. comment-period creation/voiding and investigation bubble-up", "increments ConsentOrder.version by 1"]

  - method: GET
    path: "/enforcement/consent-orders/{id}/comment-periods"
    description: "List public comment periods of an order (all proposal rounds), ordered by round ASC"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PublicCommentPeriod[]"
    side_effects: []

  - method: POST
    path: "/enforcement/comment-periods/{periodId}/comments"
    description: "File a public comment on a proposed consent agreement; period must be OPEN"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 201
    input: [author_email, body]
    output: PublicCommentPeriod
    side_effects: ["appends {author_email, body, submitted_at} to comments", "comment_count += 1", "increments PublicCommentPeriod.version by 1"]

  - method: POST
    path: "/enforcement/consent-orders/{id}/compliance-reports"
    description: "Submit a compliance report for an order in IN_MONITORING"
    roles: [CompanyRepresentative]
    code: 201
    input: [period_start, period_end, report_document_ref]
    output: ComplianceReport
    side_effects: ["status = SUBMITTED", "submitted_by_company_id = X-User-ID"]

  - method: GET
    path: "/enforcement/consent-orders/{id}/compliance-reports"
    description: "List compliance reports of an order"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ComplianceReport[]"
    side_effects: []

  - method: POST
    path: "/enforcement/compliance-reports/{reportId}/transition"
    description: "Report review: ACCEPTED / DEFICIENT by ComplianceMonitor (deficiency_notes required for DEFICIENT); SUBMITTED resubmission by CompanyRepresentative (report_document_ref required)"
    roles: [ComplianceMonitor, CompanyRepresentative]
    code: 200
    input: [target_state, "deficiency_notes?", "report_document_ref?"]
    output: ComplianceReport
    side_effects: ["state transition per ComplianceReport machine", "increments ComplianceReport.version by 1"]

  - method: POST
    path: "/enforcement/consent-orders/{id}/violation-penalties"
    description: "Assess a violation penalty (provisional) against an order in IN_MONITORING"
    roles: [ComplianceMonitor]
    code: 201
    input: [severity, detected_on, description]
    output: ViolationPenalty
    side_effects: ["status = ASSESSED_PROVISIONAL", "provisional_days/provisional_amount_cents computed per civil_penalty_accrual", "assessed_by_user_id = X-User-ID"]

  - method: GET
    path: "/enforcement/consent-orders/{id}/violation-penalties"
    description: "List violation penalties of an order"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ViolationPenalty[]"
    side_effects: []

  - method: POST
    path: "/enforcement/violation-penalties/{penaltyId}/transition"
    description: "Penalty lifecycle: CONFIRMED (ComplianceMonitor, needs cured_on, SoD) / WAIVED (ComplianceMonitor, SoD) / PAID (CompanyRepresentative of the subject company)"
    roles: [ComplianceMonitor, CompanyRepresentative]
    code: 200
    input: [target_state, "cured_on?"]
    output: ViolationPenalty
    side_effects: ["state transition per ViolationPenalty machine", "final_days/final_amount_cents computed at CONFIRMED", "increments ViolationPenalty.version by 1"]

  - method: POST
    path: "/enforcement/consent-orders/{id}/judgment"
    description: "Enter the monetary judgment for a FINAL or IN_MONITORING order; at most one per order"
    roles: [Commissioner]
    code: 201
    input: [amount_cents]
    output: MonetaryJudgment
    side_effects: ["collection_status = OUTSTANDING, suspension_status = ACTIVE", "auto-creates the linked RedressFund in ACCUMULATING with total_collected_cents = 0"]

  - method: GET
    path: "/enforcement/consent-orders/{id}/judgment"
    description: "Get the judgment of an order (array of 0 or 1)"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: []
    output: "MonetaryJudgment[]"
    side_effects: []

  - method: GET
    path: "/enforcement/judgments/{judgmentId}"
    description: "Get a monetary judgment"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: []
    output: MonetaryJudgment
    side_effects: []

  - method: POST
    path: "/enforcement/judgments/{judgmentId}/payments"
    description: "Record a collection payment or a compensating reversal by the subject company"
    roles: [CompanyRepresentative]
    code: 201
    input: [amount_cents, kind]
    output: MonetaryJudgment
    side_effects: ["collected/outstanding recomputed", "collection_status may advance", "RedressFund.total_collected_cents synced; fund auto-opens at FUND_OPEN_MINIMUM_CENTS and notifies IDENTIFIED claimants", "increments MonetaryJudgment.version by 1"]

  - method: POST
    path: "/enforcement/judgments/{judgmentId}/transition"
    description: "Suspension dimension: SUSPENDED (needs sworn_total_assets_cents below the 10% threshold) and REINSTATED (needs a qualifying asset trace)"
    roles: [Commissioner]
    code: 200
    input: [target_state, "sworn_total_assets_cents?"]
    output: MonetaryJudgment
    side_effects: ["suspension_status transition per MonetaryJudgment machine", "increments MonetaryJudgment.version by 1"]

  - method: POST
    path: "/enforcement/judgments/{judgmentId}/asset-traces"
    description: "Record a completed asset trace against a judgment (appends to asset_trace_log)"
    roles: [StaffAttorney]
    code: 201
    input: [found_assets_cents, trace_ref]
    output: MonetaryJudgment
    side_effects: ["appends {found_assets_cents, trace_ref, traced_at} to asset_trace_log", "increments MonetaryJudgment.version by 1"]

  - method: GET
    path: "/enforcement/judgments/{id}/redress-fund"
    description: "Get the redress fund linked to a judgment (array of 0 or 1)"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: []
    output: "RedressFund[]"
    side_effects: []

  - method: GET
    path: "/enforcement/redress-funds/{fundId}"
    description: "Get a redress fund with its computed ledger fields"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: []
    output: RedressFund
    side_effects: []

  - method: POST
    path: "/enforcement/redress-funds/{fundId}/transition"
    description: "Fund lifecycle (OCC-guarded): CLAIMS_CLOSED, DISBURSING, RESIDUAL_DISPOSITION (needs residual_recipient_name), CLOSED. ACCUMULATING -> OPEN_FOR_CLAIMS is system-only."
    roles: [FundAdministrator]
    code: 200
    input: [target_state, expected_redress_fund_version, "residual_recipient_name?"]
    output: RedressFund
    side_effects: ["state transition per RedressFund machine incl. waterfall recomputation and award freezing", "increments RedressFund.version by 1"]

  - method: POST
    path: "/enforcement/redress-funds/{id}/claimants"
    description: "Identify a claimant (from company records or claims intake) while the fund is ACCUMULATING or OPEN_FOR_CLAIMS"
    roles: [FundAdministrator]
    code: 201
    input: [full_name, email, identified_from]
    output: Claimant
    side_effects: ["status = IDENTIFIED; immediately NOTIFIED (notified_at = now) if the fund is already OPEN_FOR_CLAIMS"]

  - method: GET
    path: "/enforcement/redress-funds/{id}/claimants"
    description: "List claimants of a fund"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Claimant[]"
    side_effects: []

  - method: POST
    path: "/enforcement/claims"
    description: "File a redress claim (X-User-ID must equal claimant_id; fund must be OPEN_FOR_CLAIMS; claimant NOTIFIED; one claim per claimant)"
    roles: [Claimant]
    code: 201
    input: [claimant_id, redress_fund_id, documented_loss_cents]
    output: Claim
    side_effects: ["status = FILED", "Claimant NOTIFIED -> CLAIMED"]

  - method: GET
    path: "/enforcement/claims"
    description: "List claims, filterable by claimant, fund, status; ordered by created_at ASC"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: ["claimant_id?", "redress_fund_id?", "status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/enforcement/claims/{claimId}"
    description: "Get a single claim"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/enforcement/claims/{claimId}/transition"
    description: "Claim review: UNDER_REVIEW, APPROVED (recomputes provisional awards fund-wide), DENIED (needs denial_reason)"
    roles: [FundAdministrator]
    code: 200
    input: [target_state, "denial_reason?"]
    output: Claim
    side_effects: ["state transition per Claim machine", "on APPROVED: eligible_loss_cents set and provisional awards recomputed fund-wide per redress_waterfall", "increments Claim.version by 1"]

  - method: POST
    path: "/enforcement/claims/{id}/checks"
    description: "Issue (or reissue) the refund check for an APPROVED claim of a DISBURSING fund; issuer must not be the claim approver (SoD); fraud warning stamped on the check"
    roles: [DisbursementOfficer]
    code: 201
    input: []
    output: RefundCheck
    side_effects: ["status = ISSUED", "Claim APPROVED -> PAYMENT_PENDING", "amount_cents = claim.final_award_cents", "stale_after/reissue_deadline computed", "fraud_warning_text = FRAUD_WARNING_TEXT", "on reissue: original_check_id points at the VOIDED check"]

  - method: GET
    path: "/enforcement/claims/{id}/checks"
    description: "List refund checks of a claim (issuance and any reissues), ordered by created_at ASC"
    roles: [PlatformAdmin, StaffAttorney, Commissioner, ComplianceMonitor, FundAdministrator, DisbursementOfficer, CompanyRepresentative, Claimant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RefundCheck[]"
    side_effects: []

  - method: POST
    path: "/enforcement/refund-checks/{checkId}/transition"
    description: "Check lifecycle: CASHED (Claim -> PAID, fund disburses) and VOIDED (Claim PAID -> APPROVED compensation, fund reallocates; needs voided_reason)"
    roles: [DisbursementOfficer]
    code: 200
    input: [target_state, "voided_reason?"]
    output: RefundCheck
    side_effects: ["state transition per RefundCheck machine incl. claim/fund ledger cascades", "increments RefundCheck.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint, or role not permitted for the requested target_state" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, bad type, period_end <= period_start, cured_on < detected_on" }
  - { id: ERR_SUBJECT_COMPANY_NOT_FOUND, http: 404, condition: "SubjectCompany id does not exist" }
  - { id: ERR_INVESTIGATION_NOT_FOUND, http: 404, condition: "Investigation id does not exist" }
  - { id: ERR_CID_NOT_FOUND, http: 404, condition: "CivilInvestigativeDemand id does not exist" }
  - { id: ERR_CONSENT_ORDER_NOT_FOUND, http: 404, condition: "ConsentOrder id does not exist" }
  - { id: ERR_COMMENT_PERIOD_NOT_FOUND, http: 404, condition: "PublicCommentPeriod id does not exist" }
  - { id: ERR_COMPLIANCE_REPORT_NOT_FOUND, http: 404, condition: "ComplianceReport id does not exist" }
  - { id: ERR_VIOLATION_PENALTY_NOT_FOUND, http: 404, condition: "ViolationPenalty id does not exist" }
  - { id: ERR_JUDGMENT_NOT_FOUND, http: 404, condition: "MonetaryJudgment id does not exist" }
  - { id: ERR_REDRESS_FUND_NOT_FOUND, http: 404, condition: "RedressFund id does not exist" }
  - { id: ERR_CLAIMANT_NOT_FOUND, http: 404, condition: "Claimant id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id does not exist" }
  - { id: ERR_REFUND_CHECK_NOT_FOUND, http: 404, condition: "RefundCheck id does not exist" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Requested target_state is not a legal transition from the entity's current state" }
  - { id: ERR_JUDGMENT_SUSPENDED, http: 409, condition: "Payment or reversal attempted while the judgment's suspension_status is SUSPENDED" }
  - { id: ERR_FUND_NOT_DISBURSING, http: 409, condition: "Refund check issuance attempted while the fund is not in DISBURSING" }
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_consent_order_version does not match the order's current version" }
  - { id: ERR_STALE_FUND_VERSION, http: 412, condition: "expected_redress_fund_version does not match the fund's current version" }
  - { id: ERR_SOD_PENALTY_CONFIRM, http: 403, condition: "The confirming/waiving ComplianceMonitor is the same X-User-ID that assessed the penalty" }
  - { id: ERR_SOD_CHECK_ISSUE, http: 403, condition: "The DisbursementOfficer issuing a check is the same X-User-ID that approved the claim" }
  - { id: ERR_COMMENT_PERIOD_OPEN, http: 409, condition: "FINAL transition attempted while the latest public comment period is still OPEN" }
  - { id: ERR_COMMENT_PERIOD_CLOSED, http: 409, condition: "Public comment submitted to a period that is CLOSED or VOIDED" }
  - { id: ERR_CID_RESPONSE_OVERDUE, http: 409, condition: "CID response attempted at/after response_due_date while the CID is merely ISSUED (not ENFORCED)" }
  - { id: ERR_REISSUE_WINDOW_EXPIRED, http: 409, condition: "Check reissue attempted at/after the original check's reissue_deadline" }
  - { id: ERR_REPORTING_PERIOD_OVERLAP, http: 409, condition: "Compliance report's closed interval [period_start, period_end] overlaps an existing SUBMITTED/ACCEPTED report's interval on the same order; touching endpoints count as overlap" }
  - { id: ERR_MONITORING_TERM_OVERLAP, http: 409, condition: "Entering IN_MONITORING would overlap another IN_MONITORING order of the same subject company; half-open semantics: adjacency (end == start) is allowed" }
  - { id: ERR_JUDGMENT_ALREADY_EXISTS, http: 409, condition: "The consent order already has a monetary judgment" }
  - { id: ERR_CLAIM_ALREADY_FILED, http: 409, condition: "The claimant already has a claim on this fund" }
  - { id: ERR_CHECK_ALREADY_OUTSTANDING, http: 409, condition: "The claim already has a non-VOIDED check (ISSUED, STALE, or CASHED)" }
  - { id: ERR_UNRESOLVED_CLAIMS_EXIST, http: 409, condition: "CLAIMS_CLOSED attempted while claims remain in FILED or UNDER_REVIEW" }
  - { id: ERR_CHECKS_OUTSTANDING, http: 409, condition: "RESIDUAL_DISPOSITION attempted while a check is ISSUED or STALE" }
  - { id: ERR_COLLECTION_WINDOW_CLOSED, http: 409, condition: "Payment/reversal attempted after the fund left ACCUMULATING/OPEN_FOR_CLAIMS" }
  - { id: ERR_CLAIM_FUND_MISMATCH, http: 400, condition: "Claim.redress_fund_id does not equal the claimant's redress_fund_id" }
  - { id: ERR_REPORT_COMPANY_MISMATCH, http: 400, condition: "Compliance report submitted by a CompanyRepresentative whose X-User-ID is not the order's subject_company_id" }
  - { id: ERR_SUBJECT_COMPANY_MISMATCH, http: 403, condition: "CID response/quash or judgment payment by a CompanyRepresentative whose X-User-ID is not the subject company id" }
  - { id: ERR_CLAIMANT_IDENTITY_MISMATCH, http: 403, condition: "Claim filed with X-User-ID different from claimant_id" }
  - { id: ERR_MONITORING_THRESHOLD_NOT_MET, http: 422, condition: "Investigation origin MARKET_MONITORING requires the subject company's risk_tier to be ELEVATED or CRITICAL" }
  - { id: ERR_SUSPENSION_THRESHOLD_NOT_MET, http: 422, condition: "Suspension sworn assets >= 10% of outstanding, or reinstatement trace found assets < 10% of outstanding" }
  - { id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http: 422, condition: "COLLECTION payment amount exceeds the judgment's outstanding_cents" }
  - { id: ERR_REVERSAL_EXCEEDS_COLLECTED, http: 422, condition: "REVERSAL amount exceeds the judgment's collected_cents" }
  - { id: ERR_NO_COMPLETED_ASSET_TRACE, http: 409, condition: "REINSTATED attempted with an empty asset_trace_log" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Agency platform operator; registers subject companies and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /enforcement/subject-companies"
    shared_operations: ["all GET endpoints"]

  - name: StaffAttorney
    description: "Enforcement attorney; opens and advances investigations, issues CIDs, drafts and proposes consent orders, records asset traces"
    identity: opaque
    exclusive_operations:
      - "POST /enforcement/investigations"
      - "POST /enforcement/investigations/{id}/transition"
      - "POST /enforcement/investigations/{id}/cids"
      - "CID transitions ISSUED / ENFORCED / WITHDRAWN"
      - "POST /enforcement/investigations/{id}/consent-orders"
      - "ConsentOrder transitions IN_PUBLIC_COMMENT and DRAFT (withdrawal)"
      - "POST /enforcement/judgments/{id}/asset-traces"
    shared_operations: ["all GET endpoints"]

  - name: Commissioner
    description: "Presiding commissioner; finalizes orders, enters judgments, rules on inability-to-pay suspensions"
    identity: opaque
    exclusive_operations:
      - "ConsentOrder transitions FINAL / IN_MONITORING / TERMINATED"
      - "POST /enforcement/consent-orders/{id}/judgment"
      - "POST /enforcement/judgments/{id}/transition (SUSPENDED / REINSTATED)"
    shared_operations: ["all GET endpoints"]

  - name: ComplianceMonitor
    description: "Order compliance monitor; reviews compliance reports and assesses/confirms/waives violation penalties"
    identity: opaque
    exclusive_operations:
      - "ComplianceReport transitions ACCEPTED / DEFICIENT"
      - "POST /enforcement/consent-orders/{id}/violation-penalties"
      - "ViolationPenalty transitions CONFIRMED / WAIVED (never the assessing user)"
    shared_operations: ["all GET endpoints"]

  - name: FundAdministrator
    description: "Redress fund administrator; identifies claimants, reviews and approves/denies claims, advances the fund lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /enforcement/redress-funds/{id}/claimants"
      - "POST /enforcement/claims/{id}/transition"
      - "POST /enforcement/redress-funds/{id}/transition"
    shared_operations: ["all GET endpoints"]

  - name: DisbursementOfficer
    description: "Treasury disbursement officer; issues, cashes, and voids refund checks — never for a claim they approved"
    identity: opaque
    exclusive_operations:
      - "POST /enforcement/claims/{id}/checks"
      - "POST /enforcement/refund-checks/{id}/transition"
    shared_operations: ["all GET endpoints"]

  - name: CompanyRepresentative
    description: "Officer of the subject company; responds to CIDs, submits compliance reports, pays judgments and penalties"
    identity: "entity_backed:SubjectCompany"
    exclusive_operations:
      - "CID transitions RESPONDED / QUASH_PETITIONED (own company only)"
      - "POST /enforcement/consent-orders/{id}/compliance-reports (own company only)"
      - "ComplianceReport transition SUBMITTED resubmission (own company only)"
      - "POST /enforcement/judgments/{id}/payments (own company only)"
      - "ViolationPenalty transition PAID (own company only)"
    shared_operations: ["all GET endpoints"]

  - name: Claimant
    description: "Identified consumer; files their own redress claim"
    identity: "entity_backed:Claimant"
    exclusive_operations:
      - "POST /enforcement/claims (X-User-ID must equal claimant_id)"
    shared_operations: ["all GET endpoints"]
