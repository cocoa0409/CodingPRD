          full_name: Mara Plus
          home_drop_point_id: ${d_b}
          tier: PLUS
        as: ClubAdmin
        captures:
          ma_id: $.data.id
          ma_v: $.data.version
      - call: POST /members/${ma_id}/dues-payments
        payload:
          amount_cents: 9000
          term_years: 1
          expected_member_version: ${ma_v}
        as: ClubAdmin
      - call: POST /cycles
        payload:
          code: CY-MAY
          opens_at: '2026-05-05T00:00:00Z'
          cutoff_at: '2026-05-25T00:00:00Z'
        as: ClubAdmin
        captures:
          cyc: $.data.id
      - call: POST /drop-runs
        payload:
          cycle_id: ${cyc}
          drop_point_id: ${d_b}
        as: ClubAdmin
        captures:
