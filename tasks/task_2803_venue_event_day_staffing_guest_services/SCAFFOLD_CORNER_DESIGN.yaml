      - name: sla_minutes_forced_critical_for_lost_child_and_medical
        claim_type: constants_applied
        grounds:
          - calculations.guest_issue_sla
          - entities.GuestIssue.severity
          - endpoints[POST /guest-issues]
        distinguishing_aspect: >-
          severity is a computed field, not an input one: a LOST_CHILD and a MEDICAL issue filed with
          severity LOW both come back CRITICAL with sla_minutes 5 and a deadline five minutes out,
          while an identically-filed LOW LOST_FOUND issue keeps LOW and gets the 120-minute constant
          - so the override is keyed on category, not on a blanket rewrite of the input.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T19:00:00Z."
            - "One Event, no other fixtures needed - POST /guest-issues has no event-state precondition."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Severity Override Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "IN_PERSON", category: "LOST_CHILD", severity: "LOW", description: "Child separated at gate 4" }
              as: GuestServicesSupervisor
              captures: { gi_child: $.data.id, sev_child: $.data.severity, sla_child: $.data.sla_minutes, dl_child: $.data.sla_deadline }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "IN_PERSON", category: "MEDICAL", severity: "LOW", description: "Fainting in 218" }
              as: GuestServicesSupervisor
              captures: { gi_med: $.data.id, sev_med: $.data.severity, sla_med: $.data.sla_minutes, dl_med: $.data.sla_deadline }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "KIOSK", category: "LOST_FOUND", severity: "LOW", description: "Phone left in 118" }
              as: GuestServicesSupervisor
              captures: { gi_lost: $.data.id, sev_lost: $.data.severity, sla_lost: $.data.sla_minutes, dl_lost: $.data.sla_deadline }
          assert:
            - "${sev_child} == 'CRITICAL' and ${sla_child} == 5 and ${dl_child} == '2026-09-12T19:05:00Z'"
            - "${sev_med} == 'CRITICAL' and ${sla_med} == 5 and ${dl_med} == '2026-09-12T19:05:00Z'"
            - "${sev_lost} == 'LOW' and ${sla_lost} == 120 and ${dl_lost} == '2026-09-12T21:00:00Z' - the input severity is honoured for the other five categories"
            - "all three rows have sla_clock_started_at == created_at == '2026-09-12T19:00:00Z' and sla_breached == false"
            - "GET /guest-issues?event_id=${ev_id}&severity=CRITICAL returns total_count == 2"

      - name: sla_breach_is_strict_at_the_deadline_instant
        claim_type: precision
        grounds:
          - calculations.guest_issue_sla
          - state_machines.GuestIssue.IN_PROGRESS_to_RESOLVED
          - entities.GuestIssue.sla_breached
        distinguishing_aspect: >-
          sla_breached is `reference > sla_deadline`, so a HIGH issue opened at 12:00Z with deadline
          12:15Z is still unbreached at exactly 12:15:00Z and only flips at 12:16:00Z - and its
          resolved sibling freezes the flag against resolved_at, staying false at 13:00Z long after
          the deadline passed.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T12:00:00Z."
            - "One IN_PROGRESS Event; one ACTIVE StaffMember holding a VALID CODE_OF_CONDUCT certification (issued 2026-01-01, expires 2027-01-01)."
            - "Two HIGH CONDUCT_VIOLATION issues filed at 12:00Z, so both have sla_minutes 15 and sla_deadline 2026-09-12T12:15:00Z."
            - "Issue A is assigned and resolved EJECTION at 12:10Z; issue B is left OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T12:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "SLA Strictness Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T11:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Ida Responder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${m1}", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { cert_1: $.data.id, cert_status: $.data.status }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "CONDUCT_VIOLATION", severity: "HIGH", description: "Aisle altercation A" }
              as: GuestServicesSupervisor
              captures: { gi_a: $.data.id, dl_a: $.data.sla_deadline }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "CONDUCT_VIOLATION", severity: "HIGH", description: "Aisle altercation B" }
              as: GuestServicesSupervisor
              captures: { gi_b: $.data.id, dl_b: $.data.sla_deadline }
            - call: "POST /guest-issues/${gi_a}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              captures: { a_clock_after_assign: $.data.sla_clock_started_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T12:10:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /guest-issues/${gi_a}/resolve"
              payload: { resolution_type: "EJECTION" }
              as: GuestServicesSupervisor
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T12:15:00Z" }
              as: GuestServicesSupervisor
            - call: "GET /guest-issues/${gi_b}"
              as: GuestServicesSupervisor
              captures: { breach_at_deadline: $.data.sla_breached }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T12:16:00Z" }
              as: GuestServicesSupervisor
            - call: "GET /guest-issues/${gi_b}"
              as: GuestServicesSupervisor
              captures: { breach_after_deadline: $.data.sla_breached }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T13:00:00Z" }
              as: GuestServicesSupervisor
            - call: "GET /guest-issues/${gi_a}"
              as: GuestServicesSupervisor
              captures: { breach_resolved: $.data.sla_breached }
          assert:
            - "${cert_status} == 'VALID' - the clock sits inside [issued_on, expires_on) and revoked_at is null"
            - "${dl_a} == ${dl_b} == '2026-09-12T12:15:00Z' and sla_minutes == 15 on both"
            - "${a_clock_after_assign} == '2026-09-12T12:00:00Z' - assignment does not restart the clock"
            - "${breach_at_deadline} == false - at exactly the deadline instant the comparison is not yet strictly greater"
            - "${breach_after_deadline} == true one minute later"
            - "${breach_resolved} == false at 13:00Z - the reference instant for a resolved row is resolved_at ('2026-09-12T12:10:00Z'), not the live clock"
            - "GuestIssue.${gi_a}.status == RESOLVED, resolution_type == 'EJECTION', resolved_at == '2026-09-12T12:10:00Z'"
            - "GuestIssue.${gi_b}.status == OPEN"

      - name: historical_variant_without_actual_attendance_rejected
        claim_type: variant_selection
        grounds:
          - calculations.position_slot_required_headcount
          - errors[ERR_HISTORICAL_ATTENDANCE_MISSING]
          - validations[priority 19]
          - endpoints[POST /staffing-plans]
          - endpoints[PATCH /events/{id}]
        distinguishing_aspect: >-
          The variant is chosen at plan creation and is refused outright when its input is missing:
          HISTORICAL_ACTUAL on an event with historical_actual_attendance null returns
          ERR_HISTORICAL_ATTENDANCE_MISSING, and once the turnstile count is patched in each plan
          pins the number its own variant names - basis_attendance 25000 for HISTORICAL_ACTUAL and
          40000 for FORECAST_BASED on the very same event.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One Event with expected_attendance 40000 and historical_actual_attendance left unset."
            - "One USHER PositionType at 2200 cents/h, attendance_ratio_per_1000 1.5, min_headcount 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Variant Selection Fixture", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 40000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, hist_at_create: $.data.historical_actual_attendance }
            - call: "POST /position-types"
              payload: { code: "USHER", display_name: "Usher", base_hourly_rate_cents: 2200, attendance_ratio_per_1000: 1.5, min_headcount: 4, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
          trigger:
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "HISTORICAL_ACTUAL" }
              as: StaffingCoordinator
              captures: { err_missing: $.data.error_id }
            - call: "PATCH /events/${ev_id}"
              payload: { historical_actual_attendance: 25000 }
              as: GuestExperienceDirector
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "HISTORICAL_ACTUAL" }
              as: StaffingCoordinator
              captures: { plan_hist: $.data.id, basis_hist: $.data.basis_attendance, tier_hist: $.data.basis_attendance_tier }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_fcst: $.data.id, basis_fcst: $.data.basis_attendance, tier_fcst: $.data.basis_attendance_tier }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_hist}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-20T14:00:00Z", shift_end: "2026-09-20T20:00:00Z" }
              as: StaffingCoordinator
              captures: { slot_hist: $.data.id, hc_hist: $.data.required_headcount }
          assert:
            - "${hist_at_create} is null - the field defaults to null and is not derived from expected_attendance"
            - "${err_missing} == 'ERR_HISTORICAL_ATTENDANCE_MISSING' with HTTP 409, and GET /staffing-plans?event_id=${ev_id} returns total_count == 0 at that point"
            - "Event.${ev_id}.attendance_tier == 'TIER_4' and version == 2 after the PATCH"
            - "${basis_hist} == 25000 and ${tier_hist} == 'TIER_3'"
            - "${basis_fcst} == 40000 and ${tier_fcst} == 'TIER_4' - Event.attendance_tier is unchanged by either plan"
            - "StaffingPlan.${plan_hist}.revision_number == 1 and StaffingPlan.${plan_fcst}.revision_number == 2"
            - "${hc_hist} == 47 - 25.0 x 1.5 x 1.25 = 46.8750 ceilinged, well above min_headcount 4"
            - "PositionSlot.${slot_hist}.slot_labor_cost_cents == 620400 (47 x 2200 x 360 / 60)"

      - name: peak_occupancy_adjacent_and_disjoint_windows_do_not_stack
        claim_type: correct_result
        grounds:
          - calculations.accessibility_peak_occupancy
          - state_machines.AccessibilityRequest.REQUESTED_to_CONFIRMED
          - state_machines.AccessibilityRequest.CONFIRMED_to_CANCELLED
          - errors[ERR_ACCESSIBILITY_CAPACITY_EXCEEDED]
        distinguishing_aspect: >-
          The window is half-open, so two adjacent full-capacity requests ([10:00,11:00) and
          [11:00,12:00), 3 units each against unit_count 3) both confirm rather than summing to 6 at
          the shared 11:00 boundary, a straddling request is refused because its elementary slice
          [10:30,11:00) would reach 4, and a genuinely disjoint window at 15:00 confirms freely -
          peak_committed_units is a per-slice maximum, never a running total.
        test_recipe:
          setup:
            - "Clock at 2026-09-20T09:00:00Z."
            - "One Event driven to PLANNED via an activated plan."
            - "One AVAILABLE WHEELCHAIR_ESCORT resource with unit_count 3."
            - "Four AccessibilityRequests created REQUESTED: A [10:00,11:00) 3 units, B [11:00,12:00) 3 units, C [10:30,11:30) 1 unit, D [15:00,16:00) 2 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T09:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Peak Occupancy Fixture", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T09:30:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /accessibility-resources"
              payload: { event_id: "${ev_id}", resource_type: "WHEELCHAIR_ESCORT", zone_code: "Z100", unit_count: 3 }
              as: GuestServicesSupervisor
              captures: { res_1: $.data.id }
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_1}", guest_reference: "G-A", window_start: "2026-09-20T10:00:00Z", window_end: "2026-09-20T11:00:00Z", units_requested: 3 }
              as: GuestServicesSupervisor
              captures: { ar_a: $.data.id }
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_1}", guest_reference: "G-B", window_start: "2026-09-20T11:00:00Z", window_end: "2026-09-20T12:00:00Z", units_requested: 3 }
              as: GuestServicesSupervisor
              captures: { ar_b: $.data.id }
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_1}", guest_reference: "G-C", window_start: "2026-09-20T10:30:00Z", window_end: "2026-09-20T11:30:00Z", units_requested: 1 }
              as: GuestServicesSupervisor
              captures: { ar_c: $.data.id }
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_1}", guest_reference: "G-D", window_start: "2026-09-20T15:00:00Z", window_end: "2026-09-20T16:00:00Z", units_requested: 2 }
              as: GuestServicesSupervisor
              captures: { ar_d: $.data.id }
          trigger:
            - call: "POST /accessibility-requests/${ar_a}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
            - call: "POST /accessibility-requests/${ar_b}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
            - call: "POST /accessibility-requests/${ar_c}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
              captures: { err_straddle: $.data.error_id }
            - call: "POST /accessibility-requests/${ar_a}/transition"
              payload: { target_status: "CANCELLED" }
              as: GuestServicesSupervisor
            - call: "POST /accessibility-requests/${ar_b}/transition"
              payload: { target_status: "CANCELLED" }
              as: GuestServicesSupervisor
            - call: "POST /accessibility-requests/${ar_c}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
            - call: "POST /accessibility-requests/${ar_d}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
          assert:
            - "A confirms (200) and AccessibilityResource.${res_1}.peak_committed_units == 3"
            - "B confirms (200) with peak_committed_units still 3 - the shared 11:00:00Z instant belongs only to B because A's window is [10:00,11:00)"
            - "${err_straddle} == 'ERR_ACCESSIBILITY_CAPACITY_EXCEEDED' with HTTP 409; the elementary slice [10:30,11:00) would have held 3 + 1 = 4 against unit_count 3"
            - "after the refusal AccessibilityRequest.${ar_c}.status == REQUESTED with confirmed_at null and peak_committed_units still 3"
            - "after both cancellations peak_committed_units == 0 - a CANCELLED row releases its units immediately"
            - "C then confirms and peak_committed_units == 1"
            - "D then confirms and peak_committed_units == 2 - the disjoint 15:00 window sets a new per-slice maximum of 2 rather than accumulating to 3"
            - "GET /accessibility-requests?resource_id=${res_1}&status=CONFIRMED returns total_count == 2"

      - name: satisfaction_summary_with_zero_responses_returns_nulls
        claim_type: correct_result
        grounds:
          - calculations.event_satisfaction_summary
          - endpoints[GET /events/{id}/satisfaction-summary]
          - endpoints[POST /satisfaction-responses]
        distinguishing_aspect: >-
          The empty case is not the zero case: with no responses the summary reports response_count 0
          with average_score and promoter_share_bp both null (never 0.00 / 0), and once three
          responses land the same read returns average 4.00 and promoter_share_bp 6667 with a
          zone_breakdown ordered by zone_code ASC.
        test_recipe:
          setup:
            - "Clock at 2026-09-20T22:00:00Z."
            - "One Event with no SatisfactionResponse rows and no GuestIssue rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T22:00:00Z" }
              as: GuestExperienceDirector
            - call: "POST /events"
              payload: { name: "Satisfaction Empty Fixture", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
          trigger:
            - call: "GET /events/${ev_id}/satisfaction-summary"
              as: GuestExperienceDirector
              captures: { n_empty: $.data.response_count, avg_empty: $.data.average_score, promoter_empty: $.data.promoter_share_bp }
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z1", score: 5 }
              as: GuestServicesSupervisor
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z1", score: 4, comment: "Quick help at the elevator" }
              as: GuestServicesSupervisor
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z2", score: 3 }
              as: GuestServicesSupervisor
            - call: "GET /events/${ev_id}/satisfaction-summary"
              as: GuestExperienceDirector
              captures: { n_full: $.data.response_count, avg_full: $.data.average_score, promoter_full: $.data.promoter_share_bp }
          assert:
            - "${n_empty} == 0 and ${avg_empty} is null and ${promoter_empty} is null - not 0.00 and not 0"
            - "the empty read also has zone_breakdown == [], resolved_issue_count == 0 and sla_breached_issue_count == 0"
            - "${n_full} == 3, ${avg_full} == 4.00 ((5+4+3)/3 quantized to two places) and ${promoter_full} == 6667 (2 of 3 scores >= 4, 20000/3 rounded HALF_UP)"
            - "zone_breakdown == [{zone_code Z1, response_count 2, average_score 4.50, promoter_share_bp 10000}, {zone_code Z2, response_count 1, average_score 3.00, promoter_share_bp 0}] in zone_code ASC order"
            - "GET /events/${ev_id}/satisfaction-responses?zone_code=Z1 returns total_count == 2"
            - "each response row has no id, created_at, updated_at or version key and carries submitted_by_user_id"

      - name: headcount_diverges_between_forecast_and_historical_variants
        claim_type: variant_divergence
        grounds:
          - calculations.position_slot_required_headcount
        excluded_because:
          difficulty_instance: "dual_variant_calc / headcount_variant_forecast_vs_historical"
          rationale: >-
            The §1.8 instance builds both plan variants on identical event and PositionType data and
            asserts the two required_headcount values and both cost aggregates, which is the whole
            Variant Divergence claim for this rule.

      - name: refund_ledger_reconciles_when_a_director_replaces_a_supervisor_amount
        claim_type: reconciliation
        grounds:
          - calculations.refund_authorized_amount
          - calculations.event_refund_budget_ledger
        excluded_because:
          difficulty_instance: "dual_variant_calc / refund_authority_supervisor_vs_director"
          rationale: >-
            The §1.8 instance switches the authority variant mid-issue and asserts the ledger moves
            by the delta only, which is the Reconciliation claim for the refund calculation.

      - name: overtime_boundary_at_exactly_480_worked_minutes
        claim_type: precision
        grounds:
          - calculations.assignment_worked_pay
        excluded_because:
          difficulty_instance: "boundary_precision_check / overtime_threshold_exact_480_worked_minutes"
          rationale: >-
            The §1.8 instance tests 479, 480 and 481 worked minutes and asserts the straight-time and
            1.5x components separately, covering the `threshold` algorithm's at/below/above rows.

      - name: plan_cost_rounds_each_slot_before_summing
        claim_type: precision
        grounds:
          - calculations.staffing_plan_projected_labor_cost
        excluded_because:
          difficulty_instance: "combinatorial_formula / plan_cost_round_per_slot_then_sum"
          rationale: >-
            The §1.8 instance builds two slots whose exact costs both end in .3333 and asserts the
            per-slot-then-sum result rather than the sum-then-round result, which is this rule's
            precision claim.

      - name: peak_occupancy_slices_are_half_open
        claim_type: correct_result
        grounds:
          - calculations.accessibility_peak_occupancy
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / accessibility_peak_units_half_open_slices"
          rationale: >-
            The §1.8 instance already asserts the elementary-slice decomposition and the
            `window_start <= b < window_end` membership test on three overlapping windows; the
            corner instance above deliberately probes only the adjacent and disjoint arrangements it
            does not cover.

      - name: rolling_window_and_season_scores_diverge_on_the_same_rows
        claim_type: variant_divergence
        grounds:
          - calculations.staff_member_reliability_score
        excluded_because:
          difficulty_instance: "dual_variant_calc / reliability_rolling_window_vs_season_to_date"
          rationale: >-
            The §1.8 instance asserts the documented divergence (81 rolling against 34 season on six
            rows) and that only the rolling variant gates PROBATION.

      - name: fill_rate_at_exactly_8000_bp_holds_the_ratio
        claim_type: correct_result
        grounds:
          - calculations.staffing_model_recommendation
        excluded_because:
          difficulty_instance: "boundary_precision_check / fill_rate_exactly_8000_bp_holds_the_ratio"
          rationale: >-
            The §1.8 instance sits exactly on the 8000 bp branch point and asserts that the
            strict `< 8000` test leaves the ratio on HOLD, covering the recommendation rule's only
            numeric boundary.

  # ===================================================================================
  # 4. From Table 4 (Validations) - §1.4 surface: 24 numbered rules across auth,
  #    validation, existence, concurrency, state and six business families
  # ===================================================================================
  - section: validations
    instances:

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority 1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: >-
          Priority 1 has three separate triggers and all three answer 401 ERR_UNAUTHENTICATED: no
          X-User-Role header at all, an X-User-Role that is not one of the four declared roles, and
          a missing X-User-ID on a mutating request - while a pure read with no X-User-ID still
          succeeds, because the X-User-ID requirement is scoped to mutations.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z. No other fixtures."
            - "Call 1 omits the X-User-Role header entirely; call 2 sends X-User-Role: VenueManager, which is not one of the four §1.7 roles; call 3 sends a valid role with an empty X-User-ID; call 4 is a GET with a valid role and no X-User-ID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: GuestExperienceDirector
          trigger:
            - call: "POST /events"
              payload: { name: "No Role Header", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 6000 }
              as: NONE_HEADER_OMITTED
              captures: { err_no_role: $.data.error_id }
            - call: "POST /events"
              payload: { name: "Unknown Role", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 6000 }
              as: VenueManager
              captures: { err_bad_role: $.data.error_id }
            - call: "POST /events"
              payload: { name: "No User Id", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              as_user_id: ""
              captures: { err_no_user: $.data.error_id }
            - call: "GET /events?limit=10&offset=0"
              as: GuestExperienceDirector
              captures: { read_total: $.data }
          assert:
            - "${err_no_role} == 'ERR_UNAUTHENTICATED' with HTTP 401 and response_type 'error'"
            - "${err_bad_role} == 'ERR_UNAUTHENTICATED' with HTTP 401 - an unrecognised role is an authentication failure, not a 403"
            - "${err_no_user} == 'ERR_UNAUTHENTICATED' with HTTP 401"
            - "the GET returns 200 with total_count == 0 - no Event was created by any of the three refused calls"
            - "every error body carries meta.api_request_id, meta.api_request_timestamp and data.message"

      - name: coordinator_on_event_lifecycle_returns_role_not_permitted
        claim_type: violation_to_error
        grounds:
          - validations[priority 2]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.GuestExperienceDirector.exclusive_operations
          - roles.StaffingCoordinator
        distinguishing_aspect: >-
          The endpoint's declared roles set is the whole test at priority 2: a StaffingCoordinator is
          refused on POST /events and POST /events/{id}/lifecycle, a GuestServicesSupervisor is
          refused on POST /position-types, and a StaffMember is refused on POST /guest-issues - each
          with 403 ERR_ROLE_NOT_PERMITTED and no state change on the target event.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One FORECAST Event created by the director."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: GuestExperienceDirector
            - call: "POST /events"
              payload: { name: "Role Gate Fixture", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "CANCELLED" }
              as: StaffingCoordinator
              captures: { err_lifecycle: $.data.error_id }
            - call: "POST /events"
              payload: { name: "Coordinator Event", event_date: "2026-09-21T00:00:00Z", doors_open_at: "2026-09-21T13:00:00Z", doors_close_at: "2026-09-21T21:00:00Z", expected_attendance: 6000 }
              as: StaffingCoordinator
              captures: { err_create_event: $.data.error_id }
            - call: "POST /position-types"
              payload: { code: "USHER", display_name: "Usher", base_hourly_rate_cents: 2200, attendance_ratio_per_1000: 1.5, min_headcount: 4, required_certifications: [] }
              as: GuestServicesSupervisor
              captures: { err_position_type: $.data.error_id }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "KIOSK", category: "LOST_FOUND", severity: "LOW", description: "Wallet at gate 2" }
              as: StaffMember
              captures: { err_issue: $.data.error_id }
          assert:
            - "all four calls return HTTP 403 with data.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "${err_lifecycle} == ${err_create_event} == ${err_position_type} == ${err_issue} == 'ERR_ROLE_NOT_PERMITTED'"
            - "Event.${ev_id}.status == FORECAST and version == 1"
            - "GET /position-types returns total_count == 0 and GET /guest-issues?event_id=${ev_id} returns total_count == 0"

      - name: interval_fields_out_of_order_return_invalid_time_window
        claim_type: violation_to_error
        grounds:
          - validations[priority 3]
          - validations[priority 4]
          - errors[ERR_INVALID_TIME_WINDOW]
          - errors[ERR_VALIDATION_FAILED]
        distinguishing_aspect: >-
          Priority 4 covers all four declared intervals and is strict, not inclusive: shift_end
          before shift_start, shift_end exactly equal to shift_start, expires_on before issued_on and
          doors_close_at before doors_open_at all return 422 ERR_INVALID_TIME_WINDOW - but a body that
          also breaks the priority 3 schema (required_headcount_override 0) reports
          ERR_VALIDATION_FAILED instead, because the schema rule is checked first.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One Event, one TICKET_TAKER PositionType, one DRAFT plan, one StaffMember."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Interval Fixture", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ada Usher", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-20T20:00:00Z", shift_end: "2026-09-20T14:00:00Z" }
              as: StaffingCoordinator
              captures: { err_reversed: $.data.error_id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-20T14:00:00Z", shift_end: "2026-09-20T14:00:00Z" }
              as: StaffingCoordinator
              captures: { err_equal: $.data.error_id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${m1}", cert_type: "CODE_OF_CONDUCT", issued_on: "2027-01-01T00:00:00Z", expires_on: "2026-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { err_cert: $.data.error_id }
            - call: "POST /events"
              payload: { name: "Backwards Doors", event_date: "2026-09-21T00:00:00Z", doors_open_at: "2026-09-21T21:00:00Z", doors_close_at: "2026-09-21T13:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { err_doors: $.data.error_id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-20T20:00:00Z", shift_end: "2026-09-20T14:00:00Z", required_headcount_override: 0 }
              as: StaffingCoordinator
              captures: { err_both: $.data.error_id }
          assert:
            - "${err_reversed} == 'ERR_INVALID_TIME_WINDOW' with HTTP 422"
            - "${err_equal} == 'ERR_INVALID_TIME_WINDOW' - the ordering is strict, a zero-length shift is not accepted"
            - "${err_cert} == 'ERR_INVALID_TIME_WINDOW' and ${err_doors} == 'ERR_INVALID_TIME_WINDOW'"
            - "${err_both} == 'ERR_VALIDATION_FAILED' - priority 3 outranks priority 4 when a body breaks both"
            - "GET /position-slots?plan_id=${plan_id} returns total_count == 0 and StaffingPlan.${plan_id} still has base_labor_cost_cents 0"
            - "GET /certifications?staff_member_id=${m1} returns total_count == 0"

      - name: path_not_found_precedes_body_fk_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority 5]
          - validations[priority 6]
          - errors[ERR_GUEST_ISSUE_NOT_FOUND]
          - errors[ERR_STAFF_MEMBER_NOT_FOUND]
          - errors[ERR_STAFFING_PLAN_NOT_FOUND]
        distinguishing_aspect: >-
          When both the path id and a body FK are absent the path wins (priority 5 before 6), so
          assigning an absent member to an absent issue reports ERR_GUEST_ISSUE_NOT_FOUND, and once
          the path resolves the same call reports ERR_STAFF_MEMBER_NOT_FOUND - while inside priority 6
          the order is the §1.1 field declaration order, so a slot with two bad FKs reports
          ERR_STAFFING_PLAN_NOT_FOUND rather than ERR_POSITION_TYPE_NOT_FOUND.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One IN_PROGRESS Event with one OPEN GuestIssue; the absent-row id literal is 00000000-0000-0000-0000-0000000000ff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Not Found Order Fixture", event_date: "2026-09-01T00:00:00Z", doors_open_at: "2026-09-01T08:00:00Z", doors_close_at: "2026-09-01T21:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "KIOSK", category: "LOST_FOUND", severity: "LOW", description: "Keys at gate 3" }
              as: GuestServicesSupervisor
              captures: { gi_1: $.data.id }
          trigger:
            - call: "POST /guest-issues/00000000-0000-0000-0000-0000000000ff/assign"
              payload: { staff_member_id: "00000000-0000-0000-0000-0000000000ff" }
              as: GuestServicesSupervisor
              captures: { err_both_absent: $.data.error_id }
            - call: "POST /guest-issues/${gi_1}/assign"
              payload: { staff_member_id: "00000000-0000-0000-0000-0000000000ff" }
              as: GuestServicesSupervisor
              captures: { err_body_only: $.data.error_id }
            - call: "POST /position-slots"
              payload: { plan_id: "00000000-0000-0000-0000-0000000000ff", position_type_id: "00000000-0000-0000-0000-0000000000ff", zone_code: "Z100", shift_start: "2026-09-01T14:00:00Z", shift_end: "2026-09-01T20:00:00Z" }
              as: StaffingCoordinator
              captures: { err_two_fks: $.data.error_id }
          assert:
            - "${err_both_absent} == 'ERR_GUEST_ISSUE_NOT_FOUND' with HTTP 404 - the path segment is validated before the body"
            - "${err_body_only} == 'ERR_STAFF_MEMBER_NOT_FOUND' with HTTP 404"
            - "${err_two_fks} == 'ERR_STAFFING_PLAN_NOT_FOUND' - plan_id is declared before position_type_id on PositionSlot in §1.1"
            - "GuestIssue.${gi_1}.status == OPEN and assigned_staff_member_id is null after all three refusals"

      - name: staff_member_acting_on_another_members_row_returns_not_resource_owner
        claim_type: violation_to_error
        grounds:
          - validations[priority 7]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.StaffMember.identity
        distinguishing_aspect: >-
          Ownership is checked against X-User-ID only for the StaffMember role, and it covers all
          three declared surfaces: bidding for another member, withdrawing another member's bid and
          checking in on another member's assignment all return 403 ERR_NOT_RESOURCE_OWNER - yet the
          identical bid filed by the StaffingCoordinator on m1's behalf succeeds, because the
          coordinator's identity is opaque.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T10:00:00Z."
            - "One PLANNED Event with an ACTIVE plan and a TICKET_TAKER slot of required_headcount_override 2."
            - "Two ACTIVE members m1 and m2; m1 owns one SUBMITTED bid and one SCHEDULED assignment on that slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T10:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Ownership Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T19:00:00Z", shift_end: "2026-09-12T23:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ada Owner", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ben Intruder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2021-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m2: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /shift-bids"
              payload: { staff_member_id: "${m1}", position_slot_id: "${slot_id}" }
              as: StaffMember
              as_user_id: "${m1}"
              captures: { bid_1: $.data.id }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m1}" }
              as: StaffingCoordinator
              captures: { asg_1: $.data.id }
          trigger:
            - call: "POST /shift-bids"
              payload: { staff_member_id: "${m1}", position_slot_id: "${slot_id}" }
              as: StaffMember
              as_user_id: "${m2}"
              captures: { err_bid_for_other: $.data.error_id }
            - call: "POST /shift-bids/${bid_1}/withdraw"
              as: StaffMember
              as_user_id: "${m2}"
              captures: { err_withdraw_other: $.data.error_id }
            - call: "POST /staff-assignments/${asg_1}/attendance"
              payload: { action: "CHECK_IN" }
              as: StaffMember
              as_user_id: "${m2}"
              captures: { err_checkin_other: $.data.error_id }
          assert:
            - "${err_bid_for_other} == 'ERR_NOT_RESOURCE_OWNER' with HTTP 403 - and note it is NOT ERR_DUPLICATE_BID, because priority 7 runs long before priority 13"
            - "${err_withdraw_other} == 'ERR_NOT_RESOURCE_OWNER' with HTTP 403"
            - "${err_checkin_other} == 'ERR_NOT_RESOURCE_OWNER' with HTTP 403"
            - "ShiftBid.${bid_1}.status == SUBMITTED and staff_member_id == ${m1}"
            - "StaffAssignment.${asg_1}.attendance_status == SCHEDULED and check_in_at is null"
            - "GET /shift-bids?position_slot_id=${slot_id} returns total_count == 1"

      - name: refund_requester_deciding_own_ask_returns_segregation_of_duties
        claim_type: violation_to_error
        grounds:
          - validations[priority 8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - complexity_profile.role_model[segregation_of_duties]
          - endpoints[POST /guest-issues/{id}/refund-request]
          - endpoints[POST /guest-issues/{id}/refund-decision]
        distinguishing_aspect: >-
          Priority 8 keys on X-User-ID, not on role: the supervisor 'sup-1' who filed the ask is
          refused with 403 ERR_SEGREGATION_OF_DUTIES on the decision even though POST
          /guest-issues/{id}/refund-decision lists their role, and the identical call from 'sup-2' -
          same role, different identity - approves 2000 cents and moves the event ledger.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T19:00:00Z."
            - "One IN_PROGRESS Event with the default refund_budget_total_cents of 100000."
            - "One ACTIVE member holding a VALID CODE_OF_CONDUCT certification."
            - "One MEDIUM / OTHER GuestIssue reported by 'sup-9', assigned so it is IN_PROGRESS, with a 2000-cent refund ask filed by 'sup-1'."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Segregation Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version, budget_total: $.data.refund_budget_total_cents }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Ida Responder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${m1}", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { cert_1: $.data.id }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "MEDIUM", description: "Merchandise mix-up" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
              captures: { gi_1: $.data.id }
            - call: "POST /guest-issues/${gi_1}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
            - call: "POST /guest-issues/${gi_1}/refund-request"
              payload: { refund_requested_cents: 2000 }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { status_after_ask: $.data.refund_status }
          trigger:
            - call: "POST /guest-issues/${gi_1}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { err_self: $.data.error_id }
            - call: "POST /guest-issues/${gi_1}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestServicesSupervisor
              as_user_id: "sup-2"
          assert:
            - "${budget_total} == 100000 - the declared default applies when the field is omitted"
            - "${status_after_ask} == 'PENDING' and GuestIssue.${gi_1}.refund_requested_by_user_id == 'sup-1'; the ask alone moved no money"
            - "${err_self} == 'ERR_SEGREGATION_OF_DUTIES' with HTTP 403"
            - "immediately after the refusal GuestIssue.${gi_1}.refund_status is still PENDING, refund_approved_cents == 0, refund_decided_by_user_id is null and Event.${ev_id}.refund_budget_remaining_cents == 100000"
            - "the 'sup-2' call returns 200 with refund_status == 'APPROVED' and refund_approved_cents == 2000 (min of requested 2000, the 5000 supervisor cap with 0 bp MEDIUM uplift, and 100000 available)"
            - "GuestIssue.${gi_1}.refund_decided_by_user_id == 'sup-2' and status is still IN_PROGRESS - an in-cap supervisor approval does not need authorization"
            - "Event.${ev_id}.refund_approved_total_cents == 2000 and refund_budget_remaining_cents == 98000"

      - name: role_denial_precedes_validation_failure
        claim_type: priority_ordering
        grounds:
          - validations[priority 1]
          - validations[priority 2]
          - validations[priority 3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_VALIDATION_FAILED]
        distinguishing_aspect: >-
          The same malformed body produces three different errors depending on who sends it: with no
          role header it is 401 ERR_UNAUTHENTICATED, from the wrong role it is 403
          ERR_ROLE_NOT_PERMITTED, and only from the director does the schema rule get to speak and
          return 422 ERR_VALIDATION_FAILED - so authorisation is never leaked through a schema
          message.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z. No fixtures; every call carries the same invalid body (expected_attendance -5)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: GuestExperienceDirector
          trigger:
            - call: "POST /events"
              payload: { name: "Bad Body", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: -5 }
              as: NONE_HEADER_OMITTED
              captures: { err_p1: $.data.error_id }
            - call: "POST /events"
              payload: { name: "Bad Body", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: -5 }
              as: StaffingCoordinator
              captures: { err_p2: $.data.error_id }
            - call: "POST /events"
              payload: { name: "Bad Body", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: -5 }
              as: GuestExperienceDirector
              captures: { err_p3: $.data.error_id }
            - call: "GET /events?limit=200&offset=0"
              as: GuestExperienceDirector
              captures: { err_pagination: $.data.error_id }
            - call: "GET /events?limit=10&offset=-1"
              as: GuestExperienceDirector
              captures: { err_offset: $.data.error_id }
          assert:
            - "${err_p1} == 'ERR_UNAUTHENTICATED' with HTTP 401"
            - "${err_p2} == 'ERR_ROLE_NOT_PERMITTED' with HTTP 403 - not the 422 the body deserves"
            - "${err_p3} == 'ERR_VALIDATION_FAILED' with HTTP 422"
            - "${err_pagination} == 'ERR_VALIDATION_FAILED' - limit 200 is outside the declared 1..100 range"
            - "${err_offset} == 'ERR_VALIDATION_FAILED' - offset must be >= 0"
            - "no Event exists: a subsequent GET /events?limit=10&offset=0 returns total_count == 0"

      - name: relocation_zone_not_staffed_rejects_the_resolution
        claim_type: violation_to_error
        grounds:
          - validations[priority 20]
          - validations[priority 21]
          - validations[priority 22]
          - errors[ERR_RELOCATION_ZONE_UNSTAFFED]
          - errors[ERR_RESOLUTION_TYPE_MISMATCH]
          - errors[ERR_REFUND_STATE_INVALID]
          - state_machines.GuestIssue.IN_PROGRESS_to_RESOLVED
        distinguishing_aspect: >-
          A guest may only be moved into a zone the event actually staffs, and the three business
          referential/fiscal rules fire in their declared order on the same issue: EJECTION with a
          bogus zone reports ERR_RESOLUTION_TYPE_MISMATCH (20 before 21), SEAT_RELOCATION into the
          unstaffed 'Z999' reports ERR_RELOCATION_ZONE_UNSTAFFED, REFUND with refund_status NONE
          reports ERR_REFUND_STATE_INVALID (22), and only 'Z100' - the zone of the LOCKED plan's live
          slot - resolves the issue.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T19:00:00Z."
            - "One IN_PROGRESS Event whose LOCKED plan carries exactly one non-CLOSED slot, in zone Z100."
            - "One ACTIVE member with a VALID CODE_OF_CONDUCT certification."
            - "One MEDIUM / SEAT_RELOCATION GuestIssue, assigned so it is IN_PROGRESS, with no refund ask filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Relocation Zone Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Ida Responder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${m1}", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { cert_1: $.data.id }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "IN_PERSON", category: "SEAT_RELOCATION", severity: "MEDIUM", description: "Obstructed view in 114", seat_reference: "114-R-8" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { gi_1: $.data.id }
            - call: "POST /guest-issues/${gi_1}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /guest-issues/${gi_1}/resolve"
              payload: { resolution_type: "EJECTION", relocation_zone_code: "Z999" }
              as: GuestServicesSupervisor
              captures: { err_mismatch: $.data.error_id }
            - call: "POST /guest-issues/${gi_1}/resolve"
              payload: { resolution_type: "SEAT_RELOCATION", relocation_zone_code: "Z999" }
              as: GuestServicesSupervisor
              captures: { err_zone: $.data.error_id }
            - call: "POST /guest-issues/${gi_1}/resolve"
              payload: { resolution_type: "REFUND" }
              as: GuestServicesSupervisor
              captures: { err_refund_state: $.data.error_id }
            - call: "POST /guest-issues/${gi_1}/resolve"
              payload: { resolution_type: "SEAT_RELOCATION", relocation_zone_code: "Z100" }
              as: GuestServicesSupervisor
          assert:
            - "${err_mismatch} == 'ERR_RESOLUTION_TYPE_MISMATCH' with HTTP 409 - EJECTION is not in SEAT_RELOCATION's permitted set, and priority 20 speaks before priority 21 even though the zone is also bogus"
            - "${err_zone} == 'ERR_RELOCATION_ZONE_UNSTAFFED' with HTTP 409"
            - "${err_refund_state} == 'ERR_REFUND_STATE_INVALID' with HTTP 409 - refund_status is NONE, so a REFUND resolution is refused at priority 22"
            - "after all three refusals GuestIssue.${gi_1}.status == IN_PROGRESS with resolution_type, relocation_zone_code and resolved_at all null"
            - "the fourth call returns 200 with status RESOLVED, resolution_type 'SEAT_RELOCATION', relocation_zone_code 'Z100' and resolved_at '2026-09-12T19:00:00Z'"
            - "PositionSlot.${slot_id}.zone_code == 'Z100' and status != CLOSED - it is that live slot that made the zone acceptable"

      - name: refund_budget_exhausted_rejects_the_next_approval
        claim_type: violation_to_error
        grounds:
          - validations[priority 23]
          - errors[ERR_REFUND_BUDGET_EXHAUSTED]
          - calculations.refund_authorized_amount
          - calculations.event_refund_budget_ledger
        distinguishing_aspect: >-
          Priority 23 guards the pot before the amount is even computed: with refund_budget_total_cents
          3000 fully consumed by the first issue, a second 1000-cent ask is refused with
          ERR_REFUND_BUDGET_EXHAUSTED rather than being partially approved down to 0 - and the ledger
          invariant remaining + approved_total == total holds at 0 + 3000 == 3000 throughout.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T19:00:00Z."
            - "One IN_PROGRESS Event with refund_budget_total_cents 3000."
            - "One ACTIVE member with a VALID CODE_OF_CONDUCT certification, holding both issues."
            - "Issue A (MEDIUM / OTHER, reported by 'sup-9') is IN_PROGRESS with a 3000-cent ask filed by 'sup-1'; issue B (MEDIUM / OTHER, reported by 'sup-9') is IN_PROGRESS with a 1000-cent ask filed by 'sup-1'."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Budget Exhaustion Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000, refund_budget_total_cents: 3000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version, remaining_at_create: $.data.refund_budget_remaining_cents }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Ida Responder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${m1}", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { cert_1: $.data.id }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "MEDIUM", description: "Issue A" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
              captures: { gi_a: $.data.id }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "MEDIUM", description: "Issue B" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
              captures: { gi_b: $.data.id }
            - call: "POST /guest-issues/${gi_a}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
            - call: "POST /guest-issues/${gi_b}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
            - call: "POST /guest-issues/${gi_a}/refund-request"
              payload: { refund_requested_cents: 3000 }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
            - call: "POST /guest-issues/${gi_b}/refund-request"
              payload: { refund_requested_cents: 1000 }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { remaining_after_asks: $.data.refund_status }
          trigger:
            - call: "POST /guest-issues/${gi_a}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestExperienceDirector
              as_user_id: "dir-1"
              captures: { a_status: $.data.refund_status, a_approved: $.data.refund_approved_cents }
            - call: "POST /guest-issues/${gi_b}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestExperienceDirector
              as_user_id: "dir-1"
              captures: { err_exhausted: $.data.error_id }
          assert:
            - "${remaining_at_create} == 3000 and ${remaining_after_asks} == 'PENDING' - filing asks moves no money"
            - "${a_status} == 'APPROVED' and ${a_approved} == 3000 - min(requested 3000, director cap 50000 with 0 bp MEDIUM uplift, available 3000)"
            - "Event.${ev_id}.refund_approved_total_cents == 3000 and refund_budget_remaining_cents == 0"
            - "${err_exhausted} == 'ERR_REFUND_BUDGET_EXHAUSTED' with HTTP 409 - available is 0 + 0, which is not > 0"
            - "GuestIssue.${gi_b}.refund_status is still PENDING, refund_approved_cents == 0 and refund_decided_by_user_id is null"
            - "the ledger invariant holds: refund_budget_remaining_cents (0) + refund_approved_total_cents (3000) == refund_budget_total_cents (3000)"

      - name: all_gates_satisfied_assignment_creation_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 11]
          - validations[priority 12]
          - validations[priority 13]
          - validations[priority 14]
          - validations[priority 17]
          - endpoints[POST /staff-assignments]
          - state_machines.PositionSlot.OPEN_to_PARTIALLY_FILLED
        distinguishing_aspect: >-
          The complement of every refusal test: with the event PLANNED, the member ACTIVE and
          holding the VALID ELEVATOR_OPERATION credential the slot's PositionType demands, no
          duplicate row, no shift within the 30-minute rest buffer and filled_headcount 0 below a
          required_headcount of 2, POST /staff-assignments answers 201 and the derived slot status
          moves OPEN -> PARTIALLY_FILLED while the plan's frozen cost aggregates do not budge.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T10:00:00Z."
            - "One PLANNED Event (expected_attendance 6000) whose ACTIVE plan carries one ELEVATOR_OPERATOR slot (2400 cents/h, required_certifications [ELEVATOR_OPERATION], required_headcount_override 2, 18:00Z -> 22:05Z, cost 19600)."
