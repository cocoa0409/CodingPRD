scenario: |
  2247. Freight Classification & Density-Based Reclassification (less-than-truckload carrier pricing):
  commodity classification assignment by density, stowability, handling and liability characteristics,
  shipper bill of lading class declaration versus inspection findings, dimensioner and scale capture at
  terminals with automated reweigh and reclass events, correction notice issuance with supporting evidence
  and dispute windows, class-based versus density-based rate program migration and customer impact modeling,
  negotiated exception classes and freight-all-kinds arrangements, disputed reclass credit issuance and
  repeat-offender education, classification standard updates and repricing of contracts
domain_name: ltl-freight-classification
api_prefix: /ltl

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection under /ltl/<collection>; parentage is expressed
  # exclusively through FK fields on the child, never through nested URL paths.

  state_machine_shape: parallel
  # Shipment carries two independent state dimensions (class_status x billing_status) that
  # advance on unrelated triggers; Customer likewise carries (billing_posture x education_status).
  # Dispute/CorrectionNotice add a supplement cycle, and CorrectionNotice resolution is a
  # three-way branch with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Shipment -> ShipmentLine, CorrectionNotice -> Dispute
    - many_to_many         # ExceptionAgreement junctions Customer x CommodityProfile
    - self_referential     # TariffVersion.superseded_by_tariff_version_id, CorrectionNotice.supersedes_notice_id
    - cross_aggregate      # CaptureEvent (terminal aggregate) writes ShipmentLine (billing aggregate)

  role_model: segregation_of_duties
  # The FreightInspector who records a finding may not accept it; the ClassificationAuditor who
  # issued a notice may not review the dispute against it. Enforced on X-User-ID.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Terminal identifier code used on the bill of lading.
        constraints: unique across Terminal; 3-10 characters
      - name: name
        type: string
        source: input
        description: Terminal display name.
      - name: calibration_interval_captures
        type: integer
        source: input
        description: Number of capture events a device may record before it must be recalibrated.
        default: 250
        constraints: ">= 1"
      - name: captures_since_calibration
        type: integer
        source: computed
        description: Count of CaptureEvent rows whose terminal_id is this terminal, incremented by 1 on every accepted capture.
        default: 0
      - name: dimensioner_status
        type: enum
        source: computed
        description: >-
          CALIBRATED while captures_since_calibration < calibration_interval_captures;
          OUT_OF_CALIBRATION once captures_since_calibration >= calibration_interval_captures.
        default: CALIBRATED
        constraints: one of {CALIBRATED, OUT_OF_CALIBRATION}
      - name: last_capture_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the most recent CaptureEvent at this terminal; null before the first capture.

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: account_code
        type: string
        source: input
        description: Shipper account code.
        constraints: unique across Customer
      - name: name
        type: string
        source: input
        description: Shipper legal name.
      - name: billing_posture
        type: enum
        source: system
        description: Credit posture dimension; gates shipment creation and correction-notice issuance.
        default: OPEN
        constraints: one of {OPEN, CREDIT_HOLD, CLOSED}
      - name: education_status
        type: enum
        source: system
        description: Repeat-offender education dimension; evolves independently of billing_posture.
        default: NONE
        constraints: one of {NONE, REQUIRED, COMPLETED}
      - name: education_strike_interval
        type: integer
        source: input
        description: Number of additional upheld-notice strikes that re-triggers mandatory classification education.
        default: 3
        constraints: ">= 1"
      - name: education_threshold_strikes
        type: integer
        source: system
        description: Strike count at which education_status flips to REQUIRED; initialised to education_strike_interval at creation and reset to offender_strike_count + education_strike_interval when education completes.
      - name: education_required_at
        type: datetime
        source: system
        description: Logical-clock timestamp at which education_status last became REQUIRED; null when never required.
      - name: offender_strike_count
        type: integer
        source: computed
        description: >-
          Conserved count quantity. Equals count(CorrectionNotice n where n.shipment_id references a Shipment
          with this customer_id AND n.status IN {ISSUED, DISPUTED, EVIDENCE_REQUESTED, UPHELD, PARTIALLY_OVERTURNED}).
        default: 0
      - name: liability_index_rolling
        type: number
        source: computed
        description: Decay-weighted 90-day reclassification liability index (calculations.shipper_liability_index, variant ROLLING_WINDOW).
        default: 0.00
        constraints: 2 decimal places
      - name: liability_index_lifetime
        type: number
        source: computed
        description: Undecayed all-time reclassification liability index (calculations.shipper_liability_index, variant LIFETIME_CUMULATIVE).
        default: 0.00
        constraints: 2 decimal places
      - name: offender_tier
        type: enum
        source: computed
        description: Tier derived from liability_index_rolling only (never from liability_index_lifetime).
        default: TIER_0
        constraints: one of {TIER_0, TIER_1, TIER_2, TIER_3}
      - name: dispute_window_days
        type: integer
        source: computed
        description: "Dispute window length granted on the next notice issuance: 30 - 5 * tier_ordinal(offender_tier)."
        default: 30
      - name: active_program_type
        type: enum
        source: system
        description: program_type of the RateProgram currently in status ACTIVE for this customer; null when none.
        constraints: one of {CLASS_BASED, DENSITY_BASED, FAK} or null

  - name: TariffVersion
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Classification standard release code (e.g. NMFC-2026A).
        constraints: unique across TariffVersion
      - name: effective_at
        type: datetime
        source: input
        description: Instant from which this standard governs shipments whose pickup_at is at or after it.
      - name: status
        type: enum
        source: system
        description: Publication lifecycle of the classification standard.
        default: DRAFT
        constraints: one of {DRAFT, PUBLISHED, SUPERSEDED}
      - name: density_breaks
        type: array
        source: input
        description: >-
          Ordered density bracket table; each element is { min_density_pcf: number, class_code: number }.
          Lookup scans the array in declared order and returns the class_code of the first element whose
          min_density_pcf is <= the line density (inclusive lower bound).
        constraints: non-empty; strictly descending by min_density_pcf; final element must have min_density_pcf == 0; every class_code in CLASS_CODES
      - name: superseded_by_tariff_version_id
        type: string
        source: system
        description: FK -> TariffVersion.id; set on this row when a newer version is published over it. Null while this row is the newest PUBLISHED version.
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the publish transition; null while DRAFT.

  - name: CommodityProfile
    parent: null
    common_fields: true
    fields:
      - name: tariff_version_id
        type: string
        source: input
        description: FK -> TariffVersion.id; the classification standard this profile belongs to.
      - name: nmfc_item
        type: string
        source: input
        description: Classification item number.
      - name: description
        type: string
        source: input
        description: Commodity description as printed on the bill of lading.
      - name: classification_basis
        type: enum
        source: input
        description: DENSITY_BASED profiles derive class from density; FIXED_CLASS profiles always rate at fixed_class_code.
        constraints: one of {DENSITY_BASED, FIXED_CLASS}
      - name: fixed_class_code
        type: number
        source: input
        description: Class code used when classification_basis == FIXED_CLASS; must be null otherwise.
        constraints: member of CLASS_CODES when present
      - name: handling_code
        type: enum
        source: input
        description: Handling characteristic contributing a class floor.
        default: STANDARD
        constraints: one of {STANDARD, FRAGILE, HAZMAT, OVERLENGTH}
      - name: stowability_code
        type: enum
        source: input
        description: Stowability characteristic contributing a class floor.
        default: STACKABLE
        constraints: one of {STACKABLE, NON_STACKABLE, HAZ_SEGREGATED}
      - name: liability_code
        type: enum
        source: input
        description: Liability characteristic contributing a class floor.
        default: LOW
        constraints: one of {LOW, MEDIUM, HIGH}
      - name: min_class_floor
        type: number
        source: computed
        description: max(HANDLING_FLOOR[handling_code], STOWABILITY_FLOOR[stowability_code], LIABILITY_FLOOR[liability_code]); 0 means no floor.
        default: 0

  - name: RateProgram
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; the shipper this pricing program belongs to.
      - name: program_type
        type: enum
        source: input
        description: Rating basis of the program.
        constraints: one of {CLASS_BASED, DENSITY_BASED, FAK}
      - name: status
        type: enum
        source: system
        description: Migration lifecycle of the program.
        default: MODELING
        constraints: one of {MODELING, APPROVED, ACTIVE, RETIRED}
      - name: base_rate_per_cwt_cents
        type: integer
        source: input
        description: Base rate in cents per hundredweight before class, weight-break and discount factors.
        constraints: ">= 1"
      - name: discount_pct
        type: number
        source: input
        description: Contract discount applied as (1 - discount_pct).
        constraints: 0 <= discount_pct <= 0.75, 4 decimal places
      - name: min_charge_cents
        type: integer
        source: input
        description: Absolute minimum charge per shipment.
        constraints: ">= 0"
      - name: fak_class_code
        type: number
        source: input
        description: Freight-all-kinds class applied to every line; required when program_type == FAK, must be null otherwise.
        constraints: member of CLASS_CODES when present
      - name: pinned_tariff_version_id
        type: string
        source: system
        description: FK -> TariffVersion.id; the classification standard pinned at the APPROVED transition and re-pinned on repricing commit.
      - name: effective_from
        type: datetime
        source: system
        description: Logical-clock timestamp of the ACTIVE transition; null before activation.
      - name: effective_to
        type: datetime
        source: system
        description: Logical-clock timestamp of the RETIRED transition; null while not retired.
      - name: baseline_revenue_cents
        type: integer
        source: computed
        description: Sum of Shipment.assessed_total_cents over the modelled shipment set (calculations.migration_impact_model).
        default: 0
      - name: modeled_annual_revenue_cents
        type: integer
        source: computed
        description: Revenue the modelled shipment set would have produced under this program's own parameters.
        default: 0
      - name: modeled_delta_pct
        type: number
        source: computed
        description: (modeled_annual_revenue_cents - baseline_revenue_cents) / baseline_revenue_cents, 4 decimal places; exactly 0.0000 when baseline_revenue_cents == 0.
        default: 0.0000
      - name: modeled_shipment_count
        type: integer
        source: computed
        description: Cardinality of the modelled shipment set.
        default: 0
      - name: migration_recommendation
        type: enum
        source: computed
        description: MIGRATE_DENSITY_BASED when modeled_delta_pct >= 0.05; HOLD_CLASS_BASED when modeled_delta_pct <= -0.05; NEGOTIATE_FAK otherwise. Null while status == MODELING and never approved.
        constraints: one of {HOLD_CLASS_BASED, MIGRATE_DENSITY_BASED, NEGOTIATE_FAK} or null

  - name: ExceptionAgreement
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; shipper party to the negotiated exception.
      - name: commodity_profile_id
        type: string
        source: input
        description: FK -> CommodityProfile.id; commodity the exception class covers.
      - name: agreement_type
        type: enum
        source: input
        description: EXCEPTION_CLASS narrows one commodity; FAK collapses the commodity into a freight-all-kinds class.
        constraints: one of {EXCEPTION_CLASS, FAK}
      - name: agreed_class_code
        type: number
        source: input
        description: Negotiated class code applied to covered lines before the commodity class floor is re-applied.
        constraints: member of CLASS_CODES
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the coverage interval.
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive end of the coverage interval; must be strictly after effective_from.
      - name: status
        type: enum
        source: system
        description: PENDING agreements already occupy their interval for overlap purposes; only ACTIVE agreements affect classification.
        default: PENDING
        constraints: one of {PENDING, ACTIVE}
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the PricingAnalyst that approved the agreement; null while PENDING.
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock timestamp of approval; null while PENDING.

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK -> Customer.id; the shipper whose bill of lading this is.
      - name: origin_terminal_id
        type: string
        source: input
        description: FK -> Terminal.id; terminal where the freight is tendered and measured.
      - name: rate_program_id
        type: string
        source: system
        description: "FK -> RateProgram.id; snapshot of the customer's RateProgram in status ACTIVE at creation time (selector: status == ACTIVE for customer_id; exactly one exists by construction)."
      - name: tariff_version_id
        type: string
        source: system
        description: >-
          FK -> TariffVersion.id; selected at creation from candidates {status IN (PUBLISHED, SUPERSEDED)
          AND effective_at <= pickup_at}, ranked effective_at DESC then created_at DESC, first row wins.
      - name: pro_number
        type: string
        source: input
        description: Carrier progressive number on the bill of lading.
        constraints: unique across Shipment
      - name: pickup_at
        type: datetime
        source: input
        description: Pickup instant; selects the governing TariffVersion and tests ExceptionAgreement coverage.
      - name: bol_declared_total_weight_lb
        type: integer
        source: input
        description: Total weight the shipper declared on the bill of lading header.
        constraints: ">= 1"
      - name: class_status
        type: enum
        source: system
        description: Classification dimension; advances on capture, inspection, notice and dispute events.
        default: DECLARED
        constraints: one of {DECLARED, CAPTURED, UNDER_INSPECTION, RECLASS_PENDING, RECLASSED, CLASS_CONFIRMED}
      - name: billing_status
        type: enum
        source: system
        description: Billing dimension; advances independently of class_status.
        default: UNBILLED
        constraints: one of {UNBILLED, BILLED, REBILLED, CREDITED, CLOSED}
      - name: line_count
        type: integer
        source: computed
        description: Count of ShipmentLine rows whose shipment_id is this shipment.
        default: 0
      - name: declared_total_weight_lb
        type: integer
        source: computed
        description: Sum of ShipmentLine.declared_weight_lb over all lines of this shipment.
        default: 0
      - name: measured_total_weight_lb
        type: integer
        source: computed
        description: measured_total_weight_lb of the CaptureEvent with the highest capture_sequence for this shipment; null before the first capture.
      - name: weight_variance_pct
        type: number
        source: computed
        description: round_half_up(abs(measured_total_weight_lb - declared_total_weight_lb) / declared_total_weight_lb * 100, 2); null before the first capture.
        constraints: 2 decimal places
      - name: reweigh_required
        type: boolean
        source: computed
        description: True when weight_variance_pct >= 2.00 AND abs(measured_total_weight_lb - declared_total_weight_lb) >= 10.
        default: false
      - name: declared_vs_found_class_delta_count
        type: integer
        source: computed
        description: Count of ShipmentLine rows of this shipment where found_class_code is non-null and found_class_code != declared_class_code.
        default: 0
      - name: original_charge_cents
        type: integer
        source: computed
        description: Shipment charge on the declared basis (calculations.shipment_charge, mode DECLARED); exactly 0 while line_count == 0.
        default: 0
      - name: assessed_total_cents
        type: integer
        source: computed
        description: >-
          Conserved money quantity. Equals original_charge_cents
          + sum over CorrectionNotice n of this shipment with n.status IN {ISSUED, DISPUTED, EVIDENCE_REQUESTED,
          UPHELD, PARTIALLY_OVERTURNED, OVERTURNED} of (n.applied_delta_cents + n.inspection_fee_cents)
          - sum over CreditMemo c of those notices of (c.freight_credit_cents + c.fee_credit_cents).
        default: 0
      - name: open_notice_count
        type: integer
        source: computed
        description: Count of CorrectionNotice rows of this shipment with status IN {DRAFT, ISSUED, DISPUTED, EVIDENCE_REQUESTED}.
        default: 0
      - name: billed_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the UNBILLED -> BILLED transition; null while UNBILLED.

  - name: ShipmentLine
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: FK -> Shipment.id; the bill of lading this line belongs to.
      - name: line_no
        type: integer
        source: input
        description: Line ordinal on the bill of lading; the only ordering key used for line iteration.
        constraints: ">= 1; unique within shipment_id"
      - name: commodity_profile_id
        type: string
        source: input
        description: FK -> CommodityProfile.id; the commodity classification profile declared for this line.
      - name: declared_class_code
        type: number
        source: input
        description: Class the shipper declared on the bill of lading for this line.
        constraints: member of CLASS_CODES
      - name: declared_weight_lb
        type: integer
        source: input
        description: Weight the shipper declared for this line.
        constraints: ">= 1"
      - name: pieces
        type: integer
        source: input
        description: Handling-unit count for this line.
        constraints: ">= 1"
      - name: declared_length_in
        type: number
        source: input
        description: Declared length of one handling unit, inches.
        constraints: "> 0; 1 decimal place"
      - name: declared_width_in
        type: number
        source: input
        description: Declared width of one handling unit, inches.
        constraints: "> 0; 1 decimal place"
      - name: declared_height_in
        type: number
        source: input
        description: Declared height of one handling unit, inches.
        constraints: "> 0; 1 decimal place"
      - name: declared_cubic_ft
        type: number
        source: computed
        description: calculations.line_cube_and_density applied to the declared dimensions and pieces.
        constraints: 2 decimal places
      - name: declared_density_pcf
        type: number
        source: computed
        description: round_half_up(declared_weight_lb / declared_cubic_ft, 2).
        constraints: 2 decimal places
      - name: measured_weight_lb
        type: integer
        source: system
        description: Weight written by the latest CaptureEvent line measurement for this line_no; null before capture.
      - name: measured_length_in
        type: number
        source: system
        description: Length written by the latest CaptureEvent line measurement; null before capture.
      - name: measured_width_in
        type: number
        source: system
        description: Width written by the latest CaptureEvent line measurement; null before capture.
      - name: measured_height_in
        type: number
        source: system
        description: Height written by the latest CaptureEvent line measurement; null before capture.
      - name: measured_cubic_ft
        type: number
        source: computed
        description: calculations.line_cube_and_density applied to the measured dimensions and pieces; null before capture.
        constraints: 2 decimal places
      - name: measured_density_pcf
        type: number
        source: computed
        description: round_half_up(measured_weight_lb / measured_cubic_ft, 2); null before capture.
        constraints: 2 decimal places
      - name: found_class_code
        type: number
        source: computed
        description: Class resolved by calculations.line_class_resolution in mode MEASURED or INSPECTED; null until a capture or accepted finding exists.
      - name: effective_class_code
        type: number
        source: computed
        description: found_class_code when non-null, otherwise the class resolved in mode DECLARED; the class actually rated.
      - name: classification_source
        type: enum
        source: computed
        description: Provenance of effective_class_code.
        default: BOL_DECLARED
        constraints: one of {BOL_DECLARED, FIXED_CLASS, DIMENSIONER, INSPECTION, EXCEPTION_AGREEMENT, FAK}
      - name: class_floor_applied
        type: boolean
        source: computed
        description: True when the commodity class floor raised the class above the candidate produced by base/override resolution.
        default: false
      - name: line_charge_cents
        type: integer
        source: computed
        description: >-
          round_half_up((rating_weight/100) * program.base_rate_per_cwt_cents * (effective_class_code/100)
          * WEIGHT_BREAK_FACTOR(shipment rating weight) * (1 - program.discount_pct), 0); informational per-line
          amount that is NOT the summand used for Shipment.original_charge_cents.
        default: 0

  - name: CaptureEvent
    parent: null
    common_fields: false
    fields:
      - name: shipment_id
        type: string
        source: input
        description: FK -> Shipment.id; the shipment being measured.
      - name: terminal_id
        type: string
        source: system
        description: FK -> Terminal.id; taken from the TerminalOperator's X-User-ID header.
      - name: captured_by_user_id
        type: string
        source: system
        description: X-User-ID of the capturing TerminalOperator (equal to terminal_id by identity contract).
      - name: device_type
        type: enum
        source: input
        description: DIMENSIONER measures cube only, SCALE weight only, COMBINED both and counts as two evidence items.
        constraints: one of {DIMENSIONER, SCALE, COMBINED}
      - name: capture_sequence
        type: integer
        source: system
        description: 1-based monotonic sequence per shipment_id; the only ordering key for capture replay.
      - name: measured_total_weight_lb
        type: integer
        source: input
        description: Scale weight of the whole shipment.
        constraints: ">= 1"
      - name: line_measurements
        type: array
        source: input
        description: >-
          Non-empty array of { line_no: integer, measured_weight_lb: integer, measured_length_in: number,
          measured_width_in: number, measured_height_in: number }; every line_no must exist on the shipment.
      - name: captured_at
        type: datetime
        source: system
        description: Logical-clock instant of capture.
      - name: variance_pct
        type: number
        source: computed
        description: Shipment weight variance percentage this capture produced (same formula as Shipment.weight_variance_pct).
        constraints: 2 decimal places
      - name: triggered_reweigh
        type: boolean
        source: computed
        description: True when this capture made Shipment.reweigh_required true.
        default: false
      - name: triggered_reclass
        type: boolean
        source: computed
        description: True when this capture produced at least one line whose found_class_code differs from declared_class_code.
        default: false
      - name: reclassed_line_count
        type: integer
        source: computed
        description: Number of lines whose found_class_code differs from declared_class_code after this capture.
        default: 0

  - name: InspectionFinding
    parent: null
    common_fields: true
    fields:
      - name: shipment_line_id
        type: string
        source: input
        description: FK -> ShipmentLine.id; the line inspected.
      - name: inspector_user_id
        type: string
        source: system
        description: X-User-ID of the recording FreightInspector; anchors segregation of duties.
      - name: finding_basis
        type: enum
        source: input
        description: Characteristic the inspector re-classified on.
        constraints: one of {DENSITY, STOWABILITY, HANDLING, LIABILITY, COMMODITY_MISMATCH}
      - name: found_commodity_profile_id
        type: string
        source: input
        description: FK -> CommodityProfile.id; the correct commodity profile, required when finding_basis == COMMODITY_MISMATCH and null otherwise.
      - name: found_class_code
        type: number
        source: input
        description: Class the inspector found.
        constraints: member of CLASS_CODES
      - name: evidence_photo_count
        type: integer
        source: input
        description: Number of photographs attached to the finding.
        default: 0
        constraints: ">= 0"
      - name: notes
        type: string
        source: input
        description: Free-text inspector note.
      - name: status
        type: enum
        source: system
        description: RECORDED findings do not affect classification; ACCEPTED findings do; SUPERSEDED findings were displaced by a later accepted finding on the same line.
        default: RECORDED
        constraints: one of {RECORDED, ACCEPTED, SUPERSEDED}
      - name: accepted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClassificationAuditor that accepted the finding; null while RECORDED.
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock timestamp of acceptance; null while RECORDED.

  - name: CorrectionNotice
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: FK -> Shipment.id; the shipment being corrected.
      - name: basis_capture_event_id
        type: string
        source: input
        description: FK -> CaptureEvent.id; the dimensioner/scale capture cited as evidence. Set by the system on automated notices, optional on manual ones.
      - name: supersedes_notice_id
        type: string
        source: input
        description: FK -> CorrectionNotice.id; the DRAFT notice this one replaces, which is voided as a side effect.
      - name: notice_type
        type: enum
        source: input
        description: >-
          REWEIGH cites weight only, RECLASS class only, BOTH both. On automated notices the system computes
          it: BOTH when reweigh_required and a class delta exist, RECLASS when only a class delta exists,
          REWEIGH when only reweigh_required.
        constraints: one of {REWEIGH, RECLASS, BOTH}
      - name: origin
        type: enum
        source: computed
        description: AUTOMATED_CAPTURE when created by the capture cascade, AUDITOR_MANUAL when created through POST /ltl/correction-notices.
        constraints: one of {AUTOMATED_CAPTURE, AUDITOR_MANUAL}
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClassificationAuditor that issued the notice; null while DRAFT.
      - name: provisional_delta_cents
        type: integer
        source: computed
        description: calculations.correction_notice_delta variant TERMINAL_PROVISIONAL (per-line weight breaks, per-line rounding, no minimum charge).
        default: 0
      - name: final_delta_cents
        type: integer
        source: computed
        description: calculations.correction_notice_delta variant AUDIT_FINAL (shipment-aggregate weight break, single rounding, minimum charge applied).
        default: 0
      - name: applied_delta_cents
        type: integer
        source: computed
        description: 0 while DRAFT; frozen equal to final_delta_cents at the ISSUED transition and never recomputed afterwards.
        default: 0
      - name: inspection_fee_cents
        type: integer
        source: computed
        description: Accessorial fee frozen at issuance; 4500 when notice_type IN {RECLASS, BOTH}, 2500 when REWEIGH, 0 while DRAFT.
        default: 0
      - name: evidence_bundle_count
        type: integer
        source: computed
        description: >-
          (0 when basis_capture_event_id is null, 2 when the cited capture's device_type == COMBINED, else 1)
          + sum over ACCEPTED InspectionFinding f on lines of this shipment of (1 + f.evidence_photo_count).
        default: 0
      - name: uses_inspection_findings
        type: boolean
        source: computed
        description: True when at least one ACCEPTED InspectionFinding exists on a line of this shipment at computation time.
        default: false
      - name: status
        type: enum
        source: system
        description: Correction lifecycle including the evidence-supplement cycle and the three-way resolution branch.
        default: DRAFT
        constraints: one of {DRAFT, ISSUED, DISPUTED, EVIDENCE_REQUESTED, UPHELD, PARTIALLY_OVERTURNED, OVERTURNED, VOID}
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock timestamp of issuance; null while DRAFT or VOID.
      - name: dispute_deadline_at
        type: datetime
        source: computed
        description: calculations.dispute_window_deadline; null while DRAFT or VOID.
      - name: dispute_round_count
        type: integer
        source: computed
        description: Number of shipper submissions against this notice (initial filing plus supplements).
        default: 0
      - name: supplement_request_count
        type: integer
        source: computed
        description: Number of reviewer supplement requests against this notice; each adds SUPPLEMENT_EXTENSION_DAYS to dispute_deadline_at.
        default: 0
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the transition into UPHELD, PARTIALLY_OVERTURNED or OVERTURNED; null otherwise.
      - name: credited_total_cents
        type: integer
        source: computed
        description: Sum of CreditMemo.amount_cents over memos whose correction_notice_id is this notice.
        default: 0

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: correction_notice_id
        type: string
        source: input
        description: FK -> CorrectionNotice.id; the notice being disputed.
      - name: filed_by_customer_id
        type: string
        source: system
        description: FK -> Customer.id; taken from the filing Shipper's X-User-ID header.
      - name: round_no
        type: integer
        source: computed
        description: Equal to the notice's dispute_round_count after this filing or supplement.
        default: 1
      - name: claim_basis
        type: enum
        source: input
        description: Ground on which the shipper contests the reclassification.
        constraints: one of {DENSITY_RECOMPUTE, EXCEPTION_AGREEMENT, DEVICE_CALIBRATION, EVIDENCE_INSUFFICIENT}
      - name: claimed_class_code
        type: number
        source: input
        description: Class the shipper asserts is correct; optional.
        constraints: member of CLASS_CODES when present
      - name: evidence_doc_count
        type: integer
        source: input
        description: Documents attached; incremented by additional_doc_count on every supplement.
        default: 0
        constraints: ">= 0"
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock timestamp of filing.
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the DisputeReviewer that first acted on this dispute; null while untouched.
      - name: outcome
        type: enum
        source: system
        description: Resolution decision recorded at the RESOLVED transition.
        constraints: one of {UPHELD_CARRIER, PARTIAL, OVERTURNED} or null
      - name: outcome_class_code
        type: number
        source: system
        description: Class substituted on reclassed lines when outcome == PARTIAL; null otherwise.
        constraints: member of CLASS_CODES when present
      - name: status
        type: enum
        source: system
        description: Dispute round lifecycle; SUPPLEMENTED can be pushed back to SUPPLEMENT_REQUESTED, forming the negotiation cycle.
        default: OPEN
        constraints: one of {OPEN, SUPPLEMENT_REQUESTED, SUPPLEMENTED, RESOLVED}
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock timestamp of resolution; null while unresolved.

  - name: CreditMemo
    parent: null
    common_fields: false
    fields:
      - name: correction_notice_id
        type: string
        source: system
        description: FK -> CorrectionNotice.id; the notice whose assessment this memo reverses.
      - name: customer_id
        type: string
        source: system
        description: FK -> Customer.id; the shipper credited.
      - name: reason
        type: enum
        source: computed
        description: FULL_OVERTURN when the dispute outcome was OVERTURNED, PARTIAL_OVERTURN when PARTIAL.
        constraints: one of {FULL_OVERTURN, PARTIAL_OVERTURN}
      - name: freight_credit_cents
        type: integer
        source: computed
        description: Bucket 1 of calculations.credit_allocation_waterfall; reduces Shipment.assessed_total_cents.
        default: 0
      - name: fee_credit_cents
        type: integer
        source: computed
        description: Bucket 2 of calculations.credit_allocation_waterfall; reduces Shipment.assessed_total_cents.
        default: 0
      - name: interest_credit_cents
        type: integer
        source: computed
        description: Bucket 3 of calculations.credit_allocation_waterfall, capped at INTEREST_CAP_CENTS; does NOT reduce Shipment.assessed_total_cents.
        default: 0
      - name: amount_cents
        type: integer
        source: computed
        description: freight_credit_cents + fee_credit_cents + interest_credit_cents.
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock timestamp at which the resolution cascade created this memo.

  - name: RepricingRun
    parent: null
    common_fields: true
    fields:
      - name: new_tariff_version_id
        type: string
        source: input
        description: FK -> TariffVersion.id; the standard whose adoption is being priced.
      - name: scope
        type: enum
        source: input
        description: Which ACTIVE programs the run covers.
        constraints: one of {ALL_CLASS_BASED, ALL_DENSITY_BASED, ALL_ACTIVE}
      - name: sample_window_start_at
        type: datetime
        source: input
        description: Inclusive start of the shipment sample window (Shipment.pickup_at >= this).
      - name: sample_window_end_at
        type: datetime
        source: input
        description: Exclusive end of the shipment sample window (Shipment.pickup_at < this); must be strictly after sample_window_start_at.
      - name: status
        type: enum
        source: system
        description: Modelling then commit lifecycle of the repricing checkpoint.
        default: DRAFT
        constraints: one of {DRAFT, MODELED, COMMITTED}
      - name: impacted_customer_count
        type: integer
        source: computed
        description: Number of distinct customer_id values across the ACTIVE programs in scope.
        default: 0
      - name: aggregate_delta_cents
        type: integer
        source: computed
        description: Sum over scoped programs of (modeled_annual_revenue_cents - baseline_revenue_cents) computed against the new tariff version.
        default: 0
      - name: modeled_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the MODELED transition; null while DRAFT.
      - name: committed_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the COMMITTED transition; null before commit.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Shipment dimension 1 of 2: classification -----------------------------
  - entity: Shipment
    field: class_status
    initial_state: DECLARED
    terminal_states: [CLASS_CONFIRMED]
    transitions:
      - from: DECLARED
        to: CAPTURED
        trigger: "POST /ltl/capture-events (resulting CaptureEvent.triggered_reclass == false)"
        actor: TerminalOperator
        preconditions:
          - "Shipment.line_count >= 1"
          - "Shipment.billing_status != CLOSED"
          - "Terminal.dimensioner_status == CALIBRATED for the capturing terminal"
          - "every line_measurements[].line_no exists on the shipment"
        side_effects:
          - "writes measured_weight_lb and measured_*_in onto each addressed ShipmentLine"
          - "recomputes ShipmentLine.measured_cubic_ft, measured_density_pcf, found_class_code, effective_class_code, classification_source, line_charge_cents"
          - "recomputes Shipment.measured_total_weight_lb, weight_variance_pct, reweigh_required, declared_vs_found_class_delta_count"
          - "increments Terminal.captures_since_calibration by 1 and sets Terminal.last_capture_at"
          - "assigns CaptureEvent.capture_sequence = previous max for this shipment + 1"
      - from: DECLARED
        to: RECLASS_PENDING
        trigger: "POST /ltl/capture-events (resulting CaptureEvent.triggered_reclass == true OR Shipment.reweigh_required becomes true)"
        actor: TerminalOperator
        preconditions:
          - "same preconditions as DECLARED -> CAPTURED"
        side_effects:
          - "all side effects of DECLARED -> CAPTURED"
          - "creates a CorrectionNotice with origin AUTOMATED_CAPTURE, status DRAFT, basis_capture_event_id = this capture, notice_type computed from (reweigh_required, class delta)"
          - "increments Shipment.open_notice_count by 1 and therefore Shipment.version by 1"
        note: "Same trigger, two targets — the branch is guarded by the capture's own computed variance/class-delta outcome."
      - from: CAPTURED
        to: RECLASS_PENDING
        trigger: "POST /ltl/capture-events (a later capture that produces a class delta or reweigh condition)"
        actor: TerminalOperator
        preconditions:
          - "same preconditions as DECLARED -> CAPTURED"
          - "Shipment.open_notice_count == 0"
        side_effects:
          - "all side effects of DECLARED -> RECLASS_PENDING"
      - from: CAPTURED
        to: CAPTURED
        trigger: "POST /ltl/capture-events (a later capture that produces neither a class delta nor a reweigh condition)"
        actor: TerminalOperator
        preconditions:
          - "same preconditions as DECLARED -> CAPTURED"
        side_effects:
          - "overwrites the measured_* fields with the newer capture's values (latest capture_sequence wins)"
        note: "Self-loop: re-capture is idempotent in shape but not in data."
      - from: DECLARED
        to: UNDER_INSPECTION
        trigger: "POST /ltl/inspection-findings"
        actor: FreightInspector
        preconditions:
          - "the target ShipmentLine belongs to this shipment"
          - "Shipment.billing_status != CLOSED"
        side_effects:
          - "creates InspectionFinding in status RECORDED (no classification change yet)"
      - from: CAPTURED
        to: UNDER_INSPECTION
        trigger: "POST /ltl/inspection-findings"
        actor: FreightInspector
        preconditions:
          - "same preconditions as DECLARED -> UNDER_INSPECTION"
        side_effects:
          - "creates InspectionFinding in status RECORDED"
      - from: UNDER_INSPECTION
        to: RECLASS_PENDING
        trigger: "POST /ltl/inspection-findings/{id}/accept"
        actor: ClassificationAuditor
        preconditions:
          - "InspectionFinding.status == RECORDED"
          - "the accepting ClassificationAuditor's X-User-ID != InspectionFinding.inspector_user_id"
          - "InspectionFinding.evidence_photo_count >= MIN_FINDING_PHOTOS"
        side_effects:
          - "sets InspectionFinding.status = ACCEPTED, accepted_by_user_id, accepted_at"
          - "marks any previously ACCEPTED finding on the same ShipmentLine as SUPERSEDED"
          - "recomputes the line's found_class_code / effective_class_code / classification_source = INSPECTION and line_charge_cents"
          - "recomputes Shipment.declared_vs_found_class_delta_count"
      - from: RECLASS_PENDING
        to: RECLASSED
        trigger: "POST /ltl/correction-notices/{id}/issue"
        actor: ClassificationAuditor
        preconditions:
          - "CorrectionNotice.status == DRAFT"
          - "CorrectionNotice.final_delta_cents != 0"
          - "Shipment.billing_status IN {BILLED, REBILLED, CREDITED}"
          - "Customer.billing_posture != CLOSED"
          - "CorrectionNotice.evidence_bundle_count >= MIN_EVIDENCE_BUNDLE"
        side_effects:
          - "freezes applied_delta_cents = final_delta_cents and inspection_fee_cents by notice_type"
          - "sets issued_at, issued_by_user_id and dispute_deadline_at"
          - "advances Shipment.billing_status to REBILLED and recomputes Shipment.assessed_total_cents"
          - "increments Customer.offender_strike_count and recomputes liability indices, offender_tier, dispute_window_days"
          - "flips Customer.education_status to REQUIRED when offender_strike_count >= education_threshold_strikes"
      - from: RECLASSED
        to: CAPTURED
        trigger: "POST /ltl/disputes/{id}/resolve with outcome OVERTURNED"
        actor: DisputeReviewer
        preconditions:
          - "Dispute.status IN {OPEN, SUPPLEMENT_REQUESTED, SUPPLEMENTED}"
          - "CorrectionNotice.status IN {DISPUTED, EVIDENCE_REQUESTED}"
        side_effects:
          - "reverts every ShipmentLine of the shipment to its declared classification (found_class_code = null, classification_source = BOL_DECLARED)"
          - "sets CorrectionNotice.status = OVERTURNED and creates a CreditMemo with reason FULL_OVERTURN"
          - "advances Shipment.billing_status to CREDITED and recomputes assessed_total_cents"
          - "decrements Customer.offender_strike_count and recomputes the liability indices"
        note: "Backward transition — the reclassification is undone and the shipment returns to the measured-but-unreclassed state."
      - from: RECLASSED
        to: RECLASSED
        trigger: "POST /ltl/disputes/{id}/resolve with outcome PARTIAL or UPHELD_CARRIER"
        actor: DisputeReviewer
        preconditions:
          - "same preconditions as RECLASSED -> CAPTURED"
        side_effects:
          - "on PARTIAL: substitutes Dispute.outcome_class_code on every reclassed line, recomputes the charge, creates a CreditMemo with reason PARTIAL_OVERTURN"
          - "on UPHELD_CARRIER: leaves classification and money untouched"
      - from: DECLARED
        to: CLASS_CONFIRMED
        trigger: "POST /ltl/shipments/{id}/close"
        actor: PricingAnalyst
        preconditions:
          - "Shipment.open_notice_count == 0"
          - "Shipment.billing_status IN {BILLED, REBILLED, CREDITED}"
        side_effects:
          - "advances Shipment.billing_status to CLOSED"
      - from: CAPTURED
        to: CLASS_CONFIRMED
        trigger: "POST /ltl/shipments/{id}/close"
        actor: PricingAnalyst
        preconditions:
          - "same preconditions as DECLARED -> CLASS_CONFIRMED"
        side_effects:
          - "advances Shipment.billing_status to CLOSED"
      - from: RECLASSED
        to: CLASS_CONFIRMED
        trigger: "POST /ltl/shipments/{id}/close"
        actor: PricingAnalyst
        preconditions:
          - "same preconditions as DECLARED -> CLASS_CONFIRMED"
        side_effects:
          - "advances Shipment.billing_status to CLOSED"

  # ---- Shipment dimension 2 of 2: billing ------------------------------------
  - entity: Shipment
    field: billing_status
    initial_state: UNBILLED
    terminal_states: [CLOSED]
    transitions:
      - from: UNBILLED
        to: BILLED
        trigger: "POST /ltl/shipments/{id}/bill"
        actor: PricingAnalyst
        preconditions:
          - "Shipment.line_count >= 1"
          - "Customer.billing_posture != CLOSED"
        side_effects:
          - "computes Shipment.original_charge_cents (calculations.shipment_charge, mode DECLARED)"
          - "sets Shipment.assessed_total_cents = original_charge_cents and Shipment.billed_at"
        note: "class_status is untouched by billing — the two dimensions advance independently."
      - from: BILLED
        to: REBILLED
        trigger: "POST /ltl/correction-notices/{id}/issue"
        actor: ClassificationAuditor
        preconditions:
          - "see Shipment.class_status RECLASS_PENDING -> RECLASSED preconditions"
        side_effects:
          - "recomputes Shipment.assessed_total_cents from the frozen notice amounts"
      - from: REBILLED
        to: REBILLED
        trigger: "POST /ltl/correction-notices/{id}/issue (a second notice on the same shipment)"
        actor: ClassificationAuditor
        preconditions:
          - "Shipment.open_notice_count == 0 at creation time of the second notice"
        side_effects:
          - "adds the second notice's frozen amounts into Shipment.assessed_total_cents"
      - from: BILLED
        to: CREDITED
        trigger: "POST /ltl/disputes/{id}/resolve with outcome PARTIAL or OVERTURNED"
        actor: DisputeReviewer
        preconditions:
          - "a CreditMemo is produced by the resolution cascade"
        side_effects:
          - "subtracts the memo's freight_credit_cents and fee_credit_cents from Shipment.assessed_total_cents"
      - from: REBILLED
        to: CREDITED
        trigger: "POST /ltl/disputes/{id}/resolve with outcome PARTIAL or OVERTURNED"
        actor: DisputeReviewer
        preconditions:
          - "a CreditMemo is produced by the resolution cascade"
        side_effects:
          - "subtracts the memo's freight_credit_cents and fee_credit_cents from Shipment.assessed_total_cents"
      - from: CREDITED
        to: REBILLED
        trigger: "POST /ltl/correction-notices/{id}/issue (a later notice after a credit)"
        actor: ClassificationAuditor
        preconditions:
          - "Shipment.open_notice_count == 1 for the notice being issued"
        side_effects:
          - "adds the later notice's frozen amounts into Shipment.assessed_total_cents"
        note: "Cycle: CREDITED and REBILLED alternate as corrections and credits accumulate."
      - from: BILLED
        to: CLOSED
        trigger: "POST /ltl/shipments/{id}/close"
        actor: PricingAnalyst
        preconditions:
          - "Shipment.open_notice_count == 0"
        side_effects:
          - "advances Shipment.class_status to CLASS_CONFIRMED"
      - from: REBILLED
        to: CLOSED
        trigger: "POST /ltl/shipments/{id}/close"
        actor: PricingAnalyst
        preconditions:
          - "Shipment.open_notice_count == 0"
        side_effects:
          - "advances Shipment.class_status to CLASS_CONFIRMED"
      - from: CREDITED
        to: CLOSED
        trigger: "POST /ltl/shipments/{id}/close"
        actor: PricingAnalyst
        preconditions:
          - "Shipment.open_notice_count == 0"
        side_effects:
          - "advances Shipment.class_status to CLASS_CONFIRMED"

  - entity: CorrectionNotice
    field: status
    initial_state: DRAFT
    terminal_states: [UPHELD, PARTIALLY_OVERTURNED, OVERTURNED, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /ltl/correction-notices/{id}/issue"
        actor: ClassificationAuditor
        preconditions:
          - "final_delta_cents != 0"
          - "evidence_bundle_count >= MIN_EVIDENCE_BUNDLE"
          - "Shipment.billing_status IN {BILLED, REBILLED, CREDITED}"
          - "Customer.billing_posture != CLOSED"
        side_effects:
          - "freezes applied_delta_cents and inspection_fee_cents; sets issued_at, issued_by_user_id, dispute_deadline_at"
          - "cascades into Shipment (class_status, billing_status, assessed_total_cents) and Customer (strikes, indices, tier, window, education)"
      - from: DRAFT
        to: VOID
        trigger: "POST /ltl/correction-notices (a replacement notice citing supersedes_notice_id = this notice)"
        actor: ClassificationAuditor
        preconditions:
          - "this notice is still DRAFT"
        side_effects:
          - "decrements Shipment.open_notice_count for the voided notice and increments it for the replacement"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /ltl/disputes"
        actor: Shipper
        preconditions:
          - "current logical time <= dispute_deadline_at"
          - "Customer.education_status != REQUIRED"
          - "dispute_round_count < MAX_DISPUTE_ROUNDS"
        side_effects:
          - "creates Dispute in status OPEN with round_no = dispute_round_count + 1"
          - "increments dispute_round_count"
      - from: DISPUTED
        to: EVIDENCE_REQUESTED
        trigger: "POST /ltl/disputes/{id}/request-supplement"
        actor: DisputeReviewer
        preconditions:
          - "Dispute.status == OPEN or SUPPLEMENTED"
          - "the reviewer's X-User-ID != CorrectionNotice.issued_by_user_id"
          - "supplement_request_count < MAX_SUPPLEMENT_REQUESTS"
        side_effects:
          - "sets Dispute.status = SUPPLEMENT_REQUESTED and Dispute.reviewer_user_id"
          - "increments supplement_request_count and extends dispute_deadline_at by SUPPLEMENT_EXTENSION_DAYS"
      - from: EVIDENCE_REQUESTED
        to: DISPUTED
        trigger: "POST /ltl/disputes/{id}/supplement"
        actor: Shipper
        preconditions:
          - "Dispute.status == SUPPLEMENT_REQUESTED"
          - "dispute_round_count < MAX_DISPUTE_ROUNDS"
        side_effects:
          - "sets Dispute.status = SUPPLEMENTED, adds additional_doc_count to Dispute.evidence_doc_count"
          - "increments dispute_round_count and Dispute.round_no"
        note: "Cycle: DISPUTED -> EVIDENCE_REQUESTED -> DISPUTED repeats until MAX_SUPPLEMENT_REQUESTS or MAX_DISPUTE_ROUNDS binds."
      - from: DISPUTED
        to: UPHELD
        trigger: "POST /ltl/disputes/{id}/resolve with outcome UPHELD_CARRIER"
        actor: DisputeReviewer
        preconditions:
          - "the reviewer's X-User-ID != CorrectionNotice.issued_by_user_id"
        side_effects:
          - "sets resolved_at; leaves applied_delta_cents, inspection_fee_cents and the lines untouched"
      - from: DISPUTED
        to: PARTIALLY_OVERTURNED
        trigger: "POST /ltl/disputes/{id}/resolve with outcome PARTIAL"
        actor: DisputeReviewer
        preconditions:
          - "outcome_class_code is present and differs from every reclassed line's effective_class_code"
          - "the reviewer's X-User-ID != CorrectionNotice.issued_by_user_id"
        side_effects:
          - "re-rates the shipment at outcome_class_code, creates a CreditMemo with reason PARTIAL_OVERTURN"
          - "cascades to Shipment.billing_status = CREDITED and Customer liability indices"
      - from: DISPUTED
        to: OVERTURNED
        trigger: "POST /ltl/disputes/{id}/resolve with outcome OVERTURNED"
        actor: DisputeReviewer
        preconditions:
          - "the reviewer's X-User-ID != CorrectionNotice.issued_by_user_id"
        side_effects:
          - "reverts the lines, creates a CreditMemo with reason FULL_OVERTURN, decrements Customer.offender_strike_count"
      - from: EVIDENCE_REQUESTED
        to: UPHELD
        trigger: "POST /ltl/disputes/{id}/resolve with outcome UPHELD_CARRIER"
        actor: DisputeReviewer
        preconditions:
          - "the reviewer's X-User-ID != CorrectionNotice.issued_by_user_id"
        side_effects:
          - "sets resolved_at; leaves money untouched"
      - from: ISSUED
        to: UPHELD
        trigger: "POST /ltl/notice-sweeps (ops sweep after the dispute window elapses)"
        actor: PricingAnalyst
        preconditions:
          - "current logical time > dispute_deadline_at"
          - "no Dispute exists for this notice"
        side_effects:
          - "sets resolved_at to the sweep instant and recomputes Customer liability indices"
        note: "Branch join: an unchallenged notice reaches the same terminal state as one that survived review."

  - entity: Dispute
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: SUPPLEMENT_REQUESTED
        trigger: "POST /ltl/disputes/{id}/request-supplement"
        actor: DisputeReviewer
        preconditions:
          - "CorrectionNotice.supplement_request_count < MAX_SUPPLEMENT_REQUESTS"
          - "the reviewer's X-User-ID != CorrectionNotice.issued_by_user_id"
        side_effects:
          - "extends the notice's dispute_deadline_at by SUPPLEMENT_EXTENSION_DAYS"
      - from: SUPPLEMENT_REQUESTED
        to: SUPPLEMENTED
        trigger: "POST /ltl/disputes/{id}/supplement"
        actor: Shipper
        preconditions:
          - "the acting Shipper's X-User-ID == Dispute.filed_by_customer_id"
          - "CorrectionNotice.dispute_round_count < MAX_DISPUTE_ROUNDS"
        side_effects:
          - "adds additional_doc_count to evidence_doc_count and increments round_no"
      - from: SUPPLEMENTED
        to: SUPPLEMENT_REQUESTED
        trigger: "POST /ltl/disputes/{id}/request-supplement (another round)"
        actor: DisputeReviewer
        preconditions:
          - "CorrectionNotice.supplement_request_count < MAX_SUPPLEMENT_REQUESTS"
        side_effects:
          - "extends dispute_deadline_at by SUPPLEMENT_EXTENSION_DAYS again"
        note: "Negotiation cycle bounded by MAX_SUPPLEMENT_REQUESTS."
      - from: OPEN
        to: RESOLVED
        trigger: "POST /ltl/disputes/{id}/resolve"
        actor: DisputeReviewer
        preconditions:
          - "the reviewer's X-User-ID != CorrectionNotice.issued_by_user_id"
          - "outcome_class_code present when outcome == PARTIAL, absent otherwise"
        side_effects:
          - "sets outcome, outcome_class_code, reviewer_user_id, resolved_at and drives the CorrectionNotice branch"
      - from: SUPPLEMENT_REQUESTED
        to: RESOLVED
        trigger: "POST /ltl/disputes/{id}/resolve"
        actor: DisputeReviewer
        preconditions:
          - "same preconditions as OPEN -> RESOLVED"
        side_effects:
          - "same side effects as OPEN -> RESOLVED"
      - from: SUPPLEMENTED
        to: RESOLVED
        trigger: "POST /ltl/disputes/{id}/resolve"
        actor: DisputeReviewer
        preconditions:
          - "same preconditions as OPEN -> RESOLVED"
        side_effects:
          - "same side effects as OPEN -> RESOLVED"

  - entity: TariffVersion
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /ltl/tariff-versions/{id}/publish"
        actor: PricingAnalyst
        preconditions:
          - "at least one CommodityProfile exists for this tariff version"
          - "effective_at is strictly after the effective_at of the current newest PUBLISHED version"
        side_effects:
          - "sets published_at"
          - "sets the previously PUBLISHED version's status to SUPERSEDED and its superseded_by_tariff_version_id to this version"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /ltl/tariff-versions/{id}/publish on a newer DRAFT version (system side effect)"
        actor: system
        preconditions:
          - "this version is the current newest PUBLISHED version"
        side_effects:
          - "sets superseded_by_tariff_version_id; shipments already pinned to this version keep rating against it"

  - entity: RateProgram
    field: status
    initial_state: MODELING
    terminal_states: [RETIRED]
    transitions:
      - from: MODELING
        to: APPROVED
        trigger: "POST /ltl/rate-programs/{id}/approve"
        actor: PricingAnalyst
        preconditions:
          - "a PUBLISHED TariffVersion exists"
          - "Customer.billing_posture != CLOSED"
        side_effects:
          - "pins pinned_tariff_version_id to the newest PUBLISHED TariffVersion"
          - "computes baseline_revenue_cents, modeled_annual_revenue_cents, modeled_delta_pct, modeled_shipment_count, migration_recommendation"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /ltl/rate-programs/{id}/activate"
        actor: PricingAnalyst
        preconditions:
          - "expected_customer_version matches Customer.version"
          - "Customer.billing_posture != CLOSED"
        side_effects:
          - "sets effective_from; retires the customer's previously ACTIVE program (status RETIRED, effective_to set)"
          - "sets Customer.active_program_type and increments Customer.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /ltl/rate-programs/{id}/activate on a different APPROVED program of the same customer (system side effect)"
        actor: system
        preconditions:
          - "this program is the customer's current ACTIVE program"
        side_effects:
          - "sets effective_to; shipments already pinned to this program keep rating against it"

  - entity: ExceptionAgreement
    field: status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /ltl/exception-agreements/{id}/approve"
        actor: PricingAnalyst
        preconditions:
          - "Customer.billing_posture != CLOSED"
          - "no other ACTIVE agreement overlaps the same (customer_id, commodity_profile_id) interval"
        side_effects:
          - "sets approved_by_user_id and approved_at; the agreement now overrides classification for covered lines"

  - entity: RepricingRun
    field: status
    initial_state: DRAFT
    terminal_states: [COMMITTED]
    transitions:
      - from: DRAFT
        to: MODELED
        trigger: "POST /ltl/repricing-runs/{id}/model"
        actor: PricingAnalyst
        preconditions:
          - "TariffVersion(new_tariff_version_id).status == PUBLISHED"
        side_effects:
          - "computes impacted_customer_count and aggregate_delta_cents over the scoped ACTIVE programs; sets modeled_at"
      - from: MODELED
        to: COMMITTED
        trigger: "POST /ltl/repricing-runs/{id}/commit"
        actor: PricingAnalyst
        preconditions:
          - "status == MODELED"
        side_effects:
          - "re-pins pinned_tariff_version_id = new_tariff_version_id on every scoped ACTIVE RateProgram"
          - "recomputes each scoped program's baseline_revenue_cents, modeled_annual_revenue_cents, modeled_delta_pct and migration_recommendation"
          - "sets committed_at"

  # ---- Customer dimension 1 of 2: credit posture ------------------------------
  - entity: Customer
    field: billing_posture
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CREDIT_HOLD
        trigger: "POST /ltl/customers/{id}/posture with billing_posture CREDIT_HOLD"
        actor: PricingAnalyst
        preconditions:
          - "expected_customer_version matches Customer.version"
        side_effects:
          - "blocks new shipment creation; increments Customer.version by 1"
      - from: CREDIT_HOLD
        to: OPEN
        trigger: "POST /ltl/customers/{id}/posture with billing_posture OPEN"
        actor: PricingAnalyst
        preconditions:
          - "expected_customer_version matches Customer.version"
        side_effects:
          - "re-enables shipment creation; increments Customer.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /ltl/customers/{id}/posture with billing_posture CLOSED"
        actor: PricingAnalyst
        preconditions:
          - "expected_customer_version matches Customer.version"
        side_effects:
          - "blocks shipment creation, notice issuance, program approval/activation and exception approval"
      - from: CREDIT_HOLD
        to: CLOSED
        trigger: "POST /ltl/customers/{id}/posture with billing_posture CLOSED"
        actor: PricingAnalyst
        preconditions:
          - "expected_customer_version matches Customer.version"
        side_effects:
          - "same side effects as OPEN -> CLOSED"

  # ---- Customer dimension 2 of 2: repeat-offender education -------------------
  - entity: Customer
    field: education_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: REQUIRED
        trigger: "POST /ltl/correction-notices/{id}/issue pushing offender_strike_count to education_threshold_strikes (system side effect)"
        actor: system
        preconditions:
          - "offender_strike_count >= education_threshold_strikes after the increment"
        side_effects:
          - "sets education_required_at; blocks the shipper from filing new disputes until education completes"
      - from: REQUIRED
        to: COMPLETED
        trigger: "POST /ltl/customers/{id}/education/complete"
        actor: PricingAnalyst
        preconditions:
          - "education_status == REQUIRED"
        side_effects:
          - "raises education_threshold_strikes to offender_strike_count + education_strike_interval"
          - "unblocks dispute filing; increments Customer.version by 1"
      - from: COMPLETED
        to: REQUIRED
        trigger: "POST /ltl/correction-notices/{id}/issue pushing offender_strike_count to the raised education_threshold_strikes (system side effect)"
        actor: system
        preconditions:
          - "offender_strike_count >= education_threshold_strikes after the increment"
        side_effects:
          - "sets education_required_at again"
        note: "Cycle: education is re-triggered every education_strike_interval additional strikes, independently of billing_posture."

  - entity: InspectionFinding
    field: status
    initial_state: RECORDED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: RECORDED
        to: ACCEPTED
        trigger: "POST /ltl/inspection-findings/{id}/accept"
        actor: ClassificationAuditor
        preconditions:
          - "accepting auditor's X-User-ID != inspector_user_id"
          - "evidence_photo_count >= MIN_FINDING_PHOTOS"
          - "Shipment.billing_status != CLOSED"
        side_effects:
          - "rewrites the line's classification and marks the previous ACCEPTED finding on that line SUPERSEDED"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "POST /ltl/inspection-findings/{id}/accept on a later finding for the same line (system side effect)"
        actor: system
        preconditions:
          - "the later finding targets the same shipment_line_id"
        side_effects:
          - "the superseded finding no longer contributes to found_class_code"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: program-activate-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /ltl/rate-programs/{id}/activate"
    occ_field: "expected_customer_version"
    description: |
      Activating a RateProgram against a Customer whose version has advanced since the client last
      observed it is rejected. Activation legitimately supersedes whatever program was ACTIVE before,
      so a stale view of the customer cannot be distinguished from an intentional supersede without
      the version check: the writer must prove it saw the customer state that its activation decision
      was based on.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

  - rule_id: notice-create-stale-shipment
    parent_entity: Shipment
    write_endpoint: "POST /ltl/correction-notices"
    occ_field: "expected_shipment_version"
    description: |
      Creating a CorrectionNotice against a Shipment whose version has advanced since the auditor last
      read it is rejected. A manual notice legitimately supersedes an existing DRAFT notice and is
      priced from the shipment's current measured state, so an auditor working from a stale read — for
      instance one taken before a later terminal capture rewrote the measured classification — must
      re-read the shipment before the notice can be created.
    error_id: ERR_STALE_SHIPMENT_VERSION
    http_status: 412

  - rule_id: posture-change-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /ltl/customers/{id}/posture"
    occ_field: "expected_customer_version"
    description: |
      Changing a Customer's billing_posture from a stale view of that customer is rejected. Posture
      writes legitimately overwrite the previous posture decision, so the only defence against a
      decision made on out-of-date strike, index or tier data is requiring the writer to carry the
      version it read.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: line_cube_and_density
    trigger: "On ShipmentLine creation (DECLARED mode) and on every CaptureEvent that addresses the line (MEASURED mode)."
    algorithm: threshold
    formula: |
      mode ∈ {DECLARED, MEASURED}
      L, W, H = (mode == DECLARED) ? (declared_length_in, declared_width_in, declared_height_in)
                                   : (measured_length_in, measured_width_in, measured_height_in)
      P       = pieces
      W_LB    = (mode == DECLARED) ? declared_weight_lb : measured_weight_lb

      # STEP 1 — per handling unit, rounded to 3 decimals FIRST
      per_piece_cubic_ft = round_half_up(L * W * H / CUBIC_INCHES_PER_CUBIC_FOOT, 3)
      # STEP 2 — multiply by pieces, THEN round to 2 decimals
      cubic_ft           = round_half_up(per_piece_cubic_ft * P, 2)
      density_pcf        = round_half_up(W_LB / cubic_ft, 2)

      # The two-step rounding order is normative. Computing
      #   round_half_up(L * W * H * P / 1728, 2)
      # (one rounding over the whole shipment-line volume) is WRONG and can move the
      # resulting density across a tariff bracket boundary, changing the freight class.
    input_set: "One ShipmentLine at a time; no cross-entity aggregation."
    constants:
      CUBIC_INCHES_PER_CUBIC_FOOT: 1728
    precision: "per_piece_cubic_ft 3 decimals, cubic_ft 2 decimals, density_pcf 2 decimals, all round_half_up"

  - name: line_class_resolution
    trigger: "On ShipmentLine creation, on every CaptureEvent addressing the line, on InspectionFinding acceptance, on ExceptionAgreement approval covering the line, and on dispute resolution."
    algorithm: constraint_propagation
    formula: |
      mode ∈ {DECLARED, MEASURED, INSPECTED}
      profile = CommodityProfile(line.commodity_profile_id)
      program = RateProgram(shipment.rate_program_id)
      tariff  = TariffVersion(shipment.tariff_version_id)

      # ---- STEP 1: base candidate ------------------------------------------------
      if mode == INSPECTED:
          finding = the ACCEPTED InspectionFinding on this line
          if finding.finding_basis == COMMODITY_MISMATCH:
              profile = CommodityProfile(finding.found_commodity_profile_id)
          base   = finding.found_class_code
          source = INSPECTION
      elif profile.classification_basis == FIXED_CLASS:
          base   = profile.fixed_class_code
          source = FIXED_CLASS
      elif mode == MEASURED:
          base   = density_bracket(tariff, line.measured_density_pcf)
          source = DIMENSIONER
      else:  # mode == DECLARED
          base   = line.declared_class_code          # the carrier bills the BOL until it measures
          source = BOL_DECLARED

      density_bracket(tariff, d):
          scan tariff.density_breaks in declared order (descending min_density_pcf)
          return the class_code of the FIRST element with element.min_density_pcf <= d
          # inclusive lower bound: d exactly equal to a break belongs to the HIGHER-density
          # (lower-class) bracket

      # ---- STEP 2: negotiated override ------------------------------------------
      agreement = ExceptionAgreement a where a.status == ACTIVE
                  AND a.customer_id == shipment.customer_id
                  AND a.commodity_profile_id == profile.id
                  AND a.effective_from <= shipment.pickup_at < a.effective_to
                  ranked by a.effective_from DESC, then a.created_at DESC; first row wins
      if agreement exists:
          candidate = agreement.agreed_class_code
          source    = (agreement.agreement_type == FAK) ? FAK : EXCEPTION_AGREEMENT
      elif program.program_type == FAK:
          candidate = program.fak_class_code
          source    = FAK
      else:
          candidate = base

      # ---- STEP 3: characteristic floor, re-applied AFTER the override ----------
      effective_class_code = max(candidate, profile.min_class_floor)
      class_floor_applied  = (profile.min_class_floor > candidate)

      profile.min_class_floor = max(HANDLING_FLOOR[handling_code],
                                    STOWABILITY_FLOOR[stowability_code],
                                    LIABILITY_FLOOR[liability_code])
    input_set: >-
      The line's own CommodityProfile; the shipment's pinned TariffVersion and RateProgram; only
      ACTIVE ExceptionAgreements whose interval covers shipment.pickup_at; only the single ACCEPTED
      InspectionFinding on the line (RECORDED and SUPERSEDED findings are ignored).
    constants:
      CLASS_CODES: [50, 55, 60, 65, 70, 77.5, 85, 92.5, 100, 110, 125, 150, 175, 200, 250, 300, 400, 500]
      HANDLING_FLOOR: { STANDARD: 0, FRAGILE: 100, HAZMAT: 125, OVERLENGTH: 110 }
      STOWABILITY_FLOOR: { STACKABLE: 0, NON_STACKABLE: 92.5, HAZ_SEGREGATED: 125 }
      LIABILITY_FLOOR: { LOW: 0, MEDIUM: 70, HIGH: 100 }
    precision: "class codes are exact members of CLASS_CODES; no rounding"

  - name: shipment_charge
    trigger: "On POST /ltl/shipments/{id}/bill (mode DECLARED), inside correction_notice_delta (modes DECLARED and RECLASSED), on dispute resolution (mode RECLASSED at the outcome class), and inside migration_impact_model (mode MODELED)."
    algorithm: tiered_pricing
    formula: |
      mode ∈ {DECLARED, RECLASSED, MODELED}
      program = the RateProgram in force for the mode
      lines   = ShipmentLine rows of the shipment, iterated in ascending line_no

      rating_weight(line) = (mode == DECLARED) ? line.declared_weight_lb
                                               : (line.measured_weight_lb ?? line.declared_weight_lb)
      rating_class(line)  = (mode == DECLARED)   ? line_class_resolution(line, DECLARED)
                            (mode == RECLASSED)  ? line.effective_class_code
                            (mode == MODELED)    ? modeled_class(line, program)

      shipment_rating_weight = Σ rating_weight(line)
      wbf = the factor of the FIRST WEIGHT_BREAK_FACTORS element whose min_weight_lb <= shipment_rating_weight
            # ONE factor derived from the shipment total, applied to every line

      raw_line = (rating_weight(line) / 100) * program.base_rate_per_cwt_cents
                 * (rating_class(line) / 100) * wbf * (1 - program.discount_pct)

      charge_cents = max(program.min_charge_cents, round_half_up(Σ raw_line, 0))
      # ONE rounding over the whole sum, then the minimum charge floor

      modeled_class(line, program) =
          (program.program_type == FAK)           ? program.fak_class_code
          (program.program_type == DENSITY_BASED) ? density_bracket(TariffVersion(program.pinned_tariff_version_id),
                                                                    line.measured_density_pcf ?? line.declared_density_pcf)
          (program.program_type == CLASS_BASED)   ? line.effective_class_code
    input_set: "All ShipmentLine rows of the shipment; no state filtering (a shipment cannot be billed with zero lines)."
    constants:
      WEIGHT_BREAK_FACTORS:
        - { min_weight_lb: 5000, factor: 0.78 }
        - { min_weight_lb: 2000, factor: 0.88 }
        - { min_weight_lb: 1000, factor: 1.00 }
        - { min_weight_lb: 500,  factor: 1.15 }
        - { min_weight_lb: 0,    factor: 1.30 }
    precision: "single round_half_up to whole cents over the summed raw amounts; the per-line ShipmentLine.line_charge_cents is rounded independently and is NOT a summand of charge_cents"
    variants:
      - name: DECLARED
        when: "Billing the shipment as tendered, and as the 'before' leg of every correction delta."
        difference: "Uses declared weights and the BOL/fixed-class resolution."
      - name: RECLASSED
        when: "Pricing a correction notice or a dispute outcome."
        difference: "Uses measured weights where present and the line's effective_class_code."
      - name: MODELED
        when: "Migration impact modelling and repricing runs."
        difference: "Substitutes modeled_class per the candidate program's program_type and pinned tariff."

  - name: correction_notice_delta
    trigger: "On CorrectionNotice creation (both variants computed and stored) and refreshed on any change to the shipment's lines while the notice is still DRAFT."
    algorithm: aggregation
    formula: |
      # ---- variant TERMINAL_PROVISIONAL -> provisional_delta_cents --------------
      line_amount(w, cls) = round_half_up((w / 100) * program.base_rate_per_cwt_cents * (cls / 100)
                                          * WEIGHT_BREAK_FACTOR(w)          # per-LINE weight break
                                          * (1 - program.discount_pct), 0)  # rounded per line
      provisional_delta_cents =
          Σ over lines [ line_amount(rating_weight_RECLASSED(line), line.effective_class_code)
                         - line_amount(line.declared_weight_lb, line_class_resolution(line, DECLARED)) ]
      # program.min_charge_cents is NOT applied in this variant

      # ---- variant AUDIT_FINAL -> final_delta_cents -----------------------------
      final_delta_cents = shipment_charge(mode RECLASSED) - shipment_charge(mode DECLARED)
      # shipment-AGGREGATE weight break, ONE rounding, minimum charge applied on both legs

      # ---- issuance freeze ------------------------------------------------------
      at the DRAFT -> ISSUED transition:
          applied_delta_cents  = final_delta_cents          # frozen, never recomputed
          inspection_fee_cents = (notice_type IN {RECLASS, BOTH}) ? RECLASS_FEE_CENTS : REWEIGH_FEE_CENTS
    input_set: "All ShipmentLine rows of the notice's shipment; the shipment's pinned RateProgram; the notice's own notice_type."
    constants:
      RECLASS_FEE_CENTS: 4500
      REWEIGH_FEE_CENTS: 2500
      MIN_EVIDENCE_BUNDLE: 1
      MIN_FINDING_PHOTOS: 2
      MIN_DISPUTE_DOCS: 1
    precision: "TERMINAL_PROVISIONAL rounds each line to whole cents; AUDIT_FINAL rounds each leg once to whole cents"
    variants:
      - name: TERMINAL_PROVISIONAL
        when: "Quoted on the dock at notice creation; stored in provisional_delta_cents and shown to the driver."
        difference: "Per-line weight-break factors, per-line rounding, no minimum charge — produces a different number from AUDIT_FINAL on identical data."
      - name: AUDIT_FINAL
        when: "Billed at issuance; stored in final_delta_cents and frozen into applied_delta_cents."
        difference: "Shipment-aggregate weight break, single rounding per leg, minimum charge floor on both legs."

  - name: shipper_liability_index
    trigger: "On CorrectionNotice issuance, on dispute resolution, and on POST /ltl/notice-sweeps."
    algorithm: decay_function
    formula: |
      now = current logical time
      resolved(n) = n.resolved_at != null AND n.status IN {UPHELD, PARTIALLY_OVERTURNED}
      weight(n)   = (n.status == UPHELD) ? UPHELD_WEIGHT : PARTIAL_WEIGHT

      # ---- variant ROLLING_WINDOW -> Customer.liability_index_rolling ----------
      events_r = { n : resolved(n) AND n.resolved_at >= now - ROLLING_WINDOW_DAYS days }
      age_days(n) = floor((now - n.resolved_at) / 86400 seconds)
      decay(n)    = max(DECAY_FLOOR, 1 - DECAY_PER_DAY * age_days(n))
      liability_index_rolling = round_half_up(Σ over events_r [ weight(n) * decay(n) ], 2)

      # ---- variant LIFETIME_CUMULATIVE -> Customer.liability_index_lifetime ----
      events_l = { n : resolved(n) }                      # no window filter
      liability_index_lifetime = round_half_up(Σ over events_l [ weight(n) ], 2)   # no decay

      # ---- tier + window (rolling ONLY) ---------------------------------------
      offender_tier = TIER_3 if liability_index_rolling >= TIER_3_MIN
                      TIER_2 if liability_index_rolling >= TIER_2_MIN
                      TIER_1 if liability_index_rolling >= TIER_1_MIN
                      else TIER_0
      dispute_window_days = BASE_DISPUTE_WINDOW_DAYS - TIER_WINDOW_STEP_DAYS * tier_ordinal(offender_tier)
      # tier_ordinal: TIER_0 -> 0, TIER_1 -> 1, TIER_2 -> 2, TIER_3 -> 3
    input_set: >-
      CorrectionNotice rows whose shipment belongs to this customer and whose status is UPHELD or
      PARTIALLY_OVERTURNED. OVERTURNED, VOID, DRAFT, ISSUED, DISPUTED and EVIDENCE_REQUESTED notices
      never contribute to either variant.
    constants:
      ROLLING_WINDOW_DAYS: 90
      DECAY_PER_DAY: 0.01
      DECAY_FLOOR: 0.25
      UPHELD_WEIGHT: 1.0
      PARTIAL_WEIGHT: 0.5
      TIER_1_MIN: 1.00
      TIER_2_MIN: 3.00
      TIER_3_MIN: 6.00
      BASE_DISPUTE_WINDOW_DAYS: 30
      TIER_WINDOW_STEP_DAYS: 5
    precision: "both indices round_half_up to 2 decimals; tier thresholds compare the rounded rolling index"
    variants:
      - name: ROLLING_WINDOW
        when: "Drives offender_tier and dispute_window_days."
        difference: "90-day window plus per-day decay floored at 0.25 — an old strike contributes nothing."
      - name: LIFETIME_CUMULATIVE
        when: "Reported to the account team as the customer's all-time classification-accuracy record."
        difference: "No window and no decay — every historical strike still counts at full weight, so the two indices diverge and the tier NEVER reads this one."

  - name: migration_impact_model
    trigger: "On POST /ltl/rate-programs/{id}/approve and on POST /ltl/repricing-runs/{id}/model and /commit."
    algorithm: tiered_pricing
    formula: |
      program  = the candidate RateProgram
      shipments = { s : s.customer_id == program.customer_id
                        AND s.billing_status IN {BILLED, REBILLED, CREDITED, CLOSED} }
                  iterated in ascending created_at
      modeled_shipment_count  = |shipments|
      baseline_revenue_cents  = Σ s.assessed_total_cents

      if modeled_shipment_count == 0:
          modeled_annual_revenue_cents = 0
          modeled_delta_pct            = 0.0000        # exact literal, no division
      else:
          # ---- PASS 1: undiscounted gross decides the volume tier --------------
          gross(s) = round_half_up(Σ over lines [ (rating_weight/100) * program.base_rate_per_cwt_cents
                                                  * (modeled_class/100) * wbf(s) ], 0)
                     # discount_pct = 0 and min_charge_cents NOT applied in pass 1
          annual_gross = Σ gross(s)
          volume_tier  = factor of the FIRST VOLUME_TIER_DISCOUNTS element
                         whose min_annual_gross_cents <= annual_gross

          # ---- PASS 2: contract discount, then the volume tier ----------------
          modeled(s) = max(program.min_charge_cents,
                           round_half_up(shipment_charge_raw(s, mode MODELED) * (1 - volume_tier), 0))
          modeled_annual_revenue_cents = Σ modeled(s)
          modeled_delta_pct = round_half_up((modeled_annual_revenue_cents - baseline_revenue_cents)
                                            / baseline_revenue_cents, 4)

      # The tier is derived ONCE from the pass-1 undiscounted gross. The model does NOT
      # re-derive the tier from the discounted pass-2 revenue and does NOT iterate to a
      # fixed point — deriving the tier from discounted revenue is a different (wrong) answer.

      migration_recommendation = MIGRATE_DENSITY_BASED if modeled_delta_pct >= MIGRATE_THRESHOLD
                                 HOLD_CLASS_BASED     if modeled_delta_pct <= HOLD_THRESHOLD
                                 else NEGOTIATE_FAK
    input_set: >-
      Only the customer's shipments whose billing_status is BILLED, REBILLED, CREDITED or CLOSED.
      UNBILLED shipments are excluded from both the baseline and the model.
    constants:
      VOLUME_TIER_DISCOUNTS:
        - { min_annual_gross_cents: 5000000, factor: 0.12 }
        - { min_annual_gross_cents: 2000000, factor: 0.08 }
        - { min_annual_gross_cents: 500000,  factor: 0.04 }
        - { min_annual_gross_cents: 0,       factor: 0.00 }
      MIGRATE_THRESHOLD: 0.05
      HOLD_THRESHOLD: -0.05
      REPRICING_BUFFER_HOURS: 24
    precision: "gross and modeled amounts round_half_up to whole cents; modeled_delta_pct round_half_up to 4 decimals"

  - name: dispute_window_deadline
    trigger: "On CorrectionNotice issuance and on every supplement request against it."
    algorithm: interval_merge
    formula: |
      # Ordering pin: the issuance cascade FIRST recomputes shipper_liability_index (both
      # variants), offender_tier and Customer.dispute_window_days, and THEN stamps the
      # deadline from the freshly recomputed window. Reading the pre-issuance window is a
      # different (wrong) answer whenever the recompute changes the tier.
      base_days = Customer.dispute_window_days as recomputed by this issuance
      dispute_deadline_at = notice.issued_at
                            + base_days days
                            + SUPPLEMENT_EXTENSION_DAYS * notice.supplement_request_count days

      A dispute filing is inside the window when: now <= dispute_deadline_at (inclusive).
      A sweep may resolve the notice as UPHELD when: now > dispute_deadline_at (strict).
      supplement_request_count can never exceed MAX_SUPPLEMENT_REQUESTS, so the deadline can be
      extended at most MAX_SUPPLEMENT_REQUESTS * SUPPLEMENT_EXTENSION_DAYS days beyond the base window.
    input_set: "One CorrectionNotice and the snapshot of Customer.dispute_window_days taken at issuance."
    constants:
      SUPPLEMENT_EXTENSION_DAYS: 7
      MAX_SUPPLEMENT_REQUESTS: 2
      MAX_DISPUTE_ROUNDS: 3
    precision: "whole days added to an ISO-8601 UTC instant; the boundary instant itself is inside the filing window"

  - name: credit_allocation_waterfall
    trigger: "On POST /ltl/disputes/{id}/resolve when outcome is OVERTURNED or PARTIAL."
    algorithm: waterfall_allocation
    formula: |
      notice = CorrectionNotice(dispute.correction_notice_id)

      entitlement is allocated across three ordered buckets; each bucket is filled completely
      before the next is considered, and the third bucket's overflow is DROPPED (not reallocated):

      # bucket 1 — freight
      freight_credit_cents = (outcome == OVERTURNED)
                             ? notice.applied_delta_cents
                             : shipment_charge(mode RECLASSED, at the frozen classes)
                               - shipment_charge(mode RECLASSED, substituting dispute.outcome_class_code
                                                 on every line whose effective_class_code was raised by the notice)
      # bucket 2 — accessorial fee (only a full overturn refunds the inspection fee)
      fee_credit_cents     = (outcome == OVERTURNED) ? notice.inspection_fee_cents : 0
      # bucket 3 — goodwill interest, capped
      uncapped_interest    = round_half_up(freight_credit_cents * INTEREST_RATE_PER_ROUND
                                           * notice.dispute_round_count, 0)
      interest_credit_cents = min(uncapped_interest, INTEREST_CAP_CENTS)

      amount_cents = freight_credit_cents + fee_credit_cents + interest_credit_cents

      # Money conservation: only buckets 1 and 2 touch the shipment ledger.
      Shipment.assessed_total_cents = Shipment.original_charge_cents
        + Σ over notices n IN {ISSUED, DISPUTED, EVIDENCE_REQUESTED, UPHELD, PARTIALLY_OVERTURNED, OVERTURNED}
            (n.applied_delta_cents + n.inspection_fee_cents)
        - Σ over their CreditMemos c (c.freight_credit_cents + c.fee_credit_cents)
      # interest_credit_cents is deliberately OUTSIDE the ledger identity, so a full overturn
      # returns assessed_total_cents exactly to original_charge_cents.
    input_set: "The resolved Dispute, its CorrectionNotice's frozen amounts, and the shipment's lines at the frozen classification."
    constants:
      INTEREST_RATE_PER_ROUND: 0.005
      INTEREST_CAP_CENTS: 250
    precision: "interest round_half_up to whole cents before the cap comparison; all buckets are whole cents"

  - name: capture_variance_gate
    trigger: "On every POST /ltl/capture-events, before the correction-notice cascade decides whether to fire."
    algorithm: threshold
    formula: |
      delta_lb     = abs(capture.measured_total_weight_lb - shipment.declared_total_weight_lb)
      variance_pct = round_half_up(delta_lb / shipment.declared_total_weight_lb * 100, 2)

      reweigh_required = (variance_pct >= REWEIGH_VARIANCE_PCT) AND (delta_lb >= REWEIGH_MIN_ABS_LB)
      # CONJUNCTION with two inclusive boundaries: a 2.00% variance of only 9 lb does not
      # trigger, and a 10 lb variance that is only 1.00% does not trigger either.

      triggered_reclass    = ∃ line of the shipment with found_class_code != declared_class_code
                             after this capture is applied
      reclassed_line_count = count of such lines
      notice fires (status DRAFT) when reweigh_required OR triggered_reclass
      notice_type = BOTH    if reweigh_required AND triggered_reclass
                    RECLASS if triggered_reclass only
                    REWEIGH if reweigh_required only
    input_set: "The capture's own measured_total_weight_lb versus Shipment.declared_total_weight_lb (the sum of line declared weights, NOT bol_declared_total_weight_lb), plus the post-capture line classes."
    constants:
      REWEIGH_VARIANCE_PCT: 2.00
      REWEIGH_MIN_ABS_LB: 10
    precision: "variance_pct round_half_up to 2 decimals; comparisons are inclusive (>=)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every path-templated id resolves to an existing row, validated left-to-right"
    error_id: ERR_TERMINAL_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_TARIFF_VERSION_NOT_FOUND | ERR_COMMODITY_PROFILE_NOT_FOUND | ERR_RATE_PROGRAM_NOT_FOUND | ERR_EXCEPTION_AGREEMENT_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_SHIPMENT_LINE_NOT_FOUND | ERR_CAPTURE_EVENT_NOT_FOUND | ERR_INSPECTION_FINDING_NOT_FOUND | ERR_CORRECTION_NOTICE_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_CREDIT_MEMO_NOT_FOUND | ERR_REPRICING_RUN_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the order the fields are listed in the endpoint's input"
    error_id: ERR_CUSTOMER_NOT_FOUND | ERR_TARIFF_VERSION_NOT_FOUND | ERR_COMMODITY_PROFILE_NOT_FOUND | ERR_TERMINAL_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_SHIPMENT_LINE_NOT_FOUND | ERR_CAPTURE_EVENT_NOT_FOUND | ERR_CORRECTION_NOTICE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying FK fields in the body"

  - priority: 5
    category: auth
    check: >-
      entity-backed ownership: a Shipper's X-User-ID must equal the customer_id of the shipment,
      notice or dispute addressed; a TerminalOperator's X-User-ID must equal the addressed shipment's
      origin_terminal_id
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /ltl/shipments, POST /ltl/shipments/{id}/lines, POST /ltl/capture-events, POST /ltl/disputes, POST /ltl/disputes/{id}/supplement, GET on shipper-owned resources"

  - priority: 6
    category: business_constraint
    check: "request shape: required fields present, types correct, enum members valid, numeric ranges honored (discount_pct 0..0.75, pieces >= 1, weights >= 1, limit 1..100)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 7
    category: business_constraint
    check: "domain-typed shape checks: class codes are members of CLASS_CODES; dimensions are positive with at most one decimal; density_breaks strictly descending and terminating at 0; interval end strictly after start"
    error_id: ERR_INVALID_CLASS_CODE | ERR_INVALID_DIMENSIONS | ERR_INVALID_DENSITY_BREAKS | ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /ltl/tariff-versions, POST /ltl/commodity-profiles, POST /ltl/rate-programs, POST /ltl/exception-agreements, POST /ltl/shipments/{id}/lines, POST /ltl/inspection-findings, POST /ltl/disputes, POST /ltl/disputes/{id}/resolve, POST /ltl/repricing-runs"

  - priority: 8
    category: state
    check: "expected_<parent>_version matches the parent's current version (see §1.2.1)"
    error_id: ERR_STALE_CUSTOMER_VERSION | ERR_STALE_SHIPMENT_VERSION
    http_status: 412
    applies_to: "POST /ltl/rate-programs/{id}/activate, POST /ltl/customers/{id}/posture, POST /ltl/correction-notices"

  - priority: 9
    category: state
    check: "the target row is in a state from which this trigger is declared in §1.2"
    error_id: ERR_INVALID_STATE_TRANSITION | ERR_NOTICE_NOT_DISPUTABLE | ERR_SHIPMENT_NOT_BILLED | ERR_SHIPMENT_ALREADY_BILLED
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 10
    category: state
    check: >-
      cross-entity state preconditions: capturing terminal must be CALIBRATED; the customer must not
      be CLOSED for shipment creation, program approval/activation, exception approval or notice
      issuance; the customer must be OPEN (not CREDIT_HOLD) for shipment creation; the repricing run's
      tariff version must be PUBLISHED; the shipper's education_status must not be REQUIRED to file a
      dispute
    error_id: ERR_DEVICE_OUT_OF_CALIBRATION | ERR_CUSTOMER_CLOSED | ERR_CUSTOMER_CREDIT_HOLD | ERR_TARIFF_NOT_PUBLISHED | ERR_EDUCATION_HOLD
    http_status: 409
    applies_to: "POST /ltl/capture-events, POST /ltl/shipments, POST /ltl/rate-programs/{id}/approve, POST /ltl/rate-programs/{id}/activate, POST /ltl/exception-agreements/{id}/approve, POST /ltl/correction-notices/{id}/issue, POST /ltl/repricing-runs, POST /ltl/disputes"

  - priority: 11
    category: business_safety
    check: >-
      segregation of duties: the ClassificationAuditor accepting an InspectionFinding must not be its
      inspector_user_id; the DisputeReviewer requesting a supplement or resolving a dispute must not be
      the CorrectionNotice's issued_by_user_id
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /ltl/inspection-findings/{id}/accept, POST /ltl/disputes/{id}/request-supplement, POST /ltl/disputes/{id}/resolve"

  - priority: 12
    category: business_safety
    check: "evidence sufficiency: a finding needs evidence_photo_count >= MIN_FINDING_PHOTOS to be accepted; a notice needs evidence_bundle_count >= MIN_EVIDENCE_BUNDLE to be issued; a dispute needs evidence_doc_count >= MIN_DISPUTE_DOCS to be filed"
    error_id: ERR_INSUFFICIENT_EVIDENCE
    http_status: 422
    applies_to: "POST /ltl/inspection-findings/{id}/accept, POST /ltl/correction-notices/{id}/issue, POST /ltl/disputes"

  - priority: 13
    category: business_temporal
    check: "a dispute may only be filed while current logical time <= dispute_deadline_at; a tariff version may only be published when its effective_at is strictly after the current newest PUBLISHED version's effective_at"
    error_id: ERR_DISPUTE_WINDOW_CLOSED | ERR_TARIFF_EFFECTIVE_CONFLICT
    http_status: 409
    applies_to: "POST /ltl/disputes, POST /ltl/tariff-versions/{id}/publish"

  - priority: 14
    category: business_constraint
    check: "uniqueness: Terminal.code, Customer.account_code, TariffVersion.code, Shipment.pro_number globally unique; ShipmentLine.line_no unique within its shipment"
    error_id: ERR_DUPLICATE_PRO_NUMBER | ERR_DUPLICATE_LINE_NO | ERR_INVALID_REQUEST
    http_status: 409
    applies_to: "POST /ltl/terminals, POST /ltl/customers, POST /ltl/tariff-versions, POST /ltl/shipments, POST /ltl/shipments/{id}/lines"

  - priority: 15
    category: business_constraint
    check: >-
      interval overlap: no two ExceptionAgreements in status PENDING or ACTIVE may overlap on the same
      (customer_id, commodity_profile_id) using half-open [effective_from, effective_to) semantics
      (touching endpoints are allowed); no two RepricingRuns in status DRAFT or MODELED may have sample
      windows within REPRICING_BUFFER_HOURS of each other for the same new_tariff_version_id using
      closed [start, end] semantics
    error_id: ERR_EXCEPTION_OVERLAP | ERR_REPRICING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /ltl/exception-agreements, POST /ltl/repricing-runs"

  - priority: 16
    category: business_constraint
    check: "round and cardinality limits: dispute_round_count < MAX_DISPUTE_ROUNDS, supplement_request_count < MAX_SUPPLEMENT_REQUESTS, and a shipment may carry at most one notice in status DRAFT/ISSUED/DISPUTED/EVIDENCE_REQUESTED unless the new notice supersedes the open DRAFT one"
    error_id: ERR_MAX_DISPUTE_ROUNDS | ERR_OPEN_NOTICE_EXISTS
    http_status: 409
    applies_to: "POST /ltl/disputes, POST /ltl/disputes/{id}/supplement, POST /ltl/disputes/{id}/request-supplement, POST /ltl/correction-notices"

  - priority: 17
    category: business_referential
    check: >-
      referential coherence: every line_measurements[].line_no must exist on the shipment; a line's
      CommodityProfile must belong to the shipment's pinned tariff_version_id; a manual notice must
      cite a basis_capture_event_id belonging to its own shipment or an ACCEPTED finding on one of its
      lines; a PARTIAL resolution must carry outcome_class_code and an UPHELD_CARRIER / OVERTURNED
      resolution must not
    error_id: ERR_LINE_NO_MISMATCH | ERR_TARIFF_MISMATCH | ERR_NO_RECLASS_BASIS | ERR_INVALID_PARTIAL_OUTCOME
    http_status: 422
    applies_to: "POST /ltl/capture-events, POST /ltl/shipments/{id}/lines, POST /ltl/correction-notices, POST /ltl/disputes/{id}/resolve"

  - priority: 18
    category: business_fiscal
    check: >-
      fiscal preconditions: the customer must have an ACTIVE RateProgram to tender a shipment; a
      PUBLISHED TariffVersion effective at or before pickup_at must exist; a notice whose
      final_delta_cents is exactly 0 cannot be issued; a shipment with zero lines cannot be billed
    error_id: ERR_NO_ACTIVE_RATE_PROGRAM | ERR_NO_EFFECTIVE_TARIFF | ERR_ZERO_DELTA_NOTICE | ERR_NO_SHIPMENT_LINES
    http_status: 422
    applies_to: "POST /ltl/shipments, POST /ltl/rate-programs/{id}/approve, POST /ltl/correction-notices/{id}/issue, POST /ltl/shipments/{id}/bill"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- test-driving clock ----------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z;
      before any call to this endpoint every timestamp the server stamps (created_at, captured_at,
      issued_at, resolved_at, deadlines, decay ages) reads from that fixed default and never from real
      wall-clock time.
    roles: [PricingAnalyst]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["moves the logical clock; subsequent stamps and window comparisons use the new value"]

  # ---- terminals -------------------------------------------------------------
  - method: POST
    path: "/ltl/terminals"
    description: "Registers a terminal with its dimensioner calibration interval."
    roles: [PricingAnalyst]
    code: 201
    input: [code, name, "calibration_interval_captures?"]
    output: Terminal
    side_effects: ["initialises captures_since_calibration to 0 and dimensioner_status to CALIBRATED"]

  - method: GET
    path: "/ltl/terminals/{id}"
    description: "Reads one terminal including its live calibration counters."
    roles: [PricingAnalyst, TerminalOperator, ClassificationAuditor]
    code: 200
    input: []
    output: Terminal
    side_effects: []

  # ---- customers -------------------------------------------------------------
  - method: POST
    path: "/ltl/customers"
    description: "Registers a shipper account."
    roles: [PricingAnalyst]
    code: 201
    input: [account_code, name, "education_strike_interval?"]
    output: Customer
    side_effects: ["sets billing_posture OPEN, education_status NONE, education_threshold_strikes = education_strike_interval, offender_tier TIER_0, dispute_window_days 30"]

  - method: GET
    path: "/ltl/customers/{id}"
    description: "Reads one shipper account including both liability indices, tier and dispute window."
    roles: [PricingAnalyst, ClassificationAuditor, DisputeReviewer, Shipper]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/ltl/customers/{id}/posture"
    description: "Moves the customer's credit posture; OCC-guarded on Customer.version (§1.2.1 posture-change-stale-customer)."
    roles: [PricingAnalyst]
    code: 200
    input: [billing_posture, expected_customer_version]
    output: Customer
    side_effects: ["advances Customer.billing_posture", "increments Customer.version by 1"]

  - method: POST
    path: "/ltl/customers/{id}/education/complete"
    description: "Records completion of mandatory classification education for a repeat offender."
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: Customer
    side_effects: ["sets education_status COMPLETED", "raises education_threshold_strikes to offender_strike_count + education_strike_interval", "increments Customer.version by 1"]

  # ---- tariff versions -------------------------------------------------------
  - method: POST
    path: "/ltl/tariff-versions"
    description: "Drafts a classification standard release with its density bracket table."
    roles: [PricingAnalyst]
    code: 201
    input: [code, effective_at, density_breaks]
    output: TariffVersion
    side_effects: ["creates the version in status DRAFT"]

  - method: GET
    path: "/ltl/tariff-versions/{id}"
    description: "Reads one classification standard release."
    roles: [PricingAnalyst, ClassificationAuditor]
    code: 200
    input: []
    output: TariffVersion
    side_effects: []

  - method: GET
    path: "/ltl/tariff-versions"
    description: "Lists classification standard releases; filter by status or by the version that superseded them."
    roles: [PricingAnalyst, ClassificationAuditor]
    code: 200
    input: ["status?", "superseded_by_tariff_version_id?", "limit?", "offset?"]
    output: TariffVersion[]
    side_effects: []

  - method: POST
    path: "/ltl/tariff-versions/{id}/publish"
    description: "Publishes a drafted standard, superseding the previous newest published one."
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: TariffVersion
    side_effects: ["sets status PUBLISHED and published_at", "sets the previous newest PUBLISHED version to SUPERSEDED and stamps its superseded_by_tariff_version_id"]

  # ---- commodity profiles ----------------------------------------------------
  - method: POST
    path: "/ltl/commodity-profiles"
    description: "Adds a commodity item to a DRAFT classification standard; the characteristic floor is computed here."
    roles: [PricingAnalyst]
    code: 201
    input: [tariff_version_id, nmfc_item, description, classification_basis, "fixed_class_code?", "handling_code?", "stowability_code?", "liability_code?"]
    output: CommodityProfile
    side_effects: ["computes min_class_floor from the handling, stowability and liability codes"]

  - method: GET
    path: "/ltl/commodity-profiles/{id}"
    description: "Reads one commodity profile including its computed class floor."
    roles: [PricingAnalyst, ClassificationAuditor, FreightInspector, Shipper]
    code: 200
    input: []
    output: CommodityProfile
    side_effects: []

  - method: GET
    path: "/ltl/commodity-profiles"
    description: "Lists commodity profiles; filter by tariff version or classification basis."
    roles: [PricingAnalyst, ClassificationAuditor, FreightInspector, Shipper]
    code: 200
    input: ["tariff_version_id?", "classification_basis?", "limit?", "offset?"]
    output: CommodityProfile[]
    side_effects: []

  # ---- rate programs ---------------------------------------------------------
  - method: POST
    path: "/ltl/rate-programs"
    description: "Drafts a pricing program (class-based, density-based or freight-all-kinds) for a shipper."
    roles: [PricingAnalyst]
    code: 201
    input: [customer_id, program_type, base_rate_per_cwt_cents, discount_pct, min_charge_cents, "fak_class_code?"]
    output: RateProgram
    side_effects: ["creates the program in status MODELING with a zeroed impact model"]

  - method: GET
    path: "/ltl/rate-programs/{id}"
    description: "Reads one pricing program including its modelled migration impact."
    roles: [PricingAnalyst, ClassificationAuditor]
    code: 200
    input: []
    output: RateProgram
    side_effects: []

  - method: GET
    path: "/ltl/rate-programs"
    description: "Lists pricing programs; filter by customer, status, program type or pinned tariff version."
    roles: [PricingAnalyst, ClassificationAuditor]
    code: 200
    input: ["customer_id?", "status?", "program_type?", "pinned_tariff_version_id?", "limit?", "offset?"]
    output: RateProgram[]
    side_effects: []

  - method: POST
    path: "/ltl/rate-programs/{id}/approve"
    description: "Approves a program: pins the newest published standard and runs the customer impact model."
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: RateProgram
    side_effects: ["sets status APPROVED and pinned_tariff_version_id", "computes baseline_revenue_cents, modeled_annual_revenue_cents, modeled_delta_pct, modeled_shipment_count and migration_recommendation"]

  - method: POST
    path: "/ltl/rate-programs/{id}/activate"
    description: "Activates an approved program, retiring the customer's previous active program; OCC-guarded on Customer.version (§1.2.1 program-activate-stale-customer)."
    roles: [PricingAnalyst]
    code: 200
    input: [expected_customer_version]
    output: RateProgram
    side_effects: ["sets status ACTIVE and effective_from", "retires the previously ACTIVE program and stamps its effective_to", "sets Customer.active_program_type", "increments Customer.version by 1"]

  # ---- exception agreements --------------------------------------------------
  - method: POST
    path: "/ltl/exception-agreements"
    description: "Negotiates an exception class or freight-all-kinds arrangement for one commodity over a half-open interval."
    roles: [PricingAnalyst]
    code: 201
    input: [customer_id, commodity_profile_id, agreement_type, agreed_class_code, effective_from, effective_to]
    output: ExceptionAgreement
    side_effects: ["creates the agreement in status PENDING; the interval is immediately reserved against overlaps"]

  - method: GET
    path: "/ltl/exception-agreements/{id}"
    description: "Reads one negotiated exception agreement."
    roles: [PricingAnalyst, ClassificationAuditor]
    code: 200
    input: []
    output: ExceptionAgreement
    side_effects: []

  - method: GET
    path: "/ltl/exception-agreements"
    description: "Lists exception agreements; filter by customer, commodity profile or status."
    roles: [PricingAnalyst, ClassificationAuditor]
    code: 200
    input: ["customer_id?", "commodity_profile_id?", "status?", "limit?", "offset?"]
    output: ExceptionAgreement[]
    side_effects: []

  - method: POST
    path: "/ltl/exception-agreements/{id}/approve"
    description: "Approves a pending exception agreement so it starts overriding classification."
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: ExceptionAgreement
    side_effects: ["sets status ACTIVE, approved_by_user_id and approved_at"]

  # ---- shipments -------------------------------------------------------------
  - method: POST
    path: "/ltl/shipments"
    description: "Tenders a bill of lading; pins the customer's active rate program and the standard effective at pickup."
    roles: [Shipper]
    code: 201
    input: [customer_id, origin_terminal_id, pro_number, pickup_at, bol_declared_total_weight_lb]
    output: Shipment
    side_effects: ["pins rate_program_id and tariff_version_id", "creates the shipment in class_status DECLARED and billing_status UNBILLED"]

  - method: GET
    path: "/ltl/shipments/{id}"
    description: "Reads one shipment including both status dimensions and the money fields."
    roles: [Shipper, PricingAnalyst, ClassificationAuditor, TerminalOperator, DisputeReviewer, FreightInspector]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/ltl/shipments"
    description: "Lists shipments; filter by customer, origin terminal, pinned program, pinned tariff version or either status dimension."
    roles: [Shipper, PricingAnalyst, ClassificationAuditor, TerminalOperator, DisputeReviewer, FreightInspector]
    code: 200
    input: ["customer_id?", "origin_terminal_id?", "rate_program_id?", "tariff_version_id?", "class_status?", "billing_status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/ltl/shipments/{id}/lines"
    description: "Adds a bill-of-lading line with its declared class, weight, pieces and dimensions."
    roles: [Shipper]
    code: 201
    input: [line_no, commodity_profile_id, declared_class_code, declared_weight_lb, pieces, declared_length_in, declared_width_in, declared_height_in]
    output: ShipmentLine
    side_effects: ["computes declared_cubic_ft, declared_density_pcf, effective_class_code, classification_source, class_floor_applied", "recomputes Shipment.line_count and declared_total_weight_lb"]

  - method: GET
    path: "/ltl/shipment-lines/{id}"
    description: "Reads one bill-of-lading line including declared and measured cube, density and resolved class."
    roles: [Shipper, PricingAnalyst, ClassificationAuditor, FreightInspector, TerminalOperator, DisputeReviewer]
    code: 200
    input: []
    output: ShipmentLine
    side_effects: []

  - method: GET
    path: "/ltl/shipment-lines"
    description: "Lists bill-of-lading lines; filter by shipment or commodity profile."
    roles: [Shipper, PricingAnalyst, ClassificationAuditor, FreightInspector, TerminalOperator, DisputeReviewer]
    code: 200
    input: ["shipment_id?", "commodity_profile_id?", "limit?", "offset?"]
    output: ShipmentLine[]
    side_effects: []

  - method: POST
    path: "/ltl/shipments/{id}/bill"
    description: "Bills the shipment on the declared basis."
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: Shipment
    side_effects: ["computes original_charge_cents and sets assessed_total_cents equal to it", "advances billing_status to BILLED and sets billed_at"]

  - method: POST
    path: "/ltl/shipments/{id}/close"
    description: "Closes the shipment, confirming its classification and freezing its ledger."
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: Shipment
    side_effects: ["advances billing_status to CLOSED and class_status to CLASS_CONFIRMED"]

  # ---- capture events --------------------------------------------------------
  - method: POST
    path: "/ltl/capture-events"
    description: "Records a dimensioner and/or scale capture at the terminal, driving automated reweigh and reclass."
    roles: [TerminalOperator]
    code: 201
    input: [shipment_id, device_type, measured_total_weight_lb, line_measurements]
    output: CaptureEvent
    side_effects: ["writes measured dimensions and weights onto the addressed ShipmentLines and recomputes their cube, density and class", "recomputes Shipment.measured_total_weight_lb, weight_variance_pct, reweigh_required, declared_vs_found_class_delta_count and class_status", "increments Terminal.captures_since_calibration and sets last_capture_at", "creates a DRAFT CorrectionNotice with origin AUTOMATED_CAPTURE when the variance gate or a class delta fires, incrementing Shipment.open_notice_count and Shipment.version"]

  - method: GET
    path: "/ltl/capture-events/{id}"
    description: "Reads one capture event including its variance and reclass outcome."
    roles: [TerminalOperator, ClassificationAuditor, PricingAnalyst, DisputeReviewer]
    code: 200
    input: []
    output: CaptureEvent
    side_effects: []

  - method: GET
    path: "/ltl/capture-events"
    description: "Lists capture events; filter by shipment or by capturing terminal."
    roles: [TerminalOperator, ClassificationAuditor, PricingAnalyst, DisputeReviewer]
    code: 200
    input: ["shipment_id?", "terminal_id?", "limit?", "offset?"]
    output: CaptureEvent[]
    side_effects: []

  # ---- inspection findings ---------------------------------------------------
  - method: POST
    path: "/ltl/inspection-findings"
    description: "Records an inspector's classification finding against one bill-of-lading line."
    roles: [FreightInspector]
    code: 201
    input: [shipment_line_id, finding_basis, found_class_code, "found_commodity_profile_id?", "evidence_photo_count?", "notes?"]
    output: InspectionFinding
    side_effects: ["creates the finding in status RECORDED and stamps inspector_user_id", "advances Shipment.class_status to UNDER_INSPECTION"]

  - method: GET
    path: "/ltl/inspection-findings/{id}"
    description: "Reads one inspection finding."
    roles: [FreightInspector, ClassificationAuditor, DisputeReviewer]
    code: 200
    input: []
    output: InspectionFinding
    side_effects: []

  - method: GET
    path: "/ltl/inspection-findings"
    description: "Lists inspection findings; filter by line, by re-assigned commodity profile or by status."
    roles: [FreightInspector, ClassificationAuditor, DisputeReviewer]
    code: 200
    input: ["shipment_line_id?", "found_commodity_profile_id?", "status?", "limit?", "offset?"]
    output: InspectionFinding[]
    side_effects: []

  - method: POST
    path: "/ltl/inspection-findings/{id}/accept"
    description: "Accepts an inspector's finding into the classification of record; segregation of duties applies."
    roles: [ClassificationAuditor]
    code: 200
    input: []
    output: InspectionFinding
    side_effects: ["sets status ACCEPTED, accepted_by_user_id and accepted_at", "marks the previous ACCEPTED finding on the same line SUPERSEDED", "rewrites the line's found_class_code, effective_class_code, classification_source and line_charge_cents", "advances Shipment.class_status to RECLASS_PENDING"]

  # ---- correction notices ----------------------------------------------------
  - method: POST
    path: "/ltl/correction-notices"
    description: "Drafts a correction notice manually; OCC-guarded on Shipment.version (§1.2.1 notice-create-stale-shipment)."
    roles: [ClassificationAuditor]
    code: 201
    input: [shipment_id, notice_type, expected_shipment_version, "basis_capture_event_id?", "supersedes_notice_id?"]
    output: CorrectionNotice
    side_effects: ["computes provisional_delta_cents, final_delta_cents, evidence_bundle_count, uses_inspection_findings", "voids the superseded DRAFT notice when supersedes_notice_id is given", "recomputes Shipment.open_notice_count and increments Shipment.version by 1"]

  - method: GET
    path: "/ltl/correction-notices/{id}"
    description: "Reads one correction notice including both delta variants, the frozen amounts and the dispute deadline."
    roles: [ClassificationAuditor, DisputeReviewer, Shipper, PricingAnalyst]
    code: 200
    input: []
    output: CorrectionNotice
    side_effects: []

  - method: GET
    path: "/ltl/correction-notices"
    description: "Lists correction notices; filter by shipment, status, cited capture event or superseded notice."
    roles: [ClassificationAuditor, DisputeReviewer, Shipper, PricingAnalyst]
    code: 200
    input: ["shipment_id?", "status?", "basis_capture_event_id?", "supersedes_notice_id?", "limit?", "offset?"]
    output: CorrectionNotice[]
    side_effects: []

  - method: POST
    path: "/ltl/correction-notices/{id}/issue"
    description: "Issues the notice to the shipper with its supporting evidence, freezing the billed amounts and opening the dispute window."
    roles: [ClassificationAuditor]
    code: 200
    input: []
    output: CorrectionNotice
    side_effects: ["freezes applied_delta_cents and inspection_fee_cents; sets issued_at, issued_by_user_id, dispute_deadline_at", "advances Shipment.billing_status to REBILLED, class_status to RECLASSED, recomputes assessed_total_cents", "increments Customer.offender_strike_count, recomputes both liability indices, offender_tier and dispute_window_days, and flips education_status to REQUIRED at the strike threshold"]

  - method: POST
    path: "/ltl/notice-sweeps"
    description: "Operations sweep that closes every issued notice whose dispute window has elapsed unchallenged."
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: "{ swept_count: integer, upheld_notice_ids: string[] }"
    side_effects: ["sets status UPHELD and resolved_at on every ISSUED notice past its dispute_deadline_at with no Dispute", "recomputes the affected customers' liability indices, offender_tier and dispute_window_days"]

  # ---- disputes --------------------------------------------------------------
  - method: POST
    path: "/ltl/disputes"
    description: "Files a shipper dispute against an issued correction notice inside its dispute window."
    roles: [Shipper]
    code: 201
    input: [correction_notice_id, claim_basis, evidence_doc_count, "claimed_class_code?"]
    output: Dispute
    side_effects: ["creates the dispute in status OPEN with round_no 1 and stamps filed_by_customer_id and filed_at", "advances the notice to DISPUTED and increments its dispute_round_count"]

  - method: GET
    path: "/ltl/disputes/{id}"
    description: "Reads one dispute including its round number and outcome."
    roles: [Shipper, DisputeReviewer, ClassificationAuditor, PricingAnalyst]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/ltl/disputes"
    description: "Lists disputes; filter by notice, filing customer or status."
    roles: [Shipper, DisputeReviewer, ClassificationAuditor, PricingAnalyst]
    code: 200
    input: ["correction_notice_id?", "filed_by_customer_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []

  - method: POST
    path: "/ltl/disputes/{id}/request-supplement"
    description: "Reviewer asks the shipper for more evidence, extending the dispute window."
    roles: [DisputeReviewer]
    code: 200
    input: ["reason_note?"]
    output: Dispute
    side_effects: ["sets status SUPPLEMENT_REQUESTED and reviewer_user_id", "advances the notice to EVIDENCE_REQUESTED, increments supplement_request_count and extends dispute_deadline_at by 7 days"]

  - method: POST
    path: "/ltl/disputes/{id}/supplement"
    description: "Shipper supplies the requested supplemental evidence, opening another review round."
    roles: [Shipper]
    code: 200
    input: [additional_doc_count]
    output: Dispute
    side_effects: ["sets status SUPPLEMENTED, adds additional_doc_count to evidence_doc_count and increments round_no", "returns the notice to DISPUTED and increments its dispute_round_count"]

  - method: POST
    path: "/ltl/disputes/{id}/resolve"
    description: "Reviewer resolves the dispute; segregation of duties applies and the outcome drives the credit cascade."
    roles: [DisputeReviewer]
    code: 200
    input: [outcome, "outcome_class_code?", "resolution_note?"]
    output: Dispute
    side_effects: ["sets status RESOLVED, outcome, outcome_class_code, reviewer_user_id and resolved_at", "branches the notice to UPHELD, PARTIALLY_OVERTURNED or OVERTURNED", "on PARTIAL or OVERTURNED creates a CreditMemo via the allocation waterfall and advances Shipment.billing_status to CREDITED", "on OVERTURNED reverts every line to its declared classification, returns class_status to CAPTURED and decrements Customer.offender_strike_count", "recomputes both Customer liability indices, offender_tier and dispute_window_days"]

  # ---- credit memos ----------------------------------------------------------
  - method: GET
    path: "/ltl/credit-memos/{id}"
    description: "Reads one credit memo including the three waterfall buckets."
    roles: [PricingAnalyst, Shipper, DisputeReviewer]
    code: 200
    input: []
    output: CreditMemo
    side_effects: []

  - method: GET
    path: "/ltl/credit-memos"
    description: "Lists credit memos; filter by notice or customer. This is the only discovery channel for memos, which are created by the resolution cascade."
    roles: [PricingAnalyst, Shipper, DisputeReviewer]
    code: 200
    input: ["correction_notice_id?", "customer_id?", "limit?", "offset?"]
    output: CreditMemo[]
    side_effects: []

  # ---- repricing runs --------------------------------------------------------
  - method: POST
    path: "/ltl/repricing-runs"
    description: "Opens a repricing checkpoint for a published standard over a sample window."
    roles: [PricingAnalyst]
    code: 201
    input: [new_tariff_version_id, scope, sample_window_start_at, sample_window_end_at]
    output: RepricingRun
    side_effects: ["creates the run in status DRAFT and reserves its sample window against other runs on the same standard"]

  - method: GET
    path: "/ltl/repricing-runs/{id}"
    description: "Reads one repricing run including its aggregate impact."
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: RepricingRun
    side_effects: []

  - method: GET
    path: "/ltl/repricing-runs"
    description: "Lists repricing runs; filter by standard or status."
    roles: [PricingAnalyst]
    code: 200
    input: ["new_tariff_version_id?", "status?", "limit?", "offset?"]
    output: RepricingRun[]
    side_effects: []

  - method: POST
    path: "/ltl/repricing-runs/{id}/model"
    description: "Models the contract impact of adopting the new standard across the scoped active programs."
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: RepricingRun
    side_effects: ["computes impacted_customer_count and aggregate_delta_cents", "sets status MODELED and modeled_at"]

  - method: POST
    path: "/ltl/repricing-runs/{id}/commit"
    description: "Commits the repricing: re-pins every scoped active program to the new standard and refreshes its impact model."
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: RepricingRun
    side_effects: ["re-pins pinned_tariff_version_id on every scoped ACTIVE RateProgram and recomputes its baseline, modelled revenue, delta and recommendation", "sets status COMMITTED and committed_at"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # -- auth / shape ----------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Shipper acts on a shipment, notice or dispute belonging to another customer, or a TerminalOperator captures a shipment whose origin_terminal_id is a different terminal"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown enum member, out-of-range numeric, or a duplicate value on a uniquely-constrained code field"
  # -- existence -------------------------------------------------------------
  - id: ERR_TERMINAL_NOT_FOUND
    http: 404
    condition: "the referenced terminal id does not exist"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "the referenced customer id does not exist"
  - id: ERR_TARIFF_VERSION_NOT_FOUND
    http: 404
    condition: "the referenced tariff version id does not exist"
  - id: ERR_COMMODITY_PROFILE_NOT_FOUND
    http: 404
    condition: "the referenced commodity profile id does not exist"
  - id: ERR_RATE_PROGRAM_NOT_FOUND
    http: 404
    condition: "the referenced rate program id does not exist"
  - id: ERR_EXCEPTION_AGREEMENT_NOT_FOUND
    http: 404
    condition: "the referenced exception agreement id does not exist"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "the referenced shipment id does not exist"
  - id: ERR_SHIPMENT_LINE_NOT_FOUND
    http: 404
    condition: "the referenced shipment line id does not exist"
  - id: ERR_CAPTURE_EVENT_NOT_FOUND
    http: 404
    condition: "the referenced capture event id does not exist"
  - id: ERR_INSPECTION_FINDING_NOT_FOUND
    http: 404
    condition: "the referenced inspection finding id does not exist"
  - id: ERR_CORRECTION_NOTICE_NOT_FOUND
    http: 404
    condition: "the referenced correction notice id does not exist"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "the referenced dispute id does not exist"
  - id: ERR_CREDIT_MEMO_NOT_FOUND
    http: 404
    condition: "the referenced credit memo id does not exist"
  - id: ERR_REPRICING_RUN_NOT_FOUND
    http: 404
    condition: "the referenced repricing run id does not exist"
  # -- domain-typed shape ----------------------------------------------------
  - id: ERR_INVALID_CLASS_CODE
    http: 422
    condition: "a class code field is not a member of CLASS_CODES"
  - id: ERR_INVALID_DIMENSIONS
    http: 422
    condition: "a declared or measured dimension is zero, negative, or carries more than one decimal place"
  - id: ERR_INVALID_DENSITY_BREAKS
    http: 422
    condition: "density_breaks is empty, not strictly descending by min_density_pcf, does not terminate at min_density_pcf 0, or names a class code outside CLASS_CODES"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "effective_to is not strictly after effective_from, or sample_window_end_at is not strictly after sample_window_start_at"
  # -- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_CUSTOMER_VERSION
    http: 412
    condition: "expected_customer_version does not match Customer.version"
  - id: ERR_STALE_SHIPMENT_VERSION
    http: 412
    condition: "expected_shipment_version does not match Shipment.version"
  # -- state -----------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the trigger is not declared from the row's current state (publishing a non-DRAFT tariff, activating a non-APPROVED program, accepting a non-RECORDED finding, issuing a non-DRAFT notice, supplementing a dispute that is not SUPPLEMENT_REQUESTED, resolving a RESOLVED dispute, committing a non-MODELED run, completing education that is not REQUIRED, adding a commodity profile to a non-DRAFT tariff, adding lines to a CLOSED shipment, or setting a posture transition not declared in §1.2)"
  - id: ERR_NOTICE_NOT_DISPUTABLE
    http: 409
    condition: "a dispute is filed against a notice whose status is not ISSUED"
  - id: ERR_SHIPMENT_NOT_BILLED
    http: 409
    condition: "a correction notice is issued against a shipment whose billing_status is UNBILLED, or a shipment is closed while still UNBILLED"
  - id: ERR_SHIPMENT_ALREADY_BILLED
    http: 409
    condition: "the shipment is billed a second time, or a line is added after billing"
  - id: ERR_OPEN_NOTICE_EXISTS
    http: 409
    condition: "a capture or manual notice would create a second open notice on a shipment that already carries one and the request does not supersede the open DRAFT notice"
  # -- cross-entity state ----------------------------------------------------
  - id: ERR_DEVICE_OUT_OF_CALIBRATION
    http: 409
    condition: "the capturing terminal's dimensioner_status is OUT_OF_CALIBRATION"
  - id: ERR_CUSTOMER_CREDIT_HOLD
    http: 409
    condition: "a shipment is tendered while the customer's billing_posture is CREDIT_HOLD"
  - id: ERR_CUSTOMER_CLOSED
    http: 409
    condition: "a shipment, program approval, program activation, exception approval or notice issuance is attempted while the customer's billing_posture is CLOSED"
  - id: ERR_EDUCATION_HOLD
    http: 409
    condition: "a shipper files a dispute while its education_status is REQUIRED"
  - id: ERR_TARIFF_NOT_PUBLISHED
    http: 409
    condition: "a repricing run cites a tariff version whose status is not PUBLISHED"
  # -- safety / evidence -----------------------------------------------------
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "an auditor accepts a finding they recorded, or a reviewer acts on a dispute against a notice they issued"
  - id: ERR_INSUFFICIENT_EVIDENCE
    http: 422
    condition: "evidence_photo_count below MIN_FINDING_PHOTOS at acceptance, evidence_bundle_count below MIN_EVIDENCE_BUNDLE at issuance, or evidence_doc_count below MIN_DISPUTE_DOCS at filing"
  # -- temporal --------------------------------------------------------------
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 409
    condition: "the current logical time is strictly after the notice's dispute_deadline_at"
  - id: ERR_TARIFF_EFFECTIVE_CONFLICT
    http: 409
    condition: "the published version's effective_at is not strictly after the current newest PUBLISHED version's effective_at"
  # -- constraint ------------------------------------------------------------
  - id: ERR_DUPLICATE_PRO_NUMBER
    http: 409
    condition: "pro_number already exists on another shipment"
  - id: ERR_DUPLICATE_LINE_NO
    http: 409
    condition: "line_no already exists on the same shipment"
  - id: ERR_EXCEPTION_OVERLAP
    http: 409
    condition: "the half-open interval overlaps another PENDING or ACTIVE agreement on the same (customer_id, commodity_profile_id)"
  - id: ERR_REPRICING_WINDOW_OVERLAP
    http: 409
    condition: "the closed sample window is within REPRICING_BUFFER_HOURS of another DRAFT or MODELED run on the same standard"
  - id: ERR_MAX_DISPUTE_ROUNDS
    http: 409
    condition: "dispute_round_count has reached MAX_DISPUTE_ROUNDS or supplement_request_count has reached MAX_SUPPLEMENT_REQUESTS"
  # -- referential -----------------------------------------------------------
  - id: ERR_LINE_NO_MISMATCH
    http: 422
    condition: "a line_measurements entry names a line_no that does not exist on the captured shipment"
  - id: ERR_TARIFF_MISMATCH
    http: 422
    condition: "the line's commodity profile belongs to a tariff version other than the shipment's pinned tariff_version_id"
  - id: ERR_NO_RECLASS_BASIS
    http: 422
    condition: "a manual correction notice cites neither a capture event of its own shipment nor an ACCEPTED inspection finding on one of its lines"
  - id: ERR_INVALID_PARTIAL_OUTCOME
    http: 422
    condition: "outcome PARTIAL without outcome_class_code, outcome UPHELD_CARRIER or OVERTURNED with one, or a PARTIAL outcome_class_code equal to the class the notice already assessed"
  # -- fiscal ----------------------------------------------------------------
  - id: ERR_NO_ACTIVE_RATE_PROGRAM
    http: 422
    condition: "the customer has no RateProgram in status ACTIVE at shipment tender"
  - id: ERR_NO_EFFECTIVE_TARIFF
    http: 422
    condition: "no PUBLISHED or SUPERSEDED tariff version has effective_at at or before pickup_at, or no PUBLISHED version exists at program approval"
  - id: ERR_ZERO_DELTA_NOTICE
    http: 422
    condition: "a notice whose final_delta_cents is exactly 0 is issued"
  - id: ERR_NO_SHIPMENT_LINES
    http: 422
    condition: "a shipment with line_count 0 is billed or captured"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PricingAnalyst
    description: "Owns standards, commodity profiles, pricing programs, negotiated exceptions, repricing runs, customer posture, education completion, billing and the ops sweep."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /ltl/terminals"
      - "POST /ltl/customers"
      - "POST /ltl/customers/{id}/posture"
      - "POST /ltl/customers/{id}/education/complete"
      - "POST /ltl/tariff-versions"
      - "POST /ltl/tariff-versions/{id}/publish"
      - "POST /ltl/commodity-profiles"
      - "POST /ltl/rate-programs"
      - "POST /ltl/rate-programs/{id}/approve"
      - "POST /ltl/rate-programs/{id}/activate"
      - "POST /ltl/exception-agreements"
      - "POST /ltl/exception-agreements/{id}/approve"
      - "POST /ltl/shipments/{id}/bill"
      - "POST /ltl/shipments/{id}/close"
      - "POST /ltl/notice-sweeps"
      - "POST /ltl/repricing-runs"
      - "POST /ltl/repricing-runs/{id}/model"
      - "POST /ltl/repricing-runs/{id}/commit"
      - "GET /ltl/repricing-runs/{id}"
      - "GET /ltl/repricing-runs"
    shared_operations:
      - "GET /ltl/terminals/{id}"
      - "GET /ltl/customers/{id}"
      - "GET /ltl/tariff-versions/{id}"
      - "GET /ltl/tariff-versions"
      - "GET /ltl/commodity-profiles/{id}"
      - "GET /ltl/commodity-profiles"
      - "GET /ltl/rate-programs/{id}"
      - "GET /ltl/rate-programs"
      - "GET /ltl/exception-agreements/{id}"
      - "GET /ltl/exception-agreements"
      - "GET /ltl/shipments/{id}"
      - "GET /ltl/shipments"
      - "GET /ltl/shipment-lines/{id}"
      - "GET /ltl/shipment-lines"
      - "GET /ltl/capture-events/{id}"
      - "GET /ltl/capture-events"
      - "GET /ltl/correction-notices/{id}"
      - "GET /ltl/correction-notices"
      - "GET /ltl/disputes/{id}"
      - "GET /ltl/disputes"
      - "GET /ltl/credit-memos/{id}"
      - "GET /ltl/credit-memos"

  - name: TerminalOperator
    description: "Dock operator whose X-User-ID is the terminal id; records dimensioner and scale captures for shipments originating at that terminal."
    identity: "entity_backed:Terminal"
    exclusive_operations:
      - "POST /ltl/capture-events"
    shared_operations:
      - "GET /ltl/terminals/{id}"
      - "GET /ltl/shipments/{id}"
      - "GET /ltl/shipments"
      - "GET /ltl/shipment-lines/{id}"
      - "GET /ltl/shipment-lines"
      - "GET /ltl/capture-events/{id}"
      - "GET /ltl/capture-events"

  - name: FreightInspector
    description: "Records classification findings on individual lines; may never accept its own finding."
    identity: opaque
    exclusive_operations:
      - "POST /ltl/inspection-findings"
    shared_operations:
      - "GET /ltl/inspection-findings/{id}"
