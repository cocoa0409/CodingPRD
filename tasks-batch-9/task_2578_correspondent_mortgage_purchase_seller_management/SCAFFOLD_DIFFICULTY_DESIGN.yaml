# ===========================================================================
# §1.8 Scaffold Difficulty Design — task 2578 correspondent mortgage purchase
# 9 rule_ids x >= 2 instances. Every literal in `assert:` was computed by
# executing the §1.3 formulas in code (Decimal, ROUND_HALF_UP).
# ===========================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: pair_off_fee_mandatory_mark_to_market_vs_best_efforts_admin_only
        grounds:
          - calculations.pair_off_fee_cents
          - state_machines.Commitment.LOCKED_to_PAIRED_OFF
          - entities.Commitment.fields.pair_off_method
          - entities.Seller.fields.fee_receivable_cents
        distinguishing_aspect: |
          Two commitments carrying identical notional (100000000), identical zero
          fulfilment and paired off at the identical market price 100.500 settle
          at 397400 cents under variant mandatory_mark_to_market and 25000 cents
          under variant best_efforts_admin_only — a 372400-cent divergence caused
          solely by commitment_type, because the best-efforts variant assesses no
          mark-to-market component at all.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "ProductEligibility CONF30F: base_price_pct 101.250, both commitment types allowed, one ACTIVE LLPA row (-50 bps) matching fico 700-739 and ltv (80.0, 85.0]"
            - "Seller APPROVED / GOOD_STANDING, approval_tier STANDARD, mandatory_exposure_limit_cents 3000000000, fee_receivable_cents 0"
            - "Commitment M: MANDATORY, notional 100000000, window 2026-08-01 -> 2026-08-31, commitment_price_pct 100.880, nothing delivered (available 100000000, tolerance 2000000)"
            - "Commitment B: BEST_EFFORTS, notional 100000000, same window, commitment_price_pct 100.280, nothing delivered"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/products"
              payload: { product_code: "CONF30F", base_price_pct: 101.250, min_fico: 680, max_ltv_pct: 95.0, max_loan_amount_cents: 76650000, allowed_commitment_types: ["MANDATORY", "BEST_EFFORTS"], allowed_occupancies: ["PRIMARY", "SECOND_HOME"], srp_pct: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { p_conf: $.data.id }
            - call: "POST /correspondent/products/${p_conf}/pricing-adjustments"
              payload: { adjustment_code: "LLPA-F700-L85", fico_min: 700, fico_max: 739, ltv_min_pct: 80.0, ltv_max_pct: 85.0, price_adjustment_bps: -50 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/financial-statements"
              payload: { fiscal_year_end: "2025-12-31", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { fs1: $.data.id }
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "ACCEPT" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s1}/qc-reviews"
              payload: { review_type: "PRE_APPROVAL" }
              as: QCReviewer
              as_user_id: "u-qc-1"
              captures: { q1: $.data.id }
            - call: "POST /correspondent/qc-reviews/${q1}/complete"
              payload: { findings_count: 2, critical_findings_count: 0 }
              as: QCReviewer
              as_user_id: "u-qc-1"
            - call: "POST /correspondent/sellers/${s1}/approval-decision"
              payload: { decision: "APPROVE" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_conf}", commitment_type: "MANDATORY", notional_amount_cents: 100000000, delivery_window_start: "2026-08-01", delivery_expiry_date: "2026-08-31", reference_fico: 720, reference_ltv_pct: 82.5 }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
              captures: { c_m: $.data.id }
            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_conf}", commitment_type: "BEST_EFFORTS", notional_amount_cents: 100000000, delivery_window_start: "2026-08-01", delivery_expiry_date: "2026-08-31", reference_fico: 720, reference_ltv_pct: 82.5 }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
              captures: { c_be: $.data.id }
          trigger:
            - call: "POST /correspondent/commitments/${c_m}/pair-off"
              payload: { pair_off_market_price_pct: 100.500 }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
            - call: "POST /correspondent/commitments/${c_be}/pair-off"
              payload: { pair_off_market_price_pct: 100.500 }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
          assert:
            - "Commitment.${c_m}.commitment_price_pct == 100.880 and Commitment.${c_be}.commitment_price_pct == 100.280"
            - "Commitment.${c_m}.tolerance_cents == 2000000 and Commitment.${c_be}.tolerance_cents == 2000000"
            - "Commitment.${c_m}.pair_off_fee_cents == 397400"
            - "Commitment.${c_m}.pair_off_method == MANDATORY_MARK_TO_MARKET"
            - "Commitment.${c_be}.pair_off_fee_cents == 25000"
            - "Commitment.${c_be}.pair_off_method == BEST_EFFORTS_ADMIN_ONLY"
            - "Commitment.${c_m}.pair_off_fee_cents - Commitment.${c_be}.pair_off_fee_cents == 372400"
            - "Commitment.${c_m}.status == PAIRED_OFF and Commitment.${c_be}.status == PAIRED_OFF"
            - "Commitment.${c_m}.paired_off_amount_cents == 100000000 and Commitment.${c_m}.available_amount_cents == 0"
            - "Seller.${s1}.fee_receivable_cents == 422400"
            - "Seller.${s1}.open_mandatory_exposure_cents == 0"

      - name: scorecard_defect_rate_loan_count_vs_upb_weighted
        grounds:
          - calculations.seller_defect_rate_bps
          - calculations.scorecard_standing_action
          - state_machines.SellerScorecard.OPEN_to_CLOSED
          - entities.SellerScorecard.fields.upb_weighted_defect_rate_bps
        distinguishing_aspect: |
          The same closed population of two purchased loans (defective 40000000
          UPB, clean 90000000 UPB) yields 5000 bps under the loan_count_weighted
          variant and 3077 bps under the upb_weighted variant, and the grade C
          plus the WATCH standing action are derived from the 5000 governing
          value, not from the smaller 3077 reporting value — a different entity
          domain (Seller/SellerScorecard) from the Commitment-domain pair-off
          dual variant.
        test_recipe:
          setup:
            - "logical clock reaches 2026-09-01T00:00:00Z by the end of the chain"
            - "Seller APPROVED / GOOD_STANDING with products CONF30F and JUMBO30F"
            - "Loan CONF (note 40000000) purchased 2026-08-05 carrying one WAIVED HIGH CREDIT defect -> defective"
            - "Loan JUMBO (note 90000000) purchased 2026-08-05 with no defects -> clean"
            - "SellerScorecard period 2026-08-01 .. 2026-08-31 still OPEN"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/products"
              payload: { product_code: "CONF30F", base_price_pct: 101.250, min_fico: 680, max_ltv_pct: 95.0, max_loan_amount_cents: 76650000, allowed_commitment_types: ["MANDATORY", "BEST_EFFORTS"], allowed_occupancies: ["PRIMARY", "SECOND_HOME"], srp_pct: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { p_conf: $.data.id }
            - call: "POST /correspondent/products"
              payload: { product_code: "JUMBO30F", base_price_pct: 100.500, min_fico: 720, max_ltv_pct: 80.0, max_loan_amount_cents: 250000000, allowed_commitment_types: ["MANDATORY"], allowed_occupancies: ["PRIMARY"], srp_pct: 0.750 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { p_jumbo: $.data.id }
            - call: "POST /correspondent/products/${p_conf}/pricing-adjustments"
              payload: { adjustment_code: "LLPA-F700-L85", fico_min: 700, fico_max: 739, ltv_min_pct: 80.0, ltv_max_pct: 85.0, price_adjustment_bps: -50 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/financial-statements"
              payload: { fiscal_year_end: "2025-12-31", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { fs1: $.data.id }
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "ACCEPT" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s1}/qc-reviews"
              payload: { review_type: "PRE_APPROVAL" }
              as: QCReviewer
              as_user_id: "u-qc-1"
              captures: { q1: $.data.id }
            - call: "POST /correspondent/qc-reviews/${q1}/complete"
              payload: { findings_count: 2, critical_findings_count: 0 }
              as: QCReviewer
              as_user_id: "u-qc-1"
            - call: "POST /correspondent/sellers/${s1}/approval-decision"
              payload: { decision: "APPROVE" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_conf}", commitment_type: "MANDATORY", notional_amount_cents: 40000000, delivery_window_start: "2026-08-01", delivery_expiry_date: "2026-08-31", reference_fico: 720, reference_ltv_pct: 82.5 }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
              captures: { c_conf: $.data.id, cv_conf: $.data.version }
            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_jumbo}", commitment_type: "MANDATORY", notional_amount_cents: 90000000, delivery_window_start: "2026-08-01", delivery_expiry_date: "2026-08-31", reference_fico: 760, reference_ltv_pct: 78.0 }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
              captures: { c_jumbo: $.data.id, cv_jumbo: $.data.version }
            - call: "POST /correspondent/commitments/${c_conf}/loans"
              payload: { expected_commitment_version: "${cv_conf}", seller_loan_number: "HP-1001", note_amount_cents: 40000000, note_rate_pct: 6.500, fico: 720, ltv_pct: 82.5, occupancy: "PRIMARY", servicing_election: "RELEASED", escrow_balance_cents: 320000, closing_date: "2026-07-20", first_payment_due_date: "2026-09-01" }
              as: SellerUser
              as_user_id: "${s1}"
              captures: { l_conf: $.data.id }
            - call: "POST /correspondent/commitments/${c_jumbo}/loans"
              payload: { expected_commitment_version: "${cv_jumbo}", seller_loan_number: "HP-1002", note_amount_cents: 90000000, note_rate_pct: 6.000, fico: 760, ltv_pct: 78.0, occupancy: "PRIMARY", servicing_election: "RETAINED", escrow_balance_cents: 0, closing_date: "2026-07-28", first_payment_due_date: "2026-09-01" }
              as: SellerUser
              as_user_id: "${s1}"
              captures: { l_jumbo: $.data.id }
            - call: "POST /correspondent/loans/${l_conf}/review"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
            - call: "POST /correspondent/loans/${l_conf}/defects"
              payload: { defect_code: "CR-DTI-OVERSTATED", category: "CREDIT", severity: "HIGH" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { d_conf: $.data.id }
            - call: "POST /correspondent/defects/${d_conf}/waive"
              payload: { price_adjustment_bps: -25 }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
            - call: "POST /correspondent/loans/${l_conf}/clear"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
            - call: "POST /correspondent/loans/${l_jumbo}/review"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
            - call: "POST /correspondent/loans/${l_jumbo}/clear"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "GET /correspondent/loans/${l_conf}"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { lv_conf: $.data.version }
            - call: "POST /correspondent/loans/${l_conf}/purchase-advices"
              payload: { expected_loan_version: "${lv_conf}" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { a_conf: $.data.id }
            - call: "POST /correspondent/purchase-advices/${a_conf}/settle"
              payload: { funding_reference: "WIRE-1001" }
              as: PurchaseReviewer
              as_user_id: "u-pr-2"
            - call: "GET /correspondent/loans/${l_jumbo}"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { lv_jumbo: $.data.version }
            - call: "POST /correspondent/loans/${l_jumbo}/purchase-advices"
              payload: { expected_loan_version: "${lv_jumbo}" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { a_jumbo: $.data.id }
            - call: "POST /correspondent/purchase-advices/${a_jumbo}/settle"
              payload: { funding_reference: "WIRE-1002" }
              as: PurchaseReviewer
              as_user_id: "u-pr-2"
            - call: "POST /correspondent/sellers/${s1}/scorecards"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { sc1: $.data.id }
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
          trigger:
            - call: "POST /correspondent/scorecards/${sc1}/close"
              payload: {}
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
          assert:
            - "SellerScorecard.${sc1}.purchased_loan_count == 2 and SellerScorecard.${sc1}.purchased_upb_cents == 130000000"
            - "SellerScorecard.${sc1}.defective_loan_count == 1 and SellerScorecard.${sc1}.defective_upb_cents == 40000000"
            - "SellerScorecard.${sc1}.defect_rate_bps == 5000"
            - "SellerScorecard.${sc1}.upb_weighted_defect_rate_bps == 3077"
            - "SellerScorecard.${sc1}.grade == C"
            - "SellerScorecard.${sc1}.breach == false"
            - "SellerScorecard.${sc1}.standing_action_applied == WATCH"
            - "SellerScorecard.${sc1}.status == CLOSED"
            - "Seller.${s1}.current_defect_rate_bps == 5000 and Seller.${s1}.current_scorecard_grade == C"
            - "Seller.${s1}.delivery_standing == WATCH and Seller.${s1}.approval_status == APPROVED"

  - rule_id: combinatorial_formula
    instances:
      - name: purchase_advice_per_component_rounding_vs_sum_then_round
        grounds:
          - calculations.purchase_advice_net_wire_cents
          - entities.PurchaseAdvice.fields.defect_price_adjustment_cents
          - state_machines.Defect.OPEN_to_WAIVED
        distinguishing_aspect: |
          Mode (b) nested rounding: a note of 30000500 cents at price 100.880
          with 16 accrued days, 320000 escrow, 1.250 SRP and two WAIVED defects
          (-25 and -13 bps) produces net_wire_cents 30928676 when each component
          and each defect hit is rounded half-up independently before summation,
          versus 30928677 when the exact rationals are summed first and rounded
          once — a one-cent divergence that pins the mandated rounding order.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z at delivery, advanced to 2026-08-05T00:00:00Z before issuance"
            - "Seller APPROVED / GOOD_STANDING with servicing_retained_eligible true"
            - "Commitment MANDATORY notional 40000000, window 2026-08-01 -> 2026-08-31, commitment_price_pct 100.880"
            - "Loan note_amount_cents 30000500, note_rate_pct 6.500, closing_date 2026-07-20, RELEASED with escrow_balance_cents 320000"
            - "two CURABLE defects on the loan, both WAIVED at -25 bps and -13 bps, loan back to IN_REVIEW then CLEARED_FOR_PURCHASE"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/products"
              payload: { product_code: "CONF30F", base_price_pct: 101.250, min_fico: 680, max_ltv_pct: 95.0, max_loan_amount_cents: 76650000, allowed_commitment_types: ["MANDATORY", "BEST_EFFORTS"], allowed_occupancies: ["PRIMARY", "SECOND_HOME"], srp_pct: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { p_conf: $.data.id }
            - call: "POST /correspondent/products/${p_conf}/pricing-adjustments"
              payload: { adjustment_code: "LLPA-F700-L85", fico_min: 700, fico_max: 739, ltv_min_pct: 80.0, ltv_max_pct: 85.0, price_adjustment_bps: -50 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/financial-statements"
              payload: { fiscal_year_end: "2025-12-31", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { fs1: $.data.id }
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "ACCEPT" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s1}/qc-reviews"
              payload: { review_type: "PRE_APPROVAL" }
              as: QCReviewer
              as_user_id: "u-qc-1"
              captures: { q1: $.data.id }
            - call: "POST /correspondent/qc-reviews/${q1}/complete"
              payload: { findings_count: 2, critical_findings_count: 0 }
              as: QCReviewer
              as_user_id: "u-qc-1"
            - call: "POST /correspondent/sellers/${s1}/approval-decision"
              payload: { decision: "APPROVE" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_conf}", commitment_type: "MANDATORY", notional_amount_cents: 40000000, delivery_window_start: "2026-08-01", delivery_expiry_date: "2026-08-31", reference_fico: 720, reference_ltv_pct: 82.5 }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
              captures: { c1: $.data.id, cv1: $.data.version }
            - call: "POST /correspondent/commitments/${c1}/loans"
              payload: { expected_commitment_version: "${cv1}", seller_loan_number: "HP-2001", note_amount_cents: 30000500, note_rate_pct: 6.500, fico: 720, ltv_pct: 82.5, occupancy: "PRIMARY", servicing_election: "RELEASED", escrow_balance_cents: 320000, closing_date: "2026-07-20", first_payment_due_date: "2026-09-01" }
              as: SellerUser
              as_user_id: "${s1}"
              captures: { l1: $.data.id }
            - call: "POST /correspondent/loans/${l1}/review"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
            - call: "POST /correspondent/loans/${l1}/defects"
              payload: { defect_code: "CR-DTI-OVERSTATED", category: "CREDIT", severity: "HIGH" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { d1: $.data.id }
            - call: "POST /correspondent/loans/${l1}/defects"
              payload: { defect_code: "DOC-FLOOD-CERT-MISSING", category: "DOCUMENTATION", severity: "MEDIUM" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { d2: $.data.id }
            - call: "POST /correspondent/defects/${d1}/waive"
              payload: { price_adjustment_bps: -25 }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
            - call: "POST /correspondent/defects/${d2}/waive"
              payload: { price_adjustment_bps: -13 }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
            - call: "POST /correspondent/loans/${l1}/clear"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "GET /correspondent/loans/${l1}"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { lv1: $.data.version }
          trigger:
            - call: "POST /correspondent/loans/${l1}/purchase-advices"
              payload: { expected_loan_version: "${lv1}" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { a1: $.data.id }
          assert:
            - "PurchaseAdvice.${a1}.accrued_days == 16"
            - "PurchaseAdvice.${a1}.volume_incentive_bps == 0 and PurchaseAdvice.${a1}.final_purchase_price_pct == 100.880"
            - "PurchaseAdvice.${a1}.principal_purchase_cents == 30264504"
            - "PurchaseAdvice.${a1}.accrued_interest_cents == 86668"
