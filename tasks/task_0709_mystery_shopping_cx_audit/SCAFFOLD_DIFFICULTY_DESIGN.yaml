            - "POST pay returns error_id == ERR_TAX_ID_REQUIRED (422) because new ytd 60000 >= 60000 (prior 0 < 60000) so requires_1099 is true and tax_id_on_file is false"

      - name: certification_attempts_empty_set_zero_certification_score
        grounds:
          - state_machines.Shopper.REGISTERED_to_CERTIFIED
          - entities.Shopper.fields.certification_score
          - entities.CertificationAttempt.fields.outcome
        distinguishing_aspect: |
          A Shopper with zero PASSED CertificationAttempts (empty-set boundary)
          has certification_score==0 and status REGISTERED, and a FAILED attempt
          (raw_score 69 < 70 threshold) leaves both unchanged — an empty-collection
          edge on a different metric/endpoint than the numeric 1099 threshold.
        test_recipe:
          setup:
            - "A freshly registered Shopper with no certification attempts."
          setup_api_calls:
            - call: "POST /shoppers"
              payload: { full_name: "New Shop", email: "new@x.test", home_lat: 40.0, home_lng: -74.0, tax_id_on_file: false }
              as: Anonymous
              captures: { shopper_id: $.data.id, cscore0: $.data.certification_score, status0: $.data.status }
          trigger:
