      - name: divorce_basis_caps_a_transfer_at_exactly_half_the_certified_balance
        claim_type: constants_applied
        grounds:
          - calculations.transfer_cap_evaluation.constants
          - validations[priority=26]
          - errors[ERR_TRANSFER_AMOUNT_EXCEEDS_BALANCE]
        distinguishing_aspect: |
          TRANSFER_PCT_CAP_DIVORCE is 0.50, half of the DEATH cap, and the cap is
          an inclusive ceiling on points_amount. On a 67.50 balance the boundary
          is exactly 33.75: that amount must be accepted, and 33.76 must be
          refused with 422 ERR_TRANSFER_AMOUNT_EXCEEDS_BALANCE. The DIVORCE
          precondition (both donors JOINT_HOUSEHOLD and mutually linked) also
          holds, so exception_required must be false and the transfer must land in
          REQUESTED, isolating the cap from the exception fork.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Donors A and B, both JOINT_HOUSEHOLD, mutually household-linked."
            - "A holds a RECEIVED ATHLETICS_ANNUAL gift of 5000000 cents dated 2026-03-01 and is scored to certified_points 67.50 by one run."
