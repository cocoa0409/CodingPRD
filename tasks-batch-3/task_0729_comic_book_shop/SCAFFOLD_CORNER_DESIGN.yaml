      - name: loyalty_points_rounding_order_stub
        claim_type: Precision
        grounds: [calculations.loyalty_points_earned]
        excluded_because:
          difficulty_instance: combinatorial_formula / loyalty_points_floor_per_line_then_sum
          rationale: "Floor-per-line rounding order is asserted directly by the named §1.8 instance."
