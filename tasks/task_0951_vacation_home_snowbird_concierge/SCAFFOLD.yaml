  - id: ERR_FINDING_HAS_LIVE_WORK_ORDER
    http: 409
    condition: "a finding is dismissed while a work order outside {REJECTED, VOID} exists on it"
  - id: ERR_SEVERITY_TOO_HIGH_TO_MONITOR
    http: 409
    condition: "a HIGH or CRITICAL finding is parked in MONITORING"
  - id: ERR_DISPATCH_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "dispatch_attempt_count has reached WO_MAX_DISPATCH_ATTEMPTS (3)"
