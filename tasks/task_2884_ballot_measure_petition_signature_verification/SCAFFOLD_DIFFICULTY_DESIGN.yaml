      - name: signed_on_closed_window_endpoint_boundary
        grounds:
          - entities.Petition.circulation_deadline
          - validations[priority=14]
          - errors[ERR_SIGNED_OUTSIDE_WINDOW]
          - endpoints[POST /signature-batches/{batch_id}/signatures]
        distinguishing_aspect: |
          Metric: SignatureRecord.signed_on measured against the CLOSED interval
          [petition.cleared_at, petition.circulation_deadline] — a different metric from the
          projection/gate comparison and a different endpoint (POST /signature-batches/{batch_id}/signatures).
          Both endpoints of the interval are probed exactly: signed_on == cleared_at and
          signed_on == circulation_deadline must both be accepted, while cleared_at minus one day and
          circulation_deadline plus one day must both fail with ERR_SIGNED_OUTSIDE_WINDOW. An
          implementation using a half-open window rejects the deadline-instant line and the raw count
          lands on 1 instead of 2.
