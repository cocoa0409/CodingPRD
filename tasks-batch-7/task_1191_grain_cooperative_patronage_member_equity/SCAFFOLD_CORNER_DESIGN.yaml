scaffold_corner_design:

  # ============================================================
  # Section: entities — creation, defaults, computed fields, system fields
  # ============================================================
  - section: entities
    instances:
      - name: member_creation_with_required_fields_returns_201
        claim_type: creation
        grounds:
          - "endpoints.POST /coop/members, entities.Member"
        distinguishing_aspect: "POST /coop/members with all required fields returns 201 and a Member with status=ACTIVE, equity balances = 0"
        test_recipe:
          setup: ["District DIST-COR-1 exists"]
          setup_api_calls:
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-1", name: "Corner 1", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor1: $.data.id }
          trigger:
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-1", legal_name: "Corner Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor1}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor1: $.data.id }
          assert:
            - "response code == 201"
            - "Member.${m_cor1}.status == ACTIVE"
            - "Member.${m_cor1}.qualified_equity_cents == 0"
            - "Member.${m_cor1}.nonqualified_equity_cents == 0"
            - "Member.${m_cor1}.per_unit_retains_cents == 0"

      - name: member_creation_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - "endpoints.POST /coop/members, errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /coop/members missing required patron_ref → ERR_INVALID_REQUEST (400)"
        test_recipe:
          setup: ["District DIST-COR-2 exists"]
          setup_api_calls:
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-2", name: "Corner 2", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor2: $.data.id }
          trigger:
            - call: "POST /coop/members"
              payload: { legal_name: "No Ref", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor2}", is_producer_member: true }
              as: CoopRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: member_retrieval_returns_stored_data
        claim_type: retrieval
        grounds:
          - "endpoints.GET /coop/members/{member_id}"
        distinguishing_aspect: "GET /coop/members/{id} returns the previously created member with all input fields persisted"
        test_recipe:
          setup: ["District DIST-COR-3, Member M-COR-3 created"]
          setup_api_calls:
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-3", name: "Corner 3", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor3: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-3", legal_name: "Retrieval Farm", member_class: "LLC", joined_at: "2024-03-15T00:00:00Z", delegate_district_id: "${dist_cor3}", is_producer_member: false }
              as: CoopRegistrar
              captures: { m_cor3: $.data.id }
          trigger:
            - call: "GET /coop/members/${m_cor3}"
              payload: {}
              as: CoopRegistrar
          assert:
            - "Member.${m_cor3}.patron_ref == 'P-COR-3'"
            - "Member.${m_cor3}.member_class == LLC"
            - "Member.${m_cor3}.is_producer_member == false"

      - name: member_not_found_returns_404
        claim_type: not_found
        grounds:
          - "endpoints.GET /coop/members/{member_id}, errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /coop/members/<non-existent-uuid> → 404 ERR_NOT_FOUND"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /coop/members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CoopRegistrar
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: grain_delivery_net_bushels_computed_floor_rounding
        claim_type: computed_fields
        grounds:
          - "entities.GrainDelivery.fields.net_bushels"
          - "calculations.per_unit_retain_valuation"
        distinguishing_aspect: "net_bushels = floor(gross_bushels * (1 - dockage_pct)); gross=100, dockage=0.075 → floor(92.5)=92"
        test_recipe:
          setup: ["District DIST-COR-4, Member M-COR-4, FY-COR-4 OPEN"]
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-4", name: "Corner 4", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor4: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-4", legal_name: "Floor Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor4}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor4: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 100000, retained_reserve_pct: 0.10, qualified_payout_pct: 0.30 }
              as: CoopAccountant
              captures: { fy_cor4: $.data.id }
          trigger:
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m_cor4}", fiscal_year_id: "${fy_cor4}", commodity: "CORN", gross_bushels: 100, dockage_pct: 0.075, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_cor4: $.data.id }
          assert:
            - "GrainDelivery.${d_cor4}.net_bushels == 92  # floor(100 * 0.925) = floor(92.5) = 92"

      - name: grain_delivery_status_initial_booked
        claim_type: system_fields
        grounds:
          - "entities.GrainDelivery.fields.status"
          - "state_machines.GrainDelivery"
        distinguishing_aspect: "Newly created GrainDelivery starts in BOOKED status with version=1"
        test_recipe:
          setup: ["District DIST-COR-5, Member M-COR-5, FY-COR-5 OPEN"]
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-5", name: "Corner 5", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor5: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-5", legal_name: "Init Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor5}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor5: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 100000, retained_reserve_pct: 0.10, qualified_payout_pct: 0.30 }
              as: CoopAccountant
              captures: { fy_cor5: $.data.id }
          trigger:
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m_cor5}", fiscal_year_id: "${fy_cor5}", commodity: "WHEAT", gross_bushels: 50, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_cor5: $.data.id }
          assert:
            - "GrainDelivery.${d_cor5}.status == BOOKED"
            - "GrainDelivery.${d_cor5}.version == 1"

  # ============================================================
  # Section: state_machines — invalid transitions, terminal lockdown, initial state
  # ============================================================
  - section: state_machines
    instances:
      - name: settle_delivery_from_settled_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.GrainDelivery.SETTLED"
          - "errors[ERR_DELIVERY_ALREADY_SETTLED]"
        distinguishing_aspect: "Second POST /settle on already-SETTLED delivery → ERR_DELIVERY_ALREADY_SETTLED (409); no double-counting of retains"
        test_recipe:
          setup: ["Member M-COR-6, FY-COR-6 OPEN, Delivery D-COR-6 already SETTLED"]
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-6", name: "Corner 6", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor6: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-6", legal_name: "Twice Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor6}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor6: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 100000, retained_reserve_pct: 0.10, qualified_payout_pct: 0.30 }
              as: CoopAccountant
              captures: { fy_cor6: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m_cor6}", fiscal_year_id: "${fy_cor6}", commodity: "CORN", gross_bushels: 100, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_cor6: $.data.id }
            - call: "POST /coop/deliveries/${d_cor6}/settle"
              payload: {}
              as: ElevatorOperator
          trigger:
            - call: "POST /coop/deliveries/${d_cor6}/settle"
              payload: {}
              as: ElevatorOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DELIVERY_ALREADY_SETTLED"
            - "GrainDelivery.${d_cor6}.status == SETTLED"

      - name: cancel_delivery_from_settled_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.GrainDelivery"
        distinguishing_aspect: "POST /cancel on SETTLED delivery → ERR_INVALID_STATE (terminal state lockdown)"
        test_recipe:
          setup: ["Member M-COR-7, FY-COR-7, Delivery D-COR-7 SETTLED"]
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-7", name: "Corner 7", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor7: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-7", legal_name: "Lock Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor7}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor7: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 100000, retained_reserve_pct: 0.10, qualified_payout_pct: 0.30 }
              as: CoopAccountant
              captures: { fy_cor7: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m_cor7}", fiscal_year_id: "${fy_cor7}", commodity: "CORN", gross_bushels: 50, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_cor7: $.data.id }
            - call: "POST /coop/deliveries/${d_cor7}/settle"
              payload: {}
              as: ElevatorOperator
          trigger:
            - call: "POST /coop/deliveries/${d_cor7}/cancel"
              payload: {}
              as: ElevatorOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "GrainDelivery.${d_cor7}.status == SETTLED"

      - name: fiscal_year_close_provisional_from_open_with_booked_delivery_fails
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.FiscalYear.OPEN_to_CLOSED_PROVISIONAL"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cannot close_provisional when any delivery in year is still BOOKED — must be SETTLED or CANCELLED"
        test_recipe:
          setup: ["Member M-COR-8, FY-COR-8 OPEN with 1 BOOKED delivery (not settled)"]
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-8", name: "Corner 8", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor8: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-8", legal_name: "Open Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor8}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor8: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 100000, retained_reserve_pct: 0.10, qualified_payout_pct: 0.30 }
              as: CoopAccountant
              captures: { fy_cor8: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m_cor8}", fiscal_year_id: "${fy_cor8}", commodity: "CORN", gross_bushels: 50, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_cor8: $.data.id }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CoopAdmin
          trigger:
            - call: "POST /coop/fiscal_years/${fy_cor8}/close_provisional"
              payload: {}
              as: CoopAccountant
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "FiscalYear.${fy_cor8}.status == OPEN"

      - name: redemption_request_cancel_from_pending_works
        claim_type: valid_transition
        grounds:
          - "state_machines.RedemptionRequest.PENDING_to_CANCELLED"
        distinguishing_aspect: "Member can cancel own PENDING request; status transitions to CANCELLED"
        test_recipe:
          setup: ["Member M-COR-9, FY-COR-9 CLOSED_FINAL with cert, PENDING RedemptionRequest R-COR-9"]
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-9", name: "Corner 9", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor9: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-9", legal_name: "Cancel Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor9}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor9: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 100000, retained_reserve_pct: 0.10, qualified_payout_pct: 0.30 }
              as: CoopAccountant
              captures: { fy_cor9: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m_cor9}", fiscal_year_id: "${fy_cor9}", commodity: "CORN", gross_bushels: 100, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_cor9: $.data.id }
            - call: "POST /coop/deliveries/${d_cor9}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/fiscal_years/${fy_cor9}/close_provisional"
              payload: {}
              as: CoopAccountant
            - call: "POST /coop/fiscal_years/${fy_cor9}/begin_audit"
              payload: {}
              as: ExternalAuditor
            - call: "GET /coop/fiscal_years/${fy_cor9}"
              payload: {}
              as: CoopAccountant
              captures: { fy_cor9_v: $.data.version }
            - call: "POST /coop/fiscal_years/${fy_cor9}/finalize_close"
              payload: { expected_fiscal_year_version: "${fy_cor9_v}" }
              as: CoopAccountant
            - call: "GET /coop/members/${m_cor9}/certificates"
              payload: {}
              as: Member
              as_user_id: "${m_cor9}"
              captures: { cert_cor9: "$.data[0].id" }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2031-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/redemption_requests"
              payload: { member_id: "${m_cor9}", kind: "RETIREMENT", certificate_ids: ["${cert_cor9}"], requested_amount_cents: 100, appointment_at: "2031-10-01T10:00:00Z" }
              as: Member
              as_user_id: "${m_cor9}"
              captures: { req_cor9: $.data.id }
          trigger:
            - call: "POST /coop/redemption_requests/${req_cor9}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_cor9}"
          assert:
            - "RedemptionRequest.${req_cor9}.status == CANCELLED"

  # ============================================================
  # Section: calculations — boundary, precision, tier boundaries
  # ============================================================
  - section: calculations
    instances:
      - name: per_unit_retain_rate_constants_applied_per_commodity
        claim_type: constants_applied
        grounds:
          - "calculations.per_unit_retain_valuation"
        distinguishing_aspect: "Each commodity uses its pinned rate: CORN=8c, SOYBEAN=10c, WHEAT=6c, SORGHUM=7c, SUNFLOWER=9c per bu"
        test_recipe:
          setup: ["Member M-COR-10, FY-COR-10"]
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-10", name: "Corner 10", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor10: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-10", legal_name: "Rates Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor10}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor10: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 100000, retained_reserve_pct: 0.10, qualified_payout_pct: 0.30 }
              as: CoopAccountant
              captures: { fy_cor10: $.data.id }
          trigger:
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m_cor10}", fiscal_year_id: "${fy_cor10}", commodity: "SOYBEAN", gross_bushels: 100, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_soy: $.data.id }
            - call: "POST /coop/deliveries/${d_soy}/settle"
              payload: {}
              as: ElevatorOperator
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m_cor10}", fiscal_year_id: "${fy_cor10}", commodity: "SUNFLOWER", gross_bushels: 100, dockage_pct: 0.0, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_sun: $.data.id }
            - call: "POST /coop/deliveries/${d_sun}/settle"
              payload: {}
              as: ElevatorOperator
          assert:
            - "GrainDelivery.${d_soy}.per_unit_retain_cents == 1000  # 100 bu * 10c"
            - "GrainDelivery.${d_sun}.per_unit_retain_cents == 900  # 100 bu * 9c"

      - name: dockage_pct_upper_boundary_030
        claim_type: precision
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_FISCAL_BOUNDARY]"
        distinguishing_aspect: "dockage_pct=0.30 (boundary) accepted; dockage_pct=0.31 rejected with ERR_FISCAL_BOUNDARY"
        test_recipe:
          setup: ["Member M-COR-11, FY-COR-11"]
          setup_api_calls:
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2025-09-01T00:00:00Z" }
              as: CoopAdmin
            - call: "POST /coop/delegate_districts"
              payload: { code: "DIST-COR-11", name: "Corner 11", max_delegates: 2 }
              as: CoopAdmin
              captures: { dist_cor11: $.data.id }
            - call: "POST /coop/members"
              payload: { patron_ref: "P-COR-11", legal_name: "Boundary Farm", member_class: "INDIVIDUAL", joined_at: "2024-01-01T00:00:00Z", delegate_district_id: "${dist_cor11}", is_producer_member: true }
              as: CoopRegistrar
              captures: { m_cor11: $.data.id }
            - call: "POST /coop/fiscal_years"
              payload: { year_code: "FY2026", start_date: "2025-09-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", net_margin_cents: 100000, retained_reserve_pct: 0.10, qualified_payout_pct: 0.30 }
              as: CoopAccountant
              captures: { fy_cor11: $.data.id }
          trigger:
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m_cor11}", fiscal_year_id: "${fy_cor11}", commodity: "CORN", gross_bushels: 100, dockage_pct: 0.30, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { d_ok: $.data.id }
            - call: "POST /coop/deliveries"
              payload: { member_id: "${m_cor11}", fiscal_year_id: "${fy_cor11}", commodity: "CORN", gross_bushels: 100, dockage_pct: 0.31, is_patron_sourced: true }
              as: ElevatorOperator
              captures: { err: $.data.error_id }
          assert:
            - "GrainDelivery.${d_ok}.id exists (boundary 0.30 accepted)"
            - "err == ERR_FISCAL_BOUNDARY (0.31 exceeds)"

