  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: flash_offer_exhausted_returns_to_active_cycle
        grounds:
          - state_machines.FlashOffer.ACTIVE_to_EXHAUSTED
          - state_machines.FlashOffer.EXHAUSTED_to_ACTIVE
          - state_machines.Cart.OPEN_to_ABANDONED
          - calculations.inventory_pool_reconciliation
          - entities.FlashOffer.fields.remaining_qty
        distinguishing_aspect: |
          Non-linearity type: a GUARDED RE-ENTRANT LOOP on FlashOffer. The same edge
          ACTIVE->EXHAUSTED is traversed twice in one show because the release cascade
          of an abandoned cart drives the reverse edge EXHAUSTED->ACTIVE, and that
          reverse edge is guarded by two cross-entity conditions — after the window
          closes at 19:00Z an identical release leaves the offer EXHAUSTED with
          remaining_qty 2, so the loop terminates by clock rather than by count.
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z, SKU-ROBE on slot 1, one ACTIVE offer at 3500 with max_qty 2, window 18:00-19:00Z."
            - "Two viewers, each with one empty OPEN cart."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_viewer2
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl1}", offer_price_cents: 3500, window_start_at: "2026-08-10T18:00:00Z", window_end_at: "2026-08-10T19:00:00Z", max_qty: 2, expected_lineup_slot_version: "${sl1_v}" }
              as: MerchandisingManager
              captures: { oD: $.data.id }
            - *c_channel
            - *c_provision
            - *c_health_ok
            - *c_ready
            - *c_clock_prelive
            - *c_golive
            - *c_clock_live
            - call: "POST /flash-offers/${oD}/activate"
              payload: {}
              as: MerchandisingManager
            - *c_cart1
            - *c_cart2
          trigger:
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${oD}", qty: 2 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itD1: $.data.id }
            - call: "POST /carts/${ct1}/abandon"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
            - call: "POST /carts/${ct2}/items"
              payload: { flash_offer_id: "${oD}", qty: 2 }
              as: Viewer
              as_user_id: "${v2}"
              captures: { itD2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T19:05:00Z" }
              as: PlatformAdmin
            - call: "POST /carts/${ct2}/abandon"
              payload: {}
              as: Viewer
              as_user_id: "${v2}"
          assert:
            - "After the first add: FlashOffer.${oD}.status == EXHAUSTED, held_qty == 2, remaining_qty == 0; Product.${p1}.reserved_qty == 2 and available_qty == 48"
            - "After the first abandon: FlashOffer.${oD}.status == ACTIVE and remaining_qty == 2; CartItem.${itD1}.state == RELEASED with released_reason == CART_ABANDONED"
            - "After the first abandon: Cart.${ct1}.status == ABANDONED, abandoned_at == 2026-08-10T18:10:00Z, recovery_deadline_at == 2026-08-10T18:30:00Z"
            - "After the second add: FlashOffer.${oD}.status == EXHAUSTED again (the ACTIVE->EXHAUSTED edge fires twice in one show) and Product.${p1}.available_qty == 48"
            - "After the second abandon at 19:05Z: FlashOffer.${oD}.remaining_qty == 2 but FlashOffer.${oD}.status == EXHAUSTED — the reverse edge is refused because logical now > window_end_at 2026-08-10T19:00:00Z"
            - "CartItem.${itD2}.state == RELEASED and Product.${p1}.reserved_qty == 0 and Product.${p1}.available_qty == 50"
            - "Show.${sh1}.abandoned_cart_count == 2 and Show.${sh1}.abandonment_rate_bp == 10000"

      - name: order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Order.AUTHORIZED_to_CAPTURED
          - state_machines.Order.AUTHORIZED_to_VOIDED
          - state_machines.Order.CAPTURED_to_REFUNDED
          - entities.Order.fields.payment_state
          - entities.Order.fields.fulfillment_state
          - entities.Order.fields.refunded_cents
        distinguishing_aspect: |
          Non-linearity type: TWO PARALLEL STATE DIMENSIONS on one entity, where one
          endpoint resolves to different edges. POST /orders/{id}/cancel means
          AUTHORIZED->VOIDED (refunded_cents stays 0, gross_merchandise_cents
          unchanged) on one order and CAPTURED->REFUNDED (refunded_cents = 4405,
          commission reset to 0, revenue leaves gross_merchandise_cents) on the other,
          while capture advances BOTH dimensions in a single request
          (AUTHORIZED->CAPTURED and PENDING->ALLOCATED); the fulfillment dimension
          reaches CANCELLED from PENDING and from ALLOCATED alike.
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with the ACTIVE 3500-cent offer (max_qty 10)."
            - "Each viewer checks out one unit: merchandise 3500, tax 306, shipping 599, total 4405; both orders AUTHORIZED / PENDING."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_viewer2
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - *c_offer
            - *c_channel
            - *c_provision
            - *c_health_ok
            - *c_ready
            - *c_clock_prelive
            - *c_golive
            - *c_clock_live
            - *c_activate
            - *c_cart1
            - *c_cart2
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 1 }
              as: Viewer
              as_user_id: "${v1}"
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ct1_v: $.data.version }
            - call: "POST /carts/${ct1}/checkout"
              payload: { expected_cart_version: "${ct1_v}" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { ord1: $.data.id }
            - call: "POST /carts/${ct2}/items"
              payload: { flash_offer_id: "${o1}", qty: 1 }
              as: Viewer
              as_user_id: "${v2}"
            - call: "GET /carts/${ct2}"
              payload: {}
              as: Viewer
              as_user_id: "${v2}"
              captures: { ct2_v: $.data.version }
            - call: "POST /carts/${ct2}/checkout"
              payload: { expected_cart_version: "${ct2_v}" }
              as: Viewer
              as_user_id: "${v2}"
              captures: { ord2: $.data.id }
          trigger:
            - call: "POST /orders/${ord1}/capture"
              payload: {}
              as: MerchandisingManager
            - call: "POST /orders/${ord2}/cancel"
              payload: { cancel_reason: "VIEWER_CHANGED_MIND" }
              as: MerchandisingManager
            - call: "POST /orders/${ord1}/cancel"
              payload: { cancel_reason: "DAMAGED_ON_ARRIVAL" }
              as: MerchandisingManager
          assert:
            - "After capture: Order.${ord1}.payment_state == CAPTURED AND fulfillment_state == ALLOCATED (one request, both dimensions)"
            - "After capture: Order.${ord1}.host_commission_accrued_cents == 280 and Show.${sh1}.gross_merchandise_cents == 3500"
            - "After cancelling ${ord2}: Order.${ord2}.payment_state == VOIDED, fulfillment_state == CANCELLED, refunded_cents == 0"
            - "After cancelling ${ord2}: Show.${sh1}.gross_merchandise_cents == 3500 unchanged (a never-captured order was never in the aggregate)"
            - "After cancelling ${ord2}: Product.${p1}.committed_qty == 1, available_qty == 49; FlashOffer.${o1}.sold_qty == 1, remaining_qty == 9"
            - "After cancelling ${ord1}: Order.${ord1}.payment_state == REFUNDED, fulfillment_state == CANCELLED, refunded_cents == 4405, host_commission_accrued_cents == 0"
            - "After cancelling ${ord1}: Show.${sh1}.gross_merchandise_cents == 0 and Show.${sh1}.margin_provisional_cents == 0"
            - "After cancelling ${ord1}: Product.${p1}.committed_qty == 0, available_qty == 50; FlashOffer.${o1}.sold_qty == 0, remaining_qty == 10, status == ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: show_end_cascade_depth_four
        grounds:
          - state_machines.Show.LIVE_to_ENDED
          - state_machines.FlashOffer.ACTIVE_to_EXPIRED
          - state_machines.Cart.OPEN_to_ABANDONED
          - state_machines.HostBooking.CONFIRMED_to_COMPLETED
          - calculations.inventory_pool_reconciliation
          - entities.Show.fields.abandonment_rate_bp
        distinguishing_aspect: |
          Cascade chain (depth 4, each link CAUSED by the previous, not by the
          trigger): ending the show expires the ACTIVE offer (link 1) -> the expiry
          releases that offer's HELD cart lines with released_reason OFFER_EXPIRED and
          unwinds Product.reserved_qty / FlashOffer.held_qty (link 2) -> the cart whose
          every line is now RELEASED flips OPEN->ABANDONED with a 20-minute recovery
          deadline (link 3) -> that abandonment increments Show.abandoned_cart_count
          and recomputes abandonment_rate_bp (link 4). The empty second cart proves
          link 3 is conditional on having held at least one line.
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with the ACTIVE 3500-cent offer; viewer 1 holds 3 units (reserved_qty 3, available_qty 47)."
            - "Viewer 2 has an empty OPEN cart that never held a line."
            - "Clock advanced to 2026-08-10T19:30:00Z before the show is ended."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_viewer2
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - *c_offer
            - *c_channel
            - *c_provision
            - *c_health_ok
            - *c_ready
            - *c_clock_prelive
            - *c_golive
            - *c_clock_live
            - *c_activate
            - *c_cart1
            - *c_cart2
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 3 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itE: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T19:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /shows/${sh1}/end"
              payload: {}
              as: ShowProducer
          assert:
            - "Show.${sh1}.status == ENDED and ended_at == 2026-08-10T19:30:00Z"
            - "Link 1: FlashOffer.${o1}.status == EXPIRED"
            - "Link 2: CartItem.${itE}.state == RELEASED with released_reason == OFFER_EXPIRED and released_at == 2026-08-10T19:30:00Z"
            - "Link 2 ledger: Product.${p1}.reserved_qty == 0, available_qty == 50; FlashOffer.${o1}.held_qty == 0, remaining_qty == 10"
            - "Link 3: Cart.${ct1}.status == ABANDONED, abandoned_at == 2026-08-10T19:30:00Z, recovery_deadline_at == 2026-08-10T19:50:00Z"
            - "Link 3 exemption: Cart.${ct2}.status == OPEN (a cart that never held a line is not abandoned)"
            - "Link 4: Show.${sh1}.abandoned_cart_count == 1 and Show.${sh1}.abandonment_rate_bp == 5000 (1 of 2 carts)"
            - "Sibling cascades: HostBooking.${b1}.status == COMPLETED and StreamChannel.${ch1}.status == ENDED"
            - "Show.${sh1}.margin_provisional_cents == 0 (no orders were placed)"

      - name: chat_block_strike_mute_withdraw_cascade
        grounds:
          - state_machines.Interaction.PENDING_MODERATION_to_BLOCKED
          - state_machines.Interaction.QUEUED_to_WITHDRAWN
          - entities.Viewer.fields.strike_count
          - entities.Viewer.fields.muted_until
          - entities.Show.fields.pending_question_count
          - validations[priority=24]
        distinguishing_aspect: |
          Cascade chain (depth 5) in a DIFFERENT entity domain than the show-end chain
          and driven by a THRESHOLD rather than a lifecycle transition: blocking a chat
          message (link 1) increments Viewer.strike_count to 2 (link 2) -> reaching
          MUTE_STRIKE_THRESHOLD flips chat_status ACTIVE->MUTED with muted_until = now
          + 15 minutes (link 3) -> the mute withdraws that viewer's QUEUED question
          (link 4) -> the withdrawal recomputes Show.pending_question_count to 0
          (link 5). The first block produces links 1-2 only, proving the threshold is
          what triggers links 3-5.
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z; viewer 1 has posted two CHAT messages (PENDING_MODERATION) and one QUESTION approved to QUEUED, so Show.pending_question_count == 1."
            - "The first chat message has already been BLOCKED, leaving Viewer.strike_count == 1 with chat_status ACTIVE."
            - "Clock advanced to 2026-08-10T18:15:00Z before the second block."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - *c_offer
            - *c_channel
            - *c_provision
            - *c_health_ok
            - *c_ready
            - *c_clock_prelive
            - *c_golive
            - *c_clock_live
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "buy from my link instead" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { chat1: $.data.id }
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "buy from my link instead again" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { chat2: $.data.id }
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "QUESTION", body: "Is the sash included?" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { q2: $.data.id }
            - call: "POST /interactions/${q2}/moderate"
              payload: { action: "APPROVE" }
              as: Moderator
              as_user_id: "mod-1"
            - call: "POST /interactions/${chat1}/moderate"
              payload: { action: "BLOCK", blocked_reason: "OFF_PLATFORM_SOLICITATION" }
              as: Moderator
              as_user_id: "mod-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T18:15:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /interactions/${chat2}/moderate"
              payload: { action: "BLOCK", blocked_reason: "OFF_PLATFORM_SOLICITATION" }
              as: Moderator
              as_user_id: "mod-1"
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "let me back in" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { muted_err: $.data.error_id }
          assert:
            - "Before the trigger: Viewer.${v1}.strike_count == 1, chat_status == ACTIVE, muted_until == null; Show.${sh1}.pending_question_count == 1"
            - "Link 1: Interaction.${chat2}.state == BLOCKED with blocked_reason == OFF_PLATFORM_SOLICITATION and moderated_at == 2026-08-10T18:15:00Z"
            - "Link 2: Viewer.${v1}.strike_count == 2"
            - "Link 3: Viewer.${v1}.chat_status == MUTED and muted_until == 2026-08-10T18:30:00Z"
            - "Link 4: Interaction.${q2}.state == WITHDRAWN"
            - "Link 5: Show.${sh1}.pending_question_count == 0"
            - "Interaction.${chat1}.state == BLOCKED unchanged (already terminal)"
            - "The follow-up chat submit returns 403 with ${muted_err} == ERR_VIEWER_MUTED and creates no Interaction row"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: go_live_state_beats_temporal_window
        grounds:
          - validations[priority=8]
          - validations[priority=17]
          - state_machines.Show.READY_to_LIVE
          - errors[ERR_INVALID_SHOW_STATE]
          - errors[ERR_GO_LIVE_WINDOW_CLOSED]
        distinguishing_aspect: |
          Category pair: state (priority 8, ERR_INVALID_SHOW_STATE, 409) beats
          business_temporal (priority 17, ERR_GO_LIVE_WINDOW_CLOSED, 422). Both are
          violated by one request — the show is DRAFT and the clock is 2026-08-01,
          nine days before the earliest legal go-live instant — and the response must
          be the state error; readying the show without moving the clock then surfaces
          the temporal error, proving the second violation was live all along.
        test_recipe:
          setup:
            - "Show fully preparable (slot, confirmed PRIMARY booking with a CERTIFIED host, acknowledged disclosure, substantiated product, PROVISIONED channel) but still in DRAFT."
            - "Clock left at 2026-08-01T00:00:00Z, i.e. outside [scheduled_start_at - 30 min, scheduled_end_at) = [2026-08-10T17:30:00Z, 2026-08-10T20:00:00Z)."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - *c_offer
            - *c_channel
            - *c_provision
            - *c_health_ok
          trigger:
            - call: "POST /shows/${sh1}/go-live"
              payload: {}
              as: ShowProducer
              captures: { err_state: $.data.error_id }
            - call: "POST /shows/${sh1}/ready"
              payload: {}
              as: ShowProducer
            - call: "POST /shows/${sh1}/go-live"
              payload: {}
              as: ShowProducer
              captures: { err_temporal: $.data.error_id }
          assert:
            - "First go-live: HTTP 409 with ${err_state} == ERR_INVALID_SHOW_STATE (not ERR_GO_LIVE_WINDOW_CLOSED)"
            - "Show.${sh1}.status == DRAFT and went_live_at == null after the first attempt"
            - "The ready call succeeds: Show.${sh1}.status == READY, readiness_checked_at == 2026-08-01T00:00:00Z, simulcast_readiness_index == 100"
            - "Second go-live: HTTP 422 with ${err_temporal} == ERR_GO_LIVE_WINDOW_CLOSED"
            - "Show.${sh1}.status == READY and went_live_at == null after the second attempt"

      - name: add_item_claim_safety_beats_fiscal_qty
        grounds:
          - validations[priority=10]
          - validations[priority=30]
          - errors[ERR_CLAIM_NOT_SUBSTANTIATED]
          - errors[ERR_OFFER_QTY_EXCEEDED]
          - entities.Product.fields.claim_substantiation_status
        distinguishing_aspect: |
          Category pair: business_safety (priority 10, ERR_CLAIM_NOT_SUBSTANTIATED)
          beats business_fiscal (priority 30, ERR_OFFER_QTY_EXCEEDED) — a different
          pair from the state/temporal instance. One add-item request asks for 5 units
          of an offer whose max_qty is 1 AND whose product's claim was flipped to
          REJECTED after activation; the advertising-safety error must win. Restoring
          the substantiation without changing the quantity then yields the fiscal error.
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z; ACTIVE offer at 3500 cents with max_qty 1 on SKU-ROBE (on_hand 50)."
            - "After the offer was activated the ComplianceOfficer flipped SKU-ROBE's claim_substantiation_status to REJECTED."
            - "Viewer 1 has an empty OPEN cart."
          setup_api_calls:
            - *c_clock_t0
            - *c_host
            - *c_cert
            - *c_viewer1
            - *c_product
            - *c_substantiate
            - *c_show
            - *c_booking
            - *c_disclosure
            - *c_confirm
            - *c_ack
            - *c_slot
            - call: "POST /flash-offers"
