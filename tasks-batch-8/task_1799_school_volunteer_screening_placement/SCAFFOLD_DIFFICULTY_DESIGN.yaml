# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Grounds reference SCAFFOLD.yaml §1.1–§1.6 elements. All recipes replay from
# empty DB. Logical clock default is 2026-08-01T00:00:00Z unless a recipe sets it.
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: volunteer_hours_provisional_vs_verified
        grounds:
          - calculations.volunteer_service_hours
          - entities.Volunteer.fields.total_verified_hours
          - entities.Volunteer.fields.total_provisional_hours
        distinguishing_aspect: |
          Hour accounting on the Volunteer/HourEntry domain: identical data
          (3.0h VERIFIED + 2.0h PENDING) yields total_verified_hours == 3.0
          under the verified variant and total_provisional_hours == 5.0 under
          the provisional variant.
        test_recipe:
          setup:
            - "ACTIVE SUPERVISED volunteer with BASIC-cleared check and ORIENT training"
            - "OPEN opportunity cap 2, window 2026-08-10T14:00:00Z..2026-08-10T17:00:00Z"
            - "placement CONFIRMED; hour entry 3.0 STANDARD verified; hour entry 2.0 TUTORING left PENDING"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Ann Hours", email: "ann.hours@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Library Help", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-10", hours: 3.0, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${v_id}", captures: { he1_id: $.data.id } }
            - { call: "POST /hour-entries/${he1_id}/verify", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-10", hours: 2.0, activity_category: "TUTORING" }, as: Volunteer, as_user_id: "${v_id}" }
          trigger:
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
          assert:
            - "Volunteer.${v_id}.total_verified_hours == 3.0"
            - "Volunteer.${v_id}.total_provisional_hours == 5.0"
            - "Volunteer.${v_id}.recognition_points == 3.0"
            - "Volunteer.${v_id}.recognition_tier == NONE"

      - name: opportunity_fill_committed_vs_projected
        grounds:
          - calculations.opportunity_fill
          - entities.Opportunity.fields.committed_count
          - entities.Opportunity.fields.projected_count
        distinguishing_aspect: |
          Seat accounting on the Opportunity domain (different entity domain
          from volunteer hours): identical data (1 CONFIRMED + 2 REQUESTED
          placements) yields committed_count == 1 under the committed variant
          and projected_count == 3 under the projected variant.
        test_recipe:
          setup:
            - "campus + OPEN opportunity cap 5, window 2026-08-10T14:00:00Z..2026-08-10T17:00:00Z"
            - "three ACTIVE SUPERVISED volunteers (BASIC checks, ORIENT training)"
            - "placements: p1 CONFIRMED; p2 and p3 REQUESTED only"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Field Day", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 5, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /volunteers", payload: { full_name: "Vol A", email: "vol.a@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { va_id: $.data.id, va_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${va_id}", level: "BASIC", expected_volunteer_version: "${va_ver}" }, as: DistrictCoordinator, captures: { cha_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${va_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${cha_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /volunteers", payload: { full_name: "Vol B", email: "vol.b@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { vb_id: $.data.id, vb_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${vb_id}", level: "BASIC", expected_volunteer_version: "${vb_ver}" }, as: DistrictCoordinator, captures: { chb_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${vb_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chb_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /volunteers", payload: { full_name: "Vol C", email: "vol.c@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { vc_id: $.data.id, vc_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${vc_id}", level: "BASIC", expected_volunteer_version: "${vc_ver}" }, as: DistrictCoordinator, captures: { chc_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${vc_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chc_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${va_id}", captures: { p1_id: $.data.id } }
            - { call: "POST /placements/${p1_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${vb_id}" }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${vc_id}" }
          trigger:
            - { call: "GET /opportunities/${opp_id}", payload: {}, as: CampusAdmin }
          assert:
            - "Opportunity.${opp_id}.committed_count == 1"
            - "Opportunity.${opp_id}.projected_count == 3"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: screening_decision_matrix_minor_unsupervised_flags
        grounds:
          - calculations.screening_decision_matrix
          - entities.Volunteer.fields.restriction_flags
          - state_machines.BackgroundCheck.PENDING_to_CLEARED_WITH_FLAGS
        distinguishing_aspect: |
          Mode (a) combinatorial: nested branches over findings x contact_type x
          level adequacy. MINOR findings on an UNSUPERVISED volunteer yield
          CLEARED_WITH_FLAGS with exactly [NO_ONE_ON_ONE, NO_TRANSPORT]; the
          NO_ONE_ON_ONE branch exists only because contact_type == UNSUPERVISED,
          and the resulting flags block a ONE_ON_ONE-restricted opportunity at
          confirm time.
        test_recipe:
          setup:
            - "UNSUPERVISED volunteer, ENHANCED check PENDING, ORIENT training recorded"
            - "campus + OPEN opportunity restricted_category ONE_ON_ONE, required_contact_type UNSUPERVISED, cap 2, window 2026-08-10T14:00:00Z..2026-08-10T17:00:00Z"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Mentor Mary", email: "mary@x.com", contact_type: "UNSUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "ENHANCED", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Reading Mentor", required_contact_type: "UNSUPERVISED", restricted_category: "ONE_ON_ONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
          trigger:
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "MINOR" }, as: DistrictCoordinator, captures: { chk_status: $.data.status } }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin, captures: { confirm_err: $.data.error_id } }
          assert:
            - "BackgroundCheck.${chk_id}.status == CLEARED_WITH_FLAGS"
            - "Volunteer.${v_id}.status == ACTIVE"
            - "Volunteer.${v_id}.restriction_flags == [NO_ONE_ON_ONE, NO_TRANSPORT] (sorted ascending)"
            - "confirm response error_id == ERR_RESTRICTED_ROLE"

      - name: recognition_points_per_entry_round_then_sum
        grounds:
          - calculations.recognition_points
          - entities.HourEntry.fields.points
          - entities.Volunteer.fields.recognition_points
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding order is pinned. 2.5h TUTORING
          rounds to 3.8 and 1.25h STANDARD rounds to 1.3 BEFORE summation, so
          recognition_points == 5.1; the rejected sum-then-round order would
          produce round_half_up(5.00, 1) == 5.0.
        test_recipe:
          setup:
            - "ACTIVE SUPERVISED volunteer, OPEN opportunity cap 2 window 2026-08-10T14:00:00Z..2026-08-10T17:00:00Z, placement CONFIRMED"
            - "two VERIFIED hour entries: 2.5 TUTORING and 1.25 STANDARD, both worked 2026-08-10"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Point Pam", email: "pam@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Tutoring Block", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-10", hours: 2.5, activity_category: "TUTORING" }, as: Volunteer, as_user_id: "${v_id}", captures: { he1_id: $.data.id, he1_points: $.data.points } }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-10", hours: 1.25, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${v_id}", captures: { he2_id: $.data.id, he2_points: $.data.points } }
            - { call: "POST /hour-entries/${he1_id}/verify", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries/${he2_id}/verify", payload: {}, as: CampusAdmin }
          trigger:
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
          assert:
            - "HourEntry.${he1_id}.points == 3.8"
            - "HourEntry.${he2_id}.points == 1.3"
            - "Volunteer.${v_id}.recognition_points == 5.1"
            - "Volunteer.${v_id}.total_verified_hours == 3.75"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: volunteer_active_rescreen_active_cycle
        grounds:
          - state_machines.Volunteer.ACTIVE_to_RESCREEN_REQUIRED
          - state_machines.Volunteer.RESCREEN_REQUIRED_to_ACTIVE
          - state_machines.BackgroundCheck.CLEARED_to_EXPIRED
        distinguishing_aspect: |
          Cyclic machine on Volunteer: ACTIVE -> RESCREEN_REQUIRED (clock sweep
          past ENHANCED clearance expiry at 365 days) -> ACTIVE (re-screening
          adjudicated NONE). Differs from instance 6's entity: this loop is on
          Volunteer, the other is the BackgroundCheck fork.
        test_recipe:
          setup:
            - "UNSUPERVISED volunteer ACTIVE via ENHANCED check adjudicated at clock default 2026-08-01T00:00:00Z (expires_at 2027-08-01T00:00:00Z); CORE module never expires"
            - "clock advanced to 2027-08-01T00:00:01Z: check EXPIRED, volunteer RESCREEN_REQUIRED"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "CORE", title: "Core Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"] }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Cyclic Cy", email: "cy@x.com", contact_type: "UNSUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "ENHANCED", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk1_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk1_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T00:00:01Z" }, as: DistrictCoordinator, captures: { sweep_expired: $.data.expired_check_count, sweep_rescreened: $.data.volunteers_rescreened_count } }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator, captures: { v_ver2: $.data.version } }
          trigger:
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "ENHANCED", expected_volunteer_version: "${v_ver2}" }, as: DistrictCoordinator, captures: { chk2_id: $.data.id } }
            - { call: "POST /background-checks/${chk2_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator, captures: { chk2_exp: $.data.expires_at } }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
          assert:
            - "sweep reported expired_check_count == 1 and volunteers_rescreened_count == 1"
            - "BackgroundCheck.${chk1_id}.status == EXPIRED"
            - "BackgroundCheck.${chk2_id}.status == CLEARED"
            - "BackgroundCheck.${chk2_id}.expires_at == 2028-07-31T00:00:01Z"
            - "Volunteer.${v_id}.status == ACTIVE"

      - name: background_check_branching_outcomes
        grounds:
          - state_machines.BackgroundCheck.PENDING_to_CLEARED
          - state_machines.BackgroundCheck.PENDING_to_DENIED
          - state_machines.Volunteer.UNDER_SCREENING_to_DENIED
        distinguishing_aspect: |
          Branching fork on BackgroundCheck (different entity from instance 5):
          two volunteers with identical PENDING BASIC checks diverge at
          adjudication — findings NONE branches to CLEARED + volunteer ACTIVE,
          findings DISQUALIFYING branches to DENIED + volunteer DENIED (terminal)
          with divergent side-effect sets.
        test_recipe:
          setup:
            - "two SUPERVISED volunteers each UNDER_SCREENING with a PENDING BASIC check; ORIENT training recorded for both"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Good Gail", email: "gail@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { vg_id: $.data.id, vg_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${vg_id}", level: "BASIC", expected_volunteer_version: "${vg_ver}" }, as: DistrictCoordinator, captures: { chg_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${vg_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /volunteers", payload: { full_name: "Bad Bob", email: "bob@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { vb_id: $.data.id, vb_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${vb_id}", level: "BASIC", expected_volunteer_version: "${vb_ver}" }, as: DistrictCoordinator, captures: { chb_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${vb_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
          trigger:
            - { call: "POST /background-checks/${chg_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator, captures: { g_exp: $.data.expires_at } }
            - { call: "POST /background-checks/${chb_id}/adjudicate", payload: { findings: "DISQUALIFYING" }, as: DistrictCoordinator, captures: { b_status: $.data.status } }
            - { call: "GET /volunteers/${vg_id}", payload: {}, as: DistrictCoordinator }
            - { call: "GET /volunteers/${vb_id}", payload: {}, as: DistrictCoordinator, captures: { vb_denied_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${vb_id}", level: "BASIC", expected_volunteer_version: "${vb_denied_ver}" }, as: DistrictCoordinator, captures: { deny_err: $.data.error_id } }
          assert:
            - "BackgroundCheck.${chg_id}.status == CLEARED and expires_at == 2028-07-31T00:00:00Z"
            - "Volunteer.${vg_id}.status == ACTIVE"
            - "BackgroundCheck.${chb_id}.status == DENIED and expires_at is null"
            - "Volunteer.${vb_id}.status == DENIED"
            - "re-screening attempt on DENIED volunteer fails with error_id == ERR_VOLUNTEER_INVALID_STATE"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: incident_suspension_cascade
        grounds:
          - state_machines.Volunteer.ACTIVE_to_SUSPENDED
          - entities.IncidentReport.fields.severity
          - calculations.opportunity_fill
        distinguishing_aspect: |
          Depth-3 cascade triggered by incident filing: IncidentReport(HIGH)
          mutates Volunteer (->SUSPENDED), that suspension mutates Placement
          (->CANCELLED, SYSTEM_SUSPENSION), and each placement cancellation
          mutates Opportunity (committed_count/projected_count recompute); a
          parallel hop force-closes the OPEN VisitCheckIn. Each hop is caused
          by the previous mutation, not by the original POST.
        test_recipe:
          setup:
            - "ACTIVE volunteer with CONFIRMED placement (opp cap 2, window 2026-08-10T14:00:00Z..2026-08-10T17:00:00Z) and an OPEN check-in (badge LNC-0001) at clock 2026-08-10T13:30:00Z"
          setup_api_calls:
            - { call: "POST /training-modules", payload: { module_code: "ORIENT", title: "Volunteer Orientation", required_contact_types: ["SUPERVISED", "UNSUPERVISED"], validity_days: 365 }, as: DistrictCoordinator, captures: { mod_id: $.data.id } }
            - { call: "POST /volunteers", payload: { full_name: "Suspense Sue", email: "sue@x.com", contact_type: "SUPERVISED" }, as: DistrictCoordinator, captures: { v_id: $.data.id, v_ver: $.data.version } }
            - { call: "POST /background-checks", payload: { volunteer_id: "${v_id}", level: "BASIC", expected_volunteer_version: "${v_ver}" }, as: DistrictCoordinator, captures: { chk_id: $.data.id } }
            - { call: "POST /training-records", payload: { volunteer_id: "${v_id}", module_id: "${mod_id}", completed_at: "2026-07-01T00:00:00Z" }, as: DistrictCoordinator }
            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Library Help", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-10T14:00:00Z", ends_at: "2026-08-10T17:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
