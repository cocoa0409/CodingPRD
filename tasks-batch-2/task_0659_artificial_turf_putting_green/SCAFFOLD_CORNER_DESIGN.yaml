              payload: { project_id: "${proj_id}", design_layout_id: "${d_id}", base_prep_scope_id: "${s_id}", deposit_pct: 0.30 }
              as: SalesRep
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/send"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_SCOPE_NOT_FINALIZED (409)"
            - "Quote.${q_id}.status remains DRAFT"

      - name: crew_double_booked_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_CREW_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_window_interior_overlap_rejected
          rationale: "ERR_CREW_DOUBLE_BOOKED is the asserted error of that §1.8 overlap instance."

      - name: stale_project_version_error
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[quote-accept-stale-project]
          - errors[ERR_STALE_PROJECT_VERSION]
        excluded_because:
          difficulty_instance: non_linear_state_machine / quote_revise_cycle_spawns_successor
          rationale: "OCC stale-version on quote accept is exercised by the dedicated OCC corner instance below (occ_stale_version_on_quote_accept); this stub records the error mapping."

