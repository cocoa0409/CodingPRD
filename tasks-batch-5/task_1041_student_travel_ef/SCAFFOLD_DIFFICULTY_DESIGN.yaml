scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_provisional_over_price_locked_vs_final_over_amount_paid
        grounds:
          - calculations.refund_amount
          - entities.Enrollment.fields.price_locked_cents
          - entities.PaymentPlan.fields.amount_paid_cents
        distinguishing_aspect: |
          On the SAME enrollment at the SAME clock, refund_amount.provisional uses
          refundable_base = price_locked_cents (250000) while refund_amount.final uses
          refundable_base = amount_paid_cents (30000); at refund_pct 0.75 the two
          diverge 187500 != 22500. Domain: Enrollment refund accounting (money).
        test_recipe:
          setup:
            - "Clock at 2026-08-18 (75 days before depart 2026-11-01 -> refund tier 0.75)."
            - "One OPEN departure priced 250000; one PENDING enrollment (no add-ons, no insurance) so price_locked_cents = 250000."
            - "ACTIVE plan; only the 30000 deposit paid -> amount_paid_cents = 30000, payment_status PARTIAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "rivera1@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Sam Lee", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "MALE" }
              as: Operator
              captures: { enr_id: $.data.id, enr_ver: $.data.version, price_locked: $.data.price_locked_cents }
            - call: "POST /payment-plans"
              payload: { enrollment_id: "${enr_id}", installment_count: 4, expected_enrollment_version: "${enr_ver}" }
              as: Operator
              captures: { plan_id: $.data.id }
            - call: "POST /payments"
              payload: { payment_plan_id: "${plan_id}", amount_cents: 30000, kind: "DEPOSIT" }
              as: Operator
          trigger:
            - call: "GET /enrollments/${enr_id}/refund-quote"
              payload: {}
              as: Operator
              captures: { prov: $.data.provisional_refund_cents, fin: $.data.final_refund_cents, pct: $.data.refund_pct }
          assert:
            - "refund-quote.days_before == 75"
            - "refund-quote.refund_pct == 0.75"
            - "refund-quote.provisional_refund_cents == 187500"
            - "refund-quote.final_refund_cents == 22500"
            - "provisional_refund_cents != final_refund_cents (187500 != 22500)"

      - name: free_spot_provisional_counts_enrolled_vs_final_counts_paid_in_full
        grounds:
          - calculations.free_spot_credit
          - entities.Departure.fields.free_spots_earned
          - entities.Departure.fields.paid_in_full_count
        distinguishing_aspect: |
          On the SAME departure (chaperone_ratio 2), free_spot_credit.provisional counts
          all non-cancelled enrollees (2 -> 2//2 = 1 free spot, credit 250000) while
          free_spot_credit.final counts only PAID_IN_FULL enrollees (1 -> 1//2 = 0,
          credit 0). Domain: Departure roster / leader credit (seats), distinct from
          the Enrollment-refund dual variant.
        test_recipe:
          setup:
            - "Clock 2026-08-18. One OPEN departure, chaperone_ratio 2, price 250000."
            - "Two PENDING enrollments; enrollment #1 paid in full (250000), enrollment #2 only deposit (30000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "rivera2@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10, chaperone_ratio: 2 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "A One", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "MALE" }
              as: Operator
              captures: { e1: $.data.id, e1v: $.data.version }
            - call: "POST /payment-plans"
              payload: { enrollment_id: "${e1}", installment_count: 1, expected_enrollment_version: "${e1v}" }
              as: Operator
              captures: { p1: $.data.id }
            - call: "POST /payments"
              payload: { payment_plan_id: "${p1}", amount_cents: 250000, kind: "DEPOSIT" }
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "B Two", traveler_dob: "2010-06-01T00:00:00Z", traveler_gender: "FEMALE" }
              as: Operator
              captures: { e2: $.data.id, e2v: $.data.version }
            - call: "POST /payment-plans"
              payload: { enrollment_id: "${e2}", installment_count: 1, expected_enrollment_version: "${e2v}" }
              as: Operator
              captures: { p2: $.data.id }
            - call: "POST /payments"
              payload: { payment_plan_id: "${p2}", amount_cents: 30000, kind: "DEPOSIT" }
              as: Operator
          trigger:
            - call: "GET /departures/${dep_id}/summary"
              payload: {}
              as: Operator
              captures: { pfs: $.data.provisional_free_spots, ffs: $.data.final_free_spots }
          assert:
            - "summary.active_enrollment_count == 2"
            - "summary.paid_in_full_count == 1"
            - "summary.provisional_free_spots == 1"
            - "summary.provisional_credit_cents == 250000"
            - "summary.final_free_spots == 0"
            - "summary.final_credit_cents == 0"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: enrollment_price_earlybird_addons_insurance_mode_a
        grounds:
          - calculations.enrollment_price
          - entities.Enrollment.fields.add_ons
          - entities.Enrollment.fields.insurance_tier
        distinguishing_aspect: |
          MODE (a): price_locked_cents combines >=3 inputs with a conditional branch —
          gross(250000) minus early_bird_discount(round(250000*0.10)=25000, applied
          because clock 2026-07-15 <= early_bird_cutoff 2026-08-01) plus
          add_ons(EXCURSION 12000 + STEM_LAB 8000 = 20000) plus insurance(PREMIUM 19900)
          = 264900.
        test_recipe:
          setup:
            - "Clock 2026-07-15 (on/before early_bird_cutoff 2026-08-01 -> discount applies)."
            - "One OPEN departure priced 250000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "rivera3@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Cal Vez", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "NONBINARY", add_ons: ["EXCURSION", "STEM_LAB"], insurance_opted: true, insurance_tier: "PREMIUM" }
              as: Operator
              captures: { enr_id: $.data.id, price: $.data.price_locked_cents }
          assert:
            - "Enrollment.${enr_id}.price_locked_cents == 264900"

      - name: installment_split_floor_then_remainder_to_earliest_mode_b
        grounds:
          - calculations.installment_split
          - entities.PaymentPlan.fields.installment_amounts
          - entities.PaymentPlan.fields.deposit_cents
        distinguishing_aspect: |
          MODE (b): rounding/remainder ORDER is pinned. financed = 271900 - 30000 = 241900,
          n = 3 -> base_each = 80633, remainder = 1 allocated to the EARLIEST installment,
          giving installment_amounts == [80634, 80633, 80633] (sum 241900, no drift) —
          NOT round-each-then-sum.
        test_recipe:
          setup:
            - "Clock 2026-08-15 (after early_bird_cutoff -> no discount)."
            - "One OPEN departure priced 250000; enrollment with add_ons [EXCURSION] and insurance BASIC -> price_locked_cents = 271900."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "rivera4@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Dee Kay", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "FEMALE", add_ons: ["EXCURSION"], insurance_opted: true, insurance_tier: "BASIC" }
              as: Operator
              captures: { enr_id: $.data.id, enr_ver: $.data.version }
          trigger:
            - call: "POST /payment-plans"
              payload: { enrollment_id: "${enr_id}", installment_count: 3, expected_enrollment_version: "${enr_ver}" }
              as: Operator
              captures: { plan_id: $.data.id, amts: $.data.installment_amounts, total: $.data.total_cents }
          assert:
            - "PaymentPlan.${plan_id}.total_cents == 271900"
            - "PaymentPlan.${plan_id}.installment_amounts == [80634, 80633, 80633]"
            - "sum(PaymentPlan.${plan_id}.installment_amounts) == 241900"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_parallel_axes_lifecycle_and_payment_independent
        grounds:
          - state_machines.Enrollment.PENDING_to_CONFIRMED
          - state_machines.Enrollment.PARTIAL_to_PAID_IN_FULL
          - entities.Enrollment.fields.lifecycle_status
          - entities.Enrollment.fields.payment_status
        distinguishing_aspect: |
          PARALLEL axes on ONE entity: confirming moves lifecycle_status PENDING->CONFIRMED
          while payment_status stays PARTIAL; then a balance payment moves payment_status
          PARTIAL->PAID_IN_FULL while lifecycle_status stays CONFIRMED — the two axes evolve
          independently on the same Enrollment row.
        test_recipe:
          setup:
            - "Clock 2026-08-18. OPEN departure; PENDING enrollment (price 250000); ACTIVE plan; deposit 30000 paid -> payment_status PARTIAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "rivera5@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Eve Ng", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "FEMALE" }
              as: Operator
              captures: { enr_id: $.data.id, enr_ver: $.data.version }
            - call: "POST /payment-plans"
              payload: { enrollment_id: "${enr_id}", installment_count: 1, expected_enrollment_version: "${enr_ver}" }
              as: Operator
              captures: { plan_id: $.data.id }
            - call: "POST /payments"
              payload: { payment_plan_id: "${plan_id}", amount_cents: 30000, kind: "DEPOSIT" }
              as: Operator
          trigger:
            - call: "POST /enrollments/${enr_id}/confirm"
              payload: {}
              as: Operator
              captures: { lc: $.data.lifecycle_status, ps: $.data.payment_status }
            - call: "POST /payments"
              payload: { payment_plan_id: "${plan_id}", amount_cents: 220000, kind: "INSTALLMENT" }
              as: Operator
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: Operator
              captures: { lc2: $.data.lifecycle_status, ps2: $.data.payment_status }
          assert:
            - "confirm response: lifecycle_status == CONFIRMED AND payment_status == PARTIAL (payment axis unchanged by the lifecycle transition)"
            - "after the balance payment: Enrollment.${enr_id}.payment_status == PAID_IN_FULL AND lifecycle_status == CONFIRMED (lifecycle axis unchanged by the payment transition)"

      - name: permission_form_changes_requested_resubmit_cycle
        grounds:
          - state_machines.PermissionForm.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.PermissionForm.SUBMITTED_to_APPROVED
          - entities.PermissionForm.fields.status
        distinguishing_aspect: |
          CYCLE on a DIFFERENT entity: PermissionForm re-enters SUBMITTED it has already
          visited (SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED), then APPROVED — a genuine
          revision loop, unlike Enrollment's parallel axes.
        test_recipe:
          setup:
            - "Clock 2026-08-18. OPEN departure; one enrollment; a permission form submitted then sent back (status CHANGES_REQUESTED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "rivera6@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Fay Oh", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "FEMALE" }
              as: Operator
              captures: { enr_id: $.data.id }
            - call: "POST /permission-forms"
              payload: { enrollment_id: "${enr_id}", passport_number: "X1234567", passport_expiry: "2031-01-01T00:00:00Z", guardian_consent: true }
              as: Operator
              captures: { pf_id: $.data.id }
            - call: "POST /permission-forms/${pf_id}/submit"
              payload: {}
              as: Operator
            - call: "POST /permission-forms/${pf_id}/review"
              payload: { decision: "REQUEST_CHANGES" }
              as: Operator
          trigger:
            - call: "POST /permission-forms/${pf_id}/submit"
              payload: {}
              as: Operator
              captures: { s1: $.data.status }
            - call: "POST /permission-forms/${pf_id}/review"
              payload: { decision: "APPROVE" }
              as: Operator
              captures: { s2: $.data.status }
          assert:
            - "resubmit from CHANGES_REQUESTED returns PermissionForm.${pf_id}.status == SUBMITTED (cycle edge)"
            - "subsequent APPROVE returns PermissionForm.${pf_id}.status == APPROVED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: departure_cancel_cascades_enrollment_plan_refund_depth3
        grounds:
          - state_machines.Departure.OPEN_to_CANCELLED
          - state_machines.Enrollment.PENDING_to_CANCELLED
          - state_machines.PaymentPlan.PAID_to_REFUND_DUE
          - entities.PaymentPlan.fields.amount_refunded_cents
        distinguishing_aspect: |
          DEPTH-3 chain triggered by POST /departures/{id}/cancel: departure cancel ->
          Enrollment CANCELLED (cancel_reason DEPARTURE_CANCELLED) -> that enrollment's
          PaymentPlan PAID->REFUND_DUE->REFUNDED -> a Payment(kind=REFUND, 250000, full
          because operator-cancel forces refund_pct 1.00). Each hop is caused by the prior.
        test_recipe:
          setup:
            - "Clock 2026-08-18. OPEN departure capacity 30; one enrollment paid in full (250000, plan PAID, payment_status PAID_IN_FULL)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "rivera7@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Gus Ro", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "MALE" }
              as: Operator
              captures: { enr_id: $.data.id, enr_ver: $.data.version }
            - call: "POST /payment-plans"
              payload: { enrollment_id: "${enr_id}", installment_count: 1, expected_enrollment_version: "${enr_ver}" }
              as: Operator
              captures: { plan_id: $.data.id }
            - call: "POST /payments"
              payload: { payment_plan_id: "${plan_id}", amount_cents: 250000, kind: "DEPOSIT" }
              as: Operator
          trigger:
            - call: "POST /departures/${dep_id}/cancel"
              payload: { reason: "supplier_failure" }
              as: Operator
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: Operator
              captures: { lc: $.data.lifecycle_status, cr: $.data.cancel_reason, ps: $.data.payment_status }
            - call: "GET /payment-plans/${plan_id}"
              payload: {}
              as: Operator
              captures: { pstat: $.data.status, refunded: $.data.amount_refunded_cents }
            - call: "GET /departures/${dep_id}"
              payload: {}
              as: Operator
              captures: { avail: $.data.available_seats }
          assert:
            - "Enrollment.${enr_id}.lifecycle_status == CANCELLED"
            - "Enrollment.${enr_id}.cancel_reason == DEPARTURE_CANCELLED"
            - "Enrollment.${enr_id}.payment_status == REFUNDED"
            - "PaymentPlan.${plan_id}.status == REFUNDED"
            - "PaymentPlan.${plan_id}.amount_refunded_cents == 250000"
            - "Departure.${dep_id}.available_seats == 30"

      - name: full_payment_cascades_paid_count_free_spots_and_leader_credit_depth3
        grounds:
          - state_machines.Enrollment.PARTIAL_to_PAID_IN_FULL
          - entities.Departure.fields.paid_in_full_count
          - entities.Departure.fields.free_spots_earned
          - entities.GroupLeader.fields.free_spot_credit_cents
        distinguishing_aspect: |
          DEPTH-2+ chain triggered by POST /payments (a DIFFERENT trigger than departure
          cancel): the balance payment flips Enrollment.payment_status PARTIAL->PAID_IN_FULL,
          which bumps Departure.paid_in_full_count, which drives Departure.free_spots_earned
          recompute (ratio 1 -> 1), which drives GroupLeader.free_spot_credit_cents -> 250000.
        test_recipe:
          setup:
            - "Clock 2026-08-18. OPEN departure with chaperone_ratio 1, price 250000; one enrollment; deposit 30000 paid (PARTIAL). Leader credit 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
