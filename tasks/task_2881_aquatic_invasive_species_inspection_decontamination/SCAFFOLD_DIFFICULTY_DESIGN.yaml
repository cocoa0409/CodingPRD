      - name: decon_bay_occupation_is_closed_and_aggregate_against_bay_count
        grounds:
          - validations.priority_28_ERR_DECON_BAY_UNAVAILABLE
          - entities.DeconOrder.fields.treatment_started_at
          - entities.DeconOrder.fields.bay_released_at
          - entities.InspectionStation.fields.decon_bay_count
          - endpoints.POST_/decon-orders/{id}/treatment
        distinguishing_aspect: |
          Resource: the station's decontamination bays, with AGGREGATE capacity
          decon_bay_count rather than capacity 1, and CLOSED intervals at both ends
          that include the BAY_BUFFER_MINUTES tail: order A occupies
          [2026-08-05T09:00:00Z, 2026-08-05T09:32:00Z] because bay_released_at is
          treated_at 09:02 plus 30 minutes. A second treatment beginning at exactly
          09:32:00Z touches that interval at a single instant, which counts as an
          intersection, so it is refused at bay_count 1; one second later it is
          accepted, and at bay_count 2 the same instant is accepted. Occupancy is
          also status-filtered to {TREATED, RETREAT_REQUIRED} with a non-null
          treatment_started_at, and the order being treated never counts against
          itself.
