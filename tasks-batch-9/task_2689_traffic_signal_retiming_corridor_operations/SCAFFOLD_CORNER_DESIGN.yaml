          - calculations.corridor_priority_score
          - entities.Corridor.fields.complaint_count_12mo
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The 365-day window is a CLOSED interval and the status filter drops CLOSED_NO_ACTION: a complaint whose received_at falls exactly on the lower bound is counted, the same complaint one second out of the window is not, and a same-day complaint that was triaged NO_ACTION is never counted at all — three filters that a naive `count all complaints on the corridor` implementation collapses into one wrong number."
        test_recipe:
          setup:
