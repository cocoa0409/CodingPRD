          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "OC", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 50 }
