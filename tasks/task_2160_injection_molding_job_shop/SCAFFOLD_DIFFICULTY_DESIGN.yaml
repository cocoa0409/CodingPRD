            - { call: "POST /quotes", payload: { customer_id: "${cust_id}", mold_id: "${mold_id}", part_weight_grams: 32, cycle_time_sec: 38, cavitation: 4, resin_grade: "PP-H", resin_price_cents_per_kg: 210, annual_volume: 120000 }, as: SalesEngineer, captures: { quote_id: $.data.id } }
            - { call: "POST /quotes/${quote_id}/price", payload: { press_id: "${p150_id}" }, as: SalesEngineer }
            - { call: "POST /quotes/${quote_id}/submit", payload: {}, as: SalesEngineer }
            - { call: "GET /molds/${mold_id}", payload: {}, as: SalesEngineer, captures: { mold_v1: $.data.version } }
            - { call: "POST /quotes/${quote_id}/customer-decision", payload: { decision: "ACCEPT", expected_mold_version: "${mold_v1}" }, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /ppap-submissions", payload: { mold_id: "${mold_id}", quote_id: "${quote_id}", level: 3, max_regrind_bp: 2000 }, as: QualityEngineer, as_user_id: "qe-alice", captures: { ppap_id: $.data.id } }
            - { call: "POST /ppap-submissions/${ppap_id}/submit", payload: { fai_dimensional_pass: true, fai_sample_shots: 30 }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /ppap-submissions/${ppap_id}/internal-review", payload: { decision: "ENDORSE" }, as: QualityEngineer, as_user_id: "qe-bob" }
            - { call: "POST /molds/${mold_id}/quality-hold", payload: { action: "QUARANTINE", reason: "witness marks on the parting line" }, as: QualityEngineer }
            - { call: "GET /molds/${mold_id}", payload: {}, as: QualityEngineer, captures: { mold_v3: $.data.version } }
          trigger:
            - { call: "POST /ppap-submissions/${ppap_id}/customer-decision", payload: { decision: "APPROVE", expected_mold_version: "${mold_v3}" }, as: CustomerRep, as_user_id: "${cust_id}", captures: { err_id: $.data.error_id } }
            - { call: "POST /molds/${mold_id}/quality-hold", payload: { action: "RELEASE", reason: "parting line stoned and re-sampled" }, as: QualityEngineer }
            - { call: "GET /molds/${mold_id}", payload: {}, as: QualityEngineer, captures: { mold_v4: $.data.version } }
            - { call: "POST /ppap-submissions/${ppap_id}/customer-decision", payload: { decision: "APPROVE", expected_mold_version: "${mold_v4}" }, as: CustomerRep, as_user_id: "${cust_id}" }
          assert:
            - "the first customer-decision call returns status 409 and ${err_id} == ERR_MOLD_QUARANTINED"
            - "after the first call PPAPSubmission.${ppap_id}.status == UNDER_REVIEW and Mold.${mold_id}.status == QUARANTINED"
            - "after the RELEASE call Mold.${mold_id}.status == SAMPLING because approved_max_regrind_bp was still null"
            - "the second customer-decision call returns 200, PPAPSubmission.${ppap_id}.status == APPROVED"
            - "Mold.${mold_id}.status == PPAP_APPROVED and Mold.${mold_id}.approved_max_regrind_bp == 2000"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: press_half_open_window_needs_full_changeover_buffer
        grounds:
          - calculations.press_window_overlap
          - errors[ERR_PRESS_WINDOW_CONFLICT]
          - validations[priority=16]
          - entities.Press.fields.committed_minutes_scheduled
          - state_machines.ProductionJob.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          Resource one, the Press, uses HALF-OPEN windows separated by a mandatory 45-minute
          CHANGEOVER_BUFFER_MINUTES: a job starting 44 minutes after the previous job ends is
          rejected, and the same job starting at exactly 45 minutes is accepted. Touching or
          near-touching is never enough on a press.
        test_recipe:
          setup:
            - "Mold M-1 PPAP_APPROVED on press P-150."
            - "Job 1 occupies 2026-09-10T08:00Z-12:00Z (240 minutes) and is SCHEDULED."
            - "Job 2 is DRAFT for 2026-09-10T12:44Z-14:00Z (gap 44 minutes); Job 3 is DRAFT for 2026-09-10T12:45Z-14:00Z (gap exactly 45 minutes, 75 minutes long)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
