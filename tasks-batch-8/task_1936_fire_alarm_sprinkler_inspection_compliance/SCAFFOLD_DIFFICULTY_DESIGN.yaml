              captures: { sys_id: $.data.id }
            - call: "POST /fire-compliance/systems/${sys_id}/devices"
              payload: { device_type: "SMOKE_DETECTOR", serial_no: "SD-P1" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/contractors/${con_id}/technicians"
              payload: { full_name: "Lapsed Larry", nicet_level: "I" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { tech_id: $.data.id }
            - call: "POST /fire-compliance/technicians/${tech_id}/license-records"
              payload: { license_class: "ALARM", issued_on: "2024-01-01", expires_on: "2025-01-01" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/properties/${prop_id}/inspection-plans"
              payload: { plan_year: 2026, expected_property_version: "${prop_v}" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/publish"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
            - call: "POST /fire-compliance/inspection-plans/${plan_id}/events"
              payload: { system_id: "${sys_id}", lead_technician_id: "${tech_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }
              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /fire-compliance/inspection-events/${ev_id}/cancel"
              payload: {}
              as: ContractorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /fire-compliance/inspection-events/${ev_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE (state priority 5 beats license business_safety priority 7)"
            - "HTTP status == 409"
      - name: temporal_overlap_beats_technician_capacity
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_IMPAIRMENT_OVERLAP]
          - errors[ERR_TECHNICIAN_CAPACITY]
        distinguishing_aspect: |
          Pair (business_temporal-overlap vs business_temporal-capacity — two
          different metrics within temporal, resolved by explicit sub-ordering
          11 before 12): when a new impairment BOTH overlaps an existing
          impairment AND its creator's only qualified technician is at
          capacity, the impairment create must fail with
          ERR_IMPAIRMENT_OVERLAP. (Capacity is exercised separately through
          event create; this instance pins the impairment-side ordering.)
        test_recipe:
          setup:
            - "System with an existing non-CLOSED PLANNED impairment 2026-08-10T08:00..12:00"
            - "New PLANNED impairment attempted 2026-08-10T10:00..14:00 (overlaps)"
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
