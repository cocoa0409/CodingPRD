scenario: |
  Custom-Exempt Slaughter & Cut-Wrap Scheduling (local custom-exempt locker): appointment booking far in advance & deposit, animal drop-off & identification through process, cut sheet capture & yield-based instruction, split-carcass ownership among multiple buyers, hanging weight billing & processing fee, freezer storage & pickup deadline, custom-exempt vs inspected labeling restriction, no-show/abandoned meat policy

domain_name: custom-exempt-locker
api_prefix: /locker

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer full name" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Count of no-show appointments and abandoned-meat forfeitures charged to this customer" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | ELEVATED_DEPOSIT | BLOCKED — derived from no_show_strikes: 0 → ACTIVE; >= 1 → ELEVATED_DEPOSIT; >= 2 → BLOCKED" }

  - name: CapacityDay
    parent: null
    common_fields: true
    fields:
      - { name: date, type: string, source: input, description: "Slaughter calendar date, ISO 8601 date (YYYY-MM-DD); unique across all CapacityDay rows" }
      - { name: capacity_head, type: integer, source: input, description: "Maximum head count that may be booked on this date (>= 1)" }
      - { name: booked_head, type: integer, source: computed, default: 0, description: "Sum of head_count over Appointments on this day with status IN {PENDING_DEPOSIT, CONFIRMED}" }
      - { name: status, type: enum, source: computed, description: "OPEN | FULL — FULL exactly when booked_head == capacity_head, else OPEN" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the booking party" }
      - { name: capacity_day_id, type: string, source: input, description: "FK -> CapacityDay.id; the reserved slaughter date" }
      - { name: species, type: enum, source: input, description: "BEEF | HOG | LAMB | GOAT" }
      - { name: head_count, type: integer, source: input, description: "Number of animals booked (>= 1)" }
      - { name: appointment_date, type: string, source: computed, description: "Denormalized copy of CapacityDay.date at booking/reschedule time" }
      - { name: deposit_amount_cents, type: integer, source: computed, description: "Deposit required to confirm, per calculation deposit_quote (variant selected by Customer.status at booking)" }
      - { name: deposit_paid_cents, type: integer, source: system, default: 0, description: "Deposit cash actually received" }
      - { name: deposit_due_at, type: datetime, source: computed, description: "= created_at + DEPOSIT_WINDOW_HOURS (48h); PENDING_DEPOSIT appointment expires after this instant" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Deposit refunded on cancellation per cancel_refund_policy; set when status becomes CANCELLED" }
      - { name: status, type: enum, source: system, description: "PENDING_DEPOSIT | CONFIRMED | COMPLETED | CANCELLED | NO_SHOW | EXPIRED" }

  - name: Animal
    parent: null
    common_fields: true
    fields:
      - { name: appointment_id, type: string, source: system, description: "FK -> Appointment.id; owning appointment (animals are created when the appointment confirms)" }
      - { name: tag_id, type: string, source: input, description: "Plant-assigned identification tag recorded at drop-off; unique among all Animals not in VOIDED; immutable once set; follows the carcass through every later transition" }
      - { name: species, type: enum, source: system, description: "Copied from Appointment.species at creation: BEEF | HOG | LAMB | GOAT" }
      - { name: live_weight_lbs, type: number, source: input, description: "Scale weight at drop-off (1 decimal), recorded on receive" }
      - { name: hanging_weight_lbs, type: number, source: input, description: "Hot/hanging carcass weight (1 decimal), recorded on weigh" }
      - { name: received_at, type: datetime, source: system, description: "Logical timestamp of drop-off (receive transition)" }
      - { name: slaughtered_at, type: datetime, source: system, description: "Logical timestamp of slaughter" }
      - { name: weighed_at, type: datetime, source: system, description: "Logical timestamp hanging weight was recorded; hang-time clock starts here" }
      - { name: status, type: enum, source: system, description: "EXPECTED | RECEIVED | SLAUGHTERED | HANGING | CUTTING | READY | COMPLETE | VOIDED" }

  - name: CarcassShare
    parent: null
    common_fields: true
    fields:
      - { name: animal_id, type: string, source: system, description: "FK -> Animal.id; carcass this share is cut from (path-bound at creation)" }
      - { name: owner_customer_id, type: string, source: input, description: "FK -> Customer.id; buyer who owns this share (split-carcass ownership)" }
      - { name: share_fraction, type: number, source: input, description: "Fraction of the carcass owned, 0 < f <= 1.0, at most 3 decimal places" }
      - { name: intended_use, type: enum, source: input, description: "OWNER_USE | RESALE — declared end use; custom-exempt labeling forbids RESALE" }
      - { name: share_hanging_weight_lbs, type: number, source: computed, description: "Allocated hanging weight at finalize, per share_weight_allocation (1 decimal); sum over shares == Animal.hanging_weight_lbs exactly" }
      - { name: estimated_share_weight_lbs, type: number, source: computed, description: "Provisional estimate = round_half_up(Animal.live_weight_lbs * DRESS_PCT[species] * share_fraction, 1)" }
      - { name: status, type: enum, source: system, description: "PENDING | CONFIRMED | READY | PICKED_UP | FORFEITED" }

  - name: CutSheet
    parent: null
    common_fields: true
    fields:
      - { name: share_id, type: string, source: system, description: "FK -> CarcassShare.id; the share these instructions apply to (path-bound at creation); exactly one cut sheet per share" }
      - { name: grind_pct, type: integer, source: input, description: "Percent of the share's trimmable weight to grind; input domain 0..100; feasibility rule grind_pct <= MAX_GRIND_PCT (60) is enforced at submit (ERR_YIELD_INFEASIBLE)" }
      - { name: package_weight_lbs, type: number, source: input, description: "Target weight per wrapped package (>= 1.0, 1 decimal)" }
      - { name: steak_thickness_in, type: number, source: input, description: "Steak cut thickness in inches (0.5..2.0), optional", default: null }
      - { name: notes, type: string, source: input, description: "Free-text butcher instructions, optional", default: "" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | LOCKED — LOCKED when the animal enters CUTTING" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: share_id, type: string, source: system, description: "FK -> CarcassShare.id; one invoice per share, created at split finalize" }
      - { name: species, type: enum, source: system, description: "Copied from Animal.species for rate lookup" }
      - { name: processing_fee_cents, type: integer, source: computed, description: "Tiered hanging-weight processing fee per invoice_settlement (final variant)" }
      - { name: slaughter_share_cents, type: integer, source: computed, description: "SLAUGHTER_FEE[species] * share_fraction, round_half_up to cents" }
      - { name: storage_cents, type: integer, source: computed, default: 0, description: "Accrued freezer storage fee for the share's StorageRecord; recomputed on payment, on pickup, and by waive-storage" }
      - { name: storage_waived, type: boolean, source: system, default: false, description: "Set true by waive-storage; forces the storage component of total to 0" }
      - { name: surcharge_cents, type: integer, source: system, default: 0, description: "ABANDON_SURCHARGE_CENTS (5000) added when the share is forfeited" }
      - { name: deposit_credit_cents, type: integer, source: computed, description: "This share's allocation of the appointment deposit, per deposit_credit_allocation" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Quoted total at creation per invoice_settlement PROVISIONAL variant (estimated weights, storage 0); immutable after creation" }
      - { name: total_cents, type: integer, source: computed, description: "Current final-variant total: processing_fee_cents + slaughter_share_cents + (storage_waived ? 0 : storage_cents) + surcharge_cents - deposit_credit_cents" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Sum of recorded payments" }
      - { name: amount_due_cents, type: integer, source: computed, description: "= max(0, total_cents - amount_paid_cents)" }
      - { name: status, type: enum, source: system, description: "OPEN | PARTIALLY_PAID | PAID | COLLECTIONS" }

  - name: StorageRecord
    parent: null
    common_fields: true
    fields:
      - { name: share_id, type: string, source: system, description: "FK -> CarcassShare.id; the boxed share occupying the freezer (one record per share)" }
      - { name: ready_at, type: datetime, source: system, description: "Logical timestamp the share became READY (complete-fabrication); storage clock starts here" }
      - { name: picked_up_at, type: datetime, source: system, description: "Logical pickup timestamp; null until pickup", default: null }
      - { name: freezer_units, type: integer, source: system, default: 1, description: "Freezer units occupied = FREEZER_UNITS_PER_SHARE (1) per share" }
      - { name: days_stored, type: integer, source: computed, description: "Whole days from ready_at to now (STORED) or to picked_up_at (PICKED_UP/ABANDONED)" }
      - { name: accrued_fee_cents, type: integer, source: computed, description: "Per storage_fee: max(0, days_stored - FREE_STORAGE_DAYS) * STORAGE_DAILY_CENTS" }
      - { name: status, type: enum, source: system, description: "STORED | PICKED_UP | ABANDONED" }

  - name: LabelRecord
    parent: null
    common_fields: true
    fields:
      - { name: share_id, type: string, source: system, description: "FK -> CarcassShare.id; one label record per share, created at split finalize" }
      - { name: program, type: enum, source: system, default: "CUSTOM_EXEMPT", description: "CUSTOM_EXEMPT — this plant performs custom-exempt slaughter only; inspected/retail labeling is never issued" }
      - { name: label_text, type: string, source: computed, description: "Always begins with the exact string 'NOT FOR SALE' followed by owner name and share description; custom-exempt product may not bear an inspection legend" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED — approval is the compliance gate before pickup" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Appointment
    initial_state: PENDING_DEPOSIT
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, EXPIRED]
    transitions:
      - from: PENDING_DEPOSIT
        to: CONFIRMED
        trigger: "POST /locker/appointments/{id}/pay-deposit"
        actor: Customer
        preconditions:
          - "appointment.status == PENDING_DEPOSIT"
          - "amount_cents >= deposit_amount_cents - deposit_paid_cents (else ERR_DEPOSIT_INSUFFICIENT)"
        side_effects:
          - "deposit_paid_cents += amount_cents"
          - "creates head_count Animal rows (status EXPECTED, species copied from appointment)"
          - "increments Appointment.version by 1"
      - from: PENDING_DEPOSIT
        to: CANCELLED
        trigger: "POST /locker/appointments/{id}/cancel"
        actor: "Customer (owner) | PlantOperator | PlantManager"
        preconditions: []
        side_effects:
          - "CapacityDay.booked_head -= head_count (recompute FULL -> OPEN)"
          - "refund_cents = deposit_paid_cents (nothing paid -> 0)"
          - "increments Appointment.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /locker/appointments/{id}/cancel"
        actor: "Customer (owner) | PlantOperator | PlantManager"
        preconditions:
          - "no Animal of this appointment has status beyond RECEIVED (i.e., all animals still EXPECTED); else ERR_INVALID_STATE"
        side_effects:
          - "each EXPECTED Animal -> VOIDED; each VOIDED animal releases 1 head: CapacityDay.booked_head -= 1 per animal (recompute FULL -> OPEN)"
          - "refund_cents per cancel_refund_policy: full deposit_paid_cents if (appointment_date - current_date) >= CANCEL_FULL_REFUND_DAYS (7), else 0 (deposit forfeited)"
          - "increments Appointment.version by 1"
      - from: PENDING_DEPOSIT
        to: PENDING_DEPOSIT
        trigger: "POST /locker/appointments/{id}/reschedule"
        actor: Customer
        preconditions:
          - "expected_appointment_version == Appointment.version (OCC, else ERR_STALE_VERSION)"
          - "new CapacityDay exists, its date >= current_date + MIN_LEAD_DAYS (14), and booked_head + head_count <= capacity_head there"
        side_effects:
          - "old CapacityDay.booked_head -= head_count; new CapacityDay.booked_head += head_count (recompute both statuses)"
          - "appointment_date = new CapacityDay.date"
          - "increments Appointment.version by 1"
        note: "Self-loop: status unchanged; only the reserved day moves."
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /locker/appointments/{id}/reschedule"
        actor: Customer
        preconditions:
          - "expected_appointment_version == Appointment.version (OCC, else ERR_STALE_VERSION)"
          - "new CapacityDay exists, its date >= current_date + MIN_LEAD_DAYS (14), and booked_head + head_count <= capacity_head there"
        side_effects:
          - "old CapacityDay.booked_head -= head_count; new CapacityDay.booked_head += head_count (recompute both statuses)"
          - "appointment_date = new CapacityDay.date"
          - "increments Appointment.version by 1"
        note: "Self-loop: status unchanged; only the reserved day moves."
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /locker/appointments/{id}/no-show (staff) OR system run-daily sweep when current_date > appointment_date and all animals still EXPECTED"
        actor: "PlantOperator | PlantManager | system"
        preconditions:
          - "current_date >= appointment_date (manual mark; else ERR_NO_SHOW_PREMATURE)"
          - "every Animal of the appointment still EXPECTED (nothing was dropped off)"
        side_effects:
          - "link 1: each EXPECTED Animal -> VOIDED"
          - "link 2: each Animal -> VOIDED releases 1 head on CapacityDay (booked_head -= 1 per animal, recompute FULL -> OPEN)"
          - "deposit forfeited (deposit_paid_cents retained by plant, refund_cents = 0)"
          - "Customer.no_show_strikes += 1 and Customer.status recomputed (>= 1 ELEVATED_DEPOSIT, >= 2 BLOCKED)"
          - "increments Appointment.version by 1"
      - from: PENDING_DEPOSIT
        to: EXPIRED
        trigger: "system run-daily sweep when now > deposit_due_at"
        actor: system
        preconditions: []
        side_effects:
          - "CapacityDay.booked_head -= head_count (recompute FULL -> OPEN); no animals existed; no strike charged"
          - "increments Appointment.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system (automatic bubble-up when the last EXPECTED Animal of the appointment leaves EXPECTED via receive)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Appointment.version by 1"

  - entity: Animal
    initial_state: EXPECTED
    terminal_states: [COMPLETE, VOIDED]
    transitions:
      - from: EXPECTED
        to: RECEIVED
        trigger: "POST /locker/animals/{id}/receive"
        actor: "PlantOperator | PlantManager"
        preconditions:
          - "tag_id unique among Animals not in VOIDED (else ERR_DUPLICATE_TAG)"
        side_effects:
          - "sets tag_id, live_weight_lbs, received_at"
          - "bubble-up: if no EXPECTED animals remain on the appointment, Appointment CONFIRMED -> COMPLETED"
          - "increments Animal.version by 1"
      - from: EXPECTED
        to: VOIDED
        trigger: "system cascade (appointment cancelled or marked NO_SHOW)"
        actor: system
        preconditions: []
        side_effects:
          - "CapacityDay.booked_head -= 1 (per-animal release; recompute FULL -> OPEN)"
          - "increments Animal.version by 1"
      - from: RECEIVED
        to: SLAUGHTERED
        trigger: "POST /locker/animals/{id}/slaughter"
        actor: "PlantOperator | PlantManager"
        preconditions: []
        side_effects:
          - "sets slaughtered_at"
          - "increments Animal.version by 1"
      - from: SLAUGHTERED
        to: HANGING
        trigger: "POST /locker/animals/{id}/weigh"
        actor: "PlantOperator | PlantManager"
        preconditions: []
        side_effects:
          - "sets hanging_weight_lbs, weighed_at (hang clock starts)"
          - "increments Animal.version by 1"
      - from: HANGING
        to: CUTTING
        trigger: "POST /locker/animals/{id}/start-fabrication"
        actor: "PlantOperator | PlantManager"
        preconditions:
          - "split finalized: at least one CONFIRMED share exists covering fraction sum == 1.0 (else ERR_SPLIT_NOT_FINALIZED)"
          - "every CONFIRMED share has a CutSheet with status SUBMITTED (else ERR_CUT_SHEET_MISSING)"
          - "now >= weighed_at + MIN_HANG_DAYS (3) (else ERR_MIN_HANG_NOT_MET)"
        side_effects:
          - "each SUBMITTED CutSheet of this animal's shares -> LOCKED"
          - "increments Animal.version by 1"
      - from: CUTTING
        to: READY
        trigger: "POST /locker/animals/{id}/complete-fabrication"
        actor: "PlantOperator | PlantManager"
        preconditions:
          - "freezer room: count of StorageRecord with status STORED + number of CONFIRMED shares of this animal <= FREEZER_CAPACITY_UNITS (4) (else ERR_FREEZER_FULL); windows are half-open [ready_at, picked_up_at) so a pickup at instant T frees the unit for a ready at T"
        side_effects:
          - "each CONFIRMED CarcassShare -> READY"
          - "creates one StorageRecord per share (status STORED, ready_at = now, freezer_units = 1)"
          - "Invoice of each share recomputed with final variant totals (status unchanged, typically OPEN)"
          - "increments Animal.version by 1"
      - from: READY
        to: COMPLETE
        trigger: "system (automatic bubble-up when every share of the animal is PICKED_UP or FORFEITED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Animal.version by 1"

  - entity: CarcassShare
    initial_state: PENDING
    terminal_states: [PICKED_UP, FORFEITED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /locker/animals/{id}/shares/finalize (applies to all PENDING shares of the animal)"
        actor: "PlantOperator | PlantManager"
        preconditions:
          - "Animal.status == HANGING (hanging weight recorded; else ERR_INVALID_STATE)"
          - "sum of share_fraction over the animal's shares == 1.0 exactly (else ERR_SPLIT_UNDER_ALLOCATED)"
        side_effects:
          - "computes share_hanging_weight_lbs per share_weight_allocation and estimated_share_weight_lbs"
          - "creates one Invoice per share (OPEN, provisional + final totals per invoice_settlement, deposit credit per deposit_credit_allocation)"
          - "creates one LabelRecord per share (PENDING, program CUSTOM_EXEMPT, label_text computed)"
          - "increments CarcassShare.version by 1"
      - from: CONFIRMED
        to: READY
        trigger: "system cascade (animal complete-fabrication)"
        actor: system
        preconditions: []
        side_effects:
          - "StorageRecord created (STORED) for this share"
          - "increments CarcassShare.version by 1"
      - from: READY
        to: PICKED_UP
        trigger: "system cascade (its StorageRecord picked up)"
        actor: system
        preconditions: []
        side_effects:
          - "bubble-up: if all shares of the animal terminal, Animal READY -> COMPLETE"
          - "increments CarcassShare.version by 1"
      - from: READY
        to: FORFEITED
        trigger: "system cascade (its StorageRecord abandoned)"
        actor: system
        preconditions: []
        side_effects:
          - "link: Invoice (OPEN | PARTIALLY_PAID) -> COLLECTIONS with surcharge_cents = ABANDON_SURCHARGE_CENTS (5000) and total recomputed"
          - "bubble-up: if all shares of the animal terminal, Animal READY -> COMPLETE"
          - "increments CarcassShare.version by 1"

  - entity: CutSheet
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /locker/cut-sheets/{id}/submit"
        actor: Customer
        preconditions:
          - "share status IN {PENDING, CONFIRMED} (fabrication not started; else ERR_INVALID_STATE)"
          - "yield feasible: grind_pct <= MAX_GRIND_PCT (60) (else ERR_YIELD_INFEASIBLE)"
        side_effects:
          - "increments CutSheet.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /locker/cut-sheets/{id}/revise"
        actor: Customer
        preconditions:
          - "expected_cut_sheet_version == CutSheet.version (OCC, else ERR_STALE_VERSION)"
        side_effects:
          - "applies any provided instruction fields (grind_pct, package_weight_lbs, steak_thickness_in, notes)"
          - "increments CutSheet.version by 1"
        note: "Cycle: customer may revise submitted instructions any time before fabrication locks them."
      - from: DRAFT
        to: DRAFT
        trigger: "POST /locker/cut-sheets/{id}/revise"
        actor: Customer
        preconditions:
          - "expected_cut_sheet_version == CutSheet.version (OCC, else ERR_STALE_VERSION)"
        side_effects:
          - "applies provided instruction fields"
          - "increments CutSheet.version by 1"
        note: "Self-loop: content update while still drafting."
      - from: SUBMITTED
        to: LOCKED
        trigger: "system cascade (animal start-fabrication)"
        actor: system
        preconditions: []
        side_effects:
          - "increments CutSheet.version by 1"

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: "POST /locker/invoices/{id}/payments with amount_cents < amount_due_cents"
        actor: "Customer (share owner) | PlantOperator | PlantManager"
        preconditions:
          - "invoice status IN {OPEN, PARTIALLY_PAID, COLLECTIONS} (else ERR_INVALID_STATE)"
          - "amount_cents >= 1 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "storage_cents recomputed as-of now (final variant) before applying payment; total_cents and amount_due_cents recomputed"
          - "amount_paid_cents += amount_cents"
          - "increments Invoice.version by 1"
      - from: OPEN
        to: PAID
        trigger: "POST /locker/invoices/{id}/payments with amount_cents >= amount_due_cents"
        actor: "Customer (share owner) | PlantOperator | PlantManager"
        preconditions:
          - "invoice status IN {OPEN, PARTIALLY_PAID, COLLECTIONS}"
        side_effects:
          - "storage_cents recomputed as-of now before applying payment"
          - "amount_paid_cents += amount_cents"
          - "increments Invoice.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /locker/invoices/{id}/payments with amount_cents >= amount_due_cents"
        actor: "Customer (share owner) | PlantOperator | PlantManager"
        preconditions:
          - "invoice status IN {OPEN, PARTIALLY_PAID, COLLECTIONS}"
        side_effects:
          - "storage_cents recomputed as-of now before applying payment"
          - "amount_paid_cents += amount_cents"
          - "increments Invoice.version by 1"
      - from: COLLECTIONS
        to: PAID
        trigger: "POST /locker/invoices/{id}/payments with amount_cents >= amount_due_cents"
        actor: "Customer (share owner) | PlantOperator | PlantManager"
        preconditions: []
        side_effects:
          - "amount_paid_cents += amount_cents"
          - "increments Invoice.version by 1"
        note: "Forfeited meat stays forfeited; paying a collections invoice settles the debt but does not un-abandon the share."
      - from: OPEN
        to: COLLECTIONS
        trigger: "system cascade (share forfeited via storage abandonment)"
        actor: system
        preconditions: []
        side_effects:
          - "surcharge_cents = ABANDON_SURCHARGE_CENTS (5000); total_cents recomputed"
          - "link: Customer.no_show_strikes += 1 and Customer.status recomputed (>= 1 ELEVATED_DEPOSIT, >= 2 BLOCKED)"
          - "increments Invoice.version by 1"
      - from: PARTIALLY_PAID
        to: COLLECTIONS
        trigger: "system cascade (share forfeited via storage abandonment)"
        actor: system
        preconditions: []
        side_effects:
          - "surcharge_cents = ABANDON_SURCHARGE_CENTS (5000); total_cents recomputed"
          - "link: Customer.no_show_strikes += 1 and Customer.status recomputed"
          - "increments Invoice.version by 1"

  - entity: StorageRecord
    initial_state: STORED
    terminal_states: [PICKED_UP, ABANDONED]
    transitions:
      - from: STORED
        to: PICKED_UP
        trigger: "POST /locker/storage-records/{id}/pickup"
        actor: "PlantOperator | PlantManager"
        preconditions:
          - "share's LabelRecord.status == APPROVED (else ERR_LABEL_NOT_APPROVED)"
          - "share's Invoice.status == PAID with storage recomputed as-of now (unpaid accrual blocks pickup: else ERR_INVOICE_NOT_PAID)"
        side_effects:
          - "sets picked_up_at; invoice storage_cents finalized to accrued_fee_cents at this instant"
          - "cascade: CarcassShare READY -> PICKED_UP"
          - "increments StorageRecord.version by 1"
      - from: STORED
        to: ABANDONED
        trigger: "system run-daily sweep when days_stored > ABANDON_AFTER_DAYS (21)"
        actor: system
        preconditions: []
        side_effects:
          - "link 1: CarcassShare READY -> FORFEITED (no-show/abandoned-meat policy: unclaimed meat is forfeited)"
          - "link 2: that forfeiture drives Invoice (OPEN | PARTIALLY_PAID) -> COLLECTIONS with surcharge_cents = 5000"
          - "link 3: the invoice moving to COLLECTIONS charges Customer.no_show_strikes += 1 and recomputes Customer.status (>= 2 BLOCKED)"
          - "increments StorageRecord.version by 1"

  - entity: LabelRecord
    initial_state: PENDING
    terminal_states: [APPROVED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /locker/labels/{id}/approve"
        actor: "PlantOperator | PlantManager"
        preconditions:
          - "share's intended_use == OWNER_USE (custom-exempt restriction: product labeled NOT FOR SALE may not be resold; else ERR_RESALE_LABEL_FORBIDDEN)"
        side_effects:
          - "increments LabelRecord.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: appointment-reschedule-stale-version
    parent_entity: Appointment
    write_endpoint: "POST /locker/appointments/{id}/reschedule"
    occ_field: "expected_appointment_version"
    description: |
      Rescheduling an Appointment whose version has advanced since the client
      last observed it is rejected. Rescheduling a CONFIRMED or PENDING_DEPOSIT
      appointment is always legitimate under product semantics, so a stale
      request cannot be detected from status alone; the client's view of the
      appointment (capacity-day placement, deposit window) is stale and the
      write is refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: cut-sheet-revise-stale-version
    parent_entity: CutSheet
    write_endpoint: "POST /locker/cut-sheets/{id}/revise"
    occ_field: "expected_cut_sheet_version"
    description: |
      Revising a CutSheet whose version has advanced since the client last
      observed it is rejected. Revision is legitimate from both DRAFT and
      SUBMITTED, so a second sequential revise sees no status change that would
      reject it; the stale client would silently overwrite newer instructions,
      so the write is refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: deposit_quote
    trigger: "on POST /locker/appointments (booking time), before the appointment is persisted"
    algorithm: threshold
    formula: |
      variant = ELEVATED if Customer.status == ELEVATED_DEPOSIT else STANDARD
      STANDARD:
        deposit_amount_cents = DEPOSIT_FLAT_PER_HEAD_CENTS[species] * head_count
      ELEVATED:
        est_hanging_lbs = AVG_LIVE_WEIGHT_LBS[species] * DRESS_PCT[species] * head_count
        est_processing_cents = tiered_processing(est_hanging_lbs, species)   # same tier split as invoice_settlement
        est_value_cents = est_processing_cents + SLAUGHTER_FEE_CENTS[species] * head_count
        deposit_amount_cents = round_half_up(ELEVATED_DEPOSIT_PCT * est_value_cents)
      (BLOCKED customers never reach this calculation: booking is rejected with ERR_CUSTOMER_BLOCKED first.)
    input_set: "the booking Customer (status), species, head_count"
    constants:
      DEPOSIT_FLAT_PER_HEAD_CENTS: { BEEF: 15000, HOG: 7500, LAMB: 5000, GOAT: 5000 }
      AVG_LIVE_WEIGHT_LBS: { BEEF: 1200, HOG: 280, LAMB: 130, GOAT: 90 }
      DRESS_PCT: { BEEF: 0.62, HOG: 0.75, LAMB: 0.52, GOAT: 0.50 }
      ELEVATED_DEPOSIT_PCT: 0.50
      SLAUGHTER_FEE_CENTS: { BEEF: 12000, HOG: 6000, LAMB: 4500, GOAT: 4500 }
    precision: "integer cents, round_half_up"
    variants:
      - name: STANDARD
        when: "Customer.status == ACTIVE at booking time"
        difference: "flat per-head rate; ignores estimated carcass value"
      - name: ELEVATED
        when: "Customer.status == ELEVATED_DEPOSIT (no_show_strikes >= 1) at booking time"
        difference: "50% of estimated processing + slaughter value; for identical species/head_count it differs from STANDARD (e.g., BEEF 1 head: 15000 flat vs 38620 elevated)"

  - name: invoice_settlement
    trigger: "PROVISIONAL total computed once at split finalize (invoice creation); final-variant fields recomputed at split finalize, at every POST /invoices/{id}/payments, at POST /storage-records/{id}/pickup, and at POST /invoices/{id}/waive-storage"
    algorithm: tiered_pricing
    formula: |
      tiered_processing(w_lbs, species):
        if w_lbs <= TIER1_MAX_LBS: return round_half_up(w_lbs * RATE_A[species])
        else: return TIER1_MAX_LBS * RATE_A[species] + round_half_up((w_lbs - TIER1_MAX_LBS) * RATE_B[species])
      FINAL variant (billed):
        processing_fee_cents = tiered_processing(CarcassShare.share_hanging_weight_lbs, species)   # actual hanging weight
        slaughter_share_cents = round_half_up(SLAUGHTER_FEE_CENTS[species] * share_fraction)
        storage_part = 0 if storage_waived else Invoice.storage_cents   # storage_cents from storage_fee as-of now
        total_cents = processing_fee_cents + slaughter_share_cents + storage_part + surcharge_cents - deposit_credit_cents
        amount_due_cents = max(0, total_cents - amount_paid_cents)
      PROVISIONAL variant (quoted at invoice creation, immutable):
        est_w = estimated_share_weight_lbs = round_half_up(Animal.live_weight_lbs * DRESS_PCT[species] * share_fraction, 1)
        provisional_total_cents = tiered_processing(est_w, species) + slaughter_share_cents + 0 (storage) + 0 (surcharge) - deposit_credit_cents
    input_set: "the Invoice's CarcassShare (fraction, actual + estimated weights), Animal (species, live_weight_lbs), StorageRecord accrual (final variant only), deposit allocation"
    constants:
      TIER1_MAX_LBS: 200
      RATE_A_CENTS_PER_LB: { BEEF: 95, HOG: 85, LAMB: 110, GOAT: 110 }
      RATE_B_CENTS_PER_LB: { BEEF: 85, HOG: 75, LAMB: 95, GOAT: 95 }
      SLAUGHTER_FEE_CENTS: { BEEF: 12000, HOG: 6000, LAMB: 4500, GOAT: 4500 }
      DRESS_PCT: { BEEF: 0.62, HOG: 0.75, LAMB: 0.52, GOAT: 0.50 }
    precision: "integer cents, round_half_up; weights 1 decimal"
    variants:
      - name: PROVISIONAL
        when: "at invoice creation (split finalize); stored as provisional_total_cents and never recomputed"
        difference: "uses estimated share weight (live_weight * DRESS_PCT * fraction) and zero storage; for identical share data it differs from FINAL whenever actual hanging weight != estimate (e.g., BEEF live 1200 / hanging 700 / fraction 0.5: provisional 32120 vs final 30250)"
      - name: FINAL
        when: "billed amount; recomputed on payment, pickup, waive-storage"
        difference: "uses actual share_hanging_weight_lbs and accrued storage"

  - name: deposit_credit_allocation
    trigger: "at split finalize (invoice creation), allocating the appointment's deposit_paid_cents down to the animal's shares"
    algorithm: waterfall_allocation
    formula: |
      Level 1 (appointment -> animal): both deposit_quote variants scale linearly
      with head_count, so each animal's pool is exactly
        pool_animal = round_half_up(deposit_paid_cents / appointment.head_count)
      (deposit_paid_cents is assumed collected in full before animals exist; any
      residual cents go to the earliest-created animal of the appointment).
      Level 2 (animal -> its shares, ordered by created_at ASC):
        credit_i = round_half_up(pool_animal * share_fraction_i)               # round per-share FIRST
        residual = pool_animal - sum(credit_i)                                  # may be +/- a few cents
        if residual != 0:
          target = share with the largest share_fraction; tie-break: earliest created_at
          credit_target += residual                                             # reconcile AFTER per-share rounding
      invariant: sum over all of the animal's shares == pool_animal exactly.
      Rounding order is pinned: per-share round_half_up first, residual to the
      largest-fraction share second. (Sum-then-round would give different cents:
      pool 7500 over 0.333/0.333/0.334 -> 2498/2498/2504 here vs 2500/2500/2500 naive.)
    input_set: "all CarcassShare rows of the animal being finalized, and the appointment's deposit_paid_cents and head_count"
    constants: {}
    precision: "integer cents, round_half_up per share, then residual reconciliation"

  - name: share_weight_allocation
    trigger: "at split finalize"
    algorithm: waterfall_allocation
    formula: |
      for each share i (ordered by created_at ASC):
        w_i = round_half_up(Animal.hanging_weight_lbs * share_fraction_i, 1 decimal)
      residual_w = Animal.hanging_weight_lbs - sum(w_i)
      if residual_w != 0:
        target = share with the largest share_fraction; tie-break: earliest created_at
        w_target += residual_w (to 1 decimal)
      invariant: sum(w_i) == Animal.hanging_weight_lbs exactly
      estimated_share_weight_lbs_i = round_half_up(Animal.live_weight_lbs * DRESS_PCT[species] * share_fraction_i, 1)
    input_set: "all CarcassShare rows of the animal, Animal.hanging_weight_lbs, Animal.live_weight_lbs, species"
    constants:
      DRESS_PCT: { BEEF: 0.62, HOG: 0.75, LAMB: 0.52, GOAT: 0.50 }
    precision: "1 decimal pound, round_half_up per share, residual to largest share"

  - name: storage_fee
    trigger: "recomputed whenever StorageRecord.days_stored changes are observed: on payment, on pickup, and during run-daily sweeps"
    algorithm: threshold
    formula: |
      days_stored = whole_days(ready_at -> picked_up_at) if PICKED_UP
                    else whole_days(ready_at -> now)
      billable_days = max(0, days_stored - FREE_STORAGE_DAYS)      # day 7 free, day 8 first billable
      accrued_fee_cents = billable_days * STORAGE_DAILY_CENTS
      abandonment: run-daily marks ABANDONED when days_stored > ABANDON_AFTER_DAYS (i.e., >= 22)
    input_set: "the share's StorageRecord (ready_at, picked_up_at), logical clock"
    constants:
      FREE_STORAGE_DAYS: 7
      STORAGE_DAILY_CENTS: 500
      ABANDON_AFTER_DAYS: 21
    precision: "whole days (calendar-day boundaries on the logical clock), integer cents"

  - name: cancel_refund_policy
    trigger: "on Appointment CONFIRMED -> CANCELLED"
    algorithm: threshold
    formula: |
      days_before = whole_days(current_date -> appointment_date)
      refund_cents = deposit_paid_cents if days_before >= CANCEL_FULL_REFUND_DAYS else 0
    input_set: "Appointment (appointment_date, deposit_paid_cents), logical clock"
    constants:
      CANCEL_FULL_REFUND_DAYS: 7
    precision: "whole days, integer cents"

  - name: customer_strike_policy
    trigger: "on any transition that increments Customer.no_show_strikes (appointment no-show; storage abandonment cascade)"
    algorithm: threshold
    formula: |
      status = ACTIVE  if no_show_strikes == 0
               ELEVATED_DEPOSIT if no_show_strikes >= 1 and < STRIKE_BLOCK_THRESHOLD
               BLOCKED if no_show_strikes >= STRIKE_BLOCK_THRESHOLD
    input_set: "Customer.no_show_strikes"
    constants:
      STRIKE_ELEVATED_THRESHOLD: 1
      STRIKE_BLOCK_THRESHOLD: 2
    precision: "integer strike count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of Customer | PlantOperator | PlantManager", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted on this endpoint per §1.5 roles; entity-backed ownership: a Customer caller must own the resource chain (appointment.customer_id == X-User-ID; share.owner_customer_id == X-User-ID; invoice/storage/label/cut-sheet via their share)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids exist, validated left-to-right; body FK references (customer_id, capacity_day_id, new_capacity_day_id, owner_customer_id) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body is well-formed: required fields present, enum members valid, numeric domains respected (head_count >= 1, 0 < share_fraction <= 1.0 with <= 3 decimals, package_weight_lbs >= 1.0, amount_cents >= 1), CapacityDay.date unique, no undeclared fields", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: state, check: "Target resource is in a state from which the requested transition exists per §1.2 (terminal-state lockdown included); OCC expected_*_version matches current version", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 4, category: state, check: "OCC stale version on reschedule / revise", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /locker/appointments/{id}/reschedule", "POST /locker/cut-sheets/{id}/revise"] }
  - { priority: 5, category: business_safety, check: "Label approval: share.intended_use == OWNER_USE — custom-exempt product labeled NOT FOR SALE may never be sold", error_id: ERR_RESALE_LABEL_FORBIDDEN, http_status: 422, applies_to: ["POST /locker/labels/{id}/approve"] }
  - { priority: 6, category: business_constraint, check: "Booking: customer.status != BLOCKED", error_id: ERR_CUSTOMER_BLOCKED, http_status: 403, applies_to: ["POST /locker/appointments"] }
  - { priority: 6, category: business_constraint, check: "Capacity: CapacityDay.booked_head + head_count <= capacity_head (whole-day aggregate over appointments with status IN {PENDING_DEPOSIT, CONFIRMED})", error_id: ERR_CAPACITY_FULL, http_status: 409, applies_to: ["POST /locker/appointments", "POST /locker/appointments/{id}/reschedule"] }
  - { priority: 6, category: business_constraint, check: "Split: adding a share keeps sum(share_fraction) <= 1.0", error_id: ERR_SPLIT_OVER_ALLOCATED, http_status: 422, applies_to: ["POST /locker/animals/{id}/shares"] }
  - { priority: 6, category: business_constraint, check: "Finalize: sum(share_fraction) == 1.0 exactly", error_id: ERR_SPLIT_UNDER_ALLOCATED, http_status: 422, applies_to: ["POST /locker/animals/{id}/shares/finalize"] }
  - { priority: 6, category: business_constraint, check: "Fabrication requires a finalized split (>= 1 CONFIRMED share summing to 1.0)", error_id: ERR_SPLIT_NOT_FINALIZED, http_status: 409, applies_to: ["POST /locker/animals/{id}/start-fabrication"] }
  - { priority: 6, category: business_constraint, check: "tag_id unique among Animals not in VOIDED", error_id: ERR_DUPLICATE_TAG, http_status: 409, applies_to: ["POST /locker/animals/{id}/receive"] }
  - { priority: 6, category: business_constraint, check: "Exactly one CutSheet per share", error_id: ERR_CUT_SHEET_EXISTS, http_status: 409, applies_to: ["POST /locker/shares/{id}/cut-sheet"] }
  - { priority: 6, category: business_constraint, check: "Yield feasibility: grind_pct <= MAX_GRIND_PCT (60)", error_id: ERR_YIELD_INFEASIBLE, http_status: 422, applies_to: ["POST /locker/cut-sheets/{id}/submit"] }
  - { priority: 6, category: business_constraint, check: "Freezer capacity: count(StorageRecord STORED) + shares completing <= FREEZER_CAPACITY_UNITS (4); occupation windows are half-open [ready_at, picked_up_at)", error_id: ERR_FREEZER_FULL, http_status: 409, applies_to: ["POST /locker/animals/{id}/complete-fabrication"] }
  - { priority: 7, category: business_temporal, check: "Lead time: CapacityDay.date >= current_date + MIN_LEAD_DAYS (14) — exactly 14 days out is allowed", error_id: ERR_LEAD_TIME_TOO_SHORT, http_status: 422, applies_to: ["POST /locker/appointments", "POST /locker/appointments/{id}/reschedule"] }
  - { priority: 7, category: business_temporal, check: "Hang time: now >= weighed_at + MIN_HANG_DAYS (3)", error_id: ERR_MIN_HANG_NOT_MET, http_status: 422, applies_to: ["POST /locker/animals/{id}/start-fabrication"] }
  - { priority: 7, category: business_temporal, check: "Manual no-show only on/after appointment_date", error_id: ERR_NO_SHOW_PREMATURE, http_status: 422, applies_to: ["POST /locker/appointments/{id}/no-show"] }
  - { priority: 8, category: business_referential, check: "Every CONFIRMED share of the animal has a CutSheet with status SUBMITTED", error_id: ERR_CUT_SHEET_MISSING, http_status: 422, applies_to: ["POST /locker/animals/{id}/start-fabrication"] }
  - { priority: 8, category: business_referential, check: "Pickup: share's LabelRecord.status == APPROVED", error_id: ERR_LABEL_NOT_APPROVED, http_status: 409, applies_to: ["POST /locker/storage-records/{id}/pickup"] }
  - { priority: 9, category: business_fiscal, check: "Booking: customer has no Invoice in COLLECTIONS (abandoned-meat debt must be settled before new bookings)", error_id: ERR_OUTSTANDING_BALANCE, http_status: 402, applies_to: ["POST /locker/appointments"] }
  - { priority: 9, category: business_fiscal, check: "Deposit payment covers the remaining deposit (amount_cents >= deposit_amount_cents - deposit_paid_cents)", error_id: ERR_DEPOSIT_INSUFFICIENT, http_status: 402, applies_to: ["POST /locker/appointments/{id}/pay-deposit"] }
  - { priority: 9, category: business_fiscal, check: "Pickup: share's Invoice.status == PAID after as-of-now storage recompute", error_id: ERR_INVOICE_NOT_PAID, http_status: 402, applies_to: ["POST /locker/storage-records/{id}/pickup"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/locker/customers", description: "Register a customer (front desk)", roles: [PlantOperator, PlantManager], code: 201, input: [name, phone, email], output: Customer, side_effects: ["Customer created with no_show_strikes 0, status ACTIVE"] }
  - { method: GET, path: "/locker/customers", description: "List customers", roles: [PlantOperator, PlantManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/locker/customers/{id}", description: "Read one customer", roles: [PlantOperator, PlantManager, Customer], code: 200, input: [], output: Customer, side_effects: [] }

  - { method: POST, path: "/locker/capacity-days", description: "Open a slaughter capacity day", roles: [PlantManager], code: 201, input: [date, capacity_head], output: CapacityDay, side_effects: ["CapacityDay created with booked_head 0, status OPEN"] }
  - { method: GET, path: "/locker/capacity-days", description: "List capacity days (customers browse open days)", roles: [PlantOperator, PlantManager, Customer], code: 200, input: ["date_from?", "date_to?", "status?", "limit?", "offset?"], output: "CapacityDay[]", side_effects: [] }

  - { method: POST, path: "/locker/appointments", description: "Book a slaughter appointment (far in advance); computes deposit per deposit_quote", roles: [Customer, PlantOperator, PlantManager], code: 201, input: [customer_id, capacity_day_id, species, head_count], output: Appointment, side_effects: ["CapacityDay.booked_head += head_count (recompute FULL)", "deposit_amount_cents computed per deposit_quote variant", "deposit_due_at = now + 48h"] }
  - { method: GET, path: "/locker/appointments", description: "List appointments (customers see only their own)", roles: [PlantOperator, PlantManager, Customer], code: 200, input: ["customer_id?", "capacity_day_id?", "status?", "limit?", "offset?"], output: "Appointment[]", side_effects: [] }
  - { method: GET, path: "/locker/appointments/{id}", description: "Read one appointment", roles: [PlantOperator, PlantManager, Customer], code: 200, input: [], output: Appointment, side_effects: [] }
  - { method: POST, path: "/locker/appointments/{id}/pay-deposit", description: "Pay the booking deposit; confirms the appointment and creates EXPECTED animals", roles: [Customer], code: 200, input: [amount_cents], output: Appointment, side_effects: ["PENDING_DEPOSIT -> CONFIRMED", "deposit_paid_cents += amount_cents", "creates head_count Animal rows (EXPECTED)", "increments Appointment.version by 1"] }
  - { method: POST, path: "/locker/appointments/{id}/cancel", description: "Cancel a pending/confirmed appointment; refund per cancel_refund_policy", roles: [Customer, PlantOperator, PlantManager], code: 200, input: ["reason?"], output: Appointment, side_effects: ["-> CANCELLED", "EXPECTED animals -> VOIDED, each releasing 1 head on CapacityDay", "refund_cents set per cancel_refund_policy", "increments Appointment.version by 1"] }
  - { method: POST, path: "/locker/appointments/{id}/reschedule", description: "Move the booking to a different capacity day (OCC-guarded self-loop)", roles: [Customer], code: 200, input: [new_capacity_day_id, expected_appointment_version], output: Appointment, side_effects: ["old CapacityDay.booked_head -= head_count; new CapacityDay.booked_head += head_count", "appointment_date updated", "increments Appointment.version by 1"] }
  - { method: POST, path: "/locker/appointments/{id}/no-show", description: "Staff marks a no-show on/after the appointment date", roles: [PlantOperator, PlantManager], code: 200, input: [], output: Appointment, side_effects: ["CONFIRMED -> NO_SHOW", "EXPECTED animals -> VOIDED (each releases 1 capacity head)", "deposit forfeited", "Customer.no_show_strikes += 1 and status recompute", "increments Appointment.version by 1"] }
  - { method: GET, path: "/locker/appointments/{id}/animals", description: "List the animals of an appointment", roles: [PlantOperator, PlantManager, Customer], code: 200, input: ["limit?", "offset?"], output: "Animal[]", side_effects: [] }

  - { method: GET, path: "/locker/animals/{id}", description: "Read one animal", roles: [PlantOperator, PlantManager, Customer], code: 200, input: [], output: Animal, side_effects: [] }
  - { method: POST, path: "/locker/animals/{id}/receive", description: "Drop-off: assign identification tag and live weight", roles: [PlantOperator, PlantManager], code: 200, input: [tag_id, live_weight_lbs], output: Animal, side_effects: ["EXPECTED -> RECEIVED", "sets tag_id, live_weight_lbs, received_at", "bubble-up: appointment COMPLETED when last EXPECTED animal received", "increments Animal.version by 1"] }
  - { method: POST, path: "/locker/animals/{id}/slaughter", description: "Record slaughter", roles: [PlantOperator, PlantManager], code: 200, input: [], output: Animal, side_effects: ["RECEIVED -> SLAUGHTERED", "sets slaughtered_at", "increments Animal.version by 1"] }
  - { method: POST, path: "/locker/animals/{id}/weigh", description: "Record hanging weight; starts the hang-time clock", roles: [PlantOperator, PlantManager], code: 200, input: [hanging_weight_lbs], output: Animal, side_effects: ["SLAUGHTERED -> HANGING", "sets hanging_weight_lbs, weighed_at", "increments Animal.version by 1"] }
  - { method: POST, path: "/locker/animals/{id}/start-fabrication", description: "Start cutting; requires finalized split, all cut sheets SUBMITTED, and min hang days; locks cut sheets", roles: [PlantOperator, PlantManager], code: 200, input: [], output: Animal, side_effects: ["HANGING -> CUTTING", "SUBMITTED CutSheets of this animal's shares -> LOCKED", "increments Animal.version by 1"] }
  - { method: POST, path: "/locker/animals/{id}/complete-fabrication", description: "Finish cutting/wrapping; shares become READY, storage records created, invoices finalized", roles: [PlantOperator, PlantManager], code: 200, input: [], output: Animal, side_effects: ["CUTTING -> READY", "shares CONFIRMED -> READY", "creates one StorageRecord (STORED) per share", "invoices recomputed (final variant)", "increments Animal.version by 1"] }
  - { method: POST, path: "/locker/animals/{id}/shares", description: "Add a split-carcass ownership share to the animal", roles: [Customer, PlantOperator, PlantManager], code: 201, input: [owner_customer_id, share_fraction, intended_use], output: CarcassShare, side_effects: ["CarcassShare created PENDING"] }
  - { method: POST, path: "/locker/animals/{id}/shares/finalize", description: "Finalize the split: validates sum == 1.0, allocates hanging weight, creates invoices and label records", roles: [PlantOperator, PlantManager], code: 200, input: [], output: "CarcassShare[]", side_effects: ["PENDING shares -> CONFIRMED", "share_weight_allocation computes share weights", "creates one Invoice per share (OPEN)", "creates one LabelRecord per share (PENDING)", "deposit_credit_allocation splits the deposit across shares"] }

  - { method: GET, path: "/locker/shares", description: "List shares (filtered; customers see only shares they own)", roles: [PlantOperator, PlantManager, Customer], code: 200, input: ["animal_id?", "owner_customer_id?", "status?", "limit?", "offset?"], output: "CarcassShare[]", side_effects: [] }
  - { method: GET, path: "/locker/shares/{id}", description: "Read one share", roles: [PlantOperator, PlantManager, Customer], code: 200, input: [], output: CarcassShare, side_effects: [] }
  - { method: DELETE, path: "/locker/shares/{id}", description: "Remove a PENDING share (split correction before finalize)", roles: [Customer, PlantOperator, PlantManager], code: 204, input: [], output: null, side_effects: ["share removed; animal's allocated fraction decreases"] }
  - { method: POST, path: "/locker/shares/{id}/cut-sheet", description: "Create the cut sheet for a share (one per share)", roles: [Customer], code: 201, input: [grind_pct, package_weight_lbs, "steak_thickness_in?", "notes?"], output: CutSheet, side_effects: ["CutSheet created DRAFT"] }

  - { method: GET, path: "/locker/cut-sheets", description: "List cut sheets", roles: [PlantOperator, PlantManager, Customer], code: 200, input: ["share_id?", "status?", "limit?", "offset?"], output: "CutSheet[]", side_effects: [] }
  - { method: GET, path: "/locker/cut-sheets/{id}", description: "Read one cut sheet", roles: [PlantOperator, PlantManager, Customer], code: 200, input: [], output: CutSheet, side_effects: [] }
  - { method: POST, path: "/locker/cut-sheets/{id}/submit", description: "Submit cut instructions (yield feasibility checked)", roles: [Customer], code: 200, input: [], output: CutSheet, side_effects: ["DRAFT -> SUBMITTED", "increments CutSheet.version by 1"] }
  - { method: POST, path: "/locker/cut-sheets/{id}/revise", description: "Revise instructions (OCC-guarded); from SUBMITTED returns the sheet to DRAFT", roles: [Customer], code: 200, input: [expected_cut_sheet_version, "grind_pct?", "package_weight_lbs?", "steak_thickness_in?", "notes?"], output: CutSheet, side_effects: ["applies provided fields", "SUBMITTED -> DRAFT when submitted from SUBMITTED", "increments CutSheet.version by 1"] }

  - { method: GET, path: "/locker/invoices", description: "List invoices (customers see only invoices on shares they own)", roles: [PlantOperator, PlantManager, Customer], code: 200, input: ["share_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/locker/invoices/{id}", description: "Read one invoice", roles: [PlantOperator, PlantManager, Customer], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/locker/invoices/{id}/payments", description: "Record a payment; recomputes as-of-now storage before applying; may flip to PARTIALLY_PAID or PAID", roles: [Customer, PlantOperator, PlantManager], code: 200, input: [amount_cents], output: Invoice, side_effects: ["storage_cents recomputed as-of now (final variant)", "amount_paid_cents += amount_cents", "status -> PARTIALLY_PAID or PAID", "increments Invoice.version by 1"] }
  - { method: POST, path: "/locker/invoices/{id}/waive-storage", description: "Waive accrued storage fees on the invoice (manager override)", roles: [PlantManager], code: 200, input: [], output: Invoice, side_effects: ["storage_waived = true", "total_cents/amount_due_cents recomputed with storage component 0", "increments Invoice.version by 1"] }

  - { method: GET, path: "/locker/storage-records", description: "List freezer storage records", roles: [PlantOperator, PlantManager, Customer], code: 200, input: ["share_id?", "status?", "limit?", "offset?"], output: "StorageRecord[]", side_effects: [] }
  - { method: GET, path: "/locker/storage-records/{id}", description: "Read one storage record (accrued_fee_cents recomputed as-of now on read)", roles: [PlantOperator, PlantManager, Customer], code: 200, input: [], output: StorageRecord, side_effects: [] }
  - { method: POST, path: "/locker/storage-records/{id}/pickup", description: "Record customer pickup; requires approved label and paid invoice; finalizes storage fee", roles: [PlantOperator, PlantManager], code: 200, input: [], output: StorageRecord, side_effects: ["STORED -> PICKED_UP", "sets picked_up_at; invoice storage finalized", "cascade: share READY -> PICKED_UP", "bubble-up: animal COMPLETE when all shares terminal", "increments StorageRecord.version by 1"] }

  - { method: GET, path: "/locker/labels", description: "List label records", roles: [PlantOperator, PlantManager, Customer], code: 200, input: ["share_id?", "status?", "limit?", "offset?"], output: "LabelRecord[]", side_effects: [] }
  - { method: GET, path: "/locker/labels/{id}", description: "Read one label record", roles: [PlantOperator, PlantManager, Customer], code: 200, input: [], output: LabelRecord, side_effects: [] }
  - { method: POST, path: "/locker/labels/{id}/approve", description: "Compliance approval of the custom-exempt NOT FOR SALE label; rejected for RESALE shares", roles: [PlantOperator, PlantManager], code: 200, input: [], output: LabelRecord, side_effects: ["PENDING -> APPROVED", "increments LabelRecord.version by 1"] }

  - { method: POST, path: "/locker/ops/run-daily", description: "Ops-run checkpoint: expires overdue PENDING_DEPOSIT appointments, auto-marks no-shows for past CONFIRMED appointments with no drop-offs, sweeps abandoned storage (days_stored > 21)", roles: [PlantOperator, PlantManager], code: 200, input: [], output: { expired_appointment_ids: "string[]", no_show_appointment_ids: "string[]", abandoned_storage_ids: "string[]" }, side_effects: ["PENDING_DEPOSIT past deposit_due_at -> EXPIRED (capacity released)", "CONFIRMED past appointment_date with all animals EXPECTED -> NO_SHOW (full cascade)", "STORED with days_stored > ABANDON_AFTER_DAYS -> ABANDONED (full cascade)"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Default at server startup is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never the wall clock. All deadlines, windows, day counts, sweeps, and system-stamped record timestamps (created_at, received_at, ready_at, ...) evaluate against this logical time.", roles: [PlantManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock set to to_iso8601"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or entity-backed caller does not own the resource chain" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, out-of-domain numeric value (e.g., share_fraction with > 3 decimals), duplicate CapacityDay.date, or undeclared body field" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not available from the resource's current state (incl. terminal-state lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_CUSTOMER_BLOCKED, http: 403, condition: "Booking attempted by a customer with no_show_strikes >= 2 (status BLOCKED)" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 402, condition: "Booking attempted while the customer has an Invoice in COLLECTIONS" }
  - { id: ERR_CAPACITY_FULL, http: 409, condition: "booked_head + head_count would exceed capacity_head on the target CapacityDay" }
  - { id: ERR_LEAD_TIME_TOO_SHORT, http: 422, condition: "CapacityDay.date < current_date + MIN_LEAD_DAYS (14)" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 402, condition: "Deposit payment below the remaining deposit due" }
  - { id: ERR_DUPLICATE_TAG, http: 409, condition: "tag_id already used by another Animal not in VOIDED" }
  - { id: ERR_SPLIT_OVER_ALLOCATED, http: 422, condition: "New share would push sum(share_fraction) above 1.0" }
  - { id: ERR_SPLIT_UNDER_ALLOCATED, http: 422, condition: "Finalize attempted with sum(share_fraction) < 1.0" }
  - { id: ERR_SPLIT_NOT_FINALIZED, http: 409, condition: "start-fabrication without a finalized split (no CONFIRMED shares summing to 1.0)" }
  - { id: ERR_CUT_SHEET_EXISTS, http: 409, condition: "Share already has a cut sheet" }
  - { id: ERR_CUT_SHEET_MISSING, http: 422, condition: "start-fabrication while some CONFIRMED share lacks a SUBMITTED cut sheet" }
  - { id: ERR_YIELD_INFEASIBLE, http: 422, condition: "grind_pct > MAX_GRIND_PCT (60)" }
  - { id: ERR_MIN_HANG_NOT_MET, http: 422, condition: "start-fabrication before weighed_at + MIN_HANG_DAYS (3)" }
  - { id: ERR_NO_SHOW_PREMATURE, http: 422, condition: "Manual no-show before appointment_date" }
  - { id: ERR_RESALE_LABEL_FORBIDDEN, http: 422, condition: "Label approval for a share with intended_use == RESALE (custom-exempt product is NOT FOR SALE)" }
  - { id: ERR_LABEL_NOT_APPROVED, http: 409, condition: "Pickup while the share's LabelRecord is not APPROVED" }
  - { id: ERR_INVOICE_NOT_PAID, http: 402, condition: "Pickup while the share's Invoice is not PAID (including accrual since last payment)" }
  - { id: ERR_FREEZER_FULL, http: 409, condition: "complete-fabrication would push STORED records above FREEZER_CAPACITY_UNITS (4)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Animal owner / share buyer. Books and pays for appointments, declares split ownership, writes cut sheets for shares they own, pays invoices."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /locker/appointments/{id}/pay-deposit"
      - "POST /locker/appointments/{id}/reschedule"
      - "POST /locker/shares/{id}/cut-sheet"
      - "POST /locker/cut-sheets/{id}/submit"
      - "POST /locker/cut-sheets/{id}/revise"
    shared_operations:
      - "POST /locker/appointments (customer_id must equal X-User-ID)"
      - "POST /locker/appointments/{id}/cancel (owner only)"
      - "POST /locker/animals/{id}/shares (booking customer or staff)"
      - "DELETE /locker/shares/{id} (booking customer or staff)"
      - "POST /locker/invoices/{id}/payments (share owner or staff)"
      - "GET reads (own resources only)"
  - name: PlantOperator
    description: "Plant floor staff. Runs the kill floor, fabrication, freezer, and labels."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /locker/customers"
      - "POST /locker/appointments (on behalf of a customer)"
      - "POST /locker/appointments/{id}/cancel"
      - "POST /locker/appointments/{id}/no-show"
      - "POST /locker/animals/{id}/receive | slaughter | weigh | start-fabrication | complete-fabrication"
      - "POST /locker/animals/{id}/shares and shares/finalize"
      - "POST /locker/invoices/{id}/payments"
      - "POST /locker/storage-records/{id}/pickup"
      - "POST /locker/labels/{id}/approve"
      - "POST /locker/ops/run-daily"
      - "GET reads"
  - name: PlantManager
    description: "Plant manager. Everything PlantOperator can do, plus capacity planning, fee waivers, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /locker/capacity-days"
      - "POST /locker/invoices/{id}/waive-storage"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all PlantOperator shared operations"
