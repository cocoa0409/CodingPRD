      - name: criteria_create_by_issuer_role_unauthorized
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "The Issuer role cannot create criteria versions (SurveillanceOfficer-only): rejected 403 ERR_UNAUTHORIZED_ROLE even with a well-formed payload."
        test_recipe:
