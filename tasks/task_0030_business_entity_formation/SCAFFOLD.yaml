      - "POST /foreign-qualifications/{id}/withdraw"
      - "POST /business-entities/{id}/boi-disclosures"
      - "POST /boi-disclosures/{id}/submit"
      - "POST /boi-disclosures/{id}/amend"
    shared_operations:
