          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "No case row created"

      - name: fk_not_found_in_case_create
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "A body FK (existing_contract_id) that does not resolve yields 404 at the existence priority, after auth but before state checks."
        test_recipe:
          setup: ["Producer and client exist"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "00000000-0000-0000-0000-000000000000", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"

      - name: error_catalog_sweep
        claim_type: violation_to_error
        grounds:
          - "errors"
        distinguishing_aspect: "Catalog closure is asserted structurally here rather than per error: every one of the 21 error ids is triggered by at least one §1.8 or §1.9 instance."
        test_recipe:
          setup:
            - "Coverage map: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER=submit_case_missing_auth_headers; ERR_FORBIDDEN_FOR_ROLE=five rbac instances; ERR_NOT_FOUND=get_case_not_found_returns_404 + fk_not_found_in_case_create; ERR_CASE_NOT_OWNED_BY_PRODUCER=producer_cannot_touch_other_producers_case; ERR_INVALID_REQUEST=create_producer_missing_required_field + invalid_enum_in_case_create; ERR_INVALID_STATE_TRANSITION=submit_twice_returns_invalid_state + document_verify_requires_case_in_review + terminal_rejected_case_lockdown; ERR_STALE_VERSION=occ_stale_version_rejected; ERR_CONTRACT_NOT_IN_FORCE=submit_requires_contract_in_force; ERR_DUTY_SEGREGATION_VIOLATION=segregation_of_duties_violation; ERR_PRODUCER_SUSPENDED=producer_suspension_beats_partial_amount_bounds; ERR_REQUIRED_DOCUMENTS_INCOMPLETE=docs_incomplete_blocks_recommend; ERR_ANALYSIS_MISSING=analysis_missing_blocks_recommend; ERR_COOLING_OFF_ACTIVE=client_rescission_cooling_off_gap; ERR_CONTRACT_EXCHANGED_WITHIN_12M=anti_churn_12m_boundary; ERR_CONTRACT_EXCHANGE_IN_PROGRESS=contract_occupation_overlap; ERR_DUPLICATE_CONTRACT_NUMBER=duplicate_contract_number_case_insensitive; ERR_DOCUMENT_LOCKED=document_locked_after_verify; ERR_PARTIAL_BELOW_MINIMUM=partial_below_minimum_boundary; ERR_PARTIAL_AMOUNT_INVALID=partial_amount_equals_value_boundary; ERR_FREE_LOOK_EXPIRED=free_look_deadline_inclusive_boundary; ERR_FREE_LOOK_STILL_ACTIVE=complete_before_deadline_returns_free_look_still_active"
          setup_api_calls: []
          trigger:
            - { call: "GET /cases", payload: {}, as: CarrierAdmin }
          assert:
            - "Each error id named in the setup coverage map is produced by the referenced instance's trigger (this instance itself is the audit trail, not a behavioral test)"

