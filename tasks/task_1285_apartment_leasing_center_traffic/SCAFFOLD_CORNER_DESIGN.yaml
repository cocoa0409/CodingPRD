        grounds: ["validations[priority=6]", "errors[ERR_LEASE_ALREADY_COMMITTED]"]
        distinguishing_aspect: "Regeneration gate: lease generation supersedes only ISSUED leases; once a lease is SIGNED_BY_APPLICANT the same request (fresh OCC version) fails with ERR_LEASE_ALREADY_COMMITTED."
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F rent 200000 / 2 units; application APPROVED; lease L1 generated and signed by the applicant (SIGNED_BY_APPLICANT); application version captured after that signing"
