  # =================================================================
  # Section: rbac
  # =================================================================
  - section: rbac
    instances:
      - name: customer_cannot_confirm_order_forbidden
        claim_type: rbac_denial
        grounds: ["roles[Customer]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Confirm is a Dispatcher exclusive: a Customer (even the order owner) gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["standard catalog; order PLACED by customer"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Customer, as_user_id: "${c_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN (403); order remains PLACED"

      - name: driver_cannot_batch_forbidden
        claim_type: rbac_denial
        grounds: ["roles[BatchOperator]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Batch is a BatchOperator exclusive: a Driver gets ERR_FORBIDDEN even for a valid SCHEDULED load."
        test_recipe:
          setup: ["standard catalog; one SCHEDULED load"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: Driver, as_user_id: "drv-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN (403); load remains SCHEDULED"

      - name: qctech_cannot_adjust_invoice_forbidden
        claim_type: rbac_denial
        grounds: ["roles[PlantManager]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Adjust is a PlantManager exclusive: a QCTech gets ERR_FORBIDDEN before any state check (authz priority 2 beats state priority 4)."
        test_recipe:
          setup: ["plant exists; a nonexistent or DRAFT invoice id is fine because authz fires first"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager }
          trigger:
            - { call: "POST /v1/invoices/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/adjust", payload: { adjustment_lines: [ { description: "x", amount_cents: 1 } ] }, as: QCTech, as_user_id: "qc-a", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN (403), not ERR_NOT_FOUND — authorization precedes existence per priorities 2 < 3"

      - name: plant_manager_cannot_place_order_forbidden
        claim_type: rbac_denial
        grounds: ["roles[Customer]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Order placement is a Customer exclusive (customer_id comes from X-User-ID): PlantManager gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["plant + mix exist"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: PlantManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN (403)"

      - name: dispatcher_shared_cancel_allowed
        claim_type: rbac_allow
        grounds: ["roles[Dispatcher]", "state_machines.Order.PLACED_to_CANCELLED"]
        distinguishing_aspect: "Cancel is shared: a Dispatcher cancels a PLACED order successfully (billing UNPRICED -> VOID), unlike the exclusive confirm."
        test_recipe:
          setup: ["plant + mix + customer; order PLACED"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/orders/${o_id}/cancel", payload: {}, as: Dispatcher }
          assert:
            - "Order.${o_id}.delivery_status == CANCELLED and billing_status == VOID"

  # =================================================================
  # Section: cross_cutting_layers
  # =================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_price_list_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[price-list-activate-stale-plant]"]
        distinguishing_aspect: "After PL1 activates (Plant.version 1 -> 2), a second create carrying expected_plant_version 1 is rejected 412 ERR_STALE_VERSION; re-reading the plant and resubmitting with version 2 succeeds and supersedes PL1."
        test_recipe:
          setup: ["plant (version 1) and ACTIVE mix exist"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager, captures: { pl1_id: "$.data.id" } }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 16000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/plants/${p_id}", payload: {}, as: PlantManager, captures: { p_v2: "$.data.version" } }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v2}", base_price_per_yd3_cents: 16000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager, captures: { pl2_id: "$.data.id" } }
            - { call: "GET /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}" }, as: PlantManager }
          assert:
            - "Stale create (expected ${p_v} after bump): error_id == ERR_STALE_VERSION, http 412"
            - "Fresh create with ${p_v2} succeeds: PriceList.${pl2_id}.status == ACTIVE"
            - "PriceList.${pl1_id}.status == SUPERSEDED (exactly one ACTIVE per plant+mix)"

      - name: occ_load_schedule_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[load-schedule-stale-order]"]
        distinguishing_aspect: "Scheduling load L1 bumps Order.version; a second schedule carrying the pre-L1 expected_order_version is rejected 412 ERR_STALE_VERSION, and succeeds after re-reading the order."
        test_recipe:
          setup: ["standard catalog; CONFIRMED order (version captured at confirm); trucks T1, T2"]
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
