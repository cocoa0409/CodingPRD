            - "ReceivingSiteApplication.${rsa_id}.status is still DESIGN_APPROVED after the release (pending_backed_units 2 >= required 2)"
            - "the second release returns 409 ERR_REDEMPTION_NOT_RELEASABLE and leaves CertificateRedemption.${red_a}.version at 2"

      - name: frozen_certificate_error_is_covered_by_the_safety_precedence_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CERTIFICATE_FROZEN
          - validations.priority_24_ERR_CERTIFICATE_FROZEN
        distinguishing_aspect: "409 ERR_CERTIFICATE_FROZEN when the source easement is VIOLATION_NOTICED, UNDER_CURE, or ESCALATED."
        excluded_because:
          difficulty_instance: safety_error_precedes_constraint_error_on_frozen_oversized_proposal
          rationale: "That §1.8 instance asserts the code on a proposal that also violates the unit ceiling, proving both that it triggers and that it outranks the constraint error."
      - name: transaction_not_settled_error_is_covered_by_the_cash_invariant_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_TRANSACTION_NOT_SETTLED
          - validations.priority_19_ERR_TRANSACTION_NOT_SETTLED
        distinguishing_aspect: "409 on reversing a transaction that is not SETTLED."
        excluded_because:
          difficulty_instance: program_cash_conserved_across_settlement_and_reversal
          rationale: "That §1.8 instance reverses twice and asserts the second attempt returns ERR_TRANSACTION_NOT_SETTLED with no cash movement."
      - name: transaction_not_proposed_error_is_covered_by_the_state_before_fiscal_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_TRANSACTION_NOT_PROPOSED
          - validations.priority_18_ERR_TRANSACTION_NOT_PROPOSED
        distinguishing_aspect: "409 on settling or cancelling a transaction that is not PROPOSED."
        excluded_because:
          difficulty_instance: state_error_precedes_fiscal_error_on_double_settlement
          rationale: "That §1.8 instance settles twice and asserts the second settle returns ERR_TRANSACTION_NOT_PROPOSED rather than the fiscal error."
      - name: absorption_cap_error_is_covered_by_the_inclusive_boundary_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ABSORPTION_CAP_EXCEEDED
          - validations.priority_41_ERR_ABSORPTION_CAP_EXCEEDED
        distinguishing_aspect: "409 when confirmed redemptions would push the area past its absorption cap."
        excluded_because:
          difficulty_instance: absorption_cap_inclusive_unit_boundary_at_finalization
          rationale: "That §1.8 instance finalizes exactly at the cap and one unit past it, asserting the code on the second finalization."
      - name: appraisal_overlap_error_is_covered_by_the_calendar_adjacency_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_APPRAISAL_PERIOD_OVERLAP
          - validations.priority_29_ERR_APPRAISAL_PERIOD_OVERLAP
        distinguishing_aspect: "409 when a new schedule's half-open window overlaps an ACTIVE window for the same neighborhood."
        excluded_because:
          difficulty_instance: appraisal_calendar_adjacency_allowed_overlap_rejected
          rationale: "That §1.8 instance accepts the touching window and asserts the code on the one-day straddle."
      - name: inspection_window_error_is_covered_by_the_ninety_day_buffer_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INSPECTION_WINDOW_CONFLICT
          - validations.priority_30_ERR_INSPECTION_WINDOW_CONFLICT
        distinguishing_aspect: "409 when a new inspection lands fewer than 90 days after the last one."
        excluded_because:
          difficulty_instance: inspection_ninety_day_buffer_inclusive_at_the_boundary
          rationale: "That §1.8 instance asserts the code at day 89 and acceptance at day 90."
      - name: revision_limit_error_is_covered_by_the_two_round_cycle_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_REVISION_LIMIT_EXCEEDED
          - validations.priority_36_ERR_REVISION_LIMIT_EXCEEDED
        distinguishing_aspect: "409 when a further revision round would exceed the two-round limit."
        excluded_because:
          difficulty_instance: severance_review_cycle_exhausts_two_revision_rounds
          rationale: "That §1.8 instance asserts the code on the third REQUIRE_REVISION."
      - name: no_active_schedule_error_is_covered_by_the_half_open_window_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_NO_ACTIVE_APPRAISAL_SCHEDULE
          - validations.priority_43_ERR_NO_ACTIVE_APPRAISAL_SCHEDULE
        distinguishing_aspect: "422 when no ACTIVE schedule covers the clock for the certificate's origin neighborhood."
        excluded_because:
          difficulty_instance: appraisal_window_half_open_upper_bound_at_one_second_precision
          rationale: "That §1.8 instance asserts the code one second past the window's exclusive upper bound."
      - name: sending_area_inactive_error_is_covered_by_the_enrollment_gate_instance
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SENDING_AREA_NOT_ACTIVE
          - validations.priority_26_ERR_SENDING_AREA_NOT_ACTIVE
        distinguishing_aspect: "409 when the sending area named by a parcel or application is DRAFT or CLOSED."
        excluded_because:
          difficulty_instance: parcel_enrollment_gated_by_sending_area_status
          rationale: "That §1.8 instance asserts the code on enrollment into a DRAFT area and acceptance after activation."

  # ===========================================================================
  # §1.9.7 RBAC — segregation_of_duties role model
  # ===========================================================================
  - section: rbac
    instances:

      - name: each_exclusive_step_of_the_severance_chain_refuses_every_other_role
        claim_type: role_cannot_perform_others_exclusive_operations
        grounds:
          - roles.SeveranceReviewer.exclusive_operations
          - roles.ProgramAdministrator.exclusive_operations
          - roles.DesignReviewBoard.exclusive_operations
          - roles.EasementMonitor.exclusive_operations
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "Screening is exclusive to SeveranceReviewer and certification to ProgramAdministrator, so each step must refuse the other's role with 403 ERR_ROLE_NOT_PERMITTED at priority 2 — before any state precondition is consulted. Role-denial variants cannot be written as structured calls (a structured call must name a role the endpoint declares), so they are pinned as assertions against the legal baseline screen below."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; one LANDOWNER party"
            - "ACTIVE SA-EAST; parcel APN-001 (100.00 / 22.00 / PRIME / 2) with a SUBMITTED severance application for 22 units"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: { screening_note: "complete filing" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
          assert:
            - "the baseline screen by SeveranceReviewer returns 200 and moves ${app_id} to UNDER_REVIEW"
            - "the same screen with X-User-Role: Developer returns 403 ERR_ROLE_NOT_PERMITTED"
            - "the same screen with X-User-Role: ProgramAdministrator returns 403 ERR_ROLE_NOT_PERMITTED — an administrator may certify but never screen"
            - "POST /tdr/severance-applications/${app_id}/certify with X-User-Role: SeveranceReviewer returns 403 ERR_ROLE_NOT_PERMITTED, not 409 ERR_APPLICATION_NOT_APPROVED — priority 2 precedes priority 14"
            - "POST /tdr/severance-applications/${app_id}/review-decision with X-User-Role: DesignReviewBoard returns 403 ERR_ROLE_NOT_PERMITTED"
            - "POST /tdr/conservation-easements/{any id}/inspections with X-User-Role: ProgramAdministrator returns 403 ERR_ROLE_NOT_PERMITTED — inspections are exclusive to EasementMonitor"
            - "POST /tdr/sending-areas with X-User-Role: EasementMonitor returns 403 and creates no SendingArea"
            - "every refusal leaves SeveranceApplication.${app_id} in UNDER_REVIEW at version 2 with screened_at set once"
            - "GET /tdr/severance-applications/${app_id} succeeds for all six roles — reads are shared"

      - name: bank_channels_belong_to_the_administrator_and_private_channels_to_the_seller
        claim_type: role_cannot_perform_others_exclusive_operations
        grounds:
          - validations.priority_9_ERR_CHANNEL_ROLE_MISMATCH
          - roles.ProgramAdministrator.shared_operations
          - roles.Landowner.shared_operations
          - calculations.bank_channel_price
          - errors.ERR_CHANNEL_ROLE_MISMATCH
        distinguishing_aspect: "POST /tdr/market-transactions accepts three roles, so the refusal cannot come from priority 2 — it comes from priority 9, which pairs the channel with the actor: a Landowner proposing BANK_PURCHASE and an administrator proposing PRIVATE are both 403 ERR_CHANNEL_ROLE_MISMATCH, while the administrator's BANK_PURCHASE is accepted and priced off the schedule at 1227468 per unit rather than from any request field."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER, MUNICIPAL_BANK parties; ACTIVE SA-EAST (UNDERSERVED) and NB-EAST schedule 1234567 / 250 bps -> per-unit base 1265431"
            - "parcel APN-001 (100.00 / 22.00 / PRIME / 2) severed for 22 units and certified; the certificate is HELD by the landowner"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/parties"
              payload: { kind: "MUNICIPAL_BANK", legal_name: "City TDR Bank", contact_email: "bank@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { bank_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-EAST", per_unit_value_cents: 1234567, equity_adjustment_bps: 250, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /tdr/market-transactions"
              payload: { certificate_id: "${cert_id}", seller_party_id: "${own_id}", buyer_party_id: "${bank_id}", channel: "BANK_PURCHASE", units: 22, conveyance_mode: "WHOLE" }
              as: Landowner
              as_user_id: "${own_id}"
            - call: "POST /tdr/market-transactions"
              payload: { certificate_id: "${cert_id}", seller_party_id: "${own_id}", buyer_party_id: "${bank_id}", channel: "PRIVATE", units: 22, conveyance_mode: "WHOLE", agreed_price_cents: 30000000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /tdr/market-transactions"
              payload: { certificate_id: "${cert_id}", seller_party_id: "${own_id}", buyer_party_id: "${bank_id}", channel: "BANK_PURCHASE", units: 22, conveyance_mode: "WHOLE" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { mtx_id: $.data.id }
          assert:
            - "the landowner's BANK_PURCHASE returns 403 ERR_CHANNEL_ROLE_MISMATCH and creates no MarketTransaction"
            - "the administrator's PRIVATE proposal returns 403 ERR_CHANNEL_ROLE_MISMATCH — the private channel belongs to the selling party"
            - "after both refusals Certificate.${cert_id}.market_status == HELD and units_encumbered == 0"
            - "the administrator's BANK_PURCHASE returns 201 with channel == BANK_PURCHASE, gross_price_cents == 27004296 (1227468 per unit x 22), and agreed_price_cents == null"
            - "MarketTransaction.${mtx_id}.appraised_reference_cents == 27839482 and price_deviation_bps == -300, inside the band"
            - "Certificate.${cert_id}.market_status == UNDER_CONTRACT with units_encumbered == 22 after the accepted proposal"
            - "GET /tdr/market-transactions?channel=BANK_PURCHASE returns total_count 1"

      - name: a_cure_must_be_verified_by_someone_other_than_the_inspector
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_8_ERR_SEGREGATION_OF_DUTIES
          - roles.EasementMonitor.shared_operations
          - roles.ProgramAdministrator.shared_operations
          - state_machines.MonitoringInspection.CURE_PENDING_to_CURED
          - calculations.violation_severity_score
        distinguishing_aspect: "The cure-verification endpoint is shared by EasementMonitor and ProgramAdministrator, so the refusal is not about the role but about the identity: X-User-ID mon-1, which recorded the inspection, is refused with 403 ERR_SEGREGATION_OF_DUTIES, while mon-2 and admin-1 both succeed on the identical call — and the CURED outcome runs the full compensating thaw."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; one LANDOWNER party"
            - "ACTIVE SA-EAST; parcel APN-001 (100.00 / 22.00 / PRIME / 2) severed for 22 units and certified -> easement restricted_acres 100.00"
            - "monitor mon-1 records a MAJOR_VIOLATION over 12.00 acres on 2026-08-10 -> severity 48.60, 60-day cure band"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id, eas_id: $.data.conservation_easement_id }
            - call: "POST /tdr/conservation-easements/${eas_id}/inspections"
              payload: { inspection_date: "2026-08-10T00:00:00Z", finding: "MAJOR_VIOLATION", affected_acres: 12.00, note: "unpermitted grading" }
              as: EasementMonitor
              as_user_id: "mon-1"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /tdr/monitoring-inspections/${insp_id}/cure-verification"
              payload: { outcome: "CURED", verification_note: "self-verification attempt" }
              as: EasementMonitor
              as_user_id: "mon-1"
            - call: "POST /tdr/monitoring-inspections/${insp_id}/cure-verification"
              payload: { outcome: "CURE_IN_PROGRESS", verification_note: "restoration underway" }
              as: EasementMonitor
              as_user_id: "mon-2"
            - call: "POST /tdr/monitoring-inspections/${insp_id}/cure-verification"
              payload: { outcome: "CURED", verification_note: "restoration complete and accepted" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "MonitoringInspection.${insp_id}.severity_score == 48.60 with cure_deadline == 2026-10-09T00:00:00Z, status CURE_PENDING, inspector_user_id == mon-1"
            - "the mon-1 verification returns 403 ERR_SEGREGATION_OF_DUTIES and leaves version == 1, cure_verified_by_user_id == null"
            - "the mon-2 CURE_IN_PROGRESS verification returns 200, keeps status CURE_PENDING, and moves ConservationEasement.${eas_id}.compliance_status to UNDER_CURE"
            - "Certificate.${cert_id}.market_status is still FROZEN after CURE_IN_PROGRESS — the freeze survives an in-progress cure"
            - "the admin-1 CURED verification returns 200 with status CURED, cure_verified_at == 2026-08-10T00:00:00Z, cure_verified_by_user_id == admin-1"
            - "the compensating cascade fires: ConservationEasement.${eas_id}.compliance_status == CURED and Certificate.${cert_id}.market_status == HELD"
            - "MonitoringInspection.${insp_id}.version == 3 after the two accepted verifications and escalated_at == null"
            - "ConservationEasement.${eas_id}.prior_violation_count is still 1 — a cure does not erase the history term"

      - name: peer_roles_share_the_split_endpoint_but_only_the_holder_may_use_it
        claim_type: peer_roles
        grounds:
          - roles.Landowner.shared_operations
          - roles.Developer.shared_operations
          - validations.priority_6_ERR_NOT_RESOURCE_OWNER
          - concurrency_rules.split-stale-certificate
        distinguishing_aspect: "Landowner and Developer are peers on POST /tdr/certificates/{id}/split, so a developer's attempt on a landowner-held certificate passes priority 2 and is stopped at priority 6 with 403 ERR_NOT_RESOURCE_OWNER; the identical call by the holding landowner succeeds. Role membership and resource ownership are independent gates."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; one LANDOWNER and one DEVELOPER party"
            - "ACTIVE SA-EAST; parcel APN-001 (100.00 / 22.00 / PRIME / 2) severed for 22 units and certified"
            - "the 22-unit certificate is HELD by the landowner; the developer holds nothing"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "Core Block Partners", contact_email: "core@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id }
            - call: "GET /tdr/certificates/${cert_id}"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
              captures: { cert_v: $.data.version }
          trigger:
            - call: "POST /tdr/certificates/${cert_id}/split"
              payload: { units: 8, expected_certificate_version: "${cert_v}" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /tdr/certificates/${cert_id}/split"
              payload: { units: 8, expected_certificate_version: "${cert_v}" }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { child_id: $.data.id }
          assert:
            - "the developer's split returns 403 ERR_NOT_RESOURCE_OWNER, not 412 ERR_STALE_PARENT_VERSION — priority 6 precedes priority 23 even though the version was correct"
            - "after the refusal Certificate.${cert_id}.version is still ${cert_v}, split_count == 0, units_split_out == 0"
            - "the landowner's identical split returns 201 with Certificate.${child_id}.units_face == 8, holder_party_id == ${own_id}, generation == 2"
            - "Certificate.${cert_id}.units_split_out == 8, units_remaining == 14, split_count == 1"
            - "the developer's GET of the certificate succeeded during setup — reads are shared across peer roles, writes are not"
            - "Party.${dev_id}.units_held == 0 and certificates_held_count == 0; Party.${own_id}.units_held == 22 and certificates_held_count == 2"

  # ===========================================================================
  # §1.9.8 Cross-Cutting Complexity Layers
  # complexity_layers: dual_variant_calculation, cascading_side_effects,
  # optimistic_concurrency, rate_threshold_triggers, derived_field_reconciliation
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stacking_a_second_redemption_on_a_version_the_client_already_spent
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.redemption-allocate-stale-application
          - endpoints.POST_receiving_site_applications_id_redemptions
          - validations.priority_23_ERR_STALE_PARENT_VERSION
          - calculations.receiving_bonus_units
        distinguishing_aspect: "The §1.2.1 rule for ReceivingSiteApplication: two redemptions may legitimately stack on one application, so nothing but the OCC field catches a second allocation that carries the version read before the first. The refusal must leave the whole allocation graph untouched — no CertificateRedemption row, no units_encumbered on the certificate, no reserved_units on the area."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; LANDOWNER, DEVELOPER and MUNICIPAL_BANK parties"
            - "ACTIVE SA-EAST (UNDERSERVED) and NB-EAST schedule 1234567 / 250 bps; 22-unit certificate severed from APN-001, sold privately to the developer for 30000000 and settled"
            - "ACTIVE RA-CORE (density 4.0, max_bonus_pct 0.35, absorption cap 500, design review required); a 12.00-acre application requesting 20 bonus units, approved by the board -> DESIGN_APPROVED with required_backing_units 16 at version 2"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "LANDOWNER", legal_name: "Ridge Farm LLC", contact_email: "ridge@example.org", neighborhood_code: "NB-EAST" }
              as: ProgramAdministrator
              captures: { own_id: $.data.id }
