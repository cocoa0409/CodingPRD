  - rule_id: boundary_precision_check
    instances:
      - name: recoupment_remittance_at_levy_boundary_versus_one_cent_over
        grounds:
          - validations[priority=45]
          - state_machines.MemberAssessment.RECOUPING_to_RECOUPED
          - entities.MemberAssessment.fields.recouped_amount_cents
          - errors[ERR_OVER_RECOUPMENT]
        distinguishing_aspect: |
          The over-recoupment guard is an inclusive ceiling on recouped_amount_cents + proceeds_cents
          against levied_amount_cents 150000: with 149999 already recouped, a 2 cent remittance
          (150001) is refused while a 1 cent remittance (exactly 150000) is accepted and closes the
          recoupment dimension at RECOUPED.
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED with a PERSONAL_AUTO profile and one cancelled policy."
            - "One ACTIVE MemberInsurer M1 for PERSONAL_AUTO base_year 2025 with direct_written_premium_cents 10000000 at 200 bps, so its cap is 200000."
            - "Assessment CERTIFIED for needed_amount_cents 150000, so M1's MemberAssessment is levied exactly 150000."
            - "A surcharge filing of 25 bps on a 60000000 cent surcharge base projects 150000, and 149999 cents of proceeds have already been remitted, leaving recoupment_status RECOUPING."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /member-insurers"
              payload: { naic_code: "20001", insurer_name: "Huron Standard Insurance", assessable_line: "PERSONAL_AUTO", base_year: 2025, direct_written_premium_cents: 10000000, annual_cap_rate_bps: 200 }
              as: AssociationAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /assessments"
              payload: { insolvency_id: "${ins_id}", assessable_line: "PERSONAL_AUTO", base_year: 2025, needed_amount_cents: 150000 }
              as: AssessmentOfficer
              captures: { asmt_id: $.data.id }
            - call: "POST /assessments/${asmt_id}/certify"
              payload: {}
              as: AssessmentOfficer
            - call: "GET /member-assessments"
              payload: { assessment_id: "${asmt_id}", member_insurer_id: "${m1_id}" }
              as: AssessmentOfficer
              captures: { ma_id: $.data.0.id }
            - call: "POST /member-assessments/${ma_id}/surcharge-filings"
              payload: { surcharge_rate_bps: 25, surcharge_base_cents: 60000000, filing_ref: "RS-2026-01" }
              as: MemberInsurerAgent
              as_user_id: "${m1_id}"
            - call: "POST /member-assessments/${ma_id}/recoupment-remittances"
              payload: { proceeds_cents: 149999, remittance_ref: "RC-1" }
              as: MemberInsurerAgent
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /member-assessments/${ma_id}/recoupment-remittances"
              payload: { proceeds_cents: 2, remittance_ref: "RC-2" }
              as: MemberInsurerAgent
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /member-assessments/${ma_id}/recoupment-remittances"
              payload: { proceeds_cents: 1, remittance_ref: "RC-3" }
              as: MemberInsurerAgent
              as_user_id: "${m1_id}"
          assert:
            - "${err} == ERR_OVER_RECOUPMENT with HTTP 422 on the 2 cent remittance"
            - "MemberAssessment.${ma_id}.levied_amount_cents == 150000"
            - "MemberAssessment.${ma_id}.projected_recoupment_cents == 150000"
            - "MemberAssessment.${ma_id}.recouped_amount_cents == 150000"
            - "MemberAssessment.${ma_id}.recoupment_status == RECOUPED"
            - "MemberAssessment.${ma_id}.billing_status == INVOICED"

      - name: net_worth_exclusion_fires_exactly_at_the_threshold_not_one_cent_below
        grounds:
          - validations[priority=28]
          - entities.CoverageProfile.fields.net_worth_exclusion_threshold_cents
          - state_machines.CoveredClaim.RECEIVED_to_SCREENED_ELIGIBLE
          - errors[ERR_NET_WORTH_EXCLUSION]
        distinguishing_aspect: |
          The high-net-worth exclusion is a strictly-below test against 2500000000 cents: a
          policyholder at 2499999999 screens through to SCREENED_ELIGIBLE, while a policyholder at
          exactly 2500000000 is refused with ERR_NET_WORTH_EXCLUSION and stays in RECEIVED.
        test_recipe:
          setup:
            - "A PERSONAL_AUTO CoverageProfile with net_worth_exclusion_threshold_cents 2500000000."
            - "Insolvency in TRIGGERED with two policies in CANCELLED_BY_ORDER: PA-1001 whose policyholder_net_worth_cents is 2499999999 and PA-1002 whose policyholder_net_worth_cents is exactly 2500000000."
            - "One CoveredClaim in RECEIVED on each policy."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000, net_worth_exclusion_threshold_cents: 2500000000 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000, policyholder_net_worth_cents: 2499999999 }
              as: ReceiverLiaison
              captures: { pol_lo: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1002", line_of_business: "PERSONAL_AUTO", policyholder_name: "Renner Holdings", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000, policyholder_net_worth_cents: 2500000000 }
              as: ReceiverLiaison
              captures: { pol_hi: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "${pol_lo}", claim_number: "C-LO", claimant_name: "Ben Ortiz", claimant_state_code: "MI", loss_date: "2026-01-15", gross_loss_cents: 900000 }
              as: CoverageAnalyst
              captures: { clm_lo: $.data.id }
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "${pol_hi}", claim_number: "C-HI", claimant_name: "Cora Diaz", claimant_state_code: "MI", loss_date: "2026-01-16", gross_loss_cents: 900000 }
              as: CoverageAnalyst
              captures: { clm_hi: $.data.id }
          trigger:
            - call: "POST /claims/${clm_lo}/screen"
              payload: { decision: "COVERED" }
              as: CoverageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /claims/${clm_hi}/screen"
              payload: { decision: "COVERED" }
              as: CoverageAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "CoveredClaim.${clm_lo}.status == SCREENED_ELIGIBLE"
            - "CoveredClaim.${clm_lo}.net_payable_cents == 890000"
            - "${err} == ERR_NET_WORTH_EXCLUSION with HTTP 422"
            - "CoveredClaim.${clm_hi}.status == RECEIVED"
            - "CoveredClaim.${clm_hi}.net_payable_cents == 0"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_intake_requires_the_insolvency_to_have_been_triggered
        grounds:
          - validations[priority=24]
          - state_machines.Insolvency.DECLARED_to_TRIGGERED
          - errors[ERR_INSOLVENCY_NOT_TRIGGERED]
          - entities.CoveredClaim.fields.insolvency_id
        distinguishing_aspect: |
          CoveredClaim intake is gated on a different entity's state: with the parent Insolvency still
          in DECLARED the identical POST /claims body is refused with ERR_INSOLVENCY_NOT_TRIGGERED,
          and the very same body succeeds with 201 once the liquidation order has been triggered.
        test_recipe:
          setup:
            - "A PERSONAL_AUTO CoverageProfile is registered."
            - "Insolvency in DECLARED with liquidation_order_date 2026-03-01 and triggered_at_utc null."
            - "TransferredPolicy PA-1001 imported in IMPORTED (the order has not run yet)."
