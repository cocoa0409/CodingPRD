          - entities.Visit.fields.status
        distinguishing_aspect: "A freshly created Visit is SCHEDULED with scoring fields null and visit_end_datetime already computed from VISIT_DURATION_MINUTES[NEW] = 60 minutes."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one rheumatologist and one patient."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "RH0001", full_name: "Pat One", date_of_birth: "1975-04-12", diagnosis_code: "RA_SEROPOSITIVE", registry_consent: true }
              as: RegistryAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", clinician_id: "${rheum1_id}", visit_datetime: "2026-08-03T14:00:00Z", visit_type: "NEW" }
              as: Rheumatologist
              as_user_id: "${rheum1_id}"
              captures: { visit_id: $.data.id }
          assert:
            - "Visit.${visit_id}.status == \"SCHEDULED\""
            - "Visit.${visit_id}.visit_end_datetime == \"2026-08-03T15:00:00Z\""
            - "Visit.${visit_id}.activity_score == null, activity_category == null, escalation_recommendation == null, scored_at == null"
            - "Patient.${pat_id}.target_status == \"UNASSESSED\" (scheduling a visit does not project anything onto the patient)"

      - name: visit_check_in_advances_scheduled_to_checked_in
        claim_type: valid_transition
        grounds:
          - state_machines.Visit.transitions[SCHEDULED->CHECKED_IN]
