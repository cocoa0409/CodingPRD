  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: fk_reverse_reachability_children_listable_from_parent
        claim_type: standard_crud
        grounds:
          - endpoints[GET /airports/{airportId}/leases/{leaseId}/rent-charges]
          - endpoints[GET /airports/{airportId}/leases/{leaseId}/aircraft]
          - endpoints[GET /airports/{airportId}/hangars/{hangarId}/inspections]
        distinguishing_aspect: "Every child entity is reachable from its parent: rent-charges, aircraft, insurance-certificates, environmental-records, audit-findings, eviction-cases under a lease; inspections under a hangar; offers/applications/hangars/rate-schedules under an airport."
        test_recipe:
          setup: ["Airport with one full lease graph (lease + charge + aircraft + certificate + inspection on its hangar)"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KFK", name: "FK Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_fk: $.data.id }
            - call: "POST /rate-schedules"
              payload: { airport_id: "${ap_fk}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_fk}", hangar_code: "T-190", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_fk: $.data.id, h_fk_v: $.data.version }
            - call: "POST /applications"
              payload: { airport_id: "${ap_fk}", applicant_name: "Eff Kay", applicant_contact: "fk@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N360FK", is_based_tenant_transfer: false  }
              as: Applicant
              captures: { app_fk: $.data.id }
            - call: "POST /offers"
              payload: { airport_id: "${ap_fk}", hangar_id: "${h_fk}", application_id: "${app_fk}"  }
              as: AirportManager
              captures: { off_fk: $.data.id }
            - call: "POST /offers/${off_fk}/accept"
              payload: { expected_hangar_version: "${h_fk_v}", aeronautical_use_attested: true, sublease_allowed: false, insurance_policy_number: "POL-FK", insurance_insurer_name: "Avemco", insurance_liability_coverage_cents: 100000000, insurance_effective_from: "2026-08-01T00:00:00Z", insurance_effective_to: "2030-01-01T00:00:00Z", aircraft_n_number: "N360FK", aircraft_make_model: "Cessna 172" }
              as: Applicant
              as_user_id: "${app_fk}"
              captures: { lease_fk: $.data.id }
            - call: "POST /hangars/${h_fk}/inspections"
              payload: { condition_rating: "GOOD", maintenance_responsibility: "AIRPORT", deficiency_note: "none" }
              as: AirportManager
          trigger:
            - call: "GET /leases/${lease_fk}/rent-charges"
              as: AirportManager
            - call: "GET /leases/${lease_fk}/aircraft"
              as: AirportManager
            - call: "GET /leases/${lease_fk}/insurance-certificates"
              as: AirportManager
            - call: "GET /hangars/${h_fk}/inspections"
              as: AirportManager
            - call: "GET /offers"
              as: AirportManager
            - call: "GET /applications"
              as: AirportManager
          assert:
            - "rent-charges list length == 1 (pro-rated first charge)"
            - "aircraft list length == 1 with n_number N360FK and is_primary == true"
            - "insurance-certificates list length == 1 with status VALID"
            - "inspections list length == 1 with status OPEN"
            - "offers list length == 1 with status ACCEPTED"
            - "applications list length == 1 with status LEASED"

      - name: filtered_list_applications_by_status
        claim_type: standard_crud
        grounds:
          - endpoints[GET /airports/{airportId}/applications]
        distinguishing_aspect: "GET applications?status=QUEUED returns only QUEUED rows; WITHDRAWN rows are excluded by the filter."
        test_recipe:
          setup: ["Airport with two applications; one withdrawn"]
          setup_api_calls:
            - call: "POST /airports"
              payload: { airport_code: "KFLT", name: "Filter Field", escalation_pct: 0.0, escalation_policy: "ANNIVERSARY_SIMPLE", offer_acceptance_window_hours: 72, cure_window_days: 30, late_fee_grace_days: 5 }
              as: AirportManager
              captures: { ap_fl: $.data.id }
            - call: "POST /applications"
              payload: { airport_id: "${ap_fl}", applicant_name: "Fil One", applicant_contact: "fil1@x.com", size_class_requested: "T_HANGAR", aircraft_n_number: "N370FL", is_based_tenant_transfer: false  }
