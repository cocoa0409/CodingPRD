            - "err2 == ERR_CASE_NOT_AMENDING (no amendment is open on a FINAL case)"
      - name: stain_order_on_final_case_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_CASE_NOT_ORDERABLE]
        distinguishing_aspect: "Once FINAL, the case no longer accepts stain orders: ERR_CASE_NOT_ORDERABLE even though the block is EMBEDDED and the caller is a pathologist."
