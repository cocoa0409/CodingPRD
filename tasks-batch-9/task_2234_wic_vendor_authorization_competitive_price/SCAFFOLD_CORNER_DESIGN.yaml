              as: VendorUnitSupervisor
              captures: { pg_a: $.data.id }
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_milk: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Statewide Dairy", container_size_oz: 128, contract_brand: false, required_for_authorization: true }
              as: VendorUnitSupervisor
              captures: { item_milk: $.data.id }
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3", submission_open_at: "2026-08-01T00:00:00Z", submission_due_at: "2026-09-01T00:00:00Z" }
              as: VendorUnitSupervisor
              captures: { cycle_q3: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Alpha Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 6000000 }
              as: VendorUnitAnalyst
              captures: { v1: $.data.id }
            - call: "POST /vendors/${v1}/record-training"
              payload: { training_type: "INITIAL", completed_at: "2026-07-15T00:00:00Z" }
              as: VendorUnitAnalyst
            - call: "POST /vendors/${v1}/submit-application"
              payload: {}
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "${v1}"
              captures: { sub_v1_milk: $.data.id }
            - call: "POST /price-submissions/${sub_v1_milk}/review"
              payload: { decision: "ACCEPT" }
              as: VendorUnitAnalyst
            - call: "POST /vendors/${v1}/authorize"
              payload: {}
              as: VendorUnitSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: SystemOperator
            - call: "POST /monitoring-visits"
              payload: { vendor_id: "${v1}", visit_type: "ROUTINE", scheduled_for: "2026-08-12T00:00:00Z" }
              as: VendorUnitAnalyst
              captures: { visit_anchor: $.data.id }
          trigger:
            - call: "POST /monitoring-visits"
              payload: { vendor_id: "${v1}", visit_type: "ROUTINE", scheduled_for: "2026-08-08T00:00:00Z" }
              as: VendorUnitAnalyst
            - call: "POST /monitoring-visits"
              payload: { vendor_id: "${v1}", visit_type: "ROUTINE", scheduled_for: "2026-08-14T00:00:00Z" }
              as: VendorUnitAnalyst
          assert:
            - "First trigger call: HTTP 422 with error.id == ERR_VISIT_DATE_IN_PAST — both rule 29 and rule 30 are violated and the ascending-priority sweep stops at 29"
            - "The status code is 422, the code declared for rule 29, not the 409 of rule 30 — so the two are distinguishable even without reading error.id"
            - "Second trigger call (2026-08-14, two days from the anchor visit and not in the past): HTTP 409 with error.id == ERR_VISIT_BLACKOUT_CONFLICT, proving rule 30 is live and was genuinely masked by rule 29 in the first call"
            - "GET /monitoring-visits?vendor_id=${v1} reports meta.total_count == 1, the anchor visit ${visit_anchor} alone"

      - name: submission_window_half_open_boundary_rejects_at_due_instant
        claim_type: temporal_validation
        grounds:
          - validations[priority 32]
          - errors.ERR_SUBMISSION_WINDOW_CLOSED
          - entities.PriceCycle.fields.submission_due_at
        distinguishing_aspect: |
          The submission window is half-open [submission_open_at, submission_due_at):
          the open instant itself is accepted, the last millisecond before the due
          instant is accepted, and the due instant exactly is refused with
          ERR_SUBMISSION_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "MILK category with three items: ITEM_MILK 00011122233, ITEM_JUICE 00077788899, ITEM_CEREAL 00055566677"
            - "OPEN cycle 2026Q3 over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z); one vendor v1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
