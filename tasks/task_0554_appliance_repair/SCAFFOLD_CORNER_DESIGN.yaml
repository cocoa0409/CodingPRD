# =============================================================================
# task_0554_appliance_repair — §1.9 Scaffold Corner Design (breadth probe)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_service_request_returns_intake
        claim_type: Creation
        grounds: [entities.ServiceRequest, endpoints]
        distinguishing_aspect: "POST /service-requests with all required fields returns 201, status INTAKE, version 1, computed fees defaulted to 0."
        test_recipe:
          setup: ["A customer and appliance exist."]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Cr", email: "cr@x.com", phone: "1", address: "1" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "N10", serial_number: "SN1", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
          trigger:
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "x" }, as: Customer, as_user_id: "${cust_id}", captures: { sr_id: "$.data.id" } }
          assert:
            - "ServiceRequest.${sr_id}.status == INTAKE"
            - "ServiceRequest.${sr_id}.version == 1"
            - "ServiceRequest.${sr_id}.diagnostic_fee_cents == 0"

      - name: get_service_request_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.ServiceRequest, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /service-requests/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /service-requests/00000000-0000-4000-8000-000000000000", as: ServiceAdmin, captures: { err_id: "$.data.error_id" } }
          assert:
            - "${err_id} == ERR_NOT_FOUND"

      - name: create_service_request_missing_required_appliance_id
        claim_type: Required Fields
        grounds: [entities.ServiceRequest, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /service-requests without appliance_id returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Mi", email: "mi@x.com", phone: "1", address: "1" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", reported_issue: "x" }, as: ServiceAdmin, captures: { err_id: "$.data.error_id" } }
          assert:
            - "${err_id} == ERR_VALIDATION"

      - name: appliance_recall_status_defaults_clear
        claim_type: Computed Fields
        grounds: [entities.Appliance.fields.recall_status]
        distinguishing_aspect: "A newly created appliance with no matching ACTIVE recall has computed recall_status CLEAR and completed_repair_count 0."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Ap", email: "ap@x.com", phone: "1", address: "1" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "N20", serial_number: "SN2", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
          assert:
            - "Appliance.${app_id}.recall_status == CLEAR"
            - "Appliance.${app_id}.completed_repair_count == 0"

      - name: list_appliances_by_customer_fk_reverse
        claim_type: Listing
        grounds: [entities.Appliance.fields.customer_id, endpoints]
        distinguishing_aspect: "GET /appliances?customer_id= returns the FK-reverse list of that customer's appliances with pagination envelope."
        test_recipe:
          setup: ["A customer with one appliance."]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Li", email: "li@x.com", phone: "1", address: "1" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "N30", serial_number: "SN3", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
          trigger:
            - { call: "GET /appliances?customer_id=${cust_id}", as: ServiceAdmin, captures: { first_id: "$.data.0.id" } }
          assert:
            - "${first_id} == ${app_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: diagnose_from_intake_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceRequest.SCHEDULED_to_DIAGNOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Diagnosing an INTAKE request (never scheduled) returns ERR_INVALID_STATE; no estimate is created."
        test_recipe:
          setup: ["An INTAKE request with an assigned technician does not exist yet; a technician exists."]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "In", email: "in@x.com", phone: "1", address: "1" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "N40", serial_number: "SN4", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Dt" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "x" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
          trigger:
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }], required_parts: [] }, as: Technician, as_user_id: "${tech_id}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "${err_id} == ERR_INVALID_STATE"

      - name: decision_on_declined_estimate_returns_estimate_not_pending
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Estimate.PENDING_APPROVAL_to_DECLINED, "errors[ERR_ESTIMATE_NOT_PENDING]"]
        distinguishing_aspect: "A second decision on an already-DECLINED estimate returns ERR_ESTIMATE_NOT_PENDING (409)."
        test_recipe:
          setup: ["A diagnosed request whose estimate has been DECLINED."]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "De", email: "de@x.com", phone: "1", address: "1" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "N50", serial_number: "SN5", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Dp" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "PN5", name: "p", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "ZN5", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "x" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }], required_parts: [{ part_id: "${part_id}", quantity: 1 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est_id: "$.data.id" } }
            - { call: "POST /estimates/${est_id}/decision", payload: { decision: "DECLINE" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /estimates/${est_id}/decision", payload: { decision: "APPROVE" }, as: Customer, as_user_id: "${cust_id}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "${err_id} == ERR_ESTIMATE_NOT_PENDING"

      - name: revision_supersedes_prior_estimate
        claim_type: Valid Transition
        grounds: [state_machines.Estimate.PENDING_APPROVAL_to_SUPERSEDED]
        distinguishing_aspect: "A revised estimate marks the prior estimate SUPERSEDED and creates a fresh PENDING_APPROVAL estimate; ServiceRequest stays DIAGNOSED."
        test_recipe:
          setup: ["A diagnosed request with a PENDING_APPROVAL estimate; its current SR version read."]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Su", email: "su@x.com", phone: "1", address: "1" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "N60", serial_number: "SN6", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Sp" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "PN6", name: "p", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "ZN6", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "x" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }], required_parts: [{ part_id: "${part_id}", quantity: 1 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est1_id: "$.data.id" } }
            - { call: "GET /service-requests/${sr_id}", as: Technician, as_user_id: "${tech_id}", captures: { srv: "$.data.version" } }
          trigger:
            - { call: "POST /service-requests/${sr_id}/estimates", payload: { labor_tasks: [{ minutes: 60 }], required_parts: [{ part_id: "${part_id}", quantity: 1 }], expected_service_request_version: "${srv}" }, as: Technician, as_user_id: "${tech_id}", captures: { est2_id: "$.data.id" } }
          assert:
            - "Estimate.${est1_id}.status == SUPERSEDED"
            - "Estimate.${est2_id}.status == PENDING_APPROVAL"
            - "ServiceRequest.${sr_id}.status == DIAGNOSED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: none_routing_diagnostic_waived_on_completion
        claim_type: Correct Result
        grounds: [calculations.diagnostic_fee_assessment, calculations.warranty_customer_responsibility]
        distinguishing_aspect: "Mode-c waiver: out-of-warranty completed repair with subtotal 24000 (>= 15000) waives the 8900 diagnostic fee, so amount_due_cents == final subtotal 24000, not 32900."
        test_recipe:
          setup: ["Out-of-warranty request completed with actual labor [40,20]min and parts P x2 (subtotal 24000)."]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Wa", email: "wa@x.com", phone: "1", address: "1" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "N70", serial_number: "SN7", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Wp" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "PN7", name: "p", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "ZN7", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "x" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }, { minutes: 20 }], required_parts: [{ part_id: "${part_id}", quantity: 2 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est_id: "$.data.id" } }
            - { call: "POST /estimates/${est_id}/decision", payload: { decision: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /service-requests/${sr_id}/complete", payload: { actual_labor_tasks: [{ minutes: 40 }, { minutes: 20 }] }, as: Technician, as_user_id: "${tech_id}" }
          assert:
            - "ServiceRequest.${sr_id}.warranty_routing == NONE"
            - "ServiceRequest.${sr_id}.amount_due_cents == 24000"

      - name: manufacturer_routing_full_cover_zero_responsibility
        claim_type: Variant Selection
        grounds: [calculations.warranty_customer_responsibility, calculations.warranty_contract_selector]
        distinguishing_aspect: "MANUFACTURER routing (0 deductible) fully covers subtotal 24000 within cap → customer_responsibility_cents 0, warranty_covered_cents 24000."
        test_recipe:
          setup: ["MANUFACTURER contract (deductible 0, cap 100000) covering 2026-06-10; request completed with subtotal 24000."]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Ma", email: "ma@x.com", phone: "1", address: "1" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "N80", serial_number: "SN8", purchase_date: "2024-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /warranty-contracts", payload: { appliance_id: "${app_id}", coverage_type: "MANUFACTURER", coverage_start: "2025-01-01", coverage_end: "2027-01-01", deductible_cents: 0, coverage_cap_cents: 100000 }, as: ServiceAdmin, captures: { wc_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Mp" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "PN8", name: "p", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "ZN8", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "x" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }, { minutes: 20 }], required_parts: [{ part_id: "${part_id}", quantity: 2 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est_id: "$.data.id" } }
            - { call: "POST /estimates/${est_id}/decision", payload: { decision: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /service-requests/${sr_id}/complete", payload: { actual_labor_tasks: [{ minutes: 40 }, { minutes: 20 }] }, as: Technician, as_user_id: "${tech_id}" }
          assert:
            - "ServiceRequest.${sr_id}.warranty_covered_cents == 24000"
            - "ServiceRequest.${sr_id}.customer_responsibility_cents == 0"
            - "WarrantyContract.${wc_id}.claimed_cents == 24000"

  # ===========================================================================
  - section: validations
    instances:
      - name: wrong_customer_approve_returns_not_owner
        claim_type: Cross-entity validation
        grounds: ["validations[priority=6]", "errors[ERR_NOT_OWNER]"]
        distinguishing_aspect: "A different Customer (not the request owner) approving the estimate returns ERR_NOT_OWNER (403)."
        test_recipe:
          setup: ["A diagnosed request owned by customer A; a second customer B exists."]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "A", email: "a2@x.com", phone: "1", address: "1" }, as: ServiceAdmin, captures: { custa_id: "$.data.id" } }
            - { call: "POST /customers", payload: { full_name: "B", email: "b2@x.com", phone: "1", address: "1" }, as: ServiceAdmin, captures: { custb_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${custa_id}", brand: "Kenmore", model: "N90", serial_number: "SN9", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Op" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "PN9", name: "p", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "ZN9", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${custa_id}", appliance_id: "${app_id}", reported_issue: "x" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }], required_parts: [{ part_id: "${part_id}", quantity: 1 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est_id: "$.data.id" } }
          trigger:
            - { call: "POST /estimates/${est_id}/decision", payload: { decision: "APPROVE" }, as: Customer, as_user_id: "${custb_id}", captures: { err_id: "$.data.error_id" } }
          assert:
            - "${err_id} == ERR_NOT_OWNER"

      - name: duplicate_truck_stock_line_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_TRUCK_STOCK]"]
        distinguishing_aspect: "Creating a second TruckStockItem for an existing (technician_id, part_id) pair returns ERR_DUPLICATE_TRUCK_STOCK (409)."
        test_recipe:
          setup: ["A truck-stock line exists for (T, P)."]
          setup_api_calls:
            - { call: "POST /technicians", payload: { full_name: "Du" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "PD", name: "p", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
          trigger:
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 2 }, as: ServiceAdmin, captures: { err_id: "$.data.error_id" } }
          assert:
            - "${err_id} == ERR_DUPLICATE_TRUCK_STOCK"

      - name: payment_amount_mismatch_rejected
        claim_type: Aggregate validation
        grounds: ["validations[priority=14]", "errors[ERR_PAYMENT_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "Paying an amount != amount_due_cents (declined NONE request owes 8900 diagnostic) returns ERR_PAYMENT_AMOUNT_MISMATCH (422)."
        test_recipe:
          setup: ["A NONE-routing request declined at DIAGNOSED, amount_due_cents == 8900."]
          setup_api_calls:
            - { call: "POST /customers", payload: { full_name: "Pa", email: "pa@x.com", phone: "1", address: "1" }, as: ServiceAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /appliances", payload: { customer_id: "${cust_id}", brand: "Kenmore", model: "NA0", serial_number: "S22", purchase_date: "2022-01-15" }, as: ServiceAdmin, captures: { app_id: "$.data.id" } }
            - { call: "POST /technicians", payload: { full_name: "Pp" }, as: ServiceAdmin, captures: { tech_id: "$.data.id" } }
            - { call: "POST /parts", payload: { part_number: "PA0", name: "p", unit_price_cents: 4500 }, as: ServiceAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /truck-stock", payload: { technician_id: "${tech_id}", part_id: "${part_id}", quantity_on_hand: 5 }, as: ServiceAdmin, captures: { ts_id: "$.data.id" } }
            - { call: "POST /service-zones", payload: { name: "ZA0", max_concurrent_appointments: 5 }, as: ServiceAdmin, captures: { zone_id: "$.data.id" } }
            - { call: "POST /service-requests", payload: { customer_id: "${cust_id}", appliance_id: "${app_id}", reported_issue: "x" }, as: ServiceAdmin, captures: { sr_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/appointments", payload: { technician_id: "${tech_id}", zone_id: "${zone_id}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /service-requests/${sr_id}/diagnose", payload: { labor_tasks: [{ minutes: 40 }], required_parts: [{ part_id: "${part_id}", quantity: 1 }] }, as: Technician, as_user_id: "${tech_id}", captures: { est_id: "$.data.id" } }
            - { call: "POST /estimates/${est_id}/decision", payload: { decision: "DECLINE" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
