# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Construction Submittal & RFI Management. 21 instances across the 9 Difficulty
# Rules of SKILL.md §0.5. Every chain replays from empty-DB using only §1.5
# endpoints. All formula-derived literals were computed by executing the §1.3
# formulas (business-day pass over Mon–Fri with project holiday_dates; layered
# markup with per-layer round_half_up).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: impact_cost_provisional_vs_final
        grounds:
          - calculations.impact_cost_delta
          - entities.ImpactAssessment.fields.provisional_delta_cents
          - entities.ImpactAssessment.fields.final_delta_cents
        distinguishing_aspect: |
          Cost-domain dual variant on ImpactAssessment: identical 100000-cent base yields
          provisional_delta_cents 135482 (estimated base, tier 1, +15% allowance layer) but
          final_delta_cents 117810 (quoted base, tier 1, no allowance) — the allowance layer
          exists in exactly one variant.
        test_recipe:
          setup:
            - "Project ACTIVE with initial_contingency_cents 2000000, no holidays, default thresholds"
            - "Reviewer R1 (ARCH) exists"
            - "RFI answered with cost_impact_flag true, estimated_cost_cents 100000 -> ImpactAssessment ESTIMATED"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "DV Cost", initial_contingency_cents: 2000000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "Footing detail", question_text: "Confirm rebar", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { rfi_id: $.data.id }
            - call: "POST /v1/rfis/${rfi_id}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/rfis/${rfi_id}/answer"
              payload: { answer_text: "Use detail 7", cost_impact_flag: true, schedule_impact_flag: false, estimated_cost_cents: 100000 }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "GET /v1/impact-assessments"
              payload: { rfi_id: "${rfi_id}" }
              as: ProjectEngineer
              captures: { ia_id: "$.data[0].id", ia_prov: "$.data[0].provisional_delta_cents" }
          trigger:
            - call: "POST /v1/impact-assessments/${ia_id}/price"
              payload: { sub_quote_cents: 100000 }
              as: ProjectEngineer
              as_user_id: "pe-001"
              captures: { ia_final: $.data.final_delta_cents, ia_tier: $.data.gc_markup_tier }
          assert:
            - "captured ia_prov == 135482 (provisional: round(100000*1.10)=110000, round(110000*1.05)=115500, round(115500*1.15)=132825, round(132825*1.02)=135482)"
            - "captured ia_final == 117810 (final: 110000 -> 115500 -> round(115500*1.02)=117810)"
            - "captured ia_tier == 1"
            - "ia_prov != ia_final for identical 100000 base"

      - name: report_metrics_snapshot_vs_live
        grounds:
          - calculations.owner_report_metrics
          - entities.OwnerReport.fields.snapshot_metrics
        distinguishing_aspect: |
          Metrics-domain dual variant on OwnerReport (different entity domain than the cost
          variant): SNAPSHOT frozen at publish keeps open_submittals 2 after a submittal is
          voided, while LIVE recomputes to 1 — same DB, two valid readings.
        test_recipe:
          setup:
            - "Project ACTIVE; spec section with 2 register kinds activated -> 2 REGISTERED submittals"
            - "OwnerReport [2026-08-01, 2026-08-31] published (snapshot open_submittals = 2)"
            - "One submittal voided after publish"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "DV Metrics" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "033000", required_submittal_kinds: ["PRODUCT_DATA", "SHOP_DRAWINGS"], default_need_date: "2026-10-30" }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /v1/spec-sections/${sec_id}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { sub1_id: "$.data[0].id" }
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectEngineer
              captures: { p_v: $.data.version }
            - call: "POST /v1/projects/${p_id}/owner-reports"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { rep_id: $.data.id }
            - call: "POST /v1/owner-reports/${rep_id}/publish"
              payload: {}
              as: ProjectEngineer
            - call: "POST /v1/submittals/${sub1_id}/void"
              payload: { reason: "scope removed" }
              as: ProjectManager
          trigger:
            - call: "GET /v1/owner-reports/${rep_id}/metrics"
              payload: { view: "published" }
              as: ProjectEngineer
              captures: { open_pub: $.data.open_submittals }
            - call: "GET /v1/owner-reports/${rep_id}/metrics"
              payload: { view: "live" }
              as: ProjectEngineer
              captures: { open_live: $.data.open_submittals }
          assert:
            - "open_pub == 2 (frozen at publish)"
            - "open_live == 1 (voided submittal excluded: review_status VOID)"
            - "open_pub != open_live"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes (b), (a), (c))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: impact_cost_layered_rounding_order
        grounds:
          - calculations.impact_cost_delta
        distinguishing_aspect: |
          Mode (b) nested rounding: per-layer round_half_up on base 33333 yields final
          39269 (36666 -> 38499 -> 39269) and provisional 45159; a sum-then-round ordering
          would yield 39267 — the pinned per-layer order is falsifiably different.
        test_recipe:
          setup:
            - "Project ACTIVE, contingency 2000000; reviewer R1 ARCH; RFI answered with estimated_cost_cents 33333"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "Rounding", initial_contingency_cents: 2000000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "Anchor rods", question_text: "Size?", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { rfi_id: $.data.id }
            - call: "POST /v1/rfis/${rfi_id}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/rfis/${rfi_id}/answer"
              payload: { answer_text: "Per spec", cost_impact_flag: true, schedule_impact_flag: false, estimated_cost_cents: 33333 }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "GET /v1/impact-assessments"
              payload: { rfi_id: "${rfi_id}" }
              as: ProjectEngineer
              captures: { ia_id: "$.data[0].id", ia_prov: "$.data[0].provisional_delta_cents" }
          trigger:
            - call: "POST /v1/impact-assessments/${ia_id}/price"
              payload: { sub_quote_cents: 33333 }
              as: ProjectEngineer
              as_user_id: "pe-001"
              captures: { ia_final: $.data.final_delta_cents }
          assert:
            - "ia_final == 39269 (round(33333*1.10)=36666; round(36666*1.05)=38499; round(38499*1.02)=39269)"
            - "ia_prov == 45159 (…38499 -> round(38499*1.15)=44274 -> round(44274*1.02)=45159)"
            - "ia_final != 39267 (the sum-then-round value 33333*1.1781 rounded once)"

      - name: expediting_priority_score_nonlinear_clamps
        grounds:
          - calculations.expediting_priority_score
          - entities.LongLeadItem.fields.priority_score
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: score 70 = 3*min(10,20) + 1*20
          (HIGH) + 2*max(0,-(-10)) exercises nested min/max and the float sign flip; approving
          a deferral then halves it to 35 via the conditional entity-state branch.
        test_recipe:
          setup:
            - "Project ACTIVE (default long_lead_threshold_days 30); section lead_time_days 30, default_need_date 2026-08-15"
            - "Clock at 2026-08-25 when the register is generated -> LLI days_late 10, escalation_level 2, criticality STANDARD"
            - "Submittal S is REGISTERED with expediting_status MONITORING (set at generation for long-lead items)"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "Score" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "055000", lead_time_days: 30, default_need_date: "2026-08-15", required_submittal_kinds: ["SHOP_DRAWINGS"] }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/spec-sections/${sec_id}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { sub_id: "$.data[0].id" }
            - call: "GET /v1/submittals/${sub_id}/long-lead-item"
              payload: {}
              as: ProjectEngineer
              captures: { lli_id: "$.data[0].id" }
          trigger:
            - call: "PATCH /v1/long-lead-items/${lli_id}"
              payload: { criticality: "HIGH" }
              as: ProjectEngineer
              captures: { score_high: $.data.priority_score, lvl: $.data.escalation_level }
            - call: "POST /v1/submittals/${sub_id}/request-deferral"
              payload: { reason: "owner decision pending" }
              as: ProjectEngineer
            - call: "POST /v1/submittals/${sub_id}/decide-deferral"
              payload: { decision: "APPROVE" }
              as: ProjectManager
            - call: "GET /v1/long-lead-items/${lli_id}"
              payload: {}
              as: ProjectEngineer
              captures: { score_def: $.data.priority_score }
          assert:
            - "score_high == 70 (3*min(10,20)=30 + 1*20 + 2*max(0,10)=20)"
            - "lvl == 2 (days_late 10 in [7,13])"
            - "score_def == 35 (floor(70/2) under DEFERRED_APPROVED)"

      - name: contingency_tier_evaluation_order
        grounds:
          - calculations.contingency_ledger_update
          - calculations.impact_cost_delta
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the GC markup tier is keyed on
          contingency_spent_cents evaluated BEFORE the current pricing — after IA1's accept
          settles 1001385 into spent, IA2's pricing reads spent_before 1001385 >= threshold
          1000000 and selects tier 2 (120054); an implementation that mis-orders the ledger
          (tier from spent measured before IA1's accept, or from available) would produce
          tier 1 / 117810 instead. Pinned order: spent_before -> tier -> delta -> reserve.
        test_recipe:
          setup:
            - "Project ACTIVE, initial_contingency_cents 3000000, gc_tier_threshold_cents default 1000000"
            - "IA1 priced at quote 850000 (tier 1 final 1001385: 935000 -> 981750 -> 1001385) and ACCEPTED -> contingency_spent_cents 1001385"
            - "IA2 ESTIMATED from a second answered RFI (est 100000), not yet priced"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "TierOrder", initial_contingency_cents: 3000000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v1: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "Steel grade", question_text: "A992 ok?", expected_project_version: "${p_v1}" }
              as: ProjectEngineer
              captures: { rfi1_id: $.data.id }
            - call: "POST /v1/rfis/${rfi1_id}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/rfis/${rfi1_id}/answer"
              payload: { answer_text: "Yes, premium", cost_impact_flag: true, schedule_impact_flag: false, estimated_cost_cents: 850000 }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "GET /v1/impact-assessments"
              payload: { rfi_id: "${rfi1_id}" }
              as: ProjectEngineer
              captures: { ia1_id: "$.data[0].id" }
            - call: "POST /v1/impact-assessments/${ia1_id}/price"
              payload: { sub_quote_cents: 850000 }
              as: ProjectEngineer
              as_user_id: "pe-001"
            - call: "POST /v1/impact-assessments/${ia1_id}/accept"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-001"
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v2: $.data.version, spent_mid: $.data.contingency_spent_cents }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "Bolt spec", question_text: "A325?", expected_project_version: "${p_v2}" }
              as: ProjectEngineer
              captures: { rfi2_id: $.data.id }
            - call: "POST /v1/rfis/${rfi2_id}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/rfis/${rfi2_id}/answer"
              payload: { answer_text: "TC bolts", cost_impact_flag: true, schedule_impact_flag: false, estimated_cost_cents: 100000 }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "GET /v1/impact-assessments"
              payload: { rfi_id: "${rfi2_id}" }
              as: ProjectEngineer
              captures: { ia2_id: "$.data[0].id" }
          trigger:
            - call: "POST /v1/impact-assessments/${ia2_id}/price"
              payload: { sub_quote_cents: 100000 }
              as: ProjectEngineer
              as_user_id: "pe-001"
              captures: { ia2_final: $.data.final_delta_cents, ia2_tier: $.data.gc_markup_tier }
          assert:
            - "spent_mid == 1001385 (final of 850000 at tier1: 935000 -> 981750 -> round(981750*1.02)=1001385)"
            - "ia2_tier == 2 (spent_before 1001385 >= gc_tier_threshold_cents 1000000 at pricing time)"
            - "ia2_final == 120054 (tier 2: round(100000*1.10)=110000 -> round(110000*1.07)=117700 -> round(117700*1.02)=120054)"
            - "ia2_final != 117810 (the tier-1 result a mis-ordered ledger read would produce)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: submittal_resubmittal_cycle_with_parallel_dimension
        grounds:
          - state_machines.Submittal.review_status
          - state_machines.Submittal.expediting_status
          - state_machines.SubmittalRevision.status
        distinguishing_aspect: |
          Submittal review_status cycles IN_REVIEW -> RETURNED_NEEDS_RESUBMIT -> IN_REVIEW
          -> APPROVED while the parallel expediting_status dimension stays MONITORING
          throughout — two independent state axes on one entity plus a revision loop.
        test_recipe:
          setup:
            - "Project ACTIVE; sub C1 responsible for long-lead section (lead 35, need 2026-10-30, review_days 10); reviewer R1 ARCH"
            - "Register generated at default clock 2026-08-01 (days until required 91 > expedite window 10 -> expediting stays MONITORING)"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "Cycle" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/subcontractors"
              payload: { company_name: "SteelFab", trade: "structural steel" }
              as: ProjectEngineer
              captures: { c1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/spec-sections"
              payload: { section_number: "051200", lead_time_days: 35, review_days: 10, default_need_date: "2026-10-30", responsible_subcontractor_id: "${c1_id}", required_submittal_kinds: ["SHOP_DRAWINGS"] }
              as: ProjectEngineer
              captures: { sec_id: $.data.id }
            - call: "POST /v1/spec-sections/${sec_id}/activate"
              payload: {}
              as: ProjectEngineer
            - call: "GET /v1/submittals"
              payload: { spec_section_id: "${sec_id}" }
              as: ProjectEngineer
              captures: { sub_id: "$.data[0].id" }
            - call: "GET /v1/submittals/${sub_id}"
              payload: {}
              as: ProjectEngineer
              captures: { s_v0: $.data.version, exp0: $.data.expediting_status }
            - call: "POST /v1/submittals/${sub_id}/revisions"
              payload: { document_ref: "doc://rev0", expected_submittal_version: "${s_v0}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { rev0_id: $.data.id }
            - call: "POST /v1/revisions/${rev0_id}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/revisions/${rev0_id}/return"
              payload: { action_code: "C", comments: "fix welds" }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "GET /v1/submittals/${sub_id}"
              payload: {}
              as: ProjectEngineer
              captures: { s_v1: $.data.version, rs_mid: $.data.review_status, exp_mid: $.data.expediting_status }
          trigger:
            - call: "POST /v1/submittals/${sub_id}/revisions"
              payload: { document_ref: "doc://rev1", expected_submittal_version: "${s_v1}" }
              as: SubcontractorRep
              as_user_id: "${c1_id}"
              captures: { rev1_id: $.data.id, rev1_no: $.data.revision_number }
            - call: "POST /v1/revisions/${rev1_id}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/revisions/${rev1_id}/return"
              payload: { action_code: "A", comments: "ok" }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "GET /v1/submittals/${sub_id}"
              payload: {}
              as: ProjectEngineer
              captures: { rs_end: $.data.review_status, exp_end: $.data.expediting_status, rc: $.data.revision_count }
            - call: "GET /v1/revisions/${rev0_id}"
              payload: {}
              as: ProjectEngineer
              captures: { rev0_status: $.data.status }
          assert:
            - "rs_mid == RETURNED_NEEDS_RESUBMIT after the C return"
            - "rev1_no == 1 and rev0_status == SUPERSEDED (only C/D returns may be superseded)"
            - "rs_end == APPROVED after the A return (cycle closed)"
            - "rc == 2"
            - "exp0 == MONITORING and exp_mid == MONITORING and exp_end == MONITORING (parallel dimension untouched by the review cycle)"

      - name: rfi_reopen_cycle_recomputes_due_date
        grounds:
          - state_machines.RFI.status
          - calculations.rfi_due_date
        distinguishing_aspect: |
          RFI cycles ANSWERED -> ROUTED -> ANSWERED (reopen loop on a different entity than
          Submittal): cycle_count increments, answer fields clear, and due_date recomputes
          from the reopen clock date (2026-08-05 + 10 business days = 2026-08-19).
        test_recipe:
          setup:
            - "Project ACTIVE (rfi_response_days 10, no holidays); reviewer R1 ARCH"
            - "Clock 2026-08-03 (Mon): RFI opened -> due_date 2026-08-17; routed and answered on 2026-08-03"
          setup_api_calls:
            - call: "POST /v1/projects"
              payload: { project_name: "Reopen" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /v1/projects/${p_id}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /v1/projects/${p_id}/reviewers"
              payload: { display_name: "Arch One", discipline: "ARCH" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v: $.data.version }
            - call: "POST /v1/projects/${p_id}/rfis"
              payload: { subject: "Grid line", question_text: "Confirm offset", expected_project_version: "${p_v}" }
              as: ProjectEngineer
              captures: { rfi_id: $.data.id, due0: $.data.due_date }
            - call: "POST /v1/rfis/${rfi_id}/route"
              payload: { reviewer_id: "${r1_id}" }
              as: ProjectEngineer
            - call: "POST /v1/rfis/${rfi_id}/answer"
              payload: { answer_text: "Offset 300mm", cost_impact_flag: false, schedule_impact_flag: false }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/rfis/${rfi_id}/reopen"
              payload: {}
              as: ProjectEngineer
              captures: { st1: $.data.status, cyc: $.data.cycle_count, due1: $.data.due_date, ans1: $.data.answer_text }
            - call: "POST /v1/rfis/${rfi_id}/answer"
              payload: { answer_text: "Offset 300mm confirmed", cost_impact_flag: false, schedule_impact_flag: false }
              as: Reviewer
              as_user_id: "${r1_id}"
              captures: { st2: $.data.status, adate2: $.data.answered_date }
          assert:
            - "due0 == 2026-08-17 (opened 2026-08-03 Mon + 10 business days)"
            - "st1 == ROUTED and cyc == 1 and ans1 == null (answer cleared)"
