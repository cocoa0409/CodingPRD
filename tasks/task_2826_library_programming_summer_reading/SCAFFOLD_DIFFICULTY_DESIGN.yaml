          - entities.Program.fields.presenter_fee_committed_cents
        distinguishing_aspect: |
          Money cascade, depth 4, in the OVER_BUDGET -> WITHIN_BUDGET direction: the weather closure
          cancels the executed contract (link 1, kill_fee_cents 54877 = half of 109753 at 36 hours of
          notice), which rewrites the program's presenter_fee_committed_cents (link 2), which flips
          budget_variance_cents from -37753 to 17123 and budget_posture to WITHIN_BUDGET (link 3),
          which decrements Branch.programs_over_budget_count from 1 to 0 (link 4). Only link 4's
          counter proves the whole chain ran: nothing in the weather-close request mentions the branch.
