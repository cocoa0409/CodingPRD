            - "ADJACENCY ADMITTED: CrewAssignment.${asg_o2a}.cost_cents == 16000 and CrewAssignment.${asg_o2b}.cost_cents == 16000 (TICKETING earns no rigging premium)"
            - "TRUE OVERLAP REFUSED: trigger call 3 returns HTTP 409 with error_id == ERR_CREW_SHIFT_OVERLAP"
            - "TRUE OVERLAP REFUSED: the call does NOT return ERR_SHIFT_OUTSIDE_STOP_WINDOW or ERR_CONSECUTIVE_DAYS_EXCEEDED (the shift is inside [open_date, close_date] and the run is only 2 days of 6 allowed)"
            - "RouteStop.${stop_o2}.labor_cost_provisional_cents == 32000 and Worker.${worker_o2}.scheduled_hours_total == 16.0"
            - "GET /workers/${worker_o2}/crew-assignments?status=SCHEDULED returns exactly 2 rows"

      - name: inspection_slot_buckets_are_half_open_utc_days_per_jurisdiction
