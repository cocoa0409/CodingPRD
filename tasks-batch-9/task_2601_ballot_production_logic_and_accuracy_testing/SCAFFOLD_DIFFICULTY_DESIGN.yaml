            - "Call 4 (re-program from LA_FAILED) succeeds because custody_status is still IN_VAULT: the unit returns to (PROGRAMMED, IN_VAULT) with firmware_version overwritten to 5.2.2 and programmed_style_id still ${st} - the program axis is cyclic."
            - "Call 11 (record-results reporting the deck exactly) computes discrepancy_count == 0, so LATestSession.${sess2}.status == PASSED, TestDeck.${deck_b}.status == CONSUMED, and the unit becomes (LA_PASSED, IN_VAULT)."
            - "Call 12 (deploy) succeeds and gives (LA_PASSED, DEPLOYED) with precinct_id ${pr} and seal_number SEAL-TAB-1: the custody axis moved while the program axis stayed LA_PASSED."
            - "Call 13 (break-seal) gives (LA_PASSED, IN_VAULT) with precinct_id and seal_number cleared and Election.${el}.open_seal_count back to 0; program_status is still LA_PASSED, so a custody-axis move again left the program axis untouched."
            - "Call 14 (program) fails with ERR_UNIT_STATE_INVALID (409) even though the custody axis is back to IN_VAULT and would allow it: program needs program_status IN {UNPROGRAMMED, LA_FAILED} and this unit is LA_PASSED, so a unit that has passed its L&A test can never be quietly reprogrammed."
            - "Across the trigger the unit visited (PROGRAMMED, IN_VAULT), (LA_FAILED, IN_VAULT), (PROGRAMMED, IN_VAULT), (LA_PASSED, IN_VAULT), (LA_PASSED, DEPLOYED) and (LA_PASSED, IN_VAULT) - six observations over two axes in which PROGRAMMED and (LA_PASSED, IN_VAULT) each recur, so neither axis alone identifies the unit's position."
            - "TabulatorUnit.${tab}.la_session_count == 2, and CustodyEvent rows exist for the successful deploy (event_type SEAL_APPLIED, sequence_index 1) and the break-seal (event_type SEAL_BROKEN, sequence_index 2) with subject_type TABULATOR_UNIT and subject_id ${tab}; the rejected first deploy left no CustodyEvent behind."

  - rule_id: transitive_cascade
    instances:
      - name: tc_contest_withdrawal_depth5_to_election_readiness
        grounds:
          - state_machines.Contest.CERTIFIED_to_WITHDRAWN
          - state_machines.BallotStyle.LOCKED_to_PROOF_REJECTED
          - state_machines.PrintJob.DELIVERED_to_REJECTED
          - state_machines.BallotLot.ISSUED_to_VOIDED
          - calculations.election_deployment_readiness
        distinguishing_aspect: |
          ONE call - POST /contests/{id}/withdraw - propagates through five distinct entity types in
          strict causal order: Contest -> BallotStyle (because the style prints that district) ->
          PrintJob (because its pinned style left the approved set) -> BallotLot (because its parent
          job was rejected) -> Precinct and Election (because the precinct's only lot was voided).
          Each hop is caused by the PREVIOUS hop's mutation, not by the withdraw call: nothing in the
          withdraw payload names the style, the job, the lot, the precinct or the readiness field,
          and stopping the propagation at hop 3 would still leave the election READY.
        test_recipe:
          setup:
            - "A fully prepared election in STYLES_LOCKED whose deployment_readiness is READY: one certified contest in D-12, locked style S-100, precinct P-001 assigned to S-100, print job of 12500 DELIVERED as lot L-001 (received 12500, issued 3000 to P-001), and tabulator TAB-001 LA_PASSED and DEPLOYED to P-001 under seal SEAL-TAB-1."
