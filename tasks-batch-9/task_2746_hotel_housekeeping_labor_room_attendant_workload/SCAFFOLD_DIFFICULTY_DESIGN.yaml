            - "One ASSIGNED checkout on room 101, created while the roster was PLANNED, which the scaffold permits."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T07:00:00.000Z" }
              as: HousekeepingDirector
            - call: "POST /housekeeping/properties"
