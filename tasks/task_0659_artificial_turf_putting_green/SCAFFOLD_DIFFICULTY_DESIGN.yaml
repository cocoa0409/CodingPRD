  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # --- Instance 1: cash conserved across deposit-pay then cancel-refund ---
      - name: cash_conserved_deposit_then_refund
        grounds:
          - state_machines.Payment.PENDING_to_SETTLED
          - state_machines.Project.workflow_status.DEPOSIT_PAID_to_CANCELLED
          - entities.Project.fields.amount_refunded_cents
        distinguishing_aspect: |
          Conserved quantity #1 — net collected cash: forward action (settle DEPOSIT 129470)
          paired with compensating action (cancel -> REFUND 129470 settled) leaves
          (deposit_paid_cents + balance_paid_cents - amount_refunded_cents) == 0, an explicit
          formula over Project fields, with zero drift.
        test_recipe:
          setup:
            - "STANDARD project deposit-paid (deposit 129470 SETTLED)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Quin Q", email: "quin@x.com" }
