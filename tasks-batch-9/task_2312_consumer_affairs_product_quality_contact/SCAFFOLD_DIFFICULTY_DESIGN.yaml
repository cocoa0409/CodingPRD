            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: SOCIAL, received_at: "2026-08-01T00:00:00Z", raw_message: "Consolidated report of nine incidents." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: FOREIGN_MATERIAL, reported_batch_code: "LOTB" }, captures: { b1: "$.data.id" } }
