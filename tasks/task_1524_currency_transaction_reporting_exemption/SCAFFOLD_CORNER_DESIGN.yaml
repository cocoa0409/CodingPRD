        distinguishing_aspect: "POST /cash-transactions without amount_cents fails shape validation before any existence/state check (ERR_INVALID_REQUEST, 400)."
        test_recipe:
          setup: ["branch, customer; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
