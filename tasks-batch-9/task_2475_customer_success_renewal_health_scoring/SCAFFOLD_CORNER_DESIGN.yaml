  # ===========================================================================
  - section: rbac
    instances:
      - name: finance_analyst_cannot_create_an_account_returns_unauthorized
        claim_type: other_roles_exclusive_operations_denied
        grounds:
          - roles.FinanceAnalyst
          - roles.CsOpsAdmin
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "POST /accounts is exclusive to CsOpsAdmin, so a well-authenticated FinanceAnalyst gets ERR_UNAUTHORIZED (403) rather than 401 or 400, and no Account row is written."
        test_recipe:
          setup:
            - "Empty database; the caller presents a valid X-User-ID with X-Role FinanceAnalyst."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { name: "Finance Probe", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: FinanceAnalyst
              as_user_id: "fin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_UNAUTHORIZED\"."
            - "GET /accounts (as CsOpsAdmin) returns total_count == 0."

      - name: csm_user_cannot_create_an_advocacy_enrollment_but_advocacy_manager_can
        claim_type: exclusive_operations_allowed
        grounds:
          - roles.AdvocacyManager
          - roles.CsmUser
          - endpoints[id=E52]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "POST /accounts/{id}/advocacy-enrollments is exclusive to AdvocacyManager: the identical call is 403 for CsmUser and 201 for AdvocacyManager, and only the second writes a NOMINATED row with reference_calls_cap 6."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40 and one ENTERPRISE Account."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/advocacy-enrollments"
              payload: { program_type: "REFERENCE" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /accounts/${acct_id}/advocacy-enrollments"
              payload: { program_type: "REFERENCE" }
              as: AdvocacyManager
              as_user_id: "adv-1"
              captures: { enr_id: $.data.id }
          assert:
            - "The first trigger call returns HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\"."
            - "The second trigger call returns HTTP 201: AdvocacyEnrollment.${enr_id}.state == \"NOMINATED\", program_type == \"REFERENCE\", reference_calls_used == 0, reference_calls_cap == 6."
            - "GET /accounts/${acct_id}/advocacy-enrollments returns exactly 1 item."

      - name: delivering_a_commitment_the_same_user_accepted_returns_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - roles.CsExecutive
          - roles.CsmUser
          - validations[priority=8]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
        distinguishing_aspect: "The executive user exec-1 that ACCEPTED the commitment cannot also DELIVER it (403 ERR_SEGREGATION_OF_DUTIES), while the CSM user completing the same action succeeds — the deny is keyed on X-User-ID, not on the role."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account, arr_cents 30000000, health_tier RED (no signals)."
            - "One ACTIVE SavePlay and one OPEN EscalationCase on that account."
            - "One RemediationCommitment of 500000 cents driven PROPOSED -> ACCEPTED by CsExecutive user exec-1, so accepted_by_user_id is exec-1 and remediation_credit_outstanding_cents is 500000."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 40 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /save-plays"
              payload: { account_id: "${acct_id}", owner_csm_id: "${csm_a_id}", risk_code: "SUPPORT_ESCALATION", play_type: "TECHNICAL_REMEDIATION", window_start_date: "2026-08-05", window_end_date: "2026-08-20" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /save-plays/${sp_id}/transition"
              payload: { action: "ACTIVATE" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /escalation-cases"
              payload: { account_id: "${acct_id}", save_play_id: "${sp_id}", severity: "HIGH", summary: "Repeated Sev2 regressions" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { esc_id: $.data.id, esc_v1: $.data.version }
            - call: "POST /escalation-cases/${esc_id}/remediation-commitments"
              payload: { description: "Service credit for the regression window", due_date: "2026-08-25", credit_cents: 500000, expected_escalation_case_version: "${esc_v1}" }
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { rc1_id: $.data.id }
            - call: "POST /remediation-commitments/${rc1_id}/transition"
              payload: { action: "ACCEPT" }
              as: CsExecutive
              as_user_id: "exec-1"
          trigger:
            - call: "POST /remediation-commitments/${rc1_id}/transition"
              payload: { action: "DELIVER" }
              as: CsExecutive
              as_user_id: "exec-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /remediation-commitments/${rc1_id}/transition"
              payload: { action: "DELIVER" }
              as: CsmUser
              as_user_id: "${csm_a_id}"
          assert:
            - "The first trigger call returns HTTP 403 with data.error_id == \"ERR_SEGREGATION_OF_DUTIES\" and leaves RemediationCommitment.${rc1_id}.state == \"ACCEPTED\"."
            - "The second trigger call returns HTTP 200: RemediationCommitment.${rc1_id}.state == \"DELIVERED\"."
            - "RemediationCommitment.${rc1_id}.accepted_by_user_id == \"exec-1\" and delivered_by_user_id == ${csm_a_id}."
            - "Account.${acct_id}.remediation_credit_outstanding_cents == 500000 and remediation_credit_settled_cents == 0 (settlement happens only on case RESOLVED)."
            - "EscalationCase.${esc_id}.state == \"OPEN\" and final_credit_cents is null."

      - name: a_sales_ae_who_is_not_the_handoff_owner_cannot_accept_the_opportunity
        claim_type: peer_roles
        grounds:
