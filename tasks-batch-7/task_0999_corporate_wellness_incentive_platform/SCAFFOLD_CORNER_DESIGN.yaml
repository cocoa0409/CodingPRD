      - name: finalize_moves_provisional_to_settled
        claim_type: derived_field_reconciliation
        grounds: [calculations.points_balance, state_machines.PointsLedgerEntry.PROVISIONAL_to_POSTED]
        distinguishing_aspect: "finalize-points flips the 100-point EARNED entry PROVISIONAL -> POSTED; settled balance reconciles from 0 to 100 while provisional stays 100."
        test_recipe:
          setup: ["employer + ACTIVE program + employee + ACTIVE enrollment + one accepted 100000-step event (100 provisional points)"]
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
