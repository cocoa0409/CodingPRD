# =============================================================================
# task_2323 — Public Charging Network Reliability & Uptime Compliance
# Scaffold seed tables (§1.0–§1.7).
# Difficulty band: Expert+ (10 entities, 54 endpoints, 6 calculations, 10 state
# machines across 8 entities, 2 OCC races, 6 roles with segregation of duties).
# =============================================================================

scenario: |
  2323. Public Charging Network Reliability & Uptime Compliance (federally funded charging network operator): station commissioning with connector count, power level and payment interoperability requirements, uptime calculation methodology with excluded outage causes and reporting periods, remote monitoring, fault classification and dispatch of field maintenance within response windows, spare parts inventory and dispenser replacement lead times, payment terminal, pricing display and roaming interoperability compliance, host site agreements with power upgrades, parking enforcement and access hours, program reporting and reimbursement conditioned on uptime thresholds, customer complaint intake and session refund handling

domain_name: "public-charging-uptime-compliance"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit foreign keys; no
  # entity id is nested inside another entity's URL path except for the
  # reverse-reachability sub-resource reads.

  state_machine_shape: parallel
  # ChargingPort carries two independent state dimensions (service_state ×
  # maintenance_state); CustomerComplaint carries (state × refund_state).
  # Station.status, ChargingPort.maintenance_state, OutageEvent.state,
  # MaintenanceDispatch.state, UptimeReport.state and ReimbursementClaim.state
  # each contain at least one cycle.

  relationship_patterns:
    - one_to_many
    - many_to_many        # PartReservation is the MaintenanceDispatch × SparePart junction
    - cross_aggregate     # CustomerComplaint references Station, ChargingPort and OutageEvent

  role_model: segregation_of_duties
  # SoD-1: the operator user who created the MaintenanceDispatch may not verify
  #        the resolution of the OutageEvent that dispatch cleared.
  # SoD-2: the user who finalized an UptimeReport may not decide the
  #        ReimbursementClaim derived from that report.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- HostSite
  - name: HostSite
    parent: null
    common_fields: true
    fields:
      - name: site_code
        type: string
        source: input
        required: true
        description: "Operator-assigned host site code"
        constraints: "non-empty, globally unique (case-sensitive); duplicate -> ERR_SITE_CODE_DUPLICATE"
      - name: host_org_name
        type: string
        source: input
        required: true
        description: "Legal name of the property host organization"
        constraints: "non-empty"
      - name: agreement_status
        type: enum
        source: input
        required: false
        description: "Execution state of the host site agreement"
        default: DRAFT
        constraints: "one of {DRAFT, EXECUTED, TERMINATED}; only PATCH /host-sites/{id} by NetworkOperator may change it"
      - name: power_upgrade_status
        type: enum
        source: input
        required: false
        description: "Utility service upgrade progress for the site"
        default: REQUESTED
        constraints: "one of {NOT_REQUIRED, REQUESTED, IN_PROGRESS, ENERGIZED}"
      - name: access_hours_mode
        type: enum
        source: input
        required: false
        description: "Whether the site is publicly accessible around the clock or only inside an access window"
        default: TWENTY_FOUR_SEVEN
        constraints: "one of {TWENTY_FOUR_SEVEN, RESTRICTED}"
      - name: access_open_minute
        type: integer
        source: input
        required: false
        description: "Minute-of-day (UTC) at which public access opens"
        default: 0
        constraints: "0..1439; must be < access_close_minute else ERR_INVALID_ACCESS_WINDOW"
      - name: access_close_minute
        type: integer
        source: input
        required: false
        description: "Minute-of-day (UTC), exclusive, at which public access closes"
        default: 1440
        constraints: "1..1440; must be > access_open_minute else ERR_INVALID_ACCESS_WINDOW"
      - name: parking_enforcement_mode
        type: enum
        source: input
        required: false
        description: "Contracted ICE-ing / overstay enforcement level at the site"
        default: NONE
        constraints: "one of {NONE, SIGNAGE_ONLY, TOWING_ENFORCED}; commissioning requires != NONE"
      - name: committed_service_capacity_kw
        type: number
        source: input
        required: true
        description: "Electrical service capacity the host committed to in the agreement, in kW"
        constraints: "> 0; two decimal places"
      - name: station_count
        type: integer
        source: computed
        required: false
        description: "Count of Station rows with host_site_id == this site and status != DECOMMISSIONED"
        default: 0

  # ----------------------------------------------------------------- Station
  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: host_site_id
        type: string
        source: input
        required: true
        description: "FK -> HostSite.id; the host site this station is installed at"
      - name: station_code
        type: string
        source: input
        required: true
        description: "Operator-assigned station code"
        constraints: "non-empty, globally unique; duplicate -> ERR_STATION_CODE_DUPLICATE"
      - name: power_class
        type: enum
        source: input
        required: true
        description: "Rated power class of the station's dispensers"
        constraints: "one of {L2_19, DCFC_150, DCFC_350}"
      - name: declared_port_count
        type: integer
        source: input
        required: true
        description: "Connector count the station was awarded funding for"
        constraints: ">= 1"
      - name: corridor_designated
        type: boolean
        source: input
        required: false
        description: "True when the station sits on a federally designated alternative fuel corridor"
        default: false
      - name: status
        type: enum
        source: system
        required: false
        description: "Station commissioning / service lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, COMMISSIONING, OPERATIONAL, SUSPENDED, DECOMMISSIONED}"
      - name: suspension_source
        type: enum
        source: system
        required: false
        description: "Why the station is currently SUSPENDED; controls whether automatic resume may fire"
        default: NONE
        constraints: "one of {NONE, AUTOMATIC, MANUAL}"
      - name: commissioned_at
        type: datetime
        source: system
        required: false
        description: "Logical-clock instant at which status became OPERATIONAL for the first time; null before that"
        default: null
      - name: commissioned_port_count
        type: integer
        source: computed
        required: false
        description: "Count of ChargingPort rows with station_id == this station and service_state != RETIRED"
        default: 0
      - name: out_of_service_port_count
        type: integer
        source: computed
        required: false
        description: "Count of ChargingPort rows with station_id == this station and service_state == OUT_OF_SERVICE"
        default: 0
      - name: installed_power_kw
        type: number
        source: computed
        required: false
        description: "Sum of ChargingPort.rated_power_kw over ports with service_state != RETIRED; 2 decimal places"
        default: 0
      - name: payment_interop_score
        type: number
        source: computed
        required: false
        description: "Weighted payment / pricing-display / roaming interoperability score; see calculations.payment_interoperability_score"
        default: 0
      - name: gross_downtime_minutes_lifetime
        type: integer
        source: computed
        required: false
        description: "Sum of closed downtime minutes over every OutageEvent on this station's ports; see calculations.station_downtime_ledger"
        default: 0
      - name: excluded_downtime_minutes_lifetime
        type: integer
        source: computed
        required: false
        description: "Portion of gross_downtime_minutes_lifetime attributable to OutageEvents in state EXCLUDED"
        default: 0
      - name: billable_downtime_minutes_lifetime
        type: integer
        source: computed
        required: false
        description: "gross_downtime_minutes_lifetime minus excluded_downtime_minutes_lifetime"
        default: 0
      - name: refund_liability_cents
        type: integer
        source: computed
        required: false
        description: "Sum of CustomerComplaint.refund_amount_cents over complaints on this station with refund_state == SETTLED"
        default: 0

  # ------------------------------------------------------------- ChargingPort
  - name: ChargingPort
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        required: true
        description: "FK -> Station.id; the station this dispenser/connector belongs to"
      - name: connector_type
        type: enum
        source: input
        required: true
        description: "Physical connector standard of the port"
        constraints: "one of {CCS1, NACS, CHADEMO, J1772}"
      - name: rated_power_kw
        type: number
        source: input
        required: true
        description: "Nameplate power of this port in kW"
        constraints: "> 0; two decimal places"
      - name: dispenser_serial
        type: string
        source: input
        required: true
        description: "Dispenser cabinet serial number"
        constraints: "non-empty, globally unique; duplicate -> ERR_DISPENSER_SERIAL_DUPLICATE"
      - name: terminal_model
        type: string
        source: input
        required: true
        description: "Payment terminal model installed on this dispenser"
        constraints: "non-empty"
      - name: contactless_enabled
        type: boolean
        source: input
        required: false
        description: "True when the terminal accepts contactless bank cards"
        default: false
      - name: plug_and_charge_enabled
        type: boolean
        source: input
        required: false
        description: "True when ISO 15118 Plug and Charge is enabled on this port"
        default: false
      - name: price_display_verified
        type: boolean
        source: input
        required: false
        description: "True when the per-kWh price display on this dispenser has been field-verified"
        default: false
      - name: roaming_ocpi_version
        type: enum
        source: input
        required: false
        description: "OCPI version this port's session records are published to roaming partners with"
        default: NONE
        constraints: "one of {NONE, V2_1_1, V2_2_1, V2_3_0}; only V2_2_1 and V2_3_0 count as roaming-compliant"
      - name: terminal_certification_status
        type: enum
        source: system
        required: false
        description: "Payment-terminal interoperability certification state"
        default: PENDING
        constraints: "one of {PENDING, CERTIFIED, REVOKED}"
      - name: service_state
        type: enum
        source: system
        required: false
        description: "Availability dimension of the port"
        default: IN_SERVICE
        constraints: "one of {IN_SERVICE, OUT_OF_SERVICE, RETIRED}"
      - name: maintenance_state
        type: enum
        source: system
        required: false
        description: "Field-maintenance dimension of the port; evolves independently of service_state"
        default: NONE
        constraints: "one of {NONE, DISPATCH_PENDING, UNDER_REPAIR, AWAITING_PARTS}"
      - name: retired_at
        type: datetime
        source: system
        required: false
        description: "Logical-clock instant at which service_state became RETIRED; null otherwise"
        default: null

  # -------------------------------------------------------------- OutageEvent
  - name: OutageEvent
    parent: null
    common_fields: true
    fields:
      - name: port_id
        type: string
        source: input
        required: true
        description: "FK -> ChargingPort.id; the port the remote monitor reported the fault on"
      - name: fault_code
        type: string
        source: input
        required: true
        description: "Vendor fault code reported by remote monitoring"
        constraints: "non-empty"
      - name: fault_class
        type: enum
        source: input
        required: true
        description: "Severity classification driving the maintenance response window"
        constraints: "one of {CRITICAL, MAJOR, MINOR, INFORMATIONAL}"
      - name: detected_at
        type: datetime
        source: input
        required: true
        description: "Instant the monitor first observed the fault"
        constraints: "must be <= logical clock now (ERR_DETECTED_AT_IN_FUTURE) and >= the port's created_at (ERR_DETECTED_AT_BEFORE_PORT)"
      - name: cleared_at
        type: datetime
        source: system
        required: false
        description: "Instant the fault stopped; set to logical clock now when the outage reaches RESOLVED, reset to null on reopen"
        default: null
      - name: excluded_cause_claim
        type: enum
        source: input
        required: false
        description: "Operator-claimed excluded outage cause"
        default: NONE
        constraints: "one of {NONE, UTILITY_OUTAGE, NATURAL_DISASTER, VANDALISM, HOST_SITE_CLOSURE, EVSE_MANUFACTURER_RECALL}; NONE is not eligible for exclusion"
      - name: state
        type: enum
        source: system
        required: false
        description: "Outage lifecycle state"
        default: DETECTED
        constraints: "one of {DETECTED, CLASSIFIED, DISPATCHED, RESOLVED, VERIFIED, EXCLUSION_REVIEW, EXCLUDED}"
      - name: pre_exclusion_state
        type: enum
        source: system
        required: false
        description: "State the outage occupied when the exclusion request was filed; restored on REJECT or REVOKE"
        default: null
        constraints: "one of {CLASSIFIED, RESOLVED} or null"
      - name: excluded_at
        type: datetime
        source: system
        required: false
        description: "Logical-clock instant the exclusion was approved; cleared to null on revoke"
        default: null
      - name: dispatch_created_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the operator who created the MaintenanceDispatch for this outage; SoD-1 compares against the verifier"
        default: null
      - name: is_system_generated
        type: boolean
        source: system
        required: false
        description: "True when the outage was synthesized by a cascade rather than posted by remote monitoring"
        default: false

  # -------------------------------------------------------- MaintenanceDispatch
  - name: MaintenanceDispatch
    parent: null
    common_fields: true
    fields:
      - name: outage_event_id
        type: string
        source: input
        required: true
        description: "FK -> OutageEvent.id; the fault this dispatch is sent to clear"
      - name: port_id
        type: string
        source: input
        required: true
        description: "FK -> ChargingPort.id; port the technician is assigned to; must equal the outage's port_id"
      - name: technician_user_id
        type: string
        source: input
        required: true
        description: "Opaque X-User-ID of the FieldTechnician assigned to the dispatch"
        constraints: "non-empty"
      - name: technician_certification_class
        type: enum
        source: input
        required: true
        description: "Highest certification the assigned technician holds"
        constraints: "one of {L2, DCFC_BASIC, DCFC_HV}"
      - name: window_start_at
        type: datetime
        source: input
        required: true
        description: "Start of the planned on-site maintenance window (half-open interval start)"
        constraints: ">= the outage's detected_at else ERR_DISPATCH_WINDOW_INVALID"
      - name: window_end_at
        type: datetime
        source: input
        required: true
        description: "End of the planned on-site maintenance window (half-open interval end, exclusive)"
        constraints: "> window_start_at else ERR_DISPATCH_WINDOW_INVALID"
      - name: response_deadline_at
        type: datetime
        source: computed
        required: false
        description: "Contractual arrival deadline; see calculations.dispatch_response_deadline"
      - name: arrived_at
        type: datetime
        source: system
        required: false
        description: "Logical-clock instant recorded when progress event ARRIVE is posted"
        default: null
      - name: response_met
        type: boolean
        source: computed
        required: false
        description: "arrived_at <= response_deadline_at, evaluated once at ARRIVE; null until then"
        default: null
      - name: promised_repair_at
        type: datetime
        source: computed
        required: false
        description: "Repair promise recomputed on every parts-hold; see calculations.parts_hold_repair_promise"
        default: null
      - name: total_hold_minutes
        type: integer
        source: computed
        required: false
        description: "Hold length in minutes backing promised_repair_at; see calculations.parts_hold_repair_promise"
        default: null
      - name: created_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the NetworkOperator who created this dispatch"
      - name: state
        type: enum
        source: system
        required: false
        description: "Dispatch lifecycle state"
        default: CREATED
        constraints: "one of {CREATED, EN_ROUTE, ON_SITE, PARTS_HOLD, COMPLETED, CANCELLED}"

  # --------------------------------------------------------------- SparePart
  - name: SparePart
    parent: null
    common_fields: true
    fields:
      - name: part_number
        type: string
        source: input
        required: true
        description: "Manufacturer part number"
        constraints: "non-empty, globally unique; duplicate -> ERR_PART_NUMBER_DUPLICATE"
      - name: part_class
        type: enum
        source: input
        required: true
        description: "Repair class the part belongs to; drives labour minutes"
        constraints: "one of {DISPENSER, POWER_MODULE, CABLE_ASSEMBLY, PAYMENT_TERMINAL}"
      - name: on_hand_qty
        type: integer
        source: system
        required: false
        description: "Units physically in the depot; seeded from the create payload, raised by restock, lowered by consumption"
        default: 0
        constraints: ">= 0"
      - name: reserved_qty
        type: integer
        source: computed
        required: false
        description: "Sum of PartReservation.qty over reservations on this part with state == RESERVED"
        default: 0
      - name: backordered_qty
        type: integer
        source: computed
        required: false
        description: "Sum of PartReservation.qty over reservations on this part with state == BACKORDERED"
        default: 0
      - name: consumed_qty_lifetime
        type: integer
        source: computed
        required: false
        description: "Sum of PartReservation.qty over reservations on this part with state == CONSUMED"
        default: 0
      - name: unencumbered_qty
        type: integer
        source: computed
        required: false
        description: "on_hand_qty - reserved_qty; the conserved quantity of the reserve/release compensating pair"
        default: 0
      - name: lead_time_days
        type: integer
        source: input
        required: true
        description: "Vendor replenishment lead time in whole days"
        constraints: ">= 0"

  # ----------------------------------------------------------- PartReservation
  - name: PartReservation
    parent: null
    common_fields: true
    fields:
      - name: dispatch_id
        type: string
        source: input
        required: true
        description: "FK -> MaintenanceDispatch.id; dispatch the parts are earmarked for"
      - name: spare_part_id
        type: string
        source: input
        required: true
        description: "FK -> SparePart.id; part being earmarked"
      - name: qty
        type: integer
        source: input
        required: true
        description: "Units earmarked"
        constraints: ">= 1 else ERR_RESERVATION_QTY_INVALID"
      - name: state
        type: enum
        source: system
        required: false
        description: "Reservation lifecycle state; RESERVED when stock covered the request at creation, BACKORDERED otherwise"
        default: RESERVED
        constraints: "one of {RESERVED, BACKORDERED, CONSUMED, RELEASED}"
      - name: expected_available_at
        type: datetime
        source: computed
        required: false
        description: "For BACKORDERED reservations, logical clock now + SparePart.lead_time_days days; null for RESERVED"
        default: null

  # -------------------------------------------------------------- UptimeReport
  - name: UptimeReport
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        required: true
        description: "FK -> Station.id; station the reporting period covers"
      - name: period_start
        type: datetime
        source: input
        required: true
        description: "Inclusive start of the reporting period"
      - name: period_end
        type: datetime
        source: input
        required: true
        description: "Inclusive end of the reporting period"
        constraints: "> period_start; span >= 10080 minutes; <= logical clock now"
      - name: methodology
        type: enum
        source: system
        required: false
        description: "Which uptime variant produced the currently stored figures"
        default: null
        constraints: "one of {PROVISIONAL, FINAL} or null before the first computation"
      - name: eligible_port_count
        type: integer
        source: computed
        required: false
        description: "Count of ports counted in the denominator; see calculations.station_uptime_percentage"
        default: null
      - name: total_port_minutes
        type: integer
        source: computed
        required: false
        description: "eligible_port_count * period minutes"
        default: null
      - name: excluded_minutes
        type: integer
        source: computed
        required: false
        description: "Downtime minutes inside the period attributable to OutageEvents in state EXCLUDED"
        default: null
      - name: billable_downtime_minutes
        type: integer
        source: computed
        required: false
        description: "Downtime minutes inside the period attributable to OutageEvents not in state EXCLUDED"
        default: null
      - name: uptime_pct
        type: number
        source: computed
        required: false
        description: "Uptime percentage, 2 decimal places; see calculations.station_uptime_percentage"
        default: null
      - name: state
        type: enum
        source: system
        required: false
        description: "Reporting lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, PROVISIONAL, FINAL, SUBMITTED, ACCEPTED}"
      - name: finalized_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the ComplianceAuditor who finalized the report; SoD-2 compares against the claim decider"
        default: null
      - name: claim_count
        type: integer
        source: computed
        required: false
        description: "Count of ReimbursementClaim rows with uptime_report_id == this report (any state)"
        default: 0
      - name: returned_count
        type: integer
        source: computed
        required: false
        description: "Number of times the program administrator has returned this report from SUBMITTED to PROVISIONAL"
        default: 0

  # -------------------------------------------------------- ReimbursementClaim
  - name: ReimbursementClaim
    parent: null
    common_fields: true
    fields:
      - name: uptime_report_id
        type: string
        source: input
        required: true
        description: "FK -> UptimeReport.id; the accepted report this claim draws on"
      - name: line_items
        type: array
        source: input
        required: true
        description: "Ordered array of objects { port_id: string, category: enum{OANDM, NETWORK_FEES, PARTS}, amount_cents: integer >= 0 }"
        constraints: "length >= 1 else ERR_CLAIM_LINE_ITEMS_EMPTY; every port_id must belong to the report's station else ERR_CLAIM_LINE_PORT_MISMATCH"
      - name: requested_amount_cents
        type: integer
        source: computed
        required: false
        description: "Exact integer sum of line_items[].amount_cents"
      - name: remediation_credit_pp
        type: number
        source: system
        required: false
        description: "Percentage points of uptime credit granted by an accepted remediation plan; snapshotted when the claim enters REVIEW"
        default: 0
      - name: effective_uptime_pct
        type: number
        source: computed
        required: false
        description: "Snapshot of report uptime plus remediation credit taken at REVIEW entry; see calculations.reimbursement_payable_amount"
        default: null
      - name: withhold_rate
        type: number
        source: computed
        required: false
        description: "Tier rate selected from effective_uptime_pct at REVIEW entry"
        default: null
      - name: withheld_amount_cents
        type: integer
        source: computed
        required: false
        description: "Sum of per-line-item rounded withholds; see calculations.reimbursement_payable_amount"
        default: null
      - name: approved_amount_cents
        type: integer
        source: computed
        required: false
        description: "requested_amount_cents - withheld_amount_cents"
        default: null
      - name: state
        type: enum
        source: system
        required: false
        description: "Claim lifecycle state"
        default: PENDING
        constraints: "one of {PENDING, REVIEW, APPROVED, WITHHELD, DENIED, SUPERSEDED}"
      - name: decided_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the ProgramAdministrator who issued the current decision"
        default: null

  # ----------------------------------------------------------- CustomerComplaint
  - name: CustomerComplaint
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        required: true
        description: "FK -> Station.id; station the driver complained about"
      - name: port_id
        type: string
        source: input
        required: true
        description: "FK -> ChargingPort.id; port the driver used; must belong to station_id"
      - name: linked_outage_event_id
        type: string
        source: system
        required: false
        description: "FK -> OutageEvent.id; outage the complaint was attributed to at triage; null when unlinked"
        default: null
      - name: complaint_type
        type: enum
        source: input
        required: true
        description: "Driver-reported problem category"
        constraints: "one of {PAYMENT_DECLINED, PRICE_MISMATCH, SESSION_FAILED, CHARGER_OFFLINE, BLOCKED_STALL}"
      - name: session_started_at
        type: datetime
        source: input
        required: true
        description: "Start of the disputed charging session"
      - name: session_ended_at
        type: datetime
        source: input
        required: true
        description: "End of the disputed charging session"
        constraints: "> session_started_at else ERR_SESSION_WINDOW_INVALID"
      - name: session_energy_kwh
        type: number
        source: input
        required: true
        description: "Energy actually delivered in the disputed session, 3 decimal places"
        constraints: ">= 0"
      - name: session_price_per_kwh_cents
        type: integer
        source: input
        required: true
        description: "Posted per-kWh price in whole cents that applied to the session"
        constraints: ">= 0"
      - name: session_idle_fee_cents
        type: integer
        source: input
        required: false
        description: "Idle/occupancy fee component included in session_charged_cents"
        default: 0
        constraints: ">= 0"
      - name: session_charged_cents
        type: integer
        source: input
        required: true
        description: "Total amount actually charged to the driver's payment instrument"
        constraints: ">= session_idle_fee_cents else ERR_SESSION_CHARGE_INVALID"
      - name: state
        type: enum
        source: system
        required: false
        description: "Complaint intake dimension"
        default: INTAKE
        constraints: "one of {INTAKE, TRIAGED, CLOSED, DISMISSED}"
      - name: refund_state
        type: enum
        source: system
        required: false
        description: "Session-refund dimension; evolves independently of state"
        default: NONE
        constraints: "one of {NONE, REQUESTED, APPROVED, DENIED, SETTLED, REVERSED}"
      - name: refund_basis
        type: enum
        source: input
        required: false
        description: "Which refund variant was requested"
        default: null
        constraints: "one of {ENERGY_PRORATED, FULL_SESSION_GOODWILL} or null before a request"
      - name: refund_amount_cents
        type: integer
        source: computed
        required: false
        description: "Refund owed to the driver; see calculations.session_refund_amount"
        default: null
      - name: retained_amount_cents
        type: integer
        source: computed
        required: false
        description: "session_charged_cents - refund_amount_cents; the money-conservation counterpart"
        default: null
      - name: refund_requested_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the CustomerSupportAgent who filed the refund request"
        default: null
      - name: refund_settled_at
        type: datetime
        source: system
        required: false
        description: "Logical-clock instant the refund was settled; cleared to null on reversal"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ------------------------------------------------ Station.status (cyclic)
  - entity: Station
    state_field: status
    initial_state: DRAFT
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: DRAFT
        to: COMMISSIONING
        trigger: "POST /stations/{station_id}/status-transitions {target_status: COMMISSIONING}"
        actor: NetworkOperator
        preconditions:
          - "station.status == DRAFT"
          - "station.commissioned_port_count >= 1"
        side_effects:
          - "increments Station.version by 1"
      - from: COMMISSIONING
        to: DRAFT
        trigger: "POST /stations/{station_id}/status-transitions {target_status: DRAFT}"
        actor: ComplianceAuditor
        preconditions:
          - "station.status == COMMISSIONING"
        side_effects:
          - "increments Station.version by 1"
        note: "Revert leg of the commissioning cycle — used when an interoperability audit fails."
      - from: COMMISSIONING
        to: OPERATIONAL
        trigger: "POST /stations/{station_id}/commission"
        actor: NetworkOperator
        preconditions:
          - "station.status == COMMISSIONING"
          - "host_site.agreement_status == EXECUTED (HostSite named by station.host_site_id)"
          - "host_site.power_upgrade_status IN {NOT_REQUIRED, ENERGIZED}"
          - "host_site.parking_enforcement_mode IN {SIGNAGE_ONLY, TOWING_ENFORCED}"
          - "station.commissioned_port_count >= station.declared_port_count"
          - "station.installed_power_kw <= host_site.committed_service_capacity_kw"
          - "station.payment_interop_score >= 90.00"
        side_effects:
          - "sets Station.commissioned_at = logical clock now"
          - "sets Station.suspension_source = NONE"
          - "recomputes Station.payment_interop_score via calculations.payment_interoperability_score"
          - "increments Station.version by 1"
      - from: OPERATIONAL
        to: SUSPENDED
        trigger: "POST /stations/{station_id}/status-transitions {target_status: SUSPENDED}"
        actor: NetworkOperator
        preconditions:
          - "station.status == OPERATIONAL"
        side_effects:
          - "sets Station.suspension_source = MANUAL"
          - "increments Station.version by 1"
      - from: OPERATIONAL
        to: SUSPENDED
        trigger: "system: a ChargingPort of this station entered service_state OUT_OF_SERVICE"
        actor: system
        preconditions:
          - "station.status == OPERATIONAL"
          - "station.out_of_service_port_count >= 1 after the port's transition"
        side_effects:
          - "sets Station.suspension_source = AUTOMATIC"
          - "recomputes Station.out_of_service_port_count"
          - "increments Station.version by 1"
        note: "Cascade-B link 3 and cascade-A precursor. Automatic suspension is distinguishable from MANUAL so that automatic resume never un-does an operator suspension."
      - from: SUSPENDED
        to: OPERATIONAL
        trigger: "system: the last OUT_OF_SERVICE ChargingPort of this station returned to IN_SERVICE"
        actor: system
        preconditions:
          - "station.status == SUSPENDED"
          - "station.suspension_source == AUTOMATIC"
          - "station.out_of_service_port_count == 0 after the port's transition"
        side_effects:
          - "sets Station.suspension_source = NONE"
          - "increments Station.version by 1"
        note: "Cascade-A link 4. Closes the OPERATIONAL -> SUSPENDED -> OPERATIONAL cycle."
      - from: SUSPENDED
        to: OPERATIONAL
        trigger: "POST /stations/{station_id}/status-transitions {target_status: OPERATIONAL}"
        actor: NetworkOperator
        preconditions:
          - "station.status == SUSPENDED"
          - "station.out_of_service_port_count == 0"
        side_effects:
          - "sets Station.suspension_source = NONE"
          - "increments Station.version by 1"
      - from: DRAFT
        to: DECOMMISSIONED
        trigger: "POST /stations/{station_id}/status-transitions {target_status: DECOMMISSIONED}"
        actor: NetworkOperator
        preconditions:
          - "station.status IN {DRAFT, COMMISSIONING, OPERATIONAL, SUSPENDED}"
        side_effects:
          - "cascade-B-style teardown described on the OPERATIONAL -> DECOMMISSIONED row"
          - "increments Station.version by 1"
      - from: OPERATIONAL
        to: DECOMMISSIONED
        trigger: "POST /stations/{station_id}/status-transitions {target_status: DECOMMISSIONED}"
        actor: NetworkOperator
        preconditions:
          - "station.status IN {DRAFT, COMMISSIONING, OPERATIONAL, SUSPENDED}"
        side_effects:
          - "link 1: every ChargingPort of this station with service_state IN {IN_SERVICE, OUT_OF_SERVICE} moves to RETIRED with retired_at = logical clock now and maintenance_state = NONE"
          - "link 2: because those ports retired, every OutageEvent on them in state IN {DETECTED, CLASSIFIED, DISPATCHED, EXCLUSION_REVIEW} moves to EXCLUDED with excluded_cause_claim forced to HOST_SITE_CLOSURE, pre_exclusion_state = the state it left, excluded_at = logical clock now, and cleared_at = logical clock now when it was still null"
          - "link 3: because those outages became EXCLUDED, every MaintenanceDispatch on them in state IN {CREATED, EN_ROUTE, ON_SITE, PARTS_HOLD} moves to CANCELLED and each of that dispatch's PartReservation rows in state IN {RESERVED, BACKORDERED} moves to RELEASED, restoring SparePart.reserved_qty / SparePart.backordered_qty and therefore SparePart.unencumbered_qty"
          - "recomputes Station.commissioned_port_count, out_of_service_port_count, installed_power_kw, payment_interop_score, gross/excluded/billable downtime ledger"
          - "sets Station.suspension_source = NONE"
          - "decrements HostSite.station_count"
          - "increments Station.version by 1"
        note: "Cascade B (depth 3): station teardown -> port retirement -> outage exclusion -> dispatch cancellation + parts release."

  # ------------------------------- ChargingPort.service_state (parallel dim 1)
  - entity: ChargingPort
    state_field: service_state
    initial_state: IN_SERVICE
    terminal_states: [RETIRED]
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system: POST /outage-events (or POST /outage-events/{id}/classify) records fault_class IN {CRITICAL, MAJOR}"
        actor: system
        preconditions:
          - "port.service_state == IN_SERVICE"
          - "the triggering OutageEvent.fault_class IN {CRITICAL, MAJOR}"
        side_effects:
          - "increments Station.out_of_service_port_count"
          - "may trigger Station OPERATIONAL -> SUSPENDED (suspension_source = AUTOMATIC)"
          - "increments ChargingPort.version by 1"
        note: "MINOR / INFORMATIONAL faults deliberately leave the port IN_SERVICE — conditional cascade."
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "system: POST /charging-ports/{port_id}/terminal-certification {certification_status: REVOKED}"
        actor: system
        preconditions:
          - "port.service_state == IN_SERVICE"
        side_effects:
          - "increments Station.out_of_service_port_count"
          - "recomputes Station.payment_interop_score"
          - "may trigger Station OPERATIONAL -> SUSPENDED (suspension_source = AUTOMATIC)"
          - "increments ChargingPort.version by 1"
        note: "Cascade B link 2."
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "system: the port's last non-resolved OutageEvent reached RESOLVED or EXCLUDED"
        actor: system
        preconditions:
          - "port.service_state == OUT_OF_SERVICE"
          - "no OutageEvent on this port remains in state IN {DETECTED, CLASSIFIED, DISPATCHED, EXCLUSION_REVIEW}"
          - "port.terminal_certification_status != REVOKED"
        side_effects:
          - "decrements Station.out_of_service_port_count"
          - "may trigger Station SUSPENDED -> OPERATIONAL when suspension_source == AUTOMATIC and the counter hits 0"
          - "increments ChargingPort.version by 1"
        note: "Cascade A link 3."
      - from: IN_SERVICE
        to: RETIRED
        trigger: "POST /charging-ports/{port_id}/retire"
        actor: NetworkOperator
        preconditions:
          - "port.service_state IN {IN_SERVICE, OUT_OF_SERVICE}"
          - "port.maintenance_state == NONE"
        side_effects:
          - "sets ChargingPort.retired_at = logical clock now"
          - "recomputes Station.commissioned_port_count, installed_power_kw, payment_interop_score"
          - "increments ChargingPort.version by 1"
      - from: OUT_OF_SERVICE
        to: RETIRED
        trigger: "POST /charging-ports/{port_id}/retire (or system teardown on Station DECOMMISSIONED)"
        actor: NetworkOperator
        preconditions:
          - "port.service_state IN {IN_SERVICE, OUT_OF_SERVICE}"
          - "port.maintenance_state == NONE (waived on the Station DECOMMISSIONED teardown path)"
        side_effects:
          - "sets ChargingPort.retired_at = logical clock now"
          - "decrements Station.out_of_service_port_count"
          - "recomputes Station.commissioned_port_count, installed_power_kw, payment_interop_score"
          - "increments ChargingPort.version by 1"

  # --------------------------- ChargingPort.maintenance_state (parallel dim 2)
  - entity: ChargingPort
    state_field: maintenance_state
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: DISPATCH_PENDING
        trigger: "system: POST /maintenance-dispatches created a dispatch for an OutageEvent on this port"
        actor: system
        preconditions:
          - "port.maintenance_state == NONE"
          - "port.service_state != RETIRED"
        side_effects:
          - "increments ChargingPort.version by 1"
        note: "maintenance_state is the port's AGGREGATE repair posture, not per-dispatch state. When a further dispatch is created for a port already in DISPATCH_PENDING, UNDER_REPAIR or AWAITING_PARTS, this dimension is left unchanged and ChargingPort.version is NOT bumped. Multiple live dispatches on one port are therefore permitted; they are separated by the half-open window-overlap rule in §1.4 priority 15, not by this dimension."
      - from: DISPATCH_PENDING
        to: UNDER_REPAIR
        trigger: "system: POST /maintenance-dispatches/{dispatch_id}/progress {event: ARRIVE}"
        actor: system
        preconditions:
          - "port.maintenance_state == DISPATCH_PENDING"
        side_effects:
          - "increments ChargingPort.version by 1"
      - from: UNDER_REPAIR
        to: AWAITING_PARTS
        trigger: "system: POST /maintenance-dispatches/{dispatch_id}/parts-hold"
        actor: system
        preconditions:
          - "port.maintenance_state == UNDER_REPAIR"
        side_effects:
          - "increments ChargingPort.version by 1"
      - from: AWAITING_PARTS
        to: UNDER_REPAIR
        trigger: "system: POST /maintenance-dispatches/{dispatch_id}/progress {event: RESUME_ONSITE}"
        actor: system
        preconditions:
          - "port.maintenance_state == AWAITING_PARTS"
        side_effects:
          - "increments ChargingPort.version by 1"
        note: "Closes the UNDER_REPAIR -> AWAITING_PARTS -> UNDER_REPAIR cycle; a dispatch may hold for parts any number of times."
      - from: UNDER_REPAIR
        to: NONE
        trigger: "system: POST /maintenance-dispatches/{dispatch_id}/complete"
        actor: system
        preconditions:
          - "port.maintenance_state == UNDER_REPAIR"
          - "no other MaintenanceDispatch on this port remains in state IN {CREATED, EN_ROUTE, ON_SITE, PARTS_HOLD}; when one does, the dimension is re-derived as DISPATCH_PENDING instead of NONE"
        side_effects:
          - "increments ChargingPort.version by 1"
      - from: DISPATCH_PENDING
        to: NONE
        trigger: "system: the dispatch on this port moved to CANCELLED during Station DECOMMISSIONED teardown"
        actor: system
        preconditions:
          - "port.maintenance_state IN {DISPATCH_PENDING, UNDER_REPAIR, AWAITING_PARTS}"
        side_effects:
          - "increments ChargingPort.version by 1"

  # --------------------------- OutageEvent.state (branching + two cycles)
  - entity: OutageEvent
    state_field: state
    initial_state: DETECTED
    terminal_states: [VERIFIED]
    transitions:
      - from: DETECTED
        to: CLASSIFIED
        trigger: "POST /outage-events/{outage_event_id}/classify"
        actor: NetworkOperator
        preconditions:
          - "outage.state == DETECTED"
          - "the outage's ChargingPort.service_state != RETIRED"
        side_effects:
          - "overwrites OutageEvent.fault_class and OutageEvent.excluded_cause_claim with the payload values"
          - "when the new fault_class IN {CRITICAL, MAJOR} and the port is IN_SERVICE, drives ChargingPort IN_SERVICE -> OUT_OF_SERVICE (which may suspend the Station)"
          - "increments OutageEvent.version by 1"
      - from: CLASSIFIED
        to: DISPATCHED
        trigger: "system: POST /maintenance-dispatches"
        actor: system
        preconditions:
          - "outage.state == CLASSIFIED"
        side_effects:
          - "sets OutageEvent.dispatch_created_by_user_id = X-User-ID of the creating NetworkOperator"
          - "drives ChargingPort.maintenance_state NONE -> DISPATCH_PENDING"
          - "increments OutageEvent.version by 1"
      - from: DISPATCHED
        to: RESOLVED
        trigger: "system: POST /maintenance-dispatches/{dispatch_id}/complete"
        actor: system
        preconditions:
          - "outage.state == DISPATCHED"
        side_effects:
          - "sets OutageEvent.cleared_at = logical clock now"
          - "recomputes Station.gross_downtime_minutes_lifetime and Station.billable_downtime_minutes_lifetime"
          - "link 3: because no non-resolved outage remains on the port, drives ChargingPort OUT_OF_SERVICE -> IN_SERVICE and maintenance_state UNDER_REPAIR -> NONE"
          - "increments OutageEvent.version by 1"
        note: "Cascade A link 2."
      - from: RESOLVED
        to: VERIFIED
        trigger: "POST /outage-events/{outage_event_id}/resolution-reviews {outcome: VERIFY}"
        actor: ComplianceAuditor
        preconditions:
          - "outage.state == RESOLVED"
          - "X-User-ID != outage.dispatch_created_by_user_id (SoD-1)"
        side_effects:
          - "increments OutageEvent.version by 1"
      - from: RESOLVED
        to: CLASSIFIED
        trigger: "POST /outage-events/{outage_event_id}/resolution-reviews {outcome: REOPEN}"
        actor: NetworkOperator
        preconditions:
          - "outage.state == RESOLVED"
          - "the outage's ChargingPort.service_state != RETIRED"
        side_effects:
          - "sets OutageEvent.cleared_at = null"
          - "recomputes Station.gross_downtime_minutes_lifetime and Station.billable_downtime_minutes_lifetime"
          - "when fault_class IN {CRITICAL, MAJOR}, drives ChargingPort IN_SERVICE -> OUT_OF_SERVICE (which may suspend the Station)"
          - "increments OutageEvent.version by 1"
        note: "Closes the CLASSIFIED -> DISPATCHED -> RESOLVED -> CLASSIFIED cycle."
      - from: CLASSIFIED
        to: EXCLUSION_REVIEW
        trigger: "POST /outage-events/{outage_event_id}/exclusion-actions {action: REQUEST}"
        actor: NetworkOperator
        preconditions:
          - "outage.state IN {CLASSIFIED, RESOLVED}"
          - "outage.excluded_cause_claim != NONE"
        side_effects:
          - "sets OutageEvent.pre_exclusion_state = CLASSIFIED"
          - "increments OutageEvent.version by 1"
      - from: RESOLVED
        to: EXCLUSION_REVIEW
        trigger: "POST /outage-events/{outage_event_id}/exclusion-actions {action: REQUEST}"
        actor: NetworkOperator
        preconditions:
          - "outage.state IN {CLASSIFIED, RESOLVED}"
          - "outage.excluded_cause_claim != NONE"
        side_effects:
          - "sets OutageEvent.pre_exclusion_state = RESOLVED"
          - "increments OutageEvent.version by 1"
      - from: EXCLUSION_REVIEW
        to: EXCLUDED
        trigger: "POST /outage-events/{outage_event_id}/exclusion-actions {action: APPROVE}"
        actor: ComplianceAuditor
        preconditions:
          - "outage.state == EXCLUSION_REVIEW"
          - "outage.excluded_cause_claim != NONE"
        side_effects:
          - "sets OutageEvent.excluded_at = logical clock now"
          - "recomputes Station.excluded_downtime_minutes_lifetime and Station.billable_downtime_minutes_lifetime (Station.gross_downtime_minutes_lifetime is unchanged)"
          - "every UptimeReport of the outage's station in state PROVISIONAL returns to DRAFT with methodology, uptime_pct, excluded_minutes, billable_downtime_minutes, total_port_minutes and eligible_port_count reset to null"
          - "when the outage left pre_exclusion_state CLASSIFIED, drives ChargingPort OUT_OF_SERVICE -> IN_SERVICE if no other non-resolved outage remains"
          - "increments OutageEvent.version by 1"
      - from: EXCLUSION_REVIEW
        to: CLASSIFIED
        trigger: "POST /outage-events/{outage_event_id}/exclusion-actions {action: REJECT}"
        actor: ComplianceAuditor
        preconditions:
          - "outage.state == EXCLUSION_REVIEW"
          - "outage.pre_exclusion_state == CLASSIFIED"
        side_effects:
          - "sets OutageEvent.pre_exclusion_state = null"
          - "increments OutageEvent.version by 1"
      - from: EXCLUSION_REVIEW
        to: RESOLVED
        trigger: "POST /outage-events/{outage_event_id}/exclusion-actions {action: REJECT}"
        actor: ComplianceAuditor
        preconditions:
          - "outage.state == EXCLUSION_REVIEW"
          - "outage.pre_exclusion_state == RESOLVED"
        side_effects:
          - "sets OutageEvent.pre_exclusion_state = null"
          - "increments OutageEvent.version by 1"
      - from: EXCLUDED
        to: RESOLVED
        trigger: "POST /outage-events/{outage_event_id}/exclusion-actions {action: REVOKE}"
        actor: ComplianceAuditor
        preconditions:
          - "outage.state == EXCLUDED"
          - "outage.pre_exclusion_state == RESOLVED"
        side_effects:
          - "sets OutageEvent.excluded_at = null and pre_exclusion_state = null"
          - "recomputes Station.excluded_downtime_minutes_lifetime and Station.billable_downtime_minutes_lifetime (Station.gross_downtime_minutes_lifetime is unchanged)"
          - "every UptimeReport of the outage's station in state PROVISIONAL returns to DRAFT with the computed uptime fields reset to null"
          - "increments OutageEvent.version by 1"
        note: "Compensating action for the exclusion-approval invariant."
      - from: EXCLUDED
        to: CLASSIFIED
        trigger: "POST /outage-events/{outage_event_id}/exclusion-actions {action: REVOKE}"
        actor: ComplianceAuditor
        preconditions:
          - "outage.state == EXCLUDED"
          - "outage.pre_exclusion_state == CLASSIFIED"
        side_effects:
          - "sets OutageEvent.excluded_at = null and pre_exclusion_state = null"
          - "recomputes Station.excluded_downtime_minutes_lifetime and Station.billable_downtime_minutes_lifetime"
          - "when fault_class IN {CRITICAL, MAJOR}, drives ChargingPort IN_SERVICE -> OUT_OF_SERVICE"
          - "increments OutageEvent.version by 1"
      - from: CLASSIFIED
        to: EXCLUDED
        trigger: "system: Station DECOMMISSIONED teardown"
        actor: system
        preconditions:
          - "outage.state IN {DETECTED, CLASSIFIED, DISPATCHED, EXCLUSION_REVIEW}"
        side_effects:
          - "forces excluded_cause_claim = HOST_SITE_CLOSURE, pre_exclusion_state = the state left, excluded_at = logical clock now, cleared_at = logical clock now when previously null"
          - "increments OutageEvent.version by 1"
        note: "Cascade B link 2 on the decommission path. The `from:` label is representative — every state in the precondition set {DETECTED, CLASSIFIED, DISPATCHED, EXCLUSION_REVIEW} lands on EXCLUDED, and the state actually left is recorded in pre_exclusion_state (normalised to CLASSIFIED when the state left was DETECTED or EXCLUSION_REVIEW, and to RESOLVED when it was DISPATCHED, so pre_exclusion_state stays inside its declared enum)."

  # ------------------ MaintenanceDispatch.state (cycle through PARTS_HOLD)
  - entity: MaintenanceDispatch
    state_field: state
    initial_state: CREATED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: CREATED
        to: EN_ROUTE
        trigger: "POST /maintenance-dispatches/{dispatch_id}/progress {event: EN_ROUTE}"
        actor: FieldTechnician
        preconditions:
          - "dispatch.state == CREATED"
          - "X-User-ID == dispatch.technician_user_id"
          - "the dispatch's Station.status IN {OPERATIONAL, SUSPENDED}"
        side_effects:
          - "increments MaintenanceDispatch.version by 1"
      - from: EN_ROUTE
        to: ON_SITE
        trigger: "POST /maintenance-dispatches/{dispatch_id}/progress {event: ARRIVE}"
        actor: FieldTechnician
        preconditions:
          - "dispatch.state == EN_ROUTE"
          - "X-User-ID == dispatch.technician_user_id"
        side_effects:
          - "sets MaintenanceDispatch.arrived_at = logical clock now"
          - "sets MaintenanceDispatch.response_met = (arrived_at <= response_deadline_at)"
          - "drives ChargingPort.maintenance_state DISPATCH_PENDING -> UNDER_REPAIR"
          - "increments MaintenanceDispatch.version by 1"
      - from: ON_SITE
        to: PARTS_HOLD
        trigger: "POST /maintenance-dispatches/{dispatch_id}/parts-hold"
        actor: FieldTechnician
        preconditions:
          - "dispatch.state == ON_SITE"
          - "X-User-ID == dispatch.technician_user_id"
          - "at least one PartReservation on this dispatch is in state IN {RESERVED, BACKORDERED}"
        side_effects:
          - "recomputes MaintenanceDispatch.total_hold_minutes and promised_repair_at via calculations.parts_hold_repair_promise"
          - "drives ChargingPort.maintenance_state UNDER_REPAIR -> AWAITING_PARTS"
          - "increments MaintenanceDispatch.version by 1"
      - from: PARTS_HOLD
        to: ON_SITE
        trigger: "POST /maintenance-dispatches/{dispatch_id}/progress {event: RESUME_ONSITE}"
        actor: FieldTechnician
        preconditions:
          - "dispatch.state == PARTS_HOLD"
          - "X-User-ID == dispatch.technician_user_id"
        side_effects:
          - "drives ChargingPort.maintenance_state AWAITING_PARTS -> UNDER_REPAIR"
          - "increments MaintenanceDispatch.version by 1"
        note: "Closes the ON_SITE -> PARTS_HOLD -> ON_SITE cycle."
      - from: ON_SITE
        to: COMPLETED
        trigger: "POST /maintenance-dispatches/{dispatch_id}/complete"
        actor: FieldTechnician
        preconditions:
          - "dispatch.state == ON_SITE"
          - "X-User-ID == dispatch.technician_user_id"
          - "no PartReservation on this dispatch remains in state BACKORDERED"
        side_effects:
          - "every PartReservation on this dispatch in state RESERVED moves to CONSUMED, decrementing SparePart.on_hand_qty and SparePart.reserved_qty by qty and raising SparePart.consumed_qty_lifetime"
          - "link 2: drives the dispatch's OutageEvent DISPATCHED -> RESOLVED with cleared_at = logical clock now"
          - "increments MaintenanceDispatch.version by 1"
        note: "Cascade A link 1 — links 2/3/4 are described on OutageEvent DISPATCHED -> RESOLVED, ChargingPort OUT_OF_SERVICE -> IN_SERVICE and Station SUSPENDED -> OPERATIONAL."
      - from: CREATED
        to: CANCELLED
        trigger: "system: Station DECOMMISSIONED teardown"
        actor: system
        preconditions:
          - "dispatch.state IN {CREATED, EN_ROUTE, ON_SITE, PARTS_HOLD}"
        side_effects:
          - "every PartReservation on this dispatch in state IN {RESERVED, BACKORDERED} moves to RELEASED"
          - "increments MaintenanceDispatch.version by 1"
      - from: PARTS_HOLD
        to: CANCELLED
        trigger: "system: Station DECOMMISSIONED teardown"
        actor: system
        preconditions:
          - "dispatch.state IN {CREATED, EN_ROUTE, ON_SITE, PARTS_HOLD}"
        side_effects:
          - "every PartReservation on this dispatch in state IN {RESERVED, BACKORDERED} moves to RELEASED, restoring SparePart.reserved_qty / backordered_qty / unencumbered_qty"
          - "increments MaintenanceDispatch.version by 1"
        note: "Cascade B link 3."

  # -------------------------------------------------- PartReservation.state
  - entity: PartReservation
    state_field: state
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: BACKORDERED
        trigger: "system: evaluated inside POST /part-reservations when qty > SparePart.unencumbered_qty"
        actor: system
        preconditions:
          - "qty > (spare_part.on_hand_qty - spare_part.reserved_qty) at creation time"
        side_effects:
          - "adds qty to SparePart.backordered_qty instead of SparePart.reserved_qty"
          - "sets PartReservation.expected_available_at = logical clock now + spare_part.lead_time_days days"
        note: "Resolved during creation of the row; the response already reports state BACKORDERED."
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /part-reservations/{reservation_id}/disposition {action: CONSUME} or system on dispatch completion"
        actor: FieldTechnician
        preconditions:
          - "reservation.state == RESERVED"
          - "the reservation's MaintenanceDispatch.state IN {ON_SITE, PARTS_HOLD}"
        side_effects:
          - "decrements SparePart.on_hand_qty and SparePart.reserved_qty by qty; raises SparePart.consumed_qty_lifetime by qty; SparePart.unencumbered_qty is unchanged"
          - "increments SparePart.version by 1"
          - "increments PartReservation.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /part-reservations/{reservation_id}/disposition {action: RELEASE} or system on dispatch cancellation"
        actor: NetworkOperator
        preconditions:
          - "reservation.state IN {RESERVED, BACKORDERED}"
        side_effects:
          - "decrements SparePart.reserved_qty by qty, restoring SparePart.unencumbered_qty to its pre-reservation value"
          - "increments SparePart.version by 1"
          - "increments PartReservation.version by 1"
        note: "Compensating action of the reserve/release inventory invariant."
      - from: BACKORDERED
        to: RELEASED
        trigger: "POST /part-reservations/{reservation_id}/disposition {action: RELEASE} or system on dispatch cancellation"
        actor: NetworkOperator
        preconditions:
          - "reservation.state IN {RESERVED, BACKORDERED}"
        side_effects:
          - "decrements SparePart.backordered_qty by qty; clears expected_available_at"
          - "increments SparePart.version by 1"
          - "increments PartReservation.version by 1"
      - from: BACKORDERED
        to: RESERVED
        trigger: "system: POST /spare-parts/{spare_part_id}/restock raised unencumbered_qty enough to cover this reservation"
        actor: system
        preconditions:
          - "reservation.state == BACKORDERED"
          - "after restock, qty <= (spare_part.on_hand_qty - spare_part.reserved_qty)"
        side_effects:
          - "moves qty from SparePart.backordered_qty to SparePart.reserved_qty; clears expected_available_at"
          - "increments SparePart.version by 1"
          - "increments PartReservation.version by 1"
        note: "Backordered reservations are promoted in ascending created_at order until the restocked stock is exhausted."

  # ------------------------------------- UptimeReport.state (return cycle)
  - entity: UptimeReport
    state_field: state
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: PROVISIONAL
        trigger: "POST /uptime-reports/{uptime_report_id}/compute-provisional"
        actor: NetworkOperator
        preconditions:
          - "report.state == DRAFT"
          - "the report's Station.status IN {OPERATIONAL, SUSPENDED}"
          - "total_port_minutes > 0 (else ERR_NO_REPORTABLE_PORT_MINUTES)"
        side_effects:
          - "writes eligible_port_count, total_port_minutes, excluded_minutes, billable_downtime_minutes and uptime_pct using the PROVISIONAL variant of calculations.station_uptime_percentage"
          - "sets methodology = PROVISIONAL"
          - "increments UptimeReport.version by 1"
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /uptime-reports/{uptime_report_id}/finalize"
        actor: ComplianceAuditor
        preconditions:
          - "report.state == PROVISIONAL"
          - "no OutageEvent overlapping the period on the report's ports is in state EXCLUSION_REVIEW (else ERR_EXCLUSION_REVIEW_PENDING)"
          - "(total_port_minutes - excluded_minutes) > 0 (else ERR_NO_REPORTABLE_PORT_MINUTES)"
        side_effects:
          - "recomputes uptime_pct with the FINAL variant of calculations.station_uptime_percentage (excluded minutes leave both numerator and denominator)"
          - "sets methodology = FINAL and finalized_by_user_id = X-User-ID"
          - "increments UptimeReport.version by 1"
      - from: PROVISIONAL
        to: DRAFT
        trigger: "system: an OutageEvent on this station was approved for exclusion or had its exclusion revoked"
        actor: system
        preconditions:
          - "report.state == PROVISIONAL"
        side_effects:
          - "resets methodology, eligible_port_count, total_port_minutes, excluded_minutes, billable_downtime_minutes and uptime_pct to null"
          - "increments UptimeReport.version by 1"
      - from: FINAL
        to: SUBMITTED
        trigger: "POST /uptime-reports/{uptime_report_id}/submit"
        actor: NetworkOperator
        preconditions:
          - "report.state == FINAL"
        side_effects:
          - "increments UptimeReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /uptime-reports/{uptime_report_id}/program-review {outcome: ACCEPT}"
        actor: ProgramAdministrator
        preconditions:
          - "report.state == SUBMITTED"
        side_effects:
          - "increments UptimeReport.version by 1"
      - from: SUBMITTED
        to: PROVISIONAL
        trigger: "POST /uptime-reports/{uptime_report_id}/program-review {outcome: RETURN}"
        actor: ProgramAdministrator
        preconditions:
          - "report.state == SUBMITTED"
        side_effects:
          - "increments returned_count by 1"
          - "sets finalized_by_user_id = null"
          - "increments UptimeReport.version by 1"
        note: "Closes the PROVISIONAL -> FINAL -> SUBMITTED -> PROVISIONAL cycle."

  # ------------------------------- ReimbursementClaim.state (branch + cycle)
  - entity: ReimbursementClaim
    state_field: state
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: REVIEW
        trigger: "POST /reimbursement-claims/{claim_id}/review"
        actor: ProgramAdministrator
        preconditions:
          - "claim.state IN {PENDING, WITHHELD}"
          - "the claim's UptimeReport.state == ACCEPTED (else ERR_UPTIME_REPORT_NOT_ACCEPTED)"
        side_effects:
          - "snapshots effective_uptime_pct and withhold_rate per calculations.reimbursement_payable_amount step 1-3"
          - "increments ReimbursementClaim.version by 1"
      - from: REVIEW
        to: APPROVED
        trigger: "POST /reimbursement-claims/{claim_id}/decision {decision: APPROVE}"
        actor: ProgramAdministrator
        preconditions:
          - "claim.state == REVIEW"
          - "X-User-ID != the claim's UptimeReport.finalized_by_user_id (SoD-2)"
          - "claim.withhold_rate == 0.00 (i.e. effective_uptime_pct >= 97.00), else ERR_UPTIME_BELOW_APPROVAL_THRESHOLD"
        side_effects:
          - "sets withheld_amount_cents = 0 and approved_amount_cents = requested_amount_cents"
          - "sets decided_by_user_id = X-User-ID"
          - "increments ReimbursementClaim.version by 1"
      - from: REVIEW
        to: WITHHELD
        trigger: "POST /reimbursement-claims/{claim_id}/decision {decision: WITHHOLD}"
        actor: ProgramAdministrator
        preconditions:
          - "claim.state == REVIEW"
          - "X-User-ID != the claim's UptimeReport.finalized_by_user_id (SoD-2)"
          - "0.00 < claim.withhold_rate < 1.00, else ERR_WITHHOLD_RATE_MISMATCH"
        side_effects:
          - "writes withheld_amount_cents and approved_amount_cents per calculations.reimbursement_payable_amount step 4-5"
          - "sets decided_by_user_id = X-User-ID"
          - "increments ReimbursementClaim.version by 1"
      - from: REVIEW
        to: DENIED
        trigger: "POST /reimbursement-claims/{claim_id}/decision {decision: DENY}"
        actor: ProgramAdministrator
        preconditions:
          - "claim.state == REVIEW"
          - "X-User-ID != the claim's UptimeReport.finalized_by_user_id (SoD-2)"
          - "claim.withhold_rate == 1.00, else ERR_WITHHOLD_RATE_MISMATCH"
        side_effects:
          - "sets withheld_amount_cents = requested_amount_cents and approved_amount_cents = 0"
          - "sets decided_by_user_id = X-User-ID"
          - "increments ReimbursementClaim.version by 1"
      - from: WITHHELD
        to: REVIEW
        trigger: "POST /reimbursement-claims/{claim_id}/remediation"
        actor: NetworkOperator
        preconditions:
          - "claim.state == WITHHELD"
        side_effects:
          - "sets remediation_credit_pp to the payload value, then re-snapshots effective_uptime_pct and withhold_rate"
          - "increments ReimbursementClaim.version by 1"
        note: "Closes the REVIEW -> WITHHELD -> REVIEW cycle; the credit snapshot pin is what makes calculations.reimbursement_payable_amount well-defined."
      - from: PENDING
        to: SUPERSEDED
        trigger: "system: POST /reimbursement-claims created a newer claim against the same UptimeReport"
        actor: system
        preconditions:
          - "claim.state == PENDING"
        side_effects:
          - "increments ReimbursementClaim.version by 1"

  # ----------------------------- CustomerComplaint.state (parallel dim 1)
  - entity: CustomerComplaint
    state_field: state
    initial_state: INTAKE
    terminal_states: [CLOSED, DISMISSED]
    transitions:
      - from: INTAKE
        to: TRIAGED
        trigger: "POST /customer-complaints/{complaint_id}/triage {disposition: LINK_OUTAGE}"
        actor: CustomerSupportAgent
        preconditions:
          - "complaint.state == INTAKE"
          - "the payload's linked_outage_event_id names an OutageEvent whose port_id == complaint.port_id (else ERR_COMPLAINT_OUTAGE_MISMATCH)"
        side_effects:
          - "sets linked_outage_event_id"
          - "increments CustomerComplaint.version by 1"
      - from: INTAKE
        to: DISMISSED
        trigger: "POST /customer-complaints/{complaint_id}/triage {disposition: NO_FAULT}"
        actor: CustomerSupportAgent
        preconditions:
          - "complaint.state == INTAKE"
          - "complaint.refund_state == NONE"
        side_effects:
          - "increments CustomerComplaint.version by 1"
      - from: TRIAGED
        to: CLOSED
        trigger: "POST /customer-complaints/{complaint_id}/close"
        actor: CustomerSupportAgent
        preconditions:
          - "complaint.state == TRIAGED"
          - "complaint.refund_state IN {NONE, DENIED, SETTLED, REVERSED} (else ERR_REFUND_IN_FLIGHT)"
        side_effects:
          - "increments CustomerComplaint.version by 1"

  # -------------------- CustomerComplaint.refund_state (parallel dim 2)
  - entity: CustomerComplaint
    state_field: refund_state
    initial_state: NONE
    terminal_states: [DENIED, REVERSED]
    transitions:
      - from: NONE
        to: REQUESTED
        trigger: "POST /customer-complaints/{complaint_id}/refund-requests"
        actor: CustomerSupportAgent
        preconditions:
          - "complaint.refund_state == NONE"
          - "complaint.state == TRIAGED (cross-dimension guard)"
          - "when refund_basis == FULL_SESSION_GOODWILL, the linked OutageEvent.fault_class == CRITICAL and its downtime window overlaps the session, else ERR_REFUND_BASIS_NOT_ELIGIBLE"
        side_effects:
          - "writes refund_basis, refund_amount_cents and retained_amount_cents per calculations.session_refund_amount"
          - "sets refund_requested_by_user_id = X-User-ID"
          - "increments CustomerComplaint.version by 1"
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /customer-complaints/{complaint_id}/refund-decisions {decision: APPROVE}"
        actor: ComplianceAuditor
        preconditions:
          - "complaint.refund_state == REQUESTED"
          - "refund_amount_cents <= session_charged_cents (else ERR_REFUND_EXCEEDS_SESSION_CHARGE)"
        side_effects:
          - "increments CustomerComplaint.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /customer-complaints/{complaint_id}/refund-decisions {decision: DENY}"
        actor: ComplianceAuditor
        preconditions:
          - "complaint.refund_state == REQUESTED"
        side_effects:
          - "sets refund_amount_cents = 0 and retained_amount_cents = session_charged_cents"
          - "increments CustomerComplaint.version by 1"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /customer-complaints/{complaint_id}/refund-ledger-actions {action: SETTLE}"
        actor: CustomerSupportAgent
        preconditions:
          - "complaint.refund_state == APPROVED"
        side_effects:
          - "sets refund_settled_at = logical clock now"
          - "raises Station.refund_liability_cents by refund_amount_cents"
          - "increments CustomerComplaint.version by 1"
      - from: SETTLED
        to: REVERSED
        trigger: "POST /customer-complaints/{complaint_id}/refund-ledger-actions {action: REVERSE}"
        actor: ComplianceAuditor
        preconditions:
          - "complaint.refund_state == SETTLED"
        side_effects:
          - "sets refund_settled_at = null"
          - "lowers Station.refund_liability_cents by refund_amount_cents, restoring its pre-settlement value"
          - "sets refund_amount_cents = 0 and retained_amount_cents = session_charged_cents"
          - "increments CustomerComplaint.version by 1"
        note: "Compensating action of the session-money invariant: refund_amount_cents + retained_amount_cents == session_charged_cents at every point in the chain."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: claim-create-stale-uptime-report
    parent_entity: UptimeReport
    write_endpoint: "POST /reimbursement-claims"
    occ_field: "expected_uptime_report_version"
    description: |
      Creating a ReimbursementClaim against an UptimeReport whose version has
      advanced since the client last observed it is rejected. Claim creation is
      a supersede pattern: a newly created claim drives any existing PENDING
      claim on the same report to SUPERSEDED and bumps the report's
      claim_count, so a writer holding a stale view of the report would
      unknowingly discard a claim it never saw.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

  - rule_id: reservation-create-stale-spare-part
    parent_entity: SparePart
    write_endpoint: "POST /part-reservations"
    occ_field: "expected_spare_part_version"
    description: |
      Creating a PartReservation against a SparePart whose version has advanced
      since the client last observed it is rejected. Reservation creation
      legitimately succeeds any number of times against the same part, so the
      state machine alone cannot detect that the depot balance the writer
      reasoned about (unencumbered_qty) has already moved; OCC on
      SparePart.version reduces that to a stale-version check.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ------------------------------------------------- DUAL VARIANT #1 (minutes)
  - name: station_uptime_percentage
    trigger: "POST /uptime-reports/{uptime_report_id}/compute-provisional (PROVISIONAL variant) and POST /uptime-reports/{uptime_report_id}/finalize (FINAL variant)"
    algorithm: aggregation
    formula: |
      # ---- denominator population (order-insensitive sum) -------------------
      period_minutes   = floor((report.period_end - report.period_start) / 60s)
      eligible_ports   = ChargingPort rows where
                            station_id == report.station_id
                        AND created_at <= report.period_start
                        AND service_state IN {IN_SERVICE, OUT_OF_SERVICE}
      eligible_port_count = count(eligible_ports)
      total_port_minutes  = eligible_port_count * period_minutes          # = T

      # ---- downtime attribution -------------------------------------------
      attributed = OutageEvent rows where
                            port_id IN eligible_ports
                        AND detected_at <  report.period_end
                        AND (cleared_at IS NULL OR cleared_at > report.period_start)

      def overlap_minutes(o):
          ov_start = max(o.detected_at, report.period_start)
          ov_end   = min(o.cleared_at IF o.cleared_at IS NOT NULL ELSE report.period_end,
                         report.period_end)
          return max(0, floor((ov_end - ov_start) / 60s))

      excluded_minutes           = SUM(overlap_minutes(o) for o in attributed
                                       if o.state == EXCLUDED)                 # = E
      billable_downtime_minutes  = SUM(overlap_minutes(o) for o in attributed
                                       if o.state IN {DETECTED, CLASSIFIED, DISPATCHED,
                                                      RESOLVED, VERIFIED,
                                                      EXCLUSION_REVIEW})        # = D

      # ---- the two variants diverge only in the denominator ----------------
      IF variant == PROVISIONAL:
          uptime_pct = round_half_up(100 * (T - E - D) / T,        2)
      IF variant == FINAL:
          uptime_pct = round_half_up(100 * (T - E - D) / (T - E),  2)
    input_set: |
      Ports: only ports that already existed at period_start and are not RETIRED enter T.
      A port created after period_start, or already RETIRED, contributes zero port-minutes
      and its outages are dropped from `attributed` as well.
      Outages: every state is attributed; EXCLUDED minutes land in E, all other states land
      in D. Overlap is clipped to the period on both ends; an uncleared outage is charged
      through period_end.
    constants:
      MIN_REPORTING_PERIOD_MINUTES: 10080
      UPTIME_PCT_MAX: 100.00
    precision: "uptime_pct: 2 decimal places, round_half_up; all minute figures are whole minutes via floor"
    variants:
      - name: PROVISIONAL
        when: "POST /uptime-reports/{id}/compute-provisional (DRAFT -> PROVISIONAL); methodology = PROVISIONAL"
        difference: "Excluded minutes are credited in the numerator only. The denominator stays at the full port-minute exposure T, so an operator with excluded outages reports a LOWER figure than the federal methodology yields."
      - name: FINAL
        when: "POST /uptime-reports/{id}/finalize (PROVISIONAL -> FINAL); methodology = FINAL"
        difference: "Excluded minutes leave BOTH numerator and denominator (T - E). With E > 0 and D > 0 the FINAL figure is strictly greater than the PROVISIONAL figure over identical rows. Guarded by ERR_NO_REPORTABLE_PORT_MINUTES when T - E == 0."

  # --------------------------------------------------- DUAL VARIANT #2 (money)
  - name: session_refund_amount
    trigger: "POST /customer-complaints/{complaint_id}/refund-requests (refund_state NONE -> REQUESTED)"
    algorithm: threshold
    formula: |
      energy_component_cents = round_half_up(complaint.session_energy_kwh
                                             * complaint.session_price_per_kwh_cents, 0)

      IF refund_basis == ENERGY_PRORATED:
          refund_amount_cents = max(0,
                                    complaint.session_charged_cents
                                    - energy_component_cents
                                    - complaint.session_idle_fee_cents)
      IF refund_basis == FULL_SESSION_GOODWILL:
          # eligibility gate, evaluated BEFORE the amount
          require complaint.linked_outage_event_id IS NOT NULL
          require linked_outage.fault_class == CRITICAL
          require downtime_window_overlaps_session(linked_outage, complaint)
                  # [linked_outage.detected_at, linked_outage.cleared_at OR +inf)
                  # intersects [complaint.session_started_at, complaint.session_ended_at)
                  # as half-open intervals; zero-length touch does NOT overlap
          else -> ERR_REFUND_BASIS_NOT_ELIGIBLE
          refund_amount_cents = complaint.session_charged_cents

      retained_amount_cents = complaint.session_charged_cents - refund_amount_cents
    input_set: "Only the complaint's own session fields plus the single OutageEvent named by linked_outage_event_id. No other complaint on the same port or station participates."
    constants:
      GOODWILL_REQUIRED_FAULT_CLASS: CRITICAL
    precision: "energy_component_cents: whole cents, round_half_up on the kWh x cents product; all other amounts are exact integers"
    variants:
      - name: ENERGY_PRORATED
        when: "refund_basis == ENERGY_PRORATED — the default remedy when a session over-billed relative to delivered energy"
        difference: "Refunds only the over-charge above delivered energy and never refunds the idle fee, so the driver keeps paying for energy actually received."
      - name: FULL_SESSION_GOODWILL
        when: "refund_basis == FULL_SESSION_GOODWILL — only when a CRITICAL fault overlapped the session"
        difference: "Refunds the entire session charge including the idle fee. Over identical complaint rows the two bases produce different refund_amount_cents whenever energy_component_cents + session_idle_fee_cents > 0."

  # ------------------------------- COMBINATORIAL MODE (a): nested min/max + branches
  - name: dispatch_response_deadline
    trigger: "POST /maintenance-dispatches (writes MaintenanceDispatch.response_deadline_at)"
    algorithm: threshold
    formula: |
      # four independent inputs interact non-linearly: fault severity, station
      # power class, corridor designation, and the host site's access window.
      base       = FAULT_BASE_MINUTES[outage.fault_class]
      scaled     = floor(base * POWER_CLASS_FACTOR[station.power_class])
      tightened  = scaled - (CORRIDOR_TIGHTEN_MINUTES IF station.corridor_designated ELSE 0)
      bounded    = min(REGULATORY_CAP_MINUTES,
                       max(REGULATORY_FLOOR_MINUTES, tightened))
      naive      = outage.detected_at + bounded minutes

      IF host_site.access_hours_mode == TWENTY_FOUR_SEVEN:
          response_deadline_at = naive
      ELSE:  # RESTRICTED — the deadline may not fall inside closed hours
          m = naive.hour * 60 + naive.minute          # minute-of-day, UTC
          IF host_site.access_open_minute <= m < host_site.access_close_minute:
              response_deadline_at = naive
          ELIF m < host_site.access_open_minute:
              response_deadline_at = same UTC date as naive at access_open_minute,
                                     seconds and milliseconds zeroed
          ELSE:  # m >= access_close_minute
              response_deadline_at = the next UTC date after naive at access_open_minute,
                                     seconds and milliseconds zeroed
    input_set: "The single OutageEvent named by outage_event_id, its ChargingPort's Station, and that Station's HostSite. Recomputed only at dispatch creation — later host-site access-hour edits do NOT move an existing deadline."
    constants:
      FAULT_BASE_MINUTES: { CRITICAL: 240, MAJOR: 720, MINOR: 2880, INFORMATIONAL: 10080 }
      POWER_CLASS_FACTOR: { DCFC_350: 0.50, DCFC_150: 0.75, L2_19: 1.00 }
      CORRIDOR_TIGHTEN_MINUTES: 60
      REGULATORY_FLOOR_MINUTES: 120
      REGULATORY_CAP_MINUTES: 4320
    precision: "whole minutes; `scaled` uses floor on the factor product; the access-window push zeroes seconds and milliseconds"

  # --------------- COMBINATORIAL MODE (b): per-line-item rounding order pinned
  - name: reimbursement_payable_amount
    trigger: "POST /reimbursement-claims/{claim_id}/review (steps 1-3) and POST /reimbursement-claims/{claim_id}/decision (steps 4-5)"
    algorithm: tiered_pricing
    formula: |
      # ---- step 1: credit snapshot (see the evaluation-order pin below) -----
      credit_pp = claim.remediation_credit_pp        # 0.00 unless a remediation was accepted
      # ---- step 2: effective uptime ----------------------------------------
      effective_uptime_pct = min(UPTIME_PCT_MAX,
                                 round_half_up(report.uptime_pct + credit_pp, 2))
      # ---- step 3: tier selection, evaluated top-down with `>=` ------------
      IF effective_uptime_pct >= 97.00: withhold_rate = 0.00
      ELIF effective_uptime_pct >= 95.00: withhold_rate = 0.10
      ELIF effective_uptime_pct >= 90.00: withhold_rate = 0.25
      ELSE:                               withhold_rate = 1.00
      # ---- step 4: PINNED ROUNDING ORDER ----------------------------------
      # round EACH line item's withhold to whole cents, THEN sum.
      # (sum-then-round is explicitly NOT the rule and yields a different cent
      #  total: e.g. items [1005, 1005, 1005] at 0.10 give 303 per-item vs 302
      #  sum-then-round.)
      withheld_amount_cents = SUM over claim.line_items, in the order supplied in the
                              request body, of round_half_up(item.amount_cents * withhold_rate, 0)
      # ---- step 5 ----------------------------------------------------------
      requested_amount_cents = SUM(item.amount_cents)          # exact integers
      approved_amount_cents  = requested_amount_cents - withheld_amount_cents
    input_set: |
      Only the claim's own line_items array and the uptime_pct of the single UptimeReport
      named by uptime_report_id (which is in state ACCEPTED by the time review runs).
      Other claims on the same report, including SUPERSEDED ones, contribute nothing.
    constants:
      WITHHOLD_TIERS: [[97.00, 0.00], [95.00, 0.10], [90.00, 0.25], [0.00, 1.00]]
      UPTIME_PCT_MAX: 100.00
    precision: "withheld_amount_cents: whole cents, round_half_up applied PER LINE ITEM before summation; effective_uptime_pct: 2 decimal places, round_half_up"

  # -------- COMBINATORIAL MODE (c): circular-looking dependency, order pinned
  - name: parts_hold_repair_promise
    trigger: "POST /maintenance-dispatches/{dispatch_id}/parts-hold (ON_SITE -> PARTS_HOLD)"
    algorithm: constraint_propagation
    formula: |
      held = PartReservation rows where dispatch_id == dispatch.id
                                   AND state IN {RESERVED, BACKORDERED}

      # STEP 1 — per-reservation wait contribution
      def wait_minutes(r):
          return r.spare_part.lead_time_days * 1440 IF r.state == BACKORDERED ELSE 0

      # STEP 2 — raw wait is the slowest blocking line
      parts_wait_minutes_raw = max(wait_minutes(r) for r in held)      # empty set -> 0

      # STEP 3 — labour is keyed on the most labour-intensive part class held
      labor_minutes = max(LABOR_MINUTES_BY_PART_CLASS[r.spare_part.part_class] for r in held)
                      # empty set -> LABOR_MINUTES_DEFAULT

      # STEP 4 — pre-expedite total
      hold_minutes_pre_expedite = parts_wait_minutes_raw + labor_minutes

      # STEP 5 — EVALUATION ORDER PIN. Expedite eligibility is decided ONCE, on the
      #          PRE-expedite total, with a strict `>`. It is NOT re-evaluated after
      #          step 6 even though the discounted total frequently falls back below
      #          EXPEDITE_TRIGGER_MINUTES (which would flip eligibility off and make
      #          the value undefined).
      expedite_eligible = hold_minutes_pre_expedite > EXPEDITE_TRIGGER_MINUTES

      # STEP 6 — apply the discount to the wait component only
      parts_wait_minutes_final = ceil(parts_wait_minutes_raw * EXPEDITE_FACTOR)
                                 IF expedite_eligible ELSE parts_wait_minutes_raw

      # STEP 7 / 8
      total_hold_minutes = parts_wait_minutes_final + labor_minutes
      promised_repair_at = logical_clock_now + total_hold_minutes minutes
    input_set: "Only PartReservation rows on this dispatch in state RESERVED or BACKORDERED, and the SparePart each of them points at. RELEASED and CONSUMED reservations are excluded, so a release between two parts-hold calls changes the promise."
    constants:
      LABOR_MINUTES_BY_PART_CLASS: { DISPENSER: 480, POWER_MODULE: 300, CABLE_ASSEMBLY: 180, PAYMENT_TERMINAL: 120 }
      LABOR_MINUTES_DEFAULT: 120
      EXPEDITE_TRIGGER_MINUTES: 2880
      EXPEDITE_FACTOR: 0.50
    precision: "whole minutes; ceil on the expedite product; promised_repair_at carries three fractional second digits like every other timestamp"

  # ---------------------------------------------- commissioning gate (weighted)
  - name: payment_interoperability_score
    trigger: "recomputed on POST /charging-ports, POST /charging-ports/{port_id}/terminal-certification, POST /charging-ports/{port_id}/retire, POST /stations/{station_id}/commission and on the Station DECOMMISSIONED teardown"
    algorithm: weighted_scoring
    formula: |
      scored = ChargingPort rows where station_id == station.id
                                   AND service_state IN {IN_SERVICE, OUT_OF_SERVICE}
      n = count(scored)
      IF n == 0: payment_interop_score = 0.00 AND STOP

      contactless_share = count(p in scored where p.contactless_enabled)        / n
      pnc_share         = count(p in scored where p.plug_and_charge_enabled)    / n
      display_share     = count(p in scored where p.price_display_verified)     / n
      roaming_share     = count(p in scored where p.terminal_certification_status == CERTIFIED
                                              AND p.roaming_ocpi_version IN {V2_2_1, V2_3_0}) / n

      # the four shares stay exact rationals; ONE rounding at the end
      payment_interop_score = round_half_up(100 * (W_CONTACTLESS * contactless_share
                                                 + W_PLUG_AND_CHARGE * pnc_share
                                                 + W_PRICE_DISPLAY * display_share
                                                 + W_ROAMING * roaming_share), 2)
    input_set: "Only the station's own non-RETIRED ports. RETIRED ports leave both numerator and denominator, so retiring a non-compliant port RAISES the score."
    constants:
      W_CONTACTLESS: 0.40
      W_PLUG_AND_CHARGE: 0.20
      W_PRICE_DISPLAY: 0.20
      W_ROAMING: 0.20
      COMMISSION_MIN_SCORE: 90.00
      ROAMING_COMPLIANT_VERSIONS: [V2_2_1, V2_3_0]
    precision: "2 decimal places, round_half_up, applied ONCE to the weighted sum; intermediate shares are never rounded"

  # --------------------------------------------- station downtime ledger split
  - name: station_downtime_ledger
    trigger: "recomputed whenever an OutageEvent on one of the station's ports sets or clears cleared_at, or enters/leaves state EXCLUDED"
    algorithm: aggregation
    formula: |
      ledger_set = OutageEvent rows where port_id IN (ChargingPort where station_id == station.id,
                                                      any service_state including RETIRED)
                                       AND cleared_at IS NOT NULL

      def closed_minutes(o):
          return floor((o.cleared_at - o.detected_at) / 60s)

      gross_downtime_minutes_lifetime    = SUM(closed_minutes(o) for o in ledger_set)
      excluded_downtime_minutes_lifetime = SUM(closed_minutes(o) for o in ledger_set
                                               if o.state == EXCLUDED)
      billable_downtime_minutes_lifetime = gross_downtime_minutes_lifetime
                                           - excluded_downtime_minutes_lifetime
    input_set: "Every outage on every port of the station, RETIRED ports included, restricted to outages that already have a cleared_at. Uncleared outages contribute 0 to all three figures."
    constants: {}
    precision: "whole minutes, floor on each outage's duration before summation"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty, and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id in the URL path resolves, validated left to right; then every FK id in the request body resolves in declaration order (host_site_id, station_id, port_id, outage_event_id, dispatch_id, spare_part_id, uptime_report_id, complaint_id, line_items[].port_id)"
    error_id: "ERR_HOST_SITE_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_PORT_NOT_FOUND | ERR_OUTAGE_NOT_FOUND | ERR_DISPATCH_NOT_FOUND | ERR_SPARE_PART_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_UPTIME_REPORT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: auth
    check: "a HostSiteManager may only act on the HostSite whose id equals X-User-ID"
    error_id: ERR_HOST_SITE_FORBIDDEN
    http_status: 403
    applies_to: "PATCH /host-sites/{host_site_id}"

  - priority: 5
    category: business_constraint
    check: "request body shape: every required field present, enums inside their declared value set, integers/numbers inside their declared range, line_items a non-empty array of well-formed objects, limit within 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 6
    category: business_constraint
    check: "uniqueness of natural keys: HostSite.site_code, Station.station_code, ChargingPort.dispenser_serial, SparePart.part_number"
    error_id: "ERR_SITE_CODE_DUPLICATE | ERR_STATION_CODE_DUPLICATE | ERR_DISPENSER_SERIAL_DUPLICATE | ERR_PART_NUMBER_DUPLICATE"
    http_status: 409
    applies_to: "POST /host-sites, POST /stations, POST /charging-ports, POST /spare-parts"

  - priority: 7
    category: business_constraint
    check: "the OCC field expected_<parent>_version equals the current version of the named parent entity"
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412
    applies_to: "POST /reimbursement-claims, POST /part-reservations"

  - priority: 8
    category: state
    check: "the target entity is in a state from which the requested transition exists in §1.2 (including the parallel-dimension guard that a refund request requires complaint.state == TRIAGED, and the exclusion-action / progress-event / disposition-action sub-selectors)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 9
    category: state
    check: "the target entity is not already in a terminal state for the dimension being changed"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /stations/{station_id}/status-transitions, POST /charging-ports/{port_id}/retire, POST /reimbursement-claims/{claim_id}/review, POST /customer-complaints/{complaint_id}/close"

  - priority: 10
    category: business_safety
    check: "segregation of duties: SoD-1 the verifier of a resolution is not the operator who created the dispatch (X-User-ID != outage.dispatch_created_by_user_id); SoD-2 the decider of a claim is not the auditor who finalized the report (X-User-ID != report.finalized_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /outage-events/{outage_event_id}/resolution-reviews, POST /reimbursement-claims/{claim_id}/decision"

  - priority: 11
    category: business_safety
    check: "the assigned technician's certification rank covers the station's power class: TECH_CERT_RANK[technician_certification_class] >= REQUIRED_CERT_RANK[station.power_class] where TECH_CERT_RANK = {L2:1, DCFC_BASIC:2, DCFC_HV:3} and REQUIRED_CERT_RANK = {L2_19:1, DCFC_150:2, DCFC_350:3}"
    error_id: ERR_TECHNICIAN_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /maintenance-dispatches"

  - priority: 12
    category: business_safety
    check: "a FieldTechnician may only post progress, parts-hold, complete or CONSUME disposition for a dispatch whose technician_user_id equals X-User-ID"
    error_id: ERR_NOT_ASSIGNED_TECHNICIAN
    http_status: 403
    applies_to: "POST /maintenance-dispatches/{dispatch_id}/progress, POST /maintenance-dispatches/{dispatch_id}/parts-hold, POST /maintenance-dispatches/{dispatch_id}/complete, POST /part-reservations/{reservation_id}/disposition"

  - priority: 13
    category: business_referential
    check: "cross-entity ownership: MaintenanceDispatch.port_id == the outage's port_id; every line_items[].port_id belongs to the report's station; CustomerComplaint.port_id belongs to CustomerComplaint.station_id; the triage linked_outage_event_id's port_id equals the complaint's port_id"
    error_id: "ERR_OUTAGE_PORT_MISMATCH | ERR_CLAIM_LINE_PORT_MISMATCH | ERR_COMPLAINT_PORT_MISMATCH | ERR_COMPLAINT_OUTAGE_MISMATCH"
    http_status: 409
    applies_to: "POST /maintenance-dispatches, POST /reimbursement-claims, POST /customer-complaints, POST /customer-complaints/{complaint_id}/triage"

  - priority: 14
    category: business_temporal
    check: "interval well-formedness: OutageEvent.detected_at <= clock now and >= port.created_at; MaintenanceDispatch.window_end_at > window_start_at and window_start_at >= outage.detected_at; UptimeReport.period_end > period_start with span >= 10080 minutes and period_end <= clock now; CustomerComplaint.session_ended_at > session_started_at"
    error_id: "ERR_DETECTED_AT_IN_FUTURE | ERR_DETECTED_AT_BEFORE_PORT | ERR_DISPATCH_WINDOW_INVALID | ERR_REPORTING_PERIOD_INVALID | ERR_REPORTING_PERIOD_NOT_ELAPSED | ERR_SESSION_WINDOW_INVALID"
    http_status: 422
    applies_to: "POST /outage-events, POST /maintenance-dispatches, POST /uptime-reports, POST /customer-complaints"

  - priority: 15
    category: business_temporal
    check: "HALF-OPEN overlap on ChargingPort: the new dispatch's [window_start_at, window_end_at) must not intersect the window of any dispatch on the same port_id in state IN {CREATED, EN_ROUTE, ON_SITE, PARTS_HOLD}. Endpoint-touching windows (new.window_start_at == existing.window_end_at, or new.window_end_at == existing.window_start_at) are ALLOWED"
    error_id: ERR_DISPATCH_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /maintenance-dispatches"

  - priority: 16
    category: business_temporal
    check: "CLOSED-CLOSED overlap on Station: the new report's [period_start, period_end] must not intersect the period of any existing UptimeReport on the same station_id in any state. Because both endpoints are inclusive, an ADJACENT period (new.period_start == existing.period_end, or new.period_end == existing.period_start) IS an overlap and is rejected"
    error_id: ERR_REPORTING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /uptime-reports"

  - priority: 17
    category: business_constraint
    check: "host site access window well-formedness: access_open_minute < access_close_minute whenever access_hours_mode == RESTRICTED"
    error_id: ERR_INVALID_ACCESS_WINDOW
    http_status: 422
    applies_to: "POST /host-sites, PATCH /host-sites/{host_site_id}"

  - priority: 18
    category: business_constraint
    check: "commissioning gates evaluated in this order: host agreement EXECUTED; power upgrade IN {NOT_REQUIRED, ENERGIZED}; parking enforcement IN {SIGNAGE_ONLY, TOWING_ENFORCED}; commissioned_port_count >= declared_port_count; installed_power_kw <= host_site.committed_service_capacity_kw"
    error_id: "ERR_HOST_AGREEMENT_NOT_EXECUTED | ERR_POWER_UPGRADE_NOT_ENERGIZED | ERR_PARKING_ENFORCEMENT_REQUIRED | ERR_PORT_COUNT_BELOW_DECLARED | ERR_SITE_CAPACITY_EXCEEDED"
    http_status: 422
    applies_to: "POST /stations/{station_id}/commission"

  - priority: 19
    category: business_constraint
    check: "station.payment_interop_score >= 90.00 (inclusive boundary)"
    error_id: ERR_INTEROP_SCORE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /stations/{station_id}/commission"

  - priority: 20
    category: business_constraint
    check: "exclusion eligibility: excluded_cause_claim != NONE at REQUEST time; on APPROVE / REJECT / REVOKE the pre_exclusion_state must be set"
    error_id: ERR_EXCLUSION_CAUSE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /outage-events/{outage_event_id}/exclusion-actions"

  - priority: 21
    category: business_constraint
    check: "cross-entity state dependency: a ReimbursementClaim may enter REVIEW only while its UptimeReport.state == ACCEPTED; a MaintenanceDispatch may leave CREATED only while its Station.status IN {OPERATIONAL, SUSPENDED}; an OutageEvent may be classified, reopened or exclusion-requested only while its ChargingPort.service_state != RETIRED"
    error_id: "ERR_UPTIME_REPORT_NOT_ACCEPTED | ERR_STATION_NOT_SERVICEABLE | ERR_PORT_RETIRED"
    http_status: 409
    applies_to: "POST /reimbursement-claims/{claim_id}/review, POST /maintenance-dispatches/{dispatch_id}/progress, POST /outage-events/{outage_event_id}/classify, POST /outage-events/{outage_event_id}/resolution-reviews, POST /outage-events/{outage_event_id}/exclusion-actions"

  - priority: 22
    category: business_constraint
    check: "no OutageEvent attributed to the report's period is in state EXCLUSION_REVIEW when the report is finalized"
    error_id: ERR_EXCLUSION_REVIEW_PENDING
    http_status: 409
    applies_to: "POST /uptime-reports/{uptime_report_id}/finalize"

  - priority: 23
    category: business_constraint
    check: "the reporting denominator is non-zero: total_port_minutes > 0 on compute-provisional, and (total_port_minutes - excluded_minutes) > 0 on finalize"
    error_id: ERR_NO_REPORTABLE_PORT_MINUTES
    http_status: 422
    applies_to: "POST /uptime-reports/{uptime_report_id}/compute-provisional, POST /uptime-reports/{uptime_report_id}/finalize"

  - priority: 24
    category: business_constraint
    check: "refund basis eligibility: FULL_SESSION_GOODWILL requires a linked OutageEvent with fault_class == CRITICAL whose downtime window half-open-overlaps the session window"
    error_id: ERR_REFUND_BASIS_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /customer-complaints/{complaint_id}/refund-requests"

  - priority: 25
    category: business_constraint
    check: "a complaint may not be closed while its refund dimension is still in flight (refund_state IN {REQUESTED, APPROVED})"
    error_id: ERR_REFUND_IN_FLIGHT
    http_status: 409
    applies_to: "POST /customer-complaints/{complaint_id}/close"

  - priority: 26
    category: business_fiscal
    check: "PartReservation.qty >= 1 and, on RELEASE, the reservation is still encumbering stock"
    error_id: ERR_RESERVATION_QTY_INVALID
    http_status: 422
    applies_to: "POST /part-reservations, POST /part-reservations/{reservation_id}/disposition"

  - priority: 27
    category: business_fiscal
    check: "claim line items are present and the withhold tier matches the requested decision: APPROVE requires withhold_rate == 0.00, WITHHOLD requires 0.00 < withhold_rate < 1.00, DENY requires withhold_rate == 1.00"
    error_id: "ERR_CLAIM_LINE_ITEMS_EMPTY | ERR_UPTIME_BELOW_APPROVAL_THRESHOLD | ERR_WITHHOLD_RATE_MISMATCH"
    http_status: 422
    applies_to: "POST /reimbursement-claims, POST /reimbursement-claims/{claim_id}/decision"

  - priority: 28
    category: business_fiscal
    check: "refund_amount_cents <= session_charged_cents at approval time, and session_charged_cents >= session_idle_fee_cents at intake"
    error_id: "ERR_REFUND_EXCEEDS_SESSION_CHARGE | ERR_SESSION_CHARGE_INVALID"
    http_status: 422
    applies_to: "POST /customer-complaints, POST /customer-complaints/{complaint_id}/refund-decisions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------- test-driving: logical clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint (§1.5 ladder step 3). Sets the server's logical clock, which every `logical clock now` reference in §1.2/§1.3 reads and which also stamps every entity's `created_at` / `updated_at` (this is what makes ChargingPort eligibility in calculations.station_uptime_percentage deterministic). The server's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time. Response data is the inline object { current_utc: datetime }."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "all subsequent `logical clock now` reads return current_utc"

  # ------------------------------------------------------------------ HostSite
  - method: POST
    path: "/host-sites"
    description: "Register a host site (property owner agreement container)."
    roles: [NetworkOperator]
    code: 201
    input: [site_code, host_org_name, committed_service_capacity_kw, "agreement_status?", "power_upgrade_status?", "access_hours_mode?", "access_open_minute?", "access_close_minute?", "parking_enforcement_mode?"]
    output: HostSite
    side_effects:
      - "validates access window well-formedness (ERR_INVALID_ACCESS_WINDOW)"
      - "site_code uniqueness (ERR_SITE_CODE_DUPLICATE)"

  - method: GET
    path: "/host-sites"
    description: "List host sites, paginated."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: ["agreement_status?", "limit?", "offset?"]
    output: HostSite[]
    side_effects: []

  - method: GET
    path: "/host-sites/{host_site_id}"
    description: "Fetch one host site."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: []
    output: HostSite
    side_effects: []

  - method: GET
    path: "/host-sites/{id}/stations"
    description: "FK reverse-reachability for Station.host_site_id — stations installed at this host site."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Station[]
    side_effects: []

  - method: PATCH
    path: "/host-sites/{host_site_id}"
    description: "Amend the host site agreement: execution status, power-upgrade progress, access hours, parking enforcement, committed capacity. HostSiteManager may only amend the site whose id equals X-User-ID."
    roles: [NetworkOperator, HostSiteManager]
    code: 200
    input: ["agreement_status?", "power_upgrade_status?", "access_hours_mode?", "access_open_minute?", "access_close_minute?", "parking_enforcement_mode?", "committed_service_capacity_kw?"]
    output: HostSite
    side_effects:
      - "validates access window well-formedness (ERR_INVALID_ACCESS_WINDOW)"
      - "ownership check for HostSiteManager (ERR_HOST_SITE_FORBIDDEN)"
      - "increments HostSite.version by 1"
    note: "Does NOT retroactively move any already-computed MaintenanceDispatch.response_deadline_at."

  # ------------------------------------------------------------------- Station
  - method: POST
    path: "/stations"
    description: "Create a station in DRAFT at a host site."
    roles: [NetworkOperator]
    code: 201
    input: [host_site_id, station_code, power_class, declared_port_count, "corridor_designated?"]
    output: Station
    side_effects:
      - "station_code uniqueness (ERR_STATION_CODE_DUPLICATE)"
      - "increments HostSite.station_count"

  - method: GET
    path: "/stations/{station_id}"
    description: "Fetch one station including its computed counters, interoperability score and downtime ledger."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: GET
    path: "/stations/{id}/charging-ports"
    description: "FK reverse-reachability for ChargingPort.station_id — ports belonging to this station."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: ["service_state?", "maintenance_state?", "limit?", "offset?"]
    output: ChargingPort[]
    side_effects: []

  - method: GET
    path: "/stations/{id}/uptime-reports"
    description: "FK reverse-reachability for UptimeReport.station_id — reporting periods declared for this station."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: UptimeReport[]
    side_effects: []

  - method: POST
    path: "/stations/{station_id}/status-transitions"
    description: "Operator-driven station lifecycle move. target_status is one of {COMMISSIONING, DRAFT, SUSPENDED, OPERATIONAL, DECOMMISSIONED}; ComplianceAuditor may only send DRAFT (the audit-failure revert leg)."
    roles: [NetworkOperator, ComplianceAuditor]
    code: 200
    input: [target_status]
    output: Station
    side_effects:
      - "DRAFT -> COMMISSIONING requires commissioned_port_count >= 1"
      - "SUSPENDED sets suspension_source = MANUAL; OPERATIONAL requires out_of_service_port_count == 0 and clears suspension_source"
      - "DECOMMISSIONED runs cascade B: retire ports -> exclude their open outages -> cancel dispatches and release part reservations; decrements HostSite.station_count"
      - "increments Station.version by 1"

  - method: POST
    path: "/stations/{station_id}/commission"
    description: "Commission the station into service. Runs the full commissioning gate ladder (host agreement, power upgrade, parking enforcement, port count, site capacity, then interoperability score >= 90.00)."
    roles: [NetworkOperator]
    code: 200
    input: []
    output: Station
    side_effects:
      - "recomputes payment_interop_score via calculations.payment_interoperability_score before the gate is evaluated"
      - "COMMISSIONING -> OPERATIONAL; sets commissioned_at = logical clock now, suspension_source = NONE"
      - "increments Station.version by 1"

  # -------------------------------------------------------------- ChargingPort
  - method: POST
    path: "/charging-ports"
    description: "Install a dispenser/connector on a station. Connector type, rated power and payment-interoperability attributes are declared here."
    roles: [NetworkOperator]
    code: 201
    input: [station_id, connector_type, rated_power_kw, dispenser_serial, terminal_model, "contactless_enabled?", "plug_and_charge_enabled?", "price_display_verified?", "roaming_ocpi_version?"]
    output: ChargingPort
    side_effects:
      - "dispenser_serial uniqueness (ERR_DISPENSER_SERIAL_DUPLICATE)"
      - "recomputes Station.commissioned_port_count, installed_power_kw and payment_interop_score"

  - method: GET
    path: "/charging-ports/{port_id}"
    description: "Fetch one charging port with both of its parallel state dimensions."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: []
    output: ChargingPort
    side_effects: []

  - method: GET
    path: "/charging-ports/{id}/outage-events"
    description: "FK reverse-reachability for OutageEvent.port_id — includes system-generated outages that no creation response ever returned."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: ["state?", "fault_class?", "limit?", "offset?"]
    output: OutageEvent[]
    side_effects: []

  - method: PATCH
    path: "/charging-ports/{port_id}"
    description: "Amend a port's payment-interoperability attributes (contactless, plug-and-charge, price display verification, OCPI roaming version)."
    roles: [NetworkOperator]
    code: 200
    input: ["contactless_enabled?", "plug_and_charge_enabled?", "price_display_verified?", "roaming_ocpi_version?"]
    output: ChargingPort
    side_effects:
      - "recomputes Station.payment_interop_score"
      - "increments ChargingPort.version by 1"

  - method: POST
    path: "/charging-ports/{port_id}/terminal-certification"
    description: "Record the payment-terminal certification outcome. certification_status is CERTIFIED or REVOKED."
    roles: [ComplianceAuditor]
    code: 200
    input: [certification_status]
    output: ChargingPort
    side_effects:
      - "recomputes Station.payment_interop_score"
      - "REVOKED on an IN_SERVICE port drives service_state IN_SERVICE -> OUT_OF_SERVICE, creates a system OutageEvent (is_system_generated = true, fault_class MAJOR, fault_code TERMINAL_CERT_REVOKED, detected_at = logical clock now) and may drive Station OPERATIONAL -> SUSPENDED with suspension_source = AUTOMATIC"
      - "increments ChargingPort.version by 1"

  - method: POST
    path: "/charging-ports/{port_id}/retire"
    description: "Permanently retire a dispenser (terminal for the service_state dimension)."
    roles: [NetworkOperator]
    code: 200
    input: []
    output: ChargingPort
    side_effects:
      - "sets retired_at = logical clock now"
      - "recomputes Station.commissioned_port_count, out_of_service_port_count, installed_power_kw and payment_interop_score (retiring a non-compliant port RAISES the score)"
      - "increments ChargingPort.version by 1"

  # --------------------------------------------------------------- OutageEvent
  - method: POST
    path: "/outage-events"
    description: "Remote-monitoring fault ingestion. Creates an OutageEvent in DETECTED on a port."
    roles: [NetworkOperator]
    code: 201
    input: [port_id, fault_code, fault_class, detected_at, "excluded_cause_claim?"]
    output: OutageEvent
    side_effects:
      - "detected_at must be <= logical clock now and >= port.created_at"
      - "fault_class IN {CRITICAL, MAJOR} drives ChargingPort IN_SERVICE -> OUT_OF_SERVICE, which may drive Station OPERATIONAL -> SUSPENDED (suspension_source = AUTOMATIC)"

  - method: GET
    path: "/outage-events/{outage_event_id}"
    description: "Fetch one outage event with its exclusion bookkeeping fields."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: []
    output: OutageEvent
    side_effects: []

  - method: POST
    path: "/outage-events/{outage_event_id}/classify"
    description: "Fault classification: overwrite fault_class (and optionally the excluded-cause claim) after triage. DETECTED -> CLASSIFIED."
    roles: [NetworkOperator]
    code: 200
    input: [fault_class, "excluded_cause_claim?"]
    output: OutageEvent
    side_effects:
      - "escalating to CRITICAL or MAJOR drives the port OUT_OF_SERVICE and may suspend the station"
      - "increments OutageEvent.version by 1"

  - method: POST
    path: "/outage-events/{outage_event_id}/exclusion-actions"
    description: "Uptime-exclusion workflow. action is one of {REQUEST, APPROVE, REJECT, REVOKE}; REQUEST is operator-side, APPROVE/REJECT/REVOKE are auditor-side. excluded_cause_claim may be supplied on REQUEST."
    roles: [NetworkOperator, ComplianceAuditor]
    code: 200
    input: [action, "excluded_cause_claim?"]
    output: OutageEvent
    side_effects:
      - "REQUEST: CLASSIFIED|RESOLVED -> EXCLUSION_REVIEW, records pre_exclusion_state"
      - "APPROVE: -> EXCLUDED, sets excluded_at, shifts the station's excluded/billable downtime ledger, and invalidates every PROVISIONAL UptimeReport of the station back to DRAFT"
      - "REJECT: restores pre_exclusion_state; REVOKE: EXCLUDED -> pre_exclusion_state, clears excluded_at and reverses the ledger shift"
      - "increments OutageEvent.version by 1"

  - method: POST
    path: "/outage-events/{outage_event_id}/resolution-reviews"
    description: "Post-repair review. outcome VERIFY closes the outage (terminal, SoD-1: the reviewer may not be the operator who created the dispatch); outcome REOPEN sends it back to CLASSIFIED and clears cleared_at."
    roles: [NetworkOperator, ComplianceAuditor]
    code: 200
    input: [outcome]
    output: OutageEvent
    side_effects:
      - "VERIFY: RESOLVED -> VERIFIED"
      - "REOPEN: RESOLVED -> CLASSIFIED, clears cleared_at, reverses the station's gross/billable downtime ledger and may re-suspend the station"
      - "increments OutageEvent.version by 1"

  # -------------------------------------------------------- MaintenanceDispatch
  - method: POST
    path: "/maintenance-dispatches"
    description: "Dispatch a field technician to a classified fault inside a service window. Computes response_deadline_at via calculations.dispatch_response_deadline."
    roles: [NetworkOperator]
    code: 201
    input: [outage_event_id, port_id, technician_user_id, technician_certification_class, window_start_at, window_end_at]
    output: MaintenanceDispatch
    side_effects:
      - "port_id must equal the outage's port_id (ERR_OUTAGE_PORT_MISMATCH)"
      - "technician certification must cover the station's power class (ERR_TECHNICIAN_NOT_CERTIFIED)"
      - "half-open window overlap check against other live dispatches on the same port (ERR_DISPATCH_WINDOW_OVERLAP); touching endpoints are allowed"
      - "computes response_deadline_at; sets created_by_user_id = X-User-ID"
      - "drives OutageEvent CLASSIFIED -> DISPATCHED and records dispatch_created_by_user_id"
      - "drives ChargingPort.maintenance_state NONE -> DISPATCH_PENDING"

  - method: GET
    path: "/maintenance-dispatches"
    description: "FK reverse-reachability for MaintenanceDispatch.outage_event_id and MaintenanceDispatch.port_id — filtered, paginated dispatch list."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: ["outage_event_id?", "port_id?", "state?", "technician_user_id?", "limit?", "offset?"]
    output: MaintenanceDispatch[]
    side_effects: []

  - method: GET
    path: "/maintenance-dispatches/{dispatch_id}"
    description: "Fetch one dispatch with response_met, total_hold_minutes and promised_repair_at."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: []
    output: MaintenanceDispatch
    side_effects: []

  - method: POST
    path: "/maintenance-dispatches/{dispatch_id}/progress"
    description: "Technician progress event. event is one of {EN_ROUTE, ARRIVE, RESUME_ONSITE}. Only the assigned technician may post progress."
    roles: [FieldTechnician]
    code: 200
    input: [event]
    output: MaintenanceDispatch
    side_effects:
      - "EN_ROUTE: CREATED -> EN_ROUTE (requires the station to be OPERATIONAL or SUSPENDED)"
      - "ARRIVE: EN_ROUTE -> ON_SITE, stamps arrived_at and evaluates response_met against response_deadline_at; drives port maintenance_state DISPATCH_PENDING -> UNDER_REPAIR"
      - "RESUME_ONSITE: PARTS_HOLD -> ON_SITE; drives port maintenance_state AWAITING_PARTS -> UNDER_REPAIR"
      - "increments MaintenanceDispatch.version by 1"

  - method: POST
    path: "/maintenance-dispatches/{dispatch_id}/parts-hold"
    description: "Suspend the repair pending parts. Computes total_hold_minutes and promised_repair_at via calculations.parts_hold_repair_promise."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: MaintenanceDispatch
    side_effects:
      - "requires at least one RESERVED or BACKORDERED PartReservation on this dispatch"
      - "ON_SITE -> PARTS_HOLD; drives port maintenance_state UNDER_REPAIR -> AWAITING_PARTS"
      - "increments MaintenanceDispatch.version by 1"

  - method: POST
    path: "/maintenance-dispatches/{dispatch_id}/complete"
    description: "Close out the repair. Head of cascade A (depth 4)."
    roles: [FieldTechnician]
    code: 200
    input: []
    output: MaintenanceDispatch
    side_effects:
      - "rejects while any PartReservation on the dispatch is BACKORDERED"
      - "link 1: ON_SITE -> COMPLETED; every RESERVED reservation moves to CONSUMED, drawing down SparePart.on_hand_qty and reserved_qty"
      - "link 2: OutageEvent DISPATCHED -> RESOLVED with cleared_at = logical clock now; station downtime ledger recomputed"
      - "link 3: ChargingPort OUT_OF_SERVICE -> IN_SERVICE and maintenance_state UNDER_REPAIR -> NONE"
      - "link 4: Station SUSPENDED -> OPERATIONAL when suspension_source == AUTOMATIC and out_of_service_port_count reached 0"

  # ----------------------------------------------------------------- SparePart
  - method: POST
    path: "/spare-parts"
    description: "Create a depot spare-part record. Stock starts at zero and is raised by restock."
    roles: [NetworkOperator]
    code: 201
    input: [part_number, part_class, lead_time_days]
    output: SparePart
    side_effects:
      - "part_number uniqueness (ERR_PART_NUMBER_DUPLICATE)"

  - method: GET
    path: "/spare-parts"
    description: "List depot spare parts with their encumbrance figures."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: ["part_class?", "limit?", "offset?"]
    output: SparePart[]
    side_effects: []

  - method: GET
    path: "/spare-parts/{spare_part_id}"
    description: "Fetch one spare part: on_hand_qty, reserved_qty, backordered_qty, consumed_qty_lifetime, unencumbered_qty."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: []
    output: SparePart
    side_effects: []

  - method: POST
    path: "/spare-parts/{spare_part_id}/restock"
    description: "Receive stock into the depot, raising on_hand_qty and promoting backordered reservations."
    roles: [NetworkOperator]
    code: 200
    input: [qty]
    output: SparePart
    side_effects:
      - "raises on_hand_qty and therefore unencumbered_qty"
      - "promotes BACKORDERED PartReservation rows to RESERVED in ascending created_at order until the restocked stock is exhausted, moving qty from backordered_qty to reserved_qty and clearing expected_available_at"
      - "increments SparePart.version by 1"

  # ------------------------------------------------------------ PartReservation
  - method: POST
    path: "/part-reservations"
    description: "Earmark depot stock for a dispatch. OCC-guarded on the SparePart's version (§1.2.1 reservation-create-stale-spare-part). A reservation whose qty exceeds unencumbered_qty is created directly in BACKORDERED with expected_available_at = now + lead_time_days days."
    roles: [NetworkOperator]
    code: 201
    input: [dispatch_id, spare_part_id, qty, expected_spare_part_version]
    output: PartReservation
    side_effects:
      - "stale expected_spare_part_version -> ERR_STALE_PARENT_VERSION (412)"
      - "qty <= unencumbered_qty: state RESERVED, raises SparePart.reserved_qty"
      - "qty > unencumbered_qty: state BACKORDERED, raises SparePart.backordered_qty and sets expected_available_at"
      - "increments SparePart.version by 1"

  - method: GET
    path: "/part-reservations"
    description: "FK reverse-reachability for PartReservation.dispatch_id and PartReservation.spare_part_id — includes reservations released by a cascade."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: ["dispatch_id?", "spare_part_id?", "state?", "limit?", "offset?"]
    output: PartReservation[]
    side_effects: []

  - method: GET
    path: "/part-reservations/{reservation_id}"
    description: "Fetch one part reservation."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: []
    output: PartReservation
    side_effects: []

  - method: POST
    path: "/part-reservations/{reservation_id}/disposition"
    description: "Dispose of a reservation. action CONSUME (technician, draws the part down) or RELEASE (operator, the compensating action that restores unencumbered_qty)."
    roles: [NetworkOperator, FieldTechnician]
    code: 200
    input: [action]
    output: PartReservation
    side_effects:
      - "CONSUME: RESERVED -> CONSUMED; lowers on_hand_qty and reserved_qty by qty, raises consumed_qty_lifetime; unencumbered_qty unchanged"
      - "RELEASE: RESERVED|BACKORDERED -> RELEASED; lowers reserved_qty or backordered_qty by qty, restoring unencumbered_qty to its pre-reservation value"
      - "increments SparePart.version and PartReservation.version by 1"

  # --------------------------------------------------------------- UptimeReport
  - method: POST
    path: "/uptime-reports"
    description: "Declare a reporting period for a station. Periods are treated as CLOSED intervals, so an adjacent period on the same station is an overlap and is rejected."
    roles: [NetworkOperator]
    code: 201
    input: [station_id, period_start, period_end]
    output: UptimeReport
    side_effects:
      - "period_end > period_start, span >= 10080 minutes, period_end <= logical clock now"
      - "closed-closed overlap check against every existing report on the station (ERR_REPORTING_PERIOD_OVERLAP)"

  - method: GET
    path: "/uptime-reports/{uptime_report_id}"
    description: "Fetch one uptime report with its methodology and computed uptime figures."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: []
    output: UptimeReport
    side_effects: []

  - method: GET
    path: "/uptime-reports/{id}/reimbursement-claims"
    description: "FK reverse-reachability for ReimbursementClaim.uptime_report_id — includes claims driven to SUPERSEDED by a later create."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: ReimbursementClaim[]
    side_effects: []

  - method: POST
    path: "/uptime-reports/{uptime_report_id}/compute-provisional"
    description: "Compute the PROVISIONAL uptime variant (excluded minutes credited in the numerator only). DRAFT -> PROVISIONAL."
    roles: [NetworkOperator]
    code: 200
    input: []
    output: UptimeReport
    side_effects:
      - "writes eligible_port_count, total_port_minutes, excluded_minutes, billable_downtime_minutes, uptime_pct; sets methodology = PROVISIONAL"
      - "total_port_minutes == 0 -> ERR_NO_REPORTABLE_PORT_MINUTES (422)"
      - "increments UptimeReport.version by 1"

  - method: POST
    path: "/uptime-reports/{uptime_report_id}/finalize"
    description: "Recompute with the FINAL federal methodology (excluded minutes leave both numerator and denominator) and lock the auditor's identity for SoD-2. PROVISIONAL -> FINAL."
    roles: [ComplianceAuditor]
    code: 200
    input: []
    output: UptimeReport
    side_effects:
      - "rejects while any attributed OutageEvent is in EXCLUSION_REVIEW (ERR_EXCLUSION_REVIEW_PENDING)"
      - "(total_port_minutes - excluded_minutes) == 0 -> ERR_NO_REPORTABLE_PORT_MINUTES (422)"
      - "sets methodology = FINAL and finalized_by_user_id = X-User-ID"
      - "increments UptimeReport.version by 1"

  - method: POST
    path: "/uptime-reports/{uptime_report_id}/submit"
    description: "Submit the finalized report to the federal program. FINAL -> SUBMITTED."
    roles: [NetworkOperator]
    code: 200
    input: []
    output: UptimeReport
    side_effects:
      - "increments UptimeReport.version by 1"

  - method: POST
    path: "/uptime-reports/{uptime_report_id}/program-review"
    description: "Program-office decision. outcome ACCEPT makes the report claimable (terminal); outcome RETURN sends it back to PROVISIONAL, clears finalized_by_user_id and raises returned_count."
    roles: [ProgramAdministrator]
    code: 200
    input: [outcome]
    output: UptimeReport
    side_effects:
      - "ACCEPT: SUBMITTED -> ACCEPTED"
      - "RETURN: SUBMITTED -> PROVISIONAL, returned_count += 1, finalized_by_user_id = null"
      - "increments UptimeReport.version by 1"

  # ---------------------------------------------------------- ReimbursementClaim
  - method: POST
    path: "/reimbursement-claims"
    description: "File a reimbursement claim against an ACCEPTED uptime report. OCC-guarded on the UptimeReport's version (§1.2.1 claim-create-stale-uptime-report); a new claim supersedes any PENDING claim on the same report. line_items is an array of { port_id, category, amount_cents } and its supplied order is the pinned rounding order."
    roles: [NetworkOperator]
    code: 201
    input: [uptime_report_id, line_items, expected_uptime_report_version]
    output: ReimbursementClaim
    side_effects:
      - "stale expected_uptime_report_version -> ERR_STALE_PARENT_VERSION (412)"
      - "empty line_items -> ERR_CLAIM_LINE_ITEMS_EMPTY; a line item's port_id outside the report's station -> ERR_CLAIM_LINE_PORT_MISMATCH"
      - "sets requested_amount_cents = sum of line item amounts"
      - "drives any existing PENDING claim on the report to SUPERSEDED and raises UptimeReport.claim_count"
      - "increments UptimeReport.version by 1"

  - method: GET
    path: "/reimbursement-claims/{claim_id}"
    description: "Fetch one claim with its snapshotted effective_uptime_pct, withhold_rate and settled amounts."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: []

  - method: POST
    path: "/reimbursement-claims/{claim_id}/review"
    description: "Open the claim for adjudication and SNAPSHOT effective_uptime_pct and withhold_rate (calculations.reimbursement_payable_amount steps 1-3). PENDING|WITHHELD -> REVIEW."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects:
      - "requires the claim's UptimeReport.state == ACCEPTED (ERR_UPTIME_REPORT_NOT_ACCEPTED)"
      - "writes effective_uptime_pct and withhold_rate"
      - "increments ReimbursementClaim.version by 1"

  - method: POST
    path: "/reimbursement-claims/{claim_id}/decision"
    description: "Adjudicate. decision is APPROVE (requires withhold_rate == 0.00), WITHHOLD (requires 0.00 < withhold_rate < 1.00) or DENY (requires withhold_rate == 1.00). SoD-2: the decider may not be the auditor who finalized the report."
    roles: [ProgramAdministrator]
    code: 200
    input: [decision]
    output: ReimbursementClaim
    side_effects:
      - "SoD-2 violation -> ERR_SEGREGATION_OF_DUTIES (409)"
      - "APPROVE: withheld_amount_cents = 0, approved_amount_cents = requested_amount_cents"
      - "WITHHOLD: withheld_amount_cents = per-line-item round_half_up sum, approved_amount_cents = requested - withheld"
      - "DENY: withheld_amount_cents = requested_amount_cents, approved_amount_cents = 0"
      - "sets decided_by_user_id = X-User-ID; increments ReimbursementClaim.version by 1"

  - method: POST
    path: "/reimbursement-claims/{claim_id}/remediation"
    description: "Operator files an uptime remediation credit in percentage points against a withheld claim and reopens adjudication. WITHHELD -> REVIEW."
    roles: [NetworkOperator]
    code: 200
    input: [remediation_credit_pp]
    output: ReimbursementClaim
    side_effects:
      - "sets remediation_credit_pp, then re-snapshots effective_uptime_pct (capped at 100.00) and withhold_rate"
      - "increments ReimbursementClaim.version by 1"

  # ------------------------------------------------------------ CustomerComplaint
  - method: POST
    path: "/customer-complaints"
    description: "Driver complaint intake with the disputed session's billing detail."
    roles: [CustomerSupportAgent]
    code: 201
    input: [station_id, port_id, complaint_type, session_started_at, session_ended_at, session_energy_kwh, session_price_per_kwh_cents, session_charged_cents, "session_idle_fee_cents?"]
    output: CustomerComplaint
    side_effects:
      - "port_id must belong to station_id (ERR_COMPLAINT_PORT_MISMATCH)"
      - "session_ended_at > session_started_at (ERR_SESSION_WINDOW_INVALID); session_charged_cents >= session_idle_fee_cents (ERR_SESSION_CHARGE_INVALID)"

  - method: GET
    path: "/customer-complaints"
    description: "FK reverse-reachability for CustomerComplaint.station_id, port_id and linked_outage_event_id."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: ["station_id?", "port_id?", "linked_outage_event_id?", "state?", "refund_state?", "limit?", "offset?"]
    output: CustomerComplaint[]
    side_effects: []

  - method: GET
    path: "/customer-complaints/{complaint_id}"
    description: "Fetch one complaint with both parallel dimensions and the refund money split."
    roles: [NetworkOperator, FieldTechnician, ComplianceAuditor, ProgramAdministrator, HostSiteManager, CustomerSupportAgent]
    code: 200
    input: []
    output: CustomerComplaint
    side_effects: []

  - method: POST
    path: "/customer-complaints/{complaint_id}/triage"
    description: "Triage the complaint. disposition LINK_OUTAGE attributes it to an outage on the same port (INTAKE -> TRIAGED); disposition NO_FAULT dismisses it (INTAKE -> DISMISSED)."
    roles: [CustomerSupportAgent]
    code: 200
    input: [disposition, "linked_outage_event_id?"]
    output: CustomerComplaint
    side_effects:
      - "LINK_OUTAGE requires linked_outage_event_id whose port_id == complaint.port_id (ERR_COMPLAINT_OUTAGE_MISMATCH)"
      - "increments CustomerComplaint.version by 1"

  - method: POST
    path: "/customer-complaints/{complaint_id}/close"
    description: "Close a triaged complaint. Blocked while the refund dimension is still in flight."
    roles: [CustomerSupportAgent]
    code: 200
    input: []
    output: CustomerComplaint
    side_effects:
      - "refund_state IN {REQUESTED, APPROVED} -> ERR_REFUND_IN_FLIGHT (409)"
      - "TRIAGED -> CLOSED; increments CustomerComplaint.version by 1"

  - method: POST
    path: "/customer-complaints/{complaint_id}/refund-requests"
    description: "File a session refund on the parallel refund dimension. refund_basis is ENERGY_PRORATED or FULL_SESSION_GOODWILL; the goodwill basis requires a linked CRITICAL outage overlapping the session."
    roles: [CustomerSupportAgent]
    code: 200
    input: [refund_basis]
    output: CustomerComplaint
    side_effects:
      - "requires complaint.state == TRIAGED (cross-dimension guard) and refund_state == NONE"
      - "computes refund_amount_cents and retained_amount_cents via calculations.session_refund_amount"
      - "sets refund_requested_by_user_id = X-User-ID; refund_state NONE -> REQUESTED"
      - "increments CustomerComplaint.version by 1"

  - method: POST
    path: "/customer-complaints/{complaint_id}/refund-decisions"
    description: "Auditor decision on the refund. decision APPROVE or DENY."
    roles: [ComplianceAuditor]
    code: 200
    input: [decision]
    output: CustomerComplaint
    side_effects:
      - "APPROVE: refund_state REQUESTED -> APPROVED, rejecting if refund_amount_cents > session_charged_cents (ERR_REFUND_EXCEEDS_SESSION_CHARGE)"
      - "DENY: REQUESTED -> DENIED, sets refund_amount_cents = 0 and retained_amount_cents = session_charged_cents"
      - "increments CustomerComplaint.version by 1"

  - method: POST
    path: "/customer-complaints/{complaint_id}/refund-ledger-actions"
    description: "Money movement on the refund. action SETTLE (support agent pays the driver, raising Station.refund_liability_cents) or REVERSE (auditor claws the settlement back, the compensating action)."
    roles: [CustomerSupportAgent, ComplianceAuditor]
    code: 200
    input: [action]
    output: CustomerComplaint
    side_effects:
      - "SETTLE: APPROVED -> SETTLED, sets refund_settled_at, raises Station.refund_liability_cents by refund_amount_cents"
      - "REVERSE: SETTLED -> REVERSED, clears refund_settled_at, lowers Station.refund_liability_cents back to its pre-settlement value, and sets refund_amount_cents = 0 with retained_amount_cents = session_charged_cents"
      - "increments CustomerComplaint.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization ----------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not in the endpoint's roles list"
  - id: ERR_HOST_SITE_FORBIDDEN
    http: 403
    condition: "a HostSiteManager amends a HostSite whose id != X-User-ID"
  - id: ERR_NOT_ASSIGNED_TECHNICIAN
    http: 403
    condition: "a FieldTechnician acts on a dispatch (progress / parts-hold / complete / CONSUME disposition) whose technician_user_id != X-User-ID"

  # ---- existence --------------------------------------------------------------
  - id: ERR_HOST_SITE_NOT_FOUND
    http: 404
    condition: "host_site_id in the path or body names no HostSite"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "station_id in the path or body names no Station"
  - id: ERR_PORT_NOT_FOUND
    http: 404
    condition: "port_id in the path or body (including line_items[].port_id) names no ChargingPort"
  - id: ERR_OUTAGE_NOT_FOUND
    http: 404
    condition: "outage_event_id in the path or body names no OutageEvent"
  - id: ERR_DISPATCH_NOT_FOUND
    http: 404
    condition: "dispatch_id in the path or body names no MaintenanceDispatch"
  - id: ERR_SPARE_PART_NOT_FOUND
    http: 404
    condition: "spare_part_id in the path or body names no SparePart"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "reservation_id in the path names no PartReservation"
  - id: ERR_UPTIME_REPORT_NOT_FOUND
    http: 404
    condition: "uptime_report_id in the path or body names no UptimeReport"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim_id in the path names no ReimbursementClaim"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "complaint_id in the path names no CustomerComplaint"

  # ---- request schema ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, enum value outside its declared set, number out of range, malformed line_items entry, or pagination limit/offset outside 1..100 / >= 0"

  # ---- uniqueness -------------------------------------------------------------
  - id: ERR_SITE_CODE_DUPLICATE
    http: 409
    condition: "HostSite.site_code already exists"
  - id: ERR_STATION_CODE_DUPLICATE
    http: 409
    condition: "Station.station_code already exists"
  - id: ERR_DISPENSER_SERIAL_DUPLICATE
    http: 409
    condition: "ChargingPort.dispenser_serial already exists"
  - id: ERR_PART_NUMBER_DUPLICATE
    http: 409
    condition: "SparePart.part_number already exists"

  # ---- optimistic concurrency -------------------------------------------------
  - id: ERR_STALE_PARENT_VERSION
    http: 412
    condition: "expected_uptime_report_version != UptimeReport.version on POST /reimbursement-claims, or expected_spare_part_version != SparePart.version on POST /part-reservations (§1.2.1)"

  # ---- state ------------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition does not exist from the entity's current state in the relevant §1.2 dimension (including the cross-dimension guard that a refund request requires complaint.state == TRIAGED)"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the entity is already in a terminal state for the dimension being changed (Station DECOMMISSIONED, ChargingPort RETIRED, OutageEvent VERIFIED, MaintenanceDispatch COMPLETED/CANCELLED, PartReservation CONSUMED/RELEASED, UptimeReport ACCEPTED, ReimbursementClaim APPROVED/DENIED/SUPERSEDED, CustomerComplaint CLOSED/DISMISSED, refund_state DENIED/REVERSED)"

  # ---- segregation of duties --------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "SoD-1: the ComplianceAuditor verifying a resolution is the same X-User-ID that created the dispatch. SoD-2: the ProgramAdministrator deciding a claim is the same X-User-ID that finalized the uptime report"

  # ---- safety / certification -------------------------------------------------
  - id: ERR_TECHNICIAN_NOT_CERTIFIED
    http: 422
    condition: "TECH_CERT_RANK[technician_certification_class] < REQUIRED_CERT_RANK[station.power_class] on dispatch creation"

  # ---- referential integrity --------------------------------------------------
  - id: ERR_OUTAGE_PORT_MISMATCH
    http: 409
    condition: "the dispatch's port_id differs from the named OutageEvent's port_id"
  - id: ERR_CLAIM_LINE_PORT_MISMATCH
    http: 409
    condition: "a line_items[].port_id belongs to a station other than the uptime report's station"
  - id: ERR_COMPLAINT_PORT_MISMATCH
    http: 409
    condition: "the complaint's port_id belongs to a station other than the complaint's station_id"
  - id: ERR_COMPLAINT_OUTAGE_MISMATCH
    http: 409
    condition: "the triage linked_outage_event_id names an outage whose port_id differs from the complaint's port_id"

  # ---- temporal ---------------------------------------------------------------
  - id: ERR_DETECTED_AT_IN_FUTURE
    http: 422
    condition: "OutageEvent.detected_at > logical clock now"
  - id: ERR_DETECTED_AT_BEFORE_PORT
    http: 422
    condition: "OutageEvent.detected_at < the port's created_at"
  - id: ERR_DISPATCH_WINDOW_INVALID
    http: 422
    condition: "window_end_at <= window_start_at, or window_start_at < the outage's detected_at"
  - id: ERR_DISPATCH_WINDOW_OVERLAP
    http: 409
    condition: "the new half-open window [window_start_at, window_end_at) intersects a live dispatch window on the same port; touching endpoints are NOT an overlap"
  - id: ERR_REPORTING_PERIOD_INVALID
    http: 422
    condition: "period_end <= period_start, or the span is shorter than 10080 minutes"
  - id: ERR_REPORTING_PERIOD_NOT_ELAPSED
    http: 422
    condition: "period_end > logical clock now"
  - id: ERR_REPORTING_PERIOD_OVERLAP
    http: 409
    condition: "the new closed period [period_start, period_end] intersects any existing report period on the same station; an adjacent period sharing one endpoint IS an overlap"
  - id: ERR_SESSION_WINDOW_INVALID
    http: 422
    condition: "session_ended_at <= session_started_at"

  # ---- host site / commissioning constraints ---------------------------------
  - id: ERR_INVALID_ACCESS_WINDOW
    http: 422
    condition: "access_hours_mode == RESTRICTED with access_open_minute >= access_close_minute"
  - id: ERR_HOST_AGREEMENT_NOT_EXECUTED
    http: 422
    condition: "commissioning attempted while host_site.agreement_status != EXECUTED"
  - id: ERR_POWER_UPGRADE_NOT_ENERGIZED
    http: 422
    condition: "commissioning attempted while host_site.power_upgrade_status IN {REQUESTED, IN_PROGRESS}"
  - id: ERR_PARKING_ENFORCEMENT_REQUIRED
    http: 422
    condition: "commissioning attempted while host_site.parking_enforcement_mode == NONE"
  - id: ERR_PORT_COUNT_BELOW_DECLARED
    http: 422
    condition: "commissioning attempted while station.commissioned_port_count < station.declared_port_count"
  - id: ERR_SITE_CAPACITY_EXCEEDED
    http: 422
    condition: "commissioning attempted while station.installed_power_kw > host_site.committed_service_capacity_kw"
  - id: ERR_INTEROP_SCORE_BELOW_THRESHOLD
    http: 422
    condition: "commissioning attempted while station.payment_interop_score < 90.00 (the 90.00 boundary itself passes)"

  # ---- cross-entity state dependencies ---------------------------------------
  - id: ERR_UPTIME_REPORT_NOT_ACCEPTED
    http: 409
    condition: "a claim review is attempted while its UptimeReport.state != ACCEPTED"
  - id: ERR_STATION_NOT_SERVICEABLE
    http: 409
    condition: "a dispatch is sent EN_ROUTE while its Station.status is not OPERATIONAL or SUSPENDED"
  - id: ERR_PORT_RETIRED
    http: 409
    condition: "an outage on a RETIRED ChargingPort is classified, reopened or exclusion-requested"

  # ---- exclusion / reporting constraints -------------------------------------
  - id: ERR_EXCLUSION_CAUSE_NOT_ELIGIBLE
    http: 422
    condition: "an exclusion is requested while excluded_cause_claim == NONE, or approved while the effective cause is NONE"
  - id: ERR_EXCLUSION_REVIEW_PENDING
    http: 409
    condition: "finalize attempted while an OutageEvent attributed to the period is still in EXCLUSION_REVIEW"
  - id: ERR_NO_REPORTABLE_PORT_MINUTES
    http: 422
    condition: "total_port_minutes == 0 on compute-provisional, or (total_port_minutes - excluded_minutes) == 0 on finalize"

  # ---- refund constraints -----------------------------------------------------
  - id: ERR_REFUND_BASIS_NOT_ELIGIBLE
    http: 422
    condition: "refund_basis == FULL_SESSION_GOODWILL without a linked CRITICAL OutageEvent whose downtime window overlaps the session"
  - id: ERR_REFUND_IN_FLIGHT
    http: 409
    condition: "close attempted while refund_state IN {REQUESTED, APPROVED}"
  - id: ERR_REFUND_EXCEEDS_SESSION_CHARGE
    http: 422
    condition: "refund approval attempted while refund_amount_cents > session_charged_cents"
  - id: ERR_SESSION_CHARGE_INVALID
    http: 422
    condition: "session_charged_cents < session_idle_fee_cents at intake"

  # ---- inventory / fiscal -----------------------------------------------------
  - id: ERR_RESERVATION_QTY_INVALID
    http: 422
    condition: "PartReservation.qty < 1, or a RELEASE is requested against a reservation that no longer encumbers stock"
  - id: ERR_CLAIM_LINE_ITEMS_EMPTY
    http: 422
    condition: "line_items is an empty array on claim creation"
  - id: ERR_UPTIME_BELOW_APPROVAL_THRESHOLD
    http: 422
    condition: "decision APPROVE while withhold_rate != 0.00 (effective_uptime_pct < 97.00)"
  - id: ERR_WITHHOLD_RATE_MISMATCH
    http: 422
    condition: "decision WITHHOLD while withhold_rate is 0.00 or 1.00, or decision DENY while withhold_rate != 1.00"

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties
# =============================================================================
roles:
  - name: NetworkOperator
    description: "The federally funded charging network operator's own staff: builds sites and stations, ingests and classifies faults, dispatches field maintenance, manages depot inventory, declares reporting periods, files claims and remediations."
    identity: "opaque"
    exclusive_operations:
      - "POST /host-sites"
      - "POST /stations"
      - "POST /charging-ports"
      - "PATCH /charging-ports/{port_id}"
      - "POST /charging-ports/{port_id}/retire"
      - "POST /stations/{station_id}/commission"
      - "POST /outage-events"
      - "POST /outage-events/{outage_event_id}/classify"
      - "POST /maintenance-dispatches"
      - "POST /spare-parts"
      - "POST /spare-parts/{spare_part_id}/restock"
      - "POST /part-reservations"
      - "POST /uptime-reports"
      - "POST /uptime-reports/{uptime_report_id}/compute-provisional"
      - "POST /uptime-reports/{uptime_report_id}/submit"
      - "POST /reimbursement-claims"
      - "POST /reimbursement-claims/{claim_id}/remediation"
    shared_operations:
      - "PATCH /host-sites/{host_site_id} (with HostSiteManager)"
      - "POST /stations/{station_id}/status-transitions (with ComplianceAuditor, who may only send DRAFT)"
      - "POST /outage-events/{outage_event_id}/exclusion-actions (REQUEST leg only; APPROVE/REJECT/REVOKE belong to ComplianceAuditor)"
      - "POST /outage-events/{outage_event_id}/resolution-reviews (REOPEN leg only; VERIFY belongs to ComplianceAuditor)"
      - "POST /part-reservations/{reservation_id}/disposition (RELEASE leg only; CONSUME belongs to FieldTechnician)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: FieldTechnician
    description: "Contracted field maintenance technician. Acts only on dispatches assigned to them and only through the progress / parts-hold / complete surface."
    identity: "opaque"
    exclusive_operations:
      - "POST /maintenance-dispatches/{dispatch_id}/progress"
      - "POST /maintenance-dispatches/{dispatch_id}/parts-hold"
      - "POST /maintenance-dispatches/{dispatch_id}/complete"
    shared_operations:
      - "POST /part-reservations/{reservation_id}/disposition (CONSUME leg only)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
    note: "X-User-ID is matched against MaintenanceDispatch.technician_user_id (ERR_NOT_ASSIGNED_TECHNICIAN) — an opaque operator id, not an entity id."

  - name: ComplianceAuditor
    description: "Independent uptime-compliance auditor. Certifies payment terminals, adjudicates outage exclusions, verifies repairs, finalizes uptime reports with the federal methodology, and decides/reverses session refunds."
    identity: "opaque"
    exclusive_operations:
      - "POST /charging-ports/{port_id}/terminal-certification"
      - "POST /uptime-reports/{uptime_report_id}/finalize"
      - "POST /customer-complaints/{complaint_id}/refund-decisions"
    shared_operations:
      - "POST /stations/{station_id}/status-transitions (DRAFT revert leg only)"
      - "POST /outage-events/{outage_event_id}/exclusion-actions (APPROVE/REJECT/REVOKE legs)"
      - "POST /outage-events/{outage_event_id}/resolution-reviews (VERIFY leg)"
      - "POST /customer-complaints/{complaint_id}/refund-ledger-actions (REVERSE leg only)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
    note: "SoD-1 — the auditor who VERIFies a resolution must not be the X-User-ID recorded as the outage's dispatch_created_by_user_id. SoD-2 — the X-User-ID that finalizes a report is stored as finalized_by_user_id and is barred from deciding that report's claims even when acting as ProgramAdministrator."

  - name: ProgramAdministrator
    description: "Federal program office. Accepts or returns submitted uptime reports and adjudicates reimbursement claims against the uptime withhold tiers."
    identity: "opaque"
    exclusive_operations:
      - "POST /uptime-reports/{uptime_report_id}/program-review"
      - "POST /reimbursement-claims/{claim_id}/review"
      - "POST /reimbursement-claims/{claim_id}/decision"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
    note: "SoD-2 is enforced here: X-User-ID on decision must differ from the claim's UptimeReport.finalized_by_user_id."

  - name: HostSiteManager
    description: "The property host's representative. May amend only their own site's agreement status, power-upgrade progress, access hours, parking enforcement and committed capacity."
    identity: "entity_backed:HostSite"
    exclusive_operations: []
    shared_operations:
      - "PATCH /host-sites/{host_site_id} (only where host_site_id == X-User-ID)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
    note: "X-User-ID equals the id of the HostSite row the user acts as; any other host_site_id yields ERR_HOST_SITE_FORBIDDEN."

  - name: CustomerSupportAgent
    description: "Driver-facing support desk. Takes complaint intake, triages, files session refund requests, settles approved refunds and closes complaints."
    identity: "opaque"
    exclusive_operations:
      - "POST /customer-complaints"
      - "POST /customer-complaints/{complaint_id}/triage"
      - "POST /customer-complaints/{complaint_id}/close"
      - "POST /customer-complaints/{complaint_id}/refund-requests"
    shared_operations:
      - "POST /customer-complaints/{complaint_id}/refund-ledger-actions (SETTLE leg only)"
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"




