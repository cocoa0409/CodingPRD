      - name: proctor_availability_uses_closed_intervals_with_no_buffer
        grounds:
          - validations[priority=18]
          - errors[ERR_PROCTOR_TIME_CONFLICT]
          - entities.Session.fields.proctor_id
          - concurrency_rules[proctor-assignment-supersede-stale-session]
        distinguishing_aspect: >-
          Interval semantics B on the Proctor resource, a different resource entity from
          the room: CLOSED intervals with no buffer, so an assignment whose start lands
          exactly on the previous session's end (12:00 == 12:00) IS rejected, while
          starting one minute later is accepted - the mirror image of the room rule, which
          would have accepted a touching start once the buffer was cleared.
        test_recipe:
          setup:
            - "One district, school and OPEN window with a certified proctor holding an ACTIVE affidavit."
            - "Session A occupies room R101 from 09:00 to 12:00 on 2026-09-08 with that proctor already assigned."
            - "Session B (room R102, 12:00-15:00) and Session C (room R103, 12:01-15:00) exist as DRAFT with no proctor; neither collides with A on the room rule because the rooms differ."
