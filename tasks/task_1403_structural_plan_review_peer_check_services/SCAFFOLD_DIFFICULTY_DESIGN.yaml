              as: ReviewCoordinator
            - call: "POST /plan-review/cycles/${cyc_id}/approve"
              payload: { load_path_confirmed: true, lateral_system_confirmed: true }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/deferred-submittals"
              payload: { engagement_id: "${eng_id}", item_type: "ANCHOR", description: "Post-installed anchor design" }
