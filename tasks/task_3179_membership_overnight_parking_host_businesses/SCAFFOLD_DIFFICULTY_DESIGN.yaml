              payload: { site_label: "G1", site_class: "BACK_IN", max_vehicle_length_feet: 40, has_electric: false, electric_service_code: "NONE" }
              as: HostOperator
            - call: "GET /api/hosts/${h_gt}"
              payload: {}
              as: HostOperator
              captures: { h_gt_v1: $.data.version }
            - call: "POST /api/hosts/${h_gt}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_gt_v1}" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "m13@x.com", full_name: "M Thirteen", plan_tier: "CLASSIC", home_state_code: "TX" }
              as: Anonymous
              captures: { m13: $.data.id }
            - call: "POST /api/members/${m13}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m13}/vehicles"
              payload: { vehicle_class: "CLASS_C", length_feet: 30, self_contained: true, inspection_state_code: "TX" }
              as: Member
              as_user_id: "${m13}"
              captures: { v13: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_gt}", member_id: "${m13}", vehicle_id: "${v13}", arrival_date: "2026-06-10", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m13}"
              captures: { r_gt: $.data.id }
            - call: "GET /api/hosts/${h_gt}"
              payload: {}
              as: HostOperator
              captures: { h_gt_v2: $.data.version }
            - call: "POST /api/stay-requests/${r_gt}/decisions"
              payload: { decision: "CONFIRM", site_id: "G1", expected_host_version: "${h_gt_v2}" }
              as: HostOperator
              as_user_id: "${h_gt}"
              captures: { first_status: $.data.request_status }
            - call: "POST /api/stay-requests/${r_gt}/cancellations"
              payload: {}
              as: Member
              as_user_id: "${m13}"
            - call: "POST /api/stay-requests/${r_gt}/counter_requests"
              payload: { arrival_date: "2026-06-12", nights: 2, party_size: 1 }
              as: Member
