            - "after cancelling ACCEPTED o1: balance == 100000 (500 hold released)"
            - "after cancelling QUOTED o2: balance still 100000 (no hold to release)"
            - "o1 billing VOIDED and o2 billing VOIDED; both fulfillment CANCELLED"

      - name: policy_activate_archives_predecessor
