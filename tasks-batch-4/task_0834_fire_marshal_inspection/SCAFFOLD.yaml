scenario: "834. Fire Marshal Plan Review & Fire Inspection: occupancy & construction-type, plan review (sprinkler/alarm/egress), permit & fee, periodic/complaint inspection, violation & abatement order, certificate/placard, hazmat/tank permit, hydrant/flow test"
domain_name: "fire-marshal-inspection"
api_prefix: "/api"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep URL nesting. Discipline reviews
  # are folded into PlanReview as three parallel status axes rather than a child
  # table, keeping the surface flat.

  state_machine_shape: parallel
  # PlanReview carries three independent discipline axes; Certificate carries two
  # independent axes (occupancy_status x placard_status). PermitApplication and
  # Violation are cyclic. No entity is a pure linear pipeline.

  relationship_patterns:
    - one_to_many        # Property -> {PermitApplication, Inspection, Certificate, Hydrant}
    - cross_aggregate    # PermitApplication.flow_test_id references a FlowTest under a different Hydrant aggregate

  role_model: peer_roles
  # Applicant owns applications; PlanReviewer owns discipline decisions; Inspector
  # owns inspections/flow-tests/abatement; FireMarshal owns permits/certificates.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: address
        type: string
        source: input
        description: "Street address of the building/site"
      - name: owner_name
        type: string
        source: input
        description: "Legal owner of record"
      - name: occupancy_classification
        type: enum
        source: input
        description: "IFC occupancy group"
        constraints: "one of ASSEMBLY, BUSINESS, EDUCATIONAL, FACTORY, HIGH_HAZARD, INSTITUTIONAL, MERCANTILE, RESIDENTIAL, STORAGE, UTILITY"
      - name: construction_type
        type: enum
        source: input
        description: "IBC construction type"
        constraints: "one of TYPE_I, TYPE_II, TYPE_III, TYPE_IV, TYPE_V"
      - name: total_floor_area_sqft
        type: integer
        source: input
        description: "Gross floor area in square feet"
        constraints: "> 0"
      - name: stories
        type: integer
        source: input
        description: "Number of stories above grade"
        constraints: ">= 1"
      - name: occupant_load
        type: integer
        source: computed
        description: "Posted occupant load (NET-area method; see calc occupant_load variant posted_net)"
      - name: design_occupant_load
        type: integer
        source: computed
        description: "Design occupant load (GROSS-area method; see calc occupant_load variant design_gross)"
      - name: required_exits
        type: integer
        source: computed
        description: "Minimum number of exits from occupant_load thresholds (see calc required_exits)"
      - name: required_fire_flow_gpm
        type: integer
        source: computed
        description: "Required fire flow in gpm (see calc required_fire_flow_gpm)"
      - name: open_violation_count
        type: integer
        source: system
        description: "Count of Violations tied to this Property's Inspections whose status is OPEN"
        default: 0
      - name: fees_paid_cents
        type: integer
        source: system
        description: "Jurisdiction-collected permit fees for this Property: sum of final_fee_cents over its ISSUED permits minus refunds"
        default: 0

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id"
      - name: applicant_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the owning Applicant; ownership checks compare X-User-ID to this value"
      - name: permit_type
        type: enum
        source: input
        description: "Kind of fire permit sought"
        constraints: "one of CONSTRUCTION, TENANT_IMPROVEMENT, HAZMAT, TANK"
      - name: project_valuation_cents
        type: integer
        source: input
        description: "Declared project valuation in cents"
        constraints: ">= 0"
      - name: scope_area_sqft
        type: integer
        source: input
        description: "Area of work scope in square feet"
        constraints: "> 0"
      - name: flow_test_id
        type: string
        source: input
        description: "FK -> FlowTest.id; nullable; REQUIRED when permit_type in {HAZMAT, TANK}"
      - name: status
        type: enum
        source: system
        description: "Application lifecycle state"
        constraints: "one of DRAFT, UNDER_REVIEW, CORRECTIONS_REQUIRED, APPROVED, ISSUED"
        default: DRAFT
      - name: estimated_fee_cents
        type: integer
        source: computed
        description: "Fee quoted at submit assuming zero correction cycles (calc permit_fee variant estimated); frozen"
      - name: final_fee_cents
        type: integer
        source: computed
        description: "Fee assessed at permit issuance including resubmit surcharge (calc permit_fee variant final)"
      - name: amount_paid_cents
        type: integer
        source: system
        description: "Cumulative fee paid by applicant"
        default: 0
      - name: refunded_cents
        type: integer
        source: system
        description: "Cumulative fee refunded on permit revocation"
        default: 0
      - name: resubmit_count
        type: integer
        source: system
        description: "Number of times corrections were resubmitted; drives final fee surcharge"
        default: 0

  - name: PlanReview
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> PermitApplication.id"
      - name: sprinkler_status
        type: enum
        source: system
        description: "Sprinkler discipline axis"
        constraints: "one of UNDER_REVIEW, APPROVED, CORRECTIONS_REQUIRED"
        default: UNDER_REVIEW
      - name: alarm_status
        type: enum
        source: system
        description: "Fire-alarm discipline axis"
        constraints: "one of UNDER_REVIEW, APPROVED, CORRECTIONS_REQUIRED"
        default: UNDER_REVIEW
      - name: egress_status
        type: enum
        source: system
        description: "Egress discipline axis"
        constraints: "one of UNDER_REVIEW, APPROVED, CORRECTIONS_REQUIRED"
        default: UNDER_REVIEW
      - name: overall_status
        type: enum
        source: computed
        description: "OPEN until all three discipline axes are APPROVED, then APPROVED"
        constraints: "one of OPEN, APPROVED"
        default: OPEN
      - name: correction_cycles
        type: integer
        source: system
        description: "Times the review returned to the applicant for corrections"
        default: 0

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: system
        description: "FK -> PermitApplication.id"
      - name: permit_number
        type: string
        source: system
        description: "Server-minted human permit number"
      - name: status
        type: enum
        source: system
        description: "Permit lifecycle state"
        constraints: "one of ISSUED, REVOKED"
        default: ISSUED
      - name: final_fee_cents
        type: integer
        source: system
        description: "Final fee copied from the application at issuance"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of issuance"
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + 365 days"

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id"
      - name: inspection_type
        type: enum
        source: input
        description: "Kind of inspection"
        constraints: "one of PERIODIC, COMPLAINT, RE_INSPECTION, FINAL"
      - name: complaint_description
        type: string
        source: input
        description: "Nature of the complaint; REQUIRED when inspection_type == COMPLAINT, else null"
      - name: scheduled_date
        type: datetime
        source: input
        description: "Date the inspection is scheduled for"
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle state"
        constraints: "one of SCHEDULED, PASSED, FAILED"
        default: SCHEDULED
      - name: result_recorded_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when result was recorded; null while SCHEDULED"

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: system
        description: "FK -> Inspection.id"
      - name: code_section
        type: string
        source: input
        description: "Cited fire-code section"
      - name: severity
        type: enum
        source: input
        description: "Hazard severity"
        constraints: "one of MINOR, MAJOR, IMMINENT_HAZARD"
      - name: status
        type: enum
        source: system
        description: "Violation lifecycle state"
        constraints: "one of OPEN, ABATED, VERIFIED, ESCALATED"
        default: OPEN
      - name: abated_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when abatement was accepted; null while OPEN/ESCALATED"

  - name: AbatementOrder
    parent: null
    common_fields: true
    fields:
      - name: violation_id
        type: string
        source: system
        description: "FK -> Violation.id"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of order issuance"
      - name: deadline
        type: datetime
        source: computed
        description: "issued_at + grace days by severity (calc abatement_deadline)"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle state"
        constraints: "one of ISSUED, COMPLIED, OVERDUE, ESCALATED, SUPERSEDED"
        default: ISSUED
      - name: is_active
        type: boolean
        source: system
        description: "True for the current controlling order of the violation; a new order supersedes the prior active one"
        default: true

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id"
      - name: occupancy_status
        type: enum
        source: system
        description: "Compliance axis (independent of placard_status)"
        constraints: "one of VALID, SUSPENDED, REVOKED"
        default: VALID
      - name: placard_status
        type: enum
        source: system
        description: "Posting axis (independent of occupancy_status)"
        constraints: "one of GREEN, YELLOW, RED"
        default: GREEN

  - name: Hydrant
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id"
      - name: location_desc
        type: string
        source: input
        description: "Physical location of the hydrant"
      - name: main_size_inches
        type: number
        source: input
        description: "Supplying water-main diameter in inches"

  - name: FlowTest
    parent: null
    common_fields: true
    fields:
      - name: hydrant_id
        type: string
        source: input
        description: "FK -> Hydrant.id"
      - name: test_date
        type: datetime
        source: input
        description: "Date the flow test was conducted"
      - name: static_psi
        type: number
        source: input
        description: "Static pressure reading"
      - name: residual_psi
        type: number
        source: input
        description: "Residual pressure during flow"
      - name: measured_flow_gpm
        type: number
        source: input
        description: "Measured flow at the residual reading"
      - name: available_flow_at_20psi
        type: integer
        source: computed
        description: "Available fire flow projected to 20 psi (calc flow_available_at_20psi)"
      - name: valid_until
        type: datetime
        source: computed
        description: "test_date + 365 days; the test's validity window is [test_date, valid_until)"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [ISSUED]
    note: "Cyclic: UNDER_REVIEW <-> CORRECTIONS_REQUIRED revision loop."
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /permit-applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "acting X-User-ID == application.applicant_user_id"
          - "if permit_type in {HAZMAT, TANK} then flow_test_id is present and its FlowTest.available_flow_at_20psi >= Property.required_fire_flow_gpm"
        side_effects:
          - "compute estimated_fee_cents via calc permit_fee variant estimated (resubmit_count treated as 0)"
          - "create PlanReview with sprinkler_status=alarm_status=egress_status=UNDER_REVIEW, overall_status=OPEN"
      - from: UNDER_REVIEW
        to: CORRECTIONS_REQUIRED
        trigger: "POST /plan-reviews/{id}/discipline-decision with decision=CORRECTIONS_REQUIRED"
        actor: PlanReviewer
        preconditions:
          - "PlanReview.application_id == this application"
        side_effects:
          - "set the named discipline axis to CORRECTIONS_REQUIRED"
      - from: CORRECTIONS_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /plan-reviews/{id}/resubmit-corrections"
        actor: Applicant
        preconditions:
          - "acting X-User-ID == application.applicant_user_id"
          - "at least one discipline axis == CORRECTIONS_REQUIRED"
        side_effects:
          - "each discipline axis == CORRECTIONS_REQUIRED becomes UNDER_REVIEW"
          - "increment PlanReview.correction_cycles by 1"
          - "increment PermitApplication.resubmit_count by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /plan-reviews/{id}/discipline-decision (the decision that brings all three axes to APPROVED)"
        actor: PlanReviewer
        preconditions:
          - "after this decision, sprinkler_status == alarm_status == egress_status == APPROVED"
        side_effects:
          - "PlanReview.overall_status becomes APPROVED (bubble-up)"
      - from: APPROVED
        to: ISSUED
        trigger: "POST /permits"
        actor: FireMarshal
        preconditions:
          - "application.status == APPROVED"
          - "application.amount_paid_cents >= final_fee_cents (final computed here via calc permit_fee variant final)"
        side_effects:
          - "compute final_fee_cents via calc permit_fee variant final (actual resubmit_count)"
          - "create Permit(status=ISSUED)"
          - "Property.fees_paid_cents += final_fee_cents"

  - entity: PlanReview
    initial_state: OPEN
    terminal_states: [APPROVED]
    note: "PARALLEL: three discipline axes (sprinkler/alarm/egress) advance independently; overall_status is the compound bubble-up. Each axis is cyclic APPROVED-or-CORRECTIONS with resubmit returning it to UNDER_REVIEW."
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /plan-reviews/{id}/discipline-decision (fewer than three axes APPROVED afterward)"
        actor: PlanReviewer
        preconditions:
          - "named axis is currently UNDER_REVIEW"
        side_effects:
          - "set named axis to APPROVED or CORRECTIONS_REQUIRED per decision"
      - from: OPEN
        to: APPROVED
        trigger: "POST /plan-reviews/{id}/discipline-decision (all three axes APPROVED afterward)"
        actor: PlanReviewer
        preconditions:
          - "count of axes not in APPROVED == 0 after applying this decision"
        side_effects:
          - "overall_status := APPROVED"
          - "parent PermitApplication transitions UNDER_REVIEW -> APPROVED"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{id}/record-result with result=PASSED"
        actor: Inspector
        preconditions:
          - "inspection.status == SCHEDULED"
        side_effects:
          - "set result_recorded_at = clock now"
          - "if inspection_type == RE_INSPECTION: every Violation on this Property whose status == ABATED becomes VERIFIED"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{id}/record-result with result=FAILED"
        actor: Inspector
        preconditions:
          - "inspection.status == SCHEDULED"
          - "findings is a non-empty array unless inspection_type == RE_INSPECTION"
        preconditions_note: "findings must be a non-empty array UNLESS inspection_type == RE_INSPECTION (a re-inspection may FAIL with no new findings, reopening abated violations)"
        side_effects:
          - "set result_recorded_at = clock now"
          - "for each finding create Violation(status=OPEN); increment Property.open_violation_count by 1 per created Violation"
          - "CASCADE C1: any created Violation of severity IMMINENT_HAZARD auto-issues an AbatementOrder (see Violation OPEN->creation side effects)"
          - "if inspection_type == RE_INSPECTION: every Violation on this Property whose status == ABATED reopens to OPEN and Property.open_violation_count increments by 1 per reopened Violation"
          - "if no created/reopened Violation is IMMINENT_HAZARD and a Certificate exists for the Property: Certificate.placard_status := YELLOW"

  - entity: Violation
    initial_state: OPEN
    terminal_states: [VERIFIED]
    note: "Cyclic: OPEN -> ABATED -> (VERIFIED | OPEN). ABATED can reopen to OPEN on a failed re-inspection."
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "system: Violation creation with severity IMMINENT_HAZARD (during Inspection FAILED)"
        actor: system
        preconditions:
          - "severity == IMMINENT_HAZARD"
        side_effects:
          - "CASCADE C1 hop2: auto-create AbatementOrder(status=ISSUED, is_active=true) for this Violation"
      - from: OPEN
        to: ABATED
        trigger: "POST /abatement-orders/{id}/comply"
        actor: Inspector
        preconditions:
          - "the AbatementOrder is is_active and status == ISSUED"
          - "violation.status == OPEN"
        side_effects:
          - "set abated_at = clock now"
          - "decrement Property.open_violation_count by 1"
      - from: ABATED
        to: VERIFIED
        trigger: "POST /inspections/{id}/record-result RE_INSPECTION result=PASSED"
        actor: Inspector
        preconditions:
          - "violation.status == ABATED"
        side_effects: []
      - from: ABATED
        to: OPEN
        trigger: "POST /inspections/{id}/record-result RE_INSPECTION result=FAILED"
        actor: Inspector
        preconditions:
          - "violation.status == ABATED"
        side_effects:
          - "increment Property.open_violation_count by 1"
      - from: OPEN
        to: ESCALATED
        trigger: "system: AbatementOrder OVERDUE during POST /_ops/process-overdue-orders"
        actor: system
        preconditions:
          - "the controlling AbatementOrder transitioned ISSUED -> OVERDUE"
        side_effects:
          - "decrement Property.open_violation_count by 1 (the violation leaves OPEN)"
          - "CASCADE C2 hop2: Certificate for the Property (via Inspection.property_id) gets occupancy_status := SUSPENDED and placard_status := RED"

  - entity: AbatementOrder
    initial_state: ISSUED
    terminal_states: [COMPLIED, ESCALATED, SUPERSEDED]
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /violations/{id}/abatement-orders (a new order is issued for the same Violation)"
        actor: Inspector
        preconditions:
          - "this order is the current is_active order"
        side_effects:
          - "is_active := false"
      - from: ISSUED
        to: COMPLIED
        trigger: "POST /abatement-orders/{id}/comply"
        actor: Inspector
        preconditions:
          - "order.status == ISSUED and order.is_active == true"
        side_effects:
          - "Violation OPEN -> ABATED (see Violation)"
      - from: ISSUED
        to: OVERDUE
        trigger: "POST /_ops/process-overdue-orders (clock now > deadline)"
        actor: system
        preconditions:
          - "order.status == ISSUED and order.is_active == true and clock now > deadline"
        side_effects:
          - "CASCADE C2 hop1: Violation OPEN -> ESCALATED"
      - from: OVERDUE
        to: ESCALATED
        trigger: "POST /_ops/process-overdue-orders (same sweep, after Violation escalates)"
        actor: system
        preconditions:
          - "order became OVERDUE in this sweep"
        side_effects: []

  - entity: Permit
    initial_state: ISSUED
    terminal_states: [REVOKED]
    transitions:
      - from: ISSUED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: FireMarshal
        preconditions:
          - "permit.status == ISSUED"
        side_effects:
          - "PermitApplication.refunded_cents += final_fee_cents"
          - "Property.fees_paid_cents -= final_fee_cents"
          - "CASCADE: Certificate for the Property occupancy_status := REVOKED, placard_status := RED"

  - entity: Certificate
    initial_state: VALID
    terminal_states: [REVOKED]
    note: "PARALLEL: occupancy_status axis (VALID/SUSPENDED/REVOKED) and placard_status axis (GREEN/YELLOW/RED) advance from different triggers."
    transitions:
      - from: VALID
        to: SUSPENDED
        trigger: "CASCADE C1 hop3 (AbatementOrder IMMINENT auto-issue) or CASCADE C2 hop2 (Violation ESCALATED)"
        actor: system
        preconditions:
          - "a controlling IMMINENT_HAZARD AbatementOrder was issued, or a Violation on the Property escalated"
        side_effects:
          - "placard_status := RED"
      - from: SUSPENDED
        to: VALID
        trigger: "POST /certificates/{id}/reinstate"
        actor: FireMarshal
        preconditions:
          - "no Violation on the Property (via Inspection.property_id) is in status OPEN or ESCALATED"
        side_effects:
          - "placard_status := GREEN"
      - from: VALID
        to: REVOKED
        trigger: "CASCADE: POST /permits/{id}/revoke"
        actor: system
        preconditions:
          - "the revoked Permit's application shares this Certificate's Property"
        side_effects:
          - "placard_status := RED"
      - from: SUSPENDED
        to: REVOKED
        trigger: "CASCADE: POST /permits/{id}/revoke"
        actor: system
        preconditions:
          - "the revoked Permit's application shares this Certificate's Property"
        side_effects:
          - "placard_status := RED"

concurrency_rules:
  - rule_id: abatement-order-supersede-stale-violation
    parent_entity: Violation
    write_endpoint: "POST /violations/{id}/abatement-orders"
    occ_field: "expected_violation_version"
    description: |
      Issuing a new AbatementOrder against a Violation whose version has advanced
      since the client last observed it is rejected. A new order legitimately
      supersedes the prior is_active order (an extension/re-issue), so a second
      issuance is not blocked by any state precondition — the Violation is still
      OPEN. The stale-version check is what distinguishes the loser: its view of
      the Violation predates the first issuance that already superseded the order.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: permit_fee
    trigger: "estimated at POST /permit-applications/{id}/submit; final at POST /permits"
    algorithm: tiered_pricing
    formula: |
      base = BASE_PERMIT_FEE_CENTS[permit_type]
      c1 = round_half_up(project_valuation_cents * VALUATION_RATE)      # per-component rounding
      c2 = round_half_up(project_valuation_cents * STATE_SURCHARGE_RATE)
      c3 = round_half_up(project_valuation_cents * TECH_FEE_RATE)
      surcharge = RESUBMIT_SURCHARGE_CENTS * effective_resubmit_count
      fee = base + c1 + c2 + c3 + surcharge
      # ORDER IS PINNED: round EACH of c1,c2,c3 to whole cents FIRST, THEN sum.
      # "sum then round" is explicitly WRONG (produces a different total).
    input_set: "single PermitApplication; permit_type, project_valuation_cents, resubmit_count"
    constants:
      BASE_PERMIT_FEE_CENTS: { CONSTRUCTION: 20000, TENANT_IMPROVEMENT: 10000, HAZMAT: 30000, TANK: 25000 }
      VALUATION_RATE: 0.005
      STATE_SURCHARGE_RATE: 0.001
      TECH_FEE_RATE: 0.0004
      RESUBMIT_SURCHARGE_CENTS: 5000
    precision: "whole cents; round_half_up applied PER COMPONENT (c1,c2,c3) before summation"
    variants:
      - name: estimated
        when: "at submit"
        difference: "effective_resubmit_count is fixed at 0; stored in estimated_fee_cents and frozen"
      - name: final
        when: "at permit issuance"
        difference: "effective_resubmit_count = application.resubmit_count (actual); stored in final_fee_cents"

  - name: occupant_load
    trigger: "on Property create (POST /properties) and update (PATCH /properties/{id})"
    algorithm: threshold
    formula: |
      factor = OCCUPANT_LOAD_FACTOR[occupancy_classification]   # sqft per person
      design_occupant_load = floor(total_floor_area_sqft / factor)            # GROSS
      occupant_load        = floor((total_floor_area_sqft * NET_AREA_RATIO) / factor)  # NET
    input_set: "single Property; total_floor_area_sqft, occupancy_classification"
    constants:
      OCCUPANT_LOAD_FACTOR: { ASSEMBLY: 7, BUSINESS: 150, EDUCATIONAL: 20, FACTORY: 100, HIGH_HAZARD: 100, INSTITUTIONAL: 240, MERCANTILE: 60, RESIDENTIAL: 200, STORAGE: 500, UTILITY: 300 }
      NET_AREA_RATIO: 0.85
    precision: "integer, floor"
    variants:
      - name: posted_net
        when: "posted occupant_load used for exit requirements"
        difference: "multiplies area by NET_AREA_RATIO (0.85) before dividing"
      - name: design_gross
        when: "design_occupant_load for structural/design reference"
        difference: "uses gross area (no NET_AREA_RATIO); yields a larger number"

  - name: required_exits
    trigger: "on Property create/update, after occupant_load computed"
    algorithm: threshold
    formula: |
      if occupant_load >= 1000: required_exits = 4
      elif occupant_load >= 500: required_exits = 3
      elif occupant_load >= 50:  required_exits = 2
      else:                      required_exits = 1
      # Boundaries are inclusive-at-lower (>=): 49 -> 1 exit, 50 -> 2 exits.
    input_set: "single Property; occupant_load (posted_net)"
    constants:
      EXIT_T1: 50
      EXIT_T2: 500
      EXIT_T3: 1000
    precision: "integer"

  - name: required_fire_flow_gpm
    trigger: "on Property create/update"
    algorithm: tiered_pricing
    formula: |
      area_factor = CONSTRUCTION_FACTOR[construction_type]       # I/II=0.8, III/IV=1.0, V=1.5
      hazard_mult = OCCUPANCY_HAZARD_MULT[occupancy_classification]
      raw = total_floor_area_sqft * FLOW_COEFF * area_factor * hazard_mult
      clamped = min(max(raw, FLOW_MIN_GPM), FLOW_MAX_GPM)        # nested min/max
      required_fire_flow_gpm = ceil(clamped / FLOW_STEP) * FLOW_STEP   # round up to 250
    input_set: "single Property; total_floor_area_sqft, construction_type, occupancy_classification"
    constants:
      FLOW_COEFF: 0.09
      CONSTRUCTION_FACTOR: { TYPE_I: 0.8, TYPE_II: 0.8, TYPE_III: 1.0, TYPE_IV: 1.0, TYPE_V: 1.5 }
      OCCUPANCY_HAZARD_MULT: { HIGH_HAZARD: 1.5, STORAGE: 1.25, FACTORY: 1.25, ASSEMBLY: 1.0, INSTITUTIONAL: 1.0, EDUCATIONAL: 1.0, BUSINESS: 0.75, MERCANTILE: 0.75, RESIDENTIAL: 0.75, UTILITY: 0.75 }
      FLOW_MIN_GPM: 500
      FLOW_MAX_GPM: 8000
      FLOW_STEP: 250
    precision: "integer gpm, rounded UP to nearest 250"

  - name: flow_available_at_20psi
    trigger: "on POST /flow-tests"
    algorithm: weighted_scoring
    formula: |
      # Hazen-Williams style projection of available fire flow to 20 psi residual.
      ratio = (static_psi - 20) / (static_psi - residual_psi)
      available_flow_at_20psi = round_half_up( measured_flow_gpm * (ratio ** 0.54) )
    input_set: "single FlowTest; static_psi, residual_psi, measured_flow_gpm"
    constants:
      RESIDUAL_TARGET_PSI: 20
      HW_EXPONENT: 0.54
    precision: "integer gpm, round_half_up"

  - name: abatement_deadline
    trigger: "on AbatementOrder creation (manual POST /violations/{id}/abatement-orders or cascade C1)"
    algorithm: threshold
    formula: |
      grace = ABATEMENT_GRACE_DAYS[violation.severity]
      deadline = issued_at + grace days
    input_set: "single AbatementOrder + parent Violation.severity"
    constants:
      ABATEMENT_GRACE_DAYS: { IMMINENT_HAZARD: 3, MAJOR: 30, MINOR: 90 }
    precision: "datetime (UTC)"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "each path/body-referenced resource exists (validated left-to-right)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: business_referential
    check: "for Applicant-owned actions (submit, pay-fee, resubmit-corrections), X-User-ID == application.applicant_user_id"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /permit-applications/{id}/submit, /pay-fee, /plan-reviews/{id}/resubmit-corrections"
  - priority: 5
    category: business_constraint
    check: "required body fields present and well-typed"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes"
  - priority: 6
    category: business_constraint
    check: "enum body fields carry a declared enum member"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all writes with enum inputs"
  - priority: 7
    category: business_constraint
    check: "COMPLAINT inspection requires complaint_description; HAZMAT/TANK application submit requires flow_test_id"
    error_id: ERR_MISSING_CONDITIONAL_FIELD
    http_status: 422
    applies_to: "POST /inspections, POST /permit-applications/{id}/submit"
  - priority: 8
    category: state
    check: "operation is legal from the resource's current state (generic)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transitions"
  - priority: 9
    category: state
    check: "on POST /permits the application.status == APPROVED"
    error_id: ERR_APPLICATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /permits"
  - priority: 10
    category: state
    check: "on POST /plan-reviews/{id}/discipline-decision the named axis is currently UNDER_REVIEW"
    error_id: ERR_REVIEW_INCOMPLETE
    http_status: 409
    applies_to: "POST /plan-reviews/{id}/discipline-decision"
  - priority: 11
    category: business_safety
    check: "Certificate issuance/reinstate requires no Violation on the Property in OPEN or ESCALATED"
    error_id: ERR_OPEN_VIOLATIONS
    http_status: 409
    applies_to: "POST /certificates, POST /certificates/{id}/reinstate"
  - priority: 12
    category: business_temporal
    check: "flow test window [test_date, test_date+365d) must not overlap an existing FlowTest window on the same hydrant (adjacency at the boundary is allowed: an existing window ending exactly at the new test_date is NOT an overlap)"
    error_id: ERR_FLOW_TEST_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /flow-tests"
  - priority: 13
    category: business_temporal
    check: "a new inspection's scheduled_date must be at least INSPECTION_BUFFER_DAYS (14) from any other non-terminal inspection on the same Property; symmetric buffer: reject if abs(days between) < 14"
    error_id: ERR_INSPECTION_TOO_CLOSE
    http_status: 409
    applies_to: "POST /inspections"
  - priority: 14
    category: business_constraint
    check: "flow test readings valid: 20 < residual_psi < static_psi and measured_flow_gpm > 0"
    error_id: ERR_INVALID_FLOW_READINGS
    http_status: 422
    applies_to: "POST /flow-tests"
  - priority: 15
    category: business_constraint
    check: "HAZMAT/TANK application submit: referenced FlowTest.available_flow_at_20psi >= Property.required_fire_flow_gpm"
    error_id: ERR_INSUFFICIENT_FIRE_FLOW
    http_status: 409
    applies_to: "POST /permit-applications/{id}/submit"
  - priority: 16
    category: business_fiscal
    check: "on POST /permits, application.amount_paid_cents >= final_fee_cents"
    error_id: ERR_FEE_UNPAID
    http_status: 402
    applies_to: "POST /permits"
  - priority: 17
    category: state
    check: "OCC: expected_violation_version == Violation.version on POST /violations/{id}/abatement-orders"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /violations/{id}/abatement-orders"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Property ---
  - method: POST
    path: "/api/properties"
    description: "Register a property/building"
    roles: [Applicant, FireMarshal]
    code: 201
    input: [address, owner_name, occupancy_classification, construction_type, total_floor_area_sqft, stories]
    output: Property
    side_effects: ["compute occupant_load, design_occupant_load, required_exits, required_fire_flow_gpm"]
  - method: GET
    path: "/api/properties/{id}"
    description: "Fetch a property"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: PATCH
    path: "/api/properties/{id}"
    description: "Amend property attributes; recomputes derived fields"
    roles: [Applicant, FireMarshal]
    code: 200
    input: ["total_floor_area_sqft?", "occupancy_classification?", "construction_type?", "stories?"]
    output: Property
    side_effects: ["recompute occupant_load, design_occupant_load, required_exits, required_fire_flow_gpm"]

  # --- PermitApplication ---
  - method: POST
    path: "/api/permit-applications"
    description: "Open a permit application (DRAFT)"
    roles: [Applicant]
    code: 201
    input: [property_id, applicant_user_id, permit_type, project_valuation_cents, scope_area_sqft, "flow_test_id?"]
    output: PermitApplication
    side_effects: []
  - method: GET
    path: "/api/permit-applications/{id}"
    description: "Fetch an application"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []
  - method: GET
    path: "/api/permit-applications"
    description: "List applications (reverse-reachability for property_id and flow_test_id)"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: ["property_id?", "flow_test_id?", "status?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []
  - method: POST
    path: "/api/permit-applications/{id}/submit"
    description: "Submit for plan review; freezes estimated fee, opens PlanReview"
    roles: [Applicant]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["compute estimated_fee_cents (variant estimated)", "create PlanReview (3 axes UNDER_REVIEW)", "status DRAFT -> UNDER_REVIEW"]
  - method: POST
    path: "/api/permit-applications/{id}/pay-fee"
    description: "Record a fee payment toward the application"
    roles: [Applicant]
    code: 200
    input: [amount_cents]
    output: PermitApplication
    side_effects: ["amount_paid_cents += amount_cents"]

  # --- PlanReview ---
  - method: GET
    path: "/api/plan-reviews/{id}"
    description: "Fetch a plan review"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: []
    output: PlanReview
    side_effects: []
  - method: GET
    path: "/api/plan-reviews"
    description: "List plan reviews (reverse-reachability for application_id)"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: PlanReview[]
    side_effects: []
  - method: POST
    path: "/api/plan-reviews/{id}/discipline-decision"
    description: "Record a discipline decision on one axis"
    roles: [PlanReviewer]
    code: 200
    input: [discipline, decision]
    output: PlanReview
    side_effects: ["set named axis", "if CORRECTIONS_REQUIRED -> application CORRECTIONS_REQUIRED", "if all axes APPROVED -> overall_status APPROVED and application APPROVED"]
  - method: POST
    path: "/api/plan-reviews/{id}/resubmit-corrections"
    description: "Applicant resubmits corrected plans"
    roles: [Applicant]
    code: 200
    input: []
    output: PlanReview
    side_effects: ["axes in CORRECTIONS_REQUIRED -> UNDER_REVIEW", "correction_cycles += 1", "application.resubmit_count += 1", "application CORRECTIONS_REQUIRED -> UNDER_REVIEW"]

  # --- Permit ---
  - method: POST
    path: "/api/permits"
    description: "Issue a permit for an approved, paid application"
    roles: [FireMarshal]
    code: 201
    input: [application_id]
    output: Permit
    side_effects: ["compute final_fee_cents (variant final)", "application APPROVED -> ISSUED", "Property.fees_paid_cents += final_fee_cents"]
  - method: GET
    path: "/api/permits/{id}"
    description: "Fetch a permit"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/api/permits"
    description: "List permits (reverse-reachability for application_id)"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/api/permits/{id}/revoke"
    description: "Revoke a permit and refund its fee"
    roles: [FireMarshal]
    code: 200
    input: []
    output: Permit
    side_effects: ["status ISSUED -> REVOKED", "application.refunded_cents += final_fee_cents", "Property.fees_paid_cents -= final_fee_cents", "CASCADE: Certificate for the Property occupancy_status -> REVOKED, placard_status -> RED"]

  # --- Certificate ---
  - method: POST
    path: "/api/certificates"
    description: "Issue a certificate of occupancy"
    roles: [FireMarshal]
    code: 201
    input: [property_id]
    output: Certificate
    side_effects: ["occupancy_status=VALID, placard_status=GREEN"]
  - method: GET
    path: "/api/certificates/{id}"
    description: "Fetch a certificate"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/api/certificates"
    description: "List certificates (reverse-reachability for property_id)"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: POST
    path: "/api/certificates/{id}/reinstate"
    description: "Reinstate a suspended certificate"
    roles: [FireMarshal]
    code: 200
    input: []
    output: Certificate
    side_effects: ["occupancy_status SUSPENDED -> VALID", "placard_status -> GREEN"]

  # --- Inspection ---
  - method: POST
    path: "/api/inspections"
    description: "Schedule a periodic/complaint/re/final inspection"
    roles: [Inspector]
    code: 201
    input: [property_id, inspection_type, scheduled_date, "complaint_description?"]
    output: Inspection
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/api/inspections/{id}"
    description: "Fetch an inspection"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/api/inspections"
    description: "List inspections (reverse-reachability for property_id)"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: ["property_id?", "status?", "inspection_type?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/api/inspections/{id}/record-result"
    description: "Record inspection outcome; on FAILED creates violations and cascades"
    roles: [Inspector]
    code: 200
    input: [result, "findings?"]
    output: Inspection
    side_effects: ["PASSED or FAILED", "on FAILED: create Violations, adjust open_violation_count, CASCADE C1 for IMMINENT", "RE_INSPECTION PASSED verifies abated; RE_INSPECTION FAILED reopens abated"]

  # --- Violation ---
  - method: GET
    path: "/api/violations/{id}"
    description: "Fetch a violation"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: []
    output: Violation
    side_effects: []
  - method: GET
    path: "/api/violations"
    description: "List violations (reverse-reachability for inspection_id)"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: ["inspection_id?", "property_id?", "status?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []
  - method: POST
    path: "/api/violations/{id}/abatement-orders"
    description: "Issue (or re-issue/supersede) an abatement order for a violation"
    roles: [Inspector]
    code: 201
    input: [expected_violation_version]
    output: AbatementOrder
    side_effects: ["OCC check on expected_violation_version", "prior is_active order -> SUPERSEDED", "create AbatementOrder(ISSUED, is_active=true)", "increments Violation.version by 1"]

  # --- AbatementOrder ---
  - method: GET
    path: "/api/abatement-orders/{id}"
    description: "Fetch an abatement order"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: []
    output: AbatementOrder
    side_effects: []
  - method: GET
    path: "/api/abatement-orders"
    description: "List abatement orders (reverse-reachability for violation_id)"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: ["violation_id?", "status?", "limit?", "offset?"]
    output: AbatementOrder[]
    side_effects: []
  - method: POST
    path: "/api/abatement-orders/{id}/comply"
    description: "Mark an abatement order complied"
    roles: [Inspector]
    code: 200
    input: []
    output: AbatementOrder
    side_effects: ["status ISSUED -> COMPLIED", "Violation OPEN -> ABATED", "Property.open_violation_count -= 1"]

  # --- Hydrant ---
  - method: POST
    path: "/api/hydrants"
    description: "Register a hydrant"
    roles: [Inspector, FireMarshal]
    code: 201
    input: [property_id, location_desc, main_size_inches]
    output: Hydrant
    side_effects: []
  - method: GET
    path: "/api/hydrants/{id}"
    description: "Fetch a hydrant"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: []
    output: Hydrant
    side_effects: []
  - method: GET
    path: "/api/hydrants"
    description: "List hydrants (reverse-reachability for property_id)"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: Hydrant[]
    side_effects: []

  # --- FlowTest ---
  - method: POST
    path: "/api/flow-tests"
    description: "Record a hydrant flow test"
    roles: [Inspector]
    code: 201
    input: [hydrant_id, test_date, static_psi, residual_psi, measured_flow_gpm]
    output: FlowTest
    side_effects: ["temporal overlap + readings validation", "compute available_flow_at_20psi, valid_until"]
  - method: GET
    path: "/api/flow-tests/{id}"
    description: "Fetch a flow test"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: []
    output: FlowTest
    side_effects: []
  - method: GET
    path: "/api/flow-tests"
    description: "List flow tests (reverse-reachability for hydrant_id)"
    roles: [Applicant, PlanReviewer, Inspector, FireMarshal]
    code: 200
    input: ["hydrant_id?", "limit?", "offset?"]
    output: FlowTest[]
    side_effects: []

  # --- Ops / Clock (test-driving) ---
  - method: POST
    path: "/api/_ops/process-overdue-orders"
    description: "Sweep ISSUED active abatement orders whose deadline < clock now: mark OVERDUE and cascade (Violation ESCALATED, Certificate SUSPENDED/RED)"
    roles: [FireMarshal]
    code: 200
    input: []
    output: { processed_count: integer, escalated_violation_ids: "string[]" }
    side_effects: ["AbatementOrder ISSUED -> OVERDUE -> ESCALATED", "CASCADE C2: Violation OPEN -> ESCALATED, Certificate occupancy SUSPENDED + placard RED"]
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock time."
    roles: [FireMarshal]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock := to_iso8601"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Applicant X-User-ID != application.applicant_user_id on an owned action"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "property id does not resolve"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "application id does not resolve"
  - id: ERR_PLAN_REVIEW_NOT_FOUND
    http: 404
    condition: "plan review id does not resolve"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "permit id does not resolve"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection id does not resolve"
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "violation id does not resolve"
  - id: ERR_ABATEMENT_ORDER_NOT_FOUND
    http: 404
    condition: "abatement order id does not resolve"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "certificate id does not resolve"
  - id: ERR_HYDRANT_NOT_FOUND
    http: 404
    condition: "hydrant id does not resolve"
  - id: ERR_FLOW_TEST_NOT_FOUND
    http: 404
    condition: "flow test id does not resolve"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing/malformed required body field"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "enum field carries an undeclared member"
  - id: ERR_MISSING_CONDITIONAL_FIELD
    http: 422
    condition: "COMPLAINT inspection without complaint_description, or HAZMAT/TANK submit without flow_test_id"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "operation illegal from the resource's current state"
  - id: ERR_APPLICATION_NOT_APPROVED
    http: 409
    condition: "permit issuance while application.status != APPROVED"
  - id: ERR_REVIEW_INCOMPLETE
    http: 409
    condition: "discipline-decision on an axis not currently UNDER_REVIEW"
  - id: ERR_OPEN_VIOLATIONS
    http: 409
    condition: "certificate issuance/reinstate with an OPEN or ESCALATED violation on the property"
  - id: ERR_FLOW_TEST_WINDOW_OVERLAP
    http: 409
    condition: "new flow test window overlaps an existing window on the same hydrant"
  - id: ERR_INSPECTION_TOO_CLOSE
    http: 409
    condition: "inspection scheduled within 14 days of another non-terminal inspection on the property"
  - id: ERR_INVALID_FLOW_READINGS
    http: 422
    condition: "not 20 < residual_psi < static_psi, or measured_flow_gpm <= 0"
  - id: ERR_INSUFFICIENT_FIRE_FLOW
    http: 409
    condition: "HAZMAT/TANK submit: referenced flow test available flow < property required fire flow"
  - id: ERR_FEE_UNPAID
    http: 402
    condition: "permit issuance while amount_paid_cents < final_fee_cents"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_violation_version != Violation.version on abatement order issuance"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Applicant
    description: "Property owner / permit applicant"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/permit-applications"
      - "POST /api/permit-applications/{id}/submit"
      - "POST /api/permit-applications/{id}/pay-fee"
      - "POST /api/plan-reviews/{id}/resubmit-corrections"
    shared_operations:
      - "POST /api/properties (with FireMarshal)"
      - "PATCH /api/properties/{id} (with FireMarshal)"
      - "all GET reads"
  - name: PlanReviewer
    description: "Fire protection engineer reviewing disciplines"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/plan-reviews/{id}/discipline-decision"
    shared_operations:
      - "all GET reads"
  - name: Inspector
    description: "Field fire inspector"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/inspections"
