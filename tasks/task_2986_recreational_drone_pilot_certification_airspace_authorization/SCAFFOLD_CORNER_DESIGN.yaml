            - "One APPROVED authorization on the class C zone for 2026-05-20T09:00:00Z .. 2026-05-20T12:00:00Z, granted_ceiling_ft 400, holding one slot."
            - "Flight X: PLANNED in the class C zone citing that authorization, 2026-05-20 09:30-10:30."
            - "Flight Y: PLANNED in the class G zone citing no authorization, 2026-05-21 09:00-10:00."
