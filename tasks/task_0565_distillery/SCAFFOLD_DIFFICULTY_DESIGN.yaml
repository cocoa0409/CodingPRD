        grounds:
          - calculations.excise_tax
          - entities.Distillery.fields.cbma_pg_removed_ytd
          - entities.TaxRemoval.fields.standard_rate_pg
        distinguishing_aspect: "Numeric-threshold boundary on cbma_pg_removed_ytd via POST /dsp/tax-removals: at ytd 99999.5 a 6.0-pg removal splits 0.5 reduced + 5.5 standard (the 100000th pg still reduced)."
        test_recipe:
          setup:
            - "COMPLETED 10-case run (11.9 pg); cbma_pg_removed_ytd seeded to 99999.5."
          setup_api_calls:
            - { call: "POST /dsp/distilleries", payload: { name: "Bench DSP", dsp_permit_number: "DSP-CA-11", state_code: "CA" }, as: ComplianceOfficer, captures: { dist_id: $.data.id } }
