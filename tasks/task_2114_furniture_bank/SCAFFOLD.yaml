scenario: "desgin task harder than expert level.!!!! 2114. Furniture Bank & Household Goods Distribution (local furniture bank): donation pickup scheduling & item acceptance criteria, warehouse inventory by category & condition, client referral from case managers & voucher allocation, delivery scheduling & truck/crew routing, delivery fee/subsidy & no-show policy, bed bug prevention protocol & quarantine, volunteer & moving labor coordination, unmet-need waitlist reporting"
domain_name: "furniture-bank-distribution"
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Peer entities linked by foreign keys. Only five read paths are nested
  # (`/vouchers/{id}/lines`, `/vouchers/{id}/stops`, `/donation-offers/{id}/items`,
  # `/delivery-runs/{id}/stops`, `/delivery-runs/{id}/crew`,
  # `/volunteers/{id}/crew-assignments`); every write path is a flat top-level
  # collection or a flat action on one. No ownership tree exists: a Voucher, a
  # DeliveryRun and a DonationOffer are peers that meet through InventoryItem.

  state_machine_shape: cyclic
  # Referral runs SUBMITTED -> RETURNED -> SUBMITTED revision rounds (bounded by
  # MAX_REVISIONS). Voucher carries two independent state axes (`status` for
  # fulfillment, `fee_status` for billing) that advance on different triggers.
  # InventoryItem cycles AVAILABLE -> RESERVED -> STAGED -> AVAILABLE when a
  # delivery attempt fails.

  relationship_patterns:
    - one_to_many          # PartnerAgency -> Client -> Referral -> Voucher -> VoucherLine
    - many_to_many         # DeliveryStop joins Voucher x DeliveryRun; CrewAssignment joins Volunteer x DeliveryRun
    - self_referential     # DeliveryRun.rescheduled_from_run_id -> DeliveryRun.id
    - cross_aggregate      # InventoryItem.reserved_for_voucher_line_id crosses the donation aggregate into the referral aggregate

  role_model: segregation_of_duties
  # The WarehouseLead who records an intake inspection (and is stamped onto
  # DonationOffer.inspector_user_id) may never be the WarehouseLead who releases
  # that same offer from bed-bug quarantine. CaseManager is additionally scoped:
  # X-User-ID must equal the PartnerAgency that owns the client/referral/voucher.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Global constants referenced by state machines, validations and endpoints.
# Calculation-local constants live inside their own `calculations[].constants`.
# ---------------------------------------------------------------------------
global_constants:
  CLOCK_DEFAULT_UTC: "2026-08-01T00:00:00Z"   # logical clock reading before any POST /_clock/set_current_utc
  REFERRAL_VALID_DAYS: 45                     # approved_at -> expires_at window
  MAX_REVISIONS: 2                            # RETURNED -> SUBMITTED rounds allowed per referral
  STRIKE_BAN_THRESHOLD: 2                     # no_show_strikes that trip the household ban
  BAN_DAYS: 90                                # length of Client.delivery_ban_until
  BED_BUG_REMEDIATION_DAYS: 60                # CONFIRMED -> REMEDIATED dwell, measured from bed_bug_confirmed_at
  QUARANTINE_DAYS_STANDARD: 14                # soft-surface intake with no live pest
  QUARANTINE_DAYS_LIVE_PEST: 21               # any intake where live_pest_observed fired
  TRUCK_LOCKOUT_HOURS: 72                     # Truck.bed_bug_lockout_until horizon
  MIN_FILL_RATIO_TO_SCHEDULE: 0.5             # inclusive floor for booking a PARTIALLY_ALLOCATED voucher
  VOLUNTEER_REST_BUFFER_MINUTES: 60           # closed-interval rest buffer between a volunteer's runs
  RUN_HOURS: 4.0                              # hours credited per CONFIRMED crew assignment
  RELIABILITY_NO_SHOW_PENALTY: 15.0           # reliability_score deduction per crew no-show

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: PartnerAgency
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the referring social-service agency
        constraints: "non-empty, 1..120 chars"
      - name: county
        type: enum
        source: input
        description: county the agency operates in
        constraints: "one of NORTH, CENTRAL, SOUTH"
      - name: quarterly_voucher_quota
        type: integer
        source: input
        description: maximum number of Referrals this agency may have APPROVED within one quota epoch
        constraints: ">= 1"
      - name: quota_used
        type: integer
        source: computed
        description: count of Referrals of this agency whose status is APPROVED or FULFILLED and whose approved_epoch equals this agency's quota_epoch
        default: 0
      - name: quota_epoch
        type: integer
        source: system
        description: quota accounting period counter; advanced only by POST /_ops/run-cycle with advance_quota_epoch true
        default: 1
      - name: standing
        type: enum
        source: computed
        description: derived compliance standing recomputed by agency_standing_recompute
        default: GOOD
        constraints: "one of GOOD, PROBATION, SUSPENDED"
      - name: no_show_credits_owed_cents
        type: integer
        source: computed
        description: running ledger of no-show / refusal chargebacks owed by this agency
        default: 0

  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> PartnerAgency.id; the agency whose case managers own this household"
      - name: household_size
        type: integer
        source: input
        description: number of people in the household; drives the subsidy tier
        constraints: ">= 1 and <= 12"
      - name: county
        type: enum
        source: input
        description: county the household lives in; drives the provisional base delivery fee
        constraints: "one of NORTH, CENTRAL, SOUTH"
      - name: has_infant
        type: boolean
        source: input
        description: household includes a child under 24 months; adds a subsidy bonus
        default: false
      - name: bed_bug_status
        type: enum
        source: computed
        description: bed-bug protocol status of the residence
        default: CLEAR
        constraints: "one of CLEAR, CONFIRMED, REMEDIATED"
      - name: bed_bug_confirmed_at
        type: datetime
        source: computed
        description: logical-clock instant at which bed_bug_status became CONFIRMED; null otherwise
        default: null
      - name: no_show_strikes
        type: integer
        source: computed
        description: count of NO_SHOW delivery stops charged to this household in the current strike cycle
        default: 0
      - name: delivery_ban_until
        type: datetime
        source: computed
        description: logical-clock instant before which no new DeliveryStop may be created for this household; null when unbanned
        default: null
      - name: lifetime_vouchers_delivered
        type: integer
        source: computed
        description: count of DeliveryStops for this household that reached DELIVERED
        default: 0
      - name: status
        type: enum
        source: computed
        description: household eligibility gate
        default: ACTIVE
        constraints: "one of ACTIVE, ON_HOLD"

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; household being referred"
      - name: agency_id
        type: string
        source: input
        description: "FK -> PartnerAgency.id; must equal Client.agency_id"
      - name: requested_categories
        type: array
        source: input
        description: list of household-goods categories the case manager is requesting
        constraints: "non-empty; each element one of BED, SOFA, CRIB, TABLE_SET, DRESSER, KITCHEN_KIT, LINENS"
      - name: urgency
        type: enum
        source: input
        description: case manager's urgency banding; weights the priority score
        constraints: "one of ROUTINE, PRIORITY, EMERGENCY"
      - name: home_visit_completed
        type: boolean
        source: input
        description: case manager physically visited the residence
        default: false
      - name: bed_bug_attestation
        type: boolean
        source: input
        description: case manager attests there is no active infestation at the residence
      - name: status
        type: enum
        source: computed
        description: referral lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, RETURNED, APPROVED, DENIED, EXPIRED, FULFILLED"
      - name: revision_count
        type: integer
        source: computed
        description: number of times this referral has been resubmitted after a RETURNED decision
        default: 0
      - name: priority_score
        type: number
        source: computed
        description: need score from client_referral_priority_score, intake_score variant; one decimal place
        default: 0.0
      - name: approved_at
        type: datetime
        source: computed
        description: logical-clock instant of the APPROVE decision; null before approval
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: approved_at plus REFERRAL_VALID_DAYS; null before approval
        default: null
      - name: approved_epoch
        type: integer
        source: computed
        description: the agency's quota_epoch captured at the moment of approval; null before approval
        default: null
      - name: review_note
        type: string
        source: computed
        description: last reviewer note recorded by POST /referrals/{id}/review
        default: null

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the approved referral this voucher redeems"
      - name: status
        type: enum
        source: computed
        description: fulfillment axis of the voucher
        default: ISSUED
        constraints: "one of ISSUED, PARTIALLY_ALLOCATED, ALLOCATED, SCHEDULED, DELIVERED, CANCELLED, EXPIRED"
      - name: fee_status
        type: enum
        source: computed
        description: billing axis of the voucher; advances independently of status
        default: PENDING
        constraints: "one of PENDING, WAIVED, INVOICED, PAID, WRITTEN_OFF"
      - name: gross_fee_cents
        type: integer
        source: computed
        description: gross delivery fee from voucher_delivery_fee before subsidy
        default: 0
      - name: subsidy_cents
        type: integer
        source: computed
        description: subsidised portion of gross_fee_cents
        default: 0
      - name: client_due_cents
        type: integer
        source: computed
        description: gross_fee_cents minus subsidy_cents; what the household owes
        default: 0
      - name: fee_basis
        type: enum
        source: computed
        description: which voucher_delivery_fee variant produced the current money fields
        default: null
        constraints: "one of PROVISIONAL, FINAL, or null before the first allocation"
      - name: fill_ratio
        type: number
        source: computed
        description: sum of VoucherLine.quantity_allocated divided by sum of VoucherLine.quantity_requested, three decimals
        default: 0.0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: cash recorded against this voucher by fee-settlement RECORD_PAYMENT
        default: 0

  - name: VoucherLine
    parent: Voucher
    common_fields: true
    fields:
      - name: voucher_id
        type: string
        source: system
        description: "FK -> Voucher.id; owning voucher"
      - name: category
        type: enum
        source: input
        description: household-goods category requested on this line
        constraints: "one of BED, SOFA, CRIB, TABLE_SET, DRESSER, KITCHEN_KIT, LINENS"
      - name: quantity_requested
        type: integer
        source: input
        description: units requested on this line
        constraints: ">= 1 and <= 6"
      - name: min_condition
        type: enum
        source: input
        description: worst condition grade the household will accept on this line
        constraints: "one of A, B, C"
      - name: quantity_allocated
        type: integer
        source: computed
        description: count of InventoryItems currently held for this line in status RESERVED, STAGED or DELIVERED
        default: 0
      - name: status
        type: enum
        source: computed
        description: line fill state
        default: OPEN
        constraints: "one of OPEN, PARTIAL, FILLED, WAITLISTED, CANCELLED"

  - name: DonationOffer
    parent: null
    common_fields: true
    fields:
      - name: donor_name
        type: string
        source: input
        description: donor contact name
        constraints: "non-empty"
      - name: donor_phone
        type: string
        source: input
        description: donor contact phone
        constraints: "non-empty"
      - name: pickup_county
        type: enum
        source: input
        description: county the donation must be collected from
        constraints: "one of NORTH, CENTRAL, SOUTH"
      - name: pickup_window_start
        type: datetime
        source: input
        description: inclusive start of the donor's pickup availability window
      - name: pickup_window_end
        type: datetime
        source: input
        description: exclusive end of the donor's pickup availability window
        constraints: "strictly greater than pickup_window_start"
      - name: truck_id
        type: string
        source: system
        description: "FK -> Truck.id; null until POST /donation-offers/{id}/schedule-pickup assigns a truck"
        default: null
      - name: status
        type: enum
        source: computed
        description: donation intake lifecycle state
        default: OFFERED
        constraints: "one of OFFERED, TRIAGED, PICKUP_SCHEDULED, INSPECTED, QUARANTINED, RELEASED, REJECTED"
      - name: accepted_item_count
        type: integer
        source: computed
        description: count of DonationItems on this offer whose decision is ACCEPTED
        default: 0
      - name: rejected_item_count
        type: integer
        source: computed
        description: count of DonationItems on this offer whose decision is REJECTED
        default: 0
      - name: declared_soft_ratio
        type: number
        source: computed
        description: pre-decision snapshot of soft-surface items over all submitted items, three decimals
        default: 0.0
      - name: bed_bug_risk_score
        type: number
        source: computed
        description: post-decision soft-surface share of accepted cubic feet, expressed 0.0-100.0 with one decimal
        default: 0.0
      - name: inspector_user_id
        type: string
        source: system
        description: opaque X-User-ID of the WarehouseLead who ran POST /donation-offers/{id}/intake; never equals any entity id
        default: null
      - name: quarantine_started_at
        type: datetime
        source: computed
        description: logical-clock instant quarantine began; null when the offer never quarantined
        default: null
      - name: quarantine_release_due_at
        type: datetime
        source: computed
        description: earliest logical-clock instant at which quarantine release is permitted
        default: null

  - name: DonationItem
    parent: DonationOffer
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: system
        description: "FK -> DonationOffer.id; owning offer"
      - name: category
        type: enum
        source: input
        description: household-goods category of the donated piece
        constraints: "one of BED, SOFA, CRIB, TABLE_SET, DRESSER, KITCHEN_KIT, LINENS"
      - name: declared_condition
        type: enum
        source: input
        description: condition grade the donor claims
        constraints: "one of A, B, C, D"
      - name: soft_surface
        type: boolean
        source: input
        description: upholstered or fabric-covered piece; carries bed-bug risk
      - name: cubic_feet
        type: number
        source: input
        description: stowage volume of the piece
        constraints: "> 0 and <= 200"
      - name: decision
        type: enum
        source: computed
        description: triage/intake acceptance decision
        default: PENDING
        constraints: "one of PENDING, ACCEPTED, REJECTED"
      - name: reject_reason
        type: enum
        source: computed
        description: why the piece was refused; null while decision is PENDING or ACCEPTED
        default: null
        constraints: "one of RECALLED_CRIB, CONDITION_BELOW_MIN, SOFT_SURFACE_RISK, CAPACITY"
      - name: graded_condition
        type: enum
        source: computed
        description: condition grade assigned by the WarehouseLead at intake; null before intake
        default: null
        constraints: "one of A, B, C, D"

  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - name: donation_item_id
        type: string
        source: system
        description: "FK -> DonationItem.id; the donated piece this stock unit came from"
      - name: category
        type: enum
        source: computed
        description: copied from the originating DonationItem at intake
        constraints: "one of BED, SOFA, CRIB, TABLE_SET, DRESSER, KITCHEN_KIT, LINENS"
      - name: condition
        type: enum
        source: computed
        description: copied from DonationItem.graded_condition at intake; D-graded pieces never become stock
        constraints: "one of A, B, C"
      - name: cubic_feet
        type: number
        source: computed
        description: copied from the originating DonationItem at intake
      - name: status
        type: enum
        source: computed
        description: warehouse stock state
        default: QUARANTINED
        constraints: "one of QUARANTINED, AVAILABLE, RESERVED, STAGED, DELIVERED, DISPOSED"
      - name: reserved_for_voucher_line_id
        type: string
        source: computed
        description: "FK -> VoucherLine.id; null unless status is RESERVED, STAGED or DELIVERED"
        default: null
      - name: available_since
        type: datetime
        source: computed
        description: logical-clock instant this unit most recently entered AVAILABLE; ranking key for allocation
        default: null

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: fleet label
        constraints: "non-empty, unique across trucks"
      - name: capacity_cubic_feet
        type: number
        source: input
        description: maximum stowage volume the truck may carry on one run
        constraints: "> 0"
      - name: home_county
        type: enum
        source: input
        description: county the truck is garaged in
        constraints: "one of NORTH, CENTRAL, SOUTH"
      - name: crew_minimum
        type: integer
        source: input
        description: minimum number of CONFIRMED crew before a run may leave PLANNED
        constraints: ">= 1 and <= 4"
      - name: bed_bug_lockout_until
        type: datetime
        source: computed
        description: logical-clock instant before which this truck may not be used; set when a live pest is observed at intake
        default: null

  - name: DeliveryRun
    parent: null
    common_fields: true
    fields:
      - name: truck_id
        type: string
        source: input
        description: "FK -> Truck.id; vehicle assigned to this run"
      - name: service_date
        type: string
        source: input
        description: calendar date of the run, YYYY-MM-DD
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the run's road window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the run's road window
        constraints: "strictly greater than window_start"
      - name: county
        type: enum
        source: input
        description: county actually served by this run; drives the FINAL delivery-fee variant
        constraints: "one of NORTH, CENTRAL, SOUTH"
      - name: rescheduled_from_run_id
        type: string
        source: input
        description: "FK -> DeliveryRun.id; the cancelled run this one replaces; null for an original run"
        default: null
      - name: status
        type: enum
        source: computed
        description: run lifecycle state
        default: PLANNED
        constraints: "one of PLANNED, CREWED, DISPATCHED, COMPLETED, CANCELLED"
      - name: load_cubic_feet
        type: number
        source: computed
        description: summed cubic feet of stock held for this run's SCHEDULED stops
        default: 0.0
      - name: confirmed_crew_count
        type: integer
        source: computed
        description: count of CrewAssignments on this run whose status is CONFIRMED
        default: 0
      - name: has_confirmed_driver
        type: boolean
        source: computed
        description: true when at least one CONFIRMED CrewAssignment on this run has role_on_crew DRIVER
        default: false
      - name: stop_count
        type: integer
        source: computed
        description: count of DeliveryStops on this run whose status is SCHEDULED
        default: 0

  - name: DeliveryStop
    parent: null
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: system
        description: "FK -> DeliveryRun.id; the run serving this stop"
      - name: voucher_id
        type: string
        source: input
        description: "FK -> Voucher.id; the voucher being delivered at this stop"
      - name: sequence
        type: integer
        source: input
        description: routing order within the run; unique per run
        constraints: ">= 1 and <= 40"
      - name: status
        type: enum
        source: computed
        description: stop outcome state
        default: SCHEDULED
        constraints: "one of SCHEDULED, DELIVERED, NO_SHOW, REFUSED, CANCELLED"
      - name: pest_observed_at_residence
        type: boolean
        source: computed
        description: crew reported live bed-bug evidence at the residence when recording the outcome
        default: false
      - name: chargeback_cents
        type: integer
        source: computed
        description: no_show_chargeback amount billed to the agency for this stop; 0 for DELIVERED and CANCELLED
        default: 0
      - name: outcome_recorded_at
        type: datetime
        source: computed
        description: logical-clock instant the outcome was recorded; null while SCHEDULED
        default: null

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: volunteer display name
        constraints: "non-empty"
      - name: county
        type: enum
        source: input
        description: county the volunteer serves
        constraints: "one of NORTH, CENTRAL, SOUTH"
      - name: lift_certified
        type: boolean
        source: input
        description: cleared to drive the box truck and handle heavy lifts
        default: false
      - name: reliability_score
        type: number
        source: computed
        description: starts at 100.0, loses RELIABILITY_NO_SHOW_PENALTY per crew no-show, floored at 0.0
        default: 100.0
      - name: assigned_hours_month
        type: number
        source: computed
        description: RUN_HOURS accrued per CONFIRMED crew assignment, released when the assignment leaves CONFIRMED
        default: 0.0

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: system
        description: "FK -> DeliveryRun.id; the run this volunteer is invited to"
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; the invited volunteer"
      - name: role_on_crew
        type: enum
        source: input
        description: seat on the crew
        constraints: "one of DRIVER, LIFTER"
      - name: status
        type: enum
        source: computed
        description: invitation state
        default: INVITED
        constraints: "one of INVITED, CONFIRMED, DECLINED, RELEASED, NO_SHOW"

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - name: voucher_line_id
        type: string
        source: system
        description: "FK -> VoucherLine.id; the line that could not be filled"
      - name: client_id
        type: string
        source: system
        description: "FK -> Client.id; the household still waiting"
      - name: category
        type: enum
        source: computed
        description: copied from the VoucherLine at creation
        constraints: "one of BED, SOFA, CRIB, TABLE_SET, DRESSER, KITCHEN_KIT, LINENS"
      - name: county
        type: enum
        source: computed
        description: copied from Client.county at creation; grouping key of the unmet-need report
        constraints: "one of NORTH, CENTRAL, SOUTH"
      - name: quantity_unmet
        type: integer
        source: computed
        description: units still short on the owning line
        default: 0
      - name: priority_score
        type: number
        source: computed
        description: client_referral_priority_score, waitlist_score variant; one decimal place
        default: 0.0
      - name: waiting_since
        type: datetime
        source: computed
        description: logical-clock instant this entry first entered WAITING; never reset by top-ups
      - name: status
        type: enum
        source: computed
        description: waitlist state
        default: WAITING
        constraints: "one of WAITING, PROMOTED, EXPIRED, CANCELLED"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Referral
    state_field: status
    initial_state: DRAFT
    terminal_states: [DENIED, EXPIRED, FULFILLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /referrals/{id}/submit"
        actor: CaseManager
        preconditions:
          - "referral.status == DRAFT"
          - "client.status == ACTIVE"
          - "client.bed_bug_status != CONFIRMED"
          - "referral.bed_bug_attestation == true"
          - "agency.standing != SUSPENDED"
        side_effects:
          - "recompute Referral.priority_score via client_referral_priority_score, intake_score variant"
          - "increments Referral.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /referrals/{id}/submit (revision round)"
        actor: CaseManager
        preconditions:
          - "referral.status == RETURNED"
          - "referral.revision_count < MAX_REVISIONS"
          - "client.status == ACTIVE"
          - "client.bed_bug_status != CONFIRMED"
          - "referral.bed_bug_attestation == true"
          - "agency.standing != SUSPENDED"
        side_effects:
          - "Referral.revision_count += 1"
          - "recompute Referral.priority_score via client_referral_priority_score, intake_score variant (the raised revision_count lowers the score by REVISION_PENALTY_PER_ROUND)"
          - "increments Referral.version by 1"
        note: "This edge closes the SUBMITTED -> RETURNED -> SUBMITTED cycle; MAX_REVISIONS bounds the loop."
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /referrals/{id}/review with decision RETURN"
        actor: PlatformAdmin
        preconditions:
          - "referral.status == SUBMITTED"
        side_effects:
          - "Referral.review_note = request note"
          - "increments Referral.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /referrals/{id}/review with decision APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "referral.status == SUBMITTED"
          - "agency.standing != SUSPENDED"
          - "agency.quota_used < agency.quarterly_voucher_quota"
          - "client.bed_bug_status != CONFIRMED"
        side_effects:
          - "Referral.approved_at = clock_now; Referral.expires_at = clock_now + REFERRAL_VALID_DAYS days"
          - "Referral.approved_epoch = agency.quota_epoch"
          - "PartnerAgency.quota_used += 1 (forward half of the agency_quota_conservation invariant)"
          - "increments Referral.version by 1; increments PartnerAgency.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /referrals/{id}/review with decision DENY"
        actor: PlatformAdmin
        preconditions:
          - "referral.status == SUBMITTED"
        side_effects:
          - "Referral.review_note = request note"
          - "increments Referral.version by 1"
      - from: RETURNED
        to: DENIED
        trigger: "POST /referrals/{id}/review with decision DENY"
        actor: PlatformAdmin
        preconditions:
          - "referral.status == RETURNED"
        side_effects:
          - "Referral.review_note = request note"
          - "increments Referral.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "system, cascade step 3 of the no-show contagion chain fired by POST /delivery-stops/{id}/outcome"
        actor: system
        preconditions:
          - "the transition of this referral's Client to status ON_HOLD has just been applied"
        side_effects:
          - "Referral.review_note = 'auto-denied: household placed ON_HOLD'"
          - "increments Referral.version by 1"
      - from: RETURNED
        to: DENIED
        trigger: "system, cascade step 3 of the no-show contagion chain fired by POST /delivery-stops/{id}/outcome"
        actor: system
        preconditions:
          - "the transition of this referral's Client to status ON_HOLD has just been applied"
        side_effects:
          - "Referral.review_note = 'auto-denied: household placed ON_HOLD'"
          - "increments Referral.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /_ops/run-cycle, expiry pass step 1"
        actor: system
        preconditions:
          - "referral.status == APPROVED"
          - "clock_now > referral.expires_at"
        side_effects:
          - "PartnerAgency.quota_used -= 1 (compensating half of the agency_quota_conservation invariant)"
          - "increments Referral.version by 1; increments PartnerAgency.version by 1"
      - from: APPROVED
        to: FULFILLED
        trigger: "system, on the Voucher of this referral reaching status DELIVERED via POST /delivery-stops/{id}/outcome with outcome DELIVERED"
        actor: system
        preconditions:
          - "referral.status == APPROVED"
          - "the voucher whose referral_id == referral.id has just entered status DELIVERED"
        side_effects:
          - "increments Referral.version by 1"
        note: "agency.quota_used is NOT decremented here: APPROVED and FULFILLED both count toward the quota, so the invariant total is unchanged."

  - entity: Voucher
    state_field: status
    initial_state: ISSUED
    terminal_states: [DELIVERED, CANCELLED, EXPIRED]
    transitions:
      - from: ISSUED
        to: ISSUED
        trigger: "POST /vouchers/{id}/allocate (zero-yield round)"
        actor: WarehouseLead
        preconditions:
          - "voucher.status == ISSUED"
          - "after running inventory_allocation_selector, sum(VoucherLine.quantity_allocated) == 0"
        side_effects:
          - "every unfilled VoucherLine -> WAITLISTED with a WaitlistEntry created in status WAITING"
          - "fill_ratio stays 0.0; the money fields stay at 0 and fee_basis stays null because no stock is held"
          - "increments Voucher.version by 1"
        note: "A round that finds nothing is a successful 200, not an error: the shortfall is recorded on the waitlist instead."
      - from: ISSUED
        to: PARTIALLY_ALLOCATED
        trigger: "POST /vouchers/{id}/allocate"
        actor: WarehouseLead
        preconditions:
          - "voucher.status == ISSUED"
          - "after running inventory_allocation_selector, 0 < sum(VoucherLine.quantity_allocated) < sum(VoucherLine.quantity_requested)"
        side_effects:
          - "selected InventoryItems AVAILABLE -> RESERVED with reserved_for_voucher_line_id set"
          - "recompute VoucherLine.quantity_allocated and VoucherLine.status per line"
          - "create or top up a WaitlistEntry for every line still short"
          - "recompute Voucher.fill_ratio and money fields via voucher_delivery_fee, provisional variant; Voucher.fee_basis = PROVISIONAL"
          - "increments Voucher.version by 1"
      - from: ISSUED
        to: ALLOCATED
        trigger: "POST /vouchers/{id}/allocate"
        actor: WarehouseLead
        preconditions:
          - "voucher.status == ISSUED"
          - "after running inventory_allocation_selector, every VoucherLine has quantity_allocated == quantity_requested"
        side_effects:
          - "selected InventoryItems AVAILABLE -> RESERVED with reserved_for_voucher_line_id set"
          - "all VoucherLine.status -> FILLED"
          - "recompute Voucher.fill_ratio and money fields via voucher_delivery_fee, provisional variant; Voucher.fee_basis = PROVISIONAL"
          - "increments Voucher.version by 1"
      - from: PARTIALLY_ALLOCATED
        to: ALLOCATED
        trigger: "POST /vouchers/{id}/allocate (top-up round) or POST /_ops/run-cycle promotion pass"
        actor: WarehouseLead
        preconditions:
          - "voucher.status == PARTIALLY_ALLOCATED"
          - "after the allocation round, every VoucherLine has quantity_allocated == quantity_requested"
        side_effects:
          - "selected InventoryItems AVAILABLE -> RESERVED"
          - "matching WaitlistEntry rows -> PROMOTED"
          - "recompute money fields via voucher_delivery_fee, provisional variant"
          - "increments Voucher.version by 1"
      - from: PARTIALLY_ALLOCATED
        to: PARTIALLY_ALLOCATED
        trigger: "POST /vouchers/{id}/allocate (top-up round that still leaves a shortfall)"
        actor: WarehouseLead
        preconditions:
          - "voucher.status == PARTIALLY_ALLOCATED"
          - "after the allocation round at least one VoucherLine still has quantity_allocated < quantity_requested"
        side_effects:
          - "selected InventoryItems AVAILABLE -> RESERVED"
          - "WaitlistEntry.quantity_unmet reduced by the number of units just filled"
          - "recompute money fields via voucher_delivery_fee, provisional variant"
          - "increments Voucher.version by 1"
      - from: ALLOCATED
        to: SCHEDULED
        trigger: "POST /delivery-runs/{id}/stops"
        actor: DispatchPlanner
        preconditions:
          - "voucher.status == ALLOCATED"
          - "run.status IN {PLANNED, CREWED}"
          - "client.status == ACTIVE"
          - "client.bed_bug_status != CONFIRMED"
          - "client.delivery_ban_until is null or client.delivery_ban_until <= clock_now"
        side_effects:
          - "create DeliveryStop in status SCHEDULED"
          - "DeliveryRun.stop_count += 1; recompute DeliveryRun.load_cubic_feet"
          - "increments Voucher.version by 1; increments DeliveryRun.version by 1"
      - from: PARTIALLY_ALLOCATED
        to: SCHEDULED
        trigger: "POST /delivery-runs/{id}/stops"
        actor: DispatchPlanner
        preconditions:
          - "voucher.status == PARTIALLY_ALLOCATED"
          - "run.status IN {PLANNED, CREWED}"
          - "voucher.fill_ratio >= MIN_FILL_RATIO_TO_SCHEDULE"
          - "client.status == ACTIVE"
          - "client.bed_bug_status != CONFIRMED"
          - "client.delivery_ban_until is null or client.delivery_ban_until <= clock_now"
        side_effects:
          - "create DeliveryStop in status SCHEDULED"
          - "DeliveryRun.stop_count += 1; recompute DeliveryRun.load_cubic_feet"
          - "increments Voucher.version by 1; increments DeliveryRun.version by 1"
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /delivery-stops/{id}/outcome with outcome DELIVERED"
        actor: DispatchPlanner
        preconditions:
          - "voucher.status == SCHEDULED"
          - "the stop's run.status == DISPATCHED"
        side_effects:
          - "InventoryItems held for this voucher STAGED -> DELIVERED"
          - "recompute money fields via voucher_delivery_fee, final variant; Voucher.fee_basis = FINAL"
          - "Client.lifetime_vouchers_delivered += 1"
          - "the owning Referral APPROVED -> FULFILLED"
          - "increments Voucher.version by 1"
      - from: SCHEDULED
        to: PARTIALLY_ALLOCATED
        trigger: "POST /delivery-stops/{id}/outcome with outcome NO_SHOW or REFUSED, or cascade cancellation of the stop"
        actor: DispatchPlanner
        preconditions:
          - "voucher.status == SCHEDULED"
          - "at least one VoucherLine still has quantity_allocated < quantity_requested"
        side_effects:
          - "InventoryItems held for this voucher STAGED -> RESERVED; reserved_for_voucher_line_id and VoucherLine.quantity_allocated untouched"
          - "increments Voucher.version by 1"
        note: "The voucher returns to exactly the fulfilment status it held before it was booked, so a half-filled voucher does not silently claim to be ALLOCATED."
      - from: SCHEDULED
        to: ALLOCATED
        trigger: "POST /delivery-stops/{id}/outcome with outcome NO_SHOW or REFUSED, or cascade cancellation of the stop"
        actor: DispatchPlanner
        preconditions:
          - "voucher.status == SCHEDULED"
          - "every VoucherLine has quantity_allocated == quantity_requested"
        side_effects:
          - "InventoryItems held for this voucher STAGED -> RESERVED; units that were never staged stay RESERVED. reserved_for_voucher_line_id and VoucherLine.quantity_allocated are deliberately left untouched, so the household keeps its earmarked furniture for a re-delivery attempt"
          - "the voucher becomes bookable onto a new DeliveryRun with no further allocation round"
          - "increments Voucher.version by 1"
        note: "This edge closes the ALLOCATED -> SCHEDULED -> ALLOCATED cycle and may fire any number of times; the stock never leaves the voucher, so fill_ratio is unchanged."
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /vouchers/{id}/cancel"
        actor: CaseManager or PlatformAdmin
        preconditions:
          - "voucher.status == ISSUED"
        side_effects:
          - "all VoucherLine.status -> CANCELLED; all WAITING WaitlistEntry rows for those lines -> CANCELLED"
          - "increments Voucher.version by 1"
      - from: PARTIALLY_ALLOCATED
        to: CANCELLED
        trigger: "POST /vouchers/{id}/cancel"
        actor: CaseManager or PlatformAdmin
        preconditions:
          - "voucher.status == PARTIALLY_ALLOCATED"
        side_effects:
          - "InventoryItems RESERVED -> AVAILABLE, reserved_for_voucher_line_id cleared, available_since = clock_now"
          - "all VoucherLine.status -> CANCELLED; all WAITING WaitlistEntry rows for those lines -> CANCELLED"
          - "increments Voucher.version by 1"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /vouchers/{id}/cancel"
        actor: CaseManager or PlatformAdmin
        preconditions:
          - "voucher.status == ALLOCATED"
        side_effects:
          - "InventoryItems RESERVED -> AVAILABLE, reserved_for_voucher_line_id cleared, available_since = clock_now"
          - "all VoucherLine.status -> CANCELLED; all WAITING WaitlistEntry rows for those lines -> CANCELLED"
          - "increments Voucher.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_ops/run-cycle, expiry pass step 2"
        actor: system
        preconditions:
          - "voucher.status == ISSUED"
          - "clock_now > referral.expires_at"
        side_effects:
          - "all VoucherLine.status -> CANCELLED; WAITING WaitlistEntry rows for those lines -> EXPIRED"
          - "increments Voucher.version by 1"
      - from: PARTIALLY_ALLOCATED
        to: EXPIRED
        trigger: "POST /_ops/run-cycle, expiry pass step 2"
        actor: system
        preconditions:
          - "voucher.status == PARTIALLY_ALLOCATED"
          - "clock_now > referral.expires_at"
        side_effects:
          - "InventoryItems RESERVED -> AVAILABLE, reserved_for_voucher_line_id cleared, available_since = clock_now"
          - "all VoucherLine.status -> CANCELLED; WAITING WaitlistEntry rows for those lines -> EXPIRED"
          - "increments Voucher.version by 1"
      - from: ALLOCATED
        to: EXPIRED
        trigger: "POST /_ops/run-cycle, expiry pass step 2"
        actor: system
        preconditions:
          - "voucher.status == ALLOCATED"
          - "clock_now > referral.expires_at"
        side_effects:
          - "InventoryItems RESERVED -> AVAILABLE, reserved_for_voucher_line_id cleared, available_since = clock_now"
          - "all VoucherLine.status -> CANCELLED; WAITING WaitlistEntry rows for those lines -> EXPIRED"
          - "increments Voucher.version by 1"

  - entity: Voucher
    state_field: fee_status
    initial_state: PENDING
    terminal_states: [WAIVED, PAID, WRITTEN_OFF]
    transitions:
      - from: PENDING
        to: WAIVED
        trigger: "POST /vouchers/{id}/fee-settlement with action WAIVE"
        actor: PlatformAdmin
        preconditions:
          - "voucher.fee_status == PENDING"
          - "voucher.status != CANCELLED"
        side_effects:
          - "Voucher.client_due_cents = 0; Voucher.subsidy_cents = Voucher.gross_fee_cents"
          - "increments Voucher.version by 1"
        note: "Independent of the fulfillment axis: a voucher may be WAIVED while still ISSUED."
      - from: PENDING
        to: INVOICED
        trigger: "POST /vouchers/{id}/fee-settlement with action INVOICE"
        actor: PlatformAdmin
        preconditions:
          - "voucher.fee_status == PENDING"
          - "voucher.status == DELIVERED"
        side_effects:
          - "increments Voucher.version by 1"
        note: "The only fee edge that reads the fulfillment axis; the FINAL fee variant must already have run."
      - from: INVOICED
        to: PAID
        trigger: "POST /vouchers/{id}/fee-settlement with action RECORD_PAYMENT"
        actor: PlatformAdmin
        preconditions:
          - "voucher.fee_status == INVOICED"
          - "request amount_cents == voucher.client_due_cents"
        side_effects:
          - "Voucher.amount_paid_cents = request amount_cents"
          - "increments Voucher.version by 1"
      - from: INVOICED
        to: WRITTEN_OFF
        trigger: "POST /vouchers/{id}/fee-settlement with action WRITE_OFF"
        actor: PlatformAdmin
        preconditions:
          - "voucher.fee_status == INVOICED"
        side_effects:
          - "Voucher.client_due_cents = 0"
          - "increments Voucher.version by 1"

  - entity: DonationOffer
    state_field: status
    initial_state: OFFERED
    terminal_states: [INSPECTED, RELEASED, REJECTED]
    transitions:
      - from: OFFERED
        to: TRIAGED
        trigger: "POST /donation-offers/{id}/triage"
        actor: IntakeCoordinator
        preconditions:
          - "offer.status == OFFERED"
          - "after running donation_acceptance_triage, accepted_item_count >= 1"
        side_effects:
          - "every DonationItem.decision set to ACCEPTED or REJECTED with reject_reason per donation_acceptance_triage"
          - "DonationOffer.declared_soft_ratio, accepted_item_count, rejected_item_count, bed_bug_risk_score recomputed"
          - "increments DonationOffer.version by 1"
      - from: OFFERED
        to: REJECTED
        trigger: "POST /donation-offers/{id}/triage"
        actor: IntakeCoordinator
        preconditions:
          - "offer.status == OFFERED"
          - "after running donation_acceptance_triage, accepted_item_count == 0"
        side_effects:
          - "every DonationItem.decision set to REJECTED with reject_reason"
          - "DonationOffer.declared_soft_ratio, rejected_item_count recomputed; bed_bug_risk_score = 0.0"
          - "increments DonationOffer.version by 1"
        note: "Auto-transition inside the same request: the branch is chosen by the accepted count, not by a second call."
      - from: TRIAGED
        to: PICKUP_SCHEDULED
        trigger: "POST /donation-offers/{id}/schedule-pickup"
        actor: IntakeCoordinator
        preconditions:
          - "offer.status == TRIAGED"
          - "truck.bed_bug_lockout_until is null or truck.bed_bug_lockout_until <= offer.pickup_window_start"
          - "no truck_resource_window_conflict against the requested truck"
        side_effects:
          - "DonationOffer.truck_id = request truck_id"
          - "increments DonationOffer.version by 1"
      - from: PICKUP_SCHEDULED
        to: INSPECTED
        trigger: "POST /donation-offers/{id}/intake"
        actor: WarehouseLead
        preconditions:
          - "offer.status == PICKUP_SCHEDULED"
          - "the inspections array covers exactly the ACCEPTED DonationItems of this offer"
          - "no inspection has live_pest_observed true and no ACCEPTED DonationItem has soft_surface true"
        side_effects:
          - "create one InventoryItem in status AVAILABLE with available_since = clock_now for every inspection whose graded_condition is A, B or C"
          - "any inspection graded D flips its DonationItem.decision to REJECTED with reject_reason CONDITION_BELOW_MIN and creates no stock"
          - "DonationOffer.inspector_user_id = acting X-User-ID"
          - "increments DonationOffer.version by 1"
      - from: PICKUP_SCHEDULED
        to: QUARANTINED
        trigger: "POST /donation-offers/{id}/intake"
        actor: WarehouseLead
        preconditions:
          - "offer.status == PICKUP_SCHEDULED"
          - "the inspections array covers exactly the ACCEPTED DonationItems of this offer"
          - "at least one inspection has live_pest_observed true, or at least one ACCEPTED DonationItem has soft_surface true"
        side_effects:
          - "create one InventoryItem per inspection graded A, B or C; units whose DonationItem.soft_surface is true AND live_pest_observed fired anywhere on this offer are created directly in status DISPOSED, all others in status QUARANTINED"
          - "any inspection graded D flips its DonationItem.decision to REJECTED with reject_reason CONDITION_BELOW_MIN and creates no stock"
          - "DonationOffer.inspector_user_id = acting X-User-ID; quarantine_started_at = clock_now; quarantine_release_due_at = clock_now + QUARANTINE_DAYS_LIVE_PEST days when a live pest fired, else + QUARANTINE_DAYS_STANDARD days"
          - "CASCADE step 1 (live pest only): Truck.bed_bug_lockout_until = clock_now + TRUCK_LOCKOUT_HOURS hours. Runs on that truck whose service_date equals the UTC calendar date of clock_now are cancelled by step 2; runs on later dates inside the lockout survive but cannot be dispatched until the lockout lapses"
          - "increments DonationOffer.version by 1; increments Truck.version by 1 when the lockout is stamped"
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /donation-offers/{id}/quarantine-release"
        actor: WarehouseLead
        preconditions:
          - "offer.status == QUARANTINED"
          - "clock_now >= offer.quarantine_release_due_at"
          - "acting X-User-ID != offer.inspector_user_id"
        side_effects:
          - "every InventoryItem sourced from this offer with status QUARANTINED -> AVAILABLE, available_since = clock_now"
          - "increments DonationOffer.version by 1"

  - entity: InventoryItem
    state_field: status
    initial_state: QUARANTINED
    terminal_states: [DELIVERED, DISPOSED]
    transitions:
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /donation-offers/{id}/intake on the clean branch (applied in the same request that mints the unit), or POST /donation-offers/{id}/quarantine-release"
        actor: WarehouseLead
        preconditions:
          - "item.status == QUARANTINED"
          - "the owning offer took the INSPECTED branch, or the owning offer has reached RELEASED"
        side_effects:
          - "InventoryItem.available_since = clock_now"
          - "increments InventoryItem.version by 1"
      - from: QUARANTINED
        to: DISPOSED
        trigger: "POST /donation-offers/{id}/intake with live_pest_observed true on a soft-surface piece (applied in the same request that mints the unit)"
        actor: WarehouseLead
        preconditions:
          - "the originating DonationItem.soft_surface == true"
          - "at least one inspection on this offer reported live_pest_observed true"
        side_effects:
          - "increments InventoryItem.version by 1"
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /vouchers/{id}/allocate or POST /_ops/run-cycle promotion pass"
        actor: WarehouseLead or system
        preconditions:
          - "item.status == AVAILABLE"
          - "item was selected by inventory_allocation_selector for a VoucherLine"
        side_effects:
          - "InventoryItem.reserved_for_voucher_line_id = the selected line id"
          - "VoucherLine.quantity_allocated += 1 (forward half of the inventory_unit_conservation invariant)"
          - "increments InventoryItem.version by 1"
      - from: RESERVED
        to: STAGED
        trigger: "POST /delivery-runs/{id}/dispatch"
        actor: DispatchPlanner
        preconditions:
          - "item.status == RESERVED"
          - "the line's voucher has a SCHEDULED DeliveryStop on the run being dispatched"
        side_effects:
          - "increments InventoryItem.version by 1"
      - from: STAGED
        to: DELIVERED
        trigger: "POST /delivery-stops/{id}/outcome with outcome DELIVERED"
        actor: DispatchPlanner
        preconditions:
          - "item.status == STAGED"
          - "the stop being closed serves the voucher that holds this unit"
        side_effects:
          - "increments InventoryItem.version by 1"
      - from: STAGED
        to: RESERVED
        trigger: "POST /delivery-stops/{id}/outcome with outcome NO_SHOW or REFUSED"
        actor: DispatchPlanner
        preconditions:
          - "item.status == STAGED"
          - "the stop being closed serves the voucher that holds this unit"
        side_effects:
          - "reserved_for_voucher_line_id is retained and VoucherLine.quantity_allocated is unchanged; available_since is NOT restamped"
          - "increments InventoryItem.version by 1"
        note: "Closes the RESERVED -> STAGED -> RESERVED cycle: the piece rides back to the warehouse still earmarked for the same household."
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /vouchers/{id}/cancel or POST /_ops/run-cycle expiry pass step 2"
        actor: system
        preconditions:
          - "item.status == RESERVED"
          - "the owning VoucherLine has been cancelled or expired"
        side_effects:
          - "InventoryItem.reserved_for_voucher_line_id = null; available_since = clock_now"
          - "VoucherLine.quantity_allocated -= 1 (compensating half of the inventory_unit_conservation invariant)"
          - "increments InventoryItem.version by 1"

  - entity: DeliveryRun
    state_field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: CREWED
        trigger: "system, on POST /crew-assignments/{id}/respond with response CONFIRM"
        actor: system
        preconditions:
          - "run.status == PLANNED"
          - "after the confirmation, run.confirmed_crew_count >= truck.crew_minimum"
          - "after the confirmation, run.has_confirmed_driver == true"
        side_effects:
          - "increments DeliveryRun.version by 1"
      - from: CREWED
        to: PLANNED
        trigger: "system, on POST /crew-assignments/{id}/respond with response WITHDRAW"
        actor: system
        preconditions:
          - "run.status == CREWED"
          - "after the withdrawal, run.confirmed_crew_count < truck.crew_minimum or run.has_confirmed_driver == false"
        side_effects:
          - "increments DeliveryRun.version by 1"
        note: "Closes the PLANNED -> CREWED -> PLANNED cycle; crew churn can demote a run any number of times before dispatch."
      - from: CREWED
        to: DISPATCHED
        trigger: "POST /delivery-runs/{id}/dispatch"
        actor: DispatchPlanner
        preconditions:
          - "run.status IN {PLANNED, CREWED}; a PLANNED run is accepted by the state gate and then always fails the crew gate below with ERR_CREW_BELOW_MINIMUM, while DISPATCHED, COMPLETED and CANCELLED runs fail the state gate with ERR_RUN_INVALID_STATE"
          - "run.stop_count >= 1"
          - "run.load_cubic_feet <= truck.capacity_cubic_feet"
          - "truck.bed_bug_lockout_until is null or truck.bed_bug_lockout_until <= run.window_start"
        side_effects:
          - "every InventoryItem RESERVED for a voucher with a SCHEDULED stop on this run -> STAGED"
          - "every CrewAssignment on this run still in status INVITED -> NO_SHOW; that volunteer's reliability_score -= RELIABILITY_NO_SHOW_PENALTY, floored at 0.0"
          - "increments DeliveryRun.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "system, on POST /delivery-stops/{id}/outcome when it closes the last SCHEDULED stop of the run"
        actor: system
        preconditions:
          - "run.status == DISPATCHED"
          - "no DeliveryStop on this run remains in status SCHEDULED"
        side_effects:
          - "increments DeliveryRun.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "system, cascade step 2 of the bed-bug contagion chain fired by POST /donation-offers/{id}/intake"
        actor: system
        preconditions:
          - "run.status == PLANNED"
          - "Truck.bed_bug_lockout_until has just been stamped by cascade step 1 AND run.service_date equals the UTC calendar date of clock_now"
        side_effects:
          - "CASCADE step 3: every DeliveryStop on this run in status SCHEDULED -> CANCELLED"
          - "CASCADE step 5: every CrewAssignment on this run in status INVITED or CONFIRMED -> RELEASED"
          - "increments DeliveryRun.version by 1"
      - from: CREWED
        to: CANCELLED
        trigger: "system, cascade step 2 of the bed-bug contagion chain fired by POST /donation-offers/{id}/intake"
        actor: system
        preconditions:
          - "run.status == CREWED"
          - "Truck.bed_bug_lockout_until has just been stamped by cascade step 1 AND run.service_date equals the UTC calendar date of clock_now"
        side_effects:
          - "CASCADE step 3: every DeliveryStop on this run in status SCHEDULED -> CANCELLED"
          - "CASCADE step 5: every CrewAssignment on this run in status INVITED or CONFIRMED -> RELEASED"
          - "increments DeliveryRun.version by 1"

  - entity: DeliveryStop
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, NO_SHOW, REFUSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /delivery-stops/{id}/outcome with outcome DELIVERED"
        actor: DispatchPlanner
        preconditions:
          - "stop.status == SCHEDULED"
          - "run.status == DISPATCHED"
        side_effects:
          - "DeliveryStop.outcome_recorded_at = clock_now; chargeback_cents stays 0"
          - "the served Voucher SCHEDULED -> DELIVERED (which itself runs the FINAL fee variant and flips the Referral to FULFILLED)"
          - "Client.lifetime_vouchers_delivered += 1"
          - "DeliveryRun.stop_count -= 1; the run auto-COMPLETES when this was its last SCHEDULED stop"
          - "when pest_observed_at_residence is true: Client.bed_bug_status -> CONFIRMED, Client.bed_bug_confirmed_at = clock_now, Client.status -> ON_HOLD, every WAITING WaitlistEntry of this client -> CANCELLED, and Truck.bed_bug_lockout_until = clock_now + TRUCK_LOCKOUT_HOURS hours"
          - "increments DeliveryStop.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /delivery-stops/{id}/outcome with outcome NO_SHOW"
        actor: DispatchPlanner
        preconditions:
          - "stop.status == SCHEDULED"
          - "run.status == DISPATCHED"
        side_effects:
          - "DeliveryStop.chargeback_cents = no_show_chargeback at NO_SHOW_RATE; PartnerAgency.no_show_credits_owed_cents += that amount"
          - "the served Voucher leaves SCHEDULED for ALLOCATED when every line is still FILLED, or for PARTIALLY_ALLOCATED when some line is short, and its STAGED stock reverts to RESERVED, still earmarked for the household"
          - "CASCADE step 1: Client.no_show_strikes += 1"
          - "CASCADE step 2 (only when the raised strike count reaches STRIKE_BAN_THRESHOLD): Client.status -> ON_HOLD and Client.delivery_ban_until = clock_now + BAN_DAYS days"
          - "CASCADE step 3 (only because the client just went ON_HOLD): every Referral of that client in status SUBMITTED or RETURNED -> DENIED, and every WAITING WaitlistEntry of that client -> CANCELLED"
          - "PartnerAgency.standing recomputed by agency_standing_recompute"
          - "DeliveryRun.stop_count -= 1; the run auto-COMPLETES when this was its last SCHEDULED stop"
          - "increments DeliveryStop.version by 1"
      - from: SCHEDULED
        to: REFUSED
        trigger: "POST /delivery-stops/{id}/outcome with outcome REFUSED"
        actor: DispatchPlanner
        preconditions:
          - "stop.status == SCHEDULED"
          - "run.status == DISPATCHED"
        side_effects:
          - "DeliveryStop.chargeback_cents = no_show_chargeback at REFUSED_RATE; PartnerAgency.no_show_credits_owed_cents += that amount"
          - "the served Voucher leaves SCHEDULED for ALLOCATED when every line is still FILLED, or for PARTIALLY_ALLOCATED when some line is short, and its STAGED stock reverts to RESERVED, still earmarked for the household"
          - "Client.no_show_strikes is NOT incremented (a refusal at the door is not a no-show)"
          - "PartnerAgency.standing recomputed by agency_standing_recompute"
          - "when pest_observed_at_residence is true: Client.bed_bug_status -> CONFIRMED, Client.bed_bug_confirmed_at = clock_now, Client.status -> ON_HOLD, every WAITING WaitlistEntry of this client -> CANCELLED, Truck.bed_bug_lockout_until = clock_now + TRUCK_LOCKOUT_HOURS hours"
          - "DeliveryRun.stop_count -= 1; the run auto-COMPLETES when this was its last SCHEDULED stop"
          - "increments DeliveryStop.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system, cascade step 3 of the bed-bug contagion chain fired by POST /donation-offers/{id}/intake"
        actor: system
        preconditions:
          - "stop.status == SCHEDULED"
          - "the owning DeliveryRun has just transitioned to CANCELLED by cascade step 2"
        side_effects:
          - "CASCADE step 4: the served Voucher leaves SCHEDULED for ALLOCATED (or PARTIALLY_ALLOCATED when some line is short), and its RESERVED stock is retained because the run never dispatched and nothing was staged"
          - "DeliveryStop.chargeback_cents stays 0"
          - "increments DeliveryStop.version by 1"

  - entity: CrewAssignment
    state_field: status
    initial_state: INVITED
    terminal_states: [DECLINED, RELEASED, NO_SHOW]
    transitions:
      - from: INVITED
        to: CONFIRMED
        trigger: "POST /crew-assignments/{id}/respond with response CONFIRM"
        actor: Volunteer
        preconditions:
          - "assignment.status == INVITED"
          - "acting X-User-ID == assignment.volunteer_id"
          - "run.status == PLANNED"
        side_effects:
          - "Volunteer.assigned_hours_month += RUN_HOURS"
          - "DeliveryRun.confirmed_crew_count += 1; has_confirmed_driver recomputed; the run may auto-transition PLANNED -> CREWED"
          - "increments CrewAssignment.version by 1"
      - from: INVITED
        to: DECLINED
        trigger: "POST /crew-assignments/{id}/respond with response DECLINE"
        actor: Volunteer
        preconditions:
          - "assignment.status == INVITED"
          - "acting X-User-ID == assignment.volunteer_id"
        side_effects:
          - "increments CrewAssignment.version by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /crew-assignments/{id}/respond with response WITHDRAW"
        actor: Volunteer
        preconditions:
          - "assignment.status == CONFIRMED"
          - "acting X-User-ID == assignment.volunteer_id"
          - "run.status IN {PLANNED, CREWED}"
        side_effects:
          - "Volunteer.assigned_hours_month -= RUN_HOURS, floored at 0.0"
          - "DeliveryRun.confirmed_crew_count -= 1; has_confirmed_driver recomputed; the run may auto-transition CREWED -> PLANNED"
          - "increments CrewAssignment.version by 1"
      - from: INVITED
        to: RELEASED
        trigger: "system, cascade step 5 of the bed-bug contagion chain fired by POST /donation-offers/{id}/intake"
        actor: system
        preconditions:
          - "assignment.status == INVITED"
          - "the owning DeliveryRun has just transitioned to CANCELLED by cascade step 2"
        side_effects:
          - "increments CrewAssignment.version by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "system, cascade step 5 of the bed-bug contagion chain fired by POST /donation-offers/{id}/intake"
        actor: system
        preconditions:
          - "assignment.status == CONFIRMED"
          - "the owning DeliveryRun has just transitioned to CANCELLED by cascade step 2"
        side_effects:
          - "Volunteer.assigned_hours_month -= RUN_HOURS, floored at 0.0"
          - "increments CrewAssignment.version by 1"
      - from: INVITED
        to: NO_SHOW
        trigger: "system, on POST /delivery-runs/{id}/dispatch"
        actor: system
        preconditions:
          - "assignment.status == INVITED at the moment the run is dispatched"
        side_effects:
          - "Volunteer.reliability_score -= RELIABILITY_NO_SHOW_PENALTY, floored at 0.0"
          - "increments CrewAssignment.version by 1"

  - entity: WaitlistEntry
    state_field: status
    initial_state: WAITING
    terminal_states: [PROMOTED, EXPIRED, CANCELLED]
    transitions:
      - from: WAITING
        to: PROMOTED
        trigger: "POST /_ops/run-cycle promotion pass, or POST /vouchers/{id}/allocate top-up round"
        actor: system or WarehouseLead
        preconditions:
          - "entry.status == WAITING"
          - "the promotion round reduced entry.quantity_unmet to 0"
        side_effects:
          - "increments WaitlistEntry.version by 1"
      - from: WAITING
        to: EXPIRED
        trigger: "POST /_ops/run-cycle expiry pass step 2"
        actor: system
        preconditions:
          - "entry.status == WAITING"
          - "the owning Voucher has just transitioned to EXPIRED"
        side_effects:
          - "increments WaitlistEntry.version by 1"
      - from: WAITING
        to: CANCELLED
        trigger: "POST /vouchers/{id}/cancel, or the ON_HOLD cascade fired by POST /delivery-stops/{id}/outcome"
        actor: system
        preconditions:
          - "entry.status == WAITING"
          - "the owning Voucher has just been CANCELLED, or the entry's Client has just moved to status ON_HOLD"
        side_effects:
          - "increments WaitlistEntry.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent entity's version only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: allocate-stale-voucher
    parent_entity: Voucher
    write_endpoint: "POST /vouchers/{id}/allocate"
    occ_field: "expected_voucher_version"
    description: |
      Running an allocation round against a Voucher whose version has advanced
      since the client last read it is rejected. Allocation is a legitimate
      repeatable top-up operation - a second round against an unchanged voucher
      would itself succeed - so the stale view must be caught by the version
      check rather than by any state precondition.
    error_id: ERR_STALE_VOUCHER_VERSION
    http_status: 412

  - rule_id: stop-create-stale-run
    parent_entity: DeliveryRun
    write_endpoint: "POST /delivery-runs/{id}/stops"
    occ_field: "expected_run_version"
    description: |
      Adding a DeliveryStop to a DeliveryRun whose version has advanced since
      the planner last read it is rejected. A run legitimately carries many
      stops, so a second create against an unchanged run would succeed on its
      own merits; the version check is what pins the planner's view of the
      run's load and stop list.
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: voucher_delivery_fee
    trigger: "on every POST /vouchers/{id}/allocate round and on every POST /_ops/run-cycle promotion that touches the voucher (provisional variant); on POST /delivery-stops/{id}/outcome with outcome DELIVERED (final variant)"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 - service county (this is the ONLY input that differs by variant
      #          other than the stock filter; see `variants` below)
      service_county = <variant-specific, see variants>

      # STEP 2 - stock basis
      basis_items   = InventoryItem where reserved_for_voucher_line_id IN
                      (ids of VoucherLine where voucher_id == voucher.id)
                      AND status IN <variant-specific stock filter>
      total_cf      = sum(basis_items.cubic_feet)
      basis_cats    = set(basis_items.category)

      # STEP 3 - gross fee, evaluated strictly in this order
      base_cents    = BASE_FEE_CENTS[service_county]
      bulk_cents    = ceil(total_cf / 50) * PER_50CF_CENTS      # ceil of a strictly
                                                                # positive quotient; 0 cf -> 0 cents
      lift_cents    = LIFT_SURCHARGE_CENTS if (basis_cats intersects LIFT_CATEGORIES) else 0
      gross_fee_cents = min(base_cents + bulk_cents + lift_cents, FEE_CAP_CENTS)

      # STEP 4 - subsidy percentage, evaluated strictly in this order
      pct = 0.50 if client.household_size <= 2
            else 0.70 if client.household_size <= 4
            else 0.90
      if client.has_infant:               pct = min(pct + INFANT_SUBSIDY_BONUS, 1.00)
      if agency.standing == 'PROBATION':  pct = max(pct - PROBATION_SUBSIDY_PENALTY, 0.00)
      if agency.standing == 'SUSPENDED':  pct = 0.00

      # STEP 5 - money, single rounding step on the subsidy only
      subsidy_cents    = round_half_up(gross_fee_cents * pct)   # integer cents
      client_due_cents = gross_fee_cents - subsidy_cents        # never re-rounded
    input_set: |
      Only InventoryItems whose reserved_for_voucher_line_id points at a line of THIS voucher enter
      the basis. `agency` is the PartnerAgency reached by voucher -> referral -> agency_id, read at
      the instant the calculation runs. `client` is reached by voucher -> referral -> client_id.
      VoucherLines in status CANCELLED contribute nothing because their units have already been
      released to AVAILABLE and therefore fail the stock filter.
      BILLING FREEZE: gross_fee_cents, subsidy_cents, client_due_cents and fee_basis are written
      only while Voucher.fee_status == PENDING. Once the billing axis has left PENDING (WAIVED,
      INVOICED, PAID or WRITTEN_OFF) the money fields are frozen: later allocation rounds, waitlist
      promotions and the final variant still run their state changes but MUST NOT overwrite the
      four money fields. This is the only coupling between the voucher's two state axes.
    constants:
      BASE_FEE_CENTS: { NORTH: 4000, CENTRAL: 3000, SOUTH: 5000 }
      PER_50CF_CENTS: 1200
      LIFT_SURCHARGE_CENTS: 1500
      LIFT_CATEGORIES: [BED, SOFA]
      FEE_CAP_CENTS: 9000
      INFANT_SUBSIDY_BONUS: 0.10
      PROBATION_SUBSIDY_PENALTY: 0.20
    precision: "integer cents; round_half_up applied exactly once, to subsidy_cents; client_due_cents is a pure subtraction"
    variants:
      - name: provisional
        when: "POST /vouchers/{id}/allocate and the POST /_ops/run-cycle promotion pass; writes Voucher.fee_basis = PROVISIONAL"
        difference: "service_county = Client.county (where the household lives, which is what the case manager was quoted); stock filter = status IN {RESERVED, STAGED}"
      - name: final
        when: "POST /delivery-stops/{id}/outcome with outcome DELIVERED; writes Voucher.fee_basis = FINAL"
        difference: "service_county = DeliveryRun.county of the run that served the stop (where the truck actually drove); stock filter = status == DELIVERED. Identical stock delivered out of a different-county run therefore produces a different gross_fee_cents, subsidy_cents and client_due_cents than the provisional quote."

  - name: client_referral_priority_score
    trigger: "on POST /referrals/{id}/submit (intake_score variant, written to Referral.priority_score); on the POST /_ops/run-cycle scoring pass (waitlist_score variant, written to WaitlistEntry.priority_score)"
    algorithm: weighted_scoring
    formula: |
      urgency_points  = URGENCY_WEIGHT[referral.urgency]
      size_points     = min(client.household_size, 6) * SIZE_POINT_PER_PERSON
      infant_points   = INFANT_POINTS if client.has_infant else 0
      tenure_points   = min(floor(tenure_days / 30) * TENURE_POINTS_PER_MONTH, TENURE_POINTS_CAP)
      revision_penalty= referral.revision_count * REVISION_PENALTY_PER_ROUND
      strike_penalty  = client.no_show_strikes * <variant-specific strike weight>
      raw = urgency_points + size_points + infant_points + tenure_points
            - revision_penalty - strike_penalty
      priority_score = round_half_up(max(raw, 0.0), 1)
    input_set: |
      `referral` is the Referral being submitted (intake_score) or the Referral reached by
      waitlist_entry -> voucher_line -> voucher -> referral_id (waitlist_score). `client` is that
      referral's Client, read at the instant the calculation runs. Referrals in status DENIED,
      EXPIRED or FULFILLED are never rescored.
    constants:
      URGENCY_WEIGHT: { ROUTINE: 10, PRIORITY: 25, EMERGENCY: 40 }
      SIZE_POINT_PER_PERSON: 5
      INFANT_POINTS: 15
      TENURE_POINTS_PER_MONTH: 4
      TENURE_POINTS_CAP: 20
      REVISION_PENALTY_PER_ROUND: 6
      INTAKE_STRIKE_WEIGHT: 8
      WAITLIST_STRIKE_WEIGHT: 16
    precision: "one decimal place, round_half_up, floored at 0.0"
    variants:
      - name: intake_score
        when: "POST /referrals/{id}/submit, including every revision round"
        difference: "tenure_days = 0 (the queue clock has not started yet), strike weight = INTAKE_STRIKE_WEIGHT (8)"
      - name: waitlist_score
        when: "the scoring pass of POST /_ops/run-cycle, over every WaitlistEntry in status WAITING"
        difference: "tenure_days = floor((clock_now - waitlist_entry.waiting_since) / 86400 seconds), strike weight = WAITLIST_STRIKE_WEIGHT (16). The same household therefore scores differently as a waiting line than it did as an intake referral."

  - name: donation_acceptance_triage
    trigger: "POST /donation-offers/{id}/triage"
    algorithm: constraint_propagation
    formula: |
      # The soft-surface rule reads a ratio over the offer, and the risk score reads
      # the accepted set, which the soft-surface rule helps decide. The dependency is
      # only apparent: the three steps below MUST be evaluated in exactly this order.

      # STEP 1 - pre-decision snapshot, taken over ALL submitted items of the offer
      declared_soft_ratio = round_half_up(
          count(items where soft_surface == true) / count(items), 3)

      # STEP 2 - per-item decision loop, items ordered by DonationItem.created_at ASC
      #          (ties keep the order they appeared in the create request's `items` array)
      current_load_cf = sum(InventoryItem.cubic_feet
                            where status IN {QUARANTINED, AVAILABLE, RESERVED, STAGED})
      headroom_cf     = WAREHOUSE_CAPACITY_CF - current_load_cf   # 400.0 cf of floor space total
      running_cf      = 0
      for item in items ordered by created_at ASC:
          if item.category == 'CRIB' and item.declared_condition != 'A':
              item.decision = REJECTED; item.reject_reason = RECALLED_CRIB
          elif item.declared_condition == 'D':
              item.decision = REJECTED; item.reject_reason = CONDITION_BELOW_MIN
          elif item.soft_surface and declared_soft_ratio >= SOFT_RATIO_REJECT_THRESHOLD:
              item.decision = REJECTED; item.reject_reason = SOFT_SURFACE_RISK
          elif running_cf + item.cubic_feet > headroom_cf:
              item.decision = REJECTED; item.reject_reason = CAPACITY
          else:
              item.decision = ACCEPTED; running_cf = running_cf + item.cubic_feet

      # STEP 3 - risk score, computed only after every decision is final
      accepted_cf      = sum(accepted items .cubic_feet)
      accepted_soft_cf = sum(accepted items where soft_surface == true .cubic_feet)
      bed_bug_risk_score = 0.0 if accepted_cf == 0
                           else round_half_up(100 * accepted_soft_cf / accepted_cf, 1)
    input_set: |
      Warehouse occupancy for headroom_cf counts every InventoryItem in status QUARANTINED,
      AVAILABLE, RESERVED or STAGED; DELIVERED and DISPOSED units have left the building and are
      excluded. The reject-reason ladder is a strict first-match: an item that is both a
      non-A-grade CRIB and a D-grade piece reports RECALLED_CRIB, never CONDITION_BELOW_MIN.
    constants:
      WAREHOUSE_CAPACITY_CF: 400
      SOFT_RATIO_REJECT_THRESHOLD: 0.50
    precision: "declared_soft_ratio three decimals round_half_up; bed_bug_risk_score one decimal round_half_up; cubic feet compared exactly, no tolerance"
    variants: []

  - name: no_show_chargeback
    trigger: "POST /delivery-stops/{id}/outcome with outcome NO_SHOW or REFUSED"
    algorithm: aggregation
    formula: |
      rate = NO_SHOW_RATE if outcome == 'NO_SHOW' else REFUSED_RATE
      # PINNED ROUNDING ORDER: round each line to whole cents FIRST, then sum the
      # rounded line charges. Summing the unrounded line charges and rounding the
      # total once is explicitly WRONG and will differ by a cent or more.
      for each VoucherLine L of the stop's voucher, ordered by L.created_at ASC:
          line_charge_cents(L) = round_half_up(
              CATEGORY_BASE_CENTS[L.category] * L.quantity_allocated * rate)
      chargeback_cents = sum over L of line_charge_cents(L)
      DeliveryStop.chargeback_cents          = chargeback_cents
      PartnerAgency.no_show_credits_owed_cents += chargeback_cents
    input_set: |
      Only VoucherLines of the stop's voucher whose status is OPEN, PARTIAL, FILLED or WAITLISTED
      are charged, and each is charged on its quantity_allocated as read BEFORE the stock is
      returned to AVAILABLE by the same request. CANCELLED lines are charged nothing. The agency
      charged is the one reached by stop -> voucher -> referral -> agency_id.
    constants:
      NO_SHOW_RATE: 0.45
      REFUSED_RATE: 0.25
      CATEGORY_BASE_CENTS: { BED: 2500, SOFA: 3000, CRIB: 1500, TABLE_SET: 1150, DRESSER: 950, KITCHEN_KIT: 650, LINENS: 250 }
    precision: "integer cents; round_half_up applied once per line, never to the total"
    variants: []

  - name: inventory_allocation_selector
    trigger: "POST /vouchers/{id}/allocate, and the promotion pass of POST /_ops/run-cycle"
    algorithm: waterfall_allocation
    formula: |
      # Line processing order (deterministic, no random field participates):
      lines = VoucherLines of this voucher with status IN {OPEN, PARTIAL, WAITLISTED},
              ordered by CATEGORY_PRIORITY[line.category] ASC, then line.created_at ASC

      for line in lines:
          shortfall = line.quantity_requested - line.quantity_allocated
          if shortfall <= 0: continue

          # (a) eligibility filter - an explicit predicate, no adjectives
          candidates = InventoryItem where status == 'AVAILABLE'
                         and category == line.category
                         and CONDITION_RANK[condition] <= CONDITION_RANK[line.min_condition]

          # (b) ranking expression - spend the worst acceptable grade first so that
          #     A-grade stock is kept for households that demand it
          candidates ordered by CONDITION_RANK[condition] DESC,
                                then available_since ASC,
                                # (c) tie-break
                                then created_at ASC

          take = candidates[0 : shortfall]
          for unit in take:
              unit.status = 'RESERVED'; unit.reserved_for_voucher_line_id = line.id
              line.quantity_allocated += 1

          # (d) empty-pool / partial-pool fallback - never an error
          remaining = line.quantity_requested - line.quantity_allocated
          if remaining > 0:
              line.status = 'WAITLISTED' if line.quantity_allocated == 0 else 'PARTIAL'
              upsert WaitlistEntry(voucher_line_id = line.id,
                                   client_id      = the voucher's client,
                                   category       = line.category,
                                   county         = client.county,
                                   quantity_unmet = remaining,
                                   status         = 'WAITING',
                                   priority_score = client_referral_priority_score,
                                                    waitlist_score variant, evaluated now
                                                    (tenure_days = 0 at creation; later
                                                    recomputed by the run-cycle scoring pass),
                                   waiting_since  = existing value if the entry already
                                                    exists, else clock_now)
          else:
              line.status = 'FILLED'
              any WAITING WaitlistEntry for this line -> PROMOTED with quantity_unmet = 0
    input_set: |
      Candidate stock is drawn from the whole warehouse, not from any single donation offer.
      QUARANTINED units are invisible to allocation - a unit becomes selectable only once
      quarantine release (or a clean intake) has moved it to AVAILABLE. `available_since` is the
      instant the unit most recently entered AVAILABLE, so a unit that bounced back from a
      no-show goes to the back of its grade's queue.
    constants:
      CATEGORY_PRIORITY: { BED: 1, CRIB: 2, LINENS: 3, TABLE_SET: 4, DRESSER: 5, SOFA: 6, KITCHEN_KIT: 7 }
      CONDITION_RANK: { A: 1, B: 2, C: 3 }
    precision: "whole units; no fractional allocation"
    variants: []

  - name: agency_standing_recompute
    trigger: "on every POST /delivery-stops/{id}/outcome that produces NO_SHOW or REFUSED, and on the standing pass of POST /_ops/run-cycle for every agency"
    algorithm: threshold
    formula: |
      window = DeliveryStops S where
                 S.status IN {DELIVERED, NO_SHOW, REFUSED}
                 and (S -> voucher -> referral).agency_id == agency.id
               ordered by S.created_at DESC, then keep the first STANDING_WINDOW rows;
               if the row at position STANDING_WINDOW ties on created_at with later rows,
               keep every tied row (the window may exceed STANDING_WINDOW; it is never
               broken by a random field)
      terminal_count = count(window)
      no_show_count  = count(window where status == 'NO_SHOW')
      if terminal_count < STANDING_MIN_SAMPLE:
          standing = 'GOOD'
      else:
          rate = no_show_count / terminal_count          # exact rational, not rounded
          standing = 'SUSPENDED' if rate >= STANDING_SUSPENDED_RATE
                     else 'PROBATION' if rate >= STANDING_PROBATION_RATE
                     else 'GOOD'
    input_set: |
      CANCELLED and SCHEDULED stops never enter the window. The rate is compared with `>=` on both
      thresholds: a rate of exactly 0.25 is PROBATION, and exactly 0.50 is SUSPENDED. Standing can
      move back to GOOD on a later recompute, so it is a live derived field, not a latch.
    constants:
      STANDING_WINDOW: 10
      STANDING_MIN_SAMPLE: 2
      STANDING_PROBATION_RATE: 0.25
      STANDING_SUSPENDED_RATE: 0.50
    precision: "rate compared as an exact rational; no rounding before comparison"
    variants: []

  - name: run_load_and_crew_feasibility
    trigger: "recomputed on POST /delivery-runs/{id}/stops, on POST /crew-assignments/{id}/respond, on the bed-bug cascade, and read as a precondition by POST /delivery-runs/{id}/dispatch"
    algorithm: aggregation
    formula: |
      load_cubic_feet = sum(InventoryItem.cubic_feet
                            where InventoryItem.status IN {RESERVED, STAGED}
                              and InventoryItem.reserved_for_voucher_line_id IN
                                  (ids of VoucherLine whose voucher_id is served by a
                                   DeliveryStop on this run with status == 'SCHEDULED'))
      confirmed_crew_count = count(CrewAssignment where run_id == run.id
                                     and status == 'CONFIRMED')
      has_confirmed_driver = exists CrewAssignment where run_id == run.id
                                     and status == 'CONFIRMED'
                                     and role_on_crew == 'DRIVER'
      stop_count = count(DeliveryStop where run_id == run.id and status == 'SCHEDULED')

      dispatch_feasible = stop_count >= 1
                          and load_cubic_feet <= truck.capacity_cubic_feet   # inclusive
                          and confirmed_crew_count >= truck.crew_minimum     # inclusive
                          and has_confirmed_driver
    input_set: |
      Only SCHEDULED stops contribute load; a stop cancelled by the bed-bug cascade drops out of
      the sum immediately. Both feasibility comparisons are inclusive: a load exactly equal to
      capacity passes, and a confirmed crew exactly equal to crew_minimum passes.
    constants:
      RUN_HOURS: 4.0
      RELIABILITY_NO_SHOW_PENALTY: 15.0
    precision: "cubic feet summed as declared, compared exactly with no tolerance"
    variants: []

  - name: unmet_need_report
    trigger: "GET /reports/unmet-need"
    algorithm: aggregation
    formula: |
      source = WaitlistEntry where status == 'WAITING'
               and (county == query county   if the county filter is supplied)
               and (category == query category if the category filter is supplied)

      rows = group source by (county, category), one row per group that has at least
             one source entry, ordered by county ASC (NORTH, CENTRAL, SOUTH by that
             literal ordering), then category ASC by CATEGORY_PRIORITY:
        unmet_quantity     = sum(entry.quantity_unmet)
        households_waiting = count(distinct entry.client_id)
        max_wait_days      = max over entries of
                             floor((clock_now - entry.waiting_since) / 86400 seconds)
        top_priority_score = max(entry.priority_score)
        # denominator counts demand ever raised in that (county, category)
        requested_units    = sum(VoucherLine.quantity_requested) over VoucherLines
                             where category == group category
                               and (line -> voucher -> referral -> client).county == group county
                               and line.status != 'CANCELLED'
        allocated_units    = sum(VoucherLine.quantity_allocated) over the same lines
        fill_rate_pct      = null if requested_units == 0
                             else round_half_up(100 * allocated_units / requested_units, 1)

      total_unmet_quantity     = sum over rows of unmet_quantity
      total_households_waiting = count of distinct client_id across the whole `source` set
    input_set: |
      Only WAITING entries are reported; PROMOTED, EXPIRED and CANCELLED entries leave the report
      the instant they change status. When `source` is empty the response is `rows: []` with
      total_unmet_quantity 0 and total_households_waiting 0 - never a 404 and never a row with
      zeroed fields.
    constants:
      COUNTY_ORDER: [NORTH, CENTRAL, SOUTH]
    precision: "fill_rate_pct one decimal place round_half_up, or null when the denominator is zero"
    variants: []

# ---------------------------------------------------------------------------
# 1.3.1 Conserved-quantity invariants (compensating-action contracts)
# ---------------------------------------------------------------------------
invariants:
  - name: agency_quota_conservation
    conserved_quantity: "PartnerAgency.quota_used - approval slots consumed inside one quota epoch"
    formula: |
      PartnerAgency.quota_used ==
        count(Referral R where R.agency_id == agency.id
                           and R.status IN {APPROVED, FULFILLED}
                           and R.approved_epoch == agency.quota_epoch)
    forward_action: "POST /referrals/{id}/review with decision APPROVE (quota_used += 1, approved_epoch stamped)"
    compensating_action: "POST /_ops/run-cycle expiry pass step 1, APPROVED -> EXPIRED (quota_used -= 1)"
    note: "APPROVED -> FULFILLED must NOT touch quota_used: both statuses are inside the counted set, so the identity holds across fulfilment with zero drift."

  - name: inventory_unit_conservation
    conserved_quantity: "physical stock units held against a VoucherLine"
    formula: |
      VoucherLine.quantity_allocated ==
        count(InventoryItem I where I.reserved_for_voucher_line_id == line.id
                                and I.status IN {RESERVED, STAGED, DELIVERED})
      AND, for every category C,
      count(InventoryItem where category == C and status == 'AVAILABLE')
        returns to its pre-allocation value once every unit reserved for the
        line has been released by the compensating action.
    forward_action: "POST /vouchers/{id}/allocate (AVAILABLE -> RESERVED, quantity_allocated += 1 per unit)"
    compensating_action: "POST /vouchers/{id}/cancel (RESERVED -> AVAILABLE, reserved_for_voucher_line_id cleared, quantity_allocated -= 1 per unit, line -> CANCELLED)"
    note: "available_since is restamped on the way back, so the returned unit re-enters the allocation ranking at the back of its grade queue - the unit count is conserved, the ordering is not. A NO_SHOW is NOT a compensator here: it parks the stock in RESERVED, leaving quantity_allocated untouched."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated top-to-bottom; first failure wins)
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles in the RBAC matrix and that role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body conforms to the endpoint's declared input schema - every required field present, no unknown field, enums drawn from the declared member set, integers within declared ranges, datetimes ISO-8601 UTC, window_end strictly after window_start"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints that accept a body"

  - priority: 4
    category: business_constraint
    check: "limit is an integer in [1,100] and offset is an integer >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 5
    category: existence
    check: "every path-parameter resource exists, validated left-to-right"
    error_id: "ERR_AGENCY_NOT_FOUND | ERR_CLIENT_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_VOUCHER_NOT_FOUND | ERR_DONATION_OFFER_NOT_FOUND | ERR_INVENTORY_ITEM_NOT_FOUND | ERR_TRUCK_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_STOP_NOT_FOUND | ERR_VOLUNTEER_NOT_FOUND | ERR_CREW_ASSIGNMENT_NOT_FOUND | ERR_WAITLIST_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_AGENCY_NOT_FOUND | ERR_CLIENT_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_VOUCHER_NOT_FOUND | ERR_TRUCK_NOT_FOUND | ERR_RUN_NOT_FOUND | ERR_VOLUNTEER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /clients, POST /referrals, POST /vouchers, POST /donation-offers/{id}/schedule-pickup, POST /delivery-runs, POST /delivery-runs/{id}/stops, POST /delivery-runs/{id}/crew"

  - priority: 7
    category: auth
    check: "when X-User-Role is CaseManager, X-User-ID must equal the agency_id reached from the target resource (client.agency_id, referral.agency_id, or voucher -> referral -> agency_id); a case manager may also only create a Client or Referral whose agency_id equals X-User-ID"
    error_id: ERR_AGENCY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /clients, GET /clients/{id}, POST /referrals, GET /referrals/{id}, POST /referrals/{id}/submit, POST /vouchers, GET /vouchers/{id}, POST /vouchers/{id}/cancel, GET /agencies/{id}"

  - priority: 8
    category: auth
    check: "when X-User-Role is Volunteer, X-User-ID must equal the CrewAssignment.volunteer_id being answered, and must equal the Volunteer id being read"
    error_id: ERR_AGENCY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /crew-assignments/{id}/respond, GET /volunteers/{id}"

  - priority: 9
    category: auth
    check: "segregation of duties - the X-User-ID releasing a quarantine must differ from DonationOffer.inspector_user_id stamped by the intake inspection"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /donation-offers/{id}/quarantine-release"

  - priority: 10
    category: state
    check: "the supplied expected_<parent>_version equals the parent entity's current version"
    error_id: "ERR_STALE_VOUCHER_VERSION | ERR_STALE_RUN_VERSION"
    http_status: 412
    applies_to: "POST /vouchers/{id}/allocate, POST /delivery-runs/{id}/stops"

  - priority: 11
    category: state
    check: "the target resource is in a state that has an outgoing transition for this trigger"
    error_id: "ERR_REFERRAL_NOT_SUBMITTED | ERR_REFERRAL_NOT_APPROVED | ERR_VOUCHER_INVALID_STATE | ERR_FEE_STATE_INVALID | ERR_OFFER_INVALID_STATE | ERR_RUN_INVALID_STATE | ERR_STOP_INVALID_STATE | ERR_CREW_ASSIGNMENT_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 12
    category: state
    check: "a RETURNED referral may only be resubmitted while revision_count < MAX_REVISIONS"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /referrals/{id}/submit"

  - priority: 13
    category: business_safety
    check: "the household's bed_bug_status is not CONFIRMED"
    error_id: ERR_CLIENT_BED_BUG_BLOCK
    http_status: 422
    applies_to: "POST /referrals/{id}/submit, POST /referrals/{id}/review (APPROVE only), POST /vouchers, POST /vouchers/{id}/allocate, POST /delivery-runs/{id}/stops"

  - priority: 14
    category: business_safety
    check: "the household is not under a delivery ban - client.status == ACTIVE and (client.delivery_ban_until is null or <= clock_now)"
    error_id: ERR_CLIENT_DELIVERY_BANNED
    http_status: 422
    applies_to: "POST /delivery-runs/{id}/stops"

  - priority: 15
    category: business_safety
    check: "the truck is not under a bed-bug lockout covering the requested window - truck.bed_bug_lockout_until is null or <= the window start being scheduled or dispatched"
    error_id: ERR_TRUCK_BED_BUG_LOCKOUT
    http_status: 409
    applies_to: "POST /donation-offers/{id}/schedule-pickup, POST /delivery-runs/{id}/dispatch"

  - priority: 16
    category: business_safety
    check: "quarantine dwell time has elapsed - clock_now >= offer.quarantine_release_due_at"
    error_id: ERR_QUARANTINE_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /donation-offers/{id}/quarantine-release"

  - priority: 17
    category: business_temporal
    check: "the referral has not expired - clock_now <= referral.expires_at"
    error_id: ERR_REFERRAL_EXPIRED
    http_status: 409
    applies_to: "POST /vouchers, POST /vouchers/{id}/allocate, POST /delivery-runs/{id}/stops"

  - priority: 18
    category: business_temporal
    check: "truck resource window - the requested pickup window must not overlap, under half-open [start,end) semantics, any other DonationOffer in status PICKUP_SCHEDULED on the same truck, nor any DeliveryRun on that truck in status PLANNED, CREWED or DISPATCHED. Touching endpoints (previous end == new start) do NOT overlap."
    error_id: ERR_TRUCK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /donation-offers/{id}/schedule-pickup"

  - priority: 19
    category: business_temporal
    check: "volunteer rest window - the volunteer must not already hold a CrewAssignment in status INVITED or CONFIRMED on another DeliveryRun in status PLANNED, CREWED or DISPATCHED whose window comes within VOLUNTEER_REST_BUFFER_MINUTES of the new run's window, under closed-interval-plus-buffer semantics: reject when new.window_start <= other.window_end + 60 minutes AND other.window_start <= new.window_end + 60 minutes. A gap of exactly 60 minutes still conflicts; 61 minutes does not."
    error_id: ERR_VOLUNTEER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-runs/{id}/crew"

  - priority: 20
    category: business_referential
    check: "at most one Voucher may exist per Referral"
    error_id: ERR_VOUCHER_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /vouchers"

  - priority: 21
    category: business_referential
    check: "the volunteer does not already hold a CrewAssignment in status INVITED or CONFIRMED on this same run"
    error_id: ERR_DUPLICATE_CREW_ASSIGNMENT
    http_status: 409
    applies_to: "POST /delivery-runs/{id}/crew"

  - priority: 22
    category: business_referential
    check: "the requested sequence is not already used by another DeliveryStop on this run in status SCHEDULED"
    error_id: ERR_STOP_SEQUENCE_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-runs/{id}/stops"

  - priority: 23
    category: business_referential
    check: "a PARTIALLY_ALLOCATED voucher may only be scheduled when fill_ratio >= MIN_FILL_RATIO_TO_SCHEDULE (0.5)"
    error_id: ERR_VOUCHER_UNDERFILLED
    http_status: 422
    applies_to: "POST /delivery-runs/{id}/stops"

  - priority: 24
    category: business_constraint
    check: "a DRIVER seat may only be given to a volunteer with lift_certified == true"
    error_id: ERR_DRIVER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /delivery-runs/{id}/crew"

  - priority: 25
    category: business_constraint
    check: "run.load_cubic_feet <= truck.capacity_cubic_feet (inclusive)"
    error_id: ERR_TRUCK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /delivery-runs/{id}/dispatch"

  - priority: 26
    category: business_constraint
    check: "run.confirmed_crew_count >= truck.crew_minimum (inclusive) and run.has_confirmed_driver is true"
    error_id: ERR_CREW_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /delivery-runs/{id}/dispatch"

  - priority: 27
    category: business_fiscal
    check: "the referring agency's standing is not SUSPENDED"
    error_id: ERR_AGENCY_SUSPENDED
    http_status: 409
    applies_to: "POST /referrals/{id}/submit, POST /referrals/{id}/review (APPROVE only)"

  - priority: 28
    category: business_fiscal
    check: "agency.quota_used < agency.quarterly_voucher_quota"
    error_id: ERR_AGENCY_QUOTA_EXHAUSTED
    http_status: 409
    applies_to: "POST /referrals/{id}/review (APPROVE only)"

  - priority: 29
    category: business_fiscal
    check: "RECORD_PAYMENT amount_cents equals voucher.client_due_cents exactly"
    error_id: ERR_FEE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /vouchers/{id}/fee-settlement"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table   (api_prefix is empty: every collection is top-level)
# ---------------------------------------------------------------------------
endpoints:

  # --- operational / test-driving surface ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; until this endpoint is called the server MUST read that instant and MUST NOT fall back to real wall-clock time. Every deadline, quarantine dwell, expiry and rest-buffer rule reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock moves to the supplied instant; no entity is mutated and no expiry runs until POST /_ops/run-cycle is called"]

  - method: POST
    path: "/_ops/run-cycle"
    description: "Advance the operational epoch. Runs, in this pinned order: (1) expire APPROVED referrals past expires_at, (2) expire their vouchers and release reserved stock, (3) recompute every agency's standing, (4) rescore every WAITING waitlist entry with the waitlist_score variant, (5) run the promotion pass, (6) if advance_quota_epoch is true, bump every agency's quota_epoch and zero quota_used. Between steps (3) and (4) it also runs a two-part household pass in this pinned order: (3a) flip Client.bed_bug_status from CONFIRMED to REMEDIATED for every household whose bed_bug_confirmed_at is at least BED_BUG_REMEDIATION_DAYS (60) old, then (3b) lift every ON_HOLD household back to ACTIVE - resetting no_show_strikes to 0 - when its delivery_ban_until is null or has passed AND its bed_bug_status is no longer CONFIRMED. Because 3a precedes 3b, a household remediated in this very cycle is reinstated in the same call."
    roles: [PlatformAdmin]
    code: 200
    input: ["advance_quota_epoch?"]
    output: { expired_referral_count: integer, expired_voucher_count: integer, released_inventory_count: integer, promoted_waitlist_count: integer, restanding_count: integer, reinstated_client_count: integer, quota_epoch_advanced: boolean }
    side_effects:
      - "Referral APPROVED -> EXPIRED with PartnerAgency.quota_used -= 1"
      - "Voucher ISSUED/PARTIALLY_ALLOCATED/ALLOCATED -> EXPIRED, RESERVED stock -> AVAILABLE, WAITING waitlist entries -> EXPIRED"
      - "recompute PartnerAgency.standing via agency_standing_recompute"
      - "recompute WaitlistEntry.priority_score via client_referral_priority_score waitlist_score variant"
      - "promotion pass reserves stock via inventory_allocation_selector and recomputes voucher_delivery_fee provisional variant"
      - "Client ON_HOLD -> ACTIVE with no_show_strikes reset to 0 once the ban lapses"

  # --- agencies ---
  - method: POST
    path: "/agencies"
    description: "Register a referring partner agency."
    roles: [PlatformAdmin]
    code: 201
    input: [name, county, quarterly_voucher_quota]
    output: PartnerAgency
    side_effects: ["quota_used 0, quota_epoch 1, standing GOOD, no_show_credits_owed_cents 0"]

  - method: GET
    path: "/agencies/{id}"
    description: "Read one agency including its live quota and standing."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: []
    output: PartnerAgency
    side_effects: []

  # --- trucks ---
  - method: POST
    path: "/trucks"
    description: "Add a truck to the fleet."
    roles: [PlatformAdmin]
    code: 201
    input: [label, capacity_cubic_feet, home_county, crew_minimum]
    output: Truck
    side_effects: ["bed_bug_lockout_until null"]

  - method: GET
    path: "/trucks/{id}"
    description: "Read one truck including its bed-bug lockout stamp."
    roles: [PlatformAdmin, DispatchPlanner, IntakeCoordinator]
    code: 200
    input: []
    output: Truck
    side_effects: []

  # --- volunteers ---
  - method: POST
    path: "/volunteers"
    description: "Register a moving-labor volunteer."
    roles: [PlatformAdmin]
    code: 201
    input: [name, county, "lift_certified?"]
    output: Volunteer
    side_effects: ["reliability_score 100.0, assigned_hours_month 0.0"]

  - method: GET
    path: "/volunteers/{id}"
    description: "Read one volunteer including reliability score and monthly hours."
    roles: [PlatformAdmin, DispatchPlanner, Volunteer]
    code: 200
    input: []
    output: Volunteer
    side_effects: []

  - method: GET
    path: "/volunteers/{id}/crew-assignments"
    description: "List every crew assignment held by this volunteer (reverse reachability for CrewAssignment.volunteer_id)."
    roles: [PlatformAdmin, DispatchPlanner, Volunteer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  # --- clients ---
  - method: POST
    path: "/clients"
    description: "Register a household under the acting case manager's agency."
    roles: [CaseManager]
    code: 201
    input: [agency_id, household_size, county, "has_infant?"]
    output: Client
    side_effects: ["bed_bug_status CLEAR, no_show_strikes 0, delivery_ban_until null, status ACTIVE"]

  - method: GET
    path: "/clients/{id}"
    description: "Read one household including bed-bug status, strikes and ban stamp."
    roles: [CaseManager, DispatchPlanner, PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/clients"
    description: "List households, filterable by agency (reverse reachability for Client.agency_id)."
    roles: [CaseManager, PlatformAdmin]
    code: 200
    input: ["agency_id?", "status?", "county?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  # --- referrals ---
  - method: POST
    path: "/referrals"
    description: "Draft a referral for a household."
    roles: [CaseManager]
    code: 201
    input: [client_id, agency_id, requested_categories, urgency, "home_visit_completed?", bed_bug_attestation]
    output: Referral
    side_effects: ["status DRAFT, revision_count 0, priority_score 0.0"]

  - method: GET
    path: "/referrals/{id}"
    description: "Read one referral including its priority score and expiry stamp."
    roles: [CaseManager, PlatformAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/referrals"
    description: "List referrals, filterable by client or agency (reverse reachability for Referral.client_id and Referral.agency_id)."
    roles: [CaseManager, PlatformAdmin]
    code: 200
    input: ["client_id?", "agency_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/referrals/{id}/submit"
    description: "Submit a DRAFT referral, or resubmit a RETURNED one (revision round)."
    roles: [CaseManager]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "DRAFT -> SUBMITTED, or RETURNED -> SUBMITTED with revision_count += 1"
      - "recompute Referral.priority_score via client_referral_priority_score intake_score variant"

  - method: POST
    path: "/referrals/{id}/review"
    description: "Record the furniture bank's decision on a SUBMITTED (or RETURNED, for DENY) referral."
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "note?"]
    output: Referral
    side_effects:
      - "APPROVE: status -> APPROVED, approved_at/expires_at/approved_epoch stamped, PartnerAgency.quota_used += 1"
      - "RETURN: status -> RETURNED, review_note stored"
      - "DENY: status -> DENIED, review_note stored"

  # --- vouchers ---
  - method: POST
    path: "/vouchers"
    description: "Issue a voucher with its category lines against an APPROVED referral."
    roles: [CaseManager]
    code: 201
    input: [referral_id, lines]
    output: Voucher
    side_effects: ["create one VoucherLine per element of lines, each in status OPEN with quantity_allocated 0; voucher status ISSUED, fee_status PENDING, fee_basis null"]

  - method: GET
    path: "/vouchers/{id}"
    description: "Read one voucher including both state axes and the current money fields."
    roles: [CaseManager, WarehouseLead, DispatchPlanner, PlatformAdmin]
    code: 200
    input: []
    output: Voucher
    side_effects: []

  - method: GET
    path: "/vouchers"
    description: "List vouchers, filterable by referral (reverse reachability for Voucher.referral_id)."
    roles: [CaseManager, WarehouseLead, DispatchPlanner, PlatformAdmin]
    code: 200
    input: ["referral_id?", "status?", "fee_status?", "limit?", "offset?"]
    output: Voucher[]
    side_effects: []

  - method: GET
    path: "/vouchers/{id}/lines"
    description: "List the lines of a voucher (reverse reachability for VoucherLine.voucher_id)."
    roles: [CaseManager, WarehouseLead, DispatchPlanner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VoucherLine[]
    side_effects: []

  - method: GET
    path: "/vouchers/{id}/stops"
    description: "List the delivery stops booked for a voucher (reverse reachability for DeliveryStop.voucher_id)."
    roles: [CaseManager, DispatchPlanner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DeliveryStop[]
    side_effects: []

  - method: POST
    path: "/vouchers/{id}/allocate"
    description: "Run one allocation round over the voucher's unfilled lines using inventory_allocation_selector. Repeatable: a top-up round against a PARTIALLY_ALLOCATED voucher is a normal operation, which is why the round is guarded by optimistic concurrency on the voucher's version."
    roles: [WarehouseLead]
    code: 200
    input: [expected_voucher_version]
    output: Voucher
    side_effects:
      - "AVAILABLE InventoryItems -> RESERVED with reserved_for_voucher_line_id set"
      - "VoucherLine.quantity_allocated and status recomputed; WaitlistEntry upserted for every shortfall"
      - "Voucher.status -> PARTIALLY_ALLOCATED or ALLOCATED; fill_ratio recomputed"
      - "voucher_delivery_fee provisional variant recomputed and Voucher.fee_basis = PROVISIONAL, but ONLY while fee_status is still PENDING; once the billing axis has left PENDING the four money fields are frozen"
      - "increments Voucher.version by 1"

  - method: POST
    path: "/vouchers/{id}/fee-settlement"
    description: "Advance the billing axis of a voucher independently of its fulfillment axis."
    roles: [PlatformAdmin]
    code: 200
    input: [action, "amount_cents?"]
    output: Voucher
    side_effects:
      - "WAIVE: fee_status -> WAIVED, subsidy_cents = gross_fee_cents, client_due_cents = 0"
      - "INVOICE: fee_status -> INVOICED (requires voucher.status == DELIVERED)"
      - "RECORD_PAYMENT: fee_status -> PAID, amount_paid_cents = amount_cents"
      - "WRITE_OFF: fee_status -> WRITTEN_OFF, client_due_cents = 0"

  - method: POST
    path: "/vouchers/{id}/cancel"
    description: "Cancel a non-terminal voucher and hand its reserved stock back to the warehouse."
    roles: [CaseManager, PlatformAdmin]
    code: 200
    input: [reason]
    output: Voucher
    side_effects:
      - "RESERVED InventoryItems -> AVAILABLE with reserved_for_voucher_line_id cleared and available_since restamped"
      - "all VoucherLine.status -> CANCELLED; WAITING WaitlistEntry rows -> CANCELLED"

  # --- donations ---
  - method: POST
    path: "/donation-offers"
    description: "Log a donor's offer together with its pieces. `items` is a non-empty array of { category, declared_condition, soft_surface, cubic_feet }."
    roles: [IntakeCoordinator]
    code: 201
    input: [donor_name, donor_phone, pickup_county, pickup_window_start, pickup_window_end, items]
    output: DonationOffer
    side_effects: ["create one DonationItem per element of items in decision PENDING, in the order supplied; offer status OFFERED"]

  - method: GET
    path: "/donation-offers/{id}"
    description: "Read one donation offer including triage counts, risk score and quarantine stamps."
    roles: [IntakeCoordinator, WarehouseLead, PlatformAdmin]
    code: 200
    input: []
    output: DonationOffer
    side_effects: []

  - method: GET
    path: "/donation-offers"
    description: "List donation offers, filterable by assigned truck (reverse reachability for DonationOffer.truck_id)."
    roles: [IntakeCoordinator, WarehouseLead, PlatformAdmin]
    code: 200
    input: ["status?", "truck_id?", "pickup_county?", "limit?", "offset?"]
    output: DonationOffer[]
    side_effects: []

  - method: GET
    path: "/donation-offers/{id}/items"
    description: "List the pieces on an offer with their acceptance decisions (reverse reachability for DonationItem.offer_id)."
    roles: [IntakeCoordinator, WarehouseLead, PlatformAdmin]
    code: 200
    input: ["decision?", "limit?", "offset?"]
    output: DonationItem[]
    side_effects: []

  - method: POST
    path: "/donation-offers/{id}/triage"
    description: "Apply the item acceptance criteria to every piece on the offer."
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: DonationOffer
    side_effects:
      - "donation_acceptance_triage sets every DonationItem.decision and reject_reason"
      - "offer -> TRIAGED, or -> REJECTED in the same request when nothing was accepted"
      - "declared_soft_ratio, accepted_item_count, rejected_item_count, bed_bug_risk_score recomputed"

  - method: POST
    path: "/donation-offers/{id}/schedule-pickup"
    description: "Assign a truck to collect a TRIAGED offer inside the donor's window."
    roles: [IntakeCoordinator]
    code: 200
    input: [truck_id]
    output: DonationOffer
    side_effects: ["offer -> PICKUP_SCHEDULED with truck_id set; the truck's window is now occupied for overlap purposes"]

  - method: POST
    path: "/donation-offers/{id}/intake"
    description: "Record the warehouse inspection of a collected offer. `inspections` is an array of { item_id, graded_condition, live_pest_observed } covering exactly the ACCEPTED items."
    roles: [WarehouseLead]
    code: 200
    input: [inspections]
    output: DonationOffer
    side_effects:
      - "mint one InventoryItem per A/B/C-graded piece; D-graded pieces flip to REJECTED with reject_reason CONDITION_BELOW_MIN and mint nothing"
      - "clean branch: stock AVAILABLE and offer -> INSPECTED"
      - "risk branch: stock QUARANTINED (soft-surface pieces DISPOSED when a live pest fired) and offer -> QUARANTINED with dwell stamps"
      - "DonationOffer.inspector_user_id = acting X-User-ID (drives the segregation-of-duties check on release)"
      - "live pest only - CASCADE: Truck.bed_bug_lockout_until stamped, then that truck's PLANNED/CREWED runs whose service_date is today CANCELLED, then their SCHEDULED stops CANCELLED, then those stops' vouchers SCHEDULED -> ALLOCATED, then those runs' crew assignments RELEASED. Runs on later dates inside the lockout are not cancelled - they simply fail dispatch with ERR_TRUCK_BED_BUG_LOCKOUT"

  - method: POST
    path: "/donation-offers/{id}/quarantine-release"
    description: "Release a quarantined offer's stock to the floor. Must be performed by a WarehouseLead whose X-User-ID differs from the inspector who logged the intake."
    roles: [WarehouseLead]
    code: 200
    input: []
    output: DonationOffer
    side_effects: ["every QUARANTINED unit from this offer -> AVAILABLE with available_since = clock_now; offer -> RELEASED"]

  # --- inventory ---
  - method: GET
    path: "/inventory-items/{id}"
    description: "Read one stock unit."
    roles: [WarehouseLead, PlatformAdmin, DispatchPlanner]
    code: 200
    input: []
    output: InventoryItem
    side_effects: []

  - method: GET
    path: "/inventory-items"
    description: "List warehouse stock by category, condition and status (reverse reachability for InventoryItem.donation_item_id and InventoryItem.reserved_for_voucher_line_id)."
    roles: [WarehouseLead, PlatformAdmin, DispatchPlanner]
    code: 200
    input: ["status?", "category?", "condition?", "donation_item_id?", "reserved_for_voucher_line_id?", "limit?", "offset?"]
    output: InventoryItem[]
    side_effects: []

  # --- delivery ---
  - method: POST
    path: "/delivery-runs"
    description: "Plan a truck run for a service date and county."
    roles: [DispatchPlanner]
    code: 201
    input: [truck_id, service_date, window_start, window_end, county, "rescheduled_from_run_id?"]
    output: DeliveryRun
    side_effects: ["status PLANNED, load_cubic_feet 0.0, confirmed_crew_count 0, stop_count 0"]

  - method: GET
    path: "/delivery-runs/{id}"
    description: "Read one run including its live load, crew count and driver flag."
    roles: [DispatchPlanner, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryRun
    side_effects: []

  - method: GET
    path: "/delivery-runs"
    description: "List runs, filterable by truck or by the run they replace (reverse reachability for DeliveryRun.truck_id and DeliveryRun.rescheduled_from_run_id)."
    roles: [DispatchPlanner, PlatformAdmin]
    code: 200
    input: ["truck_id?", "status?", "service_date?", "rescheduled_from_run_id?", "limit?", "offset?"]
    output: DeliveryRun[]
    side_effects: []

  - method: POST
    path: "/delivery-runs/{id}/stops"
    description: "Book a voucher onto a run at a routing position. Guarded by optimistic concurrency on the run's version because a run legitimately carries many stops."
    roles: [DispatchPlanner]
    code: 201
    input: [voucher_id, sequence, expected_run_version]
    output: DeliveryStop
    side_effects:
      - "voucher ALLOCATED or PARTIALLY_ALLOCATED -> SCHEDULED"
      - "DeliveryRun.stop_count and load_cubic_feet recomputed via run_load_and_crew_feasibility"
      - "increments DeliveryRun.version by 1"

  - method: GET
    path: "/delivery-runs/{id}/stops"
    description: "List the stops on a run in routing order (reverse reachability for DeliveryStop.run_id)."
    roles: [DispatchPlanner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DeliveryStop[]
    side_effects: []

  - method: POST
    path: "/delivery-runs/{id}/crew"
    description: "Invite a volunteer onto a run's crew."
    roles: [DispatchPlanner]
    code: 201
    input: [volunteer_id, role_on_crew]
    output: CrewAssignment
    side_effects: ["assignment created in status INVITED; the volunteer's rest window is now claimed for overlap purposes"]

  - method: GET
    path: "/delivery-runs/{id}/crew"
    description: "List the crew invited to a run (reverse reachability for CrewAssignment.run_id)."
    roles: [DispatchPlanner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  - method: POST
    path: "/crew-assignments/{id}/respond"
    description: "Volunteer answers a crew invitation: CONFIRM, DECLINE, or WITHDRAW a prior confirmation."
    roles: [Volunteer]
    code: 200
    input: [response]
    output: CrewAssignment
    side_effects:
      - "CONFIRM: status -> CONFIRMED, Volunteer.assigned_hours_month += 4.0, run may auto-transition PLANNED -> CREWED"
      - "DECLINE: status -> DECLINED"
      - "WITHDRAW: status -> RELEASED, Volunteer.assigned_hours_month -= 4.0, run may auto-transition CREWED -> PLANNED"

  - method: POST
    path: "/delivery-runs/{id}/dispatch"
    description: "Send a crewed run on the road. A run carrying zero SCHEDULED stops is refused with ERR_RUN_INVALID_STATE. Accepted while the run is PLANNED or CREWED - a PLANNED run reaches the crew gate and is refused with ERR_CREW_BELOW_MINIMUM, which is how that error becomes observable; DISPATCHED, COMPLETED and CANCELLED runs are refused earlier with ERR_RUN_INVALID_STATE."
    roles: [DispatchPlanner]
    code: 200
    input: []
    output: DeliveryRun
    side_effects:
      - "run CREWED -> DISPATCHED"
      - "every RESERVED unit held for this run's SCHEDULED stops -> STAGED"
      - "every CrewAssignment still INVITED -> NO_SHOW with Volunteer.reliability_score -= 15.0"

  - method: POST
    path: "/delivery-stops/{id}/outcome"
    description: "Close a stop with DELIVERED, NO_SHOW or REFUSED. `pest_observed_at_residence` defaults to false."
    roles: [DispatchPlanner]
    code: 200
    input: [outcome, "pest_observed_at_residence?"]
    output: DeliveryStop
    side_effects:
      - "DELIVERED: stock STAGED -> DELIVERED, voucher -> DELIVERED with the FINAL fee variant, referral -> FULFILLED, Client.lifetime_vouchers_delivered += 1"
      - "NO_SHOW: no_show_chargeback billed to the agency, STAGED stock reverts to RESERVED, voucher -> ALLOCATED or PARTIALLY_ALLOCATED, Client.no_show_strikes += 1 and the ON_HOLD contagion cascade may fire"
      - "REFUSED: no_show_chargeback at the lower rate, STAGED stock reverts to RESERVED, voucher -> ALLOCATED or PARTIALLY_ALLOCATED, no strike"
      - "pest_observed_at_residence true: Client.bed_bug_status -> CONFIRMED, Client -> ON_HOLD, Truck.bed_bug_lockout_until stamped"
      - "PartnerAgency.standing recomputed; run auto-COMPLETES when its last SCHEDULED stop closes"

  # --- waitlist & reporting ---
  - method: GET
    path: "/waitlist-entries/{id}"
    description: "Read one waitlist entry."
    roles: [PlatformAdmin, CaseManager, WarehouseLead]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: GET
    path: "/waitlist-entries"
    description: "List waitlist entries (reverse reachability for WaitlistEntry.voucher_line_id and WaitlistEntry.client_id)."
    roles: [PlatformAdmin, CaseManager, WarehouseLead]
    code: 200
    input: ["voucher_line_id?", "client_id?", "status?", "category?", "county?", "limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []

  - method: GET
    path: "/reports/unmet-need"
    description: "Unmet-need report grouped by county and category over WAITING waitlist entries."
    roles: [PlatformAdmin, CaseManager]
    code: 200
    input: ["county?", "category?"]
    output: { generated_at: string, rows: array, total_unmet_quantity: integer, total_households_waiting: integer }
    side_effects: []

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_AGENCY_SCOPE_VIOLATION
    http: 403
    condition: "a CaseManager acts on a resource belonging to another agency, or a Volunteer acts on another volunteer's assignment or record"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "quarantine release attempted by the same X-User-ID that recorded the intake inspection"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, unknown field, bad enum member, out-of-range integer, malformed datetime, non-positive interval, or an inspections array that does not cover exactly the ACCEPTED items"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit outside [1,100] or offset negative"
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "agency id in path or body does not resolve"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "client id in path or body does not resolve"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "referral id in path or body does not resolve"
  - id: ERR_VOUCHER_NOT_FOUND
    http: 404
    condition: "voucher id in path or body does not resolve"
  - id: ERR_DONATION_OFFER_NOT_FOUND
    http: 404
    condition: "donation offer id in path does not resolve"
  - id: ERR_INVENTORY_ITEM_NOT_FOUND
    http: 404
    condition: "inventory item id in path does not resolve"
  - id: ERR_TRUCK_NOT_FOUND
    http: 404
    condition: "truck id in path or body does not resolve"
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "delivery run id in path or body (rescheduled_from_run_id) does not resolve"
  - id: ERR_STOP_NOT_FOUND
    http: 404
    condition: "delivery stop id in path does not resolve"
  - id: ERR_VOLUNTEER_NOT_FOUND
    http: 404
    condition: "volunteer id in path or body does not resolve"
  - id: ERR_CREW_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "crew assignment id in path does not resolve"
  - id: ERR_WAITLIST_ENTRY_NOT_FOUND
    http: 404
    condition: "waitlist entry id in path does not resolve"
  - id: ERR_REFERRAL_NOT_SUBMITTED
    http: 409
    condition: "review attempted on a referral whose status is not SUBMITTED (RETURNED is accepted only for decision DENY), or submit attempted on a referral whose status is neither DRAFT nor RETURNED"
  - id: ERR_REFERRAL_NOT_APPROVED
    http: 409
    condition: "voucher issue attempted against a referral whose status is not APPROVED"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "resubmit attempted on a RETURNED referral whose revision_count already equals MAX_REVISIONS (2)"
  - id: ERR_OFFER_INVALID_STATE
    http: 409
    condition: "triage, schedule-pickup, intake or quarantine-release attempted from a donation-offer status that has no such outgoing transition"
  - id: ERR_VOUCHER_INVALID_STATE
    http: 409
    condition: "allocate, cancel or stop-booking attempted from a voucher status that has no such outgoing transition"
  - id: ERR_FEE_STATE_INVALID
    http: 409
    condition: "a fee-settlement action that has no outgoing transition from the voucher's current fee_status, including INVOICE while the voucher is not DELIVERED"
  - id: ERR_RUN_INVALID_STATE
    http: 409
    condition: "dispatch, stop-booking or crew invitation attempted from a run status that has no such outgoing transition"
  - id: ERR_STOP_INVALID_STATE
    http: 409
    condition: "outcome recorded on a stop that is not SCHEDULED, or on a stop whose run has not been dispatched"
  - id: ERR_CREW_ASSIGNMENT_INVALID_STATE
    http: 409
    condition: "CONFIRM/DECLINE on an assignment that is not INVITED, or WITHDRAW on an assignment that is not CONFIRMED"
  - id: ERR_QUARANTINE_NOT_ELAPSED
    http: 409
    condition: "quarantine release attempted before clock_now reaches quarantine_release_due_at"
  - id: ERR_CLIENT_BED_BUG_BLOCK
    http: 422
    condition: "the household's bed_bug_status is CONFIRMED"
  - id: ERR_CLIENT_DELIVERY_BANNED
    http: 422
    condition: "the household is ON_HOLD or its delivery_ban_until has not yet passed"
  - id: ERR_TRUCK_BED_BUG_LOCKOUT
    http: 409
    condition: "the truck's bed_bug_lockout_until is later than the window being scheduled or dispatched"
  - id: ERR_REFERRAL_EXPIRED
    http: 409
    condition: "an operation requires a live referral but clock_now is past referral.expires_at"
  - id: ERR_TRUCK_WINDOW_CONFLICT
    http: 409
    condition: "the pickup window overlaps, under half-open [start,end) semantics, another PICKUP_SCHEDULED offer or a PLANNED/CREWED/DISPATCHED run on the same truck"
  - id: ERR_VOLUNTEER_WINDOW_CONFLICT
    http: 409
    condition: "the volunteer already holds an INVITED or CONFIRMED assignment on a run whose window comes within 60 minutes of the new run's window, closed-interval-plus-buffer"
  - id: ERR_VOUCHER_ALREADY_EXISTS
    http: 409
    condition: "a second voucher issue attempted against a referral that already has one"
  - id: ERR_DUPLICATE_CREW_ASSIGNMENT
    http: 409
    condition: "the volunteer already holds an INVITED or CONFIRMED assignment on this same run"
  - id: ERR_STOP_SEQUENCE_CONFLICT
    http: 409
    condition: "another SCHEDULED stop on this run already occupies the requested sequence"
  - id: ERR_VOUCHER_UNDERFILLED
    http: 422
    condition: "a PARTIALLY_ALLOCATED voucher with fill_ratio below 0.5 is booked onto a run"
  - id: ERR_DRIVER_NOT_CERTIFIED
    http: 422
    condition: "a DRIVER seat is offered to a volunteer whose lift_certified is false"
  - id: ERR_TRUCK_CAPACITY_EXCEEDED
    http: 422
    condition: "run.load_cubic_feet exceeds truck.capacity_cubic_feet at dispatch"
  - id: ERR_CREW_BELOW_MINIMUM
    http: 409
    condition: "dispatch attempted with confirmed_crew_count below truck.crew_minimum or without a confirmed DRIVER"
  - id: ERR_AGENCY_SUSPENDED
    http: 409
    condition: "referral submit or approve attempted while the agency's standing is SUSPENDED"
  - id: ERR_AGENCY_QUOTA_EXHAUSTED
    http: 409
    condition: "referral approve attempted while agency.quota_used already equals quarterly_voucher_quota"
  - id: ERR_FEE_AMOUNT_MISMATCH
    http: 422
    condition: "RECORD_PAYMENT amount_cents does not equal voucher.client_due_cents"
  - id: ERR_STALE_VOUCHER_VERSION
    http: 412
    condition: "expected_voucher_version does not match the voucher's current version"
  - id: ERR_STALE_RUN_VERSION
    http: 412
    condition: "expected_run_version does not match the run's current version"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Furniture bank operations manager. Owns configuration, referral adjudication, billing settlement, the logical clock and the operational run-cycle."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_ops/run-cycle"
      - "POST /agencies"
      - "POST /trucks"
      - "POST /volunteers"
      - "POST /referrals/{id}/review"
      - "POST /vouchers/{id}/fee-settlement"
    shared_operations:
      - "GET /agencies/{id}"
      - "GET /trucks/{id}"
      - "GET /volunteers/{id}"
      - "GET /volunteers/{id}/crew-assignments"
      - "GET /clients/{id}"
      - "GET /clients"
      - "GET /referrals/{id}"
      - "GET /referrals"
      - "GET /vouchers/{id}"
      - "GET /vouchers"
      - "GET /vouchers/{id}/lines"
      - "GET /vouchers/{id}/stops"
      - "POST /vouchers/{id}/cancel"
      - "GET /donation-offers/{id}"
      - "GET /donation-offers"
      - "GET /donation-offers/{id}/items"
      - "GET /inventory-items/{id}"
      - "GET /inventory-items"
      - "GET /delivery-runs/{id}"
      - "GET /delivery-runs"
      - "GET /delivery-runs/{id}/stops"
      - "GET /delivery-runs/{id}/crew"
      - "GET /waitlist-entries/{id}"
      - "GET /waitlist-entries"
      - "GET /reports/unmet-need"

  - name: CaseManager
    description: "Employee of a referring partner agency. Registers households, drafts and submits referrals, issues vouchers, and may cancel a voucher. Scoped: X-User-ID is the agency the case manager works for."
    identity: "entity_backed:PartnerAgency"
    exclusive_operations:
      - "POST /clients"
      - "POST /referrals"
      - "POST /referrals/{id}/submit"
      - "POST /vouchers"
    shared_operations:
      - "GET /agencies/{id}"
      - "GET /clients/{id}"
      - "GET /clients"
      - "GET /referrals/{id}"
      - "GET /referrals"
      - "GET /vouchers/{id}"
      - "GET /vouchers"
      - "GET /vouchers/{id}/lines"
      - "GET /vouchers/{id}/stops"
      - "POST /vouchers/{id}/cancel"
      - "GET /waitlist-entries/{id}"
      - "GET /waitlist-entries"
      - "GET /reports/unmet-need"

  - name: IntakeCoordinator
    description: "Donation desk. Logs donor offers, applies item acceptance criteria and books pickup trucks. Never touches warehouse grading or quarantine."
    identity: opaque
    exclusive_operations:
      - "POST /donation-offers"
      - "POST /donation-offers/{id}/triage"
      - "POST /donation-offers/{id}/schedule-pickup"
    shared_operations:
      - "GET /trucks/{id}"
      - "GET /donation-offers/{id}"
      - "GET /donation-offers"
      - "GET /donation-offers/{id}/items"

  - name: WarehouseLead
    description: "Warehouse floor lead. Records intake inspections, releases quarantine and runs voucher allocation rounds. Segregation of duties: the lead who inspects an offer may never be the lead who releases it."
    identity: opaque
    exclusive_operations:
      - "POST /donation-offers/{id}/intake"
      - "POST /donation-offers/{id}/quarantine-release"
      - "POST /vouchers/{id}/allocate"
    shared_operations:
      - "GET /donation-offers/{id}"
      - "GET /donation-offers"
      - "GET /donation-offers/{id}/items"
      - "GET /inventory-items/{id}"
      - "GET /inventory-items"
      - "GET /vouchers/{id}"
      - "GET /vouchers"
      - "GET /vouchers/{id}/lines"
      - "GET /waitlist-entries/{id}"
      - "GET /waitlist-entries"

  - name: DispatchPlanner
    description: "Routing desk. Plans runs, books stops, invites crew, dispatches trucks and records delivery outcomes."
    identity: opaque
    exclusive_operations:
      - "POST /delivery-runs"
      - "POST /delivery-runs/{id}/stops"
      - "POST /delivery-runs/{id}/crew"
      - "POST /delivery-runs/{id}/dispatch"
      - "POST /delivery-stops/{id}/outcome"
    shared_operations:
      - "GET /trucks/{id}"
      - "GET /volunteers/{id}"
      - "GET /volunteers/{id}/crew-assignments"
      - "GET /clients/{id}"
