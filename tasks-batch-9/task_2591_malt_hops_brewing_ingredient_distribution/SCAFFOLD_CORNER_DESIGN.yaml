              as: WarehouseOperator
              captures: { rd_prod_id: $.data.id }
            - call: "POST /malt-lots"
              payload: { malt_product_id: "${rd_prod_id}", lot_code: "LOT-RD-1", quantity_lbs: 5000 }
              as: WarehouseOperator
              captures: { rd_lot_id: $.data.id }
            - call: "POST /malt-lots/${rd_lot_id}/analysis"
              payload: { color_lovibond: 2.60, extract_pct: 79.90, moisture_pct: 4.20, protein_pct: 11.10, diastatic_power: 95.0 }
              as: WarehouseOperator
              as_user_id: "qa-analyst-1"
            - call: "POST /malt-lots/${rd_lot_id}/release"
              payload: { release_note: "COA on file" }
              as: WarehouseOperator
              as_user_id: "qa-analyst-2"
            - call: "POST /sales-orders"
              payload: { brewer_id: "${rd_id}", requested_ship_date: "2026-09-08T00:00:00Z", purchase_order_ref: "PO-RD" }
              as: Brewer
              as_user_id: "${rd_id}"
              captures: { rd_o_id: $.data.id }
            - call: "POST /sales-orders/${rd_o_id}/lines"
              payload: { item_type: "HOP", quantity: 880, uom: "LB", allocation_source: "SPOT", hop_variety_id: "${rd_citra_id}" }
              as: Brewer
              as_user_id: "${rd_id}"
              captures: { rd_hop_line_id: $.data.id }
            - call: "POST /sales-orders/${rd_o_id}/lines"
              payload: { item_type: "MALT", quantity: 1000, uom: "LB", malt_lot_id: "${rd_lot_id}" }
              as: Brewer
              as_user_id: "${rd_id}"
              captures: { rd_malt_line_id: $.data.id }
          trigger:
            - call: "DELETE /sales-orders/${rd_o_id}/lines/${rd_hop_line_id}"
              payload: {}
              as: Brewer
              as_user_id: "${rd_id}"
              captures: { rd_sub: $.data.subtotal_cents, rd_charge: $.data.chargeable_lbs, rd_count: $.data.line_count, rd_cold: $.data.requires_cold_chain }
            - call: "POST /sales-orders/${rd_o_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${rd_id}"
              captures: { rd_total: $.data.total_cents }
          assert:
            - "after the delete: ${rd_count} == 1, ${rd_charge} == 1000 and ${rd_sub} == 68500 — the rollup is re-derived over the surviving line only"
            - "after the delete: ${rd_cold} == false — the only cold-chain line is gone, so the order no longer needs reefer freight"
            - "after the delete: SalesOrder.${rd_o_id}.freight_cents == 0, pallet_break_fee_cents == 0, small_order_surcharge_cents == 0 and total_cents == 0 — the fee engine runs at confirm, not on delete"
            - "OrderLine.${rd_hop_line_id}.status == REMOVED and OrderLine.${rd_malt_line_id}.status == OPEN"
            - "HopVariety.${rd_citra_id}.available_spot_lbs == 20000 — a DRAFT line never held spot stock to release"
            - "after confirm: ${rd_total} == 105500 (subtotal 68500, freight 25000 at the TIER_1 minimum with no reefer surcharge, pallet break 4500, small-order surcharge 7500)"
            - "deleting the last remaining line then confirming returns HTTP 422 with ERR_ORDER_HAS_NO_LINES"

