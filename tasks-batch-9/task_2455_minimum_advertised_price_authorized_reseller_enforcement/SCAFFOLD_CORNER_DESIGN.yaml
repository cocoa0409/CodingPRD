            - "DistributorChargeback.${cb}.tier_rate_cents_per_unit == 2500"
            - "DistributorChargeback.${cb}.score_delta_applied == 10.0"
            - "Distributor.${dist}.diversion_score == 10.0"
            - "Distributor.${dist}.standing == PROBATION"
            - "Reseller.${res}.review_required == true"

      - name: chargeback_reversal_clears_the_reseller_review_flag
        claim_type: side_effect_execution
        grounds: ["state_machines.DistributorChargeback.transitions.DISPUTED_to_REVERSED", "calculations.reseller_review_required"]
        distinguishing_aspect: "The reversal cascade is symmetric: standing returns to GOOD and the sourcing reseller's review_required is recomputed back to false, proving the flag is derived rather than latched."
        test_recipe:
          setup: ["Chargeback DISPUTED against Northwind (standing PROBATION); reseller Acme sources from Northwind and has review_required true; no traced units are downstream of Acme."]
