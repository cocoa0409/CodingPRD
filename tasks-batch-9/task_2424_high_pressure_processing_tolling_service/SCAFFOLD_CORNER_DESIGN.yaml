            - { call: "POST /lots/${lot1_id}/release-decision", payload: { outcome: "RELEASE", expected_lot_version: "${held_v}" }, as: QualityManager, as_user_id: "qm_carol", captures: { rel_by: $.data.released_by_user_id } }
          assert:
