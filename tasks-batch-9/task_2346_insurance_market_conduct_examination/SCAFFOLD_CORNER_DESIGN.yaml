      - name: late_penalty_floors_effective_completeness_at_zero
        claim_type: aggregation
        grounds:
          - calculations.data_call_completeness
          - entities.DataCall.fields.effective_completeness_pct
          - validations[priority 67 ERR_RESPONSE_INCOMPLETE]
        distinguishing_aspect: |
          A 259-day-late production earns a 129.5 point late penalty against a raw completeness of only
          92.50, so the subtraction goes deeply negative and must clamp at 0.00 rather than store a
          negative percentage. The raw completeness_pct is preserved unclamped at 92.50 alongside it,
          which is what makes the two fields independently observable, and acceptance is then refused
          because the effective figure - not the raw one - is what the 95.00 gate reads.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
