            - call: "GET /disclosure/official-statements/${os_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { os_count_after: "$.data.required_disclosure_event_count", os_adeq_after: "$.data.disclosure_adequacy" }
          assert:
            - "${due_date} == \"2026-01-26\""
            - "${billable_before} == 0 and ${invoice_before} == 300000 (retainer 250000 raised to the MIN_ANNUAL_FEE_CENTS floor)"
            - "${os_count_before} == 0 and ${os_adeq_before} == ADEQUATE and ${os_status} == COMPLIANCE_REVIEW"
            - "hop 1: ${filing_status} == CONFIRMED and ${confirmed_at} == \"2026-08-01T00:00:00Z\""
