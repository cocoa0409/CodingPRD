            - "D_first is the ASSIGNED LEAD; D_second is a spare demonstrator at the same club."
            - "Clock moved to 2026-09-14T08:31:00Z, one minute past the no-show grace instant 08:30Z and 29 minutes before the 09:00Z window start, so notice_hours floors to 0."
