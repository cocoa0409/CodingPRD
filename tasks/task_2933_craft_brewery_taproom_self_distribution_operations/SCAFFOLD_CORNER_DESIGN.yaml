      - name: each_roles_exclusive_operation_is_denied_to_every_other_role
        claim_type: "Cannot perform other roles' exclusive_operations"
        grounds:
          - roles
          - validations.priority_12
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Six denials, one per role boundary that actually matters in this domain, each with a body that would have been accepted from the right role: the regulator cannot brew or prepare a return, the cellar cannot touch the notice, the taproom cannot register a licence, the admin cannot decide its own label, the compliance officer cannot pour. Nothing is persisted by a denied call."
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer 'Ridgeline IPA' created; tank FV-01 created; no batch, licence, pour or report exists yet."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /beers/${beer_id}/filings"
              payload: { filing_type: "LABEL", label_fields: { brand_name: "Ridgeline IPA", abv_statement: "6.8% ALC/VOL", net_contents: "15.5 GAL", health_warning: "GOVERNMENT WARNING: ACCORDING TO THE SURGEON GENERAL" } }
              as: ComplianceOfficer
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
          trigger:
            - call: "POST /brewery/notice"
              payload: { action: "SUSPEND", reason: "cellar operator overreach" }
              as: CellarOperator
              captures: { err_notice: $.data.error_id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-9001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z" }
              as: StateRegulator
              captures: { err_batch: $.data.error_id }
            - call: "POST /state-licenses"
              payload: { state_code: "ID", license_type: "SELF_DISTRIBUTION", annual_barrel_cap: 1000.00, franchise_state: false, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z" }
              as: TaproomStaff
              captures: { err_license: $.data.error_id }
            - call: "POST /beers/${beer_id}/filings/LABEL/decision"
              payload: { decision: "APPROVED", cola_id: "COLA-24-0917" }
              as: BreweryAdmin
              captures: { err_decision: $.data.error_id }
            - call: "POST /excise-reports"
              payload: { period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", taproom_basis: "METERED_POUR" }
              as: StateRegulator
              captures: { err_report: $.data.error_id }
            - call: "POST /event-permits"
              payload: { featured_beer_id: "${beer_id}", event_name: "Cascade Hop Fest", permit_type: "FESTIVAL", venue_state_code: "OR", event_start_utc: "2026-09-12T16:00:00Z", event_end_utc: "2026-09-14T22:00:00Z", requested_bbl: 2.00 }
              as: BreweryAdmin
              captures: { err_permit: $.data.error_id }
          assert:
            - "All six calls: HTTP 403 with error_id == ERR_FORBIDDEN_ROLE"
            - "Brewery.notice_status is still ACTIVE (the denied SUSPEND had no effect)"
            - "Beer.${beer_id}.label_state is still LABEL_PENDING with cola_id null"
            - "GET /batches returns total_count == 0; GET /state-licenses returns total_count == 0"
            - "GET /excise-reports returns total_count == 0; GET /event-permits returns total_count == 0"
            - "Every response body carries the standard envelope with an error_id and a message and no data payload beyond the error fields"

      - name: segregation_of_duties_blocks_self_approval_self_filing_and_self_attestation
