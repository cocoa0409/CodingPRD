              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "GET /talents/${t_id}"
              payload: {}
              as: RightsAdministrator
              captures: { t_v2: $.data.version }
            - call: "POST /consent-grants"
              payload: { talent_id: "${t_id}", grantor_kind: "TALENT", permitted_media_types: ["ADVERTISING"], permitted_use_notes: "Ordinary licence", territory_codes: ["US"], exclusivity: "NON_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z", initial_creation_fee_cents: 300000, per_use_base_fee_cents: 150000, expected_talent_version: "${t_v2}" }
              as: RightsAdministrator
