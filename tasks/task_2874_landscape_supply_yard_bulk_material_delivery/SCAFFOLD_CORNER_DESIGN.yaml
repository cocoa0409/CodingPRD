              as: Contractor
              as_user_id: "${acct_id}"
            - call: "POST /material-orders"
              payload: { contractor_account_id: "${acct_id}", fulfillment_mode: "WILL_CALL" }
              as: Contractor
              as_user_id: "${acct_id}"
              captures: { ord_prebuy: $.data.id }
            - call: "POST /order-lines"
              payload: { material_order_id: "${ord_prebuy}", material_id: "${mat_id}", form: "BULK", quantity: 4.0, use_prebuy: true }
              as: Contractor
