              as: FarmManager
              captures: { flock_id: $.data.id }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 240, rejected_eggs: 0, feed_issued_kg: 0, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_id}", grade: "A", eggs_to_grade: 240 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_id: $.data.id }
            - call: "POST /api/grading-runs/${run_id}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 0, large_count: 240, xlarge_count: 0, jumbo_count: 0, cracked_count: 0, dirty_count: 0, blood_spot_count: 0 }
              as: QualityGrader
              as_user_id: "grader-1"
            - call: "POST /api/grading-runs/${run_id}/confirm"
              payload: {}
              as: QAManager
              as_user_id: "qa-1"
            - call: "GET /api/lots"
              payload: {}
              as: QAManager
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /api/contracts"
              payload: { farm_id: "${farm_id}", retailer_name: "RetailCo", pricing_model: "MARKET_INDEX", spread_cents: 5, margin_pct: 0, claim_premium_pct: 0, claim_required: "NONE", effective_start: "2026-01-01", effective_end: "2026-12-31", weekly_min_dozen: 10, max_open_dozen: 1000 }
              as: ContractManager
              captures: { contract_id: $.data.id }
            - call: "POST /api/contracts/${contract_id}/activate"
              payload: {}
              as: ContractManager
          trigger:
            - call: "POST /api/lots/${lot_id}/hold"
              payload: {}
              as: QAManager
            - call: "POST /api/lots/${lot_id}/release"
              payload: {}
              as: QAManager
              captures: { err1: $.data.error_id }
            - call: "POST /api/lots/${lot_id}/clear-hold"
              payload: {}
              as: QAManager
            - call: "POST /api/lots/${lot_id}/release"
              payload: {}
              as: QAManager
            - call: "POST /api/lots/${lot_id}/hold"
              payload: {}
              as: QAManager
            - call: "POST /api/lots/${lot_id}/allocate"
              payload: { contract_id: "${contract_id}" }
              as: ContractManager
              captures: { err2: $.data.error_id }
            - call: "POST /api/lots/${lot_id}/clear-hold"
              payload: {}
              as: QAManager
            - call: "POST /api/lots/${lot_id}/allocate"
              payload: { contract_id: "${contract_id}" }
              as: ContractManager
          assert:
            - "after first hold: lifecycle_status == FRESH and hold_status == HELD (dimensions independent)"
            - "release while HELD rejected: err1 == ERR_LOT_QUALITY_HELD; lifecycle stays FRESH"
            - "after clear-hold + release: lifecycle_status == RELEASED, hold_status == CLEAR"
            - "allocate while HELD rejected: err2 == ERR_LOT_QUALITY_HELD"
            - "final: lifecycle_status == ALLOCATED and contract.allocated_dozen == 20"

