        claim_type: violation_to_error
        grounds:
          - errors[ERR_STAFFING_INCOMPLETE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / deliver_blocked_until_staff_assignment_is_checked_in
          rationale: "Asserted as the failure path before check-in in that instance."

