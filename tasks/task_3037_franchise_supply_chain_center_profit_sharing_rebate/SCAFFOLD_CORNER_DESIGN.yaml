            - *k_clock
          trigger:
            - call: "POST /supply-centers"
              payload: { center_code: "SC-ADMIN", display_name: "Admin Center", base_weekly_capacity_units: 10000 }
              as: SupplyChainAdmin
              captures: { center_id: $.data.id, center_v: $.data.version }
          assert:
            - "the response status is 201"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: optimistic_concurrency_stale_store_version
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules.purchase-order-submit-stale-store
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "PO submit with stale expected_store_version returns 412."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE. Store ACTIVE. DRAFT PO exists."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P", name: "P", category: "DOUGH", base_cost_cents_per_unit: 100 }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/price-books"
              payload: { product_id: "${prod_id}", store_tier: "STANDARD", markup_pct: 0.0, min_quantity: 1, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z", expected_center_version: "${center_v}" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-OCC", operator_name: "OCC", credit_limit_cents: 1000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/lines"
              payload: { product_id: "${prod_id}", quantity: 10 }
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            # First submit succeeds and bumps version
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/submit"
              payload: { expected_store_version: "${store_v1}" }
              as: StoreManager
              as_user_id: "${store_id}"
            # Second submit with stale version fails
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po_id}/submit"
              payload: { expected_store_version: "${store_v1}" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412"
            - "error_id == ERR_STALE_VERSION"

      - name: cascading_side_effects_center_suspend
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        distinguishing_aspect: "Center suspend cascades: routes CANCELLED, POs REJECTED, stores unaffected."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE with PLANNED route, SUBMITTED PO, ACTIVE store."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-CAS", operator_name: "CAS", credit_limit_cents: 1000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/routes"
              payload: { route_code: "R-CAS", day_of_week: "MONDAY", truck_capacity_units: 10000, assigned_store_ids: ["${store_id}"] }
              as: RouteCoordinator
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /supply-centers/${center_id}/suspend"
              payload: { reason: "cascade" }
              as: SupplyChainAdmin
          assert:
            - "SupplyCenter.${center_id}.status == SUSPENDED"
            - "DeliveryRoute.${route_id}.status == CANCELLED"
            - "Store.${store_id}.status == ACTIVE"

      - name: derived_field_reconciliation_posture
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
        distinguishing_aspect: "Center.posture recomputes when capacity plans change or promotions activate."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE. Capacity plan nearly full."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/capacity-plans"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: SupplyChainAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /supply-centers/${center_id}/capacity-plans/${plan_id}/lock"
              payload: { expected_center_version: "${center_v}" }
              as: SupplyChainAdmin
          assert:
            - "SupplyCenter.${center_id}.posture is recomputed based on capacity state"

      - name: ops_run_checkpoint_stale_po_expiry
        claim_type: ops_run_checkpoint
        grounds:
          - calculations.stale_order_expiry
          - complexity_profile.complexity_layers.ops_run_checkpoint
        distinguishing_aspect: "run_ops expires stale DRAFT and SUBMITTED POs based on age."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE. DRAFT PO created 3 ops runs ago."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores"
              payload: { store_number: "ST-OPS", operator_name: "OPS", credit_limit_cents: 1000000 }
              as: SupplyChainAdmin
              captures: { store_id: $.data.id, store_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /supply-centers/${center_id}/run_ops"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/run_ops"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/run_ops"
              payload: {}
              as: SupplyChainAdmin
          assert:
            - "PurchaseOrder.${po_id}.status == CANCELLED"

      - name: temporal_windowing_promotion_dates
        claim_type: temporal_windowing
        grounds:
          - complexity_profile.complexity_layers.temporal_windowing
        distinguishing_aspect: "Promotion activation and closure driven by logical clock reaching start_date/end_date."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Center ACTIVE. CONFIRMED promotion starting 2026-09-07."
          setup_api_calls:
            - *k_clock
            - *k_center
            - call: "POST /supply-centers/${center_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/products"
              payload: { sku: "P", name: "P", category: "FOOD_INGREDIENT", base_cost_cents_per_unit: 500, is_promotion_eligible: true }
              as: SupplyChainAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/promotions"
              payload: { promotion_code: "TW", start_date: "2026-09-07T00:00:00Z", end_date: "2026-09-14T00:00:00Z", surge_multiplier: 2.0, affected_product_ids: ["${prod_id}"] }
              as: SupplyChainAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /supply-centers/${center_id}/promotions/${promo_id}/confirm"
              payload: {}
              as: SupplyChainAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/run_ops"
              payload: {}
              as: SupplyChainAdmin
          assert:
            - "PromotionEvent.${promo_id}.status == EXECUTING"
            - "SupplyCenter.${center_id}.posture == SURGE_MODE"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_po_submit
