scaffold_corner_design:

  # =========================================================================
  # Entities — creation, retrieval, required fields, computed/system fields
  # =========================================================================
  - section: entities
    instances:
      - name: create_gate_returns_201_with_system_defaults
        claim_type: Creation
        grounds: [entities.Gate, endpoints]
        distinguishing_aspect: "POST /gates with code/terminal/max_wingspan_m returns 201 with status=ACTIVE, active_assignment_count=0, version=1, and a server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /gates"
              payload: { code: "Z1", terminal: "T9", max_wingspan_m: 70 }
              as: OpsAdmin
              captures: { g_id: $.data.id, g_status: $.data.status, g_cnt: $.data.active_assignment_count, g_v: $.data.version }
          assert:
            - "http status == 201"
            - "Gate.${g_id}.status == ACTIVE"
            - "Gate.${g_id}.active_assignment_count == 0"
            - "Gate.${g_id}.version == 1"

      - name: get_gate_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Gate, endpoints]
        distinguishing_aspect: "GET /gates/{id} returns the stored gate with the same code and id created earlier."
        test_recipe:
          setup: ["One gate registered."]
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "Z2", terminal: "T9", max_wingspan_m: 70 }
              as: OpsAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "GET /gates/${g_id}"
              as: OpsAdmin
              captures: { g_code: $.data.code }
          assert:
            - "http status == 200"
            - "Gate.${g_id}.code == Z2"

      - name: list_gates_paginated_envelope
        claim_type: Listing
        grounds: [entities.Gate, endpoints, response_envelope]
        distinguishing_aspect: "GET /gates returns response_type=array with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["Two gates registered."]
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "Z3", terminal: "T9", max_wingspan_m: 70 }
              as: OpsAdmin
            - call: "POST /gates"
              payload: { code: "Z4", terminal: "T9", max_wingspan_m: 70 }
              as: OpsAdmin
          trigger:
            - call: "GET /gates"
              as: OpsAdmin
          assert:
            - "http status == 200"
            - "response_type == array"
            - "meta.total_count >= 2"
            - "has_more present in data envelope"

      - name: get_gate_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /gates/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /gates/00000000-0000-4000-8000-0000000000aa"
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_flight_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Flight, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /flights omitting required sched_departure_utc returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flights"
              payload: { flight_no: "XX1", aircraft_wingspan_m: 60 }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_gate_buffer_default_applied
        claim_type: Defaults
        grounds: [entities.Gate.fields.buffer_minutes, endpoints]
        distinguishing_aspect: "Omitting buffer_minutes on POST /gates applies the default of 10."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /gates"
              payload: { code: "Z5", terminal: "T9", max_wingspan_m: 70 }
              as: OpsAdmin
              captures: { g_id: $.data.id, g_buf: $.data.buffer_minutes }
          assert:
            - "Gate.${g_id}.buffer_minutes == 10"

      - name: flight_scheduled_turn_minutes_computed
        claim_type: Computed Fields
        grounds: [entities.Flight.fields.scheduled_turn_minutes, calculations.turn_time_feasibility]
        distinguishing_aspect: "POST /flights with arrival 09:00 and departure 10:30 computes scheduled_turn_minutes == 90 regardless of any client-supplied value."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /flights"
              payload: { flight_no: "CT9", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T09:00:00Z", sched_departure_utc: "2026-06-10T10:30:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id, f_turn: $.data.scheduled_turn_minutes }
          assert:
            - "Flight.${f_id}.scheduled_turn_minutes == 90"

      - name: gate_assignment_system_id_and_version_ignored_on_input
        claim_type: System Fields
        grounds: [entities.GateAssignment, endpoints]
        distinguishing_aspect: "POST /gate-assignments returns a server-minted id and status=PLANNED; the system stamps these, not the client."
        test_recipe:
          setup: ["Gate G1 and Flight F1 with a feasible 60-minute window."]
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "Z6", terminal: "T9", max_wingspan_m: 80 }
              as: OpsAdmin
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "CT1", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T09:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f_id}", stand_type: "GATE", gate_id: "${g_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z", expected_gate_version: "${g_v}" }
              as: GateController
              captures: { ga_id: $.data.id, ga_status: $.data.status, ga_occ: $.data.occupancy_minutes }
          assert:
            - "http status == 201"
            - "GateAssignment.${ga_id}.status == PLANNED"
            - "GateAssignment.${ga_id}.occupancy_minutes == 60"

      - name: create_gse_invalid_enum_equipment_type
        claim_type: Type Constraints
        grounds: [entities.GroundEquipment.fields.equipment_type, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /ground-equipment with equipment_type not in {GPU,PUSHBACK_TUG,BELT_LOADER,AIR_START} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /ground-equipment"
              payload: { asset_tag: "X1", equipment_type: "FORKLIFT" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_assignment_end_before_start_rejected
        claim_type: Type Constraints
        grounds: [entities.GateAssignment.fields.end_utc, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /gate-assignments with end_utc <= start_utc returns ERR_INVALID_REQUEST (400) before any temporal-overlap check runs."
        test_recipe:
          setup: ["Gate G1 and Flight F1 exist."]
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "Z7", terminal: "T9", max_wingspan_m: 80 }
              as: OpsAdmin
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "CT2", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T09:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f_id}", stand_type: "GATE", gate_id: "${g_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T08:00:00Z", expected_gate_version: "${g_v}" }
              as: GateController
              captures: { err: $.data.error_id }
          assert:
            - "http status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_assignment_stand_type_discriminator_mismatch
        claim_type: Type Constraints
        grounds: [entities.GateAssignment.fields.stand_type, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /gate-assignments with stand_type=GATE but no gate_id (or a remote_stand_id supplied instead) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Flight F1 exists; a RemoteStand exists but is wrongly paired with stand_type=GATE."]
          setup_api_calls:
            - call: "POST /remote-stands"
              payload: { code: "Z8R", max_wingspan_m: 80, capacity: 1 }
              as: OpsAdmin
              captures: { r_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "CT3", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T09:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f_id}", stand_type: "GATE", remote_stand_id: "${r_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z" }
              as: GateController
              captures: { err: $.data.error_id }
          assert:
            - "http status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

  # =========================================================================
  # State machines — invalid-from, terminal lockdown, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: confirm_slot_from_used_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.SlotPermit.REQUESTED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a SlotPermit already in USED is not a legal from-state and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Flight F1; SlotPermit confirmed, clock inside window, then redeemed to USED."]
          setup_api_calls:
            - call: "POST /flights"
              payload: { flight_no: "SM1", aircraft_wingspan_m: 50, sched_arrival_utc: "2026-06-10T12:00:00Z", sched_departure_utc: "2026-06-10T13:00:00Z" }
              as: OpsAdmin
              captures: { f_id: $.data.id }
            - call: "POST /slot-permits"
              payload: { flight_id: "${f_id}", movement_type: "ARRIVAL", slot_time_utc: "2026-06-10T12:00:00Z", tolerance_minutes: 15 }
              as: SlotCoordinator
              captures: { sp_id: $.data.id }
            - call: "POST /slot-permits/${sp_id}/confirm"
              payload: {}
              as: SlotCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T12:00:00Z" }
              as: OpsAdmin
            - call: "POST /slot-permits/${sp_id}/redeem"
              payload: {}
              as: SlotCoordinator
          trigger:
            - call: "POST /slot-permits/${sp_id}/confirm"
              payload: {}
              as: SlotCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: tow_remote_assignment_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.GateAssignment.OCCUPIED_to_TOWED_AWAY, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Towing a REMOTE-stand assignment (stand_type=REMOTE) violates the tow precondition stand_type==GATE and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["RemoteStand R1 cap 2; Flight F1 assigned to R1 and occupied; a second RemoteStand R2 exists as tow target."]
          setup_api_calls:
            - call: "POST /remote-stands"
              payload: { code: "SMR1", max_wingspan_m: 80, capacity: 2 }
              as: OpsAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /remote-stands"
              payload: { code: "SMR2", max_wingspan_m: 80, capacity: 1 }
              as: OpsAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "SM2", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f_id}", stand_type: "REMOTE", remote_stand_id: "${r1_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T10:00:00Z" }
              as: GateController
              captures: { ga_id: $.data.id }
            - call: "POST /gate-assignments/${ga_id}/occupy"
              payload: {}
              as: RampAgent
          trigger:
            - call: "POST /gate-assignments/${ga_id}/tow"
              payload: { target_remote_stand_id: "${r2_id}" }
              as: GateController
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: activate_completed_flight_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Flight.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From the CANCELLED terminal schedule state, POST /flights/{id}/activate is rejected with ERR_INVALID_STATE (409); no transition leaves a terminal state."
        test_recipe:
          setup: ["Flight F1 irops-cancelled (schedule_status CANCELLED)."]
          setup_api_calls:
            - call: "POST /flights"
              payload: { flight_no: "SM3", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
            - call: "POST /flights/${f_id}/irops-cancel"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /flights/${f_id}/activate"
              payload: {}
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: occupy_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.GateAssignment.PLANNED_to_OCCUPIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling /occupy a second time on an already-OCCUPIED assignment returns ERR_INVALID_STATE (409); the trigger is not idempotent past first success."
        test_recipe:
          setup: ["Gate G1; Flight F1 assigned and occupied once."]
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "SMG1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "SM4", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f_id}", stand_type: "GATE", gate_id: "${g_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T10:00:00Z", expected_gate_version: "${g_v}" }
              as: GateController
              captures: { ga_id: $.data.id }
            - call: "POST /gate-assignments/${ga_id}/occupy"
              payload: {}
              as: RampAgent
          trigger:
            - call: "POST /gate-assignments/${ga_id}/occupy"
              payload: {}
              as: RampAgent
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: tow_cycle_invalid_state_covered_by_difficulty
        claim_type: Valid Transition
        grounds: [state_machines.GateAssignment.TOWED_AWAY_to_OCCUPIED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / gateassignment_tow_cycle_occupied_towed_occupied
          rationale: "The OCCUPIED->TOWED_AWAY->OCCUPIED valid cycle is exercised end-to-end by the named §1.8 instance."

  # =========================================================================
  # Calculations — correctness not exercised by §1.8 depth probes
  # =========================================================================
  - section: calculations
    instances:
      - name: gse_cooldown_exact_gap_passes
        claim_type: Correct Result
        grounds: [calculations.equipment_cooldown_overlap, entities.GroundEquipment.fields.turnaround_minutes]
        distinguishing_aspect: "GSE turnaround 20: an existing HELD [10:00,10:40) and a new [11:00,11:30) have exactly a 20-minute gap (start 11:00 == 10:40+20) and the new allocation SUCCEEDS (boundary inclusive)."
        test_recipe:
          setup: ["GroundEquipment GPU with turnaround 20; Flight F1; one HELD GseAllocation [10:00,10:40)."]
          setup_api_calls:
            - call: "POST /ground-equipment"
              payload: { asset_tag: "GPU-CD", equipment_type: "GPU", turnaround_minutes: 20 }
              as: OpsAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "CD1", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T12:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
            - call: "POST /gse-allocations"
              payload: { flight_id: "${f_id}", equipment_id: "${eq_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T10:40:00Z" }
              as: RampAgent
              captures: { ga1_id: $.data.id }
          trigger:
            - call: "POST /gse-allocations"
              payload: { flight_id: "${f_id}", equipment_id: "${eq_id}", start_utc: "2026-06-10T11:00:00Z", end_utc: "2026-06-10T11:30:00Z" }
              as: RampAgent
              captures: { ga2_id: $.data.id, ga2_status: $.data.status }
          assert:
            - "http status == 201"
            - "GseAllocation.${ga2_id}.status == HELD"

      - name: remote_stand_capacity_two_allows_second_overlap
        claim_type: Constants Applied
        grounds: [calculations.remote_stand_capacity_overlap, entities.RemoteStand.fields.capacity]
        distinguishing_aspect: "RemoteStand capacity 2: two overlapping [10:00,11:00] windows both succeed (occupancy reaches 2 == capacity, not exceeding it)."
        test_recipe:
          setup: ["RemoteStand R1 capacity 2; two flights F1,F2; F1 holds [10:00,11:00] on R1."]
          setup_api_calls:
            - call: "POST /remote-stands"
              payload: { code: "CAP2", max_wingspan_m: 80, capacity: 2 }
              as: OpsAdmin
              captures: { r_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "CP1", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T10:00:00Z", sched_departure_utc: "2026-06-10T11:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "CP2", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T10:00:00Z", sched_departure_utc: "2026-06-10T11:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "REMOTE", remote_stand_id: "${r_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T11:00:00Z" }
              as: GateController
              captures: { ga1_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f2_id}", stand_type: "REMOTE", remote_stand_id: "${r_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T11:00:00Z" }
              as: GateController
              captures: { ga2_id: $.data.id, ga2_status: $.data.status }
          assert:
            - "http status == 201"
            - "GateAssignment.${ga2_id}.status == PLANNED"

      - name: turn_time_remote_variant_covered_by_difficulty
        claim_type: Correct Result
        grounds: [calculations.turn_time_feasibility]
        excluded_because:
          difficulty_instance: dual_variant_calc / turn_time_gate_vs_remote_variant_on_gateassignment
          rationale: "turn_time_feasibility correctness at the min-turn boundary is asserted by the named §1.8 instance."

  # =========================================================================
  # Validations — violation -> error for codes not covered by §1.8
  # =========================================================================
  - section: validations
    instances:
      - name: wingspan_exceeded_on_create
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_WINGSPAN_EXCEEDED]"]
        distinguishing_aspect: "POST /gate-assignments where gate.max_wingspan_m (60) < flight.aircraft_wingspan_m (75) returns ERR_WINGSPAN_EXCEEDED (422)."
        test_recipe:
          setup: ["Gate G1 max_wingspan 60; Flight F1 wingspan 75; feasible 60-minute window."]
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "WS1", terminal: "T1", max_wingspan_m: 60, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "WS9", aircraft_wingspan_m: 75, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T09:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f_id}", stand_type: "GATE", gate_id: "${g_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z", expected_gate_version: "${g_v}" }
              as: GateController
              captures: { err: $.data.error_id }
          assert:
            - "http status == 422"
            - "response error_id == ERR_WINGSPAN_EXCEEDED"

      - name: cute_busy_overlap_on_unit
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", calculations.cute_overlap, "errors[ERR_CUTE_BUSY]"]
        distinguishing_aspect: "POST /cute-allocations whose [10:30,11:00) overlaps an existing HELD [10:00,11:00) on the same unit returns ERR_CUTE_BUSY (409)."
        test_recipe:
          setup: ["CuteUnit C1; Flight F1; one HELD CuteAllocation [10:00,11:00) on C1."]
          setup_api_calls:
            - call: "POST /cute-units"
              payload: { label: "CUTE-1", terminal: "T1" }
              as: OpsAdmin
              captures: { c_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "CU1", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T10:00:00Z", sched_departure_utc: "2026-06-10T11:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
            - call: "POST /cute-allocations"
              payload: { flight_id: "${f_id}", cute_unit_id: "${c_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T11:00:00Z" }
              as: RampAgent
              captures: { ca1_id: $.data.id }
          trigger:
            - call: "POST /cute-allocations"
              payload: { flight_id: "${f_id}", cute_unit_id: "${c_id}", start_utc: "2026-06-10T10:30:00Z", end_utc: "2026-06-10T11:00:00Z" }
              as: RampAgent
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409"
            - "response error_id == ERR_CUTE_BUSY"

      - name: cute_adjacent_back_to_back_allowed
        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=9]", calculations.cute_overlap]
        distinguishing_aspect: "POST /cute-allocations [11:00,12:00) immediately after an existing HELD [10:00,11:00) on the same unit SUCCEEDS — half-open adjacency (e2 == s) does not conflict."
        test_recipe:
          setup: ["CuteUnit C1; Flight F1; one HELD CuteAllocation [10:00,11:00) on C1."]
          setup_api_calls:
            - call: "POST /cute-units"
              payload: { label: "CUTE-2", terminal: "T1" }
              as: OpsAdmin
              captures: { c_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "CU2", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T10:00:00Z", sched_departure_utc: "2026-06-10T12:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
            - call: "POST /cute-allocations"
              payload: { flight_id: "${f_id}", cute_unit_id: "${c_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T11:00:00Z" }
              as: RampAgent
              captures: { ca1_id: $.data.id }
          trigger:
            - call: "POST /cute-allocations"
              payload: { flight_id: "${f_id}", cute_unit_id: "${c_id}", start_utc: "2026-06-10T11:00:00Z", end_utc: "2026-06-10T12:00:00Z" }
              as: RampAgent
              captures: { ca2_id: $.data.id, ca2_status: $.data.status }
          assert:
            - "http status == 201"
            - "CuteAllocation.${ca2_id}.status == HELD"

      - name: gse_busy_cooldown_violation
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", calculations.equipment_cooldown_overlap, "errors[ERR_EQUIPMENT_BUSY]"]
        distinguishing_aspect: "POST /gse-allocations starting 10:59 when prior HELD ends 10:40 with turnaround 20 (needs >=11:00) returns ERR_EQUIPMENT_BUSY (409)."
        test_recipe:
          setup: ["GroundEquipment with turnaround 20; Flight F1; one HELD GseAllocation [10:00,10:40)."]
          setup_api_calls:
            - call: "POST /ground-equipment"
              payload: { asset_tag: "GPU-CD2", equipment_type: "GPU", turnaround_minutes: 20 }
              as: OpsAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "CD9", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T12:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
            - call: "POST /gse-allocations"
              payload: { flight_id: "${f_id}", equipment_id: "${eq_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T10:40:00Z" }
              as: RampAgent
              captures: { ga1_id: $.data.id }
          trigger:
            - call: "POST /gse-allocations"
              payload: { flight_id: "${f_id}", equipment_id: "${eq_id}", start_utc: "2026-06-10T10:59:00Z", end_utc: "2026-06-10T11:30:00Z" }
              as: RampAgent
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409"
            - "response error_id == ERR_EQUIPMENT_BUSY"

      - name: slot_double_booked_on_confirm
        claim_type: Violation → Error
        grounds: ["validations[priority=12]", state_machines.SlotPermit.REQUESTED_to_CONFIRMED, "errors[ERR_SLOT_DOUBLE_BOOKED]"]
        distinguishing_aspect: "Confirming a second ARRIVAL SlotPermit at the same slot_time_utc minute when one is already CONFIRMED returns ERR_SLOT_DOUBLE_BOOKED (409)."
        test_recipe:
          setup: ["Two flights; permit P1 ARRIVAL@12:00 confirmed; permit P2 ARRIVAL@12:00 still REQUESTED."]
          setup_api_calls:
            - call: "POST /flights"
              payload: { flight_no: "SD1", aircraft_wingspan_m: 50, sched_arrival_utc: "2026-06-10T12:00:00Z", sched_departure_utc: "2026-06-10T13:00:00Z" }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "SD2", aircraft_wingspan_m: 50, sched_arrival_utc: "2026-06-10T12:00:00Z", sched_departure_utc: "2026-06-10T13:00:00Z" }
              as: OpsAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /slot-permits"
              payload: { flight_id: "${f1_id}", movement_type: "ARRIVAL", slot_time_utc: "2026-06-10T12:00:00Z", tolerance_minutes: 15 }
              as: SlotCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /slot-permits/${p1_id}/confirm"
              payload: {}
              as: SlotCoordinator
            - call: "POST /slot-permits"
              payload: { flight_id: "${f2_id}", movement_type: "ARRIVAL", slot_time_utc: "2026-06-10T12:00:00Z", tolerance_minutes: 15 }
              as: SlotCoordinator
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /slot-permits/${p2_id}/confirm"
              payload: {}
              as: SlotCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "http status == 409"
            - "response error_id == ERR_SLOT_DOUBLE_BOOKED"

      - name: pagination_limit_out_of_range_returns_validation
        claim_type: Violation → Error
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]", response_envelope]
        distinguishing_aspect: "GET /flights?limit=500 exceeds the max of 100 and returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB acceptable."]
          setup_api_calls: []
          trigger:
            - call: "GET /flights?limit=500"
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http status == 422"
            - "response error_id == ERR_VALIDATION"

  # =========================================================================
  # Endpoints — FK reverse-reachability / filtered list discovery
  # =========================================================================
  - section: endpoints
    instances:
      - name: list_assignments_for_flight_subresource
        claim_type: Cross-reference link
        grounds: [endpoints, entities.GateAssignment.fields.flight_id]
        distinguishing_aspect: "GET /flights/{id}/gate-assignments returns the GateAssignment[] whose flight_id is that flight (FK reverse-reachability)."
        test_recipe:
          setup: ["Gate G1; Flight F1 with one PLANNED assignment."]
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "EP1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "EP9", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f_id}", stand_type: "GATE", gate_id: "${g_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T10:00:00Z", expected_gate_version: "${g_v}" }
              as: GateController
              captures: { ga_id: $.data.id }
          trigger:
            - call: "GET /flights/${f_id}/gate-assignments"
              as: GateController
          assert:
            - "http status == 200"
            - "response_type == array"
            - "the returned list contains an assignment whose id == ${ga_id}"

      - name: filtered_list_assignments_by_remote_stand
        claim_type: Cross-reference link
        grounds: [endpoints, entities.GateAssignment.fields.remote_stand_id]
        distinguishing_aspect: "GET /gate-assignments?remote_stand_id=... returns only assignments on that remote stand (filtered-list FK reverse-reachability)."
        test_recipe:
          setup: ["RemoteStand R1 cap 1; Flight F1 with one PLANNED REMOTE assignment on R1."]
          setup_api_calls:
            - call: "POST /remote-stands"
              payload: { code: "EPR1", max_wingspan_m: 80, capacity: 1 }
              as: OpsAdmin
              captures: { r_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "EP8", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f_id}", stand_type: "REMOTE", remote_stand_id: "${r_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T10:00:00Z" }
              as: GateController
              captures: { ga_id: $.data.id }
          trigger:
            - call: "GET /gate-assignments?remote_stand_id=${r_id}"
              as: GateController
          assert:
            - "http status == 200"
            - "response_type == array"
            - "every returned assignment has remote_stand_id == ${r_id}"

  # =========================================================================
  # RBAC — denial of cross-role exclusive operations; missing auth
  # =========================================================================
  - section: rbac
    instances:
      - name: rampagent_cannot_create_gate_assignment
        claim_type: peer_roles
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "RampAgent calling POST /gate-assignments (a GateController-exclusive op) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Gate G1 and Flight F1 exist."]
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "RB1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "RB9", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f_id}", stand_type: "GATE", gate_id: "${g_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T10:00:00Z", expected_gate_version: "${g_v}" }
              as: RampAgent
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403"
            - "response error_id == ERR_FORBIDDEN_ROLE"

      - name: slotcoordinator_cannot_register_gate
        claim_type: peer_roles
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "SlotCoordinator calling POST /gates (an OpsAdmin-exclusive op) returns ERR_FORBIDDEN_ROLE (403) — a different role/op pair than the RampAgent denial."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /gates"
              payload: { code: "RB2", terminal: "T1", max_wingspan_m: 80 }
              as: SlotCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "http status == 403"
            - "response error_id == ERR_FORBIDDEN_ROLE"

      - name: missing_auth_header_unauthenticated
        claim_type: peer_roles
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown X-User-Role returns ERR_UNAUTHENTICATED (401) before any authorization check."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /gates"
              as: Stranger
              captures: { err: $.data.error_id }
          assert:
            - "http status == 401"
            - "response error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Cross-cutting complexity layers — OCC stale-version
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_gate_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-gate]", "errors[ERR_STALE_GATE_VERSION]", entities.Gate.fields.version]
        distinguishing_aspect: "After a first GateAssignment bumps Gate.version, a second create still carrying the stale expected_gate_version (captured-before minus the bump) is rejected with ERR_STALE_GATE_VERSION (412)."
        test_recipe:
          setup: ["Gate G1 (version observed as v0 at create); Flight F1 and Flight F2."]
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "OCC1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g_id: $.data.id, g_v0: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "OC1", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T09:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "OC2", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T12:00:00Z", sched_departure_utc: "2026-06-10T13:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f1_id}", stand_type: "GATE", gate_id: "${g_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z", expected_gate_version: "${g_v0}" }
              as: GateController
              captures: { ga1_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f2_id}", stand_type: "GATE", gate_id: "${g_id}", start_utc: "2026-06-10T12:00:00Z", end_utc: "2026-06-10T13:00:00Z", expected_gate_version: "${g_v0}" }
              as: GateController
              captures: { err: $.data.error_id }
          assert:
            - "http status == 412"
            - "response error_id == ERR_STALE_GATE_VERSION"

      - name: occ_correct_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-gate]", entities.Gate.fields.version]
        distinguishing_aspect: "Creating a GateAssignment with the current expected_gate_version succeeds and Gate.version increments from 1 to 2."
        test_recipe:
          setup: ["Gate G1 (version 1 at create); Flight F1 with a non-conflicting window."]
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "OCC2", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g_id: $.data.id, g_v0: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "OC3", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T09:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f_id}", stand_type: "GATE", gate_id: "${g_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T09:00:00Z", expected_gate_version: "${g_v0}" }
              as: GateController
              captures: { ga_id: $.data.id }
            - call: "GET /gates/${g_id}"
              as: GateController
              captures: { g_v1: $.data.version }
          assert:
            - "http status == 201"
            - "Gate.${g_id}.version == 2"

  # =========================================================================
  # Consistency model — immediate visibility
  # =========================================================================
  - section: consistency_model
    instances:
      - name: derived_counter_visible_immediately_after_occupy
        claim_type: immediate
        grounds: [entities.Gate.fields.active_assignment_count, state_machines.GateAssignment.PLANNED_to_OCCUPIED]
        distinguishing_aspect: "Immediately after /occupy, a fresh GET /gates/{id} shows active_assignment_count == 1 in the same request cycle (no lag)."
        test_recipe:
          setup: ["Gate G1; Flight F1 assigned and occupied."]
          setup_api_calls:
            - call: "POST /gates"
              payload: { code: "CM1", terminal: "T1", max_wingspan_m: 80, buffer_minutes: 10 }
              as: OpsAdmin
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /flights"
              payload: { flight_no: "CM9", aircraft_wingspan_m: 60, sched_arrival_utc: "2026-06-10T08:00:00Z", sched_departure_utc: "2026-06-10T10:00:00Z", min_turn_minutes: 45 }
              as: OpsAdmin
              captures: { f_id: $.data.id }
            - call: "POST /gate-assignments"
              payload: { flight_id: "${f_id}", stand_type: "GATE", gate_id: "${g_id}", start_utc: "2026-06-10T08:00:00Z", end_utc: "2026-06-10T10:00:00Z", expected_gate_version: "${g_v}" }
              as: GateController
              captures: { ga_id: $.data.id }
            - call: "POST /gate-assignments/${ga_id}/occupy"
              payload: {}
              as: RampAgent
          trigger:
            - call: "GET /gates/${g_id}"
              as: GateController
              captures: { cnt: $.data.active_assignment_count }
          assert:
            - "http status == 200"
            - "Gate.${g_id}.active_assignment_count == 1"
