              as_user_id: "${b_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "first_id == second_id (same payload, same key -> same order returned)"
            - "Third call returns 409 with error_id == ERR_DUPLICATE_IDEMPOTENCY_KEY (different payload, same key)"
