scenario: |
  TV Station Traffic & Ad Inventory Scheduling (local network affiliate station): avail inventory by daypart & program, order entry with rate/rating guarantee, log generation & commercial separation rules, preemption & make-good scheduling, copy/instruction receipt & rotation, as-run reconciliation & discrepancy credit, political vs commercial inventory prioritization, post-buy analysis & audience delivery shortfall

domain_name: tv-station-traffic
api_prefix: /traffic

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hierarchical
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Advertiser
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Advertiser legal name"
      - name: agency_name
        type: string
        source: input
        description: "Media agency of record; empty string when direct"
        default: ""
      - name: product_category
        type: enum
        source: input
        description: "Product category used by commercial-separation rules"
        constraints: "one of {AUTOMOTIVE, RETAIL, RESTAURANT, PHARMA, FINANCE, POLITICAL, OTHER}"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum approved outstanding billing in cents; order approval checks against this"
        constraints: ">= 0"

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Program title, e.g. 'Evening News at 6'"
      - name: daypart_code
        type: enum
        source: input
        description: "Broadcast daypart bucket"
        constraints: "one of {EARLY_MORNING, DAYTIME, EARLY_NEWS, PRIME, LATE_NEWS, LATE_FRINGE, OVERNIGHT}"
      - name: airs_weekday
        type: integer
        source: input
        description: "ISO weekday the program airs (1=Mon .. 7=Sun); programs are modeled per-weekday"
        constraints: "1..7"
      - name: start_time_local
        type: string
        source: input
        description: "Local start time HH:MM (24h)"
      - name: duration_minutes
        type: integer
        source: input
        description: "Program length in minutes"
        constraints: ">= 5"
      - name: rating_estimate
        type: number
        source: input
        description: "Station-estimated household rating used for order pricing and post-buy projection"
        constraints: ">= 0"
      - name: is_political_window
        type: boolean
        source: input
        description: "True when the program falls inside a declared political window (lowest-unit-charge and priority rules apply)"
        default: false

  - name: AvailWeek
    parent: null
    common_fields: true
    fields:
      - name: week_start_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) of the Monday that opens this broadcast week"
      - name: status
        type: enum
        source: system
        description: "OPEN (accepting placements), LOCKED (log finalized for at least one day in the week; new placement rejected), CLOSED (fully reconciled)"
        constraints: "one of {OPEN, LOCKED, CLOSED}"
        default: OPEN

  - name: AvailUnit
    parent: AvailWeek
    common_fields: true
    fields:
      - name: avail_week_id
        type: string
        source: system
        description: "FK -> AvailWeek.id; owning broadcast week"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; program whose break inventory this unit describes"
      - name: air_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) of this unit's air date; must fall inside the owning AvailWeek and match Program.airs_weekday"
      - name: break_position
        type: integer
        source: input
        description: "Ordinal commercial break inside the program (1 = first break)"
        constraints: ">= 1"
      - name: total_seconds
        type: integer
        source: input
        description: "Total sellable commercial seconds in this break"
        constraints: "> 0"
      - name: reserved_political_seconds
        type: integer
        source: input
        description: "Seconds inside total_seconds reserved for political spots during a political window; 0 when not in a political window"
        constraints: ">= 0 and <= total_seconds"
        default: 0
      - name: booked_commercial_seconds
        type: integer
        source: computed
        description: "Sum of durations of Spots in state SCHEDULED or PREEMPTED against this unit with spot_class = COMMERCIAL; maintained by placement/preemption side effects"
        default: 0
      - name: booked_political_seconds
        type: integer
        source: computed
        description: "Sum of durations of Spots in state SCHEDULED or PREEMPTED against this unit with spot_class = POLITICAL; maintained by placement/preemption side effects"
        default: 0

  - name: Order
    parent: Advertiser
    common_fields: true
    fields:
      - name: advertiser_id
        type: string
        source: input
        description: "FK -> Advertiser.id; buying advertiser"
      - name: flight_start_date
        type: string
        source: input
        description: "ISO date; first day spots may air"
      - name: flight_end_date
        type: string
        source: input
        description: "ISO date; last day spots may air (inclusive); must be >= flight_start_date"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> SUBMITTED -> APPROVED -> COMPLETED; APPROVED -> REVISED -> SUBMITTED revision loop; CANCELLED reachable from DRAFT/SUBMITTED/APPROVED/REVISED"
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REVISED, CANCELLED, COMPLETED}"
        default: DRAFT
      - name: gross_budget_cents
        type: integer
        source: computed
        description: "Sum over the order's non-cancelled OrderLines of (gross_rate_cents * spots_per_week * weeks_requested); recomputed on line add/cancel"
        default: 0
      - name: revision_no
        type: integer
        source: system
        description: "Order revision counter; starts at 0, +1 each time an APPROVED order is sent back to REVISED"
        default: 0

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; owning order"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; program this line buys"
      - name: weeks_requested
        type: integer
        source: input
        description: "Number of consecutive broadcast weeks the line runs, starting from the week containing the order flight start"
        constraints: ">= 1"
      - name: spots_per_week
        type: integer
        source: input
        description: "Number of spots per week on this line"
        constraints: ">= 1"
      - name: spot_length_seconds
        type: integer
        source: input
        description: "Duration of each spot in seconds"
        constraints: "one of {15, 30, 60, 120}"
      - name: gross_rate_cents
        type: integer
        source: input
        description: "Negotiated gross price per spot in cents"
        constraints: "> 0"
      - name: guaranteed_rating
        type: number
        source: input
        description: "Household rating guaranteed per spot for post-buy audience delivery; 0 means no guarantee"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE while the order is live; CANCELLED removes its spots from future logs"
        constraints: "one of {ACTIVE, CANCELLED}"
        default: ACTIVE

  - name: CopyInstruction
    parent: Advertiser
    common_fields: true
    fields:
      - name: advertiser_id
        type: string
        source: input
        description: "FK -> Advertiser.id; advertiser this copy belongs to"
      - name: length_seconds
        type: integer
        source: input
        description: "Copy duration; must equal the spot_length_seconds of any line it rotates on"
        constraints: "one of {15, 30, 60, 120}"
      - name: rotation_weight
        type: integer
        source: input
        description: "Relative rotation weight among the advertiser's RECEIVED copy of the same length"
        constraints: ">= 1"
        default: 1
      - name: status
        type: enum
        source: system
        description: "PENDING (received by traffic but not cleared), RECEIVED (cleared for air), EXPIRED (withdrawn)"
        constraints: "one of {PENDING, RECEIVED, EXPIRED}"
        default: PENDING

  - name: Spot
    parent: OrderLine
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: system
        description: "FK -> OrderLine.id; owning line"
      - name: avail_unit_id
        type: string
        source: system
        description: "FK -> AvailUnit.id; break the spot is scheduled into (null until first placed)"
        constraints: "nullable"
      - name: copy_instruction_id
        type: string
        source: system
        description: "FK -> CopyInstruction.id; copy selected by rotation at log-finalize time"
        constraints: "nullable"
      - name: spot_class
        type: enum
        source: computed
        description: "POLITICAL when the order's advertiser.product_category == POLITICAL, else COMMERCIAL; fixed at spot creation"
        constraints: "one of {COMMERCIAL, POLITICAL}"
      - name: scheduled_air_date
        type: string
        source: system
        description: "ISO date this spot is scheduled to air; mirrors AvailUnit.air_date of its placement"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "PENDING_PLACEMENT -> SCHEDULED -> AIRED; PREEMPTED -> MAKE_GOOD_OFFERED -> SCHEDULED loop; CANCELLED when the line/order is cancelled or preemption finds no make-good"
        constraints: "one of {PENDING_PLACEMENT, SCHEDULED, PREEMPTED, MAKE_GOOD_OFFERED, AIRED, CANCELLED}"
        default: PENDING_PLACEMENT
      - name: preempt_reason
        type: enum
        source: system
        description: "Why the spot was preempted; set on transition into PREEMPTED"
        constraints: "one of {NONE, POLITICAL_PRIORITY, OVERSOLD, NEWS_OVERRIDE}; NONE unless preempted"
        default: NONE
      - name: make_good_of_spot_id
        type: string
        source: system
        description: "FK -> Spot.id; when this spot is a make-good, the original preempted spot it replaces (self-referential)"
        constraints: "nullable"

  - name: LogDay
    parent: AvailWeek
    common_fields: true
    fields:
      - name: avail_week_id
        type: string
        source: system
        description: "FK -> AvailWeek.id; owning week"
      - name: log_date
        type: string
        source: input
        description: "ISO date of the broadcast log; must fall inside the owning AvailWeek"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> FINALIZED (log locked, spot order fixed, copy assigned) -> RECONCILED (as-run matched, discrepancies posted)"
        constraints: "one of {DRAFT, FINALIZED, RECONCILED}"
        default: DRAFT

  - name: AsRunEntry
    parent: LogDay
    common_fields: false
    fields:
      - name: log_day_id
        type: string
        source: system
        description: "FK -> LogDay.id; owning reconciled log day"
      - name: spot_id
        type: string
        source: input
        description: "FK -> Spot.id; scheduled spot this entry reports on"
      - name: aired
        type: boolean
        source: input
        description: "True when the spot actually aired as scheduled"
      - name: actual_rating
        type: number
        source: input
        description: "Measured household rating for the aired spot; required when aired is true"
        constraints: ">= 0"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Order
    initial_state: DRAFT
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /traffic/orders/{id}/submit"
        actor: SalesRep
        preconditions:
          - "order has >= 1 OrderLine with status == ACTIVE"
        side_effects:
          - "increments Order.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /traffic/orders/{id}/approve"
        actor: TrafficManager
        preconditions:
          - "advertiser outstanding exposure (sum of gross_budget_cents over the advertiser's Orders in APPROVED or COMPLETED status) + this order's gross_budget_cents <= advertiser.credit_limit_cents"
        side_effects:
          - "creates OrderLine.weeks_requested * OrderLine.spots_per_week Spot rows per ACTIVE OrderLine, each with status PENDING_PLACEMENT, spot_class derived from Advertiser.product_category"
          - "increments Order.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /traffic/orders/{id}/reject"
        actor: TrafficManager
        preconditions: []
        side_effects:
          - "increments Order.version by 1"
      - from: APPROVED
        to: REVISED
        trigger: "POST /traffic/orders/{id}/revise"
        actor: SalesRep
        preconditions:
          - "no Spot belonging to the order is in status AIRED"
        side_effects:
          - "sets every Spot of the order with status in {PENDING_PLACEMENT, PREEMPTED, MAKE_GOOD_OFFERED} to CANCELLED"
          - "for every Spot in status SCHEDULED whose scheduled_air_date is NOT covered by a FINALIZED or RECONCILED LogDay (no LogDay row, or a DRAFT one): set the Spot to CANCELLED and decrement the spot's AvailUnit booked_*_seconds by the line's spot_length_seconds (commercial or political bucket per spot_class)"
          - "Spots in status SCHEDULED whose air date IS covered by a FINALIZED or RECONCILED LogDay are left untouched"
          - "increments Order.revision_no by 1"
          - "increments Order.version by 1"
      - from: REVISED
        to: SUBMITTED
        trigger: "POST /traffic/orders/{id}/submit"
        actor: SalesRep
        preconditions:
          - "order has >= 1 OrderLine with status == ACTIVE"
        side_effects:
          - "increments Order.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /traffic/orders/{id}/cancel"
        actor: SalesRep
        preconditions: []
        side_effects:
          - "increments Order.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /traffic/orders/{id}/cancel"
        actor: SalesRep
        preconditions: []
        side_effects:
          - "increments Order.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /traffic/orders/{id}/cancel"
        actor: SalesRep
        preconditions:
          - "no Spot belonging to the order is in status AIRED"
        side_effects:
          - "sets every Spot of the order with status in {PENDING_PLACEMENT, PREEMPTED, MAKE_GOOD_OFFERED} to CANCELLED"
          - "for every Spot in status SCHEDULED whose scheduled_air_date is NOT covered by a FINALIZED or RECONCILED LogDay: set the Spot to CANCELLED and decrement the spot's AvailUnit booked_*_seconds by the line's spot_length_seconds"
          - "increments Order.version by 1"
      - from: REVISED
        to: CANCELLED
        trigger: "POST /traffic/orders/{id}/cancel"
        actor: SalesRep
        preconditions: []
        side_effects:
          - "increments Order.version by 1"
      - from: APPROVED
        to: COMPLETED
        trigger: "system: after every Spot of the order reaches a terminal state (AIRED or CANCELLED) and the order flight_end_date has passed the current logical clock"
        actor: system
        preconditions:
          - "every Spot of the order is in status AIRED or CANCELLED"
        side_effects:
          - "increments Order.version by 1"

  - entity: Spot
    initial_state: PENDING_PLACEMENT
    terminal_states: [AIRED, CANCELLED]
    transitions:
      - from: PENDING_PLACEMENT
        to: SCHEDULED
        trigger: "POST /traffic/spots/{id}/place"
        actor: TrafficManager
        preconditions:
          - "target AvailUnit.air_date lies within the owning Order's [flight_start_date, flight_end_date] inclusive"
          - "target AvailUnit.program_id == owning OrderLine.program_id"
          - "owning AvailWeek.status == OPEN"
          - "owning Order.status == APPROVED"
          - "avail headroom check per calculation avail_headroom_check"
          - "commercial separation check per calculation commercial_separation_check (both directions: candidate vs occupants, occupants vs candidate)"
        side_effects:
          - "sets Spot.avail_unit_id, Spot.scheduled_air_date = AvailUnit.air_date"
          - "increments AvailUnit.booked_commercial_seconds or booked_political_seconds (per spot_class) by the line's spot_length_seconds"
          - "increments Spot.version by 1"
      - from: SCHEDULED
        to: PREEMPTED
        trigger: "POST /traffic/spots/{id}/preempt"
        actor: TrafficManager
        preconditions:
          - "Spot.status == SCHEDULED"
          - "no LogDay in status FINALIZED or RECONCILED covers the spot's scheduled_air_date (a spot locked into a finalized log cannot be manually preempted; misses there surface at reconcile)"
          - "preempt_reason in {POLITICAL_PRIORITY, OVERSOLD, NEWS_OVERRIDE}"
          - "when preempt_reason == POLITICAL_PRIORITY: Spot.spot_class == COMMERCIAL (political spots cannot be preempted for political priority)"
        side_effects:
          - "sets Spot.preempt_reason to the supplied reason"
          - "decrements the spot's AvailUnit booked_*_seconds by the line's spot_length_seconds (bucket per spot_class)"
          - "increments Spot.version by 1"
          - "note: no make-good row is created here; the make-good Spot is created later by POST /traffic/spots/{id}/offer-make-good"
      - from: PREEMPTED
        to: MAKE_GOOD_OFFERED
        trigger: "POST /traffic/spots/{id}/offer-make-good"
        actor: TrafficManager
        preconditions:
          - "Spot.status == PREEMPTED"
          - "no other Spot with make_good_of_spot_id == this spot exists in status MAKE_GOOD_OFFERED or SCHEDULED"
        side_effects:
          - "creates a new Spot row on the same OrderLine with status MAKE_GOOD_OFFERED, make_good_of_spot_id = this spot's id, spot_class equal to this spot's spot_class"
          - "increments Spot.version by 1"
      - from: MAKE_GOOD_OFFERED
        to: SCHEDULED
        trigger: "POST /traffic/spots/{id}/place (applied to the make-good spot row)"
        actor: TrafficManager
        preconditions:
          - "same preconditions as PENDING_PLACEMENT -> SCHEDULED placement, evaluated against the make-good spot's own line"
          - "make-good placement MUST target an AvailUnit whose Program.rating_estimate >= the rating_estimate of the Program of the AvailUnit the original spot was preempted from (comparable-or-better rule); skipped when original spot has no avail_unit_id (never placed)"
        side_effects:
          - "sets the make-good Spot.avail_unit_id, scheduled_air_date"
          - "increments target AvailUnit booked_*_seconds by the line's spot_length_seconds"
          - "increments Spot.version by 1"
      - from: MAKE_GOOD_OFFERED
        to: CANCELLED
        trigger: "POST /traffic/spots/{id}/decline-make-good"
        actor: SalesRep
        preconditions:
          - "Spot.status == MAKE_GOOD_OFFERED"
        side_effects:
          - "if the originating preempted spot (Spot.make_good_of_spot_id) has no other make-good in MAKE_GOOD_OFFERED or SCHEDULED, no further action; the preempted spot remains PREEMPTED until order completion sweep"
          - "increments Spot.version by 1"
      - from: SCHEDULED
        to: AIRED
        trigger: "system: POST /traffic/log-days/{id}/reconcile records AsRunEntry(aired=true) for the spot"
        actor: system
        preconditions:
          - "the LogDay covering the spot's scheduled_air_date is in status FINALIZED"
        side_effects:
          - "increments Spot.version by 1"
      - from: SCHEDULED
        to: PREEMPTED
        trigger: "system: reconcile records AsRunEntry(aired=false) — treated as a missed spot, equivalent to a preemption discovered at air time"
        actor: system
        preconditions:
          - "the LogDay covering the spot's scheduled_air_date is in status FINALIZED"
        side_effects:
          - "sets Spot.preempt_reason = OVERSOLD"
          - "decrements the spot's AvailUnit booked_*_seconds by the line's spot_length_seconds"
          - "increments Spot.version by 1"
          - "posts a discrepancy credit per calculation discrepancy_credit"

  - entity: LogDay
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /traffic/log-days/{id}/finalize"
        actor: TrafficManager
        preconditions:
          - "log_date >= current logical clock date (cannot finalize a past log)"
          - "every Spot scheduled on this log date has copy resolvable: for each such Spot, there exists >= 1 CopyInstruction of the spot's advertiser with status == RECEIVED and length_seconds == the spot's line spot_length_seconds"
        side_effects:
          - "assigns copy_instruction_id to every Spot scheduled on this log date per calculation copy_rotation_select"
          - "sets the owning AvailWeek.status to LOCKED (locking freezes new placements into the week)"
          - "increments LogDay.version by 1"
      - from: FINALIZED
        to: RECONCILED
        trigger: "POST /traffic/log-days/{id}/reconcile"
        actor: BillingClerk
        preconditions:
          - "payload contains exactly one AsRunEntry per Spot in status SCHEDULED whose scheduled_air_date == LogDay.log_date (no missing, no extras)"
          - "each entry with aired == true supplies actual_rating >= 0"
        side_effects:
          - "creates one AsRunEntry row per payload entry (append-only)"
          - "transitions each reported Spot SCHEDULED -> AIRED or SCHEDULED -> PREEMPTED per the Spot machine"
          - "for each AIRED spot whose OrderLine.guaranteed_rating > 0: posts audience-delivery shortfall per calculation audience_delivery_shortfall against the order's post-buy ledger"
          - "for each spot that did not air: posts discrepancy credit per calculation discrepancy_credit"
          - "when every LogDay of the owning AvailWeek is RECONCILED: sets AvailWeek.status = CLOSED"
          - "increments LogDay.version by 1"

  - entity: CopyInstruction
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: RECEIVED
        trigger: "POST /traffic/copy-instructions/{id}/receive"
        actor: CopyCoordinator
        preconditions: []
        side_effects:
          - "increments CopyInstruction.version by 1"
      - from: PENDING
        to: EXPIRED
        trigger: "POST /traffic/copy-instructions/{id}/expire"
        actor: CopyCoordinator
        preconditions: []
        side_effects:
          - "increments CopyInstruction.version by 1"
      - from: RECEIVED
        to: EXPIRED
        trigger: "POST /traffic/copy-instructions/{id}/expire"
        actor: CopyCoordinator
        preconditions:
          - "no FINALIZED LogDay references this copy via Spot.copy_instruction_id with the spot still SCHEDULED"
        side_effects:
          - "increments CopyInstruction.version by 1"

  - entity: AvailWeek
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "system: any LogDay of the week transitions DRAFT -> FINALIZED"
        actor: system
        preconditions: []
        side_effects:
          - "increments AvailWeek.version by 1"
      - from: LOCKED
        to: CLOSED
        trigger: "system: every LogDay of the week reaches RECONCILED"
        actor: system
        preconditions: []
        side_effects:
          - "increments AvailWeek.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-approve-stale-version
    parent_entity: Order
    write_endpoint: "POST /traffic/orders/{id}/approve"
    occ_field: "expected_order_version"
    description: |
      Approving an Order whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      mutated the order (line add/cancel, revision, rejection) between the
      client's read and its approve call, making the client's view of the
      budget and line set stale.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: spot-place-stale-avail
    parent_entity: AvailUnit
    write_endpoint: "POST /traffic/spots/{id}/place"
    occ_field: "expected_avail_unit_version"
    description: |
      Placing a Spot into an AvailUnit whose version has advanced since the
      client last observed it is rejected. Another placement or preemption
      against the same unit advances AvailUnit.version, so the client's
      headroom computation is stale and must be recomputed before retrying.
    error_id: ERR_STALE_AVAIL_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: avail_headroom_check
    trigger: "evaluated on POST /traffic/spots/{id}/place before the placement is accepted"
    algorithm: threshold
    formula: |
      # candidate spot duration d = OrderLine.spot_length_seconds
      # bucket = booked_political_seconds when spot_class == POLITICAL else booked_commercial_seconds
      if spot_class == POLITICAL:
          headroom = AvailUnit.total_seconds - AvailUnit.booked_political_seconds - AvailUnit.booked_commercial_seconds
          accept iff d <= headroom
          # political spots may use ANY free second (reserved or shared)
      else:
          # COMMERCIAL spots are fenced out of the political reserve:
          # they may use at most (total_seconds - reserved_political_seconds) overall
          commercial_capacity = AvailUnit.total_seconds - AvailUnit.reserved_political_seconds
          accept iff AvailUnit.booked_commercial_seconds + d <= commercial_capacity
          # note: booked_political_seconds does not consume commercial capacity;
          # political spill beyond the reserve still leaves commercial capacity intact
          # per station policy — the reserve only fences COMMERCIAL bookings.
      # Boundary: equality is accepted (d == remaining capacity succeeds; d == capacity + 1 fails)
    input_set: "the single target AvailUnit; candidate Spot's OrderLine.spot_length_seconds and Spot.spot_class"
    constants:
      BOUNDARY_INCLUSIVE: true
    precision: "integer seconds; no rounding"
    variants: []

  - name: commercial_separation_check
    trigger: "evaluated on POST /traffic/spots/{id}/place after the headroom check"
    algorithm: constraint_propagation
    formula: |
      # Within one AvailUnit break, two spots of the same product_category must
      # be separated by at least MIN_SEPARATION_POSITIONS distinct other spots
      # between them in the break's airing order. Airing order is derived by
      # sorting the unit's SCHEDULED spots by (Spot.created_at ASC) — creation
      # order is the fixed tie-break; id is never used.
      #
      # candidate c: category = Advertiser.product_category of c's order
      # occupants = Spots S on this AvailUnit with status == SCHEDULED
      # positions = 1-based index of occupants sorted by created_at ASC,
      #             then the candidate appended at the end position len(occupants)+1
      # for each occupant o where category(o) == category(c):
      #     require |position(o) - position(c)| > MIN_SEPARATION_POSITIONS
      # i.e. with MIN_SEPARATION_POSITIONS = 1, two same-category spots cannot
      # be adjacent (distance must be >= 2 positions).
      accept iff no violating pair exists
    input_set: "Spots on the target AvailUnit with status == SCHEDULED, plus the candidate Spot; Advertiser.product_category joined through Order"
    constants:
      MIN_SEPARATION_POSITIONS: 1
    precision: "integer positions; no rounding"
    variants: []

  - name: copy_rotation_select
    trigger: "run per SCHEDULED Spot during POST /traffic/log-days/{id}/finalize"
    algorithm: weighted_scoring
    formula: |
      # Candidates: CopyInstruction rows of the spot's advertiser with
      #   status == RECEIVED and length_seconds == OrderLine.spot_length_seconds
      # Select exactly one, deterministic weighted round-robin by air history:
      #   score(copy) = times_used(copy) / rotation_weight
      #   times_used = count of Spots referencing this copy with copy_instruction_id set
      #                (any status) created BEFORE the current finalize run
      # winner = argmin score; ties broken by CopyInstruction.created_at ASC (earliest first)
      # empty candidate set -> finalize precondition fails (ERR_COPY_NOT_RECEIVED)
      # After selection: Spot.copy_instruction_id = winner.id
    input_set: "CopyInstruction rows for the spot's Advertiser filtered to status == RECEIVED and matching length"
    constants: {}
    precision: "score compared exactly as rational (times_used * other.weight cross-multiplication); no float rounding"
    variants: []

  - name: discrepancy_credit
    trigger: "run during POST /traffic/log-days/{id}/reconcile for every spot reported aired=false; ALSO computed (provisional variant) on POST /traffic/spots/{id}/preempt to preview exposure"
    algorithm: tiered_pricing
    formula: |
      # Base credit: the gross price of the missed spot.
      base = OrderLine.gross_rate_cents
      # Penalty tier on top of base, keyed on HOW LATE the failure was discovered:
      #   discovered at reconcile after a FINALIZED log (aired=false): penalty_pct = LATE_PENALTY_PCT
      #   discovered by manual preempt while log still DRAFT:            penalty_pct = EARLY_PENALTY_PCT
      credit_cents = floor(base * (1 + penalty_pct))
      # pinned rounding order: multiply first, then floor to cents; no per-step rounding
    input_set: "the single missed/preempted Spot, its OrderLine.gross_rate_cents, and the discovery context"
    constants:
      LATE_PENALTY_PCT: 0.25
      EARLY_PENALTY_PCT: 0.0
    precision: "integer cents, floor after multiplication"
    variants:
      - name: provisional
        when: "manual preempt while the covering LogDay is DRAFT — credit is previewed and posted at EARLY_PENALTY_PCT (i.e., base only)"
        difference: "penalty_pct = EARLY_PENALTY_PCT; the credit is posted immediately against the order ledger"
      - name: final
        when: "reconcile discovers aired=false on a FINALIZED log"
        difference: "penalty_pct = LATE_PENALTY_PCT; produces a strictly larger credit for the same spot price"

  - name: audience_delivery_shortfall
    trigger: "run during POST /traffic/log-days/{id}/reconcile for every aired Spot whose OrderLine.guaranteed_rating > 0; aggregated per OrderLine for the post-buy report"
    algorithm: aggregation
    formula: |
      # Per aired spot on a guaranteed line:
      #   booked_impressions  = guaranteed_rating * SPOT_WEIGHT   (rating points promised)
      #   actual_impressions  = actual_rating    * SPOT_WEIGHT   (rating points delivered)
      #   spot_deficit        = max(0, booked - actual)  — over-delivery on one spot
      #                          does NOT offset under-delivery on another
      # Line post-buy rollup (post_buy_deficit_points):
      #   sum of spot_deficit over AIRED spots of the line
      # Shortfall credit (audience deficiency units, ADU) owed per line:
      #   adu_owed = ceil(post_buy_deficit_points * line_airing_count)  — see variant split
      # Reported via GET /traffic/orders/{id}/post-buy
    input_set: "Spots of the OrderLine in status AIRED (exclude PREEMPTED / CANCELLED / never-aired); AsRunEntry.actual_rating joined by spot_id"
    constants:
      SPOT_WEIGHT: 1000
    precision: "deficit per spot to 3 decimal places; rollup summed exactly then ceiling to integer ADU"
    variants:
      - name: per_spot_strict
        when: "default method — deficit measured per spot with no cross-spot offsetting (station-conservative)"
        difference: "over-delivering spots cannot cancel under-delivering ones"
      - name: week_averaged
        when: "agency-negotiated method — ratings averaged across the line's aired spots inside ONE AvailWeek before comparing to the guarantee"
        difference: "deficit = max(0, guaranteed_rating - week_avg_rating) * count_of_aired_spots_in_week; over-delivery DOES offset within the same week; different weeks never offset"

  - name: post_buy_credit_value
    trigger: "aggregated by GET /traffic/orders/{id}/post-buy"
    algorithm: waterfall_allocation
    formula: |
      # Order-level post-buy credit combines two buckets IN ORDER:
      #   bucket 1: discrepancy credits (missed spots) already posted
      #   bucket 2: audience shortfall, valued at the line's average paid CPP:
      #     cpp_cents = OrderLine.gross_rate_cents / OrderLine.guaranteed_rating   (when guarantee > 0)
      #     shortfall_cents = floor(adu_owed_fractional * cpp_cents)  per line, floor AFTER multiply
      #   order_credit_cents = sum(discrepancy credits) + sum(per-line shortfall_cents)
      # Lines with guaranteed_rating == 0 contribute no bucket-2 value.
      # Pinned order: discrepancy bucket computed first; shortfall bucket second;
      # rounding applied per line, not on the order total.
    input_set: "the Order's OrderLines with status ACTIVE or CANCELLED; posted discrepancy credits; audience_delivery_shortfall rollup per line"
    constants: {}
    precision: "integer cents; floor per line after multiplication"
    variants:
      - name: per_spot_strict
        when: "line rollup uses the per_spot_strict variant of audience_delivery_shortfall"
        difference: "adu_owed_fractional = sum of per-spot deficits"
      - name: week_averaged
        when: "line rollup uses the week_averaged variant"
        difference: "adu_owed_fractional = sum of per-week deficits; generally smaller when ratings fluctuate"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path-templated id and every *_id body field resolves to an existing entity, validated left-to-right (path first, then body)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target entity is in a state from which the requested transition exists per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (submit/approve/reject/revise/cancel/place/preempt/offer-make-good/decline-make-good/finalize/reconcile/receive/expire)"
  - priority: 5
    category: business_temporal
    check: "date-window coherence: Order flight_end_date >= flight_start_date; AvailUnit.air_date inside owning AvailWeek and matching Program.airs_weekday; placement target air_date inside the order flight; LogDay.log_date inside owning AvailWeek; finalize only for log_date >= logical clock date"
    error_id: ERR_DATE_WINDOW
    http_status: 422
    applies_to: "order create/update, avail-unit create, log-day create, spot place, log-day finalize"
  - priority: 6
    category: business_referential
    check: "cross-references coherent: OrderLine.program exists; placement target AvailUnit.program_id == OrderLine.program_id; copy length matches line length at rotation; make-good target program rating >= original program rating"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "order-line create, spot place, log-day finalize, make-good place"
  - priority: 7
    category: business_safety
    check: "political inventory protection: COMMERCIAL spot placement rejected when it would consume reserved political seconds (avail_headroom_check commercial branch); POLITICAL_PRIORITY preempt rejected when the target spot is itself POLITICAL"
    error_id: ERR_POLITICAL_RESERVE
    http_status: 422
    applies_to: "spot place, spot preempt"
  - priority: 8
    category: business_constraint
    check: "avail capacity and separation: avail_headroom_check passes; commercial_separation_check passes; no duplicate make-good outstanding for the same preempted spot"
    error_id: ERR_AVAIL_OVERFLOW
    http_status: 422
    applies_to: "spot place"
  - priority: 9
    category: business_constraint
    check: "commercial separation violation (same product_category within MIN_SEPARATION_POSITIONS inside one break)"
    error_id: ERR_SEPARATION_VIOLATION
    http_status: 422
    applies_to: "spot place"
  - priority: 10
    category: business_constraint
    check: "log completeness: finalize requires resolvable copy for every scheduled spot; reconcile payload must cover exactly the SCHEDULED spots of the log date with actual_rating present when aired"
    error_id: ERR_COPY_NOT_RECEIVED
    http_status: 422
    applies_to: "log-day finalize"
  - priority: 11
    category: business_constraint
    check: "reconcile payload completeness: entries missing for scheduled spots, extra entries, or aired=true without actual_rating"
    error_id: ERR_RECONCILE_MISMATCH
    http_status: 422
    applies_to: "log-day reconcile"
  - priority: 12
    category: business_fiscal
    check: "advertiser credit: approving an order must not push the advertiser's outstanding exposure above credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT
    http_status: 422
    applies_to: "order approve"
  - priority: 13
    category: business_fiscal
    check: "non-negative amounts and positive prices: gross_rate_cents > 0, credit_limit_cents >= 0, guaranteed_rating >= 0, rotation_weight >= 1, spot_length_seconds in {15,30,60,120}"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 14
    category: state
    check: "OCC: expected_<parent>_version supplied on guarded writes equals the parent's current version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "order approve"
  - priority: 15
    category: state
    check: "OCC: expected_avail_unit_version equals AvailUnit.version at placement time"
    error_id: ERR_STALE_AVAIL_VERSION
    http_status: 412
    applies_to: "spot place"

