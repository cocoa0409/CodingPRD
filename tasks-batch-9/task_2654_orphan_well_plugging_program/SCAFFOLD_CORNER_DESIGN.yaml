          - calculations.orphan_priority_score.formula
        distinguishing_aspect: |
          Two filters supplied together must intersect, not union: the same min_screening_score of
          59.90 returns two wells under one operator and one under the other. The score filter is
          inclusive, so a well scoring exactly 59.90 is returned at 59.90 and dropped at 59.91,
          and the filter reads the computed score rather than any stored input field.
