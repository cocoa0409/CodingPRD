      - name: extension_revocation_cascades_through_clocks_to_time_limit_closure
        grounds:
          - state_machines.TimeLimitExtension.GRANTED_to_REVOKED
          - calculations.time_limit_clock
          - state_machines.AssistanceCase.benefit_status
          - state_machines.WorkAssignment.ACTIVE_to_TERMINATED
          - entities.TimeLimitMonth.fields.non_countable_reason
          - entities.Household.fields.state_clock_months_used
        distinguishing_aspect: |
          CASCADE C runs through the time-limit ledger rather than the sanction
          ladder: revoking the extension flips the 2026-10 TimeLimitMonth back to
          state-countable (hop 1), lifts Household.state_clock_months_used from 23
          to 24 while extension_months_used drops to 0 (hop 2), closes the case with
          closure_reason TIME_LIMIT (hop 3), and terminates the ACTIVE assignment
          with termination_reason CASE_CLOSED (hop 4) while
