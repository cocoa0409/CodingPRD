# =============================================================================
# SCAFFOLD.yaml — task_1217_concert_tour_routing_advance
# Concert Tour Routing & Advance (touring artist management)
# =============================================================================

scenario: |
  generate task hard than expert level! 1217. Concert Tour Routing & Advance (touring artist management):
  routing optimization by market, travel day & venue availability, hold/confirm workflow with promoters,
  budget per show & tour P&L projection, advance packet exchange (tech rider/hospitality/immigration),
  crew/bus/truck logistics & day sheet, radius clause & competitive date conflicts, ticket on-sale
  timing & marketing spend, settlement roll-up across tour

domain_name: concert-tour-routing-advance
api_prefix: /tours

complexity_profile:
  primary_archetype: posture-driven-gating
  secondary_archetype: temporal-windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Tour
    parent: null
    common_fields: true
    fields:
      - { name: tour_name, type: string, source: input, description: "Display name of the tour" }
      - { name: artist_name, type: string, source: input, description: "Headlining artist" }
      - { name: window_start_date, type: string, source: input, description: "ISO date; earliest permitted show date" }
      - { name: window_end_date, type: string, source: input, description: "ISO date; latest permitted show date (must be > window_start_date)" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived from active ComplianceHold severity (CRITICAL→FROZEN, else STANDARD→RESTRICTED, else OPEN)" }
      - { name: projected_gross_cents, type: integer, source: computed, description: "Sum of projected_gross_cents over shows whose status ∈ {CONFIRMED, ADVANCED, PERFORMED, SETTLED}" }
      - { name: projected_cost_cents, type: integer, source: computed, description: "Sum of projected_cost_cents over the same show set" }
      - { name: settled_gross_cents, type: integer, source: computed, description: "Sum of settled_gross_cents over shows whose settlement_status = PAID" }
      - { name: settled_cost_cents, type: integer, source: computed, description: "Sum of settled_cost_cents over shows whose settlement_status = PAID" }
      - { name: status, type: enum, source: system, description: "PLANNING | ROUTING | ON_SALE | IN_PROGRESS | SETTLEMENT_REVIEW | CLOSED" }

  - name: Market
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id" }
      - { name: market_code, type: string, source: input, description: "Unique metro code within tour (e.g., NYC, LA)" }
      - { name: metro_name, type: string, source: input, description: "Metro area display name" }
      - { name: country_code, type: string, source: input, description: "ISO-3166 alpha-2" }
      - { name: radius_miles, type: integer, source: input, description: "Radius-clause radius around market centroid" }
      - { name: exclusivity_window_days, type: integer, source: input, description: "Days before/after a confirmed show during which competing shows in radius are forbidden" }
      - { name: territory_rank, type: integer, source: input, description: "Promoter priority rank within tour; lower is stronger market; unique within tour" }

  - name: Venue
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id" }
      - { name: market_id, type: string, source: system, description: "FK -> Market.id; venue belongs to a market" }
      - { name: venue_name, type: string, source: input, description: "Venue name" }
      - { name: capacity, type: integer, source: input, description: "Sellable capacity; must be > 0" }
      - { name: base_rent_cents, type: integer, source: input, description: "Flat rent charged per show date" }
      - { name: curfew_local_time, type: string, source: input, description: "HH:MM local curfew" }
      - { name: available_dates, type: array, source: input, description: "Array of ISO dates when venue can host" }
      - { name: booked_dates, type: array, source: computed, description: "Dates where a CONFIRMED/ADVANCED/PERFORMED/SETTLED show occupies the venue" }

  - name: RoutingLeg
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id" }
      - { name: from_market_id, type: string, source: system, description: "FK -> Market.id; origin market" }
      - { name: to_market_id, type: string, source: system, description: "FK -> Market.id; destination market" }
      - { name: travel_date, type: string, source: input, description: "ISO date of travel" }
      - { name: drive_miles, type: integer, source: input, description: "Estimated drive distance" }
      - { name: drive_minutes, type: integer, source: computed, description: "= round(drive_miles * 60 / AVG_SPEED_MPH)" }
      - { name: crew_rest_required, type: boolean, source: computed, description: "true iff drive_minutes > MAX_DRIVE_MINUTES_BEFORE_REST" }
      - { name: leg_index, type: integer, source: input, description: "Sequence index within tour; must be unique" }
      - { name: status, type: enum, source: system, description: "PLANNED | LOCKED | COMPLETED | CANCELLED" }

  - name: Show
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id" }
      - { name: market_id, type: string, source: system, description: "FK -> Market.id" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id" }
      - { name: show_date, type: string, source: input, description: "ISO date of performance; must be within tour window and venue.available_dates" }
      - { name: on_sale_at, type: string, source: input, description: "ISO-8601 UTC timestamp when tickets go on sale; must precede show_date by >= MIN_ON_SALE_LEAD_DAYS" }
      - { name: capacity, type: integer, source: computed, description: "= venue.capacity at confirm time, frozen" }
      - { name: tickets_sold, type: integer, source: input, description: "Cumulative tickets sold; updated by box office feed" }
      - { name: gross_potential_cents, type: integer, source: computed, description: "= capacity * avg_ticket_price_cents" }
      - { name: avg_ticket_price_cents, type: integer, source: input, description: "Blended average ticket price" }
      - { name: projected_gross_cents, type: integer, source: computed, description: "Per projected_show_pnl calculation (dual-variant: pre_on_sale vs post_on_sale)" }
      - { name: projected_cost_cents, type: integer, source: computed, description: "Per projected_show_pnl" }
      - { name: posture, type: enum, source: computed, description: "OPEN | GATED — GATED while any required AdvancePacket section not APPROVED or while Tour.posture != OPEN" }
      - { name: status, type: enum, source: system, description: "HOLD_REQUESTED | HOLD_PLACED | CONFIRMED | ADVANCED | PERFORMED | SETTLED | CANCELLED" }

  - name: PromoterHold
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: promoter_name, type: string, source: input, description: "Promoter company" }
      - { name: hold_expires_at, type: string, source: system, description: "ISO-8601 UTC; = placed_at + HOLD_TTL_HOURS" }
      - { name: guarantee_cents, type: integer, source: input, description: "Artist guarantee offered" }
      - { name: versus_pct, type: integer, source: input, description: "Versus percentage of net (0–100); promoter pays max(guarantee, versus_pct * net)" }
      - { name: counter_count, type: integer, source: computed, description: "Number of counter-offers exchanged; increments on each COUNTER transition" }
      - { name: status, type: enum, source: system, description: "PENDING | COUNTERED | ACCEPTED | REJECTED | EXPIRED | WITHDRAWN" }

  - name: AdvancePacket
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: tech_rider_status, type: enum, source: system, description: "PENDING | SUBMITTED | APPROVED | REJECTED" }
      - { name: hospitality_status, type: enum, source: system, description: "PENDING | SUBMITTED | APPROVED | REJECTED" }
      - { name: immigration_status, type: enum, source: system, description: "PENDING | SUBMITTED | APPROVED | REJECTED | NOT_REQUIRED" }
      - { name: daysheet_issued, type: boolean, source: computed, description: "true iff all three sections APPROVED (or immigration NOT_REQUIRED) and Show.status = ADVANCED" }
      - { name: packet_revision, type: integer, source: computed, description: "Increments each time any section transitions; used by clients for OCC" }

  - name: BudgetLine
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: category, type: enum, source: input, description: "VENUE_RENT | CREW | TRANSPORT | BACKLINE | MARKETING | HOSPITALITY | INSURANCE | MISC" }
      - { name: description, type: string, source: input, description: "Free-text memo" }
      - { name: estimated_cents, type: integer, source: input, description: "Pre-show estimate" }
      - { name: actual_cents, type: integer, source: input, description: "Post-show actual; null until settlement" }
      - { name: is_committed, type: boolean, source: computed, description: "true once Show.status ∈ {CONFIRMED, ADVANCED, PERFORMED, SETTLED}; locked lines cannot be edited without variance" }

  - name: MarketingSpend
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: channel, type: enum, source: input, description: "RADIO | SOCIAL | OOH | PRINT | INFLUENCER" }
      - { name: spend_cents, type: integer, source: input, description: "Amount spent on this channel" }
      - { name: flight_start_date, type: string, source: input, description: "ISO date when spend flight starts" }
      - { name: flight_end_date, type: string, source: input, description: "ISO date when flight ends" }
      - { name: attributed_ticket_sales, type: integer, source: input, description: "Tickets attributed to this channel by box office pixel" }
      - { name: cpa_cents, type: integer, source: computed, description: "= spend_cents / attributed_ticket_sales; null when attributed_ticket_sales = 0" }

  - name: Settlement
    parent: Show
    common_fields: true
    fields:
      - { name: show_id, type: string, source: system, description: "FK -> Show.id" }
      - { name: box_office_gross_cents, type: integer, source: input, description: "Box-office reported gross" }
      - { name: taxes_cents, type: integer, source: input, description: "Applicable admission taxes" }
      - { name: facility_fees_cents, type: integer, source: input, description: "Per-ticket facility fees returned to artist" }
      - { name: promoter_expenses_cents, type: integer, source: input, description: "Promoter-reported expenses" }
      - { name: artist_share_cents, type: integer, source: computed, description: "= max(guarantee, versus_pct * net) where net = box_office_gross - taxes - facility_fees - promoter_expenses; pulls guarantee/versus_pct from accepted PromoterHold" }
      - { name: variance_cents, type: integer, source: computed, description: "= box_office_gross_cents - (tickets_sold * avg_ticket_price_cents); flagged when |variance| > VARIANCE_THRESHOLD_CENTS" }
      - { name: variance_flag, type: enum, source: computed, description: "NONE | MINOR | MATERIAL — MATERIAL when |variance_cents| >= MATERIAL_VARIANCE_CENTS, MINOR when >= VARIANCE_THRESHOLD_CENTS, else NONE" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | VERIFIED | PAID" }

  - name: ComplianceHold
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id" }
      - { name: hold_kind, type: enum, source: input, description: "RADIUS_CONFLICT | VENUE_DOUBLE_BOOK | REST_VIOLATION | BUDGET_OVERRUN | ADVANCE_OVERDUE" }
      - { name: severity, type: enum, source: input, description: "STANDARD | CRITICAL" }
      - { name: related_show_id, type: string, source: input, description: "Optional FK -> Show.id for scoped holds" }
      - { name: reason, type: string, source: input, description: "Free-text rationale" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESOLVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Tour
    field: status
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ROUTING
        trigger: "POST /tours/{tourId}/start-routing"
        actor: TourManager
        preconditions:
          - "Tour.status == PLANNING (ERR_TOUR_NOT_PLANNING)"
          - "At least one Market and one Venue exist under this tour (ERR_TOUR_UNSTAGED)"
        side_effects: []

      - from: ROUTING
        to: ON_SALE
        trigger: "POST /tours/{tourId}/open-on-sale"
        actor: TourManager
        preconditions:
          - "Tour.status == ROUTING (ERR_INVALID_STATE)"
          - "At least one Show with status CONFIRMED exists (ERR_NO_CONFIRMED_SHOWS)"
          - "Tour.posture == OPEN (ERR_POSTURE_NOT_OPEN)"
        side_effects: []

      - from: ON_SALE
        to: IN_PROGRESS
        trigger: "system (automatic when logical clock reaches min(show.on_sale_at) over CONFIRMED shows)"
        actor: system
        preconditions:
          - "current_utc >= min(Show.on_sale_at) where Show.status == CONFIRMED"
        side_effects:
          - "All CONFIRMED shows whose on_sale_at <= current_utc re-project (projected_show_pnl variant flips to post_on_sale)"

      - from: IN_PROGRESS
        to: SETTLEMENT_REVIEW
        trigger: "POST /tours/{tourId}/enter-settlement-review"
        actor: TourManager
        preconditions:
          - "Tour.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "All shows are in {SETTLED, CANCELLED} (ERR_SHOWS_PENDING)"
        side_effects: []

      - from: SETTLEMENT_REVIEW
        to: CLOSED
        trigger: "POST /tours/{tourId}/close"
        actor: TourManager
        preconditions:
          - "Tour.status == SETTLEMENT_REVIEW (ERR_INVALID_STATE)"
          - "All settlements PAID or show CANCELLED (ERR_SETTLEMENTS_OPEN)"
          - "No ACTIVE ComplianceHold (ERR_HOLDS_OUTSTANDING)"
        side_effects: []

  - entity: Tour
    field: posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: "*"
        to: FROZEN
        trigger: "system (automatic when any ComplianceHold with severity=CRITICAL becomes ACTIVE)"
        actor: system
        preconditions:
          - "exists ComplianceHold h where h.tour_id == tour.id AND h.status == ACTIVE AND h.severity == CRITICAL"
        side_effects:
          - "Blocks all show confirm, advance, settle, on-sale transitions"

      - from: "*"
        to: RESTRICTED
        trigger: "system (automatic when no CRITICAL hold but >=1 STANDARD ACTIVE hold)"
        actor: system
        preconditions:
          - "no CRITICAL ACTIVE ComplianceHold AND >=1 STANDARD ACTIVE ComplianceHold"
        side_effects:
          - "Blocks show confirm and on-sale open; allows advance packet edits and holds"

      - from: "*"
        to: OPEN
        trigger: "system (automatic when no ACTIVE ComplianceHold remains)"
        actor: system
        preconditions:
          - "no ACTIVE ComplianceHold"
        side_effects: []

  - entity: RoutingLeg
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOCKED
        trigger: "POST /tours/{tourId}/routing-legs/{legId}/lock"
        actor: TourManager
        preconditions:
          - "RoutingLeg.status == PLANNED (ERR_INVALID_STATE)"
          - "Origin and destination markets each contain at least one CONFIRMED show OR the leg is a non-production ferry leg (ERR_LEG_UNANCHORED)"
          - "crew_rest_required == false OR a rest-day is scheduled between adjacent locked legs (ERR_REST_VIOLATION)"
        side_effects:
          - "tour.posture recalculated (REST_VIOLATION may open a STANDARD ComplianceHold if violated by manual override)"

      - from: LOCKED
        to: COMPLETED
        trigger: "POST /tours/{tourId}/routing-legs/{legId}/complete"
        actor: TourManager
        preconditions:
          - "RoutingLeg.status == LOCKED (ERR_INVALID_STATE)"
          - "logical clock >= travel_date (ERR_LEG_NOT_YET)"
        side_effects: []

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /tours/{tourId}/routing-legs/{legId}/cancel"
        actor: TourManager
        preconditions:
          - "RoutingLeg.status == PLANNED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Show
    field: status
    initial_state: HOLD_REQUESTED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: HOLD_REQUESTED
        to: HOLD_PLACED
        trigger: "system (automatic when a PromoterHold on this show becomes ACCEPTED)"
        actor: system
        preconditions:
          - "PromoterHold.status transitioned to ACCEPTED"
        side_effects:
          - "Show.capacity snapshot = venue.capacity"
          - "Show.gross_potential_cents recomputed"

      - from: HOLD_PLACED
        to: CONFIRMED
        trigger: "POST /tours/{tourId}/shows/{showId}/confirm"
        actor: TourManager
        preconditions:
          - "Show.status == HOLD_PLACED (ERR_INVALID_STATE)"
          - "Tour.posture == OPEN (ERR_POSTURE_NOT_OPEN)"
          - "Venue has show_date in available_dates AND show_date not in booked_dates (ERR_VENUE_UNAVAILABLE)"
          - "No RADIUS_CONFLICT violation (ERR_RADIUS_CONFLICT)"
          - "logical clock + MIN_ON_SALE_LEAD_DAYS <= show_date (ERR_ON_SALE_LEAD_VIOLATED)"
        side_effects:
          - "venue.booked_dates += show_date"
          - "RadiusRule sweep: create STANDARD ComplianceHold for any conflicting show; reject on CRITICAL"
          - "tour.projected_* recomputed"

      - from: CONFIRMED
        to: ADVANCED
        trigger: "POST /tours/{tourId}/shows/{showId}/advance"
        actor: TourManager
        preconditions:
          - "Show.status == CONFIRMED (ERR_INVALID_STATE)"
          - "AdvancePacket all sections APPROVED (or immigration NOT_REQUIRED) (ERR_ADVANCE_INCOMPLETE)"
          - "Tour.posture ∈ {OPEN, RESTRICTED} (ERR_POSTURE_FROZEN)"
        side_effects:
          - "AdvancePacket.daysheet_issued := true"
          - "tour.projected_* recomputed (post_on_sale variant applies when logical clock >= on_sale_at)"

      - from: ADVANCED
        to: PERFORMED
        trigger: "POST /tours/{tourId}/shows/{showId}/mark-performed"
        actor: TourManager
        preconditions:
          - "Show.status == ADVANCED (ERR_INVALID_STATE)"
          - "logical clock >= show_date end-of-day UTC (ERR_SHOW_NOT_YET)"
        side_effects:
          - "Spawn Settlement in DRAFT"
          - "tour.projected_* recomputed (show exits forward projection set)"

      - from: PERFORMED
        to: SETTLED
        trigger: "system (automatic when Settlement.status transitions to PAID)"
        actor: system
        preconditions:
          - "Settlement.status == PAID"
        side_effects:
          - "tour.settled_* recomputed"

      - from: [HOLD_REQUESTED, HOLD_PLACED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /tours/{tourId}/shows/{showId}/cancel"
        actor: TourManager
        preconditions:
          - "Show.status in {HOLD_REQUESTED, HOLD_PLACED, CONFIRMED} (ERR_INVALID_STATE)"
        side_effects:
          - "If status was CONFIRMED: venue.booked_dates -= show_date; promoter-hold WITHDRAWN; tour.posture recalculated"
          - "Cascades: cancel attached PromoterHold (ACCEPTED→WITHDRAWN), reset AdvancePacket all sections to PENDING"

  - entity: Show
    field: posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: "*"
        to: GATED
        trigger: "system (auto when Tour.posture != OPEN OR AdvancePacket has any section not APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Blocks confirm, advance, settle"

      - from: "*"
        to: OPEN
        trigger: "system (auto when Tour.posture == OPEN AND all AdvancePacket sections APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PromoterHold
    field: status
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, EXPIRED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: COUNTERED
        trigger: "POST /tours/{tourId}/shows/{showId}/holds/{holdId}/counter"
        actor: Promoter
        preconditions:
          - "PromoterHold.status == PENDING (ERR_INVALID_STATE)"
          - "logical clock < hold_expires_at (ERR_HOLD_EXPIRED)"
          - "counter_count < MAX_COUNTER_ROUNDS (ERR_COUNTER_LIMIT)"
        side_effects:
          - "counter_count += 1"
          - "hold_expires_at extended by COUNTER_EXTENSION_HOURS"

      - from: COUNTERED
        to: PENDING
        trigger: "POST /tours/{tourId}/shows/{showId}/holds/{holdId}/respond-counter"
        actor: TourManager
        preconditions:
          - "PromoterHold.status == COUNTERED (ERR_INVALID_STATE)"
          - "logical clock < hold_expires_at (ERR_HOLD_EXPIRED)"
        side_effects:
          - "hold payload (guarantee_cents, versus_pct) updated to counter values if accepted by TourManager"

      - from: PENDING
        to: ACCEPTED
        trigger: "POST /tours/{tourId}/shows/{showId}/holds/{holdId}/accept"
        actor: Promoter
        preconditions:
          - "PromoterHold.status == PENDING (ERR_INVALID_STATE)"
          - "logical clock < hold_expires_at (ERR_HOLD_EXPIRED)"
          - "Show.status ∈ {HOLD_REQUESTED, HOLD_PLACED} (ERR_INVALID_STATE)"
        side_effects:
          - "Show HOLD_REQUESTED→HOLD_PLACED if first acceptance"
          - "show.capacity snapshot; venue.booked_dates updated"

      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /tours/{tourId}/shows/{showId}/holds/{holdId}/accept"
        actor: Promoter
        preconditions:
          - "PromoterHold.status == COUNTERED (ERR_INVALID_STATE)"
          - "logical clock < hold_expires_at (ERR_HOLD_EXPIRED)"
        side_effects: []

      - from: [PENDING, COUNTERED]
        to: REJECTED
        trigger: "POST /tours/{tourId}/shows/{showId}/holds/{holdId}/reject"
        actor: Promoter
        preconditions:
          - "PromoterHold.status ∈ {PENDING, COUNTERED} (ERR_INVALID_STATE)"
        side_effects:
          - "Show remains HOLD_REQUESTED; new hold may be placed"

      - from: [PENDING, COUNTERED]
        to: EXPIRED
        trigger: "system (automatic when logical clock >= hold_expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Release venue date if it was soft-blocked"

      - from: [PENDING, COUNTERED, ACCEPTED]
        to: WITHDRAWN
        trigger: "POST /tours/{tourId}/shows/{showId}/holds/{holdId}/withdraw"
        actor: Promoter
        preconditions:
          - "PromoterHold.status ∈ {PENDING, COUNTERED, ACCEPTED} (ERR_INVALID_STATE)"
          - "Show.status != ADVANCED and != PERFORMED (ERR_INVALID_STATE)"
        side_effects:
          - "If hold was ACCEPTED, Show reverts HOLD_PLACED→HOLD_REQUESTED"
          - "venue.booked_dates -= show_date if it was added"

  - entity: AdvancePacket
    field: tech_rider_status
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /tours/{tourId}/shows/{showId}/advance-packet/sections/{section}/submit"
        actor: TourManager
        preconditions:
          - "section.status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "packet_revision += 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /tours/{tourId}/shows/{showId}/advance-packet/sections/{section}/approve"
        actor: VenueRep
        preconditions:
          - "section.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "packet_revision += 1"
          - "show.posture re-evaluated"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tours/{tourId}/shows/{showId}/advance-packet/sections/{section}/reject"
        actor: VenueRep
        preconditions:
          - "section.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "packet_revision += 1"
          - "show.posture re-evaluated"
          - "Rejection cascades: section returns to PENDING for re-submission"

      - from: REJECTED
        to: PENDING
        trigger: "system (auto after rejection recorded)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Settlement
    field: status
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /tours/{tourId}/shows/{showId}/settlement/submit"
        actor: Promoter
        preconditions:
          - "Settlement.status == DRAFT (ERR_INVALID_STATE)"
          - "Show.status == PERFORMED (ERR_SHOW_NOT_PERFORMED)"
        side_effects:
          - "artist_share_cents computed via settlement_artist_share"

      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /tours/{tourId}/shows/{showId}/settlement/verify"
        actor: SettlementAccountant
        preconditions:
          - "Settlement.status == SUBMITTED (ERR_INVALID_STATE)"
          - "variance_flag != MATERIAL (ERR_MATERIAL_VARIANCE)"
          - "Submitter (Promoter X-User-ID) != Verifier (SettlementAccountant X-User-ID) (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: VERIFIED
        to: PAID
        trigger: "POST /tours/{tourId}/shows/{showId}/settlement/pay"
        actor: SettlementAccountant
        preconditions:
          - "Settlement.status == VERIFIED (ERR_INVALID_STATE)"
        side_effects:
          - "Show → SETTLED"
          - "tour.settled_* recomputed"
          - "tour.projected_* recomputed (show removed from projection set)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: show-confirm-stale-tour
    parent_entity: Tour
    write_endpoint: "POST /tours/{tourId}/shows/{showId}/confirm"
    occ_field: "expected_tour_version"
    description: |
      Confirming a show against a Tour whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer has just confirmed a different show (which mutates tour.posture,
      tour.projected_*, and venue.booked_dates via cascade) and the current
      writer's view of the tour is therefore stale.
    error_id: ERR_STALE_TOUR_VERSION
    http_status: 412

  - rule_id: hold-counter-stale-show
    parent_entity: Show
    write_endpoint: "POST /tours/{tourId}/shows/{showId}/holds/{holdId}/counter"
    occ_field: "expected_show_version"
    description: |
      Countering a PromoterHold against a Show whose version has advanced
      since the client last observed it is rejected. Captures the case where
      a different hold on the same show was just accepted, mutating show.status
      and show.capacity, and the countering writer's view is stale.
    error_id: ERR_STALE_SHOW_VERSION
    http_status: 412

  - rule_id: advance-packet-approve-stale
    parent_entity: AdvancePacket
    write_endpoint: "POST /tours/{tourId}/shows/{showId}/advance-packet/sections/{section}/approve"
    occ_field: "expected_packet_revision"
    description: |
      Approving an AdvancePacket section against a packet whose
      packet_revision has advanced since the client last observed it is
      rejected. Captures the case where a parallel section was just rejected
      or approved, mutating packet_revision, and the approving writer's view
      is stale.
    error_id: ERR_STALE_PACKET_REVISION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: projected_show_pnl
    trigger: "show confirm, advance, on-sale clock crossing, settlement pay"
    algorithm: forward_looking
    formula: |
      Let S = the set of shows in this Tour whose status ∈ {CONFIRMED, ADVANCED, PERFORMED, SETTLED}.
      For each show s in S, two variants exist:

      variant PRE_ON_SALE (logical clock < s.on_sale_at):
        s.projected_gross_cents = round(s.capacity * s.avg_ticket_price_cents * PRE_SALE_SELLOUT_FACTOR)
        s.projected_cost_cents  = sum(BudgetLine.estimated_cents where is_committed=true and show_id=s.id)
                                  + s.capacity * PER_TICKET_VARIABLE_COST_CENTS

      variant POST_ON_SALE (logical clock >= s.on_sale_at):
        s.projected_gross_cents = s.tickets_sold * s.avg_ticket_price_cents
                                + (s.capacity - s.tickets_sold) * s.avg_ticket_price_cents * POST_SALE_DECAY
        s.projected_cost_cents  = sum(BudgetLine.estimated_cents where is_committed=true)
                                  + s.tickets_sold * PER_TICKET_VARIABLE_COST_CENTS

      tour.projected_gross_cents = sum(s.projected_gross_cents for s in S)
      tour.projected_cost_cents  = sum(s.projected_cost_cents  for s in S)
      Rounding: each s.projected_* is rounded half-up to integer cents BEFORE summing;
      the tour-level sum then adds integer cents (no second rounding).
    input_set: "shows with status ∈ {CONFIRMED, ADVANCED, PERFORMED, SETTLED}; cancelled and hold-state shows excluded"
    constants:
      PRE_SALE_SELLOUT_FACTOR: 0.65
      POST_SALE_DECAY: 0.35
      PER_TICKET_VARIABLE_COST_CENTS: 350
    precision: "integer cents, round_half_up per show line then sum"
    variants:
      - name: pre_on_sale
        when: "logical clock < show.on_sale_at"
        difference: "uses capacity * PRE_SALE_SELLOUT_FACTOR instead of actual tickets_sold"
      - name: post_on_sale
        when: "logical clock >= show.on_sale_at"
        difference: "uses tickets_sold actuals plus decay on unsold inventory"

  - name: settlement_artist_share
    trigger: "settlement submit"
    algorithm: tiered_pricing
    formula: |
      Inputs pulled from the ACCEPTED PromoterHold on this show:
        G = hold.guarantee_cents
        P = hold.versus_pct / 100.0
      Net calculation:
        net = box_office_gross_cents - taxes_cents - facility_fees_cents - promoter_expenses_cents
        if net < 0: net = 0
      artist_share_cents = max(G, round(net * P))
      Rounding: round_half_up to integer cents.
    input_set: "single settlement row plus its accepted hold"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: guarantee_only
        when: "round(net * P) < G"
        difference: "artist_share = G (guarantee floor)"
      - name: versus_kicks_in
        when: "round(net * P) >= G"
        difference: "artist_share = round(net * P)"

  - name: marketing_cpa
    trigger: "MarketingSpend create or attributed_ticket_sales update"
    algorithm: aggregation
    formula: |
      For each MarketingSpend m:
        if m.attributed_ticket_sales == 0: m.cpa_cents = null
        else: m.cpa_cents = round(m.spend_cents / m.attributed_ticket_sales)  # integer division, round_half_up
      Show-level blended CPA = round(sum(spend_cents) / sum(attributed_ticket_sales))
      when sum(attributed_ticket_sales) > 0 else null.
      NOTE: per-line rounding happens FIRST (per-line CPA is what clients see);
      the blended CPA is computed from raw sums, NOT from the average of rounded CPAs.
    input_set: "all MarketingSpend rows on the show"
    constants: {}
    precision: "integer cents, round_half_up per line; blended from raw sums"
    variants:
      - name: per_line
        when: "exposed on each MarketingSpend row"
        difference: "round(spend/sales) independently per line"
      - name: blended
        when: "aggregated for show-level marketing summary"
        difference: "uses raw sums, not average of rounded per-line values"

  - name: settlement_variance_flag
    trigger: "settlement submit"
    algorithm: threshold
    formula: |
      expected_box_office = show.tickets_sold * show.avg_ticket_price_cents
      variance_cents = box_office_gross_cents - expected_box_office
      abs_v = abs(variance_cents)
      if abs_v >= MATERIAL_VARIANCE_CENTS: variance_flag = MATERIAL
      elif abs_v >= VARIANCE_THRESHOLD_CENTS: variance_flag = MINOR
      else: variance_flag = NONE
      Boundary: at exactly VARIANCE_THRESHOLD_CENTS the flag is MINOR (>=, not >);
      at exactly MATERIAL_VARIANCE_CENTS the flag is MATERIAL.
    input_set: "single settlement row"
    constants:
      VARIANCE_THRESHOLD_CENTS: 50000
      MATERIAL_VARIANCE_CENTS: 500000
    precision: "integer cents"
    variants: []

  - name: routing_leg_drive_time
    trigger: "RoutingLeg create or drive_miles update"
    algorithm: simple
    formula: |
      drive_minutes = round(drive_miles * 60 / AVG_SPEED_MPH)  # round_half_up
      crew_rest_required = (drive_minutes > MAX_DRIVE_MINUTES_BEFORE_REST)
      Boundary: at exactly MAX_DRIVE_MINUTES_BEFORE_REST, crew_rest_required is false
      (strictly greater than, not >=).
    input_set: "single RoutingLeg"
    constants:
      AVG_SPEED_MPH: 55
      MAX_DRIVE_MINUTES_BEFORE_REST: 480
    precision: "integer minutes, round_half_up"
    variants: []

  - name: radius_clause_check
    trigger: "show confirm"
    algorithm: interval_merge
    formula: |
      For the candidate show s with date d, market m, exclusivity window W = m.exclusivity_window_days:
      Conflict set C = { s2 : s2.tour_id == s.tour_id
                          AND s2.status ∈ {CONFIRMED, ADVANCED, PERFORMED, SETTLED}
                          AND s2.market_id != s.market_id
                          AND distance(s2.market, s.market) <= min(m.radius_miles, s2.market.radius_miles)
                          AND |date_diff(s2.show_date, d)| <= min(W, s2.market.exclusivity_window_days) }
      If C is empty: no hold opened.
      Else for each s2 in C: open ComplianceHold(hold_kind=RADIUS_CONFLICT,
        severity=(STANDARD if date_diff == min(W, W2) else CRITICAL),
        related_show_id=s.id)
      Half-open boundary: date_diff == window is CONFLICT; date_diff == window+1 is OK.
    input_set: "shows on the same tour with status ∈ {CONFIRMED, ADVANCED, PERFORMED, SETTLED}"
    constants: {}
    precision: "integer days"
    variants: []

  - name: on_sale_lead_check
    trigger: "show confirm and on-sale-open"
    algorithm: threshold
    formula: |
      require (show_date_as_utc_midnight - on_sale_at) >= MIN_ON_SALE_LEAD_DAYS * 86400 seconds
      At exactly MIN_ON_SALE_LEAD_DAYS, allow (>=, not >).
    input_set: "single Show"
    constants:
      MIN_ON_SALE_LEAD_DAYS: 14
    precision: "integer days"
    variants: []

  - name: hold_expiry_check
    trigger: "any state transition on PromoterHold and each logical clock advance"
    algorithm: threshold
    formula: |
      if logical_clock >= hold.hold_expires_at AND hold.status ∈ {PENDING, COUNTERED}:
        hold.status := EXPIRED
      Boundary: at exactly hold_expires_at, hold is EXPIRED (>=, not >).
    input_set: "PromoterHold rows in PENDING or COUNTERED"
    constants:
      HOLD_TTL_HOURS: 72
      COUNTER_EXTENSION_HOURS: 24
      MAX_COUNTER_ROUNDS: 3
    precision: "UTC timestamp"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted to perform the operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "All path parameters resolve to existing resources (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: business_referential
    check: "Request-body FK references resolve (venue_id, market_id, show_id, etc.) and belong to the same tour"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "create/update endpoints with body FKs"

  - priority: 5
    category: state
    check: "OCC expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_TOUR_VERSION
    http_status: 412
    applies_to: "endpoints guarded by §1.2.1 concurrency rules"

  - priority: 6
    category: state
    check: "Target entity is in a permissible state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 7
    category: state
    check: "Tour.posture != FROZEN for confirm/advance/settle; Tour.posture == OPEN for confirm and on-sale open"
    error_id: ERR_POSTURE_NOT_OPEN
    http_status: 409
    applies_to: "show confirm, tour open-on-sale"

  - priority: 8
    category: business_temporal
    check: "Show date within tour window AND show_date in venue.available_dates AND not in venue.booked_dates"
    error_id: ERR_VENUE_UNAVAILABLE
    http_status: 409
    applies_to: "POST show, POST show/confirm"

  - priority: 9
    category: business_temporal
    check: "On-sale lead time satisfied (show_date - on_sale_at >= MIN_ON_SALE_LEAD_DAYS)"
    error_id: ERR_ON_SALE_LEAD_VIOLATED
    http_status: 409
    applies_to: "POST show/confirm, PATCH show/on-sale"

  - priority: 10
    category: business_safety
    check: "Radius-clause sweep does not produce a CRITICAL conflict"
    error_id: ERR_RADIUS_CONFLICT
    http_status: 409
    applies_to: "POST show/confirm"

  - priority: 11
    category: business_safety
    check: "Crew rest rule satisfied (locked legs must honor rest days)"
    error_id: ERR_REST_VIOLATION
    http_status: 409
    applies_to: "POST routing-leg/lock"

  - priority: 12
    category: business_constraint
    check: "Hold has not exceeded counter rounds, not expired, not in terminal state"
    error_id: ERR_COUNTER_LIMIT
    http_status: 409
    applies_to: "POST hold/counter"

  - priority: 13
    category: business_constraint
    check: "AdvancePacket all sections APPROVED (or immigration NOT_REQUIRED)"
    error_id: ERR_ADVANCE_INCOMPLETE
    http_status: 409
    applies_to: "POST show/advance"

  - priority: 14
    category: business_constraint
    check: "Settlement variance_flag != MATERIAL"
    error_id: ERR_MATERIAL_VARIANCE
    http_status: 409
    applies_to: "POST settlement/verify"

  - priority: 15
    category: business_fiscal
    check: "Sum of is_committed BudgetLine.actual_cents for the show does not exceed budget cap at verify time"
    error_id: ERR_BUDGET_OVERRUN
    http_status: 402
    applies_to: "POST settlement/verify"

  - priority: 16
    category: business_fiscal
    check: "Segregation of duties: settlement submitter (Promoter X-User-ID) != verifier (Accountant X-User-ID)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST settlement/verify"

  - priority: 17
    category: business_constraint
    check: "Market territory_rank unique within tour; RoutingLeg leg_index unique within tour; Venue (market_id, venue_name) unique within tour"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "create endpoints for Market, RoutingLeg, Venue"

  - priority: 18
    category: business_temporal
    check: "Hold expiry: logical clock < hold_expires_at for accept/counter/respond"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST hold accept/counter/respond-counter"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Tour ---
  - method: POST
    path: "/tours"
    description: "Create a tour"
    roles: [TourManager]
    code: 201
    input: [tour_name, artist_name, window_start_date, window_end_date]
    output: Tour
    side_effects: ["status=PLANNING", "posture=OPEN", "all projections zeroed"]

  - method: GET
    path: "/tours"
    description: "List tours (paginated)"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: "Tour[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}"
    description: "Get a tour"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: Tour
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/start-routing"
    description: "Advance tour to ROUTING"
    roles: [TourManager]
    code: 200
    input: []
    output: Tour
    side_effects: ["status → ROUTING"]

  - method: POST
    path: "/tours/{tourId}/open-on-sale"
    description: "Open ticket on-sale across the tour"
    roles: [TourManager]
    code: 200
    input: []
    output: Tour
    side_effects: ["status → ON_SALE"]

  - method: POST
    path: "/tours/{tourId}/enter-settlement-review"
    description: "Move tour into SETTLEMENT_REVIEW"
    roles: [TourManager]
    code: 200
    input: []
    output: Tour
    side_effects: ["status → SETTLEMENT_REVIEW"]

  - method: POST
    path: "/tours/{tourId}/close"
    description: "Close tour"
    roles: [TourManager]
    code: 200
    input: []
    output: Tour
    side_effects: ["status → CLOSED"]

  # --- Market ---
  - method: POST
    path: "/tours/{tourId}/markets"
    description: "Create a market"
    roles: [TourManager]
    code: 201
    input: [market_code, metro_name, country_code, radius_miles, exclusivity_window_days, territory_rank]
    output: Market
    side_effects: ["territory_rank uniqueness enforced (ERR_DUPLICATE_KEY)"]

  - method: GET
    path: "/tours/{tourId}/markets"
    description: "List markets for a tour"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: "Market[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/markets/{marketId}"
    description: "Get a market"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: Market
    side_effects: []

  # --- Venue ---
  - method: POST
    path: "/tours/{tourId}/venues"
    description: "Create a venue under a market"
    roles: [TourManager]
    code: 201
    input: [market_id, venue_name, capacity, base_rent_cents, curfew_local_time, available_dates]
    output: Venue
    side_effects: ["market_id must exist under this tour (ERR_REFERENTIAL_INTEGRITY)"]

  - method: GET
    path: "/tours/{tourId}/venues"
    description: "List venues for a tour; optional market_id filter"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: ["market_id?", "limit?", "offset?"]
    output: "Venue[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/venues/{venueId}"
    description: "Get a venue"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # --- RoutingLeg ---
  - method: POST
    path: "/tours/{tourId}/routing-legs"
    description: "Create a routing leg"
    roles: [TourManager]
    code: 201
    input: [from_market_id, to_market_id, travel_date, drive_miles, leg_index]
    output: RoutingLeg
    side_effects: ["drive_minutes and crew_rest_required computed", "leg_index unique within tour"]

  - method: GET
    path: "/tours/{tourId}/routing-legs"
    description: "List routing legs"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: ["limit?", "offset?"]
    output: "RoutingLeg[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/routing-legs/{legId}"
    description: "Get a routing leg"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: RoutingLeg
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/routing-legs/{legId}/lock"
    description: "Lock a routing leg"
    roles: [TourManager]
    code: 200
    input: []
    output: RoutingLeg
    side_effects: ["status → LOCKED"]

  - method: POST
    path: "/tours/{tourId}/routing-legs/{legId}/complete"
    description: "Complete a routing leg"
    roles: [TourManager]
    code: 200
    input: []
    output: RoutingLeg
    side_effects: ["status → COMPLETED"]

  - method: POST
    path: "/tours/{tourId}/routing-legs/{legId}/cancel"
    description: "Cancel a routing leg"
    roles: [TourManager]
    code: 200
    input: []
    output: RoutingLeg
    side_effects: ["status → CANCELLED"]

  # --- Show ---
  - method: POST
    path: "/tours/{tourId}/shows"
    description: "Create a show (starts in HOLD_REQUESTED)"
    roles: [TourManager]
    code: 201
    input: [market_id, venue_id, show_date, on_sale_at, avg_ticket_price_cents]
    output: Show
    side_effects:
      - "status=HOLD_REQUESTED"
      - "posture computed"
      - "AdvancePacket auto-created with all sections PENDING"

  - method: GET
    path: "/tours/{tourId}/shows"
    description: "List shows"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: ["market_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: "Show[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/shows/{showId}"
    description: "Get a show"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: Show
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/confirm"
    description: "Confirm a held show"
    roles: [TourManager]
    code: 200
    input: [expected_tour_version]
    output: Show
    side_effects:
      - "status → CONFIRMED"
      - "increments Tour.version by 1"
      - "venue.booked_dates += show_date"
      - "radius sweep may open ComplianceHold"
      - "tour.projected_* recomputed"

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/advance"
    description: "Advance a confirmed show"
    roles: [TourManager]
    code: 200
    input: []
    output: Show
    side_effects:
      - "status → ADVANCED"
      - "AdvancePacket.daysheet_issued := true"

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/mark-performed"
    description: "Mark an advanced show performed"
    roles: [TourManager]
    code: 200
    input: []
    output: Show
    side_effects:
      - "status → PERFORMED"
      - "spawn Settlement in DRAFT"

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/cancel"
    description: "Cancel a show"
    roles: [TourManager]
    code: 200
    input: []
    output: Show
    side_effects:
      - "status → CANCELLED"
      - "cascade: holds withdrawn, advance packet reset, venue booked_dates released"

  - method: PATCH
    path: "/tours/{tourId}/shows/{showId}/tickets"
    description: "Box-office ticket sales update"
    roles: [Promoter]
    code: 200
    input: [tickets_sold]
    output: Show
    side_effects: ["projected_show_pnl recomputed if logical clock >= on_sale_at"]

  # --- PromoterHold ---
  - method: POST
    path: "/tours/{tourId}/shows/{showId}/holds"
    description: "Place a hold (promoter)"
    roles: [Promoter]
    code: 201
    input: [promoter_name, guarantee_cents, versus_pct]
    output: PromoterHold
    side_effects: ["status=PENDING", "hold_expires_at = placed_at + HOLD_TTL_HOURS", "counter_count = 0"]

  - method: GET
    path: "/tours/{tourId}/shows/{showId}/holds"
    description: "List holds for a show"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PromoterHold[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/shows/{showId}/holds/{holdId}"
    description: "Get a hold"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: PromoterHold
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/holds/{holdId}/counter"
    description: "Promoter counters a hold"
    roles: [Promoter]
    code: 200
    input: [guarantee_cents, versus_pct, expected_show_version]
    output: PromoterHold
    side_effects:
      - "status → COUNTERED"
      - "counter_count += 1"
      - "hold_expires_at += COUNTER_EXTENSION_HOURS"
      - "increments Show.version by 1"

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/holds/{holdId}/respond-counter"
    description: "Tour manager responds to a counter (accept the countered terms or re-issue original)"
    roles: [TourManager]
    code: 200
    input: [accept_counter]
    output: PromoterHold
    side_effects:
      - "status → PENDING (terms replaced with countered values if accept_counter=true)"

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/holds/{holdId}/accept"
    description: "Promoter accepts the current hold terms"
    roles: [Promoter]
    code: 200
    input: []
    output: PromoterHold
    side_effects:
      - "status → ACCEPTED"
      - "Show HOLD_REQUESTED → HOLD_PLACED if first acceptance"
      - "show.capacity snapshot"

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/holds/{holdId}/reject"
    description: "Promoter rejects"
    roles: [Promoter]
    code: 200
    input: []
    output: PromoterHold
    side_effects: ["status → REJECTED"]

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/holds/{holdId}/withdraw"
    description: "Promoter withdraws a hold"
    roles: [Promoter]
    code: 200
    input: []
    output: PromoterHold
    side_effects:
      - "status → WITHDRAWN"
      - "if was ACCEPTED: Show reverts to HOLD_REQUESTED and venue.booked_dates released"

  # --- AdvancePacket ---
  - method: GET
    path: "/tours/{tourId}/shows/{showId}/advance-packet"
    description: "Get the advance packet for a show"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: AdvancePacket
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/advance-packet/sections/{section}/submit"
    description: "Submit a section (tech_rider | hospitality | immigration)"
    roles: [TourManager]
    code: 200
    input: []
    output: AdvancePacket
    side_effects: ["section → SUBMITTED", "packet_revision += 1"]

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/advance-packet/sections/{section}/approve"
    description: "Approve a section (VenueRep)"
    roles: [VenueRep]
    code: 200
    input: [expected_packet_revision]
    output: AdvancePacket
    side_effects:
      - "section → APPROVED"
      - "packet_revision += 1"
      - "show.posture recomputed"

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/advance-packet/sections/{section}/reject"
    description: "Reject a section (VenueRep)"
    roles: [VenueRep]
    code: 200
    input: []
    output: AdvancePacket
    side_effects: ["section → REJECTED then auto → PENDING", "packet_revision += 1"]

  # --- BudgetLine ---
  - method: POST
    path: "/tours/{tourId}/shows/{showId}/budget-lines"
    description: "Add a budget line"
    roles: [TourManager]
    code: 201
    input: [category, description, estimated_cents, "actual_cents?"]
    output: BudgetLine
    side_effects: ["is_committed set per show.status at creation"]

  - method: GET
    path: "/tours/{tourId}/shows/{showId}/budget-lines"
    description: "List budget lines for a show"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: "BudgetLine[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/shows/{showId}/budget-lines/{lineId}"
    description: "Get a budget line"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: BudgetLine
    side_effects: []

  - method: PATCH
    path: "/tours/{tourId}/shows/{showId}/budget-lines/{lineId}"
    description: "Update estimated_cents or actual_cents"
    roles: [TourManager]
    code: 200
    input: ["estimated_cents?", "actual_cents?"]
    output: BudgetLine
    side_effects: ["recomputes show.projected_cost_cents"]

  # --- MarketingSpend ---
  - method: POST
    path: "/tours/{tourId}/shows/{showId}/marketing-spends"
