            - "PlaylistItem.${it1_id}.version, EmergencyOverride.${ovr_idem_id}.version and RegulatoryNotification.${ntf_idem_id}.version are all unchanged by the four rejected calls"

  # ===========================================================================
  # Table 3 — Calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: waterfall_grants_floors_then_proportional_shares_with_a_one_kbps_sweep
        claim_type: Correct Result
        grounds: "§1.3 multiplex_bitrate_allocation (waterfall_allocation: floors in (priority_rank ASC, created_at ASC) order, remainder pool, share = min(floor(remainder*weight/total_weight), weight), leftover swept 1 kbps at a time to channels under their request, break when none)"
        distinguishing_aspect: "The pinned integer arithmetic is only reproducible with floor() per channel followed by the 1-kbps sweep in rank order: shares 1090/1090/545/272 sum to 2997, leaving 3 kbps that go to ranks 1, 2 and 3 — one each. Rounding half-up, distributing the leftover to the largest weight, or dropping it entirely all produce different allocations."
        test_recipe:
          setup: "MUX-C: total_capacity_kbps 20500, pilot_reserved_kbps 500 -> effective 20000. Four channels, floors 8000/5000/2000/2000 (sum 17000, remainder 3000) and requests 12000/9000/4000/3000 (weights 4000/4000/2000/1000, total 11000), created in rank order 1..4."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - &mux3
              call: "POST /multiplexes"
              payload:
                transmitter_id: "${tx1_id}"
                name: "MUX-C"
                total_capacity_kbps: 20500
                pilot_reserved_kbps: 500
                live_encoder_units_total: 2
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux3_id: "$.data.id", mux3_v1: "$.data.version" }
            - &chA
              call: "POST /channels"
              payload:
                multiplex_id: "${mux3_id}"
                expected_multiplex_version: "${mux3_v1}"
                call_sign: "WAAA-DT"
                channel_number: "30.1"
                service_class: PRIMARY
                resolution_class: HD_1080I
                requested_bitrate_kbps: 12000
                floor_bitrate_kbps: 8000
                priority_rank: 1
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { chA_id: "$.data.id" }
            - &mux3_r2
              call: "GET /multiplexes/${mux3_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux3_v2: "$.data.version" }
            - &chB
              call: "POST /channels"
              payload:
                multiplex_id: "${mux3_id}"
                expected_multiplex_version: "${mux3_v2}"
                call_sign: "WBBB-DT"
                channel_number: "30.2"
                service_class: PRIMARY
                resolution_class: HD_720P
                requested_bitrate_kbps: 9000
                floor_bitrate_kbps: 5000
                priority_rank: 2
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { chB_id: "$.data.id" }
            - &mux3_r3
              call: "GET /multiplexes/${mux3_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux3_v3: "$.data.version" }
            - &chC
              call: "POST /channels"
              payload:
                multiplex_id: "${mux3_id}"
                expected_multiplex_version: "${mux3_v3}"
                call_sign: "WCCC-DT"
                channel_number: "30.3"
                service_class: PRIMARY
                resolution_class: SD_480I
                requested_bitrate_kbps: 4000
                floor_bitrate_kbps: 2000
                priority_rank: 3
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { chC_id: "$.data.id" }
            - &mux3_r4
              call: "GET /multiplexes/${mux3_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux3_v4: "$.data.version" }
          trigger:
            - call: "POST /channels"
              payload:
                multiplex_id: "${mux3_id}"
                expected_multiplex_version: "${mux3_v4}"
                call_sign: "WDDD-DT"
                channel_number: "30.4"
                service_class: PRIMARY
                resolution_class: SD_480I
                requested_bitrate_kbps: 3000
                floor_bitrate_kbps: 2000
                priority_rank: 4
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { chD_id: "$.data.id" }
            - call: "GET /channels"
              payload: { multiplex_id: "${mux3_id}" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "GET /multiplexes/${mux3_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
          assert:
            - "effective_capacity_kbps == 20000 == floor(20500 * 1.00) - 500"
            - "every floor is granted in rank order because the running floor total 17000 <= 20000, so no channel is STARVED"
            - "remainder == 20000 - 17000 == 3000 and total_weight == 11000"
            - "Channel.${chA_id}.allocated_bitrate_kbps == 9091 (8000 + floor(3000*4000/11000) = 1090, plus 1 kbps of sweep)"
            - "Channel.${chB_id}.allocated_bitrate_kbps == 6091 (5000 + 1090 + 1 sweep)"
            - "Channel.${chC_id}.allocated_bitrate_kbps == 2546 (2000 + floor(3000*2000/11000) = 545, plus 1 sweep)"
            - "Channel.${chD_id}.allocated_bitrate_kbps == 2272 (2000 + floor(3000*1000/11000) = 272, no sweep left)"
            - "the sweep is strictly rank-ordered: exactly 3 kbps were distributed and rank 4 received none"
            - "Multiplex.${mux3_id}.assigned_kbps == 20000, available_kbps == 0, starved_channel_count == 0, and 9091 + 6091 + 2546 + 2272 == 20000"
            - "no channel exceeds its request: every allocated_bitrate_kbps <= requested_bitrate_kbps"

      - name: floor_feasibility_is_checked_against_the_active_set_with_exact_equality_legal
        claim_type: Input Set Filtering
        grounds: "§1.4 priority 66 ERR_BITRATE_FLOOR_UNSATISFIABLE ('the sum of floor_bitrate_kbps over the channels that would be ACTIVE must not exceed effective_capacity_kbps; a floor sum exactly equal is feasible'); §1.3 multiplex_bitrate_allocation; §1.4 priority 55 ERR_BITRATE_FLOOR_BELOW_RESOLUTION_MINIMUM"
        distinguishing_aspect: "Feasibility is evaluated over the prospective ACTIVE set at admission time, so a floor sum of exactly 11000 against an effective pool of 11000 is admitted (remainder 0, every channel pinned to its floor) while the very next 2000-kbps floor is refused up front rather than being created STARVED. The resolution minimum is a separate, earlier gate with its own inclusive boundary."
        test_recipe:
          setup: "MUX-D: total 11500, pilot 500 -> effective 11000. Channels are admitted with floors 5000 (HD_720P), 4000 (SD_480I) and 2000 (SD_480I), each with requested == floor so the remainder pool is 0."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - &mux4
              call: "POST /multiplexes"
              payload:
                transmitter_id: "${tx1_id}"
                name: "MUX-D"
                total_capacity_kbps: 11500
                pilot_reserved_kbps: 500
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux4_id: "$.data.id", mux4_v1: "$.data.version" }
            - call: "POST /channels"
              payload:
                multiplex_id: "${mux4_id}"
                expected_multiplex_version: "${mux4_v1}"
                call_sign: "WPPP-DT"
                channel_number: "40.1"
                service_class: PRIMARY
                resolution_class: HD_720P
                requested_bitrate_kbps: 5000
                floor_bitrate_kbps: 5000
                priority_rank: 1
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { chP_id: "$.data.id" }
            - call: "GET /multiplexes/${mux4_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux4_v2: "$.data.version" }
            - call: "POST /channels"
              payload:
                multiplex_id: "${mux4_id}"
                expected_multiplex_version: "${mux4_v2}"
                call_sign: "WQQQ-DT"
                channel_number: "40.2"
                service_class: PRIMARY
                resolution_class: SD_480I
                requested_bitrate_kbps: 4000
                floor_bitrate_kbps: 4000
                priority_rank: 2
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { chQ_id: "$.data.id" }
            - call: "GET /multiplexes/${mux4_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux4_v3: "$.data.version" }
          trigger:
            - call: "POST /channels"
              payload:
                multiplex_id: "${mux4_id}"
                expected_multiplex_version: "${mux4_v3}"
                call_sign: "WSSS-DT"
                channel_number: "40.3"
                service_class: PRIMARY
                resolution_class: SD_480I
                requested_bitrate_kbps: 2000
                floor_bitrate_kbps: 2000
                priority_rank: 3
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { chS_id: "$.data.id" }
            - call: "GET /multiplexes/${mux4_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { mux4_v4: "$.data.version" }
            - call: "POST /channels"
              payload:
                multiplex_id: "${mux4_id}"
                expected_multiplex_version: "${mux4_v4}"
                call_sign: "WTTT-DT"
                channel_number: "40.4"
                service_class: PRIMARY
                resolution_class: SD_480I
                requested_bitrate_kbps: 2000
                floor_bitrate_kbps: 2000
                priority_rank: 4
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_unsat: "$.data.error_id" }
            - call: "POST /channels"
              payload:
                multiplex_id: "${mux4_id}"
                expected_multiplex_version: "${mux4_v4}"
                call_sign: "WUUU-DT"
                channel_number: "40.5"
                service_class: SUBCHANNEL
                resolution_class: SD_480I
                requested_bitrate_kbps: 3000
                floor_bitrate_kbps: 1999
                priority_rank: 5
                parent_channel_id: "${chP_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_below_min: "$.data.error_id" }
          assert:
            - "the third channel is admitted at a floor sum of exactly 11000 == effective_capacity_kbps: Channel.${chS_id}.allocation_state == ACTIVE with allocated_bitrate_kbps == 2000"
            - "with requested == floor for all three, total_weight == 0 and remainder == 0, so allocations are exactly the floors: 5000 / 4000 / 2000"
            - "Multiplex.${mux4_id}.assigned_kbps == 11000, available_kbps == 0, starved_channel_count == 0"
            - "${e_unsat} == ERR_BITRATE_FLOOR_UNSATISFIABLE with status 422 — the prospective ACTIVE floor sum 13000 exceeds 11000, so the channel is refused at admission and NOT created in a STARVED state"
            - "${e_below_min} == ERR_BITRATE_FLOOR_BELOW_RESOLUTION_MINIMUM with status 422 — 1999 is one kbps below the SD_480I minimum 2000, and this earlier rule fires even though the floor sum would also be unsatisfiable"
            - "GET /channels?multiplex_id=${mux4_id} returns total_count 3 — neither rejected request left a row behind"
            - "Multiplex.${mux4_id}.version is unchanged by the two rejected admissions"

      - name: full_pool_and_derated_pool_variants_diverge_and_recovery_is_exact
        claim_type: Variant Divergence
        grounds: "§1.3 multiplex_bitrate_allocation variants FULL_POOL (derate 1.00) and DERATED_POOL (derate < 1.00 shrinks effective_capacity_kbps before floors are granted, so the tail of the priority order starves even though no channel changed its own request); input_set 'STARVED channels re-enter the waterfall on every run so that recovery is possible'"
        distinguishing_aspect: "The same four stored channel rows produce two completely different allocations: FULL_POOL 9091/6091/2546/2272 and DERATED_POOL 8938/5937/0/0 at 75 %, where the remainder is redistributed over the GRANTED channels only (total_weight 8000, not 11000). Restoring FULL_POWER must reproduce the original numbers exactly — a lossy implementation that keeps the derated split, or that leaves the starved channels out of the next run, fails."
        test_recipe:
          setup: "The MUX-C graph from the waterfall instance: effective 20000, four channels with floors 8000/5000/2000/2000 and requests 12000/9000/4000/3000."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - *mux3
            - *chA
            - *mux3_r2
            - *chB
            - *mux3_r3
            - *chC
            - *mux3_r4
            - call: "POST /channels"
              payload:
                multiplex_id: "${mux3_id}"
                expected_multiplex_version: "${mux3_v4}"
                call_sign: "WDDD-DT"
                channel_number: "30.4"
                service_class: PRIMARY
                resolution_class: SD_480I
                requested_bitrate_kbps: 3000
                floor_bitrate_kbps: 2000
                priority_rank: 4
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { chD_id: "$.data.id" }
          trigger:
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: REDUCED_POWER, power_pct: 60, reason: "utility brownout" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "GET /channels"
              payload: { multiplex_id: "${mux3_id}" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "GET /multiplexes/${mux3_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: FULL_POWER }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "GET /channels"
              payload: { multiplex_id: "${mux3_id}", posture: NORMAL }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
          assert:
            - "DERATED_POOL: effective_capacity_kbps == 14875 == floor(20500 * 0.75) - 500"
            - "DERATED_POOL: floors are granted to ranks 1 and 2 only (8000 + 5000 = 13000 <= 14875) while rank 3 would need 15000 > 14875, so ranks 3 AND 4 are STARVED with allocated_bitrate_kbps 0"
            - "DERATED_POOL: remainder == 1875 and total_weight == 8000 (granted channels only), so share == floor(1875*4000/8000) == 937 each and the single leftover kbps sweeps to rank 1"
            - "DERATED_POOL: allocations are 8938 / 5937 / 0 / 0, assigned_kbps == 14875, available_kbps == 0, starved_channel_count == 2"
            - "DERATED_POOL: all four channels have posture == SUSPENDED for the starved pair and DEGRADED for the granted pair (channel_posture clause 1 then clause 4)"
            - "FULL_POOL after restore: effective_capacity_kbps == 20000 and allocations return exactly to 9091 / 6091 / 2546 / 2272 with starved_channel_count == 0"
            - "the posture-filtered listing after restore returns total_count 4 — every channel is NORMAL again and the STARVED rows re-entered the waterfall"
            - "no channel row's requested_bitrate_kbps, floor_bitrate_kbps or priority_rank changed at any point: the divergence comes entirely from the derate variant"

      - name: channel_posture_ladder_resolves_five_clauses_in_pinned_order
        claim_type: Correct Result
        grounds: "§1.3 channel_posture (clause 1 SUSPENDED if allocation STARVED or transmitter OFF_AIR; 2 EMERGENCY if an active override; 3 DEGRADED_CRITICAL if any open CRITICAL fault; 4 DEGRADED if major_count >= 2 or transmitter REDUCED_POWER; 5 NORMAL) with MAJOR_FAULT_DEGRADE_THRESHOLD 2 and open faults = states {DETECTED, ACKNOWLEDGED, ESCALATED}"
        distinguishing_aspect: "The five clauses are tested in order and each new condition must OUTRANK the previous one on the same channel: one MAJOR fault leaves NORMAL, the second MAJOR gives DEGRADED, a CRITICAL gives DEGRADED_CRITICAL, an ACTIVE override gives EMERGENCY, and an OFF_AIR transmitter gives SUSPENDED. Implementations that pick the 'worst' by fault severity alone, or that count MITIGATED faults, produce a different ladder."
        test_recipe:
          setup: "Base graph through ch2. Faults are raised on ch1 one at a time, then an override is activated, then the transmitter is taken OFF_AIR."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *op_mco
            - *op_pd
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
          trigger:
            - call: "POST /technical-faults"
              payload: { fault_code: AUDIO_LOSS, severity: MINOR, detected_utc: "2026-08-01T09:00:00Z", channel_id: "${ch1_id}" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { flt_m1_id: "$.data.id" }
            - call: "POST /technical-faults"
              payload: { fault_code: BLACK_FRAME, severity: MINOR, detected_utc: "2026-08-01T09:00:00Z", channel_id: "${ch1_id}" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
