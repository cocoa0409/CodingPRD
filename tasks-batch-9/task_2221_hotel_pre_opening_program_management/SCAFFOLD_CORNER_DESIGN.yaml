              as: SystemsIntegrator
              as_user_id: "si-runner-1"
              captures: { run_late_clock: "$.data.id" }
            - call: "POST /pre-opening/system-implementations/${sys_pos}/test-runs"
              payload: { executed_at: "2026-09-01T09:00:00Z", cases_total: 40, cases_passed: 30, blocker_count: 0 }
              as: SystemsIntegrator
              as_user_id: "si-runner-2"
              captures: { run_early_clock: "$.data.id" }
          trigger:
