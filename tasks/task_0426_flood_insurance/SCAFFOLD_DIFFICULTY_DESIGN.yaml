            - "ProofOfLoss.${pl_id}.days_after_loss == 61"
            - "response.data.error_id == ERR_PROOF_OF_LOSS_LATE"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cancel_premium_conservation_earned_plus_refund
        grounds:
          - calculations.premium_proration
          - state_machines.Policy.ACTIVE_to_CANCELLED
          - entities.Policy.fields.earned_premium
        distinguishing_aspect: >
          Conserved quantity = premium dollars. On ACTIVE->CANCELLED the invariant
          earned_premium + refund_to_holder == quoted_premium holds exactly: legacy AE policy
          quoted 2000, effective 2026-03-31, cancelled 2026-09-30 (183/365 elapsed) -> earned 1003,
          refund 997, premium_credit_balance stays 0.
        test_recipe:
          setup:
            - "An ACTIVE legacy AE policy quoted 2000 effective 2026-03-31; clock advanced to 2026-09-30."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Jetty", county_code: "C017", participating: true, crs_class: 10 }
              as: FemaAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties"
              payload: { community_id: "${comm_id}", owner_id: "holder-19", address: "19 Jetty Rd", flood_zone: "AE", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 8.0 }
              as: Underwriter
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/policies"
              payload: { rating_method: "LEGACY_SUBSIDIZED", building_coverage: 250000, contents_coverage: 100000 }
              as: Underwriter
              captures: { pol_id: $.data.id, prem: $.data.quoted_premium }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-31T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
              captures: { pv: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: FemaAdmin
          trigger:
            - call: "POST /policies/${pol_id}/cancel"
              payload: { expected_policy_version: "${pv}" }
              as: Underwriter
              captures: { earned: $.data.earned_premium }
          assert:
            - "Policy.${pol_id}.quoted_premium == 2000"
            - "Policy.${pol_id}.earned_premium == 1003"
            - "Policy.${pol_id}.premium_credit_balance == 0"

      - name: review_bounce_claims_paid_ledger_conservation
        grounds:
          - state_machines.ProofOfLoss.PENDING_to_REJECTED
          - state_machines.Claim.UNDER_REVIEW_to_SUBMITTED
          - entities.Policy.fields.total_claims_paid
        distinguishing_aspect: >
          Conserved quantity = the claims-paid ledger (distinct from premium dollars). The forward
          action (open-review) paired with its compensating action (proof-of-loss reject -> claim
          bounce to SUBMITTED) leaves Policy.total_claims_paid unchanged at 0 with no settlement
          drift; the loop neither pays nor partially pays.
        test_recipe:
          setup:
            - "A claim UNDER_REVIEW on an ACTIVE lender policy (total_claims_paid 0) with a PENDING proof-of-loss."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Groyne", county_code: "C018", participating: true, crs_class: 10 }
              as: FemaAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: FemaAdmin
            - call: "POST /properties"
              payload: { community_id: "${comm_id}", owner_id: "holder-20", address: "20 Groyne Rd", flood_zone: "X", occupancy: "PRIMARY_RESIDENCE", base_flood_elevation_ft: 10.0 }
              as: PolicyHolder
              as_user_id: "holder-20"
              captures: { prop_id: $.data.id }
            - call: "POST /elevation-certificates"
              payload: { property_id: "${prop_id}", surveyor_license: "SURV-20", lowest_floor_elevation_ft: 11.0 }
              as: PolicyHolder
              as_user_id: "holder-20"
            - call: "POST /properties/${prop_id}/policies"
              payload: { rating_method: "RISK_RATING_2_0", building_coverage: 100000, contents_coverage: 40000, is_lender_required: true }
              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /policies/${pol_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", claimant_id: "holder-20", date_of_loss: "2026-04-10T00:00:00Z", building_loss: 5000 }
              as: PolicyHolder
              as_user_id: "holder-20"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/open-review"
              payload: {}
              as: Adjuster
            - call: "POST /proofs-of-loss"
              payload: { claim_id: "${claim_id}", documented_building_loss: 5000 }
              as: PolicyHolder
              as_user_id: "holder-20"
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /proofs-of-loss/${pl_id}/reject"
              payload: {}
              as: Adjuster
          assert:
            - "Claim.${claim_id}.status == SUBMITTED"
            - "Claim.${claim_id}.settlement_total == 0"
            - "Policy.${pol_id}.total_claims_paid == 0"
