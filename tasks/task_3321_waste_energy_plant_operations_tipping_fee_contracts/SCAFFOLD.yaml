scenario: |
  Waste-to-Energy Plant Operations & Tipping Fee Contracts (Covanta): waste supply
  agreements with municipalities guaranteeing tonnage delivery and tipping fees with
  put-or-pay provisions, plant throughput management balancing waste heating value
  variability against boiler capacity and steam output, energy sales through power
  purchase agreements or merchant market with capacity payments, metals recovery from
  ash with commodity price exposure and processing arrangements, ash residue disposal
  in permitted landfills with testing requirements, emissions control system operation
  with continuous monitoring and permit limits, scheduled outages for boiler
  maintenance with waste diversion plans during downtime, host community agreements
  including payments and local waste priority

domain_name: waste-energy-plant-operations
api_prefix: /wte

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Municipality
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered municipal legal name" }
      - { name: population_served, type: integer, source: input, description: "Population covered by the collection system" }
      - { name: is_host_community, type: boolean, source: input, default: false, description: "True when this municipality is the plant host community; supplies the HostCommunityAgreement and receives delivery priority" }
      - { name: priority_group, type: enum, source: input, default: STANDARD, description: "Delivery priority group", constraints: "HOST | STANDARD; host community priority requires is_host_community = true" }

  - name: HostCommunityAgreement
    parent: null
    common_fields: true
    fields:
      - { name: municipality_id, type: string, source: input, description: "FK -> Municipality.id; must reference a Municipality with is_host_community = true" }
      - { name: annual_payment_cents, type: integer, source: input, description: "Fixed annual host community payment" }
      - { name: payment_due_month, type: integer, source: input, description: "Calendar month (1-12) on which the annual payment falls due" }
      - { name: local_waste_priority_enabled, type: boolean, source: input, default: true, description: "When true, deliveries by this municipality pre-empt STANDARD-priority allocations at the tip floor" }
      - { name: effective_start, type: datetime, source: input, description: "Agreement effective start (ISO8601 UTC)" }
      - { name: effective_end, type: datetime, source: input, description: "Agreement effective end (ISO8601 UTC), exclusive" }

  - name: WasteSupplyAgreement
    parent: null
    common_fields: true
    fields:
      - { name: municipality_id, type: string, source: input, description: "FK -> Municipality.id; counterparty of the supply agreement" }
      - { name: term_start, type: datetime, source: input, description: "Agreement term start (ISO8601 UTC)" }
      - { name: term_end, type: datetime, source: input, description: "Agreement term end (ISO8601 UTC), exclusive; must be after term_start" }
      - { name: guaranteed_annual_tonnage, type: number, source: input, description: "Annual guaranteed tonnage (tonnes) the municipality must deliver or pay for under put-or-pay" }
      - { name: tipping_fee_per_tonne_cents, type: integer, source: input, description: "Tipping fee charged per accepted tonne" }
      - { name: put_or_pay_settlement_cadence, type: enum, source: input, default: ANNUAL, description: "Put-or-pay settlement frequency", constraints: "ANNUAL | MONTHLY" }
      - { name: state, type: enum, source: system, default: DRAFT, description: "Agreement lifecycle state", constraints: "DRAFT | ACTIVE | EXPIRED | TERMINATED" }
      - { name: amendment_of_agreement_id, type: string, source: input, default: null, description: "FK -> WasteSupplyAgreement.id; self-referential — set on an amending agreement that supersedes the base agreement" }
      - { name: cumulative_delivered_tonnes, type: number, source: computed, default: 0, description: "Sum of tonnes on ACCEPTED WasteDelivery rows for this agreement since term_start; recomputed on every delivery state change" }

  - name: WasteDelivery
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> WasteSupplyAgreement.id; agreement this delivery is counted against" }
      - { name: manifest_ref, type: string, source: input, description: "Unique waste manifest reference supplied by the hauler" }
      - { name: tonnes, type: number, source: input, description: "Weighed tonnes delivered; must be > 0" }
      - { name: heating_value_mj_per_kg, type: number, source: input, description: "Sampled higher heating value of this load in MJ/kg; must be > 0" }
      - { name: delivered_at, type: datetime, source: input, description: "Weighbridge timestamp (ISO8601 UTC); delivery is scheduled against the UTC calendar day of this timestamp" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Delivery lifecycle state", constraints: "SCHEDULED | RECEIVED | REJECTED | DIVERTED | ACCEPTED" }
      - { name: tipping_fee_cents, type: integer, source: computed, description: "Fee for this load, set at ACCEPT transition via compute_tipping_fee (acceptance variant); null until ACCEPTED" }
      - { name: projected_fee_cents, type: integer, source: computed, description: "Advisory projection of the fee for a SCHEDULED delivery at the agreement's current rate (projection variant of compute_tipping_fee); surfaced on GET, never persisted as tipping_fee_cents" }
      - { name: diversion_outage_id, type: string, source: system, default: null, description: "FK -> OutageWindow.id; set when the delivery is diverted under an outage diversion plan, else null" }

  - name: Boiler
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Boiler designation (e.g. Boiler-1)" }
      - { name: max_thermal_capacity_mw, type: number, source: input, description: "Maximum thermal input capacity in MW; must be > 0" }
      - { name: max_steam_tph, type: number, source: input, description: "Maximum steam output in tonnes per hour; must be > 0" }
      - { name: status, type: enum, source: system, default: ONLINE, description: "Boiler operational status", constraints: "ONLINE | OUTAGE | DERATED | OFFLINE" }
      - { name: derated_capacity_mw, type: number, source: system, default: null, description: "Current effective capacity while DERATED; null unless status == DERATED" }

  - name: OutageWindow
    parent: null
    common_fields: true
    fields:
      - { name: boiler_id, type: string, source: input, description: "FK -> Boiler.id; boiler taken out of service" }
      - { name: starts_at, type: datetime, source: input, description: "Outage start (ISO8601 UTC), inclusive" }
      - { name: ends_at, type: datetime, source: input, description: "Outage end (ISO8601 UTC), exclusive; must be after starts_at" }
      - { name: reason, type: string, source: input, description: "Maintenance reason" }
      - { name: kind, type: enum, source: input, description: "Outage classification", constraints: "PLANNED | EMERGENCY" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Outage lifecycle", constraints: "SCHEDULED | ACTIVE | COMPLETED | CANCELLED" }

  - name: DiversionPlan
    parent: null
    common_fields: true
    fields:
      - { name: outage_id, type: string, source: input, description: "FK -> OutageWindow.id; outage this diversion plan covers" }
      - { name: approved, type: boolean, source: system, default: false, description: "Set true by POST /wte/diversion-plans/{id}/approve; an outage cannot start without an approved plan" }
      - { name: max_diversion_tpd, type: number, source: input, description: "Maximum tonnes per day the plan is allowed to divert; must be > 0" }
      - { name: planned_diverted_tonnes, type: number, source: computed, default: 0, description: "Sum of tonnes across DiversionLeg rows on this plan; recomputed on every leg mutation" }

  - name: DiversionLeg
    parent: null
    common_fields: true
    fields:
      - { name: diversion_plan_id, type: string, source: input, description: "FK -> DiversionPlan.id; plan this leg belongs to" }
      - { name: receiving_facility_name, type: string, source: input, description: "Named external facility receiving diverted waste" }
      - { name: planned_tonnes, type: number, source: input, description: "Planned diverted tonnes on this leg; must be > 0" }
      - { name: executed, type: boolean, source: system, default: false, description: "Set true when deliveries are actually diverted onto this leg" }

  - name: DailyThroughputReport
    parent: null
    common_fields: true
    fields:
      - { name: report_date, type: string, source: input, description: "UTC calendar day (YYYY-MM-DD) this report covers; unique across reports" }
      - { name: waste_processed_tonnes, type: number, source: input, description: "Total tonnes combusted that day" }
      - { name: avg_heating_value_mj_per_kg, type: number, source: input, description: "Weighted average heating value of combusted waste that day; must be > 0" }
      - { name: operating_hours, type: number, source: input, description: "Plant operating hours that day; 0 < hours <= 24" }
      - { name: thermal_input_mw, type: number, source: computed, description: "Computed thermal input: waste_processed_tonnes * avg_heating_value_mj_per_kg * 1000 / 3600 / operating_hours" }
      - { name: steam_output_tph, type: number, source: computed, description: "Computed steam output via compute_steam_output" }
      - { name: ash_generated_tonnes, type: number, source: computed, description: "Computed ash generation via compute_ash_generation (25% of processed tonnes)" }
      - { name: capacity_check, type: enum, source: computed, description: "OK when thermal_input_mw <= sum of effective capacities of boilers in ONLINE or DERATED status; else EXCEEDS", constraints: "OK | EXCEEDS" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Report lifecycle", constraints: "DRAFT | FINALIZED" }

  - name: PowerPurchaseAgreement
    parent: null
    common_fields: true
    fields:
      - { name: counterparty_name, type: string, source: input, description: "Offtaker name" }
      - { name: kind, type: enum, source: input, description: "Contract kind", constraints: "PPA | MERCHANT" }
      - { name: energy_rate_cents_per_mwh, type: integer, source: input, description: "Energy rate in cents per MWh" }
      - { name: capacity_payment_cents_per_mw_month, type: integer, source: input, description: "Capacity payment in cents per MW-month; PPA only, must be 0 for MERCHANT" }
      - { name: contracted_mw, type: number, source: input, description: "Contracted capacity in MW; must be > 0" }
      - { name: term_start, type: datetime, source: input, description: "Term start (ISO8601 UTC)" }
      - { name: term_end, type: datetime, source: input, description: "Term end (ISO8601 UTC), exclusive" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "PPA lifecycle", constraints: "DRAFT | ACTIVE | EXPIRED | TERMINATED" }

  - name: EnergyDelivery
    parent: null
    common_fields: true
    fields:
      - { name: ppa_id, type: string, source: input, description: "FK -> PowerPurchaseAgreement.id; agreement this delivery is billed under" }
      - { name: period_start, type: datetime, source: input, description: "Billing period start (ISO8601 UTC)" }
      - { name: period_end, type: datetime, source: input, description: "Billing period end (ISO8601 UTC), exclusive" }
      - { name: delivered_mwh, type: number, source: input, description: "Metered energy delivered in MWh; must be > 0" }
      - { name: merchant_price_cents_per_mwh, type: integer, source: input, default: null, description: "Actual merchant market price in cents/MWh; required when the PPA kind is MERCHANT" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Billing amount via compute_energy_billing; PPA variant uses contracted rate, MERCHANT variant uses merchant price" }
      - { name: capacity_payment_cents, type: integer, source: computed, description: "Prorated capacity payment via compute_capacity_payment; 0 for MERCHANT" }

  - name: MetalsRecoveryContract
    parent: null
    common_fields: true
    fields:
      - { name: processor_name, type: string, source: input, description: "Metals processor name" }
      - { name: ferrous_recovery_pct, type: number, source: input, description: "Contractual ferrous recovery fraction of ash (0 < x <= 0.15)" }
      - { name: nonferrous_recovery_pct, type: number, source: input, description: "Contractual non-ferrous recovery fraction of ash (0 < x <= 0.05)" }
      - { name: processing_fee_cents_per_tonne, type: integer, source: input, description: "Processing fee per tonne of ash processed" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Contract lifecycle", constraints: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: MetalsRecoveryBatch
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> MetalsRecoveryContract.id; contract governing this batch" }
      - { name: ash_input_tonnes, type: number, source: input, description: "Ash tonnes processed in this batch; must be > 0" }
      - { name: ferrous_price_cents_per_tonne, type: integer, source: input, description: "Commodity price snapshot for ferrous metal (cents/tonne)" }
      - { name: nonferrous_price_cents_per_tonne, type: integer, source: input, description: "Commodity price snapshot for non-ferrous metal (cents/tonne)" }
      - { name: ferrous_tonnes, type: number, source: computed, description: "Recovered ferrous tonnes = ash_input_tonnes * ferrous_recovery_pct" }
      - { name: nonferrous_tonnes, type: number, source: computed, description: "Recovered non-ferrous tonnes = ash_input_tonnes * nonferrous_recovery_pct" }
      - { name: gross_revenue_cents, type: integer, source: computed, description: "ferrous_tonnes * ferrous_price + nonferrous_tonnes * nonferrous_price" }
      - { name: processing_fee_cents, type: integer, source: computed, description: "ash_input_tonnes * processing_fee_cents_per_tonne" }
      - { name: net_settlement_cents, type: integer, source: computed, description: "gross_revenue_cents - processing_fee_cents" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "Batch lifecycle", constraints: "RECORDED | SETTLED | DISPUTED" }

  - name: Landfill
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Landfill name" }
      - { name: permit_number, type: string, source: input, description: "Disposal permit number" }
      - { name: remaining_capacity_tonnes, type: number, source: input, description: "Remaining permitted ash capacity in tonnes; must be >= 0" }
      - { name: daily_receipt_limit_tonnes, type: number, source: input, description: "Maximum ash tonnes receivable per UTC calendar day; must be > 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Landfill status", constraints: "ACTIVE | CLOSED" }

  - name: AshShipment
    parent: null
    common_fields: true
    fields:
      - { name: landfill_id, type: string, source: input, description: "FK -> Landfill.id; receiving landfill" }
      - { name: tonnes, type: number, source: input, description: "Ash tonnes shipped; must be > 0" }
      - { name: shipped_on, type: string, source: input, description: "UTC calendar day (YYYY-MM-DD) the shipment arrives at the landfill; used for daily receipt cap accounting" }
      - { name: disposal_fee_cents_per_tonne, type: integer, source: input, description: "Disposal fee rate applied to this shipment" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "Shipment lifecycle", constraints: "PLANNED | TEST_PENDING | DISPOSED | REJECTED" }

  - name: AshTest
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> AshShipment.id; shipment under test" }
      - { name: parameter, type: string, source: input, description: "Analyte name (e.g. lead, cadmium, TCLP-lead)" }
      - { name: measured_value, type: number, source: input, description: "Measured concentration" }
      - { name: limit_value, type: number, source: input, description: "Regulatory limit for the parameter" }
      - { name: passed, type: boolean, source: computed, description: "measured_value <= limit_value" }
      - { name: recorded_at, type: datetime, source: system, description: "Timestamp the test was recorded (server logical clock)" }

  - name: EmissionsPermit
    parent: null
    common_fields: true
    fields:
      - { name: pollutant, type: string, source: input, description: "Pollutant code (e.g. NOx, SO2, CO, Hg); unique among ACTIVE permits" }
      - { name: hourly_limit, type: number, source: input, description: "Rolling one-hour average permit limit" }
      - { name: daily_limit, type: number, source: input, description: "Rolling 24-hour average permit limit" }
      - { name: rolling_avg_window_hours, type: integer, source: input, default: 24, description: "Window in hours used for the daily rolling average" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Permit status", constraints: "ACTIVE | SUSPENDED | EXPIRED" }

  - name: EmissionsReading
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> EmissionsPermit.id; permit this reading is evaluated against" }
      - { name: value, type: number, source: input, description: "Measured pollutant value; must be > 0" }
      - { name: measured_at, type: datetime, source: input, description: "Measurement timestamp (ISO8601 UTC)" }
      - { name: exceedance, type: boolean, source: computed, description: "True when value exceeds the applicable limit via compute_emissions_average comparison" }

state_machines:
  - entity: WasteSupplyAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /wte/waste-supply-agreements/{id}/activate"
        actor: ContractsManager
        preconditions:
          - "agreement.state == DRAFT"
          - "term_end > logical clock now"
          - "guaranteed_annual_tonnage > 0"
        side_effects:
          - "increments WasteSupplyAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /wte/waste-supply-agreements/{id}/terminate"
        actor: ContractsManager
        preconditions:
          - "agreement.state == ACTIVE"
        side_effects:
          - "all WasteDelivery rows with agreement_id == agreement.id and status == SCHEDULED transition to DIVERTED with diversion_outage_id = null (depth 2: those deliveries are excluded from cumulative_delivered_tonnes and from put-or-pay base)"
          - "recompute agreement.cumulative_delivered_tonnes (excludes the just-diverted rows)"
          - "increments WasteSupplyAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock passes agreement.term_end"
        actor: system
        preconditions:
          - "agreement.state == ACTIVE and now >= term_end"
        side_effects:
          - "agreement.state := EXPIRED"
          - "increments WasteSupplyAgreement.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /wte/waste-supply-agreements (amendment: amendment_of_agreement_id set)"
        actor: ContractsManager
        preconditions:
          - "base agreement (amendment_of_agreement_id) state == ACTIVE"
          - "amendment starts ACTIVE immediately (created ACTIVE when amendment_of_agreement_id is set)"
        side_effects:
          - "base agreement.guaranteed_annual_tonnage := amendment.guaranteed_annual_tonnage and base.tipping_fee_per_tonne_cents := amendment.tipping_fee_per_tonne_cents"
          - "increments base WasteSupplyAgreement.version by 1"
        note: "Amendment is a separate ACTIVE agreement row created via POST /wte/waste-supply-agreements with amendment_of_agreement_id set; it supersedes the base's commercial terms. The base remains ACTIVE and continues to accumulate deliveries."

  - entity: WasteDelivery
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, REJECTED, DIVERTED]
    transitions:
      - from: SCHEDULED
        to: RECEIVED
        trigger: "POST /wte/waste-deliveries/{id}/receive"
        actor: PlantOperator
        preconditions:
          - "delivery.status == SCHEDULED"
          - "agreement.state == ACTIVE"
          - "the delivery's UTC calendar day (date of delivered_at) has remaining allocation per compute_tip_floor_allocation: total tonnes of same-day deliveries in status SCHEDULED or RECEIVED, plus this delivery's tonnes, <= DAILY_CAPACITY_TONNES (1000), unless the delivery's municipality is the host community with an in-window HostCommunityAgreement whose local_waste_priority_enabled == true (priority override skips the cap check)"
        side_effects:
          - "increments WasteDelivery.version by 1"
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /wte/waste-deliveries/{id}/accept"
        actor: PlantOperator
        preconditions:
          - "delivery.status == RECEIVED"
          - "agreement.state == ACTIVE"
          - "at least one Boiler has status == ONLINE or DERATED"
        side_effects:
          - "delivery.tipping_fee_cents := compute_tipping_fee(delivery, agreement) — acceptance variant uses current agreement.tipping_fee_per_tonne_cents"
          - "agreement.cumulative_delivered_tonnes += delivery.tonnes (depth 2: put-or-pay base grows; depth 3: next compute_put_or_pay_settlement for this agreement reflects the new base)"
          - "increments WasteDelivery.version by 1 and WasteSupplyAgreement.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /wte/waste-deliveries/{id}/reject"
        actor: PlantOperator
        preconditions:
          - "delivery.status == RECEIVED"
          - "reject_reason present in request body"
        side_effects:
          - "increments WasteDelivery.version by 1"
      - from: SCHEDULED
        to: DIVERTED
        trigger: "POST /wte/waste-deliveries/{id}/divert"
        actor: PlantOperator
        preconditions:
          - "delivery.status == SCHEDULED"
          - "body.outage_id references an OutageWindow with status == ACTIVE"
          - "that outage has an approved DiversionPlan (DiversionPlan.outage_id == outage.id and approved == true)"
          - "total tonnes of deliveries with diversion_outage_id == outage.id and status == DIVERTED, plus this delivery's tonnes, <= plan.max_diversion_tpd * outage length in whole days (exclusive-end interval length, ceil((ends_at - starts_at)/86400))"
        side_effects:
          - "delivery.diversion_outage_id := outage.id"
          - "the DiversionLeg on the approved plan with the largest remaining planned_tonnes (eligibility: executed == false; ranking: planned_tonnes DESC; tie-break: created_at ASC; empty pool: no leg update) has executed := true (depth 2)"
          - "plan.planned_diverted_tonnes unchanged (planned quantity), but leg execution flags advance plan execution state (depth 3: when every leg executed, plan is fully executed)"
          - "increments WasteDelivery.version by 1"

  - entity: PowerPurchaseAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /wte/power-purchase-agreements/{id}/activate"
        actor: EnergyTrader
        preconditions:
          - "ppa.status == DRAFT"
          - "term_end > logical clock now"
          - "if kind == PPA: capacity_payment_cents_per_mw_month > 0; if kind == MERCHANT: capacity_payment_cents_per_mw_month == 0"
        side_effects:
          - "increments PowerPurchaseAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /wte/power-purchase-agreements/{id}/terminate"
        actor: EnergyTrader
        preconditions:
          - "ppa.status == ACTIVE"
        side_effects:
          - "increments PowerPurchaseAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: logical clock passes ppa.term_end"
        actor: system
        preconditions:
          - "ppa.status == ACTIVE and now >= term_end"
        side_effects:
          - "ppa.status := EXPIRED"
          - "increments PowerPurchaseAgreement.version by 1"

  - entity: OutageWindow
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /wte/outage-windows/{id}/start"
        actor: PlantOperator
        preconditions:
          - "outage.status == SCHEDULED"
          - "an approved DiversionPlan exists for this outage (DiversionPlan.outage_id == outage.id and approved == true)"
          - "no other OutageWindow with status == ACTIVE for the same boiler"
        side_effects:
          - "boiler.status := OUTAGE (depth 2: boiler drops out of effective capacity used by DailyThroughputReport.capacity_check; depth 3: the next report's capacity_check is computed against the reduced capacity)"
          - "increments OutageWindow.version by 1 and Boiler.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /wte/outage-windows/{id}/complete"
        actor: PlantOperator
        preconditions:
          - "outage.status == ACTIVE"
        side_effects:
          - "boiler.status := ONLINE, boiler.derated_capacity_mw := null"
          - "increments OutageWindow.version by 1 and Boiler.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /wte/outage-windows/{id}/cancel"
        actor: PlantOperator
        preconditions:
          - "outage.status == SCHEDULED"
        side_effects:
          - "increments OutageWindow.version by 1"

  - entity: Boiler
    initial_state: ONLINE
    terminal_states: [OFFLINE]
    transitions:
      - from: ONLINE
        to: DERATED
        trigger: "POST /wte/boilers/{id}/derate"
        actor: PlantOperator
        preconditions:
          - "boiler.status == ONLINE"
          - "0 < body.derated_capacity_mw < boiler.max_thermal_capacity_mw"
        side_effects:
          - "boiler.derated_capacity_mw := body.derated_capacity_mw"
          - "increments Boiler.version by 1"
      - from: DERATED
        to: ONLINE
        trigger: "POST /wte/boilers/{id}/restore"
        actor: PlantOperator
        preconditions:
          - "boiler.status == DERATED"
        side_effects:
          - "boiler.derated_capacity_mw := null"
          - "increments Boiler.version by 1"
      - from: ONLINE
        to: OFFLINE
        trigger: "POST /wte/boilers/{id}/decommission"
        actor: PlantOperator
        preconditions:
          - "boiler.status == ONLINE"
          - "no OutageWindow with boiler_id == boiler.id in status SCHEDULED or ACTIVE"
        side_effects:
          - "increments Boiler.version by 1"

  - entity: DailyThroughputReport
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /wte/daily-throughput-reports/{id}/finalize"
        actor: PlantOperator
        preconditions:
          - "report.status == DRAFT"
          - "report.capacity_check == OK"
        side_effects:
          - "increments DailyThroughputReport.version by 1"

  - entity: MetalsRecoveryBatch
    initial_state: RECORDED
    terminal_states: [SETTLED]
    transitions:
      - from: RECORDED
        to: SETTLED
        trigger: "POST /wte/metals-recovery-batches/{id}/settle"
        actor: ContractsManager
        preconditions:
          - "batch.status == RECORDED"
          - "contract.status == ACTIVE"
        side_effects:
          - "increments MetalsRecoveryBatch.version by 1"
      - from: RECORDED
        to: DISPUTED
        trigger: "POST /wte/metals-recovery-batches/{id}/dispute"
        actor: ContractsManager
        preconditions:
          - "batch.status == RECORDED"
        side_effects:
          - "increments MetalsRecoveryBatch.version by 1"
      - from: DISPUTED
        to: RECORDED
        trigger: "POST /wte/metals-recovery-batches/{id}/resolve"
        actor: ContractsManager
        preconditions:
          - "batch.status == DISPUTED"
        side_effects:
          - "computed fields recomputed from current contract rates via compute_metals_settlement"
          - "increments MetalsRecoveryBatch.version by 1"

  - entity: AshShipment
    initial_state: PLANNED
    terminal_states: [DISPOSED, REJECTED]
    transitions:
      - from: PLANNED
        to: TEST_PENDING
        trigger: "POST /wte/ash-shipments/{id}/submit-testing"
        actor: EnvironmentalOfficer
        preconditions:
          - "shipment.status == PLANNED"
        side_effects:
          - "increments AshShipment.version by 1"
      - from: TEST_PENDING
        to: DISPOSED
        trigger: "POST /wte/ash-shipments/{id}/complete"
        actor: EnvironmentalOfficer
        preconditions:
          - "shipment.status == TEST_PENDING"
          - "at least one AshTest exists with shipment_id == shipment.id"
          - "every AshTest for this shipment has passed == true"
          - "landfill.status == ACTIVE"
          - "landfill.remaining_capacity_tonnes >= shipment.tonnes"
          - "sum of tonnes of AshShipment rows with landfill_id == shipment.landfill_id, shipped_on == shipment.shipped_on, status == DISPOSED, plus shipment.tonnes, <= landfill.daily_receipt_limit_tonnes"
        side_effects:
          - "landfill.remaining_capacity_tonnes -= shipment.tonnes (depth 2)"
          - "if landfill.remaining_capacity_tonnes reaches 0, landfill.status := CLOSED (depth 3: subsequent shipments to this landfill rejected)"
          - "increments AshShipment.version by 1 and Landfill.version by 1"
      - from: TEST_PENDING
        to: REJECTED
        trigger: "POST /wte/ash-shipments/{id}/reject"
        actor: EnvironmentalOfficer
        preconditions:
          - "shipment.status == TEST_PENDING"
          - "reject_reason present in request body"
        side_effects:
          - "increments AshShipment.version by 1"

concurrency_rules:
  - rule_id: agreement-amend-stale-version
    parent_entity: WasteSupplyAgreement
    write_endpoint: "POST /wte/waste-supply-agreements"
    occ_field: "expected_base_agreement_version"
    description: |
      Creating an amending WasteSupplyAgreement (amendment_of_agreement_id set)
      requires the client's last-observed version of the base agreement; a stale
      version means another writer has since changed the base's terms (activation,
      amendment, or delivery-driven version bump) and the amendment is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: delivery-accept-stale-agreement
    parent_entity: WasteSupplyAgreement
    write_endpoint: "POST /wte/waste-deliveries/{id}/accept"
    occ_field: "expected_agreement_version"
    description: |
      Accepting a WasteDelivery requires the client's last-observed version of the
      delivery's WasteSupplyAgreement; a stale version means the agreement's terms
      or cumulative tonnage changed since the client read it, so the fee computed
      from the client's view would be wrong and the accept is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: outage-start-stale-boiler
    parent_entity: Boiler
    write_endpoint: "POST /wte/outage-windows/{id}/start"
    occ_field: "expected_boiler_version"
    description: |
      Starting an OutageWindow requires the client's last-observed version of the
      outage's Boiler; a stale version means the boiler's capacity or status was
      changed since the client read it, so starting the outage against a stale
      view is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: shipment-complete-stale-landfill
    parent_entity: Landfill
    write_endpoint: "POST /wte/ash-shipments/{id}/complete"
    occ_field: "expected_landfill_version"
    description: |
      Completing an AshShipment requires the client's last-observed version of the
      receiving Landfill; a stale version means remaining capacity or status
      changed since the client read it, so the disposal-capacity check against the
      stale view is invalid and the completion is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: compute_tipping_fee
    trigger: "WasteDelivery RECEIVED -> ACCEPTED transition; PUT /wte/waste-deliveries/{id} while status == SCHEDULED (projection read)"
    algorithm: aggregation
    formula: |
      fee_cents = tonnes * tipping_fee_per_tonne_cents, rounded to whole cents
      round_half_up. Two variants over the same fields:
        acceptance variant (authoritative): use the agreement's
          tipping_fee_per_tonne_cents at the moment of acceptance.
        projection variant (advisory, shown on GET/PUT of a SCHEDULED
          delivery as projected_fee_cents): use the current agreement rate —
          which may differ after an amendment supersedes the base rate.
    input_set: "the WasteDelivery row and its WasteSupplyAgreement (state ACTIVE)"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up"
    variants:
      - name: acceptance
        when: "on the RECEIVED -> ACCEPTED transition"
        difference: "uses agreement.tipping_fee_per_tonne_cents at acceptance time; result stored on delivery.tipping_fee_cents"
      - name: projection
        when: "read of a SCHEDULED delivery (GET single, or after PUT update)"
        difference: "uses current agreement rate, which may differ from the rate that acceptance will later apply if an amendment lands in between; surfaced as projected_fee_cents, not persisted as tipping_fee_cents"

  - name: compute_put_or_pay_settlement
    trigger: "POST /wte/settlements/put-or-pay/run for an agreement and period"
    algorithm: waterfall_allocation
    formula: |
      period_indexing: for cadence ANNUAL the period is the agreement's contract
      year starting at term_start anniversary; for MONTHLY it is the UTC calendar
      month containing the logical clock now.
      guarantee_tonnes = guaranteed_annual_tonnage if ANNUAL else
        guaranteed_annual_tonnage / 12.
      delivered_base = sum of tonnes of WasteDelivery rows with
        agreement_id == agreement.id, status == ACCEPTED, and delivered_at
        inside [period_start, period_end). REJECTED and DIVERTED rows are
        excluded.
      already_billed = sum of PutOrPaySettlement amounts already issued for
        earlier periods of this agreement (MONTHLY only; ANNUAL bills once).
      shortfall_tonnes = max(0, guarantee_tonnes - delivered_base -
        already_billed_tonnage_equivalent)  where already_billed_tonnage_
        equivalent = already_billed_cents / tipping_fee_per_tonne_cents.
      shortfall_cents = shortfall_tonnes * tipping_fee_per_tonne_cents,
        round_half_up to whole cents.
    input_set: "WasteSupplyAgreement (ACTIVE or EXPIRED), its ACCEPTED WasteDelivery rows in period, prior PutOrPaySettlement rows for the agreement"
    constants:
      MONTHS_PER_YEAR: 12
      ROUNDING: round_half_up
    precision: "integer cents; tonnes to 3 decimal places"
    variants:
      - name: annual
        when: "agreement.put_or_pay_settlement_cadence == ANNUAL"
        difference: "single settlement per contract year; delivered_base is the full contract year"
      - name: monthly
        when: "agreement.put_or_pay_settlement_cadence == MONTHLY"
        difference: "monthly settlements with prior-period billing deducted via already_billed_tonnage_equivalent so the running guarantee is not double-billed"

  - name: compute_thermal_input
    trigger: "POST /wte/daily-throughput-reports and PUT /wte/daily-throughput-reports/{id} (recompute on edit while DRAFT)"
    algorithm: aggregation
    formula: |
      thermal_input_mw = waste_processed_tonnes * avg_heating_value_mj_per_kg
        * 1000 / 3600 / operating_hours.
      capacity_check = OK iff thermal_input_mw <= sum over boilers b of
        effective_capacity(b), where effective_capacity(b) =
        b.derated_capacity_mw if b.status == DERATED else
        b.max_thermal_capacity_mw if b.status == ONLINE else 0.
      Boundary: exactly equal to capacity is OK (<=).
    input_set: "the DailyThroughputReport row and all Boiler rows"
    constants:
      SECONDS_PER_HOUR: 3600
      KG_PER_TONNE: 1000
    precision: "thermal_input_mw to 3 decimal places, round_half_up"

  - name: compute_steam_output
    trigger: "same as compute_thermal_input (runs together on report create/update)"
    algorithm: aggregation
    formula: |
      raw_steam_tph = thermal_input_mw * STEAM_EFFICIENCY_TPH_PER_MW.
      boiler_steam_cap = sum over boilers b of b.max_steam_tph for b.status
        in {ONLINE, DERATED}.
      steam_output_tph = min(raw_steam_tph, boiler_steam_cap).
      Note the circular-looking dependency: steam_output depends on
      thermal_input, and capacity_check depends on thermal_input — evaluation
      order is pinned: (1) compute_thermal_input, (2) capacity_check,
      (3) compute_steam_output using the thermal_input from step 1.
    input_set: "the DailyThroughputReport row and all Boiler rows"
    constants:
      STEAM_EFFICIENCY_TPH_PER_MW: 0.32
    precision: "steam_output_tph to 3 decimal places, round_half_up"

  - name: compute_ash_generation
    trigger: "same as compute_thermal_input"
    algorithm: aggregation
    formula: |
      ash_generated_tonnes = waste_processed_tonnes * ASH_FRACTION.
    input_set: "the DailyThroughputReport row"
    constants:
      ASH_FRACTION: 0.25
    precision: "tonnes to 3 decimal places, round_half_up"

  - name: compute_energy_billing
    trigger: "POST /wte/energy-deliveries"
    algorithm: tiered_pricing
    formula: |
      Two variants over the same delivery fields:
        contracted variant (kind == PPA):
          billed_amount_cents = delivered_mwh * ppa.energy_rate_cents_per_mwh.
        merchant variant (kind == MERCHANT):
          billed_amount_cents = delivered_mwh *
            delivery.merchant_price_cents_per_mwh.
      Both round to whole cents round_half_up after the multiplication
      (nested rounding pinned: multiply first, round once at the end — never
      round the MWh quantity first).
    input_set: "the EnergyDelivery row and its PowerPurchaseAgreement (status ACTIVE)"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up"
    variants:
      - name: contracted
        when: "ppa.kind == PPA"
        difference: "uses the fixed contracted energy_rate_cents_per_mwh"
      - name: merchant
        when: "ppa.kind == MERCHANT"
        difference: "uses the per-delivery merchant_price_cents_per_mwh snapshot; the same delivered_mwh under the two variants generally yields different billed amounts"

  - name: compute_capacity_payment
    trigger: "POST /wte/energy-deliveries (runs with compute_energy_billing)"
    algorithm: waterfall_allocation
    formula: |
      mode (a) multi-input non-linear formula:
        capacity_payment_cents = min(contracted_mw, available_mw) *
          ppa.capacity_payment_cents_per_mw_month * period_fraction,
        where available_mw = sum over boilers b of effective_capacity(b)
          (derated_capacity_mw if DERATED, max_thermal_capacity_mw if ONLINE,
          0 otherwise),
        and period_fraction = (period_end - period_start) in seconds /
          (seconds in the UTC calendar month containing period_start),
        capped: period_fraction <= 1.
      MERCHANT agreements: capacity_payment_cents = 0 unconditionally.
    input_set: "the EnergyDelivery row, its PPA, and all Boiler rows at submission time"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up; period_fraction to 6 decimal places"

  - name: compute_metals_settlement
    trigger: "POST /wte/metals-recovery-batches; POST /wte/metals-recovery-batches/{id}/resolve (recompute at contract rates)"
    algorithm: tiered_pricing
    formula: |
      Per-line rounding order is pinned: round each recovered-tonnage line to
      3 decimals first, then multiply by price, then round each revenue line to
      whole cents round_half_up, then sum. The alternative order (sum raw then
      round) produces different cents and is FORBIDDEN.
        ferrous_tonnes = round3(ash_input_tonnes * contract.ferrous_recovery_pct)
        nonferrous_tonnes = round3(ash_input_tonnes * contract.nonferrous_recovery_pct)
        ferrous_revenue_cents = round_half_up(ferrous_tonnes * ferrous_price_cents_per_tonne)
        nonferrous_revenue_cents = round_half_up(nonferrous_tonnes * nonferrous_price_cents_per_tonne)
        gross_revenue_cents = ferrous_revenue_cents + nonferrous_revenue_cents
        processing_fee_cents = round_half_up(ash_input_tonnes * contract.processing_fee_cents_per_tonne)
        net_settlement_cents = gross_revenue_cents - processing_fee_cents
    input_set: "the MetalsRecoveryBatch row and its MetalsRecoveryContract (status ACTIVE for creation)"
    constants:
      ROUNDING: round_half_up
      TONNES_DECIMALS: 3
    precision: "integer cents, round_half_up; tonnes 3 decimals"

  - name: compute_emissions_average
    trigger: "POST /wte/emissions-readings"
    algorithm: threshold
    formula: |
      hourly_breach: reading.value > permit.hourly_limit (strictly greater;
      exactly equal is NOT a breach).
      daily_rolling_avg = mean of values of EmissionsReading rows for this
        permit with measured_at inside [reading.measured_at -
        rolling_avg_window_hours hours, reading.measured_at] (inclusive both
        ends), including this reading.
      daily_breach: daily_rolling_avg > permit.daily_limit.
      exceedance = hourly_breach OR daily_breach.
      Boundary precision: comparisons are strictly greater-than; a value
      exactly at the limit does not breach.
    input_set: "the new EmissionsReading row plus prior EmissionsReading rows for the same permit inside the rolling window"
    constants:
      COMPARISON: strict_greater_than
    precision: "rolling average to 6 decimal places, round_half_up"

  - name: compute_tip_floor_allocation
    trigger: "WasteDelivery SCHEDULED -> RECEIVED transition"
    algorithm: waterfall_allocation
    formula: |
      day = UTC calendar date of delivery.delivered_at.
      day_load_tonnes = sum of tonnes of WasteDelivery rows with date(delivered_at)
        == day and status in {SCHEDULED, RECEIVED}. ACCEPTED, REJECTED and
        DIVERTED rows do NOT count against the tip-floor cap.
      A receive is allowed iff day_load_tonnes + delivery.tonnes <=
        DAILY_CAPACITY_TONNES — the comparison is inclusive: a delivery that
        lands the day exactly at the cap is allowed.
      Host override: if the delivery's municipality is linked to a
        HostCommunityAgreement whose [effective_start, effective_end] window
        contains the logical clock now and whose local_waste_priority_enabled
        == true, the cap check is skipped and the receive is always allowed
        (host waste priority). If the cap is exceeded and no effective
        priority agreement exists, reject ERR_PRIORITY_NOT_AVAILABLE.
    input_set: "the WasteDelivery row, all same-day deliveries, the delivery's agreement, its Municipality, and that municipality's HostCommunityAgreement rows"
    constants:
      DAILY_CAPACITY_TONNES: 1000
    precision: "tonnes to 3 decimal places"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id in the path references an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every FK in the request body references an existing resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all mutating endpoints with body FKs"
  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "referenced agreement/PPA/contract/landfill is in a state that permits the child operation (WasteSupplyAgreement ACTIVE for delivery accept; PowerPurchaseAgreement ACTIVE for energy delivery; MetalsRecoveryContract ACTIVE for batch create/settle; Landfill ACTIVE for shipment completion)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /wte/waste-deliveries/{id}/accept, POST /wte/energy-deliveries, POST /wte/metals-recovery-batches, POST /wte/metals-recovery-batches/{id}/settle, POST /wte/ash-shipments/{id}/complete"
  - priority: 7
    category: business_safety
    check: "DailyThroughputReport may be finalized only when capacity_check == OK (thermal input within effective boiler capacity)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /wte/daily-throughput-reports/{id}/finalize"
  - priority: 8
    category: business_safety
    check: "AshShipment completion requires every recorded AshTest for the shipment to have passed == true"
    error_id: ERR_ASH_TEST_FAILED
    http_status: 422
    applies_to: "POST /wte/ash-shipments/{id}/complete"
  - priority: 9
    category: business_safety
    check: "AshShipment completion requires at least one AshTest recorded for the shipment"
    error_id: ERR_TEST_REQUIRED
    http_status: 422
    applies_to: "POST /wte/ash-shipments/{id}/complete"
  - priority: 10
    category: business_safety
    check: "OutageWindow start requires an approved DiversionPlan for the outage"
    error_id: ERR_DIVERSION_PLAN_REQUIRED
    http_status: 422
    applies_to: "POST /wte/outage-windows/{id}/start"
  - priority: 11
    category: business_constraint
    check: "WasteDelivery accept requires at least one boiler in ONLINE or DERATED status"
    error_id: ERR_NO_BOILER_AVAILABLE
    http_status: 422
    applies_to: "POST /wte/waste-deliveries/{id}/accept"
  - priority: 12
    category: business_constraint
    check: "Boiler decommission requires no OutageWindow for the boiler in SCHEDULED or ACTIVE status"
    error_id: ERR_OUTAGE_IN_PROGRESS
    http_status: 422
    applies_to: "POST /wte/boilers/{id}/decommission"
  - priority: 13
    category: business_temporal
    check: "OutageWindow creation must not overlap another OutageWindow for the same boiler in SCHEDULED or ACTIVE status; half-open intervals [starts_at, ends_at) — back-to-back outages (one's ends_at == other's starts_at) are allowed"
    error_id: ERR_OUTAGE_OVERLAP
    http_status: 422
    applies_to: "POST /wte/outage-windows"
  - priority: 14
    category: business_temporal
    check: "HostCommunityAgreement effective windows for the same municipality must not overlap; intervals are closed on both ends — effective_end inclusive — so one agreement's effective_end equal to another's effective_start IS an overlap"
    error_id: ERR_HOST_AGREEMENT_OVERLAP
    http_status: 422
    applies_to: "POST /wte/host-community-agreements"
  - priority: 15
    category: business_temporal
    check: "EmissionsPermit: at most one ACTIVE permit per pollutant"
    error_id: ERR_DUPLICATE_PERMIT
    http_status: 422
    applies_to: "POST /wte/emissions-permits"
  - priority: 16
    category: business_referential
    check: "HostCommunityAgreement.municipality_id must reference a Municipality with is_host_community == true"
    error_id: ERR_NOT_HOST_COMMUNITY
    http_status: 422
    applies_to: "POST /wte/host-community-agreements"
  - priority: 17
    category: business_referential
    check: "DiversionLeg creation requires its DiversionPlan.approved == false (legs are frozen once the plan is approved)"
    error_id: ERR_PLAN_ALREADY_APPROVED
    http_status: 422
    applies_to: "POST /wte/diversion-plans/{id}/legs"
  - priority: 18
    category: business_referential
    check: "WasteDelivery diversion requires the outage to be ACTIVE with an approved plan and remaining diversion capacity (per-day cap times outage length)"
    error_id: ERR_DIVERSION_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /wte/waste-deliveries/{id}/divert"
  - priority: 19
    category: business_fiscal
    check: "AshShipment completion requires landfill.remaining_capacity_tonnes >= shipment.tonnes and the landfill's daily receipt cap (sum of DISPOSED tonnes on shipped_on + this tonnes <= daily_receipt_limit_tonnes)"
    error_id: ERR_LANDFILL_CAPACITY
    http_status: 422
    applies_to: "POST /wte/ash-shipments/{id}/complete"
  - priority: 20
    category: business_fiscal
    check: "EnergyDelivery period must fall within [ppa.term_start, ppa.term_end)"
    error_id: ERR_PERIOD_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /wte/energy-deliveries"
  - priority: 21
    category: business_fiscal
    check: "MERCHANT energy delivery requires merchant_price_cents_per_mwh present; PPA delivery forbids it being used (ignored if present)"
    error_id: ERR_MERCHANT_PRICE_REQUIRED
    http_status: 422
    applies_to: "POST /wte/energy-deliveries"
  - priority: 22
    category: business_constraint
    check: "OCC: expected_*_version on guarded write endpoints must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /wte/waste-supply-agreements (amendment), POST /wte/waste-deliveries/{id}/accept, POST /wte/outage-windows/{id}/start, POST /wte/ash-shipments/{id}/complete"
  - priority: 23
    category: business_constraint
    check: "manifest_ref unique across all WasteDelivery rows"
    error_id: ERR_DUPLICATE_MANIFEST
    http_status: 422
    applies_to: "POST /wte/waste-deliveries"
  - priority: 24
    category: business_constraint
    check: "DailyThroughputReport.report_date unique across all reports"
    error_id: ERR_DUPLICATE_REPORT_DATE
    http_status: 422
    applies_to: "POST /wte/daily-throughput-reports"
  - priority: 25
    category: business_constraint
    check: "DiversionPlan approve requires planned_diverted_tonnes > 0 (at least one leg)"
    error_id: ERR_NO_DIVERSION_LEGS
    http_status: 422
    applies_to: "POST /wte/diversion-plans/{id}/approve"
  - priority: 26
    category: business_constraint
    check: "Tip-floor daily allocation per compute_tip_floor_allocation: same-day SCHEDULED+RECEIVED tonnes + this delivery's tonnes must be <= 1000 (inclusive boundary), unless the municipality holds an in-window HostCommunityAgreement with local_waste_priority_enabled == true"
    error_id: ERR_PRIORITY_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /wte/waste-deliveries/{id}/receive"
  - priority: 27
  - priority: 27
    category: business_constraint
    check: "Field shape/range: tonnes > 0; heating_value_mj_per_kg > 0; 0 < operating_hours <= 24; 0 < derated_capacity_mw < max_thermal_capacity_mw; term/effective/period ends after starts; enum fields within declared sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 28
    category: existence
    check: "required request body fields present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
    note: "missing-required-field is reported as ERR_INVALID_REQUEST; ordering: presence/type checks (28, 27) run after auth/existence/state so a state error wins over a body-shape error"

endpoints:
