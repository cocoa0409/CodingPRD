        claim_type: temporal_validation
        grounds:
          - validations[priority=10]
          - errors[ERR_PHASE_REQUIREMENT_NOT_MET]
        distinguishing_aspect: "Phase gating on two different workflows: as-built create before CONSTRUCTION_ADMINISTRATION -> ERR_PHASE_REQUIREMENT_NOT_MET; handover mark-ready before CLOSEOUT -> ERR_PHASE_REQUIREMENT_NOT_MET."
        test_recipe:
