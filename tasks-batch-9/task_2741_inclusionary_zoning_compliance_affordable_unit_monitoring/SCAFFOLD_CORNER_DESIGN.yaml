            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Hana Iyer", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h1_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h1_id}", unit_id: "${u_id}", certified_income_cents: 6000000, contract_rent_cents: 0, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c1_id: $.data.id } }
