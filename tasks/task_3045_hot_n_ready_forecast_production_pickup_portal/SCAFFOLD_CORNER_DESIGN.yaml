              as: StoreManager
            - call: "POST /products"
              payload: { sku: "PEP", name: "Pepperoni", list_price_cents: 600 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /orders"
              payload:
                store_day_id: "${sd_id}"
                daypart_id: "${dp_id}"
                customer_id: "cust-c3"
                kind: "PORTAL_STANDARD"
                lines:
                  - { product_id: "${p_id}", quantity: 1, customized: false }
              as: Customer
              as_user_id: "cust-c3"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/pay"
