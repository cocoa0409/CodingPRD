  - { method: POST, path: "/noise-program/noise-monitors", description: "Register a monitor", roles: [NoiseOfficeAdmin], code: 201, input: [station_code, zone_code, latitude, longitude, commissioned_at], output: NoiseMonitor, side_effects: ["status=ONLINE"] }
  - { method: GET, path: "/noise-program/noise-monitors", description: "List monitors", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: ["limit?", "offset?", "status?", "zone_code?"], output: "NoiseMonitor[]", side_effects: [] }
  - { method: GET, path: "/noise-program/noise-monitors/{monitorId}", description: "Get a monitor", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: [], output: NoiseMonitor, side_effects: [] }
