              as_user_id: "${hb_id}"
              captures: { herr: $.data.error_id }
          assert:
            - "error_id == ERR_CHAIR_EXISTS"
            - "CommitteeMembership.${hmem2_id}.status == INVITED"

      - name: err_duplicate_child_second_committee
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_CHILD]"
        distinguishing_aspect: "Creating a second committee for the same event -> ERR_DUPLICATE_CHILD."
        test_recipe:
          setup: ["Event with an existing committee"]
          setup_api_calls:
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { dev_id: $.data.id }
            - call: "POST /alumni/events/${dev_id}/committee"
              payload: { name: "C1" }
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/events/${dev_id}/committee"
              payload: { name: "C2" }
              as: AlumniRelationsStaff
              captures: { derr: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_CHILD"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: alumni_cannot_create_event
        claim_type: role_denial
        grounds:
          - "roles"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "Alumni role calling POST /alumni/events -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["An alumnus record to act as"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "RA", primary_email: "ra@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: Alumni
              as_user_id: "${ra_id}"
              captures: { raerr: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED"
            - "HTTP status 403"

      - name: staff_cannot_clear_do_not_contact
        claim_type: role_denial
        grounds:
          - "roles"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "clear-do-not-contact is Director-exclusive; staff attempt -> ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Record in DO_NOT_CONTACT"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "DNC", primary_email: "dnc@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { dnc_id: $.data.id }
            - call: "POST /alumni/records/${dnc_id}/set-do-not-contact"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/records/${dnc_id}/clear-do-not-contact"
              payload: {}
              as: AlumniRelationsStaff
              captures: { dncerr: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED"

      - name: volunteer_cannot_accept_others_membership
        claim_type: ownership_denial
        grounds: [roles, state_machines.CommitteeMembership.INVITED_to_ACTIVE]
        distinguishing_aspect: "CommitteeVolunteer whose AlumniRecord.id != membership.alumni_id gets ERR_UNAUTHORIZED on accept."
        test_recipe:
          setup: ["Membership invited for alumnus V1; acting user V2 attempts accept"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "V1", primary_email: "v1@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { v1_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "V2", primary_email: "v2@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { v2_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { vev_id: $.data.id }
            - call: "POST /alumni/events/${vev_id}/committee"
              payload: { name: "C" }
              as: AlumniRelationsStaff
              captures: { vcom_id: $.data.id }
            - call: "POST /alumni/committees/${vcom_id}/memberships"
              payload: { alumni_id: "${v1_id}", role: "MEMBER" }
              as: AlumniRelationsStaff
              captures: { vmem_id: $.data.id }
          trigger:
            - call: "POST /alumni/memberships/${vmem_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${v2_id}"
              captures: { verr: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED"
            - "CommitteeMembership.${vmem_id}.status == INVITED"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_record_update
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[record-update-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "PUT with expected_record_version one behind current -> 412 ERR_STALE_VERSION; correct version succeeds and bumps version."
        test_recipe:
          setup: ["Record created (version 1)"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "OCC1", primary_email: "occ1@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { occ1_id: $.data.id, occ1_v: $.data.version }
          trigger:
            - call: "PUT /alumni/records/${occ1_id}"
              payload: { full_name: "OCC1 Updated", expected_record_version: "${occ1_v}" }
              as: AlumniRelationsStaff
            - call: "PUT /alumni/records/${occ1_id}"
              payload: { full_name: "OCC1 Again", expected_record_version: "${occ1_v}" }
              as: AlumniRelationsStaff
              captures: { occerr: $.data.error_id }
          assert:
            - "First PUT succeeded and bumped AlumniRecord.${occ1_id}.version to ${occ1_v} + 1"
            - "Second PUT with the same (now stale) version -> error_id == ERR_STALE_VERSION, HTTP 412"

      - name: occ_stale_version_on_tier_create
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[tier-create-stale-event]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Second tier create carrying the pre-first-create event version -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Event created; version captured before any tier"]
          setup_api_calls:
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { oev_id: $.data.id, oev_v: $.data.version }
          trigger:
            - call: "POST /alumni/events/${oev_id}/ticket-tiers"
              payload: { name: "T1", base_price_cents: 1000, capacity: 0, sales_start: "2026-05-01T00:00:00Z", sales_end: "2026-06-01T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${oev_v}" }
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${oev_id}/ticket-tiers"
              payload: { name: "T2", base_price_cents: 1500, capacity: 0, sales_start: "2026-06-01T00:00:00Z", sales_end: "2026-08-01T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${oev_v}" }
              as: AlumniRelationsStaff
              captures: { oeverr: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (event version advanced to ${oev_v} + 1 by first tier create)"
            - "HTTP 412"

      - name: suppression_do_not_contact_record_blocks_channel
        claim_type: conditional_feature
        grounds:
          - "calculations.suppression_recompute"
          - "errors[ERR_CHANNEL_SUPPRESSED]"
        distinguishing_aspect: "After set-do-not-contact, all preference rows for the record show suppressed=true with suppression_reason=DO_NOT_CONTACT_RECORD; clearing (director) restores suppressed=false when no global list entry exists."
        test_recipe:
          setup: ["Record with EMAIL preference opt_in=true; record set to DO_NOT_CONTACT"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "Sup", primary_email: "sup@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { sup_id: $.data.id }
            - call: "POST /alumni/records/${sup_id}/preferences"
              payload: { channel: "EMAIL", opt_in: true }
              as: AlumniRelationsStaff
              captures: { suppref_id: $.data.id }
            - call: "POST /alumni/records/${sup_id}/set-do-not-contact"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "GET /alumni/records/${sup_id}/preferences"
              as: AlumniRelationsStaff
          assert:
            - "CommunicationPreference.${suppref_id}.suppressed == true"
            - "CommunicationPreference.${suppref_id}.suppression_reason == DO_NOT_CONTACT_RECORD"

      - name: global_suppression_list_round_trip
        claim_type: derived_field_reconciliation
        grounds: [calculations.suppression_recompute]
        distinguishing_aspect: "Adding (alumni, MAIL) to the global list suppresses that channel with reason GLOBAL_LIST; deleting the entry restores suppressed=false."
        test_recipe:
          setup: ["Record ACTIVE with MAIL preference"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "GS", primary_email: "gs@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { gs_id: $.data.id }
            - call: "POST /alumni/records/${gs_id}/preferences"
              payload: { channel: "MAIL", opt_in: true }
              as: AlumniRelationsStaff
              captures: { gspref_id: $.data.id }
          trigger:
            - call: "POST /alumni/suppression-list"
              payload: { alumni_id: "${gs_id}", channel: "MAIL" }
              as: AlumniRelationsStaff
            - call: "DELETE /alumni/suppression-list"
              payload: { alumni_id: "${gs_id}", channel: "MAIL" }
              as: AlumniRelationsStaff
          assert:
            - "After add: CommunicationPreference.${gspref_id}.suppressed == true with suppression_reason == GLOBAL_LIST"
            - "After delete: CommunicationPreference.${gspref_id}.suppressed == false and suppression_reason == NONE"

      - name: logical_clock_default_fixed
        claim_type: scheduled_actions
        grounds: [endpoints, "POST /alumni/_clock/set_current_utc"]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-05-01T00:00:00Z (not wall clock); a tier window starting 2026-05-01T00:00:00Z is open by default."
        test_recipe:
          setup: ["Event OPEN whose tier window starts exactly at the default clock 2026-05-01T00:00:00Z; no set_current_utc call before registration"]
          setup_api_calls:
            - call: "POST /alumni/records"
              payload: { full_name: "KCh", primary_email: "kch@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { kch_id: $.data.id }
            - call: "POST /alumni/records"
              payload: { full_name: "KG", primary_email: "kg@x.com", class_year: 2001, degree_code: "BA" }
              as: AlumniRelationsStaff
              captures: { kg_id: $.data.id }
            - call: "POST /alumni/events"
              payload: { class_year: 2001, title: "R", event_date: "2026-09-01T18:00:00Z", committee_quorum_required: 1 }
              as: AlumniRelationsStaff
              captures: { kev_id: $.data.id, kev_v: $.data.version }
            - call: "POST /alumni/events/${kev_id}/committee"
              payload: { name: "C" }
              as: AlumniRelationsStaff
              captures: { kcom_id: $.data.id }
            - call: "POST /alumni/committees/${kcom_id}/memberships"
              payload: { alumni_id: "${kch_id}", role: "CHAIR" }
              as: AlumniRelationsStaff
              captures: { kmem_id: $.data.id }
            - call: "POST /alumni/memberships/${kmem_id}/accept"
              payload: {}
              as: CommitteeVolunteer
              as_user_id: "${kch_id}"
            - call: "POST /alumni/events/${kev_id}/form-committee"
              payload: {}
              as: AlumniRelationsStaff
            - call: "POST /alumni/events/${kev_id}/ticket-tiers"
              payload: { name: "GA", base_price_cents: 1000, capacity: 0, sales_start: "2026-05-01T00:00:00Z", sales_end: "2026-09-01T00:00:00Z", early_bird_discount_pct: 0, expected_event_version: "${kev_v}" }
              as: AlumniRelationsStaff
              captures: { ktier_id: $.data.id }
            - call: "POST /alumni/events/${kev_id}/open-registration"
              payload: {}
              as: AlumniRelationsStaff
          trigger:
            - call: "POST /alumni/events/${kev_id}/registrations"
              payload: { tier_id: "${ktier_id}", alumni_id: "${kg_id}" }
              as: Alumni
              as_user_id: "${kg_id}"
              captures: { kregn_id: $.data.id }
          assert:
            - "Registration created successfully at default clock (sales_start boundary is inclusive under [start, end) semantics)"
