            - "setup_api_calls[15] response data.cross_contact_statement_required == true - the certified recipe has components with SHARED_FRYER and SHARED_LINE risk"
            - "setup_api_calls[15] response allergen_rows[1] is the Grill Sandwich row with allergen_groups == [MILK, WHEAT] and cross_contact_groups == [MILK]: the chicken carries SHARED_FRYER risk but allergen_group NONE, so it contributes nothing"
            - "trigger[0] response data.packet_version == 3, data.covered_item_count == 2, data.allergen_matrix_complete == true and data.cross_contact_statement_required == true"
            - "trigger[0] response allergen_rows[0] is the Almond Slaw row with allergen_groups == [EGG, TREE_NUT] and cross_contact_groups == [TREE_NUT]"
            - "trigger[0] response allergen_rows[1] is the Grill Sandwich row with allergen_groups == [MILK, WHEAT] and cross_contact_groups == [MILK]"
            - "GET /brands/${brand}/disclosure-packets returns total_count == 3 with every row still in status DRAFT"

      - name: penalty_fee_reaches_tier_three_above_the_second_ceiling
        claim_type: tiered_pricing
        grounds:
          - calculations.enforcement_penalty_assessment
          - calculations.enforcement_penalty_assessment.constants.FEE_TIER_2_CEILING_CENTS
          - calculations.enforcement_penalty_assessment.constants.FEE_RATE_TIER_3
          - endpoints[POST /enforcement-actions/{id}/regulator-actions]
        distinguishing_aspect: "Pushes base_penalty_cents past FEE_TIER_2_CEILING_CENTS for the only time in the design: four non-current published boards on one establishment in an ENHANCED jurisdiction give base 50000 * 4 * 1.5 == 300000, which is strictly above 250000 and so takes FEE_RATE_TIER_3 (12%) rather than the 8% the same board count would take in a FEDERAL_ALIGNED jurisdiction."
        test_recipe:
          setup:
            - "ENHANCED jurisdiction, COVERED brand with a PUBLISHED disclosure packet, one certified STANDARD item declared at 100 Cal."
            - "One establishment carries all four board types, each PUBLISHED from 2026-08-01T00:00:00Z and each listing the item."
            - "A second certification moves the declaration to 400 Cal, a delta of 300 against a tolerance of 20, so all four boards enter REPRINT_REQUIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "NY-ENH", name: "New York", preemption_mode: "PREEMPTED", extra_requirement: "NONE", enforcement_tier: "ENHANCED", required_succinct_statement_variant: "FEDERAL_DEFAULT" }
