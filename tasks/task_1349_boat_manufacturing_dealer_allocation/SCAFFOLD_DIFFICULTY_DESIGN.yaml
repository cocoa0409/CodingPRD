          assert:
            - "DealerOrder.${ord1}.status == ALLOCATED (self-loop, state preserved)"
            - "DealerOrder.${ord1}.version == ${ord1_v} + 1 (version bumped despite no state change)"
            - "DealerOrder.${ord1}.production_hours == 50 (40 base + 6 TOWER + 4 BALLAST)"
            - "DealerOrder.${ord1}.invoice_total_cents == 3093605 (recomputed for new option set)"
            - "BuildSlot.${slot1}.reserved_hours == 50 (46 + delta 4)"

  # ========================================================================= rule 4
  # transitive_cascade: two cascades, one depth >= 3, one depth >= 2, DIFFERENT triggers.
  - rule_id: transitive_cascade
    instances:
      - name: deliver_cascade_opens_advance_recomputes_utilization_and_tier
        grounds:
          - state_machines.Hull_delivery.AT_PLANT_to_DELIVERED
          - entities.FloorPlanAdvance.fields.rate_tier
          - entities.Dealer.fields.floor_plan_utilized_cents
          - entities.Dealer.fields.current_rate_tier
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /hulls/{id}/deliver:
          hop1 FloorPlanAdvance created (principal = order.invoice_total_cents);
          hop2 Dealer.floor_plan_utilized_cents incremented by that principal;
          hop3 Dealer.current_rate_tier recomputed from the new utilization ratio.
          Each hop is CAUSED by the previous hop, not by the original trigger.
          Setup pins dealer limit so the recomputed tier lands on TIER_ELEVATED.
        test_recipe:
          setup:
            - "SP190 model; dealer D1 limit 6000000; order confirmed+hull certified (invoice 3093605)"
            - "Pre-deliver dealer.current_rate_tier == TIER_STANDARD (utilization 0)"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "WAKE-TOWER", name: "Wake Tower", price_cents: 350000, production_hours: 6 }
              as: SystemAdmin
              captures: { opt_tower: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "BALLAST", name: "Ballast System", price_cents: 180000, production_hours: 4 }
              as: SystemAdmin
              captures: { opt_ballast: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 6000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 309361, option_package_ids: ["${opt_tower}", "${opt_ballast}"], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id }
            - call: "POST /dealer-orders/${ord1}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr1}"
            - call: "POST /hulls"
              payload: { order_id: "${ord1}" }
              as: ProductionPlanner
              as_user_id: "planner-1"
              captures: { hull1: $.data.id }
            - call: "POST /hulls/${hull1}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-9"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /dealers/${dlr1}"
              payload: {}
              as: Any
              captures: { tier_pre: $.data.current_rate_tier }
          trigger:
            - call: "POST /hulls/${hull1}/deliver"
              payload: {}
              as: ProductionPlanner
              as_user_id: "planner-1"
          assert:
            - "Dealer.${dlr1}.current_rate_tier before deliver == TIER_STANDARD (utilization 0)"
            - "Dealer.${dlr1}.floor_plan_utilized_cents == 3093605 after deliver (hop 2)"
            - "Dealer.${dlr1}.current_rate_tier == TIER_ELEVATED after deliver (hop 3: ratio 0.516 >= 0.50)"
            - "FloorPlanAdvance for Hull.${hull1} has rate_tier == TIER_ELEVATED (locked from post-inclusion utilization)"
            - "DealerOrder.${ord1}.status == DELIVERED (parallel side effect)"

      - name: cancel_cascade_releases_slot_and_promotes_waitlist
        grounds:
          - state_machines.DealerOrder.ALLOCATED_to_CANCELLED
          - calculations.waitlist_promotion_selector
          - entities.BuildSlot.fields.reserved_hours
          - entities.Dealer.fields.allocation_used
        distinguishing_aspect: |
          Depth-2 cascade originating from POST /dealer-orders/{id}/cancel on ALLOCATED:
          hop1 slot.reserved_hours decremented by cancelled order's hours;
          hop2 waitlist_promotion_selector picks one WAITLISTED order and re-books it on
          the freed slot (its slot.reserved_hours incremented again, its dealer
          allocation_used recomputed). Each hop caused by the previous, distinct from
          the deliver cascade.
        test_recipe:
          setup:
            - "SP190 model; two dealers DA (quota 5) and DB (quota 5); run slot cap 50"
            - "Order OA from DA with TOWER (46h) ALLOCATED on slot; slot.reserved_hours = 46"
            - "Order OB from DB with BALLAST (44h) initially WAITLISTED (slot has 4h free, insufficient for 44)"
            - "Cancel OA releases 46h; selector promotes OB to ALLOCATED on the same slot"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "WAKE-TOWER", name: "Wake Tower", price_cents: 350000, production_hours: 6 }
              as: SystemAdmin
              captures: { opt_tower: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "BALLAST", name: "Ballast System", price_cents: 180000, production_hours: 4 }
              as: SystemAdmin
              captures: { opt_ballast: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-A", name: "Dealer A", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlra: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-B", name: "Dealer B", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlrb: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 50 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlra}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 291748, option_package_ids: ["${opt_tower}"], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlra}"
              captures: { orda: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlrb}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 275113, option_package_ids: ["${opt_ballast}"], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlrb}"
              captures: { ordb: $.data.id, ordb_status: $.data.status }
          trigger:
            - call: "POST /dealer-orders/${orda}/cancel"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlra}"
          assert:
            - "DealerOrder.${orda}.status == CANCELLED"
            - "DealerOrder.${ordb}.status before cancel == WAITLISTED"
            - "After cancel: DealerOrder.${ordb}.status == ALLOCATED (promoted by selector)"
            - "After cancel: DealerOrder.${ordb}.slot_id == ${slot1}"
            - "BuildSlot.${slot1}.reserved_hours == 44 after cascade (46 released - 46 + 44 promoted)"
            - "Dealer.${dlra}.allocation_used == 0 after cancel (released)"
            - "Dealer.${dlrb}.allocation_used == 1 after promotion"

  # ========================================================================= rule 5
  # priority_pair_validation_conflict: two dual-failure scenarios on DIFFERENT
  # error-category pairs.
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_beats_business_fiscal_on_confirm
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - state_machines.DealerOrder.ALLOCATED_to_COMMITTED
        distinguishing_aspect: |
          Category pair state (priority 7) vs business_fiscal (priority 11): when a
          COMMITTED order is re-confirmed AND its deposit is somehow insufficient,
          the state check fires first -> ERR_INVALID_ORDER_STATE (409), not
          ERR_DEPOSIT_INSUFFICIENT (422). Pair differs from instance 2's pair.
        test_recipe:
          setup:
            - "Order O1 RETAIL with TOWER; allocated and confirmed (COMMITTED)"
            - "O1 now violates state (not ALLOCATED) AND would also violate deposit if re-validated against a recomputed required_deposit; state has higher precedence"
