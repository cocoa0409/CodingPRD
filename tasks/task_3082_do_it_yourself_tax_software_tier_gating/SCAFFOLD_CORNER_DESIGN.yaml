              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "W2_WH", amount_cents: 7000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { w2_form: $.data.id, ret_v3: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/forms/${w2_form}/remove"
