            - "resubmit response: status == SUBMITTED and reject_reason == null (cleared)"

      - name: questionnaire_review_loop_changes_requested
        claim_type: valid_transition
        grounds: [state_machines.QuestionnaireResponse.IN_REVIEW_to_DRAFT, state_machines.QuestionnaireResponse.IN_REVIEW_to_APPROVED]
        distinguishing_aspect: "REQUEST_CHANGES loops the questionnaire IN_REVIEW -> DRAFT preserving answers; after re-submit a second decision APPROVE lands it in APPROVED."
