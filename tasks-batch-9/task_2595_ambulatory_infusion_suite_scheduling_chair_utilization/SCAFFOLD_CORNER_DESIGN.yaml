            - "Third trigger HTTP status == 201 with Appointment.${ap_ok}.cycle_number == 6 — the upper edge of [1, total_cycles] is inclusive"
            - "Neither refusal wrote an appointment: GET /appointments filtered by treatment_plan_id == ${pl_owner} returns exactly 1 row"
            - "Chair.${ch1}.committed_minutes == 240 — only the accepted booking consumed capacity"

      - name: template_drug_mismatch_outranks_the_center_mismatch_on_one_doubly_wrong_template
        claim_type: priority_conflict
        grounds:
          - validations[priority 61]
          - validations[priority 62]
          - errors[ERR_TEMPLATE_DRUG_MISMATCH]
          - errors[ERR_TEMPLATE_CENTER_MISMATCH]
        distinguishing_aspect: |
          Two adjacent referential checks are separated by one priority step and both return
          422. A template built for the WRONG center and the WRONG drug must surface
          ERR_TEMPLATE_DRUG_MISMATCH; swapping in a template of the wrong center but the
          right drug then surfaces ERR_TEMPLATE_CENTER_MISMATCH from an otherwise identical
          request. Note the drug check compares against TreatmentPlan.drug_id while the
          center check compares against the request body's center_id, so the two rules read
          different sources.
        test_recipe:
          setup:
            - "Two centers HOME and AWAY with identical hours, each with a chair and a nurse."
            - "Two drugs REF and ALT with identical timing numbers so the derived dose tier is MID for both."
            - "Three templates: T_HOME_REF (HOME, REF), T_AWAY_ALT (AWAY, ALT), T_AWAY_REF (AWAY, REF)."
