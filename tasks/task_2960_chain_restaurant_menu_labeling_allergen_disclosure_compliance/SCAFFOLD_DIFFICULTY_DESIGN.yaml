        distinguishing_aspect: "Resource = MenuBoard display slot, keyed by (establishment_id, board_type). Interval semantics are half-open [effective_from, effective_to) with a null effective_to meaning open-ended and zero buffer, so a window may start exactly where another ends; the same clock window on a different board_type is a different resource and never conflicts."
