              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 30, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T20:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
