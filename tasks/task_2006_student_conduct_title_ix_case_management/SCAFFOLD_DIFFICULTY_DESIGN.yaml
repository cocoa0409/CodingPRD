            - { call: "POST /api/cases/${case_id}/dismiss", payload: { dismissal_reason: "MANDATORY_NO_JURISDICTION", refer_to_conduct: false }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - call: "POST /api/cases/${case_id}/appeals"
              payload: { filed_by_side: "COMPLAINANT", appeal_target: "DETERMINATION", grounds: ["PROCEDURAL_IRREGULARITY"], statement: "No determination exists" }
              as: Party
              as_user_id: "${comp_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/cases/${case_id}/appeals"
              payload: { filed_by_side: "COMPLAINANT", appeal_target: "DISMISSAL", grounds: ["PROCEDURAL_IRREGULARITY"], statement: "Dismissal appeal is valid" }
              as: Party
