  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_assign_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[trip-assign-stale-version]", "errors[ERR_STALE_VERSION]", state_machines.TripRequest.SCHEDULED_to_ASSIGNED]
        distinguishing_aspect: "Assigning with expected_trip_version one less than the trip's current version (stale) is rejected ERR_STALE_VERSION (412); the trip remains in its current state."
        test_recipe:
          setup: ["A SCHEDULED AMBULATORY trip; the client holds a version one behind current (simulated by passing version-minus-one)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "AMBULATORY", base_fare_cents: 1500, loaded_rate_cents_per_mile: 120, dwell_free_minutes: 15, dwell_cents_per_minute: 40 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-OC1", full_name: "Occ One", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "ROUTINE", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerOC", covered_counties: ["C1"], max_modality: "AMBULATORY", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Oc D", vehicle_modality: "AMBULATORY", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
          trigger:
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched} - 1", preferred_broker_id: "${brk_id}" }
              as: Broker
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "data.error_id == ERR_STALE_VERSION"
            - "TripRequest.${trip_id}.trip_status == SCHEDULED (unchanged)"

      - name: assign_bumps_trip_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[trip-assign-stale-version]", state_machines.TripRequest.SCHEDULED_to_ASSIGNED, entities.TripRequest.fields.version]
        distinguishing_aspect: "A successful assign increments TripRequest.version by 1, so a subsequent stale assign carrying the pre-assign version would fail."
        test_recipe:
          setup: ["A SCHEDULED AMBULATORY trip assigned successfully once."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /rate-schedules"
              payload: { modality: "AMBULATORY", base_fare_cents: 1500, loaded_rate_cents_per_mile: 120, dwell_free_minutes: 15, dwell_cents_per_minute: 40 }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-OC2", full_name: "Occ Two", mobility_level: "AMBULATORY", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "ROUTINE", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /brokers"
              payload: { name: "BrokerOC2", covered_counties: ["C1"], max_modality: "AMBULATORY", free_deadhead_miles: 5, deadhead_rate_cents_per_mile: 80 }
              as: Coordinator
              captures: { brk_id: $.data.id }
            - call: "POST /_geo/county_distance"
              payload: { county_a: "C2", county_b: "C1", miles: 12 }
              as: Coordinator
            - call: "POST /drivers"
              payload: { broker_id: "${brk_id}", full_name: "Oc2 D", vehicle_modality: "AMBULATORY", base_county: "C2" }
              as: Broker
              captures: { drv_id: $.data.id }
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "AMBULATORY", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 8, is_round_trip: false }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
              captures: { trip_v_sched: $.data.version }
          trigger:
            - call: "POST /trips/${trip_id}/assign"
              payload: { expected_trip_version: "${trip_v_sched}", preferred_broker_id: "${brk_id}" }
              as: Broker
              captures: { v_after: $.data.version }
          assert:
            - "TripRequest.${trip_id}.version == ${trip_v_sched} + 1 (assign bumped version by exactly 1)"
            - "TripRequest.${trip_id}.trip_status == ASSIGNED"

      - name: eligibility_lapse_cascade_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.Member.ELIGIBLE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / eligibility_lapse_cascade_depth3
          rationale: "The full N-level eligibility lapse cascade is the named §1.8 transitive_cascade instance."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: schedule_creates_legs_visible_immediately
        claim_type: immediate
        grounds: [state_machines.TripRequest.DRAFT_to_SCHEDULED, entities.Leg]
        distinguishing_aspect: "Immediately after POST /trips/{id}/schedule, GET /trips/{id}/legs returns the created OUTBOUND (+RETURN) legs in the same logical request flow (immediate consistency)."
        test_recipe:
          setup: ["An ELIGIBLE WHEELCHAIR member with a covering BARIATRIC span; a DRAFT round-trip trip."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-03-01T08:00:00Z" }
              as: Coordinator
            - call: "POST /members"
              payload: { medicaid_id: "M-CM1", full_name: "Cons One", mobility_level: "WHEELCHAIR", home_county: "C1" }
              as: Coordinator
              captures: { mem_id: $.data.id }
            - call: "POST /eligibility-spans"
              payload: { member_id: "${mem_id}", level_of_service: "BARIATRIC", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /trips"
              payload: { member_id: "${mem_id}", modality: "WHEELCHAIR", requested_level_of_service: "ROUTINE", appointment_at: "2026-03-02T09:00:00Z", scheduled_loaded_miles: 10, is_round_trip: true, return_is_will_call: true }
              as: Coordinator
              captures: { trip_id: $.data.id }
            - call: "POST /trips/${trip_id}/schedule"
              payload: {}
              as: Coordinator
          trigger:
            - call: "GET /trips/${trip_id}/legs"
              payload: {}
              as: Coordinator
          assert:
            - "response_type == array"
            - "total_count == 2 (OUTBOUND + RETURN)"
            - "data[0].direction == OUTBOUND and data[1].direction == RETURN and data[1].is_will_call == true"
