    path: /diversion-consignments/{id}/stage
    purpose: Stage a consignment for pickup, locking its line set.
    roles: [SiteSustainabilityManager]
    input: []
    output: DiversionConsignment
    side_effects: ["state_machines.DiversionConsignment.logistics.DRAFT_to_STAGED; freezes staged_weight_grams for the ticket variance calculation"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_CONSIGNMENT_NOT_FOUND, ERR_SITE_SCOPE_VIOLATION, ERR_INVALID_CONSIGNMENT_STATE, ERR_SITE_POSTURE_BLOCKS_DONATION, ERR_HAULER_CAPACITY_EXCEEDED, ERR_CONSIGNMENT_EMPTY]

  - method: POST
    path: /diversion-consignments/{id}/dispatch
    purpose: Dispatch a staged consignment to an approved hauler.
    roles: [SiteSustainabilityManager, HaulerOperator]
    input: []
    output: DiversionConsignment
    side_effects: ["state_machines.DiversionConsignment.logistics.STAGED_to_DISPATCHED; the consignment becomes ticket-eligible"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_CONSIGNMENT_NOT_FOUND, ERR_SITE_SCOPE_VIOLATION, ERR_HAULER_SCOPE_VIOLATION, ERR_INVALID_CONSIGNMENT_STATE, ERR_HAULER_NOT_APPROVED, ERR_SITE_POSTURE_BLOCKS_DONATION]

  - method: POST
    path: /diversion-consignments/{id}/cancel
    purpose: Cancel a consignment, releasing every routed gram back to its entries.
    roles: [SiteSustainabilityManager]
    input: [cancel_reason]
    output: DiversionConsignment
    side_effects: ["state_machines.DiversionConsignment.logistics.*_to_CANCELLED; lines are retained but stop counting, so every affected WasteEntry.routed_weight_grams / unrouted_weight_grams is recomputed (compensating_invariant/routed_weight_conservation)"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_INVALID_REQUEST, ERR_CONSIGNMENT_NOT_FOUND, ERR_SITE_SCOPE_VIOLATION, ERR_INVALID_CONSIGNMENT_STATE]

  - method: GET
    path: /diversion-consignments/{id}
    purpose: Read one consignment with both state dimensions.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, HaulerOperator, CorporateSustainabilityLead, PlatformAdmin]
    input: []
    output: DiversionConsignment
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_CONSIGNMENT_NOT_FOUND]

  - method: GET
    path: /diversion-consignments
    purpose: List consignments, filterable by site, hauler, channel and either state dimension.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, HaulerOperator, CorporateSustainabilityLead, PlatformAdmin]
    input: ["site_id?", "hauler_id?", "channel?", "logistics_status?", "settlement_status?", "limit?", "offset?"]
    output: DiversionConsignment[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_INVALID_REQUEST, ERR_INVALID_PAGINATION]

  # ----- ConsignmentLine --------------------------------------------------
  - method: POST
    path: /consignment-lines
    purpose: Route grams from a capture onto a DRAFT consignment.
    roles: [SiteSustainabilityManager, ShiftLead]
    input: [consignment_id, waste_entry_id, allocated_weight_grams]
    output: ConsignmentLine
    side_effects: ["recomputes WasteEntry.routed_weight_grams / unrouted_weight_grams and DiversionConsignment.staged_weight_grams / line_count (calculations.routed_weight_allocation)"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_INVALID_REQUEST, ERR_CONSIGNMENT_NOT_FOUND, ERR_ENTRY_NOT_FOUND, ERR_SITE_SCOPE_VIOLATION, ERR_INVALID_CONSIGNMENT_STATE, ERR_INVALID_ENTRY_STATE, ERR_CHANNEL_INELIGIBLE_FOOD, ERR_ENTRY_SITE_MISMATCH, ERR_DONATION_WINDOW_EXPIRED, ERR_ALLOCATION_EXCEEDS_UNROUTED]

  - method: DELETE
    path: /consignment-lines/{id}
    purpose: Remove an allocation from a DRAFT consignment, restoring the entry's unrouted grams exactly.
    roles: [SiteSustainabilityManager, ShiftLead]
    input: []
    output: ConsignmentLine
    side_effects: ["deletes the line and recomputes the same derived fields as POST /consignment-lines; the conserved identity weight_grams == routed + unrouted is restored with zero drift"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_LINE_NOT_FOUND, ERR_SITE_SCOPE_VIOLATION, ERR_INVALID_CONSIGNMENT_STATE]

  - method: GET
    path: /consignment-lines/{id}
    purpose: Read one allocation line.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, HaulerOperator, CorporateSustainabilityLead, PlatformAdmin]
    input: []
    output: ConsignmentLine
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_LINE_NOT_FOUND]

  - method: GET
    path: /consignment-lines
    purpose: List allocation lines, filterable by consignment or by source capture.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, HaulerOperator, CorporateSustainabilityLead, PlatformAdmin]
    input: ["consignment_id?", "waste_entry_id?", "limit?", "offset?"]
    output: ConsignmentLine[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_INVALID_REQUEST, ERR_INVALID_PAGINATION]

  # ----- HaulerTicket -----------------------------------------------------
  - method: POST
    path: /hauler-tickets
    purpose: Submit a weigh ticket for a dispatched consignment and price the settlement.
    roles: [HaulerOperator]
    input: [consignment_id, ticket_number, gross_weight_grams, ticket_date, "hauler_id?"]
    output: HaulerTicket
    side_effects: ["runs the 7-step calculations.hauler_ticket_settlement; consignment settlement_status UNBILLED|DISPUTED -> TICKET_SUBMITTED"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_INVALID_REQUEST, ERR_CONSIGNMENT_NOT_FOUND, ERR_HAULER_NOT_FOUND, ERR_HAULER_SCOPE_VIOLATION, ERR_TICKET_HAULER_MISMATCH, ERR_INVALID_CONSIGNMENT_STATE, ERR_TICKET_ALREADY_SUBMITTED, ERR_DUPLICATE_TICKET_NUMBER]

  - method: POST
    path: /hauler-tickets/{id}/accept
    purpose: Accept a weigh ticket, settling the consignment and crediting the site's diversion.
    roles: [SiteSustainabilityManager]
    input: []
    output: HaulerTicket
    side_effects: ["state_machines.HaulerTicket.SUBMITTED_to_ACCEPTED — depth-3 cascade: settlement SETTLED + logistics COMPLETED -> Site.diverted_weight_grams_settled / diversion_rate_pct -> ACTIVE ReductionTarget.attainment_state re-evaluation"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_TICKET_NOT_FOUND, ERR_SITE_SCOPE_VIOLATION, ERR_INVALID_TICKET_STATE, ERR_INVALID_CONSIGNMENT_STATE]

  - method: POST
    path: /hauler-tickets/{id}/dispute
    purpose: Dispute a weigh ticket, returning the settlement dimension to DISPUTED so a replacement may be filed.
    roles: [SiteSustainabilityManager]
    input: [dispute_note]
    output: HaulerTicket
    side_effects: ["state_machines.HaulerTicket.SUBMITTED_to_DISPUTED; consignment settlement_status := DISPUTED with logistics_status unchanged"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_INVALID_REQUEST, ERR_TICKET_NOT_FOUND, ERR_SITE_SCOPE_VIOLATION, ERR_INVALID_TICKET_STATE]

  - method: GET
    path: /hauler-tickets/{id}
    purpose: Read one weigh ticket with its full settlement breakdown.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, HaulerOperator, CorporateSustainabilityLead, PlatformAdmin]
    input: []
    output: HaulerTicket
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_TICKET_NOT_FOUND]

  - method: GET
    path: /hauler-tickets
    purpose: List weigh tickets, filterable by consignment or hauler.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, HaulerOperator, CorporateSustainabilityLead, PlatformAdmin]
    input: ["consignment_id?", "hauler_id?", "status?", "ticket_date?", "limit?", "offset?"]
    output: HaulerTicket[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_INVALID_REQUEST, ERR_INVALID_PAGINATION]

  # ----- CoachingAlert ----------------------------------------------------
  - method: POST
    path: /coaching-alerts/{id}/acknowledge
    purpose: Kitchen staff acknowledges a coaching alert at the station terminal.
    roles: [KitchenStaff, ShiftLead]
    input: []
    output: CoachingAlert
    side_effects: ["state_machines.CoachingAlert.OPEN_to_ACKNOWLEDGED; Site.open_alert_count deliberately does NOT change"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ALERT_NOT_FOUND, ERR_INVALID_ALERT_STATE]

  - method: POST
    path: /coaching-alerts/{id}/resolve
    purpose: Shift lead resolves an acknowledged alert, lowering the site's open alert count and posture.
    roles: [ShiftLead]
    input: [resolution_note]
    output: CoachingAlert
    side_effects: ["state_machines.CoachingAlert.ACKNOWLEDGED_to_RESOLVED; decrements Site.open_alert_count and recomputes Site.coaching_posture"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ALERT_NOT_FOUND, ERR_INVALID_ALERT_STATE]

  - method: GET
    path: /coaching-alerts/{id}
    purpose: Read one coaching alert.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, CorporateSustainabilityLead, PlatformAdmin]
    input: []
    output: CoachingAlert
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ALERT_NOT_FOUND]

  - method: GET
    path: /coaching-alerts
    purpose: List coaching alerts, filterable by site, shift and triggering capture.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, CorporateSustainabilityLead, PlatformAdmin]
    input: ["site_id?", "shift_id?", "waste_entry_id?", "status?", "alert_type?", "severity?", "limit?", "offset?"]
    output: CoachingAlert[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_PAGINATION]

  # ----- DataQualityFinding -----------------------------------------------
  - method: POST
    path: /data-quality-scans
    purpose: Run the missed / duplicated / outlier capture scan for one site and date and materialise its findings.
    roles: [SiteSustainabilityManager, PlatformAdmin]
    input: [site_id, scan_date]
    output: DataQualityFinding[]
    side_effects: ["creates DataQualityFinding rows in the pinned order MISSED_CAPTURE -> DUPLICATE_ENTRY -> WEIGHT_OUTLIER (calculations.data_quality_scan); re-running is idempotent against still-OPEN findings"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_INVALID_REQUEST, ERR_SITE_NOT_FOUND, ERR_SITE_SCOPE_VIOLATION]

  - method: POST
    path: /data-quality-findings/{id}/resolve
    purpose: Confirm or dismiss a data-quality finding so it stops blocking corporate publication.
    roles: [SiteSustainabilityManager]
    input: [resolution, "resolution_note?"]
    output: DataQualityFinding
    side_effects: ["state_machines.DataQualityFinding.OPEN_to_CONFIRMED or OPEN_to_DISMISSED depending on resolution"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_INVALID_REQUEST, ERR_FINDING_NOT_FOUND, ERR_SITE_SCOPE_VIOLATION, ERR_INVALID_FINDING_STATE]

  - method: GET
    path: /data-quality-findings/{id}
    purpose: Read one data-quality finding.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, CorporateSustainabilityLead, PlatformAdmin]
    input: []
    output: DataQualityFinding
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_FINDING_NOT_FOUND]

  - method: GET
    path: /data-quality-findings
    purpose: List data-quality findings, filterable by site, station, shift and offending capture.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, CorporateSustainabilityLead, PlatformAdmin]
    input: ["site_id?", "waste_entry_id?", "station_id?", "shift_id?", "finding_type?", "status?", "limit?", "offset?"]
    output: DataQualityFinding[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_PAGINATION]

  # ----- CorporateRollup --------------------------------------------------
  - method: POST
    path: /corporate-rollups
    purpose: Prepare a DRAFT sustainability rollup across an explicit set of sites.
    roles: [CorporateSustainabilityLead]
    input: [period_start, period_end, site_ids]
    output: CorporateRollup
    side_effects: ["computes calculations.corporate_rollup_metrics; prepared_by_user_id := X-User-ID (the segregation-of-duties comparison target for publish)"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_SITE_NOT_FOUND, ERR_DUPLICATE_SITE_IN_SCOPE]

  - method: POST
    path: /corporate-rollups/{id}/publish
    purpose: Publish a rollup, freezing its metrics; blocked by open data-quality findings and by self-approval.
    roles: [CorporateSustainabilityLead]
    input: []
    output: CorporateRollup
    side_effects: ["state_machines.CorporateRollup.DRAFT_to_PUBLISHED — final recompute then published_metrics snapshot"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ROLLUP_NOT_FOUND, ERR_ROLLUP_ALREADY_PUBLISHED, ERR_SEGREGATION_OF_DUTIES, ERR_ROLLUP_DATA_QUALITY_BLOCKED]

  - method: GET
    path: /corporate-rollups/{id}
    purpose: Read one rollup with its live or frozen metrics.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, CorporateSustainabilityLead, PlatformAdmin]
    input: []
    output: CorporateRollup
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ROLLUP_NOT_FOUND]

  - method: GET
    path: /corporate-rollups
    purpose: List corporate rollups.
    roles: [KitchenStaff, ShiftLead, SiteSustainabilityManager, CorporateSustainabilityLead, PlatformAdmin]
    input: ["status?", "goal_attainment_state?", "limit?", "offset?"]
    output: CorporateRollup[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_PAGINATION]

  # ----- Logical clock ----------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    purpose: "Set the server's logical clock. MANDATORY default at process start: 2026-08-01T00:00:00Z. This is the ONLY operation that can resolve an ACTIVE ReductionTarget to ACHIEVED or MISSED."
    roles: ["*"]
    input: [current_utc]
    output: "{ current_utc: string, reevaluated_target_ids: string[], resolved_target_ids: string[] }"
    side_effects: ["for every ReductionTarget with status == ACTIVE whose window_end + 1 day at 00:00:00.000Z is <= the new clock, processed in created_at ASC order: recompute calculations.reduction_attainment and route to ACHIEVED (attainment_state ACHIEVED_PENDING) or MISSED (BEHIND)"]
    errors: [ERR_INVALID_REQUEST, ERR_CLOCK_NOT_MONOTONIC]

# ---------------------------------------------------------------------------
# 1.6 Error Catalog
# ---------------------------------------------------------------------------
errors:
  # --- auth / identity / schema ------------------------------------------
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    when: "X-User-Role header missing or not one of the six declared roles, or X-User-ID missing on a role-restricted endpoint."
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    category: auth
    when: "The caller's role is not listed in the endpoint's roles."
  - error_id: ERR_IDENTITY_NOT_RECOGNIZED
    http_status: 403
    category: auth
    when: "An entity_backed role's X-User-ID does not resolve to a row of its backing entity (Site for SiteSustainabilityManager, Hauler for HaulerOperator)."
  - error_id: ERR_SITE_SCOPE_VIOLATION
    http_status: 403
    category: auth
    when: "A SiteSustainabilityManager acts on a row whose site_id differs from their X-User-ID."
  - error_id: ERR_HAULER_SCOPE_VIOLATION
    http_status: 403
    category: auth
    when: "A HaulerOperator acts on a consignment or ticket whose hauler_id differs from their X-User-ID."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    category: auth
    when: "A ShiftLead voids an entry they themselves captured, or a CorporateSustainabilityLead publishes a rollup they themselves prepared."
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    category: schema
    when: "Malformed body, missing required field, wrong type, unknown enum member, negative where non-negative is required, bad date/timestamp format, or a violated declared range (start > end, empty ingredients, empty site_ids, pickup_window_end <= pickup_window_start)."
  - error_id: ERR_INVALID_PAGINATION
    http_status: 400
    category: schema
    when: "limit outside [1, 200] or offset < 0 on a list endpoint."

  # --- existence (one per entity) ----------------------------------------
  - error_id: ERR_SITE_NOT_FOUND
    http_status: 404
    category: existence
    when: "A Site id in the path, body, or site_ids array does not exist."
  - error_id: ERR_STATION_NOT_FOUND
    http_status: 404
    category: existence
    when: "A TrackingStation id does not exist."
  - error_id: ERR_FOOD_TYPE_NOT_FOUND
    http_status: 404
    category: existence
    when: "A FoodType id does not exist."
  - error_id: ERR_RECIPE_NOT_FOUND
    http_status: 404
    category: existence
    when: "A Recipe id does not exist."
  - error_id: ERR_SHIFT_NOT_FOUND
    http_status: 404
    category: existence
    when: "A Shift id does not exist."
  - error_id: ERR_ENTRY_NOT_FOUND
    http_status: 404
    category: existence
    when: "A WasteEntry id does not exist."
  - error_id: ERR_BASELINE_NOT_FOUND
    http_status: 404
    category: existence
    when: "A BaselinePeriod id does not exist."
  - error_id: ERR_TARGET_NOT_FOUND
    http_status: 404
    category: existence
    when: "A ReductionTarget id does not exist."
  - error_id: ERR_HAULER_NOT_FOUND
    http_status: 404
    category: existence
    when: "A Hauler id does not exist."
  - error_id: ERR_CONSIGNMENT_NOT_FOUND
    http_status: 404
    category: existence
    when: "A DiversionConsignment id does not exist."
  - error_id: ERR_LINE_NOT_FOUND
    http_status: 404
    category: existence
    when: "A ConsignmentLine id does not exist."
  - error_id: ERR_TICKET_NOT_FOUND
    http_status: 404
    category: existence
    when: "A HaulerTicket id does not exist."
  - error_id: ERR_ALERT_NOT_FOUND
    http_status: 404
    category: existence
    when: "A CoachingAlert id does not exist."
  - error_id: ERR_FINDING_NOT_FOUND
    http_status: 404
    category: existence
    when: "A DataQualityFinding id does not exist."
  - error_id: ERR_ROLLUP_NOT_FOUND
    http_status: 404
    category: existence
    when: "A CorporateRollup id does not exist."

  # --- optimistic concurrency (§1.2.1) -----------------------------------
  - error_id: ERR_STALE_ENTRY_VERSION
    http_status: 412
    category: concurrency
    when: "expected_entry_version on POST /waste-entries/{id}/corrections does not equal the entry's current version."
  - error_id: ERR_STALE_SITE_VERSION
    http_status: 412
    category: concurrency
    when: "expected_site_version on POST /reduction-targets does not equal the site's current version."

  # --- target-state guards ------------------------------------------------
  - error_id: ERR_INVALID_RECIPE_STATE
    http_status: 409
    category: state
    when: "Publishing a Recipe that is not DRAFT."
  - error_id: ERR_INVALID_STATION_STATE
    http_status: 409
    category: state
    when: "A station status transition that is not declared in §1.2 (e.g. RETIRED -> ACTIVE, or ACTIVE -> ACTIVE)."
  - error_id: ERR_INVALID_HAULER_STATE
    http_status: 409
    category: state
    when: "Approving a Hauler that is already APPROVED."
  - error_id: ERR_INVALID_SHIFT_STATE
    http_status: 409
    category: state
    when: "Closing a CLOSED shift, or capturing / correcting against a shift that is not OPEN."
  - error_id: ERR_INVALID_ENTRY_STATE
    http_status: 409
    category: state
    when: "Flagging a non-RECORDED entry, clearing a flag on a non-FLAGGED entry, voiding or correcting an entry that is VOIDED or SUPERSEDED, or routing a VOIDED/SUPERSEDED entry onto a consignment."
  - error_id: ERR_INVALID_BASELINE_STATE
    http_status: 409
    category: state
    when: "Submitting a non-OPEN period, or certifying/rejecting a period that is not SUBMITTED."
  - error_id: ERR_INVALID_TARGET_STATE
    http_status: 409
    category: state
    when: "Activating a target that is not PROPOSED."
  - error_id: ERR_INVALID_CONSIGNMENT_STATE
    http_status: 409
    category: state
    when: "A logistics or settlement transition not declared in §1.2: staging a non-DRAFT consignment, dispatching a non-STAGED one, adding or deleting a line once the consignment has left DRAFT, cancelling a SETTLED or already CANCELLED consignment, or submitting/accepting a ticket while logistics_status != DISPATCHED."
  - error_id: ERR_INVALID_TICKET_STATE
    http_status: 409
    category: state
    when: "Accepting or disputing a HaulerTicket that is not SUBMITTED."
  - error_id: ERR_INVALID_ALERT_STATE
    http_status: 409
    category: state
    when: "Acknowledging a non-OPEN alert, or resolving an alert that is not ACKNOWLEDGED."
  - error_id: ERR_INVALID_FINDING_STATE
    http_status: 409
    category: state
    when: "Resolving a DataQualityFinding that is not OPEN."
  - error_id: ERR_ROLLUP_ALREADY_PUBLISHED
    http_status: 409
    category: state
    when: "Publishing a CorporateRollup that is already PUBLISHED."
  - error_id: ERR_ENTRY_ROUTED_CANNOT_VOID
    http_status: 409
    category: state
    when: "Voiding or correcting a WasteEntry whose routed_weight_grams > 0; the routed grams must be released first."

  # --- cross-entity state dependencies -----------------------------------
  - error_id: ERR_STATION_NOT_ACTIVE
    http_status: 409
    category: business_state
    when: "Capturing at a TrackingStation whose status is MAINTENANCE or RETIRED."
  - error_id: ERR_STATION_CALIBRATION_OVERDUE
    http_status: 409
    category: business_state
    when: "Capturing when the logical clock has reached the station's calibration_due_at."
  - error_id: ERR_RECIPE_NOT_PUBLISHED
    http_status: 409
    category: business_state
    when: "A capture supplies a recipe_id whose Recipe.status is DRAFT."
  - error_id: ERR_BASELINE_NOT_CERTIFIED
    http_status: 409
    category: business_state
    when: "Activating a ReductionTarget whose bound BaselinePeriod is OPEN or SUBMITTED rather than CERTIFIED."
  - error_id: ERR_HAULER_NOT_APPROVED
    http_status: 409
    category: business_state
    when: "Dispatching a consignment to a Hauler still in PENDING."

  # --- safety / referential / temporal / overlap --------------------------
  - error_id: ERR_CHANNEL_INELIGIBLE_FOOD
    http_status: 422
    category: business_safety
    when: "Routing a food type to a channel it is not eligible for: DONATION requires donation_eligible AND stream == PRE_CONSUMER; ANIMAL_FEED requires animal_feed_eligible."
  - error_id: ERR_SITE_POSTURE_BLOCKS_DONATION
    http_status: 422
    category: business_safety
    when: "Staging or dispatching a DONATION consignment while Site.coaching_posture is ESCALATED."
  - error_id: ERR_ENTRY_SITE_MISMATCH
    http_status: 409
    category: business_referential
    when: "A capture's shift and station belong to different sites, a ConsignmentLine's entry belongs to a different site than the consignment, or a correction targets an entry on a different shift/station."
  - error_id: ERR_TICKET_HAULER_MISMATCH
    http_status: 409
    category: business_referential
    when: "The submitting HaulerOperator's hauler is not the consignment's hauler."
  - error_id: ERR_DUPLICATE_SITE_IN_SCOPE
    http_status: 409
    category: business_referential
    when: "A CorporateRollup's site_ids array contains the same Site id more than once."
  - error_id: ERR_HAULER_CHANNEL_UNSUPPORTED
    http_status: 422
    category: business_referential
    when: "The consignment's channel is not listed in Hauler.channels."
  - error_id: ERR_CAPTURE_IN_FUTURE
    http_status: 422
    category: business_temporal
    when: "captured_at is strictly after the current logical clock."
  - error_id: ERR_CAPTURE_OUTSIDE_SHIFT_DATE
    http_status: 422
    category: business_temporal
    when: "date(captured_at) differs from the referenced Shift.shift_date."
  - error_id: ERR_DONATION_WINDOW_EXPIRED
    http_status: 422
    category: business_temporal
    when: "On a DONATION consignment, pickup_window_start is strictly after entry.captured_at + FoodType.donation_shelf_life_hours."
  - error_id: ERR_TARGET_WINDOW_BEFORE_BASELINE
    http_status: 422
    category: business_temporal
    when: "A ReductionTarget's window_start is not strictly after its BaselinePeriod.end_date."
  - error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    category: business_temporal
    when: "The requested current_utc is not strictly greater than the stored logical clock."
  - error_id: ERR_STATION_OCCUPIED
    http_status: 409
    category: business_overlap
    when: "A capture's captured_at falls inside the closed interval [captured_at, captured_at + capture_lock_seconds + 60] of an existing RECORDED/FLAGGED entry at the same station; both endpoints are inclusive."
  - error_id: ERR_BASELINE_WINDOW_OVERLAP
    http_status: 409
    category: business_overlap
    when: "A new BaselinePeriod's inclusive [start_date, end_date] interval intersects an existing period of the same site."
  - error_id: ERR_HAULER_WINDOW_CAPACITY
    http_status: 409
    category: business_overlap
    when: "The hauler already has max_concurrent_pickups non-terminal consignments whose half-open [pickup_window_start, pickup_window_end) intervals intersect the requested one."

  # --- constraint / fiscal / uniqueness ----------------------------------
  - error_id: ERR_ALLOCATION_EXCEEDS_UNROUTED
    http_status: 422
    category: business_constraint
    when: "allocated_weight_grams exceeds the target WasteEntry.unrouted_weight_grams."
  - error_id: ERR_HAULER_CAPACITY_EXCEEDED
    http_status: 422
    category: business_fiscal
    when: "The consignment's staged_weight_grams exceeds Hauler.capacity_kg_per_pickup * 1000 at stage time."
  - error_id: ERR_ROLLUP_DATA_QUALITY_BLOCKED
    http_status: 409
    category: business_constraint
    when: "Publishing a rollup while any in-scope site holds a DataQualityFinding with status == OPEN."
  - error_id: ERR_BASELINE_NO_DATA
    http_status: 422
    category: business_constraint
    when: "Submitting a BaselinePeriod whose window contains zero RECORDED/FLAGGED entries, or certifying one whose baseline_meals_served is 0."
  - error_id: ERR_CONSIGNMENT_EMPTY
    http_status: 422
    category: business_constraint
    when: "Staging a DiversionConsignment with line_count == 0."
  - error_id: ERR_LOSS_REASON_STATION_MISMATCH
    http_status: 422
    category: business_constraint
    when: "PLATE_WASTE captured at a non-DISH_RETURN station, or TRIM / OVERPRODUCTION / SPOILAGE captured at a DISH_RETURN station."
  - error_id: ERR_DUPLICATE_SITE_CODE
    http_status: 409
    category: business_uniqueness
    when: "site_code already exists."
  - error_id: ERR_DUPLICATE_STATION_CODE
    http_status: 409
    category: business_uniqueness
    when: "(site_id, station_code) already exists."
  - error_id: ERR_DUPLICATE_FOOD_TYPE_NAME
    http_status: 409
    category: business_uniqueness
    when: "FoodType.name already exists."
  - error_id: ERR_DUPLICATE_RECIPE_CODE
    http_status: 409
    category: business_uniqueness
    when: "recipe_code already exists."
  - error_id: ERR_DUPLICATE_HAULER_NAME
    http_status: 409
    category: business_uniqueness
    when: "Hauler.name already exists."
  - error_id: ERR_DUPLICATE_SHIFT
    http_status: 409
    category: business_uniqueness
    when: "(site_id, shift_date, shift_code) already exists."
  - error_id: ERR_DUPLICATE_TICKET_NUMBER
    http_status: 409
    category: business_uniqueness
    when: "(hauler_id, ticket_number) already exists."
  - error_id: ERR_TICKET_ALREADY_SUBMITTED
    http_status: 409
    category: business_uniqueness
    when: "The consignment already carries a HaulerTicket whose status is SUBMITTED or ACCEPTED."
  - error_id: ERR_ENTRY_ALREADY_CORRECTED
    http_status: 409
    category: business_uniqueness
    when: "A correcting entry already exists with corrects_entry_id equal to this entry's id."

# ---------------------------------------------------------------------------
# 1.7 RBAC Table   (role_model: segregation_of_duties)
#   Headers: X-User-Role selects the role; X-User-ID is the acting identity.
#   `identity: opaque`             -> X-User-ID is any non-empty string, used only
#                                     for duty-separation comparisons and audit stamps.
#   `identity: entity_backed:<E>`  -> X-User-ID MUST equal an existing <E>.id,
#                                     otherwise ERR_IDENTITY_NOT_RECOGNIZED (403).
# ---------------------------------------------------------------------------
roles:
  - name: KitchenStaff
    identity: opaque
    description: Line cook or prep cook at a station terminal. Captures losses and acknowledges the coaching alerts raised against their shift.
    exclusive_operations: []
    shared_operations:
      - "POST /waste-entries"
      - "POST /coaching-alerts/{id}/acknowledge"
      - "every GET in §1.5 except the hauler-scoped reads"
    cannot:
      - "POST /waste-entries/{id}/flag, /clear-flag, /void, /corrections (ShiftLead and above)"
      - "POST /shifts and POST /shifts/{id}/close"
      - "any consignment, ticket, baseline, target, rollup or scan write"

  - name: ShiftLead
    identity: opaque
    description: Supervises one service period. Opens and closes shifts, curates the capture record (flag / clear-flag / void / correct) and resolves acknowledged alerts. Their X-User-ID is the left-hand side of the void duty separation.
    exclusive_operations:
      - "POST /shifts/{id}/close"
      - "POST /waste-entries/{id}/flag"
      - "POST /waste-entries/{id}/clear-flag"
      - "POST /waste-entries/{id}/void"
      - "POST /waste-entries/{id}/corrections"
      - "POST /coaching-alerts/{id}/resolve"
    shared_operations:
      - "POST /shifts (with SiteSustainabilityManager)"
      - "POST /waste-entries (with KitchenStaff)"
      - "POST /coaching-alerts/{id}/acknowledge (with KitchenStaff)"
      - "POST /consignment-lines and DELETE /consignment-lines/{id} (with SiteSustainabilityManager)"
      - "every GET in §1.5"
    cannot:
      - "POST /waste-entries/{id}/void on an entry whose captured_by_user_id equals their own X-User-ID -> ERR_SEGREGATION_OF_DUTIES (403)"
      - "stage, dispatch or cancel a consignment"
      - "submit, accept or dispute a hauler ticket"
      - "any baseline, target, rollup, scan or catalog write"

  - name: SiteSustainabilityManager
    identity: "entity_backed:Site"
    description: Owns one site. X-User-ID MUST be that Site's id, and every write is scoped to rows carrying that site_id (ERR_SITE_SCOPE_VIOLATION otherwise). Runs baselines, diversion logistics, data-quality scans and ticket review for their own site only.
    exclusive_operations:
      - "POST /baseline-periods"
      - "POST /baseline-periods/{id}/submit"
      - "POST /diversion-consignments"
      - "POST /diversion-consignments/{id}/stage"
      - "POST /diversion-consignments/{id}/cancel"
      - "POST /hauler-tickets/{id}/accept"
      - "POST /hauler-tickets/{id}/dispute"
      - "POST /data-quality-findings/{id}/resolve"
    shared_operations:
      - "POST /tracking-stations and POST /tracking-stations/{id}/status (with PlatformAdmin)"
      - "POST /shifts (with ShiftLead)"
      - "POST /consignment-lines and DELETE /consignment-lines/{id} (with ShiftLead)"
      - "POST /diversion-consignments/{id}/dispatch (with HaulerOperator)"
      - "POST /data-quality-scans (with PlatformAdmin)"
      - "every GET in §1.5"
    cannot:
      - "act on any row whose site_id differs from their X-User-ID -> ERR_SITE_SCOPE_VIOLATION (403)"
      - "certify or reject a baseline period (CorporateSustainabilityLead)"
      - "create or activate a reduction target"
      - "approve a hauler, or create/publish a corporate rollup"
      - "submit a hauler ticket (HaulerOperator)"
      - "close a shift or void an entry (ShiftLead)"

  - name: HaulerOperator
    identity: "entity_backed:Hauler"
    description: Driver or dispatcher of a contracted hauler. X-User-ID MUST be that Hauler's id. Files weigh tickets for consignments assigned to them and may mark a staged consignment dispatched on pickup.
    exclusive_operations:
      - "POST /hauler-tickets"
    shared_operations:
      - "POST /diversion-consignments/{id}/dispatch (with SiteSustainabilityManager)"
      - "GET /haulers, GET /haulers/{id}, GET /diversion-consignments, GET /diversion-consignments/{id}, GET /consignment-lines, GET /consignment-lines/{id}, GET /hauler-tickets, GET /hauler-tickets/{id}"
    cannot:
      - "act on a consignment or ticket whose hauler_id differs from their X-User-ID -> ERR_HAULER_SCOPE_VIOLATION (403)"
      - "accept or dispute their own ticket (SiteSustainabilityManager reviews it)"
      - "read waste captures, shifts, baselines, targets, alerts, findings or rollups"
      - "create, stage or cancel a consignment"

  - name: CorporateSustainabilityLead
    identity: opaque
    description: Corporate sustainability reviewer. Certifies baselines, sets and activates reduction targets, approves haulers, and prepares/publishes rollups. Their X-User-ID is the left-hand side of the rollup publication duty separation.
    exclusive_operations:
      - "POST /baseline-periods/{id}/certify"
      - "POST /baseline-periods/{id}/reject"
      - "POST /reduction-targets"
      - "POST /reduction-targets/{id}/activate"
      - "POST /haulers/{id}/approve"
      - "POST /corporate-rollups"
      - "POST /corporate-rollups/{id}/publish"
    shared_operations:
      - "every GET in §1.5 except the hauler-scoped reads"
    cannot:
      - "POST /corporate-rollups/{id}/publish on a rollup whose prepared_by_user_id equals their own X-User-ID -> ERR_SEGREGATION_OF_DUTIES (403); a second CorporateSustainabilityLead identity must publish it"
      - "capture, flag, void or correct a waste entry"
      - "open or close a shift"
      - "create, stage, dispatch or cancel a consignment, or accept a ticket"
      - "open or submit a baseline period (that is the site's own duty)"

  - name: PlatformAdmin
    identity: opaque
    description: Platform operator maintaining the shared catalog (sites, food types, recipes, haulers, stations). Deliberately holds NO operational authority over captures, baselines, targets, settlements or rollups, so admin rights cannot be used to bypass either duty separation.
    exclusive_operations:
      - "POST /sites"
      - "POST /food-types"
      - "POST /recipes"
      - "POST /recipes/{id}/publish"
      - "POST /haulers"
    shared_operations:
      - "POST /tracking-stations and POST /tracking-stations/{id}/status (with SiteSustainabilityManager)"
      - "POST /data-quality-scans (with SiteSustainabilityManager)"
      - "every GET in §1.5 except the hauler-scoped reads"
    cannot:
      - "capture, flag, void or correct a waste entry"
      - "open or close a shift"
      - "any baseline, reduction-target, consignment, ticket, alert, finding-resolution or rollup write"

rbac_notes:
  - "Segregation of duties is enforced on X-User-ID, never on role: the two blocked pairs are (capture, void) on WasteEntry and (prepare, publish) on CorporateRollup. Both are checked at validation priority 70, i.e. AFTER target-state (60) and cross-entity-state (65) but BEFORE every business rule."
  - "No role is a superset of another. PlatformAdmin cannot void an entry and CorporateSustainabilityLead cannot open a baseline period, so neither can be used as an escape hatch around the duty separations."
  - "POST /_clock/set_current_utc accepts roles ['*'] and requires no identity headers; it is test-driving infrastructure, not a business operation."
