  - rule_id: compensating_invariant
    instances:
      - name: invoice_line_void_restores_every_invoice_money_field
        grounds:
          - conservation_invariants[invoice-line-sum-conservation]
          - calculations.invoice_total
          - calculations.invoice_line_tax
          - state_machines.Invoice.DRAFT_to_ISSUED
          - entities.InvoiceLine.fields.status
        distinguishing_aspect: |
          Conserved quantity 1: MONEY on one Invoice. Adding a 5000-cent FALSE_ALARM_FEE line
          moves gross_service_cents 19986 -> 24986, tax 1399 -> 1749 and total 21385 -> 26735;
          voiding that same line returns all three to exactly their pre-add values, so the
          forward action and its compensating action leave the invoice ledger with zero drift.
        test_recipe:
          setup:
            - "An ACTIVE STANDARD subscription whose OPEN cycle carries prorated_fee_cents 19986."
            - "A DRAFT Invoice seeded with the SUBSCRIPTION_FEE line of 19986, tax 1399, total 21385."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Vic Snowbird", email: "vic@example.com", phone: "+15550120", primary_residence_state: "GA" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Ledger Lodge", address_line: "7 Balance Blvd", state_code: "FL", travel_distance_miles: 18.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
              captures: { cycle_id: $.data.current_cycle_id }
            - call: "POST /property-care/billing-cycles/${cycle_id}/invoices"
              payload: {}
              as: AccountManager
              captures: { inv_id: $.data.id, gross_before: $.data.gross_service_cents, tax_before: $.data.tax_cents, total_before: $.data.total_cents }
            - call: "POST /property-care/invoices/${inv_id}/lines"
              payload: { line_type: "FALSE_ALARM_FEE", description: "Municipal false alarm 2", amount_cents: 5000, taxable: true }
              as: AccountManager
              captures: { fa_line_id: $.data.id }
          trigger:
            - call: "POST /property-care/invoice-lines/${fa_line_id}/void"
              payload: {}
              as: AccountManager
          assert:
            - "immediately after the add, Invoice.${inv_id}.gross_service_cents == 24986, tax_cents == 1749 and total_cents == 26735"
            - "after the void, InvoiceLine.${fa_line_id}.status == VOID and InvoiceLine.${fa_line_id}.tax_cents == 0"
            - "after the void, Invoice.${inv_id}.gross_service_cents == 19986"
            - "after the void, Invoice.${inv_id}.tax_cents == 1399"
            - "after the void, Invoice.${inv_id}.total_cents == 21385"
            - "after the void, Invoice.${inv_id}.balance_due_cents == 21385"

      - name: key_issuance_return_restores_physical_copy_ledger
        grounds:
          - conservation_invariants[key-copy-conservation]
          - calculations.key_copy_ledger
          - state_machines.KeyIssuance.ISSUED_to_RETURNED
          - entities.KeyAsset.fields.copies_on_hand
          - entities.KeyAsset.fields.copies_issued_outstanding
        distinguishing_aspect: |
          Conserved quantity 2: PHYSICAL COPIES of one KeyAsset, a different type of quantity
          from invoice money. copies_total stays 3 while the split moves 3/0/0 -> 1/2/0 on
          issuance and back to 3/0/0 on return, and the identity
          copies_total == copies_on_hand + copies_issued_outstanding + copies_lost holds at
          every one of the three observations.
        test_recipe:
          setup:
            - "A Z2 Property with a PHYSICAL KeyAsset of copies_total 3."
            - "An ELIGIBLE LOCKSMITH vendor rated 4.2."
            - "The logical clock at 2026-06-11T09:00:00Z, so a PHYSICAL issuance carries a 48-hour return deadline of 2026-06-13T09:00:00Z."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Wes Snowbird", email: "wes@example.com", phone: "+15550121", primary_residence_state: "TN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Key Ledger Cottage", address_line: "3 Copy Ct", state_code: "FL", travel_distance_miles: 8.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/vendors"
              payload: { legal_name: "Harbor Locksmiths", trade: "LOCKSMITH", coi_expires_at: "2027-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 7000, rating: 4.2 }
              as: Dispatcher
              captures: { vendor_id: $.data.id }
            - call: "POST /property-care/vendors/${vendor_id}/reinstate"
              payload: {}
              as: Dispatcher
            - call: "POST /property-care/properties/${prop_id}/key-assets"
              payload: { key_type: "PHYSICAL", label: "House keys", copies_total: 3 }
              as: Dispatcher
              captures: { ka_id: $.data.id, on_hand_before: $.data.copies_on_hand }
            - call: "POST /property-care/key-assets/${ka_id}/issuances"
              payload: { vendor_id: "${vendor_id}", copies_issued: 2 }
              as: Dispatcher
              captures: { ki_id: $.data.id, deadline: $.data.return_deadline_at }
          trigger:
            - call: "POST /property-care/key-issuances/${ki_id}/return"
              payload: {}
              as: Dispatcher
          assert:
            - "before the issuance KeyAsset.${ka_id}.copies_on_hand == 3, copies_issued_outstanding == 0, copies_lost == 0"
            - "after the issuance KeyAsset.${ka_id}.copies_on_hand == 1, copies_issued_outstanding == 2, copies_lost == 0"
            - "KeyIssuance.${ki_id}.return_deadline_at == 2026-06-13T09:00:00.000Z"
            - "after the return KeyIssuance.${ki_id}.status == RETURNED"
            - "after the return KeyAsset.${ka_id}.copies_on_hand == 3, copies_issued_outstanding == 0, copies_lost == 0"
            - "Vendor.${vendor_id}.outstanding_key_count == 0"
            - "at all three observations KeyAsset.${ka_id}.copies_total == 3 equals the sum of the three components"

      - name: entitlement_rollover_carry_out_equals_next_cycle_carry_in
        grounds:
          - conservation_invariants[entitlement-rollover-conservation]
          - calculations.entitlement_rollover
          - state_machines.BillingCycle.CLOSING_to_CLOSED
          - entities.BillingCycle.fields.entitlement_carried_out_units
          - entities.BillingCycle.fields.entitlement_expired_units
        distinguishing_aspect: |
          Conserved quantity 3: ENTITLEMENT UNITS, a non-money non-physical quantity. A
          CARRY_CAPPED plan granting 3 units with none consumed closes to
          carried_out = min(3, 2) = 2 and expired = 1, satisfying remaining == carried_out +
          expired, and the next cycle opens with carried_in exactly 2 and remaining 5, so no
          unit is created or destroyed outside the declared cap.
        test_recipe:
          setup:
            - "A CARRY_CAPPED plan granting 3 included visit units per cycle."
            - "A subscription activated on 2026-06-01T00:00:00Z with cycle 1 OPEN, 3 granted, 0 consumed, 3 remaining."
            - "No visits are completed, so the cycle closes with its full remainder intact."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Xan Snowbird", email: "xan@example.com", phone: "+15550122", primary_residence_state: "KY" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Rollover Ranch", address_line: "2 Carry Cir", state_code: "FL", travel_distance_miles: 8.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 9986, included_visit_units: 3, covered_visit_types: ["ROUTINE_WATCH"], entitlement_rollover_policy: "CARRY_CAPPED" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
              captures: { cycle1_id: $.data.current_cycle_id }
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/billing-cycles/${cycle1_id}/close"
              payload: {}
              as: AccountManager
              captures: { carried_out: $.data.entitlement_carried_out_units, expired: $.data.entitlement_expired_units }
          trigger:
            - call: "POST /property-care/subscriptions/${sub_id}/billing-cycles"
              payload: { period_start: "2026-07-01T00:00:00Z" }
              as: AccountManager
              captures: { cycle2_id: $.data.id, carried_in: $.data.entitlement_carried_in_units }
          assert:
            - "BillingCycle.${cycle1_id}.status == CLOSED"
            - "BillingCycle.${cycle1_id}.entitlement_granted_units == 3 and entitlement_consumed_units == 0 and entitlement_remaining_units == 3"
            - "BillingCycle.${cycle1_id}.entitlement_carried_out_units == 2"
            - "BillingCycle.${cycle1_id}.entitlement_expired_units == 1"
            - "BillingCycle.${cycle2_id}.cycle_index == 2"
            - "BillingCycle.${cycle2_id}.entitlement_carried_in_units == 2"
            - "BillingCycle.${cycle2_id}.entitlement_granted_units == 3"
            - "BillingCycle.${cycle2_id}.entitlement_remaining_units == 5"
