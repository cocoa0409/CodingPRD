            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T00:00:00Z" }, as: IntegratorAdmin }
          trigger:
            - { call: "POST /pig-groups/${group_id}/mortality-reports", payload: { report_date: "2026-03-10", mortality_count: 0, cull_count: 0, reason_code: "OTHER" }, as: Grower, as_user_id: "${grower_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /pig-groups/${group_id}/mortality-reports", payload: { report_date: "2026-03-11", mortality_count: 2, cull_count: 0, reason_code: "OTHER" }, as: Grower, as_user_id: "${grower_id}", captures: { err2: $.data.error_id } }
          assert:
            - "Zero report -> 409 ERR_EMPTY_REPORT (${err1})"
            - "Future-dated report (2026-03-11 > clock 2026-03-10) -> 409 ERR_REPORT_DATE_OUT_OF_RANGE (${err2})"
            - "Group aggregates unchanged: mortality_total == 0, head_current == 500"

      - name: cross_site_reference_rejected
        claim_type: violation_to_error
        grounds: [ "validations[priority=10]", "errors[ERR_CROSS_SITE_REFERENCE]"]
        distinguishing_aspect: "Group creation with a barn on site S2 under a contract for site S1 -> 409 ERR_CROSS_SITE_REFERENCE (referential check, priority 10)."
        test_recipe:
          setup: ["sites S1/S2; contract ACTIVE on S1; barn on S2"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S1", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site1: $.data.id } }
            - { call: "POST /sites", payload: { name: "S2", state_code: "IA", county: "Lyon" }, as: IntegratorAdmin, captures: { site2: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site1}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site2}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
          trigger:
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 100, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; error_id == ERR_CROSS_SITE_REFERENCE (${err})"

      - name: head_count_exceeded_rejected
        claim_type: violation_to_error
        grounds: [ calculations.group_head_reconciliation, "errors[ERR_HEAD_COUNT_EXCEEDED]"]
        distinguishing_aspect: "Head conservation enforced at reporting: cumulative 480 + new 30 = 510 > 500 placed -> 409; at exactly 500 it would pass (> not >=)."
        test_recipe:
          setup: ["group PLACED 500 head; prior reports total 480 dead"]
          setup_api_calls:
