  - section: errors
    instances:
      - name: transition_plan_verbs_expose_their_three_state_and_referential_codes
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PLAN_NOT_READY]
          - errors[ERR_PLAN_STATE_INVALID]
          - errors[ERR_NO_PACING_COORDINATION]
          - errors[ERR_RETURN_DATE_NOT_REACHED]
        distinguishing_aspect: |
          Walking one plan through its whole life triggers each of its own codes exactly where it
          belongs: complete on a DRAFT plan gives ERR_PLAN_NOT_READY, coordinate with no pacing sync
          gives ERR_NO_PACING_COORDINATION, coordinate a second time gives ERR_PLAN_STATE_INVALID,
          complete on a READY plan before the target return date gives ERR_RETURN_DATE_NOT_REACHED
          (proving ERR_PLAN_NOT_READY no longer applies), and abort on an already ABORTED plan gives
          ERR_PLAN_STATE_INVALID again.
        test_recipe:
          setup:
            - "Case ACTIVE / ACCRUING, weekly_entitled_minutes 390, service_start_date 2026-09-07, no pacing syncs yet."
            - "Classroom teacher E-1003 exists to acknowledge the pacing sync later."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /hhi/entitlement-rules"
              payload: { grade_band: "MIDDLE", delivery_mode: "IN_HOME", base_weekly_minutes: 360, cap_weekly_minutes: 480, min_session_minutes: 30, max_session_minutes: 120, max_daily_minutes: 240, min_gap_minutes: 15, travel_buffer_minutes: 30, status: "PUBLISHED" }
