            - "ServiceVisit.${vb}.scheduled_start_minute == 700"
            - "third trigger POST /draft-service/service-visits returns HTTP 201 - same minutes, next calendar day"
            - "ServiceVisit.${vc}.scheduled_date == 2026-08-06"
            - "ServiceVisit.${va}.work_status == SCHEDULED"

  # ===========================================================================
  # RULE 9 — compensating_invariant
  # Two undo paths in different subsystems: a money reversal that must leave the
  # brewer ledger bit-for-bit as it was, and a chemical-record void that must
  # replay a line's compliance projection from the surviving cycles.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: disputing_a_signature_rewinds_the_exhausted_program_and_both_accounts_billing_modes
        grounds:
          - state_machines.ServiceVisit.verification_status.SIGNED_to_DISPUTED
          - state_machines.BrewerProgram.EXHAUSTED_to_ACTIVE
          - calculations.brewer_funding_waterfall
          - entities.ServiceVisit.fields.settlement_state
          - entities.BrewerProgram.fields.consumed_cents
          - entities.ServiceAccount.fields.billing_mode
        distinguishing_aspect: |
          The five-hop exhaustion cascade is run FORWARD by the signature and
          then run BACKWARD by the dispute, and the invariant is that the whole
          graph returns to its pre-signature values with no drift: consumed_cents
          back to exactly 0 (not 8000 - 8000 computed a second way), remaining
          back to the full 8000, the program back to ACTIVE, both contracts back
          to BREWER_FUNDED, and both accounts back to PROGRAM_BILL - including
          account B, which never had a visit. The reversal zeroes only the four
          money fields the transition names; provisional_charge_cents, the line
          counts and signed_at are deliberately preserved, so the dispute window
          stays anchored to the original signature.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z then 2026-08-05T09:00:00Z."
            - "BrewerProgram ACTIVE, CLEANING_AND_PARTS, co_pay_bps 2000, funding_cap_cents 8000."
            - "ServiceAccount A with an ACTIVE contract naming the program (cleaning_frequency_days 21, contracted_line_count 4, per_line_rate_cents 4175, visit_base_fee_cents 7500), three BeerLine rows, one Technician, FAUCET-88 at 3195 brewer_funded_eligible, ChemicalLot C-1001 CAUSTIC 45.0."
            - "ServiceAccount B with its own ACTIVE contract naming the SAME program and no other data."
            - "Account A's visit is WORK_COMPLETE (provisional 24474) and then SIGNED, which settles 19881, draws the cap dry at 8000, flips the program EXHAUSTED, both contracts SELF_FUNDED and both accounts DIRECT_BILL."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/brewer-programs"
              payload: { brewer_name: "Southside Brewing", funded_scope: "CLEANING_AND_PARTS", co_pay_bps: 2000, funding_cap_cents: 8000 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { prog: $.data.id }
            - call: "POST /draft-service/accounts"
              payload: { venue_name: "Harbor Taproom", access_window_start_minute: 480, access_window_end_minute: 1080, glycol_system_present: false }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { acctA: $.data.id, acctA_v: $.data.version }
            - call: "POST /draft-service/contracts"
              payload: { account_id: "${acctA}", cleaning_frequency_days: 21, contracted_line_count: 4, per_line_rate_cents: 4175, visit_base_fee_cents: 7500, effective_from: "2026-08-01T00:00:00Z", expected_account_version: "${acctA_v}", brewer_program_id: "${prog}" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { ctrA: $.data.id }
            - call: "POST /draft-service/contracts/${ctrA}/status"
              payload: { to_status: "ACTIVE" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/accounts"
