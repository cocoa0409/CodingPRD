  # ===========================================================================
  # Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml (stubs only).
  - section: state_machines
    instances:
      - name: case_successor_auto_scheduled_on_complete
        claim_type: side_effect_execution
        grounds: [state_machines.RegistrationReviewCase.OPEN_to_COMPLETED]
        excluded_because:
          difficulty_instance: product_review_suspension_reinstatement_cycles
          rationale: "Cycle-2 auto-scheduling (opened_at == completed_at + 5475 days == 2056-08-24T00:00:00Z) is asserted in that difficulty instance's second bullet."

  - section: calculations
    instances:
      - name: amendment_timeline_adders_and_expedited_halving
        claim_type: Correct Result
        grounds: [calculations.amendment_review_timeline]
        excluded_because:
          difficulty_instance: amendment_timeline_tiered_conditionals
          rationale: "All four timeline inputs (type tier, RUP adder, food-use adder, bulletin adder) and the expedited ceil-halving are pinned to literal due dates there."

  - section: validations
    instances:
      - name: error_loc_exceeded_on_approve_gate
        claim_type: violation_to_error
        grounds: [errors.ERR_LOC_EXCEEDED]
        excluded_because:
          difficulty_instance: tolerance_establishment_gated_by_latest_assessment
          rationale: "The 422 ERR_LOC_EXCEEDED failure path on APPROVE is the trigger of that difficulty instance."

      - name: bulletin_overlapping_window_same_county_rejected
        claim_type: violation_to_error
        grounds: [errors.ERR_BULLETIN_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: bulletin_closed_month_window_sharing
          rationale: "The 409 overlap rejection (and the disjoint acceptance) are that instance's trigger."

      - name: review_case_intersecting_window_rejected
        claim_type: violation_to_error
        grounds: [errors.ERR_REVIEW_CASE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: review_case_half_open_interval_adjacency
          rationale: "The 409 intersection rejection and the adjacency acceptance are that instance's trigger."

      - name: duplicate_open_application_error
        claim_type: violation_to_error
        grounds: [errors.ERR_DUPLICATE_OPEN_APPLICATION]
        excluded_because:
          difficulty_instance: submit_duplicate_open_beats_fee_error
          rationale: "ERR_DUPLICATE_OPEN_APPLICATION is the winning error of that priority-conflict instance."

      - name: product_terminal_blocks_amendment_create
        claim_type: violation_to_error
        grounds: [errors.ERR_PRODUCT_TERMINAL]
        excluded_because:
          difficulty_instance: amendment_create_state_error_beats_rate_cap
          rationale: "ERR_PRODUCT_TERMINAL on amendment create is the winning error of that priority-conflict instance."

      - name: dietary_loc_boundary_exactly_one
        claim_type: violation_to_error
        grounds: [calculations.level_of_concern_determination]
        excluded_because:
          difficulty_instance: dietary_rq_exactly_one_exceeds_loc
          rationale: "The inclusive >= 1.0 boundary with the 0.964 contrast is that instance."

      - name: certification_boundary_inclusive_exact
        claim_type: violation_to_error
        grounds: [errors.ERR_NO_VALID_APPLICATOR_CERTIFICATION]
        excluded_because:
          difficulty_instance: certification_expiry_boundary_is_inclusive
          rationale: "The certified_until == clock acceptance and +1s rejection are that instance's trigger."

      - name: state_grant_blocked_during_under_review
        claim_type: violation_to_error
        grounds: [errors.ERR_PRODUCT_NOT_REGISTERED]
        excluded_because:
          difficulty_instance: state_grant_blocked_while_product_under_review
          rationale: "ERR_PRODUCT_NOT_REGISTERED on the grant decision is that instance's failure path."

  - section: cross_cutting_layers
    instances:
      - name: dci_delinquency_cascade_end_to_end
        claim_type: violation_to_error
        grounds: [state_machines.DataCallIn.ISSUED_to_DELINQUENT]
        excluded_because:
          difficulty_instance: dci_delinquency_auto_suspension_chain
          rationale: "The full delinquency -> referral -> auto-suspension -> state-denial cascade is asserted hop-by-hop there."
