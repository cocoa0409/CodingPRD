        grounds: ["calculations.filing_utilization_pct.precision", "response_envelope.success"]
        distinguishing_aspect: "13777 assignable numbers over a 20000-number denominator is exactly 68.885, a true half-way value at two decimals: round_half_up must publish 68.89, where banker's rounding would publish 68.88."
        test_recipe:
