      - name: redistribution_depart_blocked_by_suspended_destination_market
        grounds:
          - state_machines[RedistributionOrder]
          - state_machines[Market]
          - validations[priority 19 ERR_MARKET_SUSPENDED]
          - endpoints[POST /fleet/redistribution-orders/{order_id}/depart]
        distinguishing_aspect: |
          This dependency runs SIDEWAYS to a referenced entity rather than up an ownership
          chain, and the referenced row is the DESTINATION market - not the origin market
          that scopes the caller's own authority. The order is already AUTHORIZED, which
          means the destination was ACTIVE when it was authorized, so the implementation
          must re-read the market at depart time instead of trusting the authorization.
          A parallel order to a still-ACTIVE market departs successfully in the same test,
          isolating the market's state as the only cause.
        test_recipe:
          setup:
            - "Markets ATL (origin), DFW and ORD all exist and start ACTIVE."
            - "Vehicle VA is IN_SERVICE at ATL."
            - "Order O_DFW (200 km to DFW, window 2026-04-05 to 2026-04-07) and order O_ORD (200 km to ORD, window 2026-04-10 to 2026-04-12) are both proposed by u-plan-1 and authorized by u-ctl-a; the windows are disjoint so the transfer-overlap rule never fires."
            - "DFW is suspended only AFTER O_DFW is authorized, so the authorize-time market check passed."
            - "Both departs are attempted while VA is still IN_SERVICE, so the vehicle-state precondition is satisfied for both."
