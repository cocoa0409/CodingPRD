              as_user_id: "postage-1"
              captures: { e5_unsealed_status: "$.data.status", e5_cleared_estimate: "$.data.estimated_postage_cents" }
          assert:
            - "${e5_available} == 100000, ${e5_batch_status} == OPEN and ${e5_job_status} == VERIFIED before the trigger — the seal precondition CompositionJob.status == VERIFIED is satisfied, so only the batch status is in question"
            - "HTTP 409 with ${e5_error} == ERR_BATCH_NOT_SEALED for the premature unseal, and the batch stays OPEN with estimated_postage_cents null"
            - "HTTP 200 for the seal with ${e5_sealed_status} == SEALED and ${e5_estimate} == 62 (FIRST_CLASS MIXED_AADC base 62, one sheet, no surcharge)"
            - "HTTP 200 for the unseal with ${e5_unsealed_status} == OPEN, ${e5_cleared_estimate} null and sealed_by_user_id null"
            - "The escrow ledger returns to postage_committed_cents 0 and postage_escrow_available_cents 100000 — the conservation detail is asserted in full by the difficulty instance postage_escrow_conserved_across_seal_and_unseal"

      - name: omitting_the_press_line_selects_one_and_records_selection_mode_selected
        claim_type: conditional_action
        grounds: [endpoints.POST_composition_jobs_id_schedule, entities.PrintRun.fields.selection_mode]
        distinguishing_aspect: "The same schedule endpoint behaves two ways on one field: naming a press line records selection_mode EXPLICIT and turns every eligibility predicate into a validation, while omitting it runs the selector and records SELECTED - and the score is computed either way, so the two runs differ only in mode and in the headroom the second one sees."
        test_recipe:
