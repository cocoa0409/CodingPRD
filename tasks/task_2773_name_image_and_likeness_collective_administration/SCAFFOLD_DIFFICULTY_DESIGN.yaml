# ============================================================================
# §1.8 SCAFFOLD DIFFICULTY DESIGN (Test Targeting Index) — Task 2773
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# Every numeric literal in every `assert:` line was computed by executing the
# corresponding §1.3 `formula:` as code against its `constants:`.
# ============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: deduction_attribution_diverges_between_at_receipt_and_year_end
        grounds:
          - calculations.calc_contribution_deductible_amount
          - entities.Contribution.fields.deduction_variant
          - entities.Contribution.fields.sequence_no
          - entities.DonorMember.fields.lifetime_deductible_cents
          - entities.Collective.fields.charitable_deduction_enabled
        distinguishing_aspect: |
          This dual-variant calculation lives in the donor/contribution domain: the
          at_receipt variant walks the donor's settled contributions in
          Contribution.sequence_no ASC order while the year_end_recompute variant
          walks them in received_at ASC order, so with a backdated second gift the
          same two rows swap 300000 cents of AGI-limited deduction between them
          while their sum stays pinned at the 600000-cent ceiling.
        test_recipe:
          setup:
            - "A NONPROFIT_501C3 collective, so charitable_deduction_enabled is true."
            - "One OPEN membership tier and one INDIVIDUAL DonorMember with annual_agi_cents 1000000, giving a deduction ceiling of floor(1000000*60/100) = 600000."
            - "Contribution A is recorded FIRST (lower sequence_no) while the logical clock reads 2026-08-20, with gross 512851 -> fee 12851 -> net 500000."
            - "Contribution B is recorded SECOND (higher sequence_no) while the logical clock has been moved BACK to 2026-08-10, with gross 410287 -> fee 10287 -> net 400000."
            - "Under the at_receipt variant the ceiling is consumed in sequence_no order, so A holds 500000 and B holds only the remaining 100000."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Buckeye NIL Trust", institution_name: "Ohio State Institution", institution_ipeds_code: "001100", home_state_code: "OH", association_ruleset: "NCAA_2026", entity_structure: "NONPROFIT_501C3" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T3", tier_name: "Founders", annual_dues_cents: 100000, benefit_rank: 3 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Dana Donor", email: "dana@example.com", donor_kind: "INDIVIDUAL", annual_agi_cents: 1000000 }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 512851, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_a_id: $.data.id }
            - call: "POST /nil/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 410287, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_b_id: $.data.id }
          trigger:
            - call: "POST /nil/collectives/${col_id}/billing-runs"
              payload: { run_kind: "YEAR_END_TAX_RECOMPUTE" }
              as: TreasuryOfficer
              captures: { recomputed_n: $.data.recomputed_contribution_count, delta_cents: $.data.deduction_delta_cents }
          assert:
            - "Contribution.${contrib_a_id}.net_amount_cents == 500000"
            - "Contribution.${contrib_b_id}.net_amount_cents == 400000"
            - "Contribution.${contrib_a_id}.deductible_amount_cents == 200000"
            - "Contribution.${contrib_b_id}.deductible_amount_cents == 400000"
            - "Contribution.${contrib_a_id}.deduction_variant == YEAR_END_RECOMPUTE"
            - "Contribution.${contrib_b_id}.deduction_variant == YEAR_END_RECOMPUTE"
            - "DonorMember.${donor_id}.lifetime_deductible_cents == 600000"
            - "DonorMember.${donor_id}.lifetime_settled_cents == 900000"
            - "${recomputed_n} == 2"
            - "${delta_cents} == 0"
            - "The at_receipt attribution immediately before the trigger was Contribution.${contrib_a_id}.deductible_amount_cents == 500000 and Contribution.${contrib_b_id}.deductible_amount_cents == 100000, so the recompute moves A by -300000 and B by +300000 with the 600000 total unchanged."

      - name: roster_share_payout_diverges_from_strict_unit_basis
        grounds:
          - calculations.calc_deliverable_payout_eligible
          - calculations.calc_roster_share_allocation
          - entities.Deliverable.fields.payout_basis
          - entities.DealContract.fields.deliverable_value_total_cents
          - state_machines.sm_deliverable_status.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          This second dual-variant calculation lives in the deliverable/contract
          domain rather than the donor domain: one identical 200000-cent SOCIAL_POST
          pays 222222 under contract_share_basis on a ROSTER_SHARE contract worth
          333333 with 300000 of sibling deliverable value, and 200000 under
          strict_unit_basis on an INDIVIDUAL contract, so the variant is selected
          from DealContract.deal_kind and not from any lifecycle timing.
        test_recipe:
          setup:
            - "A FOR_PROFIT_LLC collective with 2458000 cents of settled net funds (1958000 designated ROSTER_POOL and 500000 designated UNRESTRICTED)."
            - "Three ENROLLED FOOTBALL athletes with the default roster_weight 1 and Athlete.sequence_no 1, 2, 3."
            - "One EQUAL_SHARE roster batch B1 over a 1000000-cent pool, so the shares are 333334 / 333333 / 333333 and the second athlete's contract is worth exactly 333333."
            - "That ROSTER_SHARE contract is ACTIVE and carries two deliverables (SOCIAL_POST 200000 and APPEARANCE 100000), so deliverable_value_total_cents is 300000."
            - "A separate INDIVIDUAL contract worth 200000 for the first athlete is ACTIVE and carries a single SOCIAL_POST deliverable worth 200000."
            - "Both social posts have one evidence record and were submitted with performed_at 2026-08-05, well before their 2026-09-01 due_at, so late_flag is false on both."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Lone Star Collective", institution_name: "Texas Institution", institution_ipeds_code: "002200", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Boosters", annual_dues_cents: 50000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Rex Roster", email: "rex@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 2000000, source_kind: "ONE_TIME_GIFT", designation: "ROSTER_POOL", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_pool_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 512851, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_unres_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Ann Alpha", portal_user_id: "ath-alpha", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath1_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Bo Bravo", portal_user_id: "ath-bravo", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath2_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Cy Charlie", portal_user_id: "ath-charlie", sport: "FOOTBALL", class_year: 2029 }
              as: CollectiveDirector
              captures: { ath3_id: $.data.id }
            - call: "GET /nil/collectives/${col_id}"
              payload: {}
              as: PlatformAdmin
              captures: { col_ver: $.data.version }
            - call: "POST /nil/deal-contracts/roster-allocations"
              payload: { collective_id: "${col_id}", allocation_batch_code: "B1", sport: "FOOTBALL", pool_amount_cents: 1000000, allocation_mode: "EQUAL_SHARE", effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "ROSTER_POOL", exclusivity_category: "NONE", expected_collective_version: "${col_ver}" }
              as: CollectiveDirector
              captures: { created_n: $.data.created_contract_count, min_share: $.data.min_share_cents, max_share: $.data.max_share_cents, remainder: $.data.remainder_cents }
            - call: "GET /nil/deal-contracts"
              payload: { allocation_batch_code: "B1", athlete_id: "${ath2_id}" }
              as: CollectiveDirector
              captures: { rc_id: "$.data[0].id" }
            - call: "POST /nil/deal-contracts/${rc_id}/compliance-submissions"
