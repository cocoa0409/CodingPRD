        distinguishing_aspect: "All five unique keys are enforced independently (Payer.name, Drug.hcpcs_code, Patient.mrn, Clinician.npi and the PayerDrugPolicy pair), the active-plan key is (patient_id, eye) so the fellow eye is still allowed, and biosimilar lineage is refused in both broken shapes: is_biosimilar true with a null reference, and a reference that itself points at a biosimilar."
