      - name: computed_fields_on_financed_policy_derive_from_attestations
        claim_type: computed_fields
        grounds:
          - entities.FinancedPolicy.fields.verified_premium_cents
          - entities.FinancedPolicy.fields.verified_effective_date
          - entities.FinancedPolicy.fields.financed_premium_cents
          - entities.PremiumVerification.fields.effective_premium_cents
          - state_machines.FinancedPolicy.PENDING_VERIFICATION_to_VERIFIED
        distinguishing_aspect: |
          verified_premium_cents, verified_effective_date and financed_premium_cents are computed —
          they are null/0 at creation and are written only when the two attestations agree. Both
          parties file CORRECTED at 550000, so the financed amount must follow the AGREED CORRECTION
          (550000) and not the gross_premium_cents the analyst typed (600000); PremiumVerification's
          own computed effective_premium_cents must equal the correction while the policy's
          gross_premium_cents stays 600000 as the historical input.
        test_recipe:
          setup:
