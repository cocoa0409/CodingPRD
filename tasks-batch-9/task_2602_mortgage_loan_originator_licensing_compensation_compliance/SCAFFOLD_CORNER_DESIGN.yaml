              as_user_id: "analyst-1"
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { base_v: $.data.version }
          trigger:
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { v1: $.data.version }
