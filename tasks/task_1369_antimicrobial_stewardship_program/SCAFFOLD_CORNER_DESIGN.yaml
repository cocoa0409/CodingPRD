            - "AntibioticOrder.${ou_id}.therapy_status == ACTIVE"
            - "AntibioticOrder.${or_id}.approval_status == PENDING"
            - "AntibioticOrder.${or_id}.therapy_status == AWAITING_APPROVAL"

      - name: dot_snapshot_reopen_blocked_when_pinned
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.DOTMetricSnapshot.FINALIZED_to_OPEN"
          - "errors[ERR_SNAPSHOT_PINNED_BY_REPORT]"
        distinguishing_aspect: "A FINALIZED snapshot pinned by a SUBMITTED report cannot reopen: ERR_SNAPSHOT_PINNED_BY_REPORT."
        test_recipe:
          setup: ["H; IP; DIR; snapshot FINALIZED for 2026-07; report SUBMITTED pinning it"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Nurse IP", license_no: "L-IP-1", discipline: "INFECTION_PREVENTIONIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ip_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr DIR", license_no: "L-DIR-1", discipline: "PHYSICIAN", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { dir_id: $.data.id }
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-01T00:00:00Z" }
              as: StewardshipAdmin
            - call: "POST /stewardship/dot-snapshots"
              payload: { hospital_id: "${h_id}", period_label: "2026-07", patient_days: 100 }
              as: InfectionPreventionist
              as_user_id: "${ip_id}"
              captures: { snap_id: $.data.id }
            - call: "POST /stewardship/dot-snapshots/${snap_id}/finalize"
              payload: {}
              as: InfectionPreventionist
              as_user_id: "${ip_id}"
            - call: "POST /stewardship/regulatory-reports"
              payload: { hospital_id: "${h_id}", report_type: "NHSN_AUR", period_label: "2026-07", dot_snapshot_id: "${snap_id}" }
              as: InfectionPreventionist
              as_user_id: "${ip_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /stewardship/regulatory-reports/${rep_id}/submit"
              payload: {}
              as: InfectionPreventionist
              as_user_id: "${ip_id}"
          trigger:
            - call: "POST /stewardship/dot-snapshots/${snap_id}/reopen"
              payload: {}
              as: StewardshipDirector
              as_user_id: "${dir_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SNAPSHOT_PINNED_BY_REPORT"
            - "DOTMetricSnapshot.${snap_id}.status remains FINALIZED"

  # ===========================================================================
  # Section: calculations — correctness of results, input-set filtering,
  # constants, precision, selector policy
  # ===========================================================================
  - section: calculations
    instances:
      - name: selector_recommendation_narrowest_susceptible_wins
        claim_type: correct_result
        grounds:
          - "calculations.selector_culture_driven_recommendation"
        distinguishing_aspect: "Selector picks lowest CLASS_BREADTH_RANK among S-interpretation candidates: NARROW_PENICILLIN (20) beats CEPHALOSPORIN (40) beats CARBAPENEM (90)."
        test_recipe:
          setup: ["H; MB; MD; PH; patient P; drugs AMP(narrow), CEF(cephalosporin), MER(carbapenem) all ACTIVE; FINAL culture with S rows for all three"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
