            - "${item_status} == IN_SEASON and ${item_units} == ${adopt_units} == 276: neither the IN_SEASON -> CHASED nor the IN_SEASON -> CANCELLED_IN_SEASON branch fired, because both are gated on approved_units > 0"
            - "${cycle_after} == DECIDED (it was ${cycle_status} == OPEN before): the bubble-up depends only on no PROPOSED decision remaining, not on any units having moved"
            - "${open_after} == ${open_before} == 18200000 and ${committed_after} == ${committed_before} == 0: no ReceiptCommitment was created, so no month dollar moved"
