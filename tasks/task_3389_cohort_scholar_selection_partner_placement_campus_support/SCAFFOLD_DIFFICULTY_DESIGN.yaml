  - rule_id: compensating_invariant
    instances:
      - name: accept_then_withdraw_restores_committed_seats
        grounds:
          - calculations.cohort_seat_ledger
          - state_machines.Offer.ACCEPTED_to_REVOKED
          - state_machines.Scholar.PRE_COLLEGIATE_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = the cohort's committed seat count, pinned as
          seats_committed == count(offers in ACCEPTED): the forward action
          (offer accept) raises it to 1 and the compensating action (scholar
          self-withdrawal pre-matriculation) returns it to exactly 0 with the
          offer REVOKED — no drift after the round trip. Sibling invariant
          (nominate_then_withdraw_restores_quota) conserves a different
          quantity: nominator nomination slots.
        test_recipe:
          setup:
            - "Cohort size 3 FORMING; nominee n1 SELECTED with offer o1"
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 20 }, as: ProgramAdmin, captures: { np: $.data.id } }
            - { call: "POST /api/partner-colleges", payload: { name: "Elm College" }, as: ProgramAdmin, captures: { coll: $.data.id, collv: $.data.version } }
            - { call: "POST /api/partner-agreements", payload: { partner_college_id: "${coll}", admissions_cycle: "2027", cohort_size: 3, tuition_annual_cents: 6123460, expected_college_version: "${collv}" }, as: ProgramAdmin, captures: { agr: $.data.id } }
            - { call: "POST /api/partner-agreements/${agr}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/mentors", payload: { partner_college_id: "${coll}", full_name: "Prof Elm" }, as: ProgramAdmin, captures: { men: $.data.id } }
            - { call: "POST /api/cohorts", payload: { agreement_id: "${agr}", city_program_id: "${cp}", mentor_id: "${men}" }, as: ProgramAdmin, captures: { coh: $.data.id } }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom One", nominator_id: "${np}" }, as: ProgramAdmin, captures: { n1: $.data.id } }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 1, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 2, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 2, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 3, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${n1}", round_number: 3, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-b" }
            - { call: "POST /api/nominees/${n1}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/offers", payload: { nominee_id: "${n1}", cohort_id: "${coh}" }, as: SelectionOfficer, captures: { o1: $.data.id } }
            - { call: "POST /api/offers/${o1}/accept", payload: {}, as: Nominee, as_user_id: "${n1}" }
            - { call: "GET /api/scholars?nominee_id=${n1}", as: ProgramAdmin, captures: { s1: "$.data[0].id" } }
            - { call: "GET /api/cohorts/${coh}", as: ProgramAdmin, captures: { com_mid: $.data.seats_committed } }
          trigger:
            - { call: "POST /api/scholars/${s1}/lifecycle", payload: { to_enrollment_status: "WITHDRAWN" }, as: Scholar, as_user_id: "${s1}" }
            - { call: "GET /api/cohorts/${coh}", as: ProgramAdmin, captures: { com_end: $.data.seats_committed, out_end: $.data.offers_outstanding, cstat: $.data.status } }
            - { call: "GET /api/offers/${o1}", as: ProgramAdmin, captures: { o1st: $.data.status } }
            - { call: "GET /api/scholars/${s1}", as: ProgramAdmin, captures: { s1st: $.data.enrollment_status } }
          assert:
            - "After accept: seats_committed == 1 (captured ${com_mid}) == count of ACCEPTED offers (o1)"
            - "After the compensating withdrawal: seats_committed == 0 (captured ${com_end}) == count of ACCEPTED offers (o1 is now REVOKED, captured ${o1st})"
            - "scholar ${s1}.enrollment_status == WITHDRAWN (captured ${s1st}); cohort FORMING with offers_outstanding == 0 (captured ${cstat}, ${out_end})"
            - "The forward/compensating pair leaves the conserved seat ledger unchanged: 0 -> 1 -> 0 with no residual commitment"
      - name: nominate_then_withdraw_restores_quota
        grounds:
          - state_machines.Nominee.NOMINATED_to_WITHDRAWN
          - entities.NominatingPartner.fields.nominations_used
        distinguishing_aspect: |
          Conserved quantity = the nominating partner's quota slots, pinned as
          nominations_used + nominations_remaining == nomination_quota: two
          nominations drive used 0 -> 1 -> 2, a withdrawal of a NOMINATED
          nominee returns it to 1, and a fresh nomination then succeeds (proving
          the slot was truly released) driving it to 2 again. Different
          conserved quantity from the cohort seat ledger
          (accept_then_withdraw_restores_committed_seats).
        test_recipe:
          setup:
            - "Nominating partner with nomination_quota 2 in an open window"
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
            - { call: "POST /api/nominating-partners", payload: { city_program_id: "${cp}", name: "West High", kind: "HIGH_SCHOOL", nomination_quota: 2 }, as: ProgramAdmin, captures: { np: $.data.id } }
          trigger:
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom One" }, as: Nominator, as_user_id: "${np}", captures: { n1: $.data.id } }
            - { call: "GET /api/city-programs/${cp}/partners", as: ProgramAdmin, captures: { u1: "$.data[0].nominations_used" } }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom Two" }, as: Nominator, as_user_id: "${np}", captures: { n2: $.data.id } }
            - { call: "GET /api/city-programs/${cp}/partners", as: ProgramAdmin, captures: { u2: "$.data[0].nominations_used" } }
            - { call: "POST /api/nominees/${n1}/withdraw", payload: {}, as: Nominator, as_user_id: "${np}" }
            - { call: "GET /api/city-programs/${cp}/partners", as: ProgramAdmin, captures: { u3: "$.data[0].nominations_used" } }
            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom Three" }, as: Nominator, as_user_id: "${np}", captures: { n3: $.data.id } }
            - { call: "GET /api/city-programs/${cp}/partners", as: ProgramAdmin, captures: { u4: "$.data[0].nominations_used" } }
          assert:
            - "nominations_used walks 1 -> 2 -> 1 -> 2 (captured ${u1}, ${u2}, ${u3}, ${u4})"
            - "Invariant holds at every step: nominations_used + remaining == 2 (remaining is quota minus used)"
            - "The post-withdrawal nomination ${n3} succeeded with HTTP 201 — proof the quota slot was genuinely released, not just relabeled"
            - "Nominee ${n1} is WITHDRAWN and no longer counts; ${n2} and ${n3} count"
