          assert:
            - "the first summary reports network_risk_points == 50 (raw 20 * 3 = 60 clamped to the ceiling)"
            - "the second summary reports network_risk_points == 48 (raw 16 * 3 = 48, below the ceiling and therefore unclamped)"
            - "both summaries report breached_attestation_count == 1 and high_open_count == 1"
            - "the same computation on a domestic engagement would report 0 because affiliate_network_risk short-circuits when is_multinational is false"

