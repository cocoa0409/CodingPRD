          - entities.VendorOrder.fields.promised_ship_date
        distinguishing_aspect: |
          A CLOCK-TO-CALENDAR boundary measured in milliseconds: two placements one
          millisecond apart against cutoff_hour_utc 15 land on different effective
          placement dates (2026-08-05 vs 2026-08-06) and therefore promise ship dates a
          whole day apart, because the comparison is placement_hour >= cutoff.
