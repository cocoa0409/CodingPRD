# ---------------------------------------------------------------------------
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task 2747 -- Appraisal Review & Reconsideration of Value
# 9 rule_ids / 19 instances. Every numeric assert below was computed by running
# the §1.3 formulas as code against the pinned setup inputs.
# ---------------------------------------------------------------------------
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: desk_review_quality_score_preliminary_vs_final_on_desk_review
        grounds:
          - calculations.desk_review_quality_score
          - calculations.appraisal_completeness_score
          - calculations.receipt_rule_check_battery
          - calculations.bias_risk_index
          - calculations.escalation_requirement_matrix
          - entities.DeskReview.fields.preliminary_quality_score_bps
          - entities.DeskReview.fields.final_quality_score_bps
          - state_machines.DeskReview.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          This dual-variant pair lives on the DeskReview scoring domain: the PRELIMINARY variant
          subtracts only the rule-check penalty (8629) while the FINAL variant also subtracts the
          comparable-distance penalty and the bias penalty (6829), a pinned delta of exactly 1800
          on identical appraisal data.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One ACTIVE AMC and one ACTIVE appraiser holding an ACTIVE CA panel membership with it."
            - "One SUBURBAN / STANDARD REFINANCE loan file for 30000000 cents."
            - "One appraisal reporting 40000000 cents with all 8 required sections but only 5 exhibits, and a narrative containing exactly three PROHIBITED_TERMS ('desirable neighborhood', 'pride of ownership', 'family-oriented')."
            - "Three CLOSED comparables in the grid: one with a 3000 bps gross adjustment (a FAIL), one 3.50 miles out (SUBURBAN ceiling 3.00 -> a WARN), one benign."
            - "Rule checks run (completeness 9429, 1 FAIL, 1 WARN), bias screen run (index 36 -> INDICATED), and a DRAFT desk review opened."
          setup_api_calls:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Summit Appraisal Management" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { amc1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisers"
              payload: { full_name: "Alice Author", license_number: "CA-AL-1001", license_state: "CA" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { apr_a_id: $.data.id, apr_a_v: $.data.version }
            - call: "POST /appraisal-desk/panel-memberships"
              payload: { appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", coverage_state: "CA", tier: "GENERAL", expected_appraiser_version: "${apr_a_v}" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
            - call: "POST /appraisal-desk/loan-files"
              payload: { loan_number: "LN-2747-1A", loan_purpose: "REFINANCE", market_type: "SUBURBAN", risk_tier: "STANDARD", loan_amount_cents: 30000000, borrower_display_name: "Dana Borrower" }
              as: LoanOfficer
              as_user_id: "lo_user_1"
              captures: { lf1_id: $.data.id, lf1_v: $.data.version }
            - call: "POST /appraisal-desk/appraisals"
              payload: { loan_file_id: "${lf1_id}", appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", report_form_type: "FORM_1004", effective_date: "2026-07-15T00:00:00Z", reported_value_cents: 40000000, sections_present: ["SUBJECT", "CONTRACT", "NEIGHBORHOOD", "SITE", "IMPROVEMENTS", "SALES_COMPARISON", "RECONCILIATION", "CERTIFICATION"], exhibit_count: 5, narrative_text: "Subject sits in a desirable neighborhood with strong pride of ownership and a family-oriented character.", subject_census_tract_band: "A", expected_loan_file_version: "${lf1_v}" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
              captures: { ap1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisals/${ap1_id}/comparables"
              payload: { street_address: "11 Oak Street", sale_price_cents: 38000000, gross_adjustment_cents: 11400000, net_adjustment_cents: 1900000, distance_miles: 1.20, sale_date: "2026-05-01T00:00:00Z", sale_status: "CLOSED", dwelling_type: "SFR", census_tract_band: "A" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
            - call: "POST /appraisal-desk/appraisals/${ap1_id}/comparables"
              payload: { street_address: "22 Elm Street", sale_price_cents: 39000000, gross_adjustment_cents: 3900000, net_adjustment_cents: -390000, distance_miles: 3.50, sale_date: "2026-04-10T00:00:00Z", sale_status: "CLOSED", dwelling_type: "SFR", census_tract_band: "A" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
            - call: "POST /appraisal-desk/appraisals/${ap1_id}/comparables"
              payload: { street_address: "33 Pine Street", sale_price_cents: 41000000, gross_adjustment_cents: 2050000, net_adjustment_cents: 410000, distance_miles: 2.00, sale_date: "2026-06-01T00:00:00Z", sale_status: "CLOSED", dwelling_type: "SFR", census_tract_band: "A" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
            - call: "GET /appraisal-desk/appraisals/${ap1_id}"
              payload: {}
              as: AppraisalDeskReviewer
              as_user_id: "desk_user_1"
              captures: { ap1_v1: $.data.version }
            - call: "POST /appraisal-desk/appraisals/${ap1_id}/run-rule-checks"
              payload: { expected_appraisal_version: "${ap1_v1}" }
              as: AppraisalDeskReviewer
              as_user_id: "desk_user_1"
              captures: { ap1_v2: $.data.version }
            - call: "POST /appraisal-desk/appraisals/${ap1_id}/run-bias-screen"
              payload: { expected_appraisal_version: "${ap1_v2}" }
              as: ComplianceOfficer
              as_user_id: "compliance_user_1"
              captures: { ap1_v3: $.data.version }
            - call: "POST /appraisal-desk/desk-reviews"
              payload: { appraisal_id: "${ap1_id}", reviewer_note: "Desk intake of the Summit delivery.", expected_appraisal_version: "${ap1_v3}" }
              as: AppraisalDeskReviewer
              as_user_id: "desk_user_1"
              captures: { dr1_id: $.data.id }
          trigger:
            - call: "POST /appraisal-desk/desk-reviews/${dr1_id}/submit"
              payload: { findings_note: "Grid stretch and biased narrative language noted." }
              as: AppraisalDeskReviewer
              as_user_id: "desk_user_1"
          assert:
            - "Appraisal.${ap1_id}.completeness_score_bps == 9429"
            - "Appraisal.${ap1_id}.rule_check_fail_count == 1"
            - "Appraisal.${ap1_id}.rule_check_warn_count == 1"
            - "Appraisal.${ap1_id}.max_gross_adjustment_bps == 3000"
            - "Appraisal.${ap1_id}.max_net_adjustment_bps == 500"
            - "Appraisal.${ap1_id}.indicated_value_cents == 39973333"
            - "Appraisal.${ap1_id}.variance_vs_reported_bps == 7"
            - "Appraisal.${ap1_id}.bias_risk_index == 36"
            - "Appraisal.${ap1_id}.bias_screen_status == INDICATED"
            - "DeskReview.${dr1_id}.preliminary_quality_score_bps == 8629"
            - "DeskReview.${dr1_id}.final_quality_score_bps == 6829"
            - "DeskReview.${dr1_id}.preliminary_quality_score_bps - DeskReview.${dr1_id}.final_quality_score_bps == 1800"
            - "DeskReview.${dr1_id}.required_escalation == SECOND_APPRAISAL"
            - "DeskReview.${dr1_id}.risk_tier_at_review == STANDARD"
            - "DeskReview.${dr1_id}.status == SUBMITTED"

      - name: appraiser_performance_rolling_12m_vs_lifetime_on_appraiser
        grounds:
          - calculations.appraiser_performance_score
          - entities.Appraiser.fields.performance_score_bps
          - entities.Appraiser.fields.lifetime_performance_score_bps
          - entities.Appraiser.fields.revision_rate_bps
          - entities.Appraiser.fields.total_appraisal_count
          - state_machines.Appraiser.ACTIVE_to_SUSPENDED
          - state_machines.Appraiser.SUSPENDED_to_SUSPENDED
        distinguishing_aspect: |
          This dual-variant pair lives on the Appraiser panel-monitoring domain, not the DeskReview
          scoring domain: with one revised appraisal 19 months old and one clean appraisal inside the
          window, ROLLING_12M reports 10000 with revision_rate_bps 0 and total_appraisal_count 1 while
          LIFETIME reports 7000 off a 5000 bps lifetime revision rate.
        test_recipe:
          setup:
            - "Clock moved back to 2025-01-01T00:00:00Z so the first appraisal falls outside the eventual 365-day rolling window."
            - "AMC, appraiser A with an ACTIVE CA membership, and loan file LN-2747-1B (REFINANCE, SUBURBAN, STANDARD, 30000000 cents)."
            - "Appraisal 1 by A is fully complete (8 sections, 7 exhibits, benign narrative, three benign CLOSED comparables): completeness 10000, 0 FAILs, 0 WARNs, bias CLEAR, so the desk review is ACCEPTED and A's report becomes value of record at 40000000."
            - "A borrower ROV with two admissible CLOSED_SALE evidence items is submitted and A answers VALUE_REVISED at 40800000 (a 200 bps revision), producing one non-compensating ValueRevision at 2025-01-01. That recompute alone drives A's ROLLING_12M score to 4000 and A to SUSPENDED."
            - "Clock moved forward to 2026-08-01T00:00:00Z; a second loan file and a second appraisal by A are created inside the new rolling window with no revisions."
          setup_api_calls:
            - call: "POST /appraisal-desk/_clock/set_current_utc"
              payload: { current_utc: "2025-01-01T00:00:00Z" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Cascade Appraisal Management" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { amc1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisers"
              payload: { full_name: "Alice Author", license_number: "CA-AL-1002", license_state: "CA" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { apr_a_id: $.data.id, apr_a_v: $.data.version }
            - call: "POST /appraisal-desk/panel-memberships"
              payload: { appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", coverage_state: "CA", tier: "GENERAL", expected_appraiser_version: "${apr_a_v}" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
            - call: "POST /appraisal-desk/loan-files"
              payload: { loan_number: "LN-2747-1B", loan_purpose: "REFINANCE", market_type: "SUBURBAN", risk_tier: "STANDARD", loan_amount_cents: 30000000, borrower_display_name: "Dana Borrower" }
              as: LoanOfficer
              as_user_id: "lo_user_1"
              captures: { lf1_id: $.data.id, lf1_v: $.data.version }
            - call: "POST /appraisal-desk/appraisals"
              payload: { loan_file_id: "${lf1_id}", appraiser_id: "${apr_a_id}", amc_id: "${amc1_id}", report_form_type: "FORM_1004", effective_date: "2024-12-01T00:00:00Z", reported_value_cents: 40000000, sections_present: ["SUBJECT", "CONTRACT", "NEIGHBORHOOD", "SITE", "IMPROVEMENTS", "SALES_COMPARISON", "RECONCILIATION", "CERTIFICATION"], exhibit_count: 7, narrative_text: "Well maintained subject in a stable market with typical marketability.", subject_census_tract_band: "A", expected_loan_file_version: "${lf1_v}" }
              as: AMCCoordinator
              as_user_id: "${amc1_id}"
              captures: { ap1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisals/${ap1_id}/comparables"
              payload: { street_address: "101 Cedar Lane", sale_price_cents: 39000000, gross_adjustment_cents: 390000, net_adjustment_cents: 390000, distance_miles: 1.00, sale_date: "2024-10-01T00:00:00Z", sale_status: "CLOSED", dwelling_type: "SFR", census_tract_band: "A" }
