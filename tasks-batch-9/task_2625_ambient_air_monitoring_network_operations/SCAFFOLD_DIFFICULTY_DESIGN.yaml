              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-02T00:00:00Z", span_drift_pct: 2.0 }
              as: FieldTechnician
            - call: "POST /data-batches"
              payload: { monitor_id: "${mon_id}", year: 2025, quarter: 1, scheduled_hour_count: 2160, quarterly_mean_concentration: 9.0 }
              as: QaOfficer
              as_user_id: "qa-1"
              captures: { batch_id: "$.data.id", batch_v0: "$.data.version" }
          trigger:
            - call: "POST /data-batches/${batch_id}/invalidations"
              payload: { start_hour_index: 0, end_hour_index: 100, invalidation_code: "QC_FAILURE", expected_data_batch_version: "${batch_v0}" }
              as: QaOfficer
              as_user_id: "qa-1"
              captures: { inv1_id: "$.data.id" }
            - call: "GET /data-batches/${batch_id}"
              payload: {}
              as: QaOfficer
              captures: { batch_v1: "$.data.version" }
            - call: "POST /data-batches/${batch_id}/invalidations"
              payload: { start_hour_index: 100, end_hour_index: 200, invalidation_code: "OPERATOR_ERROR", expected_data_batch_version: "${batch_v1}" }
              as: QaOfficer
              as_user_id: "qa-1"
              captures: { inv2_id: "$.data.id" }
            - call: "GET /data-batches/${batch_id}"
              payload: {}
              as: QaOfficer
              captures: { batch_v2: "$.data.version" }
