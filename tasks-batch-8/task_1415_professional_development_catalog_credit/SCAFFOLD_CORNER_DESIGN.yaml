scaffold_corner_design:
- section: entities
  instances:
  - name: employee_creation_defaults_and_system_fields
    claim_type: creation_defaults
    grounds:
    - entities.Employee
    distinguishing_aspect: POST /pd/employees with only required inputs yields status ACTIVE, current_lane == base_lane, lane_credit_balance 0.0, compliance_standing COMPLIANT, last_advancement_fiscal_year
      null, version 1, server-minted id/created_at.
    test_recipe:
      setup:
      - Building B1 exists
      setup_api_calls:
      - call: POST /pd/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PDCoordinator
      - call: POST /pd/buildings
        payload:
          name: C Bldg
          building_code: CB
        as: PDCoordinator
        captures:
          b1: $.data.id
      trigger:
      - call: POST /pd/employees
        payload:
          full_name: New Hire
          email: nh@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: MA15
        as: PDCoordinator
        captures:
          e_id: $.data.id
          e_status: $.data.status
          e_lane: $.data.current_lane
          e_bal: $.data.lane_credit_balance
          e_standing: $.data.compliance_standing
          e_ver: $.data.version
          e_lastfy: $.data.last_advancement_fiscal_year
      assert:
      - status == ACTIVE (initial state)
      - current_lane == MA15 == base_lane
      - lane_credit_balance == 0.0
      - compliance_standing == COMPLIANT
      - last_advancement_fiscal_year == null
      - version == 1 and id is a server-minted UUID
  - name: course_missing_required_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Course
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting required clock_hours on POST /pd/courses yields 400 ERR_INVALID_REQUEST (priority 4 schema check).
    test_recipe:
      setup:
      - empty DB, clock default
      setup_api_calls: []
      trigger:
      - call: POST /pd/courses
        payload:
          course_code: BAD-1
          title: No Hours
          delivery_mode: VIRTUAL
        as: PDCoordinator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST and http status 400
  - name: course_invalid_enum_rejected
    claim_type: type_constraints
    grounds:
    - entities.Course.fields.delivery_mode
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: delivery_mode 'SMOKE_SIGNAL' is not in {IN_PERSON, VIRTUAL, HYBRID} -> 400 ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /pd/courses
        payload:
          course_code: BAD-2
          title: Bad Enum
          delivery_mode: SMOKE_SIGNAL
          clock_hours: 5
        as: PDCoordinator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST
  - name: section_get_not_found_returns_404
    claim_type: not_found
    grounds:
    - entities.Section
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET /pd/sections/{random uuid} with valid auth -> 404 ERR_NOT_FOUND.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /pd/sections/11111111-2222-4333-8444-555555555555
        payload: {}
        as: PDCoordinator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND and http status 404
  - name: building_create_client_id_input_ignored
    claim_type: system_fields
    grounds:
    - entities.Building
    distinguishing_aspect: Client-supplied id/version on create are ignored; the server mints its own id and version 1.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /pd/buildings
        payload:
          name: Ignored Fields
          building_code: IF1
          id: 99999999-9999-4999-8999-999999999999
          version: 42
        as: PDCoordinator
        captures:
          b_id: $.data.id
          b_ver: $.data.version
      assert:
      - response id != 99999999-9999-4999-8999-999999999999 (client id ignored)
      - response version == 1 (client version 42 ignored)
  - name: employee_list_pagination_defaults
    claim_type: listing
    grounds:
    - entities.Employee
    - response_envelope
    distinguishing_aspect: With 11 employees, GET /pd/employees with no params returns exactly 10 rows (default limit), total_count 11, has_more true; offset 10 returns the 11th row with has_more false.
    test_recipe:
      setup:
      - Building B1; eleven employees E01..E11 created in order
      setup_api_calls:
      - call: POST /pd/buildings
        payload:
          name: Pag Bldg
          building_code: PB
        as: PDCoordinator
        captures:
          b1: $.data.id
      - call: POST /pd/employees
        payload:
          full_name: E01
          email: e01@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
