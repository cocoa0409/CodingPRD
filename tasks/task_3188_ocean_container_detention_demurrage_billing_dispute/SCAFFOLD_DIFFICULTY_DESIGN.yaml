      - name: slot_open_full_open_oscillation_on_terminal_appointment_slot
        grounds:
          - state_machines.TerminalAppointmentSlot.OPEN_to_FULL
          - state_machines.TerminalAppointmentSlot.FULL_to_OPEN
          - state_machines.TerminalAppointmentSlot.OPEN_to_RELEASED
