            - "ServiceVisit.${v2}: auto_restock_flag == true, suggested_restock_units == 20 (max(0, 2*12 - 4)) (link 2)"
            - "ServiceVisit.${v1} (CONFIRMED) is NOT mutated — selector picks earliest SCHEDULED visit with scheduled_date >= clock date"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_counts_state_beats_fiscal
        grounds: ["validations[priority=9]", "validations[priority=30]", "errors[ERR_INVALID_STATE]", "errors[ERR_RESTOCK_VALUE_CAP_EXCEEDED]"]
        distinguishing_aspect: |
          Category pair (state vs business_fiscal): the visit is SCHEDULED (never
          checked in) AND the submitted restock value 600 exceeds the 500 cap — the
          state error ERR_INVALID_STATE (priority 9) MUST win over
          ERR_RESTOCK_VALUE_CAP_EXCEEDED (priority 30).
        test_recipe:
          setup:
            - "ACTIVE agreement with restock_value_cap_cents 500; route drv-1; visit scheduled 2026-08-01 left in SCHEDULED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "PrioCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "Store P", store_code: "STP", total_facings: 40 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 500 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "WATER-001", name: "Spring Water", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
            - { call: "POST /routes", payload: { program_id: "${prog}", name: "Route P", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { visit: "$.data.id" } }
          trigger:
            - { call: "POST /service-visits/${visit}/submit-counts", payload: { lines: [ { product_id: "${prod}", counted_units: 0, restock_units: 6 } ] }, as: RouteDriver, as_user_id: "drv-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (http 409) — the state precondition (priority 9) outranks the fiscal cap (priority 30) even though restock value 600 > 500 also fails"
            - "ServiceVisit.${visit}.status remains SCHEDULED and no totals are frozen"

      - name: space_create_temporal_beats_constraint
        grounds: ["validations[priority=17]", "validations[priority=21]", "errors[ERR_SPACE_WINDOW_OVERLAP]", "errors[ERR_SPACE_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: |
          Category pair (business_temporal vs business_constraint) — different pair
          than state-vs-fiscal: the candidate window both overlaps an existing
          same-category allocation (temporal) and pushes committed facings 12 over the
          store capacity 10 (constraint) — ERR_SPACE_WINDOW_OVERLAP (priority 17) MUST
          win over ERR_SPACE_CAPACITY_EXCEEDED (priority 21).
        test_recipe:
          setup:
            - "ACTIVE agreement on a store with total_facings 10; existing SNACKS allocation facings 6 window [2026-08-01, 2026-09-01)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "SpaceCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "TinyStore", store_code: "TNY", total_facings: 10 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /space-allocations", payload: { store_agreement_id: "${agr}", category: "SNACKS", facings: 6, window_start_date: "2026-08-01", window_end_date: "2026-09-01" }, as: JobberAdmin, captures: { w1: "$.data.id" } }
          trigger:
            - { call: "POST /space-allocations", payload: { store_agreement_id: "${agr}", category: "SNACKS", facings: 6, window_start_date: "2026-08-15", window_end_date: "2026-09-15" }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_SPACE_WINDOW_OVERLAP (http 409) — temporal overlap (priority 17) outranks capacity (priority 21) even though 6 + 6 = 12 > 10 also fails"
            - "exactly one SpaceAllocation exists for the agreement (the second create persisted nothing)"

  - rule_id: boundary_precision_check
    instances:
      - name: shrink_ratio_exact_threshold_suspends
        grounds: [calculations.shrink_ratio_posture, state_machines.StoreAgreement.ACTIVE_to_SUSPENDED, entities.StoreAgreement.fields.cumulative_shrink_ratio]
        distinguishing_aspect: |
          Metric = cumulative shrink RATIO at the audit-certify endpoint: exactly
          0.02 (20/1000) MUST suspend (boundary is >=), while 0.019 (19/1000) MUST
          leave the agreement ACTIVE — one unit of shrink flips the outcome.
        test_recipe:
          setup:
            - "Two ACTIVE agreements on two stores (default ratio threshold 0.02, cap 150000); both restock 1000 confirmed"
            - "D1 audit counted 980 (variance 20); D2 audit counted 981 (variance 19); zero scans so allowance 0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "RatioTest" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "Store D1", store_code: "SD1", total_facings: 120 }, as: JobberAdmin, captures: { store1: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "Store D2", store_code: "SD2", total_facings: 120 }, as: JobberAdmin, captures: { store2: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store1}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 150000 }, as: JobberAdmin, captures: { agr1: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store2}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 150000 }, as: JobberAdmin, captures: { agr2: "$.data.id" } }
            - { call: "POST /agreements/${agr1}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr1}/accept", payload: {}, as: RetailerManager, as_user_id: "${store1}", captures: { agr1_v: "$.data.version" } }
            - { call: "POST /agreements/${agr2}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr2}/accept", payload: {}, as: RetailerManager, as_user_id: "${store2}", captures: { agr2_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "CHIP-100", name: "Potato Chips", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr1}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr1_v}" }, as: JobberAdmin }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr2}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr2_v}" }, as: JobberAdmin }
            - { call: "POST /routes", payload: { program_id: "${prog}", name: "Route D", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr1}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { v1: "$.data.id" } }
            - { call: "POST /service-visits/${v1}/check-in", payload: {}, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${v1}/submit-counts", payload: { lines: [ { product_id: "${prod}", counted_units: 0, restock_units: 1000 } ] }, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${v1}/confirm", payload: {}, as: RetailerManager, as_user_id: "${store1}" }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr2}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { v2: "$.data.id" } }
            - { call: "POST /service-visits/${v2}/check-in", payload: {}, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${v2}/submit-counts", payload: { lines: [ { product_id: "${prod}", counted_units: 0, restock_units: 1000 } ] }, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${v2}/confirm", payload: {}, as: RetailerManager, as_user_id: "${store2}" }
            - { call: "POST /audit-counts", payload: { store_agreement_id: "${agr1}", scope: "FULL" }, as: JobberAdmin, captures: { aud1: "$.data.id" } }
            - { call: "POST /audit-counts/${aud1}/start", payload: {}, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "POST /audit-counts/${aud1}/submit", payload: { counted_lines: [ { product_id: "${prod}", counted_units: 980 } ] }, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "GET /audit-counts/${aud1}", payload: {}, as: JobberAdmin, captures: { aud1_v: "$.data.version" } }
            - { call: "POST /audit-counts", payload: { store_agreement_id: "${agr2}", scope: "FULL" }, as: JobberAdmin, captures: { aud2: "$.data.id" } }
            - { call: "POST /audit-counts/${aud2}/start", payload: {}, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "POST /audit-counts/${aud2}/submit", payload: { counted_lines: [ { product_id: "${prod}", counted_units: 981 } ] }, as: FieldAuditor, as_user_id: "aud-1" }
            - { call: "GET /audit-counts/${aud2}", payload: {}, as: JobberAdmin, captures: { aud2_v: "$.data.version" } }
          trigger:
