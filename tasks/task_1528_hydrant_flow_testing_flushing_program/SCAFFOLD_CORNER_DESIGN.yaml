        claim_type: temporal_validation
        grounds: ["validations[priority=11]", "errors[ERR_FLOW_TEST_WINDOW_NOT_STARTED]"]
        distinguishing_aspect: "Submitting results while the logical clock is before window_start fails with ERR_FLOW_TEST_WINDOW_NOT_STARTED (temporal, not state)."
        test_recipe:
          setup: ["Hydrant H; flow test FT window 2026-08-02T10:00-11:00Z; clock left at default 2026-08-01T00:00:00Z"]
