  - rule_id: combinatorial_formula
    instances:
      - name: assigned_amount_three_formula_branches_against_two_ceilings
        grounds:
          - calculations.gross_assigned_amount
          - calculations.marital_coverture_fraction
          - entities.Plan.fields.max_assignable_pct_bps
          - entities.Plan.fields.max_assignable_amount_cents
          - entities.DraftOrder.fields.proposed_formula_code
          - endpoints[POST /draft-orders/{id}/resubmit]
        distinguishing_aspect: |
          calculations.gross_assigned_amount is a 3x2 lattice: three formula branches
          (PERCENTAGE_OF_ACCOUNT, FLAT_DOLLAR, COVERTURE_FRACTION) each meet two independent ceilings
          (pct_ceiling 1800000 from max_assignable_pct_bps 4500, amount_ceiling 1700000 from
          max_assignable_amount_cents), and the observable hold amount depends on which of the three
          numbers is smallest. On one and the same account (assignable base 4000000) the same case is
          re-priced three times: FLAT_DOLLAR 2500000 -> 1700000 (the AMOUNT ceiling binds, the
          percentage ceiling does not), PERCENTAGE_OF_ACCOUNT 4000 bps -> 1600000 (the raw amount
          binds), COVERTURE_FRACTION at 5000 bps -> 1688000 (the raw amount binds again, but only
          after a two-stage floor: coverture 8441 bps, then effective 4220 bps). An implementation
          that applies only the tighter-looking ceiling, or that composes the coverture fraction with
          round_half_up instead of floor, produces 1700000 or 1688200 instead of 1688000.
        test_recipe:
          setup:
            - "A PUBLISHED plan with acceptable_formula_codes [PERCENTAGE_OF_ACCOUNT, FLAT_DOLLAR, COVERTURE_FRACTION], requires_model_language true, max_assignable_pct_bps 4500, max_assignable_amount_cents 1700000, resubmission_window_days 60, max_revisions 3."
            - "A participant with participation_start_date 2010-01-01, not in pay status, whose plan account has assignable sources AFTER_TAX 100000/basis 60000, EMPLOYER_MATCH 1490125, PRE_TAX_DEFERRAL 2409875 and non-assignable LOAN_RECEIVABLE 300000 — assignable_base_cents 4000000, vested_balance_cents 4300000."
            - "A case with valuation_date 2026-06-30, marital_period_start 2012-03-01, marital_period_end 2026-02-01 — coverture numerator 5085 days over a 6024-day participation window."
            - "Every draft submission carries uses_model_language false, so each revision stays deficient and can be re-noticed and re-priced without ever qualifying."
            - "The clock walks 2026-09-01 -> 2026-09-10 -> 2026-09-20 so each notice opens a fresh 60-day resubmission window."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Lattice Retirement Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT", "FLAT_DOLLAR", "COVERTURE_FRACTION"], allowed_approaches: ["SEPARATE_INTEREST", "SHARED_PAYMENT"], requires_model_language: true, permits_benefit_not_otherwise_available: false, review_period_days: 45, segregation_period_days: 548, resubmission_window_days: 60, max_revisions: 3, earnings_adjustment_method: "PERIOD_END", max_assignable_pct_bps: 4500, max_assignable_amount_cents: 1700000 }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Selma Ashford", ssn_last4: "3388", date_of_birth: "1978-08-08", participation_start_date: "2010-01-01", employment_status: "ACTIVE", benefit_commenced: false }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: { monthly_payment_cents: 0 }
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "AFTER_TAX", balance_cents: 100000, basis_cents: 60000, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "EMPLOYER_MATCH", balance_cents: 1490125, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 2409875, basis_cents: 0, is_assignable: true }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "LOAN_RECEIVABLE", balance_cents: 300000, basis_cents: 0, is_assignable: false }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 4000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Pilar Ashford", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1980-01-15", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-L1", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "FLAT_DOLLAR", proposed_flat_amount_cents: 2500000, provisions: [] }
              as: QdroAnalyst
              captures: { draft_id: $.data.id }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case_id}" }
              as: PlanAdministrator
              captures: { hold_id: "$.data[0].id", hold_amt_flat: "$.data[0].hold_amount_cents" }
            - call: "POST /draft-orders/${draft_id}/deficiency-notices"
              payload: { reviewer_notes: "model language absent" }
              as: QdroAnalyst
              as_user_id: "analyst-7"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /draft-orders/${draft_id}/resubmit"
              payload: { document_reference: "DRO-2663-L2", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000, provisions: [] }
              as: PlanAdministrator
              captures: { rev2: $.data.revision_number }
            - call: "GET /segregation-holds/${hold_id}"
              payload: {}
              as: PlanAdministrator
              captures: { hold_amt_pct: $.data.hold_amount_cents }
            - call: "POST /draft-orders/${draft_id}/deficiency-notices"
              payload: { reviewer_notes: "model language still absent" }
              as: QdroAnalyst
              as_user_id: "analyst-7"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /draft-orders/${draft_id}/resubmit"
              payload: { document_reference: "DRO-2663-L3", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "COVERTURE_FRACTION", proposed_percentage_bps: 5000, provisions: [] }
              as: PlanAdministrator
              captures: { rev3: $.data.revision_number }
            - call: "GET /segregation-holds/${hold_id}"
              payload: {}
              as: PlanAdministrator
              captures: { hold_amt_cov: $.data.hold_amount_cents }
          assert:
            - "${hold_amt_flat} == 1700000 — FLAT_DOLLAR 2500000 is trimmed by amount_ceiling 1700000, which is tighter than pct_ceiling 1800000; the order is trimmed, never rejected."
            - "${hold_amt_pct} == 1600000 — PERCENTAGE_OF_ACCOUNT 4000 bps yields raw 1600000, below both ceilings, so neither ceiling binds."
            - "${hold_amt_cov} == 1688000 — COVERTURE_FRACTION composes floor twice: coverture_bps == round_half_up(10000 * 5085 / 6024) == 8441, effective_bps == floor(8441 * 5000 / 10000) == 4220, raw == floor(4000000 * 4220 / 10000) == 1688000; that is below amount_ceiling 1700000 so the raw amount binds."
            - "GET /qdro-cases/${case_id}/benefit-projection reports assignable_base_cents == 4000000 and gross_assigned_amount_cents == 1688000 after the third submission."
            - "${rev2} == 2 and ${rev3} == 3; GET /draft-orders/${draft_id} reports revision_number == 3, status == \"UNDER_REVIEW\" (each resubmission returns the draft to review) and deficiency_codes == [\"MISSING_MODEL_LANGUAGE\"]."
            - "GET /segregation-holds/${hold_id} reports placed_at == \"2026-09-01T00:00:00Z\" and expires_at == \"2028-03-02T00:00:00Z\" throughout — re-pricing never restarts the segregation window."
            - "GET /plan-accounts/${acct_id} reports held_amount_cents == 1688000 and available_balance_cents == 2612000 after the third submission."
            - "GET /draft-orders/${draft_id}/deficiency-notices returns 2 rows with resubmission_deadline_at \"2026-10-31T00:00:00Z\" and \"2026-11-09T00:00:00Z\", both status \"CURED\"."

      - name: earnings_adjustment_per_source_rounding_beats_aggregate_rounding
        grounds:
          - calculations.earnings_adjustment
          - calculations.per_source_allocation
          - calculations.ap_after_tax_basis_carryover
          - entities.MoneySource.fields.balance_cents
          - entities.SegregationHold.fields.earnings_adjustment_cents
        distinguishing_aspect: |
          The earnings adjustment is the composition of two vectors, not a single product:
          per_source_allocation rounds each of the first n-1 sources with round_half_up and lets the
          highest source_code absorb the residue, then earnings_adjustment rounds EACH source's
          earnings before summing. With allocations [40000, 596050, 963950] at 300 bps the per-source
          earnings are [1200, 17882, 28919] summing to 48001, while round_half_up(1600000 * 300 /
          10000) — the aggregate-first shortcut — yields 48000. The 1-cent gap propagates: the
          alternate payee's balance is 1648001, not 1648000, and the participant's PRE_TAX_DEFERRAL
          source ends at 1417006, not 1417007. Simultaneously the basis carryover walks the same
          vector with floor per source and picks up 24000 from AFTER_TAX alone.
