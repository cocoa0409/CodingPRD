              as: BoardClerk
            - call: "POST /civic/appointments"
              payload: { application_id: "${app2}", seat_id: "${s2}", term_start_date: "2026-06-01T00:00:00Z", expected_seat_version: "${s2v}" }
              as: AppointingAuthority
              as_user_id: "auth-1"
