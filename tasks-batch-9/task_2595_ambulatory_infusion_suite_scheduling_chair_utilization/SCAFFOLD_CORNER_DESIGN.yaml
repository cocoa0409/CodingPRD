            - "${ap1_confirmed} == 'CONFIRMED' and ${rc1_outcome} == 'CONFIRM_ATTENDANCE' — the Scheduler's confirm and the Patient's own reminder answer both land"
            - "${lr1_status} == 'RESULTED' and ${dp1_status} == 'PREPARED' — the lab file is shared between nurse and pharmacist, compounding is the pharmacist's alone"
            - "${ap1_checked_in} == 'CHECKED_IN' — check-in is shared, and here the InfusionNurse peer takes it"
            - "${ap1_infusing} == 'INFUSING' and ${ae1_ext} == 30 (grade 2 with action SLOW_RATE)"
            - "${ae1_reviewing} == 'UNDER_REVIEW' and ${ae1_closed} == 'CLOSED' — governance is the MedicalDirector's alone"
            - "${own_score} == 0.00 and ${own_tier} == 'STANDARD' — the Patient reads its own risk row with no history"
            - "Every call in the trigger returned 2xx: no hand-off in the relay is refused"
            - "Appointment.${ap1}.observation_minutes == 90 and chair_minutes == 270 after the grade 2 extension"

      - name: peer_roles_cannot_reach_each_others_exclusive_operations
        claim_type: unauthorized_cross_role
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - roles[Scheduler].exclusive_operations
          - roles[Pharmacist].exclusive_operations
          - roles[InfusionNurse].exclusive_operations
          - roles[AuthorizationSpecialist].exclusive_operations
          - roles[MedicalDirector].exclusive_operations
        distinguishing_aspect: |
          peer_roles means there is no override edge anywhere: every pair of roles is mutually
          walled off, including the MedicalDirector, who governs the clinic yet cannot book,
          compound or infuse. The sharpest cases are the ones where the call would ALSO fail on
          state — a Scheduler starting an infusion on a TENTATIVE visit, an
          AuthorizationSpecialist resuming an ACTIVE plan — because they show the 403 is
          decided before any precondition is consulted, so the response is
          ERR_UNAUTHORIZED rather than the state refusal the same call would have earned.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. The standing center, chair, nurse, drug, 10-unit lot, MID template, one 70 kg patient and an ACTIVE 6-cycle plan."
            - "One TENTATIVE visit on 2026-08-10 at 540 with a DRAFT authorization request and one REQUESTED drug preparation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr1}", lot_number: "LOT-DEC", units_received: 10, expires_on: "2026-12-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot1: $.data.id, lot1_v: $.data.version }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl1: $.data.id, pl1_v: $.data.version }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id, ap1_v: $.data.version }
            - call: "POST /appointments/${ap1}/authorization-requests"
              payload: { payer_name: "Northwind Health" }
              as: Scheduler
              captures: { az1: $.data.id }
            - call: "POST /appointments/${ap1}/drug-preparations"
              payload: { units_requested: 1 }
              as: Pharmacist
              captures: { dp1: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-17", requested_start_minute: 540, cycle_number: 2, booking_class: "ROUTINE" }
              as: Pharmacist
              captures: { e_pharm_books: $.data.error_id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr1}", lot_number: "LOT-NOV", units_received: 5, expires_on: "2026-11-01T00:00:00Z" }
              as: Scheduler
              captures: { e_sched_stocks: $.data.error_id }
            - call: "POST /appointments/${ap1}/start-infusion"
              payload: {}
              as: Scheduler
              captures: { e_sched_infuses: $.data.error_id }
            - call: "POST /authorization-requests/${az1}/submit"
              payload: {}
              as: InfusionNurse
              as_user_id: "${nr1}"
              captures: { e_nurse_submits: $.data.error_id }
            - call: "POST /treatment-plans/${pl1}/resume"
              payload: { reason: "Not my call to make" }
              as: AuthorizationSpecialist
              captures: { e_auth_resumes: $.data.error_id }
            - call: "POST /drug-preparations/${dp1}/prepare"
              payload: {}
              as: MedicalDirector
              captures: { e_md_compounds: $.data.error_id }
            - call: "POST /appointments/${ap1}/confirm"
              payload: {}
              as: MedicalDirector
              captures: { e_md_confirms: $.data.error_id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-24", requested_start_minute: 540, cycle_number: 3, booking_class: "ROUTINE" }
              as: Patient
              as_user_id: "${pt1}"
              captures: { e_patient_books: $.data.error_id }
            - call: "POST /drug-lots/${lot1}/adjustments"
              payload: { units_delta: 5, reason: "Unauthorised recount", expected_drug_lot_version: "${lot1_v}" }
              as: AuthorizationSpecialist
              captures: { e_auth_adjusts: $.data.error_id }
            - call: "POST /infusion-centers/${ctr}/daily-sweep"
              payload: { service_date: "2026-08-10" }
              as: Pharmacist
              captures: { e_pharm_sweeps: $.data.error_id }
          assert:
            - "Every trigger call returns HTTP 403 with error_id 'ERR_UNAUTHORIZED': ${e_pharm_books}, ${e_sched_stocks}, ${e_sched_infuses}, ${e_nurse_submits}, ${e_auth_resumes}, ${e_md_compounds}, ${e_md_confirms}, ${e_patient_books}, ${e_auth_adjusts}, ${e_pharm_sweeps}"
            - "${e_sched_infuses} == 'ERR_UNAUTHORIZED' and NOT 'ERR_INVALID_SCHEDULE_STATE' — the visit is TENTATIVE, so the state check would also have failed; the role check runs first"
            - "${e_auth_resumes} == 'ERR_UNAUTHORIZED' — the plan is ACTIVE, so resume could not have succeeded for that reason either; the 403 is what answers"
            - "${e_auth_adjusts} == 'ERR_UNAUTHORIZED' even though expected_drug_lot_version is CORRECT — the role check precedes the OCC comparison"
            - "Appointment.${ap1}.schedule_status == 'TENTATIVE' and version == ${ap1_v} — no refused call mutated the row"
            - "DrugLot.${lot1}.units_received == 10, units_available == 9 and version == ${lot1_v} — the refused adjustment moved nothing"
            - "TreatmentPlan.${pl1}.status == 'ACTIVE' and version == ${pl1_v}"
            - "GET /drug-lots returns exactly 1 row and GET /appointments returns exactly 1 row — no refused create wrote a row"

      - name: shared_operations_accept_either_peer_and_write_the_identical_row
        claim_type: shared_operations
        grounds:
          - roles[Scheduler].shared_operations
          - roles[Pharmacist].shared_operations
          - roles[MedicalDirector].shared_operations
          - roles[Patient].shared_operations
          - endpoints[PATCH /appointment-templates/{id}]
          - endpoints[GET /infusion-centers/{id}/utilization]
        distinguishing_aspect: |
          A shared operation must be genuinely symmetric: the same endpoint reached by either
          declared peer has to produce the same kind of row and the same version bump, and a
          shared computed read has to return byte-identical bodies to both readers. This
          instance exercises the four shared pairs that are easiest to get wrong — template
          create and patch (Scheduler with Pharmacist), plan create (Scheduler with
          MedicalDirector), reminder answer (Patient with Scheduler) and cancel (Patient with
          Scheduler) — and pins the utilization read for both analytics roles at once.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. One center (open 480, close 1140), one AVAILABLE chair, one nurse with capacity 6, one drug and one MID template created by the Scheduler."
            - "Two 70 kg patients; patient one gets an ACTIVE 6-cycle plan created by the SCHEDULER, and two TENTATIVE visits on 2026-08-10 at 540 and 2026-08-17 at 540."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id, tp1_v1: $.data.version }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", full_name: "Pat Two", weight_kg: 70 }
              as: Scheduler
              captures: { pt2: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: Scheduler
              captures: { pl1: $.data.id, pl1_status: $.data.status }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-17", requested_start_minute: 540, cycle_number: 2, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap2: $.data.id }
          trigger:
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "HIGH" }
              as: Pharmacist
              captures: { tp2: $.data.id, tp2_status: $.data.status, tp2_admin: $.data.base_admin_minutes, tp2_acuity: $.data.acuity_points }
            - call: "PATCH /appointment-templates/${tp1}"
              payload: { resnapshot: true }
              as: Pharmacist
              captures: { tp1_v2: $.data.version }
            - call: "PATCH /appointment-templates/${tp1}"
              payload: { resnapshot: true }
              as: Scheduler
              captures: { tp1_v3: $.data.version }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt2}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 4, premed_waived: false }
              as: MedicalDirector
              captures: { pl2: $.data.id, pl2_status: $.data.status }
            - call: "GET /infusion-centers/${ctr}/utilization"
              payload: { service_date: "2026-08-10", variant: "SCHEDULED" }
              as: Scheduler
              captures: { sched_pct_a: $.data.utilization_pct, sched_avail_a: $.data.available_chair_minutes, sched_count_a: $.data.appointment_count }
            - call: "GET /infusion-centers/${ctr}/utilization"
              payload: { service_date: "2026-08-10", variant: "SCHEDULED" }
              as: MedicalDirector
              captures: { sched_pct_b: $.data.utilization_pct, sched_avail_b: $.data.available_chair_minutes, sched_count_b: $.data.appointment_count }
            - call: "POST /appointments/${ap1}/reminders"
              payload: { channel: "SMS" }
              as: Scheduler
              captures: { rc1: $.data.id }
            - call: "POST /reminder-contacts/${rc1}/response"
              payload: { outcome: "CONFIRM_ATTENDANCE" }
              as: Patient
              as_user_id: "${pt1}"
              captures: { rc1_outcome: $.data.outcome }
            - call: "POST /appointments/${ap2}/reminders"
              payload: { channel: "VOICE" }
              as: Scheduler
              captures: { rc2: $.data.id }
            - call: "POST /reminder-contacts/${rc2}/response"
              payload: { outcome: "CONFIRM_ATTENDANCE" }
              as: Scheduler
              captures: { rc2_outcome: $.data.outcome }
            - call: "POST /appointments/${ap1}/cancel"
              payload: { reason: "Patient self-cancel" }
              as: Patient
              as_user_id: "${pt1}"
              captures: { ap1_cancelled: $.data.schedule_status, ap1_charge: $.data.cancellation_charge_cents }
            - call: "POST /appointments/${ap2}/cancel"
              payload: { reason: "Front-desk cancel" }
              as: Scheduler
              captures: { ap2_cancelled: $.data.schedule_status, ap2_charge: $.data.cancellation_charge_cents }
            - call: "GET /infusion-centers/${ctr}/utilization"
              payload: { service_date: "2026-08-10", variant: "SCHEDULED" }
              as: MedicalDirector
              captures: { sched_pct_after: $.data.utilization_pct }
          assert:
            - "${pl1_status} == 'ACTIVE' and ${pl2_status} == 'ACTIVE' — the identical create succeeded for the Scheduler and for the MedicalDirector"
            - "${tp2_status} == 'ACTIVE', ${tp2_admin} == 120 and ${tp2_acuity} == 3 — the Pharmacist's HIGH template copies the drug's minutes verbatim and adds the one-point HIGH acuity surcharge"
            - "${tp1_v2} == 2 and ${tp1_v3} == 3 — either peer's PATCH bumps the version, and the two bumps compose"
            - "${sched_pct_a} == 36.36 and ${sched_pct_b} == 36.36 (240 of 660 available chair minutes) with ${sched_avail_a} == 660 == ${sched_avail_b} and ${sched_count_a} == 1 == ${sched_count_b}"
            - "The two utilization response bodies are field-for-field identical: a shared computed read does not vary by reader"
            - "${rc1_outcome} == 'CONFIRM_ATTENDANCE' and ${rc2_outcome} == 'CONFIRM_ATTENDANCE' — the Patient answering their own SMS reminder and the Scheduler recording the voice answer are the same write"
            - "${ap1_cancelled} == 'CANCELLED' and ${ap2_cancelled} == 'CANCELLED' with ${ap1_charge} == 0 and ${ap2_charge} == 0 — nine days out, so no late fee either way"
            - "${sched_pct_after} == 0.00 — CANCELLED rows contribute zero occupied minutes"
            - "Chair.${ch1}.committed_minutes == 0 and Nurse.${nr1}.assigned_acuity_points == 0 after both cancels"
            - "GET /appointment-templates returns exactly 2 rows, one per dose_tier"

      - name: a_nurse_cannot_act_on_another_nurses_chair_side_assignment
