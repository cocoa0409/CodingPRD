      - name: supplier_rep_reads_outside_its_own_scope_are_forbidden
        claim_type: peer_role_isolation
        grounds:
          - roles.SupplierRep
          - validations[priority 2]
          - validations[priority 6]
          - errors[ERR_SUPPLIER_SCOPE_VIOLATION]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: >
          SupplierRep is entity_backed: its X-User-ID IS a Supplier.id, so the same route is legal or illegal
          depending on the row being read, and the two refusals must not be conflated. Reading another supplier's
          row or filtering the lot list by another supplier_id is a SCOPE violation (priority 6); touching a route
          the role does not appear on at all - the supplier collection, the tank-lot list, any POST - is a ROLE
          violation (priority 2). The unfiltered lot list is not an error at all: it silently narrows to the caller's
          own lots.
        test_recipe:
          setup:
            - "Supplier A is Meridian Controls with lot GV-880; supplier B is Aegis Safety with lot TP-150."
            - "The SupplierRep caller authenticates with X-User-ID equal to supplier A's id."
            - "SupplierRep appears only on GET /mfg/suppliers/{id}, GET /mfg/component-lots/{id} and GET /mfg/component-lots."
            - "The UUID 00000000-0000-4000-8000-0000000000ee is not a Supplier id."
          setup_api_calls:
            - call: "POST /mfg/suppliers"
              payload: { name: "Meridian Controls", component_category: "GAS_VALVE", audit_score: 96, defect_ppm: 1000, open_capa_count: 0 }
