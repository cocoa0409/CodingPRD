              payload: { program_code: "DSCR", name: "Investor DSCR", min_dscr: 1.1000, max_ltv_pct: 85.00, min_fico: 660, min_reserves_months: 6, min_residual_income_cents: 0, second_valuation_ltv_threshold_pct: 90.00, second_valuation_loan_amount_threshold_cents: 30000000, atr_exempt_flag: true, seasoning_matrix: { FORECLOSURE: 36, SHORT_SALE: 24, DEED_IN_LIEU: 24, BK_CH7: 24, BK_CH13: 12, MODIFICATION: 12, MORTGAGE_LATE_60: 12 } }
              as: ProgramAdmin
              captures: { prog_vv_id: "$.data.id" }
            - call: "POST /investor-overlays"
              payload: { investor_code: "INV-ATLAS", overlay_code: "OVL-LTV", rule_metric: "MAX_LTV_PCT", comparator: "LTE", threshold_value: 70.00, waivable_flag: true, required_authority_tier: 1, severity: "SIGNIFICANT" }
              as: ProgramAdmin
              captures: { ovl_ltv_id: "$.data.id" }
            - call: "POST /borrowers"
              payload: { legal_name: "Halberd Property Group LLC", fico_score: 752, self_employed_flag: false, entity_ownership_pct: 100.0, monthly_debt_obligations_cents: 0, verified_liquid_assets_cents: 3000000, age_years: 51 }
              as: LoanOfficer
              captures: { bor_vv_id: "$.data.id" }
            - call: "POST /loan-files"
              payload: { borrower_id: "${bor_vv_id}", program_id: "${prog_vv_id}", investor_code: "INV-ATLAS", loan_amount_cents: 40000000, property_value_cents: 55000000, occupancy: "INVESTMENT", purpose: "RATE_TERM_REFI", lien_position: "FIRST", note_rate_pct: 9.250, apor_pct: 6.100, term_months: 360, amortization_type: "INTEREST_ONLY", monthly_taxes_cents: 60000, monthly_insurance_cents: 18000, monthly_hoa_cents: 15000, gross_market_rent_cents: 420000, lease_rent_cents: 480000 }
              as: LoanOfficer
              captures: { lf_vv_id: "$.data.id" }
            - call: "POST /loan-files/${lf_vv_id}/doc-type-selection"
              payload: { doc_type: "DSCR" }
              as: Underwriter
              as_user_id: "uw-8"
            - call: "POST /loan-files/${lf_vv_id}/submit-to-underwriting"
              payload: {}
              as: LoanOfficer
            - call: "POST /exception-requests"
              payload: { loan_file_id: "${lf_vv_id}", overlay_id: "${ovl_ltv_id}", justification: "72.73 LTV with a 1.1960 DSCR and 7.48 months reserves" }
              as: Underwriter
              as_user_id: "uw-8"
              captures: { exc_vv_id: "$.data.id" }
            - call: "POST /exception-requests/${exc_vv_id}/decision"
              payload: { decision: "APPROVE", decision_reason: "Tier 1 committee approval at 72.73" }
              as: CreditCommittee
              as_user_id: "cc-1"
            - call: "POST /valuation-orders"
              payload: { loan_file_id: "${lf_vv_id}", valuation_type: "PRIMARY_APPRAISAL", vendor_code: "VND-ALPHA", effective_date: "2026-05-01T00:00:00Z" }
              as: AppraisalReviewer
              captures: { vo_vv_p_id: "$.data.id" }
            - call: "POST /valuation-orders/${vo_vv_p_id}/receive"
              payload: { appraised_value_cents: 55000000 }
              as: AppraisalReviewer
            - call: "POST /valuation-orders/${vo_vv_p_id}/decision"
              payload: { decision: "ACCEPTED" }
              as: AppraisalReviewer
            - call: "POST /valuation-orders"
              payload: { loan_file_id: "${lf_vv_id}", valuation_type: "SECOND_APPRAISAL", vendor_code: "VND-BETA", effective_date: "2026-06-01T00:00:00Z" }
              as: AppraisalReviewer
