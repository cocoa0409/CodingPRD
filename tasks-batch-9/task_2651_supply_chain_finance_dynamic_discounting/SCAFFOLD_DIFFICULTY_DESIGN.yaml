          assert:
            - "${abut_error} == ERR_SESSION_WINDOW_CONFLICT with HTTP 409: 12:00 < 12:00+60min and 09:00 < 15:00+60min, so an abutting window still conflicts"
            - "${gap30_error} == ERR_SESSION_WINDOW_CONFLICT: a 30-minute gap is inside the cooldown"
            - "${sess_d_status} == SCHEDULED: opens_at 13:00 is exactly 60 minutes after A's closes_at, and 13:00 < 13:00 is false, so a gap equal to the cooldown is legal"
            - "${sess_e_id} is created: the mirror-image test on the other side, since E closes at 08:00 and 09:00 < 08:00+60min is false"
            - "${sess_g_status} == CANCELLED"
            - "${sess_h_status} == SCHEDULED even though H is strictly inside G's window, because only SCHEDULED and LIVE sessions occupy the programme"
            - "GET /buyer-programs/${program_id}/auction-sessions returns 5 rows: A, D, E, the CANCELLED G and H, and none of the three rejections left a row behind"

      - name: funder_tranche_aggregate_capacity_over_closed_intervals
        grounds:
          - validations[priority=26]
          - calculations.funder_available_capital
          - entities.FunderCommitment.fields.effective_from
          - entities.FunderCommitment.fields.effective_to
          - state_machines.FunderCommitment.ACTIVE_to_EXPIRED
          - errors.ERR_FUNDER_CAPITAL_OVERCOMMITTED
        distinguishing_aspect: |
          A different resource entity (Funder) with the opposite interval semantics: FunderCommitment
          tranches use CLOSED intervals [effective_from, effective_to] and overlap is entirely legal
          - only the summed exposure at an instant may fail. 600000 + 400000 against a 1000000 limit
          overlaps happily at exact equality, one cent more is refused, a disjoint tranche is allowed
          while an overlapping one of the same size is not, and the closed upper bound means a tranche
          still counts on its effective_to date and only leaves the pool on the next sweep.
        test_recipe:
          setup:
            - "One ACTIVE funder with capital_limit_cents 1000000; logical clock at 2026-08-01T00:00:00Z"
            - "Tranche T1: 600000 over 2026-08-01..2026-08-31"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /funders"
              payload: { legal_name: "Tranche Stacking Fund", capital_limit_cents: 1000000, min_apr_bps: 500, fee_spread_bps: 0, max_single_invoice_cents: 900000 }
              as: PlatformOps
              captures: { funder_id: "$.data.id" }
            - call: "POST /funders/${funder_id}/commitments"
              payload: { committed_amount_cents: 600000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z" }
              as: Funder
              as_user_id: "${funder_id}"
              captures: { t1_id: "$.data.id" }
          trigger:
            - call: "POST /funders/${funder_id}/commitments"
              payload: { committed_amount_cents: 400001, effective_from: "2026-08-15T00:00:00Z", effective_to: "2026-09-15T00:00:00Z" }
              as: Funder
              as_user_id: "${funder_id}"
              captures: { over_error: "$.data.error_id" }
            - call: "POST /funders/${funder_id}/commitments"
              payload: { committed_amount_cents: 400000, effective_from: "2026-08-15T00:00:00Z", effective_to: "2026-09-15T00:00:00Z" }
              as: Funder
              as_user_id: "${funder_id}"
              captures: { t2_id: "$.data.id", t2_status: "$.data.status" }
            - call: "POST /funders/${funder_id}/commitments"
              payload: { committed_amount_cents: 700000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: Funder
              as_user_id: "${funder_id}"
              captures: { overlap_error: "$.data.error_id" }
            - call: "POST /funders/${funder_id}/commitments"
              payload: { committed_amount_cents: 700000, effective_from: "2026-09-16T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: Funder
              as_user_id: "${funder_id}"
              captures: { t5_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: PlatformOps
            - call: "GET /funders/${funder_id}"
              payload: {}
              as: PlatformOps
              captures: { avail_on_edge: "$.data.available_capital_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "GET /funders/${funder_id}"
              payload: {}
              as: PlatformOps
              captures: { avail_after_expiry: "$.data.available_capital_cents" }
            - call: "GET /funders/${funder_id}/commitments"
              payload: { status: "EXPIRED" }
              as: PlatformOps
              captures: { expired_id: "$.data[0].id" }
          assert:
            - "${over_error} == ERR_FUNDER_CAPITAL_OVERCOMMITTED with HTTP 409: at 2026-08-15 the sum would be 600000 + 400001 = 1000001 > 1000000"
            - "${t2_status} == ACTIVE: the same overlapping window at 400000 sums to exactly 1000000, and equality is allowed"
            - "${overlap_error} == ERR_FUNDER_CAPITAL_OVERCOMMITTED: at 2026-09-01 T2 still contributes 400000, so 400000 + 700000 = 1100000 fails even though T1 has ended"
            - "${t5_id} is created: the identical 700000 tranche starting 2026-09-16, one day after T2's closed upper bound, sums to 700000 and passes - overlap alone was never the problem"
            - "${avail_on_edge} == 1000000 at clock 2026-08-31, because committed_at uses a CLOSED interval and T1 still counts on its effective_to date"
            - "${avail_after_expiry} == 400000 at clock 2026-09-01: sweep step 5 expired T1 and only T2 covers the date (T5 has not started)"
            - "${expired_id} == ${t1_id} and GET /funders/${funder_id}/commitments?status=ACTIVE returns T2 and T5 only"

  - rule_id: compensating_invariant
    instances:
      - name: invoice_face_conservation_survives_failed_settlement_and_replacement
        grounds:
          - invariants.invoice_face_conservation
          - state_machines.EarlyPayment.DEPLOYED_to_VOID
          - entities.Invoice.fields.face_covered_cents
          - entities.Invoice.fields.remaining_face_cents
          - endpoints POST /early-payments/{id}/settlement/fail
        distinguishing_aspect: |
          Conserved quantity: gross invoice face. face_amount_cents must always equal
          remaining_face_cents plus the face covered by payments in {RESERVED, DEPLOYED, RELEASED}.
          The forward action drives it to 100000/0, POST /early-payments/{id}/settlement/fail is the
          compensator that must return it to 0/100000, and because the offer stays ACCEPTED a
          replacement payment re-covers the face without ever double-counting the failed row - the
          equality is checked at five points and must never leave a one-cent residue.
        test_recipe:
          setup:
            - "SELF_ONLY programme OPEN on a well-capitalised buyer; LIVE session; onboarded supplier"
            - "Invoice of face 100000, net_due_date 2026-09-30; offer at 1000 bps ACCEPTED with requested_pay_date 2026-08-05"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Face Conservation Buyer", tax_id: "189990001", credit_limit_cents: 100000000, self_funding_enabled: true }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
