# =============================================================================
# CDL & Truck-Driving School — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  CDL & Truck-Driving School: enrollment & DOT-medical/permit prerequisite,
  classroom + range + road clock-hours (ELDT), truck/instructor scheduling,
  skills-test & third-party examiner, job-placement & carrier sponsorship,
  financing/tuition reimbursement, endorsement (hazmat/tanker), completion &
  FMCSA reporting

domain_name: cdl-truck-driving-school
api_prefix: ""   # flat top-level resource collections (/programs, /trucks, /enrollments, ...); no shared path prefix

# Complexity profile -----------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit          # ELDT clock-hour mandates, prerequisite gates, FMCSA reporting
  secondary_archetype: temporal_windowing       # truck + instructor session scheduling with overlap/buffer rules
  complexity_layers:
    - optimistic_concurrency                    # OCC on Enrollment.version for finance-plan create-supersede
    - cascading_side_effects                    # prerequisite verify -> enrollment unlock -> session bookable; clawback chains
    - rate_threshold_triggers                   # ELDT hour thresholds (>= required) gate completion/skills-test
    - derived_field_reconciliation              # logged_*_hours / reserved minutes denormalized on parents

  entity_topology: hybrid
  # Enrollment is the hub; Truck / Instructor are peer resources scheduled by FK from ClockSession.
  state_machine_shape: branching
  # Enrollment branches (prerequisite reject/revert), SkillsTest cycles (FAIL -> retake), compound completion gate.

  relationship_patterns:
    - one_to_many        # Enrollment -> ClockSession, Enrollment -> SkillsTest, Enrollment -> EndorsementAdd
    - cross_aggregate    # ClockSession references Truck and Instructor across aggregate boundaries
    - self_referential   # SkillsTest.supersedes_test_id -> prior failed SkillsTest

  role_model: segregation_of_duties
  # A ThirdPartyExaminer may not examine a student whose road hours they personally logged as Instructor.
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Program name (e.g. 'Class A CDL ELDT')" }
      - { name: cdl_class, type: enum, source: input, description: "CLASS_A | CLASS_B", constraints: "one of CLASS_A, CLASS_B" }
      - { name: classroom_required_hours, type: number, source: input, description: "ELDT classroom (theory) clock-hours required", constraints: ">= 0" }
      - { name: range_required_hours, type: number, source: input, description: "ELDT range (BTW yard) clock-hours required", constraints: ">= 0" }
      - { name: road_required_hours, type: number, source: input, description: "ELDT public-road clock-hours required", constraints: ">= 0" }
      - { name: tuition_cents, type: integer, source: input, description: "Sticker tuition in integer cents", constraints: ">= 0" }
      - { name: skills_pass_threshold, type: number, source: input, default: 80, description: "Minimum weighted skills score to PASS", constraints: "0..100" }
      - { name: active, type: boolean, source: system, default: true, description: "Whether new enrollments may reference this program" }

  - name: Truck
    parent: null
    common_fields: true
    fields:
      - { name: unit_number, type: string, source: input, description: "Fleet unit identifier" }
      - { name: cdl_class, type: enum, source: input, description: "CLASS_A | CLASS_B — class this tractor is rated for", constraints: "one of CLASS_A, CLASS_B" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, default: 30, description: "Post-session unavailable buffer (cleaning/inspection) appended after each session end", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE — set at registration; the school keeps only in-service tractors in this benchmark", constraints: "one of AVAILABLE" }
      - { name: reserved_minutes, type: integer, source: computed, default: 0, description: "Sum of duration_minutes over this truck's BOOKED ClockSessions (conserved-quantity ledger)" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Instructor full name" }
      - { name: cdl_class, type: enum, source: input, description: "Highest CDL class certified to teach: CLASS_A covers CLASS_B", constraints: "one of CLASS_A, CLASS_B" }
      - { name: examiner_certified, type: boolean, source: input, default: false, description: "Whether this person is also a state-authorized third-party skills examiner" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE — set at registration; all instructors in this benchmark are active", constraints: "one of ACTIVE" }
      - { name: reserved_minutes, type: integer, source: computed, default: 0, description: "Sum of duration_minutes over this instructor's BOOKED ClockSessions (conserved-quantity ledger)" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; program the student is enrolled in" }
      - { name: student_name, type: string, source: input, description: "Student full legal name" }
      - { name: dot_medical_verified, type: boolean, source: system, default: false, description: "Set true when a DOT-medical PrereqDocument is APPROVED" }
      - { name: permit_verified, type: boolean, source: system, default: false, description: "Set true when a CLP (commercial learner permit) PrereqDocument is APPROVED" }
      - { name: status, type: enum, source: system, default: "APPLIED", description: "APPLIED | PREREQ_PENDING | TRAINING | TEST_READY | PASSED | COMPLETED | WITHDRAWN", constraints: "one of APPLIED, PREREQ_PENDING, TRAINING, TEST_READY, PASSED, COMPLETED, WITHDRAWN" }
      - { name: logged_classroom_hours, type: number, source: computed, default: 0, description: "Sum of duration hours over COMPLETED CLASSROOM ClockSessions (chronological / reportable variant)" }
      - { name: logged_range_hours, type: number, source: computed, default: 0, description: "Sum of duration hours over COMPLETED RANGE ClockSessions" }
      - { name: logged_road_hours, type: number, source: computed, default: 0, description: "Sum of duration hours over COMPLETED ROAD ClockSessions" }
      - { name: projected_road_hours, type: number, source: computed, default: 0, description: "Sum of duration hours over COMPLETED + BOOKED ROAD ClockSessions (forward-looking variant)" }
      - { name: sponsoring_carrier_id, type: string, source: system, description: "FK -> Carrier.id; carrier sponsoring this enrollment (null until a SponsorshipOffer is ACCEPTED)" }
      - { name: fmcsa_reported, type: boolean, source: computed, default: false, description: "True once a CompletionReport for this enrollment has been TRANSMITTED" }

  - name: PrereqDocument
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; enrollment this document belongs to" }
      - { name: kind, type: enum, source: input, description: "DOT_MEDICAL | CLP_PERMIT", constraints: "one of DOT_MEDICAL, CLP_PERMIT" }
      - { name: reference_code, type: string, source: input, description: "Document/permit reference number on file" }
      - { name: expires_on, type: datetime, source: input, description: "Document expiry instant (UTC)" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | APPROVED | REJECTED | EXPIRED", constraints: "one of SUBMITTED, APPROVED, REJECTED, EXPIRED" }

  - name: ClockSession
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; student receiving instruction" }
      - { name: truck_id, type: string, source: input, description: "FK -> Truck.id; tractor used (required for RANGE and ROAD; omitted for CLASSROOM)" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; instructor delivering the session" }
      - { name: phase, type: enum, source: input, description: "CLASSROOM | RANGE | ROAD", constraints: "one of CLASSROOM, RANGE, ROAD" }
      - { name: starts_at, type: datetime, source: input, description: "Session start instant (UTC)" }
      - { name: duration_minutes, type: integer, source: input, description: "Scheduled session length in minutes", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | COMPLETED | CANCELLED", constraints: "one of BOOKED, COMPLETED, CANCELLED" }

  - name: SkillsTest
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; candidate under test" }
      - { name: examiner_id, type: string, source: input, description: "FK -> Instructor.id; third-party examiner (must have examiner_certified=true)" }
      - { name: supersedes_test_id, type: string, source: system, description: "FK -> SkillsTest.id; prior FAILED test this retake replaces (null for first attempt)" }
      - { name: pre_trip_score, type: number, source: input, description: "Pre-trip inspection component score 0..100", constraints: "0..100" }
      - { name: basic_control_score, type: number, source: input, description: "Basic-control (range) component score 0..100", constraints: "0..100" }
      - { name: road_score, type: number, source: input, description: "On-road component score 0..100", constraints: "0..100" }
      - { name: weighted_score, type: number, source: computed, description: "0.3*pre_trip + 0.3*basic_control + 0.4*road, round half-up to 2dp" }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL — PASS iff weighted_score >= program.skills_pass_threshold", constraints: "one of PASS, FAIL" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | GRADED | VOIDED", constraints: "one of SCHEDULED, GRADED, VOIDED" }

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Sponsoring carrier name" }
      - { name: commitment_months, type: integer, source: input, description: "Months the sponsored graduate must drive for the carrier", constraints: "> 0" }
      - { name: reimbursement_cents, type: integer, source: input, description: "Tuition reimbursement the carrier funds on acceptance, in cents", constraints: ">= 0" }

  - name: SponsorshipOffer
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; targeted student" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; carrier extending the offer" }
      - { name: months_served, type: integer, source: system, default: 0, description: "Months the graduate has driven post-completion (advanced by /_clock or service ticks)" }
      - { name: clawback_cents, type: integer, source: computed, default: 0, description: "Computed reimbursement clawback on early FORFEITED exit" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED | ACCEPTED | DECLINED | FULFILLED | FORFEITED", constraints: "one of OFFERED, ACCEPTED, DECLINED, FULFILLED, FORFEITED" }

  - name: FinancePlan
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; student financing tuition" }
      - { name: term_months, type: integer, source: input, description: "Number of monthly installments", constraints: "1..36" }
      - { name: tuition_cents, type: integer, source: computed, description: "Snapshot of Program.tuition_cents at plan creation" }
      - { name: down_payment_cents, type: integer, source: computed, description: "Tiered down payment (see calc finance_schedule)" }
      - { name: financed_cents, type: integer, source: computed, description: "tuition_cents - down_payment_cents" }
      - { name: total_interest_cents, type: integer, source: computed, description: "Simple interest over the term (see calc finance_schedule)" }
      - { name: installment_cents, type: integer, source: computed, description: "Per-installment amount for the first term_months-1 installments" }
      - { name: final_installment_cents, type: integer, source: computed, description: "Last installment absorbing the rounding remainder" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUPERSEDED | CANCELLED", constraints: "one of ACTIVE, SUPERSEDED, CANCELLED" }

  - name: CompletionReport
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; graduate being reported to FMCSA" }
      - { name: reported_classroom_hours, type: number, source: computed, description: "Snapshot of Enrollment.logged_classroom_hours at transmit" }
      - { name: reported_range_hours, type: number, source: computed, description: "Snapshot of Enrollment.logged_range_hours at transmit" }
      - { name: reported_road_hours, type: number, source: computed, description: "Snapshot of Enrollment.logged_road_hours at transmit" }
      - { name: passing_test_id, type: string, source: computed, description: "FK -> SkillsTest.id; the PASS GRADED test that qualified the graduate" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | TRANSMITTED", constraints: "one of DRAFT, TRANSMITTED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Enrollment
    initial_state: APPLIED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: APPLIED
        to: PREREQ_PENDING
        trigger: "POST /enrollments/{id}/prereq-documents (first document submitted)"
        actor: Registrar
        preconditions: ["Enrollment.status == APPLIED"]
        side_effects: ["Enrollment moves to PREREQ_PENDING awaiting DOT-medical + permit approval"]

      - from: PREREQ_PENDING
        to: TRAINING
        trigger: "system (automatic when a PrereqDocument APPROVE makes both dot_medical_verified AND permit_verified true)"
        actor: system
        preconditions: ["dot_medical_verified == true", "permit_verified == true"]
        side_effects: ["Enrollment unlocks ClockSession booking (cascade hop 2 of prereq chain)"]

      - from: TRAINING
        to: PREREQ_PENDING
        trigger: "system (automatic when a PrereqDocument EXPIRE clears dot_medical_verified or permit_verified)"
        actor: system
        preconditions: ["dot_medical_verified == false OR permit_verified == false"]
        side_effects: ["All BOOKED ClockSessions for this enrollment auto-CANCELLED (cascade); truck/instructor reserved_minutes released"]
        note: "Revert branch — prerequisite lapse pulls the student out of training."

      - from: TRAINING
        to: TEST_READY
        trigger: "system (automatic when logged_classroom_hours, logged_range_hours, logged_road_hours each >= program requirement after a ClockSession COMPLETE)"
        actor: system
        preconditions:
          - "logged_classroom_hours >= Program.classroom_required_hours"
          - "logged_range_hours >= Program.range_required_hours"
          - "logged_road_hours >= Program.road_required_hours"
        side_effects: ["Enrollment becomes eligible to schedule a SkillsTest"]

      - from: TEST_READY
        to: TRAINING
        trigger: "system (automatic when a COMPLETED ClockSession is voided via cancel, dropping a logged total below requirement)"
        actor: system
        preconditions: ["any of logged_classroom_hours, logged_range_hours, logged_road_hours < requirement"]
        side_effects: ["Enrollment loses test eligibility"]
        note: "Compound gate re-evaluated downward."

      - from: TEST_READY
        to: PASSED
        trigger: "system (automatic when a SkillsTest GRADE yields outcome PASS)"
        actor: system
        preconditions: ["SkillsTest.outcome == PASS"]
        side_effects: ["Enrollment eligible for FMCSA completion reporting"]

      - from: PASSED
        to: COMPLETED
        trigger: "POST /enrollments/{id}/completion-reports then transmit"
        actor: SchoolAdmin
        preconditions: ["a CompletionReport for this enrollment is TRANSMITTED"]
        side_effects:
          - "fmcsa_reported set true"
          - "If an ACCEPTED SponsorshipOffer exists, its service clock begins"

      - from: APPLIED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Registrar
        preconditions: ["Enrollment.status NOT IN {COMPLETED}"]
        side_effects: ["All BOOKED ClockSessions auto-CANCELLED; reserved_minutes released; ACTIVE FinancePlan -> CANCELLED"]

      - from: PREREQ_PENDING
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Registrar
        preconditions: ["Enrollment.status NOT IN {COMPLETED}"]
        side_effects: ["All BOOKED ClockSessions auto-CANCELLED; reserved_minutes released; ACTIVE FinancePlan -> CANCELLED"]

      - from: TRAINING
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Registrar
        preconditions: ["Enrollment.status NOT IN {COMPLETED}"]
        side_effects:
          - "All BOOKED ClockSessions auto-CANCELLED (cascade hop 1: each release truck.reserved_minutes and instructor.reserved_minutes — hop 2)"
          - "ACTIVE FinancePlan -> CANCELLED"
          - "ACCEPTED SponsorshipOffer -> FORFEITED with clawback computed (cascade hop 1: clawback debits the sponsoring carrier ledger — hop 2)"

      - from: TEST_READY
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: Registrar
        preconditions: ["Enrollment.status NOT IN {COMPLETED}"]
        side_effects: ["All BOOKED ClockSessions auto-CANCELLED; ACTIVE FinancePlan -> CANCELLED; ACCEPTED SponsorshipOffer -> FORFEITED with clawback"]

  - entity: PrereqDocument
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /prereq-documents/{id}/approve"
        actor: Registrar
        preconditions: ["PrereqDocument.status == SUBMITTED", "expires_on > current clock time (ERR_DOCUMENT_EXPIRED)"]
        side_effects:
          - "If kind == DOT_MEDICAL: Enrollment.dot_medical_verified = true"
          - "If kind == CLP_PERMIT: Enrollment.permit_verified = true"
          - "May bubble Enrollment PREREQ_PENDING -> TRAINING when both flags become true"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /prereq-documents/{id}/reject"
        actor: Registrar
        preconditions: ["PrereqDocument.status == SUBMITTED"]
        side_effects: []

      - from: APPROVED
        to: EXPIRED
        trigger: "system (automatic on /_clock advance past expires_on, or POST /prereq-documents/{id}/expire)"
        actor: system
        preconditions: ["current clock time >= expires_on"]
        side_effects:
          - "If kind == DOT_MEDICAL: Enrollment.dot_medical_verified = false"
          - "If kind == CLP_PERMIT: Enrollment.permit_verified = false"
          - "May revert Enrollment TRAINING -> PREREQ_PENDING"

  - entity: ClockSession
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /clock-sessions/{id}/complete"
        actor: Instructor
        preconditions:
          - "ClockSession.status == BOOKED"
          - "Enrollment.status == TRAINING (ERR_ENROLLMENT_NOT_TRAINING)"
          - "starts_at + duration_minutes <= current clock time (ERR_SESSION_NOT_ELAPSED)"
        side_effects:
          - "Recompute Enrollment.logged_<phase>_hours (chronological variant)"
          - "May bubble Enrollment TRAINING -> TEST_READY when all three logged totals reach requirements"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /clock-sessions/{id}/cancel"
        actor: Instructor
        preconditions: ["ClockSession.status == BOOKED"]
        side_effects:
          - "truck.reserved_minutes -= duration_minutes (if truck set)"
          - "instructor.reserved_minutes -= duration_minutes"
          - "Recompute Enrollment.projected_<phase>_hours"

      - from: COMPLETED
        to: CANCELLED
        trigger: "POST /clock-sessions/{id}/cancel"
        actor: SchoolAdmin
        preconditions: ["ClockSession.status == COMPLETED", "Enrollment NOT IN {PASSED, COMPLETED} (ERR_SESSION_LOCKED)"]
        side_effects:
          - "Recompute Enrollment.logged_<phase>_hours downward"
          - "May revert Enrollment TEST_READY -> TRAINING"
        note: "Administrative void of a logged hour — compensating action for the COMPLETE transition."

  - entity: SkillsTest
    initial_state: SCHEDULED
    terminal_states: [VOIDED]
    transitions:
      - from: SCHEDULED
        to: GRADED
        trigger: "POST /skills-tests/{id}/grade"
        actor: ThirdPartyExaminer
        preconditions:
          - "SkillsTest.status == SCHEDULED"
          - "Enrollment.status == TEST_READY (ERR_ENROLLMENT_NOT_TEST_READY)"
        side_effects:
          - "Compute weighted_score and outcome (calc skills_weighted_score)"
          - "If outcome == PASS: bubble Enrollment TEST_READY -> PASSED"

      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /skills-tests/{id}/void"
        actor: SchoolAdmin
        preconditions: ["SkillsTest.status == SCHEDULED"]
        side_effects: []
        note: "A new retake SkillsTest after a FAIL sets supersedes_test_id to the prior GRADED-FAIL test (cyclic retake loop)."

  - entity: SponsorshipOffer
    initial_state: OFFERED
    terminal_states: [DECLINED, FULFILLED, FORFEITED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /sponsorship-offers/{id}/accept"
        actor: Registrar
        preconditions:
          - "SponsorshipOffer.status == OFFERED"
          - "Enrollment has no other ACCEPTED SponsorshipOffer (ERR_SPONSORSHIP_CONFLICT)"
        side_effects: ["Enrollment.sponsoring_carrier_id = carrier_id"]

      - from: OFFERED
        to: DECLINED
        trigger: "POST /sponsorship-offers/{id}/decline"
        actor: Registrar
        preconditions: ["SponsorshipOffer.status == OFFERED"]
        side_effects: []

      - from: ACCEPTED
        to: FULFILLED
        trigger: "system (automatic when months_served >= Carrier.commitment_months)"
        actor: system
        preconditions: ["months_served >= Carrier.commitment_months"]
        side_effects: ["clawback_cents set to 0; service obligation discharged"]

      - from: ACCEPTED
        to: FORFEITED
        trigger: "system (automatic when owning Enrollment WITHDRAWN) or POST /sponsorship-offers/{id}/forfeit"
        actor: SchoolAdmin
        preconditions: ["SponsorshipOffer.status == ACCEPTED"]
        side_effects: ["clawback_cents computed (calc reimbursement_clawback); Enrollment.sponsoring_carrier_id cleared"]

  - entity: FinancePlan
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when a newer FinancePlan is created for the same Enrollment)"
        actor: system
        preconditions: ["a newer ACTIVE FinancePlan now exists for the Enrollment"]
        side_effects: ["Prior plan frozen; newer plan governs tuition"]

      - from: ACTIVE
        to: CANCELLED
        trigger: "system (automatic when Enrollment is WITHDRAWN)"
        actor: system
        preconditions: ["owning Enrollment.status == WITHDRAWN"]
        side_effects: []

  - entity: CompletionReport
    initial_state: DRAFT
    terminal_states: [TRANSMITTED]
    transitions:
      - from: DRAFT
        to: TRANSMITTED
        trigger: "POST /completion-reports/{id}/transmit"
        actor: SchoolAdmin
        preconditions:
          - "CompletionReport.status == DRAFT"
          - "Enrollment.status == PASSED (ERR_ENROLLMENT_NOT_PASSED)"
          - "passing_test_id references a GRADED PASS SkillsTest"
        side_effects:
          - "Snapshot reported_*_hours from Enrollment logged totals"
          - "Enrollment.fmcsa_reported = true; bubble Enrollment PASSED -> COMPLETED"

# -----------------------------------------------------------------------------
# Table 1.2.1: Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: finance-plan-create-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /enrollments/{id}/finance-plans"
    occ_field: "expected_enrollment_version"
    description: |
      Creating a FinancePlan against an Enrollment whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A new ACTIVE FinancePlan legitimately supersedes the prior ACTIVE plan for
      the same Enrollment; the OCC guard ensures the writer's view of the
      Enrollment (and therefore which plan it is about to supersede) is current.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: eldt_logged_hours
    trigger: "ClockSession COMPLETE / administrative void (chronological reportable variant)"
    algorithm: chronological
    formula: |
      logged_classroom_hours = sum(duration_minutes / 60 for COMPLETED CLASSROOM sessions of enrollment)
      logged_range_hours     = sum(duration_minutes / 60 for COMPLETED RANGE     sessions of enrollment)
      logged_road_hours      = sum(duration_minutes / 60 for COMPLETED ROAD      sessions of enrollment)
      # Only COMPLETED sessions count; BOOKED and CANCELLED are excluded.
    input_set: "ClockSessions with status == COMPLETED for the enrollment, grouped by phase"
    precision: "hours to 2 decimal places, round_half_up"
    variants:
      - name: chronological_reportable
        when: "completion gate, FMCSA report snapshot"
        difference: "counts ONLY COMPLETED sessions — the verified, reportable total"

  - name: eldt_projected_hours
    trigger: "ClockSession create/cancel (forward-looking planning variant)"
    algorithm: forward_looking
    formula: |
      projected_road_hours = sum(duration_minutes / 60 for ROAD sessions of enrollment with status IN {BOOKED, COMPLETED})
      # Forward-looking: includes not-yet-delivered BOOKED road sessions to project whether the plan will reach the requirement.
    input_set: "ClockSessions with status IN {BOOKED, COMPLETED} and phase == ROAD for the enrollment"
    precision: "hours to 2 decimal places, round_half_up"
    variants:
      - name: forward_looking_projection
        when: "scheduling assistant — will the booked plan reach road_required_hours"
        difference: "counts BOOKED + COMPLETED, so for the SAME road sessions it exceeds the chronological logged total until each session is completed"

  - name: skills_weighted_score
    trigger: "SkillsTest GRADE"
    algorithm: weighted_scoring
    formula: |
      weighted_score = round_half_up(0.30*pre_trip_score + 0.30*basic_control_score + 0.40*road_score, 2)
      outcome = PASS if weighted_score >= Program.skills_pass_threshold else FAIL
      # Non-linear: three weighted inputs; the PASS/FAIL branch hinges on a >= threshold comparison.
    constants:
      W_PRE_TRIP: 0.30
      W_BASIC_CONTROL: 0.30
      W_ROAD: 0.40
    precision: "2 decimal places, round_half_up; pass test is weighted_score >= threshold (>= not >)"

  - name: finance_schedule
    trigger: "FinancePlan create"
    algorithm: tiered_pricing
    formula: |
      tuition_cents       = Program.tuition_cents                         # snapshot
      down_payment_pct    = 0.20 if tuition_cents >= DOWN_TIER_CENTS else 0.10   # tiered on tuition
      down_payment_cents  = round_half_up(tuition_cents * down_payment_pct)
      financed_cents      = tuition_cents - down_payment_cents
      total_interest_cents= round_half_up(financed_cents * MONTHLY_RATE * term_months)   # simple interest
      total_repay_cents   = financed_cents + total_interest_cents
      installment_cents   = floor(total_repay_cents / term_months)        # first (term_months-1) installments
      final_installment_cents = total_repay_cents - installment_cents * (term_months - 1)  # absorbs remainder
      # ROUNDING ORDER PINNED: floor the equal installment FIRST, then the FINAL installment absorbs the
      # leftover cents. "round each installment then sum" is NOT used — the remainder lands only on the last line.
    input_set: "Program.tuition_cents at plan creation, term_months from request"
    constants:
      DOWN_TIER_CENTS: 600000   # >= $6,000 tuition -> 20% down, else 10%
      MONTHLY_RATE: 0.01        # 1% simple interest per month
    precision: "integer cents; round_half_up on down payment and interest; floor on per-installment with remainder to final"

  - name: reimbursement_clawback
    trigger: "SponsorshipOffer FORFEIT (enrollment withdrawn after acceptance, before commitment served)"
    algorithm: decay_function
    formula: |
      remaining_months = Carrier.commitment_months - months_served
      if remaining_months <= 0:
        clawback_cents = 0
      else:
        clawback_cents = round_half_up(Carrier.reimbursement_cents * remaining_months / Carrier.commitment_months)
      # Linear decay of the carrier's clawback right as the graduate serves out the commitment.
    input_set: "Carrier.reimbursement_cents, Carrier.commitment_months, SponsorshipOffer.months_served at forfeit"
    precision: "integer cents, round_half_up"
    variants:
      - name: full_clawback_zero_service
        when: "months_served == 0"
        difference: "clawback_cents == reimbursement_cents (entire amount reclaimed)"

  - name: truck_reserved_minutes
    trigger: "ClockSession book/cancel/withdraw cascade (conserved-quantity ledger)"
    algorithm: aggregation
    formula: |
      Truck.reserved_minutes     = sum(duration_minutes for ClockSessions with status == BOOKED and truck_id == truck.id)
      Instructor.reserved_minutes= sum(duration_minutes for ClockSessions with status == BOOKED and instructor_id == instructor.id)
      # INVARIANT: book then cancel the same session leaves reserved_minutes unchanged vs pre-book.
    input_set: "ClockSessions with status == BOOKED, grouped by truck_id and by instructor_id"
    precision: "integer minutes (exact)"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, duration_minutes > 0, scores within 0..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "On finance-plan create, expected_enrollment_version equals Enrollment.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enrollments/{id}/finance-plans"

  - priority: 7
    category: business_safety
    check: "Approving an expired prerequisite document is forbidden (expires_on must be > current clock time)"
    error_id: ERR_DOCUMENT_EXPIRED
    http_status: 409
    applies_to: "POST /prereq-documents/{id}/approve"

  - priority: 8
    category: business_safety
    check: "ClockSession booking requires Enrollment.status == TRAINING (DOT-medical + permit verified)"
    error_id: ERR_PREREQ_NOT_MET
    http_status: 409
    applies_to: "POST /enrollments/{id}/clock-sessions"

  - priority: 9
    category: business_safety
    check: "Examiner segregation of duties: examiner_id must NOT have personally instructed any COMPLETED ROAD ClockSession of this enrollment"
    error_id: ERR_EXAMINER_CONFLICT
    http_status: 409
    applies_to: "POST /enrollments/{id}/skills-tests"

  - priority: 10
    category: business_safety
    check: "Skills examiner must be examiner_certified and certified for the program's cdl_class"
    error_id: ERR_EXAMINER_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /enrollments/{id}/skills-tests"

  - priority: 11
    category: business_referential
    check: "RANGE/ROAD ClockSession truck cdl_class must match Program.cdl_class; CLASSROOM forbids a truck_id"
    error_id: ERR_TRUCK_CLASS_MISMATCH
    http_status: 409
    applies_to: "POST /enrollments/{id}/clock-sessions"

  - priority: 12
    category: business_temporal
    check: "Truck busy interval is [starts_at, starts_at + duration + turnaround_buffer) half-open; a new BOOKED session whose [starts_at, starts_at+duration) overlaps an existing buffered interval on the same truck is rejected"
    error_id: ERR_TRUCK_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /enrollments/{id}/clock-sessions"

  - priority: 13
    category: business_temporal
    check: "Instructor busy interval is [starts_at, starts_at + duration) half-open (no buffer); a new session overlapping the instructor's existing BOOKED interval is rejected; back-to-back adjacency is allowed"
    error_id: ERR_INSTRUCTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /enrollments/{id}/clock-sessions"

  - priority: 14
    category: business_constraint
    check: "Skills test may only be scheduled when Enrollment.status == TEST_READY"
    error_id: ERR_ENROLLMENT_NOT_TEST_READY
    http_status: 409
    applies_to: "POST /enrollments/{id}/skills-tests, POST /skills-tests/{id}/grade"

  - priority: 15
    category: business_constraint
    check: "Enrollment must have no other ACCEPTED SponsorshipOffer when accepting one"
    error_id: ERR_SPONSORSHIP_CONFLICT
    http_status: 409
    applies_to: "POST /sponsorship-offers/{id}/accept"

  - priority: 16
    category: business_constraint
    check: "Completion report transmit requires Enrollment.status == PASSED"
    error_id: ERR_ENROLLMENT_NOT_PASSED
    http_status: 409
    applies_to: "POST /completion-reports/{id}/transmit"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Program ---
  - method: POST
    path: "/programs"
    description: "Create a training program (ELDT hour requirements + tuition)"
    roles: [SchoolAdmin]
    code: 201
    input: [name, cdl_class, classroom_required_hours, range_required_hours, road_required_hours, tuition_cents, "skills_pass_threshold?"]
    output: Program
    side_effects: ["active = true"]

  - method: GET
    path: "/programs/{id}"
    description: "Get a program"
    roles: [SchoolAdmin, Registrar, Instructor, ThirdPartyExaminer]
    code: 200
    input: []
    output: Program
    side_effects: []

  # --- Truck ---
  - method: POST
    path: "/trucks"
    description: "Register a training tractor"
    roles: [SchoolAdmin]
    code: 201
    input: [unit_number, cdl_class, "turnaround_buffer_minutes?"]
    output: Truck
    side_effects: ["status = AVAILABLE, reserved_minutes = 0"]

  - method: GET
    path: "/trucks/{id}"
    description: "Get a truck (includes reserved_minutes ledger)"
    roles: [SchoolAdmin, Registrar, Instructor]
    code: 200
    input: []
    output: Truck
    side_effects: []

  # --- Instructor ---
  - method: POST
    path: "/instructors"
    description: "Register an instructor (optionally examiner-certified)"
    roles: [SchoolAdmin]
    code: 201
    input: [full_name, cdl_class, "examiner_certified?"]
    output: Instructor
    side_effects: ["status = ACTIVE, reserved_minutes = 0"]

  - method: GET
    path: "/instructors/{id}"
    description: "Get an instructor (includes reserved_minutes ledger)"
    roles: [SchoolAdmin, Registrar, Instructor, ThirdPartyExaminer]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  # --- Carrier ---
  - method: POST
    path: "/carriers"
    description: "Register a sponsoring carrier"
    roles: [SchoolAdmin]
    code: 201
    input: [name, commitment_months, reimbursement_cents]
    output: Carrier
    side_effects: []

  - method: GET
    path: "/carriers/{id}"
    description: "Get a carrier"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  # --- Enrollment ---
  - method: POST
    path: "/enrollments"
    description: "Create an enrollment against a program"
    roles: [Registrar]
    code: 201
    input: [program_id, student_name]
    output: Enrollment
    side_effects: ["status = APPLIED; verified flags false"]

  - method: GET
    path: "/enrollments"
    description: "List enrollments, filterable by program_id or sponsoring_carrier_id"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: ["program_id?", "sponsoring_carrier_id?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: GET
    path: "/enrollments/{id}"
    description: "Get an enrollment (computed hour totals + status)"
    roles: [SchoolAdmin, Registrar, Instructor, ThirdPartyExaminer]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/withdraw"
    description: "Withdraw an enrollment (cancels sessions, cancels plan, forfeits sponsorship)"
    roles: [Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "status -> WITHDRAWN"
      - "all BOOKED ClockSessions -> CANCELLED; truck/instructor reserved_minutes released"
      - "ACTIVE FinancePlan -> CANCELLED"
      - "ACCEPTED SponsorshipOffer -> FORFEITED with clawback"

  # --- PrereqDocument ---
  - method: POST
    path: "/enrollments/{id}/prereq-documents"
    description: "Submit a DOT-medical or CLP permit document"
    roles: [Registrar]
    code: 201
    input: [kind, reference_code, expires_on]
    output: PrereqDocument
    side_effects: ["status = SUBMITTED; if Enrollment APPLIED -> PREREQ_PENDING"]

  - method: GET
    path: "/enrollments/{id}/prereq-documents"
    description: "List prerequisite documents for an enrollment (sub-resource form)"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: []
    output: PrereqDocument[]
    side_effects: []

  - method: GET
    path: "/prereq-documents"
    description: "List prerequisite documents, filterable by enrollment_id"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: ["enrollment_id?", "limit?", "offset?"]
    output: PrereqDocument[]
    side_effects: []

  - method: GET
    path: "/prereq-documents/{id}"
    description: "Get a prerequisite document"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: []
    output: PrereqDocument
    side_effects: []

  - method: POST
    path: "/prereq-documents/{id}/approve"
    description: "Approve a prerequisite document"
    roles: [Registrar]
    code: 200
    input: []
    output: PrereqDocument
    side_effects:
      - "status -> APPROVED; sets enrollment verified flag for kind"
      - "may bubble Enrollment PREREQ_PENDING -> TRAINING"

  - method: POST
    path: "/prereq-documents/{id}/reject"
    description: "Reject a prerequisite document"
    roles: [Registrar]
    code: 200
    input: []
    output: PrereqDocument
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/prereq-documents/{id}/expire"
    description: "Manually expire an approved prerequisite document"
    roles: [Registrar, SchoolAdmin]
    code: 200
    input: []
    output: PrereqDocument
    side_effects:
      - "status -> EXPIRED; clears enrollment verified flag for kind"
      - "may revert Enrollment TRAINING -> PREREQ_PENDING (cancels BOOKED sessions)"

  # --- ClockSession ---
  - method: POST
    path: "/enrollments/{id}/clock-sessions"
    description: "Book a classroom/range/road clock-hour session on a truck + instructor"
    roles: [Registrar, Instructor]
    code: 201
    input: [phase, instructor_id, "truck_id?", starts_at, duration_minutes]
    output: ClockSession
    side_effects:
      - "status = BOOKED"
      - "truck.reserved_minutes += duration_minutes (if truck set); instructor.reserved_minutes += duration_minutes"
      - "recompute Enrollment.projected_road_hours"

  - method: GET
    path: "/enrollments/{id}/clock-sessions"
    description: "List clock sessions for an enrollment (sub-resource form)"
    roles: [SchoolAdmin, Registrar, Instructor]
    code: 200
    input: []
    output: ClockSession[]
    side_effects: []

  - method: GET
    path: "/clock-sessions"
    description: "List clock sessions, filterable by truck_id, instructor_id, or enrollment_id"
    roles: [SchoolAdmin, Registrar, Instructor]
    code: 200
    input: ["truck_id?", "instructor_id?", "enrollment_id?", "limit?", "offset?"]
    output: ClockSession[]
    side_effects: []

  - method: GET
    path: "/clock-sessions/{id}"
    description: "Get a clock session"
    roles: [SchoolAdmin, Registrar, Instructor]
    code: 200
    input: []
    output: ClockSession
    side_effects: []

  - method: POST
    path: "/clock-sessions/{id}/complete"
    description: "Mark a clock session completed (logs hours)"
    roles: [Instructor]
    code: 200
    input: []
    output: ClockSession
    side_effects:
      - "status -> COMPLETED"
      - "recompute Enrollment.logged_<phase>_hours; may bubble TRAINING -> TEST_READY"

  - method: POST
    path: "/clock-sessions/{id}/cancel"
    description: "Cancel a booked session, or administratively void a completed one"
    roles: [Instructor, SchoolAdmin]
    code: 200
    input: []
    output: ClockSession
    side_effects:
      - "status -> CANCELLED"
      - "release reserved_minutes (from BOOKED) or recompute logged hours downward (from COMPLETED)"
      - "may revert Enrollment TEST_READY -> TRAINING"

  # --- SkillsTest ---
  - method: POST
    path: "/enrollments/{id}/skills-tests"
    description: "Schedule a third-party skills test (or retake superseding a prior FAIL)"
    roles: [Registrar]
    code: 201
    input: [examiner_id, "supersedes_test_id?"]
    output: SkillsTest
    side_effects: ["status = SCHEDULED"]

  - method: GET
    path: "/enrollments/{id}/skills-tests"
    description: "List skills tests for an enrollment (sub-resource form)"
    roles: [SchoolAdmin, Registrar, ThirdPartyExaminer]
    code: 200
    input: []
    output: SkillsTest[]
    side_effects: []

  - method: GET
    path: "/skills-tests"
    description: "List skills tests, filterable by enrollment_id, examiner_id, or supersedes_test_id"
    roles: [SchoolAdmin, Registrar, ThirdPartyExaminer]
    code: 200
    input: ["enrollment_id?", "examiner_id?", "supersedes_test_id?", "limit?", "offset?"]
    output: SkillsTest[]
    side_effects: []

  - method: GET
    path: "/skills-tests/{id}"
    description: "Get a skills test"
    roles: [SchoolAdmin, Registrar, ThirdPartyExaminer]
    code: 200
    input: []
    output: SkillsTest
    side_effects: []

  - method: POST
    path: "/skills-tests/{id}/grade"
    description: "Grade a skills test (examiner enters component scores)"
    roles: [ThirdPartyExaminer]
    code: 200
    input: [pre_trip_score, basic_control_score, road_score]
    output: SkillsTest
    side_effects:
      - "compute weighted_score, outcome; status -> GRADED"
      - "if PASS: bubble Enrollment TEST_READY -> PASSED"

  - method: POST
    path: "/skills-tests/{id}/void"
    description: "Void a scheduled skills test"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: SkillsTest
    side_effects: ["status -> VOIDED"]

  # --- SponsorshipOffer ---
  - method: POST
    path: "/enrollments/{id}/sponsorship-offers"
    description: "Extend a carrier sponsorship offer to a student"
    roles: [SchoolAdmin, Registrar]
    code: 201
    input: [carrier_id]
    output: SponsorshipOffer
    side_effects: ["status = OFFERED"]

  - method: GET
    path: "/enrollments/{id}/sponsorship-offers"
    description: "List sponsorship offers for an enrollment (sub-resource form)"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: []
    output: SponsorshipOffer[]
    side_effects: []

  - method: GET
    path: "/sponsorship-offers"
    description: "List sponsorship offers, filterable by enrollment_id or carrier_id"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: ["enrollment_id?", "carrier_id?", "limit?", "offset?"]
    output: SponsorshipOffer[]
    side_effects: []

  - method: GET
    path: "/sponsorship-offers/{id}"
    description: "Get a sponsorship offer"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: []
    output: SponsorshipOffer
    side_effects: []

  - method: POST
    path: "/sponsorship-offers/{id}/accept"
    description: "Accept a sponsorship offer (binds carrier to enrollment)"
    roles: [Registrar]
    code: 200
    input: []
    output: SponsorshipOffer
    side_effects: ["status -> ACCEPTED; Enrollment.sponsoring_carrier_id set"]

  - method: POST
    path: "/sponsorship-offers/{id}/decline"
    description: "Decline a sponsorship offer"
    roles: [Registrar]
    code: 200
    input: []
    output: SponsorshipOffer
    side_effects: ["status -> DECLINED"]

  - method: POST
    path: "/sponsorship-offers/{id}/forfeit"
    description: "Forfeit an accepted sponsorship (triggers clawback)"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: SponsorshipOffer
    side_effects: ["status -> FORFEITED; clawback_cents computed; Enrollment.sponsoring_carrier_id cleared"]

  # --- FinancePlan ---
  - method: POST
    path: "/enrollments/{id}/finance-plans"
    description: "Create a tuition finance plan (supersedes any prior ACTIVE plan; OCC-guarded)"
    roles: [Registrar]
    code: 201
    input: [term_months, expected_enrollment_version]
    output: FinancePlan
    side_effects:
      - "compute down_payment_cents, financed_cents, total_interest_cents, installment_cents, final_installment_cents (calc finance_schedule)"
      - "prior ACTIVE FinancePlan for this enrollment -> SUPERSEDED"
      - "increments Enrollment.version by 1"

  - method: GET
    path: "/enrollments/{id}/finance-plans"
    description: "List finance plans for an enrollment (sub-resource form)"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: []
    output: FinancePlan[]
    side_effects: []

  - method: GET
    path: "/finance-plans"
    description: "List finance plans, filterable by enrollment_id"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: ["enrollment_id?", "limit?", "offset?"]
    output: FinancePlan[]
    side_effects: []

  - method: GET
    path: "/finance-plans/{id}"
    description: "Get a finance plan"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: []
    output: FinancePlan
    side_effects: []

  # --- CompletionReport ---
  - method: POST
    path: "/enrollments/{id}/completion-reports"
    description: "Draft an FMCSA completion report for a PASSED enrollment"
    roles: [SchoolAdmin]
    code: 201
    input: [passing_test_id]
    output: CompletionReport
    side_effects: ["status = DRAFT; snapshots hour totals + passing_test_id"]

  - method: GET
    path: "/enrollments/{id}/completion-reports"
    description: "List completion reports for an enrollment (sub-resource form)"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: []
    output: CompletionReport[]
    side_effects: []

  - method: GET
    path: "/completion-reports"
    description: "List completion reports, filterable by enrollment_id or passing_test_id"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: ["enrollment_id?", "passing_test_id?", "limit?", "offset?"]
    output: CompletionReport[]
    side_effects: []

  - method: GET
    path: "/completion-reports/{id}"
    description: "Get a completion report"
    roles: [SchoolAdmin, Registrar]
    code: 200
    input: []
    output: CompletionReport
    side_effects: []

  - method: POST
    path: "/completion-reports/{id}/transmit"
    description: "Transmit the completion report to FMCSA (finalizes the graduate)"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: CompletionReport
    side_effects:
      - "status -> TRANSMITTED; Enrollment.fmcsa_reported = true; bubble Enrollment PASSED -> COMPLETED"

  # --- Test-driving clock endpoints ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to a given UTC instant (default at startup is 2026-04-01T00:00:00Z; the clock never falls back to wall-clock). Advancing past a PrereqDocument.expires_on may auto-EXPIRE it."
    roles: [SchoolAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "logical clock advanced"
      - "APPROVED PrereqDocuments past expires_on -> EXPIRED (clears verified flags, may revert enrollment)"

  - method: POST
    path: "/_clock/advance_service_months"
    description: "Advance an ACCEPTED SponsorshipOffer's months_served counter (simulates post-graduation service ticks). May auto-FULFILL when commitment is reached."
    roles: [SchoolAdmin]
    code: 200
    input: [offer_id, months]
    output: SponsorshipOffer
    side_effects:
      - "months_served += months; may auto-transition ACCEPTED -> FULFILLED"

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, invalid enum, duration_minutes <= 0, score outside 0..100" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_enrollment_version does not match Enrollment.version on finance-plan create (OCC)" }
  - { id: ERR_DOCUMENT_EXPIRED, http: 409, condition: "Approving a prerequisite document whose expires_on is at or before the current clock time" }
  - { id: ERR_PREREQ_NOT_MET, http: 409, condition: "Booking a clock session while Enrollment is not in TRAINING (DOT-medical + permit not both verified)" }
  - { id: ERR_EXAMINER_CONFLICT, http: 409, condition: "Examiner personally instructed a COMPLETED ROAD session of this enrollment (segregation of duties)" }
  - { id: ERR_EXAMINER_NOT_CERTIFIED, http: 409, condition: "Skills examiner is not examiner_certified or not certified for the program's cdl_class" }
  - { id: ERR_TRUCK_CLASS_MISMATCH, http: 409, condition: "RANGE/ROAD truck cdl_class does not match program; or CLASSROOM session supplied a truck_id" }
  - { id: ERR_TRUCK_DOUBLE_BOOKED, http: 409, condition: "Session overlaps an existing buffered busy interval on the same truck" }
  - { id: ERR_INSTRUCTOR_DOUBLE_BOOKED, http: 409, condition: "Session overlaps the instructor's existing busy interval" }
  - { id: ERR_ENROLLMENT_NOT_TRAINING, http: 409, condition: "Completing a clock session while the enrollment is not in TRAINING" }
  - { id: ERR_SESSION_NOT_ELAPSED, http: 409, condition: "Completing a clock session before starts_at + duration has elapsed on the clock" }
  - { id: ERR_SESSION_LOCKED, http: 409, condition: "Voiding a completed session is forbidden once the enrollment is PASSED or COMPLETED" }
  - { id: ERR_ENROLLMENT_NOT_TEST_READY, http: 409, condition: "Scheduling or grading a skills test while the enrollment is not TEST_READY" }
  - { id: ERR_SPONSORSHIP_CONFLICT, http: 409, condition: "Enrollment already has another ACCEPTED sponsorship offer" }
  - { id: ERR_ENROLLMENT_NOT_PASSED, http: 409, condition: "Transmitting a completion report while the enrollment is not PASSED" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: SchoolAdmin
    description: "School operator: configures programs/trucks/instructors/carriers, voids sessions/tests, drafts and transmits FMCSA reports, forfeits sponsorships."
    identity: "opaque"
    exclusive_operations:
      - "POST /programs — create program"
      - "POST /trucks — register truck"
      - "POST /instructors — register instructor"
      - "POST /carriers — register carrier"
      - "POST /skills-tests/{id}/void — void scheduled test"
      - "POST /sponsorship-offers/{id}/forfeit — forfeit sponsorship"
      - "POST /enrollments/{id}/completion-reports — draft FMCSA report"
      - "POST /completion-reports/{id}/transmit — transmit FMCSA report"
      - "POST /_clock/set_current_utc — set logical clock"
      - "POST /_clock/advance_service_months — advance service months"
    shared_operations:
      - "GET endpoints (read program/truck/instructor/carrier/enrollment/sessions/tests/offers/plans/reports)"
      - "POST /enrollments/{id}/sponsorship-offers — extend sponsorship offer (with Registrar)"
      - "POST /prereq-documents/{id}/expire — expire document (with Registrar)"
      - "POST /clock-sessions/{id}/cancel — administratively void a completed session (with Instructor)"

  - name: Registrar
    description: "Enrollment owner: creates enrollments, manages prerequisite documents, books sessions, schedules tests, manages sponsorship acceptance and finance plans, withdraws students."
    identity: "opaque"
    exclusive_operations:
      - "POST /enrollments — create enrollment"
      - "POST /enrollments/{id}/withdraw — withdraw enrollment"
      - "POST /enrollments/{id}/prereq-documents — submit document"
      - "POST /prereq-documents/{id}/approve — approve document"
      - "POST /prereq-documents/{id}/reject — reject document"
      - "POST /enrollments/{id}/skills-tests — schedule skills test"
      - "POST /sponsorship-offers/{id}/accept — accept sponsorship"
      - "POST /sponsorship-offers/{id}/decline — decline sponsorship"
      - "POST /enrollments/{id}/finance-plans — create finance plan"
    shared_operations:
      - "GET endpoints (read access to enrollment-scoped resources)"
      - "POST /enrollments/{id}/clock-sessions — book session (with Instructor)"
      - "POST /enrollments/{id}/sponsorship-offers — extend sponsorship offer (with SchoolAdmin)"
      - "POST /prereq-documents/{id}/expire — expire document (with SchoolAdmin)"

  - name: Instructor
    description: "Delivers classroom/range/road sessions; books, completes, and cancels booked sessions."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /clock-sessions/{id}/complete — complete a session (logs hours)"
    shared_operations:
      - "POST /enrollments/{id}/clock-sessions — book session (with Registrar)"
      - "POST /clock-sessions/{id}/cancel — cancel a booked session (with SchoolAdmin)"
      - "GET endpoints (read program/truck/instructor/enrollment/sessions)"

  - name: ThirdPartyExaminer
    description: "State-authorized third-party examiner: grades skills tests. Subject to segregation of duties (may not grade a student they instructed on the road)."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /skills-tests/{id}/grade — grade a skills test"
    shared_operations:
      - "GET endpoints (read program/instructor/enrollment/skills-tests)"
