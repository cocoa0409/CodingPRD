            - call: "POST /memberships/${mid}/activate"
              payload: { dues_cents: 6000 }
              as: MembershipClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-02T00:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /_sweeps/run"
              payload: {}
              as: FacilityAdmin
            - call: "GET /memberships/${mid}"
              payload: {}
              as: MembershipClerk
              captures: { st: $.data.status }
          assert:
            - "Membership.${mid}.status == EXPIRED"

      - name: cascade_show_cancel_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.ShowEvent.OPEN_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / show_cancel_cascade_booking_cascade_accommodation
          rationale: "The depth-3 show-cancel cascade is the named §1.8 transitive-cascade instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_seats_visible_in_same_response
        claim_type: immediate
        grounds: [entities.ShowEvent.fields.seats_sold, state_machines.ShowBooking.HELD_to_CANCELLED]
        distinguishing_aspect: "Creating a hold then GET /shows/{id} in a later call shows seats_sold==1 immediately (immediate consistency); cancelling shows seats_sold==0 immediately."
        test_recipe:
          setup: ["An OPEN show capacity 10."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Dome KK", venue_type: "DOME", seated_capacity: 10 }
              as: FacilityAdmin
              captures: { vid: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${vid}", title: "Imm", starts_at: "2026-05-26T10:00:00Z", ends_at: "2026-05-26T11:00:00Z", base_price_cents: 1000 }
              as: BoxOfficeOperator
              captures: { sid: $.data.id }
            - call: "POST /shows/${sid}/open"
              payload: {}
              as: BoxOfficeOperator
              captures: { sv: $.data.version }
            - call: "POST /show-bookings"
              payload: { show_event_id: "${sid}", party_size: 1, expected_show_version: "${sv}" }
              as: BoxOfficeOperator
              captures: { bid: $.data.id }
          trigger:
            - call: "GET /shows/${sid}"
              payload: {}
              as: BoxOfficeOperator
              captures: { seats: $.data.seats_sold }
          assert:
            - "ShowEvent.${sid}.seats_sold == 1"
