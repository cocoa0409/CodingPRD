            - "MonitoringStation.${st_q}.active_feed_count == 4, active_acuity_weight == 7.0, effective_span_limit == 1 — active_feed_count now legitimately exceeds declared_max_span 3 because the rule bounds simultaneous, not cumulative, feeds"
