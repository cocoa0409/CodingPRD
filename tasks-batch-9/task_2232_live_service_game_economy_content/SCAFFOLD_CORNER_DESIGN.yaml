      - name: corner_ep_conditional_action_resume_only_inside_window
        claim_type: Conditional action
        grounds:
          - endpoints["POST /offers/{offer_id}/availability"]
          - state_machines.Offer.SUSPENDED_to_LIVE
          - errors[ERR_OFFER_WINDOW_CLOSED]
        distinguishing_aspect: |
          Resuming a SUSPENDED offer is conditional on the sales window still being open: the
          offer whose window_end was 2026-08-10 is refused with ERR_OFFER_WINDOW_CLOSED at clock
          2026-08-15 and stays SUSPENDED, while its twin with window_end 2026-08-20 resumes to
          LIVE in the same instant.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "Offers SHORT_PACK (window ends 2026-08-10) and LONG_PACK (window ends 2026-08-20) are both APPROVED, published LIVE and then SUSPENDED at 2026-08-05."
            - "The clock is then moved to 2026-08-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
