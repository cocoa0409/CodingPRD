        distinguishing_aspect: |
          Entity pair HardwareUnit -> ArrayCircuit: the panel's own transition is legal in every
          respect (ON_ROOF, posture OPEN, correct actor) and fails only because the circuit it hangs
          on is still ENERGIZED, while an identical panel on the sibling ISOLATED circuit removes
          successfully in the same fixture. That isolates the dependency to the unit's own circuit
          rather than to any circuit of the project.
