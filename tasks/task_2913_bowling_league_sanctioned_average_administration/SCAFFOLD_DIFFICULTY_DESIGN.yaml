# ============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml - task 2913 (Bowling League & Sanctioned
# Average Administration). Sibling index to SCAFFOLD.yaml; every instance
# grounds in elements already declared in SCAFFOLD.yaml SS1.1-SS1.7 and adds
# no new behavior.
#
# Shared fixture vocabulary used by nearly every chain below ("CONFIG-B"):
#   handicap_base 220, handicap_percentage 0.90, handicap_percentage_youth 0.80,
#   max_handicap_per_game 60, handicap_average_basis CURRENT,
#   minimum_games_for_average 9, carryover_policy BLENDED, vacancy_average 120,
#   vacancy_score 120, absentee_deduction 10, lineup_positions 2,
#   legal_lineup_minimum 2, max_vacancy_slots_per_lineup 1,
#   weekly_dues_cents 1200, weekly_expense_cents 500, max_dues_arrears_weeks 2,
#   prize_place_weights [0.60, 0.40], declared_team_count 2, total_weeks 2.
# Every deviation from CONFIG-B is stated in that instance's setup:.
#
# Pinned literals recomputed from SS1.3 by code (bowling averages truncate):
#   entering handicaps at base 220 / 0.90 / cap 60:
#     180 -> 36, 195 -> 22, 170 -> 45, 160 -> 54
#   after certifying one 3-game match (BLENDED, prior 30 games, min_games 9):
#     ms1 (180, 540 pins) -> 180 -> 36 ; ms2 (195, 720) -> 199 -> 18
#     ms3 (170, 480)      -> 169 -> 45 ; ms4 (160, 450) -> 159 -> 54
#   waterfall on basis 2800 -> reserve 140, admin 80, net 2580, [1548, 1032]
#   waterfall on basis 5600 -> reserve 280, admin 160, net 5160, [3096, 2064]
#   waterfall on basis 3200 -> reserve 160, admin  91, net 2949, [1770, 1179]
# ============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  # RULE 1 - dual_variant_calc
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: handicap_basis_entering_vs_current_on_identical_certified_pins
        grounds:
          - calculations.bowler_handicap
          - calculations.bowler_average
          - state_machines.League.IN_SEASON_to_IN_SEASON
          - state_machines.Match.SCORES_ENTERED_to_CERTIFIED
          - entities.Membership.fields.handicap_per_game
          - entities.League.fields.handicap_average_basis
        distinguishing_aspect: |
          The bowler_handicap variants entering_basis and current_basis are read over one
          untouched certified data set: membership ${ms2_id} carries handicap_per_game 18
          while handicap_average_basis is CURRENT (current_average 199) and exactly 22
          after the bylaw amendment flips the basis to ENTERING (entering_average 195),
          a delta of 4 with no pin added or removed.
        test_recipe:
          setup:
            - "One league on CONFIG-B, status IN_SEASON, two CONFIRMED teams of two sanctioned adult bowlers each."
            - "Week 1 match certified: team 1 slots scored 540 and 720 scratch pins, team 2 slots 480 and 450."
            - "Because minimum_games_for_average is 9 and each bowler has 3 certified games, every average_status is PROVISIONAL and current_average is the BLENDED value over the 30 prior-season games."
            - "Logical clock at 2026-08-12T01:00:00Z, inside the 21-day remittance grace window that opened at bylaw adoption on 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: AssociationOfficer
            - call: "POST /members"
              payload: { full_name: "Ann Secretary", email: "sec@bowl.test", member_class: "ADULT" }
              as: AssociationOfficer
              captures: { sec_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Bob Treasurer", email: "tre@bowl.test", member_class: "ADULT" }
              as: AssociationOfficer
              captures: { tre_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Cara Captain", email: "cara@bowl.test", member_class: "ADULT" }
              as: AssociationOfficer
              captures: { m1_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Dan Bowler", email: "dan@bowl.test", member_class: "ADULT" }
              as: AssociationOfficer
              captures: { m2_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Eve Captain", email: "eve@bowl.test", member_class: "ADULT" }
              as: AssociationOfficer
              captures: { m3_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Fay Bowler", email: "fay@bowl.test", member_class: "ADULT" }
              as: AssociationOfficer
              captures: { m4_id: "$.data.id" }
            - call: "POST /leagues"
              payload: { name: "Tuesday Classic", season_year: 2026, center_name: "Cedar Lanes", declared_team_count: 2, organizational_meeting_at: "2026-08-05T00:00:00Z", secretary_member_id: "${sec_id}", treasurer_member_id: "${tre_id}" }
              as: LeagueSecretary
              as_user_id: "${sec_id}"
              captures: { lg_id: "$.data.id", lg_v1: "$.data.version" }
            - call: "POST /leagues/${lg_id}/bylaws"
              payload: { expected_league_version: "${lg_v1}", handicap_base: 220, handicap_percentage: 0.90, handicap_percentage_youth: 0.80, max_handicap_per_game: 60, handicap_average_basis: "CURRENT", minimum_games_for_average: 9, carryover_policy: "BLENDED", vacancy_average: 120, vacancy_score: 120, absentee_deduction: 10, lineup_positions: 2, legal_lineup_minimum: 2, max_vacancy_slots_per_lineup: 1, weekly_dues_cents: 1200, weekly_expense_cents: 500, max_dues_arrears_weeks: 2, prize_place_weights: [0.60, 0.40] }
              as: LeagueSecretary
              as_user_id: "${sec_id}"
              captures: { lg_v2: "$.data.version" }
            - call: "POST /teams"
              payload: { league_id: "${lg_id}", name: "Alley Cats" }
              as: LeagueSecretary
              as_user_id: "${sec_id}"
              captures: { t1_id: "$.data.id" }
            - call: "POST /teams"
