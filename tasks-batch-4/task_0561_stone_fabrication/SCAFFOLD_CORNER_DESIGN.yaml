  # =========================================================================
  # Cross-Cutting — Optimistic Concurrency (OCC)
  # =========================================================================
  - section: cross_cutting
    instances:
      - name: quote_create_stale_project_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[quote-create-stale-project]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After a first quote advances Project.version 1->2, a second quote create still carrying expected_project_version=1 returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["PREMIUM project at version 1; one quote already created (Project.version now 2)."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Xa", address: "24 X St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
          trigger:
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 45, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 1, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (http 412)"

      - name: change_order_create_stale_project_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[change-order-create-stale-project]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After a first change order advances Project.version, a second change-order create carrying the pre-advance expected_project_version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["PREMIUM project with a quote; Project.version captured as p_vc; one change order already created advancing the version."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Yo", address: "25 Y St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
              payload: { expected_project_version: "${p_v0}", est_sqft: 40, material_grade: "PREMIUM", edge_profile: "OGEE", edge_linear_ft: 25, sink_count: 2, faucet_count: 0, cooktop_count: 0 }
              as: SalesRep
            - call: "GET /projects/${p_id}"
              payload: {}
              as: SalesRep
              captures: { p_vc: $.data.version }
            - call: "POST /projects/${p_id}/change-orders"
              payload: { expected_project_version: "${p_vc}", description: "first", delta_cents: 1000, reopens_template: false }
              as: SalesRep
          trigger:
            - call: "POST /projects/${p_id}/change-orders"
              payload: { expected_project_version: "${p_vc}", description: "second stale", delta_cents: 2000, reopens_template: false }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION (http 412)"

      - name: project_version_increments_on_quote_create
        claim_type: optimistic_concurrency
        grounds: [entities.Project.fields.version, endpoints]
        distinguishing_aspect: "Creating a quote increments Project.version from 1 to 2 (observable via GET /projects/{id})."
        test_recipe:
          setup: ["PREMIUM project at version 1."]
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Ze", address: "26 Z St", material_grade: "PREMIUM" }
              as: SalesRep
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /projects/${p_id}/quotes"
