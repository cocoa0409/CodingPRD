          assert:
            - "TechnologyControlPlan.${tcp_id}.status == \"ACTIVE\" after SUSPENDED -> ACTIVE reinstatement"

      - name: inactive_entry_excluded_from_screening
        claim_type: precondition_enforcement
        grounds: [calculations.screening_match_score, state_machines.ScreeningListEntry.ACTIVE_to_INACTIVE]
        distinguishing_aspect: "Input-set filtering: an INACTIVE entry is excluded from the candidate set, so a party that exactly matches it screens CLEAR."
        test_recipe:
          setup: ["entry 'Dormant Trading Co' (DEU, RESTRICTED) created then deactivated before the party exists"]
          setup_api_calls:
            - call: "POST /compliance/screening-list-entries"
              payload: { list_source: "DENIED_PERSONS", match_name: "Dormant Trading Co", country_code: "DEU", severity: "RESTRICTED" }
              as: ComplianceDirector
              captures: { e_id: $.data.id }
            - call: "POST /compliance/screening-list-entries/${e_id}/set-status"
              payload: { to: "INACTIVE" }
              as: ComplianceDirector
            - call: "POST /compliance/parties"
              payload: { legal_name: "Dormant Trading Co", country_code: "DEU", city: "Koln", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
          trigger:
            - call: "POST /compliance/parties/${party_id}/screen"
