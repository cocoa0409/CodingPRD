      - name: sm_label_draft_withdrawn_on_new_draft
        claim_type: side_effect_execution
        grounds: [state_machines.LabelVersion.review_status=DRAFT_to_review_status=WITHDRAWN, "concurrency_rules[label-draft-create-stale-product]"]
        distinguishing_aspect: "Creating a second draft for the same product+market withdraws the existing DRAFT (system transition); the product version increments."
        test_recipe:
          setup: ["client, product, LOCKED recipe, panel, RACC, LV1 DRAFT"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv1: $.data.id } }
          trigger:
            - { call: "GET /api/products/${pid}", as: PlatformAdmin, captures: { pver2: $.data.version } }
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "SIMPLIFIED", declared_type_size_in: 0.0625, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pver2}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv2: $.data.id } }
            - { call: "GET /api/label-versions/${lv1}", as: PlatformAdmin, captures: { lv1_rs: $.data.review_status } }
          assert:
            - "lv1_rs == WITHDRAWN (system supersede on newer draft)"
            - "LabelVersion.${lv2}.review_status == DRAFT"
            - "pver2 == 2 (LV1 create bumped product) and Product.${pid}.version == 3 after LV2 create"

      - name: sm_entity_initial_states
        claim_type: initial_state
        grounds: [state_machines.Recipe, state_machines.LabelVersion, state_machines.MarketVariant, state_machines.ArtworkAudit]
        distinguishing_aspect: "Newly created entities start in their declared initial states: LabelVersion review_status DRAFT + release_status NOT_RELEASED + content READY + review_round 0; MarketVariant DRAFT."
        test_recipe:
          setup: ["client, product, LOCKED recipe, panel, RACC"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0, household_unit_name: "piece", household_unit_weight_g: 27.5 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id, pver: $.data.version } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id, r_status: $.data.status } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "US_FDA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
          trigger:
            - { call: "POST /api/products/${pid}/label-versions", payload: { market_code: "US_FDA", nutrient_basis: "DATABASE", racc_assignment_id: "${ra}", declared_format: "TABULAR", declared_type_size_in: 0.0625, ingredient_statement_text: "Wafers", contains_text: "Contains: None.", expected_product_version: "${pver}" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { lv_rs: $.data.review_status, lv_rel: $.data.release_status, lv_content: $.data.content_status, lv_rr: $.data.review_round, lv: $.data.id } }
            - { call: "POST /api/label-versions/${lv}/market-variants", payload: { market_code: "CA_CFIA", effective_start: "2026-09-01T00:00:00Z" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { mv_status: $.data.status } }
          assert:
            - "r_status == DRAFT at creation"
