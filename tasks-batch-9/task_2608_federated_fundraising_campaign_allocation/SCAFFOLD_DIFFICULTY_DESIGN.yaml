      - name: pledge_write_off_cascade_three_links_to_agency_passthrough
        grounds:
          - state_machines.Pledge.PARTIAL_to_WRITTEN_OFF
          - state_machines.PledgeDesignation.ACTIVE_to_UNCOLLECTED
          - calculations.pledge_designation_fee_allocation
          - entities.Pledge.fields.uncollected_amount
          - entities.PledgeDesignation.fields.collected_designated_amount
          - entities.Agency.fields.designated_passthrough_ytd
        distinguishing_aspect: |
          Depth-3 cascade whose triggering transition is Pledge PARTIAL -> WRITTEN_OFF - a
          different trigger from the certify-driven probation cascade: link 1 writes the pledge
          off and stamps uncollected_amount 750.00, link 2 is caused by link 1 and flips the
          pledge's ACTIVE designation line to UNCOLLECTED, link 3 is caused by link 2 leaving the
          ACTIVE set empty and recomputes Agency.designated_passthrough_ytd from 92.75 to 0.00.
          The agency ledger is never touched directly by the write-off call.
        test_recipe:
          setup:
            - "One GOOD_STANDING agency (certified review scoring 100.00)."
            - "One ACTIVE employer and one OPEN campaign."
            - "One CONFIRMED PAYROLL_DEDUCTION pledge of 1000.00 with a single ACTIVE designation of 400.00 to that agency (processing_fee 29.00, net_designated_amount 371.00)."
            - "One remittance of 250.00, so collection_status is PARTIAL, the line's collected_designated_amount is 92.75 and Agency.designated_passthrough_ytd is 92.75."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
