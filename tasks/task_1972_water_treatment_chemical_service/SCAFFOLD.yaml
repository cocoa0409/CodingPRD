scenario: "1972. Water-Treatment Chemical Service (industrial): system survey & program design, chemical feed rate & inventory telemetry, water testing route & result trending, corrosion/scale coupon program, Legionella risk management plan, blowdown & water-savings reporting, chemical delivery & tote exchange, service-contract vs product pricing"

domain_name: water-treatment-chemical-service
api_prefix: /wt

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 16
  state_machine_count: 12
  calculation_count: 9
  validation_layers: 6
  endpoint_count: 89
  error_code_count: 42
  role_count: 4

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Legal name of the industrial customer" }
      - { name: credit_hold, type: boolean, source: input, default: false, description: "When true, delivery scheduling is blocked (fiscal gate)" }
      - { name: billing_model, type: enum, source: input, default: "PRODUCT", description: "SERVICE_CONTRACT | PRODUCT — which invoice pricing variant applies to this account" }
      - { name: open_balance_cents, type: integer, source: computed, default: 0, description: "Sum of invoice_total_cents over Invoices with status IN {ISSUED, OVERDUE} for this account" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: SystemAsset
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; owning account" }
      - { name: asset_tag, type: string, source: input, description: "Human asset identifier (e.g. CT-1, BLR-2); unique per account" }
      - { name: asset_type, type: enum, source: input, description: "COOLING_TOWER | BOILER | CLOSED_LOOP" }
      - { name: recirculation_rate_gpm, type: number, source: input, description: "Design recirculation rate in gallons per minute; > 0" }
      - { name: system_volume_gal, type: number, source: input, description: "Total system water volume in gallons; > 0" }
      - { name: metallurgy, type: enum, source: input, description: "MILD_STEEL | COPPER_ALLOY | STAINLESS | GALVANIZED" }
      - { name: evaporation_factor, type: number, source: input, default: 0.0085, description: "Evaporation loss fraction of recirculation per 10F range; constant used by blowdown math" }
      - { name: drift_factor, type: number, source: input, default: 0.0002, description: "Drift loss fraction of recirculation rate" }
      - { name: target_coc, type: number, source: computed, default: 3.0, description: "Target cycles of concentration; baseline 3.0 until frozen by ACCEPTED ProgramDesign" }
      - { name: consecutive_out_of_range_count, type: integer, source: computed, default: 0, description: "Count of consecutive OUT_OF_RANGE WaterTestResults on this asset; reset to 0 by any IN_RANGE result" }
      - { name: posture, type: enum, source: computed, default: "COMPLIANT", description: "COMPLIANT | WATCH | NON_COMPLIANT | FROZEN — derived aggregate; gates child operations" }
      - { name: status, type: enum, source: system, description: "COMMISSIONING | IN_SERVICE | DECOMMISSIONED" }

  - name: ProgramDesign
    parent: SystemAsset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> SystemAsset.id; asset this program covers" }
      - { name: survey_notes, type: string, source: input, description: "Free-text survey findings recorded at SURVEYED" }
      - { name: proposed_coc, type: number, source: input, description: "Proposed target cycles of concentration; 1.5 <= proposed_coc <= 12.0" }
      - { name: inhibitor_target_ppm, type: number, source: input, description: "Target inhibitor residual in ppm; > 0" }
      - { name: ph_min, type: number, source: input, description: "Control range low for pH; 6.0 <= ph_min < ph_max <= 10.0" }
      - { name: ph_max, type: number, source: input, description: "Control range high for pH" }
      - { name: conductivity_max_umhos, type: integer, source: input, description: "Control range high for conductivity in umhos/cm; > 0" }
      - { name: service_rate_cents_per_month, type: integer, source: input, description: "Flat monthly service fee quoted on this design; >= 0" }
      - { name: revision_number, type: integer, source: computed, default: 1, description: "Increments by 1 each time the design cycles through REVISE_REQUESTED -> SURVEYED" }
      - { name: status, type: enum, source: system, description: "SURVEY_SCHEDULED | SURVEYED | DRAFTED | PROPOSED | REVISE_REQUESTED | ACCEPTED | SUPERSEDED | WITHDRAWN" }

  - name: ChemicalProduct
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Catalog SKU; unique" }
      - { name: active_pct, type: number, source: input, description: "Active ingredient fraction as percent; 0 < active_pct <= 100" }
      - { name: container_size_gal, type: number, source: input, description: "Tote/container nominal size in gallons; > 0" }
      - { name: unit_price_cents_per_gal, type: integer, source: input, description: "Product pricing: cents per gallon; >= 0" }
      - { name: contract_price_cents_per_gal, type: integer, source: input, description: "Service-contract discounted cents per gallon; >= 0 and <= unit_price_cents_per_gal" }
      - { name: density_g_per_ml, type: number, source: input, default: 1.0, description: "Product density used by feed-rate math" }
      - { name: status, type: enum, source: system, description: "LISTED | DELISTED" }

  - name: FeedStation
    parent: SystemAsset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> SystemAsset.id; asset this station feeds" }
      - { name: product_id, type: string, source: input, description: "FK -> ChemicalProduct.id; product this station doses" }
      - { name: feed_mode, type: enum, source: input, default: "CONTINUOUS", description: "CONTINUOUS | SHOT_FEED — selects feed-rate formula branch" }
      - { name: capacity_cap_ml_per_min, type: number, source: input, description: "Pump hardware cap; > 0" }
      - { name: setpoint_ml_per_min, type: number, source: computed, default: 0, description: "Current commanded feed rate; recomputed by feed_rate_setpoint calculation" }
      - { name: inventory_gal, type: number, source: computed, default: 0, description: "On-hand chemical inventory = sum delivered - sum returned residual - sum consumed from telemetry" }
      - { name: consumption_rate_gal_per_day, type: number, source: computed, default: 0, description: "Trailing 7-day consumption rate from telemetry" }
      - { name: projected_depletion_at, type: datetime, source: computed, description: "now + inventory_gal / consumption_rate_gal_per_day days; null when consumption_rate is 0" }
      - { name: last_telemetry_at, type: datetime, source: computed, description: "recorded_at of the most recent TelemetryReading; null before first reading" }
      - { name: status, type: enum, source: system, description: "OFFLINE | ONLINE | LOCKED_OUT" }

  - name: TelemetryReading
    parent: FeedStation
    common_fields: false
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> FeedStation.id; station that emitted the reading" }
      - { name: recorded_at, type: datetime, source: input, description: "Timestamp the reading was taken at the pump; must be <= current clock" }
      - { name: feed_pulses, type: integer, source: input, description: "Pump stroke count since previous reading; >= 0" }
      - { name: ml_per_pulse, type: number, source: input, description: "Calibration volume per pulse; > 0" }
      - { name: level_gal, type: number, source: input, description: "Ultrasonic level reading of tote in gallons; >= 0" }

  - name: TestRoute
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; account this route serves" }
      - { name: route_name, type: string, source: input, description: "Route label (e.g. NORTH-TUESDAY)" }
      - { name: status, type: enum, source: system, description: "PLANNED | PUBLISHED | COMPLETED | CANCELLED" }

  - name: RouteStop
    parent: TestRoute
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> TestRoute.id; owning route" }
      - { name: asset_id, type: string, source: input, description: "FK -> SystemAsset.id; asset visited at this stop" }
      - { name: window_start, type: datetime, source: input, description: "Visit window start, half-open [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Visit window end, exclusive; must be > window_start" }
      - { name: sequence_index, type: integer, source: input, description: "Order of stop on the route; >= 1; unique per route" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ARRIVED | SAMPLED | SKIPPED | MISSED" }

  - name: WaterTestResult
    parent: RouteStop
    common_fields: false
    fields:
      - { name: stop_id, type: string, source: input, description: "FK -> RouteStop.id; stop at which the sample was drawn" }
      - { name: asset_id, type: string, source: input, description: "FK -> SystemAsset.id; denormalized from stop.asset_id; must equal it" }
      - { name: ph, type: number, source: input, description: "Field-measured pH; 0 <= ph <= 14" }
      - { name: conductivity_umhos, type: integer, source: input, description: "Field-measured conductivity; > 0" }
      - { name: calcium_ppm, type: number, source: input, description: "Calcium hardness as CaCO3 ppm; > 0" }
      - { name: alkalinity_ppm, type: number, source: input, description: "M-alkalinity as CaCO3 ppm; > 0" }
      - { name: temperature_f, type: number, source: input, description: "Water temperature Fahrenheit; 32 < temperature_f < 212" }
      - { name: inhibitor_residual_ppm, type: number, source: input, description: "Measured inhibitor residual ppm; >= 0" }
      - { name: lab_tds_ppm, type: number, source: input, description: "Lab-confirmed TDS ppm; present only on CONFIRMED results" }
      - { name: lsi_provisional, type: number, source: computed, description: "Langelier Saturation Index from field values (TDS estimated = conductivity_umhos x 0.7)" }
      - { name: lsi_final, type: number, source: computed, description: "LSI recomputed from lab_tds_ppm at confirmation; null until CONFIRMED" }
      - { name: classification, type: enum, source: computed, description: "SCALE_FORMING | BALANCED | CORROSIVE — from lsi bands; provisional band until CONFIRMED" }
      - { name: range_status, type: enum, source: computed, description: "IN_RANGE | OUT_OF_RANGE vs the asset's ACTIVE/ACCEPTED control ranges" }
      - { name: status, type: enum, source: system, description: "RECORDED | CONFIRMED | VOIDED" }

  - name: CorrectiveAction
    parent: SystemAsset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> SystemAsset.id; asset needing correction" }
      - { name: triggering_result_id, type: string, source: input, description: "FK -> WaterTestResult.id; the 3rd consecutive OUT_OF_RANGE result that spawned this action" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the WaterChemist who recorded the triggering result; segregation-of-duties anchor" }
      - { name: setpoint_delta_ml_per_min, type: number, source: input, description: "Signed adjustment to apply to the asset's FeedStation setpoint on approval" }
      - { name: rationale, type: string, source: input, description: "Free-text justification" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | APPLIED | DECLINED" }

  - name: CouponRack
    parent: SystemAsset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> SystemAsset.id; asset whose sidestream hosts the rack" }
      - { name: rack_code, type: string, source: input, description: "Rack label; unique per asset" }
      - { name: position_count, type: integer, source: input, description: "Number of coupon positions; 1 <= position_count <= 8" }
      - { name: status, type: enum, source: system, description: "INSTALLED | ARCHIVED" }

  - name: CorrosionCoupon
    parent: CouponRack
    common_fields: true
    fields:
      - { name: rack_id, type: string, source: input, description: "FK -> CouponRack.id; hosting rack" }
      - { name: position_index, type: integer, source: input, description: "Slot on the rack; 1 <= position_index <= rack.position_count" }
      - { name: alloy, type: enum, source: input, description: "MILD_STEEL | COPPER | ADMIRALTY | STAINLESS_304" }
      - { name: density_g_cm3, type: number, source: input, description: "Alloy density used by mpy formula; > 0" }
      - { name: area_in2, type: number, source: input, description: "Exposed surface area in square inches; > 0" }
      - { name: pre_weight_g, type: number, source: input, description: "Coupon weight at install; > 0" }
      - { name: installed_at, type: datetime, source: input, description: "Install timestamp; closed-interval start" }
      - { name: removed_at, type: datetime, source: computed, description: "Removal timestamp; closed-interval end; null while INSTALLED" }
      - { name: post_weight_g, type: number, source: input, description: "Coupon weight at removal; > 0 and <= pre_weight_g + 2.0 (deposit allowance)" }
      - { name: exposure_days, type: integer, source: computed, description: "whole days between installed_at and removed_at (floor)" }
      - { name: corrosion_rate_mpy, type: number, source: computed, description: "(weight_loss_g x 22300) / (density_g_cm3 x area_in2 x exposure_days); null until REMOVED" }
      - { name: rating, type: enum, source: computed, description: "RELIABLE | UNRELIABLE — UNRELIABLE when exposure_days < 30" }
      - { name: status, type: enum, source: system, description: "INSTALLED | REMOVED" }

  - name: LegionellaRiskPlan
    parent: SystemAsset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> SystemAsset.id; asset under Legionella control" }
      - { name: plan_text, type: string, source: input, description: "Narrative control scheme" }
      - { name: validation_interval_days, type: integer, source: input, description: "Days between required validation sampling; 7 <= validation_interval_days <= 365" }
      - { name: last_validated_at, type: datetime, source: computed, description: "Timestamp of most recent VALIDATED transition; null before first validation" }
      - { name: validation_due_at, type: datetime, source: computed, description: "last_validated_at + validation_interval_days days (or activation + interval when never validated)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | VALIDATION_DUE | DELINQUENT | SUSPENDED" }

  - name: BlowdownEvent
    parent: SystemAsset
    common_fields: false
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> SystemAsset.id; asset blown down" }
      - { name: occurred_at, type: datetime, source: input, description: "When the blowdown occurred; must be <= current clock" }
      - { name: blowdown_gal, type: number, source: input, description: "Gallons discharged; > 0" }
      - { name: makeup_gal, type: number, source: input, description: "Gallons of makeup admitted for this event; > 0" }
      - { name: evaporation_gal, type: number, source: computed, description: "Computed evaporation allocation for the event window" }
      - { name: balance_residual_gal, type: number, source: computed, description: "makeup_gal - evaporation_gal - blowdown_gal - drift_gal; water-balance invariant probe" }

  - name: DeliveryOrder
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; billed account" }
      - { name: station_id, type: string, source: input, description: "FK -> FeedStation.id; destination station (determines product)" }
      - { name: quantity_gal, type: number, source: input, description: "Gallons to deliver; > 0; must be a whole multiple of product.container_size_gal" }
      - { name: scheduled_for, type: datetime, source: computed, description: "Planned delivery timestamp set at SCHEDULED" }
      - { name: delivered_gal, type: number, source: computed, description: "Gallons actually dropped at DELIVERED" }
      - { name: returned_residual_gal, type: number, source: computed, description: "Residual gallons in exchanged tote credited back at CLOSED" }
      - { name: auto_drafted, type: boolean, source: system, default: false, description: "True when created by the inventory-depletion cascade rather than a human" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING | SCHEDULED | IN_TRANSIT | DELIVERED | FAILED_DELIVERY | CLOSED | CANCELLED" }

  - name: Invoice
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; billed account" }
      - { name: period_start, type: datetime, source: input, description: "Billing window start, half-open [period_start, period_end)" }
      - { name: period_end, type: datetime, source: input, description: "Billing window end, exclusive; > period_start" }
      - { name: pricing_variant, type: enum, source: computed, description: "SERVICE_CONTRACT | PRODUCT — snapshot of account.billing_model at issue" }
      - { name: product_charges_cents, type: integer, source: computed, description: "Sum of rounded per-delivery line charges" }
      - { name: service_fee_cents, type: integer, source: computed, description: "Flat monthly fee component; 0 on PRODUCT variant" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "product_charges_cents + service_fee_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | OVERDUE | VOID" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: CustomerAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /wt/accounts/{accountId}/suspend
        actor: AccountManager
        preconditions:
          - "Account must be in ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "All non-terminal DeliveryOrders of this account (status IN {DRAFT, PENDING, SCHEDULED}) transition to CANCELLED with tote-allocation release"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /wt/accounts/{accountId}/reactivate
        actor: AccountManager
        preconditions:
          - "Account must be in SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: POST /wt/accounts/{accountId}/close
        actor: AccountManager
        preconditions:
          - "Account must be in ACTIVE (ERR_INVALID_STATE)"
          - "open_balance_cents must be exactly 0 (ERR_UNPAID_BALANCE)"
        side_effects:
          - "All SystemAssets of this account transition to DECOMMISSIONED"

  - entity: SystemAsset
    initial_state: COMMISSIONING
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: COMMISSIONING
        to: IN_SERVICE
        trigger: POST /wt/assets/{assetId}/commission
        actor: WaterChemist
        preconditions:
          - "Asset must be in COMMISSIONING (ERR_INVALID_STATE)"
          - "Asset must have at least one ProgramDesign in ACCEPTED status (ERR_NO_ACCEPTED_PROGRAM)"
          - "Asset must have at least one FeedStation in ONLINE status (ERR_NO_ONLINE_FEED_STATION)"
        side_effects:
          - "posture recomputed (starts COMPLIANT)"
      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: POST /wt/assets/{assetId}/decommission
        actor: WaterChemist
        preconditions:
          - "Asset must be in IN_SERVICE (ERR_INVALID_STATE)"
          - "No CorrosionCoupon on any rack of this asset in INSTALLED status (ERR_COUPONS_STILL_INSTALLED)"
          - "No RouteStop of this asset in SCHEDULED or ARRIVED status (ERR_OPEN_ROUTE_STOPS)"
        side_effects:
          - "All FeedStations of this asset transition to LOCKED_OUT"
          - "LegionellaRiskPlan of this asset transitions to SUSPENDED"
    # posture is a derived parallel dimension (posture_driven), recomputed on:
    #   WaterTestResult created (OUT_OF_RANGE => WATCH; count>=3 => NON_COMPLIANT),
    #   CorrectiveAction APPLIED (recompute), LegionellaRiskPlan -> DELINQUENT (=> NON_COMPLIANT),
    #   LegionellaRiskPlan -> SUSPENDED (=> FROZEN), account SUSPENDED (=> FROZEN),
    #   account reactivated / plan VALIDATED with count==0 (=> COMPLIANT).
    # FROZEN posture gates: no WaterTestResult, DeliveryOrder schedule, CorrectiveAction approve.

  - entity: ProgramDesign
    initial_state: SURVEY_SCHEDULED
    terminal_states: [ACCEPTED, WITHDRAWN]
    transitions:
      - from: SURVEY_SCHEDULED
        to: SURVEYED
        trigger: POST /wt/program-designs/{designId}/record-survey
        actor: WaterChemist
        preconditions:
          - "Design must be in SURVEY_SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []
      - from: SURVEYED
        to: DRAFTED
        trigger: POST /wt/program-designs/{designId}/draft
        actor: WaterChemist
        preconditions:
          - "Design must be in SURVEYED (ERR_INVALID_STATE)"
          - "proposed_coc, inhibitor_target_ppm, ph_min, ph_max, conductivity_max_umhos, service_rate_cents_per_month must all be set (ERR_INCOMPLETE_DESIGN)"
        side_effects: []
      - from: DRAFTED
        to: PROPOSED
        trigger: POST /wt/program-designs/{designId}/propose
        actor: WaterChemist
        preconditions:
          - "Design must be in DRAFTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: PROPOSED
        to: ACCEPTED
        trigger: POST /wt/program-designs/{designId}/accept
        actor: CustomerContact
        preconditions:
          - "Design must be in PROPOSED (ERR_INVALID_STATE)"
          - "X-User-ID must equal the design's asset's owning CustomerAccount.id (ERR_FORBIDDEN)"
          - "OCC: expected_program_design_version must equal design.version (ERR_STALE_VERSION)"
        side_effects:
          - "Any other ProgramDesign of the same asset in ACCEPTED status transitions to SUPERSEDED"
          - "asset.target_coc := proposed_coc (baseline freeze)"
          - "Every FeedStation of this asset: setpoint_ml_per_min recomputed via feed_rate_setpoint against the new target_coc"
          - "Every FeedStation of this asset: projected_depletion_at recomputed via inventory_depletion_projection"
          - "increments ProgramDesign.version by 1"
      - from: PROPOSED
        to: REVISE_REQUESTED
        trigger: POST /wt/program-designs/{designId}/request-revision
        actor: CustomerContact
        preconditions:
          - "Design must be in PROPOSED (ERR_INVALID_STATE)"
          - "X-User-ID must equal the design's asset's owning CustomerAccount.id (ERR_FORBIDDEN)"
        side_effects: []
      - from: REVISE_REQUESTED
        to: SURVEYED
        trigger: POST /wt/program-designs/{designId}/reopen-survey
        actor: WaterChemist
        preconditions:
          - "Design must be in REVISE_REQUESTED (ERR_INVALID_STATE)"
        side_effects:
          - "revision_number increments by 1"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (automatic when another ProgramDesign of the same asset is accepted)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PROPOSED
        to: WITHDRAWN
        trigger: POST /wt/program-designs/{designId}/withdraw
        actor: WaterChemist
        preconditions:
          - "Design must be in PROPOSED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: FeedStation
    initial_state: OFFLINE
    terminal_states: []
    transitions:
      - from: OFFLINE
        to: ONLINE
        trigger: POST /wt/feed-stations/{stationId}/bring-online
        actor: WaterChemist
        preconditions:
          - "Station must be in OFFLINE (ERR_INVALID_STATE)"
          - "Station's asset must not be DECOMMISSIONED (ERR_ASSET_DECOMMISSIONED)"
        side_effects: []
      - from: ONLINE
        to: LOCKED_OUT
        trigger: POST /wt/feed-stations/{stationId}/lockout
        actor: WaterChemist
        preconditions:
          - "Station must be in ONLINE (ERR_INVALID_STATE)"
        side_effects: []
      - from: LOCKED_OUT
        to: ONLINE
        trigger: POST /wt/feed-stations/{stationId}/bring-online
        actor: WaterChemist
        preconditions:
          - "Station must be in LOCKED_OUT (ERR_INVALID_STATE)"
          - "Station's asset must not be DECOMMISSIONED (ERR_ASSET_DECOMMISSIONED)"
        side_effects: []

  - entity: TestRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: PUBLISHED
        trigger: POST /wt/test-routes/{routeId}/publish
        actor: WaterChemist
        preconditions:
          - "Route must be in PLANNED (ERR_INVALID_STATE)"
          - "Route must contain at least one RouteStop in SCHEDULED status (ERR_EMPTY_ROUTE)"
        side_effects: []
      - from: PUBLISHED
        to: COMPLETED
        trigger: "system (automatic when every RouteStop of the route reaches SAMPLED, SKIPPED, or MISSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: POST /wt/test-routes/{routeId}/cancel
        actor: WaterChemist
        preconditions:
          - "Route must be in PLANNED or PUBLISHED (ERR_INVALID_STATE)"
        side_effects:
          - "All RouteStops of this route in SCHEDULED status transition to SKIPPED"
      - from: PUBLISHED
        to: CANCELLED
        trigger: POST /wt/test-routes/{routeId}/cancel
        actor: WaterChemist
        preconditions:
          - "Route must be in PLANNED or PUBLISHED (ERR_INVALID_STATE)"
        side_effects:
          - "All RouteStops of this route in SCHEDULED status transition to SKIPPED"

  - entity: RouteStop
    initial_state: SCHEDULED
    terminal_states: [SAMPLED, SKIPPED, MISSED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: POST /wt/route-stops/{stopId}/arrive
        actor: WaterChemist
        preconditions:
          - "Stop must be in SCHEDULED (ERR_INVALID_STATE)"
          - "Route must be in PUBLISHED (ERR_ROUTE_NOT_PUBLISHED)"
          - "current clock must be >= window_start and < window_end (ERR_OUTSIDE_VISIT_WINDOW)"
          - "Stop's asset posture must not be FROZEN (ERR_ASSET_FROZEN)"
        side_effects: []
      - from: ARRIVED
        to: SAMPLED
        trigger: "system (automatic when first WaterTestResult is recorded against this stop)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: MISSED
        trigger: POST /wt/route-stops/{stopId}/mark-missed
        actor: WaterChemist
        preconditions:
          - "Stop must be in SCHEDULED (ERR_INVALID_STATE)"
          - "current clock must be >= window_end (ERR_WINDOW_NOT_ELAPSED)"
        side_effects: []
      - from: SCHEDULED
        to: SKIPPED
        trigger: "system (cascade from route cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WaterTestResult
    initial_state: RECORDED
    terminal_states: [CONFIRMED, VOIDED]
    transitions:
      - from: RECORDED
        to: CONFIRMED
        trigger: POST /wt/water-test-results/{resultId}/confirm
        actor: WaterChemist
        preconditions:
          - "Result must be in RECORDED (ERR_INVALID_STATE)"
          - "lab_tds_ppm must be provided in the confirm payload (ERR_LAB_TDS_REQUIRED)"
        side_effects:
          - "lsi_final computed via lsi_saturation_index (finalized variant)"
          - "classification recomputed from lsi_final band"
      - from: RECORDED
        to: VOIDED
        trigger: POST /wt/water-test-results/{resultId}/void
        actor: WaterChemist
        preconditions:
          - "Result must be in RECORDED (ERR_INVALID_STATE)"
        side_effects:
          - "If this result had contributed range_status=OUT_OF_RANGE to the asset counter, decrement asset.consecutive_out_of_range_count by 1 (floor 0) and recompute asset.posture"
          - "If a CorrectiveAction in PENDING status lists this result as triggering_result_id, that action transitions to DECLINED"

  - entity: CorrectiveAction
    initial_state: PENDING
    terminal_states: [APPLIED, DECLINED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /wt/corrective-actions/{actionId}/approve
        actor: WaterChemist
        preconditions:
          - "Action must be in PENDING (ERR_INVALID_STATE)"
          - "X-User-ID must differ from recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Asset's LegionellaRiskPlan must not be in SUSPENDED (ERR_LEGIONELLA_PLAN_SUSPENDED)"
          - "Asset posture must not be FROZEN (ERR_ASSET_FROZEN)"
          - "OCC: expected_feed_station_version must equal the target station's version (ERR_STALE_VERSION)"
        side_effects: []
      - from: APPROVED
        to: APPLIED
        trigger: POST /wt/corrective-actions/{actionId}/apply
        actor: WaterChemist
        preconditions:
          - "Action must be in APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "Target FeedStation.setpoint_ml_per_min := clamp(setpoint + setpoint_delta_ml_per_min, 0, capacity_cap_ml_per_min)"
          - "FeedStation.consumption_rate_gal_per_day and projected_depletion_at recomputed"
          - "asset.consecutive_out_of_range_count reset to 0; asset.posture recomputed"
          - "If projected_depletion_at is within 14 days of current clock: auto-create DeliveryOrder(status=DRAFT, auto_drafted=true) for this station with quantity_gal = one container_size_gal"
      - from: PENDING
        to: DECLINED
        trigger: POST /wt/corrective-actions/{actionId}/decline
        actor: WaterChemist
        preconditions:
          - "Action must be in PENDING (ERR_INVALID_STATE)"
          - "X-User-ID must differ from recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

  - entity: CorrosionCoupon
    initial_state: INSTALLED
    terminal_states: [REMOVED]
    transitions:
      - from: INSTALLED
        to: REMOVED
        trigger: POST /wt/coupons/{couponId}/remove
        actor: WaterChemist
        preconditions:
          - "Coupon must be in INSTALLED (ERR_INVALID_STATE)"
          - "post_weight_g must be provided and <= pre_weight_g + 2.0 (ERR_COUPON_WEIGHT_GAIN)"
        side_effects:
          - "removed_at := current clock; exposure_days := floor((removed_at - installed_at) / 86400)"
          - "corrosion_rate_mpy computed via coupon_corrosion_rate"
          - "rating := RELIABLE if exposure_days >= 30 else UNRELIABLE"

  - entity: LegionellaRiskPlan
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /wt/legionella-plans/{planId}/activate
        actor: WaterChemist
        preconditions:
          - "Plan must be in DRAFT (ERR_INVALID_STATE)"
          - "Asset must be IN_SERVICE (ERR_ASSET_NOT_IN_SERVICE)"
        side_effects:
          - "validation_due_at := current clock + validation_interval_days days"
      - from: ACTIVE
        to: VALIDATION_DUE
        trigger: "system (automatic when current clock >= validation_due_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VALIDATION_DUE
        to: DELINQUENT
        trigger: POST /wt/legionella-plans/{planId}/declare-delinquent
        actor: WaterChemist
        preconditions:
          - "Plan must be in VALIDATION_DUE (ERR_INVALID_STATE)"
          - "current clock must be > validation_due_at + 14 days grace (ERR_GRACE_NOT_ELAPSED)"
        side_effects:
          - "asset.posture := NON_COMPLIANT (recomputed)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /wt/legionella-plans/{planId}/suspend
        actor: AccountManager
        preconditions:
          - "Plan must be in ACTIVE, VALIDATION_DUE, or DELINQUENT (ERR_INVALID_STATE)"
        side_effects:
          - "asset.posture := FROZEN (recomputed)"
      - from: VALIDATION_DUE
        to: SUSPENDED
        trigger: POST /wt/legionella-plans/{planId}/suspend
        actor: AccountManager
        preconditions:
          - "Plan must be in ACTIVE, VALIDATION_DUE, or DELINQUENT (ERR_INVALID_STATE)"
        side_effects:
          - "asset.posture := FROZEN (recomputed)"
      - from: DELINQUENT
        to: SUSPENDED
        trigger: POST /wt/legionella-plans/{planId}/suspend
        actor: AccountManager
        preconditions:
          - "Plan must be in ACTIVE, VALIDATION_DUE, or DELINQUENT (ERR_INVALID_STATE)"
        side_effects:
          - "asset.posture := FROZEN (recomputed)"
      - from: VALIDATION_DUE
        to: ACTIVE
        trigger: POST /wt/legionella-plans/{planId}/validate
        actor: WaterChemist
        preconditions:
          - "Plan must be in VALIDATION_DUE or DELINQUENT (ERR_INVALID_STATE)"
        side_effects:
          - "last_validated_at := current clock; validation_due_at := current clock + validation_interval_days days"
          - "asset.posture recomputed (may clear NON_COMPLIANT)"
      - from: DELINQUENT
        to: ACTIVE
        trigger: POST /wt/legionella-plans/{planId}/validate
        actor: WaterChemist
        preconditions:
          - "Plan must be in VALIDATION_DUE or DELINQUENT (ERR_INVALID_STATE)"
        side_effects:
          - "last_validated_at := current clock; validation_due_at := current clock + validation_interval_days days"
          - "asset.posture recomputed (may clear NON_COMPLIANT)"
      - from: SUSPENDED
        to: DRAFT
        trigger: POST /wt/legionella-plans/{planId}/return-to-draft
        actor: WaterChemist
        preconditions:
          - "Plan must be in SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "asset.posture recomputed (may clear FROZEN)"

  - entity: DeliveryOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING
        trigger: POST /wt/delivery-orders/{orderId}/submit
        actor: AccountManager
        preconditions:
          - "Order must be in DRAFT (ERR_INVALID_STATE)"
        side_effects: []
      - from: PENDING
        to: SCHEDULED
        trigger: POST /wt/delivery-orders/{orderId}/schedule
        actor: AccountManager
        preconditions:
          - "Order must be in PENDING (ERR_INVALID_STATE)"
          - "scheduled_for must be provided and strictly > current clock (ERR_SCHEDULE_IN_PAST)"
          - "Destination station's asset must have a ProgramDesign in ACCEPTED status (ERR_PROGRAM_NOT_ACCEPTED)"
          - "Account credit_hold must be false (ERR_CREDIT_HOLD)"
          - "Account status must be ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "OCC: expected_delivery_order_version must equal order.version (ERR_STALE_VERSION)"
        side_effects:
          - "scheduled_for := payload value"
          - "increments DeliveryOrder.version by 1"
      - from: SCHEDULED
        to: IN_TRANSIT
        trigger: POST /wt/delivery-orders/{orderId}/dispatch
        actor: AccountManager
        preconditions:
          - "Order must be in SCHEDULED (ERR_INVALID_STATE)"
          - "current clock must be >= scheduled_for (ERR_TOO_EARLY_TO_DISPATCH)"
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: POST /wt/delivery-orders/{orderId}/confirm-delivery
        actor: WaterChemist
        preconditions:
          - "Order must be in IN_TRANSIT (ERR_INVALID_STATE)"
          - "delivered_gal must be provided, > 0, and <= quantity_gal (ERR_DELIVERY_QUANTITY)"
        side_effects:
          - "delivered_gal := payload value"
          - "Destination FeedStation.inventory_gal += delivered_gal"
          - "FeedStation.projected_depletion_at recomputed"
      - from: IN_TRANSIT
        to: FAILED_DELIVERY
        trigger: POST /wt/delivery-orders/{orderId}/fail
        actor: WaterChemist
        preconditions:
          - "Order must be in IN_TRANSIT (ERR_INVALID_STATE)"
        side_effects: []
      - from: FAILED_DELIVERY
        to: SCHEDULED
        trigger: POST /wt/delivery-orders/{orderId}/schedule
        actor: AccountManager
        preconditions:
          - "Order must be in FAILED_DELIVERY (ERR_INVALID_STATE)"
          - "scheduled_for must be provided and strictly > current clock (ERR_SCHEDULE_IN_PAST)"
          - "Account credit_hold must be false (ERR_CREDIT_HOLD)"
          - "OCC: expected_delivery_order_version must equal order.version (ERR_STALE_VERSION)"
        side_effects:
          - "scheduled_for := payload value"
          - "increments DeliveryOrder.version by 1"
      - from: DELIVERED
        to: CLOSED
        trigger: POST /wt/delivery-orders/{orderId}/close
        actor: WaterChemist
        preconditions:
          - "Order must be in DELIVERED (ERR_INVALID_STATE)"
          - "returned_residual_gal must be provided, >= 0, and <= destination product.container_size_gal (ERR_RESIDUAL_EXCEEDS_CONTAINER)"
        side_effects:
          - "returned_residual_gal := payload value"
          - "Destination FeedStation.inventory_gal -= returned_residual_gal (tote exchange residual removed with old tote)"
          - "Tote-exchange mass invariant reconciled: sum(delivered_gal) - sum(returned_residual_gal) = consumed_gal + inventory_gal per station"
      - from: DRAFT
        to: CANCELLED
        trigger: POST /wt/delivery-orders/{orderId}/cancel
        actor: AccountManager
        preconditions:
          - "Order must be in DRAFT, PENDING, or SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "If order was SCHEDULED: tote allocation released (compensating side effect; no inventory was yet moved)"
      - from: PENDING
        to: CANCELLED
        trigger: POST /wt/delivery-orders/{orderId}/cancel
        actor: AccountManager
        preconditions:
          - "Order must be in DRAFT, PENDING, or SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /wt/delivery-orders/{orderId}/cancel
        actor: AccountManager
        preconditions:
          - "Order must be in DRAFT, PENDING, or SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "Tote allocation released (compensating side effect; no inventory was yet moved)"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: POST /wt/invoices/{invoiceId}/issue
        actor: AccountManager
        preconditions:
          - "Invoice must be in DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "pricing_variant := account.billing_model snapshot"
          - "invoice_total_cents computed via invoice_pricing"
          - "account.open_balance_cents += invoice_total_cents"
      - from: ISSUED
        to: PAID
        trigger: POST /wt/invoices/{invoiceId}/pay
        actor: CustomerContact
        preconditions:
          - "Invoice must be in ISSUED or OVERDUE (ERR_INVALID_STATE)"
          - "X-User-ID must equal the invoice's account id (ERR_FORBIDDEN)"
        side_effects:
          - "account.open_balance_cents -= invoice_total_cents"
      - from: ISSUED
        to: OVERDUE
        trigger: "system (automatic when current clock > period_end + 30 days and invoice unpaid)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: PAID
        trigger: POST /wt/invoices/{invoiceId}/pay
        actor: CustomerContact
        preconditions:
          - "Invoice must be in ISSUED or OVERDUE (ERR_INVALID_STATE)"
          - "X-User-ID must equal the invoice's account id (ERR_FORBIDDEN)"
        side_effects:
          - "account.open_balance_cents -= invoice_total_cents"
      - from: DRAFT
        to: VOID
        trigger: POST /wt/invoices/{invoiceId}/void
        actor: AccountManager
        preconditions:
          - "Invoice must be in DRAFT (ERR_INVALID_STATE)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: program-accept-stale-design
    parent_entity: ProgramDesign
    write_endpoint: "POST /wt/program-designs/{designId}/accept"
    occ_field: "expected_program_design_version"
    description: |
      Accepting a ProgramDesign with an expected_program_design_version that no
      longer equals the design's current version is rejected. This captures the
      case where another writer has just accepted a different design for the same
      asset (superseding this one's siblings and advancing versions), leaving
      this client's view of the design stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: corrective-approve-stale-station
    parent_entity: FeedStation
    write_endpoint: "POST /wt/corrective-actions/{actionId}/approve"
    occ_field: "expected_feed_station_version"
    description: |
      Approving a CorrectiveAction against a FeedStation whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just applied a setpoint change to the same
      station, so this client's intended delta is computed against a stale
      baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: delivery-schedule-stale-order
    parent_entity: DeliveryOrder
    write_endpoint: "POST /wt/delivery-orders/{orderId}/schedule"
    occ_field: "expected_delivery_order_version"
    description: |
      Scheduling (or rescheduling after FAILED_DELIVERY) a DeliveryOrder whose
      version has advanced since the client last observed it is rejected. This
      captures the case where another writer has just rescheduled the order and
      this client's chosen slot was computed from a stale order snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: lsi_saturation_index
    trigger: "WaterTestResult creation (provisional variant) and POST /wt/water-test-results/{resultId}/confirm (finalized variant)"
    algorithm: weighted_scoring
    formula: |
      A = (log10(TDS_ppm) - 1) / 10
      B = -13.12 * log10(temperature_c + 273) + 34.55      # temperature_c = (temperature_f - 32) * 5/9
      C = log10(calcium_ppm) - 0.4
      D = log10(alkalinity_ppm)
      pHs = (9.3 + A + B) - (C + D)
      LSI = ph - pHs
      classification: LSI >= 2.5 => SCALE_FORMING; LSI <= -2.5 => CORROSIVE; else BALANCED
      Boundary note: exactly 2.5 IS scale-forming (>=); exactly -2.5 IS corrosive (<=).
    input_set: "The single WaterTestResult being created/confirmed. Provisional variant: TDS_ppm = conductivity_umhos * 0.7 (estimated). Finalized variant: TDS_ppm = lab_tds_ppm (measured); all other inputs identical."
    constants:
      TDS_CONDUCTIVITY_FACTOR: 0.7
      SCALE_THRESHOLD: 2.5
      CORROSIVE_THRESHOLD: -2.5
    precision: "LSI stored to 2 decimal places, round_half_up; intermediate terms full double precision"
    variants:
      - name: provisional
        when: "at result creation, before lab TDS arrives"
        difference: "TDS_ppm estimated as conductivity_umhos * 0.7"
      - name: finalized
        when: "at confirm, lab TDS measured"
        difference: "TDS_ppm = lab_tds_ppm; produces a different LSI for identical field inputs whenever lab_tds_ppm != conductivity_umhos * 0.7"

  - name: feed_rate_setpoint
    trigger: "ProgramDesign accepted (baseline freeze), CorrectiveAction applied, FeedStation creation"
    algorithm: constraint_propagation
    formula: |
      # Combinatorial mode (a): 4 inputs with nested min/max and a mode branch.
      evaporation_gpm = recirculation_rate_gpm * evaporation_factor          # per 10F range, fixed at design
      drift_gpm = recirculation_rate_gpm * drift_factor
      blowdown_gpm = max(0, evaporation_gpm / (target_coc - 1) - drift_gpm)
      # continuous branch: dose proportional to blowdown volume
      continuous_ml_per_min = inhibitor_target_ppm * blowdown_gpm * 3785.411 / (active_pct * 100)
      # shot-feed branch: whole-day dose delivered in one daily shot
      shot_ml_per_min = inhibitor_target_ppm * blowdown_gpm * 3785.411 * 1440 / (active_pct * 100) / 1440
      raw = continuous_ml_per_min if feed_mode == CONTINUOUS else shot_ml_per_min
      setpoint_ml_per_min = min(capacity_cap_ml_per_min, max(0, raw))
      Evaluation order is pinned: evaporation -> drift -> blowdown -> raw (mode branch) -> clamp.
    input_set: "SystemAsset fields (recirculation_rate_gpm, evaporation_factor, drift_factor, target_coc), ACCEPTED ProgramDesign.inhibitor_target_ppm, ChemicalProduct.active_pct, FeedStation.feed_mode and capacity_cap_ml_per_min"
    constants:
      ML_PER_GAL: 3785.411
      MINUTES_PER_DAY: 1440
    precision: "4 decimal places, round_half_up"

  - name: cycles_blowdown_water_balance
    trigger: "BlowdownEvent creation; water-savings report read"
    algorithm: constraint_propagation
    formula: |
      # Combinatorial mode (c): circular-looking dependency pinned to a fixed evaluation order.
      # (1) evaporation allocated to the event window:
      evaporation_gal = recirculation_rate_gpm * evaporation_factor * event_window_minutes
      #     event_window_minutes = minutes since previous BlowdownEvent.occurred_at on the same asset
      #     (or since asset creation for the first event)
      # (2) drift:
      drift_gal = recirculation_rate_gpm * drift_factor * event_window_minutes
      # (3) achieved CoC for the window uses the ACTUAL logged blowdown:
      achieved_coc = makeup_gal / (blowdown_gal + drift_gal)        # blowdown_gal + drift_gal > 0 guaranteed by blowdown_gal > 0
      # (4) balance residual (invariant probe; MUST equal 0 within rounding):
      balance_residual_gal = round(makeup_gal - evaporation_gal - blowdown_gal - drift_gal, 2)
      # water_savings vs baseline CoC 3.0 over the same window:
      baseline_blowdown_gal = evaporation_gal / (BASELINE_COC - 1) - drift_gal
      saved_gal = max(0, baseline_blowdown_gal - blowdown_gal)
    input_set: "The BlowdownEvent being created plus its asset's recirculation_rate_gpm, evaporation_factor, drift_factor; window = (previous event's occurred_at, this event's occurred_at]"
    constants:
      BASELINE_COC: 3.0
      SECONDS_PER_DAY: 86400
    precision: "2 decimal places, round_half_up"

  - name: coupon_corrosion_rate
    trigger: "CorrosionCoupon removal"
    algorithm: aggregation
    formula: |
      weight_loss_g = pre_weight_g - post_weight_g
      exposure_days = floor((removed_at - installed_at) / 86400)
      corrosion_rate_mpy = (weight_loss_g * 22300) / (density_g_cm3 * area_in2 * exposure_days)
      rating = RELIABLE if exposure_days >= 30 else UNRELIABLE     # exactly 30 IS reliable
      Validation guard: exposure_days must be >= 1 (ERR_EXPOSURE_TOO_SHORT).
    input_set: "The single CorrosionCoupon being removed"
    constants:
      MPY_CONSTANT: 22300
      RELIABLE_MIN_DAYS: 30
    precision: "corrosion_rate_mpy stored to 3 decimal places, round_half_up"

  - name: consecutive_violation_escalation
    trigger: "WaterTestResult creation (range_status computed) and void"
    algorithm: threshold
    formula: |
      On create with range_status == OUT_OF_RANGE:
        asset.consecutive_out_of_range_count += 1
        if asset.consecutive_out_of_range_count >= ESCALATION_THRESHOLD:      # >= 3, not > 2
          create CorrectiveAction(status=PENDING, triggering_result_id=this result,
                                  recorded_by_user_id=current X-User-ID)
          asset.posture := NON_COMPLIANT
        else:
          asset.posture := WATCH (if currently COMPLIANT)
      On create with range_status == IN_RANGE:
        asset.consecutive_out_of_range_count := 0
        asset.posture recomputed (clears WATCH when no other drivers)
      Boundary: the 2nd consecutive violation does NOT escalate; the 3rd does.
    input_set: "WaterTestResult.range_status for the asset, in created_at order"
    constants:
      ESCALATION_THRESHOLD: 3

  - name: inventory_depletion_projection
    trigger: "TelemetryReading creation, DeliveryOrder confirm-delivery/close, ProgramDesign accept, CorrectiveAction apply"
    algorithm: forward_looking
    formula: |
      # Trailing 7-day window, half-open [now - 7d, now), ordered by recorded_at ASC,
      # tie-break created_at ASC (never id).
      window_readings = TelemetryReading of station with recorded_at in [now-7d, now)
      consumed_gal = sum(feed_pulses * ml_per_pulse) / ML_PER_GAL over window_readings
      span_days = 7 if earliest window reading exists else 0
      consumption_rate_gal_per_day = consumed_gal / span_days when span_days > 0 else 0
      inventory_gal = sum(delivered_gal over CLOSED/DELIVERED orders) - sum(returned_residual_gal over CLOSED orders) - lifetime_consumed_gal
      projected_depletion_at = now + inventory_gal / consumption_rate_gal_per_day days,
                               or null when consumption_rate_gal_per_day == 0
      Depletion-alert boundary: projected_depletion_at within DEPLETION_ALERT_DAYS of now
      (inclusive) triggers auto-draft DeliveryOrder on CorrectiveAction apply.
    input_set: "TelemetryReadings of the station in the trailing 7-day half-open window; all non-CANCELLED DeliveryOrders of the station"
    constants:
      WINDOW_DAYS: 7
      DEPLETION_ALERT_DAYS: 14
      ML_PER_GAL: 3785.411
    precision: "rate to 4 decimal places, round_half_up; projected_depletion_at to whole seconds"

  - name: invoice_pricing
    trigger: "Invoice issue"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (b): nested rounding. PINNED ORDER: round each line to
      # whole cents FIRST (round_half_up), THEN sum lines. Never sum raw then round.
      lines = DeliveryOrders of the account with status IN {DELIVERED, CLOSED}
              and scheduled_for in [period_start, period_end)
      PRODUCT variant:
        per line: line_cents = round_half_up(delivered_gal * unit_price_cents_per_gal, 0)
        product_charges_cents = sum(line_cents)
        service_fee_cents = 0
      SERVICE_CONTRACT variant:
        per line: line_cents = round_half_up(delivered_gal * contract_price_cents_per_gal, 0)
        product_charges_cents = sum(line_cents)
        service_fee_cents = service_rate_cents_per_month from the ACCEPTED ProgramDesign
                            of the destination station's asset (0 when none)
      invoice_total_cents = product_charges_cents + service_fee_cents
    input_set: "DeliveryOrders of the account with status IN {DELIVERED, CLOSED} and scheduled_for in [period_start, period_end); ChemicalProduct prices; ACCEPTED ProgramDesign service rate"
    constants: {}
    precision: "whole cents, round_half_up per line before summation (pinned)"
    variants:
      - name: product
        when: "account.billing_model == PRODUCT at issue time"
        difference: "unit_price_cents_per_gal per gallon, no monthly fee"
      - name: service_contract
        when: "account.billing_model == SERVICE_CONTRACT at issue time"
        difference: "contract_price_cents_per_gal per gallon PLUS flat service_rate_cents_per_month; identical delivery set yields a different invoice_total_cents"

  - name: route_window_overlap
    trigger: "RouteStop creation"
    algorithm: interval_merge
    formula: |
      # Half-open semantics: two stops on the SAME asset conflict iff
      # new.window_start < existing.window_end AND existing.window_start < new.window_end
      # Back-to-back adjacency (new.window_start == existing.window_end) is ALLOWED.
      # Only stops with status IN {SCHEDULED, ARRIVED} participate.
      conflict if any existing stop on same asset with:
        status IN {SCHEDULED, ARRIVED}
        AND new.window_start < existing.window_end
        AND existing.window_start < new.window_end
    input_set: "RouteStops of the same asset with status IN {SCHEDULED, ARRIVED}"
    constants: {}
    precision: "whole seconds"

  - name: coupon_interval_overlap
    trigger: "CorrosionCoupon creation"
    algorithm: interval_merge
    formula: |
      # Closed-interval semantics WITH mandatory re-passivation buffer on the same
      # rack position: a new coupon on position P conflicts with any existing coupon
      # on P whose [installed_at, removed_at] (removed_at = +inf while INSTALLED)
      # is within REPASSIVATION_BUFFER_DAYS of the new installed_at:
      #   conflict iff new.installed_at < existing.removed_at + REPASSIVATION_BUFFER_DAYS days
      # Unlike route windows, adjacency is NOT allowed: new.installed_at must be
      # >= existing.removed_at + buffer (a removed interval) and no INSTALLED
      # coupon may occupy the position at all.
      conflict if any existing coupon on same rack AND position_index with:
        existing.status == INSTALLED
        OR new.installed_at < existing.removed_at + REPASSIVATION_BUFFER_DAYS days
    input_set: "CorrosionCoupons of the same rack with the same position_index"
    constants:
      REPASSIVATION_BUFFER_DAYS: 7
    precision: "whole seconds"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role must be one of the declared roles and permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For CustomerContact, X-User-ID must equal the target resource's owning CustomerAccount.id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /wt/program-designs/{designId}/accept, POST /wt/program-designs/{designId}/request-revision, POST /wt/invoices/{invoiceId}/pay, and all CustomerContact GETs"

  - priority: 4
    category: existence
    check: "Every path id and every FK-valued body field must resolve to an existing resource, validated left-to-right as path segments first, then body fields in declared input order"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Request body must contain all required input fields with correct primitive types; enum values must be members of the declared enum set"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: state
    check: "Target resource must be in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "Cross-entity state gates: ERR_ROUTE_NOT_PUBLISHED (arrive requires route PUBLISHED), ERR_PROGRAM_NOT_ACCEPTED (delivery schedule requires ACCEPTED design), ERR_ACCOUNT_NOT_ACTIVE (schedule requires ACTIVE account), ERR_ASSET_NOT_IN_SERVICE (plan activate requires IN_SERVICE asset), ERR_ASSET_FROZEN (posture FROZEN gates arrive/approve/result-recording)"
    error_id: ERR_CROSS_ENTITY_STATE
    http_status: 409
    applies_to: "POST /wt/route-stops/{stopId}/arrive, POST /wt/delivery-orders/{orderId}/schedule, POST /wt/legionella-plans/{planId}/activate, POST /wt/corrective-actions/{actionId}/approve, POST /wt/route-stops/{stopId}/water-test-results"
    note: "Each gate has its own domain error_id per §1.2/§1.6; priority 7 is the shared ordering tier."

  - priority: 8
    category: business_safety
    check: "Legionella safety gates: ERR_LEGIONELLA_PLAN_SUSPENDED blocks corrective-action approval when the asset's plan is SUSPENDED; result recording on an asset with plan DELINQUENT still allowed but flags posture"
    error_id: ERR_LEGIONELLA_PLAN_SUSPENDED
    http_status: 409
    applies_to: "POST /wt/corrective-actions/{actionId}/approve"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: the X-User-ID approving/declining a CorrectiveAction must differ from recorded_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /wt/corrective-actions/{actionId}/approve, POST /wt/corrective-actions/{actionId}/decline"

  - priority: 10
    category: business_constraint
    check: "Field-range and shape constraints: proposed_coc in [1.5,12.0]; ph_min/ph_max band 6.0..10.0 with ph_min < ph_max; active_pct in (0,100]; contract_price <= unit_price; quantity_gal positive whole multiple of container_size_gal (ERR_QUANTITY_NOT_CONTAINER_MULTIPLE); sequence_index unique per route; position_index within rack.position_count; asset_tag unique per account; product_code unique"
    error_id: ERR_FIELD_CONSTRAINT
    http_status: 422
    applies_to: "all create endpoints"

  - priority: 11
    category: business_temporal
    check: "Temporal windows: arrive inside [window_start, window_end); mark-missed only after window_end; schedule scheduled_for strictly in future; dispatch not before scheduled_for; telemetry recorded_at <= now; blowdown occurred_at <= now and strictly after previous event on same asset (ERR_NON_MONOTONIC_EVENT); delinquent only after grace; coupon exposure >= 1 day (ERR_EXPOSURE_TOO_SHORT)"
    error_id: ERR_TEMPORAL_VIOLATION
    http_status: 422
    applies_to: "time-bearing endpoints"
    note: "Each temporal rule has its own domain error_id per §1.6; priority 11 is the shared ordering tier."

  - priority: 12
    category: business_constraint
    check: "Resource temporal-overlap: RouteStop windows on same asset (half-open, adjacency allowed) and CorrosionCoupon install intervals on same rack position (closed + 7-day buffer, adjacency forbidden)"
    error_id: ERR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /wt/test-routes/{routeId}/stops, POST /wt/racks/{rackId}/coupons"
    note: "ERR_WINDOW_CONFLICT for route stops; ERR_COUPON_INTERVAL_CONFLICT for coupons — same priority tier, different resources and interval semantics."

  - priority: 13
    category: business_referential
    check: "Referential integrity: stop.asset_id must equal result.asset_id (ERR_ASSET_MISMATCH); coupon rack must be INSTALLED not ARCHIVED (ERR_RACK_ARCHIVED); delivery station must exist and not be LOCKED_OUT (ERR_STATION_LOCKED_OUT); product must be LISTED (ERR_PRODUCT_DELISTED)"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 409
    applies_to: "POST /wt/route-stops/{stopId}/water-test-results, POST /wt/racks/{rackId}/coupons, POST /wt/delivery-orders"
    note: "Each rule has its own domain error_id per §1.6; priority 13 is the shared ordering tier."

  - priority: 14
    category: business_fiscal
    check: "Fiscal gates: credit_hold blocks delivery scheduling (ERR_CREDIT_HOLD); account close blocked while open_balance_cents != 0 (ERR_UNPAID_BALANCE)"
    error_id: ERR_CREDIT_HOLD
    http_status: 409
    applies_to: "POST /wt/delivery-orders/{orderId}/schedule, POST /wt/accounts/{accountId}/close"

  - priority: 15
    category: business_constraint
    check: "OCC optimistic concurrency: expected_<parent>_version must equal the parent's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /wt/program-designs/{designId}/accept, POST /wt/corrective-actions/{actionId}/approve, POST /wt/delivery-orders/{orderId}/schedule"

