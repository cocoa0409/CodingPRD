scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc: two calculations with two valid approaches
  # producing different results, on DIFFERENT entity domains.
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: proration_upgrade_optimistic_vs_final
        grounds:
          - calculations.proration_on_upgrade
          - calculations.proration_on_upgrade.variants.optimistic_estimate
          - calculations.proration_on_upgrade.variants.final_posting
        distinguishing_aspect: |
          Operates on the Subscription entity (pricing domain). The optimistic
          variant (preview) computes net_charge_cents using the request-time
          clock; the final variant (actual change-plan) computes it using the
          posting-time clock. When the logical clock is advanced by 1 day
          between preview and posting, the two computations differ by exactly
          the per-day rate differential — demonstrating two valid algorithms
          producing different results for identical entity inputs.
        test_recipe:
          setup:
            - "Plan BASIC: monthly_price_cents=3000, trial_days=0"
            - "Plan PREMIUM: monthly_price_cents=6000, trial_days=0"
            - "Account A1 with Subscription S1 on BASIC, ACTIVE, current period 2026-08-01..2026-08-31"
            - "Logical clock at 2026-08-11T00:00:00Z (10 days in, 20 remaining)"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/plans"
              payload: { plan_code: "PREMIUM", display_name: "Premium", tier: "PREMIUM", monthly_price_cents: 6000, trial_days: 0, max_profiles: 5, max_households: 2 }
              as: PlatformAdmin
              captures: { plan_premium_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a1@x.com", full_name: "A One", country_code: "US" }
              as: PlatformAdmin
              captures: { acc1_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc1_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub1_id: $.data.subscription_id, sub1_v: $.data.version }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/subscriptions/${sub1_id}/proration-preview"
              payload: { target_plan_id: "${plan_premium_id}" }
              as: PlatformAdmin
              captures: { preview_net: $.data.net_charge_cents }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/subscriptions/${sub1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sub1_v_now: $.data.version }
          trigger:
            - call: "POST /v1/subscriptions/${sub1_id}/change-plan"
              payload: { target_plan_id: "${plan_premium_id}", expected_subscription_version: "${sub1_v_now}" }
              as: PlatformAdmin
          assert:
            - "preview_net == 2000 (at 2026-08-11: days_remaining=20, days_in_period=30; round_half_up(3000*20/30)=2000 credit, round_half_up(6000*20/30)=4000 charge; net=2000)"
            - "BillingEvent on ${sub1_id} with event_type=CHARGE has amount_cents != preview_net (at 2026-08-12: days_remaining=19; credit=round_half_up(3000*19/30)=1900; charge=round_half_up(6000*19/30)=3800; net=1900)"

      - name: pause_credit_provisional_vs_final_clawback
        grounds:
          - calculations.proration_on_pause_credit
          - calculations.proration_on_pause_credit.variants.provisional_credit
          - calculations.proration_on_pause_credit.variants.final_clawback
        distinguishing_aspect: |
          Operates on the Subscription entity but in the time/credit domain
          (different domain from plan-upgrade pricing). The provisional variant
          posts a credit equal to the unused-days proration at pause time; the
          final variant recomputes the credit from the actual paused duration
          at resume time and posts a correcting delta. The two variants produce
          different credit amounts because resume occurs before period end.
        test_recipe:
          setup:
            - "Plan BASIC: monthly_price_cents=3000, trial_days=0"
            - "Account A2 with Subscription S2 on BASIC, ACTIVE, current period 2026-08-01..2026-08-31"
            - "Logical clock at 2026-08-11T00:00:00Z (20 days remaining)"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a2@x.com", full_name: "A Two", country_code: "US" }
              as: PlatformAdmin
              captures: { acc2_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc2_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub2_id: $.data.subscription_id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/subscriptions/${sub2_id}/pause"
              payload: { duration_months: 1 }
              as: PlatformAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/subscriptions/${sub2_id}/resume"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Pause posted a PRORATION_CREDIT BillingEvent with amount_cents == -2000 (3000 * 20/30)"
            - "Resume posts a correcting BillingEvent whose amount differs from the provisional credit (final clawback uses actual paused duration of 10 days, not 20)"
            - "The two BillingEvent rows exist on the same subscription with different amounts"

  # ==========================================================================
  # Rule 2 — combinatorial_formula: at least two combinatorial calculations
  # in DIFFERENT modes (a) / (b) / (c).
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: save_offer_discount_nonlinear_branches
        grounds:
          - calculations.save_offer_discount_price
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction.
          Result depends on (i) plan.monthly_price_cents, (ii) whether
          subscription.grandfathered_price_cents is null (a nullable branch),
          (iii) offer.discount_pct, with piecewise branches at 0 and 100. A
          grandfathered subscription at 5000c receiving a 50% discount produces
          2500c, while a non-grandfathered subscription on a 3000c plan
          produces 1500c — the presence/absence of the grandfathering field
          changes the base, and the boundary branches at discount_pct=0 and
          =100 alter behaviour non-linearly.
        test_recipe:
          setup:
            - "Plan PREMIUM: monthly_price_cents=6000, trial_days=0"
            - "Account A3 with Subscription S3 on PREMIUM, ACTIVE, grandfathered_price_cents=5000 (set by an earlier price change)"
            - "SaveOffer O3 DISCOUNT_50_3M targeting S3, PRESENTED"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "PREMIUM", display_name: "Premium", tier: "PREMIUM", monthly_price_cents: 6000, trial_days: 0, max_profiles: 5, max_households: 2 }
              as: PlatformAdmin
              captures: { plan_prem_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a3@x.com", full_name: "A Three", country_code: "US" }
              as: PlatformAdmin
              captures: { acc3_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc3_id}", plan_id: "${plan_prem_id}" }
              as: PlatformAdmin
              captures: { sub3_id: $.data.subscription_id }
            - call: "POST /v1/save-offers"
              payload: { subscription_id: "${sub3_id}", offer_type: "DISCOUNT_50_3M", discount_pct: 50, discount_duration_months: 3 }
              as: PlatformAdmin
              captures: { offer3_id: $.data.save_offer_id }
          trigger:
            - call: "POST /v1/save-offers/${offer3_id}/accept"
              payload: {}
              as: Subscriber
              as_user_id: "${acc3_id}"
          assert:
            - "Subscription.${sub3_id}.grandfathered_price_cents == 3000 (no prior lock → base=plan.monthly_price_cents=6000, 50% off → 3000)"

      - name: grandfathered_price_carryover_circular_order
        grounds:
          - calculations.grandfathered_price_carryover
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order.
          The new grandfathered_price_cents for a subscription depends on the
          notice's grandfather_period_months AND on the existing value of
          grandfathered_price_cents; the calculation must snapshot
          old_price_cents BEFORE deciding the new lock, otherwise the result
          is order-dependent. Two subscribers with identical plan and notice
          but different prior grandfathering state diverge: one keeps their
          prior lock, the other takes a new lock at old_price_cents.
        test_recipe:
          setup:
            - "Plan PREMIUM: monthly_price_cents=6000 (current)"
            - "Subscription S4 (no prior lock) and S5 (existing lock at 5000) both on PREMIUM, ACTIVE"
            - "PriceChangeNotice N1: old=6000, new=7000, grandfather_period_months=6, announced 2026-08-01, effective 2026-09-01"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "PREMIUM", display_name: "Premium", tier: "PREMIUM", monthly_price_cents: 6000, trial_days: 0, max_profiles: 5, max_households: 2 }
              as: PlatformAdmin
              captures: { plan_prem_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a4@x.com", full_name: "A Four", country_code: "US" }
              as: PlatformAdmin
              captures: { acc4_id: $.data.account_id }
            - call: "POST /v1/accounts"
              payload: { email: "a5@x.com", full_name: "A Five", country_code: "US" }
              as: PlatformAdmin
              captures: { acc5_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc4_id}", plan_id: "${plan_prem_id}" }
              as: PlatformAdmin
              captures: { sub4_id: $.data.subscription_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc5_id}", plan_id: "${plan_prem_id}" }
              as: PlatformAdmin
              captures: { sub5_id: $.data.subscription_id }
            - call: "POST /v1/price-change-notices"
              payload: { plan_id: "${plan_prem_id}", old_price_cents: 6000, new_price_cents: 7000, effective_at_utc: "2026-09-01T00:00:00Z", grandfather_period_months: 6 }
              as: PlatformAdmin
              captures: { notice_id: $.data.price_change_notice_id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/_sweeps/run"
              payload: { advance_to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/subscriptions/${sub4_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /v1/subscriptions/${sub5_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Plan.${plan_prem_id}.monthly_price_cents == 7000 (notice applied)"
            - "Subscription.${sub4_id}.grandfathered_price_cents == 6000 (new lock at old price, notice had grandfather_period_months=6)"
            - "Subscription.${sub5_id}.grandfathered_price_cents == 6000 (no prior lock; same new lock at old price)"

  # ==========================================================================
  # Rule 3 — non_linear_state_machine: at least two non-linear shapes on
  # DIFFERENT entities.
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_pause_resume_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - state_machines.Subscription.PAUSED_to_CANCELLED
        distinguishing_aspect: |
          Cyclic shape on Subscription: ACTIVE → PAUSED → ACTIVE → PAUSED → …
          allowed (subject to the 12-month cooldown rule). Additionally
          branches: PAUSED → CANCELLED and PAUSED → ACTIVE diverge with
          different side-effect sets (one terminates, the other posts a
          prorated CHARGE).
        test_recipe:
          setup:
            - "Plan BASIC: monthly_price_cents=3000, trial_days=0"
            - "Subscription S6 on BASIC, ACTIVE"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a6@x.com", full_name: "A Six", country_code: "US" }
              as: PlatformAdmin
              captures: { acc6_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc6_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub6_id: $.data.subscription_id }
          trigger:
            - call: "POST /v1/subscriptions/${sub6_id}/pause"
              payload: { duration_months: 1 }
              as: PlatformAdmin
            - call: "POST /v1/subscriptions/${sub6_id}/resume"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Subscription.${sub6_id}.subscription_status == ACTIVE after resume"
            - "Subscription cycled ACTIVE → PAUSED → ACTIVE"

      - name: subscription_parallel_billing_state_dimension
        grounds:
          - state_machines.Subscription.CURRENT_to_DUNNING
          - state_machines.Subscription.DUNNING_to_RECOVERED
          - state_machines.Subscription.RECOVERED_to_CURRENT
        distinguishing_aspect: |
          Parallel state dimensions on the same Subscription entity:
          subscription_status (TRIALING/ACTIVE/PAST_DUE/PAUSED/...) and
          billing_state (CURRENT/DUNNING/RECOVERED) evolve independently. A
          subscription can be subscription_status=PAUSED while billing_state
          transitions DUNNING→RECOVERED, and the two axes must compose
          correctly (PAUSED blocks retry logic).
        test_recipe:
          setup:
            - "Plan BASIC: monthly_price_cents=3000, trial_days=0"
            - "Subscription S7 ACTIVE, billing_state=CURRENT"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a7@x.com", full_name: "A Seven", country_code: "US" }
              as: PlatformAdmin
              captures: { acc7_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc7_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub7_id: $.data.subscription_id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/_sweeps/run"
              payload: { advance_to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc7_id}", subscription_id: "${sub7_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "ref-fail-1", notes: "simulated renewal failure" }
              as: PlatformAdmin
          assert:
            - "After CHARGE_FAILED sweep, Subscription.${sub7_id}.subscription_status == PAST_DUE AND Subscription.${sub7_id}.billing_state == DUNNING — two parallel axes both updated by one event"

  # ==========================================================================
  # Rule 4 — transitive_cascade: at least two cascades from different
  # triggers; one of depth >= 3, another of depth >= 2.
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dunning_exhaustion_cascade_to_account_and_profiles
        grounds:
          - state_machines.Subscription.PAST_DUE_to_EXPIRED
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - state_machines.Profile.ACTIVE_to_DEACTIVATED
        distinguishing_aspect: |
          Depth-3 cascade: Subscription PAST_DUE→EXPIRED (dunning exhausted)
          mutates Account (status → SUSPENDED, outstanding_balance_cents
          increased), which itself triggers Profile deactivation on every
          profile of the account. Each link is caused by the previous link,
          not by the original transition.
        test_recipe:
          setup:
            - "Plan BASIC 3000c, trial_days=0"
            - "Account A8 with Subscription S8 (PAST_DUE, dunning_attempt_count=4) and two Profiles P8a, P8b both ACTIVE"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a8@x.com", full_name: "A Eight", country_code: "US" }
              as: PlatformAdmin
              captures: { acc8_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc8_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub8_id: $.data.subscription_id }
            - call: "POST /v1/profiles"
              payload: { account_id: "${acc8_id}", display_name: "P8a", is_kids: false, household_id: "hh-1" }
              as: PlatformAdmin
              captures: { prof8a_id: $.data.profile_id }
            - call: "POST /v1/profiles"
              payload: { account_id: "${acc8_id}", display_name: "P8b", is_kids: false, household_id: "hh-1" }
              as: PlatformAdmin
              captures: { prof8b_id: $.data.profile_id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc8_id}", subscription_id: "${sub8_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f1", notes: "f1" }
              as: PlatformAdmin
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc8_id}", subscription_id: "${sub8_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f2", notes: "f2" }
              as: PlatformAdmin
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc8_id}", subscription_id: "${sub8_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f3", notes: "f3" }
              as: PlatformAdmin
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc8_id}", subscription_id: "${sub8_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f4", notes: "f4" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc8_id}", subscription_id: "${sub8_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f5", notes: "f5" }
              as: PlatformAdmin
            - call: "POST /v1/_sweeps/run"
              payload: { advance_to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Subscription.${sub8_id}.subscription_status == EXPIRED (5th failure triggers dunning exhaustion)"
            - "Account.${acc8_id}.account_status == SUSPENDED"
            - "Profile.${prof8a_id}.profile_status == DEACTIVATED"
            - "Profile.${prof8b_id}.profile_status == DEACTIVATED"

      - name: cancel_supersedes_presented_save_offer
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - state_machines.SaveOffer.PRESENTED_to_SUPERSEDED
        distinguishing_aspect: |
          Depth-2 cascade: cancelling a subscription mutates any PRESENTED
          SaveOffer on that subscription to SUPERSEDED. Different trigger
          from the dunning cascade (this one is subscriber-initiated cancel,
          not system-driven dunning exhaustion).
        test_recipe:
          setup:
            - "Plan BASIC 3000c"
            - "Subscription S9 ACTIVE; SaveOffer O9 PRESENTED on S9"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "a9@x.com", full_name: "A Nine", country_code: "US" }
              as: PlatformAdmin
              captures: { acc9_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc9_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub9_id: $.data.subscription_id }
            - call: "POST /v1/save-offers"
              payload: { subscription_id: "${sub9_id}", offer_type: "PAUSE_1M" }
              as: PlatformAdmin
              captures: { offer9_id: $.data.save_offer_id }
          trigger:
            - call: "POST /v1/subscriptions/${sub9_id}/cancel"
              payload: { cancel_reason: "USER_REQUESTED" }
              as: PlatformAdmin
          assert:
            - "Subscription.${sub9_id}.subscription_status == CANCELLED"
            - "SaveOffer.${offer9_id}.offer_status == SUPERSEDED"

  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict: at least two priority
  # conflicts across DIFFERENT error-category pairs.
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_plan_rule_on_change_plan
        grounds:
          - validations[priority=4]
          - validations[priority=8]
        distinguishing_aspect: |
          state (priority 4) vs business_constraint (priority 8) pairing. A
          change-plan call against a CANCELLED subscription that also targets
          an archived plan must surface ERR_INVALID_STATE (priority 4), not
          ERR_PLAN_RULE_VIOLATION (priority 8).
        test_recipe:
          setup:
            - "Plan BASIC 3000c; Plan OLD archived"
            - "Subscription S10 on BASIC, CANCELLED"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
