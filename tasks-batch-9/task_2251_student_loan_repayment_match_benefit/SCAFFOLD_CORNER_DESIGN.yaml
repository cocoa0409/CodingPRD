# =============================================================================
# §1.9 Scaffold Corner Design — task 2251 Student Loan Repayment Match Benefit
# Breadth probe over §1.1–§1.7. Taxonomy from references/claim-extraction-guide.md.
# Names are unique across this file AND SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  # Entities (§1.1) — creation, defaults, system fields, not-found, required
  # fields, type constraints, immutability, listing, flat-topology FK integrity
  # =========================================================================
  - section: entities
    instances:
      - name: corner_create_plan_year_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.PlanYear.fields.compensation_cap_cents
          - entities.PlanYear.fields.annual_deferral_limit_cents
          - entities.PlanYear.fields.hce_prior_comp_threshold_cents
          - entities.PlanYear.fields.tier1_pct
          - entities.PlanYear.fields.tier2_match_rate
          - entities.PlanYear.fields.leave_merge_buffer_days
          - endpoints[POST /plan-years]
        distinguishing_aspect: "Omitting every optional input on POST /plan-years yields exactly the declared defaults (34500000 / 2300000 / 15500000 / 0.03 / 1.00 / 0.02 / 0.50 / CURRENT_YEAR / 0.0000 / 180 / 14), status DRAFT and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id, cap: $.data.compensation_cap_cents, lim: $.data.annual_deferral_limit_cents, hce_thr: $.data.hce_prior_comp_threshold_cents, t1p: $.data.tier1_pct, t1r: $.data.tier1_match_rate, t2p: $.data.tier2_pct, t2r: $.data.tier2_match_rate, method: $.data.nondiscrimination_test_method, pyn: $.data.prior_year_nhce_acp, cap_days: $.data.unpaid_leave_day_cap, buf: $.data.leave_merge_buffer_days, st: $.data.status, ver: $.data.version }
          assert:
            - "cap == 34500000"
            - "lim == 2300000"
            - "hce_thr == 15500000"
            - "t1p == 0.03"
            - "t1r == 1.00"
            - "t2p == 0.02"
            - "t2r == 0.50"
            - "method == CURRENT_YEAR"
            - "pyn == 0.0000"
            - "cap_days == 180"
            - "buf == 14"
            - "st == DRAFT"
            - "ver == 1"
            - "PlanYear.${py_id}.total_deferral_match_funded_cents == 0"
            - "PlanYear.${py_id}.total_qslp_match_funded_cents == 0"
            - "PlanYear.${py_id}.forfeiture_balance_cents == 0"
            - "PlanYear.${py_id}.accepted_certification_count == 0"
            - "PlanYear.${py_id}.true_up_completed == false"
            - "PlanYear.${py_id}.reopened_count == 0"

      - name: corner_create_employee_generates_system_fields_and_active_status
        claim_type: System Fields
        grounds:
          - entities.Employee.fields.employment_status
          - entities.Employee.fields.termination_date
          - entities.Employee.fields.vested_pct
          - endpoints[POST /employees]
        distinguishing_aspect: "POST /employees mints id/created_at/updated_at/version=1 and sets employment_status=ACTIVE, termination_date=null, rehire_date=null with vested_pct derived from vesting_service_months (72 months -> 1.00), none of which the client supplied."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN so hce_flag and remaining_qslp_space_cents are derivable."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
          trigger:
            - call: "POST /employees"
              payload: { external_id: "E-SYS", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id, st: $.data.employment_status, ver: $.data.version, vp: $.data.vested_pct, hf: $.data.hce_flag, space: $.data.remaining_qslp_space_cents }
          assert:
            - "st == ACTIVE"
            - "ver == 1"
            - "vp == 1.00"
            - "hf == false"
            - "space == 2300000"
            - "Employee.${emp_id}.termination_date == null"
            - "Employee.${emp_id}.rehire_date == null"
            - "Employee.${emp_id}.ytd_eligible_compensation_cents == 0"
            - "Employee.${emp_id}.unpaid_leave_days_ytd == 0"

      - name: corner_get_plan_year_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors.ERR_PLAN_YEAR_NOT_FOUND
          - endpoints[GET /plan-years/{plan_year_id}]
        distinguishing_aspect: "GET /plan-years with an id no row carries returns 404 ERR_PLAN_YEAR_NOT_FOUND rather than an empty 200 body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /plan-years/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PLAN_YEAR_NOT_FOUND"
            - "HTTP status == 404"
            - "response_type == error"

      - name: corner_get_certification_line_unknown_id_returns_record_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=13]
          - errors.ERR_RECORD_NOT_FOUND
          - endpoints[GET /certification-lines/{certification_line_id}]
        distinguishing_aspect: "The shared ERR_RECORD_NOT_FOUND (not ERR_CERTIFICATION_NOT_FOUND) is returned for an unknown certification_line_id."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /certification-lines/00000000-0000-0000-0000-0000000000aa"
              payload: {}
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RECORD_NOT_FOUND"
            - "HTTP status == 404"

      - name: corner_create_contribution_record_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /contribution-records]
        distinguishing_aspect: "POST /contribution-records without elective_deferral_cents (an input field with no declared default) returns 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN, one Employee, one OPEN PayrollPeriod."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-REQ", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
          trigger:
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000 }
              as: PayrollOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "PayrollPeriod.${pp1_id}.total_eligible_compensation_cents == 0"
            - "Employee.${emp_id}.ytd_deferral_cents == 0"

      - name: corner_create_loan_account_last4_type_constraint_rejected
        claim_type: Type Constraints
        grounds:
          - entities.LoanAccount.fields.account_last4
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "account_last4 must be exactly 4 digits: the value \"12A\" violates both the length and digit constraints and returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN and one Employee."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-TYP", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /loan-accounts"
              payload: { employee_id: "${emp_id}", servicer_name: "Nelnet", account_last4: "12A", original_principal_cents: 2500000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "no LoanAccount row exists with employee_id == ${emp_id}"

      - name: corner_certification_line_is_immutable_and_versionless
        claim_type: Immutability
        grounds:
          - entities.CertificationLine
          - endpoints[GET /certification-lines/{certification_line_id}]
        distinguishing_aspect: "CertificationLine declares common_fields: false, so its read payload carries id and created_at but no version and no updated_at, and §1.5 declares no PUT/PATCH/DELETE for it."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN, one Employee with a VERIFIED LoanAccount, one DRAFT LoanCertification carrying one 10000-cent line."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-IMM", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /loan-accounts"
              payload: { employee_id: "${emp_id}", servicer_name: "Nelnet", account_last4: "4321", original_principal_cents: 2500000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { la_id: $.data.id }
            - call: "POST /loan-accounts/${la_id}/verification"
              payload: { to_status: "VERIFIED", evidence_ref: "STMT-2026-03" }
              as: BenefitsAdministrator
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v: $.data.version }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SELF_CERTIFICATION", expected_employee_version: "${emp_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /loan-certifications/${cert_id}/lines"
              payload: { loan_account_id: "${la_id}", payment_date: "2026-03-15T00:00:00Z", amount_cents: 10000, covered_period_start: "2026-03-01T00:00:00Z", covered_period_end: "2026-04-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { line_id: $.data.id }
          trigger:
            - call: "GET /certification-lines/${line_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { amt: $.data.amount_cents }
          assert:
            - "amt == 10000"
            - "the response data object contains id and created_at"
            - "the response data object contains no version key"
            - "the response data object contains no updated_at key"

      - name: corner_certification_line_referencing_other_employees_loan_rejected
        claim_type: Parent Relationships
        grounds:
          - validations[priority=14]
          - errors.ERR_NOT_RESOURCE_OWNER
          - entities.CertificationLine.fields.loan_account_id
          - complexity_profile.entity_topology.flat
        distinguishing_aspect: "Flat-topology cross-reference integrity: employee A cannot attach employee B's LoanAccount to A's own claim; the line add returns 403 ERR_NOT_RESOURCE_OWNER and A's certified_total_cents stays 0."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN."
            - "Employee A with a DRAFT LoanCertification and no lines."
            - "Employee B with a separate VERIFIED LoanAccount."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-OWN-A", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { emp_a: $.data.id }
            - call: "POST /employees"
              payload: { external_id: "E-OWN-B", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { emp_b: $.data.id }
            - call: "POST /loan-accounts"
              payload: { employee_id: "${emp_b}", servicer_name: "Nelnet", account_last4: "9999", original_principal_cents: 2500000 }
              as: Employee
              as_user_id: "${emp_b}"
              captures: { la_b: $.data.id }
            - call: "POST /loan-accounts/${la_b}/verification"
              payload: { to_status: "VERIFIED", evidence_ref: "STMT-B" }
              as: BenefitsAdministrator
            - call: "GET /employees/${emp_a}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_a_v: $.data.version }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_a}", plan_year_id: "${py_id}", certification_method: "SELF_CERTIFICATION", expected_employee_version: "${emp_a_v}" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { cert_a: $.data.id }
          trigger:
            - call: "POST /loan-certifications/${cert_a}/lines"
              payload: { loan_account_id: "${la_b}", payment_date: "2026-03-15T00:00:00Z", amount_cents: 10000, covered_period_start: "2026-03-01T00:00:00Z", covered_period_end: "2026-04-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_a}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_RESOURCE_OWNER"
            - "HTTP status == 403"
            - "LoanCertification.${cert_a}.certified_total_cents == 0"
            - "no CertificationLine exists with certification_id == ${cert_a}"

      - name: corner_list_employees_pagination_reports_total_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /employees]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three employees enrolled, GET /employees?limit=2&offset=0 returns exactly 2 elements with total_count 3 and has_more true, and offset=2 returns 1 element with has_more false."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN and exactly three Employee rows."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-P1", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { e1: $.data.id }
            - call: "POST /employees"
              payload: { external_id: "E-P2", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { e2: $.data.id }
            - call: "POST /employees"
              payload: { external_id: "E-P3", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { e3: $.data.id }
          trigger:
            - call: "GET /employees"
              payload: { limit: 2, offset: 0 }
              as: BenefitsAdministrator
              captures: { first_id: "$.data[0].id" }
            - call: "GET /employees"
              payload: { limit: 2, offset: 2 }
              as: BenefitsAdministrator
              captures: { third_id: "$.data[0].id" }
          assert:
            - "the first response returns exactly 2 elements with total_count == 3 and has_more == true"
            - "the second response returns exactly 1 element with total_count == 3 and has_more == false"
            - "first_id != third_id"
            - "response_type == array on both calls"

      - name: corner_every_collection_filters_by_its_declared_foreign_key
        claim_type: Listing
        grounds:
          - endpoints[GET /plan-amendments]
          - endpoints[GET /payroll-periods]
          - endpoints[GET /contribution-records]
          - endpoints[GET /contribution-records/{contribution_record_id}]
          - endpoints[GET /loan-accounts]
          - endpoints[GET /loan-certifications]
          - endpoints[GET /loan-certifications/{certification_id}/lines]
          - endpoints[GET /certification-lines]
          - endpoints[GET /funding-batches]
          - endpoints[GET /leave-events]
          - endpoints[GET /leave-events/{leave_event_id}]
          - endpoints[GET /nondiscrimination-tests]
        distinguishing_aspect: "In a flat topology each collection is reachable only through its own FK filter: with two payroll periods, two payroll lines and two certified lines in the fixture, every filtered list reports the exact total_count for its scope (2, 2, 2, 2) while the single-parent collections report 1, and a limit=1/offset=1 page of certification-lines reports total_count 2 with has_more false."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with one DRAFTED PlanAmendment and two OPEN PayrollPeriods."
            - "One Employee with two payroll lines, one VERIFIED LoanAccount, one PAID_FMLA LeaveEvent, one DRAFT LoanCertification carrying two certified lines, one PENDING FundingBatch and one PENDING NondiscriminationTest."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments"
              payload: { plan_year_id: "${py_id}", document_ref: "AMD-2026-LIST", effective_date: "2026-01-01T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { amd_id: $.data.id }
            - call: "POST /employees"
              payload: { external_id: "E-LISTING", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 2, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T23:59:59Z", pay_date: "2026-03-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp2_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
              captures: { cr1_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp2_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /loan-accounts"
              payload: { employee_id: "${emp_id}", servicer_name: "Nelnet", account_last4: "4321", original_principal_cents: 2500000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { la_id: $.data.id }
            - call: "POST /loan-accounts/${la_id}/verification"
              payload: { to_status: "VERIFIED", evidence_ref: "STMT-LIST" }
              as: BenefitsAdministrator
            - call: "POST /leave-events"
              payload: { employee_id: "${emp_id}", leave_type: "PAID_FMLA", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-10T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { le_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v: $.data.version }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SERVICER_STATEMENT", expected_employee_version: "${emp_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /loan-certifications/${cert_id}/lines"
              payload: { loan_account_id: "${la_id}", payment_date: "2026-03-15T00:00:00Z", amount_cents: 30000, covered_period_start: "2026-03-01T00:00:00Z", covered_period_end: "2026-04-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /loan-certifications/${cert_id}/lines"
              payload: { loan_account_id: "${la_id}", payment_date: "2026-04-15T00:00:00Z", amount_cents: 30000, covered_period_start: "2026-04-01T00:00:00Z", covered_period_end: "2026-05-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /funding-batches"
              payload: { plan_year_id: "${py_id}", payroll_period_id: "${pp1_id}" }
              as: PayrollOperator
              captures: { fb1_id: $.data.id }
            - call: "POST /nondiscrimination-tests"
              payload: { plan_year_id: "${py_id}", test_method: "CURRENT_YEAR" }
              as: ComplianceAuditor
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /plan-amendments"
              payload: { plan_year_id: "${py_id}" }
              as: BenefitsAdministrator
              captures: { amd0: "$.data[0].id" }
            - call: "GET /payroll-periods"
              payload: { plan_year_id: "${py_id}", status: "OPEN" }
              as: PayrollOperator
              captures: { pp0: "$.data[0].period_number" }
            - call: "GET /contribution-records"
              payload: { employee_id: "${emp_id}" }
              as: PayrollOperator
              captures: { cr0: "$.data[0].id" }
            - call: "GET /contribution-records/${cr1_id}"
              payload: {}
              as: PayrollOperator
              captures: { cr1_read: $.data.id, cr1_match: $.data.deferral_match_cents }
            - call: "GET /loan-accounts"
              payload: { employee_id: "${emp_id}", status: "VERIFIED" }
              as: BenefitsAdministrator
              captures: { la0: "$.data[0].id" }
            - call: "GET /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", status: "DRAFT" }
              as: BenefitsAdministrator
              captures: { c0: "$.data[0].id", c0_total: "$.data[0].certified_total_cents" }
            - call: "GET /loan-certifications/${cert_id}/lines"
              payload: {}
              as: BenefitsAdministrator
              captures: { ln0: "$.data[0].amount_cents" }
            - call: "GET /certification-lines"
              payload: { certification_id: "${cert_id}", limit: 1, offset: 1 }
              as: BenefitsAdministrator
              captures: { ln1: "$.data[0].amount_cents" }
            - call: "GET /funding-batches"
              payload: { plan_year_id: "${py_id}", status: "PENDING" }
              as: Recordkeeper
              captures: { fb0: "$.data[0].id" }
            - call: "GET /leave-events"
              payload: { employee_id: "${emp_id}", leave_type: "PAID_FMLA" }
              as: BenefitsAdministrator
              captures: { le0: "$.data[0].id" }
            - call: "GET /leave-events/${le_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { le_read: $.data.id, le_days: $.data.day_count }
            - call: "GET /nondiscrimination-tests"
              payload: { plan_year_id: "${py_id}" }
              as: ComplianceAuditor
              captures: { t0: "$.data[0].id", t0_st: "$.data[0].status" }
          assert:
            - "amd0 == ${amd_id} and the plan-amendments response reports total_count == 1"
            - "pp0 == 1 and the payroll-periods response reports total_count == 2 with 2 elements"
            - "cr0 == ${cr1_id} and the contribution-records response reports total_count == 2"
            - "cr1_read == ${cr1_id}"
            - "cr1_match == 20000"
            - "la0 == ${la_id} and the loan-accounts response reports total_count == 1"
            - "c0 == ${cert_id} and the loan-certifications response reports total_count == 1"
            - "c0_total == 60000  # two 30000-cent certified lines"
            - "ln0 == 30000 and the sub-resource lines response reports total_count == 2"
            - "ln1 == 30000 and the paged certification-lines response reports total_count == 2, has_more == false, exactly 1 element"
            - "fb0 == ${fb1_id} and the funding-batches response reports total_count == 1"
            - "le0 == ${le_id} and the leave-events response reports total_count == 1"
            - "le_read == ${le_id}"
            - "le_days == 10  # PAID_FMLA days are counted but never enter unpaid_leave_days_ytd"
            - "t0 == ${t_id} and the nondiscrimination-tests response reports total_count == 1"
            - "t0_st == PENDING"

  # =========================================================================
  # State Machines (§1.2) — initial state, invalid-from, preconditions,
  # side effects, terminal lockdown, idempotency, cyclic/parallel shapes
  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_new_certification_starts_in_draft
        claim_type: Initial State
        grounds:
          - state_machines.LoanCertification.initial_state
          - entities.LoanCertification.fields.status
          - endpoints[POST /loan-certifications]
        distinguishing_aspect: "A freshly created LoanCertification is DRAFT with certified_total_cents 0, eligible_total_cents 0, return_count 0 and submitted_at null."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN and one Employee."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-INIT", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v: $.data.version }
          trigger:
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SELF_CERTIFICATION", expected_employee_version: "${emp_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { cert_id: $.data.id, st: $.data.status, ct: $.data.certified_total_cents, et: $.data.eligible_total_cents, rc: $.data.return_count }
          assert:
            - "st == DRAFT"
            - "ct == 0"
            - "et == 0"
            - "rc == 0"
            - "LoanCertification.${cert_id}.submitted_at == null"
            - "LoanCertification.${cert_id}.decided_at == null"
            - "LoanCertification.${cert_id}.accepted_by_user_id == null"

      - name: corner_settlement_from_pending_batch_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.FundingBatch.TRANSMITTED_to_SETTLED
          - validations[priority=23]
          - errors.ERR_BATCH_STATE_INVALID
        distinguishing_aspect: "SETTLED is reachable only from TRANSMITTED: a settlement posted against a PENDING batch returns 409 ERR_BATCH_STATE_INVALID and leaves settled_at null."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN, one OPEN PayrollPeriod, one PENDING FundingBatch."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /funding-batches"
              payload: { plan_year_id: "${py_id}", payroll_period_id: "${pp1_id}" }
              as: PayrollOperator
              captures: { fb1_id: $.data.id, fb_st: $.data.status }
          trigger:
            - call: "POST /funding-batches/${fb1_id}/settlement"
              payload: { outcome: "SETTLED" }
              as: Recordkeeper
              captures: { err: $.data.error_id }
          assert:
            - "fb_st == PENDING"
            - "err == ERR_BATCH_STATE_INVALID"
            - "HTTP status == 409"
            - "FundingBatch.${fb1_id}.status == PENDING"
            - "FundingBatch.${fb1_id}.settled_at == null"
            - "PayrollPeriod.${pp1_id}.status == OPEN"

      - name: corner_amendment_notice_sent_directly_from_drafted_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PlanAmendment.ADOPTED_to_NOTICE_SENT
          - validations[priority=24]
          - errors.ERR_AMENDMENT_STATE_INVALID
        distinguishing_aspect: "NOTICE_SENT is reachable only from ADOPTED: attempting it from DRAFTED returns 409 ERR_AMENDMENT_STATE_INVALID and notice_sent_at stays null."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN and one DRAFTED PlanAmendment."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments"
              payload: { plan_year_id: "${py_id}", document_ref: "AMD-2026-CORNER-1", effective_date: "2026-01-01T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { amd_id: $.data.id, amd_st: $.data.status }
          trigger:
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "NOTICE_SENT", notice_channel: "EMAIL" }
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "amd_st == DRAFTED"
            - "err == ERR_AMENDMENT_STATE_INVALID"
            - "HTTP status == 409"
            - "PlanAmendment.${amd_id}.status == DRAFTED"
            - "PlanAmendment.${amd_id}.notice_sent_at == null"
            - "PlanAmendment.${amd_id}.adopted_at == null"

      - name: corner_amendment_effective_before_effective_date_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PlanAmendment.NOTICE_SENT_to_EFFECTIVE
          - validations[priority=37]
          - errors.ERR_AMENDMENT_EFFECTIVE_DATE_FUTURE
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The NOTICE_SENT -> EFFECTIVE precondition compares the logical clock (2026-08-01T00:00:00Z) against effective_date 2026-12-01T00:00:00Z and rejects with 422 ERR_AMENDMENT_EFFECTIVE_DATE_FUTURE; advancing the clock past effective_date then lets the same call through."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN."
            - "One PlanAmendment with effective_date 2026-12-01T00:00:00Z walked DRAFTED -> ADOPTED -> NOTICE_SENT while the logical clock still reads its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments"
              payload: { plan_year_id: "${py_id}", document_ref: "AMD-2026-CORNER-2", effective_date: "2026-12-01T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { amd_id: $.data.id }
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "ADOPTED" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "NOTICE_SENT", notice_channel: "MAIL" }
              as: BenefitsAdministrator
          trigger:
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: BenefitsAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-02T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { now: $.data.current_utc }
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: BenefitsAdministrator
              captures: { st_after: $.data.status, eff_at: $.data.effective_at }
          assert:
            - "err == ERR_AMENDMENT_EFFECTIVE_DATE_FUTURE"
            - "HTTP status == 422 on the first attempt"
            - "now == 2026-12-02T00:00:00Z"
            - "st_after == EFFECTIVE"
            - "eff_at == 2026-12-02T00:00:00Z  # stamped from the logical clock, not from effective_date"

      - name: corner_audit_hold_twice_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.LoanCertification.ACCEPTED_to_AUDIT_HOLD
          - validations[priority=19]
          - errors.ERR_CERTIFICATION_STATE_INVALID
        distinguishing_aspect: "AUDIT_HOLD is reachable only from ACCEPTED: repeating the audit-hold call on a claim already in AUDIT_HOLD returns 409 ERR_CERTIFICATION_STATE_INVALID and does not overwrite audit_hold_reason."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with an EFFECTIVE PlanAmendment."
            - "One Employee with one payroll period of 1000000 cents compensation and 20000 cents deferral."
            - "One ACCEPTED LoanCertification of 30000 cents already moved to AUDIT_HOLD with reason \"first review\"."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments"
              payload: { plan_year_id: "${py_id}", document_ref: "AMD-2026-CORNER-3", effective_date: "2026-01-01T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { amd_id: $.data.id }
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "ADOPTED" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "NOTICE_SENT", notice_channel: "EMAIL" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-HOLD", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /loan-accounts"
              payload: { employee_id: "${emp_id}", servicer_name: "Nelnet", account_last4: "4321", original_principal_cents: 2500000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { la_id: $.data.id }
            - call: "POST /loan-accounts/${la_id}/verification"
              payload: { to_status: "VERIFIED", evidence_ref: "STMT-2026-03" }
              as: BenefitsAdministrator
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v: $.data.version }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SERVICER_STATEMENT", expected_employee_version: "${emp_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /loan-certifications/${cert_id}/lines"
              payload: { loan_account_id: "${la_id}", payment_date: "2026-03-15T00:00:00Z", amount_cents: 30000, covered_period_start: "2026-03-01T00:00:00Z", covered_period_end: "2026-04-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /loan-certifications/${cert_id}/submit"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /loan-certifications/${cert_id}/decision"
              payload: { decision: "ACCEPT" }
              as: BenefitsAdministrator
              as_user_id: "admin-1"
            - call: "POST /loan-certifications/${cert_id}/audit-hold"
              payload: { reason: "first review" }
              as: ComplianceAuditor
              as_user_id: "auditor-9"
              captures: { st1: $.data.status, reason1: $.data.audit_hold_reason }
          trigger:
            - call: "POST /loan-certifications/${cert_id}/audit-hold"
              payload: { reason: "second review" }
              as: ComplianceAuditor
              as_user_id: "auditor-9"
              captures: { err: $.data.error_id }
          assert:
            - "st1 == AUDIT_HOLD"
            - "reason1 == first review"
            - "err == ERR_CERTIFICATION_STATE_INVALID"
            - "HTTP status == 409"
            - "LoanCertification.${cert_id}.status == AUDIT_HOLD"
            - "LoanCertification.${cert_id}.audit_hold_reason == first review"

      - name: corner_voided_certification_admits_no_further_operation
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.LoanCertification.terminal_states
          - validations[priority=18]
          - errors.ERR_CERTIFICATION_TERMINAL
        distinguishing_aspect: "VOIDED is terminal: a submit on a VOIDED claim returns 409 ERR_CERTIFICATION_TERMINAL (not ERR_CERTIFICATION_STATE_INVALID) and does not reserve statutory space again."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with an EFFECTIVE PlanAmendment."
            - "One Employee with one payroll period of 1000000 cents compensation and 20000 cents deferral."
