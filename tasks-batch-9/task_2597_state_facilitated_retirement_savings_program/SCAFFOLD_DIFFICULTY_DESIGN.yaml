  - rule_id: resource_temporal_overlap
    instances:

      - name: pay_period_closed_interval_rejects_shared_boundary_day
        grounds:
          - validations.v_pay_period_overlap
          - errors.ERR_PAY_PERIOD_OVERLAP
          - entities.PayrollRemittance.fields.pay_period_start
          - entities.PayrollRemittance.fields.pay_period_end
        distinguishing_aspect: |
          The pay-period interval is CLOSED on both ends, so sharing the single day 2026-02-28
          is already an overlap, while an interval starting the very next day 2026-03-01 is
          admissible. This pins the comparison to start <= other_end AND end >= other_start; a
          half-open reading (end exclusive) would accept the 2026-02-28 start and double-count
          that day's wages for the same employer.
