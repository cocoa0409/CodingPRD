        claim_type: role_denial
        grounds: [roles.QaReviewer, roles.Radiologist, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Sign is exclusive to Radiologist: QaReviewer gets ERR_UNAUTHORIZED even with a valid DRAFT report id."
        test_recipe:
          setup: ["full fixture; study IN_PROGRESS with a DRAFT FINAL report authored by rad"]
