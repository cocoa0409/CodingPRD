    distinguishing_aspect: 'The UnderwritingCase machine is a cyclic revision loop on the underwriting domain: VALIDATING -> FAILED bumps submission_round and loops back to VALIDATING on resubmission, so
      round-1 reports never count toward the round-2 VALIDATED gate (only the current round''s three VALIDATED reports do).'
