scenario: "728. Coin & Precious-Metals Dealer: inventory & spot-price-linked pricing (buy/sell spread), grading/authentication & numismatic premium, buy & ID/1099-B reporting threshold, IRA-eligible bullion & custodian, layaway/price-lock, consignment/auction, inventory hedge, settlement"
domain_name: "coin-precious-metals-dealer"
api_prefix: "/api"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys (Customer, Product, InventoryLot, orders,
  # Layaway, Consignment, IRAAccount, HedgePosition, Settlement, AuctionSession).
  # No nesting in URL paths — every collection is top-level under /api.

  state_machine_shape: branching
  # Consignment forks LISTED -> {SOLD, RETURNED} with divergent side effects;
  # Layaway is cyclic (ACTIVE -> ACTIVE deposit loop with DEFAULT/CANCEL exits).

  relationship_patterns:
    - one_to_many        # Customer 1-* BuyOrder/SellOrder/Layaway/Consignment/IRAAccount
    - cross_aggregate    # SellOrder settle depletes InventoryLot; Consignment sale writes Settlement

  role_model: peer_roles
  # Trader owns spot rates + inventory + hedge; SalesAgent owns orders/layaway/consignment;
  # ComplianceOfficer owns IRA accounts + reportable-buy approval + settlement;
  # Customer (entity-backed) acts on own layaways.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: SpotRate
    parent: null
    common_fields: true
    fields:
      - name: metal
        type: enum
        source: input
        description: "Which metal this rate applies to."
        constraints: "one of {GOLD, SILVER, PLATINUM, PALLADIUM}; unique — one live SpotRate row per metal"
      - name: price_per_troy_oz_cents
        type: integer
        source: input
        description: "Current spot price per troy ounce in integer cents."
        constraints: ">= 1"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Human catalog identifier; unique across products."
      - name: product_type
        type: enum
        source: input
        description: "BULLION prices at melt; NUMISMATIC adds a numismatic premium."
        constraints: "one of {BULLION, NUMISMATIC}"
      - name: metal
        type: enum
        source: input
        description: "Metal content used to look up the SpotRate."
        constraints: "one of {GOLD, SILVER, PLATINUM, PALLADIUM}"
      - name: weight_troy_oz
        type: number
        source: input
        description: "Fine-metal weight per unit in troy ounces."
        constraints: "> 0; up to 4 decimal places"
      - name: purity
        type: number
        source: input
        description: "Fineness fraction of pure metal (e.g., 0.999)."
        constraints: "> 0 and <= 1"
      - name: min_sell_spread_pct
        type: number
        source: input
        description: "Floor on the dealer sell spread for this product (fraction, e.g., 0.03)."
        constraints: ">= 0 and < 1"
      - name: buy_spread_pct
        type: number
        source: input
        description: "Discount below melt/numismatic value the dealer pays when buying (fraction)."
        constraints: ">= 0 and < 1"
      - name: numismatic_premium_cents
        type: integer
        source: input
        description: "Per-unit collectible premium over metal value; MUST be 0 when product_type=BULLION."
        default: 0
        constraints: ">= 0"
      - name: ira_eligible
        type: boolean
        source: input
        description: "True if this product may be sold into an IRA and shipped to a custodian."
        default: false

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product this physical lot holds."
      - name: total_qty
        type: integer
        source: input
        description: "Units in the lot at acquisition; never changes after creation."
        constraints: ">= 1"
      - name: available_qty
        type: integer
        source: computed
        description: "Units free to sell or reserve. Initialized to total_qty."
        constraints: ">= 0; invariant available_qty + reserved_qty + sold_qty == total_qty"
      - name: reserved_qty
        type: integer
        source: computed
        description: "Units held by active Layaways. Initialized to 0."
        default: 0
        constraints: ">= 0"
      - name: sold_qty
        type: integer
        source: computed
        description: "Units delivered by settled SellOrders. Initialized to 0."
        default: 0
        constraints: ">= 0"
      - name: acquisition_unit_cost_cents
        type: integer
        source: input
        description: "Per-unit cost basis when the lot was acquired."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "AVAILABLE while available_qty>0; DEPLETED when available_qty==0 and sold_qty==total_qty."
        constraints: "one of {AVAILABLE, DEPLETED}"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Customer legal name."
      - name: id_document_on_file
        type: boolean
        source: input
        description: "True if a government ID has been recorded (required for reportable buys)."
        default: false
      - name: lifetime_buy_payout_cents
        type: integer
        source: computed
        description: "Running sum of all settled BuyOrder payouts from this customer. Initialized to 0."
        default: 0
      - name: store_credit_cents
        type: integer
        source: computed
        description: "Refundable credit balance held for the customer. Initialized to 0."
        default: 0

  - name: IRAAccount
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the beneficial owner of this IRA."
      - name: custodian_name
        type: string
        source: input
        description: "Name of the approved IRA custodian holding the metal."
      - name: custodian_account_ref
        type: string
        source: input
        description: "Custodian-side account reference number."
      - name: status
        type: enum
        source: computed
        description: "PENDING at creation; ACTIVE after ComplianceOfficer approval; only ACTIVE accounts may receive allocations."
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, CLOSED}"
      - name: allocated_value_cents
        type: integer
        source: computed
        description: "Running sum of settled IRA-allocation SellOrder totals. Initialized to 0."
        default: 0

  - name: SellOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the buyer."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product being sold to the customer."
      - name: quantity
        type: integer
        source: input
        description: "Units the customer is buying from the dealer."
        constraints: ">= 1"
      - name: ira_account_id
        type: string
        source: input
        description: "FK -> IRAAccount.id; present only for IRA-allocation orders, else null."
        default: null
      - name: quoted_unit_price_cents
        type: integer
        source: computed
        description: "Per-unit ask price locked at placement via the sell_price calculation."
      - name: provisional_cogs_cents
        type: integer
        source: computed
        description: "Weighted-average cost basis estimated at placement (provisional COGS variant)."
      - name: final_cogs_cents
        type: integer
        source: computed
        description: "FIFO cost basis computed at settlement (final COGS variant); null until settled."
        default: null
      - name: total_price_cents
        type: integer
        source: computed
        description: "quoted_unit_price_cents * quantity, locked at placement."
      - name: realized_margin_cents
        type: integer
        source: computed
        description: "total_price_cents - final_cogs_cents; null until settled."
        default: null
      - name: status
        type: enum
        source: computed
        description: "PLACED at creation; SETTLED after inventory delivered; CANCELLED if voided before settlement."
        default: PLACED
        constraints: "one of {PLACED, SETTLED, CANCELLED}"

  - name: BuyOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the seller (dealer is buying from them)."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product the dealer is buying."
      - name: quantity
        type: integer
        source: input
        description: "Units the dealer is buying from the customer."
        constraints: ">= 1"
      - name: quoted_unit_payout_cents
        type: integer
        source: computed
        description: "Per-unit bid price locked at placement via the buy_price calculation."
      - name: total_payout_cents
        type: integer
        source: computed
        description: "quoted_unit_payout_cents * quantity, locked at placement."
      - name: reportable
        type: boolean
        source: computed
        description: "True when total_payout_cents >= REPORTABLE_THRESHOLD_CENTS (1099-B). Locked at placement."
        default: false
      - name: status
        type: enum
        source: computed
        description: "PLACED at creation; SETTLED after payout disbursed and inventory received; REJECTED if compliance-blocked."
        default: PLACED
        constraints: "one of {PLACED, SETTLED, REJECTED}"

  - name: Layaway
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the layaway holder."
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; product under layaway."
      - name: inventory_lot_id
        type: string
        source: input
        description: "FK -> InventoryLot.id; the lot whose units are reserved for this layaway."
      - name: quantity
        type: integer
        source: input
        description: "Units reserved for this layaway."
        constraints: ">= 1"
      - name: locked_unit_price_cents
        type: integer
        source: computed
        description: "Sell price locked at layaway creation; immune to later SpotRate changes (price-lock)."
      - name: total_price_cents
        type: integer
        source: computed
        description: "locked_unit_price_cents * quantity."
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Cumulative deposits applied. Initialized to 0."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while accepting deposits; COMPLETED when fully paid (converts to a settled SellOrder); DEFAULTED/CANCELLED release the reservation."
        default: ACTIVE
        constraints: "one of {ACTIVE, COMPLETED, DEFAULTED, CANCELLED}"

  - name: Consignment
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the consignor whose item is being sold."
      - name: description
        type: string
        source: input
        description: "Free-text description of the consigned item."
      - name: reserve_price_cents
        type: integer
        source: input
        description: "Minimum hammer price the consignor will accept."
        constraints: ">= 0"
      - name: commission_pct
        type: number
        source: input
        description: "Dealer commission fraction taken from the hammer price."
        constraints: ">= 0 and < 1"
      - name: buyer_premium_pct
        type: number
        source: input
        description: "Buyer's premium fraction added to the hammer price at auction."
        constraints: ">= 0 and < 1"
      - name: auction_session_id
        type: string
        source: input
        description: "FK -> AuctionSession.id; the session this consignment is listed in (null for private-treaty)."
        default: null
      - name: hammer_price_cents
        type: integer
        source: computed
        description: "Winning bid recorded when the item sells; null until SOLD."
        default: null
      - name: status
        type: enum
        source: computed
        description: "INTAKE at creation; LISTED once assigned to a session; then branches to SOLD or RETURNED."
        default: INTAKE
        constraints: "one of {INTAKE, LISTED, SOLD, RETURNED}"

  - name: HedgePosition
    parent: null
    common_fields: true
    fields:
      - name: metal
        type: enum
        source: input
        description: "Metal being hedged."
        constraints: "one of {GOLD, SILVER, PLATINUM, PALLADIUM}"
      - name: short_troy_oz
        type: number
        source: input
        description: "Troy ounces sold short to offset inventory long exposure."
        constraints: "> 0"
      - name: entry_spot_cents
        type: integer
        source: computed
        description: "SpotRate price_per_troy_oz_cents for the metal captured at position open."
      - name: exit_spot_cents
        type: integer
        source: computed
        description: "SpotRate captured at position close; null while OPEN."
        default: null
      - name: unrealized_pnl_cents
        type: integer
        source: computed
        description: "(entry_spot_cents - current spot) * short_troy_oz, recomputed on read while OPEN."
        default: 0
      - name: realized_pnl_cents
        type: integer
        source: computed
        description: "(entry_spot_cents - exit_spot_cents) * short_troy_oz, fixed at close; null while OPEN."
        default: null
      - name: status
        type: enum
        source: computed
        description: "OPEN at creation; CLOSED when bought back."
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - name: consignment_id
        type: string
        source: input
        description: "FK -> Consignment.id; the sold consignment being settled."
      - name: hammer_price_cents
        type: integer
        source: computed
        description: "Copied from the consignment at settlement."
      - name: commission_cents
        type: integer
        source: computed
        description: "round(hammer_price_cents * commission_pct)."
      - name: buyer_premium_cents
        type: integer
        source: computed
        description: "round(hammer_price_cents * buyer_premium_pct)."
      - name: seller_proceeds_cents
        type: integer
        source: computed
        description: "hammer_price_cents - commission_cents; credited to the consignor's store_credit_cents."
      - name: dealer_revenue_cents
        type: integer
        source: computed
        description: "commission_cents + buyer_premium_cents."

  - name: Appraiser
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Appraiser (grader/authenticator) name."
      - name: specialty_metal
        type: enum
        source: input
        description: "Metal specialty."
        constraints: "one of {GOLD, SILVER, PLATINUM, PALLADIUM}"

  - name: AppraisalAppointment
    parent: null
    common_fields: true
    fields:
      - name: appraiser_id
        type: string
        source: input
        description: "FK -> Appraiser.id; the booked appraiser."
      - name: consignment_id
        type: string
        source: input
        description: "FK -> Consignment.id; the item being graded/authenticated."
      - name: start_at
        type: datetime
        source: input
        description: "Appointment start (ISO 8601 UTC)."
      - name: end_at
        type: datetime
        source: input
        description: "Appointment end (ISO 8601 UTC); must be after start_at."
      - name: status
        type: enum
        source: computed
        description: "BOOKED at creation; CANCELLED releases the slot."
        default: BOOKED
        constraints: "one of {BOOKED, CANCELLED}"

  - name: AuctionSession
    parent: null
    common_fields: true
    fields:
      - name: room
        type: string
        source: input
        description: "Physical auction room identifier; two sessions in the same room cannot overlap in time."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Session start (ISO 8601 UTC)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Session end (ISO 8601 UTC); must be after scheduled_start."
      - name: status
        type: enum
        source: computed
        description: "SCHEDULED at creation; CLOSED after it runs."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CLOSED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: SellOrder
    initial_state: PLACED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PLACED
        to: SETTLED
        trigger: "POST /sell-orders/{id}/settle"
        actor: SalesAgent
        preconditions:
          - "SellOrder.status == PLACED"
          - "for the target InventoryLot chosen by FIFO (oldest created_at first), the union of lots for this product has available_qty >= SellOrder.quantity"
          - "if SellOrder.ira_account_id is not null, the referenced IRAAccount.status == ACTIVE AND the Product.ira_eligible == true"
        side_effects:
          - "compute final_cogs_cents via sell_cogs_final FIFO over InventoryLots (oldest created_at first)"
          - "decrement InventoryLot.available_qty and increment InventoryLot.sold_qty across consumed lots in FIFO order"
          - "any consumed InventoryLot whose available_qty reaches 0 and sold_qty==total_qty transitions to DEPLETED (cascade hop 2)"
          - "set realized_margin_cents = total_price_cents - final_cogs_cents"
          - "if ira_account_id not null, increment IRAAccount.allocated_value_cents by total_price_cents (cascade hop 2)"
          - "set SellOrder.status = SETTLED"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /sell-orders/{id}/cancel"
        actor: SalesAgent
        preconditions:
          - "SellOrder.status == PLACED"
        side_effects:
          - "set SellOrder.status = CANCELLED; no inventory was reserved so no release needed"

  - entity: BuyOrder
    initial_state: PLACED
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: PLACED
        to: SETTLED
        trigger: "POST /buy-orders/{id}/settle"
        actor: SalesAgent
        preconditions:
          - "BuyOrder.status == PLACED"
          - "if BuyOrder.reportable == true, the customer's id_document_on_file == true AND a prior POST /buy-orders/{id}/approve-reportable set an approval flag"
        side_effects:
          - "create or augment an InventoryLot for the product with total_qty = BuyOrder.quantity and acquisition_unit_cost_cents = quoted_unit_payout_cents (cascade hop 2: new lot available for sale)"
          - "increment Customer.lifetime_buy_payout_cents by total_payout_cents (cascade hop 2)"
          - "set BuyOrder.status = SETTLED"
      - from: PLACED
        to: REJECTED
        trigger: "POST /buy-orders/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "BuyOrder.status == PLACED"
        side_effects:
          - "set BuyOrder.status = REJECTED; no payout disbursed, no inventory created"

  - entity: Layaway
    initial_state: ACTIVE
    terminal_states: [COMPLETED, DEFAULTED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /layaways/{id}/deposit"
        actor: Customer
        preconditions:
          - "Layaway.status == ACTIVE"
          - "deposit amount_cents >= 1"
          - "amount_paid_cents + amount_cents <= total_price_cents"
        side_effects:
          - "increment Layaway.amount_paid_cents by amount_cents (cyclic self-loop; reservation unchanged)"
        note: "Cyclic transition — the deposit loop keeps the layaway in ACTIVE until fully paid or an exit is taken."
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /layaways/{id}/complete"
        actor: SalesAgent
        preconditions:
          - "Layaway.status == ACTIVE"
          - "amount_paid_cents == total_price_cents"
        side_effects:
          - "decrement InventoryLot.reserved_qty by quantity and increment InventoryLot.sold_qty by quantity (reservation converts to sale, cascade hop 2)"
          - "any such InventoryLot whose available_qty==0 and sold_qty==total_qty transitions to DEPLETED (cascade hop 3)"
          - "set Layaway.status = COMPLETED"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /layaways/{id}/default"
        actor: SalesAgent
        preconditions:
          - "Layaway.status == ACTIVE"
        side_effects:
          - "release reservation: decrement InventoryLot.reserved_qty by quantity and increment InventoryLot.available_qty by quantity (compensating action; conserves total_qty)"
          - "credit Customer.store_credit_cents by amount_paid_cents (deposits become store credit on default)"
          - "set Layaway.status = DEFAULTED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /layaways/{id}/cancel"
        actor: Customer
        preconditions:
          - "Layaway.status == ACTIVE"
        side_effects:
          - "release reservation: decrement InventoryLot.reserved_qty by quantity and increment InventoryLot.available_qty by quantity (compensating action; conserves total_qty)"
          - "refund deposits to Customer.store_credit_cents by amount_paid_cents"
          - "set Layaway.status = CANCELLED"

  - entity: Consignment
    initial_state: INTAKE
    terminal_states: [SOLD, RETURNED]
    transitions:
      - from: INTAKE
        to: LISTED
        trigger: "POST /consignments/{id}/list"
        actor: SalesAgent
        preconditions:
          - "Consignment.status == INTAKE"
          - "Consignment.auction_session_id references an AuctionSession whose status == SCHEDULED"
        side_effects:
          - "set Consignment.status = LISTED"
      - from: LISTED
        to: SOLD
        trigger: "POST /consignments/{id}/record-sale"
        actor: SalesAgent
        preconditions:
          - "Consignment.status == LISTED"
          - "hammer_price_cents >= Consignment.reserve_price_cents"
        side_effects:
          - "set Consignment.hammer_price_cents = hammer_price_cents"
          - "set Consignment.status = SOLD"
        note: "Branch A of the LISTED fork — divergent side effects from branch B."
      - from: LISTED
        to: RETURNED
        trigger: "POST /consignments/{id}/return"
        actor: SalesAgent
        preconditions:
          - "Consignment.status == LISTED"
        side_effects:
          - "set Consignment.status = RETURNED; no Settlement is ever created for a returned consignment"
        note: "Branch B of the LISTED fork — no settlement, no proceeds; divergent from branch A."

  - entity: HedgePosition
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /hedge-positions/{id}/close"
        actor: Trader
        preconditions:
          - "HedgePosition.status == OPEN"
        side_effects:
          - "capture exit_spot_cents from the current SpotRate for the metal"
          - "set realized_pnl_cents = (entry_spot_cents - exit_spot_cents) * short_troy_oz, rounded to cents"
          - "set HedgePosition.status = CLOSED"

  - entity: IRAAccount
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /ira-accounts/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "IRAAccount.status == PENDING"
          - "the owning Customer.id_document_on_file == true"
        side_effects:
          - "set IRAAccount.status = ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /ira-accounts/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "IRAAccount.status == ACTIVE"
        side_effects:
          - "set IRAAccount.status = CLOSED"

  - entity: AppraisalAppointment
    initial_state: BOOKED
    terminal_states: [CANCELLED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /appraisal-appointments/{id}/cancel"
        actor: SalesAgent
        preconditions:
          - "AppraisalAppointment.status == BOOKED"
        side_effects:
          - "set AppraisalAppointment.status = CANCELLED; the appraiser's time slot is released"

  - entity: AuctionSession
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: CLOSED
        trigger: "POST /auction-sessions/{id}/close"
        actor: SalesAgent
        preconditions:
          - "AuctionSession.status == SCHEDULED"
        side_effects:
          - "set AuctionSession.status = CLOSED"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: layaway-deposit-stale-version
    parent_entity: Layaway
    write_endpoint: "POST /layaways/{id}/deposit"
    occ_field: "expected_layaway_version"
    description: |
      Applying a deposit against a Layaway whose version has advanced since the
      client last observed it is rejected. A prior deposit (or a status change)
      that the current client did not see would make this deposit apply to a
      stale amount_paid_cents view, so the write is refused on a stale version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: consignment-record-sale-stale-version
    parent_entity: Consignment
    write_endpoint: "POST /consignments/{id}/record-sale"
    occ_field: "expected_consignment_version"
    description: |
      Recording a sale against a Consignment whose version has advanced since
      the client last read it is rejected. Another actor may have already
      recorded the sale or returned the item, advancing the version; the current
      client's view is therefore stale and the write is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: unit_melt_value
    trigger: "helper used by unit_sell_price and unit_buy_payout at order placement"
    algorithm: aggregation
    formula: |
      spot = SpotRate[Product.metal].price_per_troy_oz_cents        # integer cents per troy oz
      melt = spot * Product.weight_troy_oz * Product.purity         # real number, cents
      unit_melt_value_cents = round_half_up(melt)                   # integer cents
    input_set: "the single live SpotRate row for Product.metal"
    constants: {}
    precision: "integer cents, round_half_up applied once after multiplying all three factors"

  - name: unit_sell_price
    trigger: "POST /sell-orders (placement) and POST /layaways (price-lock at creation)"
    algorithm: tiered_pricing
    formula: |
      melt = unit_melt_value_cents                                     # from unit_melt_value
      base = melt + (Product.numismatic_premium_cents if Product.product_type == NUMISMATIC else 0)
      unit_sell_price_cents = round_half_up(base * (1 + Product.min_sell_spread_pct))
    input_set: "one Product row; the numismatic premium is added ONLY for NUMISMATIC products"
    constants: {}
    precision: "integer cents, round_half_up applied once after applying the spread to base"
    variants:
      - name: bullion_no_premium
        when: "Product.product_type == BULLION"
        difference: "numismatic_premium_cents is treated as 0 regardless of the stored field"
      - name: numismatic_with_premium
        when: "Product.product_type == NUMISMATIC"
        difference: "the collectible premium is added to melt BEFORE the spread is applied"

  - name: unit_buy_payout
    trigger: "POST /buy-orders (placement)"
    algorithm: threshold
    formula: |
      melt = unit_melt_value_cents
      base = melt + (Product.numismatic_premium_cents if Product.product_type == NUMISMATIC else 0)
      unit_buy_payout_cents = round_half_up(base * (1 - Product.buy_spread_pct))
      total_payout_cents = unit_buy_payout_cents * BuyOrder.quantity
      reportable = (total_payout_cents >= REPORTABLE_THRESHOLD_CENTS)
    input_set: "one Product row; the whole BuyOrder quantity"
    constants:
      REPORTABLE_THRESHOLD_CENTS: 1000000    # $10,000.00 — 1099-B / ID reporting threshold
    precision: "integer cents, round_half_up applied once after applying the buy spread"

  - name: sell_cogs_provisional
    trigger: "POST /sell-orders (placement) — provisional cost-of-goods estimate stored on the order"
    algorithm: aggregation
    formula: |
      # Weighted-average cost basis over the product's currently-available inventory.
      lots = InventoryLots where product_id == SellOrder.product_id and available_qty > 0
      total_avail = sum(lot.available_qty for lot in lots)
      wavg = round_half_up( sum(lot.acquisition_unit_cost_cents * lot.available_qty for lot in lots) / total_avail )
      provisional_cogs_cents = wavg * SellOrder.quantity
    input_set: "all AVAILABLE InventoryLots for the product, weighted by available_qty at placement time"
    constants: {}
    precision: "integer cents; round the weighted average unit cost once, then multiply by quantity"

  - name: sell_cogs_final
    trigger: "POST /sell-orders/{id}/settle — final cost-of-goods at delivery"
    algorithm: chronological
    formula: |
      # FIFO consumption over lots in ascending created_at (tie-break: ascending id is FORBIDDEN;
      # use created_at ASC, and if two lots share created_at, the one with the smaller available_qty
      # is consumed first as a deterministic non-id tie-break).
      remaining = SellOrder.quantity
      final_cogs_cents = 0
      for lot in InventoryLots(product_id == SellOrder.product_id, available_qty > 0)
              ordered by (created_at ASC, available_qty ASC):
        take = min(remaining, lot.available_qty)
        final_cogs_cents += take * lot.acquisition_unit_cost_cents
        remaining -= take
        if remaining == 0: break
    input_set: "AVAILABLE InventoryLots for the product, consumed oldest-first (FIFO)"
    constants: {}
    precision: "integer cents; exact sum of per-lot (units_taken * acquisition_unit_cost_cents)"
    variants:
      - name: provisional_vs_final_divergence
        when: "lots for the product carry different acquisition_unit_cost_cents"
        difference: "sell_cogs_provisional uses a quantity-weighted average of ALL available lots; sell_cogs_final consumes the oldest lot(s) first (FIFO). When per-lot costs differ these produce different cents for identical order inputs."

  - name: hedge_pnl
    trigger: "GET /hedge-positions/{id} (unrealized, live) and POST /hedge-positions/{id}/close (realized)"
    algorithm: dual_variant
    formula: |
      unrealized_pnl_cents = round_half_up( (entry_spot_cents - current_spot_cents) * short_troy_oz )   # while OPEN
      realized_pnl_cents   = round_half_up( (entry_spot_cents - exit_spot_cents) * short_troy_oz )       # fixed at CLOSE
    input_set: "the position's entry_spot_cents; current SpotRate for unrealized, captured exit_spot_cents for realized"
    constants: {}
    precision: "integer cents, round_half_up applied once after multiplying the spot delta by short_troy_oz"
    variants:
      - name: unrealized_live
        when: "HedgePosition.status == OPEN, on read"
        difference: "uses the CURRENT SpotRate, so the value moves as spot moves; never persisted as final"
      - name: realized_fixed
        when: "HedgePosition.status == CLOSED"
        difference: "uses the exit_spot_cents captured at close; frozen thereafter"

  - name: settlement_breakdown
    trigger: "POST /settlements (create a Settlement for a SOLD Consignment)"
    algorithm: weighted_scoring
    formula: |
      # Rounding order is PINNED: round EACH component independently, THEN sum.
      # (Rounding the sum of the two percentages would yield a different cent in edge cases.)
      commission_cents     = round_half_up(hammer_price_cents * Consignment.commission_pct)
      buyer_premium_cents  = round_half_up(hammer_price_cents * Consignment.buyer_premium_pct)
      seller_proceeds_cents = hammer_price_cents - commission_cents
      dealer_revenue_cents  = commission_cents + buyer_premium_cents
    input_set: "the SOLD Consignment's hammer_price_cents and its commission_pct / buyer_premium_pct"
    constants: {}
    precision: "integer cents; round_half_up EACH of commission and buyer_premium independently BEFORE summing dealer_revenue (round-then-sum, NOT sum-then-round)"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the X-User-Role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource id in the path and every FK in the body resolves to an existing entity, validated left-to-right (path ids before body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "for entity_backed Customer role, X-User-ID equals the customer_id of the resource being acted upon (ownership)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /layaways/{id}/deposit, POST /layaways/{id}/cancel"

  - priority: 5
    category: state
    check: "the target resource is in a state from which this transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "a BuyOrder flagged reportable (total_payout_cents >= REPORTABLE_THRESHOLD_CENTS) cannot settle unless the customer's id_document_on_file == true"
    error_id: ERR_ID_REQUIRED_FOR_REPORTABLE
    http_status: 422
    applies_to: "POST /buy-orders/{id}/settle"

  - priority: 7
    category: business_safety
    check: "a reportable BuyOrder cannot settle unless it has been approved via POST /buy-orders/{id}/approve-reportable"
    error_id: ERR_REPORTABLE_NOT_APPROVED
    http_status: 422
    applies_to: "POST /buy-orders/{id}/settle"

  - priority: 8
    category: business_safety
    check: "an IRA-allocation SellOrder (ira_account_id not null) requires the referenced IRAAccount.status == ACTIVE"
    error_id: ERR_IRA_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /sell-orders, POST /sell-orders/{id}/settle"

  - priority: 9
    category: business_safety
    check: "an IRA-allocation SellOrder requires Product.ira_eligible == true"
    error_id: ERR_PRODUCT_NOT_IRA_ELIGIBLE
    http_status: 422
    applies_to: "POST /sell-orders"

  - priority: 10
    category: business_constraint
    check: "a NUMISMATIC product may carry numismatic_premium_cents > 0; a BULLION product MUST be created with numismatic_premium_cents == 0"
    error_id: ERR_BULLION_PREMIUM_FORBIDDEN
    http_status: 422
    applies_to: "POST /products"

  - priority: 11
    category: business_constraint
    check: "record-sale hammer_price_cents must be >= Consignment.reserve_price_cents (>=, reserve met exactly is allowed)"
    error_id: ERR_RESERVE_NOT_MET
    http_status: 422
    applies_to: "POST /consignments/{id}/record-sale"

  - priority: 12
    category: business_temporal
    check: "a new AuctionSession in a given room must not overlap an existing SCHEDULED session in the same room; intervals are half-open [start, end) so touching end==start is allowed"
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /auction-sessions"

  - priority: 13
    category: business_temporal
    check: "a new AppraisalAppointment must not overlap an existing BOOKED appointment for the same appraiser; intervals are CLOSED [start, end] so touching end==start collides (buffer semantics differ from auction rooms)"
    error_id: ERR_APPRAISER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appraisal-appointments"

  - priority: 14
    category: business_referential
    check: "a Consignment may be listed only into an AuctionSession whose status == SCHEDULED"
    error_id: ERR_SESSION_NOT_SCHEDULED
    http_status: 422
    applies_to: "POST /consignments/{id}/list"

  - priority: 15
    category: business_fiscal
    check: "a SellOrder or Layaway completion requires aggregate available_qty across the product's AVAILABLE lots >= quantity (empty inventory: zero available → fails)"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 422
    applies_to: "POST /sell-orders/{id}/settle, POST /layaways"

  - priority: 16
    category: business_fiscal
    check: "a layaway deposit must not push amount_paid_cents above total_price_cents (overpayment); boundary: paying exactly the remaining balance is allowed"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /layaways/{id}/deposit"

  - priority: 17
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /layaways/{id}/deposit, POST /consignments/{id}/record-sale"

  - priority: 18
    category: business_constraint
    check: "request body required fields present and well-typed; enum fields within their declared domain; positive-quantity and interval (end>start) constraints hold"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- SpotRate ----
  - method: POST
    path: "/api/spot-rates"
    description: "Create the live spot rate for a metal."
    roles: [Trader]
    code: 201
    input: [metal, price_per_troy_oz_cents]
    output: SpotRate
    side_effects: ["creates the single SpotRate row for the metal"]
  - method: PUT
    path: "/api/spot-rates/{id}"
    description: "Update the spot price for a metal; affects future pricing only."
    roles: [Trader]
    code: 200
    input: [price_per_troy_oz_cents]
    output: SpotRate
    side_effects: ["updates price_per_troy_oz_cents; increments version"]
  - method: GET
    path: "/api/spot-rates/{id}"
    description: "Read one spot rate."
    roles: [Trader, SalesAgent, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: SpotRate
    side_effects: []

  # ---- Product ----
  - method: POST
    path: "/api/products"
    description: "Create a catalog product."
    roles: [Trader]
    code: 201
    input: [sku, product_type, metal, weight_troy_oz, purity, min_sell_spread_pct, buy_spread_pct, "numismatic_premium_cents?", "ira_eligible?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/api/products/{id}"
    description: "Read one product."
    roles: [Trader, SalesAgent, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Product
    side_effects: []

  # ---- InventoryLot ----
  - method: POST
    path: "/api/inventory-lots"
    description: "Record a physical inventory lot for a product."
    roles: [Trader]
    code: 201
    input: [product_id, total_qty, acquisition_unit_cost_cents]
    output: InventoryLot
    side_effects: ["available_qty initialized to total_qty; reserved_qty and sold_qty initialized to 0; status AVAILABLE"]
  - method: GET
    path: "/api/inventory-lots/{id}"
    description: "Read one inventory lot."
    roles: [Trader, SalesAgent, ComplianceOfficer]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: GET
    path: "/api/inventory-lots"
    description: "List inventory lots, optionally filtered by product."
    roles: [Trader, SalesAgent, ComplianceOfficer]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []

  # ---- Customer ----
  - method: POST
    path: "/api/customers"
    description: "Create a customer."
    roles: [SalesAgent, ComplianceOfficer]
    code: 201
    input: [full_name, "id_document_on_file?"]
    output: Customer
    side_effects: ["lifetime_buy_payout_cents and store_credit_cents initialized to 0"]
  - method: PATCH
    path: "/api/customers/{id}"
    description: "Update customer KYC flags such as id_document_on_file."
    roles: [SalesAgent, ComplianceOfficer]
    code: 200
    input: ["id_document_on_file?"]
    output: Customer
    side_effects: ["increments version"]
  - method: GET
    path: "/api/customers/{id}"
    description: "Read one customer."
    roles: [SalesAgent, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- IRAAccount ----
  - method: POST
    path: "/api/ira-accounts"
    description: "Open an IRA account (PENDING) for a customer with a custodian."
    roles: [ComplianceOfficer]
    code: 201
    input: [customer_id, custodian_name, custodian_account_ref]
    output: IRAAccount
    side_effects: ["status initialized PENDING; allocated_value_cents initialized to 0"]
  - method: POST
    path: "/api/ira-accounts/{id}/approve"
    description: "Approve a PENDING IRA account, moving it to ACTIVE."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IRAAccount
    side_effects: ["status PENDING -> ACTIVE"]
  - method: POST
    path: "/api/ira-accounts/{id}/close"
    description: "Close an ACTIVE IRA account."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: IRAAccount
    side_effects: ["status ACTIVE -> CLOSED"]
  - method: GET
    path: "/api/ira-accounts/{id}"
    description: "Read one IRA account."
    roles: [ComplianceOfficer, SalesAgent]
    code: 200
    input: []
    output: IRAAccount
    side_effects: []
  - method: GET
    path: "/api/ira-accounts"
    description: "List IRA accounts, optionally filtered by customer."
    roles: [ComplianceOfficer, SalesAgent]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: IRAAccount[]
    side_effects: []

  # ---- SellOrder ----
  - method: POST
    path: "/api/sell-orders"
    description: "Place a sell order (dealer sells to customer); locks quoted price and provisional COGS."
    roles: [SalesAgent]
    code: 201
    input: [customer_id, product_id, quantity, "ira_account_id?"]
    output: SellOrder
    side_effects: ["quoted_unit_price_cents from unit_sell_price; total_price_cents locked; provisional_cogs_cents from sell_cogs_provisional; status PLACED"]
  - method: POST
    path: "/api/sell-orders/{id}/settle"
    description: "Settle a placed sell order: FIFO-consume inventory, compute final COGS and realized margin."
    roles: [SalesAgent]
    code: 200
    input: []
    output: SellOrder
    side_effects: ["final_cogs_cents from sell_cogs_final; inventory FIFO decrement; lots may DEPLETE; realized_margin_cents set; IRAAccount.allocated_value_cents incremented when applicable; status SETTLED"]
  - method: POST
    path: "/api/sell-orders/{id}/cancel"
    description: "Cancel a placed sell order."
    roles: [SalesAgent]
    code: 200
    input: []
    output: SellOrder
    side_effects: ["status PLACED -> CANCELLED"]
  - method: GET
    path: "/api/sell-orders/{id}"
    description: "Read one sell order."
    roles: [SalesAgent, ComplianceOfficer]
    code: 200
    input: []
    output: SellOrder
    side_effects: []
  - method: GET
    path: "/api/sell-orders"
    description: "List sell orders, optionally filtered by customer, product, or IRA account."
    roles: [SalesAgent, ComplianceOfficer]
    code: 200
    input: ["customer_id?", "product_id?", "ira_account_id?", "limit?", "offset?"]
    output: SellOrder[]
    side_effects: []

  # ---- BuyOrder ----
  - method: POST
    path: "/api/buy-orders"
    description: "Place a buy order (dealer buys from customer); locks payout and reportable flag."
    roles: [SalesAgent]
    code: 201
    input: [customer_id, product_id, quantity]
    output: BuyOrder
    side_effects: ["quoted_unit_payout_cents from unit_buy_payout; total_payout_cents locked; reportable flag locked; status PLACED"]
  - method: POST
    path: "/api/buy-orders/{id}/approve-reportable"
    description: "Compliance approval that a reportable buy may proceed to settlement."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BuyOrder
    side_effects: ["sets the reportable-approval flag on the buy order"]
  - method: POST
    path: "/api/buy-orders/{id}/settle"
    description: "Settle a placed buy order: disburse payout and add inventory."
    roles: [SalesAgent]
    code: 200
    input: []
    output: BuyOrder
    side_effects: ["creates an InventoryLot for the product; increments Customer.lifetime_buy_payout_cents; status SETTLED"]
  - method: POST
    path: "/api/buy-orders/{id}/reject"
    description: "Compliance rejection of a placed buy order."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BuyOrder
    side_effects: ["status PLACED -> REJECTED"]
  - method: GET
    path: "/api/buy-orders/{id}"
    description: "Read one buy order."
    roles: [SalesAgent, ComplianceOfficer]
    code: 200
    input: []
    output: BuyOrder
    side_effects: []
  - method: GET
    path: "/api/buy-orders"
    description: "List buy orders, optionally filtered by customer or product."
    roles: [SalesAgent, ComplianceOfficer]
    code: 200
    input: ["customer_id?", "product_id?", "limit?", "offset?"]
    output: BuyOrder[]
    side_effects: []

  # ---- Layaway ----
  - method: POST
    path: "/api/layaways"
    description: "Open a layaway; reserves inventory from a lot and locks the sell price."
    roles: [SalesAgent]
    code: 201
    input: [customer_id, product_id, inventory_lot_id, quantity]
    output: Layaway
    side_effects: ["decrement InventoryLot.available_qty and increment reserved_qty by quantity; locked_unit_price_cents from unit_sell_price; total_price_cents locked; amount_paid_cents 0; status ACTIVE"]
  - method: POST
    path: "/api/layaways/{id}/deposit"
    description: "Apply a deposit to an active layaway (OCC-guarded)."
    roles: [Customer]
    code: 200
    input: [amount_cents, expected_layaway_version]
    output: Layaway
    side_effects: ["increments amount_paid_cents; increments version"]
  - method: POST
    path: "/api/layaways/{id}/complete"
    description: "Complete a fully-paid layaway; converts the reservation to a sale."
    roles: [SalesAgent]
    code: 200
    input: []
    output: Layaway
    side_effects: ["reserved_qty -> sold_qty conversion; lot may DEPLETE; status COMPLETED"]
  - method: POST
    path: "/api/layaways/{id}/default"
    description: "Mark an active layaway defaulted; release reservation, deposits become store credit."
    roles: [SalesAgent]
    code: 200
    input: []
    output: Layaway
    side_effects: ["release reservation back to available_qty; credit store_credit_cents by amount_paid_cents; status DEFAULTED"]
  - method: POST
    path: "/api/layaways/{id}/cancel"
    description: "Cancel an active layaway; release reservation and refund deposits to store credit."
    roles: [Customer]
    code: 200
    input: []
    output: Layaway
    side_effects: ["release reservation back to available_qty; refund store_credit_cents by amount_paid_cents; status CANCELLED"]
  - method: GET
    path: "/api/layaways/{id}"
    description: "Read one layaway."
    roles: [SalesAgent, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Layaway
    side_effects: []
  - method: GET
    path: "/api/layaways"
    description: "List layaways, optionally filtered by customer, product, or lot."
    roles: [SalesAgent, ComplianceOfficer]
    code: 200
    input: ["customer_id?", "product_id?", "inventory_lot_id?", "limit?", "offset?"]
    output: Layaway[]
    side_effects: []

  # ---- Consignment ----
  - method: POST
    path: "/api/consignments"
    description: "Intake a consignment item from a consignor."
    roles: [SalesAgent]
    code: 201
    input: [customer_id, description, reserve_price_cents, commission_pct, buyer_premium_pct, "auction_session_id?"]
    output: Consignment
    side_effects: ["status INTAKE"]
  - method: POST
    path: "/api/consignments/{id}/list"
    description: "List an INTAKE consignment into a SCHEDULED auction session."
    roles: [SalesAgent]
    code: 200
    input: [auction_session_id]
    output: Consignment
    side_effects: ["sets auction_session_id; status INTAKE -> LISTED"]
  - method: POST
    path: "/api/consignments/{id}/record-sale"
    description: "Record the winning hammer price for a LISTED consignment (OCC-guarded)."
    roles: [SalesAgent]
    code: 200
    input: [hammer_price_cents, expected_consignment_version]
    output: Consignment
    side_effects: ["sets hammer_price_cents; status LISTED -> SOLD; increments version"]
  - method: POST
    path: "/api/consignments/{id}/return"
    description: "Return a LISTED consignment unsold to the consignor."
    roles: [SalesAgent]
    code: 200
    input: []
    output: Consignment
    side_effects: ["status LISTED -> RETURNED; no settlement created"]
  - method: GET
    path: "/api/consignments/{id}"
    description: "Read one consignment."
    roles: [SalesAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Consignment
    side_effects: []
  - method: GET
    path: "/api/consignments"
    description: "List consignments, optionally filtered by customer or auction session."
    roles: [SalesAgent, ComplianceOfficer]
    code: 200
    input: ["customer_id?", "auction_session_id?", "limit?", "offset?"]
    output: Consignment[]
    side_effects: []

  # ---- HedgePosition ----
  - method: POST
    path: "/api/hedge-positions"
    description: "Open a short hedge position for a metal at the current spot."
    roles: [Trader]
    code: 201
    input: [metal, short_troy_oz]
    output: HedgePosition
    side_effects: ["entry_spot_cents captured from live SpotRate; status OPEN"]
  - method: POST
    path: "/api/hedge-positions/{id}/close"
    description: "Close an open hedge position; realize PnL against current spot."
    roles: [Trader]
    code: 200
    input: []
    output: HedgePosition
    side_effects: ["exit_spot_cents captured; realized_pnl_cents computed; status CLOSED"]
  - method: GET
    path: "/api/hedge-positions/{id}"
    description: "Read one hedge position; unrealized_pnl_cents recomputed live against current spot while OPEN."
    roles: [Trader]
    code: 200
    input: []
    output: HedgePosition
    side_effects: []

  # ---- Settlement ----
  - method: POST
    path: "/api/settlements"
    description: "Create the settlement for a SOLD consignment; credits consignor and records dealer revenue."
    roles: [ComplianceOfficer]
    code: 201
    input: [consignment_id]
    output: Settlement
    side_effects: ["commission/buyer-premium/proceeds/dealer-revenue computed; consignor store_credit_cents credited by seller_proceeds_cents"]
  - method: GET
    path: "/api/settlements/{id}"
    description: "Read one settlement."
    roles: [ComplianceOfficer, SalesAgent]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/api/settlements"
    description: "List settlements, optionally filtered by consignment."
    roles: [ComplianceOfficer, SalesAgent]
    code: 200
    input: ["consignment_id?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  # ---- Appraiser ----
  - method: POST
    path: "/api/appraisers"
    description: "Register an appraiser (grader/authenticator)."
    roles: [SalesAgent]
    code: 201
    input: [name, specialty_metal]
    output: Appraiser
    side_effects: []
  - method: GET
    path: "/api/appraisers/{id}"
    description: "Read one appraiser."
    roles: [SalesAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Appraiser
    side_effects: []

  # ---- AppraisalAppointment ----
  - method: POST
    path: "/api/appraisal-appointments"
    description: "Book an appraisal appointment for a consignment with an appraiser."
    roles: [SalesAgent]
    code: 201
    input: [appraiser_id, consignment_id, start_at, end_at]
    output: AppraisalAppointment
    side_effects: ["status BOOKED; occupies the appraiser's [start_at, end_at] closed interval"]
  - method: POST
    path: "/api/appraisal-appointments/{id}/cancel"
    description: "Cancel a booked appraisal appointment; release the slot."
    roles: [SalesAgent]
    code: 200
    input: []
    output: AppraisalAppointment
    side_effects: ["status BOOKED -> CANCELLED"]
  - method: GET
    path: "/api/appraisal-appointments/{id}"
    description: "Read one appraisal appointment."
    roles: [SalesAgent, ComplianceOfficer]
    code: 200
    input: []
    output: AppraisalAppointment
    side_effects: []
  - method: GET
    path: "/api/appraisal-appointments"
    description: "List appraisal appointments, optionally filtered by appraiser or consignment."
    roles: [SalesAgent, ComplianceOfficer]
    code: 200
    input: ["appraiser_id?", "consignment_id?", "limit?", "offset?"]
    output: AppraisalAppointment[]
    side_effects: []

  # ---- AuctionSession ----
  - method: POST
    path: "/api/auction-sessions"
    description: "Schedule an auction session in a room; rejects overlapping sessions in the same room."
    roles: [SalesAgent]
    code: 201
    input: [room, scheduled_start, scheduled_end]
    output: AuctionSession
    side_effects: ["status SCHEDULED; occupies the room's [scheduled_start, scheduled_end) half-open interval"]
  - method: POST
    path: "/api/auction-sessions/{id}/close"
    description: "Close a scheduled auction session."
    roles: [SalesAgent]
    code: 200
    input: []
    output: AuctionSession
    side_effects: ["status SCHEDULED -> CLOSED"]
  - method: GET
    path: "/api/auction-sessions/{id}"
    description: "Read one auction session."
    roles: [SalesAgent, ComplianceOfficer]
    code: 200
    input: []
    output: AuctionSession
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted to invoke this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed Customer acts on a resource whose customer_id is not their X-User-ID"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path id or body foreign key does not resolve to an existing entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state from which the requested transition is defined"
  - id: ERR_ID_REQUIRED_FOR_REPORTABLE
    http: 422
    condition: "a reportable BuyOrder cannot settle because the customer has no id_document_on_file"
  - id: ERR_REPORTABLE_NOT_APPROVED
    http: 422
    condition: "a reportable BuyOrder cannot settle because it was not compliance-approved"
  - id: ERR_IRA_NOT_ACTIVE
    http: 422
    condition: "an IRA-allocation SellOrder references an IRAAccount whose status is not ACTIVE"
  - id: ERR_PRODUCT_NOT_IRA_ELIGIBLE
    http: 422
    condition: "an IRA-allocation SellOrder references a Product whose ira_eligible is false"
  - id: ERR_BULLION_PREMIUM_FORBIDDEN
    http: 422
    condition: "a BULLION product is created with numismatic_premium_cents > 0"
  - id: ERR_RESERVE_NOT_MET
    http: 422
    condition: "record-sale hammer_price_cents is below the consignment reserve_price_cents"
  - id: ERR_ROOM_DOUBLE_BOOKED
    http: 409
    condition: "a new auction session overlaps an existing SCHEDULED session in the same room (half-open intervals)"
  - id: ERR_APPRAISER_DOUBLE_BOOKED
    http: 409
    condition: "a new appraisal appointment overlaps an existing BOOKED appointment for the same appraiser (closed intervals)"
  - id: ERR_SESSION_NOT_SCHEDULED
    http: 422
    condition: "a consignment is listed into an auction session whose status is not SCHEDULED"
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 422
    condition: "aggregate available_qty for the product is less than the requested quantity"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "a layaway deposit would push amount_paid_cents above total_price_cents"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "an OCC expected_<parent>_version does not equal the current parent version"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required field missing, wrong type, enum out of domain, non-positive quantity, or interval end not after start"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Trader
    description: "Manages spot rates, catalog products, physical inventory lots, and inventory hedge positions."
    identity: opaque
    exclusive_operations:
      - "POST/PUT /spot-rates"
      - "POST /products"
      - "POST /inventory-lots"
      - "POST /hedge-positions and POST /hedge-positions/{id}/close"
    shared_operations:
      - "GET spot-rates, products, inventory-lots"

  - name: SalesAgent
    description: "Runs the sales floor: sell/buy orders, layaways, consignments, appraisals, auction sessions."
    identity: opaque
    exclusive_operations:
      - "POST /sell-orders and its settle/cancel"
      - "POST /buy-orders and its settle"
      - "POST /layaways and its complete/default"
      - "POST /consignments and its list/record-sale/return"
      - "POST /appraisers, /appraisal-appointments and cancel"
      - "POST /auction-sessions and close"
    shared_operations:
      - "POST /customers, PATCH /customers/{id}"
      - "GET across sales, inventory, consignment, settlement collections"

  - name: ComplianceOfficer
    description: "Owns KYC, IRA account lifecycle, reportable-buy approval/rejection, and consignment settlement."
    identity: opaque
    exclusive_operations:
      - "POST /ira-accounts and its approve/close"
      - "POST /buy-orders/{id}/approve-reportable and /reject"
      - "POST /settlements"
    shared_operations:
      - "POST /customers, PATCH /customers/{id}"
      - "GET across customer, ira, order, settlement collections"

  - name: Customer
    description: "A registered customer acting on their own layaways (deposits, cancellations)."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /layaways/{id}/deposit (own layaway)"
      - "POST /layaways/{id}/cancel (own layaway)"
    shared_operations:
      - "GET /spot-rates/{id}, /products/{id}, /customers/{id} (self), /layaways/{id} (own)"
