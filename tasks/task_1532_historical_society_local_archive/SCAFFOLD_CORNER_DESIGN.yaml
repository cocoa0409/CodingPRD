          - errors[ERR_ZONE_RESTRICTED]
        distinguishing_aspect: "With the zone in RESTRICTED posture (3 breaches), make-available on a CATALOGED item fails with ERR_ZONE_RESTRICTED — a cross-entity state gate distinct from the finding-aid gate."
