# =============================================================================
# Task 1961: Cheer & Dance Competition Management (Varsity-style)
# Seed tables — SCAFFOLD.yaml (§1.0–§1.7)
# =============================================================================

scenario: |
  1961. Cheer & Dance Competition Management (Varsity style competition): division/level
  classification & routine legality rules, performance order & warm-up schedule, judging
  panel & score sheet aggregation, deduction (safety/time/boundary) application & video
  review, awards & bid distribution to championships, music licensing compliance, team
  check-in & athlete rosters, venue flow & spectator ticketing

domain_name: cheer-dance-competition
api_prefix: /api

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency        # OCC on Division/Event/Deduction versions
    - cascading_side_effects        # appeal -> deduction -> score -> rank -> bid
    - dual_variant_calculation      # provisional vs official scores; ticket rounding
    - ops_run_checkpoint            # /events/{id}/checkpoint sweeps bid & order expirations
  entity_topology: flat             # all collections flat under /api; FK links in bodies
  state_machine_shape: cyclic       # Deduction appeal loop; ScoreSheet/Performance reopen loop; Team parallel dims
  relationship_patterns:
    - many_to_many                  # Athlete <-> Team via RosterEntry; Judge <-> Division via Division.judge_ids
    - cross_aggregate               # Deduction -> Performance -> Division -> Event; Bid -> Team/Division
  role_model: segregation_of_duties # appeal reviewer cannot have scored the performance; voider cannot be applier
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FKs in bodies)
# =============================================================================
entities:
  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: venue_name, type: string, source: input, description: "Venue display name" }
      - { name: start_date, type: string, source: input, description: "First competition date (YYYY-MM-DD); anchors ticket ADVANCE/GATE cutoff = start_date - 14 days" }
      - { name: end_date, type: string, source: input, description: "Last competition date (YYYY-MM-DD); must be >= start_date" }
      - { name: age_reference_date, type: string, source: input, description: "Date on which athlete age is evaluated for division age grids (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | REGISTRATION_OPEN | REGISTRATION_CLOSED | SCHEDULED | LIVE | FINALIZED", description: "Event lifecycle state" }

  - name: Division
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; owning event" }
      - { name: name, type: string, source: input, description: "Division name, e.g. 'Senior All Girl Level 3'" }
      - { name: category, type: enum, source: input, constraints: "CHEER | DANCE", description: "Discipline" }
      - { name: level, type: integer, source: input, constraints: "1..6", description: "Skill level; also the max legal skill tier for routines" }
      - { name: min_age, type: integer, source: input, description: "Minimum athlete age (inclusive) as of Event.age_reference_date" }
      - { name: max_age, type: integer, source: input, description: "Maximum athlete age (inclusive) as of Event.age_reference_date; must be >= min_age" }
      - { name: min_athletes, type: integer, source: input, description: "Minimum ACTIVE checked roster size required at lock/check-in (inclusive boundary)" }
      - { name: max_athletes, type: integer, source: input, description: "Maximum ACTIVE roster entries (inclusive boundary)" }
      - { name: routine_time_limit_seconds, type: integer, source: input, description: "Routine time cap; exceeding it generates a TIME deduction" }
      - { name: warmup_duration_seconds, type: integer, source: input, default: 900, description: "Warm-up slot length used by schedule generation" }
      - { name: warmup_mats, type: array, source: input, description: "Ordered list of warm-up mat labels available to this division; must have >= ceil(warmup_duration_seconds / (routine_time_limit_seconds + 180)) entries" }
      - { name: schedule_start_at, type: datetime, source: input, description: "Scheduled start of performance_order 1 on the performance mat" }
      - { name: judge_ids, type: array, source: input, constraints: "3..9 elements, each FK -> Judge.id", description: "Assigned judging panel; quorum for SCORED = every listed judge has a SUBMITTED sheet" }
      - { name: time_deduction_per_second, type: number, source: input, default: 0.5, description: "Points per full second over the time limit" }
      - { name: safety_deduction_points, type: number, source: input, default: 2.0, description: "Points per SAFETY violation occurrence" }
      - { name: boundary_deduction_points, type: number, source: input, default: 0.25, description: "Points per BOUNDARY violation occurrence" }
      - { name: paid_bid_count, type: integer, source: input, default: 0, description: "PAID championship bid slots for this division" }
      - { name: at_large_bid_count, type: integer, source: input, default: 0, description: "AT_LARGE bid slots for this division" }
      - { name: bid_pool_available, type: integer, source: computed, description: "Unallocated/freed bid slots; initialized at division creation to paid_bid_count + at_large_bid_count; invariant: count(Bid.status IN {OFFERED, ACCEPTED}) + bid_pool_available == paid_bid_count + at_large_bid_count" }
      - { name: scheduled, type: boolean, source: system, default: false, description: "True after generate-schedule succeeds" }

  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; event the team registers into" }
      - { name: division_id, type: string, source: input, description: "FK -> Division.id; must belong to the same event; team.level/category must match division" }
      - { name: name, type: string, source: input, description: "Team name" }
      - { name: organization, type: string, source: input, description: "Gym / school / studio name" }
      - { name: category, type: enum, source: input, constraints: "CHEER | DANCE", description: "Must equal division.category" }
      - { name: level, type: integer, source: input, constraints: "1..6", description: "Must equal division.level (classification gate)" }
      - { name: coach_user_id, type: string, source: input, description: "Opaque TeamCoach X-User-ID that owns this team; ownership checks compare against this field" }
      - { name: reg_status, type: enum, source: system, default: REGISTERED, constraints: "REGISTERED | ROSTER_LOCKED | CHECKED_IN | COMPETED | WITHDRAWN | DISQUALIFIED", description: "Registration state dimension (parallel with music_status)" }
      - { name: music_status, type: enum, source: system, default: PENDING, constraints: "PENDING | SUBMITTED | VERIFIED | FLAGGED", description: "Music licensing state dimension (parallel with reg_status); derived from latest MusicSubmission" }

  - name: Athlete
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Athlete legal name" }
      - { name: date_of_birth, type: string, source: input, description: "YYYY-MM-DD; age computed as full years elapsed at Event.age_reference_date" }

  - name: RosterEntry
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: athlete_id, type: string, source: input, description: "FK -> Athlete.id" }
      - { name: bib_number, type: integer, source: input, description: "Bib number, unique per team" }
      - { name: eligibility_status, type: enum, source: system, default: ACTIVE, constraints: "ACTIVE | INELIGIBLE", description: "Eligibility officer review state (ACTIVE <-> INELIGIBLE loop allowed)" }
      - { name: checked_in, type: boolean, source: system, default: false, description: "Set true by team check-in for listed athletes" }
      - { name: removed, type: boolean, source: system, default: false, description: "Soft removal via DELETE; removed entries are excluded from roster counts and crossover checks" }

  - name: Judge
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Judge name" }
      - { name: certified_levels, type: array, source: input, description: "List of integer levels (1..6) the judge is certified to score; sheet submit requires division.level in this list" }

  - name: Performance
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id" }
      - { name: division_id, type: string, source: system, description: "FK -> Division.id" }
      - { name: performance_order, type: integer, source: system, description: "1-based order within division; assigned by generate-schedule in team created_at ASC order" }
      - { name: scheduled_start, type: datetime, source: system, description: "= division.schedule_start_at + (order-1) * (routine_time_limit_seconds + 180)s" }
      - { name: actual_duration_seconds, type: integer, source: input, description: "Measured routine duration; set by mark-performed" }
      - { name: boundary_violations, type: integer, source: input, default: 0, description: "Out-of-bounds occurrences observed; set by mark-performed" }
      - { name: status, type: enum, source: system, default: SCHEDULED, constraints: "SCHEDULED | PERFORMED | SCORED | OFFICIAL | EXCLUDED | CANCELLED", description: "Performance lifecycle" }
      - { name: provisional_score, type: number, source: computed, description: "calc performance_final_score variant PROVISIONAL; null until PERFORMED with >= 2 SUBMITTED sheets" }
      - { name: official_score, type: number, source: computed, description: "calc performance_final_score variant OFFICIAL; set at confirm-official and recomputed on any later deduction overturn" }
      - { name: rank_in_division, type: integer, source: computed, description: "calc division_ranking; null until OFFICIAL; recomputed for whole division on any official score change" }

  - name: ScoreSheet
    parent: null
    common_fields: true
    fields:
      - { name: performance_id, type: string, source: system, description: "FK -> Performance.id (from path)" }
      - { name: judge_id, type: string, source: system, description: "FK -> Judge.id; equals acting Judge's X-User-ID" }
      - { name: building_difficulty, type: number, source: input, constraints: "0..10", description: "Category score BD" }
      - { name: building_execution, type: number, source: input, constraints: "0..10", description: "Category score BE" }
      - { name: tumbling_difficulty, type: number, source: input, constraints: "0..10", description: "Category score TD" }
      - { name: overall_impression, type: number, source: input, constraints: "0..10", description: "Category score OI" }
      - { name: status, type: enum, source: system, default: DRAFT, constraints: "DRAFT | SUBMITTED | LOCKED", description: "Sheet lifecycle; SUBMITTED -> DRAFT reopen allowed while performance not OFFICIAL" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of last DRAFT -> SUBMITTED transition" }

  - name: Deduction
    parent: null
    common_fields: true
    fields:
      - { name: performance_id, type: string, source: system, description: "FK -> Performance.id (from path)" }
      - { name: type, type: enum, source: input, constraints: "SAFETY | TIME | BOUNDARY", description: "TIME and BOUNDARY are system-generated by mark-performed; manual endpoint accepts SAFETY only" }
      - { name: quantity, type: integer, source: input, constraints: ">= 1", description: "Occurrences (SAFETY/BOUNDARY) or full seconds over limit (TIME)" }
      - { name: skill_tier, type: integer, source: input, constraints: "1..6; SAFETY only", description: "Observed skill tier; a SAFETY deduction requires skill_tier > division.level (legality rule)" }
      - { name: rate_applied, type: number, source: system, description: "Snapshot of the division rate for this deduction type at creation time" }
      - { name: points, type: number, source: computed, description: "= quantity * rate_applied, 2dp round_half_up" }
      - { name: source, type: enum, source: system, default: MANUAL, constraints: "SYSTEM | MANUAL", description: "SYSTEM for auto TIME/BOUNDARY deductions from mark-performed" }
      - { name: applied_by_judge_id, type: string, source: system, description: "FK -> Judge.id; acting SafetyJudge for MANUAL; null for SYSTEM" }
      - { name: status, type: enum, source: system, default: APPLIED, constraints: "APPLIED | UNDER_APPEAL | UPHELD | OVERTURNED | VOIDED", description: "Deduction lifecycle (appeal loop may cycle UNDER_APPEAL <-> UPHELD)" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: deduction_id, type: string, source: system, description: "FK -> Deduction.id (from path)" }
      - { name: round, type: integer, source: system, default: 1, description: "Appeal round; resubmit creates a new Appeal with round = previous + 1; max 2" }
      - { name: note, type: string, source: input, description: "Coach's argument" }
      - { name: video_ref, type: string, source: input, description: "Video evidence reference URL/label" }
      - { name: status, type: enum, source: system, default: SUBMITTED, constraints: "SUBMITTED | ACCEPTED | REJECTED", description: "Appeal lifecycle (per-instance linear; cycle lives on Deduction)" }
      - { name: decided_by_judge_id, type: string, source: system, description: "FK -> Judge.id; HeadJudge who resolved (null until resolved)" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: division_id, type: string, source: system, description: "FK -> Division.id" }
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; offered team" }
      - { name: kind, type: enum, source: system, constraints: "PAID | AT_LARGE", description: "Bid slot kind" }
      - { name: status, type: enum, source: system, default: OFFERED, constraints: "OFFERED | ACCEPTED | DECLINED | EXPIRED | REVOKED", description: "Bid lifecycle" }
      - { name: rank_at_offer, type: integer, source: system, description: "Team's division rank when the offer was created" }
      - { name: offered_at, type: datetime, source: system, description: "Logical-clock timestamp of offer" }
      - { name: acceptance_deadline, type: datetime, source: system, description: "= offered_at + 72h; checkpoint expires OFFERED bids whose deadline < now" }

  - name: MusicSubmission
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id (from path)" }
      - { name: track_count, type: integer, source: input, constraints: ">= 1", description: "Number of tracks in the routine mix" }
      - { name: license_provider, type: string, source: input, description: "Licensing provider name" }
      - { name: license_reference, type: string, source: input, description: "License proof reference code" }
      - { name: status, type: enum, source: system, default: SUBMITTED, constraints: "SUBMITTED | VERIFIED | FLAGGED | SUPERSEDED", description: "Review state; creating a new submission supersedes a SUBMITTED/FLAGGED predecessor" }
      - { name: flag_reason, type: string, source: system, description: "Reason recorded when FLAGGED" }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: name, type: string, source: input, description: "Session name, e.g. 'Saturday AM'" }
      - { name: starts_at, type: datetime, source: input, description: "Session open time" }
      - { name: ends_at, type: datetime, source: input, description: "Session close time; must be > starts_at" }
      - { name: capacity, type: integer, source: input, constraints: ">= 1", description: "Spectator seat capacity" }
      - { name: seats_held, type: integer, source: computed, default: 0, description: "Sum of quantity over TicketOrder.status == HELD" }
      - { name: seats_sold, type: integer, source: computed, default: 0, description: "Sum of quantity over TicketOrder.status == PAID" }
      - { name: seats_available, type: integer, source: computed, description: "= capacity - seats_held - seats_sold; invariant: seats_available + seats_held + seats_sold == capacity" }

  - name: TicketOrder
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> Session.id" }
      - { name: purchaser_user_id, type: string, source: system, description: "Opaque Spectator X-User-ID captured at creation; pay/cancel ownership check" }
      - { name: quantity, type: integer, source: input, constraints: "1..40", description: "Tickets requested (MAX_PER_ORDER = 40)" }
      - { name: tier, type: enum, source: computed, constraints: "ADVANCE | GATE", description: "ADVANCE iff order created_at <= event.start_date - 14 days (00:00:00Z cutoff); else GATE" }
      - { name: unit_price_cents, type: integer, source: computed, description: "1295 ADVANCE / 1895 GATE" }
      - { name: discount_cents, type: integer, source: computed, description: "10% of subtotal when quantity >= 20; rounding per calc ticket_order_total" }
      - { name: total_cents, type: integer, source: computed, description: "calc ticket_order_total variant ORDER_LEVEL" }
      - { name: status, type: enum, source: system, default: HELD, constraints: "HELD | PAID | CANCELLED | REFUNDED | EXPIRED", description: "Order lifecycle" }
      - { name: hold_expires_at, type: datetime, source: system, description: "= created_at + 15 minutes; pay rejected after this; checkpoint expires the order" }

  - name: WarmUpAssignment
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; overlap checks scope to (event_id, mat)" }
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: mat, type: string, source: input, description: "Warm-up mat label" }
      - { name: starts_at, type: datetime, source: input, description: "Window start (half-open interval [starts_at, ends_at))" }
      - { name: ends_at, type: datetime, source: input, description: "Window end; must be > starts_at" }
      - { name: source, type: enum, source: system, default: MANUAL, constraints: "SYSTEM | MANUAL", description: "SYSTEM when created by generate-schedule" }
      - { name: status, type: enum, source: system, default: BOOKED, constraints: "BOOKED | RELEASED", description: "RELEASED frees the mat interval" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: REGISTRATION_OPEN
        trigger: "POST /api/events/{id}/open-registration"
        actor: EventDirector
        preconditions: []
        side_effects: ["Event.version += 1"]
      - from: REGISTRATION_OPEN
        to: REGISTRATION_CLOSED
        trigger: "POST /api/events/{id}/close-registration"
        actor: EventDirector
        preconditions: []
        side_effects: ["Event.version += 1"]
      - from: REGISTRATION_CLOSED
        to: SCHEDULED
        trigger: "system (automatic when the last unscheduled Division of the event completes generate-schedule)"
        actor: system
        preconditions: ["Every Division of the event has scheduled == true"]
        side_effects: ["Event.version += 1"]
      - from: SCHEDULED
        to: LIVE
        trigger: "POST /api/events/{id}/go-live"
        actor: EventDirector
        preconditions: ["Event.status == SCHEDULED (every division scheduled)"]
        side_effects: ["Event.version += 1"]
      - from: LIVE
        to: FINALIZED
        trigger: "POST /api/events/{id}/finalize"
        actor: EventDirector
        preconditions:
          - "Every Performance of the event is in a terminal state (OFFICIAL | EXCLUDED | CANCELLED)"
          - "No Appeal with status SUBMITTED exists for any deduction of the event"
          - "No Bid with status OFFERED exists for any division of the event (ERR_PENDING_BIDS)"
        side_effects: ["Event.version += 1"]

  - entity: Team
    initial_state: REGISTERED
    terminal_states: [WITHDRAWN, DISQUALIFIED]
    note: "Two parallel state dimensions: reg_status (this machine) x music_status (separate machine below). Both must be satisfied where transitions say so."
    transitions:
      - from: REGISTERED
        to: ROSTER_LOCKED
        trigger: "POST /api/teams/{id}/lock-roster"
        actor: TeamCoach
        preconditions:
          - "Team.event.status == REGISTRATION_OPEN (ERR_REGISTRATION_NOT_OPEN)"
          - "count(RosterEntry where team_id = id AND removed == false AND eligibility_status == ACTIVE) is within [division.min_athletes, division.max_athletes] (ERR_ROSTER_TOO_SMALL / ERR_ROSTER_TOO_LARGE)"
        side_effects: ["Team.version += 1"]
      - from: ROSTER_LOCKED
        to: CHECKED_IN
        trigger: "POST /api/teams/{id}/check-in"
        actor: TeamCoach
        preconditions:
          - "Team.event.status == LIVE (ERR_EVENT_NOT_LIVE)"
          - "Team.music_status == VERIFIED (ERR_MUSIC_NOT_VERIFIED)"
          - "Every athlete_id in payload maps to a non-removed RosterEntry of this team (ERR_NOT_FOUND)"
          - "count(listed entries with eligibility_status == ACTIVE) >= division.min_athletes (ERR_ROSTER_TOO_SMALL)"
        side_effects:
          - "Each listed RosterEntry.checked_in = true"
          - "Team.version += 1"
      - from: CHECKED_IN
        to: COMPETED
        trigger: "system (automatic when the team's Performance -> OFFICIAL)"
        actor: system
        preconditions: []
        side_effects: ["Team.version += 1"]
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /api/teams/{id}/withdraw"
        actor: TeamCoach
        preconditions: ["Acting X-User-ID == team.coach_user_id (ERR_FORBIDDEN)"]
        side_effects:
          - "Every SCHEDULED Performance of the team -> CANCELLED"
          - "Every OFFERED or ACCEPTED Bid of the team -> REVOKED; division.bid_pool_available += 1 per revoked bid; then bid re-offer cascade (calc bid_allocation step REOFFER) runs per freed slot"
          - "Team.version += 1"
      - from: ROSTER_LOCKED
        to: WITHDRAWN
        trigger: "POST /api/teams/{id}/withdraw"
        actor: TeamCoach
        preconditions: ["Acting X-User-ID == team.coach_user_id (ERR_FORBIDDEN)"]
        side_effects: ["Same cascade as REGISTERED -> WITHDRAWN"]
      - from: CHECKED_IN
        to: WITHDRAWN
        trigger: "POST /api/teams/{id}/withdraw"
        actor: TeamCoach
        preconditions: ["Acting X-User-ID == team.coach_user_id (ERR_FORBIDDEN)"]
        side_effects: ["Same cascade as REGISTERED -> WITHDRAWN"]
      - from: REGISTERED
        to: DISQUALIFIED
        trigger: "POST /api/teams/{id}/disqualify"
        actor: EventDirector
        preconditions: []
        side_effects:
          - "Every non-CANCELLED Performance of the team -> EXCLUDED"
          - "calc division_ranking recomputed excluding EXCLUDED performances"
          - "Every OFFERED or ACCEPTED Bid of the team -> REVOKED; division.bid_pool_available += 1 per revoked bid; then bid re-offer cascade"
          - "Team.version += 1"
      - from: ROSTER_LOCKED
        to: DISQUALIFIED
        trigger: "POST /api/teams/{id}/disqualify"
        actor: EventDirector
        preconditions: []
        side_effects: ["Same cascade as REGISTERED -> DISQUALIFIED"]
      - from: CHECKED_IN
        to: DISQUALIFIED
        trigger: "POST /api/teams/{id}/disqualify"
        actor: EventDirector
        preconditions: []
        side_effects: ["Same cascade as REGISTERED -> DISQUALIFIED"]
      - from: COMPETED
        to: DISQUALIFIED
        trigger: "POST /api/teams/{id}/disqualify"
        actor: EventDirector
        preconditions: []
        side_effects: ["Same cascade as REGISTERED -> DISQUALIFIED (post-competition disqualification re-ranks the division)"]

  - entity: TeamMusic
    note: "Parallel state dimension of Team, keyed by field Team.music_status; transitions are driven by MusicSubmission events. Listed separately for clarity."
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /api/teams/{id}/music-submissions (first submission)"
        actor: TeamCoach
        preconditions: ["Team.reg_status IN {REGISTERED, ROSTER_LOCKED} (not withdrawn/disqualified)"]
        side_effects: ["MusicSubmission created with status SUBMITTED"]
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/music-submissions/{id}/review {decision: VERIFIED}"
        actor: MusicCompliance
        preconditions: []
        side_effects: ["MusicSubmission.status = VERIFIED"]
      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /api/music-submissions/{id}/review {decision: FLAGGED}"
        actor: MusicCompliance
        preconditions: []
        side_effects: ["MusicSubmission.status = FLAGGED with flag_reason"]
      - from: FLAGGED
        to: SUBMITTED
        trigger: "POST /api/teams/{id}/music-submissions (replacement submission)"
        actor: TeamCoach
        preconditions: []
        side_effects:
          - "Previous FLAGGED MusicSubmission -> SUPERSEDED"
          - "New MusicSubmission created with status SUBMITTED"

  - entity: Performance
    initial_state: SCHEDULED
    terminal_states: [OFFICIAL, EXCLUDED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PERFORMED
        trigger: "POST /api/performances/{id}/mark-performed"
        actor: SafetyJudge
        preconditions:
          - "Performance.division.event.status == LIVE (ERR_EVENT_NOT_LIVE)"
          - "Performance.team.reg_status == CHECKED_IN (ERR_TEAM_NOT_CHECKED_IN)"
        side_effects:
          - "If actual_duration_seconds > division.routine_time_limit_seconds: create SYSTEM Deduction type=TIME, quantity = actual_duration_seconds - limit, rate_applied = division.time_deduction_per_second"
          - "If boundary_violations > 0: create SYSTEM Deduction type=BOUNDARY, quantity = boundary_violations, rate_applied = division.boundary_deduction_points"
          - "Performance.version += 1"
      - from: PERFORMED
        to: SCORED
        trigger: "system (automatic when quorum reached: every judge_id in division.judge_ids has a SUBMITTED ScoreSheet for this performance)"
        actor: system
        preconditions: []
        side_effects: ["calc performance_final_score variant PROVISIONAL computed and stored in provisional_score"]
      - from: SCORED
        to: PERFORMED
        trigger: "system (automatic when a SUBMITTED ScoreSheet is reopened to DRAFT and quorum is lost)"
        actor: system
        preconditions: []
        side_effects: ["provisional_score recomputed (nulls if < 2 SUBMITTED sheets remain)"]
      - from: SCORED
        to: OFFICIAL
        trigger: "POST /api/performances/{id}/confirm-official"
        actor: HeadJudge
        preconditions:
          - "No Deduction of this performance has status UNDER_APPEAL (ERR_PENDING_APPEALS)"
        side_effects:
          - "calc performance_final_score variant OFFICIAL -> official_score"
          - "calc division_ranking recomputed for the division; rank_in_division updated on all OFFICIAL sibling performances"
          - "Every SUBMITTED ScoreSheet of this performance -> LOCKED"
          - "Team.reg_status CHECKED_IN -> COMPETED"
          - "If every non-CANCELLED performance of the division is now OFFICIAL or EXCLUDED: system runs calc bid_allocation for the division (initial offers from division.bid_pool_available)"
          - "Performance.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (team withdrawal cascade or schedule regeneration supersede)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PERFORMED
        to: EXCLUDED
        trigger: "system (team disqualification cascade)"
        actor: system
        preconditions: []
        side_effects: ["Performance excluded from ranking and aggregation inputs"]
      - from: SCORED
        to: EXCLUDED
        trigger: "system (team disqualification cascade)"
        actor: system
        preconditions: []
        side_effects: ["Performance excluded from ranking and aggregation inputs"]
      - from: OFFICIAL
        to: EXCLUDED
        trigger: "system (team disqualification cascade; post-official)"
        actor: system
        preconditions: []
        side_effects: ["calc division_ranking recomputed excluding this performance; bids of the team revoked + re-offer cascade"]

  - entity: ScoreSheet
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/score-sheets/{id}/submit"
        actor: Judge
        preconditions:
          - "Performance.status IN {PERFORMED, SCORED} (ERR_PERFORMANCE_NOT_PERFORMED)"
          - "division.level IN judge.certified_levels (ERR_JUDGE_NOT_CERTIFIED)"
        side_effects:
          - "submitted_at = logical now"
          - "If quorum now complete: Performance PERFORMED -> SCORED (provisional recompute)"
      - from: SUBMITTED
        to: DRAFT
        trigger: "PATCH /api/score-sheets/{id} (any score field edit reopens the sheet)"
        actor: Judge
        preconditions:
          - "Performance.status != OFFICIAL (else sheet is LOCKED -> ERR_SCORE_SHEET_LOCKED)"
        side_effects:
          - "If this sheet was the quorum-completing sheet: Performance SCORED -> PERFORMED; provisional_score recomputed on remaining SUBMITTED sheets"
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /api/score-sheets/{id}"
        actor: Judge
        preconditions: []
        side_effects: ["Score fields updated"]
      - from: SUBMITTED
        to: LOCKED
        trigger: "system (when Performance -> OFFICIAL)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Deduction
    initial_state: APPLIED
    terminal_states: [OVERTURNED, VOIDED]
    transitions:
      - from: APPLIED
        to: UNDER_APPEAL
        trigger: "POST /api/deductions/{id}/appeals"
        actor: TeamCoach
        preconditions:
          - "Appeal window open: logical now <= deduction.created_at + 45 minutes (ERR_APPEAL_WINDOW_CLOSED; inclusive boundary)"
          - "Acting X-User-ID == coach_user_id of the team owning the performance (ERR_FORBIDDEN)"
        side_effects:
          - "Appeal created (round = 1, status SUBMITTED)"
          - "provisional_score recomputed (UNDER_APPEAL deductions still count in PROVISIONAL)"
      - from: UNDER_APPEAL
        to: UPHELD
        trigger: "POST /api/appeals/{id}/resolve {decision: REJECTED}"
        actor: HeadJudge
        preconditions:
          - "Segregation: acting HeadJudge's X-User-ID (a Judge.id) is not the judge_id of any ScoreSheet on this deduction's performance (ERR_REVIEWER_CONFLICT)"
          - "Segregation: acting HeadJudge's X-User-ID != deduction.applied_by_judge_id (ERR_APPLIER_CANNOT_RESOLVE)"
        side_effects: ["Deduction remains counted in all score variants"]
      - from: UNDER_APPEAL
        to: OVERTURNED
        trigger: "POST /api/appeals/{id}/resolve {decision: ACCEPTED}"
        actor: HeadJudge
        preconditions: ["Same segregation checks as UPHELD"]
        side_effects:
          - "Deduction excluded from all score variants"
          - "provisional_score recomputed; if Performance.status == OFFICIAL: official_score recomputed, calc division_ranking recomputed for the division, and calc bid_allocation REEVALUATE step runs for the division (revoke OFFERED bids whose team's new rank no longer earns a slot; re-offer freed slots)"
          - "CASCADE depth: Appeal -> Deduction -> Performance(score/rank) -> Bid"
      - from: UPHELD
        to: UNDER_APPEAL
        trigger: "POST /api/appeals/{id}/resubmit (round 2 escalation on the REJECTED appeal)"
        actor: TeamCoach
        preconditions:
          - "The REJECTED Appeal has round == 1 (ERR_APPEAL_NOT_RESUBMITTABLE at round 2)"
          - "Logical now <= deduction.created_at + 45 minutes (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects: ["New Appeal created (round = 2, status SUBMITTED)"]
      - from: APPLIED
        to: VOIDED
        trigger: "POST /api/deductions/{id}/void"
        actor: HeadJudge
        preconditions:
          - "Performance.status != OFFICIAL (ERR_PERFORMANCE_INVALID_STATE)"
          - "Segregation: acting HeadJudge's X-User-ID != deduction.applied_by_judge_id (ERR_SELF_VOID_FORBIDDEN; null applied_by_judge_id for SYSTEM deductions is voidable by any HeadJudge)"
        side_effects: ["Deduction excluded from all score variants; provisional_score recomputed"]

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/appeals/{id}/resolve {decision: ACCEPTED}"
        actor: HeadJudge
        preconditions: ["Deduction.status == UNDER_APPEAL for this appeal's deduction"]
        side_effects: ["See Deduction UNDER_APPEAL -> OVERTURNED cascade"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/appeals/{id}/resolve {decision: REJECTED}"
        actor: HeadJudge
        preconditions: ["Deduction.status == UNDER_APPEAL"]
        side_effects: ["Deduction -> UPHELD"]

  - entity: Bid
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, REVOKED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /api/bids/{id}/accept"
        actor: TeamCoach
        preconditions:
          - "Logical now <= bid.acceptance_deadline (ERR_BID_ACCEPTANCE_CLOSED)"
          - "Acting X-User-ID == bid.team.coach_user_id (ERR_FORBIDDEN)"
          - "Team.reg_status not IN {WITHDRAWN, DISQUALIFIED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: OFFERED
        to: DECLINED
        trigger: "POST /api/bids/{id}/decline"
        actor: TeamCoach
        preconditions: ["Acting X-User-ID == bid.team.coach_user_id (ERR_FORBIDDEN)"]
        side_effects:
          - "division.bid_pool_available += 1"
          - "calc bid_allocation REOFFER step runs immediately for the freed slot (same kind, next eligible team by rank)"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (POST /api/events/{id}/checkpoint sweep when acceptance_deadline < now)"
        actor: system
        preconditions: []
        side_effects: ["division.bid_pool_available += 1; calc bid_allocation REOFFER step runs immediately"]
      - from: OFFERED
        to: REVOKED
        trigger: "system (team withdraw/disqualify cascade, AT_LARGE->PAID upgrade, or post-appeal bid re-evaluation)"
        actor: system
        preconditions: []
        side_effects: ["division.bid_pool_available += 1; re-offer cascade per trigger"]
      - from: ACCEPTED
        to: REVOKED
        trigger: "system (team withdraw/disqualify cascade only)"
        actor: system
        preconditions: []
        side_effects: ["division.bid_pool_available += 1; re-offer cascade"]

  - entity: MusicSubmission
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /api/music-submissions/{id}/review {decision: VERIFIED}"
        actor: MusicCompliance
        preconditions: []
        side_effects: ["Team.music_status = VERIFIED"]
      - from: SUBMITTED
        to: FLAGGED
        trigger: "POST /api/music-submissions/{id}/review {decision: FLAGGED}"
        actor: MusicCompliance
        preconditions: ["payload.reason present (ERR_INVALID_INPUT)"]
        side_effects: ["Team.music_status = FLAGGED; flag_reason = reason"]
      - from: FLAGGED
        to: SUPERSEDED
        trigger: "POST /api/teams/{id}/music-submissions (replacement)"
        actor: TeamCoach
        preconditions: ["Latest submission for the team is FLAGGED (ERR_MUSIC_ALREADY_VERIFIED if VERIFIED; ERR_MUSIC_REVIEW_PENDING if SUBMITTED)"]
        side_effects: ["Team.music_status = SUBMITTED via new submission"]

  - entity: RosterEntry
    initial_state: ACTIVE
    terminal_states: []
    note: "removed == true models the terminal REMOVED state (soft delete); eligibility loops ACTIVE <-> INELIGIBLE."
    transitions:
      - from: ACTIVE
        to: INELIGIBLE
        trigger: "POST /api/roster-entries/{id}/set-eligibility {eligibility_status: INELIGIBLE}"
        actor: EligibilityOfficer
        preconditions:
          - "If team.reg_status == ROSTER_LOCKED: resulting ACTIVE non-removed count must stay >= division.min_athletes (ERR_ROSTER_TOO_SMALL)"
        side_effects: []
      - from: INELIGIBLE
        to: ACTIVE
        trigger: "POST /api/roster-entries/{id}/set-eligibility {eligibility_status: ACTIVE}"
        actor: EligibilityOfficer
        preconditions:
          - "Team.reg_status IN {REGISTERED, ROSTER_LOCKED} (ERR_ROSTER_LOCKED semantics: no eligibility changes once CHECKED_IN)"
          - "Resulting ACTIVE non-removed count must stay <= division.max_athletes (ERR_ROSTER_TOO_LARGE)"
        side_effects: []
      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /api/roster-entries/{id}"
        actor: TeamCoach
        preconditions:
          - "Team.reg_status == REGISTERED (ERR_ROSTER_LOCKED once ROSTER_LOCKED or beyond)"
        side_effects: ["removed = true"]
      - from: INELIGIBLE
        to: REMOVED
        trigger: "DELETE /api/roster-entries/{id}"
        actor: TeamCoach
        preconditions: ["Team.reg_status == REGISTERED"]
        side_effects: ["removed = true"]

  - entity: TicketOrder
    initial_state: HELD
    terminal_states: [CANCELLED, REFUNDED, EXPIRED]
    transitions:
      - from: HELD
        to: PAID
        trigger: "POST /api/ticket-orders/{id}/pay"
        actor: Spectator
        preconditions:
          - "Logical now <= order.hold_expires_at (ERR_ORDER_HOLD_EXPIRED)"
          - "Acting X-User-ID == order.purchaser_user_id (ERR_FORBIDDEN)"
        side_effects: ["session.seats_held -= quantity; session.seats_sold += quantity"]
      - from: HELD
        to: CANCELLED
        trigger: "POST /api/ticket-orders/{id}/cancel"
        actor: Spectator
        preconditions: ["Acting X-User-ID == order.purchaser_user_id (ERR_FORBIDDEN)"]
        side_effects: ["session.seats_held -= quantity"]
      - from: PAID
        to: REFUNDED
        trigger: "POST /api/ticket-orders/{id}/cancel"
        actor: Spectator
        preconditions: ["Acting X-User-ID == order.purchaser_user_id (ERR_FORBIDDEN)"]
        side_effects: ["session.seats_sold -= quantity"]
      - from: HELD
        to: EXPIRED
        trigger: "system (POST /api/events/{id}/checkpoint sweep when hold_expires_at < now)"
        actor: system
        preconditions: []
        side_effects: ["session.seats_held -= quantity"]

  - entity: WarmUpAssignment
    initial_state: BOOKED
    terminal_states: [RELEASED]
    transitions:
      - from: BOOKED
        to: RELEASED
        trigger: "POST /api/warm-up-assignments/{id}/release"
        actor: TeamCoach
        preconditions: ["Acting X-User-ID == assignment.team.coach_user_id (ERR_FORBIDDEN)"]
        side_effects: ["Interval freed for future overlap checks"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: schedule-regen-stale-division
    parent_entity: Division
    write_endpoint: "POST /api/divisions/{id}/generate-schedule"
    occ_field: "expected_division_version"
    description: |
      Regenerating a division schedule wholesale supersedes the prior schedule
      (existing SCHEDULED performances are cancelled and recreated). A request
      carrying an expected_division_version older than Division.version is
      rejected: the caller's view of the schedule predates a superseding
      regeneration (or another division mutation) and must be re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: deduction-amend-stale-version
    parent_entity: Deduction
    write_endpoint: "PATCH /api/deductions/{id}"
    occ_field: "expected_deduction_version"
    description: |
      Amending an APPLIED deduction's quantity/skill_tier with an
      expected_deduction_version older than Deduction.version is rejected:
      the deduction has changed (e.g., status transition or a prior amendment)
      since the caller observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: bid-reallocation-stale-event
    parent_entity: Event
    write_endpoint: "POST /api/events/{id}/allocate-bids"
    occ_field: "expected_event_version"
    description: |
      Re-running bid allocation supersedes the standing allocation (revokes
      OFFERED bids and re-offers per current ranks). A request carrying an
      expected_event_version older than Event.version is rejected: the event
      has been mutated (status transitions or a prior allocation) since the
      caller observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: performance_base_score
    trigger: "On ScoreSheet DRAFT->SUBMITTED (quorum), ScoreSheet SUBMITTED->DRAFT reopen, Deduction creation/void/overturn, and confirm-official"
    algorithm: weighted_scoring
    formula: |
      CATEGORIES = [building_difficulty, building_execution, tumbling_difficulty, overall_impression]
      WEIGHTS    = {building_difficulty: 0.30, building_execution: 0.30,
                    tumbling_difficulty: 0.20, overall_impression: 0.20}   # sums to 1.00
      For each category c:
        values = [sheet.c for sheet in ScoreSheets of the performance with status SUBMITTED]
        if variant == OFFICIAL and len(values) >= TRIM_MIN_PANEL:
          remove exactly ONE highest and ONE lowest value (single occurrence each)
        avg_c = mean(remaining values)           # unrounded
      base = (sum over c of WEIGHTS[c] * avg_c) * SCORE_SCALE
      base_score = round_half_up(base, 2)
      Rounding order is pinned: NO rounding of per-category averages; exactly one
      round_half_up to 2 decimal places after the weighted sum and scaling.
    input_set: "ScoreSheets of one Performance with status SUBMITTED; EXCLUDED performances contribute nothing and are skipped by callers"
    constants:
      TRIM_MIN_PANEL: 5
      SCORE_SCALE: 10
      PROVISIONAL_MIN_SHEETS: 2
    precision: "2 decimal places, round_half_up (single final rounding step only)"
    variants:
      - name: OFFICIAL
        when: "confirm-official and any post-official deduction overturn recompute"
        difference: "Applies the >=5-sheet high/low trim per category; requires full panel quorum (guaranteed by Performance SCORED state)"
      - name: PROVISIONAL
        when: "while Performance.status in {PERFORMED, SCORED} and at least PROVISIONAL_MIN_SHEETS SUBMITTED sheets exist"
        difference: "NEVER trims (straight mean over however many SUBMITTED sheets exist, 2..9); identical sheet data therefore produces a different base than OFFICIAL whenever the panel has >= 5 sheets and high/low values differ from the mean"

  - name: performance_final_score
    trigger: "Same triggers as performance_base_score; writes provisional_score or official_score"
    algorithm: aggregation
    formula: |
      if variant == PROVISIONAL:
        counted = deductions of the performance with status IN {APPLIED, UNDER_APPEAL, UPHELD}
        if count(SUBMITTED sheets) < PROVISIONAL_MIN_SHEETS: provisional_score = null
        else: provisional_score = max(0, base_score(PROVISIONAL) - sum(counted.points))
      if variant == OFFICIAL:
        counted = deductions of the performance with status IN {APPLIED, UPHELD}
        official_score = max(0, base_score(OFFICIAL) - sum(counted.points))
    input_set: "Deductions of one Performance filtered by status per variant; OVERTURNED and VOIDED never count"
    constants:
      FLOOR: 0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: OFFICIAL
        when: "at confirm-official and on any later Deduction -> OVERTURNED"
        difference: "Excludes UNDER_APPEAL deductions (they are unresolved) — a deduction under appeal lowers provisional_score but NOT official_score"
      - name: PROVISIONAL
        when: "from PERFORMED (once >= 2 sheets) until OFFICIAL"
        difference: "Includes UNDER_APPEAL deductions — identical raw data yields a different final score than OFFICIAL whenever an appeal is in flight"

  - name: deduction_points
    trigger: "Deduction creation (manual SAFETY endpoint or system TIME/BOUNDARY at mark-performed) and PATCH amendment"
    algorithm: aggregation
    formula: |
      rate = division safety_deduction_points       if type == SAFETY
             division time_deduction_per_second     if type == TIME
             division boundary_deduction_points     if type == BOUNDARY
      points = round_half_up(quantity * rate, 2)    # rate snapshotted into rate_applied at creation
    input_set: "Single Deduction; quantity is occurrences (SAFETY/BOUNDARY) or full seconds over the limit (TIME)"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: division_ranking
    trigger: "Any change to an OFFICIAL performance's official_score (confirm-official, deduction overturn on OFFICIAL performance), or a performance entering/leaving the ranked set (OFFICIAL, EXCLUDED)"
    algorithm: aggregation
    formula: |
      ranked_set = performances of the division with status == OFFICIAL
      sort by:  (1) official_score DESC
                (2) sum of points over deductions with status IN {APPLIED, UPHELD} ASC   # fewer deduction points wins ties
                (3) base_score(OFFICIAL) category tiebreak: building_execution avg DESC
                (4) scheduled_start ASC                                                   # earlier slot wins; never id
      rank_in_division = 1-based position; written back onto every ranked Performance
    input_set: "Performances of one Division with status OFFICIAL only; EXCLUDED/CANCELLED/SCORED omitted"
    constants: {}
    precision: "integer ranks"

  - name: bid_allocation
    trigger: "Division completion (all non-CANCELLED performances OFFICIAL or EXCLUDED), POST /api/events/{id}/allocate-bids (re-run), Bid DECLINED/EXPIRED/REVOKED (REOFFER), Deduction OVERTURNED on OFFICIAL performance (REEVALUATE)"
    algorithm: waterfall_allocation
    formula: |
      Eligibility filter: team of an OFFICIAL performance in the division,
        team.reg_status NOT IN {WITHDRAWN, DISQUALIFIED},
        and team does NOT hold a Bid with status ACCEPTED in any division of the event.
      INITIAL allocation (division just completed or manual re-run):
        PAID slots:      top division.paid_bid_count teams by rank_in_division ASC.
        AT_LARGE slots:  next teams by rank_in_division ASC whose official_score >=
                         round_half_up(AT_LARGE_PCT * division_winner_official_score, 2);
                         boundary is INCLUSIVE (>=). A team holding an OFFERED AT_LARGE bid
                         is still eligible for a PAID slot (upgrade).
        Evaluation order: all PAID offers first, then AT_LARGE offers; teams considered in
        rank_in_division ASC order; ties impossible (ranking is total per division_ranking).
      REOFFER (a slot returns to bid_pool_available):
        The team whose decline/expiry/revocation freed the slot is EXCLUDED from this
        re-offer (it already refused or lost this slot).
        For a freed PAID slot: next-ranked eligible team; if that team holds an OFFERED
          AT_LARGE bid, that AT_LARGE bid -> REVOKED (upgrade) and the AT_LARGE slot is
          itself reoffered by the same rule. PAID reoffers carry NO score threshold.
        For a freed AT_LARGE slot: next-ranked eligible team meeting the AT_LARGE threshold.
        If no eligible team exists, the slot remains in bid_pool_available.
      REEVALUATE (post-appeal rank change on an OFFICIAL performance):
        Recompute ranks, revoke every OFFERED bid in the division (pool += n), then run
        INITIAL allocation against the new ranks. ACCEPTED bids are never revoked by
        REEVALUATE (only by team withdraw/disqualify).
      Empty-pool fallback: allocation with bid_pool_available == 0 creates no bids.
    input_set: "OFFICIAL performances of the division (ranks), existing Bids of the division, division.bid_pool_available"
    constants:
      AT_LARGE_PCT: 0.90
      BID_ACCEPTANCE_HOURS: 72
    precision: "threshold rounded to 2 decimal places, round_half_up, compared with >="

  - name: ticket_order_total
    trigger: "POST /api/ticket-orders (at creation; price snapshot never recomputed afterwards)"
    algorithm: tiered_pricing
    formula: |
      cutoff = event.start_date - 14 days at 00:00:00Z
      tier   = ADVANCE if order.created_at <= cutoff else GATE      # INCLUSIVE boundary
      unit   = ADVANCE_PRICE_CENTS if ADVANCE else GATE_PRICE_CENTS
      subtotal = quantity * unit                                    # integer cents, exact
      if quantity >= GROUP_MIN_QTY:                                 # INCLUSIVE boundary
        discount_cents = round_half_up(subtotal * GROUP_DISCOUNT_PCT, 0)   # round to whole cents
      else:
        discount_cents = 0
      total_cents = subtotal - discount_cents
      ROUNDING ORDER (pinned): discount is computed on the order SUBTOTAL and rounded once
      to whole cents; the total is then subtotal minus that rounded discount. The
      PER_UNIT variant below is documented but NOT used by the API.
    input_set: "Single TicketOrder; its Session's Event start_date"
    constants:
      ADVANCE_PRICE_CENTS: 1295
      GATE_PRICE_CENTS: 1895
      GROUP_MIN_QTY: 20
      GROUP_DISCOUNT_PCT: 0.10
      HOLD_MINUTES: 15
      MAX_PER_ORDER: 40
      ADVANCE_CUTOFF_DAYS: 14
    precision: "integer cents; single round_half_up at the discount step"
    variants:
      - name: ORDER_LEVEL
        when: "always — this is the API variant"
        difference: "discount = round(quantity*unit*0.10) once per order"
      - name: PER_UNIT
        when: "documented alternative interpretation; never served by the API"
        difference: "discounted unit = round(unit*0.90) then multiplied by quantity — e.g. 25 ADVANCE tickets: 25*1295=32375, order-level discount round(3237.5)=3238 -> total 29137; per-unit unit=round(1165.5)=1166 -> total 29150. Same inputs, different cents."

  - name: warmup_schedule_geometry
    trigger: "POST /api/divisions/{id}/generate-schedule"
    algorithm: interval_merge
    formula: |
      P = routine_time_limit_seconds + TRANSITION_BUFFER_S          # performance pitch
      mats_required = ceil(warmup_duration_seconds / P)
      if len(division.warmup_mats) < mats_required: reject ERR_INSUFFICIENT_WARM_UP_MATS
      Teams ordered by team.created_at ASC (registration order) -> performance_order 1..N.
      performance[n].scheduled_start = schedule_start_at + (n-1)*P seconds
      warmup[n] on mat warmup_mats[(n-1) mod len(warmup_mats)]:
        interval = [scheduled_start - (REST_S + warmup_duration_seconds),
                    scheduled_start - REST_S)                        # half-open
      Manual bookings reuse the same rules: half-open overlap per (event_id, mat)
      (adjacency allowed: a.ends_at == b.starts_at does NOT overlap), and a team's
      warm-up must satisfy ends_at + REST_S <= its SCHEDULED performance scheduled_start
      (ERR_MIN_REST_VIOLATION).
    input_set: "Division config + non-terminal Teams of the division (reg_status IN {REGISTERED, ROSTER_LOCKED, CHECKED_IN})"
    constants:
      TRANSITION_BUFFER_S: 180
      REST_S: 600
    precision: "whole seconds"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the eight declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role appears in the endpoint's roles list; ownership: TeamCoach X-User-ID == Team.coach_user_id for coach-scoped ops, Spectator X-User-ID == TicketOrder.purchaser_user_id for pay/cancel, Judge X-User-ID == ScoreSheet.judge_id for sheet PATCH/submit", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request-body shape: all required fields present, types correct, enum members valid, payload-local ranges hold (quantity >= 1 integer, ends_at > starts_at, min_age <= max_age, max_athletes >= min_athletes, judge_ids has 3..9 elements, score fields within 0..10)", error_id: ERR_INVALID_INPUT, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 4, category: existence, check: "Path ids resolve left-to-right, then body FK ids resolve (event_id, division_id, team_id, athlete_id, session_id ...)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "OCC: expected_<parent>_version equals the parent's current version (generate-schedule vs Division, PATCH deduction vs Deduction, allocate-bids vs Event)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /api/divisions/{id}/generate-schedule", "PATCH /api/deductions/{id}", "POST /api/events/{id}/allocate-bids"] }

  - { priority: 6, category: state, check: "Event status permits the operation: team create requires REGISTRATION_OPEN; open/close/go-live require their declared source states; ticket order create requires event status IN {REGISTRATION_OPEN, REGISTRATION_CLOSED, SCHEDULED, LIVE}", error_id: ERR_EVENT_INVALID_STATE, http_status: 409, applies_to: ["POST /api/teams", "POST /api/events/{id}/open-registration", "POST /api/events/{id}/close-registration", "POST /api/events/{id}/go-live", "POST /api/ticket-orders"] }
  - { priority: 6, category: state, check: "check-in and mark-performed require Event.status == LIVE", error_id: ERR_EVENT_NOT_LIVE, http_status: 409, applies_to: ["POST /api/teams/{id}/check-in", "POST /api/performances/{id}/mark-performed"] }
  - { priority: 7, category: state, check: "Team reg_status permits the operation: lock-roster from REGISTERED, check-in from ROSTER_LOCKED, withdraw from REGISTERED/ROSTER_LOCKED/CHECKED_IN (ERR_INVALID_STATE); check-in additionally requires music_status == VERIFIED (ERR_MUSIC_NOT_VERIFIED) and mark-performed requires team CHECKED_IN (ERR_TEAM_NOT_CHECKED_IN)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: ["POST /api/teams/{id}/lock-roster", "POST /api/teams/{id}/check-in", "POST /api/teams/{id}/withdraw"] }
  - { priority: 7, category: state, check: "check-in requires Team.music_status == VERIFIED", error_id: ERR_MUSIC_NOT_VERIFIED, http_status: 409, applies_to: ["POST /api/teams/{id}/check-in"] }
  - { priority: 7, category: state, check: "mark-performed requires Team.reg_status == CHECKED_IN", error_id: ERR_TEAM_NOT_CHECKED_IN, http_status: 409, applies_to: ["POST /api/performances/{id}/mark-performed"] }
  - { priority: 7, category: state, check: "Roster-entry create/delete/set-eligibility: team must be REGISTERED for create/delete (ERR_ROSTER_LOCKED once ROSTER_LOCKED or beyond); set-eligibility allowed in REGISTERED/ROSTER_LOCKED only (ERR_ROSTER_LOCKED once CHECKED_IN)", error_id: ERR_ROSTER_LOCKED, http_status: 409, applies_to: ["POST /api/roster-entries", "DELETE /api/roster-entries/{id}", "POST /api/roster-entries/{id}/set-eligibility"] }
  - { priority: 8, category: state, check: "Performance state permits the operation: sheet create requires PERFORMED|SCORED (ERR_PERFORMANCE_NOT_PERFORMED from SCHEDULED; ERR_PERFORMANCE_INVALID_STATE from OFFICIAL/EXCLUDED/CANCELLED); mark-performed requires SCHEDULED (ERR_INVALID_STATE otherwise); confirm-official from SCHEDULED -> ERR_PERFORMANCE_NOT_PERFORMED, from OFFICIAL -> ERR_PERFORMANCE_INVALID_STATE; deduction create requires PERFORMED|SCORED (same pair)", error_id: ERR_PERFORMANCE_NOT_PERFORMED, http_status: 409, applies_to: ["POST /api/performances/{id}/score-sheets", "POST /api/performances/{id}/deductions", "POST /api/performances/{id}/confirm-official"] }
  - { priority: 8, category: state, check: "Performance already terminal/OFFICIAL where forbidden: sheet PATCH or submit against OFFICIAL performance -> sheet LOCKED (ERR_SCORE_SHEET_LOCKED); deduction create/void against OFFICIAL performance (ERR_PERFORMANCE_INVALID_STATE); generate-schedule when any performance already PERFORMED or later (ERR_INVALID_STATE)", error_id: ERR_PERFORMANCE_INVALID_STATE, http_status: 409, applies_to: ["POST /api/performances/{id}/deductions", "POST /api/deductions/{id}/void", "POST /api/divisions/{id}/generate-schedule", "PATCH /api/score-sheets/{id}", "POST /api/score-sheets/{id}/submit"] }
  - { priority: 8, category: state, check: "ScoreSheet PATCH/submit allowed only while sheet not LOCKED", error_id: ERR_SCORE_SHEET_LOCKED, http_status: 409, applies_to: ["PATCH /api/score-sheets/{id}", "POST /api/score-sheets/{id}/submit"] }
  - { priority: 9, category: state, check: "Deduction state: appeal create requires APPLIED; PATCH amend requires APPLIED; void requires APPLIED (ERR_DEDUCTION_NOT_APPLIED otherwise)", error_id: ERR_DEDUCTION_NOT_APPLIED, http_status: 409, applies_to: ["POST /api/deductions/{id}/appeals", "PATCH /api/deductions/{id}", "POST /api/deductions/{id}/void"] }
  - { priority: 9, category: state, check: "MusicSubmission review requires status SUBMITTED (ERR_INVALID_STATE); new submission requires the team's latest submission to be absent or FLAGGED (ERR_MUSIC_STATE_CONFLICT when latest is SUBMITTED pending review or VERIFIED)", error_id: ERR_MUSIC_STATE_CONFLICT, http_status: 409, applies_to: ["POST /api/teams/{id}/music-submissions", "POST /api/music-submissions/{id}/review"] }
  - { priority: 10, category: state, check: "Bid accept/decline require status OFFERED", error_id: ERR_BID_NOT_OFFERED, http_status: 409, applies_to: ["POST /api/bids/{id}/accept", "POST /api/bids/{id}/decline"] }
  - { priority: 10, category: state, check: "TicketOrder pay requires HELD; cancel requires HELD or PAID; warm-up release requires BOOKED; appeal resolve requires SUBMITTED; appeal resubmit requires REJECTED", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: ["POST /api/ticket-orders/{id}/pay", "POST /api/ticket-orders/{id}/cancel", "POST /api/warm-up-assignments/{id}/release", "POST /api/appeals/{id}/resolve", "POST /api/appeals/{id}/resubmit"] }
  - { priority: 10, category: state, check: "finalize requires every performance terminal, no SUBMITTED appeals, no OFFERED bids; allocate-bids requires every division complete (all non-CANCELLED performances OFFICIAL|EXCLUDED)", error_id: ERR_FINALIZE_BLOCKED, http_status: 409, applies_to: ["POST /api/events/{id}/finalize", "POST /api/events/{id}/allocate-bids"] }

  - { priority: 11, category: business_safety, check: "Athlete eligibility at roster-entry create: age in full years at event.age_reference_date within [division.min_age, division.max_age] inclusive", error_id: ERR_ATHLETE_AGE_INELIGIBLE, http_status: 422, applies_to: ["POST /api/roster-entries"] }
  - { priority: 11, category: business_safety, check: "Crossover caps at roster-entry create: athlete on at most 2 teams per event (non-removed entries)", error_id: ERR_CROSSOVER_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /api/roster-entries"] }
  - { priority: 11, category: business_safety, check: "Crossover same-division ban: athlete already on another team in the same division", error_id: ERR_SAME_DIVISION_CROSSOVER, http_status: 422, applies_to: ["POST /api/roster-entries"] }
  - { priority: 11, category: business_safety, check: "Judge certification: division.level IN judge.certified_levels at sheet create and re-checked at submit", error_id: ERR_JUDGE_NOT_CERTIFIED, http_status: 422, applies_to: ["POST /api/performances/{id}/score-sheets", "POST /api/score-sheets/{id}/submit"] }
  - { priority: 11, category: business_safety, check: "Routine legality: a SAFETY deduction requires skill_tier > division.level; a deduction citing a legal skill is rejected", error_id: ERR_SKILL_WITHIN_LEGAL_LIMIT, http_status: 422, applies_to: ["POST /api/performances/{id}/deductions"] }
  - { priority: 11, category: business_safety, check: "Segregation of duties on appeal resolve: reviewer must not be an author of any ScoreSheet on the deduction's performance, and must not be deduction.applied_by_judge_id", error_id: ERR_REVIEWER_CONFLICT, http_status: 422, applies_to: ["POST /api/appeals/{id}/resolve"] }
  - { priority: 11, category: business_safety, check: "Segregation of duties on deduction void: voider must not be deduction.applied_by_judge_id (null/system applier is voidable)", error_id: ERR_SELF_VOID_FORBIDDEN, http_status: 422, applies_to: ["POST /api/deductions/{id}/void"] }

  - { priority: 12, category: business_constraint, check: "Team classification: team.level == division.level AND team.category == division.category AND division.event_id == team.event_id", error_id: ERR_DIVISION_MISMATCH, http_status: 422, applies_to: ["POST /api/teams"] }
  - { priority: 12, category: business_constraint, check: "Roster size: create keeps non-removed count <= division.max_athletes (ERR_ROSTER_TOO_LARGE); lock-roster and check-in require eligible/listed count >= division.min_athletes (ERR_ROSTER_TOO_SMALL); set-eligibility enforces both bounds on the resulting count", error_id: ERR_ROSTER_TOO_LARGE, http_status: 422, applies_to: ["POST /api/roster-entries", "POST /api/roster-entries/{id}/set-eligibility"] }
  - { priority: 12, category: business_constraint, check: "Roster floor breaches", error_id: ERR_ROSTER_TOO_SMALL, http_status: 422, applies_to: ["POST /api/teams/{id}/lock-roster", "POST /api/teams/{id}/check-in", "POST /api/roster-entries/{id}/set-eligibility"] }
  - { priority: 12, category: business_constraint, check: "Panel membership and uniqueness at sheet create: acting Judge.id must be in division.judge_ids (ERR_JUDGE_NOT_ON_PANEL) and no existing sheet for (performance, judge) (ERR_DUPLICATE_SCORE_SHEET; checked in this order)", error_id: ERR_JUDGE_NOT_ON_PANEL, http_status: 422, applies_to: ["POST /api/performances/{id}/score-sheets"] }
  - { priority: 12, category: business_constraint, check: "Duplicate sheet for (performance, judge)", error_id: ERR_DUPLICATE_SCORE_SHEET, http_status: 422, applies_to: ["POST /api/performances/{id}/score-sheets"] }
  - { priority: 12, category: business_constraint, check: "confirm-official from PERFORMED means the panel quorum is incomplete", error_id: ERR_QUORUM_NOT_MET, http_status: 422, applies_to: ["POST /api/performances/{id}/confirm-official"] }
  - { priority: 12, category: business_constraint, check: "confirm-official blocked while any deduction of the performance is UNDER_APPEAL", error_id: ERR_PENDING_APPEALS, http_status: 422, applies_to: ["POST /api/performances/{id}/confirm-official"] }
  - { priority: 12, category: business_constraint, check: "generate-schedule requires at least one eligible team and len(warmup_mats) >= ceil(warmup_duration_seconds / (routine_time_limit_seconds + 180))", error_id: ERR_DIVISION_HAS_NO_TEAMS, http_status: 422, applies_to: ["POST /api/divisions/{id}/generate-schedule"] }
  - { priority: 12, category: business_constraint, check: "Warm-up mat sufficiency (ERR_DIVISION_HAS_NO_TEAMS takes precedence when both fail; mats check second)", error_id: ERR_INSUFFICIENT_WARM_UP_MATS, http_status: 422, applies_to: ["POST /api/divisions/{id}/generate-schedule"] }
  - { priority: 12, category: business_constraint, check: "Warm-up booking: half-open [starts_at, ends_at) must not overlap any BOOKED assignment on the same (event_id, mat); adjacency (ends_at == other.starts_at) is allowed", error_id: ERR_WARM_UP_OVERLAP, http_status: 409, applies_to: ["POST /api/warm-up-assignments"] }
  - { priority: 12, category: business_constraint, check: "Warm-up rest rule: for the team's SCHEDULED performance, ends_at + 600s <= performance.scheduled_start", error_id: ERR_MIN_REST_VIOLATION, http_status: 422, applies_to: ["POST /api/warm-up-assignments"] }
  - { priority: 12, category: business_constraint, check: "Appeal resubmit allowed only when the rejected appeal has round == 1 (round cap 2)", error_id: ERR_APPEAL_NOT_RESUBMITTABLE, http_status: 422, applies_to: ["POST /api/appeals/{id}/resubmit"] }

  - { priority: 13, category: business_temporal, check: "Appeal window: logical now <= deduction.created_at + 45 minutes, inclusive; applies to both appeal create and resubmit", error_id: ERR_APPEAL_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /api/deductions/{id}/appeals", "POST /api/appeals/{id}/resubmit"] }
  - { priority: 13, category: business_temporal, check: "Bid acceptance window: logical now <= bid.acceptance_deadline, inclusive", error_id: ERR_BID_ACCEPTANCE_CLOSED, http_status: 422, applies_to: ["POST /api/bids/{id}/accept"] }
  - { priority: 13, category: business_temporal, check: "Ticket hold window: pay requires logical now <= order.hold_expires_at, inclusive", error_id: ERR_ORDER_HOLD_EXPIRED, http_status: 422, applies_to: ["POST /api/ticket-orders/{id}/pay"] }

  - { priority: 14, category: business_fiscal, check: "Session capacity: session.seats_available >= order.quantity (held + sold + requested <= capacity)", error_id: ERR_SESSION_SOLD_OUT, http_status: 409, applies_to: ["POST /api/ticket-orders"] }

# =============================================================================
# §1.5 API Endpoint Table
#
# List-endpoint convention (all GET ...[] endpoints): items are returned in
# created_at ASC order (oldest first) — never ordered by random id. Pagination
# uses the §1.0 envelope fields with its declared defaults.
# Request-body convention: payload fields NOT declared in an endpoint's input
# list are silently ignored (never persisted, never echoed); fields with
# source: system/computed are likewise ignored when supplied.
# =============================================================================
endpoints:
  # ---- Event lifecycle & ops ----
  - { method: POST, path: "/api/events", description: "Create an event (status DRAFT)", roles: [EventDirector], code: 201, input: [name, venue_name, start_date, end_date, age_reference_date], output: Event, side_effects: [] }
  - { method: GET, path: "/api/events/{id}", description: "Fetch one event", roles: [EventDirector, TeamCoach, Judge, HeadJudge, SafetyJudge, MusicCompliance, EligibilityOfficer, Spectator], code: 200, input: [], output: Event, side_effects: [] }
  - { method: POST, path: "/api/events/{id}/open-registration", description: "Event DRAFT -> REGISTRATION_OPEN", roles: [EventDirector], code: 200, input: [], output: Event, side_effects: ["increments Event.version by 1"] }
  - { method: POST, path: "/api/events/{id}/close-registration", description: "Event REGISTRATION_OPEN -> REGISTRATION_CLOSED", roles: [EventDirector], code: 200, input: [], output: Event, side_effects: ["increments Event.version by 1"] }
  - { method: POST, path: "/api/events/{id}/go-live", description: "Event SCHEDULED -> LIVE", roles: [EventDirector], code: 200, input: [], output: Event, side_effects: ["increments Event.version by 1"] }
  - { method: POST, path: "/api/events/{id}/finalize", description: "Event LIVE -> FINALIZED (ERR_FINALIZE_BLOCKED while performances non-terminal, appeals SUBMITTED, or bids OFFERED)", roles: [EventDirector], code: 200, input: [], output: Event, side_effects: ["increments Event.version by 1"] }
  - { method: POST, path: "/api/events/{id}/checkpoint", description: "Ops-run sweep for this event: EXPIRE OFFERED bids with acceptance_deadline < now (pool + re-offer cascade); EXPIRE HELD ticket orders with hold_expires_at < now (release seats). Returns counts.", roles: [EventDirector], code: 200, input: [], output: "{ expired_bid_count: integer, expired_order_count: integer }", side_effects: ["Bid OFFERED -> EXPIRED + re-offer cascade per freed slot", "TicketOrder HELD -> EXPIRED releasing seats"] }
  - { method: POST, path: "/api/events/{id}/allocate-bids", description: "Re-run bid allocation for every division of the event (revokes standing OFFERED bids into the pool and re-offers per current ranks; ACCEPTED bids untouched). OCC-guarded.", roles: [EventDirector], code: 200, input: [expected_event_version], output: "{ offered_bid_ids: string[] }", side_effects: ["increments Event.version by 1", "calc bid_allocation INITIAL per division"] }

  # ---- Divisions & scheduling ----
  - { method: POST, path: "/api/divisions", description: "Create a division (bid_pool_available initialized to paid_bid_count + at_large_bid_count)", roles: [EventDirector], code: 201, input: [event_id, name, category, level, min_age, max_age, min_athletes, max_athletes, routine_time_limit_seconds, "warmup_duration_seconds?", warmup_mats, schedule_start_at, judge_ids, "time_deduction_per_second?", "safety_deduction_points?", "boundary_deduction_points?", "paid_bid_count?", "at_large_bid_count?"], output: Division, side_effects: [] }
  - { method: GET, path: "/api/divisions/{id}", description: "Fetch one division", roles: [EventDirector, TeamCoach, Judge, HeadJudge, SafetyJudge, MusicCompliance, EligibilityOfficer, Spectator], code: 200, input: [], output: Division, side_effects: [] }
  - { method: GET, path: "/api/divisions/{id}/standings", description: "Computed read: ranked OFFICIAL performances of the division (rank_in_division ASC)", roles: [EventDirector, TeamCoach, Judge, HeadJudge, SafetyJudge, MusicCompliance, EligibilityOfficer, Spectator], code: 200, input: [], output: "Performance[]", side_effects: [] }
  - { method: POST, path: "/api/divisions/{id}/generate-schedule", description: "Generate performance order + warm-up assignments per calc warmup_schedule_geometry; supersedes any existing schedule (existing SCHEDULED performances -> CANCELLED). OCC-guarded. On last unscheduled division, Event REGISTRATION_CLOSED -> SCHEDULED.", roles: [EventDirector], code: 200, input: [expected_division_version], output: Division, side_effects: ["increments Division.version by 1", "creates Performances and SYSTEM WarmUpAssignments", "Division.scheduled = true", "auto Event REGISTRATION_CLOSED -> SCHEDULED when all divisions scheduled"] }

  # ---- Teams ----
  - { method: POST, path: "/api/teams", description: "Register a team; coach_user_id must equal acting X-User-ID", roles: [TeamCoach], code: 201, input: [event_id, division_id, name, organization, category, level, coach_user_id], output: Team, side_effects: [] }
  - { method: GET, path: "/api/teams/{id}", description: "Fetch one team", roles: [EventDirector, TeamCoach, Judge, HeadJudge, SafetyJudge, MusicCompliance, EligibilityOfficer, Spectator], code: 200, input: [], output: Team, side_effects: [] }
  - { method: POST, path: "/api/teams/{id}/lock-roster", description: "Team REGISTERED -> ROSTER_LOCKED (roster size gate)", roles: [TeamCoach], code: 200, input: [], output: Team, side_effects: ["increments Team.version by 1"] }
  - { method: POST, path: "/api/teams/{id}/check-in", description: "Team ROSTER_LOCKED -> CHECKED_IN; marks listed roster entries checked_in = true", roles: [TeamCoach], code: 200, input: [athlete_ids], output: Team, side_effects: ["RosterEntry.checked_in = true for listed athletes", "increments Team.version by 1"] }
  - { method: POST, path: "/api/teams/{id}/withdraw", description: "Team -> WITHDRAWN (cascade: SCHEDULED performances CANCELLED, bids REVOKED + re-offer)", roles: [TeamCoach], code: 200, input: [], output: Team, side_effects: ["Performance -> CANCELLED (SCHEDULED only)", "Bid -> REVOKED + pool/re-offer cascade", "increments Team.version by 1"] }
  - { method: POST, path: "/api/teams/{id}/disqualify", description: "Team -> DISQUALIFIED (cascade: performances EXCLUDED, re-rank, bids REVOKED + re-offer)", roles: [EventDirector], code: 200, input: [], output: Team, side_effects: ["Performance -> EXCLUDED (non-CANCELLED)", "calc division_ranking recompute", "Bid -> REVOKED + pool/re-offer cascade", "increments Team.version by 1"] }

  # ---- Music licensing ----
  - { method: POST, path: "/api/teams/{id}/music-submissions", description: "Submit routine music; supersedes a FLAGGED predecessor; blocked while latest is SUBMITTED or VERIFIED (ERR_MUSIC_STATE_CONFLICT)", roles: [TeamCoach], code: 201, input: [track_count, license_provider, license_reference], output: MusicSubmission, side_effects: ["Team.music_status = SUBMITTED", "prior FLAGGED submission -> SUPERSEDED"] }
  - { method: GET, path: "/api/teams/{id}/music-submissions", description: "List a team's music submissions", roles: [EventDirector, TeamCoach, MusicCompliance], code: 200, input: [], output: "MusicSubmission[]", side_effects: [] }
  - { method: POST, path: "/api/music-submissions/{id}/review", description: "Music licensing review decision; FLAGGED requires reason", roles: [MusicCompliance], code: 200, input: [decision, "reason?"], output: MusicSubmission, side_effects: ["Team.music_status = VERIFIED | FLAGGED"] }

  # ---- Athletes & roster ----
  - { method: POST, path: "/api/athletes", description: "Create an athlete (global person record)", roles: [TeamCoach, EligibilityOfficer], code: 201, input: [full_name, date_of_birth], output: Athlete, side_effects: [] }
  - { method: GET, path: "/api/athletes/{id}", description: "Fetch one athlete", roles: [EventDirector, TeamCoach, EligibilityOfficer], code: 200, input: [], output: Athlete, side_effects: [] }
  - { method: POST, path: "/api/roster-entries", description: "Add an athlete to a team roster (age grid + crossover caps + roster cap)", roles: [TeamCoach], code: 201, input: [team_id, athlete_id, bib_number], output: RosterEntry, side_effects: [] }
  - { method: GET, path: "/api/roster-entries/{id}", description: "Fetch one roster entry", roles: [EventDirector, TeamCoach, EligibilityOfficer], code: 200, input: [], output: RosterEntry, side_effects: [] }
  - { method: DELETE, path: "/api/roster-entries/{id}", description: "Soft-remove a roster entry (team must be REGISTERED)", roles: [TeamCoach], code: 204, input: [], output: null, side_effects: ["RosterEntry.removed = true"] }
  - { method: POST, path: "/api/roster-entries/{id}/set-eligibility", description: "Eligibility review loop ACTIVE <-> INELIGIBLE with roster-bound guards", roles: [EligibilityOfficer], code: 200, input: [eligibility_status], output: RosterEntry, side_effects: [] }

  # ---- Judges ----
  - { method: POST, path: "/api/judges", description: "Create a judge with certified levels", roles: [EventDirector], code: 201, input: [full_name, certified_levels], output: Judge, side_effects: [] }
  - { method: GET, path: "/api/judges/{id}", description: "Fetch one judge", roles: [EventDirector, TeamCoach, Judge, HeadJudge, SafetyJudge], code: 200, input: [], output: Judge, side_effects: [] }

  # ---- Performances & scoring ----
  - { method: GET, path: "/api/performances/{id}", description: "Fetch one performance (scores, rank, status)", roles: [EventDirector, TeamCoach, Judge, HeadJudge, SafetyJudge], code: 200, input: [], output: Performance, side_effects: [] }
  - { method: POST, path: "/api/performances/{id}/mark-performed", description: "Record measured duration + boundary count; auto-creates SYSTEM TIME/BOUNDARY deductions", roles: [SafetyJudge], code: 200, input: [actual_duration_seconds, "boundary_violations?"], output: Performance, side_effects: ["Performance SCHEDULED -> PERFORMED", "SYSTEM Deduction rows per limits", "increments Performance.version by 1"] }
  - { method: POST, path: "/api/performances/{id}/score-sheets", description: "Judge creates own DRAFT score sheet (panel membership + certification + uniqueness)", roles: [Judge], code: 201, input: [building_difficulty, building_execution, tumbling_difficulty, overall_impression], output: ScoreSheet, side_effects: ["ScoreSheet.judge_id = acting X-User-ID"] }
  - { method: GET, path: "/api/score-sheets/{id}", description: "Fetch one score sheet", roles: [EventDirector, Judge, HeadJudge], code: 200, input: [], output: ScoreSheet, side_effects: [] }
  - { method: PATCH, path: "/api/score-sheets/{id}", description: "Amend scores; SUBMITTED sheet reopens to DRAFT (quorum may break, Performance SCORED -> PERFORMED); LOCKED rejected", roles: [Judge], code: 200, input: ["building_difficulty?", "building_execution?", "tumbling_difficulty?", "overall_impression?"], output: ScoreSheet, side_effects: ["SUBMITTED -> DRAFT on edit", "quorum-loss cascade to Performance"] }
  - { method: POST, path: "/api/score-sheets/{id}/submit", description: "Sheet DRAFT -> SUBMITTED; completing quorum moves Performance -> SCORED and computes provisional_score", roles: [Judge], code: 200, input: [], output: ScoreSheet, side_effects: ["submitted_at = now", "possible Performance PERFORMED -> SCORED + provisional recompute"] }
  - { method: POST, path: "/api/performances/{id}/confirm-official", description: "Performance SCORED -> OFFICIAL: official_score, division re-rank, sheet lock, team COMPETED, division-completion bid allocation", roles: [HeadJudge], code: 200, input: [], output: Performance, side_effects: ["calc performance_final_score OFFICIAL", "calc division_ranking", "ScoreSheets -> LOCKED", "Team CHECKED_IN -> COMPETED", "calc bid_allocation on division completion", "increments Performance.version by 1"] }

  # ---- Deductions & appeals ----
  - { method: POST, path: "/api/performances/{id}/deductions", description: "Safety judge applies a manual SAFETY deduction (legality rule: skill_tier must exceed division.level)", roles: [SafetyJudge], code: 201, input: [type, quantity, "skill_tier?"], output: Deduction, side_effects: ["Deduction APPLIED with rate snapshot + points", "provisional_score recompute"] }
  - { method: GET, path: "/api/deductions/{id}", description: "Fetch one deduction", roles: [EventDirector, TeamCoach, HeadJudge, SafetyJudge], code: 200, input: [], output: Deduction, side_effects: [] }
  - { method: PATCH, path: "/api/deductions/{id}", description: "Amend quantity/skill_tier of an APPLIED deduction. OCC-guarded.", roles: [SafetyJudge], code: 200, input: [expected_deduction_version, "quantity?", "skill_tier?"], output: Deduction, side_effects: ["points recomputed from new quantity", "provisional_score recompute", "increments Deduction.version by 1"] }
  - { method: POST, path: "/api/deductions/{id}/void", description: "Head judge voids an APPLIED deduction (not own application; performance not OFFICIAL)", roles: [HeadJudge], code: 200, input: [], output: Deduction, side_effects: ["Deduction -> VOIDED", "provisional_score recompute"] }
  - { method: POST, path: "/api/deductions/{id}/appeals", description: "Coach appeals a deduction with video evidence (45-minute window from deduction.created_at, inclusive)", roles: [TeamCoach], code: 201, input: [note, video_ref], output: Appeal, side_effects: ["Deduction APPLIED -> UNDER_APPEAL"] }
  - { method: GET, path: "/api/appeals/{id}", description: "Fetch one appeal", roles: [EventDirector, TeamCoach, HeadJudge], code: 200, input: [], output: Appeal, side_effects: [] }
  - { method: POST, path: "/api/appeals/{id}/resolve", description: "Head judge resolves an appeal (segregation: no sheet on that performance, not the applier). ACCEPTED overturns and re-ranks/re-bids.", roles: [HeadJudge], code: 200, input: [decision], output: Appeal, side_effects: ["Deduction UNDER_APPEAL -> UPHELD | OVERTURNED", "on OVERTURNED: score recompute -> division re-rank -> bid REEVALUATE cascade"] }
  - { method: POST, path: "/api/appeals/{id}/resubmit", description: "Coach escalates a round-1 REJECTED appeal (round 2, still inside the 45-minute window)", roles: [TeamCoach], code: 201, input: [note, video_ref], output: Appeal, side_effects: ["new Appeal round=2 SUBMITTED", "Deduction UPHELD -> UNDER_APPEAL"] }

  # ---- Bids ----
  - { method: GET, path: "/api/bids/{id}", description: "Fetch one bid", roles: [EventDirector, TeamCoach], code: 200, input: [], output: Bid, side_effects: [] }
  - { method: POST, path: "/api/bids/{id}/accept", description: "Coach accepts an OFFERED bid within its 72h window; one ACCEPTED bid per team per event", roles: [TeamCoach], code: 200, input: [], output: Bid, side_effects: [] }
  - { method: POST, path: "/api/bids/{id}/decline", description: "Coach declines an OFFERED bid; slot returns to pool and re-offers immediately", roles: [TeamCoach], code: 200, input: [], output: Bid, side_effects: ["division.bid_pool_available += 1", "calc bid_allocation REOFFER"] }

  # ---- Sessions & tickets ----
  - { method: POST, path: "/api/sessions", description: "Create a spectator session", roles: [EventDirector], code: 201, input: [event_id, name, starts_at, ends_at, capacity], output: Session, side_effects: [] }
  - { method: GET, path: "/api/sessions/{id}", description: "Fetch one session (seats_held/sold/available)", roles: [EventDirector, TeamCoach, Spectator], code: 200, input: [], output: Session, side_effects: [] }
  - { method: POST, path: "/api/ticket-orders", description: "Create a HELD ticket order; price snapshot per calc ticket_order_total; capacity check includes HELD + PAID", roles: [Spectator], code: 201, input: [session_id, quantity], output: TicketOrder, side_effects: ["session.seats_held += quantity", "hold_expires_at = now + 15m"] }
  - { method: GET, path: "/api/ticket-orders/{id}", description: "Fetch one ticket order", roles: [EventDirector, Spectator], code: 200, input: [], output: TicketOrder, side_effects: [] }
  - { method: POST, path: "/api/ticket-orders/{id}/pay", description: "HELD -> PAID within hold window (ownership-checked)", roles: [Spectator], code: 200, input: [], output: TicketOrder, side_effects: ["session.seats_held -= quantity", "session.seats_sold += quantity"] }
  - { method: POST, path: "/api/ticket-orders/{id}/cancel", description: "HELD -> CANCELLED or PAID -> REFUNDED; seats restored (compensating invariant)", roles: [Spectator], code: 200, input: [], output: TicketOrder, side_effects: ["seats restored per state"] }

  # ---- Warm-up ----
  - { method: POST, path: "/api/warm-up-assignments", description: "Book a warm-up window (half-open overlap per (event_id, mat); 600s rest before the team's SCHEDULED performance)", roles: [TeamCoach], code: 201, input: [event_id, team_id, mat, starts_at, ends_at], output: WarmUpAssignment, side_effects: [] }
  - { method: GET, path: "/api/warm-up-assignments/{id}", description: "Fetch one warm-up assignment", roles: [EventDirector, TeamCoach], code: 200, input: [], output: WarmUpAssignment, side_effects: [] }
  - { method: POST, path: "/api/warm-up-assignments/{id}/release", description: "BOOKED -> RELEASED (frees the mat interval)", roles: [TeamCoach], code: 200, input: [], output: WarmUpAssignment, side_effects: [] }

  # ---- Test-driving: logical clock ----
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock. Startup default before any call: 2026-08-01T00:00:00Z (never falls back to wall clock). Drives appeal windows, bid deadlines, ticket tier cutoff, hold expiry, checkpoint sweeps.", roles: [EventDirector], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

  # ---- FK reverse-reachability sub-resource reads (return Child[]; may be empty) ----
  - { method: GET, path: "/api/events/{id}/divisions", description: "Divisions of an event", roles: [EventDirector, TeamCoach, Judge, HeadJudge, SafetyJudge, MusicCompliance, EligibilityOfficer, Spectator], code: 200, input: [], output: "Division[]", side_effects: [] }
  - { method: GET, path: "/api/events/{id}/teams", description: "Teams of an event", roles: [EventDirector, TeamCoach, Judge, HeadJudge, SafetyJudge, MusicCompliance, EligibilityOfficer, Spectator], code: 200, input: [], output: "Team[]", side_effects: [] }
  - { method: GET, path: "/api/divisions/{id}/teams", description: "Teams of a division", roles: [EventDirector, TeamCoach, Judge, HeadJudge, SafetyJudge, MusicCompliance, EligibilityOfficer, Spectator], code: 200, input: [], output: "Team[]", side_effects: [] }
  - { method: GET, path: "/api/teams/{id}/roster-entries", description: "Roster entries of a team (removed entries excluded by default)", roles: [EventDirector, TeamCoach, EligibilityOfficer], code: 200, input: [], output: "RosterEntry[]", side_effects: [] }
  - { method: GET, path: "/api/athletes/{id}/roster-entries", description: "Roster entries of an athlete (crossover inspection)", roles: [EventDirector, TeamCoach, EligibilityOfficer], code: 200, input: [], output: "RosterEntry[]", side_effects: [] }
  - { method: GET, path: "/api/teams/{id}/performances", description: "Performances of a team", roles: [EventDirector, TeamCoach, Judge, HeadJudge, SafetyJudge], code: 200, input: [], output: "Performance[]", side_effects: [] }
  - { method: GET, path: "/api/divisions/{id}/performances", description: "Performances of a division", roles: [EventDirector, TeamCoach, Judge, HeadJudge, SafetyJudge], code: 200, input: [], output: "Performance[]", side_effects: [] }
  - { method: GET, path: "/api/performances/{id}/score-sheets", description: "Score sheets of a performance", roles: [EventDirector, Judge, HeadJudge], code: 200, input: [], output: "ScoreSheet[]", side_effects: [] }
  - { method: GET, path: "/api/judges/{id}/score-sheets", description: "Score sheets authored by a judge", roles: [EventDirector, Judge, HeadJudge], code: 200, input: [], output: "ScoreSheet[]", side_effects: [] }
  - { method: GET, path: "/api/performances/{id}/deductions", description: "Deductions of a performance", roles: [EventDirector, TeamCoach, HeadJudge, SafetyJudge], code: 200, input: [], output: "Deduction[]", side_effects: [] }
  - { method: GET, path: "/api/deductions/{id}/appeals", description: "Appeals of a deduction (all rounds)", roles: [EventDirector, TeamCoach, HeadJudge], code: 200, input: [], output: "Appeal[]", side_effects: [] }
  - { method: GET, path: "/api/divisions/{id}/bids", description: "Bids of a division", roles: [EventDirector, TeamCoach], code: 200, input: [], output: "Bid[]", side_effects: [] }
  - { method: GET, path: "/api/teams/{id}/bids", description: "Bids of a team", roles: [EventDirector, TeamCoach], code: 200, input: [], output: "Bid[]", side_effects: [] }
  - { method: GET, path: "/api/events/{id}/sessions", description: "Sessions of an event", roles: [EventDirector, TeamCoach, Spectator], code: 200, input: [], output: "Session[]", side_effects: [] }
  - { method: GET, path: "/api/sessions/{id}/ticket-orders", description: "Ticket orders of a session", roles: [EventDirector], code: 200, input: [], output: "TicketOrder[]", side_effects: [] }
  - { method: GET, path: "/api/events/{id}/warm-up-assignments", description: "Warm-up assignments of an event", roles: [EventDirector, TeamCoach], code: 200, input: [], output: "WarmUpAssignment[]", side_effects: [] }
  - { method: GET, path: "/api/teams/{id}/warm-up-assignments", description: "Warm-up assignments of a team", roles: [EventDirector, TeamCoach], code: 200, input: [], output: "WarmUpAssignment[]", side_effects: [] }
  - { method: GET, path: "/api/deductions", description: "Filtered deduction list (audit trail by applying judge)", roles: [EventDirector, HeadJudge, SafetyJudge], code: 200, input: ["applied_by_judge_id?"], output: "Deduction[]", side_effects: [] }
  - { method: GET, path: "/api/appeals", description: "Filtered appeal list (audit trail by deciding judge)", roles: [EventDirector, HeadJudge], code: 200, input: ["decided_by_judge_id?"], output: "Appeal[]", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or ownership mismatch (coach_user_id / purchaser_user_id / sheet author)" }
  - { id: ERR_INVALID_INPUT, http: 400, condition: "Missing required field, wrong type, invalid enum member, or payload-local range violation (quantity >= 1, ends_at > starts_at, min_age <= max_age, judge_ids length 3..9, scores 0..10, ticket quantity 1..40)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version (OCC)" }
  - { id: ERR_EVENT_INVALID_STATE, http: 409, condition: "Event status does not permit the operation (registration not open, not scheduled, ticket sales closed, etc.)" }
  - { id: ERR_EVENT_NOT_LIVE, http: 409, condition: "Operation requires Event.status == LIVE (check-in, mark-performed)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine violation not given a more specific code (wrong source state, terminal lockdown)" }
  - { id: ERR_TEAM_NOT_CHECKED_IN, http: 409, condition: "mark-performed requires the team CHECKED_IN" }
  - { id: ERR_MUSIC_NOT_VERIFIED, http: 409, condition: "check-in requires Team.music_status == VERIFIED" }
  - { id: ERR_MUSIC_STATE_CONFLICT, http: 409, condition: "New music submission while latest is SUBMITTED (pending review) or VERIFIED; or review of a non-SUBMITTED submission" }
  - { id: ERR_ROSTER_LOCKED, http: 409, condition: "Roster mutation attempted after roster lock (create/delete in ROSTER_LOCKED+, eligibility change in CHECKED_IN+)" }
  - { id: ERR_PERFORMANCE_NOT_PERFORMED, http: 409, condition: "Sheet/deduction operation requires the performance to be PERFORMED or SCORED, but it is SCHEDULED" }
  - { id: ERR_PERFORMANCE_INVALID_STATE, http: 409, condition: "Operation forbidden against an OFFICIAL/EXCLUDED/CANCELLED performance (or confirm-official on OFFICIAL)" }
  - { id: ERR_SCORE_SHEET_LOCKED, http: 409, condition: "Score sheet PATCH/submit attempted on a LOCKED sheet (performance OFFICIAL)" }
  - { id: ERR_DEDUCTION_NOT_APPLIED, http: 409, condition: "Appeal/amend/void requires Deduction.status == APPLIED" }
  - { id: ERR_APPEAL_NOT_RESUBMITTABLE, http: 422, condition: "Resubmit on a round-2 appeal (round cap reached)" }
  - { id: ERR_BID_NOT_OFFERED, http: 409, condition: "Bid accept/decline requires status OFFERED" }
  - { id: ERR_BID_ACCEPTANCE_CLOSED, http: 422, condition: "Bid accept after acceptance_deadline (now > deadline)" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "pay requires HELD; cancel requires HELD or PAID" }
  - { id: ERR_ORDER_HOLD_EXPIRED, http: 422, condition: "pay after hold_expires_at (now > hold_expires_at)" }
  - { id: ERR_FINALIZE_BLOCKED, http: 409, condition: "finalize with non-terminal performances, SUBMITTED appeals, or OFFERED bids outstanding; also allocate-bids before all divisions complete" }
  - { id: ERR_ATHLETE_AGE_INELIGIBLE, http: 422, condition: "Athlete age at event.age_reference_date outside [division.min_age, division.max_age]" }
  - { id: ERR_CROSSOVER_LIMIT_EXCEEDED, http: 422, condition: "Athlete would exceed 2 teams in the same event" }
  - { id: ERR_SAME_DIVISION_CROSSOVER, http: 422, condition: "Athlete already rostered on another team in the same division" }
  - { id: ERR_JUDGE_NOT_CERTIFIED, http: 422, condition: "division.level not in judge.certified_levels at sheet create or submit" }
  - { id: ERR_JUDGE_NOT_ON_PANEL, http: 422, condition: "Acting judge not listed in division.judge_ids at sheet create" }
  - { id: ERR_SKILL_WITHIN_LEGAL_LIMIT, http: 422, condition: "SAFETY deduction cites skill_tier <= division.level (skill is legal at this level)" }
  - { id: ERR_REVIEWER_CONFLICT, http: 422, condition: "Appeal reviewer authored a score sheet on that performance or applied the deduction (segregation of duties)" }
  - { id: ERR_SELF_VOID_FORBIDDEN, http: 422, condition: "Head judge attempts to void a deduction they applied themselves" }
  - { id: ERR_DIVISION_MISMATCH, http: 422, condition: "Team level/category/event does not match the division" }
  - { id: ERR_ROSTER_TOO_LARGE, http: 422, condition: "Roster action would exceed division.max_athletes" }
  - { id: ERR_ROSTER_TOO_SMALL, http: 422, condition: "Lock/check-in/eligibility action would drop the eligible roster below division.min_athletes" }
  - { id: ERR_DUPLICATE_SCORE_SHEET, http: 422, condition: "Judge already has a score sheet for this performance" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "confirm-official while panel quorum incomplete (performance still PERFORMED)" }
  - { id: ERR_PENDING_APPEALS, http: 422, condition: "confirm-official while a deduction of the performance is UNDER_APPEAL" }
  - { id: ERR_DIVISION_HAS_NO_TEAMS, http: 422, condition: "generate-schedule with zero eligible teams in the division" }
  - { id: ERR_INSUFFICIENT_WARM_UP_MATS, http: 422, condition: "len(warmup_mats) < ceil(warmup_duration_seconds / (routine_time_limit_seconds + 180))" }
  - { id: ERR_WARM_UP_OVERLAP, http: 409, condition: "Half-open interval collision with a BOOKED assignment on the same (event_id, mat); adjacency allowed" }
  - { id: ERR_MIN_REST_VIOLATION, http: 422, condition: "Warm-up ends_at + 600s > the team's scheduled performance start" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal create/resubmit after deduction.created_at + 45 minutes" }
  - { id: ERR_SESSION_SOLD_OUT, http: 409, condition: "session.seats_available < requested quantity" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EventDirector
    description: "Competition operator: configures events/divisions/sessions/judges, runs scheduling, checkpoints, bid allocation, disqualifications, finalize"
    identity: opaque
    exclusive_operations: [create/open/close/go-live/finalize event, checkpoint, allocate-bids, create division, generate-schedule, create session, create judge, disqualify team, set logical clock]
    shared_operations: [read any resource]
  - name: TeamCoach
    description: "Owns teams via Team.coach_user_id: registers team, manages roster and music, checks in, withdraws, appeals deductions, answers bids, books warm-ups"
    identity: opaque
    exclusive_operations: [create team, lock-roster, check-in, withdraw, music submission, roster-entry create/delete, appeal create/resubmit, bid accept/decline, warm-up book/release]
    shared_operations: [read teams/divisions/performances/bids/standings]
  - name: Judge
    description: "Panel judge; X-User-ID equals a Judge.id; creates and amends own score sheets"
    identity: entity_backed:Judge
    exclusive_operations: [score-sheet create/PATCH/submit]
    shared_operations: [read sheets/performances/standings]
  - name: HeadJudge
    description: "Chief judge; X-User-ID equals a Judge.id; confirms official scores, resolves appeals, voids deductions (segregation-of-duties constrained)"
    identity: entity_backed:Judge
    exclusive_operations: [confirm-official, appeal resolve, deduction void]
    shared_operations: [read sheets/performances/deductions/appeals]
  - name: SafetyJudge
    description: "Safety/deduction judge; X-User-ID equals a Judge.id; records performance duration and applies/amends SAFETY deductions"
    identity: entity_backed:Judge
    exclusive_operations: [mark-performed, deduction create/amend]
    shared_operations: [read performances/deductions]
  - name: MusicCompliance
    description: "Music licensing reviewer"
    identity: opaque
    exclusive_operations: [music-submission review (verify/flag)]
    shared_operations: [read music submissions]
  - name: EligibilityOfficer
    description: "Roster eligibility reviewer (age/crossover enforcement support)"
    identity: opaque
    exclusive_operations: [roster-entry set-eligibility]
    shared_operations: [read athletes/roster entries/teams]
  - name: Spectator
    description: "Ticket buyer; owns orders via TicketOrder.purchaser_user_id"
    identity: opaque
    exclusive_operations: [ticket-order create/pay/cancel]
    shared_operations: [read sessions/orders]
