  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Disbursement actor equals obligation.registered_by_user_id (four-eyes)"
  - id: ERR_SENIORITY_ORDER_VIOLATION
    http: 409
    condition: "Disburse a SUBORDINATE obligation while a SENIOR obligation still has outstanding balance"
  - id: ERR_INSUFFICIENT_FUND_BALANCE
    http: 402
    condition: "Disbursement amount exceeds ProjectFund.balance_cents"
  - id: ERR_DISBURSEMENT_CAP_EXCEEDED
    http: 402
    condition: "Disbursement exceeds obligation.annual_cap_cents remaining for the tax year"
  - id: ERR_INCREMENT_YEAR_EXISTS
    http: 409
    condition: "An IncrementRecord already covers (district_id, tax_year)"
  - id: ERR_INCREMENT_INVALID_STATE
    http: 409
    condition: "finalize a non-CERTIFIED record, or reopen a non-FINALIZED record"
  - id: ERR_AGREEMENT_PERIOD_OVERLAP
    http: 409
    condition: "New SurplusAgreement [start,end) overlaps an existing one for the same taxing body"
  - id: ERR_REPORT_INVALID_STATE
    http: 409
    condition: "file/accept/return on a report in the wrong state"
  - id: ERR_DISBURSEMENT_NOT_VOIDABLE
    http: 409
    condition: "Void on a disbursement not in PAID"
  - id: ERR_STALE_FUND_VERSION
    http: 412
    condition: "expected_fund_version does not match ProjectFund.version"
  - id: ERR_STALE_DISTRICT_VERSION
    http: 412
    condition: "expected_district_version does not match TifDistrict.version"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MunicipalAdmin
    description: "Redevelopment authority: creates/certifies/decertifies districts, adds taxing bodies & agreements, registers obligations, disburses, accepts reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /tif-districts"
      - "POST /tif-districts/{id}/certify"
      - "POST /tif-districts/{id}/decertify"
      - "POST /tif-districts/{id}/taxing-bodies"
      - "POST /tif-districts/{id}/surplus-agreements"
      - "POST /developers"
      - "POST /obligations/{id}/register"
      - "POST /obligations/{id}/return"
      - "POST /obligations/{id}/reject"
      - "POST /obligations/{id}/accrue-interest"
      - "POST /obligations/{id}/disbursements"
      - "POST /disbursements/{id}/void"
      - "POST /annual-reports/{id}/accept"
      - "POST /annual-reports/{id}/return"
    shared_operations:
      - "POST /obligations (BOND)"
      - "all GET reads"
  - name: CountyClerk
    description: "County assessor/clerk: certifies annual EAV (increment records), files annual reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /tif-districts/{id}/increment-records"
      - "POST /increment-records/{id}/finalize"
      - "POST /increment-records/{id}/reopen"
      - "POST /tif-districts/{id}/annual-reports"
      - "POST /annual-reports/{id}/file"
    shared_operations:
      - "all GET reads"
  - name: Developer
    description: "Redevelopment developer: proposes/submits developer-note obligations for its own developer_id; views its own obligations & disbursements."
    identity: "entity_backed:Developer"
    exclusive_operations:
      - "POST /obligations (DEVELOPER_NOTE, developer_id == self)"
      - "POST /obligations/{id}/submit (own obligation)"
    shared_operations:
      - "all GET reads"
  - name: TaxingBodyRep
    description: "Overlapping taxing body representative: read-only oversight of increment, distributions, and agreements affecting its body."
    identity: "entity_backed:TaxingBody"
    exclusive_operations: []
    shared_operations:
      - "all GET reads"

