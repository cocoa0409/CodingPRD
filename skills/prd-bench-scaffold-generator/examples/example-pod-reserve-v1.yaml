# =============================================================================
# Example: pod-reserve benchmark seed tables (v1)
# PodReserve: Sponsorship Reservations + Compliance for Podcasts
# =============================================================================

scenario: |
  Podcast sponsorship reservation and compliance system. Manages podcasts with ad
  inventory budgets, episodes through draft/submit/publish/retract lifecycle, sponsor
  deals with budgets and script versioning, and reservations through hold/approve/
  settle/cancel flows. Considerations: podcast posture (NORMAL/RESTRICTED) driven
  by claims, episode clearance (CLEAR/UNDER_REVIEW), brand safety enforcement
  (FAMILY_SAFE deals on MATURE episodes), ad capacity management at podcast and
  episode levels, deal budget tracking (held/committed/spent/available), script
  version pinning and reclassification to NEEDS_REVIEW, overbooking on capacity
  reduction, hold expiry via ops runs, retraction with sponsorship unwinding
  (settled → credited), claim-driven compliance takedowns, optimistic concurrency
  via If-Match/version.

domain_name: pod-reserve
api_prefix: /podcasts

# =============================================================================
# Table 1: Complexity Profile
# =============================================================================
complexity_profile:
  entity_count: 5
  state_machine_count: 5
  calculation_count: 7
  validation_layers: 5
  endpoint_count: 18
  error_code_count: 16
  role_count: 1

# =============================================================================
# Table 2: Entity Relationship Table
# =============================================================================
entities:
  - name: Podcast
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique podcast identifier" }
      - { name: name, type: string, source: input, description: "Podcast name" }
      - { name: ad_capacity_seconds, type: integer, source: input, description: "Total host-read inventory capacity" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | RESTRICTED" }
      - { name: open_claim_count, type: integer, source: computed, description: "Number of claims in OPEN status" }
      - { name: ops_run_index, type: integer, source: system, description: "Monotonic counter, increments on run_ops" }
      - { name: ad_held_seconds, type: integer, source: computed, description: "Seconds consumed by HOLD reservations" }
      - { name: ad_committed_seconds, type: integer, source: computed, description: "Seconds consumed by APPROVED/NEEDS_REVIEW/SETTLED reservations" }
      - { name: ad_available_seconds, type: integer, source: computed, description: "Remaining capacity, never negative" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Episode
    parent: Podcast
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique episode identifier" }
      - { name: podcast_id, type: string, source: system, description: "Parent podcast" }
      - { name: title, type: string, source: input, description: "Episode title" }
      - { name: content_rating, type: enum, source: input, description: "GENERAL | MATURE" }
      - { name: ad_slots_total_seconds, type: integer, source: input, description: "Episode ad inventory capacity" }
      - { name: ad_slots_held_seconds, type: integer, source: computed, description: "Seconds held by HOLD reservations" }
      - { name: ad_slots_committed_seconds, type: integer, source: computed, description: "Seconds committed by APPROVED/NEEDS_REVIEW/SETTLED reservations" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | LIVE | RETRACTED" }
      - { name: clearance, type: enum, source: computed, description: "CLEAR | UNDER_REVIEW" }
      - { name: reservations, type: array, source: system, description: "Array of {id, deal_id, placement, slot_seconds, status, script_version_pinned, version}" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Deal
    parent: Podcast
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique deal identifier" }
      - { name: podcast_id, type: string, source: system, description: "Parent podcast" }
      - { name: advertiser_name, type: string, source: input, description: "Advertiser name" }
      - { name: brand_tier, type: enum, source: input, description: "FAMILY_SAFE | STANDARD" }
      - { name: budget_total_cents, type: integer, source: input, description: "Total deal budget" }
      - { name: slot_price_cents, type: integer, source: input, description: "Price per reservation slot" }
      - { name: script_text, type: string, source: input, description: "Current host-read copy" }
      - { name: script_version, type: integer, source: system, description: "Starts at 1, increments on script_text change" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | CLOSED" }
      - { name: budget_held_cents, type: integer, source: computed, description: "Budget held by HOLD reservations" }
      - { name: budget_committed_cents, type: integer, source: computed, description: "Budget committed by APPROVED/NEEDS_REVIEW reservations" }
      - { name: budget_spent_cents, type: integer, source: computed, description: "Budget spent by SETTLED reservations" }
      - { name: budget_available_cents, type: integer, source: computed, description: "Remaining budget after held + committed + spent" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Reservation
    parent: Podcast
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique reservation identifier" }
      - { name: podcast_id, type: string, source: system, description: "Parent podcast" }
      - { name: episode_id, type: string, source: input, description: "Associated episode" }
      - { name: deal_id, type: string, source: input, description: "Associated deal" }
      - { name: placement, type: enum, source: input, description: "PRE_ROLL | MID_ROLL | POST_ROLL" }
      - { name: slot_seconds, type: integer, source: input, description: "Duration of the ad slot" }
      - { name: status, type: enum, source: system, description: "HOLD | APPROVED | NEEDS_REVIEW | OVERBOOKED | SETTLED | CREDITED | CANCELED | EXPIRED" }
      - { name: script_version_pinned, type: integer, source: system, description: "Deal script version at approval time, null until approved" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Claim
    parent: Podcast
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Unique claim identifier" }
      - { name: podcast_id, type: string, source: system, description: "Parent podcast" }
      - { name: episode_id, type: string, source: system, description: "Associated episode" }
      - { name: kind, type: enum, source: input, description: "RIGHTS | BRAND_SAFETY" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }
      - { name: outcome, type: enum, source: input, description: "ACCEPTED | REJECTED | WITHDRAWN, null until closed" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

# =============================================================================
# Table 3: State Machine Table
# =============================================================================
state_machines:
  - entity: Podcast
    field: posture
    initial_state: NORMAL
    terminal_states: []
    note: "Posture is derived, not directly set"
    transitions:
      - from: NORMAL
        to: RESTRICTED
        trigger: "system (open_claim_count >= 2, or any ACCEPTED claim exists)"
        actor: system
        preconditions:
          - "Two or more OPEN claims, OR any claim was closed with ACCEPTED outcome"
        side_effects:
          - "Blocks episode publishing, reservation approval, deal activation"

      - from: RESTRICTED
        to: NORMAL
        trigger: "system (ops run when no OPEN claims and restriction was from prior accepted claim)"
        actor: system
        preconditions:
          - "No OPEN claims remaining"
          - "At least one ops run since all claims closed"
        side_effects: []

  - entity: Episode
    field: status
    initial_state: DRAFT
    terminal_states: [RETRACTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST .../episodes/{episode_id}/submit"
        actor: user
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: LIVE
        trigger: "POST .../episodes/{episode_id}/publish"
        actor: user
        preconditions:
          - "No HOLD, NEEDS_REVIEW, or OVERBOOKED reservations on the episode"
          - "Episode clearance is CLEAR (not UNDER_REVIEW)"
          - "Podcast posture is NORMAL (not RESTRICTED)"
        side_effects: []

      - from: [SUBMITTED, LIVE]
        to: RETRACTED
        trigger: "POST .../episodes/{episode_id}/retract or system (claim accepted)"
        actor: "user or system"
        preconditions:
          - "Manual retraction: no HOLD reservations (ERR_EPISODE_HAS_HOLDS)"
          - "Compliance takedown (claim ACCEPTED): holds cleaned up automatically"
        side_effects:
          - "HOLD reservations → CANCELED (releasing holds)"
          - "APPROVED and NEEDS_REVIEW reservations → CANCELED (releasing commitments)"
          - "SETTLED reservations → CREDITED (budget reversed, stops counting committed)"

  - entity: Deal
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "PUT .../deals/{deal_id} with status=ACTIVE"
        actor: user
        preconditions:
          - "Podcast posture is NORMAL (not RESTRICTED)"
        side_effects: []

      - from: ACTIVE
        to: PAUSED
        trigger: "PUT .../deals/{deal_id} with status=PAUSED"
        actor: user
        preconditions: []
        side_effects:
          - "Deal not usable for approvals or settlements until resumed"

      - from: PAUSED
        to: ACTIVE
        trigger: "PUT .../deals/{deal_id} with status=ACTIVE"
        actor: user
        preconditions:
          - "Podcast posture is NORMAL (not RESTRICTED)"
        side_effects: []

      - from: [DRAFT, ACTIVE, PAUSED]
        to: CLOSED
        trigger: "PUT .../deals/{deal_id} with status=CLOSED"
        actor: user
        preconditions: []
        side_effects:
          - "Non-terminal reservations (HOLD, APPROVED, NEEDS_REVIEW, OVERBOOKED) → CANCELED"
          - "SETTLED reservations remain settled"

  - entity: Reservation
    field: status
    initial_state: HOLD
    terminal_states: [SETTLED, CREDITED, CANCELED, EXPIRED]
    transitions:
      - from: HOLD
        to: APPROVED
        trigger: "POST .../reservations/{reservation_id}/approve"
        actor: user
        preconditions:
          - "Deal is ACTIVE"
          - "Episode clearance is CLEAR"
          - "Podcast posture is NORMAL"
          - "Brand safety: FAMILY_SAFE deal not on MATURE episode"
        side_effects:
          - "Shifts from held → committed (podcast, episode, deal)"
          - "Pins script_version_pinned to deal's current script_version"

      - from: APPROVED
        to: NEEDS_REVIEW
        trigger: "system (deal script_text changed, or episode content_rating changed violating brand safety)"
        actor: system
        preconditions: []
        side_effects:
          - "Remains committed (still holds inventory and budget)"
          - "Blocks publishing and settlement"

      - from: NEEDS_REVIEW
        to: APPROVED
        trigger: "POST .../reservations/{reservation_id}/approve"
        actor: user
        preconditions:
          - "Deal is ACTIVE"
          - "Episode clearance is CLEAR"
          - "Podcast posture is NORMAL"
          - "Brand safety check passes"
        side_effects:
          - "Pins script_version_pinned to deal's current script_version"

      - from: APPROVED
        to: OVERBOOKED
        trigger: "system (episode ad_slots_total_seconds reduced, capacity insufficient)"
        actor: system
        preconditions: []
        side_effects:
          - "Stops consuming episode, podcast capacity, and deal budget"
          - "Approved reservations are bumped by Reservation.created_at descending"

      - from: OVERBOOKED
        to: APPROVED
        trigger: "POST .../reservations/{reservation_id}/approve (after capacity restored)"
        actor: user
        preconditions:
          - "Sufficient capacity"
          - "Deal is ACTIVE"
        side_effects:
          - "Resumes consuming capacity and budget"

      - from: APPROVED
        to: SETTLED
        trigger: "POST .../reservations/{reservation_id}/settle"
        actor: user
        preconditions:
          - "Deal is ACTIVE"
          - "Episode is LIVE"
        side_effects:
          - "Deal budget: committed → spent"

      - from: SETTLED
        to: CREDITED
        trigger: "system (episode retracted)"
        actor: system
        preconditions: []
        side_effects:
          - "Deal budget: spent reversed"
          - "Stops counting toward committed seconds"

      - from: [HOLD, APPROVED, NEEDS_REVIEW, OVERBOOKED]
        to: CANCELED
        trigger: "POST .../reservations/{reservation_id}/cancel, or system (deal closed, episode retracted, block cancel)"
        actor: "user or system"
        preconditions: []
        side_effects:
          - "Releases whatever it was consuming (held or committed)"

      - from: HOLD
        to: EXPIRED
        trigger: "system (ops run: hold persists for 2 ops runs)"
        actor: system
        preconditions: []
        side_effects:
          - "Releases held inventory and budget"

  - entity: Claim
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST .../claims/{claim_id}/close"
        actor: user
        preconditions: []
        side_effects:
          - "If outcome=ACCEPTED: episode retracted immediately, holds cleaned up, settled → credited"
          - "If outcome=REJECTED or WITHDRAWN: dispute resolved, no retraction"
          - "Episode clearance becomes CLEAR when all claims closed"
          - "Podcast posture may update (RESTRICTED if ACCEPTED; reset on ops run)"

# =============================================================================
# Table 4: Calculation Rules Table
# =============================================================================
calculations:
  - name: ad_available_seconds
    trigger: "reservation create, approve, cancel, expire, settle, credit, episode retract"
    algorithm: aggregation
    formula: |
      ad_available_seconds = ad_capacity_seconds - ad_held_seconds - ad_committed_seconds
      ad_held_seconds = sum(slot_seconds for HOLD reservations)
      ad_committed_seconds = sum(slot_seconds for APPROVED + NEEDS_REVIEW + SETTLED reservations)
      Never goes negative.

  - name: episode_ad_slots
    trigger: "reservation create, approve, cancel, episode edit"
    algorithm: aggregation
    formula: |
      ad_slots_held_seconds = sum(slot_seconds for HOLD reservations on episode)
      ad_slots_committed_seconds = sum(slot_seconds for APPROVED + NEEDS_REVIEW + SETTLED reservations on episode)

  - name: deal_budget
    trigger: "reservation create, approve, cancel, settle, credit, deal close"
    algorithm: aggregation
    formula: |
      budget_held_cents = count(HOLD reservations) * slot_price_cents
      budget_committed_cents = count(APPROVED + NEEDS_REVIEW reservations) * slot_price_cents
      budget_spent_cents = count(SETTLED reservations) * slot_price_cents
      budget_available_cents = budget_total_cents - budget_held - budget_committed - budget_spent

  - name: podcast_posture
    trigger: "claim open, claim close, ops run"
    algorithm: derived
    formula: |
      RESTRICTED if:
        open_claim_count >= 2
        OR any ACCEPTED claim exists and ops run has not cleared it
      NORMAL otherwise (after ops run clears accepted-claim restriction)

  - name: episode_clearance
    trigger: "claim open, claim close"
    algorithm: derived
    formula: |
      UNDER_REVIEW if any claim on this episode is OPEN
      CLEAR if no OPEN claims on this episode

  - name: hold_expiry
    trigger: "ops run"
    algorithm: age_check
    formula: |
      For each HOLD reservation:
        if reservation has been HOLD for >= 2 ops runs:
          reservation → EXPIRED
          Release held inventory and budget
    constants:
      HOLD_MAX_OPS_RUNS: 2

  - name: overbooking_on_capacity_reduction
    trigger: "episode PUT (ad_slots_total_seconds reduced)"
    algorithm: cascade
    formula: |
      If held + committed > new ad_slots_total_seconds:
        1. Cancel HOLD reservations by Reservation.created_at descending until fits
        2. If still not enough, bump APPROVED reservations by Reservation.created_at descending into OVERBOOKED
      OVERBOOKED reservations stop consuming capacity and budget.

# =============================================================================
# Table 5: Validation Rules Table
# =============================================================================
validations:
  - priority: 1
    category: headers
    check: "If-Match header required on all mutations to existing resources"
    error_id: ERR_MISSING_IF_MATCH
    http_status: 400
    applies_to: "PUT and POST actions on existing resource IDs"

  - priority: 2
    category: existence
    check: "Resource must exist within the correct podcast scope"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 3
    category: posture
    check: "Podcast posture allows the operation"
    error_id: ERR_PODCAST_RESTRICTED
    http_status: 400
    applies_to: "episode publishing, reservation approval, deal activation"

  - priority: 4
    category: state
    check: "Resource in valid state for requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 400
    applies_to: state transition endpoints

  - priority: 5
    category: business
    check: "Business rules (capacity, budget, brand safety, duplicates, review gates)"
    error_id: varies
    http_status: varies
    applies_to: "reservation create, approve, settle, episode publish"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 6: API Endpoint Table (18 endpoints)
# =============================================================================
endpoints:
  # --- Podcast ---
  - method: POST
    path: "/podcasts"
    description: "Create a podcast"
    roles: [Any]
    code: 201
    input: [name, ad_capacity_seconds]
    output: Podcast
    side_effects: ["posture=NORMAL, ops_run_index=0, all counters=0"]

  - method: GET
    path: "/podcasts/{podcast_id}"
    description: "Get podcast details"
    roles: [Any]
    code: 200
    input: []
    output: Podcast
    side_effects: []

  - method: POST
    path: "/podcasts/{podcast_id}/run_ops"
    description: "Run ops (housekeeping)"
    roles: [Any]
    code: 200
    input: []
    output: Podcast
    side_effects:
      - "Increments ops_run_index"
      - "Hold expiry: HOLD reservations aged >= 2 runs → EXPIRED"
      - "Posture reset: RESTRICTED → NORMAL if no OPEN claims and accepted-claim cleared"

  # --- Episodes ---
  - method: POST
    path: "/podcasts/{podcast_id}/episodes"
    description: "Create an episode"
    roles: [Any]
    code: 201
    input: [title, content_rating, ad_slots_total_seconds]
    output: Episode
    side_effects: ["status=DRAFT, clearance=CLEAR"]

  - method: GET
    path: "/podcasts/{podcast_id}/episodes/{episode_id}"
    description: "Get episode details"
    roles: [Any]
    code: 200
    input: []
    output: Episode
    side_effects: []

  - method: PUT
    path: "/podcasts/{podcast_id}/episodes/{episode_id}"
    description: "Edit episode (DRAFT only)"
    roles: [Any]
    code: 200
    input: ["title?", "content_rating?", "ad_slots_total_seconds?"]
    output: Episode
    side_effects:
      - "Only available while DRAFT"
      - "If content_rating changes: approved FAMILY_SAFE reservations on MATURE → NEEDS_REVIEW"
      - "If ad_slots_total_seconds reduced: overbooking cascade (cancel HOLD reservations by Reservation.created_at descending, then bump APPROVED reservations by Reservation.created_at descending → OVERBOOKED)"

  - method: POST
    path: "/podcasts/{podcast_id}/episodes/{episode_id}/submit"
    description: "Submit episode"
    roles: [Any]
    code: 200
    input: []
    output: Episode
    side_effects: ["status → SUBMITTED"]

  - method: POST
    path: "/podcasts/{podcast_id}/episodes/{episode_id}/publish"
    description: "Publish episode"
    roles: [Any]
    code: 200
    input: []
    output: Episode
    side_effects: ["status → LIVE"]

  - method: POST
    path: "/podcasts/{podcast_id}/episodes/{episode_id}/retract"
    description: "Retract episode"
    roles: [Any]
    code: 200
    input: []
    output: Episode
    side_effects:
      - "status → RETRACTED"
      - "HOLD reservations → CANCELED"
      - "APPROVED/NEEDS_REVIEW reservations → CANCELED"
      - "SETTLED reservations → CREDITED"

  # --- Deals ---
  - method: POST
    path: "/podcasts/{podcast_id}/deals"
    description: "Create a deal"
    roles: [Any]
    code: 201
    input: [advertiser_name, brand_tier, budget_total_cents, slot_price_cents, script_text]
    output: Deal
    side_effects: ["status=DRAFT, script_version=1, all budget counters=0"]

  - method: GET
    path: "/podcasts/{podcast_id}/deals/{deal_id}"
    description: "Get deal details"
    roles: [Any]
    code: 200
    input: []
    output: Deal
    side_effects: []

  - method: PUT
    path: "/podcasts/{podcast_id}/deals/{deal_id}"
    description: "Update deal (status and/or script)"
    roles: [Any]
    code: 200
    input: ["status?", "script_text?"]
    output: Deal
    side_effects:
      - "Status transitions: DRAFT→ACTIVE, ACTIVE→PAUSED, PAUSED→ACTIVE, any→CLOSED"
      - "ACTIVE requires podcast NORMAL (not RESTRICTED)"
      - "script_text change: script_version++, APPROVED reservations → NEEDS_REVIEW"
      - "CLOSED: non-terminal reservations → CANCELED"

  # --- Reservations ---
  - method: POST
    path: "/podcasts/{podcast_id}/reservations"
    description: "Create a reservation (HOLD)"
    roles: [Any]
    code: 201
    input: [episode_id, deal_id, placement, slot_seconds]
    output: Reservation
    side_effects:
      - "status=HOLD"
      - "Consumes podcast ad_held_seconds, episode ad_slots_held_seconds, deal budget_held_cents"
      - "Validates: podcast capacity, episode capacity, deal budget"

  - method: POST
    path: "/podcasts/{podcast_id}/reservations/{reservation_id}/approve"
    description: "Approve a reservation"
    roles: [Any]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "status → APPROVED (from HOLD, NEEDS_REVIEW, or OVERBOOKED)"
      - "Shifts held → committed"
      - "Pins script_version_pinned"

  - method: POST
    path: "/podcasts/{podcast_id}/reservations/{reservation_id}/cancel"
    description: "Cancel a reservation"
    roles: [Any]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "status → CANCELED"
      - "Releases whatever it was consuming"

  - method: POST
    path: "/podcasts/{podcast_id}/reservations/{reservation_id}/settle"
    description: "Settle a reservation"
    roles: [Any]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "status → SETTLED"
      - "Deal budget: committed → spent"
      - "Episode must be LIVE"
      - "Deal must be ACTIVE"

  # --- Claims ---
  - method: POST
    path: "/podcasts/{podcast_id}/claims"
    description: "File a claim against an episode"
    roles: [Any]
    code: 201
    input: [episode_id, kind]
    output: Claim
    side_effects:
      - "status=OPEN"
      - "open_claim_count increments"
      - "Episode clearance → UNDER_REVIEW"
      - "Posture may become RESTRICTED (if open_claim_count >= 2)"

  - method: POST
    path: "/podcasts/{podcast_id}/claims/{claim_id}/close"
    description: "Close a claim"
    roles: [Any]
    code: 200
    input: [outcome]
    output: Claim
    side_effects:
      - "status → CLOSED"
      - "open_claim_count decrements"
      - "If ACCEPTED: episode retracted, holds cleaned, settled → credited, podcast → RESTRICTED"
      - "If all claims closed: episode clearance → CLEAR"

# =============================================================================
# Table 7: Error Code Catalogue (16 error codes)
# =============================================================================
errors:
  # --- Request ---
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "Malformed request, missing required fields, invalid parameters"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource does not exist or belongs to a different podcast"

  # --- Concurrency ---
  - id: ERR_MISSING_IF_MATCH
    http: 400
    condition: "Mutation on existing resource missing If-Match header"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "If-Match does not match resource's current version"

  # --- Posture ---
  - id: ERR_PODCAST_RESTRICTED
    http: 400
    condition: "Podcast is RESTRICTED; publishing, approval, and deal activation blocked"

  # --- State ---
  - id: ERR_INVALID_STATE
    http: 400
    condition: "Resource not in valid state for requested transition"

  # --- Capacity ---
  - id: ERR_CAPACITY_EXCEEDED
    http: 400
    condition: "Reservation would exceed podcast or episode ad capacity (includes capacity_scope: PODCAST or EPISODE)"

  # --- Deal ---
  - id: ERR_DEAL_BUDGET_EXCEEDED
    http: 400
    condition: "Reservation would exceed deal's available budget"

  - id: ERR_DEAL_NOT_ACTIVE
    http: 400
    condition: "Deal must be ACTIVE for approval, settlement"

  # --- Brand Safety ---
  - id: ERR_BRAND_SAFETY_MISMATCH
    http: 400
    condition: "FAMILY_SAFE deal cannot be approved on MATURE episode"

  # --- Episode ---
  - id: ERR_EPISODE_UNDER_REVIEW
    http: 400
    condition: "Episode has open claims; publishing, approval, settlement blocked"

  - id: ERR_EPISODE_HAS_HOLDS
    http: 400
    condition: "Manual retraction blocked while HOLD reservations exist"

  - id: ERR_EPISODE_HAS_UNREVIEWED_RESERVATIONS
    http: 400
    condition: "Publishing blocked while NEEDS_REVIEW reservations exist on the episode"

  - id: ERR_EPISODE_HAS_OVERBOOKED_RESERVATIONS
    http: 400
    condition: "Publishing blocked while OVERBOOKED reservations exist on the episode"

  # --- Duplicates ---
  - id: ERR_DUPLICATE_RESERVATION
    http: 400
    condition: "Duplicate reservation (same deal + episode + placement)"

  - id: ERR_DUPLICATE_CLAIM
    http: 400
    condition: "Duplicate claim (same episode + kind with OPEN status)"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: Any
    description: "PodReserve uses If-Match concurrency control rather than role-based restrictions in v1. All endpoints are accessible to any authenticated caller."
    shared_operations:
      - "POST /podcasts — Create podcast"
      - "GET /podcasts/{id} — Get podcast"
      - "POST .../run_ops — Run ops"
      - "POST .../episodes — Create episode"
      - "GET .../episodes/{id} — Get episode"
      - "PUT .../episodes/{id} — Edit episode"
      - "POST .../episodes/{id}/submit — Submit episode"
      - "POST .../episodes/{id}/publish — Publish episode"
      - "POST .../episodes/{id}/retract — Retract episode"
      - "POST .../deals — Create deal"
      - "GET .../deals/{id} — Get deal"
      - "PUT .../deals/{id} — Update deal"
      - "POST .../reservations — Create reservation"
      - "POST .../reservations/{id}/approve — Approve reservation"
      - "POST .../reservations/{id}/cancel — Cancel reservation"
      - "POST .../reservations/{id}/settle — Settle reservation"
      - "POST .../claims — File claim"
      - "POST .../claims/{id}/close — Close claim"
