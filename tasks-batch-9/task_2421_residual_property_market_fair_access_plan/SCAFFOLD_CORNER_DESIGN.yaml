          - errors[ERR_FILING_NOT_REVIEWABLE]
        distinguishing_aspect: "DISAPPROVED is terminal: a second review on the same filing returns 409 ERR_FILING_NOT_REVIEWABLE and reviewed_by_user_id stays reg-1 rather than being overwritten by reg-2."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one HURRICANE zone; one filing already DISAPPROVED by reg-1."
          setup_api_calls:
