      - name: suspending_a_market_releases_its_line_and_reverts_the_layer_and_the_program
        claim_type: Cascade down
        grounds:
          - state_machines.SigningLine.transitions[PROVISIONAL->RELEASED]
          - state_machines.Layer.transitions[FULLY_PLACED->PARTIALLY_PLACED]
          - state_machines.Program.transitions[FIRM_ORDER->IN_MARKET]
          - state_machines.Quote.transitions[FIRM_ORDER->LAPSED]
          - endpoints.POST /reinsurers/{reinsurer_id}/security-status
          - entities.SigningLine.fields.release_reason
        distinguishing_aspect: |
          A security-status change to SUSPENDED is a second, non-broker entry point into the release
          cascade and it stamps a different release_reason. Alpha 60 + Bravo 40 make the layer
          FULLY_PLACED and the program FIRM_ORDER; suspending Alpha releases only Alpha's line with
          release_reason SECURITY_FAILURE, lapses only Alpha's quote, drops
          written_line_total_pct to 40.0000 so the layer reverts to PARTIALLY_PLACED and the program
          reverts to IN_MARKET, and returns Alpha's committed capacity to 0 while Bravo's is intact.
        test_recipe:
          setup:
            - "A FIRM_ORDER program whose CAT layer 1B xs 2B is FULLY_PLACED by Alpha Re 60.0000 and Bravo Re 40.0000."
            - "Each firm order re-reads Layer.version because the OCC field is mandatory and the first order bumps it."
