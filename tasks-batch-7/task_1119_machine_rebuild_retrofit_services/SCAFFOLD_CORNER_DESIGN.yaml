            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects?assessment_id=${asmt}", payload: {}, as: ProjectManager, captures: { proj: "$.data[0].id" } }
            - { call: "POST /api/projects/${proj}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/parts", payload: { part_number: "P-A-259", description: "Ball screw", oem_status: "ACTIVE", unit_cost_cents: 1250000, stock_quantity: 10, lead_time_days: 14 }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/parts", payload: { part_number: "P-B-259", description: "NC board", oem_status: "OBSOLETE", unit_cost_cents: 800000, stock_quantity: 0, lead_time_days: 60 }, as: PlatformAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pa}", quantity: 2 }, as: ProjectManager }
