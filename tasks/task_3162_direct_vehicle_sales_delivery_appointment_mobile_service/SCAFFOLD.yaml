    output: "MobileServiceVisit[]"
    side_effects: []

  # --- VehicleConfiguration ---
  - method: POST
    path: "/v1/vehicle-configurations"
    description: "Create a configurable trim"
    roles: [PlatformAdmin]
    code: 201
    input: ["model_code", "base_price_cents"]
    output: VehicleConfiguration
    side_effects: ["status = DRAFT", "configured_price_cents = base_price_cents", "option_count = 0"]

  - method: GET
    path: "/v1/vehicle-configurations"
    description: "List configurations"
    roles: [PlatformAdmin, Buyer]
    code: 200
    input: ["model_code?", "status?", "limit?", "offset?"]
    output: "VehicleConfiguration[]"
    side_effects: []

  - method: GET
    path: "/v1/vehicle-configurations/{id}"
    description: "Get a configuration"
    roles: [PlatformAdmin, Buyer, TradeInSpecialist]
    code: 200
    input: []
    output: VehicleConfiguration
    side_effects: []

  - method: POST
    path: "/v1/vehicle-configurations/{id}/options"
    description: "Add a selectable option to a configuration"
    roles: [PlatformAdmin]
    code: 201
    input: ["option_sku", "option_category", "price_cents"]
    output: ConfigurationOption
    side_effects:
      - "is_software_entitlement computed from option_category"
      - "VehicleConfiguration.option_count += 1"
      - "VehicleConfiguration.configured_price_cents recomputed when is_software_entitlement == false"
      - "status = ACTIVE"

  - method: GET
    path: "/v1/vehicle-configurations/{id}/options"
    description: "List a configuration's options"
    roles: [PlatformAdmin, Buyer, TradeInSpecialist]
    code: 200
    input: ["option_category?", "status?", "limit?", "offset?"]
    output: "ConfigurationOption[]"
    side_effects: []

  - method: GET
    path: "/v1/configuration-options"
    description: "List configuration options across configurations"
    roles: [PlatformAdmin, Buyer, TradeInSpecialist]
    code: 200
    input: ["configuration_id?", "option_category?", "is_software_entitlement?", "status?", "limit?", "offset?"]
    output: "ConfigurationOption[]"
    side_effects: []

  - method: GET
    path: "/v1/configuration-options/{id}"
    description: "Get a configuration option"
    roles: [PlatformAdmin, Buyer, TradeInSpecialist]
    code: 200
    input: []
    output: ConfigurationOption
    side_effects: []

  - method: POST
    path: "/v1/configuration-options/{id}/retire"
    description: "Retire an option so it can no longer be added to an order"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ConfigurationOption
    side_effects: ["status = RETIRED", "increments ConfigurationOption.version by 1"]

  # --- VehicleOrder ---
  - method: POST
    path: "/v1/orders"
    description: "Open a vehicle order"
    roles: [Buyer, PlatformAdmin]
    code: 201
    input: ["buyer_id", "configuration_id", "jurisdiction_id", "delivery_center_id", "order_fee_cents?"]
    output: VehicleOrder
    side_effects: ["status = DRAFT", "delivery_readiness_posture = FROZEN", "estimate_shift_days_cumulative = 0", "order_fee_paid_cents = 0", "order_total_due_cents computed provisionally"]

  - method: GET
    path: "/v1/orders"
    description: "List orders"
    roles: [Buyer, PlatformAdmin, DeliveryAdvisor, FinancePartner, TradeInSpecialist]
    code: 200
    input: ["buyer_id?", "configuration_id?", "jurisdiction_id?", "delivery_center_id?", "status?", "delivery_readiness_posture?", "limit?", "offset?"]
    output: "VehicleOrder[]"
    side_effects: []

  - method: GET
    path: "/v1/orders/{id}"
    description: "Get an order"
    roles: [Buyer, PlatformAdmin, DeliveryAdvisor, FinancePartner, TradeInSpecialist, ServiceTechnician]
    code: 200
    input: []
    output: VehicleOrder
    side_effects: []

  - method: POST
    path: "/v1/orders/{id}/configuration-changes"
    description: "Add or remove configuration options while the lock window is open"
    roles: [Buyer]
    code: 200
    input: ["add_option_ids", "remove_option_ids", "expected_order_version"]
    output: VehicleOrder
    note: "the only guard on this write path is the OCC version check; there is no non-OCC validation that could mask ERR_STALE_VERSION"
    side_effects:
      - "configuration option set updated"
      - "order_total_due_cents recomputed provisionally"
      - "increments VehicleOrder.version by 1"

  - method: POST
    path: "/v1/orders/{id}/place"
    description: "Place the order without dealer negotiation"
    roles: [Buyer]
    code: 200
    input: ["expected_order_version"]
    output: VehicleOrder
    side_effects:
      - "status = PLACED, placed_at = now_utc"
      - "configuration_lock_deadline = placed_at + 14 days"
      - "first DeliveryEstimate created PROVISIONAL / UNNOTIFIED"
      - "order_total_due_cents recomputed provisionally"
      - "increments VehicleOrder.version by 1"

  - method: POST
    path: "/v1/orders/{id}/lock-configuration"
    description: "Lock the configuration before the deadline"
    roles: [Buyer, PlatformAdmin]
    code: 200
    input: ["expected_order_version"]
    output: VehicleOrder
    side_effects:
      - "status = CONFIG_LOCKED"
      - "any UNNOTIFIED estimate on this order moves to NOTIFIED"
      - "increments VehicleOrder.version by 1"

  - method: POST
    path: "/v1/orders/{id}/cancel"
    description: "Cancel the order and unwind its side effects"
    roles: [Buyer, PlatformAdmin]
    code: 200
    input: []
    output: VehicleOrder
    side_effects:
      - "status = CANCELLED; delivery_readiness_posture = FROZEN"
      - "PROVISIONAL and FIRM estimates → SUPERSEDED"
      - "VISIBLE trade-in appraisals → REJECTED with compensating reversals"
      - "non-terminal financing applications → DECLINED"
      - "compensating OrderFeeLedgerEntry ORDER_FEE_REFUND with amount_cents = -20000, leaving Buyer.order_credit_balance_cents at the 5000-cent retained cancellation fee; Buyer.order_credit_balance_cents recomputed"
      - "increments VehicleOrder.version by 1"

  - method: POST
    path: "/v1/orders/{id}/allocation"
    description: "Match an unassigned production unit to the order"
    roles: [PlatformAdmin]
    code: 200
    input: ["batch_id", "expected_order_version"]
    output: VehicleOrder
    side_effects:
      - "AllocationUnit matched: the UNASSIGNED unit of that batch with the smallest created_at ASC, ties broken by vin ASC"
      - "matched unit status → ALLOCATED; ProductionBatch.allocated_unit_count += 1"
      - "status = ALLOCATED"
      - "a FIRM DeliveryEstimate is projected from the unit's transport_eta with prior_estimate_id set to the current estimate"
      - "estimate_shift_days_cumulative updated by the new estimate's shift_days"
      - "order_total_due_cents recomputed provisionally"
      - "increments VehicleOrder.version by 1"

  - method: POST
    path: "/v1/orders/{id}/dispatch-to-transport"
    description: "Hand the allocated unit to transport"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: VehicleOrder
    side_effects: ["status = IN_TRANSIT", "AllocationUnit.status → IN_TRANSIT", "delivery_readiness_posture recomputed", "increments VehicleOrder.version by 1"]

  - method: POST
    path: "/v1/orders/{id}/arrive-at-center"
    description: "Record arrival at the handover site after franchise-law screening"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: VehicleOrder
    side_effects:
      - "status = AT_DELIVERY_CENTER"
      - "AllocationUnit.status → ARRIVED"
      - "a Vehicle row is created for the order with vin inherited from the allocation unit, odometer_miles 0, software_version = baseline, service_hold_state NONE, status IN_SERVICE"
      - "DeliveryCenter.booked_slot_count recomputed"
      - "delivery_readiness_posture recomputed"
      - "increments VehicleOrder.version by 1"

  - method: POST
    path: "/v1/orders/{id}/delivery-estimates"
    description: "Project a fresh delivery window for the order"
    roles: [PlatformAdmin]
    code: 201
    input: ["basis_iso8601", "window_days"]
    output: DeliveryEstimate
    side_effects:
      - "the order's current PROVISIONAL or FIRM estimate → SUPERSEDED"
      - "new estimate created with prior_estimate_id set; shift_days computed by calculations.delivery_estimate_window"
      - "VehicleOrder.estimate_shift_days_cumulative updated"

  - method: GET
    path: "/v1/orders/{id}/delivery-estimates"
    description: "List the order's delivery estimates"
    roles: [Buyer, PlatformAdmin, DeliveryAdvisor]
    code: 200
    input: ["estimate_state?", "limit?", "offset?"]
    output: "DeliveryEstimate[]"
    side_effects: []

  - method: GET
    path: "/v1/orders/{id}/trade-in-appraisals"
    description: "List the order's trade-in appraisals"
    roles: [Buyer, PlatformAdmin, TradeInSpecialist, FinancePartner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TradeInAppraisal[]"
    side_effects: []

  - method: GET
    path: "/v1/orders/{id}/financing-applications"
    description: "List the order's financing applications"
    roles: [Buyer, PlatformAdmin, FinancePartner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "FinancingApplication[]"
    side_effects: []

  - method: GET
    path: "/v1/orders/{id}/fee-ledger-entries"
    description: "List the order's fee ledger entries"
    roles: [Buyer, PlatformAdmin, FinancePartner]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: "OrderFeeLedgerEntry[]"
    side_effects: []

  - method: POST
    path: "/v1/orders/{id}/fee-ledger-entries"
    description: "Post a manual finance adjustment to the order ledger"
    roles: [PlatformAdmin]
    code: 201
    input: ["entry_type", "amount_cents", "reason_code"]
    output: OrderFeeLedgerEntry
    side_effects: ["Buyer.order_credit_balance_cents recomputed", "VehicleOrder.order_fee_paid_cents recomputed"]

  - method: GET
    path: "/v1/orders/{id}/allocation-units"
    description: "List the production units matched or reserved for the order"
    roles: [PlatformAdmin, DeliveryAdvisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AllocationUnit[]"
    side_effects: []

  - method: GET
    path: "/v1/orders/{id}/delivery-appointments"
    description: "List the order's handover appointments"
    roles: [Buyer, PlatformAdmin, DeliveryAdvisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DeliveryAppointment[]"
    side_effects: []

  - method: GET
    path: "/v1/orders/{id}/vehicles"
    description: "List vehicles produced by the order"
    roles: [Buyer, PlatformAdmin, ServiceTechnician, DeliveryAdvisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []

  # --- DeliveryAppointment ---
  - method: POST
    path: "/v1/delivery-appointments"
    description: "Book a handover at a center or by home delivery"
    roles: [DeliveryAdvisor]
    code: 201
    input: ["order_id", "delivery_center_id", "delivery_mode", "scheduled_start", "scheduled_end", "buyer_service_address_miles?", "expected_order_version"]
    output: DeliveryAppointment
    side_effects:
      - "DeliveryCenter.booked_slot_count += 1 for CENTER mode"
      - "VehicleOrder.status → DELIVERY_SCHEDULED"
      - "FIRM estimates on the order → CONSUMED"
      - "buffer_minutes captured from the jurisdiction"
      - "increments VehicleOrder.version by 1"

  - method: GET
    path: "/v1/delivery-appointments"
    description: "List handover appointments"
    roles: [DeliveryAdvisor, PlatformAdmin, Buyer]
    code: 200
    input: ["delivery_center_id?", "order_id?", "status?", "limit?", "offset?"]
    output: "DeliveryAppointment[]"
    side_effects: []

  - method: GET
    path: "/v1/delivery-appointments/{id}"
    description: "Get a handover appointment"
    roles: [DeliveryAdvisor, PlatformAdmin, Buyer]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: []

  - method: POST
    path: "/v1/delivery-appointments/{id}/confirm"
    description: "Confirm the handover slot"
    roles: [DeliveryAdvisor]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: ["status = CONFIRMED", "consumed estimate notification_state → ACKNOWLEDGED"]

  - method: POST
    path: "/v1/delivery-appointments/{id}/rebook"
    description: "Move an at-risk appointment to a new window"
    roles: [DeliveryAdvisor]
    code: 200
    input: ["scheduled_start", "scheduled_end", "expected_order_version"]
    output: DeliveryAppointment
    side_effects:
      - "status = CONFIRMED"
      - "DeliveryCenter.booked_slot_count += 1"
      - "VehicleOrder.status → DELIVERY_SCHEDULED"
      - "increments VehicleOrder.version by 1"

  - method: POST
    path: "/v1/delivery-appointments/{id}/cancel"
    description: "Cancel a handover appointment and release its slot"
    roles: [DeliveryAdvisor]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects:
      - "status = CANCELLED"
      - "DeliveryCenter.booked_slot_count −= 1"
      - "VehicleOrder.status → AT_DELIVERY_CENTER"
      - "increments VehicleOrder.version by 1"

  - method: POST
    path: "/v1/delivery-appointments/{id}/complete"
    description: "Run the acceptance inspection and hand the vehicle over"
    roles: [DeliveryAdvisor]
    code: 200
    input: ["acceptance_inspection_result", "documented_issues", "expected_order_version"]
    output: VehicleOrder
    side_effects:
      - "Vehicle row exists with vin, delivered_at := now_utc, software_version := latest SoftwareEntitlement version string, status IN_SERVICE"
      - "AllocationUnit.status → RELEASED"
      - "DeliveryAppointment.status → COMPLETED; issue_notes and documented_issue_count set"
      - "DeliveryCenter.booked_slot_count recomputed"
      - "order_total_due_cents recomputed with the final variant"
      - "OrderFeeLedgerEntry DELIVERY_FEE_CHARGE of -2500 written unconditionally, plus OrderFeeLedgerEntry TRADE_IN_CREDIT of +net_credit_cents for each accepted appraisal"
      - "Buyer.order_credit_balance_cents recomputed"
      - "VehicleOrder.status → DELIVERED"
      - "increments VehicleOrder.version by 1"

  # --- TradeInAppraisal ---
  - method: POST
    path: "/v1/orders/{id}/trade-in-appraisals"
    description: "Open a trade-in appraisal against the order"
    roles: [Buyer, TradeInSpecialist]
    code: 201
    input: ["trade_vin", "mileage", "gross_offer_cents", "reconditioning_estimate_cents?", "offer_valid_until"]
    output: TradeInAppraisal
    side_effects: ["status = DRAFT", "net_credit_cents computed"]

  - method: GET
    path: "/v1/trade-in-appraisals"
    description: "List trade-in appraisals"
    roles: [TradeInSpecialist, PlatformAdmin, FinancePartner, Buyer]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: "TradeInAppraisal[]"
    side_effects: []

  - method: GET
    path: "/v1/trade-in-appraisals/{id}"
    description: "Get a trade-in appraisal"
    roles: [TradeInSpecialist, PlatformAdmin, FinancePartner, Buyer]
    code: 200
    input: []
    output: TradeInAppraisal
    side_effects: []

  - method: POST
    path: "/v1/orders/{id}/trade-in-appraisals/{id}/appraise"
    description: "Record the desktop appraisal result"
    roles: [TradeInSpecialist]
    code: 200
    input: []
    output: TradeInAppraisal
    side_effects: ["status = APPRAISED", "net_credit_cents recomputed"]

  - method: POST
    path: "/v1/orders/{id}/trade-in-appraisals/{id}/offer"
    description: "Publish the offer and credit the buyer ledger"
    roles: [TradeInSpecialist]
    code: 200
    input: []
    output: TradeInAppraisal
    side_effects:
      - "status = OFFERED"
      - "OrderFeeLedgerEntry TRADE_IN_CREDIT for +net_credit_cents"
      - "Buyer.order_credit_balance_cents recomputed"

  - method: POST
    path: "/v1/orders/{id}/trade-in-appraisals/{id}/accept"
    description: "Buyer accepts the trade-in offer"
    roles: [Buyer]
    code: 200
    input: []
    output: TradeInAppraisal
    side_effects: ["status = ACCEPTED", "linked financing application recomputes amount_financed_cents and monthly_payment_cents"]

  - method: POST
    path: "/v1/orders/{id}/trade-in-appraisals/{id}/reject"
    description: "Buyer rejects the trade-in offer"
    roles: [Buyer]
    code: 200
    input: []
    output: TradeInAppraisal
    side_effects:
      - "status = REJECTED"
      - "OrderFeeLedgerEntry TRADE_IN_CREDIT_REVERSAL for −net_credit_cents"
      - "Buyer.order_credit_balance_cents recomputed"

  - method: POST
    path: "/v1/orders/{id}/trade-in-appraisals/{id}/reappraise"
    description: "Re-appraise an expired offer with a fresh validity date"
    roles: [TradeInSpecialist]
    code: 200
    input: ["gross_offer_cents", "reconditioning_estimate_cents?", "offer_valid_until"]
    output: TradeInAppraisal
    side_effects:
      - "status = REAPPRAISED"
      - "OrderFeeLedgerEntry TRADE_IN_CREDIT for +net_credit_cents written"
      - "Buyer.order_credit_balance_cents recomputed"

  # --- FinancingApplication ---
  - method: POST
    path: "/v1/orders/{id}/financing-applications"
    description: "Submit a financing application against the order"
    roles: [Buyer]
    code: 201
    input: ["term_months", "down_payment_cents?", "include_trade_in_credit?"]
    output: FinancingApplication
    side_effects: ["status = SUBMITTED", "amount_financed_cents and monthly_payment_cents computed"]

  - method: GET
    path: "/v1/financing-applications"
    description: "List financing applications"
    roles: [FinancePartner, PlatformAdmin, Buyer]
    code: 200
    input: ["order_id?", "buyer_id?", "status?", "limit?", "offset?"]
    output: "FinancingApplication[]"
    side_effects: []

  - method: GET
    path: "/v1/financing-applications/{id}"
    description: "Get a financing application"
    roles: [FinancePartner, PlatformAdmin, Buyer]
    code: 200
    input: []
    output: FinancingApplication
    side_effects: []

  - method: POST
    path: "/v1/financing-applications/{id}/decision"
    description: "Record the lending decision"
    roles: [FinancePartner]
    code: 200
    input: ["outcome"]
    output: FinancingApplication
    side_effects:
      - "outcome APPROVED → status = CONDITIONALLY_APPROVED with apr_bps, credit_band and monthly_payment_cents computed"
      - "outcome DECLINED → status = DECLINED and Buyer.credit_band = SUBPRIME"
      - "band selection is pinned: the applicant's existing credit_band is retained when it is PRIME or SUBPRIME; otherwise the band defaults to NEAR_PRIME"
      - "Buyer.credit_band updated to the decided band"

  - method: POST
    path: "/v1/financing-applications/{id}/contract-review"
    description: "Move an approved application into contract preparation"
    roles: [FinancePartner]
    code: 200
    input: ["expected_application_version"]
    output: FinancingApplication
    side_effects: ["status = CONTRACT_PENDING", "amount_financed_cents recomputed with the accepted trade-in credit applied", "increments FinancingApplication.version by 1"]

  - method: POST
    path: "/v1/financing-applications/{id}/fund"
    description: "Fund the loan once the order is ready"
    roles: [FinancePartner]
    code: 200
    input: ["expected_application_version"]
    output: FinancingApplication
    side_effects: ["status = FUNDED", "VehicleOrder.order_total_due_cents recomputed provisionally with the funded amount applied", "increments FinancingApplication.version by 1"]

  # --- ProductionBatch ---
  - method: POST
    path: "/v1/delivery-centers/{id}/suspend"
    description: "Suspend a site so it no longer accepts new bookings"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DeliveryCenter
    side_effects: ["status = SUSPENDED", "increments DeliveryCenter.version by 1"]

  - method: POST
    path: "/v1/delivery-centers/{id}/reinstate"
    description: "Return a suspended site to service"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DeliveryCenter
    side_effects: ["status = ACTIVE", "increments DeliveryCenter.version by 1"]

  - method: POST
    path: "/v1/production-batches"
    description: "Schedule a production batch"
    roles: [PlatformAdmin]
    code: 201
    input: ["factory_code", "model_code", "unit_capacity", "planned_completion_at"]
    output: ProductionBatch
    side_effects: ["status = SCHEDULED", "allocated_unit_count = 0", "delay_days = 0"]

  - method: GET
    path: "/v1/production-batches"
    description: "List production batches"
    roles: [PlatformAdmin]
    code: 200
    input: ["model_code?", "status?", "limit?", "offset?"]
    output: "ProductionBatch[]"
    side_effects: []

  - method: GET
    path: "/v1/production-batches/{id}"
    description: "Get a production batch"
    roles: [PlatformAdmin, DeliveryAdvisor]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: []

  - method: POST
    path: "/v1/production-batches/{id}/start"
    description: "Start production"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: ["status = IN_PRODUCTION"]

  - method: POST
    path: "/v1/production-batches/{id}/delay"
    description: "Record a production slip and propagate it to every affected order"
    roles: [PlatformAdmin]
    code: 200
    input: ["delay_days"]
    output: ProductionBatch
    side_effects:
      - "status = DELAYED; delay_days += supplied value; planned_completion_at += the same days"
      - "on every order holding an ALLOCATED, IN_TRANSIT or ARRIVED unit of this batch: the current PROVISIONAL or FIRM estimate → SUPERSEDED and a fresh PROVISIONAL estimate is created with window_start = prior.window_start + delay_days"
      - "each affected order's estimate_shift_days_cumulative incremented by the new estimate's shift_days"
      - "CONFIRMED handover appointments whose shifted window end passes their scheduled_start move to AT_RISK"
      - "each appointment that became AT_RISK returns its order to AT_DELIVERY_CENTER"

  - method: POST
    path: "/v1/production-batches/{id}/resume"
    description: "Return a delayed batch to production"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: ["status = IN_PRODUCTION"]

  - method: POST
    path: "/v1/production-batches/{id}/complete"
    description: "Close out a production batch"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProductionBatch
    side_effects: ["status = COMPLETED"]

  - method: POST
    path: "/v1/production-batches/{id}/allocation-units"
    description: "Mint a production unit row belonging to a batch"
    roles: [PlatformAdmin]
    code: 201
    input: ["vin"]
    output: AllocationUnit
    side_effects: ["status = UNASSIGNED", "order_id = null", "unallocated_unit_count recomputed"]

  - method: GET
    path: "/v1/production-batches/{id}/allocation-units"
    description: "List a batch's production units"
    roles: [PlatformAdmin, DeliveryAdvisor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AllocationUnit[]"
    side_effects: []

  - method: GET
    path: "/v1/allocation-units/{id}"
    description: "Get a production unit"
    roles: [PlatformAdmin, DeliveryAdvisor]
    code: 200
    input: []
    output: AllocationUnit
    side_effects: []

  # --- DeliveryEstimate ---
  - method: GET
    path: "/v1/delivery-estimates"
    description: "List delivery estimates"
    roles: [Buyer, PlatformAdmin, DeliveryAdvisor]
    code: 200
    input: ["order_id?", "prior_estimate_id?", "estimate_state?", "notification_state?", "limit?", "offset?"]
    output: "DeliveryEstimate[]"
    side_effects: []

  - method: GET
    path: "/v1/delivery-estimates/{id}"
    description: "Get a delivery estimate"
    roles: [Buyer, PlatformAdmin, DeliveryAdvisor]
    code: 200
    input: []
    output: DeliveryEstimate
    side_effects: []

  - method: POST
    path: "/v1/delivery-estimates/{id}/restore"
    description: "Restore a superseded estimate as the order's live window"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DeliveryEstimate
    side_effects:
      - "estimate_state = FIRM"
      - "every other PROVISIONAL or FIRM estimate of the same order → SUPERSEDED"
      - "VehicleOrder.estimate_shift_days_cumulative −= this estimate's shift_days"

  # --- RemoteDiagnosticReport ---
  - method: POST
    path: "/v1/vehicles/{id}/diagnostic-reports"
    description: "Pull a remote diagnostic report and let triage decide the repair channel"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 201
    input: ["fault_code", "severity", "is_driveable"]
    output: RemoteDiagnosticReport
    side_effects:
      - "triage_outcome computed; parts_required derived from the outcome"
      - "reported_at = now_utc"

  - method: GET
    path: "/v1/diagnostic-reports"
    description: "List diagnostic reports"
    roles: [ServiceTechnician, PlatformAdmin, PartsCoordinator]
    code: 200
    input: ["vehicle_id?", "triage_outcome?", "severity?", "limit?", "offset?"]
    output: "RemoteDiagnosticReport[]"
    side_effects: []

  - method: GET
    path: "/v1/diagnostic-reports/{id}"
    description: "Get a diagnostic report"
    roles: [ServiceTechnician, PlatformAdmin, PartsCoordinator]
    code: 200
    input: []
    output: RemoteDiagnosticReport
    side_effects: []

  # --- Vehicle ---
  - method: GET
    path: "/v1/vehicles"
    description: "List vehicles"
    roles: [ServiceTechnician, PlatformAdmin, Buyer, PartsCoordinator]
    code: 200
    input: ["order_id?", "status?", "service_hold_state?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []

  - method: GET
    path: "/v1/vehicles/{id}"
    description: "Get a vehicle"
    roles: [ServiceTechnician, PlatformAdmin, Buyer, PartsCoordinator]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/v1/vehicles/{id}/diagnostic-reports"
    description: "List a vehicle's diagnostic reports"
    roles: [ServiceTechnician, PlatformAdmin, Buyer]
    code: 200
    input: ["triage_outcome?", "limit?", "offset?"]
    output: "RemoteDiagnosticReport[]"
    side_effects: []

  - method: GET
    path: "/v1/vehicles/{id}/service-appointments"
    description: "List a vehicle's service appointments"
    roles: [ServiceTechnician, PlatformAdmin, Buyer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ServiceAppointment[]"
    side_effects: []

  - method: GET
    path: "/v1/vehicles/{id}/mobile-service-visits"
    description: "List a vehicle's mobile service visits"
    roles: [ServiceTechnician, PlatformAdmin, PartsCoordinator, Buyer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MobileServiceVisit[]"
    side_effects: []

  - method: GET
    path: "/v1/vehicles/{id}/software-entitlements"
    description: "List a vehicle's software entitlements"
    roles: [ServiceTechnician, PlatformAdmin, Buyer]
    code: 200
    input: ["status?", "entitlement_source?", "limit?", "offset?"]
    output: "SoftwareEntitlement[]"
    side_effects: []

  # --- ServiceAppointment ---
  - method: POST
    path: "/v1/service-appointments"
    description: "Open a service appointment from a triage report"
    roles: [ServiceTechnician]
    code: 201
    input: ["vehicle_id", "diagnostic_report_id", "service_center_id", "scheduled_start", "scheduled_end"]
    output: ServiceAppointment
    side_effects:
      - "status = TRIAGED"
      - "is_warranty_covered computed"
      - "Vehicle.service_hold_state → PARTS_HOLD when the report requires parts"

  - method: GET
    path: "/v1/service-appointments"
    description: "List service appointments"
    roles: [ServiceTechnician, PlatformAdmin, PartsCoordinator, Buyer]
    code: 200
    input: ["vehicle_id?", "service_center_id?", "diagnostic_report_id?", "status?", "limit?", "offset?"]
    output: "ServiceAppointment[]"
    side_effects: []

  - method: GET
    path: "/v1/service-appointments/{id}"
    description: "Get a service appointment"
    roles: [ServiceTechnician, PlatformAdmin, PartsCoordinator, Buyer]
    code: 200
    input: []
    output: ServiceAppointment
    side_effects: []

  - method: POST
    path: "/v1/service-appointments/{id}/schedule-center"
    description: "Schedule a triaged appointment into a service bay"
    roles: [ServiceTechnician]
    code: 200
    input: ["scheduled_start", "scheduled_end"]
    output: ServiceAppointment
    side_effects:
      - "status = CENTER_SCHEDULED"
      - "DeliveryCenter.booked_slot_count += 1"

  - method: POST
    path: "/v1/service-appointments/{id}/cancel"
    description: "Cancel a service appointment and release its bay"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: []
    output: ServiceAppointment
    side_effects:
      - "status = CANCELLED"
      - "DeliveryCenter.booked_slot_count −= 1 when the appointment held a bay"
      - "Vehicle.service_hold_state → NONE"
      - "increments ServiceAppointment.version by 1"

  - method: POST
    path: "/v1/vehicles/{id}/retire"
    description: "Retire a vehicle from service"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects:
      - "status = RETIRED"
      - "every non-purchase ACTIVE software entitlement on the vehicle → REVOKED"
      - "increments Vehicle.version by 1"

  # --- MobileServiceVisit ---
  - method: POST
    path: "/v1/mobile-service-visits"
    description: "Dispatch a mobile service van to repair at the customer location"
    roles: [ServiceTechnician]
    code: 201
    input: ["service_appointment_id", "parts_hub_id", "van_code", "visit_start", "visit_end", "labor_hours", "parts_cost_cents", "visit_miles", "expected_service_appointment_version"]
    output: MobileServiceVisit
    side_effects:
      - "status = DRAFT"
      - "ServiceAppointment.status → MOBILE_DISPATCHED"
      - "visit_cost_cents and the warranty customer payable computed"
      - "Vehicle.service_hold_state → AWAITING_PARTS_SHIPMENT when is_warranty_covered == false"
      - "increments ServiceAppointment.version by 1"

  - method: GET
    path: "/v1/mobile-service-visits"
    description: "List mobile service visits"
    roles: [ServiceTechnician, PlatformAdmin, PartsCoordinator, Buyer]
    code: 200
    input: ["vehicle_id?", "service_appointment_id?", "status?", "limit?", "offset?"]
    output: "MobileServiceVisit[]"
    side_effects: []

  - method: GET
    path: "/v1/mobile-service-visits/{id}"
    description: "Get a mobile service visit"
    roles: [ServiceTechnician, PlatformAdmin, PartsCoordinator, Buyer]
    code: 200
    input: []
    output: MobileServiceVisit
    side_effects: []

  - method: POST
    path: "/v1/mobile-service-visits/{id}/confirm-parts-shipment"
    description: "Parts hub confirms the pre-shipped parts left the depot"
    roles: [PartsCoordinator]
    code: 200
    input: []
    output: MobileServiceVisit
    side_effects: ["status = PARTS_SHIPPED", "parts_pre_shipped_at = now_utc"]
    note: "valid from DRAFT when no parts are required, and from PARTS_RESERVED otherwise"

  - method: POST
    path: "/v1/mobile-service-visits/{id}/reserve-parts"
    description: "Reserve the parts the repair needs before dispatch; requires the triage report to have flagged parts"
    roles: [PartsCoordinator]
    code: 200
    input: []
    output: MobileServiceVisit
    side_effects: ["status = PARTS_RESERVED", "parts_cost_cents frozen for the life of the visit"]
    note: "distinct from POST /v1/mobile-service-visits/{id}/confirm-parts-shipment: this endpoint freezes the parts list and cost, that one stamps parts_pre_shipped_at"

  - method: POST
    path: "/v1/mobile-service-visits/{id}/cancel"
    description: "Cancel a mobile visit and return the appointment to triage"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: []
    output: MobileServiceVisit
    side_effects:
      - "status = CANCELLED"
      - "linked ServiceAppointment returns to TRIAGED"
      - "Vehicle.service_hold_state → NONE"
      - "increments MobileServiceVisit.version by 1"

  - method: POST
    path: "/v1/mobile-service-visits/{id}/start"
    description: "Van goes en route to the customer location"
    roles: [ServiceTechnician]
    code: 200
    input: []
    output: MobileServiceVisit
    side_effects: ["status = EN_ROUTE"]

  - method: POST
    path: "/v1/mobile-service-visits/{id}/complete"
    description: "Complete the repair performed at the customer location"
    roles: [ServiceTechnician]
    code: 200
    input: []
    output: MobileServiceVisit
    side_effects:
      - "status = COMPLETED"
      - "ServiceAppointment.status → COMPLETED"
      - "Vehicle.service_hold_state → NONE"
      - "DeliveryCenter.booked_slot_count recomputed"

  - method: POST
    path: "/v1/mobile-service-visits/{id}/reschedule"
    description: "Move a mobile visit to a different window"
    roles: [ServiceTechnician]
    code: 200
    input: ["visit_start", "visit_end"]
    output: MobileServiceVisit
    side_effects: ["status = RESCHEDULED when the visit had not started", "van window re-validated"]

  # --- SoftwareEntitlement ---
  - method: POST
    path: "/v1/vehicles/{id}/software-entitlements"
    description: "Grant or purchase one or more over-the-air feature entitlements as a single bundle"
    roles: [PlatformAdmin, Buyer]
    code: 201
    input: ["feature_entries", "entitlement_source", "trial_days?"]
    output: "SoftwareEntitlement[]"
    side_effects:
      - "one SoftwareEntitlement row per entry, in request order; status = ACTIVE; effective_at = now_utc"
      - "expires_at = effective_at + trial_days days for TRIAL rows, null otherwise"
      - "bundle_discount_bps, bundle_net_cents and per-row payable_cents computed by calculations.entitlement_bundle_price_cents"
      - "when entitlement_source == PURCHASE an OrderFeeLedgerEntry DELIVERY_FEE_WAIVER is written for +bundle_net_cents against the vehicle's originating order"

  - method: GET
    path: "/v1/software-entitlements"
    description: "List software entitlements across vehicles"
    roles: [PlatformAdmin, ServiceTechnician, Buyer, FinancePartner]
    code: 200
    input: ["vehicle_id?", "status?", "entitlement_source?", "limit?", "offset?"]
    output: "SoftwareEntitlement[]"
    side_effects: []

  - method: GET
    path: "/v1/software-entitlements/{id}"
    description: "Get a software entitlement"
    roles: [PlatformAdmin, Buyer, ServiceTechnician]
    code: 200
    input: []
    output: SoftwareEntitlement
    side_effects: []

  - method: POST
    path: "/v1/vehicles/{id}/software-entitlements/{id}/revoke"
    description: "Revoke a purchased entitlement and refund it"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: SoftwareEntitlement
    side_effects:
      - "status = REVOKED"
      - "OrderFeeLedgerEntry DELIVERY_FEE_WAIVER for +price_cents written"
      - "Buyer.order_credit_balance_cents recomputed"

  # --- VehicleIssueNote ---
  - method: GET
    path: "/v1/vehicles/{id}/issue-notes"
    description: "List the acceptance-inspection issue notes recorded against a vehicle"
    roles: [ServiceTechnician, PlatformAdmin, DeliveryAdvisor, Buyer]
    code: 200
    input: ["status?", "blocked_handover?", "limit?", "offset?"]
    output: "VehicleIssueNote[]"
    side_effects: []

  - method: GET
    path: "/v1/issue-notes"
    description: "List acceptance-inspection issue notes"
    roles: [ServiceTechnician, PlatformAdmin, DeliveryAdvisor, Buyer]
    code: 200
    input: ["order_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: "VehicleIssueNote[]"
    side_effects: []

  - method: GET
    path: "/v1/issue-notes/{id}"
    description: "Get an acceptance-inspection issue note"
    roles: [ServiceTechnician, PlatformAdmin, DeliveryAdvisor, Buyer]
    code: 200
    input: []
    output: VehicleIssueNote
    side_effects: []

  - method: POST
    path: "/v1/issue-notes/{id}/resolve"
    description: "Remedy a documented issue so it no longer blocks handover"
    roles: [ServiceTechnician, DeliveryAdvisor]
    code: 200
    input: []
    output: VehicleIssueNote
    side_effects:
      - "status = RESOLVED"
      - "the linked order's delivery_readiness_posture recomputed"
      - "increments VehicleIssueNote.version by 1"

  - method: POST
    path: "/v1/issue-notes/{id}/waive"
    description: "Waive a documented issue under the buyer's written acknowledgement"
    roles: [PlatformAdmin]
    code: 200
    input: ["waiver_reason"]
    output: VehicleIssueNote
    side_effects:
      - "status = WAIVED"
      - "the linked order's delivery_readiness_posture recomputed"
      - "increments VehicleIssueNote.version by 1"

  # --- Fee ledger (filtered list) ---
  - method: GET
    path: "/v1/fee-ledger-entries"
    description: "List fee ledger entries across orders"
    roles: [PlatformAdmin, FinancePartner, Buyer]
    code: 200
    input: ["buyer_id?", "order_id?", "entry_type?", "limit?", "offset?"]
    output: "OrderFeeLedgerEntry[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Authentication & authorization ---
  - id: ERR_INVALID_USER_CONTEXT
    http: 400
    condition: "X-User-Role header is missing, or carries a value that is not one of the eight declared roles"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The role in X-User-Role is not permitted to perform the operation"

  - id: ERR_BUYER_SUSPENDED
    http: 403
    condition: "The acting Buyer account has status SUSPENDED"

  - id: ERR_JURISDICTION_NOT_ENACTED
    http: 409
    condition: "The governing StateJurisdiction is not in status ENACTED, so no order may be placed against it"

  # --- Input validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Request body is malformed, a required field is absent, or a supplied value has the wrong type"
    http: 400
    condition: "Request body is malformed, a required field is absent, or a supplied value has the wrong type"

  - id: ERR_INVALID_DELAY_DAYS
    http: 400
    condition: "A production batch delay was requested with delay_days below 1"

  - id: ERR_INVALID_APPOINTMENT_WINDOW
    http: 400
    condition: "scheduled_end is not strictly after scheduled_start, or visit_end is not strictly after visit_start"

  - id: ERR_ENTITLEMENT_VERSION_NOT_NEWER
    http: 400
    condition: "A software entitlement re-grant supplied a basis version that is not newer than the vehicle's installed version"

  # --- Concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The supplied expected_*_version does not equal the parent entity's current version"

  # --- Not found ---
  - id: ERR_BUYER_NOT_FOUND
    http: 404
    condition: "No Buyer exists with the requested id"

  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "No VehicleOrder exists with the requested id"

  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "No DeliveryAppointment exists with the requested id"

  - id: ERR_APPRAISAL_NOT_FOUND
    http: 404
    condition: "No TradeInAppraisal exists with the requested id"

  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "No FinancingApplication exists with the requested id"

  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "No ProductionBatch exists with the requested id"

  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "No AllocationUnit exists with the requested id"

  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "No Vehicle exists with the requested id"

  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "No MobileServiceVisit exists with the requested id"

  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "No RemoteDiagnosticReport exists with the requested id"

  - id: ERR_ENTITLEMENT_NOT_FOUND
    http: 404
    condition: "No SoftwareEntitlement exists with the requested id"

  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "No StateJurisdiction exists with the requested id"

  - id: ERR_CENTER_NOT_FOUND
    http: 404
    condition: "No DeliveryCenter exists with the requested id"

  - id: ERR_CONFIGURATION_NOT_FOUND
    http: 404
    condition: "No VehicleConfiguration exists with the requested id"

  - id: ERR_OPTION_NOT_FOUND
    http: 404
    condition: "No ConfigurationOption exists with the requested id"

  - id: ERR_ESTIMATE_NOT_FOUND
    http: 404
    condition: "No DeliveryEstimate exists with the requested id"

  - id: ERR_NOTE_NOT_FOUND
    http: 404
    condition: "No VehicleIssueNote exists with the requested id"

  # --- State ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in the state the requested transition requires (covers order, appointment, estimate, appraisal, application, batch, vehicle, visit, entitlement and center state guards)"

  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target resource is already in a terminal state and can no longer transition"
  - id: ERR_ORDER_NOT_OWNED
    http: 403
    condition: "The acting Buyer does not own the target order"
  - id: ERR_BUYER_NOT_ACTIVE
    http: 403
    condition: "The acting Buyer account is not in status ACTIVE"
  - id: ERR_ORDER_NOT_CONFIG_LOCKED
    http: 409
    condition: "Allocation requires the order to be in CONFIG_LOCKED"
  - id: ERR_ORDER_NOT_ALLOCATED
    http: 409
    condition: "Dispatch to transport requires the order to be in ALLOCATED"
  - id: ERR_ORDER_NOT_IN_TRANSIT
    http: 409
    condition: "Arrival at a center requires the order to be in IN_TRANSIT"
  - id: ERR_ORDER_NOT_AT_CENTER
    http: 409
    condition: "Booking a handover requires the order to be in AT_DELIVERY_CENTER"
  - id: ERR_ORDER_NOT_DELIVERY_SCHEDULED
    http: 409
    condition: "Completion requires the linked order to be in DELIVERY_SCHEDULED"
  - id: ERR_ORDER_NOT_APPRAISABLE
    http: 409
    condition: "Appraisal requires the order to be in PLACED, CONFIG_LOCKED, ALLOCATED, IN_TRANSIT or AT_DELIVERY_CENTER"
  - id: ERR_ORDER_NOT_FINANCEABLE
    http: 409
    condition: "Contract review requires the order to be in PLACED, CONFIG_LOCKED, ALLOCATED, IN_TRANSIT or AT_DELIVERY_CENTER"
  - id: ERR_APPOINTMENT_NOT_BOOKED
    http: 409
    condition: "Confirmation requires the appointment to be in BOOKED"
  - id: ERR_APPOINTMENT_NOT_CONFIRMED
    http: 409
    condition: "Completion requires the appointment to be in CONFIRMED"
  - id: ERR_APPOINTMENT_NOT_AT_RISK
    http: 409
    condition: "Rebooking requires the appointment to be in AT_RISK"
  - id: ERR_APPOINTMENT_ALREADY_TERMINAL
    http: 409
    condition: "Cancellation requires the appointment not to be COMPLETED or CANCELLED"
  - id: ERR_INSPECTION_INCOMPLETE
    http: 409
    condition: "Acceptance inspection result must be CLEAN or ISSUES_DOCUMENTED before completion"
  - id: ERR_APPRAISAL_NOT_DRAFT
    http: 409
    condition: "Recording an appraisal requires the appraisal to be in DRAFT"
  - id: ERR_APPLICATION_NOT_SUBMITTED
    http: 409
    condition: "A lending decision or contract review requires the application to be in SUBMITTED or CONDITIONALLY_APPROVED"
  - id: ERR_FINANCING_NOT_FUNDED
    http: 409
    condition: "Handover booking requires every financing application on the order to be FUNDED"
  - id: ERR_BATCH_NOT_SCHEDULED
    http: 409
    condition: "Starting a batch requires it to be in SCHEDULED"
  - id: ERR_BATCH_NOT_DELAYED
    http: 409
    condition: "Resuming a batch requires it to be in DELAYED"
  - id: ERR_BATCH_NOT_DELAYABLE
    http: 409
    condition: "Recording a delay requires the batch to be in IN_PRODUCTION or DELAYED"
  - id: ERR_BATCH_NOT_IN_PRODUCTION
    http: 409
    condition: "Completing a batch requires it to be in IN_PRODUCTION or DELAYED"


  # --- Franchise-law and delivery scheduling ---
  - id: ERR_OUT_OF_STATE_DELIVERY_REQUIRED
    http: 403
    condition: "The buyer's jurisdiction bars direct sales and the proposed handover would take place inside that state"

  - id: ERR_GALLERY_HANDOVER_FORBIDDEN
    http: 403
    condition: "The jurisdiction is gallery-only and the proposed handover site is a GALLERY"

  - id: ERR_DELIVERY_SLOT_CONFLICT
    http: 409
    condition: "The requested bay interval overlaps an existing BOOKED, CONFIRMED or AT_RISK handover appointment once the jurisdiction buffer is applied"

  - id: ERR_SERVICE_SLOT_CONFLICT
    http: 409
    condition: "The requested service bay interval overlaps an existing CENTER_SCHEDULED appointment at the same site"

  - id: ERR_VAN_SCHEDULE_CONFLICT
    http: 409
    condition: "The requested dispatch window overlaps another non-cancelled mobile visit assigned to the same van code"

  - id: ERR_GALLERY_SERIALIZATION_GAP
    http: 409
    condition: "The next enrollment at a gallery site would start fewer than 2 days after the prior batch ended"

  - id: ERR_GALLERY_SERIALIZATION_GAP
    http: 409
    condition: "An operation tried to occupy a handover or service bay at a site whose center_kind is GALLERY, which by franchise law may not execute contracts and holds no schedulable bay"

  - id: ERR_APPRAISAL_EXPIRES_BEFORE_DELIVERY
    http: 409
    condition: "A trade-in offer validity instant falls strictly before the order's current projected delivery window end"

  - id: ERR_HOME_DELIVERY_OUT_OF_RANGE
    http: 403
    condition: "Home-delivery handover was requested but the buyer address falls outside the center's home-delivery radius"

  # --- Trade-in, financing and fee ledger ---
  - id: ERR_ORDER_FEE_UNPAID
    http: 402
    condition: "No ORDER_FEE_PAYMENT ledger entry covering order_fee_cents exists on the order"

  - id: ERR_TRADE_IN_NOT_RESOLVED
    http: 409
    condition: "A visible trade-in appraisal on the order is not ACCEPTED, blocking handover booking or loan funding"

  - id: ERR_TRADE_IN_TRANSFER_UNSETTLED
    http: 409
    condition: "A trade-in credit was applied to the order but the title transfer has not been settled"

  - id: ERR_APPRAISAL_OFFER_EXPIRED
    http: 409
    condition: "The trade-in offer validity instant is not strictly after the current logical clock"

  - id: ERR_FINANCE_EXCEEDS_VEHICLE_VALUE
    http: 402
    condition: "The requested financed amount exceeds the maximum financeable amount for the applicant's credit band"

  - id: ERR_BUYER_NOT_VERIFIED
    http: 403
    condition: "A financing decision was requested for a buyer whose identity_verified is false"

  # --- Production and delivery readiness ---
  - id: ERR_NO_ELIGIBLE_UNIT
    http: 409
    condition: "No AllocationUnit with status UNASSIGNED exists in the requested batch for the order's model"

  - id: ERR_ORDER_DELIVERY_NOT_READY
    http: 409
    condition: "The order's delivery_readiness_posture is FROZEN, so the requested delivery or funding operation is blocked"

  - id: ERR_NO_ESTIMATE_CHANGE
    http: 409
    condition: "A delivery estimate was requested but neither the projected window start nor the projected window end moved"

  - id: ERR_ESTIMATE_WINDOW_EXPIRED
    http: 409
    condition: "A superseded delivery estimate cannot be restored because its window_start is no longer at or after the current logical clock"

  # --- Mobile service ---
  - id: ERR_MOBILE_SERVICE_FORBIDDEN
    http: 403
    condition: "The governing jurisdiction sets mobile_service_permitted to false, or the referenced triage outcome is CENTER_REQUIRED, so no van may be dispatched"

  - id: ERR_PARTS_NOT_REQUIRED
    http: 409
    condition: "A parts reservation was requested for a visit whose triage report has parts_required false"

  - id: ERR_TRIAGE_NO_SERVICE_REQUIRED
    http: 409
    condition: "The referenced triage outcome is OTA_RESOLVABLE or NO_ACTION, so no service appointment may be opened"

  - id: ERR_PARTS_NOT_PRE_SHIPPED
    http: 409
    condition: "A mobile visit was started or completed before the required parts were confirmed shipped from the hub"

  - id: ERR_CENTER_NOT_FOUND_FOR_KIND
    http: 409
    condition: "The requested site exists but its center_kind does not support the operation"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated visitor who may only open a buying account"
    identity: opaque
    exclusive_operations:
      - "POST /v1/buyers — Create a buying account"
    shared_operations: []

  - name: Buyer
    description: "The purchasing account holder; owns orders, trade-in decisions and entitlement purchases"
    identity: entity_backed:Buyer
    exclusive_operations:
      - "POST /v1/orders/{orderId}/configuration-changes — Change configuration before the lock deadline"
      - "POST /v1/orders/{orderId}/place — Place the order"
      - "POST /v1/orders/{orderId}/financing-applications — Submit a financing application"
      - "POST /v1/orders/{orderId}/trade-in-appraisals/{appraisalId}/accept — Accept a trade-in offer"
      - "POST /v1/orders/{orderId}/trade-in-appraisals/{appraisalId}/reject — Reject a trade-in offer"
    shared_operations:
      - "GET /v1/orders and GET /v1/orders/{orderId}"
      - "GET /v1/orders/{orderId}/delivery-estimates"
      - "GET /v1/buyers/{buyerId}/orders, GET /v1/buyers/{buyerId}/trade-in-appraisals and GET /v1/buyers/{buyerId}/fee-ledger-entries"
      - "GET /v1/vehicles/{vehicleId} and its report, appointment, visit, issue-note and entitlement sub-resources"
      - "POST /v1/buyers/{buyerId}/identity-verification"
      - "POST /v1/vehicles/{vehicleId}/software-entitlements — Purchase an over-the-air feature"

  - name: DeliveryAdvisor
    description: "Runs handover scheduling, franchise-law screening and acceptance inspection"
    identity: opaque
    exclusive_operations:
      - "POST /v1/delivery-appointments — Book a handover"
      - "POST /v1/delivery-appointments/{appointmentId}/confirm — Confirm a handover"
      - "POST /v1/delivery-appointments/{appointmentId}/rebook — Rebook an at-risk handover"
      - "POST /v1/delivery-appointments/{appointmentId}/cancel — Cancel a handover"
      - "POST /v1/delivery-appointments/{appointmentId}/complete — Complete the acceptance inspection"
    shared_operations:
      - "GET /v1/orders, GET /v1/orders/{orderId} and order sub-resources"
      - "GET /v1/delivery-centers and GET /v1/delivery-centers/{centerId}"
      - "GET /v1/jurisdictions and GET /v1/jurisdictions/{jurisdictionId}"
      - "GET /v1/production-batches/{batchId} and its allocation units"

  - name: TradeInSpecialist
    description: "Appraises trade-in vehicles and publishes or re-appraises offers"
    identity: opaque
    exclusive_operations:
      - "POST /v1/orders/{orderId}/trade-in-appraisals/{appraisalId}/appraise — Record the appraisal"
      - "POST /v1/orders/{orderId}/trade-in-appraisals/{appraisalId}/offer — Publish the offer"
      - "POST /v1/orders/{orderId}/trade-in-appraisals/{appraisalId}/reappraise — Re-appraise an expired offer"
    shared_operations:
      - "POST /v1/orders/{orderId}/trade-in-appraisals — Open an appraisal"
      - "GET /v1/trade-in-appraisals and GET /v1/trade-in-appraisals/{appraisalId}"
      - "GET /v1/vehicle-configurations and GET /v1/vehicle-configurations/{configurationId}"

  - name: FinancePartner
    description: "Decides, contracts and funds vehicle loans"
    identity: opaque
    exclusive_operations:
      - "POST /v1/financing-applications/{applicationId}/decision — Record the lending decision"
      - "POST /v1/financing-applications/{applicationId}/contract-review — Move to contract preparation"
      - "POST /v1/financing-applications/{applicationId}/fund — Fund the loan"
    shared_operations:
      - "GET /v1/financing-applications and GET /v1/financing-applications/{applicationId}"
      - "GET /v1/orders/{orderId} and GET /v1/orders/{orderId}/financing-applications"
      - "GET /v1/buyers and GET /v1/buyers/{buyerId}"
      - "GET /v1/fee-ledger-entries"

  - name: ServiceTechnician
    description: "Triages remote diagnostics and performs repairs at a center or at the customer location"
    identity: opaque
    exclusive_operations:
      - "POST /v1/service-appointments — Open a service appointment from triage"
      - "POST /v1/service-appointments/{appointmentId}/schedule-center — Schedule a service bay"
      - "POST /v1/mobile-service-visits — Dispatch a mobile visit"
      - "POST /v1/mobile-service-visits/{visitId}/start — Go en route"
      - "POST /v1/mobile-service-visits/{visitId}/complete — Complete the repair"
      - "POST /v1/mobile-service-visits/{visitId}/reschedule — Move a mobile visit"
    shared_operations:
      - "POST /v1/vehicles/{vehicleId}/diagnostic-reports — Pull a remote diagnostic report"
      - "GET /v1/vehicles, GET /v1/vehicles/{vehicleId} and vehicle sub-resources"
      - "GET /v1/service-appointments and GET /v1/service-appointments/{appointmentId}"
      - "GET /v1/delivery-centers and GET /v1/delivery-centers/{centerId}"

  - name: PartsCoordinator
    description: "Pre-ships parts from the hub so a mobile repair can run at the customer location"
    identity: opaque
    exclusive_operations:
      - "POST /v1/mobile-service-visits/{visitId}/confirm-parts-shipment — Confirm parts left the hub"
    shared_operations:
      - "GET /v1/mobile-service-visits and GET /v1/mobile-service-visits/{visitId}"
      - "GET /v1/diagnostic-reports and GET /v1/diagnostic-reports/{reportId}"
      - "GET /v1/delivery-centers/{centerId} and its mobile visit sub-resource"
      - "GET /v1/vehicles and GET /v1/vehicles/{vehicleId}"

  - name: PlatformAdmin
    description: "Owns jurisdiction regimes, sites, configurations, production and every compensating action"
    identity: opaque
    exclusive_operations:
      - "POST /v1/jurisdictions and POST /v1/jurisdictions/{jurisdictionId}/enact"
      - "POST /v1/delivery-centers — Create a site"
      - "POST /v1/vehicle-configurations and its options"
      - "POST /v1/production-batches and every batch action, allocation unit minting and order allocation"
      - "POST /v1/orders/{orderId}/dispatch-to-transport, POST /v1/orders/{orderId}/arrive-at-center"
      - "POST /v1/orders/{orderId}/delivery-estimates and POST /v1/delivery-estimates/{estimateId}/restore"
      - "POST /v1/orders/{orderId}/fee-ledger-entries and POST /v1/_payments/simulate"
      - "POST /v1/vehicles/{vehicleId}/software-entitlements/{entitlementId}/revoke"
      - "POST /v1/_clock/set_current_utc — Advance the logical clock"
    shared_operations:
      - "Every GET in §1.5"
      - "POST /v1/orders/{orderId}/cancel, POST /v1/orders/{orderId}/lock-configuration"
      - "POST /v1/buyers/{buyerId}/identity-verification"
      - "POST /v1/vehicles/{vehicleId}/diagnostic-reports"