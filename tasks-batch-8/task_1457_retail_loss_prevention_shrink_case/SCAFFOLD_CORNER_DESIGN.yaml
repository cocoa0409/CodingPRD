  # ===========================================================================
  - section: endpoints
    instances:
      - name: envelope_success_object_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type 'object' for single-resource GET, and data holding the entity."
        test_recipe:
          setup: ["one store"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S100x", name: "Envelope Store", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
          trigger:
            - call: "GET /stores/${s1}"
              as: Auditor
              as_user_id: aud-1
          assert:
            - "response has meta.api_request_id (non-empty) and meta.api_request_timestamp (ISO8601)"
            - "response_type == 'object'"
            - "data.id == ${s1} and data.store_number == S100x"

      - name: envelope_error_shape_on_not_found
        claim_type: response_envelope
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry response_type 'error' and data.error_id + data.message; pagination fields are absent on error bodies."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: LPAnalyst
              as_user_id: ana-1
              captures: { err: $.data.error_id }
          assert:
            - "response_type == 'error'; err == ERR_NOT_FOUND; data.message non-empty"

      - name: pagination_defaults_bounds_and_last_page
        claim_type: pagination
        grounds: [response_envelope, "validations[priority=4]"]
        distinguishing_aspect: "Defaults (limit 10, offset 0) apply when omitted; limit=5&offset=10 on 12 rows returns 2 with has_more false and total_count 12; limit=0 and limit=101 fail ERR_INVALID_REQUEST; offset=-1 fails ERR_INVALID_REQUEST."
