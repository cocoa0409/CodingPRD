          assert:
            - "the created case reports severity_score == 0.8950"
            - "trigger call 1 -> 409 with data.error_id == \"ERR_TAKEDOWN_MANDATORY\": at or above 0.7500 a dismissal is forbidden, and status stays \"DETECTED\""
            - "trigger call 2 -> 200 status \"TAKEDOWN_ISSUED\"; trigger call 3 -> 200 status \"LEGAL_ESCALATED\" with legal_hold_applied_count == 1, the asset in \"LEGAL_HOLD\" with held_from_status \"STORED\", and rights_posture \"FROZEN\""
            - "trigger call 4 -> 409 with data.error_id == \"ERR_ASSET_UNDER_LEGAL_HOLD\", NOT ERR_INVALID_ASSET_STATE; purged_at stays null and purge_note is not stored"
            - "trigger call 5 -> 200 status \"CLOSED_SETTLED\"; the asset returns to \"STORED\" with its original retention_until intact and rights_posture returns to \"CLEAR\""
            - "trigger call 6 -> 200 status \"PURGED\" with purged_at == \"2026-08-01T00:00:00Z\": the same call refused in step 4 now succeeds, proving the refusal was the hold and nothing else"

