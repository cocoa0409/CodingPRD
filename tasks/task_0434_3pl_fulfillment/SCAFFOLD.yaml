    input: ["client_id?", "limit?", "offset?"]
    output: "Sku[]"
    side_effects: []

  - method: GET
    path: "/skus/{skuId}"
    description: "Get a SKU by id"
    roles: [ClientUser, WavePlanner, ReceivingClerk, BillingClerk]
    code: 200
    input: []
    output: Sku
    side_effects: []

  - method: GET
    path: "/receipts"
    description: "List receipts; filter by client_id, sku_id, bin_id (filtered-list reverse-reachability for those FKs)"
    roles: [ReceivingClerk, ClientUser, BillingClerk]
    code: 200
    input: ["client_id?", "sku_id?", "bin_id?", "limit?", "offset?"]
    output: "Receipt[]"
    side_effects: []

  - method: GET
    path: "/receipts/{receiptId}"
    description: "Get a receipt by id"
    roles: [ReceivingClerk, ClientUser, BillingClerk]
    code: 200
    input: []
    output: Receipt
    side_effects: []

  - method: GET
