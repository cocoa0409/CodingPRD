            - call: "GET /articles/${a13_id}"
              as: ScholCommLibrarian
              captures: { a13_fund_after_draft: $.data.funding_status }
            - call: "POST /transformative-agreements/${ta13_id}/activation"
              payload: {}
              as: AgreementAdmin
              captures: { ta13_status_active: $.data.status }
            - call: "POST /articles/${a13_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
              captures:
