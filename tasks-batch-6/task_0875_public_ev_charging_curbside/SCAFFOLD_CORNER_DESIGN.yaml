        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[claim-create-stale-station]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first claim create bumps Station.version, a second create still carrying the previously-observed version → ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Grant; site; grant station with 180kW ADA port; station version observed as stn_v; one claim already created (station.version now stn_v+1)."]
          setup_api_calls:
            - { call: "POST /grant-programs", payload: { name: "NEVI", program_code: "NEVI", min_uptime_pct: 97.0, min_ports: 1, min_power_kw: 150, reimbursement_rate_cents_per_kwh: 20, reimbursement_cap_cents: 5000000 }, as: ProgramAdmin, captures: { grant_id: "$.data.id" } }
