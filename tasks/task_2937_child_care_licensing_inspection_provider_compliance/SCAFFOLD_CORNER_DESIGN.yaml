          - calculations.inspection_compliance_score
        distinguishing_aspect: "Neither branch of the outcome rule fires when the only citation is MINOR — no CRITICAL forces FAIL and the violation set is non-empty so PASS is not forced — so CONDITIONAL_PASS is accepted and finalize yields 99.00."
        test_recipe:
