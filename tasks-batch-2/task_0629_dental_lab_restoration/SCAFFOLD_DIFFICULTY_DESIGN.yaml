scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_tier_crossing
        grounds:
          - calculations.invoice_total
          - state_machines.Case.INTAKE_to_DESIGN
          - state_machines.Case.TRY_IN_to_SHIPPED
          - entities.Invoice.fields.kind
          - entities.Doctor.fields.completed_case_count
        distinguishing_aspect: >-
          Same single crown, but the PROVISIONAL invoice (issued at submit, doctor completed_case_count=4 -> 0% tier)
          differs from the FINAL invoice (recomputed at ship after the doctor crossed to 5 delivered cases -> 5% tier):
          provisional total_cents=12990 vs final total_cents=12341. The dual variants live on the Invoice/Doctor
          pricing domain.
        test_recipe:
          setup:
            - "A doctor with exactly 4 DELIVERED cases (completed_case_count=4) registered."
            - "A 5th case for this doctor reaches TRY_IN with one billable MILLED crown (zirconia, unit_price 12000)."
            - "Between submit and ship the doctor's completed_case_count crosses from 4 to 5 (a separate case delivered)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LabAdmin
            - call: "POST /doctors"
              payload: { full_name: "Dr A", practice_name: "P", email: "dva@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id"}
            - call: "POST /materials"
              payload: { code: "ZIRCONIA", name: "Zirconia", base_unit_price_cents: 12000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { zir_id: "$.data.id"}
            - call: "POST /mill-machines"
              payload: { name: "Mill-A", capability: "MILLED" }
              as: LabAdmin
              captures: { mach_id: "$.data.id", mach_v0: "$.data.version"}
            - call: "POST /courier-routes"
              payload: { label: "R", service_date: "2026-01-06T00:00:00Z", max_stops: 10, buffer_minutes: 30 }
              as: Scheduler
              captures: { route_id: "$.data.id"}
            # --- helper sub-routine to drive a crown case empty->DELIVERED (raises completed_case_count) ---
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN" }
              as: LabTech
              captures: { warm_case: "$.data.id"}
            - call: "POST /cases/${warm_case}/restorations"
              payload: { material_id: "${zir_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
              captures: { warm_rest: "$.data.id"}
            - call: "POST /cases/${warm_case}/submit"
              payload: {}
              as: LabTech
              captures: { warm_v1: "$.data.version"}
            - call: "GET /restorations/${warm_rest}/fabrication-units"
              payload: {}
              as: LabTech
              captures: { warm_unit: "$.data[0].id"}
            - call: "POST /mill-jobs"
              payload: { fabrication_unit_id: "${warm_unit}", mill_machine_id: "${mach_id}", start_at: "2026-01-01T01:00:00Z", duration_minutes: 60 }
              as: Scheduler
              captures: { warm_job: "$.data.id"}
            - call: "POST /cases/${warm_case}/start-fabrication"
              payload: {}
              as: LabTech
            - call: "POST /mill-jobs/${warm_job}/start"
              payload: { expected_machine_version: "${mach_v0}" }
              as: Scheduler
            - call: "POST /mill-jobs/${warm_job}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /cases/${warm_case}/ready-tryin"
              payload: {}
              as: LabTech
              captures: { warm_v2: "$.data.version"}
            - call: "POST /route-stops"
              payload: { courier_route_id: "${route_id}", case_id: "${warm_case}", window_start_at: "2026-01-02T09:00:00Z", window_minutes: 20 }
              as: Scheduler
              captures: { warm_stop: "$.data.id"}
            - call: "POST /cases/${warm_case}/tryin-verdict"
              payload: { verdict: "ACCEPT", expected_case_version: "${warm_v2}" }
              as: Doctor
              as_user_id: "${doc_id}"
            - call: "POST /route-stops/${warm_stop}/complete"
              payload: {}
              as: Scheduler
            # NOTE: the test transcriber repeats the warm sub-routine until completed_case_count==4 before the SUT case;
            # the assert below pins both the 4->5 crossing case and the resulting numbers.
            - call: "POST /cases/${warm_case}/confirm-delivery"
              payload: {}
              as: Scheduler
          trigger:
            - call: "GET /cases/${warm_case}/invoice"
              payload: {}
              as: Billing
              captures: { inv_kind: "$.data[0].kind", inv_total: "$.data[0].total_cents"}
          assert:
            - "Invoice.kind == FINAL after ship"
            - "When the doctor had completed_case_count==4 at submit and ==5 at ship, the FINAL invoice total_cents == 12341 while the PROVISIONAL snapshot would have been 12990"
            - "Invoice.discount_cents == 600 on the final (5% of 12000) versus 0 on the provisional"

      - name: pricing_per_unit_round_vs_sum_then_round
        grounds:
          - calculations.line_item_pricing
          - calculations.invoice_total
          - entities.Restoration.fields.unit_price_cents
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: >-
          For a 3-unit bridge in a material priced at base 9999 (factor 1.25), the pinned per-unit-round order yields
          Restoration.unit_price_cents=12499 and subtotal_cents=37497, whereas the rejected sum-then-round order would
          give 37496. This dual order lives on the Restoration pricing domain, distinct from the Invoice/Doctor variant
          above.
        test_recipe:
          setup:
            - "A doctor and a MILLED material with base_unit_price_cents=9999."
            - "An INTAKE case with one 3-unit BRIDGE restoration in that material, submitted (priced)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LabAdmin
            - call: "POST /doctors"
              payload: { full_name: "Dr B", practice_name: "P", email: "dvb@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id"}
            - call: "POST /materials"
              payload: { code: "EMAXX", name: "Emax Special", base_unit_price_cents: 9999, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { mat_id: "$.data.id"}
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "IMPRESSION" }
              as: LabTech
              captures: { case_id: "$.data.id"}
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "BRIDGE", unit_count: 3, requested_shade: "A1" }
              as: LabTech
              captures: { rest_id: "$.data.id"}
          trigger:
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
            - call: "GET /cases/${case_id}/invoice"
              payload: {}
              as: Billing
              captures: { sub: "$.data[0].subtotal_cents"}
          assert:
            - "Restoration.${rest_id}.unit_price_cents == 12499"
            - "Invoice.subtotal_cents == 37497 (per-unit-round then sum), NOT 37496"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_nested_tier_rush_tax_chain
        grounds:
          - calculations.invoice_total
          - entities.Case.fields.is_rush
          - entities.Doctor.fields.completed_case_count
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: >-
          Mode (a): >=3 inputs (subtotal, rush flag, doctor volume tier, tax) with conditional branches and a pinned
          evaluation order rush->discount->tax->sla_credit. A 3-unit emax bridge (subtotal 56250), rush, doctor at the
          20+ tier (10%) yields total_cents=82202 — order-sensitive (discount is on subtotal+rush, tax on the
          post-discount base).
        test_recipe:
          setup:
            - "A doctor with completed_case_count>=20 (10% tier)."
            - "A rush case with one 3-unit BRIDGE in EMAX (base 15000 -> unit_price 18750, subtotal 56250) at submit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LabAdmin
            - call: "POST /doctors"
              payload: { full_name: "Dr C", practice_name: "P", email: "dvc@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id"}
            - call: "POST /materials"
              payload: { code: "EMAX", name: "Emax", base_unit_price_cents: 15000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { emax_id: "$.data.id"}
            # (transcriber drives 20 helper crown cases to DELIVERED so completed_case_count==20; abbreviated here)
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN", is_rush: true }
              as: LabTech
              captures: { case_id: "$.data.id"}
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${emax_id}", restoration_type: "BRIDGE", unit_count: 3, requested_shade: "A2" }
              as: LabTech
              captures: { rest_id: "$.data.id"}
          trigger:
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
            - call: "GET /cases/${case_id}/invoice"
              payload: {}
              as: Billing
              captures: { tot: "$.data[0].total_cents"}
          assert:
            - "Invoice.subtotal_cents == 56250 and Invoice.rush_surcharge_cents == 28125"
            - "Invoice.discount_cents == 8438 (10% of 84375) and Invoice.tax_cents == 6265"
            - "Invoice.total_cents == 82202 (rush before discount, discount before tax)"

      - name: pricing_per_unit_round_order_pinned
        grounds:
          - calculations.line_item_pricing
          - entities.Restoration.fields.unit_price_cents
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: >-
          Mode (b): nested rounding where order matters — per-unit round-then-sum is pinned; base 9999 * 1.25 over 3
          units gives subtotal 37497 (round each of the 12499 units, then multiply/sum) not 37496 (sum 37496.25 then
          round). Distinct mode from the (a) nested-tier formula above.
        test_recipe:
          setup:
            - "A submitted case with one 3-unit BRIDGE in a base-9999 MILLED material."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LabAdmin
            - call: "POST /doctors"
              payload: { full_name: "Dr D", practice_name: "P", email: "dvd@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id"}
            - call: "POST /materials"
              payload: { code: "ODD99", name: "Odd", base_unit_price_cents: 9999, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { mat_id: "$.data.id"}
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "IMPRESSION" }
              as: LabTech
              captures: { case_id: "$.data.id"}
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "BRIDGE", unit_count: 3, requested_shade: "B1" }
              as: LabTech
              captures: { rest_id: "$.data.id"}
          trigger:
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
            - call: "GET /cases/${case_id}/invoice"
              payload: {}
              as: Billing
              captures: { sub: "$.data[0].subtotal_cents"}
          assert:
            - "Restoration.${rest_id}.unit_price_cents == 12499"
            - "Invoice.subtotal_cents == 37497"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_tryin_revision_cycle
        grounds:
          - state_machines.Case.TRY_IN_to_REVISION
          - state_machines.Case.REVISION_to_DESIGN
          - state_machines.FabricationUnit.MILLED_to_QUEUED
          - entities.Case.fields.revision_count
        distinguishing_aspect: >-
          The Case machine is cyclic: TRY_IN -> REVISION -> DESIGN -> FABRICATION -> TRY_IN, incrementing
          revision_count each loop and requeuing the MILLED unit. This cycle lives on the Case entity.
        test_recipe:
          setup:
            - "A case at TRY_IN with one MILLED crown unit and revision_count=0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LabAdmin
            - call: "POST /doctors"
              payload: { full_name: "Dr E", practice_name: "P", email: "dve@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id"}
            - call: "POST /materials"
              payload: { code: "ZIR2", name: "Zir", base_unit_price_cents: 12000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { mat_id: "$.data.id"}
            - call: "POST /mill-machines"
              payload: { name: "Mill-B", capability: "MILLED" }
              as: LabAdmin
              captures: { mach_id: "$.data.id", mach_v0: "$.data.version"}
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN" }
              as: LabTech
              captures: { case_id: "$.data.id"}
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
              captures: { rest_id: "$.data.id"}
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
            - call: "GET /restorations/${rest_id}/fabrication-units"
              payload: {}
              as: LabTech
              captures: { unit_id: "$.data[0].id"}
            - call: "POST /mill-jobs"
              payload: { fabrication_unit_id: "${unit_id}", mill_machine_id: "${mach_id}", start_at: "2026-01-01T01:00:00Z", duration_minutes: 60 }
              as: Scheduler
              captures: { job_id: "$.data.id"}
            - call: "POST /cases/${case_id}/start-fabrication"
              payload: {}
              as: LabTech
            - call: "POST /mill-jobs/${job_id}/start"
              payload: { expected_machine_version: "${mach_v0}" }
              as: Scheduler
            - call: "POST /mill-jobs/${job_id}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /cases/${case_id}/ready-tryin"
              payload: {}
              as: LabTech
              captures: { case_v: "$.data.version"}
          trigger:
            - call: "POST /cases/${case_id}/tryin-verdict"
              payload: { verdict: "REVISE", expected_case_version: "${case_v}", revise_restoration_ids: ["${rest_id}"] }
              as: Doctor
              as_user_id: "${doc_id}"
              captures: { new_status: "$.data.status", rev: "$.data.revision_count"}
          assert:
            - "Case.status == REVISION after the REVISE verdict"
            - "Case.revision_count == 1"
            - "The crown FabricationUnit.status == QUEUED again (requeued for re-milling)"

      - name: invoice_parallel_billing_and_delivery_dimensions
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.Invoice.IN_TRANSIT_to_DELIVERED
          - entities.Invoice.fields.billing_status
          - entities.Invoice.fields.delivery_status
        distinguishing_aspect: >-
          The Invoice carries two independent state axes: billing_status (DRAFT->ISSUED->PAID) and delivery_status
          (PENDING->IN_TRANSIT->DELIVERED) evolve separately. Paying the invoice advances only billing_status while
          delivery_status stays IN_TRANSIT. This parallel machine lives on the Invoice entity (distinct from Case).
        test_recipe:
          setup:
            - "A shipped case whose invoice is FINAL, billing_status=ISSUED, delivery_status=IN_TRANSIT (not yet delivered)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LabAdmin
            - call: "POST /doctors"
              payload: { full_name: "Dr F", practice_name: "P", email: "dvf@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id"}
            - call: "POST /materials"
              payload: { code: "ZIR3", name: "Zir", base_unit_price_cents: 12000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { mat_id: "$.data.id"}
            - call: "POST /mill-machines"
              payload: { name: "Mill-C", capability: "MILLED" }
              as: LabAdmin
              captures: { mach_id: "$.data.id", mach_v0: "$.data.version"}
            - call: "POST /courier-routes"
              payload: { label: "R2", service_date: "2026-01-03T00:00:00Z", max_stops: 5, buffer_minutes: 30 }
              as: Scheduler
              captures: { route_id: "$.data.id"}
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN" }
              as: LabTech
              captures: { case_id: "$.data.id"}
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
              captures: { rest_id: "$.data.id"}
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
            - call: "GET /restorations/${rest_id}/fabrication-units"
              payload: {}
              as: LabTech
              captures: { unit_id: "$.data[0].id"}
            - call: "POST /mill-jobs"
              payload: { fabrication_unit_id: "${unit_id}", mill_machine_id: "${mach_id}", start_at: "2026-01-01T01:00:00Z", duration_minutes: 60 }
              as: Scheduler
              captures: { job_id: "$.data.id"}
            - call: "POST /cases/${case_id}/start-fabrication"
              payload: {}
              as: LabTech
            - call: "POST /mill-jobs/${job_id}/start"
              payload: { expected_machine_version: "${mach_v0}" }
              as: Scheduler
            - call: "POST /mill-jobs/${job_id}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /cases/${case_id}/ready-tryin"
              payload: {}
              as: LabTech
              captures: { case_v: "$.data.version"}
            - call: "POST /route-stops"
              payload: { courier_route_id: "${route_id}", case_id: "${case_id}", window_start_at: "2026-01-02T09:00:00Z", window_minutes: 20 }
              as: Scheduler
            - call: "POST /cases/${case_id}/tryin-verdict"
              payload: { verdict: "ACCEPT", expected_case_version: "${case_v}" }
              as: Doctor
              as_user_id: "${doc_id}"
            - call: "GET /cases/${case_id}/invoice"
              payload: {}
              as: Billing
              captures: { inv_id: "$.data[0].id"}
          trigger:
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: Billing
              captures: { bs: "$.data.billing_status", ds: "$.data.delivery_status"}
          assert:
            - "Invoice.billing_status == PAID after pay"
            - "Invoice.delivery_status == IN_TRANSIT (unchanged by the billing-dimension transition)"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: ship_cascade_unit_invoice_creditmemo_ledger
        grounds:
          - state_machines.Case.TRY_IN_to_SHIPPED
          - calculations.invoice_total
          - calculations.credit_ledger_conservation
          - entities.CreditMemo.fields.amount_cents
          - entities.Doctor.fields.account_credit_cents
        distinguishing_aspect: >-
          Depth-4 cascade from one trigger (ship ACCEPT on an SLA-breached case): ship sets Case.shipped_at and
          sla_breached -> that flips the Invoice to FINAL and writes sla_credit_cents -> that FINAL invoice's credit
          spawns a CreditMemo (ISSUED) -> the memo's issuance increments Doctor.account_credit_cents. Each link is
          caused by the previous, not by the original ship directly.
        test_recipe:
          setup:
            - "A crown case at TRY_IN with promised_ready_at=2026-01-06T00:00:00Z (standard 120h from a 2026-01-01 submit)."
            - "The logical clock is advanced to 2026-01-06T01:00:00Z (1h past the promise) before the ACCEPT verdict, so the ship breaches SLA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LabAdmin
            - call: "POST /doctors"
              payload: { full_name: "Dr G", practice_name: "P", email: "dvg@x.com" }
              as: LabAdmin
              captures: { doc_id: "$.data.id"}
            - call: "POST /materials"
              payload: { code: "ZIR4", name: "Zir", base_unit_price_cents: 12000, fabrication_process: "MILLED" }
              as: LabAdmin
              captures: { mat_id: "$.data.id"}
            - call: "POST /mill-machines"
              payload: { name: "Mill-D", capability: "MILLED" }
              as: LabAdmin
              captures: { mach_id: "$.data.id", mach_v0: "$.data.version"}
            - call: "POST /courier-routes"
              payload: { label: "R3", service_date: "2026-01-06T00:00:00Z", max_stops: 5, buffer_minutes: 30 }
              as: Scheduler
              captures: { route_id: "$.data.id"}
            - call: "POST /cases"
              payload: { doctor_id: "${doc_id}", intake_method: "INTRAORAL_SCAN" }
              as: LabTech
              captures: { case_id: "$.data.id"}
            - call: "POST /cases/${case_id}/restorations"
              payload: { material_id: "${mat_id}", restoration_type: "CROWN", unit_count: 1, requested_shade: "A2" }
              as: LabTech
              captures: { rest_id: "$.data.id"}
            - call: "POST /cases/${case_id}/submit"
              payload: {}
              as: LabTech
            - call: "GET /restorations/${rest_id}/fabrication-units"
              payload: {}
              as: LabTech
              captures: { unit_id: "$.data[0].id"}
            - call: "POST /mill-jobs"
              payload: { fabrication_unit_id: "${unit_id}", mill_machine_id: "${mach_id}", start_at: "2026-01-01T01:00:00Z", duration_minutes: 60 }
              as: Scheduler
              captures: { job_id: "$.data.id"}
            - call: "POST /cases/${case_id}/start-fabrication"
              payload: {}
              as: LabTech
            - call: "POST /mill-jobs/${job_id}/start"
              payload: { expected_machine_version: "${mach_v0}" }
              as: Scheduler
            - call: "POST /mill-jobs/${job_id}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /cases/${case_id}/ready-tryin"
              payload: {}
              as: LabTech
              captures: { case_v: "$.data.version"}
            - call: "POST /route-stops"
              payload: { courier_route_id: "${route_id}", case_id: "${case_id}", window_start_at: "2026-01-06T09:00:00Z", window_minutes: 20 }
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-06T01:00:00Z" }
              as: LabAdmin
          trigger:
            - call: "POST /cases/${case_id}/tryin-verdict"
              payload: { verdict: "ACCEPT", expected_case_version: "${case_v}" }
              as: Doctor
              as_user_id: "${doc_id}"
            - call: "GET /doctors/${doc_id}"
              payload: {}
              as: Billing
              captures: { acc: "$.data.account_credit_cents"}
          assert:
            - "Case.sla_breached == true (shipped 2026-01-06T01:00:00Z > promised 2026-01-06T00:00:00Z)"
            - "Invoice.kind == FINAL and Invoice.sla_credit_cents == 2400 and Invoice.total_cents == 10590"
            - "A CreditMemo with amount_cents == 2400 and status ISSUED exists on the case"
            - "Doctor.account_credit_cents == 2400 (ledger incremented by the memo amount)"

