              payload: { sku: "SKU-P-A-CS", description: "Item A, case", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 5000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_a_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-P-B-CS", description: "Item B, case", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 5000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_b_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-P", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_a_id}", tier_price_cents: 1000, floor_price_cents: 800 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_b_id}", tier_price_cents: 1000, floor_price_cents: 800 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
