            - "trigger response HTTP status == 400"

      - name: corner_care_plan_create_requires_finalized_assessment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_ASSESSMENT_NOT_FINALIZED]"]
        distinguishing_aspect: "POST /care-plans against a DRAFT assessment returns 409 ERR_ASSESSMENT_NOT_FINALIZED."
