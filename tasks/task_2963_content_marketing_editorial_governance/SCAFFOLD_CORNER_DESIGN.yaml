      - name: assign_sme_requires_the_briefs_required_expertise_tag
        claim_type: Error triggerable
        grounds:
          - errors[ERR_EXPERTISE_TAG_MISMATCH]
          - validations[priority=29]
          - endpoints[POST /editorial/briefs/{id}/assign-sme]
        distinguishing_aspect: "Tag matching is membership of the brief's single required_expertise_tag in the expert's tag array, not array intersection or overlap scoring: an expert tagged only security is refused for an accessibility brief even though they are AVAILABLE with free capacity, while an expert carrying both tags is accepted. The refusal must leave the brief DRAFT and the expert's version untouched."
