            - "PoleAttachment.${att2}.status == REQUESTED"
            - "Pole.${pole_id}.committed_load_units == 60"

      - name: intersection_summary_computed_read
        claim_type: computed_read
        grounds: [endpoints, calculations.intersection_posture]
        distinguishing_aspect: "GET /intersections/{id}/summary returns operational_posture NORMAL and device_count 1 for a one-device intersection."
