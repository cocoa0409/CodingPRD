  # =================================================================
  # Section: validations — violation->error, satisfaction, ordering
  # =================================================================
  - section: validations
    instances:
      - name: duplicate_standard_pair_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_STANDARD_DUPLICATE]"]
        distinguishing_aspect: "Second NetworkStandard with the same (specialty, geo_class) is rejected ERR_STANDARD_DUPLICATE; a different geo_class for the same specialty is accepted."
        test_recipe:
          setup: ["CARDIOLOGY/URBAN standard exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager }
          trigger:
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 999, max_travel_minutes: 1, max_travel_miles: 1, max_wait_days_routine: 1, max_wait_days_urgent: 1 }, as: NetworkManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "RURAL", max_members_per_provider: 999, max_travel_minutes: 60, max_travel_miles: 40, max_wait_days_routine: 30, max_wait_days_urgent: 5 }, as: NetworkManager, captures: { ok2: "$.data.id" } }
          assert:
            - "duplicate pair -> 409 ERR_STANDARD_DUPLICATE"
            - "same specialty with different geo_class -> 201 (uniqueness is over the pair)"

      - name: duplicate_npi_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_NPI_DUPLICATE]"]
        distinguishing_aspect: "Provider npi is globally unique."
