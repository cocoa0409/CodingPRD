              payload: { legal_business_name: "Ashgrove Cycles", tax_id: "88-5300030", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: Applicant
              captures: { app_g1: "$.data.id" }
          trigger:
            - call: "POST /merchant-applications"
              payload: { legal_business_name: "Ashgrove Cycles Two", tax_id: "88-5300031", mcc_code: "5732", country_code: "US", requested_monthly_volume_cents: 30000000, average_ticket_cents: 12000, avg_delivery_lag_days: 0, declared_chargeback_ratio_bps: 0, prior_processing_history_months: 24, credit_score: 700 }
              as: UnderwritingOfficer
              captures: { e1_g1: "$.data.error_id" }
            - call: "POST /beneficial-owners"
              payload: { application_id: "${app_g1}", full_name: "Dana Reyes", ownership_pct: "100.00", country_code: "US", date_of_birth: "1980-05-05", government_id_last4: "1234" }
              as: UnderwritingOfficer
              captures: { e2_g1: "$.data.error_id" }
            - call: "POST /merchant-applications/${app_g1}/submit"
              payload: {}
              as: RiskAnalyst
              captures: { e3_g1: "$.data.error_id" }
            - call: "GET /merchant-applications/${app_g1}/beneficial-owners"
              payload: {}
              as: UnderwritingOfficer
          assert:
            - "all three writes return HTTP 403 with ${e1_g1} == ERR_ROLE_NOT_PERMITTED and ${e2_g1} == ERR_ROLE_NOT_PERMITTED and ${e3_g1} == ERR_ROLE_NOT_PERMITTED"
            - "MerchantApplication.${app_g1}.state == DRAFT"
