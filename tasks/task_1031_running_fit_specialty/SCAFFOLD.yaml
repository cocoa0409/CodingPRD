# =============================================================================
# Task 1031 — Running & Fit Specialty Store
# SCAFFOLD.yaml  (§1.0–§1.7)
# =============================================================================

scenario: |
  1031. Running & Fit Specialty Store: gait analysis & fitment, shoe rotation &
  mileage-reminder, subscription/club & training-group, race-packet & event,
  wear/return policy, loyalty, nutrition/gear, inventory

domain_name: running-fit-specialty
api_prefix: ""   # flat topology: peer collections (/members, /orders, /products, ...) linked by FK

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat            # peer entities linked by foreign keys; no nested-ownership URLs
  state_machine_shape: parallel    # Order carries independent payment_status × fulfillment_status dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles           # Member / Fitter own different resource types; StoreManager operates
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: email, type: string, source: input, description: "Unique contact email" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: state_code, type: string, source: input, description: "US state code (2 letters)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED", constraints: "ACTIVE, SUSPENDED" }
      - { name: loyalty_points_balance, type: integer, source: system, default: 0, description: "Current redeemable loyalty points. Mutated by earn (fulfill), redeem (apply-redemption), reversals, and manual adjustments. Never below 0." }
      - { name: tier_qualifying_spend_cents, type: integer, source: computed, default: 0, description: "Sum of net_paid_cents over this member's orders fulfilled within the trailing 365 days of the logical clock; reduced when a return is approved." }
      - { name: loyalty_tier, type: enum, source: computed, description: "STANDARD | SILVER | GOLD — derived from tier_qualifying_spend_cents (see calc loyalty_tier)", constraints: "STANDARD, SILVER, GOLD" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit, unique" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: category, type: enum, source: input, description: "SHOE | NUTRITION | GEAR | APPAREL", constraints: "SHOE, NUTRITION, GEAR, APPAREL" }
      - { name: unit_price_cents, type: integer, source: input, description: "List price in cents", constraints: ">= 0" }
      - { name: mileage_life_miles, type: integer, source: input, default: 500, description: "Recommended retirement mileage for a SHOE; ignored for non-SHOE categories" }
      - { name: stock_on_hand, type: integer, source: system, default: 0, description: "Physical units in inventory; decremented by fulfill, incremented by restock" }
      - { name: stock_reserved, type: integer, source: system, default: 0, description: "Units held for RESERVED (unfulfilled) orders; incremented by reserve, decremented by fulfill and by release (cancel)" }
      - { name: available_units, type: integer, source: computed, description: "= stock_on_hand - stock_reserved (see calc inventory_available)" }
      - { name: availability, type: enum, source: computed, description: "IN_STOCK if stock_on_hand > 0 else OUT_OF_STOCK", constraints: "IN_STOCK, OUT_OF_STOCK" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the customer who placed the order" }
      - { name: promo_code, type: string, source: input, default: null, description: "Optional promotional code; resolved against PROMO_CODES constant map" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "Payment dimension: UNPAID | AUTHORIZED | PAID | REFUNDED", constraints: "UNPAID, AUTHORIZED, PAID, REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, default: "PENDING", description: "Fulfillment dimension: PENDING | RESERVED | FULFILLED | RETURNED | CANCELLED", constraints: "PENDING, RESERVED, FULFILLED, RETURNED, CANCELLED" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of line_gross_cents over all OrderLines" }
      - { name: discount_pct_applied, type: number, source: computed, description: "Effective discount fraction applied (see calc effective_discount)" }
      - { name: discount_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * discount_pct_applied), unless a price override replaces it" }
      - { name: price_override_discount_cents, type: integer, source: system, default: null, description: "Manager override that replaces discount_cents when set (see POST /orders/{id}/price-overrides)" }
      - { name: redeemed_points, type: integer, source: system, default: 0, description: "Loyalty points applied to this order via apply-redemption" }
      - { name: redemption_cents, type: integer, source: computed, description: "= redeemed_points * LOYALTY_POINT_VALUE_CENTS" }
      - { name: shipping_fee_cents, type: integer, source: computed, description: "0 when subtotal_after_discount >= FREE_SHIP_THRESHOLD_CENTS else SHIPPING_FEE_CENTS" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Order total computed at creation with redeemed_points=0 and tier/subscription as of creation (see calc order_pricing, variant provisional)" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Order total computed at fulfillment with redemption applied and tier/subscription as of fulfillment (see calc order_pricing, variant final)" }
      - { name: net_paid_cents, type: integer, source: computed, default: null, description: "Amount captured for the member; equals final_total_cents once payment is captured; drives tier_qualifying_spend_cents" }
      - { name: estimated_points_earned, type: integer, source: computed, description: "Loyalty points projected at creation over all lines (see calc loyalty_points_earned, variant estimated)" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; the parent order" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the product purchased on this line" }
      - { name: quantity, type: integer, source: input, description: "Units ordered on this line", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: system, description: "Snapshot of Product.unit_price_cents at order creation" }
      - { name: line_gross_cents, type: integer, source: computed, description: "= unit_price_cents * quantity" }
      - { name: line_points_earned, type: integer, source: computed, description: "Points contributed by this line, round_half_up per line (see calc loyalty_points_earned)" }
      - { name: is_returned, type: boolean, source: system, default: false, description: "True once a WearReturn against this line is APPROVED" }

  - name: WearReturn
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the line being returned under the wear/return policy" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; copied from the order line's order (owner of the return)" }
      - { name: reason, type: string, source: input, description: "Customer-stated reason for return" }
      - { name: wear_days, type: integer, source: input, default: null, description: "Days the shoe was worn (wear-test window evidence)" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | UNDER_INSPECTION | APPROVED | REJECTED | WITHDRAWN", constraints: "REQUESTED, UNDER_INSPECTION, APPROVED, REJECTED, WITHDRAWN" }
      - { name: inspection_notes, type: string, source: system, default: null, description: "Notes recorded during inspection / on reject" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; club member" }
      - { name: plan, type: enum, source: input, description: "BASIC | PLUS | ELITE", constraints: "BASIC, PLUS, ELITE" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | PAST_DUE | CANCELLED", constraints: "ACTIVE, PAST_DUE, CANCELLED" }
      - { name: discount_pct, type: number, source: computed, description: "Store discount granted by plan (see SUBSCRIPTION_DISCOUNT_PCT); only counts while status == ACTIVE" }

  - name: RunningShoe
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owner of the shoe in their rotation" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; the shoe model" }
      - { name: source_order_id, type: string, source: system, default: null, description: "FK -> Order.id; the order whose fulfillment created this shoe" }
      - { name: retirement_threshold_miles, type: integer, source: system, description: "Snapshot of Product.mileage_life_miles at shoe creation" }
      - { name: total_mileage_miles, type: integer, source: system, default: 0, description: "Cumulative logged mileage; incremented by log-mileage" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIREMENT_DUE | RETIRED", constraints: "ACTIVE, RETIREMENT_DUE, RETIRED" }

  - name: Fitter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Fitter staff name" }
      - { name: is_active, type: boolean, source: system, default: true, description: "Whether the fitter takes appointments" }

  - name: FitmentSession
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; customer being fitted" }
      - { name: fitter_id, type: string, source: input, description: "FK -> Fitter.id; assigned fitter" }
      - { name: scheduled_start, type: datetime, source: input, description: "Appointment start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Appointment end (ISO 8601 UTC); must be after scheduled_start" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW", constraints: "SCHEDULED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW" }
      - { name: recommended_product_id, type: string, source: system, default: null, description: "FK -> Product.id; shoe recommended at completion (gait analysis outcome)" }
      - { name: notes, type: string, source: system, default: null, description: "Gait-analysis notes recorded at completion" }

  - name: TrainingSession
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Group-run title" }
      - { name: start_time, type: datetime, source: input, description: "Session start (ISO 8601 UTC)" }
      - { name: end_time, type: datetime, source: input, description: "Session end (ISO 8601 UTC); must be after start_time" }
      - { name: capacity, type: integer, source: input, description: "Maximum BOOKED members", constraints: ">= 1" }
      - { name: fitter_id, type: string, source: input, default: null, description: "FK -> Fitter.id; optional coach leading the session" }
      - { name: booked_count, type: integer, source: computed, description: "Count of TrainingBookings for this session with status == BOOKED" }
      - { name: available_slots, type: integer, source: computed, description: "= capacity - booked_count (see calc training_available_slots)" }

  - name: TrainingBooking
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> TrainingSession.id; the booked session" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member holding the booking" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | WAITLISTED | CANCELLED | ATTENDED | NO_SHOW", constraints: "BOOKED, WAITLISTED, CANCELLED, ATTENDED, NO_SHOW" }
      - { name: waitlist_position, type: integer, source: computed, default: null, description: "Position in the session waitlist while status == WAITLISTED (created_at ASC ordering); null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Order: payment_status dimension (parallel with fulfillment_status) ----
  - entity: Order
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    note: "Payment dimension. Evolves independently of fulfillment_status (parallel state)."
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "POST /orders/{orderId}/authorize-payment"
        actor: Member
        preconditions:
          - "payment_status == UNPAID"
        side_effects: []
      - from: AUTHORIZED
        to: PAID
        trigger: "POST /orders/{orderId}/capture-payment"
        actor: Member
        preconditions:
          - "payment_status == AUTHORIZED"
        side_effects:
          - "net_paid_cents = final_total_cents recomputed at capture (calc order_pricing, variant final)"
          - "If redeemed_points > 0: the redeem debit was already applied at apply-redemption time; no further balance change here"
      - from: PAID
        to: REFUNDED
        trigger: "system: cascaded from POST /orders/{orderId}/cancel or POST /returns/{returnId}/approve"
        actor: system
        preconditions:
          - "payment_status == PAID"
        side_effects:
          - "net_paid_cents set to 0 on full cancel; reduced by returned line net on return approval"
      - from: AUTHORIZED
        to: REFUNDED
        trigger: "system: cascaded from POST /orders/{orderId}/cancel"
        actor: system
        preconditions:
          - "payment_status == AUTHORIZED"
        side_effects: []

  # ---- Order: fulfillment_status dimension (parallel with payment_status) ----
  - entity: Order
    initial_state: PENDING
    terminal_states: [RETURNED, CANCELLED]
    note: "Fulfillment dimension. Evolves independently of payment_status (parallel state)."
    transitions:
      - from: PENDING
        to: RESERVED
        trigger: "POST /orders/{orderId}/reserve"
        actor: StoreManager
        preconditions:
          - "fulfillment_status == PENDING"
          - "For every line: Product.available_units >= line.quantity (else ERR_INSUFFICIENT_STOCK)"
        side_effects:
          - "For every line: Product.stock_reserved += line.quantity (Product.available_units decreases)"
      - from: RESERVED
        to: FULFILLED
        trigger: "POST /orders/{orderId}/fulfill"
        actor: StoreManager
        preconditions:
          - "fulfillment_status == RESERVED"
          - "payment_status == PAID (else ERR_PAYMENT_NOT_CAPTURED)"
        side_effects:
          - "CASCADE B link2: for every line Product.stock_reserved -= quantity AND Product.stock_on_hand -= quantity"
          - "CASCADE B link3: for every Product now at stock_on_hand == 0, Product.availability recomputes to OUT_OF_STOCK"
          - "final_total_cents recomputed (calc order_pricing, variant final)"
          - "settled_points = loyalty_points_earned(variant settled) added to Member.loyalty_points_balance; each OrderLine.line_points_earned recorded"
          - "For each SHOE line: create one RunningShoe per unit (ACTIVE, total_mileage_miles=0, retirement_threshold_miles = Product.mileage_life_miles, source_order_id = this order)"
          - "Member.tier_qualifying_spend_cents += net_paid_cents; Member.loyalty_tier recomputed"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: Member
        preconditions:
          - "fulfillment_status IN {PENDING, RESERVED}"
        side_effects:
          - "If was RESERVED: for every line Product.stock_reserved -= quantity (release; Product.available_units restored) — RULE 9 inventory invariant"
          - "If redeemed_points > 0: Member.loyalty_points_balance += redeemed_points (redeem reversal) — RULE 9 loyalty invariant"
          - "payment_status cascades to REFUNDED if it was AUTHORIZED or PAID"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: Member
        preconditions:
          - "fulfillment_status IN {PENDING, RESERVED}"
        side_effects:
          - "for every line Product.stock_reserved -= quantity (release) — RULE 9 inventory invariant"
          - "If redeemed_points > 0: Member.loyalty_points_balance += redeemed_points (redeem reversal) — RULE 9 loyalty invariant"
          - "payment_status cascades to REFUNDED if it was AUTHORIZED or PAID"
      - from: FULFILLED
        to: RETURNED
        trigger: "system: cascaded from POST /returns/{returnId}/approve"
        actor: system
        preconditions:
          - "fulfillment_status == FULFILLED"
        side_effects:
          - "CASCADE A link2: payment_status cascades to REFUNDED; net_paid_cents -= returned line net"
          - "CASCADE A link3: Member.loyalty_points_balance -= returned OrderLine.line_points_earned (earn reversal)"
          - "CASCADE A link4: Member.tier_qualifying_spend_cents -= returned line net; Member.loyalty_tier recomputed"

  # ---- WearReturn: branching + reject→resubmit revert cycle (non-linear) ----
  - entity: WearReturn
    initial_state: REQUESTED
    terminal_states: [APPROVED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: UNDER_INSPECTION
        trigger: "POST /returns/{returnId}/start-inspection"
        actor: StoreManager
        preconditions:
          - "status == REQUESTED"
        side_effects: []
      - from: UNDER_INSPECTION
        to: APPROVED
        trigger: "POST /returns/{returnId}/approve"
        actor: StoreManager
        preconditions:
          - "status == UNDER_INSPECTION"
        side_effects:
          - "CASCADE A link1: WearReturn.status = APPROVED; OrderLine.is_returned = true"
          - "CASCADE A link2: linked Order (via order_line_id -> OrderLine.order_id) fulfillment_status -> RETURNED and payment_status -> REFUNDED"
          - "then link3/link4 fire on Member (see Order FULFILLED->RETURNED side_effects)"
      - from: UNDER_INSPECTION
        to: REJECTED
        trigger: "POST /returns/{returnId}/reject"
        actor: StoreManager
        preconditions:
          - "status == UNDER_INSPECTION"
        side_effects:
          - "inspection_notes recorded; no order/inventory/loyalty effects"
      - from: REJECTED
        to: REQUESTED
        trigger: "POST /returns/{returnId}/resubmit"
        actor: Member
        preconditions:
          - "status == REJECTED"
        side_effects: []
        note: "Revert/cycle edge: rejected return re-enters the queue for a fresh inspection."
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /returns/{returnId}/withdraw"
        actor: Member
        preconditions:
          - "status == REQUESTED"
        side_effects: []
      - from: REJECTED
        to: WITHDRAWN
        trigger: "POST /returns/{returnId}/withdraw"
        actor: Member
        preconditions:
          - "status == REJECTED"
        side_effects: []

  # ---- FitmentSession: branching (cancel / no-show) ----
  - entity: FitmentSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /fitment-sessions/{sessionId}/check-in"
        actor: Fitter
        preconditions:
          - "status == SCHEDULED"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /fitment-sessions/{sessionId}/complete"
        actor: Fitter
        preconditions:
          - "status == CHECKED_IN"
        side_effects:
          - "recommended_product_id and notes recorded (gait-analysis outcome)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fitment-sessions/{sessionId}/cancel"
        actor: Member
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "Fitter time slot freed (no longer counts toward fitter-overlap checks)"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /fitment-sessions/{sessionId}/cancel"
        actor: Fitter
        preconditions:
          - "status == CHECKED_IN"
        side_effects: []

  # ---- RunningShoe: mileage-threshold reminder (rate/threshold trigger) ----
  - entity: RunningShoe
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIREMENT_DUE
        trigger: "system: during POST /running-shoes/{shoeId}/log-mileage when total_mileage_miles >= retirement_threshold_miles"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "total_mileage_miles >= retirement_threshold_miles (>=, inclusive boundary)"
        side_effects:
          - "mileage-reminder raised (shoe flagged for rotation replacement)"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /running-shoes/{shoeId}/retire"
        actor: Member
        preconditions:
          - "status IN {ACTIVE, RETIREMENT_DUE}"
        side_effects: []
      - from: RETIREMENT_DUE
        to: RETIRED
        trigger: "POST /running-shoes/{shoeId}/retire"
        actor: Member
        preconditions:
          - "status IN {ACTIVE, RETIREMENT_DUE}"
        side_effects: []

  # ---- Subscription: past-due revert cycle (non-linear) ----
  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /subscriptions/{subscriptionId}/mark-past-due"
        actor: StoreManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "discount_pct effectively 0 while PAST_DUE (subscription no longer discounts orders)"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /subscriptions/{subscriptionId}/reactivate"
        actor: Member
        preconditions:
          - "status == PAST_DUE"
        side_effects: []
        note: "Revert/cycle edge: dues paid, subscription resumes."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{subscriptionId}/cancel"
        actor: Member
        preconditions:
          - "status == ACTIVE"
        side_effects: []
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /subscriptions/{subscriptionId}/cancel"
        actor: Member
        preconditions:
          - "status == PAST_DUE"
        side_effects: []

  # ---- TrainingBooking: waitlist promotion (bubble-up cascade) ----
  - entity: TrainingBooking
    initial_state: BOOKED
    terminal_states: [CANCELLED, ATTENDED, NO_SHOW]
    note: "initial_state is BOOKED when the session has a free slot, else the booking is created directly in WAITLISTED."
    transitions:
      - from: WAITLISTED
        to: BOOKED
        trigger: "system: cascaded when a BOOKED booking on the same session is cancelled (waitlist promotion)"
        actor: system
        preconditions:
          - "A slot became free on the session (available_slots increased above 0)"
          - "This booking is the earliest WAITLISTED booking on the session by created_at ASC"
        side_effects:
          - "TrainingSession.booked_count += 1; waitlist_position cleared"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /training-bookings/{bookingId}/cancel"
        actor: Member
        preconditions:
          - "status IN {BOOKED, WAITLISTED}"
        side_effects:
          - "CASCADE B (training) link1: booking CANCELLED"
          - "CASCADE B (training) link2: TrainingSession.booked_count -= 1 (a slot frees; available_slots increases)"
          - "CASCADE B (training) link3: the earliest WAITLISTED booking on the session is promoted WAITLISTED -> BOOKED"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /training-bookings/{bookingId}/cancel"
        actor: Member
        preconditions:
          - "status IN {BOOKED, WAITLISTED}"
        side_effects:
          - "No slot frees (a waitlisted booking held no slot); remaining waitlist positions recompute"
      - from: BOOKED
        to: ATTENDED
        trigger: "POST /training-bookings/{bookingId}/mark-attended"
        actor: Fitter
        preconditions:
          - "status == BOOKED"
        side_effects: []
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /training-bookings/{bookingId}/mark-attended with attended=false is not supported; NO_SHOW is set by system after session end for unattended BOOKED bookings"
        actor: system
        preconditions:
          - "status == BOOKED"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: price-override-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{orderId}/price-overrides"
    occ_field: "expected_order_version"
    description: |
      Applying a manager price override to an Order whose version has advanced
      since the client last observed it is rejected. A new override legitimately
      supersedes any prior override (product policy permits re-overriding), so a
      second create against the same last-seen version would otherwise succeed
      and silently overwrite an intervening override; OCC on Order.version
      reduces this to a stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: inventory_available
    trigger: "any change to Product.stock_on_hand or Product.stock_reserved"
    algorithm: aggregation
    formula: |
      available_units = stock_on_hand - stock_reserved
      availability    = "IN_STOCK" if stock_on_hand > 0 else "OUT_OF_STOCK"
    precision: "integer units"

  - name: effective_discount
    trigger: "order pricing (at POST /orders creation and at fulfillment)"
    algorithm: threshold
    input_set: "member's ACTIVE Subscription plan discount, member's loyalty_tier discount, order promo_code, order subtotal_cents"
    formula: |
      # RULE 2 mode (a): >=3 inputs, nested min, conditional branch on subtotal.
      sub_pct     = SUBSCRIPTION_DISCOUNT_PCT[member.active_subscription.plan] if an ACTIVE subscription exists else 0.0
      loyalty_pct = LOYALTY_TIER_DISCOUNT_PCT[member.loyalty_tier]
      promo_pct   = PROMO_CODES[order.promo_code] if order.promo_code in PROMO_CODES else 0.0
      base    = sub_pct + loyalty_pct
      capped  = min(base, MAX_STACK_DISCOUNT_PCT)                 # 0.30 cap on stacked member discounts
      if promo_pct > 0 and subtotal_cents >= PROMO_MIN_SUBTOTAL_CENTS:
        discount_pct_applied = min(capped + promo_pct, MAX_TOTAL_DISCOUNT_PCT)   # 0.40 hard ceiling
      else:
        discount_pct_applied = capped
    constants:
      SUBSCRIPTION_DISCOUNT_PCT: { BASIC: 0.05, PLUS: 0.10, ELITE: 0.15 }
      LOYALTY_TIER_DISCOUNT_PCT: { STANDARD: 0.00, SILVER: 0.05, GOLD: 0.10 }
      PROMO_CODES: { WELCOME10: 0.10, SPRING15: 0.15 }
      MAX_STACK_DISCOUNT_PCT: 0.12
      MAX_TOTAL_DISCOUNT_PCT: 0.20
      PROMO_MIN_SUBTOTAL_CENTS: 5000
    precision: "discount_pct_applied is an exact fraction; see order_pricing for cents rounding"

  - name: order_pricing
    trigger: "at POST /orders (variant provisional); at POST /orders/{id}/fulfill and capture-payment (variant final)"
    algorithm: aggregation
    input_set: "all OrderLines of the order; discount_pct_applied from effective_discount; redeemed_points"
    formula: |
      subtotal_cents = sum(line.unit_price_cents * line.quantity for each OrderLine)   # per line then sum
      if price_override_discount_cents is set:
        discount_cents = price_override_discount_cents
      else:
        discount_cents = round_half_up(subtotal_cents * discount_pct_applied)          # single rounding on subtotal
      subtotal_after_discount = subtotal_cents - discount_cents
      redemption_cents = redeemed_points * LOYALTY_POINT_VALUE_CENTS
      shipping_fee_cents = 0 if subtotal_after_discount >= FREE_SHIP_THRESHOLD_CENTS else SHIPPING_FEE_CENTS
      total = subtotal_after_discount - redemption_cents + shipping_fee_cents
      # Evaluation order is fixed: subtotal -> discount -> subtotal_after_discount -> shipping (keyed on
      # subtotal_after_discount, NOT on total) -> subtract redemption -> total.
    constants:
      LOYALTY_POINT_VALUE_CENTS: 1
      FREE_SHIP_THRESHOLD_CENTS: 7500
      SHIPPING_FEE_CENTS: 599
    precision: "cents, round_half_up"
    variants:
      - name: provisional
        when: "computed at order creation; written to provisional_total_cents"
        difference: "redeemed_points forced to 0 (no redemption yet); discount uses member tier/subscription as of creation"
      - name: final
        when: "computed at fulfillment/capture; written to final_total_cents and net_paid_cents"
        difference: "redeemed_points included; discount uses member tier/subscription as of fulfillment (may differ from provisional)"

  - name: loyalty_points_earned
    trigger: "at POST /orders (variant estimated); at POST /orders/{id}/fulfill (variant settled)"
    algorithm: weighted_scoring
    input_set: "all OrderLines; member.loyalty_tier for tier multiplier"
    formula: |
      # RULE 2 mode (b): rounding order is pinned as ROUND-PER-LINE-THEN-SUM.
      tm = TIER_MULTIPLIER[member.loyalty_tier]
      for each line:
        line_points_earned = round_half_up( (line.unit_price_cents * line.quantity / 100.0) * POINTS_PER_DOLLAR * tm )
      points = sum(line_points_earned over the included lines)
      # NOT sum(dollars)*rate rounded once — per-line rounding then summation is authoritative.
    constants:
      POINTS_PER_DOLLAR: 10
      TIER_MULTIPLIER: { STANDARD: 1.0, SILVER: 1.25, GOLD: 1.5 }
    precision: "integer points, round_half_up per line"
    variants:
      - name: estimated
        when: "at order creation; written to Order.estimated_points_earned"
        difference: "includes every OrderLine; tier as of creation"
      - name: settled
        when: "at fulfillment; added to Member.loyalty_points_balance"
        difference: "includes only lines that are NOT is_returned; tier as of fulfillment. After a return is approved, the returned line's points are reversed, so net earned diverges from estimated."

  - name: loyalty_tier
    trigger: "any change to Member.tier_qualifying_spend_cents (fulfillment credit or return debit)"
    algorithm: threshold
    input_set: "Member.tier_qualifying_spend_cents (trailing-365-day settled net spend)"
    formula: |
      if tier_qualifying_spend_cents >= TIER_GOLD_MIN_CENTS:      loyalty_tier = "GOLD"
      elif tier_qualifying_spend_cents >= TIER_SILVER_MIN_CENTS:  loyalty_tier = "SILVER"
      else:                                                       loyalty_tier = "STANDARD"
    constants:
      TIER_SILVER_MIN_CENTS: 50000
      TIER_GOLD_MIN_CENTS: 150000
    precision: "exact cents comparison (>= inclusive)"

  - name: shoe_mileage_retirement
    trigger: "POST /running-shoes/{shoeId}/log-mileage"
    algorithm: threshold
    formula: |
      total_mileage_miles += miles
      if status == ACTIVE and total_mileage_miles >= retirement_threshold_miles:   # >= inclusive
        status = RETIREMENT_DUE   # mileage-reminder
    precision: "integer miles, >= boundary"

  - name: training_available_slots
    trigger: "any change to a session's BOOKED booking count"
    algorithm: aggregation
    formula: |
      booked_count    = count(TrainingBooking where session_id == session.id and status == BOOKED)
      available_slots = capacity - booked_count
      # A create is BOOKED when available_slots > 0 at request time, else WAITLISTED.
      # Waitlist order is created_at ASC (never id).
    precision: "integer slots"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /members"

  - priority: 2
    category: auth
    check: "Role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints referencing a resource id"

  - priority: 4
    category: business_referential
    check: "entity_backed caller (Member/Fitter) owns the targeted resource (X-User-ID == resource owner FK); StoreManager exempt"
    error_id: ERR_OWNERSHIP_FORBIDDEN
    http_status: 403
    applies_to: "Member/Fitter-scoped mutations on owned resources"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, quantity>=1, scheduled_end>scheduled_start; an order must have >=1 line"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST/PUT with a body"
    note: "Empty-order (zero lines) raises ERR_EMPTY_ORDER (422) specifically."

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: "ERR_INVALID_STATE | ERR_ORDER_NOT_MODIFIABLE | ERR_RETURN_NOT_INSPECTABLE | ERR_PAYMENT_NOT_CAPTURED | ERR_SHOE_ALREADY_RETIRED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_temporal
    check: "Time-window rules: appointment not in the past; resource temporal-overlap (member schedule half-open; fitter buffer = SERVICE_BUFFER_MINUTES = 15 minutes); race packet within pickup window"
    error_id: "ERR_APPOINTMENT_IN_PAST | ERR_SCHEDULE_CONFLICT | ERR_FITTER_UNAVAILABLE"
    http_status: 409
    applies_to: "POST /fitment-sessions, POST /training-bookings"
    note: "ERR_APPOINTMENT_IN_PAST is 422; overlap conflicts are 409."

  - priority: 8
    category: business_referential
    check: "Cross-entity preconditions: TrainingBooking requires member has an ACTIVE Subscription; WearReturn requires the linked Order is FULFILLED"
    error_id: "ERR_SUBSCRIPTION_REQUIRED | ERR_ORDER_NOT_FULFILLED"
    http_status: 409
    applies_to: "POST /training-bookings, POST /returns"

  - priority: 9
    category: business_constraint
    check: "Stock constraint: product stock insufficient for reserve. (A full training session is NOT an error — it routes the booking to WAITLISTED.)"
    error_id: "ERR_INSUFFICIENT_STOCK"
    http_status: 409
    applies_to: "POST /orders/{id}/reserve"

  - priority: 10
    category: business_fiscal
    check: "Loyalty redemption fiscal rules: sufficient points; redemption a multiple of 100 and <= 50% of subtotal_after_discount"
    error_id: "ERR_INSUFFICIENT_POINTS | ERR_REDEMPTION_EXCEEDS_CAP"
    http_status: "402 | 422"
    applies_to: "POST /orders/{id}/apply-redemption"

  - priority: 11
    category: state
    check: "OCC: expected_order_version matches current Order.version on price override"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/price-overrides"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default (never wall-clock)."
    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced to to_iso8601"]

  # ---- Member ----
  - method: POST
    path: "/members"
    description: "Register a new member (loyalty_points_balance=0, loyalty_tier=STANDARD, status=ACTIVE)"
    roles: [Anonymous, StoreManager]
    code: 201
    input: [email, full_name, state_code]
    output: Member
    side_effects: ["loyalty_points_balance=0, tier_qualifying_spend_cents=0, loyalty_tier=STANDARD"]
  - method: GET
    path: "/members/{memberId}"
    description: "Fetch a member"
    roles: [Member, Fitter, StoreManager]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: "/members/{memberId}/loyalty-adjustments"
    description: "Manager grants or deducts loyalty points (goodwill / correction). Returns the member with the new balance."
    roles: [StoreManager]
    code: 200
    input: [points_delta, reason]
    output: Member
    side_effects: ["Member.loyalty_points_balance += points_delta (floored at 0)"]

  # ---- Product ----
  - method: POST
    path: "/products"
    description: "Create a catalog product"
    roles: [StoreManager]
    code: 201
    input: [sku, name, category, unit_price_cents, "mileage_life_miles?", "initial_stock?"]
    output: Product
    side_effects: ["stock_on_hand=initial_stock or 0; stock_reserved=0; availability recomputed"]
  - method: GET
    path: "/products/{productId}"
    description: "Fetch a product"
    roles: [Anonymous, Member, Fitter, StoreManager]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: GET
    path: "/products"
    description: "List products"
    roles: [Anonymous, Member, Fitter, StoreManager]
    code: 200
    input: ["category?"]
    output: Product[]
    side_effects: []
  - method: POST
    path: "/products/{productId}/restock"
    description: "Add units to stock_on_hand"
    roles: [StoreManager]
    code: 200
    input: [quantity]
    output: Product
    side_effects: ["stock_on_hand += quantity; availability recomputed"]

  # ---- Order ----
  - method: POST
    path: "/orders"
    description: "Create an order with >=1 line. Computes provisional pricing and estimated points. Snapshots each line's unit_price_cents from the product."
    roles: [Member, StoreManager]
    code: 201
    input: [member_id, lines, "promo_code?"]
    output: Order
    side_effects:
      - "create one OrderLine per lines[] entry (order_id set, unit_price_cents snapshot)"
      - "compute subtotal_cents, discount_pct_applied, discount_cents, shipping_fee_cents, provisional_total_cents (variant provisional)"
      - "compute estimated_points_earned (variant estimated) and each OrderLine.line_points_earned"
  - method: GET
    path: "/orders/{orderId}"
    description: "Fetch an order"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders (filter by member_id) — reverse-reachability for Order.member_id"
    roles: [Member, StoreManager]
    code: 200
    input: ["member_id?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{orderId}/apply-redemption"
    description: "Apply loyalty points to an UNPAID order. Debits Member.loyalty_points_balance immediately."
    roles: [Member, StoreManager]
    code: 200
    input: [points_to_redeem]
    output: Order
    side_effects:
      - "redeemed_points = points_to_redeem; redemption_cents recomputed"
      - "Member.loyalty_points_balance -= points_to_redeem (redeem debit — RULE 9 loyalty invariant)"
  - method: POST
    path: "/orders/{orderId}/authorize-payment"
    description: "Authorize payment (UNPAID -> AUTHORIZED)"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status -> AUTHORIZED"]
  - method: POST
    path: "/orders/{orderId}/capture-payment"
    description: "Capture payment (AUTHORIZED -> PAID); computes final_total_cents and net_paid_cents"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status -> PAID; final_total_cents and net_paid_cents set (variant final)"]
  - method: POST
    path: "/orders/{orderId}/reserve"
    description: "Reserve inventory (fulfillment PENDING -> RESERVED)"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects: ["for each line Product.stock_reserved += quantity; available_units decreases"]
  - method: POST
    path: "/orders/{orderId}/fulfill"
    description: "Fulfill a reserved, paid order (fulfillment RESERVED -> FULFILLED). Cascade B trigger."
    roles: [StoreManager]
    code: 200
    input: []
    output: Order
    side_effects:
      - "for each line stock_reserved -= quantity, stock_on_hand -= quantity; availability recomputed (Cascade B)"
      - "settle loyalty points to Member.loyalty_points_balance; record OrderLine.line_points_earned"
      - "create RunningShoe per SHOE unit; Member.tier_qualifying_spend_cents += net_paid_cents; loyalty_tier recomputed"
  - method: POST
    path: "/orders/{orderId}/cancel"
    description: "Cancel an order (fulfillment PENDING/RESERVED -> CANCELLED). Releases reservations and reverses redemption."
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects:
      - "release reservations (stock_reserved -= quantity) if RESERVED — RULE 9 inventory invariant"
      - "Member.loyalty_points_balance += redeemed_points (redeem reversal) — RULE 9 loyalty invariant"
      - "payment_status -> REFUNDED if it was AUTHORIZED/PAID"
  - method: POST
    path: "/orders/{orderId}/price-overrides"
    description: "Manager applies a discount override that supersedes any prior override. OCC-guarded on Order.version."
    roles: [StoreManager]
    code: 200
    input: [expected_order_version, override_discount_cents]
    output: Order
    side_effects:
      - "price_override_discount_cents = override_discount_cents; totals recomputed"
      - "increments Order.version by 1"

  # ---- OrderLine (reverse-reachability for order_id and product_id) ----
  - method: GET
    path: "/order-lines/{lineId}"
    description: "Fetch a single order line"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/order-lines"
    description: "List order lines (filter by order_id and/or product_id) — reverse-reachability for OrderLine FKs"
    roles: [Member, StoreManager]
    code: 200
    input: ["order_id?", "product_id?"]
    output: OrderLine[]
    side_effects: []

  # ---- WearReturn ----
  - method: POST
    path: "/returns"
    description: "Open a wear/return request against a fulfilled order line"
    roles: [Member, StoreManager]
    code: 201
    input: [order_line_id, reason, "wear_days?"]
    output: WearReturn
    side_effects: ["status=REQUESTED; member_id copied from line's order"]
  - method: GET
    path: "/returns/{returnId}"
    description: "Fetch a return"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: WearReturn
    side_effects: []
  - method: GET
    path: "/returns"
    description: "List returns (filter by order_line_id and/or member_id) — reverse-reachability for WearReturn FKs"
    roles: [Member, StoreManager]
    code: 200
    input: ["order_line_id?", "member_id?"]
    output: WearReturn[]
    side_effects: []
  - method: POST
    path: "/returns/{returnId}/start-inspection"
    description: "Begin inspection (REQUESTED -> UNDER_INSPECTION)"
    roles: [StoreManager]
    code: 200
    input: []
    output: WearReturn
    side_effects: ["status -> UNDER_INSPECTION"]
  - method: POST
    path: "/returns/{returnId}/approve"
    description: "Approve a return (UNDER_INSPECTION -> APPROVED). Cascade A trigger."
    roles: [StoreManager]
    code: 200
    input: []
    output: WearReturn
    side_effects:
      - "OrderLine.is_returned=true; linked Order fulfillment -> RETURNED, payment -> REFUNDED"
      - "Member loyalty earn reversal; tier_qualifying_spend_cents debit; loyalty_tier recomputed"
  - method: POST
    path: "/returns/{returnId}/reject"
    description: "Reject a return (UNDER_INSPECTION -> REJECTED)"
    roles: [StoreManager]
    code: 200
    input: ["reason?"]
    output: WearReturn
    side_effects: ["status -> REJECTED; inspection_notes recorded"]
  - method: POST
    path: "/returns/{returnId}/resubmit"
    description: "Resubmit a rejected return (REJECTED -> REQUESTED)"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: WearReturn
    side_effects: ["status -> REQUESTED"]
  - method: POST
    path: "/returns/{returnId}/withdraw"
    description: "Withdraw a return (REQUESTED/REJECTED -> WITHDRAWN)"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: WearReturn
    side_effects: ["status -> WITHDRAWN"]

  # ---- Subscription ----
  - method: POST
    path: "/subscriptions"
    description: "Create a club subscription for a member (status ACTIVE)"
    roles: [Member, StoreManager]
    code: 201
    input: [member_id, plan]
    output: Subscription
    side_effects: ["status=ACTIVE; discount_pct from plan"]
  - method: GET
    path: "/subscriptions/{subscriptionId}"
    description: "Fetch a subscription"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "List subscriptions (filter by member_id) — reverse-reachability for Subscription.member_id"
    roles: [Member, StoreManager]
    code: 200
    input: ["member_id?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{subscriptionId}/mark-past-due"
    description: "Mark subscription past-due (ACTIVE -> PAST_DUE)"
    roles: [StoreManager]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status -> PAST_DUE"]
  - method: POST
    path: "/subscriptions/{subscriptionId}/reactivate"
    description: "Reactivate a past-due subscription (PAST_DUE -> ACTIVE)"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/subscriptions/{subscriptionId}/cancel"
    description: "Cancel a subscription (ACTIVE/PAST_DUE -> CANCELLED)"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status -> CANCELLED"]

  # ---- RunningShoe (created by fulfill; no POST create) ----
  - method: GET
    path: "/running-shoes/{shoeId}"
    description: "Fetch a running shoe"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: RunningShoe
    side_effects: []
  - method: GET
    path: "/running-shoes"
    description: "List running shoes (filter by member_id, product_id, source_order_id) — reverse-reachability for RunningShoe FKs"
    roles: [Member, StoreManager]
    code: 200
    input: ["member_id?", "product_id?", "source_order_id?"]
    output: RunningShoe[]
    side_effects: []
  - method: POST
    path: "/running-shoes/{shoeId}/log-mileage"
    description: "Log miles run in this shoe; triggers RETIREMENT_DUE at the mileage threshold"
    roles: [Member, StoreManager]
    code: 200
    input: [miles]
    output: RunningShoe
    side_effects: ["total_mileage_miles += miles; ACTIVE -> RETIREMENT_DUE when >= retirement_threshold_miles"]
  - method: POST
    path: "/running-shoes/{shoeId}/retire"
    description: "Retire a shoe (ACTIVE/RETIREMENT_DUE -> RETIRED)"
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: RunningShoe
    side_effects: ["status -> RETIRED"]

  # ---- Fitter ----
  - method: POST
    path: "/fitters"
    description: "Create a fitter (staff)"
    roles: [StoreManager]
    code: 201
    input: [full_name]
    output: Fitter
    side_effects: ["is_active=true"]
  - method: GET
    path: "/fitters/{fitterId}"
    description: "Fetch a fitter"
    roles: [Anonymous, Member, Fitter, StoreManager]
    code: 200
    input: []
    output: Fitter
    side_effects: []

  # ---- FitmentSession ----
  - method: POST
    path: "/fitment-sessions"
    description: "Book a gait-analysis/fitment appointment. Rejects if start in the past, if the fitter's schedule (with a SERVICE_BUFFER_MINUTES = 15-minute buffer between sessions) conflicts, or if the member's own schedule (half-open) conflicts."
    roles: [Member, StoreManager]
    code: 201
    input: [member_id, fitter_id, scheduled_start, scheduled_end]
    output: FitmentSession
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/fitment-sessions/{sessionId}"
    description: "Fetch a fitment session"
    roles: [Member, Fitter, StoreManager]
    code: 200
    input: []
    output: FitmentSession
    side_effects: []
  - method: GET
    path: "/fitment-sessions"
    description: "List fitment sessions (filter by member_id, fitter_id, recommended_product_id) — reverse-reachability for FitmentSession FKs"
    roles: [Member, Fitter, StoreManager]
    code: 200
    input: ["member_id?", "fitter_id?", "recommended_product_id?"]
    output: FitmentSession[]
    side_effects: []
  - method: POST
    path: "/fitment-sessions/{sessionId}/check-in"
    description: "Fitter checks the member in (SCHEDULED -> CHECKED_IN)"
    roles: [Fitter, StoreManager]
    code: 200
    input: []
    output: FitmentSession
    side_effects: ["status -> CHECKED_IN"]
  - method: POST
    path: "/fitment-sessions/{sessionId}/complete"
    description: "Complete the session and record the recommended shoe (CHECKED_IN -> COMPLETED)"
    roles: [Fitter, StoreManager]
    code: 200
    input: ["recommended_product_id?", "notes?"]
    output: FitmentSession
    side_effects: ["status -> COMPLETED; recommended_product_id, notes recorded"]
  - method: POST
    path: "/fitment-sessions/{sessionId}/cancel"
    description: "Cancel a fitment session (SCHEDULED/CHECKED_IN -> CANCELLED)"
    roles: [Member, Fitter, StoreManager]
    code: 200
    input: []
    output: FitmentSession
    side_effects: ["status -> CANCELLED; fitter slot freed"]

  # ---- TrainingSession ----
  - method: POST
    path: "/training-sessions"
    description: "Create a training-group session with capacity"
    roles: [Fitter, StoreManager]
    code: 201
    input: [title, start_time, end_time, capacity, "fitter_id?"]
    output: TrainingSession
    side_effects: ["booked_count=0; available_slots=capacity"]
  - method: GET
    path: "/training-sessions/{sessionId}"
    description: "Fetch a training session"
    roles: [Anonymous, Member, Fitter, StoreManager]
    code: 200
    input: []
    output: TrainingSession
    side_effects: []
  - method: GET
    path: "/training-sessions"
    description: "List training sessions (filter by fitter_id) — reverse-reachability for TrainingSession.fitter_id"
    roles: [Anonymous, Member, Fitter, StoreManager]
    code: 200
    input: ["fitter_id?"]
    output: TrainingSession[]
    side_effects: []

  # ---- TrainingBooking ----
  - method: POST
    path: "/training-bookings"
    description: "Book a member into a training session. Requires an ACTIVE subscription. Rejects member schedule overlap. Routes to WAITLISTED when the session is full."
    roles: [Member, StoreManager]
    code: 201
    input: [session_id, member_id]
    output: TrainingBooking
    side_effects: ["status=BOOKED if available_slots>0 else WAITLISTED; booked_count updated on BOOKED"]
  - method: GET
    path: "/training-bookings/{bookingId}"
    description: "Fetch a training booking"
    roles: [Member, Fitter, StoreManager]
    code: 200
    input: []
    output: TrainingBooking
    side_effects: []
  - method: GET
    path: "/training-bookings"
    description: "List training bookings (filter by session_id and/or member_id) — reverse-reachability for TrainingBooking FKs"
    roles: [Member, Fitter, StoreManager]
    code: 200
    input: ["session_id?", "member_id?"]
    output: TrainingBooking[]
    side_effects: []
  - method: POST
    path: "/training-bookings/{bookingId}/cancel"
    description: "Cancel a booking (BOOKED/WAITLISTED -> CANCELLED). Promotes the earliest waitlisted booking when a slot frees."
    roles: [Member, StoreManager]
    code: 200
    input: []
    output: TrainingBooking
    side_effects: ["status -> CANCELLED; if a slot frees, promote earliest WAITLISTED booking to BOOKED (Cascade B training)"]
  - method: POST
    path: "/training-bookings/{bookingId}/mark-attended"
    description: "Mark a booking attended (BOOKED -> ATTENDED)"
    roles: [Fitter, StoreManager]
    code: 200
    input: []
    output: TrainingBooking
    side_effects: ["status -> ATTENDED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource (path or body FK) does not exist" }
  - { id: ERR_OWNERSHIP_FORBIDDEN, http: 403, condition: "entity_backed caller is not the owner of the targeted resource" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, quantity<1, or scheduled_end<=scheduled_start" }
  - { id: ERR_EMPTY_ORDER, http: 422, condition: "POST /orders with zero lines" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource is in the wrong state for the requested transition" }
  - { id: ERR_ORDER_NOT_MODIFIABLE, http: 409, condition: "Redemption/price change attempted on an order whose payment_status is not UNPAID" }
  - { id: ERR_PAYMENT_NOT_CAPTURED, http: 409, condition: "Fulfill attempted while payment_status != PAID" }
  - { id: ERR_ORDER_NOT_FULFILLED, http: 409, condition: "Return opened against a line whose order is not FULFILLED" }
  - { id: ERR_RETURN_NOT_INSPECTABLE, http: 409, condition: "start-inspection/approve/reject on a return not in the required state" }
  - { id: ERR_SHOE_ALREADY_RETIRED, http: 409, condition: "log-mileage or retire on a RETIRED shoe" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "Member's own schedule overlaps (half-open) another fitment/training slot" }
  - { id: ERR_FITTER_UNAVAILABLE, http: 409, condition: "Fitter already booked within SERVICE_BUFFER_MINUTES (15 minutes) of the requested window" }
  - { id: ERR_APPOINTMENT_IN_PAST, http: 422, condition: "scheduled_start is before the current logical clock" }
  - { id: ERR_SUBSCRIPTION_REQUIRED, http: 409, condition: "Training booking attempted without an ACTIVE subscription" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Reserve requires more units than Product.available_units" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 402, condition: "Redemption exceeds Member.loyalty_points_balance" }
  - { id: ERR_REDEMPTION_EXCEEDS_CAP, http: 422, condition: "Redeemed points not a multiple of 100, or redemption_cents > 50% of subtotal_after_discount" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version != current Order.version on price override" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "A registered customer acting on their own orders, returns, shoes, subscriptions, fitment appointments and training bookings."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /orders/{id}/apply-redemption (own order)"
      - "POST /returns/{id}/resubmit (own return)"
      - "POST /running-shoes/{id}/log-mileage (own shoe)"
      - "POST /running-shoes/{id}/retire (own shoe)"
    shared_operations:
      - "POST /orders, GET /orders, GET /orders/{id}"
      - "POST /orders/{id}/authorize-payment, capture-payment, reserve, cancel"
      - "POST /returns, POST /returns/{id}/withdraw"
      - "POST /subscriptions, POST /subscriptions/{id}/reactivate, cancel"
      - "POST /fitment-sessions, POST /fitment-sessions/{id}/cancel"
      - "POST /training-bookings, POST /training-bookings/{id}/cancel"
      - "GET on member-owned resources"

  - name: Fitter
    description: "Store staff who run gait-analysis fitment sessions and lead/mark training sessions."
    identity: "entity_backed:Fitter"
    exclusive_operations:
      - "POST /fitment-sessions/{id}/check-in"
      - "POST /fitment-sessions/{id}/complete"
      - "POST /training-bookings/{id}/mark-attended"
    shared_operations:
      - "POST /training-sessions"
      - "POST /fitment-sessions/{id}/cancel"
      - "GET on fitment/training resources"

  - name: StoreManager
    description: "Operational admin. Manages catalog/inventory, payments, fulfillment, returns lifecycle, subscriptions, price overrides, loyalty adjustments, and the logical clock. Superset operator (not owner-restricted)."
    identity: "opaque"
    exclusive_operations:
      - "POST /products, POST /products/{id}/restock"
      - "POST /members/{id}/loyalty-adjustments"
      - "POST /orders/{id}/fulfill"
      - "POST /orders/{id}/price-overrides"
      - "POST /returns/{id}/start-inspection, approve, reject"
      - "POST /subscriptions/{id}/mark-past-due"
      - "POST /fitters"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all Member and Fitter operations (operator override; not owner-restricted)"

  - name: Anonymous
    description: "Unauthenticated caller. May self-register and browse the public catalog/sessions."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /members"
      - "GET /products, GET /products/{id}"
      - "GET /fitters/{id}"
      - "GET /training-sessions, GET /training-sessions/{id}"
