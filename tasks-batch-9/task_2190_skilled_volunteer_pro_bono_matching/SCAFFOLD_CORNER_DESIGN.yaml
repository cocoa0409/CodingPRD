          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_INVALID_REQUEST_STATE\" - not ERR_NO_ELIGIBLE_VOLUNTEER"
            - "GET /project-requests/${req_id} shows status == \"DRAFT\" and failed_match_rounds == 0"
            - "GET /program-cycles/${cycle_id} shows slots_reserved == 0"
      - name: error_no_eligible_volunteer_is_the_last_resort_on_a_scoped_request
        claim_type: error_triggerable
        grounds: ["errors[ERR_NO_ELIGIBLE_VOLUNTEER]", "validations[priority=57]", "endpoints[POST /project-requests/{id}/match]"]
        distinguishing_aspect: "The lowest-priority rule in the whole table: every gate above it passes on a genuinely SCOPED request, and the only remaining fault is an empty pool because the one volunteer is still PENDING_VETTING. The 422 is accompanied by the documented side effect failed_match_rounds += 1 while no MatchOffer is created."
        test_recipe:
          setup: ["A SCOPED request plus one PENDING_VETTING volunteer holding the required TAX_LAW claim."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
            - {call: "POST /volunteers/${vol_id}/skill-profiles", as: Volunteer, as_user_id: "${vol_id}", payload: {skill_code: "TAX_LAW", proficiency: 4, years_experience: 9.0}}
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "${cycle_id}", title: "Annual audit readiness", discipline: ACCOUNTING, required_skill_code: "TAX_LAW", min_proficiency: 3, requested_hours: 40.00, urgency: ROUTINE}, captures: {req_id: "$.data.id"}}
            - {call: "POST /project-requests/${req_id}/submit-for-scoping", as: PartnerContact, as_user_id: "${partner_id}", captures: {req_v: "$.data.version"}}
            - {call: "POST /project-requests/${req_id}/scope-definitions", as: ScopingSpecialist, as_user_id: "spec-1", payload: {expected_project_request_version: "${req_v}", estimated_hours: 40.00, complexity_factor: 1.00, confidentiality_tier: STANDARD, ip_disposition: ASSIGN_TO_PARTNER}, captures: {scope_id: "$.data.id"}}
            - {call: "POST /scope-definitions/${scope_id}/deliverables", as: ScopingSpecialist, as_user_id: "spec-1", payload: {title: "Findings memo", sequence_no: 1, weight_pct: 100.00, hours_estimate: 40.00, acceptance_criteria: "Board-ready memo with cited findings."}}
            - {call: "POST /scope-definitions/${scope_id}/approve", as: PartnerContact, as_user_id: "${partner_id}"}
          trigger:
            - {call: "POST /project-requests/${req_id}/match", as: ScopingSpecialist, as_user_id: "spec-1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_NO_ELIGIBLE_VOLUNTEER\""
            - "GET /project-requests/${req_id} shows failed_match_rounds == 1 and status == \"SCOPED\" (still under MAX_MATCH_ROUNDS)"
            - "GET /match-offers?project_request_id=${req_id} returns total_count == 0"
            - "GET /program-cycles/${cycle_id} shows slots_reserved == 0 and utilization_ratio == 0.0000"
      - name: error_volunteer_not_active_beats_duplicate_skill_profile
        claim_type: error_triggerable
        grounds: ["errors[ERR_VOLUNTEER_NOT_ACTIVE]", "validations[priority=33]", "validations[priority=46]", "endpoints[POST /volunteers/{id}/skill-profiles]"]
        distinguishing_aspect: "A PAUSED volunteer re-claims the very skill_code it already holds, so both the priority-33 liveness rule and the priority-46 uniqueness rule apply: the answer is 409 ERR_VOLUNTEER_NOT_ACTIVE, and the pre-existing TAX_LAW row keeps its original proficiency 4."
        test_recipe:
          setup: ["One volunteer vetted to ACTIVE with a TAX_LAW claim, then paused by the manager."]
          setup_api_calls:
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
            - {call: "POST /volunteers/${vol_id}/skill-profiles", as: Volunteer, as_user_id: "${vol_id}", payload: {skill_code: "TAX_LAW", proficiency: 4, years_experience: 9.0}}
            - {call: "POST /volunteers/${vol_id}/vet", as: ProgramManager, as_user_id: "pm-1", payload: {verify_skill_codes: ["TAX_LAW"]}}
            - {call: "PATCH /volunteers/${vol_id}/status", as: ProgramManager, as_user_id: "pm-1", payload: {to_status: "PAUSED", pause_reason: "Sabbatical"}}
          trigger:
            - {call: "POST /volunteers/${vol_id}/skill-profiles", as: Volunteer, as_user_id: "${vol_id}", payload: {skill_code: "TAX_LAW", proficiency: 5, years_experience: 10.0}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 409"
            - "data.error_id == \"ERR_VOLUNTEER_NOT_ACTIVE\" - not ERR_DUPLICATE_SKILL_PROFILE"
            - "GET /volunteers/${vol_id}/skill-profiles returns total_count == 1 with proficiency == 4 and verified == true"
      - name: error_duplicate_skill_profile_on_second_claim_of_same_code
        claim_type: error_triggerable
        grounds: ["errors[ERR_DUPLICATE_SKILL_PROFILE]", "validations[priority=46]", "endpoints[POST /volunteers/{id}/skill-profiles]"]
        distinguishing_aspect: "The uniqueness key is the (volunteer_id, skill_code) pair and nothing else: an ACTIVE volunteer re-claiming TAX_LAW at a different proficiency and years_experience is still 409 ERR_DUPLICATE_SKILL_PROFILE, while the same volunteer claiming NONPROFIT_FINANCE succeeds."
