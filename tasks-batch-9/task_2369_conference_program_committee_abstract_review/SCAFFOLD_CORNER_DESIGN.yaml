            - "the first slot at ${ses_v0} → HTTP 201; the session's version advances by exactly 1 (${ses_v1} == ${ses_v0} + 1) and slot_count becomes 1"
            - "the second slot replayed at the now-stale ${ses_v0} → HTTP 412 ERR_STALE_SESSION_VERSION"
