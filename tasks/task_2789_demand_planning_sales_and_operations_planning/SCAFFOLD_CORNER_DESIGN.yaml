            - call: "POST /sop/scenarios/${sc99_id}/evaluate"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
          assert:
            - "Before the triggers: SupplyPlan.${plan_id}.gross_requirement_units == 20000, demand_side_units == 20330, available_units == 1000, constrained_units == 1000, shortfall_units == 19330, constraint_type == \"CAPACITY\", and PlanningCycle.${cycle_id}.plan_value_cents == 750000"
            - "Scenario.${sc100_id}: incremental_units == 10000 == min(floor(100*100), 19330), gross_uplift_cents == 7500000, investment_cost_cents == 2500000 == round_half_up(100 * 25000)"
