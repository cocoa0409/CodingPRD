      - name: sponsor_operator_cannot_create_securities
        claim_type: exclusive_operation_denied
        grounds: ["roles.PlatformAdmin", "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /sma/securities is exclusive to PlatformAdmin; a SponsorOperator receives HTTP 403 ERR_FORBIDDEN_ROLE and no Security row is created."
        test_recipe:
          setup: ["Sponsor NRTH exists so the SponsorOperator has a valid identity"]
          setup_api_calls:
            - call: "POST /sma/sponsors"
              payload: { name: "Northline Wealth", platform_code: "NRTH", revenue_share_bps: 3333 }
              as: PlatformAdmin
              captures: { sp1: "$.data.id" }
          trigger:
            - call: "POST /sma/securities"
              payload: { ticker: "ALFA", name: "Alfa Industrials", asset_class: "US_EQUITY", last_price_cents: 10000 }
              as: SponsorOperator
              as_user_id: "${sp1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 403 with error_id ERR_FORBIDDEN_ROLE"
            - "The same request as PlatformAdmin would return 201 — the denial is about the role, not the payload"

