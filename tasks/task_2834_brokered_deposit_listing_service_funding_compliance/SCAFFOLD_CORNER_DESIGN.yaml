              payload: { metric: "BROKERED_TO_TOTAL_DEPOSITS", warning_threshold_bps: 3000, breach_threshold_bps: 2000 }
              as: TreasuryController
              as_user_id: "op_alm"
              captures: { e1: $.data.error_id }
            - call: "POST /institutions/${inst_id}/concentration-limits"
              payload: { metric: "BROKERED_TO_TOTAL_DEPOSITS", warning_threshold_bps: 2000, breach_threshold_bps: 2000 }
              as: TreasuryController
              as_user_id: "op_alm"
              captures: { e2: $.data.error_id }
            - call: "POST /institutions/${inst_id}/contingency-plans"
