              as: ShopAdmin
              captures: { rental_id: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${rental_id}/checkin"
              payload: {}
              as: ShopAdmin
            - call: "GET /divers/${diver_id}"
              payload: {}
              as: ShopAdmin
          assert:
            - "RentalAgreement.${rental_id}.status == RETURNED"
            - "Diver.${diver_id}.deposit_on_hold_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_capacity_on_session_booking
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - state_machines.SessionBooking.BOOKED_to_ATTENDED
        distinguishing_aspect: |
          Pair {state (priority 6) vs business_constraint capacity (priority 12)}:
          booking into a CANCELLED session that is also over capacity must
          return ERR_INVALID_STATE (the session-state check), never
          ERR_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. An OPEN_WATER session (cap 4) that has been CANCELLED. An ACTIVE enrollment with active waiver attempts to book it."
