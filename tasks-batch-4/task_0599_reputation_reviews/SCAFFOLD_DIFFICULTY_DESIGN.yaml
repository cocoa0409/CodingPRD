          assert:
            - "after enqueue: Campaign.${camp}.credits_reserved == 1 and spendable credits (5 - 1 - 0) == 4"
            - "after cancel: ReviewRequest.${req1}.status == SUPPRESSED"
            - "after cancel: Campaign.${camp}.credits_reserved == 0"
            - "after cancel: Campaign.${camp}.credits_consumed == 0"
            - "after cancel: Campaign.${camp}.credits_released == 1"
            - "after cancel: Campaign.credits_allocated - credits_reserved - credits_consumed == 5 (restored exactly)"
            - "GET /reputation/campaigns/${camp}/metrics returns credits_available == 5 and billing_cost == 0.00"
            - "Contact.${c1}.last_requested_at == 2026-05-01T00:00:00.000Z (the cooldown anchor is NOT rolled back)"

      - name: open_escalation_count_conserved_on_negative_ingest_then_flag
        grounds:
          - state_machines.Escalation.OPEN_to_CANCELLED
          - state_machines.Review.UNVERIFIED_to_FLAGGED
          - entities.Location.fields.open_escalation_count
          - calculations.review_sentiment
        distinguishing_aspect: |
          Conserved quantity = the OPEN-ESCALATION COUNTER, pinned as
          `Location.open_escalation_count == count(Escalation e : e.review.location_id == L and e.state IN {OPEN, ACKNOWLEDGED})`.
          A different kind of quantity from campaign credits: ingesting a 1-star review opens one escalation
          (counter 1) and flagging the review cancels it (counter back to 0) with the derived score returning
          to its pre-ingest 15.00 — no drift in either the counter or the score.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01T00:00:00Z; Location with three CONNECTED NAP-matched listings -> listing_health_score 100.00."
            - "No reviews yet: review_count 0, open_escalation_count 0, reputation_score_provisional 15.00, posture OPEN."
            - "One 1-star review is ingested -> sentiment NEGATIVE -> one Escalation OPEN, open_escalation_count 1."
          setup_api_calls:
            - call: "POST /reputation/businesses"
              payload: { name: "Acme Dental Group" }
              as: PlatformAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /reputation/businesses/${biz_id}/locations"
              payload: { name: "Acme Downtown", nap_name: "Acme Dental", nap_address: "1 Main St", nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "GOOGLE", external_listing_id: "g-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_g: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "YELP", external_listing_id: "y-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_y: $.data.id }
            - call: "POST /reputation/locations/${loc_id}/listings"
              payload: { site: "FACEBOOK", external_listing_id: "f-1", listed_nap_name: "Acme Dental", listed_nap_address: "1 Main St", listed_nap_phone: "+15551110000" }
              as: PlatformAdmin
              captures: { lst_f: $.data.id }
            - call: "POST /reputation/listings/${lst_g}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_y}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/listings/${lst_f}/sync"
              payload: { outcome: "SUCCESS" }
              as: PlatformAdmin
            - call: "POST /reputation/locations/${loc_id}/reviews"
              payload: { site: "GOOGLE", external_review_id: "g-r1", author_name: "Angry Ann", rating: 1, text: "Terrible", posted_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { rev: $.data.id }
            - call: "GET /reputation/reviews/${rev}/escalations"
              payload: {}
              as: PlatformAdmin
              captures: { esc: "$.data[0].id" }
          trigger:
            - call: "POST /reputation/reviews/${rev}/flag"
              payload: { reason: "Fake review from a competitor" }
              as: PlatformAdmin
              captures: { mod: $.data.moderation_state }
          assert:
            - "before the trigger: Location.${loc_id}.open_escalation_count == 1 and reputation_score_provisional == 27.00"
            - "Review.${rev}.moderation_state == FLAGGED"
            - "Review.${rev}.sentiment == NEGATIVE (assigned at ingest, never recomputed)"
            - "Escalation.${esc}.state == CANCELLED"
            - "Location.${loc_id}.open_escalation_count == 0"
            - "Location.${loc_id}.review_count == 0"
            - "Location.${loc_id}.avg_rating == 0.00"
            - "Location.${loc_id}.sentiment_negative_count == 0"
            - "Location.${loc_id}.reputation_score_provisional == 15.00 (exactly the pre-ingest value; no drift)"
            - "Location.${loc_id}.posture == OPEN"
