            - "sum_root_cause is NOT KYC_FRICTION, which is what a lexicographic-first tie-break would return"
            - "c_close_status == CLOSED and sum_last_cycle == 1"

      - name: clawback_restores_all_four_conserved_settlement_terms_to_their_pre_funding_values
        claim_type: Correct Result
        grounds:
          - calculations.settlement_conservation_invariant
          - state_machines.SettlementBatch.transitions.funding_status=FUNDED_to_funding_status=CLAWED_BACK
          - endpoints.POST_/oversight/settlement-batches/{id}/clawback
        distinguishing_aspect: "Clawback is term-by-term compensating, not merely sum-preserving: it books one CLAWBACK LedgerEntry per funding leg with reversal_of_entry_id pointing at the leg it reverses and the amount negated, so all four of fbo.balance_cents, reserve.balance_cents, cumulative_paid_out_cents and cumulative_bank_fee_cents individually return to their pre-fund values — while bank_fee_cents, reserve_funding_cents, net_to_partner_cents and funded_at stay on the row as the historical record."
        test_recipe:
          setup:
            - "Partner A LIVE, FBO 8100000, RESERVE 506250, cumulative counters at 0. One MATCHED batch with gross 8000000, interchange 200000, returns 100000."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
            - *q_res_a_read
            - *q_res_fund_312500
            - *q_go_live_a
            - *q_fbo_a_read
            - *q_fbo_seed_8100000
            - *q_res_a_read2
            - *q_res_top_193750
            - *q_batch_1
            - call: "POST /oversight/settlement-batches/${b1_id}/reconcile"
              payload: { bank_reported_net_cents: 8100000 }
              as: InternalAudit
              as_user_id: "ia-erin"
            - call: "POST /oversight/settlement-batches/${b1_id}/fund"
              payload: { funding_reference: "WIRE-2026-08-0001" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { f_fee: $.data.bank_fee_cents, f_res: $.data.reserve_funding_cents, f_net: $.data.net_to_partner_cents, f_at: $.data.funded_at, f_status: $.data.funding_status }
          trigger:
            - call: "POST /oversight/settlement-batches/${b1_id}/clawback"
              payload: { clawback_reason: "Duplicate payout discovered by treasury the same day." }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { cb_status: $.data.funding_status, cb_fee: $.data.bank_fee_cents, cb_net: $.data.net_to_partner_cents, cb_at: $.data.funded_at }
            - call: "GET /oversight/ledger-entries"
              payload: { partner_id: "${pa_id}", entry_type: "CLAWBACK" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { cb_legs: $.total_count }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pa_paid_after: $.data.cumulative_paid_out_cents, pa_fee_after: $.data.cumulative_bank_fee_cents }
          assert:
            - "f_fee == 61000 (25000 + floor(8000000*45/10000)), f_res == 400000, f_net == 7639000, f_at == 2026-08-01T00:00:00Z, f_status == FUNDED"
            - "immediately after funding the FBO balance is 0, the RESERVE balance is 845250 (506250 + 400000 - 61000), cumulative_paid_out_cents is 7639000 and cumulative_bank_fee_cents is 61000"
            - "cb_status == CLAWED_BACK and cb_legs == 3 — one CLAWBACK entry per funding leg, each carrying reversal_of_entry_id and the negated amount_cents"
            - "the FBO balance is back to 8100000 and the RESERVE balance is back to 506250 — each term individually restored"
            - "pa_paid_after == 0 and pa_fee_after == 0"
            - "cb_fee == 61000, cb_net == 7639000 and cb_at == 2026-08-01T00:00:00Z — the historical money fields and funded_at are deliberately NOT cleared"
            - "note: invariant 1 as literally written does not hold across the fund alone — the conserved sum drops by exactly bank_fee_cents (8606250 before, 8545250 after) because the FEE leg debits the reserve for a fee already excluded from both net_to_partner_cents and reserve_funding_cents; the term-by-term restoration asserted above is the falsifiable form"

  # ===========================================================================
  # §1.4 VALIDATIONS — 47 rules, priorities 1..86. Breadth over the priority
  # ladder, with every instance pinning the ORDER between two rules that a
  # naive implementation would evaluate the other way round.
  # ===========================================================================
  - section: validations
    instances:

      - name: the_auth_header_ladder_rejects_missing_headers_and_unknown_roles_before_any_path_lookup
        claim_type: Priority Ordering
        grounds:
          - validations.priority_1
          - validations.priority_2
          - validations.priority_5
          - validations.priority_8
          - errors.ERR_MISSING_AUTH_HEADERS
          - errors.ERR_UNKNOWN_ROLE
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "All four probes use the SAME nonexistent path id, so the only thing that varies is the auth headers, and the response code walks 401 -> 401 -> 403 -> 404 as the headers improve. An implementation that resolves the path first would answer 404 to every one of them."
        test_recipe:
          setup:
            - "No fixtures required beyond a running service; the path id 00000000-0000-0000-0000-0000000000ff is deliberately absent from the Partner table."
          setup_api_calls: []
          trigger:
            - call: "POST /oversight/partners/00000000-0000-0000-0000-0000000000ff/go-live"
              payload: { attestation_note: "no headers at all" }
              as: NONE
              as_user_id: NONE
              captures: { e_noauth: $.data.error_id }
            - call: "POST /oversight/partners/00000000-0000-0000-0000-0000000000ff/go-live"
              payload: { attestation_note: "unknown role" }
              as: "SuperUser"
              as_user_id: "po-alice"
              captures: { e_role: $.data.error_id }
            - call: "POST /oversight/partners/00000000-0000-0000-0000-0000000000ff/go-live"
              payload: { attestation_note: "known role, wrong role" }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { e_perm: $.data.error_id }
            - call: "POST /oversight/partners/00000000-0000-0000-0000-0000000000ff/go-live"
              payload: { attestation_note: "right role, wrong id" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_nf: $.data.error_id }
          assert:
            - "e_noauth == ERR_MISSING_AUTH_HEADERS with HTTP 401 — X-User-Role and X-User-ID both absent, priority 1"
            - "e_role == ERR_UNKNOWN_ROLE with HTTP 401 — SuperUser is outside the five-role enum, priority 2"
            - "e_perm == ERR_ROLE_NOT_PERMITTED with HTTP 403 — go-live lists only ProgramOfficer in §1.5, priority 5 beats priority 8"
            - "e_nf == ERR_PARTNER_NOT_FOUND with HTTP 404 — only now does the path id get resolved, priority 8"
            - "an empty-string X-User-ID is treated the same as an absent one and also yields ERR_MISSING_AUTH_HEADERS"

      - name: body_foreign_key_existence_outranks_schema_validation_and_is_checked_in_declaration_order
        claim_type: Priority Ordering
        grounds:
          - validations.priority_8
          - validations.priority_10
          - validations.priority_18
          - errors.ERR_VALIDATION
        distinguishing_aspect: "Priority 10 (body FK existence) sits ABOVE priority 18 (schema conformance), which inverts the usual parse-then-lookup instinct: a create carrying both an unknown partner_id and a missing required field must answer 404 ERR_PARTNER_NOT_FOUND, not 422. Within priority 10 the order is the declared body order partner_id then agreement_id, so a request with both unknown reports the partner error."
        test_recipe:
          setup:
            - "Partner A exists as a PROSPECT. Nothing else."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
          trigger:
            - call: "POST /oversight/diligence-reviews/00000000-0000-0000-0000-0000000000ff/decide"
              payload: { outcome: "NOT_AN_OUTCOME", decision_note: "unknown review plus a bad enum" }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_rnf: $.data.error_id }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "00000000-0000-0000-0000-0000000000ff", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_pnf_over_schema: $.data.error_id }
            - call: "POST /oversight/marketing-reviews"
              payload: { partner_id: "00000000-0000-0000-0000-0000000000ff", agreement_id: "00000000-0000-0000-0000-0000000000fe", material_type: "AD", placement_channel: "SEARCH", disclosure_elements: ["BANK_NAME"], apr_disclosed: true, fdic_signage_correct: true, effective_from: "2026-09-01T00:00:00Z", effective_until: "2026-09-30T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_both_unknown: $.data.error_id }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { e_schema: $.data.error_id }
          assert:
            - "e_rnf == ERR_REVIEW_NOT_FOUND (404) — the path id is resolved before the body enum is parsed, priority 8 over priority 18"
            - "e_pnf_over_schema == ERR_PARTNER_NOT_FOUND (404) even though the required field narrative is also absent — priority 10 over priority 18"
            - "e_both_unknown == ERR_PARTNER_NOT_FOUND, NOT ERR_AGREEMENT_NOT_FOUND — partner_id is declared first in the §1.5 input list"
            - "e_schema == ERR_VALIDATION (422) — with a resolvable partner_id the missing narrative finally surfaces"

      - name: the_fintech_partner_scope_check_sits_between_role_permission_and_schema_validation
        claim_type: Priority Ordering
        grounds:
          - validations.priority_5
          - validations.priority_12
          - validations.priority_18
          - errors.ERR_PARTNER_SCOPE_VIOLATION
          - roles.FintechPartner
        distinguishing_aspect: "FintechPartner is entity_backed, so X-User-ID is a Partner id rather than a person. Priority 5 still fires first for an endpoint the role cannot reach at all, priority 12 then fires for an endpoint it CAN reach but for the wrong partner — and it fires ahead of priority 18, so a cross-partner request with an invalid enum answers 403 not 422. The census probe proves the scope target can be a PATH id rather than a body field."
        test_recipe:
          setup:
            - "Partner A and Partner B both exist. FintechPartner requests carry X-User-ID equal to the Partner id itself."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - *q_partner_b
          trigger:
            - call: "POST /oversight/partners/${pa_id}/go-live"
              payload: { attestation_note: "partner attempting its own launch" }
              as: FintechPartner
              as_user_id: "${pa_id}"
              captures: { e_go_live_perm: $.data.error_id }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pb_id}", channel: "NOT_A_CHANNEL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "Filed by partner A against partner B with a bad channel too.", is_reg_e_dispute: false }
              as: FintechPartner
              as_user_id: "${pa_id}"
              captures: { e_scope_over_schema: $.data.error_id }
            - call: "POST /oversight/partners/${pb_id}/account-census"
              payload: { end_user_account_count: 1000, as_of_date: "2026-08-01T00:00:00Z" }
              as: FintechPartner
              as_user_id: "${pa_id}"
              captures: { e_scope_path: $.data.error_id }
            - call: "POST /oversight/partners/${pa_id}/account-census"
              payload: { end_user_account_count: 250000, as_of_date: "2026-08-01T00:00:00Z" }
              as: FintechPartner
              as_user_id: "${pa_id}"
              captures: { census_count: $.data.end_user_account_count, census_v: $.data.version, census_rate: $.data.complaint_rate_bps }
          assert:
            - "e_go_live_perm == ERR_ROLE_NOT_PERMITTED (403) — §1.5 lists only ProgramOfficer for go-live, so priority 5 fires before priority 12 ever looks at the id"
            - "e_scope_over_schema == ERR_PARTNER_SCOPE_VIOLATION (403), NOT ERR_VALIDATION — priority 12 outranks priority 18"
            - "e_scope_path == ERR_PARTNER_SCOPE_VIOLATION — the scope target for account-census is the PATH id"
            - "the census on its own partner returns 200 with census_count == 250000, census_v == 2 and census_rate == 0"

      - name: segregation_of_duties_is_evaluated_before_the_state_guard_and_before_the_score_floors
        claim_type: Priority Ordering
        grounds:
          - validations.priority_14
          - validations.priority_34
          - validations.priority_56
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
        distinguishing_aspect: "Priority 14 is a per-USER check, not a per-role check: the roles on the two endpoints are already disjoint (ProgramOfficer submits, ComplianceOfficer decides), so the rule can only ever fire when one human id presents both roles. Here dual-brett submits as ProgramOfficer and then decides as ComplianceOfficer, and the 403 lands even though the review is in a decidable state AND would independently fail the compliance floor — priority 14 also reads a DIFFERENT originator field per endpoint: submitted_by_user_id on diligence decide, created_by_user_id on risk-decision."
        test_recipe:
          setup:
            - "Partner A. A DiligenceReview created and submitted by user dual-brett acting as ProgramOfficer, with compliance_capability_score 40 (below the 60 floor). The same human id also holds the ComplianceOfficer role; co-frida is an independent officer."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${pa_id}", review_type: "INITIAL", business_model_score: 30, funding_score: 30, compliance_capability_score: 40, complaint_history_score: 30, expected_partner_version: "${pa_v1}" }
              as: ProgramOfficer
              as_user_id: "dual-brett"
              captures: { dr_sod_id: $.data.id }
            - call: "POST /oversight/diligence-reviews/${dr_sod_id}/submit"
              payload: { submission_note: "Submitted by the same officer who will try to decide it." }
              as: ProgramOfficer
              as_user_id: "dual-brett"
              captures: { dr_sod_submitter: $.data.submitted_by_user_id }
          trigger:
            - call: "POST /oversight/diligence-reviews/${dr_sod_id}/decide"
              payload: { outcome: "PASSED", decision_note: "Self-decide attempt." }
              as: ComplianceOfficer
              as_user_id: "dual-brett"
              captures: { e_sod: $.data.error_id }
            - call: "POST /oversight/diligence-reviews/${dr_sod_id}/decide"
              payload: { outcome: "PASSED", decision_note: "Independent reviewer, but the compliance score is 40." }
              as: ComplianceOfficer
              as_user_id: "co-frida"
              captures: { e_floor: $.data.error_id }
            - call: "POST /oversight/diligence-reviews/${dr_sod_id}/decide"
              payload: { outcome: "FAILED", decision_note: "Independent reviewer fails it instead." }
              as: ComplianceOfficer
              as_user_id: "co-frida"
              captures: { dr_sod_status: $.data.status, dr_sod_by: $.data.decided_by_user_id }
          assert:
            - "dr_sod_submitter == dual-brett — the id is captured from the SUBMIT call, not from the create, which is what priority 14 compares against on diligence decide"
            - "e_sod == ERR_SEGREGATION_OF_DUTIES (403), NOT ERR_COMPLIANCE_CAPABILITY_FLOOR — priority 14 outranks priority 56"
            - "e_floor == ERR_COMPLIANCE_CAPABILITY_FLOOR (422) for the independent reviewer — 40 < 60"
            - "the FAILED decision from the same independent reviewer succeeds: dr_sod_status == FAILED and dr_sod_by == co-frida — the floors gate only outcome=PASSED"
            - "the review is still SUBMITTED after both refusals — a refused decide performs no write and does not bump version"

      - name: occ_version_checks_rank_below_schema_validation_but_above_every_state_guard
        claim_type: Priority Ordering
        grounds:
          - validations.priority_18
          - validations.priority_28
          - validations.priority_32
          - concurrency_rules.diligence-create-stale-partner
          - errors.ERR_STALE_PARTNER_VERSION
          - complexity_profile.complexity_layers.optimistic_concurrency
        distinguishing_aspect: "The stale-version probe is sandwiched: a request that is both malformed and stale answers 422, while a request that is both stale and aimed at a TERMINAL partner answers 412. Version 1 is the correct-but-stale literal here precisely because the FAILED decision cascaded a Partner write, so the pre-read version is no longer current — the same trap a hardcoded expected_partner_version falls into."
        test_recipe:
          setup:
            - "Partner A driven to DILIGENCE_FAILED, which is terminal. pa_v1 is the version captured at creation and is now stale."
          setup_api_calls:
            - *q_clock
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - call: "POST /oversight/diligence-reviews/${dr_a_id}/decide"
              payload: { outcome: "FAILED", decision_note: "Compliance program materially deficient." }
              as: ComplianceOfficer
              as_user_id: "co-brett"
              captures: { dr_failed_status: $.data.status }
            - call: "GET /oversight/partners/${pa_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { pa_v_failed: $.data.version, pa_status_failed: $.data.status }
          trigger:
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${pa_id}", review_type: "INITIAL", business_model_score: 999, funding_score: 80, compliance_capability_score: 80, complaint_history_score: 80, expected_partner_version: "${pa_v1}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_schema_over_occ: $.data.error_id }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${pa_id}", review_type: "INITIAL", business_model_score: 80, funding_score: 80, compliance_capability_score: 80, complaint_history_score: 80, expected_partner_version: "${pa_v1}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_occ_over_terminal: $.data.error_id }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${pa_id}", review_type: "INITIAL", business_model_score: 80, funding_score: 80, compliance_capability_score: 80, complaint_history_score: 80, expected_partner_version: "${pa_v_failed}" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { e_terminal: $.data.error_id }
          assert:
            - "dr_failed_status == FAILED, pa_status_failed == DILIGENCE_FAILED and pa_v_failed > pa_v1 — the cascade wrote the Partner"
            - "e_schema_over_occ == ERR_VALIDATION (422) — business_model_score 999 breaks the 0..100 constraint, and priority 18 outranks priority 28"
            - "e_occ_over_terminal == ERR_STALE_PARTNER_VERSION (412) — priority 28 outranks the terminal-partner guard at priority 32"
            - "e_terminal == ERR_PARTNER_TERMINAL (409) — with a fresh version the terminal guard is what refuses it"
            - "no DiligenceReview row was created by any of the three attempts"

      - name: interval_sanity_precedes_overlap_and_settlement_windows_may_abut_but_never_intersect
        claim_type: Violation to Error
        grounds:
          - validations.priority_60
          - validations.priority_62
          - validations.priority_64
          - errors.ERR_INVALID_INTERVAL
          - errors.ERR_SETTLEMENT_WINDOW_OVERLAP
          - errors.ERR_CYCLE_PERIOD_OVERLAP
        distinguishing_aspect: "The half-open convention is tested from both sides: window_start == an existing window_end is ACCEPTED (adjacency) while a one-second intrusion is refused, and the same batch window is accepted for a DIFFERENT partner because overlap is scoped per partner_id. Cycle overlap, by contrast, is global and ignores status, so a CLOSED cycle still blocks."
        test_recipe:
          setup:
            - "Partner A and Partner B both CONTRACTED-eligible (PROSPECT is enough for batch creation). Cycle 2026-08 covers [2026-08-01, 2026-09-01)."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_partner_b
            - call: "POST /oversight/settlement-batches"
              payload: { partner_id: "${pa_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-08T00:00:00Z", gross_settlement_cents: 1000000, interchange_cents: 0, returns_cents: 0, partner_reported_net_cents: 1000000 }
              as: ProgramOfficer
              as_user_id: "po-alice"
