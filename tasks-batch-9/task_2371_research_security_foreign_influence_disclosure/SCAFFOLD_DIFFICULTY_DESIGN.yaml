  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: disclosure_revision_cycle_gates_reject_until_second_round
        grounds:
          - state_machines.Disclosure.review_status.UNDER_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.Disclosure.review_status.RETURNED_FOR_REVISION_to_SUBMITTED
          - state_machines.Disclosure.review_status.UNDER_REVIEW_to_REJECTED
          - errors.ERR_REJECT_TOO_EARLY
          - calculations.disclosure_completeness_score
        distinguishing_aspect: |
          The review dimension is cyclic (UNDER_REVIEW -> RETURNED_FOR_REVISION -> SUBMITTED ->
          UNDER_REVIEW) and the same REJECT request is rejected on the first pass and accepted on
          the second, because the guard reads revision_round which only the loop increments. A
          linear reading of the machine, or a loop that does not carry revision_round forward,
          gets both calls wrong; after REJECTED the row is locked and even the previously legal
          submit is refused.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "Investigator INV, disclosure D with one VERIFIED FOREIGN_APPOINTMENT item on a NONE-designated organization, so risk_score is 12."
            - "D has already completed one revision round and is back in SUBMITTED with revision_round == 1."
