# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1-§1.7: every testable claim the scaffold declares that
# §1.8 does not already cover. Sections and claim_types are taken verbatim from
# references/claim-extraction-guide.md.
# Logical clock default: 2026-08-01T00:00:00Z. Every numeric literal below was
# computed by executing the §1.3 formulas.
# Adjudications recorded while walking the guide:
#   * entities / parent_relationships       -> skipped: entity_topology is flat,
#     every §1.1 row declares `parent: null`; the FK claim is covered by
#     claim_type foreign_key_references instead.
#   * cross-cutting layer `ops_run_checkpoint` -> the guide declares no claim_type
#     row of that name, so the welfare-run epoch checkpoint is filed under the
#     nearest declared row, cross_cutting_complexity_layers / scheduled_actions;
#     no claim_type was invented.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: production_create_returns_full_row_with_derived_defaults
        claim_type: creation
        grounds:
          - entities.Production
          - entities.Production.fields.duty_of_care_tier
          - entities.Production.fields.casting_posture
          - calculations.casting_posture_derivation
          - endpoints.POST_/casting/productions
        distinguishing_aspect: |
          Creation claim on Production: the 201 body carries every declared field,
          duty_of_care_tier is derived from format_type at creation (DOCUSOAP ->
          STANDARD, COMPETITION_HIGH_STRESS -> ENHANCED) rather than supplied, and
          all five conserved rollups start at 0 with casting_posture OPEN. A row
          created with a cap of 2 and zero minors is NOT RESTRICTED, which pins the
          minor clause's `minor_participant_count >= cap` direction.
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_doc_id: $.data.id, doc_tier: $.data.duty_of_care_tier }
          trigger:
            - call: "POST /casting/productions"
              payload: { title: "Island Trials S2", format_type: "COMPETITION_HIGH_STRESS", jurisdiction_code: "CA", season_number: 2, episode_order: 10, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 50000000, welfare_budget_cents: 10000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_hs_id: $.data.id, hs_tier: $.data.duty_of_care_tier, hs_posture: $.data.casting_posture }
          assert:
            - "the trigger call returns HTTP 201"
            - "${doc_tier} == STANDARD"
            - "${hs_tier} == ENHANCED"
            - "${hs_posture} == OPEN"
            - "Production.${prod_hs_id}.stipend_committed_cents == 0"
            - "Production.${prod_hs_id}.welfare_committed_cents == 0"
            - "Production.${prod_hs_id}.trust_escrow_balance_cents == 0"
            - "Production.${prod_hs_id}.minor_participant_count == 0"
            - "Production.${prod_hs_id}.welfare_incident_count == 0"
            - "Production.${prod_hs_id}.breached_obligation_count == 0"
            - "Production.${prod_hs_id}.casting_posture == OPEN"
            - "Production.${prod_hs_id}.version == 1"
            - "Production.${prod_doc_id}.duty_of_care_tier == STANDARD"

      - name: production_get_returns_stored_row_and_every_rollup
        claim_type: retrieval
        grounds:
          - entities.Production
          - endpoints.GET_/casting/productions/{id}
          - response_envelope
        distinguishing_aspect: |
          Retrieval claim: GET returns the persisted input fields byte-for-byte and
          the four computed rollups, and it is readable by a non-owning role
          (CastingDirector) because the endpoint declares all six roles.
        test_recipe:
          setup:
            - "One DOCUSOAP / GA production; nothing else exists."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /casting/productions/${prod_id}"
              payload: {}
              as: CastingDirector
              captures: { got_title: $.data.title, got_pool: $.data.stipend_pool_cents, got_order: $.data.episode_order, got_posture: $.data.casting_posture, got_version: $.data.version }
          assert:
            - "the trigger call returns HTTP 200"
            - "${got_title} == Harbour Nights S1"
            - "${got_pool} == 5000000"
            - "${got_order} == 9"
            - "${got_posture} == OPEN"
            - "${got_version} == 1"
            - "Production.${prod_id}.jurisdiction_code == GA"
            - "Production.${prod_id}.photography_end_utc == 2026-12-15T00:00:00Z"

      - name: casting_calls_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.CastingCall
          - endpoints.GET_/casting/casting-calls
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Listing claim: with three DRAFT calls under one production, limit 2 /
          offset 0 returns 2 rows with meta.total_count 3 and has_more true, and
          limit 2 / offset 2 returns the remaining 1 row with has_more false —
          total_count counts the whole filtered set, not the page.
        test_recipe:
          setup:
            - "One production with three DRAFT casting calls (REFERRAL, DIGITAL_SUBMISSION, REFERRAL)."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_a_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "DIGITAL_SUBMISSION", min_age: 18, max_age: 45, exclusivity_window_days: 30 }
              as: CastingDirector
              captures: { call_b_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 21, max_age: 70, exclusivity_window_days: 60 }
              as: CastingDirector
              captures: { call_c_id: $.data.id }
          trigger:
            - call: "GET /casting/casting-calls"
              payload: { production_id: "${prod_id}", limit: 2, offset: 0 }
              as: CastingDirector
              captures: { page1_first_status: "$.data[0].status", page1_total: $.meta.total_count, page1_has_more: $.meta.has_more }
            - call: "GET /casting/casting-calls"
              payload: { production_id: "${prod_id}", limit: 2, offset: 2 }
              as: CastingDirector
              captures: { page2_total: $.meta.total_count, page2_has_more: $.meta.has_more }
          assert:
            - "both trigger calls return HTTP 200"
            - "the first page contains exactly 2 CastingCall rows"
            - "the second page contains exactly 1 CastingCall row"
            - "${page1_total} == 3"
            - "${page1_has_more} == true"
            - "${page2_total} == 3"
            - "${page2_has_more} == false"
            - "${page1_first_status} == DRAFT"
            - "the envelope of both pages carries limit, offset, total_count and has_more under meta"

      - name: applicant_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Applicant
          - entities.Production
          - validations[priority=5]
          - errors[ERR_APPLICANT_NOT_FOUND]
          - errors[ERR_PRODUCTION_NOT_FOUND]
        distinguishing_aspect: |
          Not-found claim: priority 5 resolves path ids left to right and the
          error_id is entity-specific — the same unknown UUID yields
          ERR_APPLICANT_NOT_FOUND on the applicant path and
          ERR_PRODUCTION_NOT_FOUND on the production path, both 404, even though a
          real production exists in the database.
        test_recipe:
          setup:
            - "One production exists, so the 404 cannot be an empty-database artefact."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /casting/applicants/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: CastingDirector
              captures: { err_app: $.data.error_id }
            - call: "GET /casting/productions/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: ProductionAdmin
              captures: { err_prod: $.data.error_id }
          assert:
            - "both trigger calls return HTTP 404"
            - "${err_app} == ERR_APPLICANT_NOT_FOUND"
            - "${err_prod} == ERR_PRODUCTION_NOT_FOUND"
            - "Production.${prod_id}.version == 1"

      - name: agreement_create_missing_required_fields_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/casting/participant-agreements
          - endpoints.POST_/casting/locations
        distinguishing_aspect: |
          Required-field claim: omitting the non-optional confidentiality_tier from
          an otherwise valid agreement draft, and omitting capacity from a location,
          both fail priority 7 with ERR_INVALID_REQUEST 400 — and no row is
          persisted, so the agreement list stays empty.
        test_recipe:
          setup:
            - "One production, one PUBLISHED REFERRAL call, one adult applicant CLEARED on screening and medical."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Ada Reyes", date_of_birth: "1994-04-02", residency_state_code: "GA" }
              as: CastingDirector
              captures: { app_id: $.data.id }
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "MEDICAL_EXAM", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /casting/applicants/${app_id}"
              payload: {}
              as: BusinessAffairs
              captures: { app_ver: $.data.version }
          trigger:
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_id}", production_id: "${prod_id}", exclusivity_window_days: 0, depiction_rights_scope: "FULL", stipend_structure: "PER_EPISODE", base_stipend_cents: 100000, episodes_committed: 2, expected_applicant_version: "${app_ver}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { err_agr: $.data.error_id }
            - call: "POST /casting/locations"
              payload: { name: "Pier 7 Stage", state_code: "GA", turnaround_buffer_minutes: 60 }
              as: ProductionAdmin
              captures: { err_loc: $.data.error_id }
            - call: "GET /casting/participant-agreements"
              payload: { production_id: "${prod_id}" }
              as: BusinessAffairs
              captures: { agr_total: $.meta.total_count }
          assert:
            - "the first two trigger calls return HTTP 400"
            - "${err_agr} == ERR_INVALID_REQUEST"
            - "${err_loc} == ERR_INVALID_REQUEST"
            - "${agr_total} == 0"
            - "Applicant.${app_id}.version is unchanged by the rejected draft"

      - name: agreement_and_screening_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.ParticipantAgreement.fields.press_appearance_obligation_count
          - entities.ParticipantAgreement.fields.reunion_obligation
          - entities.ParticipantAgreement.fields.status
          - entities.ParticipantAgreement.fields.round_number
          - entities.ParticipantAgreement.fields.welfare_hold
          - entities.ScreeningItem.fields.outcome
          - entities.ScreeningItem.fields.severity_flags
          - calculations.applicant_risk_score
        distinguishing_aspect: |
          Defaults claim: omitting press_appearance_obligation_count,
          reunion_obligation and supersedes_agreement_id yields 0 / false / null,
          status DRAFTED, round_number 0, both stipend variants 0 and welfare_hold
          false; omitting outcome and severity_flags on a screening item yields
          PENDING / 0 with recorded_at and expires_at null, and the PENDING item is
          charged at the ceiling by PROVISIONAL_CEILING: 5 * 1.5 = 7.50. The second
          applicant is used for the PENDING item because the first applicant is
          already CLEARED and its screening dimension declares no further
          item-accepting transition.
        test_recipe:
          setup:
            - "One production, one PUBLISHED REFERRAL call, applicant A CLEARED on screening and medical, applicant B freshly SUBMITTED."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Ada Reyes", date_of_birth: "1994-04-02", residency_state_code: "GA" }
              as: CastingDirector
              captures: { app_a_id: $.data.id }
            - call: "POST /casting/applicants/${app_a_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_a_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_a_id}/screening-items"
              payload: { kind: "MEDICAL_EXAM", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /casting/applicants/${app_a_id}"
              payload: {}
              as: BusinessAffairs
              captures: { app_a_ver: $.data.version }
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Ben Okafor", date_of_birth: "1990-01-10", residency_state_code: "GA" }
              as: CastingDirector
              captures: { app_b_id: $.data.id }
          trigger:
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_a_id}", production_id: "${prod_id}", exclusivity_window_days: 0, confidentiality_tier: "STANDARD", depiction_rights_scope: "FULL", stipend_structure: "PER_EPISODE", base_stipend_cents: 100000, episodes_committed: 2, expected_applicant_version: "${app_a_ver}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_id: $.data.id, agr_press: $.data.press_appearance_obligation_count, agr_reunion: $.data.reunion_obligation, agr_status: $.data.status, agr_round: $.data.round_number, agr_hold: $.data.welfare_hold }
            - call: "POST /casting/applicants/${app_b_id}/screening-items"
              payload: { kind: "INTERVIEW" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { item_outcome: $.data.outcome, item_sev: $.data.severity_flags, item_recorded_at: $.data.recorded_at, item_expires_at: $.data.expires_at }
            - call: "GET /casting/applicants/${app_b_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { b_prov: $.data.provisional_risk_score, b_final: $.data.final_risk_score, b_screening: $.data.screening_status }
          assert:
            - "${agr_press} == 0"
            - "${agr_reunion} == false"
            - "${agr_status} == DRAFTED"
            - "${agr_round} == 0"
            - "${agr_hold} == false"
            - "ParticipantAgreement.${agr_id}.supersedes_agreement_id == null"
            - "ParticipantAgreement.${agr_id}.provisional_stipend_cents == 0"
            - "ParticipantAgreement.${agr_id}.total_stipend_commitment_cents == 0"
            - "ParticipantAgreement.${agr_id}.void_reason == null"
            - "${item_outcome} == PENDING"
            - "${item_sev} == 0"
            - "${item_recorded_at} == null"
            - "${item_expires_at} == null"
            - "${b_prov} == 7.50"
            - "${b_final} == 0"
            - "${b_screening} == SCREENING"

      - name: applicant_is_minor_computed_at_photography_start_boundary
        claim_type: computed_fields
        grounds:
          - entities.Applicant.fields.is_minor
          - entities.Applicant.fields.psych_eval_required
          - entities.Production.fields.photography_start_utc
          - validations[priority=34]
        distinguishing_aspect: |
          Computed-field claim: is_minor is the completed age at
          photography_start_utc (2026-09-15), NOT at the logical clock
          (2026-08-01). A 2008-09-16 date of birth is 17 on that day -> is_minor
          true and psych_eval_required true even on a DOCUSOAP format; a 2008-09-14
          date of birth is exactly 18 -> is_minor false and, on DOCUSOAP,
          psych_eval_required false. One day of birth date separates the two.
        test_recipe:
          setup:
            - "One DOCUSOAP production with photography_start_utc 2026-09-15T00:00:00Z and one PUBLISHED REFERRAL call open from age 13."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
          trigger:
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Mila Grant", date_of_birth: "2008-09-16", residency_state_code: "GA", guardian_name: "Dana Ruiz" }
              as: CastingDirector
              captures: { minor_id: $.data.id, minor_flag: $.data.is_minor, minor_psych: $.data.psych_eval_required }
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Noel Grant", date_of_birth: "2008-09-14", residency_state_code: "GA" }
              as: CastingDirector
              captures: { adult_id: $.data.id, adult_flag: $.data.is_minor, adult_psych: $.data.psych_eval_required }
          assert:
            - "both trigger calls return HTTP 201"
            - "${minor_flag} == true"
            - "${minor_psych} == true"
            - "${adult_flag} == false"
            - "${adult_psych} == false"
            - "Applicant.${minor_id}.screening_status == SUBMITTED"
            - "Applicant.${adult_id}.medical_status == NOT_STARTED"

      - name: screening_item_system_fields_and_expiry_stamped_by_logical_clock
        claim_type: system_fields
        grounds:
          - entities.ScreeningItem.fields.recorded_by_user_id
          - entities.ScreeningItem.fields.recorded_at
          - entities.ScreeningItem.fields.expires_at
          - roles.ComplianceOfficer
          - endpoints.POST_/casting/applicants/{id}/screening-items
        distinguishing_aspect: |
          System-field claim: recorded_by_user_id is taken from the X-User-ID header
          (never from the body), recorded_at is the logical clock instant
          2026-08-01T00:00:00Z (not wall-clock), and expires_at is kind-specific:
          INTERVIEW -> null, MEDICAL_EXAM -> +30d = 2026-08-31T00:00:00Z,
          BACKGROUND_CHECK -> +180d = 2027-01-28T00:00:00Z.
        test_recipe:
          setup:
            - "One production, one PUBLISHED REFERRAL call, one adult applicant SUBMITTED; clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Ada Reyes", date_of_birth: "1994-04-02", residency_state_code: "GA" }
              as: CastingDirector
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { iv_by: $.data.recorded_by_user_id, iv_at: $.data.recorded_at, iv_exp: $.data.expires_at }
