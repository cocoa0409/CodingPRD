            - "${err1} == ERR_STOP_INVALID_STATE; stop stays SCHEDULED"

      - name: route_dispatch_from_cancelled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CollectionRoute.PLANNED_to_DISPATCHED, "errors[ERR_ROUTE_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: dispatch_cancelled_route_dirty_vehicle
          rationale: "§1.8 instance dispatches a CANCELLED route and asserts ERR_ROUTE_INVALID_STATE as the winning error."

  # ==================================================================
  - section: calculations
    instances:
      - name: energy_cost_tier_straddle_marginal_hours
        claim_type: tiered_pricing
        grounds: [calculations.energy_cost_tiered, entities.CookRun.fields.energy_cost_cents]
        distinguishing_aspect: "Marginal tier straddle: run1 (360h) prices entirely at 4200; run2 (240h, prior 360) straddles the 500h tier boundary — 140h at 4200 + 100h at 3800 = 968000 — proving hours are priced marginally, not at a single blanket rate."
        test_recipe:
          setup:
            - "Plant cooker_capacity 2; supplier + agreement [BOVINE]; one ACCEPTED 100000-lb BOVINE batch"
            - "Run1 STAGED 20000 lbs window 2026-08-05T00:00 -> 2026-08-20T00:00 (360h); Run2 STAGED 15000 lbs window 2026-08-05T00:00 -> 2026-08-15T00:00 (240h); both started and advanced to PRESSING"
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/suppliers", payload: { plant_id: "${plant_id}", supplier_name: "Sup A", supplier_type: "SLAUGHTERHOUSE" }, as: ProcurementManager, as_user_id: "pm-1", captures: { sup_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements", payload: { supplier_id: "${sup_id}", plant_id: "${plant_id}", agreement_ref: "AGR-1", species_scope: ["BOVINE"], prohibited_material_policy: "SORT_AND_RETURN", accepts_dead_stock: false, pickup_base_fee_cents: 10000, per_lb_fee_cents: 2, mileage_rate_cents: 100, effective_from: "2026-08-01", effective_to: "2026-12-31" }, as: ProcurementManager, as_user_id: "pm-1", captures: { agr_id: $.data.id } }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/submit", payload: {}, as: ProcurementManager, as_user_id: "pm-1" }
            - { call: "POST /rendering/supplier-agreements/${agr_id}/approve", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/inbound-batches", payload: { plant_id: "${plant_id}", supplier_id: "${sup_id}", agreement_id: "${agr_id}", species: "BOVINE", weight_lbs: 100000, temperature_f: 60.0, received_at: "2026-08-03T08:00:00Z" }, as: ScalehouseOperator, as_user_id: "sh-1", captures: { bat_id: $.data.id } }
            - { call: "POST /rendering/inbound-batches/${bat_id}/screen", payload: { screening_result: "PASS" }, as: ScalehouseOperator, as_user_id: "sh-1" }
            - { call: "POST /rendering/cook-runs", payload: { plant_id: "${plant_id}", cooker_line: 1, recipe: "RUMINANT_RENDER", planned_inputs: [ { batch_id: "${bat_id}", weight_lbs: 20000 } ], cook_start: "2026-08-05T00:00:00Z", cook_end: "2026-08-20T00:00:00Z" }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { cr1: $.data.id } }
            - { call: "POST /rendering/cook-runs", payload: { plant_id: "${plant_id}", cooker_line: 2, recipe: "RUMINANT_RENDER", planned_inputs: [ { batch_id: "${bat_id}", weight_lbs: 15000 } ], cook_start: "2026-08-05T00:00:00Z", cook_end: "2026-08-15T00:00:00Z" }, as: ProductionSupervisor, as_user_id: "ps-1", captures: { cr2: $.data.id } }
            - { call: "POST /rendering/cook-runs/${cr1}/start", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${cr1}/advance", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${cr1}/advance", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${cr2}/start", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${cr2}/advance", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${cr2}/advance", payload: {}, as: ProductionSupervisor, as_user_id: "ps-1" }
          trigger:
            - { call: "POST /rendering/cook-runs/${cr1}/complete", payload: { actual_fat_output_lbs: 3200, actual_meal_output_lbs: 4800 }, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "POST /rendering/cook-runs/${cr2}/complete", payload: { actual_fat_output_lbs: 2400, actual_meal_output_lbs: 3600 }, as: ProductionSupervisor, as_user_id: "ps-1" }
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=1", as: Any, captures: { st_id: "$.data[0].id" } }
            - { call: "GET /rendering/period-settlements/${st_id}", as: Any }
          assert:
            - "CookRun.${cr1}.energy_cost_cents == 1512000 (360h * 4200; prior_hours 0)"
            - "CookRun.${cr2}.energy_cost_cents == 968000 (140h * 4200 + 100h * 3800; prior_hours 360 straddles tier at 500)"
            - "PeriodSettlement.${st_id}.energy_costs_cents == 2480000"
            - "Both runs COMPLETED with yield_variance_pct == 0.0"

      - name: grade_boundary_inclusive_edges
        claim_type: threshold
        grounds: [calculations.grade_determination]
        distinguishing_aspect: "Grade thresholds are inclusive: TALLOW at moisture exactly 0.3 and FFA exactly 2.0 grades PREMIUM (not STANDARD); PROTEIN_MEAL at protein exactly 65 and moisture exactly 8 also grades PREMIUM."
        test_recipe:
          setup: ["plant; supplier + agreement [BOVINE]; ACCEPTED 5000-lb batch; cook run COMPLETED with actuals 800 fat / 1200 meal; two LAB_PENDING lots (TALLOW, PROTEIN_MEAL)"]
          setup_api_calls:
