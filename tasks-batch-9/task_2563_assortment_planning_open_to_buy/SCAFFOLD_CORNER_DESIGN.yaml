            - "an APPROVED plan with M1 IN_SEASON and one IN_SEASON NEW item on a BETTER option plan for the Metro A cluster (sales_index 11500)"
            - "one DRAFT CLIMATE overlay for that cluster with unit_multiplier_bps 11000 and window 2026-08-05 .. 2026-08-31"
          setup_api_calls:
