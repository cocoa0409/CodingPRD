  - section: calculations
    instances:
      - name: drawdown_within_allowance_posts_no_overage_row
        claim_type: Correct Result
        grounds:
          - calculations.contract_credit_drawdown.variants.WITHIN_ALLOWANCE
          - entities.CreditDrawdown.fields.outcome
        distinguishing_aspect: "A drawdown that stays inside base plus rollover settles as BASE with a zero overage figure, so no OVERAGE ledger row is written."
        test_recipe:
          setup: ["one ACTIVE contract with base 1000 and a warehouse"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Calc Within", account_locator: "cw2101", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cwi: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cwi}", name: "WH_CWI", size: "SMALL", auto_suspend_seconds: 600 }
              as: DataEngineer
              captures: { wh_cwi: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_cwi}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_cwi: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_cwi}/activate"
              payload: {}
              as: FinanceController
            - call: "GET /v1/capacity-contracts/${ct_cwi}"
              payload: {}
              as: FinanceController
              captures: { ct_cwi_v: $.data.version }
          trigger:
            - call: "POST /v1/credit-drawdowns"
              payload: { contract_id: "${ct_cwi}", warehouse_id: "${wh_cwi}", amount_credits: 400, source_kind: "SESSION", idempotency_key: "cwi-400", expected_contract_version: "${ct_cwi_v}" }
              as: DataEngineer
          assert:
            - "CreditDrawdown response data.outcome == BASE"
            - "CreditDrawdown response data.overage_usd == 0.00"
            - "CapacityContract.${ct_cwi}.remaining_credits == 600.0"
            - "GET /v1/accounts/${acct_cwi}/ledger-entries contains no row with bucket OVERAGE"
      - name: storage_billing_excludes_dollar_rows_from_monitor_window
        claim_type: Input Set Filtering
        grounds:
          - calculations.resource_monitor_threshold
          - entities.AccountLedgerEntry.fields.bucket
        distinguishing_aspect: "The monitor window sums only the credit-denominated buckets, so a replication posting of 33.41 dollars in the same window leaves used_pct exactly where it was."
        test_recipe:
          setup: ["one account with a LARGE MONTHLY monitor on quota 1000, one closed 900-second session and a cross-cloud replication refresh"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Calc Window", account_locator: "cw2102", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cwd: $.data.id }
            - call: "POST /v1/resource-monitors"
              payload: { account_id: "${acct_cwd}", name: "MON_CWD", credit_quota: 1000, interval: "MONTHLY", action: "NOTIFY" }
              as: FinanceController
              captures: { mon_cwd: $.data.id }
            - call: "POST /v1/warehouses"
