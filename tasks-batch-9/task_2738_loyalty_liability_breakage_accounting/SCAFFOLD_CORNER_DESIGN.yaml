            - "M1 holds one 1000-point lot issued 2026-08-01 with expires_at 2028-07-31T00:00:00Z, so nothing is expiry-eligible while the clock stays in August 2026."
            - "An estimate prepared by acct-1 has been submitted. The Controller then observes the program and captures its version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
