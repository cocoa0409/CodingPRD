scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_costing_quoted_pinned_diverges_from_catalog_current_cost
        grounds:
          - calculations.invoice_total_cents
          - calculations.parts_markup_pct
          - calculations.parts_unit_price_cents
          - entities.QuoteLine.fields.unit_cost_cents_pinned
          - entities.PartsConsumptionEntry.fields.unit_cost_cents_snapshot
          - entities.Invoice.fields.variant
          - state_machines.Quote.DRAFT_to_PRICED
        distinguishing_aspect: |
          This dual variant lives on the money domain (Invoice over a WorkOrder): the
          QUOTED_PINNED algorithm prices the consumed part at the cost frozen onto the
          quote line (25001 -> 32001 per unit) while the ACTUAL_FINAL algorithm would
          price the same part, same quantity and same labor at the catalog's current
          cost (5001 -> 7001 per unit), so the two algorithms return 64002 and 14002
          for identical inputs.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T09:00:00Z."
            - "One account with membership_tier NONE, one property 20.0 miles out with household_size 4, one well with 6.0 gallons of drawdown."
            - "One JOURNEYMAN technician; one CONTROL catalog part costing 25001 cents with 10 units on hand."
            - "One COMPLETED inspection giving the well a measured yield of 15.0 gpm."
            - "A quote of scope REPAIR carrying one ACTIVE line for 2 units of that part, PRICED (which pins 25001), SENT and APPROVED."
            - "The catalog cost is then dropped to 5001 cents BEFORE any parts are consumed."
            - "A work order created from that quote, scheduled, started at 2026-06-03T18:00:00Z, consuming 2 units, and completed with 100 raw labor minutes."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Ridgeline Farm LLC", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "ap@ridgeline.example", membership_tier: "NONE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "18 Ridgeline Rd", jurisdiction_code: "JUR_BRAVO", distance_miles: 20.0, household_size: 4, has_vulnerable_occupant: false }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_BRAVO", well_type: "DRILLED", depth_feet: 240.0, pressure_tank_drawdown_gallons: 6.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Dana Reyes", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_BRAVO", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /water-service/part-catalog-items"
              payload: { part_number: "CTL-9000", category: "CONTROL", unit_cost_cents: 25001, media_kind: "NONE", on_hand_qty: 10, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { part_id: $.data.id }
            - call: "POST /water-service/inspections"
              payload: { well_profile_id: "${well_id}", technician_id: "${tech1_id}", scheduled_for: "2026-06-01T10:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /water-service/inspections/${insp_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech1_id}"
            - call: "POST /water-service/inspections/${insp_id}/complete"
              payload: { measured_yield_gpm: 15.0, static_level_feet: 40.0, observed_drawdown_gallons: 6.0 }
              as: Technician
              as_user_id: "${tech1_id}"
            - call: "POST /water-service/quotes"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_id}", inspection_id: "${insp_id}", scope: "REPAIR", estimated_labor_minutes: 100, estimated_start_at: "2026-06-03T18:00:00Z", quoted_technician_tier: "JOURNEYMAN" }
              as: Estimator
              captures: { quote_id: $.data.id, quote_v0: $.data.version }
            - call: "POST /water-service/quotes/${quote_id}/lines"
              payload: { part_catalog_item_id: "${part_id}", quantity: 2, expected_quote_version: "${quote_v0}" }
              as: Estimator
              captures: { line_id: $.data.id }
            - call: "POST /water-service/quotes/${quote_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /water-service/quotes/${quote_id}/send"
              payload: {}
              as: Estimator
            - call: "POST /water-service/quotes/${quote_id}/approve"
              payload: {}
              as: CustomerContact
              as_user_id: "${acct_id}"
            - call: "PATCH /water-service/part-catalog-items/${part_id}"
              payload: { unit_cost_cents: 5001 }
              as: PlatformAdmin
            - call: "POST /water-service/work-orders"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_id}", assigned_technician_id: "${tech1_id}", scope: "REPAIR", quote_id: "${quote_id}" }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /water-service/work-orders/${wo_id}/schedule"
              payload: { scheduled_start_at: "2026-06-03T18:00:00Z", scheduled_end_at: "2026-06-03T20:00:00Z" }
              as: Dispatcher
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech1_id}"
            - call: "POST /water-service/work-orders/${wo_id}/parts-consumption"
              payload: { part_catalog_item_id: "${part_id}", quantity: 2 }
              as: Technician
              as_user_id: "${tech1_id}"
          trigger:
            - call: "POST /water-service/work-orders/${wo_id}/complete"
              payload: { actual_labor_minutes: 100 }
              as: Technician
              as_user_id: "${tech1_id}"
            - call: "GET /water-service/work-orders/${wo_id}/invoices"
              payload: {}
              as: BillingClerk
              captures: { inv_id: "$.data[0].id" }
          assert:
            - "Invoice.${inv_id}.variant == QUOTED_PINNED"
            - "Invoice.${inv_id}.parts_subtotal_cents == 64002"
            - "Invoice.${inv_id}.labor_subtotal_cents == 22444"
            - "Invoice.${inv_id}.dispatch_subtotal_cents == 0"
            - "Invoice.${inv_id}.taxable_subtotal_cents == 64002"
            - "Invoice.${inv_id}.tax_cents == 4640"
            - "Invoice.${inv_id}.total_cents == 91086"
            - "PartCatalogItem.${part_id}.unit_cost_cents == 5001"
            - "QuoteLine.${line_id}.unit_cost_cents_pinned == 25001"
            - "QuoteLine.${line_id}.unit_price_cents == 32001"

      - name: maintenance_interval_as_designed_diverges_from_as_operated_after_tank_swap
        grounds:
          - calculations.maintenance_interval_days
          - calculations.duty_cycle_ratio
          - calculations.duty_cycle_class
          - calculations.maintenance_next_due_at
          - entities.MaintenancePlan.fields.interval_days_as_designed
          - entities.MaintenancePlan.fields.interval_days_as_operated
        distinguishing_aspect: |
          This dual variant lives on the asset domain (MaintenancePlan over a
          WellProfile), not on money: as_designed is frozen at plan creation from the
          MODERATE duty class (270 days) while as_operated is re-derived from the HIGH
          duty class the pressure-tank swap produced (180 days), so the same plan
          reports two different intervals and only as_operated moves next_due_at.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T09:00:00Z."
            - "One account, one property, one well whose pressure tank has 6.0 gallons of drawdown (ratio 30/6 = 5.00 -> MODERATE) and no treatment media."
            - "One ACTIVE maintenance plan created at that instant, so last_service_date is 2026-06-01T09:00:00Z."
            - "The pressure tank is then replaced with a 4.0 gallon unit (ratio 30/4 = 7.50 -> HIGH)."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Cedar Hollow Trust", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "ap@cedarhollow.example", membership_tier: "NONE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "4 Cedar Hollow", jurisdiction_code: "JUR_ALPHA", distance_miles: 12.0, household_size: 3, has_vulnerable_occupant: false }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 180.0, pressure_tank_drawdown_gallons: 6.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/maintenance-plans"
              payload: { well_profile_id: "${well_id}", account_id: "${acct_id}" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /water-service/well-profiles/${well_id}/pressure-tank-replacement"
              payload: { new_drawdown_gallons: 4.0 }
              as: PlatformAdmin
          assert:
            - "WellProfile.${well_id}.duty_cycle_ratio == 7.50"
            - "WellProfile.${well_id}.duty_cycle_class == HIGH"
            - "MaintenancePlan.${plan_id}.interval_days_as_designed == 270"
            - "MaintenancePlan.${plan_id}.interval_days_as_operated == 180"
            - "MaintenancePlan.${plan_id}.last_service_date == 2026-06-01T09:00:00.000Z"
            - "MaintenancePlan.${plan_id}.next_due_at == 2026-11-28T09:00:00.000Z"
            - "MaintenancePlan.${plan_id}.compliance_state == COMPLIANT"

  - rule_id: combinatorial_formula
    instances:
      - name: net_dispatch_charge_mode_a_four_input_nonlinear_premier_inversion
        mode: "(a) formula with >=3 inputs and non-linear interaction"
        grounds:
          - calculations.no_water_severity_score
          - calculations.emergency_surcharge_tier_cents
          - calculations.membership_surcharge_credit_cents
          - calculations.net_dispatch_charge_cents
          - entities.EmergencyTicket.fields.membership_tier_at_intake
          - derivation_ladder.L17
        distinguishing_aspect: |
          Mode (a): net_dispatch_charge_cents composes four inputs (cause class,
          outage hours, household size, membership tier) through nested min/max and a
          conditional credit unlock, and the composition is NON-MONOTONE - raising the
          severity from 59 to 60 on a PREMIER account lowers the net charge from 14000
          to 4000 cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T09:00:00Z."
            - "One PREMIER account, one property 20.0 miles out with household_size 5 and no vulnerable occupant, one well, one AVAILABLE JOURNEYMAN technician."
            - "Ticket A: TREATMENT_FAILURE (20) + floor(8.0)*3 = 24 outage points + min(15, 5*3) = 15 household points = severity 59."
            - "Ticket B: PRESSURE_TANK_FAILURE (30) + floor(5.0)*3 = 15 outage points + 15 household points = severity 60."
            - "Both diagnoses carry an on-site estimate of 50000 cents, below the PREMIER cap of 150000, so both stay PRE_AUTHORIZED."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Bluewater Estates", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "ap@bluewater.example", membership_tier: "PREMIER" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "77 Bluewater Ln", jurisdiction_code: "JUR_ALPHA", distance_miles: 20.0, household_size: 5, has_vulnerable_occupant: false }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 300.0, pressure_tank_drawdown_gallons: 8.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Ali Nakamura", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /water-service/emergency-tickets"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_id}", account_id: "${acct_id}", reported_outage_hours: 8.0 }
              as: Dispatcher
              captures: { tkt_a_id: $.data.id }
            - call: "POST /water-service/emergency-tickets/${tkt_a_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_a_id}/dispatch"
              payload: { technician_id: "${tech1_id}" }
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_a_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech1_id}"
            - call: "POST /water-service/emergency-tickets"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_id}", account_id: "${acct_id}", reported_outage_hours: 5.0 }
              as: Dispatcher
              captures: { tkt_b_id: $.data.id }
            - call: "POST /water-service/emergency-tickets/${tkt_b_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_b_id}/dispatch"
              payload: { technician_id: "${tech1_id}" }
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_b_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech1_id}"
          trigger:
            - call: "POST /water-service/emergency-tickets/${tkt_a_id}/diagnosis"
              payload: { cause_class: "TREATMENT_FAILURE", onsite_estimate_cents: 50000 }
              as: Technician
              as_user_id: "${tech1_id}"
            - call: "POST /water-service/emergency-tickets/${tkt_b_id}/diagnosis"
              payload: { cause_class: "PRESSURE_TANK_FAILURE", onsite_estimate_cents: 50000 }
              as: Technician
              as_user_id: "${tech1_id}"
          assert:
            - "EmergencyTicket.${tkt_a_id}.severity_score == 59"
            - "EmergencyTicket.${tkt_a_id}.dispatch_surcharge_cents == 14000"
            - "EmergencyTicket.${tkt_a_id}.membership_credit_cents == 0"
            - "EmergencyTicket.${tkt_a_id}.net_dispatch_charge_cents == 14000"
            - "EmergencyTicket.${tkt_b_id}.severity_score == 60"
            - "EmergencyTicket.${tkt_b_id}.dispatch_surcharge_cents == 24000"
            - "EmergencyTicket.${tkt_b_id}.membership_credit_cents == 20000"
            - "EmergencyTicket.${tkt_b_id}.net_dispatch_charge_cents == 4000"
            - "EmergencyTicket.${tkt_b_id}.net_dispatch_charge_cents < EmergencyTicket.${tkt_a_id}.net_dispatch_charge_cents"
            - "EmergencyTicket.${tkt_a_id}.preauth_cap_cents == 150000"
            - "EmergencyTicket.${tkt_a_id}.authorization_status == PRE_AUTHORIZED"

      - name: parts_rounding_mode_b_round_per_unit_then_extend_not_sum_then_round
        mode: "(b) nested rounding where the order matters"
        grounds:
          - calculations.parts_unit_price_cents
          - calculations.parts_extended_price_cents
          - calculations.parts_subtotal_cents
          - calculations.quote_total_cents
          - derivation_ladder.L5
          - derivation_ladder.L6
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-unit-then-extend. A part costing 5001
          cents at 40 percent markup gives 7001 per unit and 21003 for three units,
          whereas summing first and rounding once gives 21004 - a one-cent divergence
          that no tiered-rate test can produce.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T09:00:00Z."
            - "One account, property, well, APPRENTICE technician and a COMPLETED inspection."
            - "One CONSUMABLE catalog part costing 5001 cents."
            - "A REPAIR quote estimating 60 labor minutes starting 2026-06-03T12:00:00Z at APPRENTICE tier, with one ACTIVE line for 3 units."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Millbrook Homestead", billing_jurisdiction_code: "JUR_CHARLIE", contact_email: "ap@millbrook.example", membership_tier: "NONE" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "9 Millbrook Way", jurisdiction_code: "JUR_CHARLIE", distance_miles: 10.0, household_size: 2, has_vulnerable_occupant: false }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_CHARLIE", well_type: "DRILLED", depth_feet: 150.0, pressure_tank_drawdown_gallons: 8.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Sam Okafor", tier: "APPRENTICE", home_jurisdiction_code: "JUR_CHARLIE", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /water-service/part-catalog-items"
              payload: { part_number: "CON-5001", category: "CONSUMABLE", unit_cost_cents: 5001, media_kind: "NONE", on_hand_qty: 40, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { part_id: $.data.id }
            - call: "POST /water-service/inspections"
              payload: { well_profile_id: "${well_id}", technician_id: "${tech1_id}", scheduled_for: "2026-06-01T10:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /water-service/inspections/${insp_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech1_id}"
            - call: "POST /water-service/inspections/${insp_id}/complete"
              payload: { measured_yield_gpm: 12.0, static_level_feet: 35.0, observed_drawdown_gallons: 8.0 }
              as: Technician
              as_user_id: "${tech1_id}"
            - call: "POST /water-service/quotes"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_id}", inspection_id: "${insp_id}", scope: "REPAIR", estimated_labor_minutes: 60, estimated_start_at: "2026-06-03T12:00:00Z", quoted_technician_tier: "APPRENTICE" }
              as: Estimator
              captures: { quote_id: $.data.id, quote_v0: $.data.version }
            - call: "POST /water-service/quotes/${quote_id}/lines"
              payload: { part_catalog_item_id: "${part_id}", quantity: 3, expected_quote_version: "${quote_v0}" }
              as: Estimator
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /water-service/quotes/${quote_id}/price"
              payload: {}
              as: Estimator
          assert:
            - "QuoteLine.${line_id}.unit_cost_cents_pinned == 5001"
            - "QuoteLine.${line_id}.markup_pct_applied == 0.40"
            - "QuoteLine.${line_id}.unit_price_cents == 7001"
            - "QuoteLine.${line_id}.extended_price_cents == 21003"
            - "Quote.${quote_id}.parts_subtotal_cents == 21003"
            - "Quote.${quote_id}.labor_subtotal_cents == 6500"
            - "Quote.${quote_id}.permit_fee_cents == 0"
            - "Quote.${quote_id}.tax_cents == 1523"
            - "Quote.${quote_id}.total_cents == 29026"
            - "Quote.${quote_id}.status == PRICED"

      - name: loyalty_discount_mode_c_eligibility_reads_pre_discount_total
        mode: "(c) circular-looking dependency with a pinned evaluation order"
        grounds:
          - calculations.invoice_total_cents
          - calculations.net_dispatch_charge_cents
          - calculations.trip_fee_cents
          - derivation_ladder.L49
          - derivation_ladder.L50
        distinguishing_aspect: |
          Mode (c): the loyalty discount is a function of the pre-tax total while the
          pre-tax total is a function of the discount. The scaffold pins step 7 to read
          the PRE-DISCOUNT figure from step 6 (266002 >= 200000), so the 11800-cent
          discount applies even though the post-discount pre-tax total would be 254202
          and the tax base is the discounted parts subtotal, not the undiscounted one.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T09:00:00Z, later advanced to 2026-06-03T12:00:00Z (a Wednesday, STANDARD labor band)."
            - "One PREMIER account, one property 20.0 miles out (ZONE_2, trip fee 12500) with household_size 5 and no vulnerable occupant."
            - "One MASTER technician and one CONTROL catalog part costing 100001 cents (markup band 4, 18 percent) with 5 units on hand."
            - "An emergency ticket diagnosed PRESSURE_TANK_FAILURE at 5.0 outage hours (severity 60) with an on-site estimate of 300000 cents, which exceeds the PREMIER cap of 150000 and therefore requires an explicit customer authorization."
            - "An emergency work order that consumes 2 units and reports 60 raw labor minutes."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Harborview Ranch", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "ap@harborview.example", membership_tier: "PREMIER" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "3 Harborview Rd", jurisdiction_code: "JUR_ALPHA", distance_miles: 20.0, household_size: 5, has_vulnerable_occupant: false }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 260.0, pressure_tank_drawdown_gallons: 8.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Priya Raman", tier: "MASTER", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /water-service/part-catalog-items"
              payload: { part_number: "CTL-100001", category: "CONTROL", unit_cost_cents: 100001, media_kind: "NONE", on_hand_qty: 5, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { part_id: $.data.id }
            - call: "POST /water-service/emergency-tickets"
              payload: { property_id: "${prop_id}", well_profile_id: "${well_id}", account_id: "${acct_id}", reported_outage_hours: 5.0 }
              as: Dispatcher
              captures: { tkt_id: $.data.id }
            - call: "POST /water-service/emergency-tickets/${tkt_id}/triage"
              payload: {}
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_id}/dispatch"
              payload: { technician_id: "${tech1_id}" }
              as: Dispatcher
            - call: "POST /water-service/emergency-tickets/${tkt_id}/arrive"
              payload: {}
