  - method: GET
    path: "/lottery-entries"
    description: "List lottery entries, filterable by patron (reverse-reachability for LotteryEntry.patron_id)"
    roles: [RecCoordinator, Patron]
    code: 200
    input: ["patron_id?", "lottery_round_id?", "status?", "limit?", "offset?"]
    output: LotteryEntry[]
    side_effects: []

