        grounds:
          - state_machines.LetterOfIntent.ISSUED_to_LAPSED
          - endpoints.POST_/regulatory-sweeps
          - entities.LetterOfIntent.fields.expires_at
        distinguishing_aspect: |
          expires_at is exclusivity_end_date at 00:00:00.000Z and the sweep
          comparison is INCLUSIVE, so at exactly 2026-09-29T00:00:00Z an ISSUED letter
          lapses and its window is RELEASED. The dimension-B rule does NOT fire in the
          same sweep, because it needs the calendar date to be strictly after
          2026-09-29 - so the letter appears in lapsed_letter_of_intent_ids and not in
          expired_exclusivity_letter_of_intent_ids. One instant later the two lists
          would swap roles, which is what makes the inclusive-versus-strict pair
          observable.
