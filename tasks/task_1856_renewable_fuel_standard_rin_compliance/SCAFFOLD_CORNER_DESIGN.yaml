              as: ComplianceManager
              captures: { b2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-31T23:59:59Z" }
              as: OpsAdmin
            - call: "POST /rfs/retirement-batches/${b1}/submit"
              as: ComplianceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /rfs/retirement-batches/${b2}/submit"
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "first submit at exactly the deadline succeeded (RetirementBatch.${b1}.status == SUBMITTED)"
            - "trigger error_id == ERR_DEADLINE_PASSED (one second past)"

      - name: d_code_category_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_D_CODE_NOT_ELIGIBLE]", calculations.nested_retirement_accounting]
        distinguishing_aspect: "Nested-obligation eligibility: D6 maps only to TOTAL_RENEWABLE; a D6 batch toward ADVANCED is rejected at creation."
        test_recipe:
          setup: ["account + year exist"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-VAL-4" }
              as: OpsAdmin
              captures: { acct: $.data.id }
