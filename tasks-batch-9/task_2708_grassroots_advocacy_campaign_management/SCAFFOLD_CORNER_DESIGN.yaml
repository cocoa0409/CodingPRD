  - section: state_machines
    instances:
      - name: campaign_launch_with_no_legislator_returns_no_target_legislator
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Campaign.DRAFT_to_ACTIVE
          - errors[ERR_NO_TARGET_LEGISLATOR]
        distinguishing_aspect: "The DRAFT -> ACTIVE edge requires at least one Legislator row, so launching a campaign with an empty target list returns ERR_NO_TARGET_LEGISLATOR (409) and the campaign stays DRAFT at version 1."
        test_recipe:
          setup:
            - "One DRAFT campaign with no legislators at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
          assert:
            - "response status == 409 with error_id == ERR_NO_TARGET_LEGISLATOR"
            - "Campaign.${camp_id}.status == DRAFT"
            - "Campaign.${camp_id}.version == 1"

      - name: campaign_launch_applied_twice_returns_invalid_state_transition
        claim_type: idempotency
        grounds:
          - state_machines.Campaign.DRAFT_to_ACTIVE
          - validations[priority=11]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "launch is not idempotent: the second call on an already ACTIVE campaign returns ERR_INVALID_STATE_TRANSITION (409) and leaves version at 2, proving no second side-effect pass ran."
        test_recipe:
          setup:
            - "One ACTIVE campaign (launched once) with one legislator."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
            - call: "POST /advocacy/legislators"
              payload: { campaign_id: "${camp_id}", full_name: "Rep. Alba", district_code: "HD-14", chamber: "HOUSE", stance: "UNDECIDED" }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { leg_id: $.data.id }
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { ver_after_launch: $.data.version }
          trigger:
            - call: "POST /advocacy/campaigns/${camp_id}/launch"
              payload: {}
              as: CampaignDirector
              as_user_id: "u_dir_1"
          assert:
            - "${ver_after_launch} == 2"
            - "response status == 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "Campaign.${camp_id}.status == ACTIVE"
            - "Campaign.${camp_id}.version == 2"

      - name: closed_campaign_refuses_every_further_lifecycle_call
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Campaign.terminal_states
          - validations[priority=11]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "CLOSED is terminal on the status dimension: a second close and a re-launch both return ERR_INVALID_STATE_TRANSITION (409), and a supporter create below the closed campaign returns ERR_CAMPAIGN_NOT_ACTIVE (409) rather than reopening it."
        test_recipe:
          setup:
            - "One campaign launched and then closed with no activations, so the close cascade has nothing to flush."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
