  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: occ_stale_version_beats_invalid_state_on_discontinue
        grounds:
          - 'validations[priority=4]'
          - 'validations[priority=5]'
          - 'concurrency_rules[product-discontinue-stale-product]'
        distinguishing_aspect: |
          Error-category pair: state(412 stale version) vs state(409 invalid state).
          A discontinued-then-relisted product (now CANDIDATE) cannot be
          re-discontinued (state violation); but when the caller ALSO passes a
          stale expected_product_version, ERR_STALE_VERSION (priority 4) wins
          over ERR_INVALID_STATE (priority 5).
        test_recipe:
          setup:
            - "Product P is in CANDIDATE state; current Product.version = V"
            - "Caller holds expected_product_version = V - 1 (stale)"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 50 }
              as: CategoryManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /retailers/${rid}/products/${pid}/list"
              payload: {}
              as: CategoryManager
            - call: "GET /retailers/${rid}/products/${pid}"
              payload: {}
              as: CategoryManager
              captures: { pv2: $.data.version }
            - call: "POST /retailers/${rid}/products/${pid}/discontinue"
              payload: { discontinuation_effective_date: "2027-01-01T00:00:00Z", expected_product_version: "${pv2}" }
              as: CategoryManager
            - call: "POST /retailers/${rid}/products/${pid}/cancel-discontinuation"
              payload: {}
              as: CategoryManager
            - call: "GET /retailers/${rid}/products/${pid}"
              payload: {}
              as: CategoryManager
              captures: { pv3: $.data.version }
          trigger:
            - call: "POST /retailers/${rid}/products/${pid}/discontinue"
              payload: { discontinuation_effective_date: "2027-01-01T00:00:00Z", expected_product_version: "${pv3} - 1" }
              as: CategoryManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (priority 4 wins over priority 5 ERR_INVALID_STATE)"

      - name: self_approval_beats_understock_check_on_planogram_approve
        grounds:
          - 'validations[priority=6]'
          - 'validations[priority=12]'
        distinguishing_aspect: |
          Error-category pair: business_safety (segregation-of-duties) vs
          business_constraint (understock). Planogram has an UNDERSTOCK line
          AND the approving CategoryManager user_id equals the submitting
          CategoryCaptain user_id. ERR_SELF_APPROVAL_FORBIDDEN (priority 6)
          wins over ERR_UNDERSTOCK_NOT_ALLOWED (priority 12).
        test_recipe:
          setup:
            - "Category C role=ROUTINE; planogram PG in IN_REVIEW submitted by captain with X-User-ID = supplier-id U"
            - "PG has a line with dos < 3 (UNDERSTOCK)"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 700 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 1, capacity_units: 7 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/approve"
              payload: {}
              as: CategoryManager
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SELF_APPROVAL_FORBIDDEN (priority 6 business_safety wins over priority 12 business_constraint)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: dos_understock_boundary_at_exactly_3_days
        grounds:
          - calculations.dos_flag_classification
          - calculations.days_of_supply
        distinguishing_aspect: |
          Boundary on numeric metric (dos) reached via PlanogramLine create
          endpoint. dos == DOS_UNDERSTOCK_DAYS (3.0) counts as OK (>=); dos
          just below 3.0 is UNDERSTOCK. Pin both sides of the boundary.
        test_recipe:
          setup:
            - "Category C; product P weekly_demand_units=70 (=10/day)"
            - "Line A: capacity_units=30 → dos = 30/10 = 3.0 → OK (>=)"
            - "Line B on second product P2 weekly_demand_units=70, capacity_units=29 → dos = 2.9 → UNDERSTOCK"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 20 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "PA", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 70 }
              as: CategoryManager
              captures: { pa: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "PB", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 70 }
              as: CategoryManager
              captures: { pb: $.data.id }
            - call: "POST /retailers/${rid}/products/${pa}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/products/${pb}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${pa}", position_index: 1, facings: 3, capacity_units: 30 }
              as: CategoryManager
              captures: { la: $.data.id, la_flag: $.data.dos_flag }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${pb}", position_index: 2, facings: 3, capacity_units: 29 }
              as: CategoryManager
              captures: { lb: $.data.id, lb_flag: $.data.dos_flag }
          assert:
            - "la_flag == OK (boundary value 3.0 is OK, not UNDERSTOCK)"
            - "lb_flag == UNDERSTOCK (just below boundary)"

      - name: reset_window_back_to_back_vs_overlapping
        grounds:
          - calculations.reset_window_overlap
          - 'validations[priority=8]'
        distinguishing_aspect: |
          Boundary on datetime interval metric reached via ResetProject schedule
          endpoint. Half-open interval arithmetic: project A end == project B
          start does NOT conflict (back-to-back allowed); A end > B start by
          any epsilon DOES conflict. Pin both sides of the adjacency boundary.
        test_recipe:
          setup:
            - "Category C; store ST; two APPROVED planograms PG1, PG2"
            - "RP1 [10:00, 12:00) on ST — already SCHEDULED"
            - "RP2 [12:00, 14:00) — adjacent, should schedule cleanly"
            - "RP3 [11:59, 14:00) — overlaps by 1 minute, should be rejected"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 20 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 100 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/stores"
              payload: { store_code: "ST1", cluster: "BASE" }
              as: RetailerAdmin
              captures: { stid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG1", variant: "BASE" }
              as: CategoryManager
              captures: { pg1: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pg1}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pg1}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pg1}/approve"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects"
              payload: { planogram_id: "${pg1}", store_id: "${stid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: ResetCoordinator
              captures: { rp1: $.data.id, rp1_v: $.data.version }
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects/${rp1}/schedule"
              payload: { expected_reset_project_version: "${rp1_v}" }
              as: ResetCoordinator
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects"
              payload: { planogram_id: "${pg1}", store_id: "${stid}", scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T14:00:00Z" }
              as: ResetCoordinator
              captures: { rp2: $.data.id, rp2_v: $.data.version }
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects"
              payload: { planogram_id: "${pg1}", store_id: "${stid}", scheduled_start: "2026-06-01T11:59:00Z", scheduled_end: "2026-06-01T14:00:00Z" }
              as: ResetCoordinator
              captures: { rp3: $.data.id, rp3_v: $.data.version }
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects/${rp2}/schedule"
              payload: { expected_reset_project_version: "${rp2_v}" }
              as: ResetCoordinator
              captures: { rp2_status: $.data.status }
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects/${rp3}/schedule"
              payload: { expected_reset_project_version: "${rp3_v}" }
              as: ResetCoordinator
              captures: { rp3_err: $.data.error_id }
          assert:
            - "rp2_status == SCHEDULED (back-to-back at 12:00 does not conflict)"
            - "rp3_err == ERR_RESET_WINDOW_CONFLICT (overlap by 1 minute rejected)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: planogram_submit_gated_by_category_open
        grounds:
          - state_machines.Planogram.DRAFT_to_IN_REVIEW
          - state_machines.Category
        distinguishing_aspect: |
          Entity pair Planogram → Category: a planogram can only be submitted
          when its parent Category.status == OPEN. Locking the category blocks
          new submissions even though the planogram itself is valid DRAFT.
        test_recipe:
          setup:
            - "Category C; planogram PG in DRAFT with one line; C is LOCKED"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 50 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/lock"
              payload: {}
              as: CategoryManager
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE or ERR_CATEGORY_LOCKED (Planogram submission blocked by parent Category state)"

      - name: reset_project_schedule_gated_by_planogram_approved
        grounds:
          - state_machines.ResetProject.PROPOSED_to_SCHEDULED
          - state_machines.Planogram
        distinguishing_aspect: |
          Entity pair ResetProject → Planogram: a reset project can only be
          SCHEDULED if its referenced planogram is in {APPROVED, ACTIVE}. A
          project referencing a DRAFT planogram cannot transition, even though
          its own fields are valid.
        test_recipe:
          setup:
            - "Category C; planogram PG in DRAFT (never submitted); ResetProject RP referencing PG"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 100 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/stores"
              payload: { store_code: "ST1", cluster: "BASE" }
              as: RetailerAdmin
              captures: { stid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects"
              payload: { planogram_id: "${pgid}", store_id: "${stid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: ResetCoordinator
              captures: { rp: $.data.id, rp_v: $.data.version }
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects/${rp}/schedule"
              payload: { expected_reset_project_version: "${rp_v}" }
              as: ResetCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (planogram in DRAFT does not satisfy schedule precondition)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: store_reset_window_geometric_overlap
        grounds:
          - calculations.reset_window_overlap
          - 'validations[priority=8]'
        distinguishing_aspect: |
          Resource = Store. Interval semantics: geometric half-open overlap
          detection — [a_start, a_end) ∩ [b_start, b_end) ≠ ∅ rejects.
          Adjacent (a_end == b_start) allowed. Pure interval geometry.
        test_recipe:
          setup:
            - "Category C; store ST; planogram PG APPROVED; RP1 SCHEDULED [10:00, 12:00)"
            - "RP2 proposed [11:00, 13:00) — overlaps 1 hour"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 100 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/stores"
              payload: { store_code: "ST1", cluster: "BASE" }
              as: RetailerAdmin
              captures: { stid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/approve"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects"
              payload: { planogram_id: "${pgid}", store_id: "${stid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: ResetCoordinator
              captures: { rp1: $.data.id, rp1_v: $.data.version }
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects/${rp1}/schedule"
              payload: { expected_reset_project_version: "${rp1_v}" }
              as: ResetCoordinator
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects"
              payload: { planogram_id: "${pgid}", store_id: "${stid}", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T13:00:00Z" }
              as: ResetCoordinator
              captures: { rp2: $.data.id, rp2_v: $.data.version }
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects/${rp2}/schedule"
              payload: { expected_reset_project_version: "${rp2_v}" }
              as: ResetCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RESET_WINDOW_CONFLICT"

      - name: crew_assignment_aggregate_capacity_overlap
        grounds:
          - calculations.reset_window_overlap
          - 'validations[priority=9]'
        distinguishing_aspect: |
          Resource = ResetCrew. Interval semantics: aggregate capacity — even
          when individual assignment windows don't pairwise overlap, the count
          of simultaneously ASSIGNED assignments at any instant must not exceed
          crew.max_concurrent_projects. Different from geometric overlap
          because it tracks a cumulative capacity ceiling, not just pairwise
          intersection.
        test_recipe:
          setup:
            - "Category C; crew CREW with max_concurrent_projects=1"
            - "Two stores ST1, ST2 (different stores, so no RP geometric overlap)"
            - "RP1 on ST1 SCHEDULED; assignment RA1 on CREW [10:00, 12:00)"
            - "RP2 on ST2 SCHEDULED [11:00, 13:00); attempt to assign CREW [11:00, 13:00)"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 100 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/stores"
              payload: { store_code: "ST1", cluster: "BASE" }
              as: RetailerAdmin
              captures: { st1: $.data.id }
            - call: "POST /retailers/${rid}/stores"
              payload: { store_code: "ST2", cluster: "BASE" }
              as: RetailerAdmin
              captures: { st2: $.data.id }
            - call: "POST /retailers/${rid}/reset-crews"
              payload: { name: "Crew", max_concurrent_projects: 1 }
              as: ResetCoordinator
              captures: { crew: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG", variant: "BASE" }
              as: CategoryManager
              captures: { pgid: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgid}/approve"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects"
              payload: { planogram_id: "${pgid}", store_id: "${st1}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T12:00:00Z" }
              as: ResetCoordinator
              captures: { rp1: $.data.id, rp1_v: $.data.version }
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects/${rp1}/schedule"
              payload: { expected_reset_project_version: "${rp1_v}" }
              as: ResetCoordinator
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects/${rp1}/assignments"
              payload: { crew_id: "${crew}", assigned_start: "2026-06-01T10:00:00Z", assigned_end: "2026-06-01T12:00:00Z" }
              as: ResetCoordinator
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects"
              payload: { planogram_id: "${pgid}", store_id: "${st2}", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T13:00:00Z" }
              as: ResetCoordinator
              captures: { rp2: $.data.id, rp2_v: $.data.version }
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects/${rp2}/schedule"
              payload: { expected_reset_project_version: "${rp2_v}" }
              as: ResetCoordinator
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/reset-projects/${rp2}/assignments"
              payload: { crew_id: "${crew}", assigned_start: "2026-06-01T11:00:00Z", assigned_end: "2026-06-01T13:00:00Z" }
              as: ResetCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CREW_OVERLAP (crew capacity 1 exceeded by overlapping assignments)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: planogram_activation_supersede_conserves_single_active_per_variant
        grounds:
          - state_machines.Planogram.APPROVED_to_ACTIVE
          - state_machines.Planogram.ACTIVE_to_SUPERSEDED
          - 'validations[priority=13]'
        distinguishing_aspect: |
          Conserved quantity: count of ACTIVE planograms per (category_id,
          variant) — invariant value is exactly 1 after any activation.
          Forward action (activate PG_B) paired with compensating action
          (supersede PG_A) MUST leave the count unchanged (=1). Test by
          activating PG_A then PG_B; after both, count of ACTIVE planograms
          for (C, BASE) == 1.
        test_recipe:
          setup:
            - "Category C; PG_A and PG_B both APPROVED, variant=BASE"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 10 }
              as: CategoryManager
              captures: { cid: $.data.id }
            - call: "POST /retailers/${rid}/suppliers"
              payload: { name: "S" }
              as: RetailerAdmin
              captures: { sid: $.data.id }
            - call: "POST /retailers/${rid}/products"
              payload: { category_id: "${cid}", supplier_id: "${sid}", sku: "P1", width_in: 6, unit_cost_cents: 100, weekly_demand_units: 100 }
              as: CategoryManager
              captures: { p1: $.data.id }
            - call: "POST /retailers/${rid}/products/${p1}/list"
              payload: {}
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG_A", variant: "BASE" }
              as: CategoryManager
              captures: { pga: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pga}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 5, capacity_units: 50 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pga}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pga}/approve"
              payload: {}
              as: CategoryManager
            - call: "GET /retailers/${rid}/categories/${cid}"
              payload: {}
              as: CategoryManager
              captures: { cv1: $.data.version }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pga}/activate"
              payload: { expected_category_version: "${cv1}" }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms"
              payload: { name: "PG_B", variant: "BASE" }
              as: CategoryManager
              captures: { pgb: $.data.id }
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgb}/lines"
              payload: { product_id: "${p1}", position_index: 1, facings: 8, capacity_units: 80 }
              as: CategoryManager
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgb}/submit"
              payload: {}
              as: CategoryCaptain
              as_user_id: "${sid}"
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgb}/approve"
              payload: {}
              as: CategoryManager
            - call: "GET /retailers/${rid}/categories/${cid}"
              payload: {}
              as: CategoryManager
              captures: { cv2: $.data.version }
          trigger:
            - call: "POST /retailers/${rid}/categories/${cid}/planograms/${pgb}/activate"
              payload: { expected_category_version: "${cv2}" }
              as: CategoryManager
          assert:
            - "Planogram.${pgb}.status == ACTIVE"
            - "Planogram.${pga}.status == SUPERSEDED"
            - "count of planograms with category_id=${cid}, variant=BASE, status=ACTIVE == 1 (invariant conserved)"

      - name: reset_assignment_release_conserves_crew_capacity
        grounds:
          - state_machines.ResetProject.IN_PROGRESS_to_COMPLETED
          - state_machines.ResetAssignment
        distinguishing_aspect: |
          Conserved quantity: crew concurrent capacity usage — invariant is
          that count of ASSIGNED ResetAssignments on a crew at any instant
          must be <= crew.max_concurrent_projects. Forward action (complete
          project) paired with compensating action (release all ASSIGNED
          assignments) MUST leave crew usage at 0. Test by completing an
          IN_PROGRESS project with one ASSIGNED assignment.
        test_recipe:
          setup:
            - "Category C; crew CREW cap=2; project RP IN_PROGRESS with one ASSIGNED assignment RA"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R" }
              as: PlatformAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/categories"
              payload: { code: "C", role: "ROUTINE", annual_sales_cents: 100000, total_linear_feet: 10 }
              as: CategoryManager
