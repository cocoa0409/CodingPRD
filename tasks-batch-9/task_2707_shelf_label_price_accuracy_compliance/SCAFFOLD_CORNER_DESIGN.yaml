      - name: corner_compliance_summary_computed_read_matches_the_plain_read
        claim_type: computed_read
        grounds:
          - endpoints.GET_/price-integrity/stores/{id}/compliance-summary
          - calculations.store_label_backlog_count
          - calculations.store_compliance_posture
        distinguishing_aspect: "The computed read recomputes the backlog and the posture from live rows and must agree with the plain store read at every step, which is what makes a drifting incremental counter detectable: two unplaced tasks read 2 on both endpoints, and after one placement both read 1 in the same request cycle."
        test_recipe:
          setup:
            - "One jurisdiction; store_a with aisle A01, certified sm1 and la1; a distributed two-line file with both lines tasked at store_a on disjoint windows."
