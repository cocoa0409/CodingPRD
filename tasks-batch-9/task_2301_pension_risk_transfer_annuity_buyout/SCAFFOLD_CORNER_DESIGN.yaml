      - name: strategy_second_submission_is_rejected_rather_than_re_evaluated
        claim_type: idempotency
        grounds:
          - state_machines.DeRiskingStrategy.DRAFT_to_UNDER_EVALUATION
          - errors.ERR_STRATEGY_STATE_INVALID
        distinguishing_aspect: |
          Re-firing submission on a strategy already UNDER_EVALUATION must be
          rejected, and — because submission is the transition that runs both cost
          variants and stamps submitted_by_user_id — the second attempt must leave
          the projected costs and the version exactly as the first left them. A
          handler that re-runs the variants idempotently would still bump version
          and is caught by the version assertion.
        test_recipe:
          setup:
            - "one PensionPlan and one strategy submitted once by actuary-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
