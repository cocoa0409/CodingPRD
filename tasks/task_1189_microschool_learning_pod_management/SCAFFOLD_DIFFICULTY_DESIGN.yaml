scaffold_difficulty_design:
  # =====================================================================
  # Rule 1: dual_variant_calc — 2 instances, different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: prorated_tuition_per_day_vs_per_week
        grounds:
          - calculations.prorated_tuition
          - entities.Seat.fields.prorated_due_cents
          - entities.Pod.fields.tuition_full_year_cents
        distinguishing_aspect: |
          Seat-domain calculation: identical mid-year enrollment inputs yield
          different prorated_due_cents under PER_DAY vs PER_WEEK variants
          (calendar-day granularity vs ceil'd-week granularity).
        test_recipe:
          setup:
            - "FacilitySite exists (AVAILABLE)."
            - "Pod exists in ACTIVE state with term 2026-08-01 to 2027-05-31 (304 days), tuition_full_year_cents = 1200000, seat_capacity = 12."
            - "Family + Student exist; seat RESERVED with enrolled_on = 2026-10-15 (mid-year; 229 days remaining inclusive; ceil(229/7)=33 weeks of ceil(304/7)=44 total weeks)."
            - "Clock is set so enrolled_on is a valid future date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /facility-sites"
              payload: { site_name: "Maple Site", address_line1: "1 Maple St", jurisdiction_code: "AZ-MARICOPA", zoning_class: "RESIDENTIAL_SINGLE", max_occupancy: 30, indoor_sqft: 1200 }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /pods"
              payload: { name: "Maple Pod", pod_code: "MAPLE26", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", seat_capacity: 12, tuition_full_year_cents: 1200000, min_guides_required: 1, facility_site_id: "${site_id}" }
              as: PodOperator
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/safety-policies"
              payload: { policy_version: 1, emergency_plan_text: "", immunization_policy: "REQUIRED", background_check_required: true, drill_cadence_days: 30 }
              as: PodOperator
              captures: { sp_id: $.data.id }
            - call: "POST /pods/${pod_id}/safety-policies/${sp_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pods/${pod_id}/curriculum-plans"
              payload: { plan_name: "Plan A", grade_bands_covered: ["LOWER_EL"], multi_age_grouping: false, total_instructional_minutes_per_week: 1500 }
              as: PodOperator
              captures: { cp_id: $.data.id }
            - call: "POST /pods/${pod_id}/curriculum-plans/${cp_id}/submit"
              payload: {}
              as: PodOperator
            - call: "POST /pods/${pod_id}/curriculum-plans/${cp_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pods/${pod_id}/open-enrollment"
              payload: {}
              as: PodOperator
            - call: "POST /pods/${pod_id}/licensing-determinations"
              payload: { jurisdiction_code: "AZ-MARICOPA", submission_kind: "EXEMPTION_CLAIM" }
              as: PodOperator
              captures: { det_id: $.data.id }
            - call: "POST /pods/${pod_id}/licensing-determinations/${det_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guides"
              payload: { full_name: "Guide One", email: "g1@x.com", certification_tier: "CERTIFIED" }
              as: PlatformAdmin
              captures: { guide_id: $.data.id }
            - call: "POST /guides/${guide_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pods/${pod_id}/guide-assignments"
              payload: { guide_id: "${guide_id}", window_start_date: "2026-08-01", window_end_date: "2027-05-31", weekly_hours: 30, is_primary: true }
              as: PodOperator
            - call: "POST /pods/${pod_id}/licensing-determinations/${det_id}/decide"
              payload: { decision: "EXEMPT_GRANTED" }
              as: ComplianceOfficer
            - call: "POST /families"
              payload: { family_name: "Smith", primary_contact_email: "smith@x.com", billing_address_state: "AZ" }
              as: Registrar
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { legal_first_name: "Amy", legal_last_name: "Smith", date_of_birth: "2017-03-15" }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /pods/${pod_id}/seats"
              payload: { student_id: "${student_id}", enrolled_on: "2026-10-15" }
              as: Registrar
              captures: { seat_id: $.data.id }
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat_id}/enroll"
              payload: { expected_pod_version: "${pod_v_pre_enroll}" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { prorated_cents: $.data.prorated_due_cents }
            # Note: ${pod_v_pre_enroll} would be captured via an earlier GET; for this recipe we read it.
          assert:
            - "Under PER_DAY variant: Seat.prorated_due_cents == round_half_up(1200000 * 229 / 304) == 903947"
            - "Under PER_WEEK variant: Seat.prorated_due_cents == round_half_up(1200000 * 33 / 44) == 900000"
            - "The two variants differ by 3947 cents; the pod's configured variant MUST be applied deterministically."

      - name: guide_to_student_ratio_fte_vs_headcount
        grounds:
          - calculations.guide_to_student_ratio
          - entities.Pod.fields.compliance_flag
          - entities.Guide.fields.fte_weight
        distinguishing_aspect: |
          Pod-compliance calculation: identical staffing and enrollment data
          yields different compliance_flag under FTE-weighted vs headcount
          variants (an APPRENTICE guide counts as 0.5 vs 1.0).
        test_recipe:
          setup:
            - "Pod ACTIVE with seat_capacity=12, 12 seats ENROLLED, and exactly one APPRENTICE guide assigned ACTIVE with weekly_hours=30."
            - "Clock set so the assignment window covers 'today'."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /facility-sites"
              payload: { site_name: "Ratio Site", address_line1: "5 Oak Ave", jurisdiction_code: "AZ-MARICOPA", zoning_class: "RESIDENTIAL_SINGLE", max_occupancy: 40, indoor_sqft: 1500 }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /pods"
              payload: { name: "Ratio Pod", pod_code: "RATIO26", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", seat_capacity: 12, tuition_full_year_cents: 900000, min_guides_required: 1, facility_site_id: "${site_id}" }
              as: PodOperator
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/safety-policies"
              payload: { policy_version: 1, emergency_plan_text: "", immunization_policy: "REQUIRED", background_check_required: true, drill_cadence_days: 30 }
              as: PodOperator
              captures: { sp_id: $.data.id }
            - call: "POST /pods/${pod_id}/safety-policies/${sp_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pods/${pod_id}/curriculum-plans"
              payload: { plan_name: "Plan R", grade_bands_covered: ["LOWER_EL"], multi_age_grouping: false, total_instructional_minutes_per_week: 1500 }
              as: PodOperator
              captures: { cp_id: $.data.id }
            - call: "POST /pods/${pod_id}/curriculum-plans/${cp_id}/submit"
              payload: {}
              as: PodOperator
            - call: "POST /pods/${pod_id}/curriculum-plans/${cp_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pods/${pod_id}/open-enrollment"
              payload: {}
              as: PodOperator
            - call: "POST /pods/${pod_id}/licensing-determinations"
              payload: { jurisdiction_code: "AZ-MARICOPA", submission_kind: "EXEMPTION_CLAIM" }
              as: PodOperator
              captures: { det_id: $.data.id }
            - call: "POST /pods/${pod_id}/licensing-determinations/${det_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guides"
              payload: { full_name: "Apprentice One", email: "app1@x.com", certification_tier: "APPRENTICE" }
              as: PlatformAdmin
              captures: { guide_id: $.data.id }
            - call: "POST /guides/${guide_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pods/${pod_id}/guide-assignments"
              payload: { guide_id: "${guide_id}", window_start_date: "2026-08-01", window_end_date: "2027-05-31", weekly_hours: 30, is_primary: true }
              as: PodOperator
            - call: "POST /pods/${pod_id}/licensing-determinations/${det_id}/decide"
              payload: { decision: "EXEMPT_GRANTED" }
              as: ComplianceOfficer
            # Now enroll 12 students
            - call: "POST /families"
              payload: { family_name: "FamA", primary_contact_email: "fama@x.com", billing_address_state: "AZ" }
              as: Registrar
              captures: { fam_id: $.data.id }
          trigger:
            # After 12 seats are ENROLLED, ratio is evaluated.
            # FTE-weighted: 0.5 FTE / 12 = 0.04167 < 1/15 (0.06667) -> VIOLATION
            # Headcount: 1 / 12 = 0.08333; 1/15 <= 0.08333 < 1/10 -> AT_RISK
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { compliance: $.data.compliance_flag }
          assert:
            - "Under FTE-weighted variant: Pod.compliance_flag == VIOLATION (0.5/12 = 0.0417 < 1/15)"
            - "Under headcount variant: Pod.compliance_flag == AT_RISK (1/12 = 0.0833, between 1/15 and 1/10)"
            - "The two variants MUST produce different compliance_flag values for identical inputs."

  # =====================================================================
  # Rule 2: combinatorial_formula — 2 instances, different modes (a) and (c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_admin_fee_tiered_rates
        grounds:
          - calculations.tiered_admin_fee
          - entities.TuitionInvoice.fields.admin_fee_cents
          - entities.Pod.fields.enrolled_count
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction:
          fee percentage is a step function of enrolled_count (4 tiers) applied
          to a subtotal that itself aggregates per-line rounded products;
          tier boundary at enrolled_count==8 vs ==9 flips the fee from 4% to 3%.
        test_recipe:
          setup:
            - "Pod ACTIVE with seat_capacity=12 and exactly 8 seats ENROLLED (tier boundary)."
            - "One additional Seat RESERVED (not yet enrolled) with a draft invoice of line_items: [{description:'Tuition', quantity:1, unit_amount_cents:100000, kind:'TUITION'}, {description:'Materials', quantity:3, unit_amount_cents:3333, kind:'FEE'}]."
            - "Per-line-then-sum subtotal = round_half_up(1*100000) + round_half_up(3*3333) = 100000 + 9999 = 109999."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /facility-sites"
              payload: { site_name: "Fee Site", address_line1: "9 Birch Ln", jurisdiction_code: "AZ-MARICOPA", zoning_class: "RESIDENTIAL_SINGLE", max_occupancy: 40, indoor_sqft: 1500 }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /pods"
              payload: { name: "Fee Pod", pod_code: "FEE26", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", seat_capacity: 12, tuition_full_year_cents: 1000000, min_guides_required: 1, facility_site_id: "${site_id}" }
              as: PodOperator
              captures: { pod_id: $.data.id }
            # ... standard policy/plan/licensing/staffing omitted in comment but assumed reachable via compose; see full recipes elsewhere
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat_id}/invoices/${invoice_id}/issue"
              payload: {}
              as: PodOperator
              captures: { admin_fee: $.data.admin_fee_cents, subtotal: $.data.subtotal_cents, total: $.data.total_cents }
          assert:
            - "subtotal_cents == 109999 (per-line rounding: 100000 + 9999)"
            - "At enrolled_count == 8, admin_fee_cents == round_half_up(109999 * 0.04) == 4400"
            - "total_cents == 109999 + 4400 == 114399"
            - "If enrolled_count had been 9 (one more ENROLLED seat), admin_fee_cents would be round_half_up(109999 * 0.03) == 3300 — a 1100-cent swing from crossing the tier boundary by one seat"

      - name: dissolution_refund_pool_waterfall
        grounds:
          - calculations.dissolution_refund_pool
          - entities.RefundClaim.fields.claimed_amount_cents
          - entities.Seat.fields.paid_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          pool depends on per-seat paid_cents (computed from CLEARED payments),
          earned_through_dissolution depends on prorated_tuition per seat,
          and per-claim refund depends on pool_remaining after prior buckets
          are filled (waterfall). Tie-break uses Seat.created_at ASC (never id).
        test_recipe:
          setup:
            - "Pod ACTIVE with 3 ENROLLED seats; seat_A paid 500000 via FAMILY, seat_B paid 400000 via VOUCHER, seat_C paid 300000 via FAMILY."
            - "All three enrolled on term start; dissolution at mid-term."
            - "Clock set to dissolution date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: site, pod, policies, plans, licensing, guide, 3 families, 3 students, 3 seats reserved+enrolled, payments cleared
          trigger:
            - call: "POST /pods/${pod_id}/dissolve"
              payload: { expected_pod_version: "${pod_v_pre_dissolve}", dissolution_reason: "operator withdrawal" }
              as: PodOperator
          assert:
            - "Pod.status == DISSOLVING AND Pod.posture == CLOSED"
            - "Exactly 3 RefundClaims with claim_kind=DISSOLUTION are created"
            - "Bucket 1 (voucher reimbursement) is filled before bucket 2 (family direct)"
            - "claimed_amount_cents per claim == pro-rata share per waterfall formula; rounding remainder allocated to the seat with earliest created_at"
            - "Each linked VoucherAccount funding_status == FROZEN immediately after the cascade"

  # =====================================================================
  # Rule 3: non_linear_state_machine — 2 instances, different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: licensing_determination_resubmit_cycle
        grounds:
          - state_machines.LicensingDetermination
          - state_machines.LicensingDetermination.transitions.DENIED_to_RESUBMITTED
          - state_machines.LicensingDetermination.transitions.RESUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Cyclic machine on LicensingDetermination: UNDER_REVIEW -> DENIED ->
          RESUBMITTED -> UNDER_REVIEW forms a revision loop with an
          incrementing revision_number; a pod can iterate multiple times.
        test_recipe:
          setup:
            - "Pod in FORMING state with a LicensingDetermination already SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /facility-sites"
              payload: { site_name: "Cycle Site", address_line1: "11 Elm St", jurisdiction_code: "AZ-MARICOPA", zoning_class: "COMMERCIAL", max_occupancy: 20, indoor_sqft: 900 }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
            - call: "POST /pods"
              payload: { name: "Cycle Pod", pod_code: "CYC26", academic_year: "2026-2027", term_start_date: "2026-08-01", term_end_date: "2027-05-31", seat_capacity: 8, tuition_full_year_cents: 800000, min_guides_required: 1, facility_site_id: "${site_id}" }
              as: PodOperator
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/safety-policies"
              payload: { policy_version: 1, emergency_plan_text: "", immunization_policy: "REQUIRED", background_check_required: true, drill_cadence_days: 30 }
              as: PodOperator
              captures: { sp_id: $.data.id }
            - call: "POST /pods/${pod_id}/safety-policies/${sp_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pods/${pod_id}/curriculum-plans"
              payload: { plan_name: "Plan C", grade_bands_covered: ["LOWER_EL"], multi_age_grouping: false, total_instructional_minutes_per_week: 1500 }
              as: PodOperator
              captures: { cp_id: $.data.id }
            - call: "POST /pods/${pod_id}/curriculum-plans/${cp_id}/submit"
              payload: {}
              as: PodOperator
            - call: "POST /pods/${pod_id}/curriculum-plans/${cp_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pods/${pod_id}/open-enrollment"
              payload: {}
              as: PodOperator
            - call: "POST /pods/${pod_id}/licensing-determinations"
              payload: { jurisdiction_code: "AZ-MARICOPA", submission_kind: "EXEMPTION_CLAIM" }
              as: PodOperator
              captures: { det_id: $.data.id, det_v0: $.data.version }
            - call: "POST /pods/${pod_id}/licensing-determinations/${det_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /pods/${pod_id}/licensing-determinations/${det_id}/decide"
              payload: { decision: "DENIED", denial_reason: "zoning COMMERCIAL not exemptible" }
              as: ComplianceOfficer
            - call: "POST /pods/${pod_id}/licensing-determinations/${det_id}/resubmit"
              payload: { revision_number: 1, submission_kind: "FULL_LICENSE" }
              as: PodOperator
            - call: "POST /pods/${pod_id}/licensing-determinations/${det_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "After decide(DENIED): determination_status == DENIED; Pod.status == FORMING (cascade)"
            - "After resubmit: determination_status == RESUBMITTED AND revision_number == 1"
            - "After second begin-review: determination_status == UNDER_REVIEW (cycle closed)"
            - "A second DENIED + resubmit pair (revision 2) MUST also be reachable, demonstrating the cycle is not a one-shot."

      - name: voucher_account_parallel_dimensions
        grounds:
          - state_machines.VoucherAccount
          - entities.VoucherAccount.fields.verification_status
          - entities.VoucherAccount.fields.funding_status
        distinguishing_aspect: |
          Parallel dimensions on VoucherAccount: verification_status
          (PENDING_VERIFICATION / VERIFIED / REJECTED) and funding_status
          (FUNDED / PARTIALLY_DEPLETED / DEPLETED / FROZEN) evolve
          independently — a FROZEN account can still be VERIFIED, and a
          PARTIALLY_DEPLETED account can transition to FROZEN via dissolution
          cascade without touching verification_status.
        test_recipe:
          setup:
            - "Student exists with a VoucherAccount (verification_status=PENDING_VERIFICATION, funding_status=FUNDED, awarded=600000, balance=600000)."
            - "A Pod-READY context exists; voucher is later verified; then a partial voucher payment clears; then the pod dissolves, freezing funding_status while verification_status remains VERIFIED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "VouchFam", primary_contact_email: "vf@x.com", billing_address_state: "AZ" }
              as: Registrar
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/students"
              payload: { legal_first_name: "Vic", legal_last_name: "Vouch", date_of_birth: "2016-05-01" }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /students/${student_id}/voucher-accounts"
              payload: { program_code: "AZ-ESA", awarded_annual_cents: 600000 }
              as: Registrar
              captures: { va_id: $.data.id, vs0: $.data.verification_status, fs0: $.data.funding_status }
          trigger:
            - call: "POST /voucher-accounts/${va_id}/verify"
              payload: {}
              as: ComplianceOfficer
              captures: { vs1: $.data.verification_status, fs1: $.data.funding_status }
          assert:
            - "Before verify: verification_status == PENDING_VERIFICATION AND funding_status == FUNDED (independent dimensions)"
            - "After verify: verification_status == VERIFIED AND funding_status == FUNDED (funding unchanged by verification)"
            - "A subsequent dissolution cascade MUST flip funding_status to FROZEN while verification_status remains VERIFIED (orthogonal transitions)."

  # =====================================================================
  # Rule 4: transitive_cascade — 2 instances, different triggers, one depth>=3
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: pod_dissolution_cascade_depth_4
        grounds:
          - state_machines.Pod.transitions.ACTIVE_to_DISSOLVING
          - state_machines.Pod.transitions.DISSOLVING_to_DISSOLVED
          - state_machines.Seat.transitions.ENROLLED_to_WITHDRAWN
          - state_machines.Family.transitions.ACTIVE_to_INACTIVE
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /pods/{id}/dissolve then
          /finalize-dissolution: Pod->DISSOLVING cascades to Seat WITHDRAWN,
          which cascades to Student WITHDRAWN, which (via finalization when
          all seats leave) cascades to Family INACTIVE. Each link is caused
          by the previous, not by the original action.
        test_recipe:
          setup:
            - "Pod ACTIVE with exactly 1 ENROLLED seat; seat's student is the only ENROLLED student of its family; family currently ACTIVE."
            - "No outstanding refund claims blocking finalization (or they are pre-decided)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: site, pod (ACTIVE), one family, one student, one seat RESERVED+ENROLLED, one tuition invoice, one cleared payment
          trigger:
            - call: "POST /pods/${pod_id}/dissolve"
              payload: { expected_pod_version: "${pod_v_pre}", dissolution_reason: "operator choice" }
              as: PodOperator
            - call: "POST /pods/${pod_id}/finalize-dissolution"
              payload: {}
              as: PlatformAdmin
          assert:
            - "After dissolve: Pod.status == DISSOLVING; Seat.seat_status == WITHDRAWN; Student.student_status == WITHDRAWN; Family.family_status still ACTIVE (cascade stops until finalization)"
            - "After finalize-dissolution: Pod.status == DISSOLVED; Seat.seat_status == RELEASED; Family.family_status == INACTIVE (depth-4 reached)"
            - "Each hop's mutation is caused by its parent hop, not by the original POST /dissolve directly."

      - name: guide_terminate_cascade_depth_2
        grounds:
          - state_machines.GuideAssignment.transitions.ACTIVE_to_TERMINATED_EARLY
          - entities.Pod.fields.compliance_flag
        distinguishing_aspect: |
          Depth-2 cascade triggered by POST /pods/{id}/guide-assignments/{asg_id}/terminate:
          assignment termination recomputes guide_to_student_ratio; if the
          ratio falls below 1/15, Pod auto-transitions ACTIVE -> SUSPENDED,
          which flips posture to FROZEN and blocks all child enrollment
          operations.
        test_recipe:
          setup:
            - "Pod ACTIVE with seat_capacity=12, 12 seats ENROLLED, exactly one ACTIVE CERTIFIED guide assignment (weekly_hours=30)."
            - "Current ratio = 1.0 / 12 = 0.0833 (AT_RISK, not VIOLATION). After terminating, ratio = 0/12 = 0 -> VIOLATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: site, pod ACTIVE, 12 seats ENROLLED, 1 ACTIVE guide assignment
          trigger:
            - call: "POST /pods/${pod_id}/guide-assignments/${asg_id}/terminate"
              payload: {}
              as: PodOperator
          assert:
            - "GuideAssignment.assignment_status == TERMINATED_EARLY"
            - "Pod.compliance_flag == VIOLATION (ratio 0 < 1/15)"
            - "Pod.status == SUSPENDED AND Pod.posture == FROZEN (cascade hop 2)"
            - "Any subsequent POST /pods/{id}/seats or /enroll returns ERR_POD_FROZEN (posture gating is observable)."

  # =====================================================================
  # Rule 5: priority_pair_validation_conflict — 2 instances, different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_pod_vs_capacity
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_POD_FROZEN]
          - errors[ERR_CAPACITY_FULL]
        distinguishing_aspect: |
          state (ERR_POD_FROZEN, priority 6) vs business_constraint
          (ERR_CAPACITY_FULL, priority 13): when a SUSPENDED pod is also at
          full capacity, an enroll attempt MUST return ERR_POD_FROZEN
          (higher priority), not ERR_CAPACITY_FULL.
        test_recipe:
          setup:
            - "Pod ACTIVE with seat_capacity=5 and 5 seats ENROLLED (at capacity)."
            - "Pod is then SUSPENDED by ComplianceOfficer (posture -> FROZEN)."
            - "A new Seat is RESERVED (pre-enrollment) against the pod."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: site, pod, policies, plans, licensing, guide, 5 families+students+seats, all ENROLLED, pod suspended
          trigger:
            - call: "POST /pods/${pod_id}/seats/${new_seat_id}/enroll"
              payload: { expected_pod_version: "${pod_v}" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "error_id == ERR_POD_FROZEN (state beats capacity at priorities 6 < 13)"
            - "Seat.seat_status remains RESERVED; Pod.enrolled_count unchanged."

      - name: safety_vs_constraint_overlap
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_SAFETY_POLICY_MISSING]
          - errors[ERR_GUIDE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          business_safety (ERR_SAFETY_POLICY_MISSING, priority 7) vs
          business_constraint (ERR_GUIDE_WINDOW_OVERLAP, priority 10): when
          POST /pods/{id}/open-enrollment is called on a pod that has no
          APPROVED safety policy, safety wins; conversely, when scheduling
          an overlapping guide assignment on an otherwise-compliant pod, the
          overlap error wins. The pairing exercises ordering across two
          different error categories.
        test_recipe:
          setup:
            - "Pod DRAFT with no SafetyPolicy at all; a Guide exists; two GuideAssignments already overlap each other (pre-created via direct endpoints bypassing overlap for setup purposes — or created sequentially with disjoint windows first, then a third overlapping one)."
            - "Scenario A: attempt open-enrollment (no safety policy)."
            - "Scenario B: pod has safety policy; attempt overlapping guide assignment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: site, pod (no policy), guide
          trigger:
            - call: "POST /pods/${pod_id}/open-enrollment"
              payload: {}
              as: PodOperator
              captures: { err_a: $.data.error_id }
          assert:
            - "Scenario A: error_id == ERR_SAFETY_POLICY_MISSING (priority 7 fires before any constraint check)"
            - "Scenario B (separately, with policy in place): POST /pods/{id}/guide-assignments with overlapping window returns ERR_GUIDE_WINDOW_OVERLAP (priority 10)"
            - "The two errors belong to different categories (safety vs constraint) and their relative priority is exercised by the dual-failure setup."

  # =====================================================================
  # Rule 6: boundary_precision_check — 2 instances, different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: exemption_capacity_threshold_10_vs_11
        grounds:
          - validations[priority=8]
          - errors[ERR_EXEMPTION_NOT_ELIGIBLE]
          - state_machines.LicensingDetermination.transitions.UNDER_REVIEW_to_EXEMPT_GRANTED
        distinguishing_aspect: |
          Numeric threshold on Pod.seat_capacity: at == 10 the exemption is
          granted (boundary inclusive); at == 11 it MUST be denied with
          ERR_EXEMPTION_NOT_ELIGIBLE. Exercised via POST
          /pods/{id}/licensing-determinations/{det_id}/decide.
        test_recipe:
          setup:
            - "Two pods, both FORMING->LICENSING_REVIEW, both on RESIDENTIAL_SINGLE sites."
            - "Pod A: seat_capacity=10. Pod B: seat_capacity=11."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: site, podA(cap=10) through begin-review, podB(cap=11) through begin-review
          trigger:
            - call: "POST /pods/${pod_a}/licensing-determinations/${det_a}/decide"
              payload: { decision: "EXEMPT_GRANTED" }
              as: ComplianceOfficer
              captures: { status_a: $.data.determination_status }
            - call: "POST /pods/${pod_b}/licensing-determinations/${det_b}/decide"
              payload: { decision: "EXEMPT_GRANTED" }
              as: ComplianceOfficer
              captures: { err_b: $.data.error_id }
          assert:
            - "Pod A: decision succeeds; determination_status == EXEMPT_GRANTED; Pod A cascades to ACTIVE (subject to guide precondition)."
            - "Pod B: HTTP 422 with error_id == ERR_EXEMPTION_NOT_ELIGIBLE; determination_status remains UNDER_REVIEW."
            - "Boundary: capacity == 10 grants; capacity == 11 denies."

      - name: voucher_funded_threshold_50pct
        grounds:
          - calculations.esa_voucher_disbursement
          - entities.VoucherAccount.fields.funding_status
          - state_machines.VoucherAccount.transitions.FUNDED_to_PARTIALLY_DEPLETED
        distinguishing_aspect: |
          Threshold on VoucherAccount.disbursable_balance_cents vs
          awarded_annual_cents * 0.50: at new_balance exactly == 50% the
          status stays FUNDED (>= inclusive); one cent below flips to
          PARTIALLY_DEPLETED. Exercised via POST /payments/{id}/clear.
        test_recipe:
          setup:
            - "VoucherAccount VERIFIED, awarded_annual_cents = 600000 (so 50% = 300000)."
            - "Pod ACTIVE with seat, invoice ISSUED for 300000 cents exactly (so clearing leaves balance = 300000 == threshold) and a second invoice for 1 cent (clearing leaves balance = 299999 < threshold)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: pod ACTIVE, family+student, voucher VERIFIED, seat ENROLLED, invoice1=300000, invoice2=1
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat_id}/invoices/${inv1}/payments"
              payload: { source_kind: "VOUCHER", amount_cents: 300000, voucher_account_id: "${va_id}" }
              as: Registrar
              captures: { pay1: $.data.id }
            - call: "POST /payments/${pay1}/clear"
              payload: {}
              as: PodOperator
              captures: { fs_after_1: $.data.payment_status }
            - call: "GET /voucher-accounts/${va_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { fs_check_1: $.data.funding_status }
          assert:
            - "After clearing payment1 (300000 of 600000): disbursable_balance_cents == 300000 == awarded*0.50 -> funding_status == FUNDED (boundary inclusive)"
            - "After clearing a subsequent 1-cent payment: balance == 299999 < threshold -> funding_status == PARTIALLY_DEPLETED"
            - "Crossing the threshold by exactly 1 cent flips the status."

  # =====================================================================
  # Rule 7: cross_entity_state_dependency — 2 instances, different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: seat_enroll_requires_pod_active
        grounds:
          - state_machines.Seat.transitions.RESERVED_to_ENROLLED
          - entities.Pod.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Seat->Pod pair: a Seat can only transition RESERVED->ENROLLED when
          its parent Pod.status == ACTIVE. If Pod is in FORMING or
          LICENSING_REVIEW, enroll returns ERR_INVALID_STATE (or
          ERR_POD_FROZEN when posture is FROZEN).
        test_recipe:
          setup:
            - "Pod in FORMING (not yet ACTIVE); a Seat is RESERVED against it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: site, pod, policies, plans, open-enrollment (FORMING); family+student+seat RESERVED
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat_id}/enroll"
              payload: { expected_pod_version: "${pod_v}" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id in {ERR_INVALID_STATE, ERR_POD_FROZEN} (pod not ACTIVE blocks enrollment)"
            - "Seat.seat_status remains RESERVED"

      - name: progress_conference_requires_approved_plan
        grounds:
          - state_machines.ProgressConference.transitions.REQUESTED_to_SCHEDULED
          - entities.CurriculumPlan.fields.plan_status
          - errors[ERR_PLAN_NOT_APPROVED]
        distinguishing_aspect: |
          ProgressConference->CurriculumPlan pair: scheduling a conference
          requires the referenced CurriculumPlan.plan_status == APPROVED.
          Referencing a DRAFT or SUBMITTED plan returns ERR_PLAN_NOT_APPROVED.
        test_recipe:
          setup:
            - "Pod ACTIVE; Seat ENROLLED; a CurriculumPlan exists but is only in SUBMITTED status."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: pod ACTIVE, seat ENROLLED, plan in SUBMITTED state (not yet approved)
          trigger:
            - call: "POST /pods/${pod_id}/progress-conferences"
              payload: { seat_id: "${seat_id}", curriculum_plan_id: "${cp_id}", scheduled_start: "2026-09-01T15:00:00Z", scheduled_end: "2026-09-01T15:30:00Z" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_PLAN_NOT_APPROVED"
            - "No ProgressConference row is persisted."

  # =====================================================================
  # Rule 8: resource_temporal_overlap — 2 instances, different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: guide_assignment_inclusive_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_GUIDE_WINDOW_OVERLAP]
          - entities.GuideAssignment.fields.window_start_date
          - entities.GuideAssignment.fields.window_end_date
        distinguishing_aspect: |
          Inclusive-both-ends interval semantics on GuideAssignment:
          [window_start_date, window_end_date]. A new assignment whose
          window_start_date equals an existing assignment's window_end_date
          overlaps (collision); one day later is safe. Same-guide resource.
        test_recipe:
          setup:
            - "Guide ACTIVE; Pod ACTIVE; existing GuideAssignment [2026-08-01, 2026-12-31] SCHEDULED for this guide."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: pod ACTIVE, guide, existing assignment
          trigger:
            - call: "POST /pods/${pod_id}/guide-assignments"
              payload: { guide_id: "${guide_id}", window_start_date: "2026-12-31", window_end_date: "2027-03-31", weekly_hours: 20 }
              as: PodOperator
              captures: { err_touch: $.data.error_id }
            - call: "POST /pods/${pod_id}/guide-assignments"
              payload: { guide_id: "${guide_id}", window_start_date: "2027-01-01", window_end_date: "2027-03-31", weekly_hours: 20 }
              as: PodOperator
              captures: { ok_after: $.data.id }
          assert:
            - "Start == existing end (2026-12-31): ERR_GUIDE_WINDOW_OVERLAP (inclusive boundary)"
            - "Start == existing end + 1 day (2027-01-01): succeeds (no overlap)"

      - name: progress_conference_half_open_overlap
        grounds:
          - validations[priority=11]
          - errors[ERR_CONFERENCE_OVERLAP]
          - entities.ProgressConference.fields.scheduled_start
          - entities.ProgressConference.fields.scheduled_end
        distinguishing_aspect: |
          Half-open [scheduled_start, scheduled_end) interval semantics on
          ProgressConference: a new conference starting exactly at the
          existing conference's scheduled_end does NOT overlap; starting one
          minute earlier DOES. Different geometry from guide assignments.
        test_recipe:
          setup:
            - "Pod ACTIVE; Seat ENROLLED; APPROVED CurriculumPlan; existing conference SCHEDULED 2026-09-01T15:00 - 2026-09-01T15:30 for the same guide."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: pod ACTIVE, seat ENROLLED, plan APPROVED, first conference SCHEDULED
          trigger:
            - call: "POST /pods/${pod_id}/progress-conferences"
              payload: { seat_id: "${seat_id}", curriculum_plan_id: "${cp_id}", scheduled_start: "2026-09-01T15:30:00Z", scheduled_end: "2026-09-01T16:00:00Z" }
              as: Guide
              as_user_id: "${guide_id}"
              captures: { conf2_id: $.data.id }
            - call: "POST /pods/${pod_id}/progress-conferences"
              payload: { seat_id: "${seat_id}", curriculum_plan_id: "${cp_id}", scheduled_start: "2026-09-01T15:29:00Z", scheduled_end: "2026-09-01T16:00:00Z" }
              as: Guide
              as_user_id: "${guide_id}"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "Start == existing end (15:30): succeeds (half-open; no overlap)"
            - "Start at 15:29 (1 minute before existing end): ERR_CONFERENCE_OVERLAP"

  # =====================================================================
  # Rule 9: compensating_invariant — 2 instances, different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: voucher_payment_clear_reverse_balance_invariant
        grounds:
          - state_machines.Payment.transitions.PENDING_to_CLEARED
          - state_machines.Payment.transitions.CLEARED_to_REVERSED
          - entities.VoucherAccount.fields.disbursable_balance_cents
        distinguishing_aspect: |
          Conserved quantity: VoucherAccount.disbursable_balance_cents.
          Posting a VOUCHER payment then reversing it MUST leave the balance
          unchanged (balance_after == balance_before), regardless of any
          intermediate funding_status transitions.
        test_recipe:
          setup:
            - "VoucherAccount VERIFIED with awarded = 600000, disbursable = 600000."
            - "Pod ACTIVE; Seat ENROLLED; invoice ISSUED for 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: pod ACTIVE, seat ENROLLED, voucher VERIFIED, invoice ISSUED
            - call: "GET /voucher-accounts/${va_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { balance_before: $.data.disbursable_balance_cents }
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat_id}/invoices/${inv_id}/payments"
              payload: { source_kind: "VOUCHER", amount_cents: 100000, voucher_account_id: "${va_id}" }
              as: Registrar
              captures: { pay_id: $.data.id }
            - call: "POST /payments/${pay_id}/clear"
              payload: {}
              as: PodOperator
            - call: "POST /payments/${pay_id}/reverse"
              payload: {}
              as: PlatformAdmin
            - call: "GET /voucher-accounts/${va_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { balance_after: $.data.disbursable_balance_cents }
          assert:
            - "VoucherAccount.disbursable_balance_cents after clear+reverse == balance_before (600000)"
            - "The pair (clear, reverse) is a compensating transaction with zero net drift."

      - name: seat_enroll_withdraw_count_invariant
        grounds:
          - state_machines.Seat.transitions.RESERVED_to_ENROLLED
          - state_machines.Seat.transitions.ENROLLED_to_WITHDRAWN
          - entities.Pod.fields.enrolled_count
        distinguishing_aspect: |
          Conserved quantity: Pod.enrolled_count. An enroll followed by a
          withdraw of the same seat MUST leave Pod.enrolled_count equal to
          its pre-enroll value; the derived counter never drifts.
        test_recipe:
          setup:
            - "Pod ACTIVE; one Seat RESERVED; Pod.enrolled_count = N (some value from prior seats, possibly 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            # ... compose: pod ACTIVE, seat RESERVED
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PodOperator
              captures: { count_before: $.data.enrolled_count, pod_v_pre: $.data.version }
          trigger:
            - call: "POST /pods/${pod_id}/seats/${seat_id}/enroll"
              payload: { expected_pod_version: "${pod_v_pre}" }
              as: Family
              as_user_id: "${fam_id}"
            - call: "POST /pods/${pod_id}/seats/${seat_id}/withdraw"
              payload: { withdrawn_on: "2026-08-20" }
              as: Family
              as_user_id: "${fam_id}"
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PodOperator
              captures: { count_after: $.data.enrolled_count }
          assert:
            - "Pod.enrolled_count after enroll+withdraw == count_before"
            - "Seat.seat_status == WITHDRAWN"
            - "The derived counter is exactly conserved (no off-by-one drift)."
