              payload: { owner_id: "${o_id}", lot_number: "L-701", sex_class: "STEER", head_count_in: 10, in_weight_total_lbs: 7000, purchase_cost_cents: 1400000, arrival_date: "2026-08-01" }
              as: FeedyardManager
