  # =========================================================================
  # Concurrency rules (OCC)
  # =========================================================================
  - rule_id: concurrency_occ_stale_version
    instances:
      - name: stale_formula_version_on_batch_create
        grounds:
          - concurrency_rules[batch-release-stale-formula]
          - validations[priority=23]
        distinguishing_aspect: |
          OCC on Formula.version when creating a ProductionBatch. After reading the
          formula at version V, another writer modifies it (V -> V+1). A batch create
          with expected_formula_version == V is rejected with 412 ERR_STALE_VERSION.
        test_recipe:
          setup:
            - "An ACTIVE Formula exists with all prerequisites met."
            - "Clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
