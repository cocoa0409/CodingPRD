scenario: |
  1857. Aircraft Leasing & Lease-Return Condition Management (commercial aircraft lessor): lease term & rent/utilization structure, maintenance reserve accrual per flight hour/cycle, return condition checklist & compensation negotiation, records completeness & back-to-birth traceability, technical inspection at redelivery, sub-lease & novation approval, default & repossession process, transition to next lessee scheduling

domain_name: aircraft-leasing-returns
api_prefix: /leasing

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - { name: msn, type: string, source: input, description: "Manufacturer serial number; unique across all aircraft" }
      - { name: model, type: string, source: input, description: "Aircraft model designation, e.g. A320-200" }
      - { name: manufacture_date, type: string, source: input, description: "ISO date of manufacture; start of back-to-birth records horizon" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: AVAILABLE, constraints: "AVAILABLE | ON_LEASE | IN_TRANSITION | REPOSSESSED" }
      - { name: total_flight_hours, type: number, source: computed, description: "Sum of flight_hours over UtilizationReport rows in status ACCEPTED across all leases of this aircraft; decremented on VOID", default: 0 }
      - { name: total_flight_cycles, type: integer, source: computed, description: "Sum of flight_cycles over UtilizationReport rows in status ACCEPTED across all leases of this aircraft; decremented on VOID", default: 0 }

  - name: Lessee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Operator legal name" }
      - { name: credit_tier, type: enum, source: input, description: "Credit assessment tier", default: B, constraints: "A | B | C" }
      - { name: status, type: enum, source: system, description: "Standing of the lessee", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector name" }
      - { name: license_number, type: string, source: input, description: "Certifying staff license number; unique" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; the leased airframe" }
      - { name: lessee_id, type: string, source: input, description: "FK -> Lessee.id; current obligor (reassigned on NOVATION approval)" }
      - { name: start_date, type: string, source: input, description: "ISO date; lease interval start (inclusive)" }
      - { name: end_date, type: string, source: input, description: "ISO date; lease interval end (exclusive) — half-open [start_date, end_date)" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Base monthly rent in cents; > 0" }
      - { name: reserve_rate_per_fh_cents, type: integer, source: input, description: "Maintenance reserve rate in cents per flight hour; >= 0" }
      - { name: reserve_rate_per_fc_cents, type: integer, source: input, description: "Maintenance reserve rate in cents per flight cycle; >= 0" }
      - { name: monthly_hour_cap, type: integer, source: input, description: "Included flight hours per month before overage tiers apply; > 0" }
      - { name: accrual_basis, type: enum, source: input, description: "Reserve accrual variant selector", default: ACTUAL, constraints: "ACTUAL | MINIMUM_GUARANTEE" }
      - { name: minimum_monthly_hours, type: number, source: input, description: "Minimum billable hours per month when accrual_basis == MINIMUM_GUARANTEE", default: 0 }
      - { name: status, type: enum, source: system, description: "Lease lifecycle", default: DRAFT, constraints: "DRAFT | ACTIVE | RETURN_INITIATED | RETURNED | CLOSED | DEFAULTED | TERMINATED" }
      - { name: reserve_accrued_cents, type: integer, source: computed, description: "Cumulative reserve accrued from accepted utilization reports; decremented by VOID reversal", default: 0 }
      - { name: reserve_reimbursed_cents, type: integer, source: computed, description: "Cumulative reserve paid out via PAID claims; decremented by payment reversal", default: 0 }
      - { name: reserve_forfeited_cents, type: integer, source: computed, description: "Reserve remainder forfeited to lessor at settlement", default: 0 }
      - { name: reserve_balance_cents, type: integer, source: computed, description: "reserve_accrued_cents - reserve_reimbursed_cents - reserve_forfeited_cents", default: 0 }
      - { name: approved_sublessee_id, type: string, source: system, description: "FK -> Lessee.id; set when a SUBLEASE NovationRequest is APPROVED; null otherwise", default: null }

  - name: UtilizationReport
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; report belongs to this lease" }
      - { name: period_month, type: string, source: input, description: "Reported month, format YYYY-MM; unique per lease among non-VOIDED reports" }
      - { name: flight_hours, type: number, source: input, description: "Flight hours in the period; >= 0" }
      - { name: flight_cycles, type: integer, source: input, description: "Flight cycles in the period; >= 0" }
      - { name: status, type: enum, source: system, description: "Review lifecycle", default: SUBMITTED, constraints: "SUBMITTED | ACCEPTED | DISPUTED | VOIDED" }
      - { name: dispute_reason, type: string, source: system, description: "Reason recorded when DISPUTED; null otherwise", default: null }
      - { name: posted_accrual_cents, type: integer, source: computed, description: "Reserve accrual posted when ACCEPTED (per maintenance_reserve_accrual); exactly reversed on VOID", default: 0 }

  - name: ReserveClaim
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; claim drawn against this lease's reserve" }
      - { name: maintenance_event_ref, type: string, source: input, description: "External reference of the maintenance event" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount requested by lessee; > 0" }
      - { name: approved_amount_cents, type: integer, source: system, description: "Amount approved at decide(APPROVE); <= claimed_amount_cents; null until decided", default: null }
      - { name: status, type: enum, source: system, description: "Claim lifecycle", default: SUBMITTED, constraints: "SUBMITTED | APPROVED | REJECTED | PAID" }

  - name: AircraftDocument
    parent: Aircraft
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: input, description: "FK -> Aircraft.id; document belongs to this airframe" }
      - { name: doc_type, type: enum, source: input, description: "Document class", constraints: "BIRTH_RECORD | AIRWORTHINESS_CERT | ENGINE_LOG | LLP_STATUS | OTHER" }
      - { name: doc_reference, type: string, source: input, description: "External document reference / number" }
      - { name: status, type: enum, source: system, description: "Verification lifecycle", default: SUBMITTED, constraints: "SUBMITTED | VERIFIED | REJECTED" }

  - name: ReturnCase
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; exactly one non-terminal ReturnCase per lease at any time" }
      - { name: status, type: enum, source: system, description: "Return workflow state", default: OPEN, constraints: "OPEN | RECORDS_VERIFIED | INSPECTION | NEGOTIATION | AGREED | SETTLED | CANCELLED" }
      - { name: round_count, type: integer, source: computed, description: "Number of compensation proposals made; increments on each proposal (self-loop)", default: 0 }
      - { name: current_proposal_cents, type: integer, source: system, description: "Lump-sum amount of the latest standing proposal; null before first proposal", default: null }
      - { name: current_proposer_side, type: enum, source: system, description: "Side that made the standing proposal", default: null, constraints: "LESSOR | LESSEE | null" }
      - { name: reinspection_count, type: integer, source: computed, description: "Number of NEGOTIATION -> INSPECTION loops used; hard cap MAX_REINSPECTIONS = 1", default: 0 }
      - { name: provisional_estimate_cents, type: integer, source: computed, description: "Severity-weighted provisional compensation computed at entry to NEGOTIATION (per-item rounding)", default: 0 }
      - { name: agreed_total_cents, type: integer, source: computed, description: "Final agreed compensation = current_proposal_cents captured at agree; null until AGREED", default: null }
      - { name: reserve_applied_cents, type: integer, source: computed, description: "Reserve offset applied at settlement (settlement_netting); null until SETTLED", default: null }
      - { name: settlement_cash_due_cents, type: integer, source: computed, description: "Cash due from lessee at settlement = agreed_total - reserve_applied; null until SETTLED", default: null }

  - name: ChecklistItem
    parent: ReturnCase
    common_fields: true
    fields:
      - { name: return_case_id, type: string, source: system, description: "FK -> ReturnCase.id; item generated from the fixed return-condition template at case creation" }
      - { name: item_code, type: enum, source: system, description: "Template line code; list reads sort by item_code ASC", constraints: "AIRFRAME | ENGINE | INTERIOR | PAINT" }
      - { name: severity, type: enum, source: system, description: "Template severity driving the provisional-estimate uplift: AIRFRAME=CRITICAL, ENGINE=MAJOR, INTERIOR=MINOR, PAINT=MINOR", constraints: "CRITICAL | MAJOR | MINOR" }
      - { name: status, type: enum, source: system, description: "Inspection outcome lifecycle", default: PENDING, constraints: "PENDING | COMPLIANT | NON_COMPLIANT | RECTIFIED | WAIVED | COMPENSATED" }
      - { name: rectification_cost_estimate_cents, type: integer, source: input, description: "Inspector estimate of rectification cost; required when outcome == NON_COMPLIANT; null otherwise", default: null }
      - { name: inspected_by_id, type: string, source: system, description: "X-User-ID of the TechInspector who last inspected the item (audit stamp, not a traversal relation)", default: null }

  - name: InspectionBooking
    parent: ReturnCase
    common_fields: false
    fields:
      - { name: return_case_id, type: string, source: input, description: "FK -> ReturnCase.id; booking belongs to this return case" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; booked inspector" }
      - { name: booking_date, type: string, source: input, description: "ISO calendar date (YYYY-MM-DD) the inspector is booked; capacity 1 booking per inspector per date" }

  - name: NovationRequest
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; lease whose obligor / sublease is under review" }
      - { name: request_type, type: enum, source: input, description: "NOVATION reassigns the obligor; SUBLEASE authorizes a sublessee", constraints: "NOVATION | SUBLEASE" }
      - { name: proposed_lessee_id, type: string, source: input, description: "FK -> Lessee.id; proposed counterparty; must differ from current lessee" }
      - { name: status, type: enum, source: system, description: "Approval chain state", default: SUBMITTED, constraints: "SUBMITTED | CREDIT_APPROVED | APPROVED | REJECTED" }
      - { name: credit_reviewed_by, type: string, source: system, description: "X-User-ID of the CreditOfficer who credit-approved (SoD stamp)", default: null }
      - { name: legal_reviewed_by, type: string, source: system, description: "X-User-ID of the LegalApprover who legal-approved (SoD stamp)", default: null }

  - name: DefaultCase
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; defaulted lease" }
      - { name: reason, type: string, source: input, description: "Default reason (e.g. rent arrears)" }
      - { name: cure_period_days, type: integer, source: input, description: "Days allowed to cure before repossession may be authorized; >= 0" }
      - { name: declared_at, type: string, source: system, description: "ISO datetime of declaration taken from the logical clock" }
      - { name: cure_deadline, type: string, source: computed, description: "declared_at + cure_period_days; repossession authorization requires clock strictly after this instant" }
      - { name: declared_by, type: string, source: system, description: "X-User-ID of the declaring CreditOfficer (SoD stamp)" }
      - { name: status, type: enum, source: system, description: "Default workflow state", default: DECLARED, constraints: "DECLARED | CURED | REPOSSESSION_AUTHORIZED | REPOSSESSED" }

  - name: TransitionSlot
    parent: Aircraft
    common_fields: true
    fields:
      - { name: aircraft_id, type: string, source: system, description: "FK -> Aircraft.id; aircraft being transitioned to its next lessee" }
      - { name: window_start, type: string, source: input, description: "ISO date; transition window start (closed interval, inclusive)" }
      - { name: window_end, type: string, source: input, description: "ISO date; transition window end (closed interval, inclusive); >= window_start" }
      - { name: next_operator_ref, type: string, source: input, description: "Free-text reference for the next operator (no FK)", default: null }
      - { name: status, type: enum, source: system, description: "Slot lifecycle", default: TENTATIVE, constraints: "TENTATIVE | CONFIRMED | COMPLETED | RELEASED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Aircraft
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_LEASE
        trigger: "cascade from POST /leasing/leases/{id}/activate"
        actor: system
        preconditions: ["lease activation validation passed (see Lease DRAFT->ACTIVE)"]
        side_effects: ["aircraft.updated_at refreshed", "aircraft.version incremented"]
      - from: ON_LEASE
        to: IN_TRANSITION
        trigger: "cascade from POST /leasing/return-cases/{id}/settle (lease RETURNED causes airframe handback)"
        actor: system
        preconditions: ["the lease being settled is the one currently ON_LEASE on this aircraft"]
        side_effects: ["covering TENTATIVE TransitionSlot auto-CONFIRMED per settle cascade selector (see Lease RETURN_INITIATED->RETURNED)"]
      - from: ON_LEASE
        to: REPOSSESSED
        trigger: "cascade from POST /leasing/default-cases/{id}/execute-repossession (lease TERMINATED causes airframe seizure)"
        actor: system
        preconditions: ["the terminated lease is the one currently ON_LEASE on this aircraft"]
        side_effects: ["every TransitionSlot of this aircraft in TENTATIVE or CONFIRMED -> RELEASED (conditional cascade: COMPLETED/RELEASED slots untouched)"]
      - from: IN_TRANSITION
        to: AVAILABLE
        trigger: "cascade from POST /leasing/transition-slots/{id}/advance to COMPLETED"
        actor: system
        preconditions: ["slot belongs to this aircraft"]
        side_effects: ["aircraft.version incremented"]
      - from: REPOSSESSED
        to: AVAILABLE
        trigger: "cascade from POST /leasing/transition-slots/{id}/advance to COMPLETED"
        actor: system
        preconditions: ["slot belongs to this aircraft"]
        side_effects: ["aircraft.version incremented"]

  - entity: Lessee
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /leasing/lessees/{id}/status { to: SUSPENDED }"
        actor: CreditOfficer
        preconditions: ["lessee.status == ACTIVE"]
        side_effects: ["lessee.version incremented"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /leasing/lessees/{id}/status { to: ACTIVE }"
        actor: CreditOfficer
        preconditions: ["lessee.status == SUSPENDED"]
        side_effects: ["lessee.version incremented"]

  - entity: Lease
    initial_state: DRAFT
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /leasing/leases/{id}/activate"
        actor: LessorAdmin
        preconditions:
          - "aircraft of lease.aircraft_id has status == AVAILABLE (cross-entity dependency)"
          - "records safety gate: aircraft has a VERIFIED AircraftDocument with doc_type == BIRTH_RECORD (back-to-birth anchor)"
          - "no other lease on the same aircraft with status IN {DRAFT, ACTIVE, RETURN_INITIATED, DEFAULTED} whose half-open [start_date, end_date) intersects this lease's [start_date, end_date)"
          - "lessee of lease.lessee_id has status == ACTIVE"
        side_effects:
          - "aircraft.status AVAILABLE -> ON_LEASE (cascade link 1)"
          - "lease.version incremented"
      - from: ACTIVE
        to: RETURN_INITIATED
        trigger: "POST /leasing/leases/{id}/initiate-return"
        actor: LessorAdmin
        preconditions:
          - "lease.status == ACTIVE"
          - "no ReturnCase for this lease with status NOT IN {SETTLED, CANCELLED} exists"
        side_effects:
          - "ReturnCase created (status OPEN, round_count 0, reinspection_count 0)"
          - "4 ChecklistItem rows created from the fixed template (AIRFRAME/CRITICAL, ENGINE/MAJOR, INTERIOR/MINOR, PAINT/MINOR), all PENDING"
          - "lease.version incremented"
      - from: RETURN_INITIATED
        to: ACTIVE
        trigger: "POST /leasing/leases/{id}/abort-return"
        actor: LessorAdmin
        preconditions: ["lease.status == RETURN_INITIATED", "the open ReturnCase has status IN {OPEN, RECORDS_VERIFIED} (no inspection booked yet)"]
        side_effects:
          - "the open ReturnCase -> CANCELLED (cascade)"
          - "lease.version incremented"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "cascade from POST /leasing/leases/{id}/default-cases"
        actor: system
        preconditions: ["no DefaultCase for this lease with status IN {DECLARED, REPOSSESSION_AUTHORIZED} exists"]
        side_effects: ["lease.version incremented"]
      - from: RETURN_INITIATED
        to: DEFAULTED
        trigger: "cascade from POST /leasing/leases/{id}/default-cases"
        actor: system
        preconditions: ["no DefaultCase for this lease with status IN {DECLARED, REPOSSESSION_AUTHORIZED} exists"]
        side_effects: ["lease.version incremented"]
      - from: DEFAULTED
        to: ACTIVE
        trigger: "cascade from POST /leasing/default-cases/{id}/cure"
        actor: system
        preconditions: ["default case DECLARED"]
        side_effects: ["lease.version incremented"]
      - from: DEFAULTED
        to: TERMINATED
        trigger: "cascade from POST /leasing/default-cases/{id}/execute-repossession (repossession causes lease termination — cascade link 1)"
        actor: system
        preconditions: ["default case REPOSSESSION_AUTHORIZED"]
        side_effects:
          - "aircraft.status ON_LEASE -> REPOSSESSED (cascade link 2, caused by this termination)"
          - "that aircraft status change itself releases its non-terminal TransitionSlots (cascade link 3, see Aircraft ON_LEASE->REPOSSESSED)"
          - "any ReturnCase of this lease with status NOT IN {SETTLED, CANCELLED} -> CANCELLED (conditional cascade)"
      - from: RETURN_INITIATED
        to: RETURNED
        trigger: "cascade from POST /leasing/return-cases/{id}/settle (settlement causes lease handback — cascade link 1)"
        actor: system
        preconditions: ["return case AGREED"]
        side_effects:
          - "aircraft.status ON_LEASE -> IN_TRANSITION (cascade link 2, caused by this handback)"
          - "that aircraft status change itself auto-confirms the covering TransitionSlot (cascade link 3): among this aircraft's slots with status TENTATIVE and window_start <= settle date <= window_end, pick earliest window_start, tie-break created_at ASC; none -> no auto-confirm"
          - "lease.version incremented"
      - from: RETURNED
        to: CLOSED
        trigger: "cascade from POST /leasing/transition-slots/{id}/advance to COMPLETED"
        actor: system
        preconditions: ["slot.aircraft_id == lease.aircraft_id", "lease.status == RETURNED (at most one such lease per aircraft)"]
        side_effects: ["lease.version incremented"]

  - entity: UtilizationReport
    initial_state: SUBMITTED
    terminal_states: [VOIDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /leasing/utilization-reports/{id}/review { decision: ACCEPT }"
        actor: LessorAdmin
        preconditions: ["report.status == SUBMITTED", "lease.status IN {ACTIVE, DEFAULTED, RETURN_INITIATED}"]
        side_effects:
          - "maintenance_reserve_accrual computed per lease.accrual_basis variant; report.posted_accrual_cents set"
          - "lease.reserve_accrued_cents += posted_accrual_cents; lease.reserve_balance_cents recomputed (ledger sync)"
          - "aircraft.total_flight_hours += flight_hours; aircraft.total_flight_cycles += flight_cycles (cross-entity ledger sync)"
          - "report.version incremented"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /leasing/utilization-reports/{id}/review { decision: DISPUTE, reason }"
        actor: LessorAdmin
        preconditions: ["report.status == SUBMITTED"]
        side_effects: ["report.dispute_reason set", "report.version incremented"]
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /leasing/utilization-reports/{id}/revise (cycle: dispute-revise loop)"
        actor: LesseeRep
        preconditions: ["report.status == DISPUTED", "acting lessee owns the lease (lease.lessee_id == X-User-ID)"]
        side_effects: ["flight_hours and flight_cycles replaced", "dispute_reason cleared to null", "report.version incremented"]
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /leasing/utilization-reports/{id}/void (compensating action of ACCEPT)"
        actor: LessorAdmin
        preconditions: ["report.status == ACCEPTED", "lease.status IN {ACTIVE, DEFAULTED, RETURN_INITIATED}"]
        side_effects:
          - "lease.reserve_accrued_cents -= posted_accrual_cents; lease.reserve_balance_cents recomputed (compensation)"
          - "aircraft.total_flight_hours -= flight_hours; aircraft.total_flight_cycles -= flight_cycles (compensation)"
          - "report.version incremented"

  - entity: ReserveClaim
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /leasing/reserve-claims/{id}/decide { decision: APPROVE, approved_amount_cents }"
        actor: LessorAdmin
        preconditions: ["claim.status == SUBMITTED", "0 < approved_amount_cents <= claimed_amount_cents"]
        side_effects: ["claim.approved_amount_cents set", "claim.version incremented"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /leasing/reserve-claims/{id}/decide { decision: REJECT }"
        actor: LessorAdmin
        preconditions: ["claim.status == SUBMITTED"]
        side_effects: ["claim.version incremented"]
      - from: APPROVED
        to: PAID
        trigger: "POST /leasing/reserve-claims/{id}/pay"
        actor: FinanceManager
        preconditions: ["claim.status == APPROVED (else ERR_CLAIM_NOT_PAYABLE)", "lease.reserve_balance_cents >= approved_amount_cents (boundary: equality is payable)"]
        side_effects:
          - "lease.reserve_reimbursed_cents += approved_amount_cents; lease.reserve_balance_cents recomputed (ledger sync)"
          - "claim.version incremented"
      - from: PAID
        to: APPROVED
        trigger: "POST /leasing/reserve-claims/{id}/reverse-payment (compensating action of pay)"
        actor: FinanceManager
        preconditions: ["claim.status == PAID", "lease.status NOT IN {RETURNED, CLOSED, TERMINATED}"]
        side_effects:
          - "lease.reserve_reimbursed_cents -= approved_amount_cents; lease.reserve_balance_cents recomputed (compensation)"
          - "claim.version incremented"

  - entity: ReturnCase
    initial_state: OPEN
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: OPEN
        to: RECORDS_VERIFIED
        trigger: "POST /leasing/return-cases/{id}/advance { to: RECORDS_VERIFIED }"
        actor: LessorAdmin
        preconditions:
          - "records gate: for every doc_type IN {BIRTH_RECORD, AIRWORTHINESS_CERT, ENGINE_LOG, LLP_STATUS} the aircraft has at least one VERIFIED AircraftDocument (boundary: all 4 required; 3 of 4 fails)"
        side_effects: ["return_case.version incremented"]
      - from: RECORDS_VERIFIED
        to: INSPECTION
        trigger: "POST /leasing/return-cases/{id}/advance { to: INSPECTION }"
        actor: LessorAdmin
        preconditions: ["return_case.status == RECORDS_VERIFIED"]
        side_effects: ["return_case.version incremented"]
      - from: INSPECTION
        to: NEGOTIATION
        trigger: "POST /leasing/return-cases/{id}/advance { to: NEGOTIATION }"
        actor: LessorAdmin
        preconditions:
          - "checklist gate: zero ChecklistItem rows of this case in status IN {PENDING, RECTIFIED} (empty-set boundary)"
        side_effects:
          - "return_compensation provisional variant computed: provisional_estimate_cents = SUM over items with status NON_COMPLIANT of round_half_up(rectification_cost_estimate_cents x severity uplift) — per-item rounding pinned (see calculations)"
          - "return_case.version incremented"
      - from: NEGOTIATION
        to: NEGOTIATION
        trigger: "POST /leasing/return-cases/{id}/proposals (negotiation-round self-loop)"
        actor: "LessorAdmin (side LESSOR) or LesseeRep (side LESSEE)"
        preconditions:
          - "return_case.status == NEGOTIATION"
          - "alternation: round_count == 0 requires side LESSOR; otherwise the proposing side must differ from current_proposer_side"
          - "amount_cents >= 0"
        side_effects: ["round_count += 1", "current_proposal_cents := amount_cents", "current_proposer_side := actor side", "return_case.version incremented"]
      - from: NEGOTIATION
        to: INSPECTION
        trigger: "POST /leasing/return-cases/{id}/request-reinspection (re-inspection loop)"
        actor: LesseeRep
        preconditions: ["return_case.status == NEGOTIATION", "reinspection_count < MAX_REINSPECTIONS (1) else ERR_REINSPECTION_LIMIT", "acting lessee owns the lease"]
        side_effects:
          - "reinspection_count += 1"
          - "every ChecklistItem in status NON_COMPLIANT -> PENDING (conditional cascade; COMPLIANT/WAIVED/COMPENSATED untouched)"
          - "round_count and current_proposal_* are preserved"
          - "return_case.version incremented"
      - from: NEGOTIATION
        to: AGREED
        trigger: "POST /leasing/return-cases/{id}/agree (OCC-guarded)"
        actor: "LessorAdmin (side LESSOR) or LesseeRep (side LESSEE)"
        preconditions:
          - "return_case.status == NEGOTIATION"
          - "round_count >= 1 (a standing proposal exists)"
          - "agreeing side must differ from current_proposer_side (else ERR_PROPOSER_ALTERNATION)"
          - "expected_return_case_version == return_case.version (else ERR_STALE_VERSION)"
        side_effects: ["agreed_total_cents := current_proposal_cents (final variant of return_compensation)", "return_case.version incremented"]
      - from: AGREED
        to: SETTLED
        trigger: "POST /leasing/return-cases/{id}/settle"
        actor: FinanceManager
        preconditions: ["return_case.status == AGREED"]
        side_effects:
          - "settlement_netting computed (pinned evaluation order, see calculations): reserve_applied_cents and settlement_cash_due_cents set; lease.reserve_forfeited_cents += (balance - applied); lease.reserve_balance_cents := 0"
          - "every ChecklistItem still NON_COMPLIANT -> COMPENSATED (conditional cascade)"
          - "every ReserveClaim of this lease in status SUBMITTED or APPROVED -> REJECTED (conditional cascade; PAID claims untouched)"
          - "lease RETURN_INITIATED -> RETURNED (cascade link 1), which cascades to aircraft and TransitionSlot (links 2 and 3; see Lease)"
          - "return_case.version incremented"

  - entity: ChecklistItem
    initial_state: PENDING
    terminal_states: [COMPLIANT, WAIVED, COMPENSATED]
    transitions:
      - from: PENDING
        to: COMPLIANT
        trigger: "POST /leasing/checklist-items/{id}/inspect { outcome: COMPLIANT }"
        actor: TechInspector
        preconditions:
          - "item.status == PENDING"
          - "parent ReturnCase.status == INSPECTION"
          - "booking gate: an InspectionBooking exists with return_case_id == item.return_case_id, inspector_id == X-User-ID, booking_date == logical-clock current date (else ERR_BOOKING_REQUIRED)"
        side_effects: ["item.inspected_by_id := X-User-ID", "item.version incremented"]
      - from: PENDING
        to: NON_COMPLIANT
        trigger: "POST /leasing/checklist-items/{id}/inspect { outcome: NON_COMPLIANT, rectification_cost_estimate_cents }"
        actor: TechInspector
        preconditions: ["same booking gate as PENDING -> COMPLIANT", "rectification_cost_estimate_cents > 0 (ERR_INVALID_REQUEST otherwise)"]
        side_effects: ["item.rectification_cost_estimate_cents set", "item.inspected_by_id := X-User-ID", "item.version incremented"]
      - from: NON_COMPLIANT
        to: RECTIFIED
        trigger: "POST /leasing/checklist-items/{id}/rectify"
        actor: LesseeRep
        preconditions: ["item.status == NON_COMPLIANT", "acting lessee owns the lease"]
        side_effects: ["item.version incremented"]
      - from: RECTIFIED
        to: COMPLIANT
        trigger: "POST /leasing/checklist-items/{id}/inspect { outcome: COMPLIANT } (re-inspection)"
        actor: TechInspector
        preconditions: ["same booking gate as PENDING -> COMPLIANT"]
        side_effects: ["item.inspected_by_id := X-User-ID", "item.version incremented"]
      - from: RECTIFIED
        to: NON_COMPLIANT
        trigger: "POST /leasing/checklist-items/{id}/inspect { outcome: NON_COMPLIANT } (re-inspection fail loop)"
        actor: TechInspector
        preconditions: ["same booking gate as PENDING -> COMPLIANT", "rectification_cost_estimate_cents > 0"]
        side_effects: ["item.rectification_cost_estimate_cents overwritten", "item.version incremented"]
      - from: NON_COMPLIANT
        to: WAIVED
        trigger: "POST /leasing/checklist-items/{id}/waive"
        actor: LessorAdmin
        preconditions: ["item.status == NON_COMPLIANT"]
        side_effects: ["item.version incremented"]
      - from: NON_COMPLIANT
        to: COMPENSATED
        trigger: "cascade from POST /leasing/return-cases/{id}/settle"
        actor: system
        preconditions: ["parent return case AGREED"]
        side_effects: ["item.version incremented"]

  - entity: NovationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: CREDIT_APPROVED
        trigger: "POST /leasing/novation-requests/{id}/review { decision: APPROVE }"
        actor: CreditOfficer
        preconditions: ["request.status == SUBMITTED"]
        side_effects: ["credit_reviewed_by := X-User-ID", "request.version incremented"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /leasing/novation-requests/{id}/review { decision: REJECT }"
        actor: CreditOfficer
        preconditions: ["request.status == SUBMITTED"]
        side_effects: ["credit_reviewed_by := X-User-ID", "request.version incremented"]
      - from: CREDIT_APPROVED
        to: APPROVED
        trigger: "POST /leasing/novation-requests/{id}/review { decision: APPROVE }"
        actor: LegalApprover
        preconditions:
          - "request.status == CREDIT_APPROVED"
          - "segregation of duties: X-User-ID != credit_reviewed_by (else ERR_SOD_VIOLATION)"
          - "proposed lessee still has status == ACTIVE (cross-entity dependency, else ERR_LESSEE_NOT_ACTIVE)"
        side_effects:
          - "legal_reviewed_by := X-User-ID"
          - "request_type NOVATION: lease.lessee_id := proposed_lessee_id, lease.version incremented"
          - "request_type SUBLEASE: lease.approved_sublessee_id := proposed_lessee_id, lease.version incremented"
          - "request.version incremented"
      - from: CREDIT_APPROVED
        to: REJECTED
        trigger: "POST /leasing/novation-requests/{id}/review { decision: REJECT }"
        actor: LegalApprover
        preconditions: ["request.status == CREDIT_APPROVED", "X-User-ID != credit_reviewed_by (ERR_SOD_VIOLATION)"]
        side_effects: ["legal_reviewed_by := X-User-ID", "request.version incremented"]

  - entity: DefaultCase
    initial_state: DECLARED
    terminal_states: [CURED, REPOSSESSED]
    transitions:
      - from: DECLARED
        to: CURED
        trigger: "POST /leasing/default-cases/{id}/cure"
        actor: CreditOfficer
        preconditions: ["case.status == DECLARED"]
        side_effects: ["lease DEFAULTED -> ACTIVE (compensation revert)", "case.version incremented"]
      - from: DECLARED
        to: REPOSSESSION_AUTHORIZED
        trigger: "POST /leasing/default-cases/{id}/authorize-repossession"
        actor: LegalApprover
        preconditions:
          - "case.status == DECLARED"
          - "logical clock strictly after cure_deadline (else ERR_CURE_DEADLINE_NOT_PASSED)"
          - "segregation of duties: X-User-ID != declared_by (else ERR_SOD_VIOLATION)"
        side_effects: ["case.version incremented"]
      - from: REPOSSESSION_AUTHORIZED
        to: REPOSSESSED
        trigger: "POST /leasing/default-cases/{id}/execute-repossession"
        actor: LessorAdmin
        preconditions: ["case.status == REPOSSESSION_AUTHORIZED"]
        side_effects:
          - "lease DEFAULTED -> TERMINATED (cascade link 1), which cascades to aircraft REPOSSESSED (link 2) and TransitionSlot release + ReturnCase cancellation (link 3; see Lease DEFAULTED->TERMINATED)"
          - "case.version incremented"

  - entity: TransitionSlot
    initial_state: TENTATIVE
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: TENTATIVE
        to: CONFIRMED
        trigger: "POST /leasing/transition-slots/{id}/advance { to: CONFIRMED } or settle auto-confirm cascade"
        actor: LessorAdmin
        preconditions: ["slot.status == TENTATIVE", "aircraft.status IN {IN_TRANSITION, REPOSSESSED}"]
        side_effects: ["slot.version incremented"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /leasing/transition-slots/{id}/advance { to: COMPLETED }"
        actor: LessorAdmin
        preconditions: ["slot.status == CONFIRMED"]
        side_effects:
          - "aircraft.status IN_TRANSITION -> AVAILABLE or REPOSSESSED -> AVAILABLE"
          - "the lease of this aircraft with status RETURNED (if any) -> CLOSED"
          - "slot.version incremented"
      - from: TENTATIVE
        to: RELEASED
        trigger: "POST /leasing/transition-slots/{id}/advance { to: RELEASED } or repossession cascade"
        actor: LessorAdmin
        preconditions: ["slot.status == TENTATIVE"]
        side_effects: ["slot.version incremented"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /leasing/transition-slots/{id}/advance { to: RELEASED } or repossession cascade"
        actor: LessorAdmin
        preconditions: ["slot.status == CONFIRMED"]
        side_effects: ["slot.version incremented"]

  - entity: AircraftDocument
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /leasing/documents/{id}/review { decision: VERIFIED }"
        actor: LessorAdmin
        preconditions: ["document.status == SUBMITTED"]
        side_effects: ["document.version incremented"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /leasing/documents/{id}/review { decision: REJECT }"
        actor: LessorAdmin
        preconditions: ["document.status == SUBMITTED"]
        side_effects: ["document.version incremented"]

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: lease-amend-stale-version
    parent_entity: Lease
    write_endpoint: "PATCH /leasing/leases/{id}"
    occ_field: expected_lease_version
    description: |
      Amending a Lease whose version has advanced past the version the client
      last observed is rejected. A prior amendment (or any cascade that bumped
      lease.version, e.g. activation or novation reassignment) makes the
      writer's view stale; the write is refused rather than silently layered.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: return-agree-stale-version
    parent_entity: ReturnCase
    write_endpoint: "POST /leasing/return-cases/{id}/agree"
    occ_field: expected_return_case_version
    description: |
      Recording agreement on a ReturnCase whose version has advanced past the
      version the client last observed (e.g. a further proposal round or a
      re-inspection loop superseded the standing proposal) is rejected: the
      agreement would bind terms the counterparty never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: maintenance_reserve_accrual
    trigger: "UtilizationReport SUBMITTED -> ACCEPTED"
    algorithm: aggregation
    formula: |
      hours = report.flight_hours                      # variant input selection below
      billable_hours = hours                           # ACTUAL variant
      # MINIMUM_GUARANTEE variant: billable_hours = max(hours, lease.minimum_monthly_hours)
      accrual_cents = round_half_up(billable_hours * lease.reserve_rate_per_fh_cents)
                    + report.flight_cycles * lease.reserve_rate_per_fc_cents
      report.posted_accrual_cents := accrual_cents
      lease.reserve_accrued_cents += accrual_cents
      lease.reserve_balance_cents := reserve_accrued_cents - reserve_reimbursed_cents - reserve_forfeited_cents
    input_set: "the single UtilizationReport being accepted; lease terms from its parent Lease"
    constants:
      ROUNDING: "round_half_up to whole cents applied once to the flight-hour term"
    precision: "integer cents"
    variants:
      - name: ACTUAL
        when: "lease.accrual_basis == ACTUAL"
        difference: "billable_hours = reported flight_hours"
      - name: MINIMUM_GUARANTEE
        when: "lease.accrual_basis == MINIMUM_GUARANTEE"
        difference: "billable_hours = max(reported flight_hours, lease.minimum_monthly_hours); diverges from ACTUAL exactly when reported hours < minimum_monthly_hours"

  - name: monthly_lease_charge
    trigger: "GET /leasing/leases/{id}/monthly-charge?month=YYYY-MM"
    algorithm: tiered_pricing
    formula: |
      hours = flight_hours of the UtilizationReport with period_month == month AND status == ACCEPTED; 0 if none
      cycles = flight_cycles of that same report; 0 if none
      overage_hours = max(0, hours - lease.monthly_hour_cap)
      tier1_hours = min(overage_hours, TIER1_LIMIT_HOURS)
      tier2_hours = max(0, overage_hours - TIER1_LIMIT_HOURS)
      overage_cents = round_half_up(tier1_hours * TIER1_RATE_CENTS) + round_half_up(tier2_hours * TIER2_RATE_CENTS)
      cycle_surcharge_cents = CYCLE_SURCHARGE_CENTS if cycles * CYCLE_RATIO_DEN > hours * CYCLE_RATIO_NUM else 0
      total_cents = lease.monthly_rent_cents + overage_cents + cycle_surcharge_cents
    input_set: "only the ACCEPTED UtilizationReport for the requested month; SUBMITTED/DISPUTED/VOIDED reports are excluded"
    constants:
      TIER1_LIMIT_HOURS: 50
      TIER1_RATE_CENTS: 5000
      TIER2_RATE_CENTS: 7500
      CYCLE_RATIO_NUM: 1
      CYCLE_RATIO_DEN: 2
      CYCLE_SURCHARGE_CENTS: 25000
    precision: "integer cents; round_half_up applied per tier term before summation"

  - name: return_compensation
    trigger: "provisional variant: ReturnCase INSPECTION -> NEGOTIATION; final variant: ReturnCase NEGOTIATION -> AGREED"
    algorithm: weighted_scoring
    formula: |
      # provisional variant (at begin-negotiation) — per-item rounding pinned:
      #   for each ChecklistItem with status == NON_COMPLIANT:
      #     line_cents = round_half_up(item.rectification_cost_estimate_cents * UPLIFT[item.severity])
      #   provisional_estimate_cents = SUM(line_cents)          # round per item, THEN sum
      # final variant (at agree):
      #   agreed_total_cents = return_case.current_proposal_cents  (negotiated lump sum)
    input_set: "ChecklistItem rows of the return case with status NON_COMPLIANT at the moment of entry to NEGOTIATION; WAIVED/COMPLIANT/RECTIFIED excluded"
    constants:
      UPLIFT_CRITICAL: 1.50
      UPLIFT_MAJOR: 1.25
      UPLIFT_MINOR: 1.10
    precision: "integer cents; round_half_up per line item, then sum (order pinned: per-item first)"
    variants:
      - name: provisional_estimate
        when: "on entry to NEGOTIATION"
        difference: "severity-weighted, per-item-rounded sum of inspector estimates"
      - name: final_agreed
        when: "on agree"
        difference: "the negotiated lump sum current_proposal_cents; generally differs from the provisional estimate for the same items"

  - name: settlement_netting
    trigger: "ReturnCase AGREED -> SETTLED"
    algorithm: waterfall_allocation
    formula: |
      # Pinned evaluation order (steps MUST execute in this sequence):
      # 1. balance := lease.reserve_balance_cents   (accruals minus paid claims, before any forfeiture)
      # 2. reserve_applied_cents := min(balance, return_case.agreed_total_cents)
      # 3. settlement_cash_due_cents := agreed_total_cents - reserve_applied_cents
      # 4. forfeited := balance - reserve_applied_cents
      # 5. lease.reserve_forfeited_cents += forfeited ; lease.reserve_balance_cents := 0
      # Reordering (e.g. forfeiting the balance before offsetting) yields different
      # reserve_applied_cents and settlement_cash_due_cents — the order above is normative.
    input_set: "parent Lease reserve fields and return_case.agreed_total_cents"
    constants: {}
    precision: "integer cents"

  - name: records_completeness_score
    trigger: "ReturnCase OPEN -> RECORDS_VERIFIED gate; also surfaced on GET /leasing/aircraft/{id}"
    algorithm: threshold
    formula: |
      required = {BIRTH_RECORD, AIRWORTHINESS_CERT, ENGINE_LOG, LLP_STATUS}
      verified = count of doc_type in required for which aircraft has >= 1 AircraftDocument with status == VERIFIED
      score = verified / 4
      gate: advance allowed iff verified == 4 (score exactly 1.0; 3 of 4 == 0.75 fails)
    input_set: "AircraftDocument rows of the aircraft with status VERIFIED; SUBMITTED and REJECTED excluded"
    constants:
      REQUIRED_DOC_TYPES: "BIRTH_RECORD, AIRWORTHINESS_CERT, ENGINE_LOG, LLP_STATUS"
    precision: "score informational; gate is an exact integer count comparison (4 == 4)"

  - name: aircraft_utilization_totals
    trigger: "UtilizationReport ACCEPT (add) and VOID (reverse)"
    algorithm: aggregation
    formula: |
      aircraft.total_flight_hours = SUM(flight_hours) over all UtilizationReport rows with status == ACCEPTED
                                    belonging to leases whose aircraft_id == aircraft.id
      aircraft.total_flight_cycles = SUM(flight_cycles) over the same set
      # VOID of an accepted report decrements exactly the posted values; accept-then-void is a no-op net.
    input_set: "UtilizationReport rows with status ACCEPTED only, across every lease of the aircraft"
    constants: {}
    precision: "hours to 1 decimal; cycles integer"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID header present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's role list; for entity-backed ownership endpoints, X-User-ID must equal the owning entity id (LesseeRep: lease.lessee_id; TechInspector booking gate is priority 8)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "every id in the path exists, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "request body well-formed: required fields present, enum values in their declared set, numeric ranges respected, end_date > start_date, window_end >= window_start, proposed_lessee_id != lease.lessee_id", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 5, category: state, check: "target resource is in a from-state the transition allows (e.g. pay requires APPROVED; activate requires DRAFT; decide requires SUBMITTED)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "reserve claim being paid is in APPROVED status", error_id: ERR_CLAIM_NOT_PAYABLE, http_status: 409, applies_to: ["POST /leasing/reserve-claims/{id}/pay"] }
  - { priority: 6, category: business_safety, check: "records safety gate: aircraft holds VERIFIED BIRTH_RECORD at lease activation; all 4 required doc types VERIFIED at return records-review", error_id: ERR_RECORDS_INCOMPLETE, http_status: 409, applies_to: ["POST /leasing/leases/{id}/activate", "POST /leasing/return-cases/{id}/advance"] }
  - { priority: 7, category: business_temporal, check: "no half-open [start_date, end_date) overlap with another lease on the same aircraft in status DRAFT/ACTIVE/RETURN_INITIATED/DEFAULTED; adjacency (start == other end) is allowed", error_id: ERR_LEASE_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /leasing/leases/{id}/activate"] }
  - { priority: 7, category: business_temporal, check: "transition slot windows on the same aircraft with status TENTATIVE/CONFIRMED must keep a buffer: conflict unless new window clears the existing one by more than TRANSITION_BUFFER_DAYS (2) whole days on either side; closed-interval semantics, adjacency within buffer is a conflict", error_id: ERR_SLOT_WINDOW_CONFLICT, http_status: 409, applies_to: ["POST /leasing/aircraft/{id}/transition-slots"] }
  - { priority: 7, category: business_temporal, check: "repossession authorization requires logical clock strictly after cure_deadline", error_id: ERR_CURE_DEADLINE_NOT_PASSED, http_status: 409, applies_to: ["POST /leasing/default-cases/{id}/authorize-repossession"] }
  - { priority: 8, category: business_constraint, check: "inspector day-capacity: at most 1 InspectionBooking per inspector_id per booking_date (discrete-day capacity semantics)", error_id: ERR_INSPECTOR_DOUBLE_BOOKED, http_status: 409, applies_to: ["POST /leasing/return-cases/{id}/inspection-bookings"] }
  - { priority: 8, category: business_constraint, check: "(lease_id, period_month) unique among non-VOIDED utilization reports", error_id: ERR_DUPLICATE_REPORT_PERIOD, http_status: 409, applies_to: ["POST /leasing/leases/{id}/utilization-reports"] }
  - { priority: 8, category: business_constraint, check: "checklist gate: zero items in PENDING or RECTIFIED before entering NEGOTIATION", error_id: ERR_CHECKLIST_INCOMPLETE, http_status: 409, applies_to: ["POST /leasing/return-cases/{id}/advance"] }
  - { priority: 8, category: business_constraint, check: "negotiation alternation: first proposal from LESSOR side; subsequent proposals and the agree call must come from the side that did not make the standing proposal", error_id: ERR_PROPOSER_ALTERNATION, http_status: 409, applies_to: ["POST /leasing/return-cases/{id}/proposals", "POST /leasing/return-cases/{id}/agree"] }
  - { priority: 8, category: business_constraint, check: "reinspection_count < 1 before another NEGOTIATION -> INSPECTION loop", error_id: ERR_REINSPECTION_LIMIT, http_status: 409, applies_to: ["POST /leasing/return-cases/{id}/request-reinspection"] }
  - { priority: 8, category: business_constraint, check: "segregation of duties: novation legal reviewer != credit reviewer; repossession authorizer != default declarer", error_id: ERR_SOD_VIOLATION, http_status: 409, applies_to: ["POST /leasing/novation-requests/{id}/review", "POST /leasing/default-cases/{id}/authorize-repossession"] }
  - { priority: 8, category: business_constraint, check: "booking gate: inspecting TechInspector holds an InspectionBooking for this return case on the logical-clock current date", error_id: ERR_BOOKING_REQUIRED, http_status: 403, applies_to: ["POST /leasing/checklist-items/{id}/inspect"] }
  - { priority: 9, category: business_referential, check: "aircraft.status == AVAILABLE at lease activation", error_id: ERR_AIRCRAFT_NOT_AVAILABLE, http_status: 409, applies_to: ["POST /leasing/leases/{id}/activate"] }
  - { priority: 9, category: business_referential, check: "lessee.status == ACTIVE for lease activation and for novation legal approval (proposed lessee)", error_id: ERR_LESSEE_NOT_ACTIVE, http_status: 409, applies_to: ["POST /leasing/leases/{id}/activate", "POST /leasing/novation-requests/{id}/review"] }
  - { priority: 9, category: business_referential, check: "no DefaultCase in DECLARED or REPOSSESSION_AUTHORIZED status on the lease currently holding this aircraft (status ACTIVE/RETURN_INITIATED/DEFAULTED) when scheduling a transition slot", error_id: ERR_DEFAULT_CASE_OPEN, http_status: 409, applies_to: ["POST /leasing/aircraft/{id}/transition-slots"] }
  - { priority: 10, category: business_fiscal, check: "lease.reserve_balance_cents >= claim.approved_amount_cents at payment (equality allowed)", error_id: ERR_RESERVE_BALANCE_EXCEEDED, http_status: 422, applies_to: ["POST /leasing/reserve-claims/{id}/pay"] }
  - { priority: 10, category: business_fiscal, check: "decide(APPROVE) supplies approved_amount_cents with 0 < amount <= claimed_amount_cents", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: ["POST /leasing/reserve-claims/{id}/decide"] }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- aircraft & documents & transition slots ---
  - { method: POST, path: "/leasing/aircraft", description: "Register an aircraft (status starts AVAILABLE)", roles: [LessorAdmin], code: 201, input: [msn, model, manufacture_date], output: Aircraft, side_effects: [] }
  - { method: GET, path: "/leasing/aircraft/{id}", description: "Fetch one aircraft including computed totals and records score", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, LesseeRep, TechInspector], code: 200, input: [], output: Aircraft, side_effects: [] }
  - { method: POST, path: "/leasing/aircraft/{id}/documents", description: "Submit a records document (status SUBMITTED)", roles: [LessorAdmin], code: 201, input: [doc_type, doc_reference], output: AircraftDocument, side_effects: [] }
  - { method: GET, path: "/leasing/aircraft/{id}/documents", description: "List documents of an aircraft (FK reverse), sorted by created_at ASC", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, LesseeRep, TechInspector], code: 200, input: ["limit?", "offset?"], output: "AircraftDocument[]", side_effects: [] }
  - { method: POST, path: "/leasing/documents/{id}/review", description: "Verify or reject a records document", roles: [LessorAdmin], code: 200, input: [decision], output: AircraftDocument, side_effects: ["AircraftDocument SUBMITTED -> VERIFIED or REJECTED"] }
  - { method: POST, path: "/leasing/aircraft/{id}/transition-slots", description: "Create a transition slot (TENTATIVE) with 2-day buffer conflict check", roles: [LessorAdmin], code: 201, input: [window_start, window_end, "next_operator_ref?"], output: TransitionSlot, side_effects: [] }
  - { method: GET, path: "/leasing/aircraft/{id}/transition-slots", description: "List transition slots of an aircraft (FK reverse), sorted by window_start ASC then created_at ASC", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, LesseeRep, TechInspector], code: 200, input: ["limit?", "offset?"], output: "TransitionSlot[]", side_effects: [] }
  - { method: POST, path: "/leasing/transition-slots/{id}/advance", description: "Advance slot to CONFIRMED / COMPLETED / RELEASED with cascades per state machine", roles: [LessorAdmin], code: 200, input: [to], output: TransitionSlot, side_effects: ["aircraft/lease cascades per TransitionSlot transitions"] }

  # --- lessees & inspectors ---
  - { method: POST, path: "/leasing/lessees", description: "Register a lessee (status ACTIVE, credit_tier default B)", roles: [LessorAdmin], code: 201, input: [legal_name, "credit_tier?"], output: Lessee, side_effects: [] }
  - { method: GET, path: "/leasing/lessees", description: "Paginated lessee list", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Lessee[]", side_effects: [] }
  - { method: GET, path: "/leasing/lessees/{id}", description: "Fetch one lessee", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, LesseeRep], code: 200, input: [], output: Lessee, side_effects: [] }
  - { method: POST, path: "/leasing/lessees/{id}/status", description: "Suspend or reinstate a lessee", roles: [CreditOfficer], code: 200, input: [to], output: Lessee, side_effects: ["Lessee ACTIVE <-> SUSPENDED"] }
  - { method: GET, path: "/leasing/lessees/{id}/novation-requests", description: "List novation requests where this lessee is the proposed counterparty (FK reverse), sorted by created_at ASC", roles: [LessorAdmin, CreditOfficer, LegalApprover], code: 200, input: ["limit?", "offset?"], output: "NovationRequest[]", side_effects: [] }
  - { method: POST, path: "/leasing/inspectors", description: "Register an inspector", roles: [LessorAdmin], code: 201, input: [full_name, license_number], output: Inspector, side_effects: [] }
  - { method: GET, path: "/leasing/inspectors/{id}", description: "Fetch one inspector", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, TechInspector], code: 200, input: [], output: Inspector, side_effects: [] }
  - { method: GET, path: "/leasing/inspectors/{id}/inspection-bookings", description: "List bookings of an inspector (FK reverse), sorted by booking_date ASC then created_at ASC", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, TechInspector], code: 200, input: ["limit?", "offset?"], output: "InspectionBooking[]", side_effects: [] }

  # --- leases ---
  - { method: POST, path: "/leasing/leases", description: "Create a lease in DRAFT; overlap with other leases on the aircraft is checked at activation, not here", roles: [LessorAdmin], code: 201, input: [aircraft_id, lessee_id, start_date, end_date, monthly_rent_cents, reserve_rate_per_fh_cents, reserve_rate_per_fc_cents, monthly_hour_cap, "accrual_basis?", "minimum_monthly_hours?"], output: Lease, side_effects: [] }
  - { method: GET, path: "/leasing/leases", description: "Paginated lease list with FK filters (serves Lease.aircraft_id, Lease.lessee_id and Lease.approved_sublessee_id reverse reachability)", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager], code: 200, input: ["aircraft_id?", "lessee_id?", "approved_sublessee_id?", "status?", "limit?", "offset?"], output: "Lease[]", side_effects: [] }
  - { method: GET, path: "/leasing/leases/{id}", description: "Fetch one lease including reserve ledger fields", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, LesseeRep], code: 200, input: [], output: Lease, side_effects: [] }
  - { method: PATCH, path: "/leasing/leases/{id}", description: "Amend lease terms (DRAFT or ACTIVE); OCC-guarded on lease version", roles: [LessorAdmin], code: 200, input: [expected_lease_version, "monthly_rent_cents?", "reserve_rate_per_fh_cents?", "reserve_rate_per_fc_cents?", "monthly_hour_cap?", "minimum_monthly_hours?", "end_date?"], output: Lease, side_effects: ["increments Lease.version by 1"] }
  - { method: POST, path: "/leasing/leases/{id}/activate", description: "Activate a DRAFT lease; records safety gate + overlap + aircraft/lessee availability gates", roles: [LessorAdmin], code: 200, input: [], output: Lease, side_effects: ["Lease DRAFT -> ACTIVE", "Aircraft AVAILABLE -> ON_LEASE", "increments Lease.version by 1"] }
  - { method: POST, path: "/leasing/leases/{id}/initiate-return", description: "Open a ReturnCase and generate its 4-item checklist", roles: [LessorAdmin], code: 200, input: [], output: Lease, side_effects: ["Lease ACTIVE -> RETURN_INITIATED", "ReturnCase + 4 ChecklistItem rows created", "increments Lease.version by 1"] }
  - { method: POST, path: "/leasing/leases/{id}/abort-return", description: "Abort a return before inspection; cancels the open ReturnCase", roles: [LessorAdmin], code: 200, input: [], output: Lease, side_effects: ["Lease RETURN_INITIATED -> ACTIVE", "open ReturnCase -> CANCELLED"] }
  - { method: GET, path: "/leasing/leases/{id}/monthly-charge", description: "Computed read: monthly_lease_charge for month=YYYY-MM using only the ACCEPTED report of that month", roles: [LessorAdmin, FinanceManager, LesseeRep], code: 200, input: [month], output: "{ month: string, hours: number, cycles: integer, base_rent_cents: integer, overage_cents: integer, cycle_surcharge_cents: integer, total_cents: integer }", side_effects: [] }

  # --- utilization reports ---
  - { method: POST, path: "/leasing/leases/{id}/utilization-reports", description: "Lessee submits a monthly utilization report (SUBMITTED)", roles: [LesseeRep], code: 201, input: [period_month, flight_hours, flight_cycles], output: UtilizationReport, side_effects: [] }
  - { method: GET, path: "/leasing/leases/{id}/utilization-reports", description: "List reports of a lease (FK reverse), sorted by period_month ASC", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, LesseeRep], code: 200, input: ["limit?", "offset?"], output: "UtilizationReport[]", side_effects: [] }
  - { method: POST, path: "/leasing/utilization-reports/{id}/review", description: "Lessor accepts (posts accrual + aircraft totals) or disputes a report", roles: [LessorAdmin], code: 200, input: [decision, "reason?"], output: UtilizationReport, side_effects: ["maintenance_reserve_accrual", "aircraft_utilization_totals"] }
  - { method: POST, path: "/leasing/utilization-reports/{id}/revise", description: "Lessee revises a DISPUTED report back to SUBMITTED (cycle)", roles: [LesseeRep], code: 200, input: [flight_hours, flight_cycles], output: UtilizationReport, side_effects: [] }
  - { method: POST, path: "/leasing/utilization-reports/{id}/void", description: "Lessor voids an ACCEPTED report; exactly reverses accrual and aircraft totals", roles: [LessorAdmin], code: 200, input: [], output: UtilizationReport, side_effects: ["compensating reversal of maintenance_reserve_accrual and aircraft_utilization_totals"] }

  # --- reserve claims ---
  - { method: POST, path: "/leasing/leases/{id}/reserve-claims", description: "Lessee files a maintenance reserve reimbursement claim (SUBMITTED)", roles: [LesseeRep], code: 201, input: [maintenance_event_ref, claimed_amount_cents], output: ReserveClaim, side_effects: [] }
  - { method: GET, path: "/leasing/leases/{id}/reserve-claims", description: "List claims of a lease (FK reverse), sorted by created_at ASC", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, LesseeRep], code: 200, input: ["limit?", "offset?"], output: "ReserveClaim[]", side_effects: [] }
  - { method: POST, path: "/leasing/reserve-claims/{id}/decide", description: "Lessor approves (with approved_amount_cents) or rejects a SUBMITTED claim", roles: [LessorAdmin], code: 200, input: [decision, "approved_amount_cents?"], output: ReserveClaim, side_effects: [] }
  - { method: POST, path: "/leasing/reserve-claims/{id}/pay", description: "Finance pays an APPROVED claim from the reserve (balance >= amount, equality allowed)", roles: [FinanceManager], code: 200, input: [], output: ReserveClaim, side_effects: ["lease.reserve_reimbursed_cents += approved_amount_cents", "reserve_balance_cents recomputed"] }
  - { method: POST, path: "/leasing/reserve-claims/{id}/reverse-payment", description: "Finance reverses a PAID claim (e.g. bounced wire); restores reserve balance", roles: [FinanceManager], code: 200, input: [], output: ReserveClaim, side_effects: ["compensating reversal of pay"] }

  # --- return cases, bookings, checklist ---
  - { method: GET, path: "/leasing/leases/{id}/return-cases", description: "List return cases of a lease (FK reverse), sorted by created_at ASC", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, LesseeRep], code: 200, input: ["limit?", "offset?"], output: "ReturnCase[]", side_effects: [] }
  - { method: GET, path: "/leasing/return-cases/{id}", description: "Fetch one return case including negotiation and settlement fields", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, LesseeRep, TechInspector], code: 200, input: [], output: ReturnCase, side_effects: [] }
  - { method: POST, path: "/leasing/return-cases/{id}/advance", description: "Advance the return workflow to RECORDS_VERIFIED / INSPECTION / NEGOTIATION with the corresponding gates", roles: [LessorAdmin], code: 200, input: [to], output: ReturnCase, side_effects: ["records gate or checklist gate per target", "return_compensation provisional variant on entry to NEGOTIATION"] }
  - { method: POST, path: "/leasing/return-cases/{id}/inspection-bookings", description: "Book an inspector for a calendar date (capacity 1 per inspector per date)", roles: [LessorAdmin], code: 201, input: [inspector_id, booking_date], output: InspectionBooking, side_effects: [] }
  - { method: GET, path: "/leasing/return-cases/{id}/inspection-bookings", description: "List bookings of a return case (FK reverse), sorted by booking_date ASC then created_at ASC", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, LesseeRep, TechInspector], code: 200, input: ["limit?", "offset?"], output: "InspectionBooking[]", side_effects: [] }
  - { method: GET, path: "/leasing/return-cases/{id}/checklist-items", description: "List checklist items of a return case (FK reverse), sorted by item_code ASC (AIRFRAME, ENGINE, INTERIOR, PAINT)", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager, LesseeRep, TechInspector], code: 200, input: ["limit?", "offset?"], output: "ChecklistItem[]", side_effects: [] }
  - { method: POST, path: "/leasing/checklist-items/{id}/inspect", description: "Booked TechInspector records COMPLIANT or NON_COMPLIANT (with estimate) for a PENDING or RECTIFIED item", roles: [TechInspector], code: 200, input: [outcome, "rectification_cost_estimate_cents?"], output: ChecklistItem, side_effects: [] }
  - { method: POST, path: "/leasing/checklist-items/{id}/waive", description: "Lessor waives a NON_COMPLIANT item", roles: [LessorAdmin], code: 200, input: ["reason?"], output: ChecklistItem, side_effects: [] }
  - { method: POST, path: "/leasing/checklist-items/{id}/rectify", description: "Lessee marks a NON_COMPLIANT item rectified pending re-inspection", roles: [LesseeRep], code: 200, input: [], output: ChecklistItem, side_effects: [] }
  - { method: POST, path: "/leasing/return-cases/{id}/proposals", description: "Negotiation round: alternating LESSOR/LESSEE lump-sum proposals (self-loop, round_count += 1)", roles: [LessorAdmin, LesseeRep], code: 200, input: [amount_cents], output: ReturnCase, side_effects: ["round_count += 1", "current_proposal_* updated"] }
  - { method: POST, path: "/leasing/return-cases/{id}/agree", description: "Non-proposing side accepts the standing proposal; OCC-guarded on return case version", roles: [LessorAdmin, LesseeRep], code: 200, input: [expected_return_case_version], output: ReturnCase, side_effects: ["agreed_total_cents := current_proposal_cents", "increments ReturnCase.version by 1"] }
  - { method: POST, path: "/leasing/return-cases/{id}/request-reinspection", description: "Lessee loops the case back to INSPECTION (max 1); NON_COMPLIANT items revert to PENDING", roles: [LesseeRep], code: 200, input: [], output: ReturnCase, side_effects: ["reinspection_count += 1", "NON_COMPLIANT items -> PENDING"] }
  - { method: POST, path: "/leasing/return-cases/{id}/settle", description: "Finance executes settlement netting; cascades lease -> RETURNED, aircraft -> IN_TRANSITION, slot auto-confirm", roles: [FinanceManager], code: 200, input: [], output: ReturnCase, side_effects: ["settlement_netting", "NON_COMPLIANT items -> COMPENSATED", "open claims -> REJECTED", "Lease RETURN_INITIATED -> RETURNED (3-link cascade)"] }

  # --- novation / sublease ---
  - { method: POST, path: "/leasing/leases/{id}/novation-requests", description: "Lessee requests a NOVATION or SUBLEASE to a proposed lessee", roles: [LesseeRep], code: 201, input: [request_type, proposed_lessee_id], output: NovationRequest, side_effects: [] }
  - { method: GET, path: "/leasing/leases/{id}/novation-requests", description: "List novation requests of a lease (FK reverse), sorted by created_at ASC", roles: [LessorAdmin, CreditOfficer, LegalApprover, LesseeRep], code: 200, input: ["limit?", "offset?"], output: "NovationRequest[]", side_effects: [] }
  - { method: POST, path: "/leasing/novation-requests/{id}/review", description: "Stage-inferred review: SUBMITTED requires CreditOfficer, CREDIT_APPROVED requires LegalApprover; SoD enforced", roles: [CreditOfficer, LegalApprover], code: 200, input: [decision], output: NovationRequest, side_effects: ["on final APPROVE: NOVATION reassigns lease.lessee_id, SUBLEASE sets lease.approved_sublessee_id"] }

  # --- default & repossession ---
  - { method: POST, path: "/leasing/leases/{id}/default-cases", description: "Credit declares default; declared_at and cure_deadline derived from the logical clock; lease -> DEFAULTED", roles: [CreditOfficer], code: 201, input: [reason, cure_period_days], output: DefaultCase, side_effects: ["Lease ACTIVE|RETURN_INITIATED -> DEFAULTED"] }
  - { method: GET, path: "/leasing/leases/{id}/default-cases", description: "List default cases of a lease (FK reverse), sorted by created_at ASC", roles: [LessorAdmin, CreditOfficer, LegalApprover, FinanceManager], code: 200, input: ["limit?", "offset?"], output: "DefaultCase[]", side_effects: [] }
  - { method: POST, path: "/leasing/default-cases/{id}/cure", description: "Credit marks the default cured; lease reverts to ACTIVE", roles: [CreditOfficer], code: 200, input: [], output: DefaultCase, side_effects: ["Lease DEFAULTED -> ACTIVE"] }
  - { method: POST, path: "/leasing/default-cases/{id}/authorize-repossession", description: "Legal authorizes repossession once the cure deadline has passed; SoD vs declarer enforced", roles: [LegalApprover], code: 200, input: [], output: DefaultCase, side_effects: [] }
  - { method: POST, path: "/leasing/default-cases/{id}/execute-repossession", description: "Lessor executes repossession; cascades lease TERMINATED, aircraft REPOSSESSED, slots RELEASED, open return case CANCELLED", roles: [LessorAdmin], code: 200, input: [], output: DefaultCase, side_effects: ["3-link repossession cascade (see Lease DEFAULTED->TERMINATED)"] }

  # --- test-driving clock ---
  - { method: POST, path: "/leasing/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and the server never falls back to wall-clock time; all date-dependent rules (cure deadlines, booking gate, slot windows) read this clock.", roles: [LessorAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted for the endpoint, or entity-backed ownership check failed (LesseeRep acting on another lessee's lease)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "a path id does not resolve (checked left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, invalid enum value, end_date <= start_date, window_end < window_start, proposed_lessee_id == current lessee, approved amount out of range, NON_COMPLIANT inspect without positive estimate" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "transition attempted from a from-state the state machine does not allow, incl. terminal lockdown and duplicate non-terminal child cases" }
  - { id: ERR_CLAIM_NOT_PAYABLE, http: 409, condition: "pay attempted on a claim not in APPROVED status" }
  - { id: ERR_RECORDS_INCOMPLETE, http: 409, condition: "records safety gate failed: no VERIFIED BIRTH_RECORD at activation, or fewer than 4 required doc types VERIFIED at records-review" }
  - { id: ERR_LEASE_PERIOD_OVERLAP, http: 409, condition: "half-open [start_date, end_date) of the new lease intersects another non-terminal lease on the same aircraft; adjacency allowed" }
  - { id: ERR_SLOT_WINDOW_CONFLICT, http: 409, condition: "transition slot window fails the 2-day buffer rule against another TENTATIVE/CONFIRMED slot on the same aircraft" }
  - { id: ERR_INSPECTOR_DOUBLE_BOOKED, http: 409, condition: "inspector already holds a booking on the same calendar date (capacity 1 per inspector per day)" }
  - { id: ERR_DUPLICATE_REPORT_PERIOD, http: 409, condition: "a non-VOIDED utilization report already exists for this lease and period_month" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 409, condition: "one or more checklist items still PENDING or RECTIFIED when entering NEGOTIATION" }
  - { id: ERR_PROPOSER_ALTERNATION, http: 409, condition: "proposal or agree attempted by the side that made the standing proposal; or first proposal not from LESSOR" }
  - { id: ERR_REINSPECTION_LIMIT, http: 409, condition: "request-reinspection attempted with reinspection_count already at MAX_REINSPECTIONS (1)" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "same X-User-ID attempted both credit and legal review of one novation request, or declared a default and authorized its repossession" }
  - { id: ERR_CURE_DEADLINE_NOT_PASSED, http: 409, condition: "repossession authorization attempted while the logical clock is at or before cure_deadline" }
  - { id: ERR_BOOKING_REQUIRED, http: 403, condition: "inspecting TechInspector holds no InspectionBooking for this return case on the logical-clock current date" }
  - { id: ERR_DEFAULT_CASE_OPEN, http: 409, condition: "transition slot creation attempted while the aircraft's current lease has a DefaultCase in DECLARED or REPOSSESSION_AUTHORIZED status" }
  - { id: ERR_AIRCRAFT_NOT_AVAILABLE, http: 409, condition: "lease activation attempted while aircraft.status != AVAILABLE" }
  - { id: ERR_LESSEE_NOT_ACTIVE, http: 409, condition: "lease activation or novation final approval attempted with a lessee whose status != ACTIVE" }
  - { id: ERR_RESERVE_BALANCE_EXCEEDED, http: 422, condition: "claim payment exceeds lease.reserve_balance_cents (amounts equal to the balance are allowed)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LessorAdmin
    description: "Lessor's asset & lease administrator: registers assets/parties, manages leases, documents, return workflow, bookings; executes repossession"
    identity: opaque
    exclusive_operations: [create aircraft/lessee/inspector/lease, activate/abort leases, review documents, review utilization reports, void reports, decide claims, advance return cases, waive checklist items, create transition slots, advance slots, initiate returns, execute repossession, set clock]
    shared_operations: [read any resource, submit proposals, agree to proposals]
  - name: LesseeRep
    description: "Representative of a Lessee organization; acts only on leases its organization holds (lease.lessee_id == X-User-ID)"
    identity: "entity_backed:Lessee"
    exclusive_operations: [submit/revise utilization reports, file reserve claims, request novation/sublease, rectify checklist items, request reinspection]
    shared_operations: [read own lease chain, submit proposals, agree to proposals]
  - name: TechInspector
    description: "Certifying technical inspector; may inspect checklist items only for return cases it is booked on for the current date"
    identity: "entity_backed:Inspector"
    exclusive_operations: [inspect checklist items]
    shared_operations: [read return cases, bookings, checklist items]
  - name: CreditOfficer
    description: "Credit risk officer; suspends/reinstates lessees, declares and cures defaults, performs novation credit review"
    identity: opaque
    exclusive_operations: [set lessee status, declare default, cure default, credit-stage novation review]
    shared_operations: [read any resource]
  - name: LegalApprover
    description: "Legal approver; performs novation legal review and authorizes repossession (segregated from the declaring credit officer)"
    identity: opaque
    exclusive_operations: [legal-stage novation review, authorize repossession]
    shared_operations: [read any resource]
  - name: FinanceManager
    description: "Finance operator; pays and reverses reserve claims, executes return settlement netting"
    identity: opaque
    exclusive_operations: [pay claim, reverse payment, settle return case]
    shared_operations: [read any resource]
