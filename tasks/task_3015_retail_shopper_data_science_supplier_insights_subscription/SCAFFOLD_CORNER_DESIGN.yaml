        grounds: [calculations.matched_control_selection]
        distinguishing_aspect: "Each control is chosen at most once; with 3 treated and 2 controls, matched_pairs has length 2 and the third treated household is dropped."
        test_recipe:
          setup:
            - "Panel: T1/T2/T3 exposed to ACME in SNACKS; C1/C2 unexposed in SNACKS"
          setup_api_calls:
            - call: "POST /shopper-insights/panel-households"
              payload:
