        distinguishing_aspect: |
          The approve call clears the commitment rule (a VERIFIED COMMITMENT document covering
          DISPLAY), the money rule (13260.00 planned against 50000.00 available) and the volume
          rule at its exact boundary (committed_units 10000 == unreserved_units 10000). It must
