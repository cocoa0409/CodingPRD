# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Contract Lifecycle Management — 9 rules x 2 instances = 18 instances.
# Every grounds[] resolves into SCAFFOLD.yaml §1.1–§1.7.
# All formula-derived asserts are pre-computed literals (see scaffold notes).
# =============================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_provisional_vs_final_on_deviation_grant
        grounds:
          - calculations.risk_score
          - state_machines.Contract.UNDER_REVIEW_to_APPROVED
          - state_machines.DeviationApproval.PENDING_to_GRANTED
          - entities.Contract.fields.risk_score
        distinguishing_aspect: |
          Same current_version clauses yield risk_score=70 PROVISIONAL (submit, both deviations
          count) but risk_score=30 FINAL (workflow APPROVED, the GRANTED w=40 deviation excluded);
          the dual variant lives on the Contract/ContractVersion risk domain.
        test_recipe:
          setup:
            - "Org (threshold 60). Two clause templates: LIABILITY_CAP risk_weight 40, INDEMNITY risk_weight 30, neither mandatory."
            - "Contract template composing both; a contract in DRAFT with one version whose two clauses are both is_deviation=true (deviation_count=2)."
            - "Contract submitted (UNDER_REVIEW, risk_score=70 provisional); a DeviationApproval for the LIABILITY_CAP clause GRANTED; quorum=1 approver."
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Acme", risk_appetite_threshold: 60, auto_renew_lead_days: 30 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "LIABILITY_CAP", category: "LIABILITY", standard_text: "std-liab", risk_weight: 40, is_mandatory: false }
              as: ClauseLibrarian
              captures: { liab_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "INDEMNITY", category: "INDEMNITY", standard_text: "std-indem", risk_weight: 30, is_mandatory: false }
              as: ClauseLibrarian
              captures: { indem_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "MSA", clause_template_ids: ["${liab_id}", "${indem_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "Beta Co", title: "Beta MSA", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${liab_id}", text: "edited-liab", is_deviation: true }, { clause_template_id: "${indem_id}", text: "edited-indem", is_deviation: true } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { ver1_id: $.data.id, c_v1: $.data.version }
            - call: "POST /contracts/${contract_id}/deviation-approvals"
              payload: { contract_id: "${contract_id}", contract_version_id: "${ver1_id}", clause_template_id: "${liab_id}", justification: "negotiated cap acceptable" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { dev_id: $.data.id }
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v1}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v2: $.data.version, prov_risk: $.data.risk_score }
            - call: "GET /contracts/${contract_id}/approval-workflows"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { wf_id: $.data.0.id }
            - call: "POST /deviation-approvals/${dev_id}/decide"
              payload: { decision: "GRANT" }
              as: RiskOfficer
              as_user_id: "risk-1"
          trigger:
            - call: "POST /approval-workflows/${wf_id}/steps"
              payload: { approval_workflow_id: "${wf_id}", decision: "APPROVE" }
              as: ContractApprover
              as_user_id: "appr-1"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { final_risk: $.data.risk_score, c_status: $.data.status }
          assert:
            - "Contract.${contract_id}.risk_score == 70 immediately after submit (provisional, captured as prov_risk)"
            - "Contract.${contract_id}.risk_score == 30 after workflow APPROVED (final, GRANTED w=40 deviation excluded)"
            - "Contract.${contract_id}.status == APPROVED"

      - name: expiry_projection_initial_vs_renewal_anchor
        grounds:
          - calculations.expiry_projection
          - state_machines.Contract.OUT_FOR_SIGNATURE_to_ACTIVE
          - state_machines.Contract.ACTIVE_to_ACTIVE
          - entities.Contract.fields.expiry_date
        distinguishing_aspect: |
          INITIAL variant anchors expiry on effective_date (=2027-06-01 from 2026-06-01 + 12mo),
          RENEWAL variant anchors on the PRIOR expiry_date (=2028-06-01), not the renewal clock time;
          this dual variant lives on the Contract term-date domain, distinct from the risk domain.
        test_recipe:
          setup:
            - "Org auto_renew_lead_days 30. A contract reaches ACTIVE at clock 2026-06-01T00:00:00Z with term_months=12, auto_renew=true -> expiry 2027-06-01, RenewalAlert trigger 2027-05-02."
            - "Clock advanced to 2027-05-02T00:00:00Z so the alert is DUE; then renew is called."
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "Acme2", risk_appetite_threshold: 60, auto_renew_lead_days: 30 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "PAYMENT", category: "PAYMENT", standard_text: "net30", risk_weight: 0, is_mandatory: false }
              as: ClauseLibrarian
              captures: { pay_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "SimpleSvc", clause_template_ids: ["${pay_id}"], default_term_months: 12, auto_renew_default: true }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "Gamma", title: "Gamma Svc", term_months: 12, auto_renew: true }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${pay_id}", text: "net30", is_deviation: false } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v1: $.data.version }
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v1}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v2: $.data.version }
            - call: "GET /contracts/${contract_id}/approval-workflows"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { wf_id: $.data.0.id }
            - call: "POST /approval-workflows/${wf_id}/steps"
              payload: { approval_workflow_id: "${wf_id}", decision: "APPROVE" }
              as: ContractApprover
              as_user_id: "appr-1"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v3: $.data.version }
            - call: "POST /contracts/${contract_id}/send-for-signature"
              payload: { expected_contract_version: "${c_v3}", signers: [ { signer_party: "INTERNAL", signer_name: "Us" }, { signer_party: "COUNTERPARTY", signer_name: "Them" } ] }
              as: ContractManager
              as_user_id: "mgr-1"
            - call: "GET /contracts/${contract_id}/signature-requests"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { sig0_id: $.data.0.id, sig1_id: $.data.1.id }
            - call: "POST /signature-requests/${sig0_id}/sign"
              payload: {}
              as: Signer
              as_user_id: "signer-int"
            - call: "POST /signature-requests/${sig1_id}/sign"
              payload: {}
              as: Signer
              as_user_id: "signer-cp"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v_active: $.data.version, expiry_initial: $.data.expiry_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /contracts/${contract_id}/renew"
              payload: { expected_contract_version: "${c_v_active}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { expiry_renewed: $.data.expiry_date, cycle: $.data.renewal_cycle_index }
          assert:
            - "Contract.${contract_id}.expiry_date == '2027-06-01T00:00:00.000Z' at activation (INITIAL: effective_date 2026-06-01 + 12mo)"
            - "Contract.${contract_id}.expiry_date == '2028-06-01T00:00:00.000Z' after renew (RENEWAL: prior expiry 2027-06-01 + 12mo, NOT renewal clock 2027-05-02)"
            - "Contract.${contract_id}.renewal_cycle_index == 1"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cost_estimate_marginal_tiering_mode_a
        grounds:
          - calculations.clause_deviation_cost
          - entities.ContractVersion.fields.deviation_count
          - endpoints.GET /contracts/{id}/cost-estimate
        distinguishing_aspect: |
          MODE (a): tiered-rate selection with conditional branches on deviation_count. n=5 must
          price MARGINALLY as base 50000 + 3*10000 + 2*7500 = 95000, not 5*7500 flat — three inputs
          (base, tier rates, count) with non-linear tier interaction.
        test_recipe:
          setup:
            - "Org + 5 clause templates (weights irrelevant); contract template composing all 5; a DRAFT contract with one version whose 5 clauses are ALL is_deviation=true (deviation_count=5)."
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "CostOrg", risk_appetite_threshold: 200, auto_renew_lead_days: 30 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "C1", category: "OTHER", standard_text: "s1", risk_weight: 1, is_mandatory: false }
              as: ClauseLibrarian
              captures: { c1: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "C2", category: "OTHER", standard_text: "s2", risk_weight: 1, is_mandatory: false }
              as: ClauseLibrarian
              captures: { c2: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "C3", category: "OTHER", standard_text: "s3", risk_weight: 1, is_mandatory: false }
              as: ClauseLibrarian
              captures: { c3: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "C4", category: "OTHER", standard_text: "s4", risk_weight: 1, is_mandatory: false }
              as: ClauseLibrarian
              captures: { c4: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "C5", category: "OTHER", standard_text: "s5", risk_weight: 1, is_mandatory: false }
              as: ClauseLibrarian
              captures: { c5: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "FiveClause", clause_template_ids: ["${c1}","${c2}","${c3}","${c4}","${c5}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "Five", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${c1}", text: "d1", is_deviation: true }, { clause_template_id: "${c2}", text: "d2", is_deviation: true }, { clause_template_id: "${c3}", text: "d3", is_deviation: true }, { clause_template_id: "${c4}", text: "d4", is_deviation: true }, { clause_template_id: "${c5}", text: "d5", is_deviation: true } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { ver_id: $.data.id, dev_ct: $.data.deviation_count }
          trigger:
            - call: "GET /contracts/${contract_id}/cost-estimate"
              payload: {}
              as: RiskOfficer
              as_user_id: "risk-1"
              captures: { cost: $.data.review_cost_cents, n: $.data.deviation_count }
          assert:
            - "deviation_count == 5"
            - "review_cost_cents == 95000 (50000 + 3*10000 + 2*7500, marginal tiering)"

      - name: send_for_signature_evaluation_order_mode_c
        grounds:
          - calculations.risk_score
          - validations[priority=12]
          - state_machines.Contract.APPROVED_to_OUT_FOR_SIGNATURE
          - state_machines.DeviationApproval.PENDING_to_GRANTED
        distinguishing_aspect: |
          MODE (c): circular-looking dependency with a pinned evaluation order — the send gate reads
          risk_score, but risk_score's FINAL value depends on which DeviationApprovals are GRANTED,
          which in turn were requested because risk_score crossed the threshold; the scaffold pins
          order (recompute final risk -> then evaluate granted-deviation coverage) so the gate is well-defined.
        test_recipe:
          setup:
            - "Org threshold 60. Two deviated clauses w=40 (LIABILITY) + w=30 (INDEMNITY) -> provisional risk 70 >= 60."
            - "Contract submitted; ONLY the LIABILITY deviation GRANTED; workflow APPROVED (final risk excludes the granted w=40 -> 30)."
            - "At APPROVED the contract is sent: even though risk dropped below threshold AFTER the grant, the gate must clear because the still-deviated INDEMNITY (w=30) keeps a deviation present; evaluation order determines whether send is blocked."
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "OrderOrg", risk_appetite_threshold: 60, auto_renew_lead_days: 30 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "LIABILITY_CAP", category: "LIABILITY", standard_text: "std", risk_weight: 40, is_mandatory: false }
              as: ClauseLibrarian
              captures: { liab_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "INDEMNITY", category: "INDEMNITY", standard_text: "std", risk_weight: 30, is_mandatory: false }
              as: ClauseLibrarian
              captures: { indem_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "MSA", clause_template_ids: ["${liab_id}","${indem_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "MSA-c", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${liab_id}", text: "edit", is_deviation: true }, { clause_template_id: "${indem_id}", text: "edit", is_deviation: true } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { ver_id: $.data.id, c_v1: $.data.version }
            - call: "POST /contracts/${contract_id}/deviation-approvals"
              payload: { contract_id: "${contract_id}", contract_version_id: "${ver_id}", clause_template_id: "${liab_id}", justification: "ok" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { dev_liab: $.data.id }
            - call: "POST /contracts/${contract_id}/deviation-approvals"
              payload: { contract_id: "${contract_id}", contract_version_id: "${ver_id}", clause_template_id: "${indem_id}", justification: "ok" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { dev_indem: $.data.id }
            - call: "POST /deviation-approvals/${dev_liab}/decide"
              payload: { decision: "GRANT" }
              as: RiskOfficer
              as_user_id: "risk-1"
            - call: "POST /deviation-approvals/${dev_indem}/decide"
              payload: { decision: "GRANT" }
              as: RiskOfficer
              as_user_id: "risk-1"
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v1}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v2: $.data.version }
            - call: "GET /contracts/${contract_id}/approval-workflows"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { wf_id: $.data.0.id }
            - call: "POST /approval-workflows/${wf_id}/steps"
              payload: { approval_workflow_id: "${wf_id}", decision: "APPROVE" }
              as: ContractApprover
              as_user_id: "appr-1"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v3: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/send-for-signature"
              payload: { expected_contract_version: "${c_v3}", signers: [ { signer_party: "INTERNAL", signer_name: "Us" }, { signer_party: "COUNTERPARTY", signer_name: "Them" } ] }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_status: $.data.status }
          assert:
            - "send-for-signature SUCCEEDS (both deviations GRANTED so the gate clears regardless of the now-final risk_score)"
            - "Contract.${contract_id}.status == OUT_FOR_SIGNATURE"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_redline_cycle_under_review_to_redlining_and_back
        grounds:
          - state_machines.Contract.UNDER_REVIEW_to_REDLINING
          - state_machines.Contract.REDLINING_to_UNDER_REVIEW
          - state_machines.Contract.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          CYCLE on the Contract entity: DRAFT->UNDER_REVIEW, a new version bounces to REDLINING,
          resubmit returns to UNDER_REVIEW — a true A->B->A loop, not a linear pipeline.
        test_recipe:
          setup:
            - "A contract with version v1, submitted to UNDER_REVIEW (workflow PENDING)."
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "CycOrg", risk_appetite_threshold: 200, auto_renew_lead_days: 30 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K", category: "OTHER", standard_text: "s", risk_weight: 0, is_mandatory: false }
              as: ClauseLibrarian
              captures: { k_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${k_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "Cyc", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${k_id}", text: "s", is_deviation: false } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v1: $.data.version }
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v1}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v2: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "COUNTERPARTY", clauses: [ { clause_template_id: "${k_id}", text: "redline", is_deviation: true } ], expected_contract_version: "${c_v2}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v3: $.data.version, redline_status: $.data.status }
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { mid_status: $.data.status, c_v3b: $.data.version }
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v3b}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { back_status: $.data.status }
          assert:
            - "After the new version while UNDER_REVIEW, Contract.${contract_id}.status == REDLINING"
            - "After resubmit, Contract.${contract_id}.status == UNDER_REVIEW (cycle closed)"

      - name: signature_request_branching_fork_join
        grounds:
          - state_machines.SignatureRequest.SENT_to_SIGNED
          - state_machines.SignatureRequest.SENT_to_DECLINED
          - state_machines.Contract.OUT_FOR_SIGNATURE_to_ACTIVE
        distinguishing_aspect: |
          BRANCHING fork/join on the SignatureRequest entity (distinct from Contract): two parallel
          SignatureRequests fork on send; the JOIN only fires Contract->ACTIVE when BOTH reach SIGNED,
          and a DECLINE branch has a divergent side-effect set (siblings VOIDED, contract->REDLINING).
        test_recipe:
          setup:
            - "Contract APPROVED and sent for signature with one INTERNAL + one COUNTERPARTY SignatureRequest (both SENT)."
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "SigOrg", risk_appetite_threshold: 200, auto_renew_lead_days: 30 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "K", category: "OTHER", standard_text: "s", risk_weight: 0, is_mandatory: false }
              as: ClauseLibrarian
              captures: { k_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${k_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
