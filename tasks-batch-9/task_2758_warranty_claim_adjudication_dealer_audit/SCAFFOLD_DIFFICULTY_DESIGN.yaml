            - "control - the same body on the SUBMITTED claim: POST /warranty/claims/${cl_p2_id}/adjudicate with {decision: APPROVE, approved_labor_hours: 9.0, approved_parts_qty: 3} as ClaimAdjudicator adj-user-1 returns HTTP 422 with error_id == ERR_LABOR_TIME_EXCEEDS_MAX, proving rule 75 is reachable"
            - "control leaves WarrantyClaim.${cl_p2_id} in SUBMITTED"

