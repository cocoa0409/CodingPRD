  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: hours_cap_boundary_at_exact_1_5x_budget
        grounds:
          - validations[priority=12]
          - entities.ResearchProject.fields.consumed_hours
          - errors[ERR_HOURS_CAP_EXCEEDED]
        distinguishing_aspect: |
          Numeric threshold on cumulative hours: with budget_hours 2 (hard cap 3.0), a time entry
          bringing consumed_hours to exactly 3.0 is accepted, while the next entry of 0.5 (total 3.5
          > 3.0) is rejected with ERR_HOURS_CAP_EXCEEDED. Boundary is >, not >=.
        test_recipe:
          setup:
            - "ACTIVE project budget_hours 2; one ACTIVE 3.0-hour entry already logged (consumed_hours == cap 3.0)"
          setup_api_calls:
            - call: "POST /genealogy/clients"
              payload: { name: "C11", email: "c11@x.com" }
              as: ProjectManager
              captures: { client_id: $.data.id }
