            - { call: "POST /api/grant-applications", payload: { project_id: "${proj1}", program_id: "${prog}", household_income: 42000.00 }, as: Homeowner, as_user_id: "u-own-1", captures: { app1: $.data.id } }
            - { call: "POST /api/grant-applications/${app1}/approve", payload: { verified_income: 42000.00 }, as: GrantOfficer }
            - { call: "POST /api/grant-applications", payload: { project_id: "${proj2}", program_id: "${prog}", household_income: 42000.00 }, as: Homeowner, as_user_id: "u-own-1", captures: { app2: $.data.id } }
