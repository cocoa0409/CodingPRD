              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_id: $.data.id }
            - call: "POST /dog-park/incident-reports"
              payload: { subject_member_id: "${m_id}", severity: "SEVERE", occurred_at: "2026-08-02T10:00:00Z", description: "bite" }
              as: ParkAdmin
              captures: { r_id: $.data.id }
            - call: "POST /dog-park/incident-reports/${r_id}/advance"
              payload: { to: "UNDER_REVIEW" }
              as: ParkAdmin
            - call: "POST /dog-park/incident-reports/${r_id}/advance"
              payload: { to: "CONFIRMED" }
              as: ParkAdmin
            - call: "GET /dog-park/members/${m_id}/memberships"
              payload: {}
              as: ParkAdmin
              captures: { ms_v_cur: "$.data[0].version" }
          trigger:
            - call: "POST /dog-park/memberships/${ms_id}/renew"
              payload: { expected_membership_version: "${ms_v_cur}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_NOT_ACTIVE (member-state gate on the renewal path)"
            - "Membership.${ms_id}.status remains SUSPENDED and renewal_count stays 0"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: closure_overlap_half_open_adjacency
        grounds:
          - validations[priority=11]
          - entities.AreaClosure.fields.starts_at
          - entities.AreaClosure.fields.ends_at
          - errors[ERR_CLOSURE_OVERLAP]
        distinguishing_aspect: |
          Finite half-open interval semantics on AreaClosure: [08-10, 08-12) vs
          [08-11, 08-13) overlap and reject, while back-to-back adjacency
          ([08-10, 08-12) then [08-12, 08-14)) is allowed — distinct interval
          semantics from the unbounded open-visit instance below.
        test_recipe:
          setup:
            - "Clock 2026-08-01; one park area"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
              payload: { name: "Main", size_class_restriction: "LARGE", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /dog-park/areas/${a_id}/closures"
              payload: { starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-12T00:00:00Z", reason: "reseed turf" }
              as: ParkAdmin
              captures: { c1st: $.data.status }
            - call: "POST /dog-park/areas/${a_id}/closures"
              payload: { starts_at: "2026-08-11T00:00:00Z", ends_at: "2026-08-13T00:00:00Z", reason: "overlapping fence work" }
              as: ParkAdmin
              captures: { err: $.data.error_id }
            - call: "POST /dog-park/areas/${a_id}/closures"
              payload: { starts_at: "2026-08-12T00:00:00Z", ends_at: "2026-08-14T00:00:00Z", reason: "back-to-back gate repair" }
              as: ParkAdmin
              captures: { c3st: $.data.status }
          assert:
            - "first closure status == SCHEDULED (201)"
            - "second closure error_id == ERR_CLOSURE_OVERLAP ([08-11,08-13) intersects [08-10,08-12))"
            - "third closure status == SCHEDULED (starts_at == prior ends_at is adjacency, not overlap)"

      - name: dog_open_visit_unbounded_overlap
        grounds:
          - validations[priority=10]
          - state_machines.ParkVisit.OPEN_to_CLOSED
          - errors[ERR_ALREADY_CHECKED_IN]
        distinguishing_aspect: |
          Unbounded open-ended interval semantics on the Dog resource: an OPEN
          visit occupies [checked_in_at, infinity), so a second check-in anywhere
          is rejected until the interval is closed by check-out — distinct
          interval semantics (unbounded vs finite half-open) and resource (Dog
          vs AreaClosure) from the instance above.
        test_recipe:
          setup:
            - "Clock 2026-08-03 10:00; two SMALL areas capacity 4; member with VERIFIED SMALL dog and ACTIVE membership"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
              payload: { name: "Small A", size_class_restriction: "SMALL", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /dog-park/areas"
              payload: { name: "Small B", size_class_restriction: "SMALL", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Pip", size_class: "SMALL", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a1_id}", dog_id: "${d_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a2_id}", dog_id: "${d_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
            - call: "POST /dog-park/visits/${v1_id}/check-out"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a2_id}", dog_id: "${d_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v2st: $.data.status }
          assert:
            - "second check-in while first is OPEN: error_id == ERR_ALREADY_CHECKED_IN"
            - "after check-out closes the interval, re-check-in succeeds with status == OPEN"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: occupancy_checkin_checkout_conservation
        grounds:
          - calculations.occupancy_count
          - state_machines.ParkVisit.OPEN_to_CLOSED
          - entities.ParkArea.fields.current_occupancy
        distinguishing_aspect: |
          Conserved quantity = area OPEN-visit count: each check-in (+1) paired
          with its compensating check-out (-1) returns ParkArea.current_occupancy
          to its prior value with zero drift — distinct quantity from the
          guest-pass allotment instance below.
        test_recipe:
          setup:
            - "Clock 2026-08-03 10:00; SMALL area capacity 4; two members each with VERIFIED SMALL dog and ACTIVE membership"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
              payload: { name: "Small Side", size_class_restriction: "SMALL", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "M One", email: "m1@x.com" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /dog-park/members/${m1_id}/dogs"
              payload: { name: "Pip", size_class: "SMALL", license_number: "LIC-A", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dg1_id: $.data.id }
            - call: "POST /dog-park/dogs/${dg1_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m1_id}/memberships"
