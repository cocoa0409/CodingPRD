      - name: credit_application_triggers_each_guard_their_own_status
        claim_type: invalid_transitions
        grounds:
          - state_machines.FeeCreditApplication
          - errors.ERR_CREDIT_APPLICATION_NOT_SUBMITTED
          - errors.ERR_CREDIT_APPLICATION_NOT_RETURNED
          - errors.ERR_CREDIT_APPLICATION_NOT_APPROVED
          - validations[priority=70]
        distinguishing_aspect: "A DENIED application rejects review, resubmit and revoke with three distinct error codes, and the resubmit rejection is the state error even though the acting owner is also not the applicant, because priority 70 outranks the priority 79 ownership check."
        test_recipe:
          setup:
            - "DRAFT term with one commercial account and one SUBMITTED credit application filed by the billing clerk"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/accounts"
              payload: { permit_term_id: "${term_id}", parcel_id: "P-1000", owner_name: "Ada Owner", parcel_class: "COMMERCIAL", impervious_area_sqft: 9020 }
              as: UtilityBillingClerk
              as_user_id: "clerk-01"
              captures: { acct_id: $.data.id, acct_ver: $.data.version }
            - call: "POST /stormwater/fee-credit-applications"
              payload: { stormwater_account_id: "${acct_id}", requested_credit_pct: 0.1000, bmp_description: "Rain garden treating 600 sqft of roof", expected_stormwater_account_version: "${acct_ver}" }
              as: UtilityBillingClerk
              as_user_id: "clerk-01"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /stormwater/fee-credit-applications/${app_id}/review"
              payload: { decision: "DENY", return_reason: "Practice does not meet the design standard" }
              as: UtilityBillingClerk
              as_user_id: "clerk-01"
            - call: "POST /stormwater/fee-credit-applications/${app_id}/review"
              payload: { decision: "APPROVE", approved_credit_pct: 0.1000 }
              as: UtilityBillingClerk
              as_user_id: "clerk-01"
              captures: { err: $.data.error_id }
            - call: "POST /stormwater/fee-credit-applications/${app_id}/resubmit"
              payload: { requested_credit_pct: 0.0800, bmp_description: "Revised rain garden" }
              as: PropertyOwner
              as_user_id: "${acct_id}"
            - call: "POST /stormwater/fee-credit-applications/${app_id}/revoke"
              payload: { reason: "Never approved" }
              as: UtilityBillingClerk
              as_user_id: "clerk-01"
          assert:
            - "call 1 is HTTP 200 with status DENIED, return_reason recorded and approved_credit_pct null"
            - "call 2 is HTTP 409 ERR_CREDIT_APPLICATION_NOT_SUBMITTED"
            - "call 3 is HTTP 409 ERR_CREDIT_APPLICATION_NOT_RETURNED, not ERR_NOT_APPLICANT, because the state check at priority 70 precedes the ownership check at priority 79"
            - "call 4 is HTTP 409 ERR_CREDIT_APPLICATION_NOT_APPROVED"
            - "StormwaterAccount.${acct_id}: total_credit_pct == 0.0000 and current_net_fee_cents == 29264, the untouched gross billable amount"

