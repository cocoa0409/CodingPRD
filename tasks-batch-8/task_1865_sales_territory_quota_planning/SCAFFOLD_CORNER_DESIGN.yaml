      - name: rule_disable_enable_cycle_controls_evaluation
        claim_type: side_effect_execution
        grounds: ["state_machines.AssignmentRule.ACTIVE_to_DISABLED", "state_machines.AssignmentRule.DISABLED_to_ACTIVE", "calculations.assignment_resolution"]
        distinguishing_aspect: "The ACTIVE<->DISABLED cycle is observable through evaluation: a DISABLED rule is skipped (account becomes UNASSIGNED), and re-enabling plus evaluate-assignments restores the assignment."
        test_recipe:
          setup: ["Plan OPEN; ACTIVE territory T; ACTIVE GEO rule (US) -> T; account A already assigned to T"]
          setup_api_calls:
            - { call: "POST /sales-planning/plan-years", payload: { label: "FY27", start_date: "2027-01-01", end_date: "2027-12-31", company_target_cents: 100000, productivity_per_rep_cents: 1000000, lock_date: "2027-01-15" }, as: SalesOpsAdmin, captures: { plan: $.data.id } }
            - { call: "POST /sales-planning/territories", payload: { plan_year_id: "${plan}", name: "T", potential_cents: 100, headcount_capacity: 2 }, as: SalesOpsAdmin, captures: { t: $.data.id } }
            - { call: "POST /sales-planning/territories/${t}/activate", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/assignment-rules", payload: { plan_year_id: "${plan}", rule_type: "GEO_SEGMENT", priority: 10, territory_id: "${t}", country_code: "US" }, as: SalesOpsAdmin, captures: { rule: $.data.id } }
            - { call: "POST /sales-planning/accounts", payload: { plan_year_id: "${plan}", name: "A", country_code: "US", segment: "SMB", annual_potential_cents: 50000 }, as: SalesOpsAdmin, captures: { acc: $.data.id } }
          trigger:
            - { call: "POST /sales-planning/assignment-rules/${rule}/disable", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/evaluate-assignments", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/assignment-rules/${rule}/enable", as: SalesOpsAdmin }
            - { call: "POST /sales-planning/plan-years/${plan}/evaluate-assignments", as: SalesOpsAdmin }
          assert:
            - "After disable + evaluate: Account.${acc}.assigned_territory_id == null and assignment_source == UNASSIGNED (DISABLED rules are ineligible)"
            - "After enable + evaluate: Account.${acc}.assigned_territory_id == ${t} and assignment_source == GEO_RULE"
            - "Disabling alone (before the first evaluate) never touched the account: the rule change itself triggers no re-evaluation"

