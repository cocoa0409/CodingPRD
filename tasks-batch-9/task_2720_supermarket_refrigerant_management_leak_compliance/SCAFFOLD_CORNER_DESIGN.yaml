              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 5.0, performed_at: "2024-12-01T00:00:00Z", duration_minutes: 60, expected_system_version: "${sys1_v}" }
