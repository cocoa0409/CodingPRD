              payload: { unit_id: "${u_id}", expected_unit_version: "${u_v2}", proposed_price_cents: 32000000, appraised_value_cents: 41000000, capital_improvements_cents: 0, deferred_maintenance_cents: 0, broker_fee_cents: 1000000, prior_transaction_id: "${t1_id}" }
              as: HousingComplianceOfficer
