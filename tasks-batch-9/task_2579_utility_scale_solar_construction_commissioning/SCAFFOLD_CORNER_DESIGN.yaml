              as: ProcurementCoordinator
              captures: { d1: $.data.id }
            - call: "POST /solar/deliveries/${d1}/receipt"
              payload: { received_unit_qty: 60, damaged_unit_qty: 3 }
              as: ProcurementCoordinator
              captures: { d1_st: $.data.status }
            - call: "GET /solar/yard-zones/${yz}"
              payload: {}
              as: ProcurementCoordinator
              captures: { v1: $.data.version }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "MODULE", unit_qty: 40, pallets: 40, planned_arrival_at: "2026-08-04T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${v1}" }
              as: ProcurementCoordinator
              captures: { d2: $.data.id, d2_st: $.data.status, d2_comp: $.data.component_type, d2_pal: $.data.pallets }
            - call: "GET /solar/yard-zones/${yz}"
              payload: {}
              as: ProcurementCoordinator
              captures: { v2: $.data.version }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "TRACKER", unit_qty: 50, pallets: 50, planned_arrival_at: "2026-08-05T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${v2}" }
              as: ProcurementCoordinator
              captures: { d3: $.data.id }
          trigger:
            - call: "GET /solar/deliveries/${d2}"
              payload: {}
              as: ProcurementCoordinator
              captures: { got_id: $.data.id, got_st: $.data.status, got_comp: $.data.component_type, got_qty: $.data.unit_qty }
            - call: "GET /solar/deliveries"
              payload: { project_id: "${proj}", component_type: "MODULE", status: "RESERVED" }
              as: ProcurementCoordinator
              captures: { n_mod_res: $.meta.total_count }
            - call: "GET /solar/deliveries"
              payload: { project_id: "${proj}", component_type: "MODULE" }
              as: ProcurementCoordinator
              captures: { n_mod: $.meta.total_count }
            - call: "GET /solar/deliveries"
              payload: { project_id: "${proj}", status: "RESERVED" }
              as: ProcurementCoordinator
              captures: { n_res: $.meta.total_count }
            - call: "GET /solar/deliveries"
              payload: { project_id: "${proj}", limit: 2, offset: 0 }
              as: ProcurementCoordinator
              captures: { n_all: $.meta.total_count, more: $.meta.has_more }
          assert:
            - "${d1_st} == ACCEPTED, ${d2_st} == RESERVED, ${d2_comp} == MODULE and ${d2_pal} == 40 at creation"
            - "the item read echoes the stored row: ${got_id} == ${d2}, ${got_st} == RESERVED, ${got_comp} == MODULE, ${got_qty} == 40"
            - "${n_mod_res} == 1 — component_type and status compose, isolating ${d2} from ${d1} (MODULE but ACCEPTED) and ${d3} (RESERVED but TRACKER)"
            - "${n_mod} == 2 and ${n_res} == 2 — each filter alone is less selective"
            - "${n_all} == 3 with ${more} == true and exactly 2 items in data — total_count describes the filtered set, has_more describes the page"

      - name: punch_closure_action_endpoint_stub
