# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3350_pre_sale_home_improvement_advance_repayment_closing
# =============================================================================
# Two instances per Difficulty Rule (§0.5), each grounded in §1.1–§1.7.
# Every instance carries an executable test_recipe whose setup_api_calls
# chain drives empty-DB into the precondition state.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: program_fee_variant_a_sold_within_window
        grounds:
          - calculations.program_fee_cents
          - entities.ClosingStatement.fields.payoff_basis
          - entities.ConciergeCase.fields.listing_window_days
        distinguishing_aspect: |
          Program fee on ClosingStatement (entity domain: ClosingStatement) uses
          Variant A (3% flat) when the home is sold within the listing window,
          producing a different numeric result than Variant B for identical
          advance principal.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ConciergeCase with expected_sale_proceeds_cents=100000000, advance_limit_cents=15000000, listing_window_days=180."
            - "One APPROVED project, one SCHEDULED engagement, one RELEASED disbursement of 5000000 cents."
            - "Case is UNDER_CONTRACT, listed_at=2026-09-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /concierge/vendors"
              payload: { legal_name: "Vendor V", trade: "GENERAL" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /concierge/vendors/${vendor_id}/capacity-windows"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", capacity_crew_days: 100 }
              as: PlatformAdmin
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true, listing_window_days: 180 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/eligibility/approve"
              payload: {}
              as: ProgramUnderwriter
            - call: "POST /concierge/cases/${case_id}/projects"
              payload: { title: "Kitchen refresh", recommended_by_agent: true, expected_sale_price_lift_cents: 5000000, estimated_cost_cents: 5000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { project_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/propose"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/approve"
              payload: {}
              as: Homeowner
            - call: "POST /concierge/engagements"
              payload: { improvement_project_id: "${project_id}", vendor_id: "${vendor_id}", agreed_price_cents: 5000000, start_date: "2026-09-05T00:00:00Z", end_date: "2026-09-20T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { engagement_id: $.data.id }
            - call: "POST /concierge/disbursements"
              payload: { concierge_case_id: "${case_id}", improvement_project_id: "${project_id}", vendor_engagement_id: "${engagement_id}", amount_cents: 5000000, kind: "DEPOSIT" }
              as: ProgramUnderwriter
              captures: { disb_id: $.data.id }
            - call: "GET /concierge/cases/${case_id}"
              payload: {}
              as: Any
              captures: { case_v: $.data.version }
            - call: "POST /concierge/disbursements/${disb_id}/approve"
              payload: { expected_case_version: "${case_v}" }
              as: ProgramUnderwriter
            - call: "POST /concierge/engagements/${engagement_id}/start"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /concierge/disbursements/${disb_id}/release"
              payload: {}
              as: ProgramUnderwriter
            - call: "POST /concierge/engagements/${engagement_id}/complete"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/verify"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases/${case_id}/listing-events"
              payload: { event_kind: "LISTED", event_at: "2026-09-10T00:00:00Z", price_cents: 105000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases/${case_id}/listing-events"
              payload: { event_kind: "OFFER_ACCEPTED", event_at: "2026-10-01T00:00:00Z", price_cents: 105000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /concierge/cases/${case_id}/listing-events"
              payload: { event_kind: "CLOSED_SOLD", event_at: "2026-10-15T00:00:00Z", price_cents: 105000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "GET /concierge/cases/${case_id}/closing-statement"
              payload: {}
              as: Any
              captures: { stmt_id: $.data.id }
            - call: "POST /concierge/closing-statements/${stmt_id}/finalize"
              payload: {}
              as: ProgramUnderwriter
          assert:
            - "ClosingStatement.${stmt_id}.payoff_basis == SOLD_WITHIN_WINDOW"
            - "ClosingStatement.${stmt_id}.advance_repayment_cents == 5000000"
            - "ClosingStatement.${stmt_id}.program_fee_cents == 150000"
            - "ClosingStatement.${stmt_id}.late_fee_cents == 0"
            - "ClosingStatement.${stmt_id}.vendor_holdback_cents == 0"
            - "ClosingStatement.${stmt_id}.net_repayment_cents == 5150000"

      - name: vendor_quality_score_dual_variant_recovery_vs_penalty
        grounds:
          - calculations.vendor_quality_score_bp
          - entities.Vendor.fields.quality_score_bp
          - state_machines.VendorEngagement.IN_WORK_to_COMPLETE_ON_TIME
          - state_machines.Dispute.IN_REVIEW_to_RESOLVED_VENDOR_FAULT
        distinguishing_aspect: |
          Vendor quality score on Vendor (entity domain: Vendor) uses a
          dual-variant recovery/penalty rule: on-time completion without
          dispute recovers +50bp, while vendor-fault dispute resolution
          penalizes -500bp, producing divergent scores from the same initial
          10000bp baseline.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Vendor V1 with quality_score_bp=10000."
            - "Two ConciergeCases, each with one APPROVED project and one IN_WORK engagement on V1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/vendors"
              payload: { legal_name: "Vendor V1", trade: "PAINT" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /concierge/vendors/${vendor_id}/capacity-windows"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", capacity_crew_days: 100 }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case1_id: $.data.id }
            - call: "POST /concierge/cases/${case1_id}/eligibility/approve"
              payload: {}
              as: ProgramUnderwriter
            - call: "POST /concierge/cases/${case1_id}/projects"
              payload: { title: "Paint", recommended_by_agent: true, expected_sale_price_lift_cents: 1000000, estimated_cost_cents: 1000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { proj1_id: $.data.id }
            - call: "POST /concierge/cases/${case1_id}/projects/${proj1_id}/propose"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases/${case1_id}/projects/${proj1_id}/approve"
              payload: {}
              as: Homeowner
            - call: "POST /concierge/engagements"
              payload: { improvement_project_id: "${proj1_id}", vendor_id: "${vendor_id}", agreed_price_cents: 1000000, start_date: "2026-09-05T00:00:00Z", end_date: "2026-09-10T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { eng1_id: $.data.id }
            - call: "POST /concierge/engagements/${eng1_id}/start"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /concierge/engagements/${eng1_id}/complete"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /concierge/cases"
              payload: { address_line: "456 Oak Ave", estimated_property_value_cents: 90000000, expected_sale_proceeds_cents: 110000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case2_id: $.data.id }
            - call: "POST /concierge/cases/${case2_id}/eligibility/approve"
              payload: {}
              as: ProgramUnderwriter
            - call: "POST /concierge/cases/${case2_id}/projects"
              payload: { title: "Paint", recommended_by_agent: true, expected_sale_price_lift_cents: 1000000, estimated_cost_cents: 1000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { proj2_id: $.data.id }
            - call: "POST /concierge/cases/${case2_id}/projects/${proj2_id}/propose"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases/${case2_id}/projects/${proj2_id}/approve"
              payload: {}
              as: Homeowner
            - call: "POST /concierge/engagements"
              payload: { improvement_project_id: "${proj2_id}", vendor_id: "${vendor_id}", agreed_price_cents: 1000000, start_date: "2026-09-05T00:00:00Z", end_date: "2026-09-10T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { eng2_id: $.data.id }
            - call: "POST /concierge/engagements/${eng2_id}/start"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /concierge/disputes"
              payload: { concierge_case_id: "${case2_id}", improvement_project_id: "${proj2_id}", vendor_engagement_id: "${eng2_id}", dispute_kind: "WORKMANSHIP", claimed_amount_cents: 50000 }
              as: Homeowner
              captures: { dispute_id: $.data.id }
            - call: "POST /concierge/disputes/${dispute_id}/review"
              payload: {}
              as: ProgramUnderwriter
          trigger:
            - call: "POST /concierge/disputes/${dispute_id}/resolve"
              payload: { resolution: "VENDOR_FAULT" }
              as: ProgramUnderwriter
          assert:
            - "Vendor.${vendor_id}.quality_score_bp == 10000 + 50 - 500"
            - "Vendor.${vendor_id}.quality_score_bp == 9550"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: net_repayment_circular_evaluation_order
        grounds:
          - calculations.net_repayment_cents
          - calculations.program_fee_cents
          - calculations.late_fee_cents
          - entities.ClosingStatement.fields.net_repayment_cents
        distinguishing_aspect: |
          Net repayment uses mode (c) circular-looking dependency: fee depends
          on payoff_basis, which depends on advance_total, which is recomputed
          from disbursements; the scaffold pins evaluation order so the value
          is well-defined.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ConciergeCase with expected_sale_proceeds_cents=100000000, listing_window_days=30."
            - "One APPROVED project, one engagement, two RELEASED disbursements: 3000000 and 2000000 cents."
            - "Case is LISTED at 2026-09-01T00:00:00Z, CLOSED_UNSOLD at 2026-10-15T00:00:00Z (45 days late, 2 months)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /concierge/vendors"
              payload: { legal_name: "Vendor V", trade: "GENERAL" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /concierge/vendors/${vendor_id}/capacity-windows"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", capacity_crew_days: 100 }
              as: PlatformAdmin
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true, listing_window_days: 30 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/eligibility/approve"
              payload: {}
              as: ProgramUnderwriter
            - call: "POST /concierge/cases/${case_id}/projects"
              payload: { title: "Kitchen", recommended_by_agent: true, expected_sale_price_lift_cents: 5000000, estimated_cost_cents: 5000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { project_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/propose"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/approve"
              payload: {}
              as: Homeowner
            - call: "POST /concierge/engagements"
              payload: { improvement_project_id: "${project_id}", vendor_id: "${vendor_id}", agreed_price_cents: 5000000, start_date: "2026-09-05T00:00:00Z", end_date: "2026-09-20T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { engagement_id: $.data.id }
            - call: "POST /concierge/disbursements"
              payload: { concierge_case_id: "${case_id}", improvement_project_id: "${project_id}", vendor_engagement_id: "${engagement_id}", amount_cents: 3000000, kind: "DEPOSIT" }
              as: ProgramUnderwriter
              captures: { disb1_id: $.data.id }
            - call: "GET /concierge/cases/${case_id}"
              payload: {}
              as: Any
              captures: { case_v1: $.data.version }
            - call: "POST /concierge/disbursements/${disb1_id}/approve"
              payload: { expected_case_version: "${case_v1}" }
              as: ProgramUnderwriter
            - call: "POST /concierge/disbursements"
              payload: { concierge_case_id: "${case_id}", improvement_project_id: "${project_id}", vendor_engagement_id: "${engagement_id}", amount_cents: 2000000, kind: "PROGRESS" }
              as: ProgramUnderwriter
              captures: { disb2_id: $.data.id }
            - call: "GET /concierge/cases/${case_id}"
              payload: {}
              as: Any
              captures: { case_v2: $.data.version }
            - call: "POST /concierge/disbursements/${disb2_id}/approve"
              payload: { expected_case_version: "${case_v2}" }
              as: ProgramUnderwriter
            - call: "POST /concierge/engagements/${engagement_id}/start"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /concierge/disbursements/${disb1_id}/release"
              payload: {}
              as: ProgramUnderwriter
            - call: "POST /concierge/disbursements/${disb2_id}/release"
              payload: {}
              as: ProgramUnderwriter
            - call: "POST /concierge/engagements/${engagement_id}/complete"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/verify"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases/${case_id}/listing-events"
              payload: { event_kind: "LISTED", event_at: "2026-09-01T00:00:00Z", price_cents: 105000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /concierge/cases/${case_id}/listing-events"
              payload: { event_kind: "CLOSED_UNSOLD", event_at: "2026-10-15T00:00:00Z", market_risk_flag: false }
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "GET /concierge/cases/${case_id}/closing-statement"
              payload: {}
              as: Any
              captures: { stmt_id: $.data.id }
            - call: "POST /concierge/closing-statements/${stmt_id}/finalize"
              payload: {}
              as: ProgramUnderwriter
          assert:
            - "ClosingStatement.${stmt_id}.advance_repayment_cents == 5000000"
            - "ClosingStatement.${stmt_id}.payoff_basis == NOT_LISTED_WITHIN_WINDOW"
            - "months_late == ceil((45 - 30) / 30) == 1"
            - "ClosingStatement.${stmt_id}.program_fee_cents == 50000 + 25000"
            - "ClosingStatement.${stmt_id}.program_fee_cents == 75000"
            - "ClosingStatement.${stmt_id}.late_fee_cents == 10000"
            - "ClosingStatement.${stmt_id}.net_repayment_cents == 5085000"

      - name: advance_limit_min_of_two_constraints
        grounds:
          - calculations.advance_limit_cents
          - entities.ConciergeCase.fields.advance_limit_cents
          - entities.ConciergeCase.fields.homeowner_contribution_cents
        distinguishing_aspect: |
          Advance limit uses mode (a) nested min with conditional branch on
          homeowner_contribution_cents: when contribution > 0 the limit is
          min(floor(proceeds * 0.15), proceeds - estimated_value), producing
          a different cap than the no-contribution path for the same proceeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two cases with identical proceeds and value but different homeowner_contribution_cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true, homeowner_contribution_cents: 0 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_no_contrib_id: $.data.id }
            - call: "POST /concierge/cases"
              payload: { address_line: "456 Oak Ave", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true, homeowner_contribution_cents: 1000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_contrib_id: $.data.id }
          trigger:
            - call: "POST /concierge/cases/${case_no_contrib_id}/eligibility/approve"
              payload: {}
              as: ProgramUnderwriter
            - call: "POST /concierge/cases/${case_contrib_id}/eligibility/approve"
              payload: {}
              as: ProgramUnderwriter
          assert:
            - "ConciergeCase.${case_no_contrib_id}.advance_limit_cents == 15000000"
            - "ConciergeCase.${case_contrib_id}.advance_limit_cents == 15000000"
            - "For the contribution case the limit is min(15000000, 20000000) = 15000000 — the contribution branch is taken but the min selects the rate limit"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: vendor_engagement_in_work_disputed_in_work_cycle
        grounds:
          - state_machines.VendorEngagement.IN_WORK_to_DISPUTED
          - state_machines.Dispute.IN_REVIEW_to_RESOLVED_VENDOR_FAULT
          - state_machines.Dispute.IN_REVIEW_to_RESOLVED_HOMEOWNER_FAULT
          - state_machines.Dispute.OPEN_to_WITHDRAWN
        distinguishing_aspect: |
          VendorEngagement has a cycle: IN_WORK -> DISPUTED -> IN_WORK on
          dispute resolution/withdrawal, allowing the same engagement to be
          disputed, resolved, and re-disputed.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ConciergeCase with an APPROVED project and an IN_WORK engagement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /concierge/agents"
              payload: { display_name: "Agent A", license_number: "LIC-001", brokerage: "Brokerage X" }
              as: PlatformAdmin
              captures: { agent_id: $.data.id }
            - call: "POST /concierge/vendors"
              payload: { legal_name: "Vendor V", trade: "GENERAL" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /concierge/vendors/${vendor_id}/capacity-windows"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", capacity_crew_days: 100 }
              as: PlatformAdmin
            - call: "POST /concierge/cases"
              payload: { address_line: "123 Main St", estimated_property_value_cents: 80000000, expected_sale_proceeds_cents: 100000000, listing_agreement_signed: true, listing_agreement_disclosure_ack: true }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { case_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/eligibility/approve"
              payload: {}
              as: ProgramUnderwriter
            - call: "POST /concierge/cases/${case_id}/projects"
              payload: { title: "Kitchen", recommended_by_agent: true, expected_sale_price_lift_cents: 5000000, estimated_cost_cents: 5000000 }
              as: ListingAgent
              as_user_id: "${agent_id}"
              captures: { project_id: $.data.id }
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/propose"
              payload: {}
              as: ListingAgent
              as_user_id: "${agent_id}"
            - call: "POST /concierge/cases/${case_id}/projects/${project_id}/approve"
              payload: {}
              as: Homeowner
            - call: "POST /concierge/engagements"
