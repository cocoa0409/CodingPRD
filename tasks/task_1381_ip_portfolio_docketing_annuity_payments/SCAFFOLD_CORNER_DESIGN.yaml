# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1381: IP Portfolio Docketing & Annuity Payments
# Sections follow references/claim-extraction-guide.md.
# Shared world shorthand used in prose: "world W" = US rule (oa 3mo, ext 2x1mo
# @20000, annuity years 3-5, surcharge 6mo 2500/5000bps, small 5000bps, tiers
# 10000/20000/30000/40000, paris 12, pct 30, fx 10000) + client + contact +
# family (cap 1000000, priority 2026-01-15). Every instance below spells out
# its own full chain regardless; the shorthand is never used inside
# setup_api_calls.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: entity_creation_defaults_and_system_fields
        claim_type: creation_defaults
        grounds: ["entities.Client.fields.default_currency", "entities.PatentFamily.fields.committed_forecast_cents", "entities.DocketEntry.fields.extension_count"]
        distinguishing_aspect: "Client created without default_currency gets USD; family created with committed_forecast_cents 0; docket entry created with extension_count 0, extension_fees_total_cents 0, status PENDING; server-minted id/version present and any client-supplied id is ignored."
        test_recipe:
          setup: ["US rule exists"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "DefaultCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id, cl_cur: $.data.default_currency, cl_v: $.data.version }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "DF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id, fam_c: $.data.committed_forecast_cents }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-D", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id, app_cnt: $.data.open_docket_count, app_st: $.data.status }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
          trigger:
            - call: "POST /applications/${app_id}/docket-entries"
              payload: { entry_type: "STATUTORY", title: "S1", base_due_date: "2026-09-01" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { en_ext: $.data.extension_count, en_fees: $.data.extension_fees_total_cents, en_st: $.data.status, en_due: $.data.current_due_date, en_v: $.data.version }

          assert:
            - "cl_cur == USD"
            - "cl_v == 1"
            - "fam_c == 0"
            - "app_cnt == 0"
            - "app_st == DRAFT at creation"
            - "en_ext == 0 and en_fees == 0 and en_st == PENDING and en_v == 1"
            - "en_due == 2026-09-01 (current_due_date initialized from base_due_date)"

      - name: entity_required_and_enum_validation
        claim_type: required_fields_and_type_constraints
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required field (jurisdiction omitted) and bad enum (entity_size MEGA) both yield ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["US rule; client; family"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "ReqCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "RF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

          trigger:
            - call: "POST /families/${fam_id}/applications"
              payload: { application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-M1", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { err_missing: $.data.error_id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-M2", entity_size: "MEGA" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { err_enum: $.data.error_id }

          assert:
            - "err_missing == ERR_INVALID_REQUEST"
            - "err_enum == ERR_INVALID_REQUEST"

      - name: entity_not_found_on_read_and_path_parent
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent UUID returns 404; child creation under a non-existent parent path id also returns 404 (left-to-right path resolution)."
        test_recipe:
          setup: ["One client exists (its id is not referenced by the trigger calls)"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "NfCo" }
              as: PlatformAdmin
          trigger:
            - call: "GET /applications/00000000-0000-0000-0000-000000000000"
              as: Any
              captures: { err_get: $.data.error_id }

            - call: "POST /applications/00000000-0000-0000-0000-000000000000/docket-entries"
              payload: { entry_type: "STATUTORY", title: "X", base_due_date: "2026-09-01" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { err_post: $.data.error_id }

          assert:
            - "err_get == ERR_NOT_FOUND"
            - "err_post == ERR_NOT_FOUND"

      - name: fk_reverse_reachability_returns_arrays
        claim_type: parent_relationships
        grounds: ["entities.OfficeAction.fields.docket_entry_id", "entities.AnnuityObligation.fields.application_id"]
        distinguishing_aspect: "Sub-resource reverse GETs return arrays: GET /docket-entries/{id}/office-actions returns a 1-element array for an OA-linked entry and 0-element for a manual entry; obligations list returns 3 rows in period_year order after grant."
        test_recipe:
          setup: ["US rule; client; family; app filed and granted 2026-03-01; OA NON_FINAL_REJECTION mailed 2026-05-20 (auto entry E) plus one manual entry M"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "FKCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "FF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-FK", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/office-actions"
              payload: { action_type: "NON_FINAL_REJECTION", mail_date: "2026-05-20" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { oa_id: $.data.id, en_oa: $.data.docket_entry_id }

            - call: "POST /applications/${app_id}/docket-entries"
              payload: { entry_type: "RECORDATION", title: "M", base_due_date: "2026-09-01" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { en_m: $.data.id }

            - call: "POST /applications/${app_id}/grant"
              payload: { grant_date: "2026-03-01" }
              as: DocketingClerk
              as_user_id: clerk-1
          trigger:
            - call: "GET /docket-entries/${en_oa}/office-actions"
              as: Any
              captures: { linked_oa: "$.data[0].id" }

            - call: "GET /docket-entries/${en_m}/office-actions"
              as: Any
            - call: "GET /applications/${app_id}/annuity-obligations"
              as: Any
              captures: { y1: "$.data[0].period_year", y3: "$.data[2].period_year" }

          assert:
            - "linked_oa == ${oa_id}"
            - "GET /docket-entries/${en_m}/office-actions returns an empty array (length 0)"
            - "y1 == 3 and y3 == 5 (ascending period_year order)"

      - name: self_referential_continuation_chain_rules
        claim_type: type_constraints
        grounds: ["calculations.continuation_chain_check", "validations[priority=17]", "errors[ERR_PARENT_FAMILY_MISMATCH]", "errors[ERR_PARENT_NOT_PCT]"]
        distinguishing_aspect: "CONTINUATION requires a same-family non-LAPSED parent; cross-family parent rejected (ERR_PARENT_FAMILY_MISMATCH); PCT_NATIONAL_PHASE under a non-PCT parent rejected (ERR_PARENT_NOT_PCT); valid CONTINUATION child creation succeeds and is listed via the parent_application_id filter."
        test_recipe:
          setup: ["US rule; two clients each with a family; family F1 has PENDING app P1; family F2 (other client) has PENDING app P2"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "ChainCo1" }
              as: PlatformAdmin
              captures: { cl1: $.data.id }

            - call: "POST /clients"
              payload: { display_name: "ChainCo2" }
              as: PlatformAdmin
              captures: { cl2: $.data.id }

            - call: "POST /clients/${cl1}/families"
              payload: { title: "F1", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam1: $.data.id }

            - call: "POST /clients/${cl2}/families"
              payload: { title: "F2", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam2: $.data.id }

            - call: "POST /families/${fam1}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-P1", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { p1: $.data.id }

            - call: "POST /applications/${p1}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /families/${fam2}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-P2", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { p2: $.data.id }

          trigger:
            - call: "POST /families/${fam1}/applications"
              payload: { jurisdiction: "US", application_type: "CONTINUATION", filing_date: "2026-06-01", application_number: "US-C1", entity_size: "LARGE", parent_application_id: "${p1}" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { c1: $.data.id }

            - call: "POST /families/${fam1}/applications"
              payload: { jurisdiction: "US", application_type: "CONTINUATION", filing_date: "2026-06-01", application_number: "US-C2", entity_size: "LARGE", parent_application_id: "${p2}" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { err_xfam: $.data.error_id }

            - call: "POST /families/${fam1}/applications"
              payload: { jurisdiction: "US", application_type: "PCT_NATIONAL_PHASE", filing_date: "2026-06-01", application_number: "US-NP1", entity_size: "LARGE", parent_application_id: "${p1}" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { err_notpct: $.data.error_id }

            - call: "GET /applications"
              payload: { parent_application_id: "${p1}" }
              as: Any
              captures: { child0: "$.data[0].id" }

          assert:
            - "c1 is a created application id (valid continuation accepted)"
            - "err_xfam == ERR_PARENT_FAMILY_MISMATCH"
            - "err_notpct == ERR_PARENT_NOT_PCT"
            - "child0 == ${c1}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: invalid_transition_application_grant_from_draft
        claim_type: invalid_transition
        grounds: ["state_machines.Application", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Application in DRAFT rejects /grant (only PENDING -> GRANTED exists) with ERR_INVALID_STATE; double /file on PENDING also rejected."
        test_recipe:
          setup: ["US rule; client; family; DRAFT app"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "SMCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "SF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-SM", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id }

          trigger:
            - call: "POST /applications/${app_id}/grant"
              payload: { grant_date: "2026-03-01" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { err_grant: $.data.error_id }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { err_refile: $.data.error_id }

          assert:
            - "err_grant == ERR_INVALID_STATE"
            - "err_refile == ERR_INVALID_STATE (second identical trigger is rejected; transitions are not idempotent)"

      - name: terminal_lockdown_annuity_paid_confirmed
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.AnnuityObligation", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A PAID_CONFIRMED obligation rejects every further transition (deauthorize, instruct-payment, raise-confirmation-query, new authorization) with ERR_ALREADY_TERMINAL."
        test_recipe:
          setup: ["US rule; family cap 1000000; contact; GRANTED app; y3 obligation fully paid (authorized 10000, released, instructed, confirmed paid on due 2028-09-01)"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "TermCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/contacts"
              payload: { full_name: "C A", email: "ca@x.com" }
              as: PlatformAdmin
              captures: { ct_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "TF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-T", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/grant"
              payload: { grant_date: "2026-03-01" }
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "GET /applications/${app_id}/annuity-obligations"
              as: Any
              captures: { ob_id: "$.data[0].id" }

            - call: "GET /annuity-obligations/${ob_id}"
              as: Any
              captures: { ob_v: $.data.version }

            - call: "POST /annuity-obligations/${ob_id}/authorizations"
              payload: { amount_cents: 10000, expected_annuity_obligation_version: "${ob_v}" }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { au_id: $.data.id }

            - call: "POST /authorizations/${au_id}/approve"
              payload: {}
              as: ClientApprover
              as_user_id: "${ct_id}"
            - call: "POST /authorizations/${au_id}/release"
              payload: {}
              as: FinanceOfficer
              as_user_id: fin-1
            - call: "POST /annuity-obligations/${ob_id}/instruct-payment"
              payload: {}
              as: FinanceOfficer
              as_user_id: fin-1
            - call: "POST /annuity-obligations/${ob_id}/confirm-payment"
              payload: { paid_date: "2028-09-01" }
              as: FinanceOfficer
              as_user_id: fin-1
          trigger:
            - call: "POST /annuity-obligations/${ob_id}/deauthorize"
              payload: {}
              as: DocketingManager
              as_user_id: mgr-1
              captures: { err_deauth: $.data.error_id }

            - call: "POST /annuity-obligations/${ob_id}/raise-confirmation-query"
              payload: {}
              as: FinanceOfficer
              as_user_id: fin-1
              captures: { err_query: $.data.error_id }

          assert:
            - "err_deauth == ERR_ALREADY_TERMINAL"
            - "err_query == ERR_ALREADY_TERMINAL"

      - name: terminal_lockdown_authorization_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.PaymentAuthorization", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "A REJECTED authorization rejects approve/release with ERR_ALREADY_TERMINAL; its obligation is back at SCHEDULED and CAN accept a fresh authorization (cycle evidence)."
        test_recipe:
          setup: ["US rule; family; contact; GRANTED app; y3 obligation authorization requested then rejected"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction: "US", oa_response_months: 3, max_extensions: 2, extension_months: 1, extension_fee_cents: 20000, annuity_start_year: 3, term_years: 5, surcharge_window_months: 6, surcharge_bps_month_1: 2500, surcharge_bps_late: 5000, small_entity_multiplier_bps: 5000, fee_tier_bounds: "1-3|4-7|8-12|13-20", fee_tier_1_cents: 10000, fee_tier_2_cents: 20000, fee_tier_3_cents: 30000, fee_tier_4_cents: 40000, paris_window_months: 12, pct_window_months: 30, fx_to_usd_cents_bps: 10000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { display_name: "RejCo" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/contacts"
              payload: { full_name: "C A", email: "ca@x.com" }
              as: PlatformAdmin
              captures: { ct_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "RF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
              as: DocketingManager
              as_user_id: mgr-1
              captures: { fam_id: $.data.id }

            - call: "POST /families/${fam_id}/applications"
              payload: { jurisdiction: "US", application_type: "ORIGINAL", filing_date: "2026-02-01", application_number: "US-RJ", entity_size: "LARGE" }
              as: DocketingClerk
              as_user_id: clerk-1
              captures: { app_id: $.data.id }

            - call: "POST /applications/${app_id}/file"
              payload: {}
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "POST /applications/${app_id}/grant"
              payload: { grant_date: "2026-03-01" }
              as: DocketingClerk
              as_user_id: clerk-1
            - call: "GET /applications/${app_id}/annuity-obligations"
              as: Any
              captures: { ob_id: "$.data[0].id" }

            - call: "GET /annuity-obligations/${ob_id}"
              as: Any
              captures: { ob_v1: $.data.version }

