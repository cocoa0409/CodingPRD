              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-IL", hire_date: "2023-08-03", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${participant_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { election_id: $.data.id }
            - call: "POST /api/deferral-elections/${election_id}/submit"
              as: Participant
              as_user_id: "${participant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections/${election_id}/post-deferral"
              payload: { amount_cents: 100000, service_period_start: "2027-01-01", service_period_end: "2027-01-31" }
              as: BenefitsAdministrator
            - call: "POST /api/accounts/${account_id}/settle-entries"
              as: BenefitsAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/operational-failures"
              payload: { account_id: "${account_id}", failure_type: "EARLY_PAYMENT", failure_date: "2027-01-15", amount_cents: 500000, description: "paid before permissible date" }
              as: BenefitsAdministrator
              as_user_id: "ba-1"
              captures: { failure_id: $.data.id, liability0: $.data.status }
            - call: "GET /api/participants/${participant_id}"
              as: BenefitsAdministrator
              captures: { liability_before: $.data.inclusion_liability_cents }
          trigger:
            - call: "POST /api/operational-failures/${failure_id}/quantify"
              payload: { correction_credit_cents: 0 }
              as: ComplianceOfficer
              captures: { q_base: $.data.includible_base_cents, q_interest: $.data.premium_interest_cents, q_tax: $.data.additional_tax_cents, q_total: $.data.total_inclusion_cents }
            - call: "POST /api/operational-failures/${failure_id}/assess-inclusion"
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "GET /api/participants/${participant_id}"
              as: BenefitsAdministrator
              captures: { liability_after_assess: $.data.inclusion_liability_cents }
            - call: "GET /api/accounts/${account_id}"
              as: BenefitsAdministrator
              captures: { acct_flagged: $.data.status }
            - call: "POST /api/operational-failures/${failure_id}/correct"
              as: ComplianceOfficer
            - call: "GET /api/participants/${participant_id}"
              as: BenefitsAdministrator
              captures: { liability_after_correct: $.data.inclusion_liability_cents }
            - call: "GET /api/accounts/${account_id}"
              as: BenefitsAdministrator
              captures: { acct_restored: $.data.status }
          assert:
            - "${liability_before} == 0"
            - "${q_base} == 500000 and ${q_interest} == 1863 and ${q_tax} == 100000 and ${q_total} == 501863 (500000*800*17/3650000 = 1863.01 -> 1863)"
            - "${liability_after_assess} == 501863 (forward action)"
            - "${acct_flagged} == FLAGGED_FOR_INCLUSION"
            - "${liability_after_correct} == 0 (compensating action: liability_after_correct == liability_before_assess exactly)"
            - "${acct_restored} == ACTIVE"
            - "OperationalFailureCase.${failure_id}.status == CORRECTED"
