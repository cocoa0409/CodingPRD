  # ===================================================================
  # Rule 4 — transitive_cascade (3 instances, different triggers)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: execute_closing_cascade_depth4
        grounds:
          - state_machines.Acquisition.PRE_CLOSING_to_CLOSED
          - state_machines.SecurityDepositLedgerEntry.ESCROW_QUEUED_to_TRANSFERRED
          - calculations.statement_netting
        distinguishing_aspect: |
          Trigger execute-closing: (A) acquisition closes -> (B) queued deposit
          (and ASSUMED contract/policy) -> TRANSFERRED -> (C) DEPOSIT_TRANSFER
          GENERATED line regenerated on the APPROVED FINAL statement ->
          (D) statement totals and Acquisition.net_proration_cents recompute.
          Depth 4; each hop caused by the previous hop, not by the trigger.
        test_recipe:
          setup:
            - "Acquisition (price 200000000, closing 2026-09-12) fully advanced: unit VERIFIED (lease 150000/rent roll match, walk QA'd, deposit 150000+3090 stated 153090 reconciled), diligence complete, tax projection approved (2000000), DRAFT_CLOSING approved, PRE_CLOSING"
            - "Service contract ASSUMED (300000/mo prepaid through 2026-12-31); insurance policy ASSUMED (premium 1200000 prepaid through 2027-03-31, loss run 100000 => LOW)"
            - "FINAL_CLOSING generated while the deposit is still RECONCILED (no DEPOSIT_TRANSFER line yet) and APPROVED; deposit then ESCROW_QUEUED; clock at 2026-09-12"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Cascade Deal", address: "15 Walnut St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
