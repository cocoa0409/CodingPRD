# =============================================================================
# SCAFFOLD.yaml — Blow Molding & Bottle Plant (task_1308)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Blow Molding & Bottle Plant (Plastipak style bottle plant): preform/parison &
  mold cavitation, resin/color & bottle weight target, leak & drop testing lot,
  warehouse vs blow-on-site logistics, freight of air (cube) pricing,
  label/decoration inline, mold change & cavity blockout, customer bottle
  qualification.

domain_name: blow-molding-bottle-plant
api_prefix: /plant

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

conventions:
  list_ordering: "All list endpoints return rows ordered by created_at ASC (ties impossible to observe at 1ms resolution; no id-based tie-break is ever used)."
  validation_tiebreak: "Within §1.4 rows sharing the same priority number, the earlier-listed row wins."
  logical_clock: "All datetime comparisons (slot windows, dock windows, blocked_at, no-show) read the logical clock set by POST /plant/_clock/set_current_utc; default 2026-08-01T00:00:00Z."

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities, flat topology with FK links)
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer legal name" }
      - { name: customer_code, type: string, source: input, description: "Unique customer code", constraints: "unique across all customers" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open production-order exposure in cents" }
      - { name: default_logistics_mode, type: enum, source: input, description: "WAREHOUSE | BLOW_ON_SITE; default for new orders", default: WAREHOUSE, constraints: "WAREHOUSE | BLOW_ON_SITE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "ACTIVE | SUSPENDED" }

  - name: FreightRateCard
    parent: null
    common_fields: true
    fields:
      - { name: lane_code, type: string, source: input, description: "Lane identifier, unique", constraints: "unique" }
      - { name: tiers, type: array, source: input, description: "Marginal chargeable-weight tiers: [{min_kg, rate_cents_per_kg}], ascending min_kg, first min_kg must be 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE; creating a card makes it ACTIVE and flips all others to INACTIVE", default: ACTIVE, constraints: "ACTIVE | INACTIVE" }

  - name: BottleSpec
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: spec_code, type: string, source: input, description: "Spec code, unique per customer", constraints: "unique within customer" }
      - { name: resin_type, type: enum, source: input, description: "Resin family", constraints: "PET | HDPE | PP" }
      - { name: color_contrast_class, type: enum, source: input, description: "Color class driving purge multiplier", constraints: "CLEAR | LIGHT | DARK" }
      - { name: target_weight_g, type: number, source: input, description: "Bottle weight target in grams" }
      - { name: weight_tolerance_pct, type: number, source: input, description: "Allowed mean-weight deviation percent", default: 2.0 }
      - { name: neck_finish, type: string, source: input, description: "Neck finish code, e.g. PCO1881" }
      - { name: height_mm, type: number, source: input, description: "Bottle height" }
      - { name: diameter_mm, type: number, source: input, description: "Bottle max diameter" }
      - { name: bottle_cube_cm3, type: integer, source: input, description: "Shipping cube per finished bottle in cm3 (drives freight-of-air)" }
      - { name: preform_cube_cm3, type: integer, source: input, description: "Shipping cube per preform in cm3" }
      - { name: preform_weight_g, type: number, source: input, description: "Preform weight in grams" }
      - { name: unit_price_cents, type: integer, source: input, description: "Contract price per bottle, used for credit exposure" }
      - { name: label_type, type: enum, source: input, description: "Inline decoration required", constraints: "NONE | PRESSURE_SENSITIVE | SHRINK_SLEEVE | IN_MOLD" }
      - { name: min_cavitation_required, type: integer, source: input, description: "Minimum effective cavities a mold must have to run this spec" }
      - { name: requires_inline_labeler, type: boolean, source: computed, description: "true iff label_type != NONE" }
      - { name: content_revision, type: integer, source: system, description: "Starts at 1; increments on every PATCH of a content field" }
      - { name: qualified_revision, type: integer, source: system, description: "content_revision that was approved by the latest APPROVED qualification run; null until first approval" }
      - { name: rejected_revision, type: integer, source: system, description: "content_revision at the time of the latest qualification rejection; null if none" }
      - { name: qualification_round, type: integer, source: computed, description: "Count of QualificationRun rows for this spec" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "DRAFT | SUBMITTED | IN_QUALIFICATION | REVISION_REQUESTED | QUALIFIED | PRODUCTION_ACTIVE | RETIRED" }

  - name: QualificationRun
    parent: null
    common_fields: true
    fields:
      - { name: bottle_spec_id, type: string, source: input, description: "FK -> BottleSpec.id; spec under qualification" }
      - { name: round_no, type: integer, source: system, description: "1-based ordinal among runs of this spec, by created_at ASC" }
      - { name: spec_revision_pinned, type: integer, source: system, description: "BottleSpec.content_revision snapshot taken at run creation" }
      - { name: sample_cavity_count, type: integer, source: input, description: "Number of mold cavities sampled for first-article measurement" }
      - { name: measured_mean_weight_g, type: number, source: input, description: "Sample mean bottle weight, supplied on execute" }
      - { name: weight_spread_g, type: number, source: input, description: "max-min weight across sampled cavities, supplied on execute" }
      - { name: visual_defects, type: integer, source: input, description: "Count of visual defects in the sample, supplied on execute" }
      - { name: weight_within_tolerance, type: boolean, source: computed, description: "abs(measured_mean_weight_g - spec.target_weight_g) <= spec.target_weight_g * spec.weight_tolerance_pct/100; computed on execute" }
      - { name: review_note, type: string, source: input, description: "Customer review note (optional on review)" }
      - { name: status, type: enum, source: system, description: "PLANNED | EXECUTED | CUSTOMER_REVIEW | APPROVED | REJECTED", constraints: "PLANNED | EXECUTED | CUSTOMER_REVIEW | APPROVED | REJECTED" }

  - name: Mold
    parent: null
    common_fields: true
    fields:
      - { name: mold_code, type: string, source: input, description: "Unique mold asset code", constraints: "unique" }
      - { name: base_cavities, type: integer, source: input, description: "Total physical cavities in the mold" }
      - { name: compatible_resins, type: array, source: input, description: "Resin families this mold may run; subset of PET|HDPE|PP" }
      - { name: reference_weight_g, type: number, source: input, description: "Bottle weight at which nominal cycle time applies" }
      - { name: installed_line_id, type: string, source: system, description: "FK -> MachineLine.id; line the mold is currently installed on; null when STORAGE" }
      - { name: effective_cavities, type: integer, source: computed, description: "base_cavities minus count of CavityBlockout rows with status OPEN for this mold" }
      - { name: active_blockout_count, type: integer, source: computed, description: "Count of OPEN CavityBlockout rows" }
      - { name: status, type: enum, source: system, description: "STORAGE | INSTALLED", default: STORAGE, constraints: "STORAGE | INSTALLED" }

  - name: CavityBlockout
    parent: null
    common_fields: true
    fields:
      - { name: mold_id, type: string, source: input, description: "FK -> Mold.id; mold with the blocked cavity (from path)" }
      - { name: cavity_index, type: integer, source: input, description: "1-based cavity number; must be <= mold.base_cavities" }
      - { name: reason, type: enum, source: input, description: "Blockout reason; QUALITY_HOLD and CONTAMINATION_HOLD gate production", constraints: "DAMAGE | CONTAMINATION_HOLD | PREVENTIVE | QUALITY_HOLD" }
      - { name: blocked_at, type: datetime, source: system, description: "Logical clock time at creation" }
      - { name: cleared_at, type: datetime, source: system, description: "Logical clock time at clear; null while OPEN" }
      - { name: status, type: enum, source: system, description: "OPEN | CLEARED", default: OPEN, constraints: "OPEN | CLEARED" }

  - name: MachineLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique line code", constraints: "unique" }
      - { name: has_inline_labeler, type: boolean, source: input, description: "Whether the line can apply labels inline" }
      - { name: max_bottle_diameter_mm, type: number, source: input, description: "Maximum bottle diameter the line handles" }
      - { name: resident_volume_kg, type: number, source: input, description: "Material resident volume of extruder/head; basis of purge calculation" }
      - { name: last_color_class, type: enum, source: system, description: "color_contrast_class of the most recently closed non-voided run on this line; null until first close", constraints: "CLEAR | LIGHT | DARK | null" }
      - { name: status, type: enum, source: system, description: "IDLE | CHANGEOVER | RUNNING", default: IDLE, constraints: "IDLE | CHANGEOVER | RUNNING" }

  - name: ScheduleSlot
    parent: null
    common_fields: true
    fields:
      - { name: machine_line_id, type: string, source: input, description: "FK -> MachineLine.id; line reserved" }
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id; order occupying the slot" }
      - { name: mold_id, type: string, source: system, description: "FK -> Mold.id; snapshot of the mold installed on the line at schedule time; null if none" }
      - { name: planned_start, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: planned_end, type: datetime, source: input, description: "Half-open window end (exclusive); must be > planned_start" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | IN_PROGRESS | COMPLETED | CANCELLED", default: CONFIRMED, constraints: "CONFIRMED | IN_PROGRESS | COMPLETED | CANCELLED" }

  - name: MaterialLot
    parent: null
    common_fields: true
    fields:
      - { name: material_type, type: enum, source: input, description: "RESIN | COLORANT", constraints: "RESIN | COLORANT" }
      - { name: resin_type, type: enum, source: input, description: "Required when material_type=RESIN", constraints: "PET | HDPE | PP | null" }
      - { name: color_code, type: string, source: input, description: "Required when material_type=COLORANT", constraints: "null for RESIN" }
      - { name: lot_code, type: string, source: input, description: "Unique supplier lot code", constraints: "unique" }
      - { name: received_kg, type: number, source: input, description: "Received quantity in kg" }
      - { name: available_kg, type: number, source: computed, description: "received_kg - consumed_kg - purge_wasted_kg; never negative" }
      - { name: consumed_kg, type: number, source: computed, description: "Cumulative production consumption debited by run closes (waterfall), credited by voids", default: 0 }
      - { name: purge_wasted_kg, type: number, source: computed, description: "Cumulative purge waste debited on color-change run closes", default: 0 }
      - { name: status, type: enum, source: system, description: "QUARANTINED | RELEASED | IN_USE | DEPLETED | REJECTED", default: QUARANTINED, constraints: "QUARANTINED | RELEASED | IN_USE | DEPLETED | REJECTED" }

  - name: ProductionOrder
    parent: null
    common_fields: true
    fields:
      - { name: bottle_spec_id, type: string, source: input, description: "FK -> BottleSpec.id; spec being produced" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from spec at creation" }
      - { name: logistics_mode, type: enum, source: input, description: "WAREHOUSE (ship finished bottles) | BLOW_ON_SITE (ship preforms); defaults to customer.default_logistics_mode", constraints: "WAREHOUSE | BLOW_ON_SITE" }
      - { name: quantity_ordered, type: integer, source: input, description: "Ordered unit count (bottles, or preforms when BLOW_ON_SITE)" }
      - { name: planned_weight_g, type: number, source: input, description: "Planned unit weight; must lie within spec tolerance band" }
      - { name: spec_revision_baseline, type: integer, source: system, description: "spec content_revision pinned at release; re-pinned by reschedule" }
      - { name: quantity_produced, type: integer, source: computed, description: "Sum over non-VOIDED runs of (good_count + scrap_count)", default: 0 }
      - { name: quantity_good, type: integer, source: computed, description: "Sum over non-VOIDED runs of good_count", default: 0 }
      - { name: quantity_scrapped, type: integer, source: computed, description: "Sum over non-VOIDED runs of scrap_count", default: 0 }
      - { name: quantity_accepted, type: integer, source: computed, description: "Sum of lot_size over QualityTestLot rows of the order's non-VOIDED runs with status ACCEPTED", default: 0 }
      - { name: quantity_qc_scrapped, type: integer, source: computed, description: "Sum of lot_size over QualityTestLot rows with status SCRAPPED", default: 0 }
      - { name: quantity_open_qc, type: integer, source: computed, description: "quantity_good - quantity_accepted - quantity_qc_scrapped", default: 0 }
      - { name: quantity_reserved, type: integer, source: computed, description: "Sum of quantity over the order's Shipments in BOOKED | LOADING | IN_TRANSIT", default: 0 }
      - { name: quantity_shipped, type: integer, source: computed, description: "Sum of quantity over the order's Shipments in DELIVERED", default: 0 }
      - { name: quantity_unallocated, type: integer, source: computed, description: "quantity_accepted - quantity_reserved - quantity_shipped", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | RELEASED | RUNNING | HELD | COMPLETED | CANCELLED", default: DRAFT, constraints: "DRAFT | SCHEDULED | RELEASED | RUNNING | HELD | COMPLETED | CANCELLED" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id" }
      - { name: machine_line_id, type: string, source: input, description: "FK -> MachineLine.id" }
      - { name: mold_id, type: string, source: input, description: "FK -> Mold.id; must equal the mold installed on the line" }
      - { name: material_lot_id, type: string, source: input, description: "FK -> MaterialLot.id; primary resin lot (first debit target)" }
      - { name: colorant_lot_id, type: string, source: input, description: "FK -> MaterialLot.id; colorant lot, required when spec.color_contrast_class != CLEAR", constraints: "nullable" }
      - { name: cavities_active_at_start, type: integer, source: system, description: "Mold.effective_cavities snapshot at run start" }
      - { name: started_at, type: datetime, source: system, description: "Logical clock time at creation" }
      - { name: ended_at, type: datetime, source: system, description: "Logical clock time at close; null while OPEN" }
      - { name: cycles_completed, type: integer, source: input, description: "Machine cycles reported on close" }
      - { name: good_count, type: integer, source: input, description: "Good units reported on close" }
      - { name: scrap_count, type: integer, source: input, description: "Scrapped units reported on close" }
      - { name: actual_drawdown_kg, type: number, source: input, description: "Measured resin drawdown kg reported on close (actual variant)" }
      - { name: provisional_consumption_kg, type: number, source: computed, description: "cycles_completed * cavities_active_at_start * order.planned_weight_g / 1000 (provisional variant)" }
      - { name: consumption_variance_pct, type: number, source: computed, description: "round_half_up((actual_drawdown_kg - provisional_consumption_kg)/provisional_consumption_kg * 100, 2)" }
      - { name: variance_alert, type: boolean, source: computed, description: "true iff consumption_variance_pct > VARIANCE_TOLERANCE_PCT (3.0)" }
      - { name: purge_kg, type: number, source: computed, description: "Purge waste charged on this close per purge_quantity_on_color_change" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | VOIDED", default: OPEN, constraints: "OPEN | CLOSED | VOIDED" }

  - name: QualityTestLot
    parent: null
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: system, description: "FK -> ProductionRun.id; auto-created when a run closes" }
      - { name: lot_size, type: integer, source: system, description: "Snapshot of run.good_count at close" }
      - { name: sample_size_n, type: integer, source: computed, description: "Sample size from AQL band table keyed on lot_size" }
      - { name: accept_number_leak, type: integer, source: computed, description: "Max allowed leak failures (inclusive) per AQL band" }
      - { name: accept_number_drop, type: integer, source: computed, description: "Max allowed drop failures (inclusive) per AQL band" }
      - { name: leak_failures, type: integer, source: input, description: "Leak failures found, on record-results" }
      - { name: drop_failures, type: integer, source: input, description: "Drop-test failures found, on record-results" }
      - { name: retest_count, type: integer, source: system, description: "Increments each time a REJECTED lot is dispositioned REWORK", default: 0 }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the QualityTechnician who recorded results; null until recorded" }
      - { name: dispositioned_by_user_id, type: string, source: system, description: "X-User-ID of the QualityTechnician who dispositioned; must differ from recorded_by_user_id" }
      - { name: status, type: enum, source: system, description: "PENDING | SAMPLED | ACCEPTED | REJECTED | SCRAPPED | VOIDED", default: PENDING, constraints: "PENDING | SAMPLED | ACCEPTED | REJECTED | SCRAPPED | VOIDED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from the order" }
      - { name: shipment_mode, type: enum, source: input, description: "FINISHED_BOTTLES | PREFORMS; must match order.logistics_mode", constraints: "FINISHED_BOTTLES | PREFORMS" }
      - { name: quantity, type: integer, source: input, description: "Units shipped (bottles or preforms); must be > 0" }
      - { name: pallets, type: integer, source: computed, description: "ceil(quantity / units_per_pallet[mode])" }
      - { name: volume_cm3, type: integer, source: computed, description: "quantity * unit_cube + pallets * PALLET_CUBE_CM3" }
      - { name: dim_weight_kg, type: number, source: computed, description: "Per-pallet dim weight rounded half-up to 0.1 kg, then summed (see freight_of_air_charge)" }
      - { name: actual_weight_kg, type: number, source: computed, description: "quantity * unit_weight_g/1000 + pallets * PALLET_TARE_KG, round_half_up 2dp" }
      - { name: chargeable_weight_kg, type: number, source: computed, description: "max(dim_weight_kg, actual_weight_kg)" }
      - { name: freight_cost_cents, type: integer, source: computed, description: "Marginal tier pricing over chargeable_weight_kg; per-tier rounded half-up to cents then summed" }
      - { name: booked_appointment_id, type: string, source: system, description: "FK -> DockAppointment.id; set on book, cleared on cancel/no-show" }
      - { name: status, type: enum, source: system, description: "QUOTED | BOOKED | LOADING | IN_TRANSIT | DELIVERED | CANCELLED", default: QUOTED, constraints: "QUOTED | BOOKED | LOADING | IN_TRANSIT | DELIVERED | CANCELLED" }

  - name: DockAppointment
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id" }
      - { name: dock_door, type: integer, source: input, description: "Dock door number, 1..3" }
      - { name: window_start, type: datetime, source: input, description: "Closed window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Closed window end (inclusive); must be > window_start" }
      - { name: status, type: enum, source: system, description: "RESERVED | OCCUPIED | COMPLETED | NO_SHOW | CANCELLED", default: RESERVED, constraints: "RESERVED | OCCUPIED | COMPLETED | NO_SHOW | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /plant/customers/{id}/suspend"
        actor: PlantAdmin
        preconditions: ["customer.status == ACTIVE"]
        side_effects:
          - "Every ProductionOrder with customer_id == this customer and status IN {DRAFT, SCHEDULED, RELEASED, HELD} transitions to CANCELLED"
          - "For each such cancelled order, every ScheduleSlot with production_order_id == order.id and status IN {CONFIRMED, IN_PROGRESS} transitions to CANCELLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /plant/customers/{id}/reactivate"
        actor: PlantAdmin
        preconditions: ["customer.status == SUSPENDED"]
        side_effects: []

  - entity: BottleSpec
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /plant/bottle-specs/{id}/submit"
        actor: ProcessEngineer
        preconditions: ["spec.status == DRAFT"]
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /plant/bottle-specs/{id}/submit"
        actor: ProcessEngineer
        preconditions: ["spec.status == REVISION_REQUESTED", "spec.content_revision > spec.rejected_revision (rejected_revision is pinned on every entry into REVISION_REQUESTED)"]
        side_effects: []
      - from: SUBMITTED
        to: IN_QUALIFICATION
        trigger: "POST /plant/bottle-specs/{id}/begin-qualification"
        actor: ProcessEngineer
        preconditions: ["spec.status == SUBMITTED"]
        side_effects: []
      - from: IN_QUALIFICATION
        to: QUALIFIED
        trigger: "system: QualificationRun review with decision APPROVE"
        actor: system
        preconditions: ["the reviewed run.spec_revision_pinned == spec.content_revision", "the reviewed run.weight_within_tolerance == true"]
        side_effects:
          - "spec.qualified_revision := run.spec_revision_pinned"
      - from: IN_QUALIFICATION
        to: REVISION_REQUESTED
        trigger: "system: QualificationRun review with decision REJECT"
        actor: system
        preconditions: []
        side_effects:
          - "spec.rejected_revision := spec.content_revision"
      - from: QUALIFIED
        to: PRODUCTION_ACTIVE
        trigger: "system: first successful schedule of a ProductionOrder against this spec"
        actor: system
        preconditions: []
        side_effects: []
      - from: PRODUCTION_ACTIVE
        to: REVISION_REQUESTED
        trigger: "system: PATCH /plant/bottle-specs/{id} changes any content field"
        actor: system
        preconditions: []
        side_effects:
          - "spec.content_revision increments by 1"
          - "spec.rejected_revision := spec.content_revision (after the increment); resubmission therefore requires at least one further content edit"
          - "Every ProductionOrder with bottle_spec_id == spec.id and status IN {DRAFT, SCHEDULED} transitions to CANCELLED"
          - "For each such cancelled order, every ScheduleSlot with production_order_id == order.id and status IN {CONFIRMED, IN_PROGRESS} transitions to CANCELLED"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /plant/bottle-specs/{id}/retire"
        actor: ProcessEngineer
        preconditions: ["no ProductionOrder with bottle_spec_id == spec.id in status IN {SCHEDULED, RELEASED, RUNNING, HELD}"]
        side_effects: []
      - from: QUALIFIED
        to: RETIRED
        trigger: "POST /plant/bottle-specs/{id}/retire"
        actor: ProcessEngineer
        preconditions: ["no ProductionOrder with bottle_spec_id == spec.id in status IN {SCHEDULED, RELEASED, RUNNING, HELD}"]
        side_effects: []
      - from: PRODUCTION_ACTIVE
        to: RETIRED
        trigger: "POST /plant/bottle-specs/{id}/retire"
        actor: ProcessEngineer
        preconditions: ["no ProductionOrder with bottle_spec_id == spec.id in status IN {SCHEDULED, RELEASED, RUNNING, HELD}"]
        side_effects: []

  - entity: QualificationRun
    initial_state: PLANNED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PLANNED
        to: EXECUTED
        trigger: "POST /plant/qualification-runs/{id}/execute"
        actor: ProcessEngineer
        preconditions: ["run.status == PLANNED"]
        side_effects:
          - "recompute run.weight_within_tolerance from the spec's current target/tolerance"
      - from: EXECUTED
        to: EXECUTED
        trigger: "POST /plant/qualification-runs/{id}/execute"
        actor: ProcessEngineer
        preconditions: ["run.status == EXECUTED"]
        side_effects:
          - "recompute run.weight_within_tolerance (re-measurement after REQUEST_MORE_DATA)"
      - from: EXECUTED
        to: CUSTOMER_REVIEW
        trigger: "POST /plant/qualification-runs/{id}/submit-review"
        actor: QualityTechnician
        preconditions: ["run.status == EXECUTED"]
        side_effects: []
      - from: CUSTOMER_REVIEW
        to: EXECUTED
        trigger: "POST /plant/qualification-runs/{id}/review with decision REQUEST_MORE_DATA"
        actor: CustomerQualityRep
        preconditions: ["run.status == CUSTOMER_REVIEW", "spec.customer_id == X-User-ID"]
        side_effects: []
      - from: CUSTOMER_REVIEW
        to: APPROVED
        trigger: "POST /plant/qualification-runs/{id}/review with decision APPROVE"
        actor: CustomerQualityRep
        preconditions: ["run.status == CUSTOMER_REVIEW", "spec.customer_id == X-User-ID", "run.weight_within_tolerance == true", "run.spec_revision_pinned == spec.content_revision"]
        side_effects:
          - "BottleSpec IN_QUALIFICATION -> QUALIFIED with qualified_revision := run.spec_revision_pinned"
      - from: CUSTOMER_REVIEW
        to: REJECTED
        trigger: "POST /plant/qualification-runs/{id}/review with decision REJECT"
        actor: CustomerQualityRep
        preconditions: ["run.status == CUSTOMER_REVIEW", "spec.customer_id == X-User-ID"]
        side_effects:
          - "BottleSpec IN_QUALIFICATION -> REVISION_REQUESTED with rejected_revision := spec.content_revision"

  - entity: Mold
    initial_state: STORAGE
    terminal_states: []
    transitions:
      - from: STORAGE
        to: INSTALLED
        trigger: "POST /plant/molds/{id}/install"
        actor: ProcessEngineer
        preconditions: ["mold.status == STORAGE", "target line.status == IDLE", "no other Mold has installed_line_id == line.id with status INSTALLED"]
        side_effects:
          - "mold.installed_line_id := machine_line_id"
          - "MachineLine IDLE -> CHANGEOVER"
      - from: INSTALLED
        to: STORAGE
        trigger: "POST /plant/molds/{id}/remove"
        actor: ProcessEngineer
        preconditions: ["mold.status == INSTALLED", "no ProductionRun with mold_id == mold.id in status OPEN", "line hosting the mold has status != RUNNING"]
        side_effects:
          - "mold.installed_line_id := null"
          - "MachineLine CHANGEOVER -> IDLE"

  - entity: CavityBlockout
    initial_state: OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /plant/cavity-blockouts/{id}/clear"
        actor: ProcessEngineer
        preconditions: ["blockout.status == OPEN"]
        side_effects:
          - "blockout.cleared_at := current logical clock"
          - "Mold.effective_cavities and Mold.active_blockout_count recompute"

  - entity: MachineLine
    initial_state: IDLE
    terminal_states: []
    transitions:
      - from: IDLE
        to: CHANGEOVER
        trigger: "system: Mold installed on this line"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHANGEOVER
        to: RUNNING
        trigger: "system: first ProductionRun starts for the order occupying this line"
        actor: system
        preconditions: []
        side_effects: []
      - from: RUNNING
        to: CHANGEOVER
        trigger: "system: occupying ProductionOrder transitions to HELD, COMPLETED, or CANCELLED"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHANGEOVER
        to: IDLE
        trigger: "system: installed Mold removed"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ScheduleSlot
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "system: first ProductionRun starts for (slot.production_order_id, slot.machine_line_id)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system: occupying ProductionOrder transitions to COMPLETED"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /plant/schedule-slots/{id}/cancel, or system cascade (order cancel / customer suspend / spec edit / order hold / reschedule)"
        actor: ProductionScheduler
        preconditions: ["slot.status == CONFIRMED"]
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system cascade only (order hold / order cancel / customer suspend / spec edit / reschedule)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MaterialLot
    initial_state: QUARANTINED
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /plant/material-lots/{id}/release"
        actor: QualityTechnician
        preconditions: ["lot.status == QUARANTINED"]
        side_effects: []
      - from: RELEASED
        to: QUARANTINED
        trigger: "POST /plant/material-lots/{id}/hold"
        actor: QualityTechnician
        preconditions: ["lot.status == RELEASED"]
        side_effects: []
      - from: IN_USE
        to: QUARANTINED
        trigger: "POST /plant/material-lots/{id}/hold"
        actor: QualityTechnician
        preconditions: ["lot.status == IN_USE"]
        side_effects: []
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /plant/material-lots/{id}/reject"
        actor: QualityTechnician
        preconditions: ["lot.status == QUARANTINED"]
        side_effects: []
      - from: RELEASED
        to: IN_USE
        trigger: "system: first consumption debit from a run close"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_USE
        to: DEPLETED
        trigger: "system: run close leaves available_kg == 0"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProductionOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /plant/production-orders/{id}/schedule"
        actor: ProductionScheduler
        preconditions: ["order.status == DRAFT", "spec.status IN {QUALIFIED, PRODUCTION_ACTIVE}", "no schedule overlap / insufficient changeover gap on the line", "customer credit exposure after scheduling <= credit_limit_cents"]
        side_effects:
          - "create ScheduleSlot CONFIRMED for (order, machine_line_id) with mold_id snapshot"
          - "if spec.status == QUALIFIED, spec -> PRODUCTION_ACTIVE"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /plant/production-orders/{id}/schedule"
        actor: ProductionScheduler
        preconditions: ["order.status == SCHEDULED", "spec.status IN {QUALIFIED, PRODUCTION_ACTIVE}", "no schedule overlap / insufficient changeover gap (excluding this order's own CONFIRMED slots)", "customer credit exposure still within limit"]
        side_effects:
          - "existing CONFIRMED ScheduleSlots of the order -> CANCELLED"
          - "create new ScheduleSlot CONFIRMED"
      - from: HELD
        to: SCHEDULED
        trigger: "POST /plant/production-orders/{id}/reschedule"
        actor: ProductionScheduler
        preconditions: ["order.status == HELD", "spec.status IN {QUALIFIED, PRODUCTION_ACTIVE}", "no schedule overlap / insufficient changeover gap"]
        side_effects:
          - "order.spec_revision_baseline := spec.content_revision (re-pin)"
          - "create new ScheduleSlot CONFIRMED"
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /plant/production-orders/{id}/release"
        actor: ProductionScheduler
        preconditions: ["order.status == SCHEDULED", "order has a ScheduleSlot in CONFIRMED", "spec.status IN {QUALIFIED, PRODUCTION_ACTIVE}", "spec.content_revision == spec.qualified_revision", "total available_kg across matching RELEASED/IN_USE resin lots >= quantity_ordered * planned_weight_g/1000 * 1.05"]
        side_effects:
          - "order.spec_revision_baseline := spec.content_revision"
      - from: RELEASED
        to: RUNNING
        trigger: "system: first ProductionRun created for the order"
        actor: system
        preconditions: []
        side_effects: []
      - from: RUNNING
        to: HELD
        trigger: "POST /plant/production-orders/{id}/hold, or system: a QualityTestLot of the order transitions to REJECTED"
        actor: QualityTechnician
        preconditions: ["order.status == RUNNING"]
        side_effects:
          - "every ScheduleSlot of the order with status IN {CONFIRMED, IN_PROGRESS} -> CANCELLED"
          - "MachineLine RUNNING -> CHANGEOVER (mold remains installed)"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /plant/production-orders/{id}/complete"
        actor: ProductionScheduler
        preconditions: ["order.status == RUNNING", "no ProductionRun of the order in status OPEN", "every QualityTestLot of the order's runs is in a terminal state IN {ACCEPTED, SCRAPPED, VOIDED}"]
        side_effects:
          - "ScheduleSlot IN_PROGRESS -> COMPLETED"
          - "MachineLine RUNNING -> CHANGEOVER"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /plant/production-orders/{id}/cancel, or system cascade (customer suspend / spec content edit)"
        actor: ProductionScheduler
        preconditions: ["order.status == DRAFT"]
        side_effects: ["order's CONFIRMED/IN_PROGRESS ScheduleSlots -> CANCELLED"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /plant/production-orders/{id}/cancel, or system cascade"
        actor: ProductionScheduler
        preconditions: ["order.status == SCHEDULED"]
        side_effects: ["order's CONFIRMED/IN_PROGRESS ScheduleSlots -> CANCELLED"]
      - from: RELEASED
        to: CANCELLED
        trigger: "POST /plant/production-orders/{id}/cancel, or system cascade (customer suspend only)"
        actor: ProductionScheduler
        preconditions: ["order.status == RELEASED"]
        side_effects: ["order's CONFIRMED/IN_PROGRESS ScheduleSlots -> CANCELLED"]
      - from: HELD
        to: CANCELLED
        trigger: "POST /plant/production-orders/{id}/cancel, or system cascade (customer suspend only)"
        actor: ProductionScheduler
        preconditions: ["order.status == HELD"]
        side_effects: ["order's CONFIRMED/IN_PROGRESS ScheduleSlots -> CANCELLED"]

  - entity: ProductionRun
    initial_state: OPEN
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /plant/production-runs/{id}/close"
        actor: ProcessEngineer
        preconditions: ["run.status == OPEN", "order.status == RUNNING", "good_count + scrap_count <= cycles_completed * cavities_active_at_start", "actual_drawdown_kg <= total available_kg across matching RELEASED/IN_USE resin lots"]
        side_effects:
          - "recompute provisional_consumption_kg, consumption_variance_pct, variance_alert"
          - "compute purge_kg from line.last_color_class vs spec.color_contrast_class; debit purge_wasted_kg on the waterfall-selected lots"
          - "material_allocation_waterfall debits actual_drawdown_kg FIFO across matching lots (RELEASED/IN_USE, created_at ASC, tie lot_code ASC)"
          - "line.last_color_class := spec.color_contrast_class"
          - "order quantity_produced/quantity_good/quantity_scrapped recompute"
          - "auto-create QualityTestLot PENDING with lot_size := good_count and computed sample/accept numbers"
      - from: CLOSED
        to: VOIDED
        trigger: "POST /plant/production-runs/{id}/void"
        actor: PlantAdmin
        preconditions: ["run.status == CLOSED", "the run's QualityTestLot (if any) has status == PENDING"]
        side_effects:
          - "credit back every lot debit made by this run's close (consumed_kg and purge_wasted_kg reversed exactly)"
          - "each touched MaterialLot status recomputes: DEPLETED if available_kg == 0, else IN_USE if consumed_kg + purge_wasted_kg > 0, else RELEASED"
          - "the run's QualityTestLot PENDING -> VOIDED"
          - "order quantity_produced/quantity_good/quantity_scrapped recompute (this run excluded)"
          - "line.last_color_class recomputed from the most recent remaining non-VOIDED closed run (null if none)"

  - entity: QualityTestLot
    initial_state: PENDING
    terminal_states: [ACCEPTED, SCRAPPED, VOIDED]
    transitions:
      - from: PENDING
        to: SAMPLED
        trigger: "POST /plant/quality-test-lots/{id}/sample"
        actor: QualityTechnician
        preconditions: ["lot.status == PENDING"]
        side_effects: []
      - from: SAMPLED
        to: ACCEPTED
        trigger: "POST /plant/quality-test-lots/{id}/record-results when leak_failures <= accept_number_leak AND drop_failures <= accept_number_drop"
        actor: QualityTechnician
        preconditions: ["lot.status == SAMPLED", "leak_failures <= sample_size_n", "drop_failures <= sample_size_n"]
        side_effects:
          - "lot.recorded_by_user_id := X-User-ID"
          - "order.quantity_accepted / quantity_open_qc recompute"
      - from: SAMPLED
        to: REJECTED
        trigger: "POST /plant/quality-test-lots/{id}/record-results when leak_failures > accept_number_leak OR drop_failures > accept_number_drop"
        actor: QualityTechnician
        preconditions: ["lot.status == SAMPLED", "leak_failures <= sample_size_n", "drop_failures <= sample_size_n"]
        side_effects:
          - "lot.recorded_by_user_id := X-User-ID"
          - "ProductionOrder RUNNING -> HELD (QC hold)"
          - "that hold cascades: order's CONFIRMED/IN_PROGRESS ScheduleSlots -> CANCELLED; MachineLine RUNNING -> CHANGEOVER"
      - from: REJECTED
        to: SCRAPPED
        trigger: "POST /plant/quality-test-lots/{id}/disposition with action SCRAP"
        actor: QualityTechnician
        preconditions: ["lot.status == REJECTED", "X-User-ID != lot.recorded_by_user_id"]
        side_effects:
          - "lot.dispositioned_by_user_id := X-User-ID"
          - "order.quantity_qc_scrapped / quantity_open_qc recompute"
      - from: REJECTED
        to: PENDING
        trigger: "POST /plant/quality-test-lots/{id}/disposition with action REWORK"
        actor: QualityTechnician
        preconditions: ["lot.status == REJECTED", "X-User-ID != lot.recorded_by_user_id"]
        side_effects:
          - "lot.dispositioned_by_user_id := X-User-ID"
          - "lot.retest_count += 1; leak_failures/drop_failures/recorded_by_user_id cleared to null"
      - from: PENDING
        to: VOIDED
        trigger: "system: parent ProductionRun voided"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Shipment
    initial_state: QUOTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: QUOTED
        to: BOOKED
        trigger: "POST /plant/shipments/{id}/book"
        actor: LogisticsCoordinator
        preconditions: ["shipment.status == QUOTED", "appointment.status == RESERVED", "appointment.shipment_id == shipment.id", "quantity <= order.quantity_unallocated"]
        side_effects:
          - "shipment.booked_appointment_id := dock_appointment_id"
          - "order.quantity_reserved / quantity_unallocated recompute (reserve quantity)"
      - from: BOOKED
        to: LOADING
        trigger: "POST /plant/shipments/{id}/load"
        actor: LogisticsCoordinator
        preconditions: ["shipment.status == BOOKED", "booked appointment.status == RESERVED", "current logical clock within [window_start, window_end] (closed)"]
        side_effects:
          - "DockAppointment RESERVED -> OCCUPIED"
      - from: LOADING
        to: IN_TRANSIT
        trigger: "POST /plant/shipments/{id}/dispatch"
        actor: LogisticsCoordinator
        preconditions: ["shipment.status == LOADING"]
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /plant/shipments/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions: ["shipment.status == IN_TRANSIT"]
        side_effects:
          - "DockAppointment OCCUPIED -> COMPLETED"
          - "order.quantity_shipped / quantity_reserved / quantity_unallocated recompute"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /plant/shipments/{id}/cancel"
        actor: LogisticsCoordinator
        preconditions: ["shipment.status == QUOTED"]
        side_effects: []
      - from: BOOKED
        to: QUOTED
        trigger: "system: booked DockAppointment is cancelled (appointment cancel only; NO_SHOW cancels the shipment instead)"
        actor: system
        preconditions: ["shipment.status == BOOKED"]
        side_effects:
          - "release reservation: order.quantity_reserved -= quantity; quantity_unallocated recompute"
          - "shipment.booked_appointment_id := null"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /plant/shipments/{id}/cancel, or system: booked appointment flips to NO_SHOW"
        actor: LogisticsCoordinator
        preconditions: ["shipment.status == BOOKED"]
        side_effects:
          - "release reservation: order.quantity_reserved -= quantity; quantity_unallocated recompute"
          - "booked DockAppointment (if still RESERVED) -> CANCELLED"
          - "shipment.booked_appointment_id := null"

  - entity: DockAppointment
    initial_state: RESERVED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: RESERVED
        to: OCCUPIED
        trigger: "system: booked Shipment transitions to LOADING"
        actor: system
        preconditions: []
        side_effects: []
      - from: OCCUPIED
        to: COMPLETED
        trigger: "system: Shipment transitions to DELIVERED"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: NO_SHOW
        trigger: "POST /plant/dock-appointments/{id}/no-show"
        actor: LogisticsCoordinator
        preconditions: ["appointment.status == RESERVED", "current logical clock > window_end"]
        side_effects:
          - "if a Shipment has booked_appointment_id == appointment.id: that Shipment BOOKED -> CANCELLED (reservation released, booked_appointment_id cleared)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /plant/dock-appointments/{id}/cancel, or system: booked shipment cancelled"
        actor: LogisticsCoordinator
        preconditions: ["appointment.status == RESERVED"]
        side_effects:
          - "if a Shipment has booked_appointment_id == appointment.id: that Shipment BOOKED -> QUOTED (reservation released, booked_appointment_id cleared)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; true create-with-supersede races only)
# =============================================================================
concurrency_rules:
  - rule_id: mold-blockout-create-stale-mold
    parent_entity: Mold
    write_endpoint: "POST /plant/molds/{id}/cavity-blockouts"
    occ_field: expected_mold_version
    description: |
      Creating a CavityBlockout against a Mold whose version has advanced since
      the client last observed it (e.g. another blockout was opened or the mold
      was installed after the client's read) is rejected; the client's view of
      the mold's cavitation state is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-schedule-stale-order
    parent_entity: ProductionOrder
    write_endpoint: "POST /plant/production-orders/{id}/schedule"
    occ_field: expected_production_order_version
    description: |
      Scheduling (or re-slotting a SCHEDULED order, which legitimately
      supersedes the prior slot) with an expected version older than the
      order's current version is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-reschedule-stale-order
    parent_entity: ProductionOrder
    write_endpoint: "POST /plant/production-orders/{id}/reschedule"
    occ_field: expected_production_order_version
    description: |
      Rescheduling a HELD order with an expected version older than the order's
      current version is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: qualification-run-create-stale-spec
    parent_entity: BottleSpec
    write_endpoint: "POST /plant/qualification-runs"
    occ_field: expected_bottle_spec_version
    description: |
      Creating a QualificationRun pins the spec's content_revision; a create
      carrying an expected spec version older than the current version is
      rejected because the client may be qualifying a superseded revision.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_cavitation
    trigger: "recomputed whenever a CavityBlockout is created or cleared, and read at run start and throughput preview"
    algorithm: aggregation
    formula: |
      effective_cavities = mold.base_cavities
                         - count(CavityBlockout where mold_id = mold.id AND status == OPEN)
      Gate: run start requires effective_cavities >= spec.min_cavitation_required.
    input_set: "CavityBlockout rows of the mold with status == OPEN only (CLEARED excluded)"
    constants:
      MIN_EFFECTIVE_CAVITIES: 1
    precision: "integer"

  - name: cycle_throughput
    trigger: "GET /plant/machine-lines/{id}/throughput-preview"
    algorithm: constraint_propagation
    formula: |
      cycle_time_s = round_half_up(BASE_CYCLE_S + WEIGHT_COEFF_S_PER_G * max(0, planned_weight_g - mold.reference_weight_g), 2)
      cycles_per_hour_raw = 3600 / cycle_time_s
      if spec.requires_inline_labeler AND line.has_inline_labeler:
          cycles_per_hour = min(cycles_per_hour_raw, LABELER_CAP_CPH)
      else:
          cycles_per_hour = cycles_per_hour_raw
      hourly_output = floor(cycles_per_hour * effective_cavities * YIELD_FRACTION)
    input_set: "mold (reference_weight_g, effective_cavities), spec (requires_inline_labeler), line (has_inline_labeler), requested planned_weight_g"
    constants:
      BASE_CYCLE_S: 10.0
      WEIGHT_COEFF_S_PER_G: 0.08
      LABELER_CAP_CPH: 240
      YIELD_FRACTION: 0.97
    precision: "cycle_time_s 2dp round_half_up; cycles_per_hour unrounded until hourly_output; hourly_output integer floor"
    variants:
      - name: derated_by_blockout
        when: "one or more OPEN CavityBlockout rows exist on the mold"
        difference: "effective_cavities is reduced, scaling hourly_output down linearly"

  - name: aql_acceptance_sampling
    trigger: "QualityTestLot creation (band lookup) and record-results (accept/reject decision)"
    algorithm: threshold
    formula: |
      Band table keyed on lot_size (inclusive bounds):
        lot_size <= 280           -> n = 20,  c_leak = 1, c_drop = 1
        281 <= lot_size <= 1200   -> n = 50,  c_leak = 2, c_drop = 2
        1201 <= lot_size <= 10000 -> n = 125, c_leak = 3, c_drop = 4
        lot_size >= 10001         -> n = 200, c_leak = 5, c_drop = 6
      Decision on record-results (both characteristics independent):
        ACCEPTED iff leak_failures <= c_leak AND drop_failures <= c_drop
        REJECTED iff leak_failures > c_leak OR  drop_failures > c_drop
      Boundary is inclusive-accept: failures exactly equal to c accept the lot.
    input_set: "the lot's lot_size; leak_failures and drop_failures from record-results"
    constants:
      BAND1_MAX: 280
      BAND2_MAX: 1200
      BAND3_MAX: 10000
    precision: "integer counts; no rounding"

  - name: freight_of_air_charge
    trigger: "POST /plant/shipments (persisted), POST /plant/freight-quotes (ad hoc), and inside logistics_mode_comparison"
    algorithm: tiered_pricing
    formula: |
      units_per_pallet = BOTTLES_PER_PALLET if mode == FINISHED_BOTTLES else PREFORMS_PER_PALLET
      unit_cube = spec.bottle_cube_cm3 if FINISHED_BOTTLES else spec.preform_cube_cm3
      unit_weight_g = spec.target_weight_g if FINISHED_BOTTLES else spec.preform_weight_g
      pallets = ceil(quantity / units_per_pallet)
      full_pallets = floor(quantity / units_per_pallet)
      rem_units = quantity - full_pallets * units_per_pallet
      # PINNED ROUNDING ORDER: dim weight is computed PER PALLET, rounded
      # half-up to 0.1 kg, then summed. Aggregating volume first and rounding
      # once is a different (forbidden) procedure and yields different results.
      per_full_pallet_dim = round_half_up((units_per_pallet * unit_cube + PALLET_CUBE_CM3) / DIM_DIVISOR_CM3_PER_KG, 1)
      rem_pallet_dim = if rem_units > 0 then round_half_up((rem_units * unit_cube + PALLET_CUBE_CM3) / DIM_DIVISOR_CM3_PER_KG, 1) else 0
      dim_weight_kg = full_pallets * per_full_pallet_dim + rem_pallet_dim
      actual_weight_kg = round_half_up(quantity * unit_weight_g / 1000 + pallets * PALLET_TARE_KG, 2)
      chargeable_weight_kg = max(dim_weight_kg, actual_weight_kg)
      # Marginal tier pricing from the ACTIVE FreightRateCard. Tier i covers
      # [min_kg_i, min_kg_{i+1}); kg in tier i = max(0, min(W, min_kg_{i+1}) - min_kg_i).
      # PINNED ROUNDING ORDER: each tier's charge is rounded half-up to integer
      # cents first, then tier charges are summed.
      freight_cost_cents = sum over tiers of round_half_up(kg_in_tier * rate_cents_per_kg, 0)
      # Truck loading: pallets per truck capped by BOTH cube and payload.
      pallet_cube_cm3 = units_per_pallet * unit_cube + PALLET_CUBE_CM3
      pallet_gross_kg = units_per_pallet * unit_weight_g / 1000 + PALLET_TARE_KG
      pallets_per_truck = min(floor(TRUCK_CUBE_CM3 / pallet_cube_cm3), floor(TRUCK_PAYLOAD_KG / pallet_gross_kg))
      trucks = ceil(pallets / pallets_per_truck)
      volume_cm3 = quantity * unit_cube + pallets * PALLET_CUBE_CM3
    input_set: "spec cube/weight fields, quantity, shipment_mode, ACTIVE FreightRateCard tiers"
    constants:
      DIM_DIVISOR_CM3_PER_KG: 6000
      PALLET_CUBE_CM3: 144000
      PALLET_TARE_KG: 20
      BOTTLES_PER_PALLET: 1500
      PREFORMS_PER_PALLET: 30000
      TRUCK_CUBE_CM3: 96000000
      TRUCK_PAYLOAD_KG: 24000
    precision: "dim per pallet 1dp round_half_up then sum; actual 2dp round_half_up; per-tier cents 0dp round_half_up then sum"

  - name: logistics_mode_comparison
    trigger: "GET /plant/bottle-specs/{id}/logistics-comparison"
    algorithm: tiered_pricing
    formula: |
      warehouse_total_cents = freight_of_air_charge(quantity, FINISHED_BOTTLES).freight_cost_cents
      onsite_freight_cents  = freight_of_air_charge(quantity, PREFORMS).freight_cost_cents
      blow_on_site_total_cents = onsite_freight_cents + quantity * ONSITE_FEE_CENTS_PER_BOTTLE
      recommended_mode = WAREHOUSE if warehouse_total_cents <= blow_on_site_total_cents else BLOW_ON_SITE
      (tie breaks to WAREHOUSE)
    input_set: "spec fields, requested quantity, ACTIVE FreightRateCard"
    constants:
      ONSITE_FEE_CENTS_PER_BOTTLE: 40
    precision: "integer cents"
    variants:
      - name: warehouse_variant
        when: "mode == WAREHOUSE"
        difference: "ships finished bottles: huge cube, freight-of-air dominates; no on-site fee"
      - name: blow_on_site_variant
        when: "mode == BLOW_ON_SITE"
        difference: "ships dense preforms (small cube) but adds per-bottle on-site machine fee; identical quantity inputs produce a different total"

  - name: resin_consumption_reconciliation
    trigger: "POST /plant/production-runs/{id}/close"
    algorithm: aggregation
    formula: |
      provisional_consumption_kg = round_half_up(cycles_completed * cavities_active_at_start * order.planned_weight_g / 1000, 2)
      consumption_variance_pct = round_half_up((actual_drawdown_kg - provisional_consumption_kg) / provisional_consumption_kg * 100, 2)
      variance_alert = (consumption_variance_pct > VARIANCE_TOLERANCE_PCT)   # strictly greater; exactly 3.00 does NOT alert
    input_set: "the closing run's cycles/cavities/weight inputs and its actual_drawdown_kg"
    constants:
      VARIANCE_TOLERANCE_PCT: 3.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_variant
        when: "theoretical consumption from machine counters"
        difference: "cycles_completed * cavities_active_at_start * planned_weight_g / 1000; ignores drawdown measurement"
      - name: actual_variant
        when: "measured silo drawdown supplied at close"
        difference: "actual_drawdown_kg as reported; the two variants differ by scrap/startup loss and drive variance_alert"

  - name: purge_quantity_on_color_change
    trigger: "POST /plant/production-runs/{id}/close"
    algorithm: constraint_propagation
    formula: |
      from_class = line.last_color_class   # null if no prior non-VOIDED closed run
      to_class = spec.color_contrast_class
      multiplier = PURGE_MATRIX[from_class][to_class]   # null row -> 0.0
      purge_kg = round_half_up(line.resident_volume_kg * multiplier, 2)
      PURGE_MATRIX (from -> to):
        CLEAR -> {CLEAR: 0.0, LIGHT: 1.0, DARK: 1.0}
        LIGHT -> {CLEAR: 2.0, LIGHT: 0.0, DARK: 1.0}
        DARK  -> {CLEAR: 3.0, LIGHT: 2.5, DARK: 0.0}
        null  -> 0.0 (first run on the line)
    input_set: "line.last_color_class, spec.color_contrast_class, line.resident_volume_kg"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: material_allocation_waterfall
    trigger: "POST /plant/production-runs/{id}/close"
    algorithm: waterfall_allocation
    formula: |
      required = actual_drawdown_kg + purge_kg
      candidate lots = MaterialLot where material_type == RESIN
                       AND resin_type == spec.resin_type
                       AND status IN {RELEASED, IN_USE}
      order: created_at ASC, tie-break lot_code ASC
      Debit order per lot: first cover purge_kg (into purge_wasted_kg), then
      consumption (into consumed_kg), filling each lot's available_kg before
      moving to the next.
      Lot transitions: RELEASED -> IN_USE on first debit; IN_USE -> DEPLETED
      when available_kg reaches exactly 0.
      If sum(available_kg over candidates) < required -> ERR_INSUFFICIENT_MATERIAL
      and NO lot is debited (all-or-nothing).
    input_set: "matching RELEASED/IN_USE resin lots, ordered as pinned"
    constants: {}
    precision: "2 decimal places, round_half_up; per-lot debits are exact (no rounding)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins on dual failure)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role; X-User-ID header present and non-empty", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 2, category: auth, check: "CustomerQualityRep may act only on resources whose owning customer_id == X-User-ID (qualification review; customer sub-resource reads)", error_id: ERR_CROSS_CUSTOMER_ACCESS, http_status: 403, applies_to: "POST /plant/qualification-runs/{id}/review, GET /plant/customers/{id}/bottle-specs" }
  - { priority: 2, category: auth, check: "Segregation of duties: disposition X-User-ID must differ from the lot's recorded_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /plant/quality-test-lots/{id}/disposition" }
  - { priority: 3, category: existence, check: "Request body shape: all required fields present, no unknown fields, enum values in their declared sets, numeric fields non-negative, planned_start < planned_end, window_start < window_end, datetime fields ISO8601", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path template ids resolve left-to-right; body FK ids resolve; missing -> per-entity not-found error", error_id: ERR_CUSTOMER_NOT_FOUND, http_status: 404, applies_to: "endpoints with customer id in path or body" }
  - { priority: 4, category: existence, check: "BottleSpec must exist", error_id: ERR_BOTTLE_SPEC_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a bottle spec" }
  - { priority: 4, category: existence, check: "QualificationRun must exist", error_id: ERR_QUALIFICATION_RUN_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a qualification run" }
  - { priority: 4, category: existence, check: "Mold must exist", error_id: ERR_MOLD_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a mold" }
  - { priority: 4, category: existence, check: "CavityBlockout must exist", error_id: ERR_CAVITY_BLOCKOUT_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a cavity blockout" }
  - { priority: 4, category: existence, check: "MachineLine must exist", error_id: ERR_MACHINE_LINE_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a machine line" }
  - { priority: 4, category: existence, check: "ScheduleSlot must exist", error_id: ERR_SCHEDULE_SLOT_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a schedule slot" }
  - { priority: 4, category: existence, check: "MaterialLot must exist", error_id: ERR_MATERIAL_LOT_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a material lot" }
  - { priority: 4, category: existence, check: "ProductionOrder must exist", error_id: ERR_PRODUCTION_ORDER_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a production order" }
  - { priority: 4, category: existence, check: "ProductionRun must exist", error_id: ERR_PRODUCTION_RUN_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a production run" }
  - { priority: 4, category: existence, check: "QualityTestLot must exist", error_id: ERR_QUALITY_TEST_LOT_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a quality test lot" }
  - { priority: 4, category: existence, check: "Shipment must exist", error_id: ERR_SHIPMENT_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a shipment" }
  - { priority: 4, category: existence, check: "DockAppointment must exist", error_id: ERR_DOCK_APPOINTMENT_NOT_FOUND, http_status: 404, applies_to: "endpoints referencing a dock appointment" }
  - { priority: 4, category: existence, check: "an ACTIVE FreightRateCard must exist for freight computation", error_id: ERR_RATE_CARD_NOT_FOUND, http_status: 404, applies_to: "POST /plant/shipments, POST /plant/freight-quotes, GET /plant/bottle-specs/{id}/logistics-comparison" }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version must equal the parent's current version (checked before all other state rules on OCC-guarded endpoints)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /plant/molds/{id}/cavity-blockouts, POST /plant/production-orders/{id}/schedule, POST /plant/production-orders/{id}/reschedule, POST /plant/qualification-runs" }
  - { priority: 5, category: state, check: "Target resource is in a terminal state for the attempted transition", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "Transition is defined for the resource's current state (covers all from-state mismatches not otherwise specialized)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "Schedule/reschedule: spec.status must be QUALIFIED or PRODUCTION_ACTIVE", error_id: ERR_SPEC_NOT_QUALIFIED, http_status: 409, applies_to: "POST /plant/production-orders/{id}/schedule, POST /plant/production-orders/{id}/reschedule" }
  - { priority: 5, category: state, check: "Run create: order.status must be RELEASED or RUNNING", error_id: ERR_ORDER_NOT_RELEASED, http_status: 409, applies_to: "POST /plant/production-runs" }
  - { priority: 5, category: state, check: "Run create: a ScheduleSlot for (order, line) with status IN {CONFIRMED, IN_PROGRESS} must exist and current logical clock must satisfy planned_start <= now < planned_end", error_id: ERR_NO_ACTIVE_SLOT, http_status: 409, applies_to: "POST /plant/production-runs" }
  - { priority: 5, category: state, check: "Order release: order must have a ScheduleSlot in CONFIRMED", error_id: ERR_NO_ACTIVE_SLOT, http_status: 409, applies_to: "POST /plant/production-orders/{id}/release" }
  - { priority: 5, category: state, check: "Run create: mold.status == INSTALLED and mold.installed_line_id == machine_line_id", error_id: ERR_MOLD_NOT_INSTALLED, http_status: 409, applies_to: "POST /plant/production-runs" }
  - { priority: 5, category: state, check: "Run create: line must not be RUNNING an order other than this run's order", error_id: ERR_LINE_BUSY, http_status: 409, applies_to: "POST /plant/production-runs" }
  - { priority: 5, category: state, check: "Run create: material_lot (and colorant_lot if given) status must be RELEASED or IN_USE", error_id: ERR_MATERIAL_LOT_NOT_RELEASED, http_status: 409, applies_to: "POST /plant/production-runs" }
  - { priority: 5, category: state, check: "Shipment book: dock appointment status must be RESERVED", error_id: ERR_APPOINTMENT_NOT_RESERVED, http_status: 409, applies_to: "POST /plant/shipments/{id}/book" }
  - { priority: 5, category: state, check: "Shipment create: order.status must be IN {RUNNING, HELD, COMPLETED}", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /plant/shipments" }
  - { priority: 5, category: state, check: "Dock appointment create: shipment.status must be QUOTED or BOOKED", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /plant/dock-appointments" }
  - { priority: 5, category: state, check: "Blockout create: mold.status must be INSTALLED", error_id: ERR_MOLD_NOT_INSTALLED, http_status: 409, applies_to: "POST /plant/molds/{id}/cavity-blockouts" }
  - { priority: 6, category: business_safety, check: "Run create: no CavityBlockout with reason IN {QUALITY_HOLD, CONTAMINATION_HOLD} and status OPEN may exist on the mold", error_id: ERR_QUALITY_HOLD_BLOCKOUT, http_status: 409, applies_to: "POST /plant/production-runs" }
  - { priority: 6, category: business_safety, check: "Run create: spec.resin_type must be in mold.compatible_resins", error_id: ERR_RESIN_INCOMPATIBLE, http_status: 422, applies_to: "POST /plant/production-runs" }
  - { priority: 7, category: business_temporal, check: "Schedule/reschedule: half-open [planned_start, planned_end) must not intersect any other non-CANCELLED slot on the line, and the gap to each adjacent slot must be >= the mold-change buffer (0 min if both slots carry the same mold_id, else 90 min); a slot of the same order being replaced is excluded", error_id: ERR_SCHEDULE_OVERLAP, http_status: 409, applies_to: "POST /plant/production-orders/{id}/schedule, POST /plant/production-orders/{id}/reschedule" }
  - { priority: 7, category: business_temporal, check: "Dock appointment create: closed [window_start, window_end] must not intersect any other RESERVED/OCCUPIED appointment on the same dock_door (touching endpoints DO conflict under closed semantics)", error_id: ERR_DOCK_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /plant/dock-appointments" }
  - { priority: 7, category: business_temporal, check: "Shipment load: current logical clock must satisfy window_start <= now <= window_end of the booked appointment", error_id: ERR_OUTSIDE_DOCK_WINDOW, http_status: 409, applies_to: "POST /plant/shipments/{id}/load" }
  - { priority: 7, category: business_temporal, check: "Dock appointment no-show: current logical clock must be > window_end", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /plant/dock-appointments/{id}/no-show" }
  - { priority: 8, category: business_constraint, check: "Order create: abs(planned_weight_g - spec.target_weight_g) <= spec.target_weight_g * spec.weight_tolerance_pct/100", error_id: ERR_PLANNED_WEIGHT_OUT_OF_TOLERANCE, http_status: 422, applies_to: "POST /plant/production-orders" }
  - { priority: 8, category: business_constraint, check: "Schedule/reschedule: if spec.requires_inline_labeler then line.has_inline_labeler must be true; and spec.diameter_mm <= line.max_bottle_diameter_mm", error_id: ERR_LABELER_REQUIRED, http_status: 422, applies_to: "POST /plant/production-orders/{id}/schedule, POST /plant/production-orders/{id}/reschedule" }
  - { priority: 8, category: business_constraint, check: "Run create: mold.effective_cavities >= spec.min_cavitation_required", error_id: ERR_INSUFFICIENT_CAVITATION, http_status: 422, applies_to: "POST /plant/production-runs" }
  - { priority: 8, category: business_constraint, check: "Blockout create: 1 <= cavity_index <= mold.base_cavities", error_id: ERR_CAVITY_OUT_OF_RANGE, http_status: 422, applies_to: "POST /plant/molds/{id}/cavity-blockouts" }
  - { priority: 8, category: business_constraint, check: "Blockout create: no other OPEN blockout on the same (mold, cavity_index)", error_id: ERR_CAVITY_ALREADY_BLOCKED, http_status: 409, applies_to: "POST /plant/molds/{id}/cavity-blockouts" }
  - { priority: 8, category: business_constraint, check: "Uniqueness: customer_code, mold_code, line_code, lane_code, lot_code globally unique; spec_code unique per customer", error_id: ERR_DUPLICATE_CODE, http_status: 409, applies_to: "POST /plant/customers, POST /plant/molds, POST /plant/machine-lines, POST /plant/freight-rate-cards, POST /plant/material-lots, POST /plant/bottle-specs" }
  - { priority: 8, category: business_constraint, check: "Blockout create and mold install require mold.status INSTALLED (blockout) resp. STORAGE (install) — via state rules; additionally install requires no other mold installed on the line", error_id: ERR_LINE_BUSY, http_status: 409, applies_to: "POST /plant/molds/{id}/install" }
  - { priority: 8, category: business_constraint, check: "Spec submit from REVISION_REQUESTED requires content_revision > rejected_revision", error_id: ERR_SPEC_UNCHANGED_SINCE_REJECTION, http_status: 409, applies_to: "POST /plant/bottle-specs/{id}/submit" }
  - { priority: 8, category: business_constraint, check: "Qualification run create: no other run of the same spec in status IN {PLANNED, EXECUTED, CUSTOMER_REVIEW}", error_id: ERR_ACTIVE_QUALIFICATION_EXISTS, http_status: 409, applies_to: "POST /plant/qualification-runs" }
  - { priority: 8, category: business_constraint, check: "Qualification approve: run.weight_within_tolerance must be true", error_id: ERR_WEIGHT_OUT_OF_TOLERANCE, http_status: 422, applies_to: "POST /plant/qualification-runs/{id}/review" }
  - { priority: 8, category: business_constraint, check: "Run close: good_count + scrap_count <= cycles_completed * cavities_active_at_start", error_id: ERR_COUNT_EXCEEDS_PRODUCTION, http_status: 422, applies_to: "POST /plant/production-runs/{id}/close" }
  - { priority: 8, category: business_constraint, check: "Shipment create: quantity must be a positive integer", error_id: ERR_ZERO_QUANTITY, http_status: 422, applies_to: "POST /plant/shipments" }
  - { priority: 8, category: business_constraint, check: "Record-results: leak_failures and drop_failures must each be <= sample_size_n", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "POST /plant/quality-test-lots/{id}/record-results" }
  - { priority: 9, category: business_referential, check: "Run create: order.spec_revision_baseline == spec.content_revision (re-baseline via reschedule when stale)", error_id: ERR_SPEC_REVISION_STALE, http_status: 409, applies_to: "POST /plant/production-runs" }
  - { priority: 9, category: business_referential, check: "Shipment create: shipment_mode matches order.logistics_mode (WAREHOUSE <-> FINISHED_BOTTLES, BLOW_ON_SITE <-> PREFORMS)", error_id: ERR_MODE_MISMATCH, http_status: 422, applies_to: "POST /plant/shipments" }
  - { priority: 9, category: business_referential, check: "Order release: spec.content_revision == spec.qualified_revision", error_id: ERR_SPEC_REVISION_STALE, http_status: 409, applies_to: "POST /plant/production-orders/{id}/release" }
  - { priority: 10, category: business_fiscal, check: "Schedule/reschedule: sum over the customer's orders in {SCHEDULED, RELEASED, RUNNING, HELD} of quantity_ordered * spec.unit_price_cents, plus this order's value, must be <= customer.credit_limit_cents (equal is allowed)", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /plant/production-orders/{id}/schedule, POST /plant/production-orders/{id}/reschedule" }
  - { priority: 10, category: business_fiscal, check: "Order release: total available_kg across matching RELEASED/IN_USE resin lots >= quantity_ordered * planned_weight_g / 1000 * 1.05", error_id: ERR_INSUFFICIENT_MATERIAL, http_status: 422, applies_to: "POST /plant/production-orders/{id}/release" }
  - { priority: 10, category: business_fiscal, check: "Run close: total available across waterfall candidates >= actual_drawdown_kg + purge_kg", error_id: ERR_INSUFFICIENT_MATERIAL, http_status: 422, applies_to: "POST /plant/production-runs/{id}/close" }
  - { priority: 10, category: business_fiscal, check: "Shipment book: quantity <= order.quantity_unallocated", error_id: ERR_INSUFFICIENT_ACCEPTED_STOCK, http_status: 422, applies_to: "POST /plant/shipments/{id}/book" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - { method: POST, path: "/plant/_clock/set_current_utc", description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time.", roles: [PlantAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }

  # --- customers ---
  - { method: POST, path: "/plant/customers", description: "Create customer", roles: [PlantAdmin], code: 201, input: [name, customer_code, credit_limit_cents, "default_logistics_mode?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/plant/customers/{id}", description: "Get customer", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler, LogisticsCoordinator, CustomerQualityRep], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/plant/customers/{id}/suspend", description: "Suspend customer; cancels non-terminal orders and cascades to their schedule slots", roles: [PlantAdmin], code: 200, input: [], output: Customer, side_effects: ["ProductionOrder {DRAFT,SCHEDULED,RELEASED,HELD} -> CANCELLED", "their ScheduleSlots {CONFIRMED,IN_PROGRESS} -> CANCELLED", "increments Customer.version by 1"] }
  - { method: POST, path: "/plant/customers/{id}/reactivate", description: "Reactivate suspended customer", roles: [PlantAdmin], code: 200, input: [], output: Customer, side_effects: ["increments Customer.version by 1"] }
  - { method: GET, path: "/plant/customers/{id}/bottle-specs", description: "List specs of a customer (FK reverse)", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler, LogisticsCoordinator, CustomerQualityRep], code: 200, input: ["status?", "limit?", "offset?"], output: "BottleSpec[]", side_effects: [] }

  # --- freight rate cards & quotes ---
  - { method: POST, path: "/plant/freight-rate-cards", description: "Create rate card; becomes ACTIVE, all others INACTIVE", roles: [PlantAdmin], code: 201, input: [lane_code, tiers], output: FreightRateCard, side_effects: ["all other FreightRateCard -> INACTIVE"] }
  - { method: GET, path: "/plant/freight-rate-cards/{id}", description: "Get rate card", roles: [PlantAdmin, LogisticsCoordinator], code: 200, input: [], output: FreightRateCard, side_effects: [] }
  - { method: POST, path: "/plant/freight-quotes", description: "Compute freight-of-air quote without creating a shipment", roles: [LogisticsCoordinator], code: 200, input: [bottle_spec_id, quantity, shipment_mode], output: { pallets: integer, trucks: integer, volume_cm3: integer, dim_weight_kg: number, actual_weight_kg: number, chargeable_weight_kg: number, freight_cost_cents: integer }, side_effects: [] }

  # --- machine lines ---
  - { method: POST, path: "/plant/machine-lines", description: "Create machine line", roles: [PlantAdmin], code: 201, input: [line_code, has_inline_labeler, max_bottle_diameter_mm, resident_volume_kg], output: MachineLine, side_effects: [] }
  - { method: GET, path: "/plant/machine-lines/{id}", description: "Get machine line", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler, LogisticsCoordinator], code: 200, input: [], output: MachineLine, side_effects: [] }
  - { method: GET, path: "/plant/machine-lines/{id}/molds", description: "List molds installed on a line (FK reverse)", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler], code: 200, input: [], output: "Mold[]", side_effects: [] }
  - { method: GET, path: "/plant/machine-lines/{id}/schedule-slots", description: "List schedule slots of a line (FK reverse)", roles: [PlantAdmin, ProcessEngineer, ProductionScheduler], code: 200, input: ["status?", "limit?", "offset?"], output: "ScheduleSlot[]", side_effects: [] }
  - { method: GET, path: "/plant/machine-lines/{id}/throughput-preview", description: "Computed cycle/throughput preview for (mold, spec, planned weight)", roles: [ProcessEngineer, ProductionScheduler], code: 200, input: [mold_id, bottle_spec_id, planned_weight_g], output: { effective_cavities: integer, cycle_time_s: number, cycles_per_hour: number, hourly_output: integer }, side_effects: [] }

  # --- molds ---
  - { method: POST, path: "/plant/molds", description: "Create mold", roles: [PlantAdmin], code: 201, input: [mold_code, base_cavities, compatible_resins, reference_weight_g], output: Mold, side_effects: [] }
  - { method: GET, path: "/plant/molds/{id}", description: "Get mold", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler], code: 200, input: [], output: Mold, side_effects: [] }
  - { method: POST, path: "/plant/molds/{id}/install", description: "Install mold on an IDLE line; line IDLE->CHANGEOVER", roles: [ProcessEngineer], code: 200, input: [machine_line_id], output: Mold, side_effects: ["Mold STORAGE -> INSTALLED", "MachineLine IDLE -> CHANGEOVER", "increments Mold.version by 1"] }
  - { method: POST, path: "/plant/molds/{id}/remove", description: "Remove mold to STORAGE; line CHANGEOVER->IDLE", roles: [ProcessEngineer], code: 200, input: [], output: Mold, side_effects: ["Mold INSTALLED -> STORAGE", "MachineLine CHANGEOVER -> IDLE", "increments Mold.version by 1"] }
  - { method: GET, path: "/plant/molds/{id}/schedule-slots", description: "List schedule slots carrying this mold snapshot (FK reverse)", roles: [PlantAdmin, ProcessEngineer, ProductionScheduler], code: 200, input: ["status?", "limit?", "offset?"], output: "ScheduleSlot[]", side_effects: [] }

  # --- cavity blockouts ---
  - { method: POST, path: "/plant/molds/{id}/cavity-blockouts", description: "Open a cavity blockout on an INSTALLED mold (OCC on mold version)", roles: [ProcessEngineer], code: 201, input: [cavity_index, reason, expected_mold_version], output: CavityBlockout, side_effects: ["Mold.effective_cavities/active_blockout_count recompute", "increments Mold.version by 1"] }
  - { method: GET, path: "/plant/molds/{id}/cavity-blockouts", description: "List blockouts of a mold (FK reverse)", roles: [PlantAdmin, ProcessEngineer, QualityTechnician], code: 200, input: ["status?", "limit?", "offset?"], output: "CavityBlockout[]", side_effects: [] }
  - { method: GET, path: "/plant/cavity-blockouts/{id}", description: "Get blockout", roles: [PlantAdmin, ProcessEngineer, QualityTechnician], code: 200, input: [], output: CavityBlockout, side_effects: [] }
  - { method: POST, path: "/plant/cavity-blockouts/{id}/clear", description: "Clear an OPEN blockout", roles: [ProcessEngineer], code: 200, input: [], output: CavityBlockout, side_effects: ["CavityBlockout OPEN -> CLEARED", "Mold.effective_cavities/active_blockout_count recompute", "increments Mold.version by 1"] }

  # --- bottle specs ---
  - { method: POST, path: "/plant/bottle-specs", description: "Create bottle spec (DRAFT, content_revision 1)", roles: [ProcessEngineer], code: 201, input: [customer_id, spec_code, resin_type, color_contrast_class, target_weight_g, "weight_tolerance_pct?", neck_finish, height_mm, diameter_mm, bottle_cube_cm3, preform_cube_cm3, preform_weight_g, unit_price_cents, label_type, min_cavitation_required], output: BottleSpec, side_effects: [] }
  - { method: GET, path: "/plant/bottle-specs/{id}", description: "Get bottle spec", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler, LogisticsCoordinator, CustomerQualityRep], code: 200, input: [], output: BottleSpec, side_effects: [] }
  - { method: PATCH, path: "/plant/bottle-specs/{id}", description: "Edit content fields; bumps content_revision; in PRODUCTION_ACTIVE cascades to REVISION_REQUESTED and cancels DRAFT/SCHEDULED orders", roles: [ProcessEngineer], code: 200, input: ["target_weight_g?", "weight_tolerance_pct?", "color_contrast_class?", "bottle_cube_cm3?", "preform_cube_cm3?", "preform_weight_g?", "neck_finish?", "height_mm?", "diameter_mm?", "unit_price_cents?", "label_type?", "min_cavitation_required?"], output: BottleSpec, side_effects: ["content_revision += 1 when any content field changes", "if status == PRODUCTION_ACTIVE: spec -> REVISION_REQUESTED; DRAFT/SCHEDULED orders of the spec -> CANCELLED; their slots -> CANCELLED", "increments BottleSpec.version by 1"] }
  - { method: POST, path: "/plant/bottle-specs/{id}/submit", description: "Submit spec (DRAFT or REVISION_REQUESTED)", roles: [ProcessEngineer], code: 200, input: [], output: BottleSpec, side_effects: ["increments BottleSpec.version by 1"] }
  - { method: POST, path: "/plant/bottle-specs/{id}/begin-qualification", description: "SUBMITTED -> IN_QUALIFICATION", roles: [ProcessEngineer], code: 200, input: [], output: BottleSpec, side_effects: ["increments BottleSpec.version by 1"] }
  - { method: POST, path: "/plant/bottle-specs/{id}/retire", description: "Retire spec (no open orders allowed)", roles: [ProcessEngineer], code: 200, input: [], output: BottleSpec, side_effects: ["increments BottleSpec.version by 1"] }
  - { method: GET, path: "/plant/bottle-specs/{id}/qualification-runs", description: "List qualification runs of a spec (FK reverse)", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, CustomerQualityRep], code: 200, input: ["status?", "limit?", "offset?"], output: "QualificationRun[]", side_effects: [] }
  - { method: GET, path: "/plant/bottle-specs/{id}/logistics-comparison", description: "Computed read: warehouse vs blow-on-site totals for a quantity", roles: [LogisticsCoordinator, ProcessEngineer], code: 200, input: [quantity], output: { warehouse_total_cents: integer, blow_on_site_total_cents: integer, recommended_mode: string }, side_effects: [] }

  # --- qualification runs ---
  - { method: POST, path: "/plant/qualification-runs", description: "Create qualification run for a spec IN_QUALIFICATION (OCC on spec version; pins content_revision)", roles: [ProcessEngineer], code: 201, input: [bottle_spec_id, sample_cavity_count, expected_bottle_spec_version], output: QualificationRun, side_effects: ["spec_revision_pinned := spec.content_revision", "increments BottleSpec.version by 1"] }
  - { method: GET, path: "/plant/qualification-runs/{id}", description: "Get qualification run", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, CustomerQualityRep], code: 200, input: [], output: QualificationRun, side_effects: [] }
  - { method: POST, path: "/plant/qualification-runs/{id}/execute", description: "Record first-article measurements; PLANNED->EXECUTED (EXECUTED->EXECUTED re-measure allowed)", roles: [ProcessEngineer], code: 200, input: [measured_mean_weight_g, weight_spread_g, visual_defects], output: QualificationRun, side_effects: ["recompute weight_within_tolerance", "increments QualificationRun.version by 1"] }
  - { method: POST, path: "/plant/qualification-runs/{id}/submit-review", description: "EXECUTED -> CUSTOMER_REVIEW", roles: [QualityTechnician], code: 200, input: [], output: QualificationRun, side_effects: ["increments QualificationRun.version by 1"] }
  - { method: POST, path: "/plant/qualification-runs/{id}/review", description: "Customer review: APPROVE | REJECT | REQUEST_MORE_DATA (customer ownership required)", roles: [CustomerQualityRep], code: 200, input: [decision, "review_note?"], output: QualificationRun, side_effects: ["APPROVE: run -> APPROVED; spec IN_QUALIFICATION -> QUALIFIED, qualified_revision pinned", "REJECT: run -> REJECTED; spec -> REVISION_REQUESTED, rejected_revision pinned", "REQUEST_MORE_DATA: run CUSTOMER_REVIEW -> EXECUTED", "increments BottleSpec.version by 1 on APPROVE/REJECT"] }

  # --- material lots ---
  - { method: POST, path: "/plant/material-lots", description: "Receive a material lot (QUARANTINED)", roles: [PlantAdmin], code: 201, input: [material_type, "resin_type?", "color_code?", lot_code, received_kg], output: MaterialLot, side_effects: [] }
  - { method: GET, path: "/plant/material-lots", description: "List material lots with filters and pagination", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler], code: 200, input: ["material_type?", "resin_type?", "status?", "limit?", "offset?"], output: "MaterialLot[]", side_effects: [] }
  - { method: GET, path: "/plant/material-lots/{id}", description: "Get material lot", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler], code: 200, input: [], output: MaterialLot, side_effects: [] }
  - { method: POST, path: "/plant/material-lots/{id}/release", description: "QC release: QUARANTINED -> RELEASED", roles: [QualityTechnician], code: 200, input: [], output: MaterialLot, side_effects: ["increments MaterialLot.version by 1"] }
  - { method: POST, path: "/plant/material-lots/{id}/hold", description: "QC re-hold: RELEASED/IN_USE -> QUARANTINED", roles: [QualityTechnician], code: 200, input: [], output: MaterialLot, side_effects: ["increments MaterialLot.version by 1"] }
  - { method: POST, path: "/plant/material-lots/{id}/reject", description: "QC reject: QUARANTINED -> REJECTED", roles: [QualityTechnician], code: 200, input: [], output: MaterialLot, side_effects: ["increments MaterialLot.version by 1"] }

  # --- production orders ---
  - { method: POST, path: "/plant/production-orders", description: "Create production order (DRAFT)", roles: [ProductionScheduler], code: 201, input: [bottle_spec_id, quantity_ordered, planned_weight_g, "logistics_mode?"], output: ProductionOrder, side_effects: [] }
  - { method: GET, path: "/plant/production-orders", description: "List production orders with filters and pagination", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler, LogisticsCoordinator], code: 200, input: ["customer_id?", "bottle_spec_id?", "status?", "limit?", "offset?"], output: "ProductionOrder[]", side_effects: [] }
  - { method: GET, path: "/plant/production-orders/{id}", description: "Get production order", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler, LogisticsCoordinator], code: 200, input: [], output: ProductionOrder, side_effects: [] }
  - { method: GET, path: "/plant/production-orders/{id}/summary", description: "Computed read of order quantity rollup", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler, LogisticsCoordinator], code: 200, input: [], output: { quantity_produced: integer, quantity_good: integer, quantity_scrapped: integer, quantity_accepted: integer, quantity_qc_scrapped: integer, quantity_reserved: integer, quantity_shipped: integer, quantity_unallocated: integer }, side_effects: [] }
  - { method: POST, path: "/plant/production-orders/{id}/schedule", description: "Schedule DRAFT order (or re-slot a SCHEDULED order) onto a line window; creates ScheduleSlot (OCC on order version)", roles: [ProductionScheduler], code: 200, input: [machine_line_id, planned_start, planned_end, expected_production_order_version], output: ProductionOrder, side_effects: ["create ScheduleSlot CONFIRMED with mold snapshot", "SCHEDULED->SCHEDULED cancels the order's prior CONFIRMED slots", "if spec QUALIFIED -> PRODUCTION_ACTIVE", "increments ProductionOrder.version by 1"] }
  - { method: POST, path: "/plant/production-orders/{id}/reschedule", description: "HELD -> SCHEDULED with a fresh slot; re-pins spec_revision_baseline (OCC on order version)", roles: [ProductionScheduler], code: 200, input: [machine_line_id, planned_start, planned_end, expected_production_order_version], output: ProductionOrder, side_effects: ["create ScheduleSlot CONFIRMED", "spec_revision_baseline := spec.content_revision", "increments ProductionOrder.version by 1"] }
  - { method: POST, path: "/plant/production-orders/{id}/release", description: "SCHEDULED -> RELEASED; checks material availability and spec revision", roles: [ProductionScheduler], code: 200, input: [], output: ProductionOrder, side_effects: ["spec_revision_baseline := spec.content_revision", "increments ProductionOrder.version by 1"] }
  - { method: POST, path: "/plant/production-orders/{id}/hold", description: "RUNNING -> HELD; cancels the order's active slots and releases the line to CHANGEOVER", roles: [QualityTechnician], code: 200, input: [], output: ProductionOrder, side_effects: ["ScheduleSlots {CONFIRMED,IN_PROGRESS} -> CANCELLED", "MachineLine RUNNING -> CHANGEOVER", "increments ProductionOrder.version by 1"] }
  - { method: POST, path: "/plant/production-orders/{id}/cancel", description: "Cancel order from DRAFT/SCHEDULED/RELEASED/HELD", roles: [ProductionScheduler], code: 200, input: [], output: ProductionOrder, side_effects: ["ScheduleSlots {CONFIRMED,IN_PROGRESS} -> CANCELLED", "increments ProductionOrder.version by 1"] }
  - { method: POST, path: "/plant/production-orders/{id}/complete", description: "RUNNING -> COMPLETED; requires all runs closed/voided and all quality lots terminal", roles: [ProductionScheduler], code: 200, input: [], output: ProductionOrder, side_effects: ["ScheduleSlot IN_PROGRESS -> COMPLETED", "MachineLine RUNNING -> CHANGEOVER", "increments ProductionOrder.version by 1"] }
  - { method: GET, path: "/plant/production-orders/{id}/schedule-slots", description: "List schedule slots of an order (FK reverse)", roles: [PlantAdmin, ProcessEngineer, ProductionScheduler], code: 200, input: ["status?", "limit?", "offset?"], output: "ScheduleSlot[]", side_effects: [] }

  # --- production runs ---
  - { method: POST, path: "/plant/production-runs", description: "Start a production run; order RELEASED->RUNNING, slot CONFIRMED->IN_PROGRESS, line CHANGEOVER->RUNNING", roles: [ProcessEngineer], code: 201, input: [production_order_id, machine_line_id, mold_id, material_lot_id, "colorant_lot_id?"], output: ProductionRun, side_effects: ["cavities_active_at_start snapshot from mold.effective_cavities", "ProductionOrder RELEASED -> RUNNING", "ScheduleSlot CONFIRMED -> IN_PROGRESS", "MachineLine CHANGEOVER -> RUNNING"] }
  - { method: GET, path: "/plant/production-runs", description: "List production runs (multi-FK filtered list)", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler], code: 200, input: ["production_order_id?", "machine_line_id?", "mold_id?", "material_lot_id?", "colorant_lot_id?", "status?", "limit?", "offset?"], output: "ProductionRun[]", side_effects: [] }
  - { method: GET, path: "/plant/production-runs/{id}", description: "Get production run", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, ProductionScheduler], code: 200, input: [], output: ProductionRun, side_effects: [] }
  - { method: POST, path: "/plant/production-runs/{id}/close", description: "Close a run: reconciliation, purge, FIFO material debit, auto-create quality lot", roles: [ProcessEngineer], code: 200, input: [cycles_completed, good_count, scrap_count, actual_drawdown_kg], output: ProductionRun, side_effects: ["resin_consumption_reconciliation", "purge_quantity_on_color_change", "material_allocation_waterfall", "line.last_color_class update", "order quantity rollups recompute", "auto-create QualityTestLot PENDING", "increments ProductionRun.version by 1"] }
  - { method: POST, path: "/plant/production-runs/{id}/void", description: "Void a closed run (only while its quality lot is still PENDING); exact compensating credit to lots", roles: [PlantAdmin], code: 200, input: [], output: ProductionRun, side_effects: ["reverse all lot debits from the close", "QualityTestLot PENDING -> VOIDED", "order rollups recompute", "line.last_color_class recompute", "increments ProductionRun.version by 1"] }

  # --- quality test lots ---
  - { method: GET, path: "/plant/quality-test-lots", description: "List quality lots (FK reverse for production_run_id)", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, CustomerQualityRep], code: 200, input: ["production_run_id?", "status?", "limit?", "offset?"], output: "QualityTestLot[]", side_effects: [] }
  - { method: GET, path: "/plant/quality-test-lots/{id}", description: "Get quality lot", roles: [PlantAdmin, ProcessEngineer, QualityTechnician, CustomerQualityRep], code: 200, input: [], output: QualityTestLot, side_effects: [] }
  - { method: POST, path: "/plant/quality-test-lots/{id}/sample", description: "PENDING -> SAMPLED", roles: [QualityTechnician], code: 200, input: [], output: QualityTestLot, side_effects: ["increments QualityTestLot.version by 1"] }
  - { method: POST, path: "/plant/quality-test-lots/{id}/record-results", description: "SAMPLED -> ACCEPTED or REJECTED per AQL decision; REJECTED cascades a QC hold on the order", roles: [QualityTechnician], code: 200, input: [leak_failures, drop_failures], output: QualityTestLot, side_effects: ["aql_acceptance_sampling decision", "on REJECTED: order RUNNING -> HELD, slots -> CANCELLED, line RUNNING -> CHANGEOVER", "on ACCEPTED: order.quantity_accepted recompute", "increments QualityTestLot.version by 1"] }
  - { method: POST, path: "/plant/quality-test-lots/{id}/disposition", description: "REJECTED -> SCRAPPED (action SCRAP) or -> PENDING rework loop (action REWORK); SoD: dispositor must differ from recorder", roles: [QualityTechnician], code: 200, input: [action], output: QualityTestLot, side_effects: ["SCRAP: order.quantity_qc_scrapped recompute", "REWORK: retest_count += 1, results cleared, status PENDING", "increments QualityTestLot.version by 1"] }

  # --- shipments ---
  - { method: POST, path: "/plant/shipments", description: "Create shipment (QUOTED) with persisted freight computation", roles: [LogisticsCoordinator], code: 201, input: [production_order_id, quantity, shipment_mode], output: Shipment, side_effects: ["freight_of_air_charge computed and persisted"] }
  - { method: GET, path: "/plant/shipments", description: "List shipments (FK reverse for production_order_id and customer_id)", roles: [PlantAdmin, ProductionScheduler, LogisticsCoordinator], code: 200, input: ["production_order_id?", "customer_id?", "status?", "limit?", "offset?"], output: "Shipment[]", side_effects: [] }
  - { method: GET, path: "/plant/shipments/{id}", description: "Get shipment", roles: [PlantAdmin, ProductionScheduler, LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/plant/shipments/{id}/book", description: "QUOTED -> BOOKED against a RESERVED dock appointment; reserves accepted stock", roles: [LogisticsCoordinator], code: 200, input: [dock_appointment_id], output: Shipment, side_effects: ["order.quantity_reserved/quantity_unallocated recompute", "increments Shipment.version by 1"] }
  - { method: POST, path: "/plant/shipments/{id}/load", description: "BOOKED -> LOADING; must be inside the booked dock window; appointment -> OCCUPIED", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: ["DockAppointment RESERVED -> OCCUPIED", "increments Shipment.version by 1"] }
  - { method: POST, path: "/plant/shipments/{id}/dispatch", description: "LOADING -> IN_TRANSIT", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: ["increments Shipment.version by 1"] }
  - { method: POST, path: "/plant/shipments/{id}/deliver", description: "IN_TRANSIT -> DELIVERED; appointment -> COMPLETED; order shipped quantities recompute", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: ["DockAppointment OCCUPIED -> COMPLETED", "order quantity_shipped/quantity_reserved/quantity_unallocated recompute", "increments Shipment.version by 1"] }
  - { method: POST, path: "/plant/shipments/{id}/cancel", description: "QUOTED/BOOKED -> CANCELLED; BOOKED cancel releases the stock reservation and cancels the RESERVED appointment", roles: [LogisticsCoordinator], code: 200, input: [], output: Shipment, side_effects: ["release reservation on the order", "booked DockAppointment RESERVED -> CANCELLED", "increments Shipment.version by 1"] }

  # --- dock appointments ---
  - { method: POST, path: "/plant/dock-appointments", description: "Reserve a dock door window for a QUOTED shipment (closed-interval conflict rules)", roles: [LogisticsCoordinator], code: 201, input: [shipment_id, dock_door, window_start, window_end], output: DockAppointment, side_effects: [] }
  - { method: GET, path: "/plant/dock-appointments", description: "List dock appointments (FK reverse for shipment_id)", roles: [PlantAdmin, LogisticsCoordinator], code: 200, input: ["shipment_id?", "dock_door?", "status?", "limit?", "offset?"], output: "DockAppointment[]", side_effects: [] }
  - { method: GET, path: "/plant/dock-appointments/{id}", description: "Get dock appointment", roles: [PlantAdmin, LogisticsCoordinator], code: 200, input: [], output: DockAppointment, side_effects: [] }
  - { method: GET, path: "/plant/dock-appointments/{id}/shipments", description: "List shipments booked against this appointment (FK reverse for booked_appointment_id)", roles: [PlantAdmin, LogisticsCoordinator], code: 200, input: [], output: "Shipment[]", side_effects: [] }
  - { method: POST, path: "/plant/dock-appointments/{id}/no-show", description: "Mark RESERVED appointment NO_SHOW after window end; a booked shipment reverts (BOOKED -> CANCELLED)", roles: [LogisticsCoordinator], code: 200, input: [], output: DockAppointment, side_effects: ["booked Shipment BOOKED -> CANCELLED with reservation release", "increments DockAppointment.version by 1"] }
  - { method: POST, path: "/plant/dock-appointments/{id}/cancel", description: "Cancel a RESERVED appointment; a booked shipment reverts to QUOTED with reservation release", roles: [LogisticsCoordinator], code: 200, input: [], output: DockAppointment, side_effects: ["booked Shipment BOOKED -> QUOTED with reservation release", "increments DockAppointment.version by 1"] }

  # --- schedule slots ---
  - { method: GET, path: "/plant/schedule-slots/{id}", description: "Get schedule slot", roles: [PlantAdmin, ProcessEngineer, ProductionScheduler], code: 200, input: [], output: ScheduleSlot, side_effects: [] }
  - { method: POST, path: "/plant/schedule-slots/{id}/cancel", description: "Cancel a CONFIRMED slot (IN_PROGRESS slots are system-cancelled only)", roles: [ProductionScheduler], code: 200, input: [], output: ScheduleSlot, side_effects: ["increments ScheduleSlot.version by 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_CROSS_CUSTOMER_ACCESS, http: 403, condition: "CustomerQualityRep acting on a resource owned by a different customer" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Disposition attempted by the same user id that recorded the lot's results" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, bad enum, negative number, inverted time window, or sample counts exceeding sample size" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not resolve" }
  - { id: ERR_BOTTLE_SPEC_NOT_FOUND, http: 404, condition: "BottleSpec id does not resolve" }
  - { id: ERR_QUALIFICATION_RUN_NOT_FOUND, http: 404, condition: "QualificationRun id does not resolve" }
  - { id: ERR_MOLD_NOT_FOUND, http: 404, condition: "Mold id does not resolve" }
  - { id: ERR_CAVITY_BLOCKOUT_NOT_FOUND, http: 404, condition: "CavityBlockout id does not resolve" }
  - { id: ERR_MACHINE_LINE_NOT_FOUND, http: 404, condition: "MachineLine id does not resolve" }
  - { id: ERR_SCHEDULE_SLOT_NOT_FOUND, http: 404, condition: "ScheduleSlot id does not resolve" }
  - { id: ERR_MATERIAL_LOT_NOT_FOUND, http: 404, condition: "MaterialLot id does not resolve" }
  - { id: ERR_PRODUCTION_ORDER_NOT_FOUND, http: 404, condition: "ProductionOrder id does not resolve" }
  - { id: ERR_PRODUCTION_RUN_NOT_FOUND, http: 404, condition: "ProductionRun id does not resolve" }
  - { id: ERR_QUALITY_TEST_LOT_NOT_FOUND, http: 404, condition: "QualityTestLot id does not resolve" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id does not resolve" }
  - { id: ERR_DOCK_APPOINTMENT_NOT_FOUND, http: 404, condition: "DockAppointment id does not resolve" }
  - { id: ERR_RATE_CARD_NOT_FOUND, http: 404, condition: "No ACTIVE FreightRateCard exists for freight computation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined for the resource's current state (generic from-state mismatch)" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_SPEC_NOT_QUALIFIED, http: 409, condition: "Spec not in QUALIFIED/PRODUCTION_ACTIVE for scheduling" }
  - { id: ERR_ORDER_NOT_RELEASED, http: 409, condition: "Run start requires order RELEASED or RUNNING" }
  - { id: ERR_NO_ACTIVE_SLOT, http: 409, condition: "No CONFIRMED slot for (order, line) containing the current clock, or no CONFIRMED slot at release" }
  - { id: ERR_MOLD_NOT_INSTALLED, http: 409, condition: "Mold not INSTALLED, or installed on a different line than requested" }
  - { id: ERR_LINE_BUSY, http: 409, condition: "Line RUNNING a different order, or a mold already installed on the target line" }
  - { id: ERR_MATERIAL_LOT_NOT_RELEASED, http: 409, condition: "Material lot not in RELEASED/IN_USE" }
  - { id: ERR_APPOINTMENT_NOT_RESERVED, http: 409, condition: "Dock appointment not RESERVED at book/load" }
  - { id: ERR_QUALITY_HOLD_BLOCKOUT, http: 409, condition: "Open QUALITY_HOLD or CONTAMINATION_HOLD blockout on the mold gates production" }
  - { id: ERR_RESIN_INCOMPATIBLE, http: 422, condition: "spec.resin_type not in mold.compatible_resins" }
  - { id: ERR_SCHEDULE_OVERLAP, http: 409, condition: "Half-open slot window intersects another slot on the line, or changeover gap to an adjacent slot is below the mold-change buffer" }
  - { id: ERR_DOCK_WINDOW_CONFLICT, http: 409, condition: "Closed dock window intersects another RESERVED/OCCUPIED appointment on the same door (touching endpoints conflict)" }
  - { id: ERR_OUTSIDE_DOCK_WINDOW, http: 409, condition: "Shipment load attempted outside the booked appointment window" }
  - { id: ERR_PLANNED_WEIGHT_OUT_OF_TOLERANCE, http: 422, condition: "planned_weight_g outside the spec tolerance band" }
  - { id: ERR_LABELER_REQUIRED, http: 422, condition: "Spec requires inline labeling but the line lacks a labeler, or bottle diameter exceeds line maximum" }
  - { id: ERR_INSUFFICIENT_CAVITATION, http: 422, condition: "mold.effective_cavities below spec.min_cavitation_required" }
  - { id: ERR_CAVITY_OUT_OF_RANGE, http: 422, condition: "cavity_index outside 1..base_cavities" }
  - { id: ERR_CAVITY_ALREADY_BLOCKED, http: 409, condition: "An OPEN blockout already exists for (mold, cavity_index)" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "Uniqueness violation on customer_code / mold_code / line_code / lane_code / lot_code / (customer, spec_code)" }
  - { id: ERR_SPEC_UNCHANGED_SINCE_REJECTION, http: 409, condition: "Resubmit from REVISION_REQUESTED without advancing content_revision" }
  - { id: ERR_ACTIVE_QUALIFICATION_EXISTS, http: 409, condition: "Another qualification run for the spec is still active" }
  - { id: ERR_WEIGHT_OUT_OF_TOLERANCE, http: 422, condition: "Approval blocked: measured mean weight outside tolerance band" }
  - { id: ERR_COUNT_EXCEEDS_PRODUCTION, http: 422, condition: "good_count + scrap_count exceeds cycles_completed * cavities_active_at_start" }
  - { id: ERR_ZERO_QUANTITY, http: 422, condition: "Shipment quantity must be a positive integer" }
  - { id: ERR_SPEC_REVISION_STALE, http: 409, condition: "Order baseline/qualified revision no longer matches spec.content_revision" }
  - { id: ERR_MODE_MISMATCH, http: 422, condition: "shipment_mode inconsistent with order.logistics_mode" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Scheduling would push customer order exposure above credit_limit_cents" }
  - { id: ERR_INSUFFICIENT_MATERIAL, http: 422, condition: "Not enough RELEASED/IN_USE resin for release check or run close drawdown" }
  - { id: ERR_INSUFFICIENT_ACCEPTED_STOCK, http: 422, condition: "Shipment book quantity exceeds order.quantity_unallocated" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant administrator; owns configuration (customers, lines, molds, rate cards, material receiving), logical clock, and run voids"
    identity: opaque
    exclusive_operations: ["POST /plant/customers", "POST /plant/customers/{id}/suspend", "POST /plant/customers/{id}/reactivate", "POST /plant/freight-rate-cards", "POST /plant/machine-lines", "POST /plant/molds", "POST /plant/material-lots", "POST /plant/production-runs/{id}/void", "POST /plant/_clock/set_current_utc"]
    shared_operations: ["GET endpoints"]
  - name: ProcessEngineer
    description: "Owns bottle specs, qualification execution, mold install/remove, cavity blockouts, and production runs"
    identity: opaque
    exclusive_operations: ["POST /plant/bottle-specs", "PATCH /plant/bottle-specs/{id}", "POST /plant/bottle-specs/{id}/submit", "POST /plant/bottle-specs/{id}/begin-qualification", "POST /plant/bottle-specs/{id}/retire", "POST /plant/qualification-runs", "POST /plant/qualification-runs/{id}/execute", "POST /plant/molds/{id}/install", "POST /plant/molds/{id}/remove", "POST /plant/molds/{id}/cavity-blockouts", "POST /plant/cavity-blockouts/{id}/clear", "POST /plant/production-runs", "POST /plant/production-runs/{id}/close"]
    shared_operations: ["GET /plant/machine-lines/{id}/throughput-preview", "GET /plant/bottle-specs/{id}/logistics-comparison", "GET endpoints"]
  - name: QualityTechnician
    description: "QC gatekeeper: material lot release/hold/reject, qualification submit-review, quality lot sampling/results/disposition (with segregation of duties), order QC hold"
    identity: opaque
    exclusive_operations: ["POST /plant/material-lots/{id}/release", "POST /plant/material-lots/{id}/hold", "POST /plant/material-lots/{id}/reject", "POST /plant/qualification-runs/{id}/submit-review", "POST /plant/quality-test-lots/{id}/sample", "POST /plant/quality-test-lots/{id}/record-results", "POST /plant/quality-test-lots/{id}/disposition", "POST /plant/production-orders/{id}/hold"]
    shared_operations: ["GET endpoints"]
  - name: ProductionScheduler
    description: "Owns production orders, scheduling windows, release, completion, and slot cancellation"
    identity: opaque
    exclusive_operations: ["POST /plant/production-orders", "POST /plant/production-orders/{id}/schedule", "POST /plant/production-orders/{id}/reschedule", "POST /plant/production-orders/{id}/release", "POST /plant/production-orders/{id}/cancel", "POST /plant/production-orders/{id}/complete", "POST /plant/schedule-slots/{id}/cancel"]
    shared_operations: ["GET /plant/machine-lines/{id}/throughput-preview", "GET endpoints"]
  - name: LogisticsCoordinator
    description: "Owns freight quotes, shipments, and dock appointments"
    identity: opaque
    exclusive_operations: ["POST /plant/freight-quotes", "POST /plant/shipments", "POST /plant/shipments/{id}/book", "POST /plant/shipments/{id}/load", "POST /plant/shipments/{id}/dispatch", "POST /plant/shipments/{id}/deliver", "POST /plant/shipments/{id}/cancel", "POST /plant/dock-appointments", "POST /plant/dock-appointments/{id}/no-show", "POST /plant/dock-appointments/{id}/cancel"]
    shared_operations: ["GET /plant/bottle-specs/{id}/logistics-comparison", "GET endpoints"]
  - name: CustomerQualityRep
    description: "Customer-side quality representative; reviews qualification runs for own customer's specs only"
    identity: entity_backed:Customer
    exclusive_operations: ["POST /plant/qualification-runs/{id}/review"]
    shared_operations: ["GET /plant/customers/{id}", "GET /plant/customers/{id}/bottle-specs", "GET /plant/bottle-specs/{id}", "GET /plant/bottle-specs/{id}/qualification-runs", "GET /plant/qualification-runs/{id}", "GET /plant/quality-test-lots", "GET /plant/quality-test-lots/{id}"]
