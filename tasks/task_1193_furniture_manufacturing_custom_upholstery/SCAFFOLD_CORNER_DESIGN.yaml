  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: auth_missing_header_beats_state_check
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=5]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "An undeclared role on confirm against a non-DRAFT order violates priority 1 (auth) and priority 5 (state); the auth error wins: 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, not 409."
        test_recipe:
          setup: ["Dealer; order ORD-A1 confirmed once (no lines issue — needs a line; confirmed into MATERIAL_HOLD with a COM-less plant line and no stock)"]
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "CHAIR", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ANY", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-A1", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: NotARole
              captures: { err: $.data.error_id }
          assert:
            - "400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (priority 1 auth beats priority 5 state — order is no longer DRAFT, but the state error must not surface)"

      - name: option_combo_restricted_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPTION_COMBO_RESTRICTED]", "entities.ProductModel.fields.option_rules"]
        distinguishing_aspect: "An explicit allowed: false matrix row blocks the combo: grade D × ESPRESSO → 422 ERR_OPTION_COMBO_RESTRICTED."
        test_recipe:
          setup: ["Model M-RESTR with rule (D, ESPRESSO, allowed false); spec grade D; dealer; DRAFT order"]
          setup_api_calls:
            - call: "POST /mill/product-models"
              payload: { model_code: "M-RESTR", category: "SOFA", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "D", finish_code: "ESPRESSO", allowed: false, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-D", origin: "PLANT", grade: "D", nominal_width_inches: 54.0, price_per_yard_cents: 5000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-RESTR", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 1 }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "422 ERR_OPTION_COMBO_RESTRICTED; no line is created"

      - name: option_matrix_exact_beats_any
        claim_type: conditional_validation
        grounds: ["entities.ProductModel.fields.option_rules", "entities.OrderLine.fields.matched_surcharge_pct"]
        distinguishing_aspect: "Selector determinism on the matrix: the exact finish row (ESPRESSO, 0.25) beats the ANY wildcard row (0.10) — line with ESPRESSO gets unit 25000, line with WALNUT falls through to ANY and gets 22000."
        test_recipe:
          setup: ["Model M-MATRIX (base 20000) with rules (A, ESPRESSO, true, 0.25) and (A, ANY, true, 0.10); spec grade A; DRAFT order"]
          setup_api_calls:
            - call: "POST /mill/product-models"
              payload: { model_code: "M-MATRIX", category: "SOFA", base_fabric_yards: 3.0, base_price_cents: 20000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.25, lead_time_adder_days: 0 }, { fabric_grade: "A", finish_code: "ANY", allowed: true, surcharge_pct: 0.10, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
