      - name: window_settlement_refuses_an_underfunded_plan_and_a_post_close_correction
        claim_type: triggerable
        grounds:
          - errors.ERR_PLAN_ASSETS_INSUFFICIENT
          - errors.ERR_WINDOW_CAP_EXCEEDED
          - errors.ERR_WINDOW_NOT_OPEN
          - errors.ERR_PARTICIPANT_STATE_INVALID
        distinguishing_aspect: |
          Four refusals along one window's life. The 402 is a funding refusal, not a
          422, and it clears once a valuation raises assets. The cap is re-verified at
          settlement from the participants' CURRENT audited benefit, so a correction
          booked after the window closed can blow the cap the waterfall had already
          approved — and undoing the correction lets the settlement through, proving the
          check is re-evaluated rather than latched. Once the participant is settled the
          window is closed to elections and the record is closed to cleansing.
        test_recipe:
          setup:
            - "a plan authorized LUMP_SUM_ONLY with assets 2000000, one cleansed DEFERRED_VESTED participant at 20000/month, and a window capped at 5000000 that has been opened, elected and closed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
