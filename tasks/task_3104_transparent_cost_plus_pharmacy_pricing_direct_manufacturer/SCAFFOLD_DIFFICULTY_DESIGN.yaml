      - name: formulary_gate_band_upper_edge_supply_exactly_twice_demand_admits
        grounds:
          - calculations.expansion_score
          - calculations.expansion_score.worked_examples
          - state_machines.Drug.transitions.NON_FORMULARY_to_FORMULARY
          - errors[ERR_FORMULARY_GATE_FAILED]
          - endpoints.POST_/formularies/{id}/expansion
        distinguishing_aspect: >
          The expansion gate is a numeric threshold crossing whose upper band edge is
          inclusive: demand 250 with supply exactly 500 sits at supply == 2 * demand
          and admits with expansion_score 2, while demand 250 with supply 499 sits
          below the edge and also admits at 1 fewer unit.
