            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "OC-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "OC-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "OC-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: ProgramAdministrator, captures: { ch_v: $.data.version } }
          trigger:
            - { call: "POST /senior-benefits/cardholders/${ch_id}/cards", payload: { reason: REPLACEMENT, expected_cardholder_version: "${ch_v}" }, as: ProgramAdministrator, as_user_id: "admin-1", captures: { c2_id: $.data.id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: ProgramAdministrator, captures: { ch_v2: $.data.version } }
            - { call: "POST /senior-benefits/cardholders/${ch_id}/cards", payload: { reason: REPLACEMENT, expected_cardholder_version: "${ch_v}" }, as: ProgramAdministrator, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "first replacement succeeds 201 (version matched)"
            - "Cardholder.version after success == ${ch_v} + 1 (every mutation increments by exactly 1)"
            - "replay with the now-stale version -> error_id == ERR_STALE_VERSION, http 412"

