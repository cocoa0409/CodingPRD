# =============================================================================
# SCAFFOLD — Treasury Management & Lockbox Services (commercial bank treasury)
# =============================================================================

scenario: |
  Treasury Management & Lockbox Services (commercial bank treasury services):
  service implementation & customer setup, remittance capture & data transmission
  format, exception item handling & customer decisioning, availability schedule &
  float assignment, cutoff time & same-day credit, image archive & retrieval
  requests, service billing (account analysis) & earnings credit rate,
  performance SLA & error credit.

domain_name: treasury-lockbox-services
api_prefix: /banks

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
    - rate_threshold_triggers

  entity_topology: hybrid          # Bank → Customer → Agreement → Site tree, with cross-cutting Remittance/Exception/Billing references
  state_machine_shape: compound    # RemittanceBatch state is a function of its RemittanceItems; plus branching on ExceptionItem decision; plus parallel capture × transmission dimensions on the batch
  relationship_patterns:
    - one_to_many
    - cross_aggregate              # ExceptionItem → RemittanceItem; ImageRetrievalRequest → RemittanceItem; AnalysisLineItem → ServiceAgreement
    - self_referential             # TransmissionFormat.supersedes_format_id
  role_model: segregation_of_duties # Implementer ≠ Activator on agreement; ExceptionDecider ≠ BatchApprover; distinct biller vs bill approver
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Bank
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Bank legal name" }
      - { name: routing_number, type: string, source: input, description: "9-digit ABA routing number; unique per bank" }
      - { name: current_business_date, type: string, source: system, description: "Logical business date (YYYY-MM-DD), advanced via close_business_day; defaults to 2026-08-01 at bank creation" }
      - { name: current_analysis_cycle_index, type: integer, source: system, default: 0, description: "Monotonic counter of closed monthly analysis cycles" }
      - { name: default_earnings_credit_rate_bp, type: integer, source: input, description: "Bank-wide ECR in basis points per annum (e.g. 175 = 1.75%)" }
      - { name: sla_credit_breach_threshold_bp, type: integer, source: input, default: 200, description: "SLA error-rate threshold in bp of items; breach when monthly error rate >= threshold" }
      - { name: posture, type: enum, source: computed, description: "OPERATING | SUSPENDED | LIQUIDATING — derived from active SLA breaches and regulator freeze flag" }

  - name: Customer
    parent: Bank
    common_fields: true
    fields:
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id; owning bank" }
      - { name: legal_name, type: string, source: input, description: "Customer legal entity name" }
      - { name: tax_id, type: string, source: input, description: "Customer tax identifier (EIN); unique per bank" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ONBOARDING | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: deposit_account_number, type: string, source: input, description: "DDA account number for credits/charges" }
      - { name: average_collected_balance_cents, type: integer, source: computed, description: "Current-cycle average collected balance; recomputed daily by close_business_day" }
      - { name: collected_balance_accumulator_cents, type: integer, source: system, default: 0, description: "Sum of end-of-day collected balances this cycle; divided by days-in-cycle on cycle close" }
      - { name: days_in_cycle_elapsed, type: integer, source: system, default: 0, description: "Days elapsed in current analysis cycle" }

  - name: ServiceAgreement
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id; denormalized for lookup" }
      - { name: agreement_number, type: string, source: input, description: "Unique per bank" }
      - { name: earnings_credit_rate_bp, type: integer, source: input, description: "Agreement-level ECR override in basis points; if null use Bank.default_earnings_credit_rate_bp" }
      - { name: ecr_override_allowed, type: boolean, source: input, default: false, description: "Whether earnings_credit_rate_bp override is honored; if false, override silently ignored at calc time" }
      - { name: monthly_maintenance_fee_cents, type: integer, source: input, description: "Flat monthly fee, charged regardless of volume" }
      - { name: per_item_capture_fee_cents, type: integer, source: input, description: "Fee per accepted remittance item" }
      - { name: per_exception_decision_fee_cents, type: integer, source: input, description: "Fee per exception decision rendered" }
      - { name: per_image_retrieval_fee_cents, type: integer, source: input, description: "Fee per fulfilled image retrieval" }
      - { name: implemented_by_user_id, type: string, source: system, description: "TreasuryImplementer who executed implement; recorded for segregation of duties" }
      - { name: activated_by_user_id, type: string, source: system, description: "TreasuryActivator who executed activate; MUST differ from implemented_by_user_id" }
      - { name: status, type: enum, source: system, description: "DRAFT | IMPLEMENTED | ACTIVE | SUSPENDED | TERMINATED" }

  - name: LockboxSite
    parent: ServiceAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> ServiceAgreement.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id" }
      - { name: site_code, type: string, source: input, description: "Site identifier, unique per bank (e.g. LBX-CHI-01)" }
      - { name: postal_box_address, type: string, source: input, description: "Remittance mailing address" }
      - { name: daily_cutoff_time_local, type: string, source: input, description: "HH:MM 24h local time; items captured after this roll to next business day" }
      - { name: timezone, type: string, source: input, description: "IANA tz, e.g. America/Chicago" }
      - { name: status, type: enum, source: system, description: "PROVISIONING | LIVE | SUSPENDED | DECOMMISSIONED" }

  - name: TransmissionFormat
    parent: ServiceAgreement
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> ServiceAgreement.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id" }
      - { name: format_kind, type: enum, source: input, description: "BAI2 | EDI820 | CUSTOM_CSV" }
      - { name: version_label, type: string, source: input, description: "Free-form version label (e.g. v3-with-invoice-detail)" }
      - { name: supersedes_format_id, type: string, source: input, required: false, description: "FK -> TransmissionFormat.id; self-referential — new format replacing an existing ACTIVE one" }
      - { name: include_invoice_detail, type: boolean, source: input, default: false, description: "Whether invoice-level remittance detail lines are emitted" }
      - { name: include_images, type: boolean, source: input, default: false, description: "Whether image references are emitted in the transmission" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED | RETIRED" }

  - name: RemittanceBatch
    parent: LockboxSite
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> LockboxSite.id" }
      - { name: agreement_id, type: string, source: system, description: "FK -> ServiceAgreement.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id" }
      - { name: batch_reference, type: string, source: input, description: "Client-supplied batch reference; unique per site per business_date" }
      - { name: business_date, type: string, source: computed, description: "Logical business date the batch is credited to — today's Bank.current_business_date if received before the site's daily_cutoff_time_local, else next business day" }
      - { name: received_at, type: datetime, source: input, description: "Timestamp the courier delivered the work to the site" }
      - { name: declared_item_count, type: integer, source: input, description: "Item count declared by the courier manifest" }
      - { name: declared_total_cents, type: integer, source: input, description: "Total dollars declared by the courier manifest" }
      - { name: captured_item_count, type: integer, source: computed, description: "Count of child RemittanceItems captured" }
      - { name: captured_total_cents, type: integer, source: computed, description: "Sum of captured item amounts" }
      - { name: accepted_item_count, type: integer, source: computed, description: "Count of child items in ACCEPTED status" }
      - { name: accepted_total_cents, type: integer, source: computed, description: "Sum of ACCEPTED item amounts" }
      - { name: same_day_credit_cents, type: integer, source: computed, description: "Portion of accepted_total_cents eligible for 0-day (same-day) availability" }
      - { name: capture_status, type: enum, source: system, description: "RECEIVED | CAPTURING | BALANCED | OUT_OF_BALANCE | CLOSED" }
      - { name: transmission_status, type: enum, source: system, description: "PENDING | TRANSMITTED | TRANSMISSION_FAILED | ACKED" }
      - { name: batch_status, type: enum, source: computed, description: "Compound derived: OPEN | HELD | DECISIONS_PENDING | READY_TO_SETTLE | SETTLED | REJECTED" }

  - name: RemittanceItem
    parent: RemittanceBatch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> RemittanceBatch.id" }
      - { name: site_id, type: string, source: system, description: "FK -> LockboxSite.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id" }
      - { name: check_number, type: string, source: input, description: "Check serial / MICR serial" }
      - { name: payer_routing_number, type: string, source: input, description: "9-digit ABA of payer's bank" }
      - { name: amount_cents, type: integer, source: input, description: "Item amount in cents" }
      - { name: payee_name, type: string, source: input, description: "Payee on check" }
      - { name: invoice_reference, type: string, source: input, required: false, description: "Invoice / remittance stub reference" }
      - { name: availability_tier, type: enum, source: computed, description: "SAME_DAY | ONE_DAY | TWO_DAY — derived from payer_routing_number vs site AvailabilitySchedule and capture-before-cutoff" }
      - { name: availability_date, type: string, source: computed, description: "Date funds become available — business_date + N business days per availability_tier" }
      - { name: status, type: enum, source: system, description: "CAPTURED | ACCEPTED | RETURNED | ON_EXCEPTION | DECISIONED_PAY | DECISIONED_RETURN" }

  - name: AvailabilitySchedule
    parent: LockboxSite
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> LockboxSite.id" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id" }
      - { name: routing_number_pattern, type: string, source: input, description: "Prefix match on payer_routing_number, e.g. '0710' matches Chicago Fed district" }
      - { name: tier, type: enum, source: input, description: "SAME_DAY | ONE_DAY | TWO_DAY" }
      - { name: effective_from, type: string, source: input, description: "YYYY-MM-DD; schedule applies to items with business_date >= effective_from" }
      - { name: effective_to, type: string, source: input, required: false, description: "YYYY-MM-DD; null = open-ended" }
      - { name: priority, type: integer, source: input, description: "Lower value wins when multiple patterns match; ties broken by effective_from DESC, then AvailabilitySchedule.created_at ASC" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: ExceptionItem
    parent: RemittanceItem
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> RemittanceItem.id; 1:1 with the item flagged" }
      - { name: batch_id, type: string, source: system, description: "FK -> RemittanceBatch.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id" }
      - { name: reason_code, type: enum, source: input, description: "AMOUNT_MISMATCH | PAYEE_MISMATCH | MISSING_INVOICE_REF | STALE_DATED | DUPLICATE_SUSPECTED" }
      - { name: default_decision, type: enum, source: input, description: "PAY | RETURN — applied automatically if customer does not decide by the auto-decision cutoff" }
      - { name: auto_decision_at, type: datetime, source: computed, description: "Timestamp when system auto-applies default_decision — 2 business days after raising, at that day's site cutoff" }
      - { name: decision, type: enum, source: system, description: "PAY | RETURN — null until decided" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of decider (CustomerOperator) or 'system' for auto-decision" }
      - { name: decided_at, type: datetime, source: system, description: "Null until decision is rendered" }
      - { name: status, type: enum, source: system, description: "PENDING | DECIDED | AUTO_DECISIONED | ESCALATED" }

  - name: ImageRetrievalRequest
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id" }
      - { name: item_id, type: string, source: system, description: "FK -> RemittanceItem.id" }
      - { name: request_reason, type: enum, source: input, description: "AUDIT | DISPUTE_SUPPORT | RESEARCH | LEGAL" }
      - { name: requested_image_kinds, type: array, source: input, description: "Subset of {CHECK_FRONT, CHECK_BACK, REMIT_STUB, ENVELOPE}" }
      - { name: fulfillment_uri, type: string, source: system, description: "Null until FULFILLED" }
      - { name: retention_expires_at, type: datetime, source: computed, description: "Item captured_at + 7 years; requests beyond this are DENIED" }
      - { name: sla_due_at, type: datetime, source: computed, description: "requested_at + 1 business hour" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Null until FULFILLED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | FULFILLED | DENIED | EXPIRED" }

  - name: AnalysisCycle
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id" }
      - { name: agreement_id, type: string, source: system, description: "FK -> ServiceAgreement.id — billing parameters come from the ACTIVE agreement at cycle close" }
      - { name: cycle_index, type: integer, source: system, description: "Monotonic per customer, starts at 1" }
      - { name: cycle_start_date, type: string, source: system, description: "First business date of cycle" }
      - { name: cycle_end_date, type: string, source: system, description: "Last business date of cycle (inclusive)" }
      - { name: average_collected_balance_cents, type: integer, source: computed, description: "collected_balance_accumulator_cents / days_in_cycle_elapsed, rounded half-up to whole cents at cycle close" }
      - { name: gross_service_charges_cents, type: integer, source: computed, description: "Sum of maintenance + per-item + per-exception + per-image fees for the cycle" }
      - { name: earnings_credit_cents, type: integer, source: computed, description: "ECR-based offset, floor 0 — see calculation earnings_credit" }
      - { name: net_amount_due_cents, type: integer, source: computed, description: "gross_service_charges_cents - earnings_credit_cents, floored at 0 (bank does not pay customer for excess ECR)" }
      - { name: accepted_item_count, type: integer, source: computed, description: "Count of RemittanceItems moved into ACCEPTED or DECISIONED_PAY during this cycle" }
      - { name: exception_decision_count, type: integer, source: computed, description: "Count of ExceptionItems moved to DECIDED or AUTO_DECISIONED during this cycle" }
      - { name: image_retrieval_fulfilled_count, type: integer, source: computed, description: "Count of ImageRetrievalRequests fulfilled during this cycle" }
      - { name: sla_error_count, type: integer, source: computed, description: "Count of SLAIncidents with confirmed breach in this cycle" }
      - { name: sla_error_rate_bp, type: integer, source: computed, description: "sla_error_count / max(1, accepted_item_count + exception_decision_count) * 10000, rounded half-up" }
      - { name: sla_breach, type: boolean, source: computed, description: "sla_error_rate_bp >= bank.sla_credit_breach_threshold_bp" }
      - { name: sla_credit_cents, type: integer, source: computed, description: "If sla_breach: 10% of gross_service_charges_cents, rounded half-up; else 0" }
      - { name: status, type: enum, source: system, description: "OPEN | FINALIZED | SETTLED | DISPUTED" }

  - name: AnalysisLineItem
    parent: AnalysisCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> AnalysisCycle.id" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id" }
      - { name: line_kind, type: enum, source: system, description: "MAINTENANCE | PER_ITEM_CAPTURE | PER_EXCEPTION_DECISION | PER_IMAGE_RETRIEVAL | SLA_CREDIT" }
      - { name: quantity, type: integer, source: system, description: "Unit count (e.g. items accepted) or 1 for flat charges; negative for SLA_CREDIT" }
      - { name: unit_price_cents, type: integer, source: system, description: "Unit price from the ServiceAgreement at cycle close; negative for SLA_CREDIT" }
      - { name: extended_amount_cents, type: integer, source: computed, description: "quantity * unit_price_cents" }

  - name: SLAIncident
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id" }
      - { name: cycle_id, type: string, source: system, description: "FK -> AnalysisCycle.id; null until the covering cycle is closed" }
      - { name: incident_kind, type: enum, source: input, description: "LATE_TRANSMISSION | LATE_IMAGE_FULFILLMENT | MISSED_CUTOFF_POSTING | DATA_FORMAT_ERROR" }
      - { name: reference_batch_id, type: string, source: input, required: false, description: "FK -> RemittanceBatch.id; required for LATE_TRANSMISSION / MISSED_CUTOFF_POSTING / DATA_FORMAT_ERROR" }
      - { name: reference_request_id, type: string, source: input, required: false, description: "FK -> ImageRetrievalRequest.id; required for LATE_IMAGE_FULFILLMENT" }
      - { name: occurred_on_business_date, type: string, source: input, description: "YYYY-MM-DD" }
      - { name: breach_confirmed, type: boolean, source: system, default: false, description: "Set true by BillingSpecialist review; only confirmed incidents feed sla_error_count" }
      - { name: status, type: enum, source: system, description: "REPORTED | CONFIRMED | REJECTED | CREDITED" }

  - name: ErrorCreditRequest
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: bank_id, type: string, source: system, description: "FK -> Bank.id" }
      - { name: cycle_id, type: string, source: system, description: "FK -> AnalysisCycle.id; the disputed cycle" }
      - { name: requested_credit_cents, type: integer, source: input, description: "Credit amount the customer is requesting" }
      - { name: reason_code, type: enum, source: input, description: "SLA_NOT_APPLIED | BILLING_RATE_ERROR | DUPLICATE_CHARGE | ECR_MISCALCULATION" }
      - { name: approved_credit_cents, type: integer, source: system, description: "Amount approved; set on approve, may differ from requested" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "BillingApprover who reviewed" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | PARTIALLY_APPROVED | DENIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Bank
    initial_state: OPERATING
    terminal_states: [LIQUIDATING]
    transitions:
      - from: OPERATING
        to: SUSPENDED
        trigger: "POST /banks/{bankId}/suspend"
        actor: BankOperationsAdmin
        preconditions: []
        side_effects:
          - "All LockboxSites transition LIVE → SUSPENDED"
          - "All RemittanceBatches in CAPTURING or BALANCED transition to HELD (via batch_status recompute)"
          - "No new batches or retrievals accepted while SUSPENDED"
      - from: SUSPENDED
        to: OPERATING
        trigger: "POST /banks/{bankId}/resume"
        actor: BankOperationsAdmin
        preconditions:
          - "No unresolved SLAIncident in CONFIRMED status older than 30 days"
        side_effects:
          - "All LockboxSites transition SUSPENDED → LIVE (only those suspended by the cascade)"
      - from: OPERATING
        to: LIQUIDATING
        trigger: "POST /banks/{bankId}/liquidate"
        actor: BankOperationsAdmin
        preconditions:
          - "All customers in TERMINATED status"
          - "All AnalysisCycles in SETTLED status"
        side_effects: []

  - entity: Customer
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ONBOARDING
        trigger: "POST /banks/{bankId}/customers/{customerId}/begin_onboarding"
        actor: TreasuryImplementer
        preconditions: []
        side_effects: []
      - from: ONBOARDING
        to: ACTIVE
        trigger: "system (auto when first ServiceAgreement reaches ACTIVE)"
        actor: system
        preconditions:
          - "Customer has >= 1 ServiceAgreement reaching ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /banks/{bankId}/customers/{customerId}/suspend"
        actor: TreasuryActivator
        preconditions: []
        side_effects:
          - "All ACTIVE ServiceAgreements → SUSPENDED"
          - "All LIVE LockboxSites → SUSPENDED"
          - "RemittanceBatches in non-terminal capture_status → HELD"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /banks/{bankId}/customers/{customerId}/resume"
        actor: TreasuryActivator
        preconditions:
          - "Bank.posture == OPERATING"
        side_effects:
          - "All SUSPENDED ServiceAgreements → ACTIVE"
          - "All SUSPENDED LockboxSites → LIVE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /banks/{bankId}/customers/{customerId}/terminate"
        actor: TreasuryActivator
        preconditions:
          - "All ServiceAgreements TERMINATED"
          - "All AnalysisCycles SETTLED (ERR_CUSTOMER_NOT_SETTLED)"
          - "No ImageRetrievalRequest in REQUESTED status"
        side_effects: []

  - entity: ServiceAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: IMPLEMENTED
        trigger: "POST /banks/{bankId}/customers/{customerId}/agreements/{agreementId}/implement"
        actor: TreasuryImplementer
        preconditions:
          - "Customer.status in {ONBOARDING, ACTIVE}"
          - "Bank.posture == OPERATING"
        side_effects:
          - "implemented_by_user_id := X-User-ID"
      - from: IMPLEMENTED
        to: ACTIVE
        trigger: "POST /banks/{bankId}/customers/{customerId}/agreements/{agreementId}/activate"
        actor: TreasuryActivator
        preconditions:
          - "X-User-ID != ServiceAgreement.implemented_by_user_id (segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
          - "Customer.status in {ONBOARDING, ACTIVE}"
          - "expected_agreement_version matches (OCC)"
        side_effects:
          - "activated_by_user_id := X-User-ID"
          - "Increments ServiceAgreement.version by 1"
          - "If Customer.status == ONBOARDING: Customer → ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /banks/{bankId}/customers/{customerId}/agreements/{agreementId}/suspend"
        actor: TreasuryActivator
        preconditions: []
        side_effects:
          - "All child LockboxSites → SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /banks/{bankId}/customers/{customerId}/agreements/{agreementId}/resume"
        actor: TreasuryActivator
        preconditions:
          - "Customer.status == ACTIVE"
          - "Bank.posture == OPERATING"
        side_effects:
          - "All child LockboxSites → LIVE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /banks/{bankId}/customers/{customerId}/agreements/{agreementId}/terminate"
        actor: TreasuryActivator
        preconditions:
          - "All LockboxSites DECOMMISSIONED"
          - "All AnalysisCycles referencing this agreement SETTLED"
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /banks/{bankId}/customers/{customerId}/agreements/{agreementId}/terminate"
        actor: TreasuryActivator
        preconditions:
          - "All LockboxSites DECOMMISSIONED"
          - "All AnalysisCycles referencing this agreement SETTLED"
        side_effects: []

  - entity: LockboxSite
    initial_state: PROVISIONING
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PROVISIONING
        to: LIVE
        trigger: "POST /banks/{bankId}/customers/{customerId}/agreements/{agreementId}/sites/{siteId}/go_live"
        actor: TreasuryActivator
        preconditions:
          - "ServiceAgreement.status == ACTIVE"
          - "At least one AvailabilitySchedule in ACTIVE status exists for this site (ERR_SITE_LACKS_AVAILABILITY_SCHEDULE)"
          - "At least one TransmissionFormat in ACTIVE status exists for this site's agreement (ERR_SITE_LACKS_TRANSMISSION_FORMAT)"
        side_effects: []
      - from: LIVE
        to: SUSPENDED
        trigger: "POST /banks/{bankId}/customers/{customerId}/agreements/{agreementId}/sites/{siteId}/suspend OR cascade from Bank.suspend / Customer.suspend / Agreement.suspend"
        actor: "TreasuryActivator | system"
        preconditions: []
        side_effects:
          - "New RemittanceBatches rejected with ERR_SITE_NOT_LIVE"
      - from: SUSPENDED
        to: LIVE
        trigger: "POST .../sites/{siteId}/go_live (re-entry)"
        actor: TreasuryActivator
        preconditions:
          - "ServiceAgreement.status == ACTIVE"
          - "Customer.status == ACTIVE"
          - "Bank.posture == OPERATING"
        side_effects: []
      - from: LIVE
        to: DECOMMISSIONED
        trigger: "POST .../sites/{siteId}/decommission"
        actor: TreasuryActivator
        preconditions:
          - "No RemittanceBatch on this site with capture_status in {RECEIVED, CAPTURING, BALANCED, OUT_OF_BALANCE} (ERR_SITE_HAS_OPEN_BATCHES)"
          - "No ImageRetrievalRequest in REQUESTED status for items on this site"
        side_effects: []
      - from: SUSPENDED
        to: DECOMMISSIONED
        trigger: "POST .../sites/{siteId}/decommission"
        actor: TreasuryActivator
        preconditions:
          - "No RemittanceBatch on this site with capture_status in {RECEIVED, CAPTURING, BALANCED, OUT_OF_BALANCE}"
        side_effects: []

  - entity: TransmissionFormat
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST .../transmission_formats/{formatId}/activate"
        actor: TreasuryActivator
        preconditions:
          - "ServiceAgreement.status == ACTIVE"
          - "expected_agreement_version matches ServiceAgreement.version (OCC — supersede race)"
        side_effects:
          - "If supersedes_format_id set: that TransmissionFormat → SUPERSEDED"
          - "Increments ServiceAgreement.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (cascade when a newer TransmissionFormat with supersedes_format_id pointing here is activated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST .../transmission_formats/{formatId}/retire"
        actor: TreasuryActivator
        preconditions:
          - "No RemittanceBatch in PENDING transmission_status for this format"
        side_effects: []
      - from: SUPERSEDED
        to: RETIRED
        trigger: "POST .../transmission_formats/{formatId}/retire"
        actor: TreasuryActivator
        preconditions: []
        side_effects: []

  - entity: RemittanceBatch
    initial_state: "RECEIVED (capture) / PENDING (transmission) / OPEN (compound)"
    terminal_states: ["CLOSED (capture) / ACKED (transmission) / SETTLED or REJECTED (compound)"]
    transitions:
      # --- capture dimension ---
      - from: RECEIVED
        to: CAPTURING
        trigger: "POST /banks/{bankId}/.../batches/{batchId}/begin_capture"
        actor: LockboxOperator
        preconditions:
          - "LockboxSite.status == LIVE (ERR_SITE_NOT_LIVE)"
          - "Bank.posture == OPERATING"
        side_effects: []
      - from: CAPTURING
        to: BALANCED
        trigger: "POST .../batches/{batchId}/balance"
        actor: LockboxOperator
        preconditions:
          - "captured_item_count == declared_item_count (ERR_BATCH_OUT_OF_BALANCE)"
          - "captured_total_cents == declared_total_cents (ERR_BATCH_OUT_OF_BALANCE)"
        side_effects:
          - "Recompute batch_status from item states"
      - from: CAPTURING
        to: OUT_OF_BALANCE
        trigger: "POST .../batches/{batchId}/balance (mismatch) OR POST .../batches/{batchId}/force_out_of_balance"
        actor: LockboxOperator
        preconditions: []
        side_effects:
          - "Operator must capture correction items or force-close"
      - from: OUT_OF_BALANCE
        to: CAPTURING
        trigger: "POST .../batches/{batchId}/resume_capture"
        actor: LockboxOperator
        preconditions: []
        side_effects: []
      - from: BALANCED
        to: CLOSED
        trigger: "POST .../batches/{batchId}/close"
        actor: LockboxOperator
        preconditions:
          - "All RemittanceItems in {ACCEPTED, RETURNED, DECISIONED_PAY, DECISIONED_RETURN}"
          - "X-User-ID != the LockboxOperator who ran begin_capture (segregation of duties; ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "If any item landed in RETURNED or DECISIONED_RETURN: batch compound → REJECTED, else batch compound → READY_TO_SETTLE"
      # --- transmission dimension ---
      - from: PENDING
        to: TRANSMITTED
        trigger: "POST .../batches/{batchId}/transmit"
        actor: LockboxOperator
        preconditions:
          - "capture_status == CLOSED"
          - "TransmissionFormat for the agreement in ACTIVE status (ERR_TRANSMISSION_FORMAT_INACTIVE)"
        side_effects:
          - "Generates transmission payload per format_kind"
          - "If transmission ran after the bank's transmission SLA cutoff: emit SLAIncident{LATE_TRANSMISSION, REPORTED}"
      - from: TRANSMITTED
        to: ACKED
        trigger: "POST .../batches/{batchId}/acknowledge_transmission"
        actor: CustomerOperator
        preconditions: []
        side_effects: []
      - from: TRANSMITTED
        to: TRANSMISSION_FAILED
        trigger: "POST .../batches/{batchId}/mark_transmission_failed"
        actor: LockboxOperator
        preconditions: []
        side_effects: []
      - from: TRANSMISSION_FAILED
        to: TRANSMITTED
        trigger: "POST .../batches/{batchId}/transmit (retry)"
        actor: LockboxOperator
        preconditions: []
        side_effects: []
      # --- compound batch_status (derived; not directly writable) ---
      - from: OPEN
        to: HELD
        trigger: "system (cascade on Bank.suspend / Customer.suspend / Agreement.suspend / Site.suspend)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: DECISIONS_PENDING
        trigger: "system (when any child RemittanceItem transitions to ON_EXCEPTION)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DECISIONS_PENDING
        to: READY_TO_SETTLE
        trigger: "system (when last PENDING ExceptionItem transitions to DECIDED or AUTO_DECISIONED AND capture_status == CLOSED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY_TO_SETTLE
        to: SETTLED
        trigger: "system (close_business_day when transmission_status == ACKED)"
        actor: system
        preconditions:
          - "transmission_status == ACKED"
        side_effects:
          - "accepted_total_cents credited to Customer.deposit_account (ledger entry)"
          - "Customer.collected_balance_accumulator_cents += accepted_total_cents weighted by availability_date — see calculation availability_credit"
      - from: READY_TO_SETTLE
        to: REJECTED
        trigger: "system (close_business_day when all items are RETURNED or DECISIONED_RETURN)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RemittanceItem
    initial_state: CAPTURED
    terminal_states: [ACCEPTED, RETURNED, DECISIONED_PAY, DECISIONED_RETURN]
    transitions:
      - from: CAPTURED
        to: ACCEPTED
        trigger: "POST /banks/{bankId}/.../batches/{batchId}/items/{itemId}/accept"
        actor: LockboxOperator
        preconditions:
          - "RemittanceBatch.capture_status in {CAPTURING, BALANCED}"
        side_effects:
          - "Compute availability_tier + availability_date via availability_assignment calculation"
          - "RemittanceBatch.accepted_item_count += 1; accepted_total_cents += amount_cents"
          - "If tier == SAME_DAY: batch.same_day_credit_cents += amount_cents"
      - from: CAPTURED
        to: RETURNED
        trigger: "POST .../items/{itemId}/return"
        actor: LockboxOperator
        preconditions: []
        side_effects: []
      - from: CAPTURED
        to: ON_EXCEPTION
        trigger: "POST .../items/{itemId}/raise_exception"
        actor: LockboxOperator
        preconditions: []
        side_effects:
          - "Create ExceptionItem{status=PENDING, auto_decision_at = 2 business days out}"
          - "RemittanceBatch.batch_status: OPEN → DECISIONS_PENDING if not already"
      - from: ON_EXCEPTION
        to: DECISIONED_PAY
        trigger: "POST .../exception_items/{exceptionItemId}/decide{decision: PAY}  OR system auto-decision at auto_decision_at"
        actor: "CustomerOperator | system"
        preconditions:
          - "ExceptionItem.status == PENDING"
        side_effects:
          - "Compute availability_tier + availability_date (using decision timestamp as the new capture anchor — see availability_assignment variant on_exception_decision)"
          - "RemittanceBatch.accepted_item_count += 1; accepted_total_cents += amount_cents"
          - "Customer's current OPEN AnalysisCycle.exception_decision_count += 1"
      - from: ON_EXCEPTION
        to: DECISIONED_RETURN
        trigger: "POST .../exception_items/{exceptionItemId}/decide{decision: RETURN}  OR system auto-decision at auto_decision_at"
        actor: "CustomerOperator | system"
        preconditions:
          - "ExceptionItem.status == PENDING"
        side_effects:
          - "Customer's current OPEN AnalysisCycle.exception_decision_count += 1"

  - entity: ExceptionItem
    initial_state: PENDING
    terminal_states: [DECIDED, AUTO_DECISIONED]
    transitions:
      - from: PENDING
        to: DECIDED
        trigger: "POST .../exception_items/{exceptionItemId}/decide"
        actor: CustomerOperator
        preconditions:
          - "ExceptionItem.status == PENDING (ERR_EXCEPTION_ALREADY_DECIDED)"
          - "X-User-ID != the LockboxOperator who raised the exception (segregation of duties)"
          - "Bank.current_business_date <= business_date(auto_decision_at) — once past auto_decision_at, only the system can decide"
        side_effects:
          - "decision := request.decision; decided_at := now; decided_by_user_id := X-User-ID"
          - "RemittanceItem ON_EXCEPTION → DECISIONED_PAY or DECISIONED_RETURN"
          - "If last PENDING on the batch: batch DECISIONS_PENDING → READY_TO_SETTLE"
      - from: PENDING
        to: AUTO_DECISIONED
        trigger: "system (close_business_day when Bank.current_business_date >= business_date(auto_decision_at) and still PENDING)"
        actor: system
        preconditions: []
        side_effects:
          - "decision := default_decision; decided_at := auto_decision_at; decided_by_user_id := 'system'"
          - "Same downstream effects as DECIDED"
      - from: PENDING
        to: ESCALATED
        trigger: "POST .../exception_items/{exceptionItemId}/escalate"
        actor: CustomerOperator
        preconditions: []
        side_effects:
          - "auto_decision_at += 1 business day (one-time extension)"
      - from: ESCALATED
        to: DECIDED
        trigger: "POST .../exception_items/{exceptionItemId}/decide"
        actor: CustomerOperator
        preconditions: []
        side_effects: ["Same as PENDING → DECIDED"]
      - from: ESCALATED
        to: AUTO_DECISIONED
        trigger: "system (close_business_day)"
        actor: system
        preconditions: []
        side_effects: ["Same as PENDING → AUTO_DECISIONED"]

  - entity: ImageRetrievalRequest
    initial_state: REQUESTED
    terminal_states: [FULFILLED, DENIED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: FULFILLED
        trigger: "POST .../image_requests/{requestId}/fulfill"
        actor: LockboxOperator
        preconditions:
          - "Bank.current timestamp <= retention_expires_at (ERR_IMAGE_RETENTION_EXPIRED)"
        side_effects:
          - "fulfillment_uri := generated; fulfilled_at := now"
          - "Customer's current OPEN AnalysisCycle.image_retrieval_fulfilled_count += 1"
          - "If fulfilled_at > sla_due_at: emit SLAIncident{LATE_IMAGE_FULFILLMENT, REPORTED}"
      - from: REQUESTED
        to: DENIED
        trigger: "POST .../image_requests/{requestId}/deny OR system (retention_expires_at already past at request time)"
        actor: "LockboxOperator | system"
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: EXPIRED
        trigger: "system (close_business_day when requested_at is > 30 calendar days old and still REQUESTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Emit SLAIncident{LATE_IMAGE_FULFILLMENT, REPORTED}"

  - entity: AnalysisCycle
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "system (close_analysis_cycle at month end)"
        actor: system
        preconditions:
          - "cycle_end_date == Bank.current_business_date"
        side_effects:
          - "Compute average_collected_balance_cents, gross_service_charges_cents, earnings_credit_cents, net_amount_due_cents, sla_error_rate_bp, sla_breach, sla_credit_cents"
          - "Emit AnalysisLineItems (MAINTENANCE, PER_ITEM_CAPTURE, PER_EXCEPTION_DECISION, PER_IMAGE_RETRIEVAL, and SLA_CREDIT if sla_breach)"
          - "Attach all SLAIncidents with occurred_on_business_date within [cycle_start_date, cycle_end_date] to this cycle (set cycle_id)"
      - from: FINALIZED
        to: SETTLED
        trigger: "POST .../analysis_cycles/{cycleId}/settle"
        actor: BillingSpecialist
        preconditions:
          - "No ErrorCreditRequest in SUBMITTED status against this cycle"
          - "expected_cycle_version matches (OCC)"
        side_effects:
          - "Debit Customer.deposit_account by net_amount_due_cents"
          - "Increments AnalysisCycle.version by 1"
      - from: FINALIZED
        to: DISPUTED
        trigger: "system (cascade when ErrorCreditRequest is SUBMITTED against this cycle)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: SETTLED
        trigger: "POST .../analysis_cycles/{cycleId}/settle (after all disputes resolved)"
        actor: BillingSpecialist
        preconditions:
          - "All ErrorCreditRequests against this cycle in {APPROVED, PARTIALLY_APPROVED, DENIED}"
          - "expected_cycle_version matches (OCC)"
        side_effects:
          - "Apply any approved credit to net_amount_due_cents before debit"
          - "Debit Customer.deposit_account by adjusted net"
          - "Increments AnalysisCycle.version by 1"

  - entity: SLAIncident
    initial_state: REPORTED
    terminal_states: [CONFIRMED, REJECTED, CREDITED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST .../sla_incidents/{incidentId}/confirm"
        actor: BillingSpecialist
        preconditions: []
        side_effects:
          - "breach_confirmed := true"
          - "If covering AnalysisCycle already FINALIZED: recompute sla_error_count and possibly sla_credit_cents"
      - from: REPORTED
        to: REJECTED
        trigger: "POST .../sla_incidents/{incidentId}/reject"
        actor: BillingSpecialist
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CREDITED
        trigger: "system (close_analysis_cycle when attached cycle finalizes AND sla_breach true)"
        actor: system
        preconditions: []
        side_effects:
          - "SLA_CREDIT AnalysisLineItem emitted with negative extended_amount_cents"

  - entity: ErrorCreditRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, PARTIALLY_APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST .../error_credit_requests/{requestId}/approve"
        actor: BillingApprover
        preconditions:
          - "X-User-ID != the BillingSpecialist who settled/finalized the cycle (segregation of duties)"
        side_effects:
          - "approved_credit_cents := requested_credit_cents"
          - "reviewed_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: PARTIALLY_APPROVED
        trigger: "POST .../error_credit_requests/{requestId}/approve_partial"
        actor: BillingApprover
        preconditions:
          - "approved_credit_cents in payload < requested_credit_cents"
        side_effects:
          - "approved_credit_cents := payload value"
          - "reviewed_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST .../error_credit_requests/{requestId}/deny"
        actor: BillingApprover
        preconditions: []
        side_effects:
          - "approved_credit_cents := 0"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: agreement-activate-stale-version
    parent_entity: ServiceAgreement
    write_endpoint: "POST /banks/{bankId}/customers/{customerId}/agreements/{agreementId}/activate"
    occ_field: "expected_agreement_version"
    description: |
      Activating a ServiceAgreement whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer has just activated or modified the agreement (which legitimately
      supersedes the client's view) and the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: transmission-format-activate-stale-version
    parent_entity: ServiceAgreement
    write_endpoint: "POST /banks/{bankId}/customers/{customerId}/agreements/{agreementId}/transmission_formats/{formatId}/activate"
    occ_field: "expected_agreement_version"
    description: |
      Activating a TransmissionFormat against a ServiceAgreement whose version
      has advanced since the client last observed it is rejected — the
      supersede cascade on activation mutates the parent agreement, so the
      parent's version is the OCC token.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: analysis-cycle-settle-stale-version
    parent_entity: AnalysisCycle
    write_endpoint: "POST /banks/{bankId}/customers/{customerId}/analysis_cycles/{cycleId}/settle"
    occ_field: "expected_cycle_version"
    description: |
      Settling an AnalysisCycle whose version has advanced since the client
      last observed it is rejected. A second sequential settle observes the
      bumped version (from SLAIncident confirmation cascade or partial dispute
      approval) and is rejected deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: availability_assignment
    trigger: "RemittanceItem accepted (CAPTURED→ACCEPTED) OR exception decisioned PAY (ON_EXCEPTION→DECISIONED_PAY)"
    algorithm: topological
    formula: |
      anchor_date = (variant == on_capture) ? batch.business_date
                  : (variant == on_exception_decision) ? business_date(decision_timestamp)
      eligible_schedules = AvailabilitySchedule WHERE
        site_id == batch.site_id
        AND status == ACTIVE
        AND payer_routing_number.startswith(routing_number_pattern)
        AND effective_from <= anchor_date
        AND (effective_to IS NULL OR anchor_date <= effective_to)
      if len(eligible_schedules) == 0:
        tier = TWO_DAY  # default fallback
      else:
        chosen = min by (priority ASC, effective_from DESC, AvailabilitySchedule.created_at ASC)
        tier = chosen.tier
      if anchor captured after site.daily_cutoff_time_local (variant on_capture only):
        # already rolled business_date at batch creation; tier is still computed against the rolled date
        pass
      availability_date = add_business_days(anchor_date, 0 if SAME_DAY else 1 if ONE_DAY else 2)
    variants:
      - name: on_capture
        when: "Direct accept path — anchor_date is batch.business_date (already cutoff-adjusted)"
        difference: "Uses the business_date stamped at batch receipt; no further cutoff shift"
      - name: on_exception_decision
        when: "Exception decisioned PAY — anchor_date is the business_date of the decision timestamp"
        difference: "Re-anchors availability on the decision date, NOT the original batch.business_date; this can shift availability later by >= 2 business days"
    precision: "Business-day arithmetic, no fractional days"

  - name: same_day_credit
    trigger: "Item accept (CAPTURED→ACCEPTED) or exception DECISIONED_PAY"
    algorithm: aggregation
    formula: |
      For each RemittanceItem moved into ACCEPTED or DECISIONED_PAY:
        if availability_tier == SAME_DAY:
          batch.same_day_credit_cents += item.amount_cents
      # Recompute on every transition; do NOT cache.
    variants:
      - name: provisional
        when: "Batch still in CAPTURING / BALANCED / DECISIONS_PENDING — same_day_credit_cents reflects only items accepted so far"
        difference: "Forward-looking: excludes items still CAPTURED; may increase as more items accepted"
      - name: final
        when: "Batch capture_status == CLOSED — value is frozen"
        difference: "Final: no further changes; the value written into the Customer ledger at settle"
    precision: "Whole cents"

  - name: earnings_credit
    trigger: "close_analysis_cycle"
    algorithm: forward_looking
    formula: |
      avg_balance = average_collected_balance_cents  # see average_collected_balance
      agreement = ServiceAgreement WHERE id == cycle.agreement_id
      if agreement.ecr_override_allowed AND agreement.earnings_credit_rate_bp IS NOT NULL:
        ecr_bp = agreement.earnings_credit_rate_bp
      else:
        ecr_bp = bank.default_earnings_credit_rate_bp
      # Use actual/360 day-count convention (bank standard)
      days_in_cycle = days_in_cycle_elapsed
      raw_credit = avg_balance * ecr_bp * days_in_cycle / (360 * 10000)
      earnings_credit_cents = round_half_up(raw_credit)
      # Floor at zero; never negative
      earnings_credit_cents = max(0, earnings_credit_cents)
      # Cap at gross_service_charges_cents — bank does not pay customer for excess
      earnings_credit_cents = min(earnings_credit_cents, gross_service_charges_cents)
    constants:
      DAY_COUNT_BASIS: 360
      BP_DENOMINATOR: 10000
    variants:
      - name: with_agreement_override
        when: "agreement.ecr_override_allowed == true AND agreement.earnings_credit_rate_bp IS NOT NULL"
        difference: "Uses agreement-level ECR; bank-wide default is shadowed"
      - name: with_bank_default
        when: "override not allowed OR override is null"
        difference: "Uses bank.default_earnings_credit_rate_bp"
    precision: "Whole cents, round_half_up"

  - name: gross_service_charges
    trigger: "close_analysis_cycle"
    algorithm: aggregation
    formula: |
      agreement = ServiceAgreement WHERE id == cycle.agreement_id
      maintenance = agreement.monthly_maintenance_fee_cents
      capture_fees = cycle.accepted_item_count * agreement.per_item_capture_fee_cents
      exception_fees = cycle.exception_decision_count * agreement.per_exception_decision_fee_cents
      image_fees = cycle.image_retrieval_fulfilled_count * agreement.per_image_retrieval_fee_cents
      # Order of rounding: round per-line-item to whole cents first, THEN sum.
      # (Per-line rounding then sum, NOT sum-then-round. Pinned here because
      #  per_item_capture_fee_cents might not be integer-multiplied cleanly.)
      maintenance_r = round_half_up(maintenance)
      capture_fees_r = round_half_up(capture_fees)
      exception_fees_r = round_half_up(exception_fees)
      image_fees_r = round_half_up(image_fees)
      gross_service_charges_cents = maintenance_r + capture_fees_r + exception_fees_r + image_fees_r
    precision: "Whole cents, round_half_up per line, then integer sum"

  - name: net_amount_due
    trigger: "close_analysis_cycle; recomputed on ErrorCreditRequest approval if cycle is in DISPUTED status"
    algorithm: constraint_propagation
    formula: |
      base_net = gross_service_charges_cents - earnings_credit_cents
      base_net = max(0, base_net)  # bank never pays customer for excess ECR
      # Apply SLA credit if sla_breach
      if sla_breach:
        base_net = base_net - sla_credit_cents
        base_net = max(0, base_net)
      # Apply approved error credits (only when DISPUTED path is being settled)
      total_approved_credits = sum(ErrorCreditRequest.approved_credit_cents WHERE cycle_id == cycle.id AND status IN {APPROVED, PARTIALLY_APPROVED})
      net_amount_due_cents = max(0, base_net - total_approved_credits)
    variants:
      - name: clean_settle
        when: "No disputes, no SLA breach"
        difference: "net = max(0, gross - ecr)"
      - name: disputed_settle
        when: "Error credit approved against cycle"
        difference: "net = max(0, gross - ecr - sla_credit - approved_error_credits); order matters: ECR first, then SLA, then error credits"
    precision: "Whole cents"

  - name: average_collected_balance
    trigger: "close_business_day (accumulate) and close_analysis_cycle (finalize)"
    algorithm: chronological
    formula: |
      # Per-day accumulation:
      # At each close_business_day for the Bank, for each ACTIVE Customer:
      #   day_collected = sum of accepted_total_cents for batches SETTLED that day
      #     where availability_date <= current_business_date
      #   (i.e. only funds that have actually cleared count toward collected)
      #   collected_balance_accumulator_cents += day_collected (cumulative, not the daily balance)
      #   days_in_cycle_elapsed += 1
      # At close_analysis_cycle:
      #   average_collected_balance_cents = round_half_up(collected_balance_accumulator_cents / days_in_cycle_elapsed)
      # Boundary: if days_in_cycle_elapsed == 0 (cycle opened and closed same day — only
      # possible at customer termination), average is 0.
      if days_in_cycle_elapsed == 0:
        average_collected_balance_cents = 0
      else:
        average_collected_balance_cents = round_half_up(collected_balance_accumulator_cents / days_in_cycle_elapsed)
    precision: "Whole cents, round_half_up at final divide only"

  - name: sla_error_rate
    trigger: "close_analysis_cycle; recomputed on SLAIncident CONFIRMED transition if attached cycle already FINALIZED"
    algorithm: threshold
    formula: |
      denominator = max(1, cycle.accepted_item_count + cycle.exception_decision_count)
      sla_error_rate_bp = round_half_up(cycle.sla_error_count * 10000 / denominator)
      sla_breach = sla_error_rate_bp >= bank.sla_credit_breach_threshold_bp
      # Note: >= not > — exactly at threshold IS a breach
      if sla_breach:
        sla_credit_cents = round_half_up(gross_service_charges_cents * 0.10)
      else:
        sla_credit_cents = 0
    constants:
      SLA_CREDIT_RATE: 0.10
      BP_SCALE: 10000
    precision: "Whole bp, round_half_up; sla_credit_cents whole cents round_half_up"
    # Boundary-precision difficulty: at threshold IS a breach; threshold-1 is NOT.

  - name: business_date_rollover
    trigger: "RemittanceBatch creation"
    algorithm: projection
    formula: |
      # Project whether received_at is before or after site.daily_cutoff_time_local in site.timezone
      received_local = received_at.astimezone(site.timezone)
      cutoff_local = site.daily_cutoff_time_local  # HH:MM
      if received_local.time() < cutoff_local:
        batch.business_date = bank.current_business_date  # same-day credit window
      else:
        batch.business_date = add_business_days(bank.current_business_date, 1)  # rolls to next business day
      # Boundary: received exactly AT cutoff (HH:MM:00) rolls to next day (>=, not >)
    precision: "Date precision; >= on time-of-day comparison"

  - name: exception_auto_decision_date
    trigger: "ExceptionItem creation; recompute on escalate"
    algorithm: projection
    formula: |
      base = add_business_days(bank.current_business_date, 2)
      auto_decision_at = datetime(base, site.daily_cutoff_time_local, site.timezone)
      # On escalate: auto_decision_at += 1 business day (one-time only — escalate is non-idempotent)
    precision: "Datetime precision; business-day arithmetic"

  - name: image_retention_expiry
    trigger: "ImageRetrievalRequest creation"
    algorithm: projection
    formula: |
      retention_expires_at = RemittanceItem.created_at + 7 years
      # System-side check at request: if now > retention_expires_at, auto-DENY at creation
    constants:
      RETENTION_YEARS: 7
    precision: "Datetime"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted to invoke this endpoint (per §1.7 RBAC)"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist within the bank (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Bank.posture must permit the operation (SUSPENDED blocks value-extending ops; LIQUIDATING blocks everything)"
    error_id: ERR_BANK_NOT_OPERATING
    http_status: 409
    applies_to: "mutating endpoints other than Bank-level admin"

  - priority: 5
    category: state
    check: "Target resource must be in the correct lifecycle state for this transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: activator != implementer; exception decider != raiser; closer != capturer; error credit approver != settler"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "agreement activate, batch close, exception decide, error_credit approve"

  - priority: 7
    category: business_safety
    check: "OCC expected_*_version must match the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "agreement activate, transmission_format activate, analysis_cycle settle"

  - priority: 8
    category: business_referential
    check: "Referenced FK entities must exist and belong to the same bank"
    error_id: ERR_INVALID_REFERENCE
    http_status: 409
    applies_to: "item raise_exception, image_request create, sla_incident create, error_credit create"

  - priority: 9
    category: business_constraint
    check: "Batch balance invariant: captured_item_count == declared_item_count AND captured_total_cents == declared_total_cents"
    error_id: ERR_BATCH_OUT_OF_BALANCE
    http_status: 409
    applies_to: "batch balance"

  - priority: 10
    category: business_constraint
    check: "Site prerequisites for go_live: at least one ACTIVE AvailabilitySchedule AND one ACTIVE TransmissionFormat"
    error_id: "ERR_SITE_LACKS_AVAILABILITY_SCHEDULE / ERR_SITE_LACKS_TRANSMISSION_FORMAT"
    http_status: 409
    applies_to: "site go_live"

  - priority: 11
    category: business_temporal
    check: "Image retention: request must be within retention_expires_at window"
    error_id: ERR_IMAGE_RETENTION_EXPIRED
    http_status: 409
    applies_to: "image_request create, image_request fulfill"

  - priority: 12
    category: business_temporal
    check: "Exception decision window: customer decision must arrive before auto_decision_at"
    error_id: ERR_EXCEPTION_ALREADY_DECIDED
    http_status: 409
    applies_to: "exception decide"

  - priority: 13
    category: business_fiscal
    check: "Customer must be ACTIVE (or ONBOARDING for first agreement) for value-extending ops"
    error_id: ERR_CUSTOMER_NOT_ACTIVE
    http_status: 409
    applies_to: "agreement implement, batch create, image_request create"

  - priority: 14
    category: business_fiscal
    check: "Customer has no unsettled cycles / open batches blocking termination or decommission"
    error_id: "ERR_CUSTOMER_NOT_SETTLED / ERR_SITE_HAS_OPEN_BATCHES"
    http_status: 409
    applies_to: "customer terminate, site decommission"

  - priority: 15
    category: business_constraint
    check: "Uniqueness: routing_number per bank; tax_id per bank; agreement_number per bank; site_code per bank; batch_reference per site per business_date"
    error_id: ERR_DUPLICATE_UNIQUE_FIELD
    http_status: 409
    applies_to: "create endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Bank ---
  - method: POST
    path: "/banks"
    description: "Create a Bank"
    roles: [BankOperationsAdmin]
    code: 201
    input: [legal_name, routing_number, default_earnings_credit_rate_bp, "sla_credit_breach_threshold_bp?"]
    output: Bank
    side_effects: ["posture=OPERATING, current_business_date=2026-08-01, current_analysis_cycle_index=0"]

  - method: GET
    path: "/banks/{bankId}"
    description: "Get a Bank"
    roles: [BankOperationsAdmin, TreasuryImplementer, TreasuryActivator, LockboxOperator, CustomerOperator, BillingSpecialist, BillingApprover, Auditor]
    code: 200
    input: []
    output: Bank
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/suspend"
    description: "Suspend bank posture (cascades to sites, batches)"
    roles: [BankOperationsAdmin]
    code: 200
    input: []
    output: Bank
    side_effects: ["posture → SUSPENDED", "All LIVE sites → SUSPENDED", "All non-terminal batches → HELD"]

  - method: POST
    path: "/banks/{bankId}/resume"
    description: "Resume bank posture"
    roles: [BankOperationsAdmin]
    code: 200
    input: []
    output: Bank
    side_effects: ["posture → OPERATING (if no ancient unresolved incidents)", "Cascade-suspended sites → LIVE"]

  - method: POST
    path: "/banks/{bankId}/liquidate"
    description: "Move bank to LIQUIDATING (terminal)"
    roles: [BankOperationsAdmin]
    code: 200
    input: []
    output: Bank
    side_effects: ["posture → LIQUIDATING"]

  - method: POST
    path: "/banks/{bankId}/close_business_day"
    description: "Advance the logical clock by one business day; runs all per-day checkpoints (auto-decision exceptions, image expiry, accumulator update, batch settlement)"
    roles: [BankOperationsAdmin]
    code: 200
    input: []
    output: Bank
    side_effects:
      - "current_business_date += 1 business day"
      - "ExceptionItems past auto_decision_at → AUTO_DECISIONED"
      - "ImageRetrievalRequests REQUESTED > 30 days → EXPIRED"
      - "READY_TO_SETTLE batches with ACKED transmission → SETTLED; ledger credit posted"
      - "READY_TO_SETTLE batches all-returned → REJECTED"
      - "Each Customer.collected_balance_accumulator_cents updated; days_in_cycle_elapsed += 1"

  - method: POST
    path: "/banks/{bankId}/close_analysis_cycle"
    description: "Close the current month-end analysis cycle for every ACTIVE customer (or one customer if customer_id supplied)"
    roles: [BillingSpecialist]
    code: 200
    input: ["customer_id?"]
    output: Bank
    side_effects:
      - "For each eligible customer: current OPEN AnalysisCycle → FINALIZED"
      - "Compute average_collected_balance, gross_service_charges, earnings_credit, net_amount_due, sla_breach, sla_credit"
      - "Emit AnalysisLineItems"
      - "current_analysis_cycle_index += 1; open new OPEN AnalysisCycle per customer"

  # --- Customer ---
  - method: POST
    path: "/banks/{bankId}/customers"
    description: "Create a Customer"
    roles: [TreasuryImplementer]
    code: 201
    input: [legal_name, tax_id, deposit_account_number]
    output: Customer
    side_effects: ["status=PROSPECT", "collected_balance_accumulator_cents=0", "days_in_cycle_elapsed=0"]

  - method: GET
    path: "/banks/{bankId}/customers/{customerId}"
    description: "Get a Customer"
    roles: [BankOperationsAdmin, TreasuryImplementer, TreasuryActivator, LockboxOperator, CustomerOperator, BillingSpecialist, BillingApprover, Auditor]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/customers"
    description: "List customers"
    roles: [BankOperationsAdmin, TreasuryImplementer, TreasuryActivator, LockboxOperator, CustomerOperator, BillingSpecialist, BillingApprover, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/begin_onboarding"
    description: "Transition PROSPECT → ONBOARDING"
    roles: [TreasuryImplementer]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → ONBOARDING"]

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/suspend"
    description: "ACTIVE → SUSPENDED"
    roles: [TreasuryActivator]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → SUSPENDED; cascade agreements, sites, batches"]

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/resume"
    description: "SUSPENDED → ACTIVE"
    roles: [TreasuryActivator]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → ACTIVE; cascade"]

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/terminate"
    description: "ACTIVE → TERMINATED"
    roles: [TreasuryActivator]
    code: 200
    input: []
    output: Customer
    side_effects: ["status → TERMINATED"]

  # --- ServiceAgreement ---
  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/agreements"
    description: "Create a ServiceAgreement"
    roles: [TreasuryImplementer]
    code: 201
    input: [agreement_number, "earnings_credit_rate_bp?", "ecr_override_allowed?", monthly_maintenance_fee_cents, per_item_capture_fee_cents, per_exception_decision_fee_cents, per_image_retrieval_fee_cents]
    output: ServiceAgreement
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}"
    description: "Get a ServiceAgreement"
    roles: [BankOperationsAdmin, TreasuryImplementer, TreasuryActivator, LockboxOperator, CustomerOperator, BillingSpecialist, BillingApprover, Auditor]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/customers/{customerId}/agreements"
    description: "List agreements for a customer"
    roles: [BankOperationsAdmin, TreasuryImplementer, TreasuryActivator, LockboxOperator, CustomerOperator, BillingSpecialist, BillingApprover, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ServiceAgreement[]"
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/implement"
    description: "DRAFT → IMPLEMENTED"
    roles: [TreasuryImplementer]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["status → IMPLEMENTED", "implemented_by_user_id := X-User-ID"]

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/activate"
    description: "IMPLEMENTED → ACTIVE (segregation of duties: activator != implementer; OCC)"
    roles: [TreasuryActivator]
    code: 200
    input: [expected_agreement_version]
    output: ServiceAgreement
    side_effects: ["status → ACTIVE", "activated_by_user_id := X-User-ID", "increments ServiceAgreement.version by 1", "If Customer ONBOARDING: Customer → ACTIVE"]

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/suspend"
    description: "ACTIVE → SUSPENDED"
    roles: [TreasuryActivator]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["status → SUSPENDED", "child sites → SUSPENDED"]

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/resume"
    description: "SUSPENDED → ACTIVE"
    roles: [TreasuryActivator]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["status → ACTIVE", "child sites → LIVE"]

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/terminate"
    description: "ACTIVE|SUSPENDED → TERMINATED"
    roles: [TreasuryActivator]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["status → TERMINATED"]

  # --- LockboxSite ---
  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/sites"
    description: "Create a LockboxSite"
    roles: [TreasuryImplementer]
    code: 201
    input: [site_code, postal_box_address, daily_cutoff_time_local, timezone]
    output: LockboxSite
    side_effects: ["status=PROVISIONING"]

  - method: GET
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/sites/{siteId}"
    description: "Get a LockboxSite"
    roles: [BankOperationsAdmin, TreasuryImplementer, TreasuryActivator, LockboxOperator, CustomerOperator, BillingSpecialist, BillingApprover, Auditor]
    code: 200
    input: []
    output: LockboxSite
    side_effects: []

  - method: GET
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/sites"
    description: "List sites for an agreement"
    roles: [BankOperationsAdmin, TreasuryImplementer, TreasuryActivator, LockboxOperator, CustomerOperator, BillingSpecialist, BillingApprover, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LockboxSite[]"
    side_effects: []

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/sites/{siteId}/go_live"
    description: "PROVISIONING|SUSPENDED → LIVE"
    roles: [TreasuryActivator]
    code: 200
    input: []
    output: LockboxSite
    side_effects: ["status → LIVE"]

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/sites/{siteId}/suspend"
    description: "LIVE → SUSPENDED"
    roles: [TreasuryActivator]
    code: 200
    input: []
    output: LockboxSite
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/banks/{bankId}/customers/{customerId}/agreements/{agreementId}/sites/{siteId}/decommission"
