        claim_type: priority_conflict
        grounds: ["validations[priority=3]", "validations[priority=6]", "errors[ERR_PANELIST_NOT_FOUND]"]
        distinguishing_aspect: "Dispatch against an unknown panelist id AND a non-FIELDING (ARMED) wave violates existence (p3) and state (p6); the 404 ERR_PANELIST_NOT_FOUND wins."
