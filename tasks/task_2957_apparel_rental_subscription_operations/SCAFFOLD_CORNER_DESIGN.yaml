scaffold_corner_design:
  - section: entities
    instances:
      - name: entity_membership_plan_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - "entities.MembershipPlan.fields"
          - "endpoints.POST /membership-plans"
          - "response_envelope.success"
        distinguishing_aspect: >-
          The plan is the only entity with no FK and no state machine, so its creation claim is pure field echo
          plus common-field minting: all eight input fields come back verbatim and the four common fields (id,
          created_at, updated_at, version) are present with version == 1. An implementation that drops
          waiver_coverage_cents from the response, or starts version at 0, fails here without any state machine
          being involved.
        test_recipe:
          setup:
            - "empty database, logical clock parked at 2026-08-03T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /membership-plans"
              payload: { code: "SIG4", name: "Signature 4", item_slots: 3, monthly_fee_cents: 10000, monthly_swaps_allowed: 2, shipping_cadence_days: 7, waiver_monthly_fee_cents: 1800, waiver_coverage_cents: 10000 }
              as: PlatformAdmin
          assert:
            - "HTTP 201"
            - "MembershipPlan.code == SIG4"
            - "MembershipPlan.name == Signature 4"
            - "MembershipPlan.item_slots == 3"
            - "MembershipPlan.monthly_fee_cents == 10000"
            - "MembershipPlan.monthly_swaps_allowed == 2"
            - "MembershipPlan.shipping_cadence_days == 7"
            - "MembershipPlan.waiver_monthly_fee_cents == 1800"
            - "MembershipPlan.waiver_coverage_cents == 10000"
            - "MembershipPlan.version == 1"
            - "MembershipPlan.id, created_at and updated_at are all non-null"
            - "the response body is wrapped as { data: { ... } }"
      - name: entity_style_retrieval_returns_stored_row_with_derived_depth_fields
        claim_type: retrieval
        grounds:
          - "entities.Style.fields"
          - "endpoints.GET /styles/{style_id}"
          - "calculations.style_depth_requirement"
        distinguishing_aspect: >-
          GET on a style that owns zero units is the cleanest place to prove that the six computed Style fields
          are materialised at creation rather than at first unit: required_depth_units is 3 from
          forecast_monthly_requests 8 and avg_rental_days 6 while floor_ready_unit_count and active_unit_count are
          both 0, so depth_gap_units is 3 and replenishment_flag is true on a style that has never been touched by
          a reservation.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 created with forecast_monthly_requests 8 and avg_rental_days 6 and no rental units"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
          trigger:
            - call: "GET /styles/${style_gown_id}"
              payload: {}
              as: InventoryPlanner
          assert:
            - "HTTP 200"
            - "Style.style_code == AUR-GOWN-01"
            - "Style.retail_price_cents == 48000"
            - "Style.acquisition_cost_cents == 21000"
            - "Style.size_run == [S, M, L]"
            - "Style.floor_ready_unit_count == 0"
            - "Style.active_unit_count == 0"
            - "Style.required_depth_units == 3"
            - "Style.depth_gap_units == 3"
            - "Style.replenishment_flag == true"
            - "Style.demand_score == 0"
      - name: entity_rental_unit_listing_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - "entities.RentalUnit.fields"
          - "endpoints.GET /rental-units"
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: >-
          Three units of one style read with limit 2 must return exactly 2 rows with total_count 3 and has_more
          true, and the same query at offset 2 must return 1 row with total_count still 3 and has_more false.
          total_count counts the filtered set, not the page, so an implementation that returns len(page) as
          total_count or omits has_more fails on the first call and an implementation that ignores offset fails on
          the second.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 with exactly three size-M grade-A units AUR-GOWN-001, 002 and 003, all IN_STOCK"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-001", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-002", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit2_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-003", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit3_id: "$.data.id" }
          trigger:
            - call: "GET /rental-units"
              payload: { style_id: "${style_gown_id}", limit: 2, offset: 0 }
              as: InventoryPlanner
            - call: "GET /rental-units"
              payload: { style_id: "${style_gown_id}", limit: 2, offset: 2 }
              as: InventoryPlanner
          assert:
            - "first call: HTTP 200, exactly 2 RentalUnit rows in data"
            - "first call: total_count == 3"
            - "first call: has_more == true"
            - "first call: limit == 2 and offset == 0"
            - "second call: exactly 1 RentalUnit row in data"
            - "second call: total_count == 3"
            - "second call: has_more == false"
            - "second call: offset == 2"
      - name: entity_member_get_with_unknown_id_returns_member_not_found
        claim_type: not_found
        grounds:
          - "entities.Member"
          - "endpoints.GET /members/{member_id}"
          - "errors[ERR_MEMBER_NOT_FOUND]"
          - "validations.priority 6"
        distinguishing_aspect: >-
          The id 00000000-0000-4000-8000-000000000000 is a syntactically valid UUID that no POST /members call
          ever minted, so validation priority 6 must answer ERR_MEMBER_NOT_FOUND with HTTP 404 rather than 400
          (well-formed id) or 200 with an empty body.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "no Member rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP 404"
            - "error_id == ERR_MEMBER_NOT_FOUND"
            - "the response body is wrapped as { data: { error_id, message } }"
      - name: entity_style_creation_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Style.fields.retail_price_cents"
          - "endpoints.POST /styles"
          - "validations.priority 8"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: >-
          retail_price_cents has source input and no default, so omitting it is a priority-8 violation answered
          with ERR_INVALID_REQUEST and HTTP 400 — not a 422 (that code is reserved here for enum and semantic
          violations) and not a silent 0 default.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "no Style rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6 }
              as: InventoryPlanner
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "no Style row is persisted: GET /styles returns total_count == 0"
      - name: entity_technician_defaults_applied_when_optional_flags_omitted
        claim_type: defaults
        grounds:
          - "entities.Technician.fields.repair_certified"
          - "entities.Technician.fields.photography_certified"
          - "entities.Technician.fields.status"
          - "endpoints.POST /technicians"
        distinguishing_aspect: >-
          All three optional Technician fields carry declared defaults, and the declared defaults are the
          restrictive ones: a technician created with only employee_code and full_name comes back repair_certified
          false and photography_certified false but status ACTIVE. An implementation that defaults the
          certifications to true would let this technician sign off repairs, and one that defaults status to
          SUSPENDED would lock them out of every job endpoint.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "no Technician rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /technicians"
              payload: { employee_code: "T-QC-3", full_name: "Yusuf Amara" }
              as: PlatformAdmin
          assert:
            - "HTTP 201"
            - "Technician.repair_certified == false"
            - "Technician.photography_certified == false"
            - "Technician.status == ACTIVE"
            - "Technician.version == 1"
      - name: entity_style_computed_depth_is_not_the_supplied_planned_depth
        claim_type: computed_fields
        grounds:
          - "entities.Style.fields.planned_depth_units"
          - "entities.Style.fields.required_depth_units"
          - "calculations.style_depth_requirement"
          - "endpoints.POST /styles"
        distinguishing_aspect: >-
          planned_depth_units is an input field and required_depth_units is a computed one, and this fixture
          forces them apart: planned_depth_units 9 is echoed verbatim while required_depth_units is 3, derived as
          ceil(8 * (6 + 2) / 30). An implementation that copies the merchandiser's planned number into the
          computed field, or that lets the input overwrite the calculation, reports 9 and fails.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "no Style rows exist; the style is created with planned_depth_units 9 while forecast_monthly_requests 8 and avg_rental_days 6 imply required_depth_units 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 9 }
              as: InventoryPlanner
          assert:
            - "HTTP 201"
            - "Style.planned_depth_units == 9"
            - "Style.required_depth_units == 3"
            - "Style.depth_gap_units == 3"
            - "Style.replenishment_flag == true"
            - "Style.active_unit_count == 0"
      - name: entity_rental_unit_system_fields_are_minted_by_the_server
        claim_type: system_fields
        grounds:
          - "entities.RentalUnit.fields.availability_state"
          - "entities.RentalUnit.fields.condition_state"
          - "entities.RentalUnit.fields.turns_completed"
          - "entities.RentalUnit.fields.quarantine_hold"
          - "endpoints.POST /styles/{style_id}/rental-units"
        distinguishing_aspect: >-
          The unit-creation input schema exposes only unit_code, size, acquisition_cost_cents and condition_grade;
          every lifecycle field is source system and must be minted server-side at exactly IN_STOCK / FLOOR_READY
          / 0 turns / quarantine_hold false with retired_at, retirement_reason and last_returned_at all null. A
          unit born RESERVED or with turns_completed null breaks the availability_match_selector eligibility
          filter immediately.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 exists with no units"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
          trigger:
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-001", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
          assert:
            - "HTTP 201"
            - "RentalUnit.availability_state == IN_STOCK"
            - "RentalUnit.condition_state == FLOOR_READY"
            - "RentalUnit.turns_completed == 0"
            - "RentalUnit.quarantine_hold == false"
            - "RentalUnit.last_returned_at == null"
            - "RentalUnit.retired_at == null"
            - "RentalUnit.retirement_reason == null"
            - "RentalUnit.cumulative_servicing_cost_cents == 0"
            - "RentalUnit.realized_revenue_cents == 0"
            - "RentalUnit.version == 1"
            - "RentalUnit.style_id == the style id from setup"
      - name: entity_style_category_outside_the_declared_enum_returns_422
        claim_type: type_constraints
        grounds:
          - "entities.Style.fields.category"
          - "validations.priority 9"
          - "errors[ERR_INVALID_ENUM_VALUE]"
          - "endpoints.POST /styles"
        distinguishing_aspect: >-
          category is constrained to {GOWN, BLAZER, DRESS, KNITWEAR, ACCESSORY}; the value OUTERWEAR is well-typed
          JSON so priority 8 passes and priority 9 must answer ERR_INVALID_ENUM_VALUE with HTTP 422,
          distinguishing enum rejection from the 400 used for missing or mistyped fields.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "no Style rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "OUTERWEAR", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6 }
              as: InventoryPlanner
          assert:
            - "HTTP 422"
            - "error_id == ERR_INVALID_ENUM_VALUE"
            - "GET /styles returns total_count == 0"
      - name: entity_inspection_rows_are_append_only_and_carry_no_version
        claim_type: immutability
        grounds:
          - "entities.Inspection"
          - "entities.Inspection.fields.attempt_index"
          - "endpoints.POST /reverse-logistics-jobs/{job_id}/inspections"
          - "endpoints.GET /inspections"
          - "state_machines.ReverseLogisticsJob.transitions.PROCESSING_to_INSPECTED"
        distinguishing_aspect: >-
          Inspection is the scaffold's only common_fields false entity, so it has no version and no update
          endpoint anywhere in the §1.5 surface: a re-inspection appends a second row with attempt_index 2 while
          attempt_index 1 keeps soil_level LIGHT forever. An implementation that overwrites the latest inspection
          in place would show total_count 1 and soil_level HEAVY on the first row, and would also break
          servicing_cost_rollup, which reads the row with the greatest attempt_index.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z by the PlatformAdmin clock endpoint"
            - "membership plan SIG4: item_slots 3, monthly_fee_cents 10000, monthly_swaps_allowed 2, shipping_cadence_days 7, waiver_monthly_fee_cents 1800, waiver_coverage_cents 10000"
            - "two ACTIVE technicians T-INSP-1 and T-REP-2, both repair_certified and photography_certified"
            - "style AUR-GOWN-01: GOWN, retail_price_cents 48000, acquisition_cost_cents 21000, size_run [S, M, L], expected_rental_turns_per_unit 12, planned_eol_value_cents 9000, forecast_monthly_requests 8, avg_rental_days 6, planned_depth_units 3"
            - "member Nora Ellery on SIG4 completes one rental of unit AUR-GOWN-001 over 2026-08-05..2026-08-09 and the INBOUND shipment is received on 2026-08-10, leaving a ReverseLogisticsJob in RECEIVED"
            - "technician T-INSP-1 files a first inspection with soil_level LIGHT and damage_severity NONE, which moves the job to PROCESSING because the cleaning leg is required"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership-plans"
              payload: { code: "SIG4", name: "Signature 4", item_slots: 3, monthly_fee_cents: 10000, monthly_swaps_allowed: 2, shipping_cadence_days: 7, waiver_monthly_fee_cents: 1800, waiver_coverage_cents: 10000 }
              as: PlatformAdmin
              captures: { plan_sig4_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { employee_code: "T-INSP-1", full_name: "Ivo Sandoval", repair_certified: true, photography_certified: true, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_insp_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { employee_code: "T-REP-2", full_name: "Marta Lindqvist", repair_certified: true, photography_certified: true, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_rep_id: "$.data.id" }
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-001", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
            - call: "POST /members"
              payload: { membership_plan_id: "${plan_sig4_id}", email: "nora@example.com", full_name: "Nora Ellery", waiver_active: false, preferred_categories: ["GOWN", "DRESS"], size_profile: "M" }
              as: PlatformAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /reservations"
              payload: { style_id: "${style_gown_id}", requested_size: "M", requested_start_date: "2026-08-05", requested_end_date: "2026-08-09" }
              as: Member
              as_user_id: "${member_id}"
              captures: { res1_id: "$.data.id" }
            - call: "POST /shipments"
              payload: { reservation_id: "${res1_id}", direction: "OUTBOUND", planned_ship_date: "2026-08-05", carrier_reference: "OUT-2026-08-05" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
              captures: { out1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${out1_id}/dispatch"
              payload: { carrier_reference: "OUT-2026-08-05" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "POST /shipments/${out1_id}/delivery"
              payload: {}
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-09T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reservations/${res1_id}/return-initiation"
              payload: { planned_ship_date: "2026-08-09", carrier_reference: "IN-2026-08-09" }
              as: Member
              as_user_id: "${member_id}"
              captures: { in1_id: "$.data.id" }
            - call: "POST /shipments/${in1_id}/dispatch"
              payload: { carrier_reference: "IN-2026-08-09" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${in1_id}/receipt"
              payload: {}
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "GET /reverse-logistics-jobs"
              payload: { reservation_id: "${res1_id}" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
              captures: { job1_id: "$.data[0].id" }
            - call: "POST /reverse-logistics-jobs/${job1_id}/inspections"
              payload: { soil_level: "LIGHT", damage_severity: "NONE", condition_grade_after: "A", biohazard_flag: false, notes: "first pass" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
              captures: { insp1_id: "$.data.id" }
          trigger:
            - call: "POST /reverse-logistics-jobs/${job1_id}/inspections"
              payload: { soil_level: "HEAVY", damage_severity: "NONE", condition_grade_after: "B", biohazard_flag: false, notes: "second pass" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
              captures: { insp2_id: "$.data.id" }
            - call: "GET /inspections/${insp1_id}"
              payload: {}
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
            - call: "GET /inspections"
              payload: { job_id: "${job1_id}" }
              as: WarehouseTech
              as_user_id: "${tech_insp_id}"
          assert:
            - "the re-inspection returns HTTP 201 with Inspection.attempt_index == 2"
            - "the re-inspection response contains no version field and no updated_at field"
            - "GET /inspections/${insp1_id} still reports soil_level == LIGHT and condition_grade_after == A and attempt_index == 1"
            - "GET /inspections?job_id returns total_count == 2"
            - "the §1.5 endpoint table declares no PATCH, PUT or DELETE on /inspections/{inspection_id}"
      - name: entity_rental_unit_creation_under_unknown_style_returns_style_not_found
        claim_type: parent_relationships
