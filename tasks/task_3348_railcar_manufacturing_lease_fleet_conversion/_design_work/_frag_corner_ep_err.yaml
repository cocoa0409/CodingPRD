              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 1, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-11" }
