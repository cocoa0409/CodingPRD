  # =========================================================================
  # SECTION 4 — VALIDATIONS (each error_id triggerable, satisfaction passes)
  # =========================================================================
  - section: validations
    instances:
      - name: duplicate_ior_number_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "Creating a second Importer with an ior_number already used is rejected ERR_DUPLICATE (409)."
        test_recipe:
          setup:
            - "An Importer already exists with ior_number IOR-CORNER-VA01."
          setup_api_calls:
            - call: "POST /importers"
              payload: { name: "Acme Imports", ior_number: "IOR-CORNER-VA01", owner_user_id: "imp-user-1" }
              as: AccountAdmin
          trigger:
            - call: "POST /importers"
              payload: { name: "Other Imports", ior_number: "IOR-CORNER-VA01", owner_user_id: "imp-user-2" }
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE"
            - "http status == 409"

      - name: duplicate_bill_of_lading_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=13]
          - errors[ERR_DUPLICATE]
          - entities.ISFFiling.fields.bill_of_lading
        distinguishing_aspect: "Creating a second ISFFiling with a bill_of_lading already used is rejected ERR_DUPLICATE (409)."
        test_recipe:
