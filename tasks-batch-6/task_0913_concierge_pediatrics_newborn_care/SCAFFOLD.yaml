# =============================================================================
# PRD-bench seed tables: concierge-pediatrics-newborn-care (v1)
# Sections 1.0 - 1.7. The Difficulty Design (1.8) and Corner Design (1.9) live
# in SCAFFOLD_DIFFICULTY_DESIGN.yaml and SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  913. Concierge Pediatrics & Newborn Care: membership & panel, well-visit &
  immunization schedule, 24/7 access & telehealth, lactation & sleep consult,
  school/camp form, sick-visit & after-hours, sibling/family plan,
  insurance-vs-membership split

domain_name: concierge-pediatrics-newborn-care
api_prefix: /peds

# =============================================================================
# Table 1.0: Response Envelope (FIXED - emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection directly under /peds. Parenthood is
  # expressed only through FK fields, never through nested URL paths.

  state_machine_shape: parallel
  # Encounter carries two independent axes (clinical_status x billing_status).
  # Four further machines are cyclic (Membership ACTIVE<->SUSPENDED,
  # FormRequest PENDING<->BLOCKED, EntitlementGrant OPEN<->EXHAUSTED,
  # ImmunizationDose VALID<->INVALID) and ConsultBooking carries a capped
  # self-loop retry cycle.

  relationship_patterns:
    - one_to_many
    - self_referential      # ImmunizationDose.prior_valid_dose_id -> ImmunizationDose.id
    - polymorphic           # ServiceLine hangs off Encounter XOR ConsultBooking XOR WellVisit
    - cross_aggregate       # ServiceLine reaches InsurancePolicy across the Family aggregate

  role_model: segregation_of_duties
  # The BillingSpecialist who submits an Encounter's charges may not be the
  # same X-User-ID that adjudicates the resulting ServiceLine.

  consistency_model: immediate

# =============================================================================
# Declared constants
# Every constant referenced anywhere in this scaffold has its value declared
# here. Nothing in validations, calculations, or state machines may refer to a
# constant that is absent from this block.
# =============================================================================
domain_constants:

  # ---- logical clock -------------------------------------------------------
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
  # The server's logical clock reads exactly this value at startup and never
  # falls back to wall-clock time. All "current date" references below mean
  # the UTC calendar date of the logical clock.

  # ---- immunization --------------------------------------------------------
  IMMUNIZATION_GRACE_DAYS: 4
  # A dose administered up to and including 4 days before it would otherwise
  # be eligible still satisfies the rung. Comparisons are ">=", so exactly 4
  # days early passes and 5 days early fails.
  IMMUNIZATION_DUE_LAG_DAYS: 30
  # A series position counts as "required for age" once
  # min_age_days + 30 <= child.age_days (inclusive "<=").
  VACCINE_SCHEDULE:
    HEPB:
      total_doses: 3
      positions:
        - { series_index: 1, min_age_days: 0,   min_interval_days: null }
        - { series_index: 2, min_age_days: 28,  min_interval_days: 28 }
        - { series_index: 3, min_age_days: 168, min_interval_days: 56 }
    DTAP:
      total_doses: 5
      positions:
        - { series_index: 1, min_age_days: 42,   min_interval_days: null }
        - { series_index: 2, min_age_days: 70,   min_interval_days: 28 }
        - { series_index: 3, min_age_days: 98,   min_interval_days: 28 }
        - { series_index: 4, min_age_days: 365,  min_interval_days: 168 }
        - { series_index: 5, min_age_days: 1460, min_interval_days: 168 }

  # ---- well-visit periodicity ---------------------------------------------
  WELL_VISIT_SCHEDULE:
    - { milestone_code: NEWBORN, target_age_days: 5,   window_open_offset_days: 3,   window_close_offset_days: 7 }
    - { milestone_code: M1,      target_age_days: 30,  window_open_offset_days: 23,  window_close_offset_days: 44 }
    - { milestone_code: M2,      target_age_days: 61,  window_open_offset_days: 53,  window_close_offset_days: 75 }
    - { milestone_code: M4,      target_age_days: 122, window_open_offset_days: 114, window_close_offset_days: 136 }
    - { milestone_code: M6,      target_age_days: 183, window_open_offset_days: 175, window_close_offset_days: 197 }
    - { milestone_code: M9,      target_age_days: 274, window_open_offset_days: 259, window_close_offset_days: 289 }
    - { milestone_code: M12,     target_age_days: 365, window_open_offset_days: 350, window_close_offset_days: 380 }
    - { milestone_code: M24,     target_age_days: 730, window_open_offset_days: 700, window_close_offset_days: 760 }
    - { milestone_code: M36,     target_age_days: 1095, window_open_offset_days: 1065, window_close_offset_days: 1125 }
    - { milestone_code: M48,     target_age_days: 1460, window_open_offset_days: 1430, window_close_offset_days: 1490 }
    - { milestone_code: M60,     target_age_days: 1825, window_open_offset_days: 1795, window_close_offset_days: 1855 }
  WELL_VISIT_MISS_GRACE_DAYS: 30
  # A DUE or SCHEDULED WellVisit becomes MISSED only once
  # window_close_date + 30 is strictly before the current logical date, which
  # leaves a 30-day tail in which a late completion is still recordable and is
  # classified DELAYED.

  # ---- panel capacity ------------------------------------------------------
  INFANT_SLOT_WEIGHT: 2.0
  TODDLER_SLOT_WEIGHT: 1.5
  STANDARD_SLOT_WEIGHT: 1.0
  INFANT_SLOT_WEIGHT_MAX_AGE_DAYS: 365    # weight 2.0 while age_days <  365 (strict)
  TODDLER_SLOT_WEIGHT_MAX_AGE_DAYS: 1095  # weight 1.5 while 365 <= age_days < 1095 (strict upper)
  SLOT_WEIGHT_DECIMAL_PLACES: 1
  # All slot weights and panel caps carry exactly one decimal place. Capacity
  # comparisons are performed on values multiplied by 10 and rounded to the
  # nearest integer, so "4.5 <= 4.5" is exact.
  WAITLIST_ENTRY_TTL_DAYS: 90
  # A WAITING PanelWaitlistEntry expires once
  # date(entry.created_at) + 90 < current date (strict "<").

  # ---- sibling / family pricing -------------------------------------------
  SIBLING_DISCOUNT_TIER_1_PCT: 0.00   # enrollment_sequence == 1
  SIBLING_DISCOUNT_TIER_2_PCT: 0.20   # enrollment_sequence == 2
  SIBLING_DISCOUNT_TIER_3_PLUS_PCT: 0.35   # enrollment_sequence >= 3
  MONEY_ROUNDING_MODE: "round_half_up"
  MONEY_DECIMAL_PLACES: 0             # all money is integer cents
  INVOICE_DUE_DAYS: 14                # due_date = issued_date + 14 days

  # ---- entitlements --------------------------------------------------------
  MEMBERSHIP_YEAR_DAYS: 365
  # membership_year_index = floor((current_date - membership.start_date).days / 365),
  # zero-based; negative values are impossible because start_date >= current_date
  # at creation time.

  # ---- 24/7 access & after-hours ------------------------------------------
  AFTER_HOURS_EVENING_START_MINUTE: 1080   # 18:00 UTC, INCLUSIVE lower bound
  AFTER_HOURS_MORNING_END_MINUTE: 480      # 08:00 UTC, EXCLUSIVE upper bound
  AFTER_HOURS_SURCHARGE_CENTS: 7500
  DECLARED_HOLIDAY_DATES:
    - "2026-05-25"
    - "2026-07-03"
    - "2026-09-07"
    - "2026-11-26"
    - "2026-12-25"
    - "2027-01-01"
  WEEKEND_WEEKDAY_NAMES: ["SATURDAY", "SUNDAY"]

  # ---- telehealth ----------------------------------------------------------
  TELEHEALTH_PROHIBITED_ENCOUNTER_TYPES: ["NEWBORN_WEIGHT_CHECK"]
  # A newborn weight check requires a physical scale and may never be
  # conducted with modality TELEHEALTH regardless of licensure.

  # ---- scheduling geometry -------------------------------------------------
  CONSULT_TURNAROUND_BUFFER_MINUTES: 15
  # ConsultBooking intervals are half-open [scheduled_start, scheduled_end)
  # padded by 15 minutes on the trailing edge. A booking starting exactly at
  # prior_end + 15 minutes does NOT collide.
  ENCOUNTER_DEFAULT_DURATION_MINUTES: 30
  # Encounter intervals are CLOSED [started_at, started_at + 30min]. Touching
  # endpoints DO collide.
  MAX_CONCURRENT_OPEN_ENCOUNTERS_PER_CHILD: 1
  MAX_CONSULT_RESCHEDULES: 2

  # ---- school / camp forms -------------------------------------------------
  FORM_WELL_VISIT_RECENCY_DAYS: 365
  # Gate requires a COMPLETED WellVisit whose completed_date satisfies
  # current_date - 365 <= completed_date <= current_date (BOTH bounds inclusive).

  # ---- service catalog -----------------------------------------------------
  ENCOUNTER_SERVICE_CODE_MAP:
    SICK_VISIT: SICK_VISIT
    AFTER_HOURS_CONTACT: SICK_VISIT
    ROUTINE_QUESTION: TELEHEALTH_VISIT
    NEWBORN_WEIGHT_CHECK: WELL_VISIT
  SERVICE_BILLED_AMOUNT_CENTS:
    WELL_VISIT: 22000
    SICK_VISIT: 18000
    TELEHEALTH_VISIT: 12000
    AFTER_HOURS_SURCHARGE: 7500
    # LACTATION_CONSULT and SLEEP_CONSULT lines take their billed amount from
    # the plan: 0 on the ENTITLEMENT route, plan.overage_consult_fee_cents on
    # the OVERAGE route.
  MEMBERSHIP_COVERED_SERVICE_CODES: ["WELL_VISIT", "TELEHEALTH_VISIT"]
  INSURANCE_ELIGIBLE_SERVICE_CODES: ["SICK_VISIT"]

  # ---- reference plan tiers used by the design files -----------------------
  # These are ordinary MembershipPlan rows created through POST /peds/membership-plans;
  # the values below are the canonical fixtures every design recipe uses.
  REFERENCE_PLAN_ESSENTIAL: { tier: ESSENTIAL, monthly_rate_cents: 25000, included_lactation_consults: 1, included_sleep_consults: 0, form_sla_hours: 120, after_hours_surcharge_waived: false, overage_consult_fee_cents: 18000 }
  REFERENCE_PLAN_PLUS:      { tier: PLUS,      monthly_rate_cents: 40000, included_lactation_consults: 3, included_sleep_consults: 2, form_sla_hours: 72,  after_hours_surcharge_waived: false, overage_consult_fee_cents: 15000 }
  REFERENCE_PLAN_PREMIER:   { tier: PREMIER,   monthly_rate_cents: 60000, included_lactation_consults: 6, included_sleep_consults: 4, form_sla_hours: 24,  after_hours_surcharge_waived: true,  overage_consult_fee_cents: 12000 }

# =============================================================================
# List ordering contract (applies to every endpoint whose output is `X[]`)
# =============================================================================
datetime_format:
  emitted: "Every datetime the API emits - created_at, updated_at, started_at, ends_at, scheduled_start, scheduled_end, requested_at, due_at, issued_at and the clock endpoint's current_utc - is rendered as ISO 8601 UTC with exactly three fractional-second digits and a trailing Z, e.g. `2026-06-18T00:00:00.000Z`."
  accepted: "Inbound datetime fields accept ISO 8601 UTC with or without fractional digits; the server normalises to the emitted form before persisting."
  dates: "Fields typed as a calendar date - date_of_birth, start_date, cycle_start_date, administered_date, completed_date, window_open_date and friends - are rendered as bare `YYYY-MM-DD` with no time part."

list_ordering:
  sort_key: "created_at ASC"
  tie_break: "none required - the server stamps created_at with three fractional digits and guarantees strictly increasing created_at within any one collection"
  note: "Pagination applies after sorting. `total_count` counts rows matching the filters, not the page."

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:

  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - { name: tier, type: enum, source: input, description: "Plan tier", constraints: "one of ESSENTIAL, PLUS, PREMIER; unique across all MembershipPlan rows" }
      - { name: monthly_rate_cents, type: integer, source: input, description: "Undiscounted full-cycle membership fee for one child, in cents", constraints: ">= 0" }
      - { name: included_lactation_consults, type: integer, source: input, description: "Lactation consults granted per membership year", constraints: ">= 0" }
      - { name: included_sleep_consults, type: integer, source: input, description: "Sleep consults granted per membership year", constraints: ">= 0" }
      - { name: form_sla_hours, type: integer, source: input, description: "Turnaround SLA in hours for a school/camp form request on this tier", constraints: "> 0" }
      - { name: after_hours_surcharge_waived, type: boolean, source: input, description: "When true, after-hours contacts on this tier produce a zero-cent AFTER_HOURS_SURCHARGE line routed COVERED_BY_MEMBERSHIP" }
      - { name: overage_consult_fee_cents, type: integer, source: input, description: "Billed amount for a consult booked after the entitlement pool is exhausted", constraints: ">= 0" }

  - name: Physician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Physician display name" }
      - { name: panel_slot_cap, type: number, source: input, description: "Maximum weighted panel occupancy this physician may carry", constraints: "> 0; exactly one decimal place" }
      - { name: licensed_state_codes, type: array, source: input, description: "Two-letter state codes in which this physician is licensed to practise telehealth", constraints: "non-empty array of 2-character uppercase strings" }
      - { name: weighted_occupancy, type: number, source: computed, description: "Sum of slot_weight over Memberships on this physician with status IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED}, evaluated against the current logical clock date" }
      - { name: available_panel_weight, type: number, source: computed, description: "panel_slot_cap - weighted_occupancy, never below 0" }

  - name: Family
    parent: null
    common_fields: true
    fields:
      - { name: household_name, type: string, source: input, description: "Household display name" }
      - { name: family_monthly_cap_cents, type: integer, source: input, description: "Maximum total_cents any one Invoice for this family may reach after the sibling ladder is applied", constraints: ">= 0" }
      - { name: active_membership_count, type: integer, source: computed, description: "Count of Memberships for this family with status IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED}" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; the household this policy covers" }
      - { name: carrier_name, type: string, source: input, description: "Insurance carrier display name" }
      - { name: deductible_cents, type: integer, source: input, description: "Annual deductible in cents", constraints: ">= 0" }
      - { name: deductible_met_cents, type: integer, source: computed, default: 0, description: "Running total of deductible_applied_cents over ServiceLines on this policy with status IN {ADJUDICATED, SETTLED}; decreases when such a line is voided" }
      - { name: coinsurance_rate, type: number, source: input, description: "Patient coinsurance share applied after the deductible is satisfied", constraints: "0 <= coinsurance_rate <= 1" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "Policy status", constraints: "one of ACTIVE, TERMINATED; ACTIVE by default at creation, may be supplied as TERMINATED at creation, and moves ACTIVE -> TERMINATED exactly once via the terminate endpoint" }

  - name: Child
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; the household this child belongs to" }
      - { name: first_name, type: string, source: input, description: "Child's given name" }
      - { name: date_of_birth, type: string, source: input, description: "Birth date, YYYY-MM-DD", constraints: "must not be after the current logical clock date" }
      - { name: age_days, type: integer, source: computed, description: "(current logical clock date - date_of_birth) in whole days, recomputed on every read" }
      - { name: current_slot_weight, type: number, source: computed, description: "Panel slot weight this child consumes today: 2.0 while age_days < 365, 1.5 while 365 <= age_days < 1095, 1.0 when age_days >= 1095" }
      - { name: immunization_complete_for_age, type: boolean, source: computed, description: "True when, for every vaccine_code in VACCINE_SCHEDULE, the count of this child's doses with validity == VALID is >= the required-for-age dose count; see calculations.immunization_completeness_for_age" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id; the enrolled child" }
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; denormalized from Child.family_id at creation and never changed" }
      - { name: plan_id, type: string, source: input, description: "FK -> MembershipPlan.id; the tier this membership is priced on" }
      - { name: physician_id, type: string, source: input, description: "FK -> Physician.id; the panel this membership occupies" }
      - { name: start_date, type: string, source: input, description: "First covered day, YYYY-MM-DD", constraints: "current logical date <= start_date <= last day of the calendar month containing the current logical date" }
      - { name: cancellation_effective_date, type: string, source: system, default: null, description: "Last covered day once cancelled; null while the membership has never been cancelled" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "one of PENDING_ACTIVATION, ACTIVE, SUSPENDED, CANCELLED" }
      - { name: enrollment_sequence, type: integer, source: computed, description: "1-based rank of this membership among its family's memberships with status IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED}, ordered by start_date ASC then created_at ASC; recomputed on every membership create and cancel in the same family" }
      - { name: discount_pct, type: number, source: computed, description: "0.00 when enrollment_sequence == 1, 0.20 when == 2, 0.35 when >= 3" }
      - { name: monthly_rate_cents, type: integer, source: computed, description: "round_half_up(plan.monthly_rate_cents * (1 - discount_pct)) - the full-cycle discounted rate before any proration" }
      - { name: slot_weight, type: number, source: computed, description: "Panel weight this membership currently occupies; equals Child.current_slot_weight evaluated at the current logical clock date, and 0.0 once status == CANCELLED" }
      - { name: suspension_reason, type: string, source: system, default: null, description: "Free-text reason recorded on the most recent ACTIVE -> SUSPENDED transition; cleared to null on reinstate" }

  - name: PanelWaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: physician_id, type: string, source: input, description: "FK -> Physician.id; the panel being queued for" }
      - { name: child_id, type: string, source: input, description: "FK -> Child.id; the child waiting for a slot" }
      - { name: requested_plan_id, type: string, source: input, description: "FK -> MembershipPlan.id; the tier the promoted Membership will be created on" }
      - { name: promoted_membership_id, type: string, source: system, default: null, description: "FK -> Membership.id; set when this entry is promoted, null otherwise" }
      - { name: candidate_slot_weight, type: number, source: computed, description: "Child.current_slot_weight for this entry's child at the current logical clock date - the weight a promotion would consume" }
      - { name: status, type: enum, source: system, description: "Queue state", constraints: "one of WAITING, PROMOTED, WITHDRAWN, EXPIRED" }

  - name: EntitlementGrant
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; the membership this pool belongs to" }
      - { name: benefit_type, type: enum, source: system, description: "Benefit pool", constraints: "one of LACTATION_CONSULT, SLEEP_CONSULT" }
      - { name: membership_year_index, type: integer, source: system, description: "Zero-based membership year this pool covers" }
      - { name: granted_count, type: integer, source: system, description: "Units granted for this pool, copied from the plan at grant creation and frozen thereafter" }
      - { name: booked_count, type: integer, source: computed, default: 0, description: "Units currently held by ConsultBookings with status SCHEDULED and coverage_route ENTITLEMENT" }
      - { name: consumed_count, type: integer, source: computed, default: 0, description: "Units burned by ConsultBookings with status COMPLETED and coverage_route ENTITLEMENT" }
      - { name: released_count, type: integer, source: computed, default: 0, description: "Cumulative audit counter of units returned to the pool by cancellation; not a term of the conservation identity" }
      - { name: overage_count, type: integer, source: computed, default: 0, description: "Bookings created against this pool while available_count was 0; these never touch booked_count or consumed_count" }
      - { name: available_count, type: integer, source: computed, description: "granted_count - booked_count - consumed_count; never negative" }
      - { name: status, type: enum, source: system, description: "Pool state", constraints: "one of OPEN, EXHAUSTED, EXPIRED" }

  - name: ConsultBooking
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the membership consuming the benefit" }
      - { name: grant_id, type: string, source: system, description: "FK -> EntitlementGrant.id; the pool selected by consult_type and the membership year containing scheduled_start" }
      - { name: consultant_physician_id, type: string, source: input, description: "FK -> Physician.id; the clinician whose calendar this booking occupies" }
      - { name: consult_type, type: enum, source: input, description: "Benefit consumed", constraints: "one of LACTATION_CONSULT, SLEEP_CONSULT" }
      - { name: scheduled_start, type: datetime, source: input, description: "Appointment start, ISO 8601 UTC" }
      - { name: scheduled_end, type: datetime, source: input, description: "Appointment end, ISO 8601 UTC", constraints: "strictly after scheduled_start" }
      - { name: modality, type: enum, source: input, description: "Delivery mode", constraints: "one of IN_PERSON, TELEHEALTH" }
      - { name: patient_state_code, type: string, source: input, description: "Two-letter state the patient will be located in at the appointment" }
      - { name: coverage_route, type: enum, source: computed, description: "ENTITLEMENT when the pool had available_count > 0 at creation, otherwise OVERAGE", constraints: "one of ENTITLEMENT, OVERAGE" }
      - { name: reschedule_count, type: integer, source: system, default: 0, description: "Number of successful reschedules; capped at MAX_CONSULT_RESCHEDULES" }
      - { name: status, type: enum, source: system, description: "Booking state", constraints: "one of SCHEDULED, COMPLETED, CANCELLED" }

  - name: WellVisit
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; the membership whose activation generated this row" }
      - { name: child_id, type: string, source: system, description: "FK -> Child.id; denormalized from the membership" }
      - { name: milestone_code, type: enum, source: system, description: "Periodicity milestone", constraints: "one of NEWBORN, M1, M2, M4, M6, M9, M12, M24, M36, M48, M60" }
      - { name: target_date, type: string, source: system, description: "date_of_birth + target_age_days" }
      - { name: window_open_date, type: string, source: system, description: "date_of_birth + window_open_offset_days; INCLUSIVE lower bound of the on-schedule window" }
      - { name: window_close_date, type: string, source: system, description: "date_of_birth + window_close_offset_days; INCLUSIVE upper bound of the on-schedule window" }
      - { name: scheduled_date, type: string, source: system, default: null, description: "Date the visit was booked for; null until scheduled" }
      - { name: completed_date, type: string, source: system, default: null, description: "Date the visit actually happened; null until completed" }
      - { name: punctuality, type: enum, source: computed, default: null, description: "Classification of completed_date against the window", constraints: "one of EARLY, ON_SCHEDULE, DELAYED; null until completed" }
      - { name: status, type: enum, source: system, description: "Visit state", constraints: "one of DUE, SCHEDULED, COMPLETED, MISSED, CANCELLED" }

  - name: ImmunizationDose
    parent: null
    common_fields: true
    fields:
      - { name: child_id, type: string, source: input, description: "FK -> Child.id; the child who received the dose" }
      - { name: prior_valid_dose_id, type: string, source: computed, default: null, description: "FK -> ImmunizationDose.id; the nearest preceding dose of the same child and vaccine_code with validity VALID, or null when this dose sits at effective_series_index 1" }
      - { name: vaccine_code, type: enum, source: input, description: "Vaccine series", constraints: "one of HEPB, DTAP" }
      - { name: administered_date, type: string, source: input, description: "Date the dose was given, YYYY-MM-DD", constraints: "must not be after the current logical clock date" }
      - { name: age_days_at_administration, type: integer, source: computed, description: "(administered_date - child.date_of_birth) in whole days" }
      - { name: effective_series_index, type: integer, source: computed, description: "1 + count of doses of the same child and vaccine_code with validity VALID whose administered_date is strictly earlier (ties broken by created_at ASC)" }
      - { name: interval_days_since_prior, type: integer, source: computed, default: null, description: "(administered_date - prior_valid_dose.administered_date) in whole days; null when effective_series_index == 1" }
      - { name: manually_invalidated, type: boolean, source: system, default: false, description: "True once a Physician has explicitly invalidated this dose; such a dose can never return to VALID" }
      - { name: invalidation_reason_note, type: string, source: system, default: null, description: "Free-text reason recorded on an explicit invalidate call" }
      - { name: invalid_reason, type: enum, source: computed, default: null, description: "Why the dose is INVALID", constraints: "one of MIN_AGE_NOT_MET, MIN_INTERVAL_NOT_MET, SERIES_ALREADY_COMPLETE, MANUALLY_INVALIDATED; null while validity == VALID" }
      - { name: validity, type: enum, source: computed, description: "Dose validity state", constraints: "one of VALID, INVALID" }

  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the membership the contact is billed under" }
      - { name: child_id, type: string, source: system, description: "FK -> Child.id; denormalized from the membership" }
      - { name: encounter_type, type: enum, source: input, description: "Kind of contact", constraints: "one of SICK_VISIT, AFTER_HOURS_CONTACT, ROUTINE_QUESTION, NEWBORN_WEIGHT_CHECK" }
      - { name: modality, type: enum, source: input, description: "Delivery mode", constraints: "one of IN_PERSON, TELEHEALTH" }
      - { name: patient_state_code, type: string, source: input, description: "Two-letter state the patient is physically located in at started_at" }
      - { name: started_at, type: datetime, source: input, description: "Contact start, ISO 8601 UTC", constraints: "must not be after the current logical clock instant" }
      - { name: ends_at, type: datetime, source: computed, description: "started_at + ENCOUNTER_DEFAULT_DURATION_MINUTES" }
      - { name: after_hours, type: boolean, source: computed, description: "Whether started_at falls in an after-hours window; see calculations.after_hours_surcharge" }
      - { name: after_hours_reason, type: enum, source: computed, default: null, description: "Which rung classified the contact as after-hours", constraints: "one of WEEKEND, HOLIDAY, WEEKDAY_EVENING, WEEKDAY_EARLY_MORNING; null when after_hours is false" }
      - { name: surcharge_cents, type: integer, source: computed, description: "0 when after_hours is false or the plan waives it, otherwise AFTER_HOURS_SURCHARGE_CENTS" }
      - { name: clinical_status, type: enum, source: system, description: "Clinical axis - advances independently of billing_status", constraints: "one of SCHEDULED, CLINICALLY_COMPLETE, CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "Billing axis - advances independently of clinical_status", constraints: "one of BILLING_PENDING, BILLING_ROUTED, BILLING_CLOSED, BILLING_VOID" }
      - { name: clinical_note, type: string, source: system, default: null, description: "Note captured on the clinical completion call" }
      - { name: cancel_reason, type: string, source: system, default: null, description: "Reason captured on the cancel call" }

  - name: ServiceLine
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; the membership the charge belongs to" }
      - { name: encounter_id, type: string, source: system, default: null, description: "FK -> Encounter.id; set only for lines produced by encounter billing submission" }
      - { name: consult_booking_id, type: string, source: system, default: null, description: "FK -> ConsultBooking.id; set only for lines produced by consult completion" }
      - { name: well_visit_id, type: string, source: system, default: null, description: "FK -> WellVisit.id; set only for lines produced by well-visit completion" }
      - { name: policy_id, type: string, source: system, default: null, description: "FK -> InsurancePolicy.id; set only when route == BILLED_TO_INSURANCE" }
      - { name: service_code, type: enum, source: system, description: "Catalog code", constraints: "one of WELL_VISIT, SICK_VISIT, TELEHEALTH_VISIT, AFTER_HOURS_SURCHARGE, LACTATION_CONSULT, SLEEP_CONSULT" }
      - { name: route, type: enum, source: computed, description: "Exactly one financial route", constraints: "one of COVERED_BY_MEMBERSHIP, BILLED_TO_INSURANCE, PATIENT_RESPONSIBILITY" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Charge-master amount for this line" }
      - { name: allowed_amount_cents, type: integer, source: computed, default: null, description: "Carrier-allowed amount; null until adjudication on the insurance route, equal to billed_amount_cents on the other two routes" }
      - { name: write_off_cents, type: integer, source: computed, default: 0, description: "billed_amount_cents - allowed_amount_cents on the insurance route; never collectable from the patient" }
      - { name: deductible_applied_cents, type: integer, source: computed, default: 0, description: "Portion of allowed_amount_cents absorbed by the remaining deductible" }
      - { name: coinsurance_cents, type: integer, source: computed, default: 0, description: "round_half_up((allowed_amount_cents - deductible_applied_cents) * policy.coinsurance_rate)" }
      - { name: plan_paid_cents, type: integer, source: computed, default: 0, description: "allowed_amount_cents - deductible_applied_cents - coinsurance_cents" }
      - { name: patient_responsibility_cents, type: integer, source: computed, default: 0, description: "What the household owes for this line" }
      - { name: membership_covered_cents, type: integer, source: computed, default: 0, description: "Amount absorbed by the concierge membership; non-zero only on the COVERED_BY_MEMBERSHIP route" }
      - { name: payment_received_cents, type: integer, source: system, default: 0, description: "Cash applied at settlement" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the actor whose call created this line" }
      - { name: adjudicated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the actor who adjudicated this line; must differ from submitted_by_user_id" }
      - { name: status, type: enum, source: system, description: "Line state", constraints: "one of ROUTED, ADJUDICATED, SETTLED, VOID" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; the household billed" }
      - { name: cycle_start_date, type: string, source: input, description: "First day of the billed calendar month, YYYY-MM-DD", constraints: "must be the 1st day of a month; unique per family" }
      - { name: cycle_end_date, type: string, source: computed, description: "Last calendar day of the month containing cycle_start_date" }
      - { name: days_in_cycle, type: integer, source: computed, description: "Number of calendar days in the billed month" }
      - { name: lines, type: array, source: computed, description: "One object per Membership billed in this cycle, ordered by is_cancelled ASC then enrollment_sequence ASC then created_at ASC (so lines for memberships still occupying the panel come first and cancelled-mid-cycle lines come last); each object carries membership_id, child_id, enrollment_sequence, base_rate_cents, discount_pct, monthly_rate_cents, covered_days, prorated_cents, cap_adjustment_cents, line_total_cents" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of prorated_cents over lines, computed AFTER each line is rounded to whole cents" }
      - { name: cap_adjustment_cents, type: integer, source: computed, default: 0, description: "max(0, subtotal_cents - family.family_monthly_cap_cents)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - cap_adjustment_cents" }
      - { name: issued_date, type: string, source: system, default: null, description: "Logical clock date on which the invoice was issued" }
      - { name: due_date, type: string, source: system, default: null, description: "issued_date + INVOICE_DUE_DAYS" }
      - { name: paid_date, type: string, source: system, default: null, description: "Logical clock date on which the invoice was paid in full" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Cash applied against this invoice" }
      - { name: status, type: enum, source: system, description: "Invoice state", constraints: "one of DRAFT, ISSUED, PAID" }

  - name: FormRequest
    parent: null
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the membership the form is requested under" }
      - { name: child_id, type: string, source: system, description: "FK -> Child.id; denormalized from the membership" }
      - { name: form_type, type: enum, source: input, description: "Kind of form", constraints: "one of SCHOOL, CAMP, SPORTS" }
      - { name: needed_by_date, type: string, source: input, description: "Date the household needs the form by, YYYY-MM-DD" }
      - { name: requested_at, type: datetime, source: system, description: "Logical clock instant of the create call" }
      - { name: due_at, type: datetime, source: computed, description: "requested_at + plan.form_sla_hours hours" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Logical clock instant the form was issued" }
      - { name: sla_met, type: boolean, source: computed, default: null, description: "issued_at <= due_at (inclusive); null until issued" }
      - { name: blocked_reason, type: enum, source: computed, default: null, description: "First failing gate rung", constraints: "one of MEMBERSHIP_NOT_ACTIVE, IMMUNIZATION_INCOMPLETE, WELL_VISIT_STALE; null unless status == BLOCKED" }
      - { name: status, type: enum, source: system, description: "Request state", constraints: "one of PENDING, BLOCKED, ISSUED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Membership
  # Shape: CYCLIC. ACTIVE -> SUSPENDED -> ACTIVE is a genuine two-node loop.
  - entity: Membership
    initial_state: PENDING_ACTIVATION
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "system, inside POST /peds/invoices/{invoice_id}/pay"
        actor: system
        preconditions:
          - "the paid Invoice belongs to this membership's family_id"
          - "membership.start_date falls between invoice.cycle_start_date and invoice.cycle_end_date, both bounds inclusive"
          - "membership.status == PENDING_ACTIVATION"
        side_effects:
          - "Membership.status := ACTIVE"
          - "Membership.version increments by 1"
          - "no change to Physician.weighted_occupancy - the slot was already occupied while PENDING_ACTIVATION"
        note: "Cross-entity gate: activation is impossible without the family's cycle Invoice reaching PAID."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /peds/memberships/{membership_id}/suspend"
        actor: PracticeAdmin | BillingSpecialist
        preconditions:
          - "membership.status == ACTIVE"
          - "the membership's family has at least one Invoice with status == ISSUED whose due_date is strictly before the current logical clock date"
        side_effects:
          - "Membership.status := SUSPENDED"
          - "Membership.suspension_reason := request body reason"
          - "the membership keeps its panel slot weight, so Physician.weighted_occupancy is unchanged"
          - "the membership keeps its invoice line, so no DRAFT Invoice is recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /peds/memberships/{membership_id}/reinstate"
        actor: PracticeAdmin | BillingSpecialist
        preconditions:
          - "membership.status == SUSPENDED"
          - "the membership's family has zero Invoices with status == ISSUED whose due_date is strictly before the current logical clock date"
        side_effects:
          - "Membership.status := ACTIVE"
          - "Membership.suspension_reason := null"
        note: "Closes the ACTIVE <-> SUSPENDED cycle; a membership may traverse it any number of times."

      - from: PENDING_ACTIVATION
        to: CANCELLED
        trigger: "POST /peds/memberships/{membership_id}/cancel"
        actor: PracticeAdmin | CareCoordinator
        preconditions:
          - "expected_family_version equals Family.version"
          - "membership.start_date <= effective_date"
          - "current logical date <= effective_date <= last day of the calendar month containing the current logical date"
        side_effects:
          - "identical to the ACTIVE -> CANCELLED transition below"

      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /peds/memberships/{membership_id}/cancel"
        actor: PracticeAdmin | CareCoordinator
        preconditions:
          - "expected_family_version equals Family.version"
          - "membership.start_date <= effective_date"
          - "current logical date <= effective_date <= last day of the calendar month containing the current logical date"
        side_effects:
          - "identical to the ACTIVE -> CANCELLED transition below"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /peds/memberships/{membership_id}/cancel"
        actor: PracticeAdmin | CareCoordinator
        preconditions:
          - "expected_family_version equals Family.version"
          - "membership.start_date <= effective_date"
          - "current logical date <= effective_date <= last day of the calendar month containing the current logical date"
        side_effects:
          # ---- CASCADE A, hop 0 (the direct write) --------------------------
          - "Membership.status := CANCELLED; Membership.cancellation_effective_date := effective_date; Membership.slot_weight := 0.0"
          - "Family.version increments by 1"
          # ---- direct fan-out legs (NOT part of the causal chain) ------------
          - "every sibling Membership of the same family is re-sequenced and re-priced: enrollment_sequence, discount_pct and monthly_rate_cents are recomputed per calculations.sibling_ladder_rate"
          - "every Invoice of this family with status == DRAFT is recomputed per calculations.family_invoice_total, using the cancellation_proration variant for this membership's line; Invoices with status IN {ISSUED, PAID} are NOT touched"
          - "every EntitlementGrant of this membership with status IN {OPEN, EXHAUSTED} transitions to EXPIRED; consumed_count is NOT released, only booked_count is"
          - "every ConsultBooking of this membership with status == SCHEDULED transitions to CANCELLED (which releases its entitlement hold)"
          - "every WellVisit of this membership with status IN {DUE, SCHEDULED} transitions to CANCELLED; WellVisits with status IN {COMPLETED, MISSED} are NOT touched"
          - "every FormRequest of this membership with status == PENDING transitions to BLOCKED with blocked_reason MEMBERSHIP_NOT_ACTIVE; FormRequests with status == ISSUED are NOT touched"
          - "every Encounter of this membership with clinical_status == SCHEDULED transitions to clinical_status CANCELLED and billing_status BILLING_VOID; Encounters with clinical_status == CLINICALLY_COMPLETE are NOT touched and their ServiceLines are NOT voided"
          # ---- CASCADE A, hop 1: caused by the membership leaving the panel --
          - "hop 1 - because the membership left the occupancy set, Physician.weighted_occupancy is recomputed and drops by the membership's former slot_weight; Physician.available_panel_weight rises by the same amount"
          # ---- CASCADE A, hop 2: caused by the freed weight ------------------
          - "hop 2 - because available_panel_weight rose, the promotion selector runs on that physician: among PanelWaitlistEntry rows with status == WAITING and physician_id == this physician, ordered by created_at ASC, the FIRST row whose candidate_slot_weight <= available_panel_weight transitions WAITING -> PROMOTED; rows earlier in the order that do not fit are skipped and stay WAITING; if no row fits, no promotion occurs and hops 3-4 do not fire"
          # ---- CASCADE A, hop 3: caused by the promotion ---------------------
          - "hop 3 - because the entry was promoted, a new Membership is created for entry.child_id with plan_id = entry.requested_plan_id, physician_id = entry.physician_id, start_date = the current logical clock date, status PENDING_ACTIVATION; the entry's promoted_membership_id is set to the new Membership.id and the promoted child's Family.version increments by 1"
          # ---- CASCADE A, hop 4: caused by the new membership ----------------
          - "hop 4 - because the new Membership was created, its EntitlementGrant rows (one per benefit_type at membership_year_index 0) and its WellVisit rows (one per applicable milestone per calculations.well_visit_schedule_generation) are generated, and the promoted child's family gains or updates a DRAFT Invoice for the current cycle carrying the new enrollment-prorated line"
        note: "CASCADE A - depth 4 causal chain Membership -> Physician -> PanelWaitlistEntry -> Membership -> {EntitlementGrant, WellVisit, Invoice}. The legs listed above hop 1 are direct fan-out, not chain links."

  # ---------------------------------------------------------- InsurancePolicy
  - entity: InsurancePolicy
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /peds/insurance-policies/{policy_id}/terminate"
        actor: PracticeAdmin | BillingSpecialist
        preconditions:
          - "policy.status == ACTIVE"
        side_effects:
          - "InsurancePolicy.status := TERMINATED; InsurancePolicy.version increments by 1"
          - "ServiceLines already routed BILLED_TO_INSURANCE against this policy keep their policy_id and their status, but can no longer be adjudicated"
          - "future SICK_VISIT lines for this family route PATIENT_RESPONSIBILITY because the ACTIVE-policy candidate set is now empty"
          - "deductible_met_cents is NOT reset"

  # ---------------------------------------------------------- PanelWaitlistEntry
  - entity: PanelWaitlistEntry
    initial_state: WAITING
    terminal_states: [PROMOTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: WAITING
        to: PROMOTED
        trigger: "system, inside POST /peds/memberships/{membership_id}/cancel (CASCADE A hop 2)"
        actor: system
        preconditions:
          - "entry.status == WAITING"
          - "entry.candidate_slot_weight <= Physician.available_panel_weight measured after the cancelling membership's weight has been released"
          - "the entry is the earliest-created WAITING row on that physician that satisfies the weight test"
        side_effects:
          - "PanelWaitlistEntry.status := PROMOTED"
          - "PanelWaitlistEntry.promoted_membership_id := id of the Membership created by CASCADE A hop 3"

      - from: WAITING
        to: WITHDRAWN
        trigger: "POST /peds/panel-waitlist-entries/{waitlist_entry_id}/withdraw"
        actor: PracticeAdmin | CareCoordinator | Parent
        preconditions:
          - "entry.status == WAITING"
        side_effects:
          - "PanelWaitlistEntry.status := WITHDRAWN"
          - "the entry is removed from all future promotion selectors"

      - from: WAITING
        to: EXPIRED
        trigger: "system, inside POST /peds/_clock/set_current_utc"
        actor: system
        preconditions:
          - "entry.status == WAITING"
          - "date(entry.created_at) + WAITLIST_ENTRY_TTL_DAYS is strictly before the new current logical date"
        side_effects:
          - "PanelWaitlistEntry.status := EXPIRED"

  # ------------------------------------------------------------------- Invoice
  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /peds/invoices/{invoice_id}/issue"
        actor: BillingSpecialist | PracticeAdmin
        preconditions:
          - "invoice.status == DRAFT"
          - "invoice.lines is non-empty"
        side_effects:
          - "Invoice.status := ISSUED; Invoice.issued_date := current logical date; Invoice.due_date := issued_date + INVOICE_DUE_DAYS"
          - "the invoice is frozen: subsequent membership creates and cancels in this family no longer recompute its lines"

      - from: ISSUED
        to: PAID
        trigger: "POST /peds/invoices/{invoice_id}/pay"
        actor: BillingSpecialist | PracticeAdmin
        preconditions:
          - "invoice.status == ISSUED"
          - "amount_paid_cents == invoice.total_cents (exact settlement only; partial payment is rejected)"
        side_effects:
          - "Invoice.status := PAID; Invoice.amount_paid_cents := amount_paid_cents; Invoice.paid_date := current logical date"
          - "every Membership of this family with status == PENDING_ACTIVATION whose start_date lies within the invoice cycle transitions PENDING_ACTIVATION -> ACTIVE"

  # -------------------------------------------------------- EntitlementGrant
  # Shape: CYCLIC. OPEN -> EXHAUSTED -> OPEN whenever a hold is released.
  - entity: EntitlementGrant
    initial_state: OPEN
    terminal_states: [EXPIRED]
    transitions:
      - from: OPEN
        to: EXHAUSTED
        trigger: "system, inside POST /peds/consult-bookings or POST /peds/consult-bookings/{booking_id}/complete"
        actor: system
        preconditions:
          - "available_count reaches 0 after the counter update in the same request"
        side_effects:
          - "EntitlementGrant.status := EXHAUSTED"
          - "subsequent bookings against this pool are created with coverage_route OVERAGE and increment overage_count"
        note: "A grant created with granted_count == 0 is EXHAUSTED from its first read; the OPEN -> EXHAUSTED edge fires inside the creating request."

      - from: EXHAUSTED
        to: OPEN
        trigger: "system, inside POST /peds/consult-bookings/{booking_id}/cancel"
        actor: system
        preconditions:
          - "the cancelled booking had coverage_route == ENTITLEMENT"
          - "available_count becomes strictly greater than 0 after booked_count is decremented"
        side_effects:
          - "EntitlementGrant.status := OPEN"
        note: "Closes the OPEN <-> EXHAUSTED cycle."

      - from: OPEN
        to: EXPIRED
        trigger: "system, inside POST /peds/memberships/{membership_id}/cancel"
        actor: system
        preconditions:
          - "the owning membership transitioned to CANCELLED"
        side_effects:
          - "EntitlementGrant.status := EXPIRED"
          - "booked_count is driven to 0 as the SCHEDULED bookings cancel; consumed_count is preserved"

      - from: EXHAUSTED
        to: EXPIRED
        trigger: "system, inside POST /peds/memberships/{membership_id}/cancel"
        actor: system
        preconditions:
          - "the owning membership transitioned to CANCELLED"
        side_effects:
          - "EntitlementGrant.status := EXPIRED"

  # ---------------------------------------------------------- ConsultBooking
  # Shape: CAPPED RETRY LOOP. SCHEDULED -> SCHEDULED, at most
  # MAX_CONSULT_RESCHEDULES times.
  - entity: ConsultBooking
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /peds/consult-bookings/{booking_id}/reschedule"
        actor: CareCoordinator | PracticeAdmin | Parent
        preconditions:
          - "booking.status == SCHEDULED"
          - "booking.reschedule_count < MAX_CONSULT_RESCHEDULES"
          - "the new interval clears the consultant's calendar per validations priority 30"
          - "the owning Membership.status == ACTIVE"
        side_effects:
          - "ConsultBooking.scheduled_start and scheduled_end := the new interval"
          - "ConsultBooking.reschedule_count increments by 1"
          - "the entitlement hold is unchanged - grant.booked_count does not move"
        note: "Self-loop; the third attempt is rejected with ERR_RESCHEDULE_LIMIT_REACHED."

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /peds/consult-bookings/{booking_id}/complete"
        actor: CareCoordinator | PracticeAdmin | Physician
        preconditions:
          - "booking.status == SCHEDULED"
          - "booking.scheduled_end is not after the current logical clock instant"
        side_effects:
          - "ConsultBooking.status := COMPLETED"
          - "when coverage_route == ENTITLEMENT: grant.booked_count decrements by 1 and grant.consumed_count increments by 1 (available_count is unchanged, so the grant's status does not move)"
          - "when coverage_route == OVERAGE: no grant counter moves"
          - "a ServiceLine is created with consult_booking_id set, service_code equal to consult_type, route COVERED_BY_MEMBERSHIP and billed_amount_cents 0 on the ENTITLEMENT route, or route PATIENT_RESPONSIBILITY and billed_amount_cents = plan.overage_consult_fee_cents on the OVERAGE route; the line is created directly in status SETTLED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /peds/consult-bookings/{booking_id}/cancel"
        actor: CareCoordinator | PracticeAdmin | Parent
        preconditions:
          - "booking.status == SCHEDULED"
        side_effects:
          # ---- CASCADE C, hop 0 -> hop 2 ------------------------------------
          - "ConsultBooking.status := CANCELLED"
          - "hop 1 - because the booking released its hold, when coverage_route == ENTITLEMENT grant.booked_count decrements by 1, grant.released_count increments by 1 and grant.available_count rises by 1; when coverage_route == OVERAGE grant.overage_count decrements by 1 and no other counter moves"
          - "hop 2 - because available_count became strictly positive, an EXHAUSTED grant transitions back to OPEN"
          - "no ServiceLine is created"
        note: "CASCADE C - depth 2 causal chain ConsultBooking -> EntitlementGrant counters -> EntitlementGrant status."

  # ---------------------------------------------------------------- WellVisit
  - entity: WellVisit
    initial_state: DUE
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: DUE
        to: SCHEDULED
        trigger: "POST /peds/well-visits/{well_visit_id}/schedule"
        actor: CareCoordinator | PracticeAdmin
        preconditions:
          - "wellvisit.status == DUE"
          - "the owning Membership.status IN {PENDING_ACTIVATION, ACTIVE}"
          - "scheduled_date is not before the current logical clock date"
        side_effects:
          - "WellVisit.status := SCHEDULED; WellVisit.scheduled_date := scheduled_date"

      - from: DUE
        to: COMPLETED
        trigger: "POST /peds/well-visits/{well_visit_id}/complete"
        actor: Physician | PracticeAdmin
        preconditions:
          - "wellvisit.status == DUE"
          - "the owning Membership.status == ACTIVE"
          - "completed_date is not after the current logical clock date"
        side_effects:
          - "identical to the SCHEDULED -> COMPLETED transition below"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /peds/well-visits/{well_visit_id}/complete"
        actor: Physician | PracticeAdmin
        preconditions:
          - "wellvisit.status == SCHEDULED"
          - "the owning Membership.status == ACTIVE"
          - "completed_date is not after the current logical clock date"
        side_effects:
          - "WellVisit.status := COMPLETED; WellVisit.completed_date := completed_date"
          - "WellVisit.punctuality := calculations.well_visit_punctuality applied to completed_date"
          - "a ServiceLine is created with well_visit_id set, service_code WELL_VISIT, route COVERED_BY_MEMBERSHIP, billed_amount_cents 22000, membership_covered_cents 22000, patient_responsibility_cents 0, created directly in status SETTLED"

      - from: DUE
        to: MISSED
        trigger: "system, inside POST /peds/_clock/set_current_utc"
        actor: system
        preconditions:
          - "wellvisit.status IN {DUE, SCHEDULED}"
          - "wellvisit.window_close_date plus WELL_VISIT_MISS_GRACE_DAYS is strictly before the new current logical date"
        side_effects:
          - "WellVisit.status := MISSED"

      - from: SCHEDULED
        to: MISSED
        trigger: "system, inside POST /peds/_clock/set_current_utc"
        actor: system
        preconditions:
          - "wellvisit.status IN {DUE, SCHEDULED}"
          - "wellvisit.window_close_date plus WELL_VISIT_MISS_GRACE_DAYS is strictly before the new current logical date"
        side_effects:
          - "WellVisit.status := MISSED"

      - from: DUE
        to: CANCELLED
        trigger: "system, inside POST /peds/memberships/{membership_id}/cancel"
        actor: system
        preconditions:
          - "the owning membership transitioned to CANCELLED"
        side_effects:
          - "WellVisit.status := CANCELLED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system, inside POST /peds/memberships/{membership_id}/cancel"
        actor: system
        preconditions:
          - "the owning membership transitioned to CANCELLED"
        side_effects:
          - "WellVisit.status := CANCELLED"

  # --------------------------------------------------------- ImmunizationDose
  # Shape: CYCLIC. VALID <-> INVALID; a re-evaluation may move a dose either
  # way, except that a manually invalidated dose can never return to VALID.
  - entity: ImmunizationDose
    initial_state: VALID
    terminal_states: []
    transitions:
      - from: VALID
        to: INVALID
        trigger: "system, inside POST /peds/immunization-doses (evaluation at creation)"
        actor: system
        preconditions:
          - "the dose fails the age rung or the interval rung of calculations.immunization_dose_validity, or its effective_series_index exceeds the vaccine's total_doses"
        side_effects:
          - "ImmunizationDose.validity := INVALID and invalid_reason := MIN_AGE_NOT_MET, MIN_INTERVAL_NOT_MET or SERIES_ALREADY_COMPLETE"
          - "the dose is excluded from every future VALID-dose count, so the remaining series shifts"
          - "Child.immunization_complete_for_age is recomputed"

      - from: VALID
        to: INVALID
        trigger: "POST /peds/immunization-doses/{dose_id}/invalidate"
        actor: Physician | PracticeAdmin
        preconditions:
          - "dose.validity == VALID"
        side_effects:
          # ---- CASCADE B, hop 0 --------------------------------------------
          - "ImmunizationDose.validity := INVALID; invalid_reason := MANUALLY_INVALIDATED; manually_invalidated := true; invalidation_reason_note := request body reason"
          # ---- CASCADE B, hop 1 --------------------------------------------
          - "hop 1 - because this dose left the VALID set, every dose of the same child and vaccine_code with a strictly later administered_date is re-evaluated in administered_date ASC, created_at ASC order: effective_series_index, prior_valid_dose_id, interval_days_since_prior, validity and invalid_reason are recomputed; a dose may flip INVALID -> VALID as well as VALID -> INVALID, except that manually_invalidated doses stay INVALID"
          # ---- CASCADE B, hop 2 --------------------------------------------
          - "hop 2 - because the child's VALID dose counts changed, Child.immunization_complete_for_age is recomputed"
          # ---- CASCADE B, hop 3 --------------------------------------------
          - "hop 3 - because immunization_complete_for_age became false, every FormRequest of this child with status == PENDING transitions PENDING -> BLOCKED with blocked_reason IMMUNIZATION_INCOMPLETE; FormRequests with status == ISSUED are NOT touched and no already-issued form is revoked"
        note: "CASCADE B - depth 4 causal chain ImmunizationDose -> ImmunizationDose -> Child -> FormRequest."

      - from: INVALID
        to: VALID
        trigger: "system, re-evaluation inside POST /peds/immunization-doses/{dose_id}/invalidate or POST /peds/immunization-doses"
        actor: system
        preconditions:
          - "dose.manually_invalidated == false"
          - "the recomputed effective_series_index now satisfies both the age rung and the interval rung"
        side_effects:
          - "ImmunizationDose.validity := VALID; invalid_reason := null"
          - "Child.immunization_complete_for_age is recomputed"
        note: "Closes the VALID <-> INVALID cycle: shifting the series can rehabilitate a previously invalid dose."

      - from: INVALID
        to: INVALID
        trigger: "system, re-evaluation"
        actor: system
        preconditions:
          - "the recomputed rungs still fail, or manually_invalidated == true"
        side_effects:
          - "invalid_reason may change between MIN_AGE_NOT_MET, MIN_INTERVAL_NOT_MET and SERIES_ALREADY_COMPLETE; MANUALLY_INVALIDATED never changes"

  # ---------------------------------------------------------------- Encounter
  # Shape: PARALLEL AXES. clinical_status and billing_status advance
  # independently; neither axis gates the other except through cancellation.
  - entity: Encounter
    initial_state: SCHEDULED
    terminal_states: [CLINICALLY_COMPLETE, CANCELLED]
    transitions:
      # ---- clinical axis ---------------------------------------------------
      - from: SCHEDULED
        to: CLINICALLY_COMPLETE
        trigger: "POST /peds/encounters/{encounter_id}/complete-clinical"
        actor: Physician | PracticeAdmin
        preconditions:
          - "encounter.clinical_status == SCHEDULED"
        side_effects:
          - "Encounter.clinical_status := CLINICALLY_COMPLETE; Encounter.clinical_note := request body clinical_note"
          - "billing_status is NOT read and NOT changed - the billing axis may already be BILLING_ROUTED or still BILLING_PENDING"
          - "the encounter leaves the open-encounter overlap set for its child"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /peds/encounters/{encounter_id}/cancel"
        actor: CareCoordinator | PracticeAdmin | Physician
        preconditions:
          - "encounter.clinical_status IN {SCHEDULED, CLINICALLY_COMPLETE}"
          - "encounter.billing_status IN {BILLING_PENDING, BILLING_ROUTED}"
        side_effects:
          - "identical to the CLINICALLY_COMPLETE -> CANCELLED transition below"

      - from: CLINICALLY_COMPLETE
        to: CANCELLED
        trigger: "POST /peds/encounters/{encounter_id}/cancel"
        actor: CareCoordinator | PracticeAdmin | Physician
        preconditions:
          - "encounter.clinical_status IN {SCHEDULED, CLINICALLY_COMPLETE}"
          - "encounter.billing_status IN {BILLING_PENDING, BILLING_ROUTED}"
        side_effects:
          - "Encounter.clinical_status := CANCELLED; Encounter.cancel_reason := request body reason; Encounter.billing_status := BILLING_VOID"
          - "every ServiceLine of this encounter with status IN {ROUTED, ADJUDICATED} transitions to VOID"
          - "for each voided line whose route == BILLED_TO_INSURANCE and whose status was ADJUDICATED, policy.deductible_met_cents decreases by that line's deductible_applied_cents and InsurancePolicy.version increments by 1 - this is the compensating action that restores the deductible conservation identity"
          - "ServiceLines already in status SETTLED are NOT voided and their deductible contribution is NOT reversed"

      # ---- billing axis ----------------------------------------------------
      - from: BILLING_PENDING
        to: BILLING_ROUTED
        trigger: "POST /peds/encounters/{encounter_id}/submit-billing"
        actor: BillingSpecialist | PracticeAdmin
        preconditions:
          - "encounter.billing_status == BILLING_PENDING"
          - "clinical_status is NOT read - billing may be submitted before or after clinical completion"
        side_effects:
          - "Encounter.billing_status := BILLING_ROUTED"
          - "a primary ServiceLine is created with service_code = ENCOUNTER_SERVICE_CODE_MAP[encounter_type], billed_amount_cents = SERVICE_BILLED_AMOUNT_CENTS[service_code], submitted_by_user_id = X-User-ID, and route assigned per calculations.service_line_route_assignment"
          - "when encounter.after_hours is true a second ServiceLine with service_code AFTER_HOURS_SURCHARGE is also created: route COVERED_BY_MEMBERSHIP with billed_amount_cents 0 when plan.after_hours_surcharge_waived is true, otherwise route PATIENT_RESPONSIBILITY with billed_amount_cents 7500"
          - "lines routed COVERED_BY_MEMBERSHIP or PATIENT_RESPONSIBILITY are created directly in status SETTLED; lines routed BILLED_TO_INSURANCE are created in status ROUTED with policy_id set"

      - from: BILLING_ROUTED
        to: BILLING_CLOSED
        trigger: "system, evaluated at the end of ANY request that leaves every ServiceLine of this encounter in a terminal status - POST /peds/encounters/{encounter_id}/submit-billing when all created lines are born SETTLED, and POST /peds/service-lines/{service_line_id}/settle when the last insurance line settles"
        actor: system
        preconditions:
          - "encounter.billing_status == BILLING_ROUTED"
          - "the encounter has at least one ServiceLine and every one of them has status IN {SETTLED, VOID}"
        side_effects:
          - "Encounter.billing_status := BILLING_CLOSED"
        note: "Bubble-up: the parent's billing axis is derived from the aggregate state of its ServiceLine children. A membership-routed or patient-routed encounter therefore reads BILLING_CLOSED in the very response of its submit-billing call, while an insurance-routed encounter stops at BILLING_ROUTED until settlement."

      - from: BILLING_ROUTED
        to: BILLING_VOID
        trigger: "POST /peds/encounters/{encounter_id}/cancel"
        actor: CareCoordinator | PracticeAdmin | Physician
        preconditions:
          - "encounter.billing_status IN {BILLING_PENDING, BILLING_ROUTED}"
        side_effects:
          - "Encounter.billing_status := BILLING_VOID together with the ServiceLine voiding described on the clinical cancel transition"

      - from: BILLING_PENDING
        to: BILLING_VOID
        trigger: "POST /peds/encounters/{encounter_id}/cancel"
        actor: CareCoordinator | PracticeAdmin | Physician
        preconditions:
          - "encounter.billing_status IN {BILLING_PENDING, BILLING_ROUTED}"
        side_effects:
          - "Encounter.billing_status := BILLING_VOID; no ServiceLine exists yet so nothing is voided"

  # -------------------------------------------------------------- ServiceLine
  # Shape: BRANCHING with divergent side-effect sets per route.
  - entity: ServiceLine
    initial_state: ROUTED
    terminal_states: [SETTLED, VOID]
    transitions:
      - from: ROUTED
        to: SETTLED
        trigger: "system, at line creation when route IN {COVERED_BY_MEMBERSHIP, PATIENT_RESPONSIBILITY}"
        actor: system
        preconditions:
          - "route != BILLED_TO_INSURANCE"
        side_effects:
          - "allowed_amount_cents := billed_amount_cents; write_off_cents := 0"
          - "on COVERED_BY_MEMBERSHIP: membership_covered_cents := billed_amount_cents and patient_responsibility_cents := 0"
          - "on PATIENT_RESPONSIBILITY: patient_responsibility_cents := billed_amount_cents and membership_covered_cents := 0"
          - "policy_id stays null and InsurancePolicy.deductible_met_cents is NOT touched"

      - from: ROUTED
        to: ADJUDICATED
        trigger: "POST /peds/service-lines/{service_line_id}/adjudicate"
        actor: BillingSpecialist | PracticeAdmin
        preconditions:
          - "line.status == ROUTED"
          - "line.route == BILLED_TO_INSURANCE"
          - "the line's InsurancePolicy.status == ACTIVE"
          - "expected_policy_version equals InsurancePolicy.version"
          - "X-User-ID differs from line.submitted_by_user_id"
          - "0 <= allowed_amount_cents <= line.billed_amount_cents"
        side_effects:
          - "the deductible-then-coinsurance variant of calculations.service_line_financial_split runs and writes allowed_amount_cents, write_off_cents, deductible_applied_cents, coinsurance_cents, plan_paid_cents and patient_responsibility_cents"
          - "ServiceLine.status := ADJUDICATED; ServiceLine.adjudicated_by_user_id := X-User-ID"
          - "InsurancePolicy.deductible_met_cents increases by deductible_applied_cents and InsurancePolicy.version increments by 1"

      - from: ADJUDICATED
        to: SETTLED
        trigger: "POST /peds/service-lines/{service_line_id}/settle"
        actor: BillingSpecialist | PracticeAdmin
        preconditions:
          - "line.status == ADJUDICATED"
          - "payment_received_cents == line.patient_responsibility_cents (exact settlement only)"
        side_effects:
          - "ServiceLine.status := SETTLED; ServiceLine.payment_received_cents := payment_received_cents"
          - "when every ServiceLine of the parent Encounter is now IN {SETTLED, VOID}, the Encounter's billing axis bubbles up to BILLING_CLOSED"

      - from: ROUTED
        to: VOID
        trigger: "system, inside POST /peds/encounters/{encounter_id}/cancel"
        actor: system
        preconditions:
          - "the parent Encounter transitioned to clinical_status CANCELLED"
        side_effects:
          - "ServiceLine.status := VOID; no deductible reversal is needed because nothing was consumed"

      - from: ADJUDICATED
        to: VOID
        trigger: "system, inside POST /peds/encounters/{encounter_id}/cancel"
        actor: system
        preconditions:
          - "the parent Encounter transitioned to clinical_status CANCELLED"
        side_effects:
          - "ServiceLine.status := VOID"
          - "InsurancePolicy.deductible_met_cents decreases by this line's deductible_applied_cents and InsurancePolicy.version increments by 1"

  # -------------------------------------------------------------- FormRequest
  # Shape: CYCLIC. PENDING <-> BLOCKED; a blocked request re-enters the queue
  # once the gate is satisfied.
  - entity: FormRequest
    initial_state: PENDING
    terminal_states: [ISSUED]
    transitions:
      - from: PENDING
        to: BLOCKED
        trigger: "system, inside POST /peds/form-requests (gate evaluation at creation)"
        actor: system
        preconditions:
          - "calculations.form_issuance_gate returns a failing rung"
        side_effects:
          - "FormRequest.status := BLOCKED; FormRequest.blocked_reason := the first failing rung"
        note: "The create call still returns 201; a failing gate produces a BLOCKED row rather than an error."

      - from: PENDING
        to: BLOCKED
        trigger: "POST /peds/form-requests/{form_request_id}/issue (gate re-evaluation fails)"
        actor: Physician | PracticeAdmin
        preconditions:
          - "form.status == PENDING"
          - "calculations.form_issuance_gate now returns a failing rung"
        side_effects:
          - "FormRequest.status := BLOCKED; FormRequest.blocked_reason := the first failing rung"
          - "no form is issued and the call returns 200 with the BLOCKED row"

      - from: PENDING
        to: BLOCKED
        trigger: "system, inside POST /peds/memberships/{membership_id}/cancel or POST /peds/immunization-doses/{dose_id}/invalidate"
        actor: system
        preconditions:
          - "form.status == PENDING"
        side_effects:
          - "FormRequest.status := BLOCKED; blocked_reason := MEMBERSHIP_NOT_ACTIVE for the cancel path, IMMUNIZATION_INCOMPLETE for the invalidate path"

      - from: BLOCKED
        to: PENDING
        trigger: "POST /peds/form-requests/{form_request_id}/recheck"
        actor: CareCoordinator | PracticeAdmin | Physician
        preconditions:
          - "form.status == BLOCKED"
          - "calculations.form_issuance_gate now passes every rung"
        side_effects:
          - "FormRequest.status := PENDING; FormRequest.blocked_reason := null"
        note: "Closes the PENDING <-> BLOCKED cycle; a request may traverse it any number of times."

      - from: BLOCKED
        to: BLOCKED
        trigger: "POST /peds/form-requests/{form_request_id}/recheck"
        actor: CareCoordinator | PracticeAdmin | Physician
        preconditions:
          - "form.status == BLOCKED"
          - "calculations.form_issuance_gate still returns a failing rung"
        side_effects:
          - "FormRequest.blocked_reason := the first failing rung of the fresh evaluation, which may differ from the previous value"

      - from: PENDING
        to: ISSUED
        trigger: "POST /peds/form-requests/{form_request_id}/issue"
        actor: Physician | PracticeAdmin
        preconditions:
          - "form.status == PENDING"
          - "calculations.form_issuance_gate passes every rung"
        side_effects:
          - "FormRequest.status := ISSUED; FormRequest.issued_at := current logical clock instant; FormRequest.sla_met := issued_at <= due_at (inclusive)"
          - "no ServiceLine is created - school and camp forms are always absorbed by the membership"

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:

  - rule_id: enroll-membership-stale-family
    parent_entity: Family
    write_endpoint: "POST /peds/memberships"
    occ_field: "expected_family_version"
    description: |
      Enrolling a child legitimately supersedes the family's whole pricing
      ladder: every sibling membership is re-sequenced, re-discounted and
      re-prorated, and the family's DRAFT invoice is rewritten. A caller whose
      expected_family_version is behind Family.version has priced the
      enrollment against a superseded ladder, so the create is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: cancel-membership-stale-family
    parent_entity: Family
    write_endpoint: "POST /peds/memberships/{membership_id}/cancel"
    occ_field: "expected_family_version"
    description: |
      Cancelling a membership shifts every remaining sibling one rung up the
      discount ladder and rewrites the family's DRAFT invoice. A caller whose
      expected_family_version is behind Family.version is cancelling against a
      ladder that has already moved, so the cancel is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: adjudicate-line-stale-policy
    parent_entity: InsurancePolicy
    write_endpoint: "POST /peds/service-lines/{service_line_id}/adjudicate"
    occ_field: "expected_policy_version"
    description: |
      Adjudication consumes the policy's remaining deductible, and every
      adjudication legitimately supersedes the previous view of
      deductible_met_cents. A caller whose expected_policy_version is behind
      InsurancePolicy.version computed its deductible split against a stale
      remaining balance, so the adjudication is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:

  # -------------------------------------------------------------------- (1) --
  - name: sibling_ladder_rate
    trigger: "Membership PENDING_ACTIVATION creation (POST /peds/memberships) and Membership -> CANCELLED (POST /peds/memberships/{membership_id}/cancel); recomputes enrollment_sequence, discount_pct and monthly_rate_cents on EVERY membership of the affected family"
    algorithm: tiered_pricing
    formula: |
      # COMBINATORIAL MODE (c): the dependency looks circular - monthly_rate_cents
      # depends on discount_pct, which depends on enrollment_sequence, which
      # depends on the very set of memberships this call is mutating. The
      # evaluation order below is PINNED and must be followed exactly.
      #
      # Step 1 - build the occupancy set AFTER the mutation is applied:
      #   S = { m : m.family_id == family.id
      #             AND m.status IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED} }
      #   (a membership whose status just became CANCELLED is excluded)
      # Step 2 - order S by start_date ASC, then created_at ASC.
      #          enrollment_sequence = 1-based position in that order.
      #          The order key is enrollment sequence, NOT child age; a younger
      #          child enrolled first outranks an older child enrolled later.
      # Step 3 - discount_pct from enrollment_sequence:
      #   seq == 1  -> SIBLING_DISCOUNT_TIER_1_PCT      = 0.00
      #   seq == 2  -> SIBLING_DISCOUNT_TIER_2_PCT      = 0.20
      #   seq >= 3  -> SIBLING_DISCOUNT_TIER_3_PLUS_PCT = 0.35
      # Step 4 - monthly_rate_cents =
      #   round_half_up(plan.monthly_rate_cents * (1 - discount_pct))
      # Step 5 - only after every membership in S has its own monthly_rate_cents
      #          may the family cap be considered; the cap lives in
      #          calculations.family_invoice_total and NEVER feeds back into
      #          discount_pct.
      # A membership with status CANCELLED keeps its last computed
      # enrollment_sequence, discount_pct and monthly_rate_cents frozen for audit.
    input_set: "Memberships of one family with status IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED}, evaluated after the triggering mutation has been applied"
    constants:
      SIBLING_DISCOUNT_TIER_1_PCT: 0.00
      SIBLING_DISCOUNT_TIER_2_PCT: 0.20
      SIBLING_DISCOUNT_TIER_3_PLUS_PCT: 0.35
    precision: "whole cents, round_half_up"

  # -------------------------------------------------------------------- (2) --
  - name: membership_cycle_proration
    trigger: "Invoice line construction inside calculations.family_invoice_total, itself triggered by POST /peds/memberships, POST /peds/memberships/{membership_id}/cancel and POST /peds/invoices"
    algorithm: threshold
    formula: |
      # Day counting is INCLUSIVE on both endpoints.
      from_date = max(membership.start_date, invoice.cycle_start_date)
      if membership.cancellation_effective_date is null:
          to_date = invoice.cycle_end_date
      else:
          to_date = min(membership.cancellation_effective_date, invoice.cycle_end_date)
      covered_days = (to_date - from_date).days + 1
      if covered_days < 0: covered_days = 0
      prorated_cents = round_half_up(
          membership.monthly_rate_cents * covered_days / invoice.days_in_cycle )
      # A membership whose start_date is after cycle_end_date, or whose
      # cancellation_effective_date is before cycle_start_date, contributes
      # covered_days = 0 and is omitted from invoice.lines entirely.
    input_set: "One Membership row and one Invoice cycle; the membership is included when status IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED} or when status == CANCELLED with a cancellation_effective_date inside the cycle"
    constants:
      MONEY_ROUNDING_MODE: "round_half_up"
    precision: "whole cents, round_half_up"
    variants:
      - name: enrollment_proration
        when: "membership.cancellation_effective_date is null and membership.start_date is strictly after invoice.cycle_start_date"
        difference: "the counted window is [start_date .. cycle_end_date], both inclusive - the trailing edge of the cycle is billed and the leading edge is cut"
      - name: cancellation_proration
        when: "membership.cancellation_effective_date falls on or between cycle_start_date and cycle_end_date"
        difference: "the counted window is [max(start_date, cycle_start_date) .. cancellation_effective_date], both inclusive - the leading edge is billed and the trailing edge is cut. For identical dates the two variants select disjoint day sets and therefore produce different prorated_cents: a membership starting 2026-06-11 in a 30-day cycle bills 20 days under enrollment_proration, whereas the same membership cancelled effective 2026-06-11 bills 11 days under cancellation_proration."

  # -------------------------------------------------------------------- (3) --
  - name: family_invoice_total
    trigger: "POST /peds/invoices, and recomputation of every DRAFT Invoice of the family on POST /peds/memberships and POST /peds/memberships/{membership_id}/cancel"
    algorithm: waterfall_allocation
    formula: |
      # COMBINATORIAL MODE (b): the rounding order is the whole difficulty.
      # PINNED ORDER - discount, then prorate, then round PER LINE, then sum,
      # then cap. Rounding the sum instead of the lines changes the answer.
      #
      # Step 1 - for each Membership m in the cycle (see input_set), in
      #          enrollment_sequence ASC order:
      #            base_rate_cents    = plan.monthly_rate_cents
      #            discount_pct       = m.discount_pct
      #            monthly_rate_cents = round_half_up(base_rate_cents * (1 - discount_pct))
      #            covered_days       = calculations.membership_cycle_proration
      #            prorated_cents     = round_half_up(monthly_rate_cents * covered_days / days_in_cycle)
      #          Each line is rounded to whole cents HERE, before any summation.
      # Step 2 - subtotal_cents = sum(prorated_cents over lines)      # sum of ROUNDED values
      # Step 3 - cap_adjustment_cents = max(0, subtotal_cents - family.family_monthly_cap_cents)
      # Step 4 - waterfall the adjustment against the lines in the EXACT
      #          REVERSE of the line order defined below, so a cancelled-mid-cycle
      #          line absorbs the cap first and the sequence-1 line absorbs last:
      #            line order  = is_cancelled ASC, enrollment_sequence ASC, created_at ASC
      #            waterfall   = that order reversed
      #          (is_cancelled is 0 when the membership's status is not CANCELLED
      #           and 1 when it is; a CANCELLED membership keeps the
      #           enrollment_sequence it held at cancellation, frozen for audit,
      #           which is why is_cancelled is the primary key and not the
      #           sequence itself.)
      #            remaining = cap_adjustment_cents
      #            for line in reversed(line order):
      #                take = min(remaining, line.prorated_cents)
      #                line.cap_adjustment_cents = take
      #                line.line_total_cents     = line.prorated_cents - take
      #                remaining -= take
      # Step 5 - total_cents = subtotal_cents - cap_adjustment_cents
      #          which equals sum(line.line_total_cents) exactly.
      #
      # Worked example - June 2026 (30 days), plan PLUS base 40000,
      # family_monthly_cap_cents 100000, three siblings starting 06-01, 06-11
      # and 06-14:
      #   seq1: 40000 * 1.00 = 40000; 30/30 -> 40000
      #   seq2: 40000 * 0.80 = 32000; 20/30 -> 21333.33 -> 21333
      #   seq3: 40000 * 0.65 = 26000; 17/30 -> 14733.33 -> 14733
      #   round-per-line then sum = 76066   (the pinned answer)
      #   sum then round          = 76067   (the rejected alternative)
      # With family_monthly_cap_cents 60000 instead: cap_adjustment_cents = 16066,
      # line seq3 gives up all 14733, line seq2 gives up the remaining 1333
      # (21333 -> 20000), line seq1 is untouched, total_cents = 60000.
    input_set: "Memberships m with m.family_id == invoice.family_id and covered_days > 0 for this cycle, i.e. status IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED} or status == CANCELLED with cancellation_effective_date on or after cycle_start_date. Only Invoices with status == DRAFT are ever recomputed; ISSUED and PAID invoices are frozen."
    constants:
      MONEY_ROUNDING_MODE: "round_half_up"
      MONEY_DECIMAL_PLACES: 0
    precision: "whole cents, round_half_up, applied once per line before summation"

  # -------------------------------------------------------------------- (4) --
  - name: service_line_route_assignment
    trigger: "ServiceLine creation inside POST /peds/encounters/{encounter_id}/submit-billing, POST /peds/consult-bookings/{booking_id}/complete and POST /peds/well-visits/{well_visit_id}/complete"
    algorithm: constraint_propagation
    formula: |
      # Exactly one route is assigned; the branches are mutually exclusive and
      # evaluated top to bottom.
      if service_code IN MEMBERSHIP_COVERED_SERVICE_CODES ("WELL_VISIT", "TELEHEALTH_VISIT"):
          route = COVERED_BY_MEMBERSHIP
      elif service_code == "AFTER_HOURS_SURCHARGE":
          route = COVERED_BY_MEMBERSHIP if plan.after_hours_surcharge_waived else PATIENT_RESPONSIBILITY
      elif service_code IN ("LACTATION_CONSULT", "SLEEP_CONSULT"):
          route = COVERED_BY_MEMBERSHIP if booking.coverage_route == ENTITLEMENT else PATIENT_RESPONSIBILITY
      elif service_code IN INSURANCE_ELIGIBLE_SERVICE_CODES ("SICK_VISIT"):
          # Selector: the household's policy. Candidate set = InsurancePolicy
          # rows with family_id == membership.family_id AND status == ACTIVE.
          # Ranking: created_at DESC (most recently created active policy).
          # Tie-break: cannot occur - created_at is strictly increasing.
          # Empty-set fallback: route = PATIENT_RESPONSIBILITY, policy_id null.
          policy = first of that ordered candidate set
          route = BILLED_TO_INSURANCE if policy exists else PATIENT_RESPONSIBILITY
          policy_id = policy.id if policy exists else null
    input_set: "One ServiceLine at creation time, its owning Membership, that membership's MembershipPlan, and the InsurancePolicy rows of the membership's family"
    constants:
      MEMBERSHIP_COVERED_SERVICE_CODES: ["WELL_VISIT", "TELEHEALTH_VISIT"]
      INSURANCE_ELIGIBLE_SERVICE_CODES: ["SICK_VISIT"]
    precision: "n/a - categorical output"

  # -------------------------------------------------------------------- (5) --
  - name: service_line_financial_split
    trigger: "ServiceLine creation (membership and patient routes) and POST /peds/service-lines/{service_line_id}/adjudicate (insurance route)"
    algorithm: waterfall_allocation
    formula: |
      # COMBINATORIAL MODE (a): four inputs (billed_amount_cents,
      # allowed_amount_cents, remaining deductible, coinsurance_rate) combined
      # through nested min/max and a branch on route.
      #
      # --- shared preamble -------------------------------------------------
      # Balance billing is structurally impossible: patient_responsibility_cents
      # is derived only from allowed_amount_cents, never from
      # billed_amount_cents. write_off_cents is booked to the practice.
      #
      # --- insurance route -------------------------------------------------
      A            = allowed_amount_cents            # supplied at adjudication
      remaining    = max(0, policy.deductible_cents - policy.deductible_met_cents)
      ded_applied  = min(A, remaining)
      after_ded    = A - ded_applied
      coinsurance  = round_half_up(after_ded * policy.coinsurance_rate)
      plan_paid    = after_ded - coinsurance
      patient_resp = ded_applied + coinsurance
      write_off    = billed_amount_cents - A
      membership_covered = 0
      # policy.deductible_met_cents += ded_applied  (and policy.version += 1)
      #
      # --- membership route ------------------------------------------------
      A            = billed_amount_cents
      ded_applied  = 0 ; coinsurance = 0 ; plan_paid = 0
      patient_resp = 0
      membership_covered = billed_amount_cents
      write_off    = 0
      # policy.deductible_met_cents is NOT touched; policy_id stays null.
      #
      # --- patient route ---------------------------------------------------
      A            = billed_amount_cents
      ded_applied  = 0 ; coinsurance = 0 ; plan_paid = 0
      patient_resp = billed_amount_cents
      membership_covered = 0
      write_off    = 0
      #
      # Worked examples with deductible_cents 50000, coinsurance_rate 0.20,
      # billed 18000 and allowed 14000 on each call:
      #   call 1 (met 0)     -> ded 14000, after 0,     coins 0,    plan 0,     patient 14000, met -> 14000
      #   call 2 (met 14000) -> ded 14000, after 0,     coins 0,    plan 0,     patient 14000, met -> 28000
      #   call 3 (met 50000) -> ded 0,     after 14000, coins 2800, plan 11200, patient 2800,  met -> 50000
      # Rounding boundary, deductible_cents 9770 and coinsurance_rate 0.15,
      # billed 18000, allowed 14000:
      #   ded 9770, after 4230, coins round_half_up(634.5) = 635,
      #   plan 3595, patient 10405, write_off 4000
    input_set: "One ServiceLine plus, on the insurance route only, the InsurancePolicy selected by calculations.service_line_route_assignment"
    constants:
      MONEY_ROUNDING_MODE: "round_half_up"
    precision: "whole cents, round_half_up, applied once to the coinsurance product"
    variants:
      - name: insurance_route
        when: "route == BILLED_TO_INSURANCE, i.e. a SICK_VISIT line for a family holding an ACTIVE InsurancePolicy"
        difference: "a deductible-then-coinsurance waterfall runs against the policy, the patient owes ded_applied + coinsurance, and policy.deductible_met_cents is mutated. Identical billed and allowed inputs yield patient_responsibility_cents 14000 here."
      - name: membership_route
        when: "route == COVERED_BY_MEMBERSHIP, i.e. the same clinical work delivered under the concierge membership"
        difference: "no deductible and no coinsurance run at all, the patient owes 0, the whole billed amount lands in membership_covered_cents and the policy is never read. Identical billed and allowed inputs yield patient_responsibility_cents 0 here - the flagship divergence."
      - name: patient_route
        when: "route == PATIENT_RESPONSIBILITY, i.e. an after-hours surcharge on a non-waiving tier, an overage consult, or a SICK_VISIT for a family with no ACTIVE policy"
        difference: "the full billed amount is the patient's, with no deductible, no coinsurance and no write-off; the line is SETTLED at creation without any adjudication call."

  # -------------------------------------------------------------------- (6) --
  - name: immunization_dose_validity
    trigger: "POST /peds/immunization-doses (initial evaluation) and the re-evaluation cascade inside POST /peds/immunization-doses/{dose_id}/invalidate"
    algorithm: chronological
    formula: |
      # Processing order for a re-evaluation sweep: administered_date ASC, then
      # created_at ASC. Never id.
      prior_valid = the dose of the same child_id and vaccine_code with
                    validity == VALID whose administered_date is the greatest
                    value strictly less than this dose's administered_date;
                    ties on administered_date are broken by created_at DESC;
                    null when no such dose exists.
      effective_series_index = 1 + count of doses of the same child_id and
                    vaccine_code with validity == VALID whose administered_date
                    is strictly less than this dose's administered_date, or
                    equal with a strictly earlier created_at.
      spec = VACCINE_SCHEDULE[vaccine_code].positions[effective_series_index]

      if effective_series_index > VACCINE_SCHEDULE[vaccine_code].total_doses:
          validity = INVALID ; invalid_reason = SERIES_ALREADY_COMPLETE ; stop.

      age_days_at_administration = (administered_date - child.date_of_birth).days
      # RUNG A - age. Grace is added to the LHS and the test is ">=", so a dose
      # given exactly IMMUNIZATION_GRACE_DAYS early passes and one day earlier fails.
      age_ok = (age_days_at_administration + IMMUNIZATION_GRACE_DAYS >= spec.min_age_days)

      # RUNG B - interval. Skipped entirely at effective_series_index 1.
      if effective_series_index == 1:
          interval_days_since_prior = null ; interval_ok = true
      else:
          interval_days_since_prior = (administered_date - prior_valid.administered_date).days
          interval_ok = (interval_days_since_prior + IMMUNIZATION_GRACE_DAYS >= spec.min_interval_days)

      # RUNG ORDER IS PINNED: age is evaluated first. When BOTH rungs fail the
      # reported invalid_reason is MIN_AGE_NOT_MET, never MIN_INTERVAL_NOT_MET.
      if not age_ok:        validity = INVALID ; invalid_reason = MIN_AGE_NOT_MET
      elif not interval_ok: validity = INVALID ; invalid_reason = MIN_INTERVAL_NOT_MET
      else:                 validity = VALID   ; invalid_reason = null

      # A dose with manually_invalidated == true stays INVALID with
      # invalid_reason MANUALLY_INVALIDATED and is excluded from every VALID set,
      # which is what shifts the remaining series.
    input_set: "All ImmunizationDose rows of one child and one vaccine_code, regardless of validity, ordered by administered_date ASC then created_at ASC"
    constants:
      IMMUNIZATION_GRACE_DAYS: 4
    precision: "whole days"
    variants:
      - name: age_rung
        when: "the dose fails spec.min_age_days after the grace allowance"
        difference: "invalid_reason is MIN_AGE_NOT_MET and the fix is to wait for the child to age; the prior dose's date is irrelevant. Example - DOB 2026-04-01, HEPB dose 3 administered 2026-09-11 sits at age_days 163, and 163 + 4 = 167 < 168, so the dose is INVALID for age even though the interval since dose 2 is enormous."
      - name: interval_rung
        when: "the dose satisfies spec.min_age_days but fails spec.min_interval_days after the grace allowance"
        difference: "invalid_reason is MIN_INTERVAL_NOT_MET and the fix is to re-administer later relative to the PRIOR VALID dose; the child's age is irrelevant. Example - DOB 2026-04-01, DTAP dose 1 on 2026-05-26 (age 55, valid) and dose 2 on 2026-06-18 gives interval 23, and 23 + 4 = 27 < 28, so the dose is INVALID for interval although its age 78 clears the 70-day minimum."

  # -------------------------------------------------------------------- (7) --
  - name: immunization_completeness_for_age
    trigger: "Read of Child.immunization_complete_for_age, and recomputation on every ImmunizationDose creation or validity change"
    algorithm: aggregation
    formula: |
      age_days = (current logical clock date - child.date_of_birth).days
      for each vaccine_code V in VACCINE_SCHEDULE (HEPB and DTAP):
          required(V) = count of positions p in VACCINE_SCHEDULE[V].positions
                        with p.min_age_days + IMMUNIZATION_DUE_LAG_DAYS <= age_days
                        # "<=" is INCLUSIVE: a position becomes required on the
                        # exact day age_days reaches min_age_days + 30.
          have(V)     = count of this child's ImmunizationDose rows with
                        vaccine_code == V and validity == VALID
          if have(V) < required(V): return false
      return true
      # EMPTY-SET BOUNDARY: for a newborn every required(V) is 0, so a child
      # with zero recorded doses is vacuously complete. DOB 2026-05-20 read at
      # 2026-06-15 has age_days 26, required(HEPB) 0 and required(DTAP) 0, so
      # immunization_complete_for_age is true. Read at 2026-06-19 the age_days
      # is 30, required(HEPB) becomes 1, and the same child is now incomplete.
    input_set: "All ImmunizationDose rows of one child with validity == VALID; doses with validity == INVALID are excluded regardless of why they are invalid"
    constants:
      IMMUNIZATION_DUE_LAG_DAYS: 30
    precision: "integer counts"

  # -------------------------------------------------------------------- (8) --
  - name: well_visit_schedule_generation
    trigger: "Membership creation (POST /peds/memberships) and the promoted-membership creation inside CASCADE A hop 3"
    algorithm: projection
    formula: |
      for each milestone M in WELL_VISIT_SCHEDULE (in listed order):
          window_open_date  = child.date_of_birth + M.window_open_offset_days
          window_close_date = child.date_of_birth + M.window_close_offset_days
          target_date       = child.date_of_birth + M.target_age_days
          # INCLUSIVE test: a milestone whose window closes exactly on the
          # membership start date IS generated.
          if window_close_date >= membership.start_date:
              create WellVisit(status=DUE, milestone_code=M.milestone_code,
                               target_date, window_open_date, window_close_date)
      # Milestones whose window closed strictly before start_date are never
      # generated, so a child enrolled at four months of age carries no NEWBORN
      # or M1 row.
    input_set: "The eleven rows of WELL_VISIT_SCHEDULE evaluated against one Child.date_of_birth and one Membership.start_date"
    constants:
      WELL_VISIT_MILESTONE_COUNT: 11
      WELL_VISIT_MISS_GRACE_DAYS: 30
    precision: "whole days"

  # -------------------------------------------------------------------- (9) --
  - name: well_visit_punctuality
    trigger: "POST /peds/well-visits/{well_visit_id}/complete"
    algorithm: threshold
    formula: |
      # BOTH window boundaries are INCLUSIVE to ON_SCHEDULE.
      if completed_date <  window_open_date:  punctuality = EARLY
      elif completed_date <= window_close_date: punctuality = ON_SCHEDULE
      else:                                    punctuality = DELAYED
      # DOB 2026-04-01, milestone M2 (offsets 53 and 75) gives
      # window_open_date 2026-05-24 and window_close_date 2026-06-15:
      #   completed 2026-05-23 -> EARLY
      #   completed 2026-05-24 -> ON_SCHEDULE   (open boundary, inclusive)
      #   completed 2026-06-15 -> ON_SCHEDULE   (close boundary, inclusive)
      #   completed 2026-06-16 -> DELAYED
    input_set: "One WellVisit row and the completed_date supplied on the call"
    constants:
      WELL_VISIT_BOUNDARY_INCLUSIVITY: "both_inclusive"
    precision: "whole days"

  # ------------------------------------------------------------------- (10) --
  - name: panel_weighted_occupancy
    trigger: "Read of Physician.weighted_occupancy and Physician.available_panel_weight, the capacity check inside POST /peds/memberships, and the promotion selector inside CASCADE A hop 2"
    algorithm: aggregation
    formula: |
      # Weight is a function of the child's age AT THE CURRENT LOGICAL CLOCK
      # DATE, not at enrollment, so occupancy falls as the panel ages.
      def slot_weight(child):
          age = (current logical clock date - child.date_of_birth).days
          if age <  INFANT_SLOT_WEIGHT_MAX_AGE_DAYS  (365):  return 2.0
          if age <  TODDLER_SLOT_WEIGHT_MAX_AGE_DAYS (1095): return 1.5
          return 1.0
      weighted_occupancy = sum(slot_weight(m.child) for m in Memberships
                               where m.physician_id == physician.id
                                 and m.status IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED})
      available_panel_weight = max(0.0, physician.panel_slot_cap - weighted_occupancy)
      # ADMISSION TEST, inclusive at equality:
      #   accept when weighted_occupancy + slot_weight(candidate) <= panel_slot_cap
      # All comparisons are made on values multiplied by 10 and rounded to the
      # nearest integer (SLOT_WEIGHT_DECIMAL_PLACES = 1), so 4.5 <= 4.5 is exact.
      # Worked example - panel_slot_cap 4.5, child born 2025-07-01 and child
      # born 2026-04-01 both enrolled. At clock 2026-06-01 their ages are 335
      # and 61, both weight 2.0, occupancy 4.0; a child born 2022-01-01
      # (weight 1.0) would push it to 5.0 and is REJECTED. At clock 2026-07-01
      # the first child's age is exactly 365, its weight drops to 1.5,
      # occupancy is 3.5, and the same enrollment lands on exactly 4.5 and is
      # ACCEPTED.
    input_set: "Memberships on one physician with status IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED}; CANCELLED memberships contribute 0.0"
    constants:
      INFANT_SLOT_WEIGHT: 2.0
      TODDLER_SLOT_WEIGHT: 1.5
      STANDARD_SLOT_WEIGHT: 1.0
      INFANT_SLOT_WEIGHT_MAX_AGE_DAYS: 365
      TODDLER_SLOT_WEIGHT_MAX_AGE_DAYS: 1095
      SLOT_WEIGHT_DECIMAL_PLACES: 1
    precision: "one decimal place, exact comparison on the value times ten"

  # ------------------------------------------------------------------- (11) --
  - name: waitlist_promotion_selector
    trigger: "CASCADE A hop 2, inside POST /peds/memberships/{membership_id}/cancel"
    algorithm: waterfall_allocation
    formula: |
      # (a) Eligibility filter - candidate set:
      #     { e : e.physician_id == cancelled_membership.physician_id
      #           AND e.status == WAITING
      #           AND e.candidate_slot_weight <= physician.available_panel_weight
      #               measured AFTER the cancelled weight has been released }
      # (b) Ranking expression: created_at ASC.
      # (c) Tie-break: none needed - created_at is strictly increasing within
      #     the collection; created_at is the only fallback key and id is never
      #     consulted.
      # (d) Empty-set fallback: no promotion occurs, every WAITING entry keeps
      #     status WAITING, and CASCADE A hops 3 and 4 do not fire. This is not
      #     an error condition.
      # Exactly ONE entry is promoted per cancellation, even when the freed
      # weight would accommodate several. Entries earlier in created_at order
      # whose candidate_slot_weight does not fit are SKIPPED and stay WAITING;
      # they are not reordered or penalised.
    input_set: "PanelWaitlistEntry rows with status == WAITING on the cancelled membership's physician"
    constants:
      WAITLIST_PROMOTIONS_PER_CANCELLATION: 1
    precision: "one decimal place on weights"

  # ------------------------------------------------------------------- (12) --
  - name: after_hours_surcharge
    trigger: "POST /peds/encounters (computes after_hours, after_hours_reason and surcharge_cents) and POST /peds/encounters/{encounter_id}/submit-billing (materialises the surcharge line)"
    algorithm: interval_merge
    formula: |
      local_date    = the UTC calendar date of started_at
      minute_of_day = started_at.hour * 60 + started_at.minute   # UTC
      weekday_name  = the English weekday name of local_date

      # Rung order is PINNED: weekend, then holiday, then the weekday windows.
      if weekday_name IN WEEKEND_WEEKDAY_NAMES ("SATURDAY", "SUNDAY"):
          after_hours = true ; after_hours_reason = WEEKEND
      elif local_date IN DECLARED_HOLIDAY_DATES:
          after_hours = true ; after_hours_reason = HOLIDAY
      elif minute_of_day >= AFTER_HOURS_EVENING_START_MINUTE (1080):
          after_hours = true ; after_hours_reason = WEEKDAY_EVENING
      elif minute_of_day <  AFTER_HOURS_MORNING_END_MINUTE (480):
          after_hours = true ; after_hours_reason = WEEKDAY_EARLY_MORNING
      else:
          after_hours = false ; after_hours_reason = null

      surcharge_cents = 0 if (not after_hours or plan.after_hours_surcharge_waived)
                          else AFTER_HOURS_SURCHARGE_CENTS (7500)
      # BOUNDARY INCLUSIVITY - 18:00:00 exactly IS after-hours (">=" on 1080);
      # 17:59:00 is not. 07:59:00 IS after-hours ("<" on 480); 08:00:00 is not.
    input_set: "One Encounter.started_at, the weekday of its UTC date, DECLARED_HOLIDAY_DATES, and the plan of the encounter's membership"
    constants:
      AFTER_HOURS_EVENING_START_MINUTE: 1080
      AFTER_HOURS_MORNING_END_MINUTE: 480
      AFTER_HOURS_SURCHARGE_CENTS: 7500
      WEEKEND_WEEKDAY_NAMES: ["SATURDAY", "SUNDAY"]
      DECLARED_HOLIDAY_DATES: ["2026-05-25", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25", "2027-01-01"]
    precision: "whole minutes"
    variants:
      - name: weekday_window
        when: "the encounter's UTC date is a Monday through Friday that is not in DECLARED_HOLIDAY_DATES"
        difference: "after-hours is decided by minute_of_day against a two-sided window - true only when minute_of_day >= 1080 or minute_of_day < 480. A contact at 2026-06-15T14:00:00Z (a Monday) is NOT after-hours and carries surcharge_cents 0."
      - name: full_day_window
        when: "the encounter's UTC date is a Saturday, a Sunday, or a member of DECLARED_HOLIDAY_DATES"
        difference: "minute_of_day is never consulted - the entire calendar day is after-hours. The same 14:00:00Z contact moved to 2026-06-13 (a Saturday) or to 2026-07-03 (a declared Friday holiday) IS after-hours and carries surcharge_cents 7500 on a non-waiving tier."

  # ------------------------------------------------------------------- (13) --
  - name: entitlement_consumption
    trigger: "POST /peds/consult-bookings, POST /peds/consult-bookings/{booking_id}/complete and POST /peds/consult-bookings/{booking_id}/cancel"
    algorithm: aggregation
    formula: |
      # Grant selection for a booking: the EntitlementGrant with
      # membership_id == booking.membership_id,
      # benefit_type == booking.consult_type, and
      # membership_year_index == floor((date(scheduled_start) - membership.start_date).days / 365).
      # There is exactly one such row; if it does not exist yet it is created
      # with granted_count taken from the plan for that benefit_type.
      #
      # CONSERVATION IDENTITY (must hold after EVERY request):
      #   available_count + booked_count + consumed_count == granted_count
      # released_count and overage_count sit OUTSIDE this identity; they are
      # audit counters.
      #
      # create   : if available_count > 0 -> coverage_route = ENTITLEMENT,
      #                                      booked_count += 1
      #            else                   -> coverage_route = OVERAGE,
      #                                      overage_count += 1
      # complete : ENTITLEMENT -> booked_count -= 1, consumed_count += 1
      #            OVERAGE     -> no counter moves
      # cancel   : ENTITLEMENT -> booked_count -= 1, released_count += 1
      #            OVERAGE     -> overage_count -= 1
      # reschedule: no counter moves.
      #
      # COMPENSATING-ACTION INVARIANT: create followed by cancel restores
      # available_count to its pre-create value exactly, leaves booked_count and
      # consumed_count unchanged, and advances released_count by 1.
      # Worked example on plan PLUS (included_lactation_consults 3): bookings
      # 1..3 take ENTITLEMENT and drive available_count to 0 with the grant
      # EXHAUSTED; booking 4 takes OVERAGE with overage_count 1; cancelling
      # booking 2 returns available_count to 1, released_count to 1, and flips
      # the grant back to OPEN.
    input_set: "One EntitlementGrant and all ConsultBookings referencing it"
    constants:
      MEMBERSHIP_YEAR_DAYS: 365
    precision: "integer counts"

  # ------------------------------------------------------------------- (14) --
  - name: form_issuance_gate
    trigger: "POST /peds/form-requests, POST /peds/form-requests/{form_request_id}/issue and POST /peds/form-requests/{form_request_id}/recheck"
    algorithm: threshold
    formula: |
      # COMBINATORIAL MODE (a) companion - three independent inputs from three
      # different entities, evaluated as an ordered ladder. The FIRST failing
      # rung supplies blocked_reason; later rungs are not evaluated.
      # rung 1: membership.status == ACTIVE
      #         else blocked_reason = MEMBERSHIP_NOT_ACTIVE
      # rung 2: child.immunization_complete_for_age == true
      #         (calculations.immunization_completeness_for_age)
      #         else blocked_reason = IMMUNIZATION_INCOMPLETE
      # rung 3: there exists a WellVisit W with W.membership_id == form.membership_id,
      #         W.status == COMPLETED and
      #         current_date - FORM_WELL_VISIT_RECENCY_DAYS <= W.completed_date <= current_date
      #         (BOTH bounds INCLUSIVE - a visit completed exactly 365 days ago
      #          still satisfies the rung, one completed 366 days ago does not)
      #         else blocked_reason = WELL_VISIT_STALE
      # gate_ok = all three rungs pass.
      #
      # SLA: due_at = requested_at + plan.form_sla_hours hours, evaluated once
      # at creation and never recomputed. sla_met = (issued_at <= due_at),
      # inclusive at equality. ESSENTIAL gives 120 hours, PLUS 72 and PREMIER 24.
    input_set: "One FormRequest, its Membership, that membership's MembershipPlan, its Child, and the WellVisit rows of that membership"
    constants:
      FORM_WELL_VISIT_RECENCY_DAYS: 365
    precision: "whole days for the recency window, whole hours for the SLA"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# The ladder has 17 rungs. Within a request every rung is evaluated in
# ascending priority order and the FIRST failing rung supplies the error_id.
# =============================================================================
validation_priority_ladder:
  - { rung: 1,  priorities: "1",     name: authentication,            category: auth }
  - { rung: 2,  priorities: "2",     name: authorization,             category: auth }
  - { rung: 3,  priorities: "3-8",   name: path_existence,            category: existence }
  - { rung: 4,  priorities: "9-11",  name: request_schema,            category: business_constraint }
  - { rung: 5,  priorities: "12-13", name: date_format_and_ordering,  category: business_temporal }
  - { rung: 6,  priorities: "14-18", name: body_reference_existence,  category: business_referential }
  - { rung: 7,  priorities: "19",    name: resource_ownership,        category: auth }
  - { rung: 8,  priorities: "20",    name: segregation_of_duties,     category: auth }
  - { rung: 9,  priorities: "21",    name: optimistic_concurrency,    category: state }
  - { rung: 10, priorities: "22-24", name: target_state_precondition, category: state }
  - { rung: 11, priorities: "25",    name: cross_entity_policy_state, category: state }
  - { rung: 12, priorities: "26",    name: route_eligibility,         category: business_referential }
  - { rung: 13, priorities: "27-29", name: clinical_compliance_safety, category: business_safety }
  - { rung: 14, priorities: "30-31", name: temporal_overlap,          category: business_temporal }
  - { rung: 15, priorities: "32-33", name: uniqueness,                category: business_constraint }
  - { rung: 16, priorities: "34",    name: panel_capacity,            category: business_fiscal }
  - { rung: 17, priorities: "35-37", name: fiscal_and_limit_checks,   category: business_fiscal }

validations:

  # ---- rung 1: authentication ----------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of PracticeAdmin, Physician, CareCoordinator, BillingSpecialist, Parent"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  # ---- rung 2: authorization -----------------------------------------------
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's declared roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  # ---- rung 3: path existence (left-to-right) -------------------------------
  - priority: 3
    category: existence
    check: "the {family_id} path segment resolves to a Family"
    error_id: ERR_FAMILY_NOT_FOUND
    http_status: 404
    applies_to: "GET /peds/families/{family_id}"
  - priority: 4
    category: existence
    check: "the {child_id} path segment resolves to a Child"
    error_id: ERR_CHILD_NOT_FOUND
    http_status: 404
    applies_to: "GET /peds/children/{child_id}"
  - priority: 5
    category: existence
    check: "the {physician_id} path segment resolves to a Physician"
    error_id: ERR_PHYSICIAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /peds/physicians/{physician_id}, GET /peds/physicians/{physician_id}/panel"
  - priority: 6
    category: existence
    check: "the {membership_id} path segment resolves to a Membership"
    error_id: ERR_MEMBERSHIP_NOT_FOUND
    http_status: 404
    applies_to: "all /peds/memberships/{membership_id} routes"
  - priority: 7
    category: existence
    check: "the {plan_id} path segment resolves to a MembershipPlan"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /peds/membership-plans/{plan_id}"
  - priority: 8
    category: existence
    check: "the path segment resolves for every other collection - insurance policies, panel waitlist entries, entitlement grants, consult bookings, well visits, immunization doses, encounters, service lines, invoices and form requests"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all other /peds/{collection}/{id} routes"

  # ---- rung 4: request schema ----------------------------------------------
  - priority: 9
    category: business_constraint
    check: "every field the endpoint declares as required is present and carries the declared JSON type"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 10
    category: business_constraint
    check: "every enum-typed body field carries a declared member value - tier, form_type, consult_type, modality, encounter_type, vaccine_code, status filters, benefit_type, route filters"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all POST endpoints and every list endpoint taking an enum filter"
  - priority: 11
    category: business_constraint
    check: "numeric ranges hold - panel_slot_cap > 0, monthly_rate_cents >= 0, 0 <= coinsurance_rate <= 1, included consult counts >= 0, form_sla_hours > 0, limit between 1 and 100, offset >= 0, and 0 <= allowed_amount_cents <= service_line.billed_amount_cents"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /peds/physicians, POST /peds/membership-plans, POST /peds/insurance-policies, POST /peds/service-lines/{service_line_id}/adjudicate, all list endpoints"

  # ---- rung 5: date format and ordering ------------------------------------
  - priority: 12
    category: business_temporal
    check: "every date field parses as YYYY-MM-DD and every datetime field parses as ISO 8601 UTC"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints taking a date or datetime field"
  - priority: 13
    category: business_temporal
    check: "date ordering holds - scheduled_end is strictly after scheduled_start; cycle_start_date is the 1st day of a month; membership start_date satisfies current logical date <= start_date <= last day of the current month; cancel effective_date satisfies membership.start_date <= effective_date and current logical date <= effective_date <= last day of the current month; to_iso8601 on the clock endpoint is not before the current clock value"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "POST /peds/consult-bookings, POST /peds/consult-bookings/{booking_id}/reschedule, POST /peds/invoices, POST /peds/memberships, POST /peds/memberships/{membership_id}/cancel, POST /peds/_clock/set_current_utc"

  # ---- rung 6: body reference existence -------------------------------------
  - priority: 14
    category: business_referential
    check: "family_id in the request body resolves to a Family"
    error_id: ERR_FAMILY_NOT_FOUND
    http_status: 404
    applies_to: "POST /peds/children, POST /peds/insurance-policies, POST /peds/invoices"
  - priority: 15
    category: business_referential
    check: "child_id in the request body resolves to a Child"
    error_id: ERR_CHILD_NOT_FOUND
    http_status: 404
    applies_to: "POST /peds/memberships, POST /peds/panel-waitlist-entries, POST /peds/immunization-doses"
  - priority: 16
    category: business_referential
    check: "plan_id or requested_plan_id in the request body resolves to a MembershipPlan"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /peds/memberships, POST /peds/panel-waitlist-entries"
  - priority: 17
    category: business_referential
    check: "physician_id or consultant_physician_id in the request body resolves to a Physician"
    error_id: ERR_PHYSICIAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /peds/memberships, POST /peds/panel-waitlist-entries, POST /peds/consult-bookings"
  - priority: 18
    category: business_referential
    check: "membership_id in the request body resolves to a Membership"
    error_id: ERR_MEMBERSHIP_NOT_FOUND
    http_status: 404
    applies_to: "POST /peds/consult-bookings, POST /peds/encounters, POST /peds/form-requests"

  # ---- rung 7: resource ownership ------------------------------------------
  - priority: 19
    category: auth
    check: "when X-User-Role is Parent, X-User-ID must equal the Family.id reached from the target resource (Child.family_id, Membership.family_id, or the membership of the booking, encounter, form request, invoice, service line or waitlist entry); when X-User-Role is Physician, X-User-ID must equal Membership.physician_id for the membership targeted by a clinical write - well-visit completion, encounter clinical completion, encounter cancel and form issuance. Endpoints that target a Child rather than a Membership (immunization dose recording and invalidation) never apply this rung"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles list includes Parent or Physician and that reads or writes a family-scoped resource"

  # ---- rung 8: segregation of duties ---------------------------------------
  - priority: 20
    category: auth
    check: "the X-User-ID adjudicating a ServiceLine differs from that line's submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /peds/service-lines/{service_line_id}/adjudicate"

  # ---- rung 9: optimistic concurrency --------------------------------------
  - priority: 21
    category: state
    check: "expected_family_version equals Family.version on membership create and cancel; expected_policy_version equals InsurancePolicy.version on adjudication"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /peds/memberships, POST /peds/memberships/{membership_id}/cancel, POST /peds/service-lines/{service_line_id}/adjudicate"

  # ---- rung 10: target state preconditions ----------------------------------
  - priority: 22
    category: state
    check: "the target resource's current state permits the requested transition, including rejection of every transition out of a terminal state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint under /peds/memberships, /peds/panel-waitlist-entries, /peds/consult-bookings, /peds/well-visits, /peds/immunization-doses, /peds/encounters, /peds/service-lines, /peds/invoices and /peds/form-requests"
  - priority: 23
    category: state
    check: "the owning Membership.status is ACTIVE when creating a consult booking, rescheduling a consult booking, creating an encounter, completing a well visit, or issuing a form"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /peds/consult-bookings, POST /peds/consult-bookings/{booking_id}/reschedule, POST /peds/encounters, POST /peds/well-visits/{well_visit_id}/complete"
  - priority: 24
    category: state
    check: "reinstating a membership requires the family to hold zero Invoices with status ISSUED whose due_date is strictly before the current logical date; suspending requires at least one such invoice"
    error_id: ERR_ENROLLMENT_INVOICE_UNPAID
    http_status: 409
    applies_to: "POST /peds/memberships/{membership_id}/reinstate, POST /peds/memberships/{membership_id}/suspend"

  # ---- rung 11: cross-entity policy state -----------------------------------
  - priority: 25
    category: state
    check: "the InsurancePolicy referenced by the ServiceLine has status ACTIVE"
    error_id: ERR_POLICY_INACTIVE
    http_status: 409
    applies_to: "POST /peds/service-lines/{service_line_id}/adjudicate"

  # ---- rung 12: route eligibility -------------------------------------------
  - priority: 26
    category: business_referential
    check: "the ServiceLine's route is BILLED_TO_INSURANCE; lines routed COVERED_BY_MEMBERSHIP or PATIENT_RESPONSIBILITY can never be adjudicated"
    error_id: ERR_ROUTE_NOT_ADJUDICABLE
    http_status: 422
    applies_to: "POST /peds/service-lines/{service_line_id}/adjudicate"

  # ---- rung 13: clinical and compliance safety ------------------------------
  - priority: 27
    category: business_safety
    check: "when modality is TELEHEALTH, patient_state_code is a member of the responsible Physician.licensed_state_codes; the physician is Membership.physician_id for an encounter and consultant_physician_id for a consult booking"
    error_id: ERR_LICENSURE_NOT_COVERED
    http_status: 422
    applies_to: "POST /peds/encounters, POST /peds/consult-bookings"
  - priority: 28
    category: business_safety
    check: "encounter_type is not a member of TELEHEALTH_PROHIBITED_ENCOUNTER_TYPES when modality is TELEHEALTH"
    error_id: ERR_MODALITY_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /peds/encounters"
  - priority: 29
    category: business_safety
    check: "clinically dated fields are not in the future - date_of_birth, administered_date and completed_date are not after the current logical clock date, and started_at is not after the current logical clock instant"
    error_id: ERR_FUTURE_DATED
    http_status: 422
    applies_to: "POST /peds/children, POST /peds/immunization-doses, POST /peds/well-visits/{well_visit_id}/complete, POST /peds/encounters"

  # ---- rung 14: temporal overlap --------------------------------------------
  - priority: 30
    category: business_temporal
    check: "the new consult interval does not collide with any other ConsultBooking with status SCHEDULED on the same consultant_physician_id; intervals are half-open [scheduled_start, scheduled_end) padded by CONSULT_TURNAROUND_BUFFER_MINUTES on the trailing edge, so a booking starting exactly at prior_end plus 15 minutes is accepted"
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /peds/consult-bookings, POST /peds/consult-bookings/{booking_id}/reschedule"
  - priority: 31
    category: business_temporal
    check: "the child carries at most MAX_CONCURRENT_OPEN_ENCOUNTERS_PER_CHILD encounters whose CLOSED interval [started_at, started_at + 30 minutes] overlaps the new one, counting only encounters with clinical_status SCHEDULED; touching endpoints DO collide"
    error_id: ERR_ENCOUNTER_OVERLAP
    http_status: 409
    applies_to: "POST /peds/encounters"

  # ---- rung 15: uniqueness --------------------------------------------------
  - priority: 32
    category: business_constraint
    check: "the child has no other Membership with status IN {PENDING_ACTIVATION, ACTIVE, SUSPENDED}"
    error_id: ERR_DUPLICATE_MEMBERSHIP
    http_status: 409
    applies_to: "POST /peds/memberships"
  - priority: 33
    category: business_constraint
    check: "no other PanelWaitlistEntry with the same physician_id and child_id has status WAITING; and no MembershipPlan already carries the requested tier; and no Invoice already exists for the same family_id and cycle_start_date"
    error_id: ERR_DUPLICATE_WAITLIST_ENTRY
    http_status: 409
    applies_to: "POST /peds/panel-waitlist-entries, POST /peds/membership-plans, POST /peds/invoices"

  # ---- rung 16: panel capacity ----------------------------------------------
  - priority: 34
    category: business_fiscal
    check: "Physician.weighted_occupancy plus the candidate child's current_slot_weight is less than or equal to Physician.panel_slot_cap; equality is accepted"
    error_id: ERR_PANEL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /peds/memberships"

  # ---- rung 17: fiscal and limit checks -------------------------------------
  - priority: 35
    category: business_fiscal
    check: "ConsultBooking.reschedule_count is strictly less than MAX_CONSULT_RESCHEDULES before the reschedule is applied"
    error_id: ERR_RESCHEDULE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /peds/consult-bookings/{booking_id}/reschedule"
  - priority: 36
    category: business_fiscal
    check: "patient_responsibility_override_cents, when supplied, is less than or equal to deductible_applied_cents plus coinsurance_cents computed from allowed_amount_cents; collecting the write-off from the household is balance billing and is blocked"
    error_id: ERR_BALANCE_BILLING_BLOCKED
    http_status: 422
    applies_to: "POST /peds/service-lines/{service_line_id}/adjudicate"
  - priority: 37
    category: business_fiscal
    check: "a form request being issued is not in status BLOCKED; a BLOCKED request must first be recovered through the recheck endpoint"
    error_id: ERR_FORM_GATE_NOT_MET
    http_status: 409
    applies_to: "POST /peds/form-requests/{form_request_id}/issue"
  - priority: 38
    category: business_fiscal
    check: "exact settlement only - amount_paid_cents equals Invoice.total_cents on invoice payment, and payment_received_cents equals ServiceLine.patient_responsibility_cents on line settlement"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /peds/invoices/{invoice_id}/pay, POST /peds/service-lines/{service_line_id}/settle"

# =============================================================================
# Table 1.5: API Endpoint Table  (60 endpoints, all flat under /peds)
# =============================================================================
endpoints:

  # ---- logical clock (test-driving, /_ namespace) ---------------------------
  - method: POST
    path: "/peds/_clock/set_current_utc"
    description: "Set the server's logical clock. Before the first call the clock reads exactly 2026-05-01T00:00:00Z and never falls back to real wall-clock time. The new value may not be earlier than the current value."
    roles: [PracticeAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: "string" }
    side_effects:
      - "sets the logical clock"
      - "sweeps WellVisits with status IN {DUE, SCHEDULED} whose window_close_date plus WELL_VISIT_MISS_GRACE_DAYS is strictly before the new date to MISSED"
      - "sweeps PanelWaitlistEntries with status WAITING whose created_at date plus WAITLIST_ENTRY_TTL_DAYS is strictly before the new date to EXPIRED"

  # ---- MembershipPlan -------------------------------------------------------
  - method: POST
    path: "/peds/membership-plans"
    description: "Create a concierge plan tier."
    roles: [PracticeAdmin]
    code: 201
    input: [tier, monthly_rate_cents, included_lactation_consults, included_sleep_consults, form_sla_hours, after_hours_surcharge_waived, overage_consult_fee_cents]
    output: MembershipPlan
    side_effects: ["none"]
  - method: GET
    path: "/peds/membership-plans/{plan_id}"
    description: "Read one plan tier."
    roles: [PracticeAdmin, CareCoordinator, BillingSpecialist, Physician, Parent]
    code: 200
    input: []
    output: MembershipPlan
    side_effects: ["none"]

  # ---- Physician ------------------------------------------------------------
  - method: POST
    path: "/peds/physicians"
    description: "Create a panel physician with a weighted slot cap and a licensed-state set."
    roles: [PracticeAdmin]
    code: 201
    input: [full_name, panel_slot_cap, licensed_state_codes]
    output: Physician
    side_effects: ["none"]
  - method: GET
    path: "/peds/physicians/{physician_id}"
    description: "Read one physician including live weighted_occupancy and available_panel_weight."
    roles: [PracticeAdmin, CareCoordinator, BillingSpecialist, Physician, Parent]
    code: 200
    input: []
    output: Physician
    side_effects: ["recomputes weighted_occupancy against the current logical clock date"]
  - method: GET
    path: "/peds/physicians/{physician_id}/panel"
    description: "Computed read - the physician's panel occupancy summary."
    roles: [PracticeAdmin, CareCoordinator, Physician]
    code: 200
    input: []
    output: { physician_id: "string", panel_slot_cap: "number", weighted_occupancy: "number", available_panel_weight: "number", occupying_membership_count: "integer", waiting_entry_count: "integer" }
    side_effects: ["recomputes calculations.panel_weighted_occupancy"]

  # ---- Family ---------------------------------------------------------------
  - method: POST
    path: "/peds/families"
    description: "Create a household with its monthly billing cap."
    roles: [PracticeAdmin]
    code: 201
    input: [household_name, family_monthly_cap_cents]
    output: Family
    side_effects: ["none"]
  - method: GET
    path: "/peds/families/{family_id}"
    description: "Read one household. The `version` field is the OCC token for membership create and cancel."
    roles: [PracticeAdmin, BillingSpecialist, CareCoordinator, Parent]
    code: 200
    input: []
    output: Family
    side_effects: ["none"]

  # ---- InsurancePolicy ------------------------------------------------------
  - method: POST
    path: "/peds/insurance-policies"
    description: "Attach an insurance policy to a household."
    roles: [PracticeAdmin, BillingSpecialist]
    code: 201
    input: [family_id, carrier_name, deductible_cents, coinsurance_rate, "status?"]
    output: InsurancePolicy
    side_effects: ["none"]
  - method: GET
    path: "/peds/insurance-policies"
    description: "List insurance policies, filterable by household and status."
    roles: [PracticeAdmin, BillingSpecialist]
    code: 200
    input: ["family_id?", "status?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: ["none"]
  - method: GET
    path: "/peds/insurance-policies/{policy_id}"
    description: "Read one policy. The `version` field is the OCC token for service-line adjudication."
    roles: [PracticeAdmin, BillingSpecialist]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["none"]
  - method: POST
    path: "/peds/insurance-policies/{policy_id}/terminate"
    description: "Terminate an active policy. Already-routed insurance lines keep their policy_id but become unadjudicable."
    roles: [PracticeAdmin, BillingSpecialist]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status := TERMINATED", "increments InsurancePolicy.version by 1", "deductible_met_cents is preserved"]

  # ---- Child ----------------------------------------------------------------
  - method: POST
    path: "/peds/children"
    description: "Register a child in a household."
    roles: [PracticeAdmin, CareCoordinator]
    code: 201
    input: [family_id, first_name, date_of_birth]
    output: Child
    side_effects: ["none"]
  - method: GET
    path: "/peds/children"
    description: "List children, filterable by household."
    roles: [PracticeAdmin, CareCoordinator, Physician, BillingSpecialist, Parent]
    code: 200
    input: ["family_id?", "limit?", "offset?"]
    output: Child[]
    side_effects: ["none"]
  - method: GET
    path: "/peds/children/{child_id}"
    description: "Read one child including live age_days, current_slot_weight and immunization_complete_for_age."
    roles: [PracticeAdmin, CareCoordinator, Physician, BillingSpecialist, Parent]
    code: 200
    input: []
    output: Child
    side_effects: ["recomputes calculations.immunization_completeness_for_age against the current logical clock date"]

  # ---- Membership -----------------------------------------------------------
  - method: POST
    path: "/peds/memberships"
    description: "Enroll a child on a physician's panel. Guarded by OCC on Family.version."
    roles: [PracticeAdmin, CareCoordinator]
    code: 201
    input: [child_id, plan_id, physician_id, start_date, expected_family_version]
    output: Membership
    side_effects:
      - "increments Family.version by 1"
      - "occupies panel weight and enforces calculations.panel_weighted_occupancy"
      - "re-sequences and re-prices every sibling membership per calculations.sibling_ladder_rate"
      - "creates one EntitlementGrant per benefit_type at membership_year_index 0"
      - "generates WellVisit rows per calculations.well_visit_schedule_generation"
      - "creates the family's DRAFT Invoice for the cycle containing start_date when no Invoice exists for that family and cycle, then recomputes every DRAFT Invoice of the family per calculations.family_invoice_total; when an Invoice for that cycle already exists but is ISSUED or PAID it is left untouched and NO replacement invoice is created, so the new membership is simply unbilled for that already-closed cycle"
  - method: GET
    path: "/peds/memberships"
    description: "List memberships, filterable by household, child, plan, physician and status."
    roles: [PracticeAdmin, CareCoordinator, Physician, BillingSpecialist, Parent]
    code: 200
    input: ["family_id?", "child_id?", "plan_id?", "physician_id?", "status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: ["none"]
  - method: GET
    path: "/peds/memberships/{membership_id}"
    description: "Read one membership including live enrollment_sequence, discount_pct, monthly_rate_cents and slot_weight."
    roles: [PracticeAdmin, CareCoordinator, Physician, BillingSpecialist, Parent]
    code: 200
    input: []
    output: Membership
    side_effects: ["none"]
  - method: POST
    path: "/peds/memberships/{membership_id}/cancel"
    description: "Cancel a membership effective on a date inside the current cycle. Guarded by OCC on Family.version. Fires CASCADE A."
    roles: [PracticeAdmin, CareCoordinator]
    code: 200
    input: [effective_date, expected_family_version]
    output: Membership
    side_effects:
      - "increments Family.version by 1"
      - "runs the full CASCADE A chain declared on the Membership ACTIVE -> CANCELLED transition"
  - method: POST
    path: "/peds/memberships/{membership_id}/suspend"
    description: "Suspend a membership for non-payment. Requires a past-due ISSUED invoice on the family."
    roles: [PracticeAdmin, BillingSpecialist]
    code: 200
    input: [reason]
    output: Membership
    side_effects: ["sets suspension_reason", "panel weight and invoice lines are unchanged"]
  - method: POST
    path: "/peds/memberships/{membership_id}/reinstate"
    description: "Return a suspended membership to ACTIVE once no past-due ISSUED invoice remains."
    roles: [PracticeAdmin, BillingSpecialist]
    code: 200
    input: []
    output: Membership
    side_effects: ["clears suspension_reason"]

  # ---- PanelWaitlistEntry ---------------------------------------------------
  - method: POST
    path: "/peds/panel-waitlist-entries"
    description: "Queue a child for a full panel."
    roles: [PracticeAdmin, CareCoordinator, Parent]
    code: 201
    input: [physician_id, child_id, requested_plan_id]
    output: PanelWaitlistEntry
    side_effects: ["none"]
  - method: GET
    path: "/peds/panel-waitlist-entries"
    description: "List waitlist entries, filterable by physician, child, requested plan, promoted membership and status."
    roles: [PracticeAdmin, CareCoordinator, Parent]
    code: 200
    input: ["physician_id?", "child_id?", "requested_plan_id?", "promoted_membership_id?", "status?", "limit?", "offset?"]
    output: PanelWaitlistEntry[]
    side_effects: ["none"]
  - method: GET
    path: "/peds/panel-waitlist-entries/{waitlist_entry_id}"
    description: "Read one waitlist entry including live candidate_slot_weight."
    roles: [PracticeAdmin, CareCoordinator, Parent]
    code: 200
    input: []
    output: PanelWaitlistEntry
    side_effects: ["none"]
  - method: POST
    path: "/peds/panel-waitlist-entries/{waitlist_entry_id}/withdraw"
    description: "Withdraw a waiting entry from the queue."
    roles: [PracticeAdmin, CareCoordinator, Parent]
    code: 200
    input: []
    output: PanelWaitlistEntry
    side_effects: ["removes the entry from all future promotion selectors"]

  # ---- EntitlementGrant -----------------------------------------------------
  - method: GET
    path: "/peds/entitlement-grants"
    description: "List benefit pools, filterable by membership, benefit type, membership year and status."
    roles: [PracticeAdmin, CareCoordinator, BillingSpecialist, Parent]
    code: 200
    input: ["membership_id?", "benefit_type?", "membership_year_index?", "status?", "limit?", "offset?"]
    output: EntitlementGrant[]
    side_effects: ["none"]
  - method: GET
    path: "/peds/entitlement-grants/{grant_id}"
    description: "Read one benefit pool including the conserved counters."
    roles: [PracticeAdmin, CareCoordinator, BillingSpecialist, Parent]
    code: 200
    input: []
    output: EntitlementGrant
    side_effects: ["none"]

  # ---- ConsultBooking -------------------------------------------------------
  - method: POST
    path: "/peds/consult-bookings"
    description: "Book a lactation or sleep consult; consumes an entitlement unit or falls through to overage."
    roles: [CareCoordinator, PracticeAdmin, Parent]
    code: 201
    input: [membership_id, consult_type, consultant_physician_id, scheduled_start, scheduled_end, modality, patient_state_code]
    output: ConsultBooking
    side_effects:
      - "selects or creates the EntitlementGrant for the consult_type and membership year"
      - "sets coverage_route and moves booked_count or overage_count per calculations.entitlement_consumption"
      - "may transition the grant OPEN -> EXHAUSTED"
  - method: GET
    path: "/peds/consult-bookings"
    description: "List consult bookings, filterable by membership, grant, consultant and status."
    roles: [PracticeAdmin, CareCoordinator, Physician, BillingSpecialist, Parent]
    code: 200
    input: ["membership_id?", "grant_id?", "consultant_physician_id?", "status?", "limit?", "offset?"]
    output: ConsultBooking[]
    side_effects: ["none"]
  - method: GET
    path: "/peds/consult-bookings/{booking_id}"
    description: "Read one consult booking."
    roles: [PracticeAdmin, CareCoordinator, Physician, BillingSpecialist, Parent]
    code: 200
    input: []
    output: ConsultBooking
    side_effects: ["none"]
  - method: POST
    path: "/peds/consult-bookings/{booking_id}/reschedule"
    description: "Move a scheduled consult; capped at MAX_CONSULT_RESCHEDULES attempts."
    roles: [CareCoordinator, PracticeAdmin, Parent]
    code: 200
    input: [scheduled_start, scheduled_end]
    output: ConsultBooking
    side_effects: ["increments reschedule_count", "entitlement counters are unchanged"]
  - method: POST
    path: "/peds/consult-bookings/{booking_id}/complete"
    description: "Mark a consult delivered; burns the entitlement unit and produces its ServiceLine."
    roles: [CareCoordinator, PracticeAdmin, Physician]
    code: 200
    input: []
    output: ConsultBooking
    side_effects:
      - "moves booked_count to consumed_count on the ENTITLEMENT route"
      - "creates a ServiceLine in status SETTLED, routed COVERED_BY_MEMBERSHIP on the ENTITLEMENT route and PATIENT_RESPONSIBILITY on the OVERAGE route"
  - method: POST
    path: "/peds/consult-bookings/{booking_id}/cancel"
    description: "Cancel a scheduled consult; releases the entitlement hold. Fires CASCADE C."
    roles: [CareCoordinator, PracticeAdmin, Parent]
    code: 200
    input: []
    output: ConsultBooking
    side_effects:
      - "releases the hold - booked_count down, released_count up, available_count up"
      - "may transition the grant EXHAUSTED -> OPEN"

  # ---- WellVisit ------------------------------------------------------------
  - method: GET
    path: "/peds/well-visits"
    description: "List well visits, filterable by membership, child, milestone and status."
    roles: [PracticeAdmin, CareCoordinator, Physician, Parent]
    code: 200
    input: ["membership_id?", "child_id?", "milestone_code?", "status?", "limit?", "offset?"]
    output: WellVisit[]
    side_effects: ["none"]
  - method: GET
    path: "/peds/well-visits/{well_visit_id}"
    description: "Read one well visit including its window boundaries and punctuality."
    roles: [PracticeAdmin, CareCoordinator, Physician, Parent]
    code: 200
    input: []
    output: WellVisit
    side_effects: ["none"]
  - method: POST
    path: "/peds/well-visits/{well_visit_id}/schedule"
    description: "Book a due well visit for a date."
    roles: [CareCoordinator, PracticeAdmin]
    code: 200
    input: [scheduled_date]
    output: WellVisit
    side_effects: ["none"]
  - method: POST
    path: "/peds/well-visits/{well_visit_id}/complete"
    description: "Record a completed well visit and classify its punctuality against the periodicity window."
    roles: [Physician, PracticeAdmin]
    code: 200
    input: [completed_date]
    output: WellVisit
    side_effects:
      - "sets punctuality per calculations.well_visit_punctuality"
      - "creates a WELL_VISIT ServiceLine routed COVERED_BY_MEMBERSHIP in status SETTLED"
      - "refreshes the recency rung of calculations.form_issuance_gate for this membership"

  # ---- ImmunizationDose -----------------------------------------------------
  - method: POST
    path: "/peds/immunization-doses"
    description: "Record an administered dose; validity is evaluated immediately against the age and interval rungs."
    roles: [Physician, PracticeAdmin]
    code: 201
    input: [child_id, vaccine_code, administered_date]
    output: ImmunizationDose
    side_effects:
      - "computes effective_series_index, prior_valid_dose_id, interval_days_since_prior, validity and invalid_reason"
      - "recomputes Child.immunization_complete_for_age"
  - method: GET
    path: "/peds/immunization-doses"
    description: "List doses, filterable by child, vaccine, validity and prior-dose linkage."
    roles: [PracticeAdmin, CareCoordinator, Physician, Parent]
    code: 200
    input: ["child_id?", "vaccine_code?", "validity?", "prior_valid_dose_id?", "limit?", "offset?"]
    output: ImmunizationDose[]
    side_effects: ["none"]
  - method: GET
    path: "/peds/immunization-doses/{dose_id}"
    description: "Read one dose including its validity verdict and reason."
    roles: [PracticeAdmin, CareCoordinator, Physician, Parent]
    code: 200
    input: []
    output: ImmunizationDose
    side_effects: ["none"]
  - method: POST
    path: "/peds/immunization-doses/{dose_id}/invalidate"
    description: "Retrospectively invalidate a dose. Fires CASCADE B - the remaining series shifts and dependent form requests block."
    roles: [Physician, PracticeAdmin]
    code: 200
    input: [reason]
    output: ImmunizationDose
    side_effects:
      - "runs the full CASCADE B chain declared on the ImmunizationDose VALID -> INVALID manual transition"

  # ---- Encounter ------------------------------------------------------------
  - method: POST
    path: "/peds/encounters"
    description: "Open a sick visit, after-hours contact, routine question or newborn weight check. Computes the after-hours verdict."
    roles: [CareCoordinator, PracticeAdmin, Physician, Parent]
    code: 201
    input: [membership_id, encounter_type, modality, patient_state_code, started_at]
    output: Encounter
    side_effects:
      - "computes after_hours, after_hours_reason and surcharge_cents per calculations.after_hours_surcharge"
      - "sets clinical_status SCHEDULED and billing_status BILLING_PENDING"
  - method: GET
    path: "/peds/encounters"
    description: "List encounters, filterable by membership, child and either axis."
    roles: [PracticeAdmin, CareCoordinator, Physician, BillingSpecialist, Parent]
    code: 200
    input: ["membership_id?", "child_id?", "clinical_status?", "billing_status?", "limit?", "offset?"]
    output: Encounter[]
    side_effects: ["none"]
  - method: GET
    path: "/peds/encounters/{encounter_id}"
    description: "Read one encounter and both of its axes."
    roles: [PracticeAdmin, CareCoordinator, Physician, BillingSpecialist, Parent]
    code: 200
    input: []
    output: Encounter
    side_effects: ["none"]
  - method: POST
    path: "/peds/encounters/{encounter_id}/complete-clinical"
    description: "Advance only the clinical axis. The billing axis is neither read nor changed."
    roles: [Physician, PracticeAdmin]
    code: 200
    input: [clinical_note]
    output: Encounter
    side_effects: ["clinical_status := CLINICALLY_COMPLETE", "the encounter leaves the child's open-encounter overlap set"]
  - method: POST
    path: "/peds/encounters/{encounter_id}/submit-billing"
    description: "Advance only the billing axis. Creates the routed ServiceLines and stamps submitted_by_user_id for the segregation-of-duties check."
    roles: [BillingSpecialist, PracticeAdmin]
    code: 200
    input: []
    output: Encounter
    side_effects:
      - "billing_status := BILLING_ROUTED, then bubbles straight on to BILLING_CLOSED in the same response when every created line is born SETTLED"
      - "creates the primary ServiceLine and, when after_hours is true, the AFTER_HOURS_SURCHARGE line"
      - "assigns each line's route per calculations.service_line_route_assignment"
  - method: POST
    path: "/peds/encounters/{encounter_id}/cancel"
    description: "Cancel an encounter on both axes and void its service lines, reversing any deductible already consumed."
    roles: [CareCoordinator, PracticeAdmin, Physician]
    code: 200
    input: [reason]
    output: Encounter
    side_effects:
      - "clinical_status := CANCELLED and billing_status := BILLING_VOID"
      - "voids ServiceLines with status IN {ROUTED, ADJUDICATED} and restores InsurancePolicy.deductible_met_cents for the adjudicated ones"

  # ---- ServiceLine ----------------------------------------------------------
  - method: GET
    path: "/peds/service-lines"
    description: "List service lines, filterable by encounter, consult booking, well visit, membership, policy, route and status."
    roles: [PracticeAdmin, BillingSpecialist, Parent]
    code: 200
    input: ["encounter_id?", "consult_booking_id?", "well_visit_id?", "membership_id?", "policy_id?", "route?", "status?", "limit?", "offset?"]
    output: ServiceLine[]
    side_effects: ["none"]
  - method: GET
    path: "/peds/service-lines/{service_line_id}"
    description: "Read one service line and its full financial split."
    roles: [PracticeAdmin, BillingSpecialist, Parent]
    code: 200
    input: []
    output: ServiceLine
    side_effects: ["none"]
  - method: POST
    path: "/peds/service-lines/{service_line_id}/adjudicate"
    description: "Adjudicate an insurance-routed line. Guarded by OCC on InsurancePolicy.version and by segregation of duties."
    roles: [BillingSpecialist, PracticeAdmin]
    code: 200
    input: [allowed_amount_cents, expected_policy_version, "patient_responsibility_override_cents?"]
    output: ServiceLine
    side_effects:
      - "runs the insurance_route variant of calculations.service_line_financial_split"
      - "increases InsurancePolicy.deductible_met_cents by deductible_applied_cents and increments InsurancePolicy.version by 1"
  - method: POST
    path: "/peds/service-lines/{service_line_id}/settle"
    description: "Settle an adjudicated line with exact payment; may bubble the parent encounter's billing axis to BILLING_CLOSED."
    roles: [BillingSpecialist, PracticeAdmin]
    code: 200
    input: [payment_received_cents]
    output: ServiceLine
    side_effects: ["status := SETTLED", "may transition the parent Encounter BILLING_ROUTED -> BILLING_CLOSED"]

  # ---- Invoice --------------------------------------------------------------
  - method: POST
    path: "/peds/invoices"
    description: "Open a DRAFT invoice for a household and a calendar month; membership enrollment opens the current cycle's invoice automatically."
    roles: [BillingSpecialist, PracticeAdmin]
    code: 201
    input: [family_id, cycle_start_date]
    output: Invoice
    side_effects: ["builds lines, subtotal_cents, cap_adjustment_cents and total_cents per calculations.family_invoice_total"]
  - method: GET
    path: "/peds/invoices"
    description: "List invoices, filterable by household, status and cycle."
    roles: [PracticeAdmin, BillingSpecialist, Parent]
    code: 200
    input: ["family_id?", "status?", "cycle_start_date?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: ["none"]
  - method: GET
    path: "/peds/invoices/{invoice_id}"
    description: "Read one invoice including its per-child lines and the family-cap waterfall."
    roles: [PracticeAdmin, BillingSpecialist, Parent]
    code: 200
    input: []
    output: Invoice
    side_effects: ["none"]
  - method: POST
    path: "/peds/invoices/{invoice_id}/issue"
    description: "Issue a draft invoice and freeze its lines."
    roles: [BillingSpecialist, PracticeAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["sets issued_date and due_date", "the invoice stops being recomputed by membership changes"]
  - method: POST
    path: "/peds/invoices/{invoice_id}/pay"
    description: "Settle an issued invoice in full. Activates every PENDING_ACTIVATION membership whose start_date falls in the paid cycle."
    roles: [BillingSpecialist, PracticeAdmin]
    code: 200
    input: [amount_paid_cents]
    output: Invoice
    side_effects: ["sets paid_date", "transitions matching Memberships PENDING_ACTIVATION -> ACTIVE"]

  # ---- FormRequest ----------------------------------------------------------
  - method: POST
    path: "/peds/form-requests"
    description: "Request a school, camp or sports form. A failing gate produces a BLOCKED row rather than an error."
    roles: [CareCoordinator, PracticeAdmin, Parent]
    code: 201
    input: [membership_id, form_type, needed_by_date]
    output: FormRequest
    side_effects: ["evaluates calculations.form_issuance_gate", "sets due_at from the plan's form_sla_hours"]
  - method: GET
    path: "/peds/form-requests"
    description: "List form requests, filterable by membership, child and status."
    roles: [PracticeAdmin, CareCoordinator, Physician, Parent]
    code: 200
    input: ["membership_id?", "child_id?", "status?", "limit?", "offset?"]
    output: FormRequest[]
    side_effects: ["none"]
  - method: GET
    path: "/peds/form-requests/{form_request_id}"
    description: "Read one form request including blocked_reason, due_at and sla_met."
    roles: [PracticeAdmin, CareCoordinator, Physician, Parent]
    code: 200
    input: []
    output: FormRequest
    side_effects: ["none"]
  - method: POST
    path: "/peds/form-requests/{form_request_id}/issue"
    description: "Issue a pending form after re-evaluating the gate. A gate that now fails moves the request to BLOCKED and returns 200, not an error."
    roles: [Physician, PracticeAdmin]
    code: 200
    input: []
    output: FormRequest
    side_effects: ["sets issued_at and sla_met on success", "moves the request to BLOCKED when the gate now fails"]
  - method: POST
    path: "/peds/form-requests/{form_request_id}/recheck"
    description: "Re-evaluate a blocked form request; a satisfied gate returns it to PENDING."
    roles: [CareCoordinator, PracticeAdmin, Physician]
    code: 200
    input: []
    output: FormRequest
    side_effects: ["updates blocked_reason or clears it and returns the request to PENDING"]

# =============================================================================
# Table 1.6: Error Code Catalog  (30 codes)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,        http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE,         http: 403, condition: "the acting role is not listed in the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER,     http: 403, condition: "a Parent acts on a resource outside their own Family, or a Physician acts clinically on a membership assigned to another physician" }
  - { id: ERR_SEGREGATION_OF_DUTIES,  http: 403, condition: "the X-User-ID adjudicating a ServiceLine equals that line's submitted_by_user_id" }
  - { id: ERR_FAMILY_NOT_FOUND,       http: 404, condition: "a family_id in the path or body does not resolve" }
  - { id: ERR_CHILD_NOT_FOUND,        http: 404, condition: "a child_id in the path or body does not resolve" }
  - { id: ERR_PLAN_NOT_FOUND,         http: 404, condition: "a plan_id or requested_plan_id does not resolve" }
  - { id: ERR_PHYSICIAN_NOT_FOUND,    http: 404, condition: "a physician_id or consultant_physician_id does not resolve" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND,   http: 404, condition: "a membership_id in the path or body does not resolve" }
  - { id: ERR_RESOURCE_NOT_FOUND,     http: 404, condition: "an insurance policy, waitlist entry, entitlement grant, consult booking, well visit, immunization dose, encounter, service line, invoice or form request id does not resolve" }
  - { id: ERR_VALIDATION,             http: 400, condition: "a required field is missing, a value has the wrong type, a numeric range is violated, or an exact-settlement amount does not match the balance owed" }
  - { id: ERR_INVALID_ENUM,           http: 400, condition: "an enum-typed field carries a value outside its declared member set" }
  - { id: ERR_INVALID_DATE_RANGE,     http: 400, condition: "scheduled_end is not after scheduled_start, cycle_start_date is not the 1st of a month, a membership start_date or cancel effective_date falls outside the permitted window, or the clock is moved backwards" }
  - { id: ERR_STALE_VERSION,          http: 412, condition: "expected_family_version does not match Family.version, or expected_policy_version does not match InsurancePolicy.version" }
  - { id: ERR_INVALID_STATE,          http: 409, condition: "the target resource's current state does not permit the requested transition, including any transition attempted out of a terminal state" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE,  http: 409, condition: "an operation requiring an ACTIVE membership is attempted while the membership is PENDING_ACTIVATION, SUSPENDED or CANCELLED" }
  - { id: ERR_ENROLLMENT_INVOICE_UNPAID, http: 409, condition: "reinstatement is attempted while a past-due ISSUED invoice remains, or suspension is attempted with no past-due ISSUED invoice" }
  - { id: ERR_POLICY_INACTIVE,        http: 409, condition: "adjudication is attempted against an InsurancePolicy whose status is TERMINATED" }
  - { id: ERR_LICENSURE_NOT_COVERED,  http: 422, condition: "a TELEHEALTH encounter or consult names a patient_state_code outside the responsible physician's licensed_state_codes" }
  - { id: ERR_MODALITY_NOT_ALLOWED,   http: 422, condition: "an encounter_type listed in TELEHEALTH_PROHIBITED_ENCOUNTER_TYPES is requested with modality TELEHEALTH" }
  - { id: ERR_FUTURE_DATED,           http: 422, condition: "date_of_birth, administered_date, completed_date or started_at lies after the current logical clock" }
  - { id: ERR_SCHEDULE_CONFLICT,      http: 409, condition: "a consult interval collides with another SCHEDULED booking on the same consultant once the 15-minute turnaround buffer is applied" }
  - { id: ERR_ENCOUNTER_OVERLAP,      http: 409, condition: "a new encounter's closed 30-minute interval overlaps an existing SCHEDULED encounter for the same child" }
  - { id: ERR_DUPLICATE_MEMBERSHIP,   http: 409, condition: "the child already holds a Membership with status PENDING_ACTIVATION, ACTIVE or SUSPENDED" }
  - { id: ERR_DUPLICATE_WAITLIST_ENTRY, http: 409, condition: "a WAITING waitlist entry already exists for this physician and child, a MembershipPlan already carries the requested tier, or an Invoice already exists for this family and cycle" }
  - { id: ERR_PANEL_CAPACITY_EXCEEDED, http: 409, condition: "weighted_occupancy plus the candidate's slot weight would exceed the physician's panel_slot_cap" }
  - { id: ERR_RESCHEDULE_LIMIT_REACHED, http: 409, condition: "a consult booking has already been rescheduled MAX_CONSULT_RESCHEDULES times" }
  - { id: ERR_ROUTE_NOT_ADJUDICABLE,  http: 422, condition: "adjudication is attempted on a line whose route is COVERED_BY_MEMBERSHIP or PATIENT_RESPONSIBILITY" }
  - { id: ERR_BALANCE_BILLING_BLOCKED, http: 422, condition: "patient_responsibility_override_cents exceeds deductible_applied_cents plus coinsurance_cents derived from allowed_amount_cents" }
  - { id: ERR_FORM_GATE_NOT_MET,      http: 409, condition: "issuance is attempted on a form request whose status is BLOCKED" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PracticeAdmin
    description: "Practice operator. Owns configuration (plans, physicians, households, children), the logical clock, and holds an override on every clinical and billing action except the segregation-of-duties rule, which binds every role."
    identity: opaque
    exclusive_operations:
      - "POST /peds/_clock/set_current_utc"
      - "POST /peds/membership-plans"
      - "POST /peds/physicians"
      - "POST /peds/families"
    shared_operations:
      - "POST /peds/children (with CareCoordinator)"
      - "POST /peds/memberships and POST /peds/memberships/{id}/cancel (with CareCoordinator)"
      - "POST /peds/memberships/{id}/suspend and /reinstate (with BillingSpecialist)"
      - "every insurance, invoice and service-line operation (with BillingSpecialist)"
      - "every clinical operation (with Physician)"
      - "every scheduling operation (with CareCoordinator)"

  - name: Physician
    description: "Panel clinician. Records immunization doses, invalidates them, completes well visits, advances the clinical axis of encounters, and signs school and camp forms."
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /peds/immunization-doses/{dose_id}/invalidate (shared only with PracticeAdmin)"
      - "POST /peds/well-visits/{well_visit_id}/complete (shared only with PracticeAdmin)"
      - "POST /peds/encounters/{encounter_id}/complete-clinical (shared only with PracticeAdmin)"
      - "POST /peds/form-requests/{form_request_id}/issue (shared only with PracticeAdmin)"
    shared_operations:
      - "POST /peds/immunization-doses (with PracticeAdmin)"
      - "POST /peds/consult-bookings/{booking_id}/complete (with CareCoordinator and PracticeAdmin)"
      - "POST /peds/encounters and POST /peds/encounters/{id}/cancel (with CareCoordinator and PracticeAdmin)"
      - "POST /peds/form-requests/{id}/recheck (with CareCoordinator and PracticeAdmin)"
      - "read access to children, memberships, well visits, doses, encounters, consult bookings and form requests"

  - name: CareCoordinator
    description: "Front-office scheduler. Registers children, enrolls and cancels memberships, manages the panel waitlist, books consults and well visits, and intakes form requests."
    identity: opaque
    exclusive_operations:
      - "POST /peds/well-visits/{well_visit_id}/schedule (shared only with PracticeAdmin)"
      - "POST /peds/consult-bookings/{booking_id}/reschedule (shared with PracticeAdmin and Parent)"
    shared_operations:
      - "POST /peds/children (with PracticeAdmin)"
      - "POST /peds/memberships and POST /peds/memberships/{id}/cancel (with PracticeAdmin)"
      - "waitlist create, list, read and withdraw (with PracticeAdmin and Parent)"
      - "consult booking create, complete and cancel (with PracticeAdmin, Parent and Physician)"
      - "form request create and recheck (with PracticeAdmin, Parent and Physician)"
      - "POST /peds/encounters and POST /peds/encounters/{id}/cancel (with PracticeAdmin and Physician)"

  - name: BillingSpecialist
    description: "Revenue-cycle operator. Attaches insurance policies, submits encounter charges, adjudicates and settles service lines, and drives the invoice lifecycle. Never adjudicates a line they themselves submitted."
    identity: opaque
    exclusive_operations:
      - "POST /peds/insurance-policies (shared only with PracticeAdmin)"
      - "POST /peds/encounters/{encounter_id}/submit-billing (shared only with PracticeAdmin)"
      - "POST /peds/service-lines/{service_line_id}/adjudicate and /settle (shared only with PracticeAdmin)"
      - "POST /peds/invoices, /issue and /pay (shared only with PracticeAdmin)"
    shared_operations:
      - "POST /peds/memberships/{id}/suspend and /reinstate (with PracticeAdmin)"
      - "read access to families, children, memberships, entitlement grants, consult bookings, encounters, service lines and invoices"

  - name: Parent
    description: "Household member. X-User-ID is the id of the Family the parent belongs to. May queue for a panel, book and cancel consults, open encounters, request forms, and read everything scoped to their own household."
    identity: "entity_backed:Family"
    exclusive_operations: []
    shared_operations:
      - "POST /peds/panel-waitlist-entries and /withdraw (with CareCoordinator and PracticeAdmin)"
      - "POST /peds/consult-bookings, /reschedule and /cancel (with CareCoordinator and PracticeAdmin)"
      - "POST /peds/encounters (with CareCoordinator, Physician and PracticeAdmin)"
      - "POST /peds/form-requests (with CareCoordinator and PracticeAdmin)"
      - "read access to their own family, children, memberships, entitlement grants, consult bookings, well visits, doses, encounters, service lines, invoices and form requests"
