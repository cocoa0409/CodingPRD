              as: FulfillmentAgent
              captures: { ord2: $.data.id }
          assert:
            - "at logical_date == 2026-09-21 (= earliest_refill_date - 1): ERR_REFILL_TOO_EARLY"
            - "at logical_date == 2026-09-22 (= earliest_refill_date exactly): order created, fulfillment_status == PENDING_PICK"

      - name: warranty_failure_day_index_at_wear_days_minus_one_vs_equal
        grounds:
