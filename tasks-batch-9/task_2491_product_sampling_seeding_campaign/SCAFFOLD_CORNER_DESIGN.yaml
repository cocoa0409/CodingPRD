          rationale: "The named §1.8 instance tests the half-open [window_start, window_end) overlap rule for the center aggregate, including the touching-but-not-overlapping case."

      - name: fraud_risk_weighted_terms_sum_without_drift
        claim_type: weighted_scoring
        grounds:
