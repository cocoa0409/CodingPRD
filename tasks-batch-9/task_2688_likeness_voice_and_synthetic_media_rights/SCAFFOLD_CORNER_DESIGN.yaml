              as: RightsAdministrator
              captures: { g_id: $.data.id }
            - call: "POST /consent-grants/${g_id}/countersign"
              payload: {}
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "POST /biometric-assets"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", asset_kind: "VOICE_SAMPLE", capture_ref: "cap-001", storage_class: "ENCRYPTED_VAULT", payload_digest: "sha256:aaa" }
              as: RightsAdministrator
              captures: { a1_id: $.data.id }
            - call: "POST /digital-replicas"
              payload: { talent_id: "${t_id}", consent_grant_id: "${g_id}", replica_kind: "VOICE_CLONE", source_asset_ids: ["${a1_id}"], build_ref: "build-001" }
              as: RightsAdministrator
              captures: { r_id: $.data.id }
            - call: "POST /digital-replicas/${r_id}/approve-for-use"
              payload: { approval_note: "voice cleared" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
              captures: { r_v: $.data.version }
            - call: "POST /generated-performances"
              payload: { digital_replica_id: "${r_id}", licensee_name: "Northlight Ads", media_type: "ADVERTISING", territory_codes: ["US"], intended_use_description: "Spring spot", projected_impressions: 500000, scheduled_first_use_at: "2026-09-01T00:00:00Z" }
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { p_id: $.data.id }
            - call: "POST /generated-performances/${p_id}/review"
              payload: { decision: "APPROVE", review_note: "cleared" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
            - call: "POST /usage-licenses"
              payload: { generated_performance_id: "${p_id}", channel: "ADVERTISING", territory_codes: ["US"], distribution_start: "2026-08-01T00:00:00Z", distribution_end: "2026-12-01T00:00:00Z", actual_impressions: 500000, expected_replica_version: "${r_v}" }
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /usage-licenses/${l_id}/confirm-removal"
              payload: {}
              as: LicenseeProducer
              as_user_id: "lic-001"
            - call: "POST /usage-licenses/${l_id}/go-live"
              payload: { distribution_reference: "flight-1" }
              as: LicenseeProducer
              as_user_id: "lic-001"
            - call: "POST /usage-licenses/${l_id}/disclosure"
              payload: { disclosure_placement: "PRE_ROLL", disclosure_label_text: "Synthetic performance" }
              as: LicenseeProducer
              as_user_id: "lic-001"
            - call: "POST /usage-licenses/${l_id}/disclosure-verification"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /usage-licenses/${l_id}/disclosure"
              payload: { disclosure_placement: "PERSISTENT_BUG", disclosure_label_text: "Second attestation" }
              as: LicenseeProducer
              as_user_id: "lic-001"
