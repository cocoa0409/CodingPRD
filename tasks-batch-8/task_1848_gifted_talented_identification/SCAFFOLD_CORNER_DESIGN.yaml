  # ============================================================ validations
  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role, existence, or business check."
        test_recipe:
          setup: ["none — the request is unauthenticated (the test omits both X-User-* headers)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /gifted/students/00000000-0000-0000-0000-000000000000", as: GiftedCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400), not 404 — auth precedes existence"

      - name: case_intake_requires_open_cycle
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_CYCLE_NOT_OPEN]
        distinguishing_aspect: "Creating a case while the cycle is DRAFT fails with ERR_CYCLE_NOT_OPEN (409) — intake is gated on the OPEN state, not on the screening window dates."
        test_recipe:
          setup: ["site; student; cycle in DRAFT (no profile, never advanced)"]
