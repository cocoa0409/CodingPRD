    output: ManufacturerDeal[]
    side_effects: []
  - method: POST
    path: "/manufacturer-deals/{deal_id}/activate"
    description: "Activate a DRAFT deal once at least one ACTIVE item carries an APPROVED rate card."
    roles: [GpoAdmin]
    code: 200
    input: []
