  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_refund_conserves_fee_paid_ledger
        grounds:
          - calculations.compute_refund_due
          - state_machines.Application.DRAFT_to_WITHDRAWN
          - entities.Application.fields.fee_paid_cents
          - entities.FeeTransaction.fields.amount_cents
        distinguishing_aspect: "Conserved quantity = cents: fee_paid_cents MUST always equal sum(PAYMENT.amount_cents) - sum(REFUND.amount_cents). Pay 7800 (SUBMITTED) then withdraw triggers a full 7800 REFUND, so fee_paid_cents returns to 0 with no drift."
        test_recipe:
          setup:
            - "Clock 2026-06-09T12:00:00Z; PRECHECK Program base 7800."
            - "Application SUBMITTED with one PAYMENT of 7800 -> fee_paid_cents=7800."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Tina Money", date_of_birth: "1990-09-20", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "GET /applications/${app_id}"
              payload: {}
              as: SchedulingAdmin
              captures: { app_v: $.data.version }
          trigger:
            - call: "POST /applications/${app_id}/withdraw"
              payload: { expected_application_version: "${app_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
          assert:
            - "Application.${app_id}.status == WITHDRAWN"
            - "Application.${app_id}.fee_paid_cents == 0"

      - name: book_cancel_conserves_slot_occupancy_count
        grounds:
          - state_machines.AppointmentSlot.AVAILABLE_to_BOOKED
          - state_machines.AppointmentSlot.BOOKED_to_AVAILABLE
          - state_machines.Appointment.CONFIRMED_to_CANCELLED
          - entities.AppointmentSlot.fields.status
        distinguishing_aspect: "Conserved quantity = slot count: among non-RELEASED slots, count(AVAILABLE)+count(BOOKED) is invariant. Booking moves the slot AVAILABLE->BOOKED; cancelling the appointment is the compensating action that returns it BOOKED->AVAILABLE, so the AVAILABLE count returns to its pre-booking value (different conserved quantity than cents)."
        test_recipe:
          setup:
            - "Clock 2026-06-09T12:00:00Z; PRECHECK Program; OPEN center capacity 10 lane 1, ONE slot S (AVAILABLE)."
            - "Application CLEARED, slot S booked -> S BOOKED, Appointment CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
