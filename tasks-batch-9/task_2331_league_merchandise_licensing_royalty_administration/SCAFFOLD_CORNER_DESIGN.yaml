              payload: { action: "APPROVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/agreements/${agr_q3}"
              as: FinanceController
              captures: { agr_q3_v1: $.data.version }
