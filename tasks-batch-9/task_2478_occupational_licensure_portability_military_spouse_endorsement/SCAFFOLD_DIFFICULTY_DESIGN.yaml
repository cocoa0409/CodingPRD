          trigger:
            - call: "POST /licensure/credential-evaluations/${ev_x}/finalize"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "anl_1"
            - call: "POST /licensure/credential-evaluations/${ev_y}/finalize"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "anl_1"
          assert:
            - "CredentialEvaluation.${ev_x}.equivalency_score == 70.00 and CredentialEvaluation.${ev_x}.exam_waiver_granted == true"
            - "CredentialEvaluation.${ev_y}.equivalency_score == 69.99 and CredentialEvaluation.${ev_y}.exam_waiver_granted == false"
            - "CredentialEvaluation.${ev_x}.scope_review_status == EQUIVALENT and CredentialEvaluation.${ev_y}.scope_review_status == EQUIVALENT"
            - "CredentialEvaluation.${ev_x}.missing_scope_elements == [PRESCRIBE] yet no critical-miss penalty was applied to either arm"
            - "LicenseApplication.${app_x}.fee_balance_cents == 26000 (one EXAM_FEE_REVERSAL with amount_cents == -6000)"
            - "LicenseApplication.${app_y}.fee_balance_cents == 32000 (no EXAM_FEE_REVERSAL entry exists for ${app_y})"

      - name: permit_half_open_boundary_touching_start_admitted_one_second_earlier_collides
        grounds:
          - validations.priority_30_ERR_PERMIT_WINDOW_OVERLAP
          - calculations.permit_window
          - entities.TemporaryPermit.fields.effective_at
          - entities.TemporaryPermit.fields.expires_at
        distinguishing_aspect: |
          The overlap comparison is half-open on [effective_at, expires_at) with a zero-second buffer,
          so a new permit starting at exactly the incumbent's expires_at (2026-10-30T00:00:00Z) is
          admitted while one starting a single second earlier (2026-10-29T23:59:59Z) collides. Only a
          strict `<` on the incumbent's end instant separates the two, and both calls reuse the same
          captured application version to prove the rejection consumed no version.
        test_recipe:
          setup:
            - "Profession RN (permit_fee_cents 6000, standard_processing_days 90); non-military TX applicant with no disciplinary history."
            - "ENDORSEMENT application submitted (gross 48000) and paid to 0, with a CredentialEvaluation so it is UNDER_REVIEW."
            - "review_deadline_at is 2026-10-30T00:00:00Z, so the ENDORSEMENT grace cap for a later permit lands on 2026-11-29T00:00:00Z."
            - "Permit #1 is effective 2026-08-01T00:00:00Z with expires_at 2026-10-30T00:00:00Z (the 90-day pathway cap), and its 6000-cent fee is paid down to 0."
