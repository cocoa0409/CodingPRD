            - { call: "POST /hotline/callers", payload: { alias: "caller-2", phone: "+15550002", preferred_language: "es", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal2: $.data.id } }
            - { call: "POST /hotline/callers", payload: { alias: "caller-3", phone: "+15550003", preferred_language: "es", channel: "PHONE", is_anonymous: false }, as: Anonymous, captures: { cal3: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal1}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sess1: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal2}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sess2: $.data.id } }
            - { call: "POST /hotline/sessions", payload: { caller_id: "${cal3}", jurisdiction_id: "${jur}", issue_category: "EVICTION" }, as: Anonymous, captures: { sess3: $.data.id } }
          trigger:
            - { call: "POST /hotline/sessions/${sess1}/interpretation", payload: { to_status: "REQUESTED", interpreter_id: "${interp}", scheduled_start_at: "2026-08-02T10:00:00Z", scheduled_end_at: "2026-08-02T11:00:00Z" }, as: Counselor, as_user_id: "${wk}", captures: { i1: $.data.interpretation_status } }
            - { call: "POST /hotline/sessions/${sess2}/interpretation", payload: { to_status: "REQUESTED", interpreter_id: "${interp}", scheduled_start_at: "2026-08-02T11:05:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: Counselor, as_user_id: "${wk}", captures: { err: $.data.error_id } }
            - { call: "POST /hotline/sessions/${sess3}/interpretation", payload: { to_status: "REQUESTED", interpreter_id: "${interp}", scheduled_start_at: "2026-08-02T11:10:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: Counselor, as_user_id: "${wk}", captures: { i3: $.data.interpretation_status } }
          assert:
            - "S1 request accepted: interpretation_status == REQUESTED (window 10:00-11:00)"
            - "S2 request at 11:05 rejected: error_id == ERR_INTERPRETER_OVERLAP (11:05 < 11:00 + 10-minute buffer)"
            - "S3 request at 11:10 accepted: interpretation_status == REQUESTED — exactly BUFFER_MINUTES after the prior window's end is the non-conflicting boundary (strict < arithmetic)"

      - name: org_iso_week_boundary
        grounds:
          - calculations.org_weekly_capacity
          - state_machines.Referral.PROPOSED_to_DISPATCHED
          - errors[ERR_ORG_CAPACITY_FULL]
        distinguishing_aspect: |
          Interval semantics: aggregate capacity over half-open ISO-week
          windows on the LegalAidOrg resource (not pairwise overlap). A dispatch
          on Saturday 2026-08-01 fills week W1's single slot; the same org
          rejects a second dispatch in W1; moving the clock to exactly Monday
          2026-08-03T00:00:00Z opens week W2 — the boundary instant belongs to
          the NEW week — and the same referral dispatches.
        test_recipe:
          setup:
            - "Clock default 2026-08-01T00:00:00Z (Saturday, ISO week W1 = 2026-07-27T00:00:00Z .. 2026-08-03T00:00:00Z); CA; EVICTION script published; trained counselor; identified caller; org cap 1; STANDARD case IN_PROGRESS (sla 168h); consent granted; referrals R1, R2 PROPOSED (case version refreshed between creates)"
