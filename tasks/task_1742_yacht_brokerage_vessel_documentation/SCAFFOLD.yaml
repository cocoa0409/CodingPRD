    side_effects: []
  - method: POST
    path: "/yacht/agents"
    description: "Onboard a broker agent under a brokerage"
    roles: [PlatformAdmin]
    code: 201
    input: [brokerage_id, full_name, license_no, split_pct_basis]
    output: BrokerAgent
    side_effects: []
  - method: GET
    path: "/yacht/agents/{id}"
    description: "Fetch one agent"
    roles: [PlatformAdmin, ListingAgent, SellingAgent, ClosingOfficer, EscrowOfficer]
    code: 200
    input: []
    output: BrokerAgent
    side_effects: []
  - method: GET
    path: "/yacht/agents"
    description: "List agents, filterable by brokerage"
