      - name: new_dealer_starts_not_listed_with_zero_strikes
        claim_type: initial_state
        grounds:
          - state_machines[Dealer.listing_status initial NOT_LISTED]
          - entities.Dealer.fields.icssl_listed_through
          - entities.Dealer.fields.recall_strike_count
        distinguishing_aspect: |
          Certification and interstate listing are separate dimensions: a freshly certified dealer is
          certified_through 2027-06-30 yet listing_status NOT_LISTED with icssl_listed_through null,
          so it can receive shellstock but cannot yet release an interstate shipment.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock call."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
          trigger:
            - call: "POST /shellfish/dealers"
              payload: { name: "Coastal Shellstock", state_code: "NC", certification_category: "SHELLSTOCK_SHIPPER", certification_no: "NC-1234-SS", certified_through: "2027-06-30" }
              as: ShellfishControlAuthority
          assert:
            - "HTTP 201 with data.listing_status == NOT_LISTED"
            - "data.certified_through == 2027-06-30 and data.icssl_listed_through == null"
            - "data.recall_strike_count == 0 and data.suspension_reason == null"
            - "data.version == 1"

      - name: traceback_on_a_closed_unsubstantiated_investigation_returns_invalid_investigation_state
        claim_type: terminal_state_lockdown
        grounds:
          - validations[priority=37]
          - errors[ERR_INVALID_INVESTIGATION_STATE]
          - state_machines[IllnessInvestigation.status terminal CLOSED_UNSUBSTANTIATED]
        distinguishing_aspect: |
          CLOSED_UNSUBSTANTIATED is terminal, so an investigation closed straight from OPEN can
          never be re-tracebacked or confirmed — and because it was closed before any traceback ran,
          traced_lot_count stays 0 and no lot or shipment is ever recalled.
        test_recipe:
          setup:
            - "The standard active-authorization fixture; clock advanced to 2026-08-10T11:00:00Z; one COMPLIANT lot LOT-A (10 bushels) landed and tagged; shipment SH-1 to VA SHIPPED at 2026-08-10T10:50:00Z."
            - "Clock advanced to 2026-08-11T09:00:00Z and an IllnessInvestigation opened on SH-1 (reported_at 2026-08-11T08:00:00Z, 3 illnesses, VIBRIO_PARAHAEMOLYTICUS), then closed as unsubstantiated straight from OPEN."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
