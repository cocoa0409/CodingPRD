# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: correctional-food-service-operations   api_prefix: /cfs
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# Every literal in every `assert:` was computed by executing the named
# calculations[].formula against its constants[] before it was written here.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: forecast_count_driven_vs_roster_driven_diverge_on_stale_count_feed
        grounds:
          - calculations.meal_forecast_trays
          - entities.MealForecast.fields.forecast_variant
          - entities.PopulationCount.fields.general_population
          - entities.Inmate.fields.housing_unit
        distinguishing_aspect: |
          The dual variant sits on the tray-forecasting domain (MealForecast over PopulationCount and
          Inmate rows): one PopulationCount row of general 10 / segregation 2 / satellite 1 / medical 0
          and a roster of exactly 2 GENERAL + 1 SEGREGATION inmates make COUNT_DRIVEN produce
          line_trays 14 and total_forecast_trays 22 while ROSTER_DRIVEN produces line_trays 3 and
          total_forecast_trays 11 from identical stored data.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ServiceContract CFS-2515-DV1 in status ACTIVE with one Facility FAC-DV1 (satellite_site_count 0, blast_chiller_capacity 2, sharps_authorized_count 12)."
            - "MenuCycle CYC-1 at FAC-DV1 in status ACTIVE with 3 items (1-day cycle), approved_kcal_per_meal_day 2800 and approved_cost_cents_per_meal_day 315."
            - "Roster at FAC-DV1: exactly 3 IN_CUSTODY inmates - 2 with housing_unit GENERAL and 1 with housing_unit SEGREGATION. No SATELLITE and no MEDICAL inmates exist."
            - "One PopulationCount row at FAC-DV1 from a FORMAL_COUNT feed claiming general 10, segregation 2, satellite 1, medical 0 - i.e. the count feed is stale relative to the roster."
            - "No DietOrder rows exist, so forecast_special_diet_trays is 0 for both variants."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-DV1", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-DV1", name: "North Unit Kitchen", sharps_authorized_count: 12, satellite_site_count: 0, blast_chiller_capacity: 2 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/menu-cycles"
              payload: { facility_id: "${facility_id}", cycle_code: "CYC-1", cycle_length_days: 1 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { cycle_id: $.data.id }
            - call: "POST /cfs/menu-cycles/${cycle_id}/items"
              payload: { cycle_day: 1, meal_slot: "BREAKFAST", component_name: "Oatmeal Bake", kcal_per_100g: 421.0, protein_grams_per_100g: 20.0, sodium_mg_per_100g: 600.0, portion_grams: 50, raw_cost_cents: 95 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/menu-cycles/${cycle_id}/items"
              payload: { cycle_day: 1, meal_slot: "LUNCH", component_name: "Turkey Casserole", kcal_per_100g: 306.0, protein_grams_per_100g: 8.0, sodium_mg_per_100g: 400.0, portion_grams: 225, raw_cost_cents: 110 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/menu-cycles/${cycle_id}/items"
              payload: { cycle_day: 1, meal_slot: "DINNER", component_name: "Bean Rice Bowl", kcal_per_100g: 380.0, protein_grams_per_100g: 6.1, sodium_mg_per_100g: 160.0, portion_grams: 500, raw_cost_cents: 110 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/menu-cycles/${cycle_id}/nutrition-sign"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
            - call: "POST /cfs/menu-cycles/${cycle_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-0001", housing_unit: "GENERAL" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-0002", housing_unit: "GENERAL" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-0003", housing_unit: "SEGREGATION" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
            - call: "POST /cfs/population-counts"
              payload: { facility_id: "${facility_id}", general_population: 10, segregation_population: 2, satellite_population: 1, medical_population: 0, source: "FORMAL_COUNT" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { count_id: $.data.id }
          trigger:
            - call: "POST /cfs/meal-forecasts"
              payload: { facility_id: "${facility_id}", population_count_id: "${count_id}", service_date: "2026-08-02", meal_slot: "BREAKFAST", forecast_variant: "COUNT_DRIVEN" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { fc_count_id: $.data.id, fc_count_line: $.data.line_trays, fc_count_total: $.data.total_forecast_trays }
            - call: "POST /cfs/meal-forecasts"
              payload: { facility_id: "${facility_id}", population_count_id: "${count_id}", service_date: "2026-08-02", meal_slot: "LUNCH", forecast_variant: "ROSTER_DRIVEN" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { fc_roster_id: $.data.id, fc_roster_line: $.data.line_trays, fc_roster_total: $.data.total_forecast_trays }
          assert:
            - "MealForecast.${fc_count_id}.line_trays == 14"
            - "MealForecast.${fc_count_id}.waste_allowance_trays == 8"
            - "MealForecast.${fc_count_id}.total_forecast_trays == 22"
            - "MealForecast.${fc_roster_id}.line_trays == 3"
            - "MealForecast.${fc_roster_id}.waste_allowance_trays == 8"
            - "MealForecast.${fc_roster_id}.total_forecast_trays == 11"
            - "MealForecast.${fc_count_id}.total_forecast_trays - MealForecast.${fc_roster_id}.total_forecast_trays == 11"
            - "MealForecast.${fc_count_id}.forecast_special_diet_trays == 0 and MealForecast.${fc_roster_id}.forecast_special_diet_trays == 0"
            - "PopulationCount.${count_id}.total_population == 13 (unchanged by either forecast)"

      - name: liquidated_damages_incident_based_vs_population_weighted_diverge_on_severity_multiplier
        grounds:
          - calculations.contract_liquidated_damages
          - entities.ServiceContract.fields.ld_variant
          - entities.ServiceContract.fields.net_liquidated_damages_cents
          - state_machines.ServiceContract.ACTIVE_to_RECONCILING
        distinguishing_aspect: |
          The second dual variant sits on a different entity domain - contract financial penalties on
          ServiceContract, not tray forecasting on MealForecast - and diverges through a severity
          multiplier rather than through its input set: two byte-identical fixtures (missed_meal_total 3,
          total_trays_served 150, meal_days_served 50) yield raw_liquidated_damages_cents 2250 /
          net 1800 under INCIDENT_BASED and 2385 / 1908 under POPULATION_WEIGHTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two independent ACTIVE contracts CFS-2515-DV2A and CFS-2515-DV2B, each with ld_cents_per_missed_meal 750, ld_monthly_cap_cents 5000000, substitution_allowance_pct 0.30 and cost_ceiling_cents_per_meal_day 320."
            - "Each contract has exactly one Facility, one ACTIVE 1-day MenuCycle whose approved_cost_cents_per_meal_day is 315, and one PopulationCount of general 130 / segregation 20 / satellite 12 / medical 0."
            - "Each contract has exactly one LOCKED MealForecast for 2026-08-02 BREAKFAST with line_trays 156, waste_allowance_trays 8, total_forecast_trays 164 and expected_service_trays 156."
            - "Each contract has exactly one CLOSED MealServiceRecord serving 130 general + 15 segregation + 5 satellite = 150 trays with special_diet_trays_served 0, so missed_meal_count is 3 on each."
            - "No MenuSubstitution and no Grievance rows exist under either contract."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-DV2A", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { ca_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${ca_id}", facility_code: "FAC-DV2A", name: "North Unit Kitchen", sharps_authorized_count: 12, satellite_site_count: 0, blast_chiller_capacity: 2 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { fa_id: $.data.id }
            - call: "POST /cfs/service-contracts/${ca_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { ca_v: $.data.version }
            - call: "POST /cfs/menu-cycles"
              payload: { facility_id: "${fa_id}", cycle_code: "CYC-1", cycle_length_days: 1 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { cyca_id: $.data.id }
            - call: "POST /cfs/menu-cycles/${cyca_id}/items"
              payload: { cycle_day: 1, meal_slot: "BREAKFAST", component_name: "Oatmeal Bake", kcal_per_100g: 421.0, protein_grams_per_100g: 20.0, sodium_mg_per_100g: 600.0, portion_grams: 50, raw_cost_cents: 95 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/menu-cycles/${cyca_id}/items"
              payload: { cycle_day: 1, meal_slot: "LUNCH", component_name: "Turkey Casserole", kcal_per_100g: 306.0, protein_grams_per_100g: 8.0, sodium_mg_per_100g: 400.0, portion_grams: 225, raw_cost_cents: 110 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/menu-cycles/${cyca_id}/items"
              payload: { cycle_day: 1, meal_slot: "DINNER", component_name: "Bean Rice Bowl", kcal_per_100g: 380.0, protein_grams_per_100g: 6.1, sodium_mg_per_100g: 160.0, portion_grams: 500, raw_cost_cents: 110 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/menu-cycles/${cyca_id}/nutrition-sign"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
            - call: "POST /cfs/menu-cycles/${cyca_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/population-counts"
              payload: { facility_id: "${fa_id}", general_population: 130, segregation_population: 20, satellite_population: 12, medical_population: 0, source: "FORMAL_COUNT" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { pca_id: $.data.id }
            - call: "POST /cfs/meal-forecasts"
              payload: { facility_id: "${fa_id}", population_count_id: "${pca_id}", service_date: "2026-08-02", meal_slot: "BREAKFAST", forecast_variant: "COUNT_DRIVEN" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { fca_id: $.data.id }
            - call: "POST /cfs/meal-forecasts/${fca_id}/lock"
              payload: {}
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/meal-service-records"
              payload: { facility_id: "${fa_id}", meal_forecast_id: "${fca_id}", service_date: "2026-08-02", meal_slot: "BREAKFAST", trays_served_general: 130, trays_served_segregation: 15, trays_served_satellite: 5, special_diet_trays_served: 0 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { msra_id: $.data.id }
            - call: "POST /cfs/meal-service-records/${msra_id}/close"
              payload: { expected_service_contract_version: "${ca_v}" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-DV2B", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { cb_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${cb_id}", facility_code: "FAC-DV2B", name: "South Unit Kitchen", sharps_authorized_count: 12, satellite_site_count: 0, blast_chiller_capacity: 2 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { fb_id: $.data.id }
            - call: "POST /cfs/service-contracts/${cb_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { cb_v: $.data.version }
            - call: "POST /cfs/menu-cycles"
              payload: { facility_id: "${fb_id}", cycle_code: "CYC-1", cycle_length_days: 1 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { cycb_id: $.data.id }
            - call: "POST /cfs/menu-cycles/${cycb_id}/items"
              payload: { cycle_day: 1, meal_slot: "BREAKFAST", component_name: "Oatmeal Bake", kcal_per_100g: 421.0, protein_grams_per_100g: 20.0, sodium_mg_per_100g: 600.0, portion_grams: 50, raw_cost_cents: 95 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/menu-cycles/${cycb_id}/items"
              payload: { cycle_day: 1, meal_slot: "LUNCH", component_name: "Turkey Casserole", kcal_per_100g: 306.0, protein_grams_per_100g: 8.0, sodium_mg_per_100g: 400.0, portion_grams: 225, raw_cost_cents: 110 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/menu-cycles/${cycb_id}/items"
              payload: { cycle_day: 1, meal_slot: "DINNER", component_name: "Bean Rice Bowl", kcal_per_100g: 380.0, protein_grams_per_100g: 6.1, sodium_mg_per_100g: 160.0, portion_grams: 500, raw_cost_cents: 110 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/menu-cycles/${cycb_id}/nutrition-sign"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
            - call: "POST /cfs/menu-cycles/${cycb_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/population-counts"
              payload: { facility_id: "${fb_id}", general_population: 130, segregation_population: 20, satellite_population: 12, medical_population: 0, source: "FORMAL_COUNT" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { pcb_id: $.data.id }
            - call: "POST /cfs/meal-forecasts"
              payload: { facility_id: "${fb_id}", population_count_id: "${pcb_id}", service_date: "2026-08-02", meal_slot: "BREAKFAST", forecast_variant: "COUNT_DRIVEN" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { fcb_id: $.data.id }
            - call: "POST /cfs/meal-forecasts/${fcb_id}/lock"
              payload: {}
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/meal-service-records"
              payload: { facility_id: "${fb_id}", meal_forecast_id: "${fcb_id}", service_date: "2026-08-02", meal_slot: "BREAKFAST", trays_served_general: 130, trays_served_segregation: 15, trays_served_satellite: 5, special_diet_trays_served: 0 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { msrb_id: $.data.id }
            - call: "POST /cfs/meal-service-records/${msrb_id}/close"
              payload: { expected_service_contract_version: "${cb_v}" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
          trigger:
            - call: "POST /cfs/service-contracts/${ca_id}/reconcile"
              payload: { ld_variant: "INCIDENT_BASED" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts/${cb_id}/reconcile"
              payload: { ld_variant: "POPULATION_WEIGHTED" }
              as: ContractAdministrator
              as_user_id: "ca-001"
          assert:
            - "MealServiceRecord.${msra_id}.expected_service_trays == 156 and MealServiceRecord.${msra_id}.total_trays_served == 150 and MealServiceRecord.${msra_id}.missed_meal_count == 3"
            - "ServiceContract.${ca_id}.total_trays_served == 150 and ServiceContract.${ca_id}.meal_days_served == 50 and ServiceContract.${ca_id}.missed_meal_total == 3"
            - "ServiceContract.${cb_id}.total_trays_served == 150 and ServiceContract.${cb_id}.meal_days_served == 50 and ServiceContract.${cb_id}.missed_meal_total == 3"
            - "ServiceContract.${ca_id}.gross_food_cost_cents == 15750 and ServiceContract.${cb_id}.gross_food_cost_cents == 15750"
            - "ServiceContract.${ca_id}.raw_liquidated_damages_cents == 2250"
            - "ServiceContract.${cb_id}.raw_liquidated_damages_cents == 2385"
            - "ServiceContract.${ca_id}.substitution_surcharge_cents == 0 and ServiceContract.${cb_id}.substitution_surcharge_cents == 0"
            - "ServiceContract.${ca_id}.liquidated_damages_cents == 2250 and ServiceContract.${cb_id}.liquidated_damages_cents == 2385"
            - "ServiceContract.${ca_id}.cost_recovery_credit_cents == 450 and ServiceContract.${cb_id}.cost_recovery_credit_cents == 477"
            - "ServiceContract.${ca_id}.net_liquidated_damages_cents == 1800"
            - "ServiceContract.${cb_id}.net_liquidated_damages_cents == 1908"
            - "ServiceContract.${cb_id}.net_liquidated_damages_cents - ServiceContract.${ca_id}.net_liquidated_damages_cents == 108"
            - "ServiceContract.${ca_id}.performance_score == 92.50 and ServiceContract.${cb_id}.performance_score == 92.50"
            - "ServiceContract.${ca_id}.ld_variant == INCIDENT_BASED and ServiceContract.${cb_id}.ld_variant == POPULATION_WEIGHTED"
            - "ServiceContract.${ca_id}.status == RECONCILING and ServiceContract.${cb_id}.status == RECONCILING"

  # ===========================================================================
  # Rule 2 - combinatorial formulas across different modes
  #   instance 1 = mode (b) nested rounding where the order matters
  #   instance 2 = mode (c) circular-looking dependency with pinned step order
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: nutrition_per_item_rounding_before_summation_meets_contract_floor_exactly
        grounds:
          - calculations.menu_cycle_nutrition_adequacy
          - entities.MenuCycle.fields.approved_kcal_per_meal_day
          - entities.MenuCycleItem.fields.portion_grams
          - validations[priority=29]
          - state_machines.MenuCycle.DRAFT_to_NUTRITION_APPROVED
        distinguishing_aspect: |
          Mode (b) - nested rounding order. The three items scale to 210.5, 688.5 and 1900.0 kcal, so
          rounding per item first (211 + 689 + 1900) gives approved_kcal_per_meal_day 2800 and the
          nutrition sign succeeds at the contracted floor of exactly 2800, whereas the forbidden
          sum-then-round order gives 2799 and would raise ERR_NUTRITION_BELOW_STANDARD.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ServiceContract CFS-2515-CF1 in status ACTIVE with contracted_kcal_per_meal_day 2800, contracted_protein_grams_per_meal_day 55.0 and contracted_sodium_mg_cap_per_meal_day 2400."
            - "One Facility FAC-CF1 with satellite_site_count 0."
            - "MenuCycle CYC-1 at FAC-CF1 in status DRAFT with cycle_length_days 1 and exactly 3 items whose portion-scaled kcal are 210.5, 688.5 and 1900.0."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-CF1", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-CF1", name: "North Unit Kitchen", sharps_authorized_count: 12, satellite_site_count: 0, blast_chiller_capacity: 2 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/menu-cycles"
              payload: { facility_id: "${facility_id}", cycle_code: "CYC-1", cycle_length_days: 1 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { cycle_id: $.data.id }
            - call: "POST /cfs/menu-cycles/${cycle_id}/items"
              payload: { cycle_day: 1, meal_slot: "BREAKFAST", component_name: "Oatmeal Bake", kcal_per_100g: 421.0, protein_grams_per_100g: 20.0, sodium_mg_per_100g: 600.0, portion_grams: 50, raw_cost_cents: 95 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/menu-cycles/${cycle_id}/items"
              payload: { cycle_day: 1, meal_slot: "LUNCH", component_name: "Turkey Casserole", kcal_per_100g: 306.0, protein_grams_per_100g: 8.0, sodium_mg_per_100g: 400.0, portion_grams: 225, raw_cost_cents: 110 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
