  - rule_id: compensating_invariant
    instances:
      - name: payment_reversal_restores_the_obligation_identity
        grounds:
          - invariants.program_obligation_conservation
          - calculations.agreement_obligation_ledger
          - state_machines.SubsidyPayment.DISBURSED_to_REVERSED
          - state_machines.ServicePeriod.PAID_to_REPORTED
          - errors.ERR_PAYMENT_NOT_REVERSIBLE
          - endpoints.POST_/eas/subsidy-payments/{id}/actions
        invariant: program_obligation_conservation
        forward_action: "POST /eas/subsidy-payments/{id}/actions with action == DISBURSE"
        compensating_action: "POST /eas/subsidy-payments/{id}/actions with action == REVERSE"
        distinguishing_aspect: |
          The conserved quantity is money and the compensation is a state transition into a terminal
          state, so it can be attempted exactly once — a second REVERSE must be refused rather than
          double-credited. The compensation also unwinds a *cascade*: the ServicePeriod falls back
          PAID -> REPORTED, which makes the same month certifiable again and must reproduce the
          identical net figure, proving no residue was left in the ledger.
        test_recipe:
          setup:
            - "Community HYS SUBSIDIZED under ACTIVE agreement A1 (Prairie Air, 1600000.00, term 24), so total_committed_usd is 3200000.00."
            - "Its 2026-08 period is reported with 104 scheduled, 91 completed, 5 carrier and 8 weather cancellations, 1729 seats and 620 passengers, certified to a net payment of 115096.03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
            - call: "POST /eas/solicitations"
              payload: { community_id: "${comm_id}", closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { sol_id: $.data.id }
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1600000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /eas/proposals/${p1_id}/actions"
              payload: { action: "SUBMIT" }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/solicitations/${sol_id}/actions"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
            - call: "POST /eas/solicitations/${sol_id}/selection-order"
              payload: { order_note: "award to sole candidate" }
              as: SelectionOfficer
              as_user_id: "officer-1"
              captures: { agr_id: $.data.id }
            - call: "POST /eas/service-periods"
              payload: { agreement_id: "${agr_id}", period_month: "2026-08" }
              as: ProgramAdmin
              captures: { per1_id: $.data.id }
            - call: "POST /eas/service-periods/${per1_id}/report"
              payload: { scheduled_departures: 104, completed_departures: 91, cancelled_carrier_departures: 5, cancelled_weather_departures: 8, seats_offered: 1729, passengers_enplaned: 620 }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/service-periods/${per1_id}/certify"
              payload: { certification_note: "August 2026" }
              as: ProgramAdmin
            - call: "GET /eas/subsidy-payments"
              payload: { service_period_id: "${per1_id}" }
              as: ProgramAdmin
              captures: { pay1_id: "$.data[0].id" }
            - call: "POST /eas/subsidy-payments/${pay1_id}/actions"
              payload: { action: "APPROVE" }
              as: ProgramAdmin
              as_user_id: "admin-approver"
          trigger:
            - call: "POST /eas/subsidy-payments/${pay1_id}/actions"
              payload: { action: "DISBURSE" }
              as: ProgramAdmin
              as_user_id: "admin-disburser"
            - call: "POST /eas/subsidy-payments/${pay1_id}/actions"
              payload: { action: "REVERSE", reversal_reason_code: "AUDIT_FINDING" }
              as: ProgramAdmin
              as_user_id: "admin-approver"
            - call: "POST /eas/subsidy-payments/${pay1_id}/actions"
              payload: { action: "REVERSE", reversal_reason_code: "OVERPAYMENT" }
              as: ProgramAdmin
              as_user_id: "admin-approver"
              captures: { double_reverse_error_id: $.data.error_id }
            - call: "POST /eas/service-periods/${per1_id}/certify"
              payload: { certification_note: "August 2026 re-certified after reversal" }
              as: ProgramAdmin
            - call: "GET /eas/subsidy-payments"
              payload: { service_period_id: "${per1_id}", status: "COMPUTED" }
              as: ProgramAdmin
              captures: { pay2_id: "$.data[0].id" }
          assert:
            - "Before the forward action: ServiceAgreement.${agr_id}.total_committed_usd == 3200000.00, disbursed_to_date_usd == 0.00, obligated_remaining_usd == 3200000.00"
            - "SubsidyPayment.${pay1_id}.net_payment_usd == 115096.03 and hold_in_premium_usd == 0.00"
            - "After DISBURSE: disbursed_to_date_usd == 115096.03, obligated_remaining_usd == 3084903.97, ServicePeriod.${per1_id}.status == PAID"
            - "The identity holds after the forward action: 3084903.97 + 115096.03 == 3200000.00"
            - "After REVERSE: SubsidyPayment.${pay1_id}.status == REVERSED with reversal_reason_code == AUDIT_FINDING, disbursed_to_date_usd == 0.00, obligated_remaining_usd == 3200000.00"
            - "The identity holds after the compensation: 3200000.00 + 0.00 == 3200000.00, and total_committed_usd was never touched"
            - "ServicePeriod.${per1_id}.status == REPORTED again, so the compensation unwound the cascade too"
            - "The second REVERSE returns 409 with ${double_reverse_error_id} == ERR_PAYMENT_NOT_REVERSIBLE and disbursed_to_date_usd is still 0.00 — no double credit"
            - "Re-certifying reproduces the figure exactly: SubsidyPayment.${pay2_id}.net_payment_usd == 115096.03 with status == COMPUTED"
            - "ServiceAgreement.${agr_id}.hold_in_premium_paid_usd == 0.00 throughout, confirming premiums stay outside the identity"

      - name: period_amendment_preserves_the_departure_identity
        grounds:
          - invariants.departure_count_conservation
          - calculations.departure_count_reconciliation
          - state_machines.ServicePeriod.REPORTED_to_REPORTED
          - concurrency_rules.period-amend-stale-agreement
          - validations.priority_23
          - errors.ERR_DEPARTURE_COUNTS_UNBALANCED
          - endpoints.POST_/eas/service-periods/{id}/amend
        invariant: departure_count_conservation
        forward_action: "POST /eas/service-periods/{id}/report adding the four counts into the agreement's cumulative_* fields"
        compensating_action: "POST /eas/service-periods/{id}/amend subtracting the stored counts before adding the new ones"
        distinguishing_aspect: |
          The conserved quantity is integer counts rather than money, and the compensation is not a
          separate undo action but a subtract-then-add embedded in the same self-loop write, which may
          be repeated any number of times on the same period. It is also the only compensation gated by
          optimistic concurrency: the amendment carries expected_agreement_version, so a client with a
          stale view of the roll-up cannot re-base the counters at all.
