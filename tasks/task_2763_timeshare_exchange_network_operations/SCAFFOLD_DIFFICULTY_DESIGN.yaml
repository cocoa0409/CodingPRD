  # ===========================================================================
  - rule_id: transitive_cascade
    rule_summary: >-
      One API call whose effect propagates through three or more dependent hops,
      where each hop is caused by the previous hop rather than fanned out from
      the original call.
    instances:

      - name: late_cancel_prorated_restore_getaway_forfeit_chain
        depth: 4
        chain: >-
          cancel confirmation -> (1) confirmation CANCELLED and 82 power restored to the exchanging
          member -> (2) awarded deposit returns USED -> BANKED and takes a 21-point haircut charged
          to the depositing owner -> (3) because the variant is PRORATED_RESTORE the deposit's
          rental_status moves NOT_LISTED -> LISTED_GETAWAY and a GetawayOffer is priced -> (4) the
          listing forfeits the deposit's remaining 61 power, zeroing the depositing owner's balance.
        why_hard: >-
          Only hop 1 is visible on the endpoint's own response entity. Hops 2, 3 and 4 land on three
          other entities and on two different members' ledgers, and hop 4 exists only because hop 3
          happened, which in turn exists only because the day-count threshold selected
          PRORATED_RESTORE. An implementation that restores power and stops, or that lists the
          getaway without forfeiting the remaining power, or that charges the haircut to the
          cancelling member instead of the depositing owner, breaks a different assert each time.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A with units_per_size 2, demand_index 4, GOLD_CROWN and a GOLD band
            04-01..06-30, affiliated at the default clock. Members M1 and M2 on PLUS with wallet
            80100 each. M1 banks a ONE_BR week for 2027-06-15 (82 power). M2 banks a TWO_BR week for
            2027-05-10 (107 power) and funds a DEPOSIT_FIRST ONE_BR request over
            2027-06-01..2027-06-30 with it, paying 23060 and leaving wallet 57040. A matching run
            reserves M1's week at settlement_power 82 and M2 confirms, leaving M2 with 25 power. The
            clock then moves to 2027-05-17, which is 29 days before the awarded check-in — one day
            inside the late-cancellation region.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Aspen Ridge Club", region_code: "US-CO", required_annual_deposit_units: 2, initial_quality_rating: "GOLD_CROWN", units_per_size: 2, demand_index: 4 }
              captures: { resort_a: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_a}", band_code: "GOLD", start_month_day: "04-01", end_month_day: "06-30" }
            - call: "POST /exchange-network/resorts/${resort_a}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m2@example.com", full_name: "Priya Ravindran", tier_id: "${plus_tier}" }
              captures: { m2: "$.data.id", m2_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m2}/dues-payments"
              as: Member
              as_user_id: "${m2}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m2_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_a}", unit_size: "ONE_BR", check_in_date: "2027-06-15" }
              captures: { dep_m1: "$.data.id" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", resort_id: "${resort_a}", unit_size: "TWO_BR", check_in_date: "2027-05-10" }
              captures: { dep_m2: "$.data.id" }
            - call: "POST /exchange-network/exchange-requests"
              as: Member
              as_user_id: "${m2}"
              payload: { member_id: "${m2}", requested_resort_id: "${resort_a}", requested_unit_size: "ONE_BR", window_start_date: "2027-06-01", window_end_date: "2027-06-30", deposit_id: "${dep_m2}" }
              captures: { req: "$.data.id" }
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "reserve M1's week for M2" }
              captures: { run1: "$.data.id" }
            - call: "POST /exchange-network/confirmations"
              as: Member
              as_user_id: "${m2}"
              payload: { exchange_request_id: "${req}" }
              captures: { conf: "$.data.id" }
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2027-05-17T00:00:00Z" }
          trigger:
            - call: "POST /exchange-network/confirmations/${conf}/cancellation"
              as: Member
              as_user_id: "${m2}"
              payload: {}
            - call: "GET /exchange-network/getaway-offers?deposit_id=${dep_m1}"
              as: NetworkOperator
              payload: {}
              captures: { offer: "$.data[0].id" }
          assert:
            - "hop 1 — GET /exchange-network/confirmations/${conf}: status == \"CANCELLED\", restoration_variant == \"PRORATED_RESTORE\" (days_out 29 < 30), restored_power == 82, cancellation_fee_cents == 16400 (8900 tier fee + 7500 late surcharge), cancelled_at == \"2027-05-17T00:00:00Z\""
            - "hop 1 — GET /exchange-network/members/${m2}: trading_power_balance == 107 (25 + 82 restored) and wallet_credit_cents == 40640 (57040 - 16400)"
            - "hop 2 — GET /exchange-network/deposits/${dep_m1}: deposit_status == \"BANKED\", restoration_haircut_power == 21 (ceil(82 * 25 / 100) = ceil(20.5)), remaining_power == 61, awarded_power == 82 and expires_at unchanged at \"2029-06-14T00:00:00Z\""
            - "hop 3 — GET /exchange-network/deposits/${dep_m1}: rental_status == \"LISTED_GETAWAY\""
            - "hop 3 — GET /exchange-network/getaway-offers?deposit_id=${dep_m1}: total_count == 1, data[0].status == \"LISTED\", data[0].created_by_run_id == null (this listing came from the cancellation, not from a run)"
            - "hop 3 — GET /exchange-network/getaway-offers/${offer}: list_price_cents == 50369 (settlement 82 * 900 = 73800, demand premium 5 percent -> 77490.0, days_to_check_in 29 -> urgency 35 percent -> 50368.5, rounded once -> 50369) and urgency_discount_pct == 35"
            - "hop 4 — GET /exchange-network/members/${m1}: trading_power_balance == 0 (82 credited, 21 haircut, 61 listing forfeit)"
            - "hop 4 — GET /exchange-network/ledger-entries?member_id=${m1}: total_count == 4 in created_at order — DUES_PAYMENT, DEPOSIT_CREDIT +82, RESTORATION_HAIRCUT -21, GETAWAY_LISTING_FORFEIT -61"
            - "GET /exchange-network/exchange-requests/${req} — status == \"CONFIRMED\" and charge_refunded_cents == 0 (a confirmed exchange never refunds its charge, even when the confirmation is later cancelled)"

      - name: deposit_expiry_resort_shortfall_probation_chain
        depth: 3
        chain: >-
          matching run -> (1) the BANKED deposit passes its expiry instant and becomes EXPIRED,
          forfeiting its 27 power -> (2) the resort's deposits_committed_count and committed_nights
          are recounted down to 0, so calculations.resort_deposit_obligation_shortfall variant
          BY_STAY_YEAR rises from 0 to 1 -> (3) step 6 evaluates only the resorts touched by step 1
          and moves this one ACTIVE -> PROBATION.
        why_hard: >-
          Nothing in the request body names the resort; the probation is reached only by recounting
          the resort's inventory after the deposit left the counted statuses. The step 6 filter makes
          this observable in both directions: a second run at the same instant expires nothing and
          therefore must NOT re-probate, even though the shortfall is still 1. An implementation that
          evaluates every resort on every run, or that never recounts, fails one of the two runs.
        test_recipe:
          setup: >-
            Tier PLUS. Resort C "Pine Hollow Lodge" with units_per_size 3, demand_index 2,
            required_annual_deposit_units 1, initial_quality_rating STANDARD and one SILVER band
            covering the whole year, affiliated at the default clock 2026-08-01. Member M1 on PLUS,
            dues-paid through 2030-12-31, banks a single STUDIO week checking in 2026-11-01, worth 27,
            which satisfies the obligation exactly and expires at 2028-10-31T00:00:00Z. The clock is
            then moved to 2028-11-01, one day past that expiry instant.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Pine Hollow Lodge", region_code: "US-MI", required_annual_deposit_units: 1, initial_quality_rating: "STANDARD", units_per_size: 3, demand_index: 2 }
              captures: { resort_c: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_c}", band_code: "SILVER", start_month_day: "01-01", end_month_day: "12-31" }
            - call: "POST /exchange-network/resorts/${resort_c}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_c}", unit_size: "STUDIO", check_in_date: "2026-11-01" }
              captures: { dep: "$.data.id" }
            - call: "GET /exchange-network/resorts/${resort_c}/compliance"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2028-11-01T00:00:00Z" }
          trigger:
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "expiry sweep past the deposit lifetime" }
              captures: { run1: "$.data.id" }
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "second run at the same instant expires nothing" }
              captures: { run2: "$.data.id" }
          assert:
