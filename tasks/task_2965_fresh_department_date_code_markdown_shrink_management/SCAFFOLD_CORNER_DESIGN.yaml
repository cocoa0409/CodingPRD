            - "Donation-enabled store 0412, a MID-ATL partner accepting PRODUCE, a PRODUCE department and one 10-unit lot whose donation window is open at the 2026-08-13T00:00:00.000Z clock."
            - "One SCHEDULED pickup on dock D1 for 2026-08-13T14:00:00.000Z to 15:00:00.000Z."
