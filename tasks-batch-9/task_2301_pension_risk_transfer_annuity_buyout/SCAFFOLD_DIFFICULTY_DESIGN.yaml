      - name: insurer_composite_score_nonlinear_in_premium
        grounds:
          - calculations.insurer_safest_available_score
          - entities.AnnuityQuote.fields.composite_score_bp
          - entities.Insurer.fields.capital_ratio_bp
        distinguishing_aspect: |
          price_points is min_premium * 100 // premium — a floor-divided ratio, not a
          linear discount — so a 700000-cent premium gap between Aurora (12500000)
          and Cardinal (13400000) yields only a 6-point price gap (94 vs 88), and
          combining that with the floor-divided capital_points (42 vs 51) makes
          Cardinal outscore Aurora under SAFETY_WEIGHTED but lose under
          PRICE_WEIGHTED; no linear scoring model reproduces both.
