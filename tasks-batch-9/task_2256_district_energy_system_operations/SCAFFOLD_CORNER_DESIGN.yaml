      - name: expansion_sizing_picks_the_smallest_feasible_diameter_and_prices_the_annuity
        claim_type: Constants Applied
        grounds:
          - calculations.expansion_sizing_and_npv
          - endpoints[POST /district-energy/expansion-projects/{project_id}/size]
          - state_machines.ExpansionProject.SCREENING_to_SIZED
        distinguishing_aspect: "The MAX_VELOCITY_M_S 2.0 and 100.0 kPa per km limits are both applied to the standard diameter ladder, and the 80 mm candidate is rejected on pressure drop (253.97) even though its velocity 1.4254 is legal, so the constants pick 100 mm rather than the hydraulically smallest pipe; the 11.46992122 twenty-year annuity factor then converts a 256687.50 margin into a 2051685.40 net present value."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-X and RateSchedule RS-C (fallback tier 61.00 per MWh at load_factor_max 100.0, demand charge 12.00, fixed charge 800.00)."
            - "ExpansionProject P1 in SCREENING: requested 1200.0 kW, design_delta_t_c 40.0, route 850.0 m, assumed annual energy 4200.0 MWh, assumed marginal cost 38.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-X", name: "Expansion Loop X", service_mode: "HEATING", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 12000.0 }
              as: SystemController
              captures: { loop_x_id: $.data.id }
            - call: "POST /district-energy/rate-schedules"
              payload: { code: "RS-C", customer_class: "COMMERCIAL_OFFICE", fixed_service_charge: 800.00, demand_charge_per_kw: 12.00, minimum_bill_amount: 4000.00, tiers: [{ load_factor_max: 30.0, energy_rate_per_mwh: 88.00 }, { load_factor_max: 65.0, energy_rate_per_mwh: 74.00 }, { load_factor_max: 100.0, energy_rate_per_mwh: 61.00 }] }
              as: BillingAnalyst
              captures: { rs_c_id: $.data.id }
            - call: "POST /district-energy/expansion-projects"
              payload: { loop_id: "${loop_x_id}", rate_schedule_id: "${rs_c_id}", candidate_customer_name: "Harbourfront Tower", customer_class: "COMMERCIAL_OFFICE", requested_capacity_kw: 1200.0, route_length_m: 850.0, assumed_annual_energy_mwh: 4200.0, assumed_marginal_cost_per_mwh: 38.00, design_delta_t_c: 40.0 }
              as: NetworkEngineer
              captures: { proj_p1_id: $.data.id, proj_p1_state: $.data.project_state, proj_p1_diam: $.data.selected_diameter_mm }
          trigger:
            - call: "POST /district-energy/expansion-projects/${proj_p1_id}/size"
              payload: {}
              as: NetworkEngineer
              captures: { sized_flow: $.data.design_flow_m3_per_h, sized_diam: $.data.selected_diameter_mm, sized_capex: $.data.estimated_capex, sized_margin: $.data.annual_net_margin, sized_npv: $.data.npv, sized_state: $.data.project_state }
            - call: "POST /district-energy/expansion-projects/${proj_p1_id}/decision"
              payload: { decision: "APPROVE", decision_note: "positive net present value" }
              as: SystemController
              captures: { decided_state: $.data.project_state }
          assert:
            - "${proj_p1_state} == SCREENING"
            - "${proj_p1_diam} == null"
            - "${sized_flow} == 25.795"
            - "${sized_diam} == 100"
            - "${sized_capex} == 892500.00"
            - "${sized_margin} == 256687.50"
            - "${sized_npv} == 2051685.40"
            - "${sized_state} == SIZED"
            - "${decided_state} == APPROVED"

      - name: minimum_bill_floor_replaces_a_smaller_computed_subtotal
        claim_type: Correct Result
        grounds:
          - calculations.invoice_billing_determinants
          - entities.RateSchedule.fields.minimum_bill_amount
          - entities.Invoice.fields.minimum_bill_applied
        distinguishing_aspect: "The computed subtotal 1050.00 is below the RS-R minimum_bill_amount 3000.00, so total_amount is replaced by the floor and minimum_bill_applied flips to true while energy_charge, demand_charge and fixed_charge keep their own unfloored values — the floor is applied to the total only, not spread back over the components."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-M with RateSchedule RS-R (RESIDENTIAL_MULTIFAMILY, fixed 250.00, demand 6.00, minimum bill 3000.00) and ACTIVE agreement CM1 (reserved 120.0, so the reserved floor is 60.00)."
            - "COMMISSIONED MeteringPoint MP-M1 with ACTUAL reads 10.000 at peak 55.0 and 14.000 at peak 60.0 inside a 720-hour June period."
