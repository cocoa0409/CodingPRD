# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task: task_3067_alternative_data_underwriting_model_bank_partner_loan
#
# Breadth probe: every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners covered by
# §1.8 appear as excluded_because stubs with no test_recipe.
#
# Shared fixture conventions (inlined per instance; no cross-instance refs):
#   - Logical clock default 2026-09-01T00:00:00Z.
#   - Standard bureau-only model: variables [{bureau_score,w1,min300,max850}],
#     floor 0, ceiling 1000 -> score = round_half_up(100*(b-300)/550);
#     bureau 575 -> 50.
#   - Standard clean applicant: TX, income 12000000, debt 200000, BACHELOR,
#     EMPLOYED, months_employed 12, avg_balance 500000, nsf 0,
#     net_cashflow 100000, bureau 575.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: model_version_create_returns_201_with_draft_status_and_version_1
        claim_type: Creation
        grounds:
          - entities.ModelVersion
          - endpoints.POST_/platform/model-versions
        distinguishing_aspect: "A model created with all five required inputs comes back 201 with status DRAFT, version 1, fairness_report null, and system-minted id/created_at/updated_at — status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-E-1", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "entity create", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "ModelVersion.${m_id}.status == DRAFT and version == 1"
            - "ModelVersion.${m_id}.fairness_report is null"
            - "response data carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: partner_get_returns_stored_fields_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Partner
          - endpoints.GET_/platform/partners/{id}
        distinguishing_aspect: "Every Partner configuration field round-trips through GET exactly as posted, with computed fields originated_this_month_count == 0 and funded_balance_cents == 0 and active_credit_box_id null on a fresh ONBOARDING partner."
        test_recipe:
          setup:
            - "Logical clock at default. One partner created."
          setup_api_calls:
            - call: "POST /platform/partners"
              payload: { legal_name: "Roundtrip CU", partner_type: "CREDIT_UNION", home_state: "WA" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /platform/partners/${p_id}"
              payload: {}
              as: Auditor
              as_user_id: "au-one"
          assert:
            - "the response status is 200"
            - "Partner.${p_id}.legal_name == \"Roundtrip CU\" and partner_type == CREDIT_UNION and home_state == \"WA\""
            - "Partner.${p_id}.status == ONBOARDING"
            - "Partner.${p_id}.originated_this_month_count == 0 and funded_balance_cents == 0 and active_credit_box_id is null"

      - name: applications_list_paginates_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/platform/applications
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three applications on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false; no params returns all 3 under the default limit 10."
        test_recipe:
          setup:
            - "Logical clock at default. Model ACTIVE (bureau-only). Three clean TX applicants each with one application."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-E-2", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "list", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
            - call: "POST /platform/model-versions/${m_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/applicants"
              payload: { full_name: "List One", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { a1: $.data.id }
            - call: "POST /platform/applicants"
              payload: { full_name: "List Two", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { a2: $.data.id }
            - call: "POST /platform/applicants"
              payload: { full_name: "List Three", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { a3: $.data.id }
            - call: "POST /platform/applications"
              payload: { applicant_id: "${a1}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
            - call: "POST /platform/applications"
              payload: { applicant_id: "${a2}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
            - call: "POST /platform/applications"
              payload: { applicant_id: "${a3}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
          trigger:
            - call: "GET /platform/applications"
              payload: { limit: 2, offset: 0 }
              as: Auditor
              as_user_id: "au-one"
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /platform/applications?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /platform/applications with no query params returns 3 rows (default limit 10, offset 0)"
            - "GET /platform/applications?status=VERIFICATION_PENDING returns 3 rows"

      - name: credit_box_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/platform/credit-boxes/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated credit-box id returns 404 ERR_NOT_FOUND with the error envelope carrying error_id and message."
        test_recipe:
          setup:
            - "Logical clock at default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /platform/credit-boxes/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Auditor
              as_user_id: "au-one"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: application_create_missing_requested_amount_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Application.fields.requested_amount_cents
          - validations[priority=8]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "requested_amount_cents is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST and no application (or verification rows) are persisted."
        test_recipe:
          setup:
            - "Logical clock at default. Model ACTIVE (bureau-only). One applicant."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-E-3", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "req", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
            - call: "POST /platform/model-versions/${m_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/applicants"
              payload: { full_name: "Missing Mike", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_id}", channel: "DIRECT" }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /platform/applications?applicant_id=${ap_id} returns 0 rows"

      - name: application_computed_score_ignores_client_supplied_risk_score_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Application.fields.risk_score
          - calculations.risk_score
        distinguishing_aspect: "risk_score is source: computed; a client that smuggles risk_score 999 into the create body is ignored and the server-computed score (50 for bureau 575) is stored."
        test_recipe:
          setup:
            - "Logical clock at default. Model ACTIVE (bureau-only). One clean applicant, bureau 575."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-E-4", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "computed", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
            - call: "POST /platform/model-versions/${m_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/applicants"
              payload: { full_name: "Smuggle Sam", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_id}", channel: "DIRECT", requested_amount_cents: 5000000, risk_score: 999, status: "APPROVED" }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { app_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Application.${app_id}.risk_score == 50 (server-computed), not 999"
            - "Application.${app_id}.status == VERIFICATION_PENDING (initial machine state), not APPROVED"
            - "Application.${app_id}.debt_to_income_pct == 20.0"

      - name: servicing_event_has_no_version_field_and_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.ServicingEvent
          - endpoints.GET_/platform/loans/{id}/servicing-events
        distinguishing_aspect: "ServicingEvent is common_fields: false — rows carry id and created_at but no version and no updated_at, and no PUT/PATCH/DELETE endpoint exists for servicing events anywhere in §1.5."
        test_recipe:
          setup:
            - "Logical clock at default. Model ACTIVE; bank ACTIVE with box; one funded loan that has been advanced once (generating LATE_FEE_ASSESSED and DELINQUENCY_ADVANCED events)."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-E-5", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "immut", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
            - call: "POST /platform/model-versions/${m_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/partners"
              payload: { legal_name: "Event Bank", partner_type: "BANK", home_state: "TX" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { bank_id: $.data.id, bank_v0: $.data.version }
            - call: "POST /platform/partners/${bank_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${bank_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { box_id: $.data.id }
            - call: "POST /platform/partners/${bank_id}/credit-boxes/${box_id}/activate"
              payload: { expected_partner_version: "${bank_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/applicants"
              payload: { full_name: "Event Eve", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_id: $.data.id }
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_id}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { app_id: $.data.id }
            - call: "GET /platform/applications/${app_id}/verifications"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
              captures: { v_inc: "$.data[0].id", v_idn: "$.data[1].id" }
            - call: "POST /platform/applications/${app_id}/verifications/${v_inc}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications/${app_id}/verifications/${v_idn}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications/${app_id}/allocate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pad-one"
            - call: "GET /platform/loans"
              payload: { application_id: "${app_id}" }
              as: ServicingAgent
              as_user_id: "sa-one"
              captures: { loan_id: "$.data[0].id" }
            - call: "POST /platform/loans/${loan_id}/advance-servicing"
              payload: {}
              as: ServicingAgent
              as_user_id: "sa-one"
          trigger:
            - call: "GET /platform/loans/${loan_id}/servicing-events"
              payload: {}
              as: Auditor
              as_user_id: "au-one"
          assert:
            - "the response status is 200 and response_type is array with at least 2 rows"
            - "every row carries id, created_at, occurred_at, event_type, resulting_loan_status and does NOT carry version or updated_at"
            - "rows are ordered occurred_at ASC with LATE_FEE_ASSESSED before DELINQUENCY_ADVANCED"

      - name: applicant_create_with_invalid_education_level_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Applicant.fields.education_level
          - validations[priority=8]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "education_level is a closed 5-member enum; PHD is not a member (the enum spells it DOCTORATE) and is rejected 400 ERR_INVALID_REQUEST with no applicant persisted."
        test_recipe:
          setup:
            - "Logical clock at default. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /platform/applicants"
              payload: { full_name: "Enum Erin", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "PHD", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /platform/applicants returns 0 rows"

      - name: application_create_with_both_body_fks_unknown_fails_on_applicant_first
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - endpoints.POST_/platform/applications
          - errors.ERR_REFERENCED_NOT_FOUND
        distinguishing_aspect: "Flat topology puts both FKs in the body and priority 4 checks them in declared input order — applicant_id before referral_partner_id. With BOTH unknown and channel PARTNER_REFERRAL, the error is ERR_REFERENCED_NOT_FOUND and the message names the applicant reference."
        test_recipe:
          setup:
            - "Logical clock at default. Model ACTIVE (bureau-only) so the no-active-model check cannot mask the FK check."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-E-6", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "fk", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
            - call: "POST /platform/model-versions/${m_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
          trigger:
            - call: "POST /platform/applications"
              payload: { applicant_id: "00000000-0000-4000-8000-000000000011", channel: "PARTNER_REFERRAL", referral_partner_id: "00000000-0000-4000-8000-000000000022", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_REFERENCED_NOT_FOUND"
            - "the error message identifies applicant_id (checked before referral_partner_id per declared input order)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: loan_chargeoff_from_delinquent_is_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Loan
          - errors.ERR_LOAN_INVALID_STATE
        distinguishing_aspect: "charge-off is declared only from DEFAULTED; a loan at DELINQUENT (days_delinquent 60) rejects POST /charge-off with 409 ERR_LOAN_INVALID_STATE and records no ServicingEvent."
        test_recipe:
          setup:
            - "Logical clock at default. Model ACTIVE; bank ACTIVE with box (APR 12.0); one loan funded and advanced twice (days_delinquent 60, status DELINQUENT)."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-S-1", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "sm", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
            - call: "POST /platform/model-versions/${m_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/partners"
              payload: { legal_name: "SM Bank", partner_type: "BANK", home_state: "TX" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { bank_id: $.data.id, bank_v0: $.data.version }
            - call: "POST /platform/partners/${bank_id}/activate"
              payload: {}
              as: PartnerAdmin
