  # ===========================================================================
  # Section 2 — State Machines (invalid_transitions / terminal_state_lockdown /
  #   idempotency / valid_transition / cascade_down + §1.8 stubs)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: transition_case_filed_to_hearing_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Case.FILED_to_SELECTION
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A FILED case cannot jump straight to HEARING (no FILED->HEARING edge); the transition
          returns 409 ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "One freshly FILED ARBITRATION case."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Jump", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_INVALID_STATE"

      - name: transition_withdrawn_case_is_terminal_locked
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Case.FILED_to_WITHDRAWN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          WITHDRAWN is terminal; a subsequent transition to SELECTION on a WITHDRAWN case returns
          409 ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A case moved FILED->WITHDRAWN."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "Term", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "WITHDRAWN" }
              as: CaseAdministrator
          trigger:
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_INVALID_STATE"

      - name: finalize_award_from_draft_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Award.DRAFT_to_ISSUED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          An award in DRAFT cannot transition directly to FINAL (only ISSUED->FINAL exists); the
          request returns 409 ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "An appointed HEARING case with a DRAFT MONETARY award."
          setup_api_calls:
            - call: "POST /neutrals"
              payload: { full_name: "Fin N", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "FinAw", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/awards"
              payload: { award_type: "MONETARY", award_amount_cents: 500000 }
              as: CaseAdministrator
              captures: { aw: $.data.id }
          trigger:
            - call: "POST /awards/${aw}/transition"
              payload: { to_status: "FINAL" }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_INVALID_STATE"

      - name: advance_appeal_filed_to_granted_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Appeal.FILED_to_UNDER_REVIEW
          - state_machines.Appeal.UNDER_REVIEW_to_GRANTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A FILED appeal cannot skip to GRANTED (only UNDER_REVIEW->GRANTED exists); the request
          returns 409 ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "An appointed HEARING case, MONETARY award 500000 ISSUED (clock 2026-06-01), appeal FILED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CaseAdministrator
            - call: "POST /neutrals"
              payload: { full_name: "Ap N", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "ApSkip", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/awards"
              payload: { award_type: "MONETARY", award_amount_cents: 500000 }
              as: CaseAdministrator
              captures: { aw: $.data.id }
            - call: "POST /awards/${aw}/transition"
              payload: { to_status: "ISSUED" }
              as: CaseAdministrator
            - call: "POST /appeals"
              payload: { award_id: "${aw}", ground: "PROCEDURAL" }
              as: Party
              as_user_id: "${pA}"
              captures: { ap: $.data.id }
          trigger:
            - call: "POST /appeals/${ap}/transition"
              payload: { to_status: "GRANTED" }
              as: CaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_INVALID_STATE"

      - name: pay_deposit_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Deposit.REQUESTED_to_PAID
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A second POST /deposits/{id}/pay on an already-PAID deposit returns 409 ERR_INVALID_STATE
          (the from-state REQUESTED no longer holds).
        test_recipe:
          setup:
            - "A FILED case with a party pA and a REQUESTED deposit that has been PAID once."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "DepTwice", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 100 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /deposits"
              payload: { case_id: "${c_id}", amount_cents: 100000 }
              as: CaseAdministrator
              captures: { dep: $.data.id }
            - call: "POST /deposits/${dep}/pay"
              as: Party
              as_user_id: "${pA}"
          trigger:
            - call: "POST /deposits/${dep}/pay"
              as: Party
              as_user_id: "${pA}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_INVALID_STATE"

      - name: submit_exchange_before_due_is_submitted
        claim_type: valid_transition
        grounds:
          - state_machines.Exchange.PENDING_to_SUBMITTED
          - entities.Exchange.fields.submitted_at
        distinguishing_aspect: |
          POST /exchanges/{id}/submit with the logical clock (2026-06-05) at/before due_at
          (2026-06-10) moves the exchange to SUBMITTED and stamps submitted_at.
        test_recipe:
          setup:
            - "A FILED case with a party pA and a PENDING exchange due 2026-06-10; clock 2026-06-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: CaseAdministrator
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "ExOnTime", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 100 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /cases/${c_id}/exchanges"
              payload: { exchange_type: "BRIEFS", due_at: "2026-06-10T00:00:00Z" }
              as: CaseAdministrator
              captures: { ex: $.data.id }
          trigger:
            - call: "POST /exchanges/${ex}/submit"
              as: Party
              as_user_id: "${pA}"
          assert:
            - "response.status == 200"
            - "Exchange.${ex}.status == SUBMITTED"

      - name: submit_exchange_after_due_is_late
        claim_type: valid_transition
        grounds:
          - state_machines.Exchange.PENDING_to_LATE
          - entities.Exchange.fields.due_at
        distinguishing_aspect: |
          POST /exchanges/{id}/submit with the logical clock (2026-06-15) strictly after due_at
          (2026-06-10) moves the exchange to LATE via the same endpoint.
        test_recipe:
          setup:
            - "A FILED case with a party pA and a PENDING exchange due 2026-06-10; clock 2026-06-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: CaseAdministrator
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "ExLate", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 100 }
              as: CaseAdministrator
              captures: { pA: $.data.id }
            - call: "POST /cases/${c_id}/exchanges"
              payload: { exchange_type: "BRIEFS", due_at: "2026-06-10T00:00:00Z" }
              as: CaseAdministrator
              captures: { ex: $.data.id }
          trigger:
            - call: "POST /exchanges/${ex}/submit"
              as: Party
              as_user_id: "${pA}"
          assert:
            - "response.status == 200"
            - "Exchange.${ex}.status == LATE"

      - name: mark_hearing_held_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.Hearing.SCHEDULED_to_HELD
        distinguishing_aspect: |
          POST /hearings/{id}/transition to HELD on a SCHEDULED hearing moves it to HELD.
        test_recipe:
          setup:
            - "An appointed HEARING case with one SCHEDULED hearing (clock 2026-06-01, hearing 2026-06-20)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CaseAdministrator
            - call: "POST /neutrals"
              payload: { full_name: "Hh N", neutral_type: "ARBITRATOR", hourly_rate_cents: 50000 }
              as: CaseAdministrator
              captures: { n_id: $.data.id }
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "HeldCase", claim_amount_cents: 2000000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "CLAIMANT", display_name: "A", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /parties"
              payload: { case_id: "${c_id}", role: "RESPONDENT", display_name: "B", share_pct: 50 }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "SELECTION" }
              as: CaseAdministrator
              captures: { cv_sel: $.data.version }
            - call: "POST /cases/${c_id}/candidates"
              payload: { neutral_id: "${n_id}", expected_case_version: "${cv_sel}" }
              as: CaseAdministrator
              captures: { cand: $.data.id }
            - call: "POST /candidates/${cand}/disclose"
              payload: { disclosure_text: "none", has_conflict: false }
              as: Neutral
              as_user_id: "${n_id}"
            - call: "POST /candidates/${cand}/transition"
              payload: { to_status: "CLEARED" }
              as: CaseAdministrator
            - call: "GET /cases/${c_id}"
              as: CaseAdministrator
              captures: { cv_pre: $.data.version }
            - call: "POST /cases/${c_id}/appoint"
              payload: { expected_case_version: "${cv_pre}" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/transition"
              payload: { to_status: "HEARING" }
              as: CaseAdministrator
            - call: "POST /cases/${c_id}/hearings"
              payload: { hearing_type: "EVIDENTIARY", start_at: "2026-06-20T09:00:00Z", end_at: "2026-06-20T11:00:00Z", location: "Room A" }
              as: CaseAdministrator
              captures: { h: $.data.id }
          trigger:
            - call: "POST /hearings/${h}/transition"
              payload: { to_status: "HELD" }
              as: CaseAdministrator
          assert:
