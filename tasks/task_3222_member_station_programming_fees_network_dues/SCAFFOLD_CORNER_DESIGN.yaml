        claim_type: violation_to_error
        grounds:
          - errors[ERR_MISSING_AUTH]
          - validations[priority=1]
        distinguishing_aspect: "A request with no role header is refused at the authentication priority before any existence or state check runs, even when the path id is also unknown."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; empty database"]
