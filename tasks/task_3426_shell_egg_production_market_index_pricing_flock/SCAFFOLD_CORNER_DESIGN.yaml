              as: Customer
              as_user_id: "${cu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the first create succeeds 201 and increments CustomerCommitment.version by 1"
            - "the second create with the same captured version returns 412 ERR_STALE_COMMITMENT_VERSION"
            - "GET /api/commitments/${cm_id}/orders returns exactly 1 row"

