            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew DC", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "DC1", weight_lbs: 100.0 }, as: RanchManager, captures: { lot: $.data.id } }
            - { call: "POST /api/wool-lots/${lot}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager }
            - { call: "POST /api/consignments", payload: { lot_id: "${lot}", pool_ref: "WWPA-DC" }, as: RanchManager, captures: { con: $.data.id } }
          trigger:
            - { call: "POST /api/consignments", payload: { lot_id: "${lot}", pool_ref: "WWPA-DC2" }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CONSIGNMENT_ALREADY_OPEN (409); only one consignment exists for lot ${lot}"

      - name: core_test_sod_lock_forbidden
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_CORE_TEST_SOD]", state_machines.CoreTest.RESULTED_to_LOCKED]
        distinguishing_aspect: "Segregation of duties: the lock is forbidden when the manager's X-User-ID equals the test's submitted_by_user_id, and permitted for a different user — a per-user (not per-role) rule."
        test_recipe:
          setup: ["Flock; clip; lot GRADED; CoreTest RESULTED, submitted by user wpo-1"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Sod Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew SD", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { clip: "$.data[0].id" } }
            - { call: "POST /api/wool-lots", payload: { clip_id: "${clip}", lot_code: "SD1", weight_lbs: 100.0 }, as: RanchManager, captures: { lot: $.data.id } }
            - { call: "POST /api/wool-lots/${lot}/grade", payload: { estimated_micron: 20.0 }, as: RanchManager }
            - { call: "POST /api/core-tests", payload: { lot_id: "${lot}", lab_ref: "LAB-SD1" }, as: WoolPoolOperator, as_user_id: "wpo-1", captures: { ct: $.data.id } }
            - { call: "POST /api/core-tests/${ct}/results", payload: { measured_micron: 19.0, clean_yield_pct: 62.0, vegetable_matter_pct: 1.0 }, as: WoolPoolOperator, as_user_id: "wpo-1" }
          trigger:
            - { call: "POST /api/core-tests/${ct}/transitions", payload: { to: "LOCKED" }, as: RanchManager, as_user_id: "wpo-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/core-tests/${ct}/transitions", payload: { to: "LOCKED" }, as: RanchManager, as_user_id: "rm-1" }
          assert:
            - "Lock by the submitter's user id: error_id == ERR_CORE_TEST_SOD (403); test stays RESULTED"
            - "Lock by a different user: CoreTest.${ct}.test_status == LOCKED and locked_by_user_id == rm-1"

      - name: sale_payment_amount_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", "errors[ERR_PAYMENT_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "Payment must equal booked_price_cents exactly; off-by-one-cent is rejected and the dimension stays UNPAID."
        test_recipe:
          setup: ["Flock (GOAT, 500); BREEDING sale 10 x 45000 = 450000 booked"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Pay Ranch", species: "GOAT", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "BREEDING", channel: "DIRECT", head_count: 10, per_head_price_cents: 45000, scheduled_date: "2026-09-20T00:00:00Z" }, as: RanchManager, captures: { sale: $.data.id } }
          trigger:
            - { call: "POST /api/livestock-sales/${sale}/record-payment", payload: { amount_cents: 450001 }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PAYMENT_AMOUNT_MISMATCH (422); payment_status stays UNPAID"

      - name: insufficient_head_on_sale_and_propose_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_INSUFFICIENT_HEAD]"]
        distinguishing_aspect: "The fiscal head gate fires on two endpoints: a sale offering 150 head from a 100-head flock, and proposing a contract whose min_head 150 exceeds the same flock."
        test_recipe:
          setup: ["Flock (SHEEP, 100); a DRAFT contract with min_head 150"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Short Ranch", species: "SHEEP", baseline_headcount: 100 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/grazing-contracts", payload: { flock_id: "${fl}", client_org_name: "Big Client", parcel_name: "Meadow 2", service_window_start: "2026-09-01T00:00:00Z", service_window_end: "2026-09-30T00:00:00Z", rate_per_head_day_cents: 90, min_head: 150, max_head: 600, target_cover_reduction_pct: 60.0 }, as: RanchManager, captures: { gc: $.data.id } }
          trigger:
            - { call: "POST /api/livestock-sales", payload: { flock_id: "${fl}", sale_type: "MEAT", channel: "DIRECT", head_count: 150, avg_weight_lbs: 100.0, base_price_per_cwt_cents: 20000, scheduled_date: "2026-09-20T00:00:00Z" }, as: RanchManager, captures: { err1: $.data.error_id } }
            - { call: "POST /api/grazing-contracts/${gc}/transitions", payload: { to: "PROPOSED" }, as: RanchManager, captures: { err2: $.data.error_id } }
          assert:
            - "Sale: err1 == ERR_INSUFFICIENT_HEAD (422)"
            - "Propose: err2 == ERR_INSUFFICIENT_HEAD (422); contract stays DRAFT"

      - name: contract_window_closed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_CONTRACT_WINDOW_CLOSED]"]
        distinguishing_aspect: "Both window gates share one error: activation before service_window_start and completion before service_window_end are both ERR_CONTRACT_WINDOW_CLOSED."
        test_recipe:
          setup: ["Flock (SHEEP, 800); contract A ACCEPTED (window 2026-09-01..09-30) with clock at 2026-08-15; contract B ACTIVE with clock at 2026-09-15"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Window Ranch", species: "SHEEP", baseline_headcount: 800 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/grazing-contracts", payload: { flock_id: "${fl}", client_org_name: "Client A", parcel_name: "Parcel A", service_window_start: "2026-09-01T00:00:00Z", service_window_end: "2026-09-30T00:00:00Z", rate_per_head_day_cents: 90, min_head: 50, max_head: 600, target_cover_reduction_pct: 60.0 }, as: RanchManager, captures: { gcA: $.data.id } }
            - { call: "POST /api/grazing-contracts/${gcA}/transitions", payload: { to: "PROPOSED" }, as: RanchManager }
            - { call: "POST /api/grazing-contracts/${gcA}/transitions", payload: { to: "ACCEPTED" }, as: GrazingClient }
            - { call: "POST /api/grazing-contracts", payload: { flock_id: "${fl}", client_org_name: "Client B", parcel_name: "Parcel B", service_window_start: "2026-09-01T00:00:00Z", service_window_end: "2026-09-30T00:00:00Z", rate_per_head_day_cents: 90, min_head: 50, max_head: 600, target_cover_reduction_pct: 60.0 }, as: RanchManager, captures: { gcB: $.data.id } }
            - { call: "POST /api/grazing-contracts/${gcB}/transitions", payload: { to: "PROPOSED" }, as: RanchManager }
            - { call: "POST /api/grazing-contracts/${gcB}/transitions", payload: { to: "ACCEPTED" }, as: GrazingClient }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/grazing-contracts/${gcB}/transitions", payload: { to: "ACTIVE" }, as: RanchManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/grazing-contracts/${gcA}/transitions", payload: { to: "ACTIVE" }, as: RanchManager, captures: { err1: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/grazing-contracts/${gcB}/complete", payload: { achieved_cover_reduction_pct: 65.0 }, as: RanchManager, captures: { err2: $.data.error_id } }
          assert:
            - "Early activation (clock 2026-08-15 < window start): err1 == ERR_CONTRACT_WINDOW_CLOSED (422); contract A stays ACCEPTED"
            - "Early completion (clock 2026-09-15 < window end): err2 == ERR_CONTRACT_WINDOW_CLOSED (422); contract B stays ACTIVE"

      - name: lot_delete_non_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WoolLot, "errors[ERR_LOT_INVALID_STATE]"]
        distinguishing_aspect: "DELETE is the compensating action for DRAFT lots only; a GRADED lot cannot be deleted."
