# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# Shared fixture policy "CA-OAK" (cap 550, threshold 500, notice 60/90,
# non-renewal lead 60) is rebuilt per instance from empty DB.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_policy_success_computed_effective_cap
        claim_type: creation
        grounds: [entities.RentCapPolicy.fields.effective_cap_bps, calculations.effective_cap_bps]
        distinguishing_aspect: "POST with all 8 required fields -> 201; computed effective_cap_bps == min(400+150, 900) == 550 and version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id, cap: $.data.effective_cap_bps, ver: $.data.version }
          assert:
            - "201 created; cap == 550; ver == 1; id is a server-minted UUID"

      - name: create_policy_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required base_cap_bps -> 400 ERR_INVALID_REQUEST; nothing persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: duplicate_jurisdiction_rejected
        claim_type: type_constraints
        grounds: [entities.RentCapPolicy.fields.jurisdiction_code, "errors[ERR_DUPLICATE_JURISDICTION]"]
        distinguishing_aspect: "Second policy with the same jurisdiction_code -> 409 ERR_DUPLICATE_JURISDICTION (tenant-wide uniqueness)."
        test_recipe:
          setup: ["one policy CA-OAK exists"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
          trigger:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 300, cpi_adjustment_bps: 100, hard_ceiling_bps: 800, high_increase_threshold_bps: 400, notice_days_low: 30, notice_days_high: 60, non_renewal_notice_days: 30 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_JURISDICTION (http 409)"

      - name: create_unit_duplicate_number_rejected
        claim_type: type_constraints
        grounds: [entities.Unit.fields.unit_number, "errors[ERR_DUPLICATE_UNIT_NUMBER]"]
        distinguishing_aspect: "(property_id, unit_number) uniqueness: second unit 101 on the same property -> 409; same number on a DIFFERENT property would succeed (not exercised here)."
        test_recipe:
          setup: ["policy + property + unit 101 exist"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Duplex Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "101", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "101", bedrooms: 2, current_market_rent_cents: 220000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_UNIT_NUMBER (http 409)"

      - name: create_lease_computed_term_end_and_denormalized_property
        claim_type: computed_fields
        grounds: [entities.Lease.fields.term_end_date, entities.Lease.fields.property_id]
        distinguishing_aspect: "Lease create computes term_end_date = 2026-06-01 + 12 months = 2027-06-01 and denormalizes property_id from the unit; both are non-input fields whose values appear in the 201 response."
        test_recipe:
          setup: ["policy, property, unit, resident exist"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Compute Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "102", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { unit: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Ana Bea", email: "ana.bea@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { end: $.data.term_end_date, prop_id: $.data.property_id, st: $.data.status, ver: $.data.version }
          assert:
            - "end == 2027-06-01 (calendar-month arithmetic, half-open end)"
            - "prop_id == ${prop} (denormalized from the unit, not client-supplied)"
            - "st == ACTIVE and ver == 1"

      - name: system_fields_server_minted_on_resident
        claim_type: system_fields
        grounds: [entities.Resident]
        distinguishing_aspect: "id, created_at, updated_at, version are server-generated on create; a Resident row is readable by id afterwards."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /residents"
              payload: { full_name: "Sys Field", email: "sys.field@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id, ver: $.data.version }
            - call: "GET /residents/${res}"
              as: PropertyManager
              captures: { name: $.data.full_name }
          assert:
            - "create returns a UUID id, ISO8601 created_at/updated_at, ver == 1"
            - "GET by id round-trips full_name == Sys Field"

      - name: offer_default_rate_strategy_balanced
        claim_type: defaults
        grounds: [entities.RenewalOffer.fields.rate_strategy]
        distinguishing_aspect: "Omitting rate_strategy on offer create applies the default BALANCED (gap 1000 bps x 0.6 = 600 bps before term discount), observable in the created offer."
        test_recipe:
          setup: ["policy, property band [18,18], unit market 220000, lease rent 200000 exist"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Default Court", rent_cap_policy_id: "${pol}", min_term_months: 18, max_term_months: 18 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "103", bedrooms: 1, current_market_rent_cents: 220000 }
              as: PlatformAdmin
              captures: { unit: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dee Fault", email: "dee.fault@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: $.data.id, lease_v: $.data.version }
          trigger:
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { strat: $.data.rate_strategy, proposed: $.data.proposed_rent_cents }
          assert:
            - "strat == BALANCED (default applied when omitted)"
            - "proposed == 210800 (the BALANCED computation, proving the default drove pricing)"

      - name: invalid_enum_rate_strategy_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "rate_strategy YOLO is not a declared enum member -> 400 ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["policy, property band [12,12], unit, lease exist"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Enum Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "104", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { unit: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "En Umer", email: "en.umer@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: $.data.id, lease_v: $.data.version }
          trigger:
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "YOLO", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400); no offer persisted (GET /renewal-offers?lease_id returns empty)"

      - name: resource_read_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_LEASE_NOT_FOUND]", "errors[ERR_OFFER_NOT_FOUND]", "errors[ERR_NOTICE_NOT_FOUND]", "errors[ERR_DOCUMENT_NOT_FOUND]", "errors[ERR_POLICY_NOT_FOUND]", "errors[ERR_PROPERTY_NOT_FOUND]", "errors[ERR_UNIT_NOT_FOUND]", "errors[ERR_RESIDENT_NOT_FOUND]", "errors[ERR_CONCESSION_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource GET with a well-formed but non-existent UUID returns its resource-specific 404 error id."
        test_recipe:
          setup: ["empty DB (no resources at all)"]
          setup_api_calls: []
          trigger:
            - call: "GET /leases/00000000-0000-4000-8000-0000000000aa"
              as: PropertyManager
              captures: { e_lease: $.data.error_id }
            - call: "GET /renewal-offers/00000000-0000-4000-8000-0000000000ab"
              as: PropertyManager
              captures: { e_offer: $.data.error_id }
            - call: "GET /non-renewal-notices/00000000-0000-4000-8000-0000000000ac"
              as: PropertyManager
              captures: { e_notice: $.data.error_id }
            - call: "GET /renewal-documents/00000000-0000-4000-8000-0000000000ad"
              as: PropertyManager
              captures: { e_doc: $.data.error_id }
            - call: "GET /rent-cap-policies/00000000-0000-4000-8000-0000000000ae"
              as: PropertyManager
              captures: { e_pol: $.data.error_id }
            - call: "GET /properties/00000000-0000-4000-8000-0000000000af"
              as: PropertyManager
              captures: { e_prop: $.data.error_id }
            - call: "GET /units/00000000-0000-4000-8000-0000000000b0"
              as: PropertyManager
              captures: { e_unit: $.data.error_id }
            - call: "GET /residents/00000000-0000-4000-8000-0000000000b1"
              as: PropertyManager
              captures: { e_res: $.data.error_id }
            - call: "GET /concession-approvals/00000000-0000-4000-8000-0000000000b2"
              as: PropertyManager
              captures: { e_conc: $.data.error_id }
          assert:
            - "e_lease == ERR_LEASE_NOT_FOUND, e_offer == ERR_OFFER_NOT_FOUND, e_notice == ERR_NOTICE_NOT_FOUND, e_doc == ERR_DOCUMENT_NOT_FOUND"
            - "e_pol == ERR_POLICY_NOT_FOUND, e_prop == ERR_PROPERTY_NOT_FOUND, e_unit == ERR_UNIT_NOT_FOUND, e_res == ERR_RESIDENT_NOT_FOUND, e_conc == ERR_CONCESSION_NOT_FOUND (all http 404)"

      - name: body_fk_existence_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=4]", entities.Property.fields.rent_cap_policy_id, entities.Unit.fields.property_id, entities.Lease.fields.unit_id, entities.Lease.fields.resident_id]
        distinguishing_aspect: "Body foreign keys are validated like path ids: each create with a dangling FK returns the PARENT resource's 404 (not the child's), proving existence checks run on referenced parents."
        test_recipe:
          setup: ["one real policy/property/unit/resident chain exists for the dangling-pair variants"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "FK Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "105", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { unit: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "FK Res", email: "fk.res@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { name: "Ghost", rent_cap_policy_id: "00000000-0000-4000-8000-0000000000c1", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /units"
              payload: { property_id: "00000000-0000-4000-8000-0000000000c2", unit_number: "106", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /leases"
              payload: { unit_id: "00000000-0000-4000-8000-0000000000c3", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { e3: $.data.error_id }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "00000000-0000-4000-8000-0000000000c4", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { e4: $.data.error_id }
          assert:
            - "e1 == ERR_POLICY_NOT_FOUND, e2 == ERR_PROPERTY_NOT_FOUND, e3 == ERR_UNIT_NOT_FOUND, e4 == ERR_RESIDENT_NOT_FOUND (all http 404)"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: offer_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.RenewalOffer]
        distinguishing_aspect: "A freshly created offer is DRAFT with offer_round 1 and null issued_on_date / response_deadline_date; it is NOT yet visible to the resident for responses."
        test_recipe:
          setup: ["policy, property band [12,12], unit, resident, lease exist"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Initial Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "201", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { unit: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Ini Tial", email: "ini.tial@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: $.data.id, lease_v: $.data.version }
          trigger:
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "CONSERVATIVE", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { st: $.data.status, round: $.data.offer_round, issued: $.data.issued_on_date, deadline: $.data.response_deadline_date }
          assert:
            - "st == DRAFT, round == 1, issued is null, deadline is null"

      - name: respond_on_draft_offer_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RenewalOffer.ISSUED_to_ACCEPTED, "errors[ERR_OFFER_NOT_ISSUED]"]
        distinguishing_aspect: "Respond targets only ISSUED offers; a DRAFT offer rejects ACCEPT with ERR_OFFER_NOT_ISSUED and stays DRAFT."
        test_recipe:
          setup: ["offer created (DRAFT) on an ACTIVE lease; never issued"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Draft Gate", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "202", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { unit: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dra Ft", email: "dra.ft@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: $.data.id, lease_v: $.data.version }
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "CONSERVATIVE", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { offer: $.data.id }
          trigger:
            - call: "POST /renewal-offers/${offer}/respond"
              payload: { response_type: "ACCEPT" }
              as: Resident
              as_user_id: "${res}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OFFER_NOT_ISSUED (http 409); offer remains DRAFT"

      - name: issue_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.RenewalOffer.DRAFT_to_ISSUED, "errors[ERR_OFFER_NOT_DRAFT]"]
        distinguishing_aspect: "The same issue trigger twice: first succeeds (DRAFT -> ISSUED), second fails with ERR_OFFER_NOT_DRAFT — transitions are not idempotent."
        test_recipe:
          setup: ["offer ISSUED once on an ACTIVE lease"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Twice Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "203", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { unit: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Twi Ce", email: "twi.ce@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: $.data.id, lease_v: $.data.version }
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "CONSERVATIVE", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { offer: $.data.id }
            - call: "POST /renewal-offers/${offer}/issue"
              payload: {}
              as: LeasingAgent
          trigger:
            - call: "POST /renewal-offers/${offer}/issue"
              payload: {}
              as: LeasingAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OFFER_NOT_DRAFT (http 409); offer remains ISSUED with unchanged issued_on_date 2026-05-01"

      - name: withdraw_executed_offer_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RenewalOffer, "errors[ERR_OFFER_NOT_WITHDRAWABLE]"]
        distinguishing_aspect: "EXECUTED is a lockdown state for withdraw: after countersign, withdrawing the offer is rejected with ERR_OFFER_NOT_WITHDRAWABLE (only rescission of the document can undo it)."
        test_recipe:
          setup: ["full renewal loop executed: offer CONSERVATIVE 203000 issued, accepted, signed, countersigned at 2026-05-01"]
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Lock Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
