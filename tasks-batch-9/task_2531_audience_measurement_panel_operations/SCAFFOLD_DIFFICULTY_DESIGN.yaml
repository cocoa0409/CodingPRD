          A different contended resource and different interval semantics from the meter case: the
          resource is a Market and the intervals are run windows, where a partial overlap is fatal, a
          touching window is fine, and a BYTE-IDENTICAL window is the deliberate exception that
          supersedes the older run - unless that older run has reached PUBLISHED, at which point the
          identical window is refused like any other overlap.
