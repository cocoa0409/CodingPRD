        distinguishing_aspect: |
          Error-category pair (business_safety vs business_temporal): the
          offered building's security_capability 3 is below the required level
          4 AND the offer's valid_until is already in the past. Priority 8
          safety beats priority 9 temporal: the response must be
          ERR_SECURITY_LEVEL_INSUFFICIENT (422), never ERR_OFFER_EXPIRED.
          Different category pair from the state-vs-fiscal instance.
        test_recipe:
          setup:
            - "Requirement SOLICITING with required_security_level == 4 (53 ISC points plus SCIF floor)"
            - "Offer UNDER_EVALUATION on a LEASED_STOCK building with security_capability 3 and valid_until 2026-09-15 (expired relative to logical clock 2026-10-01)"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-180", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Low-Posture Plaza", address: "9 Side St", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 3, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2026-09-15T00:00:00Z" }, as: LessorRep, captures: { off: $.data.id } }
            - { call: "POST /leasing/offers/${off}/evaluate", as: GSALeasingOfficer }
          trigger:
            - { call: "POST /leasing/offers/${off}/select", as: GSALeasingOfficer, captures: { err: $.data.error_id } }
          assert:
            - "Select fails with ${err} == ERR_SECURITY_LEVEL_INSUFFICIENT (safety, priority 8)"
            - "${err} != ERR_OFFER_EXPIRED (temporal, priority 9, must lose despite valid_until 2026-09-15 < clock 2026-10-01)"
            - "Requirement ${req}.status remains SOLICITING and no Lease is created (GET /leasing/leases?requirement_id=${req} returns an empty list)"

  - rule_id: boundary_precision_check
    instances:
      - name: utilization_exactly_threshold_proposes_no_action
        grounds:
          - calculations.utilization_rate
          - entities.UtilizationSurvey.fields.reduction_action_id
        distinguishing_aspect: |
          Boundary on the utilization RATE metric via the finalize endpoint:
          rate exactly == 0.6000 does NOT satisfy the strict `< 0.60` trigger,
          so no SpaceReductionAction is proposed; the paired survey at headcount
          70 (rate 0.5250) does propose one with recommended_release_sf 9,500.
        test_recipe:
          setup:
            - "Owned building 50,000 sf; OA ACTIVE over 20,000 sf; clock 2027-03-20"
            - "Survey S1 SPACE_BASED utilized_sf 12,000 (12,000 / 20,000 = 0.6000 exactly); survey S2 HEADCOUNT_BASED measured_headcount 70 (0.5250)"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-190", name: "Park Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Legacy Federal", address: "1 Constitution Ave", region_code: "R11", ownership_type: "FEDERALLY_OWNED", security_capability: 4, total_sf: 50000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-20T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/occupancy-agreements", payload: { building_id: "${bld}", agency_id: "${ag}", assigned_sf: 20000, start_date: "2026-11-01", end_date: "2036-10-31", shell_equivalent_rate_per_sf_yr_cents: 2800, operating_rate_per_sf_yr_cents: 800 }, as: GSALeasingOfficer, captures: { oa: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements/${oa}/activate", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/occupancy-agreements/${oa}/utilization-surveys", payload: { method: "SPACE_BASED", measured_headcount: 100, utilized_sf: 12000, measured_at: "2027-03-15T00:00:00Z" }, as: GSAPropertyManager, captures: { s1: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements/${oa}/utilization-surveys", payload: { method: "HEADCOUNT_BASED", measured_headcount: 70, utilized_sf: 10500, measured_at: "2027-03-15T00:00:00Z" }, as: GSAPropertyManager, captures: { s2: $.data.id } }
          trigger:
            - { call: "POST /leasing/utilization-surveys/${s1}/finalize", as: GSAPropertyManager }
            - { call: "POST /leasing/utilization-surveys/${s2}/finalize", as: GSAPropertyManager }
          assert:
            - "Survey ${s1}: utilization_rate == 0.6000 and reduction_action_id is null (exactly at threshold: no trigger)"
            - "Survey ${s2}: utilization_rate == 0.5250 and reduction_action_id is non-null with recommended_release_sf == 9500"
            - "GET /leasing/occupancy-agreements/${oa}/space-reduction-actions returns exactly 1 action (only S2's)"

      - name: tax_escalation_actual_equals_base_yields_zero
        grounds:
          - calculations.tax_escalation
          - entities.RentBill.fields.tax_escalation_cents
        distinguishing_aspect: |
          Boundary on the CURRENCY metric via the bill endpoint: when actual
          tax per sf EQUALS the base year (400 == 400), the strict
          max(0, actual - base) yields exactly 0 — no escalation is billed —
          and the fee is computed on the tax-free subtotal (1,142,349 on
          22,846,970, exposing the half-up rounding of a .5 fee). Different
          metric and different endpoint from the utilization instance.
        test_recipe:
          setup:
            - "Leased OA ACTIVE over 68,300 sf; lease commenced 2027-01-01, 3 free-rent months, ANNUITY TI 649,470/month"
            - "2027 tax statement with actual_tax_per_sf_yr_cents == 400 (exactly equal to base)"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-195", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off: $.data.id } }
            - { call: "POST /leasing/offers/${off}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off}/select", as: GSALeasingOfficer, captures: { lease: $.data.id } }
            - { call: "POST /leasing/leases/${lease}/commence", payload: { commencement_date: "2027-01-01", ti_buildout_cost_cents: 400000000, ti_amort_method: "ANNUITY" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/occupancy-agreements", payload: { lease_id: "${lease}", agency_id: "${ag}", assigned_sf: 68300, start_date: "2027-01-01", end_date: "2036-12-31" }, as: GSALeasingOfficer, captures: { oa: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements/${oa}/activate", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/leases/${lease}/tax-statements", payload: { tax_year: 2027, actual_tax_per_sf_yr_cents: 400 }, as: GSALeasingOfficer }
          trigger:
            - { call: "POST /leasing/occupancy-agreements/${oa}/bills", payload: { billing_month: "2027-04" }, as: GSAPropertyManager }
          assert:
            - "Bill.tax_escalation_cents == 0 (actual == base is NOT above base)"
            - "Bill.fee_cents == 1142349 (round_half_up of 22,846,970 * 0.05 = 1,142,348.5 rounds UP)"
            - "Bill.total_cents == 23989319"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: oa_activation_gated_on_lease_commencement
        grounds:
          - state_machines.OccupancyAgreement.DRAFT_to_ACTIVE
          - state_machines.Lease.AWARDED_to_COMMENCED
          - errors[ERR_LEASE_NOT_COMMENCED]
        distinguishing_aspect: |
          Entity pair (OccupancyAgreement -> Lease): a leased OA cannot leave
          DRAFT while its lease is merely AWARDED; only after the lease
          reaches COMMENCED does the same activate call succeed. Distinct
          entity pair from the alteration->OA instance.
        test_recipe:
          setup:
            - "Requirement awarded; Lease AWARDED (not yet commenced); OA created in DRAFT against that lease"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-210", name: "Forest Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Metro Tower", address: "100 Federal Plaza", region_code: "R9", ownership_type: "LEASED_STOCK", security_capability: 5, total_sf: 200000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
            - { call: "POST /leasing/space-requirements", payload: { agency_id: "${ag}", title: "HQ Consolidation", base_headcount: 400, annual_growth_pct: 0.02, target_occupancy_year: 2031, sf_per_person: 150, special_needs: [{ need_type: "SCIF", sf: 2000 }], region_code: "R9", mission_points: 20, population_points: 15, size_points: 10, criticality_points: 8 }, as: AgencyManager, as_user_id: "${ag}", captures: { req: $.data.id } }
            - { call: "POST /leasing/space-requirements/${req}/submit", as: AgencyManager, as_user_id: "${ag}" }
            - { call: "POST /leasing/space-requirements/${req}/validate", as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/complete-market-survey", payload: { survey_summary: "Five buildings toured" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/space-requirements/${req}/offers", payload: { building_id: "${bld}", lessor_name: "Metro REIT LLC", shell_rate_per_sf_yr_cents: 3000, operating_rate_per_sf_yr_cents: 900, base_year_tax_per_sf_yr_cents: 400, escalation_method: "BASE_YEAR_STOP", ti_allowance_per_sf_cents: 5000, free_rent_months: 3, term_years: 10, valid_until: "2027-12-31T00:00:00Z" }, as: LessorRep, captures: { off: $.data.id } }
            - { call: "POST /leasing/offers/${off}/evaluate", as: GSALeasingOfficer }
            - { call: "POST /leasing/offers/${off}/select", as: GSALeasingOfficer, captures: { lease: $.data.id } }
            - { call: "POST /leasing/occupancy-agreements", payload: { lease_id: "${lease}", agency_id: "${ag}", assigned_sf: 68300, start_date: "2027-01-01", end_date: "2036-12-31" }, as: GSALeasingOfficer, captures: { oa: $.data.id } }
          trigger:
            - { call: "POST /leasing/occupancy-agreements/${oa}/activate", as: AgencyManager, as_user_id: "${ag}", captures: { err: $.data.error_id } }
            - { call: "POST /leasing/leases/${lease}/commence", payload: { commencement_date: "2027-01-01", ti_buildout_cost_cents: 400000000, ti_amort_method: "ANNUITY" }, as: GSALeasingOfficer }
            - { call: "POST /leasing/occupancy-agreements/${oa}/activate", as: AgencyManager, as_user_id: "${ag}" }
          assert:
            - "First activate fails with ${err} == ERR_LEASE_NOT_COMMENCED and OA ${oa}.status remains DRAFT"
            - "After commence (Lease.status == COMMENCED, end_date == '2036-12-31'), second activate succeeds: OA ${oa}.status == ACTIVE"

      - name: alteration_lifecycle_gated_on_oa_active
        grounds:
          - state_machines.AlterationRequest.REQUESTED_to_ESTIMATED
          - state_machines.OccupancyAgreement.DRAFT_to_ACTIVE
          - errors[ERR_OA_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair (AlterationRequest -> OccupancyAgreement): no alteration
          can even be CREATED while the OA is DRAFT, and the same create call
          succeeds once the OA is ACTIVE. Distinct entity pair from the
          OA->Lease instance.
        test_recipe:
          setup:
            - "Owned building 50,000 sf; OA over 20,000 sf still in DRAFT"
          setup_api_calls:
            - { call: "POST /leasing/agencies", payload: { bureau_code: "BUR-220", name: "Park Service" }, as: GSAAdmin, captures: { ag: $.data.id } }
            - { call: "POST /leasing/buildings", payload: { building_name: "Legacy Federal", address: "1 Constitution Ave", region_code: "R11", ownership_type: "FEDERALLY_OWNED", security_capability: 4, total_sf: 50000 }, as: GSAAdmin, captures: { bld: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: GSAAdmin }
