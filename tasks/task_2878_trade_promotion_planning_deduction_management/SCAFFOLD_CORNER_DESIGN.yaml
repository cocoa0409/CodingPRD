      - name: spend_ratio_exactly_at_overspend_warning_ratio_corner_stub_calculations
        claim_type: constants_applied
        grounds:
          - calculations.promotion_spend_status.constants.OVERSPEND_WARNING_RATIO
          - calculations.promotion_spend_status.constants.OVERSPENT_RATIO
        excluded_because:
          difficulty_instance: spend_ratio_exactly_at_overspend_warning_ratio
          rationale: |
            The constants_applied corner for promotion_spend_status is the OVERSPEND_WARNING /
            OVERSPENT boundary itself, and the difficulty instance already pins the 0.9000
            and 1.0000 constants with a strict-greater-than probe at 1.0000 exactly.

      - name: accrual_shipment_basis_vs_consumption_basis_diverge_corner_stub_calculations
        claim_type: variant_divergence
        grounds:
          - calculations.accrual_amount_for_period
          - calculations.accrual_amount_for_period.constants.SHIPMENT_LEAD_DAYS
        excluded_because:
          difficulty_instance: accrual_shipment_basis_vs_consumption_basis_diverge
          rationale: |
            The variant_divergence corner is exactly the two-basis contrast: the same week of
            facts posts a different amount under SHIPMENT (14-day lead shift, EDI_856 facts)
            than under CONSUMPTION, and the difficulty instance runs both bases side by side
            off one shared fact set.

  - section: validations
    instances:
      - name: path_id_existence_outranks_body_reference_existence
        claim_type: priority_ordering
        grounds:
          - validations.priority_20
          - validations.priority_21
        distinguishing_aspect: |
          One request carries two dead references: an unknown deductionId in the path and an
          unknown promotion_id in the body. Priority 20 (path ids) runs before priority 21
          (body references), so the envelope must name ERR_DEDUCTION_NOT_FOUND and never
          ERR_PROMOTION_NOT_FOUND.
        test_recipe:
          setup:
            - "An empty ledger with the logical clock pinned; both identifiers in the request are absent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
          trigger:
            - call: "POST /trade-marketing/deductions/11111111-1111-4111-8111-111111111111/match"
              payload: { promotion_id: "22222222-2222-4222-8222-222222222222" }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and ${err} == ERR_DEDUCTION_NOT_FOUND"
            - "${err} != ERR_PROMOTION_NOT_FOUND — the body reference is never reached"

      - name: role_authorisation_outranks_path_id_existence
        claim_type: priority_ordering
        grounds:
          - validations.priority_3
          - validations.priority_20
        distinguishing_aspect: |
          A ComplianceAuditor locking a program id that does not exist gets
          ERR_ROLE_NOT_PERMITTED (priority 3), not ERR_PROGRAM_NOT_FOUND (priority 20): the
          403 must not leak whether the resource exists.
        test_recipe:
          setup:
            - "An empty ledger with the logical clock pinned; the programId in the path is absent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
          trigger:
            - call: "POST /trade-marketing/programs/33333333-3333-4333-8333-333333333333/lock"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 and ${err} == ERR_ROLE_NOT_PERMITTED"
            - "${err} != ERR_PROGRAM_NOT_FOUND — existence is never probed for an unauthorised caller"

      - name: malformed_body_outranks_deduction_state_precondition
        claim_type: priority_ordering
        grounds:
          - validations.priority_10
          - validations.priority_47
        distinguishing_aspect: |
          Validating a still-RECEIVED deduction with expected_promotion_version omitted has
          two defects at once. Priority 10 (request shape) precedes priority 47 (deduction
          status), so the answer is a 400 ERR_INVALID_REQUEST, not a 409
          ERR_DEDUCTION_STATE_INVALID.
        test_recipe:
          setup:
            - "One customer and one RECEIVED deduction that has never been matched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/deductions"
              payload: { customer_id: "${cust_id}", claim_reference: "MM-CLAIM-0010", claimed_amount: 900.00, deduction_date: "2026-08-03" }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { ded_id: $.data.id }
          trigger:
            - call: "POST /trade-marketing/deductions/${ded_id}/validate"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and ${err} == ERR_INVALID_REQUEST"
            - "${err} != ERR_DEDUCTION_STATE_INVALID and ${err} != ERR_STALE_PROMOTION_VERSION"
            - "Deduction.${ded_id}.status == RECEIVED and .validated_amount == null"

      - name: stale_allocation_version_outranks_allocation_approval_state
        claim_type: priority_conflict
        grounds:
          - validations.priority_30
          - validations.priority_41
        distinguishing_aspect: |
          A promotion is created against a DRAFT allocation (version 1) while passing the
          version 2 captured from a different, approved allocation. Both the concurrency gate
          (priority 30) and the parent-status gate (priority 41) are violated; the response
          must be 412 ERR_STALE_ALLOCATION_VERSION, not 409 ERR_ALLOCATION_NOT_APPROVED.
        test_recipe:
          setup:
            - "Two allocations on the same customer and brand: one left in DRAFT at version 1, one approved so its version reads 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 500000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 60000.00, baseline_units: 20000, planned_incremental_units: 10000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_draft_id: $.data.id, draft_version: $.data.version }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "NEW_ITEM", planned_amount: 40000.00, baseline_units: 10000, planned_incremental_units: 8000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_other_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_other_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { other_version: $.data.version }
          trigger:
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_draft_id}", name: "Premature Event", window_start: "2026-08-03", window_end: "2026-08-17", accrual_method: "CONSUMPTION", expected_allocation_version: "${other_version}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { err: $.data.error_id }
          assert:
            - "${draft_version} == 1 and ${other_version} == 2 — approval bumped only the other allocation"
            - "HTTP 412 and ${err} == ERR_STALE_ALLOCATION_VERSION"
            - "${err} != ERR_ALLOCATION_NOT_APPROVED — the concurrency gate runs first"
            - "BudgetAllocation.${alloc_draft_id}.status == DRAFT and .version == 1 — the failed create wrote nothing"

      - name: deduction_customer_mismatch_outranks_promotion_matchability
        claim_type: cascading_validation
        grounds:
          - validations.priority_61
          - validations.priority_62
        distinguishing_aspect: |
          The target promotion is both foreign (it belongs to another customer) and unmatchable
          (still DRAFT). Priority 61 fires first, so the caller learns
          ERR_DEDUCTION_CUSTOMER_MISMATCH; only after the customer is right does priority 62
          get a chance to report ERR_PROMOTION_NOT_MATCHABLE.
        test_recipe:
          setup:
