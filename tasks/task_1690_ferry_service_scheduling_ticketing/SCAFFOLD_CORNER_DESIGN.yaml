        claim_type: violation_to_error
        grounds: ["errors[ERR_CREW_REST_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_half_open_interval_with_rest_gap
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_stale_version_on_fare_schedule_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[fare-schedule-create-stale-route]"]
        distinguishing_aspect: "Second fare-schedule create carrying the pre-first-create route version is rejected 412 ERR_STALE_VERSION; carrying the advanced version succeeds."
        test_recipe:
          setup: ["route created (version 1); first fare schedule created with expected_route_version=1 (route version now 2)"]
          setup_api_calls:
            - call: "POST /ferry/routes"
              payload: { route_code: "SEA-BI", origin_terminal: "Seattle", destination_terminal: "Bainbridge", crossing_minutes: 35, turnaround_minutes: 15 }
              as: SchedulerAdmin
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "OFF_PEAK", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
              captures: { fs1_id: $.data.id }
          trigger:
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "PEAK", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v}" }
              as: SchedulerAdmin
              captures: { err: $.data.error_id }
            - call: "POST /ferry/routes/${route_id}/fare-schedules"
              payload: { season: "PEAK", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", passenger_standard_cents: 1000, passenger_resident_cents: 800, passenger_commuter_cents: 600, vehicle_standard_base_cents: 2000, vehicle_oversize_base_cents: 4000, vehicle_overlength_per_foot_cents: 100, fuel_surcharge_cents: 0, expected_route_version: "${route_v} + 1" }
              as: SchedulerAdmin
              captures: { fs2_id: $.data.id }
          assert:
            - "stale create -> error_id == ERR_STALE_VERSION, HTTP 412"
            - "fresh create with expected_route_version == 2 -> 201"

