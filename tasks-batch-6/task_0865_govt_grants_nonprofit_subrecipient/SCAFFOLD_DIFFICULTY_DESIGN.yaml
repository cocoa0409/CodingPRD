scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: indirect_recovery_de_minimis_vs_negotiated
        grounds:
          - calculations.indirect_cost_recovery
          - entities.Subaward.fields.indirect_cost_cents
          - state_machines.Subaward.DRAFT_to_ACTIVE
        distinguishing_aspect: "Identical single PERSONNEL BudgetLine (10000000, MTDC base 10000000): NEGOTIATED@0.20 yields indirect_cost_cents==2000000 while DE_MINIMIS@0.10 yields 1000000 — same input, divergent output selected by the Subaward.indirect_method variant (Subaward domain)."
        test_recipe:
          setup:
            - "A NOFO with cap 0.30; two nonprofits each with one AWARDED+activated subaward built from the same single PERSONNEL line 10000000, one DE_MINIMIS (total 11000000) and one NEGOTIATED@0.20 (total 12000000)."
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "Alpha Org", uei: "UEI-A", ein: "11-1111111" }
              as: ProgramOfficer
              captures: { np_a: $.data.id }
            - call: "POST /nonprofits"
              payload: { legal_name: "Beta Org", uei: "UEI-B", ein: "22-2222222" }
              as: ProgramOfficer
              captures: { np_b: $.data.id }
            - call: "POST /nofos"
              payload: { title: "Community Health", cfda_number: "93.999", total_pool_cents: 100000000, max_award_cents: 100000000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
              captures: { nofo_id: $.data.id }
            - call: "POST /nofos/${nofo_id}/applications"
              payload: { nonprofit_id: "${np_a}", project_title: "P-A", requested_amount_cents: 11000000, proposed_period_start: "2026-06-01T00:00:00Z", proposed_period_end: "2027-05-31T00:00:00Z", indirect_method: "DE_MINIMIS" }
              as: Subrecipient
              as_user_id: "${np_a}"
              captures: { app_a: $.data.id }
            - call: "POST /applications/${app_a}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_a}"
            - call: "POST /applications/${app_a}/start-review"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${app_a}/reviews"
              payload: { score: 80 }
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /applications/${app_a}/reviews"
              payload: { score: 85 }
              as: Panelist
              as_user_id: "pan-2"
            - call: "POST /applications/${app_a}/reviews"
              payload: { score: 90 }
              as: Panelist
              as_user_id: "pan-3"
            - call: "POST /applications/${app_a}/award"
              payload: {}
              as: ProgramOfficer
            - call: "GET /subawards"
              payload: { application_id: "${app_a}" }
              as: ProgramOfficer
              captures: { sub_a: "$.data[0].id" }
            - call: "POST /subawards/${sub_a}/budget-lines"
              payload: { category: "PERSONNEL", amount_cents: 10000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /nofos/${nofo_id}/applications"
              payload: { nonprofit_id: "${np_b}", project_title: "P-B", requested_amount_cents: 12000000, proposed_period_start: "2026-06-01T00:00:00Z", proposed_period_end: "2027-05-31T00:00:00Z", indirect_method: "NEGOTIATED", negotiated_indirect_rate: 0.20 }
              as: Subrecipient
              as_user_id: "${np_b}"
              captures: { app_b: $.data.id }
            - call: "POST /applications/${app_b}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_b}"
            - call: "POST /applications/${app_b}/start-review"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${app_b}/reviews"
              payload: { score: 70 }
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /applications/${app_b}/reviews"
              payload: { score: 75 }
              as: Panelist
              as_user_id: "pan-2"
            - call: "POST /applications/${app_b}/reviews"
              payload: { score: 88 }
              as: Panelist
              as_user_id: "pan-3"
            - call: "POST /applications/${app_b}/award"
              payload: {}
              as: ProgramOfficer
            - call: "GET /subawards"
              payload: { application_id: "${app_b}" }
              as: ProgramOfficer
              captures: { sub_b: "$.data[0].id" }
            - call: "POST /subawards/${sub_b}/budget-lines"
              payload: { category: "PERSONNEL", amount_cents: 10000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
          trigger:
            - call: "POST /subawards/${sub_a}/activate"
              payload: {}
              as: ProgramOfficer
              captures: { ind_a: $.data.indirect_cost_cents }
            - call: "POST /subawards/${sub_b}/activate"
              payload: {}
              as: ProgramOfficer
              captures: { ind_b: $.data.indirect_cost_cents }
          assert:
            - "Subaward.${sub_a}.indirect_cost_cents == 1000000"
            - "Subaward.${sub_b}.indirect_cost_cents == 2000000"

      - name: drawdown_provisional_vs_final_reimbursable
        grounds:
          - calculations.drawdown_reimbursable
          - entities.Drawdown.fields.provisional_reimbursable_cents
          - entities.Drawdown.fields.final_reimbursable_cents
          - state_machines.Drawdown.SUBMITTED_to_APPROVED
        distinguishing_aspect: "For one Drawdown (requested 5000000, disallowed 750000, available 26200000): PROVISIONAL variant sets provisional_reimbursable_cents==5000000 at submit, FINAL variant sets final_reimbursable_cents==4250000 at approve — same row, divergent by lifecycle phase (Drawdown domain)."
        test_recipe:
          setup:
            - "An ACTIVE subaward with total_budget_cents 26200000 (the MTDC example budget) and obligated_cents 0; one Drawdown submitted for 5000000."
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "Gamma Org", uei: "UEI-G", ein: "33-3333333" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
            - call: "POST /nofos"
              payload: { title: "Housing", cfda_number: "14.001", total_pool_cents: 100000000, max_award_cents: 100000000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
              captures: { nofo_id: $.data.id }
            - call: "POST /nofos/${nofo_id}/applications"
              payload: { nonprofit_id: "${np_id}", project_title: "P", requested_amount_cents: 26200000, proposed_period_start: "2026-06-01T00:00:00Z", proposed_period_end: "2027-05-31T00:00:00Z", indirect_method: "DE_MINIMIS" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 80 }
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 85 }
              as: Panelist
              as_user_id: "pan-2"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 90 }
              as: Panelist
              as_user_id: "pan-3"
            - call: "POST /applications/${app_id}/award"
              payload: {}
              as: ProgramOfficer
            - call: "GET /subawards"
              payload: { application_id: "${app_id}" }
              as: ProgramOfficer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "PERSONNEL", amount_cents: 10000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "FRINGE", amount_cents: 3000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "TRAVEL", amount_cents: 1000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "SUPPLIES", amount_cents: 500000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "EQUIPMENT", amount_cents: 4000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "CONTRACTUAL", amount_cents: 6000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/activate"
              payload: {}
              as: ProgramOfficer
              captures: { sub_v0: $.data.version }
          trigger:
            - call: "POST /subawards/${sub_id}/drawdowns"
              payload: { requested_amount_cents: 5000000, period_covered_start: "2026-06-01T00:00:00Z", period_covered_end: "2026-06-30T00:00:00Z", expected_subaward_version: "${sub_v0}" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { dd_id: $.data.id, prov: $.data.provisional_reimbursable_cents }
            - call: "POST /drawdowns/${dd_id}/approve"
              payload: { disallowed_amount_cents: 750000 }
              as: GrantsManager
              as_user_id: "gm-1"
              captures: { fin: $.data.final_reimbursable_cents }
          assert:
            - "Drawdown.${dd_id}.provisional_reimbursable_cents == 5000000"
            - "Drawdown.${dd_id}.final_reimbursable_cents == 4250000"
            - "Subaward.${sub_id}.obligated_cents == 4250000"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: indirect_mtdc_excludes_equipment_and_caps_contractual
        grounds:
          - calculations.indirect_cost_recovery
          - entities.BudgetLine.fields.category
          - entities.Subaward.fields.indirect_cost_cents
        distinguishing_aspect: "Mode (a): MTDC base = PERSONNEL+FRINGE+TRAVEL+SUPPLIES + min(CONTRACTUAL,2500000), EQUIPMENT excluded entirely; base==17000000 and DE_MINIMIS indirect==1700000 — a naive base including full equipment (21000000) and full contractual would give 2450000."
        test_recipe:
          setup:
            - "An awarded DRAFT subaward (total 26200000) with the six-line MTDC budget: PERSONNEL 10000000, FRINGE 3000000, TRAVEL 1000000, SUPPLIES 500000, EQUIPMENT 4000000, CONTRACTUAL 6000000."
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "Delta Org", uei: "UEI-D", ein: "44-4444444" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
            - call: "POST /nofos"
              payload: { title: "Workforce", cfda_number: "17.207", total_pool_cents: 100000000, max_award_cents: 100000000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
              captures: { nofo_id: $.data.id }
            - call: "POST /nofos/${nofo_id}/applications"
              payload: { nonprofit_id: "${np_id}", project_title: "P", requested_amount_cents: 26200000, proposed_period_start: "2026-06-01T00:00:00Z", proposed_period_end: "2027-05-31T00:00:00Z", indirect_method: "DE_MINIMIS" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 80 }
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 85 }
              as: Panelist
              as_user_id: "pan-2"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 90 }
              as: Panelist
              as_user_id: "pan-3"
            - call: "POST /applications/${app_id}/award"
              payload: {}
              as: ProgramOfficer
            - call: "GET /subawards"
              payload: { application_id: "${app_id}" }
              as: ProgramOfficer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "PERSONNEL", amount_cents: 10000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "FRINGE", amount_cents: 3000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "TRAVEL", amount_cents: 1000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "SUPPLIES", amount_cents: 500000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "EQUIPMENT", amount_cents: 4000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "CONTRACTUAL", amount_cents: 6000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
          trigger:
            - call: "POST /subawards/${sub_id}/activate"
              payload: {}
              as: ProgramOfficer
              captures: { ind: $.data.indirect_cost_cents }
          assert:
            - "Subaward.${sub_id}.indirect_cost_cents == 1700000"
            - "Subaward.${sub_id}.status == ACTIVE"

      - name: federal_share_per_line_rounding
        grounds:
          - calculations.subaward_federal_share
          - entities.BudgetLine.fields.federal_share_pct
          - entities.Subaward.fields.federal_share_cents
        distinguishing_aspect: "Mode (b): two lines each 12345 @0.5 round-half-up per line to 6173+6173==12346, NOT sum-then-round (24690*0.5==12345); the pinned per-line order yields a 1-cent difference."
        test_recipe:
          setup:
            - "An awarded DRAFT subaward (total 27159) with two DE_MINIMIS lines PERSONNEL 12345@0.5 and SUPPLIES 12345@0.5; indirect = round(24690*0.10)=2469."
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "Epsilon Org", uei: "UEI-E", ein: "55-5555555" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
            - call: "POST /nofos"
              payload: { title: "Nutrition", cfda_number: "10.557", total_pool_cents: 100000000, max_award_cents: 100000000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
              captures: { nofo_id: $.data.id }
            - call: "POST /nofos/${nofo_id}/applications"
              payload: { nonprofit_id: "${np_id}", project_title: "P", requested_amount_cents: 27159, proposed_period_start: "2026-06-01T00:00:00Z", proposed_period_end: "2027-05-31T00:00:00Z", indirect_method: "DE_MINIMIS" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 80 }
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 85 }
              as: Panelist
              as_user_id: "pan-2"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 90 }
              as: Panelist
              as_user_id: "pan-3"
            - call: "POST /applications/${app_id}/award"
              payload: {}
              as: ProgramOfficer
            - call: "GET /subawards"
              payload: { application_id: "${app_id}" }
              as: ProgramOfficer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "PERSONNEL", amount_cents: 12345, federal_share_pct: 0.5 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "SUPPLIES", amount_cents: 12345, federal_share_pct: 0.5 }
              as: ProgramOfficer
          trigger:
            - call: "POST /subawards/${sub_id}/activate"
              payload: {}
              as: ProgramOfficer
              captures: { fed: $.data.federal_share_cents }
          assert:
            - "Subaward.${sub_id}.federal_share_cents == 12346"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_request_resubmit_cycle
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.Application.REVISION_REQUESTED_to_SUBMITTED
        distinguishing_aspect: "Application cycles UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED and can re-enter review; final status after resubmit is SUBMITTED (not a terminal), proving the loop on the Application entity."
        test_recipe:
          setup:
            - "An application in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "Zeta Org", uei: "UEI-Z", ein: "66-6666666" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
            - call: "POST /nofos"
              payload: { title: "Arts", cfda_number: "45.024", total_pool_cents: 100000000, max_award_cents: 100000000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
              captures: { nofo_id: $.data.id }
            - call: "POST /nofos/${nofo_id}/applications"
              payload: { nonprofit_id: "${np_id}", project_title: "P", requested_amount_cents: 5000000, proposed_period_start: "2026-06-01T00:00:00Z", proposed_period_end: "2027-05-31T00:00:00Z", indirect_method: "DE_MINIMIS" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramOfficer
          trigger:
            - call: "POST /applications/${app_id}/request-revision"
              payload: { revision_note: "add budget detail" }
              as: ProgramOfficer
              captures: { st1: $.data.status }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { st2: $.data.status }
          assert:
            - "Application.${app_id}.status == SUBMITTED"

      - name: subaward_suspend_reinstate_cycle
        grounds:
          - state_machines.Subaward.ACTIVE_to_SUSPENDED
          - state_machines.Subaward.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "Subaward cycles ACTIVE -> SUSPENDED -> ACTIVE via suspend then reinstate; returning to ACTIVE proves the loop on the Subaward entity (distinct from the Application cycle)."
        test_recipe:
          setup:
            - "An ACTIVE subaward (single PERSONNEL line 10000000, total 11000000)."
          setup_api_calls:
            - call: "POST /nonprofits"
              payload: { legal_name: "Eta Org", uei: "UEI-H", ein: "77-7777777" }
              as: ProgramOfficer
              captures: { np_id: $.data.id }
            - call: "POST /nofos"
              payload: { title: "Env", cfda_number: "66.001", total_pool_cents: 100000000, max_award_cents: 100000000, indirect_cost_cap_pct: 0.30, open_date: "2026-05-01T00:00:00Z", close_date: "2026-12-31T00:00:00Z" }
              as: ProgramOfficer
              captures: { nofo_id: $.data.id }
            - call: "POST /nofos/${nofo_id}/applications"
              payload: { nonprofit_id: "${np_id}", project_title: "P", requested_amount_cents: 11000000, proposed_period_start: "2026-06-01T00:00:00Z", proposed_period_end: "2027-05-31T00:00:00Z", indirect_method: "DE_MINIMIS" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 80 }
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 85 }
              as: Panelist
              as_user_id: "pan-2"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 90 }
              as: Panelist
              as_user_id: "pan-3"
            - call: "POST /applications/${app_id}/award"
              payload: {}
              as: ProgramOfficer
            - call: "GET /subawards"
              payload: { application_id: "${app_id}" }
              as: ProgramOfficer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "PERSONNEL", amount_cents: 10000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/activate"
              payload: {}
              as: ProgramOfficer
          trigger:
            - call: "POST /subawards/${sub_id}/suspend"
              payload: { reason: "risk" }
              as: GrantsManager
              as_user_id: "gm-1"
              captures: { s1: $.data.status }
            - call: "POST /subawards/${sub_id}/reinstate"
              payload: {}
              as: GrantsManager
              as_user_id: "gm-1"
              captures: { s2: $.data.status }
          assert:
            - "Subaward.${sub_id}.status == ACTIVE"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: critical_finding_suspends_subaward_and_returns_drawdown
        grounds:
          - state_machines.MonitoringVisit.SCHEDULED_to_CONDUCTED
          - state_machines.Subaward.ACTIVE_to_SUSPENDED
          - state_machines.Drawdown.SUBMITTED_to_RETURNED
          - entities.Subaward.fields.obligated_cents
        distinguishing_aspect: "Depth-4: conduct(visit) -> create CRITICAL Finding -> Finding creation suspends Subaward -> suspension returns the SUBMITTED Drawdown -> return releases obligated_cents to 0; each link caused by the previous, triggered by the visit conduct."
        test_recipe:
          setup:
            - "An ACTIVE subaward (total 11000000) with one SUBMITTED drawdown of 5000000 (obligated 5000000) and one SCHEDULED monitoring visit."
          setup_api_calls:
            - call: "POST /nonprofits"
