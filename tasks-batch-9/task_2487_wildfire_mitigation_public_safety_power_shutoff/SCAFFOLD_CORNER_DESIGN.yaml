        distinguishing_aspect: "Patrol scheduling is gated on the circuit's own energization state even when the event is legitimately in restoration: DELTA was never in the event's scope, so a patrol against it is refused with ERR_CIRCUIT_NOT_DE_ENERGIZED while the identically-timed ALPHA patrol is accepted."
