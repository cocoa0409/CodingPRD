          METHODOLOGY_ONLY selects the NONE variant, which is not a third formula but the ABSENCE of a
          release dataset: naming one is a 422 (ERR_RELEASE_DATASET_REQUIRED works in both directions),
          and because gate 130 is scoped to the release dataset, an investigation whose only dataset
          carries an unsuppressed source-identifying risk-10 column still publishes with
