          assert:
            - "PasteurizationRun.${r1}.run_status == COMPLETED"
            - "PasteurizationRun.${r1}.longest_hold_seconds == 1800"
            - "PasteurizationRun.${r1}.thermal_status == PASSED"
            - "PasteurizationRun.${r1}.peak_celsius == 64.0"
            - "PasteurizationRun.${r1}.reading_count == 4"
            - "PasteurizationRun.${r1}.completed_at == 2026-08-10T10:05:00Z"
            - "PasteurizationRun.${r1}.completed_by_user_id == u-tech-1"
            - "PasteurizationRun.${r1}.culture_status == NOT_COLLECTED"
            - "PasteurizationRun.${r1}.release_eligibility == BLOCKED"
            - "Pool.${p1}.status == COMMITTED"

      - name: guarded_transition_lot_release_requires_eligible_run
        claim_type: guarded_transitions
        grounds:
          - state_machines.MilkLot.HOLD_to_RELEASED
          - validations[priority=46]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lot_release_requires_run_release_eligible
          rationale: "The named §1.8 instance is exactly this guarded transition: it asserts that HOLD -> RELEASED is refused while the lot's run has release_eligibility BLOCKED and succeeds once the culture flips it to ELIGIBLE."

      - name: cascade_down_from_failing_culture_to_pool_components
        claim_type: cascade_down
        grounds:
          - state_machines.PasteurizationRun.COMPLETED_to_COMPLETED
          - state_machines.MilkLot.HOLD_to_DISCARDED
          - state_machines.Pool.COMMITTED_to_SCRAPPED_CULTURE
        excluded_because:
          difficulty_instance: transitive_cascade / failed_culture_four_hop_destruction
          rationale: "The named §1.8 instance walks the whole four-hop downward cascade (run -> lots -> pool -> components/donations) with per-hop literals."

      - name: conditional_cascade_recall_skips_already_pasteurized_components
        claim_type: conditional_cascade
        grounds:
          - state_machines.Donation.ELIGIBLE_to_RECALLED
          - entities.DeferralEvent.fields.quarantined_pool_count
        excluded_because:
          difficulty_instance: transitive_cascade / reactive_serology_five_hop_recall
          rationale: "The named §1.8 instance asserts the state-conditional part of the recall cascade, including quarantined_pool_count 0 when the affected pool is already PASTEURIZED."

      - name: compensation_pool_scrap_returns_volume_to_donations
        claim_type: compensation
        grounds:
          - state_machines.Pool.DRAFT_to_SCRAPPED
          - state_machines.Donation.ALLOCATED_to_ELIGIBLE
        excluded_because:
          difficulty_instance: compensating_invariant / milk_volume_conservation_across_pool_scrap_and_reallocation
          rationale: "The named §1.8 instance asserts the full scrap-and-reallocate compensation with a conserved millilitre total and no drift."

      - name: parallel_state_dimensions_on_pasteurization_run
        claim_type: parallel
        grounds:
          - state_machines.PasteurizationRun
          - entities.PasteurizationRun.fields.run_status
          - entities.PasteurizationRun.fields.thermal_status
          - entities.PasteurizationRun.fields.culture_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / run_three_parallel_dimensions
          rationale: "The named §1.8 instance drives run_status, thermal_status and culture_status independently and asserts the combined release_eligibility."

  # ==========================================================================
  - section: calculations
    instances:

      - name: pool_kcal_weighted_average_rounds_half_up_to_two_decimals
        claim_type: precision
        grounds:
          - calculations.pool_projected_kcal_per_oz
          - entities.Pool.fields.projected_kcal_per_oz
          - state_machines.Pool.DRAFT_to_BALANCED
        distinguishing_aspect: "800 ml at 18.5, 700 ml at 20.0 and 600 ml at 22.5 give 42300/2100 = 20.142857..., which must be stored as 20.14 after a single round_half_up on the final division; averaging the three kcal figures unweighted would give 20.33 and rounding each term first would drift."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; three QUALIFIED donors each shipped one accepted TERM container: 800 ml at 18.5, 700 ml at 20.0, 600 ml at 22.5 kcal/oz."
