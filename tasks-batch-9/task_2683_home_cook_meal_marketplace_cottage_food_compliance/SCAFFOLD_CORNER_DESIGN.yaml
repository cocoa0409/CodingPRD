  - section: cross_cutting_complexity_layers
    instances:
      - name: onboarding_document_write_rejects_a_stale_cook_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.onboarding-doc-supersede-stale-cook
          - errors.ERR_STALE_COOK_VERSION
          - entities.OnboardingDocument.fields.superseded_by_document_id
        distinguishing_aspect: >
          Document submission is a supersede-in-place write, so the OCC token is the only thing standing
          between a client holding an old view of the cook and the silent discard of a verification
          decision it never saw. The same expected_cook_version value must succeed once, be refused with
          412 the second time because the first write moved onboarding_status DRAFT -> DOCS_SUBMITTED,
          and succeed again once the caller re-reads the version - at which point the superseded chain,
          not a duplicate row, is what records the history.
        test_recipe:
          setup:
            - "StatePolicy CA; clock 2026-08-01T00:00:00Z; Cook Dara self-registered and still DRAFT at version 1."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id", cook_v0: "$.data.version", onb_0: "$.data.onboarding_status" }
          trigger:
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-A", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2028-01-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { doc_a: "$.data.id", doc_a_status: "$.data.review_status" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-B", issuing_authority: "CA DPH", issued_on: "2026-02-15", expires_on: "2028-02-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { e_stale: "$.data.error_id" }
            - call: GET /onboarding-documents/${doc_a}
              payload: {}
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { doc_a_after_412: "$.data.review_status", doc_a_super_after_412: "$.data.superseded_by_document_id" }
            - call: GET /cooks/${cook_id}
              payload: {}
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cook_v1: "$.data.version", onb_1: "$.data.onboarding_status" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v1}", certificate_number: "FH-B", issuing_authority: "CA DPH", issued_on: "2026-02-15", expires_on: "2028-02-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { doc_b: "$.data.id", doc_b_status: "$.data.review_status" }
            - call: GET /onboarding-documents/${doc_a}
              payload: {}
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { doc_a_final: "$.data.review_status", doc_a_super: "$.data.superseded_by_document_id" }
            - call: GET /cooks/${cook_id}
              payload: {}
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cook_v2: "$.data.version" }
          assert:
            - "${onb_0} == DRAFT with ${cook_v0} == 1"
            - "first write: HTTP 201, ${doc_a_status} == SUBMITTED, and ${onb_1} == DOCS_SUBMITTED with ${cook_v1} == ${cook_v0} + 1 - the write moved the parent, which is what invalidates the token"
            - "${e_stale} == ERR_STALE_COOK_VERSION with HTTP 412 (not 409 and not 422): the payload was otherwise perfectly valid"
            - "${doc_a_after_412} == SUBMITTED and ${doc_a_super_after_412} is null: the refused write superseded nothing"
            - "retry with the re-read token: HTTP 201, ${doc_b_status} == SUBMITTED, ${doc_a_final} == SUPERSEDED, ${doc_a_super} == ${doc_b}"
            - "${cook_v2} > ${cook_v1}: version advances on every accepted write, so the token is single-use"
            - "no FH-B row exists twice - the 412 attempt created nothing"

      - name: payout_statement_creation_rejects_a_stale_window_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.payout-statement-supersede-stale-window
          - errors.ERR_STALE_WINDOW_VERSION
          - entities.PayoutStatement.fields.superseded_at
        distinguishing_aspect: >
          The second OCC rule guards a money computation rather than a document chain: drafting a
          statement freezes gross, commission, chargeback and hold figures, and it bumps the window's own
          version as a side effect, so the token a client used to draft is stale for its own next draft.
          The 412 must therefore appear on a repeat draft with the same token, leaving exactly one DRAFT
