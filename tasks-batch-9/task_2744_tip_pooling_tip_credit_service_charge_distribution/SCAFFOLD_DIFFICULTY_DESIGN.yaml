              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
            - call: "POST /pay-periods/${period_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
          trigger:
            - call: "POST /pay-periods/${period_id}/reopen"
              payload: { reason: "wage-hour audit reopened the week" }
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
          assert:
            - "after the reopen PayPeriod.status == OPEN with compute_variant null, computed_by_user_id null, approved_by_user_id null, total_tip_credit_cents 0, total_topup_cents 0, reported_tips_cents 0 and allocation_shortfall_cents 0"
            - "after the reopen PayPeriod.total_credited_minutes is still 960, because reopening does not un-close the shifts"
            - "after the reopen the first-lap PayLine has status SUPERSEDED and version 3, having gone 1 at compute, 2 at approve and 3 at the supersede"
            - "after the second compute PayPeriod.status == COMPUTED with compute_variant WEEKLY_AGGREGATE and computed_by_user_id op_prep_1 again"
            - "after the second compute GET /pay-lines?pay_period_id=${period_id} returns exactly 2 rows, one SUPERSEDED and one DRAFT, so the audit trail of the first lap survives the cycle"
            - "the second-lap PayLine is a fresh row with version 1, variant WEEKLY_AGGREGATE, tip_credit_cents 5500, topup_cents 2692 and total_gross_cents 6100, byte-identical in money terms to the first lap's DRAFT figures"

      - name: dispute_fork_partially_upheld_then_join_closed
        grounds:
          - state_machines.Dispute
          - state_machines.Dispute.OPEN_to_PARTIALLY_UPHELD
          - state_machines.Dispute.PARTIALLY_UPHELD_to_CLOSED
          - state_machines.BackWageCorrection.PENDING_to_APPLIED
          - calculations.dispute_adjudication_amount
          - calculations.back_wage_correction_application
          - entities.PayLine.fields.open_dispute_count
        distinguishing_aspect: >-
          The Dispute machine forks three ways out of OPEN and then joins on CLOSED, and the join is
          guarded rather than free: the UPHELD and PARTIALLY_UPHELD arms may only close once their
          BackWageCorrection has actually been APPLIED, while the DENIED arm closes with no
          correction at all. This instance walks the middle arm, where the award is strictly between
          zero and the claim, so adjudicated_amount_cents is the payload's 800 rather than the
          claim's 2000.
        test_recipe:
          setup:
            - "The Texas wage world computed and approved, so the single PayLine is FINAL with total_gross_cents 7004 under PER_SHIFT."
            - "The employee has raised an OPEN dispute of category TIP_CREDIT claiming 2000 cents."
