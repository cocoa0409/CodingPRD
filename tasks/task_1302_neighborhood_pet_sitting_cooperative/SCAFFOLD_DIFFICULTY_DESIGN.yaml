              as: CoopAdmin
          assert:
            - "Sit A (direct branch): SittingAssignment.${asg_id}.status == SETTLED with credit_hours_settled == 4.00"
            - "Sit B (DISPUTED branch): dispute RESOLVED_DISMISSED auto-drove SittingAssignment.${asgB_id}.status == SETTLED with the same cascade — credit_hours_settled == 4.00"
            - "Member.${f2_id}.credit_balance_hours == 18.00 (10.00 + 4.00 + 4.00) — fork branches joined with identical settlement math"
            - "Member.${f2_id}.reliability_score == 54 (two settle bonuses); Dispute.${dispB_id}.status == RESOLVED_DISMISSED"

