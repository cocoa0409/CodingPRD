              as: ProjectManager
              captures: { store_id: "$.data.id" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${client_id}", title: "Ph Proj", scope_type: "AUDIT" }
              as: ProjectManager
              captures: { project_id: "$.data.id", project_ver: "$.data.version" }
