      - name: corner_quantity_limit_satisfied_at_exact_limit_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_34_ERR_QUANTITY_LIMIT_EXCEEDED
          - entities.Product.fields.quantity_limit_per_visit
          - entities.Sale.fields.line_count
        distinguishing_aspect: |
          The per-visit limit aggregates across lines and is inclusive: 4 units then
          2 units of a product limited to 6 lands exactly on the limit and the
          second line is created (201), so an off-by-one implementation using
          `>= limit` would wrongly reject it.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500."
            - "One product at unit_cost_cents 250 with quantity_limit_per_visit 6 and an ACTIVE assortment."
            - "One OPEN sale already holding a line of quantity 4."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Sill Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-QTY-250", name: "Infant Formula 12oz", category: "GROCERY_STAPLE", unit_cost_cents: 250, quantity_limit_per_visit: 6 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "Y1", facings: 6, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SGT Q Halvorsen", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 4 }
              as: StoreCashier
              captures: { line_1_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 2 }
              as: StoreCashier
              captures: { line_2_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "SaleLine.${line_1_id}.extended_cents == 1000 and SaleLine.${line_2_id}.extended_cents == 500"
            - "SaleLine.${line_2_id}.line_surcharge_cents == 25 and SaleLine.${line_1_id}.line_surcharge_cents == 50"
            - "Sale.${sale_id}.line_count == 2, merchandise_cents == 1500, surcharge_total_cents == 75, total_due_cents == 1575"

      - name: corner_restricted_item_blocked_for_restricted_watch_patron
        claim_type: cross_entity_validation
        grounds:
