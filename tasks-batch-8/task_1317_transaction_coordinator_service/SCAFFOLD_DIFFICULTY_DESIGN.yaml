              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { used_end: $.data.included_files_used }
          assert:
            - "Mid-cycle: Subscription.${sub_id}.included_files_used == 1"
            - "Post-compensation: Subscription.${sub_id}.included_files_used == 0 (== pre-cycle value)"
            - "Invariant: forward(+1 at create) + compensating(-1 at eligible termination) leaves included_files_used unchanged"

