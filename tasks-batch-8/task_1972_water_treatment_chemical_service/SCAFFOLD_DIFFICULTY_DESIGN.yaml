            - call: "POST /wt/program-designs"
              payload: { asset_id: "${c6a_asset}" }
              as: WaterChemist
              captures: { c6a_pd: $.data.id }
            - { call: "POST /wt/program-designs/${c6a_pd}/record-survey", payload: { survey_notes: "s" }, as: WaterChemist }
            - { call: "POST /wt/program-designs/${c6a_pd}/draft", payload: { proposed_coc: 3.0, inhibitor_target_ppm: 4, ph_min: 7.0, ph_max: 10.0, conductivity_max_umhos: 20000, service_rate_cents_per_month: 0 }, as: WaterChemist }
            - call: "POST /wt/program-designs/${c6a_pd}/propose"
