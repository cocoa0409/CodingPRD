      - name: cancel_hearing_with_placed_item_returns_agenda_not_empty
        claim_type: precondition_enforcement
        grounds: [state_machines.Hearing.SCHEDULED_to_CANCELLED, "errors[ERR_AGENDA_NOT_EMPTY]"]
