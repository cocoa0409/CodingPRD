# =============================================================================
# 1.9 Scaffold Corner Design - breadth coverage index for comprehensive-plan-update
#
# Walks references/claim-extraction-guide.md row by row against SCAFFOLD.yaml
# sections 1.1-1.7. Every instance is a test prototype: setup_api_calls drives an
# empty database into the precondition using only endpoints declared in section 1.5,
# every ${var} is bound by an earlier captures:, and every assert carries literal
# values. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# excluded_because: stubs naming the covering instance.
#
# Standing fixture conventions (identical to the difficulty design file):
#   users     director-1 (PlanningDirector), staff-1 (PlanningStaff),
#             state-1 (StateReviewer), consultant-1 (EnvironmentalConsultant),
#             clerk-1 / clerk-2 (CommissionClerk)
#   clock     startup default exactly 2026-08-01T00:00:00Z; all datetimes carry
#             three fractional digits
#   plan      { title: "Horizon 2045", jurisdiction_code: "CA-0451",
#               base_year: 2025, horizon_year: 2045 }
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section 1 - Entities (section 1.1 of the scaffold)
  # ===========================================================================
  - section: entities
    instances:
      - name: plan_update_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.PlanUpdate
          - endpoints.POST_/planning/plan-updates
        distinguishing_aspect: |
          Creation of the root aggregate with all four required inputs returns 201 and a body that
          carries every field section 1.1 declares for PlanUpdate - the three input fields, the
          system status DRAFTING, and all eleven derived counters at their documented zero values -
          not merely the echoed request.
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlanningDirector
              as_user_id: "director-1"
          trigger:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id, pu_status: $.data.status, pu_posture: $.data.compliance_posture }
          assert:
            - "HTTP 201 with response_type == \"object\" and data.id a UUID with no type prefix"
            - "title == \"Horizon 2045\", jurisdiction_code == \"CA-0451\", base_year == 2025, horizon_year == 2045"
            - "status == \"DRAFTING\", state_review_status == \"NOT_SUBMITTED\", state_findings == null and compliance_posture == \"CAPACITY_HOLD\""
            - "adopted_scenario_id == null, required_elements_complete_count == 0, open_consistency_link_count == 0, housing_shortfall_total == 0, equity_share_pct == 0.0, participation_weight_total == 0.0, underrepresented_weight_total == 0.0, monitoring_on_track_count == 0, resubmission_count == 0 and adopted_at == null"
            - "created_at == updated_at == \"2026-08-01T00:00:00.000Z\" and version == 1"

      - name: plan_update_retrieval_round_trips_stored_values
        claim_type: retrieval
        grounds:
          - endpoints.GET_/planning/plan-updates/{id}
        distinguishing_aspect: |
          GET by id returns the stored row unchanged - identical field values and identical version
          to the creation response - and the read itself is not a mutation, so version and updated_at
          do not advance even though the logical clock has moved on.
        test_recipe:
          setup:
            - "One plan created at the startup clock instant, then the clock advanced to 2026-08-05T12:00:00Z."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id, created: $.data.created_at, v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
          trigger:
            - call: "GET /planning/plan-updates/${pu}"
              as: StateReviewer
              as_user_id: "state-1"
              captures: { got_id: $.data.id, got_version: $.data.version, got_created: $.data.created_at, got_updated: $.data.updated_at }
          assert:
            - "HTTP 200 with data.id == ${pu}, title == \"Horizon 2045\" and status == \"DRAFTING\""
            - "version == 1 and created_at == updated_at == \"2026-08-01T00:00:00.000Z\" (a GET never refreshes updated_at)"
            - "every role may read the row: the same GET as PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk and StateReviewer returns byte-identical data"

      - name: plan_update_listing_paginates_and_filters
        claim_type: listing
        grounds:
          - endpoints.GET_/planning/plan-updates
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The collection endpoint returns the four pagination fields with the declared defaults
          (limit 10, offset 0) and honours limit/offset plus the jurisdiction_code filter: with three
          plans, limit 2 gives total_count 3 and has_more true, offset 2 gives one row and has_more
          false, and a jurisdiction filter narrows total_count to the matching subset.
        test_recipe:
          setup:
            - "Three plans exist: two in jurisdiction CA-0451 and one in CA-0999."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu1: $.data.id }
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2050", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2050 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu2: $.data.id }
            - call: "POST /planning/plan-updates"
              payload: { title: "Rivertown General Plan", jurisdiction_code: "CA-0999", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu3: $.data.id }
          trigger:
            - call: "GET /planning/plan-updates"
              payload: { limit: 2, offset: 0 }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "GET /planning/plan-updates"
              payload: { limit: 2, offset: 2 }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "GET /planning/plan-updates"
              payload: { jurisdiction_code: "CA-0999" }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "GET /planning/plan-updates"
              payload: { status: "STATE_SUBMITTED" }
              as: PlanningStaff
              as_user_id: "staff-1"
          assert:
            - "response_type == \"array\" on every call, with meta carrying api_request_id and api_request_timestamp"
            - "limit 2 / offset 0 returns 2 rows with total_count == 3 and has_more == true"
            - "limit 2 / offset 2 returns 1 row with total_count == 3 and has_more == false"
            - "jurisdiction_code == \"CA-0999\" returns 1 row (id == ${pu3}) with total_count == 1 and has_more == false"
            - "status == \"STATE_SUBMITTED\" returns 0 rows with total_count == 0 and has_more == false"
            - "omitting limit and offset entirely returns all 3 rows with limit defaulting to 10 and offset to 0"

      - name: plan_update_not_found_returns_plan_update_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PLAN_UPDATE_NOT_FOUND]
          - validations.priority_30_path_existence
        distinguishing_aspect: |
          A syntactically valid but unknown plan_update_id on a GET returns 404 with
          error_id ERR_PLAN_UPDATE_NOT_FOUND and the documented error envelope
          (response_type "error", data.error_id, data.message) - not an empty 200 and not a 500.
        test_recipe:
          setup:
            - "One real plan exists, so the 404 cannot be an artefact of an empty table."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
          trigger:
            - call: "GET /planning/plan-updates/00000000-0000-4000-8000-000000000404"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP 404 with response_type == \"error\", data.error_id == \"ERR_PLAN_UPDATE_NOT_FOUND\" and a non-empty data.message"
            - "GET /planning/plan-updates still returns total_count == 1 (the failed lookup created nothing)"

      - name: plan_update_missing_required_field_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_/planning/plan-updates
          - validations.priority_35_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Every one of the four inputs of POST /planning/plan-updates is required: omitting
          jurisdiction_code yields ERR_INVALID_REQUEST (422) and no row is written, while the same
          body with the field present succeeds - so the rejection is attributable to the omission and
          not to any other part of the payload.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlanningDirector
              as_user_id: "director-1"
          trigger:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { err_missing: $.data.error_id }
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
          assert:
            - "the omission returns HTTP 422 with error_id == \"ERR_INVALID_REQUEST\""
            - "the complete body returns HTTP 201"
            - "GET /planning/plan-updates returns total_count == 1 - only the accepted request persisted"

      - name: venue_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Venue.turnover_buffer_minutes
          - entities.Venue.ada_accessible
          - entities.Venue.transit_served
        distinguishing_aspect: |
          Omitting all three optional Venue inputs applies the section 1.1 defaults exactly -
          turnover_buffer_minutes 0, ada_accessible true, transit_served false - and the
          transit_served default of false is load-bearing: the defaulted venue cannot host a
          TARGETED_OUTREACH activity even though it is ADA accessible.
        test_recipe:
          setup:
            - "One plan exists to host the activity attempt."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
          trigger:
            - call: "POST /planning/venues"
              payload: { name: "Northgate Rec Center", seated_capacity: 90 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v_default: $.data.id, d_buffer: $.data.turnover_buffer_minutes, d_ada: $.data.ada_accessible, d_transit: $.data.transit_served }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v_default}", activity_type: "TARGETED_OUTREACH", title: "Youth Outreach", start_at: "2026-08-20T18:00:00.000Z", end_at: "2026-08-20T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { err_transit: $.data.error_id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v_default}", activity_type: "WORKSHOP", title: "Northgate Workshop", start_at: "2026-08-20T18:00:00.000Z", end_at: "2026-08-20T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act_ok: $.data.id }
          assert:
            - "the created venue reports turnover_buffer_minutes == 0, ada_accessible == true and transit_served == false"
            - "the venue response carries id and created_at but no version and no updated_at (Venue is declared common_fields: false)"
            - "TARGETED_OUTREACH at the defaulted venue returns HTTP 409 with error_id == \"ERR_VENUE_NOT_EQUITY_ELIGIBLE\""
            - "a WORKSHOP at the same venue and interval returns HTTP 201 with status == \"SCHEDULED\" and weighting_variant == \"STANDARD\""

      - name: activity_participation_counters_are_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.EngagementActivity.record_count
          - entities.EngagementActivity.total_weighted_count
          - calculations.participation_record_weight
        distinguishing_aspect: |
          The four EngagementActivity participation counters and the two ParticipationRecord
          computed fields are derived from the attached records alone: two records (one RENTER,
          one GENERAL) on a STANDARD workshop give record_count 2, underrepresented_record_count 1,
          total_weighted_count 2.0 and underrepresented_weighted_count 1.0, while the activity's own
          equity_share_pct stays 0.0 because it is only computed at completion.
        test_recipe:
          setup:
            - "One plan, one venue and one SCHEDULED workshop, with the clock at the startup default."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Room", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { venue: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${venue}", activity_type: "WORKSHOP", title: "Eastside Workshop", start_at: "2026-07-10T18:00:00.000Z", end_at: "2026-07-10T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act: $.data.id, variant: $.data.weighting_variant, rc0: $.data.record_count, tw0: $.data.total_weighted_count }
          trigger:
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act}", respondent_ref: "R-001", demographic_group: "RENTER", census_tract: "060014001", interpreter_used: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { rec1: $.data.id, ur1: $.data.is_underrepresented, w1: $.data.weight }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act}", respondent_ref: "R-002", demographic_group: "GENERAL", census_tract: "060014002" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { rec2: $.data.id, ur2: $.data.is_underrepresented, w2: $.data.weight }
            - call: "GET /planning/engagement-activities/${act}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { rc: $.data.record_count, urc: $.data.underrepresented_record_count, tw: $.data.total_weighted_count, urw: $.data.underrepresented_weighted_count, eq: $.data.equity_share_pct, av: $.data.version }
          assert:
            - "the activity is created with weighting_variant == \"STANDARD\", record_count == 0 and total_weighted_count == 0.0"
            - "record R-001 (RENTER) reports is_underrepresented == true and weight == 1.0 - interpreter_used has no effect under STANDARD weighting"
            - "record R-002 (GENERAL) reports is_underrepresented == false and weight == 1.0"
            - "after both records the activity reports record_count == 2, underrepresented_record_count == 1, total_weighted_count == 2.0 and underrepresented_weighted_count == 1.0"
            - "the activity's own equity_share_pct is still 0.0 (it is computed only by the complete action) and its version has advanced to 3"
            - "the plan still reports participation_weight_total == 0.0 and equity_share_pct == 0.0 because the activity is not COMPLETED"

      - name: element_system_fields_are_server_assigned
        claim_type: system_fields
        grounds:
          - entities.PlanElement.authored_by_user_id
          - entities.PlanElement.status
          - response_envelope.success
        distinguishing_aspect: |
          On PlanElement creation the server assigns id, created_at, updated_at, version == 1,
          status DRAFT, consistency_status PENDING, revision_round 0 and authored_by_user_id from
          the X-User-ID header - not from the body - and a later PATCH under a different clock
          instant advances version to 2 and updated_at to the new instant while created_at and
          authored_by_user_id stay frozen.
        test_recipe:
          setup:
            - "One plan; the clock is at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
          trigger:
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "PARKS", title: "Parks and Recreation", draft_body: "Draft parks element text.", policy_count: 6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el: $.data.id, author: $.data.authored_by_user_id, v1: $.data.version, created: $.data.created_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:30:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { draft_body: "Revised parks element text." }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v2: $.data.version, updated: $.data.updated_at, author2: $.data.authored_by_user_id, created2: $.data.created_at }
          assert:
            - "creation returns status == \"DRAFT\", consistency_status == \"PENDING\", revision_round == 0, reviewed_by_user_id == null, version == 1"
            - "authored_by_user_id == \"staff-1\" (taken from X-User-ID; the body never carries it)"
            - "created_at == updated_at == \"2026-08-01T00:00:00.000Z\""
            - "after the PATCH: version == 2, updated_at == \"2026-08-03T09:30:00.000Z\", created_at unchanged at \"2026-08-01T00:00:00.000Z\" and authored_by_user_id still \"staff-1\""
            - "the PATCH leaves status == \"DRAFT\" (a DRAFT self-loop) and policy_count == 6 because policy_count was not supplied"

      - name: type_constraint_violations_are_rejected_before_any_write
        claim_type: type_constraints
        grounds:
          - entities.PlanUpdate.horizon_year
          - entities.EngagementActivity.end_at
          - validations.priority_35_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Four structurally different schema violations - an out-of-enum value, a cross-field numeric
          rule (horizon_year - base_year >= 10), an interval rule (end_at > start_at) and an
          out-of-range pagination limit - all return ERR_INVALID_REQUEST (422) and none of them
          creates a row.
        test_recipe:
          setup:
            - "One plan and one venue exist so the failures cannot be attributed to missing parents."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Room", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { venue: $.data.id }
          trigger:
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "ECONOMIC_DEVELOPMENT", title: "Economic Development", draft_body: "Not a statutory element.", policy_count: 4 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_enum: $.data.error_id }
            - call: "POST /planning/plan-updates"
              payload: { title: "Short Horizon Plan", jurisdiction_code: "CA-0452", base_year: 2025, horizon_year: 2030 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { e_span: $.data.error_id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${venue}", activity_type: "WORKSHOP", title: "Backwards Workshop", start_at: "2026-07-10T20:00:00.000Z", end_at: "2026-07-10T18:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_interval: $.data.error_id }
            - call: "GET /planning/plan-updates"
              payload: { limit: 101 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_limit: $.data.error_id }
          assert:
            - "the out-of-enum element_type returns HTTP 422 with error_id == \"ERR_INVALID_REQUEST\""
            - "horizon_year 2030 against base_year 2025 (span 5 < 10) returns HTTP 422 with error_id == \"ERR_INVALID_REQUEST\""
            - "end_at earlier than start_at returns HTTP 422 with error_id == \"ERR_INVALID_REQUEST\""
            - "limit == 101 (above the declared max of 100) returns HTTP 422 with error_id == \"ERR_INVALID_REQUEST\""
            - "GET /planning/plan-updates returns total_count == 1 and the plan's plan-elements list is empty - no rejected request persisted anything"

      - name: venue_and_participation_record_are_immutable_rows
        claim_type: immutability
        grounds:
          - entities.Venue
          - entities.ParticipationRecord
        distinguishing_aspect: |
          Both entities declared with common_fields: false behave as immutable configuration/ledger
          rows: their creation responses carry id and created_at but no version and no updated_at, and
          section 1.5 declares no PATCH, PUT or DELETE endpoint for either - the only way to retract a
          booking is to cancel the owning activity, and the only way to correct a record is to add
          another one.
        test_recipe:
          setup:
            - "One plan, one venue and one SCHEDULED workshop."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Room", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { venue: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${venue}", activity_type: "WORKSHOP", title: "Eastside Workshop", start_at: "2026-07-10T18:00:00.000Z", end_at: "2026-07-10T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act: $.data.id }
          trigger:
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act}", respondent_ref: "R-001", demographic_group: "YOUTH", census_tract: "060014001" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { rec: $.data.id }
            - call: "GET /planning/engagement-activities/${act}/participation-records"
              as: PlanningStaff
              as_user_id: "staff-1"
          assert:
            - "the Venue creation response contains name, seated_capacity, turnover_buffer_minutes, ada_accessible, transit_served, id and created_at, and contains no version and no updated_at key"
            - "the ParticipationRecord creation response contains activity_id, respondent_ref, demographic_group, census_tract, interpreter_used, comment_text, is_underrepresented, weight, id and created_at, and contains no version and no updated_at key"
            - "section 1.5 declares no PATCH, PUT or DELETE for /planning/venues or /planning/participation-records - the record list keeps returning total_count == 1 with the original values"

      - name: child_creation_requires_resolvable_parent_ids
        claim_type: parent_relationships
        grounds:
          - validations.priority_40_body_foreign_key_existence
          - errors[ERR_VENUE_NOT_FOUND]
          - errors[ERR_ACTIVITY_NOT_FOUND]
        distinguishing_aspect: |
          Body foreign keys are resolved per field, and each unresolved reference returns its own
          404 error id: an unknown plan_update_id on an inventory gives ERR_PLAN_UPDATE_NOT_FOUND, an
          unknown venue_id on an activity gives ERR_VENUE_NOT_FOUND, and an unknown activity_id on a
          participation record gives ERR_ACTIVITY_NOT_FOUND - three different codes from one rule.
        test_recipe:
          setup:
            - "One plan and one venue exist; every failing call supplies exactly one bogus id and otherwise valid data."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Room", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { venue: $.data.id }
          trigger:
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "00000000-0000-4000-8000-0000000000e1", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 4200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_plan: $.data.error_id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "00000000-0000-4000-8000-0000000000e2", activity_type: "WORKSHOP", title: "Ghost Venue Workshop", start_at: "2026-07-10T18:00:00.000Z", end_at: "2026-07-10T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_venue: $.data.error_id }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "00000000-0000-4000-8000-0000000000e3", respondent_ref: "R-001", demographic_group: "YOUTH", census_tract: "060014001" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_act: $.data.error_id }
          assert:
            - "the unknown plan_update_id returns HTTP 404 with error_id == \"ERR_PLAN_UPDATE_NOT_FOUND\""
            - "the unknown venue_id returns HTTP 404 with error_id == \"ERR_VENUE_NOT_FOUND\""
            - "the unknown activity_id returns HTTP 404 with error_id == \"ERR_ACTIVITY_NOT_FOUND\""
            - "the plan's inventory-datasets list and engagement-activities list are both empty afterwards"

  # ===========================================================================
  # Section 2 - State machines (section 1.2 of the scaffold)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_of_every_directly_created_entity
        claim_type: initial_state
        grounds:
          - state_machines.PlanUpdate.initial_state
          - state_machines.InventoryDataset.initial_state
          - state_machines.PlanElement.initial_state
          - state_machines.ConsistencyLink.initial_state
          - state_machines.EngagementActivity.initial_state
          - state_machines.EnvironmentalReview.initial_state
          - state_machines.PlanAlternative.initial_state
          - state_machines.ImplementationAction.initial_state
        distinguishing_aspect: |
          Every entity that a client can create directly lands in the initial_state its machine
          declares, in one pass over eight creations: PlanUpdate DRAFTING, InventoryDataset DRAFT,
          PlanElement DRAFT, ConsistencyLink OPEN, EngagementActivity SCHEDULED, EnvironmentalReview
          DRAFT, PlanAlternative EVALUATED and ImplementationAction PENDING.
        test_recipe:
          setup:
            - "Empty database; the clock stays at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id, pu_status: $.data.status }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Room", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { venue: $.data.id }
          trigger:
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 4200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv: $.data.id, inv_status: $.data.status }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "LAND_USE", title: "Land Use Element", draft_body: "Land use draft.", policy_count: 6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_a: $.data.id, el_a_status: $.data.status }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "TRANSPORTATION", title: "Transportation Element", draft_body: "Transportation draft.", policy_count: 6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_b: $.data.id }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${el_a}", target_element_id: "${el_b}", dependency_type: "CAPACITY_ASSUMPTION" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { link: $.data.id, link_status: $.data.status }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${venue}", activity_type: "WORKSHOP", title: "Eastside Workshop", start_at: "2026-08-20T18:00:00.000Z", end_at: "2026-08-20T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act: $.data.id, act_status: $.data.status }
            - call: "POST /planning/environmental-reviews"
              payload: { plan_update_id: "${pu}", document_type: "EIR", title: "Horizon 2045 Draft EIR" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { rev: $.data.id, rev_status: $.data.status }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${rev}", label: "Transit-Focused Growth", traffic_vmt_index: 49, ghg_index: 49, habitat_index: 49, water_index: 49 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { alt: $.data.id, alt_status: $.data.status }
            - call: "POST /planning/implementation-actions"
              payload: { plan_update_id: "${pu}", source_element_id: "${el_a}", action_type: "ZONING_CODE_UPDATE", title: "Mixed-use overlay rezone", indicator_name: "Permitted units per year", indicator_direction: "INCREASE", baseline_value: 300, target_value: 600 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { action: $.data.id, action_status: $.data.status }
          assert:
            - "PlanUpdate status == \"DRAFTING\"; InventoryDataset status == \"DRAFT\" with referencing_scenario_count == 0"
            - "both PlanElement rows status == \"DRAFT\" with consistency_status == \"PENDING\" and revision_round == 0"
            - "ConsistencyLink status == \"OPEN\" with reconciliation_note == null and staled_by_amendment_id == null"
            - "EngagementActivity status == \"SCHEDULED\"; EnvironmentalReview status == \"DRAFT\" with comment_period_days == null and alternative_count == 1 after the alternative is added"
            - "PlanAlternative status == \"EVALUATED\" with raw_impact_score == 49.00, mitigation_credit == 0.00 and net_impact_score == 49.00"
            - "ImplementationAction status == \"PENDING\" with reading_count == 0, on_track == false and due_at == null"
            - "every one of these rows reports version == 1 except the two entities declared common_fields: false"

      - name: element_draft_to_approved_is_the_happy_path
        claim_type: valid_transition
        grounds:
          - state_machines.PlanElement.DRAFT_to_IN_REVIEW
          - state_machines.PlanElement.IN_REVIEW_to_APPROVED
        distinguishing_aspect: |
          The two-step approval path works end to end on a non-HOUSING element with no consistency
          links: submit-review moves DRAFT -> IN_REVIEW, and an APPROVE decision by a different user
          moves IN_REVIEW -> APPROVED while setting consistency_status CLEARED, recording
          reviewed_by_user_id and lifting the plan's required_elements_complete_count to 1.
        test_recipe:
          setup:
            - "One plan in DRAFTING and one PARKS element authored by staff-1 with policy_count 6."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id, pu_v1: $.data.version }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "PARKS", title: "Parks and Recreation Element", draft_body: "Parks level-of-service policies.", policy_count: 6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el: $.data.id }
          trigger:
            - call: "POST /planning/plan-elements/${el}/submit-review"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { st1: $.data.status, ev1: $.data.version }
            - call: "POST /planning/plan-elements/${el}/review-decision"
              payload: { decision: "APPROVE", review_note: "Consistent with the land use element." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { st2: $.data.status, cs2: $.data.consistency_status, rev_by: $.data.reviewed_by_user_id, ev2: $.data.version }
            - call: "GET /planning/plan-updates/${pu}"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { rec: $.data.required_elements_complete_count, posture: $.data.compliance_posture, pu_v: $.data.version }
          assert:
            - "submit-review returns HTTP 200 with status == \"IN_REVIEW\" and version == 2"
            - "the APPROVE decision returns status == \"APPROVED\", consistency_status == \"CLEARED\", reviewed_by_user_id == \"director-1\", revision_round == 0 and version == 3"
            - "the plan reports required_elements_complete_count == 1 and version == 2 (only the approval touched the plan)"
            - "the plan's compliance_posture is \"CAPACITY_HOLD\" - no scenario has been adopted, so the capacity rule outranks the equity rule"

      - name: activity_complete_preconditions_fail_one_at_a_time
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EngagementActivity.SCHEDULED_to_COMPLETED
          - errors[ERR_ACTIVITY_NOT_ENDED]
          - errors[ERR_NO_PARTICIPATION_RECORDS]
        distinguishing_aspect: |
          The SCHEDULED -> COMPLETED transition has two data preconditions and each is provable in
          isolation: with the clock before end_at the call fails ERR_ACTIVITY_NOT_ENDED even though a
          record exists is irrelevant; once the clock passes end_at but record_count is 0 the same
          call fails ERR_NO_PARTICIPATION_RECORDS; adding one record then makes it succeed.
        test_recipe:
          setup:
            - "One plan, one venue and one workshop scheduled 2026-08-20T18:00Z to 2026-08-20T20:00Z, with the clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Room", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { venue: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${venue}", activity_type: "WORKSHOP", title: "Eastside Workshop", start_at: "2026-08-20T18:00:00.000Z", end_at: "2026-08-20T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act: $.data.id }
          trigger:
            - call: "POST /planning/engagement-activities/${act}/complete"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_clock: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/engagement-activities/${act}/complete"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e_empty: $.data.error_id }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act}", respondent_ref: "R-001", demographic_group: "LOW_INCOME", census_tract: "060014001" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { rec: $.data.id }
            - call: "POST /planning/engagement-activities/${act}/complete"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { st: $.data.status, eq: $.data.equity_share_pct }
            - call: "GET /planning/plan-updates/${pu}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { pw: $.data.participation_weight_total, uw: $.data.underrepresented_weight_total, peq: $.data.equity_share_pct, posture: $.data.compliance_posture }
          assert:
            - "the first complete returns HTTP 409 with error_id == \"ERR_ACTIVITY_NOT_ENDED\" (clock 2026-08-01 < end_at 2026-08-20T20:00Z)"
            - "at the clock instant exactly equal to end_at the gate is satisfied, and the failure changes to HTTP 409 error_id == \"ERR_NO_PARTICIPATION_RECORDS\""
            - "after one LOW_INCOME record the complete succeeds with status == \"COMPLETED\" and equity_share_pct == 100.0"
            - "the plan reports participation_weight_total == 1.0, underrepresented_weight_total == 1.0 and equity_share_pct == 100.0"
            - "the plan's compliance_posture is still \"CAPACITY_HOLD\" - the equity rule is only reached once a scenario is adopted and the shortfall is 0"

      - name: link_reconcile_side_effects_reach_element_and_plan
        claim_type: side_effect_execution
        grounds:
          - state_machines.ConsistencyLink.OPEN_to_CLEARED
          - calculations.compliance_posture
          - endpoints.POST_/planning/consistency-links/{id}/reconcile
        distinguishing_aspect: |
          One reconcile writes four places in the same response cycle: the link (status CLEARED,
          reconciliation_note, reconciled_by_user_id), the source element (consistency_status
          PENDING -> CLEARED), and the plan (open_consistency_link_count 1 -> 0 with the posture
          leaving CONSISTENCY_HOLD) - and the target element must be reviewable first, which is why
          the target is submitted for review before the reconcile.
        test_recipe:
          setup:
            - "One plan with a LAND_USE element (source) and a TRANSPORTATION element (target), one OPEN link source -> target."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "LAND_USE", title: "Land Use Element", draft_body: "Land use draft.", policy_count: 6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_src: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "TRANSPORTATION", title: "Transportation Element", draft_body: "Transportation draft.", policy_count: 6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_tgt: $.data.id }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${el_src}", target_element_id: "${el_tgt}", dependency_type: "LEVEL_OF_SERVICE" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { link: $.data.id }
            - call: "GET /planning/plan-updates/${pu}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { count_before: $.data.open_consistency_link_count, posture_before: $.data.compliance_posture }
            - call: "POST /planning/plan-elements/${el_tgt}/submit-review"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
          trigger:
            - call: "POST /planning/consistency-links/${link}/reconcile"
              payload: { reconciliation_note: "Level-of-service assumptions aligned with the land use build-out." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { st: $.data.status, note: $.data.reconciliation_note, by: $.data.reconciled_by_user_id }
            - call: "GET /planning/plan-elements/${el_src}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { src_cs: $.data.consistency_status }
            - call: "GET /planning/plan-updates/${pu}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { count_after: $.data.open_consistency_link_count, posture_after: $.data.compliance_posture }
          assert:
            - "before the reconcile the plan reports open_consistency_link_count == 1 and compliance_posture == \"CONSISTENCY_HOLD\""
            - "the reconcile returns status == \"CLEARED\", reconciliation_note equal to the submitted text, reconciled_by_user_id == \"director-1\" and staled_by_amendment_id == null"
            - "the source element's consistency_status becomes \"CLEARED\" (it sources no other link)"
            - "after the reconcile the plan reports open_consistency_link_count == 0 and compliance_posture == \"CAPACITY_HOLD\" - the consistency hold lifts and the next-lower rule takes over"

      - name: element_rejects_every_trigger_absent_from_its_current_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.PlanElement
          - errors[ERR_ELEMENT_NOT_DRAFT]
          - errors[ERR_ELEMENT_NOT_IN_REVIEW]
          - errors[ERR_ELEMENT_NOT_AMENDABLE]
        distinguishing_aspect: |
          Each of the element machine's three triggers is refused from the one state where it is not
          declared, and the error names the state that was wrong rather than a generic conflict:
          review-decision from DRAFT is ERR_ELEMENT_NOT_IN_REVIEW, submit-review from IN_REVIEW is
          ERR_ELEMENT_NOT_DRAFT, and PATCH from IN_REVIEW is ERR_ELEMENT_NOT_AMENDABLE - three
          different error ids on one entity, none of them ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "One plan with one PARKS element in DRAFT authored by staff-1."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "PARKS", title: "Parks Element", draft_body: "Parks draft.", policy_count: 6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el: $.data.id }
          trigger:
            - call: "POST /planning/plan-elements/${el}/review-decision"
              payload: { decision: "APPROVE" }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { e1: $.data.error_id }
            - call: "POST /planning/plan-elements/${el}/submit-review"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { st: $.data.status }
            - call: "POST /planning/plan-elements/${el}/submit-review"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e2: $.data.error_id }
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { draft_body: "Sneaking a revision past the reviewer." }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e3: $.data.error_id }
            - call: "GET /planning/plan-elements/${el}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { st_final: $.data.status, body_final: $.data.draft_body, v_final: $.data.version }
          assert:
            - "review-decision from DRAFT returns HTTP 409 error_id == \"ERR_ELEMENT_NOT_IN_REVIEW\""
            - "the single legal submit-review returns status == \"IN_REVIEW\""
            - "the second submit-review returns HTTP 409 error_id == \"ERR_ELEMENT_NOT_DRAFT\""
            - "PATCH from IN_REVIEW returns HTTP 409 error_id == \"ERR_ELEMENT_NOT_AMENDABLE\""
            - "the element is unchanged by the three rejections: status == \"IN_REVIEW\", draft_body == \"Parks draft.\" and version == 2 (only the successful submit-review bumped it)"

      - name: cancelled_activity_accepts_no_further_trigger
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.EngagementActivity.terminal_states
          - errors[ERR_ACTIVITY_NOT_SCHEDULED]
          - errors[ERR_ACTIVITY_CLOSED]
        distinguishing_aspect: |
          CANCELLED is terminal for an activity that never gathered a record, and the lockdown
          discriminates by trigger: attaching a participation record and calling complete both fail
          ERR_ACTIVITY_NOT_SCHEDULED, while a second cancel fails with the distinct
          ERR_ACTIVITY_CLOSED. The plan's participation ledger stays at zero throughout because this
          activity never held a record.
        test_recipe:
          setup:
            - "One plan, one venue and one SCHEDULED workshop with no participation records; the clock stays at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Room", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { venue: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${venue}", activity_type: "WORKSHOP", title: "Eastside Workshop", start_at: "2026-08-20T18:00:00.000Z", end_at: "2026-08-20T20:00:00.000Z" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act: $.data.id }
          trigger:
            - call: "POST /planning/engagement-activities/${act}/cancel"
              payload: { cancellation_reason: "Venue flooded." }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { st: $.data.status }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act}", respondent_ref: "R-001", demographic_group: "LOW_INCOME", census_tract: "060014001" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e1: $.data.error_id }
            - call: "POST /planning/engagement-activities/${act}/complete"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e2: $.data.error_id }
            - call: "POST /planning/engagement-activities/${act}/cancel"
              payload: { cancellation_reason: "Cancelling again." }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e3: $.data.error_id }
            - call: "GET /planning/engagement-activities/${act}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { st_final: $.data.status, rc_final: $.data.record_count }
            - call: "GET /planning/plan-updates/${pu}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { pw: $.data.participation_weight_total, peq: $.data.equity_share_pct }
          assert:
            - "the cancel returns status == \"CANCELLED\""
            - "the participation record returns HTTP 409 error_id == \"ERR_ACTIVITY_NOT_SCHEDULED\""
            - "complete returns HTTP 409 error_id == \"ERR_ACTIVITY_NOT_SCHEDULED\" - not ERR_ACTIVITY_NOT_ENDED, because the state check at priority 50 outranks the clock gate at priority 67"
            - "the second cancel returns HTTP 409 error_id == \"ERR_ACTIVITY_CLOSED\", a different id from the two above"
            - "the activity remains status == \"CANCELLED\" with record_count == 0, and the plan still reports participation_weight_total == 0.0 and equity_share_pct == 0.0"

      - name: certify_and_reconcile_are_not_idempotent
        claim_type: idempotency
        grounds:
          - state_machines.InventoryDataset.DRAFT_to_CERTIFIED
          - state_machines.ConsistencyLink.OPEN_to_CLEARED
          - errors[ERR_INVENTORY_NOT_DRAFT]
          - errors[ERR_LINK_ALREADY_CLEARED]
        distinguishing_aspect: |
          Replaying a one-shot approval is an error, not a no-op, and each machine reports its own
          code: the second certify on the same dataset returns ERR_INVENTORY_NOT_DRAFT and the second
          reconcile on the same link returns ERR_LINK_ALREADY_CLEARED. Neither replay mutates the
          row - certified_by_user_id, reconciliation_note and both version numbers are unchanged.
        test_recipe:
          setup:
            - "One plan with one DEMOGRAPHIC inventory authored by staff-1, plus two elements and one OPEN link between them; the link's target element is submitted for review so the reconcile is legal."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 4200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "LAND_USE", title: "Land Use Element", draft_body: "Land use draft.", policy_count: 6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_src: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "INFRASTRUCTURE", title: "Infrastructure Element", draft_body: "Water and sewer draft.", policy_count: 6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el_tgt: $.data.id }
            - call: "POST /planning/consistency-links"
              payload: { source_element_id: "${el_src}", target_element_id: "${el_tgt}", dependency_type: "FUNDING_ASSUMPTION" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { link: $.data.id }
            - call: "POST /planning/plan-elements/${el_tgt}/submit-review"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
          trigger:
            - call: "POST /planning/inventory-datasets/${inv}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { inv_st: $.data.status, inv_by: $.data.certified_by_user_id, inv_v: $.data.version }
            - call: "POST /planning/inventory-datasets/${inv}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { e1: $.data.error_id }
            - call: "POST /planning/consistency-links/${link}/reconcile"
              payload: { reconciliation_note: "Sewer capacity aligned with the build-out." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { link_st: $.data.status, link_v: $.data.version }
            - call: "POST /planning/consistency-links/${link}/reconcile"
              payload: { reconciliation_note: "Reconciling twice." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { e2: $.data.error_id }
            - call: "GET /planning/inventory-datasets/${inv}"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { inv_v_final: $.data.version, inv_st_final: $.data.status }
            - call: "GET /planning/consistency-links/${link}"
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { link_note_final: $.data.reconciliation_note, link_v_final: $.data.version }
          assert:
            - "the first certify returns status == \"CERTIFIED\" with certified_by_user_id == \"director-1\" and version == 2"
            - "the second certify returns HTTP 409 error_id == \"ERR_INVENTORY_NOT_DRAFT\""
            - "the first reconcile returns status == \"CLEARED\" and version == 2"
            - "the second reconcile returns HTTP 409 error_id == \"ERR_LINK_ALREADY_CLEARED\""
            - "after both replays the dataset is still version == 2 / CERTIFIED and the link still carries the FIRST note (\"Sewer capacity aligned with the build-out.\") at version == 2 - a failed replay bumps nothing"

      - name: escalated_element_refuses_the_staff_author_but_not_the_director
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PlanElement.ESCALATED_to_DRAFT
          - errors[ERR_ESCALATION_OVERRIDE_REQUIRED]
          - roles.PlanningStaff.shared_operations
        distinguishing_aspect: |
          The ESCALATED -> DRAFT transition carries an actor precondition that no other transition
          has: PATCH is a shared operation, so the staff author passes the role check at priority 20
          and is then refused at priority 85 with ERR_ESCALATION_OVERRIDE_REQUIRED (403) - a third
          403 flavour distinct from ERR_ROLE_NOT_PERMITTED and ERR_SEGREGATION_OF_DUTIES. The
          element must not absorb the staff body text before the director's override succeeds.
        test_recipe:
          setup:
            - "One plan with one TRANSPORTATION element authored by staff-1 (policy_count 6) driven to ESCALATED by three REQUEST_REVISION decisions from director-1."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "TRANSPORTATION", title: "Transportation Element", draft_body: "Round 0 body.", policy_count: 6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el: $.data.id }
            - call: "POST /planning/plan-elements/${el}/submit-review"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/plan-elements/${el}/review-decision"
              payload: { decision: "REQUEST_REVISION", review_note: "Round 1." }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { draft_body: "Round 1 body." }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/plan-elements/${el}/submit-review"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/plan-elements/${el}/review-decision"
              payload: { decision: "REQUEST_REVISION", review_note: "Round 2." }
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { draft_body: "Round 2 body." }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/plan-elements/${el}/submit-review"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/plan-elements/${el}/review-decision"
              payload: { decision: "REQUEST_REVISION", review_note: "Round 3, escalating." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { st_esc: $.data.status, round_esc: $.data.revision_round, v_esc: $.data.version }
          trigger:
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { draft_body: "Staff tries to rewrite an escalated element." }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e1: $.data.error_id }
            - call: "POST /planning/plan-elements/${el}/submit-review"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { e2: $.data.error_id }
            - call: "GET /planning/plan-elements/${el}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { st_mid: $.data.status, body_mid: $.data.draft_body, v_mid: $.data.version }
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { draft_body: "Director override body." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { st_after: $.data.status, round_after: $.data.revision_round, body_after: $.data.draft_body }
          assert:
            - "the setup leaves the element status == \"ESCALATED\" with revision_round == 3"
            - "the staff PATCH returns HTTP 403 error_id == \"ERR_ESCALATION_OVERRIDE_REQUIRED\" - not 409, and not ERR_ROLE_NOT_PERMITTED, because PATCH is shared with PlanningStaff"
            - "submit-review from ESCALATED returns HTTP 409 error_id == \"ERR_ELEMENT_NOT_DRAFT\" (staff cannot escape the escalation by re-submitting either)"
            - "the element still reads draft_body == \"Round 2 body.\" at the version recorded after the third decision - the refused PATCH wrote nothing"
            - "the director PATCH then succeeds: status == \"DRAFT\", revision_round == 0 and draft_body == \"Director override body.\""

      - name: element_revision_loop_termination_boundary
        claim_type: valid_transition
        grounds:
          - state_machines.PlanElement.IN_REVIEW_to_REVISION_REQUESTED
          - state_machines.PlanElement.IN_REVIEW_to_ESCALATED
        distinguishing_aspect: |
          The cyclic element machine's loop-count boundary - two REQUEST_REVISION rounds stay in
          REVISION_REQUESTED and the third diverts to ESCALATED with revision_round 3.
        excluded_because:
          difficulty_instance: element_revision_cycle_escalates_on_third_request
          rationale: |
            That difficulty instance already walks all three rounds and asserts revision_round 1, 2
            and 3 with the status divergence on the third decision, plus the director's reset of the
            counter. A corner test here would replay the identical eleven-call chain, so section 1.9
            keeps only the part that instance does not cover - the staff-author refusal at
            ERR_ESCALATION_OVERRIDE_REQUIRED, tested in
            escalated_element_refuses_the_staff_author_but_not_the_director above.

      - name: hearing_outcome_fork_side_effect_divergence
        claim_type: side_effect_execution
        grounds:
          - state_machines.Hearing.OPEN_to_CONTINUED
          - state_machines.Hearing.OPEN_to_RECOMMENDED
        distinguishing_aspect: |
          The four-way fork out of Hearing OPEN attaches a different side-effect set to each outcome,
          most visibly CONTINUE (plan untouched) versus RECOMMEND (plan advances to
          COMMISSION_RECOMMENDED).
        excluded_because:
          difficulty_instance: hearing_outcome_fork_continue_versus_recommend_side_effects
          rationale: |
            That instance builds the full STATE_CERTIFIED plan, opens two commission hearings and
            records CONTINUE on one and RECOMMEND on the other, asserting both side-effect sets and
            the plan status divergence. Repeating it would duplicate the most expensive fixture in
            the design. Section 1.9 instead covers the two outcomes that instance does not reach -
            ADOPT and its terminal lockdown - in
            council_adoption_pipeline_and_terminal_plan_lockdown below.

      - name: state_determination_deficient_freeze_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.PlanUpdate.STATE_SUBMITTED_to_STATE_DEFICIENT
        distinguishing_aspect: |
          A DEFICIENT determination cascades backwards: the named deficient elements drop out of
          APPROVED, the plan's completion counter falls, scheduled hearings are BLOCKED and the
          posture leaves CLEAR.
        excluded_because:
          difficulty_instance: state_deficient_determination_four_link_freeze_cascade
          rationale: |
            That transitive-cascade instance already asserts every link of the freeze chain
            (determination -> element status -> plan counters -> hearing BLOCKED -> posture). The
            only DEFICIENT-path behaviour left untested there is the resubmission ceiling, which
            section 1.9 covers in state_submission_readiness_gauntlet under validations.

      - name: council_adoption_pipeline_and_terminal_plan_lockdown
        claim_type: side_effect_execution
        grounds:
          - state_machines.Hearing.OPEN_to_ADOPTED_OUT
          - state_machines.PlanUpdate.COMMISSION_RECOMMENDED_to_ADOPTED
          - state_machines.ImplementationAction.PENDING_to_SCHEDULED
          - state_machines.ImplementationAction.SCHEDULED_to_COMPLETED
          - errors[ERR_OUTCOME_NOT_VALID_FOR_BODY]
          - errors[ERR_COMMISSION_RECOMMENDATION_REQUIRED]
          - errors[ERR_ACTION_NOT_SCHEDULED]
          - errors[ERR_NO_INDICATOR_READING]
          - errors[ERR_INDICATOR_OFF_TRACK]
          - errors[ERR_ACTION_ALREADY_COMPLETED]
          - errors[ERR_PLAN_ALREADY_ADOPTED]
        distinguishing_aspect: |
          The one chain that reaches the plan's terminal state, and the only place the ADOPT branch of
          the hearing fork fires. It proves four things nothing else can: (1) ADOPT is refused on a
          COMMISSION hearing even after the plan reaches COMMISSION_RECOMMENDED, so the refusal is the
          priority-74 body check rather than the priority-50 plan-state check; (2) a COUNCIL hearing
          cannot even be scheduled before the commission recommends;
          (3) the adoption cascade stamps adopted_at, promotes all five APPROVED elements to ADOPTED
          and moves every PENDING implementation action to SCHEDULED with
          due_at == adopted_at + 365 days; and (4) ADOPTED is a whole-aggregate lockdown - a later
          inventory create fails ERR_PLAN_ALREADY_ADOPTED. Three sibling actions in the same cascade
          then separate the three completion guards from each other: one on track completes, one with
          no reading fails ERR_NO_INDICATOR_READING, one with an off-track reading fails
          ERR_INDICATOR_OFF_TRACK.
        test_recipe:
          setup:
            - "Clock starts at the default 2026-08-01T00:00:00Z."
            - "One plan Horizon 2045 (base_year 2025, horizon_year 2045) opened by director-1."
            - "All four inventory types authored by staff-1 and certified by director-1; the LAND_USE row carries 400 vacant / 250 underutilized / 60 infrastructure-constrained acres at 18 units per acre."
            - "One TREND GrowthScenario pinned to the certified LAND_USE dataset and adopted, giving land_capacity_units == 11700 (GROSS_CAPACITY)."
            - "All four HousingAllocation tiers assigned by state-1 at 900 / 700 / 800 / 1200 units, which the 11700-unit pool fully accommodates (housing_shortfall_total == 0)."
            - "All five REQUIRED_ELEMENT_TYPES drafted by staff-1 with policy_count 6, submitted by staff-1 and APPROVED by director-1; no consistency links exist, so open_consistency_link_count stays 0."
            - "One WORKSHOP with ten participation records of which exactly four are in UNDERREPRESENTED_GROUPS, completed so equity_share_pct == 40.0 (inclusive pass)."
            - "One EIR with two alternatives, circulated at 2026-08-01 (comment window ends 2026-09-15), preferred alternative selected, then certified once the clock reaches 2026-09-15."
            - "The plan is state-submitted by director-1 and CERTIFIED by state-1, so status == STATE_CERTIFIED and compliance_posture == CLEAR."
            - "Three ImplementationActions are created while the plan is still STATE_CERTIFIED: action A (DECREASE, baseline 100, target 80) receives a reading of 76, action B receives no reading, action C receives a reading of 95."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
