            - { call: "POST /fleet/buses", payload: { fleet_number: "RC8", vin: "VINRC8", model_year: 2022, in_service_date: "2026-01-01", initial_odometer_miles: 100, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
            - { call: "POST /fleet/buses", payload: { fleet_number: "RC9", vin: "VINRC9", model_year: 2022, in_service_date: "2026-01-01", initial_odometer_miles: 100, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 200000, base_warranty_expiry_date: "2028-01-01", overhaul_interval_miles: 250000 }, as: FleetManager }
