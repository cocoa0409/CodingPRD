            - "the second resume returns HTTP 200 with status == AUTHORIZED and suspension_reason == null"

      - name: actual_weight_hold_cascade_excluded_stub
        claim_type: side_effect_execution
        grounds:
          - state_machines.Shipment.ESTIMATED_to_ACTUAL_RECORDED.side_effects
          - state_machines.Shipment.AWARDED_to_ON_HOLD
        excluded_because:
          difficulty_instance: actual_weight_cascades_four_links_to_sibling_shipment_hold
          rationale: >-
            The four-link cascade from recording a certified weight (billable recompute -> entitlement
            ledger recompute -> AUTHORIZED -> SUSPENDED -> sibling AWARDED shipment ON_HOLD) is already
            driven end-to-end there, including the sibling hold_reason and the ledger figures, so a
            §1.9 breadth instance would duplicate it exactly.

      - name: shipment_create_entitlement_gate_excluded_stub
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=20]
          - errors[ERR_ENTITLEMENT_NOT_AUTHORIZED]
        excluded_because:
          difficulty_instance: shipment_booking_requires_authorized_entitlement
          rationale: >-
            That instance already books against a DRAFT entitlement, a CLOSED entitlement and an
            AUTHORIZED one in the same chain, proving both the refusal and the acceptance side of the
            priority-20 gate; repeating it here adds no coverage.

  # ===========================================================================
  - section: calculations
    instances:
      - name: admin_fee_threshold_crosses_at_exactly_five_hundred_transport
        claim_type: constants_applied
        grounds:
          - calculations.entitlement_excess_weight_and_cost.constants.ADMIN_FEE_THRESHOLD_USD
          - calculations.entitlement_excess_weight_and_cost.constants.ADMIN_FEE_PCT
          - calculations.entitlement_excess_weight_and_cost.constants.EXCESS_RATE_TIER_1
        distinguishing_aspect: >-
          The 6% administrative fee is keyed on the TRANSPORT charge, not on the pound count: 799 lbs
          of excess prices 499.38 and attracts no fee, while 800 lbs prices exactly 500.00 and adds
          30.00 — both inside excess tier 1, so only the fee constant explains the jump.
        test_recipe:
          setup:
            - "E6 with no dependents: total_billable_cap_lbs 8000; one surveyed shipment (estimated 5286 lbs)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
