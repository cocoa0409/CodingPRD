          assert:
            - "the establishment call returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "the violation-code call returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "the practitioner call returns HTTP 201"
            - "Practitioner.${prac_id}.school_id == ${school_id}, license_status == STUDENT and required_clock_hours_effective == 16.0"
            - "GET /cosmetology/establishments?county_code=ADR returns total_count == 0"

      - name: rbac_practitioner_cannot_add_capacity_or_post_a_licence_at_a_salon
        claim_type: peer_role_isolation
        grounds:
          - rbac.Practitioner.shared_operations
          - rbac.EstablishmentOwner.shared_operations
          - validations.priority_3.ERR_UNAUTHORIZED
        distinguishing_aspect: "Capacity and posting writes belong to the establishment side of the graph: a Practitioner — even one who will later rent a booth there — is refused on both POST /cosmetology/establishments/{id}/workstations and POST /cosmetology/workstations/{id}/posting, leaving station_count at 1 and the existing station's posting untouched."
        test_recipe:
          setup:
            - "Establishment 'Peer Salon' with STYLING_CHAIR station 1 and no posting; STUDENT practitioner 'Gita Almeida'."
          setup_api_calls:
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Gita Almeida", license_type: "COSMETOLOGIST" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { prac_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Peer Salon", establishment_type: "SALON", county_code: "ADS", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 2, station_type: "NAIL_TABLE" }
              as: Practitioner
              as_user_id: "${prac_id}"
            - call: "POST /cosmetology/workstations/${ws_id}/posting"
              payload: { posted_practitioner_id: "${prac_id}" }
              as: Practitioner
