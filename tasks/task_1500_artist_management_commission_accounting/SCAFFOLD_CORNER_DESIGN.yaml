      - name: cross_artist_scope_denied_for_team_member
        claim_type: rbac_scope_enforcement
        grounds: ["validations[priority=3]", "errors[ERR_ARTIST_ACCESS_DENIED]"]
        distinguishing_aspect: "Entity-backed scoping: an Agent whose TeamMember row serves artist B cannot even READ artist A's record - GET /artists/{A} returns ERR_ARTIST_ACCESS_DENIED (403), preventing cross-client leakage."
