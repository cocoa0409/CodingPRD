              payload: { counted_quantities: [90, 5], expected_bag_drop_version: "${bag_v1}" }
              as: PlantCounter
              captures: { e_stale: $.data.error_id }
            - call: "GET /bag-drops/${bag_id}"
              payload: {}
              as: PlantCounter
              captures: { bag_v3: $.data.version }
            - call: "POST /bag-drops/${bag_id}/count-results"
              payload: { counted_quantities: [90, 5], expected_bag_drop_version: "${bag_v3}" }
              as: PlantCounter
          assert:
            - "the first trigger has status 412 and $.data.error_id == ERR_STALE_BAG_DROP_VERSION, not ERR_INVALID_BAG_DROP_STATE"
            - "after the first trigger BagDrop.${bag_id}.status == DISPUTED, counted_total == 100 and version == 3"
            - "the third trigger has status 200 with status COUNTED, counted_lines [90, 5], counted_total 95, final_credit_cents 900, adjustment_cents 100 and version 4"
            - "variance_pct == 0.0500 and variance_flag == false, since 0.05 is below the 0.1 tolerance"

      - name: stale_expected_account_version_is_refused_on_the_second_credit_action
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[POST /redeemer-accounts/{id}/credit-actions]
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - validations[priority=10]
        distinguishing_aspect: "Because credit-actions answers with an AccountCreditEntry and not the account, the caller has to re-read the account to learn its new version; replaying the captured version posts no second entry and leaves the balance alone."
        test_recipe:
          setup:
            - "One ACTIVE account at version 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /redeemer-accounts"
              payload: { holder_name: "Dana Reyes", account_code: "ACCT-1001" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_v1: $.data.version }
          trigger:
            - call: "POST /redeemer-accounts/${acct_id}/credit-actions"
              payload: { action: "MANUAL_GRANT", amount_cents: 250, expected_account_version: "${acct_v1}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { entry_one: $.data.id }
            - call: "POST /redeemer-accounts/${acct_id}/credit-actions"
              payload: { action: "MANUAL_GRANT", amount_cents: 250, expected_account_version: "${acct_v1}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_stale: $.data.error_id }
            - call: "GET /redeemer-accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { acct_v2: $.data.version }
            - call: "POST /redeemer-accounts/${acct_id}/credit-actions"
              payload: { action: "MANUAL_GRANT", amount_cents: 250, expected_account_version: "${acct_v2}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { entry_two: $.data.id }
          assert:
            - "the first trigger has status 201 with AccountCreditEntry.${entry_one}.balance_after_cents == 250 and RedeemerAccount.${acct_id}.version == 2"
            - "the second trigger has status 412 and $.data.error_id == ERR_STALE_ACCOUNT_VERSION"
            - "after the second trigger GET /redeemer-accounts/${acct_id}/credit-entries reports total_count 1 and credit_balance_cents is still 250"
            - "the fourth trigger has status 201 with AccountCreditEntry.${entry_two}.balance_after_cents == 500 and RedeemerAccount.${acct_id}.version == 3"

      - name: fourth_jam_cascade_reaches_the_center
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ReverseVendingMachine.COUNTING_to_OUT_OF_SERVICE
          - state_machines.RedemptionCenter.OPERATIONAL_to_SUSPENDED
        excluded_because:
          difficulty_instance: fourth_jam_takes_machine_out_of_service_and_suspends_center
          rationale: "That §1.8 instance already walks the three-jam cycle and the fourth JAM_REPORTED end to end, asserting the machine reaching OUT_OF_SERVICE, the visit landing in JAM_HOLD with requires_manual_recount true, and the centre being pulled to SUSPENDED with suspension_reason MACHINE_FLEET_DOWN — the full N-level chain this layer calls for."

      - name: spot_and_index_pricing_produce_different_net_revenue
        claim_type: dual_variant_calculation
        grounds:
          - calculations.material_sale_net_revenue.variants
        excluded_because:
          difficulty_instance: commodity_spot_vs_index_pricing_divergence
          rationale: "That §1.8 instance already sells two identical bale sets under SPOT and INDEX, asserting the 0.9750 index haircut on effective_price_cents_per_tonne and the resulting gross, freight and net divergence, which is exactly the both-variants-and-delta claim for this layer."

      - name: fraud_strike_threshold_flags_at_two_and_resets_on_unflag
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.visit_payout_valuation.constants.FRAUD_STRIKE_LIMIT
          - state_machines.RedeemerAccount.ACTIVE_to_FLAGGED
          - state_machines.RedeemerAccount.FLAGGED_to_ACTIVE
          - entities.RedeemerAccount.fields.fraud_strikes
        distinguishing_aspect: "One strike withholds the payout but leaves the account ACTIVE; the second reaches the limit of 2 and flags it with withhold_reason ACCOUNT_FLAGGED; UNFLAG resets the counter to 0 so a clean visit afterwards is not withheld at all."
