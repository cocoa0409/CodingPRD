# =====================================================================
# §1.9 Scaffold Corner Design (Breadth Index)
# One block per claim-extraction-guide section; `claim_type:` values are
# taken verbatim from that section's per-row table. Corners already
# asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub and no test_recipe.
# YAML anchors (c_*) are declared at first use and aliased afterwards;
# they are a distinct set from the difficulty file's k_* anchors because
# anchors cannot cross documents.
# =====================================================================
scaffold_corner_design:

  # ===================================================================
  - section: entities
    instances:

      - name: corner_conference_create_initializes_computed_fields
        claim_type: Creation
        grounds:
          - entities.Conference
          - endpoints[POST /conference]
          - calculations.reserve_posture_derivation
        distinguishing_aspect: |
          A brand-new conference must come back with every computed field seeded
          from its declared default in one response: governance_status FORMING, a
          zero reserve target, and - because a zero target short-circuits the
          posture ladder - reserve_posture OPEN with funded_ratio_bps 10000 rather
          than FROZEN with 0.
        test_recipe:
          setup:
            - "The database is empty and the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_conf
              call: "POST /conference"
              payload: { name: "Mid-Continental Athletic Conference", fiscal_year_start_month: 7, current_fiscal_year: 2027, unit_value_cents: 34000000, phase_schedule_years: 3 }
              as: PlatformAdmin
              captures: { conf_id: $.data.id }
          assert:
            - "the response is HTTP 201 with a `data` object and `error` null, per the §1.0 envelope"
            - "data.name == \"Mid-Continental Athletic Conference\", data.fiscal_year_start_month == 7, data.current_fiscal_year == 2027, data.unit_value_cents == 34000000 and data.phase_schedule_years == 3"
            - "data.governance_status == \"FORMING\", data.approved_operating_expense_cents == 0 and data.approved_governance_expense_cents == 0"
            - "data.reserve_target_cents == 0, data.reserve_balance_cents == 0, data.reserve_posture == \"OPEN\" and data.funded_ratio_bps == 10000"
            - "data.escrow_balance_cents == 0, data.governance_fee_revenue_cents == 0 and data.validated_postseason_unit_count == 0"
            - "data.version == 1 and data.id, data.created_at, data.updated_at are all present"

      - name: corner_member_retrieval_returns_stored_representation
        claim_type: Retrieval
        grounds:
          - entities.Member
          - endpoints[GET /members/{id}]
          - state_machines.Member.PETITIONED_to_FULL_SHARE
        distinguishing_aspect: |
          A read-back of a charter member must echo every stored input field and
          the derived seating outcome: status FULL_SHARE (not the PETITIONED
          default), distribution_phase_bps 10000 and voting_weight_bps 10000, with
          entry_fee_cents defaulted to 0.
        test_recipe:
          setup:
            - "The conference is FORMING and North State University has been seated by the CHARTER path at the Northfield Dome."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - &c_v1
              call: "POST /venues"
              payload: { name: "Northfield Dome", city: "Northfield", seating_capacity: 60000, concurrent_event_capacity: 1 }
              as: PlatformAdmin
              captures: { v1_id: $.data.id }
            - &c_mn
              call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "North State University", institution_code: "NOR", admission_path: "CHARTER", home_venue_id: "${v1_id}", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_n_id: $.data.id }
          trigger:
            - call: "GET /members/${m_n_id}"
              payload: {}
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
          assert:
            - "the response is HTTP 200 and data.id == ${m_n_id}"
            - "data.name == \"North State University\", data.institution_code == \"NOR\", data.admission_path == \"CHARTER\" and data.home_venue_id == ${v1_id}"
            - "data.status == \"FULL_SHARE\", data.distribution_phase_bps == 10000 and data.voting_weight_bps == 10000"
            - "data.grant_of_rights_through_fiscal_year == 2032, data.entry_fee_cents == 0 and data.entry_fee_paid_cents == 0"
            - "data.last_full_annual_distribution_cents == 0, data.exit_settlement_total_cents == 0 and data.schedule_compliance_score == 100"
            - "data.withdrawal_notice_at is null, data.withdrawal_effective_fiscal_year is null and data.notice_days is null"

      - name: corner_members_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /members]
          - response_envelope
        distinguishing_aspect: |
          The list envelope must report total_count over the whole filtered set
          rather than the returned page: with four members and limit 2 the first
          page carries total_count 4 with has_more true, and the second page the
          same total_count 4 with has_more false, while an unparameterised call
          returns all four under the default limit of 10.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members created in the order North, South, East, West."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - &c_v2
              call: "POST /venues"
              payload: { name: "Eastport Arena", city: "Eastport", seating_capacity: 45000, concurrent_event_capacity: 2 }
              as: PlatformAdmin
              captures: { v2_id: $.data.id }
            - *c_mn
            - &c_ms
              call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "South Valley University", institution_code: "SOU", admission_path: "CHARTER", home_venue_id: "${v1_id}", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_s_id: $.data.id }
            - &c_me
              call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "East Harbor College", institution_code: "EAS", admission_path: "CHARTER", home_venue_id: "${v2_id}", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_e_id: $.data.id }
            - &c_mw
              call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "West Ridge University", institution_code: "WES", admission_path: "CHARTER", home_venue_id: "${v2_id}", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_w_id: $.data.id }
          trigger:
            - call: "GET /members"
              payload: { conference_id: "${conf_id}", limit: 2, offset: 0 }
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /members"
              payload: { conference_id: "${conf_id}", limit: 2, offset: 2 }
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /members"
              payload: { conference_id: "${conf_id}" }
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /members"
              payload: { conference_id: "${conf_id}", home_venue_id: "${v2_id}" }
              as: Auditor
              as_user_id: "u_aud_1"
          assert:
            - "the first page returns 2 rows with pagination.total_count == 4, pagination.limit == 2, pagination.offset == 0 and pagination.has_more == true"
            - "the second page returns 2 rows with pagination.total_count == 4, pagination.offset == 2 and pagination.has_more == false"
            - "the unparameterised call returns 4 rows with pagination.limit == 10 and pagination.has_more == false"
            - "rows are ordered by created_at ASC, so the first page holds North then South and the second East then West"
            - "the home_venue_id-filtered call returns exactly 2 rows (East and West) with pagination.total_count == 2, so total_count counts the filtered set and not the table"

      - name: corner_reads_with_unknown_path_id_return_entity_specific_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=8]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_REVENUE_POOL_NOT_FOUND]
          - errors[ERR_DISTRIBUTION_RUN_NOT_FOUND]
          - errors[ERR_BOWL_APPEARANCE_NOT_FOUND]
          - errors[ERR_MEMBERSHIP_ACTION_NOT_FOUND]
          - errors[ERR_BUDGET_PROPOSAL_NOT_FOUND]
          - errors[ERR_PROTECTED_RIVALRY_NOT_FOUND]
          - errors[ERR_SCHEDULE_GAME_NOT_FOUND]
          - errors[ERR_CHAMPIONSHIP_EVENT_NOT_FOUND]
          - errors[ERR_AUDIT_REPORT_NOT_FOUND]
        distinguishing_aspect: |
          Each path-id resolution failure returns its own entity-scoped 404 code
          rather than one generic NOT_FOUND, so the nine single-resource reads must
          each yield a different error_id for the same syntactically valid but
          unknown identifier.
        test_recipe:
          setup:
            - "The conference exists with four charter members; no pool, run, appearance, action, proposal, rivalry, game, event or report has ever been created."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /revenue-pools/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /distribution-runs/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /bowl-appearances/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /membership-actions/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /budget-proposals/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /protected-rivalries/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /schedule-games/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /championship-events/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /audit-reports/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
          assert:
            - "every response is HTTP 404 with `data` null and a populated `error` object"
            - "the ten error_id values are, in call order, ERR_MEMBER_NOT_FOUND, ERR_REVENUE_POOL_NOT_FOUND, ERR_DISTRIBUTION_RUN_NOT_FOUND, ERR_BOWL_APPEARANCE_NOT_FOUND, ERR_MEMBERSHIP_ACTION_NOT_FOUND, ERR_BUDGET_PROPOSAL_NOT_FOUND, ERR_PROTECTED_RIVALRY_NOT_FOUND, ERR_SCHEDULE_GAME_NOT_FOUND, ERR_CHAMPIONSHIP_EVENT_NOT_FOUND and ERR_AUDIT_REPORT_NOT_FOUND"

      - name: corner_body_foreign_keys_missing_required_target_rejected
        claim_type: Parent Relationships
        grounds:
          - validations[priority=12]
          - errors[ERR_VENUE_NOT_FOUND]
          - errors[ERR_MEMBER_NOT_FOUND]
          - errors[ERR_REVENUE_POOL_NOT_FOUND]
          - errors[ERR_DISTRIBUTION_RUN_NOT_FOUND]
          - errors[ERR_PROTECTED_RIVALRY_NOT_FOUND]
        distinguishing_aspect: |
          Foreign keys carried in the request body are resolved at priority 12,
          after the priority-10 shape check, so a well-formed body naming an
          unknown venue, member, pool, run or rivalry returns that target's own
          404 rather than ERR_INVALID_REQUEST - and the row is never created.
        test_recipe:
          setup:
            - "The conference exists with four charter members and one OPEN FY2027 MEDIA_RIGHTS pool."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - &c_pool
              call: "POST /revenue-pools"
              payload: { conference_id: "${conf_id}", fiscal_year: 2027, pool_type: "MEDIA_RIGHTS", allocation_method: "APPEARANCE_PERFORMANCE_WEIGHTED", gross_revenue_cents: 500000000, estimated_expense_cents: 20000000 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Ghost Venue College", institution_code: "GHV", admission_path: "CHARTER", home_venue_id: "00000000-0000-4000-8000-0000000000ff", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "00000000-0000-4000-8000-0000000000ff", venue_id: "${v1_id}", game_date: "2026-09-05T19:00:00Z", fiscal_year: 2027, media_designated: true }
              as: ScheduleCoordinator
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_s_id}", revenue_pool_id: "00000000-0000-4000-8000-0000000000ff", sport: "WRESTLING", fiscal_year: 2027, window_start: "2027-03-01T00:00:00Z", window_end: "2027-03-05T00:00:00Z" }
              as: ScheduleCoordinator
            - call: "POST /audit-reports"
              payload: { conference_id: "${conf_id}", distribution_run_id: "00000000-0000-4000-8000-0000000000ff", fiscal_year: 2027, opinion: "UNQUALIFIED" }
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "${m_s_id}", venue_id: "${v1_id}", game_date: "2026-09-05T19:00:00Z", fiscal_year: 2027, media_designated: true, protected_rivalry_id: "00000000-0000-4000-8000-0000000000ff" }
              as: ScheduleCoordinator
          assert:
            - "the member create returns HTTP 404 with error.error_id == ERR_VENUE_NOT_FOUND and no Member row named \"Ghost Venue College\" exists"
            - "the first game create returns HTTP 404 with error.error_id == ERR_MEMBER_NOT_FOUND"
            - "the event create returns HTTP 404 with error.error_id == ERR_REVENUE_POOL_NOT_FOUND"
            - "the audit-report create returns HTTP 404 with error.error_id == ERR_DISTRIBUTION_RUN_NOT_FOUND"
            - "the second game create returns HTTP 404 with error.error_id == ERR_PROTECTED_RIVALRY_NOT_FOUND"
            - "zero ScheduleGame, ChampionshipEvent and AuditReport rows exist after all five attempts"

      - name: corner_member_create_missing_required_fields_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /members]
        distinguishing_aspect: |
          Every §1.5 input key without a `?` is genuinely required: omitting
          institution_code, admission_path, home_venue_id or
          grant_of_rights_through_fiscal_year each fails at priority 10 with
          ERR_INVALID_REQUEST before any FK resolution or duplicate check runs.
        test_recipe:
          setup:
            - "The conference exists with the Northfield Dome available as a home venue and no members yet."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
          trigger:
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Partial University", admission_path: "CHARTER", home_venue_id: "${v1_id}", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Partial University", institution_code: "PAR", home_venue_id: "${v1_id}", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Partial University", institution_code: "PAR", admission_path: "CHARTER", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Partial University", institution_code: "PAR", admission_path: "CHARTER", home_venue_id: "${v1_id}" }
              as: Commissioner
              as_user_id: "u_com_1"
          assert:
            - "all four requests return HTTP 400 with error.error_id == ERR_INVALID_REQUEST"
            - "no Member row exists after the four attempts, so GET /members returns pagination.total_count == 0"

      - name: corner_optional_inputs_fall_back_to_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Venue.fields.concurrent_event_capacity
          - entities.Member.fields.entry_fee_cents
          - entities.ScheduleGame.fields.media_designated
          - entities.ProtectedRivalry.fields.required_annual_meetings
        distinguishing_aspect: |
          Four different optional inputs must each land on their declared default
          when omitted - venue capacity 1, member entry fee 0, game
          media_designated false and rivalry required_annual_meetings 1 - and the
          false/zero defaults must be materialised rather than left null.
        test_recipe:
          setup:
            - "The conference exists and the Northfield Dome is available."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_mn
            - *c_ms
          trigger:
            - call: "POST /venues"
              payload: { name: "Plainview Fieldhouse", city: "Plainview", seating_capacity: 12000 }
              as: PlatformAdmin
              captures: { v3_id: $.data.id }
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "${m_s_id}", venue_id: "${v1_id}", game_date: "2026-09-05T19:00:00Z", fiscal_year: 2027 }
              as: ScheduleCoordinator
              captures: { gd_id: $.data.id }
            - call: "POST /protected-rivalries"
              payload: { conference_id: "${conf_id}", member_a_id: "${m_n_id}", member_b_id: "${m_s_id}", label: "Prairie Trophy" }
              as: ScheduleCoordinator
              captures: { pr_id: $.data.id }
          assert:
            - "Venue.${v3_id}.concurrent_event_capacity == 1"
            - "Member.${m_n_id}.entry_fee_cents == 0 and Member.${m_n_id}.entry_fee_paid_cents == 0, because the CHARTER create omitted entry_fee_cents"
            - "ScheduleGame.${gd_id}.media_designated == false (not null) and .status == \"SCHEDULED\""
            - "ProtectedRivalry.${pr_id}.required_annual_meetings == 1 and .status == \"ACTIVE\""

      - name: corner_revenue_pool_computed_fields_ignored_input
        claim_type: Computed Fields
        grounds:
          - entities.RevenuePool.fields.audited_expense_cents
          - entities.RevenuePool.fields.status
          - entities.DistributionRun.fields.status
        distinguishing_aspect: |
          Fields declared `source: computed` are server-owned: a create body that
          also supplies status and audited_expense_cents must be persisted with
          the computed values (DRAFT and null) rather than the submitted ones, so
          a client cannot pre-close a pool's books by sending a figure.
        test_recipe:
          setup:
            - "The conference exists with four charter members and no revenue pools."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
          trigger:
            - call: "POST /revenue-pools"
              payload: { conference_id: "${conf_id}", fiscal_year: 2027, pool_type: "MEDIA_RIGHTS", allocation_method: "EQUAL_SHARE", gross_revenue_cents: 600000000, estimated_expense_cents: 4000000, audited_expense_cents: 999, status: "BOOKS_CLOSED" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { rpx_id: $.data.id }
          assert:
            - "the response is HTTP 201 and RevenuePool.${rpx_id}.status == \"DRAFT\", not BOOKS_CLOSED"
            - "RevenuePool.${rpx_id}.audited_expense_cents is null, not 999"
            - "RevenuePool.${rpx_id}.gross_revenue_cents == 600000000 and .estimated_expense_cents == 4000000, so the input-sourced fields are honoured"

      - name: corner_system_identity_fields_ignored_input
        claim_type: System Fields
        grounds:
          - entities.Member.fields.status
          - entities.MembershipAction.fields.proposed_by_user_id
          - response_envelope
        distinguishing_aspect: |
          id, created_at, updated_at and version are system-generated and
          proposed_by_user_id is taken from the caller's X-User-ID header, so a
          body that supplies all five must have every one of them overwritten -
          the actor identity in particular cannot be spoofed through the payload.
        test_recipe:
          setup:
            - "The conference is FORMING and the Northfield Dome is available."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
          trigger:
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "North State University", institution_code: "NOR", admission_path: "CHARTER", home_venue_id: "${v1_id}", grant_of_rights_through_fiscal_year: 2032, id: "00000000-0000-4000-8000-0000000000aa", created_at: "2000-01-01T00:00:00Z", version: 77, status: "DEPARTED" }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_sys_id: $.data.id }
          assert:
            - "data.id != \"00000000-0000-4000-8000-0000000000aa\""
            - "data.created_at == \"2026-08-01T00:00:00Z\" and data.updated_at == \"2026-08-01T00:00:00Z\", taken from the logical clock rather than the body"
            - "data.version == 1, not 77"
            - "data.status == \"FULL_SHARE\", not DEPARTED, because status is computed from admission_path"

      - name: corner_enum_and_range_constraints_invalid_enum_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=10]
          - entities.Member.fields.admission_path
          - entities.RevenuePool.fields.pool_type
          - entities.ChampionshipEvent.fields.window_end
          - errors[ERR_INVALID_EVENT_WINDOW]
        distinguishing_aspect: |
          Enum membership is a priority-10 shape failure (ERR_INVALID_REQUEST),
          whereas an inverted datetime range is a priority-44 semantic failure
          (ERR_INVALID_EVENT_WINDOW at 422) - the same "bad value" intuition
          resolves to two different codes and two different HTTP statuses.
        test_recipe:
          setup:
            - "The conference exists with four charter members, an FY2027 pool and both venues available."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_pool
          trigger:
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Sideways College", institution_code: "SID", admission_path: "INVITED", home_venue_id: "${v1_id}", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /revenue-pools"
              payload: { conference_id: "${conf_id}", fiscal_year: 2027, pool_type: "MERCHANDISE", allocation_method: "EQUAL_SHARE", gross_revenue_cents: 1000, estimated_expense_cents: 0 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_s_id}", revenue_pool_id: "${rp_id}", sport: "WRESTLING", fiscal_year: 2027, window_start: "2027-03-05T00:00:00Z", window_end: "2027-03-01T00:00:00Z" }
              as: ScheduleCoordinator
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_s_id}", revenue_pool_id: "${rp_id}", sport: "WRESTLING", fiscal_year: 2027, window_start: "2027-03-05T00:00:00Z", window_end: "2027-03-05T00:00:00Z" }
              as: ScheduleCoordinator
          assert:
            - "the member create returns HTTP 400 with error.error_id == ERR_INVALID_REQUEST"
            - "the pool create returns HTTP 400 with error.error_id == ERR_INVALID_REQUEST"
            - "the inverted-window event create returns HTTP 422 with error.error_id == ERR_INVALID_EVENT_WINDOW"
            - "the zero-length-window event create returns HTTP 422 with error.error_id == ERR_INVALID_EVENT_WINDOW, because a half-open [start, end) window with start == end can never contain the event"
            - "no Member, RevenuePool or ChampionshipEvent row is created by these four attempts"

      - name: corner_distribution_line_immutability_has_no_version_field
        claim_type: Immutability
        grounds:
          - entities.DistributionLine
          - entities.PostseasonUnit
          - entities.Ballot
          - endpoints[GET /distribution-runs/{id}/lines]
        distinguishing_aspect: |
          DistributionLine, PostseasonUnit and Ballot all declare
          `common_fields: false`, so their serialised rows must omit the
          version/updated_at pair entirely and no update endpoint may exist for
          them - their only mutation path is the system-driven status flip from
          the parent's transition.
        test_recipe:
          setup:
            - "A FY2026 EQUAL_SHARE pool over four charter members has a COMPUTED FINAL_AUDITED run with four lines, and each member has cast one budget ballot."
