  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: buyer_premium_marginal_tiers_with_per_tier_rounding
        grounds:
          - calculations.buyer_premium
        distinguishing_aspect: |
          Mode (b) nested rounding: the per-tier round_half_up order is pinned
          over sum-then-round. Witness hammers where the orders provably
          diverge include 2000117 (tier3 portion 117: per-tier rounds
          117*0.06=7.02 down to 7 while sum-then-round carries the fraction
          and yields total 6015008 vs 6015007). This instance pins the
          arithmetic on a 3-tier straddle, hammer 72505555: tier1 6000000,
          tier2 1305000, tier3 round(5250555*0.06)=round(315033.30)=315033,
          total 7615533 — a second implementation using sum-then-round must
          still agree here, so the divergence witness 2000117 is asserted as
          the second sale in the same recipe (tier1 6000000 + tier3 7 =
          6015007, NOT 6015008).
        test_recipe:
          setup:
            - "CA yard; STANDARD seller; vehicle SALE_READY by 2026-09-01 path; auction closes 2026-09-10 with a single live bid of 72505555 by a BASIC US member."
