# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Multistate Investigation Coordination & Settlement Fund Distribution
# Canonical world shorthand: offices CA(100)/TX(300)/NY(400)/FL(200), harms
# 50/150/200/100, rules PREAPPROPRIATED/PREAPPROPRIATED/CERTIFICATION_REQUIRED/
# GENERAL_FUND_ONLY; leads CA+TX; settlement total 100,000,000 reserve 10,000,000,
# 3 injunctive terms; signed CA/TX/NY, FL DECLINED. Clock default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: office_create_success_defaults_and_envelope
        claim_type: creation
        grounds: [entities.StateOffice, response_envelope]
        distinguishing_aspect: "POST with all required fields returns 201, a server-minted id, version 1, and the fixed success envelope with meta.api_request_id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { ca_off: $.data.id, ca_v: $.data.version } }
          assert:
            - "HTTP 201; response_type == object; meta.api_request_id present; meta.api_request_timestamp present"
            - "data.id is a server-minted UUID; data.version == 1; data.created_at == 2026-09-01T00:00:00Z (logical clock default)"
      - name: office_missing_required_population_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.StateOffice.fields.population, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field population is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST; no StateOffice persisted"
      - name: office_invalid_enum_value_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.StateOffice.fields.appropriation_rule, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "appropriation_rule outside {PREAPPROPRIATED, CERTIFICATION_REQUIRED, GENERAL_FUND_ONLY} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "MAYBE" }, as: CommitteeChair, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
      - name: office_duplicate_state_code_rejected
        claim_type: creation
        grounds: [entities.StateOffice.fields.state_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "state_code is unique across offices; the second CA registration is rejected."
        test_recipe:
          setup: ["office CA already registered"]
          setup_api_calls:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair }
          trigger:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 999, harm_measure_cents: 1, appropriation_rule: "GENERAL_FUND_ONLY" }, as: CommitteeChair, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (duplicate state_code)"
      - name: participation_invite_initial_parallel_dimensions
        claim_type: defaults
        grounds: [entities.Participation.fields.status, entities.Participation.fields.cia_status, entities.Participation.fields.committee_role, state_machines.Participation]
        distinguishing_aspect: "A fresh Participation starts INVITED x NOT_EXECUTED x MEMBER across its three parallel dimensions, with cia_tier null."
        test_recipe:
          setup: ["office CA and an investigation exist"]
          setup_api_calls:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { ca_off: $.data.id } }
            - { call: "POST /multistate/investigations", payload: { title: "Probe", target_name: "Acme Corp", summary: "s" }, as: CommitteeChair, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ca_off}" }, as: CommitteeChair, captures: { p_status: $.data.status, p_cia: $.data.cia_status, p_role: $.data.committee_role, p_tier: $.data.cia_tier } }
          assert:
            - "status == INVITED, cia_status == NOT_EXECUTED, committee_role == MEMBER, cia_tier == null, invited_at == 2026-09-01T00:00:00Z"
      - name: get_unknown_id_returns_entity_not_found
        claim_type: not_found
        grounds: ["errors[ERR_STATE_OFFICE_NOT_FOUND]", "errors[ERR_INVESTIGATION_NOT_FOUND]", "errors[ERR_PARTICIPATION_NOT_FOUND]", "errors[ERR_SETTLEMENT_NOT_FOUND]", "errors[ERR_ALLOCATION_LINE_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource GET maps an unknown UUID to its entity-specific 404 error_id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /multistate/state-offices/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: CommitteeChair, captures: { e1: $.data.error_id } }
            - { call: "GET /multistate/investigations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: CommitteeChair, captures: { e2: $.data.error_id } }
            - { call: "GET /multistate/participations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: CommitteeChair, captures: { e3: $.data.error_id } }
            - { call: "GET /multistate/settlements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: CommitteeChair, captures: { e4: $.data.error_id } }
            - { call: "GET /multistate/allocation-lines/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: CommitteeChair, captures: { e5: $.data.error_id } }
          assert:
            - "ERR_STATE_OFFICE_NOT_FOUND / ERR_INVESTIGATION_NOT_FOUND / ERR_PARTICIPATION_NOT_FOUND / ERR_SETTLEMENT_NOT_FOUND / ERR_ALLOCATION_LINE_NOT_FOUND respectively, all HTTP 404"
      - name: create_office_with_client_supplied_id_input_ignored
        claim_type: system_fields
        grounds: [entities.StateOffice, response_envelope]
        distinguishing_aspect: "A client-supplied id field is ignored: the server mints its own UUID and still returns 201."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /multistate/state-offices", payload: { id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { ca_off: $.data.id } }
          assert:
            - "HTTP 201 and data.id != 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2 (system id wins over client input)"
  - section: state_machines
    instances:
      - name: advance_skip_phase_returns_invalid_phase
        claim_type: invalid_transition
        grounds: [state_machines.Investigation, "errors[ERR_INVALID_PHASE]"]
        distinguishing_aspect: "Advance is single-step forward only: DRAFT -> DISCOVERY is rejected with ERR_INVALID_PHASE."
        test_recipe:
          setup: ["investigation in DRAFT"]
          setup_api_calls:
            - { call: "POST /multistate/investigations", payload: { title: "Probe", target_name: "Acme Corp", summary: "s" }, as: CommitteeChair, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "DISCOVERY" }, as: CommitteeChair, captures: { err: $.data.error_id } }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "CLOSED" }, as: CommitteeChair, captures: { err2: $.data.error_id } }
          assert:
            - "both attempts return ERR_INVALID_PHASE (skipping a phase, and CLOSED is auto-only); phase remains DRAFT"
      - name: execute_from_proposed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Settlement, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "execute requires SIGN_ON_OPEN; from PROPOSED it is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["settlement PROPOSED in a NEGOTIATION-phase canonical investigation"]
          setup_api_calls:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { ca_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "TX", population: 300, harm_measure_cents: 150, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { tx_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "NY", population: 400, harm_measure_cents: 200, appropriation_rule: "CERTIFICATION_REQUIRED" }, as: CommitteeChair, captures: { ny_off: $.data.id } }
            - { call: "POST /multistate/investigations", payload: { title: "Probe", target_name: "Acme Corp", summary: "s" }, as: CommitteeChair, captures: { inv: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ca_off}" }, as: CommitteeChair, captures: { p_ca: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${tx_off}" }, as: CommitteeChair, captures: { p_tx: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ny_off}" }, as: CommitteeChair, captures: { p_ny: $.data.id } }
            - { call: "POST /multistate/participations/${p_ca}/execute-cia", payload: { confidentiality_tier: "LEAD_ONLY" }, as: ParticipatingStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/participations/${p_tx}/execute-cia", payload: { confidentiality_tier: "RESTRICTED" }, as: ParticipatingStateAG, as_user_id: "${tx_off}" }
            - { call: "POST /multistate/participations/${p_ny}/execute-cia", payload: { confidentiality_tier: "STANDARD" }, as: ParticipatingStateAG, as_user_id: "${ny_off}" }
            - { call: "POST /multistate/participations/${p_ca}/designate-lead", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/participations/${p_tx}/designate-lead", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "OPEN" }, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "DISCOVERY" }, as: CommitteeChair }
            - { call: "POST /multistate/participations/${p_ca}/demands", payload: { scope_text: "Pricing documents" }, as: LeadStateAG, as_user_id: "${ca_off}", captures: { d_ca: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/responses", payload: { demand_ids: ["${d_ca}"], coverage_summary: "Consolidated production" }, as: DefendantCounsel, captures: { resp: $.data.id } }
            - { call: "POST /multistate/responses/${resp}/accept", payload: {}, as: LeadStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "NEGOTIATION" }, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/settlements", payload: { monetary_total_cents: 100000000, restitution_reserve_cents: 10000000, allocation_basis: "POPULATION", injunctive_terms: ["No misleading marketing"] }, as: LeadStateAG, as_user_id: "${ca_off}", captures: { stl: $.data.id } }
          trigger:
            - { call: "POST /multistate/settlements/${stl}/execute", payload: {}, as: CommitteeChair, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; term_status remains PROPOSED"
      - name: execute_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Settlement.SIGN_ON_OPEN_to_EXECUTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second execute on an EXECUTED settlement is rejected; the first execution's lines and locked sign-ons are untouched."
        test_recipe:
          setup: ["settlement EXECUTED (canonical world)"]
          setup_api_calls:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { ca_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "TX", population: 300, harm_measure_cents: 150, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { tx_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "NY", population: 400, harm_measure_cents: 200, appropriation_rule: "CERTIFICATION_REQUIRED" }, as: CommitteeChair, captures: { ny_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "FL", population: 200, harm_measure_cents: 100, appropriation_rule: "GENERAL_FUND_ONLY" }, as: CommitteeChair, captures: { fl_off: $.data.id } }
            - { call: "POST /multistate/investigations", payload: { title: "Probe", target_name: "Acme Corp", summary: "s" }, as: CommitteeChair, captures: { inv: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ca_off}" }, as: CommitteeChair, captures: { p_ca: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${tx_off}" }, as: CommitteeChair, captures: { p_tx: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ny_off}" }, as: CommitteeChair, captures: { p_ny: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${fl_off}" }, as: CommitteeChair, captures: { p_fl: $.data.id } }
            - { call: "POST /multistate/participations/${p_ca}/execute-cia", payload: { confidentiality_tier: "LEAD_ONLY" }, as: ParticipatingStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/participations/${p_tx}/execute-cia", payload: { confidentiality_tier: "RESTRICTED" }, as: ParticipatingStateAG, as_user_id: "${tx_off}" }
            - { call: "POST /multistate/participations/${p_ny}/execute-cia", payload: { confidentiality_tier: "STANDARD" }, as: ParticipatingStateAG, as_user_id: "${ny_off}" }
            - { call: "POST /multistate/participations/${p_fl}/execute-cia", payload: { confidentiality_tier: "STANDARD" }, as: ParticipatingStateAG, as_user_id: "${fl_off}" }
            - { call: "POST /multistate/participations/${p_ca}/designate-lead", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/participations/${p_tx}/designate-lead", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "OPEN" }, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "DISCOVERY" }, as: CommitteeChair }
            - { call: "POST /multistate/participations/${p_ca}/demands", payload: { scope_text: "Pricing documents" }, as: LeadStateAG, as_user_id: "${ca_off}", captures: { d_ca: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/responses", payload: { demand_ids: ["${d_ca}"], coverage_summary: "Consolidated production" }, as: DefendantCounsel, captures: { resp: $.data.id } }
            - { call: "POST /multistate/responses/${resp}/accept", payload: {}, as: LeadStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "NEGOTIATION" }, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/settlements", payload: { monetary_total_cents: 100000000, restitution_reserve_cents: 10000000, allocation_basis: "POPULATION", injunctive_terms: ["No misleading marketing", "Annual compliance audit", "Data preservation"] }, as: LeadStateAG, as_user_id: "${ca_off}", captures: { stl: $.data.id } }
            - { call: "POST /multistate/settlements/${stl}/agree-terms", payload: {}, as: DefendantCounsel }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "SETTLEMENT_PENDING" }, as: CommitteeChair }
            - { call: "POST /multistate/settlements/${stl}/open-sign-on", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/settlements/${stl}/sign-ons", payload: { decision: "SIGNED" }, as: LeadStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/settlements/${stl}/sign-ons", payload: { decision: "SIGNED" }, as: LeadStateAG, as_user_id: "${tx_off}" }
            - { call: "POST /multistate/settlements/${stl}/sign-ons", payload: { decision: "SIGNED" }, as: ParticipatingStateAG, as_user_id: "${ny_off}" }
            - { call: "POST /multistate/settlements/${stl}/sign-ons", payload: { decision: "DECLINED" }, as: ParticipatingStateAG, as_user_id: "${fl_off}" }
            - { call: "POST /multistate/settlements/${stl}/execute", payload: {}, as: CommitteeChair }
          trigger:
            - { call: "POST /multistate/settlements/${stl}/execute", payload: {}, as: CommitteeChair, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; still exactly 3 AllocationLines; term_status stays EXECUTED"
      - name: accept_response_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.ConsolidatedResponse.SUBMITTED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second accept of an ACCEPTED consolidated response is rejected; demands stay CONSOLIDATED exactly once."
        test_recipe:
          setup: ["canonical world in DISCOVERY with one ISSUED demand and one SUBMITTED response covering it"]
          setup_api_calls:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { ca_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "TX", population: 300, harm_measure_cents: 150, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { tx_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "NY", population: 400, harm_measure_cents: 200, appropriation_rule: "CERTIFICATION_REQUIRED" }, as: CommitteeChair, captures: { ny_off: $.data.id } }
            - { call: "POST /multistate/investigations", payload: { title: "Probe", target_name: "Acme Corp", summary: "s" }, as: CommitteeChair, captures: { inv: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ca_off}" }, as: CommitteeChair, captures: { p_ca: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${tx_off}" }, as: CommitteeChair, captures: { p_tx: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ny_off}" }, as: CommitteeChair, captures: { p_ny: $.data.id } }
            - { call: "POST /multistate/participations/${p_ca}/execute-cia", payload: { confidentiality_tier: "LEAD_ONLY" }, as: ParticipatingStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/participations/${p_tx}/execute-cia", payload: { confidentiality_tier: "RESTRICTED" }, as: ParticipatingStateAG, as_user_id: "${tx_off}" }
            - { call: "POST /multistate/participations/${p_ny}/execute-cia", payload: { confidentiality_tier: "STANDARD" }, as: ParticipatingStateAG, as_user_id: "${ny_off}" }
            - { call: "POST /multistate/participations/${p_ca}/designate-lead", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/participations/${p_tx}/designate-lead", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "OPEN" }, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "DISCOVERY" }, as: CommitteeChair }
            - { call: "POST /multistate/participations/${p_ca}/demands", payload: { scope_text: "Pricing documents" }, as: LeadStateAG, as_user_id: "${ca_off}", captures: { d_ca: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/responses", payload: { demand_ids: ["${d_ca}"], coverage_summary: "Consolidated production" }, as: DefendantCounsel, captures: { resp: $.data.id } }
            - { call: "POST /multistate/responses/${resp}/accept", payload: {}, as: LeadStateAG, as_user_id: "${ca_off}" }
          trigger:
            - { call: "POST /multistate/responses/${resp}/accept", payload: {}, as: LeadStateAG, as_user_id: "${ca_off}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (already ACCEPTED)"
            - "Demand.${d_ca}.status remains CONSOLIDATED with consolidated_response_id == ${resp}"
      - name: fulfill_unaccepted_response_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ConsolidatedResponse.ACCEPTED_to_FULFILLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "fulfill requires ACCEPTED; from SUBMITTED it is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["canonical world in DISCOVERY with one SUBMITTED response"]
          setup_api_calls:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { ca_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "TX", population: 300, harm_measure_cents: 150, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { tx_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "NY", population: 400, harm_measure_cents: 200, appropriation_rule: "CERTIFICATION_REQUIRED" }, as: CommitteeChair, captures: { ny_off: $.data.id } }
            - { call: "POST /multistate/investigations", payload: { title: "Probe", target_name: "Acme Corp", summary: "s" }, as: CommitteeChair, captures: { inv: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ca_off}" }, as: CommitteeChair, captures: { p_ca: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${tx_off}" }, as: CommitteeChair, captures: { p_tx: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ny_off}" }, as: CommitteeChair, captures: { p_ny: $.data.id } }
            - { call: "POST /multistate/participations/${p_ca}/execute-cia", payload: { confidentiality_tier: "LEAD_ONLY" }, as: ParticipatingStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/participations/${p_tx}/execute-cia", payload: { confidentiality_tier: "RESTRICTED" }, as: ParticipatingStateAG, as_user_id: "${tx_off}" }
            - { call: "POST /multistate/participations/${p_ny}/execute-cia", payload: { confidentiality_tier: "STANDARD" }, as: ParticipatingStateAG, as_user_id: "${ny_off}" }
