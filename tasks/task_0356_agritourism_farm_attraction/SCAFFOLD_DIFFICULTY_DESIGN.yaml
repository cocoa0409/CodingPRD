              payload: {}
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-11T14:00:00Z", ends_at: "2026-10-11T16:00:00Z", capacity: 10 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "blk@x.com", full_name: "Bea Block" }
              as: FarmManager
              captures: { leader_id: $.data.id }
            - call: "POST /farms/${farm_id}/group-bookings"
              payload: { window_id: "${window_id}", group_leader_id: "${leader_id}", kind: "FIELD_TRIP", adult_count: 4, child_count: 6 }
              as: GroupLeader
              as_user_id: "${leader_id}"
              captures: { group_id: $.data.id }
          trigger:
            - call: "POST /group-bookings/${group_id}/confirm"
              payload: { expected_window_version: "${win_v0}" }
              as: GroupLeader
              as_user_id: "${leader_id}"
          assert:
            - "GroupBooking.${group_id}.status == CONFIRMED"
            - "AdmissionWindow.${window_id}.seats_committed == 10"
            - "AdmissionWindow.${window_id}.seats_available == 0"
            - "AdmissionWindow.${window_id}.status == SOLD_OUT"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # --- Instance 1: state (ERR_FARM_NOT_OPEN p5) vs business_fiscal (ERR_WINDOW_SOLD_OUT p13) ---
      - name: farm_not_open_beats_window_sold_out
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors[ERR_FARM_NOT_OPEN]
          - errors[ERR_WINDOW_SOLD_OUT]
        distinguishing_aspect: |
          Error-category pair state (ERR_FARM_NOT_OPEN, p5) vs business_fiscal (ERR_WINDOW_SOLD_OUT, p13):
          a reservation create on a CLOSED farm whose target window is also sold out returns
          ERR_FARM_NOT_OPEN (lower priority number wins), proving the posture gate is checked before capacity.
        test_recipe:
          setup:
            - "Window A (10-20) capacity 1, committed to seats_available 0; farm posture CLOSED via a CLOSURE affecting a DIFFERENT span so window A survives but farm is CLOSED."
            - "A second reservation against window A both violates sold-out (avail 0) and farm-not-open."
          setup_api_calls:
            - call: "POST /farms"
              payload: { name: "Conflict Farm" }
              as: FarmManager
              captures: { farm_id: $.data.id }
            - call: "POST /farms/${farm_id}/pricing-policies"
              payload: { adult_admission_cents: 2000, child_admission_cents: 1200, hayride_pass_cents: 800, maze_pass_cents: 600, upick_pass_cents: 1000, pumpkin_per_lb_cents: 150, pumpkin_flat_each_cents: 2500, season_pass_price_cents: 8000 }
              as: FarmManager
              captures: { policy_id: $.data.id }
            - call: "POST /pricing-policies/${policy_id}/activate"
              payload: {}
              as: FarmManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T12:00:00Z" }
              as: FarmManager
            - call: "POST /farms/${farm_id}/admission-windows"
              payload: { starts_at: "2026-10-20T14:00:00Z", ends_at: "2026-10-20T16:00:00Z", capacity: 1 }
              as: FarmManager
              captures: { window_id: $.data.id, win_v0: $.data.version }
            - call: "POST /visitors"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: FarmManager
              captures: { v1: $.data.id }
            - call: "POST /visitors"
              payload: { email: "c2@x.com", full_name: "Cody Two" }
              as: FarmManager
              captures: { v2: $.data.id }
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${v1}", adult_count: 1, child_count: 0, expected_window_version: "${win_v0}" }
              as: Visitor
              as_user_id: "${v1}"
              captures: { res1: $.data.id, win_v1: $.data.version }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: Visitor
              as_user_id: "${v1}"
            - call: "POST /farms/${farm_id}/weather-events"
              payload: { kind: "CLOSURE", affected_span_start: "2026-10-11T00:00:00Z", affected_span_end: "2026-10-12T00:00:00Z", note: "Storm elsewhere; the 10-20 window survives" }
              as: FarmManager
          trigger:
            - call: "POST /reservations"
              payload: { window_id: "${window_id}", visitor_id: "${v2}", adult_count: 1, child_count: 0, expected_window_version: "${win_v1}" }
              as: Visitor
              as_user_id: "${v2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FARM_NOT_OPEN"

      # --- Instance 2: business_safety (ERR_WAIVER_INCOMPLETE p7) vs business_referential (ERR_PASS_NOT_VALID p9) ---
      - name: pass_not_valid_beats_waiver_incomplete
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_WAIVER_INCOMPLETE]
          - errors[ERR_PASS_NOT_VALID]
        distinguishing_aspect: |
          Error-category pair business_safety (ERR_WAIVER_INCOMPLETE, p7) vs business_referential
          (ERR_PASS_NOT_VALID, p9): a reservation confirm that references a REVOKED season pass (p9) with no
          waiver yet (p7) returns ERR_PASS_NOT_VALID — confirm checks pass validity at p9 and the waiver gap
          (only checked at the later check-in, p7) is never reached, proving p9 precedes p7 on this path.
        test_recipe:
          setup:
            - "Farm OPEN; ACTIVE policy; visitor holds a season pass that is then REVOKED; window capacity 5."
            - "A PENDING reservation linked to the (now revoked) pass with NO waivers signed."
          setup_api_calls:
