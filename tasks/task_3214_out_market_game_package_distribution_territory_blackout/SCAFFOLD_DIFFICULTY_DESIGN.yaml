  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: subscription_paid_amount_ledger_conservation
        grounds:
          - calculations.blackout_refund_amount
          - entities.Subscription.fields.paid_amount_cents
          - entities.Payment.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = Subscription.paid_amount_cents: forward CHARGE
          (16667) paired with a compensating REFUND (1111) must leave
          paid_amount_cents == 15556 exactly, equal to the signed sum of the
          Payment ledger rows — a cascade that runs end-to-end but drifts the
          ledger violates the invariant.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (week 4); season 18 weeks grace_days 7; BASE offer 20000."
            - "Account with ACTIVE paid subscription (charged 16667) and one filed BLACKOUT_DISPUTE complaint."
