# =============================================================================
# PRD Benchmark Scaffold — Uniform & Workwear Rental Program (Cintas style)
# §1.0–§1.7. Difficulty band: Expert.
# =============================================================================

scenario: |
  Uniform & Workwear Rental Program (Cintas style): customer & employee sizing
  roster, garment assignment & locker, weekly pickup/clean/deliver rotation,
  soil-count & shortage charge, emblem/embroidery, ramp/add/return, loss &
  damage fee, route stop

domain_name: uniform-workwear-rental
api_prefix: ""

# -----------------------------------------------------------------------------
# Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation        # finite garment pool wearer-assigned, soil-tracked, ramped, returned
  secondary_archetype: ledger_reconciliation # provisional weekly invoice vs finalized post-delivery reconciliation
  complexity_layers:
    - optimistic_concurrency          # OCC on ServiceVisit.version for reconciliation-create supersede race
    - cascading_side_effects          # visit finalize -> charges -> account ledger -> wearer counts
    - dual_variant_calculation        # provisional vs finalized service charge; garment_par projected vs actual
    - rate_threshold_triggers         # shortage grace tolerance, loss-fee escalation thresholds

  entity_topology: hybrid
  # Account is the aggregate root (hierarchical), but Garment<->Wearer assignment
  # and Route<->ServiceVisit are flat cross-aggregate FK references.

  state_machine_shape: parallel
  # Garment carries two independent dimensions (lifecycle_status x wash_location);
  # ServiceVisit is cyclic-per-week; Assignment has branching return/loss/damage.

  relationship_patterns:
    - one_to_many        # Account -> Wearer, Account -> Garment, Route -> RouteStop
    - many_to_many       # Garment <-> Wearer mediated by Assignment junction
    - cross_aggregate    # ServiceVisit references RouteStop and Account across aggregates

  role_model: peer_roles
  # AccountManager (customer-facing roster/ramp), RouteDriver (pickup/deliver/soil-count),
  # CleanroomTech (wash lifecycle), ProgramAdmin (catalog/route/billing overrides).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Customer business legal name.
      - name: service_day
        type: enum
        source: input
        description: Weekly service weekday for this account's stop.
        constraints: "one of MON, TUE, WED, THU, FRI"
      - name: shortage_grace_units
        type: integer
        source: input
        default: 2
        description: Per-visit soil-count shortfall tolerated before a shortage charge applies.
        constraints: ">= 0"
      - name: billing_status
        type: enum
        source: computed
        description: Aggregate billing posture derived from outstanding charges; gates ramp operations.
        default: CURRENT
        constraints: "one of CURRENT, PAST_DUE, ON_HOLD"
      - name: outstanding_cents
        type: integer
        source: computed
        description: Sum of unpaid ServiceCharge.amount_cents across all visits for this account.
        default: 0
      - name: active_wearer_count
        type: integer
        source: computed
        description: Count of Wearer rows for this account with roster_status == ACTIVE.
        default: 0

  - name: Wearer
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id"
      - name: full_name
        type: string
        source: input
        description: Employee name on the roster.
      - name: shirt_size
        type: enum
        source: input
        description: Sizing for assigned shirts.
        constraints: "one of XS, S, M, L, XL, XXL"
      - name: pant_size
        type: integer
        source: input
        description: Numeric pant waist size.
        constraints: "integer in [28, 48]"
      - name: roster_status
        type: enum
        source: computed
        description: Lifecycle on the sizing roster.
        default: ACTIVE
        constraints: "one of ACTIVE, RAMP_DOWN, REMOVED"
      - name: assigned_garment_count
        type: integer
        source: computed
        description: Count of Assignment rows for this wearer in status ASSIGNED.
        default: 0
      - name: locker_label
        type: string
        source: input
        description: Physical locker slot label where this wearer's clean garments are racked at the stop.
        constraints: "unique among ACTIVE/RAMP_DOWN wearers within the same account"

  - name: GarmentType
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Catalog SKU for the garment style.
        constraints: "globally unique"
      - name: category
        type: enum
        source: input
        description: Garment category.
        constraints: "one of SHIRT, PANT, JACKET, COVERALL"
      - name: weekly_rate_cents
        type: integer
        source: input
        description: Per-garment weekly rental rate.
        constraints: ">= 0"
      - name: replacement_cost_cents
        type: integer
        source: input
        description: Full replacement value used for loss fee.
        constraints: ">= 0"
      - name: emblem_setup_cents
        type: integer
        source: input
        description: One-time embroidery setup fee when an emblem is first applied to a garment of this type.
        constraints: ">= 0"

  - name: Garment
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id ; the account that rents this physical garment"
      - name: garment_type_id
        type: string
        source: input
        description: "FK -> GarmentType.id"
      - name: tag_code
        type: string
        source: input
        description: Barcode/RFID tag on the physical garment.
        constraints: "unique per account"
      - name: lifecycle_status
        type: enum
        source: computed
        description: Inventory lifecycle dimension (independent of wash_location).
        default: IN_STOCK
        constraints: "one of IN_STOCK, ASSIGNED, RETIRED, LOST"
      - name: wash_location
        type: enum
        source: computed
        description: Wash/rotation dimension (independent of lifecycle_status).
        default: AT_PLANT
        constraints: "one of AT_PLANT, AT_CUSTOMER, IN_SOIL, IN_WASH"
      - name: emblem_text
        type: string
        source: input
        default: null
        description: Embroidered emblem text applied to this garment; null = no emblem.
      - name: soil_strikes
        type: integer
        source: computed
        description: Count of visits where this garment was expected in soil but not scanned; drives damage escalation.
        default: 0
      - name: cycled_through_wash_this_visit
        type: boolean
        source: computed
        description: True once the garment completed IN_WASH->AT_PLANT since the current visit's pickup; reset to false at each pickup. Gates the finalized rental input-set.
        default: false
      - name: wash_station_id
        type: string
        source: computed
        description: "FK -> WashStation.id ; the station this garment currently occupies while IN_WASH; null otherwise."
        default: null
      - name: slot_start_min
        type: integer
        source: input
        description: Inclusive start (minutes-from-midnight) of the wash slot reserved at start-wash; null when not IN_WASH.
        default: null
        constraints: "0 <= slot_start_min < slot_end_min <= 1440 when present"
      - name: slot_end_min
        type: integer
        source: input
        description: Exclusive end (minutes-from-midnight) of the wash slot; null when not IN_WASH.
        default: null
        constraints: "slot_start_min < slot_end_min <= 1440 when present"

  - name: WashStation
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: Plant wash-station identifier.
        constraints: "globally unique"
      - name: capacity
        type: integer
        source: input
        description: Maximum number of garments whose wash slots may overlap at any single instant on this station (aggregate-capacity interval semantics).
        constraints: "integer >= 1"

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: garment_id
        type: string
        source: input
        description: "FK -> Garment.id"
      - name: wearer_id
        type: string
        source: input
        description: "FK -> Wearer.id"
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id ; copied from the garment at assignment time"
      - name: status
        type: enum
        source: computed
        description: Assignment lifecycle; branches into RETURNED / LOST / DAMAGED terminals.
        default: ASSIGNED
        constraints: "one of ASSIGNED, RETURNED, LOST, DAMAGED"
      - name: assigned_at_iso
        type: datetime
        source: system
        description: When the garment was assigned to the wearer.
      - name: closed_at_iso
        type: datetime
        source: computed
        description: When the assignment reached a terminal status; null while ASSIGNED.
        default: null

  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: route_code
        type: string
        source: input
        description: Operational route identifier.
        constraints: "globally unique"
      - name: service_day
        type: enum
        source: input
        description: Weekday this route runs.
        constraints: "one of MON, TUE, WED, THU, FRI"
      - name: driver_user_id
        type: string
        source: input
        description: Opaque RouteDriver operator id responsible for this route.

  - name: RouteStop
    parent: Route
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id"
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id ; the account serviced at this stop"
      - name: stop_sequence
        type: integer
        source: input
        description: Visiting order of this stop on the route.
        constraints: "integer >= 1, unique within a route"
      - name: window_start_min
        type: integer
        source: input
        description: Inclusive start of the delivery window, minutes-from-midnight local.
        constraints: "0 <= window_start_min < window_end_min <= 1440"
      - name: window_end_min
        type: integer
        source: input
        description: Exclusive end of the delivery window, minutes-from-midnight local.
        constraints: "window_start_min < window_end_min <= 1440"

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
      - name: route_stop_id
        type: string
        source: input
        description: "FK -> RouteStop.id"
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id ; copied from the route stop at visit creation"
      - name: week_index
        type: integer
        source: input
        description: Monotonic week counter for the rotation; uniquely identifies the visit within a stop.
        constraints: "integer >= 0, unique per route_stop_id"
      - name: status
        type: enum
        source: computed
        description: Cyclic weekly rotation status.
        default: SCHEDULED
        constraints: "one of SCHEDULED, PICKED_UP, DELIVERED, RECONCILED"
      - name: expected_soil_count
        type: integer
        source: computed
        description: Garments expected back in soil at pickup (snapshot of ASSIGNED garments AT_CUSTOMER at pickup time).
        default: 0
      - name: actual_soil_count
        type: integer
        source: input
        description: Garments the driver actually scanned into soil at pickup.
        default: 0
        constraints: ">= 0"
      - name: provisional_charge_cents
        type: integer
        source: computed
        description: Estimated weekly charge computed at DELIVERED (provisional variant).
        default: 0
      - name: finalized_charge_cents
        type: integer
        source: computed
        description: Reconciled weekly charge computed at RECONCILED (final variant); 0 until reconciled.
        default: 0

  - name: ServiceCharge
    parent: ServiceVisit
    common_fields: true
    fields:
      - name: service_visit_id
        type: string
        source: input
        description: "FK -> ServiceVisit.id"
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id ; copied from the visit"
      - name: charge_type
        type: enum
        source: input
        description: Kind of charge line.
        constraints: "one of RENTAL, SHORTAGE, LOSS, DAMAGE, EMBLEM_SETUP"
      - name: amount_cents
        type: integer
        source: input
        description: Charge amount in cents.
        constraints: ">= 0"
      - name: paid
        type: boolean
        source: computed
        description: Whether this charge has been settled.
        default: false

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- ServiceVisit: cyclic weekly rotation (pickup -> clean -> deliver -> reconcile) ---
  - entity: ServiceVisit
    initial_state: SCHEDULED
    terminal_states: [RECONCILED]
    transitions:
      - from: SCHEDULED
        to: PICKED_UP
        trigger: "POST /service-visits/{id}/pickup"
        actor: RouteDriver
        preconditions:
          - "visit.status == SCHEDULED"
          - "actual_soil_count >= 0 in body"
        side_effects:
          - "snapshot expected_soil_count = count(Garment where account_id==visit.account_id AND lifecycle_status==ASSIGNED AND wash_location==AT_CUSTOMER)"
          - "set actual_soil_count from body (clamped: a value above expected_soil_count is rejected as ERR_INVALID_REQUEST)"
          - "for each ASSIGNED garment for this account: reset cycled_through_wash_this_visit = false"
          - "move exactly min(actual_soil_count, expected_soil_count) garments AT_CUSTOMER into IN_SOIL, ordered by assigned_at_iso ASC then created_at ASC (oldest first); the remaining (expected_soil_count - actual_soil_count) garments stay AT_CUSTOMER (the wearer kept them)"
          - "for each of the (expected_soil_count - actual_soil_count) garments that stayed AT_CUSTOMER: increment Garment.soil_strikes by 1 (CASCADE hop 1)"
          - "increments ServiceVisit.version by 1"
      - from: PICKED_UP
        to: DELIVERED
        trigger: "POST /service-visits/{id}/deliver"
        actor: RouteDriver
        preconditions:
          - "visit.status == PICKED_UP"
          - "every Garment for this account in wash_location==IN_SOIL has been advanced to IN_WASH then AT_PLANT (i.e. no garment remains IN_SOIL or IN_WASH for this account)"
        side_effects:
          - "for each ASSIGNED garment AT_PLANT for this account: set wash_location = AT_CUSTOMER (clean delivery)"
          - "compute provisional_charge_cents via calc provisional_service_charge"
          - "create one ServiceCharge(charge_type=RENTAL, amount_cents=provisional rental portion, paid=false)"
          - "create one ServiceCharge(charge_type=SHORTAGE, amount_cents=provisional shortage portion) only if shortage portion > 0"
          - "recompute Account.outstanding_cents and Account.billing_status (CASCADE hop 2)"
          - "increments ServiceVisit.version by 1"
      - from: DELIVERED
        to: RECONCILED
        trigger: "POST /service-visits/{id}/reconcile"
        actor: ProgramAdmin
        preconditions:
          - "visit.status == DELIVERED"
          - "body carries expected_service_visit_version matching current version (OCC)"
        side_effects:
          - "compute finalized_charge_cents via calc finalized_service_charge"
          - "delete the provisional RENTAL and SHORTAGE ServiceCharge rows for this visit and replace with finalized RENTAL + SHORTAGE rows (paid=false)"
          - "recompute Account.outstanding_cents and Account.billing_status"
          - "increments ServiceVisit.version by 1"
        note: "Provisional charges from DELIVERED are superseded by the finalized reconciliation; net account ledger must equal finalized total (compensating invariant)."

  # --- Garment: parallel dimensions (lifecycle_status x wash_location) ---
  - entity: Garment
    initial_state: IN_STOCK            # lifecycle dimension initial; wash_location initial AT_PLANT
    terminal_states: [RETIRED, LOST]
    transitions:
      - from: IN_STOCK
        to: ASSIGNED
        trigger: "POST /assignments (lifecycle dimension)"
        actor: AccountManager
        preconditions:
          - "garment.lifecycle_status == IN_STOCK"
          - "garment.wash_location == AT_PLANT"
        side_effects:
          - "set lifecycle_status = ASSIGNED"
          - "set wash_location = AT_CUSTOMER"
          - "increments Garment.version by 1"
        note: "Lifecycle and wash_location are independent dimensions; this transition writes both but later visit transitions move only wash_location."
      - from: ASSIGNED
        to: IN_STOCK
        trigger: "POST /assignments/{id}/return (lifecycle dimension)"
        actor: AccountManager
        preconditions:
          - "garment.lifecycle_status == ASSIGNED"
          - "linked Assignment.status == ASSIGNED"
        side_effects:
          - "set lifecycle_status = IN_STOCK, wash_location = AT_PLANT"
          - "increments Garment.version by 1"
      - from: ASSIGNED
        to: LOST
        trigger: "POST /assignments/{id}/declare-loss (lifecycle dimension)"
        actor: AccountManager
        preconditions:
          - "garment.lifecycle_status == ASSIGNED"
        side_effects:
          - "set lifecycle_status = LOST"
          - "create ServiceCharge(charge_type=LOSS, amount_cents = loss fee via calc loss_damage_fee)"
          - "increments Garment.version by 1"
      - from: ASSIGNED
        to: RETIRED
        trigger: "POST /garments/{id}/retire (lifecycle dimension)"
        actor: ProgramAdmin
        preconditions:
          - "garment.lifecycle_status == ASSIGNED OR garment.lifecycle_status == IN_STOCK"
          - "garment.soil_strikes >= DAMAGE_RETIRE_STRIKES OR garment is being returned for damage"
        side_effects:
          - "set lifecycle_status = RETIRED"
          - "if linked Assignment.status == ASSIGNED: create ServiceCharge(charge_type=DAMAGE, amount_cents = damage fee via calc loss_damage_fee)"
          - "increments Garment.version by 1"
    note: "wash_location dimension transitions (AT_CUSTOMER->IN_SOIL at pickup, IN_SOIL->IN_WASH->AT_PLANT in cleanroom, AT_PLANT->AT_CUSTOMER at deliver) evolve independently of lifecycle_status and are listed under their driving transitions / the Garment-wash machine below."

  # --- Garment wash sub-machine (the second, independent dimension) ---
  - entity: Garment
    initial_state: AT_PLANT
    terminal_states: []
    transitions:
      - from: IN_SOIL
        to: IN_WASH
        trigger: "POST /garments/{id}/start-wash (wash dimension)"
        actor: CleanroomTech
        preconditions:
          - "garment.wash_location == IN_SOIL"
          - "referenced WashStation exists"
          - "0 <= slot_start_min < slot_end_min <= 1440"
          - "at no instant within [slot_start_min, slot_end_min) do more than WashStation.capacity garments' wash slots overlap on this station (aggregate-capacity check counting the new garment)"
        side_effects:
          - "set wash_location = IN_WASH, wash_station_id = body.wash_station_id, slot_start_min/slot_end_min from body"
          - "increments Garment.version by 1"
      - from: IN_WASH
        to: AT_PLANT
        trigger: "POST /garments/{id}/finish-wash (wash dimension)"
        actor: CleanroomTech
        preconditions:
          - "garment.wash_location == IN_WASH"
        side_effects:
          - "set wash_location = AT_PLANT, clear wash_station_id/slot_start_min/slot_end_min to null"
          - "set cycled_through_wash_this_visit = true"
          - "increments Garment.version by 1"
    note: "Independent of lifecycle_status: a garment can be ASSIGNED while cycling AT_CUSTOMER->IN_SOIL->IN_WASH->AT_PLANT->AT_CUSTOMER week over week."

  # --- Assignment: branching terminal (RETURNED / LOST / DAMAGED) ---
  - entity: Assignment
    initial_state: ASSIGNED
    terminal_states: [RETURNED, LOST, DAMAGED]
    transitions:
      - from: ASSIGNED
        to: RETURNED
        trigger: "POST /assignments/{id}/return"
        actor: AccountManager
        preconditions:
          - "assignment.status == ASSIGNED"
          - "linked Garment.lifecycle_status == ASSIGNED"
        side_effects:
          - "set status = RETURNED, closed_at_iso = now"
          - "Garment ASSIGNED->IN_STOCK (cross-entity)"
          - "decrement Wearer.assigned_garment_count by 1"
          - "increments Assignment.version by 1"
      - from: ASSIGNED
        to: LOST
        trigger: "POST /assignments/{id}/declare-loss"
        actor: AccountManager
        preconditions:
          - "assignment.status == ASSIGNED"
          - "linked Garment.lifecycle_status == ASSIGNED"
        side_effects:
          - "set status = LOST, closed_at_iso = now"
          - "Garment ASSIGNED->LOST (cross-entity); LOSS ServiceCharge created (CASCADE hop 1)"
          - "decrement Wearer.assigned_garment_count by 1"
          - "recompute Account.outstanding_cents and billing_status (CASCADE hop 2)"
          - "increments Assignment.version by 1"
      - from: ASSIGNED
        to: DAMAGED
        trigger: "POST /assignments/{id}/declare-damage"
        actor: AccountManager
        preconditions:
          - "assignment.status == ASSIGNED"
          - "linked Garment.lifecycle_status == ASSIGNED"
        side_effects:
          - "set status = DAMAGED, closed_at_iso = now"
          - "Garment ASSIGNED->RETIRED (cross-entity); DAMAGE ServiceCharge created (CASCADE hop 1)"
          - "decrement Wearer.assigned_garment_count by 1"
          - "recompute Account.outstanding_cents and billing_status (CASCADE hop 2)"
          - "increments Assignment.version by 1"

  # --- Wearer: ramp lifecycle (ACTIVE -> RAMP_DOWN -> REMOVED) with bubble-up gate ---
  - entity: Wearer
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: RAMP_DOWN
        trigger: "POST /wearers/{id}/ramp-down"
        actor: AccountManager
        preconditions:
          - "wearer.roster_status == ACTIVE"
          - "Account.billing_status != ON_HOLD"
        side_effects:
          - "set roster_status = RAMP_DOWN"
          - "increments Wearer.version by 1"
        note: "Ramp-down freezes new assignments to this wearer but keeps existing garments billable until returned."
      - from: RAMP_DOWN
        to: REMOVED
        trigger: "POST /wearers/{id}/remove"
        actor: AccountManager
        preconditions:
          - "wearer.roster_status == RAMP_DOWN"
          - "wearer.assigned_garment_count == 0 (all garments returned/lost/declared)"
        side_effects:
          - "set roster_status = REMOVED"
          - "recompute Account.active_wearer_count"
          - "increments Wearer.version by 1"
      - from: RAMP_DOWN
        to: ACTIVE
        trigger: "POST /wearers/{id}/reinstate"
        actor: AccountManager
        preconditions:
          - "wearer.roster_status == RAMP_DOWN"
          - "Account.billing_status != ON_HOLD"
        side_effects:
          - "set roster_status = ACTIVE"
          - "increments Wearer.version by 1"
        note: "Reinstatement is the revert edge making this machine a branching-with-revert (RAMP_DOWN -> ACTIVE)."

  # --- Account: billing posture (compound/derived, gates child ops) ---
  - entity: Account
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "system: recompute after any ServiceCharge create"
        actor: system
        preconditions:
          - "outstanding_cents > PAST_DUE_THRESHOLD_CENTS"
        side_effects:
          - "set billing_status = PAST_DUE"
          - "increments Account.version by 1"
      - from: PAST_DUE
        to: ON_HOLD
        trigger: "POST /accounts/{id}/place-hold"
        actor: ProgramAdmin
        preconditions:
          - "billing_status == PAST_DUE"
        side_effects:
          - "set billing_status = ON_HOLD"
          - "increments Account.version by 1"
        note: "ON_HOLD gates ramp/assignment operations on this account's wearers and garments."
      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /service-charges/{id}/settle (system recompute)"
        actor: system
        preconditions:
          - "outstanding_cents <= PAST_DUE_THRESHOLD_CENTS after settlement"
        side_effects:
          - "set billing_status = CURRENT"
          - "increments Account.version by 1"
      - from: ON_HOLD
        to: CURRENT
        trigger: "POST /accounts/{id}/release-hold"
        actor: ProgramAdmin
        preconditions:
          - "billing_status == ON_HOLD"
          - "outstanding_cents <= PAST_DUE_THRESHOLD_CENTS"
        side_effects:
          - "set billing_status = CURRENT"
          - "increments Account.version by 1"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reconcile-stale-visit
    parent_entity: ServiceVisit
    write_endpoint: "POST /service-visits/{id}/reconcile"
    occ_field: "expected_service_visit_version"
    description: |
      Reconciling a ServiceVisit whose version has advanced since the client
      last observed it is rejected. A reconciliation legitimately supersedes the
      provisional charges created at DELIVERED; if another writer has already
      reconciled (advancing the version and replacing the charge rows), the
      current writer's stale view must not double-apply, so the stale-version
      reconcile is rejected.
    error_id: ERR_STALE_VISIT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_service_charge
    trigger: "ServiceVisit PICKED_UP -> DELIVERED transition"
    algorithm: aggregation
    formula: |
      # Provisional variant: charges every ASSIGNED garment delivered this week at
      # full weekly rate, and estimates shortage from the pickup soil scan.
      rental_cents = sum(gt.weekly_rate_cents
                         for g in Garments where g.account_id==visit.account_id
                                              and g.lifecycle_status==ASSIGNED
                         for gt = g.garment_type)
      shortfall = max(0, expected_soil_count - actual_soil_count - Account.shortage_grace_units)
      shortage_cents = shortfall * SHORTAGE_UNIT_CENTS
      provisional_charge_cents = rental_cents + shortage_cents
    input_set: "ASSIGNED garments for the account at DELIVER time (LOST/RETIRED excluded); pickup soil scan from this visit."
    constants:
      SHORTAGE_UNIT_CENTS: 1500
    precision: "integer cents, no rounding (all rates are integer cents)"
    variants:
      - name: provisional
        when: "computed at DELIVERED before reconciliation"
        difference: "Bills full weekly rate for every ASSIGNED garment regardless of whether it actually cycled through wash; shortage estimated from the single pickup scan."

  - name: finalized_service_charge
    trigger: "ServiceVisit DELIVERED -> RECONCILED transition"
    algorithm: chronological
    formula: |
      # Final variant: bills weekly rate ONLY for garments that completed a full
      # wash cycle this week (proved by wash_location returning to AT_PLANT at least
      # once during the visit, i.e. garment was scanned through IN_WASH->AT_PLANT),
      # and recomputes shortage against the reconciled soil count. Garments declared
      # LOST/DAMAGED mid-week are prorated out of rental for this week.
      eligible = [g for g in Garments where g.account_id==visit.account_id
                  and g.lifecycle_status==ASSIGNED
                  and g.cycled_through_wash_this_visit == true]
      rental_cents = sum(g.garment_type.weekly_rate_cents for g in eligible)
      reconciled_shortfall = max(0, expected_soil_count - actual_soil_count - Account.shortage_grace_units)
      # Reconciled shortage forgives ONE extra unit beyond grace if billing_status==CURRENT (good-standing rebate)
      forgiven = 1 if Account.billing_status == CURRENT else 0
      shortage_units = max(0, reconciled_shortfall - forgiven)
      shortage_cents = shortage_units * SHORTAGE_UNIT_CENTS
      finalized_charge_cents = rental_cents + shortage_cents
    input_set: "ASSIGNED garments that completed wash this visit; reconciled soil count; account good-standing flag."
    constants:
      SHORTAGE_UNIT_CENTS: 1500
    precision: "integer cents, no rounding"
    variants:
      - name: finalized
        when: "computed at RECONCILED"
        difference: "Excludes garments that did NOT complete a wash cycle this week (different input-set filter than provisional), and applies a one-unit shortage forgiveness when the account is in good standing — so the finalized total can diverge from provisional for identical pickup data."

  - name: loss_damage_fee
    trigger: "Assignment declare-loss / declare-damage / Garment retire-for-damage"
    algorithm: threshold
    formula: |
      # Loss bills full replacement; damage bills a tiered fraction that escalates
      # with accumulated soil_strikes. Order of evaluation is pinned: compute the
      # tier multiplier FIRST from soil_strikes, THEN apply to replacement cost,
      # THEN clamp to the replacement cost (a damaged garment never costs more than a lost one).
      if action == LOSS:
        fee_cents = garment_type.replacement_cost_cents
      else:  # DAMAGE
        if   garment.soil_strikes >= HEAVY_STRIKE_THRESHOLD: mult = HEAVY_DAMAGE_PCT      # 0.75
        elif garment.soil_strikes >= LIGHT_STRIKE_THRESHOLD: mult = MODERATE_DAMAGE_PCT   # 0.50
        else:                                                mult = LIGHT_DAMAGE_PCT       # 0.25
        raw = floor(garment_type.replacement_cost_cents * mult)
        fee_cents = min(raw, garment_type.replacement_cost_cents)
    input_set: "single garment + its garment_type + accumulated soil_strikes."
    constants:
      LIGHT_STRIKE_THRESHOLD: 2
      HEAVY_STRIKE_THRESHOLD: 4
      LIGHT_DAMAGE_PCT: 0.25
      MODERATE_DAMAGE_PCT: 0.50
      HEAVY_DAMAGE_PCT: 0.75
    precision: "floor to integer cents after multiplying replacement_cost_cents by the percentage"
    variants:
      - name: loss
        when: "garment declared LOST"
        difference: "Full replacement_cost_cents, no tiering."
      - name: damage
        when: "garment declared DAMAGED / retired for damage"
        difference: "Tiered fraction of replacement cost selected by soil_strikes threshold, floored then clamped."

  - name: emblem_setup_charge
    trigger: "POST /garments/{id}/apply-emblem when garment has no prior emblem"
    algorithm: threshold
    formula: |
      # First emblem ever applied to a garment incurs the type's one-time setup fee.
      # Re-applying/changing emblem text on a garment that already carries an emblem
      # is free (the setup is amortized). Boundary: emblem_text transition null -> non-null.
      if garment.emblem_text is null and new_emblem_text is not null:
        charge_cents = garment_type.emblem_setup_cents
      else:
        charge_cents = 0
    input_set: "single garment's current emblem_text and the requested new emblem_text."
    constants: {}
    precision: "integer cents"
    variants:
      - name: first_emblem
        when: "emblem_text was null"
        difference: "Charges emblem_setup_cents."
      - name: re_emblem
        when: "emblem_text already non-null"
        difference: "Charges 0."

  - name: account_outstanding
    trigger: "any ServiceCharge create/settle; recomputed and reconciled to Account.outstanding_cents"
    algorithm: aggregation
    formula: |
      outstanding_cents = sum(sc.amount_cents
                              for sc in ServiceCharges where sc.account_id==account.id
                                                          and sc.paid == false)
      active_wearer_count = count(Wearer where account_id==account.id and roster_status==ACTIVE)
    input_set: "unpaid ServiceCharge rows (paid==false) for the account; ACTIVE wearers."
    constants:
      PAST_DUE_THRESHOLD_CENTS: 50000
    precision: "integer cents"
    variants:
      - name: outstanding
        when: "always"
        difference: "Single authoritative derived field; billing_status crosses to PAST_DUE strictly above PAST_DUE_THRESHOLD_CENTS (> not >=)."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path id (account, wearer, garment, assignment, route, route-stop, service-visit, service-charge) references an existing resource, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_referential
    check: "FK body fields (garment_type_id, garment_id, wearer_id, account_id, wash_station_id) reference existing rows; garment and wearer on an assignment belong to the same account"
    error_id: ERR_FK_INTEGRITY
    http_status: 422
    applies_to: "POST /assignments, POST /accounts/{id}/garments, POST /routes/{id}/stops, POST /garments/{id}/start-wash"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_safety
    check: "Account.billing_status != ON_HOLD when creating a new assignment, ramping a wearer up/down, or reinstating (an account on hold cannot grow its garment footprint)"
    error_id: ERR_ACCOUNT_ON_HOLD
    http_status: 409
    applies_to: "POST /assignments, POST /wearers/{id}/ramp-down, POST /wearers/{id}/reinstate"

  - priority: 7
    category: business_constraint
    check: "Cannot assign a garment to a wearer whose roster_status is RAMP_DOWN or REMOVED (only ACTIVE wearers receive new garments)"
    error_id: ERR_WEARER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 8
    category: business_constraint
    check: "Cannot remove a wearer while wearer.assigned_garment_count > 0"
    error_id: ERR_WEARER_HAS_GARMENTS
    http_status: 409
    applies_to: "POST /wearers/{id}/remove"

  - priority: 9
    category: business_temporal
    check: "A RouteStop's [window_start_min, window_end_min) must not overlap any existing RouteStop window on the SAME route. Half-open semantics: two windows touching at a single endpoint (prior.end == next.start) do NOT conflict; any positive-length intersection does."
    error_id: ERR_STOP_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /routes/{id}/stops"

  - priority: 10
    category: business_temporal
    check: "On a WashStation, the new garment's [slot_start_min, slot_end_min) may be added only if at no instant do MORE THAN WashStation.capacity garment slots overlap on that station (aggregate-capacity semantics: many slots may overlap up to capacity; the (capacity+1)-th overlapping slot is rejected). Distinct interval geometry from priority 9's pairwise rule."
    error_id: ERR_WASH_STATION_FULL
    http_status: 409
    applies_to: "POST /garments/{id}/start-wash"

  - priority: 11
    category: business_temporal
    check: "Within a route, a stop_sequence value must be unique AND consecutive sequence-ordered stops must respect a fixed gap: a later stop's window_start_min must be >= the immediately-prior sequence's window_end_min + SEQUENCE_BUFFER_MIN, where SEQUENCE_BUFFER_MIN = 15 minutes (travel buffer; stronger than mere non-overlap)."
    error_id: ERR_STOP_SEQUENCE_CONFLICT
    http_status: 409
    applies_to: "POST /routes/{id}/stops"

  - priority: 12
    category: business_constraint
    check: "tag_code unique per account on Garment create; locker_label unique among non-REMOVED wearers within an account on Wearer create; route_code/sku/station_code globally unique"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /accounts/{id}/garments, POST /accounts/{id}/wearers, POST /routes, POST /garment-types, POST /wash-stations"

  - priority: 13
    category: business_fiscal
    check: "Reconcile requires expected_service_visit_version to match current ServiceVisit.version (OCC)"
    error_id: ERR_STALE_VISIT_VERSION
    http_status: 412
    applies_to: "POST /service-visits/{id}/reconcile"

  - priority: 14
    category: business_constraint
    check: "Request body fields are well-formed: required fields present, enums in allowed set, integers in declared ranges, window_start_min < window_end_min, slot_start_min < slot_end_min; non-negative actual_soil_count; non-blank emblem_text"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Accounts ----
  - method: POST
    path: "/accounts"
    description: "Create a customer account."
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, service_day, "shortage_grace_units?"]
    output: Account
    side_effects: ["billing_status=CURRENT", "outstanding_cents=0", "active_wearer_count=0"]
  - method: GET
    path: "/accounts/{id}"
    description: "Fetch an account (computed billing fields included)."
    roles: [ProgramAdmin, AccountManager]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: GET
    path: "/accounts"
    description: "List accounts (paginated, filterable by billing_status)."
    roles: [ProgramAdmin, AccountManager]
    code: 200
    input: ["billing_status?", "limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: POST
    path: "/accounts/{id}/place-hold"
    description: "Place a PAST_DUE account ON_HOLD."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["billing_status PAST_DUE->ON_HOLD", "increments Account.version by 1"]
  - method: POST
    path: "/accounts/{id}/release-hold"
    description: "Release an ON_HOLD account back to CURRENT (requires outstanding cleared)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["billing_status ON_HOLD->CURRENT", "increments Account.version by 1"]

  # ---- Wearers ----
  - method: POST
    path: "/accounts/{id}/wearers"
    description: "Add a wearer to an account roster."
    roles: [AccountManager]
    code: 201
    input: [full_name, shirt_size, pant_size, locker_label]
    output: Wearer
    side_effects: ["roster_status=ACTIVE", "recompute Account.active_wearer_count"]
  - method: GET
    path: "/accounts/{id}/wearers"
    description: "List wearers for an account (reverse-reachability for Wearer.account_id)."
    roles: [ProgramAdmin, AccountManager]
    code: 200
    input: ["roster_status?", "limit?", "offset?"]
    output: Wearer[]
    side_effects: []
  - method: GET
    path: "/wearers/{id}"
    description: "Fetch a wearer."
    roles: [ProgramAdmin, AccountManager]
    code: 200
    input: []
    output: Wearer
    side_effects: []
  - method: POST
    path: "/wearers/{id}/ramp-down"
    description: "Ramp a wearer down (freeze new assignments)."
    roles: [AccountManager]
    code: 200
    input: []
    output: Wearer
    side_effects: ["roster_status ACTIVE->RAMP_DOWN", "increments Wearer.version by 1"]
  - method: POST
    path: "/wearers/{id}/reinstate"
    description: "Reinstate a RAMP_DOWN wearer to ACTIVE."
    roles: [AccountManager]
    code: 200
    input: []
    output: Wearer
    side_effects: ["roster_status RAMP_DOWN->ACTIVE", "increments Wearer.version by 1"]
  - method: POST
    path: "/wearers/{id}/remove"
    description: "Remove a RAMP_DOWN wearer with no assigned garments."
    roles: [AccountManager]
    code: 200
    input: []
    output: Wearer
    side_effects: ["roster_status RAMP_DOWN->REMOVED", "recompute Account.active_wearer_count", "increments Wearer.version by 1"]

  # ---- Garment Types (catalog) ----
  - method: POST
    path: "/garment-types"
    description: "Create a catalog garment type."
    roles: [ProgramAdmin]
    code: 201
    input: [sku, category, weekly_rate_cents, replacement_cost_cents, emblem_setup_cents]
    output: GarmentType
    side_effects: []
  - method: GET
    path: "/garment-types/{id}"
    description: "Fetch a garment type."
    roles: [ProgramAdmin, AccountManager, CleanroomTech]
    code: 200
    input: []
    output: GarmentType
    side_effects: []

  # ---- Wash Stations ----
  - method: POST
    path: "/wash-stations"
    description: "Create a plant wash station with a concurrent-slot capacity."
    roles: [ProgramAdmin]
    code: 201
    input: [station_code, capacity]
    output: WashStation
    side_effects: []
  - method: GET
    path: "/wash-stations/{id}"
    description: "Fetch a wash station."
    roles: [ProgramAdmin, CleanroomTech]
    code: 200
    input: []
    output: WashStation
    side_effects: []
  - method: GET
    path: "/wash-stations/{id}/garments"
    description: "List garments currently occupying this station's wash slots (reverse-reachability for Garment.wash_station_id)."
    roles: [ProgramAdmin, CleanroomTech]
    code: 200
    input: ["limit?", "offset?"]
    output: Garment[]
    side_effects: []

  # ---- Garments ----
  - method: POST
    path: "/accounts/{id}/garments"
    description: "Provision a physical garment into an account's pool."
    roles: [ProgramAdmin]
    code: 201
    input: [garment_type_id, tag_code, "emblem_text?"]
    output: Garment
    side_effects: ["lifecycle_status=IN_STOCK", "wash_location=AT_PLANT", "soil_strikes=0"]
  - method: GET
    path: "/accounts/{id}/garments"
    description: "List garments for an account (reverse-reachability for Garment.account_id)."
    roles: [ProgramAdmin, AccountManager, CleanroomTech]
    code: 200
    input: ["lifecycle_status?", "wash_location?", "limit?", "offset?"]
    output: Garment[]
    side_effects: []
  - method: GET
    path: "/garments/{id}"
    description: "Fetch a garment (both dimensions + soil_strikes)."
    roles: [ProgramAdmin, AccountManager, CleanroomTech]
    code: 200
    input: []
    output: Garment
    side_effects: []
  - method: GET
    path: "/garment-types/{id}/garments"
    description: "List garments of a given garment type (reverse-reachability for Garment.garment_type_id)."
    roles: [ProgramAdmin, AccountManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Garment[]
    side_effects: []
  - method: POST
    path: "/garments/{id}/apply-emblem"
    description: "Apply or change an embroidered emblem; first emblem charges setup."
    roles: [ProgramAdmin, AccountManager]
    code: 200
    input: [emblem_text]
    output: Garment
    side_effects: ["set emblem_text", "if first emblem: create EMBLEM_SETUP ServiceCharge via emblem_setup_charge", "increments Garment.version by 1"]
  - method: POST
    path: "/garments/{id}/start-wash"
    description: "Cleanroom: reserve a wash slot at a station and move a soiled garment into wash (wash dimension)."
    roles: [CleanroomTech]
    code: 200
    input: [wash_station_id, slot_start_min, slot_end_min]
    output: Garment
    side_effects: ["wash_location IN_SOIL->IN_WASH", "set wash_station_id + slot window", "increments Garment.version by 1"]
  - method: POST
    path: "/garments/{id}/finish-wash"
    description: "Cleanroom: finish wash, garment returns to plant and releases its slot (wash dimension)."
    roles: [CleanroomTech]
    code: 200
    input: []
    output: Garment
    side_effects: ["wash_location IN_WASH->AT_PLANT", "clear slot fields", "set cycled_through_wash_this_visit=true", "increments Garment.version by 1"]
  - method: POST
    path: "/garments/{id}/retire"
    description: "Retire a garment for damage (ProgramAdmin)."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Garment
    side_effects: ["lifecycle_status->RETIRED", "if linked Assignment ASSIGNED: create DAMAGE ServiceCharge", "increments Garment.version by 1"]

  # ---- Assignments ----
  - method: POST
    path: "/assignments"
    description: "Assign an IN_STOCK garment to an ACTIVE wearer."
    roles: [AccountManager]
    code: 201
    input: [garment_id, wearer_id]
    output: Assignment
    side_effects: ["status=ASSIGNED", "Garment IN_STOCK->ASSIGNED + AT_PLANT->AT_CUSTOMER", "increment Wearer.assigned_garment_count", "copy account_id from garment"]
  - method: GET
    path: "/assignments/{id}"
    description: "Fetch an assignment."
    roles: [ProgramAdmin, AccountManager]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: GET
    path: "/assignments"
    description: "List assignments filtered by garment_id, wearer_id, or account_id (reverse-reachability for all three FKs)."
    roles: [ProgramAdmin, AccountManager]
    code: 200
    input: ["garment_id?", "wearer_id?", "account_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: POST
    path: "/assignments/{id}/return"
    description: "Return a garment (ASSIGNED->RETURNED, garment back IN_STOCK)."
    roles: [AccountManager]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status->RETURNED", "Garment->IN_STOCK", "decrement Wearer.assigned_garment_count", "increments Assignment.version by 1"]
  - method: POST
    path: "/assignments/{id}/declare-loss"
    description: "Declare a garment lost (LOSS fee, garment LOST)."
    roles: [AccountManager]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status->LOST", "Garment->LOST", "create LOSS ServiceCharge", "recompute Account ledger", "decrement Wearer.assigned_garment_count", "increments Assignment.version by 1"]
  - method: POST
    path: "/assignments/{id}/declare-damage"
    description: "Declare a garment damaged (DAMAGE fee, garment RETIRED)."
    roles: [AccountManager]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status->DAMAGED", "Garment->RETIRED", "create DAMAGE ServiceCharge", "recompute Account ledger", "decrement Wearer.assigned_garment_count", "increments Assignment.version by 1"]

  # ---- Routes & Stops ----
  - method: POST
    path: "/routes"
    description: "Create a delivery route."
    roles: [ProgramAdmin]
    code: 201
    input: [route_code, service_day, driver_user_id]
    output: Route
    side_effects: []
  - method: GET
    path: "/routes/{id}"
    description: "Fetch a route."
    roles: [ProgramAdmin, RouteDriver]
    code: 200
    input: []
    output: Route
    side_effects: []
  - method: POST
    path: "/routes/{id}/stops"
    description: "Add a stop (account + delivery window) to a route."
    roles: [ProgramAdmin]
    code: 201
    input: [account_id, stop_sequence, window_start_min, window_end_min]
    output: RouteStop
    side_effects: ["validate window non-overlap and sequence buffer on this route"]
  - method: GET
    path: "/routes/{id}/stops"
    description: "List stops on a route (reverse-reachability for RouteStop.route_id)."
    roles: [ProgramAdmin, RouteDriver]
    code: 200
    input: ["limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: GET
    path: "/route-stops/{id}"
    description: "Fetch a route stop."
    roles: [ProgramAdmin, RouteDriver]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: GET
    path: "/route-stops"
    description: "List route stops filtered by account_id (reverse-reachability for RouteStop.account_id)."
    roles: [ProgramAdmin, RouteDriver, AccountManager]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []

  # ---- Service Visits ----
  - method: POST
    path: "/route-stops/{id}/service-visits"
    description: "Schedule a weekly service visit for a stop."
    roles: [ProgramAdmin, RouteDriver]
    code: 201
    input: [week_index]
    output: ServiceVisit
    side_effects: ["status=SCHEDULED", "copy account_id from route stop"]
  - method: GET
    path: "/service-visits/{id}"
    description: "Fetch a service visit (counts + charges)."
    roles: [ProgramAdmin, RouteDriver, AccountManager]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: []
  - method: GET
    path: "/route-stops/{id}/service-visits"
    description: "List visits for a stop (reverse-reachability for ServiceVisit.route_stop_id)."
    roles: [ProgramAdmin, RouteDriver, AccountManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []
  - method: GET
    path: "/service-visits"
    description: "List service visits filtered by account_id (reverse-reachability for ServiceVisit.account_id)."
    roles: [ProgramAdmin, RouteDriver, AccountManager]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: ServiceVisit[]
    side_effects: []
  - method: POST
    path: "/service-visits/{id}/pickup"
    description: "Driver picks up soiled garments; snapshots expected soil and records actual scan."
    roles: [RouteDriver]
    code: 200
    input: [actual_soil_count]
    output: ServiceVisit
    side_effects: ["status SCHEDULED->PICKED_UP", "snapshot expected_soil_count", "ASSIGNED AT_CUSTOMER garments -> IN_SOIL", "soil_strikes++ on shortfall garments", "increments ServiceVisit.version by 1"]
  - method: POST
    path: "/service-visits/{id}/deliver"
    description: "Driver delivers clean garments; computes provisional charges."
    roles: [RouteDriver]
    code: 200
    input: []
    output: ServiceVisit
    side_effects: ["status PICKED_UP->DELIVERED", "AT_PLANT garments -> AT_CUSTOMER", "compute provisional_charge_cents", "create RENTAL + optional SHORTAGE charges", "recompute Account ledger", "increments ServiceVisit.version by 1"]
  - method: POST
    path: "/service-visits/{id}/reconcile"
    description: "Admin reconciles the visit; finalized charges supersede provisional (OCC-guarded)."
    roles: [ProgramAdmin]
    code: 200
    input: [expected_service_visit_version]
    output: ServiceVisit
    side_effects: ["status DELIVERED->RECONCILED", "compute finalized_charge_cents", "replace provisional charge rows with finalized rows", "recompute Account ledger", "increments ServiceVisit.version by 1"]

  # ---- Service Charges ----
  - method: GET
    path: "/service-visits/{id}/charges"
    description: "List charges for a visit (reverse-reachability for ServiceCharge.service_visit_id)."
    roles: [ProgramAdmin, AccountManager]
    code: 200
    input: ["charge_type?", "limit?", "offset?"]
    output: ServiceCharge[]
    side_effects: []
  - method: GET
    path: "/service-charges/{id}"
    description: "Fetch a single service charge."
    roles: [ProgramAdmin, AccountManager]
    code: 200
    input: []
    output: ServiceCharge
    side_effects: []
  - method: GET
    path: "/service-charges"
    description: "List service charges filtered by account_id (reverse-reachability for ServiceCharge.account_id)."
    roles: [ProgramAdmin, AccountManager]
    code: 200
    input: ["account_id?", "charge_type?", "paid?", "limit?", "offset?"]
    output: ServiceCharge[]
    side_effects: []
  - method: POST
    path: "/service-charges/{id}/settle"
    description: "Mark a charge paid; recomputes account ledger and may clear PAST_DUE."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ServiceCharge
    side_effects: ["paid=true", "recompute Account.outstanding_cents", "billing_status PAST_DUE->CURRENT if cleared", "increments Account.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not a declared role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this endpoint."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path id references a non-existent resource."
  - id: ERR_FK_INTEGRITY
    http: 422
    condition: "A body FK references a non-existent row, or garment and wearer on an assignment belong to different accounts."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_ACCOUNT_ON_HOLD
    http: 409
    condition: "Footprint-growing operation attempted on an ON_HOLD account."
  - id: ERR_WEARER_NOT_ACTIVE
    http: 409
    condition: "Assignment attempted to a RAMP_DOWN or REMOVED wearer."
  - id: ERR_WEARER_HAS_GARMENTS
    http: 409
    condition: "Remove attempted on a wearer with assigned_garment_count > 0."
  - id: ERR_STOP_WINDOW_OVERLAP
    http: 409
    condition: "New RouteStop window overlaps an existing stop window on the same route (half-open)."
  - id: ERR_STOP_SEQUENCE_CONFLICT
    http: 409
    condition: "stop_sequence duplicated, or sequence-ordered windows violate the SEQUENCE_BUFFER_MIN (15 min) gap."
  - id: ERR_WASH_STATION_FULL
    http: 409
    condition: "A start-wash slot would make more than WashStation.capacity garment slots overlap at some instant on the station."
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "Uniqueness violated: tag_code per account, locker_label per account, route_code/sku global."
  - id: ERR_STALE_VISIT_VERSION
    http: 412
    condition: "Reconcile expected_service_visit_version does not match current ServiceVisit.version."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad enum, out-of-range integer, or window_start_min >= window_end_min."
  - id: ERR_SOIL_COUNT_NEGATIVE
    http: 400
    condition: "actual_soil_count provided at pickup is negative."
  - id: ERR_VISIT_GARMENTS_NOT_CLEAN
    http: 409
    condition: "Deliver attempted while one or more of the account's garments are still IN_SOIL or IN_WASH."
  - id: ERR_CHARGE_ALREADY_SETTLED
    http: 409
    condition: "Settle attempted on a ServiceCharge already paid."
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit/offset outside [min,max] bounds."
  - id: ERR_EMBLEM_TEXT_INVALID
    http: 400
    condition: "apply-emblem called with empty/blank emblem_text."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Operator who manages catalog, routes, billing overrides, and reconciliation."
    identity: opaque
    exclusive_operations:
      - "POST /accounts"
      - "POST /accounts/{id}/place-hold"
      - "POST /accounts/{id}/release-hold"
      - "POST /garment-types"
      - "POST /accounts/{id}/garments"
      - "POST /garments/{id}/retire"
      - "POST /routes"
      - "POST /routes/{id}/stops"
      - "POST /service-visits/{id}/reconcile"
      - "POST /service-charges/{id}/settle"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /garments/{id}/apply-emblem"
      - "POST /route-stops/{id}/service-visits"

  - name: AccountManager
    description: "Customer-facing manager of the wearer roster and garment assignments."
    identity: opaque
    exclusive_operations:
      - "POST /accounts/{id}/wearers"
      - "POST /wearers/{id}/ramp-down"
      - "POST /wearers/{id}/reinstate"
      - "POST /wearers/{id}/remove"
      - "POST /assignments"
      - "POST /assignments/{id}/return"
      - "POST /assignments/{id}/declare-loss"
      - "POST /assignments/{id}/declare-damage"
    shared_operations:
      - "GET (account/wearer/garment/assignment/charge read endpoints)"
      - "POST /garments/{id}/apply-emblem"

  - name: RouteDriver
    description: "Field driver who runs pickup and delivery for a route."
    identity: opaque
    exclusive_operations:
      - "POST /service-visits/{id}/pickup"
      - "POST /service-visits/{id}/deliver"
    shared_operations:
      - "GET (route/stop/visit read endpoints)"
      - "POST /route-stops/{id}/service-visits"

  - name: CleanroomTech
    description: "Plant technician who advances garments through the wash cycle."
    identity: opaque
    exclusive_operations:
      - "POST /garments/{id}/start-wash"
      - "POST /garments/{id}/finish-wash"
    shared_operations:
      - "GET /garments/{id}"
      - "GET /accounts/{id}/garments"
      - "GET /garment-types/{id}"
