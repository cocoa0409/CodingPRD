        distinguishing_aspect: "A plan admits claims while remaining_repair_rounds > 0 and rejects the next one when it is exactly 0, so the boundary sits at zero rather than negative."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. A shipped instrument with an ACTIVE 24-month plan and an open service center."
          setup_api_calls:
            - *c_clock
            - *c_eng
            - *c_cust
            - *c_asg
            - *c_accept
            - *c_center
            - *c_guitar
            - *c_quote
            - *c_lgtr
            - *c_submit
            - *c_reserve
            - *c_unit
            - *c_setup
            - *c_csetup
            - *c_inspect
            - *c_ship
            - call: "POST /warranty-plans"
              payload: { customer_id: "${cust_a_id}", instrument_unit_id: "${unit_a_id}" }
              as: SalesEngineerOps
              captures: { plan_id: $.data.id }
            - call: "POST /warranty-plans/${plan_id}/activate"
              payload: { starts_on: "2026-09-10T00:00:00Z" }
