            - { call: "POST /disposition/analyses/${an}/decide", payload: { decision: APPROVE }, as: InvestmentCommittee, as_user_id: ic-1, captures: { rec: $.data.recommendation } }
            - { call: "POST /disposition/assets/${g_id}/list", as: DispositionManager, as_user_id: dm-1, captures: { err2: $.data.error_id } }
          assert:
            - "first list: err1 == ERR_ANALYSIS_NOT_APPROVED"
            - "analysis recommendation == HOLD (sell_net 1,900,000,000 == 95% of hold 2,000,000,000, inclusive)"
            - "second list: err2 == ERR_HOLD_RECOMMENDED"

