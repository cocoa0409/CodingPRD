  - section: validations
    instances:
      - name: priority_auth_beats_existence_unauthenticated
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=4]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing auth headers on a request with a non-existent path id returns 401 ERR_UNAUTHENTICATED, never 404 — priority 1 beats priority 4."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /audit/engagements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and HTTP status 401 (auth checked before existence)"

      - name: priority_existence_beats_state
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=7]", "errors[ERR_WORKPAPER_NOT_FOUND]"]
        distinguishing_aspect: "Sign-off on a non-existent workpaper id returns 404 ERR_WORKPAPER_NOT_FOUND; state preconditions are never evaluated against a missing resource."
        test_recipe:
          setup: ["Manager auditor exists"]
          setup_api_calls:
            - { call: "POST /audit/auditors", payload: { full_name: "Mary Mgr", grade: "MANAGER" }, as: AuditAdmin, captures: { mgr1: "$.data.id" } }
          trigger:
            - { call: "POST /audit/workpapers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/sign-off", payload: {}, as: AuditManager, as_user_id: "${mgr1}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_WORKPAPER_NOT_FOUND and HTTP status 404"

