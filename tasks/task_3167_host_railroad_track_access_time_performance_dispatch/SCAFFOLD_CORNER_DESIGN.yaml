            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_tt1
            - *k_tt1_prop
            - *k_tt1_rev
          trigger:
            - call: "POST /rail/operating-agreements/${oa_id}/amend"
              payload: { expected_operating_agreement_version: "${oa_v}", penalty_rate_cents_per_minute: 75 }
              as: PassengerOperator
              captures: { oa_v2: $.data.version, oa_seq: $.data.amendment_seq }
          assert:
            - "${oa_v2} == ${oa_v} + 1 and ${oa_seq} == 1"
            - "OperatingAgreement.${oa_id}.penalty_rate_cents_per_minute == 75"
            - "Timetable.${tt1_id}.status == DRAFT (cascaded)"

  # ===========================================================================
  - section: errors
    instances:

      - name: funding_period_overlap_rejected_on_second_commit
        claim_type: Violation -> Error
        grounds:
          - validations[priority=16]
          - errors[ERR_FUNDING_PERIOD_OVERLAP]
        distinguishing_aspect: "A second COMMITTED funding agreement for the same corridor+state whose period overlaps the first is rejected 409 ERR_FUNDING_PERIOD_OVERLAP; a non-overlapping December period commits fine."
        test_recipe:
          setup: ["Corridor with segments; one COMMITTED IL agreement for September."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - call: "POST /rail/funding-agreements"
              payload: { corridor_id: "${corr_id}", state_code: "IL", period_start: "2026-09-01", period_end: "2026-09-30" }
              as: StateSponsor
              captures: { fa1: $.data.id }
            - call: "POST /rail/funding-agreements/${fa1}/commit"
              payload: {}
              as: StateSponsor
            - call: "POST /rail/funding-agreements"
              payload: { corridor_id: "${corr_id}", state_code: "IL", period_start: "2026-09-15", period_end: "2026-10-15" }
              as: StateSponsor
              captures: { fa2: $.data.id }
            - call: "POST /rail/funding-agreements"
              payload: { corridor_id: "${corr_id}", state_code: "IL", period_start: "2026-12-01", period_end: "2026-12-31" }
              as: StateSponsor
              captures: { fa3: $.data.id }
          trigger:
            - call: "POST /rail/funding-agreements/${fa2}/commit"
              payload: {}
              as: StateSponsor
              captures: { err: $.data.error_id }
            - call: "POST /rail/funding-agreements/${fa3}/commit"
              payload: {}
              as: StateSponsor
          assert:
            - "overlapping commit: status 409 and ${err} == ERR_FUNDING_PERIOD_OVERLAP"
            - "non-overlapping commit: status 200 and FundingAgreement.${fa3}.status == COMMITTED"
            - "FundingAgreement.${fa3}.allocated_cost_cents == 212329 (period_cost = round_half_up(10000000 x 31/365) = 849315; IL line = round_half_up(849315 x 10.0/40.0) = round_half_up(212328.75) = 212329)"

