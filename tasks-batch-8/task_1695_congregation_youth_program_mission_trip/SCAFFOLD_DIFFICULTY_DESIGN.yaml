  - rule_id: boundary_precision_check
    instances:
      - name: chaperone_ratio_exact_equality_passes
        grounds:
          - calculations.chaperone_requirement
          - state_machines.Trip.REGISTRATION_CLOSED_to_ROSTER_LOCKED
          - errors[ERR_CHAPERONE_RATIO_UNMET]
        distinguishing_aspect: |
          Metric = headcount ratio, endpoint = lock-roster: with 1 CONFIRMED youth
          and ratio 1, required == 1; 0 cleared chaperones fails with
          ERR_CHAPERONE_RATIO_UNMET while exactly 1 (cleared == required, >= not >)
          passes — the equality arm is the boundary under test.
        test_recipe:
          setup:
            - "Trip Delta: chaperone_ratio 1, capacity 10, IN_STATE (no insurance/protocol gates), 1 CONFIRMED registration (deposit 50000 paid), 1 lodging room 2 beds cost 0; registration closed; NO chaperone assignments yet"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 0, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Delta", destination_name: "Local", destination_type: "IN_STATE", start_date: "2027-06-15", end_date: "2027-06-16", capacity_youth: 10, base_cost_cents: 80000, deposit_cents: 50000, chaperone_ratio: 1, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/lodging-reservations", payload: {site_name: "host", room_code: "R1", check_in_date: "2027-06-15", check_out_date: "2027-06-16", room_capacity: 2, cost_cents: 0}, as: TripLeader }
            - { call: "POST /youth-ministry/trips/${trip_id}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-1", first_name: "P", last_name: "One", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {p1: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p1}", insurance_tier: "NONE", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg1: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cf1a: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G", signed_at: "2026-08-02T10:01:00Z", medical_notes: "none"}, as: Guardian, as_user_id: "guardian-1", captures: {cf1b: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cf1c: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cf1a}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cf1b}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cf1c}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/submit", as: Guardian, as_user_id: "guardian-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/payments", payload: {amount_cents: 50000, method: "CASH"}, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /youth-ministry/registrations/${reg1}/confirm", as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/trips/${trip_id}/close-registration", as: ProgramDirector }
            # failing arm: 0 cleared chaperones
            - { call: "POST /youth-ministry/trips/${trip_id}/lock-roster", as: ProgramDirector, as_user_id: "director-1", captures: {lock_err: $.data.error_id} }
            # add exactly one cleared chaperone
            - { call: "POST /youth-ministry/chaperones", payload: {program_id: "${prog_id}", first_name: "Ada", last_name: "One", email: "a1@x.org", phone: "555-1"}, as: ProgramDirector, captures: {chap: $.data.id} }
            - { call: "POST /youth-ministry/chaperones/${chap}/background-checks", payload: {}, as: ProgramDirector, captures: {bc: $.data.id} }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "SCREENING"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/background-checks/${bc}/advance", payload: {to_status: "CLEARED"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/chaperone-assignments", payload: {trip_id: "${trip_id}", chaperone_id: "${chap}", role: "LEAD"}, as: ProgramDirector, captures: {asg: $.data.id} }
            - { call: "POST /youth-ministry/chaperone-assignments/${asg}/respond", payload: {decision: "ACCEPT"}, as: Chaperone, as_user_id: "${chap}" }
          trigger:
            - { call: "GET /youth-ministry/trips/${trip_id}", as: ProgramDirector, captures: {req: $.data.required_cleared_chaperones, cleared: $.data.cleared_chaperone_count, compliant: $.data.ratio_compliant} }
            - { call: "POST /youth-ministry/trips/${trip_id}/lock-roster", as: ProgramDirector, as_user_id: "director-1", captures: {lock_status: $.data.status} }
          assert:
            - "lock_err == ERR_CHAPERONE_RATIO_UNMET (cleared 0 < required 1)"
            - "req == 1 and cleared == 1 and compliant == true — exact equality passes (>= boundary, not >)"
            - "lock_status == ROSTER_LOCKED"

