            - *clinic
            - *pharmacy
            - *clinic_ep
            - *ph_newrx
            - *ph_cert_start
            - *ph_test_conn
            - *ph_test_newrx
            - *ph_certify
            - *cl_cert_start
            - *cl_test_conn
            - *cl_test_newrx
            - *cl_certify
            - *patient_a
            - call: "POST /network/prescriptions"
              payload: { prescriber_id: "${cl_id}", receiving_pharmacy_id: "${ph_id}", patient_id: "${pa_id}", drug_ndc: "00093314905", transaction_type: "NEW_RX", controlled_schedule: "SCHEDULE_III", message_standard: "NCPDP_SCRIPT_2017071", days_supply: 30, quantity: 60, refills_authorized: 0 }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { rx_ctrl_id: $.data.id }
            - call: "POST /network/prescriptions"
              payload: { prescriber_id: "${cl_id}", receiving_pharmacy_id: "${ph_id}", patient_id: "${pa_id}", drug_ndc: "00093314906", transaction_type: "NEW_RX", controlled_schedule: "NON_CONTROLLED", message_standard: "NCPDP_SCRIPT_2017071", days_supply: 30, quantity: 30, refills_authorized: 6 }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { rx_plain_id: $.data.id }
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_ctrl_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss_ctrl_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss_ctrl_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss_ctrl_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { otp_ctrl: $.data.otp_challenge_code }
            - call: "POST /network/signing-sessions/${ss_ctrl_id}/verify-otp"
              payload: { otp_code: "${otp_ctrl}" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions"
              payload: { prescription_id: "${rx_plain_id}" }
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { ss_plain_id: $.data.id }
            - call: "POST /network/signing-sessions/${ss_plain_id}/identity-proof"
              payload: { outcome: "PASSED" }
              as: Prescriber
              as_user_id: "${cl_id}"
            - call: "POST /network/signing-sessions/${ss_plain_id}/request-otp"
              payload: {}
              as: Prescriber
              as_user_id: "${cl_id}"
              captures: { otp_plain: $.data.otp_challenge_code }
            - call: "POST /network/signing-sessions/${ss_plain_id}/verify-otp"
              payload: { otp_code: "${otp_plain}" }
