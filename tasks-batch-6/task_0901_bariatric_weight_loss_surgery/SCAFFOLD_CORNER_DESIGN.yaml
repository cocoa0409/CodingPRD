  - section: calculations
    instances:
      - name: ewl_variants_divergence_stub
        claim_type: Variant Divergence
        grounds: [calculations.weight_loss_outcome]
        excluded_because:
          difficulty_instance: dual_variant_calc / weight_loss_outcome_ewl_ibw_vs_bmi25
          rationale: "The %EWL IBW-vs-BMI25 divergence is asserted directly by the named §1.8 instance."

      - name: case_bundle_variant_selection_stub
        claim_type: Variant Selection
        grounds: [calculations.case_bundle_price]
        excluded_because:
          difficulty_instance: dual_variant_calc / case_bundle_estimate_vs_final
          rationale: "Estimate-at-scheduling vs final-at-completion selection is asserted by the named §1.8 instance."

  - section: state_machines
    instances:
      - name: followup_series_generation_cascade_stub
        claim_type: Side Effect Execution
        grounds: [state_machines.Program.SURGERY_SCHEDULED_to_POST_OP]
        excluded_because:
          difficulty_instance: transitive_cascade / surgery_complete_generates_followup_series_cascade
          rationale: "The 5-visit follow-up series generation on surgery completion is asserted by the named §1.8 cascade instance."

  - section: validations
    instances:
      - name: program_not_cleared_on_schedule_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROGRAM_NOT_CLEARED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / schedule_depends_on_program_cleared
          rationale: "ERR_PROGRAM_NOT_CLEARED is asserted as the failure path of the named §1.8 instance (also in schedule_program_not_cleared_beats_room_conflict)."

      - name: clearances_incomplete_on_finalize_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLEARANCES_INCOMPLETE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / finalize_clearance_depends_on_psych_cleared
          rationale: "ERR_CLEARANCES_INCOMPLETE is asserted by the named §1.8 instance (and by supervised_diet_exact_month_count_boundary)."

      - name: not_self_pay_on_financing_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_SELF_PAY]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / financing_not_self_pay_beats_down_payment_exceeds
          rationale: "ERR_NOT_SELF_PAY is the winning error asserted by the named §1.8 priority instance."

      - name: or_room_conflict_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_OR_ROOM_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / or_room_turnover_buffer_conflict
          rationale: "ERR_OR_ROOM_CONFLICT is asserted by the named §1.8 overlap instance."

      - name: surgeon_conflict_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_SURGEON_CONFLICT]"]
        excluded_because:
