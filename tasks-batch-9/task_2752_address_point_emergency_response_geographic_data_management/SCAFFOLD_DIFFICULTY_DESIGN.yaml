              as: AgencyLiaison
              as_user_id: "${fire_id}"
          assert:
            - "the LAW activate returns status_code 409 with error_id \"ERR_AGENCY_NOT_ACTIVE\"   # NOT ERR_BOUNDARY_INVALID_STATE"
            - "EmergencyServiceBoundary.${b_law_id}.status == \"PROPOSED\""
