            - "FacultyRoster.${roster_cw_id}.adequacy_ratio_snapshot == 0.3000 and FacultyRoster.${roster_cw_id}.generation_epoch == 1"

  # ===========================================================================
  # RULE 3 — non_linear_state_machine  (2 instances, different entities/shapes)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_walks_qualified_flagged_remediation_flagged_qualified_cycle
        grounds:
          - state_machines.CourseAssignment.VERIFIED_QUALIFIED_to_EXCEPTION_FLAGGED
          - state_machines.CourseAssignment.EXCEPTION_FLAGGED_to_REMEDIATION_IN_PROGRESS
          - state_machines.CourseAssignment.REMEDIATION_IN_PROGRESS_to_EXCEPTION_FLAGGED
          - state_machines.CourseAssignment.REMEDIATION_IN_PROGRESS_to_VERIFIED_QUALIFIED
          - state_machines.CredentialRecord.VERIFIED_to_REPUDIATED
          - state_machines.FacultyMember.DEFICIENT_to_UNDER_REVIEW
          - calculations.faculty_dossier_recompute
        distinguishing_aspect: |
          CourseAssignment.status is a true cycle: it returns to VERIFIED_QUALIFIED after
          leaving it, and on the way it takes the REMEDIATION_IN_PROGRESS -> EXCEPTION_FLAGGED
          back-edge, so the same state is entered twice by two different triggers
          (record repudiation, then a failing reverification) — no monotone ordering of the
          states can reproduce the trajectory.
        test_recipe:
          setup:
            - "Morgan Ellis is VERIFIED on a domestic Journalism MASTERS and additionally holds a VERIFIED, OFFICIAL_RECEIVED NON_DEGREE_GRADUATE Public Relations record (6 hours) that carries no weight under the DEGREE_FIELD policy."
            - "Morgan is INSTRUCTOR_OF_RECORD on a 3-credit LOWER_DIVISION Journalism section in the DEGREE_FIELD program, VERIFIED_QUALIFIED with qualification_basis TERMINAL_DEGREE."
            - "No FacultyRoster exists for that (program, term) pair, so nothing re-decides the assignment behind the test's back."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - &c_rec_m_sac
              call: "POST /credential-records"
              payload: { faculty_member_id: "${fac_m_id}", degree_level: NON_DEGREE_GRADUATE, discipline_id: "${pr_id}", conferring_institution: "Northern Extension", is_foreign_institution: false, graduate_credit_hours_in_discipline: 6 }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { rec_m_sac_id: $.data.id }
            - &c_tr_m_sac
              call: "POST /credential-records/${rec_m_sac_id}/transcript"
              payload: { transcript_status: OFFICIAL_RECEIVED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
            - &c_vf_m_sac
              call: "POST /credential-records/${rec_m_sac_id}/verification"
              payload: { decision: VERIFY }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - *c_sec_df
            - &c_asn_m_df
              call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_m_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_cycle_id: $.data.id }
          trigger:
            - call: "POST /credential-records/${rec_m_sac_id}/verification"
              payload: { decision: REPUDIATE, note: "Extension coursework was mis-filed" }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - call: "POST /course-assignments/${asn_cycle_id}/remediation"
              payload: { remediation_action: CREDENTIAL_UPDATE_PENDING }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
            - call: "POST /credential-records"
              payload: { faculty_member_id: "${fac_m_id}", degree_level: NON_DEGREE_GRADUATE, discipline_id: "${pr_id}", conferring_institution: "Northern Extension", is_foreign_institution: false, graduate_credit_hours_in_discipline: 6 }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { rec_m_repl_id: $.data.id }
            - call: "POST /course-assignments/${asn_cycle_id}/reverification"
              payload: {}
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - call: "POST /credential-records/${rec_m_repl_id}/transcript"
              payload: { transcript_status: OFFICIAL_RECEIVED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
            - call: "POST /credential-records/${rec_m_repl_id}/verification"
              payload: { decision: VERIFY }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - call: "POST /course-assignments/${asn_cycle_id}/remediation"
              payload: { remediation_action: CREDENTIAL_UPDATE_PENDING }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
            - call: "POST /course-assignments/${asn_cycle_id}/reverification"
              payload: {}
              as: CredentialAnalyst
              as_user_id: "analyst-01"
          assert:
            - "After trigger 1: CredentialRecord.${rec_m_sac_id}.verification_status == REPUDIATED, FacultyMember.${fac_m_id}.dossier_status == DEFICIENT with deficiency_codes == [CREDENTIAL_REPUDIATED], CourseAssignment.${asn_cycle_id}.status == EXCEPTION_FLAGGED and exception_code == DOSSIER_DEFICIENT"
            - "After trigger 2: CourseAssignment.${asn_cycle_id}.status == REMEDIATION_IN_PROGRESS and remediation_action == CREDENTIAL_UPDATE_PENDING"
            - "After trigger 3: FacultyMember.${fac_m_id}.dossier_status == UNDER_REVIEW — the later-created record with the same (NON_DEGREE_GRADUATE, Public Relations) pair clears CREDENTIAL_REPUDIATED, but the replacement is still PENDING"
            - "After trigger 4: CourseAssignment.${asn_cycle_id}.status == EXCEPTION_FLAGGED again with exception_code == DOSSIER_DEFICIENT — this is the REMEDIATION_IN_PROGRESS -> EXCEPTION_FLAGGED back-edge, reached because credential_pass is true but the dossier is not VERIFIED"
            - "After trigger 6: FacultyMember.${fac_m_id}.dossier_status == VERIFIED and deficiency_codes == []"
            - "After trigger 8: CourseAssignment.${asn_cycle_id}.status == VERIFIED_QUALIFIED, qualification_basis == TERMINAL_DEGREE, exception_code == null, remediation_action == null"
            - "CourseAssignment.${asn_cycle_id}.alignment_score == 1.0000 at every step — the Journalism MASTERS was never touched"
            - "FacultyMember.${fac_m_id}.appointment_status == CREDENTIALED_ELIGIBLE throughout — the dossier dimension moved four times while the appointment dimension never moved"
            - "FacultyMember.${fac_m_id}.assigned_credit_hours == 3 at every step"

      - name: faculty_dossier_and_appointment_dimensions_move_independently
        grounds:
          - state_machines.FacultyMember.VERIFIED_to_DEFICIENT
          - state_machines.FacultyMember.CREDENTIALED_ELIGIBLE_to_CONTRACTED
          - entities.FacultyMember.fields.dossier_status
          - entities.FacultyMember.fields.appointment_status
          - entities.FacultyContract.fields.dossier_snapshot_status
          - concurrency_rules[contract-issue-stale-faculty]
        distinguishing_aspect: |
          FacultyMember carries two independent state dimensions on one row: repudiating a
          credential drives dossier_status VERIFIED -> DEFICIENT while appointment_status
          stays CONTRACTED and the already-issued contract keeps its pinned
          dossier_snapshot_status VERIFIED — a parallel shape, not the single-dimension cycle
          of the previous instance.
        test_recipe:
          setup:
            - "Morgan Ellis (FULL_TIME, home program = the COURSEWORK_18 program) is VERIFIED / CREDENTIALED_ELIGIBLE on a domestic Journalism MASTERS and also holds a VERIFIED, OFFICIAL_RECEIVED Public Relations NON_DEGREE_GRADUATE record."
            - "The clock is at 2026-08-01, strictly before Term 2026FA start_date 2026-09-15, so the contract window is open."
            - "The home-program dean issues a 9-credit-hour FULL_TIME contract guarded by the faculty member's freshly read version, and Morgan countersigns it, so appointment_status == CONTRACTED and the contract pins dossier_snapshot_status VERIFIED."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_rec_m_sac
            - *c_tr_m_sac
            - *c_vf_m_sac
            - &c_fac_m_read
              call: "GET /faculty-members/${fac_m_id}"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { fac_m_v: $.data.version }
            - &c_contract_m
              call: "POST /faculty-contracts"
              payload: { faculty_member_id: "${fac_m_id}", term_id: "${term_id}", employment_class: FULL_TIME, contract_credit_hours: 9, expected_faculty_version: "${fac_m_v}" }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { contract_m_id: $.data.id }
            - &c_contract_m_sign
              call: "POST /faculty-contracts/${contract_m_id}/countersignature"
              payload: {}
              as: Instructor
              as_user_id: "${fac_m_id}"
          trigger:
            - call: "POST /credential-records/${rec_m_sac_id}/verification"
              payload: { decision: REPUDIATE, note: "Institution withdrew the certificate" }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
          assert:
            - "FacultyMember.${fac_m_id}.dossier_status == DEFICIENT and deficiency_codes == [CREDENTIAL_REPUDIATED]"
            - "FacultyMember.${fac_m_id}.appointment_status == CONTRACTED — unchanged by the dossier transition"
            - "FacultyContract.${contract_m_id}.status == COUNTERSIGNED"
            - "FacultyContract.${contract_m_id}.dossier_snapshot_status == VERIFIED — the snapshot taken at issuance is NOT rewritten when the live dossier degrades"
            - "FacultyMember.${fac_m_id}.highest_verified_degree_level == MASTERS — the repudiated record was NON_DEGREE_GRADUATE, so the degree ceiling is untouched"
            - "FacultyMember.${fac_m_id}.version incremented on the repudiation cascade, so the captured ${fac_m_v} would now be stale for any further OCC-guarded write"

  # ===========================================================================
  # RULE 4 — transitive_cascade  (2 instances: depth 5 and depth 3, different
  #          trigger endpoints)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_a_repudiation_five_hops_to_accreditor_review_bounce_back
        grounds:
          - state_machines.CredentialRecord.VERIFIED_to_REPUDIATED
          - state_machines.FacultyMember.VERIFIED_to_DEFICIENT
          - state_machines.CourseAssignment.VERIFIED_QUALIFIED_to_EXCEPTION_FLAGGED
          - state_machines.AccreditorReview.RESPONSE_SUBMITTED_to_REMEDIATION_REQUIRED
          - calculations.roster_snapshot_recompute
          - calculations.program_faculty_adequacy
          - calculations.accreditor_review_risk_index
        distinguishing_aspect: |
          Trigger = POST /credential-records/{id}/verification with decision REPUDIATE, and the
          chain is FIVE hops deep: CredentialRecord -> FacultyMember.dossier_status ->
          CourseAssignment -> FacultyRoster snapshot -> Program adequacy -> AccreditorReview
          bounced from RESPONSE_SUBMITTED back to REMEDIATION_REQUIRED with recomputed risk.
        test_recipe:
          setup:
            - "The DEGREE_FIELD program (HEADCOUNT, min_terminal_ratio 0.60) in the OPEN 2026FA term."
            - "Morgan Ellis is VERIFIED on a Journalism MASTERS plus a disposable VERIFIED Public Relations NON_DEGREE_GRADUATE record, and is VERIFIED_QUALIFIED / TERMINAL_DEGREE on one 3-credit Journalism section."
            - "The program's roster has been generated: 1 assignment, flagged 0, adequacy_ratio_snapshot 1.0000, certification_readiness READY."
            - "A COMPREHENSIVE review with window 2026-07-25..2026-08-10 is IN_PROGRESS; issuing 2 narrative findings with no unqualified assignments moved it to REMEDIATION_REQUIRED with preliminary_risk_index 0.00, risk_tier LOW and response_due_date 2026-10-30, and the liaison's response moved it to RESPONSE_SUBMITTED with response_round 1."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_rec_m_sac
            - *c_tr_m_sac
            - *c_vf_m_sac
            - *c_sec_df
            - *c_asn_m_df
            - &c_roster_df
              call: "POST /faculty-rosters"
              payload: { program_id: "${prog_df_id}", term_id: "${term_id}" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
              captures: { roster_df_id: $.data.id }
            - &c_roster_df_gen
              call: "POST /faculty-rosters/${roster_df_id}/generate"
              payload: {}
              as: AccreditationLiaison
              as_user_id: "liaison-01"
            - &c_review_df
              call: "POST /accreditor-reviews"
              payload: { program_id: "${prog_df_id}", review_type: COMPREHENSIVE, window_start_date: "2026-07-25", window_end_date: "2026-08-10" }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
              captures: { review_df_id: $.data.id }
            - &c_review_df_start
              call: "POST /accreditor-reviews/${review_df_id}/status"
              payload: { to_status: IN_PROGRESS }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
            - call: "POST /accreditor-reviews/${review_df_id}/findings"
              payload: { finding_count: 2, narrative: "Syllabus documentation gaps; no unqualified assignments identified" }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
            - call: "POST /accreditor-reviews/${review_df_id}/response"
              payload: { response_narrative: "Syllabi refreshed and archived" }
              as: AccreditationLiaison
              as_user_id: "liaison-01"
          trigger:
            - call: "POST /credential-records/${rec_m_sac_id}/verification"
              payload: { decision: REPUDIATE, note: "Issuing body revoked the certificate" }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
          assert:
            - "HOP 1 — CredentialRecord.${rec_m_sac_id}.verification_status == REPUDIATED"
            - "HOP 2 — FacultyMember.${fac_m_id}.dossier_status == DEFICIENT, deficiency_codes == [CREDENTIAL_REPUDIATED], appointment_status still CREDENTIALED_ELIGIBLE"
            - "HOP 3 — CourseAssignment.${asn_cycle_id}.status == EXCEPTION_FLAGGED with exception_code == DOSSIER_DEFICIENT and qualification_basis == NONE"
            - "HOP 3 — FacultyRoster.${roster_df_id}.flagged_exception_count == 1, terminal_qualified_headcount == 0, adequacy_ratio_snapshot == 0.0000, blocking_reason_codes == [EXCEPTIONS_OUTSTANDING, ADEQUACY_BELOW_MINIMUM, DOSSIER_DEFICIENT], certification_readiness == BLOCKED, generation_epoch still == 1"
            - "HOP 4 — Program.${prog_df_id}.adequacy_ratio == 0.0000, adequacy_status == INSUFFICIENT, unqualified_assignment_count == 1"
            - "HOP 5 — AccreditorReview.${review_df_id}.status == REMEDIATION_REQUIRED (bounced back out of RESPONSE_SUBMITTED)"
            - "HOP 5 — AccreditorReview.${review_df_id}.preliminary_risk_index == 80.00 == 100 * (0.40*1 + 0.25*1 + 0.20*0 + 0.15*1), risk_tier == HIGH, risk_index == 100.00 == 80.00 * 1.25"
            - "HOP 5 — AccreditorReview.${review_df_id}.response_due_date == 2026-08-31 == clock date 2026-08-01 + 30 days (HIGH), replacing the earlier 2026-10-30"
            - "HOP 5 — AccreditorReview.${review_df_id}.response_round == 1, unchanged by the cascade"
            - "The review's risk fields before the trigger were preliminary_risk_index 0.00 / risk_tier LOW / risk_index 0.00 / response_due_date 2026-10-30"

      - name: cascade_b_tested_experience_approval_three_hops_without_adequacy_relief
        grounds:
          - state_machines.TestedExperienceJustification.UNDER_REVIEW_to_APPROVED
          - state_machines.CourseAssignment.REMEDIATION_IN_PROGRESS_to_VERIFIED_QUALIFIED
          - calculations.tested_experience_score
          - calculations.roster_snapshot_recompute
          - calculations.program_faculty_adequacy
          - entities.CourseAssignment.fields.qualification_basis
          - validations[priority=13]
        distinguishing_aspect: |
          Trigger = POST /tested-experience-justifications/{id}/decision with decision APPROVE
          (a different endpoint and a different first hop from CASCADE-A) and the chain is
          exactly THREE hops: justification -> assignment -> roster snapshot + Program
          adequacy, where the roster's exception count drops to 0 but adequacy_ratio_snapshot
          stays 0.0000 because TESTED_EXPERIENCE is not a terminal-degree basis.
        test_recipe:
          setup:
            - "The DEGREE_FIELD program (HEADCOUNT, min_terminal_ratio 0.60) in the OPEN 2026FA term."
            - "Alex Stone holds exactly one credential: a VERIFIED, OFFICIAL_RECEIVED Public Relations MASTERS, so dossier_status is VERIFIED and appointment_status is CREDENTIALED_ELIGIBLE."
            - "Alex is assigned to a 3-credit LOWER_DIVISION Journalism section: Public Relations is a sibling of Journalism (0.6500 < 0.70) so the assignment is EXCEPTION_FLAGGED / DISCIPLINE_MISALIGNED."
            - "The roster has been generated (1 assignment, flagged 1, adequacy_ratio_snapshot 0.0000, BLOCKED) and the dean has moved the assignment to REMEDIATION_IN_PROGRESS with remediation_action TESTED_EXPERIENCE_PENDING."
            - "A justification with 6 documented years, ADVANCED certification and 3 alternative credential codes scores 0.7500 and sits in UNDER_REVIEW; the deciding analyst (analyst-02) is NOT the analyst who verified Alex's credential (analyst-01)."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_x
            - *c_rec_x_pr
            - *c_tr_x_pr
            - *c_vf_x_pr
            - *c_sec_df
            - &c_asn_x_df
              call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_x_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_te_id: $.data.id }
            - *c_roster_df
            - *c_roster_df_gen
            - call: "POST /course-assignments/${asn_te_id}/remediation"
              payload: { remediation_action: TESTED_EXPERIENCE_PENDING, note: "Documenting 6 years of newsroom practice" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
            - &c_just_x
              call: "POST /tested-experience-justifications"
              payload: { course_assignment_id: "${asn_te_id}", narrative: "Six years as a metro desk editor with three professional credentials", alternative_credential_codes: ["APR", "CPRC", "SMPS"], documented_years_experience: 6, industry_certification_level: ADVANCED, supervisor_attestation_on_file: true }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { just_x_id: $.data.id, just_x_score: $.data.tested_experience_score }
            - call: "POST /tested-experience-justifications/${just_x_id}/status"
              payload: { to_status: SUBMITTED }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
            - call: "POST /tested-experience-justifications/${just_x_id}/review"
              payload: {}
              as: CredentialAnalyst
              as_user_id: "analyst-02"
          trigger:
            - call: "POST /tested-experience-justifications/${just_x_id}/decision"
              payload: { decision: APPROVE, decision_rationale: "Tested experience documented and attested" }
              as: CredentialAnalyst
              as_user_id: "analyst-02"
          assert:
            - "TestedExperienceJustification.${just_x_id}.tested_experience_score == 0.7500 == 0.50*(6/8) + 0.30*0.75 + 0.20*(3/4)"
            - "HOP 1 — TestedExperienceJustification.${just_x_id}.status == APPROVED and decided_by_user_id == analyst-02"
            - "HOP 2 — CourseAssignment.${asn_te_id}.status == VERIFIED_QUALIFIED, qualification_basis == TESTED_EXPERIENCE, exception_code == null, remediation_action == null, alignment_score == 0.6500 (unchanged — the justification does not manufacture discipline alignment)"
            - "HOP 3 — FacultyRoster.${roster_df_id}.flagged_exception_count == 0 and total_assignment_count == 1"
            - "HOP 3 — FacultyRoster.${roster_df_id}.terminal_qualified_headcount == 0 and adequacy_ratio_snapshot == 0.0000 — TESTED_EXPERIENCE is excluded from the terminal numerator, so adequacy does NOT rise"
            - "HOP 3 — FacultyRoster.${roster_df_id}.blocking_reason_codes == [ADEQUACY_BELOW_MINIMUM] and certification_readiness == BLOCKED — EXCEPTIONS_OUTSTANDING cleared but the roster is still not certifiable"
            - "HOP 3 — Program.${prog_df_id}.unqualified_assignment_count == 0 while adequacy_status == INSUFFICIENT"
            - "FacultyRoster.${roster_df_id}.generation_epoch == 1 — cascade recomputes never advance the epoch"

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict  (2 instances, different
  #          error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: term_locked_state_outranks_teaching_block_business_constraint
        grounds:
          - validations[priority=10]
          - validations[priority=24]
          - errors[ERR_TERM_LOCKED]
          - errors[ERR_TEACHING_BLOCK_CONFLICT]
          - state_machines.Term.ROSTER_LOCKED_to_CLOSED
        distinguishing_aspect: |
          PAIR-A pits category `state` (priority 10, ERR_TERM_LOCKED, 409) against category
          `business_constraint` (priority 24, ERR_TEACHING_BLOCK_CONFLICT, 409) on
          POST /course-assignments; the same request returns the block-conflict error while
          the term is OPEN and switches to the term-locked error once the term is CLOSED,
          proving the ladder order rather than a fixed response.
        test_recipe:
          setup:
            - "The DEGREE_FIELD program in Term 2026FA, clock at 2026-08-01."
            - "Dana Reyes is VERIFIED / CREDENTIALED_ELIGIBLE (Public Relations MASTERS + Journalism 18-hour record, both OFFICIAL_RECEIVED)."
            - "Two 3-credit Journalism sections in the same building HALL-A, both meeting on MO: section A 09:00-10:20 (540-620) and section B 10:00-11:20 (600-680) — a 20-minute half-open overlap."
            - "Dana is already assigned to section A while the term is OPEN, and no FacultyRoster exists for the pair, so the term can be walked OPEN -> ROSTER_LOCKED -> CLOSED."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_term
            - *c_term_open
            - *c_fac_d
            - *c_rec_d_pr
            - *c_rec_d_ndg
            - *c_tr_d_pr
            - *c_tr_d_ndg
            - *c_vf_d_pr
            - *c_vf_d_ndg
            - *c_sec_df
            - &c_sec_df_overlap
              call: "POST /course-sections"
              payload: { course_code: "JOUR103", title: "Newsroom Ethics", program_id: "${prog_df_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 3, delivery_mode: IN_PERSON, building_code: "HALL-A", meeting_days: ["MO"], meeting_start_minute: 600, meeting_end_minute: 680 }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_overlap_id: $.data.id, sec_overlap_v: $.data.version }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_d_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_pair_a_id: $.data.id }
          trigger:
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_overlap_id}", faculty_member_id: "${fac_d_id}", assignment_role: CO_INSTRUCTOR, expected_section_version: "${sec_overlap_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { err_block_only: $.data.error_id }
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: ROSTER_LOCKED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
            - call: "POST /terms/${term_id}/status"
              payload: { to_status: CLOSED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_overlap_id}", faculty_member_id: "${fac_d_id}", assignment_role: CO_INSTRUCTOR, expected_section_version: "${sec_overlap_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { err_pair_a: $.data.error_id }
          assert:
            - "Trigger 1 (term OPEN, only priority 24 violated): HTTP 409 with err_block_only == ERR_TEACHING_BLOCK_CONFLICT"
            - "Trigger 4 (term CLOSED, priorities 10 AND 24 both violated): HTTP 409 with err_pair_a == ERR_TERM_LOCKED — the `state` category at priority 10 outranks the `business_constraint` category at priority 24"
            - "GET /course-sections/${sec_overlap_id}/course-assignments returns 0 rows — neither rejected attempt created a row"
            - "CourseAssignment.${asn_pair_a_id}.status is unchanged and FacultyMember.${fac_d_id}.assigned_credit_hours == 0 after the term closes (the CLOSED term drops out of the ledger)"
            - "Term.${term_id}.status == CLOSED — no roster existed for the term, so ERR_ROSTER_NOT_READY never fired"

      - name: accreditor_lockout_safety_outranks_credential_budget_fiscal
        grounds:
          - validations[priority=12]
          - validations[priority=35]
          - errors[ERR_ACCREDITOR_REVIEW_LOCKOUT]
          - errors[ERR_CREDENTIAL_BUDGET_EXCEEDED]
          - calculations.evaluation_fee_cents
          - calculations.program_credential_budget_ledger
        distinguishing_aspect: |
          PAIR-B pits category `business_safety` (priority 12, ERR_ACCREDITOR_REVIEW_LOCKOUT,
          403) against category `business_fiscal` (priority 35,
          ERR_CREDENTIAL_BUDGET_EXCEEDED, 422) on POST /credential-evaluations — a different
          error-category pair, different HTTP statuses and a different endpoint from PAIR-A;
          moving the clock out of the review window peels the safety rule away and exposes the
          fiscal rule underneath.
        test_recipe:
          setup:
            - "A Journalism program with credential_budget_cents 10000 and no evaluations yet, so committed == 0."
            - "Priya Raman (ADJUNCT, home program = that program) holds one FOREIGN MASTERS credential record."
            - "A SUBSTANTIVE_CHANGE review with the fully-closed window 2026-07-25..2026-08-10 is IN_PROGRESS and the clock sits at 2026-08-01, inside the window."
            - "A 24-page EXPEDITED evaluation would cost 22591 cents, which exceeds the 10000-cent budget, so both the lockout and the budget rules are violated by the same request."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - &c_prog_tight
              call: "POST /programs"
              payload: { name: "BS Journalism (Pilot Budget)", discipline_id: "${journ_id}", degree_level: BACHELORS, qualification_policy: DEGREE_FIELD, adequacy_basis: HEADCOUNT, min_terminal_ratio: 0.75, is_substantive_change: true, credential_budget_cents: 10000 }
              as: SystemAdmin
              as_user_id: "admin-01"
              captures: { prog_tight_id: $.data.id }
            - &c_fac_t
              call: "POST /faculty-members"
              payload: { full_name: "Priya Raman", email: "priya.raman@example.edu", employment_class: ADJUNCT, home_program_id: "${prog_tight_id}" }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { fac_t_id: $.data.id }
            - &c_rec_t_for
              call: "POST /credential-records"
              payload: { faculty_member_id: "${fac_t_id}", degree_level: MASTERS, discipline_id: "${journ_id}", conferring_institution: "Universidad Central", is_foreign_institution: true, graduate_credit_hours_in_discipline: 24 }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { rec_t_for_id: $.data.id }
            - &c_review_tight
              call: "POST /accreditor-reviews"
              payload: { program_id: "${prog_tight_id}", review_type: SUBSTANTIVE_CHANGE, window_start_date: "2026-07-25", window_end_date: "2026-08-10" }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
              captures: { review_tight_id: $.data.id }
            - call: "POST /accreditor-reviews/${review_tight_id}/status"
              payload: { to_status: IN_PROGRESS }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
          trigger:
            - call: "POST /credential-evaluations"
              payload: { credential_record_id: "${rec_t_for_id}", billed_program_id: "${prog_tight_id}", evaluator_agency: "WES", page_count: 24, service_level: EXPEDITED }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
              captures: { err_pair_b: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-01"
            - call: "POST /credential-evaluations"
              payload: { credential_record_id: "${rec_t_for_id}", billed_program_id: "${prog_tight_id}", evaluator_agency: "WES", page_count: 24, service_level: EXPEDITED }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
              captures: { err_budget_only: $.data.error_id }
          assert:
            - "Trigger 1 (clock inside the window, priorities 12 AND 35 both violated): HTTP 403 with err_pair_b == ERR_ACCREDITOR_REVIEW_LOCKOUT"
            - "Trigger 3 (clock 2026-08-15, outside the closed window, only priority 35 violated): HTTP 422 with err_budget_only == ERR_CREDENTIAL_BUDGET_EXCEEDED"
            - "Program.${prog_tight_id}.budget_reserved_cents == 0 and budget_spent_cents == 0 — neither rejected order reserved anything"
            - "GET /credential-evaluations?billed_program_id=${prog_tight_id} returns total_count 0"
            - "AccreditorReview.${review_tight_id}.status == IN_PROGRESS throughout"

  # ===========================================================================
  # RULE 6 — boundary_precision_check  (2 instances, different metrics AND
  #          different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: coursework_hours_exactly_at_eighteen_qualifies_seventeen_does_not
        grounds:
          - calculations.assignment_qualification_determination
          - entities.DisciplineTaxonomy.fields.min_graduate_credit_hours
          - entities.CredentialRecord.fields.graduate_credit_hours_in_discipline
          - entities.CourseAssignment.fields.exception_code
          - endpoints[POST /course-assignments]
        distinguishing_aspect: |
          Metric = the summed graduate_credit_hours_in_discipline of discipline-aligned records
          against DisciplineTaxonomy.min_graduate_credit_hours, probed on
          POST /course-assignments: 18 hours passes because the comparison is inclusive
          (>= 18) and 17 hours fails, with both faculty assigned to the SAME section so
          required_rank, discipline and policy are held constant.
        test_recipe:
          setup:
            - "The COURSEWORK_18 program in the OPEN 2026FA term; Journalism has min_graduate_credit_hours 18."
            - "Dana Reyes holds a Journalism NON_DEGREE_GRADUATE record with exactly 18 aligned graduate hours plus a Public Relations MASTERS with 30 hours that does NOT count (sibling alignment 0.6500 < 0.70)."
            - "Sam Okafor holds a single Journalism NON_DEGREE_GRADUATE record with 17 aligned graduate hours, VERIFIED and OFFICIAL_RECEIVED, so dossier_status is VERIFIED."
            - "One 3-credit LOWER_DIVISION Journalism section in the COURSEWORK_18 program takes both of them (Dana as INSTRUCTOR_OF_RECORD, Sam as CO_INSTRUCTOR)."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_d
            - *c_rec_d_pr
            - *c_rec_d_ndg
            - *c_tr_d_pr
            - *c_tr_d_ndg
            - *c_vf_d_pr
            - *c_vf_d_ndg
            - &c_fac_s
              call: "POST /faculty-members"
              payload: { full_name: "Sam Okafor", email: "sam.okafor@example.edu", employment_class: ADJUNCT, home_program_id: "${prog_cw_id}" }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { fac_s_id: $.data.id }
            - &c_rec_s_ndg
              call: "POST /credential-records"
              payload: { faculty_member_id: "${fac_s_id}", degree_level: NON_DEGREE_GRADUATE, discipline_id: "${journ_id}", conferring_institution: "State University", is_foreign_institution: false, graduate_credit_hours_in_discipline: 17 }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { rec_s_ndg_id: $.data.id }
            - call: "POST /credential-records/${rec_s_ndg_id}/transcript"
              payload: { transcript_status: OFFICIAL_RECEIVED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
            - call: "POST /credential-records/${rec_s_ndg_id}/verification"
              payload: { decision: VERIFY }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - *c_sec_cw
          trigger:
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_cw_id}", faculty_member_id: "${fac_d_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_cw_v}" }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { asn_18_id: $.data.id }
            - call: "GET /course-sections/${sec_cw_id}"
              payload: {}
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { sec_cw_v2: $.data.version }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_cw_id}", faculty_member_id: "${fac_s_id}", assignment_role: CO_INSTRUCTOR, expected_section_version: "${sec_cw_v2}" }
              as: ProgramDean
              as_user_id: "${prog_cw_id}"
              captures: { asn_17_id: $.data.id }
          assert:
            - "CourseAssignment.${asn_18_id}.status == VERIFIED_QUALIFIED with qualification_basis == COURSEWORK_18_HOUR — 18 >= 18 is inclusive"
            - "CourseAssignment.${asn_17_id}.status == EXCEPTION_FLAGGED with qualification_basis == NONE and exception_code == DEGREE_LEVEL_INSUFFICIENT — 17 < 18 by one hour"
            - "CourseAssignment.${asn_17_id}.alignment_score == 1.0000 — the failure is the hour count, not the discipline"
            - "CourseAssignment.${asn_18_id}.alignment_score == 1.0000 — Dana's 30-hour Public Relations MASTERS contributes 0 hours to coursework_hours because 0.6500 < 0.70"
            - "${sec_cw_v2} == ${sec_cw_v} + 1 — the first assignment bumped the section version, so the second call had to re-read it"
            - "FacultyMember.${fac_d_id}.assigned_credit_hours == 3 and FacultyMember.${fac_s_id}.assigned_credit_hours == 3"

      - name: tested_experience_score_exactly_at_threshold_approves_one_notch_below_rejects
        grounds:
          - calculations.tested_experience_score
          - validations[priority=32]
          - errors[ERR_TESTED_EXPERIENCE_INSUFFICIENT]
          - state_machines.TestedExperienceJustification.UNDER_REVIEW_to_APPROVED
          - endpoints[POST /tested-experience-justifications/{justificationId}/decision]
        distinguishing_aspect: |
          A different metric (the 0.50/0.30/0.20 weighted tested-experience score) probed on a
          different endpoint (POST /tested-experience-justifications/{id}/decision): 0.7000 is
          exactly APPROVAL_SCORE_THRESHOLD and must approve, while dropping the single
          alternative credential code lands on 0.6500 and must fail with
          ERR_TESTED_EXPERIENCE_INSUFFICIENT.
        test_recipe:
          setup:
            - "Alex Stone holds only a Public Relations MASTERS (VERIFIED, OFFICIAL_RECEIVED) and is CREDENTIALED_ELIGIBLE."
            - "Alex is EXCEPTION_FLAGGED / DISCIPLINE_MISALIGNED on two 3-credit Journalism sections of the DEGREE_FIELD program that meet on different weekdays (MO and TU), and the dean has moved both to REMEDIATION_IN_PROGRESS."
            - "Justification J1 on the first assignment: 8 documented years, PRACTITIONER certification, 1 alternative credential code, attestation on file -> score 0.7000."
            - "Justification J2 on the second assignment: identical except alternative_credential_codes is empty -> score 0.6500."
            - "Both justifications are in UNDER_REVIEW and the deciding analyst analyst-02 never verified Alex's credential, so segregation of duties is satisfied."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_x
            - *c_rec_x_pr
            - *c_tr_x_pr
            - *c_vf_x_pr
            - *c_sec_df
            - &c_sec_df_b
              call: "POST /course-sections"
              payload: { course_code: "JOUR104", title: "Data Journalism", program_id: "${prog_df_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 3, delivery_mode: IN_PERSON, building_code: "HALL-A", meeting_days: ["TU"], meeting_start_minute: 540, meeting_end_minute: 620 }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_df_b_id: $.data.id, sec_df_b_v: $.data.version }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_x_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_t1_id: $.data.id }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_b_id}", faculty_member_id: "${fac_x_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_b_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_t2_id: $.data.id }
            - call: "POST /course-assignments/${asn_t1_id}/remediation"
              payload: { remediation_action: TESTED_EXPERIENCE_PENDING }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
            - call: "POST /course-assignments/${asn_t2_id}/remediation"
              payload: { remediation_action: TESTED_EXPERIENCE_PENDING }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
            - call: "POST /tested-experience-justifications"
              payload: { course_assignment_id: "${asn_t1_id}", narrative: "Eight years on the metro desk with one professional credential", alternative_credential_codes: ["APR"], documented_years_experience: 8, industry_certification_level: PRACTITIONER, supervisor_attestation_on_file: true }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { just_at_id: $.data.id, score_at: $.data.tested_experience_score }
            - call: "POST /tested-experience-justifications"
              payload: { course_assignment_id: "${asn_t2_id}", narrative: "Eight years on the metro desk with no professional credentials", alternative_credential_codes: [], documented_years_experience: 8, industry_certification_level: PRACTITIONER, supervisor_attestation_on_file: true }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { just_below_id: $.data.id, score_below: $.data.tested_experience_score }
            - call: "POST /tested-experience-justifications/${just_at_id}/status"
              payload: { to_status: SUBMITTED }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
            - call: "POST /tested-experience-justifications/${just_below_id}/status"
              payload: { to_status: SUBMITTED }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
            - call: "POST /tested-experience-justifications/${just_at_id}/review"
              payload: {}
              as: CredentialAnalyst
              as_user_id: "analyst-02"
            - call: "POST /tested-experience-justifications/${just_below_id}/review"
              payload: {}
              as: CredentialAnalyst
              as_user_id: "analyst-02"
          trigger:
            - call: "POST /tested-experience-justifications/${just_at_id}/decision"
              payload: { decision: APPROVE, decision_rationale: "Score is exactly at threshold" }
              as: CredentialAnalyst
              as_user_id: "analyst-02"
            - call: "POST /tested-experience-justifications/${just_below_id}/decision"
              payload: { decision: APPROVE, decision_rationale: "Attempting approval one notch below threshold" }
              as: CredentialAnalyst
              as_user_id: "analyst-02"
              captures: { err_score: $.data.error_id }
          assert:
            - "score_at == 0.7000 == 0.50*min(1, 8/8) + 0.30*0.50 + 0.20*min(1, 1/4)"
            - "score_below == 0.6500 == 0.50*1 + 0.30*0.50 + 0.20*0"
            - "Trigger 1: TestedExperienceJustification.${just_at_id}.status == APPROVED — 0.7000 >= 0.70 is inclusive"
            - "Trigger 1: CourseAssignment.${asn_t1_id}.status == VERIFIED_QUALIFIED with qualification_basis == TESTED_EXPERIENCE"
            - "Trigger 2: HTTP 422 with err_score == ERR_TESTED_EXPERIENCE_INSUFFICIENT"
            - "Trigger 2: TestedExperienceJustification.${just_below_id}.status == UNDER_REVIEW (unchanged) and decided_by_user_id == null"
            - "Trigger 2: CourseAssignment.${asn_t2_id}.status == REMEDIATION_IN_PROGRESS (unchanged)"
            - "The 0.0500 gap comes only from codes_factor: both justifications share documented_years_experience 8 and PRACTITIONER certification"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency  (2 instances, different entity
  #          pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_creation_gated_on_faculty_appointment_status
        grounds:
          - validations[priority=15]
          - errors[ERR_FACULTY_NOT_APPOINTABLE]
          - state_machines.FacultyMember.PROSPECT_to_CREDENTIALED_ELIGIBLE
          - state_machines.CredentialRecord.PENDING_to_VERIFIED
          - entities.FacultyMember.fields.appointment_status
        distinguishing_aspect: |
          Entity pair (CourseAssignment, FacultyMember): the writable entity is
          CourseAssignment and the gating state lives on FacultyMember.appointment_status —
          the identical POST /course-assignments request is rejected while the faculty member
          is PROSPECT and accepted once a credential verification flips them to
          CREDENTIALED_ELIGIBLE, with nothing else in the request changing.
        test_recipe:
          setup:
            - "The DEGREE_FIELD program in the OPEN 2026FA term with one 3-credit LOWER_DIVISION Journalism section."
            - "Noor Haddad has a domestic Journalism MASTERS record with transcript OFFICIAL_RECEIVED but verification_status still PENDING, so dossier_status is UNDER_REVIEW and appointment_status is PROSPECT."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_prog_df
            - *c_term
            - *c_term_open
            - &c_fac_n
              call: "POST /faculty-members"
              payload: { full_name: "Noor Haddad", email: "noor.haddad@example.edu", employment_class: CLINICAL, home_program_id: "${prog_df_id}" }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { fac_n_id: $.data.id }
            - &c_rec_n_journ
              call: "POST /credential-records"
              payload: { faculty_member_id: "${fac_n_id}", degree_level: MASTERS, discipline_id: "${journ_id}", conferring_institution: "Northern University", is_foreign_institution: false, graduate_credit_hours_in_discipline: 36 }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
              captures: { rec_n_journ_id: $.data.id }
            - call: "POST /credential-records/${rec_n_journ_id}/transcript"
              payload: { transcript_status: OFFICIAL_RECEIVED }
              as: RegistrarOfficer
              as_user_id: "registrar-01"
            - *c_sec_df
          trigger:
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_n_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { err_appointable: $.data.error_id }
            - call: "POST /credential-records/${rec_n_journ_id}/verification"
              payload: { decision: VERIFY }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_n_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_gate_id: $.data.id }
          assert:
            - "Trigger 1: HTTP 409 with err_appointable == ERR_FACULTY_NOT_APPOINTABLE while FacultyMember.${fac_n_id}.appointment_status == PROSPECT"
            - "Trigger 1 created nothing: GET /course-sections/${sec_df_id}/course-assignments returns 0 rows and CourseSection.${sec_df_id}.version is still ${sec_df_v}"
            - "Trigger 2: FacultyMember.${fac_n_id}.dossier_status == VERIFIED and appointment_status == CREDENTIALED_ELIGIBLE"
            - "Trigger 3: HTTP 201 with CourseAssignment.${asn_gate_id}.status == VERIFIED_QUALIFIED and qualification_basis == TERMINAL_DEGREE — the same expected_section_version ${sec_df_v} is still current because the rejected call never bumped it"
            - "FacultyMember.${fac_n_id}.assigned_credit_hours == 3 (CLINICAL cap is 12, so the load rule was never in play)"

      - name: review_closure_gated_on_program_adequacy_posture
        grounds:
          - validations[priority=34]
          - errors[ERR_PROGRAM_ADEQUACY_INSUFFICIENT]
          - state_machines.AccreditorReview.FINDINGS_ISSUED_to_CLOSED_ACCEPTED
          - state_machines.CourseAssignment.EXCEPTION_FLAGGED_to_WITHDRAWN
          - entities.Program.fields.unqualified_assignment_count
          - calculations.program_faculty_adequacy
        distinguishing_aspect: |
          Entity pair (AccreditorReview, Program): the writable entity is AccreditorReview and
          the gate reads Program.adequacy_status plus Program.unqualified_assignment_count — a
          different pair from instance 1, and the gate is opened by mutating a THIRD entity
          (withdrawing a CourseAssignment) rather than by touching either side of the pair.
        test_recipe:
          setup:
            - "The DEGREE_FIELD program (HEADCOUNT, min_terminal_ratio 0.60) in the OPEN 2026FA term."
            - "Morgan Ellis is VERIFIED_QUALIFIED / TERMINAL_DEGREE on a 3-credit Journalism section; Alex Stone (Public Relations MASTERS only) is EXCEPTION_FLAGGED / DISCIPLINE_MISALIGNED on a second 3-credit Journalism section that meets on a different weekday."
            - "The roster has been generated: adequacy_ratio_snapshot 0.5000 (1 of 2 distinct faculty terminal-qualified) -> AT_RISK, unqualified_assignment_count 1."
            - "A COMPREHENSIVE review with window 2026-07-25..2026-08-10 is IN_PROGRESS and issuing 0 findings has moved it to FINDINGS_ISSUED."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_fac_x
            - *c_rec_x_pr
            - *c_tr_x_pr
            - *c_vf_x_pr
            - *c_sec_df
            - *c_sec_df_b
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_m_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_ok_id: $.data.id }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_b_id}", faculty_member_id: "${fac_x_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_b_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_bad_id: $.data.id }
            - *c_roster_df
            - *c_roster_df_gen
            - *c_review_df
            - *c_review_df_start
            - call: "POST /accreditor-reviews/${review_df_id}/findings"
              payload: { finding_count: 0, narrative: "No findings recorded at the exit interview" }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
          trigger:
            - call: "POST /accreditor-reviews/${review_df_id}/status"
              payload: { to_status: CLOSED_ACCEPTED }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
              captures: { err_adequacy: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-01"
            - call: "POST /course-assignments/${asn_bad_id}/withdrawal"
              payload: { reason: "Reassigned to a qualified instructor of record" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
            - call: "POST /accreditor-reviews/${review_df_id}/status"
              payload: { to_status: CLOSED_ACCEPTED }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
          assert:
            - "Before trigger 1: Program.${prog_df_id}.adequacy_ratio == 0.5000, adequacy_status == AT_RISK, unqualified_assignment_count == 1"
            - "Trigger 1: HTTP 409 with err_adequacy == ERR_PROGRAM_ADEQUACY_INSUFFICIENT and AccreditorReview.${review_df_id}.status still FINDINGS_ISSUED"
            - "Trigger 2 is required because FINDINGS_ISSUED inside the closed window 2026-07-25..2026-08-10 raises ERR_ACCREDITOR_REVIEW_LOCKOUT on withdrawal; at 2026-08-15 the window no longer contains the clock date"
            - "Trigger 3: CourseAssignment.${asn_bad_id}.status == WITHDRAWN, FacultyMember.${fac_x_id}.assigned_credit_hours == 0, FacultyRoster.${roster_df_id}.total_assignment_count == 1, flagged_exception_count == 0, adequacy_ratio_snapshot == 1.0000, certification_readiness == READY"
            - "Trigger 3: Program.${prog_df_id}.adequacy_ratio == 1.0000, adequacy_status == ADEQUATE, unqualified_assignment_count == 0"
            - "Trigger 4: HTTP 200 with AccreditorReview.${review_df_id}.status == CLOSED_ACCEPTED"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap  (2 instances, different interval
  #          semantics AND different resource entities)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: teaching_blocks_half_open_with_cross_building_travel_buffer
        grounds:
          - validations[priority=24]
          - errors[ERR_TEACHING_BLOCK_CONFLICT]
          - entities.CourseSection.fields.meeting_start_minute
          - entities.CourseSection.fields.meeting_end_minute
          - entities.CourseSection.fields.building_code
          - entities.CourseSection.fields.delivery_mode
        distinguishing_aspect: |
          Resource = a FacultyMember's teaching time, and the intervals are HALF-OPEN
          [start, end) with a 15-minute travel buffer that applies only when building_code
          differs: back-to-back 09:00-10:20 then 10:20-11:40 in HALL-A is legal, the same
          slot in HALL-B is a conflict, and an ONLINE_ASYNC section overlapping exactly is
          exempt.
        test_recipe:
          setup:
            - "The DEGREE_FIELD program in the OPEN 2026FA term; Dana Reyes (ADJUNCT, 9-credit cap) is VERIFIED / CREDENTIALED_ELIGIBLE."
            - "Four Monday sections of 3 credit hours each: S1 540-620 HALL-A, S2 620-700 HALL-A, S3 620-700 HALL-B, S4 620-700 ONLINE_ASYNC with building_code ONLINE."
            - "Dana is already assigned to S1."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_term
            - *c_term_open
            - *c_fac_d
            - *c_rec_d_pr
            - *c_rec_d_ndg
            - *c_tr_d_pr
            - *c_tr_d_ndg
            - *c_vf_d_pr
            - *c_vf_d_ndg
            - *c_sec_df
            - call: "POST /course-sections"
              payload: { course_code: "JOUR105", title: "Broadcast Writing", program_id: "${prog_df_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 3, delivery_mode: IN_PERSON, building_code: "HALL-A", meeting_days: ["MO"], meeting_start_minute: 620, meeting_end_minute: 700 }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_adj_same_id: $.data.id, sec_adj_same_v: $.data.version }
            - call: "POST /course-sections"
              payload: { course_code: "JOUR106", title: "Photojournalism", program_id: "${prog_df_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 3, delivery_mode: IN_PERSON, building_code: "HALL-B", meeting_days: ["MO"], meeting_start_minute: 620, meeting_end_minute: 700 }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_adj_other_id: $.data.id, sec_adj_other_v: $.data.version }
            - call: "POST /course-sections"
              payload: { course_code: "JOUR107", title: "Media Law Online", program_id: "${prog_df_id}", term_id: "${term_id}", discipline_id: "${journ_id}", course_level: LOWER_DIVISION, credit_hours: 3, delivery_mode: ONLINE_ASYNC, building_code: "ONLINE", meeting_days: ["MO"], meeting_start_minute: 620, meeting_end_minute: 700 }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_online_id: $.data.id, sec_online_v: $.data.version }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_d_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_s1_id: $.data.id }
          trigger:
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_adj_same_id}", faculty_member_id: "${fac_d_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_adj_same_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_s2_id: $.data.id }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_adj_other_id}", faculty_member_id: "${fac_d_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_adj_other_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { err_buffer: $.data.error_id }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_online_id}", faculty_member_id: "${fac_d_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_online_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_s4_id: $.data.id }
          assert:
            - "Trigger 1: HTTP 201 — S1 ends at minute 620 and S2 starts at minute 620 in the SAME building, and half-open intervals with buffer 0 do not touch"
            - "Trigger 2: HTTP 409 with err_buffer == ERR_TEACHING_BLOCK_CONFLICT — HALL-B differs from HALL-A so buffer 15 applies and 620 < 620 + 15"
            - "Trigger 3: HTTP 201 with CourseAssignment.${asn_s4_id}.status == EXCEPTION_FLAGGED — the ONLINE_ASYNC section overlaps S2 exactly (620-700) yet is exempt from the block rule; its exception_code == DEGREE_LEVEL_INSUFFICIENT comes from the DEGREE_FIELD policy, not from scheduling"
            - "FacultyMember.${fac_d_id}.assigned_credit_hours == 9 after trigger 3 — exactly at the ADJUNCT cap MAX_TERM_CREDIT_HOURS 9, so ERR_TERM_LOAD_EXCEEDED never fired"
            - "GET /course-sections/${sec_adj_other_id}/course-assignments returns 0 rows"

      - name: accreditor_review_windows_fully_closed_touching_dates_collide
        grounds:
          - validations[priority=25]
          - errors[ERR_REVIEW_WINDOW_OVERLAP]
          - entities.AccreditorReview.fields.window_start_date
          - entities.AccreditorReview.fields.window_end_date
          - endpoints[POST /accreditor-reviews]
        distinguishing_aspect: |
          Resource = a Program's accreditation review calendar (a different resource entity
          from faculty teaching time) and the intervals are FULLY CLOSED
          [window_start_date, window_end_date], the opposite convention: a window starting on
          the exact end date of an existing review COLLIDES, while starting one day later is
          accepted.
        test_recipe:
          setup:
            - "The DEGREE_FIELD program exists and the clock is at 2026-08-01."
            - "One SCHEDULED COMPREHENSIVE review holds the window 2026-07-01..2026-07-31 (status SCHEDULED is non-terminal, so it participates in the overlap check)."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_prog_df
            - call: "POST /accreditor-reviews"
              payload: { program_id: "${prog_df_id}", review_type: COMPREHENSIVE, window_start_date: "2026-07-01", window_end_date: "2026-07-31" }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
              captures: { review_july_id: $.data.id }
          trigger:
            - call: "POST /accreditor-reviews"
              payload: { program_id: "${prog_df_id}", review_type: FOCUSED_FOLLOWUP, window_start_date: "2026-07-31", window_end_date: "2026-08-10" }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
              captures: { err_window: $.data.error_id }
            - call: "POST /accreditor-reviews"
              payload: { program_id: "${prog_df_id}", review_type: FOCUSED_FOLLOWUP, window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
              as: AccreditorReviewer
              as_user_id: "reviewer-01"
              captures: { review_aug_id: $.data.id }
          assert:
            - "Trigger 1: HTTP 409 with err_window == ERR_REVIEW_WINDOW_OVERLAP — 2026-07-31 <= 2026-07-31 and 2026-07-01 <= 2026-08-10, so windows touching at a single date collide"
            - "Trigger 2: HTTP 201 with AccreditorReview.${review_aug_id}.status == SCHEDULED, response_round == 0, finding_count == 0, risk_index == 0.00"
            - "GET /accreditor-reviews?program_id=${prog_df_id} returns total_count 2 — the rejected window created nothing"
            - "AccreditorReview.${review_july_id}.window_end_date == 2026-07-31 is unchanged"

  # ===========================================================================
  # RULE 9 — compensating_invariant  (2 instances, different conserved
  #          quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: assigned_credit_hours_ledger_conserved_across_supersession_and_withdrawal
        grounds:
          - calculations.faculty_assigned_credit_hours_ledger
          - entities.FacultyMember.fields.assigned_credit_hours
          - entities.CourseSection.fields.instructor_of_record_id
          - entities.CourseAssignment.fields.superseded_by_assignment_id
          - state_machines.CourseAssignment.EXCEPTION_FLAGGED_to_SUPERSEDED
          - state_machines.CourseAssignment.VERIFIED_QUALIFIED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = teaching credit hours (FacultyMember.assigned_credit_hours):
          replacing the instructor of record must move exactly 3.0 credit hours from the
          superseded faculty member to the new one with no drift, and withdrawing the survivor
          must return the ledger to its pre-assignment value of 0.
        test_recipe:
          setup:
            - "The DEGREE_FIELD program in the OPEN 2026FA term with one 3-credit LOWER_DIVISION Journalism section."
            - "Dana Reyes and Morgan Ellis are both VERIFIED / CREDENTIALED_ELIGIBLE, each with assigned_credit_hours 0."
            - "The section's instructor_of_record_id is null and no roster exists."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_pr
            - *c_prog_df
            - *c_prog_cw
            - *c_term
            - *c_term_open
            - *c_fac_d
            - *c_rec_d_pr
            - *c_rec_d_ndg
            - *c_tr_d_pr
            - *c_tr_d_ndg
            - *c_vf_d_pr
            - *c_vf_d_ndg
            - *c_fac_m
            - *c_rec_m_journ
            - *c_tr_m_journ
            - *c_vf_m_journ
            - *c_sec_df
          trigger:
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_d_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_first_id: $.data.id }
            - call: "GET /course-sections/${sec_df_id}"
              payload: {}
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { sec_df_v2: $.data.version }
            - call: "POST /course-assignments"
              payload: { course_section_id: "${sec_df_id}", faculty_member_id: "${fac_m_id}", assignment_role: INSTRUCTOR_OF_RECORD, expected_section_version: "${sec_df_v2}" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
              captures: { asn_second_id: $.data.id }
            - call: "POST /course-assignments/${asn_second_id}/withdrawal"
              payload: { reason: "Section cancelled" }
              as: ProgramDean
              as_user_id: "${prog_df_id}"
          assert:
            - "After trigger 1: FacultyMember.${fac_d_id}.assigned_credit_hours == 3, CourseSection.${sec_df_id}.instructor_of_record_id == ${fac_d_id}, CourseAssignment.${asn_first_id}.status == EXCEPTION_FLAGGED and Program.${prog_df_id}.unqualified_assignment_count == 1 — the credit-hour ledger charges flagged assignments exactly like qualified ones"
            - "After trigger 3: CourseAssignment.${asn_first_id}.status == SUPERSEDED with superseded_by_assignment_id == ${asn_second_id}"
            - "After trigger 3: FacultyMember.${fac_d_id}.assigned_credit_hours == 0 and FacultyMember.${fac_m_id}.assigned_credit_hours == 3 — the 3.0 credit hours moved with no drift, the sum over both faculty is still 3"
            - "After trigger 3: CourseSection.${sec_df_id}.instructor_of_record_id == ${fac_m_id}, CourseAssignment.${asn_second_id}.status == VERIFIED_QUALIFIED (Morgan's Journalism MASTERS aligns at 1.0000) and Program.${prog_df_id}.unqualified_assignment_count == 0 — Dana's flagged row left the exception set on supersession"
            - "After trigger 4: CourseAssignment.${asn_second_id}.status == WITHDRAWN, FacultyMember.${fac_m_id}.assigned_credit_hours == 0, CourseSection.${sec_df_id}.instructor_of_record_id == null"
            - "After trigger 4: FacultyMember.${fac_d_id}.assigned_credit_hours == 0 — the superseded row stays SUPERSEDED and is never resurrected by the withdrawal"
            - "CourseAssignment.${asn_first_id}.status == SUPERSEDED is terminal: the ledger sum over both faculty is 0, exactly its value before trigger 1"

      - name: credential_budget_ledger_conserved_across_void_and_completion
        grounds:
          - calculations.program_credential_budget_ledger
          - calculations.evaluation_cost_allocation
          - entities.Program.fields.budget_reserved_cents
          - entities.Program.fields.budget_spent_cents
          - state_machines.CredentialEvaluation.ORDERED_to_VOIDED
          - state_machines.CredentialEvaluation.IN_REVIEW_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity = money (Program.budget_reserved_cents and budget_spent_cents):
          voiding an order returns budget_reserved_cents to exactly its prior value 0 while
          leaving budget_spent_cents at 0, and completion moves the full 22591 cents from
          reserved to spent with the allocation shares summing to fee_cents exactly — a
          different conserved quantity from instance 1's credit-hour ledger.
        test_recipe:
          setup:
            - "The DEGREE_FIELD program has credential_budget_cents 500000, budget_reserved_cents 0 and budget_spent_cents 0."
            - "Dana Reyes holds one FOREIGN MASTERS credential record and has NO course assignments at all, so the allocation weight set is empty and the whole fee falls to the billed program."
            - "The clock is at 2026-08-01 and no AccreditorReview exists, so no lockout applies."
          setup_api_calls:
            - *c_clock
            - *c_comm
            - *c_journ
            - *c_prog_df
            - *c_fac_d
            - *c_rec_d_for
          trigger:
            - call: "POST /credential-evaluations"
              payload: { credential_record_id: "${rec_d_for_id}", billed_program_id: "${prog_df_id}", evaluator_agency: "WES", page_count: 24, service_level: EXPEDITED }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
              captures: { ev_void_id: $.data.id }
            - call: "POST /credential-evaluations/${ev_void_id}/status"
              payload: { to_status: VOIDED }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - call: "POST /credential-evaluations"
              payload: { credential_record_id: "${rec_d_for_id}", billed_program_id: "${prog_df_id}", evaluator_agency: "WES", page_count: 24, service_level: EXPEDITED }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
              captures: { ev_done_id: $.data.id }
            - call: "POST /credential-evaluations/${ev_done_id}/status"
              payload: { to_status: IN_REVIEW }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
            - call: "POST /credential-evaluations/${ev_done_id}/status"
              payload: { to_status: COMPLETED, equivalency_degree_level: MASTERS, equivalency_discipline_id: "${journ_id}", equivalency_verdict: EQUIVALENT }
              as: CredentialAnalyst
              as_user_id: "analyst-01"
          assert:
            - "After trigger 1: CredentialEvaluation.${ev_void_id}.fee_cents == 22591 and Program.${prog_df_id}.budget_reserved_cents == 22591, budget_spent_cents == 0"
            - "After trigger 2: CredentialEvaluation.${ev_void_id}.status == VOIDED, Program.${prog_df_id}.budget_reserved_cents == 0 (exactly its prior value) and budget_spent_cents == 0 — the void compensates the reservation and nothing else"
            - "After trigger 3: Program.${prog_df_id}.budget_reserved_cents == 22591 again — the void left no residue that would inflate the second order"
            - "After trigger 4: CredentialEvaluation.${ev_done_id}.status == IN_REVIEW and Program.${prog_df_id}.budget_reserved_cents == 22591 (IN_REVIEW still counts as reserved)"
            - "After trigger 5: Program.${prog_df_id}.budget_reserved_cents == 0 and budget_spent_cents == 22591 — the full fee moved from reserved to spent"
            - "After trigger 5: CredentialEvaluation.${ev_done_id}.allocation_shares == [{ program_id: ${prog_df_id}, weight_credit_hours: 0, share_cents: 22591 }] and sum(share_cents) == fee_cents == 22591"
            - "CredentialEvaluation.${ev_void_id}.fee_cents == 22591 is frozen after the void — a voided order never contributes to budget_spent_cents"
