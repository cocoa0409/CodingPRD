        grounds:
          - validations.priority_11
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: |
          Seven distinct uniqueness constraints share one error id, and two of them are
          COMPOSITE: VineyardBlock is unique on (grower_id, block_code) so the same block_code
          under a different producer is legal, and ContractBlockAllocation is unique on
          (contract_id, block_id) so the same block may be allocated to two different
          contracts. An implementation that makes block_code globally unique passes the
          naive probe and fails the second half of this one.
