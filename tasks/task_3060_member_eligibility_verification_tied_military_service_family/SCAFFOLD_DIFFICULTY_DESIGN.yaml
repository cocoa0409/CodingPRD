            - call: "POST /membership/members/${ms2}/deployment-orders"
              payload: { orders_number: "ORD-600", theater: "CENTCOM", start_date: "2026-09-01", end_date: "2026-12-01", scra_eligible: false, expected_member_version: "${ms2_v}" }
              as: VerificationOfficer
