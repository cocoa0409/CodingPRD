              as_user_id: "worker-1"
              captures: { inv_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${inv_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/safety-screenings/${inv_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { inv_err_id: $.data.error_id }
          assert:
            - "the request returns HTTP 409 with error_id ERR_SCREENING_INVALID_TRANSITION"
            - "SafetyScreening.${inv_scr_id}.status == CLEARED"
            - "Youth.${inv_youth_id}.risk_posture == OPEN"

      - name: screening_cleared_to_escalated_and_back_is_a_real_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.SafetyScreening.CLEARED_to_ESCALATED
          - state_machines.SafetyScreening.ESCALATED_to_CLEARED
          - calculations.youth_risk_posture
        distinguishing_aspect: "The same screening row travels CLEARED -> ESCALATED -> CLEARED, driving Youth.risk_posture to FROZEN and back to OPEN, which proves the machine is cyclic rather than one-way and that FROZEN is derived from the latest disposition, not latched."
        test_recipe:
          setup:
            - "one youth whose only SafetyScreening is already CLEARED, so risk_posture is OPEN"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Lior", legal_last_name: "Mbeki", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { cyc_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${cyc_youth_id}/safety-screenings"
              payload: { indicator_codes: ["CURFEW_ENFORCED"] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { cyc_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${cyc_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/safety-screenings/${cyc_scr_id}/disposition"
              payload: { disposition: "ESCALATED", specialized_response_code: "ADVOCATE_ASSIGNED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/safety-screenings/${cyc_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-2"
          assert:
            - "the ESCALATED disposition returns HTTP 200 and SafetyScreening.${cyc_scr_id}.status == ESCALATED"
            - "immediately after the ESCALATED disposition Youth.${cyc_youth_id}.risk_posture == FROZEN"
            - "SafetyScreening.${cyc_scr_id}.specialized_response_code == ADVOCATE_ASSIGNED"
            - "the re-CLEARED disposition returns HTTP 200 and SafetyScreening.${cyc_scr_id}.status == CLEARED"
            - "after the re-CLEARED disposition Youth.${cyc_youth_id}.risk_posture == OPEN"
            - "SafetyScreening.${cyc_scr_id}.score == 10"
            - "SafetyScreening.${cyc_scr_id}.tier == LOW"

      - name: mediation_session_outcome_cannot_be_recorded_twice
        claim_type: idempotency
        grounds:
          - validations[priority=15]
          - errors.ERR_SESSION_ALREADY_RECORDED
          - state_machines.ReunificationCase.MEDIATION_SCHEDULED_to_MEDIATION_HELD
        distinguishing_aspect: "Recording an outcome is once-only: the replay returns 409 ERR_SESSION_ALREADY_RECORDED, the stored outcome PROGRESS is not overwritten by IMPASSE, and case.mediation_round stays 1 instead of advancing to 2."
        test_recipe:
          setup:
            - "youth Bex Alvarez with a CLEARED screening and an OPENED ReunificationCase (opened with expected_youth_version equal to the youth's current version)"
            - "a MediationSession scheduled for [2026-08-03T14:00:00Z, 2026-08-03T16:00:00Z] whose outcome was recorded PROGRESS at clock 2026-08-03T14:30:00Z"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Bex", legal_last_name: "Alvarez", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { sess_youth_id: $.data.id, sess_youth_v1: $.data.version }
            - call: "POST /ryhs/reunification-cases"
              payload: { youth_id: "${sess_youth_id}", guardian_household_label: "Alvarez household", expected_youth_version: "${sess_youth_v1}" }
              as: ReunificationSpecialist
              as_user_id: "spec-1"
              captures: { sess_case_id: $.data.id }
            - call: "POST /ryhs/reunification-cases/${sess_case_id}/mediation-sessions"
              payload: { scheduled_start_at: "2026-08-03T14:00:00Z", scheduled_end_at: "2026-08-03T16:00:00Z" }
              as: ReunificationSpecialist
              as_user_id: "spec-1"
              captures: { sess_session_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/mediation-sessions/${sess_session_id}/record-outcome"
              payload: { outcome: "PROGRESS" }
              as: ReunificationSpecialist
              as_user_id: "spec-1"
          trigger:
            - call: "POST /ryhs/mediation-sessions/${sess_session_id}/record-outcome"
              payload: { outcome: "IMPASSE" }
              as: ReunificationSpecialist
              as_user_id: "spec-1"
              captures: { sess_err_id: $.data.error_id }
          assert:
            - "the request returns HTTP 409 with error_id ERR_SESSION_ALREADY_RECORDED"
            - "MediationSession.${sess_session_id}.outcome == PROGRESS"
            - "MediationSession.${sess_session_id}.held_at == 2026-08-03T14:30:00Z"
            - "MediationSession.${sess_session_id}.round_number == 1"
            - "ReunificationCase.${sess_case_id}.status == MEDIATION_HELD"
            - "ReunificationCase.${sess_case_id}.mediation_round == 1"

      - name: exited_placement_rejects_a_second_exit
        claim_type: terminal_state_lockdown
        grounds:
          - validations[priority=16]
          - errors.ERR_PLACEMENT_ALREADY_EXITED
          - state_machines.TlpPlacement.terminal_states
        distinguishing_aspect: "EXITED is terminal on the tenancy dimension: the second exit returns 409 ERR_PLACEMENT_ALREADY_EXITED, the TLP program's bed is released exactly once (occupied_beds 0, not -1), and exited_at keeps its original stamp."
        test_recipe:
          setup:
            - "an EMERGENCY_SHELTER program plus a TRANSITIONAL_LIVING program, and youth Petra Osei (dob 2010-03-15, age 16) taken to Youth.status SHELTERED with risk_posture OPEN via a CLEARED screening, an ACTIVE admission and a GuardianNotification attempted by PHONE then resolved CONTACTED - the only reachable path to SHELTERED -> TLP_ENROLLED"
            - "a TlpPlacement in tenancy_status PLACED, exited once with exit_reason INDEPENDENT_HOUSING at the default clock"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
