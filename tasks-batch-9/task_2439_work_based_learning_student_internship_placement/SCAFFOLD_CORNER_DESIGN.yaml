      - name: coordinator_cannot_issue_a_permit_even_when_the_permit_id_is_unknown
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=6]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Two rules are violated at once — the role is not on the endpoint's roles list (priority 2)
          and the path-parameter permit does not exist (priority 6). The ladder must return 403
          ERR_UNAUTHORIZED, never 404 ERR_PERMIT_NOT_FOUND, so authorisation cannot be probed for
          resource existence.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T08:00:00Z and no WorkPermit rows"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: WblCoordinator
          trigger:
            - call: "POST /wbl/work-permits/44444444-3333-4222-8111-000000000000/issue"
              payload: { expires_on: "2027-06-30" }
              as: WblCoordinator
          assert:
            - "response status == 403"
            - "response error.code == ERR_UNAUTHORIZED"
