            - "line for farm ${f_id}: dozens_aa == 3, dozens_a == 10, dozens_b == 17"

  - rule_id: non_linear_state_machine
    instances:
      - name: farm_probation_cycle_and_parallel_cert_dimension
        grounds:
          - state_machines.Farm
          - calculations.certification_status_derivation
        distinguishing_aspect: |
          Farm is non-linear twice over: a cyclic ACTIVE -> PROBATION -> ACTIVE loop that is
          traversed TWICE in this recipe, and a parallel certification_status dimension that
          stays CERTIFIED while operational status flips to PROBATION (a FAILED audit moves
          only the operational axis).
        test_recipe:
          setup:
            - "ACTIVE farm F, CERTIFIED via INITIAL audit passed 2026-09-03T09:00:00Z, ACTIVE contract"
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Willow Creek Farm", region: "AR", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a1_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a1_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "ANNUAL", scheduled_for: "2026-10-05T00:00:00Z" }
              as: NetworkManager
              captures: { a2_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a2_id}/complete"
              payload: { outcome: "FAILED", findings: [{ severity: "MAJOR", description: "torn perimeter fencing" }] }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/audits/${a2_id}/corrective-actions"
              as: NetworkManager
              captures: { ca1_id: "$.data[0].id" }
            - call: "POST /farm-network/corrective-actions/${ca1_id}/submit"
              payload: { evidence_notes: "fencing replaced, photos attached" }
              as: NetworkManager
            - call: "POST /farm-network/corrective-actions/${ca1_id}/verify"
              payload: { decision: "VERIFY_CLOSED" }
              as: Auditor
              as_user_id: "auditor-b"
            - call: "POST /farm-network/farms/${f_id}/reinstate"
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "FOR_CAUSE", scheduled_for: "2026-11-10T00:00:00Z" }
              as: NetworkManager
              captures: { a3_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a3_id}/complete"
              payload: { outcome: "FAILED", findings: [{ severity: "MAJOR", description: "fencing damaged again" }] }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/audits/${a3_id}/corrective-actions"
              as: NetworkManager
              captures: { ca2_id: "$.data[0].id" }
            - call: "POST /farm-network/corrective-actions/${ca2_id}/submit"
              payload: { evidence_notes: "upgraded to woven wire" }
              as: NetworkManager
            - call: "POST /farm-network/corrective-actions/${ca2_id}/verify"
              payload: { decision: "VERIFY_CLOSED" }
              as: Auditor
              as_user_id: "auditor-b"
          trigger:
            - call: "POST /farm-network/farms/${f_id}/reinstate"
              as: NetworkManager
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
          assert:
            - "after first FAILED audit: farm.status == PROBATION while farm.certification_status == CERTIFIED (parallel dimensions independent)"
            - "after second FAILED audit: farm.status == PROBATION again (cycle traversed twice)"
            - "after final reinstate: farm.status == ACTIVE"
            - "farm.certification_status == CERTIFIED throughout (last pass 2026-09-03 within 365 days of 2026-11-10)"

      - name: egg_lot_branching_hold_release_vs_reject
        grounds:
          - state_machines.EggLot
        distinguishing_aspect: |
          EggLot is a branching fork: from ON_HOLD, RELEASE leads to a packable RELEASED state
          (salvage grade B, remaining preserved) while REJECT leads to terminal REJECTED with
          destroyed_dozens := remaining_dozens — divergent side-effect sets per branch, on a
          different entity than the Farm machine.
        test_recipe:
          setup:
            - "ACTIVE farm F; two lots L1 and L2 of 120 dozens each, both auto-held (scores 65 and 68, both < 70)"
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Red Barn Pastures", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-08", driver_name: "Dale", capacity_cases: 10 }
              as: PlantOperator
              captures: { r1_id: $.data.id }
            - call: "POST /farm-network/routes/${r1_id}/stops"
              payload: { farm_id: "${f_id}", stop_sequence: 1, planned_cases: 4 }
              as: PlantOperator
            - call: "POST /farm-network/_clock/set_current_utc"
