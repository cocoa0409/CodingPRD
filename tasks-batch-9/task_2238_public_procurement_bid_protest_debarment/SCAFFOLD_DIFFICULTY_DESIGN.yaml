              as: Vendor
              as_user_id: "${v17_id}"
          assert:
            - "the trigger returns HTTP 409 with $.data.error_id == ERR_VENDOR_NOT_ELIGIBLE"
            - "the error is NOT ERR_INVALID_SOLICITATION_STATE, NOT ERR_BID_DEADLINE_PASSED and NOT ERR_STALE_SOLICITATION_VERSION — the Bid-side preconditions were all satisfied"
            - "Vendor.${v17_id}.eligibility_status == SUSPENDED, suspension_reason_code == FRAUD, active_debarment_id == ${d4_id}, debarment_strike_count == 1"
            - "DebarmentProceeding.${d4_id}.interim_status == INTERIM_SUSPENDED, severity_score == 40.00, strikes_applied == 1, status == NOTICE_ISSUED"
            - "GET /procurement/bids?solicitation_id=${s14_id} returns an empty list"
            - "Solicitation.${s14_id}.status == ISSUED and Solicitation.${s14_id}.bid_count == 0"

