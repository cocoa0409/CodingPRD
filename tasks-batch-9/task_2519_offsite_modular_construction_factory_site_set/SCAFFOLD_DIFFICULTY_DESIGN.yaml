              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-03", set_sequence_index: 3, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
              as_user_id: "${fac}"
              captures: { m3: "$.data.id" }
          trigger:
            - call: "POST /modular/modules/${m1}/schedule-line-slot"
              payload: { line_slot_start: "2026-09-02T14:00:00Z" }
              as: FactoryProductionManager
