            - "JurisdictionRegistration.${reg_cy}.verified_at is non-null"
            - "JurisdictionRegistration.${reg_cy}.rejected_reason is null after resubmit cleared it"

      - name: deposit_failure_reschedule_loop_accumulates_lateness
