      - name: visit_with_foreign_intake_returns_patient_mismatch
        claim_type: Cross-entity validation
        grounds: ["validations[priority=6]", "errors[ERR_PATIENT_MISMATCH]"]
        distinguishing_aspect: "Scheduling a visit whose intake_assessment_id belongs to a different patient returns ERR_PATIENT_MISMATCH (422)."
