      - name: application_submit_gated_on_artist_standing_not_application_state
        grounds:
          - validations[error_id=ERR_ARTIST_NOT_IN_GOOD_STANDING]
          - endpoints[POST /grants/artists/{artist_id}/debar]
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Two complete DRAFT applications differ only in the standing of a *different* entity —
          the applicant. Debarring art1 blocks its submit with ERR_ARTIST_NOT_IN_GOOD_STANDING
          while art2's byte-equivalent submit succeeds, and the discipline's alias counter shows
          that the rejected submit consumed no sequence number: art2 receives LIT-2027-0001
          despite its application having been created second.
        test_recipe:
          setup:
            - "CycleMain OPEN at clock 2026-09-01"
            - "app1 (art1, created first) and app2 (art2, created second) are both DRAFT with two cleared-media samples each"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *m_art2
            - *m_app2
            - *m_ws2a
            - *m_ws2b
          trigger:
            - { call: "POST /grants/artists/${art1}/debar", payload: { debar_reason_code: FUNDS_MISUSE }, as: ProgramOfficer, as_user_id: "officer-1" }
            - *k_sub1
            - *m_sub2
            - { call: "GET /grants/applications/${app1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app2}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/discipline-categories/${disc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "art1.standing == DEBARRED with debar_reason_code FUNDS_MISUSE after the debar call"
            - "Submitting app1 returns 409 ERR_ARTIST_NOT_IN_GOOD_STANDING; app1 stays DRAFT with submitted_at, sealed_alias and residency_months_at_deadline all null"
            - "Submitting app2 returns 200 with status SUBMITTED"
            - "app2.sealed_alias == LIT-2027-0001 — the alias counter advances only on a successful submit, regardless of creation order"
            - "DisciplineCategory.submitted_sequence_counter == 1"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: same_person_seated_on_panels_with_half_open_window_overlap
        grounds:
          - state_machines.Panelist.NOMINATED_to_SEATED
          - validations[error_id=ERR_PANELIST_WINDOW_CONFLICT]
        distinguishing_aspect: |
          One person (identified by person_email, not by Panelist id) is nominated to three
          panels of the same cycle. Seating succeeds on the first, is rejected on the second
          whose window overlaps it, and succeeds again on the third whose window begins exactly
          when the first ends. Overlap is measured on half-open intervals, so touching endpoints
          are not a conflict — a closed-interval implementation wrongly rejects the third
          seating, and an id-based implementation wrongly accepts the second.
        test_recipe:
          setup:
            - "CycleMain in PANEL_REVIEW with three LITERARY_ARTS panels"
            - "panW window [2026-11-01, 2026-12-01); panX window [2026-11-15, 2026-12-15); panY window [2026-12-01, 2027-01-01)"
            - "The same person_email roving.reader@example.org is nominated once on each panel"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *k_sub1
            - *k_clock_oct16
            - *k_close_cycle
            - *k_elig1
            - *k_panel_review
            - { call: "POST /grants/panels", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", required_seats: 3, required_regions: [NORTH, CENTRAL, SOUTH], deliberation_window_start: "2026-11-01T00:00:00Z", deliberation_window_end: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1", captures: { panW: "$.data.id" } }
            - { call: "POST /grants/panels", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", required_seats: 3, required_regions: [NORTH, CENTRAL, SOUTH], deliberation_window_start: "2026-11-15T00:00:00Z", deliberation_window_end: "2026-12-15T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1", captures: { panX: "$.data.id" } }
            - { call: "POST /grants/panels", payload: { cycle_id: "${cyc}", discipline_category_id: "${disc}", required_seats: 3, required_regions: [NORTH, CENTRAL, SOUTH], deliberation_window_start: "2026-12-01T00:00:00Z", deliberation_window_end: "2027-01-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1", captures: { panY: "$.data.id" } }
            - { call: "POST /grants/panelists", payload: { panel_id: "${panW}", person_email: "roving.reader@example.org", full_name: "Rae Ostergaard", region: NORTH, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { rovW: "$.data.id" } }
            - { call: "POST /grants/panelists", payload: { panel_id: "${panX}", person_email: "roving.reader@example.org", full_name: "Rae Ostergaard", region: NORTH, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { rovX: "$.data.id" } }
            - { call: "POST /grants/panelists", payload: { panel_id: "${panY}", person_email: "roving.reader@example.org", full_name: "Rae Ostergaard", region: NORTH, expertise_codes: [LITERARY_ARTS], is_chair: false }, as: ProgramOfficer, as_user_id: "officer-1", captures: { rovY: "$.data.id" } }
          trigger:
            - { call: "POST /grants/panelists/${rovW}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/panelists/${rovX}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1", captures: { err_overlap: "$.data.error_id" } }
            - { call: "POST /grants/panelists/${rovY}/seat", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/panels/${panX}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/panels/${panY}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "Seating on panW returns 200 with status SEATED"
            - "Seating on panX returns 409 ERR_PANELIST_WINDOW_CONFLICT — [11-15, 12-15) intersects [11-01, 12-01)"
            - "rovX stays NOMINATED with seated_at null; panX.seated_count == 0 and readiness_score == 0"
            - "Seating on panY returns 200 — [12-01, 01-01) and [11-01, 12-01) touch at 2026-12-01 but do not intersect under half-open comparison"
            - "panY.seated_count == 1, region_coverage_count == 1 and readiness_score == 11.11 (100 * 1/3 * 1/3, round_half_up)"

      - name: award_period_cooling_buffer_at_exactly_365_days
        grounds:
          - validations[error_id=ERR_AWARD_PERIOD_COOLING_VIOLATION]
          - state_machines.RecommendationSlot.PROPOSED_to_BOARD_APPROVED
          - calculations.award_waterfall_allocation
        distinguishing_aspect: |
          Two ranked slots differ only in their artist's recorded prior grant-period end.
          art1's prior period ended 2026-01-02, leaving 364 days before the new grant period
          starts on 2027-01-01, so approving rank 1 is rejected; art2's ended 2026-01-01,
          exactly AWARD_COOLING_DAYS = 365 days, and the closed-interval rule permits it. The
          test also proves the buffer is evaluated against the cycle's grant_period_start rather
          than against the logical clock.
        test_recipe:
          setup:
            - "CycleMain in BOARD_REVIEW with two SCORED applications slated as rank 1 (app1/art1) and rank 2 (app2/art2)"
            - "Prior fellowship history recorded after submission, so the P85 blackout-year check at submit is unaffected"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *k_sub1
            - *m_art2
            - *m_app2
            - *m_ws2a
            - *m_ws2b
            - *m_sub2
            - *k_clock_oct16
            - *k_close_cycle
            - *k_elig1
            - *m_elig2
            - *k_panel_review
            - *k_panel
            - *k_pl1
            - *k_pl2
            - *k_pl3
            - *k_pl4
            - *k_pl5
            - *k_seat1
            - *k_seat2
            - *k_seat3
            - *k_seat4
            - *k_seat5
            - *k_charter
            - *k_round1
            - *k_rev1
            - *k_srev1
            - *k_rev2
            - *k_srev2
            - *k_rev3
            - *k_srev3
            - *k_rev4
            - *k_srev4
            - *k_rev5
            - *k_srev5
            - *m_rev2a
            - *m_srev2a
            - *m_rev2b
