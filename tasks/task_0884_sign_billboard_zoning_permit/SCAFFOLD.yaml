# =============================================================================
# Sign & Billboard Zoning Permit — benchmark seed tables (SCAFFOLD.yaml)
# §1.0–§1.7 (plus preamble). §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: |
  Sign & Billboard Zoning Permit: sign application & type (wall/monument/digital),
  setback/size/illumination review, historic/overlay & variance, permit & fee,
  inspection & non-conforming registry, violation & removal order,
  billboard lease/registration, renewal

domain_name: sign-billboard-zoning-permit
api_prefix: /

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint          # clock-set sweeps time-based transitions deterministically

  entity_topology: flat            # peer entities joined by FK references, no nested URL ownership
  state_machine_shape: parallel    # SignApplication carries two independent review axes; Variance is cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties # variance recommender must differ from decider
  consistency_model: immediate

  entity_count: 12
  state_machine_count: 7
  calculation_count: 7
  validation_layers: 11
  endpoint_count: 44
  error_code_count: 24
  role_count: 4

# =============================================================================
# Global time constants (declared values for the named temporal constants used
# in state-machine side-effects, computed deadlines, and validations below).
# Reconciled with the §1.8/§1.9 worked examples: CURE_PERIOD_DAYS=30 yields
# cure_deadline 2026-05-31 from the default clock 2026-05-01; REGISTRATION_TERM_DAYS
# =365 yields registration_expires_at 2027-05-01; INSPECTION_BUFFER_MINUTES=60
# rejects a second inspection 30 minutes after the first.
# =============================================================================
global_constants:
  PERMIT_TERM_DAYS: 365
  RENEWAL_WINDOW_DAYS: 30           # window opens 30 days before expires_at
  RENEWAL_GRACE_DAYS: 30            # window closes 30 days after expires_at
  CURE_PERIOD_DAYS: 30
  REMOVAL_COMPLIANCE_DAYS: 15
  REGISTRATION_TERM_DAYS: 365
  INSPECTION_BUFFER_MINUTES: 60

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Parcel
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: zoning_district, type: enum, source: input, description: "COMMERCIAL | INDUSTRIAL | RESIDENTIAL | MIXED_USE", constraints: "one of COMMERCIAL,INDUSTRIAL,RESIDENTIAL,MIXED_USE" }
      - { name: historic_overlay, type: boolean, source: input, description: "Parcel sits in a historic overlay district", default: false }
      - { name: corridor_overlay, type: boolean, source: input, description: "Parcel sits in a scenic corridor overlay", default: false }
      - { name: max_sign_area_sqft, type: number, source: input, description: "Maximum permitted sign face area in square feet (by-right ceiling; boundary is inclusive)" }
      - { name: max_height_ft, type: number, source: input, description: "Maximum permitted sign height in feet (inclusive ceiling)" }
      - { name: min_setback_ft, type: number, source: input, description: "Minimum permitted setback from property line in feet (inclusive floor)" }
      - { name: allowed_illumination, type: enum, source: input, description: "Highest illumination class permitted by-right: NONE | EXTERNAL | DIGITAL_DISPLAY (ordered NONE<EXTERNAL<DIGITAL_DISPLAY)", constraints: "one of NONE,EXTERNAL,DIGITAL_DISPLAY" }
      - { name: max_signs, type: integer, source: input, description: "Maximum number of concurrently ACTIVE permitted signs on this parcel" }
      - { name: active_permit_count, type: integer, source: computed, description: "Count of Permits on this parcel with status==ACTIVE; starts 0", default: 0 }
      - { name: available_sign_slots, type: integer, source: computed, description: "max_signs - active_permit_count; conserved partition, never negative" }

  - name: Applicant
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; used as X-User-ID for the Applicant role" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: name, type: string, source: input, description: "Applicant / billboard operator legal name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }

  - name: Inspector
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; used as X-User-ID for the Inspector role" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: name, type: string, source: input, description: "Field inspector name" }

  - name: SignApplication
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; parcel the sign is proposed on" }
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; must equal X-User-ID of the acting Applicant" }
      - { name: sign_type, type: enum, source: input, description: "WALL | MONUMENT | DIGITAL", constraints: "one of WALL,MONUMENT,DIGITAL" }
      - { name: requested_area_sqft, type: number, source: input, description: "Requested sign face area in square feet" }
      - { name: requested_height_ft, type: number, source: input, description: "Requested sign height in feet" }
      - { name: requested_setback_ft, type: number, source: input, description: "Requested setback from property line in feet" }
      - { name: requested_illumination, type: enum, source: input, description: "NONE | EXTERNAL | DIGITAL_DISPLAY", constraints: "one of NONE,EXTERNAL,DIGITAL_DISPLAY" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Estimated permit fee computed at SUBMIT from requested_* values (provisional variant)" }
      - { name: approved_area_sqft, type: number, source: computed, description: "Effective approved area at APPROVE; = min(requested, granted AREA variance value) else requested; null until approved" }
      - { name: approved_type, type: enum, source: computed, description: "Effective approved sign type at APPROVE; null until approved" }
      - { name: approved_illumination, type: enum, source: computed, description: "Effective approved illumination at APPROVE; null until approved" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED | PERMITTED", constraints: "one of DRAFT,SUBMITTED,APPROVED,DENIED,PERMITTED" }
      - { name: dimensional_review, type: enum, source: system, description: "Parallel axis 1: PENDING | PASS | FAIL (area/height/setback/illumination check)", constraints: "one of PENDING,PASS,FAIL" }
      - { name: overlay_review, type: enum, source: system, description: "Parallel axis 2: PENDING | CLEARED | VARIANCE_REQUIRED | VARIANCE_GRANTED (historic/overlay check)", constraints: "one of PENDING,CLEARED,VARIANCE_REQUIRED,VARIANCE_GRANTED" }

  - name: Variance
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> SignApplication.id; application seeking relief" }
      - { name: kind, type: enum, source: input, description: "AREA | HEIGHT | SETBACK | HISTORIC | ILLUMINATION", constraints: "one of AREA,HEIGHT,SETBACK,HISTORIC,ILLUMINATION" }
      - { name: requested_value, type: number, source: input, description: "Value the applicant asks to be allowed (e.g., area sqft); ignored for HISTORIC" }
      - { name: justification, type: string, source: input, description: "Applicant hardship justification" }
      - { name: recommendation, type: enum, source: system, description: "RECOMMEND_APPROVE | RECOMMEND_DENY; null until recommended", constraints: "one of RECOMMEND_APPROVE,RECOMMEND_DENY" }
      - { name: recommended_by_user_id, type: string, source: system, description: "X-User-ID of the Planner who recommended; null until recommended" }
      - { name: decision, type: enum, source: system, description: "GRANT | DENY | REVISE; null until decided", constraints: "one of GRANT,DENY,REVISE" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the ZoningBoard member who decided; null until decided" }
      - { name: granted_value, type: number, source: system, description: "Value the board grants on GRANT (may be less than requested_value); null otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | GRANTED | DENIED", constraints: "one of SUBMITTED,UNDER_REVIEW,REVISION_REQUESTED,GRANTED,DENIED" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> SignApplication.id; the approved application" }
      - { name: fee_charged_cents, type: integer, source: computed, description: "Final permit fee computed at issuance from approved_* values (final variant)" }
      - { name: fee_paid, type: boolean, source: system, description: "True once paid in full", default: false }
      - { name: fee_refunded_cents, type: integer, source: computed, description: "Amount refunded on revoke; 0 otherwise", default: 0 }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant permit was issued" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant permit was paid/activated; null until ACTIVE" }
      - { name: expires_at, type: datetime, source: system, description: "activated_at + PERMIT_TERM_DAYS; null until ACTIVE" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACTIVE | EXPIRED | REVOKED", constraints: "one of ISSUED,ACTIVE,EXPIRED,REVOKED" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; permit being inspected" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; assigned inspector" }
      - { name: scheduled_start, type: datetime, source: input, description: "Inspection window start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Inspection window end (ISO 8601 UTC)" }
      - { name: outcome, type: enum, source: system, description: "PASS | FAIL; null until recorded", constraints: "one of PASS,FAIL" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED | CANCELLED", constraints: "one of SCHEDULED,PASSED,FAILED,CANCELLED" }

  - name: NonConformingRegistration
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; parcel where the legally non-conforming sign stands" }
      - { name: description, type: string, source: input, description: "Description of the grandfathered sign" }
      - { name: original_value_cents, type: integer, source: input, description: "Assessed original value used as amortization basis" }
      - { name: amortization_period_years, type: integer, source: input, description: "Amortization term in years" }
      - { name: registered_at, type: datetime, source: system, description: "Logical-clock instant of registration; amortization basis date" }
      - { name: straight_line_value_cents, type: integer, source: computed, description: "Remaining value at current clock under STRAIGHT_LINE variant" }
      - { name: declining_balance_value_cents, type: integer, source: computed, description: "Remaining value at current clock under DECLINING_BALANCE variant" }
      - { name: status, type: enum, source: system, description: "ACTIVE | AMORTIZED (elapsed >= period)", constraints: "one of ACTIVE,AMORTIZED" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; parcel where the violation is cited" }
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; permit implicated, null for unpermitted-sign violations" }
      - { name: kind, type: enum, source: input, description: "NO_PERMIT | EXCEEDS_PERMIT | ILLEGAL_ILLUMINATION | ABANDONED", constraints: "one of NO_PERMIT,EXCEEDS_PERMIT,ILLEGAL_ILLUMINATION,ABANDONED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant the violation was cited" }
      - { name: cure_deadline, type: datetime, source: computed, description: "issued_at + CURE_PERIOD_DAYS; escalation is only valid strictly after this instant" }
      - { name: status, type: enum, source: system, description: "OPEN | CURED | ESCALATED", constraints: "one of OPEN,CURED,ESCALATED" }

  - name: RemovalOrder
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: violation_id, type: string, source: system, description: "FK -> Violation.id; the escalated violation that produced this order" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant the order was issued (= escalation instant)" }
      - { name: compliance_deadline, type: datetime, source: computed, description: "issued_at + REMOVAL_COMPLIANCE_DAYS" }
      - { name: status, type: enum, source: system, description: "ISSUED (single terminal state; append-only record)", constraints: "one of ISSUED" }

  - name: Billboard
    parent: null
    common_fields: true
    fields:
      - { name: parcel_id, type: string, source: input, description: "FK -> Parcel.id; parcel the structure occupies" }
      - { name: operator_id, type: string, source: input, description: "FK -> Applicant.id; must equal X-User-ID of the acting Applicant/operator" }
      - { name: face_count, type: integer, source: input, description: "Number of advertising faces on the structure (drives registration fee)" }
      - { name: is_digital, type: boolean, source: input, description: "True for digital/electronic billboard faces" }
      - { name: structure_height_ft, type: number, source: input, description: "Overall structure height in feet" }
      - { name: registration_status, type: enum, source: system, description: "UNREGISTERED | REGISTERED | LAPSED", constraints: "one of UNREGISTERED,REGISTERED,LAPSED" }
      - { name: registration_expires_at, type: datetime, source: system, description: "Registration expiry; null until first registered" }
      - { name: registration_fee_collected_cents, type: integer, source: computed, description: "Cumulative registration fees collected across register/renew actions", default: 0 }

  - name: BillboardLease
    parent: null
    common_fields: true
    fields:
      - { name: billboard_id, type: string, source: input, description: "FK -> Billboard.id; structure being leased (exclusive per interval)" }
      - { name: lessee_name, type: string, source: input, description: "Advertiser leasing the structure" }
      - { name: start_date, type: datetime, source: input, description: "Lease interval start (inclusive; half-open [start,end))" }
      - { name: end_date, type: datetime, source: input, description: "Lease interval end (exclusive; must be strictly after start_date)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED | EXPIRED | SUSPENDED", constraints: "one of ACTIVE,TERMINATED,EXPIRED,SUSPENDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SignApplication
    field: status
    initial_state: DRAFT
    terminal_states: [DENIED, PERMITTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /applications/{id}/submit"
        actor: Applicant
        preconditions: ["all requested_* fields present"]
        side_effects:
          - "compute provisional_fee_cents from requested_type/area/illumination (provisional permit-fee variant)"
          - "set dimensional_review=PENDING, overlay_review=PENDING"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /applications/{id}/decide (decision=APPROVE)"
        actor: Planner
        preconditions:
          - "dimensional_review == PASS"
          - "overlay_review IN {CLEARED, VARIANCE_GRANTED}"
        side_effects:
          - "set approved_type, approved_illumination; set approved_area_sqft = min(requested_area_sqft, granted AREA-variance value if any) else requested_area_sqft"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /applications/{id}/decide (decision=DENY)"
        actor: Planner
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PERMITTED
        trigger: "system on POST /permits (permit issued for this application)"
        actor: system
        preconditions: ["application.status == APPROVED"]
        side_effects: ["increments SignApplication.version by 1 (OCC on permit issuance)"]

  - entity: SignApplication
    field: dimensional_review
    initial_state: PENDING
    terminal_states: []
    note: "Parallel axis, evolves independently of overlay_review and status"
    transitions:
      - from: PENDING
        to: PASS
        trigger: "POST /applications/{id}/review (review_type=DIMENSIONAL, outcome=PASS)"
        actor: Planner
        preconditions:
          - "effective area (granted AREA variance value if GRANTED, else requested_area_sqft) <= parcel.max_sign_area_sqft"
          - "effective height <= parcel.max_height_ft"
          - "requested_setback_ft >= parcel.min_setback_ft"
          - "rank(requested_illumination) <= rank(parcel.allowed_illumination), unless an ILLUMINATION variance is GRANTED"
        side_effects: []
      - from: PENDING
        to: FAIL
        trigger: "POST /applications/{id}/review (review_type=DIMENSIONAL, outcome=FAIL)"
        actor: Planner
        preconditions: []
        side_effects: []
      - from: FAIL
        to: PASS
        trigger: "POST /applications/{id}/review (review_type=DIMENSIONAL, outcome=PASS) after variance relief"
        actor: Planner
        preconditions: ["dimensional preconditions now satisfied via granted variance"]
        side_effects: []

  - entity: SignApplication
    field: overlay_review
    initial_state: PENDING
    terminal_states: []
    note: "Parallel axis, evolves independently of dimensional_review and status"
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /applications/{id}/review (review_type=OVERLAY, outcome=CLEARED)"
        actor: Planner
        preconditions: ["parcel.historic_overlay == false (or a HISTORIC variance is GRANTED)"]
        side_effects: []
      - from: PENDING
        to: VARIANCE_REQUIRED
        trigger: "POST /applications/{id}/review (review_type=OVERLAY, outcome=VARIANCE_REQUIRED)"
        actor: Planner
        preconditions: []
        side_effects: []
      - from: VARIANCE_REQUIRED
        to: VARIANCE_GRANTED
        trigger: "system on POST /variances/{id}/decide (decision=GRANT, kind IN {HISTORIC, ILLUMINATION})"
        actor: system
        preconditions: ["a HISTORIC/ILLUMINATION variance for this application is GRANTED"]
        side_effects: []

  - entity: Variance
    field: status
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED]
    note: "Cyclic: UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW (revision loop)"
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /variances/{id}/recommend"
        actor: Planner
        preconditions: []
        side_effects: ["set recommendation, recommended_by_user_id = X-User-ID"]
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /variances/{id}/recommend"
        actor: Planner
        preconditions: []
        side_effects: ["overwrite recommendation, recommended_by_user_id = X-User-ID (revision loop)"]
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /variances/{id}/decide (decision=GRANT)"
        actor: ZoningBoard
        preconditions: ["decided_by_user_id (X-User-ID) != recommended_by_user_id (segregation of duties)"]
        side_effects:
          - "set granted_value, decided_by_user_id"
          - "if kind IN {AREA,HEIGHT,SETBACK}: relief available to dimensional review of application_id"
          - "if kind IN {HISTORIC,ILLUMINATION}: set application.overlay_review = VARIANCE_GRANTED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /variances/{id}/decide (decision=DENY)"
        actor: ZoningBoard
        preconditions: ["decided_by_user_id != recommended_by_user_id"]
        side_effects: ["set decided_by_user_id"]
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /variances/{id}/decide (decision=REVISE)"
        actor: ZoningBoard
        preconditions: ["decided_by_user_id != recommended_by_user_id"]
        side_effects: ["set decided_by_user_id; awaits re-recommendation"]

  - entity: Permit
    field: status
    initial_state: ISSUED
    terminal_states: [REVOKED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /permits/{id}/pay"
        actor: Applicant
        preconditions: ["status == ISSUED", "amount_cents >= fee_charged_cents"]
        side_effects:
          - "fee_paid=true, activated_at=now, expires_at=now + PERMIT_TERM_DAYS"
          - "parcel.active_permit_count += 1; parcel.available_sign_slots -= 1 (count conservation)"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /permits/{id}/renew"
        actor: Applicant
        preconditions:
          - "status IN {ACTIVE, EXPIRED}"
          - "now within renewal window: now >= expires_at - RENEWAL_WINDOW_DAYS AND now <= expires_at + RENEWAL_GRACE_DAYS"
          - "fee_paid == true"
        side_effects: ["expires_at += PERMIT_TERM_DAYS", "increments Permit.version by 1"]
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /permits/{id}/renew"
        actor: Applicant
        preconditions: ["now within renewal grace window", "fee_paid == true"]
        side_effects: ["expires_at += PERMIT_TERM_DAYS", "parcel.active_permit_count += 1; parcel.available_sign_slots -= 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep on POST /_clock/set_current_utc when now >= expires_at"
        actor: system
        preconditions: []
        side_effects: ["parcel.active_permit_count -= 1; parcel.available_sign_slots += 1 (count conservation)"]
      - from: [ISSUED, ACTIVE]
        to: REVOKED
        trigger: "POST /permits/{id}/revoke OR system cascade from RemovalOrder issuance"
        actor: "Planner or system"
        preconditions: ["status IN {ISSUED, ACTIVE}"]
        side_effects:
          - "fee_refunded_cents = fee_charged_cents (money conservation: net permit revenue restored)"
          - "if prior status == ACTIVE: parcel.active_permit_count -= 1; parcel.available_sign_slots += 1"
          - "cascade: this permit's SCHEDULED Inspections -> CANCELLED"

  - entity: Inspection
    field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{id}/record (outcome=PASS)"
        actor: Inspector
        preconditions: ["inspector_id == X-User-ID"]
        side_effects: ["set outcome=PASS"]
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{id}/record (outcome=FAIL)"
        actor: Inspector
        preconditions: ["inspector_id == X-User-ID"]
        side_effects: ["set outcome=FAIL"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade when parent Permit -> REVOKED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Violation
    field: status
    initial_state: OPEN
    terminal_states: [CURED, ESCALATED]
    transitions:
      - from: OPEN
        to: CURED
        trigger: "POST /violations/{id}/cure"
        actor: Planner
        preconditions: ["now <= cure_deadline"]
        side_effects: []
      - from: OPEN
        to: ESCALATED
        trigger: "POST /violations/{id}/escalate"
        actor: Planner
        preconditions: ["now > cure_deadline (strictly after)"]
        side_effects:
          - "create RemovalOrder(status=ISSUED, compliance_deadline=now + REMOVAL_COMPLIANCE_DAYS) [cascade link 1]"
          - "if permit_id set: that Permit -> REVOKED [cascade link 2]"
          - "the revoked Permit's SCHEDULED Inspections -> CANCELLED [cascade link 3]"

  - entity: Billboard
    field: registration_status
    initial_state: UNREGISTERED
    terminal_states: []
    transitions:
      - from: [UNREGISTERED, LAPSED]
        to: REGISTERED
        trigger: "POST /billboards/{id}/register"
        actor: Applicant
        preconditions: ["amount_cents >= computed registration fee"]
        side_effects:
          - "registration_expires_at = now + REGISTRATION_TERM_DAYS"
          - "registration_fee_collected_cents += computed registration fee"
          - "increments Billboard.version by 1"
      - from: REGISTERED
        to: REGISTERED
        trigger: "POST /billboards/{id}/register (renewal)"
        actor: Applicant
        preconditions: ["now within renewal window: now >= registration_expires_at - RENEWAL_WINDOW_DAYS", "amount_cents >= computed registration fee"]
        side_effects: ["registration_expires_at += REGISTRATION_TERM_DAYS", "registration_fee_collected_cents += computed registration fee", "increments Billboard.version by 1"]
      - from: REGISTERED
        to: LAPSED
        trigger: "system sweep on POST /_clock/set_current_utc when now >= registration_expires_at"
        actor: system
        preconditions: []
        side_effects: ["cascade: this billboard's leases with status IN {ACTIVE} -> SUSPENDED [cascade link 2]"]

  - entity: BillboardLease
    field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /billboard-leases/{id}/terminate"
        actor: Applicant
        preconditions: ["status == ACTIVE"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep on POST /_clock/set_current_utc when now >= end_date"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade when parent Billboard -> LAPSED"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; true CREATE-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: permit-issue-stale-application
    parent_entity: SignApplication
    write_endpoint: "POST /permits"
    occ_field: "expected_application_version"
    description: |
      Issuing a Permit against a SignApplication whose version has advanced since
      the client last observed it is rejected. A granted variance or a review
      update legitimately mutates the application (advancing its version and
      possibly its approved dimensions/fee) between the client's read and this
      issuance, so the client's view is stale and the write is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: lease-create-stale-billboard
    parent_entity: Billboard
    write_endpoint: "POST /billboard-leases"
    occ_field: "expected_billboard_version"
    description: |
      Creating a BillboardLease against a Billboard whose version has advanced
      since the client last observed it is rejected. Another lease that
      legitimately occupies part of the calendar (or a registration renewal)
      advances the billboard version between read and this create, making the
      client's availability view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_permit_fee
    trigger: "POST /applications/{id}/submit"
    algorithm: tiered_pricing
    formula: |
      base = BASE_FEE_BY_TYPE[requested_sign_type]
      billable = max(0, requested_area_sqft - AREA_INCLUDED_SQFT)
      tier1_area = min(billable, AREA_TIER1_CAP_SQFT - AREA_INCLUDED_SQFT)
      tier2_area = max(0, requested_area_sqft - AREA_TIER1_CAP_SQFT)
      area_fee = round_half_up(tier1_area * AREA_TIER1_RATE_CENTS + tier2_area * AREA_TIER2_RATE_CENTS)
      provisional_fee_cents = base + area_fee + ILLUMINATION_SURCHARGE[requested_illumination]
    input_set: "requested_sign_type, requested_area_sqft, requested_illumination on this application"
    constants:
      BASE_FEE_BY_TYPE: { WALL: 15000, MONUMENT: 25000, DIGITAL: 50000 }
      AREA_INCLUDED_SQFT: 32
      AREA_TIER1_CAP_SQFT: 100
      AREA_TIER1_RATE_CENTS: 200
      AREA_TIER2_RATE_CENTS: 350
      ILLUMINATION_SURCHARGE: { NONE: 0, EXTERNAL: 5000, DIGITAL_DISPLAY: 20000 }
    precision: "integer cents, round_half_up on area_fee"
    variants:
      - name: provisional
        when: "at SUBMIT, before any variance decision"
        difference: "uses requested_* values; the estimate the applicant sees up front"

  - name: final_permit_fee
    trigger: "POST /permits (issuance)"
    algorithm: tiered_pricing
    formula: |
      Identical tiered formula as provisional_permit_fee, but evaluated over the
      APPROVED values: base = BASE_FEE_BY_TYPE[approved_type];
      billable = max(0, approved_area_sqft - AREA_INCLUDED_SQFT); ... ;
      fee_charged_cents = base + area_fee + ILLUMINATION_SURCHARGE[approved_illumination]
    input_set: "approved_type, approved_area_sqft, approved_illumination on the application"
    constants:
      BASE_FEE_BY_TYPE: { WALL: 15000, MONUMENT: 25000, DIGITAL: 50000 }
      AREA_INCLUDED_SQFT: 32
      AREA_TIER1_CAP_SQFT: 100
      AREA_TIER1_RATE_CENTS: 200
      AREA_TIER2_RATE_CENTS: 350
      ILLUMINATION_SURCHARGE: { NONE: 0, EXTERNAL: 5000, DIGITAL_DISPLAY: 20000 }
    precision: "integer cents, round_half_up on area_fee"
    variants:
      - name: final
        when: "at issuance, after variance decisions"
        difference: "uses approved_area_sqft (may be reduced below requested by a partially granted AREA variance) -> diverges from provisional"

  - name: billboard_registration_fee
    trigger: "POST /billboards/{id}/register"
    algorithm: tiered_pricing
    formula: |
      per_face_multiplier = is_digital ? DIGITAL_FACE_MULTIPLIER : 1.0
      per_face_fee = round_half_up(BASE_FACE_FEE_CENTS * per_face_multiplier)   # ROUND PER FACE
      registration_fee = per_face_fee * face_count                              # THEN SUM
      # Pinned order: round each face then sum. NOT round(BASE_FACE_FEE_CENTS * mult * face_count).
    input_set: "billboard face_count, is_digital"
    constants:
      BASE_FACE_FEE_CENTS: 3333
      DIGITAL_FACE_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up per face BEFORE summing"

  - name: non_conforming_valuation
    trigger: "GET /non-conforming (read-time) and system sweep on POST /_clock/set_current_utc"
    algorithm: decay_function
    formula: |
      elapsed_years = (now - registered_at) in days / 365.0
      # STRAIGHT_LINE variant:
      straight_line_value_cents = round_half_up(original_value_cents * max(0.0, 1.0 - elapsed_years / amortization_period_years))
      # DECLINING_BALANCE variant:
      declining_balance_value_cents = round_half_up(original_value_cents * (1.0 - DECLINE_RATE) ** elapsed_years)
      # status AMORTIZED when elapsed_years >= amortization_period_years
    input_set: "this registration's original_value_cents, amortization_period_years, registered_at; current clock"
    constants:
      DECLINE_RATE: 0.20
    precision: "integer cents, round_half_up"
    variants:
      - name: straight_line
        when: "linear amortization reporting"
        difference: "linear write-down over the term"
      - name: declining_balance
        when: "accelerated amortization reporting"
        difference: "geometric write-down; diverges from straight_line for identical inputs"

  - name: parcel_slot_ledger
    trigger: "POST /permits/{id}/pay (activate), POST /permits/{id}/revoke, permit EXPIRED sweep"
    algorithm: aggregation
    formula: |
      active_permit_count = count(Permit p on parcel where p.status == ACTIVE)
      available_sign_slots = max_signs - active_permit_count
      # Invariant: active_permit_count + available_sign_slots == max_signs at all times.
    input_set: "Permits on this parcel with status == ACTIVE"
    precision: "integer counts"

  - name: permit_revenue_ledger
    trigger: "POST /permits (issue), POST /permits/{id}/revoke"
    algorithm: aggregation
    formula: |
      total_permit_revenue_cents = sum over all Permits of (fee_charged_cents - fee_refunded_cents)
      # Invariant: an issue then revoke of the same permit leaves this global sum
      # unchanged relative to its value before the issue (fee_refunded == fee_charged on revoke).
    input_set: "all Permits (fee_charged_cents, fee_refunded_cents)"
    precision: "integer cents"

  - name: illumination_rank
    trigger: "dimensional review of an application"
    algorithm: threshold
    formula: |
      rank(NONE)=0, rank(EXTERNAL)=1, rank(DIGITAL_DISPLAY)=2
      dimensional illumination check passes iff rank(requested_illumination) <= rank(parcel.allowed_illumination),
      unless an ILLUMINATION variance is GRANTED for the application.
    input_set: "requested_illumination, parcel.allowed_illumination"
    precision: "integer rank comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per §1.7; entity_backed roles own the target resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "path/body-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "specific not-found for typed roots: application/parcel/permit/billboard"
    error_id: "ERR_APPLICATION_NOT_FOUND | ERR_PARCEL_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_BILLBOARD_NOT_FOUND"
    http_status: 404
    applies_to: "endpoints keyed on those roots"
  - priority: 5
    category: business_constraint
    check: "request body well-formed: required fields present, types/enums valid, numeric ranges non-negative, lease end_date strictly after start_date"
    error_id: "ERR_VALIDATION | ERR_INVALID_ENUM | ERR_INVALID_INTERVAL"
    http_status: 422
    applies_to: all write endpoints
  - priority: 6
    category: state
    check: "target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints
  - priority: 7
    category: business_referential
    check: "referenced entity is in the required state: application APPROVED for permit issuance; billboard REGISTERED for lease; permit ACTIVE for inspection scheduling"
    error_id: "ERR_APPLICATION_NOT_APPROVED | ERR_BILLBOARD_NOT_REGISTERED | ERR_PERMIT_INACTIVE"
    http_status: 409
    applies_to: "POST /permits, POST /billboard-leases, POST /inspections"
  - priority: 8
    category: business_safety
    check: "segregation of duties: variance decider (X-User-ID) must differ from recommender"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /variances/{id}/decide"
  - priority: 9
    category: business_constraint
    check: "dimensional & scheduling constraints: area/height/setback/illumination limits; billboard lease half-open interval overlap; inspector buffered schedule conflict"
    error_id: "ERR_SIGN_AREA_EXCEEDED | ERR_SIGN_HEIGHT_EXCEEDED | ERR_SETBACK_INSUFFICIENT | ERR_ILLUMINATION_NOT_ALLOWED | ERR_HISTORIC_OVERLAY_REVIEW_REQUIRED | ERR_LEASE_OVERLAP | ERR_INSPECTION_OVERLAP"
    http_status: 409
    applies_to: "POST /applications/{id}/review, POST /billboard-leases, POST /inspections"
  - priority: 10
    category: business_temporal
    check: "temporal gates: permit/registration renewal within window; escalation strictly after cure_deadline"
    error_id: "ERR_RENEWAL_WINDOW_CLOSED | ERR_CURE_PERIOD_ACTIVE"
    http_status: 409
    applies_to: "POST /permits/{id}/renew, POST /billboards/{id}/register (renewal), POST /violations/{id}/escalate"
  - priority: 11
    category: business_fiscal
    check: "fee/payment sufficiency: pay/register amount_cents >= computed fee"
    error_id: ERR_FEE_NOT_PAID
    http_status: 402
    applies_to: "POST /permits/{id}/pay, POST /billboards/{id}/register"
  - priority: 12
    category: business_constraint
    check: "quota: activating a permit must not exceed parcel.max_signs (available_sign_slots > 0)"
    error_id: ERR_SIGN_SLOTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /permits/{id}/pay"
  - priority: 13
    category: business_constraint
    check: "OCC: expected_<parent>_version matches parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /permits, POST /billboard-leases"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test/ops). Server default before any call is 2026-05-01T00:00:00Z. Advancing sweeps time-based transitions: permits past expires_at -> EXPIRED (slot released); billboards past registration_expires_at -> LAPSED (cascading ACTIVE leases -> SUSPENDED); leases past end_date -> EXPIRED; non-conforming registrations past amortization term -> AMORTIZED."
    roles: [Planner]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advance logical clock", "sweep permit/registration/lease/amortization expirations and cascades"]

  - method: POST
    path: "/parcels"
    description: "Create a zoning parcel with its by-right standards"
    roles: [Planner]
    code: 201
    input: [zoning_district, max_sign_area_sqft, max_height_ft, min_setback_ft, allowed_illumination, max_signs, "historic_overlay?", "corridor_overlay?"]
    output: Parcel
    side_effects: ["active_permit_count=0, available_sign_slots=max_signs"]
  - method: GET
    path: "/parcels/{parcel_id}"
    description: "Read a parcel (includes live slot ledger)"
    roles: [Planner, Applicant, ZoningBoard, Inspector]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  - method: POST
    path: "/applicants"
    description: "Register an applicant/operator; its id is the Applicant X-User-ID"
    roles: [Planner]
    code: 201
    input: [name, contact_email]
    output: Applicant
    side_effects: []

  - method: POST
    path: "/inspectors"
    description: "Register a field inspector; its id is the Inspector X-User-ID"
    roles: [Planner]
    code: 201
    input: [name]
    output: Inspector
    side_effects: []

  - method: POST
    path: "/applications"
    description: "Create a sign application (DRAFT)"
    roles: [Applicant]
    code: 201
    input: [parcel_id, applicant_id, sign_type, requested_area_sqft, requested_height_ft, requested_setback_ft, requested_illumination]
    output: SignApplication
    side_effects: ["status=DRAFT, dimensional_review=PENDING, overlay_review=PENDING"]
  - method: GET
    path: "/applications/{application_id}"
    description: "Read an application"
    roles: [Planner, Applicant, ZoningBoard, Inspector]
    code: 200
    input: []
    output: SignApplication
    side_effects: []
  - method: GET
    path: "/applications"
    description: "List/filter applications (reverse-reachability for parcel_id and applicant_id FKs)"
    roles: [Planner, Applicant, ZoningBoard, Inspector]
    code: 200
    input: ["parcel_id?", "applicant_id?", "status?", "limit?", "offset?"]
    output: SignApplication[]
    side_effects: []
  - method: POST
    path: "/applications/{application_id}/submit"
    description: "Submit a DRAFT application; computes provisional fee"
    roles: [Applicant]
    code: 200
    input: []
    output: SignApplication
    side_effects: ["DRAFT->SUBMITTED", "compute provisional_fee_cents"]
  - method: POST
    path: "/applications/{application_id}/review"
    description: "Planner records a review outcome on one axis (DIMENSIONAL or OVERLAY)"
    roles: [Planner]
    code: 200
    input: [review_type, outcome]
    output: SignApplication
    side_effects: ["set dimensional_review or overlay_review; enforces dimensional/overlay preconditions"]
  - method: POST
    path: "/applications/{application_id}/decide"
    description: "Planner approves or denies a reviewed application"
    roles: [Planner]
    code: 200
    input: [decision]
    output: SignApplication
    side_effects: ["SUBMITTED->APPROVED/DENIED", "on APPROVE set approved_type/area/illumination"]

  - method: POST
    path: "/variances"
    description: "Applicant files a variance request against an application (SUBMITTED)"
    roles: [Applicant]
    code: 201
    input: [application_id, kind, "requested_value?", justification]
    output: Variance
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/variances/{variance_id}"
    description: "Read a variance"
    roles: [Planner, Applicant, ZoningBoard, Inspector]
    code: 200
    input: []
    output: Variance
    side_effects: []
  - method: GET
    path: "/variances"
    description: "List/filter variances (reverse-reachability for application_id FK)"
    roles: [Planner, Applicant, ZoningBoard, Inspector]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: Variance[]
    side_effects: []
  - method: POST
    path: "/variances/{variance_id}/recommend"
    description: "Planner recommends approve/deny (SUBMITTED or REVISION_REQUESTED -> UNDER_REVIEW)"
    roles: [Planner]
    code: 200
    input: [recommendation]
    output: Variance
    side_effects: ["set recommendation, recommended_by_user_id=X-User-ID"]
  - method: POST
    path: "/variances/{variance_id}/decide"
    description: "ZoningBoard grants/denies/revises (segregation of duties enforced)"
    roles: [ZoningBoard]
    code: 200
    input: [decision, "granted_value?"]
    output: Variance
    side_effects: ["UNDER_REVIEW->GRANTED/DENIED/REVISION_REQUESTED", "on GRANT set granted_value; HISTORIC/ILLUMINATION grant sets application.overlay_review=VARIANCE_GRANTED"]

  - method: POST
    path: "/permits"
    description: "Issue a permit for an APPROVED application (OCC on application.version)"
    roles: [Planner]
    code: 201
    input: [application_id, expected_application_version]
    output: Permit
    side_effects: ["status=ISSUED", "compute fee_charged_cents (final variant)", "application->PERMITTED", "increments SignApplication.version by 1"]
  - method: GET
    path: "/permits/{permit_id}"
    description: "Read a permit"
    roles: [Planner, Applicant, ZoningBoard, Inspector]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: GET
    path: "/permits"
    description: "List/filter permits (reverse-reachability for application_id FK)"
    roles: [Planner, Applicant, ZoningBoard, Inspector]
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []
  - method: POST
    path: "/permits/{permit_id}/pay"
    description: "Pay a permit fee (ISSUED -> ACTIVE); consumes a parcel sign slot"
    roles: [Applicant]
    code: 200
    input: [amount_cents]
    output: Permit
    side_effects: ["fee_paid=true, ACTIVE, expires_at set", "parcel.active_permit_count += 1"]
  - method: POST
    path: "/permits/{permit_id}/renew"
    description: "Renew an ACTIVE/EXPIRED permit within the renewal window"
    roles: [Applicant]
    code: 200
    input: []
    output: Permit
    side_effects: ["expires_at += PERMIT_TERM_DAYS", "increments Permit.version by 1"]
  - method: POST
    path: "/permits/{permit_id}/revoke"
    description: "Revoke a permit; refunds fee and cancels its scheduled inspections"
    roles: [Planner]
    code: 200
    input: []
    output: Permit
    side_effects: ["status=REVOKED", "fee_refunded_cents=fee_charged_cents", "release parcel slot if was ACTIVE", "cascade SCHEDULED inspections -> CANCELLED"]

  - method: POST
    path: "/inspections"
    description: "Schedule an inspection on an ACTIVE permit for an inspector"
    roles: [Planner]
    code: 201
    input: [permit_id, inspector_id, scheduled_start, scheduled_end]
    output: Inspection
    side_effects: ["status=SCHEDULED", "enforces permit ACTIVE and inspector buffered non-overlap"]
  - method: GET
    path: "/inspections/{inspection_id}"
    description: "Read an inspection"
    roles: [Planner, Applicant, ZoningBoard, Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
    description: "List/filter inspections (reverse-reachability for permit_id and inspector_id FKs)"
    roles: [Planner, Applicant, ZoningBoard, Inspector]
    code: 200
    input: ["permit_id?", "inspector_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/inspections/{inspection_id}/record"
    description: "Assigned inspector records PASS/FAIL"
    roles: [Inspector]
    code: 200
    input: [outcome]
    output: Inspection
    side_effects: ["SCHEDULED->PASSED/FAILED"]

  - method: POST
    path: "/non-conforming"
    description: "Register a legally non-conforming (grandfathered) sign"
