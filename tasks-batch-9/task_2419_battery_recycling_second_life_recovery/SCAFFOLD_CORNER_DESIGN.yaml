              payload: { un_number: "UN3480", packing_group: "II", transporter_name: "HazTrans West" }
              as: ComplianceOfficer
              as_user_id: "co-submitter-1"
              captures: { man_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/manifests/${man_id}/close"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-closer-2"
            - call: "POST /recycling/intakes/${i_id}/release"
              payload: {}
              as: PlantOperator
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-20T00:00:00.000Z", window_end: "2026-08-21T00:00:00.000Z", planned_input_kg: 1000.0 }
              as: PlantOperator
              captures: { camp_id: "$.data.id" }
            - call: "POST /recycling/campaigns/${camp_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /recycling/campaigns/${camp_id}/lots"
              payload: { lot_code: "LOT-1" }
              as: PlantOperator
              captures: { lota_id: "$.data.id", lota_v: "$.data.version" }
            - call: "POST /recycling/campaigns/${camp_id}/lots"
              payload: { lot_code: "LOT-2" }
              as: PlantOperator
              captures: { lotb_id: "$.data.id", lotb_v: "$.data.version" }
          trigger:
            - call: "POST /recycling/lots/${lota_id}/charge"
              payload: { module_ids: ["${m1_id}"], expected_lot_version: "${lota_v}" }
              as: PlantOperator
              captures: { charged_a: "$.data.charged_mass_kg" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: PlantOperator
              captures: { t2: "$.data.module_mass_total_kg", a2: "$.data.assigned_mass_kg", u2: "$.data.unassigned_mass_kg" }
            - call: "POST /recycling/lots/${lotb_id}/charge"
              payload: { module_ids: ["${m2_id}", "${m3_id}"], expected_lot_version: "${lotb_v}" }
              as: PlantOperator
              captures: { charged_b: "$.data.charged_mass_kg" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: PlantOperator
              captures: { t3: "$.data.module_mass_total_kg", a3: "$.data.assigned_mass_kg", u3: "$.data.unassigned_mass_kg" }
          assert:
            - "At creation ${t0} == 0.0, ${a0} == 0.0 and ${u0} == 0.0 - the three derived fields start from their declared defaults, not from net_mass_kg 300.0"
            - "After the first module ${t1} == 100.0 and ${u1} == 100.0, so unassigned_mass_kg tracks module_mass_total_kg and not the weighbridge mass"
            - "After the first charge ${charged_a} == 100.0, ${t2} == 300.0, ${a2} == 100.0 and ${u2} == 200.0"
            - "After the second charge ${charged_b} == 200.0, ${t3} == 300.0, ${a3} == 300.0 and ${u3} == 0.0"
            - "intake_mass_conservation_invariant holds at all four observation points: ${a0} + ${u0} == ${t0}, ${a2} + ${u2} == ${t2} and ${a3} + ${u3} == ${t3}"
            - "The 100.0 kg of unassigned mass never double-counts across the two lots: RecoveryLot.${lota_id}.charged_mass_kg == 100.0 and RecoveryLot.${lotb_id}.charged_mass_kg == 200.0 sum to module_mass_total_kg"

      - name: stale_expected_lot_version_blocks_the_charge
        claim_type: optimistic_concurrency
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / stale_lot_version_precedes_charge_exceeds_plan"
          rationale: "The second §1.2.1 concurrency rule (lot-charge-stale-lot, occ_field expected_lot_version, ERR_STALE_LOT_VERSION) is exercised there: a version captured before an earlier charge is replayed and rejected with 412, and the retry at the current version succeeds."

      - name: finalize_drives_a_four_link_cascade
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / finalize_lot_four_link_cascade_to_supplier_quality_strike"
          rationale: "The end-to-end N-level chain (lot FINALIZED -> modules CONSUMED -> settlement flips to FINAL and re-prices -> supplier strike, plus the conditional campaign bubble-up) is verified link by link there, including the ordering sensitivity of the strike being counted after the deduction was computed."

      - name: both_pricing_variants_are_exercised_on_one_shipment
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / settlement_provisional_vs_final_repricing_on_lot_finalize"
          rationale: "The PROVISIONAL-versus-FINAL divergence and the delta applied to the ledger when the variant switches are computed and asserted there on one settlement, which is exactly this layer's claim."

  - section: consistency_model
    instances:
      - name: every_write_is_visible_to_the_immediately_following_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - state_machines.Intake.custody_state.PACKAGED_to_RELEASED
        distinguishing_aspect: "The consistency model is immediate with no denormalisation lag anywhere - including the settlement that the release cascade creates but never returns: it is discoverable by the very next request, and the charge that touches four rows at once leaves all four consistent on the next read with no retry or delay."
        test_recipe:
          setup:
            - "Clock 2026-08-20T00:00:00.000Z; one campus; one supplier; NI 1600 c/kg effective 2026-07-01; one NICKEL_RICH HYDROMET line at 100.0 kg/h."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/metal-index-prices"
              payload: { metal: "NI", effective_date: "2026-07-01T00:00:00.000Z", price_cents_per_kg: 1600 }
              as: MarketAnalyst
            - call: "POST /recycling/processing-lines"
              payload: { facility_id: "${fac_id}", line_code: "HYD-1", line_type: "HYDROMET", chemistry_family: "NICKEL_RICH", throughput_kg_per_hour: 100.0 }
              as: PlatformAdmin
              captures: { line_id: "$.data.id" }
          trigger:
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 30.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id" }
            - call: "GET /recycling/intakes"
              payload: { facility_id: "${fac_id}", custody_state: "RECEIVED" }
              as: PlantOperator
              captures: { listed_id: "$.data[0].id" }
            - call: "POST /recycling/intakes/${i_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
              captures: { i_v2: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/modules"
              payload: { serial_code: "M-1", mass_kg: 100.0, min_cell_capacity_pct: 58.0, mean_cell_capacity_pct: 62.0, cycle_count: 1200, expected_intake_version: "${i_v2}" }
              as: IntakeClerk
              captures: { m1_id: "$.data.id" }
            - call: "GET /recycling/intakes/${i_id}"
              payload: {}
              as: IntakeClerk
              captures: { total_now: "$.data.module_mass_total_kg" }
            - call: "POST /recycling/intakes/${i_id}/discharge"
              payload: { soc_pct: 12.0 }
              as: PlantOperator
            - call: "POST /recycling/intakes/${i_id}/package"
              payload: { packaging_type: "UN4G-STEEL-DRUM" }
              as: PlantOperator
            - call: "POST /recycling/modules/${m1_id}/triage-decisions"
              payload: { scoring_variant: "CONSERVATIVE" }
              as: TriageEngineer
              as_user_id: "te-1"
            - call: "GET /recycling/modules/${m1_id}"
              payload: {}
              as: TriageEngineer
              captures: { mod_status: "$.data.status", mod_score: "$.data.second_life_score", mod_grade: "$.data.grade" }
            - call: "POST /recycling/intakes/${i_id}/manifests"
              payload: { un_number: "UN3480", packing_group: "II", transporter_name: "HazTrans West" }
              as: ComplianceOfficer
              as_user_id: "co-submitter-1"
              captures: { man_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/manifests/${man_id}/close"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-closer-2"
            - call: "POST /recycling/intakes/${i_id}/release"
              payload: {}
              as: PlantOperator
              captures: { rel_custody: "$.data.custody_state" }
            - call: "GET /recycling/settlements"
              payload: { intake_id: "${i_id}" }
              as: SettlementAccountant
              captures: { st_id: "$.data[0].id", st_net: "$.data[0].net_payable_cents", st_state: "$.data[0].state" }
            - call: "POST /recycling/campaigns"
              payload: { line_id: "${line_id}", chemistry_family: "NICKEL_RICH", window_start: "2026-08-20T00:00:00.000Z", window_end: "2026-08-21T00:00:00.000Z", planned_input_kg: 1000.0 }
              as: PlantOperator
              captures: { camp_id: "$.data.id" }
            - call: "POST /recycling/campaigns/${camp_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /recycling/campaigns/${camp_id}/lots"
              payload: { lot_code: "LOT-1" }
              as: PlantOperator
              captures: { lot_id: "$.data.id", lot_v: "$.data.version" }
            - call: "POST /recycling/lots/${lot_id}/charge"
              payload: { module_ids: ["${m1_id}"], expected_lot_version: "${lot_v}" }
              as: PlantOperator
              captures: { ch_mass: "$.data.charged_mass_kg" }
            - call: "GET /recycling/campaigns/${camp_id}"
              payload: {}
              as: PlantOperator
              captures: { committed: "$.data.committed_input_kg" }
            - call: "GET /recycling/modules"
              payload: { lot_id: "${lot_id}", status: "CHARGED" }
              as: PlantOperator
              captures: { charged_mod_id: "$.data[0].id" }
          assert:
            - "${listed_id} == ${i_id} with total_count == 1 - the create is visible to the next list read, filters included"
            - "${total_now} == 100.0 immediately after the module create, so the parent's derived field is updated inside the same request that wrote the child"
            - "${mod_status} == RECOVERY_QUEUE with ${mod_score} == 48.80 and ${mod_grade} == D on the read that follows the triage - the score copied onto the module is visible at once"
            - "${rel_custody} == RELEASED and the response body contains no settlement, yet the very next read returns ${st_id} non-null with ${st_state} == DRAFT and ${st_net} == 28090 - a cascade-created child is immediately discoverable"
            - "${ch_mass} == 100.0, ${committed} == 100.0 on the next read and ${charged_mod_id} == ${m1_id} - all four rows the charge touched (lot, module, intake, campaign) are consistent immediately, with no eventual-consistency window"
            - "Every response follows the declared envelope { data, error } with error null on success"
