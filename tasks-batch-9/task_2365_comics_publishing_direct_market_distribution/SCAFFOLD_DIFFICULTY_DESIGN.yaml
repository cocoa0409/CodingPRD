          A different conserved quantity: the money ledger made of Title.royalty_accrued_cents plus the
          creator's unrecouped advance. Issuing moves 60432 into the accrual and consumes the whole 25000
          advance; reversing must put both back to 0 and 25000, and re-issuing an identical statement
          afterwards must recoup exactly 25000 again rather than a drifted amount.
