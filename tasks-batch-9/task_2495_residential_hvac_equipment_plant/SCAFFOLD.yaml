  - method: GET
    path: "/plant/certification-records"
    description: "Lists certification records, filterable by platform, region, status, and the standard that governs them."
    roles: [PlantAdmin, CertificationEngineer, RegulatoryAuditor, DesignEngineer, ReliabilityEngineer, SupplyPlanner]
    code: 200
    input: ["platform_id?", "region_code?", "status?", "governing_standard_id?", "limit?", "offset?"]
    output: CertificationRecord[]
    side_effects: []
  - method: GET
    path: "/plant/certification-records/{id}"
    description: "Reads one certification record."
    roles: [PlantAdmin, CertificationEngineer, RegulatoryAuditor, DesignEngineer, ReliabilityEngineer, SupplyPlanner]
    code: 200
    input: []
    output: CertificationRecord
    side_effects: []
