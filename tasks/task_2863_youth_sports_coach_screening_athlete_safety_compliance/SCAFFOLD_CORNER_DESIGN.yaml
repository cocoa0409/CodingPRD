  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_club_version_and_stale_member_version_are_both_enforced
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[screening-order-create-stale-club]
          - concurrency_rules[interim-measure-create-stale-member]
          - errors[ERR_STALE_CLUB_VERSION]
          - errors[ERR_STALE_MEMBER_VERSION]
          - complexity_profile.complexity_layers
        distinguishing_aspect: |
          The two OCC guards key on different parents in the same fixture: an escrow funding
          moves Club.version so the screening order's expected_club_version goes stale (412
          ERR_STALE_CLUB_VERSION), and imposing the first interim measure moves Member.version so
          the second measure's expected_member_version goes stale (412 ERR_STALE_MEMBER_VERSION);
          both retries succeed with the refreshed version, and neither rejection consumed escrow
          or created a row.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' chartered at version 1 with escrow 500000, then funded once so its version is 2"
