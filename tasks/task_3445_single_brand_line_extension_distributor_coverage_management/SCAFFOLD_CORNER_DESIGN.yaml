          - errors.ERR_CHANNEL_NOT_ALLOWED
          - errors.ERR_CHANNEL_OUTSIDE_LINE_SCOPE
        distinguishing_aspect: "The three channel checks are distinct and ordered: distributor-served first, then market-allowed, then line-targeted — three crafted proposals each trip exactly one."
        test_recipe:
          setup:
            - "Logical clock at the startup default. Brand with PILOT core line targeting [HARDWARE, AUTOMOTIVE]; market M1 allows [HARDWARE]; market M2 allows [AUTOMOTIVE, MASS]; distributor APPROVED serving [HARDWARE, MASS]."
          setup_api_calls:
            - *k_brand
            - *k_line_core
            - *k_form
            - *k_seal
            - *k_review
            - call: "POST /brand-ops/markets"
              payload: { country_code: "US", name: "United States", registration_required: false, voc_regime: "STANDARD", allowed_channels: ["HARDWARE"] }
              as: RegulatoryAffairs
              captures: { market_m1: $.data.id }
            - call: "POST /brand-ops/markets"
              payload: { country_code: "FR", name: "France", registration_required: false, voc_regime: "STANDARD", allowed_channels: ["AUTOMOTIVE", "MASS"] }
              as: RegulatoryAffairs
              captures: { market_m2: $.data.id }
            - call: "POST /brand-ops/distributors"
              payload: { legal_name: "Channel Tester", home_market_id: "${market_m1}", channels_served: ["HARDWARE", "MASS"], credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { dist_id: $.data.id, dist_v1: $.data.version }
            - *k_dist_app
          trigger:
            - call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_m1}", product_line_id: "${line_id}", channel: "AUTOMOTIVE", starts_on: "2026-08-01", ends_on: "2027-07-31", annual_quota_units: 100, expected_distributor_version: "${dist_v2}" }
              as: ChannelManager
              captures: { err_served: $.data.error_id }
            - call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_m1}", product_line_id: "${line_id}", channel: "MASS", starts_on: "2026-08-01", ends_on: "2027-07-31", annual_quota_units: 100, expected_distributor_version: "${dist_v2}" }
              as: ChannelManager
              captures: { err_allowed: $.data.error_id }
            - call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_m2}", product_line_id: "${line_id}", channel: "MASS", starts_on: "2026-08-01", ends_on: "2027-07-31", annual_quota_units: 100, expected_distributor_version: "${dist_v2}" }
              as: ChannelManager
              captures: { err_scope: $.data.error_id }
          assert:
            - "(M1, AUTOMOTIVE): 422 ERR_CHANNEL_NOT_SERVED (the distributor does not serve AUTOMOTIVE)"
            - "(M1, MASS): 422 ERR_CHANNEL_NOT_ALLOWED (served by the distributor but not allowed by market M1)"
            - "(M2, MASS): 422 ERR_CHANNEL_OUTSIDE_LINE_SCOPE (served and allowed, but the line does not target MASS)"
            - "the distributor version is unchanged after three rejections (all three reuses of ${dist_v2} were accepted by the OCC check)"

