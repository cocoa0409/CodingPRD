          - call: "POST /direct-selling/product-orders"
            payload: { consultant_id: "${cons_a_id}", order_type: "PERSONAL_INVENTORY", posted_period_code: "2026-08", ship_to_state_code: "TX", lines: [ { product_id: "${sample_id}", quantity: 99 } ] }
            as: PlatformAdmin
            captures: { o1_id: "$.data.id" }
          - call: "POST /direct-selling/product-orders/${o1_id}/pay"
            payload: { amount_cents: 12529, payment_reference: "PAY-O1_ID" }
            as: PlatformAdmin
          - call: "POST /direct-selling/qualification-periods/${p8_id}/lock"
