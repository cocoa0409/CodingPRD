  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: upheld_accept_cascades_five_hops_to_sibling_sale_settlement_holds
        grounds:
          - state_machines.NegotiationRound.OPEN_to_ACCEPTED
          - state_machines.ArbitrationCase.NEGOTIATION_to_RESOLVED_ALLOWANCE
          - state_machines.Seller.GOOD_STANDING_to_BLOCKED
          - state_machines.AuctionSale.settlement_hold_cascade
          - calculations.seller_arbitration_rate
          - endpoints[POST /arbitration/cases/{id}/negotiation-rounds/{round_id}/accept]
        distinguishing_aspect: |
          A five-hop chain whose far end is a DIFFERENT entity type than its origin and
          whose last hop is conditional: one buyer click on a negotiation round reaches
          round -> case -> seller scorecard -> seller tier/policy-action -> the
          settlement_hold flag on three OTHER sales that the case never mentions. The
          conditional filter is the point — sale 1, the sale the claim was filed on, is
          skipped because its arbitration_status is no longer NONE, so the cascade touches
          exactly 3 of the seller's 4 sales.
        test_recipe:
          setup:
            - "one Seller SL-1001 in GOOD_STANDING with lifetime_upheld_count 0 and one Buyer BL-2001"
            - "one FRAME_DAMAGE ArbitrationPolicy with max_allowance_bps 3000 and min_claim_amount_cents 50000"
            - "FOUR AuctionSale rows for that seller, all at hammer_time_utc 2026-08-01T00:00:00Z (equal to the default clock, so all four are inside the rolling 90-day window) and all UNSETTLED"
            - "exactly one FRAME_DAMAGE case, on sale 1 only, evidenced and reviewed, with an OPEN NegotiationRound offering 200000"
            - "after the accept the rolling scorecard will read 1 upheld / 4 sales = 2500 bps, exactly TIER_BLOCK_BPS, and rolling_window_sales_count 4 meets MIN_SCORECARD_SALES 4"
          setup_api_calls:
            - call: "POST /arbitration/sellers"
              payload: { name: "Ridgeline Motors", dealer_license_no: "SL-1001" }
              as: AuctionAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /arbitration/buyers"
              payload: { name: "Harbor Auto Group", dealer_license_no: "BL-2001" }
              as: AuctionAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /arbitration/policies"
              payload: { defect_class: "FRAME_DAMAGE", window_hours: 168, mileage_limit: 1000, min_claim_amount_cents: 50000, requires_third_party_verification: true, max_allowance_bps: 3000, psi_extension_hours: 72, psi_clean_waives_rights: false }
              as: AuctionAdmin
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE12345", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1450000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 84000, light_channel: "RED", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale1_id: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE22222", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 900000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 61000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale2_id: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE33333", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 1100000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 52000, light_channel: "GREEN", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale3_id: $.data.id }
            - call: "POST /arbitration/sales"
              payload: { vin: "1FTFW1E50JKE44444", seller_id: "${seller_id}", buyer_id: "${buyer_id}", sale_price_cents: 780000, hammer_time_utc: "2026-08-01T00:00:00Z", announced_odometer_miles: 99000, light_channel: "YELLOW", title_status: "CLEAN" }
              as: BlockClerk
              captures: { sale4_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale1_id}", defect_class: "FRAME_DAMAGE", claim_amount_cents: 285000, odometer_at_claim: 84120, complaint_text: "Frame rail repair found on the lift" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "INSPECTION_REPORT", provider_name: "AutoCheck Bay 4", document_reference: "IR-88120", repair_estimate_cents: 285000 }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "THIRD_PARTY_VERIFICATION", provider_name: "National Frame Verify", document_reference: "TPV-4471" }
              as: BuyerRep
