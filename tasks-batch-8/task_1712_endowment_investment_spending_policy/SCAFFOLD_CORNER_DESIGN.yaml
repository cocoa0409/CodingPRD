      - name: suspended_pool_blocks_value_operations_until_resume
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_POOL_SUSPENDED]", state_machines.EndowmentPool.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "While SUSPENDED, gift receive, valuation create, and policy create all fail ERR_POOL_SUSPENDED; after resume the identical receive succeeds — proving the gate, not the gift's own state, caused the rejection."
        test_recipe:
          setup: ["pool with allocation and ACTIVE fund FSP with a PLEDGED CORPUS gift; the pool is SUSPENDED"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool SP", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { sp_pool: $.data.id } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${sp_pool}", items: [ { asset_class: CASH, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
