              as: Dispatcher
              as_user_id: "disp-001"
            - call: "GET /crashes/${c_id}"
              payload: {}
              as: SafetyManager
              as_user_id: "sm-001"
              captures: { posture_2: $.data.evidence_posture }
            - call: "POST /crashes/${c_id}/evidence-items"
