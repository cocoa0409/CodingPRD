  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: EventBooking (half-open capacity) vs
  # HatcherySchedule (closed window + 7-day gap)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: pet_wash_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.event_booking_overlap_check
          - entities.ServiceEvent.fields.capacity_per_slot
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) with aggregate capacity —
          a booking starting exactly when another ends does NOT overlap, but a
          15-minute staggered booking DOES, and the capacity_per_slot count
          (not a binary busy flag) is what rejects the third overlapping request.
        test_recipe:
          setup:
            - "Store; PUBLISHED PET_WASH event on wash-bay-1, 2026-09-15, 09:00-12:00, slot 30, buffer 0, capacity 1; two accounts; clock 2026-09-10T09:00:00Z."
          setup_api_calls:
            - *d1_clock_sep10
            - *d1_store
            - call: "POST /season-campaigns"
              payload: { store_id: "${store_id}", season: "WINTER_HEATING", planogram_map: "floor-open-v1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { ko_camp: $.data.id }
            - call: "POST /season-campaigns/${ko_camp}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${ko_camp}/activate"
              payload: { expected_store_version: "${store_v0}" }
              as: RegionalAdmin
            - call: "POST /service-events"
              payload: { store_id: "${store_id}", event_kind: "PET_WASH", resource_name: "wash-bay-1", event_date: "2026-09-15T00:00:00Z", slot_window_start: "2026-09-15T09:00:00Z", slot_window_end: "2026-09-15T12:00:00Z", slot_length_minutes: 30, cleanup_buffer_minutes: 0, capacity_per_slot: 1, requires_vaccine_record: false }
              as: StoreManager
              captures: { ev_id: $.data.id }
            - call: "POST /service-events/${ev_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Nan Booker", phone: "555-0161" }
              as: Anonymous
              captures: { acct1: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Otto Booker", phone: "555-0162" }
              as: Anonymous
              captures: { acct2: $.data.id }
          trigger:
            - call: "POST /event-bookings"
              payload: { service_event_id: "${ev_id}", loyalty_account_id: "${acct1}", slot_start: "2026-09-15T10:00:00Z" }
              as: Customer
              as_user_id: "${acct1}"
              captures: { bk1: $.data.id }
            - call: "POST /event-bookings"
              payload: { service_event_id: "${ev_id}", loyalty_account_id: "${acct2}", slot_start: "2026-09-15T10:30:00Z" }
              as: Customer
              as_user_id: "${acct2}"
              captures: { bk2: $.data.id }
            - call: "POST /event-bookings"
              payload: { service_event_id: "${ev_id}", loyalty_account_id: "${acct2}", slot_start: "2026-09-15T10:15:00Z" }
              as: Customer
              as_user_id: "${acct2}"
              captures: { ov_err: $.data.error_id }
          assert:
            - "EventBooking.${bk1}.status == BOOKED (10:00-10:30)"
            - "EventBooking.${bk2}.status == BOOKED — adjacency at exactly 10:30 allowed under half-open semantics"
            - "ov_err == ERR_BOOKING_OVERLAP — 10:15-10:45 overlaps 10:00-10:30 and 10:30-10:45, exceeding capacity 1"

      - name: hatchery_window_seven_day_sanitization_gap
        grounds:
          - calculations.schedule_window_gap_check
          - entities.HatcherySchedule.fields.sale_window_start
        distinguishing_aspect: |
          Interval semantics: closed windows with a mandatory sanitization gap —
          unlike half-open adjacency, a second same-species schedule must leave
          >= 7 full days between closed window ends and starts, so a window
          starting 5 days after the previous window's end is rejected while one
          starting exactly 7 days after is accepted.
        test_recipe:
          setup:
            - "Store (posture irrelevant); schedule S1 PUBLISHED with window 2026-03-01..2026-03-31 species CHICKEN_LAYER; clock 2026-09-10."
          setup_api_calls:
            - *d1_clock_sep10
            - *d1_store
            - call: "POST /season-campaigns"
              payload: { store_id: "${store_id}", season: "WINTER_HEATING", planogram_map: "floor-open-v1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { ko_camp: $.data.id }
            - call: "POST /season-campaigns/${ko_camp}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${ko_camp}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${ko_camp}/activate"
              payload: { expected_store_version: "${store_v0}" }
              as: RegionalAdmin
            - call: "POST /hatchery-schedules"
              payload: { store_id: "${store_id}", species: "CHICKEN_LAYER", breed: "Rhode Island Red", hatch_date: "2026-02-25T00:00:00Z", sale_window_start: "2026-03-01T00:00:00Z", sale_window_end: "2026-03-31T23:59:59Z", daily_capacity: 500, min_purchase_qty: 6, base_price_cents_per_bird: 349 }
              as: StoreManager
              captures: { s1: $.data.id }
            - call: "POST /hatchery-schedules/${s1}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /hatchery-schedules"
              payload: { store_id: "${store_id}", species: "CHICKEN_LAYER", breed: "Barred Rock", hatch_date: "2026-03-20T00:00:00Z", sale_window_start: "2026-04-05T00:00:00Z", sale_window_end: "2026-04-30T23:59:59Z", daily_capacity: 300, min_purchase_qty: 6, base_price_cents_per_bird: 399 }
              as: StoreManager
              captures: { s2: $.data.id }
            - call: "POST /hatchery-schedules"
              payload: { store_id: "${store_id}", species: "CHICKEN_LAYER", breed: "Buff Orpington", hatch_date: "2026-03-22T00:00:00Z", sale_window_start: "2026-04-08T00:00:00Z", sale_window_end: "2026-05-10T23:59:59Z", daily_capacity: 300, min_purchase_qty: 4, base_price_cents_per_bird: 429 }
              as: StoreManager
              captures: { s3: $.data.id }
          trigger:
            - call: "POST /hatchery-schedules/${s2}/publish"
              payload: {}
              as: StoreManager
              captures: { gap_err: $.data.error_id }
            - call: "POST /hatchery-schedules/${s3}/publish"
              payload: {}
              as: StoreManager
              captures: { s3_status: $.data.status }
          assert:
            - "gap_err == ERR_SCHEDULE_WINDOW_OVERLAP (Apr 5 start is only 5 days after Mar 31 end < 7-day gap)"
            - "s3_status == PUBLISHED (Apr 8 start leaves exactly 7 days after Mar 31 end — >= boundary allowed)"

  # ===========================================================================
  # Rule 9 — compensating_invariant: bird count vs points balance
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: reserve_cancel_leaves_lot_bird_conservation_exact
        grounds:
          - state_machines.ChickOrder.RESERVED_to_CANCELLED
          - entities.LivestockLot.fields.quantity_on_hand
        distinguishing_aspect: |
          Conserved quantity: bird allocation. Invariant
          quantity_received == quantity_on_hand + quantity_sold + mortality_count + quantity_quarantined
          holds before and after a reservation and its compensating cancellation;
          the pair leaves quantity_on_hand exactly unchanged.
        test_recipe:
          setup:
            - "Spring store; lot 100 ON_SALE; account; clock 2026-03-10T10:00:00Z."
          setup_api_calls:
            - *d3_clock_mar10
            - *d3_store
            - *d3_campaign
            - *d3_teardown
            - *d3_reset
            - *d3_verify
            - *d3_activate
            - *d3_schedule
            - *d3_publish
            - *d3_lot
            - *d3_open_sale
            - *d3_account
          trigger:
            - call: "POST /chick-orders"
              payload: { store_id: "${store_id}", livestock_lot_id: "${lot_id}", loyalty_account_id: "${acct_id}", quantity: 6, pickup_date: "2026-03-12T10:00:00Z", expected_livestock_lot_version: "${lot_v}" }
              as: Customer
              as_user_id: "${acct_id}"
              captures: { inv_order: $.data.id }
            - call: "GET /livestock-lots/${lot_id}"
              payload: {}
              as: StoreManager
              captures: { qoh_mid: $.data.quantity_on_hand }
            - call: "POST /chick-orders/${inv_order}/cancel"
              payload: { reason: "changed mind" }
              as: Customer
              as_user_id: "${acct_id}"
            - call: "GET /livestock-lots/${lot_id}"
              payload: {}
              as: StoreManager
              captures: { qoh_end: $.data.quantity_on_hand, mort_end: $.data.mortality_count, quar_end: $.data.quantity_quarantined, sold_end: $.data.quantity_sold }
          assert:
            - "qoh_mid == 94 (reservation removed 6)"
            - "qoh_end == 100 and sold_end == 0 and mort_end == 0 and quar_end == 0 (compensation restored the pool exactly)"
            - "invariant: 100 == qoh_end + sold_end + mort_end + quar_end"

      - name: accrual_reversal_leaves_points_balance_and_tier_exact
        grounds:
          - calculations.loyalty_tier_evaluation
          - entities.LoyaltyLedgerEntry.fields.related_entry_id
        distinguishing_aspect: |
          Conserved quantity: loyalty points (a different conserved quantity
          than bird count). Invariant points_balance == sum(points_delta) over
          all entries holds after an ACCRUAL and its compensating REVERSAL; the
          pair returns balance AND tier to their exact pre-accrual values.
        test_recipe:
          setup:
            - "WINTER_HEATING store; account with one ACCRUAL of 2499 qualifying points (balance 2499, tier NEIGHBOR); clock 2026-09-20T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T10:00:00Z" }
              as: RegionalAdmin
            - call: "POST /stores"
              payload: { store_name: "Bozeman Farm & Ranch", region_code: "MT-WEST" }
              as: RegionalAdmin
              captures: { w_store_id: $.data.id, w_store_v0: $.data.version }
            - call: "POST /season-campaigns"
              payload: { store_id: "${w_store_id}", season: "WINTER_HEATING", planogram_map: "winter-heat-v1", aisle_count: 1 }
              as: RegionalAdmin
              captures: { w_camp_id: $.data.id }
            - call: "POST /season-campaigns/${w_camp_id}/begin-teardown"
              payload: {}
              as: StoreManager
            - call: "POST /season-campaigns/${w_camp_id}/complete-reset"
              payload: { aisles_reset_count: 1 }
              as: StoreManager
            - call: "POST /season-campaigns/${w_camp_id}/verify"
              payload: { audit_passed: true }
              as: RegionalAdmin
            - call: "POST /season-campaigns/${w_camp_id}/activate"
              payload: { expected_store_version: "${w_store_v0}" }
              as: RegionalAdmin
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Ada Merritt", phone: "555-0121" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /loyalty-accounts/${acct_id}/ledger-entries"
              payload: { entry_type: "ACCRUAL", store_id: "${w_store_id}", base_amount_cents: 249900, earn_context: "OTHER" }
              as: StoreAssociate
              captures: { seed_entry: $.data.id }
          trigger:
            - call: "POST /loyalty-accounts/${acct_id}/ledger-entries"
              payload: { entry_type: "ACCRUAL", store_id: "${w_store_id}", base_amount_cents: 10000, earn_context: "OTHER" }
              as: StoreAssociate
              captures: { acc_entry: $.data.id, acc_points: $.data.points_delta }
            - call: "GET /loyalty-accounts/${acct_id}"
              payload: {}
              as: StoreAssociate
              captures: { bal_mid: $.data.points_balance, tier_mid: $.data.tier }
            - call: "POST /loyalty-accounts/${acct_id}/ledger-entries"
              payload: { entry_type: "REVERSAL", related_entry_id: "${acc_entry}", points_delta: -100 }
              as: StoreAssociate
            - call: "GET /loyalty-accounts/${acct_id}"
              payload: {}
              as: StoreAssociate
              captures: { bal_end: $.data.points_balance, tier_end: $.data.tier, qual_end: $.data.tier_qualifying_points }
          assert:
            - "acc_points == 100 and bal_mid == 2599 and tier_mid == RANCH_HAND (accrual crossed 2500)"
            - "bal_end == 2499 and tier_end == NEIGHBOR and qual_end == 2499 (compensating REVERSAL restored balance AND tier exactly)"
            - "invariant: points_balance == sum(points_delta) == 2499 + 100 - 100 == 2499"
