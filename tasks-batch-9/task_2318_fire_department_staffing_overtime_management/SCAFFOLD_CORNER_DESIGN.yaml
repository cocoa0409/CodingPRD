              as: CompanyOfficer
              as_user_id: "${ff130o}"
              captures: { asg130a: "$.data.id" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh130}", firefighter_id: "${ff130b}", apparatus_id: "${eng130}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh130_v0}" }
