# =============================================================================
# §1.8 Scaffold Difficulty Design — Missing Participant Search & Plan Termination
# 24 instances across the nine Difficulty Rules (R1:3, R2:2, R3:3, R4:3, R5:3,
# R6:3, R7:3, R8:2, R9:2). Every recipe replays from empty-DB using only §1.5.
# Pinned dates: proposed_termination_date T = 2026-10-15T00:00:00Z; default
# clock 2026-08-01T00:00:00Z is T-75 days (inside the NOIT [T-90, T-60] window).
# DISTRIBUTION notice effective 2026-10-20 -> default_treatment_date 2026-11-19.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: forfeiture_restoration_nominal_vs_adjusted
        grounds:
          - calculations.forfeiture_restoration_amount
          - entities.Forfeiture.fields.restoration_amount_cents
          - state_machines.Forfeiture.RECORDED_to_RESTORED
          - state_machines.Participant.FORFEITED_to_RESTORED
        distinguishing_aspect: |
          Dual-variant on the Forfeiture entity domain: identical forfeiture
          (800000 cents, 30 elapsed days) restores 800000 under NOMINAL but
          802959 under EARNINGS_ADJUSTED — the two policies are both valid
          readings of "restore the forfeited account" and produce different cents.
        test_recipe:
          setup:
            - "Two termination cases (NOMINAL and EARNINGS_ADJUSTED), each with one participant balance 800000 cents vested 100%, run through: NOIT -> effectuate -> DISTRIBUTION notice -> begin-distributions -> flag UNDELIVERABLE_MAIL -> declare-missing (user admin-1) -> full four-step search exhaustion -> SEARCH_PROTOCOL_SUMMARY log -> forfeiture by user fid-1 -> clock advanced exactly 30 days past the forfeiture -> participant located."
          setup_api_calls:
            # ---- NOMINAL leg ----
            - { call: "POST /termination-cases", payload: { plan_name: "Nominal Widgets 401k", sponsor_ein: "123456789", plan_number: "001", proposed_termination_date: "2026-10-15T00:00:00Z", restoration_policy: NOMINAL }, as: PlanAdministrator, captures: { c_n: "$.data.id", c_n_v: "$.data.version" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_n}", full_name: "Pat Nominal", ssn: "111223333", mailing_address: "1 Oak St", account_balance_cents: 800000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_n: "$.data.id" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_n}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_n_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_n}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "GET /termination-cases/${c_n}", payload: {}, as: PlanAdministrator, captures: { c_n_v2: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_n}", notice_type: DISTRIBUTION, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_n_v2}" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_n}/begin-distributions", payload: {}, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /participants/${p_n}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL, evidence_note: "statement returned" }, as: Recordkeeper }
            - { call: "POST /participants/${p_n}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { sc_n: "$.data.active_search_case_id" } }
            - { call: "POST /search-cases/${sc_n}/attempts", payload: { method: COMMERCIAL_LOCATOR, vendor_name: "Loc8", attempted_at: "2026-11-01T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_n}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_n}/attempts", payload: { method: PUBLIC_RECORDS, vendor_name: "PubRec", attempted_at: "2026-11-02T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_n}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_n}/attempts", payload: { method: CREDIT_BUREAU, vendor_name: "CBX", attempted_at: "2026-11-03T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_n}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_n}/attempts", payload: { method: CERTIFIED_MAIL, vendor_name: "USPS", attempted_at: "2026-11-04T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-19T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /search-cases/${sc_n}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /fiduciary-log-entries", payload: { termination_case_id: "${c_n}", entry_type: SEARCH_PROTOCOL_SUMMARY, narrative: "Exhausted commercial locator, public records, credit bureau, and certified mail steps with no result for this participant.", related_entity_id: "${sc_n}" }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /forfeitures", payload: { participant_id: "${p_n}", rationale: "Last-resort forfeiture after exhausted search; PBGC transfer declined for administrative cost reasons." }, as: IndependentFiduciary, as_user_id: "fid-1", captures: { f_n: "$.data.id" } }
            # ---- EARNINGS_ADJUSTED leg ----
            - { call: "POST /termination-cases", payload: { plan_name: "Adjusted Widgets 401k", sponsor_ein: "123456789", plan_number: "002", proposed_termination_date: "2026-10-15T00:00:00Z", restoration_policy: EARNINGS_ADJUSTED }, as: PlanAdministrator, captures: { c_e: "$.data.id", c_e_v: "$.data.version" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_e}", full_name: "Pat Adjusted", ssn: "444556666", mailing_address: "2 Elm St", account_balance_cents: 800000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_e: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /notices", payload: { termination_case_id: "${c_e}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_e_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_e}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "GET /termination-cases/${c_e}", payload: {}, as: PlanAdministrator, captures: { c_e_v2: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_e}", notice_type: DISTRIBUTION, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_e_v2}" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_e}/begin-distributions", payload: {}, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /participants/${p_e}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL, evidence_note: "statement returned" }, as: Recordkeeper }
            - { call: "POST /participants/${p_e}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { sc_e: "$.data.active_search_case_id" } }
            - { call: "POST /search-cases/${sc_e}/attempts", payload: { method: COMMERCIAL_LOCATOR, vendor_name: "Loc8", attempted_at: "2026-11-01T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_e}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_e}/attempts", payload: { method: PUBLIC_RECORDS, vendor_name: "PubRec", attempted_at: "2026-11-02T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_e}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_e}/attempts", payload: { method: CREDIT_BUREAU, vendor_name: "CBX", attempted_at: "2026-11-03T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_e}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_e}/attempts", payload: { method: CERTIFIED_MAIL, vendor_name: "USPS", attempted_at: "2026-11-04T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-19T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /search-cases/${sc_e}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /fiduciary-log-entries", payload: { termination_case_id: "${c_e}", entry_type: SEARCH_PROTOCOL_SUMMARY, narrative: "Exhausted commercial locator, public records, credit bureau, and certified mail steps with no result for this participant.", related_entity_id: "${sc_e}" }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /forfeitures", payload: { participant_id: "${p_e}", rationale: "Last-resort forfeiture after exhausted search; PBGC transfer declined for administrative cost reasons." }, as: IndependentFiduciary, as_user_id: "fid-1", captures: { f_e: "$.data.id" } }
            # ---- both forfeitures age exactly 30 days, then both resurface ----
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-19T00:00:00Z" }, as: PlanAdministrator }
          trigger:
            - { call: "POST /participants/${p_n}/locate", payload: { verified_address: "9 Pine Ave" }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /participants/${p_e}/locate", payload: { verified_address: "7 Birch Rd" }, as: PlanAdministrator, as_user_id: "admin-1" }
          assert:
            - "Forfeiture.${f_n}.status == RESTORED and Forfeiture.${f_n}.restoration_amount_cents == 800000 (NOMINAL restores exactly the forfeited amount)"
            - "Forfeiture.${f_e}.status == RESTORED and Forfeiture.${f_e}.restoration_amount_cents == 802959 (EARNINGS_ADJUSTED: 800000 + round_half_up(800000 * 0.045 * 30/365) = 800000 + 2959)"
            - "TerminationCase.${c_n}.total_plan_assets_cents == 800000 and sponsor_contribution_cents == 0 and remaining_undistributed_cents == 800000"
            - "TerminationCase.${c_e}.total_plan_assets_cents == 802959 and sponsor_contribution_cents == 2959 and remaining_undistributed_cents == 802959"
            - "Participant.${p_n}.distribution_status == RESTORED and Participant.${p_e}.distribution_status == RESTORED; identical forfeiture data produced different cents only because of the variant"

      - name: expense_allocation_prorata_vs_percapita
        grounds:
          - calculations.expense_allocation
          - entities.ExpenseAllocation.fields.method
          - entities.Participant.fields.termination_expense_share_cents
        distinguishing_aspect: |
          Dual-variant on the ExpenseAllocation/Participant domain (distinct from
          the Forfeiture domain of the sibling instance): identical inputs
          (balances 600000/400000, expense 10000) debit 6000/4000 under
          PRO_RATA_BY_BALANCE but 5000/5000 under EQUAL_PER_CAPITA.
        test_recipe:
          setup:
            - "Two cases, each with two participants (600000 and 400000 cents, vested 100%), effectuated to TERMINATION_EFFECTIVE; no elections submitted."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "ProRata Co 401k", sponsor_ein: "123456789", plan_number: "010", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_pr: "$.data.id", c_pr_v: "$.data.version" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_pr}", full_name: "A Six", ssn: "100000001", mailing_address: "1 A St", account_balance_cents: 600000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_pr1: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_pr}", full_name: "B Four", ssn: "100000002", mailing_address: "2 B St", account_balance_cents: 400000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_pr2: "$.data.id" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_pr}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_pr_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_pr}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "POST /termination-cases", payload: { plan_name: "PerCapita Co 401k", sponsor_ein: "123456789", plan_number: "011", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_pc: "$.data.id", c_pc_v: "$.data.version" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_pc}", full_name: "C Six", ssn: "100000003", mailing_address: "3 C St", account_balance_cents: 600000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_pc1: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_pc}", full_name: "D Four", ssn: "100000004", mailing_address: "4 D St", account_balance_cents: 400000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_pc2: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /notices", payload: { termination_case_id: "${c_pc}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_pc_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_pc}/effectuate-termination", payload: {}, as: PlanAdministrator }
          trigger:
            - { call: "POST /expense-allocations", payload: { termination_case_id: "${c_pr}", method: PRO_RATA_BY_BALANCE, total_expense_cents: 10000, description: "Final recordkeeper invoice" }, as: PlanAdministrator }
            - { call: "POST /expense-allocations", payload: { termination_case_id: "${c_pc}", method: EQUAL_PER_CAPITA, total_expense_cents: 10000, description: "Final recordkeeper invoice" }, as: PlanAdministrator }
          assert:
            - "Participant.${p_pr1}.termination_expense_share_cents == 6000 and net_distributable_cents == 594000"
            - "Participant.${p_pr2}.termination_expense_share_cents == 4000 and net_distributable_cents == 396000"
            - "Participant.${p_pc1}.termination_expense_share_cents == 5000 and net_distributable_cents == 595000"
            - "Participant.${p_pc2}.termination_expense_share_cents == 5000 and net_distributable_cents == 395000"
            - "TerminationCase.${c_pr}.expense_paid_cents == 10000 and remaining_undistributed_cents == 990000; TerminationCase.${c_pc} identical"
            - "Identical balances and expense produced different per-participant debits only because of the method variant"

      - name: pbgc_transfer_submission_net_vs_exhaustion_snapshot
        grounds:
          - calculations.pbgc_transfer_amount
          - entities.MissingSearchCase.fields.exhaustion_snapshot_cents
          - entities.PBGCTransfer.fields.amount_basis
        distinguishing_aspect: |
          Dual-variant on the PBGCTransfer entity domain (distinct from Forfeiture
          and ExpenseAllocation): two participants each exhausted at net 500000,
          then a 5000-cent pro-rata expense debits each 1923; the SUBMISSION_NET
          transfer moves 498077 while the EXHAUSTION_SNAPSHOT transfer moves
          500000 — two valid amount bases, different cents.
        test_recipe:
          setup:
            - "One case in DISTRIBUTION_IN_PROGRESS with participants A 500000, C 500000, D 300000 (vested 100%). A and C are MISSING with fully exhausted search cases (snapshot 500000 each, exhausted by admin-1) and SEARCH_PROTOCOL_SUMMARY logs. A 5000-cent PRO_RATA expense allocation then debits A 1923, C 1923, D 1154."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Snapshot Co 401k", sponsor_ein: "123456789", plan_number: "020", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_s: "$.data.id", c_s_v: "$.data.version" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_s}", full_name: "A Snap", ssn: "200000001", mailing_address: "1 A St", account_balance_cents: 500000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_a: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_s}", full_name: "C Snap", ssn: "200000002", mailing_address: "2 C St", account_balance_cents: 500000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_c: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_s}", full_name: "D Three", ssn: "200000003", mailing_address: "3 D St", account_balance_cents: 300000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_d: "$.data.id" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_s}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_s_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_s}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "GET /termination-cases/${c_s}", payload: {}, as: PlanAdministrator, captures: { c_s_v2: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_s}", notice_type: DISTRIBUTION, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_s_v2}" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_s}/begin-distributions", payload: {}, as: PlanAdministrator }
            # ---- exhaust A ----
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /participants/${p_a}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL }, as: Recordkeeper }
            - { call: "POST /participants/${p_a}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { sc_a: "$.data.active_search_case_id" } }
            - { call: "POST /search-cases/${sc_a}/attempts", payload: { method: COMMERCIAL_LOCATOR, vendor_name: "Loc8", attempted_at: "2026-11-01T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_a}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_a}/attempts", payload: { method: PUBLIC_RECORDS, vendor_name: "PubRec", attempted_at: "2026-11-02T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_a}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_a}/attempts", payload: { method: CREDIT_BUREAU, vendor_name: "CBX", attempted_at: "2026-11-03T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_a}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_a}/attempts", payload: { method: CERTIFIED_MAIL, vendor_name: "USPS", attempted_at: "2026-11-04T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-19T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /search-cases/${sc_a}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            # ---- exhaust C ----
            - { call: "POST /participants/${p_c}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL }, as: Recordkeeper }
            - { call: "POST /participants/${p_c}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { sc_c: "$.data.active_search_case_id" } }
            - { call: "POST /search-cases/${sc_c}/attempts", payload: { method: COMMERCIAL_LOCATOR, vendor_name: "Loc8", attempted_at: "2026-11-19T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_c}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_c}/attempts", payload: { method: PUBLIC_RECORDS, vendor_name: "PubRec", attempted_at: "2026-11-20T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_c}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_c}/attempts", payload: { method: CREDIT_BUREAU, vendor_name: "CBX", attempted_at: "2026-11-21T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_c}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_c}/attempts", payload: { method: CERTIFIED_MAIL, vendor_name: "USPS", attempted_at: "2026-11-22T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-07T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /search-cases/${sc_c}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            # ---- fiduciary documentation for both exhausted cases ----
            - { call: "POST /fiduciary-log-entries", payload: { termination_case_id: "${c_s}", entry_type: SEARCH_PROTOCOL_SUMMARY, narrative: "Exhausted commercial locator, public records, credit bureau, and certified mail steps with no result for this participant.", related_entity_id: "${sc_a}" }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /fiduciary-log-entries", payload: { termination_case_id: "${c_s}", entry_type: SEARCH_PROTOCOL_SUMMARY, narrative: "Exhausted commercial locator, public records, credit bureau, and certified mail steps with no result for this participant.", related_entity_id: "${sc_c}" }, as: PlanAdministrator, as_user_id: "admin-1" }
            # ---- expense allocation lands AFTER both exhaustions ----
            - { call: "POST /expense-allocations", payload: { termination_case_id: "${c_s}", method: PRO_RATA_BY_BALANCE, total_expense_cents: 5000, description: "Final audit fee" }, as: PlanAdministrator }
          trigger:
            - { call: "POST /pbgc-transfers", payload: { participant_id: "${p_a}", amount_basis: SUBMISSION_NET }, as: IndependentFiduciary, as_user_id: "fid-1", captures: { t_a: "$.data.id" } }
            - { call: "POST /pbgc-transfers", payload: { participant_id: "${p_c}", amount_basis: EXHAUSTION_SNAPSHOT }, as: IndependentFiduciary, as_user_id: "fid-1", captures: { t_c: "$.data.id" } }
          assert:
            - "Participant.${p_a}.net_distributable_cents == 498077 after the expense allocation (500000 - 1923)"
            - "Participant.${p_c}.net_distributable_cents == 498077 after the expense allocation"
            - "PBGCTransfer.${t_a}.amount_cents == 498077 (SUBMISSION_NET reflects the post-exhaustion expense debit)"
            - "PBGCTransfer.${t_c}.amount_cents == 500000 (EXHAUSTION_SNAPSHOT froze the benefit at exhaustion)"
            - "PBGCTransfer.${t_a}.amount_cents != PBGCTransfer.${t_c}.amount_cents despite identical pre-exhaustion balances"

  - rule_id: combinatorial_formula
    instances:
      - name: withholding_branch_interaction
        grounds:
          - calculations.net_payout_withholding
          - entities.Payout.fields.withholding_cents
        distinguishing_aspect: |
          Mode (a) — a formula with three inputs (gross, method, 20000-cent floor)
          and non-linear interaction (the floor gates the 20% branch): two
          participants with identical 120000-cent balances produce withholding
          24000 (LUMP_SUM_CHECK) versus 0 (DIRECT_ROLLOVER_IRA) and net 96000
          versus 120000 purely from the method branch.
        test_recipe:
          setup:
            - "Case in DISTRIBUTION_IN_PROGRESS with participants L and R, each 120000 cents vested 100%; each submits an election (L: LUMP_SUM_CHECK, R: DIRECT_ROLLOVER_IRA) which the administrator accepts."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Withhold Co 401k", sponsor_ein: "123456789", plan_number: "030", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_w: "$.data.id", c_w_v: "$.data.version" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_w}", full_name: "L Lump", ssn: "300000001", mailing_address: "1 L St", account_balance_cents: 120000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_l: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_w}", full_name: "R Roll", ssn: "300000002", mailing_address: "2 R St", account_balance_cents: 120000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_r: "$.data.id" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_w}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_w_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_w}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "GET /termination-cases/${c_w}", payload: {}, as: PlanAdministrator, captures: { c_w_v2: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_w}", notice_type: DISTRIBUTION, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_w_v2}" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_w}/begin-distributions", payload: {}, as: PlanAdministrator }
            - { call: "GET /participants/${p_l}", payload: {}, as: PlanAdministrator, captures: { p_l_v: "$.data.version" } }
            - { call: "GET /participants/${p_r}", payload: {}, as: PlanAdministrator, captures: { p_r_v: "$.data.version" } }
            - { call: "POST /distribution-elections", payload: { participant_id: "${p_l}", election_method: LUMP_SUM_CHECK, expected_participant_version: "${p_l_v}" }, as: PlanAdministrator, captures: { e_l: "$.data.id" } }
            - { call: "POST /distribution-elections", payload: { participant_id: "${p_r}", election_method: DIRECT_ROLLOVER_IRA, destination_detail: "IRA at Custodian X", expected_participant_version: "${p_r_v}" }, as: PlanAdministrator, captures: { e_r: "$.data.id" } }
          trigger:
            - { call: "POST /distribution-elections/${e_l}/accept", payload: {}, as: PlanAdministrator }
            - { call: "POST /distribution-elections/${e_r}/accept", payload: {}, as: PlanAdministrator }
            - { call: "GET /distribution-elections/${e_l}/payouts", payload: {}, as: PlanAdministrator, captures: { pay_l: "$.data[0].id" } }
            - { call: "GET /distribution-elections/${e_r}/payouts", payload: {}, as: PlanAdministrator, captures: { pay_r: "$.data[0].id" } }
          assert:
            - "Payout.${pay_l}.gross_cents == 120000 and withholding_cents == 24000 and net_cents == 96000 (gross >= 20000 floor and method LUMP_SUM_CHECK triggers the 20% branch)"
            - "Payout.${pay_r}.gross_cents == 120000 and withholding_cents == 0 and net_cents == 120000 (rollover branch never withholds)"
            - "Payout.${pay_l}.method == LUMP_SUM_CHECK and Payout.${pay_r}.method == DIRECT_ROLLOVER_IRA; identical gross produced different net only via the method branch"

      - name: expense_allocation_rounding_order
        grounds:
          - calculations.expense_allocation
          - entities.ExpenseAllocation.fields.remainder_recipient_participant_id
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (distinct mode from the
          sibling's branch interaction): 10000 cents over balances
          333333/333333/333334 rounds each share to 3333 first (sum 9999), then
          the 1-cent remainder is reconciled to the largest-balance participant
          (333334) — sum-then-round would have no remainder to place and a
          largest-first ordering would strand the cent elsewhere.
        test_recipe:
          setup:
            - "Case in TERMINATION_EFFECTIVE with three participants vested 100%: P1 333333, P2 333333, P3 333334 (P3 created last but holds the strictly largest balance)."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Rounding Co 401k", sponsor_ein: "123456789", plan_number: "031", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_r: "$.data.id", c_r_v: "$.data.version" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_r}", full_name: "P One", ssn: "300000011", mailing_address: "1 P St", account_balance_cents: 333333, vested_pct: 100 }, as: PlanAdministrator, captures: { p_r1: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_r}", full_name: "P Two", ssn: "300000012", mailing_address: "2 P St", account_balance_cents: 333333, vested_pct: 100 }, as: PlanAdministrator, captures: { p_r2: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_r}", full_name: "P Three", ssn: "300000013", mailing_address: "3 P St", account_balance_cents: 333334, vested_pct: 100 }, as: PlanAdministrator, captures: { p_r3: "$.data.id" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_r}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_r_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_r}/effectuate-termination", payload: {}, as: PlanAdministrator }
          trigger:
            - { call: "POST /expense-allocations", payload: { termination_case_id: "${c_r}", method: PRO_RATA_BY_BALANCE, total_expense_cents: 10000, description: "Termination audit" }, as: PlanAdministrator, captures: { ea_r: "$.data.id" } }
          assert:
            - "Participant.${p_r1}.termination_expense_share_cents == 3333 (round_half_up(10000 * 333333 / 1000000) = 3333)"
            - "Participant.${p_r2}.termination_expense_share_cents == 3333"
            - "Participant.${p_r3}.termination_expense_share_cents == 3334 (3333 rounded share + 1-cent remainder)"
            - "ExpenseAllocation.${ea_r}.remainder_recipient_participant_id == ${p_r3} (largest vested_balance wins the remainder)"
            - "TerminationCase.${c_r}.expense_paid_cents == 10000 and the three shares sum to exactly 10000 (no rounding drift)"
  - rule_id: non_linear_state_machine
    instances:
      - name: participant_parallel_state_dimensions
        grounds:
          - state_machines.Participant
          - entities.Participant.fields.locate_status
          - entities.Participant.fields.distribution_status
        distinguishing_aspect: |
          Participant carries two independent state dimensions on one row (a
          non-linear shape distinct from the sibling instances' cycle and revert):
          driving locate_status UNVERIFIED -> FLAGGED_UNDELIVERABLE -> MISSING ->
          LOCATED never moves distribution_status off PENDING_ELECTION, and a
          subsequent election submission moves distribution_status to
          ELECTION_SUBMITTED without touching locate_status (LOCATED).
        test_recipe:
          setup:
            - "Case in DISTRIBUTION_IN_PROGRESS with one participant (250000 cents, vested 100%)."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Parallel Co 401k", sponsor_ein: "123456789", plan_number: "040", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_p: "$.data.id", c_p_v: "$.data.version" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_p}", full_name: "Para Dim", ssn: "400000001", mailing_address: "1 P St", account_balance_cents: 250000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_p: "$.data.id" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_p}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_p_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_p}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "GET /termination-cases/${c_p}", payload: {}, as: PlanAdministrator, captures: { c_p_v2: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_p}", notice_type: DISTRIBUTION, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_p_v2}" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_p}/begin-distributions", payload: {}, as: PlanAdministrator }
          trigger:
            - { call: "POST /participants/${p_p}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL }, as: Recordkeeper }
            - { call: "POST /participants/${p_p}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /participants/${p_p}/locate", payload: { verified_address: "5 New Ln" }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "GET /participants/${p_p}", payload: {}, as: PlanAdministrator, captures: { p_p_v: "$.data.version" } }
            - { call: "POST /distribution-elections", payload: { participant_id: "${p_p}", election_method: DIRECT_ROLLOVER_IRA, expected_participant_version: "${p_p_v}" }, as: PlanAdministrator }
          assert:
            - "After declare-missing: Participant.${p_p}.locate_status == MISSING while distribution_status == PENDING_ELECTION (locate dimension moved; money dimension untouched)"
            - "After locate: Participant.${p_p}.locate_status == LOCATED while distribution_status == PENDING_ELECTION"
            - "After election: Participant.${p_p}.distribution_status == ELECTION_SUBMITTED while locate_status == LOCATED (money dimension moved; locate dimension untouched)"

      - name: search_case_reopen_cycle
        grounds:
          - state_machines.MissingSearchCase.RESOLVED_to_STEP1_COMMERCIAL_LOCATOR
          - state_machines.MissingSearchCase
          - entities.Participant.fields.active_search_case_id
        distinguishing_aspect: |
          MissingSearchCase is cyclic (STEP1 -> RESOLVED -> STEP1) on a different
          entity than the sibling instances: resolving then re-declaring missing
          reopens the SAME search case row at STEP1_COMMERCIAL_LOCATOR with
          resolved_at cleared, opened_at preserved, and attempt history intact.
        test_recipe:
          setup:
            - "Case (DRAFT is sufficient for the locate lifecycle) with one participant; participant flagged UNDELIVERABLE_MAIL and declared missing at the default clock; search case sc created."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Cycle Co 401k", sponsor_ein: "123456789", plan_number: "041", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_cy: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_cy}", full_name: "Cy Clist", ssn: "400000002", mailing_address: "2 C St", account_balance_cents: 250000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_cy: "$.data.id" } }
            - { call: "POST /participants/${p_cy}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL }, as: Recordkeeper }
            - { call: "POST /participants/${p_cy}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { sc_cy: "$.data.active_search_case_id" } }
            - { call: "POST /search-cases/${sc_cy}/attempts", payload: { method: COMMERCIAL_LOCATOR, vendor_name: "Loc8", attempted_at: "2026-08-01T00:00:00Z", outcome: LOCATED }, as: PlanAdministrator, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /participants/${p_cy}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL, evidence_note: "mail returned again" }, as: Recordkeeper }
            - { call: "POST /participants/${p_cy}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { sc_cy2: "$.data.active_search_case_id" } }
            - { call: "GET /search-cases/${sc_cy}", payload: {}, as: PlanAdministrator, captures: { sc_status: "$.data.status" } }
          assert:
            - "The LOCATED attempt resolved the cycle's first pass: after that attempt the case was RESOLVED and Participant.${p_cy}.locate_status == LOCATED"
            - "${sc_cy2} == ${sc_cy} (reopen reuses the same search case row, no new row created)"
            - "MissingSearchCase.${sc_cy}.status == STEP1_COMMERCIAL_LOCATOR and resolved_at == null (cycle restarted)"
            - "MissingSearchCase.${sc_cy}.opened_at == 2026-08-01T00:00:00Z (original open time preserved) and attempt_count == 1 (history intact)"
            - "Participant.${p_cy}.locate_status == MISSING"

      - name: termination_case_reconciliation_revert_cycle
        grounds:
          - state_machines.TerminationCase.FINAL_RECONCILIATION_to_DISTRIBUTION_IN_PROGRESS
          - state_machines.TerminationCase.DISTRIBUTION_IN_PROGRESS_to_FINAL_RECONCILIATION
          - errors[ERR_NO_REOPENABLE_PARTICIPANT]
        distinguishing_aspect: |
          TerminationCase has a revert edge (DISTRIBUTION_IN_PROGRESS ->
          FINAL_RECONCILIATION -> DISTRIBUTION_IN_PROGRESS) — a different entity
          and a different non-linear shape than the sibling instances: the case
          can complete reconciliation only while all participants are resolved,
          and a forfeited participant resurfacing knocks the case back into
          distribution processing.
        test_recipe:
          setup:
            - "Case with p1 (200000) and p2 (800000), both vested 100%, in DISTRIBUTION_IN_PROGRESS. p1 rolls over (election accepted, payout cleared). p2 is missing with an exhausted, documented search and a recorded forfeiture. Case advanced to FINAL_RECONCILIATION (all resolved, residual 0)."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Revert Co 401k", sponsor_ein: "123456789", plan_number: "042", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_rv: "$.data.id", c_rv_v: "$.data.version" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_rv}", full_name: "Roll One", ssn: "400000003", mailing_address: "1 R St", account_balance_cents: 200000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_rv1: "$.data.id" } }
            - { call: "POST /participants", payload: { termination_case_id: "${c_rv}", full_name: "Forfeit Two", ssn: "400000004", mailing_address: "2 F St", account_balance_cents: 800000, vested_pct: 100 }, as: PlanAdministrator, captures: { p_rv2: "$.data.id" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_rv}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_rv_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_rv}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "GET /termination-cases/${c_rv}", payload: {}, as: PlanAdministrator, captures: { c_rv_v2: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_rv}", notice_type: DISTRIBUTION, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_rv_v2}" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_rv}/begin-distributions", payload: {}, as: PlanAdministrator }
            - { call: "GET /participants/${p_rv1}", payload: {}, as: PlanAdministrator, captures: { p_rv1_v: "$.data.version" } }
            - { call: "POST /distribution-elections", payload: { participant_id: "${p_rv1}", election_method: DIRECT_ROLLOVER_IRA, expected_participant_version: "${p_rv1_v}" }, as: PlanAdministrator, captures: { e_rv1: "$.data.id" } }
            - { call: "POST /distribution-elections/${e_rv1}/accept", payload: {}, as: PlanAdministrator }
            - { call: "GET /distribution-elections/${e_rv1}/payouts", payload: {}, as: PlanAdministrator, captures: { pay_rv1: "$.data[0].id" } }
            - { call: "POST /payouts/${pay_rv1}/mark-cleared", payload: {}, as: Recordkeeper }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /participants/${p_rv2}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL }, as: Recordkeeper }
            - { call: "POST /participants/${p_rv2}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { sc_rv: "$.data.active_search_case_id" } }
            - { call: "POST /search-cases/${sc_rv}/attempts", payload: { method: COMMERCIAL_LOCATOR, vendor_name: "Loc8", attempted_at: "2026-11-01T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_rv}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_rv}/attempts", payload: { method: PUBLIC_RECORDS, vendor_name: "PubRec", attempted_at: "2026-11-02T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_rv}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_rv}/attempts", payload: { method: CREDIT_BUREAU, vendor_name: "CBX", attempted_at: "2026-11-03T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_rv}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_rv}/attempts", payload: { method: CERTIFIED_MAIL, vendor_name: "USPS", attempted_at: "2026-11-04T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-19T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /search-cases/${sc_rv}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
