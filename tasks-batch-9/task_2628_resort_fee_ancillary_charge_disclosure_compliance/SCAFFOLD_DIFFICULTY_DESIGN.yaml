  - rule_id: priority_pair_validation_conflict
    instances:

      - name: stale_property_version_outranks_property_not_active_on_program_create
        grounds:
          - validations[priority=10]
          - validations[priority=16]
          - concurrency_rules.fee-program-create-stale-property
          - errors.ERR_STALE_PROPERTY_VERSION
          - errors.ERR_PROPERTY_NOT_ACTIVE
        distinguishing_aspect: |
          One request violates a concurrency rule at priority 10 (412) and a state
          rule at priority 16 (409) at the same time, and only the 412 may be
          returned. The natural implementation order is the opposite — load the
          property, see it is INACTIVE, reject with 409 — so an implementation
          that checks business state before comparing versions returns
          ERR_PROPERTY_NOT_ACTIVE and fails. The control call proves the 409 is
          genuinely armed rather than absent.
        test_recipe:
          setup:
            - "An ACTIVE property p_live whose version is bumped to 2 by creating one fee program against it, giving a real captured version that is stale for any other property"
            - "A second property p_off created directly in status INACTIVE, whose version is still 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: false, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_nv: $.data.id }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Mirage Sands Resort", brand_code: "MSR", base_room_rate_cents: 29900, status: "ACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p_live: $.data.id, p_live_v1: $.data.version }
            - call: "POST /fee-programs"
              payload: { property_id: "${p_live}", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p_live_v1}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
            - call: "GET /properties/${p_live}"
              payload: {}
              as: RevenueManager
              as_user_id: "u-rev-1"
              captures: { p_live_v2: $.data.version }
            - call: "POST /properties"
              payload: { jurisdiction_id: "${j_nv}", name: "Shuttered Sands Inn", brand_code: "SSI", base_room_rate_cents: 19900, status: "INACTIVE" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p_off: $.data.id, p_off_v: $.data.version }
          trigger:
            - call: "POST /fee-programs"
              payload: { property_id: "${p_off}", version_label: "FY26-Q4", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z", expected_property_version: "${p_live_v2}" }
              as: RevenueManager
              as_user_id: "u-rev-1"
          assert:
            - "Property.${p_live}.version == 2 and Property.${p_off}.version == 1, so ${p_live_v2} is a genuinely stale version for ${p_off}"
            - "the trigger returns HTTP 412 with data.error_id == ERR_STALE_PROPERTY_VERSION"
            - "the trigger does NOT return ERR_PROPERTY_NOT_ACTIVE and does NOT return HTTP 409"
            - "the response envelope is { success: false, data: null, error: { code: \"ERR_STALE_PROPERTY_VERSION\", message: <string>, details: <object|null> } }"
            - "control: repeating the same call with expected_property_version ${p_off_v} returns HTTP 409 with data.error_id == ERR_PROPERTY_NOT_ACTIVE, proving the priority-16 rule is armed and was merely outranked"
            - "no FeeProgram was created for ${p_off} by either call, and Property.${p_off}.version is still 1"

      - name: mandatory_fee_ban_outranks_missing_inclusion_on_publish
        grounds:
          - validations[priority=19]
          - validations[priority=22]
          - errors.ERR_MANDATORY_FEE_BANNED_IN_JURISDICTION
          - errors.ERR_MANDATORY_FEE_WITHOUT_INCLUSION
          - calculations.fee_program_rollup
        distinguishing_aspect: |
          A different error-category pair — business_safety at priority 19 against
          business_referential at priority 22 — and, unlike the first instance,
          BOTH candidate errors carry the same HTTP status 422, so the status code
          alone cannot distinguish a correct implementation from an incorrect one;
          only data.error_id can. The sibling program in a jurisdiction without the
          ban isolates the priority-22 rule and proves it is armed.
        test_recipe:
          setup:
            - "Jurisdiction US-NV-CLARK with mandatory_fee_ban TRUE, and jurisdiction US-AZ-MARICOPA with mandatory_fee_ban FALSE"
            - "One ACTIVE property in each jurisdiction, each with a program holding exactly one MANDATORY fee and NO FeeInclusion at all, both driven to UNDER_REVIEW"
            - "TaxabilityRule rows exist for RESORT in both jurisdictions, so priority 23 is satisfied and cannot interfere"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /jurisdictions"
              payload: { code: "US-NV-CLARK", name: "Clark County NV", occupancy_tax_rate_bps: 1338, first_quote_total_required: true, itemization_required_on_folio: true, mandatory_fee_ban: true, opt_out_mandate: true }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { j_ban: $.data.id }
            - call: "POST /jurisdictions"
