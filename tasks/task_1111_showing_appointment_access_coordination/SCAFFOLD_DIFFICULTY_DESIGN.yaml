  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: buffered_halfopen_showing_overlap
        grounds:
          - calculations.calc_buffered_overlap
          - "validations[priority=11]"
        distinguishing_aspect: |
          Resource = Listing via ShowingRequest intervals; semantics = buffered
          half-open. With buffer 30 an existing CONFIRMED 10:00-10:30 blocks
          [09:30, 11:00): a new request starting at 10:59 conflicts
          (ERR_SHOWING_OVERLAP_CONFLICT) while one starting at exactly 11:00 is
          allowed (touching the buffered boundary).
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; VACANT auto-approve listing L (buffer 30)"
            - "R1 10:00-10:30 confirmed"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Fifteen", license_number: "LIC-LA-15", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Fifteen", license_number: "LIC-BA-15", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-15" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SB15", contact_email: "sb15@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "90 Buffer Blvd", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
          trigger:
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:59:00Z", end_at: "2026-05-01T11:29:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { err: $.data.error_id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T11:00:00Z", end_at: "2026-05-01T11:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r2_st: $.data.status } }
          assert:
            - "10:59 start rejected: error_id == ERR_SHOWING_OVERLAP_CONFLICT (10:59 < 11:00 buffered boundary)"
            - "11:00 start succeeds: status == APPROVED (half-open: touching is allowed)"
      - name: closed_interval_blackout_overlap
        grounds:
          - calculations.calc_buffered_overlap
          - "validations[priority=12]"
          - entities.BlackoutWindow
        distinguishing_aspect: |
          Different resource (BlackoutWindow) and different interval semantics
          (closed, no buffer): with blackout [2026-05-02T10:00, 2026-05-02T11:00]
          a request starting at exactly 11:00 CONFLICTS (11:00 <= blackout end,
          closed bound) while 11:01 succeeds — the opposite boundary behavior
          from the buffered half-open showing rule.
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; seller SM; VACANT auto-approve listing L"
            - "blackout window on L covering 2026-05-02T10:00:00Z through 2026-05-02T11:00:00Z inclusive"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Sixteen", license_number: "LIC-LA-16", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Sixteen", license_number: "LIC-BA-16", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-16" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SB16", contact_email: "sb16@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "91 Blackout Bay", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/listings/${l_id}/blackout-windows", payload: { start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T11:00:00Z", reason: "contractor visit" }, as: Seller, as_user_id: "${s_id}", captures: { bw_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-02T11:00:00Z", end_at: "2026-05-02T11:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { err: $.data.error_id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-02T11:01:00Z", end_at: "2026-05-02T11:31:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r_st: $.data.status } }
          assert:
            - "11:00 start rejected: error_id == ERR_BLACKOUT_CONFLICT (closed interval: start <= blackout.end_at)"
            - "11:01 start succeeds: status == APPROVED"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: inv1_confirmed_count_confirm_cancel
        grounds:
          - entities.Listing.fields.confirmed_showing_count
          - state_machines.ShowingRequest.APPROVED_to_CONFIRMED
          - state_machines.ShowingRequest.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = per-listing confirmed slot count, pinned as
          Listing.confirmed_showing_count == count(requests of listing in
          CONFIRMED). confirm (+1) followed by cancel (-1) returns it to 0 with
          no drift; the cancel is >= 24h before start so no strike is issued.
        test_recipe:
          setup:
            - "clock 2026-05-01T00:00:00Z; verified buyer BA; LA; VACANT auto-approve listing L"
            - "R1 2026-05-02T10:00-10:30Z auto-APPROVED (34h lead, so cancel at t0 is not a late cancel)"
          setup_api_calls:
            - { call: "POST /showing-desk/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/agents", payload: { full_name: "LA Seventeen", license_number: "LIC-LA-17", brokerage_name: "B1" }, as: Anonymous, captures: { la_id: $.data.id } }
            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Seventeen", license_number: "LIC-BA-17", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-17" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SB17", contact_email: "sb17@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "100 Invariant Rd", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-02T10:00:00Z", end_at: "2026-05-02T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r1_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/showing-requests/${r1_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "GET /showing-desk/listings/${l_id}", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { cc_after_confirm: $.data.confirmed_showing_count } }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/cancel", payload: { reason: "plans changed" }, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "GET /showing-desk/listings/${l_id}", payload: {}, as: ListingAgent, as_user_id: "${la_id}", captures: { cc_after_cancel: $.data.confirmed_showing_count } }
            - { call: "GET /showing-desk/agents/${ba_id}", payload: {}, as: PlatformAdmin, captures: { ba_pts: $.data.active_strike_points } }
          assert:
            - "after confirm: confirmed_showing_count == 1"
            - "after cancel: confirmed_showing_count == 0 (forward + compensating legs cancel exactly)"
            - "buyer active_strike_points == 0 (34h lead => no LATE_CANCEL strike)"
      - name: inv2_strike_points_issue_forgive
        grounds:
          - entities.Agent.fields.active_strike_points
          - state_machines.StrikeRecord.ACTIVE_to_FORGIVEN
          - calculations.calc_agent_standing
        distinguishing_aspect: |
          Different conserved quantity = per-agent active strike points, pinned
          as sum of weights of ACTIVE StrikeRecords. A LATE_CANCEL issue (+10)
          paired with forgive (-10) returns active_strike_points to 0 and
          standing to GOOD_STANDING with no drift.
