      - name: concentration_share_exactly_60pct_no_addon
        grounds:
          - calculations.maintenance_requirement
        distinguishing_aspect: |
          Metric position share (cross-multiplied bps) on POST
          /margin/market-marks: at share exactly 6000bps
          (600000*10000 == 6000*1000000) no add-on applies (strict >);
          one cent of price uptick flips the add-on to +1000bps and lifts
          house_req_realtime from 300000 to 360024.
        test_recipe:
          setup:
            - "Account holds 60 ABC (mv 600000) and 40 XYZ (mv 400000), both marks 10000; ABC share exactly 6000bps"
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "Con Centration", email: "con@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "ABC", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_abc: $.data.id } }
            - { call: "POST /margin/security-profiles", payload: { symbol: "XYZ", marginable: true, house_maint_long_bps: 3000, house_maint_short_bps: 3500, liquidity_tier: 1, concentration_threshold_bps: 6000 }, as: MarginSupervisor, captures: { sec_xyz: $.data.id } }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_xyz}", mark_type: "REALTIME", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_xyz}", mark_type: "OFFICIAL_CLOSE", price_cents: 10000 }, as: MarketDataOps }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 50000000, liquid_net_worth_cents: 90000000, investment_experience_years: 7 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-1", captures: { acct_id: $.data.account_id } }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { acct_v0: $.data.version } }
            - { call: "POST /margin/accounts/${acct_id}/cash-movements", payload: { movement_type: "DEPOSIT", amount_cents: 1200000, expected_account_version: "${acct_v0}" }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_abc}", side: "BUY", quantity: 60 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "POST /margin/accounts/${acct_id}/orders", payload: { security_id: "${sec_xyz}", side: "BUY", quantity: 40 }, as: Customer, as_user_id: "${c_id}" }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { house_rt_0: $.data.house_req_realtime_cents } }
          trigger:
            - { call: "POST /margin/market-marks", payload: { security_id: "${sec_abc}", mark_type: "REALTIME", price_cents: 10001 }, as: MarketDataOps }
            - { call: "GET /margin/accounts/${acct_id}", payload: {}, as: MarginSupervisor, captures: { house_rt_1: $.data.house_req_realtime_cents } }
          assert:
            - "house_req_realtime_cents before tick == 300000  # 600000*0.30 + 400000*0.30; share exactly 6000bps -> no add-on"
            - "house_req_realtime_cents after +1-cent tick == 360024  # 600060*4000/10000=240024 (+1000bps add-on) + 120000"

  # ==========================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: liquidation_requires_call_expired_pair_liqorder_call
        grounds:
          - state_machines.MarginCall.EXPIRED_to_LIQUIDATION_IN_PROGRESS
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair LiquidationOrder -> MarginCall: creating a liquidation
