              as_user_id: "${so_id}"
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /drills"
              payload: { plan_id: "${plan_id}", scenario_type: "ACTIVE_ASSAILANT", scheduled_at: "2026-08-01T09:00:00Z" }
