  - section: validations
    instances:
      - name: missing_auth_headers
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call with no X-User-ID/X-User-Role headers fails at priority 1 before any other check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /treasury/enrollments/00000000-0000-0000-0000-000000000000", payload: {}, as: "NONE", captures: { err: $.data.error_id } }
          assert: ["err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), NOT 404 — auth outranks existence"]

      - name: invalid_enum_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        distinguishing_aspect: "Shape (p4) precedes existence (p5): a decision call with an invalid enum on a nonexistent exception id returns ERR_INVALID_REQUEST, not ERR_NOT_FOUND. Caller is a legitimate DECISION_MAKER so role and ownership layers pass."
        test_recipe:
          setup: ["One enrollment with a DECISION_MAKER user (never activated — irrelevant: the request never reaches state checks)"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "ShpCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
          trigger:
            - { call: "POST /treasury/exceptions/00000000-0000-0000-0000-000000000000/decision", payload: { decision: "MAYBE" }, as: CustomerDecisionMaker, as_user_id: "${dm}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST (400)"]
      - name: shape_beats_occ_stale_version
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]"]
        distinguishing_aspect: "A PATCH carrying BOTH an invalid enum and a stale expected version returns the shape error (p4) before OCC (p6) is evaluated."
        test_recipe:
          setup: ["Enrollment created (version 1), then patched once so version advances to 2"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "OrdCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id, v1: $.data.version } }
            - { call: "PATCH /treasury/enrollments/${enr}", payload: { expected_enrollment_version: "${v1}", decision_window_hours: 30 }, as: BankTreasuryManager, captures: { v2: $.data.version } }
          trigger:
            - { call: "PATCH /treasury/enrollments/${enr}", payload: { expected_enrollment_version: "${v1}", default_decision: "HOLD" }, as: BankTreasuryManager, captures: { err: $.data.error_id } }
          assert:
            - "v2 == 2 (first patch advanced the version, so ${v1} is stale at trigger time)"
            - "err == ERR_INVALID_REQUEST — shape outranks OCC; NOT ERR_STALE_VERSION"

      - name: enrollment_state_beats_exception_state
        claim_type: priority_ordering
        grounds: ["validations[priority=7]"]
        distinguishing_aspect: "Within the state layer, outer-scope (enrollment) preconditions evaluate before the target resource's own state: a decision on a DEFAULTED exception of a SUSPENDED enrollment returns ERR_ENROLLMENT_NOT_ACTIVE."
        test_recipe:
          setup: ["ACTIVE REVERSE-tier enrollment; exception created then swept to DEFAULTED_RETURN; enrollment then suspended"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "ScopeCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "RETURN" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "830001" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 100, payee_name_raw: "A", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { ex: $.data.exception_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: BankOps }
            - { call: "POST /treasury/ops-runs", payload: { kind: "DAILY_SWEEP", enrollment_id: "${enr}" }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/suspend", payload: {}, as: BankTreasuryManager }
          trigger:
            - { call: "POST /treasury/exceptions/${ex}/decision", payload: { decision: "PAY" }, as: CustomerDecisionMaker, as_user_id: "${dm}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_ENROLLMENT_NOT_ACTIVE (enrollment scope), NOT ERR_EXCEPTION_NOT_OPEN (resource scope)"]

      - name: customer_write_blocked_on_pending_enrollment
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ENROLLMENT_NOT_ACTIVE]"]
        distinguishing_aspect: "PENDING_ACTIVATION (never activated) blocks customer writes exactly like SUSPENDED."
        test_recipe:
          setup: ["Enrollment created but never activated; account and admin user exist"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "PendCo", tier: "POSITIVE_PAY", default_decision: "PAY" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "830002" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
          trigger:
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-PEND", rows: [ { check_number: "1", amount_cents: 100, payee_name: "P", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}", captures: { err: $.data.error_id } }
          assert: ["err == ERR_ENROLLMENT_NOT_ACTIVE (409)"]

  - section: endpoints
    instances:
      - name: extend_deadline_success_once
        claim_type: conditional_action
        grounds: [entities.ExceptionItem.fields.extended_once]
        distinguishing_aspect: "A BankOps extension moves the deadline (once); a decision between the old and extended deadline now succeeds, proving the extension is effective."
        test_recipe:
          setup: ["ACTIVE REVERSE-tier enrollment (ROLLING_HOURS 24); exception created at clock 2026-08-03T10:00:00Z (deadline 2026-08-04T10:00:00Z)"]
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "ExtCo", tier: "REVERSE_POSITIVE_PAY", default_decision: "PAY", deadline_mode: "ROLLING_HOURS", decision_window_hours: 24 }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "840001" }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: BankOps }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "1", amount_cents: 100, payee_name_raw: "A", channel: "TELLER" }, as: BankOps, captures: { ex: $.data.exception_id } }
            - { call: "GET /treasury/exceptions/${ex}", payload: {}, as: BankOps, captures: { d0: $.data.decision_deadline_at } }
          trigger:
            - { call: "POST /treasury/exceptions/${ex}/extend-deadline", payload: { new_deadline_at: "2026-08-05T09:00:00Z" }, as: BankOps, captures: { d1: $.data.decision_deadline_at, xo: $.data.extended_once } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T11:00:00Z" }, as: BankOps }
