            - { call: "GET /rescue-ops/confined-spaces/${sp2}", as: OperationsManager, captures: { sp2_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp2}/entry-permits", payload: { purpose: "Duty job 2", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-04T20:00:00Z", expected_space_version: "${sp2_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per2: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per2}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per2}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per2}/standby-assignments", payload: { rescuer_id: "${r2_id}", standby_start_at: "2026-08-03T05:00:00Z", standby_end_at: "2026-08-04T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa2: "$.data.id" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa2}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
