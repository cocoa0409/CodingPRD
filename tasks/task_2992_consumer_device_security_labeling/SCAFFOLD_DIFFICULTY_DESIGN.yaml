              as_user_id: "${mfr_small_id}"
          trigger:
            - call: "POST /labeling/assessments/${asmt_at_min_id}/decide"
              payload: { decision: "APPROVED", reviewer_note: "Score sits exactly on the TIER_1 minimum." }
              as: ConformityReviewer
              as_user_id: "reviewer-1"
            - call: "POST /labeling/assessments/${asmt_below_min_id}/decide"
              payload: { decision: "APPROVED", reviewer_note: "Attempted approval one hundredth below the TIER_1_STRICT minimum." }
              as: ConformityReviewer
              as_user_id: "reviewer-1"
          assert:
            - "ConformanceAssessment.${asmt_at_min_id}.decided_overall_score == 80.80 and grade == B"
            - "ConformanceAssessment.${asmt_below_min_id}.decided_overall_score == 80.80 and grade == B"
            - "the decide call on ${asmt_at_min_id} returns 201 and ConformanceAssessment.${asmt_at_min_id}.status == APPROVED (80.80 >= 80.80 is inclusive)"
            - "the decide call on ${asmt_below_min_id} -> ERR_SCORE_BELOW_MINIMUM (422) because 80.80 < 80.81"
            - "ConformanceAssessment.${asmt_below_min_id}.status is still UNDER_REVIEW and decided_by_user_id is null"
            - "neither assessment has gate_applied == true (decided_min_area_score == 60.00 is not below AREA_FLOOR_SCORE 60.00)"

      - name: empty_and_zero_count_denominators_in_program_evaluation
        metric: "program_evaluation rate denominators: enrolled_manufacturer_count and respondents_count at the empty-set and zero-count edges, plus the inclusive survey_period_end == clock boundary"
        grounds:
          - calculations.program_evaluation
          - endpoints.GET_labeling_program_evaluation
          - entities.RecognitionSurvey.fields.survey_period_end
        distinguishing_aspect: |
          A different metric family (percentage rates, not scores) on a different endpoint: with no
          manufacturers and no in-period surveys BOTH denominators are empty and both rates must be
          0.00 rather than null or a divide-by-zero, and a survey whose survey_period_end equals the
          logical clock exactly must be INCLUDED (35.00 == RECOGNITION_TARGET_PCT flips the grade to
          PARTIAL) while a future-dated wave with 90/100 recognition must stay excluded.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "No manufacturers, no products, no label grants."
            - "One future-dated recognition survey wave: survey_period_end 2026-12-31T00:00:00Z, respondents_count 100, recognized_count 90."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/recognition-surveys"
              payload: { survey_period_label: "2026-Q4", survey_period_end: "2026-12-31T00:00:00Z", respondents_count: 100, recognized_count: 90 }
              as: ProgramAdministrator
              captures: { survey_future_id: $.data.id }
          trigger:
            - call: "GET /labeling/program-evaluation"
              as: ProgramAdministrator
              as_user_id: "admin-intake-1"
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Northwind Devices LLC", contact_email: "compliance@northwind.example", enterprise_class: "SMALL", annual_us_revenue_cents: 250000000 }
              as: ProgramAdministrator
              captures: { mfr_small_id: $.data.id }
            - call: "GET /labeling/program-evaluation"
              as: ProgramAdministrator
              as_user_id: "admin-intake-1"
            - call: "POST /labeling/recognition-surveys"
              payload: { survey_period_label: "2026-Q3", survey_period_end: "2026-08-01T00:00:00Z", respondents_count: 40, recognized_count: 14 }
              as: ProgramAdministrator
              captures: { survey_boundary_id: $.data.id }
            - call: "GET /labeling/program-evaluation"
              as: ProgramAdministrator
              as_user_id: "admin-intake-1"
          assert:
            - "probe 1 (empty program): enrolled_manufacturer_count == 0, participating_manufacturer_count == 0, manufacturer_participation_rate == 0.00"
            - "probe 1: eligible_product_count == 0, labeled_product_count == 0"
            - "probe 1: respondents_count == 0, recognized_total == 0, consumer_recognition_rate == 0.00 (the future-dated wave is excluded)"
            - "probe 1: evaluation_grade == BELOW_TARGET, and the response is 200 with no null rate and no server error"
            - "probe 2 (one enrolled manufacturer, zero grants): enrolled_manufacturer_count == 1, participating_manufacturer_count == 0, manufacturer_participation_rate == 0.00"
            - "probe 3 (survey_period_end exactly equal to the clock): respondents_count == 40, recognized_total == 14, consumer_recognition_rate == 35.00"
            - "probe 3: consumer_recognition_rate 35.00 >= RECOGNITION_TARGET_PCT 35.00 is inclusive, so evaluation_grade == PARTIAL, not BELOW_TARGET"
            - "probe 3: the 2026-12-31 wave is still excluded, so recognized_total is 14 and not 104"

  # =========================================================================
  # RULE 7 — cross-entity state dependencies on DIFFERENT entity pairs
  #   instance 1: LabelGrant issuance depends on Manufacturer.standing
  #   instance 2: RetailerDisplayAuthorization depends on the LabelGrant's
  #               two status dimensions
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: grant_issuance_requires_manufacturer_standing_good
        entity_pair: [LabelGrant, Manufacturer]
        grounds:
          - validations.priority_70_ERR_SPONSOR_DELINQUENT
          - state_machines.EnforcementCase.penalty_status.ASSESSED_to_PAID
          - calculations.manufacturer_penalty_ledger
          - entities.Manufacturer.fields.standing
        distinguishing_aspect: |
          The blocking state lives on a THIRD entity the request never names: the grant request carries
          only product_id and assessment_id, yet its outcome depends on the sponsoring Manufacturer's
          standing, which is itself derived from EnforcementCase ledger totals. Paying the penalty
          moves standing DELINQUENT -> GOOD and the byte-identical request then succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "TIER_1 tier, ELIGIBLE SMART_SPEAKER category, five-criterion catalogue."
            - "One SMALL manufacturer with an ELIGIBLE speaker product whose assessment is APPROVED."
            - "An upheld UNAUTHORIZED_DISPLAY case of 6 IN_STORE units against that manufacturer: penalty 28980, outstanding 28980, standing DELINQUENT, penalty_status ASSESSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /labeling/program-tiers"
              payload: { tier_code: "TIER_1", required_route: "SELF_ATTESTATION", label_validity_days: 365, min_overall_score: 80.80, unverified_weight_factor: 0.60, issuance_base_fee_cents: 40000, max_deficiency_rounds: 2 }
              as: ProgramAdministrator
              captures: { tier1_id: $.data.id }
            - call: "POST /labeling/device-categories"
              payload: { category_code: "SMART_SPEAKER", display_name: "Smart Speaker", eligibility_status: "ELIGIBLE", program_tier_id: "${tier1_id}", min_support_period_days: 730 }
              as: ProgramAdministrator
              captures: { cat_speaker_id: $.data.id }
            - call: "POST /labeling/security-criteria"
              payload: { criteria: [ { criterion_code: "AUTH-1", practice_area: "AUTHENTICATION", weight: 60, requires_lab_verification: true, criterion_text: "Unique per-device credentials or forced change at first use" }, { criterion_code: "AUTH-2", practice_area: "AUTHENTICATION", weight: 40, requires_lab_verification: false, criterion_text: "Brute-force resistant authentication with lockout" }, { criterion_code: "UPD-1", practice_area: "SOFTWARE_UPDATE", weight: 100, requires_lab_verification: true, criterion_text: "Signed automatic security updates for the declared support period" }, { criterion_code: "DATA-1", practice_area: "DATA_PROTECTION", weight: 100, requires_lab_verification: false, criterion_text: "Personal data encrypted in transit and at rest" }, { criterion_code: "VDP-1", practice_area: "VULN_DISCLOSURE", weight: 100, requires_lab_verification: false, criterion_text: "Published vulnerability disclosure policy with monitored contact" } ] }
              as: ProgramAdministrator
              captures: { crit_auth1_id: "$.data[0].id", crit_auth2_id: "$.data[1].id", crit_upd1_id: "$.data[2].id", crit_data1_id: "$.data[3].id", crit_vdp1_id: "$.data[4].id" }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Northwind Devices LLC", contact_email: "compliance@northwind.example", enterprise_class: "SMALL", annual_us_revenue_cents: 250000000 }
              as: ProgramAdministrator
              captures: { mfr_small_id: $.data.id }
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_small_id}", device_category_id: "${cat_speaker_id}", model_name: "Northwind Speaker S1", sku: "NW-SPK-S1", firmware_version: "1.0.0", declared_support_period_end: "2030-01-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 12000 }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { prod_speaker_id: $.data.id, prod_speaker_v: $.data.version }
            - call: "POST /labeling/products/${prod_speaker_id}/assessments"
              payload: { expected_product_version: "${prod_speaker_v}" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
              captures: { asmt_std_id: $.data.id }
            - call: "POST /labeling/assessments/${asmt_std_id}/responses"
              payload: { responses: [ { criterion_id: "${crit_auth1_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH1" }, { criterion_id: "${crit_auth2_id}", self_declared_conformant: true, evidence_ref: "EV-AUTH2" }, { criterion_id: "${crit_upd1_id}", self_declared_conformant: true, evidence_ref: "EV-UPD1" }, { criterion_id: "${crit_data1_id}", self_declared_conformant: true, evidence_ref: "EV-DATA1" }, { criterion_id: "${crit_vdp1_id}", self_declared_conformant: true, evidence_ref: "EV-VDP1" } ] }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/assessments/${asmt_std_id}/submit"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/assessments/${asmt_std_id}/decide"
              payload: { decision: "APPROVED", reviewer_note: "Self-attested score 80.80 meets the tier minimum." }
              as: ConformityReviewer
              as_user_id: "reviewer-1"
            - call: "POST /labeling/enforcement-cases"
              payload: { subject_manufacturer_id: "${mfr_small_id}", reported_scannable_code: "ZZ-NO-SUCH-CODE-0005", violation_type: "UNAUTHORIZED_DISPLAY", violation_line_items: [ { retail_listing_ref: "LST-STORE-E", channel: "IN_STORE", unit_count: 6 } ], reporter_note: "Unregistered mark on six retail units." }
              as: ProgramAdministrator
              as_user_id: "admin-intake-1"
              captures: { case_std_id: $.data.id }
            - call: "POST /labeling/enforcement-cases/${case_std_id}/notice"
              payload: { notice_reference: "NOT-2026-1005" }
              as: ProgramAdministrator
              as_user_id: "admin-notice-1"
            - call: "POST /labeling/enforcement-cases/${case_std_id}/adjudicate"
              payload: { outcome: "UPHELD", adjudication_note: "Established." }
              as: ProgramAdministrator
              as_user_id: "admin-adjudicate-1"
          trigger:
            - call: "POST /labeling/label-grants"
              payload: { product_id: "${prod_speaker_id}", assessment_id: "${asmt_std_id}" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/enforcement-cases/${case_std_id}/penalty-payments"
              payload: { payment_reference: "PAY-2026-0005" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
            - call: "POST /labeling/label-grants"
              payload: { product_id: "${prod_speaker_id}", assessment_id: "${asmt_std_id}" }
              as: Manufacturer
              as_user_id: "${mfr_small_id}"
          assert:
            - "the first grant request -> ERR_SPONSOR_DELINQUENT (402) even though the assessment is APPROVED, the category is ELIGIBLE and the spec revision matches"
            - "after the payment Manufacturer.${mfr_small_id}.outstanding_penalty_cents == 0, paid_penalty_cents == 28980, total_assessed_penalty_cents == 28980"
            - "after the payment Manufacturer.${mfr_small_id}.standing == GOOD"
            - "EnforcementCase.${case_std_id}.penalty_status == PAID and case_status is still ADJUDICATED_UPHELD"
            - "the identical second grant request returns 201 with LabelGrant.grant_status == PENDING_REGISTRY and issuance_fee_cents == 40000"
            - "Manufacturer.${mfr_small_id}.upheld_case_count == 1 after payment (payment does not clear the case count, only the balance)"

      - name: display_authorization_requires_published_active_grant
        entity_pair: [RetailerDisplayAuthorization, LabelGrant]
        grounds:
          - validations.priority_64_ERR_GRANT_NOT_PUBLISHED
          - state_machines.LabelGrant.registry_publication_status
          - errors.ERR_GRANT_NOT_PUBLISHED
          - endpoints.POST_labeling_display_authorizations
