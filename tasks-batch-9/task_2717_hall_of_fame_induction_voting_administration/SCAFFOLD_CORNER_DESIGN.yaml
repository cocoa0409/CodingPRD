          header and nominated_by_elector_id are the SAME unknown uuid, which keeps the priority-41
          identity-match rule satisfied and would otherwise fall to the priority-8 not-found rule; the
          lower-numbered priority-4 check wins with 403 ERR_ELECTOR_IDENTITY_UNKNOWN rather than 404.
