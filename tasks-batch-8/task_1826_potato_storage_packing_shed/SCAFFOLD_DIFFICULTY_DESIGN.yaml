          - state_machines.StorageShed.QUARANTINED_to_NORMAL
          - calculations.wash_water_result
        distinguishing_aspect: |
          StorageShed posture cycles NORMAL -> RESTRICTED -> NORMAL -> QUARANTINED -> NORMAL on
          consecutive-fail counting and the severe-turbidity flag — a cyclic derived machine on a
          different entity (StorageShed) than the PackOrder cycle.
        test_recipe:
          setup:
            - "Empty shed S; five wash checks drive the posture through its full cycle"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
