              as_user_id: "${g14_id}"
          trigger:
            - call: "GET /members/${m14_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${fa2_id}"
              captures: { mv14a: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${m14_id}", site_id: "${fa2_id}", alt_id_presented: "5550000014", points_committed: 300, expected_member_version: "${mv14a}" }
              as: PumpTerminal
              as_user_id: "${fa2_id}"
