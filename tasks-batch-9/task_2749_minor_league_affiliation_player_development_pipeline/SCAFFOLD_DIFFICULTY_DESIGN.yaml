            - "Player.${p5_id}.current_affiliate_id == ${aff5_id} after the DENY"

      - name: facility_review_remediation_reopen_cycle_returns_to_remediation_submitted
        grounds:
          - state_machines.FacilityStandardReview.OPEN_to_REMEDIATION_SUBMITTED
          - state_machines.FacilityStandardReview.REMEDIATION_SUBMITTED_to_CLOSED
          - state_machines.FacilityStandardReview.CLOSED_to_REOPENED
          - state_machines.FacilityStandardReview.REOPENED_to_REMEDIATION_SUBMITTED
          - entities.FacilityStandardReview.fields.reopen_count
          - entities.FacilityStandardReview.fields.remediation_due_date
        distinguishing_aspect: |
          This instance exercises the CYCLIC shape rather than parallel
          dimensions: a single review re-enters REMEDIATION_SUBMITTED a second
          time through CLOSED -> REOPENED, and the reopen both increments
          reopen_count to 1 and REWRITES remediation_due_date from the
          review-date-derived 2026-05-31 to clock + 15 days = 2026-04-16.
        test_recipe:
          setup:
            - "The logical clock is moved to 2026-04-01T00:00:00Z so both remediation submissions fall inside their windows."
            - "A HIGH_A affiliate with an ACTIVE agreement (minimum_active_players 0)."
            - "A WEIGHT_ROOM review dated 2026-04-01 with score 84, i.e. deficiency_level MINOR, status OPEN and remediation_due_date 2026-05-31 (review_date + 60)."
