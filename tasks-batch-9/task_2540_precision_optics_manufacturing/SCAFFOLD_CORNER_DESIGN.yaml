              payload: { instrument_code: "IF-2540-FINE", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0006, last_calibrated_utc: "2026-08-01T00:00:00Z", lateral_resolution_um: 5.0 }
              as: PlantAdmin
