# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Shelf-Life & Sensory Panel Testing
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 and is replayable from
# empty-DB via its structured setup_api_calls chain.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: StudyArm vs Panelist)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: shelf_life_realtime_vs_q10_accelerated
        grounds:
          - calculations.shelf_life_equivalent_days
          - calculations.date_code_recommendation
          - entities.Study.fields.q10_factor
          - entities.StudyArm.fields.computed_failure_day_equiv
        distinguishing_aspect: |
          Same observed failure at day_index 15: the REAL_TIME study (factor 1)
          yields arm failure day 15.0 and computed_days 7, while the ACCELERATED
          study (q10 2.0, 40C vs 20C ref, factor 4.0) yields 60.0 equivalent days
          and computed_days 42 — two valid algorithms on the same schedule data
          produce different date codes (entity domain: StudyArm/Study).
        test_recipe:
          setup:
            - "Two studies, RT (REAL_TIME, storage 20C, ref 20C) and AC (ACCELERATED, storage 40C, q10 2.0), identical otherwise: 1 control arm, 1 time point at day_index 15, both in ANALYSIS with the time point SKIPPED"
            - "An APC result of 8.0 (limit 6.0, tripped) posted at day-15 time point of each study, so each control arm has a tripped micro endpoint at day_index 15"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Acme RT", contact_email: "rt@acme.com" }, as: LabDirector, captures: { client_rt: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_rt}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_rt}", product_name: "Cracker RT", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_rt: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_rt}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_rt: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_rt}", day_index: 15 }, as: SensoryScientist, captures: { tp_rt: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_rt}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_rt}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_rt}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_rt}/skip", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_rt}/close-fieldwork", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/lab-test-results", payload: { study_id: "${study_rt}", arm_id: "${arm_rt}", time_point_id: "${tp_rt}", test_type: "APC", measured_value: 8.0 }, as: LabAnalyst, captures: { lr_rt: $.data.id } }
            - { call: "POST /sensory-lab/clients", payload: { name: "Acme AC", contact_email: "ac@acme.com" }, as: LabDirector, captures: { client_ac: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_ac}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_ac}", product_name: "Cracker AC", study_type: "ACCELERATED", storage_temp_c: 40, reference_temp_c: 20, q10_factor: 2.0, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_ac: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_ac}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_ac: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_ac}", day_index: 15 }, as: SensoryScientist, captures: { tp_ac: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_ac}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_ac}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_ac}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_ac}/skip", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_ac}/close-fieldwork", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/lab-test-results", payload: { study_id: "${study_ac}", arm_id: "${arm_ac}", time_point_id: "${tp_ac}", test_type: "APC", measured_value: 8.0 }, as: LabAnalyst }
            - { call: "GET /sensory-lab/studies/${study_rt}", payload: {}, as: SensoryScientist, captures: { study_rt_v: $.data.version } }
            - { call: "GET /sensory-lab/studies/${study_ac}", payload: {}, as: SensoryScientist, captures: { study_ac_v: $.data.version } }
          trigger:
            - { call: "POST /sensory-lab/date-code-recommendations", payload: { study_id: "${study_rt}", arm_id: "${arm_rt}", expected_study_version: "${study_rt_v}" }, as: SensoryScientist, captures: { rec_rt: $.data.id } }
            - { call: "POST /sensory-lab/date-code-recommendations", payload: { study_id: "${study_ac}", arm_id: "${arm_ac}", expected_study_version: "${study_ac_v}" }, as: SensoryScientist, captures: { rec_ac: $.data.id } }
          assert:
            - "StudyArm.${arm_rt}.computed_failure_day_equiv == 15.0 (REAL_TIME: factor 1, chronological day as-is)"
            - "StudyArm.${arm_ac}.computed_failure_day_equiv == 60.0 (ACCELERATED_Q10: 15 * 2.0**((40-20)/10) = 60.000)"
            - "DateCodeRecommendation.${rec_rt}.computed_days == 7 (floor(15*0.8)=12, tier 7, floor(12/7)*7=7)"
            - "DateCodeRecommendation.${rec_ac}.computed_days == 42 (floor(60*0.8)=48, tier 7, floor(48/7)*7=42)"
            - "DateCodeRecommendation.${rec_rt}.basis == ENDPOINT_MIN and DateCodeRecommendation.${rec_ac}.basis == ENDPOINT_MIN"

      - name: panelist_consistency_provisional_vs_final
        grounds:
          - calculations.panelist_consistency_index
          - entities.Panelist.fields.consistency_index_provisional
          - entities.Panelist.fields.consistency_index_final
        distinguishing_aspect: |
          Same raw scores ([8,6,6,6] on every attribute): PROVISIONAL (locked
          sessions, own-score-inclusive mean 6.5) gives index 70.00 while FINAL
          (analyzed sessions, leave-one-out mean 6.0) gives 60.00 — two valid
          variants on Panelist (a different entity domain than StudyArm) diverge
          on identical data.
        test_recipe:
          setup:
            - "REAL_TIME study (threshold 6.0, delta 3.0, target 60) IN_PROGRESS with 1 control arm, 1 time point at day 0, 4 pulled EVALUATION units in a 20C chamber"
            - "Session S for the arm at tp0, 2026-08-01T10:00-11:00Z, required_panelist_count 4 (default variance 2.25, delta 3.0)"
            - "Panelists p1..p4 all QUALIFIED (acuity 90, 3 trainings each), all 6 attributes qualified, all ASSIGNED to S; clock at 2026-08-01T10:00:00Z; S OPEN"
            - "Scores recorded: p1 scores 8 on all 6 attributes; p2, p3, p4 score 6 on all 6 attributes; all four assignments SUBMITTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Panel Co", contact_email: "pc@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Yogurt", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_id: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_id}", day_index: 0 }, as: SensoryScientist, captures: { tp_id: $.data.id } }
            - { call: "POST /sensory-lab/chambers", payload: { chamber_code: "CH-20", temp_c: 20, capacity_units: 10 }, as: LabDirector, captures: { chamber_id: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_id}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_id}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_id}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_id}/pull", payload: { chamber_id: "${chamber_id}", arm_id: "${arm_id}", quantity: 4, unit_purpose: "EVALUATION" }, as: SensoryScientist }
            - { call: "POST /sensory-lab/evaluation-sessions", payload: { study_id: "${study_id}", time_point_id: "${tp_id}", arm_id: "${arm_id}", scheduled_start_utc: "2026-08-01T10:00:00Z", scheduled_end_utc: "2026-08-01T11:00:00Z" }, as: PanelCoordinator, captures: { sess_id: $.data.id, sess_required: $.data.required_panelist_count } }
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "P One", email: "p1@lab.com", qualified_attributes: ["APPEARANCE", "AROMA", "FLAVOR", "TEXTURE", "OFF_FLAVOR", "OVERALL"] }, as: PanelCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /sensory-lab/panelists/${p1}/record-screening", payload: { acuity_score: 90 }, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p1}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p1}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p1}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "P Two", email: "p2@lab.com", qualified_attributes: ["APPEARANCE", "AROMA", "FLAVOR", "TEXTURE", "OFF_FLAVOR", "OVERALL"] }, as: PanelCoordinator, captures: { p2: $.data.id } }
            - { call: "POST /sensory-lab/panelists/${p2}/record-screening", payload: { acuity_score: 90 }, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p2}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p2}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p2}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "P Three", email: "p3@lab.com", qualified_attributes: ["APPEARANCE", "AROMA", "FLAVOR", "TEXTURE", "OFF_FLAVOR", "OVERALL"] }, as: PanelCoordinator, captures: { p3: $.data.id } }
            - { call: "POST /sensory-lab/panelists/${p3}/record-screening", payload: { acuity_score: 90 }, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p3}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p3}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p3}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists", payload: { full_name: "P Four", email: "p4@lab.com", qualified_attributes: ["APPEARANCE", "AROMA", "FLAVOR", "TEXTURE", "OFF_FLAVOR", "OVERALL"] }, as: PanelCoordinator, captures: { p4: $.data.id } }
            - { call: "POST /sensory-lab/panelists/${p4}/record-screening", payload: { acuity_score: 90 }, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p4}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p4}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panelists/${p4}/record-training", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${sess_id}", panelist_id: "${p1}" }, as: PanelCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${sess_id}", panelist_id: "${p2}" }, as: PanelCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${sess_id}", panelist_id: "${p3}" }, as: PanelCoordinator, captures: { a3: $.data.id } }
            - { call: "POST /sensory-lab/panel-assignments", payload: { session_id: "${sess_id}", panelist_id: "${p4}" }, as: PanelCoordinator, captures: { a4: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/evaluation-sessions/${sess_id}/open", payload: {}, as: PanelCoordinator }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a1}", attribute: "APPEARANCE", score: 8 }, as: Panelist, as_user_id: "${p1}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a1}", attribute: "AROMA", score: 8 }, as: Panelist, as_user_id: "${p1}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a1}", attribute: "FLAVOR", score: 8 }, as: Panelist, as_user_id: "${p1}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a1}", attribute: "TEXTURE", score: 8 }, as: Panelist, as_user_id: "${p1}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a1}", attribute: "OFF_FLAVOR", score: 8 }, as: Panelist, as_user_id: "${p1}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a1}", attribute: "OVERALL", score: 8 }, as: Panelist, as_user_id: "${p1}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a2}", attribute: "APPEARANCE", score: 6 }, as: Panelist, as_user_id: "${p2}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a2}", attribute: "AROMA", score: 6 }, as: Panelist, as_user_id: "${p2}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a2}", attribute: "FLAVOR", score: 6 }, as: Panelist, as_user_id: "${p2}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a2}", attribute: "TEXTURE", score: 6 }, as: Panelist, as_user_id: "${p2}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a2}", attribute: "OFF_FLAVOR", score: 6 }, as: Panelist, as_user_id: "${p2}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a2}", attribute: "OVERALL", score: 6 }, as: Panelist, as_user_id: "${p2}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a3}", attribute: "APPEARANCE", score: 6 }, as: Panelist, as_user_id: "${p3}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a3}", attribute: "AROMA", score: 6 }, as: Panelist, as_user_id: "${p3}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a3}", attribute: "FLAVOR", score: 6 }, as: Panelist, as_user_id: "${p3}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a3}", attribute: "TEXTURE", score: 6 }, as: Panelist, as_user_id: "${p3}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a3}", attribute: "OFF_FLAVOR", score: 6 }, as: Panelist, as_user_id: "${p3}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a3}", attribute: "OVERALL", score: 6 }, as: Panelist, as_user_id: "${p3}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a4}", attribute: "APPEARANCE", score: 6 }, as: Panelist, as_user_id: "${p4}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a4}", attribute: "AROMA", score: 6 }, as: Panelist, as_user_id: "${p4}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a4}", attribute: "FLAVOR", score: 6 }, as: Panelist, as_user_id: "${p4}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a4}", attribute: "TEXTURE", score: 6 }, as: Panelist, as_user_id: "${p4}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a4}", attribute: "OFF_FLAVOR", score: 6 }, as: Panelist, as_user_id: "${p4}" }
            - { call: "POST /sensory-lab/attribute-scores", payload: { assignment_id: "${a4}", attribute: "OVERALL", score: 6 }, as: Panelist, as_user_id: "${p4}" }
          trigger:
            - { call: "POST /sensory-lab/evaluation-sessions/${sess_id}/lock", payload: {}, as: PanelCoordinator }
            - { call: "GET /sensory-lab/panelists/${p1}", payload: {}, as: PanelCoordinator, captures: { prov_idx: $.data.consistency_index_provisional, fin_idx_pre: $.data.consistency_index_final } }
            - { call: "POST /sensory-lab/evaluation-sessions/${sess_id}/analyze", payload: {}, as: SensoryScientist }
            - { call: "GET /sensory-lab/panelists/${p1}", payload: {}, as: PanelCoordinator, captures: { fin_idx: $.data.consistency_index_final } }
          assert:
            - "after lock: Panelist.${p1}.consistency_index_provisional == 70.0 (mean [8,6,6,6] = 6.5 inclusive; penalty 1.5; 100 - 20*1.5 = 70.00)"
            - "after lock: Panelist.${p1}.consistency_index_final is null (no ANALYZED session yet)"
            - "after analyze: Panelist.${p1}.consistency_index_final == 60.0 (leave-one-out mean 6.0; penalty 2.0; 100 - 20*2.0 = 60.00)"
            - "PROVISIONAL != FINAL on identical raw scores (70.0 vs 60.0)"
            - "EvaluationSession.${sess_id}.overall_mean == 6.5"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes (a), (b), (c) — all three distinct)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: date_code_tiered_increment_floor
        grounds:
          - calculations.date_code_recommendation
          - entities.DateCodeRecommendation.fields.computed_days
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with nested floor and a conditional tier. Study A
          trips at day 100 (safety 80 < 90 -> 7-day tier -> 77 days); Study B
          never trips (target fallback 120 -> safety 96 >= 90 -> 30-day tier ->
          90 days) — the tier boundary at safety_days == 90 flips the increment
          and the two branches are both exercised.
        test_recipe:
          setup:
            - "Study A: REAL_TIME, target 60, 1 control arm, tp day 100, ANALYSIS, APC 7.0 (tripped) posted at tp100 -> arm failure day 100.0"
            - "Study B: REAL_TIME, target 120, 1 control arm, tp day 0 SKIPPED, ANALYSIS, nothing tripped"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Tier A", contact_email: "a@tier.com" }, as: LabDirector, captures: { client_a: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_a}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_a}", product_name: "Sauce A", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_a: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_a}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_a: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_a}", day_index: 100 }, as: SensoryScientist, captures: { tp_a: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_a}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_a}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_a}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_a}/skip", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_a}/close-fieldwork", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/lab-test-results", payload: { study_id: "${study_a}", arm_id: "${arm_a}", time_point_id: "${tp_a}", test_type: "APC", measured_value: 7.0 }, as: LabAnalyst }
            - { call: "POST /sensory-lab/clients", payload: { name: "Tier B", contact_email: "b@tier.com" }, as: LabDirector, captures: { client_b: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_b}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_b}", product_name: "Sauce B", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 120, sensory_fail_threshold: 6.0, min_detectable_difference: 3.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_b: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_b}", packaging_variant: "MAP", is_control: true }, as: SensoryScientist, captures: { arm_b: $.data.id } }
            - { call: "POST /sensory-lab/sampling-time-points", payload: { study_id: "${study_b}", day_index: 0 }, as: SensoryScientist, captures: { tp_b: $.data.id } }
            - { call: "POST /sensory-lab/studies/${study_b}/submit-design", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_b}/approve-design", payload: {}, as: LabDirector }
            - { call: "POST /sensory-lab/studies/${study_b}/activate", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/sampling-time-points/${tp_b}/skip", payload: {}, as: SensoryScientist }
            - { call: "POST /sensory-lab/studies/${study_b}/close-fieldwork", payload: {}, as: SensoryScientist }
            - { call: "GET /sensory-lab/studies/${study_a}", payload: {}, as: SensoryScientist, captures: { study_a_v: $.data.version } }
            - { call: "GET /sensory-lab/studies/${study_b}", payload: {}, as: SensoryScientist, captures: { study_b_v: $.data.version } }
          trigger:
