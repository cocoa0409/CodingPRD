        distinguishing_aspect: "Counter is a two-party operation whose roles list is exactly [Volunteer, PartnerContact]: the issuing manager cannot negotiate against itself, so counter_round stays 0, terms_revision_no stays 1 and the agreement stays SENT rather than COUNTERED."
