            - "${scope_after_co1} == 11.5"
            - "${cost_after_co1} == 188504"
            - "RemediationChangeOrder.${co1_id}.status == SUPERSEDED"
            - "RemediationChangeOrder.${co1_id}.decided_at == null"
            - "RemediationChangeOrder.${co1_id}.line_amount_cents == 3504"
            - "RemediationChangeOrder.${co2_id}.status == APPROVED"
