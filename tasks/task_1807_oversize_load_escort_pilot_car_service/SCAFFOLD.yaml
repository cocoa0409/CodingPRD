# =============================================================================
# Task 1807: Oversize Load Escort & Pilot Car Service — benchmark seed tables
# Certified pilot car company: job booking with dimensions & route, per-state
# escort requirement determination, certified escort assignment & equipment,
# route survey & obstruction identification, travel-time/curfew compliance,
# driver/police communication protocol, delay/standby billing, incident &
# damage liability.
# =============================================================================

scenario: |
  Oversize Load Escort & Pilot Car Service (certified pilot car company): job
  booking with dimensions & route, escort requirement determination by state,
  certified escort assignment & equipment (height pole/signage), route survey &
  obstruction identification, travel-time restriction & curfew compliance,
  communication protocol with driver & police escort coordination,
  delay/standby billing, incident & damage liability.

domain_name: oversize-load-escort
api_prefix: ""

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - optimistic_concurrency
  entity_topology: hybrid          # Carrier/Escort peers; Job -> RouteLeg tree; Permit/RouteSurvey/Obstruction under RouteLeg; Assignment/DelayEvent/Incident/Invoice cross-cutting
  state_machine_shape: cyclic      # Job hold/resume loop, RouteLeg blocked/reopen loop, Incident dispute loop, Invoice dispute/adjust loop, Escort suspend/reinstate loop
  relationship_patterns:
    - one_to_many                  # Job -> RouteLeg -> Permit/RouteSurvey -> Obstruction
    - cross_aggregate              # EscortAssignment joins RouteLeg (job aggregate) with Escort (resource pool)
    - polymorphic: false
  role_model: segregation_of_duties  # reporter != assessor (incidents); generator != finalizer/adjuster (invoices)
  consistency_model: immediate

# =============================================================================
# §1.1: Entity-Relationship Table
# All measurements in whole inches / whole minutes / integer cents.
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: carrier_name, type: string, source: input, description: "Carrier (trucking company) display name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open credit extended to this carrier; > 0" }
      - { name: ytd_billed_cents, type: integer, source: computed, default: 0, description: "Sum of total_cents over this carrier's invoices that transitioned to PAID in the current calendar year (UTC)" }
      - { name: credit_available_cents, type: integer, source: computed, description: "credit_limit_cents minus quoted holds on jobs in {BOOKED, CLEARED, SCHEDULED, EN_ROUTE, ON_HOLD} minus total_cents of invoices in {FINALIZED, DISPUTED} (CALC carrier_credit_availability)" }

  - name: Escort
    parent: null
    common_fields: true
    fields:
      - { name: operator_name, type: string, source: input, description: "Pilot car operator display name" }
      - { name: certified_state_codes, type: array, source: input, description: "Non-empty array of state codes this escort is certified to operate in (subset of {TX, OK, KS, LA})" }
      - { name: has_height_pole, type: boolean, source: input, default: false, description: "Whether the escort vehicle carries a height pole" }
      - { name: height_pole_max_inches, type: integer, source: input, default: 0, description: "Maximum settable height of the pole in inches; must be > 0 when has_height_pole is true" }
      - { name: reliability_score, type: integer, source: computed, default: 100, description: "0..100; starts 100; decremented at incident settlement per escort_reliability_update; floor 0" }
      - { name: escort_status, type: enum, source: system, description: "ACTIVE | SUSPENDED; auto-SUSPENDED when reliability_score < 40 at settlement" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "Count of this escort's assignments in {ACCEPTED, ACTIVE}; maintained on every assignment transition" }

  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; the booking customer" }
      - { name: load_description, type: string, source: input, description: "Free-text description of the oversize load" }
      - { name: width_inches, type: integer, source: input, description: "Overall load width in inches; > 0" }
      - { name: height_inches, type: integer, source: input, description: "Overall load height in inches; > 0" }
      - { name: length_inches, type: integer, source: input, description: "Overall load length in inches; > 0" }
      - { name: gross_weight_lbs, type: integer, source: input, description: "Gross vehicle weight in pounds; > 0" }
      - { name: window_start_at, type: datetime, source: input, description: "Planned movement start (UTC); escorts are blocked across [window_start_at, window_end_at]" }
      - { name: window_end_at, type: datetime, source: input, description: "Planned movement end (UTC); must be > window_start_at" }
      - { name: legs, type: array, source: input, description: "Creation-only array of leg specs: {state_code, sequence_index, distance_miles, planned_entry_at, planned_exit_at, map_min_clearance_inches}; >= 1 element; state_code in {TX, OK, KS, LA}" }
      - { name: job_status, type: enum, source: system, description: "DRAFT | QUOTED | BOOKED | CLEARED | SCHEDULED | EN_ROUTE | ON_HOLD | DELIVERED | CLOSED | CANCELLED" }
      - { name: quoted_cents, type: integer, source: computed, description: "Provisional quote total per quote_estimate; null until QUOTED; cleared on amendment" }
      - { name: quoted_at, type: datetime, source: system, description: "When the quote was generated; null until QUOTED" }
      - { name: quote_expires_at, type: datetime, source: computed, description: "quoted_at + 72h; accept-quote requires now < quote_expires_at" }
      - { name: booked_at, type: datetime, source: system, description: "When quote was accepted; null until BOOKED" }
      - { name: departed_at, type: datetime, source: system, description: "Actual departure timestamp; null until EN_ROUTE" }
      - { name: delivered_at, type: datetime, source: system, description: "Actual delivery timestamp; null until DELIVERED" }
      - { name: cancelled_at, type: datetime, source: system, description: "Cancellation timestamp; null until CANCELLED" }
      - { name: cancel_fee_cents, type: integer, source: computed, default: 0, description: "Cancellation fee per cancellation_fee calc; 0 until CANCELLED" }
      - { name: cancel_fee_tier, type: enum, source: computed, description: "NONE | TIER_10 | TIER_25 | TIER_50 keyed on job_status at cancel time; null until CANCELLED" }
      - { name: total_escort_positions, type: integer, source: computed, default: 0, description: "Sum over legs of (required_front_escorts + required_rear_escorts); set at quote" }

  - name: RouteLeg
    parent: Job
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; owning job" }
      - { name: state_code, type: string, source: input, description: "State this leg traverses; in {TX, OK, KS, LA}" }
      - { name: sequence_index, type: integer, source: input, description: "Order of the leg within the route; >= 0" }
      - { name: distance_miles, type: integer, source: input, description: "Leg distance in miles; > 0" }
      - { name: planned_entry_at, type: datetime, source: input, description: "Planned state-line entry (UTC)" }
      - { name: planned_exit_at, type: datetime, source: input, description: "Planned state-line exit (UTC); must be > planned_entry_at" }
      - { name: map_min_clearance_inches, type: integer, source: input, description: "Minimum overhead clearance along leg per map database; >= 0; used by the map_estimate clearance variant" }
      - { name: leg_status, type: enum, source: system, description: "PENDING | DETERMINED | CLEARED | BLOCKED | COMPLETED | CANCELLED" }
      - { name: required_front_escorts, type: integer, source: computed, default: 0, description: "Per escort_requirement_determination at quote; 0 | 1 | 2" }
      - { name: required_rear_escorts, type: integer, source: computed, default: 0, description: "Per escort_requirement_determination at quote; 0 | 1" }
      - { name: requires_height_pole, type: boolean, source: computed, default: false, description: "True when height_inches >= state pole threshold" }
      - { name: requires_police_escort, type: boolean, source: computed, default: false, description: "True when width >= state police-width threshold OR gross_weight_lbs >= state police-weight threshold" }
      - { name: requires_route_survey, type: boolean, source: computed, default: false, description: "True when requires_height_pole OR height_inches >= pole threshold - 6" }
      - { name: police_confirmed, type: boolean, source: system, default: false, description: "Dispatcher confirmed police escort coordination for this leg (POST /legs/{id}/confirm-police)" }
      - { name: clearance_verdict, type: enum, source: computed, default: UNKNOWN, description: "UNKNOWN | PASS | FAIL; computed from the ACCEPTED survey per clearance_assessment; UNKNOWN when no ACCEPTED survey" }
      - { name: survey_min_clearance_inches, type: integer, source: computed, description: "surveyed_min_clearance_inches of the leg's ACCEPTED survey (or latest SUBMITTED survey pending decision); null when no submission" }

  - name: Permit
    parent: RouteLeg
    common_fields: true
    fields:
      - { name: leg_id, type: string, source: system, description: "FK -> RouteLeg.id; leg this permit authorizes" }
      - { name: permit_number, type: string, source: input, description: "State-issued oversize permit number" }
      - { name: valid_from, type: datetime, source: input, description: "Permit validity start (UTC)" }
      - { name: valid_until, type: datetime, source: input, description: "Permit validity end (UTC); must be > valid_from; permit EXPIRED once now > valid_until" }
      - { name: holiday_closure_dates, type: array, source: input, default: [], description: "Array of YYYY-MM-DD dates on which oversize movement is embargoed despite the permit" }
      - { name: permit_status, type: enum, source: system, description: "APPLIED | ISSUED | EXPIRED" }
      - { name: issued_at, type: datetime, source: system, description: "When the permit was marked issued; null until ISSUED" }

  - name: RouteSurvey
    parent: RouteLeg
    common_fields: true
    fields:
      - { name: leg_id, type: string, source: system, description: "FK -> RouteLeg.id; surveyed leg" }
      - { name: survey_status, type: enum, source: system, description: "REQUESTED | SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED" }
      - { name: surveyed_min_clearance_inches, type: integer, source: input, description: "Minimum measured overhead clearance found in the field; >= 0; provided at submit" }
      - { name: submitted_at, type: datetime, source: system, description: "Submission timestamp; null until SUBMITTED" }
      - { name: decided_at, type: datetime, source: system, description: "Accept/reject timestamp; null until decided" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the SafetyManager who decided; null until decided" }
      - { name: rejection_reason, type: string, source: input, description: "Required when outcome=REJECTED; null otherwise" }

  - name: Obstruction
    parent: RouteSurvey
    common_fields: false
    fields:
      - { name: survey_id, type: string, source: system, description: "FK -> RouteSurvey.id; survey that recorded this obstruction" }
      - { name: milepost, type: number, source: input, description: "Milepost of the obstruction along the leg; >= 0" }
      - { name: obstruction_type, type: enum, source: input, description: "BRIDGE | WIRE | SIGN | OTHER" }
      - { name: measured_clearance_inches, type: integer, source: input, description: "Measured clearance at this obstruction; >= 0" }
      - { name: disposition, type: enum, source: input, description: "PASSABLE | PASSABLE_WITH_POLE | REQUIRES_REROUTE" }

  - name: EscortAssignment
    parent: RouteLeg
    common_fields: true
    fields:
      - { name: leg_id, type: string, source: system, description: "FK -> RouteLeg.id; leg being escorted" }
      - { name: escort_id, type: string, source: system, description: "FK -> Escort.id; supplied in the request or chosen by escort_selection_ranking when omitted" }
      - { name: position, type: enum, source: input, description: "FRONT | REAR" }
      - { name: assignment_status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | ACTIVE | COMPLETED | RELEASED" }
      - { name: offered_at, type: datetime, source: system, description: "Creation timestamp mirrored from created_at" }
      - { name: accepted_at, type: datetime, source: system, description: "null until ACCEPTED" }
      - { name: activated_at, type: datetime, source: system, description: "null until ACTIVE (set at job depart)" }
      - { name: completed_at, type: datetime, source: system, description: "null until COMPLETED (set at job deliver)" }
      - { name: released_at, type: datetime, source: system, description: "null until RELEASED" }
      - { name: release_cause, type: enum, source: system, description: "DISPATCHER | JOB_CANCELLED | ESCORT_SUSPENDED; null until RELEASED" }
      - { name: billable_hours, type: number, source: computed, description: "max(4, ceil((completed_at - activated_at minutes)/30)/2); null until COMPLETED" }
      - { name: assignment_fee_cents, type: integer, source: computed, description: "billable_hours * 9000; null until COMPLETED" }
      - { name: last_checkin_at, type: datetime, source: system, description: "Timestamp of latest driver/escort check-in; set to now at activation and by POST /assignments/{id}/check-ins" }

  - name: DelayEvent
    parent: Job
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; delayed job" }
      - { name: cause, type: enum, source: input, description: "CARRIER_DELAY | MECHANICAL_BREAKDOWN | DOCUMENTATION_ISSUE (billable) | WEATHER | CURFEW_HOLD | POLICE_DIRECTED | ROAD_CLOSURE (non-billable)" }
      - { name: started_at, type: datetime, source: input, description: "Delay start (UTC); must be <= now at creation" }
      - { name: ended_at, type: datetime, source: system, description: "Delay end; set to now at close; null while OPEN" }
      - { name: delay_status, type: enum, source: system, description: "OPEN | CLOSED" }
      - { name: raw_minutes, type: integer, source: computed, description: "ended_at - started_at in whole minutes; null until CLOSED" }
      - { name: billable_minutes, type: integer, source: computed, description: "0 for non-billable causes; else ceil(max(0, raw_minutes - 30)/15)*15; null until CLOSED" }
      - { name: standby_amount_cents, type: integer, source: computed, description: "(billable_minutes/60) * 7500 * job.total_escort_positions; null until CLOSED" }

  - name: Incident
    parent: Job
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; job during which the incident occurred" }
      - { name: assignment_id, type: string, source: input, description: "FK -> EscortAssignment.id; optional; when present must reference an assignment on a leg of this job; drives reliability penalties at settlement" }
      - { name: incident_type, type: enum, source: input, description: "CARGO_DAMAGE | PROPERTY_DAMAGE | TRAFFIC_VIOLATION | INJURY | EQUIPMENT_DAMAGE" }
      - { name: description, type: string, source: input, description: "Free-text incident narrative" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Claimed damage amount; >= 0" }
      - { name: reporter_role, type: string, source: system, description: "X-User-Role of the reporter, stamped at creation" }
      - { name: reporter_user_id, type: string, source: system, description: "X-User-ID of the reporter, stamped at creation; segregation-of-duties anchor" }
      - { name: incident_status, type: enum, source: system, description: "REPORTED | ASSESSED | DISPUTED | SETTLED" }
      - { name: escort_fault_share_pct, type: integer, source: input, description: "0..100; provided at assess; latest assessment wins after a dispute" }
      - { name: assessed_amount_cents, type: integer, source: computed, description: "min(claimed_amount_cents, 25000000); null until first assessment" }
      - { name: escort_share_cents, type: integer, source: computed, description: "max(0, round_half_up(assessed_amount_cents * escort_fault_share_pct / 100) - 50000); null until first assessment" }
      - { name: assessed_by_user_id, type: string, source: system, description: "X-User-ID of the assessor; null until first assessment" }
      - { name: settled_at, type: datetime, source: system, description: "null until SETTLED" }

  - name: Invoice
    parent: Job
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; billed job" }
      - { name: invoice_status, type: enum, source: system, description: "DRAFT | FINALIZED | DISPUTED | PAID | WRITTEN_OFF" }
      - { name: base_charges_cents, type: integer, source: computed, description: "Sum of assignment_fee_cents over COMPLETED assignments of the job" }
      - { name: equipment_charges_cents, type: integer, source: computed, description: "Sum over legs of pole/police/survey fees (15000 / 40000 / 25000 per requirement flag)" }
      - { name: standby_total_cents, type: integer, source: computed, description: "Sum of standby_amount_cents over CLOSED delay events of the job" }
      - { name: subtotal_cents, type: integer, source: computed, description: "base_charges_cents + equipment_charges_cents + standby_total_cents" }
      - { name: volume_discount_cents, type: integer, source: computed, description: "Tiered on (carrier.ytd_billed_cents + subtotal_cents): >= 500000 -> 5%, >= 100000 -> 2%, else 0%; round_half_up(subtotal * pct)" }
      - { name: fuel_surcharge_cents, type: integer, source: computed, description: "round_half_up((base_charges_cents + equipment_charges_cents) * 0.07); never applied to standby" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "job.cancel_fee_cents at generation; 0 for delivered jobs" }
      - { name: incident_chargebacks_cents, type: integer, source: computed, description: "Sum of escort_share_cents over SETTLED incidents of the job; recomputed at finalize" }
      - { name: adjustment_delta_cents, type: integer, source: computed, default: 0, description: "Accumulated dispute adjustments (signed); changed only by POST /invoices/{id}/adjust" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - volume_discount_cents + fuel_surcharge_cents + cancellation_fee_cents - incident_chargebacks_cents + adjustment_delta_cents; must stay >= 0" }
      - { name: generated_by_user_id, type: string, source: system, description: "X-User-ID of the BillingClerk who generated; segregation-of-duties anchor for finalize/adjust" }
      - { name: finalized_at, type: datetime, source: system, description: "null until FINALIZED" }
      - { name: dispute_reason, type: string, source: input, description: "Required at dispute; null until DISPUTED" }
      - { name: adjustment_note, type: string, source: input, description: "Required at adjust; null until first adjustment" }
      - { name: paid_at, type: datetime, source: system, description: "null until PAID" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Job
    field: job_status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /jobs/{id}/quote"
        actor: Dispatcher
        preconditions:
          - "Job in DRAFT (ERR_JOB_INVALID_STATE)"
          - "Job has >= 1 leg (guaranteed by creation validation)"
        side_effects:
          - "Per leg: run escort_requirement_determination (CALC-1); each leg PENDING -> DETERMINED with requirement fields set"
          - "Run quote_estimate (CALC-3 provisional variant): set quoted_cents, quoted_at = now, quote_expires_at = now + 72h, total_escort_positions"
          - "increments Job.version by 1"

      - from: QUOTED
        to: DRAFT
        trigger: "POST /jobs/{id}/amendments"
        actor: "CarrierRep (owner) or Dispatcher"
        preconditions:
          - "Job in DRAFT or QUOTED (ERR_JOB_INVALID_STATE)"
          - "expected_job_version == Job.version (ERR_STALE_JOB_VERSION, 412)"
        side_effects:
          - "status -> DRAFT; quoted_cents/quoted_at/quote_expires_at/total_escort_positions cleared to null/0"
          - "If any dimensional field changed: every leg DETERMINED -> PENDING (requirement fields reset to defaults)"
          - "increments Job.version by 1"

      - from: DRAFT
        to: DRAFT
        trigger: "POST /jobs/{id}/amendments"
        actor: "CarrierRep (owner) or Dispatcher"
        preconditions:
          - "Job in DRAFT or QUOTED (ERR_JOB_INVALID_STATE)"
          - "expected_job_version == Job.version (ERR_STALE_JOB_VERSION, 412)"
        side_effects:
          - "Fields updated in place; legs reset to PENDING if any dimensional field changed"
          - "increments Job.version by 1"

      - from: QUOTED
        to: BOOKED
        trigger: "POST /jobs/{id}/accept-quote"
        actor: "CarrierRep (owner)"
        preconditions:
          - "Job in QUOTED (ERR_JOB_INVALID_STATE)"
          - "now < quote_expires_at (ERR_QUOTE_EXPIRED)"
          - "Carrier.credit_available_cents >= quoted_cents (ERR_CREDIT_LIMIT_WOULD_BE_EXCEEDED)"
        side_effects:
          - "status -> BOOKED; booked_at = now; quoted hold contributes to carrier credit per carrier_credit_availability (CALC-11)"
          - "increments Job.version by 1"

      - from: BOOKED
        to: CLEARED
        trigger: "system (evaluated after every permit issue, survey accept, or police confirmation on any leg)"
        actor: system
        preconditions:
          - "Every leg: has a permit in ISSUED status"
          - "Every leg with requires_route_survey: clearance_verdict == PASS (an ACCEPTED, non-SUPERSEDED survey)"
          - "Every leg with requires_police_escort: police_confirmed == true"
        side_effects:
          - "status -> CLEARED"
          - "increments Job.version by 1"

      - from: CLEARED
        to: SCHEDULED
        trigger: "POST /jobs/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "Job in CLEARED (ERR_JOB_INVALID_STATE)"
          - "Per leg: some ISSUED permit covers [planned_entry_at, planned_exit_at] (valid_from <= entry AND valid_until >= exit) and no holiday_closure_dates entry falls on a traversed calendar date (ERR_PERMIT_WINDOW_INSUFFICIENT)"
          - "Per leg: [planned_entry_at, planned_exit_at) does not intersect any state curfew window (ERR_CURFEW_WINDOW_VIOLATION)"
          - "Every required escort position on every leg is covered by an ACCEPTED assignment (ERR_ASSIGNMENTS_INCOMPLETE)"
        side_effects:
          - "status -> SCHEDULED"
          - "increments Job.version by 1"

      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /jobs/{id}/depart"
        actor: Dispatcher
        preconditions:
          - "Job in SCHEDULED (ERR_JOB_INVALID_STATE)"
          - "now >= window_start_at - 30 minutes (ERR_INVALID_REQUEST — early departure beyond grace)"
        side_effects:
          - "status -> EN_ROUTE; departed_at = now"
          - "Every ACCEPTED assignment -> ACTIVE with activated_at = now and last_checkin_at = now"
          - "increments Job.version by 1"

      - from: EN_ROUTE
        to: ON_HOLD
        trigger: "POST /jobs/{id}/hold"
        actor: Dispatcher
        preconditions:
          - "Job in EN_ROUTE (ERR_JOB_INVALID_STATE)"
        side_effects:
          - "status -> ON_HOLD"
          - "increments Job.version by 1"

      - from: ON_HOLD
        to: EN_ROUTE
        trigger: "POST /jobs/{id}/resume"
        actor: Dispatcher
        preconditions:
          - "Job in ON_HOLD (ERR_JOB_INVALID_STATE)"
        side_effects:
          - "status -> EN_ROUTE"
          - "increments Job.version by 1"

      - from: EN_ROUTE
        to: DELIVERED
        trigger: "POST /jobs/{id}/deliver"
        actor: Dispatcher
        preconditions:
          - "Job in EN_ROUTE (ERR_JOB_INVALID_STATE)"
          - "Every ACTIVE assignment has last_checkin_at within 90 minutes of now (ERR_COMMS_CHECKIN_OVERDUE)"
        side_effects:
          - "status -> DELIVERED; delivered_at = now"
          - "Every ACTIVE assignment -> COMPLETED with completed_at = now; billable_hours and assignment_fee_cents computed per final_billing (CALC-4); escort.active_assignment_count decremented"
          - "Every leg CLEARED -> COMPLETED"
          - "increments Job.version by 1"

      - from: [DRAFT, QUOTED, BOOKED, CLEARED, SCHEDULED, EN_ROUTE, ON_HOLD]
        to: CANCELLED
        trigger: "POST /jobs/{id}/cancel"
        actor: "CarrierRep (owner) or Dispatcher"
        preconditions:
          - "Job not in DELIVERED, CLOSED, or CANCELLED (ERR_JOB_INVALID_STATE)"
          - "No invoice of this job in FINALIZED, DISPUTED, or PAID (ERR_JOB_INVALID_STATE)"
        side_effects:
          - "status -> CANCELLED; cancelled_at = now"
          - "cancel_fee_tier from pre-cancel state: DRAFT/QUOTED -> NONE (0%); BOOKED/CLEARED -> TIER_10; SCHEDULED -> TIER_25; EN_ROUTE/ON_HOLD -> TIER_50; cancel_fee_cents = round_half_up(quoted_cents * pct) per cancellation_fee (CALC-12); 0 when quoted_cents is null"
          - "Every assignment in OFFERED, ACCEPTED, or ACTIVE -> RELEASED with release_cause = JOB_CANCELLED; ACCEPTED/ACTIVE releases decrement escort.active_assignment_count (link 1 of cascade)"
          - "Quoted hold released: carrier.credit_available_cents recomputed per carrier_credit_availability (CALC-11) — conserves credit across book+cancel pairs"
          - "increments Job.version by 1"

      - from: DELIVERED
        to: CLOSED
        trigger: "system (when the job's invoice transitions to PAID or WRITTEN_OFF)"
        actor: system
        preconditions:
          - "Invoice in PAID or WRITTEN_OFF"
        side_effects:
          - "status -> CLOSED"
          - "increments Job.version by 1"

  - entity: RouteLeg
    field: leg_status
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: DETERMINED
        trigger: "system (job quote)"
        actor: system
        preconditions: []
        side_effects:
          - "escort_requirement_determination (CALC-1) sets required_front_escorts, required_rear_escorts, requires_height_pole, requires_police_escort, requires_route_survey"

      - from: DETERMINED
        to: PENDING
        trigger: "system (job amendment changed any dimensional field)"
        actor: system
        preconditions: []
        side_effects:
          - "Requirement fields reset to defaults; clearance_verdict unchanged"

      - from: DETERMINED
        to: CLEARED
        trigger: "system (permit issued + required survey verdict PASS + police confirmed, evaluated on each such event)"
        actor: system
        preconditions:
          - "Permit ISSUED exists for this leg"
          - "requires_route_survey -> clearance_verdict == PASS"
          - "requires_police_escort -> police_confirmed == true"
        side_effects:
          - "Re-evaluates job auto-transition BOOKED -> CLEARED"
          - "increments RouteLeg.version by 1"

      - from: DETERMINED
        to: BLOCKED
        trigger: "system (survey accepted with clearance verdict FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "increments RouteLeg.version by 1 (via the accept endpoint)"

      - from: CLEARED
        to: BLOCKED
        trigger: "system (permit EXPIRED on clock advance, or newly ACCEPTED survey verdict FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "Owning job demoted: CLEARED -> BOOKED (assignments remain; SCHEDULED -> CLEARED demotion handled first if applicable — net effect SCHEDULED -> BOOKED when the gate breaks)"
          - "increments RouteLeg.version by 1"

      - from: BLOCKED
        to: DETERMINED
        trigger: "POST /legs/{id}/route-surveys (a fresh survey re-opens the leg for clearance)"
        actor: RouteSurveyor
        preconditions: []
        side_effects:
          - "clearance_verdict reset to UNKNOWN; survey_min_clearance_inches reset to null"
          - "increments RouteLeg.version by 1"

      - from: BLOCKED
        to: CLEARED
        trigger: "system (newly ACCEPTED survey verdict PASS with permit ISSUED and police gate satisfied)"
        actor: system
        preconditions: []
        side_effects:
          - "Re-evaluates job auto-transition BOOKED -> CLEARED"
          - "increments RouteLeg.version by 1 (via the accept endpoint)"

      - from: CLEARED
        to: COMPLETED
        trigger: "system (job deliver)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [PENDING, DETERMINED, CLEARED, BLOCKED]
        to: CANCELLED
        trigger: "system (job cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Permit
    field: permit_status
    initial_state: APPLIED
    terminal_states: [EXPIRED]
    transitions:
      - from: APPLIED
        to: ISSUED
        trigger: "POST /permits/{id}/issue"
        actor: Dispatcher
        preconditions:
          - "Permit in APPLIED (ERR_PERMIT_INVALID_STATE)"
          - "Leg's job in BOOKED, CLEARED, or SCHEDULED (ERR_JOB_INVALID_STATE)"
        side_effects:
          - "issued_at = now"
          - "Re-evaluates leg DETERMINED -> CLEARED gate (link 1), which re-evaluates job BOOKED -> CLEARED (link 2)"
          - "increments Permit.version by 1"

      - from: ISSUED
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep: now > valid_until)"
        actor: system
        preconditions: []
        side_effects:
          - "Leg CLEARED -> BLOCKED (link 1 of clock cascade)"
          - "Job demoted CLEARED/SCHEDULED -> BOOKED (link 2)"
          - "increments Permit.version by 1"

  - entity: RouteSurvey
    field: survey_status
    initial_state: REQUESTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: SUBMITTED
        trigger: "POST /route-surveys/{id}/submit"
        actor: RouteSurveyor
        preconditions:
          - "Survey in REQUESTED (ERR_SURVEY_INVALID_STATE)"
        side_effects:
          - "surveyed_min_clearance_inches recorded; submitted_at = now"
          - "Creates one Obstruction row per element of the obstructions array (append-only)"
          - "leg.survey_min_clearance_inches = surveyed value (provisional; verdict stays UNKNOWN)"
          - "increments RouteSurvey.version by 1"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /route-surveys/{id}/accept with outcome = ACCEPTED"
        actor: SafetyManager
        preconditions:
          - "Survey in SUBMITTED (ERR_SURVEY_INVALID_STATE)"
          - "expected_leg_version == RouteLeg.version (ERR_STALE_LEG_VERSION, 412)"
        side_effects:
          - "decided_at = now; decided_by_user_id = caller"
          - "Any previously ACCEPTED survey on this leg -> SUPERSEDED (supersede chain)"
          - "leg.survey_min_clearance_inches = surveyed value; clearance_verdict computed per clearance_assessment surveyed variant (CALC-2)"
          - "verdict FAIL: leg DETERMINED/CLEARED -> BLOCKED (demotes job per leg cascade); verdict PASS: leg DETERMINED/BLOCKED -> CLEARED when remaining gates hold (re-evaluates job BOOKED -> CLEARED)"
          - "increments RouteSurvey.version by 1 AND increments RouteLeg.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /route-surveys/{id}/accept with outcome = REJECTED"
        actor: SafetyManager
        preconditions:
          - "Survey in SUBMITTED (ERR_SURVEY_INVALID_STATE)"
          - "expected_leg_version == RouteLeg.version (ERR_STALE_LEG_VERSION, 412)"
          - "rejection_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_at = now; decided_by_user_id = caller; rejection_reason recorded"
          - "increments RouteSurvey.version by 1 AND increments RouteLeg.version by 1"

      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (a newer survey on the same leg is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EscortAssignment
    field: assignment_status
    initial_state: OFFERED
    terminal_states: [DECLINED, RELEASED, COMPLETED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /assignments/{id}/accept"
        actor: "EscortOperator (must be the assigned escort)"
        preconditions:
          - "Assignment in OFFERED (ERR_ASSIGNMENT_INVALID_STATE)"
          - "Escort in ACTIVE (ERR_ESCORT_INVALID_STATE)"
          - "Leg's job in BOOKED, CLEARED, or SCHEDULED (ERR_JOB_INVALID_STATE)"
          - "Buffered job window does not conflict with this escort's other ACCEPTED/ACTIVE assignments per escort_assignment_overlap_check (CALC-8; ERR_ESCORT_WINDOW_CONFLICT)"
        side_effects:
          - "accepted_at = now; escort.active_assignment_count incremented"
          - "increments EscortAssignment.version by 1"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /assignments/{id}/decline"
        actor: "EscortOperator (must be the assigned escort)"
        preconditions:
          - "Assignment in OFFERED (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "increments EscortAssignment.version by 1 (offer+decline pair leaves escort.active_assignment_count unchanged — conserved)"

      - from: [OFFERED, ACCEPTED]
        to: RELEASED
        trigger: "POST /assignments/{id}/release (Dispatcher), or system cascade (job cancel / escort suspension)"
        actor: "Dispatcher or system"
        preconditions:
          - "Assignment in OFFERED or ACCEPTED (ERR_ASSIGNMENT_INVALID_STATE)"
        side_effects:
          - "released_at = now; release_cause = DISPATCHER | JOB_CANCELLED | ESCORT_SUSPENDED by trigger"
          - "If was ACCEPTED: escort.active_assignment_count decremented (accept+release pair conserves the count)"
          - "If job in SCHEDULED and a required position is now uncovered: job SCHEDULED -> CLEARED (demotion cascade link)"
          - "increments EscortAssignment.version by 1"

      - from: ACCEPTED
        to: ACTIVE
        trigger: "system (job depart)"
        actor: system
        preconditions: []
        side_effects:
          - "activated_at = now; last_checkin_at = now (initial staging check-in recorded automatically)"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system (job deliver)"
        actor: system
        preconditions: []
        side_effects:
          - "completed_at = now; billable_hours = max(4, ceil((completed_at - activated_at minutes)/30)/2); assignment_fee_cents = billable_hours * 9000 (CALC-4 final variant)"
          - "escort.active_assignment_count decremented"

  - entity: DelayEvent
    field: delay_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /delay-events/{id}/close"
        actor: "Dispatcher or EscortOperator"
        preconditions:
          - "Delay event in OPEN (ERR_DELAY_EVENT_INVALID_STATE)"
        side_effects:
          - "ended_at = now; raw_minutes = ended_at - started_at in whole minutes"
          - "standby_billing (CALC-5): billable_minutes and standby_amount_cents computed with per-event rounding"
          - "increments DelayEvent.version by 1"

  - entity: Incident
    field: incident_status
    initial_state: REPORTED
    terminal_states: [SETTLED]
    transitions:
      - from: REPORTED
        to: ASSESSED
        trigger: "POST /incidents/{id}/assess"
        actor: "SafetyManager or Dispatcher"
        preconditions:
          - "Incident in REPORTED or DISPUTED (ERR_INCIDENT_INVALID_STATE)"
          - "Segregation of duties: incident.reporter_user_id != X-User-ID (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "incident_liability_assessment (CALC-10): assessed_amount_cents and escort_share_cents set; assessed_by_user_id = caller"
          - "increments Incident.version by 1"

      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /incidents/{id}/dispute"
        actor: "CarrierRep (owner of the job's carrier)"
        preconditions:
          - "Incident in ASSESSED (ERR_INCIDENT_INVALID_STATE)"
        side_effects:
          - "increments Incident.version by 1"

      - from: DISPUTED
        to: ASSESSED
        trigger: "POST /incidents/{id}/assess (re-assessment; latest assessment wins)"
        actor: "SafetyManager or Dispatcher"
        preconditions:
          - "Incident in REPORTED or DISPUTED (ERR_INCIDENT_INVALID_STATE)"
          - "Segregation of duties: incident.reporter_user_id != X-User-ID (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "incident_liability_assessment recomputed from the new escort_fault_share_pct, replacing prior amounts"
          - "increments Incident.version by 1"

      - from: ASSESSED
        to: SETTLED
        trigger: "POST /incidents/{id}/settle"
        actor: FinanceManager
        preconditions:
          - "Incident in ASSESSED (ERR_INCIDENT_INVALID_STATE — a DISPUTED incident must be re-assessed before settlement)"
        side_effects:
          - "settled_at = now; escort_share_cents becomes a chargeback line consumed by invoice composition (CALC-6)"
          - "If assignment_id present: escort_reliability_update (CALC-13) — link 1: pct >= 50 -> -35, 1..49 -> -10, 0 -> 0 (link 2: reliability_score < 40 -> escort -> SUSPENDED)"
          - "Escort auto-suspension cascades (link 3): that escort's ACCEPTED assignments -> RELEASED (cause ESCORT_SUSPENDED; count decremented); any SCHEDULED job losing a required position -> CLEARED"
          - "increments Incident.version by 1"

  - entity: Invoice
    field: invoice_status
    initial_state: DRAFT
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /invoices/{id}/finalize"
        actor: BillingClerk
        preconditions:
          - "Invoice in DRAFT (ERR_INVOICE_INVALID_STATE)"
          - "Segregation of duties: invoice.generated_by_user_id != X-User-ID (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "invoice_total_composition (CALC-6) re-run so incident_chargebacks_cents reflects settlements since generation; all monetary fields and total_cents recomputed"
          - "finalized_at = now"
          - "increments Invoice.version by 1"

      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /invoices/{id}/dispute"
        actor: "CarrierRep (owner of the job's carrier)"
        preconditions:
          - "Invoice in FINALIZED (ERR_INVOICE_INVALID_STATE)"
        side_effects:
          - "dispute_reason recorded"
          - "increments Invoice.version by 1"

      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /invoices/{id}/adjust"
        actor: BillingClerk
        preconditions:
          - "Invoice in DISPUTED (ERR_INVOICE_INVALID_STATE)"
          - "Segregation of duties: invoice.generated_by_user_id != X-User-ID (ERR_SEGREGATION_OF_DUTIES)"
          - "Resulting total_cents >= 0 (ERR_ADJUSTMENT_EXCEEDS_TOTAL)"
        side_effects:
          - "adjustment_delta_cents accumulated (signed); adjustment_note recorded; total_cents recomputed per CALC-6; finalized_at = now"
          - "increments Invoice.version by 1 (FINALIZED -> DISPUTED -> FINALIZED revision loop)"

      - from: FINALIZED
        to: PAID
        trigger: "POST /invoices/{id}/record-payment"
        actor: FinanceManager
        preconditions:
          - "Invoice in FINALIZED (ERR_INVOICE_INVALID_STATE)"
          - "amount_cents == total_cents exactly (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "paid_at = now; carrier.ytd_billed_cents += total_cents (drives future volume-discount tiers)"
          - "Invoice leaves the {FINALIZED, DISPUTED} outstanding set: carrier.credit_available_cents recomputed (CALC-11)"
          - "Job DELIVERED -> CLOSED when applicable"
          - "increments Invoice.version by 1"

      - from: FINALIZED
        to: WRITTEN_OFF
        trigger: "POST /invoices/{id}/write-off"
        actor: FinanceManager
        preconditions:
          - "Invoice in FINALIZED (ERR_INVOICE_INVALID_STATE)"
        side_effects:
          - "Invoice leaves the outstanding set (no ytd_billed_cents credit); carrier.credit_available_cents recomputed"
          - "Job DELIVERED -> CLOSED when applicable"
          - "increments Invoice.version by 1"

  - entity: Escort
    field: escort_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /escorts/{id}/suspend (SafetyManager) or system (reliability_score < 40 at incident settlement)"
        actor: "SafetyManager or system"
        preconditions:
          - "Escort in ACTIVE (ERR_ESCORT_INVALID_STATE)"
        side_effects:
          - "This escort's ACCEPTED assignments -> RELEASED with release_cause = ESCORT_SUSPENDED; active_assignment_count decremented per release"
          - "Any SCHEDULED job losing a required position -> CLEARED (demotion cascade)"
          - "increments Escort.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /escorts/{id}/reinstate"
        actor: SafetyManager
        preconditions:
          - "Escort in SUSPENDED (ERR_ESCORT_INVALID_STATE)"
        side_effects:
          - "increments Escort.version by 1 (reliability_score unchanged — reinstatement does not reset the score)"

# =============================================================================
# §1.2.1: Concurrency Rules (OCC on parent version — only true create-with-
# supersede / amend races; everything else is a §1.2/§1.4 state precondition)
# =============================================================================
concurrency_rules:
  - rule_id: job-amend-stale-version
    parent_entity: Job
    write_endpoint: "POST /jobs/{id}/amendments"
    occ_field: expected_job_version
    description: |
      Amending a Job whose version has advanced since the client last read it
      is rejected. A prior quote generation or amendment legitimately advanced
      the job (clearing or replacing the quote the client saw), so the current
      writer's view of the job is stale and must be refreshed before amending.
    error_id: ERR_STALE_JOB_VERSION
    http_status: 412

  - rule_id: survey-accept-stale-leg
    parent_entity: RouteLeg
    write_endpoint: "POST /route-surveys/{id}/accept"
    occ_field: expected_leg_version
    description: |
      Accepting or rejecting a RouteSurvey against a RouteLeg whose version has
      advanced since the client last read it is rejected. A prior decision on
      this leg legitimately superseded the previously ACCEPTED survey and
      recomputed the leg's clearance verdict, so the current decision would be
      based on a stale survey set.
    error_id: ERR_STALE_LEG_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: escort_requirement_determination
    trigger: "POST /jobs/{id}/quote (per leg)"
    algorithm: threshold
    description: "Per-state escort/equipment requirements from load dimensions. Combinatorial mode (a): 4 dimensional inputs with non-linear conditional interaction."
    formula: |
      rules = STATE_RULES[leg.state_code]
      w = job.width_inches; h = job.height_inches; gw = job.gross_weight_lbs
      required_rear_escorts  = 1 if w >= rules.rear_threshold else 0
      required_front_escorts = 2 if w >= rules.two_front_threshold else (1 if w >= rules.front_threshold else 0)
      requires_height_pole   = (h >= rules.pole_threshold)
      requires_police_escort = (w >= rules.police_width_threshold) OR (gw >= rules.police_weight_threshold)
      requires_route_survey  = requires_height_pole OR (h >= rules.pole_threshold - 6)
      Boundaries are INCLUSIVE (>=): width exactly at rear_threshold requires a rear escort.
    input_set: "Every leg of the job at quote time; legs in PENDING state"
    constants:
      STATE_RULES:
        TX: { rear_threshold: 168, front_threshold: 180, two_front_threshold: 192, pole_threshold: 174, police_width_threshold: 192, police_weight_threshold: 200000 }
        OK: { rear_threshold: 168, front_threshold: 174, two_front_threshold: 186, pole_threshold: 168, police_width_threshold: 180, police_weight_threshold: 180000 }
        KS: { rear_threshold: 156, front_threshold: 180, two_front_threshold: 192, pole_threshold: 174, police_width_threshold: 192, police_weight_threshold: 250000 }
        LA: { rear_threshold: 144, front_threshold: 168, two_front_threshold: 180, pole_threshold: 162, police_width_threshold: 180, police_weight_threshold: 150000 }
      SURVEY_MARGIN_INCHES: 6
    precision: "integer thresholds; no rounding"

  - name: clearance_assessment
    trigger: "RouteSurvey accept (surveyed variant); informational at quote (map variant)"
    algorithm: threshold
    description: "Dual-variant clearance verdict. Two valid clearance sources produce different PASS/FAIL verdicts for identical job dimensions."
    formula: |
      required_clearance = job.height_inches + CLEARANCE_BUFFER_INCHES   # 6
      verdict = PASS if min_overhead >= required_clearance else FAIL     # equality PASSES
    input_set: "The surveyed leg and its ACCEPTED (surveyed variant) or map-provided (map variant) minimum overhead clearance"
    constants:
      CLEARANCE_BUFFER_INCHES: 6
    variants:
      - name: map_estimate
        when: "No ACCEPTED survey exists; advisory only"
        difference: "Uses leg.map_min_clearance_inches (map database value); never blocks the leg"
      - name: surveyed_actual
        when: "A RouteSurvey is ACCEPTED for the leg"
        difference: "Uses survey.surveyed_min_clearance_inches (field measurement); FAIL marks the leg BLOCKED — can contradict the map variant for identical dimensions"

  - name: quote_estimate
    trigger: "POST /jobs/{id}/quote"
    algorithm: forward_looking
    description: "Provisional pricing variant. Same job, different result from final_billing because it prices estimated (not actual) hours and no standby/chargeback lines."
    formula: |
      per leg:
        estimated_hours = ceil(distance_miles / AVG_SPEED_MPH * 2) / 2     # round up to 0.5h
        positions = required_front_escorts + required_rear_escorts
        base_est += estimated_hours * positions * HOURLY_RATE_CENTS
        equipment_est += 15000 if requires_height_pole else 0
        equipment_est += 40000 if requires_police_escort else 0
        equipment_est += 25000 if requires_route_survey else 0
      quoted_cents = base_est + equipment_est
    input_set: "All legs of the job in DETERMINED state (post CALC-1)"
    constants:
      HOURLY_RATE_CENTS: 9000
      AVG_SPEED_MPH: 50
      POLE_SURCHARGE_CENTS: 15000
      POLICE_COORDINATION_FEE_CENTS: 40000
      SURVEY_FEE_CENTS: 25000
      QUOTE_TTL_HOURS: 72
    precision: "integer cents; ceil to half-hours applied before multiplication"

  - name: final_billing
    trigger: "Job deliver (per assignment)"
    algorithm: chronological
    description: "Final pricing variant keyed on actual movement time (activated_at -> completed_at), with a 4-hour minimum per assignment. Diverges from quote_estimate for identical dimensions."
    formula: |
      raw_minutes = completed_at - activated_at in whole minutes
      billable_hours = max(MIN_ASSIGNMENT_HOURS, ceil(raw_minutes / 30) / 2)
      assignment_fee_cents = billable_hours * HOURLY_RATE_CENTS
    input_set: "Assignments transitioning ACTIVE -> COMPLETED at deliver"
    constants:
      HOURLY_RATE_CENTS: 9000
      MIN_ASSIGNMENT_HOURS: 4
      ROUNDING_INCREMENT_MINUTES: 30
    precision: "ceil to 30-minute increments before the 4-hour floor is applied"

  - name: standby_billing
    trigger: "DelayEvent close"
    algorithm: threshold
    description: "Combinatorial mode (b): nested rounding where order matters. Rounding is pinned PER EVENT, THEN SUMMED across events; summing chargeable minutes first and rounding once yields a different (wrong) total."
    formula: |
      if cause in {WEATHER, CURFEW_HOLD, POLICE_DIRECTED, ROAD_CLOSURE}:
        billable_minutes = 0
      else:   # CARRIER_DELAY, MECHANICAL_BREAKDOWN, DOCUMENTATION_ISSUE
        chargeable = max(0, raw_minutes - STANDBY_GRACE_MINUTES)          # grace of exactly 30 is free (30 -> 0)
        billable_minutes = ceil(chargeable / STANDBY_INCREMENT_MINUTES) * STANDBY_INCREMENT_MINUTES
      standby_amount_cents = (billable_minutes / 60) * STANDBY_RATE_CENTS * job.total_escort_positions
    input_set: "The delay event being closed; positions = job.total_escort_positions at close time"
    constants:
      STANDBY_GRACE_MINUTES: 30
      STANDBY_INCREMENT_MINUTES: 15
      STANDBY_RATE_CENTS: 7500
    precision: "integer cents; (billable_minutes/60)*rate*positions always integral because billable_minutes is a multiple of 15"

  - name: invoice_total_composition
    trigger: "POST /jobs/{id}/invoices (generate) and POST /invoices/{id}/finalize (re-run)"
    algorithm: tiered_pricing
    description: "Combinatorial mode (c): circular-looking dependency pinned by explicit evaluation order — the discount tier reads (ytd_billed + this subtotal), and the fuel surcharge is computed on UNDISCOUNTED base+equipment even though it is added after the discount."
    formula: |
      EVALUATION ORDER (pinned — do not reorder):
      1. base_charges_cents      = sum(assignment_fee_cents) over COMPLETED assignments of the job
      2. equipment_charges_cents = sum over legs of (15000 if requires_height_pole) + (40000 if requires_police_escort) + (25000 if requires_route_survey)
      3. standby_total_cents     = sum(standby_amount_cents) over CLOSED delay events of the job
      4. subtotal_cents          = base + equipment + standby
      5. tier_basis              = carrier.ytd_billed_cents + subtotal_cents
         volume_discount_pct     = 0.05 if tier_basis >= 500000 else (0.02 if tier_basis >= 100000 else 0)
         volume_discount_cents   = round_half_up(subtotal_cents * volume_discount_pct)
      6. fuel_surcharge_cents    = round_half_up((base_charges_cents + equipment_charges_cents) * 0.07)   # pre-discount basis; standby excluded
      7. cancellation_fee_cents  = job.cancel_fee_cents (0 for delivered jobs)
      8. incident_chargebacks_cents = sum(escort_share_cents) over SETTLED incidents of the job (as of finalize for the finalize re-run)
      9. total_cents = subtotal_cents - volume_discount_cents + fuel_surcharge_cents + cancellation_fee_cents - incident_chargebacks_cents + adjustment_delta_cents
    input_set: "Job in DELIVERED or CANCELLED; its COMPLETED assignments, CLOSED delay events, SETTLED incidents; carrier ytd_billed_cents at computation time"
    constants:
      VOLUME_TIER1_THRESHOLD_CENTS: 100000
      VOLUME_TIER1_PCT: 0.02
      VOLUME_TIER2_THRESHOLD_CENTS: 500000
      VOLUME_TIER2_PCT: 0.05
      FUEL_SURCHARGE_PCT: 0.07
    precision: "2 decimal-free integer cents; round_half_up at each marked rounding step"

  - name: escort_selection_ranking
    trigger: "POST /legs/{id}/assignments when escort_id is omitted"
    algorithm: weighted_scoring
    description: "Selector policy: deterministic pick from an eligibility-filtered candidate pool."
    formula: |
      eligibility (ALL must hold):
        e.escort_status == ACTIVE
        leg.state_code IN e.certified_state_codes
        (position == FRONT AND leg.requires_height_pole) -> (e.has_height_pole AND e.height_pole_max_inches >= job.height_inches)
        no buffered window conflict per escort_assignment_overlap_check (CALC-8) against e's ACCEPTED/ACTIVE assignments
      ranking: reliability_score DESC, tie-break created_at ASC (never id)
      fallback: empty pool -> ERR_NO_ELIGIBLE_ESCORT (422)
    input_set: "All Escort rows"
    constants:
      RELIABILITY_TIEBREAK: "created_at ASC"
    precision: "n/a"

  - name: escort_assignment_overlap_check
    trigger: "POST /legs/{id}/assignments (explicit escort) and POST /assignments/{id}/accept and escort_selection_ranking"
    algorithm: interval_merge
    description: "Resource temporal-overlap rule #1: buffered ABSOLUTE intervals on the Escort resource. Buffer expands both ends; strict inequality means intervals that merely touch after expansion do NOT conflict."
    formula: |
      candidate window W = [job.window_start_at - 60min, job.window_end_at + 60min]
      for each assignment a of the escort in {ACCEPTED, ACTIVE}:
        A = [a.job.window_start_at - 60min, a.job.window_end_at + 60min]
        conflict if W.start < A.end AND A.start < W.end      # touching endpoints do NOT conflict
      => two jobs whose windows are exactly 120 minutes apart (buffer+buffer) do NOT conflict; 119 minutes DO
    input_set: "The escort's assignments in {ACCEPTED, ACTIVE} and their jobs' windows"
    constants:
      DEADHEAD_BUFFER_MINUTES: 60
    precision: "whole-minute comparisons"

  - name: curfew_window_validation
    trigger: "POST /jobs/{id}/schedule (per leg)"
    algorithm: interval_merge
    description: "Resource temporal-overlap rule #2: half-open RECURRING daily curfew windows on the leg's traversal slot — different interval semantics from CALC-8 (no buffer; recurrence; endpoints touching a curfew boundary are allowed)."
    formula: |
      for leg in job.legs:
        T = [planned_entry_at, planned_exit_at)              # half-open
        for each curfew [c_start, c_end) of CURFEW_WINDOWS[leg.state_code] on each traversed UTC date:
          violation if T.start < c_end AND c_start < T.end   # half-open: entry == c_end OK; exit == c_start OK
        any violation -> ERR_CURFEW_WINDOW_VIOLATION
    input_set: "Legs of a CLEARED job at schedule time"
    constants:
      CURFEW_WINDOWS_UTC:
        TX: [["07:00", "09:00"], ["16:00", "18:30"]]
        OK: [["07:00", "09:00"], ["16:30", "18:30"]]
        KS: [["06:30", "08:30"], ["16:00", "18:00"]]
        LA: [["06:30", "09:00"], ["15:30", "18:00"]]
    precision: "whole-minute comparisons, UTC"

  - name: incident_liability_assessment
    trigger: "POST /incidents/{id}/assess (initial and re-assessment after dispute)"
    algorithm: weighted_scoring
    description: "Nested min/max liability split with deductible; latest assessment replaces prior amounts."
    formula: |
      assessed_amount_cents = min(claimed_amount_cents, LIABILITY_CAP_CENTS)
      raw_share = round_half_up(assessed_amount_cents * escort_fault_share_pct / 100)
      escort_share_cents = max(0, raw_share - ESCORT_DEDUCTIBLE_CENTS)
    input_set: "The incident being assessed"
    constants:
      LIABILITY_CAP_CENTS: 25000000
      ESCORT_DEDUCTIBLE_CENTS: 50000
    precision: "integer cents, round_half_up"

  - name: carrier_credit_availability
    trigger: "Read on Carrier (computed field); evaluated at accept-quote, payment, write-off, invoice finalize/dispute, job cancel"
    algorithm: aggregation
    description: "Compensating-invariant anchor #1: book+cancel pairs conserve credit_available_cents; pay/dispute pairs move invoices between outstanding buckets."
    formula: |
      outstanding_quoted = sum(quoted_cents) over carrier's jobs in {BOOKED, CLEARED, SCHEDULED, EN_ROUTE, ON_HOLD}
      outstanding_billed = sum(total_cents) over carrier's invoices in {FINALIZED, DISPUTED}
      credit_available_cents = credit_limit_cents - outstanding_quoted - outstanding_billed
    input_set: "Carrier's non-terminal jobs and outstanding invoices, filtered by the exact status sets above"
    precision: "integer cents"

  - name: cancellation_fee
    trigger: "POST /jobs/{id}/cancel"
    algorithm: threshold
    description: "Tiered cancellation fee keyed on the job's state at cancel time (boundary: fee tier is read from the PRE-cancel state)."
    formula: |
      tier by pre-cancel job_status:
        DRAFT, QUOTED            -> NONE,     pct = 0
        BOOKED, CLEARED          -> TIER_10,  pct = 0.10
        SCHEDULED                -> TIER_25,  pct = 0.25
        EN_ROUTE, ON_HOLD        -> TIER_50,  pct = 0.50
      cancel_fee_cents = round_half_up(quoted_cents * pct); 0 when quoted_cents is null
    input_set: "The job being cancelled"
    precision: "integer cents, round_half_up"

  - name: escort_reliability_update
    trigger: "Incident settle (when assignment_id is present)"
    algorithm: aggregation
    description: "Threshold-triggered contagion: settlement penalties can auto-suspend the escort, releasing assignments and demoting jobs."
    formula: |
      if escort_fault_share_pct >= 50: delta = -35
      elif escort_fault_share_pct >= 1: delta = -10
      else: delta = 0
      reliability_score = max(0, min(100, reliability_score + delta))
      if reliability_score < RELIABILITY_SUSPENSION_FLOOR (40): escort -> SUSPENDED (cascade per Escort state machine)
    input_set: "The escort referenced by the settled incident's assignment_id"
    constants:
      RELIABILITY_INITIAL: 100
      HIGH_FAULT_THRESHOLD_PCT: 50
      HIGH_FAULT_PENALTY: 35
      PARTIAL_FAULT_PENALTY: 10
      RELIABILITY_SUSPENSION_FLOOR: 40
    precision: "integer score"

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Request body well-formed: required fields present, types match, enum members valid (e.g., position in {FRONT, REAR}, cause, outcome in {ACCEPTED, REJECTED}, state_code in {TX, OK, KS, LA}); numeric ranges (dimensions > 0, valid_until > valid_from, window_end_at > window_start_at, planned_exit_at > planned_entry_at, escort_fault_share_pct in 0..100)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"
    note: "ERR_INVALID_ENUM_VALUE (400) may be returned instead of ERR_INVALID_REQUEST for an out-of-membership enum value; both live at this priority"

  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right (job before leg, survey before obstruction list, etc.)"
    error_id: "ERR_JOB_NOT_FOUND | ERR_LEG_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_SURVEY_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_DELAY_EVENT_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_CARRIER_NOT_FOUND | ERR_ESCORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: "Body-referenced FKs exist: carrier_id (POST /jobs), escort_id (POST /legs/{id}/assignments, explicit), assignment_id (POST /jobs/{id}/incidents, when present — must also belong to a leg of this job, else ERR_INVALID_REQUEST)"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_ESCORT_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /jobs, POST /legs/{id}/assignments, POST /jobs/{id}/incidents"

  - priority: 6
    category: auth
    check: "Ownership: entity-backed caller owns the target — CarrierRep: job.carrier_id == X-User-ID (accept-quote, cancel, invoice dispute, incident dispute); EscortOperator: assignment.escort_id == X-User-ID (accept, decline, check-ins)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /jobs (carrier_id == X-User-ID), POST /jobs/{id}/amendments (CarrierRep caller), POST /jobs/{id}/accept-quote, POST /jobs/{id}/cancel (CarrierRep caller), POST /invoices/{id}/dispute, POST /incidents/{id}/dispute, POST /assignments/{id}/accept, POST /assignments/{id}/decline, POST /assignments/{id}/check-ins"

  - priority: 7
    category: state
    check: "Target resource is in the required state for the operation (per §1.2 transition preconditions; includes OCC read-modify ordering handled at §1.2.1 with 412)"
    error_id: "ERR_JOB_INVALID_STATE | ERR_LEG_INVALID_STATE | ERR_PERMIT_INVALID_STATE | ERR_SURVEY_INVALID_STATE | ERR_ASSIGNMENT_INVALID_STATE | ERR_DELAY_EVENT_INVALID_STATE | ERR_INCIDENT_INVALID_STATE | ERR_INVOICE_INVALID_STATE | ERR_ESCORT_INVALID_STATE"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_safety
    check: "Escort certification & equipment: explicit escort_id must be certified for leg.state_code (ERR_ESCORT_NOT_CERTIFIED_FOR_STATE); when position == FRONT and leg.requires_height_pole, escort must carry a pole with height_pole_max_inches >= job.height_inches (ERR_HEIGHT_POLE_EQUIPMENT_MISSING)"
    error_id: "ERR_ESCORT_NOT_CERTIFIED_FOR_STATE | ERR_HEIGHT_POLE_EQUIPMENT_MISSING"
    http_status: 422
    applies_to: "POST /legs/{id}/assignments (explicit escort path)"

  - priority: 9
    category: business_safety
    check: "Permit issuance precondition: leg's job must be BOOKED/CLEARED/SCHEDULED (permits cannot be issued for unbooked jobs)"
    error_id: ERR_JOB_INVALID_STATE
    http_status: 409
    applies_to: "POST /permits/{id}/issue"
    note: "Shares the state category's error shape but is ordered here because it guards a regulatory artifact"

  - priority: 10
    category: business_temporal
    check: "Permit window coverage at schedule: some ISSUED permit has valid_from <= planned_entry_at AND valid_until >= planned_exit_at AND no holiday_closure_dates entry on a traversed UTC calendar date"
    error_id: ERR_PERMIT_WINDOW_INSUFFICIENT
    http_status: 409
    applies_to: "POST /jobs/{id}/schedule"

  - priority: 11
    category: business_temporal
    check: "Curfew compliance at schedule per curfew_window_validation (half-open recurring windows)"
    error_id: ERR_CURFEW_WINDOW_VIOLATION
    http_status: 409
    applies_to: "POST /jobs/{id}/schedule"

  - priority: 12
    category: business_temporal
    check: "Escort buffered-window overlap per escort_assignment_overlap_check"
    error_id: ERR_ESCORT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /legs/{id}/assignments (explicit escort path), POST /assignments/{id}/accept"

  - priority: 13
    category: business_temporal
    check: "Quote not expired: now < quote_expires_at"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /jobs/{id}/accept-quote"

  - priority: 14
    category: business_temporal
    check: "Communication protocol: every ACTIVE assignment's last_checkin_at is within 90 minutes of now"
    error_id: ERR_COMMS_CHECKIN_OVERDUE
    http_status: 409
    applies_to: "POST /jobs/{id}/deliver"

  - priority: 15
    category: business_referential
    check: "Uniqueness of open sub-records: at most one non-terminal invoice per job (ERR_ACTIVE_INVOICE_EXISTS); at most one OPEN delay event per job (ERR_OPEN_DELAY_EVENT_EXISTS); at most one non-terminal (REQUESTED/SUBMITTED) survey per leg (ERR_OPEN_SURVEY_EXISTS); position quota per leg (count of OFFERED/ACCEPTED/ACTIVE assignments with that position < required count, ERR_POSITION_QUOTA_FILLED); schedule completeness (ERR_ASSIGNMENTS_INCOMPLETE)"
    error_id: "ERR_ACTIVE_INVOICE_EXISTS | ERR_OPEN_DELAY_EVENT_EXISTS | ERR_OPEN_SURVEY_EXISTS | ERR_POSITION_QUOTA_FILLED | ERR_ASSIGNMENTS_INCOMPLETE"
    http_status: 409
    applies_to: "POST /jobs/{id}/invoices, POST /jobs/{id}/delay-events, POST /legs/{id}/route-surveys, POST /legs/{id}/assignments, POST /jobs/{id}/schedule"

  - priority: 16
    category: business_referential
    check: "Segregation of duties: incident.reporter_user_id != X-User-ID at assess; invoice.generated_by_user_id != X-User-ID at finalize and adjust"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /incidents/{id}/assess, POST /invoices/{id}/finalize, POST /invoices/{id}/adjust"

  - priority: 17
    category: business_fiscal
    check: "Carrier credit: carrier.credit_available_cents >= quoted_cents at accept-quote"
    error_id: ERR_CREDIT_LIMIT_WOULD_BE_EXCEEDED
    http_status: 402
    applies_to: "POST /jobs/{id}/accept-quote"

  - priority: 18
    category: business_fiscal
    check: "Payment integrity: amount_cents == invoice.total_cents exactly (ERR_PAYMENT_AMOUNT_MISMATCH); adjustment keeps total_cents >= 0 (ERR_ADJUSTMENT_EXCEEDS_TOTAL)"
    error_id: "ERR_PAYMENT_AMOUNT_MISMATCH | ERR_ADJUSTMENT_EXCEEDS_TOTAL"
    http_status: 422
    applies_to: "POST /invoices/{id}/record-payment, POST /invoices/{id}/adjust"

# =============================================================================
# §1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5: API Endpoint Table
# GET endpoints are open to all seven roles. All nested parents use {id} as the
# placeholder segment name. List endpoints return rows ordered by created_at
# ASC (legs ordered by sequence_index ASC), so $.data[0] is deterministic.
# =============================================================================
endpoints:
  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Side effects sweep time-dependent state."
    roles: [Dispatcher]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "Every ISSUED permit with valid_until < now -> EXPIRED; each expiry cascades: leg CLEARED -> BLOCKED, job CLEARED/SCHEDULED -> BOOKED"

  # --- Carrier ---
  - method: POST
    path: "/carriers"
    description: "Register a carrier customer"
    roles: [Dispatcher]
    code: 201
    input: [carrier_name, credit_limit_cents]
    output: Carrier
    side_effects: ["ytd_billed_cents = 0; credit_available_cents = credit_limit_cents"]

  - method: GET
    path: "/carriers"
    description: "List carriers (paginated)"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Carrier[]"
    side_effects: []

  - method: GET
    path: "/carriers/{id}"
    description: "Get one carrier including computed credit_available_cents"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  # --- Escort ---
  - method: POST
    path: "/escorts"
    description: "Register a certified pilot car escort"
    roles: [Dispatcher]
    code: 201
    input: [operator_name, certified_state_codes, "has_height_pole?", "height_pole_max_inches?"]
    output: Escort
    side_effects: ["reliability_score = 100; escort_status = ACTIVE; active_assignment_count = 0"]

  - method: GET
    path: "/escorts"
    description: "List escorts with filters (paginated)"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["state_code?", "escort_status?", "limit?", "offset?"]
    output: "Escort[]"
    side_effects: []

  - method: POST
    path: "/escorts/{id}/suspend"
    description: "Suspend an escort; cascades release of ACCEPTED assignments"
    roles: [SafetyManager]
    code: 200
    input: ["reason?"]
    output: Escort
    side_effects:
      - "escort_status -> SUSPENDED"
      - "ACCEPTED assignments -> RELEASED (cause ESCORT_SUSPENDED); active_assignment_count decremented per release"
      - "SCHEDULED jobs losing required positions -> CLEARED"
      - "increments Escort.version by 1"

  - method: POST
    path: "/escorts/{id}/reinstate"
    description: "Reinstate a suspended escort (reliability_score unchanged)"
    roles: [SafetyManager]
    code: 200
    input: []
    output: Escort
    side_effects: ["escort_status -> ACTIVE", "increments Escort.version by 1"]

  # --- Job ---
  - method: POST
    path: "/jobs"
    description: "Book an oversize-load escort job with dimensions and route legs"
    roles: [CarrierRep]
    code: 201
    input: [carrier_id, load_description, width_inches, height_inches, length_inches, gross_weight_lbs, window_start_at, window_end_at, legs]
    output: Job
    side_effects:
      - "job_status = DRAFT; creates one RouteLeg (PENDING) per element of legs, in sequence_index order"
      - "unsupported state_code in any leg -> ERR_INVALID_REQUEST"

  - method: GET
    path: "/jobs"
    description: "List jobs with filters (paginated)"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["carrier_id?", "job_status?", "limit?", "offset?"]
    output: "Job[]"
    side_effects: []

  - method: GET
    path: "/jobs/{id}"
    description: "Get one job"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: []
    output: Job
    side_effects: []

  - method: POST
    path: "/jobs/{id}/amendments"
    description: "Amend job fields; OCC-guarded; reverts QUOTED jobs to DRAFT"
    roles: [CarrierRep, Dispatcher]
    code: 200
    input: [expected_job_version, "load_description?", "width_inches?", "height_inches?", "length_inches?", "gross_weight_lbs?", "window_start_at?", "window_end_at?"]
    output: Job
    side_effects:
      - "QUOTED -> DRAFT (quote fields cleared); dimensional changes reset legs DETERMINED -> PENDING"
      - "increments Job.version by 1"

  - method: POST
    path: "/jobs/{id}/quote"
    description: "Determine per-leg escort requirements and compute the provisional quote"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Job
    side_effects:
      - "Per leg: escort_requirement_determination; legs PENDING -> DETERMINED"
      - "quote_estimate: quoted_cents, quoted_at = now, quote_expires_at = now + 72h, total_escort_positions"
      - "job_status -> QUOTED; increments Job.version by 1"

  - method: POST
    path: "/jobs/{id}/accept-quote"
    description: "Carrier accepts the quote; places the credit hold"
    roles: [CarrierRep]
    code: 200
    input: []
    output: Job
    side_effects: ["job_status -> BOOKED; booked_at = now; credit hold per carrier_credit_availability", "increments Job.version by 1"]

  - method: POST
    path: "/jobs/{id}/schedule"
    description: "Schedule a CLEARED job after permit-window, curfew, and assignment-completeness validation"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Job
    side_effects: ["job_status -> SCHEDULED", "increments Job.version by 1"]

  - method: POST
    path: "/jobs/{id}/depart"
    description: "Depart a SCHEDULED job; activates all ACCEPTED assignments"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Job
    side_effects: ["job_status -> EN_ROUTE; departed_at = now; assignments ACCEPTED -> ACTIVE (activated_at, last_checkin_at = now)", "increments Job.version by 1"]

  - method: POST
    path: "/jobs/{id}/hold"
    description: "Place an EN_ROUTE job on hold (weather/curfew/carrier)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Job
    side_effects: ["job_status -> ON_HOLD", "increments Job.version by 1"]

  - method: POST
    path: "/jobs/{id}/resume"
    description: "Resume an ON_HOLD job"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Job
    side_effects: ["job_status -> EN_ROUTE", "increments Job.version by 1"]

  - method: POST
    path: "/jobs/{id}/deliver"
    description: "Deliver an EN_ROUTE job; enforces the 90-minute communication protocol; completes assignments and legs"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Job
    side_effects: ["job_status -> DELIVERED; delivered_at = now; assignments ACTIVE -> COMPLETED with final_billing fees; legs CLEARED -> COMPLETED", "increments Job.version by 1"]

  - method: POST
    path: "/jobs/{id}/cancel"
    description: "Cancel a non-delivered job; tiered cancellation fee; releases assignments and the credit hold"
    roles: [CarrierRep, Dispatcher]
    code: 200
    input: ["reason?"]
    output: Job
    side_effects: ["job_status -> CANCELLED; cancel_fee per cancellation_fee calc; assignments OFFERED/ACCEPTED/ACTIVE -> RELEASED (JOB_CANCELLED); credit hold released", "increments Job.version by 1"]

  # --- RouteLeg ---
  - method: GET
    path: "/jobs/{id}/legs"
    description: "List legs of a job"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "RouteLeg[]"
    side_effects: []

  - method: GET
    path: "/legs/{id}"
    description: "Get one leg (requirements, gates, clearance verdict)"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: []
    output: RouteLeg
    side_effects: []

  - method: POST
    path: "/legs/{id}/confirm-police"
    description: "Confirm police escort coordination for a leg that requires it"
    roles: [Dispatcher]
    code: 200
    input: []
    output: RouteLeg
    side_effects: ["police_confirmed = true (ERR_INVALID_REQUEST when leg.requires_police_escort is false)", "Re-evaluates leg/job CLEARED gates", "increments RouteLeg.version by 1"]

  # --- Permit ---
  - method: POST
    path: "/legs/{id}/permits"
    description: "Record a state oversize permit application for a leg"
    roles: [Dispatcher]
    code: 201
    input: [permit_number, valid_from, valid_until, "holiday_closure_dates?"]
    output: Permit
    side_effects: ["permit_status = APPLIED"]

  - method: GET
    path: "/legs/{id}/permits"
    description: "List permits of a leg"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Permit[]"
    side_effects: []

  - method: POST
    path: "/permits/{id}/issue"
    description: "Mark a permit issued by the state"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Permit
    side_effects: ["permit_status -> ISSUED; issued_at = now", "Re-evaluates leg CLEARED gate -> job CLEARED gate", "increments Permit.version by 1"]

  # --- RouteSurvey / Obstruction ---
  - method: POST
    path: "/legs/{id}/route-surveys"
    description: "Request a route survey for a leg (re-opens a BLOCKED leg)"
    roles: [RouteSurveyor]
    code: 201
    input: []
    output: RouteSurvey
    side_effects: ["survey_status = REQUESTED", "BLOCKED leg -> DETERMINED with clearance_verdict reset to UNKNOWN", "At most one non-terminal survey per leg (ERR_OPEN_SURVEY_EXISTS)"]

  - method: GET
    path: "/legs/{id}/route-surveys"
    description: "List surveys of a leg"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "RouteSurvey[]"
    side_effects: []

  - method: GET
    path: "/route-surveys/{id}"
    description: "Get one survey"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: []
    output: RouteSurvey
    side_effects: []

  - method: POST
    path: "/route-surveys/{id}/submit"
    description: "Submit field findings and obstructions for a requested survey"
    roles: [RouteSurveyor]
    code: 200
    input: [surveyed_min_clearance_inches, "obstructions?"]
    output: RouteSurvey
    side_effects: ["survey_status -> SUBMITTED; submitted_at = now", "Creates Obstruction rows (append-only)", "leg.survey_min_clearance_inches set (provisional)", "increments RouteSurvey.version by 1"]

  - method: POST
    path: "/route-surveys/{id}/accept"
    description: "SafetyManager decision on a submitted survey; OCC-guarded on the leg; supersedes the previously ACCEPTED survey"
    roles: [SafetyManager]
    code: 200
    input: [expected_leg_version, outcome, "rejection_reason?"]
    output: RouteSurvey
    side_effects:
      - "outcome=ACCEPTED: survey -> ACCEPTED; prior ACCEPTED survey on this leg -> SUPERSEDED; clearance_verdict per clearance_assessment surveyed variant; leg -> BLOCKED (FAIL) or -> CLEARED when remaining gates hold (PASS); job gate re-evaluated"
      - "outcome=REJECTED: survey -> REJECTED (rejection_reason required)"
      - "increments RouteSurvey.version by 1 AND increments RouteLeg.version by 1"

  - method: GET
    path: "/route-surveys/{id}/obstructions"
    description: "List obstructions recorded by a survey"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Obstruction[]"
    side_effects: []

  # --- EscortAssignment ---
  - method: POST
    path: "/legs/{id}/assignments"
    description: "Offer an escort position on a leg; escort_id omitted -> deterministic selector per escort_selection_ranking"
    roles: [Dispatcher]
    code: 201
    input: [position, "escort_id?"]
    output: EscortAssignment
    side_effects: ["assignment_status = OFFERED; offered_at = now", "Explicit path: certification/equipment/overlap validations; selector path: ERR_NO_ELIGIBLE_ESCORT when pool empty"]

  - method: GET
    path: "/legs/{id}/assignments"
    description: "List assignments of a leg"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "EscortAssignment[]"
    side_effects: []

  - method: GET
    path: "/assignments/{id}"
    description: "Get one assignment"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: []
    output: EscortAssignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "List assignments with filters (paginated)"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["escort_id?", "leg_id?", "assignment_status?", "limit?", "offset?"]
    output: "EscortAssignment[]"
    side_effects: []

  - method: POST
    path: "/assignments/{id}/accept"
    description: "Escort accepts an offered assignment"
    roles: [EscortOperator]
    code: 200
    input: []
    output: EscortAssignment
    side_effects: ["assignment_status -> ACCEPTED; accepted_at = now; escort.active_assignment_count incremented", "increments EscortAssignment.version by 1"]

  - method: POST
    path: "/assignments/{id}/decline"
    description: "Escort declines an offered assignment"
    roles: [EscortOperator]
    code: 200
    input: []
    output: EscortAssignment
    side_effects: ["assignment_status -> DECLINED", "increments EscortAssignment.version by 1"]

  - method: POST
    path: "/assignments/{id}/release"
    description: "Dispatcher releases an OFFERED/ACCEPTED assignment (reassignment flow)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: EscortAssignment
    side_effects: ["assignment_status -> RELEASED (cause DISPATCHER); count decremented when was ACCEPTED", "SCHEDULED job losing a required position -> CLEARED", "increments EscortAssignment.version by 1"]

  - method: POST
    path: "/assignments/{id}/check-ins"
    description: "Record a driver/escort position check-in (communication protocol)"
    roles: [EscortOperator]
    code: 201
    input: []
    output: EscortAssignment
    side_effects: ["last_checkin_at = now (allowed while ACCEPTED or ACTIVE; else ERR_ASSIGNMENT_INVALID_STATE)", "increments EscortAssignment.version by 1"]

  # --- DelayEvent ---
  - method: POST
    path: "/jobs/{id}/delay-events"
    description: "Open a delay/standby event on an in-progress job"
    roles: [Dispatcher, EscortOperator]
    code: 201
    input: [cause, started_at]
    output: DelayEvent
    side_effects: ["delay_status = OPEN", "Requires job EN_ROUTE or ON_HOLD (ERR_JOB_INVALID_STATE); at most one OPEN event per job (ERR_OPEN_DELAY_EVENT_EXISTS)"]

  - method: GET
    path: "/jobs/{id}/delay-events"
    description: "List delay events of a job"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "DelayEvent[]"
    side_effects: []

  - method: POST
    path: "/delay-events/{id}/close"
    description: "Close an open delay event; computes standby billing with per-event rounding"
    roles: [Dispatcher, EscortOperator]
    code: 200
    input: []
    output: DelayEvent
    side_effects: ["delay_status -> CLOSED; ended_at = now; raw_minutes/billable_minutes/standby_amount_cents per standby_billing", "increments DelayEvent.version by 1"]

  # --- Incident ---
  - method: POST
    path: "/jobs/{id}/incidents"
    description: "Report an incident on a job (optionally tied to an escort assignment)"
    roles: [CarrierRep, Dispatcher, EscortOperator]
    code: 201
    input: [incident_type, description, claimed_amount_cents, "assignment_id?"]
    output: Incident
    side_effects: ["incident_status = REPORTED; reporter_role/reporter_user_id stamped", "Requires job EN_ROUTE, ON_HOLD, or DELIVERED (ERR_JOB_INVALID_STATE)"]

  - method: GET
    path: "/jobs/{id}/incidents"
    description: "List incidents of a job"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Incident[]"
    side_effects: []

  - method: GET
    path: "/incidents/{id}"
    description: "Get one incident"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/incidents"
    description: "List incidents with filters (paginated)"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["assignment_id?", "incident_status?", "limit?", "offset?"]
    output: "Incident[]"
    side_effects: []

  - method: POST
    path: "/incidents/{id}/assess"
    description: "Assess liability share (initial or re-assessment after dispute); segregation of duties vs reporter"
    roles: [SafetyManager, Dispatcher]
    code: 200
    input: [escort_fault_share_pct]
    output: Incident
    side_effects: ["incident_status -> ASSESSED; incident_liability_assessment sets assessed_amount_cents/escort_share_cents; assessed_by_user_id stamped", "increments Incident.version by 1"]

  - method: POST
    path: "/incidents/{id}/dispute"
    description: "Carrier disputes an assessed incident"
    roles: [CarrierRep]
    code: 200
    input: ["reason?"]
    output: Incident
    side_effects: ["incident_status -> DISPUTED", "increments Incident.version by 1"]

  - method: POST
    path: "/incidents/{id}/settle"
    description: "Settle an assessed incident; applies chargeback and reliability penalty cascade"
    roles: [FinanceManager]
    code: 200
    input: []
    output: Incident
    side_effects: ["incident_status -> SETTLED; settled_at = now", "Chargeback consumable by invoice composition", "assignment_id present -> escort_reliability_update; reliability < 40 -> escort SUSPENDED -> assignments RELEASED -> jobs demoted", "increments Incident.version by 1"]

  # --- Invoice ---
  - method: POST
    path: "/jobs/{id}/invoices"
    description: "Generate a DRAFT invoice for a DELIVERED or CANCELLED job"
    roles: [BillingClerk]
    code: 201
    input: []
    output: Invoice
    side_effects: ["invoice_status = DRAFT; generated_by_user_id stamped", "invoice_total_composition (CALC-6) computes all monetary fields", "Job must be DELIVERED or CANCELLED (ERR_JOB_INVALID_STATE); at most one non-terminal invoice per job (ERR_ACTIVE_INVOICE_EXISTS); CANCELLED job with cancel_fee_cents == 0 and no COMPLETED assignments -> ERR_INVALID_REQUEST"]

  - method: GET
    path: "/jobs/{id}/invoices"
    description: "List invoices of a job"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/invoices/{id}"
    description: "Get one invoice"
    roles: [CarrierRep, Dispatcher, EscortOperator, RouteSurveyor, SafetyManager, BillingClerk, FinanceManager]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/finalize"
    description: "Finalize a DRAFT invoice (maker-checker: not the generator); recomputes chargebacks and totals"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Invoice
    side_effects: ["invoice_status -> FINALIZED; CALC-6 re-run; finalized_at = now", "increments Invoice.version by 1"]

  - method: POST
    path: "/invoices/{id}/dispute"
    description: "Carrier disputes a FINALIZED invoice"
    roles: [CarrierRep]
    code: 200
    input: [dispute_reason]
    output: Invoice
    side_effects: ["invoice_status -> DISPUTED; dispute_reason recorded", "increments Invoice.version by 1"]

  - method: POST
    path: "/invoices/{id}/adjust"
    description: "BillingClerk adjusts a DISPUTED invoice back to FINALIZED with a signed delta"
    roles: [BillingClerk]
    code: 200
    input: [adjustment_delta_cents, adjustment_note]
    output: Invoice
    side_effects: ["adjustment_delta_cents accumulated; total_cents recomputed; invoice_status -> FINALIZED; finalized_at = now", "increments Invoice.version by 1"]

  - method: POST
    path: "/invoices/{id}/record-payment"
    description: "Record exact full payment of a FINALIZED invoice"
    roles: [FinanceManager]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["invoice_status -> PAID; paid_at = now; carrier.ytd_billed_cents += total_cents; credit recomputed; job DELIVERED -> CLOSED", "increments Invoice.version by 1"]

  - method: POST
    path: "/invoices/{id}/write-off"
    description: "Write off a FINALIZED invoice as bad debt"
    roles: [FinanceManager]
    code: 200
    input: ["reason?"]
    output: Invoice
    side_effects: ["invoice_status -> WRITTEN_OFF; credit recomputed (no ytd credit); job DELIVERED -> CLOSED", "increments Invoice.version by 1"]

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth & request shape ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller does not own the target resource (CarrierRep vs job.carrier_id; EscortOperator vs assignment.escort_id)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, type mismatch, range violation (dimensions > 0, windows ordered, pct 0..100), unsupported state_code, confirm-police on a leg that does not require it, generate on empty CANCELLED job" }
  - { id: ERR_INVALID_ENUM_VALUE, http: 400, condition: "Enum field value outside declared membership (position, cause, outcome, incident_type, obstruction_type, disposition)" }

  # --- Existence (404) ---
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "Carrier id not found (path or body)" }
  - { id: ERR_ESCORT_NOT_FOUND, http: 404, condition: "Escort id not found (path or body)" }
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "Job id not found" }
  - { id: ERR_LEG_NOT_FOUND, http: 404, condition: "RouteLeg id not found" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Permit id not found" }
  - { id: ERR_SURVEY_NOT_FOUND, http: 404, condition: "RouteSurvey id not found" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "EscortAssignment id not found" }
  - { id: ERR_DELAY_EVENT_NOT_FOUND, http: 404, condition: "DelayEvent id not found" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "Incident id not found" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id not found" }

  # --- State preconditions (409) ---
  - { id: ERR_JOB_INVALID_STATE, http: 409, condition: "Job not in a state that permits the operation (quote needs DRAFT; accept needs QUOTED; schedule needs CLEARED; depart needs SCHEDULED; hold needs EN_ROUTE; resume needs ON_HOLD; deliver needs EN_ROUTE; cancel excludes DELIVERED/CLOSED/CANCELLED and jobs with FINALIZED/DISPUTED/PAID invoices; amendments need DRAFT/QUOTED; delay/incident creation need an in-progress or delivered job; permit issue needs BOOKED/CLEARED/SCHEDULED job)" }
  - { id: ERR_LEG_INVALID_STATE, http: 409, condition: "Leg not in a state that permits the operation (assignments need DETERMINED/CLEARED; surveys need DETERMINED/BLOCKED)" }
  - { id: ERR_PERMIT_INVALID_STATE, http: 409, condition: "Permit not APPLIED for issue" }
  - { id: ERR_SURVEY_INVALID_STATE, http: 409, condition: "Survey not REQUESTED for submit / not SUBMITTED for accept" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "Assignment not in the required state (accept/decline need OFFERED; release needs OFFERED/ACCEPTED; check-in needs ACCEPTED/ACTIVE)" }
  - { id: ERR_DELAY_EVENT_INVALID_STATE, http: 409, condition: "Delay event not OPEN for close" }
  - { id: ERR_INCIDENT_INVALID_STATE, http: 409, condition: "Incident not in the required state (assess needs REPORTED/DISPUTED; dispute needs ASSESSED; settle needs ASSESSED)" }
  - { id: ERR_INVOICE_INVALID_STATE, http: 409, condition: "Invoice not in the required state (finalize needs DRAFT; dispute/payment/write-off need FINALIZED; adjust needs DISPUTED)" }
  - { id: ERR_ESCORT_INVALID_STATE, http: 409, condition: "Escort not in the required state (suspend needs ACTIVE; reinstate needs SUSPENDED; assignment accept needs escort ACTIVE)" }

  # --- Business: safety (422/409) ---
  - { id: ERR_ESCORT_NOT_CERTIFIED_FOR_STATE, http: 422, condition: "Explicit escort lacks certification for the leg's state_code" }
  - { id: ERR_HEIGHT_POLE_EQUIPMENT_MISSING, http: 422, condition: "FRONT-position assignment on a leg requiring a height pole, but the explicit escort lacks one or its height_pole_max_inches < job.height_inches" }

  # --- Business: temporal (409) ---
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "accept-quote at or after quote_expires_at" }
  - { id: ERR_PERMIT_WINDOW_INSUFFICIENT, http: 409, condition: "At schedule: no ISSUED permit fully covers the leg traversal window, or a holiday_closure_date falls on a traversed date" }
  - { id: ERR_CURFEW_WINDOW_VIOLATION, http: 409, condition: "At schedule: planned traversal intersects a state curfew window (half-open boundaries excluded)" }
  - { id: ERR_ESCORT_WINDOW_CONFLICT, http: 409, condition: "Buffered job window conflicts with another ACCEPTED/ACTIVE assignment of the escort (60-minute deadhead buffer both sides; touching edges allowed)" }
  - { id: ERR_COMMS_CHECKIN_OVERDUE, http: 409, condition: "At deliver: an ACTIVE assignment's last_checkin_at is more than 90 minutes before now" }

  # --- Business: referential (409) ---
  - { id: ERR_ACTIVE_INVOICE_EXISTS, http: 409, condition: "Job already has an invoice in DRAFT, FINALIZED, or DISPUTED" }
  - { id: ERR_OPEN_DELAY_EVENT_EXISTS, http: 409, condition: "Job already has an OPEN delay event" }
  - { id: ERR_OPEN_SURVEY_EXISTS, http: 409, condition: "Leg already has a survey in REQUESTED or SUBMITTED" }
  - { id: ERR_POSITION_QUOTA_FILLED, http: 409, condition: "Leg already has the required number of non-terminal assignments for that position" }
  - { id: ERR_ASSIGNMENTS_INCOMPLETE, http: 409, condition: "At schedule: a required escort position lacks an ACCEPTED assignment" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID as a prohibited prior actor (incident reporter cannot assess; invoice generator cannot finalize/adjust)" }

  # --- Business: fiscal (402/422) ---
  - { id: ERR_CREDIT_LIMIT_WOULD_BE_EXCEEDED, http: 402, condition: "accept-quote would push outstanding quoted + outstanding billed above credit_limit_cents" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "record-payment amount_cents != invoice.total_cents" }
  - { id: ERR_ADJUSTMENT_EXCEEDS_TOTAL, http: 422, condition: "adjust would drive total_cents below 0" }

  # --- Selector / OCC ---
  - { id: ERR_NO_ELIGIBLE_ESCORT, http: 422, condition: "Auto-select found no ACTIVE escort certified, equipped, and window-free for the leg" }
  - { id: ERR_STALE_JOB_VERSION, http: 412, condition: "expected_job_version != Job.version at amendments (OCC)" }
  - { id: ERR_STALE_LEG_VERSION, http: 412, condition: "expected_leg_version != RouteLeg.version at survey accept (OCC)" }

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: CarrierRep
    description: "Representative of the carrier (trucking company) booking the escort; owns its carrier's jobs, incidents disputes, and invoice disputes"
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /jobs — book a job for own carrier"
      - "POST /jobs/{id}/accept-quote — accept quote (own carrier's job)"
      - "POST /invoices/{id}/dispute — dispute own carrier's invoice"
      - "POST /incidents/{id}/dispute — dispute an incident on own carrier's job"
    shared_operations:
      - "POST /jobs/{id}/amendments (with Dispatcher; own carrier's job)"
      - "POST /jobs/{id}/cancel (with Dispatcher; own carrier's job)"
      - "POST /jobs/{id}/incidents (with Dispatcher, EscortOperator)"
      - "All GET endpoints"

  - name: Dispatcher
    description: "Pilot-car company dispatcher: quotes, permits, police coordination, assignments, movement control, standby tracking"
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers — register carriers"
      - "POST /escorts — register escorts"
      - "POST /jobs/{id}/quote — requirement determination + quote"
      - "POST /jobs/{id}/schedule, /depart, /hold, /resume, /deliver — movement control"
      - "POST /legs/{id}/confirm-police — police escort coordination"
      - "POST /legs/{id}/permits, POST /permits/{id}/issue — permit administration"
      - "POST /legs/{id}/assignments, POST /assignments/{id}/release — escort assignment management"
      - "POST /_clock/set_current_utc — logical clock control"
    shared_operations:
      - "POST /jobs/{id}/amendments, POST /jobs/{id}/cancel (with CarrierRep)"
      - "POST /jobs/{id}/delay-events, POST /delay-events/{id}/close (with EscortOperator)"
      - "POST /jobs/{id}/incidents, POST /incidents/{id}/assess (with CarrierRep/EscortOperator and SafetyManager respectively; SoD applies)"
      - "All GET endpoints"

  - name: EscortOperator
    description: "Certified pilot car operator; acts on own assignments and files field reports"
    identity: "entity_backed:Escort"
    exclusive_operations:
      - "POST /assignments/{id}/accept, /decline — respond to own offers"
      - "POST /assignments/{id}/check-ins — communication protocol check-ins on own assignments"
    shared_operations:
      - "POST /jobs/{id}/delay-events, POST /delay-events/{id}/close (with Dispatcher)"
      - "POST /jobs/{id}/incidents (with CarrierRep, Dispatcher)"
      - "All GET endpoints"

  - name: RouteSurveyor
    description: "Field surveyor performing route surveys and recording obstructions"
    identity: "opaque"
    exclusive_operations:
      - "POST /legs/{id}/route-surveys — request/open a survey"
      - "POST /route-surveys/{id}/submit — submit findings and obstructions"
    shared_operations:
      - "All GET endpoints"

  - name: SafetyManager
    description: "Safety authority: survey acceptance, escort suspension, incident assessment (never of own reports)"
    identity: "opaque"
    exclusive_operations:
      - "POST /route-surveys/{id}/accept — accept/reject surveys (OCC on leg)"
      - "POST /escorts/{id}/suspend, /reinstate — escort standing"
    shared_operations:
      - "POST /incidents/{id}/assess (with Dispatcher; SoD vs reporter applies)"
      - "All GET endpoints"

  - name: BillingClerk
    description: "Billing operator: generates, finalizes, and adjusts invoices (maker-checker: cannot finalize/adjust own generated invoice)"
    identity: "opaque"
    exclusive_operations:
      - "POST /jobs/{id}/invoices — generate invoice"
      - "POST /invoices/{id}/finalize — finalize invoice (SoD vs generator)"
      - "POST /invoices/{id}/adjust — adjust disputed invoice (SoD vs generator)"
    shared_operations:
      - "All GET endpoints"

  - name: FinanceManager
    description: "Finance authority: settles incidents, records payments, writes off bad debt"
    identity: "opaque"
    exclusive_operations:
      - "POST /incidents/{id}/settle — settle assessed incidents"
      - "POST /invoices/{id}/record-payment — record exact payment"
      - "POST /invoices/{id}/write-off — write off invoice"
    shared_operations:
      - "All GET endpoints"

