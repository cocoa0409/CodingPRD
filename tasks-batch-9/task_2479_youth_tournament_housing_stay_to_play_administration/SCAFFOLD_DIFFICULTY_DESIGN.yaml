            - "Booking.${bk_first_id}.projected_room_nights == 2"
            - "Booking.${bk_ok_id}.booking_status == DRAFT"
            - "Booking.${bk_ok_id}.check_in_date == 2026-09-13"
            - "Booking.${bk_ok_id}.projected_room_nights == 1"
            - "Booking.${bk_ok_id}.room_block_id == ${blockB_id}"

      - name: hotel_aggregate_night_capacity_half_open_adjacency_allowed
        grounds:
          - validations[priority=58]
          - errors.ERR_HOTEL_NIGHT_CAPACITY_EXCEEDED
          - endpoints[POST /housing/room-blocks]
        distinguishing_aspect: |
          The OPPOSITE interval semantics on a DIFFERENT resource entity: HALF-OPEN nights with
          adjacency ALLOWED, contending for Hotel.total_rooms rather than for a team's calendar,
          and checked as a per-night SUM rather than as exclusive occupation. A 6-room block over
          [2026-09-10, 2026-09-13) plus a 5-room block over [2026-09-12, 2026-09-15) share the
          single night 2026-09-12, where 6 + 5 = 11 exceeds the hotel's 10 rooms, so the second
          block is rejected. Moving that block to [2026-09-13, 2026-09-15) makes it adjacent to
          the first with no shared night, and it is accepted even though the closed intervals
          would still touch at 2026-09-13.
        test_recipe:
          setup:
            - "Tournament posture OPEN, 2026-09-10 to 2026-09-13, so the legal block window is 2026-09-08 to 2026-09-15."
            - "One Hotel with total_rooms 10."
            - "One HotelContract left in DRAFT, carrying one OPEN 6-room block over 2026-09-10 to 2026-09-13."
