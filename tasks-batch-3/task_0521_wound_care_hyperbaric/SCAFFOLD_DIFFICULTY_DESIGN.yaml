    - state_machines.TreatmentPlan.SUSPENDED_to_ACTIVE
    distinguishing_aspect: TreatmentPlan cycles ACTIVE -> SUSPENDED -> ACTIVE via suspend then resume; the same plan id returns to ACTIVE (cyclic) — distinct entity from PriorAuthorization's resubmission cycle.
