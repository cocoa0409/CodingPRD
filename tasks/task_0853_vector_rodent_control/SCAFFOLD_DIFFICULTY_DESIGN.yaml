              payload: { notice_type: "EDUCATIONAL_ADVISORY", delivery_method: "FIRST_CLASS_MAIL" }
              as: IntakeClerk
              captures: { edu_notice_id: $.data.id }
            - call: "POST /vector-control/notices/${edu_notice_id}/service-result"
              payload: { service_outcome: "DELIVERED" }
              as: IntakeClerk
            - call: "POST /vector-control/inspections"
              payload: { kind: "REINSPECTION", abatement_order_id: "${order_id}", officer_id: "${insp2_id}", scheduled_start: "2026-05-12T10:00:00Z", scheduled_end: "2026-05-12T11:00:00Z" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { reinsp_id: $.data.id }
            - call: "POST /vector-control/_clock/set_current_utc"
