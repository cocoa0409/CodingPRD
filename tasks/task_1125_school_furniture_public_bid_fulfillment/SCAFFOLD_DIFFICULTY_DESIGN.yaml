# =============================================================================
# Task 1125: School Furniture & Public Bid Fulfillment — §1.8 Difficulty Design
# 9 Difficulty Rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: poline_pricing_coop_tiered_vs_award_flat_divergence
        grounds:
          - calculations.coop_tiered_unit_price
          - entities.POLine.fields.computed_unit_price_cents
          - entities.POLine.fields.line_total_cents
        distinguishing_aspect: |
          coop_tiered_unit_price has two variants selected by Award.pricing_mode on the POLine
          entity domain (order pricing): identical ordered_qty=20 against identical spec economics
          (cap 13000, tier-1 12000) yields line_total_cents 240000 under COOP_TIERED vs 220000
          under AWARD_FLAT (flat 11000) — same inputs, different totals, on a different entity
          domain than the warranty coverage variant pair.
        test_recipe:
          setup:
            - "District D1 (cap 100000000, not enrolled); coop agreement C1 (2026 tiers 1:12000 / 100:10500 / 250:9000)"
            - "Spec A (window 2026-06-15..2026-08-15) with line qty 500 cap 13000; published, closed, awarded COOP_TIERED, accepted; PO-A1 created"
            - "Spec B (same economics) awarded AWARD_FLAT flat 11000, accepted; PO-B1 created"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/coop-agreements", payload: { name: "Coop C1", contract_year: 2026, tier_table: [ { min_qty: 1, unit_price_cents: 12000 }, { min_qty: 100, unit_price_cents: 10500 }, { min_qty: 250, unit_price_cents: 9000 } ] }, as: ContractManager, captures: { coop1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "COOP_TIERED", coop_agreement_id: "${coop1}", install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5, extended_years: 3 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-A1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { poA: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec B", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specB: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specB}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slB: $.data.id } }
            - { call: "POST /v1/bid-specs/${specB}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specB}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specB}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardB: $.data.id } }
            - { call: "POST /v1/awards/${awardB}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardB}", po_number: "PO-B1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { poB: $.data.id } }
          trigger:
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${poA}", spec_line_id: "${slA}", ordered_qty: 20 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { lineA: $.data.id, lineA_total: $.data.line_total_cents, lineA_unit: $.data.computed_unit_price_cents } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${poB}", spec_line_id: "${slB}", ordered_qty: 20 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { lineB_total: $.data.line_total_cents, lineB_unit: $.data.computed_unit_price_cents } }
          assert:
            - "POLine.${lineA}.line_total_cents == 240000 (20 units x tier-1 12000, cumulative base 0)"
            - "POLine.${lineA}.computed_unit_price_cents == 12000"
            - "lineB_total == 220000 (20 x flat 11000)"
            - "lineB_unit == 11000"
            - "lineA_total != lineB_total despite identical ordered_qty=20 and identical spec economics"

      - name: warranty_standard_term_vs_extended_prorated_divergence
        grounds:
          - calculations.warranty_coverage_cents
          - entities.WarrantyClaim.fields.coverage_cents
          - entities.District.fields.extended_warranty_enrolled
        distinguishing_aspect: |
          warranty_coverage_cents has STANDARD_TERM vs EXTENDED_PRORATED variants selected by
          District.extended_warranty_enrolled: identical claim economics (parts_cost_cents=90000
          filed 400 days past base term end 2031-07-08) yield ERR_WARRANTY_EXPIRED under
          STANDARD_TERM vs coverage_cents == 30000 (1 - 2/3 of 90000) under EXTENDED_PRORATED —
          service-costing domain, distinct from the POLine pricing variant pair.
        test_recipe:
          setup:
            - "District DN (not enrolled) and District DE (enrolled); same coop C1; each has a spec/line qty 500 cap 13000, COOP award (warranty 5y + extended 3y), PO with line qty 10 (unit 12000), shipment delivered 10, install task completed with clock at 2026-07-08T10:00:00Z so installed_at = 2026-07-08"
            - "base_end = 2031-07-08 for both lines; claim date 2032-08-12 is 400 days past base_end"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District DN", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { dN: $.data.id } }
            - { call: "POST /v1/districts", payload: { name: "District DE", annual_cap_cents: 100000000, extended_warranty_enrolled: true }, as: ContractorAdmin, captures: { dE: $.data.id } }
            - { call: "POST /v1/coop-agreements", payload: { name: "Coop C1", contract_year: 2026, tier_table: [ { min_qty: 1, unit_price_cents: 12000 }, { min_qty: 100, unit_price_cents: 10500 }, { min_qty: 250, unit_price_cents: 9000 } ] }, as: ContractManager, captures: { coop1: $.data.id } }
            - { call: "POST /v1/school-sites", payload: { district_id: "${dN}", name: "North HS", daily_crew_capacity: 5 }, as: DistrictBuyer, as_user_id: "${dN}", captures: { siteN: $.data.id } }
            - { call: "POST /v1/school-sites", payload: { district_id: "${dE}", name: "East HS", daily_crew_capacity: 5 }, as: DistrictBuyer, as_user_id: "${dE}", captures: { siteE: $.data.id } }
            - { call: "POST /v1/crews", payload: { name: "Crew Alpha" }, as: ContractorAdmin, captures: { crewN: $.data.id } }
            - { call: "POST /v1/crews", payload: { name: "Crew Beta" }, as: ContractorAdmin, captures: { crewE: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${dN}", title: "Spec N", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${dN}", captures: { specN: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specN}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${dN}", captures: { slN: $.data.id } }
            - { call: "POST /v1/bid-specs/${specN}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${dN}" }
            - { call: "POST /v1/bid-specs/${specN}/close", payload: {}, as: DistrictBuyer, as_user_id: "${dN}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specN}", district_id: "${dN}", pricing_mode: "COOP_TIERED", coop_agreement_id: "${coop1}", install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5, extended_years: 3 }, as: DistrictBuyer, as_user_id: "${dN}", captures: { awardN: $.data.id } }
            - { call: "POST /v1/awards/${awardN}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardN}", po_number: "PO-N1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${dN}", captures: { poN: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${poN}", spec_line_id: "${slN}", ordered_qty: 10 }, as: DistrictBuyer, as_user_id: "${dN}", captures: { lineN: $.data.id } }
            - { call: "POST /v1/purchase-orders/${poN}/accept", payload: {}, as: FulfillmentCoordinator }
            - { call: "POST /v1/shipments", payload: { purchase_order_id: "${poN}", school_site_id: "${siteN}", scheduled_date: "2026-07-01", lines: [ { po_line_id: "${lineN}", qty: 10 } ] }, as: FulfillmentCoordinator, captures: { shipN: $.data.id } }
            - { call: "POST /v1/shipments/${shipN}/mark-delivered", payload: { lines: [ { po_line_id: "${lineN}", delivered_qty: 10, manufacturer: "Acme", model: "Desk-100" } ] }, as: FulfillmentCoordinator }
            - { call: "POST /v1/install-tasks", payload: { shipment_id: "${shipN}", crew_id: "${crewN}", school_site_id: "${siteN}", room_label: "N-101", start_date: "2026-07-06", end_date: "2026-07-08", crew_count: 1 }, as: FulfillmentCoordinator, captures: { taskN: $.data.id } }
            - { call: "POST /v1/install-tasks/${taskN}/start", payload: {}, as: CrewLead, as_user_id: "${crewN}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-07-08T10:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/install-tasks/${taskN}/complete", payload: { uncrated: true, debris_removed: true, placed: true }, as: CrewLead, as_user_id: "${crewN}" }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${dE}", title: "Spec E", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${dE}", captures: { specE: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specE}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${dE}", captures: { slE: $.data.id } }
            - { call: "POST /v1/bid-specs/${specE}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${dE}" }
            - { call: "POST /v1/bid-specs/${specE}/close", payload: {}, as: DistrictBuyer, as_user_id: "${dE}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specE}", district_id: "${dE}", pricing_mode: "COOP_TIERED", coop_agreement_id: "${coop1}", install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5, extended_years: 3 }, as: DistrictBuyer, as_user_id: "${dE}", captures: { awardE: $.data.id } }
            - { call: "POST /v1/awards/${awardE}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardE}", po_number: "PO-E1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${dE}", captures: { poE: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${poE}", spec_line_id: "${slE}", ordered_qty: 10 }, as: DistrictBuyer, as_user_id: "${dE}", captures: { lineE: $.data.id } }
            - { call: "POST /v1/purchase-orders/${poE}/accept", payload: {}, as: FulfillmentCoordinator }
            - { call: "POST /v1/shipments", payload: { purchase_order_id: "${poE}", school_site_id: "${siteE}", scheduled_date: "2026-07-01", lines: [ { po_line_id: "${lineE}", qty: 10 } ] }, as: FulfillmentCoordinator, captures: { shipE: $.data.id } }
            - { call: "POST /v1/shipments/${shipE}/mark-delivered", payload: { lines: [ { po_line_id: "${lineE}", delivered_qty: 10, manufacturer: "Acme", model: "Desk-100" } ] }, as: FulfillmentCoordinator }
            - { call: "POST /v1/install-tasks", payload: { shipment_id: "${shipE}", crew_id: "${crewE}", school_site_id: "${siteE}", room_label: "E-101", start_date: "2026-07-06", end_date: "2026-07-08", crew_count: 1 }, as: FulfillmentCoordinator, captures: { taskE: $.data.id } }
            - { call: "POST /v1/install-tasks/${taskE}/start", payload: {}, as: CrewLead, as_user_id: "${crewE}" }
            - { call: "POST /v1/install-tasks/${taskE}/complete", payload: { uncrated: true, debris_removed: true, placed: true }, as: CrewLead, as_user_id: "${crewE}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2032-08-12T09:00:00Z" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /v1/warranty-claims", payload: { po_line_id: "${lineN}", parts_cost_cents: 90000, description: "frame weld cracked" }, as: DistrictBuyer, as_user_id: "${dN}", captures: { errN: $.data.error_id } }
            - { call: "POST /v1/warranty-claims", payload: { po_line_id: "${lineE}", parts_cost_cents: 90000, description: "frame weld cracked" }, as: DistrictBuyer, as_user_id: "${dE}", captures: { claimE: $.data.id } }
            - { call: "POST /v1/warranty-claims/${claimE}/review", payload: {}, as: ServiceAgent }
            - { call: "POST /v1/warranty-claims/${claimE}/approve", payload: {}, as: ServiceAgent, captures: { covE: $.data.coverage_cents } }
          assert:
            - "errN == ERR_WARRANTY_EXPIRED (STANDARD_TERM: filing 400 days past base_end 2031-07-08 rejected)"
            - "covE == 30000 (EXTENDED_PRORATED: years_started = ceil(400/365) = 2, pct = 1 - 2/3, round_half_up(90000 * 1/3) = 30000)"
            - "WarrantyClaim.${claimE}.status == APPROVED"
            - "Identical parts_cost_cents=90000 and identical claim date produce opposite outcomes under the two variants"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: coop_marginal_tier_allocation_straddling_breakpoint
        grounds:
          - calculations.coop_tiered_unit_price
          - calculations.district_ytd_coop_volume
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (ordered_qty, cumulative YTD volume, 3-row tier
          table, pricing_mode) with non-linear marginal allocation — qty 20 stacked on cumulative
          90 straddles the min_qty=100 breakpoint, so units 91..100 price at 12000 and units
          99 stay at 12000 while units 100..110 price at 10500 (u >= min_qty); a flat single-rate
          reading (240000 or 210000) is wrong.
        test_recipe:
          setup:
            - "District D1; coop C1 tiers 1:12000/100:10500/250:9000; spec/line qty 500 cap 13000; COOP award accepted; PO-1 with line qty 90 (cumulative volume 90); PO-2 created, line qty 20 about to be added"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/coop-agreements", payload: { name: "Coop C1", contract_year: 2026, tier_table: [ { min_qty: 1, unit_price_cents: 12000 }, { min_qty: 100, unit_price_cents: 10500 }, { min_qty: 250, unit_price_cents: 9000 } ] }, as: ContractManager, captures: { coop1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "COOP_TIERED", coop_agreement_id: "${coop1}", install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 90 }, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-2", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po2: $.data.id } }
          trigger:
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po2}", spec_line_id: "${slA}", ordered_qty: 20 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { line2: $.data.id, line2_total: $.data.line_total_cents, line2_unit: $.data.computed_unit_price_cents } }
          assert:
            - "line2_total == 223500 (units 91..99 at 12000 = 108000; units 100..110 at 10500 = 115500, since u >= min_qty 100 reaches tier 2)"
            - "line2_unit == 11175 (round_half_up(223500 / 20))"
            - "line2_total != 240000 (naive all-tier-1) and != 210000 (naive all-tier-2) — marginal straddle confirmed"

      - name: install_closeout_per_line_rounding_before_sum
        grounds:
          - calculations.install_closeout_total_cents
          - entities.PurchaseOrder.fields.closeout_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-line round-to-whole-dollars BEFORE
          summing, then a credit rounded at the subtotal level — per-line-first gives subtotal
          100600 and closeout 97600, whereas sum-then-round gives 100500 / different credit;
          evaluation order is load-bearing.
        test_recipe:
          setup:
            - "District D1; spec window 2026-06-15..2026-08-15 (mid_date = 2026-07-15); line qty 500 cap 13000; AWARD_FLAT award flat 11000, install_rate_cents 25125; PO with two lines qty 2 each (same spec line); PO accepted; both lines delivered and installed with completion at 2026-07-08 (<= mid_date, credit applies)"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/school-sites", payload: { district_id: "${d1}", name: "West ES", daily_crew_capacity: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { site1: $.data.id } }
            - { call: "POST /v1/crews", payload: { name: "Crew Alpha" }, as: ContractorAdmin, captures: { crew1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 2 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 2 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l2: $.data.id } }
            - { call: "POST /v1/purchase-orders/${po1}/accept", payload: {}, as: FulfillmentCoordinator }
            - { call: "POST /v1/shipments", payload: { purchase_order_id: "${po1}", school_site_id: "${site1}", scheduled_date: "2026-07-01", lines: [ { po_line_id: "${l1}", qty: 2 }, { po_line_id: "${l2}", qty: 2 } ] }, as: FulfillmentCoordinator, captures: { ship1: $.data.id } }
