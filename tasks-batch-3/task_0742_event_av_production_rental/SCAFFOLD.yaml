# =============================================================================
# PRD Benchmark Scaffold — Event AV & Production Rental
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  742. Event AV & Production Rental: equipment (sound/lighting/staging/LED)
  inventory, event quote & package, crew (tech/operator) scheduling,
  load-in/out & venue logistics, sub-rental & cross-rental, damage/loss &
  deposit, multi-day & standby, certificate of insurance

domain_name: event-av-production-rental
api_prefix: "/"     # flat topology: peer top-level collections (/rental-orders, /equipment, ...)

complexity_profile:
  primary_archetype: quota_allocation          # finite equipment units reserved across overlapping event windows
  secondary_archetype: temporal_windowing       # multi-day equipment intervals + crew shift intervals with buffer
  complexity_layers:
    - optimistic_concurrency                    # OCC on RentalOrder.version (confirm-a-stale-quote race, §1.2.1)
    - cascading_side_effects                    # order-cancel and damage-check-in cascades (§1.3 / Rule 4)
    - dual_variant_calculation                  # provisional-vs-final revenue; hold-vs-settlement deposit
    - derived_field_reconciliation              # order money fields + availability recomputed from children

  entity_topology: flat                          # peer entities linked by FK; no nesting in URL paths
  state_machine_shape: cyclic                    # RentalOrder QUOTED<->DRAFT revision loop; branching on Reservation/DamageReport
  relationship_patterns:
    - one_to_many                                # RentalOrder -> reservations/assignments/etc.
    - many_to_many                               # EquipmentItem <-> RentalOrder via EquipmentReservation; CrewMember <-> RentalOrder via CrewAssignment
    - cross_aggregate                            # DamageReport -> DepositLedgerEntry; SubRental -> EquipmentReservation
  role_model: peer_roles                          # AccountManager / WarehouseManager / CrewChief own distinct resources; Client is entity_backed
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Client / production company name" }
      - { name: contact_email, type: string, source: input, description: "Primary billing contact email" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Max order quote_total_cents this customer may confirm against", constraints: ">= 0" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: dock_type, type: enum, source: input, description: "STREET_LEVEL | LOADING_DOCK | FREIGHT_ELEVATOR — load-in logistics class", default: "STREET_LEVEL" }
      - { name: required_coverage_cents, type: integer, source: input, description: "Minimum COI coverage_amount_cents the venue mandates for any order held here", constraints: ">= 0" }

  - name: EquipmentItem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Model name, e.g. 'K2 Line Array'" }
      - { name: category, type: enum, source: input, description: "SOUND | LIGHTING | STAGING | LED" }
      - { name: total_units, type: integer, source: input, description: "Owned unit count in the rental house inventory", constraints: ">= 1" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Rental price per unit per billable day", constraints: ">= 0" }
      - { name: replacement_value_cents, type: integer, source: input, description: "Full replacement cost per unit; drives deposit and loss charges", constraints: ">= 0" }
      - { name: requires_operator, type: boolean, source: input, description: "If true, a CrewAssignment of role OPERATOR is expected on-site", default: false }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Crew member full name" }
      - { name: crew_role, type: enum, source: input, description: "TECH | OPERATOR — skill class" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Base billing rate per hour", constraints: ">= 0" }

  - name: RentalOrder
    parent: null
    common_fields: true       # id, created_at, updated_at, version — version is the OCC field (§1.2.1)
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning client" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; event venue (drives required COI coverage)" }
      - { name: event_name, type: string, source: input, description: "Human label for the event" }
      - { name: event_start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) first event day; drives rush surcharge window" }
      - { name: event_end_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) last event day; COI must not expire on/before this", constraints: ">= event_start_date" }
      - { name: status, type: enum, source: system, description: "DRAFT -> QUOTED (<->DRAFT revise) -> CONFIRMED -> LOADED_OUT -> IN_EVENT -> LOADED_IN -> SETTLED; or CANCELLED", default: "DRAFT" }
      - { name: pricing_variant, type: enum, source: computed, description: "NONE | PROVISIONAL (at QUOTED) | FINAL (at SETTLED) — which pricing pass last ran", default: "NONE" }
      - { name: equipment_subtotal_cents, type: integer, source: computed, description: "Sum of per-line equipment charges (see equipment_line_pricing)", default: 0 }
      - { name: crew_subtotal_cents, type: integer, source: computed, description: "Sum of per-assignment crew labor charges (see crew_labor_pricing)", default: 0 }
      - { name: sub_rental_cost_cents, type: integer, source: computed, description: "Sum of CONFIRMED SubRental.cost_cents; included in FINAL pricing only", default: 0 }
      - { name: volume_discount_cents, type: integer, source: computed, description: "Volume discount from order_totals (keyed on pre-discount subtotal tier)", default: 0 }
      - { name: rush_surcharge_cents, type: integer, source: computed, description: "Rush surcharge frozen at QUOTED; recomputed FINAL uses the frozen value", default: 0 }
      - { name: quote_total_cents, type: integer, source: computed, description: "PROVISIONAL grand total set at QUOTED", default: 0 }
      - { name: final_total_cents, type: integer, source: computed, description: "FINAL grand total set at SETTLED (includes sub_rental_cost, actual qty/hours)", default: 0 }
      - { name: deposit_required_cents, type: integer, source: computed, description: "Forward-looking deposit estimate = round(DEPOSIT_RATE * sum(replacement_value*qty)) computed at CONFIRM", default: 0 }
      - { name: deposit_held_cents, type: integer, source: computed, description: "Sum of DepositLedgerEntry HOLD amounts for this order", default: 0 }
      - { name: deposit_captured_cents, type: integer, source: computed, description: "Sum of DepositLedgerEntry CAPTURE amounts", default: 0 }
      - { name: deposit_refunded_cents, type: integer, source: computed, description: "Sum of DepositLedgerEntry REFUND amounts", default: 0 }
      - { name: deposit_released_cents, type: integer, source: computed, description: "Sum of DepositLedgerEntry RELEASE amounts (hold reversed on cancel)", default: 0 }
      - { name: deposit_outstanding_cents, type: integer, source: computed, description: "deposit_held - deposit_captured - deposit_refunded - deposit_released", default: 0 }
      - { name: deposit_at_risk_cents, type: integer, source: computed, description: "Provisional exposure from open DamageReports (FILED/ASSESSED); see deposit_settlement", default: 0 }
      - { name: open_damage_count, type: integer, source: computed, description: "Count of DamageReports for this order in FILED or ASSESSED", default: 0 }
      - { name: has_approved_coi, type: boolean, source: computed, description: "True iff an APPROVED CertificateOfInsurance exists for this order", default: false }
      - { name: balance_cents, type: integer, source: computed, description: "final_total_cents + deposit_captured_cents at SETTLED; total amount due from customer (rental plus damages charged)", default: 0 }

  - name: EquipmentReservation
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> RentalOrder.id; owning order" }
      - { name: equipment_id, type: string, source: input, description: "FK -> EquipmentItem.id; reserved model" }
      - { name: qty, type: integer, source: input, description: "Units reserved", constraints: ">= 1" }
      - { name: reserve_start_date, type: string, source: input, description: "ISO date first billable day (includes load-out buffer day)" }
      - { name: reserve_end_date, type: string, source: input, description: "ISO date last billable day (includes load-in buffer day)", constraints: ">= reserve_start_date" }
      - { name: is_standby, type: boolean, source: input, description: "Standby unit billed at STANDBY_RATE_FACTOR of daily rate", default: false }
      - { name: billable_days, type: integer, source: computed, description: "(reserve_end_date - reserve_start_date) days + 1" }
      - { name: line_charge_cents, type: integer, source: computed, description: "Per-line charge from equipment_line_pricing (rounded per-line)" }
      - { name: status, type: enum, source: system, description: "HELD -> CHECKED_OUT -> CHECKED_IN | DAMAGED; HELD -> RELEASED", default: "HELD" }
      - { name: checked_out_qty, type: integer, source: system, description: "Units actually checked out at load-out (drives FINAL pricing)", default: 0 }
      - { name: lost_units, type: integer, source: system, description: "Units lost/damaged recorded at check-in", default: 0 }

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> RentalOrder.id; owning order" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id; assigned person" }
      - { name: assignment_role, type: enum, source: input, description: "TECH | OPERATOR — role for this shift (OPERATOR bills a premium)" }
      - { name: shift_start, type: datetime, source: input, description: "ISO 8601 UTC shift start (half-open interval start)" }
      - { name: shift_end, type: datetime, source: input, description: "ISO 8601 UTC shift end (exclusive)", constraints: "> shift_start" }
      - { name: scheduled_hours, type: number, source: input, description: "Planned billable hours for the shift", constraints: "> 0" }
      - { name: is_standby, type: boolean, source: input, description: "Standby crew still billed at MIN_CALL_HOURS minimum", default: false }
      - { name: actual_hours, type: number, source: system, description: "Actual hours recorded at completion (drives FINAL crew pricing)", default: 0 }
      - { name: assignment_cost_cents, type: integer, source: computed, description: "Per-assignment labor charge from crew_labor_pricing" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> CHECKED_IN -> COMPLETED; SCHEDULED -> CANCELLED", default: "SCHEDULED" }

  - name: SubRental
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> RentalOrder.id; order the sub-rental fulfills" }
      - { name: equipment_id, type: string, source: input, description: "FK -> EquipmentItem.id; the model being sub-rented in" }
      - { name: reservation_id, type: string, source: input, description: "FK -> EquipmentReservation.id; the shortfall reservation this covers", constraints: "optional" }
      - { name: direction, type: enum, source: input, description: "SUB_IN (rent in from vendor to cover shortfall) | CROSS_OUT (cross-rent owned gear out to a peer house)", default: "SUB_IN" }
      - { name: vendor_name, type: string, source: input, description: "Counterparty rental house / vendor" }
      - { name: qty, type: integer, source: input, description: "Units sub-rented", constraints: ">= 1" }
      - { name: cost_cents, type: integer, source: input, description: "Total cost of the sub-rental for the order (SUB_IN); revenue is out of scope for CROSS_OUT", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> CONFIRMED -> RETURNED; REQUESTED|CONFIRMED -> CANCELLED", default: "REQUESTED" }

  - name: CertificateOfInsurance
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> RentalOrder.id; the order this COI covers" }
      - { name: insurer, type: string, source: input, description: "Insurance carrier name" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Liability coverage this certificate provides", constraints: ">= 0" }
      - { name: expiry_date, type: string, source: input, description: "ISO date the certificate expires; must be strictly after event_end_date to approve" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED | REJECTED", default: "SUBMITTED" }
      - { name: reject_reason, type: string, source: system, description: "Populated on REJECTED", default: null }

  - name: DamageReport
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> RentalOrder.id; owning order" }
      - { name: reservation_id, type: string, source: input, description: "FK -> EquipmentReservation.id; the reserved line the damage/loss is against" }
      - { name: damaged_units, type: integer, source: input, description: "Units damaged (repairable)", default: 0, constraints: ">= 0" }
      - { name: lost_units, type: integer, source: input, description: "Units lost/destroyed (full replacement)", default: 0, constraints: ">= 0" }
      - { name: notes, type: string, source: input, description: "Free-text incident notes", default: null }
      - { name: assessed_cost_cents, type: integer, source: system, description: "Repair+replacement cost set at ASSESSED", default: 0 }
      - { name: captured_cents, type: integer, source: system, description: "Amount actually captured from the deposit at CHARGED (waterfall-limited)", default: 0 }
      - { name: status, type: enum, source: system, description: "FILED -> ASSESSED -> CHARGED | WAIVED", default: "FILED" }

  - name: DepositLedgerEntry
    parent: null
    common_fields: false      # append-only event: carries only id + created_at
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> RentalOrder.id; order whose deposit this entry moves" }
      - { name: damage_report_id, type: string, source: system, description: "FK -> DamageReport.id; set on CAPTURE entries, null otherwise", default: null }
      - { name: entry_type, type: enum, source: system, description: "HOLD (confirm) | CAPTURE (damage charge) | REFUND (settle remainder) | RELEASE (cancel reversal)" }
      - { name: amount_cents, type: integer, source: system, description: "Signed-magnitude amount (always positive; entry_type gives direction)", constraints: ">= 0" }
      - { name: note, type: string, source: system, description: "Human explanation of the entry", default: null }
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- RentalOrder: cyclic (QUOTED <-> DRAFT revision loop) ------------------
  - entity: RentalOrder
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /rental-orders/{id}/quote"
        actor: AccountManager
        preconditions:
          - "order has >= 1 EquipmentReservation in HELD (ERR_NO_RESERVATIONS)"
        side_effects:
          - "run equipment_line_pricing per reservation -> line_charge_cents; set equipment_subtotal_cents"
          - "run crew_labor_pricing per assignment -> assignment_cost_cents; set crew_subtotal_cents"
          - "run order_totals (PROVISIONAL): volume_discount_cents, rush_surcharge_cents (frozen), quote_total_cents"
          - "pricing_variant = PROVISIONAL"
          - "increments RentalOrder.version by 1"

      - from: QUOTED
        to: DRAFT
        trigger: "POST /rental-orders/{id}/revise"
        actor: AccountManager
        preconditions: []
        note: "Revision loop — client requested changes; reservations/assignments may be added or released, then re-quoted. Cyclic shape."
        side_effects:
          - "pricing_variant = NONE (prior quote is stale)"
          - "increments RentalOrder.version by 1"

      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /rental-orders/{id}/confirm"
        actor: AccountManager
        preconditions:
          - "expected_order_version equals current RentalOrder.version (ERR_STALE_VERSION) — OCC, §1.2.1"
          - "has_approved_coi == true AND that COI coverage >= venue.required_coverage_cents AND COI.expiry_date > event_end_date (ERR_COI_NOT_APPROVED) [business_safety]"
          - "quote_total_cents <= Customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED) [business_fiscal]"
        side_effects:
          - "run deposit_settlement HOLD variant: create DepositLedgerEntry(entry_type=HOLD, amount=deposit_required_cents)"
          - "recompute deposit_held_cents, deposit_outstanding_cents"
          - "reservations remain HELD (now firm)"
          - "increments RentalOrder.version by 1"

      - from: CONFIRMED
        to: LOADED_OUT
        trigger: "POST /rental-orders/{id}/load-out"
        actor: WarehouseManager
        preconditions: []
        side_effects:
          - "order becomes eligible for per-reservation check-out (EquipmentReservation HELD->CHECKED_OUT gated on this state) [cross-entity]"
          - "increments RentalOrder.version by 1"

      - from: LOADED_OUT
        to: IN_EVENT
        trigger: "POST /rental-orders/{id}/start-event"
        actor: AccountManager
        preconditions:
          - "every EquipmentReservation is CHECKED_OUT or RELEASED (ERR_RESERVATIONS_NOT_CHECKED_OUT)"
        side_effects:
          - "order becomes eligible for crew completion (CrewAssignment SCHEDULED->COMPLETED gated on this state) [cross-entity]"
          - "increments RentalOrder.version by 1"

      - from: IN_EVENT
        to: LOADED_IN
        trigger: "POST /rental-orders/{id}/load-in"
        actor: WarehouseManager
        preconditions:
          - "every CHECKED_OUT EquipmentReservation is now CHECKED_IN or DAMAGED (ERR_RESERVATIONS_NOT_CHECKED_IN)"
        side_effects:
          - "increments RentalOrder.version by 1"

      - from: LOADED_IN
        to: SETTLED
        trigger: "POST /rental-orders/{id}/settle"
        actor: AccountManager
        preconditions:
          - "every DamageReport for the order is CHARGED or WAIVED (ERR_OPEN_DAMAGE_REPORT) [business_referential]"
          - "has_approved_coi == true (ERR_COI_NOT_APPROVED) [business_safety]"
        side_effects:
          - "run equipment_line_pricing + crew_labor_pricing on ACTUAL values (checked_out_qty, actual_hours)"
          - "run order_totals (FINAL): include sub_rental_cost_cents; reuse frozen rush_surcharge_cents; set final_total_cents; pricing_variant = FINAL"
          - "run deposit_settlement SETTLE variant: create DepositLedgerEntry(entry_type=REFUND, amount=remaining hold)"
          - "recompute deposit_refunded_cents, deposit_outstanding_cents, balance_cents"
          - "increments RentalOrder.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /rental-orders/{id}/cancel"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "cascade: every non-terminal EquipmentReservation -> RELEASED; every SCHEDULED CrewAssignment -> CANCELLED"
          - "increments RentalOrder.version by 1"

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /rental-orders/{id}/cancel"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "cascade: every non-terminal EquipmentReservation -> RELEASED; every SCHEDULED CrewAssignment -> CANCELLED"
          - "increments RentalOrder.version by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /rental-orders/{id}/cancel"
        actor: AccountManager
        preconditions: []
        note: "Cascade-1 (Rule 4, depth>=3): order cancel -> reservation release -> linked sub-rental cancel -> order.sub_rental_cost recompute; plus deposit HOLD reversed via RELEASE ledger entry."
        side_effects:
          - "cascade link 1: every non-terminal EquipmentReservation -> RELEASED"
          - "cascade link 2: each released reservation's linked CONFIRMED SubRental (SubRental.reservation_id == reservation.id) -> CANCELLED"
          - "cascade link 3: each cancelled SubRental removes its cost_cents from RentalOrder.sub_rental_cost_cents (recompute)"
          - "every SCHEDULED CrewAssignment -> CANCELLED"
          - "reverse deposit: create DepositLedgerEntry(entry_type=RELEASE, amount=deposit_outstanding_cents); recompute deposit_released_cents, deposit_outstanding_cents -> 0"
          - "increments RentalOrder.version by 1"

  # --- EquipmentReservation: branching (CHECKED_OUT -> {CHECKED_IN, DAMAGED})
  - entity: EquipmentReservation
    initial_state: HELD
    terminal_states: [CHECKED_IN, DAMAGED, RELEASED]
    transitions:
      - from: HELD
        to: CHECKED_OUT
        trigger: "POST /equipment-reservations/{id}/check-out"
        actor: WarehouseManager
        preconditions:
          - "parent RentalOrder.status == LOADED_OUT (ERR_ORDER_NOT_LOADED_OUT) [cross-entity: reservation depends on order state]"
        side_effects:
          - "checked_out_qty = qty (recorded for FINAL pricing)"

      - from: CHECKED_OUT
        to: CHECKED_IN
        trigger: "POST /equipment-reservations/{id}/check-in (damaged=false)"
        actor: WarehouseManager
        preconditions:
          - "parent RentalOrder.status == IN_EVENT (ERR_INVALID_STATE)"
        side_effects:
          - "no damage recorded"

      - from: CHECKED_OUT
        to: DAMAGED
        trigger: "POST /equipment-reservations/{id}/check-in (damaged=true)"
        actor: WarehouseManager
        preconditions:
          - "parent RentalOrder.status == IN_EVENT (ERR_INVALID_STATE)"
        note: "Cascade-2 (Rule 4, depth>=3): reservation DAMAGED -> auto-create DamageReport(FILED) -> recompute order.deposit_at_risk_cents & open_damage_count."
        side_effects:
          - "cascade link 1: set lost_units from request body"
          - "cascade link 2: auto-create DamageReport(status=FILED, reservation_id=this.id, lost_units=this.lost_units)"
          - "cascade link 3: recompute RentalOrder.open_damage_count (+1) and deposit_at_risk_cents"

      - from: HELD
        to: RELEASED
        trigger: "POST /equipment-reservations/{id}/release (or RentalOrder cancel cascade)"
        actor: WarehouseManager
        preconditions:
          - "parent RentalOrder.status in {DRAFT, QUOTED, CONFIRMED} (ERR_INVALID_STATE)"
        side_effects:
          - "reserved units returned to EquipmentItem availability pool for the window"
          - "linked CONFIRMED SubRental (reservation_id == this.id) -> CANCELLED; recompute RentalOrder.sub_rental_cost_cents"

  # --- CrewAssignment: linear + cancel (cross-entity gate on complete) -------
  - entity: CrewAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /crew-assignments/{id}/complete"
        actor: CrewChief
        preconditions:
          - "parent RentalOrder.status in {IN_EVENT, LOADED_IN} (ERR_INVALID_STATE) [cross-entity: assignment depends on order state]"
        side_effects:
          - "set actual_hours from request body (drives FINAL crew_labor_pricing)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /crew-assignments/{id}/cancel (or RentalOrder cancel cascade)"
        actor: CrewChief
        preconditions: []
        side_effects:
          - "crew member's shift window frees up for other assignments"

  # --- SubRental: linear + cancel -------------------------------------------
  - entity: SubRental
    initial_state: REQUESTED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /sub-rentals/{id}/confirm"
        actor: WarehouseManager
        preconditions:
          - "parent RentalOrder.status in {DRAFT, QUOTED, CONFIRMED} (ERR_INVALID_STATE)"
        side_effects:
          - "SUB_IN adds qty to EquipmentItem effective availability for the window"
          - "add cost_cents to RentalOrder.sub_rental_cost_cents (recompute)"

      - from: CONFIRMED
        to: RETURNED
        trigger: "POST /sub-rentals/{id}/return"
        actor: WarehouseManager
        preconditions: []
        side_effects:
          - "SUB_IN capacity removed from EquipmentItem effective availability"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /sub-rentals/{id}/cancel"
        actor: WarehouseManager
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /sub-rentals/{id}/cancel (or EquipmentReservation release cascade)"
        actor: WarehouseManager
        preconditions: []
        side_effects:
          - "remove cost_cents from RentalOrder.sub_rental_cost_cents (recompute)"
          - "remove qty from EquipmentItem effective availability"

  # --- CertificateOfInsurance: branching (SUBMITTED -> {APPROVED, REJECTED}) -
  - entity: CertificateOfInsurance
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /certificates-of-insurance/{id}/approve"
        actor: AccountManager
        preconditions:
          - "coverage_amount_cents >= venue.required_coverage_cents of the order's venue (ERR_COI_INSUFFICIENT_COVERAGE) [boundary >=]"
          - "expiry_date > order.event_end_date (ERR_COI_EXPIRED)"
        side_effects:
          - "RentalOrder.has_approved_coi = true"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /certificates-of-insurance/{id}/reject"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "set reject_reason from request body; RentalOrder.has_approved_coi unchanged (stays false unless another APPROVED COI exists)"

  # --- DamageReport: branching (ASSESSED -> {CHARGED, WAIVED}) ---------------
  - entity: DamageReport
    initial_state: FILED
    terminal_states: [CHARGED, WAIVED]
    transitions:
      - from: FILED
        to: ASSESSED
        trigger: "POST /damage-reports/{id}/assess"
        actor: WarehouseManager
        preconditions: []
        side_effects:
          - "set assessed_cost_cents from request body; recompute RentalOrder.deposit_at_risk_cents"

      - from: ASSESSED
        to: CHARGED
        trigger: "POST /damage-reports/{id}/charge"
        actor: AccountManager
        preconditions:
          - "parent RentalOrder.status in {IN_EVENT, LOADED_IN} (ERR_INVALID_STATE)"
        note: "Divergent branch: CHARGED captures deposit (money moves); WAIVED does not."
        side_effects:
          - "capture = min(assessed_cost_cents, RentalOrder.deposit_outstanding_cents) [waterfall]"
          - "set captured_cents = capture; create DepositLedgerEntry(entry_type=CAPTURE, amount=capture, damage_report_id=this.id)"
          - "recompute RentalOrder.deposit_captured_cents, deposit_outstanding_cents, deposit_at_risk_cents, open_damage_count(-1)"

      - from: ASSESSED
        to: WAIVED
        trigger: "POST /damage-reports/{id}/waive"
        actor: AccountManager
        preconditions: []
        note: "Divergent branch: no deposit capture."
        side_effects:
          - "recompute RentalOrder.deposit_at_risk_cents, open_damage_count(-1); no ledger entry"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: confirm-stale-order
    parent_entity: RentalOrder
    write_endpoint: "POST /rental-orders/{id}/confirm"
    occ_field: "expected_order_version"
    description: |
      Confirming a RentalOrder whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      added or released a reservation (or a crew assignment), which re-ran
      order pricing and bumped the order's version — so the quote total the
      confirming client believes it is locking in is stale. Stated in OCC
      terms: expected_order_version no longer equals the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412
# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: equipment_line_pricing
    trigger: "RentalOrder quote (PROVISIONAL, uses qty) and settle (FINAL, uses checked_out_qty)"
    algorithm: tiered_pricing
    formula: |
      For each in-scope EquipmentReservation (status != RELEASED):
        units       = qty            (PROVISIONAL)  |  checked_out_qty (FINAL)
        billable_days = (reserve_end_date - reserve_start_date).days + 1     # inclusive
        raw_cents   = equipment.daily_rate_cents * units * billable_days
        if is_standby: raw_cents = raw_cents * STANDBY_RATE_FACTOR
        tier_pct    = MULTI_DAY_DISCOUNT tier selected by billable_days:
                        1-2 days  -> 0.00
                        3-6 days  -> 0.10
                        >=7 days  -> 0.15
        line_charge_cents = round_half_up(raw_cents * (1 - tier_pct))        # ROUND PER LINE
      equipment_subtotal_cents = sum(line_charge_cents over in-scope reservations)
    input_set: "EquipmentReservation rows for the order whose status != RELEASED"
    constants:
      STANDBY_RATE_FACTOR: 0.50
      MULTI_DAY_DISCOUNT: { "1_2": 0.00, "3_6": 0.10, "7_plus": 0.15 }
    precision: "round_half_up to whole cents, PER LINE, then sum (NOT sum-then-round)"
    variants:
      - name: provisional
        when: "at RentalOrder quote (DRAFT->QUOTED)"
        difference: "units = reservation.qty (planned)"
      - name: final
        when: "at RentalOrder settle (LOADED_IN->SETTLED)"
        difference: "units = reservation.checked_out_qty (actual); RELEASED reservations excluded"

  - name: crew_labor_pricing
    trigger: "RentalOrder quote (PROVISIONAL, uses scheduled_hours) and settle (FINAL, uses actual_hours)"
    algorithm: weighted_scoring
    formula: |
      For each CrewAssignment (status != CANCELLED):
        hours     = scheduled_hours  (PROVISIONAL)  |  actual_hours (FINAL)
        base_hours = max(hours, MIN_CALL_HOURS)                 # min-call floor
        ot_hours   = max(0, base_hours - OT_THRESHOLD_HOURS)    # overtime band
        reg_hours  = base_hours - ot_hours
        role_mult  = OPERATOR_PREMIUM if assignment_role == OPERATOR else 1.00
        reg_pay    = reg_hours * hourly_rate_cents * role_mult
        ot_pay     = ot_hours  * hourly_rate_cents * OT_MULTIPLIER * role_mult
        assignment_cost_cents = round_half_up(reg_pay + ot_pay)
      crew_subtotal_cents = sum(assignment_cost_cents over non-cancelled assignments)
    input_set: "CrewAssignment rows for the order whose status != CANCELLED"
    constants:
      MIN_CALL_HOURS: 4
      OT_THRESHOLD_HOURS: 10
      OT_MULTIPLIER: 1.5
      OPERATOR_PREMIUM: 1.20
    precision: "round_half_up to whole cents per assignment"
    variants:
      - name: provisional
        when: "at quote"
        difference: "hours = scheduled_hours"
      - name: final
        when: "at settle"
        difference: "hours = actual_hours"

  - name: order_totals
    trigger: "RentalOrder quote (PROVISIONAL) and settle (FINAL)"
    algorithm: threshold
    formula: |
      # Evaluation order is PINNED (circular-looking: surcharge depends on the
      # post-discount subtotal, discount depends on the pre-discount subtotal).
      subtotal_cents = equipment_subtotal_cents + crew_subtotal_cents
                       + (sub_rental_cost_cents if FINAL else 0)
      volume_tier = VOLUME_DISCOUNT tier selected by subtotal_cents:
                       subtotal < 100000            -> 0.00
                       100000 <= subtotal < 500000  -> 0.05
                       subtotal >= 500000           -> 0.10
      volume_discount_cents = round_half_up(subtotal_cents * volume_tier)
      discounted_cents = subtotal_cents - volume_discount_cents
      # rush_surcharge is computed ONCE at quote and frozen on the order:
      #   PROVISIONAL: if (event_start_date - clock_now).days <= RUSH_WINDOW_DAYS:
      #                  rush_surcharge_cents = round_half_up(discounted_cents * RUSH_SURCHARGE_PCT)
      #                else rush_surcharge_cents = 0
      #   FINAL: reuse the frozen rush_surcharge_cents (do NOT recompute)
      grand_total_cents = discounted_cents + rush_surcharge_cents
      # PROVISIONAL writes quote_total_cents; FINAL writes final_total_cents.
    input_set: "the order's own computed equipment_subtotal_cents, crew_subtotal_cents, sub_rental_cost_cents"
    constants:
      VOLUME_DISCOUNT: { "t0": 0.00, "t1": 0.05, "t2": 0.10 }
      RUSH_WINDOW_DAYS: 7
      RUSH_SURCHARGE_PCT: 0.08
    precision: "round_half_up to whole cents; discount before surcharge (pinned order)"
    variants:
      - name: provisional_quote_total
        when: "DRAFT->QUOTED"
        difference: "excludes sub_rental_cost_cents; freezes rush_surcharge_cents; writes quote_total_cents"
      - name: final_total
        when: "LOADED_IN->SETTLED"
        difference: "includes sub_rental_cost_cents; reuses frozen rush_surcharge_cents; writes final_total_cents"

  - name: deposit_settlement
    trigger: "RentalOrder confirm (HOLD forward estimate) and settle (chronological capture+refund)"
    algorithm: waterfall_allocation
    formula: |
      HOLD (forward-looking, at CONFIRM):
        deposit_required_cents = round_half_up(
            DEPOSIT_RATE * sum(equipment.replacement_value_cents * reservation.qty
                               over reservations with status != RELEASED) )
        DepositLedgerEntry(HOLD, amount=deposit_required_cents)
      CAPTURE (per DamageReport charge, waterfall over a running remaining hold):
        remaining = deposit_held_cents - deposit_captured_cents - deposit_released_cents
        capture   = min(assessed_cost_cents, remaining)
        DepositLedgerEntry(CAPTURE, amount=capture)
      SETTLE (chronological, at SETTLE): DamageReports already CHARGED in charge order.
        remaining_after = deposit_held_cents - deposit_captured_cents
        DepositLedgerEntry(REFUND, amount=remaining_after)
      RELEASE (compensating, at CANCEL of a CONFIRMED order):
        DepositLedgerEntry(RELEASE, amount=deposit_outstanding_cents)
      INVARIANT (conserved money): for any order that reaches SETTLED,
        deposit_held_cents == deposit_captured_cents + deposit_refunded_cents.
      INVARIANT (compensating): for a CONFIRMED order later CANCELLED,
        deposit_released_cents == deposit_held_cents  and deposit_outstanding_cents == 0.
    input_set: "reservations (status != RELEASED) for HOLD; CHARGED DamageReports in created_at/charge order for SETTLE"
    constants:
      DEPOSIT_RATE: 0.20
    precision: "round_half_up to whole cents; captures processed in DamageReport charge (created_at ASC) order"
    variants:
      - name: forward_hold
        when: "at confirm — a flat DEPOSIT_RATE estimate over replacement value"
        difference: "does not depend on realized damage; a single HOLD entry"
      - name: chronological_settlement
        when: "across charge/settle — captures actual assessed damage via a running waterfall, refunds the remainder"
        difference: "depends on realized DamageReport.assessed_cost_cents processed in charge order"

  - name: equipment_availability
    trigger: "EquipmentReservation create; GET /equipment/{id}/availability"
    algorithm: interval_merge
    formula: |
      For EquipmentItem E over requested inclusive window [s, e]:
        For each calendar day d in [s, e]:
          reserved(d) = sum(R.qty for R in EquipmentReservation
                            where R.equipment_id == E
                              and R.status in {HELD, CHECKED_OUT}
                              and R.reserve_start_date <= d <= R.reserve_end_date)
          subrented(d) = sum(SR.qty for SR in SubRental
                            where SR.equipment_id == E and SR.direction == SUB_IN
                              and SR.status == CONFIRMED)     # sub-in adds capacity for the whole engagement
        peak_reserved = max over d of reserved(d)
        effective_units = E.total_units + subrented
        available_units = effective_units - peak_reserved
      A create of qty q is admitted iff (peak_reserved_over_[s,e]_excluding_new + q) <= effective_units
        i.e. available_units >= q   (boundary: '>=', reserving exactly available succeeds).
    input_set: "EquipmentReservation with status in {HELD, CHECKED_OUT} whose window intersects [s,e]; CONFIRMED SUB_IN SubRentals"
    constants: {}
    precision: "integer units; inclusive-day interval overlap (share of >=1 calendar day)"
# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation (per §1.7); entity_backed Client acts only on own resources"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids exist (validated left-to-right); FK targets exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Body well-formed: required fields present, enums valid, qty >= 1, reserve_end_date >= reserve_start_date, event_end_date >= event_start_date, shift_end > shift_start, coverage/rate/limit >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

  - priority: 5
    category: state
    check: "Target resource is in a state that admits this transition (own state machine). For child-creation endpoints, the parent RentalOrder must be in an accepting lifecycle state: reservations & crew-assignments require order status in {DRAFT, QUOTED}; damage-reports & sub-rentals require the order be non-terminal (status not in {SETTLED, CANCELLED})"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints and child-creation endpoints (reservations, crew-assignments, sub-rentals, damage-reports)"

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_order_version equals current RentalOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rental-orders/{id}/confirm"

  - priority: 7
    category: business_safety
    check: "COI compliance for the order: an APPROVED, adequate (>= venue.required_coverage_cents), unexpired (expiry_date > event_end_date) certificate exists where required (confirm, settle); COI approve re-checks coverage & expiry"
    error_id: ERR_COI_NOT_APPROVED
    http_status: 409
    applies_to: "POST /rental-orders/{id}/confirm, POST /rental-orders/{id}/settle, POST /certificates-of-insurance/{id}/approve"

  - priority: 8
    category: business_temporal
    check: "Temporal-overlap capacity: EquipmentItem peak reserved units over the inclusive-day window must leave room (equipment_availability) -> ERR_EQUIPMENT_UNAVAILABLE; a CrewMember's half-open shift [start,end) must be >= TURNAROUND_MINUTES (60) after any prior assignment's end and symmetric -> ERR_CREW_DOUBLE_BOOKED"
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rental-orders/{id}/reservations, POST /rental-orders/{id}/crew-assignments"

  - priority: 9
    category: business_referential
    check: "Referential resolution: every DamageReport for the order is CHARGED or WAIVED before settle; reservations checked out/in before load-in/start-event"
    error_id: ERR_OPEN_DAMAGE_REPORT
    http_status: 409
    applies_to: "POST /rental-orders/{id}/settle, POST /rental-orders/{id}/load-in, POST /rental-orders/{id}/start-event"

  - priority: 10
    category: business_fiscal
    check: "Fiscal: quote_total_cents must not exceed Customer.credit_limit_cents at confirm"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /rental-orders/{id}/confirm"
# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - { method: POST, path: "/customers", description: "Create a customer", roles: [AccountManager], code: 201, input: [name, contact_email, credit_limit_cents], output: Customer, side_effects: [] }
  - { method: GET, path: "/customers/{id}", description: "Get a customer", roles: [AccountManager, WarehouseManager, CrewChief, Client], code: 200, input: [], output: Customer, side_effects: [] }

  # --- Venue ---
  - { method: POST, path: "/venues", description: "Create a venue", roles: [AccountManager], code: 201, input: [name, address, "dock_type?", required_coverage_cents], output: Venue, side_effects: [] }
  - { method: GET, path: "/venues/{id}", description: "Get a venue", roles: [AccountManager, WarehouseManager, CrewChief, Client], code: 200, input: [], output: Venue, side_effects: [] }

  # --- EquipmentItem ---
  - { method: POST, path: "/equipment", description: "Create an inventory item", roles: [WarehouseManager], code: 201, input: [name, category, total_units, daily_rate_cents, replacement_value_cents, "requires_operator?"], output: EquipmentItem, side_effects: [] }
  - { method: GET, path: "/equipment/{id}", description: "Get an inventory item", roles: [AccountManager, WarehouseManager, CrewChief, Client], code: 200, input: [], output: EquipmentItem, side_effects: [] }
  - method: GET
    path: "/equipment/{id}/availability"
    description: "Computed read: available units for an inclusive window (equipment_availability). Query params start_date/end_date default to the item's whole horizon."
    roles: [AccountManager, WarehouseManager, CrewChief, Client]
    code: 200
    input: ["start_date?", "end_date?"]
    output: { available_units: integer, effective_units: integer, total_units: integer, peak_reserved_units: integer }
    side_effects: []

  # --- CrewMember ---
  - { method: POST, path: "/crew-members", description: "Create a crew member", roles: [CrewChief], code: 201, input: [name, crew_role, hourly_rate_cents], output: CrewMember, side_effects: [] }
  - { method: GET, path: "/crew-members/{id}", description: "Get a crew member", roles: [AccountManager, WarehouseManager, CrewChief], code: 200, input: [], output: CrewMember, side_effects: [] }

  # --- RentalOrder ---
  - { method: POST, path: "/rental-orders", description: "Create a rental order (DRAFT)", roles: [AccountManager], code: 201, input: [customer_id, venue_id, event_name, event_start_date, event_end_date], output: RentalOrder, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/rental-orders/{id}", description: "Get a rental order (Client only own)", roles: [AccountManager, WarehouseManager, CrewChief, Client], code: 200, input: [], output: RentalOrder, side_effects: [] }
  - { method: GET, path: "/rental-orders", description: "List/filter rental orders (reverse-reachability for Customer & Venue FKs)", roles: [AccountManager, Client], code: 200, input: ["customer_id?", "venue_id?", "status?", "limit?", "offset?"], output: "RentalOrder[]", side_effects: [] }
  - { method: POST, path: "/rental-orders/{id}/quote", description: "DRAFT -> QUOTED; runs PROVISIONAL pricing", roles: [AccountManager], code: 200, input: [], output: RentalOrder, side_effects: ["equipment_line_pricing", "crew_labor_pricing", "order_totals(PROVISIONAL)", "increments RentalOrder.version by 1"] }
  - { method: POST, path: "/rental-orders/{id}/revise", description: "QUOTED -> DRAFT; reopen for edits (revision loop)", roles: [AccountManager], code: 200, input: [], output: RentalOrder, side_effects: ["pricing_variant=NONE", "increments RentalOrder.version by 1"] }
  - { method: POST, path: "/rental-orders/{id}/confirm", description: "QUOTED -> CONFIRMED; OCC-guarded; holds deposit", roles: [AccountManager], code: 200, input: [expected_order_version], output: RentalOrder, side_effects: ["deposit_settlement(HOLD)", "DepositLedgerEntry(HOLD)", "increments RentalOrder.version by 1"] }
  - { method: POST, path: "/rental-orders/{id}/load-out", description: "CONFIRMED -> LOADED_OUT", roles: [WarehouseManager], code: 200, input: [], output: RentalOrder, side_effects: ["enables reservation check-out", "increments RentalOrder.version by 1"] }
  - { method: POST, path: "/rental-orders/{id}/start-event", description: "LOADED_OUT -> IN_EVENT", roles: [AccountManager], code: 200, input: [], output: RentalOrder, side_effects: ["enables crew completion", "increments RentalOrder.version by 1"] }
  - { method: POST, path: "/rental-orders/{id}/load-in", description: "IN_EVENT -> LOADED_IN", roles: [WarehouseManager], code: 200, input: [], output: RentalOrder, side_effects: ["increments RentalOrder.version by 1"] }
  - { method: POST, path: "/rental-orders/{id}/settle", description: "LOADED_IN -> SETTLED; FINAL pricing + deposit refund", roles: [AccountManager], code: 200, input: [], output: RentalOrder, side_effects: ["equipment_line_pricing(FINAL)", "crew_labor_pricing(FINAL)", "order_totals(FINAL)", "deposit_settlement(SETTLE)", "DepositLedgerEntry(REFUND)", "increments RentalOrder.version by 1"] }
  - { method: POST, path: "/rental-orders/{id}/cancel", description: "DRAFT|QUOTED|CONFIRMED -> CANCELLED; cascade release", roles: [AccountManager], code: 200, input: [], output: RentalOrder, side_effects: ["cascade reservations->RELEASED", "cascade linked sub-rentals->CANCELLED", "crew->CANCELLED", "DepositLedgerEntry(RELEASE)", "increments RentalOrder.version by 1"] }

  # --- EquipmentReservation ---
  - { method: POST, path: "/rental-orders/{id}/reservations", description: "Reserve equipment units for a window (HELD); enforces availability", roles: [WarehouseManager], code: 201, input: [equipment_id, qty, reserve_start_date, reserve_end_date, "is_standby?"], output: EquipmentReservation, side_effects: ["equipment_availability check", "status=HELD"] }
  - { method: GET, path: "/equipment-reservations/{id}", description: "Get a reservation", roles: [AccountManager, WarehouseManager, CrewChief, Client], code: 200, input: [], output: EquipmentReservation, side_effects: [] }
  - { method: GET, path: "/equipment-reservations", description: "List/filter reservations (reverse-reachability for order_id & equipment_id FKs)", roles: [AccountManager, WarehouseManager], code: 200, input: ["order_id?", "equipment_id?", "status?", "limit?", "offset?"], output: "EquipmentReservation[]", side_effects: [] }
  - { method: POST, path: "/equipment-reservations/{id}/check-out", description: "HELD -> CHECKED_OUT (order must be LOADED_OUT)", roles: [WarehouseManager], code: 200, input: [], output: EquipmentReservation, side_effects: ["checked_out_qty=qty"] }
  - { method: POST, path: "/equipment-reservations/{id}/check-in", description: "CHECKED_OUT -> CHECKED_IN | DAMAGED", roles: [WarehouseManager], code: 200, input: ["damaged?", "lost_units?"], output: EquipmentReservation, side_effects: ["if damaged: auto-create DamageReport(FILED); recompute order.deposit_at_risk_cents, open_damage_count"] }
  - { method: POST, path: "/equipment-reservations/{id}/release", description: "HELD -> RELEASED; restores availability; cancels linked sub-rental", roles: [WarehouseManager], code: 200, input: [], output: EquipmentReservation, side_effects: ["linked CONFIRMED SubRental->CANCELLED; recompute order.sub_rental_cost_cents"] }

  # --- CrewAssignment ---
  - { method: POST, path: "/rental-orders/{id}/crew-assignments", description: "Schedule crew for a shift (SCHEDULED); enforces no double-booking", roles: [CrewChief], code: 201, input: [crew_member_id, assignment_role, shift_start, shift_end, scheduled_hours, "is_standby?"], output: CrewAssignment, side_effects: ["crew overlap/turnaround check", "status=SCHEDULED"] }
  - { method: GET, path: "/crew-assignments/{id}", description: "Get a crew assignment", roles: [AccountManager, WarehouseManager, CrewChief], code: 200, input: [], output: CrewAssignment, side_effects: [] }
  - { method: GET, path: "/crew-assignments", description: "List/filter crew assignments (reverse-reachability for order_id & crew_member_id FKs)", roles: [AccountManager, CrewChief], code: 200, input: ["order_id?", "crew_member_id?", "status?", "limit?", "offset?"], output: "CrewAssignment[]", side_effects: [] }
  - { method: POST, path: "/crew-assignments/{id}/complete", description: "SCHEDULED -> COMPLETED (order must be IN_EVENT/LOADED_IN); sets actual_hours", roles: [CrewChief], code: 200, input: [actual_hours], output: CrewAssignment, side_effects: ["set actual_hours"] }
  - { method: POST, path: "/crew-assignments/{id}/cancel", description: "SCHEDULED -> CANCELLED", roles: [CrewChief], code: 200, input: [], output: CrewAssignment, side_effects: [] }

  # --- SubRental ---
  - { method: POST, path: "/rental-orders/{id}/sub-rentals", description: "Create a sub-rental / cross-rental (REQUESTED)", roles: [WarehouseManager], code: 201, input: [equipment_id, "reservation_id?", "direction?", vendor_name, qty, cost_cents], output: SubRental, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/sub-rentals/{id}", description: "Get a sub-rental", roles: [AccountManager, WarehouseManager], code: 200, input: [], output: SubRental, side_effects: [] }
  - { method: GET, path: "/sub-rentals", description: "List/filter sub-rentals (reverse-reachability for order_id, equipment_id, reservation_id FKs)", roles: [AccountManager, WarehouseManager], code: 200, input: ["order_id?", "equipment_id?", "reservation_id?", "status?", "limit?", "offset?"], output: "SubRental[]", side_effects: [] }
  - { method: POST, path: "/sub-rentals/{id}/confirm", description: "REQUESTED -> CONFIRMED; adds capacity + cost", roles: [WarehouseManager], code: 200, input: [], output: SubRental, side_effects: ["add cost_cents to order.sub_rental_cost_cents", "SUB_IN adds effective availability"] }
  - { method: POST, path: "/sub-rentals/{id}/return", description: "CONFIRMED -> RETURNED", roles: [WarehouseManager], code: 200, input: [], output: SubRental, side_effects: ["remove SUB_IN capacity"] }
  - { method: POST, path: "/sub-rentals/{id}/cancel", description: "REQUESTED|CONFIRMED -> CANCELLED", roles: [WarehouseManager], code: 200, input: [], output: SubRental, side_effects: ["if was CONFIRMED: remove cost_cents from order.sub_rental_cost_cents"] }

  # --- CertificateOfInsurance ---
  - { method: POST, path: "/rental-orders/{id}/certificates-of-insurance", description: "Client submits a COI (SUBMITTED) for their order", roles: [Client], code: 201, input: [insurer, coverage_amount_cents, expiry_date], output: CertificateOfInsurance, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/certificates-of-insurance/{id}", description: "Get a COI", roles: [AccountManager, WarehouseManager, Client], code: 200, input: [], output: CertificateOfInsurance, side_effects: [] }
  - { method: GET, path: "/certificates-of-insurance", description: "List/filter COIs (reverse-reachability for order_id FK)", roles: [AccountManager, Client], code: 200, input: ["order_id?", "status?", "limit?", "offset?"], output: "CertificateOfInsurance[]", side_effects: [] }
  - { method: POST, path: "/certificates-of-insurance/{id}/approve", description: "SUBMITTED -> APPROVED; enforces coverage>=required & expiry>event_end", roles: [AccountManager], code: 200, input: [], output: CertificateOfInsurance, side_effects: ["order.has_approved_coi=true"] }
  - { method: POST, path: "/certificates-of-insurance/{id}/reject", description: "SUBMITTED -> REJECTED", roles: [AccountManager], code: 200, input: [reason], output: CertificateOfInsurance, side_effects: ["set reject_reason"] }

  # --- DamageReport ---
  - { method: POST, path: "/rental-orders/{id}/damage-reports", description: "File a damage/loss report (FILED) against a reservation", roles: [WarehouseManager], code: 201, input: [reservation_id, "damaged_units?", "lost_units?", "notes?"], output: DamageReport, side_effects: ["status=FILED", "recompute order.open_damage_count, deposit_at_risk_cents"] }
  - { method: GET, path: "/damage-reports/{id}", description: "Get a damage report", roles: [AccountManager, WarehouseManager], code: 200, input: [], output: DamageReport, side_effects: [] }
  - { method: GET, path: "/damage-reports", description: "List/filter damage reports (reverse-reachability for order_id & reservation_id FKs)", roles: [AccountManager, WarehouseManager], code: 200, input: ["order_id?", "reservation_id?", "status?", "limit?", "offset?"], output: "DamageReport[]", side_effects: [] }
  - { method: POST, path: "/damage-reports/{id}/assess", description: "FILED -> ASSESSED; set assessed_cost_cents", roles: [WarehouseManager], code: 200, input: [assessed_cost_cents], output: DamageReport, side_effects: ["recompute order.deposit_at_risk_cents"] }
  - { method: POST, path: "/damage-reports/{id}/charge", description: "ASSESSED -> CHARGED; capture from deposit (waterfall)", roles: [AccountManager], code: 200, input: [], output: DamageReport, side_effects: ["DepositLedgerEntry(CAPTURE)", "recompute order deposit fields, open_damage_count"] }
  - { method: POST, path: "/damage-reports/{id}/waive", description: "ASSESSED -> WAIVED; no capture", roles: [AccountManager], code: 200, input: [], output: DamageReport, side_effects: ["recompute order.deposit_at_risk_cents, open_damage_count"] }

  # --- DepositLedgerEntry (read-only; system-created) ---
  - { method: GET, path: "/deposit-ledger/{id}", description: "Get a deposit ledger entry", roles: [AccountManager], code: 200, input: [], output: DepositLedgerEntry, side_effects: [] }
  - { method: GET, path: "/deposit-ledger", description: "List/filter deposit ledger entries (reverse-reachability for order_id & damage_report_id FKs)", roles: [AccountManager], code: 200, input: ["order_id?", "damage_report_id?", "limit?", "offset?"], output: "DepositLedgerEntry[]", side_effects: [] }

  # --- Test-driving logical clock (§1.5 priority ladder rung 3) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock). Drives rush-window and COI expiry determinism."
    roles: [AccountManager, WarehouseManager, CrewChief]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced to to_iso8601"]
# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for operation, or Client acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced resource id (path or FK body field) does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, bad enum, qty<1, reserve_end<reserve_start, event_end<event_start, shift_end<=shift_start, or negative money" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit outside [1,100] or offset < 0" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that admits the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not equal current RentalOrder.version at confirm (OCC)" }
  - { id: ERR_NO_RESERVATIONS, http: 409, condition: "Quote attempted on an order with zero HELD reservations" }
  - { id: ERR_EQUIPMENT_UNAVAILABLE, http: 409, condition: "Requested equipment units exceed effective availability over the window (peak-day capacity)" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Crew member's requested shift overlaps an existing assignment within the TURNAROUND buffer" }
  - { id: ERR_COI_NOT_APPROVED, http: 409, condition: "Order lacks an APPROVED, adequate, unexpired certificate of insurance where one is required (confirm/settle)" }
  - { id: ERR_COI_INSUFFICIENT_COVERAGE, http: 409, condition: "COI coverage_amount_cents is below the venue's required_coverage_cents at approval" }
  - { id: ERR_COI_EXPIRED, http: 409, condition: "COI expiry_date is on or before the order's event_end_date at approval" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "quote_total_cents exceeds the customer's credit_limit_cents at confirm" }
  - { id: ERR_ORDER_NOT_LOADED_OUT, http: 409, condition: "Reservation check-out attempted while parent order is not LOADED_OUT" }
  - { id: ERR_RESERVATIONS_NOT_CHECKED_OUT, http: 409, condition: "start-event attempted while some reservation is still HELD (not CHECKED_OUT/RELEASED)" }
  - { id: ERR_RESERVATIONS_NOT_CHECKED_IN, http: 409, condition: "load-in attempted while some reservation is still CHECKED_OUT (not CHECKED_IN/DAMAGED)" }
  - { id: ERR_OPEN_DAMAGE_REPORT, http: 409, condition: "settle attempted while an order DamageReport is still FILED or ASSESSED" }
  - { id: ERR_RESERVATION_ORDER_MISMATCH, http: 409, condition: "reservation_id in a damage-report/sub-rental body does not belong to the order in the path" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountManager
    description: "Owns the commercial order lifecycle: quoting, confirmation, COI adjudication, deposit/damage settlement."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers, POST /venues"
      - "POST /rental-orders and all order lifecycle actions: quote, revise, confirm, start-event, settle, cancel"
      - "POST /certificates-of-insurance/{id}/approve, .../reject"
      - "POST /damage-reports/{id}/charge, .../waive"
      - "GET /deposit-ledger, GET /deposit-ledger/{id}"
    shared_operations:
      - "GET reads on orders, equipment, venues, customers, reservations, crew-assignments, sub-rentals, COIs, damage-reports"

  - name: WarehouseManager
    description: "Owns physical inventory and gear movement: catalog, reservations, sub-rentals, load-out/in, damage filing/assessment."
    identity: "opaque"
    exclusive_operations:
      - "POST /equipment"
      - "POST /rental-orders/{id}/reservations and reservation actions: check-out, check-in, release"
      - "POST /rental-orders/{id}/load-out, POST /rental-orders/{id}/load-in"
      - "POST /rental-orders/{id}/sub-rentals and sub-rental actions: confirm, return, cancel"
      - "POST /rental-orders/{id}/damage-reports, POST /damage-reports/{id}/assess"
    shared_operations:
      - "GET reads on equipment, reservations, sub-rentals, damage-reports, orders, crew-members"

  - name: CrewChief
    description: "Owns crew roster and scheduling."
    identity: "opaque"
    exclusive_operations:
      - "POST /crew-members"
      - "POST /rental-orders/{id}/crew-assignments and assignment actions: complete, cancel"
    shared_operations:
      - "GET reads on crew-members, crew-assignments, orders, equipment"

  - name: Client
    description: "The customer acting on their own orders — submits certificates of insurance and reads their own records."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /rental-orders/{id}/certificates-of-insurance (only for orders whose customer_id == X-User-ID)"
    shared_operations:
      - "GET reads limited to own orders, own reservations, own COIs, and public catalog (equipment, venues)"

