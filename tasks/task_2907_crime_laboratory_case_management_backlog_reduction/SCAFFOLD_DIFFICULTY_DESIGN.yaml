              as: LabDirector
              captures: { a1: $.data.id }
            - call: "POST /lab/nonconformances"
              payload: { source: "INTERNAL_QA", severity: "MAJOR", description: "Peer file review found an undocumented reagent lot substitution.", analyst_id: "${a1}" }
              as: QualityManager
              captures: { nc1: $.data.id }
            - call: "POST /lab/nonconformances/${nc1}/root-cause"
              payload: { root_cause_category: "DOCUMENTATION", corrective_action_plan: "Add reagent lot fields to the bench sheet template." }
              as: CaseManager
              as_user_id: "ops-casemgr-1"
            - call: "POST /lab/nonconformances/${nc1}/capa-decision"
              payload: { decision: "REJECT", rationale: "Plan does not address why the substitution was undetected." }
              as: QualityManager
              as_user_id: "ops-qm-1"
            - call: "POST /lab/nonconformances/${nc1}/root-cause"
              payload: { root_cause_category: "TRAINING", corrective_action_plan: "Retrain the examiner on reagent lot verification." }
              as: CaseManager
              as_user_id: "ops-casemgr-1"
            - call: "POST /lab/nonconformances/${nc1}/capa-decision"
              payload: { decision: "REJECT", rationale: "Retraining alone leaves the detection gap open." }
              as: QualityManager
              as_user_id: "ops-qm-1"
            - call: "POST /lab/nonconformances/${nc1}/root-cause"
              payload: { root_cause_category: "METHOD_DEFICIENCY", corrective_action_plan: "Amend the method to require a second-person lot check plus quarterly audit." }
              as: CaseManager
              as_user_id: "ops-casemgr-1"
          trigger:
