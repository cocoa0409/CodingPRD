              payload: { storage_bin_id: "${bin12_id}" }
              as: BrokerOps
              captures: { lot12_id: $.data.id }
            - call: "POST /listings"
              payload: { lot_id: "${lot12_id}", asking_price_per_unit_cents: 10000 }
              as: BrokerOps
              captures: { lst12_id: $.data.id }
            - call: "POST /listings/${lst12_id}/activate"
              payload: {}
              as: BrokerOps
            - call: "POST /sales-orders"
              payload: { customer_id: "${c12_id}", listing_id: "${lst12_id}", quantity: 4 }
              as: Customer
              as_user_id: "${c12_id}"
              captures: { ord12_id: $.data.id, req12: $.data.required_escrow_cents }
          trigger:
            - call: "POST /sales-orders/${ord12_id}/escrow/deposit"
