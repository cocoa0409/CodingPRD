scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: standard_vs_idr_monthly_payment
        grounds:
          - calculations.monthly_payment_calc
          - calculations.monthly_payment_calc.variants[standard_10]
          - calculations.monthly_payment_calc.variants[idr_save]
          - state_machines.RepaymentPlan.PENDING_to_ACTIVE
          - endpoints.POST_/borrowers/{borrower_id}/plans/{plan_id}/activate
        distinguishing_aspect: |
          Operates on the RepaymentPlan/Loan cost-accounting domain: amortization (STANDARD_10) and
          discretionary-income (SAVE/IBR/PAYE) produce different monthly_payment_cents for the same
          loan portfolio, AGI, and family size — a borrower-cost figure, not a borrower-risk figure.
        test_recipe:
          setup:
            - "Create Borrower with state_code='CA', family_size=1, adjusted_gross_income_cents=4000000, agi_certified_at=2025-01-01"
            - "Create one DIRECT_UNSUBSIDIZED Loan: original_principal_cents=1000000, interest_rate_bps=500, disbursement_date=2024-01-01"
            - "POST /loans/{lid}/separate; advance clock 180 days; loan auto-transitions GRACE->REPAYMENT (interest is capitalized to principal_balance_cents=1024658)"
          trigger:
            - "POST /plans  with plan_type=STANDARD_10 and included_loan_ids=[loan_id]; POST /plans/{pid}/activate"
            - "POST /plans  with plan_type=SAVE and included_loan_ids=[loan_id]; POST /plans/{pid}/activate (supersedes the first)"
          assert:
            - "First plan's monthly_payment_cents == 10868  # round_half_up of amortization over 120 months on principal 1024658 @ 500bps"
            - "Second plan's monthly_payment_cents == 2548  # SAVE: (4000000 - 2.25*1506000)*0.05/12 round_half_up"
            - "First plan's status == 'SUPERSEDED' after second activation"

      - name: pslf_qualifying_vs_drift_score
        grounds:
          - calculations.pslf_qualification_check
          - calculations.idr_recertification_drift_score
          - endpoints.GET_/borrowers/{borrower_id}/risk-score
          - entities.Loan.fields.qualifying_pslf_payment_count
          - entities.Borrower.fields.veteran_status
        distinguishing_aspect: |
          PSLF qualification operates on the Payment x Loan domain (counting full installments under
          employment windows); the IDR drift risk score operates on the Borrower-customer domain
          (combining delinquency, forbearance burden, recertification lateness). Different entity
          domains, different output types — count vs 0-100 score.
        test_recipe:
          setup:
            - "Create Borrower; create Loan (DIRECT_UNSUBSIDIZED, 1000000 cents @ 500bps); separate; advance clock 180 days"
            - "Activate SAVE plan; record one APPROVED EmploymentCertification covering period [2025-01-01, 2026-12-31] from employer_type=GOVERNMENT"
            - "Record one Payment(amount_cents=2548, source=BORROWER, received_at=2025-08-01)"
          trigger:
            - "GET /borrowers/{bid}/loans/{lid}  -> read qualifying_pslf_payment_count"
            - "GET /borrowers/{bid}/risk-score   -> read idr_risk score"
          assert:
            - "Loan.qualifying_pslf_payment_count == 1  # one PSLF-qualifying payment under approved employment window"
            - "risk-score response is in range [0,100] and is computed from delinquency=0, forbearance=0, recert subscore based on days_overdue_recert (a Borrower-domain metric)"
            - "Loan.qualifying_pslf_payment_count is an integer counter; risk-score is a clamped float-rounded integer — different units, different domains"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: save_idr_nonlinear_inputs
        grounds:
          - calculations.monthly_payment_calc
          - calculations.monthly_payment_calc.formula
          - calculations.monthly_payment_calc.constants
          - validations[priority=16]
          - entities.Borrower.fields.state_code
        distinguishing_aspect: |
          Mode (a): a formula with >=3 inputs and non-linear interaction. monthly_payment_calc for
          SAVE combines (AGI, family_size, state_code-keyed poverty table, IDR_MULTIPLIER, IDR_FRACTION),
          with nested max(0, ...) gating and a state-keyed table lookup. Inputs do not combine linearly:
          the poverty multiplier creates a piecewise floor at zero discretionary.
        test_recipe:
          setup:
            - "Create Borrower(state_code='AK', family_size=2, adjusted_gross_income_cents=3000000, agi_certified_at=now)"
            - "Create Loan(DIRECT_UNSUBSIDIZED, 1000000, 500bps); separate; advance clock 180 days"
          trigger:
            - "POST /plans plan_type=SAVE included_loan_ids=[loan_id]; POST /plans/{pid}/activate"
          assert:
            - "Plan.monthly_payment_cents == round_half_up( max(0, 3000000 - 2.25*2542000) * 0.05 / 12, 0 ) == ?  # nonlinear: AK poverty table differs from 48_DC; family_size=2 row"
            - "Specifically Plan.monthly_payment_cents == max(0, 3000000 - 5719500) * 0.05 / 12 -> 0 (discretionary clamps to 0)"
            - "Switching family_size to 1 changes the poverty row used, NOT just one input — exercises table-lookup non-linearity"

      - name: pslf_share_rounding_order
        grounds:
          - calculations.pslf_qualification_check
          - calculations.pslf_qualification_check.formula
          - calculations.payment_allocation_waterfall
          - state_machines.EmploymentCertification.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. The 'full payment per loan' check used
          inside pslf_qualification_check rounds each loan's share of scheduled_monthly_payment_cents
          INDIVIDUALLY (share-then-round) and compares to that loan's allocation. The alternative
          sum-then-round would shift the qualifying boundary by a cent on multi-loan plans, changing
          the count. The scaffold pins share-then-round.
        test_recipe:
          setup:
            - "Create Borrower with two loans: Loan_A(P=500001, rate=500bps), Loan_B(P=499999, rate=500bps); separate both; advance 180d (loans capitalize their grace interest)"
            - "Activate STANDARD_10 plan over both loans"
            - "Record one APPROVED GOVERNMENT EmploymentCertification covering [2025-01-01, 2026-12-31]"
          trigger:
            - "POST /payments amount_cents=plan.monthly_payment_cents at received_at=2025-08-01 (exact installment)"
          assert:
            - "Both loans' qualifying_pslf_payment_count increment by exactly 1 each — verified by share-then-round (each loan's rounded share equals its allocation)"
            - "Pinned: scheduled_share_A = round_half_up(plan.monthly_payment_cents * (P_A_total / pool_total)); same for B; sum of rounded shares may differ from plan.monthly_payment_cents by 1 cent — the +/-1 cent is absorbed into Loan_A (higher priority by Loan.id tie-break)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_branching_with_compensating_rehab
        grounds:
          - state_machines.Loan.DEFAULT_to_REHABILITATION
          - state_machines.Loan.REHABILITATION_to_REPAYMENT
          - state_machines.Loan.DELINQUENT_to_DEFAULT
          - state_machines.Loan.DELINQUENT_to_FORBEARANCE
        distinguishing_aspect: |
          Branching/cycle: Loan can enter DEFAULT from DELINQUENT, then go to REHABILITATION, then
          BACK to REPAYMENT (recovery cycle). It also has divergent branches from DELINQUENT
          (->REPAYMENT via payment, ->DEFAULT via clock, ->FORBEARANCE via hardship approval). Non-
          linear because the post-default REHAB->REPAYMENT path is a compensating return, not a
          forward step.
        test_recipe:
          setup:
            - "Create Borrower + Loan(DIRECT_UNSUBSIDIZED, 1000000, 500bps); separate; advance 180 days into REPAYMENT"
            - "Advance clock 280 days from REPAYMENT start without any Payment -> Loan auto-transitions to DELINQUENT then DEFAULT"
          trigger:
            - "POST /loans/{lid}/collections kind=REHAB_AGREEMENT_OPEN -> Loan DEFAULT -> REHABILITATION"
            - "POST /loans/{lid}/collections kind=REHAB_PAYMENT_RECORDED, amount_cents=2548, repeated 9 times across simulated months via /_clock/advance"
            - "Advance clock until 9 payments lie within 10 months -> auto REHABILITATION -> REPAYMENT"
          assert:
            - "Final Loan.status == 'REPAYMENT'"
            - "Final Loan.days_past_due == 0 (cleared by REHAB_COMPLETED compensating side-effect)"
            - "A CollectionsAction with kind=='REHAB_COMPLETED' exists"

      - name: discharge_app_branching_review_flow
        grounds:
          - state_machines.DischargeApplication.SUBMITTED_to_UNDER_REVIEW
          - state_machines.DischargeApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.DischargeApplication.UNDER_REVIEW_to_REJECTED
          - state_machines.DischargeApplication.SUBMITTED_to_REJECTED
          - validations[priority=8]
        distinguishing_aspect: |
          Branching fork-join on a different entity (DischargeApplication). From SUBMITTED two
          mutually-exclusive transitions: ->UNDER_REVIEW by ServicerCertifier, OR ->REJECTED by
          ServicerCertifier. Then UNDER_REVIEW forks again into ->APPROVED or ->REJECTED, with the
          APPROVED branch carrying divergent side effects (loan discharge cascade) that REJECTED
          does NOT have. Different entity from Loan above.
        test_recipe:
          setup:
            - "Create Borrower(veteran_status=TPD_VETERAN) with one Loan"
            - "POST /discharge-applications program=VETERAN_TPD as Borrower"
          trigger:
            - "PATCH /discharge-applications/{aid} status=UNDER_REVIEW as ServicerCertifier U1"
            - "PATCH /discharge-applications/{aid} status=APPROVED as ServicerApprover U2 (U2 != U1)"
          assert:
            - "Application.status == 'APPROVED'"
            - "Branch-specific side effect fired: all approved loans transitioned to DISCHARGED with principal_balance_cents == 0"
            - "Compare against the REJECTED branch (separate setup): no loan-status change occurs"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: default_cascade_loan_plan_siblings
        grounds:
          - state_machines.Loan.DELINQUENT_to_DEFAULT
          - state_machines.RepaymentPlan.ACTIVE_to_TERMINATED
          - calculations.interest_accrual_simulation
          - calculations.monthly_payment_calc
        distinguishing_aspect: |
          Depth-3 transitive cascade: clock advances >270d past due -> (link 1) Loan A transitions
          DELINQUENT->DEFAULT, which causes -> (link 2) RepaymentPlan covering Loan A transitions
          ACTIVE->TERMINATED, which causes -> (link 3) sibling Loans B/C that were under that plan
          revert to standard amortization (new last_payment_due_at + recomputed schedule). Each link
          is caused by the PRIOR link, not directly by /_clock/advance.
        test_recipe:
          setup:
            - "Create Borrower + three loans A, B, C (all DIRECT_UNSUBSIDIZED, 1000000, 500bps); separate all; advance 180d into REPAYMENT"
            - "Activate SAVE plan covering all three"
            - "Make no payments"
          trigger:
            - "POST /_clock/advance to status_entered_at + 270 days past first installment due date"
          assert:
            - "Loan A.status == 'DEFAULT' (link 1)"
            - "RepaymentPlan.status == 'TERMINATED' (link 2 — caused by link 1, not by clock)"
            - "Loan B.status == 'REPAYMENT' AND Loan C.status == 'REPAYMENT' AND each carries a new last_payment_due_at >= now (link 3 — caused by link 2)"

      - name: employment_cert_pslf_discharge_chain
        grounds:
          - state_machines.EmploymentCertification.SUBMITTED_to_APPROVED
          - calculations.pslf_qualification_check
          - state_machines.DischargeApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.Loan.REPAYMENT_to_DISCHARGED
        distinguishing_aspect: |
          Depth-3 cascade originating from a DIFFERENT trigger (EmploymentCertification.APPROVED, not
          a clock event): (link 1) EmploymentCertification SUBMITTED->APPROVED causes -> (link 2)
          recount via pslf_qualification_check which writes Loan.qualifying_pslf_payment_count.
          Then independent APPROVED discharge causes -> (link 3) Loan REPAYMENT->DISCHARGED with
          balance zeroing and Borrower.aggregate_principal_balance_cents recomputed.
        test_recipe:
          setup:
            - "Create Borrower + Loan; record 120 monthly Payments over 120 months (advance clock each month)"
            - "Submit EmploymentCertification covering the full payment span; submit PSLF discharge application; move it to UNDER_REVIEW"
          trigger:
            - "PATCH /employment-certifications/{cid} status=APPROVED (link 1)"
            - "PATCH /discharge-applications/{aid} status=APPROVED approved_loan_ids=[loan_id] (link 3 trigger; link 2 ran as side-effect of link 1)"
          assert:
            - "After link 1: Loan.qualifying_pslf_payment_count == 120 (link 2 fired transitively)"
            - "After link 3: Loan.status == 'DISCHARGED' AND principal_balance_cents == 0 AND Borrower.aggregate_principal_balance_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_pslf_approval
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.DischargeApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Error-category pair: state (priority 7, ERR_INVALID_STATE) vs business_safety (priority 8,
          ERR_SOD_VIOLATION). A request that violates BOTH (application already REJECTED AND the
          approver also acted as certifier) must surface state's ERR_INVALID_STATE first.
        test_recipe:
          setup:
            - "Create Borrower + Loan; APPROVED EmploymentCertification by Certifier U1"
            - "Submit PSLF DischargeApplication; PATCH to UNDER_REVIEW by U1; PATCH to REJECTED by U2 (ServicerApprover, != U1)"
            - "Now application.status == REJECTED"
          trigger:
            - "PATCH /discharge-applications/{aid} status=APPROVED with X-User-ID=U1 (this is BOTH a state error and an SOD violation)"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' (priority 7 wins over priority 8)"
            - "HTTP status == 409"

      - name: business_temporal_vs_business_constraint_hardship
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=19]
        distinguishing_aspect: |
          DIFFERENT pair: business_temporal (priority 12, ERR_BAD_DATE_WINDOW for requested_from >= now)
          vs business_constraint (priority 19, ERR_PLUS_INELIGIBLE_FOR_IN_SCHOOL). A DEFERMENT_IN_SCHOOL
          request on a PLUS loan with requested_from in the past triggers both — priority 12 wins.
        test_recipe:
          setup:
            - "Create Borrower + DIRECT_PLUS Loan in IN_SCHOOL"
          trigger:
            - "POST /hardship-requests kind=DEFERMENT_IN_SCHOOL, requested_from=now-30d, requested_to=now+30d, applied_loan_ids=[loan_id]"
          assert:
            - "Response error_id == 'ERR_BAD_DATE_WINDOW' (priority 12 wins over priority 19)"
            - "HTTP status == 400"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: default_threshold_at_270_days_exactly
        grounds:
          - state_machines.Loan.DELINQUENT_to_DEFAULT
          - calculations.interest_accrual_simulation
          - calculations.interest_accrual_simulation.constants.DEFAULT_THRESHOLD_DAYS
        distinguishing_aspect: |
          Numeric threshold boundary on Loan.days_past_due: precondition is days_past_due >= 270
          (inclusive >=, not >). Reached through POST /_clock/advance.
        test_recipe:
          setup:
            - "Create Borrower + Loan; separate; advance 180d into REPAYMENT; set last_payment_due_at = now-269 days; make NO payment"
          trigger:
            - "POST /_clock/advance to time T such that days_past_due == 269 (one day before threshold)"
            - "GET /loans/{lid} -> status should still be DELINQUENT"
            - "POST /_clock/advance one more day -> days_past_due == 270"
          assert:
            - "At days_past_due==269: Loan.status == 'DELINQUENT'"
            - "At days_past_due==270: Loan.status == 'DEFAULT' (inclusive boundary)"

      - name: empty_included_loan_ids_for_plan
        grounds:
          - validations[priority=15]
          - endpoints.POST_/borrowers/{borrower_id}/plans/{plan_id}/activate
          - calculations.monthly_payment_calc
        distinguishing_aspect: |
          DIFFERENT metric: empty-set boundary on RepaymentPlan.included_loan_ids. Reached through
          a different endpoint (POST /plans). Tests handling of zero-element input.
        test_recipe:
          setup:
            - "Create Borrower"
          trigger:
            - "POST /plans plan_type=SAVE included_loan_ids=[]"
          assert:
            - "Response error_id == 'ERR_PLAN_LOAN_INELIGIBLE'"
            - "HTTP status == 422"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_activation_blocked_by_default_loan
        grounds:
          - state_machines.RepaymentPlan.PENDING_to_ACTIVE
          - state_machines.Loan.DELINQUENT_to_DEFAULT
          - validations[priority=15]
        distinguishing_aspect: |
          Entity pair: RepaymentPlan -> Loan. RepaymentPlan PENDING->ACTIVE requires that every
          included Loan have status in {REPAYMENT, GRACE}. A Loan in DEFAULT blocks the plan's
          transition.
        test_recipe:
          setup:
            - "Create Borrower + Loan; separate; advance 180d into REPAYMENT; advance further until Loan auto-transitions to DEFAULT"
            - "POST /plans plan_type=SAVE included_loan_ids=[loan_id] -> creates PENDING plan"
          trigger:
            - "POST /plans/{pid}/activate"
          assert:
            - "Response error_id == 'ERR_PLAN_LOAN_INELIGIBLE'"
            - "HTTP status == 422"

      - name: discharge_approval_requires_employment_cert_state
        grounds:
          - state_machines.DischargeApplication.SUBMITTED_to_UNDER_REVIEW
          - state_machines.EmploymentCertification.SUBMITTED_to_APPROVED
          - validations[priority=10]
        distinguishing_aspect: |
          DIFFERENT entity pair: DischargeApplication -> EmploymentCertification. Moving a PSLF
          application SUBMITTED->UNDER_REVIEW requires at least one APPROVED EmploymentCertification
          on the same Borrower. Unlike the Plan->Loan dependency, this involves two non-Loan entities.
        test_recipe:
          setup:
            - "Create Borrower + Loan + an EmploymentCertification still in SUBMITTED status (NOT yet APPROVED)"
            - "POST /discharge-applications program=PSLF"
          trigger:
            - "PATCH /discharge-applications/{aid} status=UNDER_REVIEW as ServicerCertifier"
          assert:
            - "Response error_id == 'ERR_PSLF_NO_EMPLOYMENT_EVIDENCE'"
            - "HTTP status == 422"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: hardship_request_forbearance_cumulative_cap
        grounds:
          - validations[priority=13]
          - state_machines.HardshipRequest.SUBMITTED_to_APPROVED
          - entities.HardshipRequest.fields.cumulative_forbearance_days_at_request
        distinguishing_aspect: |
          Interval semantics: aggregate-capacity overlap on Borrower's lifetime FORBEARANCE_GENERAL
          history. Each request is a [requested_from, requested_to] interval; the cumulative SUM of
          durations across the borrower's history (regardless of contiguity) cannot exceed 1095 days.
          Adjacency is irrelevant — only total volume matters.
        test_recipe:
          setup:
            - "Create Borrower + Loan in REPAYMENT"
            - "POST /hardship-requests kind=FORBEARANCE_GENERAL, requested_from=now, requested_to=now+1000 days, applied_loan_ids=[loan_id]; PATCH to APPROVED (consumes 1000 days)"
            - "Advance clock past requested_to; Loan auto-returns to REPAYMENT"
          trigger:
            - "POST /hardship-requests kind=FORBEARANCE_GENERAL, requested_from=now, requested_to=now+100 days; PATCH to APPROVED"
          assert:
            - "Second PATCH response error_id == 'ERR_FORBEARANCE_CAP_EXCEEDED' (1000 + 100 == 1100 > 1095)"
            - "HTTP status == 422"

      - name: repayment_plan_overlap_on_loan_id
        grounds:
          - validations[priority=17]
          - state_machines.RepaymentPlan.PENDING_to_ACTIVE
          - state_machines.RepaymentPlan.ACTIVE_to_SUPERSEDED
          - concurrency_rules[plan_activate]
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource entity (RepaymentPlan). Geometric
          treatment: at any instant t, the SET of plans that include a given loan_id must have
          cardinality <= 1 (point-in-time mutual exclusion, not duration-based). Activating an
          overlapping second plan triggers SUPERSEDED on the first — different geometric rule from
          the cumulative-volume cap above.
        test_recipe:
          setup:
            - "Create Borrower + Loan in REPAYMENT (separated and post-grace)"
            - "Activate SAVE plan covering loan_id"
          trigger:
            - "Create + activate a second IBR plan including the same loan_id"
          assert:
            - "Second plan.status == 'ACTIVE'"
            - "First plan.status == 'SUPERSEDED' (point-in-time exclusion enforced by transitioning the loser, not by error)"
            - "Loan still belongs to exactly one ACTIVE plan at all times"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: rehab_completion_balance_conservation
        grounds:
          - state_machines.Loan.DEFAULT_to_REHABILITATION
          - state_machines.Loan.REHABILITATION_to_REPAYMENT
          - calculations.payment_allocation_waterfall
          - calculations.payment_allocation_waterfall.variants[targeted_garnishment]
        distinguishing_aspect: |
          Conserved quantity #1: borrower's lifetime cash-in vs principal+interest reduction.
          Invariant: across the DEFAULT->REHABILITATION->REPAYMENT compensating cycle, the equation
          (Loan.principal_balance_cents_final + Loan.accrued_interest_cents_final + lifetime_paid_cents)
          == (Loan.principal_balance_cents_at_DEFAULT_entry + Loan.accrued_interest_cents_at_DEFAULT_entry)
          + interest_accrued_during_rehab. The rehab cycle itself adds no synthetic credits — payments
          are real and accounted for.
        test_recipe:
          setup:
            - "Create Borrower + Loan; drive Loan into DEFAULT; snapshot S0 = principal+interest at DEFAULT entry"
            - "Open REHAB_AGREEMENT_OPEN; record 9 REHAB_PAYMENT_RECORDED actions, each with a Payment of amount A_i over 10 months"
            - "Advance clock to complete rehabilitation (Loan -> REPAYMENT)"
          trigger:
            - "GET /loans/{lid}"
          assert:
            - "Loan.principal_balance_cents + Loan.accrued_interest_cents + sum(A_i for i in 1..9) == S0 + interest_accrued_during_rehab"
            - "No CollectionsAction.kind == 'REHAB_COMPLETED' creates synthetic principal or interest reduction beyond the recorded Payments"

      - name: discharge_then_no_offset_garnishment
        grounds:
          - state_machines.Loan.REPAYMENT_to_DISCHARGED
          - state_machines.DischargeApplication.UNDER_REVIEW_to_APPROVED
          - calculations.payment_allocation_waterfall.variants[targeted_garnishment]
          - endpoints.POST_/borrowers/{borrower_id}/payments
        distinguishing_aspect: |
          DIFFERENT conserved quantity: number of DISCHARGED loans whose post-discharge balance
          remains exactly zero. Invariant: after a Loan transitions REPAYMENT->DISCHARGED, any
          subsequent TREASURY_OFFSET or ADMINISTRATIVE_WAGE_GARNISHMENT Payment must NOT debit that
          loan (its principal_balance_cents and accrued_interest_cents stay zero); the post-discharge
          payment is allocated 0 to discharged loans (and refunded if no other loans qualify).
        test_recipe:
          setup:
            - "Create Borrower(veteran_status=TPD_VETERAN) + single Loan; approve VETERAN_TPD discharge -> Loan.status == DISCHARGED, balances == 0"
          trigger:
            - "POST /payments amount_cents=10000, source=TREASURY_OFFSET"
          assert:
            - "Loan.principal_balance_cents == 0 and accrued_interest_cents == 0 (unchanged)"
            - "Payment.allocations either empty, or all allocations to this loan have principal_cents==0 and interest_cents==0; the 10000 cents is recorded as refund_cents on the Payment"
            - "Discharge invariant preserved: discharged loans cannot be re-debited"
