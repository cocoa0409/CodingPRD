            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a2_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
