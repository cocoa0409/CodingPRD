    input: [account_id, action_id, attempt_no, service_latency_ms, "auth_error?", expected_account_version, "forced_failure?", "max_retries?", "charge?"]
    output: { charged_cents: integer, attempt_no: integer, disposition: enum, account_version: integer, tasks_used_current: integer }
