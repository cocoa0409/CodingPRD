              captures: { n1: $.data.sample_size, c1: $.data.acceptance_number, rev1: $.data.sampling_plan_revision, st1: $.data.process_state }
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { action: "QUARANTINE", disposition_note: "visual defect" }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              captures: { st2: $.data.process_state }
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { action: "RETEST", disposition_note: "first retest" }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              captures: { st3: $.data.process_state, rc3: $.data.retest_count, n3: $.data.sample_size, c3: $.data.acceptance_number, rev3: $.data.sampling_plan_revision, done3: $.data.completed_test_count }
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { action: "QUARANTINE", disposition_note: "second defect" }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { action: "RETEST", disposition_note: "second retest" }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              captures: { st5: $.data.process_state, rc5: $.data.retest_count, n5: $.data.sample_size, c5: $.data.acceptance_number, rev5: $.data.sampling_plan_revision }
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { action: "QUARANTINE", disposition_note: "third defect" }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { action: "RETEST", disposition_note: "third retest attempt" }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              expect_error: ERR_RETEST_LIMIT_REACHED
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { action: "RELEASE", disposition_note: "attempt to escape quarantine" }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              expect_error: ERR_LOT_STATE_INVALID
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { action: "SCRAP", disposition_note: "unsalvageable" }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              captures: { st9: $.data.process_state }
            - call: "POST /production-lots/${lot_id}/disposition"
              payload: { action: "SCRAP", disposition_note: "repeat scrap" }
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              expect_error: ERR_LOT_STATE_INVALID
          assert:
            - "${st1} == LOT_TESTING and ${n1} == 8 and ${c1} == 1 and ${rev1} == 1   # ceil(sqrt(50)) = 8, tier n<=8 -> c 1"
            - "${st2} == QUARANTINED"
            - "${st3} == LOT_TESTING and ${rc3} == 1 and ${rev3} == 2"
            - "${n3} == 16 and ${c3} == 0     # the RETEST hop itself redraws the tightened plan: min(8*2,20) and max(1-1,0)"
            - "${done3} == 0                  # re-entering LOT_TESTING destroys the accumulated evidence"
            - "${st5} == LOT_TESTING and ${rc5} == 2 and ${rev5} == 3 and ${n5} == 16 and ${c5} == 0   # the second pass tightens no further - the branch is a flag, not a ramp"
            - "the seventh call is 409 ERR_RETEST_LIMIT_REACHED - at retest_count == RETEST_MAX 2 the QUARANTINED -> LOT_TESTING edge no longer exists"
            - "the eighth call is 409 ERR_LOT_STATE_INVALID - RELEASE is only reachable from LOT_TESTING, so the third quarantine is a trap"
            - "${st9} == SCRAPPED and the tenth call is 409 ERR_LOT_STATE_INVALID (SCRAPPED is terminal)"
            - "ProductionLot.${lot_id}.retest_count == 2 and ProductionLot.${lot_id}.sampling_plan_revision == 3 (the refused calls mutated nothing)"

  - rule_id: transitive_cascade
    instances:
      - name: cascade_a_exposure_removal_freezes_plant_holds_lots_aborts_runs
        grounds:
          - calculations.worker_exposure_index
          - calculations.plant_compliance_posture
          - state_machines.Worker.removal_status.ACTIVE_to_MEDICAL_REMOVAL
          - state_machines.Plant.compliance_posture
          - state_machines.ProductionLot.env_hold_status.CLEAR_to_HELD
          - state_machines.FormationRun.run_state.CHARGING_to_ABORTED
          - endpoints[POST /workers/{id}/exposure-samples]
        distinguishing_aspect: |
          Depth 5 from a single hygiene sample, and every link is CAUSED by the
          previous one: sample -> index >= 100.00 removes the worker (1) ->
          open_medical_removal_count reaches 2, which re-derives the plant posture
          to FROZEN (2) -> FROZEN holds every non-terminal lot of the plant (3) ->
          the hold aborts the lot's CHARGING formation run (4) -> the abort releases
          the run's emission reservation, changing the plant's emission ledger (5).
          Trigger is an exposure sample; the second cascade instance is triggered by a
          capacity-test result instead, and no hop is shared between them.
        test_recipe:
          setup:
            - "Plant with two more PRODUCTION workers to be sampled, an APPROVED lead design, a lot in FORMATION, a bay, and a formation run already CHARGING before any removal exists."
            - "One earlier BLOOD sample already removed worker X, so the plant sits at RESTRICTED with open_medical_removal_count 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: ["LEAD_ACID", "LITHIUM_LFP"], permit_status: "ACTIVE", monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: "ENGINEER", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { eng_b_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: "PRODUCTION", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { sup_a_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Sam Safety", job_class: "SAFETY", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { saf_a_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Pat Paster", job_class: "PRODUCTION", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { wx_id: $.data.id }
            - call: "POST /workers"
              payload: { plant_id: "${plant_id}", full_name: "Quinn Caster", job_class: "PRODUCTION", hire_date: "2020-01-01T00:00:00Z" }
              as: PlantAdmin
              captures: { wy_id: $.data.id }
            - call: "POST /cell-designs"
              payload: { code: "CD-LEAD-465", chemistry: "LEAD_ACID", plate_type: "TUBULAR", cells_per_battery: 12, cell_nominal_voltage_v: 2.0, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.000, lead_content_kg: 300.000, formation_charge_factor: 1.5, list_price_cents: 500000 }
