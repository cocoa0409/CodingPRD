# =============================================================================
# PRD-Bench Scaffold — Perfusion Services & Cardiopulmonary Bypass Case Coverage
# Difficulty band: Expert+ (14 entities / 53 endpoints / 72 error codes /
#                  9 state machines / 8 calculation rules / 72 ordered validations)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2630. Perfusion Services & Cardiopulmonary Bypass Case Coverage (perfusion
  services group): case scheduling and perfusionist assignment with call
  coverage rotation, disposable pack configuration by procedure type and
  surgeon preference, pump setup checklist, pre-bypass safety checks and blood
  management protocols, extracorporeal membrane oxygenation coverage with
  prolonged staffing rules, equipment maintenance, backup device readiness and
  event log capture, incident reporting and quality review of bypass times and
  adverse events, hospital contract staffing model with per-case and coverage
  fees, certification maintenance and continuing education tracking

domain_name: perfusion-bypass-case-coverage
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # graph: PerfusionDevice references itself (backup_device_id); BypassCase is a
  # hub whose FKs fan out to HospitalContract, Surgeon, Perfusionist and two
  # PerfusionDevice roles; CallRotationSlot is a Perfusionist x HospitalContract
  # association carrying its own interval; DisposablePack joins BypassCase to a
  # PreferenceCard revision. No single ownership tree exists.

  state_machine_shape: parallel
  # BypassCase carries two independent dimensions (bypass_status x
  # billing_status) that advance on different triggers; IncidentReport and
  # EcmoRun and Certification are cyclic; PerfusionDevice and CeActivity and
  # IncidentReport fork with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # HospitalContract -> BypassCase / PerfusionDevice / CallRotationSlot
    - many_to_many         # Perfusionist x HospitalContract via CallRotationSlot
    - self_referential     # PerfusionDevice.backup_device_id -> PerfusionDevice.id
    - cross_aggregate      # BypassCase preconditions read Certification and PerfusionDevice state

  role_model: segregation_of_duties
  # The Perfusionist involved in a case may not close that case's IncidentReport,
  # nor may the Perfusionist who filed it; ChiefPerfusionist is entity-backed by
  # Perfusionist precisely so the server can compare actor ids.

  consistency_model: immediate

  difficulty_level: expert_plus

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: HospitalContract
    parent: null
    common_fields: true
    fields:
      - name: hospital_name
        type: string
        source: input
        description: Client hospital trading name.
        constraints: non-empty, max 160 chars
      - name: staffing_model
        type: enum
        source: input
        description: Commercial model that decides whether a monthly coverage fee is billable.
        constraints: "one of {PER_CASE, COVERAGE_PLUS_PER_CASE, FULL_COVERAGE}"
      - name: monthly_coverage_fee_cents
        type: integer
        source: input
        description: Flat monthly coverage retainer in cents; ignored by the settlement calc when staffing_model == PER_CASE.
        default: 0
        constraints: ">= 0"
      - name: per_case_fee_cents
        type: integer
        source: input
        description: Base professional fee billed per bypass case in cents.
        constraints: "> 0"
      - name: ecmo_hourly_fee_cents
        type: integer
        source: input
        description: Hourly ECMO coverage rate in cents used by ecmo_run_billing.
        constraints: "> 0"
      - name: prolonged_surcharge_pct
        type: number
        source: input
        description: Fractional surcharge applied per 30-minute prolonged-perfusion unit.
        default: 0.15
        constraints: "0 <= value <= 1, at most 4 decimal places"
      - name: prolonged_pump_threshold_minutes
        type: integer
        source: input
        description: Pump-time minute count at or above which prolonged-perfusion surcharge units start accruing.
        default: 180
        constraints: ">= 30"
      - name: disposable_markup_pct
        type: number
        source: input
        description: Fractional markup applied to each disposable pack line item.
        default: 0.20
        constraints: "0 <= value <= 1"
      - name: disposable_discount_pct
        type: number
        source: input
        description: Fractional contract discount applied to each disposable pack line item before markup.
        default: 0.0
        constraints: "0 <= value < 1"
      - name: monthly_case_cap
        type: integer
        source: input
        description: Maximum number of cases that may hold a billing accrual against this contract at one time.
        constraints: ">= 1"
      - name: accrued_case_fee_cents
        type: integer
        source: computed
        description: "Denormalized money ledger: sum of BypassCase.accrued_fee_cents over cases of this contract whose billing_status IN {PROVISIONAL_ACCRUED, FINAL_ACCRUED, INVOICED}. Conserved quantity of compensating-invariant contract_accrual_conservation."
        default: 0
      - name: accrued_case_count
        type: integer
        source: computed
        description: "Count of BypassCase rows of this contract whose billing_status IN {PROVISIONAL_ACCRUED, FINAL_ACCRUED, INVOICED}; compared against monthly_case_cap."
        default: 0
      - name: coverage_posture
        type: enum
        source: computed
        description: "Derived call-coverage posture recomputed by calculation contract_coverage_posture; gates case creation."
        default: UNCOVERED
        constraints: "one of {COVERED, THIN, UNCOVERED}"
      - name: last_settlement_period
        type: string
        source: system
        description: Most recently settled period in YYYY-MM form; null until the first settlement run.
        default: null
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$ or null"

  - name: Surgeon
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Surgeon display name.
        constraints: non-empty, max 120 chars
      - name: npi_code
        type: string
        source: input
        description: National provider identifier; unique across all Surgeon rows.
        constraints: non-empty, unique
      - name: specialty
        type: enum
        source: input
        description: Surgical specialty; restricts which procedure types the surgeon may hold preference cards for.
        constraints: "one of {ADULT_CARDIAC, PEDIATRIC_CARDIAC, TRANSPLANT}"
      - name: status
        type: enum
        source: input
        description: Credentialing status; an INACTIVE surgeon cannot be named on a new case.
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: PreferenceCard
    parent: Surgeon
    common_fields: true
    fields:
      - name: surgeon_id
        type: string
        source: input
        description: FK -> Surgeon.id; owning surgeon, must equal X-User-ID when the actor role is Surgeon.
      - name: procedure_type
        type: enum
        source: input
        description: Procedure the card configures; the (surgeon_id, procedure_type) pair selects the card during pack configuration.
        constraints: "one of {CABG, VALVE, AORTIC_ARCH, TRANSPLANT, VAD_IMPLANT, PEDIATRIC_SWITCH}"
      - name: revision
        type: integer
        source: input
        description: Author-supplied revision number; primary sort key of the preference-card selector (revision DESC).
        default: 1
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Flipped to SUPERSEDED by the create-preference-card transition whenever a newer card for the same (surgeon_id, procedure_type) pair is created.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"
      - name: standard_pump_minutes
        type: integer
        source: input
        description: Expected pump time for this procedure; the ONLY minute source used by the PROVISIONAL variant of case_fee_settlement.
        constraints: ">= 30"
      - name: prime_volume_ml
        type: integer
        source: input
        description: Circuit prime volume copied onto every DisposablePack built from this card.
        constraints: ">= 100"
      - name: pack_line_items
        type: array
        source: input
        description: "Ordered disposable line templates; each element is an object { line_code: string, quantity: integer >= 1, unit_cost_cents: integer >= 1 }."
        constraints: "1 to 12 elements, line_code unique within the array"
      - name: required_safety_check_codes
        type: array
        source: input
        description: Pre-bypass safety check codes that MUST all appear with passed == true in a PumpChecklist before it may be verified.
        constraints: "1 to 12 non-empty strings, unique"
      - name: blood_management_protocol
        type: enum
        source: input
        description: Blood management protocol the checklist must declare verbatim.
        constraints: "one of {STANDARD, ANTIFIBRINOLYTIC, JEHOVAH_WITNESS_BLOODLESS, PEDIATRIC_MINIPRIME}"
      - name: min_hematocrit_pct
        type: number
        source: input
        description: Minimum on-pump hematocrit percentage the checklist must report at or above.
        constraints: "5 <= value <= 45"

  - name: Perfusionist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Perfusionist display name.
        constraints: non-empty, max 120 chars
      - name: employee_code
        type: string
        source: input
        description: Group employee code; unique across all Perfusionist rows.
        constraints: non-empty, unique
      - name: employment_status
        type: enum
        source: input
        description: Employment state; only ACTIVE perfusionists may be put on call or assigned to a case.
        default: ACTIVE
        constraints: "one of {ACTIVE, LEAVE, TERMINATED}"
      - name: is_chief
        type: boolean
        source: input
        description: True when this perfusionist may act under the ChiefPerfusionist role; the server rejects ChiefPerfusionist calls whose X-User-ID resolves to a Perfusionist with is_chief == false.
        default: false
      - name: ecmo_privileged
        type: boolean
        source: input
        description: True when this perfusionist holds ECMO privileges; required to be the primary or relieving perfusionist of an EcmoRun.
        default: false
      - name: career_case_count
        type: integer
        source: input
        description: Career completed bypass case count seeded at onboarding from the HR record; incremented by exactly 1 by the case-close transition. Feeds the experience term of perfusionist_readiness_score.
        default: 0
        constraints: ">= 0"
      - name: ce_credits_verified
        type: number
        source: computed
        description: "Denormalized CE ledger: sum of CeActivity.credit_hours for this perfusionist with status == VERIFIED and activity_date inside the current certification cycle. Conserved quantity of compensating-invariant ce_credit_ledger_conservation."
        default: 0
      - name: ce_credits_pending
        type: number
        source: computed
        description: "Sum of CeActivity.credit_hours for this perfusionist with status == SUBMITTED and activity_date inside the current certification cycle; counted by the ADMISSION readiness variant only."
        default: 0
      - name: readiness_score
        type: number
        source: computed
        description: Most recently computed perfusionist_readiness_score value, 3 decimal places.
        default: 0.0
      - name: readiness_variant_last
        type: enum
        source: system
        description: Which variant produced the stored readiness_score; ADMISSION is written by the assign-perfusionist transition, AUDIT by the incident-review transition.
        default: null
        constraints: "one of {ADMISSION, AUDIT} or null"
      - name: consecutive_case_count_24h
        type: integer
        source: computed
        description: "Count of BypassCase rows with assigned_perfusionist_id == this id and bypass_started_at in the half-open window [now - 24h, now); fatigue term of perfusionist_readiness_score."
        default: 0
      - name: ecmo_hours_rolling_7d
        type: number
        source: computed
        description: "Sum of EcmoRun.billable_hours over runs with primary_perfusionist_id == this id and cannulated_at in the half-open window [now - 168h, now); fatigue term of perfusionist_readiness_score."
        default: 0

  - name: Certification
    parent: Perfusionist
    common_fields: true
    fields:
      - name: perfusionist_id
        type: string
        source: input
        description: FK -> Perfusionist.id; the holder of this certification.
      - name: cert_code
        type: enum
        source: input
        description: Certification kind; the CCP row is the one consulted by the assignment safety gate.
        constraints: "one of {CCP, CES_A, ECMO_SPEC}"
      - name: status
        type: enum
        source: system
        description: Lifecycle state driven by state machine Certification.
        default: ACTIVE
        constraints: "one of {ACTIVE, PROBATION, LAPSED, REVOKED}"
      - name: issued_on
        type: datetime
        source: input
        description: Cycle start instant, ISO 8601 UTC; inclusive lower bound of the CE credit window.
      - name: expires_on
        type: datetime
        source: input
        description: Cycle end instant, ISO 8601 UTC; exclusive upper bound of the CE credit window and the lapse deadline.
        constraints: "must be strictly after issued_on"
      - name: cycle_credit_requirement
        type: number
        source: input
        description: CE credit hours required across the cycle; denominator of the readiness credit ratio.
        default: 45
        constraints: "> 0"
      - name: remediation_credits_required
        type: number
        source: system
        description: Verified CE credit hours that must be banked after entering PROBATION before the certification returns to ACTIVE.
        default: 0
      - name: probation_credits_banked
        type: number
        source: system
        description: Verified CE credit hours accumulated since the most recent ACTIVE -> PROBATION transition; reset to 0 on every entry to PROBATION and on the return to ACTIVE.
        default: 0
      - name: probation_count
        type: integer
        source: system
        description: Number of times this certification has entered PROBATION; at 2 or more a further systemic finding revokes it.
        default: 0

  - name: CeActivity
    parent: Perfusionist
    common_fields: true
    fields:
      - name: perfusionist_id
        type: string
        source: input
        description: FK -> Perfusionist.id; the perfusionist claiming the credits.
      - name: category
        type: enum
        source: input
        description: Continuing-education category.
        constraints: "one of {CLINICAL, TECHNICAL, SAFETY, ETHICS}"
      - name: credit_hours
        type: number
        source: input
        description: Claimed credit hours for this single activity.
        constraints: "> 0 and <= 20, at most 1 decimal place"
      - name: activity_date
        type: datetime
        source: input
        description: Instant the activity was completed, ISO 8601 UTC; must fall inside the certification cycle window to count.
      - name: accreditation_body
        type: enum
        source: input
        description: Accrediting organisation.
        constraints: "one of {ABCP, AMSECT, OTHER}"
      - name: status
        type: enum
        source: system
        description: Lifecycle state driven by state machine CeActivity.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, VERIFIED, REJECTED, REVOKED}"
      - name: counted_toward_remediation
        type: boolean
        source: computed
        description: True when this activity was VERIFIED while the holder's CCP Certification was in PROBATION, so its hours were added to Certification.probation_credits_banked.
        default: false

  - name: PerfusionDevice
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> HospitalContract.id; the hospital the device is stationed at.
      - name: asset_tag
        type: string
        source: input
        description: Biomed asset tag; unique across all PerfusionDevice rows.
        constraints: non-empty, unique
      - name: device_class
        type: enum
        source: input
        description: Device family; a bypass case may only reserve a HEART_LUNG_MACHINE as primary and backup.
        constraints: "one of {HEART_LUNG_MACHINE, ECMO_CONSOLE, CELL_SAVER, HEATER_COOLER}"
      - name: status
        type: enum
        source: system
        description: Lifecycle state driven by state machine PerfusionDevice.
        default: AVAILABLE
        constraints: "one of {AVAILABLE, RESERVED, IN_USE, NEEDS_SERVICE}"
      - name: backup_device_id
        type: string
        source: input
        description: "FK -> PerfusionDevice.id; self-referential designated backup unit for this device. Null when no backup is designated. Must reference a different row of the same device_class and contract_id."
        default: null
      - name: service_interval_hours
        type: integer
        source: input
        description: Runtime hours allowed between preventive services; a device at or above this figure is service-overdue.
        default: 500
        constraints: ">= 1"
      - name: runtime_hours_since_service
        type: number
        source: computed
        description: Accumulated runtime hours since last_service_completed_at; incremented by end-bypass and by RUNTIME_TICK event logs, reset to 0 by a service completion.
        default: 0
      - name: alarm_count_since_service
        type: integer
        source: computed
        description: Count of DeviceEventLog rows with event_code IN {ALARM_CRITICAL, ALARM_ADVISORY, SELF_TEST_FAIL} appended since last_service_completed_at; reset to 0 by a service completion.
        default: 0
      - name: last_service_completed_at
        type: datetime
        source: system
        description: Instant of the most recent service completion, ISO 8601 UTC; null until first service.
        default: null
      - name: open_reservation_count
        type: integer
        source: computed
        description: "Count of BypassCase rows where (primary_device_id == this id OR backup_device_id == this id) AND bypass_status IN {PACK_CONFIGURED, SETUP_VERIFIED, ON_BYPASS}. Conserved quantity of compensating-invariant device_reservation_conservation."
        default: 0

  - name: DeviceEventLog
    parent: PerfusionDevice
    common_fields: false
    fields:
      - name: device_id
        type: string
        source: input
        description: FK -> PerfusionDevice.id; the device the event was captured on.
      - name: event_code
        type: enum
        source: input
        description: Captured event kind; ALARM_CRITICAL and SELF_TEST_FAIL force the device to NEEDS_SERVICE.
        constraints: "one of {ALARM_CRITICAL, ALARM_ADVISORY, RUNTIME_TICK, SELF_TEST_PASS, SELF_TEST_FAIL, SERVICE_COMPLETED}"
      - name: runtime_hours_delta
        type: number
        source: input
        description: Runtime hours to add to the device counter with this event; only honoured for event_code == RUNTIME_TICK.
        default: 0
        constraints: ">= 0 and <= 24"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that captured the event, stored verbatim for audit; not constrained to any entity id because both opaque (BiomedTech) and entity-backed (Perfusionist) roles may log events.
      - name: detail
        type: string
        source: input
        description: Free-text note captured with the event.
        default: null
        constraints: max 400 chars

  - name: CallRotationSlot
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> HospitalContract.id; the hospital this call window covers.
      - name: perfusionist_id
        type: string
        source: input
        description: FK -> Perfusionist.id; the perfusionist on call for this window.
      - name: slot_type
        type: enum
        source: input
        description: Rotation role; PRIMARY_CALL and BACKUP_CALL feed contract_coverage_posture, ECMO_RELIEF is consumed by ECMO handoffs.
        constraints: "one of {PRIMARY_CALL, BACKUP_CALL, ECMO_RELIEF}"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the call window, ISO 8601 UTC.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the call window, ISO 8601 UTC; the slot occupies the half-open interval [window_start, window_end).
        constraints: "must be strictly after window_start"
      - name: status
        type: enum
        source: system
        description: Lifecycle state driven by state machine CallRotationSlot.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, ACTIVE, COMPLETED, RELEASED}"
      - name: consumed
        type: boolean
        source: system
        description: True once an ECMO handoff has consumed this ECMO_RELIEF slot; a consumed ECMO_RELIEF slot may not be named by a second handoff. Always false for PRIMARY_CALL and BACKUP_CALL slots, which may cover any number of cases inside their window.
        default: false

  - name: BypassCase
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> HospitalContract.id; the billing contract for this case.
      - name: surgeon_id
        type: string
        source: input
        description: FK -> Surgeon.id; the operating surgeon whose preference card configures the pack.
      - name: assigned_perfusionist_id
        type: string
        source: system
        description: FK -> Perfusionist.id; set by the assign-perfusionist transition, replaced on reassignment, never cleared once set.
        default: null
      - name: primary_device_id
        type: string
        source: system
        description: FK -> PerfusionDevice.id; heart-lung machine reserved by the pack-configuration transition; cleared to null when a critical alarm cascades onto this case.
        default: null
      - name: backup_device_id
        type: string
        source: system
        description: FK -> PerfusionDevice.id; standby heart-lung machine reserved alongside the primary; cleared to null when a critical alarm cascades onto this case.
        default: null
      - name: procedure_type
        type: enum
        source: input
        description: Procedure to be performed; must be permitted for the surgeon's specialty and must have an ACTIVE preference card at pack-configuration time.
        constraints: "one of {CABG, VALVE, AORTIC_ARCH, TRANSPLANT, VAD_IMPLANT, PEDIATRIC_SWITCH}"
      - name: acuity
        type: enum
        source: input
        description: Case acuity; drives the acuity uplift term of case_fee_settlement and relaxes the coverage-posture gate.
        default: ELECTIVE
        constraints: "one of {ELECTIVE, URGENT, EMERGENT}"
      - name: scheduled_start
        type: datetime
        source: input
        description: Inclusive planned start instant, ISO 8601 UTC; must be at or after the logical clock at creation time.
      - name: scheduled_end
        type: datetime
        source: input
        description: Exclusive planned end instant, ISO 8601 UTC; the case occupies the half-open interval [scheduled_start, scheduled_end) for perfusionist concurrency purposes, and the same bounds compared non-strictly with a single DEVICE_TURNAROUND_MINUTES buffer on the incumbent side for device turnaround purposes.
        constraints: "must be strictly after scheduled_start"
      - name: bypass_status
        type: enum
        source: system
        description: Clinical dimension of the parallel BypassCase state machine.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, STAFFED, PACK_CONFIGURED, SETUP_VERIFIED, ON_BYPASS, OFF_BYPASS, CLOSED, CANCELLED}"
      - name: billing_status
        type: enum
        source: system
        description: Fiscal dimension of the parallel BypassCase state machine; advances on triggers that are disjoint from the clinical dimension's triggers.
        default: UNBILLED
        constraints: "one of {UNBILLED, PROVISIONAL_ACCRUED, FINAL_ACCRUED, INVOICED, CREDITED}"
      - name: bypass_started_at
        type: datetime
        source: system
        description: Logical-clock instant of the start-bypass transition; null before it.
        default: null
      - name: bypass_ended_at
        type: datetime
        source: system
        description: Logical-clock instant of the end-bypass transition; null before it. Half-open period membership for settlement uses this field.
        default: null
      - name: pump_time_minutes
        type: integer
        source: system
        description: Actual pump minutes reported at end-bypass; the ONLY minute source used by the FINAL variant of case_fee_settlement.
        default: null
        constraints: ">= 0 and <= 2880 when present"
      - name: cross_clamp_minutes
        type: integer
        source: system
        description: Actual aortic cross-clamp minutes reported at end-bypass.
        default: null
        constraints: ">= 0 and <= pump_time_minutes when present"
      - name: lowest_hematocrit_pct
        type: number
        source: system
        description: Lowest on-pump hematocrit percentage reported at end-bypass; quality-review input.
        default: null
        constraints: "5 <= value <= 45 when present"
      - name: adverse_event_count
        type: integer
        source: system
        description: Adverse event count reported at end-bypass.
        default: 0
        constraints: ">= 0"
      - name: provisional_fee_cents
        type: integer
        source: computed
        description: Output of the PROVISIONAL variant of case_fee_settlement, written by the assign-perfusionist transition.
        default: null
      - name: final_fee_cents
        type: integer
        source: computed
        description: Output of the FINAL variant of case_fee_settlement, written by the case-close transition.
        default: null
      - name: accrued_fee_cents
        type: integer
        source: computed
        description: The fee amount currently carried in HospitalContract.accrued_case_fee_cents for this case; equals provisional_fee_cents while billing_status == PROVISIONAL_ACCRUED, final_fee_cents while FINAL_ACCRUED or INVOICED, and 0 while UNBILLED or CREDITED.
        default: 0
      - name: readiness_flag
        type: enum
        source: system
        description: Operational blocker flag; DEVICE_FALLBACK_REQUIRED is set when a critical alarm strips this case's primary device (which also reverts bypass_status to STAFFED) or when a critical alarm takes out only the standby pump (link 2b, which leaves bypass_status at SETUP_VERIFIED), and it blocks start-bypass until a fresh pack configuration or a cancellation clears it.
        default: NONE
        constraints: "one of {NONE, DEVICE_FALLBACK_REQUIRED}"
      - name: setup_verified_at
        type: datetime
        source: system
        description: Logical-clock instant of the checklist verification that moved this case to SETUP_VERIFIED; reset to null when a critical alarm cascades onto the case.
        default: null

  - name: DisposablePack
    parent: BypassCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> BypassCase.id; the case this pack was built for.
      - name: applied_preference_card_id
        type: string
        source: system
        description: FK -> PreferenceCard.id; the card chosen by the preference-card selector at configuration time, pinned so later card revisions do not retro-change this pack.
      - name: line_items
        type: array
        source: system
        description: "Materialised pack contents; each element is an object { line_code: string, quantity: integer, unit_cost_cents: integer, substituted: boolean, line_total_cents: integer }, built from the applied card's pack_line_items with substitutions applied, ordered by line_code ASC."
      - name: substitutions
        type: array
        source: input
        description: "Requested line replacements; each element is an object { line_code: string, replacement_code: string, replacement_unit_cost_cents: integer >= 1, reason: string }. Every line_code must exist in the applied card's pack_line_items; the replacement's unit_cost_cents overrides the card's for that line and the materialised line is marked substituted == true."
        default: []
        constraints: "0 to 6 elements, line_code unique within the array"
      - name: requires_surgeon_approval
        type: boolean
        source: computed
        description: True exactly when substitutions is non-empty.
        default: false
      - name: approval_status
        type: enum
        source: system
        description: NOT_REQUIRED when substitutions is empty at creation, otherwise PENDING until the owning surgeon approves or rejects.
        default: NOT_REQUIRED
        constraints: "one of {NOT_REQUIRED, PENDING, APPROVED, REJECTED}"
      - name: pack_cost_cents
        type: integer
        source: computed
        description: Output of calculation disposable_pack_cost over line_items.
        default: 0
      - name: prime_volume_ml
        type: integer
        source: system
        description: Circuit prime volume copied verbatim from the applied preference card.

  - name: PumpChecklist
    parent: BypassCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> BypassCase.id; the case this pre-bypass checklist belongs to.
      - name: verified_by_perfusionist_id
        type: string
        source: system
        description: FK -> Perfusionist.id; the perfusionist whose verify call signed the checklist off; null while status == DRAFT.
        default: null
      - name: check_results
        type: array
        source: input
        description: "Recorded pre-bypass safety checks; each element is an object { check_code: string, passed: boolean, note: string }."
        constraints: "1 to 20 elements, check_code unique within the array"
      - name: blood_management_protocol
        type: enum
        source: input
        description: Blood management protocol actually set up; must equal the applied preference card's blood_management_protocol at verify time.
        constraints: "one of {STANDARD, ANTIFIBRINOLYTIC, JEHOVAH_WITNESS_BLOODLESS, PEDIATRIC_MINIPRIME}"
      - name: hematocrit_pct
        type: number
        source: input
        description: Measured pre-bypass hematocrit percentage; must be at or above the applied card's min_hematocrit_pct at verify time.
        constraints: "5 <= value <= 45"
      - name: blood_mgmt_signoff
        type: boolean
        source: system
        description: Set true by the verify transition, reset to false whenever the checklist is invalidated.
        default: false
      - name: status
        type: enum
        source: system
        description: Lifecycle state driven by state machine PumpChecklist.
        default: DRAFT
        constraints: "one of {DRAFT, VERIFIED, INVALIDATED}"
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant of verification; null while DRAFT or INVALIDATED.
        default: null
      - name: missing_check_codes
        type: array
        source: computed
        description: "Codes present in the applied preference card's required_safety_check_codes that are absent from check_results or present with passed == false, ordered ascending; empty array means the safety gate is satisfied."
        default: []

  - name: EcmoRun
    parent: BypassCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> BypassCase.id; the bypass case the ECMO run was initiated from.
      - name: primary_perfusionist_id
        type: string
        source: system
        description: FK -> Perfusionist.id; the perfusionist currently staffing the run; replaced by every handoff.
      - name: relief_slot_id
        type: string
        source: system
        description: FK -> CallRotationSlot.id; the ECMO_RELIEF slot consumed by the most recent handoff; null before the first handoff.
        default: null
      - name: mode
        type: enum
        source: input
        description: Extracorporeal support configuration.
        constraints: "one of {VV, VA, VAV}"
      - name: cannulated_at
        type: datetime
        source: system
        description: Logical-clock instant the run was opened.
      - name: last_handoff_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent handoff; null before the first handoff, in which case uninterrupted staffing is measured from cannulated_at.
        default: null
      - name: decannulated_at
        type: datetime
        source: system
        description: Logical-clock instant the run was closed; null while the run is open.
        default: null
      - name: status
        type: enum
        source: system
        description: Lifecycle state driven by state machine EcmoRun.
        default: RUNNING
        constraints: "one of {RUNNING, RELIEF_PENDING, DECANNULATED}"
      - name: uninterrupted_minutes
        type: number
        source: computed
        description: "Minutes between COALESCE(last_handoff_at, cannulated_at) and the logical clock while the run is open, or and decannulated_at once closed."
        default: 0
      - name: billable_hours
        type: integer
        source: computed
        description: Output of calculation ecmo_run_billing; ceiling of total elapsed minutes divided by 60.
        default: 0
      - name: staffing_breach
        type: boolean
        source: computed
        description: True when uninterrupted_minutes is at or above ECMO_MAX_UNINTERRUPTED_MINUTES; blocks the staffing perfusionist from opening a further EcmoRun.
        default: false
      - name: ecmo_fee_cents
        type: integer
        source: computed
        description: Output of calculation ecmo_run_billing; 0 until the run is decannulated.
        default: 0

  - name: IncidentReport
    parent: BypassCase
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: FK -> BypassCase.id; the case under review.
      - name: involved_perfusionist_id
        type: string
        source: input
        description: FK -> Perfusionist.id; the perfusionist whose conduct is under review; a systemic finding puts this perfusionist's CCP certification on probation.
      - name: filed_by_perfusionist_id
        type: string
        source: system
        description: FK -> Perfusionist.id; the actor that created the report, taken from X-User-ID.
      - name: closed_by_perfusionist_id
        type: string
        source: system
        description: FK -> Perfusionist.id; the actor that closed the report, taken from X-User-ID; must differ from both involved_perfusionist_id and filed_by_perfusionist_id.
        default: null
      - name: severity
        type: enum
        source: input
        description: Reported severity; MAJOR and SENTINEL independently support a systemic finding.
        constraints: "one of {NEAR_MISS, MINOR, MAJOR, SENTINEL}"
      - name: category
        type: enum
        source: input
        description: Clinical category of the event.
        constraints: "one of {CIRCUIT, GAS_EXCHANGE, ANTICOAGULATION, DEVICE_FAILURE, BLOOD_MANAGEMENT}"
      - name: narrative
        type: string
        source: input
        description: Free-text account of the event.
        constraints: non-empty, max 2000 chars
      - name: status
        type: enum
        source: system
        description: Lifecycle state driven by state machine IncidentReport.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO, CLOSED_WITH_ACTION, CLOSED_NO_ACTION}"
      - name: return_count
        type: integer
        source: system
        description: Number of times this report has been returned for more information; a third return attempt is rejected.
        default: 0
      - name: reviewed_readiness_score
        type: number
        source: computed
        description: The AUDIT variant of perfusionist_readiness_score for involved_perfusionist_id, frozen by the accept-for-review transition; null until then.
        default: null
      - name: finding
        type: enum
        source: system
        description: Review outcome written by the close transition.
        default: NONE
        constraints: "one of {NONE, ISOLATED, SYSTEMIC}"
      - name: corrective_action_required
        type: boolean
        source: system
        description: Set true only by a SYSTEMIC close.
        default: false

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Parallel dimension A of BypassCase: the clinical pathway.
  # ---------------------------------------------------------------------------
  - entity: BypassCase
    dimension: bypass_status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: STAFFED
        trigger: "POST /bypass-cases/{id}/assign-perfusionist"
        actor: ChiefPerfusionist
        preconditions:
          - "case.bypass_status == SCHEDULED"
          - "payload.expected_case_version == case.version"
          - "perfusionist.employment_status == ACTIVE"
          - "the perfusionist's Certification row with cert_code == CCP has status IN {ACTIVE, PROBATION}"
          - "perfusionist_readiness_score ADMISSION variant >= READINESS_MIN_ADMISSION"
          - "there exists a CallRotationSlot with perfusionist_id == payload.perfusionist_id, contract_id == case.contract_id, slot_type IN {PRIMARY_CALL, BACKUP_CALL}, status IN {SCHEDULED, ACTIVE} and window_start <= case.scheduled_start AND case.scheduled_end <= window_end"
          - "count of other BypassCase rows with the same assigned_perfusionist_id, bypass_status IN {STAFFED, PACK_CONFIGURED, SETUP_VERIFIED} and half-open interval overlap on [scheduled_start, scheduled_end) is < MAX_CONCURRENT_STAFFED_CASES"
          - "count of other BypassCase rows with the same assigned_perfusionist_id, bypass_status == ON_BYPASS and half-open interval overlap is == 0"
          - "contract.accrued_case_count < contract.monthly_case_cap"
        side_effects:
          - "case.assigned_perfusionist_id = payload.perfusionist_id"
          - "case.provisional_fee_cents = case_fee_settlement[variant=PROVISIONAL]"
          - "case.billing_status UNBILLED -> PROVISIONAL_ACCRUED (parallel dimension B)"
          - "case.accrued_fee_cents = case.provisional_fee_cents"
          - "contract.accrued_case_fee_cents += case.accrued_fee_cents; contract.accrued_case_count += 1; contract.updated_at and contract.version advance"
          - "perfusionist.readiness_score = the ADMISSION value just computed; perfusionist.readiness_variant_last = ADMISSION"
          - "increments BypassCase.version by 1"
      - from: STAFFED
        to: STAFFED
        trigger: "POST /bypass-cases/{id}/assign-perfusionist (reassignment that legitimately supersedes the sitting assignment)"
        actor: ChiefPerfusionist
        preconditions:
          - "case.bypass_status == STAFFED"
          - "payload.expected_case_version == case.version"
          - "all SCHEDULED -> STAFFED preconditions hold for the incoming perfusionist"
          - "contract.accrued_case_count < contract.monthly_case_cap is NOT re-checked, because the case already holds its accrual slot when billing_status == PROVISIONAL_ACCRUED"
        side_effects:
          - "if case.billing_status == PROVISIONAL_ACCRUED: contract.accrued_case_fee_cents -= case.accrued_fee_cents (the outgoing accrual is withdrawn first)"
          - "if case.billing_status == UNBILLED: contract.accrued_case_count += 1"
          - "case.assigned_perfusionist_id = payload.perfusionist_id"
          - "case.provisional_fee_cents = case_fee_settlement[variant=PROVISIONAL] recomputed for the incoming perfusionist's case context"
          - "case.billing_status set to PROVISIONAL_ACCRUED; case.accrued_fee_cents = case.provisional_fee_cents"
          - "contract.accrued_case_fee_cents += case.accrued_fee_cents"
          - "increments BypassCase.version by 1"
        note: "This is the CREATE-with-supersede shape that makes concurrency_rules entry case-staffing-supersede a true race rather than a state precondition."
      - from: STAFFED
        to: PACK_CONFIGURED
        trigger: "POST /bypass-cases/{id}/disposable-packs"
        actor: Perfusionist | ChiefPerfusionist
        preconditions:
          - "case.bypass_status == STAFFED"
          - "the preference-card selector returns exactly one PreferenceCard (non-empty candidate set)"
          - "payload.primary_device_id names a PerfusionDevice with contract_id == case.contract_id, device_class == HEART_LUNG_MACHINE and status IN {AVAILABLE, RESERVED} (a machine already reserved for a non-colliding case window is admissible; IN_USE and NEEDS_SERVICE machines are not)"
          - "primary_device.runtime_hours_since_service < primary_device.service_interval_hours"
          - "the resolved backup device (payload.backup_device_id when supplied, else primary_device.backup_device_id) exists, has device_class == HEART_LUNG_MACHINE, contract_id == case.contract_id, status IN {AVAILABLE, RESERVED} and id != primary_device_id"
          - "no other BypassCase with bypass_status IN {PACK_CONFIGURED, SETUP_VERIFIED, ON_BYPASS} holds either resolved device and collides under the buffered non-strict closed-interval rule of validation priority 68 (buffer DEVICE_TURNAROUND_MINUTES applied once to the incumbent side)"
          - "every substitutions[].line_code exists in the selected card's pack_line_items"
        side_effects:
          - "create DisposablePack with applied_preference_card_id = selected card id, prime_volume_ml copied from the card, line_items materialised from the card with substitutions applied"
          - "DisposablePack.pack_cost_cents = disposable_pack_cost"
          - "DisposablePack.approval_status = PENDING when substitutions is non-empty, else NOT_REQUIRED"
          - "case.primary_device_id and case.backup_device_id set; case.readiness_flag = NONE"
          - "primary and backup device status set to RESERVED (a device already RESERVED for another non-colliding case simply stays RESERVED with a higher open_reservation_count)"
          - "both devices' open_reservation_count recomputed by device_reservation_ledger"
          - "increments BypassCase.version by 1"
      - from: PACK_CONFIGURED
        to: SETUP_VERIFIED
        trigger: "POST /pump-checklists/{id}/verify"
        actor: Perfusionist
        preconditions:
          - "checklist.status == DRAFT"
          - "case.bypass_status == PACK_CONFIGURED"
          - "X-User-ID == case.assigned_perfusionist_id"
          - "checklist.missing_check_codes is the empty array"
          - "checklist.blood_management_protocol == applied card's blood_management_protocol"
          - "checklist.hematocrit_pct >= applied card's min_hematocrit_pct"
          - "the case's DisposablePack has approval_status IN {NOT_REQUIRED, APPROVED}"
        side_effects:
          - "checklist.status DRAFT -> VERIFIED; checklist.blood_mgmt_signoff = true; checklist.verified_by_perfusionist_id = X-User-ID; checklist.verified_at = logical clock"
          - "case.bypass_status PACK_CONFIGURED -> SETUP_VERIFIED; case.setup_verified_at = logical clock"
          - "increments BypassCase.version by 1 and PumpChecklist.version by 1"
      - from: SETUP_VERIFIED
        to: ON_BYPASS
        trigger: "POST /bypass-cases/{id}/start-bypass"
        actor: Perfusionist
        preconditions:
          - "case.bypass_status == SETUP_VERIFIED"
          - "X-User-ID == case.assigned_perfusionist_id"
          - "case.readiness_flag == NONE"
          - "primary device status == RESERVED"
          - "backup device status IN {RESERVED, AVAILABLE}"
        side_effects:
          - "case.bypass_started_at = logical clock"
          - "primary device status RESERVED -> IN_USE"
          - "the covering CallRotationSlot (the same slot the assignment gate matched) transitions SCHEDULED -> ACTIVE when its status is SCHEDULED"
          - "perfusionist.consecutive_case_count_24h recomputed"
          - "increments BypassCase.version by 1"
      - from: ON_BYPASS
        to: OFF_BYPASS
        trigger: "POST /bypass-cases/{id}/end-bypass"
        actor: Perfusionist
        preconditions:
          - "case.bypass_status == ON_BYPASS"
          - "X-User-ID == case.assigned_perfusionist_id"
          - "payload.cross_clamp_minutes <= payload.pump_time_minutes"
        side_effects:
          - "case.bypass_ended_at = logical clock; case.pump_time_minutes, cross_clamp_minutes, lowest_hematocrit_pct, adverse_event_count stored from payload"
          - "primary device runtime_hours_since_service += payload.pump_time_minutes / 60 (exact, unrounded)"
          - "primary device status IN_USE -> AVAILABLE when alarm_count_since_service == 0 AND runtime_hours_since_service < service_interval_hours AND no other case still holds it in a reserving bypass_status, IN_USE -> RESERVED when the clean branch applies but another reserving case remains, else IN_USE -> NEEDS_SERVICE"
          - "backup device status RESERVED -> AVAILABLE"
          - "both devices' open_reservation_count recomputed"
          - "the covering CallRotationSlot transitions ACTIVE -> COMPLETED when no other BypassCase of that slot's perfusionist is still ON_BYPASS"
          - "increments BypassCase.version by 1"
      - from: OFF_BYPASS
        to: CLOSED
        trigger: "POST /bypass-cases/{id}/close"
        actor: ChiefPerfusionist
        preconditions:
          - "case.bypass_status == OFF_BYPASS"
          - "the case's DisposablePack has approval_status IN {NOT_REQUIRED, APPROVED}"
          - "no IncidentReport of this case has status IN {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED_FOR_INFO}"
          - "no EcmoRun of this case has status IN {RUNNING, RELIEF_PENDING}"
        side_effects:
          - "case.final_fee_cents = case_fee_settlement[variant=FINAL]"
          - "case.billing_status PROVISIONAL_ACCRUED -> FINAL_ACCRUED (parallel dimension B)"
          - "contract.accrued_case_fee_cents += (case.final_fee_cents - case.accrued_fee_cents); then case.accrued_fee_cents = case.final_fee_cents"
          - "assigned perfusionist career_case_count += 1, which re-derives that perfusionist's readiness_score under the ADMISSION variant"
          - "increments BypassCase.version by 1"
      - from: SCHEDULED | STAFFED | PACK_CONFIGURED | SETUP_VERIFIED
        to: CANCELLED
        trigger: "POST /bypass-cases/{id}/cancel"
        actor: ChiefPerfusionist
        preconditions:
          - "case.bypass_status IN {SCHEDULED, STAFFED, PACK_CONFIGURED, SETUP_VERIFIED}"
          - "no EcmoRun of this case has status IN {RUNNING, RELIEF_PENDING}"
        side_effects:
          - "compensation of the accrual: if case.billing_status == PROVISIONAL_ACCRUED then contract.accrued_case_fee_cents -= case.accrued_fee_cents and contract.accrued_case_count -= 1"
          - "case.billing_status set to UNBILLED; case.accrued_fee_cents = 0"
          - "compensation of the reservations: primary and backup devices whose status == RESERVED move back to AVAILABLE; their open_reservation_count recomputed"
          - "every PumpChecklist of this case with status IN {DRAFT, VERIFIED} moves to INVALIDATED with blood_mgmt_signoff = false"
          - "case.readiness_flag = NONE; case.setup_verified_at = null"
          - "increments BypassCase.version by 1"
      - from: STAFFED | PACK_CONFIGURED | SETUP_VERIFIED
        to: STAFFED
        trigger: "system cascade, link 2 of critical_alarm cascade: a PerfusionDevice this case holds as primary_device_id enters NEEDS_SERVICE"
        actor: system
        preconditions:
          - "case.primary_device_id == the device that just entered NEEDS_SERVICE"
          - "case.bypass_status IN {PACK_CONFIGURED, SETUP_VERIFIED}"
        side_effects:
          - "case.bypass_status set to STAFFED; case.setup_verified_at = null"
          - "case.readiness_flag = DEVICE_FALLBACK_REQUIRED"
          - "case.primary_device_id = null; case.backup_device_id = null; the backup device moves RESERVED -> AVAILABLE"
          - "link 3 fires: every PumpChecklist of this case with status IN {DRAFT, VERIFIED} moves to INVALIDATED"
          - "increments BypassCase.version by 1"
        note: "Cases in bypass_status == ON_BYPASS are deliberately NOT reverted; an alarm mid-run is handled by the incident pathway, not by unwinding the case."

  # ---------------------------------------------------------------------------
  # Parallel dimension B of BypassCase: the fiscal pathway. Its triggers are
  # disjoint from dimension A's, so a case can sit in (STAFFED, UNBILLED),
  # (STAFFED, PROVISIONAL_ACCRUED) or (CLOSED, INVOICED) independently.
  # ---------------------------------------------------------------------------
  - entity: BypassCase
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: [CREDITED]
    transitions:
      - from: UNBILLED
        to: PROVISIONAL_ACCRUED
        trigger: "POST /bypass-cases/{id}/assign-perfusionist"
        actor: ChiefPerfusionist
        preconditions:
          - "case.billing_status == UNBILLED"
          - "contract.accrued_case_count < contract.monthly_case_cap"
        side_effects:
          - "case.accrued_fee_cents = case.provisional_fee_cents"
          - "contract.accrued_case_fee_cents += case.accrued_fee_cents; contract.accrued_case_count += 1"
      - from: PROVISIONAL_ACCRUED
        to: PROVISIONAL_ACCRUED
        trigger: "POST /bypass-cases/{id}/assign-perfusionist on an already STAFFED case"
        actor: ChiefPerfusionist
        preconditions:
          - "case.billing_status == PROVISIONAL_ACCRUED"
        side_effects:
          - "the outgoing accrual is withdrawn from contract.accrued_case_fee_cents and the recomputed provisional amount is added back; contract.accrued_case_count is unchanged"
      - from: PROVISIONAL_ACCRUED
        to: UNBILLED
        trigger: "system cascade, link 4 of critical_alarm cascade: a PumpChecklist of this case moved to INVALIDATED as link 3"
        actor: system
        preconditions:
          - "case.billing_status == PROVISIONAL_ACCRUED"
          - "the invalidation originated from the critical-alarm cascade, not from POST /bypass-cases/{id}/cancel (cancel performs its own compensation inline and therefore does not re-enter this transition)"
        side_effects:
          - "contract.accrued_case_fee_cents -= case.accrued_fee_cents; contract.accrued_case_count -= 1"
          - "case.accrued_fee_cents = 0"
      - from: PROVISIONAL_ACCRUED
        to: UNBILLED
        trigger: "POST /bypass-cases/{id}/cancel"
        actor: ChiefPerfusionist
        preconditions:
          - "case.billing_status == PROVISIONAL_ACCRUED"
        side_effects:
          - "contract.accrued_case_fee_cents -= case.accrued_fee_cents; contract.accrued_case_count -= 1; case.accrued_fee_cents = 0"
      - from: PROVISIONAL_ACCRUED
        to: FINAL_ACCRUED
        trigger: "POST /bypass-cases/{id}/close"
        actor: ChiefPerfusionist
        preconditions:
          - "case.billing_status == PROVISIONAL_ACCRUED"
          - "case.pump_time_minutes is not null"
        side_effects:
          - "case.accrued_fee_cents moves from provisional_fee_cents to final_fee_cents and contract.accrued_case_fee_cents absorbs exactly the delta"
      - from: FINAL_ACCRUED
        to: INVOICED
        trigger: "POST /hospital-contracts/{id}/settlement-runs"
        actor: ContractAdmin
        preconditions:
          - "case.billing_status == FINAL_ACCRUED"
          - "case.bypass_ended_at falls inside the half-open settlement period [period_start, period_end)"
        side_effects:
          - "case.billing_status set to INVOICED; case.accrued_fee_cents is left unchanged so contract.accrued_case_fee_cents is unaffected by invoicing"
          - "contract.last_settlement_period = payload.period"
      - from: INVOICED
        to: CREDITED
        trigger: "POST /incident-reports/{id}/close with payload.credit_case_fee == true"
        actor: ChiefPerfusionist
        preconditions:
          - "case.billing_status == INVOICED"
          - "the closing finding is SYSTEMIC"
        side_effects:
          - "contract.accrued_case_fee_cents -= case.accrued_fee_cents; case.accrued_fee_cents = 0"
          - "contract.accrued_case_count -= 1"

  # ---------------------------------------------------------------------------
  # PerfusionDevice: branching fork (IN_USE splits on service posture) plus a
  # maintenance cycle NEEDS_SERVICE -> AVAILABLE.
  # ---------------------------------------------------------------------------
  - entity: PerfusionDevice
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE | RESERVED
        to: RESERVED
        trigger: "POST /bypass-cases/{id}/disposable-packs (as primary or as resolved backup)"
        actor: Perfusionist | ChiefPerfusionist
        preconditions:
          - "device.status IN {AVAILABLE, RESERVED}"
          - "device.device_class == HEART_LUNG_MACHINE"
          - "device.contract_id == case.contract_id"
          - "the configuring case does not collide with any case already holding the device, under the buffered rule of validation priority 68"
        side_effects:
          - "device.open_reservation_count recomputed by device_reservation_ledger"
          - "increments PerfusionDevice.version by 1"
        note: "A machine may carry more than one open reservation at a time as long as the holding case windows clear the DEVICE_TURNAROUND_MINUTES buffer, which is why open_reservation_count is a count rather than a flag; the RESERVED -> RESERVED edge is that second reservation."
      - from: RESERVED
        to: IN_USE
        trigger: "POST /bypass-cases/{id}/start-bypass (primary device only)"
        actor: Perfusionist
        preconditions:
          - "device.status == RESERVED"
          - "device.id == case.primary_device_id"
        side_effects:
          - "increments PerfusionDevice.version by 1"
      - from: IN_USE
        to: AVAILABLE
        trigger: "POST /bypass-cases/{id}/end-bypass, clean branch with no remaining reservation"
        actor: Perfusionist
        preconditions:
          - "device.status == IN_USE"
          - "after adding pump_time_minutes / 60: device.alarm_count_since_service == 0 AND device.runtime_hours_since_service < device.service_interval_hours"
          - "after the recompute device.open_reservation_count == 0"
        side_effects:
          - "device.open_reservation_count recomputed"
          - "increments PerfusionDevice.version by 1"
      - from: IN_USE
        to: RESERVED
        trigger: "POST /bypass-cases/{id}/end-bypass, clean branch while another reserving case remains"
        actor: Perfusionist
        preconditions:
          - "device.status == IN_USE"
          - "after adding pump_time_minutes / 60: device.alarm_count_since_service == 0 AND device.runtime_hours_since_service < device.service_interval_hours"
          - "after the recompute device.open_reservation_count >= 1"
        side_effects:
          - "device.open_reservation_count recomputed"
          - "increments PerfusionDevice.version by 1"
        note: "Keeps the machine attached to its remaining future case instead of falsely advertising it as free."
      - from: IN_USE
        to: NEEDS_SERVICE
        trigger: "POST /bypass-cases/{id}/end-bypass, service-due branch"
        actor: Perfusionist
        preconditions:
          - "device.status == IN_USE"
          - "after adding pump_time_minutes / 60: device.alarm_count_since_service > 0 OR device.runtime_hours_since_service >= device.service_interval_hours"
        side_effects:
          - "append a DeviceEventLog with event_code == SELF_TEST_FAIL and detail 'service interval reached at end of case'"
          - "device.open_reservation_count recomputed"
          - "increments PerfusionDevice.version by 1"
        note: "Divergent side-effect set versus the clean branch: this branch additionally appends an event log and leaves the device unusable until a service completion."
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /bypass-cases/{id}/cancel, or system cascade link 2 releasing a backup device"
        actor: ChiefPerfusionist | system
        preconditions:
          - "device.status == RESERVED"
          - "the releasing case no longer holds the device in bypass_status IN {PACK_CONFIGURED, SETUP_VERIFIED, ON_BYPASS}"
          - "after the recompute device.open_reservation_count == 0"
        side_effects:
          - "device.open_reservation_count recomputed"
          - "increments PerfusionDevice.version by 1"
      - from: AVAILABLE | RESERVED | IN_USE
        to: NEEDS_SERVICE
        trigger: "POST /perfusion-devices/{id}/event-logs with event_code IN {ALARM_CRITICAL, SELF_TEST_FAIL}"
        actor: BiomedTech | Perfusionist
        preconditions:
          - "device.status IN {AVAILABLE, RESERVED, IN_USE}"
        side_effects:
          - "link 1: append DeviceEventLog; device.alarm_count_since_service += 1; device.status set to NEEDS_SERVICE"
          - "link 2 fires on every BypassCase whose primary_device_id == device.id and bypass_status IN {PACK_CONFIGURED, SETUP_VERIFIED}, processed in ascending scheduled_start then ascending created_at order"
          - "link 2b (the backup-side variant) fires on every BypassCase whose backup_device_id == device.id and bypass_status IN {PACK_CONFIGURED, SETUP_VERIFIED}: bypass_status and setup_verified_at are left untouched, case.backup_device_id = null and case.readiness_flag = DEVICE_FALLBACK_REQUIRED, so a verified setup that has lost its standby pump keeps its verification but is blocked at start-bypass by the priority 44 safety row"
          - "increments PerfusionDevice.version by 1"
      - from: NEEDS_SERVICE
        to: AVAILABLE
        trigger: "POST /perfusion-devices/{id}/service-completions"
        actor: BiomedTech
        preconditions:
          - "device.status == NEEDS_SERVICE"
          - "device.open_reservation_count == 0"
        side_effects:
          - "device.alarm_count_since_service = 0; device.runtime_hours_since_service = 0; device.last_service_completed_at = logical clock"
          - "append a DeviceEventLog with event_code == SERVICE_COMPLETED"
          - "increments PerfusionDevice.version by 1"
        note: "Closes the maintenance cycle; a device may traverse AVAILABLE -> NEEDS_SERVICE -> AVAILABLE any number of times."

  - entity: PumpChecklist
    initial_state: DRAFT
    terminal_states: [INVALIDATED]
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /pump-checklists/{id}/verify"
        actor: Perfusionist
        preconditions:
          - "checklist.status == DRAFT"
          - "checklist.missing_check_codes is empty; protocol matches the applied card; hematocrit_pct >= the card's min_hematocrit_pct"
        side_effects:
          - "blood_mgmt_signoff = true; verified_at = logical clock; verified_by_perfusionist_id = X-User-ID"
          - "the parent case moves PACK_CONFIGURED -> SETUP_VERIFIED"
          - "increments PumpChecklist.version by 1"
      - from: DRAFT | VERIFIED
        to: INVALIDATED
        trigger: "system cascade link 3 of critical_alarm cascade, or POST /bypass-cases/{id}/cancel"
        actor: system | ChiefPerfusionist
        preconditions:
          - "checklist.status IN {DRAFT, VERIFIED}"
        side_effects:
          - "blood_mgmt_signoff = false; verified_at = null"
          - "when the invalidation came from the cascade, link 4 fires on the parent case's billing dimension"
          - "increments PumpChecklist.version by 1"

  # ---------------------------------------------------------------------------
  # IncidentReport: cyclic (SUBMITTED -> RETURNED_FOR_INFO -> SUBMITTED) plus a
  # terminal fork with divergent side-effect sets.
  # ---------------------------------------------------------------------------
  - entity: IncidentReport
    initial_state: DRAFT
    terminal_states: [CLOSED_WITH_ACTION, CLOSED_NO_ACTION]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /incident-reports/{id}/submit"
        actor: Perfusionist | ChiefPerfusionist
        preconditions:
          - "report.status == DRAFT"
          - "X-User-ID == report.filed_by_perfusionist_id"
          - "the referenced case has bypass_status IN {OFF_BYPASS, CLOSED}"
        side_effects:
          - "increments IncidentReport.version by 1"
      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /incident-reports/{id}/submit (resubmission after a return)"
        actor: Perfusionist | ChiefPerfusionist
        preconditions:
          - "report.status == RETURNED_FOR_INFO"
          - "X-User-ID == report.filed_by_perfusionist_id"
          - "the referenced case has bypass_status IN {OFF_BYPASS, CLOSED}"
        side_effects:
          - "increments IncidentReport.version by 1"
        note: "Closes the review cycle: a report may traverse SUBMITTED -> RETURNED_FOR_INFO -> SUBMITTED up to MAX_INCIDENT_RETURNS times."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /incident-reports/{id}/review with payload.decision == ACCEPT_FOR_REVIEW"
        actor: ChiefPerfusionist
        preconditions:
          - "report.status == SUBMITTED"
          - "X-User-ID != report.involved_perfusionist_id"
          - "X-User-ID != report.filed_by_perfusionist_id"
        side_effects:
          - "report.reviewed_readiness_score = perfusionist_readiness_score[variant=AUDIT] evaluated for report.involved_perfusionist_id and frozen on the report"
          - "increments IncidentReport.version by 1"
      - from: SUBMITTED
        to: RETURNED_FOR_INFO
        trigger: "POST /incident-reports/{id}/review with payload.decision == RETURN_FOR_INFO"
        actor: ChiefPerfusionist
        preconditions:
          - "report.status == SUBMITTED"
          - "report.return_count < MAX_INCIDENT_RETURNS"
          - "X-User-ID != report.involved_perfusionist_id"
          - "X-User-ID != report.filed_by_perfusionist_id"
        side_effects:
          - "report.return_count += 1"
          - "report.reviewed_readiness_score is left untouched (a returned report has not been audited)"
          - "increments IncidentReport.version by 1"
        note: "Divergent side-effect set versus the ACCEPT_FOR_REVIEW branch of the same trigger."
      - from: UNDER_REVIEW
        to: CLOSED_WITH_ACTION
        trigger: "POST /incident-reports/{id}/close with payload.finding == SYSTEMIC"
        actor: ChiefPerfusionist
        preconditions:
          - "report.status == UNDER_REVIEW"
          - "X-User-ID != report.involved_perfusionist_id AND X-User-ID != report.filed_by_perfusionist_id"
          - "report.severity IN {MAJOR, SENTINEL} OR report.reviewed_readiness_score < READINESS_AUDIT_FLOOR"
        side_effects:
          - "link 1: report.finding = SYSTEMIC; report.corrective_action_required = true; report.closed_by_perfusionist_id = X-User-ID"
          - "link 2 fires: the involved perfusionist's Certification row with cert_code == CCP moves ACTIVE -> PROBATION when probation_count < 2, or PROBATION -> REVOKED when probation_count >= 2"
          - "when payload.credit_case_fee == true and the case billing_status == INVOICED, the case's billing dimension moves INVOICED -> CREDITED"
          - "increments IncidentReport.version by 1"
      - from: UNDER_REVIEW
        to: CLOSED_NO_ACTION
        trigger: "POST /incident-reports/{id}/close with payload.finding == ISOLATED"
        actor: ChiefPerfusionist
        preconditions:
          - "report.status == UNDER_REVIEW"
          - "X-User-ID != report.involved_perfusionist_id AND X-User-ID != report.filed_by_perfusionist_id"
        side_effects:
          - "report.finding = ISOLATED; report.corrective_action_required = false; report.closed_by_perfusionist_id = X-User-ID"
          - "no certification, slot or billing side effect fires on this branch"
          - "increments IncidentReport.version by 1"
        note: "Fork partner of CLOSED_WITH_ACTION with an intentionally empty cascade, so the branch choice is observable end to end."

  # ---------------------------------------------------------------------------
  # Certification: cyclic ACTIVE -> PROBATION -> ACTIVE with two exits.
  # ---------------------------------------------------------------------------
  - entity: Certification
    initial_state: ACTIVE
    terminal_states: [LAPSED, REVOKED]
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system cascade, link 2 of systemic_incident cascade: an IncidentReport naming this holder closed with finding == SYSTEMIC"
        actor: system
        preconditions:
          - "certification.cert_code == CCP"
          - "certification.status == ACTIVE"
          - "certification.probation_count < 2"
        side_effects:
          - "certification.remediation_credits_required = REMEDIATION_CREDIT_HOURS; certification.probation_credits_banked = 0; certification.probation_count += 1"
          - "link 3 fires: every CallRotationSlot of this holder with slot_type == PRIMARY_CALL, status == SCHEDULED and window_start > logical clock moves to RELEASED, processed in ascending window_start then ascending created_at order"
          - "increments Certification.version by 1"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /ce-activities/{id}/verification with payload.decision == VERIFIED, when the banked remediation credits reach the requirement"
        actor: ContractAdmin
        preconditions:
          - "certification.status == PROBATION"
          - "after banking the verified activity: certification.probation_credits_banked >= certification.remediation_credits_required"
        side_effects:
          - "certification.remediation_credits_required = 0; certification.probation_credits_banked = 0"
          - "increments Certification.version by 1"
        note: "Closes the credentialing cycle; a holder may re-enter PROBATION afterwards."
      - from: PROBATION
        to: REVOKED
        trigger: "system cascade, link 2 of systemic_incident cascade, when probation_count is already at or above 2"
        actor: system
        preconditions:
          - "certification.status == PROBATION"
          - "certification.probation_count >= 2"
        side_effects:
          - "link 3 fires exactly as for the PROBATION entry (future PRIMARY_CALL slots released)"
          - "increments Certification.version by 1"
      - from: ACTIVE | PROBATION
        to: LAPSED
        trigger: "POST /_clock/set_current_utc advancing the logical clock to or past certification.expires_on"
        actor: system
        preconditions:
          - "certification.status IN {ACTIVE, PROBATION}"
          - "the new logical clock value >= certification.expires_on"
        side_effects:
          - "certification.remediation_credits_required = 0"
          - "increments Certification.version by 1"
        note: "A LAPSED certification is terminal; renewal is modelled as a new Certification row created by POST /perfusionists/{id}/certifications."

  # ---------------------------------------------------------------------------
  # CeActivity: fork with divergent ledger effects, plus a revocation exit.
  # ---------------------------------------------------------------------------
  - entity: CeActivity
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /ce-activities/{id}/verification with payload.decision == VERIFIED"
        actor: ContractAdmin
        preconditions:
          - "activity.status == SUBMITTED"
        side_effects:
          - "holder.ce_credits_verified += activity.credit_hours; holder.ce_credits_pending -= activity.credit_hours (both re-derived by perfusionist_ce_ledger)"
          - "when the holder's CCP certification is in PROBATION: activity.counted_toward_remediation = true and certification.probation_credits_banked += activity.credit_hours, which may fire the PROBATION -> ACTIVE transition"
          - "increments CeActivity.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ce-activities/{id}/verification with payload.decision == REJECTED"
        actor: ContractAdmin
        preconditions:
          - "activity.status == SUBMITTED"
        side_effects:
          - "holder.ce_credits_pending -= activity.credit_hours; holder.ce_credits_verified unchanged"
          - "increments CeActivity.version by 1"
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /ce-activities/{id}/verification with payload.decision == REVOKED"
        actor: ContractAdmin
        preconditions:
          - "activity.status == VERIFIED"
        side_effects:
          - "compensation of the CE ledger: holder.ce_credits_verified -= activity.credit_hours"
          - "when activity.counted_toward_remediation == true: certification.probation_credits_banked -= activity.credit_hours"
          - "activity.counted_toward_remediation = false"
          - "increments CeActivity.version by 1"

  - entity: CallRotationSlot
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /bypass-cases/{id}/start-bypass (the slot that satisfied the assignment coverage gate), or POST /ecmo-runs/{id}/handoffs (the named ECMO_RELIEF slot)"
        actor: Perfusionist | ChiefPerfusionist
        preconditions:
          - "slot.status == SCHEDULED"
          - "the logical clock lies inside the half-open interval [slot.window_start, slot.window_end)"
        side_effects:
          - "for an ECMO_RELIEF slot: slot.consumed = true"
          - "increments CallRotationSlot.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /bypass-cases/{id}/end-bypass, or POST /ecmo-runs/{id}/decannulate"
        actor: Perfusionist
        preconditions:
          - "slot.status == ACTIVE"
          - "no BypassCase of this slot's perfusionist remains ON_BYPASS and no EcmoRun tied to this slot remains open"
        side_effects:
          - "increments CallRotationSlot.version by 1"
      - from: SCHEDULED
        to: RELEASED
        trigger: "system cascade, link 3 of systemic_incident cascade: the holder's CCP certification entered PROBATION or REVOKED"
        actor: system
        preconditions:
          - "slot.status == SCHEDULED"
          - "slot.slot_type == PRIMARY_CALL"
          - "slot.window_start > logical clock"
        side_effects:
          - "link 4 fires: contract_coverage_posture is recomputed for slot.contract_id, which may move HospitalContract.coverage_posture COVERED -> THIN -> UNCOVERED"
          - "increments CallRotationSlot.version by 1"

  - entity: EcmoRun
    initial_state: RUNNING
    terminal_states: [DECANNULATED]
    transitions:
      - from: RUNNING
        to: RELIEF_PENDING
        trigger: "POST /_clock/set_current_utc where uninterrupted_minutes reaches ECMO_RELIEF_WARN_MINUTES"
        actor: system
        preconditions:
          - "run.status == RUNNING"
          - "run.uninterrupted_minutes >= ECMO_RELIEF_WARN_MINUTES at the new clock value"
        side_effects:
          - "run.uninterrupted_minutes and run.staffing_breach re-derived"
          - "increments EcmoRun.version by 1"
      - from: RELIEF_PENDING
        to: RUNNING
        trigger: "POST /ecmo-runs/{id}/handoffs"
        actor: ChiefPerfusionist
        preconditions:
          - "run.status == RELIEF_PENDING"
          - "payload.relief_slot_id names a CallRotationSlot with slot_type == ECMO_RELIEF, status == SCHEDULED, consumed == false, contract_id == the case's contract_id, and the logical clock inside [window_start, window_end)"
          - "the slot's perfusionist has ecmo_privileged == true, employment_status == ACTIVE and id != run.primary_perfusionist_id"
        side_effects:
          - "run.primary_perfusionist_id = the relief slot's perfusionist_id; run.relief_slot_id = payload.relief_slot_id; run.last_handoff_at = logical clock"
          - "run.uninterrupted_minutes reset to 0 and run.staffing_breach re-derived as false"
          - "the named slot moves SCHEDULED -> ACTIVE with consumed = true"
          - "increments EcmoRun.version by 1"
        note: "Closes the ECMO staffing cycle; a long run alternates RUNNING -> RELIEF_PENDING -> RUNNING once per relief handoff."
      - from: RUNNING | RELIEF_PENDING
        to: DECANNULATED
        trigger: "POST /ecmo-runs/{id}/decannulate"
        actor: Perfusionist
        preconditions:
          - "run.status IN {RUNNING, RELIEF_PENDING}"
          - "X-User-ID == run.primary_perfusionist_id"
        side_effects:
          - "run.decannulated_at = logical clock; run.billable_hours and run.ecmo_fee_cents = ecmo_run_billing outputs"
          - "the run's relief_slot_id slot, when its status == ACTIVE, moves ACTIVE -> COMPLETED"
          - "primary perfusionist ecmo_hours_rolling_7d recomputed"
          - "increments EcmoRun.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: case-staffing-supersede
    parent_entity: BypassCase
    write_endpoint: "POST /bypass-cases/{id}/assign-perfusionist"
    occ_field: "expected_case_version"
    description: |
      Assigning a perfusionist to a BypassCase whose version has advanced since
      the client last read it is rejected. Reassignment is a legitimate product
      operation (STAFFED -> STAFFED supersedes the sitting assignment and
      re-accrues the provisional fee), so a writer holding a stale view of the
      case would otherwise silently overwrite an assignment it never saw. The
      rule reduces that to a stale-version check on BypassCase.version.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: contract-rate-update-stale
    parent_entity: HospitalContract
    write_endpoint: "PUT /hospital-contracts/{id}"
    occ_field: "expected_contract_version"
    description: |
      Updating a HospitalContract's commercial rates against a version that has
      advanced since the client last read it is rejected. Rate updates are
      unconditionally legitimate on their own, and the contract's version is
      also advanced by every case accrual cascade, so a stale-version writer
      would silently re-price cases it never observed.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: case_fee_settlement
    trigger: "PROVISIONAL variant on POST /bypass-cases/{id}/assign-perfusionist (both the SCHEDULED -> STAFFED and the STAFFED -> STAFFED supersede transitions); FINAL variant on POST /bypass-cases/{id}/close."
    algorithm: threshold
    formula: |
      # ---- variant-dependent minute source (the ONLY divergence) ------------
      IF variant == PROVISIONAL:
          minutes = selected_preference_card.standard_pump_minutes
          # selected_preference_card = the preference-card selector output for
          # (case.surgeon_id, case.procedure_type); see calculation
          # preference_card_selector semantics inside disposable_pack_cost.
      ELSE:  # variant == FINAL
          minutes = case.pump_time_minutes

      # ---- prolonged-perfusion surcharge units -----------------------------
      IF minutes < contract.prolonged_pump_threshold_minutes:
          prolonged_units = 0
      ELSE:
          prolonged_units = FLOOR((minutes - contract.prolonged_pump_threshold_minutes)
                                  / PROLONGED_UNIT_MINUTES) + 1
      # Boundary is inclusive: minutes == threshold yields prolonged_units == 1,
      # minutes == threshold - 1 yields 0.

      surcharge_pct = prolonged_units * contract.prolonged_surcharge_pct

      # ---- acuity uplift ---------------------------------------------------
      acuity_pct = ACUITY_UPLIFT_PCT[case.acuity]

      # ---- single rounding at the end --------------------------------------
      fee_cents = ROUND_HALF_UP(contract.per_case_fee_cents
                                * (1 + acuity_pct + surcharge_pct))
      RETURN fee_cents
    input_set: |
      One HospitalContract (case.contract_id) supplies per_case_fee_cents,
      prolonged_pump_threshold_minutes and prolonged_surcharge_pct. The minute
      source is the ACTIVE PreferenceCard selected for (surgeon_id,
      procedure_type) for PROVISIONAL, and the case's own reported
      pump_time_minutes for FINAL. Cancelled cases are never settled.
    constants:
      PROLONGED_UNIT_MINUTES: 30
      ACUITY_UPLIFT_PCT: { ELECTIVE: 0.00, URGENT: 0.10, EMERGENT: 0.25 }
    precision: "integer cents, round_half_up, applied exactly once to the fully multiplied product (never per term)"
    variants:
      - name: PROVISIONAL
        when: "At assignment time, when no actual pump time exists yet; written to BypassCase.provisional_fee_cents and accrued as PROVISIONAL_ACCRUED."
        difference: "Uses the preference card's standard_pump_minutes as the minute source; ignores case.pump_time_minutes even if somehow present."
      - name: FINAL
        when: "At case close, once end-bypass has reported the actual pump time; written to BypassCase.final_fee_cents and accrued as FINAL_ACCRUED."
        difference: "Uses case.pump_time_minutes as the minute source, so identical contract and acuity data yield a different fee whenever the actual pump time lands in a different prolonged-unit bucket than the card's standard time. The close transition posts only the delta (final - accrued) to the contract ledger."

  - name: perfusionist_readiness_score
    trigger: "ADMISSION variant on POST /bypass-cases/{id}/assign-perfusionist (before the state change, as an admission gate) and again after POST /bypass-cases/{id}/close increments career_case_count; AUDIT variant on POST /incident-reports/{id}/review with decision == ACCEPT_FOR_REVIEW."
    algorithm: weighted_scoring
    formula: |
      cert = the Perfusionist's Certification row with cert_code == CCP and the
             greatest issued_on; ties broken by the greater created_at.
      window = [cert.issued_on, cert.expires_on)   # half-open

      IF variant == ADMISSION:
          credits = perfusionist.ce_credits_verified + perfusionist.ce_credits_pending
      ELSE:  # variant == AUDIT
          credits = perfusionist.ce_credits_verified

      credit_ratio     = MIN(1.0, credits / cert.cycle_credit_requirement)
      experience_ratio = MIN(1.0, perfusionist.career_case_count
                                  / READINESS_EXPERIENCE_TARGET)
      fatigue_penalty  = FATIGUE_CASE_WEIGHT * perfusionist.consecutive_case_count_24h
                       + FATIGUE_ECMO_WEIGHT * perfusionist.ecmo_hours_rolling_7d

      raw   = CREDIT_WEIGHT * credit_ratio
            + EXPERIENCE_WEIGHT * experience_ratio
            - fatigue_penalty
      score = ROUND_HALF_UP(MAX(0.0, MIN(1.0, raw)), 3)
      RETURN score
    input_set: |
      CeActivity rows of this perfusionist whose activity_date falls inside the
      half-open certification window: status == VERIFIED rows feed
      ce_credits_verified, status == SUBMITTED rows feed ce_credits_pending, and
      REJECTED / REVOKED rows are excluded from both. BypassCase rows with
      bypass_started_at inside [clock - 24h, clock) feed the fatigue case term;
      EcmoRun rows with cannulated_at inside [clock - 168h, clock) feed the
      fatigue ECMO term.
    constants:
      CREDIT_WEIGHT: 0.55
      EXPERIENCE_WEIGHT: 0.45
      READINESS_EXPERIENCE_TARGET: 150
      FATIGUE_CASE_WEIGHT: 0.08
      FATIGUE_ECMO_WEIGHT: 0.02
      READINESS_MIN_ADMISSION: 0.600
      READINESS_AUDIT_FLOOR: 0.550
    precision: "3 decimal places, round_half_up, applied once after clamping to [0, 1]"
    variants:
      - name: ADMISSION
        when: "Assignment-time admission gate; the computed value is compared against READINESS_MIN_ADMISSION and stored on Perfusionist.readiness_score with readiness_variant_last = ADMISSION."
        difference: "Counts SUBMITTED (not yet verified) CE credits alongside VERIFIED ones — the group admits a perfusionist on the strength of claimed education."
      - name: AUDIT
        when: "Quality-review audit at incident accept-for-review; the value is frozen on IncidentReport.reviewed_readiness_score and compared against READINESS_AUDIT_FLOOR by the systemic-finding gate."
        difference: "Counts VERIFIED CE credits only, so the same perfusionist with unverified claims scores strictly lower under AUDIT than under ADMISSION; the delta is exactly CREDIT_WEIGHT * (ce_credits_pending / cycle_credit_requirement) before clamping."

  - name: disposable_pack_cost
    trigger: "POST /bypass-cases/{id}/disposable-packs, over the materialised DisposablePack.line_items."
    algorithm: aggregation
    formula: |
      # ---- preference-card selector (deterministic, no id involved) ---------
      candidates = PreferenceCard rows WHERE surgeon_id == case.surgeon_id
                   AND procedure_type == case.procedure_type
                   AND status == ACTIVE
      IF candidates is empty: reject with ERR_NO_ACTIVE_PREFERENCE_CARD
      selected = candidates ordered by revision DESC, then created_at DESC,
                 take first

      # ---- materialise the lines ------------------------------------------
      lines = []
      FOR each template IN selected.pack_line_items:
          sub = the substitutions element whose line_code == template.line_code, or none
          IF sub exists:
              unit  = sub.replacement_unit_cost_cents
              code  = sub.replacement_code
              flag  = true
          ELSE:
              unit  = template.unit_cost_cents
              code  = template.line_code
              flag  = false
          lines.append({ line_code: code, quantity: template.quantity,
                         unit_cost_cents: unit, substituted: flag })
      lines = lines ordered by line_code ASC

      # ---- per-line money, rounded PER LINE then summed --------------------
      pack_cost_cents = 0
      FOR each line IN lines:
          gross      = line.quantity * line.unit_cost_cents
          discounted = gross * (1 - contract.disposable_discount_pct)
          marked     = discounted * (1 + contract.disposable_markup_pct)
          line.line_total_cents = ROUND_HALF_UP(marked)     # <-- rounding point
          pack_cost_cents += line.line_total_cents
      RETURN pack_cost_cents
    input_set: |
      Exactly one PreferenceCard (the selector output, pinned onto
      DisposablePack.applied_preference_card_id) and the request's substitutions
      array. SUPERSEDED cards are excluded from the candidate set, so a pack
      built before a card revision keeps its own pinned card and cost.
    constants:
      MAX_SUBSTITUTIONS_PER_PACK: 6
    precision: |
      integer cents, round_half_up, applied once PER LINE and never to the
      aggregate. Rounding the sum of unrounded line values is a different
      number whenever two or more lines carry fractional remainders, and the
      per-line result is normative.
    variants: []

  - name: contract_monthly_settlement
    trigger: "POST /hospital-contracts/{id}/settlement-runs."
    algorithm: tiered_pricing
    formula: |
      period_start = first instant of payload.period (YYYY-MM), UTC
      period_end   = first instant of the following month, UTC   # half-open

      case_fee_gross_cents = SUM(case.final_fee_cents) OVER BypassCase rows
          WHERE contract_id == contract.id AND billing_status == FINAL_ACCRUED
          AND bypass_ended_at IN [period_start, period_end)

      ecmo_gross_cents = SUM(run.ecmo_fee_cents) OVER EcmoRun rows whose case
          belongs to this contract WHERE run.status == DECANNULATED
          AND run.decannulated_at IN [period_start, period_end)

      IF contract.staffing_model IN {COVERAGE_PLUS_PER_CASE, FULL_COVERAGE}:
          coverage_fee_cents = contract.monthly_coverage_fee_cents
      ELSE:
          coverage_fee_cents = 0

      # ---- the tier key is the PRE-credit gross ---------------------------
      pre_credit_gross_cents = case_fee_gross_cents + ecmo_gross_cents
                             + coverage_fee_cents

      volume_credit_pct = 0.00
      IF pre_credit_gross_cents >= VOLUME_TIER_1_CENTS: volume_credit_pct = 0.03
      IF pre_credit_gross_cents >= VOLUME_TIER_2_CENTS: volume_credit_pct = 0.06

      volume_credit_cents  = ROUND_HALF_UP(pre_credit_gross_cents * volume_credit_pct)
      quality_credit_cents = QUALITY_CREDIT_PER_SYSTEMIC_CENTS
          * COUNT(IncidentReport rows of this contract's cases WHERE
                  finding == SYSTEMIC AND updated_at IN [period_start, period_end))

      net_settlement_cents = MAX(0, pre_credit_gross_cents
                                    - volume_credit_cents
                                    - quality_credit_cents)
      RETURN { pre_credit_gross_cents, volume_credit_pct, volume_credit_cents,
               quality_credit_cents, net_settlement_cents }
    input_set: |
      Only FINAL_ACCRUED cases whose bypass_ended_at falls in the half-open
      period are settled (PROVISIONAL_ACCRUED, INVOICED and CREDITED cases are
      excluded), and only DECANNULATED ECMO runs. The tier is selected from the
      pre-credit gross, so applying the volume and quality credits can carry
      the net below the tier boundary without re-tiering.
    constants:
      VOLUME_TIER_1_CENTS: 5000000
      VOLUME_TIER_2_CENTS: 10000000
      QUALITY_CREDIT_PER_SYSTEMIC_CENTS: 150000
    precision: "integer cents, round_half_up on the volume credit only; the net is an exact integer subtraction floored at 0"
    variants: []

  - name: ecmo_run_billing
    trigger: "POST /ecmo-runs/{id}/decannulate."
    algorithm: threshold
    formula: |
      total_minutes  = MINUTES_BETWEEN(run.cannulated_at, run.decannulated_at)
      billable_hours = CEILING(total_minutes / 60)

      mode_pct = ECMO_MODE_UPLIFT_PCT[run.mode]

      IF billable_hours <= ECMO_PROLONGED_HOUR_THRESHOLD:
          prolonged_pct = 0.0
      ELSE:
          prolonged_pct = contract.prolonged_surcharge_pct
                          * (billable_hours - ECMO_PROLONGED_HOUR_THRESHOLD)

      ecmo_fee_cents = ROUND_HALF_UP(billable_hours * contract.ecmo_hourly_fee_cents
                                     * (1 + mode_pct + prolonged_pct))
      RETURN { billable_hours, ecmo_fee_cents }
    input_set: |
      A single EcmoRun that has just reached DECANNULATED, priced against the
      HospitalContract of its parent BypassCase. Runs still RUNNING or
      RELIEF_PENDING carry ecmo_fee_cents == 0 and are excluded from settlement.
    constants:
      ECMO_MODE_UPLIFT_PCT: { VV: 0.00, VA: 0.15, VAV: 0.30 }
      ECMO_PROLONGED_HOUR_THRESHOLD: 24
      ECMO_RELIEF_WARN_MINUTES: 600
      ECMO_MAX_UNINTERRUPTED_MINUTES: 720
    precision: "billable_hours is an integer ceiling of minutes/60; ecmo_fee_cents is integer cents, round_half_up applied once"
    variants: []

  - name: contract_coverage_posture
    trigger: "POST /call-rotation-slots, POST /_clock/set_current_utc, and link 4 of the systemic_incident cascade (a PRIMARY_CALL slot released)."
    algorithm: interval_merge
    formula: |
      horizon_start = logical clock
      horizon_end   = logical clock + COVERAGE_HORIZON_HOURS hours
      horizon_minutes = COVERAGE_HORIZON_HOURS * 60

      FOR each kind IN {PRIMARY_CALL, BACKUP_CALL}:
          raw = CallRotationSlot rows WHERE contract_id == contract.id
                AND slot_type == kind AND status IN {SCHEDULED, ACTIVE}
          intervals = [ INTERSECT([s.window_start, s.window_end),
                                  [horizon_start, horizon_end))
                        for s IN raw ]  # drop empty intersections
          intervals = intervals ordered by start ASC, then end ASC
          merged = []
          FOR each iv IN intervals:
              IF merged is empty OR iv.start > merged.last.end:
                  merged.append(iv)                      # disjoint: preserved
              ELSE:
                  merged.last.end = MAX(merged.last.end, iv.end)
              # iv.start == merged.last.end (gap 0, half-open adjacency) merges
          covered[kind] = SUM(minutes of each interval in merged)

      IF covered[PRIMARY_CALL] == horizon_minutes
         AND covered[BACKUP_CALL] >= horizon_minutes * BACKUP_COVERAGE_MIN_RATIO:
          posture = COVERED
      ELSE IF covered[PRIMARY_CALL] >= horizon_minutes * THIN_PRIMARY_MIN_RATIO:
          posture = THIN
      ELSE:
          posture = UNCOVERED
      RETURN posture
    input_set: |
      Only SCHEDULED and ACTIVE PRIMARY_CALL / BACKUP_CALL slots of this
      contract count; COMPLETED and RELEASED slots and every ECMO_RELIEF slot
      are excluded. Windows are clipped to the rolling horizon before merging,
      so a slot that starts before the clock contributes only its remaining
      minutes.
    constants:
      COVERAGE_HORIZON_HOURS: 72
      BACKUP_COVERAGE_MIN_RATIO: 0.50
      THIN_PRIMARY_MIN_RATIO: 0.50
    precision: "integer minutes; ratio comparisons use exact rational arithmetic on minute counts, no rounding"
    variants: []

  - name: perfusionist_ce_ledger
    trigger: "POST /perfusionists/{id}/ce-activities and POST /ce-activities/{id}/verification (all three decisions)."
    algorithm: aggregation
    formula: |
      cert = the holder's Certification row with cert_code == CCP and the
             greatest issued_on; ties broken by the greater created_at.
      window = [cert.issued_on, cert.expires_on)

      ce_credits_verified = ROUND_HALF_UP(SUM(a.credit_hours) OVER CeActivity a
          WHERE a.perfusionist_id == holder.id AND a.status == VERIFIED
          AND a.activity_date IN window, 1)

      ce_credits_pending  = ROUND_HALF_UP(SUM(a.credit_hours) OVER CeActivity a
          WHERE a.perfusionist_id == holder.id AND a.status == SUBMITTED
          AND a.activity_date IN window, 1)

      # remediation sub-ledger, only while the CCP cert is in PROBATION
      cert.probation_credits_banked = ROUND_HALF_UP(SUM(a.credit_hours)
          OVER CeActivity a WHERE a.perfusionist_id == holder.id
          AND a.status == VERIFIED AND a.counted_toward_remediation == true, 1)
      RETURN { ce_credits_verified, ce_credits_pending, probation_credits_banked }
    input_set: |
      CeActivity rows of one holder whose activity_date lies inside the current
      CCP certification window. REJECTED and REVOKED rows contribute to neither
      total, which is what makes the ledger self-compensating: VERIFY then
      REVOKE of the same activity returns ce_credits_verified to its prior value
      exactly, with no drift from the 1-decimal rounding because every
      credit_hours input already carries at most 1 decimal place.
    constants:
      REMEDIATION_CREDIT_HOURS: 8
    precision: "1 decimal place, round_half_up"
    variants: []

  - name: device_reservation_ledger
    trigger: "POST /bypass-cases/{id}/disposable-packs, POST /bypass-cases/{id}/start-bypass, POST /bypass-cases/{id}/end-bypass, POST /bypass-cases/{id}/cancel, POST /perfusion-devices/{id}/event-logs (critical branch), POST /perfusion-devices/{id}/service-completions."
    algorithm: aggregation
    formula: |
      open_reservation_count(device) = COUNT(BypassCase c
          WHERE (c.primary_device_id == device.id
                 OR c.backup_device_id == device.id)
          AND c.bypass_status IN {PACK_CONFIGURED, SETUP_VERIFIED, ON_BYPASS})
      # Recomputed from scratch on every trigger — never incremented blindly —
      # so the count is a pure function of live case rows.
    input_set: |
      BypassCase rows currently holding the device in either role and sitting in
      a reserving bypass_status. Cases in SCHEDULED, STAFFED, OFF_BYPASS, CLOSED
      or CANCELLED never contribute, which is exactly why configure-then-cancel
      and configure-then-critical-alarm both return the count to its prior value.
    constants:
      DEVICE_TURNAROUND_MINUTES: 90
      MAX_CONCURRENT_STAFFED_CASES: 2
    precision: "exact integer count, no rounding"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins when a
# single request violates several rows)
# =============================================================================
validations:

  # ---- authentication and authorization (1-5) -------------------------------
  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role headers are present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five roles declared in section 1.7."
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "The supplied role appears in the called endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "For an entity-backed role (ChiefPerfusionist, Perfusionist, Surgeon) X-User-ID resolves to an existing row of the backing entity."
    error_id: ERR_ACTOR_NOT_FOUND
    http_status: 403
    applies_to: "all endpoints whose roles include ChiefPerfusionist, Perfusionist or Surgeon"
  - priority: 5
    category: auth
    check: "When X-User-Role == ChiefPerfusionist the resolved Perfusionist has is_chief == true."
    error_id: ERR_NOT_CHIEF_PERFUSIONIST
    http_status: 403
    applies_to: "all endpoints whose roles include ChiefPerfusionist"

  # ---- request shape (6-8) --------------------------------------------------
  - priority: 6
    category: business_constraint
    check: "Every field the endpoint's input list marks as required is present and non-null."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PUT endpoints"
  - priority: 7
    category: business_constraint
    check: "Every supplied field satisfies its section 1.1 type, enum membership, range, length and array-cardinality constraints."
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: "all POST and PUT endpoints"
  - priority: 8
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0."
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all collection GET endpoints"

  # ---- existence, path ids left-to-right then body FKs (9-20) ---------------
  - priority: 9
    category: existence
    check: "The HospitalContract named by the path id or by contract_id exists."
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "GET/PUT /hospital-contracts/{id}, POST /hospital-contracts/{id}/settlement-runs, POST /perfusion-devices, POST /call-rotation-slots, POST /bypass-cases"
  - priority: 10
    category: existence
    check: "The Surgeon named by surgeon_id exists."
    error_id: ERR_SURGEON_NOT_FOUND
    http_status: 404
    applies_to: "POST /preference-cards, POST /bypass-cases"
  - priority: 11
    category: existence
    check: "The PreferenceCard named by the path id exists."
    error_id: ERR_PREFERENCE_CARD_NOT_FOUND
    http_status: 404
    applies_to: "GET /preference-cards/{id}"
  - priority: 12
    category: existence
    check: "The Perfusionist named by the path id, by perfusionist_id or by involved_perfusionist_id exists."
    error_id: ERR_PERFUSIONIST_NOT_FOUND
    http_status: 404
    applies_to: "GET /perfusionists/{id}, GET /perfusionists/{id}/certifications, GET /perfusionists/{id}/ce-activities, POST /perfusionists/{id}/certifications, POST /perfusionists/{id}/ce-activities, POST /call-rotation-slots, POST /bypass-cases/{id}/assign-perfusionist, POST /incident-reports"
  - priority: 13
    category: existence
    check: "The CeActivity named by the path id exists."
    error_id: ERR_CE_ACTIVITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /ce-activities/{id}/verification"
  - priority: 14
    category: existence
    check: "The PerfusionDevice named by the path id, by backup_device_id, by primary_device_id or by the request's backup_device_id exists."
    error_id: ERR_DEVICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /perfusion-devices/{id}, GET /perfusion-devices/{id}/event-logs, POST /perfusion-devices, POST /perfusion-devices/{id}/event-logs, POST /perfusion-devices/{id}/service-completions, POST /bypass-cases/{id}/disposable-packs"
  - priority: 15
    category: existence
    check: "The CallRotationSlot named by the path id or by relief_slot_id exists."
    error_id: ERR_ROTATION_SLOT_NOT_FOUND
    http_status: 404
    applies_to: "GET /call-rotation-slots/{id}, POST /ecmo-runs/{id}/handoffs"
  - priority: 16
    category: existence
    check: "The BypassCase named by the path id or by case_id exists."
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /bypass-cases/{id}, all POST /bypass-cases/{id}/* endpoints, POST /incident-reports"
  - priority: 17
    category: existence
    check: "The DisposablePack named by the path id exists."
    error_id: ERR_PACK_NOT_FOUND
    http_status: 404
    applies_to: "GET /disposable-packs/{id}, POST /disposable-packs/{id}/approve"
  - priority: 18
    category: existence
    check: "The PumpChecklist named by the path id exists."
    error_id: ERR_CHECKLIST_NOT_FOUND
    http_status: 404
    applies_to: "GET /pump-checklists/{id}, POST /pump-checklists/{id}/verify"
  - priority: 19
    category: existence
    check: "The EcmoRun named by the path id exists."
    error_id: ERR_ECMO_RUN_NOT_FOUND
    http_status: 404
    applies_to: "GET /ecmo-runs/{id}, POST /ecmo-runs/{id}/handoffs, POST /ecmo-runs/{id}/decannulate"
  - priority: 20
    category: existence
    check: "The IncidentReport named by the path id exists."
    error_id: ERR_INCIDENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /incident-reports/{id}, POST /incident-reports/{id}/submit, POST /incident-reports/{id}/review, POST /incident-reports/{id}/close"

  # ---- ownership and segregation of duties (21-23) --------------------------
  - priority: 21
    category: auth
    check: "When X-User-Role == Surgeon, X-User-ID equals the surgeon_id of the PreferenceCard being created, or the surgeon_id of the BypassCase whose DisposablePack is being approved."
    error_id: ERR_NOT_CARD_OWNER
    http_status: 403
    applies_to: "POST /preference-cards, POST /disposable-packs/{id}/approve"
  - priority: 22
    category: auth
    check: "X-User-ID equals the case's assigned_perfusionist_id (for checklist verification, start-bypass, end-bypass and ECMO run creation) or the run's primary_perfusionist_id (for decannulation)."
    error_id: ERR_NOT_ASSIGNED_PERFUSIONIST
    http_status: 403
    applies_to: "POST /pump-checklists/{id}/verify, POST /bypass-cases/{id}/start-bypass, POST /bypass-cases/{id}/end-bypass, POST /bypass-cases/{id}/ecmo-runs, POST /ecmo-runs/{id}/decannulate"
  - priority: 23
    category: auth
    check: "The reviewing or closing X-User-ID differs from both report.involved_perfusionist_id and report.filed_by_perfusionist_id; and the submitting X-User-ID equals report.filed_by_perfusionist_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /incident-reports/{id}/submit, POST /incident-reports/{id}/review, POST /incident-reports/{id}/close"

  # ---- optimistic concurrency (24-25) --------------------------------------
  - priority: 24
    category: state
    check: "payload.expected_case_version equals the BypassCase's current version."
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /bypass-cases/{id}/assign-perfusionist"
  - priority: 25
    category: state
    check: "payload.expected_contract_version equals the HospitalContract's current version."
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "PUT /hospital-contracts/{id}"

  # ---- state preconditions (26-40) ----------------------------------------
  - priority: 26
    category: state
    check: "case.bypass_status IN {SCHEDULED, STAFFED}."
    error_id: ERR_CASE_NOT_ASSIGNABLE
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/assign-perfusionist"
  - priority: 27
    category: state
    check: "case.bypass_status == STAFFED."
    error_id: ERR_CASE_NOT_STAFFED
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/disposable-packs"
  - priority: 28
    category: state
    check: "case.bypass_status == PACK_CONFIGURED."
    error_id: ERR_CASE_NOT_PACK_CONFIGURED
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/pump-checklists, POST /pump-checklists/{id}/verify"
  - priority: 29
    category: state
    check: "checklist.status == DRAFT."
    error_id: ERR_CHECKLIST_NOT_DRAFT
    http_status: 409
    applies_to: "POST /pump-checklists/{id}/verify"
  - priority: 30
    category: state
    check: "case.bypass_status == SETUP_VERIFIED."
    error_id: ERR_CASE_NOT_SETUP_VERIFIED
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/start-bypass"
    note: "Deliberately ordered ABOVE the readiness_flag safety row at priority 44, so a case stripped by the critical-alarm cascade reports the state error, not the fallback error."
  - priority: 31
    category: state
    check: "case.bypass_status == ON_BYPASS."
    error_id: ERR_CASE_NOT_ON_BYPASS
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/end-bypass, POST /bypass-cases/{id}/ecmo-runs"
  - priority: 32
    category: state
    check: "case.bypass_status == OFF_BYPASS."
    error_id: ERR_CASE_NOT_OFF_BYPASS
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/close"
  - priority: 33
    category: state
    check: "case.bypass_status IN {SCHEDULED, STAFFED, PACK_CONFIGURED, SETUP_VERIFIED}."
    error_id: ERR_CASE_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/cancel"
  - priority: 34
    category: state
    check: "The primary device and the resolved backup device each have status IN {AVAILABLE, RESERVED}; a machine that is IN_USE or NEEDS_SERVICE cannot be picked up, while a machine merely RESERVED for another case passes here and is filtered on window grounds by the turnaround row at priority 68."
    error_id: ERR_DEVICE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/disposable-packs"
  - priority: 35
    category: state
    check: "device.status == NEEDS_SERVICE and device.open_reservation_count == 0."
    error_id: ERR_DEVICE_SERVICE_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /perfusion-devices/{id}/service-completions"
  - priority: 36
    category: state
    check: "report.status is in the from-set of the requested incident transition: DRAFT or RETURNED_FOR_INFO for submit, SUBMITTED for review, UNDER_REVIEW for close."
    error_id: ERR_INCIDENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /incident-reports/{id}/submit, POST /incident-reports/{id}/review, POST /incident-reports/{id}/close"
  - priority: 37
    category: state
    check: "report.return_count < MAX_INCIDENT_RETURNS when decision == RETURN_FOR_INFO."
    error_id: ERR_INCIDENT_RETURN_LIMIT
    http_status: 409
    applies_to: "POST /incident-reports/{id}/review"
  - priority: 38
    category: state
    check: "run.status == RELIEF_PENDING for a handoff; run.status IN {RUNNING, RELIEF_PENDING} for a decannulation."
    error_id: ERR_ECMO_RUN_STATE_INVALID
    http_status: 409
    applies_to: "POST /ecmo-runs/{id}/handoffs, POST /ecmo-runs/{id}/decannulate"
  - priority: 39
    category: state
    check: "activity.status == SUBMITTED for decision IN {VERIFIED, REJECTED}; activity.status == VERIFIED for decision == REVOKED."
    error_id: ERR_CE_ACTIVITY_STATE_INVALID
    http_status: 409
    applies_to: "POST /ce-activities/{id}/verification"
  - priority: 40
    category: state
    check: "pack.approval_status == PENDING."
    error_id: ERR_PACK_APPROVAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /disposable-packs/{id}/approve"

  # ---- business safety and clinical compliance (41-54) ---------------------
  - priority: 41
    category: business_safety
    check: "The perfusionist's Certification row with cert_code == CCP exists and has status IN {ACTIVE, PROBATION}."
    error_id: ERR_CERTIFICATION_NOT_CURRENT
    http_status: 422
    applies_to: "POST /bypass-cases/{id}/assign-perfusionist"
    note: "Deliberately ordered ABOVE the fiscal case-cap row at priority 72: clinical credentialing outranks contract economics."
  - priority: 42
    category: business_safety
    check: "perfusionist.employment_status == ACTIVE."
    error_id: ERR_PERFUSIONIST_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /call-rotation-slots, POST /bypass-cases/{id}/assign-perfusionist, POST /ecmo-runs/{id}/handoffs"
  - priority: 43
    category: business_safety
    check: "perfusionist_readiness_score[variant=ADMISSION] >= READINESS_MIN_ADMISSION."
    error_id: ERR_READINESS_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /bypass-cases/{id}/assign-perfusionist"
  - priority: 44
    category: business_safety
    check: "case.readiness_flag == NONE."
    error_id: ERR_DEVICE_FALLBACK_REQUIRED
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/start-bypass"
    note: "Reached on its own through the backup-side alarm (link 2b), which raises the flag while the case stays SETUP_VERIFIED so the priority 30 state row passes; when the alarm hits the primary device instead, priority 30 fires first and masks this row."
  - priority: 45
    category: business_safety
    check: "checklist.missing_check_codes is the empty array, i.e. every code in the applied preference card's required_safety_check_codes appears in check_results with passed == true."
    error_id: ERR_SAFETY_CHECKS_INCOMPLETE
    http_status: 422
    applies_to: "POST /pump-checklists/{id}/verify"
  - priority: 46
    category: business_safety
    check: "checklist.blood_management_protocol equals the applied preference card's blood_management_protocol."
    error_id: ERR_BLOOD_PROTOCOL_MISMATCH
    http_status: 422
    applies_to: "POST /pump-checklists/{id}/verify"
  - priority: 47
    category: business_safety
    check: "checklist.hematocrit_pct >= the applied preference card's min_hematocrit_pct."
    error_id: ERR_HEMATOCRIT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /pump-checklists/{id}/verify"
  - priority: 48
    category: business_safety
    check: "The case's DisposablePack has approval_status IN {NOT_REQUIRED, APPROVED}."
    error_id: ERR_PACK_APPROVAL_PENDING
    http_status: 409
    applies_to: "POST /pump-checklists/{id}/verify, POST /bypass-cases/{id}/close"
  - priority: 49
    category: business_safety
    check: "primary_device.runtime_hours_since_service < primary_device.service_interval_hours."
    error_id: ERR_DEVICE_SERVICE_OVERDUE
    http_status: 422
    applies_to: "POST /bypass-cases/{id}/disposable-packs"
  - priority: 50
    category: business_safety
    check: "A backup heart-lung machine can be resolved: either payload.backup_device_id is supplied, or primary_device.backup_device_id is non-null."
    error_id: ERR_NO_BACKUP_DEVICE_AVAILABLE
    http_status: 422
    applies_to: "POST /bypass-cases/{id}/disposable-packs"
  - priority: 51
    category: business_safety
    check: "The perfusionist has ecmo_privileged == true (the slot holder when an ECMO_RELIEF slot is created, the case's assigned perfusionist when a run is opened, the relief slot holder on a handoff)."
    error_id: ERR_ECMO_PRIVILEGE_REQUIRED
    http_status: 422
    applies_to: "POST /call-rotation-slots, POST /bypass-cases/{id}/ecmo-runs, POST /ecmo-runs/{id}/handoffs"
  - priority: 52
    category: business_safety
    check: "The perfusionist about to staff a new EcmoRun has no other EcmoRun with staffing_breach == true and status IN {RUNNING, RELIEF_PENDING}."
    error_id: ERR_ECMO_STAFFING_BREACH
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/ecmo-runs, POST /ecmo-runs/{id}/handoffs"
  - priority: 53
    category: business_safety
    check: "The named relief slot has slot_type == ECMO_RELIEF, consumed == false, contract_id == the case's contract_id, the logical clock inside [window_start, window_end), and a perfusionist_id different from run.primary_perfusionist_id."
    error_id: ERR_RELIEF_SLOT_INVALID
    http_status: 422
    applies_to: "POST /ecmo-runs/{id}/handoffs"
  - priority: 54
    category: business_safety
    check: "The case named by an incident report has bypass_status IN {OFF_BYPASS, CLOSED} at submission time, and no EcmoRun of the case is still open when the case is closed."
    error_id: ERR_INCIDENT_CASE_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /incident-reports/{id}/submit, POST /bypass-cases/{id}/close"

  # ---- referential integrity (55-56) --------------------------------------
  - priority: 55
    category: business_referential
    check: "backup_device_id references a different PerfusionDevice row with the same device_class and the same contract_id."
    error_id: ERR_INVALID_BACKUP_DEVICE
    http_status: 422
    applies_to: "POST /perfusion-devices, POST /bypass-cases/{id}/disposable-packs"
  - priority: 56
    category: business_referential
    check: "Surgeon.npi_code, Perfusionist.employee_code and PerfusionDevice.asset_tag are unique across their entity."
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /surgeons, POST /perfusionists, POST /perfusion-devices"

  # ---- business constraints (57-61, 70) -----------------------------------
  - priority: 57
    category: business_constraint
    check: "procedure_type is permitted for the surgeon's specialty: ADULT_CARDIAC allows {CABG, VALVE, AORTIC_ARCH, VAD_IMPLANT}, PEDIATRIC_CARDIAC allows {PEDIATRIC_SWITCH, VALVE}, TRANSPLANT allows {TRANSPLANT, VAD_IMPLANT}."
    error_id: ERR_PROCEDURE_SPECIALTY_MISMATCH
    http_status: 422
    applies_to: "POST /preference-cards, POST /bypass-cases"
  - priority: 58
    category: business_constraint
    check: "surgeon.status == ACTIVE."
    error_id: ERR_SURGEON_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /bypass-cases"
  - priority: 59
    category: business_constraint
    check: "The preference-card selector's candidate set for (case.surgeon_id, case.procedure_type) with status == ACTIVE is non-empty."
    error_id: ERR_NO_ACTIVE_PREFERENCE_CARD
    http_status: 422
    applies_to: "POST /bypass-cases/{id}/disposable-packs"
  - priority: 60
    category: business_constraint
    check: "Every substitutions[].line_code exists in the selected preference card's pack_line_items."
    error_id: ERR_INVALID_SUBSTITUTION_LINE
    http_status: 422
    applies_to: "POST /bypass-cases/{id}/disposable-packs"
  - priority: 61
    category: business_constraint
    check: "payload.cross_clamp_minutes <= payload.pump_time_minutes."
    error_id: ERR_CROSS_CLAMP_EXCEEDS_PUMP_TIME
    http_status: 422
    applies_to: "POST /bypass-cases/{id}/end-bypass"

  # ---- temporal constraints (62-69, 71) -----------------------------------
  - priority: 62
    category: business_temporal
    check: "Every declared interval has a strictly later end than start: scheduled_end > scheduled_start, window_end > window_start, expires_on > issued_on."
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /bypass-cases, POST /call-rotation-slots, POST /perfusionists/{id}/certifications"
  - priority: 63
    category: business_temporal
    check: "scheduled_start >= the logical clock at creation time."
    error_id: ERR_CASE_START_IN_PAST
    http_status: 422
    applies_to: "POST /bypass-cases"
  - priority: 64
    category: business_temporal
    check: "The requested clock value is greater than or equal to the current logical clock (the logical clock never runs backwards)."
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 65
    category: business_temporal
    check: "activity_date falls inside the half-open window [cert.issued_on, cert.expires_on) of the holder's current CCP certification."
    error_id: ERR_CE_ACTIVITY_OUTSIDE_CYCLE
    http_status: 422
    applies_to: "POST /perfusionists/{id}/ce-activities"
  - priority: 66
    category: business_temporal
    check: "The new slot's half-open interval [window_start, window_end) does not intersect the interval of any other CallRotationSlot with the same perfusionist_id and status IN {SCHEDULED, ACTIVE}, regardless of contract or slot_type. Half-open semantics mean a slot ending exactly when another starts is allowed."
    error_id: ERR_ROTATION_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /call-rotation-slots"
  - priority: 67
    category: business_temporal
    check: "There exists a CallRotationSlot with perfusionist_id == payload.perfusionist_id, contract_id == case.contract_id, slot_type IN {PRIMARY_CALL, BACKUP_CALL}, status IN {SCHEDULED, ACTIVE} and window_start <= case.scheduled_start AND case.scheduled_end <= window_end."
    error_id: ERR_NO_COVERING_CALL_SLOT
    http_status: 422
    applies_to: "POST /bypass-cases/{id}/assign-perfusionist"
  - priority: 68
    category: business_temporal
    check: "Neither the primary nor the resolved backup device is held by another BypassCase (bypass_status IN {PACK_CONFIGURED, SETUP_VERIFIED, ON_BYPASS}) that collides under the buffered CLOSED-interval rule: a collision exists exactly when new.scheduled_start <= other.scheduled_end + DEVICE_TURNAROUND_MINUTES AND other.scheduled_start <= new.scheduled_end + DEVICE_TURNAROUND_MINUTES. The buffer is applied once, to the incumbent side of each comparison, and both comparisons are non-strict, so a raw gap of exactly DEVICE_TURNAROUND_MINUTES between two cases collides while a gap of DEVICE_TURNAROUND_MINUTES + 1 minutes passes."
    error_id: ERR_DEVICE_TURNAROUND_CONFLICT
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/disposable-packs"
  - priority: 69
    category: business_temporal
    check: "Counting only other BypassCase rows whose half-open [scheduled_start, scheduled_end) intersects this case's: fewer than MAX_CONCURRENT_STAFFED_CASES of them share the incoming assigned_perfusionist_id with bypass_status IN {STAFFED, PACK_CONFIGURED, SETUP_VERIFIED}, and exactly zero of them share it with bypass_status == ON_BYPASS."
    error_id: ERR_PERFUSIONIST_CONCURRENT_CASE_LIMIT
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/assign-perfusionist"
  - priority: 70
    category: business_constraint
    check: "contract.coverage_posture IN {COVERED, THIN}, unless payload.acuity == EMERGENT, which is admitted at any posture."
    error_id: ERR_CONTRACT_COVERAGE_INSUFFICIENT
    http_status: 409
    applies_to: "POST /bypass-cases"
  - priority: 71
    category: business_temporal
    check: "payload.period matches YYYY-MM, its first instant is at or before the logical clock, and it is strictly later than contract.last_settlement_period when that is set."
    error_id: ERR_SETTLEMENT_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /hospital-contracts/{id}/settlement-runs"

  # ---- fiscal capacity, checked last (72) ---------------------------------
  - priority: 72
    category: business_fiscal
    check: "contract.accrued_case_count < contract.monthly_case_cap, evaluated only when the case is not already holding an accrual slot (billing_status != PROVISIONAL_ACCRUED)."
    error_id: ERR_CONTRACT_CASE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /bypass-cases/{id}/assign-perfusionist"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- HospitalContract -----------------------------------------------------
  - method: POST
    path: "/hospital-contracts"
    description: "Register a hospital staffing contract with its commercial rates."
    roles: [ContractAdmin]
    code: 201
    input: [hospital_name, staffing_model, per_case_fee_cents, ecmo_hourly_fee_cents, monthly_case_cap, "monthly_coverage_fee_cents?", "prolonged_surcharge_pct?", "prolonged_pump_threshold_minutes?", "disposable_markup_pct?", "disposable_discount_pct?"]
    output: HospitalContract
    side_effects:
      - "coverage_posture initialised to UNCOVERED (no rotation slots exist yet)"
      - "accrued_case_fee_cents = 0, accrued_case_count = 0, last_settlement_period = null"
  - method: GET
    path: "/hospital-contracts/{id}"
    description: "Read one hospital contract including its live accrual ledger and coverage posture."
    roles: [ContractAdmin, ChiefPerfusionist]
    code: 200
    input: []
    output: HospitalContract
    side_effects: []
  - method: PUT
    path: "/hospital-contracts/{id}"
    description: "Update a contract's commercial terms under optimistic concurrency control on its version."
    roles: [ContractAdmin]
    code: 200
    input: [expected_contract_version, "hospital_name?", "staffing_model?", "per_case_fee_cents?", "ecmo_hourly_fee_cents?", "monthly_coverage_fee_cents?", "prolonged_surcharge_pct?", "prolonged_pump_threshold_minutes?", "disposable_markup_pct?", "disposable_discount_pct?", "monthly_case_cap?"]
    output: HospitalContract
    side_effects:
      - "rejects with ERR_STALE_CONTRACT_VERSION (412) when expected_contract_version != contract.version"
      - "increments HospitalContract.version by 1"
      - "does NOT retro-price already accrued cases; accrued_case_fee_cents is untouched"
  - method: POST
    path: "/hospital-contracts/{id}/settlement-runs"
    description: "Settle one calendar month for a contract, invoicing every FINAL_ACCRUED case whose bypass_ended_at falls in the half-open period."
    roles: [ContractAdmin]
    code: 200
    input: [period]
    output: { period: string, case_count: integer, case_fee_gross_cents: integer, ecmo_gross_cents: integer, coverage_fee_cents: integer, pre_credit_gross_cents: integer, volume_credit_pct: number, volume_credit_cents: integer, quality_credit_cents: integer, net_settlement_cents: integer, contract_version: integer }
    side_effects:
      - "runs calculation contract_monthly_settlement"
      - "every in-period FINAL_ACCRUED case moves billing_status FINAL_ACCRUED -> INVOICED with accrued_fee_cents unchanged"
      - "contract.last_settlement_period = period; increments HospitalContract.version by 1"

  # ---- Surgeon and PreferenceCard ------------------------------------------
  - method: POST
    path: "/surgeons"
    description: "Register an operating surgeon."
    roles: [ContractAdmin]
    code: 201
    input: [full_name, npi_code, specialty, "status?"]
    output: Surgeon
    side_effects: []
  - method: GET
    path: "/surgeons/{id}"
    description: "Read one surgeon."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist, Surgeon]
    code: 200
    input: []
    output: Surgeon
    side_effects: []
  - method: POST
    path: "/preference-cards"
    description: "Publish a surgeon preference card revision for one procedure type, including its disposable pack template, required safety checks and blood management protocol."
    roles: [Surgeon, ChiefPerfusionist]
    code: 201
    input: [surgeon_id, procedure_type, standard_pump_minutes, prime_volume_ml, pack_line_items, required_safety_check_codes, blood_management_protocol, min_hematocrit_pct, "revision?"]
    output: PreferenceCard
    side_effects:
      - "every other PreferenceCard with the same (surgeon_id, procedure_type) and status == ACTIVE whose revision is lower than or equal to the new card's revision moves ACTIVE -> SUPERSEDED"
      - "already-created DisposablePack rows keep their pinned applied_preference_card_id and pack_cost_cents"
  - method: GET
    path: "/preference-cards/{id}"
    description: "Read one preference card revision."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist, Surgeon]
    code: 200
    input: []
    output: PreferenceCard
    side_effects: []
  - method: GET
    path: "/preference-cards"
    description: "List preference cards, filterable by owning surgeon, procedure type and status."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist, Surgeon]
    code: 200
    input: ["surgeon_id?", "procedure_type?", "status?", "limit?", "offset?"]
    output: PreferenceCard[]
    side_effects: []

  # ---- Perfusionist, Certification, CeActivity -----------------------------
  - method: POST
    path: "/perfusionists"
    description: "Onboard a perfusionist, seeding the career case count carried over from the HR record."
    roles: [ContractAdmin]
    code: 201
    input: [full_name, employee_code, "employment_status?", "is_chief?", "ecmo_privileged?", "career_case_count?"]
    output: Perfusionist
    side_effects:
      - "ce_credits_verified, ce_credits_pending, readiness_score, consecutive_case_count_24h and ecmo_hours_rolling_7d all initialise to 0; readiness_variant_last = null"
  - method: GET
    path: "/perfusionists/{id}"
    description: "Read one perfusionist including the denormalized CE ledger, readiness score and fatigue counters."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist]
    code: 200
    input: []
    output: Perfusionist
    side_effects: []
  - method: POST
    path: "/perfusionists/{id}/certifications"
    description: "Record a certification cycle for a perfusionist."
    roles: [ContractAdmin]
    code: 201
    input: [cert_code, issued_on, expires_on, "cycle_credit_requirement?"]
    output: Certification
    side_effects:
      - "status initialises to ACTIVE with probation_count = 0, remediation_credits_required = 0, probation_credits_banked = 0"
      - "the holder's ce_credits_verified and ce_credits_pending are re-derived against the new cycle window by perfusionist_ce_ledger"
  - method: GET
    path: "/perfusionists/{id}/certifications"
    description: "List a perfusionist's certification cycles (FK reverse-reachability for Certification.perfusionist_id)."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist]
    code: 200
    input: ["cert_code?", "status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []
  - method: POST
    path: "/perfusionists/{id}/ce-activities"
    description: "Claim a continuing-education activity against the holder's current certification cycle."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist]
    code: 201
    input: [category, credit_hours, activity_date, accreditation_body]
    output: CeActivity
    side_effects:
      - "status initialises to SUBMITTED; counted_toward_remediation = false"
      - "runs perfusionist_ce_ledger, raising the holder's ce_credits_pending by credit_hours"
  - method: GET
    path: "/perfusionists/{id}/ce-activities"
    description: "List a perfusionist's CE activities (FK reverse-reachability for CeActivity.perfusionist_id)."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist]
    code: 200
    input: ["status?", "category?", "limit?", "offset?"]
    output: CeActivity[]
    side_effects: []
  - method: POST
    path: "/ce-activities/{id}/verification"
    description: "Verify, reject or revoke a claimed CE activity; the compensating branch reverses the ledger exactly."
    roles: [ContractAdmin]
    code: 200
    input: [decision, "note?"]
    output: CeActivity
    side_effects:
      - "decision == VERIFIED: SUBMITTED -> VERIFIED; ce_credits_pending falls and ce_credits_verified rises by credit_hours"
      - "decision == VERIFIED while the holder's CCP certification is in PROBATION: counted_toward_remediation = true, certification.probation_credits_banked rises, and the certification returns PROBATION -> ACTIVE once the banked total reaches remediation_credits_required"
      - "decision == REJECTED: SUBMITTED -> REJECTED; only ce_credits_pending falls"
      - "decision == REVOKED: VERIFIED -> REVOKED; ce_credits_verified falls by credit_hours and any remediation banking is withdrawn"
      - "increments CeActivity.version by 1"

  # ---- PerfusionDevice and DeviceEventLog ----------------------------------
  - method: POST
    path: "/perfusion-devices"
    description: "Commission a perfusion device at a hospital, optionally designating another device of the same class as its backup."
    roles: [BiomedTech, ContractAdmin]
    code: 201
    input: [contract_id, asset_tag, device_class, "backup_device_id?", "service_interval_hours?"]
    output: PerfusionDevice
    side_effects:
      - "status initialises to AVAILABLE with runtime_hours_since_service = 0, alarm_count_since_service = 0, open_reservation_count = 0, last_service_completed_at = null"
  - method: GET
    path: "/perfusion-devices/{id}"
    description: "Read one device including its service counters and live reservation count."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist, BiomedTech]
    code: 200
    input: []
    output: PerfusionDevice
    side_effects: []
  - method: GET
    path: "/perfusion-devices"
    description: "List devices, filterable by hospital, by designated-backup pointer (FK reverse-reachability for the self-referential backup_device_id), class and status."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist, BiomedTech]
    code: 200
    input: ["contract_id?", "backup_device_id?", "device_class?", "status?", "limit?", "offset?"]
    output: PerfusionDevice[]
    side_effects: []
  - method: POST
    path: "/perfusion-devices/{id}/event-logs"
    description: "Capture a device event. ALARM_CRITICAL and SELF_TEST_FAIL drive the device to NEEDS_SERVICE and fire the four-link critical-alarm cascade."
    roles: [BiomedTech, Perfusionist, ChiefPerfusionist]
    code: 201
    input: [event_code, "runtime_hours_delta?", "detail?"]
    output: DeviceEventLog
    side_effects:
      - "link 1: DeviceEventLog appended with recorded_by_user_id = X-User-ID; for event_code == RUNTIME_TICK runtime_hours_since_service += runtime_hours_delta; for ALARM_CRITICAL, ALARM_ADVISORY and SELF_TEST_FAIL alarm_count_since_service += 1; for ALARM_CRITICAL and SELF_TEST_FAIL device.status -> NEEDS_SERVICE"
      - "link 2: every BypassCase holding this device as primary_device_id with bypass_status IN {PACK_CONFIGURED, SETUP_VERIFIED} reverts to STAFFED, clears both device pointers, sets readiness_flag = DEVICE_FALLBACK_REQUIRED and setup_verified_at = null; the backup device returns RESERVED -> AVAILABLE"
      - "link 2b: every BypassCase holding this device as backup_device_id with bypass_status IN {PACK_CONFIGURED, SETUP_VERIFIED} keeps its bypass_status and setup_verified_at, clears backup_device_id and sets readiness_flag = DEVICE_FALLBACK_REQUIRED; no checklist or billing link fires on this variant"
      - "link 3: every PumpChecklist of each affected case with status IN {DRAFT, VERIFIED} moves to INVALIDATED with blood_mgmt_signoff = false"
      - "link 4: each affected case with billing_status == PROVISIONAL_ACCRUED moves to UNBILLED, its accrued_fee_cents drops to 0 and the contract ledger decrements by that amount with accrued_case_count -= 1"
      - "affected cases are processed in ascending scheduled_start then ascending created_at order"
      - "device_reservation_ledger recomputed for every touched device; increments PerfusionDevice.version by 1"
  - method: GET
    path: "/perfusion-devices/{id}/event-logs"
    description: "List a device's captured events (FK reverse-reachability for DeviceEventLog.device_id); DeviceEventLog is immutable and has no version field."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist, BiomedTech]
    code: 200
    input: ["event_code?", "limit?", "offset?"]
    output: DeviceEventLog[]
    side_effects: []
  - method: POST
    path: "/perfusion-devices/{id}/service-completions"
    description: "Record completion of preventive service, returning a NEEDS_SERVICE device to AVAILABLE and resetting its counters."
    roles: [BiomedTech]
    code: 200
    input: ["detail?"]
    output: PerfusionDevice
    side_effects:
      - "NEEDS_SERVICE -> AVAILABLE; runtime_hours_since_service = 0; alarm_count_since_service = 0; last_service_completed_at = logical clock"
      - "appends a DeviceEventLog with event_code == SERVICE_COMPLETED"
      - "increments PerfusionDevice.version by 1"

  # ---- CallRotationSlot ----------------------------------------------------
  - method: POST
    path: "/call-rotation-slots"
    description: "Put a perfusionist on call for a hospital across a half-open window; PRIMARY_CALL and BACKUP_CALL slots feed the contract's coverage posture."
    roles: [ContractAdmin, ChiefPerfusionist]
    code: 201
    input: [contract_id, perfusionist_id, slot_type, window_start, window_end]
    output: CallRotationSlot
    side_effects:
      - "status initialises to SCHEDULED with consumed = false"
      - "runs contract_coverage_posture for contract_id, which may raise HospitalContract.coverage_posture UNCOVERED -> THIN -> COVERED and increments HospitalContract.version by 1"
  - method: GET
    path: "/call-rotation-slots/{id}"
    description: "Read one call rotation slot."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist]
    code: 200
    input: []
    output: CallRotationSlot
    side_effects: []
  - method: GET
    path: "/call-rotation-slots"
    description: "List call rotation slots, filterable by hospital and by on-call perfusionist (FK reverse-reachability for both FKs)."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist]
    code: 200
    input: ["contract_id?", "perfusionist_id?", "slot_type?", "status?", "limit?", "offset?"]
    output: CallRotationSlot[]
    side_effects: []

  # ---- BypassCase ----------------------------------------------------------
  - method: POST
    path: "/bypass-cases"
    description: "Schedule a bypass case against a contract and surgeon; the contract's coverage posture gates non-emergent cases."
    roles: [ChiefPerfusionist, ContractAdmin]
    code: 201
    input: [contract_id, surgeon_id, procedure_type, scheduled_start, scheduled_end, "acuity?"]
    output: BypassCase
    side_effects:
      - "bypass_status initialises to SCHEDULED and billing_status to UNBILLED (the two parallel dimensions start independently)"
      - "readiness_flag = NONE; accrued_fee_cents = 0; adverse_event_count = 0; all device, perfusionist, timing and fee fields are null"
  - method: GET
    path: "/bypass-cases/{id}"
    description: "Read one bypass case including both state dimensions and both fee variants."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist, Surgeon]
    code: 200
    input: []
    output: BypassCase
    side_effects: []
  - method: GET
    path: "/bypass-cases"
    description: "List bypass cases, filterable by contract, surgeon, assigned perfusionist and either device role (FK reverse-reachability for all five case FKs)."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist, Surgeon]
    code: 200
    input: ["contract_id?", "surgeon_id?", "assigned_perfusionist_id?", "primary_device_id?", "backup_device_id?", "bypass_status?", "billing_status?", "limit?", "offset?"]
    output: BypassCase[]
    side_effects: []
  - method: POST
    path: "/bypass-cases/{id}/assign-perfusionist"
    description: "Assign or supersede the perfusionist on a case under optimistic concurrency control on the case version; accrues the PROVISIONAL fee."
    roles: [ChiefPerfusionist]
    code: 200
    input: [perfusionist_id, expected_case_version]
    output: BypassCase
    side_effects:
      - "rejects with ERR_STALE_CASE_VERSION (412) when expected_case_version != case.version"
      - "bypass_status SCHEDULED -> STAFFED, or STAFFED -> STAFFED when superseding a sitting assignment"
      - "case.provisional_fee_cents = case_fee_settlement[variant=PROVISIONAL]; billing_status -> PROVISIONAL_ACCRUED; accrued_fee_cents = provisional_fee_cents"
      - "on a supersede the outgoing accrual is withdrawn from contract.accrued_case_fee_cents before the recomputed amount is added, and accrued_case_count is unchanged"
      - "perfusionist.readiness_score = the ADMISSION value computed by the admission gate; readiness_variant_last = ADMISSION"
      - "increments BypassCase.version by 1 and HospitalContract.version by 1"
  - method: POST
    path: "/bypass-cases/{id}/disposable-packs"
    description: "Configure the disposable pack for a case from the selected surgeon preference card and reserve the primary and backup heart-lung machines."
    roles: [Perfusionist, ChiefPerfusionist]
    code: 201
    input: [primary_device_id, "backup_device_id?", "substitutions?"]
    output: DisposablePack
    side_effects:
      - "the preference-card selector picks the ACTIVE card for (case.surgeon_id, case.procedure_type) ordered by revision DESC then created_at DESC, and pins it as applied_preference_card_id"
      - "line_items materialised from the card with substitutions applied; pack_cost_cents = disposable_pack_cost; prime_volume_ml copied from the card"
      - "approval_status = PENDING when substitutions is non-empty, else NOT_REQUIRED; requires_surgeon_approval mirrors that"
      - "case.bypass_status STAFFED -> PACK_CONFIGURED; case.primary_device_id and case.backup_device_id set; readiness_flag = NONE"
      - "both devices end at status RESERVED (an already-RESERVED machine stays RESERVED) and their open_reservation_count is recomputed by device_reservation_ledger"
      - "increments BypassCase.version by 1 and both PerfusionDevice versions by 1"
  - method: GET
    path: "/disposable-packs/{id}"
    description: "Read one materialised disposable pack including its per-line totals."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist, Surgeon]
    code: 200
    input: []
    output: DisposablePack
    side_effects: []
  - method: GET
    path: "/disposable-packs"
    description: "List disposable packs, filterable by case and by the pinned preference card (FK reverse-reachability for both pack FKs)."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist, Surgeon]
    code: 200
    input: ["case_id?", "applied_preference_card_id?", "approval_status?", "limit?", "offset?"]
    output: DisposablePack[]
    side_effects: []
  - method: POST
    path: "/disposable-packs/{id}/approve"
    description: "Owning surgeon approves or rejects a pack that carries line substitutions."
    roles: [Surgeon]
    code: 200
    input: [decision, "note?"]
    output: DisposablePack
    side_effects:
      - "approval_status PENDING -> APPROVED or PENDING -> REJECTED"
      - "increments DisposablePack.version by 1"
      - "a REJECTED pack keeps the case in PACK_CONFIGURED and continues to block checklist verification and case close"
  - method: POST
    path: "/bypass-cases/{id}/pump-checklists"
    description: "Open a pre-bypass pump setup checklist for a case, recording the safety checks performed, the blood management protocol set up and the measured hematocrit."
    roles: [Perfusionist, ChiefPerfusionist]
    code: 201
    input: [check_results, blood_management_protocol, hematocrit_pct]
    output: PumpChecklist
    side_effects:
      - "status initialises to DRAFT with blood_mgmt_signoff = false, verified_at = null, verified_by_perfusionist_id = null"
      - "missing_check_codes derived against the pinned preference card's required_safety_check_codes, ordered ascending"
  - method: GET
    path: "/pump-checklists/{id}"
    description: "Read one pump checklist including its derived missing safety check codes."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist]
    code: 200
    input: []
    output: PumpChecklist
    side_effects: []
  - method: GET
    path: "/pump-checklists"
    description: "List pump checklists, filterable by case and by verifying perfusionist (FK reverse-reachability for both checklist FKs)."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist]
    code: 200
    input: ["case_id?", "verified_by_perfusionist_id?", "status?", "limit?", "offset?"]
    output: PumpChecklist[]
    side_effects: []
  - method: POST
    path: "/pump-checklists/{id}/verify"
    description: "Sign off the pre-bypass checklist; all card-required safety checks, the blood management protocol and the hematocrit floor are enforced here."
    roles: [Perfusionist]
    code: 200
    input: []
    output: PumpChecklist
    side_effects:
      - "checklist DRAFT -> VERIFIED with blood_mgmt_signoff = true, verified_at = logical clock, verified_by_perfusionist_id = X-User-ID"
      - "case.bypass_status PACK_CONFIGURED -> SETUP_VERIFIED with setup_verified_at = logical clock"
      - "increments PumpChecklist.version by 1 and BypassCase.version by 1"
  - method: POST
    path: "/bypass-cases/{id}/start-bypass"
    description: "Go on pump. Requires a verified setup and a case that has not been stripped of its devices by a critical alarm."
    roles: [Perfusionist]
    code: 200
    input: []
    output: BypassCase
    side_effects:
      - "bypass_status SETUP_VERIFIED -> ON_BYPASS; bypass_started_at = logical clock"
      - "the primary device moves RESERVED -> IN_USE; the covering CallRotationSlot moves SCHEDULED -> ACTIVE when it is still SCHEDULED"
      - "perfusionist.consecutive_case_count_24h recomputed, which re-derives readiness_score"
      - "increments BypassCase.version by 1 and PerfusionDevice.version by 1"
  - method: POST
    path: "/bypass-cases/{id}/end-bypass"
    description: "Come off pump and report the actual pump time, cross-clamp time, lowest hematocrit and adverse event count."
    roles: [Perfusionist]
    code: 200
    input: [pump_time_minutes, cross_clamp_minutes, lowest_hematocrit_pct, "adverse_event_count?"]
    output: BypassCase
    side_effects:
      - "bypass_status ON_BYPASS -> OFF_BYPASS; bypass_ended_at = logical clock; the four reported quality fields are stored"
      - "primary device runtime_hours_since_service += pump_time_minutes / 60 exactly, then IN_USE -> AVAILABLE on the clean branch with no remaining reservation, IN_USE -> RESERVED on the clean branch when another reserving case remains, or IN_USE -> NEEDS_SERVICE on the service-due branch (which also appends a SELF_TEST_FAIL event log)"
      - "backup device RESERVED -> AVAILABLE; both open_reservation_count values recomputed"
      - "the covering CallRotationSlot moves ACTIVE -> COMPLETED when the perfusionist has no other ON_BYPASS case"
      - "billing_status is untouched: the fiscal dimension still reads PROVISIONAL_ACCRUED"
      - "increments BypassCase.version by 1"
  - method: POST
    path: "/bypass-cases/{id}/close"
    description: "Close a completed case, settling the FINAL fee variant against the accrual already posted at assignment time."
    roles: [ChiefPerfusionist]
    code: 200
    input: []
    output: BypassCase
    side_effects:
      - "bypass_status OFF_BYPASS -> CLOSED; final_fee_cents = case_fee_settlement[variant=FINAL]"
      - "billing_status PROVISIONAL_ACCRUED -> FINAL_ACCRUED; contract.accrued_case_fee_cents absorbs exactly (final_fee_cents - accrued_fee_cents); accrued_fee_cents = final_fee_cents"
      - "assigned perfusionist career_case_count += 1 and readiness_score re-derived under the ADMISSION variant"
      - "increments BypassCase.version by 1 and HospitalContract.version by 1"
  - method: POST
    path: "/bypass-cases/{id}/cancel"
    description: "Cancel a case that has not gone on pump, compensating every accrual and reservation it holds."
    roles: [ChiefPerfusionist]
    code: 200
    input: ["reason?"]
    output: BypassCase
    side_effects:
      - "bypass_status -> CANCELLED from SCHEDULED, STAFFED, PACK_CONFIGURED or SETUP_VERIFIED"
      - "when billing_status == PROVISIONAL_ACCRUED: contract.accrued_case_fee_cents -= accrued_fee_cents, accrued_case_count -= 1, billing_status -> UNBILLED, accrued_fee_cents = 0"
      - "every RESERVED device of this case has its open_reservation_count recomputed by device_reservation_ledger and returns to AVAILABLE when that count falls to 0, staying RESERVED when another case still holds it"
      - "every PumpChecklist of this case in DRAFT or VERIFIED moves to INVALIDATED with blood_mgmt_signoff = false"
      - "readiness_flag = NONE; setup_verified_at = null"
      - "increments BypassCase.version by 1 and HospitalContract.version by 1"

  # ---- EcmoRun -------------------------------------------------------------
  - method: POST
    path: "/bypass-cases/{id}/ecmo-runs"
    description: "Open an extracorporeal membrane oxygenation run off an on-pump case; the acting perfusionist must be the case's assignee and hold ECMO privileges."
    roles: [Perfusionist, ChiefPerfusionist]
    code: 201
    input: [mode]
    output: EcmoRun
    side_effects:
      - "status initialises to RUNNING; primary_perfusionist_id = case.assigned_perfusionist_id; cannulated_at = logical clock; last_handoff_at = null; uninterrupted_minutes = 0; staffing_breach = false; billable_hours = 0; ecmo_fee_cents = 0"
  - method: GET
    path: "/ecmo-runs/{id}"
    description: "Read one ECMO run including its uninterrupted-staffing minutes and breach flag."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist]
    code: 200
    input: []
    output: EcmoRun
    side_effects: []
  - method: GET
    path: "/ecmo-runs"
    description: "List ECMO runs, filterable by case, staffing perfusionist and consumed relief slot (FK reverse-reachability for all three run FKs)."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist]
    code: 200
    input: ["case_id?", "primary_perfusionist_id?", "relief_slot_id?", "status?", "limit?", "offset?"]
    output: EcmoRun[]
    side_effects: []
  - method: POST
    path: "/ecmo-runs/{id}/handoffs"
    description: "Hand a prolonged ECMO run to a relieving perfusionist named through an ECMO_RELIEF call slot, closing the RUNNING -> RELIEF_PENDING -> RUNNING cycle."
    roles: [ChiefPerfusionist]
    code: 200
    input: [relief_slot_id]
    output: EcmoRun
    side_effects:
      - "status RELIEF_PENDING -> RUNNING; primary_perfusionist_id = the relief slot's perfusionist_id; relief_slot_id stored; last_handoff_at = logical clock"
      - "uninterrupted_minutes reset to 0 and staffing_breach re-derived as false"
      - "the named ECMO_RELIEF slot moves SCHEDULED -> ACTIVE with consumed = true"
      - "increments EcmoRun.version by 1 and CallRotationSlot.version by 1"
  - method: POST
    path: "/ecmo-runs/{id}/decannulate"
    description: "Close an ECMO run and price it with ecmo_run_billing."
    roles: [Perfusionist]
    code: 200
    input: []
    output: EcmoRun
    side_effects:
      - "status -> DECANNULATED; decannulated_at = logical clock; billable_hours and ecmo_fee_cents = ecmo_run_billing outputs"
      - "the consumed relief slot, when ACTIVE, moves ACTIVE -> COMPLETED"
      - "the staffing perfusionist's ecmo_hours_rolling_7d recomputed, which re-derives readiness_score"
      - "increments EcmoRun.version by 1"

  # ---- IncidentReport ------------------------------------------------------
  - method: POST
    path: "/incident-reports"
    description: "File an incident report against a completed case and a named perfusionist."
    roles: [Perfusionist, ChiefPerfusionist]
    code: 201
    input: [case_id, involved_perfusionist_id, severity, category, narrative]
    output: IncidentReport
    side_effects:
      - "status initialises to DRAFT; filed_by_perfusionist_id = X-User-ID; return_count = 0; finding = NONE; corrective_action_required = false; reviewed_readiness_score = null; closed_by_perfusionist_id = null"
  - method: GET
    path: "/incident-reports/{id}"
    description: "Read one incident report including the frozen AUDIT readiness score and the review outcome."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: GET
    path: "/incident-reports"
    description: "List incident reports, filterable by case, involved perfusionist, filer and closer (FK reverse-reachability for all four report FKs)."
    roles: [ContractAdmin, ChiefPerfusionist, Perfusionist]
    code: 200
    input: ["case_id?", "involved_perfusionist_id?", "filed_by_perfusionist_id?", "closed_by_perfusionist_id?", "status?", "severity?", "finding?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []
  - method: POST
    path: "/incident-reports/{id}/submit"
    description: "Submit a drafted or returned report into the quality review queue; only the filer may submit."
    roles: [Perfusionist, ChiefPerfusionist]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "status DRAFT -> SUBMITTED, or RETURNED_FOR_INFO -> SUBMITTED on a resubmission"
      - "increments IncidentReport.version by 1"
  - method: POST
    path: "/incident-reports/{id}/review"
    description: "Chief perfusionist accepts a submitted report for review or returns it for more information; the reviewer may be neither the filer nor the involved perfusionist."
    roles: [ChiefPerfusionist]
    code: 200
    input: [decision, "review_note?"]
    output: IncidentReport
    side_effects:
      - "decision == ACCEPT_FOR_REVIEW: SUBMITTED -> UNDER_REVIEW and reviewed_readiness_score = perfusionist_readiness_score[variant=AUDIT] for involved_perfusionist_id, frozen on the report"
      - "decision == RETURN_FOR_INFO: SUBMITTED -> RETURNED_FOR_INFO, return_count += 1 and reviewed_readiness_score left untouched"
      - "increments IncidentReport.version by 1"
  - method: POST
    path: "/incident-reports/{id}/close"
    description: "Close a report under review with an ISOLATED or SYSTEMIC finding; the SYSTEMIC branch fires the four-link systemic-incident cascade."
    roles: [ChiefPerfusionist]
    code: 200
    input: [finding, "credit_case_fee?", "closing_note?"]
    output: IncidentReport
    side_effects:
      - "finding == ISOLATED: UNDER_REVIEW -> CLOSED_NO_ACTION with corrective_action_required = false and no downstream effect at all"
      - "finding == SYSTEMIC, link 1: UNDER_REVIEW -> CLOSED_WITH_ACTION with corrective_action_required = true and closed_by_perfusionist_id = X-User-ID"
      - "finding == SYSTEMIC, link 2: the involved perfusionist's CCP Certification moves ACTIVE -> PROBATION with remediation_credits_required = REMEDIATION_CREDIT_HOURS, probation_credits_banked = 0 and probation_count += 1, or PROBATION -> REVOKED when probation_count was already 2 or more"
      - "finding == SYSTEMIC, link 3: every PRIMARY_CALL slot of that perfusionist with status == SCHEDULED and window_start > the logical clock moves to RELEASED, processed in ascending window_start then ascending created_at order"
      - "finding == SYSTEMIC, link 4: contract_coverage_posture is recomputed for every contract whose slots were released, which may drop coverage_posture COVERED -> THIN -> UNCOVERED"
      - "finding == SYSTEMIC and credit_case_fee == true and the case is INVOICED: billing_status INVOICED -> CREDITED, contract.accrued_case_fee_cents -= accrued_fee_cents, accrued_case_count -= 1, accrued_fee_cents = 0"
      - "increments IncidentReport.version by 1"

  # ---- logical clock (test-driving endpoint, section 1.5 ladder rung 3) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock is the ONLY time source for every window, deadline and expiry rule in this domain; before the first call it reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. The clock never runs backwards."
    roles: [ContractAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime, lapsed_certification_count: integer, relief_pending_run_count: integer, recomputed_contract_count: integer }
    side_effects:
      - "every Certification in ACTIVE or PROBATION whose expires_on is at or before the new clock value moves to LAPSED with remediation_credits_required = 0"
      - "every EcmoRun in RUNNING whose uninterrupted_minutes reaches ECMO_RELIEF_WARN_MINUTES at the new clock value moves RUNNING -> RELIEF_PENDING; staffing_breach is re-derived for every open run"
      - "contract_coverage_posture recomputed for every HospitalContract because the 72-hour horizon has moved"
      - "derived rolling counters consecutive_case_count_24h and ecmo_hours_rolling_7d are re-derived for every Perfusionist"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "Raised when the ordered check at priority 1 fails: Both X-User-ID and X-User-Role headers are present and non-empty."
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "Raised when the ordered check at priority 2 fails: X-User-Role is one of the five roles declared in section 1.7."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Raised when the ordered check at priority 3 fails: The supplied role appears in the called endpoint's roles list."
  - id: ERR_ACTOR_NOT_FOUND
    http: 403
    condition: "Raised when the ordered check at priority 4 fails: For an entity-backed role (ChiefPerfusionist, Perfusionist, Surgeon) X-User-ID resolves to an existing row of the backing entity."
  - id: ERR_NOT_CHIEF_PERFUSIONIST
    http: 403
    condition: "Raised when the ordered check at priority 5 fails: When X-User-Role == ChiefPerfusionist the resolved Perfusionist has is_chief == true."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Raised when the ordered check at priority 6 fails: Every field the endpoint's input list marks as required is present and non-null."
  - id: ERR_INVALID_FIELD_VALUE
    http: 422
    condition: "Raised when the ordered check at priority 7 fails: Every supplied field satisfies its section 1.1 type, enum membership, range, length and array-cardinality constraints."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "Raised when the ordered check at priority 8 fails: limit is an integer in [1, 100] and offset is an integer >= 0."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "Raised when the ordered check at priority 9 fails: The HospitalContract named by the path id or by contract_id exists."
  - id: ERR_SURGEON_NOT_FOUND
    http: 404
    condition: "Raised when the ordered check at priority 10 fails: The Surgeon named by surgeon_id exists."
  - id: ERR_PREFERENCE_CARD_NOT_FOUND
    http: 404
    condition: "Raised when the ordered check at priority 11 fails: The PreferenceCard named by the path id exists."
  - id: ERR_PERFUSIONIST_NOT_FOUND
    http: 404
    condition: "Raised when the ordered check at priority 12 fails: The Perfusionist named by the path id, by perfusionist_id or by involved_perfusionist_id exists."
  - id: ERR_CE_ACTIVITY_NOT_FOUND
    http: 404
    condition: "Raised when the ordered check at priority 13 fails: The CeActivity named by the path id exists."
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "Raised when the ordered check at priority 14 fails: The PerfusionDevice named by the path id, by backup_device_id, by primary_device_id or by the request's backup_device_id exists."
  - id: ERR_ROTATION_SLOT_NOT_FOUND
    http: 404
    condition: "Raised when the ordered check at priority 15 fails: The CallRotationSlot named by the path id or by relief_slot_id exists."
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "Raised when the ordered check at priority 16 fails: The BypassCase named by the path id or by case_id exists."
  - id: ERR_PACK_NOT_FOUND
    http: 404
    condition: "Raised when the ordered check at priority 17 fails: The DisposablePack named by the path id exists."
  - id: ERR_CHECKLIST_NOT_FOUND
    http: 404
    condition: "Raised when the ordered check at priority 18 fails: The PumpChecklist named by the path id exists."
  - id: ERR_ECMO_RUN_NOT_FOUND
    http: 404
    condition: "Raised when the ordered check at priority 19 fails: The EcmoRun named by the path id exists."
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "Raised when the ordered check at priority 20 fails: The IncidentReport named by the path id exists."
  - id: ERR_NOT_CARD_OWNER
    http: 403
    condition: "Raised when the ordered check at priority 21 fails: When X-User-Role == Surgeon, X-User-ID equals the surgeon_id of the PreferenceCard being created, or the surgeon_id of the BypassCase whose DisposablePack is being approved."
  - id: ERR_NOT_ASSIGNED_PERFUSIONIST
    http: 403
    condition: "Raised when the ordered check at priority 22 fails: X-User-ID equals the case's assigned_perfusionist_id (for checklist verification, start-bypass, end-bypass and ECMO run creation) or the run's primary_perfusionist_id (for decannulation)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Raised when the ordered check at priority 23 fails: The reviewing or closing X-User-ID differs from both report.involved_perfusionist_id and report.filed_by_perfusionist_id; and the submitting X-User-ID equals report.filed_by_perfusionist_id."
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "Raised when the ordered check at priority 24 fails: payload.expected_case_version equals the BypassCase's current version."
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "Raised when the ordered check at priority 25 fails: payload.expected_contract_version equals the HospitalContract's current version."
  - id: ERR_CASE_NOT_ASSIGNABLE
    http: 409
    condition: "Raised when the ordered check at priority 26 fails: case.bypass_status IN {SCHEDULED, STAFFED}."
  - id: ERR_CASE_NOT_STAFFED
    http: 409
    condition: "Raised when the ordered check at priority 27 fails: case.bypass_status == STAFFED."
  - id: ERR_CASE_NOT_PACK_CONFIGURED
    http: 409
    condition: "Raised when the ordered check at priority 28 fails: case.bypass_status == PACK_CONFIGURED."
  - id: ERR_CHECKLIST_NOT_DRAFT
    http: 409
    condition: "Raised when the ordered check at priority 29 fails: checklist.status == DRAFT."
  - id: ERR_CASE_NOT_SETUP_VERIFIED
    http: 409
    condition: "Raised when the ordered check at priority 30 fails: case.bypass_status == SETUP_VERIFIED."
  - id: ERR_CASE_NOT_ON_BYPASS
    http: 409
    condition: "Raised when the ordered check at priority 31 fails: case.bypass_status == ON_BYPASS."
  - id: ERR_CASE_NOT_OFF_BYPASS
    http: 409
    condition: "Raised when the ordered check at priority 32 fails: case.bypass_status == OFF_BYPASS."
  - id: ERR_CASE_NOT_CANCELLABLE
    http: 409
    condition: "Raised when the ordered check at priority 33 fails: case.bypass_status IN {SCHEDULED, STAFFED, PACK_CONFIGURED, SETUP_VERIFIED}."
  - id: ERR_DEVICE_NOT_AVAILABLE
    http: 409
    condition: "Raised when the ordered check at priority 34 fails: The primary device and the resolved backup device each have status IN {AVAILABLE, RESERVED}; IN_USE and NEEDS_SERVICE machines are refused here, whereas a machine already RESERVED for another case is refused only by the turnaround row at priority 68 when the windows actually collide."
  - id: ERR_DEVICE_SERVICE_NOT_PERMITTED
    http: 409
    condition: "Raised when the ordered check at priority 35 fails: device.status == NEEDS_SERVICE and device.open_reservation_count == 0."
  - id: ERR_INCIDENT_STATE_INVALID
    http: 409
    condition: "Raised when the ordered check at priority 36 fails: report.status is in the from-set of the requested incident transition: DRAFT or RETURNED_FOR_INFO for submit, SUBMITTED for review, UNDER_REVIEW for close."
  - id: ERR_INCIDENT_RETURN_LIMIT
    http: 409
    condition: "Raised when the ordered check at priority 37 fails: report.return_count < MAX_INCIDENT_RETURNS when decision == RETURN_FOR_INFO."
  - id: ERR_ECMO_RUN_STATE_INVALID
    http: 409
    condition: "Raised when the ordered check at priority 38 fails: run.status == RELIEF_PENDING for a handoff; run.status IN {RUNNING, RELIEF_PENDING} for a decannulation."
  - id: ERR_CE_ACTIVITY_STATE_INVALID
    http: 409
    condition: "Raised when the ordered check at priority 39 fails: activity.status == SUBMITTED for decision IN {VERIFIED, REJECTED}; activity.status == VERIFIED for decision == REVOKED."
  - id: ERR_PACK_APPROVAL_STATE_INVALID
    http: 409
    condition: "Raised when the ordered check at priority 40 fails: pack.approval_status == PENDING."
  - id: ERR_CERTIFICATION_NOT_CURRENT
    http: 422
    condition: "Raised when the ordered check at priority 41 fails: The perfusionist's Certification row with cert_code == CCP exists and has status IN {ACTIVE, PROBATION}."
  - id: ERR_PERFUSIONIST_NOT_ACTIVE
    http: 422
    condition: "Raised when the ordered check at priority 42 fails: perfusionist.employment_status == ACTIVE."
  - id: ERR_READINESS_BELOW_MINIMUM
    http: 422
    condition: "Raised when the ordered check at priority 43 fails: perfusionist_readiness_score[variant=ADMISSION] >= READINESS_MIN_ADMISSION."
  - id: ERR_DEVICE_FALLBACK_REQUIRED
    http: 409
    condition: "Raised when the ordered check at priority 44 fails: case.readiness_flag == NONE."
  - id: ERR_SAFETY_CHECKS_INCOMPLETE
    http: 422
    condition: "Raised when the ordered check at priority 45 fails: checklist.missing_check_codes is the empty array, i.e. every code in the applied preference card's required_safety_check_codes appears in check_results with passed == true."
  - id: ERR_BLOOD_PROTOCOL_MISMATCH
    http: 422
    condition: "Raised when the ordered check at priority 46 fails: checklist.blood_management_protocol equals the applied preference card's blood_management_protocol."
  - id: ERR_HEMATOCRIT_BELOW_MINIMUM
    http: 422
    condition: "Raised when the ordered check at priority 47 fails: checklist.hematocrit_pct >= the applied preference card's min_hematocrit_pct."
  - id: ERR_PACK_APPROVAL_PENDING
    http: 409
    condition: "Raised when the ordered check at priority 48 fails: The case's DisposablePack has approval_status IN {NOT_REQUIRED, APPROVED}."
  - id: ERR_DEVICE_SERVICE_OVERDUE
    http: 422
    condition: "Raised when the ordered check at priority 49 fails: primary_device.runtime_hours_since_service < primary_device.service_interval_hours."
  - id: ERR_NO_BACKUP_DEVICE_AVAILABLE
    http: 422
    condition: "Raised when the ordered check at priority 50 fails: A backup heart-lung machine can be resolved: either payload.backup_device_id is supplied, or primary_device.backup_device_id is non-null."
  - id: ERR_ECMO_PRIVILEGE_REQUIRED
    http: 422
    condition: "Raised when the ordered check at priority 51 fails: The perfusionist has ecmo_privileged == true (the slot holder when an ECMO_RELIEF slot is created, the case's assigned perfusionist when a run is opened, the relief slot holder on a handoff)."
  - id: ERR_ECMO_STAFFING_BREACH
    http: 409
    condition: "Raised when the ordered check at priority 52 fails: The perfusionist about to staff a new EcmoRun has no other EcmoRun with staffing_breach == true and status IN {RUNNING, RELIEF_PENDING}."
  - id: ERR_RELIEF_SLOT_INVALID
    http: 422
    condition: "Raised when the ordered check at priority 53 fails: The named relief slot has slot_type == ECMO_RELIEF, consumed == false, contract_id == the case's contract_id, the logical clock inside [window_start, window_end), and a perfusionist_id different from run.primary_perfusionist_id."
  - id: ERR_INCIDENT_CASE_NOT_COMPLETE
    http: 409
    condition: "Raised when the ordered check at priority 54 fails: The case named by an incident report has bypass_status IN {OFF_BYPASS, CLOSED} at submission time, and no EcmoRun of the case is still open when the case is closed."
  - id: ERR_INVALID_BACKUP_DEVICE
    http: 422
    condition: "Raised when the ordered check at priority 55 fails: backup_device_id references a different PerfusionDevice row with the same device_class and the same contract_id."
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "Raised when the ordered check at priority 56 fails: Surgeon.npi_code, Perfusionist.employee_code and PerfusionDevice.asset_tag are unique across their entity."
  - id: ERR_PROCEDURE_SPECIALTY_MISMATCH
    http: 422
    condition: "Raised when the ordered check at priority 57 fails: procedure_type is permitted for the surgeon's specialty: ADULT_CARDIAC allows {CABG, VALVE, AORTIC_ARCH, VAD_IMPLANT}, PEDIATRIC_CARDIAC allows {PEDIATRIC_SWITCH, VALVE}, TRANSPLANT allows {TRANSPLANT, VAD_IMPLANT}."
  - id: ERR_SURGEON_NOT_ACTIVE
    http: 422
    condition: "Raised when the ordered check at priority 58 fails: surgeon.status == ACTIVE."
  - id: ERR_NO_ACTIVE_PREFERENCE_CARD
    http: 422
    condition: "Raised when the ordered check at priority 59 fails: The preference-card selector's candidate set for (case.surgeon_id, case.procedure_type) with status == ACTIVE is non-empty."
  - id: ERR_INVALID_SUBSTITUTION_LINE
    http: 422
    condition: "Raised when the ordered check at priority 60 fails: Every substitutions[].line_code exists in the selected preference card's pack_line_items."
  - id: ERR_CROSS_CLAMP_EXCEEDS_PUMP_TIME
    http: 422
    condition: "Raised when the ordered check at priority 61 fails: payload.cross_clamp_minutes <= payload.pump_time_minutes."
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "Raised when the ordered check at priority 62 fails: Every declared interval has a strictly later end than start: scheduled_end > scheduled_start, window_end > window_start, expires_on > issued_on."
  - id: ERR_CASE_START_IN_PAST
    http: 422
    condition: "Raised when the ordered check at priority 63 fails: scheduled_start >= the logical clock at creation time."
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "Raised when the ordered check at priority 64 fails: The requested clock value is greater than or equal to the current logical clock (the logical clock never runs backwards)."
  - id: ERR_CE_ACTIVITY_OUTSIDE_CYCLE
    http: 422
    condition: "Raised when the ordered check at priority 65 fails: activity_date falls inside the half-open window [cert.issued_on, cert.expires_on) of the holder's current CCP certification."
  - id: ERR_ROTATION_SLOT_OVERLAP
    http: 409
    condition: "Raised when the ordered check at priority 66 fails: The new slot's half-open interval [window_start, window_end) does not intersect the interval of any other CallRotationSlot with the same perfusionist_id and status IN {SCHEDULED, ACTIVE}, regardless of contract or slot_type. Half-open semantics mean a slot ending exactly when another starts is allowed."
  - id: ERR_NO_COVERING_CALL_SLOT
    http: 422
    condition: "Raised when the ordered check at priority 67 fails: There exists a CallRotationSlot with perfusionist_id == payload.perfusionist_id, contract_id == case.contract_id, slot_type IN {PRIMARY_CALL, BACKUP_CALL}, status IN {SCHEDULED, ACTIVE} and window_start <= case.scheduled_start AND case.scheduled_end <= window_end."
  - id: ERR_DEVICE_TURNAROUND_CONFLICT
    http: 409
    condition: "Raised when the ordered check at priority 68 fails: Neither the primary nor the resolved backup device is held by another BypassCase (bypass_status IN {PACK_CONFIGURED, SETUP_VERIFIED, ON_BYPASS}) that collides under the buffered CLOSED-interval rule of that check: a collision exists exactly when new.scheduled_start <= other.scheduled_end + DEVICE_TURNAROUND_MINUTES AND other.scheduled_start <= new.scheduled_end + DEVICE_TURNAROUND_MINUTES, the buffer being applied once to the incumbent side of each non-strict comparison, so a raw gap of exactly DEVICE_TURNAROUND_MINUTES between two cases is rejected while a gap of DEVICE_TURNAROUND_MINUTES + 1 minutes passes."
  - id: ERR_PERFUSIONIST_CONCURRENT_CASE_LIMIT
    http: 409
    condition: "Raised when the ordered check at priority 69 fails: Counting only other BypassCase rows whose half-open [scheduled_start, scheduled_end) intersects this case's: fewer than MAX_CONCURRENT_STAFFED_CASES of them share the incoming assigned_perfusionist_id with bypass_status IN {STAFFED, PACK_CONFIGURED, SETUP_VERIFIED}, and exactly zero of them share it with bypass_status == ON_BYPASS."
  - id: ERR_CONTRACT_COVERAGE_INSUFFICIENT
    http: 409
    condition: "Raised when the ordered check at priority 70 fails: contract.coverage_posture IN {COVERED, THIN}, unless payload.acuity == EMERGENT, which is admitted at any posture."
  - id: ERR_SETTLEMENT_PERIOD_INVALID
    http: 422
    condition: "Raised when the ordered check at priority 71 fails: payload.period matches YYYY-MM, its first instant is at or before the logical clock, and it is strictly later than contract.last_settlement_period when that is set."
  - id: ERR_CONTRACT_CASE_CAP_EXCEEDED
    http: 409
    condition: "Raised when the ordered check at priority 72 fails: contract.accrued_case_count < contract.monthly_case_cap, evaluated only when the case is not already holding an accrual slot (billing_status != PROVISIONAL_ACCRUED)."

