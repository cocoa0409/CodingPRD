# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1836 — Water Main Break Response & Repair
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_pipe_segment_applies_defaults
        claim_type: defaults
        grounds: [entities.PipeSegment]
        distinguishing_aspect: "Creating a segment with only required inputs yields condition_status NONE, both counts 0, replaced_at null, version 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1978 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id, cond: $.data.condition_status, off: $.data.repeat_break_count_36mo, prov: $.data.provisional_break_count_36mo, v: $.data.version }
          assert:
            - "PipeSegment.${seg}.condition_status == NONE"
            - "PipeSegment.${seg}.repeat_break_count_36mo == 0 and provisional_break_count_36mo == 0"
            - "PipeSegment.${seg}.replaced_at is null and version == 1"

      - name: create_break_report_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.BreakReport, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required input field source on report intake is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /break-reports"
              payload: { location_description: "12 Nowhere Ln" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_VALIDATION (http 400); no BreakReport is persisted"

      - name: create_segment_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.PipeSegment.fields.condition_status]
        distinguishing_aspect: "Client-supplied value for a system/computed field (condition_status) is ignored; server computes NONE."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: PVC, diameter_inches: 8, install_year: 1999, condition_status: "CANDIDATE" }
              as: PublicWorksEngineer
              captures: { cond: $.data.condition_status }
          assert:
            - "PipeSegment.condition_status == NONE (client-supplied CANDIDATE ignored)"

      - name: get_break_report_not_found_returns_404
        claim_type: not_found
        grounds: [entities.BreakReport, "errors[ERR_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "GET with a well-formed but unknown id returns 404 ERR_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /break-reports/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "http 404 with data.error_id == ERR_NOT_FOUND"
            - "Error envelope carries meta.api_request_id and response_type == \"error\""

      - name: valves_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Sub-resource list honors limit/offset and reports total_count/has_more: 2 valves with limit=1 -> has_more true, total_count 2."
        test_recipe:
          setup: ["Segment with two valves"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: PVC, diameter_inches: 8, install_year: 1999 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
            - call: "POST /valves"
              payload: { valve_code: "V-2", pipe_segment_id: "${seg}", coverage_zone: "Z2", customers_served: 50 }
              as: PublicWorksEngineer
          trigger:
            - call: "GET /pipe-segments/${seg}/valves"
              payload: { limit: 1, offset: 0 }
              as: Dispatcher
              captures: { first_code: "$.data[0].valve_code" }
          assert:
            - "Response data has exactly 1 entry; meta/pagination shows total_count == 2 and has_more == true"
            - "Default limit is 10 when omitted (second call without limit returns both valves, has_more == false)"

      - name: confirm_rejects_invalid_enum
        claim_type: type_constraints
        grounds: [entities.BreakReport.fields.break_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "break_type value outside {CIRCUMFERENTIAL, SPLIT, BLOWOUT} is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["Segment and a REPORTED break"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: PVC, diameter_inches: 8, install_year: 1999 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "12 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
          trigger:
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: "CRACKED", severity: LOW }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_VALIDATION (http 400); break stays REPORTED"

  - section: state_machines
    instances:
      - name: confirm_on_false_alarm_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BreakReport.REPORTED_to_FALSE_ALARM, "errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: break_report_branch_and_rework_loop
          rationale: "Asserted there as the fork-negative: confirm on a FALSE_ALARM break returns ERR_INVALID_STATE."

      - name: terminal_paid_claim_rejects_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DamageClaim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal PAID, both void and deny are rejected with ERR_INVALID_STATE and no money fields move."
        test_recipe:
          setup: ["Confirmed break; claim approved for 60000 then paid (PAID)"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-PINE", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1975 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "9 Pine Ct", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
            - call: "POST /damage-claims"
              payload: { break_report_id: "${br}", claimant_name: "J. Homeowner", claimed_amount_cents: 100000 }
              as: Dispatcher
              captures: { cl: $.data.id }
            - call: "POST /damage-claims/${cl}/approve"
              payload: { approved_amount_cents: 60000 }
              as: ClaimsAdjuster
            - call: "POST /damage-claims/${cl}/pay"
              as: ClaimsAdjuster
          trigger:
            - call: "POST /damage-claims/${cl}/void"
              as: ClaimsAdjuster
              captures: { err_void: $.data.error_id }
            - call: "POST /damage-claims/${cl}/deny"
              as: ClaimsAdjuster
              captures: { err_deny: $.data.error_id }
            - call: "GET /break-reports/${br}"
              as: Dispatcher
              captures: { paid: $.data.total_claims_paid_cents }
          assert:
            - "void on PAID claim -> error_id ERR_INVALID_STATE (http 409)"
            - "deny on PAID claim -> error_id ERR_INVALID_STATE (http 409)"
            - "BreakReport.${br}.total_claims_paid_cents == 60000 (unchanged by rejected transitions)"

      - name: break_report_initial_state_reported
        claim_type: initial_state
        grounds: [state_machines.BreakReport]
        distinguishing_aspect: "A newly created break report starts in REPORTED with version 1 and null pipe_segment_id."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /break-reports"
              payload: { location_description: "12 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { st: $.data.break_status, v: $.data.version, segid: $.data.pipe_segment_id }
          assert:
            - "break_status == REPORTED, version == 1, pipe_segment_id is null"

      - name: new_isolation_plan_supersedes_planned
        claim_type: side_effect_execution
        grounds: [state_machines.IsolationEvent.PLANNED_to_SUPERSEDED]
        distinguishing_aspect: "Creating a second plan (with the current break version) supersedes the prior PLANNED plan without touching valves."
        test_recipe:
          setup: ["Confirmed break (version 2) with valves v1,v2; plan A created for v1"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1978 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-2", pipe_segment_id: "${seg}", coverage_zone: "Z2", customers_served: 80 }
              as: PublicWorksEngineer
              captures: { v2: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "12 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { isoA: $.data.id }
          trigger:
            - call: "GET /break-reports/${br}"
              as: Dispatcher
              captures: { br_v2: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}", "${v2}"], expected_break_report_version: "${br_v2}" }
              as: Dispatcher
              captures: { isoB: $.data.id }
            - call: "GET /break-reports/${br}/isolation-events"
              as: Dispatcher
          assert:
            - "Plan A (${isoA}) isolation_status == SUPERSEDED; plan B (${isoB}) isolation_status == PLANNED"
            - "All valves remain OPEN (supersede does not execute)"

      - name: permit_auto_expires_at_ops_run
        claim_type: valid_transition
        grounds: [state_machines.TrafficPermit.APPROVED_to_EXPIRED, calculations.ops_run_checkpoint]
        distinguishing_aspect: "An APPROVED permit whose valid_to equals the logical clock time flips to EXPIRED at the next ops run (boundary: now >= valid_to)."
        test_recipe:
          setup: ["Confirmed break; permit APPROVED valid [2026-08-10, 2026-08-12)"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: PVC, diameter_inches: 8, install_year: 1999 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "12 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: LOW }
              as: Dispatcher
            - call: "POST /traffic-permits"
              payload: { break_report_id: "${br}", street_block: "OAK-100-BLK", valid_from: "2026-08-10T00:00:00Z", valid_to: "2026-08-12T00:00:00Z", control_plan: LANE_CLOSURE }
              as: Dispatcher
              captures: { perm: $.data.id }
            - call: "POST /traffic-permits/${perm}/approve"
              as: PublicWorksEngineer
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: System
            - call: "POST /ops-runs"
              as: System
            - call: "GET /break-reports/${br}/traffic-permits"
              as: Dispatcher
              captures: { st: "$.data[0].permit_status" }
          assert:
            - "TrafficPermit.${perm}.permit_status == EXPIRED after ops run at exactly valid_to (2026-08-12T00:00:00Z)"

      - name: restoration_flagged_overdue_and_reschedulable
        claim_type: valid_transition
        grounds: [state_machines.RestorationJob.PENDING_to_OVERDUE, state_machines.RestorationJob.OVERDUE_to_SCHEDULED]
        distinguishing_aspect: "A PENDING restoration past repaired_at + 14 days flips to OVERDUE at ops run and can still be scheduled from OVERDUE."
        test_recipe:
          setup:
            - "Break fully repaired at 2026-08-01T00:00:00Z (RestorationJob PENDING)"
            - "Clock advanced to 2026-08-16 (past the 14-day deadline); ops run executed"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-ELM", material: CAST_IRON, diameter_inches: 8, install_year: 1962 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-ELM-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Beta", crew_size: 3, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "100 Elm St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { iso: $.data.id }
            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${br}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/dispatch"
              payload: { crew_id: "${cr}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo}/arrive"
              as: CrewLead
              as_user_id: "${cr}"
            - call: "POST /work-orders/${wo}/complete"
              payload: { actual_pipe_length_ft: 4, labor_hours: 1, materials_used: [] }
              as: CrewLead
              as_user_id: "${cr}"
            - call: "GET /restoration-jobs?work_order_id=${wo}"
              as: Dispatcher
              captures: { rj: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: System
            - call: "POST /ops-runs"
              as: System
          trigger:
            - call: "GET /restoration-jobs/${rj}"
              as: Dispatcher
              captures: { st1: $.data.restoration_status }
            - call: "POST /traffic-permits"
              payload: { break_report_id: "${br}", street_block: "ELM-100-BLK", valid_from: "2026-08-16T00:00:00Z", valid_to: "2026-08-20T00:00:00Z", control_plan: FLAGGING }
              as: Dispatcher
              captures: { perm: $.data.id }
            - call: "POST /traffic-permits/${perm}/approve"
              as: PublicWorksEngineer
            - call: "POST /restoration-jobs/${rj}/schedule"
              payload: { scheduled_start: "2026-08-17T08:00:00Z", scheduled_end: "2026-08-17T16:00:00Z", traffic_permit_id: "${perm}" }
              as: Dispatcher
              captures: { st2: $.data.restoration_status }
          assert:
            - "RestorationJob.${rj}.restoration_status == OVERDUE after the 2026-08-16 ops run (repaired 2026-08-01 + 14d < 2026-08-16)"
            - "Scheduling from OVERDUE succeeds: restoration_status == SCHEDULED"

  - section: calculations
    instances:
      - name: outage_extent_zone_dedup_max
        claim_type: correct_result
        grounds: [calculations.outage_extent_customers]
        distinguishing_aspect: "Two closed valves sharing coverage_zone Z1 (300 and 200 customers) count once by zone max: extent 300, NOT the naive sum 500 (which would auto-issue an advisory)."
        test_recipe:
          setup: ["Segment with two valves both in zone Z1 (300 and 200 customers); break confirmed; plan for both"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-CEDAR", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1970 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-CED-1", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 300 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-CED-2", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 200 }
              as: PublicWorksEngineer
              captures: { v2: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "5 Cedar Rd", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}", "${v2}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { iso: $.data.id }
          trigger:
            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
              captures: { ext: $.data.outage_extent_customers }
            - call: "GET /break-reports/${br}/advisories"
              as: Dispatcher
          assert:
            - "IsolationEvent.${iso}.outage_extent_customers == 300 (zone max, not 300+200=500)"
            - "No advisory is auto-issued (300 < 500): advisories list empty"

      - name: pass_count_reset_blocks_lift
        claim_type: input_set_filtering
        grounds: [calculations.consecutive_pass_count, state_machines.BoilWaterAdvisory.ISSUED_to_LIFTED, "errors[ERR_ADVISORY_TESTS_INSUFFICIENT]"]
        distinguishing_aspect: "After PASS,PASS a single FAIL resets the counter; one more PASS leaves count 1, so lifting is rejected ERR_ADVISORY_TESTS_INSUFFICIENT."
        test_recipe:
          setup: ["Confirmed break; manual advisory issued by wq_officer_1 at 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-WILLOW", material: PVC, diameter_inches: 8, install_year: 1990 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "15 Willow Way", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: LOW }
              as: Dispatcher
            - call: "POST /boil-water-advisories"
              payload: { break_report_id: "${br}" }
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
              captures: { adv: $.data.id }
          trigger:
            - call: "POST /water-quality-tests"
              payload: { advisory_id: "${adv}", sampled_at: "2026-08-02T00:00:00Z", chlorine_residual_mg_l: 0.30, coliform_result: PASS }
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
            - call: "POST /water-quality-tests"
              payload: { advisory_id: "${adv}", sampled_at: "2026-08-03T00:00:00Z", chlorine_residual_mg_l: 0.25, coliform_result: PASS }
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
            - call: "POST /water-quality-tests"
              payload: { advisory_id: "${adv}", sampled_at: "2026-08-04T00:00:00Z", chlorine_residual_mg_l: 0.40, coliform_result: FAIL }
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
              captures: { t3: $.data.test_outcome }
            - call: "POST /water-quality-tests"
              payload: { advisory_id: "${adv}", sampled_at: "2026-08-05T00:00:00Z", chlorine_residual_mg_l: 0.30, coliform_result: PASS }
              as: WaterQualityOfficer
              as_user_id: "wq_officer_1"
            - call: "GET /boil-water-advisories/${adv}"
              as: Dispatcher
              captures: { cnt: $.data.consecutive_pass_count }
            - call: "POST /boil-water-advisories/${adv}/lift"
              as: WaterQualityOfficer
              as_user_id: "wq_officer_2"
              captures: { err: $.data.error_id }
          assert:
            - "FAIL test (coliform FAIL) has test_outcome FAIL even with chlorine 0.40"
            - "consecutive_pass_count == 1 after PASS,PASS,FAIL,PASS"
            - "Lift rejected with error_id ERR_ADVISORY_TESTS_INSUFFICIENT (http 409); advisory stays ISSUED"

      - name: break_cost_rollup_sum_of_components
        claim_type: correct_result
        grounds: [calculations.break_cost_rollup, entities.BreakReport.fields.total_cost_cents]
        distinguishing_aspect: "total_cost_cents equals repair (61000) + restoration (23000) + claims paid (60000) = 144000; approved-but-unpaid liability 45000 stays out of the total."
        test_recipe:
          setup:
            - "Break fully repaired (actual 61000: labor 1h x 6000 + one line 50000 x 1.10 = 55000) and restored (patch 23000)"
            - "Claim X approved 60000 and PAID; claim Y approved 45000 (still APPROVED)"
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-PINE", material: DUCTILE_IRON, diameter_inches: 8, install_year: 1975 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /valves"
              payload: { valve_code: "V-PINE-8", pipe_segment_id: "${seg}", coverage_zone: "Z1", customers_served: 100 }
              as: PublicWorksEngineer
              captures: { v1: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Pine", crew_size: 3, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "9 Pine Ct", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: CIRCUMFERENTIAL, severity: MEDIUM }
              as: Dispatcher
              captures: { br_v: $.data.version }
            - call: "POST /isolation-events"
              payload: { break_report_id: "${br}", valve_ids: ["${v1}"], expected_break_report_version: "${br_v}" }
              as: Dispatcher
              captures: { iso: $.data.id }
            - call: "POST /isolation-events/${iso}/execute"
              as: Dispatcher
            - call: "POST /work-orders"
              payload: { break_report_id: "${br}", est_pipe_length_ft: 4 }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/dispatch"
