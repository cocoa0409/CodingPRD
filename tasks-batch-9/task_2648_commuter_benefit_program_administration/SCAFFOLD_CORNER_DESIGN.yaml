      - name: ratio_cap_uses_floor_not_round_half_up_on_a_half_cent
        claim_type: Precision
        grounds:
          - calculations.election_pretax_exclusion_split.precision
          - entities.Employer.fields.pretax_ratio_cap_pct
        distinguishing_aspect: "The declared precision rule says ratio_cap_cents truncates: 1010 x 45 / 100 = 454.5 exactly, so the split must use 454 (floor) and spill 556. An implementation that reuses the round_half_up helper from the invoice calculation produces 455 / 555 - a one-cent difference that only a deliberate half-cent input can expose."
        test_recipe:
          setup:
            - "Employer 'Truncation Co' is ACTIVE in US-IL-CHI with pretax_ratio_cap_pct 45, spill_policy SPILL_TO_POSTTAX and an ACTIVE TRANSIT_PASS category with monthly_exclusion_limit_cents 30000."
