            - { call: "POST /api/shipments/${s2_id}/dispatch", payload: {}, as: Generator, as_user_id: "${g_id}" }
            - { call: "POST /api/shipments/${s2_id}/deliver", payload: { destination_moisture_pct: 8.0, destination_arsenic_ppm: 3.0 }, as: Offtaker, as_user_id: "${o_id}" }
            - { call: "POST /api/shipments/${s2_id}/accept", payload: {}, as: Offtaker, as_user_id: "${o_id}" }
          trigger:
            - { call: "POST /api/shipments/${s2_id}/void", payload: { reason: "audit failure" }, as: BrokerOps }
            - { call: "GET /api/generators/${g_id}", payload: {}, as: BrokerOps }
            - { call: "GET /api/shipments/${s2_id}/credit-entries", payload: {}, as: BrokerOps }
          assert:
            - "Shipment.${s2_id}.status == VOIDED"
            - "Shipment.${s2_id} has 2 credit entries: ACCRUAL 45.0 and REVERSAL 45.0 (reversal equals original accrual exactly)"
            - "Generator.${g_id}.total_credits == 60.0 (back to the pre-acceptance value)"
            - "Generator.${g_id}.credit_tier == STANDARD (tier re-derived downward)"
            - "SupplyAgreement.${a_id}.delivered_month_to_date_tons == 60.0"
            - "OfftakeCommitment.${k_id}.accepted_month_to_date_tons == 60.0"
