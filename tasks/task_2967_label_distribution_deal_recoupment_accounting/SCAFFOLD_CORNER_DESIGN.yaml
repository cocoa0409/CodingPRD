      - name: spend_decide_priority_conflict_state_before_budget
        claim_type: priority_conflict
        grounds:
          - validations[priority 8 ERR_INVALID_SPEND_STATE]
          - validations[priority 12 ERR_MARKETING_BUDGET_EXCEEDED]
          - endpoints[POST /marketing-spends/{id}/decide]
        distinguishing_aspect: |
          The priority-conflict claim on POST /marketing-spends/{id}/decide: a spend that is both in a
          non-decidable state and over the deal's marketing budget must report the state 409 rather
          than the fiscal 422.
        excluded_because:
          difficulty_instance: spend_decide_state_beats_marketing_budget
          rationale: |
            §1.8 priority_pair_validation_conflict.spend_decide_state_beats_marketing_budget already
            builds exactly this collision — an APPROVED spend re-decided with an amount that would push
            marketing_committed_cents past marketing_budget_cents — and additionally separates the two
            rules by re-running the decide on a SUBMITTED sibling spend to expose the masked 422. A
            second fixture here would assert the same two rule ids in the same order with no extra
            discriminating power.

  - section: endpoints
    instances:
      - name: create_read_and_list_round_trip_echoes_every_stored_field
        claim_type: standard_crud
        grounds:
          - endpoints[POST /distributors]
          - endpoints[GET /distributors/{id}]
          - endpoints[POST /artists]
          - endpoints[GET /artists/{id}]
          - endpoints[POST /distribution-deals]
          - endpoints[GET /distribution-deals]
        distinguishing_aspect: |
          The plain CRUD surface: a created row reads back with every input field byte-identical, every
          computed field at its declared default, version 1 and both timestamps present; the collection
          endpoint honours its declared filter plus limit/offset; and an unknown id on the read path is
          the entity's own 404 rather than a generic one. Omitting the optional
          default_returns_reserve_pct must leave it at its declared null/default rather than inventing
          a value, because the PhysicalRun reserve fallback reads exactly that field.
        test_recipe:
          setup:
            - "an empty database at the 2026-08-01 clock"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1200 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id, dist_v: $.data.version, dist_created: $.data.created_at }
