        distinguishing_aspect: "A recipe drafted at revision 1 and left in DRAFT through a spec change to revision 2 is refused activation with 409 ERR_SPEC_REVISION_STALE, even though its treat rate and its 7.614 prediction both sit inside the new 7.469..7.931 band."
