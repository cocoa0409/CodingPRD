      difficulty_instance: non_linear_state_machine / entry_revision_cycle_loop
      rationale: The INELIGIBLE->UNDER_REVIEW loop, its revision_count increments, and the MAX_REVISIONS cap are asserted by the named §1.8 instance.
  - name: round_demotion_cascade_covered
    claim_type: side_effect_execution
    grounds:
    - state_machines.PanelAssignment.ACTIVE_to_REMOVED
    excluded_because:
      difficulty_instance: transitive_cascade / judge_suspend_cascade_round_demotion
      rationale: Assignment removal and round demotion side effects are asserted by the named §1.8 instance.
