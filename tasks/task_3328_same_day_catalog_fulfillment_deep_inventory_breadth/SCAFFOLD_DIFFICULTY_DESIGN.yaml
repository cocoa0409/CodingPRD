            - call: "POST /orders/${order_id}/lines/${line_id}/pick"
              payload: { requested_units: 2 }
              as: WarehousePicker
              captures: { task_id: $.data.id }
            - call: "POST /orders/${order_id}/lines/${line_id}/pick_complete"
              payload: { actual_units: 2 }
              as: WarehousePicker
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v_ready: $.data.version }
            - call: "POST /orders/${order_id}/confirm_cutoff"
              payload: { expected_order_version: "${order_v_ready}", service_level: "GROUND" }
              as: DCManager
              captures: { shipment_id: $.data.id }
          trigger:
            - call: "POST /distribution-centers/${bos_dc_id}/reeducate"
              payload: { hold_action: "RAISE", reason: "quality hold on the BOS shipping lane" }
              as: DCManager
            - call: "POST /distribution-centers/${bos_dc_id}/reeducate"
              payload: { hold_action: "CLEAR" }
              as: DCManager
          assert:
            - "hop 1 after RAISE: DistributionCenter.${bos_dc_id}.operations_posture == LOCKDOWN"
            - "hop 2 after RAISE: Shipment.${shipment_id}.shipment_status == HELD"
            - "hop 3 after RAISE: CatalogOrder.${order_id}.fulfillment_status == ALLOCATED"
            - "hop 4 after RAISE: CatalogOrderLine.${line_id}.line_status == ALLOCATED and PickTask.${task_id}.pick_status == PICKING with shortage_disposition == NONE"
            - "after CLEAR: DistributionCenter.${bos_dc_id}.operations_posture == OPEN, Shipment.${shipment_id}.shipment_status == CUTOFF_CONFIRMED and CatalogOrder.${order_id}.fulfillment_status == PICKED"
            - "the Shipment's stored freight figures are untouched by the posture cascade: Shipment.${shipment_id}.freight_charge_cents is unchanged across the RAISE and the CLEAR"

  # ===========================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  #   (state, business_constraint) / (auth, state) / (state, business_safety)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: released_order_release_conflict_state_beats_curation
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.CatalogOrder.DRAFT_AWAITING_RELEASE_to_RELEASED_AWAITING_RELEASE
          - errors.ERR_INVALID_STATE
          - errors.ERR_CURATION_NOT_APPROVED
        distinguishing_aspect: "Category pair (state × business_constraint): the order is already RELEASED and its item's curation approval has separately been revoked, so a second release violates both priority 6 and priority 10 — the state check runs first and the caller receives 409 ERR_INVALID_STATE, never 409 ERR_CURATION_NOT_APPROVED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z (Monday), DC BOS local 04:00 before its 06:00:00 cutoff."
            - "Account Riverside Machine in region NORTHEAST; one curated item priced 5000 cents with curation_bundle_size 8; BOS holds 10 units."
            - "One order of 2 units that has already been released, and whose item has since been returned to UNREVIEWED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-5001", description: "Doweling pin 6x40", material_spec: "18-8 stainless steel", long_tail: false, unit_price_cents: 5000, unit_weight_kg: 0.10, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 40, nominal_width_mm: 6, nominal_height_mm: 6, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Pin Diameter", attribute_value: "6.00 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
              captures: { rev_id: $.data.id }
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 2 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "POST /curation-reviews/${rev_id}/revoke"
              payload: {}
              as: CatalogCurator
          trigger:
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_CURATION_NOT_APPROVED — the priority 6 state check pre-empts the priority 10 curation check"
            - "CatalogOrder.${order_id}.order_status is still RELEASED"

      - name: allocate_conflict_auth_beats_state
        grounds:
          - validations[priority=2]
          - validations[priority=6]
          - state_machines.CatalogOrder.RELEASED_AWAITING_RELEASE_to_RELEASED_ALLOCATED
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Category pair (auth × state): a WarehousePicker calling POST /orders/{id}/allocate on an order that is still DRAFT violates the role check at priority 2 and the state check at priority 6 — the caller receives 403 ERR_UNAUTHORIZED, so authorization is resolved before the state machine is even consulted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One account, one curated item and one DRAFT order that has never been released."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-5101", description: "Cotter pin 4x32", material_spec: "zinc plated steel", long_tail: false, unit_price_cents: 4000, unit_weight_kg: 0.10, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 32, nominal_width_mm: 4, nominal_height_mm: 4, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Pin Diameter", attribute_value: "4.00 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 2 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id, order_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: WarehousePicker
              as_user_id: "wp-dana"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "error_id != ERR_INVALID_STATE — the priority 2 role check pre-empts the priority 6 state check"
            - "CatalogOrder.${order_id}.order_status is still DRAFT and fulfillment_status is still AWAITING_RELEASE"
            - "no InventoriedStock.reserved_units was written for the order"

      - name: pick_conflict_state_beats_dc_lockdown
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.PickTask.QUEUED_to_PICKING
          - state_machines.DistributionCenter.LOCKDOWN_to_OPEN
          - errors.ERR_INVALID_STATE
          - errors.ERR_DC_LOCKDOWN
        distinguishing_aspect: "Category pair (state × business_safety): after the DC is locked down the reopened pick task sits at PICKING, so a further pick violates the priority 6 task-state precondition and the priority 8 lockdown gate under one error resolution — the caller receives 409 ERR_INVALID_STATE, proving the lockdown gate is never reached."
