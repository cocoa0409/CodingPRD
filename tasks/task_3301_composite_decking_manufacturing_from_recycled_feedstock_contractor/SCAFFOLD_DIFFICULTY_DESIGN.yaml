  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deliver_to_commitment_met_to_tier_flip_to_cheaper_invoice
        grounds:
          - state_machines.ShipmentOrder.SHIPPED_to_DELIVERED
          - state_machines.StockingCommitment.OPEN_to_MET
          - calculations.dealer_invoicing
        distinguishing_aspect: |
          Depth-3 cascade: DELIVER mutates StockingCommitment.fulfilled_lf;
          crossing committed_lf flips the commitment to MET; the dealer's tier
          derives from MET commitments, so the NEXT order's invoicing computes
          at PREFERRED — each hop is caused by the previous one. Same shaped
          orders price 100000 cents before the cascade and 90000 after.
        test_recipe:
          setup:
            - "fg_store 2000 lf; price book 500 cents/lf, PREFERRED discount 1000 bp; dealer with OPEN commitment 1000 lf already fulfilled 800."
            - "Order F (200 lf) CONFIRMED; will be shipped and delivered to close the commitment."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OpsManager
