  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: amendment_grant_conserves_claims_alive
        grounds:
          - calculations.claims_reconciliation
          - state_machines.AmendmentMotion.transitions.FILED_to_GRANTED
          - entities.Patent.fields.claims_alive
        distinguishing_aspect: |
          Conserved quantity: Patent claim ledger mass. The forward action
          (cancel the original claim) paired with its compensating action (add
          the substitute claim) inside one amendment grant leaves claims_alive
          UNCHANGED: claims_alive + claims_cancelled_count == total_claims
          before and after (5 + 1 == 6).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties P18/O18, patent (5 claims) owned by O18, petition by P18 on claims [1,2,3] INSTITUTED (judge-paul). Phase INSTITUTED (amendment motions allowed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "P18 Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { p18_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "O18 Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { o18_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10000018", title: "Nozzle", issue_date: "2020-05-01T00:00:00Z", owner_id: "${o18_id}", total_claims: 5 }
              as: PlatformAdmin
              captures: { pat18_id: $.data.id, pat18_v: $.data.version }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pat18_id}", petitioner_id: "${p18_id}", review_type: "IPR", challenged_claims: [1, 2, 3], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }, { claim_number: 2, basis: "OBVIOUSNESS_103" }, { claim_number: 3, basis: "ANTICIPATION_102" }], prior_art: [{ reference_type: "PATENT", citation: "US2222222" }], real_party_in_interest: "P18 Corp", fee_paid_cents: 1900000, expected_patent_version: "${pat18_v}" }
              as: Petitioner
              as_user_id: "${p18_id}"
              captures: { pet18_id: $.data.id }
            - call: "POST /ptab/petitions/${pet18_id}/accord-filing-date"
              payload: {}
              as: BoardPanel
            - call: "POST /ptab/petitions/${pet18_id}/decide-institution"
              payload: { per_ground_scores: [{ claim_number: 1, basis: "ANTICIPATION_102", score: 72 }, { claim_number: 2, basis: "OBVIOUSNESS_103", score: 68 }, { claim_number: 3, basis: "ANTICIPATION_102", score: 64 }], lead_judge_user_id: "judge-paul" }
              as: BoardPanel
              captures: { proc18_id: $.data.proceeding_id }
          trigger:
            - call: "POST /ptab/proceedings/${proc18_id}/amendment-motions"
              payload: { substitute_claims: [{ original_claim_number: 1, substitute_text: "1. (substitute) A nozzle comprising ..." }] }
              as: PatentOwner
              as_user_id: "${o18_id}"
              captures: { mtn18_id: $.data.id }
            - call: "POST /ptab/amendment-motions/${mtn18_id}/resolve"
              payload: { outcome: "GRANTED", rationale: "Substitute claim 1 is responsive to the instituted anticipation ground under the PHILLIPS construction." }
              as: BoardPanel
            - call: "GET /ptab/patents/${pat18_id}"
              payload: {}
              as: PlatformAdmin
              captures: { alive18: $.data.claims_alive, tot18: $.data.total_claims, canc18: $.data.claims_cancelled_count, amd18: $.data.claims_amended_count }
            - call: "GET /ptab/proceedings/${proc18_id}"
              payload: {}
              as: BoardPanel
              captures: { slots18: $.data.amendment_slots_available }
          assert:
            - "Patent.${pat18_id}.claims_alive == 5 after the grant — IDENTICAL to the pre-grant value (the swap cancels the original and adds the substitute)"
            - "total_claims == 6 and claims_cancelled_count == 1 and claims_amended_count == 1, so claims_alive + claims_cancelled_count == total_claims (5 + 1 == 6)"
            - "AmendmentMotion.${mtn18_id}.construction_standard == PHILLIPS"
            - "Proceeding.${proc18_id}.amendment_slots_available == 0 (a GRANTED motion consumes its slot; no return)"

      - name: amendment_slot_withdrawal_conserves_cycle_budget
        grounds:
          - calculations.claims_reconciliation
          - state_machines.AmendmentMotion.transitions.FILED_to_WITHDRAWN
          - entities.Proceeding.fields.amendment_slots_available
          - errors[ERR_AMENDMENT_QUOTA_EXCEEDED]
        distinguishing_aspect: |
          Conserved quantity: the per-cycle amendment slot budget — a DIFFERENT
          conserved quantity from the claim-ledger mass. INVARIANT: per
          (proceeding, cycle), amendment_slots_available + count(motions in
          {FILED, GRANTED, DENIED}) == 1. Filing consumes the slot (forward
          action); withdrawing returns it (compensating action); a denial keeps
          it spent.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties P19/O19, patent (4 claims) owned by O19, petition by P19 on claims [1,2] INSTITUTED (judge-quinn). Phase INSTITUTED."
