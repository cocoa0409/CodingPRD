            - { call: "POST /api/bids/${b1_id}/award", as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Hook", brand_standard_ref: "MS-H", quantity_per_room: 1, room_count: 1, unit_budget_cents: 1000 }, as: PurchasingAgent, captures: { s2_id: $.data.id } }
            - { call: "POST /api/spec-items/${s2_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s2_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s2_id}", vendor_name: "VENDA", unit_price_cents: 1000, freight_estimate_cents: 0, lead_time_days: 3 }, as: Vendor, captures: { b2_id: $.data.id } }
            - { call: "POST /api/bids/${b2_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b2_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s1_id}", quantity_ordered: 2, declared_cube_m3: 4 }, as: PurchasingAgent, captures: { l1_id: $.data.id } }
          trigger:
            - { call: "GET /api/projects/${p_id}", as: PurchasingAgent, captures: { posture: $.data.procurement_posture } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s2_id}", quantity_ordered: 1, declared_cube_m3: 1 }, as: PurchasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "FFEProject.${p_id}.procurement_posture == FROZEN (committed 120000 > total 100000)"
            - "Line add rejected 409 with error_id == ERR_PROJECT_BUDGET_FROZEN (posture gate, priority 5, precedes the fiscal line check which would have passed)"

      - name: priority_pair_state_vs_fiscal_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: co_approve_state_before_fiscal
          rationale: "Dual-failure ordering state-over-fiscal is asserted in the named difficulty instance."

