      - name: evidence_endorse_at_exact_score_threshold
        grounds:
          - calculations.evidence_weighted_score
          - validations[priority=12]
          - state_machines.ClinicalEvidenceReview.UNDER_REVIEW_to_ENDORSED
          - entities.ClinicalEvidenceReview.fields.weighted_score
        distinguishing_aspect: |
          A third metric on a third endpoint: the weighted evidence score against
          CONVERT_THRESHOLD 7.00, probed on the endorse endpoint. 6.99 is refused with
          ERR_EVIDENCE_SCORE_BELOW_THRESHOLD, and a re-score whose unrounded weighted
          average is 6.9950 — strictly below the threshold before rounding — is stored as
          7.00 by ROUND_HALF_UP and therefore endorses successfully. The precision claim is
          that the comparison happens on the ROUNDED 2-decimal value, not on the raw sum.
        test_recipe:
          setup:
            - "A DRAFT contract C-CONV with requires_clinical_review true."
            - "A ClinicalEvidenceReview submitted by CR-1 with 6.99 / 6.99 / 6.99, so weighted_score is 6.99, conversion_recommendation DO_NOT_CONVERT, status UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /gpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractManager
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-CONV", supplier_name: "Northline Ortho", category_code: "CAT-ORTHO", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: true, share_basis: "COLLECTED", leakage_alert_threshold_pct: 15.00, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 }, { tier_code: "TIER_2", min_committed_volume_units: 5000, min_compliance_pct: 90.00, discount_bps: 1500 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 }, { min_gross_pool_cents: 100000, holdback_bps: 250 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/clinical-evidence-reviews"
              payload: { contract_id: "${c1}", clinical_efficacy_score: 6.99, safety_score: 6.99, supply_resilience_score: 6.99, summary: "Borderline dossier." }
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { r1: $.data.id, s_lo: $.data.weighted_score, rec_lo: $.data.conversion_recommendation }
          trigger:
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/endorse"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "CR-2"
              expect_error: ERR_EVIDENCE_SCORE_BELOW_THRESHOLD
              expect_status: 409
            - call: "PATCH /gpo/clinical-evidence-reviews/${r1}/scores"
              payload: { clinical_efficacy_score: 7.00, safety_score: 6.90, supply_resilience_score: 7.12 }
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { s_hi: $.data.weighted_score, rec_hi: $.data.conversion_recommendation }
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/endorse"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "CR-2"
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
          assert:
            - "${s_lo} == 6.99 and ${rec_lo} == DO_NOT_CONVERT"
            - "the first endorse returns error_id ERR_EVIDENCE_SCORE_BELOW_THRESHOLD with HTTP 409 and ClinicalEvidenceReview.${r1}.status stays UNDER_REVIEW"
            - "${s_hi} == 7.00 — the unrounded weighted sum is 0.40*7.00 + 0.35*6.90 + 0.25*7.12 == 6.9950, which ROUND_HALF_UP lifts to exactly the 7.00 threshold"
            - "${rec_hi} == CONVERT"
            - "the second endorse succeeds: ClinicalEvidenceReview.${r1}.status == ENDORSED and endorsed_by_user_id == CR-2"
            - "Contract.${c1}.evidence_endorsed == true and the subsequent activate succeeds with Contract.${c1}.status == ACTIVE, proving the exact-threshold endorsement satisfied requires_clinical_review"

