  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601 UTC). Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Setting the clock runs all time-based sweeps: offers past deadline -> EXPIRED; motions OPEN/TABLED with clock > closes_at -> EXPIRED; assessments past due -> DELINQUENT (+late fee once), past due+grace -> DEFAULTED (physician SUSPENDED cascade); board seats past term_end -> successor promoted or VACANT."
    roles: [BoardAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, swept_counts: object }
    side_effects: ["sweeps per description"]

# =============================================================================
# §1.6 Error Code Catalog (39 codes)
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, non-positive amount, or type-specific payload sub-field missing" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role, or missing X-User-ID for entity-backed role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_RESOURCE_OWNERSHIP, http: 403, condition: "Physician caller acts on a resource owned by another physician" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the current entity version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid state: transition not allowed from current status, EXITED physician mutated, seat holder not SHAREHOLDER/suspended, sponsor ineligible, committee DISSOLVED, appraisal final blocks dispute" }
  - { id: ERR_MOTION_NOT_OPEN, http: 409, condition: "Vote cast or table attempted while motion is not OPEN" }
  - { id: ERR_MOTION_TERMINAL, http: 409, condition: "Operation on a terminal motion (incl. superseding a terminal motion)" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "Close attempted with non-voided ballots < board_quorum_count" }
  - { id: ERR_OFFER_NOT_OPEN, http: 409, condition: "Respond/pay on an offer not in OFFERED (respond) or ACCEPTED (pay)" }
  - { id: ERR_ASSESSMENT_NOT_PAYABLE, http: 409, condition: "Pay on an assessment in PAID or DEFAULTED status" }
  - { id: ERR_COMMITTEE_IMPAIRED, http: 409, condition: "Opening a CHARTER_AMENDMENT motion whose committee is not ACTIVE" }
  - { id: ERR_VALUATION_NOT_APPRAISED, http: 409, condition: "Finalize attempted while valuation is not APPRAISED" }
  - { id: ERR_BUYOUT_NOT_APPROVED, http: 409, condition: "Finalize without an ADOPTED BUYOUT_APPROVAL motion linking this valuation (or motion already consumed)" }
  - { id: ERR_MERGER_NOT_APPROVED, http: 409, condition: "decide APPROVED/REJECTED without a matching terminal MERGER motion" }
  - { id: ERR_VOTER_INELIGIBLE, http: 409, condition: "Voter not in the eligible snapshot, or standing no longer GOOD_STANDING at cast time" }
  - { id: ERR_VOTER_RECUSED, http: 409, condition: "Voter recused from this motion via FLAGGED COI disclosure" }
  - { id: ERR_COI_REVIEW_PENDING, http: 409, condition: "Voter has an unreviewed FILED COI disclosure related to this motion" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Sponsor voting on own COMP_POLICY motion, or COMPENSATION committee CHAIR sponsoring a COMP_POLICY motion" }
  - { id: ERR_VOTING_CLOSED, http: 409, condition: "Ballot cast at or after closes_at (cast allowed only while clock < closes_at)" }
  - { id: ERR_TERM_WINDOW_INVALID, http: 409, condition: "term_end <= term_start" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "Physician already has a CAST (non-voided) vote on this motion" }
  - { id: ERR_SEAT_TERM_OVERLAP, http: 409, condition: "Successor term_start < current term_end (half-open intervals; start == current end is allowed)" }
  - { id: ERR_SUCCESSOR_ALREADY_BOOKED, http: 409, condition: "Seat already has a booked successor" }
  - { id: ERR_OFFER_WINDOW_OVERLAP, http: 409, condition: "Physician already has an OFFERED offer whose acceptance window is still open (closed interval)" }
  - { id: ERR_COMMITTEE_FULL, http: 409, condition: "Committee already has max_committee_members members" }
  - { id: ERR_CHAIR_ALREADY_ASSIGNED, http: 409, condition: "Committee already has a CHAIR" }
  - { id: ERR_DUPLICATE_MEMBERSHIP, http: 409, condition: "Physician already a member of this committee" }
  - { id: ERR_DISPUTE_LIMIT_REACHED, http: 409, condition: "dispute_rounds == max_dispute_rounds; arbitration is the only path forward" }
  - { id: ERR_MERGER_ALREADY_ACTIVE, http: 409, condition: "Another merger proposal is non-terminal (PROPOSED/DUE_DILIGENCE/NEGOTIATION)" }
  - { id: ERR_POLICY_ALREADY_EXISTS, http: 409, condition: "GovernancePolicy singleton already exists" }
  - { id: ERR_PHYSICIAN_EXITING, http: 409, condition: "EXITING physician blocked from new buy-in offers and motion sponsorship" }
  - { id: ERR_NO_ELIGIBLE_RECIPIENTS, http: 409, condition: "DISTRIBUTION motion with zero eligible shareholders (SHAREHOLDER and not SUSPENDED); checked at creation and re-checked at adoption" }
  - { id: ERR_EXIT_ALREADY_IN_PROGRESS, http: 409, condition: "Physician already has a non-terminal ExitValuation" }
  - { id: ERR_OVERPAYMENT, http: 409, condition: "Payment amount exceeds remaining due (amount == remaining succeeds exactly)" }
  - { id: ERR_DISTRIBUTION_CAP_EXCEEDED, http: 409, condition: "Distribution amount exceeds distributable_cap_cents" }
  - { id: ERR_INSUFFICIENT_TREASURY_SHARES, http: 409, condition: "Share issuance exceeds treasury_shares" }
  - { id: ERR_INSTALLMENT_AMOUNT_MISMATCH, http: 409, condition: "Installment payment does not equal the scheduled installment amount" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BoardAdmin
    description: "Group administrative operator: onboarding, seats, committees, offers, billing, appraisal, finalization, sweeps"
    identity: opaque
    exclusive_operations:
      - "POST /governance/policy, PATCH /governance/policy"
      - "POST /governance/physicians, POST /governance/physicians/{id}/standing"
      - "POST /governance/board-seats, POST /governance/board-seats/{id}/appoint"
      - "POST /governance/committees and member/dissolve operations"
      - "POST /governance/buy-in-offers"
      - "POST /governance/motions/{id}/close"
      - "POST /governance/capital-calls/{id}/bill"
      - "POST /governance/distributions/{id}/void and allocation pay"
      - "POST /governance/exit-valuations appraise/arbitrate/finalize"
      - "POST /governance/merger-proposals and advance/decide"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /governance/motions (sponsor_physician_id supplied in body)"
      - "POST /governance/motions propose/open/table/resume/withdraw"
      - "POST /governance/buy-in-offers/{id}/pay-installment"
      - "POST /governance/capital-call-assessments/{id}/pay"
      - "POST /governance/exit-valuations (on behalf of a physician)"
      - "All GET endpoints"
  - name: Physician
    description: "A physician of the group; shareholder powers depend on partnership_status and standing"
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /governance/motions/{id}/votes (voter = self)"
      - "POST /governance/buy-in-offers/{id}/respond (own offer)"
      - "POST /governance/exit-valuations/{id}/dispute (own valuation)"
      - "POST /governance/coi-disclosures (filer = self)"
    shared_operations:
      - "POST /governance/motions (as sponsor; sponsor_physician_id must equal X-User-ID)"
      - "POST /governance/motions propose/open/table/resume/withdraw (own motions)"
      - "POST /governance/buy-in-offers/{id}/pay-installment (own offer)"
      - "POST /governance/capital-call-assessments/{id}/pay (own assessment)"
      - "POST /governance/exit-valuations (self)"
      - "GET endpoints"
  - name: ComplianceOfficer
    description: "Independent compliance reviewer; the ONLY role that may review COI disclosures (segregation of duties: filer != reviewer, admin != reviewer)"
    identity: opaque
    exclusive_operations:
      - "POST /governance/coi-disclosures/{id}/review"
    shared_operations:
      - "GET endpoints"
