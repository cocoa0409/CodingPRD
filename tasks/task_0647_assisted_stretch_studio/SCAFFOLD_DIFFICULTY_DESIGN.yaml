# =============================================================================
# task_0647_assisted_stretch_studio — §1.8 Scaffold Difficulty Design
# Test Targeting Index — 9 Difficulty Rules x >=2 instances each (>=18 total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# All setup_api_calls / trigger entries are structured calls executable empty-DB
# forward. Server logical-clock startup default = 2026-04-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ----- #A: Booking-domain dual variant (NO_SHOW flat vs LATE_CANCEL prorated)
      - name: no_show_fee_flat_vs_prorated_on_booking
        grounds:
          - calculations.no_show_fee
          - state_machines.Booking.schedule_status.CONFIRMED_to_NO_SHOW
          - state_machines.Booking.schedule_status.CONFIRMED_to_LATE_CANCELLED
          - entities.Booking.fields.fee_charged_cents
        distinguishing_aspect: |
          Same Booking (list_price_cents=6500, Location.no_show_fee_cents=5000,
          late_cancel_pct=0.50): a NO_SHOW charges the FLAT 5000 while a LATE_CANCEL
          charges the PRORATED round_half_up(6500*0.50)=3250 — the variant lives on
          the Booking entity domain (distinct from the Membership freeze variant).
        test_recipe:
          setup:
            - "Location with no_show_fee_cents=5000, late_cancel_pct=0.50, cancel_window_hours=12, open 0..1440."
            - "Two ASSISTED_STRETCH services (credit_cost=2, list_price_cents=6500, duration 50) and a member with intro completed."
            - "Two CONFIRMED bookings funded by a membership: one will be late-cancelled, one will be no-show-swept."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: StudioManager
            - call: "POST /locations"
              payload: { name: "Downtown", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_cents: 5000, late_cancel_pct: 0.50, cancel_window_hours: 12 }
              as: StudioManager
              captures: { loc: $.data.id }
            - call: "POST /flexologists"
              payload: { location_id: "${loc}", full_name: "Flex Intro", certified_intro: true }
              as: StudioManager
              captures: { flex: $.data.id }
            - call: "POST /tables"
              payload: { location_id: "${loc}", label: "T1" }
              as: StudioManager
              captures: { tbl: $.data.id }
            - call: "POST /tables"
              payload: { location_id: "${loc}", label: "T2" }
              as: StudioManager
              captures: { tbl2: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "Intro", kind: "INTRO", duration_minutes: 25, credit_cost: 0, list_price_cents: 0 }
              as: StudioManager
              captures: { svc_intro: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "50m Stretch", kind: "ASSISTED_STRETCH", duration_minutes: 50, credit_cost: 2, list_price_cents: 6500 }
              as: StudioManager
              captures: { svc: $.data.id }
            - call: "POST /members"
              payload: { home_location_id: "${loc}", full_name: "Mia", email: "mia@x.com" }
              as: FrontDesk
              captures: { mem: $.data.id }
            # complete the intro so non-INTRO bookings are allowed
            - call: "POST /credit-packs"
              payload: { member_id: "${mem}", location_id: "${loc}", pack_credits: 1, base_unit_price_cents: 100, expires_utc: "2027-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { pack0: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc_intro}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-04-11T10:00:00Z", funding_source: "CREDIT_PACK", funding_id: "${pack0}" }
              as: FrontDesk
              captures: { b_intro: $.data.id }
            - call: "POST /bookings/${b_intro}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T10:30:00Z" }
              as: StudioManager
            - call: "POST /bookings/${b_intro}/complete"
              payload: { assessment_shoulder: 80, assessment_hip: 70, assessment_spine: 60, assessment_ankle: 50 }
              as: Flexologist
              as_user_id: "${flex}"
            # membership now allowed (intro_completed true)
            - call: "POST /memberships"
              payload: { member_id: "${mem}", location_id: "${loc}", tier: "PRO", monthly_fee_cents: 12000, included_credits: 8, rollover_cap: 4 }
              as: FrontDesk
              captures: { ship: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-12T00:00:00Z" }
              as: StudioManager
            # booking A -> will be late-cancelled
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-04-13T10:00:00Z", funding_source: "MEMBERSHIP", funding_id: "${ship}" }
              as: FrontDesk
              captures: { bA: $.data.id }
            - call: "POST /bookings/${bA}/confirm"
              payload: {}
              as: FrontDesk
            # booking B -> will be no-show-swept (different table to avoid overlap)
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc}", flexologist_id: "${flex}", table_id: "${tbl2}", session_start_utc: "2026-04-14T10:00:00Z", funding_source: "MEMBERSHIP", funding_id: "${ship}" }
              as: FrontDesk
              captures: { bB: $.data.id }
            - call: "POST /bookings/${bB}/confirm"
              payload: {}
              as: FrontDesk
          trigger:
            # LATE_CANCEL: clock 2026-04-12T23:00Z is inside 12h window before 04-13T10:00Z
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-12T23:00:00Z" }
              as: StudioManager
            - call: "POST /bookings/${bA}/cancel"
              payload: {}
              as: FrontDesk
              captures: { feeA: $.data.fee_charged_cents }
            # NO_SHOW: advance clock past bB's session_end and sweep
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-14T11:30:00Z" }
              as: StudioManager
            - call: "POST /_ops/no_show_sweep"
              payload: {}
              as: StudioManager
          assert:
            - "Booking.${bA}.schedule_status == LATE_CANCELLED"
            - "Booking.${bA}.fee_charged_cents == 3250"
            - "Booking.${bB}.schedule_status == NO_SHOW"
            - "Booking.${bB}.fee_charged_cents == 5000"
            - "Booking.${bA}.fee_charged_cents != Booking.${bB}.fee_charged_cents"

      # ----- #B: Membership-domain dual variant (CALENDAR_30 vs ACTUAL_CYCLE)
      - name: freeze_proration_calendar30_vs_actual_cycle_on_membership
        grounds:
          - calculations.membership_freeze_proration
          - state_machines.Membership.status.ACTIVE_to_FROZEN
          - entities.Membership.fields.freeze_credit_cents
        distinguishing_aspect: |
          A 10-day freeze on a monthly_fee_cents=12000 membership anchored in May
          (31-day cycle): the PERSISTED CALENDAR_30 variant yields 12000*10/30=4000,
          whereas the divergent ACTUAL_CYCLE reading yields 12000*10/31=3871 — the
          dual variant operates on the Membership domain, not Booking.
        test_recipe:
          setup:
            - "Member with intro completed; ACTIVE PRO membership monthly_fee_cents=12000, cycle anchored 2026-05-01."
            - "No bookings inside the freeze span so the cascade does not perturb freeze_credit_cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /locations"
              payload: { name: "May Loc", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: StudioManager
              captures: { loc: $.data.id }
            - call: "POST /flexologists"
              payload: { location_id: "${loc}", full_name: "Flex", certified_intro: true }
              as: StudioManager
              captures: { flex: $.data.id }
            - call: "POST /tables"
              payload: { location_id: "${loc}", label: "T1" }
              as: StudioManager
              captures: { tbl: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "Intro", kind: "INTRO", duration_minutes: 25, credit_cost: 0, list_price_cents: 0 }
              as: StudioManager
              captures: { svc_intro: $.data.id }
            - call: "POST /members"
              payload: { home_location_id: "${loc}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { mem: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${mem}", location_id: "${loc}", pack_credits: 1, base_unit_price_cents: 100, expires_utc: "2027-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { pack0: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc_intro}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-05-02T10:00:00Z", funding_source: "CREDIT_PACK", funding_id: "${pack0}" }
              as: FrontDesk
              captures: { b_intro: $.data.id }
            - call: "POST /bookings/${b_intro}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T10:30:00Z" }
              as: StudioManager
            - call: "POST /bookings/${b_intro}/complete"
              payload: { assessment_shoulder: 90, assessment_hip: 85, assessment_spine: 80, assessment_ankle: 70 }
              as: Flexologist
              as_user_id: "${flex}"
            - call: "POST /memberships"
              payload: { member_id: "${mem}", location_id: "${loc}", tier: "PRO", monthly_fee_cents: 12000, included_credits: 8, rollover_cap: 4 }
              as: FrontDesk
              captures: { ship: $.data.id, ship_v: $.data.version }
          trigger:
            # 10-day freeze 2026-05-05 .. 2026-05-15
            - call: "POST /memberships/${ship}/freeze"
              payload: { freeze_start_utc: "2026-05-05T00:00:00Z", freeze_end_utc: "2026-05-15T00:00:00Z", expected_membership_version: "${ship_v}" }
              as: Member
              as_user_id: "${mem}"
              captures: { fc: $.data.freeze_credit_cents }
          assert:
            - "Membership.${ship}.status == FROZEN"
            - "Membership.${ship}.freeze_credit_cents == 4000"
            - "Membership.${ship}.freeze_credit_cents != 3871"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ----- mode (a): >=3 inputs, tiered, nonlinear (credit_pack_price)
      - name: credit_pack_price_tiered_three_inputs
        grounds:
          - calculations.credit_pack_price
          - entities.CreditPack.fields.price_cents
          - state_machines.CreditPack.status.ACTIVE
        distinguishing_aspect: |
          credit_pack_price selects a discount tier by pack_credits (>=20/>=10/>=5/else)
          then combines base_unit_price_cents, pack_credits, and PROCESSING_FEE_CENTS:
          base=4500,credits=10 -> 45000*0.90=40500 +300 = 40800 (mode (a): >=3 inputs,
          conditional tier selection).
        test_recipe:
          setup:
            - "A member at a location; buying a 10-credit pack at base_unit_price_cents=4500 selects the 10% tier."
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "Pack Loc" }
              as: StudioManager
              captures: { loc: $.data.id }
            - call: "POST /members"
              payload: { home_location_id: "${loc}", full_name: "Pat", email: "pat@x.com" }
              as: FrontDesk
              captures: { mem: $.data.id }
          trigger:
            - call: "POST /credit-packs"
              payload: { member_id: "${mem}", location_id: "${loc}", pack_credits: 10, base_unit_price_cents: 4500, expires_utc: "2027-01-01T00:00:00Z" }
              as: Member
              as_user_id: "${mem}"
              captures: { price: $.data.price_cents }
          assert:
            - "CreditPack.price_cents == 40800"
            - "CreditPack.status == ACTIVE"
            - "CreditPack.available_credits == 10"

      # ----- mode (b): nested rounding order matters (intro_assessment_score)
      - name: assessment_round_once_vs_sum_of_rounded_terms
        grounds:
          - calculations.intro_assessment_score
          - state_machines.Booking.schedule_status.CONFIRMED_to_COMPLETED
          - entities.Member.fields.mobility_tier
        distinguishing_aspect: |
          Sub-scores (55,55,55,55) give weighted terms 16.5/16.5/13.75/8.25. The PINNED
          order (sum then round_half_up ONCE) yields composite=55 (FOUNDATION); the naive
          round-each-term-then-sum yields 17+17+14+8=56. Rounding order is the distinction
          (mode (b)), different from credit_pack_price's tier selection (mode (a)).
        test_recipe:
          setup:
            - "Member with no intro yet; one INTRO service, certified flexologist, funded by a 1-credit pack."
          setup_api_calls:
            - call: "POST /locations"
              payload: { name: "Assess Loc", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: StudioManager
              captures: { loc: $.data.id }
            - call: "POST /flexologists"
              payload: { location_id: "${loc}", full_name: "FlexC", certified_intro: true }
              as: StudioManager
              captures: { flex: $.data.id }
            - call: "POST /tables"
              payload: { location_id: "${loc}", label: "T1" }
              as: StudioManager
              captures: { tbl: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "Intro", kind: "INTRO", duration_minutes: 25, credit_cost: 0, list_price_cents: 0 }
              as: StudioManager
              captures: { svc_intro: $.data.id }
            - call: "POST /members"
              payload: { home_location_id: "${loc}", full_name: "Rob", email: "rob@x.com" }
              as: FrontDesk
              captures: { mem: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${mem}", location_id: "${loc}", pack_credits: 1, base_unit_price_cents: 100, expires_utc: "2027-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { pack0: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc_intro}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-04-11T10:00:00Z", funding_source: "CREDIT_PACK", funding_id: "${pack0}" }
              as: FrontDesk
              captures: { b_intro: $.data.id }
            - call: "POST /bookings/${b_intro}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T10:30:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /bookings/${b_intro}/complete"
              payload: { assessment_shoulder: 55, assessment_hip: 55, assessment_spine: 55, assessment_ankle: 55 }
              as: Flexologist
              as_user_id: "${flex}"
              captures: { tier: $.data.is_intro }
          assert:
            - "Member.${mem}.mobility_tier == FOUNDATION"
            - "Member.${mem}.intro_completed == true"
            - "Booking.${b_intro}.schedule_status == COMPLETED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ----- cyclic on Membership
      - name: membership_active_frozen_active_cycle
        grounds:
          - state_machines.Membership.status.ACTIVE_to_FROZEN
          - state_machines.Membership.status.FROZEN_to_ACTIVE
          - entities.Membership.fields.version
        distinguishing_aspect: |
          Membership follows the cycle ACTIVE -> FROZEN -> ACTIVE (a non-linear loop),
          with version incrementing 1 -> 2 -> 3; the entity is Membership (distinct from
          the Booking parallel-dimension instance).
        test_recipe:
          setup:
            - "Member with intro completed; ACTIVE membership version=1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /locations"
              payload: { name: "Cyc Loc", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: StudioManager
              captures: { loc: $.data.id }
            - call: "POST /flexologists"
              payload: { location_id: "${loc}", full_name: "Flex", certified_intro: true }
              as: StudioManager
              captures: { flex: $.data.id }
            - call: "POST /tables"
              payload: { location_id: "${loc}", label: "T1" }
              as: StudioManager
              captures: { tbl: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "Intro", kind: "INTRO", duration_minutes: 25, credit_cost: 0, list_price_cents: 0 }
              as: StudioManager
              captures: { svc_intro: $.data.id }
            - call: "POST /members"
              payload: { home_location_id: "${loc}", full_name: "Cy", email: "cy@x.com" }
              as: FrontDesk
              captures: { mem: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${mem}", location_id: "${loc}", pack_credits: 1, base_unit_price_cents: 100, expires_utc: "2027-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { pack0: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc_intro}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-05-02T10:00:00Z", funding_source: "CREDIT_PACK", funding_id: "${pack0}" }
              as: FrontDesk
              captures: { b_intro: $.data.id }
            - call: "POST /bookings/${b_intro}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T10:30:00Z" }
              as: StudioManager
            - call: "POST /bookings/${b_intro}/complete"
              payload: { assessment_shoulder: 90, assessment_hip: 85, assessment_spine: 80, assessment_ankle: 70 }
              as: Flexologist
              as_user_id: "${flex}"
            - call: "POST /memberships"
              payload: { member_id: "${mem}", location_id: "${loc}", tier: "PLUS", monthly_fee_cents: 9000, included_credits: 6, rollover_cap: 2 }
              as: FrontDesk
              captures: { ship: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /memberships/${ship}/freeze"
              payload: { freeze_start_utc: "2026-05-10T00:00:00Z", freeze_end_utc: "2026-05-12T00:00:00Z", expected_membership_version: "${v1}" }
              as: Member
              as_user_id: "${mem}"
              captures: { v2: $.data.version }
            - call: "POST /memberships/${ship}/unfreeze"
              payload: { expected_membership_version: "${v2}" }
              as: Member
              as_user_id: "${mem}"
              captures: { v3: $.data.version }
          assert:
            - "Membership.${ship}.status == ACTIVE"
            - "Membership.${ship}.version == 3"

      # ----- parallel dimensions on Booking
      - name: booking_parallel_schedule_and_credit_dimensions
        grounds:
          - state_machines.Booking.schedule_status.CONFIRMED_to_COMPLETED
          - state_machines.Booking.credit_status.HELD_to_CONSUMED
          - entities.Booking.fields.schedule_status
          - entities.Booking.fields.credit_status
        distinguishing_aspect: |
          A single Booking row carries two independent state fields: schedule_status
          (REQUESTED->CONFIRMED->COMPLETED) and credit_status (HELD->CONSUMED). The
          schedule axis advances on confirm while credit stays HELD; only complete flips
          credit to CONSUMED — parallel dimensions on the Booking entity (distinct from
          the Membership cyclic instance).
        test_recipe:
          setup:
            - "Member with intro completed, ACTIVE membership granting 8 credits."
            - "One ASSISTED_STRETCH booking (credit_cost=2) created (REQUESTED/HELD)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: StudioManager
            - call: "POST /locations"
              payload: { name: "Par Loc", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: StudioManager
              captures: { loc: $.data.id }
            - call: "POST /flexologists"
              payload: { location_id: "${loc}", full_name: "Flex", certified_intro: true }
              as: StudioManager
              captures: { flex: $.data.id }
            - call: "POST /tables"
              payload: { location_id: "${loc}", label: "T1" }
              as: StudioManager
              captures: { tbl: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "Intro", kind: "INTRO", duration_minutes: 25, credit_cost: 0, list_price_cents: 0 }
              as: StudioManager
              captures: { svc_intro: $.data.id }
            - call: "POST /services"
              payload: { location_id: "${loc}", name: "50m", kind: "ASSISTED_STRETCH", duration_minutes: 50, credit_cost: 2, list_price_cents: 6000 }
              as: StudioManager
              captures: { svc: $.data.id }
            - call: "POST /members"
              payload: { home_location_id: "${loc}", full_name: "Pia", email: "pia@x.com" }
              as: FrontDesk
              captures: { mem: $.data.id }
            - call: "POST /credit-packs"
              payload: { member_id: "${mem}", location_id: "${loc}", pack_credits: 1, base_unit_price_cents: 100, expires_utc: "2027-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { pack0: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc_intro}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-04-11T08:00:00Z", funding_source: "CREDIT_PACK", funding_id: "${pack0}" }
              as: FrontDesk
              captures: { b_intro: $.data.id }
            - call: "POST /bookings/${b_intro}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T08:30:00Z" }
              as: StudioManager
            - call: "POST /bookings/${b_intro}/complete"
              payload: { assessment_shoulder: 90, assessment_hip: 85, assessment_spine: 80, assessment_ankle: 70 }
              as: Flexologist
              as_user_id: "${flex}"
            - call: "POST /memberships"
              payload: { member_id: "${mem}", location_id: "${loc}", tier: "PRO", monthly_fee_cents: 12000, included_credits: 8, rollover_cap: 4 }
              as: FrontDesk
              captures: { ship: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem}", location_id: "${loc}", service_id: "${svc}", flexologist_id: "${flex}", table_id: "${tbl}", session_start_utc: "2026-04-13T10:00:00Z", funding_source: "MEMBERSHIP", funding_id: "${ship}" }
              as: FrontDesk
              captures: { bk: $.data.id }
          trigger:
            - call: "POST /bookings/${bk}/confirm"
              payload: {}
              as: FrontDesk
              captures: { cs_after_confirm: $.data.credit_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-13T10:30:00Z" }
              as: StudioManager
            - call: "POST /bookings/${bk}/complete"
              payload: {}
              as: Flexologist
              as_user_id: "${flex}"
          assert:
            - "Booking.${bk}.schedule_status == COMPLETED"
            - "Booking.${bk}.credit_status == CONSUMED"
            - "Membership.${ship}.consumed_credits == 2"
            - "Membership.${ship}.held_credits == 0"
            - "Membership.${ship}.available_credits == 6"

  # ===========================================================================
