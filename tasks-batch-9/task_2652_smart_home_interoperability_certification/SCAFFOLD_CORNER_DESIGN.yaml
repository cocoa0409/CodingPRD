            - "REVOKE yields onboarding_state == \"TOOLS_REVOKED\" and good_standing == false; the following GRANT returns to \"TOOLS_GRANTED\" with good_standing == true"
            - "The final GET shows onboarding_state == \"TOOLS_GRANTED\", good_standing == true, ip_withdrawn_at null, open_case_count == 0 and version == 4 (create, ip-commitment, grant, revoke, grant = 5 writes minus the 2 refused ones -> exactly 4 successful state writes after creation)"

      - name: plugfest_close_marks_no_shows_and_drops_the_distinct_vendor_count
        claim_type: side_effect_execution
        grounds:
          - state_machines.Plugfest.transitions.LOCKED_to_CLOSED
          - state_machines.PlugfestParticipation.transitions.REGISTERED_to_NO_SHOW
          - calculations.plugfest_distinct_vendor_count
          - validations[priority=20]
          - validations[priority=21]
        distinguishing_aspect: >
          Closing an event cascades REGISTERED -> NO_SHOW over its participations and, because NO_SHOW
          rows leave the counted set, distinct_vendor_count FALLS from 2 to 1 - the aggregate is not
          monotonic. A PASS recorded before the close survives and keeps its plugfest credit; a second
          record-outcome on the same participation is refused with ERR_INVALID_PARTICIPATION_STATE
          while the event is still LOCKED, and every registration after the lock is refused with
          ERR_INVALID_PLUGFEST_STATE.
