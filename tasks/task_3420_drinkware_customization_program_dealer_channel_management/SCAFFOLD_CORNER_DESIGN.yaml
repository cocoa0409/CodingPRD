              as: Buyer
              as_user_id: "buyer-std"
              captures: { err_closed: $.data.error_id }
          assert:
            - "slot_state == CLOSED (lazy evaluation on read)"
            - "err_closed == ERR_SLOT_NOT_OPEN (409)"
            - "CustomizationOrder.${c_order}.reservation_status stays NONE"

      - name: infraction_expiry_decays_points_but_status_waits_for_reinstate
        claim_type: Side Effect Execution
        grounds:
          - calculations.dealer_infraction_points
          - state_machines.Dealer
          - state_machines.EnforcementCase.CONFIRMED_VIOLATION_to_OVERTURNED
        distinguishing_aspect: "Points decay purely by clock (two MAP cases expire after 365 days, dropping the dealer from 8 to 0) yet the dealer stays PROBATION — standing relaxes only through the manual reinstate, which then lands AUTHORIZED because recomputed points < 8."
        test_recipe:
          setup:
            - "Dealer authorized via the canonical fork-join chain. Two MAP_VIOLATION cases confirmed at clock 2026-09-11 (points 4 + 4 = 8 -> PROBATION)."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_app
            - *c_sched
            - *c_clock2
            - *c_record
            - *c_docs
            - *c_decide
            - call: "POST /drinkware/enforcement-cases"
              payload: { marketplace: "AMAZON", seller_handle: "map-x1", listing_url: "https://amazon.example/d/x1", matched_dealer_id: "${c_dealer}" }
              as: ChannelManager
              as_user_id: "cm-enf"
              captures: { case_x1: $.data.id }
            - call: "POST /drinkware/enforcement-cases"
              payload: { marketplace: "EBAY", seller_handle: "map-x2", listing_url: "https://ebay.example/i/x2", matched_dealer_id: "${c_dealer}" }
              as: ChannelManager
              as_user_id: "cm-enf"
              captures: { case_x2: $.data.id }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /drinkware/dealers/${c_dealer}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { c_dealer_v2: $.data.version }
            - call: "POST /drinkware/enforcement-cases/${case_x1}/resolve"
              payload: { outcome: "CONFIRMED_VIOLATION", infraction_category: "MAP_VIOLATION", resolution_notes: "first", expected_dealer_version: "${c_dealer_v2}" }
              as: ChannelManager
              as_user_id: "cm-1"
            - call: "GET /drinkware/dealers/${c_dealer}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { c_dealer_v3: $.data.version }
            - call: "POST /drinkware/enforcement-cases/${case_x2}/resolve"
              payload: { outcome: "CONFIRMED_VIOLATION", infraction_category: "MAP_VIOLATION", resolution_notes: "second", expected_dealer_version: "${c_dealer_v3}" }
              as: ChannelManager
              as_user_id: "cm-1"
          trigger:
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /drinkware/enforcement-cases/${case_x1}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { case_x1_state: $.data.infraction_state }
            - call: "GET /drinkware/dealers/${c_dealer}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { decayed_points: $.data.infraction_points, decayed_status: $.data.status }
            - call: "POST /drinkware/dealers/${c_dealer}/reinstate"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
          assert:
            - "case_x1_state == EXPIRED (issued 2026-09-11 + 365 days < clock 2027-09-12)"
            - "decayed_points == 0 but decayed_status == PROBATION (expiry never auto-restores standing)"
            - "after reinstate: Dealer.${c_dealer}.status == AUTHORIZED (recomputed 0 < 8)"

      - name: escalate_legal_then_confirm_branch
        claim_type: Valid Transition
        grounds:
          - state_machines.EnforcementCase
        distinguishing_aspect: "The branching resolve supports UNDER_REVIEW -> ESCALATED_LEGAL -> CONFIRMED_VIOLATION: escalation is not terminal, and the later confirmation still applies the points table (BRAND_STANDARD = 3) with dealer OCC."
        test_recipe:
          setup:
            - "Clock set; dealer authorized via canonical chain; two enforcement cases matched to the dealer."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_app
            - *c_sched
            - *c_clock2
            - *c_record
            - *c_docs
            - *c_decide
            - call: "POST /drinkware/enforcement-cases"
              payload: { marketplace: "WALMART", seller_handle: "brand-abuser", listing_url: "https://walmart.example/i/b1", matched_dealer_id: "${c_dealer}" }
              as: ChannelManager
              as_user_id: "cm-enf"
              captures: { case_b1: $.data.id }
            - call: "POST /drinkware/enforcement-cases"
