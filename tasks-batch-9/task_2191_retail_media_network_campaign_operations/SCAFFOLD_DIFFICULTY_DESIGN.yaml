          - calculations.invoice_settlement_waterfall
          - calculations.second_price_clearing
          - calculations.auction_settlement_amount
          - entities.Campaign.fields.offsite_reported_spend_cents
          - entities.Campaign.fields.offsite_variance_pct
          - entities.Invoice.fields.offsite_spend_cents
          - entities.Invoice.fields.variance_pct
          - state_machines.Campaign.ACCRUING_to_PENDING_INVOICE
          - state_machines.Invoice.DRAFT_to_ISSUED
          - validations[priority=79]
          - concurrency_rules[line-item-create-stale-campaign]
        distinguishing_aspect: |
          This dual-variant calculation lives on the Campaign off-site spend / Invoice billing domain rather than the study-measurement domain: two campaigns with identical logged_offsite_cents of 1250 select opposite bases from the SAME formula — reported 1275 gives offsite_variance_pct == 2.00 and bills the LOGGED 1250, while reported 1270 gives 1.60 and bills the REPORTED 1270 — so the single invoice rolls up 2520 rather than 2500 (both LOGGED) or 2545 (both REPORTED).
