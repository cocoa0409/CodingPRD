          assert:
            - "error_id == ERR_RECORD_NOT_COMPLETE"
            - "HTTP status == 409"
            - "Brief.status remains READY (no transition because Record gate failed)"
            - "Record.status == DESIGNATED (never reached COMPLETE because transcript not delivered)"

      - name: petition_file_gated_by_decision_state
        grounds:
          - state_machines.FurtherReviewPetition.DRAFT_to_FILED
          - validations[priority=17]
          - state_machines.Decision
        distinguishing_aspect: |
          Entity pair = FurtherReviewPetition → Decision (different pair from
          instance 1's Brief→Record). Petition cannot transition DRAFT → FILED
          unless the parent Decision exists and case.posture == DECIDED.
          Attempting to file before decision issued returns
          ERR_DECISION_NOT_ISSUED.
        test_recipe:
          setup:
            - "Case in ARGUMENT_PENDING (briefs done, no decision yet)"
            - "Decision row absent — but petition creation requires basis_decision_id"
            - "Instead we construct a case with a decision but posture NOT yet DECIDED — impossible since decision creation sets posture DECIDED. So instead: posture == DECIDED + petition due_at in past, vs posture != DECIDED."
            - "Simpler scenario: petition whose basis decision is on a DIFFERENT case — FK resolves but posture check fails. But petition requires same-case decision. Use the posture check directly: case posture = BRIEFING (not DECIDED), try to create petition referencing a non-existent decision → ERR_FK_NOT_FOUND at priority 4 instead."
            - "Cleanest test: case posture = ARGUMENT_PENDING with no decision; petition creation needs a valid basis_decision_id. We use a decision on ANOTHER case and ensure the petition endpoint rejects cross-case basis. Or test the /file gate with posture != DECIDED."
          setup_api_calls:
