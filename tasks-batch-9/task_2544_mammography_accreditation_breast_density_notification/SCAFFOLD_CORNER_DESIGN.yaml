      - name: ce_hours_sum_at_two_decimals_before_the_threshold_comparison
        claim_type: precision
        grounds:
          - calculations.ce_and_volume_compliance
          - entities.Personnel.fields.ce_hours_36mo
        distinguishing_aspect: "7.50 + 7.75 must be summed as 15.25 and only then compared with the 15-hour threshold: truncating either credit to whole hours (7 + 7 == 14) or the sum to 15.2 would leave the technologist short and drive ce_status to GRACE instead of COMPLIANT."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "The technologist holds two CATEGORY_1_CE credits of 7.50 and 7.75 hours inside the 1095-day lookback and one READ_VOLUME credit of 200 exams inside the 730-day lookback."
