scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: create_owner_returns_201_all_fields
        claim_type: Creation
        grounds: [entities.Owner]
        distinguishing_aspect: "POST /owners with all required fields returns 201 and echoes full_name, dmv_customer_id, email, mailing_state plus system id/created_at."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /owners"
              payload: { full_name: "Ann Owner", dmv_customer_id: "DMV-C1", email: "ann@x.com", mailing_state: "NY" }
              as: PlatformAdmin
              captures: { oid: $.data.id }
          assert:
            - "response.status == 201"
            - "Owner.${oid}.full_name == Ann Owner"
            - "Owner.${oid}.hardship_status == NONE"

      - name: get_nonexistent_case_returns_404
        claim_type: Not Found
        grounds: [entities.ScofflawCase, "errors[ERR_CASE_NOT_FOUND]"]
        distinguishing_aspect: "GET /scofflaw-cases/{id} with a non-existent UUID returns ERR_CASE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /scofflaw-cases/00000000-0000-4000-8000-000000000000"
              as: EnforcementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_CASE_NOT_FOUND"

      - name: create_violation_missing_required_returns_validation
        claim_type: Required Fields
        grounds: [entities.Violation]
        distinguishing_aspect: "POST violations omitting fine_amount_cents returns ERR_VALIDATION (400); no violation is created."
        test_recipe:
          setup: ["Owner O; Vehicle V; Case C."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Req Owner", dmv_customer_id: "DMV-C2", email: "r@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o}", plate_number: "REQ01", plate_state: "CA", vin: "VINR" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
          trigger:
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "MISS1", violation_type: "METER_EXPIRED", issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: vehicle_hold_flag_default_false
        claim_type: Defaults
        grounds: [entities.Vehicle.fields.hold_flag]
        distinguishing_aspect: "A freshly registered vehicle has hold_flag == false regardless of any input value."
        test_recipe:
          setup: ["Owner O exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Def Owner", dmv_customer_id: "DMV-C3", email: "d@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { owner_id: "${o}", plate_number: "DEF01", plate_state: "CA", vin: "VIND" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
          assert:
            - "Vehicle.${veh}.hold_flag == false"

      - name: case_owner_id_system_copied_from_vehicle
        claim_type: System Fields
        grounds: [entities.ScofflawCase.fields.owner_id]
        distinguishing_aspect: "Opening a case copies owner_id from the vehicle; the value is system-derived, not client-supplied."
        test_recipe:
          setup: ["Owner O owns Vehicle V."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Sys Owner", dmv_customer_id: "DMV-C4", email: "s@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o}", plate_number: "SYS01", plate_state: "CA", vin: "VINS" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
          trigger:
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
          assert:
            - "ScofflawCase.${c}.owner_id == ${o}"
            - "ScofflawCase.${c}.case_status == COMPLIANT"

  # =========================================================================
  - section: state_machines
    instances:
      - name: double_place_hold_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ScofflawCase.NO_HOLD_to_HOLD_PLACED, "errors[ERR_HOLD_ALREADY_PLACED]"]
        distinguishing_aspect: "Placing a hold on a case whose hold_status is already HOLD_PLACED returns ERR_HOLD_ALREADY_PLACED (409)."
        test_recipe:
          setup: ["SCOFFLAW case (5 violations of 12000) with a hold already placed."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Hold Owner", dmv_customer_id: "DMV-C5", email: "h@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o}", plate_number: "HLD01", plate_state: "CA", vin: "VINH" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "H1", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "H2", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "H3", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "H4", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "H5", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/place-hold"
              payload: {}
              as: EnforcementOfficer
          trigger:
            - call: "POST /scofflaw-cases/${c}/place-hold"
              payload: {}
              as: EnforcementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_HOLD_ALREADY_PLACED"

      - name: release_hold_without_hold_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ScofflawCase.HOLD_PLACED_to_HOLD_RELEASED, "errors[ERR_NO_HOLD_TO_RELEASE]"]
        distinguishing_aspect: "Releasing a hold on a case with hold_status == NO_HOLD returns ERR_NO_HOLD_TO_RELEASE (409)."
        test_recipe:
          setup: ["A COMPLIANT case with no hold (2 violations of 10000)."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "NoHold Owner", dmv_customer_id: "DMV-C6", email: "nh@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o}", plate_number: "NHL01", plate_state: "CA", vin: "VINN" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
          trigger:
            - call: "POST /scofflaw-cases/${c}/release-hold"
              payload: { release_reason: "MANUAL" }
              as: CollectionsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_HOLD_TO_RELEASE"

      - name: apply_twice_order_rejected
        claim_type: idempotency
        grounds: [state_machines.BootTowOrder.DISPATCHED_to_APPLIED, "errors[ERR_ORDER_NOT_ACTIVE]"]
        distinguishing_aspect: "Applying an already-APPLIED boot order returns ERR_ORDER_NOT_ACTIVE (409); the second apply is not a no-op."
        test_recipe:
          setup: ["SCOFFLAW boot-eligible case (5 violations of 13000); BOOT dispatched then applied."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "App Owner", dmv_customer_id: "DMV-C7", email: "a@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o}", plate_number: "APP01", plate_state: "CA", vin: "VINA" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "AP1", violation_type: "METER_EXPIRED", fine_amount_cents: 13000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "AP2", violation_type: "METER_EXPIRED", fine_amount_cents: 13000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "AP3", violation_type: "METER_EXPIRED", fine_amount_cents: 13000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "AP4", violation_type: "METER_EXPIRED", fine_amount_cents: 13000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "AP5", violation_type: "METER_EXPIRED", fine_amount_cents: 13000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "GET /scofflaw-cases/${c}"
              as: EnforcementOfficer
              captures: { ver: $.data.version }
            - call: "POST /scofflaw-cases/${c}/boot-tow-orders"
              payload: { expected_scofflaw_case_version: "${ver}", action_type: "BOOT" }
              as: EnforcementOfficer
              as_user_id: "eo-d"
              captures: { o: $.data.id }
            - call: "POST /boot-tow-orders/${o}/apply"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-a"
          trigger:
            - call: "POST /boot-tow-orders/${o}/apply"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-a2"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_ACTIVE"

  # =========================================================================
  - section: calculations
    instances:
      - name: installment_amount_computed_correctly
        claim_type: Correct Result
        grounds: [calculations.installment_amount, entities.PaymentPlan.fields.installment_amount_cents]
        distinguishing_aspect: "total 100000, down 10000, 9 installments -> installment_amount_cents = round_half_up(90000/9) = 10000; paid_to_date_cents starts at the down payment 10000."
        test_recipe:
          setup: ["SCOFFLAW case owned by O (2 violations of 30000); OCC version captured."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Plan Owner", dmv_customer_id: "DMV-C8", email: "pl@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o}", plate_number: "PLN01", plate_state: "CA", vin: "VINP" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "PL1", violation_type: "METER_EXPIRED", fine_amount_cents: 30000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "PL2", violation_type: "METER_EXPIRED", fine_amount_cents: 30000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "GET /scofflaw-cases/${c}"
              as: Owner
              as_user_id: "${o}"
              captures: { ver: $.data.version }
          trigger:
            - call: "POST /scofflaw-cases/${c}/payment-plans"
              payload: { expected_scofflaw_case_version: "${ver}", total_amount_cents: 100000, installment_count: 9, down_payment_cents: 10000 }
              as: Owner
              as_user_id: "${o}"
              captures: { pl: $.data.id }
          assert:
            - "PaymentPlan.${pl}.installment_amount_cents == 10000"
            - "PaymentPlan.${pl}.paid_to_date_cents == 10000"
            - "PaymentPlan.${pl}.status == ACTIVE"

      - name: hardship_tier2_full_waiver_marks_waived
        claim_type: Variant Selection
        grounds: [calculations.hardship_waiver_amount, state_machines.Violation.OUTSTANDING_to_WAIVED]
        distinguishing_aspect: "Approving a TIER_2 waiver on a case with one OUTSTANDING violation of 20000 credits approved_amount_cents 20000, flips the violation to WAIVED, and zeroes collectible."
        test_recipe:
          setup: ["Case owned by O with one OUTSTANDING violation of 20000; owner requested a TIER_2 waiver."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "W2 Owner", dmv_customer_id: "DMV-C9", email: "w2@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o}", plate_number: "W2001", plate_state: "CA", vin: "VINW2" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "W21", violation_type: "NO_PERMIT", fine_amount_cents: 20000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
              captures: { v: $.data.id }
            - call: "POST /scofflaw-cases/${c}/hardship-waivers"
              payload: { hardship_tier: "TIER_2", requested_amount_cents: 20000 }
              as: Owner
              as_user_id: "${o}"
              captures: { w: $.data.id }
          trigger:
            - call: "POST /hardship-waivers/${w}/decide"
              payload: { approve: true }
              as: CollectionsAdmin
          assert:
            - "HardshipWaiver.${w}.status == APPROVED"
            - "HardshipWaiver.${w}.approved_amount_cents == 20000"
            - "Violation.${v}.status == WAIVED"
            - "ScofflawCase.${c}.collectible_balance_cents == 0"

      - name: hardship_tier1_partial_credit
        claim_type: Variant Divergence
        grounds: [calculations.hardship_waiver_amount, entities.Violation.fields.credit_cents]
        distinguishing_aspect: "Approving a TIER_1 waiver on a 20000 OUTSTANDING violation credits round_half_up(20000*0.50)=10000, leaves the violation OUTSTANDING, and reduces collectible to 10000 — divergent from the TIER_2 full path."
        test_recipe:
          setup: ["Case owned by O with one OUTSTANDING violation of 20000; owner requested a TIER_1 waiver."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "W1 Owner", dmv_customer_id: "DMV-C10", email: "w1@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o}", plate_number: "W1001", plate_state: "CA", vin: "VINW1" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "W11", violation_type: "NO_PERMIT", fine_amount_cents: 20000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
              captures: { v: $.data.id }
            - call: "POST /scofflaw-cases/${c}/hardship-waivers"
              payload: { hardship_tier: "TIER_1", requested_amount_cents: 10000 }
              as: Owner
              as_user_id: "${o}"
              captures: { w: $.data.id }
          trigger:
            - call: "POST /hardship-waivers/${w}/decide"
              payload: { approve: true }
              as: CollectionsAdmin
          assert:
            - "HardshipWaiver.${w}.approved_amount_cents == 10000"
            - "Violation.${v}.status == OUTSTANDING"
            - "Violation.${v}.credit_cents == 10000"
            - "ScofflawCase.${c}.collectible_balance_cents == 10000"

      - name: payment_waterfall_oldest_first
        claim_type: Correct Result
        grounds: [calculations.payment_allocation, entities.Payment.fields.allocation]
        distinguishing_aspect: "A 10000 payment across v1 (issued 2026-05-01) and v2 (issued 2026-05-10), each 10000, fully pays the older v1 -> PAID and leaves v2 OUTSTANDING; ordering is issued_at ASC, never by id."
        test_recipe:
          setup: ["Case owned by O with two OUTSTANDING violations of 10000, issued 2026-05-01 (v1) and 2026-05-10 (v2)."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Wf Owner", dmv_customer_id: "DMV-C11", email: "wf@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o}", plate_number: "WFL01", plate_state: "CA", vin: "VINWF" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "WF1", violation_type: "METER_EXPIRED", fine_amount_cents: 10000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
              captures: { v1: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "WF2", violation_type: "METER_EXPIRED", fine_amount_cents: 10000, issued_at: "2026-05-10T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
              captures: { v2: $.data.id }
          trigger:
            - call: "POST /scofflaw-cases/${c}/payments"
              payload: { amount_cents: 10000, method: "CASH" }
              as: Owner
              as_user_id: "${o}"
          assert:
            - "Violation.${v1}.status == PAID"
            - "Violation.${v2}.status == OUTSTANDING"
            - "ScofflawCase.${c}.collectible_balance_cents == 10000"

      - name: referral_amount_snapshot_and_in_collections
        claim_type: Correct Result
        grounds: [calculations.referral_amount, state_machines.Violation.OUTSTANDING_to_IN_COLLECTIONS]
        distinguishing_aspect: "Referral snapshots referred_amount_cents == collectible 60000 at referral, moves the 5 OUTSTANDING violations to IN_COLLECTIONS, and drops collectible to 0."
        test_recipe:
          setup: ["SCOFFLAW case (5 violations of 12000, issued 2026-05-01); clock advanced to 2026-08-01 (>= 90 days old)."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { full_name: "Ref Owner", dmv_customer_id: "DMV-C12", email: "rf@x.com", mailing_state: "CA" }
              as: PlatformAdmin
              captures: { o: $.data.id }
            - call: "POST /vehicles"
              payload: { owner_id: "${o}", plate_number: "REF01", plate_state: "CA", vin: "VINRF" }
              as: PlatformAdmin
              captures: { veh: $.data.id }
            - call: "POST /scofflaw-cases"
              payload: { vehicle_id: "${veh}" }
              as: EnforcementOfficer
              captures: { c: $.data.id }
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "RF1", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "RF2", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "RF3", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "RF4", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /scofflaw-cases/${c}/violations"
              payload: { citation_number: "RF5", violation_type: "METER_EXPIRED", fine_amount_cents: 12000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /scofflaw-cases/${c}/collections-referrals"
              payload: { agency_name: "ACME Collections" }
              as: CollectionsAdmin
              captures: { r: $.data.id }
          assert:
            - "CollectionsReferral.${r}.referred_amount_cents == 60000"
            - "CollectionsReferral.${r}.status == REFERRED"
