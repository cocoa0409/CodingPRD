  # ===========================================================================
  # SECTION 6 — errors
  # Table 6 asks one thing: every code in the 69-entry catalog must be
  # triggerable. Codes already exercised elsewhere in this file (the not-found
  # family, ERR_INVALID_REQUEST, the state family, the auth family) are not
  # duplicated; what follows closes the remaining business codes, and the
  # §1.8-covered ones are stubbed at the end of the section.
  # ===========================================================================
  - section: errors
    instances:
      - name: corner_lot_code_uniqueness_is_global_across_chemical_types
        claim_type: Triggerability
        grounds:
          - errors.ERR_DUPLICATE_LOT_CODE
          - validations[41].ERR_DUPLICATE_LOT_CODE
          - endpoints.POST_chemical_lots
        distinguishing_aspect: |
          lot_code is unique over all ChemicalLot rows with no scoping by
          chemical_type, so re-using C-2001 for an ACID lot is
          ERR_DUPLICATE_LOT_CODE (409) even though nothing else about the two
          payloads matches, and the incumbent lot is untouched.
        test_recipe:
          setup:
            - "Empty database; logical clock 2026-08-01T00:00:00Z."
            - "One AVAILABLE CAUSTIC lot C-2001 at 45.0 pct stock, 20.0 L, expiring 2026-12-31."
          setup_api_calls:
            - call: "POST /draft-service/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
            - call: "POST /draft-service/chemical-lots"
              payload: { chemical_type: "CAUSTIC", lot_code: "C-2001", concentration_pct_stock: 45.0, liters_initial: 20.0, expires_on: "2026-12-31" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { lot: $.data.id }
          trigger:
            - call: "POST /draft-service/chemical-lots"
              payload: { chemical_type: "ACID", lot_code: "C-2001", concentration_pct_stock: 20.0, liters_initial: 10.0, expires_on: "2027-01-31" }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { err: $.data.error_id }
            - call: "GET /draft-service/chemical-lots?limit=10&offset=0"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { total: $.total_count }
          assert:
            - "the second create returns HTTP 409 and ${err} == ERR_DUPLICATE_LOT_CODE"
            - "${total} == 1"
            - "ChemicalLot.${lot}.chemical_type == CAUSTIC and .concentration_pct_stock == 45.0 and .liters_remaining == 20.000"

      - name: corner_drained_lot_can_be_quarantined_but_not_released_until_a_void_refills_it
