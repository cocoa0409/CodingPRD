      - name: pay_after_hold_expiry_rejected_then_checkpoint_sweeps
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_ORDER_HOLD_EXPIRED]", state_machines.TicketOrder]
        distinguishing_aspect: "Hold window is inclusive at +15:00 and closed at +15:01; checkpoint then sweeps the HELD order to EXPIRED and restores seats."
        test_recipe:
          setup: ["Event REGISTRATION_OPEN; session cap 50; order created at clock 2026-08-01T00:00:00Z (hold_expires_at 00:15:00)"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
