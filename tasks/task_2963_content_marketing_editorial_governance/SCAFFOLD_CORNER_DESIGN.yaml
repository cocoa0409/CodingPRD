        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /editorial/content-items/{id}/publish]
          - endpoints[POST /editorial/content-items/{id}/asset-usages]
        distinguishing_aspect: "Nothing in this API settles. The attach response already carries the recomputed asset counters, and the publish response already carries published_at, published_by_user_id, the stored metadata and the incremented version — while the Distribution rows it fanned out and the campaign posture it recomputed are readable on the very next call with no second write, no sweep and no delay. An implementation that defers any of these to the next read or to the nightly sweep fails here."
