              payload: { name: "Own A", state_code: "IA" }
              as: ServiceManager
              captures: { soa: $.data.id }
            - call: "POST /sites"
              payload: { name: "Own B", state_code: "IA" }
              as: ServiceManager
              captures: { sob: $.data.id }
            - call: "POST /vessels"
              payload: { site_id: "${sob}", name: "SILO-B", vessel_kind: "SILO", capacity_tons: 100, material_name: "corn", reorder_point_pct: 30 }
              as: ServiceManager
              captures: { vob: $.data.id }
          trigger:
            - call: "POST /level-readings"
              payload: { vessel_id: "${vob}", measured_at: "2026-08-02T00:00:00Z", level_pct: 50.0 }
              as: PlantOperator
              as_user_id: "${soa}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN and http status 403"

      - name: technician_cannot_start_others_ticket_forbidden
        claim_type: rbac_denial
        grounds:
          - "roles Technician"
          - "state_machines.ServiceTicket.SCHEDULED_to_IN_PROGRESS"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "Start requires the acting technician to be the assignee; a different technician gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["Site, vessel, technicians TTone and TTtwo; ticket SCHEDULED to TTone."]
