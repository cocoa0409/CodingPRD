    - entities.Characteristic.fields.required_gauge_type
    - validations[priority=30]
    distinguishing_aspect: |
      required_gauge_type is constrained to four members, so LASER_MIC is rejected with 400 ERR_INVALID_REQUEST before any part lookup succeeds.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; part P-4471 exists.
