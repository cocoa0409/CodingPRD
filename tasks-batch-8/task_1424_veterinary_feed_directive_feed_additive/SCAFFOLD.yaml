scenario: |
  Veterinary Feed Directive & Feed-Additive Stewardship (feed mill VFD compliance):
  VFD authorization issuance & expiration, feed mill order validation against VFD,
  distributor recordkeeping & acknowledgment letters, withdrawal period tracking to
  market date, prohibited extra-label use control, inspection/audit readiness &
  record retention, veterinarian-client-patient relationship verification,
  residue violation investigation

domain_name: veterinary-feed-directive-feed-mill
api_prefix: /vfd

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # regulatory gating + audit trail + SoD
  secondary_archetype: quota_allocation      # per-VFD remaining_animal_count pool
  complexity_layers:
    - optimistic_concurrency                 # OCC on VfdAuthorization.version
    - cascading_side_effects                 # expiration -> order cancel -> ledger sync
    - dual_variant_calculation               # provisional vs final withdrawal projection
    - rate_threshold_triggers                # residue violation scoring tiers
    - scheduled_actions                      # market_date, expiration_date, retention_horizon
    - derived_field_reconciliation           # compliance_score recompute

  entity_topology: hierarchical              # Clinic -> Vet; Producer -> AnimalGroup; VfdAuthorization -> FeedOrder -> FeedShipment
  state_machine_shape: branching             # expiration cycle + violation fork-join + parallel withdrawal dimension
  relationship_patterns:
    - one_to_many
    - many_to_many                           # VfdDrug <-> AnimalGroup species/class allowed_pairs
    - cross_aggregate                        # FeedOrder references VfdAuthorization + FeedMill
  role_model: segregation_of_duties          # vet issues, mill fulfills, inspector audits; same user cannot do both steps
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: VeterinaryClinic
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal clinic name" }
      - { name: license_number, type: string, source: input, description: "State veterinary license number, unique" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code" }
      - { name: compliance_score, type: integer, source: computed, default: 1000, description: "Aggregate compliance score; drops on violations, restored on resolved cases" }
      - { name: audit_ready, type: boolean, source: computed, default: true, description: "True iff compliance_score >= 700 AND no OPEN ResidueCase" }

  - name: Veterinarian
    parent: VeterinaryClinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> VeterinaryClinic.id; owning clinic" }
      - { name: full_name, type: string, source: input, description: "Veterinarian legal name" }
      - { name: license_number, type: string, source: input, description: "Individual DVM license number" }
      - { name: state_code, type: string, source: input, description: "Primary practice state; must equal clinic.state_code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | REVOKED" }

  - name: Producer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Producer / farm business legal name" }
      - { name: premise_id, type: string, source: input, description: "Federal premises identification number (PIN), unique" }
      - { name: state_code, type: string, source: input, description: "Premise state" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DEBARRED" }

  - name: AnimalGroup
    parent: Producer
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: system, description: "FK -> Producer.id" }
      - { name: species, type: enum, source: input, description: "CATTLE | SWINE | POULTRY | SHEEP | GOAT" }
      - { name: production_class, type: enum, source: input, description: "BEEF | DAIRY | LAYER | BROILER | BREEDING" }
      - { name: head_count, type: integer, source: input, description: "Current animals in group" }
      - { name: average_weight_lbs, type: integer, source: input, description: "Average live weight in pounds" }
      - { name: earliest_market_date, type: string, source: input, description: "ISO 8601 date; earliest anticipated market/slaughter date" }

  - name: VfdDrug
    parent: null
    common_fields: true
    fields:
      - { name: drug_code, type: string, source: input, description: "FDA-assigned VFD drug code, unique" }
      - { name: label_name, type: string, source: input, description: "Proprietary label name" }
      - { name: withdrawal_hours, type: integer, source: input, description: "Required withdrawal period in hours before slaughter" }
      - { name: allowed_species_classes, type: array, source: input, description: "Array of 'SPECIES:CLASS' pair strings (e.g. 'CATTLE:BEEF'); defines label-permitted combinations" }
      - { name: max_duration_days, type: integer, source: input, description: "Maximum continuous feeding duration per label" }
      - { name: prohibited_extra_label, type: boolean, source: input, default: true, description: "VFD drugs are ALWAYS prohibited from extra-label use per 21 CFR 530; pinned true" }

  - name: VcpVerification
    parent: Veterinarian
    common_fields: true
    fields:
      - { name: vet_id, type: string, source: system, description: "FK -> Veterinarian.id" }
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; subject of VCPR" }
      - { name: verified_on, type: string, source: system, description: "ISO 8601 UTC timestamp of verification" }
      - { name: expires_on, type: string, source: input, description: "ISO 8601 UTC; VCPR validity expiry, typically 12 months" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED" }
      - { name: revocation_reason, type: string, source: input, required: false, description: "Required iff status -> REVOKED" }

  - name: VfdAuthorization
    parent: Producer
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: system, description: "FK -> Producer.id" }
      - { name: animal_group_id, type: string, source: input, description: "FK -> AnimalGroup.id; targeted animals" }
      - { name: vet_id, type: string, source: input, description: "FK -> Veterinarian.id; issuing vet" }
      - { name: drug_id, type: string, source: input, description: "FK -> VfdDrug.id" }
      - { name: authorized_animal_count, type: integer, source: input, description: "Total animals authorized to receive VFD feed under this document" }
      - { name: remaining_animal_count, type: integer, source: computed, description: "= authorized_animal_count - sum(non-CANCELLED FeedOrder.animal_count)" }
      - { name: feed_duration_days, type: integer, source: input, description: "Days of VFD feed per animal authorized" }
      - { name: issued_on, type: string, source: system, description: "ISO 8601 UTC at issuance" }
      - { name: expiration_date, type: string, source: input, description: "ISO 8601 UTC; VFD expires (max 6 months per 21 CFR 558.6)" }
      - { name: extra_label_intended, type: boolean, source: input, default: false, description: "True if vet attempted extra-label use (MUST be rejected for VFD drugs)" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_USED | FULLY_USED | EXPIRED | REVOKED | SUPERSEDED" }
      - { name: superseded_by_id, type: string, source: system, required: false, description: "FK -> VfdAuthorization.id; set when this VFD is superseded by a newer one" }

  - name: FeedMill
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Feed mill legal name" }
      - { name: fda_registration, type: string, source: input, description: "FDA feed mill registration number, unique" }
      - { name: state_code, type: string, source: input, description: "Mill state" }
      - { name: pending_order_count, type: integer, source: computed, default: 0, description: "Count of FeedOrders in VALIDATED state not yet SHIPPED/CANCELLED" }

  - name: FeedOrder
    parent: FeedMill
    common_fields: true
    fields:
      - { name: feed_mill_id, type: string, source: system, description: "FK -> FeedMill.id" }
      - { name: vfd_authorization_id, type: string, source: input, description: "FK -> VfdAuthorization.id" }
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id (must equal VfdAuthorization.producer_id)" }
      - { name: animal_count, type: integer, source: input, description: "Animals this order feeds; debited from remaining_animal_count" }
      - { name: tons_of_feed, type: integer, source: input, description: "Total tons of medicated feed" }
      - { name: intended_use_label, type: string, source: input, description: "Free-text intended use; MUST match VfdDrug label indications or ERR_EXTRA_LABEL_USE" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VALIDATED | SHIPPED | DELIVERED | CANCELLED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, required: false, description: "Populated when status -> REJECTED" }

  - name: FeedShipment
    parent: FeedOrder
    common_fields: true
    fields:
      - { name: feed_order_id, type: string, source: system, description: "FK -> FeedOrder.id" }
      - { name: tons_shipped, type: integer, source: input, description: "Actual tons shipped" }
      - { name: shipped_at, type: string, source: system, description: "ISO 8601 UTC" }
      - { name: delivered_at, type: string, source: system, required: false, description: "ISO 8601 UTC on delivery confirmation" }
      - { name: status, type: enum, source: system, description: "IN_TRANSIT | DELIVERED | RETURNED | REJECTED_AT_RECEIPT" }

  - name: WithdrawalPlan
    parent: FeedOrder
    common_fields: true
    fields:
      - { name: feed_order_id, type: string, source: system, description: "FK -> FeedOrder.id" }
      - { name: provisional_market_date, type: string, source: computed, description: "Earliest legal market date computed at order validation (forward_looking)" }
      - { name: final_market_date, type: string, source: computed, required: false, description: "Recomputed on delivery using actual delivery timestamp (chronological)" }
      - { name: withdrawal_window_hours, type: integer, source: computed, description: "= VfdDrug.withdrawal_hours (copied at validation time)" }
      - { name: last_feed_consumed_at, type: string, source: input, required: false, description: "Producer-attested last-feed timestamp; required to finalize" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED | VIOLATED" }

  - name: DistributorAcknowledgment
    parent: FeedMill
    common_fields: true
    fields:
      - { name: feed_mill_id, type: string, source: system, description: "FK -> FeedMill.id" }
      - { name: distributor_name, type: string, source: input, description: "Downstream distributor legal name" }
      - { name: acknowledged_at, type: string, source: system, description: "ISO 8601 UTC acknowledgment timestamp" }
      - { name: covers_drug_id, type: string, source: input, description: "FK -> VfdDrug.id this acknowledgment covers" }
      - { name: statement_text, type: string, source: input, description: "Exact acknowledgment letter text" }
      - { name: status, type: enum, source: system, description: "PENDING | ACKNOWLEDGED | LAPSED" }

  - name: ResidueCase
    parent: Producer
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: system, description: "FK -> Producer.id" }
      - { name: feed_order_id, type: string, source: input, description: "FK -> FeedOrder.id under investigation" }
      - { name: detected_at, type: string, source: input, description: "ISO 8601 UTC when residue was detected" }
      - { name: residue_ppb, type: integer, source: input, description: "Detected residue level in parts per billion" }
      - { name: severity_tier, type: enum, source: computed, description: "TIER_1 (<2x tolerance) | TIER_2 (2x-5x) | TIER_3 (>5x)" }
      - { name: tolerance_ppb, type: integer, source: input, description: "Regulatory tolerance for the drug" }
      - { name: investigator_id, type: string, source: input, description: "Inspector entity id" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_INVESTIGATION | CONFIRMED_VIOLATION | DISMISSED" }
      - { name: penalty_score_deduction, type: integer, source: computed, default: 0, description: "Score deducted from issuing clinic on CONFIRMED_VIOLATION" }

  - name: AuditBundle
    parent: Producer
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: system, description: "FK -> Producer.id" }
      - { name: opened_at, type: string, source: system, description: "ISO 8601 UTC when audit opens" }
      - { name: window_start, type: string, source: input, description: "ISO 8601 UTC; audit lookback start" }
      - { name: window_end, type: string, source: input, description: "ISO 8601 UTC; audit lookback end" }
      - { name: required_record_count, type: integer, source: computed, description: "Count of records (VFDs, orders, shipments, acks) intersecting [window_start, window_end]" }
      - { name: produced_record_count, type: integer, source: computed, default: 0, description: "Count of records produced for the audit" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPLETE | DEFICIENT" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Veterinarian
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /vfd/veterinarians/{id}/suspend
        actor: Inspector
        preconditions:
          - "vet.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "All VfdAuthorizations in {ISSUED, PARTIALLY_USED} where vet_id = this vet -> cascade-revalidate: mark EXPIRED effective immediately"
          - "Cascaded expirations trigger per-VFD side effects (see VfdAuthorization.EXPIRED transition)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /vfd/veterinarians/{id}/reinstate
        actor: Inspector
        preconditions:
          - "vet.status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []
        note: "Reinstatement does NOT resurrect expired VFDs — vet must re-issue"
      - from: ACTIVE
        to: REVOKED
        trigger: POST /vfd/veterinarians/{id}/revoke
        actor: Inspector
        preconditions:
          - "vet.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Same VFD cascade as SUSPENDED"
      - from: SUSPENDED
        to: REVOKED
        trigger: POST /vfd/veterinarians/{id}/revoke
        actor: Inspector
        preconditions:
          - "vet.status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Same VFD cascade as SUSPENDED"

  - entity: VcpVerification
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when logical clock >= expires_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: POST /vfd/vcp-verifications/{id}/revoke
        actor: Veterinarian
        preconditions:
          - "X-User-ID must equal vcp.vet_id (ERR_FORBIDDEN)"
          - "status == ACTIVE (ERR_INVALID_STATE)"
          - "revocation_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "All VfdAuthorizations in {ISSUED, PARTIALLY_USED} where (vet_id, producer_id) matches this VCPR -> cascade EXPIRED"
          - "Cascade per-VFD side effects fire"

  - entity: VfdAuthorization
    initial_state: ISSUED
    terminal_states: [EXPIRED, REVOKED, SUPERSEDED, FULLY_USED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_USED
        trigger: "system (automatic on first FeedOrder reaching VALIDATED)"
        actor: system
        preconditions: []
        side_effects:
          - "remaining_animal_count decremented by FeedOrder.animal_count"
      - from: PARTIALLY_USED
        to: FULLY_USED
        trigger: "system (automatic when remaining_animal_count reaches 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: FULLY_USED
        trigger: "system (automatic when remaining_animal_count reaches 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system (automatic when logical clock >= expiration_date) OR vet/VCPR cascade"
        actor: system
        preconditions: []
        side_effects:
          - "All FeedOrders in {SUBMITTED, VALIDATED} for this VFD -> CANCELLED with rejection_reason='VFD_EXPIRED'"
          - "FeedMill.pending_order_count decremented per cancelled order"
          - "If any cancelled FeedOrder had status VALIDATED: its WithdrawalPlan -> still PROVISIONAL but orphaned (kept for audit)"
      - from: PARTIALLY_USED
        to: EXPIRED
        trigger: "system (clock or cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Same FeedOrder cancellation cascade as ISSUED->EXPIRED"
      - from: ISSUED
        to: REVOKED
        trigger: POST /vfd/vfd-authorizations/{id}/revoke
        actor: Veterinarian
        preconditions:
          - "X-User-ID must equal vfd.vet_id (ERR_FORBIDDEN) — vet who issued is the only one who may revoke"
          - "status in {ISSUED, PARTIALLY_USED} (ERR_INVALID_STATE)"
        side_effects:
          - "Same FeedOrder cancellation cascade"
      - from: PARTIALLY_USED
        to: REVOKED
        trigger: POST /vfd/vfd-authorizations/{id}/revoke
        actor: Veterinarian
        preconditions:
          - "X-User-ID must equal vfd.vet_id"
          - "status in {ISSUED, PARTIALLY_USED}"
        side_effects:
          - "Same FeedOrder cancellation cascade"
      - from: ISSUED
        to: SUPERSEDED
        trigger: POST /vfd/vfd-authorizations (creating a replacement VFD with supersedes_id=this)
        actor: Veterinarian
        preconditions:
          - "New VFD's supersedes_id points to an existing VFD in {ISSUED, PARTIALLY_USED}"
          - "expected_vfd_authorization_version matches current version (OCC)"
        side_effects:
          - "Remaining animal count transferred: new VFD's authorized_animal_count is independent, but old VFD's remaining_animal_count is zeroed"
          - "Old VFD's non-terminal FeedOrders stay bound to old VFD but cannot be further validated"
          - "Old VFD.version incremented"
          - "New VFD created in ISSUED"

  - entity: FeedOrder
    initial_state: SUBMITTED
    terminal_states: [DELIVERED, CANCELLED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: POST /vfd/feed-orders/{id}/validate
        actor: FeedMillOperator
        preconditions:
          - "vfd_authorization.status IN {ISSUED, PARTIALLY_USED} (ERR_VFD_NOT_USABLE)"
          - "logical clock < vfd.expiration_date (ERR_VFD_EXPIRED)"
          - "producer.status == ACTIVE (ERR_PRODUCER_SUSPENDED)"
          - "animal_count <= vfd.remaining_animal_count (ERR_VFD_QUOTA_EXCEEDED)"
          - "vfd_drug.allowed_species_classes contains 'SPECIES:CLASS' for animal_group (ERR_SPECIES_CLASS_MISMATCH)"
          - "intended_use_label matches drug label (no extra-label) (ERR_EXTRA_LABEL_USE)"
          - "no OPEN ResidueCase on same producer_id (ERR_RESIDUE_CASE_OPEN)"
          - "vcp_verification exists with status ACTIVE covering (vfd.vet_id, vfd.producer_id) (ERR_VCPR_NOT_VERIFIED)"
        side_effects:
          - "WithdrawalPlan created (status=PROVISIONAL) with provisional_market_date = max(now + withdrawal_hours, animal_group.earliest_market_date)"
          - "VfdAuthorization.remaining_animal_count -= animal_count; VfdAuthorization may transition ISSUED->PARTIALLY_USED or ->FULLY_USED"
          - "FeedMill.pending_order_count += 1"
          - "VfdAuthorization.version incremented"
      - from: VALIDATED
        to: SHIPPED
        trigger: POST /vfd/feed-orders/{id}/ship
        actor: FeedMillOperator
        preconditions:
          - "status == VALIDATED (ERR_INVALID_STATE)"
          - "DistributorAcknowledgment exists with status=ACKNOWLEDGED covering (feed_mill_id, drug_id) (ERR_ACK_MISSING)"
          - "logical clock < vfd.expiration_date (ERR_VFD_EXPIRED)"
        side_effects:
          - "FeedShipment created with status=IN_TRANSIT"
      - from: SHIPPED
        to: DELIVERED
        trigger: POST /vfd/feed-shipments/{id}/deliver
        actor: Producer
        preconditions:
          - "shipment.status == IN_TRANSIT (ERR_INVALID_STATE)"
          - "X-User-ID must equal order.producer_id (ERR_FORBIDDEN)"
        side_effects:
          - "FeedOrder.status -> DELIVERED"
          - "FeedMill.pending_order_count -= 1"
          - "WithdrawalPlan.final_market_date computed (chronological variant): last_feed_consumed_at + withdrawal_hours; status -> FINALIZED"
          - "If final_market_date > animal_group.earliest_market_date: WithdrawalPlan.status -> VIOLATED (warning, but delivery allowed)"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /vfd/feed-orders/{id}/reject
        actor: FeedMillOperator
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
          - "rejection_reason present (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /vfd/feed-orders/{id}/cancel OR VFD-expiry cascade
        actor: Producer | system
        preconditions:
          - "status IN {SUBMITTED, VALIDATED} (ERR_INVALID_STATE)"
          - "if actor==Producer: X-User-ID must equal order.producer_id (ERR_FORBIDDEN)"
        side_effects:
          - "If was VALIDATED: VfdAuthorization.remaining_animal_count += animal_count (compensating return); VfdAuthorization.version incremented"
          - "If was VALIDATED: FeedMill.pending_order_count -= 1"
          - "If was VALIDATED: WithdrawalPlan status stays PROVISIONAL (orphan for audit)"
      - from: VALIDATED
        to: CANCELLED
        trigger: POST /vfd/feed-orders/{id}/cancel OR cascade
        actor: Producer | system
        preconditions:
          - "status IN {SUBMITTED, VALIDATED}"
          - "if actor==Producer: X-User-ID must equal order.producer_id"
        side_effects:
          - "Same compensating return as SUBMITTED->CANCELLED"

  - entity: FeedShipment
    initial_state: IN_TRANSIT
    terminal_states: [DELIVERED, RETURNED, REJECTED_AT_RECEIPT]
    transitions:
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: POST /vfd/feed-shipments/{id}/deliver
        actor: Producer
        preconditions:
          - "shipment.status == IN_TRANSIT"
          - "X-User-ID must equal order.producer_id"
        side_effects:
          - "see FeedOrder.SHIPPED->DELIVERED"
      - from: IN_TRANSIT
        to: RETURNED
        trigger: POST /vfd/feed-shipments/{id}/return
        actor: Producer
        preconditions:
          - "shipment.status == IN_TRANSIT"
          - "X-User-ID must equal order.producer_id"
        side_effects:
          - "FeedOrder.status -> CANCELLED"
          - "VfdAuthorization.remaining_animal_count += order.animal_count (compensating)"
          - "FeedMill.pending_order_count -= 1"
      - from: IN_TRANSIT
        to: REJECTED_AT_RECEIPT
        trigger: POST /vfd/feed-shipments/{id}/reject-receipt
        actor: Producer
        preconditions:
          - "shipment.status == IN_TRANSIT"
          - "X-User-ID must equal order.producer_id"
        side_effects:
          - "Same compensation as RETURNED"

  - entity: WithdrawalPlan
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, VIOLATED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "system (on FeedShipment DELIVERED when last_feed_consumed_at provided)"
        actor: system
        preconditions:
          - "last_feed_consumed_at IS NOT NULL"
          - "final_market_date = last_feed_consumed_at + withdrawal_hours"
          - "final_market_date <= animal_group.earliest_market_date"
        side_effects: []
      - from: PROVISIONAL
        to: VIOLATED
        trigger: "system (on FeedShipment DELIVERED when final_market_date > animal_group.earliest_market_date)"
        actor: system
        preconditions:
          - "last_feed_consumed_at IS NOT NULL"
          - "final_market_date > animal_group.earliest_market_date"
        side_effects:
          - "Auto-creates ResidueCase on producer with status=OPEN, detected_at=now, residue_ppb=NULL pending lab"

  - entity: ResidueCase
    initial_state: OPEN
    terminal_states: [CONFIRMED_VIOLATION, DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: POST /vfd/residue-cases/{id}/open-investigation
        actor: Inspector
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE)"
        side_effects: []
      - from: UNDER_INVESTIGATION
        to: CONFIRMED_VIOLATION
        trigger: POST /vfd/residue-cases/{id}/confirm
        actor: Inspector
        preconditions:
          - "status == UNDER_INVESTIGATION"
          - "residue_ppb IS NOT NULL AND tolerance_ppb IS NOT NULL (ERR_INVALID_REQUEST)"
        side_effects:
          - "severity_tier computed via residue_severity calculation"
          - "penalty_score_deduction computed via compliance_penalty calculation"
          - "Issuing clinic's compliance_score -= penalty_score_deduction (chronological path: order -> vfd -> vet -> clinic)"
          - "If clinic.compliance_score < 700: clinic.audit_ready -> false"
      - from: UNDER_INVESTIGATION
        to: DISMISSED
        trigger: POST /vfd/residue-cases/{id}/dismiss
        actor: Inspector
        preconditions:
          - "status == UNDER_INVESTIGATION"
        side_effects: []
      - from: OPEN
        to: DISMISSED
        trigger: POST /vfd/residue-cases/{id}/dismiss
        actor: Inspector
        preconditions:
          - "status IN {OPEN, UNDER_INVESTIGATION}"
        side_effects: []

  - entity: AuditBundle
    initial_state: OPEN
    terminal_states: [COMPLETE, DEFICIENT]
    transitions:
      - from: OPEN
        to: COMPLETE
        trigger: POST /vfd/audit-bundles/{id}/close
        actor: Inspector
        preconditions:
          - "status == OPEN"
          - "produced_record_count == required_record_count (ERR_AUDIT_INCOMPLETE)"
        side_effects: []
      - from: OPEN
        to: DEFICIENT
        trigger: POST /vfd/audit-bundles/{id}/mark-deficient
        actor: Inspector
        preconditions:
          - "status == OPEN"
        side_effects:
          - "Producer.status -> SUSPENDED"
          - "Producer's ACTIVE VfdAuthorizations -> cascade EXPIRED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: vfd-supersede-stale-version
    parent_entity: VfdAuthorization
    write_endpoint: "POST /vfd/vfd-authorizations"
    occ_field: "expected_vfd_authorization_version"
    description: |
      Creating a replacement VFD with supersedes_id pointing at a VFD whose
      version has advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. Captures the case where another writer has already
      superseded or cancelled the same VFD and the current writer's view is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: order-validate-stale-vfd
    parent_entity: VfdAuthorization
    write_endpoint: "POST /vfd/feed-orders/{id}/validate"
    occ_field: "expected_vfd_authorization_version"
    description: |
      Validating a FeedOrder against a VFD whose version has advanced since
      the mill last observed it is rejected with ERR_STALE_VERSION. Captures
      the case where another order validation has just debited the VFD's
      remaining_animal_count and this mill's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_market_date
    trigger: "FeedOrder reaching VALIDATED"
    algorithm: forward_looking
    formula: |
      provisional_market_date = max(
        now_utc + withdrawal_window_hours,
        animal_group.earliest_market_date
      )
      where withdrawal_window_hours = VfdDrug.withdrawal_hours (copied at this moment)
    input_set: "the FeedOrder being validated, its VfdAuthorization, the linked VfdDrug, the linked AnimalGroup"
    constants:
      ROUNDING: "truncate to whole minute, UTC"
    precision: "ISO 8601 UTC minute precision"
    variants:
      - name: provisional_forward
        when: "at order validation time; delivery timestamp unknown"
        difference: "uses now_utc as last-feed proxy"
      - name: final_chronological
        when: "at shipment delivery; last_feed_consumed_at attested by producer"
        difference: "uses last_feed_consumed_at instead of now_utc — can differ by days"

  - name: final_market_date
    trigger: "FeedShipment transitioning to DELIVERED"
    algorithm: chronological
    formula: |
      final_market_date = last_feed_consumed_at + withdrawal_window_hours
      if final_market_date > animal_group.earliest_market_date:
        WithdrawalPlan.status -> VIOLATED
        auto-create ResidueCase(OPEN)
      else:
        WithdrawalPlan.status -> FINALIZED
    input_set: "the WithdrawalPlan linked to the delivered FeedOrder"
    constants:
      ROUNDING: "truncate to whole minute, UTC"
    precision: "ISO 8601 UTC minute precision"
    variants:
      - name: final_chronological
        when: "delivery confirmation"
        difference: "uses attested last_feed_consumed_at; produces DIFFERENT value than provisional_market_date"

  - name: vfd_remaining_quota
    trigger: "any FeedOrder transition into or out of VALIDATED; any VFD supersede"
    algorithm: aggregation
    formula: |
      remaining_animal_count = authorized_animal_count
        - sum(FeedOrder.animal_count for FeedOrder where
              vfd_authorization_id == this.id AND
              FeedOrder.status IN {VALIDATED, SHIPPED, DELIVERED})
    input_set: "all FeedOrders bound to this VFD in non-terminal-validated states"
    precision: "integer head count"
    variants:
      - name: forward_looking
        when: "computed at validate time to authorize the order"
        difference: "excludes the in-flight order from the deduction yet; checks (remaining - this_order) >= 0"
      - name: settled
        when: "recomputed after cancellation / supersede / delivery"
        difference: "includes all non-cancelled orders; cancellation adds back"

  - name: residue_severity
    trigger: "ResidueCase transitions to CONFIRMED_VIOLATION"
    algorithm: threshold
    formula: |
      ratio = residue_ppb / tolerance_ppb
      if ratio < 2.0:  severity_tier = TIER_1
      elif ratio < 5.0: severity_tier = TIER_2
      else:             severity_tier = TIER_3
    input_set: "the ResidueCase being confirmed"
    constants:
      TIER_1_MAX: 2.0
      TIER_2_MAX: 5.0
    precision: "ratio computed in float, compared strictly (<)"

  - name: compliance_penalty
    trigger: "ResidueCase -> CONFIRMED_VIOLATION"
    algorithm: tiered_pricing
    formula: |
      # Per-tier marginal deduction, then summed. Round per-tier to integer, then sum.
      # Order matters: tier 1 first, then tier 2, then tier 3.
      ratio = residue_ppb / tolerance_ppb
      deduction = 0
      if ratio > 1.0:
        deduction += round( min(ratio, 2.0) - 1.0 ) * 50      # TIER_1 marginal
      if ratio > 2.0:
        deduction += round( min(ratio, 5.0) - 2.0 ) * 150     # TIER_2 marginal
      if ratio > 5.0:
        deduction += round( ratio - 5.0 ) * 400               # TIER_3 marginal
      deduction += 100   # flat administrative penalty for any confirmed violation
    input_set: "the ResidueCase and the issuing clinic"
    constants:
      TIER_1_RATE: 50
      TIER_2_RATE: 150
      TIER_3_RATE: 400
      FLAT_ADMIN: 100
    precision: |
      round per-tier (round_half_up to integer), then sum. The rounding order is
      load-bearing: round-then-sum produces different totals than sum-then-round.

  - name: audit_required_records
    trigger: "AuditBundle creation"
    algorithm: interval_merge
    formula: |
      # Count records whose [created_at, terminal_at_or_now] interval intersects
      # the audit window [window_start, window_end] using half-open [start, end)
      # semantics for the audit window and closed semantics for record lifetimes.
      # A record qualifies iff record.created_at < window_end
      #   AND (record.terminal_at IS NULL OR record.terminal_at >= window_start)
      required_record_count = count(
        VfdAuthorization records for producer where intersects
      ) + count(
        FeedOrder records for producer where intersects
      ) + count(
        FeedShipment records for producer via order where intersects
      ) + count(
        DistributorAcknowledgment records for the feed_mill of any included order where intersects
      )
    input_set: "all records for the audit's producer"
    precision: "integer count"
    variants:
      - name: half_open_window
        when: "default interpretation"
        difference: "window [start, end); a record created exactly at window_end does NOT count"

  - name: congested_compliance_score
    trigger: "clinic.compliance_score change"
    algorithm: threshold
    formula: |
      audit_ready = (compliance_score >= 700) AND (count(OPEN ResidueCase for any producer under any VFD issued by clinic's vets) == 0)
    input_set: "clinic, all its vets' VFDs, linked producers' residue cases"
    constants:
      AUDIT_THRESHOLD: 700
    precision: "boolean"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role authorized for this endpoint (per §1.5 roles)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "X-User-ID ownership: when endpoint requires entity-backed identity, the acting user's id must match the resource's owner FK"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /vfd/vfd-authorizations (must be vet), /vfd/vfd-authorizations/{id}/revoke (must be issuing vet), /vfd/feed-orders/{id}/cancel when actor=Producer, /vfd/feed-shipments/{id}/{deliver,return,reject-receipt} (must be order's producer), /vfd/vcp-verifications/{id}/revoke (must be VCPR vet)"

  - priority: 4
    category: existence
    check: "Referenced IDs in path and body exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource in correct state for the operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Prohibited extra-label use: extra_label_intended must be false; intended_use_label must match drug label indications"
    error_id: ERR_EXTRA_LABEL_USE
    http_status: 422
    applies_to: "POST /vfd/vfd-authorizations, POST /vfd/feed-orders, POST /vfd/feed-orders/{id}/validate"

  - priority: 7
    category: business_safety
    check: "Species/class pair on label: 'SPECIES:CLASS' string must appear in drug.allowed_species_classes"
    error_id: ERR_SPECIES_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /vfd/vfd-authorizations, POST /vfd/feed-orders/{id}/validate"

  - priority: 8
    category: business_safety
    check: "VCPR must be ACTIVE and cover (issuing vet, producer) at issuance time and at order-validation time"
    error_id: ERR_VCPR_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /vfd/vfd-authorizations, POST /vfd/feed-orders/{id}/validate"

  - priority: 9
    category: business_safety
    check: "No OPEN ResidueCase on the producer at validation time"
    error_id: ERR_RESIDUE_CASE_OPEN
    http_status: 422
    applies_to: "POST /vfd/feed-orders/{id}/validate"

  - priority: 10
    category: business_temporal
    check: "VFD not expired: logical clock < vfd.expiration_date at issuance-derived actions and at validate / ship"
    error_id: ERR_VFD_EXPIRED
    http_status: 409
    applies_to: "POST /vfd/feed-orders/{id}/validate, POST /vfd/feed-orders/{id}/ship"

  - priority: 11
    category: business_temporal
    check: "VFD usable status: vfd.status IN {ISSUED, PARTIALLY_USED}"
    error_id: ERR_VFD_NOT_USABLE
    http_status: 409
    applies_to: "POST /vfd/feed-orders/{id}/validate"

  - priority: 12
    category: business_temporal
    check: "VFD expiration_date <= 6 months from issued_on per 21 CFR 558.6"
    error_id: ERR_VFD_DURATION_EXCEEDED
    http_status: 422
    applies_to: "POST /vfd/vfd-authorizations"

  - priority: 13
    category: business_referential
    check: "DistributorAcknowledgment with status=ACKNOWLEDGED exists covering (feed_mill_id, drug_id)"
    error_id: ERR_ACK_MISSING
    http_status: 422
    applies_to: "POST /vfd/feed-orders/{id}/ship"

  - priority: 14
    category: business_fiscal
    check: "Animal quota: order.animal_count <= vfd.remaining_animal_count"
    error_id: ERR_VFD_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /vfd/feed-orders/{id}/validate"

  - priority: 15
    category: business_constraint
    check: "Producer status: producer.status == ACTIVE (not SUSPENDED or DEBARRED)"
    error_id: ERR_PRODUCER_SUSPENDED
    http_status: 409
    applies_to: "POST /vfd/vfd-authorizations, POST /vfd/feed-orders, POST /vfd/feed-orders/{id}/validate"

  - priority: 16
    category: business_constraint
    check: "Veterinarian status: vet.status == ACTIVE"
    error_id: ERR_VET_INACTIVE
    http_status: 409
    applies_to: "POST /vfd/vfd-authorizations, POST /vfd/vcp-verifications"

  - priority: 17
    category: business_constraint
    check: "AuditBundle complete: produced_record_count == required_record_count before close"
    error_id: ERR_AUDIT_INCOMPLETE
    http_status: 409
    applies_to: "POST /vfd/audit-bundles/{id}/close"

  - priority: 18
    category: business_constraint
    check: "OCC: expected_vfd_authorization_version matches current VFD version on supersede and validate"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /vfd/vfd-authorizations (with supersedes_id), POST /vfd/feed-orders/{id}/validate"

