  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: pause_windows_half_open_adjacency
        grounds:
          - validations[priority=18]
          - entities.ServicePause.fields.start_date
        distinguishing_aspect: |
          Resource: Subscription; interval semantics: half-open [start_date, end_date) with
          adjacency allowed. Pause B starting exactly at pause A's end_date succeeds, while
          pause C overlapping by one day is rejected with ERR_PAUSE_OVERLAP.
        test_recipe:
          setup: ["ACTIVE STANDARD subscription; clock 2026-08-01; subscription version refreshed via GET before each pause creation (each creation bumps it)"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "STANDARD", weekly_quota: 80, weekly_fee_cents: 3900, overage_rate_cents: 10, overage_cap_items: 20, deposit_cents: 18000, service_bags_per_week: 1, weight_policy: "COUNT_BASIS", kit_reserve_pct: 10 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: $.data.id } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "Ov Erlap", email: "oe@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_id}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_id}", as: PlatformAdmin, captures: { kit_id: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin, captures: { sub_v0: $.data.version } }
          trigger:
            - { call: "POST /api/service-pauses", payload: { subscription_id: "${sub_id}", start_date: "2026-08-05", end_date: "2026-08-10", expected_subscription_version: "${sub_v0}" }, as: Customer, as_user_id: "${cust_id}", captures: { pause_a: $.data.id } }
            - { call: "GET /api/subscriptions/${sub_id}", as: PlatformAdmin, captures: { sub_v1: $.data.version } }
            - { call: "POST /api/service-pauses", payload: { subscription_id: "${sub_id}", start_date: "2026-08-10", end_date: "2026-08-14", expected_subscription_version: "${sub_v1}" }, as: Customer, as_user_id: "${cust_id}", captures: { pause_b: $.data.id } }
            - { call: "GET /api/subscriptions/${sub_id}", as: PlatformAdmin, captures: { sub_v2: $.data.version } }
            - { call: "POST /api/service-pauses", payload: { subscription_id: "${sub_id}", start_date: "2026-08-09", end_date: "2026-08-12", expected_subscription_version: "${sub_v2}" }, as: Customer, as_user_id: "${cust_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "pause A [08-05, 08-10) -> 201 SCHEDULED"
            - "pause B [08-10, 08-14) -> 201 SCHEDULED (end == start adjacency is NOT an overlap under half-open semantics)"
            - "pause C [08-09, 08-12) -> $.data.error_id == ERR_PAUSE_OVERLAP (intersects A on 08-09 and B on 08-10/08-11)"

      - name: stop_window_buffer_overlap_semantics
        grounds:
          - validations[priority=19]
        distinguishing_aspect: |
          Resource: Route; interval semantics: buffered windows — a new stop needs a
          15-minute gap on BOTH sides, so window start exactly 735 against an existing
          480-720 stop succeeds while 734 fails with ERR_STOP_WINDOW_CONFLICT. This differs
          from the pause rule's adjacency-allowed half-open semantics on a different
          resource entity.
        test_recipe:
          setup: ["ACTIVE subscriptions A and B in Z-NORTH; route 2026-08-03 PLANNED with auto stops at window 480-720 each"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
