  - name: priority_pair_c_session_in_past_masks_guest_capacity
    grounds:
    - §1.4 priority 32 ERR_SESSION_IN_PAST (PAIR C high side)
    - §1.4 priority 38 ERR_GUEST_CAPACITY_EXCEEDED (PAIR C low side)
    - §1.1 InteractionSession.starts_at / ends_at / max_guests / guest_count
    - §1.5 POST /aquarium/interaction-sessions
    - §1.5 GET /aquarium/exhibits/{id}/interaction-sessions
    distinguishing_aspect: One payload breaks both the temporal rule and the capacity rule. Priority 32 wins. Moving ONLY the window into the future — keeping guest_count 9 against max_guests 6 — surfaces ERR_GUEST_CAPACITY_EXCEEDED from the same endpoint, and the strict boundary means starts_at exactly equal to clock_now is also rejected.
    test_recipe:
      setup: One COLD_MARINE plant, one exhibit with the interaction programme enabled and no sessions at all. Clock at 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {current_utc: '2026-08-01T00:00:00Z'}
        as: ComplianceDirector
      - call: POST /aquarium/life-support-systems
