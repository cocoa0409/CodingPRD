              captures: { bi_cast1: "$.data.votes_cast", bi_q1: "$.data.quorum_met" }
            - call: "POST /ballot-interpretations/${bi_id}/votes"
              payload: { party: "REP", vote: "REJECT" }
              as: CanvassingBoardMember
              as_user_id: "u-board-2"
          trigger:
            - call: "POST /ballot-interpretations/${bi_id}/votes"
              payload: { party: "DEM", vote: "ABSTAIN" }
              as: CanvassingBoardMember
              as_user_id: "u-board-3"
              captures: { bi_final: "$.data.status", bi_det: "$.data.final_determination", bi_cast: "$.data.votes_cast", bi_q: "$.data.quorum_met" }
          assert:
            - "${bi_status} == PENDING and ${bi_cast1} == 1 and ${bi_q1} == false (one vote never meets quorum)"
            - "${bi_final} == DEADLOCKED and ${bi_det} == null and ${bi_cast} == 3 and ${bi_q} == true"
            - "BallotInterpretation.${bi_id}.accept_count == 1 and reject_count == 1 and board_votes has 3 entries"
            - "ManualTally.${mt1_id}.status == SUBMITTED and ambiguous_ballot_count == 1 and no_vote_count == 0"
            - "ManualTally.${mt1_id}.counted_votes == { ALVAREZ: 521, BRENNAN: 478 } and net_error_votes == 7"
            - "AuditRound.${r1_id}.cumulative_net_error_votes == 7 and discrepancy_count == 1"
      - name: ledger_sync_round_and_audit_counters_follow_a_submitted_tally
        claim_type: Ledger sync
        grounds:
          - state_machines.ManualTally
          - state_machines.AuditRound
          - state_machines.Audit
          - entities.Election.fields.certification_risk_flag
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_tally_submit_five_hops_to_election_risk_flag
          rationale: "That instance already walks the full ledger chain of one submit - Discrepancy created, AuditRound counters and round_measure re-derived, AuditRound -> REVIEW_REQUIRED, Audit -> DISCREPANCY_REVIEW, Election.certification_risk_flag set - and reconciles every counter before and after."
      - name: compensation_reopen_reverses_every_submit_side_effect
        claim_type: Compensation
        grounds:
          - state_machines.ManualTally
          - state_machines.Discrepancy
          - state_machines.AuditRound
          - endpoints.POST_/manual-tallies/{id}/reopen
        excluded_because:
          difficulty_instance: compensating_invariant / compensating_reopen_restores_audit_error_ledger
          rationale: "That instance reopens a submitted tally and asserts that the Discrepancy is VOIDED, the AuditRound counters and round_measure return to their pre-submit values, the Audit falls back to TALLYING and the risk flag clears, with no residual drift."
      - name: cyclic_shape_tally_can_loop_draft_submitted_draft
        claim_type: Idempotency
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.ManualTally
          - entities.ManualTally.fields.reopen_count
          - errors[ERR_REOPEN_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / nonlinear_tally_reopen_cycle_bounded_at_two
          rationale: "The cyclic-shape claim (the loop works and its termination condition is respected) is exactly that instance: it drives DRAFT -> SUBMITTED -> DRAFT twice, checks reopen_count 1 then 2, and asserts the third reopen fails with ERR_REOPEN_LIMIT_EXCEEDED."
      - name: guarded_transition_recount_start_requires_no_live_audit
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Recount
          - validations[priority=17]
          - errors[ERR_AUDIT_NOT_TERMINAL]
          - endpoints.POST_/recounts/{id}/start
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_entity_recount_start_blocked_by_live_audit
          rationale: "That instance already tests the guard in both directions: the start is refused with ERR_AUDIT_NOT_TERMINAL while an audit of the contest is live, and succeeds unchanged once that audit reaches a terminal status."
  # ===========================================================================
  - section: calculations
    instances:

      - name: canvass_ranking_breaks_a_runner_up_tie_by_name_ascending
        claim_type: Correct Result
        grounds:
          - calculations.contest_margin_canvass
          - endpoints.POST_/contests/{id}/canvass-results
          - entities.Contest.fields.runner_up_name
        distinguishing_aspect: |
          With three candidates and the second and third tied at 1500, the ranking key (votes DESC, name
          ASC) makes BRENNAN the runner-up, so margin_votes is 2000 - 1500 = 500 and margin_pct is
          round_half_up(500 / 6000 * 100, 4) = 8.3333 - the margin is measured against the runner-up, never
          against the total of the losing candidates.
        test_recipe:
          setup:
            - "An election ST-04 whose only contest C1 has three candidates and 6000 ballots cast."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-04", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN", "CHEN"], ballots_cast: 6000 }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /contests/${c1_id}/canvass-results"
              payload: { reported_votes: { ALVAREZ: 2000, BRENNAN: 1500, CHEN: 1500 } }
              as: ElectionsDirector
              captures: { w: "$.data.winner_name", r: "$.data.runner_up_name", mv: "$.data.margin_votes", mp: "$.data.margin_pct" }
          assert:
            - "${w} == ALVAREZ and ${r} == BRENNAN"
            - "${mv} == 500 and ${mp} == 8.3333"
            - "Contest.${c1_id}.automatic_recount_required == false and status == CANVASSED"
            - "Contest.${c1_id}.recount_request_deadline_at == 2026-11-10T09:00:00Z"
            - "Election.${e1_id}.status == CANVASSED"
      - name: round_counters_count_only_submitted_tallies
        claim_type: Input Set Filtering
        grounds:
          - calculations.tally_discrepancy_measure
          - entities.AuditRound.fields.counted_ballots
          - entities.AuditRound.fields.round_measure
          - state_machines.ManualTally
        distinguishing_aspect: |
          The round roll-up sums only tallies with status in {SUBMITTED, CERTIFIED}: with one submitted
          522/478 count and one DRAFT count open on a second batch, counted_ballots is 1000 rather than 2000
          and round_measure is 6 / 1000 = 0.0060, so the DRAFT sheet contributes neither ballots nor error.
        test_recipe:
          setup:
            - "E1 with A1 seeded and round 1 drawn ([B-003, B-004, B-005]); B-003 and B-004 are both retrieved."
            - "Team T-1 counted B-003 as 522/478 in session 09:00-11:00 and submitted it."
            - "The same team then opened a DRAFT count of B-004 for the adjacent 11:00-13:00 session."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000, cvr_available: true }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e1_id}", contest_id: "${c1_id}", batches: [{ batch_label: "B-001", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-001" }, { batch_label: "B-002", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-002" }, { batch_label: "B-003", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-003" }, { batch_label: "B-004", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-004" }, { batch_label: "B-005", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-005" }, { batch_label: "B-006", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-006" }] }
              as: CustodyOfficer
              captures: { bulk_count: "$.data.created_count" }
            - call: "POST /contests/${c1_id}/canvass-results"
              payload: { reported_votes: { ALVAREZ: 3150, BRENNAN: 2850 } }
              as: ElectionsDirector
              captures: { c1_v: "$.data.version" }
            - call: "POST /tally-teams"
              payload: { election_id: "${e1_id}", team_label: "T-1", room_code: "ROOM-A" }
              as: ElectionsDirector
              captures: { t1_id: "$.data.id" }
            - call: "POST /tally-teams/${t1_id}/members"
              payload: { members: [{ user_id: "u-dem-1", party: "DEM", seat_role: "LEAD" }, { user_id: "u-rep-1", party: "REP", seat_role: "COUNTER" }] }
              as: ElectionsDirector
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "RISK_LIMITING", risk_limit_alpha: 0.05 }
              as: AuditManager
              captures: { a1_id: "$.data.id" }
            - call: "POST /audits/${a1_id}/seed"
              payload: { random_seed: "0459231087" }
              as: AuditManager
              captures: { a1_v: "$.data.version" }
            - call: "POST /audits/${a1_id}/rounds"
              payload: { expected_audit_version: "${a1_v}" }
              as: AuditManager
              captures: { r1_id: "$.data.id" }
            - call: "GET /audit-batches"
              payload: { audit_round_id: "${r1_id}", limit: 100 }
              as: CustodyOfficer
              captures: { ab3_id: "$.data[0].id", ab4_id: "$.data[1].id", ab5_id: "$.data[2].id" }
            - call: "GET /ballot-batches"
              payload: { contest_id: "${c1_id}", limit: 100 }
              as: CustodyOfficer
              captures: { bb1_id: "$.data[0].id", bb1_v: "$.data[0].version", bb2_id: "$.data[1].id", bb2_v: "$.data[1].version", bb3_id: "$.data[2].id", bb3_v: "$.data[2].version", bb4_id: "$.data[3].id", bb4_v: "$.data[3].version", bb5_id: "$.data[4].id", bb5_v: "$.data[4].version", bb6_id: "$.data[5].id", bb6_v: "$.data[5].version" }
            - call: "POST /audit-batches/${ab3_id}/retrieve"
              payload: { expected_ballot_batch_version: "${bb3_v}", observed_seal_number: "SEAL-003" }
              as: CustodyOfficer
            - call: "POST /audit-batches/${ab4_id}/retrieve"
              payload: { expected_ballot_batch_version: "${bb4_v}", observed_seal_number: "SEAL-004" }
              as: CustodyOfficer
            - call: "POST /manual-tallies"
              payload: { audit_batch_id: "${ab3_id}", tally_team_id: "${t1_id}", session_start_at: "2026-11-05T09:00:00Z", session_end_at: "2026-11-05T11:00:00Z", counted_votes: { ALVAREZ: 522, BRENNAN: 478 }, ambiguous_ballot_count: 0, no_vote_count: 0 }
              as: TallyTeamLead
              as_user_id: "${t1_id}"
              captures: { mt1_id: "$.data.id" }
            - call: "POST /manual-tallies/${mt1_id}/submit"
              payload: { }
              as: TallyTeamLead
              as_user_id: "${t1_id}"
          trigger:
            - call: "POST /manual-tallies"
              payload: { audit_batch_id: "${ab4_id}", tally_team_id: "${t1_id}", session_start_at: "2026-11-05T11:00:00Z", session_end_at: "2026-11-05T13:00:00Z", counted_votes: { ALVAREZ: 525, BRENNAN: 475 }, ambiguous_ballot_count: 0, no_vote_count: 0 }
              as: TallyTeamLead
              as_user_id: "${t1_id}"
              captures: { mt2_id: "$.data.id" }
          assert:
            - "ManualTally.${mt2_id}.status == DRAFT and net_error_votes == null"
            - "AuditRound.${r1_id}.counted_ballots == 1000 and cumulative_net_error_votes == 6 and discrepancy_count == 1"
            - "AuditRound.${r1_id}.round_measure == 0.0060 and status == REVIEW_REQUIRED"
            - "Audit.${a1_id}.counted_ballots == 1000 and cumulative_net_error_votes == 6 and discrepancy_measure == 0.0060"
            - "Audit.${a1_id}.cumulative_sampled_batches == 3 and status == DISCREPANCY_REVIEW"
            - "ManualTally.${mt1_id}.net_error_votes == 6 and relative_taint == 0.9000"
      - name: automatic_recount_threshold_is_selected_by_contest_type
        claim_type: Constants Applied
        grounds:
          - calculations.recount_trigger_evaluation
          - entities.Contest.fields.automatic_recount_required
          - entities.Contest.fields.contest_type
        distinguishing_aspect: |
          The same margin_pct decides differently by contest_type: 0.3000 clears the MEASURE ceiling of
          0.2500 (no automatic recount) but not the CANDIDATE ceiling of 0.5000 (automatic recount), while a
          MEASURE margin of exactly 0.2500 triggers because the comparison is inclusive.
        test_recipe:
          setup:
            - "Election ST-05 with three 4000-ballot contests: M1 and M2 are MEASURE contests (YES/NO) and"
            - "K1 is a CANDIDATE contest (PATEL/QUINN). Nothing is audited."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-05", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "M1", office_name: "Bond Measure A", contest_type: "MEASURE", candidate_names: ["YES", "NO"], ballots_cast: 4000 }
              as: ElectionsDirector
              captures: { m1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "M2", office_name: "Bond Measure B", contest_type: "MEASURE", candidate_names: ["YES", "NO"], ballots_cast: 4000 }
              as: ElectionsDirector
              captures: { m2_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "K1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["PATEL", "QUINN"], ballots_cast: 4000 }
              as: ElectionsDirector
              captures: { k1_id: "$.data.id" }
          trigger:
            - call: "POST /contests/${m1_id}/canvass-results"
              payload: { reported_votes: { YES: 2005, NO: 1995 } }
              as: ElectionsDirector
              captures: { m1_pct: "$.data.margin_pct", m1_auto: "$.data.automatic_recount_required" }
            - call: "POST /contests/${m2_id}/canvass-results"
              payload: { reported_votes: { YES: 2006, NO: 1994 } }
              as: ElectionsDirector
              captures: { m2_pct: "$.data.margin_pct", m2_auto: "$.data.automatic_recount_required" }
            - call: "POST /contests/${k1_id}/canvass-results"
              payload: { reported_votes: { PATEL: 2006, QUINN: 1994 } }
              as: ElectionsDirector
              captures: { k1_pct: "$.data.margin_pct", k1_auto: "$.data.automatic_recount_required" }
          assert:
            - "${m1_pct} == 0.2500 and ${m1_auto} == true (10 votes in 4000; the MEASURE ceiling is inclusive)"
            - "${m2_pct} == 0.3000 and ${m2_auto} == false (12 votes in 4000 is above the MEASURE ceiling)"
            - "${k1_pct} == 0.3000 and ${k1_auto} == true (the same margin is below the CANDIDATE ceiling)"
            - "Contest.${m1_id}.margin_votes == 10 and Contest.${m2_id}.margin_votes == 12 and Contest.${k1_id}.margin_votes == 12"
            - "all three contests have recount_request_deadline_at == 2026-11-10T09:00:00Z"
            - "Election.${e1_id}.status == CANVASSED"
      - name: margin_pct_rounds_half_up_at_the_fourth_decimal
        claim_type: Precision
        grounds:
          - calculations.contest_margin_canvass
          - entities.Contest.fields.margin_pct
        distinguishing_aspect: |
          margin_pct is round_half_up at 4 decimals, not truncated: 23 / 16000 * 100 = 0.143750 lands on
          0.1438 (a truncating or round-half-even implementation returns 0.1437), while 100 / 6000 * 100 =
          1.66666... lands on 1.6667.
        test_recipe:
          setup:
            - "Election ST-06 with contest P1 (16000 ballots, KING/LOWE) and contest P2 (6000 ballots, MOORE/NASH)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
