# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3088 - payment-operations-ledger-bank-transaction-reconciliation
#
# Breadth probe: every testable claim the §1.1-§1.7 surface declares that §1.8
# does not already exercise. Sections and claim_types are taken from
# references/claim-extraction-guide.md; no new categories are invented.
# Corners §1.8 already covers appear as `excluded_because:` stubs with no
# test_recipe. All 33 live instances were replayed against §1.5 for endpoint,
# role, payload, capture and OCC-version conformance (scaffold_lint.py: clean).
# =============================================================================
scaffold_corner_design:
- section: entities
  instances:
  - name: ledger_create_returns_every_declared_field_and_opens_period_one
    claim_type: Creation
    grounds:
    - entities.Ledger
    - entities.Ledger.fields.period_index
    - entities.Ledger.fields.period_closed_through_index
    - response_envelope.success
    distinguishing_aspect: A ledger posted with only name and currency comes back 201 with period_index 1, period_closed_through_index
      0, both derived balances at 0, version 1 and server-minted id/created_at/updated_at.
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /ledgers
        payload:
          name: Primary Ledger
          currency: USD
        as: PlatformAdmin
        captures:
          c1_ledger: $.data.id
      assert:
      - the response is 201 with response_type object and non-null meta.api_request_id
      - Ledger.${c1_ledger}.period_index == 1 and period_closed_through_index == 0
      - Ledger.${c1_ledger}.pending_balance_cents == 0 and posted_balance_cents == 0 and status == OPEN
      - Ledger.${c1_ledger}.version == 1
- section: entities
  instances:
  - name: bank_account_get_round_trips_every_configuration_field
