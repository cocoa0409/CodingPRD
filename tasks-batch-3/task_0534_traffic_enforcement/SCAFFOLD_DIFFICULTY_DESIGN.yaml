              payload: { program_id: "${pid}", plate_number: "ABC123", full_name: "Pat Owner", mailing_address: "1 St" }
              as: ProgramAdmin
              captures: { owner: $.data.id, pin: $.data.portal_access_pin }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /citations"
