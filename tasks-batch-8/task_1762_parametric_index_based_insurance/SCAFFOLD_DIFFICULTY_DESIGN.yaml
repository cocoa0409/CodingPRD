              as: ServicingAgent
              captures: { inv_id: "$.data[0].id", inv_amount: "$.data[0].invoice_amount_cents" }
          trigger:
            - call: "POST /programs/${prog_id}/invoices/${inv_id}/payments"
              payload: { amount_cents: 200000 }
              as: ServicingAgent
              captures: { paid1: $.data.amount_paid_cents, st1: $.data.status }
            - call: "POST /programs/${prog_id}/invoices/${inv_id}/payments"
              payload: { amount_cents: 106000 }
