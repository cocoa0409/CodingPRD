        distinguishing_aspect: "The buyer has an ACTIVE in-window policy, but its 20000.00 headroom is short of the 25000.00 required charge, so the candidate set is empty: the uninsured_passthrough variant applies silently — no error, no partial charge of 20000.00, insured_exposure_usd stays 0.00 and the policy is left completely untouched."
        test_recipe:
          setup:
            - "A BBB buyer with one ACTIVE policy of limit 20000.00 and a 25000.00 order under review by u_rev_bob with no findings."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /credit-insurance-policies"
              as: FinanceCollectionsOfficer
              as_user_id: "u_fin_frank"
              payload:
                buyer_id: "${buyer_id}"
                policy_number: "POL-2026-0004"
                credit_limit_usd: 20000.00
                insured_pct: 90.00
                deductible_usd: 5000.00
                effective_from: "2026-07-01T00:00:00Z"
                effective_to: "2027-06-30T00:00:00Z"
              captures: { policy_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Long Beach"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { line_no: 1, goods_description: "Industrial valve assembly", hs_code: "848180", quantity: 100.000, uom: "EA", unit_price_usd: 250.0000, net_weight_kg: 1000.000, gross_weight_kg: 1200.000, package_count: 20 }
              captures: { line_1: "$.data.id" }
            - call: "POST /letters-of-credit"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                export_order_id: "${order_id}"
                lc_number: "LC-2026-0004"
                issuing_bank_swift: "HVBKKRSE"
                amount_usd: 25000.00
                tolerance_pct: 10.00
                availability: "SIGHT"
                usance_days: 0
                expiry_date: "2026-11-30T00:00:00Z"
                latest_shipment_date: "2026-09-15T00:00:00Z"
                presentation_period_days: 21
                partial_shipment_allowed: false
                transshipment_allowed: false
                required_document_types: ["COMMERCIAL_INVOICE"]
              captures: { lc_id: "$.data.id", lc_v: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_id}/reviews"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { expected_letter_of_credit_version: "${lc_v}" }
              captures: { review_id: "$.data.id" }
          trigger:
            - call: "POST /lc-terms-reviews/${review_id}/submit"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { recommendation: "ACCEPT" }
          assert:
            - "HTTP 200; data.recommendation == \"ACCEPT\"; data.terms_risk_score == 0 with data.finding_count == 0"
            - "GET /letters-of-credit/${lc_id} reports status == \"ACCEPTED\" and GET /export-orders/${order_id} reports settlement_status == \"LC_ACCEPTED\" — the acceptance is not blocked by the missing coverage"
            - "GET /export-orders/${order_id} reports insured_exposure_usd == 0 — no partial 20000.00 charge is made"
            - "GET /credit-insurance-policies/${policy_id} still reports utilized_usd == 0, available_limit_usd == 20000.00, status \"ACTIVE\" and premium_usd == 153.00"
            - "GET /foreign-buyers/${buyer_id} reports aggregate_exposure_usd == 0"

  # ===========================================================================
  # §1.4 Validation Rules
  # ===========================================================================
  - section: validations
    instances:

      - name: corner_role_check_precedes_path_parameter_resolution
        claim_type: priority_conflict
        grounds:
          - validations.priority_3
          - validations.priority_5
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "A ForeignBuyer asking for a policy that does not exist violates both priority 3 (the role is absent from the endpoint's roles list) and priority 5 (the path id resolves to nothing). First-failure-wins must return the 403 ERR_ROLE_NOT_PERMITTED and must not leak the 404 ERR_POLICY_NOT_FOUND, which would tell an unauthorised caller whether the id exists."
        test_recipe:
          setup:
            - "One registered ForeignBuyer so that the identity header resolves; no policies exist."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
          trigger:
            - call: "GET /credit-insurance-policies/00000000-0000-0000-0000-0000000000ff"
              as: ForeignBuyer
              as_user_id: "${buyer_id}"
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 with data.error_id == \"ERR_ROLE_NOT_PERMITTED\" — never 404 ERR_POLICY_NOT_FOUND and never 403 ERR_BUYER_SCOPE_VIOLATION"
            - "data.message is present and no CreditInsurancePolicy row is created or read"

      - name: corner_path_parameter_resolves_before_body_foreign_key
        claim_type: priority_conflict
        grounds:
          - validations.priority_5
          - validations.priority_6
          - errors[ERR_SCREENING_NOT_FOUND]
        distinguishing_aspect: "clear-with-license carries a bogus screening in the path and a bogus license in the body at the same time. Priority 5 (path params, left to right) must beat priority 6 (body foreign keys), so the answer is ERR_SCREENING_NOT_FOUND and never ERR_LICENSE_NOT_FOUND — the ordering between the two 404 families is observable only in this double-miss case."
        test_recipe:
          setup:
            - "Empty system: no screenings and no licenses exist."
          setup_api_calls: []
          trigger:
            - call: "POST /export-control-screenings/00000000-0000-0000-0000-00000000dead/clear-with-license"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { export_license_id: "00000000-0000-0000-0000-00000000beef" }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 with data.error_id == \"ERR_SCREENING_NOT_FOUND\""
            - "the response does not mention the license id and no ExportControlScreening or ExportLicense state changes"

      - name: corner_pagination_bounds_rejected_before_any_filtering
        claim_type: violation_to_error
        grounds:
          - validations.priority_9
          - errors[ERR_INVALID_PAGINATION]
          - endpoints.GET /trade-documents
        distinguishing_aspect: "limit 101 sits one past the inclusive [1, 100] window, so the list must 422 rather than clamp; the same request with limit 100 succeeds. The rule is checked before the filter arguments are interpreted, so a nonsense doc_type filter alongside it is never reported."
        test_recipe:
          setup:
            - "Empty system: no trade documents exist."
          setup_api_calls: []
          trigger:
            - call: "GET /trade-documents"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { limit: 101, offset: 0 }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INVALID_PAGINATION\""
            - "the same call with limit 100 and offset 0 returns HTTP 200 with total_count == 0 and has_more false — 100 is inside the window"
            - "a call with offset -1 also returns ERR_INVALID_PAGINATION, and neither attempt returns ERR_VALIDATION"

      - name: corner_sight_credit_with_usance_days_is_inconsistent_terms
        claim_type: violation_to_error
        grounds:
          - validations.priority_10
          - errors[ERR_INCONSISTENT_TERMS]
          - endpoints.POST /letters-of-credit
        distinguishing_aspect: "Every field is individually well typed and in range — availability SIGHT is a legal enum and usance_days 45 is a legal non-negative integer — so only the intra-body cross-consistency rule at priority 10 can catch the pair. The mirror case USANCE with usance_days 15 (below the 30-day minimum) must be caught by the same rule, and neither may surface as the priority-8 ERR_VALIDATION."
        test_recipe:
          setup:
            - "One buyer and one DRAFT order to hang the credit on."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Long Beach"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /letters-of-credit"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                export_order_id: "${order_id}"
                lc_number: "LC-2026-0010"
                issuing_bank_swift: "HVBKKRSE"
                amount_usd: 25000.00
                availability: "SIGHT"
                usance_days: 45
                expiry_date: "2026-11-30T00:00:00Z"
                latest_shipment_date: "2026-09-15T00:00:00Z"
                required_document_types: ["COMMERCIAL_INVOICE"]
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INCONSISTENT_TERMS\" — not ERR_VALIDATION, because each field is individually valid"
            - "the same body with availability \"USANCE\" and usance_days 15 also returns ERR_INCONSISTENT_TERMS (the USANCE floor is 30 days)"
            - "no LetterOfCredit row is created: GET /letters-of-credit?export_order_id=${order_id} returns total_count == 0"

      - name: corner_decimal_scale_over_declared_precision_is_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_8
          - errors[ERR_VALIDATION]
          - entities.ShipmentLine.fields.quantity
        distinguishing_aspect: "quantity carries exactly 3 decimals and unit_price_usd exactly 4, so 10.0001 kg is a scale violation rather than a range violation: the request must 422 with ERR_VALIDATION instead of silently rounding to 10.000, which would quietly change ordered_goods_value_usd."
        test_recipe:
          setup:
            - "One buyer and one DRAFT order with no lines yet."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Long Beach"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { line_no: 1, goods_description: "Industrial valve assembly", hs_code: "848180", quantity: 10.0001, uom: "EA", unit_price_usd: 250.0000, net_weight_kg: 1000.000, gross_weight_kg: 1200.000, package_count: 20 }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_VALIDATION\""
            - "GET /export-orders/${order_id}/shipment-lines returns total_count == 0 and GET /export-orders/${order_id} still reports ordered_goods_value_usd == 0"
            - "the order's version is unchanged — a rejected line never bumps the parent"

      - name: corner_short_shipment_claim_is_bounded_by_short_shipped_value_not_order_value
        claim_type: cross_entity
        grounds:
          - validations.priority_35
          - errors[ERR_CLAIM_AMOUNT_INVALID]
          - entities.ExportOrder.fields.short_shipped_value_usd
        distinguishing_aspect: "5000.00 is comfortably inside the 25000.00 ordered value, so the generic claim bound passes; the SHORT_SHIPMENT-specific bound compares against short_shipped_value_usd, which is still 0 because no bill of lading has been issued. Only the type-conditional half of priority 35 can reject this, and a QUALITY dispute for the same amount must be accepted."
        test_recipe:
          setup:
            - "A DRAFT order worth 25000.00 whose short_shipped_value_usd is 0."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Long Beach"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { line_no: 1, goods_description: "Industrial valve assembly", hs_code: "848180", quantity: 100.000, uom: "EA", unit_price_usd: 250.0000, net_weight_kg: 1000.000, gross_weight_kg: 1200.000, package_count: 20 }
              captures: { line_1: "$.data.id" }
          trigger:
            - call: "POST /dispute-cases"
              as: ForeignBuyer
              as_user_id: "${buyer_id}"
              payload: { export_order_id: "${order_id}", dispute_type: "SHORT_SHIPMENT", claimed_amount_usd: 5000.00 }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_CLAIM_AMOUNT_INVALID\" — the 25000.00 ordered-value bound is satisfied, the 0 short-shipped bound is not"
            - "the identical request with dispute_type \"QUALITY\" returns HTTP 201 with status \"OPEN\" and claimed_amount_usd == 5000.00"
            - "GET /dispute-cases?export_order_id=${order_id} shows only the QUALITY case"

      - name: corner_offer_above_claimed_amount_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_35
          - errors[ERR_OFFER_AMOUNT_INVALID]
          - endpoints.POST /dispute-cases/{dispute_id}/offers
        distinguishing_aspect: "An offer of 5000.01 against a 5000.00 claim exceeds the claim by one cent: the bound is inclusive, so 5000.00 must be accepted and 5000.01 rejected, and the rejected attempt must leave the case in OPEN with current_offer_usd untouched rather than in OFFERED."
        test_recipe:
          setup:
            - "An OPEN QUALITY dispute claimed at 5000.00 on a 25000.00 order."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Long Beach"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { line_no: 1, goods_description: "Industrial valve assembly", hs_code: "848180", quantity: 100.000, uom: "EA", unit_price_usd: 250.0000, net_weight_kg: 1000.000, gross_weight_kg: 1200.000, package_count: 20 }
              captures: { line_1: "$.data.id" }
            - call: "POST /dispute-cases"
              as: FinanceCollectionsOfficer
              as_user_id: "u_fin_frank"
              payload: { export_order_id: "${order_id}", dispute_type: "QUALITY", claimed_amount_usd: 5000.00 }
              captures: { dispute_id: "$.data.id" }
          trigger:
            - call: "POST /dispute-cases/${dispute_id}/offers"
              as: FinanceCollectionsOfficer
              as_user_id: "u_fin_frank"
              payload: { offer_amount_usd: 5000.01 }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_OFFER_AMOUNT_INVALID\""
            - "GET /dispute-cases/${dispute_id} still reports status == \"OPEN\", current_offer_usd == 0 and negotiation_round == 0"
            - "a follow-up offer of exactly 5000.00 returns HTTP 200 and moves the case to \"OFFERED\" — the bound is inclusive"

      - name: corner_line_no_uniqueness_is_scoped_to_the_owning_order
        claim_type: violation_to_error
        grounds:
          - validations.priority_26
          - errors[ERR_DUPLICATE_LINE_NO]
        distinguishing_aspect: "line_no 1 must collide inside one order and be perfectly legal on a second order created for the same buyer — the uniqueness scope is (export_order_id, line_no), not global, so the test needs both halves to distinguish a per-order index from a global one."
        test_recipe:
          setup:
            - "One buyer with two DRAFT orders; order A already carries line_no 1."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Hanwha Trading Co", country_code: "KR", credit_rating: "BBB" }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Long Beach"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-01T00:00:00Z"
              captures: { order_a: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                buyer_id: "${buyer_id}"
                incoterm: "FOB"
                incoterm_named_place: "FOB Long Beach"
                origin_country_code: "US"
                destination_country_code: "KR"
                destination_zone: "ZONE_2"
                ship_by_date: "2026-10-05T00:00:00Z"
              captures: { order_b: "$.data.id" }
            - call: "POST /export-orders/${order_a}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { line_no: 1, goods_description: "Valve body", hs_code: "848180", quantity: 10.000, uom: "EA", unit_price_usd: 100.0000, net_weight_kg: 350.000, gross_weight_kg: 400.000, package_count: 20 }
              captures: { line_a1: "$.data.id" }
          trigger:
            - call: "POST /export-orders/${order_a}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { line_no: 1, goods_description: "Valve bonnet", hs_code: "848180", quantity: 5.000, uom: "EA", unit_price_usd: 120.0000, net_weight_kg: 150.000, gross_weight_kg: 200.000, package_count: 5 }
              captures: { err: "$.data.error_id" }
            - call: "POST /export-orders/${order_b}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { line_no: 1, goods_description: "Valve bonnet", hs_code: "848180", quantity: 5.000, uom: "EA", unit_price_usd: 120.0000, net_weight_kg: 150.000, gross_weight_kg: 200.000, package_count: 5 }
          assert:
            - "the collision on order A returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_LINE_NO\" and leaves ordered_goods_value_usd at 1000.00"
            - "the same line_no on order B returns HTTP 201 — the index is per order"
            - "GET /export-orders/${order_a}/shipment-lines returns total_count == 1 and GET /export-orders/${order_b}/shipment-lines returns total_count == 1"

      - name: corner_voyage_uniqueness_is_scoped_to_carrier_scac
        claim_type: violation_to_error
        grounds:
          - validations.priority_26
          - errors[ERR_DUPLICATE_VOYAGE]
        distinguishing_aspect: "voyage_no V2609E collides only within the same carrier_scac: the second HLCU sailing is refused while an identically numbered MAEU sailing is published without complaint. A global voyage_no index would wrongly reject the second carrier."
        test_recipe:
          setup:
            - "One HLCU sailing on voyage V2609E already published."
          setup_api_calls:
            - call: "POST /vessel-sailings"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                carrier_scac: "HLCU"
                vessel_name: "MV Pacific Trader"
                voyage_no: "V2609E"
                port_of_loading: "USLGB"
                port_of_discharge: "KRPUS"
                destination_zone: "ZONE_2"
                cutoff_at: "2026-09-10T00:00:00Z"
                etd: "2026-09-12T00:00:00Z"
                eta: "2026-09-30T00:00:00Z"
                capacity_weight_kg: 100000.000
                tariff_rate_per_1000kg_usd: 300.00
              captures: { sailing_a: "$.data.id" }
          trigger:
            - call: "POST /vessel-sailings"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                carrier_scac: "HLCU"
                vessel_name: "MV Pacific Voyager"
                voyage_no: "V2609E"
                port_of_loading: "USOAK"
                port_of_discharge: "KRPUS"
                destination_zone: "ZONE_2"
                cutoff_at: "2026-09-20T00:00:00Z"
                etd: "2026-09-22T00:00:00Z"
                eta: "2026-10-10T00:00:00Z"
                capacity_weight_kg: 50000.000
                tariff_rate_per_1000kg_usd: 310.00
              captures: { err: "$.data.error_id" }
            - call: "POST /vessel-sailings"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload:
                carrier_scac: "MAEU"
                vessel_name: "MV Gulf Runner"
                voyage_no: "V2609E"
                port_of_loading: "USLGB"
                port_of_discharge: "AEJEA"
                destination_zone: "ZONE_3"
                cutoff_at: "2026-09-20T00:00:00Z"
                etd: "2026-09-22T00:00:00Z"
                eta: "2026-10-15T00:00:00Z"
                capacity_weight_kg: 50000.000
                tariff_rate_per_1000kg_usd: 320.00
              captures: { sailing_c: "$.data.id" }
          assert:
            - "the second HLCU sailing returns HTTP 409 with data.error_id == \"ERR_DUPLICATE_VOYAGE\""
            - "the MAEU sailing on the same voyage_no returns HTTP 201 with status \"OPEN\" and booked_weight_kg == 0"
            - "a sailing whose etd precedes its cutoff_at instead returns ERR_INCONSISTENT_TERMS (priority 10), a different rule from this one"

      - name: corner_lc_number_may_be_reused_once_the_prior_credit_is_rejected
        claim_type: conditional_validation
        grounds:
          - validations.priority_26
