            - "a GovernanceLedgerEntry with entry_type == APPROVAL_SUSPENDED, reach_delta == 0 and debt_delta == 0.00 was appended"
            - "GET /inventory-summary still reports inventory_count == 1 and portfolio_approved_reach == 5000, and ledger_reach_balance == 5000"
            - "outcome CONFIRMED on the same state would instead have returned status APPROVED with reassessment_cycle_index 2 and a REASSESSMENT_COMPLETED entry"

  # ===========================================================================
  # 6. ERRORS
  # ===========================================================================
  - section: errors
    instances:

      - name: model_asset_unknown_id_not_found
        claim_type: error_triggerable
        grounds: ["errors[ERR_MODEL_ASSET_NOT_FOUND]", "validations[p4]", "endpoints[GET /model-assets/{id}]"]
        distinguishing_aspect: "Any /model-assets/{id} path whose id resolves to nothing returns 404 ERR_MODEL_ASSET_NOT_FOUND, a different code from the ERR_GOVERNANCE_RECORD_NOT_FOUND used for the seven satellite entities."
        test_recipe:
          setup: ["One registered asset exists so the collection is non-empty; the trigger addresses the literal id 'ma_missing_404'."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Internal ML Platform", model_name: "helios-mini", model_version: "1.0.0", hosting: "INTERNAL", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset: "$.data.id"}}
          trigger:
            - {call: "GET /model-assets/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {err: "$.data.error_id"}}
          assert:
            - "the trigger addresses the literal id 'ma_missing_404'"
            - "HTTP 404 with data.error_id == ERR_MODEL_ASSET_NOT_FOUND"
            - "the existing asset is untouched at version 1"

      - name: review_gate_unknown_id_not_found
        claim_type: error_triggerable
        grounds: ["errors[ERR_REVIEW_GATE_NOT_FOUND]", "validations[p5]", "endpoints[POST /review-gates/{id}/start-review]"]
        distinguishing_aspect: "A gate action on an unknown gate id returns 404 ERR_REVIEW_GATE_NOT_FOUND before either the gate-state rule (p12) or the gate-role rule (p27) can be evaluated."
        test_recipe:
          setup: ["Empty database; the trigger addresses the literal id 'rg_missing_404' as the BusinessReviewer."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          trigger:
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_biz_1", captures: {err: "$.data.error_id"}}
          assert:
            - "the trigger addresses the literal id 'rg_missing_404'"
            - "HTTP 404 with data.error_id == ERR_REVIEW_GATE_NOT_FOUND"
            - "the response is neither ERR_GATE_NOT_IN_REVIEWABLE_STATE nor ERR_GATE_ROLE_MISMATCH"

      - name: test_evaluation_unknown_id_not_found
        claim_type: error_triggerable
        grounds: ["errors[ERR_GOVERNANCE_RECORD_NOT_FOUND]", "validations[p6]", "endpoints[GET /test-evaluations/{id}]"]
        distinguishing_aspect: "The satellite entities share one 404 code: an unknown test-evaluation id returns ERR_GOVERNANCE_RECORD_NOT_FOUND, not an entity-specific code."
        test_recipe:
          setup: ["Empty database; the trigger addresses the literal id 'te_missing_404'."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
          trigger:
            - {call: "GET /test-evaluations/{id}", payload: {}, as: SecurityReviewer, as_user_id: "usr_sec_1", captures: {err: "$.data.error_id"}}
          assert:
            - "the trigger addresses the literal id 'te_missing_404'"
            - "HTTP 404 with data.error_id == ERR_GOVERNANCE_RECORD_NOT_FOUND"
            - "the same code is returned for unknown vendor-assessment, oversight-design, disclosure-notice, monitoring-incident and shadow-deployment ids"

      - name: complete_reassessment_while_approved_not_due
        claim_type: error_triggerable
        grounds: ["errors[ERR_REASSESSMENT_NOT_DUE]", "validations[p14]", state_machines.UseCase.transitions.APPROVED_to_UNDER_REASSESSMENT]
        distinguishing_aspect: "complete-reassessment on a freshly APPROVED use case is refused 409 ERR_REASSESSMENT_NOT_DUE: only the sweep may open the cycle, and it will not do so until reassessment_due_at."
        test_recipe:
          setup: ["MIN-APPROVED chain: first-party asset approved for use, MINIMAL use case (score 10) classified, binding pinned, oversight design PRE_DECISION_REVIEW/0/24/override true scoring 96 against the MINIMAL requirement of 30 and approved, single BUSINESS gate cleared, approval signed by usr_gov_1."]
