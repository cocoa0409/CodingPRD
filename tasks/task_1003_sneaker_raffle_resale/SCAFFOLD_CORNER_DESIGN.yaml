scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: sku_creation_returns_201_with_envelope
        claim_type: creation
        grounds: [entities.Sku, endpoints]
        distinguishing_aspect: "POST /skus with all required fields returns 201 and a data object carrying a server-minted id plus the submitted fields."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /skus"
              payload: { style_code: "AA0001-1", name: "Test Sku", brand: "Nike", retail_price_cents: 20000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
          assert:
            - "response.response_type == object"
            - "Sku.${sku_id}.style_code == AA0001-1"
            - "Sku.${sku_id}.release_category == GENERAL"

      - name: release_available_units_computed_on_create
        claim_type: computed_fields
        grounds: [entities.Release.fields.available_units, entities.Release.fields.allocated_quantity]
        distinguishing_aspect: "available_units = allocated_quantity - reserved_units - sold_units = 5 - 0 - 0 = 5 at creation."
        test_recipe:
          setup: ["One sku."]
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AA0002-2", name: "Sku2", brand: "Nike", retail_price_cents: 20000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
          trigger:
            - call: "POST /releases"
              payload: { sku_id: "${sku_id}", allocated_quantity: 5, release_price_cents: 20000, entry_opens_at: "2026-07-05T00:00:00Z", entry_closes_at: "2026-07-06T00:00:00Z", purchase_opens_at: "2026-07-06T01:00:00Z", purchase_closes_at: "2026-07-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { release_id: $.data.id }
          assert:
            - "Release.${release_id}.available_units == 5"
            - "Release.${release_id}.status == SCHEDULED"

      - name: account_get_nonexistent_not_found
        claim_type: not_found
        grounds: [entities.Account, "errors[ERR_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{id} with an unknown UUID returns ERR_ACCOUNT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ACCOUNT_NOT_FOUND"

      - name: order_get_nonexistent_not_found
        claim_type: not_found
        grounds: [entities.Order, "errors[ERR_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET /orders/{id} with an unknown UUID returns ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ORDER_NOT_FOUND"

      - name: listing_get_nonexistent_not_found
        claim_type: not_found
        grounds: [entities.Listing, "errors[ERR_LISTING_NOT_FOUND]"]
        distinguishing_aspect: "GET /listings/{id} with an unknown UUID returns ERR_LISTING_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /listings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Buyer
              as_user_id: "00000000-0000-0000-0000-000000000001"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_LISTING_NOT_FOUND"

      - name: sku_create_missing_required_field_returns_validation
        claim_type: required_fields
        grounds: [entities.Sku, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /skus omitting the required brand field is rejected with ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /skus"
              payload: { style_code: "AA0003-3", name: "NoBrand", retail_price_cents: 20000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: listing_create_invalid_enum_condition_returns_validation
        claim_type: type_constraints
        grounds: [entities.Listing.fields.condition, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /listings with condition outside {DEADSTOCK,VNDS,USED} is rejected with ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A verified seller."]
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AA0004-4", name: "Sku4", brand: "Nike", retail_price_cents: 20000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "s_enum@x.com", full_name: "Enum Seller" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /accounts/${seller_id}/verify"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /listings"
              payload: { sku_id: "${sku_id}", seller_account_id: "${seller_id}", size: "10", condition: "MINT", pricing_mode: "FIXED", ask_price_cents: 30000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"

  # =========================================================================
  - section: endpoints
    instances:
      - name: releases_list_is_paginated
        claim_type: pagination_with_filtering
        grounds: [endpoints, entities.Release]
        distinguishing_aspect: "GET /releases returns an array envelope with total_count and has_more; filtering by sku_id narrows results."
        test_recipe:
          setup: ["One sku with one release."]
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AA0005-5", name: "Sku5", brand: "Nike", retail_price_cents: 20000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /releases"
              payload: { sku_id: "${sku_id}", allocated_quantity: 4, release_price_cents: 20000, entry_opens_at: "2026-07-05T00:00:00Z", entry_closes_at: "2026-07-06T00:00:00Z", purchase_opens_at: "2026-07-06T01:00:00Z", purchase_closes_at: "2026-07-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { release_id: $.data.id }
          trigger:
            - call: "GET /releases"
              payload: { sku_id: "${sku_id}", limit: 10, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response.response_type == array"
            - "response.total_count == 1"
            - "response.has_more == false"

  # =========================================================================
  - section: rbac
    instances:
      - name: create_release_wrong_role_returns_unauthorized
        claim_type: unauthorized
        grounds: [roles, endpoints, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Seller calling POST /releases (PlatformAdmin-exclusive) is rejected with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A verified seller and one sku."]
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AA0006-6", name: "Sku6", brand: "Nike", retail_price_cents: 20000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "s_rbac@x.com", full_name: "RBAC Seller" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /accounts/${seller_id}/verify"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /releases"
              payload: { sku_id: "${sku_id}", allocated_quantity: 2, release_price_cents: 20000, entry_opens_at: "2026-07-05T00:00:00Z", entry_closes_at: "2026-07-06T00:00:00Z", purchase_opens_at: "2026-07-06T01:00:00Z", purchase_closes_at: "2026-07-07T00:00:00Z" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"

      - name: clock_set_missing_auth_returns_unauthenticated
        claim_type: unauthorized
        grounds: [endpoints, "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "POST /_clock/set_current_utc with no X-User-Role / X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401); the as: value below is nominal and the harness omits the headers."
        test_recipe:
          setup: ["Empty DB; request sent with no auth headers."]
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"

      - name: self_purchase_own_listing_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=27]", "errors[ERR_SELF_PURCHASE]"]
        distinguishing_aspect: "An account acting as Buyer on its own listing (buyer_account_id == seller_account_id) is rejected with ERR_SELF_PURCHASE (403)."
        test_recipe:
          setup: ["A verified account that owns a FIXED listing."]
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AA0007-7", name: "Sku7", brand: "Nike", retail_price_cents: 20000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "self@x.com", full_name: "Self Dealer" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { sku_id: "${sku_id}", seller_account_id: "${acct_id}", size: "10", condition: "DEADSTOCK", pricing_mode: "FIXED", ask_price_cents: 30000 }
              as: Seller
              as_user_id: "${acct_id}"
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /listings/${listing_id}/buy"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SELF_PURCHASE"

  # =========================================================================
  - section: validations
    instances:
      - name: enter_unverified_account_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "errors[ERR_ACCOUNT_NOT_VERIFIED]"]
        distinguishing_aspect: "Entering a raffle with an UNVERIFIED account is rejected with ERR_ACCOUNT_NOT_VERIFIED (403) before the bot-age check."
        test_recipe:
          setup: ["An OPEN release and an UNVERIFIED account old enough to pass the bot check."]
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AA0008-8", name: "Sku8", brand: "Nike", retail_price_cents: 20000, release_category: "LIMITED" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "unverified@x.com", full_name: "Unverified" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /releases"
              payload: { sku_id: "${sku_id}", allocated_quantity: 1, release_price_cents: 20000, entry_opens_at: "2026-07-05T00:00:00Z", entry_closes_at: "2026-07-06T00:00:00Z", purchase_opens_at: "2026-07-06T01:00:00Z", purchase_closes_at: "2026-07-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { release_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /releases/${release_id}/open"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /releases/${release_id}/enter"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ACCOUNT_NOT_VERIFIED"

      - name: enter_young_account_bot_flagged
        claim_type: violation_to_error
        grounds: ["validations[priority=26]", "errors[ERR_BOT_FLAGGED]"]
        distinguishing_aspect: "A verified account created less than MIN_ACCOUNT_AGE_DAYS (3) before entry is rejected with ERR_BOT_FLAGGED (403)."
        test_recipe:
          setup: ["An OPEN release; a verified account created at the same instant as entry (tenure 0)."]
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AA0009-9", name: "Sku9", brand: "Nike", retail_price_cents: 20000, release_category: "LIMITED" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /releases"
              payload: { sku_id: "${sku_id}", allocated_quantity: 1, release_price_cents: 20000, entry_opens_at: "2026-07-05T00:00:00Z", entry_closes_at: "2026-07-06T00:00:00Z", purchase_opens_at: "2026-07-06T01:00:00Z", purchase_closes_at: "2026-07-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { release_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "young@x.com", full_name: "Young Bot" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /releases/${release_id}/open"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /releases/${release_id}/enter"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BOT_FLAGGED"

      - name: duplicate_entry_same_account_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=34]", "errors[ERR_DUPLICATE_ENTRY]"]
        distinguishing_aspect: "A second entry by the same account for the same release is rejected with ERR_DUPLICATE_ENTRY (409)."
        test_recipe:
          setup: ["An OPEN release with one existing entry by a verified, tenured account."]
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AB0010-1", name: "Sku10", brand: "Nike", retail_price_cents: 20000, release_category: "LIMITED" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "dup@x.com", full_name: "Dup Entrant" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /releases"
              payload: { sku_id: "${sku_id}", allocated_quantity: 1, release_price_cents: 20000, entry_opens_at: "2026-07-05T00:00:00Z", entry_closes_at: "2026-07-06T00:00:00Z", purchase_opens_at: "2026-07-06T01:00:00Z", purchase_closes_at: "2026-07-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { release_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /releases/${release_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /releases/${release_id}/enter"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /releases/${release_id}/enter"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_ENTRY"

      - name: enter_after_window_closed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=29]", "errors[ERR_ENTRY_WINDOW_CLOSED]"]
        distinguishing_aspect: "Entering while the release is OPEN but the clock is past entry_closes_at returns ERR_ENTRY_WINDOW_CLOSED (422)."
        test_recipe:
          setup: ["An OPEN release; a verified tenured account; clock advanced past entry_closes_at."]
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AB0011-2", name: "Sku11", brand: "Nike", retail_price_cents: 20000, release_category: "LIMITED" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "late@x.com", full_name: "Late Entrant" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /releases"
              payload: { sku_id: "${sku_id}", allocated_quantity: 1, release_price_cents: 20000, entry_opens_at: "2026-07-05T00:00:00Z", entry_closes_at: "2026-07-06T00:00:00Z", purchase_opens_at: "2026-07-06T01:00:00Z", purchase_closes_at: "2026-07-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { release_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /releases/${release_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T01:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /releases/${release_id}/enter"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ENTRY_WINDOW_CLOSED"

      - name: draw_with_no_eligible_entries_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=36]", calculations.raffle_allocation, "errors[ERR_NO_ELIGIBLE_ENTRIES]"]
        distinguishing_aspect: "Drawing an OPEN release that has zero entries returns ERR_NO_ELIGIBLE_ENTRIES (422) (empty candidate set)."
        test_recipe:
          setup: ["An OPEN release with no entries; clock at entry_closes_at."]
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AB0012-3", name: "Sku12", brand: "Nike", retail_price_cents: 20000, release_category: "LIMITED" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /releases"
              payload: { sku_id: "${sku_id}", allocated_quantity: 1, release_price_cents: 20000, entry_opens_at: "2026-07-05T00:00:00Z", entry_closes_at: "2026-07-06T00:00:00Z", purchase_opens_at: "2026-07-06T01:00:00Z", purchase_closes_at: "2026-07-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { release_id: $.data.id, release_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /releases/${release_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /releases/${release_id}/draw"
              payload: { expected_release_version: "${release_v}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NO_ELIGIBLE_ENTRIES"

      - name: bid_below_ask_same_sku_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=37]", "errors[ERR_BID_BELOW_ASK]"]
        distinguishing_aspect: "Matching a same-sku, same-size bid whose amount (10000) is below the ask (30000) returns ERR_BID_BELOW_ASK (422); the referential check passes so the fiscal check is reached."
        test_recipe:
          setup: ["A BID_ASK listing at ask 30000 on sku A, and an OPEN bid on the same sku/size at 10000."]
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AB0013-4", name: "Sku13", brand: "Nike", retail_price_cents: 20000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "s_ba@x.com", full_name: "BA Seller" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /accounts/${seller_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "b_ba@x.com", full_name: "BA Buyer" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /accounts/${buyer_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { sku_id: "${sku_id}", seller_account_id: "${seller_id}", size: "10", condition: "DEADSTOCK", pricing_mode: "BID_ASK", ask_price_cents: 30000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id, listing_v: $.data.version }
            - call: "POST /bids"
              payload: { sku_id: "${sku_id}", buyer_account_id: "${buyer_id}", size: "10", amount_cents: 10000 }
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { bid_id: $.data.id }
          trigger:
            - call: "POST /listings/${listing_id}/match"
              payload: { bid_id: "${bid_id}", expected_listing_version: "${listing_v}" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BID_BELOW_ASK"

  # =========================================================================
  - section: state_machines
    instances:
      - name: enter_before_open_returns_release_not_open
        claim_type: invalid_transition
        grounds: [state_machines.Release.SCHEDULED_to_OPEN, "validations[priority=15]", "errors[ERR_RELEASE_NOT_OPEN]"]
        distinguishing_aspect: "Entering a SCHEDULED (not yet OPEN) release returns ERR_RELEASE_NOT_OPEN (409)."
        test_recipe:
          setup: ["A SCHEDULED release and a verified tenured account; clock inside the entry window but release not opened."]
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AB0014-5", name: "Sku14", brand: "Nike", retail_price_cents: 20000, release_category: "LIMITED" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "early@x.com", full_name: "Early Bird" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /releases"
              payload: { sku_id: "${sku_id}", allocated_quantity: 1, release_price_cents: 20000, entry_opens_at: "2026-07-05T00:00:00Z", entry_closes_at: "2026-07-06T00:00:00Z", purchase_opens_at: "2026-07-06T01:00:00Z", purchase_closes_at: "2026-07-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { release_id: $.data.id }
