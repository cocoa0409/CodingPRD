          - errors.ERR_CAR_TYPE_NOT_FOUND
          - entities.Car.fields.car_type_id
        distinguishing_aspect: "A body FK that names no existing row fails at priority 8 with 404 ERR_CAR_TYPE_NOT_FOUND — after authentication and shape validation but before any business rule — and no Car row is created even though every other field is valid."
        test_recipe:
