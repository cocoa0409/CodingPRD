          - calculations.session_certified_fiscal_ledger
          - entities.Session.fields.certified_fiscal_total_cents
          - entities.Session.fields.fiscal_posture
          - complexity_profile.complexity_layers.cascading_side_effects
        distinguishing_aspect: |
          Depth 4 from a single POST /amendments/{id}/adopt, and every link is CAUSED
          by the one before it rather than fanned out from the trigger: L1 sets
          Bill.fiscal_status = NOTE_STALE; L2 happens only BECAUSE fiscal_status left
          NOTE_COMPLETE, moving the CERTIFIED note back to ROUTED; L3 happens only
          BECAUSE that note left CERTIFIED, debiting Session.certified_fiscal_total_cents
          by its retained 50000000; L4 happens only BECAUSE the ledger changed,
          recomputing Session.fiscal_posture from CONSTRAINED to NORMAL. The
          triggering transition is Amendment DRAFTED -> ADOPTED.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; CONVENED session with constrained_threshold_cents 50000000 and fiscal_cap_cents 200000000, required_fiscal_years [2027, 2028]."
            - "A HOUSE fiscal committee (is_fiscal_committee true) so the favorable report is permitted under CONSTRAINED posture."
            - "Bill introduced with appropriation_requested_cents 40000000 (fiscal_status NOTE_PENDING), referred, and its INCREMENTAL_COST note certified at exactly 50000000 from FY2027 20000000/3148148 and FY2028 20000000/3148148 (raw 46296296, tier 0.08, contingency 3703704)."
            - "That certification puts Session.certified_fiscal_total_cents at exactly the 50000000 threshold, so fiscal_posture is CONSTRAINED and Bill.fiscal_status is NOTE_COMPLETE."
            - "Clock advanced to 2026-10-06T00:00:00Z, the referral reported FAVORABLE (bill REPORTED), and a FLOOR amendment with fiscal_impact_delta_cents 750000 drafted."
