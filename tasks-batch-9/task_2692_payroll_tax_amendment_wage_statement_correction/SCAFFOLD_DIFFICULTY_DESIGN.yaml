  - rule_id: compensating_invariant
    instances:

      - name: void_restores_employer_open_exposure_to_its_pre_prepare_value
        grounds:
          - state_machines.CorrectionCase.FILING_IN_PROGRESS_to_FILING_PENDING
          - state_machines.AmendedReturn.PREPARED_to_VOID
          - calculations.employer_open_exposure_rollup
          - calculations.case_exposure_rollup
        distinguishing_aspect: |
          Conserved quantity: MONEY — Employer.open_exposure_cents (and the case's
          total_exposure_cents that feeds it). Preparing a return injects 335625 cents of open
          exposure; voiding it must remove exactly that, returning the employer to 0 and the case's
          filing dimension to FILING_PENDING with no residue, and preparing an equivalent
          replacement must land on the identical 335625 — so any drift, double-count or
          forgotten-subtraction in the rollup is visible as a non-zero trough or a shifted peak.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
            - "The full 2025 Q1 federal case with three categorised 250000-cent discrepancies (TAXABLE_WAGE, WITHHOLDING, DEPOSIT_SHORTFALL) and a DRAFT amended return with accrual_through_date 2026-04-30."
            - "Employer.open_exposure_cents is 0 and CorrectionCase.total_exposure_cents is 0 before anything is prepared."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "SEMIWEEKLY", authorization_limit_cents: 5000000 }
