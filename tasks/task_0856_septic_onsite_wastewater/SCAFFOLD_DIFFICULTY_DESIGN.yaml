scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: perc_rate_preliminary_mean_vs_certified_slowest_hole_select_different_loading_tiers
        grounds:
          - calculations.perc_rate_evaluation
          - calculations.soil_loading_rate
          - calculations.required_drainfield_area
          - entities.SiteEvaluation.fields.preliminary_perc_rate_min_per_in
          - entities.SiteEvaluation.fields.certified_perc_rate_min_per_in
          - entities.SystemDesign.fields.required_drainfield_sqft
        distinguishing_aspect: |
          This dual variant lives on the SiteEvaluation soil-science domain: the PRELIMINARY
          arithmetic mean of the three valid hole rates is 14.33 min/in which selects the
          0.80 gpd/sqft loading tier, while the CERTIFIED slowest-hole rate is 22.00 min/in
          which selects the 0.60 tier, so the same three holes size the drainfield at 600
          sqft under CERTIFIED and would have sized it at 450 sqft under PRELIMINARY.
        test_recipe:
          setup:
            - "One Parcel of 40000 sqft on a private well, owned by the Applicant u-app-1."
            - "One SiteEvaluation in DRAFT with exactly three valid perc holes whose rates are 10.00, 11.00 and 22.00 min/in."
            - "The evaluation is APPROVED so a design may be drawn from it."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-DV1", county_code: "OR", site_address: "1 Perc Road", lot_size_sqft: 40000, water_source: "PRIVATE_WELL" }
              as: Applicant
              as_user_id: "u-app-1"
              captures: { p_id: $.data.id }
            - call: "POST /site-evaluations"
              payload: { parcel_id: "${p_id}", evaluated_on: "2026-04-15T00:00:00Z", soil_group: "LOAMY", depth_to_limiting_layer_in: 48 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { se_id: $.data.id }
            - call: "POST /site-evaluations/${se_id}/perc-holes"
              payload: { hole_number: 1, drop_inches: 6, elapsed_minutes: 60, presoak_ok: true }
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/perc-holes"
              payload: { hole_number: 2, drop_inches: 6, elapsed_minutes: 66, presoak_ok: true }
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/perc-holes"
              payload: { hole_number: 3, drop_inches: 6, elapsed_minutes: 132, presoak_ok: true }
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/review"
              payload: { decision: "APPROVE", review_note: "Soil profile accepted" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
              captures: { se_v: $.data.version }
          trigger:
            - call: "POST /system-designs"
              payload: { site_evaluation_id: "${se_id}", expected_site_evaluation_version: "${se_v}", system_type: "CONVENTIONAL", bedrooms: 3, tank_capacity_gal: 1000, drainfield_x_ft: 150, drainfield_y_ft: 0 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { sd_id: $.data.id }
          assert:
            - "SiteEvaluation.${se_id}.preliminary_perc_rate_min_per_in == 14.33"
            - "SiteEvaluation.${se_id}.certified_perc_rate_min_per_in == 22.0"
            - "SiteEvaluation.${se_id}.soil_loading_rate_gpd_per_sqft == 0.6"
            - "SystemDesign.${sd_id}.design_flow_gpd == 360"
            - "SystemDesign.${sd_id}.required_drainfield_sqft == 600"
            - "SystemDesign.${sd_id}.required_drainfield_sqft != 450 (450 is the PRELIMINARY-variant answer and MUST NOT be produced)"

      - name: transfer_certificate_desk_review_conditional_vs_field_verified_satisfactory
        grounds:
          - calculations.transfer_certificate_grade
          - calculations.transfer_inspection_charges
          - calculations.pumping_compliance_status
          - entities.TransferInspection.fields.certificate_grade
          - state_machines.TransferInspection.REQUESTED_to_CERTIFIED
        distinguishing_aspect: |
          This dual variant lives on the TransferInspection conveyancing domain, a different
          entity domain from the perc-rate instance: with identical parcel records (no repair
          orders, no water-quality flag, operating permit ACTIVE and DUE_SOON) the DESK_REVIEW
          variant signs CONDITIONAL while the FIELD_VERIFIED variant with both conditions GOOD
          signs SATISFACTORY.
        test_recipe:
          setup:
            - "A fully permitted parcel: site evaluation APPROVED, design APPROVED, construction permit COMPLETED, operating permit ACTIVE (tank 1000 gal, household 4)."
            - "The parcel's permit fee of 73018 cents has been paid in full so fee_balance_cents is 0."
            - "The logical clock sits at 2029-01-31T00:00:00Z, exactly 90 days before next_pumping_due_on 2029-05-01T00:00:00Z, so compliance_status is DUE_SOON."
            - "Two TransferInspections exist in REQUESTED on the same parcel and operating permit: one DESK_REVIEW, one FIELD_VERIFIED with tank_condition GOOD and drainfield_condition GOOD."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-DV2", county_code: "OR", site_address: "2 Transfer Lane", lot_size_sqft: 40000, water_source: "PRIVATE_WELL" }
              as: Applicant
              as_user_id: "u-app-1"
              captures: { p_id: $.data.id }
            - call: "POST /site-evaluations"
              payload: { parcel_id: "${p_id}", evaluated_on: "2026-04-15T00:00:00Z", soil_group: "LOAMY", depth_to_limiting_layer_in: 48 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { se_id: $.data.id }
            - call: "POST /site-evaluations/${se_id}/perc-holes"
              payload: { hole_number: 1, drop_inches: 6, elapsed_minutes: 132, presoak_ok: true }
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/review"
              payload: { decision: "APPROVE", review_note: "Accepted" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
              captures: { se_v: $.data.version }
            - call: "POST /system-designs"
              payload: { site_evaluation_id: "${se_id}", expected_site_evaluation_version: "${se_v}", system_type: "CONVENTIONAL", bedrooms: 3, tank_capacity_gal: 1000, drainfield_x_ft: 150, drainfield_y_ft: 0 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { sd_id: $.data.id }
            - call: "POST /system-designs/${sd_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /system-designs/${sd_id}/review"
              payload: { decision: "APPROVE" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
            - call: "POST /contractors"
              payload: { business_name: "Cascade Septic", license_number: "LIC-0856-A", license_class: "DUAL", license_expires_on: "2030-01-01T00:00:00Z", bond_amount_cents: 5000000 }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { c_id: $.data.id }
            - call: "POST /construction-permits"
              payload: { system_design_id: "${sd_id}", contractor_id: "${c_id}", valid_from: "2026-05-01T00:00:00Z", valid_until: "2027-05-01T00:00:00Z" }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { cp_id: $.data.id }
            - call: "POST /inspections"
              payload: { construction_permit_id: "${cp_id}", inspection_type: "COVER", scheduled_start: "2026-05-01T09:00:00Z", scheduled_end: "2026-05-01T10:00:00Z" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { i1_id: $.data.id }
            - call: "POST /inspections/${i1_id}/result"
              payload: { result: "PASS" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
            - call: "POST /inspections"
              payload: { construction_permit_id: "${cp_id}", inspection_type: "FINAL", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T10:00:00Z" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { i2_id: $.data.id }
            - call: "POST /inspections/${i2_id}/result"
              payload: { result: "PASS" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
            - call: "POST /operating-permits"
              payload: { construction_permit_id: "${cp_id}", household_size: 4 }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { op_id: $.data.id }
            - call: "POST /parcels/${p_id}/fee-payments"
              payload: { amount_cents: 73018 }
              as: Applicant
              as_user_id: "u-app-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-01-31T00:00:00Z" }
              as: HealthOfficer
              as_user_id: "u-ho-1"
            - call: "GET /parcels/${p_id}"
              payload: {}
              as: Applicant
              as_user_id: "u-app-1"
              captures: { pv1: $.data.version }
            - call: "POST /transfer-inspections"
              payload: { parcel_id: "${p_id}", operating_permit_id: "${op_id}", expected_parcel_version: "${pv1}", requested_on: "2029-01-31T00:00:00Z", buyer_name: "Buyer One", seller_name: "Seller One", inspection_mode: "DESK_REVIEW" }
              as: Applicant
              as_user_id: "u-app-1"
              captures: { ti1_id: $.data.id }
            - call: "GET /parcels/${p_id}"
              payload: {}
              as: Applicant
              as_user_id: "u-app-1"
              captures: { pv2: $.data.version }
            - call: "POST /transfer-inspections"
              payload: { parcel_id: "${p_id}", operating_permit_id: "${op_id}", expected_parcel_version: "${pv2}", requested_on: "2029-01-31T00:00:00Z", buyer_name: "Buyer One", seller_name: "Seller One", inspection_mode: "FIELD_VERIFIED", tank_condition: "GOOD", drainfield_condition: "GOOD" }
              as: Applicant
              as_user_id: "u-app-1"
              captures: { ti2_id: $.data.id }
          trigger:
            - call: "POST /transfer-inspections/${ti1_id}/certify"
              payload: { decision: "CERTIFY" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
            - call: "POST /transfer-inspections/${ti2_id}/certify"
              payload: { decision: "CERTIFY" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
          assert:
            - "OperatingPermit.${op_id}.compliance_status == DUE_SOON"
            - "OperatingPermit.${op_id}.next_pumping_due_on == 2029-05-01T00:00:00.000Z"
            - "TransferInspection.${ti1_id}.certificate_grade == CONDITIONAL"
            - "TransferInspection.${ti2_id}.certificate_grade == SATISFACTORY"
            - "TransferInspection.${ti1_id}.subtotal_cents == 18500 and total_due_cents == 18500"
            - "TransferInspection.${ti2_id}.subtotal_cents == 28000 and total_due_cents == 28000"
            - "TransferInspection.${ti1_id}.certificate_valid_until == 2029-07-30T00:00:00.000Z"

  - rule_id: combinatorial_formula
    instances:
      - name: drainfield_area_four_input_nonlinear_with_shallow_penalty_and_clamp
        grounds:
          - calculations.required_drainfield_area
          - calculations.design_flow
          - calculations.soil_loading_rate
          - entities.SystemDesign.fields.required_drainfield_sqft
        distinguishing_aspect: |
          Mode (a) — a single formula with four interacting inputs and non-linear
          interaction: design_flow_gpd 480 divided by the tier-selected loading rate 0.80,
          multiplied by the MOUND technology factor 1.25 and again by the shallow-soil
          penalty 1.20 (depth 30 in < 36 in), then ceiled and clamped, giving exactly 900
          sqft. Dropping either multiplier gives 600 or 720; applying the clamp before the
          multipliers gives a different number again.
        test_recipe:
          setup:
            - "A parcel of 40000 sqft with an APPROVED site evaluation whose single valid perc hole reads 12.00 min/in (loading tier 0.80) and whose depth_to_limiting_layer_in is 30 (below the 36 in shallow threshold)."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-CF1", county_code: "OR", site_address: "3 Mound Way", lot_size_sqft: 40000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-1"
              captures: { p_id: $.data.id }
            - call: "POST /site-evaluations"
              payload: { parcel_id: "${p_id}", evaluated_on: "2026-04-15T00:00:00Z", soil_group: "CLAY_LOAM", depth_to_limiting_layer_in: 30 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { se_id: $.data.id }
            - call: "POST /site-evaluations/${se_id}/perc-holes"
              payload: { hole_number: 1, drop_inches: 6, elapsed_minutes: 72, presoak_ok: true }
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/review"
              payload: { decision: "APPROVE", review_note: "Accepted" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
              captures: { se_v: $.data.version }
          trigger:
            - call: "POST /system-designs"
              payload: { site_evaluation_id: "${se_id}", expected_site_evaluation_version: "${se_v}", system_type: "MOUND", bedrooms: 4, tank_capacity_gal: 1250, drainfield_x_ft: 200, drainfield_y_ft: 0 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { sd_id: $.data.id }
          assert:
            - "SiteEvaluation.${se_id}.certified_perc_rate_min_per_in == 12.0"
            - "SiteEvaluation.${se_id}.soil_loading_rate_gpd_per_sqft == 0.8"
            - "SystemDesign.${sd_id}.design_flow_gpd == 480"
            - "SystemDesign.${sd_id}.required_drainfield_sqft == 900"
            - "SystemDesign.${sd_id}.setback_status == NOT_APPLICABLE"

      - name: construction_permit_fee_rounds_each_line_item_before_summing
        grounds:
          - calculations.construction_permit_fee
          - calculations.parcel_fee_ledger
          - entities.ConstructionPermit.fields.fee_cents
          - entities.Parcel.fields.fees_assessed_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the answer: the base review line
          45000 and the flow line 23400 each carry the 6.75 percent combined surcharge and each
          land on a half-cent (48037.5 and 24979.5). Rounding each line half-up first and then
          summing yields exactly 73018 cents; summing the raw lines and rounding once yields
          73017 cents. The scaffold pins round-per-line-then-sum.
        test_recipe:
          setup:
            - "A parcel of 40000 sqft with an APPROVED CONVENTIONAL 3-bedroom design (design_flow_gpd 360, setback NOT_APPLICABLE) and an ACTIVE DUAL-class contractor."
            - "The parcel's fee ledger is untouched: fees_assessed_cents 0, fees_paid_cents 0, fees_credited_cents 0, fee_balance_cents 0."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-CF2", county_code: "OR", site_address: "4 Fee Street", lot_size_sqft: 40000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-1"
              captures: { p_id: $.data.id }
            - call: "POST /site-evaluations"
              payload: { parcel_id: "${p_id}", evaluated_on: "2026-04-15T00:00:00Z", soil_group: "LOAMY", depth_to_limiting_layer_in: 48 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { se_id: $.data.id }
            - call: "POST /site-evaluations/${se_id}/perc-holes"
              payload: { hole_number: 1, drop_inches: 6, elapsed_minutes: 132, presoak_ok: true }
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/review"
              payload: { decision: "APPROVE", review_note: "Accepted" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
              captures: { se_v: $.data.version }
            - call: "POST /system-designs"
              payload: { site_evaluation_id: "${se_id}", expected_site_evaluation_version: "${se_v}", system_type: "CONVENTIONAL", bedrooms: 3, tank_capacity_gal: 1000, drainfield_x_ft: 150, drainfield_y_ft: 0 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { sd_id: $.data.id }
            - call: "POST /system-designs/${sd_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /system-designs/${sd_id}/review"
              payload: { decision: "APPROVE" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
            - call: "POST /contractors"
              payload: { business_name: "Cascade Septic", license_number: "LIC-0856-B", license_class: "DUAL", license_expires_on: "2030-01-01T00:00:00Z", bond_amount_cents: 5000000 }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /construction-permits"
              payload: { system_design_id: "${sd_id}", contractor_id: "${c_id}", valid_from: "2026-05-01T00:00:00Z", valid_until: "2027-05-01T00:00:00Z" }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { cp_id: $.data.id }
          assert:
            - "ConstructionPermit.${cp_id}.fee_cents == 73018"
            - "ConstructionPermit.${cp_id}.fee_cents != 73017 (73017 is the sum-then-round answer and MUST NOT be produced)"
            - "Parcel.${p_id}.fees_assessed_cents == 73018"
            - "Parcel.${p_id}.fee_balance_cents == 73018"
            - "ConstructionPermit.${cp_id}.permit_number == OR-CP-000001"

      - name: transfer_expedite_rate_tier_selected_from_subtotal_not_from_final_total
        grounds:
          - calculations.transfer_inspection_charges
          - entities.TransferInspection.fields.expedite_fee_cents
          - entities.TransferInspection.fields.total_due_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order: the expedite
          rate is keyed on a tier of the total, yet the total contains the expedite fee. With a
          FIELD_VERIFIED subtotal of 28000 the pinned order selects the mid tier rate 0.20 and
          yields expedite_fee_cents 5600 and total_due_cents 33600; selecting the tier from the
          resulting total 33600 would drop to the high tier 0.15 and yield 4200 / 32200, and a
          fixed-point iteration would oscillate between the two.
        test_recipe:
          setup:
            - "A fully permitted parcel with an ACTIVE operating permit and no open repair orders, so the records-research line item is not charged."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-CF3", county_code: "OR", site_address: "5 Expedite Court", lot_size_sqft: 40000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-1"
