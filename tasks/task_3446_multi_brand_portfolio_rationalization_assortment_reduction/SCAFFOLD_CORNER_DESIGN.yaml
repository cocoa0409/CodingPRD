            - { call: "POST /portfolio/brands", payload: { name: "B-VA10-1", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b1: $.data.id } }
            - { call: "POST /portfolio/brands", payload: { name: "B-VA10-2", category_name: "tools", core_flag: false, private_label_share_pct: 10, annual_net_revenue_cents: 500000000 }, as: PortfolioManager, captures: { b2: $.data.id } }
