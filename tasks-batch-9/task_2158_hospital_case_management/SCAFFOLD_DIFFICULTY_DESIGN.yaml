      - name: auth_denial_cascade_depth_four_to_transport_cancellation
        grounds:
          - state_machines.AuthorizationRequest.SUBMITTED_to_DENIED
          - state_machines.Episode.case_status.READY_FOR_DISCHARGE_to_PLANNING
          - state_machines.LogisticsOrder.CONFIRMED_to_CANCELLED
          - entities.Episode.fields.logistics_committed_cents
          - entities.Barrier.fields.origin
        distinguishing_aspect: |
          A second, structurally different cascade of depth 4 originating at
          POST /authorizations/{id}/decide with decision DENY: hop 1 denies the authorization,
          hop 2 is caused by hop 1 and auto-creates the INSURANCE_AUTH barrier, hop 3 is caused
          by hop 2 and drives barrier_posture to ACTIVE which reverts the READY_FOR_DISCHARGE
          episode to PLANNING, hop 4 is caused by hop 3 and cancels the CONFIRMED transport
