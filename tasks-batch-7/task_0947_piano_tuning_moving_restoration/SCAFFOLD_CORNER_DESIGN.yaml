              payload: { client_id: "${cl_id}", label: "Room", zone_code: "ZONE_A", address_key: "od-room", distance_miles_from_shop: 3.0, climate_controlled: false }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U1", serial_number: "SN-C21-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /tuning-recalls"
              payload: { instrument_id: "${inst_id}", cycle_start_date: "2026-01-15" }
              as: ShopManager
              captures: { tr_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/daily-sweep"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: -10.0 }
              as: ShopManager
          assert:
            - "TuningRecall.${tr_id}.days_overdue == 35 and overdue_tier == OVERDUE_T2"
            - "Instrument.${inst_id}.raw_pitch_tier == TIER_1"
            - "Instrument.${inst_id}.pitch_raise_tier == TIER_2"
            - "Instrument.${inst_id}.planned_visit_count == 1"
            - "Instrument.${inst_id}.pitch_deviation_cents == -10.0"

