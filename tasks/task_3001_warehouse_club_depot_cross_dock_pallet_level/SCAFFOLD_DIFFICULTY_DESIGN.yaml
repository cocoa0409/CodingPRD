              payload: { name: "Gamma Supply", vendor_code: "V300003" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "Depot Central", dock_count: 3, dock_hours_open: "08:00", dock_hours_close: "18:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "3000001", description: "Soda pallets", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_id: $.data.id }
            - call: "POST /wcd/items/${item_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-01", start_time: "08:00", end_time: "08:30", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor_id}"
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-01", start_time: "09:00", end_time: "09:30", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor_id}"
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:01Z" }
              as: RegionalOps
            - call: "GET /wcd/chargebacks"
              payload: { vendor_id: "${vendor_id}", reason: "NO_SHOW" }
              as: DepotManager
              captures: { cb1_id: "$.data[0].id", cb2_id: "$.data[1].id" }
            - call: "POST /wcd/chargebacks/${cb1_id}/appeal"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_id}"
            - call: "POST /wcd/chargebacks/${cb1_id}/resolve"
              payload: { outcome: "CONFIRM" }
              as: DepotManager
            - call: "POST /wcd/chargebacks/${cb2_id}/appeal"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_id}"
            - call: "POST /wcd/chargebacks/${cb2_id}/resolve"
              payload: { outcome: "CONFIRM" }
              as: DepotManager
            - call: "POST /wcd/appointments"
