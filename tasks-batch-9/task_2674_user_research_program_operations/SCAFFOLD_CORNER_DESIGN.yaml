              payload: { study_id: "${study_id}" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "GET /participant-pools/${pool_id}"
              payload: {}
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
          assert:
            - "HTTP 201 with exactly 2 rows even though count was 5 - the candidate list was exhausted after ${p2_id} and ${p3_id}"
            - "data[0].participant_id == ${p2_id} and data[1].participant_id == ${p3_id}, in created_at ASC order at contacts_in_window 0"
            - "${p1_id} is excluded because a Recruitment already exists for the pair; ${p4_id} is excluded on segment NEW_USER != required_segment POWER_USER"
            - "The recruitment list reports total_count == 3 (one manual, two from the batch), all with status INVITED and incentive_state RESERVED"
            - "The pool read shows incentive_reserved_cents == 15000 and status == OPEN - the two batch reservations were 5000 each at pre-utilizations 0.05 and 0.10"
            - "Study.${study_id}.invited_count == 3 and recruitment_status == RECRUITING"
