# =============================================================================
# task_0659_artificial_turf_putting_green — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x >= 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are literals computed against §1.3 + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # --- Instance 1: Quote estimate vs final on the QUOTE entity domain ----
      - name: quote_estimate_vs_final_freeze_on_send
        grounds:
          - calculations.quote_total
          - state_machines.Quote.DRAFT_to_SENT
          - entities.Quote.fields.total_cents
        distinguishing_aspect: |
          On the Quote entity domain: the estimate variant recomputes total_cents from
          the design as currently drafted, while the final variant FREEZES total_cents at
          send time so a later design edit does not change the SENT quote's total.
        test_recipe:
          setup:
            - "Catalog turf (roll_width 15, price 500c/sqft) + infill (price 100c/sqft) exist."
            - "Project measured (gross 600, run 20 -> waste 8% -> net 648), STANDARD design ACCEPTED, scope depth 3 FINALIZED (drainage NONE), a DRAFT quote created and then SENT."
            - "STANDARD quote total = 431568 (material 388800 + excavation 42768, no surcharge/discount)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ann Owner", email: "ann@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-STD", name: "Std Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-SIL", name: "Silica", material: "SILICA", price_per_sqft_cents: 100, coverage_lbs_per_sqft: 2 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "1 Lawn Way" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { measure_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${measure_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { design_id: $.data.id }
            - call: "POST /design-layouts/${design_id}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_depth_in: 3 }
              as: SalesRep
              captures: { scope_id: $.data.id }
            - call: "POST /base-prep-scopes/${scope_id}/finalize"
              payload: {}
              as: SalesRep
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_prep_scope_id: "${scope_id}" }
              as: SalesRep
              captures: { quote_id: $.data.id, est_total: $.data.total_cents }
          trigger:
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: SalesRep
              captures: { final_total: $.data.total_cents }
          assert:
            - "Quote.${quote_id}.total_cents == 431568 (estimate)"
            - "after send Quote.${quote_id}.total_cents == 431568 (final, frozen)"
            - "Quote.${quote_id}.material_subtotal_cents == 388800"
            - "Quote.${quote_id}.status == SENT"

      # --- Instance 2: Project ledger chronological vs forward_projected -----
      - name: ledger_settled_vs_forward_projected_diverge
        grounds:
          - calculations.project_ledger
          - entities.Project.fields.outstanding_balance_cents
          - endpoints[GET /projects/{id}/ledger]
        distinguishing_aspect: |
          On the Project entity domain (different from the Quote domain of instance 1):
          chronological_settled counts only SETTLED Payments (outstanding 302098 with the
          balance still PENDING), while forward_projected includes the PENDING balance and
          reports 0 — same Payment rows, two algorithms, divergent outstanding.
        test_recipe:
          setup:
            - "STANDARD project (contract 431568) with deposit 129470 SETTLED and a BALANCE payment 302098 still PENDING; project finance_status BALANCE_DUE."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ben Buyer", email: "ben@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-STD2", name: "Std Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-SIL2", name: "Silica", material: "SILICA", price_per_sqft_cents: 100, coverage_lbs_per_sqft: 2 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew A", daily_capacity_sqft: 2000 }
              as: OpsAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "2 Lawn Way" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { measure_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${measure_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { design_id: $.data.id }
            - call: "POST /design-layouts/${design_id}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_depth_in: 3 }
              as: SalesRep
              captures: { scope_id: $.data.id }
            - call: "POST /base-prep-scopes/${scope_id}/finalize"
              payload: {}
              as: SalesRep
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_prep_scope_id: "${scope_id}", deposit_pct: 0.30 }
              as: SalesRep
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OpsAdmin
              captures: { v_pre_accept: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_project_version: "${v_pre_accept}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /payments"
              payload: { project_id: "${proj_id}", kind: "DEPOSIT", amount_cents: 129470 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { dep_pay_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { payment_id: "${dep_pay_id}" }
              as: OpsAdmin
            - call: "POST /install-jobs"
              payload: { project_id: "${proj_id}", crew_id: "${crew_id}", scheduled_start: "2026-04-10T09:00:00Z", scheduled_end: "2026-04-10T17:00:00Z" }
              as: Scheduler
              captures: { job_id: $.data.id }
            - call: "POST /install-jobs/${job_id}/start"
              payload: {}
              as: Scheduler
            - call: "POST /install-jobs/${job_id}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /payments"
              payload: { project_id: "${proj_id}", kind: "BALANCE", amount_cents: 302098 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bal_pay_id: $.data.id }
          trigger:
            - call: "GET /projects/${proj_id}/ledger"
              payload: {}
              as: OpsAdmin
              captures: { settled_outstanding: $.data.outstanding_balance_cents }
            - call: "GET /projects/${proj_id}/ledger"
              payload: { include_pending: true }
              as: OpsAdmin
              captures: { projected_outstanding: $.data.outstanding_balance_cents }
          assert:
            - "settled ledger Project.${proj_id}.outstanding_balance_cents == 302098"
            - "projected (include_pending=true) Project.${proj_id}.outstanding_balance_cents == 0"
            - "Project.${proj_id}.deposit_paid_cents == 129470"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # --- Instance 1: mode (a) non-linear branch: drainage_tier 3 inputs ----
      - name: drainage_tier_three_input_nonlinear
        grounds:
          - calculations.drainage_tier
          - entities.BasePrepScope.fields.drainage_tier
          - entities.SiteMeasure.fields.soil_drains_freely
        distinguishing_aspect: |
          Mode (a): a 3-input non-linear branch (variant, slope_pct, soil_drains_freely).
          A flat (slope 1.5 < 2.0) poor-soil STANDARD site resolves to DRAINAGE_PANEL,
          NOT FRENCH_DRAIN, because the flat+poor-soil branch precedes the steep/poor branch.
        test_recipe:
          setup:
            - "STANDARD design on a measure with slope 1.5, soil_drains_freely=false. A base prep scope is created on the accepted design."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cara C", email: "cara@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-STD3", name: "Std Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-SIL3", name: "Silica", material: "SILICA", price_per_sqft_cents: 100, coverage_lbs_per_sqft: 2 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "3 Lawn Way" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.5, soil_drains_freely: false }
              as: SalesRep
              captures: { measure_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${measure_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { design_id: $.data.id }
            - call: "POST /design-layouts/${design_id}/accept"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_depth_in: 4 }
              as: SalesRep
              captures: { drain: $.data.drainage_tier }
          assert:
            - "BasePrepScope.drainage_tier == DRAINAGE_PANEL"
            - "BasePrepScope.drainage_cost_cents == 207360 (net 648 * 320)"
            - "BasePrepScope.excavation_cost_cents == 57024 (648 * 4 * 22)"

      # --- Instance 2: mode (b) rounding order: per-line vs sum-then-round ----
      - name: material_subtotal_round_per_line_then_sum
        grounds:
          - calculations.quote_total
          - entities.Quote.fields.material_subtotal_cents
          - entities.DesignLayout.fields.net_area_sqft
        distinguishing_aspect: |
          Mode (b) nested rounding: with net 100.10, turf 3c and infill 3c each yield
          line=300.30 -> round per line = 300 + 300 = 600. Sum-then-round would give
          rhu(600.60)=601. The scaffold pins round-per-line-then-sum, so material_subtotal_cents == 600.
        test_recipe:
          setup:
            - "Measure gross 95.33, run 10 (waste 5%) -> net 100.10. Turf price 3c/sqft, infill 3c/sqft. STANDARD design ACCEPTED; scope FINALIZED; quote created."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dee D", email: "dee@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-CHEAP", name: "Cheap Turf", pile_height_mm: 20, price_per_sqft_cents: 3, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-CHEAP", name: "Cheap Infill", material: "SILICA", price_per_sqft_cents: 3, coverage_lbs_per_sqft: 2 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "4 Lawn Way" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 95.33, longest_run_ft: 10, slope_pct: 1.0 }
              as: SalesRep
              captures: { measure_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${measure_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { design_id: $.data.id, net: $.data.net_area_sqft }
            - call: "POST /design-layouts/${design_id}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_depth_in: 3 }
              as: SalesRep
              captures: { scope_id: $.data.id }
            - call: "POST /base-prep-scopes/${scope_id}/finalize"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_prep_scope_id: "${scope_id}" }
              as: SalesRep
              captures: { mat: $.data.material_subtotal_cents, tot: $.data.total_cents }
          assert:
            - "DesignLayout.${design_id}.net_area_sqft == 100.10"
            - "Quote.material_subtotal_cents == 600 (round-per-line: 300+300, NOT 601)"
            - "Quote.total_cents == 150000 (subtotal 7207 floored to MIN_JOB_CENTS)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # --- Instance 1: Quote cyclic revise loop ------------------------------
      - name: quote_revise_cycle_spawns_successor
        grounds:
          - state_machines.Quote.SENT_to_REVISED
          - entities.Quote.fields.superseded_by_quote_id
          - state_machines.Quote.DRAFT_to_SENT
        distinguishing_aspect: |
          Cyclic shape on the Quote entity: a SENT quote -> REVISED spawns a NEW DRAFT
          successor quote (loop back to DRAFT on a fresh row), with the original carrying
          superseded_by_quote_id pointing at the successor.
        test_recipe:
          setup:
            - "STANDARD project with one SENT quote (q1)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Eve E", email: "eve@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-STD4", name: "Std Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-SIL4", name: "Silica", material: "SILICA", price_per_sqft_cents: 100, coverage_lbs_per_sqft: 2 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "5 Lawn Way" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { measure_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${measure_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { design_id: $.data.id }
            - call: "POST /design-layouts/${design_id}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_depth_in: 3 }
              as: SalesRep
              captures: { scope_id: $.data.id }
            - call: "POST /base-prep-scopes/${scope_id}/finalize"
              payload: {}
              as: SalesRep
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_prep_scope_id: "${scope_id}" }
              as: SalesRep
              captures: { q1_id: $.data.id }
            - call: "POST /quotes/${q1_id}/send"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /quotes/${q1_id}/revise"
              payload: { deposit_pct: 0.20 }
              as: SalesRep
              captures: { q2_id: $.data.id, q2_status: $.data.status }
          assert:
            - "successor Quote.${q2_id}.status == DRAFT"
            - "successor Quote.${q2_id}.deposit_pct == 0.20"
            - "Quote.${q1_id}.status == REVISED"
            - "Quote.${q1_id}.superseded_by_quote_id == ${q2_id}"

      # --- Instance 2: InstallJob branching fork (complete vs abort) ---------
      - name: install_job_branch_complete_vs_abort_divergent_effects
        grounds:
          - state_machines.InstallJob.IN_PROGRESS_to_COMPLETED
          - state_machines.InstallJob.SCHEDULED_to_ABORTED
          - state_machines.WarrantyPlan.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Branching fork on the InstallJob entity (different entity from the Quote cycle):
          IN_PROGRESS -> {COMPLETED, ABORTED}. The COMPLETED branch activates the PENDING
          WarrantyPlan and sets finance BALANCE_DUE; the ABORTED branch only releases the
          crew window and does NOT touch the warranty — divergent side-effect sets.
        test_recipe:
          setup:
            - "STANDARD project deposit-paid and SCHEDULED with a PENDING WarrantyPlan (BASIC); install started (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /customers"
