    instances:
      - name: response_due_at_exact_boundary
        grounds:
          - calculations.tier_response_window
          - state_machines.AssessmentCycle.ISSUED_to_EXPIRED
          - validations[priority=7]
        distinguishing_aspect: |
          Numeric datetime boundary on the response-submission metric: a
          submission at exactly response_due_at succeeds (<= semantics),
          while one millisecond past triggers the EXPIRED auto-transition on
          the next clock sweep; TIER_1 window is 45 days.
        test_recipe:
          setup:
            - "TIER_1 cycle issued at 2026-08-01T00:00:00Z => response_due_at = 2026-09-15T00:00:00Z; clock set to exactly that instant"
          setup_api_calls:
