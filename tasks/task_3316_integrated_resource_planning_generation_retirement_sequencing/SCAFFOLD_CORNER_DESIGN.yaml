# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 3316 — Integrated Resource Planning & Generation Retirement Sequencing
# Breadth probe over §1.1–§1.7 claims not already exercised by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: plan_create_returns_defaults_and_common_fields
        claim_type: Creation
        grounds:
          - entities.ResourcePlan
          - endpoints.POST_/plans
        distinguishing_aspect: "A plan created with plan_name/cycle_year/planning_horizon_years returns 201 with status DRAFT, reopen_count 0, version 1, null approved_snapshot_id/preferred_portfolio_id, and server-minted id/created_at/updated_at."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-09-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { plan_name: "Carolinas IRP 2026", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
          assert:
            - "response 201; ResourcePlan.${plan_id}.status == DRAFT and reopen_count == 0 and version == 1"
            - "approved_snapshot_id and preferred_portfolio_id are null; id/created_at/updated_at non-null"

      - name: forecast_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - entities.LoadForecast.fields.total_peak_mw
          - entities.LoadForecast.fields.effective_load_mw
        distinguishing_aspect: "total_peak_mw and effective_load_mw are system-computed: a create payload carries no such keys, and the stored row reports total 2500.00 and COINCIDENT effective 2475.00 from the class inputs."
        test_recipe:
          setup: ["Plan P DRAFT exists."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP CF", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 1000, commercial_mw: 800, industrial_mw: 500, electrification_mw: 200 }
              as: UtilityPlanner
              captures: { fc_id: $.data.id }
          assert:
            - "LoadForecast.${fc_id}.total_peak_mw == 2500.00 and effective_load_mw == 2475.00"
            - "LoadForecast.${fc_id}.locked == false while the plan is DRAFT"

      - name: position_append_only_has_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Position
        distinguishing_aspect: "Position declares common_fields false: the create response carries id and created_at but NO version/updated_at; removal is a soft flag (selected false) via DELETE, never an update."
        test_recipe:
          setup: ["Plan P DRAFT with portfolio PF; candidate K registered."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP Pos", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-Pos" }
              as: UtilityPlanner
              captures: { pf_id: $.data.id }
            - call: "POST /candidates"
              payload: { candidate_name: "K-POS", resource_type: "SOLAR", nameplate_mw: 100, online_year: 2028, capex_usd_per_kw: 900, fixed_om_usd_per_kw_year: 10, fuel_type: "SUN", build_lead_years: 2 }
              as: UtilityPlanner
              captures: { cand_id: $.data.id }
          trigger:
            - call: "POST /portfolios/${pf_id}/positions"
              payload: { candidate_id: "${cand_id}", committed_mw: 40 }
              as: UtilityPlanner
              captures: { pos_id: $.data.id }
          assert:
            - "Position.${pos_id} response has id and created_at but no version or updated_at member"
            - "Position.${pos_id}.selected == true and committed_mw == 40"

      - name: plan_list_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/plans
          - response_envelope
        distinguishing_aspect: "GET /plans with limit=1&offset=1 over two plans returns exactly one data row, total_count == 2, has_more == false, and the meta block carries api_request_id and api_request_timestamp."
        test_recipe:
          setup: ["Two plans exist."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP Page1", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP Page2", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
          trigger:
            - call: "GET /plans?limit=1&offset=1"
              payload: {}
              as: UtilityPlanner
          assert:
            - "response_type == array and data has exactly 1 element"
            - "total_count == 2 and has_more == false; meta.api_request_id and meta.api_request_timestamp present"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: retire_on_decided_resource_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Resource
          - endpoints.POST_/resources/{resourceId}/retire
        distinguishing_aspect: "Retire is declared only from ACTIVE; a second retire on a DECIDED unit fails with ERR_INVALID_STATE and changes nothing (retirement_year keeps its first value)."
        test_recipe:
          setup: ["Clock 2026-09-01. Plan P DRAFT; resource R ACTIVE; R already retired once (DECIDED, retirement_year 2030)."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP Inv", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /resources"
              payload: { unit_name: "GAS-CT-X", resource_type: "GAS_CT", nameplate_mw: 200, in_service_year: 2005, fuel_type: "NATURAL_GAS" }
              as: UtilityPlanner
              captures: { res_id: $.data.id }
            - call: "POST /resources/${res_id}/retire"
              payload: { retirement_year: 2030, plan_id: "${plan_id}" }
              as: UtilityPlanner
          trigger:
            - call: "POST /resources/${res_id}/retire"
              payload: { retirement_year: 2032, plan_id: "${plan_id}" }
              as: UtilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); Resource.${res_id}.retirement_year remains 2030 and version == 2"

      - name: mothball_from_active_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Resource
          - endpoints.POST_/resources/{resourceId}/mothball
        distinguishing_aspect: "Mothball is declared only from DECIDED; on an ACTIVE unit it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Resource R ACTIVE."]
          setup_api_calls:
            - call: "POST /resources"
              payload: { unit_name: "HYDRO-1", resource_type: "HYDRO", nameplate_mw: 80, in_service_year: 1975, fuel_type: "WATER" }
              as: UtilityPlanner
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /resources/${res_id}/mothball"
              payload: {}
              as: UtilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); Resource.${res_id}.status == ACTIVE"

      - name: award_on_cancelled_commitment_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ProcurementCommitment
          - endpoints.POST_/procurement-commitments/{commitmentId}/award
        distinguishing_aspect: "Award is declared only from ISSUED; awarding a CANCELLED commitment fails with ERR_COMMITMENT_NOT_ISSUABLE and discharges no conditions."
        test_recipe:
          setup: ["Clock 2026-08-01. Plan P APPROVED (reliability-met portfolio); candidate K; commitment C issued then cancelled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP Aw", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2031, residential_mw: 400, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-Aw", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /resources"
              payload: { unit_name: "SOL-AW", resource_type: "SOLAR", nameplate_mw: 1150, in_service_year: 2020, fuel_type: "SUN" }
              as: UtilityPlanner
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2031, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pf_v}" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
              captures: { plan_v: $.data.version }
            - call: "POST /plans/${plan_id}/commission-review"
              payload: { decision: "APPROVE", expected_plan_version: "${plan_v}" }
              as: Commissioner
            - call: "POST /candidates"
              payload: { candidate_name: "K-AW", resource_type: "SOLAR", nameplate_mw: 100, online_year: 2028, capex_usd_per_kw: 900, fixed_om_usd_per_kw_year: 10, fuel_type: "SUN", build_lead_years: 2 }
              as: UtilityPlanner
              captures: { cand_id: $.data.id }
            - call: "POST /plans/${plan_id}/procurement-commitments"
              payload: { candidate_id: "${cand_id}", committed_mw: 50, solicitation_type: "RFP" }
              as: UtilityPlanner
              captures: { com_id: $.data.id }
            - call: "POST /procurement-commitments/${com_id}/cancel"
              payload: {}
              as: UtilityPlanner
          trigger:
            - call: "POST /procurement-commitments/${com_id}/award"
              payload: {}
              as: Commissioner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_COMMITMENT_NOT_ISSUABLE (409); commitment remains CANCELLED"

      - name: ack_on_acknowledged_comment_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.PublicComment
          - endpoints.POST_/plans/{planId}/comments/{commentId}/acknowledge
        distinguishing_aspect: "Acknowledge is declared only from RECEIVED; a second acknowledge on an ACKNOWLEDGED comment fails with ERR_INVALID_STATE — terminal-state lockdown for this two-state machine."
        test_recipe:
          setup: ["Clock 2026-08-01. Plan P OPEN_FOR_COMMENT with one comment already ACKNOWLEDGED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP Ack", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-Ack" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/comments"
              payload: { commenter_name: "C One", commenter_email: "c1@example.org", body: "Comment body." }
              as: PublicCommenter
              captures: { com_id: $.data.id }
            - call: "POST /plans/${plan_id}/comments/${com_id}/acknowledge"
              payload: {}
              as: UtilityPlanner
          trigger:
            - call: "POST /plans/${plan_id}/comments/${com_id}/acknowledge"
              payload: {}
              as: UtilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); PublicComment.${com_id}.version == 2 (unchanged by the failed call)"

      - name: forecast_lock_bubble_up_on_open_comment
        claim_type: guarded_transition
        grounds:
          - state_machines.ResourcePlan.DRAFT_to_OPEN_FOR_COMMENT
          - entities.LoadForecast.fields.locked
        distinguishing_aspect: "Cross-entity cascade down: open-comment flips every forecast row's locked flag to true, and a subsequent PUT forecast fails with ERR_FORECAST_LOCKED while GET still returns the row."
        test_recipe:
          setup: ["Clock 2026-08-01. Plan P with one BASE forecast row; P moved to OPEN_FOR_COMMENT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP Lock", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 100, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
              captures: { fc_id: $.data.id }
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-Lock" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
          trigger:
            - call: "PUT /plans/${plan_id}/forecasts/${fc_id}"
              payload: { residential_mw: 120 }
              as: UtilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORECAST_LOCKED (409)"
            - "GET forecast shows residential_mw == 100 and locked == true (failed update left no drift)"

      - name: portfolio_freeze_blocks_position_add
        claim_type: guarded_transition
        grounds:
          - state_machines.ResourcePortfolio.DRAFT_to_FROZEN
          - endpoints.POST_/portfolios/{portfolioId}/positions
        distinguishing_aspect: "Submit-for-review freezes every portfolio of the plan; adding a position to the FROZEN portfolio fails with ERR_PORTFOLIO_FROZEN (409), while snapshot compute on the same FROZEN portfolio still succeeds."
        test_recipe:
          setup: ["Clock 2026-08-01. Plan P UNDER_REVIEW (window elapsed); portfolio PF FROZEN; candidate K registered."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP Frz", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-Frz", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /candidates"
              payload: { candidate_name: "K-FRZ", resource_type: "WIND", nameplate_mw: 100, online_year: 2028, capex_usd_per_kw: 1100, fixed_om_usd_per_kw_year: 20, fuel_type: "WIND", build_lead_years: 2 }
              as: UtilityPlanner
              captures: { cand_id: $.data.id }
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
          trigger:
            - call: "POST /portfolios/${pf_id}/positions"
              payload: { candidate_id: "${cand_id}", committed_mw: 30 }
              as: UtilityPlanner
              captures: { err: $.data.error_id }
            - call: "GET /portfolios/${pf_id}"
              payload: {}
              as: UtilityPlanner
              captures: { pfv_1: $.data.version }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2030, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pfv_1}" }
              as: UtilityPlanner
              captures: { snap_id: $.data.id }
          assert:
            - "position add fails with ERR_PORTFOLIO_FROZEN (409)"
            - "snapshot compute on the FROZEN portfolio succeeds (201) — freeze gates position mutation, not recomputation"

      - name: decided_to_retired_auto_transition_on_clock
        claim_type: auto_transition
        grounds:
          - state_machines.Resource.DECIDED_to_RETIRED
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "System transition: advancing the logical clock into the DECIDED unit's retirement_year flips it to RETIRED and bumps its version; a unit whose retirement_year is still in the future is untouched."
        test_recipe:
          setup: ["Clock 2026-09-01. Plan P DRAFT; resource R DECIDED with retirement_year 2028; resource R2 DECIDED with retirement_year 2035."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP Auto", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /resources"
              payload: { unit_name: "COAL-AUTO", resource_type: "COAL", nameplate_mw: 300, in_service_year: 1990, fuel_type: "COAL" }
              as: UtilityPlanner
              captures: { res_id: $.data.id }
            - call: "POST /resources"
              payload: { unit_name: "COAL-LATE", resource_type: "COAL", nameplate_mw: 300, in_service_year: 1995, fuel_type: "COAL" }
              as: UtilityPlanner
              captures: { res2_id: $.data.id }
            - call: "POST /resources/${res_id}/retire"
              payload: { retirement_year: 2028, plan_id: "${plan_id}" }
              as: UtilityPlanner
            - call: "POST /resources/${res2_id}/retire"
              payload: { retirement_year: 2035, plan_id: "${plan_id}" }
              as: UtilityPlanner
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-02T00:00:00Z" }
              as: UtilityPlanner
          assert:
            - "Resource.${res_id}.status == RETIRED and version == 3 (retire + clock transition)"
            - "Resource.${res2_id}.status == DECIDED and version == 2 (retirement_year 2035 not reached)"

      - name: reopen_unfreezes_portfolios_and_unlocks_forecasts
        claim_type: compensation
        grounds:
          - state_machines.ResourcePlan.REJECTED_to_DRAFT
          - state_machines.ResourcePortfolio.FROZEN_to_DRAFT
        distinguishing_aspect: "Compensation pattern: reopen reverses submit-for-review's freeze (portfolios back to DRAFT, forecasts unlocked, preferred_portfolio_id null), letting a previously frozen portfolio accept a new position."
        test_recipe:
          setup: ["Clock 2026-08-01. Plan P driven to REJECTED (window elapsed, review REJECT); portfolio PF FROZEN."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP Comp", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
              captures: { fc_id: $.data.id }
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-Comp", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id }
            - call: "POST /candidates"
              payload: { candidate_name: "K-COMP", resource_type: "WIND", nameplate_mw: 100, online_year: 2028, capex_usd_per_kw: 1100, fixed_om_usd_per_kw_year: 20, fuel_type: "WIND", build_lead_years: 2 }
              as: UtilityPlanner
              captures: { cand_id: $.data.id }
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
              captures: { plan_v: $.data.version }
            - call: "POST /plans/${plan_id}/commission-review"
              payload: { decision: "REJECT", expected_plan_version: "${plan_v}" }
              as: Commissioner
          trigger:
            - call: "POST /plans/${plan_id}/reopen"
              payload: {}
              as: UtilityPlanner
            - call: "POST /portfolios/${pf_id}/positions"
              payload: { candidate_id: "${cand_id}", committed_mw: 25 }
              as: UtilityPlanner
              captures: { pos_id: $.data.id }
          assert:
            - "after reopen: plan status DRAFT, reopen_count 1, preferred_portfolio_id null"
            - "portfolio PF is DRAFT again and the position add succeeds (201)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: coal_derate_ramp_and_floor
        claim_type: decay_boundary
        grounds:
          - calculations.derating_factor
          - calculations.capacity_accreditation
        distinguishing_aspect: "Coal age derate is a bracketed linear ramp: age 40 -> 1.00 (accredited 270.00 for 300 MW), age 45 -> 0.95 (256.50), age 50 -> floor 0.90 (243.00); the same unit across three snapshot years exercises below/inside/at the ramp."
        test_recipe:
          setup: ["Clock 2026-09-01. Plan P DRAFT; BASE forecasts for 2025 (age 40), 2030 (age 45), 2035 (age 50); portfolio PF; COAL unit 300 MW in_service 1985."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP Der", cycle_year: 2026, planning_horizon_years: 20 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2025, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2035, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-Der", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /resources"
              payload: { unit_name: "COAL-DER", resource_type: "COAL", nameplate_mw: 300, in_service_year: 1985, fuel_type: "COAL" }
              as: UtilityPlanner
          trigger:
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2025, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pf_v}" }
              as: UtilityPlanner
              captures: { a25: $.data.accredited_supply_mw }
            - call: "GET /portfolios/${pf_id}"
              payload: {}
              as: UtilityPlanner
              captures: { pfv_2: $.data.version }
