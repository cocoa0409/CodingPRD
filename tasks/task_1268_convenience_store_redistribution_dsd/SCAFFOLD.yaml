scenario: "1268. Convenience-Store Redistribution & DSD Wholesale (McLane style): store order guide & delivery day cycle, case vs split-case pick fee, weekly promo/allowance & retail price maintenance, credit terms & delivery-day payment, short/damage credit on delivery, cigarette-tax-stamp jurisdiction handling, minimum drop size & fuel surcharge, slotting & new-item authorization"
domain_name: convenience-store-redistribution-dsd
api_prefix: "/"
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - { name: store_name, type: string, source: input, description: "Legal store name" }
      - { name: jurisdiction_code, type: enum, source: input, description: "Tax-stamp jurisdiction", constraints: "one of {CA_NORTH, CA_SOUTH, NV_CLARK, AZ_MARICOPA}" }
      - { name: credit_terms, type: enum, source: input, description: "Payment terms", constraints: "one of {COD, NET7, NET14}" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Max allowed credit exposure in cents" }
      - { name: credit_status, type: enum, source: computed, description: "Derived credit posture; gates order submission", default: GOOD_STANDING, constraints: "one of {GOOD_STANDING, CREDIT_HOLD}" }
      - { name: tobacco_license_id, type: string, source: input, description: "State tobacco license; required for tobacco order lines", constraints: "nullable" }
      - { name: ar_balance_cents, type: integer, source: computed, description: "Sum of balance_cents over invoices with status in {OPEN, PARTIALLY_PAID, PAST_DUE}", default: 0 }
      - { name: exposure_forward_cents, type: integer, source: computed, description: "Forward-looking exposure: ar_balance_cents + sum(provisional_total_cents) of PurchaseOrders with status in {SUBMITTED, ASSIGNED, CLOSED}", default: 0 }
      - { name: delivery_day, type: enum, source: input, description: "Scheduled weekly delivery day", constraints: "one of {MON, TUE, WED, THU, FRI}" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique item master SKU", constraints: "unique across all products" }
      - { name: description, type: string, source: input, description: "Item description" }
      - { name: case_pack_units, type: integer, source: input, description: "Units per full case", constraints: ">= 1" }
      - { name: case_cost_cents, type: integer, source: input, description: "Wholesale cost per full case" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Wholesale cost per eaches unit when split-case picked" }
      - { name: split_case_allowed, type: boolean, source: input, description: "Whether split-case picking is permitted" }
      - { name: is_tobacco, type: boolean, source: input, description: "Tobacco flag; triggers tax-stamp handling", default: false }
      - { name: weight_lbs_per_case, type: number, source: input, description: "Case weight used for manifest load" }
      - { name: status, type: enum, source: system, description: "Item lifecycle", default: ACTIVE, constraints: "one of {ACTIVE}" }

  - name: OrderGuide
    parent: Retailer
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; owning store" }
      - { name: delivery_day, type: enum, source: input, description: "Guide cycle day", constraints: "one of {MON, TUE, WED, THU, FRI}; must equal Retailer.delivery_day" }
      - { name: cutoff_hours_before, type: integer, source: input, description: "Hours before 00:00 of delivery day after which submission is rejected" }
      - { name: lines, type: array, source: input, description: "Array of {product_id, par_cases} authorized orderable items" }
      - { name: status, type: enum, source: system, description: "Guide lifecycle", default: ACTIVE, constraints: "one of {ACTIVE}" }

  - name: PromoEvent
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; promoted item" }
      - { name: promo_type, type: enum, source: input, description: "Funding mechanics", constraints: "one of {OFF_INVOICE, SCAN_BACK}" }
      - { name: discount_pct_bps, type: integer, source: input, description: "Discount in basis points of line merchandise cost", constraints: "1..10000" }
      - { name: start_date, type: string, source: input, description: "First eligible date, inclusive (YYYY-MM-DD)" }
      - { name: end_date, type: string, source: input, description: "Last eligible date, inclusive (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "Promo lifecycle", default: SCHEDULED, constraints: "one of {SCHEDULED, ACTIVE, EXPIRED}" }

  - name: RetailPriceRecord
    parent: Retailer
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: shelf_price_cents, type: integer, source: input, description: "Maintained retail shelf price" }
      - { name: effective_start, type: string, source: input, description: "First effective date, inclusive" }
      - { name: effective_end, type: string, source: input, description: "Last effective date, inclusive; null = open-ended", constraints: "nullable" }
      - { name: supersedes_id, type: string, source: system, description: "FK -> RetailPriceRecord.id; prior record replaced at creation", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Record lifecycle", default: ACTIVE, constraints: "one of {ACTIVE, SUPERSEDED}" }

  - name: DeliveryWindow
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Route identifier the window belongs to" }
      - { name: window_start, type: datetime, source: input, description: "Window start, half-open lower bound" }
      - { name: window_end, type: datetime, source: input, description: "Window end, half-open upper bound" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, description: "Required gap after window_end before the next window on the same route may start" }

  - name: FuelSurchargeRate
    parent: null
    common_fields: true
    fields:
      - { name: week_start_date, type: string, source: input, description: "Monday of the rate week (YYYY-MM-DD)", constraints: "unique" }
      - { name: doe_index_usd, type: number, source: input, description: "DOE weekly diesel index in USD per gallon", constraints: "> 0" }

  - name: TaxStampSupply
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction this stamp supply serves", constraints: "unique" }
      - { name: stamp_rate_cents_per_pack, type: integer, source: input, description: "Excise stamp cost per pack" }
      - { name: handling_fee_per_roll_cents, type: integer, source: input, description: "Flat handling fee per stamp roll" }
      - { name: packs_per_roll, type: integer, source: input, description: "Packs covered by one roll" }
      - { name: min_charge_cents, type: integer, source: input, description: "Minimum stamp charge per order" }
      - { name: rolls_on_hand, type: integer, source: computed, description: "Rolls consumed at manifest close for tobacco orders", default: 0 }
      - { name: status, type: enum, source: system, description: "Supply posture", default: ACTIVE, constraints: "one of {ACTIVE}" }

  - name: DeliveryManifest
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Route executing this delivery day" }
      - { name: delivery_date, type: string, source: input, description: "Delivery date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "Manifest lifecycle", default: SCHEDULED, constraints: "one of {SCHEDULED, LOADING, CLOSED, COMPLETED}" }
      - { name: capacity_lbs, type: number, source: input, description: "Truck weight capacity" }
      - { name: total_weight_lbs, type: number, source: computed, description: "Sum of weight_lbs over assigned PurchaseOrders with status != CANCELLED", default: 0 }
      - { name: overweight_flag, type: boolean, source: computed, description: "true when total_weight_lbs > capacity_lbs; blocks further assigns", default: false }
      - { name: fuel_rate_id, type: string, source: system, description: "FK -> FuelSurchargeRate.id; rate week locked at close", constraints: "nullable" }

  - name: PurchaseOrder
    parent: Retailer
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; ordering store" }
      - { name: order_guide_id, type: string, source: input, description: "FK -> OrderGuide.id; guide the order is placed against" }
      - { name: manifest_id, type: string, source: system, description: "FK -> DeliveryManifest.id; set by assign-order", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Order lifecycle", default: DRAFT, constraints: "one of {DRAFT, SUBMITTED, ASSIGNED, CLOSED, DELIVERED, INVOICED, CANCELLED}" }
      - { name: has_tobacco, type: boolean, source: computed, description: "true when any line references a tobacco product", default: false }
      - { name: merch_subtotal_cents, type: integer, source: computed, description: "Sum of line merchandise (ordered basis)", default: 0 }
      - { name: promo_allowance_cents, type: integer, source: computed, description: "Sum of per-line promo allowance, rounded per line then summed", default: 0 }
      - { name: pick_fee_cents, type: integer, source: computed, description: "Case + split-case pick fees", default: 0 }
      - { name: min_drop_fee_cents, type: integer, source: computed, description: "Minimum-drop fee when net merchandise below threshold", default: 0 }
      - { name: fuel_surcharge_cents, type: integer, source: computed, description: "Stamped at manifest close; not recomputed after shorts", default: 0 }
      - { name: tax_stamp_cost_cents, type: integer, source: computed, description: "Cigarette tax-stamp cost per tax_stamp_cost_calc; computed on ordered packs at submit and carried unchanged into the final invoice", default: 0 }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Forward-looking total computed at submit on ordered quantities", default: 0 }
      - { name: final_total_cents, type: integer, source: computed, description: "Chronological total computed at delivery confirmation on delivered quantities", default: 0 }
      - { name: weight_lbs, type: number, source: computed, description: "Total case weight of the order", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Submission timestamp", constraints: "nullable" }

  - name: OrderLine
    parent: PurchaseOrder
    common_fields: false
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> PurchaseOrder.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: cases_qty, type: integer, source: input, description: "Full cases ordered", constraints: ">= 0" }
      - { name: split_units_qty, type: integer, source: input, description: "Eaches ordered as split-case picks", constraints: ">= 0" }
      - { name: line_merch_cents, type: integer, source: computed, description: "cases_qty*case_cost_cents + split_units_qty*unit_cost_cents" }
      - { name: line_promo_cents, type: integer, source: computed, description: "Per-line promo allowance, round half-up before summing" }
      - { name: delivered_cases, type: integer, source: system, description: "Cases actually delivered", default: 0 }
      - { name: delivered_split_units, type: integer, source: system, description: "Eaches actually delivered", default: 0 }

  - name: Invoice
    parent: PurchaseOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> PurchaseOrder.id; source order" }
      - { name: retailer_id, type: string, source: system, description: "FK -> Retailer.id; billed store" }
      - { name: invoiced_total_cents, type: integer, source: computed, description: "Final delivered total; conserved against payments + credits" }
      - { name: balance_cents, type: integer, source: computed, description: "Outstanding amount after applied payments and posted credit memos" }
      - { name: due_date, type: string, source: computed, description: "delivery_date for COD; delivery_date+7 for NET7; +14 for NET14" }
      - { name: status, type: enum, source: system, description: "Invoice lifecycle", default: OPEN, constraints: "one of {OPEN, PARTIALLY_PAID, PAID, PAST_DUE}" }

  - name: Payment
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount", constraints: "> 0" }
      - { name: method, type: enum, source: input, description: "Tender type", constraints: "one of {CASH_ON_DELIVERY, CHECK, ACH}" }
      - { name: status, type: enum, source: system, description: "Payment lifecycle", default: APPLIED, constraints: "one of {APPLIED, REVERSED}" }

  - name: CreditMemo
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id" }
      - { name: exception_id, type: string, source: system, description: "FK -> DeliveryException.id; originating exception when auto-generated", constraints: "nullable" }
      - { name: origin, type: enum, source: input, description: "Credit origin", constraints: "one of {SHORT, DAMAGE, MANUAL}" }
      - { name: amount_cents, type: integer, source: input, description: "Credit amount", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "Memo lifecycle", default: DRAFT, constraints: "one of {DRAFT, POSTED, VOIDED}" }

  - name: DeliveryException
    parent: DeliveryManifest
    common_fields: true
    fields:
      - { name: manifest_id, type: string, source: input, description: "FK -> DeliveryManifest.id" }
      - { name: order_id, type: string, source: input, description: "FK -> PurchaseOrder.id" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id" }
      - { name: exception_type, type: enum, source: input, description: "Exception kind", constraints: "one of {SHORT, DAMAGE}" }
      - { name: cases_qty, type: integer, source: input, description: "Cases short/damaged", constraints: ">= 0" }
      - { name: split_units_qty, type: integer, source: input, description: "Eaches short/damaged", constraints: ">= 0" }
      - { name: credit_amount_cents, type: integer, source: computed, description: "cases_qty*case_cost_cents + split_units_qty*unit_cost_cents of the referenced line product" }
      - { name: status, type: enum, source: system, description: "Exception lifecycle", default: RECORDED, constraints: "one of {RECORDED, CREDITED}" }

  - name: NewItemRequest
    parent: Retailer
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; store requesting the item" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; candidate item" }
      - { name: proposed_shelf_price_cents, type: integer, source: input, description: "Requested shelf price" }
      - { name: slotting_fee_cents, type: integer, source: computed, description: "Authorization fee per slotting_fee_calc" }
      - { name: revision_notes, type: string, source: system, description: "Reason when revision requested", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "Authorization lifecycle", default: SUBMITTED, constraints: "one of {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, AUTHORIZED, REJECTED}" }

state_machines:
  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [INVOICED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /purchase-orders/{id}/submit"
        actor: StoreManager
        preconditions:
          - "Retailer's OrderGuide.status == ACTIVE"
          - "every line's product appears in the guide's lines array"
          - "Retailer's tobacco_license_id present when order has_tobacco"
          - "TaxStampSupply for Retailer.jurisdiction_code has status == ACTIVE when has_tobacco"
          - "logical clock is before cutoff: delivery week day minus order_guide.cutoff_hours_before"
          - "Retailer.credit_status == GOOD_STANDING"
          - "exposure_forward_cents after this order <= Retailer.credit_limit_cents"
        side_effects:
          - "compute merch_subtotal_cents, promo_allowance_cents, pick_fee_cents, min_drop_fee_cents, provisional_total_cents, weight_lbs"
          - "recompute Retailer.exposure_forward_cents (adds provisional_total_cents)"
          - "if exposure_forward_cents > credit_limit_cents the submit is rejected instead (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "increments PurchaseOrder.version by 1"
      - from: SUBMITTED
        to: ASSIGNED
        trigger: "POST /delivery-manifests/{id}/assign-order"
        actor: WholesaleAdmin
        preconditions:
          - "DeliveryManifest.status in {SCHEDULED, LOADING}"
          - "DeliveryManifest.overweight_flag == false"
          - "expected_manifest_version == DeliveryManifest.version"
        side_effects:
          - "sets PurchaseOrder.manifest_id"
          - "DeliveryManifest.total_weight_lbs += PurchaseOrder.weight_lbs"
          - "if total_weight_lbs > capacity_lbs: DeliveryManifest.overweight_flag = true (blocks later assigns; current assign still succeeds)"
          - "increments DeliveryManifest.version by 1 and PurchaseOrder.version by 1"
      - from: ASSIGNED
        to: CLOSED
        trigger: "POST /delivery-manifests/{id}/close"
        actor: WholesaleAdmin
        preconditions:
          - "DeliveryManifest.status == LOADING"
          - "order in this manifest with status == ASSIGNED"
        side_effects:
          - "stamps fuel_surcharge_cents per fuel_surcharge_calc using the FuelSurchargeRate of the delivery week"
          - "for tobacco orders: decrements TaxStampSupply.rolls_on_hand by ceil(total tobacco packs / packs_per_roll)"
      - from: CLOSED
        to: DELIVERED
        trigger: "POST /purchase-orders/{id}/confirm-delivery"
        actor: RouteDriver
        preconditions:
          - "order.status == CLOSED"
          - "DeliveryManifest.status in {CLOSED, COMPLETED}"
        side_effects:
          - "sets delivered_cases/delivered_split_units on each line net of RECORDED/CREDITED exceptions"
          - "computes final_total_cents on delivered quantities per invoice_total_calc (final variant)"
          - "creates Invoice with invoiced_total_cents = final_total_cents, balance_cents = invoiced_total_cents, status OPEN"
          - "Retailer.ar_balance_cents += invoiced_total_cents"
      - from: DELIVERED
        to: INVOICED
        trigger: "system auto-transition immediately after confirm-delivery side effects commit"
        actor: system
        preconditions: ["invoice row persisted"]
        side_effects:
          - "Retailer.exposure_forward_cents -= provisional_total_cents (order leaves the forward-looking set)"
          - "re-evaluates Retailer.credit_status against limit"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/cancel"
        actor: StoreManager
        preconditions: ["order.status == DRAFT"]
        side_effects: ["increments PurchaseOrder.version by 1"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/cancel"
        actor: StoreManager
        preconditions:
          - "order.status == SUBMITTED (not yet ASSIGNED)"
        side_effects:
          - "Retailer.exposure_forward_cents -= provisional_total_cents"
          - "re-evaluates Retailer.credit_status (may auto-release CREDIT_HOLD)"
          - "increments PurchaseOrder.version by 1"

  - entity: DeliveryManifest
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: LOADING
        trigger: "POST /delivery-manifests/{id}/begin-loading"
        actor: WholesaleAdmin
        preconditions: ["manifest.status == SCHEDULED"]
        side_effects: ["increments DeliveryManifest.version by 1"]
      - from: LOADING
        to: CLOSED
        trigger: "POST /delivery-manifests/{id}/close"
        actor: WholesaleAdmin
        preconditions:
          - "manifest.status == LOADING"
          - "expected_manifest_version == DeliveryManifest.version"
        side_effects:
          - "locks fuel_rate_id to the FuelSurchargeRate whose week contains delivery_date"
          - "stamps fuel_surcharge_cents on every ASSIGNED order in this manifest (order transitions to CLOSED)"
          - "decrements TaxStampSupply.rolls_on_hand for tobacco orders per tax_stamp_cost_calc"
          - "increments DeliveryManifest.version by 1"
      - from: CLOSED
        to: COMPLETED
        trigger: "system auto-transition when every non-cancelled order in the manifest has status in {DELIVERED, INVOICED}"
        actor: system
        preconditions: ["no assigned order remains in ASSIGNED or CLOSED"]
        side_effects: ["increments DeliveryManifest.version by 1"]

  - entity: Invoice
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/payments with amount < balance_cents"
        actor: CreditManager
        preconditions: ["invoice.status in {OPEN, PAST_DUE}", "amount_cents <= balance_cents"]
        side_effects:
          - "balance_cents -= amount_cents"
          - "Retailer.ar_balance_cents -= amount_cents"
          - "re-evaluates Retailer.credit_status"
      - from: OPEN
        to: PAID
        trigger: "POST /invoices/{id}/payments with amount == balance_cents"
        actor: CreditManager
        preconditions: ["invoice.status in {OPEN, PAST_DUE}", "amount_cents <= balance_cents"]
        side_effects: ["balance_cents = 0", "Retailer.ar_balance_cents -= amount_cents", "re-evaluates Retailer.credit_status"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /invoices/{id}/payments with amount == balance_cents"
        actor: CreditManager
        preconditions: ["invoice.status == PARTIALLY_PAID", "amount_cents <= balance_cents"]
        side_effects: ["balance_cents = 0", "Retailer.ar_balance_cents -= amount_cents", "re-evaluates Retailer.credit_status"]
      - from: OPEN
        to: PAST_DUE
        trigger: "system auto-transition when logical clock passes due_date with balance_cents > 0"
        actor: system
        preconditions: ["invoice.status == OPEN", "current logical date > due_date"]
        side_effects: ["Retailer.credit_status set to CREDIT_HOLD"]
      - from: PAST_DUE
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{id}/payments with amount < balance_cents"
        actor: CreditManager
        preconditions: ["invoice.status == PAST_DUE"]
        side_effects: ["balance_cents -= amount_cents", "Retailer.ar_balance_cents -= amount_cents", "re-evaluates Retailer.credit_status"]
      - from: PAID
        to: OPEN
        trigger: "POST /payments/{id}/reverse on the payment that closed the invoice"
        actor: CreditManager
        preconditions: ["payment.status == APPLIED"]
        side_effects:
          - "payment.status = REVERSED; balance_cents += payment.amount_cents"
          - "Retailer.ar_balance_cents += payment.amount_cents"
          - "re-evaluates Retailer.credit_status"
        note: "cycle PAID -> OPEN is the revert leg of the payment lifecycle"
      - from: PARTIALLY_PAID
        to: OPEN
        trigger: "POST /payments/{id}/reverse when reversal returns balance to invoiced_total_cents"
        actor: CreditManager
        preconditions: ["payment.status == APPLIED"]
        side_effects: ["balance_cents += payment.amount_cents", "Retailer.ar_balance_cents += payment.amount_cents"]

  - entity: CreditMemo
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /credit-memos/{id}/post"
        actor: CreditManager
        preconditions:
          - "memo.status == DRAFT"
          - "Invoice.status in {OPEN, PARTIALLY_PAID, PAST_DUE}"
          - "amount_cents <= invoice.balance_cents"
        side_effects:
          - "Invoice.balance_cents -= amount_cents"
          - "Retailer.ar_balance_cents -= amount_cents"
          - "re-evaluates Retailer.credit_status (credit may auto-release CREDIT_HOLD)"
      - from: POSTED
        to: VOIDED
        trigger: "POST /credit-memos/{id}/void"
        actor: CreditManager
        preconditions: ["memo.status == POSTED"]
        side_effects:
          - "Invoice.balance_cents += amount_cents"
          - "if invoice was PAID only because of this credit, invoice.status returns to PARTIALLY_PAID or OPEN per remaining payments"
          - "Retailer.ar_balance_cents += amount_cents"
          - "re-evaluates Retailer.credit_status"

  - entity: NewItemRequest
    initial_state: SUBMITTED
    terminal_states: [AUTHORIZED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /new-item-requests/{id}/start-review"
        actor: WholesaleAdmin
        preconditions: ["request.status == SUBMITTED"]
        side_effects: ["computes slotting_fee_cents per slotting_fee_calc"]
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /new-item-requests/{id}/request-revision"
        actor: WholesaleAdmin
        preconditions: ["request.status == UNDER_REVIEW"]
        side_effects: ["sets revision_notes"]
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /new-item-requests/{id}/resubmit"
        actor: SalesRep
        preconditions: ["request.status == REVISION_REQUESTED"]
        side_effects: ["clears revision_notes"]
        note: "cycle SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED supports negotiation rounds"
      - from: UNDER_REVIEW
        to: AUTHORIZED
        trigger: "POST /new-item-requests/{id}/authorize"
        actor: WholesaleAdmin
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "Product.status == ACTIVE"
        side_effects:
          - "appends {product_id, par_cases: 0} to the retailer's ACTIVE OrderGuide.lines"
          - "creates a RetailPriceRecord with shelf_price_cents = proposed_shelf_price_cents, superseding any ACTIVE record for (retailer, product)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /new-item-requests/{id}/reject"
        actor: WholesaleAdmin
        preconditions: ["request.status == UNDER_REVIEW"]
        side_effects: []

concurrency_rules:
  - rule_id: order-submit-stale-version
    parent_entity: PurchaseOrder
    write_endpoint: "POST /purchase-orders/{id}/submit"
    occ_field: "expected_order_version"
    description: |
      Submitting a PurchaseOrder whose version has advanced since the client
      last observed it is rejected. Captures the case where another writer
      edited the draft lines (incrementing version) after this client read
      the order; the submitter's view of the draft is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: manifest-close-stale-version
    parent_entity: DeliveryManifest
    write_endpoint: "POST /delivery-manifests/{id}/close"
    occ_field: "expected_manifest_version"
    description: |
      Closing a DeliveryManifest whose version has advanced since the client
      last observed it is rejected. Assign-order operations legitimately
      increment the manifest version, so a close carrying an older observed
      version is stale and refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: order_line_merch_calc
    trigger: "on PurchaseOrder submit and again on delivery confirmation (delivered basis)"
    algorithm: aggregation
    formula: |
      per line: line_merch_cents = cases_qty * Product.case_cost_cents
                                   + split_units_qty * Product.unit_cost_cents
      merch_subtotal_cents = sum(line_merch_cents)
    input_set: "all OrderLines of the order; submit uses ordered quantities, confirm-delivery uses delivered quantities"
    precision: "integer cents, no rounding"

  - name: promo_allowance_calc
    trigger: "on PurchaseOrder submit and delivery confirmation for lines whose product has an OFF_INVOICE PromoEvent covering the order's delivery date"
    algorithm: aggregation
    formula: |
      per line: line_promo_cents = round_half_up(line_merch_cents * discount_pct_bps / 10000)
      promo_allowance_cents = sum(line_promo_cents)
      PINNED ORDER: round each line FIRST (2 decimal half-up), THEN sum.
      Sum-then-round is explicitly NOT used and yields different cents.
    input_set: "lines whose product has an OFF_INVOICE promo with start_date <= delivery_date <= end_date (both inclusive), where delivery_date is the next occurrence of Retailer.delivery_day on or after the submit timestamp; SCAN_BACK promos never reduce the invoice"
    constants:
      ROUNDING: "round_half_up to integer cents per line"
    precision: "integer cents, per-line half-up then sum"

  - name: pick_fee_calc
    trigger: "on PurchaseOrder submit and delivery confirmation"
    algorithm: aggregation
    formula: |
      pick_fee_cents = total_cases * CASE_PICK_FEE_CENTS + total_split_units * SPLIT_PICK_FEE_CENTS
    input_set: "ordered case/split quantities at submit; delivered quantities at confirm-delivery"
    constants:
      CASE_PICK_FEE_CENTS: 12
      SPLIT_PICK_FEE_CENTS: 45
    precision: "integer cents"

  - name: min_drop_fee_calc
    trigger: "on PurchaseOrder submit"
    algorithm: threshold
    formula: |
      net_merch = merch_subtotal_cents - promo_allowance_cents
      min_drop_fee_cents = 2500 if net_merch < 50000 else 0
      BOUNDARY: net_merch == 50000 exactly incurs NO fee (strict <).
    input_set: "whole order"
    constants:
      MIN_DROP_THRESHOLD_CENTS: 50000
      MIN_DROP_FEE_CENTS: 2500
    precision: "integer cents"

  - name: fuel_surcharge_calc
    trigger: "on DeliveryManifest close; stamps every ASSIGNED order in the manifest"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER (pinned): (1) merch_subtotal_cents, (2) subtract promo_allowance_cents,
      (3) add pick_fee_cents -> surcharge_base; (4) min_drop fee is evaluated separately and
      is NOT part of surcharge_base; (5) surcharge applies to surcharge_base.
      idx = FuelSurchargeRate.doe_index_usd of the week containing delivery_date
      rate = 0.0   if idx < 3.50
             0.025 if 3.50 <= idx < 4.00
             0.040 if idx >= 4.00
      BOUNDARY: idx == 3.50 exactly selects the 2.5% tier (inclusive lower bound).
      fuel_surcharge_cents = round_half_up(surcharge_base * rate)
    input_set: "orders in this manifest with status == ASSIGNED at close time"
    precision: "integer cents, round_half_up"
    variants:
      - name: zero_tier
        when: "idx < 3.50"
        difference: "no surcharge stamped"

  - name: invoice_total_calc
    trigger: "provisional at PurchaseOrder submit; final at confirm-delivery"
    algorithm: forward_looking
    formula: |
      provisional_total_cents = merch_subtotal - promo_allowance + pick_fee + min_drop_fee
                                + tax_stamp_cost_cents
                                (ordered quantities; fuel surcharge excluded at submit)
      final_total_cents = delivered_merch - delivered_promo + delivered_pick_fee
                          + tax_stamp_cost_cents (unchanged from submit)
                          + fuel_surcharge_cents (stamped at close, NOT recomputed)
    input_set: "provisional: ordered lines of SUBMITTED order; final: delivered quantities net of SHORT/DAMAGE exceptions"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "at submit"
        difference: "uses ordered quantities, excludes fuel surcharge"
      - name: final
        when: "at confirm-delivery"
        difference: "uses delivered quantities net of shorts, includes stamped fuel surcharge; differs from provisional whenever shorts occur"

  - name: credit_exposure_calc
    trigger: "on any order submit/cancel, invoice creation, payment, payment reversal, credit memo post/void"
    algorithm: aggregation
    formula: |
      forward variant:  exposure_forward_cents = ar_balance_cents
          + sum(provisional_total_cents of PurchaseOrders with status in {SUBMITTED, ASSIGNED, CLOSED})
      chronological variant (AR aging exposure): exposure_aging_cents =
          sum(balance_cents of invoices with status in {OPEN, PARTIALLY_PAID, PAST_DUE},
              bucketed by current_logical_date - due_date: CURRENT / DUE_1_7 / DUE_8_PLUS)
    input_set: "forward: open invoices + pipeline orders; aging: open invoices only, chronological by due_date"
    precision: "integer cents"
    variants:
      - name: forward_looking
        when: "used for credit-limit gating at submit"
        difference: "includes pipeline order projections; changes on submit/cancel before any invoice exists"
      - name: chronological_aging
        when: "reported on credit-summary; drives PAST_DUE auto-transition"
        difference: "invoice balances only, bucketed by days past due; ignores pipeline orders entirely"

  - name: tax_stamp_cost_calc
    trigger: "on PurchaseOrder submit when has_tobacco; rolls decremented at manifest close"
    algorithm: tiered_pricing
    formula: |
      packs = total ordered tobacco eaches (split_units_qty summed over tobacco lines; full cases contribute cases_qty * case_pack_units)
      stamp_charge = max(packs * stamp_rate_cents_per_pack, min_charge_cents)
      rolls_needed = ceil(packs / packs_per_roll)
      total_stamp_cost_cents = stamp_charge + rolls_needed * handling_fee_per_roll_cents
    input_set: "tobacco lines of the order; TaxStampSupply of the retailer's jurisdiction with status ACTIVE"
    precision: "integer cents"

  - name: slotting_fee_calc
    trigger: "on NewItemRequest start-review"
    algorithm: tiered_pricing
    formula: |
      slotting_fee_cents = SLOT_BASE_CENTS + (case_pack_units of product) * SLOT_PER_UNIT_CENTS,
      capped at SLOT_CAP_CENTS (min of raw and cap).
    input_set: "the NewItemRequest's product"
    constants:
      SLOT_BASE_CENTS: 50000
      SLOT_PER_UNIT_CENTS: 250
      SLOT_CAP_CENTS: 150000
    precision: "integer cents"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 1
    category: auth
    check: "request body is well-formed and all required fields are present with correct types"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 7
    category: business_constraint
    check: "product sku must be globally unique"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /products"
  - priority: 7
    category: business_constraint
    check: "fuel surcharge rate week_start_date must be unique"
    error_id: ERR_DUPLICATE_RATE_WEEK
    http_status: 409
    applies_to: "POST /fuel-surcharge-rates"
  - priority: 7
    category: business_constraint
    check: "tax stamp supply jurisdiction_code must be unique"
    error_id: ERR_DUPLICATE_JURISDICTION
    http_status: 409
    applies_to: "POST /tax-stamp-supplies"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint per RBAC; entity-backed roles must own the target resource"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path and body referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target resource in a legal from-state for the requested transition (order/manifest/invoice/memo/request status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 4
    category: state
    check: "manifest must be in {SCHEDULED, LOADING} for assign-order"
    error_id: ERR_MANIFEST_NOT_OPEN
    http_status: 409
    applies_to: "POST /delivery-manifests/{id}/assign-order"
  - priority: 4
    category: state
    check: "OCC expected version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /purchase-orders/{id}/submit, POST /delivery-manifests/{id}/close"
  - priority: 5
    category: business_safety
    check: "tobacco order lines require Retailer.tobacco_license_id present"
    error_id: ERR_TOBACCO_LICENSE_MISSING
    http_status: 422
    applies_to: "POST /purchase-orders, POST /purchase-orders/{id}/submit"
  - priority: 5
    category: business_safety
    check: "tobacco order lines require an ACTIVE TaxStampSupply for the retailer's jurisdiction"
    error_id: ERR_TAX_STAMP_UNAVAILABLE
    http_status: 422
    applies_to: "POST /purchase-orders/{id}/submit"
  - priority: 6
    category: business_temporal
    check: "order submission before guide cutoff (delivery day minus cutoff_hours_before)"
    error_id: ERR_ORDER_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /purchase-orders/{id}/submit"
  - priority: 6
    category: business_temporal
    check: "new DeliveryWindow must not overlap existing windows on the same route under half-open intervals plus turnaround buffer"
    error_id: ERR_DELIVERY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /delivery-windows"
  - priority: 6
    category: business_temporal
    check: "new PromoEvent must not overlap an existing promo for the same product under closed inclusive date intervals"
    error_id: ERR_PROMO_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /promo-events"
  - priority: 7
    category: business_constraint
    check: "every ordered product appears in the referenced ACTIVE OrderGuide lines"
    error_id: ERR_PRODUCT_NOT_ON_GUIDE
    http_status: 422
    applies_to: "POST /purchase-orders, POST /purchase-orders/{id}/submit"
  - priority: 7
    category: business_constraint
    check: "split_units_qty > 0 requires Product.split_case_allowed == true"
    error_id: ERR_SPLIT_CASE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /purchase-orders"
  - priority: 7
    category: business_constraint
    check: "manifest overweight_flag == false required for assign-order"
    error_id: ERR_MANIFEST_OVERWEIGHT
    http_status: 422
    applies_to: "POST /delivery-manifests/{id}/assign-order"
  - priority: 7
    category: business_constraint
    check: "order guide delivery_day must equal the retailer's delivery_day"
    error_id: ERR_GUIDE_DAY_MISMATCH
    http_status: 422
    applies_to: "POST /order-guides"
  - priority: 7
    category: business_constraint
    check: "credit memo amount must not exceed invoice balance_cents"
    error_id: ERR_MEMO_EXCEEDS_INVOICE
    http_status: 422
    applies_to: "POST /invoices/{id}/credit-memos, POST /credit-memos/{id}/post"
  - priority: 8
    category: business_fiscal
    check: "Retailer.credit_status == GOOD_STANDING required to submit"
    error_id: ERR_CREDIT_HOLD
    http_status: 422
    applies_to: "POST /purchase-orders/{id}/submit"
  - priority: 8
    category: business_fiscal
    check: "exposure_forward_cents including this order must be <= credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /purchase-orders/{id}/submit"
  - priority: 8
    category: business_fiscal
    check: "payment amount_cents must not exceed invoice balance_cents"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /invoices/{id}/payments"

