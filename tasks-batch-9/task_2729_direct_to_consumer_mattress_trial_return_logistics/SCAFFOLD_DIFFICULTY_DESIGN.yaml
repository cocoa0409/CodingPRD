        grounds:
          - state_machines.PickupAppointment.status.BOOKED_to_COMPLETED
          - state_machines.ReturnCase.logistics_status.PICKUP_SCHEDULED_to_PICKED_UP
          - state_machines.TrialOrder.trial_status.RETURN_REQUESTED_to_RETURNED
          - state_machines.Customer.status.TRIAL_RESTRICTED_to_BLOCKED
          - calculations.abuse_score
          - entities.TrialAbuseSignal.fields.signal_type
        distinguishing_aspect: |
          Depth-4 chain from a single logistics write: POST /pickup-appointments/{id}/complete ->
          ReturnCase PICKED_UP with nights_used 24 -> TrialOrder RETURNED/CLOSED with nights_slept 24
          -> a SHORT_TRIAL TrialAbuseSignal appended and Customer.completed_return_count 1 ->
          abuse_score_rolling 80 and Customer.status BLOCKED with trial_block_until
          2027-08-25T00:00:00Z. Trigger is a logistics closure, not a finance or exchange write.
