  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      # -------- CYCLIC: the investigation re-enters EVIDENCE_REQUESTED twice --------
      - name: non_linear_cyclic_investigation_evidence_loop_then_remand_exhausts_rounds
        grounds:
          - state_machines.HighBillInvestigation
          - state_machines.RepairProof
          - state_machines.BoardAppeal
          - entities.HighBillInvestigation.fields.evidence_round_count
          - entities.HighBillInvestigation.fields.remand_count
          - validations[ERR_EVIDENCE_ROUND_LIMIT]
          - endpoints[POST /investigations/{id}/request-evidence]
        distinguishing_aspect: |
          CYCLIC shape: HighBillInvestigation visits EVIDENCE_REQUESTED three separate times over
          one lifetime by two DIFFERENT back-edges — a repair-proof rejection (EVIDENCE_UNDER_REVIEW
          back to EVIDENCE_REQUESTED) and a board REMAND (APPEALED back to EVIDENCE_REQUESTED,
          jumping backwards over four intervening states). The loop is bounded, not free: the
          counter reaches MAX_EVIDENCE_ROUNDS 3 and the next request-evidence is refused
          ERR_EVIDENCE_ROUND_LIMIT even though EVIDENCE_REQUESTED is otherwise a legal source
          state for that trigger, and remand_count 1 has reached REMAND_MAX.
        test_recipe:
