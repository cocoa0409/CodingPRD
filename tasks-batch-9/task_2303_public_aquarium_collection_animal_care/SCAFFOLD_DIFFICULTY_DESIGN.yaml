  - name: nonlinear_specimen_two_dimensions_advance_independently
    grounds:
    - §1.2 Specimen dimension disposition_status (CLEARED -> ON_EXHIBIT -> CLEARED)
    - §1.2 Specimen dimension health_status (HEALTHY -> UNDER_TREATMENT)
    - §1.1 Specimen.disposition_status / health_status / treatment_withdrawal_until / exhibit_id
    - §1.3 treatment_withdrawal_window, §1.3 exhibit_bioload_ledger
    - §1.5 POST /aquarium/veterinary-cases, POST /aquarium/specimens/{id}/exhibit-removals
