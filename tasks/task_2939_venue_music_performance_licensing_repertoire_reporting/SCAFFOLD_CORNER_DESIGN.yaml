          assert:
            - "The captured ${sched_min} was 30000, the declared default floor"
            - "License.${lic3_id}.annual_fee_cents == 1500: TIER_1 base 42000 + 180 * 40 = 7200 gives subtotal 49200, the BACKGROUND_ONLY multiplier 6000 bp scales it to 29520, the floor lifts it to 30000, and 500 bp of 30000 is 1500"
            - "The answer is not 30000 (the floor is not applied after apportionment) and not 1476 (500 bp of the unclamped 29520)"
            - "License.${lic3_id}.license_type == BLANKET, because the BACKGROUND_ONLY row of the decision table precedes the request hint and bgm_exemption_status is still NOT_ANALYZED"
            - "Venue.${v3_id}.outstanding_balance_cents == 1500 and its INITIAL FeeAssessment carries amount_cents == 1500"
