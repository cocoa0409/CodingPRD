            - "Market US_CORE with total_population 10000000, channel A_SEARCH, geo cells GC01 (100000) and GC02 (100000), and an OPEN window W1 [2026-08-03, 2026-08-31) WEEKLY with expected_period_count 4 and all counters at 0."
