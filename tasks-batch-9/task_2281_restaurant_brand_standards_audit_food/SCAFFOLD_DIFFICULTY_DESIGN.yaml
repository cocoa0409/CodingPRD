  - rule_id: combinatorial_formula
    instances:
      - name: per_item_rounding_order_pinned_and_flips_the_grade
        grounds:
          - calculations.visit_section_percent
          - calculations.visit_rubric_percent
          - calculations.visit_composite_score
          - calculations.visit_grade
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. FACILITY holds 10/12 and 8/8: rounding
          per item first gives (83.33 + 100.00)/2 = 91.67 while summing first gives 18/20 = 90.00;
          FOOD_SAFETY likewise gives 95.00 versus 94.00. The pinned per-item order produces
          composite 90.70 / PASS, the forbidden order produces 89.80 / CONDITIONAL.
        test_recipe:
          setup:
            - "Brand SKWR, PUBLISHED six-item rubric, CERTIFIED auditor, location SKWR-014"
            - "Visit V1 IN_PROGRESS with all six items scored FS-1 27, FS-2 20, BS-1 12, BS-2 15, FC-1 10, FC-2 8"
            - "Logical clock at 2026-08-05T09:00:00Z"
