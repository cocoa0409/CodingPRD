              as_user_id: "admin-1"
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "ONLINE", expected_gate_version: "${g1_v}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id }
            - call: "GET /tickets/${t_ada_id}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { bc_ada: $.data.current_barcode }
          trigger:
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc_ada}", device_fingerprint: "DEV-BORROWED", direction: "IN", dedupe_key: "S1-ONLINE-001" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { err_mismatch: $.data.error_id }
            - call: "GET /scan-events?ticket_id=${t_ada_id}"
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { se_result: "$.data[0].result", se_reason: "$.data[0].denied_reason_code" }
            - call: "GET /denied-entry-incidents?ticket_id=${t_ada_id}"
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { inc_id: "$.data[0].id", inc_cat: "$.data[0].category" }
          assert:
            - "${cap_seen} == 14500 — the listing was created exactly at the VENUE_POLICY cap"
            - "${err_mismatch} == ERR_DEVICE_MISMATCH with HTTP 422"
            - "Hop 1: ${se_result} == DENIED_DEVICE_MISMATCH and ${se_reason} == ERR_DEVICE_MISMATCH — the ScanEvent is persisted even though the call returned 422"
            - "Hop 2: ${inc_cat} == DEVICE_MISMATCH and DeniedEntryIncident.${inc_id}.status == OPEN with patron_id == ${p_ada_id}"
            - "Hop 3: Patron.${p_ada_id}.strike_count == 1, fraud_risk_score == 45, fraud_risk_basis == PROVISIONAL"
            - "Hop 4: ResaleListing.${lst_id}.status == SUSPENDED — reached only because 45 >= FRAUD_BLOCK_THRESHOLD 40"
            - "Hop 5: Ticket.${t_ada_id}.lifecycle_status == ISSUED — the suspension released the LISTED hold"
            - "Ticket.${t_ada_id}.admission_status == DENIED_FLAGGED and admitted_scan_count == 0"
            - "Event.${ev_id}.live_occupancy == 0 and AccessZone.${z_ga_id}.occupancy_count == 0 — a denial never admits"
            - "Gate.${g1_id}.admitted_scan_count == 0 and ScanSession.${s1_id}.online_scan_count == 1"

      - name: credential_approval_cascade_freezes_zone_and_blocks_the_next_submit
        grounds:
          - state_machines.CredentialRequest.SUBMITTED_to_APPROVED
          - calculations.credential_forgone_revenue
          - calculations.zone_posture
          - validations[priority=16]
          - entities.AccessZone.fields.issued_entitlement_count
          - entities.Event.fields.entitlements_outstanding
        distinguishing_aspect: |
          Approving one request runs a four-hop chain: 4 credential Tickets auto-issued →
          AccessZone.issued_entitlement_count 0 → 4 and comp_forgone_cents 0 → 5252 →
          issued ratio 4/4 == 1.00 >= FROZEN_RATIO so posture becomes FROZEN (skipping
          RESTRICTED entirely) → the *next* request's submit is refused with
          ERR_ZONE_FROZEN. The final hop is a validation outcome on a different entity,
          so an implementation that recomputes posture lazily on read passes hops 1-3 and
          still fails hop 4.
        test_recipe:
          setup:
            - "Event ON_SALE; AccessZone BOH with required_entitlement_level BACK_OF_HOUSE, fire_code_capacity 4, credential_capacity 8, face_value_reference_cents 8750, comp_discount_pct 0.85 (posture OPEN, issued_entitlement_count 0)."
            - "Two verified patrons: Ada (crew chief) and Ben (runner)."
            - "CR1: CREDENTIAL, quantity 4, window 2026-09-12T18:00:00Z → 2026-09-12T23:00:00Z, recipient Ada, already SUBMITTED."
            - "CR2: CREDENTIAL, quantity 1, same window, recipient Ben, still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "VENUE_POLICY"
                transfer_limit_per_ticket: 2
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload:
                zone_code: "BOH"
                required_entitlement_level: "BACK_OF_HOUSE"
                fire_code_capacity: 4
                face_value_reference_cents: 8750
                credential_capacity: 8
                comp_discount_pct: 0.85
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_boh_id: $.data.id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /patrons"
              payload: { email: "ben@example.com", display_name: "Ben Hall" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ben_id: $.data.id }
            - call: "POST /patrons/${p_ben_id}/verify-identity"
              payload: { document_reference: "DL-BEN-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /credential-requests"
              payload:
                event_id: "${ev_id}"
                access_zone_id: "${z_boh_id}"
                recipient_patron_id: "${p_ada_id}"
                distribution_type: "CREDENTIAL"
                quantity: 4
                valid_from: "2026-09-12T18:00:00Z"
                valid_until: "2026-09-12T23:00:00Z"
                justification: "Stage crew back-of-house passes"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { cr1_id: $.data.id }
            - call: "POST /credential-requests/${cr1_id}/submit"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /credential-requests"
              payload:
                event_id: "${ev_id}"
                access_zone_id: "${z_boh_id}"
                recipient_patron_id: "${p_ben_id}"
                distribution_type: "CREDENTIAL"
                quantity: 1
                valid_from: "2026-09-12T18:00:00Z"
                valid_until: "2026-09-12T23:00:00Z"
                justification: "Late-added runner pass"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { cr2_id: $.data.id }
          trigger:
            - call: "POST /credential-requests/${cr1_id}/approve"
              payload: { note: "Approved by ticketing" }
              as: TicketingApprover
              as_user_id: "appr-1"
              captures: { cr1_issued: $.data.issued_ticket_count, cr1_forgone: $.data.forgone_revenue_cents }
            - call: "GET /access-zones/${z_boh_id}"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_posture: $.data.posture, z_issued: $.data.issued_entitlement_count, z_forgone: $.data.comp_forgone_cents }
            - call: "GET /tickets?credential_request_id=${cr1_id}"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ct_total: $.meta.total_count, ct1_type: "$.data[0].ticket_type", ct1_face: "$.data[0].face_value_cents", ct1_bind: "$.data[0].device_binding_status" }
            - call: "POST /credential-requests/${cr2_id}/submit"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { err_frozen: $.data.error_id }
          assert:
            - "Hop 1: ${cr1_issued} == 4 and ${ct_total} == 4; ${ct1_type} == CREDENTIAL, ${ct1_face} == 0, ${ct1_bind} == UNBOUND, every issued ticket has lifecycle_status == ISSUED and admission_status == NOT_ADMITTED"
            - "Hop 2: ${z_issued} == 4 and ${z_forgone} == 5252 and ${cr1_forgone} == 5252 (per-ticket round_half_up(8750 * 0.85) == 1313, then 1313 * 4)"
            - "Hop 3: ${z_posture} == FROZEN — the ratio jumped straight from 0.00 to 1.00, so RESTRICTED was never entered"
            - "Hop 4: ${err_frozen} == ERR_ZONE_FROZEN with HTTP 409 and CredentialRequest.${cr2_id}.status is still DRAFT with revision_count == 0"
            - "Event.${ev_id}.entitlements_outstanding == 4 and Event.${ev_id}.settlement_pool_cents == 0 — comp tickets add no cash"
            - "CredentialRequest.${cr1_id}.status == APPROVED with approved_by_user_id == appr-1 and requested_by_user_id == boa-1"
            - "GET /events/${ev_id}/audit-log-entries?subject_type=CredentialRequest returns an entry with action == CREDENTIAL_REQUEST_APPROVED and actor_role == TicketingApprover"

      - name: ticket_void_cascade_reverses_listing_zone_and_settlement_pool
        grounds:
          - state_machines.Ticket.ISSUED_to_VOIDED
          - state_machines.Ticket.LISTED_to_VOIDED
          - state_machines.ResaleListing.LISTED_to_SUSPENDED
          - entities.Event.fields.settlement_pool_cents
          - entities.Event.fields.entitlements_outstanding
          - entities.AccessZone.fields.issued_entitlement_count
          - entities.Patron.fields.remediation_credit_cents
        distinguishing_aspect: |
          A void with refund_to_holder true fans out to four different entities in one
          call: the live ResaleListing is SUSPENDED, the zone's issued_entitlement_count
          and the event's entitlements_outstanding are both decremented, and 12000 cents
          move out of Event.settlement_pool_cents into Patron.remediation_credit_cents.
          The refund leg is conditional on the flag, and the counter decrements are not —
          so an implementation that treats refund_to_holder as governing the whole cascade
          gets the counters wrong.
        test_recipe:
          setup:
            - "Event ON_SALE, price_cap_regime VENUE_POLICY; AccessZone GA1 (fire_code_capacity 200, credential_capacity 4); no gates needed."
            - "Ada verified, holding a PAID 12000-cent ticket bound to DEV-ADA and listed on VERIFIED_PRIMARY at 14500 cents (lifecycle_status LISTED)."
            - "Before the trigger: Event.settlement_pool_cents == 12000, entitlements_outstanding == 1, AccessZone.issued_entitlement_count == 1, Patron.remediation_credit_cents == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "VENUE_POLICY"
                transfer_limit_per_ticket: 2
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload:
                zone_code: "GA1"
                required_entitlement_level: "GA"
                fire_code_capacity: 200
                face_value_reference_cents: 8750
                credential_capacity: 4
                comp_discount_pct: 0.85
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_ga_id: $.data.id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_ga_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_ada_id: $.data.id }
            - call: "POST /tickets/${t_ada_id}/device-binding"
              payload: { device_fingerprint: "DEV-ADA" }
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "GET /tickets/${t_ada_id}"
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { t_bound_v: $.data.version }
            - call: "POST /resale-listings"
              payload: { ticket_id: "${t_ada_id}", ask_price_cents: 14500, marketplace: "VERIFIED_PRIMARY", expected_ticket_version: "${t_bound_v}" }
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { lst_id: $.data.id }
            - call: "GET /events/${ev_id}"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { pool_before: $.data.settlement_pool_cents, outstanding_before: $.data.entitlements_outstanding }
          trigger:
            - call: "POST /tickets/${t_ada_id}/void"
              payload: { reason: "Chargeback on the original purchase", refund_to_holder: true }
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { life_after: $.data.lifecycle_status, adm_after: $.data.admission_status }
          assert:
            - "${pool_before} == 12000 and ${outstanding_before} == 1"
            - "${life_after} == VOIDED and ${adm_after} == NOT_ADMITTED — voiding does not touch the admission dimension"
            - "Hop 1: ResaleListing.${lst_id}.status == SUSPENDED and buyer_patron_id == null"
            - "Hop 2: AccessZone.${z_ga_id}.issued_entitlement_count == 0 and posture == OPEN"
            - "Hop 2: Event.${ev_id}.entitlements_outstanding == 0"
            - "Hop 3: Event.${ev_id}.settlement_pool_cents == 0 and Patron.${p_ada_id}.remediation_credit_cents == 12000 — 12000 cents moved, the pool plus the credit is still 12000"
            - "Ticket.${t_ada_id}.device_binding_status is unchanged at BOUND with bound_device_fingerprint == DEV-ADA"
            - "GET /events/${ev_id}/audit-log-entries?subject_type=Ticket returns an entry with action == TICKET_VOIDED and actor_role == SecurityInvestigator"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict
  # Three different category pairs. Each instance also fires the LOWER-priority rule
  # on its own in a control call, so the test cannot pass by simply never
  # implementing the loser.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: voided_ticket_outranks_zone_capacity_full
        grounds:
          - validations[priority=10]
          - validations[priority=26]
          - errors.ERR_TICKET_VOIDED
          - errors.ERR_ZONE_CAPACITY_FULL
        distinguishing_aspect: |
          state (priority 10) versus business_safety (priority 26). A VOIDED ticket is
          presented at a gate whose zone is already at fire_code_capacity, so both rules
          are violated by one request; the answer must be ERR_TICKET_VOIDED (409), not
          ERR_ZONE_CAPACITY_FULL (409). Both carry HTTP 409, so the http status cannot
          disambiguate — only error_id can. A control scan with a healthy ticket proves
          priority 26 is genuinely implemented.
        test_recipe:
          setup:
            - "Event DOORS_OPEN with fire_code_capacity 200; AccessZone GA1 with fire_code_capacity 1; Gate G1 on GA1; ONLINE ScanSession open; clock at 2026-09-12T18:10:00Z."
            - "Ada verified with a PAID ticket bound to DEV-ADA, already scanned IN, so AccessZone.occupancy_count == 1 == fire_code_capacity."
            - "Ben verified with a PAID ticket bound to DEV-BEN whose barcode was captured and which was then VOIDED."
            - "Cyd verified with a PAID ticket bound to DEV-CYD, never voided."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "VENUE_POLICY"
                transfer_limit_per_ticket: 2
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload:
                zone_code: "GA1"
                required_entitlement_level: "GA"
                fire_code_capacity: 1
                face_value_reference_cents: 8750
                credential_capacity: 4
                comp_discount_pct: 0.85
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_ga_id: $.data.id }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_ga_id}", throughput_per_minute: 20, lanes_open: 2 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /patrons"
              payload: { email: "ben@example.com", display_name: "Ben Hall" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ben_id: $.data.id }
            - call: "POST /patrons/${p_ben_id}/verify-identity"
              payload: { document_reference: "DL-BEN-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /patrons"
              payload: { email: "cyd@example.com", display_name: "Cyd Marsh" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_cyd_id: $.data.id }
