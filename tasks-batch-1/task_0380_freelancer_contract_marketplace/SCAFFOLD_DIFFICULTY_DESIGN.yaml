            - call: "GET /milestones/${mpay}/payouts"
              payload: {}
              as: PlatformAdmin
              captures: { fee_val: "$.data[0].platform_fee_cents" }
          assert:
            - "Freelancer.${fl_id}.dispute_loss_count == 3"
            - "Payout for milestone ${mpay}: platform_fee_cents == 25000 (rate clamped to 0.25, not 0.30)"
            - "Payout for milestone ${mpay}: net_cents == 75000"

      - name: combinatorial_hourly_round_per_log_then_sum
        grounds:
          - calculations.hourly_milestone_cap
          - state_machines.TimeLog.LOGGED_to_VERIFIED
          - entities.Milestone.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding order — two VERIFIED 50-min and 55-min logs at rate 5000 cents/hr give
          floor(50/60*5000)=4166 + floor(55/60*5000)=4583 = 8749 (round-per-log), NOT floor(105/60*5000)=8750
          (sum-then-round); the scaffold pins round-per-log so amount_cents == 8749.
        test_recipe:
          setup:
            - "ACTIVE HOURLY contract at agreed rate 5000 cents/hr; one HOURLY milestone with two VERIFIED timelogs of 50 and 55 minutes on the same date."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Delta", email: "delta@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "Dev4", email: "dev4@x.com", skills: ["sql"], tax_id_on_file: true }
              as: PlatformAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /clients/${client_id}/wallet/deposit"
              payload: { amount_cents: 100000 }
              as: PlatformAdmin
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "Hourly", billing_type: "HOURLY", budget_cents: 10000, required_skills: ["sql"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp_id}", freelancer_id: "${fl_id}", bid_amount_cents: 5000, cover_letter: "hourly bid" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /proposals/${prop_id}/accept"
              payload: { actor_role: "CLIENT" }
              as: Client
              as_user_id: "${client_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: { sow_text: "hourly work", hourly_cap_hours: 8 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /contracts/${contract_id}/milestones"
              payload: { title: "Week1", amount_cents: 100, ordinal: 1 }
              as: Client
              as_user_id: "${client_id}"
              captures: { m_id: $.data.id }
            - call: "POST /contracts/${contract_id}/timelogs"
              payload: { milestone_id: "${m_id}", work_date: "2026-03-02", start_minute: 540, end_minute: 590, memo: "log a" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { t1: $.data.id }
            - call: "POST /contracts/${contract_id}/timelogs"
              payload: { milestone_id: "${m_id}", work_date: "2026-03-02", start_minute: 600, end_minute: 655, memo: "log b" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { t2: $.data.id }
            - call: "POST /contracts/${contract_id}/timelogs/${t1}/verify"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /contracts/${contract_id}/timelogs/${t2}/verify"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /contracts/${contract_id}/milestones/${m_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { amt: $.data.amount_cents }
          assert:
            - "Milestone.${m_id}.amount_cents == 8749 (round-per-log: 4166 + 4583), NOT 8750"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_cyclic_counter_rounds
        grounds:
          - state_machines.Proposal.SUBMITTED_to_COUNTERED
          - state_machines.Proposal.COUNTERED_to_COUNTERED
          - entities.Proposal.fields.round_count
          - entities.Proposal.fields.last_actor
        distinguishing_aspect: |
          Proposal exhibits a cycle COUNTERED->COUNTERED: after freelancer submits, client counters
          (round_count 1, last_actor CLIENT), freelancer counters (round_count 2, last_actor FREELANCER),
          a distinct entity from the Milestone branching machine in the sibling instance.
        test_recipe:
          setup:
            - "An OPEN posting with a SUBMITTED proposal (last_actor FREELANCER)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Eps", email: "eps@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /freelancers"
              payload: { display_name: "Dev5", email: "dev5@x.com", skills: ["ui"], tax_id_on_file: false }
              as: PlatformAdmin
              captures: { fl_id: $.data.id }
            - call: "POST /job-postings"
              payload: { client_id: "${client_id}", title: "Design", billing_type: "FIXED", budget_cents: 50000, required_skills: ["ui"] }
              as: Client
              as_user_id: "${client_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /proposals"
              payload: { job_posting_id: "${jp_id}", freelancer_id: "${fl_id}", bid_amount_cents: 60000, cover_letter: "bid" }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /proposals/${prop_id}/counter"
              payload: { actor_role: "CLIENT", bid_amount_cents: 45000 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /proposals/${prop_id}/counter"
              payload: { actor_role: "FREELANCER", bid_amount_cents: 52000 }
              as: Freelancer
              as_user_id: "${fl_id}"
              captures: { rc: $.data.round_count }
          assert:
            - "Proposal.${prop_id}.status == COUNTERED"
            - "Proposal.${prop_id}.round_count == 2"
            - "Proposal.${prop_id}.last_actor == FREELANCER"
            - "Proposal.${prop_id}.bid_amount_cents == 52000"

      - name: milestone_branching_fork_approve_vs_dispute
        grounds:
          - state_machines.Milestone.SUBMITTED_to_APPROVED
          - state_machines.Milestone.SUBMITTED_to_DISPUTED
          - entities.Milestone.fields.status
        distinguishing_aspect: |
          Milestone forks from SUBMITTED into APPROVED (no side effects) versus DISPUTED (creates a
          Dispute and increments Contract.open_dispute_count) — divergent side-effect sets per branch on
          a different entity than Proposal's cycle.
        test_recipe:
          setup:
            - "Two FUNDED-then-SUBMITTED milestones on one ACTIVE FIXED contract."
          setup_api_calls:
            - call: "POST /clients"
