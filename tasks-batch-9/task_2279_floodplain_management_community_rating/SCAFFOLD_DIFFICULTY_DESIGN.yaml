      - name: certificate_deficiency_amend_loop_then_accepted_at_zero_margin
        grounds:
          - state_machines.ElevationCertificate.SUBMITTED_to_DEFICIENT
          - state_machines.ElevationCertificate.DEFICIENT_to_SUBMITTED
          - state_machines.ElevationCertificate.SUBMITTED_to_ACCEPTED
          - calculations.certificate_datum_normalization
        distinguishing_aspect: |
          The certificate loops SUBMITTED -> DEFICIENT -> SUBMITTED before being accepted, and
          the amendment changes the datum from NGVD29 (normalized 12.8, margin -0.7) to NAVD88
          (normalized 13.5, margin 0.0), so re-entering SUBMITTED recomputes the derived
          fields rather than preserving them.
        test_recipe:
          setup:
            - "Community freeboard_ft 1.5, EFFECTIVE AE panel BFE 12.0, one RESIDENTIAL structure, permit ISSUED with required_lowest_floor_elevation_ft 13.5."
            - "A FINISHED_CONSTRUCTION certificate filed in NGVD29 at 13.60 ft, reviewed DEFICIENT."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0041", mapped_area_code: "RLA-1", owner_name: "G Owner", owner_email: "g@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 2024, market_value_usd: 275000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "NEW_CONSTRUCTION", declared_project_cost_usd: 180000.00, proposed_lowest_floor_elevation_ft: 20.0 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /floodplain/permits/${permit_id}/submit"
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /floodplain/permits/${permit_id}/review"
              payload: { decision: "APPROVE" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/permits/${permit_id}/issue"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/elevation-certificates"
              payload: { permit_id: "${permit_id}", structure_id: "${struct_id}", certificate_type: "FINISHED_CONSTRUCTION", datum: "NGVD29", measured_lowest_floor_ft: 13.60, measured_bfe_ft: 12.00, surveyor_license_no: "TX-RPLS-4471" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /floodplain/elevation-certificates/${cert_id}/review"
              payload: { decision: "DEFICIENT", deficiency_codes: ["DATUM_MISMATCH", "SECTION_C_INCOMPLETE"] }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/elevation-certificates/${cert_id}/amend"
              payload: { datum: "NAVD88", measured_lowest_floor_ft: 13.50, measured_bfe_ft: 12.00, surveyor_license_no: "TX-RPLS-4471" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
          trigger:
            - call: "POST /floodplain/elevation-certificates/${cert_id}/review"
              payload: { decision: "ACCEPT" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "ElevationCertificate.${cert_id}.status == ACCEPTED"
            - "ElevationCertificate.${cert_id}.datum == NAVD88"
            - "ElevationCertificate.${cert_id}.normalized_lowest_floor_ft == 13.5"
            - "ElevationCertificate.${cert_id}.freeboard_margin_ft == 0.0"
            - "ElevationCertificate.${cert_id}.deficiency_codes == []"
            - "Structure.${struct_id}.lowest_floor_elevation_ft == 13.5"
            - "Structure.${struct_id}.compliance_status == COMPLIANT"

