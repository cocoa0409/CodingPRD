- section: errors
  instances:
  - name: study_create_with_missing_x_user_header_returns_unauthenticated
    claim_type: violation_to_error
    grounds:
    - validations[priority=10]
    - errors[ERR_UNAUTHENTICATED]
    - roles.identity_headers
    - response_envelope.error
    distinguishing_aspect: 'Identity is checked before anything else: a body that would otherwise create a perfectly valid study is refused with 401 because the X-User-ID header is absent, and the response still carries the standard error envelope with meta.api_request_id and data.error_id. A server that only inspected X-Role would accept this call.'
    test_recipe:
      setup:
      - The database is empty and the logical clock is at its 2026-08-01T00:00:00Z default.
      - The request carries the X-Role header DistrictPlanner - which IS authorized for this endpoint - but no X-User-ID header at all, so only the identity rule at priority 10 is violated.
      setup_api_calls: []
      trigger:
      - call: POST /redistricting/studies
        payload:
          name: Headerless Study
          district_name: Nowhere USD
          target_school_year: 2030
          horizon_years: 5
          capacity_target_low_pct: 85.0
          capacity_target_high_pct: 100.0
          required_program_types: []
        as: DistrictPlanner
      assert:
      - The call returns HTTP 401 with error_id == ERR_UNAUTHENTICATED
      - The response envelope has response_type == error and data carries both error_id and message
      - The response meta carries api_request_id and api_request_timestamp
      - GET /redistricting/studies with a complete header pair returns total_count == 0 - nothing was created
  - name: self_adjacency_and_reverse_duplicate_adjacency_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=57]
    - validations[priority=62]
    - errors[ERR_SELF_ADJACENCY]
    - errors[ERR_DUPLICATE_ADJACENCY]
    - endpoints[POST /redistricting/area-adjacencies]
    - entities.AreaAdjacency.fields.is_reciprocal
    distinguishing_aspect: 'The adjacency junction enforces two different rules on the same body shape: an area adjacent to itself is refused at priority 57, and the unordered pair is unique so re-posting A-02 to A-01 collides with the mirror row that the A-01 to A-02 create already minted. The second case is the interesting one - the conflict is with a SERVER-generated row, not with the client''s own insert.'
    test_recipe:
