              payload: {}
              as: SystemDesigner
              as_user_id: "${d1}"
              captures: { db_flow: $.data.design_daily_flow_gpd, db_area: $.data.required_absorption_area_sqft, db_tank: $.data.tank_capacity_gal, db_reserve: $.data.reserve_area_sqft }
