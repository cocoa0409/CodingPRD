      - name: deal_resume_from_draft_returns_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.ManufacturerDeal.SUSPENDED_to_ACTIVE
          - validations[priority=11].ERR_INVALID_STATE
        distinguishing_aspect: |
          resume is declared ONLY from SUSPENDED. From DRAFT the correct verb is
          activate, so resume must 409 rather than quietly behaving like
          activate — and the failed attempt must not bump the deal's version,
          which is an OCC parent for rate-card writes.
        test_recipe:
          setup:
            - "Deal PBC-2026 exists in DRAFT with one ACTIVE item and one APPROVED card, so it is activatable."
          setup_api_calls:
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id, deal_v: $.data.version }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-01-01", effective_to: "2028-12-31" }
              as: GpoAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/approve"
              as: GpoAdmin
          trigger:
            - call: "POST /manufacturer-deals/${deal_id}/resume"
              as: GpoAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /manufacturer-deals/${deal_id}/suspend"
              as: GpoAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /manufacturer-deals/${deal_id}/activate"
              as: GpoAdmin
          assert:
            - "${e1} == ERR_INVALID_STATE with 409 — resume is not declared from DRAFT"
            - "${e2} == ERR_INVALID_STATE with 409 — suspend is not declared from DRAFT either"
            - "ManufacturerDeal.${deal_id}.version is still ${deal_v} after both rejections: a rejected transition performs no write"
            - "the activate then returns 200 with status == ACTIVE, contracted_item_count == 1 and version == ${deal_v} + 1"
            - "resume on the now-ACTIVE deal still returns 409 ERR_INVALID_STATE"

