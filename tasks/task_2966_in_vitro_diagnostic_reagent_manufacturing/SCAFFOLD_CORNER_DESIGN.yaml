      - name: material_lot_disposition_from_received_returns_material_lot_state_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.MaterialLot.transitions
          - errors.ERR_MATERIAL_LOT_STATE_INVALID
        distinguishing_aspect: "RECEIVED has exactly one outbound trigger — recording an acceptance test — so all three disposition decisions must 409 from RECEIVED. This is the state that tempts an implementation to allow a shortcut QUALIFY on an untested lot."
        test_recipe:
          setup:
            - "One MaterialSpecification AB-SM-10 with required_test_codes [POTENCY, PURITY] and one MaterialLot in qualification_status RECEIVED with no TestResult at all."
          setup_api_calls:
            - call: "POST /material-specifications"
              payload: { material_code: "AB-SM-10", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY", "PURITY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-SM-10", received_quantity_units: 100.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id, ml_v: $.data.version }
          trigger:
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { err_qualify: $.data.error_id }
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "REJECT", reason: "vendor paperwork" }
