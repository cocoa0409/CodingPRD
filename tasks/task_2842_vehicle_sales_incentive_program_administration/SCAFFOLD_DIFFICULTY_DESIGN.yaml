            - call: "GET /incentives/programs/${prog_id}/spend-summary"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { committed_post: $.data.committed_cents, units_post: $.data.claimed_units, spend_post: $.data.per_unit_spend_cents, accrued_post: $.data.accrued_budget_cents }
          assert:
            - "${obj_units} == 4 and ${achieved_at_start} == 0 and ${att_at_start} == 0 and ${tier_at_start} == 0 and ${payout_at_start} == 0"
            - "${achieved_pre} == 2, ${att_pre} == 5000 (floor(2 * 10000 / 4)), ${tier_pre} == 1 (threshold_bps 5000 is INCLUSIVE) and ${payout_pre} == 30000 (band 1 spans units 2..3, so min(2,3) - 2 + 1 == 1 band unit)"
            - "${u3_status} == VALIDATED and ${achieved_mid} == 3, ${att_mid} == 7500, ${tier_mid} == 1 and ${payout_mid} == 60000 — the third unit stays inside band 1 and DOUBLES the payout, so the crossing is observable"
            - "${u3_status_after} == UNWOUND"
            - "${achieved_post} == 2 == ${achieved_pre} — exact restoration of the conserved unit count"
            - "${att_post} == 5000 == ${att_pre}, ${tier_post} == 1 == ${tier_pre} and ${payout_post} == 30000 == ${payout_pre} — all three DERIVED values are recomputed, not left stale at the post-validation figures"
            - "${obj_status_post} == PROPOSED and ${paid_payout_post} == 0 — no state transition and no chargeback happened, because the unwound delivery carried no claim"
            - "${committed_post} == 0 and ${units_post} == 0 and ${spend_post} == 0 and ${accrued_post} == 0 — with no Claim on any of the three deliveries the money ledgers never moved, which isolates the units invariant from the money invariant of instance 1"
            - "unwinding u1 as well would take achieved_units to 1, attainment_bps to 2500, tier_attained to 0 and payout_cents to 0, confirming the invariant holds below the first threshold too"
