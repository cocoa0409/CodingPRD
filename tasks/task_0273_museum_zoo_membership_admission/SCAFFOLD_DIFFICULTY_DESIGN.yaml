      - name: patron_exhibit_sessions_within_buffer_rejected
        grounds:
          - validations[priority=13]
          - entities.SpecialExhibit.fields.buffer_minutes
          - entities.ExhibitSession.fields.starts_at
          - entities.ExhibitSession.fields.ends_at
        distinguishing_aspect: |
          Distinct interval semantics from the slot rule (Rule 8): buffered closed interval on the
          ExhibitSession resource — two of the patron's booked sessions on the same exhibit must be
          separated by buffer_minutes; sessions that are merely adjacent (gap < buffer) are rejected
          with ERR_EXHIBIT_BUFFER_CONFLICT, whereas the slot rule allows exact adjacency.
