            - "The decide call returns HTTP 200 with NominationSlate.${slate_id}.status == \"APPROVED\" and no \"ERR_APPROVAL_THRESHOLD_NOT_MET\""

      - name: comp_award_offset_tier_ceiling_is_inclusive_at_thirty_million_cents
        claim_type: constants_applied
        grounds:
          - calculations.director_compensation_award
          - calculations.director_compensation_award.constants.OFFSET_TIER1_CEILING_CENTS
          - endpoints.POST_/governance/directors/{director_id}/comp-awards
        distinguishing_aspect: |
          The declared constants are used exactly as written: DAYS_PER_YEAR 365 makes a full 2026 year
          prorate to the whole retainer, and the OFFSET_TIER1_CEILING_CENTS comparison is <=, so a
          pre_offset_total_cents of exactly 30000000 draws excess_offset_pct 0.0 while 30000100 - one
          hundred cents above the same ceiling - draws 2.5 and an offset of round_half_up(750002.5) ==
          750003. An implementation using < at the ceiling charges the first director an offset it does
          not owe.
        test_recipe:
          setup:
            - "GovernancePolicy A effective 2026-01-01 with annual_cash_retainer_cents 10000000 and equity_grant_value_cents 20000000, then GovernancePolicy B effective 2026-02-01 with annual_cash_retainer_cents 10000100 and equity_grant_value_cents 20000000."
            - "Two SEATED directors appointed 2019-01-01, neither holding any committee seat."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z", annual_cash_retainer_cents: 10000000, equity_grant_value_cents: 20000000 }
              as: CorporateSecretary
              captures: { policy_a_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Cap Exact", email: "capexact@issuer.example", birth_date: "1968-01-01", appointed_on: "2019-01-01", initial_service_status: "SEATED", shares_held: 600 }
              as: CorporateSecretary
              captures: { dir_at_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Cap Over", email: "capover@issuer.example", birth_date: "1969-01-01", appointed_on: "2019-01-01", initial_service_status: "SEATED", shares_held: 600 }
              as: CorporateSecretary
              captures: { dir_over_id: $.data.id }
          trigger:
            - call: "POST /governance/directors/${dir_at_id}/comp-awards"
              payload: { cycle_year: 2026, service_start_on: "2026-01-01", service_end_on: "2026-12-31", share_price_cents: 90000, shares_held: 600 }
              as: CorporateSecretary
              captures: { award_at_id: $.data.id }
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-02-01T00:00:00Z", annual_cash_retainer_cents: 10000100, equity_grant_value_cents: 20000000 }
              as: CorporateSecretary
              captures: { policy_b_id: $.data.id }
            - call: "POST /governance/directors/${dir_over_id}/comp-awards"
              payload: { cycle_year: 2026, service_start_on: "2026-01-01", service_end_on: "2026-12-31", share_price_cents: 90000, shares_held: 600 }
              as: CorporateSecretary
              captures: { award_over_id: $.data.id }
          assert:
            - "DirectorCompensationAward.${award_at_id}.service_days == 365 and prorated_cash_retainer_cents == 10000000"
            - "DirectorCompensationAward.${award_at_id}.committee_fees_cents == 0 and equity_value_cents == 20000000"
            - "DirectorCompensationAward.${award_at_id}.pre_offset_total_cents == 30000000, excess_offset_pct == 0.0, excess_offset_cents == 0, total_cents == 30000000"
            - "DirectorCompensationAward.${award_at_id}.ownership_requirement_cents == 50000000, ownership_actual_cents == 54000000, ownership_compliant == true"
            - "DirectorCompensationAward.${award_over_id}.prorated_cash_retainer_cents == 10000100 and pre_offset_total_cents == 30000100"
            - "DirectorCompensationAward.${award_over_id}.excess_offset_pct == 2.5, excess_offset_cents == 750003 and total_cents == 29250097"
            - "DirectorCompensationAward.${award_over_id}.ownership_requirement_cents == 50000500 and ownership_compliant == true"

      - name: comp_award_proration_rounds_half_up_in_both_directions
        claim_type: precision
        grounds:
          - calculations.director_compensation_award
          - calculations.director_compensation_award.precision
          - entities.DirectorCompensationAward.fields.prorated_cash_retainer_cents
        distinguishing_aspect: |
          Proration is round_half_up on the exact quotient, applied once: 300 service days give
          12000000 * 300 / 365 == 9863013.6986 which must round UP to 9863014, while 200 service days give
          6575342.4657 which must round DOWN to 6575342. Truncation produces 9863013 for the first award
          and would leave the ownership requirement one cent low.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with all compensation defaults (annual_cash_retainer_cents 12000000, equity_grant_value_cents 20000000, ownership_multiple 5.0)."
            - "Two SEATED directors appointed 2019-01-01 with no committee seats."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Round Up", email: "roundup@issuer.example", birth_date: "1968-01-01", appointed_on: "2019-01-01", initial_service_status: "SEATED", shares_held: 550 }
              as: CorporateSecretary
              captures: { up_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Round Down", email: "rounddown@issuer.example", birth_date: "1969-01-01", appointed_on: "2019-01-01", initial_service_status: "SEATED", shares_held: 400 }
              as: CorporateSecretary
              captures: { down_id: $.data.id }
          trigger:
            - call: "POST /governance/directors/${up_id}/comp-awards"
              payload: { cycle_year: 2026, service_start_on: "2026-01-01", service_end_on: "2026-10-27", share_price_cents: 90000, shares_held: 550 }
              as: CorporateSecretary
              captures: { award_up_id: $.data.id }
            - call: "POST /governance/directors/${down_id}/comp-awards"
              payload: { cycle_year: 2026, service_start_on: "2026-01-01", service_end_on: "2026-07-19", share_price_cents: 90000, shares_held: 400 }
              as: CorporateSecretary
              captures: { award_down_id: $.data.id }
          assert:
            - "DirectorCompensationAward.${award_up_id}.service_days == 300 and prorated_cash_retainer_cents == 9863014 (not 9863013)"
            - "DirectorCompensationAward.${award_up_id}.pre_offset_total_cents == 29863014, excess_offset_pct == 0.0 and total_cents == 29863014"
            - "DirectorCompensationAward.${award_up_id}.ownership_requirement_cents == 49315070, ownership_actual_cents == 49500000, ownership_compliant == true"
            - "DirectorCompensationAward.${award_down_id}.service_days == 200 and prorated_cash_retainer_cents == 6575342 (not 6575343)"
            - "DirectorCompensationAward.${award_down_id}.pre_offset_total_cents == 26575342 and total_cents == 26575342"
            - "DirectorCompensationAward.${award_down_id}.ownership_requirement_cents == 32876710, ownership_actual_cents == 36000000, ownership_compliant == true"

      - name: gap_analysis_omitted_variant_parameter_defaults_to_self_reported
