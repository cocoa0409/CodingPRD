              captures: { p_ice: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 10", promoter_name: "Lakeside Hockey Promotions", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { bk: $.data.id }
            - call: "POST /event-bookings/${bk}/hold"
              payload: {}
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /event-bookings/${bk}/confirm"
              payload: { expected_venue_version: "${v1}" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { e1: $.data.error_id }
            - call: "POST /changeover-orders"
              payload: { from_booking_id: "${bk}", to_booking_id: "${bk}", crew_headcount: 40, expected_venue_version: "${v1}" }
              as: BookingManager
              captures: { e2: $.data.error_id }
            - call: "POST /changeover-orders/00000000-0000-4000-8000-000000000020/signoff"
              payload: {}
              as: LaborCoordinator
              captures: { e3: $.data.error_id }
            - call: "POST /hold-challenges/00000000-0000-4000-8000-000000000021/rule"
              payload: { decision: "DENIED", ruling_note: "not my ruling to make" }
              as: AnchorTenantRep
              as_user_id: "00000000-0000-4000-8000-000000000022"
              captures: { e4: $.data.error_id }
            - call: "POST /venues"
              payload: { name: "Unauthorised Arena", rigging_capacity_kg: 10000, dock_count: 2, max_bowl_seats: 9000, crew_headcount_cap: 20 }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { e5: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: BookingManager
              captures: { e6: $.data.error_id }
          assert:
            - "all six trigger calls return HTTP 403 with e1 == e2 == e3 == e4 == e5 == e6 == ERR_ROLE_NOT_PERMITTED"
            - "e3 and e4 are ERR_ROLE_NOT_PERMITTED and not ERR_CHANGEOVER_ORDER_NOT_FOUND or ERR_CHALLENGE_NOT_FOUND, although both ids are unknown, because priority 20 precedes priority 40"
            - "EventBooking.${bk}.status is still HELD and Venue.${venue_id}.version == ${v1}"
            - "GET /changeover-orders?venue_id=${venue_id} returns total_count == 0 and only one Venue row exists"
            - "the logical clock is still 2026-08-01T00:00:00Z, the refused clock write having had no effect"

      - name: shared_operations_are_accepted_from_every_role_that_declares_them
        claim_type: role_permitted
        grounds:
          - roles
          - endpoints[POST /event-bookings]
          - endpoints[POST /event-bookings/{id}/hold]
          - endpoints[POST /event-bookings/{id}/dock-slot-reservations]
          - endpoints[POST /dock-slot-reservations/{id}/cancel]
        distinguishing_aspect: "The declared shared operations succeed from both owners: bookings are created and held by BookingManager and by AnchorTenantRep, dock windows are reserved by ChangeoverSupervisor and by LaborCoordinator, and either of those two may cancel the other's reservation."
        test_recipe:
