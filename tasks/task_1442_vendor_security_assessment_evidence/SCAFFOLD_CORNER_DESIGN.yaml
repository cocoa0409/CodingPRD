scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: vendor_create_success_with_derived_tier
        claim_type: creation
        grounds: [entities.Vendor, calculations.tier_assignment, "endpoints[POST /vsa/vendors]"]
        distinguishing_aspect: "Creating a vendor with REGULATED/PRIVILEGED/MISSION_CRITICAL returns 201 with current_tier == TIER_4 computed by rank fallback (3+3+3=9 >= 7), posture ONBOARDING, version 1."
        test_recipe:
          setup: ["Empty DB with one active tier policy"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {}, tier1_reassessment_months: 36, tier2_reassessment_months: 24, tier3_reassessment_months: 12, tier4_reassessment_months: 6 }
              as: PlatformAdmin
          trigger:
            - call: "POST /vsa/vendors"
              payload: { legal_name: "Acme", data_sensitivity: "REGULATED", access_level: "PRIVILEGED", criticality: "MISSION_CRITICAL" }
              as: RiskAnalyst
              captures: { v_id: $.data.id }
          assert:
            - "Vendor.${v_id}.current_tier == TIER_4"
            - "Vendor.${v_id}.posture == ONBOARDING"
            - "Vendor.${v_id}.version == 1"
            - "Vendor.${v_id}.risk_score == 50.0 (ONBOARDING base)"

      - name: vendor_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Vendor.fields.data_sensitivity, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field data_sensitivity returns ERR_INVALID_REQUEST (422); no Vendor row is created."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
          trigger:
            - call: "POST /vsa/vendors"
              payload: { legal_name: "Acme", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /vsa/vendors returns total_count == 0"

      - name: vendor_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vsa/vendors/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: vendor_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /vsa/vendors]"]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["Three vendors exist"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
            - call: "POST /vsa/vendors"
              payload: { legal_name: "A", data_sensitivity: "PUBLIC", access_level: "NONE", criticality: "LOW" }
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "B", data_sensitivity: "PUBLIC", access_level: "NONE", criticality: "LOW" }
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "C", data_sensitivity: "PUBLIC", access_level: "NONE", criticality: "LOW" }
              as: RiskAnalyst
          trigger:
            - call: "GET /vsa/vendors"
              payload: {}
              as: RiskAnalyst
          assert:
            - "response contains pagination fields limit, offset, total_count, has_more"
            - "total_count == 3 with default limit 10 and has_more == false"

      - name: tier_policy_only_one_active
        claim_type: defaults
        grounds: [entities.AssessmentTierPolicy.fields.active, "validations[priority=9]", "errors[ERR_UNIQUENESS_VIOLATION]"]
        distinguishing_aspect: "Creating a second policy with active=true deactivates the first (system-managed uniqueness), so exactly one active policy remains."
        test_recipe:
          setup: ["Policy P1 active"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P2", active: true, tier_matrix: {} }
              as: PlatformAdmin
              captures: { p2_id: $.data.id }
          assert:
            - "AssessmentTierPolicy.${p1_id}.active == false"
            - "AssessmentTierPolicy.${p2_id}.active == true"

      - name: vendor_contact_single_primary_per_vendor
        claim_type: type_constraints
        grounds: [entities.VendorContact.fields.is_primary, "validations[priority=9]"]
        distinguishing_aspect: "Adding a contact with is_primary=true demotes the previous primary; at most one primary exists per vendor."
        test_recipe:
          setup: ["Vendor with primary contact C1"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "PUBLIC", access_level: "NONE", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/contacts"
              payload: { email: "c1@x.com", full_name: "C1", is_primary: true }
              as: RiskAnalyst
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /vsa/vendors/${v_id}/contacts"
              payload: { email: "c2@x.com", full_name: "C2", is_primary: true }
              as: RiskAnalyst
              captures: { c2_id: $.data.id }
          assert:
            - "VendorContact.${c2_id}.is_primary == true"
            - "GET /vsa/vendors/${v_id}/contacts shows exactly one is_primary == true"

      - name: immutable_common_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Vendor]
        distinguishing_aspect: "Client-supplied id, created_at, updated_at, version on create are ignored; server mints them."
        test_recipe:
          setup: ["Active policy"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
          trigger:
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "PUBLIC", access_level: "NONE", criticality: "LOW", version: 99 }
              as: RiskAnalyst
              captures: { v_ver: $.data.version }
          assert:
            - "response version == 1 (client-supplied 99 ignored)"

      - name: reassessment_schedule_immutable_event_log
        claim_type: immutability
        grounds: [entities.ReassessmentSchedule]
        distinguishing_aspect: "ReassessmentSchedule has common_fields: false — rows carry id and created_at only, no version, and no update/delete endpoints exist."
        test_recipe:
          setup: ["Any vendor with at least one schedule row after approval"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "TL", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { tl_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${tl_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${tl_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/issue"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses"
              payload: { submitted_by: "vc@x.com", answers: [ {item_key: "a", answer_value: "YES"} ] }
              as: VendorContact
              captures: { r_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses/${r_id}/submit"
              payload: {}
              as: VendorContact
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/score"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence"
              payload: { kind: "SOC2_TYPE2", period_start: "2025-08-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", issued_by: "AuditCo" }
              as: VendorContact
              captures: { e_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence/${e_id}/start-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence/${e_id}/complete-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence-review/complete"
              payload: {}
              as: RiskAnalyst
          trigger:
            - call: "GET /vsa/vendors/${v_id}/reassessment-schedule"
              payload: {}
              as: RiskAnalyst
          assert:
            - "each row has id and created_at but no version field"
            - "at least one row with kind == TIER_CADENCE exists after approval"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: template_publish_from_published_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.QuestionnaireTemplate, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Publishing an already-PUBLISHED template fails with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["PUBLISHED template"]
          setup_api_calls:
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "T", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${t_id}/publish"
              payload: {}
              as: RiskAnalyst
          trigger:
            - call: "POST /vsa/questionnaire-templates/${t_id}/publish"
              payload: {}
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: template_retire_blocked_while_in_use
        claim_type: precondition_enforcement
        grounds: [state_machines.QuestionnaireTemplate.PUBLISHED_to_RETIRED, "errors[ERR_TEMPLATE_IN_USE]"]
        distinguishing_aspect: "Retire fails with ERR_TEMPLATE_IN_USE (409) while a non-terminal cycle references the template."
        test_recipe:
          setup: ["PUBLISHED template with an ISSUED cycle"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "T", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${t_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${t_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/issue"
              payload: {}
              as: RiskAnalyst
          trigger:
            - call: "POST /vsa/questionnaire-templates/${t_id}/retire"
              payload: {}
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TEMPLATE_IN_USE"

      - name: cycle_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AssessmentCycle]
        distinguishing_aspect: "A REJECTED cycle accepts no further transitions; score on it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Cycle driven to REJECTED"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "T", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${t_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${t_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/issue"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses"
              payload: { submitted_by: "vc@x.com", answers: [ {item_key: "a", answer_value: "YES"} ] }
              as: VendorContact
              captures: { r_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses/${r_id}/submit"
              payload: {}
              as: VendorContact
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/score"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence"
              payload: { kind: "SOC2_TYPE2", period_start: "2025-08-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", issued_by: "AuditCo" }
              as: VendorContact
              captures: { e_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence/${e_id}/start-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence/${e_id}/complete-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/exceptions"
              payload: { source: "EVIDENCE", severity: "LOW", description: "f", evidence_artifact_id: "${e_id}" }
              as: RiskAnalyst
              captures: { x_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence-review/complete"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/exceptions/${x_id}/mark-false-positive"
              payload: { closure_reason: "fp" }
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/remediation/resolve"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/reject"
              payload: {}
              as: SecurityApprover
          trigger:
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/score"
              payload: {}
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "AssessmentCycle.${c_id}.status == REJECTED"

      - name: cycle_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.AssessmentCycle]
        distinguishing_aspect: "Newly created cycle starts in DRAFT with tier_at_issue snapshotted from vendor.current_tier."
        test_recipe:
          setup: ["Vendor TIER_2 (CONFIDENTIAL/READ_ONLY/MEDIUM) and published template"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "T", applies_to_tiers: ["TIER_2"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${t_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "CONFIDENTIAL", access_level: "READ_ONLY", criticality: "MEDIUM" }
              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
          trigger:
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${t_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id, c_status: $.data.status }
          assert:
            - "AssessmentCycle.${c_id}.status == DRAFT"

      - name: offboarding_attestation_reject_creates_fresh_requested
        claim_type: side_effect_execution
        grounds: [state_machines.OffboardingAttestation.SUBMITTED_to_REJECTED]
        distinguishing_aspect: "Rejecting a SUBMITTED attestation creates a new REQUESTED attestation and extends offboarding_deadline by 30 days — the compensation loop is observable."
        test_recipe:
          setup: ["Vendor OFFBOARDING with a SUBMITTED attestation; deadline 2026-10-30"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
            - call: "POST /vsa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/offboard"
              payload: {}
              as: RiskAnalyst
            - call: "GET /vsa/vendors/${v_id}/offboarding-attestations"
              payload: {}
              as: RiskAnalyst
              captures: { at_id: "$.data[0].id" }
            - call: "POST /vsa/vendors/${v_id}/offboarding-attestations/${at_id}/submit"
              payload: { data_returned: true, data_destroyed: true, destruction_method: "crypto-shred", attested_by: "CTO" }
              as: VendorContact
          trigger:
            - call: "POST /vsa/vendors/${v_id}/offboarding-attestations/${at_id}/reject"
              payload: {}
              as: RiskAnalyst
          assert:
            - "OffboardingAttestation.${at_id}.status == REJECTED"
            - "a new OffboardingAttestation with status REQUESTED exists for vendor"
            - "Vendor.${v_id}.offboarding_deadline == 2026-11-29T00:00:00Z (2026-10-30 + 30 days)"

      - name: monitored_alert_escalate_requires_high_or_critical
        claim_type: precondition_enforcement
        grounds: [state_machines.MonitoringAlert.ACKNOWLEDGED_to_ESCALATED, "errors[ERR_ALERT_NOT_ESCALATABLE]"]
        distinguishing_aspect: "Escalating a LOW alert fails with ERR_ALERT_NOT_ESCALATABLE even when the vendor is APPROVED."
        test_recipe:
          setup: ["APPROVED vendor; LOW alert ACKNOWLEDGED"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "T", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${t_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${t_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/issue"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses"
              payload: { submitted_by: "vc@x.com", answers: [ {item_key: "a", answer_value: "YES"} ] }
              as: VendorContact
              captures: { r_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses/${r_id}/submit"
              payload: {}
              as: VendorContact
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/score"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence"
              payload: { kind: "SOC2_TYPE2", period_start: "2025-08-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", issued_by: "AuditCo" }
              as: VendorContact
              captures: { e_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence/${e_id}/start-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence/${e_id}/complete-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence-review/complete"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/monitoring-alerts"
              payload: { signal: "NEGATIVE_NEWS", severity: "LOW", detected_at: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/monitoring-alerts/${a_id}/acknowledge"
              payload: {}
              as: RiskAnalyst
          trigger:
            - call: "POST /vsa/vendors/${v_id}/monitoring-alerts/${a_id}/escalate"
              payload: {}
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALERT_NOT_ESCALATABLE"
            - "MonitoringAlert.${a_id}.status remains ACKNOWLEDGED"

      - name: cycle_auto_expiry_on_clock_sweep
