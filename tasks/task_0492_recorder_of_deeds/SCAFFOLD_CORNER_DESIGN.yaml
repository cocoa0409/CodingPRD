      - name: party_entry_reverse_reachability_get
        claim_type: Computed read
        grounds:
          - endpoints
          - entities.PartyEntry.fields.package_id
        distinguishing_aspect: "GET /packages/{id}/party-entries returns the package's two index entries as an array (FK reverse reachability)."
        test_recipe:
          setup: ["A package with 1 GRANTOR + 1 GRANTEE."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E" }
              as: Submitter
              as_user_id: "${sub_id}"
          trigger:
            - call: "GET /packages/${pkg_id}/party-entries"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
          assert:
            - "response_type == array"
            - "meta.total_count == 2"

      - name: filter_ucc_by_parcel
        claim_type: Computed read
        grounds:
          - endpoints
          - entities.LienUccFiling.fields.parcel_id
        distinguishing_aspect: "GET /ucc-filings?parcel_id=P-3 returns only filings on that parcel (filtered-list FK reverse reachability)."
        test_recipe:
          setup: ["Two UCC filings on different parcels P-3 and P-4."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Lender", submitter_type: "ATTORNEY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /ucc-filings"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", lien_type: "UCC1", parcel_id: "P-3", debtor_name: "D1", effective_date: "2026-01-01T00:00:00Z" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /ucc-filings"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", lien_type: "UCC1", parcel_id: "P-4", debtor_name: "D2", effective_date: "2026-01-01T00:00:00Z" }
              as: Submitter
              as_user_id: "${sub_id}"
          trigger:
            - call: "GET /ucc-filings"
              payload: { parcel_id: "P-3" }
              as: Clerk
          assert:
            - "response_type == array"
            - "meta.total_count == 1"

      - name: ucc_terminate_action
        claim_type: Action endpoint
        grounds:
          - state_machines.LienUccFiling.ACTIVE_to_TERMINATED
        distinguishing_aspect: "POST /ucc-filings/{id}/terminate moves an ACTIVE filing to TERMINATED."
        test_recipe:
          setup: ["An ACTIVE UCC1 filing owned by the submitter."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Lender", submitter_type: "ATTORNEY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /ucc-filings"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", lien_type: "UCC1", parcel_id: "P-5", debtor_name: "D", effective_date: "2026-01-01T00:00:00Z" }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { fil_id: $.data.id }
          trigger:
            - call: "POST /ucc-filings/${fil_id}/terminate"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { st: $.data.status }
          assert:
            - "LienUccFiling.${fil_id}.status == TERMINATED"

  # ===========================================================================
  - section: rbac
    instances:
      - name: submitter_cannot_record
        claim_type: forbidden_operation
        grounds:
          - roles
          - endpoints
        distinguishing_aspect: "A Submitter calling POST /packages/{id}/record (a Recorder-exclusive op) is denied with ERR_FORBIDDEN."
        test_recipe:
          setup: ["A PAID DEED package ready to record."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /offices/${off_id}/deposit-escrow"
              payload: { submitter_id: "${sub_id}", amount_cents: 100000 }
              as: Clerk
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { pkg_v: $.data.version }
            - call: "POST /packages/${pkg_id}/assessments"
              payload: { verified_page_count: 1, verified_consideration_cents: 0, expected_package_version: "${pkg_v}" }
              as: Examiner
              as_user_id: "ex-1"
            - call: "GET /packages/${pkg_id}"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_v2: $.data.version }
            - call: "POST /packages/${pkg_id}/payments"
              payload: { amount_cents: 3500, method: "ESCROW", expected_package_version: "${pkg_v2}" }
              as: Submitter
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /packages/${pkg_id}/record"
              payload: {}
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"
            - "HTTP status == 403"

      - name: examiner_cannot_create_office
        claim_type: forbidden_operation
        grounds:
          - roles
          - endpoints
        distinguishing_aspect: "An Examiner calling POST /offices (a Clerk-exclusive op) is denied with ERR_FORBIDDEN."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /offices"
              payload: { county_name: "Rogue", book_capacity: 3 }
              as: Examiner
              as_user_id: "ex-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"
            - "HTTP status == 403"

      - name: missing_role_header_unauthenticated
        claim_type: unauthenticated
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /submitters"
              payload: {}
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: re_record_not_owner
        claim_type: forbidden_operation
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_OWNER]
        distinguishing_aspect: "A Submitter who is not the package owner calling re-record on a REJECTED package is denied with ERR_NOT_OWNER."
        test_recipe:
          setup: ["A REJECTED DEED package owned by submitter A; a second submitter B exists."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Owner A", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_a: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Other B", submitter_type: "ATTORNEY" }
              as: Clerk
              captures: { sub_b: $.data.id }
            - call: "POST /packages"
              payload: { submitter_id: "${sub_a}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 2.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_a}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G" }
              as: Submitter
              as_user_id: "${sub_a}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E" }
              as: Submitter
              as_user_id: "${sub_a}"
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
            - call: "POST /packages/${pkg_id}/reject"
              payload: { reason_code: "MARGIN" }
              as: Examiner
              as_user_id: "ex-1"
          trigger:
            - call: "POST /packages/${pkg_id}/re-record"
              payload: { first_page_top_margin_inches: 3.0 }
              as: Submitter
              as_user_id: "${sub_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_OWNER"
            - "HTTP status == 403"
            - "DocumentPackage.${pkg_id}.status == REJECTED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_package_version_on_assessment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assessment-create-stale-package]
          - errors[ERR_STALE_PACKAGE_VERSION]
        distinguishing_aspect: "Re-finalizing an assessment with a stale expected_package_version (the version observed before a first successful assessment bumped it) returns ERR_STALE_PACKAGE_VERSION (412)."
        test_recipe:
          setup:
            - "DEED package examined and assessed once (assessment supersede path); client still holds the pre-assessment package version."
          setup_api_calls:
            - call: "POST /offices"
              payload: { county_name: "Acme", book_capacity: 3 }
              as: Clerk
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { name: "Title Co", submitter_type: "TITLE_COMPANY" }
              as: Clerk
              captures: { sub_id: $.data.id }
            - call: "POST /packages"
              payload: { submitter_id: "${sub_id}", office_id: "${off_id}", doc_type: "DEED", declared_page_count: 1, declared_consideration_cents: 0, first_page_top_margin_inches: 3.0, notary_present: true }
              as: Submitter
              as_user_id: "${sub_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTOR", party_name: "G" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/party-entries"
              payload: { party_role: "GRANTEE", party_name: "E" }
              as: Submitter
              as_user_id: "${sub_id}"
            - call: "POST /packages/${pkg_id}/begin-examination"
              payload: {}
              as: Examiner
              as_user_id: "ex-1"
              captures: { pkg_v_stale: $.data.version }
            - call: "POST /packages/${pkg_id}/assessments"
              payload: { verified_page_count: 1, verified_consideration_cents: 0, expected_package_version: "${pkg_v_stale}" }
              as: Examiner
              as_user_id: "ex-1"
          trigger:
            - call: "POST /packages/${pkg_id}/assessments"
              payload: { verified_page_count: 2, verified_consideration_cents: 0, expected_package_version: "${pkg_v_stale}" }
              as: Examiner
              as_user_id: "ex-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_PACKAGE_VERSION"
            - "HTTP status == 412"

