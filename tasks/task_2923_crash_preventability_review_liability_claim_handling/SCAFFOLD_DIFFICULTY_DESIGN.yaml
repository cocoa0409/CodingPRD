              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-30T14:00:00Z", notified_at: "2026-07-30T14:12:00Z", location_text: "US-33 at Industrial Pkwy", severity: "SEVERE", route_class: "REGIONAL", tow_away: true, tow_reason: "DISABLING_DAMAGE", injury_transported_count: 1, fatality_count: 0, hazmat_release: false, mechanical_factor: true, third_party_at_fault: false }
