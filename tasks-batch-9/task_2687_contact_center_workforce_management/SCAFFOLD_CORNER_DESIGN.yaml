            - "empty_intervals == 0, empty_required == 0 and empty_alloc == 0 for the unpopulated service_date 2026-09-08"

      - name: agent_adherence_pools_two_shifts_by_seconds
        claim_type: weighted_scoring
        grounds:
          - calculations.agent_adherence_score
          - calculations.shift_adherence_score
        distinguishing_aspect: |
          The agent score is seconds-weighted over the pooled numerator and denominator, not a mean
          of the per-shift percentages. A 27000-second shift at 0.8000 and a 16200-second shift at
          0.5000 pool to 29700/43200 = 0.6875, whereas averaging the two percentages gives 0.6500.
          Both shifts are flagged, so coaching_flag_count is 2 and coaching_status is
          COACHING_ACTIVE.
        test_recipe:
          setup:
            - "The canonical FG-A cycle locked to REQUIREMENTS_LOCKED, agent E-001 skilled VOICE_EN under LA-CORE (min_rest_hours 11, max_weekly_hours 45)."
            - "Two templates: T-MON (Monday, 08:00, 480 minutes, 30-minute break -> 27000 seconds) and T-TUE (Tuesday, 08:00, 300 minutes, 30-minute break -> 16200 seconds); the Mon 16:00 -> Tue 08:00 gap of 16 hours clears the rest rule and the 12.00 weekly total clears the 45-hour cap."
            - "Both shifts PUBLISHED."
