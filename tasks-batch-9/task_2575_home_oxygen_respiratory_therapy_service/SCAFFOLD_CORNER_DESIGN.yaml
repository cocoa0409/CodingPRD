              as: BranchManager
              captures: { u_old: $.data.id }
            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br2_id}", serial_number: "SC-9001", model_code: "CONC-5L", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 5.0, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-05-01" }
              as: BranchManager
              captures: { u_far: $.data.id }
            - call: "POST /home-oxygen/equipment-units/${u_old}/retire"
              payload: {}
              as: BranchManager
            - call: "POST /home-oxygen/equipment-units/${u_far}/retire"
