    output: Shipment
    side_effects: ["status = DRAFT, route_survey_state = NOT_REQUIRED, max_envelope_class = STANDARD, loaded_module_count = 0, permit_fee_cents = 0, escort_required = false", "version initialised to 1"]

  - method: GET
