          - errors[ERR_OVERLAP_PAUSE_WINDOW]
          - entities.DeliveryStop.fields.pause_window_days
        distinguishing_aspect: "Supplying only pause_start_date without pause_end_date, and supplying an end before the start, are both refused with ERR_OVERLAP_PAUSE_WINDOW rather than stored as a partial interval."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Hub, region North, market Riverton, contractor Cedar Hill and delivery route R1 on file."]
          setup_api_calls:
