          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_PRODUCER_NOT_FOUND]
        distinguishing_aspect: "Schema checking at priority 3 precedes body foreign-key existence at priority 5: a request that both omits course_id and names a non-existent producer_id returns ERR_INVALID_REQUEST (400), and the same producer_id returns ERR_PRODUCER_NOT_FOUND (404) once the body is well formed."
        test_recipe:
