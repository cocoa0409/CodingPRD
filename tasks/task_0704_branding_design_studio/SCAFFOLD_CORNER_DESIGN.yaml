  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_change_order_create_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[change-order-create-stale-project]
          - 'endpoints."POST /studios/{studioId}/change-orders"'
          - entities.Project.fields.version
        distinguishing_aspect: "A change-order create with the current (freshly read) expected_project_version succeeds (201) and the change order is PROPOSED."
        test_recipe:
          setup: ["Activated project in DISCOVERY; client reads its current version immediately before the create."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "IDENTITY", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 100000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /studios/${sid}/change-orders"
              payload: { project_id: "${pid}", reason: "SCOPE_ADD", delta_cents: 25000, expected_project_version: "${pv}" }
              as: StudioOps
              captures: { co: $.data.id, st: $.data.status }
          assert:
            - "HTTP status == 201 and ChangeOrder.${co}.status == PROPOSED"

      - name: occ_version_increments_on_change_order_approval
        claim_type: optimistic_concurrency
        grounds:
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
          - entities.Project.fields.version
        distinguishing_aspect: "Approving a change order increments Project.version by exactly 1 (version after activation vs after approval differ by 1)."
        test_recipe:
          setup: ["Activated project in CONCEPT with a PROPOSED change order; version captured before approval."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "IDENTITY", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 100000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/submit"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
              captures: { pv_before: $.data.version }
            - call: "POST /studios/${sid}/change-orders"
              payload: { project_id: "${pid}", reason: "SCOPE_ADD", delta_cents: 25000, expected_project_version: "${pv_before}" }
              as: StudioOps
              captures: { co: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/change-orders/${co}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "GET /studios/${sid}/projects/${pid}"
              payload: {}
              as: StudioOps
              captures: { pv_after: $.data.version }
          assert:
            - "Project.${pid}.version after approval == (version captured before approval) + 1"

      - name: extra_revision_change_order_raises_effective_revision_limit
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
          - entities.ChangeOrder.fields.extra_revisions
          - state_machines.Concept.PRESENTED_to_IN_REVISION
        distinguishing_aspect: "An APPROVED EXTRA_REVISION change order (extra_revisions=1) on a concept with revision_limit=1 raises effective_revision_limit to 2, so a second request-revision now succeeds where it would otherwise hit ERR_REVISION_LIMIT_REACHED."
        test_recipe:
          setup: ["CONCEPT-stage concept revision_limit=1, already rounds_used=1 (PRESENTED); an EXTRA_REVISION +0 change order granting 1 extra revision to that concept is APPROVED."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "IDENTITY", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 10000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/submit"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
              captures: { pv: $.data.version }
            - call: "POST /studios/${sid}/projects/${pid}/concepts"
              payload: { label: "Route A", revision_limit: 1 }
              as: Designer
              captures: { con: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/present"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/request-revision"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/present"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/change-orders"
              payload: { project_id: "${pid}", reason: "EXTRA_REVISION", delta_cents: 0, concept_id: "${con}", extra_revisions: 1, expected_project_version: "${pv}" }
              as: StudioOps
              captures: { co: $.data.id }
            - call: "POST /studios/${sid}/change-orders/${co}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "POST /studios/${sid}/projects/${pid}/concepts/${con}/request-revision"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { rounds: $.data.rounds_used, st: $.data.status }
          assert:
            - "Concept.${con}.status == IN_REVISION (second revision now allowed by raised effective limit)"
            - "Concept.${con}.rounds_used == 2"

      - name: contract_value_derived_field_reconciled_after_two_approvals
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Project.fields.contract_value_cents
          - state_machines.ChangeOrder.PROPOSED_to_APPROVED
        distinguishing_aspect: "contract_value_cents is reconciled after each approval: base 100000, +50000 approved then +(-20000) approved -> 130000."
        test_recipe:
          setup: ["Activated project in CONCEPT, base_scope 100000; two change orders approved in sequence (+50000 then -20000), each created against the then-current version."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "IDENTITY", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 100000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/moodboards"
              payload: { title: "MB" }
              as: Designer
              captures: { mb: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/submit"
              payload: {}
              as: Designer
            - call: "POST /studios/${sid}/projects/${pid}/moodboards/${mb}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "POST /studios/${sid}/projects/${pid}/advance"
              payload: {}
              as: StudioOps
              captures: { pv1: $.data.version }
            - call: "POST /studios/${sid}/change-orders"
              payload: { project_id: "${pid}", reason: "SCOPE_ADD", delta_cents: 50000, expected_project_version: "${pv1}" }
              as: StudioOps
              captures: { co1: $.data.id }
            - call: "POST /studios/${sid}/change-orders/${co1}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "GET /studios/${sid}/projects/${pid}"
              payload: {}
              as: StudioOps
              captures: { pv2: $.data.version }
            - call: "POST /studios/${sid}/change-orders"
              payload: { project_id: "${pid}", reason: "SCOPE_ADD", delta_cents: -20000, expected_project_version: "${pv2}" }
              as: StudioOps
              captures: { co2: $.data.id }
          trigger:
            - call: "POST /studios/${sid}/change-orders/${co2}/approve"
              payload: {}
              as: Client
              as_user_id: "${cid}"
            - call: "GET /studios/${sid}/projects/${pid}"
              payload: {}
              as: StudioOps
              captures: { cv: $.data.contract_value_cents }
          assert:
            - "Project.${pid}.contract_value_cents == 130000"
            - "Project.${pid}.final_deposit_cents == 39000 (130000 * 0.30)"

      - name: cancellation_cascade_multi_level_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Project.DISCOVERY_to_CANCELLED
          - state_machines.Invoice.ISSUED_to_VOID
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_discovery_cascade_invoice_void_then_milestone_revert_depth3
          rationale: "The end-to-end cancellation cascade chain is verified by the depth-3 transitive_cascade difficulty instance."

      - name: dual_variant_both_results_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds:
          - calculations.project_deposit_dual_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / deposit_provisional_locked_vs_final_recomputed_on_change_order
          rationale: "Both deposit variants and their delta are asserted by the deposit dual-variant difficulty instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_computed_fields_in_same_response
        claim_type: immediate
        grounds:
          - entities.Project.fields.contract_value_cents
          - 'endpoints."POST /studios/{studioId}/projects/{projectId}/activate"'
        distinguishing_aspect: "Activation response carries the freshly computed base_scope_cents/contract_value_cents/provisional_deposit_cents in the SAME response (immediate consistency, no read-after-write lag)."
        test_recipe:
          setup: ["DRAFT project with milestones summing to 60000, deposit_pct=0.30."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "S" }
              as: StudioOps
              captures: { sid: $.data.id }
            - call: "POST /studios/${sid}/clients"
              payload: { company_name: "C", contact_email: "c@c.com" }
              as: StudioOps
              captures: { cid: $.data.id }
            - call: "POST /studios/${sid}/projects"
              payload: { client_id: "${cid}", title: "P", service_type: "IDENTITY", deposit_pct: 0.30 }
              as: StudioOps
              captures: { pid: $.data.id }
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M1", amount_cents: 20000, sequence_index: 1 }
              as: StudioOps
            - call: "POST /studios/${sid}/projects/${pid}/milestones"
              payload: { name: "M2", amount_cents: 40000, sequence_index: 2 }
              as: StudioOps
          trigger:
            - call: "POST /studios/${sid}/projects/${pid}/activate"
              payload: {}
              as: StudioOps
              captures: { base: $.data.base_scope_cents, prov: $.data.provisional_deposit_cents }
          assert:
            - "activation response data.base_scope_cents == 60000"
            - "activation response data.contract_value_cents == 60000"
            - "activation response data.provisional_deposit_cents == 18000 (in the same response)"
