              as: ListOperator
              captures: { list_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Bob", last_name: "Jones", address_line1: "200 Oak Ave", city: "Chicago", state_code: "IL", zip5: "60602", country_code: "US", dpv_confirmation_code: "Y" }
              as: ListOperator
              captures: { rec_us_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Nina", last_name: "Roy", address_line1: "12 Maple Cr", city: "Toronto", state_code: "ON", zip5: "M4B1B", country_code: "CA", dpv_confirmation_code: "Y" }
              as: ListOperator
              captures: { rec_ca_id: $.data.id }
          trigger:
            - call: "POST /mail/mailing-lists/${list_id}/cass-runs"
              payload: {}
              as: ListOperator
              captures: { unmailable: $.data.unmailable_count }
          assert:
            - "ListRecord.${rec_us_id}.deliverability_tier == AUTOMATION"
            - "ListRecord.${rec_us_id}.cass_status == STANDARDIZED"
            - "ListRecord.${rec_ca_id}.deliverability_tier == UNMAILABLE"
