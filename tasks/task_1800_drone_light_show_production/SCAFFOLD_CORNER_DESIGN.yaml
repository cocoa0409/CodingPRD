  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: unknown_show_path_returns_not_found_before_state
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_SHOW_NOT_FOUND]"]
        distinguishing_aspect: "existence (p3) precedes everything else: authorize on a non-existent show id returns 404 ERR_SHOW_NOT_FOUND even when the body authorization id is also bogus (path validated left-to-right first)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/show-events/11111111-1111-4111-8111-111111111111/authorize", payload: { authorization_id: "22222222-2222-4222-8222-222222222222" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SHOW_NOT_FOUND (path existence beats body existence and all business rules)"

      - name: reading_in_future_rejected_now_allowed
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_READING_IN_FUTURE]"]
        distinguishing_aspect: "recorded_at after the logical clock is rejected; recorded_at exactly equal to now is allowed (inclusive)."
        test_recipe:
          setup: ["Site A; clock 2026-08-01T12:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /api/weather-readings", payload: { site_id: "${site_id}", recorded_at: "2026-08-01T12:00:01Z", wind_speed_kt: 5, gust_kt: 8, precip_mm_hr: 0.0, temperature_c: 18 }, as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/weather-readings", payload: { site_id: "${site_id}", recorded_at: "2026-08-01T12:00:00Z", wind_speed_kt: 5, gust_kt: 8, precip_mm_hr: 0.0, temperature_c: 18 }, as: SafetyOfficer, as_user_id: "so-1", captures: { rid: $.data.id } }
          assert:
            - "future reading: ${err} == ERR_READING_IN_FUTURE"
            - "reading exactly at now: created (${rid} present)"

      - name: payment_exact_amount_and_order_enforced
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", state_machines.ShowEvent, "errors[ERR_PAYMENT_AMOUNT_MISMATCH]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "BALANCE before DEPOSIT fails with ERR_INVALID_STATE (payment dimension order); DEPOSIT with a one-cent-short amount fails with ERR_PAYMENT_AMOUNT_MISMATCH; exact amounts succeed."
        test_recipe:
