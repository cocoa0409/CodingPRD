scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: daily_limit_adult_vs_medical_diverge
        grounds:
          - calculations.customer_daily_limit_check
          - entities.Customer.fields.is_medical
          - entities.License.fields.daily_purchase_limit_grams
          - state_machines.Sale.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Operates on the Sale/Customer domain: identical 28.5 g flower line is REJECTED for an
          adult-use customer (limit 28.5) but ACCEPTED for a medical customer (limit 85.5 = 28.5×3),
          so the same input diverges by customer flag — a different entity domain than rule 1's
          reconciliation instance which scores on Package.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; one RETAIL license (daily_purchase_limit_grams=28.5, ACTIVE)."
            - "One CULTIVATION license; a FLOWERING batch harvested, cured (dry 1000g), one FLOWER package of 200g passed lab and released to ACTIVE under the RETAIL license via transfer-free direct packaging is NOT possible — instead the package is custodied by RETAIL after a received manifest."
            - "Two customers: one adult-use (is_medical=false), one medical (is_medical=true). Each has an OPEN sale dated 2026-06-01 with one FLOWER line of 29.0 g (flower_equiv 29.0)."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateRegulator
            - call: "POST /compliance/licenses"
              payload: { license_number: "RET-1", license_type: "RETAIL", state_code: "CA", expires_on: "2027-01-01T00:00:00Z", daily_purchase_limit_grams: 28.5 }
              as: StateRegulator
              captures: { ret_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-1", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-1", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-A", strain: "Kush", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-A", wet_weight_grams: 1500 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 1000 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-A", product_category: "FLOWER", quantity_grams: 200 }
              as: Cultivator
              captures: { pkg_id: $.data.id, pkg_v: $.data.version }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/customers"
              payload: { birthdate: "1990-01-01T00:00:00Z", is_medical: false }
              as: Budtender
              captures: { cust_adult_id: $.data.id }
            - call: "POST /compliance/customers"
              payload: { birthdate: "1990-01-01T00:00:00Z", is_medical: true, medical_card_number: "MED-1" }
              as: Budtender
              captures: { cust_med_id: $.data.id }
            - call: "POST /compliance/sales"
              payload: { retail_license_id: "${ret_id}", customer_id: "${cust_adult_id}", sale_date: "2026-06-01T00:00:00Z" }
              as: Budtender
              captures: { sale_adult_id: $.data.id }
            - call: "POST /compliance/sales/${sale_adult_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 29.0 }
              as: Budtender
            - call: "POST /compliance/sales"
              payload: { retail_license_id: "${ret_id}", customer_id: "${cust_med_id}", sale_date: "2026-06-01T00:00:00Z" }
              as: Budtender
              captures: { sale_med_id: $.data.id }
            - call: "POST /compliance/sales/${sale_med_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 29.0 }
              as: Budtender
          trigger:
            - call: "GET /compliance/sales/${sale_adult_id}"
              as: Budtender
              captures: { sale_adult_ver: $.data.version }
            - call: "POST /compliance/sales/${sale_adult_id}/finalize"
              payload: { expected_sale_version: "${sale_adult_ver}" }
              as: Budtender
              captures: { adult_err: $.data.error_id }
            - call: "GET /compliance/sales/${sale_med_id}"
              as: Budtender
              captures: { sale_med_ver: $.data.version }
            - call: "POST /compliance/sales/${sale_med_id}/finalize"
              payload: { expected_sale_version: "${sale_med_ver}" }
              as: Budtender
          assert:
            - "adult finalize returns 409 ERR_DAILY_LIMIT_EXCEEDED (projected 29.0 > 28.5)"
            - "medical finalize returns 200 and Sale.${sale_med_id}.status == FINALIZED (projected 29.0 <= 85.5)"
            - "Sale.${sale_adult_id}.flower_equiv_grams == 29.0"
            - "Sale.${sale_med_id}.flower_equiv_grams == 29.0"

      - name: reconciliation_match_vs_discrepancy_diverge
        grounds:
          - calculations.reconciliation_variance
          - entities.ReconciliationCount.fields.outcome
          - state_machines.Package.ACTIVE_to_ON_HOLD
        distinguishing_aspect: |
          Operates on the Package/ReconciliationCount domain (not Sale): the same package with
          remaining 100.0 g yields outcome MATCH when counted 99.5 g (|var|=0.5, no hold) but
          DISCREPANCY when counted 99.4 g (|var|=0.6, package moves ACTIVE→ON_HOLD), a risk-scoring
          variant on inventory, distinct from the fiscal limit variant.
        test_recipe:
          setup:
            - "Two ACTIVE packages each with remaining_grams 100.0 under a CULTIVATION license, custody unchanged."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-2", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-2", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-B", strain: "Haze", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-B", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 800 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-B1", product_category: "FLOWER", quantity_grams: 100 }
              as: Cultivator
              captures: { pkg1_id: $.data.id }
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-B2", product_category: "FLOWER", quantity_grams: 100 }
              as: Cultivator
              captures: { pkg2_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg1_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg2_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg1_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/packages/${pkg2_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
          trigger:
            - call: "POST /compliance/reconciliation-counts"
              payload: { package_id: "${pkg1_id}", counted_by_user_id: "audit-1", counted_grams: 99.5, counted_at: "2026-06-02T00:00:00Z" }
              as: InventoryAuditor
              as_user_id: "audit-1"
              captures: { rc1_outcome: $.data.outcome }
            - call: "POST /compliance/reconciliation-counts"
              payload: { package_id: "${pkg2_id}", counted_by_user_id: "audit-1", counted_grams: 99.4, counted_at: "2026-06-02T00:00:00Z" }
              as: InventoryAuditor
              as_user_id: "audit-1"
              captures: { rc2_outcome: $.data.outcome }
          assert:
            - "ReconciliationCount for pkg1 outcome == MATCH (variance -0.5, |var| <= 0.5)"
            - "ReconciliationCount for pkg2 outcome == DISCREPANCY (variance -0.6, |var| > 0.5)"
            - "Package.${pkg1_id}.status == ACTIVE"
            - "Package.${pkg2_id}.status == ON_HOLD"

  # =================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: flower_equiv_round_per_line_then_sum
        grounds:
          - calculations.package_flower_equivalent
          - entities.SaleLine.fields.flower_equiv_grams
          - entities.Sale.fields.flower_equiv_grams
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: two EDIBLE lines of 2.55 g each round to 0.26 per line
          (2.55×0.1=0.255→0.26) so round-then-sum = 0.52, whereas sum-then-round (0.51→0.51) differs
          by a cent; the scaffold pins round-then-sum, so Sale.flower_equiv_grams MUST equal 0.52.
        test_recipe:
          setup:
            - "One EDIBLE package with ample remaining grams, ACTIVE under a RETAIL license; one OPEN sale with two EDIBLE lines of 2.55 g."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "RET-2", license_type: "RETAIL", state_code: "CA", expires_on: "2027-01-01T00:00:00Z", daily_purchase_limit_grams: 28.5 }
              as: StateRegulator
              captures: { ret_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-3", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-3", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-C", strain: "OG", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-C", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-C", product_category: "EDIBLE", quantity_grams: 100 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 10.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/customers"
              payload: { birthdate: "1990-01-01T00:00:00Z", is_medical: false }
              as: Budtender
              captures: { cust_id: $.data.id }
            - call: "POST /compliance/sales"
              payload: { retail_license_id: "${ret_id}", customer_id: "${cust_id}", sale_date: "2026-06-01T00:00:00Z" }
              as: Budtender
              captures: { sale_id: $.data.id }
            - call: "POST /compliance/sales/${sale_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 2.55 }
              as: Budtender
          trigger:
            - call: "POST /compliance/sales/${sale_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 2.55 }
              as: Budtender
            - call: "GET /compliance/sales/${sale_id}"
              as: Budtender
              captures: { total: $.data.flower_equiv_grams }
          assert:
            - "each SaleLine.flower_equiv_grams == 0.26"
            - "Sale.${sale_id}.flower_equiv_grams == 0.52 (round-then-sum, NOT 0.51)"

      - name: daily_limit_multifactor_nonlinear_selection
        grounds:
          - calculations.customer_daily_limit_check
          - calculations.package_flower_equivalent
          - entities.Package.fields.product_category
          - entities.License.fields.daily_purchase_limit_grams
        distinguishing_aspect: |
          Mode (a) ≥3-input non-linear interaction: limit = daily_purchase_limit_grams × (is_medical?3:1),
          projected = prior_finalized_sum + Σ(line.grams × FLOWER_EQUIV_FACTOR[category]); a CONCENTRATE
          line of 17.0 g (×5 = 85.0) PASSES at the medical limit 85.5 while 17.2 g (×5 = 86.0) is REJECTED,
          combining factor-selection, medical multiplier, and aggregation — a different mode from the
          rounding-order instance.
        test_recipe:
          setup:
            - "RETAIL license limit 28.5; medical customer (limit 85.5). One CONCENTRATE package ACTIVE, ample grams. Two OPEN sales: one with a 17.0 g concentrate line, one with a 17.2 g concentrate line."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "RET-3", license_type: "RETAIL", state_code: "CA", expires_on: "2027-01-01T00:00:00Z", daily_purchase_limit_grams: 28.5 }
              as: StateRegulator
              captures: { ret_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-4", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { cul_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-4", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${cul_id}", lot_tag: "LOT-D", strain: "Diesel", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-D", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-D", product_category: "CONCENTRATE", quantity_grams: 100 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 70.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/customers"
              payload: { birthdate: "1990-01-01T00:00:00Z", is_medical: true, medical_card_number: "MED-2" }
              as: Budtender
              captures: { cust_id: $.data.id }
            - call: "POST /compliance/sales"
              payload: { retail_license_id: "${ret_id}", customer_id: "${cust_id}", sale_date: "2026-06-03T00:00:00Z" }
              as: Budtender
              captures: { sale_pass_id: $.data.id }
            - call: "POST /compliance/sales/${sale_pass_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 17.0 }
              as: Budtender
            - call: "POST /compliance/sales"
              payload: { retail_license_id: "${ret_id}", customer_id: "${cust_id}", sale_date: "2026-06-04T00:00:00Z" }
              as: Budtender
              captures: { sale_fail_id: $.data.id }
            - call: "POST /compliance/sales/${sale_fail_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 17.2 }
              as: Budtender
          trigger:
            - call: "GET /compliance/sales/${sale_pass_id}"
              as: Budtender
              captures: { pass_ver: $.data.version }
            - call: "POST /compliance/sales/${sale_pass_id}/finalize"
              payload: { expected_sale_version: "${pass_ver}" }
              as: Budtender
            - call: "GET /compliance/sales/${sale_fail_id}"
              as: Budtender
              captures: { fail_ver: $.data.version }
            - call: "POST /compliance/sales/${sale_fail_id}/finalize"
              payload: { expected_sale_version: "${fail_ver}" }
              as: Budtender
              captures: { fail_err: $.data.error_id }
          assert:
            - "Sale.${sale_pass_id}.flower_equiv_grams == 85.0 and finalize returns 200, status FINALIZED"
            - "Sale.${sale_fail_id}.flower_equiv_grams == 86.0 and finalize returns 409 ERR_DAILY_LIMIT_EXCEEDED"

  # =================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: manifest_cyclic_depart_recall_loop
        grounds:
          - state_machines.Manifest.DRAFT_to_IN_TRANSIT
          - state_machines.Manifest.IN_TRANSIT_to_DRAFT
          - state_machines.Package.ACTIVE_to_IN_TRANSIT
          - state_machines.Package.IN_TRANSIT_to_ACTIVE
        distinguishing_aspect: |
          Manifest is cyclic: DRAFT→IN_TRANSIT (depart) then IN_TRANSIT→DRAFT (recall) returns to DRAFT,
          re-editable; the recall reverses the package cascade (IN_TRANSIT→ACTIVE). This is a revision
          loop on the Manifest entity, distinct from the Package branching machine below.
        test_recipe:
          setup:
            - "DISTRIBUTION origin license + destination CULTIVATION license, both ACTIVE; one ACTIVE package custodied at origin; a DRAFT manifest with one line for that package."
          setup_api_calls:
            - call: "POST /compliance/licenses"
              payload: { license_number: "DIST-1", license_type: "DISTRIBUTION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { dist_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "CUL-5", license_type: "CULTIVATION", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { dest_id: $.data.id }
            - call: "POST /compliance/licenses"
              payload: { license_number: "LAB-5", license_type: "TESTING", state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: StateRegulator
              captures: { lab_id: $.data.id }
            - call: "POST /compliance/plant-batches"
              payload: { license_id: "${dist_id}", lot_tag: "LOT-E", strain: "Sour", plant_count: 10, planted_at: "2026-01-01T00:00:00Z" }
              as: Cultivator
              captures: { batch_id: $.data.id }
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/plant-batches/${batch_id}/advance"
              payload: {}
              as: Cultivator
            - call: "POST /compliance/harvests"
              payload: { plant_batch_id: "${batch_id}", harvest_name: "H-E", wet_weight_grams: 1000 }
              as: Cultivator
              captures: { harv_id: $.data.id }
            - call: "POST /compliance/harvests/${harv_id}/cure"
              payload: { dry_weight_grams: 500 }
              as: Cultivator
            - call: "POST /compliance/packages"
              payload: { harvest_id: "${harv_id}", package_tag: "PKG-E", product_category: "FLOWER", quantity_grams: 100 }
              as: Cultivator
              captures: { pkg_id: $.data.id }
            - call: "POST /compliance/lab-results"
              payload: { package_id: "${pkg_id}", testing_license_id: "${lab_id}", thc_pct: 18.0, pesticide_pass: true, tested_at: "2026-05-01T00:00:00Z" }
              as: QALabUser
              as_user_id: "qa-1"
            - call: "POST /compliance/packages/${pkg_id}/release"
              payload: {}
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /compliance/manifests"
              payload: { origin_license_id: "${dist_id}", destination_license_id: "${dest_id}" }
              as: DistributionAgent
              captures: { man_id: $.data.id }
            - call: "POST /compliance/manifests/${man_id}/lines"
              payload: { package_id: "${pkg_id}", grams: 100 }
              as: DistributionAgent
          trigger:
            - call: "GET /compliance/manifests/${man_id}"
              as: DistributionAgent
              captures: { man_v: $.data.version }
            - call: "POST /compliance/manifests/${man_id}/depart"
              payload: { expected_manifest_version: "${man_v}" }
              as: DistributionAgent
              captures: { departed_status: $.data.status }
            - call: "POST /compliance/manifests/${man_id}/recall"
              payload: {}
              as: DistributionAgent
              captures: { recalled_status: $.data.status }
          assert:
            - "after depart Manifest.${man_id}.status == IN_TRANSIT and Package.${pkg_id}.status == IN_TRANSIT"
            - "after recall Manifest.${man_id}.status == DRAFT and Manifest.${man_id}.departed_at == null"
