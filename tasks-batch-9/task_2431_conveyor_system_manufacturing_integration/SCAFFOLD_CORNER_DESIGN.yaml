      - name: spares_waterfall_funds_critical_first_and_partially_funds_the_boundary_line
        claim_type: correct_result
        grounds:
          - calculations.spares_budget_waterfall
          - entities.SparePartLine.fields.status
          - entities.Project.fields.spares_unallocated_cents
        distinguishing_aspect: |
          Against a 3500000-cent budget the waterfall fills CRITICAL 1700000 then MAJOR 1506000 in lead-time-DESC
          order, leaves exactly 294000 for the first 30-day MAJOR line (PARTIAL) and nothing for the second
          (UNFUNDED), while the MINOR line is never a candidate and stays DRAFT.
        test_recipe:
          setup:
            - "A project with spares_budget_cents 3500000."
            - "Five spare part lines created in this order: SP-CRIT-1 (CRITICAL, 850000 x 2, lead 90), SP-MAJ-1 (MAJOR, 1255000 x 2, lead 60), SP-MAJ-2 (MAJOR, 645003 x 2, lead 30), SP-MAJ-3 (MAJOR, 645003 x 2, lead 30), SP-MIN-1 (MINOR, 500000 x 4, lead 120)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { customer_name: "Northstar Grocers", facility_code: "DC-ATL-05", customer_rep_user_id: "cust-rep-77", required_throughput_cph: 1250, contract_base_cents: 240000000, authorized_ceiling_cents: 300000000, spares_budget_cents: 3500000, service_tier: "PREMIUM" }
              as: ProjectDirector
              as_user_id: "pd-034"
              captures: { proj_c5: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_c5}", part_no: "SP-CRIT-1", criticality: "CRITICAL", unit_cost_cents: 850000, min_stock_qty: 2, lead_time_days: 90 }
              as: ProjectDirector
              as_user_id: "pd-034"
              captures: { sp_c5a: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_c5}", part_no: "SP-MAJ-1", criticality: "MAJOR", unit_cost_cents: 1255000, min_stock_qty: 2, lead_time_days: 60 }
              as: ProjectDirector
              as_user_id: "pd-034"
              captures: { sp_c5b: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_c5}", part_no: "SP-MAJ-2", criticality: "MAJOR", unit_cost_cents: 645003, min_stock_qty: 2, lead_time_days: 30 }
              as: ProjectDirector
              as_user_id: "pd-034"
              captures: { sp_c5c: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_c5}", part_no: "SP-MAJ-3", criticality: "MAJOR", unit_cost_cents: 645003, min_stock_qty: 2, lead_time_days: 30 }
              as: ProjectDirector
              as_user_id: "pd-034"
              captures: { sp_c5d: $.data.id }
            - call: "POST /spare-part-lines"
              payload: { project_id: "${proj_c5}", part_no: "SP-MIN-1", criticality: "MINOR", unit_cost_cents: 500000, min_stock_qty: 4, lead_time_days: 120 }
              as: ProjectDirector
              as_user_id: "pd-034"
              captures: { sp_c5e: $.data.id }
            - call: "GET /projects/${proj_c5}"
              payload: {}
              as: ProjectDirector
              as_user_id: "pd-034"
              captures: { pv_c5: $.data.version }
          trigger:
            - call: "POST /projects/${proj_c5}/spares-provisioning"
              payload: { expected_project_version: "${pv_c5}" }
              as: ProjectDirector
              as_user_id: "pd-034"
          assert:
            - "the response is 200 and SparePartLine.${sp_c5a}.weighted_target_cents == 1700000 with allocated_cents == 1700000 and status == ALLOCATED"
            - "SparePartLine.${sp_c5b}.weighted_target_cents == 1506000 = round_half_up(2510000 * 6000 / 10000) with allocated_cents == 1506000 and status == ALLOCATED"
            - "SparePartLine.${sp_c5c}.weighted_target_cents == 774004 = round_half_up(1290006 * 6000 / 10000) with allocated_cents == 294000 and status == PARTIAL"
            - "SparePartLine.${sp_c5d}.weighted_target_cents == 774004 with allocated_cents == 0 and status == UNFUNDED"
            - "SparePartLine.${sp_c5e}.weighted_target_cents == 0 with allocated_cents == 0 and status == DRAFT (MINOR is excluded from the candidate set despite the longest lead time)"
            - "Project.${proj_c5}.spares_allocated_cents == 3500000 and spares_unallocated_cents == 0"
            - "Project.${proj_c5}.spares_allocated_cents + Project.${proj_c5}.spares_unallocated_cents == Project.${proj_c5}.spares_budget_cents"

