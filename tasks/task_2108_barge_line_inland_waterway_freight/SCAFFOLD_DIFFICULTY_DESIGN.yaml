  - rule_id: transitive_cascade
    instances:

      - name: lock_clearance_delay_cascades_through_tow_assignment_into_contract_laytime
        grounds:
          - state_machines.LockReservation.IN_CHAMBER_to_CLEARED
          - state_machines.Tow.UNDERWAY_to_DELAYED
          - calculations.lock_delay_attribution
          - entities.BargeAssignment.fields.delay_attributed_minutes
          - entities.FreightContract.fields.delay_protection_applied
        distinguishing_aspect: |
          Depth-4 chain triggered by clearing a lock chamber: the 165-minute lockage
          overrun lands on LockReservation.delay_minutes, that number is what pushes
          Tow.accrued_delay_minutes past 120 and flips the tow to DELAYED, the tow
          flip is what writes delay_attributed_minutes onto its LOADED assignment,
          and the assignment write is what pushes FreightContract.accrued_delay_minutes
          past 150 and extends laytime_hours from 12 to 24. Each hop is caused by the
          previous hop, not by the clear call.
