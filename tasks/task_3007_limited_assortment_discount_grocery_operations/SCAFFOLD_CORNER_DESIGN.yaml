      - name: clearance_markdown_precision
        claim_type: precision
        grounds: [calculations.clearance_markdown_value]
        excluded_because:
          difficulty_instance: clearance_markdown_per_unit_rounding_order
          rationale: "Pinned per-unit-first rounding asserted in the named 1.8 instance."

