  - section: validations
    instances:
      - name: corner_accepted_on_sitting_on_both_closed_window_ends_passes
        claim_type: satisfaction_pass
        grounds:
          - validations[priority 22]
          - validations[priority 18]
        distinguishing_aspect: |
          accepted_on 2026-08-31 equals both the author's appointment_until and the grant's
          award_until. Priority 22 uses a closed [appointment_from, appointment_until] window and
          priority 18 uses a closed [award_from, award_until] window, so the article is created
          (HTTP 201) rather than rejected — an exclusive comparison on either window would fire
          ERR_APPOINTMENT_WINDOW_EXPIRED or ERR_GRANT_NOT_ACTIVE here.
        test_recipe:
          setup:
            - "logical clock at 2026-08-31T00:00:00Z"
            - "author appointed 2024-01-01..2026-08-31; ACTIVE grant awarded 2026-01-01..2026-08-31"
