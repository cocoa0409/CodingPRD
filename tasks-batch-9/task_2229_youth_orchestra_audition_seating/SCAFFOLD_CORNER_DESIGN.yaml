            - "trigger[1] -> 200 with data.enrollment_status == \"ALUMNI\" (graduation_year 2026 and opt_in true: hop 2 then hop 3)"
            - "trigger[2] -> 200 with data.enrollment_status == \"GRADUATED\" (graduation_year 2026, opt_in false: hop 2 only)"
            - "trigger[3] -> 200 with data.enrollment_status == \"ENROLLED\" (graduation_year 2028 skips hop 2, so hop 3 cannot apply)"
            - "all three members still have standing_status \"CLEAR\""
            - "trigger[4] -> 200 with data.roster_state == \"CLOSED\" (hop 1)"

      - name: event_participation_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.EventParticipation
          - difficulty.state_machines.parallel
        excluded_because:
          difficulty_instance: event_participation_three_dimensions_advance_independently
          rationale: "The parallel row for EventParticipation is already probed at depth in 1.8: that instance drives attendance NOT_RECORDED -> ABSENCE_UNVERIFIED -> EXCUSE_PENDING -> EXCUSED_ABSENT, performance_eligibility UNREVIEWED -> ELIGIBLE and tour_status PENDING -> READY on one row and asserts each dimension moved without disturbing the other two. A breadth copy would replay the same transitions with fewer hops."

      - name: placement_acceptance_syncs_the_ancestor_counter_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.Placement.transitions
          - state_machines.Season.transitions
          - difficulty.state_machines.ledger_sync
        excluded_because:
          difficulty_instance: placement_accept_seats_to_season_cascade
          rationale: "The 4-hop acceptance cascade (quota filled_count -> balance_state FULL -> Ensemble SEATED -> Season PLACEMENT -> IN_SEASON) plus the seat and tuition-account side creations are asserted hop by hop in that 1.8 instance, including the counters that must stay in step. This breadth row would assert a strict subset."

  # =========================================================================
  # Table 3 (Calculations) - one instance per applicable claim-type row of the
  # guide, including the algorithm sub-table rows that §1.3 actually declares
  # (weighted_scoring, threshold, tiered_pricing, waterfall_allocation,
  # chronological, interval_merge, variant_selection, reconciliation).
  - section: calculations
    instances:
      - name: aid_need_score_sums_every_declared_component
        claim_type: correct_result
        grounds:
          - calculations.aid_need_score
          - endpoints[POST /tuition-accounts/{accountId}/aid-review]
        distinguishing_aspect: |
          aid_need_score is the exact integer sum of five independent components with no
          rounding: BAND_POINTS[BAND_A] 40 + sibling 8 + 3 * min(years_in_org 6, 5) = 15 +
          instrument loan 6 + TIER_POINTS[PHILHARMONIC] 3 = 72. The years term is capped at
          5, not at the tuition rule's LOYALTY_MAX_YEARS 4 and not uncapped: 3*4 would give
          69 and 3*6 would give 75.
        test_recipe:
          setup:
            - "Season in IN_SEASON with aid_budget_cents 100000 and tuition_base_cents 123223."
            - "Ada Strings (BAND_A, sibling_enrolled true, years_in_org 6) accepted a"
            - "PHILHARMONIC offer WITH an instrument loan, so her TuitionAccount is CURRENT"
            - "with assessed_cents 123223 (PRELIMINARY variant) and ensemble_tier PHILHARMONIC."
            - "Her aid_status is still NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
