              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 100 }
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { kt_status: $.data.status }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Matrix 1", serial_number: "SN-MTX-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Matrix 2", serial_number: "SN-MTX-02", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: ComplianceOfficer
              as_user_id: "cx-user-1"
              captures: { acid2: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
