    roles: [IntegrityAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: { overdue_leak_count: integer, posture: string, next_survey_due_at: datetime, open_grade1_count: integer, open_grade2_count: integer, open_grade3_count: integer, risk_score: number }

