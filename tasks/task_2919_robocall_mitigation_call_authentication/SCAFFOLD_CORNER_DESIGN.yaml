  - section: errors
    instances:
      - name: path_ids_that_match_nothing_each_return_their_own_not_found
        claim_type: error_triggerable
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_PROVIDER_NOT_FOUND]"
          - "errors[ERR_CERTIFICATE_NOT_FOUND]"
          - "errors[ERR_PLAN_NOT_FOUND]"
          - "errors[ERR_ASSIGNMENT_NOT_FOUND]"
          - "errors[ERR_ATTESTATION_NOT_FOUND]"
          - "errors[ERR_OBSERVATION_NOT_FOUND]"
          - "errors[ERR_NOTICE_NOT_FOUND]"
          - "errors[ERR_DISPUTE_NOT_FOUND]"
          - "errors[ERR_ENFORCEMENT_NOT_FOUND]"
          - "errors[ERR_REPORT_NOT_FOUND]"
        distinguishing_aspect: "Each resource family owns a distinct 404 identifier rather than a shared ERR_NOT_FOUND, so a single sweep of ten reads against ten unknown ids must return ten different error_id values."
        test_recipe:
          setup:
            - "Empty database; no row of any kind exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "GET /rmd/providers/prov-missing"
              payload: {}
              as: Regulator
              expect: { status: 404, error_id: ERR_PROVIDER_NOT_FOUND }
            - call: "GET /rmd/certificates/cert-missing"
              payload: {}
              as: Regulator
              expect: { status: 404, error_id: ERR_CERTIFICATE_NOT_FOUND }
            - call: "GET /rmd/mitigation-plans/plan-missing"
              payload: {}
              as: Regulator
              expect: { status: 404, error_id: ERR_PLAN_NOT_FOUND }
            - call: "GET /rmd/number-assignments/asg-missing"
              payload: {}
              as: Regulator
              expect: { status: 404, error_id: ERR_ASSIGNMENT_NOT_FOUND }
            - call: "GET /rmd/call-attestations/att-missing"
              payload: {}
              as: Regulator
              expect: { status: 404, error_id: ERR_ATTESTATION_NOT_FOUND }
            - call: "GET /rmd/traffic-observations/obs-missing"
              payload: {}
              as: Regulator
              expect: { status: 404, error_id: ERR_OBSERVATION_NOT_FOUND }
            - call: "GET /rmd/illegal-traffic-notices/notice-missing"
              payload: {}
              as: Regulator
              expect: { status: 404, error_id: ERR_NOTICE_NOT_FOUND }
            - call: "GET /rmd/blocking-disputes/dispute-missing"
              payload: {}
              as: Regulator
              expect: { status: 404, error_id: ERR_DISPUTE_NOT_FOUND }
            - call: "GET /rmd/enforcement-actions/action-missing"
              payload: {}
              as: Regulator
              expect: { status: 404, error_id: ERR_ENFORCEMENT_NOT_FOUND }
            - call: "GET /rmd/effectiveness-reports/report-missing"
              payload: {}
              as: Regulator
              expect: { status: 404, error_id: ERR_REPORT_NOT_FOUND }
          assert:
            - "All ten reads return HTTP 404 with success == false and a non-empty data.message"
            - "The ten data.error_id values are exactly ERR_PROVIDER_NOT_FOUND, ERR_CERTIFICATE_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_ATTESTATION_NOT_FOUND, ERR_OBSERVATION_NOT_FOUND, ERR_NOTICE_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_ENFORCEMENT_NOT_FOUND and ERR_REPORT_NOT_FOUND in that order"
            - "GET /rmd/providers returns total_count == 0, so no read created anything"

      - name: malformed_numbers_and_intervals_are_rejected_in_priority_order
        claim_type: error_triggerable
        grounds:
          - "validations[priority=4]"
          - "validations[priority=5]"
          - "errors[ERR_INVALID_NUMBER_FORMAT]"
          - "errors[ERR_INVALID_INTERVAL]"
        distinguishing_aspect: "Number format (priority 4) is checked before interval well-ordering (priority 5): a request carrying both a bare ten-digit number and a reversed interval returns ERR_INVALID_NUMBER_FORMAT, and only after the number is corrected does the same request surface ERR_INVALID_INTERVAL."
        test_recipe:
          setup:
            - "One provider with one verified, origination-enabled customer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
