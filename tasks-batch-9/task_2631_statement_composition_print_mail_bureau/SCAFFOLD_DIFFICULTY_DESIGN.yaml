  - rule_id: priority_pair_validation_conflict
    instances:

      - name: stale_client_version_outranks_postage_escrow_shortfall
        grounds:
          - validations.priority_41_ERR_STALE_CLIENT_VERSION
          - validations.priority_80_ERR_POSTAGE_ESCROW_INSUFFICIENT
          - concurrency_rules.batch-seal-stale-client-escrow
        distinguishing_aspect: |
          A business_constraint (OCC, 412) versus business_fiscal (402) pair on one seal call: the
          request is simultaneously stale and unfunded, and priority 41 must answer, so a server that
          checks the wallet before the version stamp returns 402 instead of 412 and leaks the escrow
          verdict to a caller working from an out-of-date Client snapshot.
        test_recipe:
          setup:
            - "Client CL-ES with dr_readiness_required false and NO postage deposit at all, so postage_escrow_available_cents stays 0."
            - "ACTIVE template T-ES: FIRST_CLASS, sheets_per_document 1, no inserts; two hygienic records in postal_code 30301 -> one FIRST_CLASS THREE_DIGIT batch of 2 pieces."
            - "The job is driven all the way to VERIFIED (schedule, start, three accepted scans per piece, complete, reconcile-integrity) so priority 23 is satisfied and the batch is OPEN."
            - "The current Client.version is captured, then the client is PATCHed (name change only) to bump it, so the captured value is provably stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-ES", name: "Eastshore Insurance", dr_readiness_required: false }
