# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task 2363
# Open Data Portal & Dataset Publishing. Nine §0.5 rule_ids, 22 instances.
# Every numeric assert below was executed against the §1.3 formulas and their
# constants before being written down; the logical clock starts at
# 2026-08-01T00:00:00Z unless a call moves it.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: priority_score_declared_vs_observed_divergence_after_publish
        grounds:
          - calculations.dataset_priority_score
          - calculations.dataset_engagement_index
          - entities.Dataset.fields.priority_score_variant
          - entities.Dataset.fields.observed_demand_score
          - state_machines.Dataset.READY_to_PUBLISHED
        distinguishing_aspect: |
          The AS_DECLARED variant feeds public_demand_score (92) into the 0.45 demand weight while the
          AS_OBSERVED variant feeds observed_demand_score (33.12, derived from usage epochs) into the same
          weight, so identical stored inputs yield 75.00 / TIER_1 before publication and 48.50 / TIER_3
          after it — a 26.50 delta and a two-step tier drop, both observable on the analytics read.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "One department (DOT) with an active CC-BY-4.0 licence"
            - "Dataset 'weekly-traffic-counts': public_demand_score=92, policy_value_score=96, column_count=9, sensitivity_class=PUBLIC, update_frequency=WEEKLY"
            - "Metadata ACCEPTED (completeness 100.00) and privacy CLEARED (clearance risk 6.40, aggregation_required=false)"
            - "Dataset PUBLISHED with initial_row_count=50000, then three usage epochs recorded: (1, 1000, 200), (2, 2000, 500), (3, 3000, 1000)"
            - "No community DatasetRequest is linked, so community_pressure is 0 in both variants"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
            - call: "POST /open-data/licenses"
              payload: { code: "CC-BY-4.0", name: "Creative Commons Attribution 4.0", attribution_required: true, commercial_use_allowed: true, share_alike: false, attribution_text_template: "Source: City of Example, {dataset_title}" }
              as: PortalAdmin
              captures: { lic_id: "$.data.id" }
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Weekly Traffic Counts", slug: "weekly-traffic-counts", description: "Weekly Traffic Counts published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 92, policy_value_score: 96 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_id: "$.data.id" }
            - call: "POST /open-data/datasets/${ds_id}/screen"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records"
              payload: { dataset_id: "${ds_id}", license_id: "${lic_id}", data_dictionary_field_count: 9, provenance_detail_lines: 24, contact_email: "datasets@dot.city.gov", declared_update_frequency: "WEEKLY", attribution_element_count: 6 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { md_id: "$.data.id" }
            - call: "POST /open-data/metadata-records/${md_id}/submit"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records/${md_id}/decide"
              payload: { decision: "ACCEPT" }
              as: PortalAdmin
            - call: "POST /open-data/privacy-assessments"
              payload: { dataset_id: "${ds_id}", declared_quasi_identifier_count: 2, declared_smallest_cell_size: 20, population_size: 100000 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
              captures: { pa_id: "$.data.id" }
            - call: "PATCH /open-data/privacy-assessments/${pa_id}"
              payload: { verified_smallest_cell_size: 20 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/submit"
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/decide"
              payload: { decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "pr-chief-1"
            - call: "POST /open-data/datasets/${ds_id}/mark-ready"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/datasets/${ds_id}/publish"
              payload: { initial_row_count: 50000 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/datasets/${ds_id}/usage-report"
              payload: { epoch_index: 1, api_call_count: 1000, download_count: 200 }
              as: PortalAdmin
            - call: "POST /open-data/datasets/${ds_id}/usage-report"
              payload: { epoch_index: 2, api_call_count: 2000, download_count: 500 }
              as: PortalAdmin
            - call: "POST /open-data/datasets/${ds_id}/usage-report"
              payload: { epoch_index: 3, api_call_count: 3000, download_count: 1000 }
              as: PortalAdmin
          trigger:
            - call: "GET /open-data/datasets/${ds_id}/analytics"
              as: PortalAdmin
          assert:
            - "response.data.engagement_index == 33.12"
            - "response.data.observed_demand_score == 33.12"
            - "response.data.priority_score_as_declared == 75.00"
            - "response.data.priority_score_as_observed == 48.50"
            - "response.data.priority_score == 48.50 and response.data.priority_score_variant == AS_OBSERVED"
            - "response.data.priority_tier == TIER_3 (the AS_DECLARED score of 75.00 was exactly TIER_1_MIN and therefore TIER_1)"
            - "priority_score_as_declared - priority_score_as_observed == 26.50"
            - "Dataset.${ds_id}.priority_score == 48.50 and Dataset.${ds_id}.priority_tier == TIER_3"

      - name: reidentification_screening_vs_clearance_flips_aggregation_requirement
        grounds:
          - calculations.reidentification_risk_score
          - entities.PrivacyAssessment.fields.screening_risk_score
          - entities.PrivacyAssessment.fields.clearance_risk_score
          - entities.PrivacyAssessment.fields.aggregation_required
          - state_machines.PrivacyAssessment.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          The SCREENING variant pins population_factor to 1.00 and reads declared_smallest_cell_size,
          while the CLEARANCE variant reads verified_smallest_cell_size and applies SMALL_POP_FACTOR=1.25
          because population_size 4000 < 5000; the same stored assessment therefore scores 32.00 (below
          AGGREGATION_REQUIRED_MIN) at creation and 40.00 (above it) at submission, flipping
          aggregation_required false -> true and min_aggregation_geography BLOCK -> TRACT.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Department DOT with an active licence"
            - "Dataset 'parcel-ownership' with sensitivity_class=SENSITIVE (multiplier 1.0), already SCREENING"
            - "PrivacyAssessment authored by pr-analyst-1 with declared_quasi_identifier_count=4, declared_smallest_cell_size=6, population_size=4000"
            - "verified_smallest_cell_size measured at 6 (identical to the declared figure, so only the variant differs)"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
            - call: "POST /open-data/licenses"
              payload: { code: "CC-BY-4.0", name: "Creative Commons Attribution 4.0", attribution_required: true, commercial_use_allowed: true, share_alike: false, attribution_text_template: "Source: City of Example, {dataset_title}" }
              as: PortalAdmin
              captures: { lic_id: "$.data.id" }
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Parcel Ownership Extract", slug: "parcel-ownership", description: "Parcel Ownership Extract published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "SENSITIVE", public_demand_score: 60, policy_value_score: 60 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_id: "$.data.id" }
            - call: "POST /open-data/datasets/${ds_id}/screen"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/privacy-assessments"
              payload: { dataset_id: "${ds_id}", declared_quasi_identifier_count: 4, declared_smallest_cell_size: 6, population_size: 4000 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
              captures: { pa_id: "$.data.id" }
            - call: "PATCH /open-data/privacy-assessments/${pa_id}"
              payload: { verified_smallest_cell_size: 6 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
          trigger:
            - call: "POST /open-data/privacy-assessments/${pa_id}/submit"
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
          assert:
            - "PrivacyAssessment.${pa_id}.screening_risk_score == 32.00 (min(40, 8*4) * 1.0 * 1.00 * 1.0)"
            - "PrivacyAssessment.${pa_id}.clearance_risk_score == 40.00 (min(40, 8*4) * 1.0 * 1.25 * 1.0)"
            - "PrivacyAssessment.${pa_id}.risk_score == 40.00 (risk_score follows the CLEARANCE variant from SUBMITTED onwards)"
            - "PrivacyAssessment.${pa_id}.aggregation_required == true (was false while the screening score of 32.00 was authoritative)"
            - "PrivacyAssessment.${pa_id}.min_aggregation_geography == TRACT"
            - "PrivacyAssessment.${pa_id}.k_anonymity_k == 6"
            - "PrivacyAssessment.${pa_id}.status == SUBMITTED"
            - "clearance_risk_score - screening_risk_score == 8.00"

  - rule_id: combinatorial_formula
    instances:
      - name: metadata_completeness_round_each_contribution_then_sum_lands_at_8499
        grounds:
          - calculations.metadata_completeness_score
          - entities.MetadataRecord.fields.component_contributions
          - validations[priority=26]
          - errors.ERR_METADATA_INCOMPLETE
          - state_machines.MetadataRecord.RETURNED_to_DRAFT
        distinguishing_aspect: |
          Six weighted components are each rounded to two decimals BEFORE summation, so
          [23.33, 13.33, 15.00, 15.00, 10.00, 8.33] totals 84.99 and fails METADATA_ACCEPT_MIN=85.00,
          whereas summing the unrounded contributions (84.9999) and rounding once yields exactly 85.00 and
          would have been accepted — a single 0.01 that flips the gate.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Department DOT with active licence CC-BY-4.0 (attribution_required=true)"
            - "Dataset 'building-permits' with column_count=9 and update_frequency=WEEKLY, already SCREENING"
            - "MetadataRecord SUBMITTED with data_dictionary_field_count=7, provenance_detail_lines=16, attribution_element_count=5, a valid contact_email and declared_update_frequency=WEEKLY"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
            - call: "POST /open-data/licenses"
              payload: { code: "CC-BY-4.0", name: "Creative Commons Attribution 4.0", attribution_required: true, commercial_use_allowed: true, share_alike: false, attribution_text_template: "Source: City of Example, {dataset_title}" }
              as: PortalAdmin
              captures: { lic_id: "$.data.id" }
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Building Permits", slug: "building-permits", description: "Building Permits published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 70, policy_value_score: 70 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_id: "$.data.id" }
            - call: "POST /open-data/datasets/${ds_id}/screen"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records"
              payload: { dataset_id: "${ds_id}", license_id: "${lic_id}", data_dictionary_field_count: 7, provenance_detail_lines: 16, contact_email: "datasets@dot.city.gov", declared_update_frequency: "WEEKLY", attribution_element_count: 5 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { md_id: "$.data.id" }
            - call: "POST /open-data/metadata-records/${md_id}/submit"
              as: DataCoordinator
              as_user_id: "${dept_id}"
          trigger:
            - call: "POST /open-data/metadata-records/${md_id}/decide"
              payload: { decision: "ACCEPT" }
              as: PortalAdmin
            - call: "POST /open-data/metadata-records/${md_id}/decide"
              payload: { decision: "RETURN", returned_reason: "Data dictionary and provenance below the acceptance floor" }
              as: PortalAdmin
            - call: "PATCH /open-data/metadata-records/${md_id}"
              payload: { data_dictionary_field_count: 9, provenance_detail_lines: 24, attribution_element_count: 6 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records/${md_id}/submit"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records/${md_id}/decide"
              payload: { decision: "ACCEPT" }
              as: PortalAdmin
          assert:
            - "First decide ACCEPT returns 422 with error_id ERR_METADATA_INCOMPLETE"
            - "MetadataRecord.${md_id}.completeness_score == 84.99"
            - "MetadataRecord.${md_id}.component_contributions == [23.33, 13.33, 15.00, 15.00, 10.00, 8.33]"
            - "MetadataRecord.${md_id}.status == SUBMITTED immediately after the rejected ACCEPT (no transition occurred)"
            - "The sum-then-round order would have produced 85.00 and accepted the record; the pinned order must not"
            - "After the RETURN the record is RETURNED with returned_reason set; the PATCH moves it back to DRAFT"
            - "After the PATCH MetadataRecord.${md_id}.completeness_score == 100.00 and component_contributions == [30.00, 20.00, 15.00, 15.00, 10.00, 10.00]"
            - "The second decide ACCEPT returns 200 and MetadataRecord.${md_id}.status == ACCEPTED"

      - name: settlement_tier_keyed_on_pre_discount_subtotal
        grounds:
          - calculations.pipeline_run_settlement
          - entities.PipelineRun.fields.reliability_discount_pct
          - entities.PipelineRun.fields.total_charge_credits
          - state_machines.PipelineRun.RUNNING_to_SUCCEEDED
        distinguishing_aspect: |
          The reliability discount tier is keyed on the PRE-discount subtotal and never re-evaluated:
          95000 rows give compute 40, subtotal exactly 40 (== DISCOUNT_TIER_A_MIN), 10% discount 4.00 and
          total 36.00 — an implementation that re-tiers on the 36.00 result would drop to the 5% band and
          settle at 38.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, later advanced to 2026-08-01T09:00:00Z"
            - "Department DOT granted 100 credits; runner 'ingest-runner-a' ACTIVE with cooldown 15"
            - "Dataset 'weekly-traffic-counts' PUBLISHED (initial_row_count 50000)"
            - "WEEKLY pipeline armed on window 540..660 with escrow_required_units 10.00 (department balance 90.00, escrowed 10.00)"
            - "One SCHEDULED run at 2026-08-01T09:00:00Z, already RUNNING"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
            - call: "POST /open-data/departments/${dept_id}/credit-grants"
              payload: { credit_units: 100.00, memo: "FY27 publication credits" }
              as: PortalAdmin
            - call: "POST /open-data/licenses"
              payload: { code: "CC-BY-4.0", name: "Creative Commons Attribution 4.0", attribution_required: true, commercial_use_allowed: true, share_alike: false, attribution_text_template: "Source: City of Example, {dataset_title}" }
              as: PortalAdmin
              captures: { lic_id: "$.data.id" }
            - call: "POST /open-data/ingest-runners"
              payload: { name: "ingest-runner-a", cooldown_minutes: 15 }
              as: PortalAdmin
              captures: { runner_id: "$.data.id" }
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "Weekly Traffic Counts", slug: "weekly-traffic-counts", description: "Weekly Traffic Counts published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "PUBLIC", public_demand_score: 92, policy_value_score: 96 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_id: "$.data.id" }
            - call: "POST /open-data/datasets/${ds_id}/screen"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records"
              payload: { dataset_id: "${ds_id}", license_id: "${lic_id}", data_dictionary_field_count: 9, provenance_detail_lines: 24, contact_email: "datasets@dot.city.gov", declared_update_frequency: "WEEKLY", attribution_element_count: 6 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { md_id: "$.data.id" }
            - call: "POST /open-data/metadata-records/${md_id}/submit"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/metadata-records/${md_id}/decide"
              payload: { decision: "ACCEPT" }
              as: PortalAdmin
            - call: "POST /open-data/privacy-assessments"
              payload: { dataset_id: "${ds_id}", declared_quasi_identifier_count: 2, declared_smallest_cell_size: 20, population_size: 100000 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
              captures: { pa_id: "$.data.id" }
            - call: "PATCH /open-data/privacy-assessments/${pa_id}"
              payload: { verified_smallest_cell_size: 20 }
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/submit"
              as: PrivacyReviewer
              as_user_id: "pr-analyst-1"
            - call: "POST /open-data/privacy-assessments/${pa_id}/decide"
              payload: { decision: "CLEAR" }
              as: PrivacyReviewer
              as_user_id: "pr-chief-1"
            - call: "POST /open-data/datasets/${ds_id}/mark-ready"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/datasets/${ds_id}/publish"
              payload: { initial_row_count: 50000 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "GET /open-data/datasets/${ds_id}"
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { ds_v: "$.data.version" }
            - call: "POST /open-data/publication-pipelines"
              payload: { dataset_id: "${ds_id}", runner_id: "${runner_id}", cadence: "WEEKLY", window_start_minute: 540, window_duration_minutes: 120, alert_email: "pipeline-alerts@dot.city.gov", expected_dataset_version: "${ds_v}" }
              as: DataCoordinator
              as_user_id: "${dept_id}"
              captures: { pl_id: "$.data.id" }
            - call: "POST /open-data/publication-pipelines/${pl_id}/arm"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/pipeline-runs"
              payload: { pipeline_id: "${pl_id}", scheduled_for_utc: "2026-08-01T09:00:00Z" }
              as: PortalAdmin
              captures: { run1_id: "$.data.id" }
            - call: "POST /open-data/pipeline-runs/${run1_id}/start"
              as: PortalAdmin
          trigger:
            - call: "POST /open-data/pipeline-runs/${run1_id}/report-success"
              payload: { rows_ingested: 95000 }
              as: PortalAdmin
          assert:
            - "PipelineRun.${run1_id}.compute_credits == 40.00 (ceil(95000/10000) * 4)"
            - "PipelineRun.${run1_id}.alert_credits == 0.00"
            - "PipelineRun.${run1_id}.subtotal_credits == 40.00"
            - "PipelineRun.${run1_id}.reliability_discount_pct == 0.10"
            - "PipelineRun.${run1_id}.discount_credits == 4.00"
            - "PipelineRun.${run1_id}.total_charge_credits == 36.00 (NOT 38.00, which is what re-tiering on the discounted figure would produce)"
            - "PipelineRun.${run1_id}.escrow_drawn_units == 10.00 and balance_drawn_units == 26.00"
            - "Department.${dept_id}.credit_balance_units == 64.00, credits_escrowed_units == 0.00, credits_consumed_units == 36.00"
            - "PipelineRun.${run1_id}.status == SUCCEEDED"

  - rule_id: non_linear_state_machine
    instances:
      - name: privacy_assessment_block_reopen_resubmit_clear_cycle
        grounds:
          - state_machines.PrivacyAssessment.SUBMITTED_to_BLOCKED
          - state_machines.PrivacyAssessment.BLOCKED_to_DRAFT
          - state_machines.PrivacyAssessment.DRAFT_to_SUBMITTED
          - state_machines.PrivacyAssessment.SUBMITTED_to_CLEARED
          - validations[priority=16]
          - errors.ERR_REIDENTIFICATION_RISK_TOO_HIGH
        distinguishing_aspect: |
          The assessment traverses DRAFT -> SUBMITTED -> BLOCKED -> DRAFT -> SUBMITTED -> CLEARED, re-entering
          both DRAFT and SUBMITTED a second time; the clearance score is recomputed on each re-submission
          (80.00 then 20.00), proving the loop is a genuine backward edge rather than a forward-only path.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Dataset 'inmate-roster' with sensitivity_class=SENSITIVE, already SCREENING"
            - "PrivacyAssessment authored by pr-analyst-1: declared_quasi_identifier_count=5, declared_smallest_cell_size=4, population_size=60000"
            - "verified_smallest_cell_size measured at 4, assessment SUBMITTED with clearance_risk_score 80.00"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/departments"
              payload: { name: "City Transportation Department", code: "DOT", contact_email: "opendata@dot.city.gov" }
              as: PortalAdmin
              captures: { dept_id: "$.data.id" }
            - call: "POST /open-data/licenses"
              payload: { code: "CC-BY-4.0", name: "Creative Commons Attribution 4.0", attribution_required: true, commercial_use_allowed: true, share_alike: false, attribution_text_template: "Source: City of Example, {dataset_title}" }
              as: PortalAdmin
              captures: { lic_id: "$.data.id" }
            - call: "POST /open-data/datasets"
              payload: { department_id: "${dept_id}", title: "County Inmate Roster", slug: "inmate-roster", description: "County Inmate Roster published by the department", update_frequency: "WEEKLY", column_count: 9, sensitivity_class: "SENSITIVE", public_demand_score: 55, policy_value_score: 60 }
              as: DataCoordinator
              as_user_id: "${dept_id}"
