              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AREA_CLOSED"

      - name: third_guest_pass_rejected_at_monthly_limit
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - calculations.guest_monthly_usage
          - errors[ERR_GUEST_PASS_MONTHLY_LIMIT]
        distinguishing_aspect: "Purchases 1 and 2 succeed; the third in the same calendar month hits the == 2 limit boundary and is rejected."
        test_recipe:
          setup: ["clock 2026-08-01; active member with two ISSUED passes this month"]
          setup_api_calls:
