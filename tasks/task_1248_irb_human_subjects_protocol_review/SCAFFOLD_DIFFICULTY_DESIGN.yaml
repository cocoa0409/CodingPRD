              captures: { err: $.data.error_id }
            - call: "POST /irb/board-meetings/${mtg}/convene"
              payload: { attendee_member_ids: ["${chair_id}", "${nonsci}", "${unaff}"] }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /irb/agenda-items/${item}/vote"
              payload: { motion: "APPROVE", votes_for: 3, votes_against: 0, votes_abstain: 0 }
              as: IrbChair
              as_user_id: "${chair_id}"
          assert:
            - "First vote rejected with error_id ERR_INVALID_STATE (http 409) because the meeting is SCHEDULED"
            - "After convene, the identical vote succeeds: AgendaItem.${item}.status == VOTED, outcome == APPROVE"
            - "Protocol.${proto_id}.status == APPROVED"

      - name: reliance_execute_requires_approved_protocol
        grounds:
