# =============================================================================
# Task 1980 — SCAFFOLD_DIFFICULTY_DESIGN.yaml (section 1.8: Test Targeting Index)
# 9 difficulty rules x 2 instances = 18 instances.
# Clock default (unset): 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: plan_certified_vs_projected_hours
        grounds:
          - calculations.plan_progress_hours
          - entities.FirmElementPlan.fields.certified_hours
          - entities.FirmElementPlan.fields.projected_hours
        distinguishing_aspect: |
          Plan progress has two valid variants over the SAME FirmElementPlan rows:
          certified_hours counts only COMPLETED FIRM_ELEMENT enrollments while
          projected_hours also counts IN_PROGRESS ones — with one enrollment
          COMPLETED (3.0h) and one IN_PROGRESS (2.0h) the two variants MUST read
          3.0 and 5.0 on the same plan read.
        test_recipe:
          setup:
            - "RR rep with prior_year_excess_hours = 0"
            - "FIRM_ELEMENT e-learning contents FE-A (3.0h) and FE-B (2.0h) APPROVED"
            - "Plan for 2026 published; enrollment in FE-A COMPLETED; enrollment in FE-B IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-DV1", full_name: "Dv One", email: "dv1@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id", rep_v: "$.data.version" } }
            - { call: "POST /contents", payload: { code: "FE-A", title: "FE Alpha", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 3.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { ca_id: "$.data.id" } }
            - { call: "POST /contents/${ca_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${ca_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /contents", payload: { code: "FE-B", title: "FE Beta", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 2.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { cb_id: "$.data.id" } }
            - { call: "POST /contents/${cb_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${cb_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v}" }, as: TrainingAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /firm-element-plans/${plan_id}/needs-analysis", payload: { analysis_document_ref: "doc-dv1-na", analysis_notes: "annual needs analysis" }, as: TrainingAdmin }
            - { call: "POST /firm-element-plans/${plan_id}/publish", payload: {}, as: TrainingAdmin }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${ca_id}" }, as: TrainingAdmin, captures: { ea_id: "$.data.id" } }
            - { call: "POST /enrollments/${ea_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${ea_id}/complete", payload: { score: 90 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${cb_id}" }, as: TrainingAdmin, captures: { eb_id: "$.data.id" } }
            - { call: "POST /enrollments/${eb_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
          trigger:
            - { call: "GET /firm-element-plans/${plan_id}", payload: {}, as: ComplianceOfficer }
          assert:
            - "FirmElementPlan.${plan_id}.certified_hours == 3.0"
            - "FirmElementPlan.${plan_id}.projected_hours == 5.0"
            - "certified variant (3.0) != projected variant (5.0) for identical underlying data"

      - name: state_ce_strict_vs_carryover_hours
        grounds:
          - calculations.state_ce_earned_hours
          - entities.StateCELicense.fields.earned_hours_strict
          - entities.StateCELicense.fields.earned_hours_effective
          - entities.StateCELicense.fields.carried_excess_hours
        distinguishing_aspect: |
          State CE compliance has two valid variants over the SAME StateCELicense
          rows (a different entity domain than FirmElementPlan): strict counts only
          current-window completions while effective adds capped carryover from the
          prior period — after renewal with 5.0 carried hours and a single 2.0h
          completion, strict MUST read 2.0 and effective MUST read 7.0.
        test_recipe:
          setup:
            - "Insurance-licensed rep; STATE_INSURANCE contents S1 (4.0h), S2 (5.0h), S3 (2.0h) APPROVED"
            - "CA license required_hours 4.0, period [2026-01-01, 2027-01-01); S1+S2 completed inside period 1 (strict 9.0)"
            - "License renewed to [2027-01-01, 2028-01-01): carried_excess = min(6, 9-4) = 5.0"
            - "Clock at 2027-06-01; S3 completed in period 2"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-DV2", full_name: "Dv Two", email: "dv2@x.com", role_tier: RR, insurance_licensed: true, resident_state_code: "CA", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "S1", title: "State One", ce_category: STATE_INSURANCE, delivery_format: ELEARNING, credit_hours: 4.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { s1_id: "$.data.id" } }
            - { call: "POST /contents/${s1_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${s1_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /contents", payload: { code: "S2", title: "State Two", ce_category: STATE_INSURANCE, delivery_format: ELEARNING, credit_hours: 5.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { s2_id: "$.data.id" } }
            - { call: "POST /contents/${s2_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${s2_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /contents", payload: { code: "S3", title: "State Three", ce_category: STATE_INSURANCE, delivery_format: ELEARNING, credit_hours: 2.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { s3_id: "$.data.id" } }
            - { call: "POST /contents/${s3_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${s3_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /state-ce-licenses", payload: { rep_id: "${rep_id}", state_code: "CA", required_hours: 4.0, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }, as: TrainingAdmin, captures: { lic_id: "$.data.id" } }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${s1_id}" }, as: TrainingAdmin, captures: { e1_id: "$.data.id" } }
            - { call: "POST /enrollments/${e1_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e1_id}/complete", payload: { score: 85 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${s2_id}" }, as: TrainingAdmin, captures: { e2_id: "$.data.id" } }
            - { call: "POST /enrollments/${e2_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e2_id}/complete", payload: { score: 85 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /state-ce-licenses/${lic_id}/renew", payload: { new_period_start: "2027-01-01T00:00:00Z", new_period_end: "2028-01-01T00:00:00Z" }, as: TrainingAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-06-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${s3_id}" }, as: TrainingAdmin, captures: { e3_id: "$.data.id" } }
            - { call: "POST /enrollments/${e3_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e3_id}/complete", payload: { score: 85 }, as: RegisteredRep, as_user_id: "${rep_id}" }
          trigger:
            - { call: "GET /state-ce-licenses/${lic_id}", payload: {}, as: ComplianceOfficer }
          assert:
            - "StateCELicense.${lic_id}.earned_hours_strict == 2.0"
            - "StateCELicense.${lic_id}.earned_hours_effective == 7.0"
            - "StateCELicense.${lic_id}.carried_excess_hours == 5.0"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: firm_element_required_hours_capped_surcharge
        grounds:
          - calculations.firm_element_required_hours
          - entities.FirmElementPlan.fields.required_hours
        distinguishing_aspect: |
          Mode (a) combinatorial formula with >= 3 inputs and non-linear
          interaction: required = max(MIN 6, tier base 16 (PRINCIPAL) +
          2 * min(4 launched products, CAP 3) - excess 4) = max(6, 18) = 18 —
          the product-count cap binds (4 launched, only 3 surcharged).
        test_recipe:
          setup:
            - "PRINCIPAL rep with prior_year_excess_hours = 4"
            - "Four PRODUCT contents APPROVED and four ProductOfferings LAUNCHED in 2026 (cap is 3)"
            - "Plan for 2026 created with needs analysis recorded, then published"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-CF1", full_name: "Cf One", email: "cf1@x.com", role_tier: PRINCIPAL, insurance_licensed: false, resident_state_code: "TX", prior_year_excess_hours: 4 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "PC-1", title: "Product Course 1", ce_category: PRODUCT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { pc1: "$.data.id" } }
            - { call: "POST /contents/${pc1}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${pc1}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /contents", payload: { code: "PC-2", title: "Product Course 2", ce_category: PRODUCT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { pc2: "$.data.id" } }
            - { call: "POST /contents/${pc2}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${pc2}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /contents", payload: { code: "PC-3", title: "Product Course 3", ce_category: PRODUCT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { pc3: "$.data.id" } }
            - { call: "POST /contents/${pc3}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${pc3}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /contents", payload: { code: "PC-4", title: "Product Course 4", ce_category: PRODUCT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { pc4: "$.data.id" } }
            - { call: "POST /contents/${pc4}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${pc4}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /products", payload: { product_code: "P1", name: "Product One", required_training_content_id: "${pc1}" }, as: ComplianceOfficer, captures: { p1: "$.data.id" } }
            - { call: "POST /products/${p1}/launch", payload: {}, as: ComplianceOfficer }
            - { call: "POST /products", payload: { product_code: "P2", name: "Product Two", required_training_content_id: "${pc2}" }, as: ComplianceOfficer, captures: { p2: "$.data.id" } }
            - { call: "POST /products/${p2}/launch", payload: {}, as: ComplianceOfficer }
            - { call: "POST /products", payload: { product_code: "P3", name: "Product Three", required_training_content_id: "${pc3}" }, as: ComplianceOfficer, captures: { p3: "$.data.id" } }
            - { call: "POST /products/${p3}/launch", payload: {}, as: ComplianceOfficer }
            - { call: "POST /products", payload: { product_code: "P4", name: "Product Four", required_training_content_id: "${pc4}" }, as: ComplianceOfficer, captures: { p4: "$.data.id" } }
            - { call: "POST /products/${p4}/launch", payload: {}, as: ComplianceOfficer }
            - { call: "GET /representatives/${rep_id}", payload: {}, as: TrainingAdmin, captures: { rep_v_now: "$.data.version" } }
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v_now}" }, as: TrainingAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /firm-element-plans/${plan_id}/needs-analysis", payload: { analysis_document_ref: "doc-cf1-na", analysis_notes: "annual needs analysis" }, as: TrainingAdmin }
            - { call: "POST /firm-element-plans/${plan_id}/publish", payload: {}, as: TrainingAdmin }
          trigger:
            - { call: "GET /firm-element-plans/${plan_id}", payload: {}, as: TrainingAdmin }
          assert:
            - "FirmElementPlan.${plan_id}.required_hours == 18"
            - "FirmElementPlan.${plan_id}.plan_status == PLAN_PUBLISHED"

      - name: state_ce_reported_hours_per_course_rounding
        grounds:
          - calculations.state_ce_reported_hours
          - entities.StateCELicense.fields.reported_hours
        distinguishing_aspect: |
          Mode (b) nested rounding where order is pinned: each course rounds
          half-up to 0.5h BEFORE summation. Courses 1.25 + 1.25 + 2.0 yield
          1.5 + 1.5 + 2.0 = 5.0 reported, while raw summed hours are 4.5 —
          sum-then-round would also give 4.5, so reported_hours == 5.0 proves
          per-course-first ordering. Different mode than the tiered surcharge
          instance (mode a).
        test_recipe:
          setup:
            - "Insurance-licensed rep; STATE_INSURANCE contents R1 (1.25h), R2 (1.25h), R3 (2.0h) APPROVED"
            - "NJ license required_hours 99, period [2026-01-01, 2027-01-01)"
            - "All three enrollments COMPLETED at default clock 2026-08-01 (inside window)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-CF2", full_name: "Cf Two", email: "cf2@x.com", role_tier: RR, insurance_licensed: true, resident_state_code: "NJ", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "R1", title: "Round One", ce_category: STATE_INSURANCE, delivery_format: ELEARNING, credit_hours: 1.25, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { r1: "$.data.id" } }
            - { call: "POST /contents/${r1}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${r1}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /contents", payload: { code: "R2", title: "Round Two", ce_category: STATE_INSURANCE, delivery_format: ELEARNING, credit_hours: 1.25, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { r2: "$.data.id" } }
            - { call: "POST /contents/${r2}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${r2}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /contents", payload: { code: "R3", title: "Round Three", ce_category: STATE_INSURANCE, delivery_format: ELEARNING, credit_hours: 2.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { r3: "$.data.id" } }
            - { call: "POST /contents/${r3}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${r3}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /state-ce-licenses", payload: { rep_id: "${rep_id}", state_code: "NJ", required_hours: 99, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }, as: TrainingAdmin, captures: { lic_id: "$.data.id" } }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${r1}" }, as: TrainingAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /enrollments/${e1}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e1}/complete", payload: { score: 80 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${r2}" }, as: TrainingAdmin, captures: { e2: "$.data.id" } }
            - { call: "POST /enrollments/${e2}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e2}/complete", payload: { score: 80 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${r3}" }, as: TrainingAdmin, captures: { e3: "$.data.id" } }
            - { call: "POST /enrollments/${e3}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e3}/complete", payload: { score: 80 }, as: RegisteredRep, as_user_id: "${rep_id}" }
          trigger:
            - { call: "GET /state-ce-licenses/${lic_id}", payload: {}, as: ComplianceOfficer }
          assert:
            - "StateCELicense.${lic_id}.reported_hours == 5.0"
            - "StateCELicense.${lic_id}.earned_hours_strict == 4.5"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: content_rework_cycle
        grounds:
          - state_machines.TrainingContent.DRAFT_to_PENDING_APPROVAL
          - state_machines.TrainingContent.PENDING_APPROVAL_to_REJECTED
          - state_machines.TrainingContent.REJECTED_to_DRAFT
          - state_machines.TrainingContent.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          TrainingContent runs a cyclic rework loop (DRAFT -> PENDING_APPROVAL ->
          REJECTED -> DRAFT -> PENDING_APPROVAL -> APPROVED): the entity revisits
          DRAFT and PENDING_APPROVAL a second time, and version monotonically
          reaches 6 across the six mutations.
        test_recipe:
          setup:
            - "Content authored by ta-1 in DRAFT (version 1)"
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "RW-1", title: "Rework One", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id", v1: "$.data.version" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/reject", payload: { reason: "insufficient learning objectives" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { v3: "$.data.version" } }
          trigger:
            - { call: "PUT /contents/${c_id}", payload: { expected_content_version: "${v3}", title: "Rework One Revised" }, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "GET /contents/${c_id}", payload: {}, as: ComplianceOfficer }
          assert:
            - "TrainingContent.${c_id}.content_status == APPROVED"
            - "TrainingContent.${c_id}.version == 6"
            - "TrainingContent.${c_id}.approved_by_user_id == co-1"

      - name: enrollment_retake_cycle
        grounds:
          - state_machines.Enrollment.ENROLLED_to_IN_PROGRESS
          - state_machines.Enrollment.IN_PROGRESS_to_FAILED
          - state_machines.Enrollment.FAILED_to_ENROLLED
          - state_machines.Enrollment.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Enrollment runs a retake cycle (ENROLLED -> IN_PROGRESS -> FAILED ->
          ENROLLED -> IN_PROGRESS -> COMPLETED) on a different entity than the
          content rework loop; attempt_count accumulates (2) across the loop.
        test_recipe:
          setup:
            - "Rep; FIRM_ELEMENT e-learning content RT-1 (passing score 70) APPROVED; enrollment started"
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-RT1", full_name: "Rt One", email: "rt1@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "RT-1", title: "Retake One", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
          trigger:
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 50 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { st1: "$.data.enrollment_status", at1: "$.data.attempt_count" } }
            - { call: "POST /enrollments/${e_id}/reattempt", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 80 }, as: RegisteredRep, as_user_id: "${rep_id}" }
          assert:
            - "first complete response: ${st1} == FAILED and ${at1} == 1"
            - "Enrollment.${e_id}.enrollment_status == COMPLETED"
            - "Enrollment.${e_id}.attempt_count == 2"
            - "Enrollment.${e_id}.last_score == 80"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: lapse_cascade_assignment_to_certification
        grounds:
          - state_machines.RegulatoryAssignment.ASSIGNED_to_LAPSED
          - state_machines.Representative.ACTIVE_to_INACTIVE_CE
          - state_machines.ProductCertification.CERTIFIED_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 chain from the enforcement-sweep trigger: assignment LAPSED
          (hop 1) mutates the rep to INACTIVE_CE (hop 2, caused by the lapse),
          and that registration flip suspends the rep's CERTIFIED product
          certification (hop 3, caused by hop 2's mutation).
        test_recipe:
          setup:
            - "Clock at 2026-08-01 (T0); rep ACTIVE holding a CERTIFIED product certification"
            - "Regulatory assignment created at T0 (due 2026-11-29T00:00:00Z, lapse_after 2026-12-29T00:00:00Z); never completed"
            - "Clock advanced to 2026-12-30T00:00:00Z (past lapse_after)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-LC1", full_name: "Lc One", email: "lc1@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "WA", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "PR-LC", title: "Lapse Product Course", ce_category: PRODUCT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { pc_id: "$.data.id" } }
            - { call: "POST /contents/${pc_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${pc_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /products", payload: { product_code: "PL1", name: "Lapse Product", required_training_content_id: "${pc_id}" }, as: ComplianceOfficer, captures: { prod_id: "$.data.id" } }
            - { call: "POST /products/${prod_id}/launch", payload: {}, as: ComplianceOfficer }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${pc_id}" }, as: TrainingAdmin, captures: { pe_id: "$.data.id" } }
            - { call: "POST /enrollments/${pe_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${pe_id}/complete", payload: { score: 90 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /regulatory-assignments", payload: { rep_id: "${rep_id}", cycle_year: 2026 }, as: TrainingAdmin, captures: { asg_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-30T00:00:00Z" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /enforcement/sweep", payload: {}, as: ComplianceOfficer, captures: { lapsed_n: "$.data.assignments_lapsed" } }
            - { call: "GET /regulatory-assignments/${asg_id}", payload: {}, as: ComplianceOfficer }
            - { call: "GET /representatives/${rep_id}", payload: {}, as: ComplianceOfficer }
            - { call: "GET /product-certifications?rep_id=${rep_id}&product_id=${prod_id}", payload: {}, as: ComplianceOfficer, captures: { cert_st: "$.data[0].cert_status", cert_reason: "$.data[0].suspended_reason" } }
          assert:
            - "sweep summary assignments_lapsed == 1 (${lapsed_n})"
            - "RegulatoryAssignment.${asg_id}.assignment_status == LAPSED"
            - "Representative.${rep_id}.registration_status == INACTIVE_CE"
            - "ProductCertification cert_status == SUSPENDED with suspended_reason == REGISTRATION_INACTIVE (${cert_st} / ${cert_reason})"

      - name: void_cascade_enrollment_to_attestation
        grounds:
          - state_machines.Enrollment.COMPLETED_to_VOIDED
          - state_machines.FirmElementPlan.CLOSED_to_PLAN_PUBLISHED
          - state_machines.AnnualAttestation.ATTESTED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (audit void, not the sweep):
          voiding the COMPLETED enrollment (hop 1) drops certified_hours below
          required_hours and reopens the CLOSED plan (hop 2, caused by hop 1's
          recompute), and the reopen voids the ATTESTED attestation (hop 3,
          caused by hop 2's mutation).
        test_recipe:
          setup:
            - "RR rep, excess 0; FIRM_ELEMENT content 13.0h APPROVED"
            - "Plan 2026 published (required_hours = max(6, 12+0-0) = 12); enrollment COMPLETED (certified 13.0); plan CLOSED; attestation ATTESTED by the rep"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-VC1", full_name: "Vc One", email: "vc1@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "CO", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id", rep_v: "$.data.version" } }
            - { call: "POST /contents", payload: { code: "FE-VC", title: "Firm Element Void Course", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 13.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v}" }, as: TrainingAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /firm-element-plans/${plan_id}/needs-analysis", payload: { analysis_document_ref: "doc-vc1-na", analysis_notes: "annual needs analysis" }, as: TrainingAdmin }
            - { call: "POST /firm-element-plans/${plan_id}/publish", payload: {}, as: TrainingAdmin }
            - { call: "GET /attestations?plan_id=${plan_id}", payload: {}, as: TrainingAdmin, captures: { att_id: "$.data[0].id" } }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 95 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /firm-element-plans/${plan_id}/close", payload: {}, as: TrainingAdmin }
            - { call: "POST /attestations/${att_id}/attest", payload: { attestation_statement: "I attest to completing my firm element plan." }, as: RegisteredRep, as_user_id: "${rep_id}" }
          trigger:
            - { call: "POST /enrollments/${e_id}/void", payload: { justification: "score recording error found in audit" }, as: ComplianceOfficer }
            - { call: "GET /firm-element-plans/${plan_id}", payload: {}, as: TrainingAdmin, captures: { plan_st: "$.data.plan_status", cert_h: "$.data.certified_hours" } }
            - { call: "GET /attestations/${att_id}", payload: {}, as: ComplianceOfficer, captures: { att_st: "$.data.attestation_status" } }
          assert:
            - "Enrollment.${e_id}.enrollment_status == VOIDED"
            - "FirmElementPlan.${plan_id}.certified_hours == 0 (${cert_h})"
            - "FirmElementPlan.${plan_id}.plan_status == PLAN_PUBLISHED (${plan_st})"
            - "AnnualAttestation.${att_id}.attestation_status == VOIDED (${att_st})"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_conflict_state_beats_sod
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_CONTENT_NOT_PENDING_APPROVAL]
          - errors[ERR_SOD_AUTHOR_CANNOT_APPROVE]
        distinguishing_aspect: |
          Error-category pair (state, business_safety): approving a DRAFT content
          as its own author violates both the state guard (not PENDING_APPROVAL)
          and the SoD guard (approver == author); the state error MUST win
          (priority 4 before 5).
        test_recipe:
          setup:
            - "Content authored by user ta-author-1, never submitted (still DRAFT)"
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "CF-9", title: "Conflict Nine", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-author-1", captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "ta-author-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CONTENT_NOT_PENDING_APPROVAL (${err}), not ERR_SOD_AUTHOR_CANNOT_APPROVE"

      - name: enroll_conflict_duplicate_beats_capacity
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_DUPLICATE_ENROLLMENT]
          - errors[ERR_SESSION_FULL]
        distinguishing_aspect: |
          Error-category pair (business_constraint, business_fiscal): the rep
          already holds an active enrollment for the content AND the target
          session is full (capacity 1 taken); the duplicate-enrollment
          constraint error MUST win (priority 6 before 8). Different category
          pair than (state, business_safety).
        test_recipe:
          setup:
            - "Rep CRD-PC2; INSTRUCTOR_LED content APPROVED; session capacity 1 in Room-Dup; rep already ENROLLED via that session (seat full)"
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-PC2", full_name: "Pc Two", email: "pc2@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "IL", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "ILT-DUP", title: "ILT Duplicate", ce_category: FIRM_ELEMENT, delivery_format: INSTRUCTOR_LED, credit_hours: 2.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /sessions", payload: { content_id: "${c_id}", room_name: "Room-Dup", start_at: "2026-09-15T09:00:00Z", end_at: "2026-09-15T11:00:00Z", capacity: 1 }, as: TrainingAdmin, captures: { sess_id: "$.data.id" } }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", session_id: "${sess_id}" }, as: TrainingAdmin, captures: { e1_id: "$.data.id" } }
          trigger:
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", session_id: "${sess_id}" }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_ENROLLMENT (${err}), not ERR_SESSION_FULL"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: session_seat_boundary_exact_capacity
        grounds:
          - calculations.session_seat_accounting
          - errors[ERR_SESSION_FULL]
          - entities.CourseSession.fields.available_seats
        distinguishing_aspect: |
          Count-metric boundary on POST /enrollments: with capacity 2 the 1st and
          2nd session enrollments succeed (the capacity-th seat is allowed because
          the guard is active_holders >= capacity evaluated before insert) and the
          3rd fails with ERR_SESSION_FULL; available_seats reads exactly 0 at the
          boundary.
        test_recipe:
          setup:
            - "Three reps; INSTRUCTOR_LED content APPROVED; session capacity 2 in Room-Seat"
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-SB1", full_name: "Sb One", email: "sb1@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /representatives", payload: { crd_number: "CRD-SB2", full_name: "Sb Two", email: "sb2@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { r2: "$.data.id" } }
            - { call: "POST /representatives", payload: { crd_number: "CRD-SB3", full_name: "Sb Three", email: "sb3@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { r3: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "ILT-SEAT", title: "ILT Seat", ce_category: FIRM_ELEMENT, delivery_format: INSTRUCTOR_LED, credit_hours: 2.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /sessions", payload: { content_id: "${c_id}", room_name: "Room-Seat", start_at: "2026-09-16T09:00:00Z", end_at: "2026-09-16T11:00:00Z", capacity: 2 }, as: TrainingAdmin, captures: { sess_id: "$.data.id" } }
          trigger:
            - { call: "POST /enrollments", payload: { rep_id: "${r1}", session_id: "${sess_id}" }, as: TrainingAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /enrollments", payload: { rep_id: "${r2}", session_id: "${sess_id}" }, as: TrainingAdmin, captures: { e2: "$.data.id" } }
            - { call: "GET /sessions/${sess_id}", payload: {}, as: TrainingAdmin, captures: { seats_now: "$.data.available_seats" } }
            - { call: "POST /enrollments", payload: { rep_id: "${r3}", session_id: "${sess_id}" }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "enrollment 1 (${e1}) and enrollment 2 (${e2}) both created (201)"
            - "CourseSession.${sess_id}.available_seats == 0 (${seats_now})"
            - "third enrollment rejected with error_id == ERR_SESSION_FULL (${err})"

      - name: assignment_due_boundary_inclusive_completion
        grounds:
          - calculations.assignment_clock
          - entities.RegulatoryAssignment.fields.due_at
          - entities.RegulatoryAssignment.fields.completed_at
        distinguishing_aspect: |
          Timestamp-metric boundary on POST /enrollments/{id}/complete (different
          metric and endpoint than the seat-count boundary): completing exactly at
          due_at (2026-11-29T00:00:00Z) is ON TIME because the on-time rule is
          inclusive (completed_at <= due_at); the assignment lands COMPLETED and
          the rep stays ACTIVE.
        test_recipe:
          setup:
            - "Clock T0 = 2026-08-01T00:00:00Z; rep; REGULATORY_ELEMENT content APPROVED"
            - "Assignment created at T0: due_at = T0 + 120d = 2026-11-29T00:00:00Z"
            - "Enrollment created at T0+60d (2026-09-30; expires T0+150d = 2026-12-29T00:00:00Z) and started"
            - "Clock set to exactly 2026-11-29T00:00:00Z (the due instant; enrollment still unexpired)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-BD2", full_name: "Bd Two", email: "bd2@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NV", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "RE-BD", title: "Reg Element Boundary", ce_category: REGULATORY_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { rc_id: "$.data.id" } }
            - { call: "POST /contents/${rc_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${rc_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /regulatory-assignments", payload: { rep_id: "${rep_id}", cycle_year: 2026 }, as: TrainingAdmin, captures: { asg_id: "$.data.id", due_at: "$.data.due_at" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${rc_id}" }, as: TrainingAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-29T00:00:00Z" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 85 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "GET /regulatory-assignments/${asg_id}", payload: {}, as: ComplianceOfficer }
            - { call: "GET /representatives/${rep_id}", payload: {}, as: ComplianceOfficer }
          assert:
            - "Enrollment.${e_id}.enrollment_status == COMPLETED"
            - "RegulatoryAssignment.${asg_id}.due_at == 2026-11-29T00:00:00Z (${due_at})"
            - "RegulatoryAssignment.${asg_id}.assignment_status == COMPLETED"
            - "RegulatoryAssignment.${asg_id}.completed_at == 2026-11-29T00:00:00Z — completion exactly at due_at is on time"
            - "Representative.${rep_id}.registration_status == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enroll_requires_content_approved
        grounds:
          - "endpoints.POST /enrollments"
          - validations[priority=4]
          - errors[ERR_CONTENT_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair Enrollment x TrainingContent: enrollment creation is
          rejected while the referenced content is still DRAFT — the valid
          transition set of the new Enrollment depends on TrainingContent's
          content_status.
        test_recipe:
          setup:
            - "Rep CRD-CE1 ACTIVE; content DRAFT-1 authored but never submitted (DRAFT)"
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-CE1", full_name: "Ce One", email: "ce1@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "DRAFT-1", title: "Draft Course", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 1.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
          trigger:
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CONTENT_NOT_APPROVED (${err})"
            - "no Enrollment row created for (${rep_id}, ${c_id}) — GET /enrollments?rep_id=${rep_id} returns empty list"

      - name: attest_requires_plan_closed
        grounds:
          - state_machines.AnnualAttestation.PENDING_to_ATTESTED
          - errors[ERR_PLAN_NOT_CLOSED]
        distinguishing_aspect: |
          Entity pair AnnualAttestation x FirmElementPlan (different pair than
          Enrollment x TrainingContent): attesting is rejected while the parent
          plan is PLAN_PUBLISHED but not yet CLOSED.
        test_recipe:
          setup:
            - "Rep CRD-CE2; plan 2026 published (needs analysis recorded) so a PENDING attestation exists; no hours completed, plan not closed"
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-CE2", full_name: "Ce Two", email: "ce2@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "GA", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id", rep_v: "$.data.version" } }
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v}" }, as: TrainingAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /firm-element-plans/${plan_id}/needs-analysis", payload: { analysis_document_ref: "doc-ce2-na", analysis_notes: "annual needs analysis" }, as: TrainingAdmin }
            - { call: "POST /firm-element-plans/${plan_id}/publish", payload: {}, as: TrainingAdmin }
            - { call: "GET /attestations?plan_id=${plan_id}", payload: {}, as: TrainingAdmin, captures: { att_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /attestations/${att_id}/attest", payload: { attestation_statement: "I attest completion of my plan." }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PLAN_NOT_CLOSED (${err})"
            - "AnnualAttestation.${att_id}.attestation_status == PENDING"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_overlap_half_open_adjacency_allowed
        grounds:
          - errors[ERR_ROOM_CONFLICT]
          - validations[priority=7]
          - entities.CourseSession.fields.room_name
        distinguishing_aspect: |
          Room resource, HALF-OPEN interval semantics [start_at, end_at): a
          session starting exactly when another ends (11:00 == 11:00) does NOT
          conflict, while a genuinely intersecting session does — adjacency is
          allowed only because the comparison is strict.
        test_recipe:
          setup:
            - "INSTRUCTOR_LED content APPROVED; session S1 in Room-Ovl [2026-09-01T09:00:00Z, 2026-09-01T11:00:00Z)"
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "ILT-RM", title: "ILT Room", ce_category: FIRM_ELEMENT, delivery_format: INSTRUCTOR_LED, credit_hours: 2.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /sessions", payload: { content_id: "${c_id}", room_name: "Room-Ovl", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T11:00:00Z", capacity: 10 }, as: TrainingAdmin, captures: { s1: "$.data.id" } }
          trigger:
            - { call: "POST /sessions", payload: { content_id: "${c_id}", room_name: "Room-Ovl", start_at: "2026-09-01T11:00:00Z", end_at: "2026-09-01T12:00:00Z", capacity: 10 }, as: TrainingAdmin, captures: { s2: "$.data.id" } }
            - { call: "POST /sessions", payload: { content_id: "${c_id}", room_name: "Room-Ovl", start_at: "2026-09-01T10:30:00Z", end_at: "2026-09-01T11:30:00Z", capacity: 10 }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "adjacent session created successfully (id ${s2}) — half-open semantics permit start == prior end"
            - "overlapping session rejected with error_id == ERR_ROOM_CONFLICT (${err})"

      - name: blackout_overlap_closed_interval_touching_conflicts
        grounds:
          - errors[ERR_BLACKOUT_CONFLICT]
          - validations[priority=7]
          - entities.TrainingBlackoutWindow.fields.start_at
        distinguishing_aspect: |
          TrainingBlackoutWindow resource with CLOSED-interval semantics — a
          session whose end_at equals the blackout start_at still conflicts
          (session.start <= blackout.end AND blackout.start <= session.end),
          the exact geometric adjacency the room rule permits; different
          interval semantics on a different resource entity.
        test_recipe:
          setup:
            - "INSTRUCTOR_LED content APPROVED; blackout window [2026-09-10T00:00:00Z, 2026-09-11T00:00:00Z] declared (closed both ends)"
          setup_api_calls:
            - { call: "POST /contents", payload: { code: "ILT-BL", title: "ILT Blackout", ce_category: FIRM_ELEMENT, delivery_format: INSTRUCTOR_LED, credit_hours: 2.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /blackout-windows", payload: { label: "regulatory exam window", start_at: "2026-09-10T00:00:00Z", end_at: "2026-09-11T00:00:00Z" }, as: ComplianceOfficer, captures: { bw_id: "$.data.id" } }
          trigger:
            - { call: "POST /sessions", payload: { content_id: "${c_id}", room_name: "Room-Bl", start_at: "2026-09-09T23:00:00Z", end_at: "2026-09-10T00:00:00Z", capacity: 10 }, as: TrainingAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /sessions", payload: { content_id: "${c_id}", room_name: "Room-Bl", start_at: "2026-09-12T09:00:00Z", end_at: "2026-09-12T10:00:00Z", capacity: 10 }, as: TrainingAdmin, captures: { s_clear: "$.data.id" } }
          assert:
            - "touching session (end_at == blackout start) rejected with error_id == ERR_BLACKOUT_CONFLICT (${err})"
            - "disjoint session on 2026-09-12 created successfully (id ${s_clear})"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: seat_ledger_enroll_cancel_invariant
        grounds:
          - calculations.session_seat_accounting
          - state_machines.Enrollment.ENROLLED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = session seat ledger: the forward action (enroll)
          consumes one seat and the compensating action (cancel) releases it, so
          available_seats MUST return to its exact pre-enroll value
          (available_seats == capacity - active seat holders).
        test_recipe:
          setup:
            - "Rep; INSTRUCTOR_LED content APPROVED; session Room-Inv capacity 2 (available_seats == 2)"
          setup_api_calls:
            - { call: "POST /representatives", payload: { crd_number: "CRD-INV1", full_name: "Inv One", email: "inv1@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "NY", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /contents", payload: { code: "ILT-INV", title: "ILT Invariant", ce_category: FIRM_ELEMENT, delivery_format: INSTRUCTOR_LED, credit_hours: 2.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /sessions", payload: { content_id: "${c_id}", room_name: "Room-Inv", start_at: "2026-09-20T09:00:00Z", end_at: "2026-09-20T10:00:00Z", capacity: 2 }, as: TrainingAdmin, captures: { sess_id: "$.data.id", seats0: "$.data.available_seats" } }
          trigger:
            - { call: "POST /enrollments", payload: { rep_id: "${r1}", session_id: "${sess_id}" }, as: TrainingAdmin, captures: { e_id: "$.data.id" } }
            - { call: "GET /sessions/${sess_id}", payload: {}, as: TrainingAdmin, captures: { seats1: "$.data.available_seats" } }
            - { call: "POST /enrollments/${e_id}/cancel", payload: {}, as: TrainingAdmin }
            - { call: "GET /sessions/${sess_id}", payload: {}, as: TrainingAdmin, captures: { seats2: "$.data.available_seats" } }
          assert:
            - "available_seats before enrollment == 2 (${seats0})"
            - "available_seats after enrollment == 1 (${seats1})"
            - "available_seats after cancellation == 2 (${seats2}) — enroll+cancel pair leaves the seat ledger unchanged"

      - name: plan_hours_complete_void_invariant
        grounds:
          - calculations.plan_progress_hours
          - state_machines.Enrollment.COMPLETED_to_VOIDED
          - entities.FirmElementPlan.fields.certified_hours
        distinguishing_aspect: |
          Conserved quantity = plan credit-hour ledger (a different quantity than
          seats): a completion credits 4.0 hours and its compensating void debits
          exactly them back, so certified_hours returns to its pre-completion
          value 0 with no drift.
        test_recipe:
          setup:
            - "RR rep, excess 0; FIRM_ELEMENT content 4.0h APPROVED; plan 2026 published (required 12); certified_hours == 0"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /representatives", payload: { crd_number: "CRD-INV2", full_name: "Inv Two", email: "inv2@x.com", role_tier: RR, insurance_licensed: false, resident_state_code: "OH", prior_year_excess_hours: 0 }, as: TrainingAdmin, captures: { rep_id: "$.data.id", rep_v: "$.data.version" } }
            - { call: "POST /contents", payload: { code: "FE-INV", title: "Firm Element Invariant", ce_category: FIRM_ELEMENT, delivery_format: ELEARNING, credit_hours: 4.0, min_passing_score: 70 }, as: TrainingAdmin, as_user_id: "ta-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /contents/${c_id}/submit", payload: {}, as: TrainingAdmin, as_user_id: "ta-1" }
            - { call: "POST /contents/${c_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /firm-element-plans", payload: { rep_id: "${rep_id}", plan_year: 2026, expected_representative_version: "${rep_v}" }, as: TrainingAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /firm-element-plans/${plan_id}/needs-analysis", payload: { analysis_document_ref: "doc-inv2-na", analysis_notes: "annual needs analysis" }, as: TrainingAdmin }
            - { call: "POST /firm-element-plans/${plan_id}/publish", payload: {}, as: TrainingAdmin }
            - { call: "GET /firm-element-plans/${plan_id}", payload: {}, as: TrainingAdmin, captures: { h0: "$.data.certified_hours" } }
          trigger:
            - { call: "POST /enrollments", payload: { rep_id: "${rep_id}", content_id: "${c_id}" }, as: TrainingAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /enrollments/${e_id}/start", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "POST /enrollments/${e_id}/complete", payload: { score: 88 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "GET /firm-element-plans/${plan_id}", payload: {}, as: TrainingAdmin, captures: { h1: "$.data.certified_hours" } }
            - { call: "POST /enrollments/${e_id}/void", payload: { justification: "duplicate credit recorded by vendor" }, as: ComplianceOfficer }
            - { call: "GET /firm-element-plans/${plan_id}", payload: {}, as: TrainingAdmin, captures: { h2: "$.data.certified_hours" } }
          assert:
            - "certified_hours before completion == 0 (${h0})"
            - "certified_hours after completion == 4.0 (${h1})"
            - "certified_hours after void == 0 (${h2}) — complete+void pair conserves the credit-hour ledger"
