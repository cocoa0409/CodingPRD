            - "Membership.${m_b_id}.volunteer_credits_earned == 0 at this point, because only COMPLETED assignments earn credits and no meet has been HOSTED yet"

  # ===========================================================================
  # Rule 7 - cross-entity state dependencies over different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: registration_confirm_requires_membership_access_active_and_dues_invoiced
        grounds:
          - state_machines[SwimTeamRegistration].PENDING_to_CONFIRMED
          - validations[priority=46]
          - errors[ERR_MEMBERSHIP_NOT_IN_GOOD_STANDING]
          - entities.Membership.fields.volunteer_credits_required
          - endpoints[POST /swim-club/swim-team-registrations/{id}/transitions]
        distinguishing_aspect: |
          The dependent pair is SwimTeamRegistration -> Membership: a registration's own status is
          legal (PENDING) and its own payload is untouched, yet the CONFIRMED transition is
          refused purely because of the state of a DIFFERENT row - the parent Membership, on both
          of its parallel dimensions at once (access_status must be ACTIVE and dues_status must be
          INVOICED or PAID). Confirming becomes legal the instant a third endpoint
          (POST /swim-club/memberships/{id}/invoice) moves the other entity, with no write to the
          registration in between. The companion instance
          guard_shift_confirm_requires_valid_lifeguard_and_cpr_certifications uses a completely
          different pair, GuardShift -> Certification/Lifeguard, across an aggregate boundary
          rather than a parent link.
        test_recipe:
          setup:
            - "One FAMILY category (volunteer_credits_required 4) and one OPEN 2027 season."
            - "One household in GOOD_STANDING with a Membership that has NOT been invoiced: dues_status UNBILLED, access_status PENDING."
            - "One SwimTeamRegistration created against that membership. Creation is legal because priority 46 relaxes to access_status IN {PENDING, ACTIVE} for registration creation - swimmers must be on the list before the invoice bills them."
            - "The JUNIOR squad is empty, so the registration is born PENDING rather than WAITLISTED and priority 75 never fires."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-06T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "FAMILY", label: "Family", bond_cents: 120000, initiation_fee_cents: 45000, seasonal_dues_cents: 78000, guest_pass_allotment: 4, max_household_size: 6, volunteer_credits_required: 4, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_family_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Alvarez Household", address_line: "14 Poolside Lane", residency: "IN_DISTRICT", member_count: 4, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_family_id}", season_id: "${s27_id}", join_date: "2027-07-05", bond_payment_plan: "INSTALLMENTS" }
              as: MembershipChair
              captures: { m_a_id: $.data.id, m_dues_0: $.data.dues_status, m_access_0: $.data.access_status }
            - call: "POST /swim-club/swim-team-registrations"
              payload: { membership_id: "${m_a_id}", season_id: "${s27_id}", swimmer_name: "Nina Alvarez", swimmer_birthdate: "2015-06-11", squad: "JUNIOR" }
              as: SwimTeamCoach
              captures: { r_a_id: $.data.id, r_status_0: $.data.status, r_seq_0: $.data.squad_seq }
          trigger:
            - call: "POST /swim-club/swim-team-registrations/${r_a_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: SwimTeamCoach
              captures: { err_not_invoiced: $.data.error_id }
            - call: "POST /swim-club/memberships/${m_a_id}/invoice"
              payload: {}
              as: Treasurer
              captures: { m_dues_1: $.data.dues_status, m_access_1: $.data.access_status }
            - call: "POST /swim-club/swim-team-registrations/${r_a_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: SwimTeamCoach
              captures: { r_status_1: $.data.status }
            - call: "GET /swim-club/memberships/${m_a_id}"
              payload: {}
              as: SwimTeamCoach
              captures: { m_req_1: $.data.volunteer_credits_required, m_fee_1: $.data.swim_team_fee_cents }
          assert:
            - "the registration is born status PENDING with squad_seq 1 and assessed_fee_cents 14500, even though the membership is uninvoiced"
            - "call 1 returns 409 with error_id ERR_MEMBERSHIP_NOT_IN_GOOD_STANDING, and SwimTeamRegistration.${r_a_id}.status is STILL PENDING afterwards - a refused transition writes nothing"
            - "call 1 does NOT return ERR_INVALID_TRANSITION: PENDING -> CONFIRMED is a declared edge, so priority 43 is satisfied and the refusal comes purely from the other entity's state"
            - "after the invoice, Membership.${m_a_id}.dues_status == INVOICED and access_status == ACTIVE"
            - "call 3 is byte-identical to call 1 yet succeeds: SwimTeamRegistration.${r_a_id}.status == CONFIRMED, with no write to the registration having occurred in between"
            - "the confirmation writes back across the same link: Membership.${m_a_id}.volunteer_credits_required == 4, i.e. min(VOLUNTEER_CREDIT_CAP 10, category.volunteer_credits_required 4 * 1 confirmed registration)"
            - "Membership.${m_a_id}.swim_team_fee_cents == 14500"

      - name: guard_shift_confirm_requires_valid_lifeguard_and_cpr_certifications
        grounds:
          - state_machines[GuardShift].SCHEDULED_to_CONFIRMED
          - state_machines[Certification].VALID_to_REVOKED
          - state_machines[Lifeguard].ACTIVE_to_INACTIVE
          - state_machines[Lifeguard].INACTIVE_to_ACTIVE
          - validations[priority=50]
          - endpoints[POST /swim-club/guard-shifts/{id}/transitions]
        distinguishing_aspect: |
          The dependent pair is GuardShift -> Certification, mediated by a THIRD entity
          (Lifeguard.employment_status), and it reaches across an aggregate boundary rather than
          down a parent link: the shift stores no certification data at all, yet its
          SCHEDULED -> CONFIRMED edge is gated on two Certification rows AND on the Lifeguard's
          derived employment_status, which the certification revocation itself flips. Revoking the
          LIFEGUARD certification therefore breaks two preconditions with one write and issuing a
          replacement repairs both. That is a different entity pair and a different mediation
          shape from registration_confirm_requires_membership_access_active_and_dues_invoiced,
          where the gate is the immediate parent's own two status dimensions.
        test_recipe:
          setup:
            - "One OPEN 2027 season."
            - "One Lifeguard with a VALID LIFEGUARD certification and a VALID CPR_AED certification, both expiring 2027-12-31, so employment_status is ACTIVE and both derived cert flags are true."
            - "One GuardShift for that guard on 2027-07-20 from 09:00:00Z to 13:00:00Z, created while both certifications were valid so priority 50 passed at creation, and left in SCHEDULED."
            - "The LIFEGUARD certification is then REVOKED, which cascades the Lifeguard to employment_status INACTIVE because no VALID LIFEGUARD row remains."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-06T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/lifeguards"
              payload: { full_name: "Ivy Okafor", hire_date: "2027-05-01" }
              as: PoolManager
              captures: { lg1_id: $.data.id, lg1_employment_0: $.data.employment_status }
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg1_id}", cert_type: "LIFEGUARD", issued_on: "2027-01-10", expires_on: "2027-12-31" }
              as: PoolManager
              captures: { cert_lg_id: $.data.id }
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg1_id}", cert_type: "CPR_AED", issued_on: "2027-01-10", expires_on: "2027-12-31" }
              as: PoolManager
              captures: { cert_cpr_id: $.data.id }
            - call: "POST /swim-club/guard-shifts"
              payload: { lifeguard_id: "${lg1_id}", season_id: "${s27_id}", shift_role: "PRIMARY", start_iso: "2027-07-20T09:00:00Z", end_iso: "2027-07-20T13:00:00Z" }
              as: PoolManager
              captures: { sh1_id: $.data.id, sh1_status_0: $.data.status, sh1_counts: $.data.counts_toward_ratio }
            - call: "POST /swim-club/certifications/${cert_lg_id}/revoke"
              payload: { revoked_reason: "Lifeguard Training card withdrawn after a failed in-service audit" }
              as: PoolManager
              captures: { cert_lg_status: $.data.status }
            - call: "GET /swim-club/lifeguards/${lg1_id}"
              payload: {}
              as: PoolManager
              captures: { lg1_employment_1: $.data.employment_status, lg1_has_lg_1: $.data.has_valid_lifeguard_cert, lg1_has_cpr_1: $.data.has_valid_cpr_cert }
          trigger:
            - call: "POST /swim-club/guard-shifts/${sh1_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: PoolManager
              captures: { err_cert_wall: $.data.error_id }
            - call: "POST /swim-club/certifications"
              payload: { lifeguard_id: "${lg1_id}", cert_type: "LIFEGUARD", issued_on: "2027-07-15", expires_on: "2028-07-14" }
              as: PoolManager
              captures: { cert_lg2_id: $.data.id, cert_lg2_status: $.data.status }
            - call: "GET /swim-club/lifeguards/${lg1_id}"
              payload: {}
              as: PoolManager
              captures: { lg1_employment_2: $.data.employment_status, lg1_has_lg_2: $.data.has_valid_lifeguard_cert }
            - call: "POST /swim-club/guard-shifts/${sh1_id}/transitions"
              payload: { to_status: "CONFIRMED" }
              as: PoolManager
              captures: { sh1_status_1: $.data.status }
            - call: "GET /swim-club/seasons/${s27_id}/staffing-window"
              payload: { at_iso: "2027-07-20T13:00:00Z" }
              as: PoolManager
              captures: { window_at_handover: $.data }
          assert:
            - "the shift is created SCHEDULED with counts_toward_ratio true (shift_role PRIMARY) and Lifeguard.${lg1_id}.scheduled_hours == 4"
            - "after the revoke: Certification.${cert_lg_id}.status == REVOKED, Lifeguard.${lg1_id}.has_valid_lifeguard_cert == false, has_valid_cpr_cert == true, employment_status == INACTIVE"
            - "call 1 returns 422 with error_id ERR_CERT_NOT_VALID_FOR_SHIFT, and GuardShift.${sh1_id}.status is STILL SCHEDULED - two preconditions (the cert wall and lifeguard.employment_status == ACTIVE) are broken by that single revocation"
            - "issuing the replacement LIFEGUARD certification returns status VALID and does NOT supersede the REVOKED row, and it cascades Lifeguard.${lg1_id}.employment_status back to ACTIVE"
            - "call 4 is byte-identical to call 1 yet succeeds: GuardShift.${sh1_id}.status == CONFIRMED, with no write to the shift in between"
            - "the replacement certification's expires_on 2028-07-14 is >= date(shift.end_iso) 2027-07-20, so the cert wall's expiry arm is satisfied as well as its existence arm"
            - "the staffing window probed at exactly 2027-07-20T13:00:00Z reports scheduled_guard_count 1, because shifts use a CLOSED interval and the guard is counted at the handover instant"

  # ===========================================================================
  # Rule 8 - resource/temporal overlap with different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: guard_shift_rest_buffer_closed_interval_rejects_adjacency_allows_exact_30_minutes
        grounds:
          - validations[priority=62]
          - errors[ERR_SHIFT_REST_BUFFER_VIOLATION]
          - endpoints[POST /swim-club/guard-shifts]
        distinguishing_aspect: |
          The interval semantics under test are CLOSED [start_iso, end_iso] plus a
          SHIFT_REST_BUFFER_MINUTES 30 separation requirement on a per-lifeguard resource: two
          shifts that merely touch are REJECTED, 25 minutes apart is rejected, and a gap of exactly
          30 minutes is accepted (the buffer boundary is inclusive). The companion instance
          party_zone_half_open_interval_allows_adjacency_and_whole_facility_conflicts_every_zone
          uses the OPPOSITE convention - half-open [start_iso, end_iso) with a zero-minute buffer
          on a per-zone resource - where touching is explicitly ALLOWED. The two rules therefore
          give opposite verdicts on the same adjacency shape, which is what makes a
          copy-paste overlap helper fail.
        test_recipe:
          setup:
            - "One OPEN 2027 season."
            - "One Lifeguard with a VALID LIFEGUARD certification and a VALID CPR_AED certification, both expiring 2027-12-31, so priority 50 never interferes with any of the four creation attempts."
            - "One anchor GuardShift for that guard on 2027-07-20 from 09:00:00Z to 13:00:00Z, left in SCHEDULED (priority 62 counts SCHEDULED as well as CONFIRMED, so no confirmation is needed to make it block)."
            - "All four candidate windows are inside the season window and after the anchor, so priority 60 and priority 12 are satisfied in every attempt."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-06T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120, proration_basis: "CALENDAR_DAY", guest_settlement_policy: "PASS_FIRST" }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/lifeguards"
              payload: { full_name: "Ivy Okafor", hire_date: "2027-05-01" }
              as: PoolManager
