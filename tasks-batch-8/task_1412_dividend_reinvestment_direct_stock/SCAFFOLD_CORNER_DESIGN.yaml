scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: plan_create_applies_field_defaults
        claim_type: defaults
        grounds: [entities.Plan.fields.pricing_basis, entities.Plan.fields.basis_method, entities.Plan.fields.status]
        distinguishing_aspect: "Omitting pricing_basis/basis_method applies defaults MARKET_CLOSE/FIFO and initial status DRAFT."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Def Corp", ticker: "DEF", name: "DEF DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_d: $.data.id } }
          trigger:
            - { call: "GET /drip/plans/${plan_d}", as: PlanAdmin }
          assert:
            - "Plan.${plan_d}.pricing_basis == MARKET_CLOSE and basis_method == FIFO"
            - "Plan.${plan_d}.status == DRAFT and version == 1"

      - name: plan_create_missing_required_name
        claim_type: required_fields
        grounds:
          - entities.Plan.fields.name
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting the required input field name is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /drip/plans", payload: { issuer_name: "NoName Corp", ticker: "NN", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (http 400)"

      - name: participant_create_returns_stored_fields
        claim_type: creation
        grounds: [entities.Participant.fields.fee_waiver_eligible]
        distinguishing_aspect: "POST /drip/participants returns 201 with the stored fields and fee_waiver_eligible defaulting to false."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /drip/participants", payload: { full_name: "Pat C", email: "pc@x.com" }, as: PlanAdmin, captures: { p_c: $.data.id } }
          assert:
            - "201 response: full_name == 'Pat C', email == 'pc@x.com', fee_waiver_eligible == false, version == 1"

      - name: enrollment_create_starts_pending
        claim_type: initial_state
        grounds: [state_machines.Enrollment, entities.Enrollment.fields.status]
        distinguishing_aspect: "A newly created enrollment starts in PENDING with share_balance 0.0000 and total_cost_basis_cents 0."
        test_recipe:
          setup: ["ACTIVE plan and registered participant"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Pend Corp", ticker: "PND", name: "PND DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_n: $.data.id } }
            - { call: "POST /drip/plans/${plan_n}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat N2", email: "pn2@x.com" }, as: PlanAdmin, captures: { p_n2: $.data.id } }
          trigger:
            - { call: "POST /drip/plans/${plan_n}/enrollments", payload: { participant_id: "${p_n2}", election: "CASH_ONLY" }, as: Participant, as_user_id: "${p_n2}", captures: { e_n2: $.data.id } }
          assert:
            - "Enrollment.${e_n2}.status == PENDING, share_balance == 0.0000, total_cost_basis_cents == 0"

      - name: get_plan_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET with a well-formed but nonexistent plan UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /drip/plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: participant_create_injected_id_input_ignored
        claim_type: system_fields
        grounds: [entities.Participant]
        distinguishing_aspect: "Client-supplied id in a create body is ignored; the server mints its own UUID."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /drip/participants", payload: { full_name: "Pat I", email: "pi@x.com", id: "11111111-2222-4333-8444-555555555555" }, as: PlanAdmin, captures: { p_i: $.data.id } }
          assert:
            - "Response id is a server-minted UUID different from 11111111-2222-4333-8444-555555555555"

      - name: enrollment_create_invalid_enum_election
        claim_type: type_constraints
        grounds:
          - entities.Enrollment.fields.election
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "election 'HALF' is not a declared enum member and is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["ACTIVE plan and participant"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Enum Corp", ticker: "ENU", name: "ENU DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_e: $.data.id } }
            - { call: "POST /drip/plans/${plan_e}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat E", email: "pe@x.com" }, as: PlanAdmin, captures: { p_e: $.data.id } }
          trigger:
            - { call: "POST /drip/plans/${plan_e}/enrollments", payload: { participant_id: "${p_e}", election: "HALF" }, as: Participant, as_user_id: "${p_e}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (http 400)"

      - name: ledger_entry_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.ShareLedgerEntry]
        distinguishing_aspect: "ShareLedgerEntry declares common_fields false: entries expose id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["ACTIVE plan with ACTIVE enrollment that has one INITIAL deposit"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Log Corp", ticker: "LOG", name: "LOG DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_g2: $.data.id } }
            - { call: "POST /drip/plans/${plan_g2}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat L2", email: "pl2@x.com" }, as: PlanAdmin, captures: { p_l2: $.data.id } }
            - { call: "POST /drip/plans/${plan_g2}/enrollments", payload: { participant_id: "${p_l2}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_l2}", captures: { e_l2: $.data.id } }
            - { call: "POST /drip/enrollments/${e_l2}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_l2}/deposits", payload: { quantity: 3.0, cost_per_share_cents: 1000 }, as: PlanAdmin }
          trigger:
            - { call: "GET /drip/enrollments/${e_l2}/ledger-entries", as: PlanAdmin }
          assert:
            - "Single INITIAL entry: quantity == 3.0000, price_cents == 1000, has id and created_at"
            - "Entry object has no version key and no updated_at key"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: dividend_execute_from_declared_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.DividendEvent
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "execute is only valid from PRICED; calling it on a DECLARED dividend fails with ERR_INVALID_STATE and no ledger entries are created."
        test_recipe:
          setup: ["ACTIVE plan with a DECLARED dividend"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Div Corp", ticker: "DIV", name: "DIV DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_dv: $.data.id } }
            - { call: "POST /drip/plans/${plan_dv}/publish", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_dv}/dividend-events", payload: { amount_per_share_cents: 50, record_date: "2026-09-10T00:00:00Z", payable_date: "2026-09-20T00:00:00Z" }, as: PlanAdmin, captures: { d_dv: $.data.id } }
          trigger:
            - { call: "POST /drip/dividend-events/${d_dv}/execute", as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "DividendEvent.${d_dv}.status remains DECLARED"

      - name: window_settle_from_open_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.PurchaseWindow
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "settle is only valid from CLOSED; calling it on an OPEN window fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE plan with an OPEN window (clock 2026-09-02)"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Win Corp", ticker: "WIN", name: "WIN DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_w: $.data.id } }
            - { call: "POST /drip/plans/${plan_w}/publish", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_w}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_w: $.data.id } }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_w}/open", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/purchase-windows/${w_w}/settle", as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "PurchaseWindow.${w_w}.status remains OPEN"

      - name: order_cancel_after_window_closed_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PurchaseOrder.SUBMITTED_to_CANCELLED
          - errors[ERR_WINDOW_NOT_OPEN]
        distinguishing_aspect: "Cancelling a SUBMITTED order once its window is CLOSED fails with ERR_WINDOW_NOT_OPEN; the order stays SUBMITTED awaiting settlement."
        test_recipe:
          setup: ["ACTIVE plan, ACTIVE enrollment, window with one SUBMITTED order 12000, window CLOSED at clock 2026-09-16"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Can Corp", ticker: "CAN", name: "CAN DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_cn: $.data.id } }
            - { call: "POST /drip/plans/${plan_cn}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Cn", email: "pcn@x.com" }, as: PlanAdmin, captures: { p_cn: $.data.id } }
            - { call: "POST /drip/plans/${plan_cn}/enrollments", payload: { participant_id: "${p_cn}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_cn}", captures: { e_cn: $.data.id } }
            - { call: "POST /drip/enrollments/${e_cn}/activate", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_cn}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_cn: $.data.id } }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_cn}/open", as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_cn}/purchase-orders", payload: { enrollment_id: "${e_cn}", amount_cents: 12000 }, as: Participant, as_user_id: "${p_cn}", captures: { o_cn: $.data.id } }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_cn}/close", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/purchase-orders/${o_cn}/cancel", as: Participant, as_user_id: "${p_cn}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_WINDOW_NOT_OPEN (http 409)"
            - "PurchaseOrder.${o_cn}.status remains SUBMITTED"

      - name: plan_terminated_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Plan
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "TERMINATED is terminal: both resume and suspend on a terminated plan fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Plan published then terminated"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Lock Corp", ticker: "LCK", name: "LCK DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_lk: $.data.id } }
            - { call: "POST /drip/plans/${plan_lk}/publish", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_lk}/terminate", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/plans/${plan_lk}/resume", as: PlanAdmin, captures: { err_resume: $.data.error_id } }
            - { call: "POST /drip/plans/${plan_lk}/suspend", as: PlanAdmin, captures: { err_suspend: $.data.error_id } }
          assert:
            - "err_resume == ERR_INVALID_STATE and err_suspend == ERR_INVALID_STATE (both http 409)"
            - "Plan.${plan_lk}.status remains TERMINATED"

      - name: enrollment_second_activate_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Enrollment.PENDING_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Repeating the activate trigger on an already-ACTIVE enrollment is not idempotent: it fails with ERR_INVALID_STATE and no duplicate enrollment fee is created."
        test_recipe:
          setup: ["ACTIVE plan with one already-ACTIVE enrollment"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Twice Corp", ticker: "TWC", name: "TWC DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_tw: $.data.id } }
            - { call: "POST /drip/plans/${plan_tw}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Tw", email: "ptw@x.com" }, as: PlanAdmin, captures: { p_tw: $.data.id } }
            - { call: "POST /drip/plans/${plan_tw}/enrollments", payload: { participant_id: "${p_tw}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_tw}", captures: { e_tw: $.data.id } }
            - { call: "POST /drip/enrollments/${e_tw}/activate", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/enrollments/${e_tw}/activate", as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409)"
            - "Fee list of ${e_tw} contains exactly one ENROLLMENT fee"

      - name: notice_take_effect_suspension_drives_plan
        claim_type: cross_entity
        grounds: [state_machines.PlanNotice.PUBLISHED_to_EFFECTIVE, state_machines.Plan.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Taking a PUBLISHED SUSPENSION notice into effect at/after effective_at drives the Plan ACTIVE->SUSPENDED transition with its enrollment cascade — a notice-entity trigger mutating the plan entity."
        test_recipe:
          setup:
            - "ACTIVE plan with one ACTIVE enrollment"
            - "PUBLISHED SUSPENSION notice effective 2026-08-15 (created at default clock 2026-08-01, 14 days lead)"
            - "Clock advanced to 2026-08-15T00:00:00Z"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Note Corp", ticker: "NTC", name: "NTC DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_nt: $.data.id } }
            - { call: "POST /drip/plans/${plan_nt}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Nt", email: "pnt@x.com" }, as: PlanAdmin, captures: { p_nt: $.data.id } }
            - { call: "POST /drip/plans/${plan_nt}/enrollments", payload: { participant_id: "${p_nt}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_nt}", captures: { e_nt: $.data.id } }
            - { call: "POST /drip/enrollments/${e_nt}/activate", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_nt}/notices", payload: { notice_type: "SUSPENSION", effective_at: "2026-08-15T00:00:00Z", message: "Plan will be suspended for maintenance" }, as: PlanAdmin, captures: { n_nt: $.data.id } }
            - { call: "POST /drip/notices/${n_nt}/publish", as: PlanAdmin }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: PlanAdmin }
          trigger:
            - { call: "POST /drip/notices/${n_nt}/take-effect", as: PlanAdmin }
            - { call: "GET /drip/plans/${plan_nt}", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_nt}", as: PlanAdmin }
          assert:
            - "PlanNotice.${n_nt}.status == EFFECTIVE"
            - "Plan.${plan_nt}.status == SUSPENDED"
            - "Enrollment.${e_nt}.status == SUSPENDED (cascade fired from the notice trigger)"

      - name: gift_execute_creates_only_source_movement
        claim_type: side_effect_execution
        grounds: [state_machines.TransferInstruction.SUBMITTED_to_EXECUTED, entities.ShareLedgerEntry.fields.entry_type]
        distinguishing_aspect: "A GIFT execution creates exactly one ledger movement (TRANSFER_OUT on the source) and no TRANSFER_IN anywhere; the shares leave the plan and the source drops by the gifted quantity."
        test_recipe:
          setup: ["ACTIVE plan, ACTIVE enrollment with 10.0000 @ 1000, SUBMITTED GIFT of 3.0000 to external recipient"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Gift Corp", ticker: "GFT", name: "GFT DRIP", discount_pct: 0.05, basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_gf: $.data.id } }
            - { call: "POST /drip/plans/${plan_gf}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Gf", email: "pgf@x.com" }, as: PlanAdmin, captures: { p_gf: $.data.id } }
            - { call: "POST /drip/plans/${plan_gf}/enrollments", payload: { participant_id: "${p_gf}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_gf}", captures: { e_gf: $.data.id } }
            - { call: "POST /drip/enrollments/${e_gf}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_gf}/deposits", payload: { quantity: 10.0, cost_per_share_cents: 1000 }, as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_gf}/transfers", payload: { transfer_type: "GIFT", quantity: 3.0, recipient_name: "Niece G", recipient_address: "3 Way" }, as: Participant, as_user_id: "${p_gf}", captures: { t_gf: $.data.id } }
          trigger:
            - { call: "POST /drip/transfer-instructions/${t_gf}/execute", payload: { fmv_per_share_cents: 2000 }, as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_gf}/ledger-entries", as: PlanAdmin }
          assert:
            - "Ledger of ${e_gf}: INITIAL +3.0000 and TRANSFER_OUT -3.0000 with price_cents == 2000; no TRANSFER_IN entry exists"
            - "Enrollment.${e_gf}.share_balance == 7.0000"
            - "TransferInstruction.${t_gf}.status == EXECUTED and fmv_per_share_cents == 2000"
            - "TRANSFER FeeAssessment on ${e_gf}: computed_cents == 300"

      - name: activate_assesses_enrollment_fee
        claim_type: side_effect_execution
        grounds: [state_machines.Enrollment.PENDING_to_ACTIVE, entities.FeeAssessment.fields.fee_type]
        distinguishing_aspect: "Activation creates an ENROLLMENT FeeAssessment equal to plan.enrollment_fee_cents (1000), charged in full (not waived) for a non-eligible participant."
        test_recipe:
          setup: ["ACTIVE plan (enrollment_fee_cents 1000) and a PENDING enrollment"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "FeeCorp2", ticker: "FE2", name: "FE2 DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_f2: $.data.id } }
            - { call: "POST /drip/plans/${plan_f2}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat F2", email: "pf2@x.com" }, as: PlanAdmin, captures: { p_f2: $.data.id } }
            - { call: "POST /drip/plans/${plan_f2}/enrollments", payload: { participant_id: "${p_f2}", election: "CASH_ONLY" }, as: Participant, as_user_id: "${p_f2}", captures: { e_f2: $.data.id } }
          trigger:
            - { call: "POST /drip/enrollments/${e_f2}/activate", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_f2}/fees", as: PlanAdmin }
          assert:
            - "Exactly one FeeAssessment: fee_type == ENROLLMENT, computed_cents == 1000, charged_cents == 1000, waived == false"

      - name: resume_does_not_restore_rejected_orders
        claim_type: compensation
        grounds: [state_machines.Plan.SUSPENDED_to_ACTIVE, state_machines.PurchaseOrder.SUBMITTED_to_REJECTED]
        distinguishing_aspect: "The resume cascade is deliberately asymmetric: enrollments return to ACTIVE but REJECTED orders stay REJECTED and the window total stays at 0 — no compensating restoration."
        test_recipe:
          setup: ["Plan suspended (which rejected a 12000-cent SUBMITTED order), then resumed"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Asym Corp", ticker: "ASY", name: "ASY DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_as: $.data.id } }
            - { call: "POST /drip/plans/${plan_as}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat As", email: "pas@x.com" }, as: PlanAdmin, captures: { p_as: $.data.id } }
            - { call: "POST /drip/plans/${plan_as}/enrollments", payload: { participant_id: "${p_as}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_as}", captures: { e_as: $.data.id } }
            - { call: "POST /drip/enrollments/${e_as}/activate", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_as}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_as: $.data.id } }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_as}/open", as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_as}/purchase-orders", payload: { enrollment_id: "${e_as}", amount_cents: 12000 }, as: Participant, as_user_id: "${p_as}", captures: { o_as: $.data.id } }
            - { call: "POST /drip/plans/${plan_as}/suspend", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/plans/${plan_as}/resume", as: PlanAdmin }
            - { call: "GET /drip/purchase-orders/${o_as}", as: PlanAdmin }
            - { call: "GET /drip/purchase-windows/${w_as}", as: PlanAdmin }
          assert:
            - "Plan.${plan_as}.status == ACTIVE and Enrollment.${e_as}.status == ACTIVE"
            - "PurchaseOrder.${o_as}.status remains REJECTED (not restored to SUBMITTED)"
            - "PurchaseWindow.${w_as}.submitted_total_cents == 0"

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: dividend_record_date_cutoff_excludes_late_shares
        claim_type: input_set_filtering
        grounds: [calculations.reinvestment_allocation]
        distinguishing_aspect: "Only ledger entries with created_at <= record_date count: 100 shares deposited before record date are eligible, 50 shares deposited after record date (before execution) are excluded from the dividend cash."
        test_recipe:
          setup:
            - "ACTIVE MARKET_CLOSE plan (discount 0.05), ACTIVE enrollment, 100.0000 shares deposited at clock 2026-09-01 (@ 1500)"
            - "PRICED dividend 50 cents/share, record 2026-09-10, payable 2026-09-20, closing 2000"
            - "Second deposit of 50.0000 shares at clock 2026-09-15 (after record date)"
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Cut Corp", ticker: "CUT", name: "CUT DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_cu: $.data.id } }
            - { call: "POST /drip/plans/${plan_cu}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Cu", email: "pcu@x.com" }, as: PlanAdmin, captures: { p_cu: $.data.id } }
            - { call: "POST /drip/plans/${plan_cu}/enrollments", payload: { participant_id: "${p_cu}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_cu}", captures: { e_cu: $.data.id } }
            - { call: "POST /drip/enrollments/${e_cu}/activate", as: PlanAdmin }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_cu}/deposits", payload: { quantity: 100.0, cost_per_share_cents: 1500 }, as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_cu}/dividend-events", payload: { amount_per_share_cents: 50, record_date: "2026-09-10T00:00:00Z", payable_date: "2026-09-20T00:00:00Z" }, as: PlanAdmin, captures: { d_cu: $.data.id } }
            - { call: "POST /drip/dividend-events/${d_cu}/price", payload: { closing_price_cents: 2000, avg5_price_cents: 2100 }, as: PlanAdmin }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_cu}/deposits", payload: { quantity: 50.0, cost_per_share_cents: 1500 }, as: PlanAdmin }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T10:00:00Z" }, as: PlanAdmin }
          trigger:
            - { call: "POST /drip/dividend-events/${d_cu}/execute", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_cu}/ledger-entries", as: PlanAdmin }
          assert:
            - "REINVEST entry quantity == 2.6316 (eligible cash 5000 cents from exactly 100.0000 shares, not 150.0000)"
            - "Enrollment.${e_cu}.share_balance == 152.6316 (both deposits present in the balance, only the first earned the dividend)"

      - name: partial_reinvest_split_rounds_reinvest_first
        claim_type: correct_result
        grounds: [calculations.dividend_cash_split]
        distinguishing_aspect: "PARTIAL_REINVEST 0.5 on a 5000-cent dividend reinvests 2500 (1.3158 shares @ 1900) and pays out the 2500-cent remainder; reinvest + payout == total exactly."
        test_recipe:
          setup: ["ACTIVE MARKET_CLOSE plan (discount 0.05), ACTIVE enrollment with election PARTIAL_REINVEST pct 0.5 holding 100.0000 @ 1500; PRICED dividend 50 cents/share closing 2000; clock 2026-09-20T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Part Corp", ticker: "PRT", name: "PRT DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_pr: $.data.id } }
            - { call: "POST /drip/plans/${plan_pr}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Pr", email: "ppr@x.com" }, as: PlanAdmin, captures: { p_pr: $.data.id } }
            - { call: "POST /drip/plans/${plan_pr}/enrollments", payload: { participant_id: "${p_pr}", election: "PARTIAL_REINVEST", reinvest_pct: 0.5 }, as: Participant, as_user_id: "${p_pr}", captures: { e_pr: $.data.id } }
            - { call: "POST /drip/enrollments/${e_pr}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_pr}/deposits", payload: { quantity: 100.0, cost_per_share_cents: 1500 }, as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_pr}/dividend-events", payload: { amount_per_share_cents: 50, record_date: "2026-09-10T00:00:00Z", payable_date: "2026-09-20T00:00:00Z" }, as: PlanAdmin, captures: { d_pr: $.data.id } }
            - { call: "POST /drip/dividend-events/${d_pr}/price", payload: { closing_price_cents: 2000, avg5_price_cents: 2100 }, as: PlanAdmin }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T10:00:00Z" }, as: PlanAdmin }
          trigger:
            - { call: "POST /drip/dividend-events/${d_pr}/execute", as: PlanAdmin }
            - { call: "GET /drip/enrollments/${e_pr}/ledger-entries", as: PlanAdmin }
          assert:
            - "REINVEST entry quantity == 1.3158 at price_cents == 1900"
            - "CASH_PAYOUT entry: quantity == 0 and cash_cents == 2500"
            - "Split invariant: reinvested 2500 + payout 2500 == 5000 total declared cash"
            - "Enrollment.${e_pr}.share_balance == 101.3158"

      - name: tax_report_aggregates_declared_dividends
        claim_type: correct_result
        grounds: [calculations.reinvestment_allocation, endpoints.tax-report]
        distinguishing_aspect: "The per-year tax report counts the FULL declared dividend cash (5000 cents) as dividends_cents even when the entire amount was reinvested rather than paid out."
        test_recipe:
          setup: ["ACTIVE plan, ACTIVE CASH_ONLY enrollment holding 100.0000 @ 1500, dividend 50 cents/share executed at clock 2026-09-20"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Tax Corp", ticker: "TAX", name: "TAX DRIP", discount_pct: 0.05, pricing_basis: "MARKET_CLOSE", basis_method: "FIFO", ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_tx: $.data.id } }
            - { call: "POST /drip/plans/${plan_tx}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Tx", email: "ptx@x.com" }, as: PlanAdmin, captures: { p_tx: $.data.id } }
            - { call: "POST /drip/plans/${plan_tx}/enrollments", payload: { participant_id: "${p_tx}", election: "CASH_ONLY" }, as: Participant, as_user_id: "${p_tx}", captures: { e_tx: $.data.id } }
            - { call: "POST /drip/enrollments/${e_tx}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_tx}/deposits", payload: { quantity: 100.0, cost_per_share_cents: 1500 }, as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_tx}/dividend-events", payload: { amount_per_share_cents: 50, record_date: "2026-09-10T00:00:00Z", payable_date: "2026-09-20T00:00:00Z" }, as: PlanAdmin, captures: { d_tx: $.data.id } }
            - { call: "POST /drip/dividend-events/${d_tx}/price", payload: { closing_price_cents: 2000, avg5_price_cents: 2100 }, as: PlanAdmin }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T10:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/dividend-events/${d_tx}/execute", as: PlanAdmin }
          trigger:
            - { call: "GET /drip/enrollments/${e_tx}/tax-report", payload: { year: 2026 }, as: PlanAdmin }
          assert:
            - "tax-report: dividends_cents == 5000, proceeds_cents == 0, basis_cents == 0, gain_cents == 0, basis_method == FIFO"
            - "CASH_ONLY execution produced one CASH_PAYOUT entry with cash_cents == 5000 and no REINVEST entry"

      - name: window_total_reconciles_on_order_cancel
        claim_type: derived_field_reconciliation
        grounds: [entities.PurchaseWindow.fields.submitted_total_cents, state_machines.PurchaseOrder.SUBMITTED_to_CANCELLED]
        distinguishing_aspect: "The window's submitted_total_cents derived field tracks order mutations: 12000 after submit, back to 0 after cancel."
        test_recipe:
          setup: ["ACTIVE plan, ACTIVE enrollment, OPEN window at clock 2026-09-02 with one SUBMITTED 12000-cent order"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Rec Corp", ticker: "REC", name: "REC DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_rc: $.data.id } }
            - { call: "POST /drip/plans/${plan_rc}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Rc", email: "prc@x.com" }, as: PlanAdmin, captures: { p_rc: $.data.id } }
            - { call: "POST /drip/plans/${plan_rc}/enrollments", payload: { participant_id: "${p_rc}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_rc}", captures: { e_rc: $.data.id } }
            - { call: "POST /drip/enrollments/${e_rc}/activate", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_rc}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_rc: $.data.id } }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_rc}/open", as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_rc}/purchase-orders", payload: { enrollment_id: "${e_rc}", amount_cents: 12000 }, as: Participant, as_user_id: "${p_rc}", captures: { o_rc: $.data.id } }
          trigger:
            - { call: "POST /drip/purchase-orders/${o_rc}/cancel", as: Participant, as_user_id: "${p_rc}" }
            - { call: "GET /drip/purchase-windows/${w_rc}", as: PlanAdmin }
          assert:
            - "PurchaseWindow.${w_rc}.submitted_total_cents == 12000 after submit, == 0 after cancel"
            - "PurchaseOrder.${o_rc}.status == CANCELLED"
  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without a valid X-User-Role credential is rejected with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /drip/plans", as: Anonymous, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (http 401)"

      - name: participant_reads_other_enrollment_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
          - roles[Participant]
        distinguishing_aspect: "Ownership check: participant p2 reading p1's enrollment is rejected with ERR_FORBIDDEN (403) even though the resource exists."
        test_recipe:
          setup: ["ACTIVE plan, participant p1 with an enrollment, and a second participant p2"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Own Corp", ticker: "OWN", name: "OWN DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_ow: $.data.id } }
            - { call: "POST /drip/plans/${plan_ow}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat O1", email: "po1@x.com" }, as: PlanAdmin, captures: { p_o1: $.data.id } }
            - { call: "POST /drip/plans/${plan_ow}/enrollments", payload: { participant_id: "${p_o1}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_o1}", captures: { e_o1: $.data.id } }
            - { call: "POST /drip/participants", payload: { full_name: "Pat O2", email: "po2@x.com" }, as: PlanAdmin, captures: { p_o2: $.data.id } }
          trigger:
            - { call: "GET /drip/enrollments/${e_o1}", as: Participant, as_user_id: "${p_o2}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (http 403)"

      - name: already_enrolled_duplicate_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_ALREADY_ENROLLED]
        distinguishing_aspect: "A second enrollment for the same participant in the same plan while the first is non-terminal fails with ERR_ALREADY_ENROLLED."
        test_recipe:
          setup: ["ACTIVE plan and participant with an existing PENDING enrollment in that plan"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Dup Corp", ticker: "DUP", name: "DUP DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_dp: $.data.id } }
            - { call: "POST /drip/plans/${plan_dp}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat D", email: "pd@x.com" }, as: PlanAdmin, captures: { p_d: $.data.id } }
            - { call: "POST /drip/plans/${plan_dp}/enrollments", payload: { participant_id: "${p_d}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_d}", captures: { e_d: $.data.id } }
          trigger:
            - { call: "POST /drip/plans/${plan_dp}/enrollments", payload: { participant_id: "${p_d}", election: "CASH_ONLY" }, as: Participant, as_user_id: "${p_d}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_ALREADY_ENROLLED (http 409)"

      - name: purchase_below_min_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_PURCHASE_BELOW_MIN]
        distinguishing_aspect: "An order of 500 cents is below plan.ocp_min_cents (1000) and fails with ERR_PURCHASE_BELOW_MIN before any cumulative-limit arithmetic."
        test_recipe:
          setup: ["ACTIVE plan (ocp_min_cents 1000), ACTIVE enrollment, OPEN window at clock 2026-09-02"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Min Corp", ticker: "MIN", name: "MIN DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_mn: $.data.id } }
            - { call: "POST /drip/plans/${plan_mn}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Mn", email: "pmn@x.com" }, as: PlanAdmin, captures: { p_mn: $.data.id } }
            - { call: "POST /drip/plans/${plan_mn}/enrollments", payload: { participant_id: "${p_mn}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_mn}", captures: { e_mn: $.data.id } }
            - { call: "POST /drip/enrollments/${e_mn}/activate", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_mn}/purchase-windows", payload: { opens_at: "2026-09-01T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", price_cents: 2500 }, as: PlanAdmin, captures: { w_mn: $.data.id } }
            - { call: "POST /drip/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlanAdmin }
            - { call: "POST /drip/purchase-windows/${w_mn}/open", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/purchase-windows/${w_mn}/purchase-orders", payload: { enrollment_id: "${e_mn}", amount_cents: 500 }, as: Participant, as_user_id: "${p_mn}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_PURCHASE_BELOW_MIN (http 422)"

      - name: transfer_insufficient_shares_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_INSUFFICIENT_SHARES]
        distinguishing_aspect: "A transfer of 99.0000 shares against a 10.0000-share balance fails at creation with ERR_INSUFFICIENT_SHARES."
        test_recipe:
          setup: ["ACTIVE plan, ACTIVE enrollment holding 10.0000 shares (@ 1000)"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Ins Corp", ticker: "INS", name: "INS DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_in: $.data.id } }
            - { call: "POST /drip/plans/${plan_in}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat In", email: "pin@x.com" }, as: PlanAdmin, captures: { p_in: $.data.id } }
            - { call: "POST /drip/plans/${plan_in}/enrollments", payload: { participant_id: "${p_in}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_in}", captures: { e_in: $.data.id } }
            - { call: "POST /drip/enrollments/${e_in}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_in}/deposits", payload: { quantity: 10.0, cost_per_share_cents: 1000 }, as: PlanAdmin }
          trigger:
            - { call: "POST /drip/enrollments/${e_in}/transfers", payload: { transfer_type: "GIFT", quantity: 99.0, recipient_name: "Niece I", recipient_address: "4 Way" }, as: Participant, as_user_id: "${p_in}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_SHARES (http 422)"

      - name: transfer_recipient_not_enrolled_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_RECIPIENT_NOT_ENROLLED]
        distinguishing_aspect: "A TRANSFER naming a recipient enrollment that belongs to a DIFFERENT plan fails with ERR_RECIPIENT_NOT_ENROLLED (cross-plan moves are not transfers)."
        test_recipe:
          setup: ["Two ACTIVE plans; e1 ACTIVE in plan A with 10.0000 shares; e2 ACTIVE in plan B"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Ra Corp", ticker: "RA", name: "RA DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_ra: $.data.id } }
            - { call: "POST /drip/plans/${plan_ra}/publish", as: PlanAdmin }
            - { call: "POST /drip/plans", payload: { issuer_name: "Rb Corp", ticker: "RB", name: "RB DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_rb: $.data.id } }
            - { call: "POST /drip/plans/${plan_rb}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Ra", email: "pra@x.com" }, as: PlanAdmin, captures: { p_ra: $.data.id } }
            - { call: "POST /drip/plans/${plan_ra}/enrollments", payload: { participant_id: "${p_ra}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_ra}", captures: { e_ra: $.data.id } }
            - { call: "POST /drip/enrollments/${e_ra}/activate", as: PlanAdmin }
            - { call: "POST /drip/enrollments/${e_ra}/deposits", payload: { quantity: 10.0, cost_per_share_cents: 1000 }, as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat Rb", email: "prb@x.com" }, as: PlanAdmin, captures: { p_rb: $.data.id } }
            - { call: "POST /drip/plans/${plan_rb}/enrollments", payload: { participant_id: "${p_rb}", election: "FULL_REINVEST" }, as: Participant, as_user_id: "${p_rb}", captures: { e_rb: $.data.id } }
            - { call: "POST /drip/enrollments/${e_rb}/activate", as: PlanAdmin }
          trigger:
            - { call: "POST /drip/enrollments/${e_ra}/transfers", payload: { transfer_type: "TRANSFER", quantity: 2.0, recipient_enrollment_id: "${e_rb}" }, as: Participant, as_user_id: "${p_ra}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_RECIPIENT_NOT_ENROLLED (http 422)"

      - name: election_partial_requires_pct_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_ELECTION]
        distinguishing_aspect: "PARTIAL_REINVEST without reinvest_pct is rejected with ERR_INVALID_ELECTION — the reinvest_pct requirement is conditional on the election value."
        test_recipe:
          setup: ["ACTIVE plan and participant"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "El Corp", ticker: "ELC", name: "ELC DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_el: $.data.id } }
            - { call: "POST /drip/plans/${plan_el}/publish", as: PlanAdmin }
            - { call: "POST /drip/participants", payload: { full_name: "Pat El", email: "pel@x.com" }, as: PlanAdmin, captures: { p_el: $.data.id } }
          trigger:
            - { call: "POST /drip/plans/${plan_el}/enrollments", payload: { participant_id: "${p_el}", election: "PARTIAL_REINVEST" }, as: Participant, as_user_id: "${p_el}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ELECTION (http 422)"

      - name: notice_lead_time_boundary
        claim_type: temporal_validation
        grounds:
          - validations[priority=6]
          - errors[ERR_NOTICE_LEAD_TIME_SHORT]
          - state_machines.PlanNotice.DRAFT_to_PUBLISHED
        distinguishing_aspect: "Boundary at exactly MIN_NOTICE_DAYS: effective_at exactly 10 days out publishes fine; 5 days out fails with ERR_NOTICE_LEAD_TIME_SHORT."
        test_recipe:
          setup: ["ACTIVE plan at default clock 2026-08-01T00:00:00Z with two DRAFT notices: A effective 2026-08-11T00:00:00Z (exactly 10 days), B effective 2026-08-06T00:00:00Z (5 days)"]
          setup_api_calls:
            - { call: "POST /drip/plans", payload: { issuer_name: "Lead Corp", ticker: "LED", name: "LED DRIP", discount_pct: 0.05, ocp_min_cents: 1000, ocp_max_cents: 25000, ocp_fee_pct: 0.05, ocp_fee_min_cents: 500, sale_fee_cents: 250, transfer_fee_cents: 300, enrollment_fee_cents: 1000 }, as: PlanAdmin, captures: { plan_ld: $.data.id } }
            - { call: "POST /drip/plans/${plan_ld}/publish", as: PlanAdmin }
            - { call: "POST /drip/plans/${plan_ld}/notices", payload: { notice_type: "MODIFICATION", effective_at: "2026-08-11T00:00:00Z", message: "Fee change in 10 days" }, as: PlanAdmin, captures: { n_a: $.data.id } }
            - { call: "POST /drip/plans/${plan_ld}/notices", payload: { notice_type: "MODIFICATION", effective_at: "2026-08-06T00:00:00Z", message: "Too soon" }, as: PlanAdmin, captures: { n_b: $.data.id } }
          trigger:
            - { call: "POST /drip/notices/${n_a}/publish", as: PlanAdmin }
            - { call: "POST /drip/notices/${n_b}/publish", as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "Notice A publishes successfully: PlanNotice.${n_a}.status == PUBLISHED"
            - "Notice B rejected with error_id == ERR_NOTICE_LEAD_TIME_SHORT (http 422) and remains DRAFT"

