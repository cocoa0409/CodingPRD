            - call: "POST /properties/${prop_ss}/buildings"
              payload: { name: "SS-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_ss: $.data.id, bld_ss_v: $.data.version }
            - call: "POST /properties/${prop_ss}/units"
              payload: { unit_number: "U-SS1", building_id: "${bld_ss}" }
              as: PropertyManager
              captures: { unit_ss: $.data.id }
            - call: "POST /buildings/${bld_ss}/installation-jobs"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_ss}", requires_resident_coordination: false, access_window_start: "2026-09-03T09:00:00Z", access_window_end: "2026-09-03T12:00:00Z", expected_building_version: "${bld_ss_v}" }
              as: PropertyManager
