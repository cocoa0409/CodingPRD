            - "DomainName.${dom_id}.lock_status is still UNLOCKED and the verification is still REQUESTED with lock_applied false and responded_at null after both refusals"
            - "Case.${case_id}.status is still VERIFICATION_PENDING and verified_registrant_email is still null - a refused verification discloses nothing"
            - "The lock_applied true response then succeeds: the verification is RESPONDED, DomainName.${dom_id}.lock_status is LOCKED, Case.${case_id}.status is NOTIFICATION_PENDING and verified_registrant_email is registrant@rsusp.example"

