              captures: { pv3: $.data.version }
          trigger:
            - call: "POST /projects"
              payload: { name: "Rogue Project", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ConstructionManager
              captures: { e1: $.data.error_id }
