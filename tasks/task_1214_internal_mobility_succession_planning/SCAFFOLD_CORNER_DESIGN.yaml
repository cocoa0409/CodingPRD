      - name: hipo_review_cycle_retain_then_remove
        claim_type: valid_transition
        grounds: [state_machines.HiPoNomination.ACTIVE_to_UNDER_REVIEW, state_machines.HiPoNomination.UNDER_REVIEW_to_ACTIVE, state_machines.HiPoNomination.UNDER_REVIEW_to_REMOVED]
        distinguishing_aspect: "The ACTIVE <-> UNDER_REVIEW loop retains the member (review_count increments) without freeing the seat; a second review with outcome REMOVE ends membership, frees the seat, and flips is_high_potential to false."
        test_recipe:
          setup: ["cycle capacity 3; N60 enrolled (ACTIVE) via nominate/endorse/enroll"]
          setup_api_calls:
            - { call: "POST /talent/employees", payload: { employee_code: "HRPB60", full_name: "Hana Rbp", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { hrbp: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "TM60", full_name: "Tim Mgr", department: "HR", job_level: 7, hire_date: "2020-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { tm: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "MGR60", full_name: "Mary Anager", department: "ENG", job_level: 7, hire_date: "2019-01-15", performance_rating: "STRONG" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /talent/employees", payload: { employee_code: "N60", full_name: "Nia Member", department: "ENG", job_level: 5, hire_date: "2023-01-15", performance_rating: "STRONG", current_manager_id: "${mgr}" }, as: HRAdmin, captures: { n: $.data.id } }
            - { call: "POST /talent/hipo-cycles", payload: { cycle_name: "2026-C60", capacity: 3 }, as: HRAdmin, captures: { cy: $.data.id } }
            - { call: "POST /talent/hipo-cycles/${cy}/nominations", payload: { employee_id: "${n}" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id } }
            - { call: "POST /talent/hipo-nominations/${nom}/endorse", as: HRBusinessPartner, as_user_id: "${hrbp}" }
            - { call: "POST /talent/hipo-nominations/${nom}/enroll", as: TalentManager, as_user_id: "${tm}" }
          trigger:
            - { call: "POST /talent/hipo-nominations/${nom}/start-review", as: TalentManager, as_user_id: "${tm}", captures: { st1: $.data.status } }
            - { call: "POST /talent/hipo-nominations/${nom}/complete-review", payload: { outcome: "RETAIN" }, as: TalentManager, as_user_id: "${tm}", captures: { st2: $.data.status, rc1: $.data.review_count } }
            - { call: "GET /talent/hipo-cycles/${cy}", as: TalentManager, as_user_id: "${tm}", captures: { cnt_mid: $.data.enrolled_count } }
            - { call: "POST /talent/hipo-nominations/${nom}/start-review", as: TalentManager, as_user_id: "${tm}" }
            - { call: "POST /talent/hipo-nominations/${nom}/complete-review", payload: { outcome: "REMOVE" }, as: TalentManager, as_user_id: "${tm}", captures: { st3: $.data.status, rc2: $.data.review_count } }
            - { call: "GET /talent/employees/${n}", as: TalentManager, as_user_id: "${tm}", captures: { hipo: $.data.is_high_potential } }
          assert:
            - "start-review: UNDER_REVIEW; RETAIN: back to ACTIVE with review_count == 1; enrolled_count stays 1 throughout the loop (retain does not free the seat)"
            - "second review with REMOVE: status REMOVED, review_count == 2, cycle enrolled_count == 0, Employee.${n}.is_high_potential == false"

