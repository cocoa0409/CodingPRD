  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_rebate_approve
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REBATE_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          A rebate DECIDE(APPROVE) on a DENIED claim (state, priority 7) whose finalized 90000
          also exceeds the 40000 remaining budget (business_fiscal, priority 11) returns the
          higher-priority ERR_INVALID_STATE, not ERR_REBATE_BUDGET_EXCEEDED — a state vs fiscal pair.
        test_recipe:
          setup:
            - "A small-budget job (cap 40000); attic scope INSTALLED; rebate submitted (finalized 90000) then DENIED"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "9 Walnut St", year_built: 1958, conditioned_area_sqft: 1400, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
