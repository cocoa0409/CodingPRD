              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /conferences/${conf_id}/status-transitions"
              payload: { to_status: "CFA_OPEN" }
              as: ConferenceAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T23:59:00Z" }
              as: ConferenceAdmin
          trigger:
            - call: "POST /abstracts"
              payload: { conference_id: "${conf_id}", category_id: "${cat_id}", submitting_author_id: "${au_ada_id}", title: "On the deadline instant", body_word_count: 280, requested_format: "ORAL", keywords: ["oncology"] }
              as: Author
