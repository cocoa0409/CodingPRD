              captures: { a_id: $.data.id }
            - { call: "POST /appraisal/panel-memberships", payload: { client_id: "${c_id}", appraiser_id: "${a_id}" }, as: FirmAdmin }
            - call: "POST /appraisal/orders"
              payload: { client_id: "${c_id}", property_address: "5 New St", property_type: SFR, estimated_value_cents: 45000000, loan_type: CONVENTIONAL, requested_turn_days: 14 }
              as: ClientUser
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /appraisal/orders/${o_id}/determine-scope", payload: {}, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/accept", payload: {}, as: FirmAdmin }
            - { call: "POST /appraisal/orders/${o_id}/assign", payload: { appraiser_id: "${a_id}" }, as: FirmAdmin }
            - call: "POST /appraisal/appointments"
              payload: { order_id: "${o_id}", appraiser_id: "${a_id}", window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T10:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { ap_id: $.data.id }
            - call: "GET /appraisal/orders/${o_id}"
              as: FirmAdmin
              captures: { v_before: $.data.version }
          trigger:
            - { call: "POST /appraisal/appointments/${ap_id}/confirm", payload: {}, as: Appraiser, as_user_id: "${a_id}" }
            - call: "GET /appraisal/orders/${o_id}"
              as: FirmAdmin
              captures: { v_after: $.data.version, o_status: $.data.status }
          assert:
            - "order version: ${v_after} == ${v_before} + 1 (cascade bumped the parent)"
            - "order status == INSPECTION_SCHEDULED (captured ${o_status})"

      - name: clear_sanction_restores_standing_without_restoring_memberships
