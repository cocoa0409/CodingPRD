            - "statement.totals.total_shares == 500"

      - name: inquiries_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Pagination fields interact per the fixed envelope: limit=2 over 3 inquiries yields has_more == true and total_count == 3; offset=2 yields the final page with has_more == false."
        test_recipe:
          setup: ["account with 3 inquiries"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "Page Paul", address_line1: "32 Page St", city: "Tulsa", state_code: "OK", postal_code: "74127", country_code: "US", tax_id: "482-12-1212" }
