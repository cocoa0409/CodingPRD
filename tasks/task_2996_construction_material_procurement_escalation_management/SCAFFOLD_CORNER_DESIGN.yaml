  - name: errors_triggerable_a_non_open_quote_cannot_be_bought_out
    claim_type: errors_triggerable
    grounds:
    - errors[ERR_QUOTE_NOT_OPEN]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / clause_execute_blocked_by_superseded_quote
      rationale: The §1.8 instance triggers ERR_QUOTE_NOT_OPEN from a SUPERSEDED quote at execute time, and the priority-pair instance triggers it again from an EXPIRED quote at commitment-create time.
  - name: errors_triggerable_an_out_of_scope_supplier_rep_is_refused
    claim_type: errors_triggerable
    grounds:
    - errors[ERR_SUPPLIER_SCOPE_VIOLATION]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / supplier_scope_auth_check_beats_price_hold_overlap_constraint
      rationale: The §1.8 instance triggers ERR_SUPPLIER_SCOPE_VIOLATION and simultaneously proves it outranks the overlap check.
  - name: errors_triggerable_a_high_exposure_supplier_cannot_be_bought_out
    claim_type: errors_triggerable
    grounds:
    - errors[ERR_SUPPLIER_EXPOSURE_TOO_HIGH]
    excluded_because:
      difficulty_instance: boundary_precision_check / supplier_exposure_high_band_at_exactly_sixty_blocks_commitment
      rationale: The §1.8 instance triggers the code at exactly the 60.00 band boundary and proves the sibling at 59.84 succeeds.
  - name: errors_triggerable_an_exposed_substitute_cannot_be_approved
    claim_type: errors_triggerable
    grounds:
    - errors[ERR_SUBSTITUTE_SUPPLIER_EXPOSED]
    excluded_because:
      difficulty_instance: dual_variant_calc / supplier_exposure_snapshot_versus_forward_on_one_supplier
      rationale: The §1.8 instance triggers the code from the forward variant on a supplier whose snapshot band is LOW.
  - name: errors_triggerable_storage_offsite_needs_a_documented_arrangement
    claim_type: errors_triggerable
    grounds:
    - errors[ERR_STORAGE_NOT_DOCUMENTED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / posture_stored_offsite_blocked_by_undocumented_arrangement
      rationale: The §1.8 instance triggers ERR_STORAGE_NOT_DOCUMENTED with an arrangement that exists but is only DRAFT/INCOMPLETE.
  - name: errors_triggerable_a_buyout_more_than_fifteen_percent_over_the_estimate_is_refused
