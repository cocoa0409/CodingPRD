            - call: "POST /driver-pay/drivers/${drv_r}/status"
              payload: { new_status: "ACTIVE" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_r}", linehaul_revenue_cents: 180000, practical_miles: 780, hhg_miles: 742, stop_count: 1 }
              as: SettlementClerk
              captures: { load_r1: $.data.id }
            - call: "POST /driver-pay/loads"
              payload: { driver_id: "${drv_r}", linehaul_revenue_cents: 92800, practical_miles: 400, hhg_miles: 400, stop_count: 1 }
              as: SettlementClerk
              captures: { load_r2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T08:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/loads/${load_r1}/dispatch"
