          assert:
            - "response.status == 409 with error_id ERR_NOTHING_TO_REINSTATE"
            - "VoluntaryDisclosureAgreement.${agr_id}.status == \"EXECUTED\""
            - "VoluntaryDisclosureAgreement.${agr_id}.waived_amount_cents == 0 and reinstated_amount_cents == 0"
            - "VoluntaryDisclosureAgreement.${agr_id}.breach_reason == null"
            - "GET /amnesty/enforcement-actions?agreement_id=${agr_id} returns total_count == 0"
            - "Taxpayer.${tp_id}.compliance_behavior_score == 100"

      - name: identity_disclosure_gates_acceptance_and_cannot_be_repeated
        claim_type: Error triggerability
        grounds:
          - errors[ERR_IDENTITY_NOT_DISCLOSED]
          - errors[ERR_IDENTITY_ALREADY_DISCLOSED]
          - endpoints[POST /amnesty/pre-clearances/{id}/disclose-identity]
        distinguishing_aspect: |
          Anonymous pre-clearance has a one-way door: acceptance is refused while the
          client is still an alias, disclosure is allowed exactly once, and a second
          disclosure is refused even though the request is otherwise identical and the
          state (TERMS_OFFERED) has not moved. Both errors live on the same
          TERMS_OFFERED state, so a state-only guard cannot tell them apart.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Representative Quill & Rowe is ACTIVE; taxpayer Greyloch is registered with no enforcement cases"
            - "An anonymous pre-clearance was submitted, reviewed as ELIGIBLE and is in TERMS_OFFERED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/representatives"
              payload: { firm_name: "Quill & Rowe Tax Counsel", bar_number: "BAR-55120" }
              as: ProgramAdministrator
              captures: { rep_id: $.data.id }
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Greyloch Distribution Inc", taxpayer_type: "BUSINESS", tin_last4: "4408" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /amnesty/pre-clearances"
              payload: { program_id: "${prog_id}", tax_type: "SALES_USE", anonymous_alias: "CLIENT-ORCHID", estimated_liability_cents: 900000, self_reported_under_audit: false, earliest_unfiled_period_start: "2024-01-01" }
              as: Representative
              as_user_id: "${rep_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /amnesty/pre-clearances/${pc_id}/begin-review"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
            - call: "GET /amnesty/pre-clearances/${pc_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { pc_v: $.data.version }
            - call: "POST /amnesty/pre-clearances/${pc_id}/offer-terms"
              payload: { expected_pre_clearance_version: "${pc_v}", offered_lookback_months: 30, offered_penalty_waiver_pct: 0.80, offered_interest_waiver_pct: 0.40 }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
          trigger:
            - call: "POST /amnesty/pre-clearances/${pc_id}/accept"
              payload: {}
              as: Representative
              as_user_id: "${rep_id}"
              captures: { err_not_disclosed: $.data.error_id }
            - call: "POST /amnesty/pre-clearances/${pc_id}/disclose-identity"
              payload: { taxpayer_id: "${tp_id}" }
              as: Representative
              as_user_id: "${rep_id}"
            - call: "POST /amnesty/pre-clearances/${pc_id}/disclose-identity"
              payload: { taxpayer_id: "${tp_id}" }
              as: Representative
              as_user_id: "${rep_id}"
              captures: { err_already: $.data.error_id }
            - call: "POST /amnesty/pre-clearances/${pc_id}/accept"
              payload: {}
              as: Representative
              as_user_id: "${rep_id}"
          assert:
            - "the first trigger returns status 409 with error_id ERR_IDENTITY_NOT_DISCLOSED"
            - "the second trigger returns status 200; disclosed_taxpayer_id == \"${tp_id}\" and status is still TERMS_OFFERED"
            - "the third trigger returns status 409 with error_id ERR_IDENTITY_ALREADY_DISCLOSED and disclosed_taxpayer_id is unchanged"
            - "the fourth trigger returns status 200 with status == \"ACCEPTED\""
            - "PreClearanceRequest.${pc_id}.screening_result == \"ELIGIBLE\""
            - "PreClearanceRequest.${pc_id}.current_offer_lookback_months == 30"
            - "PreClearanceRequest.${pc_id}.current_offer_penalty_waiver_pct == 0.80"
            - "PreClearanceRequest.${pc_id}.counter_count == 0"
            - "GET /amnesty/pre-clearances?disclosed_taxpayer_id=${tp_id} returns total_count == 1"

  # =========================================================================
  - section: Table 7 RBAC
    instances:
      - name: taxpayer_role_cannot_create_a_program
        claim_type: Role exclusivity
        grounds:
          - roles[Taxpayer]
          - roles[ProgramAdministrator].exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          Program design is exclusive to ProgramAdministrator, and the role check runs
          before any payload validation: a Taxpayer whose identity is perfectly valid
          still gets 403 ERR_FORBIDDEN_ROLE, and no program row is created.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; taxpayer Ashgrove exists so the caller identity resolves"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Ashgrove Hardware LLC", taxpayer_type: "BUSINESS", tin_last4: "1010" }
              as: ProgramAdministrator
              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /amnesty/programs"
              payload: { name: "Rogue Program", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 403 with error_id ERR_FORBIDDEN_ROLE"
            - "GET /amnesty/programs returns total_count == 0"

      - name: entity_backed_role_with_an_unknown_identity_returns_forbidden
        claim_type: Identity resolution
        grounds:
          - roles[Taxpayer].identity
          - validations[priority=4]
          - errors[ERR_IDENTITY_NOT_RECOGNIZED]
        distinguishing_aspect: |
          The Taxpayer role is entity_backed, so X-User-ID must resolve to a Taxpayer row:
          a syntactically valid but unknown id fails with ERR_IDENTITY_NOT_RECOGNIZED
          rather than ERR_FORBIDDEN_ROLE (the role itself is allowed) or
          ERR_TAXPAYER_NOT_FOUND (no taxpayer is addressed in the path).
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; one taxpayer exists, but the caller uses a different, unregistered id"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Ashgrove Hardware LLC", taxpayer_type: "BUSINESS", tin_last4: "1010" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /amnesty/agreements"
              payload: {}
              as: Taxpayer
              as_user_id: "00000000-0000-4000-8000-0000000000ff"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 403 with error_id ERR_IDENTITY_NOT_RECOGNIZED"
            - "the pagination guard did NOT fire: identity resolution is priority 4 and pagination is priority 9"

      - name: taxpayer_cannot_read_another_taxpayers_agreement
        claim_type: Resource ownership
        grounds:
          - validations[priority=7]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          Both callers hold the same legitimate role, so role checking cannot separate
          them: ownership is decided per resource. The owner reads its agreement, the
          peer taxpayer is refused with ERR_NOT_RESOURCE_OWNER, and the collection read
          silently scopes to the caller rather than erroring.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayers Cedar Point and Rill Hollow both exist; only Cedar Point holds an EXECUTED agreement"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2020-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs/${prog_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Cedar Point Supply Inc", taxpayer_type: "BUSINESS", tin_last4: "3311" }
              as: ProgramAdministrator
              captures: { tp_owner_id: $.data.id }
            - call: "POST /amnesty/taxpayers"
              payload: { legal_name: "Rill Hollow Trading LLC", taxpayer_type: "BUSINESS", tin_last4: "7722" }
              as: ProgramAdministrator
              captures: { tp_other_id: $.data.id }
            - call: "POST /amnesty/agreements"
              payload: { program_id: "${prog_id}", taxpayer_id: "${tp_owner_id}", tax_types: ["SALES_USE"], lookback_start_date: "2023-09-01", lookback_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "officer-alpha"
              captures: { agr_id: $.data.id }
            - call: "POST /amnesty/agreements/${agr_id}/execute"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "officer-beta"
          trigger:
            - call: "GET /amnesty/agreements/${agr_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_other_id}"
              captures: { err_id: $.data.error_id }
            - call: "GET /amnesty/agreements/${agr_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_owner_id}"
          assert:
            - "the first trigger returns status 403 with error_id ERR_NOT_RESOURCE_OWNER"
            - "the second trigger returns status 200 with taxpayer_id == \"${tp_owner_id}\""
            - "GET /amnesty/agreements as Rill Hollow returns total_count == 0 (200, not 403)"
            - "GET /amnesty/agreements as Cedar Point returns total_count == 1"

      - name: missing_x_role_header_returns_unauthenticated
        claim_type: Authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Authentication is priority 1, ahead of role checking and ahead of existence:
          a request with no X-Role header at all is 401 ERR_UNAUTHENTICATED even when it
          addresses a non-existent program, so the 404 never surfaces.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; the store is otherwise empty"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /amnesty/programs/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: "(no X-Role header is sent)"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status == 401 with error_id ERR_UNAUTHENTICATED"
            - "the response is NOT 404 ERR_PROGRAM_NOT_FOUND, proving priority 1 precedes existence checking at priority 5"

      - name: segregation_of_duties_rejects_the_drafting_officer_as_signer
        claim_type: Segregation of duties
        grounds:
          - roles[DisclosureOfficer].segregation_of_duties
          - entities.VoluntaryDisclosureAgreement.fields.drafted_by_user_id
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          The block is per-user, not per-role: the same DisclosureOfficer role executes
          successfully as soon as a different X-User-ID signs, and the refusal leaves the
          agreement DRAFTED with executed_by_user_id still null. Comparing roles instead
          of user ids passes the second call and wrongly passes the first.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Wren Meadow holds a DRAFTED agreement whose drafted_by_user_id is officer-alpha"
          setup_api_calls:
