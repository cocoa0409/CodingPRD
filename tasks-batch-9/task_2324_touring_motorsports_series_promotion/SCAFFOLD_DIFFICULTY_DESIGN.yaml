              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "PATCH /tour-stops/${stop_atl}/logistics"
              payload: { doors_open_utc: "2026-11-14T22:00:00Z", show_start_utc: "2026-11-14T23:00:00Z", show_window_minutes: 150, pit_party_price_cents: 2450, pit_party_capacity: 400 }
              as: SeriesPromoter
            - call: "POST /competitors"
              payload: { team_name: "Thunder Ridge Racing", driver_name: "R. Anderson", home_market_code: "CLT", vehicle_class: "LIGHT" }
              as: SeriesPromoter
              captures: { comp1: "$.data.id" }
            - call: "POST /vehicle-entries"
              payload: { competitor_id: "${comp1}", tour_stop_id: "${stop_atl}", vehicle_number: "11", vehicle_weight_lbs: 7200, haul_distance_miles: 1200, scheduled_arrival_utc: "2026-11-14T16:00:00Z" }
              as: SeriesPromoter
              captures: { entry1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-14T17:00:00Z" }
              as: SeriesPromoter
            - call: "POST /vehicle-entries/${entry1}/check-in"
              payload: {}
              as: SeriesPromoter
          trigger:
            - call: "POST /vehicle-entries/${entry1}/tech-inspections"
              payload: { result: "FAILED", defect_severity: "MAJOR", notes: "attempt 1" }
              as: SafetyOfficial
              as_user_id: "so-inspector-1"
              captures: { insp1: "$.data.id" }
            - call: "POST /vehicle-entries/${entry1}/tech-inspections"
              payload: { result: "FAILED", defect_severity: "MAJOR", notes: "attempt 2" }
              as: SafetyOfficial
              as_user_id: "so-inspector-1"
            - call: "POST /vehicle-entries/${entry1}/tech-inspections"
              payload: { result: "FAILED", defect_severity: "CRITICAL", notes: "attempt 3" }
              as: SafetyOfficial
              as_user_id: "so-inspector-1"
            - call: "POST /vehicle-entries/${entry1}/tech-inspections"
              payload: { result: "PASSED", defect_severity: "NONE", notes: "attempt 4 never lands" }
              as: SafetyOfficial
              as_user_id: "so-inspector-1"
              captures: { err_attempts: "$.data.error_id" }
          assert:
            - "TechInspection.${insp1}.attempt_no == 1 and inspected_by_user_id == \"so-inspector-1\""
            - "after trigger call 1: VehicleEntry.${entry1}.tech_status == TECH_PENDING, tech_attempt_count == 1, failed_attempt_count == 1"
            - "after trigger call 2: VehicleEntry.${entry1}.tech_status == TECH_PENDING, tech_attempt_count == 2, failed_attempt_count == 2 (the self-loop, same trigger, same target state)"
            - "after trigger call 3: VehicleEntry.${entry1}.tech_status == TECH_HELD, tech_attempt_count == 3, failed_attempt_count == 3"
            - "trigger call 4 returns HTTP 409 with ${err_attempts} == ERR_TECH_ATTEMPTS_EXHAUSTED and no fourth TechInspection row exists"
