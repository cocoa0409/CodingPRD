              as: TourManager
              captures: { agreement_id: "$.data.id" }
            - call: "POST /facility-agreements/${agreement_id}/submit"
              payload: {}
              as: TourManager
            - call: "POST /facility-agreements/${agreement_id}/sign"
              payload: {}
              as: CorpsDirector
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Rockford High School", city: "Rockford", state_code: "IL", arrive_at: "2027-06-19T06:00:00Z", depart_at: "2027-06-19T23:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: TourManager
              captures: { stop_id: "$.data.id" }
            - call: "POST /site-bookings"
              payload: { tour_stop_id: "${stop_id}", host_school_id: "${school_id}", facility_agreement_id: "${agreement_id}", block_start_at: "2027-06-19T08:00:00Z", block_end_at: "2027-06-19T12:00:00Z", indoor: false }
              as: TourManager
              captures: { booking_one_id: "$.data.id" }
          trigger:
            - call: "POST /site-bookings"
              payload: { tour_stop_id: "${stop_id}", host_school_id: "${school_id}", facility_agreement_id: "${agreement_id}", block_start_at: "2027-06-19T14:59:00Z", block_end_at: "2027-06-19T16:00:00Z", indoor: false }
              as: TourManager
              captures: { gap_179_err: "$.data.error_id" }
            - call: "POST /site-bookings"
              payload: { tour_stop_id: "${stop_id}", host_school_id: "${school_id}", facility_agreement_id: "${agreement_id}", block_start_at: "2027-06-19T15:00:00Z", block_end_at: "2027-06-19T16:00:00Z", indoor: false }
              as: TourManager
              captures: { booking_two_id: "$.data.id" }
            - call: "POST /site-bookings"
              payload: { tour_stop_id: "${stop_id}", host_school_id: "${school_id}", facility_agreement_id: "${agreement_id}", block_start_at: "2027-06-19T20:00:00Z", block_end_at: "2027-06-19T22:00:00Z", indoor: false }
              as: TourManager
              captures: { booking_three_id: "$.data.id" }
          assert:
            - "${gap_179_err} == ERR_SITE_BLOCK_CONFLICT with HTTP 409 — a 179-minute gap falls inside the 2 x 90-minute buffer"
            - "the 180-minute gap returns 201: SiteBooking.${booking_two_id}.status == HELD"
            - "the third block starts 240 minutes after booking two ends and also returns 201: SiteBooking.${booking_three_id}.status == HELD"
            - "HostSchool.${school_id}.booked_block_count == 3 — only the accepted blocks incremented it"

      - name: duty_role_mismatch_outranks_the_shift_window_check
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_29_ERR_DUTY_ROLE_MISMATCH
          - validations.priority_42_ERR_SHIFT_OUTSIDE_STOP_WINDOW
          - entities.Volunteer.fields.role_type
        distinguishing_aspect: "Whether a staff assignment is legal depends on the OTHER entity's role_type, and when a single call violates both the referential rule (29) and the temporal rule (42) the referential error must be reported; each rule is then isolated to prove neither masks the other."
        test_recipe:
          setup:
            - "One COOK volunteer and one PLANNED stop whose window is 2027-06-19T08:00Z to 20:00Z."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Rockford High School", city: "Rockford", state_code: "IL", arrive_at: "2027-06-19T08:00:00Z", depart_at: "2027-06-19T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: TourManager
              captures: { stop_id: "$.data.id" }
            - call: "POST /volunteers"
              payload: { full_name: "Rosa Cook", email: "rosa@corps.test", role_type: "COOK" }
              as: VolunteerScreener
              captures: { cook_id: "$.data.id" }
          trigger:
            - call: "POST /staff-assignments"
              payload: { volunteer_id: "${cook_id}", tour_stop_id: "${stop_id}", duty: "TRAINER", shift_start_at: "2027-06-19T07:00:00Z", shift_end_at: "2027-06-19T21:00:00Z" }
              as: TourManager
              captures: { both_err: "$.data.error_id" }
            - call: "POST /staff-assignments"
              payload: { volunteer_id: "${cook_id}", tour_stop_id: "${stop_id}", duty: "TRAINER", shift_start_at: "2027-06-19T09:00:00Z", shift_end_at: "2027-06-19T19:00:00Z" }
              as: TourManager
              captures: { duty_err: "$.data.error_id" }
            - call: "POST /staff-assignments"
              payload: { volunteer_id: "${cook_id}", tour_stop_id: "${stop_id}", duty: "COOK", shift_start_at: "2027-06-19T07:59:00Z", shift_end_at: "2027-06-19T19:00:00Z" }
              as: TourManager
              captures: { window_err: "$.data.error_id" }
            - call: "POST /staff-assignments"
              payload: { volunteer_id: "${cook_id}", tour_stop_id: "${stop_id}", duty: "COOK", shift_start_at: "2027-06-19T08:00:00Z", shift_end_at: "2027-06-19T20:00:00Z" }
              as: TourManager
