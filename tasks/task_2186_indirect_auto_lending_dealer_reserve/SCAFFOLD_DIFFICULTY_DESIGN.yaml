            - "Dealer.${d1}.funded_contract_count == 1 and Dealer.${d1}.repurchase_count == 1"
            - "Dealer.${d1}.reserve_balance_cents == 57500 - only C2's accruals remain"
            - "RetailContract.${k_c2}.funding_status == 'FUNDED' and unpaid_principal_cents == 1000000"
