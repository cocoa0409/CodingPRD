              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "ONCOLOGY", is_physician_owned: false, npi: "1234568261" }
              as: PortfolioAdmin
              captures: { m14_t_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${m14_b_id}", suite_id: "${m14_s_id}", tenant_id: "${m14_t_id}", lease_type: "DIRECT", term_start: "2026-11-01", term_end: "2029-10-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
