# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted to invoke this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Entity state does not permit the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_contract_version does not match the contract's current version"
  - id: ERR_CROSS_PLAN_REFERENCE
    http: 422
    condition: "member_id does not belong to the plan implied by the contract or claim"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "Temporal fields violate ordering (service_date > paid_date; effective_from >= effective_to; coverage_start >= coverage_end)"
  - id: ERR_CLAIM_WINDOW_AMBIGUITY
    http: 422
    condition: "Claim is covered by the run-in/run-out windows of two contracts simultaneously"
  - id: ERR_NOTICE_OUTSTANDING
    http: 422
    condition: "Specific filing submitted while the member's 50% notice is still NOTICE_PENDING"
  - id: ERR_LASER_CONFLICT
    http: 422
    condition: "Laser deductible not above base, or overlapping ACTIVE laser intervals for the same member"
  - id: ERR_AMOUNT_OUT_OF_RANGE
    http: 422
    condition: "Fiscal amount fails bounds (requested_amount_cents <= 0; approved > requested)"
  - id: ERR_FILING_DEADLINE_PASSED
    http: 422
    condition: "Submission after policy_year_end + filing_deadline_days"
  - id: ERR_REIMBURSEMENT_MISMATCH
    http: 422
    condition: "received_amount_cents != approved_amount_cents at posting time"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Same X-User-ID attempts to resolve an audit on a filing they submitted"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing or malformed payload"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdministrator
    description: "Employer-side administrator: plans, contracts, members, lasers, audits resolution"
    identity: opaque
    exclusive_operations:
      - "POST /stop-loss/plans"
      - "POST /stop-loss/contracts"
      - "POST /stop-loss/contracts/{id}/activate"
      - "POST /stop-loss/contracts/{id}/renew"
      - "POST /stop-loss/members"
      - "POST /stop-loss/members/{id}/terminate"
      - "POST /stop-loss/members/{id}/file-notice"
      - "POST /stop-loss/lasered-terms"
      - "POST /stop-loss/lasered-terms/{id}/rescind"
      - "POST /stop-loss/audits/{id}/resolve"
      - "POST /stop-loss/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
      - "POST /stop-loss/forecasts"

  - name: ClaimsExaminer
    description: "TPA examiner: claim intake, adjudication, payment, reversal"
    identity: opaque
    exclusive_operations:
      - "POST /stop-loss/claims"
      - "POST /stop-loss/claims/{id}/adjudicate"
      - "POST /stop-loss/claims/{id}/pay"
      - "POST /stop-loss/claims/{id}/reverse"
    shared_operations:
      - "GET endpoints"

  - name: StopLossAnalyst
    description: "TPA stop-loss analyst: builds and submits filings, resolves disputes"
    identity: opaque
    exclusive_operations:
      - "POST /stop-loss/filings"
      - "POST /stop-loss/filings/{id}/submit"
      - "POST /stop-loss/filings/{id}/resolve-dispute"
    shared_operations:
      - "GET endpoints"
      - "POST /stop-loss/forecasts"

  - name: CarrierReviewer
    description: "Carrier-side claims reviewer: review, dispute, approve, deny filings"
    identity: opaque
    exclusive_operations:
      - "POST /stop-loss/filings/{id}/begin-review"
      - "POST /stop-loss/filings/{id}/dispute"
      - "POST /stop-loss/filings/{id}/approve"
      - "POST /stop-loss/filings/{id}/deny"
    shared_operations:
      - "GET endpoints"

  - name: PlanAccountant
    description: "Employer-side accountant: records and posts reimbursements"
    identity: opaque
    exclusive_operations:
      - "POST /stop-loss/reimbursements"
      - "POST /stop-loss/reimbursements/{id}/post"
    shared_operations:
      - "GET endpoints"

  - name: CarrierAuditor
    description: "Carrier-side auditor: opens audits and issues findings"
    identity: opaque
    exclusive_operations:
      - "POST /stop-loss/audits"
      - "POST /stop-loss/audits/{id}/issue-findings"
    shared_operations:
      - "GET endpoints"
