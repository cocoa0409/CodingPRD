        distinguishing_aspect: "baseline 695 then a re-pull to 650/640/630 (composite 641) is a 54-point drop, which is >= 40, so SCORE_DROP_WEIGHT (12) is added to BOTH variants: risk_score == underwriting_risk_score == 22 with no alerts."
