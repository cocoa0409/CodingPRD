              payload: { name: "Salt Flats Choir", agency: "Sagebrush Talent", tier: "THEATER", historical_sellthrough_pct: 52.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { q_ar2_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${q_mk_id}", name: "Basin Center", gross_capacity: 3000, facility_fee_cents_per_ticket: 200, ticket_tax_pct: 7.00 }
              as: TalentBuyer
              captures: { q_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${q_ar1_id}", venue_id: "${q_vn_id}", event_at: "2026-10-03T02:00:00.000Z", load_in_at: "2026-10-02T14:00:00.000Z", load_out_at: "2026-10-03T08:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 200000 }
              as: TalentBuyer
              captures: { q_sh1_id: $.data.id, q_sh1_v1: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${q_sh1_id}", expected_show_version: "${q_sh1_v1}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 4000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { q_of1_id: $.data.id }
            - call: "POST /offers/${q_of1_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${q_of1_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${q_ar1_id}"
            - call: "POST /shows"
              payload: { artist_id: "${q_ar2_id}", venue_id: "${q_vn_id}", event_at: "2026-10-20T02:00:00.000Z", load_in_at: "2026-10-19T14:00:00.000Z", load_out_at: "2026-10-20T08:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 200000 }
              as: TalentBuyer
              captures: { q_sh2_id: $.data.id, q_sh2_v1: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${q_sh2_id}", expected_show_version: "${q_sh2_v1}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 2000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { q_of2_id: $.data.id }
          trigger:
            - call: "POST /offers/${q_of2_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${q_ar2_id}"
              captures: { q_err_high: $.data.error_id }
            - call: "POST /offers/${q_of2_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${q_of2_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${q_ar2_id}"
              captures: { q_err_low: $.data.error_id }
          assert:
            - "${q_err_high} == ERR_INVALID_STATE with HTTP 409 — priority 17 outranks priority 41 even though both conditions hold on that call"
            - "${q_err_high} != ERR_MARKET_EXPOSURE_EXCEEDED"
            - "${q_err_low} == ERR_MARKET_EXPOSURE_EXCEEDED with HTTP 402 — with the state defect repaired, the fiscal rule fires, proving it was evaluated and simply outranked before"
            - "Offer.${q_of2_id}.status == SUBMITTED after the whole trigger sequence — the fiscal rejection left the offer acceptable-in-principle and did not transition it"
            - "Market.${q_mk_id}.committed_guarantee_cents == 4000000, exposure_utilization_pct == 80.00, risk_posture == WATCH — unchanged by both rejections"
            - "Show.${q_sh2_id}.show_status == PLANNED and committed_guarantee_cents == 0 after both rejections"
            - "Artist.${q_ar2_id}.confirmed_show_count == 0 — no cascade ran"

      - name: variance_decision_authority_check_preempts_cap_validity_check
        grounds:
          - "validations[priority=34]"
          - "validations[priority=35]"
          - "errors[ERR_VARIANCE_APPROVAL_AUTHORITY]"
          - "errors[ERR_VARIANCE_CAP_INVALID]"
          - "state_machines.BudgetLine.PENDING_APPROVAL_to_APPROVED"
          - "entities.BudgetLine.fields.required_approver_role"
        distinguishing_aspect: |
          ERROR-CATEGORY PAIR: business_safety (priority 34) versus business_constraint
          (priority 35) — a DIFFERENT pair from the sibling instance's state/business_fiscal pair.
          A single call violates both: a TourAccountant decides a line whose required_approver_role
          is RISK_OFFICER (34) while also supplying approved_cap_cents 150000 below the line's
          budgeted_cents 200000 (35). The response must be ERR_VARIANCE_APPROVAL_AUTHORITY (403).
          Note the actor is inside the endpoint's declared roles, so priority 2 ERR_ROLE_FORBIDDEN
          is NOT in play — this is a data-dependent authority rule, not static RBAC.
        test_recipe:
          setup:
            - "One Market (limit 10000000), Artist, Venue and a CONFIRMED RENTAL show with a FLAT_GUARANTEE offer of 1000000 accepted and expense_cap_cents 1000000."
            - "One BudgetLine: HOSPITALITY, budgeted_cents 200000, is_artist_deductible true."
            - "One VendorInvoice for 260000 on that line, verified by acct-alice and approved by acct-bob, so the cascade left the line at variance_pct 30.00, variance_status PENDING_APPROVAL and required_approver_role RISK_OFFICER (30.00 exceeds VARIANCE_ESCALATION_PCT 25.00)."
            - "No tiers exist and the show never went on sale — nothing in this instance depends on ticket revenue."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Four Corners", region_code: "FCR", guarantee_exposure_limit_cents: 10000000 }
              as: RiskOfficer
              captures: { v_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Mesa Drift", agency: "Canyon Route", tier: "CLUB", historical_sellthrough_pct: 44.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { v_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${v_mk_id}", name: "Mesa Social Club", gross_capacity: 700, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { v_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${v_ar_id}", venue_id: "${v_vn_id}", event_at: "2026-10-08T02:00:00.000Z", load_in_at: "2026-10-07T14:00:00.000Z", load_out_at: "2026-10-08T08:00:00.000Z", announce_at: "2026-08-25T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 50000 }
              as: TalentBuyer
              captures: { v_sh_id: $.data.id, v_sh_v1: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${v_sh_id}", expected_show_version: "${v_sh_v1}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { v_of_id: $.data.id }
            - call: "POST /offers/${v_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${v_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${v_ar_id}"
            - call: "POST /budget-lines"
              payload: { show_id: "${v_sh_id}", category: "HOSPITALITY", description: "green room catering", budgeted_cents: 200000, is_artist_deductible: true }
              as: TourAccountant
              captures: { v_bl_id: $.data.id }
            - call: "POST /vendor-invoices"
              payload: { show_id: "${v_sh_id}", budget_line_id: "${v_bl_id}", vendor_name: "High Mesa Catering", amount_cents: 260000, invoice_date: "2026-10-07", documentation_ref: "INV-V-0001" }
              as: TourAccountant
              as_user_id: "acct-alice"
              captures: { v_inv_id: $.data.id }
            - call: "POST /vendor-invoices/${v_inv_id}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "acct-alice"
            - call: "POST /vendor-invoices/${v_inv_id}/approve"
              payload: {}
              as: TourAccountant
              as_user_id: "acct-bob"
          trigger:
            - call: "POST /budget-lines/${v_bl_id}/variance-decision"
              payload: { decision: "APPROVE", approved_cap_cents: 150000, variance_justification: "accountant tries to approve a risk-officer line with a cap below budget" }
              as: TourAccountant
              as_user_id: "acct-bob"
              captures: { v_err_high: $.data.error_id }
            - call: "POST /budget-lines/${v_bl_id}/variance-decision"
              payload: { decision: "APPROVE", approved_cap_cents: 150000, variance_justification: "risk officer retries with the same below-budget cap" }
              as: RiskOfficer
              as_user_id: "risk-rita"
              captures: { v_err_low: $.data.error_id }
            - call: "POST /budget-lines/${v_bl_id}/variance-decision"
              payload: { decision: "APPROVE", approved_cap_cents: 250000, variance_justification: "risk officer allows 250000 of the 260000 spend; 10000 disallowed" }
              as: RiskOfficer
              as_user_id: "risk-rita"
              captures: { v_ok_status: $.data.variance_status, v_ok_expense: $.data.settlement_expense_cents }
          assert:
            - "BudgetLine.${v_bl_id}.variance_pct == 30.00 and required_approver_role == RISK_OFFICER before the trigger"
            - "${v_err_high} == ERR_VARIANCE_APPROVAL_AUTHORITY with HTTP 403 — priority 34 outranks priority 35 even though the cap is also invalid on that same call"
            - "${v_err_high} != ERR_VARIANCE_CAP_INVALID and ${v_err_high} != ERR_ROLE_FORBIDDEN — TourAccountant IS a declared role on this endpoint, so the denial is data-dependent authority, not static RBAC"
            - "${v_err_low} == ERR_VARIANCE_CAP_INVALID with HTTP 422 — with the authority defect repaired, the cap rule fires on the identical payload"
