      - name: checkin_requires_flight_in_weather_review
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
        distinguishing_aspect: |
          Entity pair Reservation→Flight: CHECK_IN is rejected while the flight is
          still SCHEDULED (must be WEATHER_REVIEW or CLEARED_FOR_LAUNCH) — the
          reservation's valid transitions depend on the parent flight's state.
        test_recipe:
          setup:
            - "SCHEDULED SHARED flight; CONFIRMED reservation, party 1, passenger added (manifest complete)"
            - "Clock inside window but flight never entered WEATHER_REVIEW"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
