  - rule_id: transitive_cascade
    instances:
      - name: adaptive_review_off_track_cascade_watershed_to_transaction_to_batch_and_permit
        grounds:
          - calculations.watershed_response_evaluation
          - state_machines.Watershed.ACTIVE_to_ADAPTIVE_HOLD
          - state_machines.CreditTransaction.APPROVED_to_VOIDED
          - state_machines.Permit.RESOLVED_to_SHORTFALL
          - entities.AdaptiveReview.fields.voided_transaction_count
          - entities.CreditTransaction.fields.void_reason
          - entities.Watershed.fields.reserve_pool_lbs
        distinguishing_aspect: |
          A single POST /adaptive-reviews/{id}/finalize propagates four levels deep with no
          intermediate call: review verdict OFF_TRACK (level 1) -> Watershed ACTIVE ->
          ADAPTIVE_HOLD (level 2) -> the one APPROVED CreditTransaction -> VOIDED with
          void_reason ADAPTIVE_HOLD (level 3) -> CreditBatch retired_lbs 3000.00 returns to
          available_lbs and Permit credit_applied_lbs falls 1084.00 -> 0.00 flipping
          compliance_status RESOLVED -> SHORTFALL (level 4). The cascade trigger is a
          WATERSHED-LEVEL monitoring verdict, and the credits survive as reusable
          available_lbs rather than being destroyed.
        test_recipe:
          setup:
            - "Watershed SCR ACTIVE via an APPROVED TMDL (LC 60000.00, MOS 0.1000, background 6000.00, baseline 120000.00, interim_target_pct 25.00) with a PRO_RATA_BY_EXISTING_LOAD run allocating 21888.00 to City WWTP; reserve_pool_lbs is 2400.00 after the run."
            - "Permit OH0012345 (current load 30000.00, effective 2026-03-01) is INTERIM with applicable limit 23916.00 and reported 25000.00 for 2026, so its gap was 1084.00."
            - "PracticeProject PP-B on tract T-202 (COVER_CROP, R_UP, zone Z1, enrolled 200.00, pre 5300.00, post 1300.00, vintage 2026) is CERTIFIED with verified_acres 200.00, producing CreditBatch B with issued_lbs 4000, residual 0.00; the batch is LISTED."
            - "A 3000.00-lb transaction against batch B was APPROVED, delivering 1215.00 lbs of which 1084.00 was applied, so the Permit is RESOLVED with compliance_gap_lbs 0.00, batch B holds available 1000.00 / retired 3000.00, and reserve_pool_lbs is 2700.00."
            - "One ACCEPTED COMPLIANCE_POINT sample on R_OUT dated 2026-07-01 computes to 108067.63 lbs/yr, and an OPEN AdaptiveReview covers 2026-01-01..2026-12-31."
