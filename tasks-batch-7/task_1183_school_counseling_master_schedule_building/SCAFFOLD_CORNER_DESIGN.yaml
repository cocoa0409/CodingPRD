            - "term COLLECTING; student s_cap holds 8 SUBMITTED primaries (courses CAP-1..CAP-8, credits 1.0 each... pinned credits 0.25 each to stay under the 8.0 credit ceiling so the count rule, not the credit rule, fires); 9th DRAFT request rq_c9 on CAP-9"
