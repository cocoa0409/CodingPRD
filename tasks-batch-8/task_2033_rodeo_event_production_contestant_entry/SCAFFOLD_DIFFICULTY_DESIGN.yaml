            - { call: "POST /api/run-results", payload: { draw_assignment_id: "${da_d}", judge_1_score: 42, judge_2_score: 43, qualified_flag: true }, as: Judge, as_user_id: "${j_id}", captures: { rr_d: $.data.id } }
            - { call: "POST /api/run-results", payload: { draw_assignment_id: "${da_b}", judge_1_score: 40, judge_2_score: 40, qualified_flag: true }, as: Judge, as_user_id: "${j_id}", captures: { rr_b: $.data.id } }
