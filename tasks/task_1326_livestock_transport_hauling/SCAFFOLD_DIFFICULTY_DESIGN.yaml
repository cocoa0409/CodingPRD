          Category pair state vs business_safety: assign-driver on a load still in
          PLANNED with a SESSION_EXHAUSTED driver (session exactly 660 min) violates
          both rules; the state error ERR_LOAD_NOT_PAPERWORK_VERIFIED (priority 7)
          MUST win over ERR_DRIVER_NOT_HOS_ELIGIBLE (priority 12).
        test_recipe:
          setup:
