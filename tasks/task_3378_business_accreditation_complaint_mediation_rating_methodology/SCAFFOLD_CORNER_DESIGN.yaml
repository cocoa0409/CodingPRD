              captures: { biz_b_id: $.data.id, biz_b_v: $.data.version }
          trigger:
            - call: "POST /businesses/${biz_b_id}/rating-disputes"
              payload: { snapshot_id: "${snap_a_id}", reason: "wrong snapshot", expected_business_version: "${biz_b_v}" }
              as: BusinessRep
              as_user_id: "${biz_b_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_SNAPSHOT_BUSINESS_MISMATCH"
            - "GET /businesses/${biz_b_id}/rating-disputes returns 0 rows"

  # ===========================================================================
  - section: roles
    instances:
      - name: consumer_cannot_forward_complaint
        claim_type: RBAC Denial
        grounds:
