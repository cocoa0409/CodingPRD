            - "CustomCakeOrder.${order_id}.rush_fee_cents == 1584 (subtotal >= 15000 so RUSH_PCT_HIGH 0.08)"
            - "CustomCakeOrder.${order_id}.volume_discount_cents == 2138 (pre_discount 21384 >= 20000 so DISCOUNT_PCT_HIGH 0.10, round_half_up(2138.4))"
            - "CustomCakeOrder.${order_id}.quote_total_cents == 19246, NOT 20315 (the discount-then-fee ordering)"
            - "CustomCakeOrder.${order_id}.required_decoration_lead_minutes == 360 (240 + 30*4) and decoration_deadline_utc == 2026-08-12T08:00:00Z"
