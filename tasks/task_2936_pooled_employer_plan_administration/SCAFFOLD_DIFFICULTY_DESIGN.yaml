    instances:

      - name: pay_period_half_open_adjacency_allowed_containment_rejected
        grounds:
          - validations[priority=40]
          - validations[priority=41]
          - entities.PayrollBatch.fields.pay_period_start
          - entities.PayrollBatch.fields.pay_period_end
        distinguishing_aspect: |
          The pay period is a half-open interval [start, end) scoped to one adopting employer,
          so the two neighbours that share a single date with an incumbent period are both
          legal while a one-day intrusion, a fully contained period and a fully containing
          period are all rejected — and the very same interval is legal again for a different
          employer of the same plan. The degenerate empty period is caught by the ordering rule
