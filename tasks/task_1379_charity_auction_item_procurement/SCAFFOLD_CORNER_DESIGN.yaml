# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of §1.1–§1.7 claims not already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Standard event config and the
# default logical clock 2026-08-01T00:00:00Z apply as in §1.8.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: gala_event_creation_defaults
        claim_type: creation
        grounds:
          - "entities.GalaEvent"
          - "endpoints.POST_/gala-events"
        distinguishing_aspect: "Creating a gala event returns 201 with status DRAFT and version 1 regardless of config values."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /gala-events", payload: { name: "Gala Defaults", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id", st: "$.data.status", v: "$.data.version" } }
          assert:
            - "response status == DRAFT and version == 1"
            - "id is a server-minted UUID; created_at/updated_at present"

      - name: gala_event_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "endpoints.GET_/gala-events/{id}"
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /gala-events/00000000-0000-0000-0000-000000000000", payload: {}, as: GalaAdmin, captures: { err_id: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: donor_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - "entities.Donor.fields.email"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required field email on POST /donors yields ERR_INVALID_REQUEST (400); no donor row is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /donors", payload: { full_name: "No Email", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { err_id: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: bidder_paddle_unique_per_event
        claim_type: type_constraints
        grounds:
          - "entities.Bidder.fields.paddle_no"
          - "errors[ERR_PADDLE_TAKEN]"
        distinguishing_aspect: "paddle_no uniqueness is scoped to gala_event_id: duplicate within one event is rejected (409), same paddle in a different event succeeds."
        test_recipe:
          setup: ["two events ev1, ev2 created"]
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala P1", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev1: "$.data.id" } }
            - { call: "POST /gala-events", payload: { name: "Gala P2", gala_date: "2026-12-05", bidding_opens_at: "2026-12-05T18:00:00Z", bidding_closes_at: "2026-12-05T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev2: "$.data.id" } }
            - { call: "POST /bidders", payload: { gala_event_id: "${ev1}", full_name: "Bidder A", email: "ba@x.org", paddle_no: 7, payment_method_on_file: true }, as: GalaAdmin, captures: { br1: "$.data.id" } }
          trigger:
            - { call: "POST /bidders", payload: { gala_event_id: "${ev1}", full_name: "Bidder B", email: "bb@x.org", paddle_no: 7, payment_method_on_file: true }, as: GalaAdmin, captures: { err_id: "$.data.error_id" } }
            - { call: "POST /bidders", payload: { gala_event_id: "${ev2}", full_name: "Bidder C", email: "bc@x.org", paddle_no: 7, payment_method_on_file: true }, as: GalaAdmin, captures: { br2: "$.data.id" } }
          assert:
            - "duplicate paddle 7 in ev1 -> error_id == ERR_PADDLE_TAKEN (409)"
            - "paddle 7 in ev2 -> 201, new bidder id returned (event-scoped uniqueness)"

      - name: bidder_create_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Bidder.fields.status"
        distinguishing_aspect: "Client-supplied status on create is ignored: the bidder is REGISTERED (system-controlled initial state), never SUSPENDED."
        test_recipe:
          setup: ["event ev1 created"]
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala SF", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev1: "$.data.id" } }
          trigger:
            - { call: "POST /bidders", payload: { gala_event_id: "${ev1}", full_name: "Sneaky", email: "sn@x.org", paddle_no: 9, payment_method_on_file: false, status: "SUSPENDED" }, as: GalaAdmin, captures: { st: "$.data.status" } }
          assert:
            - "response status == REGISTERED (client-supplied status ignored)"

      - name: items_list_pagination_and_filter
        claim_type: listing
        grounds:
          - "endpoints.GET_/items"
          - "response_envelope"
        distinguishing_aspect: "GET /items with gala_event_id filter and limit=2 paginates: total_count reflects all 3 matches, has_more flips between pages."
        test_recipe:
          setup: ["event in SOLICITING with one donor and three PLEDGED solicitations fulfilled into three items"]
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala PG", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor L1", email: "dl1@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn1: "$.data.id" } }
            - { call: "POST /donors", payload: { full_name: "Donor L2", email: "dl2@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn2: "$.data.id" } }
            - { call: "POST /donors", payload: { full_name: "Donor L3", email: "dl3@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn3: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn1}", gala_event_id: "${ev}", ask_description: "A1", ask_estimate_cents: 10000 }, as: ProcurementOfficer, captures: { so1: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn2}", gala_event_id: "${ev}", ask_description: "A2", ask_estimate_cents: 10000 }, as: ProcurementOfficer, captures: { so2: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn3}", gala_event_id: "${ev}", ask_description: "A3", ask_estimate_cents: 10000 }, as: ProcurementOfficer, captures: { so3: "$.data.id" } }
            - { call: "POST /solicitations/${so1}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so2}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so3}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so1}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so2}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so3}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so1}", title: "I1", description: "1", kind: "PHYSICAL" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so2}", title: "I2", description: "2", kind: "PHYSICAL" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so3}", title: "I3", description: "3", kind: "PHYSICAL" }, as: ProcurementOfficer }
          trigger:
            - { call: "GET /items", payload: { gala_event_id: "${ev}", limit: 2, offset: 0 }, as: GalaAdmin }
            - { call: "GET /items", payload: { gala_event_id: "${ev}", limit: 2, offset: 2 }, as: GalaAdmin }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"
            - "envelope carries meta.api_request_id and response_type == array"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: send_withdrawn_solicitation_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Solicitation"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "WITHDRAWN is terminal: POST /solicitations/{id}/send after withdrawal fails with ERR_INVALID_STATE and last_sent_at stays null."
        test_recipe:
          setup: ["event in SOLICITING; solicitation withdrawn from DRAFT"]
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala SM", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor SM", email: "dsm@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Ask", ask_estimate_cents: 10000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "WITHDRAWN" }, as: ProcurementOfficer }
          trigger:
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer, captures: { err_id: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE (WITHDRAWN terminal)"
            - "Solicitation.${so}.last_sent_at remains null"

      - name: approve_already_decided_valuation_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Valuation.SUBMITTED_to_APPROVED"
          - "errors[ERR_VALUATION_ALREADY_DECIDED]"
        distinguishing_aspect: "Second approve on an APPROVED valuation fails with ERR_VALUATION_ALREADY_DECIDED (decide-twice idempotency guard)."
        test_recipe:
          setup: ["event SOLICITING; item with valuation va already APPROVED"]
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala VA", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor VA", email: "dva@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Ask", ask_estimate_cents: 30000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "V", description: "v", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it: "$.data.id", it_v: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 30000, fmv_source: "APPRAISAL", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va: "$.data.id" } }
            - { call: "POST /valuations/${va}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
          trigger:
            - { call: "POST /valuations/${va}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1", captures: { err_id: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALUATION_ALREADY_DECIDED (409)"

      - name: disposition_terminal_lockdown_after_executed
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Disposition.DONOR_NOTIFIED_to_EXECUTED"
          - "errors[ERR_DISPOSITION_FORBIDDEN]"
        distinguishing_aspect: "After EXECUTED, both decide and donor-response are rejected with ERR_DISPOSITION_FORBIDDEN; the reconsideration cycle cannot reopen a terminal disposition."
        test_recipe:
          setup: ["event closed; unsold bundle; disposition disp EXECUTED via RETURN_TO_DONOR accepted by the donor"]
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala TL", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor TL", email: "dtl@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Lamp", ask_estimate_cents: 40000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "Lamp", description: "Brass", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it: "$.data.id", it_v: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 40000, fmv_source: "APPRAISAL", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va: "$.data.id" } }
            - { call: "POST /valuations/${va}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Lamp" }, as: CatalogManager, captures: { bd: "$.data.id" } }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it}" }, as: CatalogManager }
            - { call: "POST /bundles/${bd}/publish", payload: {}, as: CatalogManager }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "GET /dispositions", payload: { item_id: "${it}" }, as: GalaAdmin, captures: { disp: "$.data[0].id" } }
            - { call: "POST /dispositions/${disp}/decide", payload: { decision: "RETURN_TO_DONOR" }, as: GalaAdmin }
            - { call: "POST /dispositions/${disp}/donor-response", payload: { accept: true }, as: Donor, as_user_id: "${dn}" }
          trigger:
            - { call: "POST /dispositions/${disp}/donor-response", payload: { accept: false }, as: Donor, as_user_id: "${dn}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /dispositions/${disp}/decide", payload: { decision: "DISCARD" }, as: GalaAdmin, captures: { err2: "$.data.error_id" } }
            - { call: "GET /items/${it}", payload: {}, as: GalaAdmin, captures: { it_st: "$.data.status" } }
          assert:
            - "donor-response on EXECUTED -> error_id ERR_DISPOSITION_FORBIDDEN"
            - "decide on EXECUTED -> error_id ERR_DISPOSITION_FORBIDDEN"
            - "Item.${it}.status == RETURNED_TO_DONOR (terminal disposition side effect already applied)"

      - name: certificate_redeem_twice_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Certificate.ISSUED_to_REDEEMED"
          - "errors[ERR_CERTIFICATE_NOT_REDEEMABLE]"
        distinguishing_aspect: "REDEEMED is terminal: a second redeem on the same certificate fails with ERR_CERTIFICATE_NOT_REDEEMABLE."
        test_recipe:
          setup: ["event closed; EXPERIENCE bundle (FMV 40000) sold 50000 and fully paid; certificate ISSUED and already redeemed once"]
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala RT", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor RT", email: "drt@x.org", donor_type: "BUSINESS" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Dinner", ask_estimate_cents: 40000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "Dinner", description: "Chef", kind: "EXPERIENCE" }, as: ProcurementOfficer, captures: { it: "$.data.id", it_v: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 40000, fmv_source: "DONOR_DECLARED", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va: "$.data.id" } }
            - { call: "POST /valuations/${va}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Dinner" }, as: CatalogManager, captures: { bd: "$.data.id" } }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it}" }, as: CatalogManager }
            - { call: "POST /bundles/${bd}/publish", payload: {}, as: CatalogManager, captures: { bd_v: "$.data.version" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bidders", payload: { gala_event_id: "${ev}", full_name: "Bidder A", email: "ba@x.org", paddle_no: 1, payment_method_on_file: true }, as: GalaAdmin, captures: { br: "$.data.id" } }
            - { call: "POST /bundles/${bd}/bids", payload: { amount_cents: 50000, expected_bundle_version: "${bd_v}" }, as: Bidder, as_user_id: "${br}" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "GET /invoices", payload: { bundle_id: "${bd}" }, as: GalaAdmin, captures: { inv: "$.data[0].id" } }
            - { call: "POST /invoices/${inv}/payments", payload: { amount_cents: 50000, method: "CARD" }, as: Bidder, as_user_id: "${br}", captures: { pay: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { payment_id: "${pay}", outcome: "SUCCEEDED" }, as: GalaAdmin }
            - { call: "GET /invoices/${inv}/certificates", payload: {}, as: GalaAdmin, captures: { cert: "$.data[0].id" } }
