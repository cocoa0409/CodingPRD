# =============================================================================
# PRD Benchmark Seed Tables — Equity Award Administration & Trading Plan Oversight
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2882. Equity Award Administration & Trading Plan Oversight (public company stock plan administration): grant approval workflow with board or delegated authority and grant date determination, vesting schedule tracking across time-based, performance-based and retirement-eligibility acceleration, tax withholding method by jurisdiction with sell-to-cover and share withholding mechanics, mobile employee tax allocation across countries and states based on workday sourcing, share reserve monitoring, evergreen provisions and burn rate against plan limits, trading window administration, preclearance and pre-established trading plan adoption with cooling-off periods, insider transaction reporting deadlines, forfeiture, repurchase and post-termination exercise periods

domain_name: "equity-award-administration"
# Flat topology: every entity is a top-level collection reachable by its own
# segment (`/grants`, `/participants`, ...). No entity is nested in a URL path.
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Thirteen peer entities linked by explicit foreign keys; no nesting in URL
  # paths. Reserve accounting, tax sourcing and trading compliance cut across
  # the whole graph instead of following an ownership tree.

  state_machine_shape: branching
  # Grant: DRAFT -> PENDING_APPROVAL -> CHANGES_REQUESTED -> PENDING_APPROVAL
  # (revision cycle) then a fork into BOARD vs DELEGATED approval whose
  # side-effect sets diverge. PreclearanceRequest carries its own
  # SUBMITTED -> INFO_REQUESTED -> SUBMITTED cycle with a revision cap.
  # VestingEvent carries two independent status dimensions on one row.

  relationship_patterns:
    - one_to_many          # EquityPlan -> Grant, Grant -> VestingTranche
    - cross_aggregate      # VestingTranche -> PerformanceCycle, PreclearanceRequest -> TradingWindow
    - self_referential     # TradingPlan.superseded_plan_id -> TradingPlan.id
    - polymorphic          # TransactionReport.source_type + source_id

  role_model: segregation_of_duties
  # The user who submits a Grant for approval may not approve it; the acting
  # X-User-ID is compared against Grant.submitted_by_user_id. Delegated
  # approval additionally requires the acting id to equal the cited
  # ApprovalAuthority.delegate_user_id.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 63 endpoints / 14 calculations / 10 state machines /
  # 35 ordered validations / 60 errors / 6 roles / 2 OCC rules.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: EquityPlan
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable plan name, e.g. 2026 Omnibus Incentive Plan.
        constraints: "1..120 chars"
      - name: total_authorized_shares
        type: integer
        source: input
        description: Shareholder-authorized share pool, grown by evergreen top-ups and reserve adjustments.
        constraints: ">= 1"
      - name: common_shares_outstanding
        type: integer
        source: input
        description: Common shares outstanding used as the burn-rate and evergreen denominator.
        constraints: ">= 1"
      - name: fiscal_year_start_date
        type: string
        source: input
        description: ISO date YYYY-MM-DD marking the first day of the current fiscal year.
      - name: current_fiscal_year_label
        type: string
        source: input
        description: Label of the fiscal year the burn-rate accumulators belong to.
        default: "FY2026"
      - name: evergreen_pct_bps
        type: integer
        source: input
        description: Evergreen provision in basis points of common_shares_outstanding added at annual rollover.
        default: 0
        constraints: "0..10000"
      - name: evergreen_cap_shares
        type: integer
        source: input
        description: Hard ceiling on a single evergreen top-up, in shares.
        default: 0
        constraints: ">= 0"
      - name: burn_rate_limit_bps
        type: integer
        source: input
        description: Maximum permitted fiscal-year gross burn rate in basis points; 10000 disables the gate.
        default: 10000
        constraints: "1..10000"
      - name: fungible_ratio_full_value_bps
        type: integer
        source: input
        description: Fungible share ratio in basis points charged against the reserve for full-value awards (RSU, PSU).
        default: 10000
        constraints: ">= 10000"
      - name: low_reserve_threshold_bps
        type: integer
        source: input
        description: Reserve floor in basis points of total_authorized_shares below which reserve_posture becomes RESTRICTED.
        default: 0
        constraints: "0..10000"
      - name: next_earnings_release_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the next scheduled earnings release, used by the cooling-off calculation.
        default: null
      - name: status
        type: enum
        source: system
        description: Plan lifecycle status gating every grant-lifecycle write.
        default: ACTIVE
        constraints: "ACTIVE | FROZEN | TERMINATED"
      - name: freeze_reason
        type: string
        source: system
        description: Reason recorded on the most recent transition into FROZEN or TERMINATED.
        default: null
      - name: shares_committed_cumulative
        type: integer
        source: computed
        description: Monotonic accumulator of fungible-weighted shares committed by grant approvals and upward performance revisions.
        default: 0
      - name: shares_returned_cumulative
        type: integer
        source: computed
        description: Monotonic accumulator of fungible-weighted shares returned by cancellation, forfeiture and downward performance revisions.
        default: 0
      - name: available_reserve_shares
        type: integer
        source: computed
        description: total_authorized_shares - shares_committed_cumulative + shares_returned_cumulative.
      - name: reserve_posture
        type: enum
        source: computed
        description: OPEN when available_reserve_shares * 10000 >= low_reserve_threshold_bps * total_authorized_shares, else RESTRICTED.
        constraints: "OPEN | RESTRICTED"
      - name: fiscal_year_gross_granted_shares
        type: integer
        source: computed
        description: Fungible-weighted shares committed inside the current fiscal year; reset by annual rollover.
        default: 0
      - name: fiscal_year_returned_shares
        type: integer
        source: computed
        description: Fungible-weighted shares returned inside the current fiscal year; reset by annual rollover.
        default: 0
      - name: gross_burn_rate_bps
        type: integer
        source: computed
        description: GROSS variant of the burn-rate calculation over fiscal_year_gross_granted_shares.
        default: 0
      - name: net_burn_rate_bps
        type: integer
        source: computed
        description: NET variant of the burn-rate calculation, gross minus fiscal_year_returned_shares.
        default: 0
      - name: evergreen_topup_last_shares
        type: integer
        source: computed
        description: Shares added by the most recent annual rollover evergreen top-up.
        default: 0

  - name: ApprovalAuthority
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> EquityPlan.id; the plan whose grants this delegation may approve.
      - name: authority_type
        type: enum
        source: input
        description: Kind of delegation the board has granted.
        constraints: "DELEGATED_OFFICER | COMMITTEE"
      - name: delegate_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the DelegatedOfficer permitted to approve under this authority.
      - name: per_grant_share_cap
        type: integer
        source: input
        description: Maximum fungible-weighted shares a single grant may consume under this authority.
        constraints: ">= 1"
      - name: aggregate_share_cap
        type: integer
        source: input
        description: Maximum cumulative fungible-weighted shares this authority may approve over its life.
        constraints: ">= 1"
      - name: effective_from
        type: string
        source: input
        description: ISO date YYYY-MM-DD; first date on which the authority may be exercised (inclusive).
      - name: effective_to
        type: string
        source: input
        description: ISO date YYYY-MM-DD; last date on which the authority may be exercised (inclusive).
      - name: consumed_shares
        type: integer
        source: computed
        description: Fungible-weighted shares consumed by grants approved under this authority.
        default: 0
      - name: remaining_shares
        type: integer
        source: computed
        description: aggregate_share_cap - consumed_shares.
      - name: status
        type: enum
        source: system
        description: Authority lifecycle status.
        default: ACTIVE
        constraints: "ACTIVE | EXHAUSTED | REVOKED | EXPIRED"
      - name: revoked_at
        type: datetime
        source: system
        description: Logical-clock instant at which the board revoked the authority.
        default: null

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Participant legal name.
      - name: employee_number
        type: string
        source: input
        description: Issuer-wide unique employee number.
        constraints: "unique across all Participant rows"
      - name: home_country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of the participant's home payroll.
      - name: home_state_code
        type: string
        source: input
        description: Home state or province code, null outside the United States.
        default: null
      - name: hire_date
        type: string
        source: input
        description: ISO date YYYY-MM-DD of hire, the service-years anchor.
      - name: birth_date
        type: string
        source: input
        description: ISO date YYYY-MM-DD of birth, the age-years anchor.
      - name: insider_status
        type: enum
        source: input
        description: Insider classification driving cooling-off length, report form type and reporting duty.
        default: NON_INSIDER
        constraints: "NON_INSIDER | DESIGNATED_INSIDER | SECTION_16_OFFICER"
      - name: employment_status
        type: enum
        source: system
        description: Employment lifecycle status.
        default: ACTIVE
        constraints: "ACTIVE | TERMINATED"
      - name: termination_date
        type: string
        source: system
        description: ISO date YYYY-MM-DD recorded by the termination workflow.
        default: null
      - name: termination_reason
        type: enum
        source: system
        description: Reason recorded by the termination workflow; drives acceleration and post-termination exercise period.
        default: null
        constraints: "VOLUNTARY | INVOLUNTARY | FOR_CAUSE | RETIREMENT | DEATH"
      - name: age_years
        type: integer
        source: computed
        description: Whole completed years from birth_date to the reference date (logical clock date, or termination_date once TERMINATED).
      - name: service_years
        type: integer
        source: computed
        description: Whole completed years from hire_date to the reference date (logical clock date, or termination_date once TERMINATED).
      - name: retirement_eligible
        type: boolean
        source: computed
        description: True when age_years >= 55 AND age_years + service_years >= 65 at the reference date.
      - name: ptep_expiry_date
        type: string
        source: computed
        description: ISO date YYYY-MM-DD on which the post-termination exercise period ends; null while ACTIVE.
        default: null

  - name: MobilityAssignment
    parent: null
    common_fields: false
    fields:
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id; the mobile employee this assignment period belongs to.
      - name: jurisdiction_code
        type: string
        source: input
        description: Sourcing jurisdiction key, e.g. US-CA, US-NY, GB, IE.
        constraints: "2..8 chars"
      - name: tax_rate_bps
        type: integer
        source: input
        description: Combined supplemental withholding rate of the jurisdiction in basis points.
        constraints: "0..10000"
      - name: start_date
        type: string
        source: input
        description: ISO date YYYY-MM-DD; first day of the assignment period (inclusive).
      - name: end_date
        type: string
        source: input
        description: ISO date YYYY-MM-DD; last day of the assignment period (inclusive).
        constraints: ">= start_date"
      - name: workdays
        type: integer
        source: input
        description: Workdays physically performed in this jurisdiction during the period; the sourcing numerator.
        constraints: ">= 0"

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> EquityPlan.id; the plan whose reserve this grant charges.
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id; the award recipient.
      - name: award_type
        type: enum
        source: input
        description: Award instrument; RSU and PSU are full-value awards charged at the fungible ratio, ISO and NSO are option awards charged one-for-one.
        constraints: "RSU | PSU | ISO | NSO"
      - name: target_shares
        type: integer
        source: input
        description: Sum of the tranche target_shares requested at draft time.
        constraints: ">= 1; must equal the sum of vesting_schedule[].target_shares"
      - name: exercise_price_cents
        type: integer
        source: input
        description: Per-share exercise price in cents; required for ISO and NSO, forbidden for RSU and PSU.
        default: null
        constraints: ">= 1 when present"
      - name: status
        type: enum
        source: system
        description: Grant approval and lifecycle status.
        default: DRAFT
        constraints: "DRAFT | PENDING_APPROVAL | CHANGES_REQUESTED | APPROVED | GRANTED | PARTIALLY_FORFEITED | FORFEITED | CANCELLED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID that most recently submitted the grant for approval; the segregation-of-duties comparand.
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID that approved the grant.
        default: null
      - name: approval_path
        type: enum
        source: system
        description: Which authority approved the grant.
        default: null
        constraints: "BOARD | DELEGATED"
      - name: approved_under_authority_id
        type: string
        source: system
        description: FK -> ApprovalAuthority.id; set only on the DELEGATED approval branch, null on the BOARD branch.
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: Logical-clock instant of approval.
        default: null
      - name: grant_date
        type: string
        source: computed
        description: ISO date YYYY-MM-DD determined at issuance by the grant-date determination rule.
        default: null
      - name: changes_requested_count
        type: integer
        source: computed
        description: Number of times the approver has bounced the grant back to CHANGES_REQUESTED.
        default: 0
      - name: weighted_reserve_shares
        type: integer
        source: computed
        description: Fungible-weighted shares this grant currently holds against the plan reserve.
        default: 0
      - name: outstanding_shares
        type: integer
        source: computed
        description: Sum of VestingTranche.shares over this grant's tranches whose status IN {UNVESTED, VESTED}.
        default: 0
      - name: cancel_reason
        type: string
        source: system
        description: Reason recorded on cancellation.
        default: null

  - name: VestingTranche
    parent: null
    common_fields: true
    fields:
      - name: grant_id
        type: string
        source: input
        description: FK -> Grant.id; the grant this tranche belongs to.
      - name: performance_cycle_id
        type: string
        source: input
        description: FK -> PerformanceCycle.id; required when vest_type is PERFORMANCE, null when vest_type is TIME.
        default: null
      - name: tranche_index
        type: integer
        source: input
        description: One-based ordinal of the tranche inside its grant.
        constraints: ">= 1; unique per grant_id"
      - name: vest_type
        type: enum
        source: input
        description: Vesting condition family.
        constraints: "TIME | PERFORMANCE"
      - name: scheduled_vest_date
        type: string
        source: input
        description: ISO date YYYY-MM-DD on which the tranche becomes vestable.
      - name: target_shares
        type: integer
        source: input
        description: Shares at target performance, immutable after grant creation.
        constraints: ">= 1"
      - name: shares
        type: integer
        source: computed
        description: Effective share count; equals target_shares for TIME tranches and target_shares scaled by the certified payout multiplier for PERFORMANCE tranches. A PERFORMANCE tranche whose PerformanceCycle is still OPEN carries shares = 0, so it commits nothing against the reserve until certification.
      - name: status
        type: enum
        source: system
        description: Tranche lifecycle status.
        default: UNVESTED
        constraints: "UNVESTED | VESTED | SETTLED | FORFEITED"
      - name: acceleration_reason
        type: enum
        source: system
        description: Set when the tranche vested through the termination acceleration rule rather than the passage of time.
        default: null
        constraints: "RETIREMENT_ELIGIBILITY | DEATH"
      - name: vested_at
        type: datetime
        source: system
        description: Logical-clock instant at which the tranche entered VESTED.
        default: null

  - name: PerformanceCycle
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> EquityPlan.id; the plan under which the metric is measured.
      - name: metric_code
        type: string
        source: input
        description: Performance metric key, e.g. REV_2026 or TSR_2026.
        constraints: "unique per plan_id"
      - name: target_value
        type: number
        source: input
        description: Target level of the metric that produces a 100 percent payout.
        constraints: "> 0"
      - name: certification_due_date
        type: string
        source: input
        description: ISO date YYYY-MM-DD by which the board must certify the cycle.
        default: null
      - name: actual_value
        type: number
        source: system
        description: Achieved level of the metric recorded at certification.
        default: null
      - name: payout_multiplier_bps
        type: integer
        source: computed
        description: Payout multiplier in basis points derived from actual_value over target_value by the tier schedule.
        default: null
      - name: status
        type: enum
        source: system
        description: Certification status.
        default: OPEN
        constraints: "OPEN | CERTIFIED | CANCELLED"
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification.
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the BoardMember that certified the cycle.
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID that opened the cycle; the certifier must differ from it (segregation of duties).

  - name: VestingEvent
    parent: null
    common_fields: true
    fields:
      - name: tranche_id
        type: string
        source: input
        description: FK -> VestingTranche.id; the tranche that vested.
      - name: vest_date
        type: string
        source: system
        description: ISO date YYYY-MM-DD taken from the logical clock at the moment of vesting.
      - name: gross_shares
        type: integer
        source: computed
        description: VestingTranche.shares captured at the moment of vesting.
      - name: fmv_per_share_cents
        type: integer
        source: input
        description: Fair market value per share in cents on the vest date.
        constraints: ">= 1"
      - name: taxable_income_cents
        type: integer
        source: computed
        description: gross_shares * fmv_per_share_cents.
      - name: sourcing_start_date
        type: string
        source: computed
        description: ISO date YYYY-MM-DD; equals Grant.grant_date of the tranche's grant.
      - name: total_workdays
        type: integer
        source: computed
        description: Sum of MobilityAssignment.workdays over the assignments fully contained in the sourcing period.
        default: 0
      - name: total_tax_cents
        type: integer
        source: computed
        description: Round-then-sum total of TaxAllocation.tax_amount_cents for this event.
        default: 0
      - name: blended_rate_bps
        type: integer
        source: computed
        description: total_tax_cents * 10000 / taxable_income_cents, rounded half up to whole basis points.
        default: 0
      - name: withholding_method
        type: enum
        source: input
        description: Method elected at settlement, driving the share and cash mechanics.
        default: null
        constraints: "SHARE_WITHHOLD | SELL_TO_COVER | CASH_REMITTANCE"
      - name: shares_withheld
        type: integer
        source: computed
        description: Whole shares retained by the issuer under SHARE_WITHHOLD; zero otherwise.
        default: 0
      - name: shares_sold
        type: integer
        source: computed
        description: Whole shares sold on the market under SELL_TO_COVER; zero otherwise.
        default: 0
      - name: net_shares_delivered
        type: integer
        source: computed
        description: gross_shares - shares_withheld - shares_sold.
        default: 0
      - name: residual_cash_cents
        type: integer
        source: computed
        description: Over-withheld cash refunded to the participant after the tax remittance.
        default: 0
      - name: cash_due_cents
        type: integer
        source: computed
        description: Cash the participant must remit under CASH_REMITTANCE; zero for the other methods.
        default: 0
      - name: tax_status
        type: enum
        source: system
        description: First independent status dimension - jurisdictional allocation progress.
        default: PENDING_ALLOCATION
        constraints: "PENDING_ALLOCATION | ALLOCATED"
      - name: settlement_status
        type: enum
        source: system
        description: Second independent status dimension - share and cash settlement progress.
        default: PENDING_TAX
        constraints: "PENDING_TAX | SETTLED | REVERSED"
      - name: reversal_reason
        type: string
        source: system
        description: Reason recorded when the settlement is reversed.
        default: null

  - name: TaxAllocation
    parent: null
    common_fields: false
    fields:
      - name: vesting_event_id
        type: string
        source: input
        description: FK -> VestingEvent.id; the settlement whose income this row sources.
      - name: jurisdiction_code
        type: string
        source: system
        description: Sourcing jurisdiction copied from the contributing MobilityAssignment rows.
      - name: workdays_in_period
        type: integer
        source: system
        description: Workdays sourced to this jurisdiction inside the sourcing period.
      - name: allocation_bps
        type: integer
        source: computed
        description: Share of taxable income sourced to this jurisdiction in basis points; the rows sum to exactly 10000.
      - name: tax_rate_bps
        type: integer
        source: system
        description: Jurisdiction supplemental rate copied from MobilityAssignment.tax_rate_bps.
      - name: tax_amount_cents
        type: integer
        source: computed
        description: Rounded per-jurisdiction withholding amount in cents.

  - name: TradingWindow
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: FK -> EquityPlan.id; the issuer plan whose calendar this window belongs to.
      - name: quarter_label
        type: string
        source: input
        description: Label of the fiscal quarter the window follows, e.g. Q3-FY2026.
        constraints: "unique per plan_id"
      - name: open_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant at which the window opens (inclusive).
      - name: close_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant at which the window closes (exclusive).
        constraints: "> open_at"
      - name: aggregate_share_cap
        type: integer
        source: input
        description: Maximum cumulative preclearance shares the compliance team may approve inside this window; null means uncapped.
        default: null
        constraints: ">= 1 when present"
      - name: approved_shares_cumulative
        type: integer
        source: computed
        description: Sum of PreclearanceRequest.requested_shares over this window's requests whose status IN {APPROVED, EXECUTED}.
        default: 0
      - name: status
        type: enum
        source: system
        description: Window administration status.
        default: SCHEDULED
        constraints: "SCHEDULED | OPEN | SUSPENDED | CLOSED"
      - name: suspension_reason
        type: string
        source: system
        description: Reason recorded on the most recent suspension.
        default: null

  - name: PreclearanceRequest
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id; the insider seeking clearance.
      - name: window_id
        type: string
        source: input
        description: FK -> TradingWindow.id; the window the trade would settle inside.
      - name: transaction_type
        type: enum
        source: input
        description: Intended transaction family.
        constraints: "SELL | BUY | GIFT"
      - name: requested_shares
        type: integer
        source: input
        description: Shares the participant intends to transact.
        constraints: ">= 1"
      - name: intended_trade_date
        type: string
        source: input
        description: ISO date YYYY-MM-DD on which the participant intends to trade.
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID that submitted the request; the decider must differ from it (segregation of duties).
      - name: status
        type: enum
        source: system
        description: Preclearance workflow status.
        default: SUBMITTED
        constraints: "SUBMITTED | INFO_REQUESTED | APPROVED | DENIED | EXECUTED | EXPIRED | VOID"
      - name: revision_count
        type: integer
        source: computed
        description: Number of completed INFO_REQUESTED to SUBMITTED revision loops.
        default: 0
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that decided the request.
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the approval or denial.
        default: null
      - name: decision_note
        type: string
        source: system
        description: Free-text note recorded with the most recent decision.
        default: null
      - name: valid_until
        type: datetime
        source: computed
        description: Earlier of decided_at plus PRECLEARANCE_VALIDITY_DAYS and the window close_at; null until approved.
        default: null
      - name: executed_shares
        type: integer
        source: system
        description: Shares actually transacted, recorded at execution.
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant of the executed trade.
        default: null
      - name: price_per_share_cents
        type: integer
        source: system
        description: Executed price per share in cents.
        default: null

  - name: TradingPlan
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id; the adopting insider.
      - name: superseded_plan_id
        type: string
        source: system
        description: FK -> TradingPlan.id; the participant's prior EFFECTIVE plan that this adoption superseded, null when there was none.
        default: null
      - name: plan_document_ref
        type: string
        source: input
        description: Reference to the executed pre-established trading plan document.
      - name: first_scheduled_trade_date
        type: string
        source: input
        description: ISO date YYYY-MM-DD of the first trade the plan schedules.
      - name: total_shares
        type: integer
        source: input
        description: Total shares the plan may transact over its life.
        constraints: ">= 1"
      - name: adopted_at
        type: datetime
        source: system
        description: Logical-clock instant at which the plan was adopted or last modified; the cooling-off anchor.
      - name: insider_status_at_adoption
        type: enum
        source: system
        description: Participant.insider_status frozen at the adoption or modification instant.
        constraints: "NON_INSIDER | DESIGNATED_INSIDER | SECTION_16_OFFICER"
      - name: cooling_off_days
        type: integer
        source: computed
        description: Cooling-off length in whole days derived from insider_status_at_adoption and the plan earnings calendar.
      - name: first_trade_allowed_at
        type: datetime
        source: computed
        description: adopted_at plus cooling_off_days days; the earliest instant the plan may become EFFECTIVE.
      - name: modification_count
        type: integer
        source: computed
        description: Number of completed EFFECTIVE to PENDING_COOLING_OFF modification loops.
        default: 0
      - name: status
        type: enum
        source: system
        description: Trading plan lifecycle status.
        default: PENDING_COOLING_OFF
        constraints: "PENDING_COOLING_OFF | EFFECTIVE | TERMINATED | EXPIRED"
      - name: termination_reason
        type: string
        source: system
        description: Reason recorded on termination, including the automatic supersede and employment-termination cascades.
        default: null

  - name: TransactionReport
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: FK -> Participant.id; the reporting insider.
      - name: source_type
        type: enum
        source: system
        description: Polymorphic discriminator naming the entity that source_id points at.
        constraints: "VESTING_SETTLEMENT | PRECLEARANCE_EXECUTION"
      - name: source_id
        type: string
        source: system
        description: Polymorphic reference; equals VestingEvent.id when source_type is VESTING_SETTLEMENT and PreclearanceRequest.id when source_type is PRECLEARANCE_EXECUTION.
      - name: transaction_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant of the reportable transaction.
      - name: shares
        type: integer
        source: system
        description: Reportable share count.
      - name: form_type
        type: enum
        source: system
        description: FORM_4 for SECTION_16_OFFICER participants, FORM_5 for DESIGNATED_INSIDER participants.
        constraints: "FORM_4 | FORM_5"
      - name: due_at
        type: datetime
        source: computed
        description: End of the second business day after transaction_at, at 23:59:59.999Z.
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant at which compliance filed the report.
        default: null
      - name: status
        type: enum
        source: system
        description: Filing status; LATE_FILED when filed_at is strictly after due_at.
        default: PENDING
        constraints: "PENDING | FILED | LATE_FILED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EquityPlan
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /equity-plans/{id}/status with action FREEZE"
        actor: PlanAdministrator | BoardMember
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "sets EquityPlan.status = FROZEN and EquityPlan.freeze_reason = the payload freeze_reason"
          - "no child rows are mutated; the freeze acts purely as a precondition gate on grant submit, approve, issue and cancel"
          - "increments EquityPlan.version by 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /equity-plans/{id}/status with action UNFREEZE"
        actor: PlanAdministrator | BoardMember
        preconditions:
          - "plan.status == FROZEN"
        side_effects:
          - "sets EquityPlan.status = ACTIVE and clears EquityPlan.freeze_reason to null"
          - "increments EquityPlan.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /equity-plans/{id}/status with action TERMINATE"
        actor: PlanAdministrator | BoardMember
        preconditions:
          - "plan.status IN {ACTIVE, FROZEN}"
        side_effects:
          - "sets EquityPlan.status = TERMINATED and EquityPlan.freeze_reason = the payload freeze_reason"
          - "every ApprovalAuthority of the plan with status ACTIVE moves to REVOKED with revoked_at stamped from the logical clock"
          - "every TradingWindow of the plan with status IN {SCHEDULED, OPEN, SUSPENDED} moves to CLOSED, which runs the window close cascade over that window's PreclearanceRequest rows"
          - "increments EquityPlan.version by 1 and the version of every mutated ApprovalAuthority, TradingWindow and PreclearanceRequest by 1"
        note: "Terminal. Declared once and reachable from ACTIVE and FROZEN. Vesting, settlement and reversal of already GRANTED awards remain permitted; every grant-lifecycle write is refused with ERR_PLAN_FROZEN."

  - entity: Grant
    initial_state: DRAFT
    terminal_states: [FORFEITED, CANCELLED]
    shape: branching_with_revision_cycle
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /grants/{id}/submit"
        actor: PlanAdministrator
        preconditions:
          - "grant.status == DRAFT"
          - "plan.status == ACTIVE"
          - "participant.employment_status == ACTIVE"
        side_effects:
          - "sets Grant.status = PENDING_APPROVAL and Grant.submitted_by_user_id = the acting X-User-ID"
          - "increments Grant.version by 1"
      - from: PENDING_APPROVAL
        to: CHANGES_REQUESTED
        trigger: "POST /grants/{id}/request-changes"
        actor: BoardMember | DelegatedOfficer
        preconditions:
          - "grant.status == PENDING_APPROVAL"
          - "grant.changes_requested_count < MAX_GRANT_REVISIONS (2), otherwise ERR_MAX_GRANT_REVISIONS_EXCEEDED"
        side_effects:
          - "sets Grant.status = CHANGES_REQUESTED and increments Grant.changes_requested_count by 1"
          - "no reserve, authority or burn-rate accumulator is touched"
          - "increments Grant.version by 1"
      - from: CHANGES_REQUESTED
        to: PENDING_APPROVAL
        trigger: "POST /grants/{id}/submit"
        actor: PlanAdministrator
        preconditions:
          - "grant.status == CHANGES_REQUESTED"
          - "plan.status == ACTIVE"
          - "participant.employment_status == ACTIVE"
        side_effects:
          - "sets Grant.status = PENDING_APPROVAL and overwrites Grant.submitted_by_user_id with the acting X-User-ID"
          - "increments Grant.version by 1"
        note: "Closes the revision cycle PENDING_APPROVAL -> CHANGES_REQUESTED -> PENDING_APPROVAL; the third request-changes attempt is refused with ERR_MAX_GRANT_REVISIONS_EXCEEDED."
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /grants/{id}/approve with approval_path BOARD"
        actor: BoardMember
        preconditions:
          - "grant.status == PENDING_APPROVAL"
          - "plan.status == ACTIVE"
          - "participant.employment_status == ACTIVE"
          - "acting X-User-ID != grant.submitted_by_user_id (segregation of duties)"
          - "grant_weighted_reserve_shares(grant) <= plan.available_reserve_shares"
          - "projected gross burn rate at or below plan.burn_rate_limit_bps per the approval gate in calculations.burn_rate_variants"
        side_effects:
          - "BOARD branch: sets Grant.status = APPROVED, Grant.approval_path = BOARD, Grant.approved_under_authority_id = null, Grant.approved_by_user_id and Grant.approved_at"
          - "sets Grant.weighted_reserve_shares = grant_weighted_reserve_shares(grant)"
          - "EquityPlan.shares_committed_cumulative += Grant.weighted_reserve_shares, which recomputes EquityPlan.available_reserve_shares, which recomputes EquityPlan.reserve_posture"
          - "EquityPlan.fiscal_year_gross_granted_shares += Grant.weighted_reserve_shares, which recomputes EquityPlan.gross_burn_rate_bps and EquityPlan.net_burn_rate_bps"
          - "no ApprovalAuthority row is touched on this branch"
          - "increments Grant.version by 1 and EquityPlan.version by 1"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /grants/{id}/approve with approval_path DELEGATED and authority_id"
        actor: DelegatedOfficer
        preconditions:
          - "grant.status == PENDING_APPROVAL"
          - "plan.status == ACTIVE"
          - "participant.employment_status == ACTIVE"
          - "acting X-User-ID != grant.submitted_by_user_id (segregation of duties)"
          - "authority.status == ACTIVE AND authority.plan_id == grant.plan_id AND authority.delegate_user_id == acting X-User-ID"
          - "authority.effective_from <= logical clock date <= authority.effective_to"
          - "grant_weighted_reserve_shares(grant) <= authority.per_grant_share_cap"
          - "grant_weighted_reserve_shares(grant) <= authority.remaining_shares"
          - "grant_weighted_reserve_shares(grant) <= plan.available_reserve_shares"
          - "projected gross burn rate at or below plan.burn_rate_limit_bps per the approval gate in calculations.burn_rate_variants"
        side_effects:
          - "DELEGATED branch: sets Grant.status = APPROVED, Grant.approval_path = DELEGATED, Grant.approved_under_authority_id = authority_id, Grant.approved_by_user_id and Grant.approved_at"
          - "sets Grant.weighted_reserve_shares = grant_weighted_reserve_shares(grant)"
          - "ApprovalAuthority.consumed_shares += Grant.weighted_reserve_shares, which recomputes ApprovalAuthority.remaining_shares, and sets ApprovalAuthority.status = EXHAUSTED when remaining_shares reaches 0"
          - "EquityPlan.shares_committed_cumulative += Grant.weighted_reserve_shares, which recomputes EquityPlan.available_reserve_shares, which recomputes EquityPlan.reserve_posture"
          - "EquityPlan.fiscal_year_gross_granted_shares += Grant.weighted_reserve_shares, which recomputes EquityPlan.gross_burn_rate_bps and EquityPlan.net_burn_rate_bps"
          - "increments Grant.version by 1, ApprovalAuthority.version by 1 and EquityPlan.version by 1"
        note: "Fork sibling of the BOARD branch with a divergent side-effect set: only this branch consumes a delegated budget, and only this branch is gated on reserve_posture."
      - from: APPROVED
        to: GRANTED
        trigger: "POST /grants/{id}/issue"
        actor: PlanAdministrator
        preconditions:
          - "grant.status == APPROVED"
          - "plan.status == ACTIVE"
          - "a grant date is determinable per calculations.grant_date_determination"
        side_effects:
          - "sets Grant.status = GRANTED and Grant.grant_date to the determined date"
          - "each VestingTranche of the grant keeps status UNVESTED; Grant.outstanding_shares is recomputed as the sum of tranche shares in {UNVESTED, VESTED}"
          - "increments Grant.version by 1"
      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /grants/{id}/cancel"
        actor: PlanAdministrator
        preconditions:
          - "grant.status IN {DRAFT, PENDING_APPROVAL, CHANGES_REQUESTED, APPROVED, GRANTED, PARTIALLY_FORFEITED}"
          - "plan.status == ACTIVE"
          - "no VestingTranche of the grant has status SETTLED"
        side_effects:
          - "sets Grant.status = CANCELLED, Grant.cancel_reason and sets every VestingTranche of the grant whose status IN {UNVESTED, VESTED} to FORFEITED"
          - "when Grant.weighted_reserve_shares > 0: EquityPlan.shares_returned_cumulative += Grant.weighted_reserve_shares and EquityPlan.fiscal_year_returned_shares += Grant.weighted_reserve_shares, which recomputes EquityPlan.available_reserve_shares, EquityPlan.reserve_posture and EquityPlan.net_burn_rate_bps"
          - "when Grant.approval_path == DELEGATED: ApprovalAuthority.consumed_shares -= Grant.weighted_reserve_shares, which recomputes remaining_shares and returns status from EXHAUSTED to ACTIVE when remaining_shares becomes > 0"
          - "sets Grant.weighted_reserve_shares = 0 and Grant.outstanding_shares = 0"
          - "increments Grant.version by 1, and EquityPlan.version by 1 when the reserve was credited"
        note: "Compensating action for both approval branches; declared once and reachable from DRAFT, PENDING_APPROVAL, CHANGES_REQUESTED, APPROVED, GRANTED and PARTIALLY_FORFEITED."
      - from: GRANTED
        to: PARTIALLY_FORFEITED
        trigger: "system: termination forfeiture cascade from POST /participants/{id}/terminate"
        actor: system
        preconditions:
          - "grant.status IN {GRANTED, PARTIALLY_FORFEITED}"
          - "at least one VestingTranche of the grant moved to FORFEITED in this cascade"
          - "Grant.outstanding_shares recomputes to a value > 0"
        side_effects:
          - "sets Grant.status = PARTIALLY_FORFEITED and recomputes Grant.outstanding_shares"
          - "recomputes Grant.weighted_reserve_shares from the surviving tranches, and the decrease is added to EquityPlan.shares_returned_cumulative and EquityPlan.fiscal_year_returned_shares"
          - "increments Grant.version by 1"
      - from: GRANTED
        to: FORFEITED
        trigger: "system: termination forfeiture cascade from POST /participants/{id}/terminate"
        actor: system
        preconditions:
          - "grant.status IN {GRANTED, PARTIALLY_FORFEITED}"
          - "Grant.outstanding_shares recomputes to exactly 0 and no VestingTranche of the grant has status SETTLED"
        side_effects:
          - "sets Grant.status = FORFEITED, Grant.outstanding_shares = 0 and Grant.weighted_reserve_shares = 0"
          - "EquityPlan.shares_returned_cumulative and EquityPlan.fiscal_year_returned_shares are increased by the full prior Grant.weighted_reserve_shares, which recomputes EquityPlan.available_reserve_shares, which recomputes EquityPlan.reserve_posture"
          - "increments Grant.version by 1 and EquityPlan.version by 1"
        note: "Terminal. Second hop of the four-hop termination cascade; the third hop is the plan ledger, the fourth is reserve_posture."

  - entity: Participant
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    shape: linear_with_fan_out_cascade
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /participants/{id}/terminate"
        actor: PlanAdministrator
        preconditions:
          - "participant.employment_status == ACTIVE"
          - "termination_date >= participant.hire_date"
        side_effects:
          - "sets Participant.employment_status = TERMINATED, Participant.termination_date, Participant.termination_reason, and freezes Participant.age_years / service_years / retirement_eligible at termination_date"
          - "sets Participant.ptep_expiry_date per calculations.post_termination_exercise_period"
          - "hop 1: every VestingTranche of the participant's grants with status UNVESTED is resolved per calculations.termination_vesting_resolution into VESTED (with acceleration_reason) or FORFEITED; on termination_reason FOR_CAUSE, tranches with status VESTED are also moved to FORFEITED"
          - "hop 2: each Grant whose tranches changed in hop 1 recomputes Grant.outstanding_shares and Grant.weighted_reserve_shares and moves to PARTIALLY_FORFEITED or FORFEITED"
          - "hop 3: each Grant weight decrease from hop 2 is added to EquityPlan.shares_returned_cumulative and EquityPlan.fiscal_year_returned_shares, which recomputes EquityPlan.available_reserve_shares and EquityPlan.net_burn_rate_bps"
          - "hop 4: the EquityPlan.available_reserve_shares increase from hop 3 recomputes EquityPlan.reserve_posture, which can flip RESTRICTED -> OPEN and thereby un-gate the DELEGATED approval branch"
          - "independent fan-out (not part of the four-hop chain): every TradingPlan of the participant with status IN {PENDING_COOLING_OFF, EFFECTIVE} moves to TERMINATED with termination_reason EMPLOYMENT_TERMINATED, and every PreclearanceRequest of the participant with status IN {SUBMITTED, INFO_REQUESTED, APPROVED} moves to VOID"
          - "increments Participant.version by 1, and the version of every mutated Grant, VestingTranche, TradingPlan, PreclearanceRequest and EquityPlan by 1"
        note: "Terminal. Grants of the participant that are still DRAFT, PENDING_APPROVAL, CHANGES_REQUESTED or APPROVED are left untouched but can no longer be submitted, approved or issued."

  - entity: VestingTranche
    initial_state: UNVESTED
    terminal_states: [SETTLED, FORFEITED]
    shape: branching
    transitions:
      - from: UNVESTED
        to: VESTED
        trigger: "POST /vesting-tranches/{id}/vest"
        actor: PlanAdministrator
        preconditions:
          - "tranche.status == UNVESTED"
          - "grant.status IN {GRANTED, PARTIALLY_FORFEITED}"
          - "plan.status != TERMINATED"
          - "logical clock date >= tranche.scheduled_vest_date"
          - "when tranche.vest_type == PERFORMANCE: the referenced PerformanceCycle.status == CERTIFIED"
        side_effects:
          - "sets VestingTranche.status = VESTED and VestingTranche.vested_at = logical clock instant"
          - "creates one VestingEvent with tax_status PENDING_ALLOCATION, settlement_status PENDING_TAX, gross_shares = VestingTranche.shares, vest_date = logical clock date and sourcing_start_date = Grant.grant_date"
          - "Grant.outstanding_shares is unchanged (VESTED tranches remain outstanding)"
          - "increments VestingTranche.version by 1"
      - from: UNVESTED
        to: VESTED
        trigger: "system: termination acceleration cascade from POST /participants/{id}/terminate"
        actor: system
        preconditions:
          - "tranche.status == UNVESTED"
          - "termination_reason == DEATH, or termination_reason == RETIREMENT with participant.retirement_eligible == true and tranche.scheduled_vest_date <= termination_date + RETIREMENT_ACCELERATION_WINDOW_DAYS"
        side_effects:
          - "sets VestingTranche.status = VESTED, VestingTranche.acceleration_reason = DEATH or RETIREMENT_ELIGIBILITY, and VestingTranche.vested_at = the termination request instant"
          - "creates one VestingEvent per accelerated tranche with tax_status PENDING_ALLOCATION, settlement_status PENDING_TAX, gross_shares = VestingTranche.shares, vest_date = the termination request date, sourcing_start_date = Grant.grant_date and fmv_per_share_cents = the terminate payload acceleration_fmv_per_share_cents"
          - "increments VestingTranche.version by 1"
        note: "Accelerated tranches are already VESTED when the cascade finishes, so a later POST /vesting-tranches/{id}/vest on them is refused with ERR_TRANCHE_INVALID_STATE. The terminate payload MUST carry acceleration_fmv_per_share_cents whenever at least one tranche accelerates, otherwise the whole request is refused with ERR_ACCELERATION_FMV_REQUIRED before any hop runs."
      - from: UNVESTED
        to: FORFEITED
        trigger: "system: termination forfeiture cascade from POST /participants/{id}/terminate, or POST /grants/{id}/cancel"
        actor: system
        preconditions:
          - "tranche.status == UNVESTED"
          - "the acceleration test above did not apply"
        side_effects:
          - "sets VestingTranche.status = FORFEITED"
          - "triggers hop 2 of the termination cascade on the owning Grant"
          - "increments VestingTranche.version by 1"
      - from: VESTED
        to: FORFEITED
        trigger: "system: FOR_CAUSE clawback cascade from POST /participants/{id}/terminate, or POST /grants/{id}/cancel"
        actor: system
        preconditions:
          - "tranche.status == VESTED"
          - "termination_reason == FOR_CAUSE, or the owning grant is being cancelled"
          - "no VestingEvent of the tranche has settlement_status SETTLED"
        side_effects:
          - "sets VestingTranche.status = FORFEITED and sets every VestingEvent of the tranche with settlement_status PENDING_TAX to REVERSED with reversal_reason FOR_CAUSE_CLAWBACK"
          - "increments VestingTranche.version by 1"
      - from: VESTED
        to: SETTLED
        trigger: "POST /vesting-events/{id}/settle"
        actor: PlanAdministrator
        preconditions:
          - "tranche.status == VESTED"
          - "the tranche's VestingEvent has tax_status ALLOCATED and settlement_status PENDING_TAX"
        side_effects:
          - "sets VestingTranche.status = SETTLED"
          - "recomputes Grant.outstanding_shares (SETTLED tranches leave the outstanding pool while remaining committed against the reserve)"
          - "increments VestingTranche.version by 1"
      - from: SETTLED
        to: VESTED
        trigger: "POST /vesting-events/{id}/reverse"
        actor: PlanAdministrator
        preconditions:
          - "tranche.status == SETTLED"
          - "the tranche's VestingEvent has settlement_status SETTLED"
        side_effects:
          - "sets VestingTranche.status = VESTED, leaving VestingTranche.shares unchanged"
          - "recomputes Grant.outstanding_shares back to its pre-settlement value"
          - "increments VestingTranche.version by 1"
        note: "Compensating transition; closes the SETTLED -> VESTED -> SETTLED loop and must leave the tranche share count and the plan reserve identity untouched."

  - entity: PerformanceCycle
    initial_state: OPEN
    terminal_states: [CERTIFIED, CANCELLED]
    shape: branching
    transitions:
      - from: OPEN
        to: CERTIFIED
        trigger: "POST /performance-cycles/{id}/certify"
        actor: BoardMember | ComplianceOfficer
        preconditions:
          - "cycle.status == OPEN"
          - "plan.status == ACTIVE"
          - "the resulting upward share revision fits inside EquityPlan.available_reserve_shares"
        side_effects:
          - "sets PerformanceCycle.status = CERTIFIED, actual_value, payout_multiplier_bps per calculations.performance_payout_multiplier, certified_at and certified_by_user_id"
          - "hop 1: every VestingTranche with performance_cycle_id == cycle.id and status UNVESTED recomputes VestingTranche.shares = round_half_up(target_shares * payout_multiplier_bps / 10000)"
          - "hop 2: each Grant owning a tranche changed in hop 1 recomputes Grant.weighted_reserve_shares and Grant.outstanding_shares"
          - "hop 3: each Grant weight delta from hop 2 is applied to EquityPlan.shares_committed_cumulative (positive delta, also added to fiscal_year_gross_granted_shares) or EquityPlan.shares_returned_cumulative (negative delta, also added to fiscal_year_returned_shares), which recomputes EquityPlan.available_reserve_shares, EquityPlan.reserve_posture, gross_burn_rate_bps and net_burn_rate_bps"
          - "increments PerformanceCycle.version by 1, and the version of every mutated VestingTranche, Grant and EquityPlan by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /performance-cycles/{id}/certify with actual_value below the zero-payout floor"
        actor: BoardMember | ComplianceOfficer
        preconditions:
          - "cycle.status == OPEN"
          - "plan.status == ACTIVE"
          - "round_half_up(actual_value / target_value, 6) < ZERO_PAYOUT_RATIO (0.8), which yields payout_multiplier_bps == 0"
        side_effects:
          - "sets PerformanceCycle.status = CANCELLED, actual_value, payout_multiplier_bps = 0 and certified_at"
          - "hop 1: every VestingTranche with performance_cycle_id == cycle.id and status UNVESTED moves to FORFEITED with VestingTranche.shares = 0"
          - "hop 2: each owning Grant recomputes outstanding_shares and weighted_reserve_shares and moves to PARTIALLY_FORFEITED or FORFEITED"
          - "hop 3: the weight decrease is added to EquityPlan.shares_returned_cumulative and EquityPlan.fiscal_year_returned_shares, which recomputes available_reserve_shares and reserve_posture"
          - "increments PerformanceCycle.version by 1 and the version of every mutated row by 1"
        note: "Divergent branch of the same trigger: a below-floor certification forfeits rather than revalues, so the two branches of certify carry different side-effect sets."

  - entity: VestingEvent
    initial_state: "tax_status PENDING_ALLOCATION x settlement_status PENDING_TAX"
    terminal_states: [REVERSED]
    shape: parallel
    parallel_dimensions:
      tax_status: "PENDING_ALLOCATION -> ALLOCATED"
      settlement_status: "PENDING_TAX -> SETTLED -> REVERSED"
    transitions:
      - dimension: tax_status
        from: PENDING_ALLOCATION
        to: ALLOCATED
        trigger: "POST /vesting-events/{id}/allocate-taxes"
        actor: PlanAdministrator | ComplianceOfficer
        preconditions:
          - "event.tax_status == PENDING_ALLOCATION"
          - "event.settlement_status == PENDING_TAX"
          - "event.total_workdays computed over the sourcing period is > 0"
        side_effects:
          - "creates one TaxAllocation row per contributing jurisdiction per calculations.mobility_tax_allocation"
          - "sets VestingEvent.total_workdays, total_tax_cents, blended_rate_bps and tax_status = ALLOCATED, leaving settlement_status at PENDING_TAX"
          - "increments VestingEvent.version by 1"
        note: "The two dimensions advance independently: allocation moves tax_status only, settlement moves settlement_status only."
      - dimension: settlement_status
        from: PENDING_TAX
        to: SETTLED
        trigger: "POST /vesting-events/{id}/settle"
        actor: PlanAdministrator
        preconditions:
          - "event.settlement_status == PENDING_TAX"
          - "event.tax_status == ALLOCATED"
          - "the owning VestingTranche.status == VESTED"
        side_effects:
          - "sets VestingEvent.withholding_method and, per calculations.withholding_mechanics, shares_withheld, shares_sold, net_shares_delivered, residual_cash_cents and cash_due_cents"
          - "sets VestingEvent.settlement_status = SETTLED and moves the owning VestingTranche from VESTED to SETTLED"
          - "when participant.insider_status IN {SECTION_16_OFFICER, DESIGNATED_INSIDER}: creates one TransactionReport with source_type VESTING_SETTLEMENT, source_id = event.id, transaction_at = logical clock instant, shares = shares_withheld + shares_sold when the method disposes shares else gross_shares, form_type per insider_status, status PENDING and due_at per calculations.insider_report_deadline"
          - "increments VestingEvent.version by 1 and VestingTranche.version by 1"
      - dimension: settlement_status
        from: SETTLED
        to: REVERSED
        trigger: "POST /vesting-events/{id}/reverse"
        actor: PlanAdministrator
        preconditions:
          - "event.settlement_status == SETTLED"
          - "the owning VestingTranche.status == SETTLED"
        side_effects:
          - "sets VestingEvent.settlement_status = REVERSED, reversal_reason, and zeroes shares_withheld, shares_sold, net_shares_delivered, residual_cash_cents, cash_due_cents, total_tax_cents and blended_rate_bps"
          - "sets VestingEvent.tax_status back to PENDING_ALLOCATION and deletes the event's TaxAllocation rows"
          - "moves the owning VestingTranche from SETTLED back to VESTED with VestingTranche.shares unchanged"
          - "any TransactionReport with source_type VESTING_SETTLEMENT and source_id == event.id whose status == PENDING is deleted; a report already FILED or LATE_FILED is left in place"
          - "increments VestingEvent.version by 1 and VestingTranche.version by 1"
        note: "Terminal for the settlement dimension. Compensating action: the conserved quantities are the tranche share count and the event share split identity."
      - dimension: settlement_status
        from: PENDING_TAX
        to: REVERSED
        trigger: "system: FOR_CAUSE clawback cascade from POST /participants/{id}/terminate"
        actor: system
        preconditions:
          - "event.settlement_status == PENDING_TAX"
          - "the owning VestingTranche moved to FORFEITED in the clawback cascade"
        side_effects:
          - "sets VestingEvent.settlement_status = REVERSED with reversal_reason FOR_CAUSE_CLAWBACK and deletes any TaxAllocation rows"
          - "increments VestingEvent.version by 1"

  - entity: TradingWindow
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /trading-windows/{id}/status with action OPEN"
        actor: ComplianceOfficer
        preconditions:
          - "window.status == SCHEDULED"
          - "plan.status != TERMINATED"
        side_effects:
          - "sets TradingWindow.status = OPEN"
          - "increments TradingWindow.version by 1"
        note: "A window is tradeable only when status == OPEN AND open_at <= logical clock < close_at; the status flag alone is not sufficient."
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /trading-windows/{id}/status with action SUSPEND"
        actor: ComplianceOfficer
        preconditions:
          - "window.status == OPEN"
        side_effects:
          - "sets TradingWindow.status = SUSPENDED and TradingWindow.suspension_reason"
          - "every PreclearanceRequest with window_id == window.id and status IN {SUBMITTED, INFO_REQUESTED, APPROVED} moves to VOID, which recomputes TradingWindow.approved_shares_cumulative"
          - "increments TradingWindow.version by 1 and the version of every voided PreclearanceRequest by 1"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /trading-windows/{id}/status with action RESUME"
        actor: ComplianceOfficer
        preconditions:
          - "window.status == SUSPENDED"
        side_effects:
          - "sets TradingWindow.status = OPEN and clears TradingWindow.suspension_reason to null"
          - "already voided PreclearanceRequest rows are NOT restored"
          - "increments TradingWindow.version by 1"
        note: "Closes the OPEN -> SUSPENDED -> OPEN cycle; the void cascade is deliberately not compensated, so a resumed window starts from approved_shares_cumulative recomputed over the surviving requests."
      - from: OPEN
        to: CLOSED
        trigger: "POST /trading-windows/{id}/status with action CLOSE"
        actor: ComplianceOfficer
        preconditions:
          - "window.status IN {SCHEDULED, OPEN, SUSPENDED}"
        side_effects:
          - "sets TradingWindow.status = CLOSED"
          - "every PreclearanceRequest with window_id == window.id and status == APPROVED moves to EXPIRED, and every request with status IN {SUBMITTED, INFO_REQUESTED} moves to VOID"
          - "recomputes TradingWindow.approved_shares_cumulative over the surviving requests whose status IN {APPROVED, EXECUTED}"
          - "increments TradingWindow.version by 1 and the version of every mutated PreclearanceRequest by 1"
        note: "Terminal. Declared once and reachable from SCHEDULED, OPEN and SUSPENDED."

  - entity: PreclearanceRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, EXECUTED, EXPIRED, VOID]
    shape: cyclic
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /preclearance-requests/{id}/decide with decision REQUEST_INFO"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == SUBMITTED"
          - "request.revision_count < MAX_PRECLEARANCE_REVISIONS (2)"
        side_effects:
          - "sets PreclearanceRequest.status = INFO_REQUESTED, decision_note, decided_by_user_id and decided_at"
          - "leaves valid_until null"
          - "increments PreclearanceRequest.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /preclearance-requests/{id}/resubmit"
        actor: Participant | ComplianceOfficer
        preconditions:
          - "request.status == INFO_REQUESTED"
          - "when the acting role is Participant: the acting X-User-ID == request.participant_id"
          - "participant.employment_status == ACTIVE"
        side_effects:
          - "sets PreclearanceRequest.status = SUBMITTED, overwrites requested_shares and intended_trade_date, and increments PreclearanceRequest.revision_count by 1"
          - "increments PreclearanceRequest.version by 1"
        note: "Closes the SUBMITTED -> INFO_REQUESTED -> SUBMITTED cycle; the third REQUEST_INFO decision is refused with ERR_MAX_PRECLEARANCE_REVISIONS_EXCEEDED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /preclearance-requests/{id}/decide with decision APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == SUBMITTED"
          - "window.status == OPEN AND window.open_at <= logical clock < window.close_at"
          - "participant.employment_status == ACTIVE"
          - "date(window.open_at) <= request.intended_trade_date <= date(window.close_at) AND request.intended_trade_date >= logical clock date"
          - "the participant has no TradingPlan with status EFFECTIVE"
          - "when window.aggregate_share_cap is not null: window.approved_shares_cumulative + request.requested_shares <= window.aggregate_share_cap"
        side_effects:
          - "sets PreclearanceRequest.status = APPROVED, decided_by_user_id, decided_at, decision_note and valid_until per calculations.preclearance_validity"
          - "TradingWindow.approved_shares_cumulative += request.requested_shares"
          - "increments PreclearanceRequest.version by 1 and TradingWindow.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /preclearance-requests/{id}/decide with decision DENY"
        actor: ComplianceOfficer
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "sets PreclearanceRequest.status = DENIED, decided_by_user_id, decided_at and decision_note"
          - "TradingWindow.approved_shares_cumulative is unchanged"
          - "increments PreclearanceRequest.version by 1"
        note: "Terminal. Divergent sibling of the APPROVE branch: DENY skips every window, trading-plan and cap precondition."
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /preclearance-requests/{id}/execute"
        actor: Participant | ComplianceOfficer
        preconditions:
          - "request.status == APPROVED"
          - "when the acting role is Participant: the acting X-User-ID == request.participant_id"
          - "logical clock <= request.valid_until"
          - "executed_shares <= request.requested_shares"
          - "window.status == OPEN AND window.open_at <= executed_at < window.close_at"
        side_effects:
          - "sets PreclearanceRequest.status = EXECUTED, executed_shares, executed_at and price_per_share_cents"
          - "when participant.insider_status IN {SECTION_16_OFFICER, DESIGNATED_INSIDER}: creates one TransactionReport with source_type PRECLEARANCE_EXECUTION, source_id = request.id, transaction_at = executed_at, shares = executed_shares, form_type per insider_status, status PENDING and due_at per calculations.insider_report_deadline"
          - "increments PreclearanceRequest.version by 1"
        note: "Terminal. TradingWindow.approved_shares_cumulative is not adjusted downward when executed_shares < requested_shares; the cap reserves the requested amount for the life of the window."
      - from: APPROVED
        to: EXPIRED
        trigger: "system: window close cascade from POST /trading-windows/{id}/status with action CLOSE"
        actor: system
        preconditions:
          - "request.status == APPROVED"
        side_effects:
          - "sets PreclearanceRequest.status = EXPIRED"
          - "increments PreclearanceRequest.version by 1"
      - from: SUBMITTED
        to: VOID
        trigger: "system: window suspension or close cascade, or the employment termination fan-out"
        actor: system
        preconditions:
          - "request.status IN {SUBMITTED, INFO_REQUESTED, APPROVED}"
        side_effects:
          - "sets PreclearanceRequest.status = VOID and recomputes TradingWindow.approved_shares_cumulative"
          - "increments PreclearanceRequest.version by 1"
        note: "Terminal. Declared once and reachable from SUBMITTED, INFO_REQUESTED and APPROVED."

  - entity: TradingPlan
    initial_state: PENDING_COOLING_OFF
    terminal_states: [TERMINATED, EXPIRED]
    shape: cyclic
    transitions:
      - from: PENDING_COOLING_OFF
        to: EFFECTIVE
        trigger: "POST /trading-plans/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "plan.status == PENDING_COOLING_OFF"
          - "logical clock >= TradingPlan.first_trade_allowed_at"
          - "participant.employment_status == ACTIVE"
        side_effects:
          - "sets TradingPlan.status = EFFECTIVE"
          - "increments TradingPlan.version by 1"
      - from: EFFECTIVE
        to: PENDING_COOLING_OFF
        trigger: "POST /trading-plans/{id}/modify"
        actor: Participant | ComplianceOfficer
        preconditions:
          - "plan.status == EFFECTIVE"
          - "when the acting role is Participant: the acting X-User-ID == plan.participant_id"
          - "plan.modification_count < MAX_TRADING_PLAN_MODIFICATIONS (2), otherwise ERR_MAX_MODIFICATIONS_EXCEEDED"
        side_effects:
          - "sets TradingPlan.status = PENDING_COOLING_OFF, overwrites first_scheduled_trade_date and total_shares, increments modification_count by 1"
          - "resets TradingPlan.adopted_at to the logical clock instant, refreezes insider_status_at_adoption from the current Participant.insider_status, and recomputes cooling_off_days and first_trade_allowed_at per calculations.cooling_off_period"
          - "increments TradingPlan.version by 1"
        note: "Closes the PENDING_COOLING_OFF -> EFFECTIVE -> PENDING_COOLING_OFF cycle; a modification restarts the cooling-off clock from scratch. The third modification is refused with ERR_MAX_MODIFICATIONS_EXCEEDED."
      - from: EFFECTIVE
        to: TERMINATED
        trigger: "POST /trading-plans/{id}/terminate"
        actor: Participant | ComplianceOfficer
        preconditions:
          - "plan.status IN {PENDING_COOLING_OFF, EFFECTIVE}"
        side_effects:
          - "sets TradingPlan.status = TERMINATED and TradingPlan.termination_reason"
          - "increments TradingPlan.version by 1"
        note: "Terminal. Also reached by the employment-termination fan-out with termination_reason EMPLOYMENT_TERMINATED."
      - from: EFFECTIVE
        to: EXPIRED
        trigger: "system: supersede cascade from POST /trading-plans (adoption of a replacement plan)"
        actor: system
        preconditions:
          - "the participant already has a TradingPlan with status EFFECTIVE at the moment the replacement is created"
        side_effects:
          - "sets the prior TradingPlan.status = EXPIRED with termination_reason SUPERSEDED_BY_NEW_ADOPTION"
          - "sets the new TradingPlan.superseded_plan_id = the prior plan id"
          - "increments the prior TradingPlan.version by 1"
        note: "Terminal. This legitimate supersede is why POST /trading-plans is guarded by optimistic concurrency on Participant.version."

  - entity: TransactionReport
    initial_state: PENDING
    terminal_states: [FILED, LATE_FILED]
    shape: branching
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /transaction-reports/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == PENDING"
          - "logical clock <= report.due_at"
        side_effects:
          - "sets TransactionReport.filed_at = the logical clock instant and TransactionReport.status = FILED"
          - "increments TransactionReport.version by 1"
      - from: PENDING
        to: LATE_FILED
        trigger: "POST /transaction-reports/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "report.status == PENDING"
          - "logical clock > report.due_at"
        side_effects:
          - "sets TransactionReport.filed_at = the logical clock instant and TransactionReport.status = LATE_FILED"
          - "increments TransactionReport.version by 1"
        note: "Terminal. Same trigger as the FILED branch; only the strict comparison against due_at decides which branch fires."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity version only)
# =============================================================================
concurrency_rules:
  - rule_id: trading-plan-adopt-stale-participant
    parent_entity: Participant
    write_endpoint: "POST /trading-plans"
    occ_field: "expected_participant_version"
    description: |
      Adopting a TradingPlan for a Participant whose version has advanced since
      the client last read it is rejected. A second adoption is legitimate
      product behaviour - the replacement plan supersedes the prior EFFECTIVE
      plan and expires it - so the write cannot be resolved by a state
      precondition; the stale-version check is what makes the loser
      deterministically observable.
    error_id: ERR_STALE_PARTICIPANT_VERSION
    http_status: 412
  - rule_id: reserve-adjustment-stale-plan
    parent_entity: EquityPlan
    write_endpoint: "POST /equity-plans/{id}/share-reserve-adjustments"
    occ_field: "expected_plan_version"
    description: |
      Posting a share reserve adjustment against an EquityPlan whose version has
      advanced since the client last read it is rejected. Reserve adjustments
      are cumulative and a second adjustment would itself legitimately succeed,
      so the guard is a stale-version check on the plan the adjustment was sized
      against rather than a state precondition.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fungible_weighted_shares
    trigger: "On POST /grants/{id}/approve, on PerformanceCycle certification hop 2, on the termination forfeiture cascade hop 2 and on POST /grants/{id}/cancel; writes Grant.weighted_reserve_shares"
    algorithm: threshold
    formula: |
      committed_shares(grant) =
          SUM(VestingTranche.shares)
          WHERE VestingTranche.grant_id == grant.id
            AND VestingTranche.status IN {UNVESTED, VESTED, SETTLED}
          (FORFEITED tranches are excluded; the sum is 0 when the set is empty)

      weighted(plan, award_type, shares) =
          if award_type IN {RSU, PSU}:
              round_half_up(shares * plan.fungible_ratio_full_value_bps / 10000)   # to whole shares
          else:                                                                    # ISO, NSO
              shares

      Grant.weighted_reserve_shares = weighted(plan, grant.award_type, committed_shares(grant))
    input_set: "Only tranches of the grant whose status IN {UNVESTED, VESTED, SETTLED}; a FORFEITED tranche never contributes."
    constants:
      FULL_VALUE_AWARD_TYPES: [RSU, PSU]
      OPTION_AWARD_TYPES: [ISO, NSO]
    precision: "whole shares, round_half_up applied once to the aggregate (never per tranche)"

  - name: burn_rate_variants
    trigger: "Recomputed on every mutation of EquityPlan.fiscal_year_gross_granted_shares or fiscal_year_returned_shares; read through GET /equity-plans/{id} and GET /equity-plans/{id}/burn-rate-summary; the GROSS variant additionally gates POST /grants/{id}/approve"
    algorithm: aggregation
    formula: |
      GROSS variant:
        gross_burn_rate_bps =
            round_half_up(plan.fiscal_year_gross_granted_shares * 10000
                          / plan.common_shares_outstanding)

      NET variant:
        net_burn_rate_bps =
            max(0, round_half_up((plan.fiscal_year_gross_granted_shares
                                  - plan.fiscal_year_returned_shares) * 10000
                                 / plan.common_shares_outstanding))

      Approval gate (GROSS only, exact integer comparison so no rounding can
      mask a breach):
        projected = plan.fiscal_year_gross_granted_shares
                    + Grant.weighted_reserve_shares (as just computed)
        reject with ERR_BURN_RATE_LIMIT_EXCEEDED
          iff projected * 10000 > plan.burn_rate_limit_bps
                                  * plan.common_shares_outstanding
        (equality is permitted - a grant landing exactly on the limit is approved)
    input_set: "Both variants read only the two fiscal-year accumulators of the plan; grants approved in a previous fiscal year never contribute because annual rollover resets both accumulators to 0."
    constants:
      BPS_SCALE: 10000
    precision: "whole basis points, round_half_up, for the two reported fields; the gate itself uses exact integer cross-multiplication and never rounds"
    variants:
      - name: GROSS
        when: "Written to EquityPlan.gross_burn_rate_bps and used by the approval gate"
        difference: "Counts every fungible-weighted share committed in the fiscal year and ignores forfeitures and cancellations entirely, so it never decreases inside a fiscal year."
      - name: NET
        when: "Written to EquityPlan.net_burn_rate_bps and reported by GET /equity-plans/{id}/burn-rate-summary"
        difference: "Subtracts fiscal_year_returned_shares, so a forfeiture in the same fiscal year lowers it while GROSS stays put; the two variants therefore disagree for identical data and a grant can be refused on GROSS while NET sits comfortably below the limit."

  - name: mobility_tax_allocation
    trigger: "POST /vesting-events/{id}/allocate-taxes; creates the TaxAllocation rows and writes VestingEvent.total_workdays, total_tax_cents and blended_rate_bps"
    algorithm: waterfall_allocation
    formula: |
      sourcing_period = [VestingEvent.sourcing_start_date, VestingEvent.vest_date]   # inclusive both ends

      contributing = MobilityAssignment rows WHERE participant_id == the vesting
                     participant AND start_date >= sourcing_period.start
                     AND end_date <= sourcing_period.end
                     (fully contained; partially overlapping periods are excluded)

      groups = contributing grouped by jurisdiction_code
      workdays_j   = SUM(workdays) inside group j
      tax_rate_j   = MAX(tax_rate_bps) inside group j   # deterministic when a
                                                        # jurisdiction repeats
      total_workdays = SUM(workdays_j over all j)
      if total_workdays == 0: reject with ERR_WORKDAY_COVERAGE_GAP (no rows written)

      Step 1 - floor allocation in basis points:
        floor_j = floor(workdays_j * 10000 / total_workdays)
        rem_j   = workdays_j * 10000 - floor_j * total_workdays    # integer remainder
      Step 2 - largest-remainder waterfall of the leftover basis points:
        leftover = 10000 - SUM(floor_j)
        order the groups by (rem_j DESC, jurisdiction_code ASC) and give
        +1 bps to each of the first `leftover` groups
        allocation_bps_j = floor_j + (1 if group received a leftover bps else 0)
        # invariant: SUM(allocation_bps_j) == 10000 exactly
      Step 3 - per-jurisdiction tax, ROUND THEN SUM (pinned order):
        tax_amount_cents_j = round_half_up(VestingEvent.taxable_income_cents
                                           * allocation_bps_j * tax_rate_j
                                           / 100000000)
        # the division is evaluated once over the exact product; there is NO
        # intermediate rounding after the allocation step
      Step 4 - totals:
        VestingEvent.total_tax_cents = SUM(tax_amount_cents_j)      # sum of the
                                                                    # ALREADY ROUNDED
                                                                    # per-jurisdiction amounts
        VestingEvent.blended_rate_bps = round_half_up(total_tax_cents * 10000
                                                      / taxable_income_cents)
    input_set: "Only MobilityAssignment rows of the vesting participant fully contained in [VestingEvent.sourcing_start_date, VestingEvent.vest_date] (sourcing_start_date is stamped from the grant's grant_date when the vesting event is created); assignments that start before the grant date or end after the vest date contribute nothing, even partially. A contained group whose workdays sum to zero is still a contributing group: it produces a TaxAllocation row with allocation_bps 0 and tax_amount_cents 0. Only a total_workdays of zero across ALL groups (including the case of no contained assignment at all) is rejected."
    constants:
      BPS_SCALE: 10000
      BPS_SQUARED_SCALE: 100000000
    precision: "TaxAllocation.tax_amount_cents is whole cents, round_half_up, computed once per jurisdiction; VestingEvent.total_tax_cents is the SUM of those rounded amounts (round-then-sum). Summing the exact per-jurisdiction values first and rounding once at the end is explicitly NOT the pinned order and can differ by one cent."

  - name: withholding_mechanics
    trigger: "POST /vesting-events/{id}/settle; writes shares_withheld, shares_sold, net_shares_delivered, residual_cash_cents and cash_due_cents"
    algorithm: threshold
    formula: |
      T = VestingEvent.total_tax_cents        # already round-then-summed
      F = VestingEvent.fmv_per_share_cents
      G = VestingEvent.gross_shares

      SHARE_WITHHOLD:
        shares_withheld     = ceil(T / F)
        shares_sold         = 0
        net_shares_delivered = G - shares_withheld
        residual_cash_cents = shares_withheld * F - T
        cash_due_cents      = 0

      SELL_TO_COVER:
        # The commission is charged per share sold, so the share count and the
        # cost it must cover look mutually dependent. The evaluation order is
        # PINNED to the closed form below: the net proceeds per share
        # (F - COMMISSION_PER_SHARE_CENTS) is computed first, the share count
        # second, the realised proceeds third.
        net_proceeds_per_share = F - COMMISSION_PER_SHARE_CENTS
        shares_sold          = ceil(T / net_proceeds_per_share)
        shares_withheld      = 0
        gross_proceeds_cents = shares_sold * net_proceeds_per_share
        net_shares_delivered = G - shares_sold
        residual_cash_cents  = gross_proceeds_cents - T
        cash_due_cents       = 0

      CASH_REMITTANCE:
        shares_withheld = 0
        shares_sold     = 0
        net_shares_delivered = G
        residual_cash_cents  = 0
        cash_due_cents       = T

      Invariant enforced on every branch:
        G == net_shares_delivered + shares_withheld + shares_sold
    input_set: "A single VestingEvent whose tax_status == ALLOCATED; the tax figure is never recomputed at settlement time."
    constants:
      COMMISSION_PER_SHARE_CENTS: 25
    precision: "whole shares (ceil, never round_half_up) and whole cents; no fractional shares are ever created"
    variants:
      - name: SHARE_WITHHOLD
        when: "withholding_method == SHARE_WITHHOLD"
        difference: "Rounds up against the full FMV, so the share count is the smallest integer covering the tax and the over-withholding is refunded as residual cash. No commission is charged."
      - name: SELL_TO_COVER
        when: "withholding_method == SELL_TO_COVER"
        difference: "Rounds up against FMV net of a 25 cent per-share commission, so it always sells at least as many shares as SHARE_WITHHOLD withholds and usually strictly more; for identical gross shares, FMV and tax the two methods therefore deliver different net_shares_delivered AND different residual_cash_cents."
      - name: CASH_REMITTANCE
        when: "withholding_method == CASH_REMITTANCE"
        difference: "Disposes of no shares at all; the entire tax becomes cash_due_cents and net_shares_delivered equals gross_shares."

  - name: share_reserve_ledger
    trigger: "Recomputed at the end of every transition that touches EquityPlan.shares_committed_cumulative or EquityPlan.shares_returned_cumulative (grant approve, grant cancel, performance certification hop 3, termination cascade hop 3, share reserve adjustment, annual rollover)"
    algorithm: aggregation
    formula: |
      EquityPlan.available_reserve_shares =
          EquityPlan.total_authorized_shares
          - EquityPlan.shares_committed_cumulative
          + EquityPlan.shares_returned_cumulative

      EquityPlan.reserve_posture =
          OPEN        if available_reserve_shares * 10000
                         >= low_reserve_threshold_bps * total_authorized_shares
          RESTRICTED  otherwise

      Conservation invariant (must hold after every request, including every
      cascade hop):
          available_reserve_shares
          + shares_committed_cumulative
          - shares_returned_cumulative
          == total_authorized_shares
    input_set: "The three plan-level integers only; the accumulators are advanced by explicit side effects, never re-derived by scanning grants, so a compensating action must return exactly the amount the forward action added."
    constants:
      BPS_SCALE: 10000
    precision: "whole shares; the posture comparison uses exact integer cross-multiplication so a reserve sitting exactly on the threshold is OPEN"

  - name: evergreen_topup
    trigger: "POST /equity-plans/{id}/annual-rollover"
    algorithm: threshold
    formula: |
      topup = min(round_half_up(plan.common_shares_outstanding
                                * plan.evergreen_pct_bps / 10000),
                  plan.evergreen_cap_shares)

      plan.total_authorized_shares      += topup
      plan.evergreen_topup_last_shares   = topup
      plan.current_fiscal_year_label     = payload fiscal_year_label
      plan.fiscal_year_start_date        = the prior fiscal_year_start_date advanced by exactly one calendar year
      plan.fiscal_year_gross_granted_shares = 0
      plan.fiscal_year_returned_shares      = 0
      plan.gross_burn_rate_bps = 0
      plan.net_burn_rate_bps   = 0
      # available_reserve_shares and reserve_posture are then recomputed by
      # calculations.share_reserve_ledger
      # every ApprovalAuthority of the plan with status == ACTIVE and
      # effective_to < the rollover date moves to EXPIRED
    input_set: "A single EquityPlan row plus its ApprovalAuthority rows; grants are untouched."
    constants:
      BPS_SCALE: 10000
    precision: "whole shares, round_half_up before the cap is applied; when evergreen_cap_shares is the binding term the top-up equals the cap exactly, and a cap equal to the uncapped amount yields that amount (>= semantics, no off-by-one)"

  - name: performance_payout_multiplier
    trigger: "POST /performance-cycles/{id}/certify; writes PerformanceCycle.payout_multiplier_bps and drives certification hop 1"
    algorithm: tiered_pricing
    formula: |
      ratio = round_half_up(actual_value / target_value, 6)

      payout_multiplier_bps =
          0      if ratio < 0.800000
          5000   if 0.800000 <= ratio < 0.900000
          7500   if 0.900000 <= ratio < 1.000000
          10000  if 1.000000 <= ratio < 1.100000
          15000  if 1.100000 <= ratio < 1.200000
          20000  if ratio >= 1.200000

      For every VestingTranche with performance_cycle_id == cycle.id and
      status == UNVESTED:
          VestingTranche.shares = round_half_up(VestingTranche.target_shares
                                                * payout_multiplier_bps / 10000)
      A payout_multiplier_bps of 0 sends the cycle down the CANCELLED branch and
      the tranches to FORFEITED with shares = 0.
    input_set: "Only tranches whose status == UNVESTED at certification time; a tranche already VESTED, SETTLED or FORFEITED keeps its share count."
    constants:
      ZERO_PAYOUT_RATIO: 0.8
      TIER_BOUNDARIES: [0.8, 0.9, 1.0, 1.1, 1.2]
      TIER_MULTIPLIERS_BPS: [5000, 7500, 10000, 15000, 20000]
      MAX_MULTIPLIER_BPS: 20000
    precision: "ratio to 6 decimal places round_half_up before the tier lookup; tier boundaries are inclusive on the lower edge (a ratio of exactly 1.000000 pays 10000 bps, not 7500); VestingTranche.shares in whole shares round_half_up"

  - name: retirement_eligibility
    trigger: "Recomputed on read of Participant and pinned at POST /participants/{id}/terminate; writes Participant.age_years, service_years and retirement_eligible"
    algorithm: threshold
    formula: |
      reference_date = participant.termination_date if employment_status == TERMINATED
                       else date(logical clock)

      age_years     = whole completed years from birth_date to reference_date
      service_years = whole completed years from hire_date  to reference_date
      # "whole completed years" means the anniversary on or before
      # reference_date; an anniversary falling exactly on reference_date counts.

      retirement_eligible = (age_years >= MIN_RETIREMENT_AGE_YEARS)
                            AND (age_years + service_years >= RULE_OF_POINTS)
    input_set: "A single Participant row; no grant or tranche data participates."
    constants:
      MIN_RETIREMENT_AGE_YEARS: 55
      RULE_OF_POINTS: 65
    precision: "whole years; both comparisons are >= so a participant landing exactly on 55 years of age with exactly 65 combined points IS retirement eligible"

  - name: termination_vesting_resolution
    trigger: "POST /participants/{id}/terminate, hop 1 of the four-hop cascade"
    algorithm: constraint_propagation
    formula: |
      ref = participant.termination_date
      eligible = participant.retirement_eligible evaluated at ref

      Processing order (pinned, so the reserve ledger is deterministic):
        grants of the participant ordered by Grant.created_at ASC, then their
        tranches ordered by VestingTranche.tranche_index ASC.

      For each tranche with status == UNVESTED:
        if termination_reason == DEATH:
            -> VESTED, acceleration_reason = DEATH
        elif termination_reason == RETIREMENT AND eligible == true
             AND tranche.scheduled_vest_date
                 <= ref + RETIREMENT_ACCELERATION_WINDOW_DAYS days:
            -> VESTED, acceleration_reason = RETIREMENT_ELIGIBILITY
        else:
            -> FORFEITED
      For each tranche with status == VESTED:
        if termination_reason == FOR_CAUSE: -> FORFEITED (clawback)
        else: unchanged
      Tranches with status SETTLED or FORFEITED are never touched.

      A termination_reason of RETIREMENT on a participant whose
      retirement_eligible is false accelerates nothing and behaves exactly like
      VOLUNTARY for vesting purposes (the post-termination exercise period still
      uses the RETIREMENT entry).
    input_set: "Tranches of grants whose status IN {GRANTED, PARTIALLY_FORFEITED}; tranches of grants still in DRAFT, PENDING_APPROVAL, CHANGES_REQUESTED or APPROVED are left untouched because those grants have no grant date yet."
    constants:
      RETIREMENT_ACCELERATION_WINDOW_DAYS: 365
    precision: "the acceleration window comparison is <= against termination_date + 365 days, so a tranche scheduled exactly 365 days out accelerates and one scheduled on day 366 forfeits"

  - name: post_termination_exercise_period
    trigger: "POST /participants/{id}/terminate; writes Participant.ptep_expiry_date"
    algorithm: threshold
    formula: |
      PTEP_DAYS = { FOR_CAUSE: 0, VOLUNTARY: 90, INVOLUNTARY: 180,
                    RETIREMENT: 1095, DEATH: 365 }
      Participant.ptep_expiry_date =
          participant.termination_date + PTEP_DAYS[termination_reason] days
    input_set: "A single Participant row and the termination reason supplied by the request."
    constants:
      PTEP_DAYS_FOR_CAUSE: 0
      PTEP_DAYS_VOLUNTARY: 90
      PTEP_DAYS_INVOLUNTARY: 180
      PTEP_DAYS_RETIREMENT: 1095
      PTEP_DAYS_DEATH: 365
    precision: "whole days added to the termination date; a FOR_CAUSE termination expires the exercise period on the termination date itself"

  - name: cooling_off_period
    trigger: "POST /trading-plans and POST /trading-plans/{id}/modify; writes TradingPlan.cooling_off_days and first_trade_allowed_at"
    algorithm: threshold
    formula: |
      anchor = TradingPlan.adopted_at            # logical clock at adoption or
                                                 # at modification
      status = TradingPlan.insider_status_at_adoption

      if status == SECTION_16_OFFICER:
          if plan.next_earnings_release_at is null:
              candidate_days = OFFICER_MIN_COOLING_OFF_DAYS
          else:
              earnings_plus_2bd = date(plan.next_earnings_release_at) advanced
                                  forward by 2 business days
                                  (Saturday and Sunday skipped, no holiday calendar)
              candidate_days = whole days from date(anchor) to earnings_plus_2bd
          cooling_off_days = min(OFFICER_MAX_COOLING_OFF_DAYS,
                                 max(OFFICER_MIN_COOLING_OFF_DAYS, candidate_days))
      elif status == DESIGNATED_INSIDER:
          cooling_off_days = INSIDER_COOLING_OFF_DAYS
      else:                                       # NON_INSIDER
          cooling_off_days = 0

      TradingPlan.first_trade_allowed_at = anchor + cooling_off_days days
                                           (exact instant arithmetic, the
                                            time-of-day of anchor is preserved)
    input_set: "The adopting Participant's insider_status frozen at the anchor instant plus the EquityPlan.next_earnings_release_at of the single EquityPlan row referenced by the participant's grants; when the participant has no grant, the sole EquityPlan row is used."
    constants:
      OFFICER_MIN_COOLING_OFF_DAYS: 90
      OFFICER_MAX_COOLING_OFF_DAYS: 120
      INSIDER_COOLING_OFF_DAYS: 30
      BUSINESS_DAYS: "Monday..Friday"
    precision: "whole days; activation compares logical clock >= first_trade_allowed_at, so activating at exactly first_trade_allowed_at is permitted and one millisecond earlier is refused"

  - name: insider_report_deadline
    trigger: "Creation of a TransactionReport by the settlement or preclearance-execution side effect; writes TransactionReport.due_at, and POST /transaction-reports/{id}/file compares against it"
    algorithm: chronological
    formula: |
      d0 = date(TransactionReport.transaction_at)
      advance d0 forward two business days (Monday..Friday only, no holiday
      calendar); if d0 itself is a weekend day the advance starts from the next
      business day
      due_at = that date at 23:59:59.999Z

      On POST /transaction-reports/{id}/file:
        filed_at = logical clock instant
        status   = FILED       if filed_at <= due_at
                   LATE_FILED  if filed_at >  due_at
    input_set: "A single TransactionReport row; no aggregation."
    constants:
      REPORT_BUSINESS_DAYS: 2
      BUSINESS_DAYS: "Monday..Friday"
      DUE_TIME_OF_DAY: "23:59:59.999Z"
    precision: "millisecond comparison against due_at; filing at exactly 23:59:59.999Z on the due date is FILED, one millisecond later is LATE_FILED"

  - name: grant_date_determination
    trigger: "POST /grants/{id}/issue; writes Grant.grant_date"
    algorithm: interval_merge
    formula: |
      now = logical clock instant

      candidate_open = TradingWindow rows WHERE plan_id == grant.plan_id
                       AND status == OPEN
                       AND open_at <= now < close_at
      if candidate_open is non-empty:
          Grant.grant_date = date(now)
      else:
          candidate_future = TradingWindow rows WHERE plan_id == grant.plan_id
                             AND status == SCHEDULED AND open_at > now
          if candidate_future is empty:
              reject with ERR_NO_ELIGIBLE_GRANT_DATE
          chosen = the row of candidate_future with the smallest open_at;
                   ties broken by created_at ASC
          Grant.grant_date = date(chosen.open_at)
    input_set: "TradingWindow rows of the grant's plan only; windows with status SUSPENDED or CLOSED are excluded from both candidate sets."
    constants: {}
    precision: "the open interval test is half-open [open_at, close_at); a clock sitting exactly on close_at does not count as inside the window"

  - name: preclearance_validity
    trigger: "The SUBMITTED -> APPROVED transition of PreclearanceRequest; writes PreclearanceRequest.valid_until"
    algorithm: interval_merge
    formula: |
      valid_until = min(decided_at + PRECLEARANCE_VALIDITY_DAYS days,
                        window.close_at)
    input_set: "The decided request and its single TradingWindow."
    constants:
      PRECLEARANCE_VALIDITY_DAYS: 5
    precision: "exact instant arithmetic; execution compares logical clock <= valid_until, so executing at exactly valid_until is permitted"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order; the first
#      violated rule short-circuits the request and its error_id is returned)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID header is present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "A missing X-User-ID header, or one whose value is the empty string, fails before anything else. A header consisting only of whitespace is treated as empty."

  - priority: 2
    category: auth
    check: "X-Role header is present and is one of the six roles in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "An absent X-Role header, or a value outside {PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Participant, Auditor}, is an authentication failure rather than an authorization failure because no identity can be established."

  - priority: 10
    category: authorization
    check: "The authenticated role appears in the endpoint's roles list in §1.5 and, on an action endpoint whose §1.2 branches carry different actors, the role is the declared actor of the branch the request body selects"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
    description: "Role gate. Evaluated before any path parameter is resolved, so a permitted-role check on a non-existent resource still returns 403 rather than 404. The branch clause has exactly one instance in this domain: POST /grants/{id}/approve accepts both BoardMember and DelegatedOfficer, but approval_path BOARD is the BoardMember branch and approval_path DELEGATED is the DelegatedOfficer branch, so a DelegatedOfficer sending BOARD (or a BoardMember sending DELEGATED) is refused here, before any fiscal check runs."

  - priority: 15
    category: authorization
    check: "When the role is Participant, the X-User-ID equals the id of every Participant row the request reads or writes"
    error_id: ERR_PARTICIPANT_SCOPE_VIOLATION
    http_status: 403
    applies_to:
      - "GET /participants/{id}"
      - "GET /grants/{id}"
      - "GET /vesting-tranches/{id}"
      - "GET /vesting-events/{id}"
      - "GET /vesting-events/{id}/tax-allocations"
      - "GET /tax-allocations/{id}"
      - "GET /participants/{id}/mobility-assignments"
      - "GET /participants/{id}/transaction-reports"
      - "GET /preclearance-requests/{id}"
      - "GET /trading-plans/{id}"
      - "POST /preclearance-requests"
      - "POST /preclearance-requests/{id}/resubmit"
      - "POST /preclearance-requests/{id}/execute"
      - "POST /trading-plans"
      - "POST /trading-plans/{id}/activate"
      - "POST /trading-plans/{id}/modify"
      - "POST /trading-plans/{id}/terminate"
    description: "Row-level scoping for the entity_backed Participant role. A Participant reaching a sibling participant's grant, tranche, settlement, tax allocation, preclearance request, trading plan or Section 16 report is refused with 403, never 404, so the existence of the sibling row is not leaked. Non-Participant roles skip this rule entirely."

  - priority: 20
    category: existence
    check: "Every {id} path parameter resolves to a stored row of the declared entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Path existence, resolved outermost segment first: for POST /equity-plans/{id}/share-reserve-adjustments the plan is checked; for GET /vesting-events/{id}/tax-allocations the vesting event is checked. The concrete error_id is ERR_PLAN_NOT_FOUND, ERR_AUTHORITY_NOT_FOUND, ERR_PARTICIPANT_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_GRANT_NOT_FOUND, ERR_TRANCHE_NOT_FOUND, ERR_CYCLE_NOT_FOUND, ERR_VESTING_EVENT_NOT_FOUND, ERR_TAX_ALLOCATION_NOT_FOUND, ERR_WINDOW_NOT_FOUND, ERR_PRECLEARANCE_NOT_FOUND, ERR_TRADING_PLAN_NOT_FOUND or ERR_REPORT_NOT_FOUND."

  - priority: 25
    category: existence
    check: "Every foreign-key id supplied in the request body resolves to a stored row of the referenced entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to:
      - "POST /approval-authorities"
      - "POST /participants"
      - "POST /mobility-assignments"
      - "POST /grants"
      - "POST /grants/{id}/vesting-tranches"
      - "POST /performance-cycles"
      - "POST /trading-windows"
      - "POST /preclearance-requests"
      - "POST /trading-plans"
    description: "Body-level referential integrity, checked in the field order declared in §1.5 input. POST /grants checks plan_id then participant_id; POST /grants/{id}/vesting-tranches checks performance_cycle_id; POST /preclearance-requests checks participant_id then window_id."

  - priority: 30
    category: input
    check: "Every required input field of the endpoint is present, of the declared type, inside its declared range, and a member of its enum when the field is an enum"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: "Structural request validation: missing required field, wrong JSON type, negative or zero share count where a positive integer is declared, a string outside its length bounds, an unknown enum member, a malformed ISO-8601 instant, or a start-after-end date pair inside one payload. Unknown extra fields are ignored, never rejected."

  - priority: 32
    category: input
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
    description: "Pagination bounds are validated separately from ERR_INVALID_REQUEST so a caller can distinguish a bad page window from a bad filter. limit=0, limit=101 and offset=-1 are each rejected; limit=1, limit=100 and offset=0 are accepted."

  - priority: 35
    category: input
    check: "On POST /grants/{id}/revise the supplied exercise_price_cents is unchanged from the grant's current value when award_type is ISO or NSO"
    error_id: ERR_EXERCISE_PRICE_MISMATCH
    http_status: 400
    applies_to:
      - "POST /grants/{id}/revise"
    description: "A revision may change target_shares and vesting design but never the strike price, because the strike is pinned to the fair market value captured at draft time. The rule does not apply to RSU or PSU grants, whose exercise_price_cents is always 0."

  - priority: 40
    category: state
    check: "The target entity is in a state from which the requested trigger has an outgoing transition in §1.2"
    error_id: "ERR_<ENTITY>_INVALID_STATE"
    http_status: 409
    applies_to: "all transition endpoints"
    description: "Generic state gate; concrete ids are ERR_PLAN_INVALID_STATE, ERR_AUTHORITY_INVALID_STATE, ERR_PARTICIPANT_INVALID_STATE, ERR_GRANT_INVALID_STATE, ERR_TRANCHE_INVALID_STATE, ERR_CYCLE_INVALID_STATE, ERR_VESTING_EVENT_INVALID_STATE, ERR_WINDOW_INVALID_STATE, ERR_PRECLEARANCE_INVALID_STATE, ERR_TRADING_PLAN_INVALID_STATE and ERR_REPORT_INVALID_STATE. Repeating a successful trigger a second time lands here, which is how idempotency is refused."

  - priority: 42
    category: state
    check: "The owning EquityPlan is not in FROZEN or TERMINATED status"
    error_id: ERR_PLAN_FROZEN
    http_status: 409
    applies_to:
      - "POST /grants"
      - "POST /grants/{id}/submit"
      - "POST /grants/{id}/approve"
      - "POST /grants/{id}/issue"
      - "POST /grants/{id}/vesting-tranches"
      - "POST /performance-cycles"
      - "POST /trading-windows"
      - "POST /equity-plans/{id}/share-reserve-adjustments"
      - "POST /equity-plans/{id}/annual-rollover"
      - "POST /grants/{id}/cancel"
      - "POST /performance-cycles/{id}/certify"
    description: "A frozen plan accepts no new commitments, no new calendar and no grant-lifecycle write, including the cancel compensation and performance certification. Vesting, tax allocation, settlement and settlement reversal remain available while FROZEN (they are gated only on plan.status != TERMINATED) so shares already committed can still be delivered."

  - priority: 45
    category: concurrency
    check: "The supplied expected_<parent>_version equals the current version of the named parent row"
    error_id: "the error_id declared for the matching §1.2.1 concurrency rule"
    http_status: 412
    applies_to:
      - "POST /trading-plans"
      - "POST /equity-plans/{id}/share-reserve-adjustments"
    description: "Optimistic concurrency, evaluated after existence and state so a stale version on a non-existent parent still yields 404. POST /trading-plans compares expected_participant_version against Participant.version and returns ERR_STALE_PARTICIPANT_VERSION; POST /equity-plans/{id}/share-reserve-adjustments compares expected_plan_version against EquityPlan.version and returns ERR_STALE_PLAN_VERSION."

  - priority: 50
    category: business_safety
    check: "The X-User-ID performing an approval or certification differs from the X-User-ID recorded on the prior step of the same workflow"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to:
      - "POST /grants/{id}/approve"
      - "POST /preclearance-requests/{id}/decide"
      - "POST /performance-cycles/{id}/certify"
      - "POST /transaction-reports/{id}/file"
    description: "Four-eyes control. The approver of a grant may not be its submitted_by_user_id; the decider of a preclearance request may not be its requested_by_user_id; the certifier of a performance cycle may not be its created_by_user_id; the filer of a Section 16 report may not be the reporting participant's own id. Role membership alone never satisfies the control."

  - priority: 52
    category: business_safety
    check: "The TradingWindow named by the request is in OPEN status and the logical clock lies inside [open_at, close_at)"
    error_id: ERR_TRADING_WINDOW_CLOSED
    http_status: 409
    applies_to:
      - "POST /preclearance-requests"
      - "POST /preclearance-requests/{id}/decide"
      - "POST /preclearance-requests/{id}/execute"
    description: "Insider trades are only clearable while the window is genuinely open. A SUSPENDED window, a SCHEDULED window whose open_at is still in the future, and an OPEN window whose close_at has already passed on the logical clock all fail here."

  - priority: 54
    category: business_safety
    check: "The Participant is in ACTIVE employment_status"
    error_id: ERR_PARTICIPANT_NOT_ACTIVE
    http_status: 409
    applies_to:
      - "POST /grants"
      - "POST /mobility-assignments"
      - "POST /participants/{id}/insider-status"
      - "POST /preclearance-requests"
      - "POST /trading-plans"
    description: "A terminated participant receives no new grants, no new mobility periods, no insider-status change, no new preclearance and no new trading plan. Their existing tranches, settlements and Section 16 reports continue to be processable so the post-termination exercise period can run to completion."

  - priority: 56
    category: business_safety
    check: "When the approval path is DELEGATED, the grant's award_type is not PSU and the participant's insider_status is not SECTION_16_OFFICER"
    error_id: ERR_DELEGATED_APPROVAL_BLOCKED
    http_status: 409
    applies_to:
      - "POST /grants/{id}/approve"
    description: "Performance awards and awards to Section 16 officers require the full board; a DelegatedOfficer acting under an ApprovalAuthority is refused regardless of how much headroom the delegation has. Evaluated before the delegation's caps so the caller learns the path itself is unavailable rather than merely exhausted."

  - priority: 58
    category: business_temporal
    check: "The new MobilityAssignment period does not overlap any existing assignment period of the same participant"
    error_id: ERR_ASSIGNMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to:
      - "POST /mobility-assignments"
    description: "Assignment periods are closed intervals [start_date, end_date] and are compared inclusive-inclusive: a new period starting on the exact end_date of an existing one overlaps and is refused, while starting one day later is accepted. An assignment with a null end_date is treated as running to the end of time."

  - priority: 59
    category: business_temporal
    check: "The new TradingWindow does not overlap any non-CLOSED window of the same plan"
    error_id: ERR_TRADING_WINDOW_OVERLAP
    http_status: 409
    applies_to:
      - "POST /trading-windows"
    description: "Window intervals are half-open [open_at, close_at) and are compared half-open: a new window whose open_at equals an existing window's close_at does not overlap. Windows already in CLOSED status are ignored, so a replacement window may reuse a retired slot."

  - priority: 60
    category: business_temporal
    check: "The new TradingWindow's open_at is at least WINDOW_BUFFER_HOURS after the close_at of the preceding non-CLOSED window of the same plan"
    error_id: ERR_TRADING_WINDOW_BUFFER_VIOLATION
    http_status: 409
    applies_to:
      - "POST /trading-windows"
    description: "Even non-overlapping windows must be separated by a 48-hour blackout buffer so the market can absorb the prior window's trades. Checked immediately after the overlap rule, so a window that both overlaps and violates the buffer reports ERR_TRADING_WINDOW_OVERLAP. A gap of exactly 48 hours is allowed; 47 hours 59 minutes is refused."

  - priority: 61
    category: business_temporal
    check: "The logical clock is at or after TradingPlan.first_trade_allowed_at"
    error_id: ERR_COOLING_OFF_NOT_ELAPSED
    http_status: 409
    applies_to:
      - "POST /trading-plans/{id}/activate"
    description: "Rule 10b5-1 cooling-off enforcement. Activating at exactly first_trade_allowed_at succeeds; one millisecond earlier is refused. A modification restarts the clock, so a plan modified after activation must serve a fresh cooling-off period before it can be reactivated."

  - priority: 62
    category: business_temporal
    check: "The requested intended_trade_date lies inside the referenced TradingWindow's [date(open_at), date(close_at)] span and is not in the past"
    error_id: ERR_TRADE_DATE_OUTSIDE_WINDOW
    http_status: 409
    applies_to:
      - "POST /preclearance-requests"
      - "POST /preclearance-requests/{id}/resubmit"
      - "POST /preclearance-requests/{id}/decide"
    description: "A preclearance request may only name a trade date the window actually covers, re-checked at decision time because the clock has moved on. Distinct from ERR_TRADING_WINDOW_CLOSED, which is about the window's own status and the current clock rather than the requested date; the safety rule at priority 52 wins when both are violated."

  - priority: 63
    category: business_safety
    check: "When the tranche's vest_type is PERFORMANCE, its PerformanceCycle is in CERTIFIED status"
    error_id: ERR_PERFORMANCE_NOT_CERTIFIED
    http_status: 409
    applies_to:
      - "POST /vesting-tranches/{id}/vest"
    description: "Cross-entity guard: a performance tranche cannot vest on schedule alone because its share count is still provisional until the cycle's payout multiplier is certified. TIME tranches skip the rule."

  - priority: 64
    category: business_fiscal
    check: "The participant has at least one MobilityAssignment whose period covers the vesting period and whose workdays sum is greater than zero (MobilityAssignment.workdays)"
    error_id: ERR_WORKDAY_COVERAGE_GAP
    http_status: 409
    applies_to:
      - "POST /vesting-events/{id}/allocate-taxes"
    description: "Mobile-employee sourcing cannot allocate income across jurisdictions when the workday denominator is zero. Raised when the participant has no covering assignment at all, and equally when every covering assignment records zero workdays."

  - priority: 65
    category: business_fiscal
    check: "The VestingEvent's tax_status is ALLOCATED before settlement is attempted"
    error_id: ERR_TAX_ALLOCATION_MISSING
    http_status: 409
    applies_to:
      - "POST /vesting-events/{id}/settle"
    description: "The two state dimensions of VestingEvent are independent but ordered: shares cannot be delivered until the jurisdictional withholding is known, because the withheld share count is derived from the allocated tax total."

  - priority: 66
    category: business_fiscal
    check: "The entity's revision or modification counter has not reached its cap"
    error_id: "ERR_MAX_GRANT_REVISIONS_EXCEEDED | ERR_MAX_PRECLEARANCE_REVISIONS_EXCEEDED | ERR_MAX_MODIFICATIONS_EXCEEDED"
    http_status: 409
    applies_to:
      - "POST /grants/{id}/request-changes"
      - "POST /preclearance-requests/{id}/decide"
      - "POST /trading-plans/{id}/modify"
    description: "Bounded revision cycles, each capped on the endpoint that opens the loop rather than the one that closes it: a grant may be sent back for changes at most MAX_GRANT_REVISIONS = 2 times (Grant.changes_requested_count, incremented by request-changes), a preclearance request may be sent back for information at most MAX_PRECLEARANCE_REVISIONS = 2 times (PreclearanceRequest.revision_count, incremented by resubmit), and a trading plan modified at most MAX_TRADING_PLAN_MODIFICATIONS = 2 times (TradingPlan.modification_count). The counter is compared with < before the loop is opened, so the second cycle is allowed and the third is refused."

  - priority: 68
    category: business_fiscal
    check: "On the DELEGATED approval branch the ApprovalAuthority is ACTIVE, belongs to the grant's plan, names the acting X-User-ID as its delegate_user_id, the logical clock date at approval lies inside [effective_from, effective_to], and the grant's own weighted_reserve_shares does not exceed per_grant_share_cap"
    error_id: "ERR_AUTHORITY_NOT_EFFECTIVE | ERR_AUTHORITY_PER_GRANT_CAP_EXCEEDED"
    http_status: 409
    applies_to:
      - "POST /grants/{id}/approve"
    description: "Two delegation gates evaluated in this order: effectiveness first (a REVOKED, EXHAUSTED or EXPIRED authority, an authority belonging to another plan, an authority delegated to a different user, or an approval dated outside the delegation term, all yield ERR_AUTHORITY_NOT_EFFECTIVE), then the per-grant ceiling (ERR_AUTHORITY_PER_GRANT_CAP_EXCEEDED). Both endpoints of the effective_from/effective_to range are inclusive."

  - priority: 70
    category: business_fiscal
    check: "The delegation's cumulative usage plus this grant's fungible weighted shares does not exceed ApprovalAuthority.aggregate_share_cap"
    error_id: ERR_AUTHORITY_CAP_EXCEEDED
    http_status: 409
    applies_to:
      - "POST /grants/{id}/approve"
    description: "Aggregate delegation ceiling: consumed_shares + grant.weighted_reserve_shares <= aggregate_share_cap. Landing exactly on the cap is allowed and drives the authority to EXHAUSTED as a side effect; exceeding it by one share is refused and leaves the authority ACTIVE."

  - priority: 72
    category: business_fiscal
    check: "The sum of shares already precleared inside the window plus the requested share count does not exceed TradingWindow.aggregate_share_cap"
    error_id: ERR_WINDOW_SHARE_CAP_EXCEEDED
    http_status: 409
    applies_to:
      - "POST /preclearance-requests"
      - "POST /preclearance-requests/{id}/resubmit"
    description: "Aggregate validation across sibling requests: each individual request may be small while the collective exceeds the window ceiling. Only requests in APPROVED and EXECUTED status count toward the total via TradingWindow.approved_shares_cumulative; DENIED, EXPIRED and VOID requests release their reservation."

  - priority: 75
    category: business_fiscal
    check: "The projected fiscal-year gross burn rate after this approval does not exceed EquityPlan.burn_rate_limit_bps (see calculations.burn_rate_variants)"
    error_id: ERR_BURN_RATE_LIMIT_EXCEEDED
    http_status: 409
    applies_to:
      - "POST /grants/{id}/approve"
    description: "Plan-level annual issuance discipline, evaluated with exact integer cross-multiplication: (fiscal_year_gross_granted_shares + grant.weighted_reserve_shares) * 10000 > burn_rate_limit_bps * common_shares_outstanding is refused. A projection landing exactly on the limit passes. Evaluated before the reserve check so an approval that busts both reports the burn rate."

  - priority: 78
    category: business_fiscal
    check: "EquityPlan.available_reserve_shares is at least the grant's weighted_reserve_shares"
    error_id: ERR_RESERVE_INSUFFICIENT
    http_status: 409
    applies_to:
      - "POST /grants/{id}/approve"
      - "POST /equity-plans/{id}/share-reserve-adjustments"
    description: "The last fiscal gate: a plan with insufficient headroom cannot commit shares, and a negative share reserve adjustment cannot drive available_reserve_shares below zero. Consuming the reserve down to exactly zero is permitted."

  - priority: 80
    category: business_fiscal
    check: "Participant.employee_number is unique across all participants and PerformanceCycle.metric_code is unique per plan"
    error_id: "ERR_DUPLICATE_EMPLOYEE_NUMBER | ERR_DUPLICATE_METRIC_CODE"
    http_status: 409
    applies_to:
      - "POST /participants"
      - "POST /performance-cycles"
    description: "Uniqueness constraints are checked last so a request that is also malformed reports ERR_INVALID_REQUEST first. Employee-number comparison is exact and case-sensitive; metric_code uniqueness is scoped to the plan and to cycles not in CANCELLED status."

  - priority: 82
    category: business_safety
    check: "When any UNVESTED tranche of the terminating participant will accelerate, acceleration_fmv_per_share_cents is present in the request body"
    error_id: ERR_ACCELERATION_FMV_REQUIRED
    http_status: 409
    applies_to:
      - "POST /participants/{id}/terminate"
    description: "The termination cascade creates a VestingEvent for every accelerated tranche, which requires a fair market value. Rather than invent one, the whole request is refused and nothing is written. A termination in which every tranche forfeits does not need the field, so supplying it is harmless and omitting it is fine."

  - priority: 84
    category: business_temporal
    check: "The grant's plan has an OPEN window covering the logical clock, or at least one SCHEDULED window whose open_at is still in the future"
    error_id: ERR_NO_ELIGIBLE_GRANT_DATE
    http_status: 409
    applies_to:
      - "POST /grants/{id}/issue"
    description: "Grant date determination needs a window to anchor to. A plan whose only windows are CLOSED or SUSPENDED cannot issue an approved grant until a new window is scheduled; the grant stays in APPROVED and nothing is written."

  - priority: 86
    category: business_temporal
    check: "The logical clock is at or before PreclearanceRequest.valid_until"
    error_id: ERR_PRECLEARANCE_EXPIRED
    http_status: 409
    applies_to:
      - "POST /preclearance-requests/{id}/execute"
    description: "A clearance is good for five days or until the window closes, whichever comes first. Executing at exactly valid_until succeeds; one millisecond later is refused and the request is left in APPROVED so an operator can see the miss."

  - priority: 88
    category: business_safety
    check: "On adoption, the participant has no other TradingPlan in PENDING_COOLING_OFF status; on preclearance approval, the participant has no TradingPlan in EFFECTIVE status"
    error_id: ERR_TRADING_PLAN_CONFLICT
    http_status: 409
    applies_to:
      - "POST /trading-plans"
      - "POST /preclearance-requests/{id}/decide"
    description: "Two faces of the same conflict. An insider may supersede an EFFECTIVE plan but may not stack two plans that are both still serving their cooling-off period, because overlapping cooling-off clocks defeat the safe-harbour; the existing EFFECTIVE plan is superseded as a side effect rather than refused. Symmetrically, an insider trading under an EFFECTIVE pre-established plan may not also obtain individual preclearance, so the APPROVE decision is refused while such a plan exists."

# =============================================================================
# §1.5 API Endpoint Table
#   - Every path is rooted at api_prefix "/" (i.e. the collection segment is the
#     first path segment) so that every §1.1 FK is reverse-reachable through
#     either a sub-resource list or a filtered list.
#   - `input:` names ending in `?` are optional; every other name is required.
#   - All list endpoints additionally accept `limit?` and `offset?` and return
#     the §1.0 pagination fields alongside `data`.
# =============================================================================
endpoints:

  # --- logical clock -------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the deterministic logical clock every temporal rule reads. Time never advances on its own; the default clock at boot is 2026-08-01T00:00:00Z."
    roles: [PlanAdministrator, ComplianceOfficer]
    success_code: 200
    input:
      - current_utc
    output: "{ current_utc: string }"
    side_effects:
      - "No entity is mutated; subsequent requests evaluate every temporal comparison against the new instant"
      - "Setting the clock backwards is permitted and does not retroactively re-evaluate stored state"

  # --- EquityPlan ----------------------------------------------------------
  - method: POST
    path: "/equity-plans"
    description: "Registers a share plan with its authorized pool, evergreen provision, burn-rate limit and fungible share ratio."
    roles: [PlanAdministrator]
    success_code: 201
    input:
      - name
      - total_authorized_shares
      - common_shares_outstanding
      - fiscal_year_start_date
      - current_fiscal_year_label?
      - evergreen_pct_bps?
      - evergreen_cap_shares?
      - burn_rate_limit_bps?
      - fungible_ratio_full_value_bps?
      - low_reserve_threshold_bps?
      - next_earnings_release_at?
    output: EquityPlan
    side_effects:
      - "status = ACTIVE, version = 1"
      - "shares_committed_cumulative = 0, shares_returned_cumulative = 0, fiscal_year_gross_granted_shares = 0, fiscal_year_returned_shares = 0, evergreen_topup_last_shares = 0"
      - "runs calculations.share_reserve_ledger: available_reserve_shares = total_authorized_shares and reserve_posture is derived"
      - "gross_burn_rate_bps = 0 and net_burn_rate_bps = 0"

  - method: GET
    path: "/equity-plans"
    description: "Lists share plans."
    roles: [PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Auditor]
    success_code: 200
    input:
      - status?
      - reserve_posture?
      - limit?
      - offset?
    output: EquityPlan[]
    side_effects: []

  - method: GET
    path: "/equity-plans/{id}"
    description: "Reads one share plan including its live reserve and burn-rate fields."
    roles: [PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Auditor]
    success_code: 200
    input: []
    output: EquityPlan
    side_effects: []

  - method: POST
    path: "/equity-plans/{id}/status"
    description: "Drives the plan lifecycle: FREEZE, UNFREEZE or TERMINATE."
    roles: [PlanAdministrator, BoardMember]
    success_code: 200
    input:
      - action
      - freeze_reason?
    output: EquityPlan
    side_effects:
      - "action FREEZE: ACTIVE -> FROZEN and freeze_reason is stored"
      - "action UNFREEZE: FROZEN -> ACTIVE and freeze_reason is cleared to null"
      - "action TERMINATE: ACTIVE or FROZEN -> TERMINATED; every ApprovalAuthority of the plan in ACTIVE status moves to REVOKED and every TradingWindow of the plan in SCHEDULED, OPEN or SUSPENDED status moves to CLOSED"
      - "does not increment version beyond the ordinary per-write increment"

  - method: POST
    path: "/equity-plans/{id}/share-reserve-adjustments"
    description: "Applies a signed adjustment to the authorized pool (shareholder-approved increase, or a reduction). Optimistically concurrent against the plan."
    roles: [PlanAdministrator]
    success_code: 200
    input:
      - delta_shares
      - expected_plan_version
      - adjustment_reason?
    output: EquityPlan
    side_effects:
      - "total_authorized_shares += delta_shares"
      - "reruns calculations.share_reserve_ledger, rewriting available_reserve_shares and reserve_posture"
      - "increments EquityPlan.version by 1"
      - "refuses with ERR_RESERVE_INSUFFICIENT when the adjustment would drive available_reserve_shares below zero"

  - method: POST
    path: "/equity-plans/{id}/annual-rollover"
    description: "Closes the fiscal year: applies the evergreen top-up, resets the burn-rate accumulators and expires lapsed delegations."
    roles: [PlanAdministrator]
    success_code: 200
    input:
      - fiscal_year_label
    output: EquityPlan
    side_effects:
      - "runs calculations.evergreen_topup, writing evergreen_topup_last_shares and raising total_authorized_shares"
      - "zeroes fiscal_year_gross_granted_shares, fiscal_year_returned_shares, gross_burn_rate_bps and net_burn_rate_bps"
      - "advances fiscal_year_start_date by one calendar year and overwrites current_fiscal_year_label"
      - "reruns calculations.share_reserve_ledger"
      - "every ApprovalAuthority of the plan in ACTIVE status whose effective_to precedes the new fiscal_year_start_date moves to EXPIRED"

  - method: GET
    path: "/equity-plans/{id}/burn-rate-summary"
    description: "Computed read: both burn-rate variants side by side with the remaining headroom in shares."
    roles: [PlanAdministrator, BoardMember, ComplianceOfficer, Auditor]
    success_code: 200
    input: []
    output: "{ plan_id: string, gross_burn_rate_bps: integer, net_burn_rate_bps: integer, fiscal_year_gross_granted_shares: integer, fiscal_year_returned_shares: integer, burn_rate_limit_bps: integer, headroom_shares: integer, available_reserve_shares: integer, reserve_posture: string }"
    side_effects:
      - "headroom_shares = floor(burn_rate_limit_bps * common_shares_outstanding / 10000) - fiscal_year_gross_granted_shares, floored at 0"

  # --- ApprovalAuthority ---------------------------------------------------
  - method: POST
    path: "/approval-authorities"
    description: "Board delegates grant-approval authority to a named officer, bounded by a per-grant cap, an aggregate cap and a term."
    roles: [BoardMember]
    success_code: 201
    input:
      - plan_id
      - authority_type
      - delegate_user_id
      - per_grant_share_cap
      - aggregate_share_cap
      - effective_from
      - effective_to
    output: ApprovalAuthority
    side_effects:
      - "status = ACTIVE, consumed_shares = 0, remaining_shares = aggregate_share_cap"

  - method: GET
    path: "/approval-authorities/{id}"
    description: "Reads one delegation with its live consumption."
    roles: [PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Auditor]
    success_code: 200
    input: []
    output: ApprovalAuthority
    side_effects: []

  - method: GET
    path: "/equity-plans/{id}/approval-authorities"
    description: "Lists the delegations issued under one plan."
    roles: [PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Auditor]
    success_code: 200
    input:
      - status?
      - limit?
      - offset?
    output: ApprovalAuthority[]
    side_effects: []

  - method: POST
    path: "/approval-authorities/{id}/revoke"
    description: "Board revokes a delegation; already-approved grants are unaffected."
    roles: [BoardMember]
    success_code: 200
    input:
      - revocation_reason?
    output: ApprovalAuthority
    side_effects:
      - "status ACTIVE or EXHAUSTED -> REVOKED and revoked_at is stamped from the logical clock"
      - "consumed_shares and remaining_shares are frozen at their current values"

  # --- Participant ---------------------------------------------------------
  - method: POST
    path: "/participants"
    description: "Enrolls an award recipient with the payroll home, hire and birth anchors and an insider classification."
    roles: [PlanAdministrator]
    success_code: 201
    input:
      - full_name
      - employee_number
      - home_country_code
      - hire_date
      - birth_date
      - home_state_code?
      - insider_status?
    output: Participant
    side_effects:
      - "employment_status = ACTIVE, version = 1, insider_status defaults to NON_INSIDER"
      - "runs calculations.retirement_eligibility against the logical clock date, writing age_years, service_years and retirement_eligible"
      - "ptep_expiry_date = null"
      - "the row's id is the identity the Participant role authenticates as: a request with X-Role: Participant must send this id in X-User-ID"

  - method: GET
    path: "/participants"
    description: "Lists participants."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor]
    success_code: 200
    input:
      - employment_status?
      - insider_status?
      - limit?
      - offset?
    output: Participant[]
    side_effects: []

  - method: GET
    path: "/participants/{id}"
    description: "Reads one participant with recomputed age, service and retirement eligibility."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input: []
    output: Participant
    side_effects:
      - "reruns calculations.retirement_eligibility so age_years, service_years and retirement_eligible track the logical clock while ACTIVE"

  - method: POST
    path: "/participants/{id}/insider-status"
    description: "Compliance reclassifies a participant's insider status, changing every future cooling-off period and report form."
    roles: [ComplianceOfficer]
    success_code: 200
    input:
      - insider_status
    output: Participant
    side_effects:
      - "overwrites insider_status and increments version by 1"
      - "TradingPlan rows already adopted keep their insider_status_at_adoption and their cooling_off_days; only future adoptions and modifications see the new status"

  - method: POST
    path: "/participants/{id}/terminate"
    description: "Terminates employment and runs the four-hop forfeiture and acceleration cascade."
    roles: [PlanAdministrator]
    success_code: 200
    input:
      - termination_date
      - termination_reason
      - acceleration_fmv_per_share_cents?
    output: Participant
    side_effects:
      - "employment_status = TERMINATED; termination_date and termination_reason are stored; version increments by 1"
      - "hop 1: runs calculations.termination_vesting_resolution over every VestingTranche of the participant's GRANTED and PARTIALLY_FORFEITED grants, moving each to VESTED (with acceleration_reason) or FORFEITED"
      - "hop 1b: creates one VestingEvent per accelerated tranche at acceleration_fmv_per_share_cents, in tax_status PENDING_ALLOCATION and settlement_status PENDING_TAX"
      - "hop 2: reruns calculations.fungible_weighted_shares for every touched Grant, rewriting weighted_reserve_shares and outstanding_shares"
      - "hop 3: adds the released weighted shares to EquityPlan.shares_returned_cumulative and EquityPlan.fiscal_year_returned_shares, then reruns calculations.share_reserve_ledger and the NET burn-rate variant"
      - "hop 4: every Grant whose tranches are now all FORFEITED moves to FORFEITED, and a grant with a surviving tranche moves to PARTIALLY_FORFEITED"
      - "independent fan-out: every PreclearanceRequest of the participant in SUBMITTED, INFO_REQUESTED or APPROVED status moves to VOID, and every TradingPlan in PENDING_COOLING_OFF or EFFECTIVE status moves to TERMINATED"
      - "runs calculations.post_termination_exercise_period, writing ptep_expiry_date"
      - "refuses the entire request with ERR_ACCELERATION_FMV_REQUIRED, writing nothing, when a tranche would accelerate and acceleration_fmv_per_share_cents was omitted"

  # --- MobilityAssignment --------------------------------------------------
  - method: POST
    path: "/mobility-assignments"
    description: "Records a workday-sourcing period in one jurisdiction for a mobile employee."
    roles: [PlanAdministrator]
    success_code: 201
    input:
      - participant_id
      - jurisdiction_code
      - tax_rate_bps
      - start_date
      - workdays
      - end_date?
    output: MobilityAssignment
    side_effects:
      - "immutable row: no version field and no update endpoint"
      - "refuses with ERR_ASSIGNMENT_PERIOD_OVERLAP when [start_date, end_date] intersects an existing period of the same participant inclusive of both endpoints"

  - method: GET
    path: "/mobility-assignments/{id}"
    description: "Reads one assignment period."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input: []
    output: MobilityAssignment
    side_effects: []

  - method: GET
    path: "/participants/{id}/mobility-assignments"
    description: "Lists a participant's assignment periods in start_date order."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input:
      - jurisdiction_code?
      - limit?
      - offset?
    output: MobilityAssignment[]
    side_effects: []

  # --- Grant ---------------------------------------------------------------
  - method: POST
    path: "/grants"
    description: "Drafts an award for one participant against one plan."
    roles: [PlanAdministrator]
    success_code: 201
    input:
      - plan_id
      - participant_id
      - award_type
      - target_shares
      - exercise_price_cents?
    output: Grant
    side_effects:
      - "status = DRAFT, changes_requested_count = 0, grant_date = null, approval_path = null, weighted_reserve_shares = 0, outstanding_shares = 0"
      - "exercise_price_cents defaults to 0 and must be omitted or 0 for RSU and PSU; ISO and NSO require a positive value"
      - "no reserve is committed at draft time"

  - method: GET
    path: "/grants"
    description: "Lists grants filtered by plan, participant, approving delegation or status."
    roles: [PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Auditor]
    success_code: 200
    input:
      - plan_id?
      - participant_id?
      - approved_under_authority_id?
      - status?
      - limit?
      - offset?
    output: Grant[]
    side_effects: []

  - method: GET
    path: "/grants/{id}"
    description: "Reads one grant."
    roles: [PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input: []
    output: Grant
    side_effects: []

  - method: POST
    path: "/grants/{id}/vesting-tranches"
    description: "Appends a vesting tranche to a grant that has not yet been submitted for approval."
    roles: [PlanAdministrator]
    success_code: 201
    input:
      - tranche_index
      - vest_type
      - scheduled_vest_date
      - target_shares
      - performance_cycle_id?
    output: VestingTranche
    side_effects:
      - "status = UNVESTED, acceleration_reason = null, vested_at = null"
      - "vest_type TIME: shares = target_shares immediately and performance_cycle_id must be omitted"
      - "vest_type PERFORMANCE: performance_cycle_id is required and shares = 0 until the cycle is certified"
      - "tranche_index must be unique within the grant"
      - "allowed only while the grant is in DRAFT or CHANGES_REQUESTED"

  - method: GET
    path: "/vesting-tranches"
    description: "Lists tranches filtered by grant, performance cycle or status."
    roles: [PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Auditor]
    success_code: 200
    input:
      - grant_id?
      - performance_cycle_id?
      - status?
      - limit?
      - offset?
    output: VestingTranche[]
    side_effects: []

  - method: GET
    path: "/vesting-tranches/{id}"
    description: "Reads one tranche."
    roles: [PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input: []
    output: VestingTranche
    side_effects: []

  - method: POST
    path: "/grants/{id}/submit"
    description: "Submits a drafted grant for approval and records the submitter for the segregation-of-duties control."
    roles: [PlanAdministrator]
    success_code: 200
    input: []
    output: Grant
    side_effects:
      - "status DRAFT or CHANGES_REQUESTED -> PENDING_APPROVAL"
      - "submitted_by_user_id = X-User-ID, overwriting any previous submitter"
      - "requires at least one VestingTranche and refuses with ERR_GRANT_INVALID_STATE when the grant has none"

  - method: POST
    path: "/grants/{id}/request-changes"
    description: "Approver sends a pending grant back to the administrator with a note."
    roles: [BoardMember, DelegatedOfficer]
    success_code: 200
    input:
      - change_note
    output: Grant
    side_effects:
      - "status PENDING_APPROVAL -> CHANGES_REQUESTED and change_note is recorded"
      - "increments changes_requested_count by 1 after comparing it with MAX_GRANT_REVISIONS = 2, so the third send-back is refused with ERR_MAX_GRANT_REVISIONS_EXCEEDED"

  - method: POST
    path: "/grants/{id}/revise"
    description: "Administrator revises a grant sent back for changes."
    roles: [PlanAdministrator]
    success_code: 200
    input:
      - target_shares
      - exercise_price_cents?
    output: Grant
    side_effects:
      - "overwrites target_shares while the grant stays in CHANGES_REQUESTED; the grant is then resubmitted with POST /grants/{id}/submit"
      - "does not touch changes_requested_count, which the request-changes endpoint already advanced"
      - "refuses with ERR_EXERCISE_PRICE_MISMATCH when exercise_price_cents is supplied and differs from the stored strike on an ISO or NSO grant"

  - method: POST
    path: "/grants/{id}/approve"
    description: "Board or delegated officer approves a pending grant, committing plan reserve and delegation capacity."
    roles: [BoardMember, DelegatedOfficer]
    success_code: 200
    input:
      - approval_path
      - authority_id?
    output: Grant
    side_effects:
      - "runs calculations.fungible_weighted_shares, writing Grant.weighted_reserve_shares and outstanding_shares"
      - "evaluates the fiscal ladder in order: delegation effectiveness and per-grant cap (68), aggregate delegation cap (70), gross burn rate (75), then reserve headroom (78)"
      - "status PENDING_APPROVAL -> APPROVED; approved_by_user_id = X-User-ID; approved_at is stamped from the logical clock; approval_path is stored"
      - "BOARD branch: approved_under_authority_id stays null and no ApprovalAuthority is touched"
      - "DELEGATED branch: authority_id is required, approved_under_authority_id is stored, the authority's consumed_shares += weighted_reserve_shares, remaining_shares is recomputed, and the authority moves to EXHAUSTED when remaining_shares reaches exactly 0"
      - "EquityPlan.shares_committed_cumulative += weighted_reserve_shares and EquityPlan.fiscal_year_gross_granted_shares += weighted_reserve_shares"
      - "reruns calculations.share_reserve_ledger and both burn-rate variants"

  - method: POST
    path: "/grants/{id}/issue"
    description: "Issues an approved grant, determining the grant date from the plan's trading-window calendar."
    roles: [PlanAdministrator]
    success_code: 200
    input: []
    output: Grant
    side_effects:
      - "runs calculations.grant_date_determination, writing Grant.grant_date"
      - "status APPROVED -> GRANTED"
      - "refuses with ERR_NO_ELIGIBLE_GRANT_DATE, writing nothing, when the plan has neither an open window covering the clock nor a future scheduled window"

  - method: POST
    path: "/grants/{id}/cancel"
    description: "Cancels a grant and returns every share it committed to the plan reserve."
    roles: [PlanAdministrator, BoardMember]
    success_code: 200
    input:
      - cancel_reason
    output: Grant
    side_effects:
      - "status DRAFT, PENDING_APPROVAL, CHANGES_REQUESTED, APPROVED or GRANTED -> CANCELLED and cancel_reason is stored"
      - "every VestingTranche of the grant in UNVESTED status moves to FORFEITED; VESTED and SETTLED tranches are untouched"
      - "when the grant had been approved: EquityPlan.shares_returned_cumulative += the weighted shares released and EquityPlan.fiscal_year_returned_shares += the same amount, then calculations.share_reserve_ledger and the NET burn-rate variant are rerun; GROSS is deliberately not unwound"
      - "when the grant was approved under a delegation: that ApprovalAuthority's consumed_shares -= the released weighted shares, remaining_shares is recomputed, and an EXHAUSTED authority returns to ACTIVE"
      - "outstanding_shares and weighted_reserve_shares are recomputed from the surviving tranches"

  # --- PerformanceCycle ----------------------------------------------------
  - method: POST
    path: "/performance-cycles"
    description: "Opens a performance measurement cycle whose certified payout multiplier scales every tranche bound to it."
    roles: [PlanAdministrator]
    success_code: 201
    input:
      - plan_id
      - metric_code
      - target_value
      - certification_due_date
    output: PerformanceCycle
    side_effects:
      - "status = OPEN, actual_value = null, payout_multiplier_bps = null, certified_at = null, certified_by_user_id = null"
      - "created_by_user_id is recorded from X-User-ID for the segregation-of-duties control at certification"
      - "metric_code must be unique among the plan's non-CANCELLED cycles"

  - method: GET
    path: "/performance-cycles/{id}"
    description: "Reads one performance cycle."
    roles: [PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Auditor]
    success_code: 200
    input: []
    output: PerformanceCycle
    side_effects: []

  - method: GET
    path: "/equity-plans/{id}/performance-cycles"
    description: "Lists the performance cycles of one plan."
    roles: [PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Auditor]
    success_code: 200
    input:
      - status?
      - metric_code?
      - limit?
      - offset?
    output: PerformanceCycle[]
    side_effects: []

  - method: POST
    path: "/performance-cycles/{id}/certify"
    description: "Certifies the achieved metric, fixing the payout multiplier and resizing every bound tranche through a three-hop cascade."
    roles: [BoardMember, ComplianceOfficer]
    success_code: 200
    input:
      - actual_value
    output: PerformanceCycle
    side_effects:
      - "hop 1: runs calculations.performance_payout_multiplier, writing payout_multiplier_bps and rewriting VestingTranche.shares for every UNVESTED tranche bound to the cycle"
      - "hop 2: reruns calculations.fungible_weighted_shares for every affected Grant, rewriting weighted_reserve_shares and outstanding_shares"
      - "hop 3: applies the signed delta to EquityPlan.shares_committed_cumulative and fiscal_year_gross_granted_shares, then reruns calculations.share_reserve_ledger and both burn-rate variants"
      - "status OPEN -> CERTIFIED when payout_multiplier_bps > 0; certified_at and certified_by_user_id are stamped"
      - "status OPEN -> CANCELLED when payout_multiplier_bps == 0, and every UNVESTED bound tranche moves to FORFEITED with shares = 0"
      - "a hop-3 delta that would drive available_reserve_shares below zero refuses the whole certification with ERR_RESERVE_INSUFFICIENT"

  # --- VestingTranche transition + VestingEvent ----------------------------
  - method: POST
    path: "/vesting-tranches/{id}/vest"
    description: "Vests a tranche on schedule and opens the settlement it produces. Returns the created VestingEvent."
    roles: [PlanAdministrator]
    success_code: 201
    input:
      - fmv_per_share_cents
      - withholding_method?
    output: VestingEvent
    side_effects:
      - "VestingTranche status UNVESTED -> VESTED, vested_at stamped from the logical clock, acceleration_reason left null"
      - "creates one VestingEvent with gross_shares = VestingTranche.shares, vest_date = the logical clock date, sourcing_start_date = the grant's grant_date, tax_status = PENDING_ALLOCATION and settlement_status = PENDING_TAX"
      - "withholding_method defaults to SHARE_WITHHOLD"
      - "taxable_income_cents = gross_shares * fmv_per_share_cents"
      - "refuses with ERR_PERFORMANCE_NOT_CERTIFIED when vest_type is PERFORMANCE and the bound PerformanceCycle is not CERTIFIED"
      - "refuses with ERR_TRANCHE_INVALID_STATE when the tranche is already VESTED, SETTLED or FORFEITED"

  - method: GET
    path: "/vesting-events"
    description: "Lists settlements filtered by tranche, tax status or settlement status."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor]
    success_code: 200
    input:
      - tranche_id?
      - tax_status?
      - settlement_status?
      - limit?
      - offset?
    output: VestingEvent[]
    side_effects: []

  - method: GET
    path: "/vesting-events/{id}"
    description: "Reads one settlement including its withholding split."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input: []
    output: VestingEvent
    side_effects: []

  - method: POST
    path: "/vesting-events/{id}/allocate-taxes"
    description: "Sources the taxable income across jurisdictions from workday records and materialises the per-jurisdiction tax rows."
    roles: [PlanAdministrator, ComplianceOfficer]
    success_code: 200
    input: []
    output: VestingEvent
    side_effects:
      - "runs calculations.mobility_tax_allocation, creating one immutable TaxAllocation row per jurisdiction"
      - "writes total_workdays, total_tax_cents and blended_rate_bps"
      - "tax_status PENDING_ALLOCATION -> ALLOCATED; settlement_status is untouched"
      - "refuses with ERR_WORKDAY_COVERAGE_GAP, writing nothing, when the contributing workday total is zero"

  - method: POST
    path: "/vesting-events/{id}/settle"
    description: "Settles a tax-allocated vesting event using the elected withholding mechanic."
    roles: [PlanAdministrator]
    success_code: 200
    input: []
    output: VestingEvent
    side_effects:
      - "runs calculations.withholding_mechanics, writing shares_withheld, shares_sold, net_shares_delivered, residual_cash_cents and cash_due_cents"
      - "settlement_status PENDING_TAX -> SETTLED; VestingTranche moves VESTED -> SETTLED"
      - "when the participant's insider_status is DESIGNATED_INSIDER or SECTION_16_OFFICER: creates a TransactionReport with source_type = VESTING_SETTLEMENT, source_id = this event's id, transaction_at = the logical clock instant, shares = shares_withheld + shares_sold for a share-disposing method and gross_shares for CASH_REMITTANCE, form_type = FORM_4 for a SECTION_16_OFFICER and FORM_5 otherwise, status = PENDING and due_at from calculations.insider_report_deadline"
      - "refuses with ERR_TAX_ALLOCATION_MISSING when tax_status is still PENDING_ALLOCATION"

  - method: POST
    path: "/vesting-events/{id}/reverse"
    description: "Compensating action: unwinds a settlement completely, restoring the share split and the tax state."
    roles: [PlanAdministrator]
    success_code: 200
    input:
      - reversal_reason
    output: VestingEvent
    side_effects:
      - "settlement_status SETTLED -> REVERSED and reversal_reason is stored"
      - "zeroes shares_withheld, shares_sold, residual_cash_cents and cash_due_cents, and restores net_shares_delivered to gross_shares"
      - "tax_status is driven back to PENDING_ALLOCATION, total_tax_cents, total_workdays and blended_rate_bps are zeroed and every TaxAllocation row of the event is deleted"
      - "VestingTranche moves SETTLED -> VESTED so the settlement can be redone"
      - "any TransactionReport whose source_id is this event and whose status is PENDING is deleted; a report already FILED or LATE_FILED is left in place"

  # --- TaxAllocation -------------------------------------------------------
  - method: GET
    path: "/vesting-events/{id}/tax-allocations"
    description: "Lists the per-jurisdiction tax rows of one settlement in jurisdiction_code order."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input:
      - limit?
      - offset?
    output: TaxAllocation[]
    side_effects: []

  - method: GET
    path: "/tax-allocations/{id}"
    description: "Reads one per-jurisdiction tax row."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input: []
    output: TaxAllocation
    side_effects: []

  # --- TradingWindow -------------------------------------------------------
  - method: POST
    path: "/trading-windows"
    description: "Schedules a quarterly trading window on a plan's calendar."
    roles: [ComplianceOfficer]
    success_code: 201
    input:
      - plan_id
      - quarter_label
      - open_at
      - close_at
      - aggregate_share_cap?
    output: TradingWindow
    side_effects:
      - "status = SCHEDULED, approved_shares_cumulative = 0, suspension_reason = null"
      - "refuses with ERR_TRADING_WINDOW_OVERLAP when [open_at, close_at) intersects a non-CLOSED window of the same plan"
      - "refuses with ERR_TRADING_WINDOW_BUFFER_VIOLATION when the gap to the preceding non-CLOSED window's close_at is under WINDOW_BUFFER_HOURS = 48"

  - method: GET
    path: "/trading-windows/{id}"
    description: "Reads one trading window."
    roles: [PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input: []
    output: TradingWindow
    side_effects: []

  - method: GET
    path: "/equity-plans/{id}/trading-windows"
    description: "Lists a plan's windows in open_at order."
    roles: [PlanAdministrator, BoardMember, DelegatedOfficer, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input:
      - status?
      - limit?
      - offset?
    output: TradingWindow[]
    side_effects: []

  - method: POST
    path: "/trading-windows/{id}/status"
    description: "Drives the window lifecycle: OPEN, SUSPEND, RESUME or CLOSE."
    roles: [ComplianceOfficer]
    success_code: 200
    input:
      - action
      - suspension_reason?
    output: TradingWindow
    side_effects:
      - "action OPEN: SCHEDULED -> OPEN"
      - "action SUSPEND: OPEN -> SUSPENDED, suspension_reason stored, and every PreclearanceRequest of the window in SUBMITTED, INFO_REQUESTED or APPROVED status moves to VOID, after which approved_shares_cumulative is recomputed over the survivors"
      - "action RESUME: SUSPENDED -> OPEN and suspension_reason cleared to null"
      - "action CLOSE: SCHEDULED, OPEN or SUSPENDED -> CLOSED, every PreclearanceRequest of the window in SUBMITTED or INFO_REQUESTED status moves to VOID and every APPROVED request moves to EXPIRED"

  # --- PreclearanceRequest -------------------------------------------------
  - method: POST
    path: "/preclearance-requests"
    description: "Insider asks compliance to preclear a trade inside an open window."
    roles: [Participant, ComplianceOfficer]
    success_code: 201
    input:
      - participant_id
      - window_id
      - transaction_type
      - requested_shares
      - intended_trade_date
    output: PreclearanceRequest
    side_effects:
      - "status = SUBMITTED, revision_count = 0, valid_until = null, executed_shares = 0"
      - "requested_by_user_id = X-User-ID for the segregation-of-duties control at decision time"
      - "refuses with ERR_TRADING_WINDOW_CLOSED when the window is not OPEN or the clock sits outside [open_at, close_at)"
      - "refuses with ERR_TRADE_DATE_OUTSIDE_WINDOW when intended_trade_date falls outside the window's date span"
      - "refuses with ERR_WINDOW_SHARE_CAP_EXCEEDED when approved_shares_cumulative + requested_shares would exceed a non-null aggregate_share_cap"

  - method: GET
    path: "/preclearance-requests"
    description: "Lists preclearance requests filtered by participant, window or status."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor]
    success_code: 200
    input:
      - participant_id?
      - window_id?
      - status?
      - limit?
      - offset?
    output: PreclearanceRequest[]
    side_effects: []

  - method: GET
    path: "/preclearance-requests/{id}"
    description: "Reads one preclearance request."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input: []
    output: PreclearanceRequest
    side_effects: []

  - method: POST
    path: "/preclearance-requests/{id}/decide"
    description: "Compliance approves, denies, or sends a preclearance request back for more information."
    roles: [ComplianceOfficer]
    success_code: 200
    input:
      - decision
      - decision_note?
    output: PreclearanceRequest
    side_effects:
      - "decision REQUEST_INFO: SUBMITTED -> INFO_REQUESTED, decision_note stored, no reservation is taken, and revision_count is compared with MAX_PRECLEARANCE_REVISIONS = 2 so the third send-back is refused with ERR_MAX_PRECLEARANCE_REVISIONS_EXCEEDED"
      - "decision APPROVE: SUBMITTED -> APPROVED, decided_by_user_id and decided_at stamped, valid_until from calculations.preclearance_validity, and TradingWindow.approved_shares_cumulative += requested_shares"
      - "decision DENY: SUBMITTED -> DENIED, decided_by_user_id and decided_at stamped, no reservation is taken"
      - "refuses with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals requested_by_user_id"
      - "refuses with ERR_TRADING_WINDOW_CLOSED when the window is no longer OPEN"

  - method: POST
    path: "/preclearance-requests/{id}/resubmit"
    description: "Insider answers an information request with a revised share count and trade date."
    roles: [Participant, ComplianceOfficer]
    success_code: 200
    input:
      - requested_shares
      - intended_trade_date
    output: PreclearanceRequest
    side_effects:
      - "status INFO_REQUESTED -> SUBMITTED and decision_note is cleared to null"
      - "overwrites requested_shares and intended_trade_date and increments revision_count by 1; the cap itself is enforced by the decide endpoint that opens each loop"

  - method: POST
    path: "/preclearance-requests/{id}/execute"
    description: "Insider reports the executed trade against an approved clearance."
    roles: [Participant, ComplianceOfficer]
    success_code: 200
    input:
      - executed_shares
      - price_per_share_cents
    output: PreclearanceRequest
    side_effects:
      - "status APPROVED -> EXECUTED, executed_at stamped from the logical clock"
      - "executed_shares must be positive and at most requested_shares; TradingWindow.approved_shares_cumulative is deliberately NOT reduced when the insider executes less than cleared"
      - "creates a TransactionReport with source_type = PRECLEARANCE_EXECUTION, source_id = this request's id, shares = executed_shares, form_type = FORM_4 for a SECTION_16_OFFICER and FORM_5 otherwise, status = PENDING and due_at from calculations.insider_report_deadline"
      - "refuses with ERR_PRECLEARANCE_EXPIRED when the clock is past valid_until"

  # --- TradingPlan ---------------------------------------------------------
  - method: POST
    path: "/trading-plans"
    description: "Adopts a pre-established Rule 10b5-1 trading plan; the cooling-off period is fixed at adoption. Optimistically concurrent against the participant."
    roles: [Participant, ComplianceOfficer]
    success_code: 201
    input:
      - participant_id
      - plan_document_ref
      - first_scheduled_trade_date
      - total_shares
      - expected_participant_version
    output: TradingPlan
    side_effects:
      - "status = PENDING_COOLING_OFF, modification_count = 0, adopted_at stamped from the logical clock"
      - "insider_status_at_adoption is frozen from the participant's current insider_status"
      - "runs calculations.cooling_off_period, writing cooling_off_days and first_trade_allowed_at"
      - "any existing TradingPlan of the participant in EFFECTIVE status moves to EXPIRED and its id is stored on the new row as superseded_plan_id"
      - "increments Participant.version by 1"
      - "refuses with ERR_STALE_PARTICIPANT_VERSION (412) when expected_participant_version does not equal Participant.version"
      - "refuses with ERR_TRADING_PLAN_CONFLICT when the participant already has a plan in PENDING_COOLING_OFF status"

  - method: GET
    path: "/trading-plans"
    description: "Lists trading plans filtered by participant, superseded plan or status."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor]
    success_code: 200
    input:
      - participant_id?
      - superseded_plan_id?
      - status?
      - limit?
      - offset?
    output: TradingPlan[]
    side_effects: []

  - method: GET
    path: "/trading-plans/{id}"
    description: "Reads one trading plan with its cooling-off resolution."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input: []
    output: TradingPlan
    side_effects: []

  - method: POST
    path: "/trading-plans/{id}/activate"
    description: "Compliance activates a plan whose cooling-off period has elapsed."
    roles: [ComplianceOfficer]
    success_code: 200
    input: []
    output: TradingPlan
    side_effects:
      - "status PENDING_COOLING_OFF -> EFFECTIVE"
      - "refuses with ERR_COOLING_OFF_NOT_ELAPSED when the clock is before first_trade_allowed_at"

  - method: POST
    path: "/trading-plans/{id}/modify"
    description: "Modifies an effective plan, which restarts the cooling-off period from scratch."
    roles: [Participant, ComplianceOfficer]
    success_code: 200
    input:
      - first_scheduled_trade_date
      - total_shares
    output: TradingPlan
    side_effects:
      - "status EFFECTIVE -> PENDING_COOLING_OFF"
      - "adopted_at is restamped from the logical clock and calculations.cooling_off_period is rerun against the participant's CURRENT insider_status, rewriting insider_status_at_adoption, cooling_off_days and first_trade_allowed_at"
      - "overwrites first_scheduled_trade_date and total_shares and increments modification_count by 1 after comparing it with MAX_TRADING_PLAN_MODIFICATIONS = 2"

  - method: POST
    path: "/trading-plans/{id}/terminate"
    description: "Terminates a trading plan early."
    roles: [Participant, ComplianceOfficer]
    success_code: 200
    input:
      - termination_reason
    output: TradingPlan
    side_effects:
      - "status PENDING_COOLING_OFF or EFFECTIVE -> TERMINATED and termination_reason is stored"

  # --- TransactionReport ---------------------------------------------------
  - method: GET
    path: "/transaction-reports/{id}"
    description: "Reads one Section 16 report with its filing deadline."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input: []
    output: TransactionReport
    side_effects: []

  - method: GET
    path: "/participants/{id}/transaction-reports"
    description: "Lists an insider's Section 16 reports in transaction_at order."
    roles: [PlanAdministrator, ComplianceOfficer, Auditor, Participant]
    success_code: 200
    input:
      - status?
      - form_type?
      - limit?
      - offset?
    output: TransactionReport[]
    side_effects: []

  - method: POST
    path: "/transaction-reports/{id}/file"
    description: "Files a Section 16 report; whether it is timely is decided by the logical clock against due_at."
    roles: [ComplianceOfficer]
    success_code: 200
    input: []
    output: TransactionReport
    side_effects:
      - "filed_at is stamped from the logical clock"
      - "status PENDING -> FILED when filed_at <= due_at, and PENDING -> LATE_FILED when filed_at > due_at; both come from the same trigger"
      - "refuses with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals the reporting participant's id"

# =============================================================================
# §1.6 Error Code Catalog
#   Every id below is reachable from at least one endpoint. Ordering mirrors the
#   §1.4 priority ladder so the catalog doubles as the resolution order.
# =============================================================================
errors:

  # --- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID is missing or empty, or X-Role is missing or not one of the six roles in §1.7."
    applies_to: ["all endpoints"]

  - id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    condition: "The authenticated role is not listed in the endpoint's roles, or the role is listed but is not the declared actor of the §1.2 branch the request body selects (a DelegatedOfficer sending approval_path BOARD, or a BoardMember sending approval_path DELEGATED, on POST /grants/{id}/approve)."
    applies_to: ["all endpoints"]

  - id: ERR_PARTICIPANT_SCOPE_VIOLATION
    http_status: 403
    condition: "A caller with X-Role: Participant addresses a row belonging to a different participant."
    applies_to: ["all endpoints listing Participant in roles"]

  # --- existence ----------------------------------------------------------
  - id: ERR_PLAN_NOT_FOUND
    http_status: 404
    condition: "No EquityPlan matches the {id} path parameter or the plan_id in the body."
    applies_to: ["GET /equity-plans/{id}", "POST /equity-plans/{id}/status", "POST /equity-plans/{id}/share-reserve-adjustments", "POST /equity-plans/{id}/annual-rollover", "GET /equity-plans/{id}/burn-rate-summary", "GET /equity-plans/{id}/approval-authorities", "GET /equity-plans/{id}/performance-cycles", "GET /equity-plans/{id}/trading-windows", "POST /approval-authorities", "POST /grants", "POST /performance-cycles", "POST /trading-windows"]

  - id: ERR_AUTHORITY_NOT_FOUND
    http_status: 404
    condition: "No ApprovalAuthority matches the {id} path parameter or the authority_id in the body."
    applies_to: ["GET /approval-authorities/{id}", "POST /approval-authorities/{id}/revoke", "POST /grants/{id}/approve"]

  - id: ERR_PARTICIPANT_NOT_FOUND
    http_status: 404
    condition: "No Participant matches the {id} path parameter or the participant_id in the body."
    applies_to: ["GET /participants/{id}", "POST /participants/{id}/insider-status", "POST /participants/{id}/terminate", "GET /participants/{id}/mobility-assignments", "GET /participants/{id}/transaction-reports", "POST /mobility-assignments", "POST /grants", "POST /preclearance-requests", "POST /trading-plans"]

  - id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    condition: "No MobilityAssignment matches the {id} path parameter."
    applies_to: ["GET /mobility-assignments/{id}"]

  - id: ERR_GRANT_NOT_FOUND
    http_status: 404
    condition: "No Grant matches the {id} path parameter."
    applies_to: ["GET /grants/{id}", "POST /grants/{id}/vesting-tranches", "POST /grants/{id}/submit", "POST /grants/{id}/request-changes", "POST /grants/{id}/revise", "POST /grants/{id}/approve", "POST /grants/{id}/issue", "POST /grants/{id}/cancel"]

  - id: ERR_TRANCHE_NOT_FOUND
    http_status: 404
    condition: "No VestingTranche matches the {id} path parameter."
    applies_to: ["GET /vesting-tranches/{id}", "POST /vesting-tranches/{id}/vest"]

  - id: ERR_CYCLE_NOT_FOUND
    http_status: 404
    condition: "No PerformanceCycle matches the {id} path parameter or the performance_cycle_id in the body."
    applies_to: ["GET /performance-cycles/{id}", "POST /performance-cycles/{id}/certify", "POST /grants/{id}/vesting-tranches"]

  - id: ERR_VESTING_EVENT_NOT_FOUND
    http_status: 404
    condition: "No VestingEvent matches the {id} path parameter."
    applies_to: ["GET /vesting-events/{id}", "POST /vesting-events/{id}/allocate-taxes", "POST /vesting-events/{id}/settle", "POST /vesting-events/{id}/reverse", "GET /vesting-events/{id}/tax-allocations"]

  - id: ERR_TAX_ALLOCATION_NOT_FOUND
    http_status: 404
    condition: "No TaxAllocation matches the {id} path parameter."
    applies_to: ["GET /tax-allocations/{id}"]

  - id: ERR_WINDOW_NOT_FOUND
    http_status: 404
    condition: "No TradingWindow matches the {id} path parameter or the window_id in the body."
    applies_to: ["GET /trading-windows/{id}", "POST /trading-windows/{id}/status", "POST /preclearance-requests"]

  - id: ERR_PRECLEARANCE_NOT_FOUND
    http_status: 404
    condition: "No PreclearanceRequest matches the {id} path parameter."
    applies_to: ["GET /preclearance-requests/{id}", "POST /preclearance-requests/{id}/decide", "POST /preclearance-requests/{id}/resubmit", "POST /preclearance-requests/{id}/execute"]

  - id: ERR_TRADING_PLAN_NOT_FOUND
    http_status: 404
    condition: "No TradingPlan matches the {id} path parameter."
    applies_to: ["GET /trading-plans/{id}", "POST /trading-plans/{id}/activate", "POST /trading-plans/{id}/modify", "POST /trading-plans/{id}/terminate"]

  - id: ERR_REPORT_NOT_FOUND
    http_status: 404
    condition: "No TransactionReport matches the {id} path parameter."
    applies_to: ["GET /transaction-reports/{id}", "POST /transaction-reports/{id}/file"]

  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "A required field is missing, a field has the wrong JSON type, an enum value is unknown, a share or money amount violates its declared range, a date or instant is not ISO-8601, or a date pair is inverted."
    applies_to: ["all write endpoints"]

  - id: ERR_INVALID_PAGINATION
    http_status: 400
    condition: "limit is outside [1, 100] or offset is negative."
    applies_to: ["all list endpoints"]

  - id: ERR_EXERCISE_PRICE_MISMATCH
    http_status: 400
    condition: "A revision supplies an exercise_price_cents that differs from the strike stored on an ISO or NSO grant."
    applies_to: ["POST /grants/{id}/revise"]

  # --- state --------------------------------------------------------------
  - id: ERR_PLAN_INVALID_STATE
    http_status: 409
    condition: "The requested plan action has no outgoing transition from the plan's current status, e.g. UNFREEZE on an ACTIVE plan or any action on a TERMINATED plan."
    applies_to: ["POST /equity-plans/{id}/status", "POST /equity-plans/{id}/annual-rollover", "POST /equity-plans/{id}/share-reserve-adjustments"]

  - id: ERR_AUTHORITY_INVALID_STATE
    http_status: 409
    condition: "Revoking an ApprovalAuthority that is already REVOKED or EXPIRED."
    applies_to: ["POST /approval-authorities/{id}/revoke"]

  - id: ERR_PARTICIPANT_INVALID_STATE
    http_status: 409
    condition: "Terminating a participant whose employment_status is already TERMINATED."
    applies_to: ["POST /participants/{id}/terminate"]

  - id: ERR_GRANT_INVALID_STATE
    http_status: 409
    condition: "The requested grant action has no outgoing transition from the grant's current status, or a submit is attempted on a grant with no vesting tranche."
    applies_to: ["POST /grants/{id}/vesting-tranches", "POST /grants/{id}/submit", "POST /grants/{id}/request-changes", "POST /grants/{id}/revise", "POST /grants/{id}/approve", "POST /grants/{id}/issue", "POST /grants/{id}/cancel"]

  - id: ERR_TRANCHE_INVALID_STATE
    http_status: 409
    condition: "Vesting a tranche that is already VESTED, SETTLED or FORFEITED."
    applies_to: ["POST /vesting-tranches/{id}/vest"]

  - id: ERR_CYCLE_INVALID_STATE
    http_status: 409
    condition: "Certifying a PerformanceCycle that is already CERTIFIED or CANCELLED."
    applies_to: ["POST /performance-cycles/{id}/certify"]

  - id: ERR_VESTING_EVENT_INVALID_STATE
    http_status: 409
    condition: "Allocating taxes on an event whose tax_status is already ALLOCATED, settling an event that is already SETTLED or REVERSED, or reversing an event that is not SETTLED."
    applies_to: ["POST /vesting-events/{id}/allocate-taxes", "POST /vesting-events/{id}/settle", "POST /vesting-events/{id}/reverse"]

  - id: ERR_WINDOW_INVALID_STATE
    http_status: 409
    condition: "The requested window action has no outgoing transition from the window's current status, e.g. RESUME on an OPEN window or any action on a CLOSED window."
    applies_to: ["POST /trading-windows/{id}/status"]

  - id: ERR_PRECLEARANCE_INVALID_STATE
    http_status: 409
    condition: "Deciding a request that is not SUBMITTED, resubmitting one that is not INFO_REQUESTED, or executing one that is not APPROVED."
    applies_to: ["POST /preclearance-requests/{id}/decide", "POST /preclearance-requests/{id}/resubmit", "POST /preclearance-requests/{id}/execute"]

  - id: ERR_TRADING_PLAN_INVALID_STATE
    http_status: 409
    condition: "Activating a plan that is not PENDING_COOLING_OFF, modifying one that is not EFFECTIVE, or terminating one that is already TERMINATED or EXPIRED."
    applies_to: ["POST /trading-plans/{id}/activate", "POST /trading-plans/{id}/modify", "POST /trading-plans/{id}/terminate"]

  - id: ERR_REPORT_INVALID_STATE
    http_status: 409
    condition: "Filing a TransactionReport that is already FILED or LATE_FILED."
    applies_to: ["POST /transaction-reports/{id}/file"]

  - id: ERR_PLAN_FROZEN
    http_status: 409
    condition: "A new commitment, calendar entry or grant-lifecycle write is attempted while the owning EquityPlan is FROZEN or TERMINATED."
    applies_to: ["POST /grants", "POST /grants/{id}/submit", "POST /grants/{id}/approve", "POST /grants/{id}/issue", "POST /grants/{id}/cancel", "POST /grants/{id}/vesting-tranches", "POST /performance-cycles", "POST /performance-cycles/{id}/certify", "POST /trading-windows", "POST /equity-plans/{id}/share-reserve-adjustments", "POST /equity-plans/{id}/annual-rollover"]

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_PARTICIPANT_VERSION
    http_status: 412
    condition: "expected_participant_version does not equal the current Participant.version."
    applies_to: ["POST /trading-plans"]

  - id: ERR_STALE_PLAN_VERSION
    http_status: 412
    condition: "expected_plan_version does not equal the current EquityPlan.version."
    applies_to: ["POST /equity-plans/{id}/share-reserve-adjustments"]

  # --- business safety ----------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    condition: "The X-User-ID performing an approval, certification, preclearance decision or Section 16 filing is the same identity that performed the preceding step of that workflow."
    applies_to: ["POST /grants/{id}/approve", "POST /performance-cycles/{id}/certify", "POST /preclearance-requests/{id}/decide", "POST /transaction-reports/{id}/file"]

  - id: ERR_TRADING_WINDOW_CLOSED
    http_status: 409
    condition: "The referenced TradingWindow is not OPEN, or the logical clock lies outside [open_at, close_at)."
    applies_to: ["POST /preclearance-requests", "POST /preclearance-requests/{id}/decide", "POST /preclearance-requests/{id}/execute"]

  - id: ERR_PARTICIPANT_NOT_ACTIVE
    http_status: 409
    condition: "The participant's employment_status is TERMINATED and the request would create new equity, mobility, insider-status or trading activity for them."
    applies_to: ["POST /grants", "POST /mobility-assignments", "POST /participants/{id}/insider-status", "POST /preclearance-requests", "POST /trading-plans"]

  - id: ERR_DELEGATED_APPROVAL_BLOCKED
    http_status: 409
    condition: "approval_path is DELEGATED for a PSU grant or for a grant to a SECTION_16_OFFICER, both of which require the full board."
    applies_to: ["POST /grants/{id}/approve"]

  - id: ERR_PERFORMANCE_NOT_CERTIFIED
    http_status: 409
    condition: "A PERFORMANCE tranche is vested while its PerformanceCycle is still OPEN or was CANCELLED."
    applies_to: ["POST /vesting-tranches/{id}/vest"]

  - id: ERR_ACCELERATION_FMV_REQUIRED
    http_status: 409
    condition: "A termination would accelerate at least one UNVESTED tranche but acceleration_fmv_per_share_cents was omitted."
    applies_to: ["POST /participants/{id}/terminate"]

  - id: ERR_TRADING_PLAN_CONFLICT
    http_status: 409
    condition: "The adopting participant already has a TradingPlan in PENDING_COOLING_OFF status, or a preclearance APPROVE decision is attempted while the participant has a TradingPlan in EFFECTIVE status."
    applies_to: ["POST /trading-plans", "POST /preclearance-requests/{id}/decide"]

  # --- business temporal ---------------------------------------------------
  - id: ERR_ASSIGNMENT_PERIOD_OVERLAP
    http_status: 409
    condition: "The new [start_date, end_date] period intersects an existing MobilityAssignment period of the same participant, compared inclusive of both endpoints."
    applies_to: ["POST /mobility-assignments"]

  - id: ERR_TRADING_WINDOW_OVERLAP
    http_status: 409
    condition: "The new [open_at, close_at) interval intersects a non-CLOSED TradingWindow of the same plan, compared half-open."
    applies_to: ["POST /trading-windows"]

  - id: ERR_TRADING_WINDOW_BUFFER_VIOLATION
    http_status: 409
    condition: "The new window's open_at is less than WINDOW_BUFFER_HOURS = 48 hours after the preceding non-CLOSED window's close_at."
    applies_to: ["POST /trading-windows"]

  - id: ERR_COOLING_OFF_NOT_ELAPSED
    http_status: 409
    condition: "Activation is attempted before TradingPlan.first_trade_allowed_at."
    applies_to: ["POST /trading-plans/{id}/activate"]

  - id: ERR_TRADE_DATE_OUTSIDE_WINDOW
    http_status: 409
    condition: "intended_trade_date is outside the window's [date(open_at), date(close_at)] span, or is earlier than the logical clock date."
    applies_to: ["POST /preclearance-requests", "POST /preclearance-requests/{id}/resubmit", "POST /preclearance-requests/{id}/decide"]

  - id: ERR_PRECLEARANCE_EXPIRED
    http_status: 409
    condition: "Execution is attempted after PreclearanceRequest.valid_until."
    applies_to: ["POST /preclearance-requests/{id}/execute"]

  - id: ERR_NO_ELIGIBLE_GRANT_DATE
    http_status: 409
    condition: "Issuance is attempted while the plan has neither an OPEN window covering the clock nor a SCHEDULED window with a future open_at."
    applies_to: ["POST /grants/{id}/issue"]

  # --- business fiscal -----------------------------------------------------
  - id: ERR_WORKDAY_COVERAGE_GAP
    http_status: 409
    condition: "The contributing MobilityAssignment set is empty, or its workdays sum to zero, so no allocation denominator exists."
    applies_to: ["POST /vesting-events/{id}/allocate-taxes"]

  - id: ERR_TAX_ALLOCATION_MISSING
    http_status: 409
    condition: "Settlement is attempted while VestingEvent.tax_status is PENDING_ALLOCATION."
    applies_to: ["POST /vesting-events/{id}/settle"]

  - id: ERR_MAX_GRANT_REVISIONS_EXCEEDED
    http_status: 409
    condition: "Grant.changes_requested_count has already reached MAX_GRANT_REVISIONS = 2."
    applies_to: ["POST /grants/{id}/request-changes"]

  - id: ERR_MAX_PRECLEARANCE_REVISIONS_EXCEEDED
    http_status: 409
    condition: "PreclearanceRequest.revision_count has already reached MAX_PRECLEARANCE_REVISIONS = 2 when a REQUEST_INFO decision is attempted."
    applies_to: ["POST /preclearance-requests/{id}/decide"]

  - id: ERR_MAX_MODIFICATIONS_EXCEEDED
    http_status: 409
    condition: "TradingPlan.modification_count has already reached MAX_TRADING_PLAN_MODIFICATIONS = 2."
    applies_to: ["POST /trading-plans/{id}/modify"]

  - id: ERR_AUTHORITY_NOT_EFFECTIVE
    http_status: 409
    condition: "The named ApprovalAuthority is not ACTIVE, belongs to a different plan, names a different delegate_user_id than the acting X-User-ID, or the logical clock date at approval lies outside [effective_from, effective_to]."
    applies_to: ["POST /grants/{id}/approve"]

  - id: ERR_AUTHORITY_PER_GRANT_CAP_EXCEEDED
    http_status: 409
    condition: "The grant's weighted_reserve_shares exceeds ApprovalAuthority.per_grant_share_cap."
    applies_to: ["POST /grants/{id}/approve"]

  - id: ERR_AUTHORITY_CAP_EXCEEDED
    http_status: 409
    condition: "consumed_shares + weighted_reserve_shares would exceed ApprovalAuthority.aggregate_share_cap."
    applies_to: ["POST /grants/{id}/approve"]

  - id: ERR_WINDOW_SHARE_CAP_EXCEEDED
    http_status: 409
    condition: "approved_shares_cumulative + requested_shares would exceed a non-null TradingWindow.aggregate_share_cap."
    applies_to: ["POST /preclearance-requests", "POST /preclearance-requests/{id}/resubmit"]

  - id: ERR_BURN_RATE_LIMIT_EXCEEDED
    http_status: 409
    condition: "(fiscal_year_gross_granted_shares + weighted_reserve_shares) * 10000 > burn_rate_limit_bps * common_shares_outstanding."
    applies_to: ["POST /grants/{id}/approve"]

  - id: ERR_RESERVE_INSUFFICIENT
    http_status: 409
    condition: "The commitment or the negative reserve adjustment would drive EquityPlan.available_reserve_shares below zero."
    applies_to: ["POST /grants/{id}/approve", "POST /equity-plans/{id}/share-reserve-adjustments", "POST /performance-cycles/{id}/certify"]

  - id: ERR_DUPLICATE_EMPLOYEE_NUMBER
    http_status: 409
    condition: "Another Participant already carries the same employee_number, compared exactly and case-sensitively."
    applies_to: ["POST /participants"]

  - id: ERR_DUPLICATE_METRIC_CODE
    http_status: 409
    condition: "Another non-CANCELLED PerformanceCycle of the same plan already carries the same metric_code."
    applies_to: ["POST /performance-cycles"]

# =============================================================================
# §1.7 RBAC Permission Matrix
#   Identity is carried by two headers on every request: X-Role names the role
#   and X-User-ID names the acting identity. Only the Participant role is
#   entity_backed; the other five are opaque operator identities that the system
#   compares for equality (segregation of duties) but never resolves to a row.
# =============================================================================
roles:
  - name: PlanAdministrator
    description: "Stock plan administration team. Owns plan setup, participant and mobility records, grant drafting and issuance, tranche construction, vesting, tax allocation, settlement and reversal."
    identity: opaque
    exclusive_operations:
      - "POST /equity-plans"
      - "POST /equity-plans/{id}/share-reserve-adjustments"
      - "POST /equity-plans/{id}/annual-rollover"
      - "POST /participants"
      - "POST /participants/{id}/terminate"
      - "POST /mobility-assignments"
      - "POST /grants"
      - "POST /grants/{id}/vesting-tranches"
      - "POST /grants/{id}/submit"
      - "POST /grants/{id}/revise"
      - "POST /grants/{id}/issue"
      - "POST /performance-cycles"
      - "POST /vesting-tranches/{id}/vest"
      - "POST /vesting-events/{id}/settle"
      - "POST /vesting-events/{id}/reverse"
    shared_operations:
      - "POST /_clock/set_current_utc (with ComplianceOfficer)"
      - "POST /equity-plans/{id}/status (with BoardMember)"
      - "POST /grants/{id}/cancel (with BoardMember)"
      - "POST /vesting-events/{id}/allocate-taxes (with ComplianceOfficer)"
      - "every GET except GET /vesting-events which excludes the approver roles"

  - name: BoardMember
    description: "Compensation committee member. Approves grants on the BOARD path with no cap, delegates authority to officers, certifies performance cycles and can freeze or terminate a plan."
    identity: opaque
    exclusive_operations:
      - "POST /approval-authorities"
      - "POST /approval-authorities/{id}/revoke"
    shared_operations:
      - "POST /grants/{id}/approve (with DelegatedOfficer, but only BoardMember may use approval_path BOARD)"
      - "POST /grants/{id}/request-changes (with DelegatedOfficer)"
      - "POST /performance-cycles/{id}/certify (with ComplianceOfficer)"
      - "POST /equity-plans/{id}/status (with PlanAdministrator)"
      - "POST /grants/{id}/cancel (with PlanAdministrator)"
      - "reads on plans, authorities, grants, tranches, cycles and windows"

  - name: DelegatedOfficer
    description: "Officer holding delegated grant-approval authority. May approve only on the DELEGATED path, only inside an effective ApprovalAuthority's caps, and never for PSU awards or Section 16 officers."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /grants/{id}/approve (with BoardMember, restricted to approval_path DELEGATED)"
      - "POST /grants/{id}/request-changes (with BoardMember)"
      - "reads on plans, authorities, grants, tranches, cycles and windows"

  - name: ComplianceOfficer
    description: "Insider trading compliance. Owns the trading calendar, insider classification, preclearance decisions and Section 16 filings, and co-owns tax allocation and performance certification."
    identity: opaque
    exclusive_operations:
      - "POST /participants/{id}/insider-status"
      - "POST /trading-windows"
      - "POST /trading-windows/{id}/status"
      - "POST /preclearance-requests/{id}/decide"
      - "POST /trading-plans/{id}/activate"
      - "POST /transaction-reports/{id}/file"
    shared_operations:
      - "POST /_clock/set_current_utc (with PlanAdministrator)"
      - "POST /vesting-events/{id}/allocate-taxes (with PlanAdministrator)"
      - "POST /performance-cycles/{id}/certify (with BoardMember)"
      - "POST /preclearance-requests, /resubmit, /execute and every POST /trading-plans operation except activate (with Participant, acting on the insider's behalf)"
      - "every read except GET /equity-plans/{id}/burn-rate-summary which it also holds"

  - name: Participant
    description: "Award recipient acting on their own behalf. Sees only their own rows and may only file preclearance requests and adopt, modify or terminate their own trading plans."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /preclearance-requests (with ComplianceOfficer)"
      - "POST /preclearance-requests/{id}/resubmit (with ComplianceOfficer)"
      - "POST /preclearance-requests/{id}/execute (with ComplianceOfficer)"
      - "POST /trading-plans (with ComplianceOfficer)"
      - "POST /trading-plans/{id}/modify (with ComplianceOfficer)"
      - "POST /trading-plans/{id}/terminate (with ComplianceOfficer)"
      - "self-scoped reads of participants, grants, tranches, vesting events, tax allocations, mobility assignments, windows, preclearance requests, trading plans and transaction reports"
    notes: "X-User-ID must equal the Participant row's id. Any attempt to read or write another participant's row returns ERR_PARTICIPANT_SCOPE_VIOLATION (403), never 404."

  - name: Auditor
    description: "Read-only internal audit and external counsel. Sees everything, writes nothing, including the logical clock."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "every GET endpoint in §1.5"
    notes: "Auditor appears in no write endpoint's roles, so every POST returns ERR_ROLE_NOT_PERMITTED (403) for this role."
