        claim_type: derived_field_reconciliation
        grounds: ['calculations.engagement_phase_derivation', 'calculations.engagement_labor_rollup', 'entities.Engagement.fields.inventory_item_count', 'entities.DestinationResidence.fields.total_effective_capacity_linear_inches']
