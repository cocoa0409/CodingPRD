              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
          trigger:
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "00000000-0000-0000-0000-000000000021", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-08-01T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /diversion-consignments"
              payload: { site_id: "${site_id}", hauler_id: "00000000-0000-0000-0000-000000000022", channel: "COMPOST", pickup_window_start: "2026-08-02T09:00:00Z", pickup_window_end: "2026-08-02T11:00:00Z" }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
          assert:
            - "the capture answers HTTP 404 with data.error_id == \"ERR_FOOD_TYPE_NOT_FOUND\""
            - "the consignment answers HTTP 404 with data.error_id == \"ERR_HAULER_NOT_FOUND\""
            - "GET /waste-entries?shift_id=${shift_id} returns total_count == 0"

      - name: baseline_not_certified_code
        claim_type: error_triggerable
        grounds: ["errors[ERR_BASELINE_NOT_CERTIFIED]", "validations[priority=65]"]
        excluded_because:
          difficulty_instance: target_activation_requires_certified_baseline_period
          rationale: "The depth probe triggers this code on activation against a SUBMITTED baseline and then shows the success path after certification."

      - name: hauler_not_approved_code
        claim_type: error_triggerable
        grounds: ["errors[ERR_HAULER_NOT_APPROVED]", "validations[priority=65]"]
        excluded_because:
          difficulty_instance: consignment_dispatch_requires_approved_hauler_while_staging_does_not
          rationale: "The depth probe dispatches on a PENDING hauler to trigger the code and then repeats the call after approval."

      - name: entry_site_mismatch_code
        claim_type: error_triggerable
        grounds: ["errors[ERR_ENTRY_SITE_MISMATCH]", "validations[priority=80]"]
        excluded_because:
          difficulty_instance: entry_site_mismatch_outranks_allocation_exceeds_unrouted
          rationale: "The cross-site line in the depth probe is the canonical trigger for this code."

      - name: capture_outside_shift_date_code
        claim_type: error_triggerable
        grounds: ["errors[ERR_CAPTURE_OUTSIDE_SHIFT_DATE]", "validations[priority=82]"]
        excluded_because:
          difficulty_instance: capture_date_outside_shift_outranks_loss_reason_station_mismatch
          rationale: "The depth probe posts a capture whose date differs from the shift's date to assert exactly this code."

      - name: donation_window_expired_code
        claim_type: error_triggerable
        grounds: ["errors[ERR_DONATION_WINDOW_EXPIRED]", "validations[priority=85]"]
        excluded_because:
          difficulty_instance: donation_shelf_life_endpoint_is_inclusive_to_the_second
          rationale: "The depth probe brackets the shelf-life endpoint to the second, asserting the pass at the inclusive instant and this code one second later."

      - name: station_occupied_code
        claim_type: error_triggerable
        grounds: ["errors[ERR_STATION_OCCUPIED]", "validations[priority=90]"]
        excluded_because:
          difficulty_instance: station_lock_is_a_closed_interval_of_capture_lock_plus_sixty_seconds
          rationale: "Both inclusive endpoints of the lock interval are probed there, which is where this code is triggered."

      - name: hauler_window_capacity_code
        claim_type: error_triggerable
        grounds: ["errors[ERR_HAULER_WINDOW_CAPACITY]", "validations[priority=92]"]
        excluded_because:
          difficulty_instance: hauler_window_capacity_is_half_open_so_touching_windows_are_allowed
          rationale: "The depth probe contrasts a touching window (allowed) with an intersecting one, which triggers this code."

      - name: rollup_data_quality_blocked_code
        claim_type: error_triggerable
        grounds: ["errors[ERR_ROLLUP_DATA_QUALITY_BLOCKED]", "validations[priority=110]"]
        excluded_because:
          difficulty_instance: rollup_publication_blocked_by_any_open_data_quality_finding_on_an_in_scope_site
          rationale: "The depth probe blocks publication with one OPEN finding and unblocks it by resolving that finding."

      - name: baseline_no_data_code
        claim_type: error_triggerable
        grounds: ["errors[ERR_BASELINE_NO_DATA]", "validations[priority=115]"]
        excluded_because:
          difficulty_instance: baseline_empty_window_is_an_error_while_the_inclusive_end_date_captures_the_last_day
          rationale: "The empty-window submission in the depth probe is the trigger for this code, paired there with the inclusive end-date success."

  # =========================================================================
  # rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: kitchen_staff_and_shift_lead_both_capture_and_both_acknowledge
        claim_type: shared_operations
        grounds: ["rbac.KitchenStaff.shared_operations", "rbac.ShiftLead.shared_operations", "endpoints[POST /waste-entries]"]
        distinguishing_aspect: "Capture is the only write both floor roles hold, and the row records WHICH identity captured it in captured_by_user_id — the shared permission still leaves an attributable trace that later feeds the void duty separation."
        test_recipe:
          setup: ["Site HK-01, station PREP-1, food type Chicken Breast, OPEN AM shift with 250 meals."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Chicken Breast", category: "PROTEIN", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: false, compostable: true, donation_shelf_life_hours: 720 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
          trigger:
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 900, loss_reason: "TRIM", captured_at: "2026-08-01T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 700, loss_reason: "SPOILAGE", captured_at: "2026-08-01T10:10:00Z" }
              as: ShiftLead
              as_user_id: "sl-1"
          assert:
            - "both calls answer HTTP 201 with status RECORDED"
            - "the first row carries captured_by_user_id == \"ks-1\" and the second carries captured_by_user_id == \"sl-1\""
            - "GET /shifts/${shift_id} shows shift_waste_grams == 1600 from the two identities"

      - name: kitchen_staff_cannot_perform_the_shift_leads_curation_writes
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds: ["rbac.KitchenStaff.cannot", "rbac.ShiftLead.exclusive_operations", "validations[priority=20]"]
        distinguishing_aspect: "KitchenStaff may create the row but may not touch it afterwards: flag, clear-flag, void, correction and shift close are all ShiftLead-exclusive, and the refusal is a role check at priority 20 rather than a state error."
        test_recipe:
          setup: ["Site HK-01, station PREP-1, OPEN AM shift, one RECORDED 900 g capture by ks-1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Chicken Breast", category: "PROTEIN", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: false, compostable: true, donation_shelf_life_hours: 720 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 900, loss_reason: "TRIM", captured_at: "2026-08-01T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { entry_id: "$.data.id", entry_version: "$.data.version" }
          trigger:
            - call: "POST /waste-entries/${entry_id}/flag"
              payload: { flag_reason: "SUSPECTED_DUPLICATE" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /waste-entries/${entry_id}/void"
              payload: { void_reason: "mis-keyed" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /waste-entries/${entry_id}/corrections"
              payload: { expected_entry_version: "${entry_version}", correction_note: "reweighed", weight_grams: 800 }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /shifts/${shift_id}/close"
              payload: {}
              as: KitchenStaff
              as_user_id: "ks-1"
          assert:
            - "all four calls answer HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "the correction refusal precedes any version comparison, so a stale expected_entry_version would still yield ERR_UNAUTHORIZED"
            - "GET /waste-entries/${entry_id} is unchanged: status RECORDED, weight_grams 900, version 1"

      - name: site_manager_cannot_certify_or_reject_the_baseline_it_submitted
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds: ["rbac.SiteSustainabilityManager.cannot", "rbac.CorporateSustainabilityLead.exclusive_operations", "state_machines.BaselinePeriod"]
        distinguishing_aspect: "The site owns opening and submitting a baseline but not the certification decision, so the SUBMITTED state can only be left by a corporate identity — the site cannot self-certify its own reduction denominator."
        test_recipe:
          setup: ["Site HK-01 with one closed AM shift carrying a 1000 g capture; a SUBMITTED baseline for 2026-08-01..2026-08-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Chicken Breast", category: "PROTEIN", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: false, compostable: true, donation_shelf_life_hours: 720 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-08-01T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /shifts/${shift_id}/close"
              payload: {}
              as: ShiftLead
              as_user_id: "sl-1"
            - call: "POST /baseline-periods"
              payload: { site_id: "${site_id}", start_date: "2026-08-01", end_date: "2026-08-01" }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
              captures: { baseline_id: "$.data.id" }
            - call: "POST /baseline-periods/${baseline_id}/submit"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
          trigger:
            - call: "POST /baseline-periods/${baseline_id}/certify"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "POST /baseline-periods/${baseline_id}/reject"
              payload: { rejection_note: "self-serve" }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
          assert:
            - "both calls answer HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "GET /baseline-periods/${baseline_id} still reads status SUBMITTED"
            - "the same certify call issued as CorporateSustainabilityLead with X-User-ID csl-1 answers HTTP 200 and status CERTIFIED"

      - name: corporate_lead_cannot_open_a_baseline_or_run_site_logistics
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds: ["rbac.CorporateSustainabilityLead.cannot", "rbac.SiteSustainabilityManager.exclusive_operations", "validations[priority=20]"]
        distinguishing_aspect: "Authority runs in both directions, not down a hierarchy: the role that certifies baselines and sets targets cannot open a baseline, create a consignment or resolve a finding, so no identity spans both sides of the review boundary."
        test_recipe:
          setup: ["Site HK-01, hauler Green Haul (COMPOST) approved; nothing else needed because the refusal precedes every business rule."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /haulers"
              payload: { name: "Green Haul", channels: ["COMPOST"], rate_cents_per_tonne: 52000, stop_fee_cents: 1800, capacity_kg_per_pickup: 500 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { hauler_id: "$.data.id" }
            - call: "POST /haulers/${hauler_id}/approve"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
          trigger:
            - call: "POST /baseline-periods"
              payload: { site_id: "${site_id}", start_date: "2026-08-01", end_date: "2026-08-01" }
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
            - call: "POST /diversion-consignments"
              payload: { site_id: "${site_id}", hauler_id: "${hauler_id}", channel: "COMPOST", pickup_window_start: "2026-08-02T09:00:00Z", pickup_window_end: "2026-08-02T11:00:00Z" }
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
            - call: "POST /data-quality-scans"
              payload: { site_id: "${site_id}", scan_date: "2026-08-01" }
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
