scaffold_corner_design:

  # =====================================================================
  # From Table 1 (Entities) — Creation / Retrieval / Listing / Defaults / Computed / System / Type
  # =====================================================================
  - section: entities
    instances:

      - name: jurisdiction_create_returns_201_with_default_flags
        claim_type: defaults
        grounds:
          - entities.Jurisdiction.fields.ban_the_box_enabled
          - entities.Jurisdiction.fields.salary_history_ban_enabled
          - entities.Jurisdiction.fields.pre_adverse_waiting_days
          - endpoints.POST_/api/v1/jurisdictions
        distinguishing_aspect: "Omitting optional fields yields defaults: ban_the_box_enabled=false, salary_history_ban_enabled=false, pre_adverse_waiting_days=5."
        test_recipe:
          setup:
            - "Empty DB; clock at 2026-06-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "TX" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id, btb: $.data.ban_the_box_enabled, sh: $.data.salary_history_ban_enabled, days: $.data.pre_adverse_waiting_days }
          assert:
            - "btb == false"
            - "sh == false"
            - "days == 5"

      - name: applicant_create_returns_201_with_system_id_and_timestamps
        claim_type: creation
        grounds:
          - entities.Applicant
          - endpoints.POST_/api/v1/applicants
        distinguishing_aspect: "Server mints id and created_at; both are populated and id is a UUID."
        test_recipe:
          setup:
            - "Empty DB; clock at 2026-06-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Alan Kay", email: "alan.kay@example.com", date_of_birth: "1940-05-17T00:00:00.000Z" }
              as: Applicant
              captures: { app_id: $.data.id, app_created: $.data.created_at, app_version: $.data.version }
          assert:
            - "app_id != null"
            - "app_created == '2026-06-01T10:00:00.000Z'"
            - "app_version == 1"

      - name: get_application_by_id_returns_stored_record
        claim_type: retrieval
        grounds:
          - endpoints.GET_/api/v1/applications/{id}
        distinguishing_aspect: "GET /applications/{id} returns the persisted Application with all fields."
        test_recipe:
          setup:
            - "Application created in DRAFT with position_title='Engineer'."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "OR" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Sue Black", email: "sue@example.com", date_of_birth: "1970-01-01T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "GET /api/v1/applications/${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { got_id: $.data.id, got_status: $.data.status, got_title: $.data.position_title }
          assert:
            - "got_id == ${app_id}"
            - "got_status == 'DRAFT'"
            - "got_title == 'Engineer'"

      - name: list_applications_with_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints.GET_/api/v1/applications
        distinguishing_aspect: "List endpoint returns array data with pagination metadata."
        test_recipe:
          setup:
            - "Two applications exist."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "TN" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Mae Jemison", email: "mae@example.com", date_of_birth: "1956-10-17T00:00:00.000Z" }
              as: Applicant
              captures: { a1: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a1}", jurisdiction_id: "${jur_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${a1}"
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${a1}", jurisdiction_id: "${jur_id}", position_title: "Manager" }
              as: Applicant
              as_user_id: "${a1}"
          trigger:
            - call: "GET /api/v1/applications"
              payload: {}
              as: Recruiter
              as_user_id: "rec-1"
          assert:
            - "response_type == 'array'"
            - "len(data) >= 2"

      - name: get_application_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints.GET_/api/v1/applications/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Non-existent UUID returns 404 with ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/v1/applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Recruiter
              as_user_id: "rec-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_NOT_FOUND'"

      - name: jurisdiction_state_code_enum_uppercase_only
        claim_type: type_constraints
        grounds:
          - entities.Jurisdiction.fields.state_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "state_code must be 2-letter uppercase; lowercase is invalid."
        test_recipe:
          setup: ["Empty DB; clock at fixed time."]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "ca" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_REQUEST'"

      - name: order_status_field_is_computed_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.BackgroundCheckOrder.fields.status
        distinguishing_aspect: "BackgroundCheckOrder.status is computed; client supplying status in create body has no effect (input not declared)."
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_compound_status_derived_from_three_parallel_children
          rationale: "Compound order status derivation is verified by the §1.8 instance that walks PENDING -> IN_REVIEW -> COMPLETE."

  # =====================================================================
  # From Table 2 (State Machines) — Valid / Invalid transitions, Initial / Terminal, Idempotency
  # =====================================================================
  - section: state_machines
    instances:

      - name: application_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.Application.initial_state
        distinguishing_aspect: "Application created via POST /applications starts in DRAFT."
        test_recipe:
          setup: ["Jurisdiction + Applicant exist."]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "AK" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Ada Yonath", email: "yonath@example.com", date_of_birth: "1939-06-22T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_status: $.data.status }
          assert:
            - "app_status == 'DRAFT'"

      - name: consent_grant_idempotency_rejects_second_attempt
        claim_type: idempotency
        grounds:
          - state_machines.ConsentDisclosure.PENDING_to_GRANTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Granting an already-GRANTED consent returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Consent already in GRANTED state."]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "RI" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Rosalind Franklin", email: "rosalind@example.com", date_of_birth: "1920-07-25T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_id}", position_title: "Scientist" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { c_id: $.data.id, c_v0: $.data.version }
            - call: "POST /api/v1/consents/${c_id}/grant"
              payload: { expected_consent_disclosure_version: "${c_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { c_v1: $.data.version }
          trigger:
            - call: "POST /api/v1/consents/${c_id}/grant"
              payload: { expected_consent_disclosure_version: "${c_v1}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: verification_dispute_from_pending_rejects_with_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Verification.REPORTED_to_DISPUTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Verification.status==PENDING cannot dispute; only REPORTED can."
        test_recipe:
          setup: ["Order with PENDING Verification rows."]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "MT" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Marie Curie", email: "marie@example.com", date_of_birth: "1867-11-07T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_id}", position_title: "Scientist" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { c_id: $.data.id, c_v0: $.data.version }
            - call: "POST /api/v1/consents/${c_id}/grant"
              payload: { expected_consent_disclosure_version: "${c_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_v1: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/conditional-offer"
              payload: { expected_application_version: "${app_v1}" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { app_v2: $.data.version }
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "${app_id}", consent_id: "${c_id}", expected_application_version: "${app_v2}" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { order_id: $.data.id }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "CRIMINAL" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { crim_id: $.data.id, crim_v0: $.data.version }
          trigger:
            - call: "POST /api/v1/verifications/${crim_id}/dispute"
              payload: { dispute_reason: "premature", expected_verification_version: "${crim_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: hire_from_conditional_offer_with_clear_succeeds
        claim_type: valid_transition
        grounds:
          - state_machines.Application.CONDITIONAL_OFFER_to_HIRED
        distinguishing_aspect: "Application transitions CONDITIONAL_OFFER -> HIRED once order is COMPLETE+CLEAR."
        test_recipe:
          setup: ["Order COMPLETE with overall_result=CLEAR."]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "ME" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Lise Meitner", email: "lise@example.com", date_of_birth: "1878-11-07T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_id}", position_title: "Scientist" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { c_id: $.data.id, c_v0: $.data.version }
            - call: "POST /api/v1/consents/${c_id}/grant"
              payload: { expected_consent_disclosure_version: "${c_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_v1: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/conditional-offer"
              payload: { expected_application_version: "${app_v1}" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { app_v2: $.data.version }
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "${app_id}", consent_id: "${c_id}", expected_application_version: "${app_v2}" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { order_id: $.data.id, app_v3: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "CRIMINAL" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { crim_id: $.data.id, crim_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "MVR" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { mvr_id: $.data.id, mvr_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "EDUCATION" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { edu_id: $.data.id, edu_v0: $.data.version }
            - call: "POST /api/v1/verifications/${crim_id}/report"
              payload: { result: "PASS", report_payload: {}, expected_verification_version: "${crim_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${mvr_id}/report"
              payload: { result: "PASS", report_payload: {}, expected_verification_version: "${mvr_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${edu_id}/report"
              payload: { result: "PASS", report_payload: {}, expected_verification_version: "${edu_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
          trigger:
            - call: "POST /api/v1/applications/${app_id}/hire"
              payload: { expected_application_version: "${app_v3}" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { hired_status: $.data.status }
          assert:
            - "hired_status == 'HIRED'"

      - name: hire_from_conditional_offer_with_consider_blocked_by_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Application.CONDITIONAL_OFFER_to_HIRED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "HIRE requires order COMPLETE+CLEAR; CONSIDER blocks hire (state precondition unsatisfied)."
        test_recipe:
          setup: ["Order COMPLETE with overall_result=CONSIDER (CRIMINAL FAIL)."]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
              payload: { state_code: "NH" }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /api/v1/applicants"
              payload: { full_name: "Emmy Noether", email: "emmy@example.com", date_of_birth: "1882-03-23T00:00:00.000Z" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { applicant_id: "${applicant_id}", jurisdiction_id: "${jur_id}", position_title: "Engineer" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/v1/consents"
              payload: { application_id: "${app_id}", disclosure_text_version: "v2024-01", signed_at: "2026-06-01T10:00:00.000Z", ip_address: "1.2.3.4" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { c_id: $.data.id, c_v0: $.data.version }
            - call: "POST /api/v1/consents/${c_id}/grant"
              payload: { expected_consent_disclosure_version: "${c_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /api/v1/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_v1: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/conditional-offer"
              payload: { expected_application_version: "${app_v1}" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { app_v2: $.data.version }
            - call: "POST /api/v1/background-check-orders"
              payload: { application_id: "${app_id}", consent_id: "${c_id}", expected_application_version: "${app_v2}" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { order_id: $.data.id, app_v3: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "CRIMINAL" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { crim_id: $.data.id, crim_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "MVR" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { mvr_id: $.data.id, mvr_v0: $.data.version }
            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "EDUCATION" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { edu_id: $.data.id, edu_v0: $.data.version }
            - call: "POST /api/v1/verifications/${mvr_id}/report"
              payload: { result: "PASS", report_payload: {}, expected_verification_version: "${mvr_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${edu_id}/report"
              payload: { result: "PASS", report_payload: {}, expected_verification_version: "${edu_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${crim_id}/report"
              payload: { result: "FAIL", report_payload: { hits: 1 }, expected_verification_version: "${crim_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
          trigger:
            - call: "POST /api/v1/applications/${app_id}/hire"
              payload: { expected_application_version: "${app_v3}" }
              as: Recruiter
              as_user_id: "rec-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: withdraw_from_submitted_succeeds_to_terminal
        claim_type: valid_transition
        grounds:
          - state_machines.Application.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: "Withdraw is allowed from SUBMITTED and reaches terminal state WITHDRAWN."
        test_recipe:
          setup: ["Application in SUBMITTED state."]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/jurisdictions"
