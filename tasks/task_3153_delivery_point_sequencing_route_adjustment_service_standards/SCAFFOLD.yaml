# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist or is outside the declared parent scope" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body FK reference does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in the required state for the requested transition" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Entity is in a terminal state; no transitions possible" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed format, or non-member enum value" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "Uniqueness violation on facility_code / unit_code / zip11 / employee_id / route_code-per-unit" }
  - { id: ERR_USO_VIOLATION, http: 422, condition: "Operation would strand a deliverable address without a route, or otherwise breach the universal service obligation (e.g., suspending a route with active points)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Adjustment approver equals submitter_user_id" }
  - { id: ERR_CROSS_ENTITY_STATE, http: 409, condition: "A referenced entity is not in the required state (route not STANDARD, evaluation not CONSULTED, COA not VERIFIED, helper INACTIVE)" }
  - { id: ERR_TEMPORAL_WINDOW, http: 422, condition: "Temporal window violated (COA end > begin+364, hold > 30 days, effective_date < approval+7, count start < today+14 or not Saturday, surge flag outside Nov 15 – Jan 2)" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Overlapping window (rule windows, ACTIVE COA per point, hold windows)" }
  - { id: ERR_SEQUENCE_INVALID, http: 422, condition: "Sequence payload not a 1..N permutation, or a referenced point does not belong to / is not eligible for the route" }
  - { id: ERR_SEQUENCE_DUPLICATE_POSITION, http: 409, condition: "Two entries in a sequence replace payload claim the same line_of_travel_order" }
  - { id: ERR_CASE_CAPACITY_EXCEEDED, http: 422, condition: "Computed case slot index exceeds the unit's case_slot_count_per_route" }
  - { id: ERR_RANGE_VIOLATION, http: 422, condition: "Numeric range violated (negative counts, service_days outside 1..7, proposed minutes outside 240..600)" }
  - { id: ERR_OVERRUN_BELOW_THRESHOLD, http: 422, condition: "projected_overrun_minutes < 30 (auxiliary assistance floor) — or vacancy_days < 90 on discontinue" }
  - { id: ERR_NO_SERVICE_RULE, http: 422, condition: "No active/scheduled ServiceStandardRule covers the (origin, dest, mail_class, acceptance_date) tuple" }
  - { id: ERR_RULE_OVERLAP_CONFLICT, http: 409, condition: "Rule selection found more than one covering rule (defensive; creation-time overlap check should prevent)" }
  - { id: ERR_RECOLLECTION_EXHAUSTED, http: 409, condition: "Re-collection loop already used, or consultation outcome not DISPUTED" }
  - { id: ERR_HOLD_ACTIVE, http: 409, condition: "An ACTIVE hold with CARRIER_PICKUP disposition blocks vacancy marking" }
  - { id: ERR_FORWARD_ACTIVE, http: 409, condition: "An ACTIVE forwarding order blocks point discontinuation" }
  - { id: ERR_FORWARD_OVERLAP, http: 409, condition: "Another ACTIVE COA exists for the old address and is not the supersession target" }
  - { id: ERR_HOLD_OVERLAP, http: 409, condition: "Hold window intersects an existing hold for the point (half-open [start, end+1))" }
  - { id: ERR_REOPEN_WINDOW_EXPIRED, http: 422, condition: "Reopen attempted more than 14 days after resolution" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "No credentials presented — the request lacks X-User-Role and/or X-User-ID. Used only by negative tests to assert ERR_UNAUTHENTICATED (401); every endpoint in §1.5 requires a declared role, so Anonymous is authorized for nothing."
    identity: opaque
    exclusive_operations: []
    shared_operations: []

  - name: PlatformAdmin
    description: "District/platform operator; creates units, drives the logical clock, reads everything"
    identity: opaque
    exclusive_operations:
      - "POST /api/delivery-units"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across all resources"

  - name: AddressManagementSpecialist
    description: "AMS clerk maintaining the delivery point file (new construction, occupancy, discontinuation)"
    identity: opaque
    exclusive_operations:
      - "POST /api/delivery-units/{unitId}/delivery-points"
      - "POST /api/delivery-units/{unitId}/delivery-points/{pointId}/activate"
      - "POST /api/delivery-units/{unitId}/delivery-points/{pointId}/mark-occupied"
      - "POST /api/delivery-units/{unitId}/delivery-points/{pointId}/mark-seasonal"
      - "POST /api/delivery-units/{unitId}/delivery-points/{pointId}/discontinue"
    shared_operations:
      - "GET delivery points, units, routes, sequence entries"

  - name: RouteSupervisor
    description: "Delivery operations supervisor; owns sequencing, evaluations, adjustments (as submitter), auxiliary requests, scan compliance review"
    identity: opaque
    exclusive_operations:
      - "POST /api/delivery-units/{unitId}/routes"
      - "POST /api/delivery-units/{unitId}/routes/{routeId}/sequence-entries"
      - "POST /api/delivery-units/{unitId}/routes/{routeId}/evaluations (+ begin-count, submit-counts, record-consultation, close-rejected)"
      - "POST adjustments create / submit / withdraw"
      - "POST auxiliary-assignments create / complete / curtail"
    shared_operations:
      - "GET units, routes, points, carriers, evaluations, adjustments, scan events, scan compliance, facilities, rules, service-standard-queries"
      - "POST /api/service-standard-queries"

  - name: Postmaster
    description: "Installation head; approves adjustments (may not approve own submission — segregation of duties), suspends routes, approves/denies auxiliary, orders re-collection"
    identity: opaque
    exclusive_operations:
      - "POST /api/delivery-units/{unitId}/carriers"
      - "POST /api/delivery-units/{unitId}/routes/{routeId}/suspend"
      - "POST /api/delivery-units/{unitId}/routes/{routeId}/reactivate"
      - "POST adjustments approve / reject"
      - "POST auxiliary-assignments approve / deny"
      - "POST evaluations order-recollection"
    shared_operations:
      - "GET across all resources of the unit"
      - "POST /api/service-standard-queries"

  - name: Carrier
    description: "Letter carrier; entity-backed — X-User-ID equals a Carrier.id; marks vacancy, records scans, completes pickup holds"
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /api/delivery-units/{unitId}/delivery-points/{pointId}/mark-vacant"
      - "POST /api/delivery-units/{unitId}/routes/{routeId}/scan-events"
      - "POST /api/delivery-units/{unitId}/holds/{holdId}/complete-early"
    shared_operations:
      - "GET own carrier record, routes, points, sequence entries, holds"

  - name: CustomerServiceRep
    description: "Retail/CSR window clerk; files COAs, holds, inquiries and works the inquiry queue"
    identity: opaque
    exclusive_operations:
      - "POST /api/delivery-units/{unitId}/coas (+ verify, reject-validation, activate-now, suspend, resume, cancel)"
      - "POST /api/delivery-units/{unitId}/holds (+ cancel)"
      - "POST /api/delivery-units/{unitId}/inquiries (+ begin-investigation, resolve, reopen)"
    shared_operations:
      - "GET units, points, holds, coas, inquiries, scan events"
      - "POST /api/service-standard-queries"

  - name: ServiceStandardsAdmin
    description: "Headquarters service standards administrator; maintains facilities and service standard rules"
    identity: opaque
    exclusive_operations:
      - "POST /api/processing-facilities"
      - "POST /api/processing-facilities/{facilityId}/service-standard-rules"
      - "POST /api/service-standard-rules/{ruleId}/retire"
    shared_operations:
      - "GET facilities, rules, queries"
      - "POST /api/service-standard-queries"
