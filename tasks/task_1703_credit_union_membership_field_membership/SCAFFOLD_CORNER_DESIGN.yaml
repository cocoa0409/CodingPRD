          trigger:
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "WITHDRAWAL", amount_cents: 50001, posted_date: "2026-08-01" }, as: OperationsOfficer, captures: { err: "$.data.error_id" } }
            - { call: "POST /credit-union/share-accounts/${acct1}/transactions", payload: { kind: "WITHDRAWAL", amount_cents: 50000, posted_date: "2026-08-01" }, as: OperationsOfficer, captures: { rb: "$.data.running_balance_cents" } }
          assert:
            - "err == ERR_INSUFFICIENT_FUNDS (422)"
            - "rb == 0 (exact-balance withdrawal allowed)"

      - name: par_value_boundary_on_open_and_withdrawal
        claim_type: violation_to_error
        grounds: [calculations.par_value_guard, "errors[ERR_BELOW_PAR_VALUE]", "errors[ERR_PAR_VALUE_BREACH]"]
        distinguishing_aspect: "Par boundaries are inclusive: opening PRIMARY at exactly 500 succeeds (499 fails); withdrawing down to exactly 500 succeeds (one cent more fails)."
        test_recipe:
          setup: ["charter par 500; member approved 2026-08-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
