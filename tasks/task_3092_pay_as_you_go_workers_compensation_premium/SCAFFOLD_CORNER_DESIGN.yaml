  - section: validations
    instances:

      - name: report_period_outside_policy_term_rejected
        claim_type: Violation → Error
        grounds: ['validations.priority-10', 'errors.ERR_PAYROLL_PERIOD_OVERLAP']
        distinguishing_aspect: "A report whose period starts before the policy effective_date violates the term-containment clause of priority 10 even with zero overlapping reports — the temporal rule covers both overlap and containment."
        test_recipe:
          setup: ["Bound policy effective 2026-09-01."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-OUT-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { cd_out_pol: $.data.id }
            - call: "POST /wc/policies/${cd_out_pol}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${cd_out_pol}", period_start: "2026-08-25T00:00:00Z", period_end: "2026-09-01T00:00:00Z", idempotency_key: "out-run-1", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 100000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
              captures: { cd_out_status: $.data.status, cd_out_fail: $.data.failure_code }
          assert:
            - "report status == REJECTED with failure_code ERR_PAYROLL_PERIOD_OVERLAP (period precedes effective_date)"

      - name: retro_dispute_with_future_effective_from_rejected
        claim_type: Violation → Error
        grounds: ['validations.priority-12', 'errors.ERR_RETRO_WINDOW_INVAL{id}']
        distinguishing_aspect: "Dispute effective_from must lie in [policy.effective_date, now); a future effective_from fails ERR_RETRO_WINDOW_INVALID (422) — temporal validation against the logical clock."
        test_recipe:
          setup: ["Clock 2026-09-01. Bound policy."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-FUT-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
