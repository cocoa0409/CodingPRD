          setup:
            - "Clock 2026-08-01T00:00:00Z then 2026-08-08T00:00:00Z. One store, R-404A, SYS1 (full 60.0, initial 0.0), T1 (repairs), T2 (verifies), EQ1."
            - "Event E1 declared 2026-08-01, repaired by T1 at 2026-08-05T09:00:00Z, INITIAL PASS by T2 at 08-08T10:00, FOLLOWUP PASS by T2 at 08-08T11:00 so E1 is VERIFIED_CLOSED."
