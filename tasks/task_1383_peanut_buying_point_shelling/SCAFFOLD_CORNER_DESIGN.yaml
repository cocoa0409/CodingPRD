              captures: { err: $.data.error_id }
          assert:
            - "BuyingPoint.${bp}.intake_posture == RESTRICTED throughout (free 400)"
            - "Load A weigh 50.0 succeeds (== cap, inclusive); status == WEIGHED"
            - "Load B weigh 50.001: error_id == ERR_RESTRICTED_LOAD_LIMIT, http 409; status remains REPORTED"

