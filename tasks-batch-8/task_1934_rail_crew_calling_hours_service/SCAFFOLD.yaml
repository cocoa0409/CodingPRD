      - "GET /api/jobs"
      - "GET /api/jobs/{id}"
      - "GET /api/jobs/{id}/calls"
      - "GET /api/calls"
      - "GET /api/assignments"
      - "GET /api/assignments/{id}"
      - "GET /api/rest-periods"
      - "GET /api/leave-bids"
      - "GET /api/pay-records"
      - "GET /api/crew-shortages"

