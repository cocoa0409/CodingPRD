# =============================================================================
# PRD Benchmark Seed Tables — Connected Fitness Hardware Delivery, Activation
# & Subscription Entitlement
# =============================================================================

scenario: |
  Connected Fitness Hardware Delivery, Activation & Subscription Entitlement (Peloton):
  hardware order with in-home delivery, assembly and stair-carry surcharges, activation
  linking a device serial to a household membership with concurrent-user limits, membership
  pause, cancellation and reactivation with proration and content lockout, hardware
  financing origination with delinquency handling that must not disable safety functions,
  refurbished device resale with warranty reset, class content scheduling with live and
  on-demand libraries and instructor licensing windows, member metrics and leaderboard
  integrity, service dispatch for hardware faults with parts logistics.

domain_name: connected-fitness-hardware
api_prefix: /fitness

complexity_profile:
  primary_archetype: "Workflow orchestration"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"
    - "Optimistic concurrency"
  entity_topology: flat          # peer aggregates joined by FK links; no nesting in URL paths beyond one parent segment
  state_machine_shape: compound  # Membership aggregate posture is derived from Device / ClassEnrollment children; individual machines are cyclic and parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential           # Device.certifying_device_id → Device.id (RefurbBatch certification lineage)
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: household_name, type: string, source: input, description: "Display name of the household that owns the membership" }
      - { name: billing_email, type: string, source: input, description: "Billing contact email" }
      - { name: plan_tier, type: enum, source: input, description: "PLUS | BUSINESS", constraints: "IN {PLUS, BUSINESS}" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring monthly membership fee in cents" }
      - { name: concurrent_limit_override, type: integer, source: input, required: false, default: null, description: "Per-membership override of the allowed at-once user streams; null means use the plan-tier default" }
      - { name: concurrent_limit_effective, type: integer, source: computed, description: "Resolved stream limit = concurrent_limit_override when non-null else plan-tier default constant" }
      - { name: active_user_count, type: integer, source: computed, default: 0, description: "Count of HouseholdUser rows whose status IN {ACTIVE, PENDING_VERIFICATION}" }
      - { name: billing_cycle_start_at, type: datetime, source: system, description: "Start instant of the current billing cycle; server-stamped at creation and reset on REACTIVATED" }
      - { name: paid_through_at, type: datetime, source: system, description: "Instant through which the membership is paid; billing_cycle_start_at + 30 days" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL → ACTIVE → PAUSED → CANCELLED → REACTIVATED / DELINQUENT / TERMINATED", constraints: "IN {PROVISIONAL, ACTIVE, PAUSED, CANCELLED, REACTIVATED, DELINQUENT, TERMINATED}" }
      - { name: posture, type: enum, source: computed, description: "Derived aggregate gate over all child operations: OPEN | RESTRICTED | FROZEN", constraints: "IN {OPEN, RESTRICTED, FROZEN}" }
      - { name: pause_started_at, type: datetime, source: system, required: false, default: null, description: "Instant the most recent PAUSED window began; null unless status == PAUSED" }
      - { name: accrued_pause_credit_cents, type: integer, source: computed, default: 0, description: "Proration credit banked while paused; consumed by reactivation" }
      - { name: total_streams_observed, type: integer, source: computed, default: 0, description: "Sum of Device.total_workouts for every ACTIVE device linked to this membership" }
      - { name: unpaid_financing_count, type: integer, source: computed, default: 0, description: "Count of FinancingPlan rows on this membership whose status IN {DELINQUENT, DEFAULTED}" }
      - { name: safety_gate_open, type: boolean, source: computed, default: true, description: "True while hardware safety functions remain enabled; MUST remain true for any delinquency or financing state" }
      - { name: attr_frozen_reason, type: enum, source: computed, required: false, default: null, description: "Reason the posture is FROZEN: FINANCING_DEFAULT | OWNERSHIP_DISPUTE | null", constraints: "IN {FINANCING_DEFAULT, OWNERSHIP_DISPUTE, null}" }

  # ---------------------------------------------------------------------------
  - name: HouseholdUser
    parent: Membership
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; the household this user streams under" }
      - { name: display_name, type: string, source: input, description: "Person label shown on the leaderboard" }
      - { name: email, type: string, source: input, description: "Unique email of the household user" }
      - { name: role, type: enum, source: input, default: "MEMBER", description: "OWNER | MEMBER. Exactly one OWNER may exist per membership", constraints: "IN {OWNER, MEMBER}" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION → ACTIVE → SUSPENDED → REMOVED", constraints: "IN {PENDING_VERIFICATION, ACTIVE, SUSPENDED, REMOVED}" }
      - { name: streaming_device_serial, type: string, source: input, required: false, default: null, description: "FK -> Device.id; serial of the device this user is currently streaming on; null when not streaming" }
      - { name: suspended_reason, type: enum, source: system, required: false, default: null, description: "EVICTED_BY_CONCURRENCY | MEMBERSHIP_CANCELLED | REACTIVATION_UNPAID | null", constraints: "IN {EVICTED_BY_CONCURRENCY, MEMBERSHIP_CANCELLED, REACTIVATION_UNPAID, null}" }
      - { name: verification_token, type: string, source: system, description: "Server-issued token returned at creation and consumed by the verify endpoint" }
      - { name: verified, type: boolean, source: computed, default: false, description: "True once the verification token has been consumed" }
      - { name: eviction_count, type: integer, source: computed, default: 0, description: "Number of times this user has been evicted by the concurrency limit" }

  # ---------------------------------------------------------------------------
  - name: Device
    parent: Membership
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; owning membership, null while the device is UNASSIGNED" }
      - { name: hardware_sku, type: enum, source: input, description: "BIKE | TREAD | ROWER | REFURB_BIKE | REFURB_TREAD. REFURB_* SKUs are only legal on a resale-originated device", constraints: "IN {BIKE, TREAD, ROWER, REFURB_BIKE, REFURB_TREAD}" }
      - { name: serial, type: string, source: input, description: "Manufacturing serial; globally unique across all devices" }
      - { name: condition, type: enum, source: system, default: "NEW", description: "NEW | REFURBISHED", constraints: "IN {NEW, REFURBISHED}" }
      - { name: certifying_device_id, type: string, source: input, required: false, default: null, description: "FK -> Device.id; self-referential link to the device that was returned to seed this refurbished unit" }
      - { name: provenance_source, type: enum, source: system, required: false, default: null, description: "NEW_SALE | RESALE; set by whichever fulfilment path activated the device", constraints: "IN {NEW_SALE, RESALE, null}" }
      - { name: activation_status, type: enum, source: system, description: "UNASSIGNED → DELIVERED → LINKED → ACTIVE → LOCKED / DECOMMISSIONED", constraints: "IN {UNASSIGNED, DELIVERED, LINKED, ACTIVE, LOCKED, DECOMMISSIONED}" }
      - { name: entitlement_lock, type: boolean, source: computed, default: false, description: "True while content is locked out for this device; gates content_access_allowed" }
      - { name: activated_at, type: datetime, source: system, required: false, default: null, description: "Instant the serial was linked to the membership" }
      - { name: warranty_expires_at, type: datetime, source: system, required: false, default: null, description: "Warranty expiry instant; NEW = delivered_at + 365 days, RESALE = resale paid_through_at + 90 days" }
      - { name: resale_cycle_count, type: integer, source: computed, default: 0, description: "Number of completed refurbishment cycles; each RESALE provenance activation resets this to 1" }
      - { name: total_workouts, type: integer, source: computed, default: 0, description: "Count of COMPLETED ClassEnrollment rows on this device" }
      - { name: content_access_allowed, type: boolean, source: computed, description: "Derived entitlement = membership.posture IN {OPEN, RESTRICTED} AND entitlement_lock == false. UI affordance only; never gates safety or service records" }

  # ---------------------------------------------------------------------------
  - name: HardwareOrder
    parent: Membership
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; ordering household" }
      - { name: hardware_sku, type: enum, source: input, description: "SKU ordered; must equal the SKU of the device eventually delivered", constraints: "IN {BIKE, TREAD, ROWER, REFURB_BIKE, REFURB_TREAD}" }
      - { name: subtotal_cents, type: integer, source: input, description: "Hardware price before delivery, assembly and finance charges" }
      - { name: quote_total_cents, type: integer, source: computed, default: 0, description: "Provisional total produced by the forward_looking variant at order creation; superseded by captured_total_cents" }
      - { name: captured_total_cents, type: integer, source: computed, required: false, default: null, description: "Final total produced by the chronological variant at ordering cutoff; null until capture" }
      - { name: delivery_fee_cents, type: integer, source: computed, default: 0, description: "Delivery legs × zone base rate BEFORE the stair-carry surcharge" }
      - { name: stair_carry_fee_cents, type: integer, source: computed, default: 0, description: "Stair-carry surcharge, computed on the hardware subtotal basis (AS-DESIGNED ships 0 — see DeliveryAppointment adjudication)" }
      - { name: assembly_fee_cents, type: integer, source: computed, default: 0, description: "Assembly labor, computed on the hardware subtotal basis (AS-DESIGNED ships 0)" }
      - { name: finance_charge_cents, type: integer, source: computed, default: 0, description: "Interest component of the FINANCE_SCHEDULED financing plan; 0 when financing_method == FULL_PAYMENT" }
      - { name: financing_method, type: enum, source: input, default: "FULL_PAYMENT", description: "FULL_PAYMENT | FINANCE_SCHEDULED", constraints: "IN {FULL_PAYMENT, FINANCE_SCHEDULED}" }
      - { name: status, type: enum, source: system, description: "PLACED → DELIVERY_SCHEDULED → DELIVERED → ACTIVATED / CANCELLED", constraints: "IN {PLACED, DELIVERY_SCHEDULED, DELIVERED, ACTIVATED, CANCELLED}" }
      - { name: refund_dispute_status, type: enum, source: system, default: "NONE", description: "NONE | FILED | DENIED | APPROVED; a redemptive credit is only issuable while this is not DENIED", constraints: "IN {NONE, FILED, DENIED, APPROVED}" }
      - { name: device_id, type: string, source: system, required: false, default: null, description: "FK -> Device.id; the unit purchased by this order, bound when a delivery appointment is created for it" }
      - { name: return_device_id, type: string, source: system, required: false, default: null, description: "FK -> Device.id; the device handed back by the customer during the delivery that produced this order (trade-in)" }

  # ---------------------------------------------------------------------------
  - name: DeliveryAppointment
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; the physical unit being installed" }
      - { name: hardware_order_id, type: string, source: input, description: "FK -> HardwareOrder.id; the hardware order this installation fulfils" }
      - { name: start_at, type: datetime, source: input, description: "Start of the installation window (half-open interval start)" }
      - { name: end_at, type: datetime, source: input, description: "End of the installation window (half-open interval end)" }
      - { name: zone, type: enum, source: input, description: "METRO | SUBURBAN | RURAL; drives the per-leg base delivery rate", constraints: "IN {METRO, SUBURBAN, RURAL}" }
      - { name: stair_flights, type: integer, source: input, default: 0, description: "Number of stair flights the crew must carry the unit up" }
      - { name: has_elevator, type: boolean, source: input, default: false, description: "Whether the building has a working elevator, which relaxes the stair surcharge threshold" }
      - { name: delivery_legs, type: integer, source: computed, default: 1, description: "Delivery legs, derived from zone: METRO=1, SUBURBAN=2, RURAL=3" }
      - { name: technician_crew_code, type: string, source: input, description: "Crew assigned; two half-open windows for the same crew may not overlap" }
      - { name: status, type: enum, source: system, description: "REQUESTED → SCHEDULED → IN_PROGRESS → COMPLETED / FAILED / CANCELLED", constraints: "IN {REQUESTED, SCHEDULED, IN_PROGRESS, COMPLETED, FAILED, CANCELLED}" }
      - { name: reschedule_count, type: integer, source: computed, default: 0, description: "Completed reschedules; fifth reschedule is rejected" }
      - { name: completion_grade, type: enum, source: system, required: false, default: null, description: "CLEAN | DAMAGED recorded at completion; DAMAGED spawns a warranty return", constraints: "IN {CLEAN, DAMAGED, null}" }

  # ---------------------------------------------------------------------------
  - name: FinancingPlan
    parent: Membership
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: system, description: "FK -> Membership.id; household carrying the installment obligation" }
      - { name: order_id, type: string, source: input, description: "FK -> HardwareOrder.id; the financed hardware order" }
      - { name: principal_cents, type: integer, source: input, description: "Amount financed" }
      - { name: term_months, type: integer, source: input, description: "Installment count; 6, 12 or 24" }
      - { name: apr_bps, type: integer, source: input, description: "Annual percentage rate in basis points; 0 means a promotional interest-free plan" }
      - { name: monthly_installment_cents, type: integer, source: computed, default: 0, description: "first installment = ceil((principal_cents × (10000 + apr_bps)) / (10000 × term_months)); remaining installments = floor of the same quotient" }
      - { name: installments_paid, type: integer, source: computed, default: 0, description: "Count of SUCCEEDED installments" }
      - { name: installments_late, type: integer, source: computed, default: 0, description: "Count of installments that failed and were later retried successfully" }
      - { name: retry_count, type: integer, source: computed, default: 0, description: "Installment failure retries attempted in the current delinquency episode" }
      - { name: status, type: enum, source: system, description: "ORIGINATED → CURRENT → DELINQUENT → DEFAULTED / PAID_OFF", constraints: "IN {ORIGINATED, CURRENT, DELINQUENT, DEFAULTED, PAID_OFF}" }
      - { name: delinquency_count, type: integer, source: computed, default: 0, description: "Number of times the plan has crossed into DELINQUENT" }
      - { name: safety_disable_latched, type: boolean, source: system, default: false, description: "Reserved safety latch; MUST remain false for every financing state — delinquency never flips it" }

  # ---------------------------------------------------------------------------
  - name: ServiceOrder
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; the faulty unit" }
      - { name: order_id, type: string, source: system, required: false, default: null, description: "FK -> HardwareOrder.id; originating hardware order, when the fault traces back to a delivery" }
      - { name: reported_fault_code, type: enum, source: input, description: "NO_POWER | BELT_SLIP | SENSOR_FAULT | SOFTWARE_CRASH | FRAME_CRACK", constraints: "IN {NO_POWER, BELT_SLIP, SENSOR_FAULT, SOFTWARE_CRASH, FRAME_CRACK}" }
      - { name: fault_class, type: enum, source: computed, description: "SAFETY_CRITICAL when reported_fault_code IN {NO_POWER, FRAME_CRACK} else COSMETIC", constraints: "IN {SAFETY_CRITICAL, COSMETIC}" }
      - { name: priority, type: enum, source: computed, description: "SAFETY_CRITICAL → PRIORITY_SAFETY, FRAME_CRACK during an active warranty → PRIORITY_WARRANTY, else PRIORITY_STANDARD", constraints: "IN {PRIORITY_SAFETY, PRIORITY_WARRANTY, PRIORITY_STANDARD}" }
      - { name: status, type: enum, source: system, description: "DISPATCHED → DISPATCH_PENDING_PART → PART_RESERVED → SCHEDULED → REPAIR_IN_PROGRESS → RESOLVED / CANCELLED", constraints: "IN {DISPATCHED, DISPATCH_PENDING_PART, PART_RESERVED, SCHEDULED, REPAIR_IN_PROGRESS, RESOLVED, CANCELLED}" }
      - { name: part_id, type: string, source: system, required: false, default: null, description: "FK -> PartsInventory.id; reserved replacement part" }
      - { name: reserved_part_qty, type: integer, source: computed, default: 0, description: "Quantity of the reserved part held against this order" }
      - { name: diagnosis_note, type: string, source: input, required: false, default: null, description: "Free-text technician diagnosis" }
      - { name: resolved_at, type: datetime, source: system, required: false, default: null, description: "Instant the repair was signed off" }
      - { name: failure_before_part, type: boolean, source: system, default: false, description: "Latched true when a repair attempt failed while no part was reserved" }
      - { name: safety_functions_maintained, type: boolean, source: computed, default: true, description: "Always true: service dispatch and financing delinquency never disable hardware safety functions" }

  # ---------------------------------------------------------------------------
  - name: PartsInventory
    parent: null
    common_fields: true
    fields:
      - { name: part_code, type: string, source: input, description: "Unique part code, e.g. TREAD-BELT-42" }
      - { name: compatible_sku, type: enum, source: input, description: "Hardware SKU this part fits; reservations against a non-matching device are rejected", constraints: "IN {BIKE, TREAD, ROWER, REFURB_BIKE, REFURB_TREAD}" }
      - { name: on_hand_qty, type: integer, source: computed, default: 0, description: "Stock on hand = stock_received_qty - reserved_qty - consumed_qty" }
      - { name: stock_received_qty, type: integer, source: computed, default: 0, description: "Cumulative units received via the restock endpoint" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Units held against open ServiceOrder rows" }
      - { name: consumed_qty, type: integer, source: computed, default: 0, description: "Units installed by completed repairs" }
      - { name: safety_stock_qty, type: integer, source: input, default: 2, description: "Reservations are rejected when on_hand_qty minus safety_stock_qty would fall below zero" }
      - { name: part_lot_key, type: string, source: input, description: "Lot identifier; documented shipping tie-break is part_lot_key ASC then created_at ASC" }

  # ---------------------------------------------------------------------------
  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Class title" }
      - { name: instructor_name, type: string, source: input, description: "Instructor who owns the licensing window" }
      - { name: discipline, type: enum, source: input, description: "CYCLING | RUNNING | STRENGTH | YOGA", constraints: "IN {CYCLING, RUNNING, STRENGTH, YOGA}" }
      - { name: delivery_mode, type: enum, source: input, description: "LIVE | ON_DEMAND", constraints: "IN {LIVE, ON_DEMAND}" }
      - { name: starts_at, type: datetime, source: input, description: "Session start; half-open on-demand availability window begins here" }
      - { name: ends_at, type: datetime, source: input, description: "Session end; for LIVE the stream stops here, for ON_DEMAND the library window closes 24 hours after this instant" }
      - { name: capacity, type: integer, source: input, default: 100, description: "Maximum at-once enrollments for a LIVE session" }
      - { name: license_starts_at, type: datetime, source: input, description: "Instructor licensing window start; must precede starts_at" }
      - { name: license_ends_at, type: datetime, source: input, description: "Instructor licensing window end; a LIVE session must end within it, an ON_DEMAND library window is clamped to it" }
      - { name: scheduled_status, type: enum, source: system, description: "DRAFT → PUBLISHED → STREAMING → ARCHIVED / CANCELLED", constraints: "IN {DRAFT, PUBLISHED, STREAMING, ARCHIVED, CANCELLED}" }
      - { name: live_enrollment_count, type: integer, source: computed, default: 0, description: "Count of enroller_class_session_id rows whose enrollment_status IN {ENROLLED, WAITLISTED}" }
      - { name: on_demand_window_ends_at, type: datetime, source: computed, required: false, default: null, description: "min(ends_at + 24h, license_ends_at); null for LIVE sessions" }

  # ---------------------------------------------------------------------------
  - name: ClassEnrollment
    parent: ClassSession
    common_fields: true
    fields:
      - { name: class_session_id, type: string, source: system, description: "FK -> ClassSession.id; the class being taken" }
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; the unit the workout ran on" }
      - { name: enroller_user_id, type: string, source: system, description: "FK -> HouseholdUser.id; the person who took the class" }
      - { name: enrolled_at, type: datetime, source: system, description: "Instant the enrollment was created; primary ordering key for waitlist promotion" }
      - { name: status, type: enum, source: system, description: "ENROLLED → COMPLETED / DROPPED / EXPIRED; ENROLLED → WAITLISTED → ENROLLED / EXPIRED", constraints: "IN {ENROLLED, WAITLISTED, COMPLETED, DROPPED, EXPIRED}" }
      - { name: output_points, type: integer, source: input, required: false, default: 0, description: "Raw points recorded at completion, before integrity cap" }
      - { name: integrity_points, type: integer, source: computed, default: 0, description: "Points after leaderboard integrity cap; 0 when the completion is flagged for integrity review" }
      - { name: integrity_flagged, type: boolean, source: computed, default: false, description: "True when the session earned more points than the discipline ceiling implies" }
      - { name: completion_pct, type: integer, source: input, required: false, default: 0, description: "Percentage of the class the member completed" }
      - { name: completion_grade, type: enum, source: computed, required: false, default: null, description: "FULL_CREDIT when completion_pct >= 80 else PARTIAL_CREDIT; null while not COMPLETED", constraints: "IN {FULL_CREDIT, PARTIAL_CREDIT, null}" }

  # ---------------------------------------------------------------------------
  - name: RefurbBatch
    parent: Device
    common_fields: true
    fields:
      - { name: source_device_id, type: string, source: system, description: "FK -> Device.id; the returned unit being refurbished" }
      - { name: performance_resale_enabled, type: boolean, source: input, default: false, description: "Batch-configuration flag: when false a resale activation is forced to the ROWER downgrade SKU" }
      - { name: certification_grade, type: enum, source: input, description: "A | B | C; grade B and below forces performance_resale_enabled to false", constraints: "IN {A, B, C}" }
      - { name: inspected_at, type: datetime, source: system, description: "Server-stamped inspection instant used for interval checks" }
      - { name: status, type: enum, source: system, description: "INSPECTING → CERTIFIED → LISTED → SOLD", constraints: "IN {INSPECTING, CERTIFIED, LISTED, SOLD}" }
      - { name: sold_device_id, type: string, source: system, required: false, default: null, description: "FK -> Device.id; the refurbished unit minted when this batch was sold; null until SOLD" }
      - { name: certification_chain_depth, type: integer, source: computed, default: 0, description: "Length of the self-referential certification lineage from source_device_id; capped at 3" }
      - { name: resale_price_cents, type: integer, source: computed, required: false, default: null, description: "List price of the refurbished unit; set when the batch is certified" }
      - { name: library_availability, type: enum, source: computed, default: "AVAILABLE", description: "AVAILABLE while the batch is INSPECTING, CERTIFIED or LISTED; UNAVAILABLE once a terminal state of the source device makes the batch un-listable", constraints: "IN {AVAILABLE, UNAVAILABLE}" }
# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Membership — cyclic (CANCELLED → REACTIVATED → ACTIVE is a revision loop back
  # into the live lifecycle) and compound (posture is re-derived from children).
  # ---------------------------------------------------------------------------
  - entity: Membership
    initial_state: PROVISIONAL
    terminal_states: [TERMINATED]
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "POST /memberships/{membershipId}/activate"
        actor: MembershipOwner
        preconditions:
          - "Membership.status == PROVISIONAL (a second sequential activate observes status == ACTIVE and is rejected by this same clause)"
          - "Membership.active_user_count >= 1 (at least one HouseholdUser whose status IN {ACTIVE, PENDING_VERIFICATION})"
          - "At least one Device whose membership_id == membership.id has activation_status IN {LINKED, ACTIVE} (an activation requires a linked device)"
        side_effects:
          - "Membership.posture recomputed by calculation posture_resolution (this membership) → OPEN"
          - "Membership.billing_cycle_start_at = current logical clock; Membership.paid_through_at = billing_cycle_start_at + 30 days"
          - "Every Device on this membership with activation_status == LINKED → ACTIVE and each device.entitlement_lock = false"
          - "Every HouseholdUser on this membership with status == PENDING_VERIFICATION is left untouched (verification is a separate request)"
          - "Membership.version incremented by 1"

      - from: ACTIVE
        to: PAUSED
        trigger: "POST /memberships/{membershipId}/pause"
        actor: MembershipOwner
        preconditions:
          - "Membership.status == ACTIVE"
          - "Membership.unpaid_financing_count == 0 (a household with a DELINQUENT or DEFAULTED plan may not pause)"
          - "Requested pause_end_at > pause_start_at and requested pause_end_at - pause_start_at <= 60 days"
        side_effects:
          - "Membership.pause_started_at = current logical clock"
          - "Membership.accrued_pause_credit_cents = pause_proration calculation (UNUSED_DAYS variant using current logical clock)"
          - "Membership.posture recomputed by calculation posture_resolution → RESTRICTED"
          - "Every Device on this membership with activation_status == ACTIVE → LOCKED and each device.entitlement_lock = true"
          - "Membership.version incremented by 1"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /memberships/{membershipId}/resume"
        actor: MembershipOwner
        preconditions:
          - "Membership.status == PAUSED"
          - "Membership.unpaid_financing_count == 0"
          - "Membership.active_user_count >= 1"
        side_effects:
          - "Membership.pause_started_at = null"
          - "Membership.paid_through_at = paid_through_at + accrued_pause_credit_cents converted to days at the CANCELLATION constant (floor(credit_cents / monthly_fee_cents * 30))"
          - "Membership.accrued_pause_credit_cents = 0"
          - "Membership.posture recomputed by calculation posture_resolution → OPEN"
          - "Every Device on this membership with activation_status == LOCKED → ACTIVE and each device.entitlement_lock = false"
          - "Membership.version incremented by 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /memberships/{membershipId}/cancel"
        actor: MembershipOwner
        preconditions:
          - "Membership.status == ACTIVE"
        side_effects:
          - "Membership.accrued_pause_credit_cents = pause_proration calculation (REMAINING_DAYS variant) — unused-days refund for the current cycle"
          - "Membership.posture recomputed by calculation posture_resolution → FROZEN with attr_frozen_reason = null (posture FROZEN because status == CANCELLED)"
          - "Every Device on this membership with activation_status IN {ACTIVE, LINKED, DELIVERED} → LOCKED and each device.entitlement_lock = true"
          - "Every HouseholdUser on this membership with status IN {ACTIVE, PENDING_VERIFICATION} → SUSPENDED with suspended_reason = MEMBERSHIP_CANCELLED"
          - "Membership.version incremented by 1"

      - from: PAUSED
        to: CANCELLED
        trigger: "POST /memberships/{membershipId}/cancel"
        actor: MembershipOwner
        preconditions:
          - "Membership.status == PAUSED"
        side_effects:
          - "Membership.accrued_pause_credit_cents = pause_proration calculation (UNUSED_DAYS variant) — the accrued pause credit is preserved, not recomputed on the remaining-days basis"
          - "Membership.posture recomputed → FROZEN"
          - "Every Device on this membership with activation_status == LOCKED stays LOCKED and each device.entitlement_lock remains true"
          - "Every HouseholdUser on this membership with status IN {ACTIVE, PENDING_VERIFICATION} → SUSPENDED with suspended_reason = MEMBERSHIP_CANCELLED"
          - "Membership.version incremented by 1"

      - from: CANCELLED
        to: REACTIVATED
        trigger: "POST /memberships/{membershipId}/reactivate"
        actor: MembershipOwner
        preconditions:
          - "Membership.status == CANCELLED"
          - "Membership.unpaid_financing_count == 0 (reactivation is refused while any plan is DELINQUENT or DEFAULTED)"
          - "Membership.active_user_count >= 1 after unsuspension (at least one HouseholdUser whose status IN {ACTIVE, PENDING_VERIFICATION})"
        side_effects:
          - "Membership.billing_cycle_start_at = current logical clock; Membership.paid_through_at = billing_cycle_start_at + 30 days"
          - "Membership.accrued_pause_credit_cents = 0 (any previously banked pause credit is consumed by reactivation)"
          - "Membership.posture recomputed by calculation posture_resolution → OPEN"
          - "Every Device on this membership with activation_status == LOCKED → ACTIVE and each device.entitlement_lock = false"
          - "Every HouseholdUser on this membership with status == SUSPENDED and suspended_reason == MEMBERSHIP_CANCELLED → ACTIVE and suspended_reason = null"
          - "Membership.version incremented by 1"

      - from: REACTIVATED
        to: ACTIVE
        trigger: "system (automatic; reactivation settles into the normal live lifecycle)"
        actor: system
        preconditions:
          - "Membership.status == REACTIVATED"
        side_effects:
          - "Membership.posture recomputed by calculation posture_resolution → OPEN"
          - "Membership.version incremented by 1"

      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /financing-plans/{planId}/installments/fail"
        actor: system
        preconditions:
          - "Membership.status IN {ACTIVE, REACTIVATED, PAUSED, DELINQUENT}"
          - "The failing FinancingPlan has membership_id == membership.id and currently 2 prior failed-then-retried installments in this episode"
        side_effects:
          - "Membership.unpaid_financing_count recomputed by calculation financing_delinquency_state (this membership) → 1"
          - "Membership.posture recomputed by calculation posture_resolution → RESTRICTED (financing delinquency restricts NEW hardware purchases but never hardware safety functions)"
          - "Membership.safety_gate_open remains true (delinquency MUST NOT disable safety functions)"
          - "Membership.version incremented by 1"

      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /financing-plans/{planId}/installments/pay"
        actor: MembershipOwner
        preconditions:
          - "Membership.status == DELINQUENT"
          - "FinancingPlan.status IN {DELINQUENT, DEFAULTED} and plan.membership_id == membership.id"
        side_effects:
          - "Membership.unpaid_financing_count recomputed by calculation financing_delinquency_state → 0"
          - "Membership.posture recomputed → OPEN"
          - "Membership.version incremented by 1"

      - from: CANCELLED
        to: TERMINATED
        trigger: "system (automatic; a cancelled membership terminates 180 days after cancellation when billing_cycle_start_at is more than 180 days stale)"
        actor: system
        preconditions:
          - "Membership.status == CANCELLED"
          - "current logical clock - Membership.billing_cycle_start_at > 180 days"
        side_effects:
          - "Every Device on this membership → DECOMMISSIONED and each device.activation_status = DECOMMISSIONED"
          - "Every HouseholdUser on this membership with status == SUSPENDED → REMOVED"
          - "Membership.posture recomputed → FROZEN"

  # ---------------------------------------------------------------------------
  # HouseholdUser — linear with a re-entry edge from SUSPENDED back to ACTIVE.
  # ---------------------------------------------------------------------------
  - entity: HouseholdUser
    initial_state: PENDING_VERIFICATION
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /household-users/{userId}/verify"
        actor: MembershipOwner
        preconditions:
          - "HouseholdUser.status == PENDING_VERIFICATION"
          - "HouseholdUser.verified == false"
          - "Requested verification_token equals HouseholdUser.verification_token"
        side_effects:
          - "HouseholdUser.verified = true"
          - "Parent Membership.active_user_count recomputed by calculation concurrent_stream_limit"
          - "Parent Membership.posture recomputed by calculation posture_resolution"
          - "HouseholdUser.version incremented by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /memberships/{membershipId}/cancel"
        actor: MembershipOwner
        preconditions:
          - "Parent Membership.status == ACTIVE or PAUSED"
        side_effects:
          - "HouseholdUser.suspended_reason = MEMBERSHIP_CANCELLED"
          - "HouseholdUser.streaming_device_serial = null"
          - "Parent Membership.active_user_count recomputed"
          - "Parent Membership.posture recomputed"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (concurrency eviction during POST /household-users/{userId}/start-stream)"
        actor: system
        preconditions:
          - "Membership.active_user_count + 1 > Membership.concurrent_limit_effective"
          - "An eviction candidate HouseholdUser exists on the same membership with role == MEMBER and status == ACTIVE (the OWNER is never evicted)"
        side_effects:
          - "Evicted HouseholdUser.status → SUSPENDED with suspended_reason = EVICTED_BY_CONCURRENCY and streaming_device_serial = null"
          - "Evicted HouseholdUser.eviction_count incremented by 1"
          - "The requesting HouseholdUser.streaming_device_serial = requested device serial and status stays ACTIVE"
          - "Membership.active_user_count recomputed by calculation concurrent_stream_limit"
          - "Membership.version incremented by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /memberships/{membershipId}/reactivate"
        actor: MembershipOwner
        preconditions:
          - "Parent Membership.status == CANCELLED"
          - "HouseholdUser.suspended_reason == MEMBERSHIP_CANCELLED"
        side_effects:
          - "HouseholdUser.suspended_reason = null"
          - "Parent Membership.active_user_count recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /household-users/{userId}/unsuspend"
        actor: MembershipOwner
        preconditions:
          - "HouseholdUser.suspended_reason == EVICTED_BY_CONCURRENCY"
          - "Membership.active_user_count + 1 <= Membership.concurrent_limit_effective (the unsuspend request itself is refused with ERR_CONCURRENT_LIMIT_EXCEEDED when it would breach the limit)"
        side_effects:
          - "HouseholdUser.suspended_reason = null"
          - "Membership.active_user_count recomputed by calculation concurrent_stream_limit"

  # ---------------------------------------------------------------------------
  # Device — parallel state dimensions on a single row:
  #   activation_status (UNASSIGNED → DELIVERED → LINKED → ACTIVE → LOCKED → DECOMMISSIONED)
  #   x entitlement_lock (boolean dimension toggled independently by cascade)
  # ---------------------------------------------------------------------------
  - entity: Device
    initial_state: UNASSIGNED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: UNASSIGNED
        to: DELIVERED
        trigger: "POST /delivery-appointments/{appointmentId}/complete"
        actor: ServiceTechnician
        preconditions:
          - "DeliveryAppointment.status == IN_PROGRESS"
          - "DeliveryAppointment.device_id == device.id"
          - "The appointment's device.membership_id is non-null (a device may only be delivered against an owned membership)"
        side_effects:
          - "Device.provenance_source = NEW_SALE"
          - "Device.activated_at = current logical clock"
          - "Device.warranty_expires_at = current logical clock + 365 days"
          - "Parent HardwareOrder.status recomputed from children (this order → DELIVERED)"
          - "Device.version incremented by 1"

      - from: DELIVERED
        to: LINKED
        trigger: "POST /devices/{deviceId}/link"
        actor: ServiceTechnician
        preconditions:
          - "Device.activation_status == DELIVERED"
          - "Requested serial equals Device.serial"
          - "Parent Membership.status IN {PROVISIONAL, ACTIVE, REACTIVATED}"
        side_effects:
          - "Device.membership_id = requested membership id"
          - "Device.activated_at = current logical clock"
          - "Every HouseholdUser on the same membership with status == PENDING_VERIFICATION is left untouched"
          - "Membership.posture recomputed by calculation posture_resolution"
          - "Device.version incremented by 1"

      - from: LINKED
        to: ACTIVE
        trigger: "POST /memberships/{membershipId}/activate"
        actor: MembershipOwner
        preconditions:
          - "Parent Membership.status == PROVISIONAL"
          - "Device.membership_id == membership.id"
        side_effects:
          - "Device.entitlement_lock = false"
          - "Device.content_access_allowed recomputed"
          - "Device.version incremented by 1"

      - from: ACTIVE
        to: LOCKED
        trigger: "POST /memberships/{membershipId}/pause or POST /memberships/{membershipId}/cancel"
        actor: MembershipOwner
        preconditions:
          - "Parent Membership.status IN {PAUSED, CANCELLED}"
        side_effects:
          - "Device.entitlement_lock = true"
          - "Device.content_access_allowed recomputed → false"
          - "Device.version incremented by 1"

      - from: LOCKED
        to: ACTIVE
        trigger: "POST /memberships/{membershipId}/resume or POST /memberships/{membershipId}/reactivate"
        actor: MembershipOwner
        preconditions:
          - "Parent Membership.status IN {ACTIVE, REACTIVATED}"
        side_effects:
          - "Device.entitlement_lock = false"
          - "Device.content_access_allowed recomputed → true"
          - "Device.version incremented by 1"

      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "system (automatic when the parent Membership reaches TERMINATED)"
        actor: system
        preconditions:
          - "Parent Membership.status == TERMINATED"
        side_effects:
          - "Device.entitlement_lock = true"
          - "Device.content_access_allowed recomputed → false"
          - "Device.total_workouts frozen at its current value"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /refurb-batches (resale activation minting a refurbished unit) and POST /devices/{deviceId}/warranty-reset"
        actor: ServiceTechnician
        preconditions:
          - "Device.activation_status == ACTIVE"
          - "Device.provenance_source == RESALE (a NEW_SALE device may not take a resale warranty reset)"
        side_effects:
          - "Device.warranty_expires_at = current logical clock + 90 days"
          - "Device.resale_cycle_count = 1"
          - "Device.content_access_allowed recomputed from the parent posture"
          - "Device.version incremented by 1"

  # ---------------------------------------------------------------------------
  # HardwareOrder — linear pipeline with a revert edge (DELIVERED → CANCELLED)
  # ---------------------------------------------------------------------------
  - entity: HardwareOrder
    initial_state: PLACED
    terminal_states: [ACTIVATED, CANCELLED]
    transitions:
      - from: PLACED
        to: DELIVERY_SCHEDULED
        trigger: "POST /delivery-appointments"
        actor: ServiceTechnician
        preconditions:
          - "HardwareOrder.status == PLACED"
          - "The creating path supplies hardware_order_id for this order"
        side_effects:
          - "HardwareOrder.status = DELIVERY_SCHEDULED"
          - "DeliveryAppointment.status = REQUESTED"
          - "HardwareOrder.version incremented by 1"

      - from: DELIVERY_SCHEDULED
        to: DELIVERED
        trigger: "POST /delivery-appointments/{appointmentId}/complete"
        actor: ServiceTechnician
        preconditions:
          - "DeliveryAppointment.status == IN_PROGRESS"
          - "HardwareOrder.return_device_id is either null or references a Device with activation_status IN {ACTIVE, LOCKED} (a trade-in must be a live unit)"
        side_effects:
          - "HardwareOrder.delivery_fee_cents = delivery_charge calculation (base legs, this order)"
          - "HardwareOrder.captured_total_cents = order_totals calculation (CHRONOLOGICAL variant, this order)"
          - "HardwareOrder.finance_charge_cents = max(0, captured_total_cents - subtotal_cents - delivery_fee_cents)"
          - "If DeliveryAppointment.completion_grade == DAMAGED then a ServiceOrder with reported_fault_code = FRAME_CRACK is created against the delivered device"
          - "HardwareOrder.version incremented by 1"

      - from: DELIVERED
        to: ACTIVATED
        trigger: "POST /devices/{deviceId}/link followed by POST /memberships/{membershipId}/activate"
        actor: MembershipOwner
        preconditions:
          - "The order's device.membership_id == order.membership_id"
          - "Device.activation_status IN {LINKED, ACTIVE}"
          - "HardwareOrder.financing_method == FULL_PAYMENT OR a FinancingPlan with order_id == order.id exists in status IN {ORIGINATED, CURRENT, DELINQUENT}"
        side_effects:
          - "HardwareOrder.status = ACTIVATED"
          - "HardwareOrder.version incremented by 1"

      - from: DELIVERED
        to: CANCELLED
        trigger: "POST /hardware-orders/{orderId}/cancel"
        actor: MembershipOwner
        preconditions:
          - "HardwareOrder.status == DELIVERED"
          - "HardwareOrder.financing_method == FULL_PAYMENT (a financed order may not be cancelled after delivery)"
        side_effects:
          - "HardwareOrder.status = CANCELLED"
          - "An attached FinancingPlan with status == ORIGINATED (no installments paid) → DEFAULTED and plan.safety_disable_latched remains false"
          - "HardwareOrder.version incremented by 1"

      - from: PLACED
        to: CANCELLED
        trigger: "POST /hardware-orders/{orderId}/cancel"
        actor: MembershipOwner
        preconditions:
          - "HardwareOrder.status == PLACED"
        side_effects:
          - "HardwareOrder.status = CANCELLED"
          - "Any DeliveryAppointment on this order's device with status IN {REQUESTED, SCHEDULED} → CANCELLED"
          - "HardwareOrder.version incremented by 1"

  # ---------------------------------------------------------------------------
  # DeliveryAppointment — branching (schedules fork to COMPLETED or FAILED, and
  # FAILED re-enters scheduling: a cyclic revert) with one special failure that
  # must NOT mutate the parent order.
  # ---------------------------------------------------------------------------
  - entity: DeliveryAppointment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /delivery-appointments/{appointmentId}/schedule"
        actor: ServiceTechnician
        preconditions:
          - "DeliveryAppointment.status == REQUESTED"
          - "start_at < end_at"
          - "The half-open window [start_at, end_at) does not overlap any other DeliveryAppointment whose technician_crew_code == this appointment's crew and whose status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "DeliveryAppointment.status = SCHEDULED"
          - "DeliveryAppointment.version incremented by 1"

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /delivery-appointments/{appointmentId}/start"
        actor: ServiceTechnician
        preconditions:
          - "DeliveryAppointment.status == SCHEDULED"
          - "current logical clock >= DeliveryAppointment.start_at"
        side_effects:
          - "DeliveryAppointment.status = IN_PROGRESS"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /delivery-appointments/{appointmentId}/complete"
        actor: ServiceTechnician
        preconditions:
          - "DeliveryAppointment.status == IN_PROGRESS"
          - "stair_flights <= 5 OR has_elevator == true (the stagger-carry safety cap)"
        side_effects:
          - "DeliveryAppointment.status = COMPLETED"
          - "DeliveryAppointment.completion_grade = requested grade"
          - "Parent Device.activation_status → DELIVERED (cascade hop 1)"
          - "Parent Device.provenance_source = NEW_SALE and Device.warranty_expires_at = current logical clock + 365 days (cascade hop 2)"
          - "Parent HardwareOrder.status → DELIVERED and order_totals recalculated on the CHRONOLOGICAL variant (cascade hop 3)"

      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /delivery-appointments/{appointmentId}/fail"
        actor: ServiceTechnician
        preconditions:
          - "DeliveryAppointment.status == IN_PROGRESS"
          - "Requested failure_reason IN {CUSTOMER_NOT_HOME, ACCESS_DENIED, UNSUITABLE_SPACE, STAIR_CAP_EXCEEDED, CREW_UNSAFE}"
        side_effects:
          - "DeliveryAppointment.status = FAILED"
          - "DeliveryAppointment.reschedule_count unchanged (a failure is not a reschedule)"

      - from: FAILED
        to: SCHEDULED
        trigger: "POST /delivery-appointments/{appointmentId}/reschedule"
        actor: ServiceTechnician
        preconditions:
          - "DeliveryAppointment.status == FAILED"
          - "DeliveryAppointment.reschedule_count < 4"
          - "The new half-open window does not overlap any other appointment of the same crew in status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "DeliveryAppointment.reschedule_count incremented by 1"
          - "DeliveryAppointment.status = SCHEDULED"
          - "Parent HardwareOrder.status stays DELIVERY_SCHEDULED"
          - "DeliveryAppointment.version incremented by 1"

  # ---------------------------------------------------------------------------
  # FinancingPlan — cyclic (DELINQUENT ↔ CURRENT) with a terminal DEFAULTED
  # ---------------------------------------------------------------------------
  - entity: FinancingPlan
    initial_state: ORIGINATED
    terminal_states: [PAID_OFF, DEFAULTED]
    transitions:
      - from: ORIGINATED
        to: CURRENT
        trigger: "POST /financing-plans/{planId}/installments/pay"
        actor: MembershipOwner
        preconditions:
          - "FinancingPlan.status == ORIGINATED"
          - "installments_paid + 1 <= term_months"
        side_effects:
          - "FinancingPlan.installments_paid incremented by 1"
          - "Parent Membership.unpaid_financing_count recomputed by calculation financing_delinquency_state → 0"
          - "Parent Membership.posture recomputed by calculation posture_resolution"
          - "FinancingPlan.safety_disable_latched remains false"

      - from: CURRENT
        to: ORIGINATED
        trigger: "POST /financing-plans/{planId}/installments/rolling-correction"
        actor: PlatformAdmin
        preconditions:
          - "FinancingPlan.status == CURRENT"
          - "installments_paid >= 1"
        side_effects:
          - "FinancingPlan.installments_paid decremented by 1 (chronological replay removes the most recent successful installment)"
          - "FinancingPlan.monthly_installment_cents = installment_amounts calculation (this plan) on the reduced paid count"
          - "FinancingPlan.safety_disable_latched remains false"

      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /financing-plans/{planId}/installments/fail"
        actor: system
        preconditions:
          - "FinancingPlan.status == CURRENT"
        side_effects:
          - "FinancingPlan.retry_count incremented by 1"
          - "If FinancingPlan.retry_count >= 3 then FinancingPlan.status = DELINQUENT, FinancingPlan.delinquency_count incremented by 1"
          - "Parent Membership.unpaid_financing_count recomputed by calculation financing_delinquency_state"
          - "Parent Membership.status → DELINQUENT when unpaid_financing_count >= 1 and Membership.status == ACTIVE (cross-entity cascade)"
          - "FinancingPlan.safety_disable_latched remains false — delinquency MUST NOT disable hardware safety functions"

      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /financing-plans/{planId}/installments/pay"
        actor: MembershipOwner
        preconditions:
          - "FinancingPlan.status == DELINQUENT"
          - "installments_paid + 1 <= term_months"
        side_effects:
          - "FinancingPlan.status = CURRENT"
          - "FinancingPlan.installments_paid incremented by 1"
          - "FinancingPlan.installments_late incremented by 1"
          - "FinancingPlan.retry_count reset to 0"
          - "Parent Membership.unpaid_financing_count recomputed → 0"
          - "Parent Membership.status → ACTIVE when Membership.status == DELINQUENT and unpaid_financing_count == 0"
          - "FinancingPlan.version incremented by 1"

      - from: CURRENT
        to: PAID_OFF
        trigger: "POST /financing-plans/{planId}/installments/pay"
        actor: MembershipOwner
        preconditions:
          - "FinancingPlan.status == CURRENT"
          - "installments_paid + 1 == term_months"
        side_effects:
          - "FinancingPlan.installments_paid = term_months"
          - "FinancingPlan.status = PAID_OFF"
          - "FinancingPlan.safety_disable_latched remains false"

      - from: DEFAULTED
        to: CURRENT
        trigger: "POST /financing-plans/{planId}/installments/pay"
        actor: MembershipOwner
        preconditions:
          - "FinancingPlan.status == DEFAULTED"
          - "A payment arrives within 30 days of the most recent installment failure"
        side_effects:
          - "FinancingPlan.status = CURRENT"
          - "FinancingPlan.installments_late incremented by 1"
          - "FinancingPlan.safety_disable_latched remains false"
          - "Parent Membership.unpaid_financing_count recomputed"

  # ---------------------------------------------------------------------------
  # ServiceOrder — branching with a parts-logistics loop
  # (DISPATCH_PENDING_PART → PART_RESERVED → SCHEDULED, and REPAIR_IN_PROGRESS → SCHEDULED on failure)
  # ---------------------------------------------------------------------------
  - entity: ServiceOrder
    initial_state: DISPATCHED
    terminal_states: [RESOLVED, CANCELLED]
    transitions:
      - from: DISPATCHED
        to: PART_RESERVED
        trigger: "POST /service-orders/{serviceOrderId}/reserve-part"
        actor: ServiceTechnician
        preconditions:
          - "ServiceOrder.status IN {DISPATCHED, DISPATCH_PENDING_PART}"
          - "Requested part's compatible_sku == ServiceOrder.device.hardware_sku"
          - "Part.on_hand_qty - requested qty >= Part.safety_stock_qty"
        side_effects:
          - "ServiceOrder.part_id = reserved part id; ServiceOrder.reserved_part_qty = requested qty"
          - "Part.reserved_qty incremented by requested qty; Part.on_hand_qty recomputed by calculation parts_stock_position"
          - "ServiceOrder.status = PART_RESERVED"

      - from: DISPATCHED
        to: DISPATCH_PENDING_PART
        trigger: "system (reservation attempt rejected with ERR_PART_INSUFFICIENT for a COSMETIC fault)"
        actor: system
        preconditions:
          - "ServiceOrder.fault_class == COSMETIC"
          - "No part available satisfying the safety-stock rule"
        side_effects:
          - "ServiceOrder.status = DISPATCH_PENDING_PART"
          - "ServiceOrder.device.entitlement_lock unchanged (a missing part never locks content)"

      - from: PART_RESERVED
        to: DISPATCH_PENDING_PART
        trigger: "POST /parts-inventory/{partId}/reservation-release"
        actor: PlatformAdmin
        preconditions:
          - "ServiceOrder.status == PART_RESERVED"
        side_effects:
          - "ServiceOrder.part_id = null; ServiceOrder.reserved_part_qty = 0"
          - "Part.reserved_qty decremented by the released qty; Part.on_hand_qty recomputed by calculation parts_stock_position"
          - "ServiceOrder.status = DISPATCH_PENDING_PART"

      - from: PART_RESERVED
        to: SCHEDULED
        trigger: "POST /service-orders/{serviceOrderId}/schedule"
        actor: ServiceTechnician
        preconditions:
          - "ServiceOrder.status == PART_RESERVED"
          - "The half-open crew window [scheduled_start_at, scheduled_end_at) does not overlap any other ServiceOrder in status IN {SCHEDULED, REPAIR_IN_PROGRESS} for the same crew"
        side_effects:
          - "ServiceOrder.status = SCHEDULED"

      - from: DISPATCH_PENDING_PART
        to: SCHEDULED
        trigger: "POST /service-orders/{serviceOrderId}/schedule"
        actor: ServiceTechnician
        preconditions:
          - "ServiceOrder.status == DISPATCH_PENDING_PART"
          - "ServiceOrder.fault_class == SAFETY_CRITICAL (a safety-critical fault is schedulable without a part because the safety function must be restored first)"
          - "The half-open crew window does not overlap another open ServiceOrder for the same crew"
        side_effects:
          - "ServiceOrder.status = SCHEDULED"
          - "ServiceOrder.safety_functions_maintained = true"

      - from: SCHEDULED
        to: REPAIR_IN_PROGRESS
        trigger: "POST /service-orders/{serviceOrderId}/start-repair"
        actor: ServiceTechnician
        preconditions:
          - "ServiceOrder.status == SCHEDULED"
        side_effects:
          - "ServiceOrder.status = REPAIR_IN_PROGRESS"

      - from: REPAIR_IN_PROGRESS
        to: RESOLVED
        trigger: "POST /service-orders/{serviceOrderId}/resolve"
        actor: ServiceTechnician
        preconditions:
          - "ServiceOrder.status == REPAIR_IN_PROGRESS"
          - "ServiceOrder.part_id is non-null OR ServiceOrder.fault_class == SAFETY_CRITICAL"
        side_effects:
          - "ServiceOrder.status = RESOLVED; ServiceOrder.resolved_at = current logical clock"
          - "If ServiceOrder.part_id is non-null then Part.consumed_qty incremented by reserved_part_qty, Part.reserved_qty decremented by reserved_part_qty, and Part.on_hand_qty recomputed by calculation parts_stock_position"
          - "ServiceOrder.safety_functions_maintained = true"
          - "ServiceOrder.device.entitlement_lock unchanged"

      - from: REPAIR_IN_PROGRESS
        to: SCHEDULED
        trigger: "POST /service-orders/{serviceOrderId}/fail-repair"
        actor: ServiceTechnician
        preconditions:
          - "ServiceOrder.status == REPAIR_IN_PROGRESS"
        side_effects:
          - "ServiceOrder.status = SCHEDULED"
          - "ServiceOrder.failure_before_part latched true whenever ServiceOrder.part_id is null at failure time"
          - "ServiceOrder.safety_functions_maintained = true"

  # ---------------------------------------------------------------------------
  # ClassSession — branching fork to STREAMING/ARCHIVED/CANCELLED with an
  # automatic archive driven by the instructor licensing window.
  # ---------------------------------------------------------------------------
  - entity: ClassSession
    initial_state: DRAFT
    terminal_states: [ARCHIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /class-sessions/{sessionId}/publish"
        actor: Instructor
        preconditions:
          - "ClassSession.scheduled_status == DRAFT"
          - "ClassSession.license_starts_at <= ClassSession.starts_at"
          - "For delivery_mode == LIVE: ClassSession.ends_at <= ClassSession.license_ends_at"
          - "No other ClassSession with the same instructor_name and overlapping half-open [starts_at, ends_at) exists in status IN {PUBLISHED, STREAMING}"
        side_effects:
          - "ClassSession.scheduled_status = PUBLISHED"
          - "For delivery_mode == ON_DEMAND: ClassSession.on_demand_window_ends_at = min(ends_at + 24 hours, license_ends_at)"
          - "ClassSession.version incremented by 1"

      - from: PUBLISHED
        to: STREAMING
        trigger: "system (automatic at starts_at for delivery_mode == LIVE)"
        actor: system
        preconditions:
          - "ClassSession.delivery_mode == LIVE"
          - "current logical clock >= ClassSession.starts_at and current logical clock < ClassSession.ends_at"
          - "current logical clock <= ClassSession.license_ends_at"
        side_effects:
          - "ClassSession.scheduled_status = STREAMING"

      - from: PUBLISHED
        to: ARCHIVED
        trigger: "system (automatic when the live window elapses without ever reaching STREAMING, or when the licensing window closes)"
        actor: system
        preconditions:
          - "ClassSession.scheduled_status == PUBLISHED"
          - "current logical clock >= ClassSession.ends_at for delivery_mode IN {LIVE, ON_DEMAND}, or the licensing window is void because current logical clock >= license_starts_at but the session was published after license_ends_at"
        side_effects:
          - "ClassSession.scheduled_status = ARCHIVED"
          - "Every ClassEnrollment on this session with status == ENROLLED → EXPIRED (cascade hop 1)"
          - "Every ClassEnrollment on this session with status == WAITLISTED → EXPIRED (cascade hop 2)"
          - "ClassSession.live_enrollment_count recomputed by calculation class_enrollment_count → 0"
          - "Parent aggregate Membership.posture recomputed by calculation posture_resolution for every membership owning an affected enrollment's device"

      - from: STREAMING
        to: ARCHIVED
        trigger: "system (automatic at ends_at)"
        actor: system
        preconditions:
          - "ClassSession.scheduled_status == STREAMING"
          - "current logical clock >= ClassSession.ends_at"
        side_effects:
          - "ClassSession.scheduled_status = ARCHIVED"
          - "Every ClassEnrollment on this session with status == ENROLLED and completion_pct == 0 → DROPPED"
          - "ClassSession.live_enrollment_count recomputed → 0"

      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /class-sessions/{sessionId}/cancel"
        actor: Instructor
        preconditions:
          - "ClassSession.scheduled_status == PUBLISHED"
        side_effects:
          - "ClassSession.scheduled_status = CANCELLED"
          - "Every ClassEnrollment on this session with status IN {ENROLLED, WAITLISTED} → DROPPED (cascade hop 1)"
          - "ClassSession.live_enrollment_count recomputed → 0"

  # ---------------------------------------------------------------------------
  # ClassEnrollment — enrollment ↔ waitlist cycle plus a terminal completion path
  # ---------------------------------------------------------------------------
  - entity: ClassEnrollment
    initial_state: ENROLLED
    terminal_states: [COMPLETED, DROPPED, EXPIRED]
    transitions:
      - from: ENROLLED
        to: WAITLISTED
        trigger: "system (automatic when a seat is reclaimed by a concurrent-limit eviction on the same session's LIVE capacity)"
        actor: system
        preconditions:
          - "ClassEnrollment.status == ENROLLED"
          - "ClassSession.live_enrollment_count >= ClassSession.capacity"
        side_effects:
          - "ClassEnrollment.status = WAITLISTED"
          - "ClassSession.live_enrollment_count recomputed by calculation class_enrollment_count"

      - from: WAITLISTED
        to: ENROLLED
        trigger: "system (waitlist promotion after a seat opens)"
        actor: system
        preconditions:
          - "ClassSession.live_enrollment_count < ClassSession.capacity"
          - "This enrollment is the earliest by enrolled_at ASC among WAITLISTED rows on the same session; ties broken by created_at ASC"
        side_effects:
          - "ClassEnrollment.status = ENROLLED"
          - "ClassSession.live_enrollment_count recomputed by calculation class_enrollment_count"

      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /class-enrollments/{enrollmentId}/complete"
        actor: MembershipOwner
        preconditions:
          - "ClassEnrollment.status == ENROLLED"
          - "ClassEnrollment.device.content_access_allowed == true"
          - "ClassSession.scheduled_status IN {PUBLISHED, STREAMING, ARCHIVED}"
        side_effects:
          - "ClassEnrollment.completion_grade = FULL_CREDIT when completion_pct >= 80 else PARTIAL_CREDIT"
          - "ClassEnrollment.integrity_points = leaderboard_integrity_cap calculation (this enrollment)"
          - "ClassEnrollment.integrity_flagged = true when output_points > ClassSession.capacity (the leading integrity clause of leaderboard_integrity_cap)"
          - "When integrity_flagged == true then ClassEnrollment.integrity_points = 0"
          - "ClassEnrollment.device.total_workouts incremented by 1"
          - "Parent Membership.total_streams_observed recomputed by calculation concurrent_stream_limit"
          - "Parent Membership.posture recomputed by calculation posture_resolution"

      - from: ENROLLED
        to: DROPPED
        trigger: "POST /class-enrollments/{enrollmentId}/drop"
        actor: MembershipOwner
        preconditions:
          - "ClassEnrollment.status IN {ENROLLED, WAITLISTED}"
        side_effects:
          - "ClassEnrollment.status = DROPPED"
          - "ClassSession.live_enrollment_count recomputed by calculation class_enrollment_count"

      - from: ENROLLED
        to: EXPIRED
        trigger: "system (session archived or cancelled)"
        actor: system
        preconditions:
          - "ClassSession.scheduled_status IN {ARCHIVED, CANCELLED}"
        side_effects:
          - "ClassEnrollment.status = EXPIRED"
          - "ClassSession.live_enrollment_count recomputed by calculation class_enrollment_count"

  # ---------------------------------------------------------------------------
  # RefurbBatch — linear pipeline with a sell-transition that mints a Device
  # ---------------------------------------------------------------------------
  - entity: RefurbBatch
    initial_state: INSPECTING
    terminal_states: [SOLD]
    transitions:
      - from: INSPECTING
        to: CERTIFIED
        trigger: "POST /refurb-batches/{batchId}/certify"
        actor: ServiceTechnician
        preconditions:
          - "RefurbBatch.status == INSPECTING"
          - "RefurbBatch.certification_grade IN {A, B, C}"
        side_effects:
          - "RefurbBatch.status = CERTIFIED"
          - "RefurbBatch.resale_price_cents = 0.60 × source_device.hardware_sku list price for grade A, 0.50 × for grade B, 0.40 × for grade C"
          - "If RefurbBatch.certification_grade IN {B, C} then RefurbBatch.performance_resale_enabled = false"
          - "RefurbBatch.certification_chain_depth = refurb_certification_chain calculation (this batch)"

      - from: CERTIFIED
        to: LISTED
        trigger: "POST /refurb-batches/{batchId}/list"
        actor: PlatformAdmin
        preconditions:
          - "RefurbBatch.status == CERTIFIED"
          - "RefurbBatch.performance_resale_enabled == false OR RefurbBatch.certification_grade == A"
        side_effects:
          - "RefurbBatch.status = LISTED"

      - from: LISTED
        to: SOLD
        trigger: "POST /refurb-batches/{batchId}/sell"
        actor: PlatformAdmin
        preconditions:
          - "RefurbBatch.status == LISTED"
          - "Requested buying membership exists and its posture IN {OPEN, RESTRICTED}"
        side_effects:
          - "RefurbBatch.status = SOLD"
          - "RefurbBatch.sold_device_id = newly minted Device.id; the minted device.condition = REFURBISHED, device.provenance_source = RESALE, device.certifying_device_id = source_device_id, device.activation_status = ACTIVE, device.resale_cycle_count = 1"
          - "Minted Device.warranty_expires_at = current logical clock + 90 days (warranty reset on resale)"
          - "Minted Device.membership_id = buying membership id"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: membership-activation-stale
    parent_entity: Membership
    write_endpoint: "POST /fitness/memberships/{membershipId}/activate"
    occ_field: "expected_membership_version"
    description: |
      Activating a Membership whose version has advanced since the client last
      observed it is rejected. This captures the case where a linkage or a
      derivative recompute has legitimately moved the membership forward and the
      caller's view of it is therefore stale.
    error_id: ERR_MEMBERSHIP_STALE_VERSION
    http_status: 412

  - rule_id: membership-pause-stale
    parent_entity: Membership
    write_endpoint: "POST /fitness/memberships/{membershipId}/pause"
    occ_field: "expected_membership_version"
    description: |
      Pausing a Membership against a version the caller captured before another
      write advanced it is rejected, because the pause proration is computed from
      the membership's current cycle anchors and a stale anchor would produce a
      wrong credit.
    error_id: ERR_MEMBERSHIP_STALE_VERSION
    http_status: 412

  - rule_id: membership-cancel-stale
    parent_entity: Membership
    write_endpoint: "POST /fitness/memberships/{membershipId}/cancel"
    occ_field: "expected_membership_version"
    description: |
      Cancelling a Membership whose version has advanced past the value the
      caller last observed is rejected; the remaining-days refund basis must be
      read from the current membership row, so a stale version is refused rather
      than silently applied.
    error_id: ERR_MEMBERSHIP_STALE_VERSION
    http_status: 412

  - rule_id: membership-reactivation-stale
    parent_entity: Membership
    write_endpoint: "POST /fitness/memberships/{membershipId}/reactivate"
    occ_field: "expected_membership_version"
    description: |
      Reactivating a Membership whose version is no longer the one the caller
      observed is rejected, because the reactivation sweep re-anchors the billing
      cycle and gates on the membership's current unpaid-financing posture.
    error_id: ERR_MEMBERSHIP_STALE_VERSION
    http_status: 412

  - rule_id: device-link-stale
    parent_entity: Device
    write_endpoint: "POST /fitness/devices/{deviceId}/link"
    occ_field: "expected_device_version"
    description: |
      Linking a device serial to a membership against a Device version the caller
      captured before a derivative write advanced it is rejected, so the serial
      is never bound on the strength of a stale device row.
    error_id: ERR_DEVICE_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- mode (c): circular-looking dependency with pinned evaluation order ----
  - name: order_totals
    trigger: "POST /hardware-orders (FORWARD_LOOKING) and POST /delivery-appointments/{appointmentId}/complete (CHRONOLOGICAL)"
    algorithm: forward_looking
    formula: |
      # EVALUATION ORDER IS PINNED. finance_charge_cents depends on the captured
      # total tier, and the total contains finance_charge_cents; the tier is keyed
      # on the PRE-FINANCE basis (subtotal + delivery + stair + assembly), never
      # on the post-finance total, so the recursion terminates after one pass.
      basis_cents        = subtotal_cents + delivery_fee_cents + stair_carry_fee_cents + assembly_fee_cents
      tier_rate_bps      = basis_cents >= 300000 ? FINANCE_RATE_BPS_HIGH : FINANCE_RATE_BPS_LOW
      finance_charge_cents = financing_method == FINANCE_SCHEDULED
                             ? round_half_up(basis_cents * tier_rate_bps / 10000, 0)
                             : 0
      total_cents        = basis_cents + finance_charge_cents
    input_set: |
      Exactly one HardwareOrder. delivery_fee_cents comes from calculation
      delivery_charge (base legs only, HS-4). stair_carry_fee_cents and
      assembly_fee_cents are read from the AS-DESIGNED constants, both 0.
    constants:
      FINANCE_RATE_BPS_LOW: 500
      FINANCE_RATE_BPS_HIGH: 1000
      BASIS_TIER_CENTS: 300000
      SHIPPED_STAIR_CARRY_FEE_CENTS: 0
      SHIPPED_ASSEMBLY_FEE_CENTS: 0
    precision: "integer cents, round_half_up to 0 decimal places"
    variants:
      - name: FORWARD_LOOKING
        when: "at POST /hardware-orders, before any DeliveryAppointment exists"
        difference: |
          Runs with delivery_fee_cents == 0 (no zone is known yet), so it writes
          quote_total_cents = subtotal_cents + 0 + 0 + 0 + finance_charge_cents
          computed on the pre-finance basis. Nothing is overwritten later.
      - name: CHRONOLOGICAL
        when: "at POST /delivery-appointments/{appointmentId}/complete"
        difference: |
          Runs after the delivery materialises, so it re-derives delivery_fee_cents
          from the actual zone and writes captured_total_cents on the same pinned
          basis. For any non-METRO zone the two variants disagree because the
          forward variant saw zero delivery legs and a pre-finance basis below the
          tier; the forward value is never revised in place, both stay readable.

  # ---- mode (a): ≥3 inputs with non-linear interaction ----
  - name: delivery_charge
    trigger: "POST /delivery-appointments and POST /delivery-quotes"
    algorithm: tiered_pricing
    formula: |
      zone_base_cents   = {METRO: 4500, SUBURBAN: 3600, RURAL: 3000}[zone]
      delivery_legs     = {METRO: 1, SUBURBAN: 2, RURAL: 3}[zone]
      weight_units      = hardware_sku IN {BIKE, REFURB_BIKE} ? 1 : 2
      tier_rate_cents   = delivery_legs >= 3 ? 900 : (delivery_legs == 2 ? 1200 : 1500)
      delivery_fee_cents = min(delivery_legs * zone_base_cents,
                               zone_base_cents + weight_units * tier_rate_cents)
    input_set: "The HardwareOrder's hardware_sku plus the DeliveryAppointment's zone; METRO / SUBURBAN / RURAL are the only legal zones"
    constants:
      ZONE_BASE: { METRO: 4500, SUBURBAN: 3600, RURAL: 3000 }
      TIER_RATE: { 1: 1500, 2: 1200, 3: 900 }
      WEIGHT_UNITS: { BIKE: 1, REFURB_BIKE: 1, TREAD: 2, REFURB_TREAD: 2, ROWER: 2 }
    precision: "integer cents, exact (no rounding step)"
    variants: []

  # ---- mode (b): nested rounding with the order pinned explicitly ----
  - name: stair_carry_surcharge
    trigger: "POST /delivery-quotes (preview) and POST /delivery-appointments/{appointmentId}/complete (post-delivery advisory)"
    algorithm: threshold
    formula: |
      # TWO ROUNDING ORDERS ARE COMPUTABLE FROM THIS PROSE AND THEY DIFFER.
      #   FORBIDDEN order A: round_half_up((FIRST_FLIGHT_FLAT_CENTS + billable*FINE_RATE_CENTS) * TAX_BASIS, 0)
      #   PINNED    order B: round_half_up(FIRST_FLIGHT_FLAT_CENTS * TAX_BASIS, 0)
      #                    + round_half_up(billable * FINE_RATE_CENTS * TAX_BASIS, 0)
      eligible_flights  = max(0, stair_flights - (has_elevator ? 1 : 0))
      billable_flights  = max(0, eligible_flights - 1)
      surcharge_cents   = min(round_half_up(FIRST_FLIGHT_FLAT_CENTS * TAX_BASIS, 0)
                              + round_half_up(billable_flights * FINE_RATE_CENTS * TAX_BASIS, 0),
                              CARRY_FEE_CAP_CENTS)
      # AS-DESIGNED DELIVERY: HardwareOrder.stair_carry_fee_cents and
      # HardwareOrder.assembly_fee_cents are BOTH pinned to 0 on every order
      # (SHIPPED_STAIR_CARRY_FEE_CENTS / SHIPPED_ASSEMBLY_FEE_CENTS). This formula
      # is exposed as an ADVISORY value through POST /delivery-quotes only and is
      # never copied onto the order total. See the design adjudication note.
    input_set: "The DeliveryAppointment's stair_flights and has_elevator, plus the device's hardware_sku for the flat component"
    constants:
      FIRST_FLIGHT_FLAT_CENTS: 500
      FINE_RATE_CENTS: 250
      TAX_BASIS: 1.0825
      CARRY_FEE_CAP_CENTS: 2500
      SHIPPED_STAIR_CARRY_FEE_CENTS: 0
      SHIPPED_ASSEMBLY_FEE_CENTS: 0
    precision: "integer cents, round_half_up per term before the cap is applied"
    variants: []

  # ---- mode (a): ceil-first / floor-rest installment construction ----
  - name: installment_amounts
    trigger: "POST /financing-plans and POST /financing-plans/{planId}/installments/rolling-correction"
    algorithm: aggregation
    formula: |
      total_due_cents = round_half_up(principal_cents * (10000 + apr_bps) / 10000, 0)
      base            = floor(total_due_cents / term_months)
      remainder       = total_due_cents - base * term_months
      monthly_installment_cents = base + remainder      # FIRST installment only
      installment_amount(n)     = n == 1 ? base + remainder : base
      amortized_sum(n)          = (n < term_months) ? n * base + remainder : total_due_cents
      installments_paid         = count(SUCCEEDED installments)
      # Amortization invariant: amortized_sum(installments_paid) equals the total
      # principal-plus-interest actually collected so far, exactly, in integer cents.
    input_set: "A single FinancingPlan; only installments whose payment outcome is SUCCEEDED are counted"
    constants:
      TERMS_ALLOWED: [6, 12, 24]
      DEFAULT_APR_BPS: 0
    precision: "integer cents; the remainder is folded into the FIRST installment, never spread"
    variants: []

  # ---- dual-variant on the Membership domain ----
  - name: pause_proration
    trigger: "POST /memberships/{membershipId}/pause (UNUSED_DAYS) and POST /memberships/{membershipId}/cancel (REMAINING_DAYS)"
    algorithm: chronological
    formula: |
      CYCLE_DAYS            = 30
      days_left_exact       = max(0, paid_through_at - current_clock) / 1 day
      UNUSED_DAYS variant   (at pause):
        unused_days         = ceil(days_left_exact)
        accrued_pause_credit_cents = round_half_up(monthly_fee_cents * min(unused_days, CYCLE_DAYS) / CYCLE_DAYS, 0)
      REMAINING_DAYS variant (at cancel from ACTIVE):
        remaining_days      = floor(days_left_exact)
        accrued_pause_credit_cents = round_half_up(monthly_fee_cents * min(remaining_days, CYCLE_DAYS) / CYCLE_DAYS, 0)
      # CANCEL straight out of PAUSED does NOT re-run REMAINING_DAYS: the credit
      # banked by the pause is preserved verbatim.
    input_set: "One Membership with status ACTIVE or PAUSED; paid_through_at and monthly_fee_cents are read from the membership row"
    constants:
      CYCLE_DAYS: 30
      MAX_PAUSE_DAYS: 60
    precision: "integer cents, round_half_up to 0 decimal places"
    variants:
      - name: UNUSED_DAYS
        when: "banking the credit at pause time"
        difference: "Rounds the leftover day count UP with ceil, so a partial final day is credited to the member"
      - name: REMAINING_DAYS
        when: "refunding at cancellation from ACTIVE"
        difference: "Rounds the same leftover day count DOWN with floor, so the same membership on the same clock yields a strictly smaller credit than the pause basis (pinned by the worked example)"

  - name: financing_delinquency_state
    trigger: "POST /financing-plans/{planId}/installments/fail and POST /financing-plans/{planId}/installments/pay"
    algorithm: threshold
    formula: |
      if retry_count >= DELINQUENT_RETRY_THRESHOLD:   # boundary: 2 -> CURRENT, 3 -> DELINQUENT
        plan.status = DELINQUENT
        plan.delinquency_count += 1
      membership.unpaid_financing_count =
        count(FinancingPlan where membership_id == membership.id and status IN {DELINQUENT, DEFAULTED})
      # INVARIANT (never a function of financing state):
      membership.safety_gate_open = true
      plan.safety_disable_latched  = false
    input_set: "Every FinancingPlan whose membership_id equals the membership under evaluation; ORIGINATED, CURRENT and PAID_OFF plans are excluded from the count"
    constants:
      DELINQUENT_RETRY_THRESHOLD: 3
      DEFAULT_GRACE_DAYS: 30
    precision: "integer counts, no rounding"
    variants: []

  - name: posture_resolution
    trigger: "every mutation of Membership, Device, HouseholdUser, FinancingPlan or ClassEnrollment that touches membership state"
    algorithm: constraint_propagation
    formula: |
      attr_frozen_reason = any plan.status == DEFAULTED ? FINANCING_DEFAULT
                         : (membership.status IN {CANCELLED, TERMINATED} ? null : null)
      posture = FROZEN     if membership.status IN {CANCELLED, TERMINATED}
               or any FinancingPlan on the membership has status == DEFAULTED
               or attr_frozen_reason IN {FINANCING_DEFAULT, OWNERSHIP_DISPUTE}
             = RESTRICTED if membership.status IN {PAUSED, DELINQUENT}
               or membership.unpaid_financing_count >= 1
             = OPEN       otherwise
      # RESTRICTED blocks NEW hardware orders and new financing plans.
      # RESTRICTED keeps content streaming enabled (RESTRICTED is not a lockout).
      # FROZEN blocks content (device_entitlement -> content_access_allowed false).
      # Neither posture ever clears membership.safety_gate_open.
    input_set: "One Membership plus its child FinancingPlan, HouseholdUser, Device, ClassEnrollment and RefurbBatch rows"
    constants:
      POSTURE_OPEN: OPEN
      POSTURE_RESTRICTED: RESTRICTED
      POSTURE_FROZEN: FROZEN
    precision: "enum selection, no rounding"
    variants: []

  - name: concurrent_stream_limit
    trigger: "POST /household-users/{userId}/start-stream, POST /household-users/{userId}/verify, POST /household-users/{userId}/unsuspend"
    algorithm: aggregation
    formula: |
      tier_default = plan_tier == BUSINESS ? DEFAULT_BUSINESS_STREAMS : DEFAULT_PLUS_STREAMS
      concurrent_limit_effective = concurrent_limit_override != null ? concurrent_limit_override : tier_default
      active_user_count = count(HouseholdUser where membership_id == m.id and status IN {ACTIVE, PENDING_VERIFICATION})
      total_streams_observed = sum(Device.total_workouts for Device where membership_id == m.id
                                   and activation_status IN {ACTIVE, LOCKED})
      # Eviction candidate selection (deterministic, no random ids):
      #   filter  : role == MEMBER and status == ACTIVE and id != requesting user id
      #   sort key: status ASC is constant inside the filter; order by created_at ASC
      #   tiebreak: created_at ASC then eviction_count DESC
      #   fallback: when the filtered candidate set is empty the start-stream call is
      #             rejected with ERR_CONCURRENT_LIMIT_EXCEEDED (never evicts the OWNER)
    input_set: "HouseholdUser rows whose status IN {ACTIVE, PENDING_VERIFICATION}; REMOVED and SUSPENDED rows are excluded from active_user_count"
    constants:
      DEFAULT_PLUS_STREAMS: 4
      DEFAULT_BUSINESS_STREAMS: 10
    precision: "integer counts, no rounding"
    variants: []

  - name: leaderboard_integrity_cap
    trigger: "POST /class-enrollments/{enrollmentId}/complete and GET /class-sessions/{sessionId}/leaderboard"
    algorithm: weighted_scoring
    formula: |
      pts_per_pct   = {CYCLING: 10, RUNNING: 7, STRENGTH: 5, YOGA: 5}[session.discipline]
      scheduled_seconds = session.ends_at - session.starts_at
      duration_cap  = session.capacity * (scheduled_seconds / 600)
      discipline_cap = min(session.capacity * POINTS_MULTIPLIER, duration_cap)
      integrity_flagged = output_points > benchmark_seconds
      integrity_points  = integrity_flagged ? 0 : min(output_points, discipline_cap)
      # OUTPUT is always line-3 discipline_cap; the two variants below fix
      # benchmark_seconds only, so a low-output completion is unaffected and a
      # just-past-the-end output flips integrity_points between 0 and a positive cap.
    input_set: "One ClassEnrollment whose status is COMPLETED, joined to its ClassSession and Device"
    constants:
      POINTS_MULTIPLIER: 2
      BENCHMARK_TOLERANCE_SECONDS: 600
    precision: "integer points, floor on duration_cap, then integer min; no rounding"
    variants:
      - name: STRICT_BENCHMARK
        when: "integrity review of a session at or before its scheduled end"
        difference: "benchmark_seconds = floor(session.ends_at) in whole seconds, so a completion one second past the scheduled end is flagged"
      - name: INDULGENT_BENCHMARK
        when: "integrity review with the standard tolerance applied"
        difference: "benchmark_seconds = floor(session.ends_at) + BENCHMARK_TOLERANCE_SECONDS (600); the same completion that STRICT flags is left unflagged under INDULGENT, and integrity_points differ between the two variants for identical inputs"

  - name: parts_stock_position
    trigger: "POST /parts-inventory/{partId}/restock, POST /service-orders/{serviceOrderId}/reserve-part, POST /parts-inventory/{partId}/reservation-release, POST /service-orders/{serviceOrderId}/resolve"
    algorithm: aggregation
    formula: |
      on_hand_qty     = stock_received_qty - reserved_qty - consumed_qty
      reservable_qty  = on_hand_qty - safety_stock_qty
      # reservation admission boundary (pinned): admit when requested qty <= reservable_qty
      #   requested == reservable_qty      -> admitted, reserve then waits (boundary case)
      #   requested == reservable_qty + 1  -> ERR_PART_SAFETY_STOCK
    input_set: "A single PartsInventory row; every reservation whose ServiceOrder is not yet RESOLVED counts in reserved_qty"
    constants:
      DEFAULT_SAFETY_STOCK_QTY: 2
    precision: "integer quantities, no rounding"
    variants: []

  - name: refurb_certification_chain
    trigger: "POST /refurb-batches/{batchId}/certify and POST /refurb-batches/{batchId}/sell"
    algorithm: topological
    formula: |
      depth(d) = 0                              if d.certifying_device_id is null
      depth(d) = 1 + depth(d.certifying_device_id)   otherwise
      certification_chain_depth = depth(source_device)
      if certification_chain_depth > MAX_CHAIN_DEPTH: reject with ERR_CERTIFICATION_CHAIN_EXCEEDED
      # Cycle handling over the enumerated set {D}:
      #   the recursion visits D only through the edge D.certifying_device_id -> D.id,
      #   which is a self-loop; depth(D) is undefined and the sell is rejected with
      #   ERR_CERTIFICATION_CYCLE rather than looping.
    input_set: "A single RefurbBatch and the transitive closure of Device.certifying_device_id starting at its source_device_id"
    constants:
      MAX_CHAIN_DEPTH: 3
    precision: "integer depth, no rounding"
    variants: []

  - name: device_entitlement
    trigger: "Membership.pause, Membership.resume, Membership.cancel, Membership.reactivate, Membership.activate, ServiceOrder resolve"
    algorithm: constraint_propagation
    formula: |
      content_access_allowed = (membership.posture IN {OPEN, RESTRICTED}) AND (entitlement_lock == false)
      # UI affordance only. It NEVER gates ServiceOrder creation, part reservation,
      # repair scheduling, safety_gate_open, or safety-critical scheduling: a
      # DEFAULTED financing plan locks content but leaves every safety path open.
    input_set: "One Device joined to its parent Membership posture and its own entitlement_lock latch"
    constants:
      OPEN: OPEN
      RESTRICTED: RESTRICTED
      FROZEN: FROZEN
    precision: "boolean, no rounding"
    variants: []

  - name: warranty_window
    trigger: "POST /delivery-appointments/{appointmentId}/complete (NEW_SALE) and POST /refurb-batches/{batchId}/sell with POST /devices/{deviceId}/warranty-reset (RESALE)"
    algorithm: decay_function
    formula: |
      NEW_SALE: warranty_expires_at = delivered_at + 365 days
      RESALE:   warranty_expires_at = resale_cycle_paid_through_at + 90 days
                resale_cycle_count  = 1
    input_set: "One Device; RESALE rows always carry condition == REFURBISHED and provenance_source == RESALE"
    constants:
      NEW_WARRANTY_DAYS: 365
      RESALE_WARRANTY_DAYS: 90
    precision: "ISO 8601 UTC, second precision"
    variants:
      - name: NEW_SALE
        when: "a device activated by its first delivery"
        difference: "365-day window anchored on delivered_at, resale_cycle_count stays 0"
      - name: RESALE
        when: "a refurbished unit activated by a RefurbBatch sale"
        difference: "90-day window anchored on the resale paid-through instant, resale_cycle_count resets to 1 — not additive with any prior window"

  - name: class_enrollment_count
    trigger: "every ClassEnrollment status change and every ClassSession archiving or cancellation"
    algorithm: aggregation
    formula: |
      live_enrollment_count = count(ClassEnrollment where class_session_id == s.id and status IN {ENROLLED, WAITLISTED})
      # COMPLETED, DROPPED and EXPIRED rows are excluded, so an archived session
      # always reconciles to 0 after its open enrollments cascade to EXPIRED.
    input_set: "ClassEnrollment rows filtered to status IN {ENROLLED, WAITLISTED}"
    constants:
      COUNTED_STATES: [ENROLLED, WAITLISTED]
    precision: "integer count, no rounding"
    variants: []

  - name: run_ops_sweep
    trigger: "POST /_run_ops"
    algorithm: projection
    formula: |
      For every ClassSession with scheduled_status PUBLISHED and current_clock >= ends_at:
        scheduled_status = ARCHIVED and every open ClassEnrollment -> EXPIRED
      For every ClassSession with scheduled_status STREAMING and current_clock >= ends_at:
        scheduled_status = ARCHIVED
      For every Membership with status CANCELLED and current_clock - billing_cycle_start_at > 180 days:
        status = TERMINATED and every Device -> DECOMMISSIONED and every SUSPENDED user -> REMOVED
      For every ClassEnrollment in WAITLISTED whose session has live_enrollment_count < capacity:
        promote the earliest by enrolled_at ASC, then created_at ASC -> ENROLLED
    input_set: "All non-terminal ClassSession, ClassEnrollment and Membership rows"
    constants:
      TERMINATION_GRACE_DAYS: 180
    precision: "integer counts, no rounding"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers must be present; X-User-Role must be a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /fitness/_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "The declared role must be permitted for the operation; entity_backed roles must own the addressed resource when the operation is scoped to an owner"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Payload shape: every required input field present, no unknown field, every type and enum member valid; then every path resource id and every body foreign key must resolve to an existing row, with path segments validated left to right"
    error_id: ERR_RESOURCE_NOT_FOUND / ERR_INVALID_REQUEST
    http_status: 404
    applies_to: "all endpoints carrying an id"

  - priority: 4
    category: state
    check: "Optimistic concurrency: the supplied expected_<parent>_version must equal the parent's current version"
    error_id: ERR_MEMBERSHIP_STALE_VERSION / ERR_DEVICE_STALE_VERSION
    http_status: 412
    applies_to: "POST /fitness/memberships/{membershipId}/activate, pause, cancel, reactivate; POST /fitness/devices/{deviceId}/link"

  - priority: 5
    category: state
    check: "The target resource must be in a state that admits the requested transition; a transition requested out of a terminal state is refused with the terminal-specific error"
    error_id: ERR_INVALID_STATE / ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every state-transition endpoint, including the terminal-guarded ones: membership resume, installment pay against a PAID_OFF plan, and a second sell of a SOLD refurbishment batch"

  - priority: 6
    category: business_safety
    check: "People-and-equipment safety clauses: the stair-carry stagger cap, safety-critical part compatibility, the certification-cycle guard, and the invariant that no financing or entitlement path may clear safety_gate_open or disable hardware safety functions"
    error_id: ERR_STAIR_CAP_EXCEEDED / ERR_PART_MISMATCH_SAFETY / ERR_CERTIFICATION_CYCLE / ERR_SAFETY_DISABLE_FORBIDDEN
    http_status: 409
    applies_to: "POST /fitness/delivery-appointments/{appointmentId}/complete, POST /fitness/service-orders/{serviceOrderId}/reserve-part, POST /fitness/refurb-batches/{batchId}/sell, POST /fitness/financing-plans, POST /fitness/memberships/{membershipId}/pause"

  - priority: 7
    category: business_temporal
    check: "Half-open window rules: crew double-booking, instructor licensing windows, on-demand library windows, pause-length ceiling, reschedule ceiling"
    error_id: ERR_TEMPORAL_OVERLAP / ERR_LICENSE_WINDOW_INVALID / ERR_WINDOW_NOT_OPEN / ERR_PAUSE_WINDOW_INVALID / ERR_RESCHEDULE_LIMIT
    http_status: 409
    applies_to: "POST /fitness/delivery-appointments/*, POST /fitness/service-orders/{serviceOrderId}/schedule, POST /fitness/class-sessions, POST /fitness/class-sessions/{sessionId}/publish, POST /fitness/memberships/{membershipId}/pause"

  - priority: 8
    category: business_referential
    check: "Cross-entity reference compatibility: part SKU vs device SKU, serial vs device serial, device vs membership ownership, order vs membership ownership, certify-source must be a delivered terminal device"
    error_id: ERR_PART_SKU_MISMATCH / ERR_DEVICE_SERIAL_MISMATCH / ERR_DEVICE_NOT_ON_MEMBERSHIP / ERR_ORDER_MEMBERSHIP_MISMATCH / ERR_CERTIFYING_DEVICE_NOT_ELIGIBLE / ERR_REFUND_DISPUTE_DENIED
    http_status: 409
    applies_to: "POST /fitness/service-orders/{serviceOrderId}/reserve-part, POST /fitness/devices/{deviceId}/link, POST /fitness/class-enrollments, POST /fitness/financing-plans, POST /fitness/refurb-batches"

  - priority: 9
    category: business_constraint
    check: "Aggregate constraints: concurrent stream ceiling, class capacity, waitlist admission, installment-count ceiling, postal-state-free membership ownership uniqueness of the OWNER row"
    error_id: ERR_CONCURRENT_LIMIT_EXCEEDED / ERR_CLASS_CAPACITY_EXCEEDED / ERR_INSTALLMENT_COUNT_EXCEEDED / ERR_OWNER_ALREADY_EXISTS / ERR_PURCHASE_BLOCKED / ERR_DISPATCH_DEVICE_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /fitness/household-users/{userId}/start-stream, POST /fitness/class-enrollments, POST /fitness/financing-plans/{planId}/installments/pay, POST /fitness/household-users"

  - priority: 10
    category: business_fiscal
    check: "Stock and obligation gates evaluated last: parts safety-stock floor, unpaid-financing blocks, already-settled obligations"
    error_id: ERR_PART_SAFETY_STOCK / ERR_UNPAID_FINANCING_BLOCK / ERR_PLAN_ALREADY_PAID_OFF
    http_status: 409
    applies_to: "POST /fitness/service-orders/{serviceOrderId}/reserve-part, POST /fitness/memberships/{membershipId}/pause, POST /fitness/memberships/{membershipId}/reactivate, POST /fitness/hardware-orders, POST /fitness/financing-plans/{planId}/installments/pay, POST /fitness/hardware-orders/{orderId}/redeem-refund"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Membership ------------------------------------------------------------
  - method: POST
    path: "/fitness/memberships"
    description: "Create a Membership in PROVISIONAL status"
    roles: [MembershipOwner, PlatformAdmin]
    code: 201
    input: [household_name, billing_email, plan_tier, monthly_fee_cents, "concurrent_limit_override?"]
    output: Membership
    side_effects:
      - "status=PROVISIONAL, posture=OPEN, safety_gate_open=true, active_user_count=0"
      - "billing_cycle_start_at=current logical clock; paid_through_at=billing_cycle_start_at + 30 days"
      - "quote_total_cents is not touched here; the forward_looking order_totals variant runs only at order creation"

  - method: GET
    path: "/fitness/memberships"
    description: "List memberships with filtering and pagination"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: ["status?", "plan_tier?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []

  - method: GET
    path: "/fitness/memberships/{membershipId}"
    description: "Get one Membership"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: []

  - method: POST
    path: "/fitness/memberships/{membershipId}/activate"
    description: "Activate a PROVISIONAL membership, flipping every LINKED device to ACTIVE"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: [expected_membership_version]
    output: Membership
    side_effects:
      - "status=ACTIVE; billing_cycle_start_at=current logical clock; paid_through_at=billing_cycle_start_at + 30 days"
      - "posture recomputed by posture_resolution"
      - "every Device on the membership with activation_status=LINKED → ACTIVE with entitlement_lock=false"
      - "increments Membership.version by 1"

  - method: POST
    path: "/fitness/memberships/{membershipId}/pause"
    description: "Pause an ACTIVE membership, banking a pause proration credit"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: [pause_start_at, pause_end_at, expected_membership_version]
    output: Membership
    side_effects:
      - "status=PAUSED; pause_started_at=current logical clock"
      - "accrued_pause_credit_cents = pause_proration (UNUSED_DAYS variant)"
      - "posture recomputed by posture_resolution → RESTRICTED"
      - "every Device on the membership with activation_status=ACTIVE → LOCKED with entitlement_lock=true"
      - "increments Membership.version by 1"

  - method: POST
    path: "/fitness/memberships/{membershipId}/resume"
    description: "Resume a PAUSED membership, converting the banked pause credit into paid-through extension"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: [expected_membership_version]
    output: Membership
    side_effects:
      - "status=ACTIVE; pause_started_at=null"
      - "paid_through_at advanced by floor(accrued_pause_credit_cents / monthly_fee_cents * 30) days; accrued_pause_credit_cents=0"
      - "every Device with activation_status=LOCKED → ACTIVE with entitlement_lock=false"
      - "increments Membership.version by 1"

  - method: POST
    path: "/fitness/memberships/{membershipId}/cancel"
    description: "Cancel a membership from ACTIVE or PAUSED, locking content and suspending users"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: [expected_membership_version]
    output: Membership
    side_effects:
      - "status=CANCELLED; from ACTIVE the credit is pause_proration (REMAINING_DAYS variant), from PAUSED the banked credit is preserved"
      - "posture recomputed by posture_resolution → FROZEN"
      - "every Device with activation_status IN {ACTIVE, LINKED, DELIVERED, LOCKED} → LOCKED with entitlement_lock=true"
      - "every HouseholdUser with status IN {ACTIVE, PENDING_VERIFICATION} → SUSPENDED with suspended_reason=MEMBERSHIP_CANCELLED"
      - "increments Membership.version by 1"

  - method: POST
    path: "/fitness/memberships/{membershipId}/reactivate"
    description: "Reactivate a CANCELLED membership, re-anchoring the billing cycle and unlocking devices"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: [expected_membership_version]
    output: Membership
    side_effects:
      - "status=REACTIVATED; billing_cycle_start_at=current logical clock; paid_through_at=billing_cycle_start_at + 30 days"
      - "accrued_pause_credit_cents=0; posture recomputed by posture_resolution → OPEN"
      - "every Device with activation_status=LOCKED → ACTIVE with entitlement_lock=false"
      - "every HouseholdUser with status=SUSPENDED and suspended_reason=MEMBERSHIP_CANCELLED → ACTIVE with suspended_reason=null"
      - "increments Membership.version by 1"

  - method: GET
    path: "/fitness/memberships/{membershipId}/summary"
    description: "Computed read of the membership aggregate: posture, stream counters, financing exposure"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: []

  # --- HouseholdUser ---------------------------------------------------------
  - method: GET
    path: "/fitness/household-users"
    description: "List household users filtered by membership or by the device serial they are streaming on"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: ["membership_id?", "streaming_device_serial?", "status?", "limit?", "offset?"]
    output: HouseholdUser[]
    side_effects: []

  - method: POST
    path: "/fitness/memberships/{membershipId}/household-users"
    description: "Add a household user in PENDING_VERIFICATION with a server-issued verification token"
    roles: [MembershipOwner, PlatformAdmin]
    code: 201
    input: [display_name, email, "role?"]
    output: HouseholdUser
    side_effects:
      - "status=PENDING_VERIFICATION, verified=false, eviction_count=0"
      - "verification_token minted server-side and returned in the response data"
      - "parent Membership.active_user_count recomputed by concurrent_stream_limit and posture recomputed"

  - method: GET
    path: "/fitness/memberships/{membershipId}/household-users"
    description: "List household users belonging to one membership"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HouseholdUser[]
    side_effects: []

  - method: GET
    path: "/fitness/household-users/{userId}"
    description: "Get one household user"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: []
    output: HouseholdUser
    side_effects: []

  - method: POST
    path: "/fitness/household-users/{userId}/verify"
    description: "Consume the verification token and move the user to ACTIVE"
    roles: [MembershipOwner, PlatformAdmin, Anonymous]
    code: 200
    input: [verification_token]
    output: HouseholdUser
    side_effects:
      - "verified=true; status=ACTIVE"
      - "parent Membership.active_user_count recomputed by concurrent_stream_limit; posture recomputed"

  - method: POST
    path: "/fitness/household-users/{userId}/start-stream"
    description: "Bind the user to a device serial for streaming, evicting the earliest non-owner member when the concurrent limit is full"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: [device_serial, "expected_membership_version?"]
    output: HouseholdUser
    side_effects:
      - "requesting user.streaming_device_serial=device_serial and status stays ACTIVE"
      - "when active_user_count + 1 > concurrent_limit_effective the earliest non-owner ACTIVE member by created_at ASC (tiebreak eviction_count DESC) → SUSPENDED with suspended_reason=EVICTED_BY_CONCURRENCY and eviction_count incremented"
      - "ERR_CONCURRENT_LIMIT_EXCEEDED when the eviction candidate set is empty"
      - "parent Membership.active_user_count recomputed; Membership.version incremented by 1"

  - method: POST
    path: "/fitness/household-users/{userId}/suspend"
    description: "Suspend a household user administratively"
    roles: [PlatformAdmin]
    code: 200
    input: [suspended_reason]
    output: HouseholdUser
    side_effects:
      - "status=SUSPENDED with the supplied reason; streaming_device_serial=null"
      - "parent Membership.active_user_count recomputed"

  - method: POST
    path: "/fitness/household-users/{userId}/unsuspend"
    description: "Return an evicted household user to ACTIVE when the stream ceiling allows it"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: []
    output: HouseholdUser
    side_effects:
      - "status=ACTIVE with suspended_reason=null"
      - "ERR_CONCURRENT_LIMIT_EXCEEDED when active_user_count + 1 > concurrent_limit_effective"
      - "parent Membership.active_user_count recomputed by concurrent_stream_limit"

  # --- Device ----------------------------------------------------------------
  - method: POST
    path: "/fitness/memberships/{membershipId}/devices"
    description: "Mint a device serial against a membership in UNASSIGNED status"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 201
    input: [hardware_sku, serial]
    output: Device
    side_effects:
      - "activation_status=UNASSIGNED, condition=NEW, entitlement_lock=true, resale_cycle_count=0, total_workouts=0"
      - "content_access_allowed=false until the device is linked and the membership activates"

  - method: GET
    path: "/fitness/memberships/{membershipId}/devices"
    description: "List devices belonging to one membership"
    roles: [MembershipOwner, ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["activation_status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: GET
    path: "/fitness/devices/{deviceId}"
    description: "Get one device"
    roles: [MembershipOwner, ServiceTechnician, PlatformAdmin]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: POST
    path: "/fitness/devices/{deviceId}/link"
    description: "Link a delivered serial to a membership, moving the device to LINKED"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: [serial, membership_id, expected_device_version]
    output: Device
    side_effects:
      - "activation_status=LINKED; membership_id set; activated_at=current logical clock"
      - "parent Membership.posture recomputed by posture_resolution"
      - "increments Device.version by 1"

  - method: POST
    path: "/fitness/devices/{deviceId}/warranty-reset"
    description: "Apply a resale warranty window to a RESALE-provenance device"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: []
    output: Device
    side_effects:
      - "warranty_expires_at=current logical clock + 90 days; resale_cycle_count=1"
      - "ERR_WARRANTY_RESET_NOT_ELIGIBLE when provenance_source is not RESALE"

  - method: GET
    path: "/fitness/devices"
    description: "List devices filtered by parent membership, activation status or certification lineage"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["membership_id?", "certifying_device_id?", "return_device_id?", "activation_status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  # --- HardwareOrder ---------------------------------------------------------
  - method: POST
    path: "/fitness/memberships/{membershipId}/hardware-orders"
    description: "Place a hardware order and write the provisional quote total"
    roles: [MembershipOwner, PlatformAdmin]
    code: 201
    input: [hardware_sku, subtotal_cents, "financing_method?", "device_id?"]
    output: HardwareOrder
    side_effects:
      - "status=PLACED; quote_total_cents = order_totals (FORWARD_LOOKING variant)"
      - "delivery_fee_cents=0 with delivery_legs=1 assumed; stair_carry_fee_cents=0 and assembly_fee_cents=0 by AS-DESIGNED constants"
      - "ERR_POSTURE_RESTRICTED when the membership posture is RESTRICTED or FROZEN"

  - method: GET
    path: "/fitness/memberships/{membershipId}/hardware-orders"
    description: "List hardware orders belonging to one membership"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HardwareOrder[]
    side_effects: []

  - method: GET
    path: "/fitness/hardware-orders/{orderId}"
    description: "Get one hardware order including both total variants"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: []
    output: HardwareOrder
    side_effects: []

  - method: GET
    path: "/fitness/hardware-orders"
    description: "List hardware orders filtered by membership, purchased device, trade-in device or status"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: ["membership_id?", "device_id?", "return_device_id?", "status?", "limit?", "offset?"]
    output: HardwareOrder[]
    side_effects: []

  - method: POST
    path: "/fitness/hardware-orders/{orderId}/refund-dispute"
    description: "Record the underwriter resolution of a hardware refund dispute"
    roles: [PlatformAdmin]
    code: 200
    input: [resolution]
    output: HardwareOrder
    side_effects:
      - "refund_dispute_status set to the supplied resolution (FILED, DENIED or APPROVED)"
      - "a DENIED resolution latches the order against any later redemptive credit"

  - method: POST
    path: "/fitness/hardware-orders/{orderId}/redeem-refund"
    description: "Issue a redemptive credit against a delivered order, subject to the fiscal dispute gate and the membership purchase gate"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: [redeem_credit_cents, expected_membership_version]
    output: HardwareOrder
    side_effects:
      - "ERR_REFUND_DISPUTE_DENIED when refund_dispute_status is DENIED"
      - "ERR_PURCHASE_BLOCKED when the membership posture is RESTRICTED or FROZEN"
      - "increments Membership.version by 1"

  - method: GET
    path: "/fitness/devices/{deviceId}/hardware-orders"
    description: "List hardware orders referencing one device as the purchased or traded-in unit"
    roles: [MembershipOwner, ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: HardwareOrder[]
    side_effects: []

  - method: GET
    path: "/fitness/hardware-orders/{orderId}/delivery-appointments"
    description: "List delivery appointments fulfilling one hardware order"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DeliveryAppointment[]
    side_effects: []

  - method: GET
    path: "/fitness/hardware-orders/{orderId}/service-orders"
    description: "List service orders that trace back to one hardware order"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceOrder[]
    side_effects: []

  - method: POST
    path: "/fitness/hardware-orders/{orderId}/cancel"
    description: "Cancel a PLACED order or a delivered FULL_PAYMENT order"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: []
    output: HardwareOrder
    side_effects:
      - "status=CANCELLED; any attached ORIGINATED financing plan → DEFAULTED with safety_disable_latched staying false"
      - "any open DeliveryAppointment on the order's device → CANCELLED"

  # --- DeliveryAppointment ---------------------------------------------------
  - method: POST
    path: "/fitness/delivery-appointments"
    description: "Create a delivery appointment window for a device, moving its order to DELIVERY_SCHEDULED"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 201
    input: [device_id, hardware_order_id, start_at, end_at, zone, technician_crew_code, "stair_flights?", "has_elevator?"]
    output: DeliveryAppointment
    side_effects:
      - "status=REQUESTED; delivery_legs derived from zone; reschedule_count=0"
      - "parent HardwareOrder.status → DELIVERY_SCHEDULED"
      - "ERR_TEMPORAL_OVERLAP when the half-open window collides with another open appointment for the same crew"

  - method: GET
    path: "/fitness/delivery-appointments"
    description: "List delivery appointments filtered by device, order, crew or status"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["device_id?", "hardware_order_id?", "technician_crew_code?", "status?", "limit?", "offset?"]
    output: DeliveryAppointment[]
    side_effects: []

  - method: GET
    path: "/fitness/delivery-appointments/{appointmentId}"
    description: "Get one delivery appointment"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects: []

  - method: GET
    path: "/fitness/devices/{deviceId}/delivery-appointments"
    description: "List delivery appointments for one device"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DeliveryAppointment[]
    side_effects: []

  - method: POST
    path: "/fitness/delivery-appointments/{appointmentId}/schedule"
    description: "Confirm a REQUESTED appointment into a crew window"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: [start_at, end_at]
    output: DeliveryAppointment
    side_effects:
      - "status=SCHEDULED"
      - "ERR_TEMPORAL_OVERLAP when the half-open window collides with another SCHEDULED or IN_PROGRESS appointment for the same crew"

  - method: POST
    path: "/fitness/delivery-appointments/{appointmentId}/start"
    description: "Begin an installation visit"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryAppointment
    side_effects:
      - "status=IN_PROGRESS"
      - "ERR_WINDOW_NOT_OPEN when the logical clock is before start_at"

  - method: POST
    path: "/fitness/delivery-appointments/{appointmentId}/complete"
    description: "Complete the installation, delivering the device and recapturing the order total"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: [completion_grade]
    output: DeliveryAppointment
    side_effects:
      - "status=COMPLETED; completion_grade recorded"
      - "parent Device.activation_status → DELIVERED with provenance_source=NEW_SALE and warranty_expires_at=clock + 365 days"
      - "parent HardwareOrder.status → DELIVERED with delivery_fee_cents from delivery_charge and captured_total_cents from order_totals (CHRONOLOGICAL variant)"
      - "a DAMAGED grade creates a ServiceOrder with reported_fault_code=FRAME_CRACK on the device"
      - "ERR_STAIR_CAP_EXCEEDED when stair_flights > 5 and has_elevator is false"

  - method: POST
    path: "/fitness/delivery-appointments/{appointmentId}/fail"
    description: "Mark an in-progress visit as failed without touching the order status"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: [failure_reason]
    output: DeliveryAppointment
    side_effects:
      - "status=FAILED; the parent HardwareOrder.status stays DELIVERY_SCHEDULED"

  - method: POST
    path: "/fitness/delivery-appointments/{appointmentId}/reschedule"
    description: "Move a FAILED appointment into a new crew window"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: [start_at, end_at]
    output: DeliveryAppointment
    side_effects:
      - "status=SCHEDULED; reschedule_count incremented by 1"
      - "ERR_RESCHEDULE_LIMIT when reschedule_count is already 4"
      - "ERR_TEMPORAL_OVERLAP when the new half-open window collides with another appointment for the same crew"

  - method: POST
    path: "/fitness/delivery-quotes"
    description: "Advisory pre-purchase quote of delivery, stair-carry and assembly charges for a hypothetical configuration"
    roles: [ServiceTechnician, PlatformAdmin, MembershipOwner]
    code: 200
    input: [hardware_sku, zone, stair_flights, has_elevator, "assembly_required?"]
    output: "{ delivery_fee_cents: integer, stair_carry_fee_cents: integer, assembly_fee_cents: integer, quote_total_cents: integer }"
    side_effects:
      - "returns delivery_charge and the advisory stair_carry_surcharge; writes nothing"

  # --- FinancingPlan ---------------------------------------------------------
  - method: GET
    path: "/fitness/financing-plans"
    description: "List financing plans filtered by membership, originating order or status"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: ["membership_id?", "order_id?", "status?", "limit?", "offset?"]
    output: FinancingPlan[]
    side_effects: []

  - method: POST
    path: "/fitness/financing-plans"
    description: "Originate an installment plan against a delivered hardware order"
    roles: [MembershipOwner, PlatformAdmin]
    code: 201
    input: [membership_id, order_id, principal_cents, term_months, apr_bps]
    output: FinancingPlan
    side_effects:
      - "status=ORIGINATED; monthly_installment_cents from installment_amounts; safety_disable_latched=false"
      - "ERR_INSTALLMENT_COUNT_EXCEEDED when term_months is not in {6, 12, 24}"
      - "ERR_UNPAID_FINANCING_BLOCK when the membership already carries a DELINQUENT or DEFAULTED plan"

  - method: GET
    path: "/fitness/memberships/{membershipId}/financing-plans"
    description: "List financing plans belonging to one membership"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FinancingPlan[]
    side_effects: []

  - method: GET
    path: "/fitness/hardware-orders/{orderId}/financing-plans"
    description: "List financing plans written against one hardware order"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: FinancingPlan[]
    side_effects: []

  - method: GET
    path: "/fitness/financing-plans/{planId}"
    description: "Get one financing plan"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: []

  - method: POST
    path: "/fitness/financing-plans/{planId}/installments/pay"
    description: "Settle the next installment, clearing delinquency when the plan catches up"
    roles: [MembershipOwner, PlatformAdmin]
    code: 200
    input: []
    output: FinancingPlan
    side_effects:
      - "installments_paid +1; from DELINQUENT also installments_late +1 and retry_count=0 and status=CURRENT"
      - "parent Membership.unpaid_financing_count recomputed by financing_delinquency_state and posture recomputed"
      - "safety_disable_latched stays false"
      - "ERR_PLAN_ALREADY_PAID_OFF when the plan is PAID_OFF"
      - "ERR_INSTALLMENT_COUNT_EXCEEDED when installments_paid already equals term_months"

  - method: POST
    path: "/fitness/financing-plans/{planId}/installments/fail"
    description: "Record a failed installment payment and advance the delinquency counter"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FinancingPlan
    side_effects:
      - "retry_count +1; at retry_count >= 3 the plan → DELINQUENT with delinquency_count +1"
      - "parent Membership.unpaid_financing_count recomputed; parent Membership.status → DELINQUENT when it is ACTIVE and the count reaches 1"
      - "safety_disable_latched stays false and safety_gate_open stays true: delinquency never disables hardware safety functions"

  - method: POST
    path: "/fitness/financing-plans/{planId}/installments/rolling-correction"
    description: "Chronologically unwind the most recent successful installment and rebase the schedule"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FinancingPlan
    side_effects:
      - "installments_paid -1; status=CURRENT; monthly_installment_cents recomputed by installment_amounts"
      - "ERR_INVALID_STATE when installments_paid is 0"

  # --- ServiceOrder ----------------------------------------------------------
  - method: GET
    path: "/fitness/service-orders"
    description: "List service orders filtered by device, originating order, reserved part or status"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["device_id?", "order_id?", "part_id?", "status?", "limit?", "offset?"]
    output: ServiceOrder[]
    side_effects: []

  - method: POST
    path: "/fitness/service-orders"
    description: "Dispatch a service order for a device fault"
    roles: [MembershipOwner, ServiceTechnician, PlatformAdmin]
    code: 201
    input: [device_id, reported_fault_code, "diagnosis_note?", "order_id?"]
    output: ServiceOrder
    side_effects:
      - "status=DISPATCHED; fault_class and priority derived from reported_fault_code and warranty position"
      - "safety_functions_maintained=true; device.entitlement_lock is never mutated by dispatch"

  - method: GET
    path: "/fitness/service-orders/{serviceOrderId}"
    description: "Get one service order"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: []

  - method: GET
    path: "/fitness/devices/{deviceId}/service-orders"
    description: "List service orders for one device"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceOrder[]
    side_effects: []

  - method: POST
    path: "/fitness/service-orders/{serviceOrderId}/reserve-part"
    description: "Reserve a compatible replacement part against a service order"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: [part_id, quantity]
    output: ServiceOrder
    side_effects:
      - "status=PART_RESERVED; part_id and reserved_part_qty set"
      - "part.reserved_qty +quantity; part.on_hand_qty recomputed by parts_stock_position"
      - "ERR_PART_SAFETY_STOCK when quantity exceeds on_hand_qty - safety_stock_qty"
      - "ERR_PART_SKU_MISMATCH when the part's compatible_sku differs from the device's hardware_sku"

  - method: POST
    path: "/fitness/parts-inventory/{partId}/reservation-release"
    description: "Release a reservation from a service order back into stock"
    roles: [PlatformAdmin]
    code: 200
    input: [service_order_id, quantity]
    output: ServiceOrder
    side_effects:
      - "the service order → DISPATCH_PENDING_PART with part_id=null and reserved_part_qty=0"
      - "part.reserved_qty -quantity; part.on_hand_qty recomputed by parts_stock_position"

  - method: POST
    path: "/fitness/service-orders/{serviceOrderId}/schedule"
    description: "Book a repair window; safety-critical orders may be scheduled without a part"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: [scheduled_start_at, scheduled_end_at]
    output: ServiceOrder
    side_effects:
      - "status=SCHEDULED"
      - "ERR_TEMPORAL_OVERLAP when the crew window collides with another open service order"
      - "ERR_PART_REQUIRED_FOR_SCHEDULING when the fault is COSMETIC and no part is reserved"

  - method: POST
    path: "/fitness/service-orders/{serviceOrderId}/start-repair"
    description: "Begin the repair visit"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: []
    output: ServiceOrder
    side_effects: ["status=REPAIR_IN_PROGRESS"]

  - method: POST
    path: "/fitness/service-orders/{serviceOrderId}/resolve"
    description: "Sign off the repair, consuming any reserved part"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["diagnosis_note?"]
    output: ServiceOrder
    side_effects:
      - "status=RESOLVED; resolved_at=current logical clock; safety_functions_maintained=true"
      - "when part_id is non-null: part.consumed_qty +reserved_part_qty, part.reserved_qty -reserved_part_qty, part.on_hand_qty recomputed by parts_stock_position"
      - "device.entitlement_lock is left unchanged"

  - method: POST
    path: "/fitness/service-orders/{serviceOrderId}/fail-repair"
    description: "Record a failed repair attempt and return the order to scheduling"
    roles: [ServiceTechnician, PlatformAdmin]
    code: 200
    input: ["diagnosis_note?"]
    output: ServiceOrder
    side_effects:
      - "status=SCHEDULED; failure_before_part latched true when no part was reserved"
      - "safety_functions_maintained=true"

