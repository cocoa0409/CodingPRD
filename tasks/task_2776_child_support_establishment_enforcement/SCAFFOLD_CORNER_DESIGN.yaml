          assert:
            - "${mone1} == 75000 and ${prin_before} == 150000"
            - "trigger[1] HTTP 200 body: data.statutory_interest_cents == 1125  # per charge: round_half_up(75000 * 0.005 * 2) == 750 for the 2026-08-15 charge plus round_half_up(75000 * 0.005 * 1) == 375 for the 2026-09-15 charge"
            - "trigger[1] body: data.aggregate_interest_cents == 1875  # per month-end snapshot strictly before 2026-11-01: 2026-08-31 over 75000 == 375, 2026-09-30 over 150000 == 750, 2026-10-31 over 150000 == 750; the two variants differ by exactly 750 in one response"
            - "trigger[1] body: data.interest_receivable_cents == 1875, data.interest_collected_cents == 0, data.interest_written_off_cents == 0  # the receivable tracks the aggregate variant"
            - "trigger[1] body: data.arrears_principal_cents == 150000, data.assigned_arrears_cents == 0, data.unassigned_arrears_cents == 150000, data.unapplied_credit_cents == 0  # tanf_assistance false sends the whole balance to the unassigned column"
            - "trigger[2] body: data.statutory_interest_cents == 375 and data.aggregate_interest_cents == 375  # rewound to 2026-09-20 the variants agree: the 2026-09-15 charge has been outstanding zero whole months AND falls after the only month-end (2026-08-31) in range"
            - "trigger[2] body: data.arrears_principal_cents == 150000  # as_of_date rewinds the interest computation only; principal is not replayed"
            - "trigger[3] body is byte-identical to trigger[1]  # the read is a pure function of stored rows and the clock"
            - "${vbefore} == ${vafter} and ${prin_before} == ${prin_after}  # three ledger reads incremented no version"
            - "${recv_before} == 1875 and ${recv_after} == 1875  # the case row agrees with the ledger's aggregate column and nothing drifted"

      - name: amendment_recomputes_the_cap_in_place_without_a_new_withholding_order
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /child-support/withholding-orders/{iwo_id}/amendment]"
          - "state_machines.IncomeWithholdingOrder.service_status.SERVED -> AMENDED"
          - "state_machines.IncomeWithholdingOrder.service_status.AMENDED -> AMENDED"
          - "calculations.withholding_amount"
          - "entities.Employer.fields.active_iwo_count"
        distinguishing_aspect: >
          A one-field action endpoint rewrites four derived money fields on an
          existing row rather than creating a successor row: the same iwo_id
          survives two amendments, employer.active_iwo_count stays 1 throughout, and
          remittance_status stays NOT_DUE because the two IWO dimensions are
          independent. The recomputation is a full re-run of the withholding
          formula, not a proportional scaling - dropping disposable income from
          150000 to 100000 changes the withheld figure from a cap-limited 89750 to a
          cap-limited 59750, and raising it to 200000 puts the order back on the
          requested 90000 with room to spare.
        test_recipe:
          setup:
            - "Empty database. Clock pinned to 2026-08-01T00:00:00Z."
            - "CP 200000 and NCP 300000 VERIFIED_WAGE_RECORD, supports_second_family false; ENTERED order, monthly_obligation_cents 75000."
            - "One CURRENT_SUPPORT charge of 75000 due 2026-08-15, so arrears_principal_cents is 75000 and the requested amount is 75000 + 0 + round_half_up(75000 * 0.20) == 90000."
            - "75000 is below ARREARS_BUMP_MONTHS * 75000 == 225000, so no 12-week bump: the federal cap stays 0.60."
            - "MN employer with remittance_fee_cents 250; EMPLOYER_STATE_CAPS[MN] is null so the federal percentage governs."
            - "The IWO is issued at reported_disposable_income_cents 150000 and SERVED."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Delphine Marchetti", ssn_last4: "6233", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpe2: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Ugo Marchetti", ssn_last4: "6234", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpe2: "$.data.id" }
            - call: "POST /child-support/participants/${ncpe2}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpe2}", noncustodial_party_id: "${ncpe2}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casee2: "$.data.id" }
            - call: "POST /child-support/cases/${casee2}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casee2}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { ordere2: "$.data.id" }
            - call: "POST /child-support/orders/${ordere2}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${ordere2}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { mone2: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/orders/${ordere2}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15", amount_cents: 75000 }
              as: FinanceOfficer
            - call: "POST /child-support/employers"
              payload: { legal_name: "Marchetti Stoneworks", fein: "41-0000111", state_code: "MN", pay_frequency: "SEMIMONTHLY", remittance_fee_cents: 250 }
              as: ProgramAdmin
              captures: { empe2: "$.data.id" }
            - call: "GET /child-support/orders/${ordere2}"
              as: CaseWorker
              captures: { ve2: "$.data.version" }
            - call: "POST /child-support/orders/${ordere2}/withholding-orders"
              payload: { employer_id: "${empe2}", expected_order_version: "${ve2}", reported_disposable_income_cents: 150000 }
              as: CaseWorker
              captures: { iwoe2: "$.data.id", wh0: "$.data.withholding_amount_cents", req0: "$.data.requested_amount_cents", ar0: "$.data.arrears_recovery_cents", cap0: "$.data.ccpa_cap_amount_cents", fee0: "$.data.employer_fee_cents" }
            - call: "POST /child-support/withholding-orders/${iwoe2}/service"
              payload: {}
              as: CaseWorker
              captures: { svc0: "$.data.service_status", rem0: "$.data.remittance_status" }
            - call: "GET /child-support/employers/${empe2}"
              as: ProgramAdmin
              captures: { cnt0: "$.data.active_iwo_count", scap: "$.data.statutory_cap_pct" }
          trigger:
            - call: "POST /child-support/withholding-orders/${iwoe2}/amendment"
              payload: { reported_disposable_income_cents: 100000 }
              as: CaseWorker
              captures: { id1: "$.data.id", svc1: "$.data.service_status", rem1: "$.data.remittance_status", pct1: "$.data.ccpa_cap_pct", cap1: "$.data.ccpa_cap_amount_cents", wh1: "$.data.withholding_amount_cents", fee1: "$.data.employer_fee_cents", req1: "$.data.requested_amount_cents" }
            - call: "POST /child-support/withholding-orders/${iwoe2}/amendment"
              payload: { reported_disposable_income_cents: 200000 }
              as: CaseWorker
              captures: { id2: "$.data.id", svc2: "$.data.service_status", cap2: "$.data.ccpa_cap_amount_cents", wh2: "$.data.withholding_amount_cents", fee2: "$.data.employer_fee_cents", rem2: "$.data.remittance_status" }
            - call: "GET /child-support/employers/${empe2}"
              as: ProgramAdmin
              captures: { cnt2: "$.data.active_iwo_count" }
            - call: "GET /child-support/withholding-orders"
              payload: { order_id: "${ordere2}" }
              as: CaseWorker
              captures: { iwo_total: "$.meta.total_count" }
          assert:
            - "${mone2} == 75000 and ${ar0} == 15000 and ${req0} == 90000  # round_half_up(75000 * 0.20) == 15000"
            - "${scap} == null and ${cap0} == 90000 and ${wh0} == 89750 and ${fee0} == 250  # floor(150000 * 0.60) == 90000 of cap, minus the 250 fee, leaves 89750 of room below the requested 90000"
            - "${svc0} == SERVED and ${rem0} == NOT_DUE and ${cnt0} == 1"
            - "${id1} == ${iwoe2} and ${svc1} == AMENDED  # the action mutates the existing row"
            - "${pct1} == 0.60 and ${cap1} == 60000 and ${wh1} == 59750 and ${fee1} == 250 and ${req1} == 90000  # floor(100000 * 0.60) == 60000, room 59750; the requested amount is unchanged because the order and arrears did not move"
            - "${rem1} == NOT_DUE  # the amendment never touches the remittance dimension"
            - "${id2} == ${iwoe2} and ${svc2} == AMENDED  # AMENDED -> AMENDED is a legal self-loop"
            - "${cap2} == 120000 and ${wh2} == 90000 and ${fee2} == 250  # floor(200000 * 0.60) == 120000, room 119750, so min(90000, 119750) puts the order back on its full requested figure"
            - "${rem2} == NOT_DUE"
            - "${cnt2} == 1 and ${iwo_total} == 1  # two amendments created no second withholding order and no second active count"

      - name: withholding_order_join_row_is_addressable_from_both_of_its_parents
        claim_type: cross_reference_link
        grounds:
          - "endpoints[POST /child-support/orders/{order_id}/withholding-orders]"
          - "endpoints[GET /child-support/withholding-orders]"
          - "entities.IncomeWithholdingOrder.fields.order_id"
          - "entities.IncomeWithholdingOrder.fields.employer_id"
          - "entities.IncomeWithholdingOrder.fields.jurisdiction_state_code"
          - "calculations.withholding_amount.constants.EMPLOYER_STATE_CAPS"
        distinguishing_aspect: >
          The IWO is a join row created under one parent (the order) while carrying
          a body reference to the other (the employer), and the list filters reach
          it from either side plus from the state code it denormalises off the
          employer. The link is load-bearing rather than decorative: the MN order
