        distinguishing_aspect: |
          supported_body_types is an array whose MEMBERS are constrained to the BodySpec.body_type
          enum — the validation has to reach inside the array. A bay advertising "TANKER" would later
          make the priority-80 bay/body compatibility gate unresolvable.
