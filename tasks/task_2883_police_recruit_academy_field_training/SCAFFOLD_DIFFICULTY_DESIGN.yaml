              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { class_id: $.data.id }
            - call: "POST /instructors"
              payload: { badge_number: "B-310", full_name: "Ivy Nash" }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { instrA: $.data.id }
            - call: "POST /instructors/${instrA}/certify"
              payload: { certification_expires_at: "2028-08-01T00:00:00Z", authorized_topic_codes: ["PATROL"], fto_certified: true }
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /lesson-plans"
              payload: { instructor_id: "${instrA}", topic_code: "PATROL", title: "Patrol Operations", contact_hours: 2.00 }
              as: AcademyInstructor
              as_user_id: "${instrA}"
              captures: { lp_id: $.data.id }
            - call: "POST /lesson-plans/${lp_id}/approve"
              payload: {}
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /course-sessions"
              payload: { academy_class_id: "${class_id}", lesson_plan_id: "${lp_id}", instructor_id: "${instrA}", room_code: "R1", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T11:00:00Z", min_enrollment: 1 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { cs1_id: $.data.id }
          trigger:
            - call: "POST /course-sessions"
              payload: { academy_class_id: "${class_id}", lesson_plan_id: "${lp_id}", instructor_id: "${instrA}", room_code: "R1", starts_at: "2026-08-10T11:00:00Z", ends_at: "2026-08-10T13:00:00Z", min_enrollment: 1 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { cs2_id: $.data.id }
            - call: "POST /course-sessions"
              payload: { academy_class_id: "${class_id}", lesson_plan_id: "${lp_id}", instructor_id: "${instrA}", room_code: "R2", starts_at: "2026-08-10T13:00:00Z", ends_at: "2026-08-10T15:00:00Z", min_enrollment: 1 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
            - call: "POST /course-sessions"
              payload: { academy_class_id: "${class_id}", lesson_plan_id: "${lp_id}", instructor_id: "${instrA}", room_code: "R2", starts_at: "2026-08-10T13:15:00Z", ends_at: "2026-08-10T15:00:00Z", min_enrollment: 1 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { cs3_id: $.data.id }
