            - call: "POST /enrollments/${enrollment_two}/cancellation"
              payload: { reason: "MOVED", requested_effective_date: "2026-10-20" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { two_coverage: $.data.coverage_status, two_credit: $.data.credit_cents, two_refund: $.data.refund_cents, two_refunded_field: $.data.premium_refunded_cents }
            - call: "GET /partners/${partner_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { count_after_cancellation: $.data.enrolled_premises_count }
          assert:
            - "${count_at_create} == 0, ${count_after_one} == 1 and ${count_after_two} == 2  # the counter is a distinct-premises count over live coverage"
            - "${collected_at_create} == 0 and ${refunded_at_create} == 0  # prepaid_amount_cents is a term input, not a ledger row"
            - "${reason_after_enrollment} == NONE and ${suppressed_after_enrollment} == false  # §1.1 vs §1.5 GAP: POST /enrollments says it recomputes the premises suppression, but ACTIVE_ENROLLMENT is one of the two campaign-scoped reasons explicitly skipped by Premises.suppression_reason, so the recompute is observably a no-op here and the suppression only surfaces as last_mail_suppression_reason at drop time"
            - "${collected_one_payment} == 2499, ${billing_one_payment} == CURRENT and ${collected_two_payments} == 4998"
            - "${billing_missed} == PAST_DUE, ${past_due_since} == 2026-10-05 and ${collected_after_missed} == 4998"
            - "${rows_after_missed} == 2  # MISSED_PAYMENT writes no LedgerEntry because no money moves"
            - "${billing_written_off} == WRITTEN_OFF, ${collected_after_write_off} == 4998 and ${refunded_after_write_off} == 2499  # WRITE_OFF is outside the premium_collected_cents entry_type set and inside the premium_refunded_cents set"
            - "${write_off_rows} == 1, ${write_off_amount} == -2499 and ${write_off_kind} == CASH"
            - "${two_coverage} == CANCELLED, ${two_credit} == 967 and ${two_refund} == 0  # days_remaining = 31 - 20 + 1 = 12, round_half_up(2499 * 12 / 31) = 967"
            - "${two_refunded_field} == 967  # the PRORATION_CREDIT row of -967 lands in premium_refunded_cents"
            - "${count_after_cancellation} == 1  # CANCELLED is outside {PENDING_WAITING_PERIOD, ACTIVE, SUSPENDED_NONPAY}, so the second premises leaves the counter"

      - name: cc_dual_variant_provisional_estimate_versus_final_settlement
        claim_type: dual_variant_calculation
        grounds:
          - calculations.dispatch_benefit_settlement
          - endpoints[POST /dispatches/{dispatchId}/events]
        excluded_because:
          difficulty_instance: benefit_provisional_estimate_vs_final_settlement_diverge
          rationale: "The provisional/final variant pair of calculations.dispatch_benefit_settlement, including the reservation released at completion, is walked end to end by that §1.8 instance."

      - name: cc_cascading_side_effects_of_dispatch_completion_on_siblings
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Dispatch
          - state_machines.Claim
          - state_machines.Enrollment.cap_status
        excluded_because:
          difficulty_instance: dispatch_completion_cascades_to_sibling_claim_denial
          rationale: "The four-hop completion cascade (dispatch -> claim -> enrollment cap dimension -> sibling TRIAGE claims denied with CAP_EXHAUSTED) is the subject of that §1.8 instance."

      - name: cc_cascading_side_effects_of_complaint_intake_on_premises_suppression
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /regulator-complaints]
          - entities.Enrollment.retention_hold
          - entities.Premises.regulator_hold
        excluded_because:
          difficulty_instance: regulator_complaint_intake_cascades_to_premises_suppression
          rationale: "The complaint-intake cascade (claim reopened to APPEAL_OPEN, Enrollment.retention_hold, Premises.regulator_hold and the suppression recompute) is covered there, including the version bumps on each touched row."

      - name: cc_rate_threshold_cumulative_annual_cap_and_its_reset
        claim_type: rate_threshold_triggers
        grounds:
          - entities.Enrollment.annual_benefit_used_cents
          - state_machines.Enrollment.cap_status
        excluded_because:
          difficulty_instance: annual_cap_exhausts_when_usage_equals_cap_exactly
          rationale: "The cumulative benefit threshold at the exact cap boundary is that §1.8 instance, and benefit_reversal_restores_annual_cap_headroom covers the reset direction, so only the tiered notice threshold is instantiated here."

  # === Section 9 - consistency_model ===
  - section: consistency_model
    source_scaffold_ref: "§1.0 response_envelope, §0.2 consistency_model: immediate, §1.2 state_machines, §1.5 endpoints"
    instances:
      - name: consistency_envelope_shape_and_read_your_write_on_every_create
        claim_type: immediate
        grounds:
          - response_envelope.success_shape
          - response_envelope.meta_fields
          - endpoints[POST /partners]
          - endpoints[GET /partners/{partnerId}]
          - endpoints[POST /premises]
          - endpoints[GET /premises/{premisesId}]
        distinguishing_aspect: "Every response carries the same three-key envelope (meta with api_request_id and api_request_timestamp, response_type, data) with meta.api_request_timestamp equal to the pinned logical clock, and the row a create returns is byte-for-byte the row an immediately following GET by id returns, including version 1 and the server-assigned derived fields — there is no propagation delay and no read-after-write staleness anywhere."
        test_recipe:
          setup:
            - "The clock is pinned to 2026-08-01T00:00:00.000Z before the first create so meta.api_request_timestamp is a known literal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, create_type: $.response_type, create_ts: $.meta.api_request_timestamp, create_req_id: $.meta.api_request_id, create_status: $.data.status, create_version: $.data.version, create_count: $.data.enrolled_premises_count, create_created_at: $.data.created_at }
            - call: "GET /partners/${partner_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { read_id: $.data.id, read_type: $.response_type, read_ts: $.meta.api_request_timestamp, read_req_id: $.meta.api_request_id, read_status: $.data.status, read_version: $.data.version, read_count: $.data.enrolled_premises_count, read_created_at: $.data.created_at }
            - call: "GET /partners"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { list_type: $.response_type, list_total: $.data.total_count, list_first: "$.data.items[0].id", list_first_version: "$.data.items[0].version" }
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "18 Alder Court", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_create_reason: $.data.suppression_reason, premises_create_suppressed: $.data.suppressed, premises_create_version: $.data.version }
            - call: "GET /premises/${premises_id}"
              payload: {}
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_read_reason: $.data.suppression_reason, premises_read_suppressed: $.data.suppressed, premises_read_version: $.data.version, premises_read_partner: $.data.partner_id }
          assert:
            - "${create_type} == object and ${read_type} == object  # §1.0 fixes response_type to object for a single resource"
            - "${create_ts} == 2026-08-01T00:00:00.000Z and ${read_ts} == 2026-08-01T00:00:00.000Z  # meta.api_request_timestamp is the pinned logical clock, not wall time"
            - "${create_req_id} != ${read_req_id}  # meta.api_request_id is per request"
            - "${create_status} == ONBOARDING, ${create_version} == 1, ${create_count} == 0 and ${create_created_at} == 2026-08-01T00:00:00.000Z"
            - "${read_id} == ${partner_id}, ${read_status} == ${create_status}, ${read_version} == ${create_version}, ${read_count} == ${create_count} and ${read_created_at} == ${create_created_at}  # read-your-write is total: the GET adds nothing and hides nothing"
            - "${list_type} == array, ${list_total} == 1, ${list_first} == ${partner_id} and ${list_first_version} == 1  # a collection response carries response_type array and sees the new row in the same breath"
            - "${premises_create_reason} == NONE, ${premises_create_suppressed} == false and ${premises_create_version} == 1"
            - "${premises_read_reason} == ${premises_create_reason}, ${premises_read_suppressed} == ${premises_create_suppressed}, ${premises_read_version} == ${premises_create_version} and ${premises_read_partner} == ${partner_id}"

      - name: consistency_same_request_cascade_is_visible_to_the_very_next_read
        claim_type: immediate
        grounds:
          - state_machines.UtilityPartner
          - endpoints[POST /partners/{partnerId}/status-changes]
          - endpoints[GET /service-line-products]
          - endpoints[GET /campaigns]
          - endpoints[GET /enrollments]
        distinguishing_aspect: "A single status-change request fans out across three other tables, and every one of those side effects is readable on the immediately following GET with its version already incremented — nothing is deferred to a batch, so POST /operations/nightly-run afterwards changes none of the cascaded rows."
        test_recipe:
          setup:
            - "An ACTIVE partner with one AVAILABLE product, one PARTNER_REVIEW campaign and one ACTIVE enrollment, all created before the termination."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id, product_status_filed: $.data.status }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Product filed.", expected_partner_version: "${partner_v1}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_v2: $.data.version, partner_active: $.data.status }
            - call: "POST /premises"
              payload: { partner_id: "${partner_id}", street_address: "18 Alder Court", state_code: "OR", owned_segments: ["WATER_CURB_STOP_TO_HOME"], do_not_mail: false, address_status: "GOOD" }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { premises_id: $.data.id, premises_v1: $.data.version }
            - call: "POST /campaigns"
              payload: { partner_id: "${partner_id}", product_id: "${product_id}", name: "August water drop", piece_type: "POSTCARD", drop_date: "2026-08-20", requested_quantity: 1000 }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { campaign_id: $.data.id }
            - call: "POST /campaigns/${campaign_id}/submission"
              payload: { note: "Ready for brand review." }
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { campaign_review_status: $.data.status, campaign_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /enrollments"
              payload: { premises_id: "${premises_id}", product_id: "${product_id}", billing_mode: "DIRECT_BILL", expected_premises_version: "${premises_v1}", prepaid_amount_cents: 29988 }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
            - call: "GET /enrollments/${enrollment_id}"
              payload: {}
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_before: $.data.coverage_status, enrollment_v_before: $.data.version }
          trigger:
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "TERMINATED", reason: "Partner exited the program.", expected_partner_version: "${partner_v2}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_terminated: $.data.status, partner_v3: $.data.version }
            - call: "GET /service-line-products/${product_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_after: $.data.status }
            - call: "GET /campaigns/${campaign_id}"
              payload: {}
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { campaign_after: $.data.status, campaign_v_after: $.data.version }
            - call: "GET /enrollments/${enrollment_id}"
              payload: {}
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { enrollment_after: $.data.coverage_status, enrollment_v_after: $.data.version }
            - call: "GET /service-line-products?partner_id=${partner_id}&status=WITHDRAWN"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { withdrawn_total: $.data.total_count, withdrawn_first: "$.data.items[0].id" }
            - call: "POST /operations/nightly-run"
              payload: {}
              as: OperationsAdmin
              as_user_id: "ops-001"
              captures: { post_cascade_activated: $.data.activated_enrollment_ids, post_cascade_lapsed: $.data.lapsed_enrollment_ids, post_cascade_suspended: $.data.suspended_enrollment_ids }
            - call: "GET /campaigns/${campaign_id}"
              payload: {}
              as: MarketingOps
              as_user_id: "mops-001"
              captures: { campaign_after_batch: $.data.status, campaign_v_after_batch: $.data.version }
          assert:
            - "${product_status_filed} == AVAILABLE, ${partner_active} == ACTIVE, ${campaign_review_status} == PARTNER_REVIEW and ${enrollment_before} == ACTIVE"
            - "${partner_terminated} == TERMINATED and ${partner_v3} == 3"
            - "${product_after} == WITHDRAWN  # the product moved inside the same request, not on a later batch"
            - "${campaign_after} == CANCELLED and ${campaign_v_after} == 3  # the in-flight PARTNER_REVIEW campaign was cancelled by the same request that terminated the partner"
            - "${withdrawn_total} == 1 and ${withdrawn_first} == ${product_id}  # the cascade is visible through the filtered collection too, not only by id"
            - "${enrollment_after} == ACTIVE and ${enrollment_v_after} == ${enrollment_v_before}  # existing coverage is deliberately untouched by termination, so its version does not move"
            - "${post_cascade_activated} == [], ${post_cascade_lapsed} == [] and ${post_cascade_suspended} == []  # nothing was left pending for the batch to finish"
            - "${campaign_after_batch} == CANCELLED and ${campaign_v_after_batch} == ${campaign_v_after}  # a batch run after the cascade re-applies nothing"

      - name: consistency_a_refused_write_leaves_no_partial_state_behind
        claim_type: immediate
        grounds:
          - response_envelope.error_shape
          - validations
          - errors[ERR_STALE_PREMISES_VERSION]
          - errors[ERR_SEGMENT_NOT_OWNED]
          - endpoints[POST /enrollments]
          - endpoints[GET /enrollments]
        distinguishing_aspect: "An error response carries the same meta/response_type/data envelope with data narrowed to error_id and message, and the refusal is atomic: after three separate rejections the enrollment collection is still empty, the partner counter is still zero and the premises version has not moved, so no half-written row is observable."
        test_recipe:
          setup:
            - "An ACTIVE partner with one AVAILABLE product requiring WATER_CURB_STOP_TO_HOME, plus a premises that owns only the gas segment and a second premises that owns the water segment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, partner_v1: $.data.version }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id }
            - call: "POST /partners/${partner_id}/status-changes"
