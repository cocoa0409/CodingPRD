            - "assigning Pinnacle's crew to Alpha's order returns HTTP 422 with error_id ERR_CREW_DEALER_MISMATCH"
            - "assigning Alpha's crew at exactly certified_until 2027-12-31T00:00:00Z returns HTTP 200 with installation_readiness ASSIGNED, so the comparison is at-or-before"
            - "one second later the same crew on the second order returns HTTP 422 with error_id ERR_CREW_CERTIFICATION_EXPIRED"
            - "the second order still reports installation_crew_id null and installation_readiness UNASSIGNED"
            - "the crew row is still status CERTIFIED - expiry is a clock comparison, not a state transition"

      - name: segregation_of_duties_blocks_the_author_from_reviewing_or_sealing_their_own_design
        claim_type: violation_to_error
        grounds:
          - validations.p14
          - validations.p15
          - errors.ERR_SEAL_SEGREGATION_VIOLATION
          - errors.ERR_ENGINEER_NOT_LICENSED_IN_JURISDICTION
        distinguishing_aspect: "The rule is keyed on the acting X-User-ID versus author_engineer_id, not on the role: the very same engineer who legitimately holds the DesignEngineer seat on this design is refused when they put on the SealingEngineer hat, on BOTH of that role's exclusive operations. A third engineer who is not the author but is unlicensed in the design's jurisdiction is then refused by the priority-15 licence gate instead, which shows the two 403/422 rejections come from different rules rather than a single blanket check. Only the licensed non-author can seal, and the seal must stamp sealed_by_engineer_id with that engineer."
        test_recipe:
          setup:
            - "Jurisdiction IA-CENTRAL (seal_required true, min wind 105, permit_review_days 21)."
            - "Engineer PE-1001 licensed in IA-CENTRAL (the author), PE-1002 licensed in IA-CENTRAL (a valid sealer), PE-9001 licensed only in NE-WEST."
            - "BinDesign D1 authored by PE-1001, analysed under ASD and submitted so it is UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "IA-CENTRAL", name: "Iowa Central", seal_required: true, min_design_wind_speed_mph: 105, seismic_design_category: "B", permit_review_days: 21 }
              as: PlantAdmin
              captures: { j_ia_id: $.data.id }
            - call: "POST /grain-profiles"
