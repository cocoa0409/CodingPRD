            - call: "POST /factoring/programs"
              payload: { name: "F18", recourse_grace_days: 90, default_fee_rate_per_day: 0.0005, tier2_multiplier: 1.5, tier3_multiplier: 2.0 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /factoring/clients"
              payload: { program_id: "${prog_id}", legal_name: "Ci2Co", requested_advance_rate_pct: 0.85 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /factoring/clients/${client_id}/credit-decision"
              payload: { decision: "APPROVE", approved_advance_rate_pct: 0.85, credit_limit_cents: 100000000, default_concentration_limit_pct: 0.90 }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
              captures: { client_v: $.data.version }
            - call: "POST /factoring/debtors"
              payload: { program_id: "${prog_id}", legal_name: "Ci2Debt", credit_rating: "A" }
              as: PlatformAdmin
              captures: { debtor_id: $.data.id }
            - call: "POST /factoring/debtors/${debtor_id}/credit-decision"
              payload: { decision: "APPROVE", approved_credit_ceiling_cents: 100000000, verification_required: false }
              as: UnderwritingOfficer
              as_user_id: "uw_1"
            - call: "POST /factoring/relationships"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", recourse_type: "RECOURSE" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { rel_id: $.data.id }
            - call: "POST /factoring/relationships/${rel_id}/send-notice"
              payload: {}
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/invoices"
              payload: { client_id: "${client_id}", debtor_id: "${debtor_id}", invoice_number: "INV-CI2", face_amount_cents: 100000, issue_date: "2026-05-01T00:00:00Z", due_date: "2026-05-31T00:00:00Z" }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { inv_id: $.data.id }
            - call: "POST /factoring/invoices/${inv_id}/verify"
              payload: { method: "WAIVED", confirmed_amount_cents: 100000 }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /factoring/purchase-batches"
              payload: { client_id: "${client_id}", batch_reference: "B-CI2", invoice_ids: ["${inv_id}"] }
              as: FundingOfficer
              as_user_id: "fo_1"
              captures: { batch_id: $.data.id }
            - call: "POST /factoring/purchase-batches/${batch_id}/fund"
              payload: { expected_client_version: "${client_v}" }
              as: FundingOfficer
              as_user_id: "fo_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /factoring/invoices/${inv_id}/buyback"
              payload: { trigger_reason: "RECOURSE_OVERDUE" }
              as: CollectionsOfficer
              as_user_id: "co_1"
          assert:
            - "After funding GET debtor outstanding_face_cents == 100000"
            - "After buyback Invoice.${inv_id}.status == BOUGHT_BACK and GET debtor outstanding_face_cents == 0 (compensated exactly)"
            - "GET client reserve_balance_cents == 0 after buyback (reserve released, distinct invariant also restored)"
