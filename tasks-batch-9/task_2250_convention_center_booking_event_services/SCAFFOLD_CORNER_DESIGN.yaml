      - name: layer_cascade_from_the_hold_sweep
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints[POST /convention-center/_ops/hold-sweep]
        excluded_because:
          difficulty_instance: transitive_cascade / expired_challenge_sweep_cascades_hold_release_to_booking_license_and_service_order
          rationale: "The named §1.8 instance already verifies the four-level chain from an expired challenge down to the service order end to end."

      - name: layer_cascade_from_license_termination
        claim_type: cascading_side_effects
        grounds:
