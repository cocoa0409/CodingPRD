            - call: "POST /permits"
              payload: { dam_id: "${dam_id}", permit_type: "CONSTRUCTION", scope_description: "Raise the dam crest by 4 feet.", estimated_project_cost_cents: 8000000, proposed_start_date: "2026-10-01T00:00:00Z" }
