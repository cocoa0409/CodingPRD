          rationale: "That §1.8 instance shows the EMPLOYER_SCOPE variant firing on the employer report endpoint and the PARTNER_SCOPE variant on the category-demand endpoint over identical data, which is the variant-selection claim."

      - name: statement_totals_reconcile_from_the_already_rounded_line_shares
