            - { call: "POST /spirit-store/preorder-campaigns/${camp}/open", payload: {}, as: StoreManager }
            - { call: "POST /spirit-store/preorders", payload: { program_id: "${prog}", campaign_id: "${camp}", variant_id: "${var}", customer_user_id: "cust-81", qty: 1 }, as: Customer, as_user_id: "cust-81", captures: { p1: $.data.id } }
            - { call: "POST /spirit-store/preorders/${p1}/pay", payload: { phase: DEPOSIT, amount_cents: 1000 }, as: Customer, as_user_id: "cust-81" }
