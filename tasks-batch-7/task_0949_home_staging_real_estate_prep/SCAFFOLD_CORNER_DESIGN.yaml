      # ---------- Creation / defaults / computed / system / constraints ----------
      - name: brokerage_creation_returns_201_with_declared_defaults
        claim_type: Creation
        grounds: ["entities.Brokerage.fields.authorization_cap", "entities.Brokerage.fields.tax_exempt", "endpoints.POST./staging/brokerages"]
        distinguishing_aspect: "Creating a brokerage with only name and license_code applies authorization_cap 4500.00, tax_exempt false and open_project_count 0, and returns 201 with version 1."
        test_recipe:
          setup: ["Empty database with the clock at 2026-06-01T00:00:00Z."]
          setup_api_calls: *clk
          trigger:
            - call: "POST /staging/brokerages"
              payload: { name: "Cedar Realty", license_code: "BR-4410" }
              as: PlatformAdmin
              captures: { brk_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Brokerage.${brk_id}.authorization_cap == 4500.00"
            - "Brokerage.${brk_id}.tax_exempt == false"
            - "Brokerage.${brk_id}.open_project_count == 0"
            - "Brokerage.${brk_id}.version == 1"

      - name: client_effective_cap_is_min_of_personal_and_brokerage
        claim_type: Computed Fields
        grounds: ["calculations.effective_authorization_cap", "entities.Client.fields.effective_authorization_cap"]
        distinguishing_aspect: "A LISTING_AGENT with personal_authorization_cap 9000.00 under a brokerage capped at 6000.00 gets effective_authorization_cap 6000.00, not 9000.00."
        test_recipe:
          setup: ["A brokerage with authorization_cap 6000.00."]
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/brokerages"
              payload: { name: "Cedar Realty", license_code: "BR-4410", authorization_cap: 6000.00 }
              as: PlatformAdmin
              captures: { brk_id: "$.data.id" }
          trigger:
            - call: "POST /staging/clients"
              payload: { client_type: "LISTING_AGENT", full_name: "Milo Park", email: "milo@ex.com", brokerage_id: "${brk_id}", personal_authorization_cap: 9000.00 }
              as: PlatformAdmin
              captures: { agent_id: "$.data.id" }
          assert:
            - "Client.${agent_id}.personal_authorization_cap == 9000.00"
            - "Client.${agent_id}.effective_authorization_cap == 6000.00"
            - "Client.${agent_id}.consent_on_file == false"

      - name: seller_effective_cap_is_the_hard_cap
        claim_type: Computed Fields
        grounds: ["calculations.effective_authorization_cap", "entities.Client.fields.client_type"]
        distinguishing_aspect: "A SELLER carries effective_authorization_cap 15000.00 regardless of personal_authorization_cap, because the calculation ignores the personal number on that arm."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: *clk
          trigger:
            - call: "POST /staging/clients"
              payload: { client_type: "SELLER", full_name: "Dana Reyes", email: "dana@ex.com", personal_authorization_cap: 100.00 }
              as: PlatformAdmin
              captures: { seller_id: "$.data.id" }
          assert:
            - "Client.${seller_id}.effective_authorization_cap == 15000.00"
            - "Client.${seller_id}.personal_authorization_cap == 100.00"

      - name: property_initial_prep_state_is_new
        claim_type: Defaults
        grounds: ["entities.Property.fields.prep_state", "state_machines.Property.initial_state"]
        distinguishing_aspect: "A freshly created Property carries prep_state NEW and version 1 even though occupancy was supplied."
        test_recipe:
          setup: ["One SELLER client."]
          setup_api_calls:
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/clients"
              payload: { client_type: "SELLER", full_name: "Dana Reyes", email: "dana@ex.com" }
              as: PlatformAdmin
              captures: { seller_id: "$.data.id" }
          trigger:
            - call: "POST /staging/properties"
              payload: { owner_client_id: "${seller_id}", address_line: "18 Larch Ct", city: "Bend", state_code: "OR", distance_miles: 22.0, occupancy: "VACANT", room_count: 4 }
              as: StagingCoordinator
              captures: { prop_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Property.${prop_id}.prep_state == NEW"
            - "Property.${prop_id}.version == 1"
            - "Property.${prop_id}.occupancy == VACANT"

      - name: listing_initial_state_active_with_zero_fallouts
        claim_type: Initial State
        grounds: ["state_machines.Listing.initial_state", "entities.Listing.fields.fallout_count", "entities.Listing.fields.under_contract_at"]
        distinguishing_aspect: "A new Listing starts ACTIVE with fallout_count 0 and both under_contract_at and closed_at null."
        test_recipe:
          setup: ["A seller, an agent and a VACANT property."]
          setup_api_calls: &listing_ready
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staging/clients"
              payload: { client_type: "SELLER", full_name: "Dana Reyes", email: "dana@ex.com" }
              as: PlatformAdmin
              captures: { seller_id: "$.data.id" }
            - call: "POST /staging/clients"
              payload: { client_type: "LISTING_AGENT", full_name: "Milo Park", email: "milo@ex.com", personal_authorization_cap: 4500.00 }
              as: PlatformAdmin
              captures: { agent_id: "$.data.id" }
            - call: "POST /staging/properties"
              payload: { owner_client_id: "${seller_id}", address_line: "18 Larch Ct", city: "Bend", state_code: "OR", distance_miles: 22.0, occupancy: "VACANT", room_count: 4 }
              as: StagingCoordinator
              captures: { prop_id: "$.data.id" }
          trigger:
            - call: "POST /staging/listings"
              payload: { property_id: "${prop_id}", listing_agent_client_id: "${agent_id}", mls_number: "MLS-9001", list_price: 749000.00 }
              as: StagingCoordinator
              captures: { listing_id: "$.data.id" }
          assert:
            - "Listing.${listing_id}.listing_state == ACTIVE"
            - "Listing.${listing_id}.fallout_count == 0"
            - "Listing.${listing_id}.under_contract_at is null"
            - "Listing.${listing_id}.closed_at is null"

      - name: package_tier_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds: ["entities.PackageTier.common_fields", "endpoints.POST./staging/package-tiers"]
        distinguishing_aspect: "PackageTier declares common_fields false, so the created row exposes id and created_at but NO version and NO updated_at, and §1.5 declares no update endpoint for it."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: *clk
          trigger:
            - call: "POST /staging/package-tiers"
              payload: { tier_code: "SIGNATURE", tier_rank: 2, room_cap: 3, included_accessory_sets: 2, included_photo_sessions: 2, base_price: 4200.00, monthly_rent_rate: 950.00 }
              as: PlatformAdmin
              captures: { tier_sig: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "PackageTier.${tier_sig}.tier_code == SIGNATURE"
            - "PackageTier.${tier_sig}.room_cap == 3"
            - "response.data has no field named version"
            - "response.data has no field named updated_at"

      - name: vendor_defaults_applied_when_terms_omitted
        claim_type: Defaults
        grounds: ["entities.VendorPartner.fields.lead_time_days", "entities.VendorPartner.fields.min_lease_cycles", "entities.VendorPartner.fields.cancel_cutoff_days", "entities.VendorPartner.fields.rate_multiplier"]
        distinguishing_aspect: "Creating a vendor with only a name applies lead_time_days 7, min_lease_cycles 4, cancel_cutoff_days 4, rate_multiplier 1.35 and status ACTIVE."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: *clk
          trigger:
            - call: "POST /staging/vendors"
              payload: { name: "Metro Rentals" }
              as: WarehouseManager
              captures: { vendor_id: "$.data.id" }
          assert:
            - "VendorPartner.${vendor_id}.lead_time_days == 7"
            - "VendorPartner.${vendor_id}.min_lease_cycles == 4"
            - "VendorPartner.${vendor_id}.cancel_cutoff_days == 4"
            - "VendorPartner.${vendor_id}.rate_multiplier == 1.35"
            - "VendorPartner.${vendor_id}.status == ACTIVE"

      - name: inventory_item_system_fields_are_server_minted
        claim_type: System Fields
        grounds: ["entities.InventoryItem.fields.status", "entities.InventoryItem.fields.condition_grade", "entities.InventoryItem.fields.times_deployed"]
        distinguishing_aspect: "A new InventoryItem is stamped status AVAILABLE, condition_grade A and times_deployed 0 by the server; the id is a bare UUID with no type prefix."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: *clk
          trigger:
            - call: "POST /staging/inventory-items"
              payload: { sku: "SOFA-1", category: "SOFA", acquired_at: "2024-01-05T00:00:00Z", replacement_value: 1200.00, monthly_rate: 240.00 }
              as: WarehouseManager
              captures: { item_a: "$.data.id" }
          assert:
            - "InventoryItem.${item_a}.status == AVAILABLE"
            - "InventoryItem.${item_a}.condition_grade == A"
            - "InventoryItem.${item_a}.times_deployed == 0"
            - "InventoryItem.${item_a}.version == 1"
            - "InventoryItem.${item_a}.id matches the bare UUID form with no prefix"

      - name: inventory_item_invalid_category_enum_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_ENUM]", "entities.InventoryItem.fields.category"]
        distinguishing_aspect: "A category outside the declared eight-member set is rejected with ERR_INVALID_ENUM and HTTP 422; no InventoryItem row is created."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: *clk
          trigger:
            - call: "POST /staging/inventory-items"
              payload: { sku: "SOFA-2", category: "HAMMOCK", acquired_at: "2024-01-05T00:00:00Z", replacement_value: 1200.00, monthly_rate: 240.00 }
              as: WarehouseManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_INVALID_ENUM"

      - name: inventory_item_missing_required_sku_rejected
        claim_type: Required Fields
        grounds: ["validations[priority=6]", "errors[ERR_MISSING_FIELD]"]
        distinguishing_aspect: "Omitting sku — declared without a trailing question mark in the endpoint input — returns ERR_MISSING_FIELD with HTTP 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: *clk
          trigger:
            - call: "POST /staging/inventory-items"
              payload: { category: "SOFA", acquired_at: "2024-01-05T00:00:00Z", replacement_value: 1200.00, monthly_rate: 240.00 }
