            - "${pc1_v1} == ${pc1_v0} + 1 (creating the first report incremented Piece.version by exactly 1)"
            - "RepairDisposition.${ncr1_id}.status == SUPERSEDED"
            - "RepairDisposition.${ncr2_id}.status == OPEN"
            - "GET /pieces/${pc1_id}/repair-dispositions returns exactly 2 rows"
            - "Piece.${pc1_id}.qc_status == NONCONFORMING and qc_hold_reason == OPEN_NCR"

      - name: stale_yard_slot_version_rejects_a_second_placement
