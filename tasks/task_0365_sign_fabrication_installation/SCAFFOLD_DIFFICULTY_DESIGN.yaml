# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Sign Fabrication & Installation — 9 rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_provisional_vs_change_order_rescope_on_estimate_domain
        grounds:
          - calculations.estimate_total
          - calculations.change_order_delta
          - entities.Estimate.fields.total_cents
          - entities.ChangeOrder.fields.delta_total_cents
        distinguishing_aspect: |
          estimate_total prices the sign once at quote time and change_order_delta re-prices the
          WHOLE sign under the proposed scope then diffs against the accepted baseline — same
          formula engine, two valid results: Estimate.total_cents == 24300 at quote vs a signed
          ChangeOrder.delta_total_cents == 7200 (re-quote 31500 minus baseline 24300), on the
          Estimate/ChangeOrder pricing domain.
        test_recipe:
          setup:
            - "A project with face 36x24 in aluminum, 3 colors, not illuminated, not rush"
            - "An APPROVED art proof (color_count=3) and a SENT then ACCEPTED estimate (total 24300)"
            - "A PROPOSED change order widening the face to 60 in (substrate held aluminum)"
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "Acme", site_address: "1 Main St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6, illuminated: false, rush: false }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/1.svg", color_count: 3 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "ALUMINUM", valid_until_iso: "2030-01-01T00:00:00Z" }
              as: ShopManager
              captures: { est_id: $.data.id, est_total: $.data.total_cents }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/send"
              payload: {}
              as: ShopManager
            - call: "GET /sign-projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { pv: $.data.version }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/accept"
              payload: { expected_sign_project_version: "${pv}" }
              as: Customer
          trigger:
            - call: "POST /sign-projects/${proj_id}/change-orders"
              payload: { reason: "wider face", new_face_width_in: 60 }
              as: ShopManager
              captures: { co_id: $.data.id, co_delta: $.data.delta_total_cents }
          assert:
            - "Estimate.${est_id}.total_cents == 24300"
            - "ChangeOrder.${co_id}.delta_total_cents == 7200"

      - name: warranty_coverage_vs_equipment_requirement_dual_threshold_domains
        grounds:
          - calculations.warranty_coverage
          - calculations.equipment_requirement
          - entities.WarrantyClaim.fields.covered
          - entities.InstallJob.fields.required_equipment_class
        distinguishing_aspect: |
          warranty_coverage decides a boolean on the WarrantyClaim domain (covered from a day-count
          window off install date) while equipment_requirement decides an enum on the InstallJob
          domain (BUCKET_TRUCK vs LADDER from height + obstruction) — two distinct entity domains
          each running a valid threshold calc producing different result types (covered==true vs
          required_equipment_class=="BUCKET_TRUCK").
        test_recipe:
          setup:
            - "Clock at 2026-06-01T10:00:00Z; a fully INSTALLED project installed at that instant on a BUCKET_TRUCK job (placement 25 ft)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: ShopManager
            - call: "POST /sign-projects"
              payload: { customer_name: "Tall Co", site_address: "9 High Rd", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 25, illuminated: false, rush: false }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/2.svg", color_count: 3 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "ALUMINUM", valid_until_iso: "2030-01-01T00:00:00Z" }
              as: ShopManager
              captures: { est_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/send"
              payload: {}
              as: ShopManager
            - call: "GET /sign-projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { pv: $.data.version }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/accept"
              payload: { expected_sign_project_version: "${pv}" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/site-surveys"
              payload: { measured_clearance_ft: 30, overhead_obstruction: false, ground_bearing_ok: true }
              as: Surveyor
              captures: { survey_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/site-surveys/${survey_id}/decide"
              payload: { result: "PASS" }
              as: Surveyor
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders"
              payload: {}
              as: ShopManager
              captures: { wo_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders/${wo_id}/start"
              payload: {}
              as: ShopManager
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders/${wo_id}/qc-hold"
              payload: {}
              as: ShopManager
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders/${wo_id}/qc-decide"
              payload: { qc_pass: true }
              as: ShopManager
            - call: "POST /crews"
              payload: { name: "Aerial Crew", certified_aerial: true, active: true }
              as: ShopManager
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { asset_tag: "BT-1", equipment_class: "BUCKET_TRUCK", max_reach_ft: 40, in_service: true }
              as: ShopManager
              captures: { equip_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/install-jobs"
              payload: { work_order_id: "${wo_id}", crew_id: "${crew_id}", equipment_id: "${equip_id}", window_start_iso: "2026-06-01T09:00:00Z", window_end_iso: "2026-06-01T10:00:00Z" }
              as: ShopManager
              captures: { job_id: $.data.id, req_class: $.data.required_equipment_class }
            - call: "POST /sign-projects/${proj_id}/install-jobs/${job_id}/dispatch"
              payload: {}
              as: ShopManager
            - call: "POST /sign-projects/${proj_id}/install-jobs/${job_id}/complete"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /sign-projects/${proj_id}/warranty-claims"
              payload: { install_job_id: "${job_id}", defect_kind: "COSMETIC", reported_iso: "2026-07-01T10:00:00Z" }
              as: Customer
              captures: { claim_id: $.data.id }
          assert:
            - "InstallJob.${job_id}.required_equipment_class == BUCKET_TRUCK"
            - "WarrantyClaim.${claim_id}.covered == true"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: estimate_total_nonlinear_three_input_interaction
        grounds:
          - calculations.estimate_total
          - entities.Estimate.fields.total_cents
          - entities.SignProject.fields.illuminated
        distinguishing_aspect: |
          Mode (a): estimate_total has >3 inputs (area, substrate rate, color_count, substrate labor
          multiplier, illuminated, rush) with non-linear interaction — labor = colors*setup*mult,
          surcharges nest (rush stacks on the illum-inflated base), yielding total_cents == 74106 for
          acrylic 48x36 4-color illuminated+rush, not a linear sum of independent terms.
        test_recipe:
          setup:
            - "A project face 48x36 acrylic substrate, 4 colors, illuminated AND rush both true"
            - "An APPROVED proof with color_count=4"
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "Lit Co", site_address: "5 Glow Ave", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 48, face_height_in: 36, placement_height_ft: 6, illuminated: true, rush: true }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/3.svg", color_count: 4 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
          trigger:
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "ACRYLIC", valid_until_iso: "2030-01-01T00:00:00Z" }
              as: ShopManager
              captures: { est_id: $.data.id }
          assert:
            - "Estimate.${est_id}.area_sqft == 12"
            - "Estimate.${est_id}.subtotal_cents == 53700"
            - "Estimate.${est_id}.surcharge_cents == 20406"
            - "Estimate.${est_id}.total_cents == 74106"

      - name: surcharge_pinned_rounding_order_illum_before_rush
        grounds:
          - calculations.estimate_total
          - entities.Estimate.fields.surcharge_cents
          - entities.Estimate.fields.total_cents
        distinguishing_aspect: |
          Mode (b): the scaffold pins illumination surcharge BEFORE rush, each round_half_up'd
          separately — illum 8055 then rush on the inflated base 61755 -> 12351 (surcharge 20406);
          summing percentages first or rounding once at the end would differ, so the pinned order is
          observable as surcharge_cents == 20406 (distinct mode from the >3-input non-linearity above).
        test_recipe:
          setup:
            - "Same acrylic 48x36 4-color illuminated+rush estimate as the combinatorial sibling"
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "Order Co", site_address: "7 Round Rd", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 48, face_height_in: 36, placement_height_ft: 6, illuminated: true, rush: true }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/4.svg", color_count: 4 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
          trigger:
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "ACRYLIC", valid_until_iso: "2030-01-01T00:00:00Z" }
              as: ShopManager
              captures: { est_id: $.data.id }
          assert:
            - "Estimate.${est_id}.surcharge_cents == 20406"
            - "Estimate.${est_id}.total_cents == 74106"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: art_proof_reject_revision_cycle
        grounds:
          - state_machines.ArtProof.SUBMITTED_to_REJECTED
          - state_machines.ArtProof.REJECTED_to_SUPERSEDED
          - entities.ArtProof.fields.revision_no
        distinguishing_aspect: |
          ArtProof is cyclic: a REJECTED proof is closed to SUPERSEDED when a new revision is created,
          and the new ArtProof gets revision_no == 2 (prior max + 1), looping the design phase — not a
          forward-only A->B->C pipeline.
        test_recipe:
          setup:
            - "A project in DESIGN with one proof revision_no=1 SUBMITTED then REJECTED"
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "Loop Co", site_address: "2 Spin St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/r1.svg", color_count: 2 }
              as: Designer
              captures: { proof1_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof1_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof1_id}/decision"
              payload: { decision: "REJECT", reject_reason: "wrong font" }
              as: Customer
          trigger:
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/r2.svg", color_count: 2 }
              as: Designer
              captures: { proof2_id: $.data.id }
          assert:
            - "ArtProof.${proof2_id}.revision_no == 2"
            - "ArtProof.${proof2_id}.status == DRAFT"
            - "ArtProof.${proof1_id}.status == SUPERSEDED"

      - name: fabrication_work_order_qc_fork_branch
        grounds:
          - state_machines.FabricationWorkOrder.QC_HOLD_to_READY_FOR_INSTALL
          - state_machines.FabricationWorkOrder.QC_HOLD_to_IN_PRODUCTION
          - entities.FabricationWorkOrder.fields.status
        distinguishing_aspect: |
          FabricationWorkOrder branches at QC_HOLD: qc_pass=false loops back to IN_PRODUCTION (rework
          cycle) while qc_pass=true forks forward to READY_FOR_INSTALL — divergent side-effect sets per
          branch on a different entity than ArtProof, so the non-linearity sits on two distinct entities.
        test_recipe:
          setup:
            - "A project advanced to FABRICATION with a work order moved RELEASED->IN_PRODUCTION->QC_HOLD"
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "QC Co", site_address: "3 Test Ln", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/q.svg", color_count: 3 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "ALUMINUM", valid_until_iso: "2030-01-01T00:00:00Z" }
              as: ShopManager
              captures: { est_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/send"
              payload: {}
              as: ShopManager
            - call: "GET /sign-projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { pv: $.data.version }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/accept"
              payload: { expected_sign_project_version: "${pv}" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/site-surveys"
              payload: { measured_clearance_ft: 30, overhead_obstruction: false, ground_bearing_ok: true }
              as: Surveyor
              captures: { survey_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/site-surveys/${survey_id}/decide"
              payload: { result: "PASS" }
              as: Surveyor
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders"
              payload: {}
              as: ShopManager
              captures: { wo_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders/${wo_id}/start"
              payload: {}
              as: ShopManager
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders/${wo_id}/qc-hold"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders/${wo_id}/qc-decide"
              payload: { qc_pass: false }
              as: ShopManager
          assert:
            - "FabricationWorkOrder.${wo_id}.status == IN_PRODUCTION"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: change_order_apply_three_hop_cascade
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_APPLIED
          - state_machines.FabricationWorkOrder.RELEASED_to_CANCELLED
          - state_machines.SignProject.PERMITTING_to_FABRICATION
          - calculations.contract_total
        distinguishing_aspect: |
          Depth-3 cascade from ChangeOrder APPROVED->APPLIED: (1) apply mutates SignProject scope+ledger
          (contract_total_cents 24300 -> 31500); (2) that ledger/scope mutation forces the in-flight
          FabricationWorkOrder IN_PRODUCTION -> CANCELLED; (3) the WO cancellation forces creation of a
          new RELEASED WO and resets project.phase to FABRICATION — each hop caused by the prior hop.
        test_recipe:
          setup:
            - "A project in FABRICATION (aluminum 36x24, accepted estimate total 24300, contract 24300)"
            - "Work order WO1 advanced to IN_PRODUCTION; an APPROVED change order widening face to 60 (delta 7200)"
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "Casc Co", site_address: "4 Chain St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/c.svg", color_count: 3 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "ALUMINUM", valid_until_iso: "2030-01-01T00:00:00Z" }
              as: ShopManager
              captures: { est_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/send"
              payload: {}
              as: ShopManager
            - call: "GET /sign-projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { pv1: $.data.version }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/accept"
              payload: { expected_sign_project_version: "${pv1}" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/site-surveys"
              payload: { measured_clearance_ft: 30, overhead_obstruction: false, ground_bearing_ok: true }
              as: Surveyor
              captures: { survey_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/site-surveys/${survey_id}/decide"
              payload: { result: "PASS" }
              as: Surveyor
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders"
              payload: {}
              as: ShopManager
              captures: { wo1_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/fabrication-work-orders/${wo1_id}/start"
              payload: {}
              as: ShopManager
            - call: "POST /sign-projects/${proj_id}/change-orders"
              payload: { reason: "wider", new_face_width_in: 60 }
              as: ShopManager
              captures: { co_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/change-orders/${co_id}/approve"
              payload: {}
              as: Customer
            - call: "GET /sign-projects/${proj_id}"
              payload: {}
              as: ShopManager
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /sign-projects/${proj_id}/change-orders/${co_id}/apply"
              payload: { expected_sign_project_version: "${pv2}" }
              as: ShopManager
          assert:
            - "ChangeOrder.${co_id}.status == APPLIED"
            - "SignProject.${proj_id}.contract_total_cents == 31500"
            - "FabricationWorkOrder.${wo1_id}.status == CANCELLED"
            - "SignProject.${proj_id}.phase == FABRICATION"

      - name: project_cancel_two_hop_supersede_cascade
        grounds:
          - state_machines.SignProject.ESTIMATING_to_CANCELLED
          - state_machines.Estimate.DRAFT_to_SENT
          - entities.Estimate.fields.status
          - entities.ArtProof.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (project cancel in ESTIMATING): (1) cancel sets
          phase CANCELLED; (2) that project mutation forces every non-terminal Estimate (a SENT
          estimate) to SUPERSEDED — the estimate's status flip is caused by the project transition,
          not by a direct call on the estimate, and originates from a different transition than the
          change-order cascade.
        test_recipe:
          setup:
            - "A project in ESTIMATING (one APPROVED proof) with a SENT estimate not yet accepted"
          setup_api_calls:
            - call: "POST /sign-projects"
              payload: { customer_name: "Cancel Co", site_address: "6 Stop St", jurisdiction_code: "COUNTY_C", sign_type: "WALL", face_width_in: 36, face_height_in: 24, placement_height_ft: 6 }
              as: ShopManager
              captures: { proj_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs"
              payload: { artwork_uri: "s3://a/x.svg", color_count: 3 }
              as: Designer
              captures: { proof_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /sign-projects/${proj_id}/art-proofs/${proof_id}/decision"
              payload: { decision: "APPROVE" }
              as: Customer
            - call: "POST /sign-projects/${proj_id}/estimates"
              payload: { art_proof_id: "${proof_id}", substrate: "ALUMINUM", valid_until_iso: "2030-01-01T00:00:00Z" }
              as: ShopManager
              captures: { est_id: $.data.id }
            - call: "POST /sign-projects/${proj_id}/estimates/${est_id}/send"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /sign-projects/${proj_id}/cancel"
              payload: {}
              as: ShopManager
          assert:
            - "SignProject.${proj_id}.phase == CANCELLED"
            - "Estimate.${est_id}.status == SUPERSEDED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_safety_on_survey_decide
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.SiteSurvey.PENDING_to_PASSED
        distinguishing_aspect: |
          A PASS decision on an already-FAILED survey that ALSO has insufficient clearance violates
          both state (priority 5, ERR_INVALID_STATE) and business_safety (priority 7,
          ERR_CLEARANCE_INSUFFICIENT); the state check wins so the response is ERR_INVALID_STATE — a
          state vs business_safety category pair.
        test_recipe:
          setup:
