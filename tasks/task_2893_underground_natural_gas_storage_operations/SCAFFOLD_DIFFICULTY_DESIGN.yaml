  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ticket_charge_six_step_order_with_discount_tier_keyed_on_commodity_only
        grounds:
          - calculations.ticket_charge_breakdown
          - entities.GasMovementTicket.fields.total_charge_usd
          - entities.GasMovementTicket.fields.volume_discount_usd
          - entities.GasMovementTicket.fields.fuel_charge_usd
        distinguishing_aspect: |
          One ticket confirm composes five dependent quantities in a pinned order: retention 1.2% of
          92000 -> 1104.000, net 90896.000, commodity 92000 x 0.0450 -> 4140.00, discount tier keyed on
          the commodity charge alone (4140.00 < 5000 -> 0%), fuel 1104.000 x 3.4500 -> 3808.80, total
          7948.80. An implementation that keys the discount tier on commodity + fuel (7948.80 >= 5000)
          applies 2% and returns 7866.00, so the single total_charge_usd literal separates the pinned
          order from the plausible-looking circular order, and the same call must simultaneously move
          working gas by the actual volume, the retained fuel pool by the retention and the contract
          balance by the net.
        test_recipe:
          setup:
            - "Field F_STD (opening 3,000,000 Dth) with one INJECTION_WITHDRAWAL well rated 600000 Dth/day; season INJECTION."
            - "FIRM contract at commodity_rate 0.0450 USD/Dth and index_price 3.4500 USD/Dth, daily injection right 100000 Dth."
            - "A CONFIRMED nomination of 90000 Dth INJECTION for gas day 2026-08-02 and a PENDING ticket metering 92000 Dth (2.22% overrun, inside the 5% tolerance)."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "AUR-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CT-CHARGE", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /storage-contracts/${c1}/activate"
              payload: {}
              as: SchedulingCoordinator
              captures: { c1_v1: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-02", direction: "INJECTION", nominated_volume_dth: 90000, expected_contract_version: "${c1_v1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n1: $.data.id }
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /gas-movement-tickets"
              payload: { nomination_id: "${n1}", well_id: "${w1}", actual_volume_dth: 92000 }
              as: FieldOperator
              captures: { t1: $.data.id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { f1_v1: $.data.version }
          trigger:
            - call: "POST /gas-movement-tickets/${t1}/confirm"
