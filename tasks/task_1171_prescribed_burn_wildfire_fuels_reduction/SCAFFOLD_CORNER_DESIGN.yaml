          trigger:
            - { call: "POST /burn-plans/${plan}/submit", payload: {}, as: BurnBoss, as_user_id: "${bossA}", captures: {st_w: $.data.status, v_w: $.data.version} }
            - { call: "GET /burn-plans/${plan}", payload: {}, as: Any, captures: {st_r: $.data.status, v_r: $.data.version} }
          assert:
            - "st_w == SUBMITTED and v_w == 2"
            - "st_r == st_w and v_r == v_w (write visible in the same request and immediately after)"
