            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "VE", tank_capacity_gallons: 5000, expected_mpg_min: 1, expected_mpg_max: 50, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Sky", pin: "1717" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "0302", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 100, unit_price_cents: 400, odometer: 100, jurisdiction: "CA" }
              as: Merchant
              captures: { tx_id: $.data.id }
          trigger:
            - call: "POST /transactions/${tx_id}/void"
              payload: {}
