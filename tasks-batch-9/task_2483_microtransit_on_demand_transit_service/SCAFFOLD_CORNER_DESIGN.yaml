      - name: no_role_cannot_reach_another_roles_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - roles.ZoneAdmin.exclusive_operations
          - roles.Dispatcher.exclusive_operations
          - roles.FinanceAnalyst.exclusive_operations
          - roles.FundingAgencyAuditor.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "Six crossed attempts on live, otherwise-valid resources: Dispatcher approving a stop, ZoneAdmin creating a pool assignment, Dispatcher publishing a forecast, FinanceAnalyst certifying, FundingAgencyAuditor submitting, and DriverUser closing a block. Every one is 403 with no state change, which rules out an implementation that only screens the create endpoints."
