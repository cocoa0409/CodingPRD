      - name: refinance_execute_replaces_loan
        claim_type: side_effect_execution
        grounds: [state_machines.DispositionDecision.RATIFIED_to_EXECUTED, state_machines.Loan.CURRENT_to_REFINANCED, "errors[ERR_LOAN_NOT_REPORTABLE]"]
        distinguishing_aspect: "REFINANCE execution retires the old loan (covenants WAIVED) and originates the new loan atomically; the old loan then rejects lender-report submission with ERR_LOAN_NOT_REPORTABLE."
        test_recipe:
          setup:
            - "FIX_A1 month-1 (actuals RENT 4,000,000 / CAM 500,000 -> annualized NOI 42,000,000); loan 300M @ 1000bps maturing 2027-06-30; MIN_DSCR covenant 12,500 with a recorded PASS test (measured 14,000 — arms refinance_signal's DSCR leg >= 14,000)"
            - "Valuation 500,000,000 eff 2026-07-01 CONFIRMED (LTV 6,000 <= 6,000 — inclusive leg); months_to_maturity 10 <= 18"
            - "REFINANCE decision created by am-1, ratified by ic-1"
