              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /upfront/campaigns/${c_id}/fund"
              payload: { amount_cents: 4000000 }
              as: AdvertiserClient
              as_user_id: "${adv_id}"
            - call: "POST /upfront/campaigns/${c_id}/fund"
              payload: { amount_cents: 6000000 }
              as: AdvertiserClient
              as_user_id: "${adv_id}"
          assert:
            - "after the first deposit funding_status == 'PARTIALLY_FUNDED' and funded_cents == 4000000"
            - "after the second deposit funding_status == 'FUNDED' and funded_cents == 10000000"
            - "Campaign.${c_id}.plan_status == 'DRAFT' and Campaign.${c_id}.plan_posture == 'WITHIN_PLAN'"
            - "Campaign.${c_id}.version == 3"

