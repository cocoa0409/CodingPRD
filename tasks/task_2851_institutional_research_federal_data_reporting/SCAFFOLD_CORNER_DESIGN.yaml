            - "CohortDefinition.${coh}.status == DRAFT"
            - "FrozenFile.${ff1}.status == LOCKED (the census lock already ran on it)"

      - name: corner_sm_census_lock_side_effects_lock_every_active_extract
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ReportingCycle.OPEN_to_CENSUS_LOCKED
          - state_machines.FrozenFile.ACTIVE_to_LOCKED
          - calculations.cycle_active_record_count
          - endpoints[POST /ir/reporting-cycles/{cycle_id}/census-lock]
        distinguishing_aspect: |
          One census-lock call performs four declared effects at once: posture CENSUS_LOCKED,
          census_locked_at stamped from the clock, cycle version 4 (one bump per extract
          registration plus the lock itself), and both extracts moved ACTIVE -> LOCKED while
          active_record_count stays 1250.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is OPEN with two ACTIVE extracts: ENROLLMENT record_count 1000 and COMPLETIONS record_count 250."
            - "The logical clock is moved to the census date 2026-10-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60115", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "GET /ir/reporting-cycles/${cyc}"
              payload: {}
              as: RegistrarOfficer
              captures: { cyc_v2: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "COMPLETIONS", record_count: 250, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60116", expected_cycle_version: "${cyc_v2}" }
              as: RegistrarOfficer
              captures: { ff2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: RegistrarOfficer
          trigger:
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
          assert:
            - "HTTP status == 200"
            - "ReportingCycle.${cyc}.snapshot_posture == CENSUS_LOCKED"
            - "ReportingCycle.${cyc}.census_locked_at == \"2026-10-15T00:00:00.000Z\""
            - "ReportingCycle.${cyc}.version == 4"
            - "ReportingCycle.${cyc}.active_record_count == 1250"
            - "FrozenFile.${ff1}.status == LOCKED and FrozenFile.${ff1}.version == 2"
            - "FrozenFile.${ff2}.status == LOCKED and FrozenFile.${ff2}.version == 2"
            - "GET /ir/frozen-files?cycle_id=${cyc}&status=LOCKED -> total_count == 2"

      - name: corner_sm_census_lock_requires_an_active_snapshot
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=12]
          - errors[ERR_NO_ACTIVE_SNAPSHOT]
          - state_machines.ReportingCycle.OPEN_to_CENSUS_LOCKED
        distinguishing_aspect: |
          With the clock already past the census date but no extract registered, census-lock is
          refused with ERR_NO_ACTIVE_SNAPSHOT (409) rather than ERR_CENSUS_DATE_NOT_REACHED, and
          the posture stays OPEN; registering one extract makes the identical call succeed.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is OPEN with zero FrozenFile rows; the logical clock is at 2026-11-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
          trigger:
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
              captures: { err: $.data.error_id }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60117", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
          assert:
            - "First census-lock: HTTP status == 409 and response.error_id == \"ERR_NO_ACTIVE_SNAPSHOT\""
            - "After the refusal: ReportingCycle.${cyc}.snapshot_posture == OPEN and census_locked_at is null and version == 1"
            - "Second census-lock: HTTP status == 200 and snapshot_posture == CENSUS_LOCKED"
            - "FrozenFile.${ff1}.status == LOCKED"
            - "ReportingCycle.${cyc}.active_record_count == 1000"

      - name: corner_sm_second_census_lock_is_rejected_not_replayed
        claim_type: Idempotency
        grounds:
          - validations[priority=9]
          - errors[ERR_INVALID_CYCLE_STATE]
          - state_machines.ReportingCycle.OPEN_to_CENSUS_LOCKED
        distinguishing_aspect: |
          Replaying census-lock on an already CENSUS_LOCKED cycle returns
          ERR_INVALID_CYCLE_STATE (409) and leaves census_locked_at at the first instant
          (2026-11-01T00:00:00.000Z) — the transition is not idempotent and never re-stamps.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED; one ACTIVE-then-LOCKED ENROLLMENT extract; clock left at 2026-11-01T00:00:00Z, then advanced to 2026-12-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60118", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: RegistrarOfficer
          trigger:
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and response.error_id == \"ERR_INVALID_CYCLE_STATE\""
            - "ReportingCycle.${cyc}.census_locked_at == \"2026-11-01T00:00:00.000Z\" (not re-stamped to 2026-12-01)"
            - "ReportingCycle.${cyc}.version == 3 (unchanged by the refused replay)"
            - "ReportingCycle.${cyc}.snapshot_posture == CENSUS_LOCKED"

      - name: corner_sm_submitted_component_is_locked_and_last_submit_archives_the_cycle
