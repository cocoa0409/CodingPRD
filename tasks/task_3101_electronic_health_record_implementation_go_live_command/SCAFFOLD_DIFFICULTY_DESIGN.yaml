            - "the empty-set complete-validation returns 422 and error_id == ERR_CHANNEL_NOT_VALIDATED"
            - "after 20 validated messages (POST /interface-channels/${ch_id}/messages with message_code DICOM_STOW then POST /interface-messages/${id}/validate) plus 1 rejected message the rate is 95.24 and complete-validation succeeds with status VALIDATED"
