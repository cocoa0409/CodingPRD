              as: ProgramAdministrator
              captures: { crit_auth1_id: "$.data[0].id", crit_auth2_id: "$.data[1].id", crit_upd1_id: "$.data[2].id", crit_data1_id: "$.data[3].id", crit_vdp1_id: "$.data[4].id" }
            - call: "POST /labeling/manufacturers"
              payload: { legal_name: "Northwind Devices LLC", contact_email: "compliance@northwind.example", enterprise_class: "SMALL", annual_us_revenue_cents: 250000000 }
              as: ProgramAdministrator
              captures: { mfr_small_id: $.data.id }
            - call: "POST /labeling/retailers"
              payload: { retailer_name: "Cedar Home Retail" }
              as: ProgramAdministrator
              captures: { retailer_id: $.data.id }
            - call: "POST /labeling/retailers/${retailer_id}/education-ack"
              payload: { education_program_version: "EDU-2026.1" }
              as: Retailer
              as_user_id: "${retailer_id}"
            - call: "POST /labeling/products"
              payload: { manufacturer_id: "${mfr_small_id}", device_category_id: "${cat_speaker_id}", model_name: "Northwind Speaker S1", sku: "NW-SPK-S1", firmware_version: "1.0.0", declared_support_period_end: "2030-01-01T00:00:00Z", update_policy_disclosed: true, retail_units_shipped: 12000 }
              as: Manufacturer
