# =============================================================================
# SCAFFOLD.yaml — Task 1957: Touring Theatrical Company Management
# Broadway touring production: routing & venue terms, travel/housing per-diem,
# load-in crew calls, cast contracts & understudy/swing coverage, box-office
# settlement & licensor royalty, tech rider compliance, injury replacement,
# tour budget & weekly wrap.
# =============================================================================

scenario: |
  1957. Touring Theatrical Company Management (Broadway touring production): booking route & venue contract terms (guarantee vs split), company travel/housing & per-diem administration, load-in labor & local crew calls, actor contracts, understudies & swing coverage, box office settlement & royalty payment to licensors, tech rider compliance by venue, health/injury replacement protocol, tour budget & weekly wrap

domain_name: touring-theatrical-management
api_prefix: "/"

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine        # settlement waterfall: guarantee-vs-split, tiered marginal royalty
  secondary_archetype: temporal_windowing  # stop routing windows with travel buffers; same-day curtain gaps
  complexity_layers:
    - dual_variant_calculation             # provisional-vs-final settlement; FULL_WEEK vs ACTUAL_DAYS per-diem
    - cascading_side_effects               # injury -> leave -> coverage activation -> track exposure
    - rate_threshold_triggers              # royalty tiers, cancellation penalty windows, OT tiers, recoup flip
    - optimistic_concurrency               # OCC on Tour.version (stop create) and Stop.version (amend)

  entity_topology: flat                    # peer collections with FK references; nested creation only
  state_machine_shape: parallel            # Stop carries booking_status x compliance_status; Settlement is cyclic; InjuryEvent is branching
  relationship_patterns:
    - one_to_many                          # Tour->Stop, Stop->Performance/Settlement/TechRiderCheck/CrewCall/PerDiemStatement
    - cross_aggregate                      # Stop.venue_id; CoverageAssignment joins CharacterTrack x CastMember
  role_model: segregation_of_duties        # settlement submit -> approve -> pay must be three distinct users
  consistency_model: immediate             # every mutation + cascade visible in the same response/read

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: Tour
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Production name" }
      - { name: budget_total_cents, type: integer, source: input, description: "Total tour operating budget", constraints: ">= 0" }
      - { name: capitalization_cents, type: integer, source: input, description: "Amount to recoup before post-recoupment royalty rates apply", constraints: ">= 0" }
      - { name: per_diem_policy, type: enum, source: input, description: "FULL_WEEK | ACTUAL_DAYS — selects the per-diem variant for every PerDiemStatement of this tour" }
      - { name: per_diem_daily_cents, type: integer, source: input, description: "Daily per-diem rate", constraints: "> 0" }
      - { name: royalty_tier_threshold_cents, type: integer, source: input, description: "Producer-share bracket boundary T for marginal royalty", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "PLANNING | ON_TOUR | COMPLETED | CLOSED", default: PLANNING }
      - { name: budget_committed_cents, type: integer, source: computed, description: "Sum of guarantee_cents over stops with booking_status in {CONTRACTED, ADVANCED, READY, PLAYING, CLOSED}" }
      - { name: budget_spent_cents, type: integer, source: computed, description: "Sum of stop cancellation penalties + wrapped stop totals" }
      - { name: budget_available_cents, type: integer, source: computed, description: "budget_total_cents - budget_committed_cents - budget_spent_cents; identity holds after every mutation" }
      - { name: cumulative_producer_net_cents, type: integer, source: computed, description: "Sum of producer_net_cents over WRAPPED stops, in wrap order" }
      - { name: recouped, type: boolean, source: computed, description: "true once cumulative_producer_net_cents >= capitalization_cents (>= boundary); flips only at wrap" }
      - { name: royalty_accrued_cents, type: integer, source: computed, description: "Sum of royalty_cents over settlements in {APPROVED, PAID}; invariant: equals that sum at all times" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: stage_width_ft, type: integer, source: input, description: "Stage width available", constraints: "> 0" }
      - { name: fly_capacity_lines, type: integer, source: input, description: "Fly rail line count", constraints: ">= 0" }
      - { name: power_amps, type: integer, source: input, description: "Available power", constraints: "> 0" }
      - { name: crew_available, type: integer, source: input, description: "Local stagehands the venue can supply per call", constraints: ">= 0" }

  - name: Stop
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id; path-scoped parent" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; booking venue" }
      - { name: play_week_start, type: datetime, source: input, description: "First playable date (ISO date)" }
      - { name: play_week_end, type: datetime, source: input, description: "Last playable date (ISO date, inclusive); must be >= play_week_start" }
      - { name: load_in_date, type: datetime, source: input, description: "Load-in date; must be <= play_week_start" }
      - { name: travel_in_days, type: integer, source: input, description: "Travel days needed from the previous city; drives the routing buffer", constraints: ">= 0" }
      - { name: guarantee_cents, type: integer, source: input, description: "Venue guarantee (floor of venue payment)", constraints: ">= 0" }
      - { name: split_pct, type: number, source: input, description: "Venue percentage of adjusted gross", constraints: "0 <= split_pct <= 100" }
      - { name: advance_sales_cents, type: integer, source: input, description: "Advance box-office sales known at advance time; basis of the provisional estimate", default: 0, constraints: ">= 0" }
      - { name: booking_status, type: enum, source: system, description: "TENTATIVE | CONTRACTED | ADVANCED | READY | PLAYING | CLOSED | WRAPPED | CANCELLED", default: TENTATIVE }
      - { name: compliance_status, type: enum, source: computed, description: "PENDING (no checks) | IN_PROGRESS (>=1 PENDING, none FAIL) | NON_COMPLIANT (any FAIL) | COMPLIANT (>=1 check, all PASS|WAIVED)" }
      - { name: estimated_venue_payment_cents, type: integer, source: computed, description: "Provisional estimate frozen at ADVANCED->READY: max(guarantee, round_half_up(split_pct% x advance_sales_cents))" }
      - { name: cancellation_penalty_cents, type: integer, source: computed, description: "Set at cancel per calc_cancellation_penalty; 0 until cancelled" }
      - { name: wrapped_total_cents, type: integer, source: computed, description: "Money out booked at WRAP: venue_payment + royalty + stop costs" }

  - name: Performance
    parent: Stop
    common_fields: true
    fields:
      - { name: stop_id, type: string, source: system, description: "FK -> Stop.id; path-scoped parent" }
      - { name: perf_date, type: datetime, source: input, description: "Performance date (ISO date); must satisfy play_week_start <= perf_date <= play_week_end" }
      - { name: curtain_time, type: string, source: input, description: "Curtain time HH:MM 24h" }
      - { name: duration_minutes, type: integer, source: input, description: "Running time", constraints: "> 0" }
      - { name: gross_cents, type: integer, source: input, description: "Box office gross recorded when marked PLAYED; 0 is a valid played gross", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PLAYED | CANCELLED", default: SCHEDULED }

  - name: TechRiderCheck
    parent: Stop
    common_fields: true
    fields:
      - { name: stop_id, type: string, source: system, description: "FK -> Stop.id; path-scoped parent" }
      - { name: item, type: enum, source: input, description: "STAGE_WIDTH_FT | FLY_LINES | POWER_AMPS | CREW_MINIMUM" }
      - { name: required_value, type: integer, source: input, description: "Rider-required minimum", constraints: "> 0" }
      - { name: actual_value, type: integer, source: input, description: "Venue actual recorded via PUT; null until recorded", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PENDING | PASS | FAIL | WAIVED; PASS iff actual_value >= required_value (system-computed, >= boundary passes)", default: PENDING }
      - { name: waiver_note, type: string, source: input, description: "Required when waiving a FAIL" }

  - name: Settlement
    parent: Stop
    common_fields: true
    fields:
      - { name: stop_id, type: string, source: system, description: "FK -> Stop.id; auto-created as DRAFT when the stop closes" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DISPUTED | APPROVED | PAID | VOID", default: DRAFT }
      - { name: system_gross_cents, type: integer, source: computed, description: "Sum of gross_cents over PLAYED performances of the stop, frozen at creation" }
      - { name: audited_gross_cents, type: integer, source: input, description: "Venue-audited gross", constraints: ">= 0" }
      - { name: taxes_cents, type: integer, source: input, description: "Ticket taxes deducted first", constraints: ">= 0" }
      - { name: levies_cents, type: integer, source: input, description: "Facility/restoration levies deducted second", constraints: ">= 0" }
      - { name: adjusted_gross_cents, type: integer, source: computed, description: "audited_gross_cents - taxes_cents - levies_cents (fixed deduction order: taxes then levies)" }
      - { name: venue_payment_cents, type: integer, source: computed, description: "max(guarantee_cents, round_half_up(split_pct% x adjusted_gross_cents))" }
      - { name: producer_share_cents, type: integer, source: computed, description: "adjusted_gross_cents - venue_payment_cents; may be negative (producer covers shortfall)" }
      - { name: royalty_cents, type: integer, source: computed, description: "calc_licensor_royalty at APPROVE time, using tour.recouped at that instant; 0 when producer_share_cents <= 0" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID recorded at submit" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID recorded at approve" }
      - { name: dispute_reason, type: string, source: input, description: "Required when status=DISPUTED" }

  - name: CastMember
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id; path-scoped parent" }
      - { name: name, type: string, source: input, description: "Performer name" }
      - { name: contract_type, type: enum, source: input, description: "PRINCIPAL | UNDERSTUDY | SWING | ENSEMBLE" }
      - { name: weekly_salary_cents, type: integer, source: input, description: "Contract weekly salary", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "OFFERED | CONTRACTED | ON_LEAVE | REPLACED | RELEASED", default: OFFERED }
      - { name: bump_shows_accrued, type: integer, source: computed, description: "Count of PLAYED performances this member covered while an ACTIVATED coverage" }
      - { name: bump_pay_cents, type: integer, source: computed, description: "calc_understudy_bump_pay over bump_shows_accrued" }

  - name: CharacterTrack
    parent: Tour
    common_fields: true
    fields:
      - { name: tour_id, type: string, source: system, description: "FK -> Tour.id; path-scoped parent" }
      - { name: track_name, type: string, source: input, description: "Role/track name" }
      - { name: required_covers, type: integer, source: input, description: "Understudy/swing covers the track must have available", constraints: ">= 0" }
      - { name: principal_member_id, type: string, source: input, description: "FK -> CastMember.id; current principal; nullable; a member may be principal of at most one track" }
      - { name: available_covers, type: integer, source: computed, description: "Coverages with status=STANDBY whose cast member status=CONTRACTED" }
      - { name: exposed, type: boolean, source: computed, description: "available_covers < required_covers; required_covers=0 is never exposed" }

  - name: CoverageAssignment
    parent: CharacterTrack
    common_fields: true
    fields:
      - { name: track_id, type: string, source: system, description: "FK -> CharacterTrack.id; path-scoped parent" }
      - { name: cast_member_id, type: string, source: input, description: "FK -> CastMember.id; the covering performer" }
      - { name: kind, type: enum, source: input, description: "UNDERSTUDY | SWING; UNDERSTUDY ranks before SWING in selection" }
      - { name: priority_rank, type: integer, source: input, description: "Selection rank within kind; unique among non-RELEASED coverages of the same track+kind", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "STANDBY | ACTIVATED | SUSPENDED | RELEASED", default: STANDBY }

  - name: InjuryEvent
    parent: CastMember
    common_fields: true
    fields:
      - { name: cast_member_id, type: string, source: system, description: "FK -> CastMember.id; path-scoped parent (the injured performer)" }
      - { name: notes, type: string, source: input, description: "Free-text incident note", default: "" }
      - { name: status, type: enum, source: system, description: "COVERED | REPLACED set at creation by calc_coverage_selection; COVERED may resolve; REPLACED is terminal", default: COVERED }
      - { name: covered_by_coverage_id, type: string, source: system, description: "Audit id of the CoverageAssignment ACTIVATED by this event; null when REPLACED" }

  - name: PerDiemStatement
    parent: Stop
    common_fields: true
    fields:
      - { name: stop_id, type: string, source: system, description: "FK -> Stop.id; path-scoped parent" }
      - { name: cast_member_id, type: string, source: input, description: "FK -> CastMember.id; recipient; at most one statement per (stop, cast member)" }
      - { name: days_present, type: integer, source: input, description: "Days in the stop city this week", constraints: "1 <= days_present <= 7" }
      - { name: travel_days, type: integer, source: input, description: "Of days_present, days traveled (half rate under ACTUAL_DAYS)", constraints: "0 <= travel_days <= min(2, days_present)" }
      - { name: policy_snapshot, type: enum, source: system, description: "FULL_WEEK | ACTUAL_DAYS copied from Tour.per_diem_policy at creation" }
      - { name: daily_rate_cents, type: integer, source: system, description: "Copied from Tour.per_diem_daily_cents at creation" }
      - { name: total_cents, type: integer, source: computed, description: "calc_per_diem over the snapshotted policy and rate" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID", default: ISSUED }

  - name: CrewCall
    parent: Stop
    common_fields: true
    fields:
      - { name: stop_id, type: string, source: system, description: "FK -> Stop.id; path-scoped parent" }
      - { name: call_type, type: enum, source: input, description: "LOAD_IN | LOAD_OUT | SHOW_RUN" }
      - { name: scheduled_start, type: datetime, source: input, description: "Call start (ISO datetime); cancellation penalty measured against the logical clock" }
      - { name: lines, type: array, source: input, description: "Planned positions: [{position, rate_cents_per_hour}]; non-empty; positions unique within the call" }
      - { name: actual_lines, type: array, source: input, description: "Provided at settle: [{position, hours_worked}] matched 1:1 to lines by position" }
      - { name: total_pay_cents, type: integer, source: computed, description: "calc_crew_call_pay over actual_lines; set at SETTLED" }
      - { name: cancellation_penalty_cents, type: integer, source: computed, description: "Per-line 4h x rate, rounded per line then summed, when cancelled < 24h before scheduled_start; else 0" }
      - { name: status, type: enum, source: system, description: "POSTED | SETTLED | CANCELLED", default: POSTED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Tour
    field: status
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ON_TOUR
        trigger: "PATCH /tours/{tour_id} {status: ON_TOUR}"
        actor: Producer
        preconditions: []
        side_effects: []
      - from: ON_TOUR
        to: COMPLETED
        trigger: "PATCH /tours/{tour_id} {status: COMPLETED}"
        actor: Producer
        preconditions:
          - "Every Stop of the tour has booking_status in {WRAPPED, CANCELLED}"
        side_effects: []
      - from: COMPLETED
        to: CLOSED
        trigger: "PATCH /tours/{tour_id} {status: CLOSED}"
        actor: Producer
        preconditions:
          - "Every Settlement of the tour has status in {PAID, VOID}"
        side_effects: []

  - entity: Stop
    field: booking_status
    initial_state: TENTATIVE
    terminal_states: [WRAPPED, CANCELLED]
    transitions:
      - from: TENTATIVE
        to: CONTRACTED
        trigger: "PUT /stops/{stop_id} {status: CONTRACTED}"
        actor: Producer
        preconditions:
          - "Tour.status in {PLANNING, ON_TOUR}"
          - "budget check: tour.budget_available_cents >= guarantee_cents (ERR_TOUR_BUDGET_EXCEEDED)"
        side_effects:
          - "tour.budget_committed_cents += guarantee_cents (tour.budget_available_cents recomputes; identity total = committed + spent + available preserved)"
      - from: CONTRACTED
        to: ADVANCED
        trigger: "PUT /stops/{stop_id} {status: ADVANCED}"
        actor: TourManager
        preconditions: []
        side_effects: []
      - from: ADVANCED
        to: READY
        trigger: "PUT /stops/{stop_id} {status: READY} (certify)"
        actor: TourManager
        preconditions:
          - "compliance_status == COMPLIANT (ERR_STOP_NOT_COMPLIANT): >= 1 TechRiderCheck exists and every check is PASS or WAIVED"
        side_effects:
          - "Freeze estimated_venue_payment_cents = max(guarantee_cents, round_half_up(split_pct/100 x advance_sales_cents)) per calc_provisional_settlement_estimate"
      - from: READY
        to: ADVANCED
        trigger: "system (a TechRiderCheck on this stop flips to FAIL after certification)"
        actor: system
        preconditions: []
        side_effects:
          - "Certification revoked; compliance_status recomputes to NON_COMPLIANT"
          - "Performance scheduling blocked until re-certified (READY gate)"
      - from: READY
        to: PLAYING
        trigger: "system (first Performance of this stop is marked PLAYED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLAYING
        to: CLOSED
        trigger: "system (>= 1 performance exists and every performance is PLAYED or CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "Auto-create Settlement for this stop in DRAFT with system_gross_cents = sum of gross_cents over PLAYED performances (empty sum = 0)"
      - from: READY
        to: CLOSED
        trigger: "system (>= 1 performance exists and every performance is CANCELLED — dark week)"
        actor: system
        preconditions: []
        side_effects:
          - "Auto-create Settlement in DRAFT with system_gross_cents = 0 (no PLAYED performances)"
      - from: CLOSED
        to: WRAPPED
        trigger: "PUT /stops/{stop_id} {status: WRAPPED} (weekly wrap)"
        actor: Producer
        preconditions:
          - "The stop's Settlement has status == PAID (ERR_WRAP_NOT_READY)"
        side_effects:
          - "calc_weekly_wrap: stop_costs = sum(total_pay_cents over CrewCalls in SETTLED) + sum(cancellation_penalty_cents over CrewCalls in CANCELLED) + sum(total_cents over PerDiemStatements in {ISSUED, PAID})"
          - "producer_net = settlement.producer_share_cents - settlement.royalty_cents - stop_costs"
          - "wrapped_total_cents = settlement.venue_payment_cents + settlement.royalty_cents + stop_costs"
          - "tour.budget_committed_cents -= guarantee_cents; tour.budget_spent_cents += wrapped_total_cents"
          - "tour.cumulative_producer_net_cents += producer_net; then tour.recouped = (cumulative_producer_net_cents >= capitalization_cents) — recoup flag flips only here, AFTER this stop's royalty was fixed at approve"
      - from: [TENTATIVE, CONTRACTED, ADVANCED, READY]
        to: CANCELLED
        trigger: "PUT /stops/{stop_id} {status: CANCELLED}"
        actor: Producer
        preconditions: []
        side_effects:
          - "cancellation_penalty_cents = calc_cancellation_penalty (0 when cancelling from TENTATIVE)"
          - "If prior state in {CONTRACTED, ADVANCED, READY}: tour.budget_committed_cents -= guarantee_cents; tour.budget_spent_cents += cancellation_penalty_cents"
          - "Every SCHEDULED Performance of this stop -> CANCELLED"
          - "Every POSTED CrewCall of this stop -> CANCELLED, each accruing its own calc_crew_call_pay cancellation penalty (cascade link 2)"
          - "Those crew cancellation penalties add into tour.budget_spent_cents (cascade link 3)"

  - entity: Stop
    field: compliance_status
    initial_state: PENDING
    terminal_states: []
    note: "Derived dimension — never set directly; recomputed on every TechRiderCheck create/update/waive"
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "system (first TechRiderCheck created for the stop)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [PENDING, IN_PROGRESS, NON_COMPLIANT, COMPLIANT]
        to: COMPLIANT
        trigger: "system (>= 1 check exists and every check is PASS or WAIVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [PENDING, IN_PROGRESS, COMPLIANT]
        to: NON_COMPLIANT
        trigger: "system (any check is FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "If booking_status == READY: booking_status auto-reverts to ADVANCED (certification revoked; cascade link 2 of the tech-fail cascade)"
      - from: [COMPLIANT, NON_COMPLIANT]
        to: IN_PROGRESS
        trigger: "system (checks exist, none FAIL, at least one PENDING)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Performance
    field: status
    initial_state: SCHEDULED
    terminal_states: [PLAYED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PLAYED
        trigger: "PUT /performances/{perf_id} {status: PLAYED, gross_cents}"
        actor: Treasurer
        preconditions:
          - "Stop.booking_status in {READY, PLAYING} (ERR_STOP_NOT_SCHEDULABLE)"
          - "gross_cents present and >= 0 (0 is valid)"
        side_effects:
          - "If stop was READY: stop.booking_status -> PLAYING (bubble-up, first played)"
          - "For every CoverageAssignment with status ACTIVATED on tracks of this tour: that coverage's cast member bump_shows_accrued += 1 and bump_pay_cents recomputes (calc_understudy_bump_pay)"
          - "If every performance of the stop is now PLAYED or CANCELLED: stop.booking_status -> CLOSED and Settlement DRAFT auto-created (bubble-up)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "PUT /performances/{perf_id} {status: CANCELLED} or system (stop cancelled)"
        actor: "TourManager or system"
        preconditions: []
        side_effects:
          - "If every performance of the stop is now PLAYED or CANCELLED: stop.booking_status -> CLOSED and Settlement DRAFT auto-created"

  - entity: TechRiderCheck
    field: status
    initial_state: PENDING
    terminal_states: [WAIVED]
    transitions:
      - from: PENDING
        to: PASS
        trigger: "PUT /tech-checks/{check_id} {actual_value} with actual_value >= required_value"
        actor: TourManager
        preconditions: []
        side_effects: ["stop.compliance_status recomputes"]
      - from: PENDING
        to: FAIL
        trigger: "PUT /tech-checks/{check_id} {actual_value} with actual_value < required_value"
        actor: TourManager
        preconditions: []
        side_effects:
          - "stop.compliance_status -> NON_COMPLIANT"
          - "If stop.booking_status == READY: booking_status -> ADVANCED (cascade)"
      - from: FAIL
        to: PASS
        trigger: "PUT /tech-checks/{check_id} {actual_value} with actual_value >= required_value (remediation)"
        actor: TourManager
        preconditions: []
        side_effects: ["stop.compliance_status recomputes"]
      - from: PASS
        to: FAIL
        trigger: "PUT /tech-checks/{check_id} {actual_value} with actual_value < required_value (re-measurement)"
        actor: TourManager
        preconditions: []
        side_effects:
          - "stop.compliance_status -> NON_COMPLIANT"
          - "If stop.booking_status == READY: booking_status -> ADVANCED (cascade)"
      - from: PASS
        to: PASS
        trigger: "PUT /tech-checks/{check_id} {actual_value} with actual_value >= required_value (re-measurement)"
        actor: TourManager
        preconditions: []
        side_effects: ["stop.compliance_status recomputes"]
      - from: FAIL
        to: WAIVED
        trigger: "PUT /tech-checks/{check_id} {status: WAIVED, waiver_note}"
        actor: Producer
        preconditions:
          - "waiver_note present (ERR_WAIVER_NOTE_REQUIRED)"
        side_effects: ["stop.compliance_status recomputes"]

  - entity: Settlement
    field: status
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "PUT /settlements/{settlement_id} {status: SUBMITTED}"
        actor: Treasurer
        preconditions:
          - "audited_gross_cents, taxes_cents, levies_cents all present (ERR_SETTLEMENT_INCOMPLETE)"
        side_effects:
          - "submitted_by = calling X-User-ID"
          - "Recompute adjusted_gross_cents, venue_payment_cents, producer_share_cents from stored figures (calc_settlement_waterfall)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "PUT /settlements/{settlement_id} {status: APPROVED}"
        actor: "Producer or Treasurer"
        preconditions:
          - "Segregation of duties: calling X-User-ID != submitted_by (ERR_SOD_SUBMIT_APPROVE, priority auth)"
        side_effects:
          - "approved_by = calling X-User-ID"
          - "royalty_cents = calc_licensor_royalty(producer_share_cents, tour.royalty_tier_threshold_cents, tour.recouped at this instant)"
          - "tour.royalty_accrued_cents += royalty_cents"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "PUT /settlements/{settlement_id} {status: DISPUTED, dispute_reason}"
        actor: Producer
        preconditions:
          - "dispute_reason present (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: DISPUTED
        to: SUBMITTED
        trigger: "PUT /settlements/{settlement_id} {status: SUBMITTED} (figures may be re-set in the same PUT while DISPUTED)"
        actor: Treasurer
        preconditions:
          - "audited_gross_cents, taxes_cents, levies_cents all present"
        side_effects:
          - "submitted_by = calling X-User-ID (resubmission re-arms the segregation check)"
          - "Recompute waterfall fields from current figures"
      - from: DISPUTED
        to: VOID
        trigger: "PUT /settlements/{settlement_id} {status: VOID}"
        actor: Producer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "PUT /settlements/{settlement_id} {status: PAID}"
        actor: "Producer or Treasurer"
        preconditions:
          - "Segregation of duties: calling X-User-ID != approved_by (ERR_SOD_APPROVE_PAY, priority auth)"
        side_effects: []

  - entity: CastMember
    field: status
    initial_state: OFFERED
    terminal_states: [REPLACED, RELEASED]
    transitions:
      - from: OFFERED
        to: CONTRACTED
        trigger: "PUT /cast/{cast_id} {status: CONTRACTED}"
        actor: CompanyManager
        preconditions: []
        side_effects: []
      - from: CONTRACTED
        to: ON_LEAVE
        trigger: "system (POST /cast/{cast_id}/injuries created)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 1 of injury cascade: this member's own CoverageAssignments with status in {STANDBY, ACTIVATED} on OTHER tracks -> SUSPENDED (each suspension recomputes that track's available_covers and exposed)"
      - from: ON_LEAVE
        to: CONTRACTED
        trigger: "system (the member's COVERED InjuryEvent is RESOLVED)"
        actor: system
        preconditions: []
        side_effects:
          - "This member's SUSPENDED CoverageAssignments -> STANDBY (tracks recompute)"
      - from: CONTRACTED
        to: REPLACED
        trigger: "system (injury created and calc_coverage_selection found an empty candidate pool — REPLACED branch)"
        actor: system
        preconditions: []
        side_effects:
          - "The member's CharacterTrack (as principal) keeps principal_member_id pointing at the REPLACED member until PATCH /tracks/{track_id} assigns a successor; track.exposed recomputes (replacement protocol demands a new principal)"
      - from: [OFFERED, CONTRACTED, ON_LEAVE]
        to: RELEASED
        trigger: "PUT /cast/{cast_id} {status: RELEASED}"
        actor: CompanyManager
        preconditions:
          - "No CoverageAssignment with this member has status == ACTIVATED (ERR_COVERAGE_ACTIVATED)"
        side_effects:
          - "This member's STANDBY/SUSPENDED CoverageAssignments -> RELEASED (tracks recompute available_covers/exposed)"

  - entity: CoverageAssignment
    field: status
    initial_state: STANDBY
    terminal_states: [RELEASED]
    transitions:
      - from: STANDBY
        to: ACTIVATED
        trigger: "system (calc_coverage_selection picks this coverage for an InjuryEvent)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link 3 of injury cascade: the track's available_covers recomputes (an ACTIVATED cover is not available); if available_covers drops below required_covers, track.exposed = true"
      - from: ACTIVATED
        to: STANDBY
        trigger: "system (the InjuryEvent that activated it is RESOLVED)"
        actor: system
        preconditions: []
        side_effects: ["track.available_covers and exposed recompute"]
      - from: STANDBY
        to: SUSPENDED
        trigger: "system (the covering CastMember goes ON_LEAVE)"
        actor: system
        preconditions: []
        side_effects: ["track.available_covers and exposed recompute"]
      - from: SUSPENDED
        to: STANDBY
        trigger: "system (the covering CastMember returns to CONTRACTED)"
        actor: system
        preconditions: []
        side_effects: ["track.available_covers and exposed recompute"]
      - from: STANDBY
        to: RELEASED
        trigger: "PUT /coverages/{coverage_id} {status: RELEASED} or system (member released)"
        actor: "CompanyManager or system"
        preconditions:
          - "status == STANDBY (ACTIVATED coverage cannot be released while its InjuryEvent is COVERED — ERR_COVERAGE_ACTIVATED)"
        side_effects: ["track.available_covers and exposed recompute"]

  - entity: InjuryEvent
    field: status
    initial_state: COVERED
    terminal_states: [RESOLVED, REPLACED]
    note: "Branching fork at creation: the selector outcome decides COVERED vs REPLACED atomically"
    transitions:
      - from: null
        to: COVERED
        trigger: "POST /cast/{cast_id}/injuries when calc_coverage_selection finds a candidate"
        actor: CompanyManager
        preconditions:
          - "CastMember.status == CONTRACTED (ERR_CAST_INVALID_STATE)"
        side_effects:
          - "Cascade: CastMember CONTRACTED -> ON_LEAVE (link 1)"
          - "ON_LEAVE suspends the member's own STANDBY/ACTIVATED coverages on other tracks (link 1b)"
          - "Selected CoverageAssignment STANDBY -> ACTIVATED; covered_by_coverage_id recorded (link 2)"
          - "Activated track recomputes available_covers/exposed (link 3)"
      - from: null
        to: REPLACED
        trigger: "POST /cast/{cast_id}/injuries when the coverage pool is empty (empty-set fallback)"
        actor: CompanyManager
        preconditions:
          - "CastMember.status == CONTRACTED (ERR_CAST_INVALID_STATE)"
          - "CastMember is principal_member_id of some track of the tour (ERR_PRINCIPAL_NOT_CONTRACTED)"
        side_effects:
          - "CastMember CONTRACTED -> REPLACED (skips ON_LEAVE; divergent side-effect set from COVERED)"
          - "No coverage is activated; the principal's track recomputes exposed (true if required_covers > 0)"
      - from: COVERED
        to: RESOLVED
        trigger: "PUT /injuries/{injury_id} {status: RESOLVED}"
        actor: CompanyManager
        preconditions: []
        side_effects:
          - "CastMember ON_LEAVE -> CONTRACTED"
          - "The ACTIVATED coverage recorded in covered_by_coverage_id -> STANDBY (null-safe when COVERED without activation)"
          - "Member's SUSPENDED coverages -> STANDBY; all affected tracks recompute"

  - entity: PerDiemStatement
    field: status
    initial_state: ISSUED
    terminal_states: [PAID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "PUT /per-diems/{pd_id} {status: PAID}"
        actor: CompanyManager
        preconditions: []
        side_effects: []

  - entity: CrewCall
    field: status
    initial_state: POSTED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: POSTED
        to: SETTLED
        trigger: "PUT /crew-calls/{cc_id} {status: SETTLED, actual_lines}"
        actor: TourManager
        preconditions:
          - "actual_lines positions match lines positions exactly (ERR_INVALID_REQUEST)"
        side_effects:
          - "total_pay_cents = calc_crew_call_pay(actual_lines, lines' rates)"
      - from: POSTED
        to: CANCELLED
        trigger: "PUT /crew-calls/{cc_id} {status: CANCELLED} or system (stop cancelled)"
        actor: "TourManager or system"
        preconditions: []
        side_effects:
          - "cancellation_penalty_cents = sum over planned lines of round_half_up(4 x rate_cents_per_hour) when (scheduled_start - logical clock) < 24h, else 0; == 24h exactly pays 0"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; state-precondition lookalikes live in §1.2/§1.4)
# =============================================================================
concurrency_rules:
  - rule_id: stop-create-stale-tour
    parent_entity: Tour
    write_endpoint: "POST /tours/{tour_id}/stops"
    occ_field: "expected_tour_version"
    description: |
      Creating a Stop against a Tour whose version has advanced since the
      client last observed it is rejected: another stop creation has already
      mutated the route (and bumped Tour.version), so the caller's view of the
      route and budget is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: stop-amend-stale-stop
    parent_entity: Stop
    write_endpoint: "POST /stops/{stop_id}/amend"
    occ_field: "expected_stop_version"
    description: |
      Amending a Stop's contract terms against a Stop whose version has
      advanced since the client last observed it is rejected: a prior accepted
      amendment changed the terms the caller believes are current.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_provisional_settlement_estimate
    trigger: "Stop ADVANCED -> READY (certify)"
    algorithm: forward_looking
    formula: |
      estimated_venue_payment_cents = max(guarantee_cents, round_half_up(split_pct / 100 * advance_sales_cents))
      Provisional variant treats advance_sales_cents AS the adjusted-gross proxy: no tax/levy deductions.
    input_set: "The stop being certified; uses its stored guarantee_cents, split_pct, advance_sales_cents"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "at certify (ADVANCED -> READY)"
        difference: "input is advance_sales_cents with no deductions"
      - name: final
        when: "at settlement submit/approve"
        difference: "input is audited_gross - taxes - levies (calc_settlement_waterfall); identical terms yield different venue payment whenever actuals or deductions differ from advance sales"

  - name: calc_settlement_waterfall
    trigger: "Settlement figures PUT (DRAFT or DISPUTED), and again at SUBMITTED"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order is PINNED (circular-looking dependency broken by this order):
        1. adjusted_gross_cents   = audited_gross_cents - taxes_cents - levies_cents   (taxes first, levies second)
        2. venue_payment_cents    = max(guarantee_cents, round_half_up(split_pct / 100 * adjusted_gross_cents))
        3. producer_share_cents   = adjusted_gross_cents - venue_payment_cents          (may go negative)
        4. royalty_cents          = calc_licensor_royalty(producer_share_cents)         (0 when share <= 0)
      Royalty never feeds back into venue_payment or producer_share.
    input_set: "The settlement's audited figures + the parent stop's guarantee_cents and split_pct"
    precision: "integer cents; only step 2 rounds (round_half_up) before step 3 subtracts"

  - name: calc_licensor_royalty
    trigger: "Settlement SUBMITTED -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      Marginal brackets over producer_share_cents with bracket boundary T = tour.royalty_tier_threshold_cents:
        if producer_share_cents <= 0: royalty_cents = 0
        else:
          rates = recouped ? (POST_T1_BPS, POST_T2_BPS) : (PRE_T1_BPS, PRE_T2_BPS)
          royalty_cents = round_half_up(rates.T1 / 10000 * min(producer_share_cents, T))
                        + round_half_up(rates.T2 / 10000 * max(0, producer_share_cents - T))
      Per-bracket rounding, then sum (order pinned).
    input_set: "producer_share_cents of the settlement being approved; tour.recouped sampled at the approve instant"
    constants:
      PRE_T1_BPS: 600
      PRE_T2_BPS: 900
      POST_T1_BPS: 800
      POST_T2_BPS: 1100
    precision: "integer cents, round_half_up per bracket"
    variants:
      - name: marginal_pinned
        when: "always (canonical)"
        difference: "only the share above T pays the T2 rate"
      - name: flat_reading_rejected
        when: "never — documented ambiguity"
        difference: "a flat reading ('share >= T pays T2 on the whole share') yields a strictly larger royalty whenever producer_share_cents > T; tests pin the marginal result"

  - name: calc_per_diem
    trigger: "PerDiemStatement creation"
    algorithm: threshold
    formula: |
      policy = tour.per_diem_policy (snapshotted), rate = tour.per_diem_daily_cents (snapshotted)
      FULL_WEEK:   total_cents = 7 * rate
      ACTUAL_DAYS: half_rate = round_half_up(rate / 2)   -- per-day half rate rounded FIRST, then multiplied (order pinned)
                   total_cents = (days_present - travel_days) * rate + travel_days * half_rate
    input_set: "The new PerDiemStatement's days_present/travel_days + tour snapshots"
    precision: "integer cents, round_half_up on the half day rate only"
    variants:
      - name: full_week
        when: "tour.per_diem_policy == FULL_WEEK"
        difference: "ignores days_present/travel_days entirely; pays 7 days"
      - name: actual_days
        when: "tour.per_diem_policy == ACTUAL_DAYS"
        difference: "pays (days_present - travel_days) full days + travel_days at the rounded half rate; equals FULL_WEEK only when days_present = 7 and travel_days = 0"

  - name: calc_understudy_bump_pay
    trigger: "Performance -> PLAYED while a CoverageAssignment is ACTIVATED (per covered performance)"
    algorithm: threshold
    formula: |
      Per PLAYED performance covered: bump_shows_accrued += 1 on the covering cast member.
      bump_pay_cents = bump_shows_accrued * round_half_up(principal_weekly_salary_cents / 8)
      where principal_weekly_salary_cents is the weekly salary of the track's principal_member_id.
      0 covered shows -> bump_pay_cents = 0 (zero-quantity edge).
    input_set: "CoverageAssignments with status == ACTIVATED at the instant the performance is marked PLAYED"
    precision: "integer cents, round_half_up on the per-show unit"

  - name: calc_crew_call_pay
    trigger: "CrewCall POSTED -> SETTLED"
    algorithm: tiered_pricing
    formula: |
      Per line (rounding pinned: compute exact components, round ONCE per line, then sum line totals):
        h = hours_worked
        regular = min(h, 8) * rate
        ot1     = min(max(h - 8, 0), 4) * rate * 1.5
        ot2     = max(h - 12, 0) * rate * 2
        line_total = round_half_up(regular + ot1 + ot2)
      total_pay_cents = sum(line_total over lines)
      Exactly h == 8 pays no overtime (boundary); h == 12 exact: ot2 component is 0.
    input_set: "actual_lines of the settling crew call, matched by position to the planned rate lines"
    precision: "integer cents, round_half_up per line total, then sum (NOT sum-then-round)"

  - name: calc_cancellation_penalty
    trigger: "Stop -> CANCELLED"
    algorithm: threshold
    formula: |
      days_out = whole days between the logical clock date and play_week_start (floor of the difference)
      from TENTATIVE: 0
      from {CONTRACTED, ADVANCED, READY}:
        days_out > 60            -> 0
        31 <= days_out <= 60     -> round_half_up(0.25 * guarantee_cents)
        days_out <= 30           -> round_half_up(0.50 * guarantee_cents)
      Boundary: days_out == 60 pays 25%; days_out == 61 pays 0.
    input_set: "The cancelled stop's guarantee_cents, play_week_start, and the logical clock"
    precision: "integer cents, round_half_up"

  - name: calc_weekly_wrap
    trigger: "Stop CLOSED -> WRAPPED"
    algorithm: aggregation
    formula: |
      stop_costs  = sum(total_pay_cents over CrewCalls in SETTLED)
                  + sum(cancellation_penalty_cents over CrewCalls in CANCELLED)
                  + sum(total_cents over PerDiemStatements in {ISSUED, PAID})
      producer_net = settlement.producer_share_cents - settlement.royalty_cents - stop_costs
      wrapped_total_cents = settlement.venue_payment_cents + settlement.royalty_cents + stop_costs
      Evaluation order pinned (mode c): producer_net uses THIS stop's royalty fixed at approve with the
      recoup flag of that instant; only AFTER wrapped totals post does the tour re-evaluate
      recouped = (cumulative_producer_net_cents >= capitalization_cents)  (>= boundary flips).
    input_set: "Only the filtered states named above (SETTLED/CANCELLED crew, ISSUED/PAID per-diems, PAID settlement); everything else excluded"
    precision: "integer cents"

  - name: calc_coverage_selection
    trigger: "POST /cast/{cast_id}/injuries (selector runs atomically at creation)"
    algorithm: constraint_propagation
    formula: |
      Eligibility filter: CoverageAssignments on the injured member's principal track with
        status == STANDBY AND cast member status == CONTRACTED.
      Ranking expression: (kind == UNDERSTUDY ? 0 : 1) ASC, then priority_rank ASC, then created_at ASC.
      Fallback on empty pool: the InjuryEvent takes the REPLACED branch (no error; the member is REPLACED).
      id is never used in ranking; created_at is the final tie-break.
    input_set: "Coverages of the injured member's principal track"
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of Producer | TourManager | CompanyManager | Treasurer"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role allowed for the endpoint AND for the requested transition on shared transition endpoints (PUT /stops: CONTRACTED/WRAPPED/CANCELLED are Producer-only, ADVANCED/READY are TourManager-only; PUT /tech-checks: WAIVED is Producer-only, actual_value is TourManager-only; PUT /performances: PLAYED is Treasurer-only, CANCELLED is TourManager-only; settlement submit is Treasurer-only, dispute/void Producer-only, approve/pay Producer-or-Treasurer)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Segregation of duties: settlement APPROVE caller X-User-ID != settlement.submitted_by"
    error_id: ERR_SOD_SUBMIT_APPROVE
    http_status: 403
    applies_to: "PUT /settlements/{settlement_id} with status=APPROVED"
  - priority: 2
    category: auth
    check: "Segregation of duties: settlement PAY caller X-User-ID != settlement.approved_by"
    error_id: ERR_SOD_APPROVE_PAY
    http_status: 403
    applies_to: "PUT /settlements/{settlement_id} with status=PAID"
  - priority: 3
    category: existence
    check: "Path identifiers resolve left-to-right (tour, stop, track, cast, check, performance, settlement, coverage, injury, per-diem, crew-call) and belong to their declared parents; body-referenced FK ids (venue_id, cast_member_id, principal_member_id) must also resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or body FK references"
  - priority: 4
    category: business_constraint
    check: "Request shape: required fields present, unknown fields rejected, enums valid, numeric ranges respected (cents >= 0, days_present in 1..7, travel_days <= min(2, days_present), split_pct in 0..100, play_week_end >= play_week_start, load_in_date <= play_week_start, lines non-empty with unique positions, actual_lines positions match planned); PUT /tech-checks waive without waiver_note uses the more specific ERR_WAIVER_NOTE_REQUIRED evaluated immediately after generic shape"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"
  - priority: 4
    category: business_constraint
    check: "Per-diem ranges: days_present in 1..7 and travel_days <= min(2, days_present) (evaluated after generic shape, before state)"
    error_id: ERR_PER_DIEM_INVALID
    http_status: 400
    applies_to: "POST /stops/{stop_id}/per-diems"
  - priority: 4
    category: business_constraint
    check: "Waive requires waiver_note (checked after generic shape, before state)"
    error_id: ERR_WAIVER_NOTE_REQUIRED
    http_status: 400
    applies_to: "PUT /tech-checks/{check_id} with status=WAIVED"
  - priority: 5
    category: state
    check: "Stop creation requires Tour.status in {PLANNING, ON_TOUR}"
    error_id: ERR_TOUR_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /tours/{tour_id}/stops"
  - priority: 5
    category: state
    check: "Stop transition guards: CONTRACTED only from TENTATIVE; ADVANCED only from CONTRACTED; READY only from ADVANCED; WRAPPED only from CLOSED; CANCELLED only from {TENTATIVE, CONTRACTED, ADVANCED, READY}; amend only while CONTRACTED; tech-check creation only while CONTRACTED|ADVANCED; crew-call creation only while ADVANCED|READY|PLAYING; per-diem issue only while READY|PLAYING|CLOSED"
    error_id: ERR_STOP_INVALID_STATE
    http_status: 409
    applies_to: "PUT /stops/{stop_id}, POST /stops/{stop_id}/amend, POST /stops/{stop_id}/tech-checks, POST /stops/{stop_id}/crew-calls, POST /stops/{stop_id}/per-diems"
  - priority: 5
    category: state
    check: "Performance scheduling requires stop booking_status in {READY, PLAYING}"
    error_id: ERR_STOP_NOT_SCHEDULABLE
    http_status: 409
    applies_to: "POST /stops/{stop_id}/performances"
  - priority: 5
    category: state
    check: "TechRiderCheck: actual_value recordable from PENDING, FAIL, or PASS (re-measurement); WAIVED is terminal; waive only from FAIL"
    error_id: ERR_CHECK_INVALID_STATE
    http_status: 409
    applies_to: "PUT /tech-checks/{check_id}"
  - priority: 5
    category: state
    check: "Performance PLAYED/CANCELLED only from SCHEDULED"
    error_id: ERR_PERFORMANCE_INVALID_STATE
    http_status: 409
    applies_to: "PUT /performances/{perf_id}"
  - priority: 5
    category: state
    check: "Settlement transitions: SUBMITTED from {DRAFT, DISPUTED}; APPROVED/DISPUTED from SUBMITTED; VOID from DISPUTED; PAID from APPROVED"
    error_id: ERR_SETTLEMENT_INVALID_STATE
    http_status: 409
    applies_to: "PUT /settlements/{settlement_id}"
  - priority: 5
    category: state
    check: "CastMember: CONTRACTED only from OFFERED; RELEASED only from {OFFERED, CONTRACTED, ON_LEAVE}; injury only on CONTRACTED members"
    error_id: ERR_CAST_INVALID_STATE
    http_status: 409
    applies_to: "PUT /cast/{cast_id}, POST /cast/{cast_id}/injuries"
  - priority: 5
    category: state
    check: "CoverageAssignment release only from STANDBY; cast release blocked while any of the member's coverages is ACTIVATED"
    error_id: ERR_COVERAGE_ACTIVATED
    http_status: 409
    applies_to: "PUT /coverages/{coverage_id}, PUT /cast/{cast_id}"
  - priority: 5
    category: state
    check: "PerDiemStatement PAID only from ISSUED"
    error_id: ERR_PER_DIEM_INVALID_STATE
    http_status: 409
    applies_to: "PUT /per-diems/{pd_id}"
  - priority: 5
    category: state
    check: "CrewCall SETTLED/CANCELLED only from POSTED"
    error_id: ERR_CREW_INVALID_STATE
    http_status: 409
    applies_to: "PUT /crew-calls/{cc_id}"
  - priority: 5
    category: state
    check: "Stop WRAPPED requires its settlement PAID"
    error_id: ERR_WRAP_NOT_READY
    http_status: 409
    applies_to: "PUT /stops/{stop_id} with status=WRAPPED"
  - priority: 5
    category: state
    check: "Tour transitions: ON_TOUR only from PLANNING; COMPLETED only from ON_TOUR with every stop terminal; CLOSED only from COMPLETED with every settlement PAID|VOID"
    error_id: ERR_TOUR_INVALID_STATE
    http_status: 409
    applies_to: "PATCH /tours/{tour_id}"
  - priority: 5
    category: state
    check: "InjuryEvent RESOLVED only from COVERED"
    error_id: ERR_INJURY_INVALID_STATE
    http_status: 409
    applies_to: "PUT /injuries/{injury_id}"
  - priority: 6
    category: business_safety
    check: "Weekly performance cap: count of performances with status in {SCHEDULED, PLAYED} and perf_date within the stop's play week must be < 8 before adding one (8th allowed, 9th rejected)"
    error_id: ERR_WEEKLY_SHOW_CAP
    http_status: 422
    applies_to: "POST /stops/{stop_id}/performances"
  - priority: 6
    category: business_safety
    check: "Daily performance cap: at most 2 performances with status in {SCHEDULED, PLAYED} per perf_date per stop"
    error_id: ERR_DAILY_SHOW_CAP
    http_status: 422
    applies_to: "POST /stops/{stop_id}/performances"
  - priority: 6
    category: business_safety
    check: "Crew complement: when the stop has a TechRiderCheck with item CREW_MINIMUM in {PASS, WAIVED}, a crew call's lines count must be >= that check's required_value; also lines count must be <= venue.crew_available"
    error_id: ERR_CREW_COMPLEMENT_SHORT
    http_status: 422
    applies_to: "POST /stops/{stop_id}/crew-calls"
  - priority: 7
    category: business_constraint
    check: "Uniqueness: one CoverageAssignment per (track, kind, priority_rank) among non-RELEASED; at most one PerDiemStatement per (stop, cast_member_id); one InjuryEvent with status == COVERED per cast member"
    error_id: ERR_DUPLICATE_RECORD
    http_status: 422
    applies_to: "POST /tracks/{track_id}/coverages, POST /stops/{stop_id}/per-diems, POST /cast/{cast_id}/injuries"
  - priority: 8
    category: business_temporal
    check: "Stop routing window: for every other non-CANCELLED stop B of the tour, reject unless new.play_week_start > B.play_week_end + new.travel_in_days OR B.play_week_start > new.play_week_end + B.travel_in_days (closed intervals plus mandatory travel buffer; equality of start == B.end + travel_in_days + 1 passes)"
    error_id: ERR_STOP_WINDOW_CONFLICT
    http_status: 422
    applies_to: "POST /tours/{tour_id}/stops"
  - priority: 8
    category: business_temporal
    check: "Performance date within the stop's play week: play_week_start <= perf_date <= play_week_end (both ends inclusive)"
    error_id: ERR_PERFORMANCE_OUTSIDE_WEEK
    http_status: 422
    applies_to: "POST /stops/{stop_id}/performances"
  - priority: 8
    category: business_temporal
    check: "Same-day curtain gap: for two same-date performances, the later curtain_time must be >= earlier curtain_time + earlier duration_minutes + 120 minutes (equality passes)"
    error_id: ERR_CURTAIN_GAP_CONFLICT
    http_status: 422
    applies_to: "POST /stops/{stop_id}/performances"
  - priority: 9
    category: business_referential
    check: "Referenced member state: PATCH track principal and POST coverage require the referenced CastMember.status == CONTRACTED and the member belonging to the same tour; injury on a member who is principal of no track is rejected"
    error_id: ERR_PRINCIPAL_NOT_CONTRACTED
    http_status: 422
    applies_to: "PATCH /tracks/{track_id}, POST /tracks/{track_id}/coverages, POST /cast/{cast_id}/injuries"
  - priority: 9
    category: business_referential
    check: "A CastMember may be principal of at most one track of the tour"
    error_id: ERR_PRINCIPAL_DOUBLE_BOOKED
    http_status: 422
    applies_to: "PATCH /tracks/{track_id}, POST /tours/{tour_id}/tracks with principal_member_id"
  - priority: 10
    category: business_fiscal
    check: "Budget commitment: contracting (or amending) a stop requires tour.budget_available_cents >= guarantee_cents (or >= the positive guarantee delta on amend)"
    error_id: ERR_TOUR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "PUT /stops/{stop_id} with status=CONTRACTED, POST /stops/{stop_id}/amend"
  - priority: 10
    category: business_fiscal
    check: "Settlement submit requires audited_gross_cents, taxes_cents, levies_cents all recorded"
    error_id: ERR_SETTLEMENT_INCOMPLETE
    http_status: 422
    applies_to: "PUT /settlements/{settlement_id} with status=SUBMITTED"

# =============================================================================
# §1.5 API Endpoint Table (41 endpoints)
# =============================================================================
endpoints:
  # --- Tour ---
  - method: POST
    path: "/tours"
    description: "Create a tour (status PLANNING, counters 0, recouped false)"
    roles: [Producer]
    code: 201
    input: [name, budget_total_cents, capitalization_cents, per_diem_policy, per_diem_daily_cents, royalty_tier_threshold_cents]
    output: Tour
    side_effects: ["status=PLANNING"]
  - method: GET
    path: "/tours/{tour_id}"
    description: "Get tour with computed budget/recoup fields"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: []
    output: Tour
    side_effects: []
  - method: PATCH
    path: "/tours/{tour_id}"
    description: "Advance tour status (PLANNING->ON_TOUR->COMPLETED->CLOSED with the §1.2 preconditions)"
    roles: [Producer]
    code: 200
    input: [status]
    output: Tour
    side_effects: ["status transition per Tour machine"]

  # --- Venue ---
  - method: POST
    path: "/venues"
    description: "Create a venue with its tech specs and local crew capacity"
    roles: [Producer]
    code: 201
    input: [name, city, stage_width_ft, fly_capacity_lines, power_amps, crew_available]
    output: Venue
    side_effects: []
  - method: GET
    path: "/venues/{venue_id}"
    description: "Get a venue"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # --- Stop ---
  - method: POST
    path: "/tours/{tour_id}/stops"
    description: "Add a stop to the route (OCC on Tour.version). Window-conflict and routing-buffer checks apply."
    roles: [TourManager]
    code: 201
    input: [venue_id, play_week_start, play_week_end, load_in_date, travel_in_days, guarantee_cents, split_pct, expected_tour_version, "advance_sales_cents?"]
    output: Stop
    side_effects:
      - "booking_status=TENTATIVE, compliance_status=PENDING"
      - "increments Tour.version by 1"
  - method: GET
    path: "/stops"
    description: "List stops; filterable (FK reverse-reachability for Stop.tour_id and Stop.venue_id)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: ["tour_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: Stop[]
    side_effects: []
  - method: GET
    path: "/stops/{stop_id}"
    description: "Get a stop"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: []
    output: Stop
    side_effects: []
  - method: PUT
    path: "/stops/{stop_id}"
    description: "Drive booking_status transitions via {status}: CONTRACTED/WRAPPED/CANCELLED (Producer), ADVANCED/READY (TourManager); WRAPPED runs calc_weekly_wrap"
    roles: [Producer, TourManager]
    code: 200
    input: [status]
    output: Stop
    side_effects: ["per Stop booking_status machine, including cascades to Performance/CrewCall/Settlement and Tour budget fields"]
  - method: POST
    path: "/stops/{stop_id}/amend"
    description: "Amend contract terms while CONTRACTED (OCC on Stop.version); at least one term field required"
    roles: [Producer]
    code: 200
    input: [expected_stop_version, "guarantee_cents?", "split_pct?", "load_in_date?", "travel_in_days?"]
    output: Stop
    side_effects:
      - "tour.budget_committed_cents += (new guarantee_cents - old guarantee_cents) when guarantee changes"
      - "increments Stop.version by 1"

  # --- TechRiderCheck ---
  - method: POST
    path: "/stops/{id}/tech-checks"
    description: "Create a rider compliance check (stop must be CONTRACTED or ADVANCED)"
    roles: [TourManager]
    code: 201
    input: [item, required_value]
    output: TechRiderCheck
    side_effects: ["stop.compliance_status recomputes (PENDING -> IN_PROGRESS on first check)"]
  - method: GET
    path: "/stops/{id}/tech-checks"
    description: "List checks of a stop (FK reverse-reachability)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: []
    output: TechRiderCheck[]
    side_effects: []
  - method: PUT
    path: "/tech-checks/{check_id}"
    description: "Record actual_value (TourManager; system sets PASS iff actual >= required, else FAIL) or waive a FAIL via {status: WAIVED, waiver_note} (Producer)"
    roles: [TourManager, Producer]
    code: 200
    input: ["actual_value?", "status?", "waiver_note?"]
    output: TechRiderCheck
    side_effects: ["stop.compliance_status recomputes", "FAIL while stop READY -> booking_status reverts to ADVANCED"]

  # --- Performance ---
  - method: POST
    path: "/stops/{id}/performances"
    description: "Schedule a performance (stop READY|PLAYING; weekly cap 8, daily cap 2, curtain gap 120 min)"
    roles: [TourManager]
    code: 201
    input: [perf_date, curtain_time, duration_minutes]
    output: Performance
    side_effects: []
  - method: GET
    path: "/stops/{id}/performances"
    description: "List performances of a stop (FK reverse-reachability)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: ["perf_date?"]
    output: Performance[]
    side_effects: []
  - method: PUT
    path: "/performances/{perf_id}"
    description: "Mark PLAYED {status, gross_cents} (Treasurer) or CANCELLED {status} (TourManager); bubble-up may flip stop to PLAYING/CLOSED and auto-create the Settlement"
    roles: [Treasurer, TourManager]
    code: 200
    input: [status, "gross_cents?"]
    output: Performance
    side_effects: ["per Performance machine: stop PLAYING flip, bump accrual, CLOSED + Settlement auto-create"]

  # --- Settlement ---
  - method: GET
    path: "/stops/{id}/settlement"
    description: "Fetch the settlement of a stop (FK reverse-reachability; 1:1 returns array of 0-1)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: []
    output: Settlement[]
    side_effects: []
  - method: PUT
    path: "/settlements/{settlement_id}"
    description: "Record audited figures (Treasurer; DRAFT or DISPUTED, figures preserved, no status change) and drive status: SUBMITTED (Treasurer), DISPUTED/VOID (Producer), APPROVED/PAID (Producer or Treasurer with SoD)"
    roles: [Treasurer, Producer]
    code: 200
    input: ["audited_gross_cents?", "taxes_cents?", "levies_cents?", "status?", "dispute_reason?"]
    output: Settlement
    side_effects: ["waterfall recompute on figure submit; royalty at APPROVE; tour.royalty_accrued_cents on APPROVED"]

  # --- CastMember ---
  - method: POST
    path: "/tours/{id}/cast"
    description: "Create a cast member (OFFERED)"
    roles: [CompanyManager]
    code: 201
    input: [name, contract_type, weekly_salary_cents]
    output: CastMember
    side_effects: []
  - method: GET
    path: "/tours/{id}/cast"
    description: "List cast of a tour (FK reverse-reachability)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: ["status?", "contract_type?", "limit?", "offset?"]
    output: CastMember[]
    side_effects: []
  - method: GET
    path: "/cast/{cast_id}"
    description: "Get a cast member"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: []
    output: CastMember
    side_effects: []
  - method: PUT
    path: "/cast/{cast_id}"
    description: "Drive cast status: CONTRACTED (from OFFERED) or RELEASED (from OFFERED/CONTRACTED/ON_LEAVE, blocked while ACTIVATED coverage exists)"
    roles: [CompanyManager]
    code: 200
    input: [status]
    output: CastMember
    side_effects: ["RELEASED cascades member's STANDBY/SUSPENDED coverages to RELEASED"]

  # --- CharacterTrack ---
  - method: POST
    path: "/tours/{id}/tracks"
    description: "Create a character track (principal optional at creation)"
    roles: [CompanyManager]
    code: 201
    input: [track_name, required_covers, "principal_member_id?"]
    output: CharacterTrack
    side_effects: []
  - method: GET
    path: "/tours/{id}/tracks"
    description: "List tracks of a tour (FK reverse-reachability)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: []
    output: CharacterTrack[]
    side_effects: []
  - method: GET
    path: "/tracks"
    description: "List tracks; filterable by tour or current principal (FK reverse-reachability for CharacterTrack.principal_member_id)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: ["tour_id?", "principal_member_id?", "limit?", "offset?"]
    output: CharacterTrack[]
    side_effects: []
  - method: GET
    path: "/tracks/{track_id}"
    description: "Get a track with computed available_covers/exposed"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: []
    output: CharacterTrack
    side_effects: []
  - method: PATCH
    path: "/tracks/{track_id}"
    description: "Assign/replace the principal (member must be CONTRACTED and not principal of another track)"
    roles: [CompanyManager]
    code: 200
    input: [principal_member_id]
    output: CharacterTrack
    side_effects: ["track.exposed recomputes"]

  # --- CoverageAssignment ---
  - method: POST
    path: "/tracks/{id}/coverages"
    description: "Assign an understudy/swing cover (member CONTRACTED; rank unique per track+kind among non-RELEASED)"
    roles: [CompanyManager]
    code: 201
    input: [cast_member_id, kind, priority_rank]
    output: CoverageAssignment
    side_effects: ["track.available_covers/exposed recompute"]
  - method: GET
    path: "/tracks/{id}/coverages"
    description: "List coverages of a track (FK reverse-reachability)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: ["status?"]
    output: CoverageAssignment[]
    side_effects: []
  - method: GET
    path: "/cast/{id}/coverages"
    description: "List coverages held by a cast member (FK reverse-reachability)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: ["status?"]
    output: CoverageAssignment[]
    side_effects: []
  - method: PUT
    path: "/coverages/{coverage_id}"
    description: "Release a STANDBY coverage"
    roles: [CompanyManager]
    code: 200
    input: [status]
    output: CoverageAssignment
    side_effects: ["track.available_covers/exposed recompute"]

  # --- InjuryEvent ---
  - method: POST
    path: "/cast/{id}/injuries"
    description: "Report an injury; atomically takes the COVERED branch (selector activates a coverage) or REPLACED branch (empty pool)"
    roles: [CompanyManager]
    code: 201
    input: ["notes?"]
    output: InjuryEvent
    side_effects: ["per InjuryEvent machine: member ON_LEAVE or REPLACED, coverage activation/suspension, track recompute"]
  - method: GET
    path: "/cast/{id}/injuries"
    description: "List injuries of a cast member (FK reverse-reachability)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: []
    output: InjuryEvent[]
    side_effects: []
  - method: PUT
    path: "/injuries/{injury_id}"
    description: "Resolve a COVERED injury (member returns, coverage deactivates, suspensions restore)"
    roles: [CompanyManager]
    code: 200
    input: [status]
    output: InjuryEvent
    side_effects: ["per InjuryEvent machine RESOLVED side effects"]

  # --- PerDiemStatement ---
  - method: POST
    path: "/stops/{id}/per-diems"
    description: "Issue a per-diem statement (one per stop+cast member); computes total_cents per calc_per_diem from tour snapshots"
    roles: [CompanyManager]
    code: 201
    input: [cast_member_id, days_present, travel_days]
    output: PerDiemStatement
    side_effects: []
  - method: GET
    path: "/stops/{id}/per-diems"
    description: "List per-diem statements of a stop (FK reverse-reachability)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: []
    output: PerDiemStatement[]
    side_effects: []
  - method: GET
    path: "/cast/{id}/per-diems"
    description: "List per-diem statements of a cast member (FK reverse-reachability)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: []
    output: PerDiemStatement[]
    side_effects: []
  - method: PUT
    path: "/per-diems/{pd_id}"
    description: "Mark a statement PAID"
    roles: [CompanyManager]
    code: 200
    input: [status]
    output: PerDiemStatement
    side_effects: []

  # --- CrewCall ---
  - method: POST
    path: "/stops/{id}/crew-calls"
    description: "Post a local crew call with planned rate lines (complement checks apply)"
    roles: [TourManager]
    code: 201
    input: [call_type, scheduled_start, lines]
    output: CrewCall
    side_effects: []
  - method: GET
    path: "/stops/{id}/crew-calls"
    description: "List crew calls of a stop (FK reverse-reachability)"
    roles: [Producer, TourManager, CompanyManager, Treasurer]
    code: 200
    input: []
    output: CrewCall[]
    side_effects: []
  - method: PUT
    path: "/crew-calls/{cc_id}"
    description: "Settle with actual_lines (computes calc_crew_call_pay) or cancel (computes cancellation penalty vs the logical clock)"
    roles: [TourManager]
    code: 200
    input: [status, "actual_lines?"]
    output: CrewCall
    side_effects: ["total_pay_cents or cancellation_penalty_cents computed"]

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [Producer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

# =============================================================================
# §1.6 Error Code Catalog (28)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for the endpoint or for the requested transition on a shared transition endpoint" }
  - { id: ERR_SOD_SUBMIT_APPROVE, http: 403, condition: "Settlement approve attempted by the user recorded as submitted_by" }
  - { id: ERR_SOD_APPROVE_PAY, http: 403, condition: "Settlement pay attempted by the user recorded as approved_by" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve (left-to-right) or parent/child mismatch" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum, range violation, malformed lines, or empty amendment (no term field)" }
  - { id: ERR_WAIVER_NOTE_REQUIRED, http: 400, condition: "Waiving a FAIL check without waiver_note" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_tour_version != Tour.version or expected_stop_version != Stop.version" }
  - { id: ERR_TOUR_NOT_BOOKABLE, http: 409, condition: "Stop creation while tour is COMPLETED or CLOSED" }
  - { id: ERR_TOUR_INVALID_STATE, http: 409, condition: "Tour status transition not allowed from current status or blocked by non-terminal children" }
  - { id: ERR_INJURY_INVALID_STATE, http: 409, condition: "Resolve attempted on an injury not in COVERED (REPLACED and RESOLVED are terminal)" }
  - { id: ERR_STOP_INVALID_STATE, http: 409, condition: "Stop booking_status does not allow the requested transition (or amend outside CONTRACTED)" }
  - { id: ERR_STOP_NOT_COMPLIANT, http: 409, condition: "Certify (ADVANCED->READY) while compliance_status != COMPLIANT" }
  - { id: ERR_STOP_NOT_SCHEDULABLE, http: 409, condition: "Performance scheduling or PLAYED while stop is not READY|PLAYING" }
  - { id: ERR_CHECK_INVALID_STATE, http: 409, condition: "Recording actual_value on a WAIVED check, or waiving a non-FAIL check" }
  - { id: ERR_PERFORMANCE_INVALID_STATE, http: 409, condition: "PLAYED/CANCELLED attempted on a terminal performance" }
  - { id: ERR_SETTLEMENT_INVALID_STATE, http: 409, condition: "Settlement transition not allowed from current status (e.g., approve from DISPUTED)" }
  - { id: ERR_SETTLEMENT_INCOMPLETE, http: 422, condition: "Submit without all three audited figures recorded" }
  - { id: ERR_CAST_INVALID_STATE, http: 409, condition: "Cast transition not allowed from current status, or injury on a non-CONTRACTED member" }
  - { id: ERR_COVERAGE_ACTIVATED, http: 409, condition: "Release of an ACTIVATED coverage, or release of a member with an ACTIVATED coverage" }
  - { id: ERR_PRINCIPAL_NOT_CONTRACTED, http: 422, condition: "Track principal or coverage member not CONTRACTED (or wrong tour)" }
  - { id: ERR_PRINCIPAL_DOUBLE_BOOKED, http: 422, condition: "Member already principal of another track of the tour" }
  - { id: ERR_DUPLICATE_RECORD, http: 422, condition: "Duplicate cover rank per track+kind, duplicate per-diem per stop+member, or second open injury per member" }
  - { id: ERR_PER_DIEM_INVALID, http: 400, condition: "days_present outside 1..7 or travel_days > min(2, days_present)" }
  - { id: ERR_PER_DIEM_INVALID_STATE, http: 409, condition: "Pay attempted on a statement not ISSUED" }
  - { id: ERR_WEEKLY_SHOW_CAP, http: 422, condition: "9th performance in the stop's play week (8 allowed)" }
  - { id: ERR_DAILY_SHOW_CAP, http: 422, condition: "3rd performance on the same perf_date (2 allowed)" }
  - { id: ERR_CURTAIN_GAP_CONFLICT, http: 422, condition: "Same-day curtain gap < earlier duration + 120 minutes" }
  - { id: ERR_STOP_WINDOW_CONFLICT, http: 422, condition: "Routing window overlap including travel buffer with a non-CANCELLED sibling stop" }
  - { id: ERR_TOUR_BUDGET_EXCEEDED, http: 422, condition: "Contract/amend guarantee exceeds tour.budget_available_cents" }
  - { id: ERR_CREW_INVALID_STATE, http: 409, condition: "CrewCall SETTLED/CANCELLED attempted outside POSTED" }
  - { id: ERR_CREW_COMPLEMENT_SHORT, http: 422, condition: "Crew lines below a satisfied CREW_MINIMUM check, or above venue.crew_available" }
  - { id: ERR_PERFORMANCE_OUTSIDE_WEEK, http: 422, condition: "perf_date outside [play_week_start, play_week_end]" }
  - { id: ERR_WRAP_NOT_READY, http: 409, condition: "WRAP attempted before the settlement is PAID" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties)
# =============================================================================
roles:
  - name: Producer
    description: "General manager / producer office: owns tour config, venues, contracts, waivers, settlement approval/dispute/payment, wrap, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /tours, PATCH /tours/{id}"
      - "POST /venues"
      - "PUT /stops/{id} with status in {CONTRACTED, CANCELLED, WRAPPED}; POST /stops/{id}/amend"
      - "PUT /tech-checks/{id} with status=WAIVED"
      - "PUT /settlements/{id} with status in {DISPUTED, VOID}"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "PUT /settlements/{id} with status in {APPROVED, PAID} (shared with Treasurer; SoD applies)"
      - "All GET endpoints"
  - name: TourManager
    description: "Routing and physical production: stops, tech advance, performances, crew calls"
    identity: opaque
    exclusive_operations:
      - "POST /tours/{id}/stops"
      - "PUT /stops/{id} with status in {ADVANCED, READY}"
      - "POST /stops/{id}/tech-checks; PUT /tech-checks/{id} with actual_value"
      - "POST /stops/{id}/performances; PUT /performances/{id} with status=CANCELLED"
      - "POST /stops/{id}/crew-calls; PUT /crew-calls/{id}"
    shared_operations: ["All GET endpoints"]
  - name: CompanyManager
    description: "Company management: cast contracts, tracks, coverage, injuries, per-diems"
    identity: opaque
    exclusive_operations:
      - "POST /tours/{id}/cast; PUT /cast/{id}"
      - "POST /tours/{id}/tracks; PATCH /tracks/{id}"
      - "POST /tracks/{id}/coverages; PUT /coverages/{id}"
      - "POST /cast/{id}/injuries; PUT /injuries/{id}"
      - "POST /stops/{id}/per-diems; PUT /per-diems/{id}"
    shared_operations: ["All GET endpoints"]
  - name: Treasurer
    description: "Box office treasurer: records grosses, submits settlements; may approve/pay settlements submitted/approved by a different user"
    identity: opaque
    exclusive_operations:
      - "PUT /performances/{id} with status=PLAYED"
      - "PUT /settlements/{id} figure fields (audited_gross_cents, taxes_cents, levies_cents) and status=SUBMITTED"
    shared_operations:
      - "PUT /settlements/{id} with status in {APPROVED, PAID} (shared with Producer; SoD applies)"
      - "All GET endpoints"
