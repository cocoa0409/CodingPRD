              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { r01: $.data.id }
          trigger:
            - call: "POST /soc/controls/00000000-0000-4000-8000-000000000000/assign-owner"
              payload: { owner_user_id: "own-1" }
              as: Auditor
              as_user_id: "aud-1"
              captures: { err_role: $.data.error_id }
            - call: "POST /soc/controls/00000000-0000-4000-8000-000000000000/assign-owner"
              payload: { owner_user_id: "own-1" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { err_missing: $.data.error_id }
          assert:
            - "${err_role} == ERR_ROLE_NOT_PERMITTED with HTTP status 403"
            - "${err_missing} == ERR_CONTROL_NOT_FOUND with HTTP status 404"
            - "Control.${r01}.owner_user_id == null"

