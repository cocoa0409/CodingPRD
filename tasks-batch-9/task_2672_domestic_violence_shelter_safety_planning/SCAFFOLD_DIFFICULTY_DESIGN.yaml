      - name: protective_order_refile_loop_reaches_denied_final
        grounds:
          - state_machines.ProtectiveOrderCase.FILED_to_PETITION_DRAFTED
          - state_machines.ProtectiveOrderCase.FILED_to_DENIED_FINAL
          - state_machines.ProtectiveOrderCase.PETITION_DRAFTED_to_FILED
