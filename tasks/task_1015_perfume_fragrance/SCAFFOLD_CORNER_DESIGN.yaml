scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: customer_create_returns_201_with_defaults
        claim_type: creation
        grounds: ["entities.Customer", "endpoints"]
        distinguishing_aspect: "POST /customers with email+full_name returns 201; status ACTIVE, tier BRONZE, loyalty_points_balance 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          assert:
            - "Customer.${cust_id}.status == ACTIVE"
            - "Customer.${cust_id}.tier == BRONZE"
            - "Customer.${cust_id}.loyalty_points_balance == 0"
            - "Customer.${cust_id}.version == 1"

      - name: order_computed_fields_defaulted_on_create
        claim_type: computed_field
        grounds: ["entities.Order.fields.fulfillment_status", "entities.Order.fields.payment_status"]
        distinguishing_aspect: "A freshly created order defaults fulfillment_status CART, payment_status UNPAID, and all pricing fields 0."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.fulfillment_status == CART"
            - "Order.${order_id}.payment_status == UNPAID"
            - "Order.${order_id}.total_cents == 0"

      - name: product_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.Product", "errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "GET /products/{unknown-uuid} returns ERR_PRODUCT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PRODUCT_NOT_FOUND"
            - "response.http_status == 404"

      - name: variant_create_missing_required_returns_400
        claim_type: required_field
        grounds: ["entities.Variant.fields.unit_price_cents", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST variant without required unit_price_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One product."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "P", brand: "H", concentration: "EDT" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "SAMPLE", volume_ml: 2, on_hand_qty: 5 }
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 400"

  # =================================================================
  - section: state_machines
    instances:
      - name: resume_active_subscription_returns_409
        claim_type: invalid_transition
        grounds: ["state_machines.Subscription.PAUSED_to_ACTIVE", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resuming an already ACTIVE subscription is an invalid transition -> ERR_INVALID_STATE (409); version unchanged."
        test_recipe:
          setup: ["One ACTIVE subscription."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "s1@x.com", full_name: "S1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", tier: "BASIC", monthly_fee_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: fulfill_cart_order_returns_409
        claim_type: invalid_transition
        grounds: ["state_machines.Order.PLACED_to_FULFILLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Fulfilling an order still in CART (never PLACED) is rejected ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["One CART order with a line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "s2@x.com", full_name: "S2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "P", brand: "H", concentration: "EDT" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 9000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: FulfillmentOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: approve_already_approved_return_returns_409
        claim_type: idempotency
        grounds: ["state_machines.ReturnRequest.REQUESTED_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an already APPROVED return is rejected ERR_INVALID_STATE (409); no second refund/claw-back fires."
        test_recipe:
          setup: ["A fulfilled 10000 order with an APPROVED return."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "s3@x.com", full_name: "S3" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "P", brand: "H", concentration: "EDP", hygiene_returnable: true }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 10000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: FulfillmentOps
            - call: "POST /returns"
              payload: { order_id: "${order_id}", line_ids: ["${line_id}"], condition: "SEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { return_id: $.data.id }
            - call: "POST /returns/${return_id}/approve"
              payload: {}
              as: FulfillmentOps
          trigger:
            - call: "POST /returns/${return_id}/approve"
              payload: {}
              as: FulfillmentOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_fulfilled_order_returns_409
        claim_type: invalid_transition
        grounds: ["state_machines.Order.PLACED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a FULFILLED order (cancel only valid from CART/PLACED) is rejected ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A FULFILLED order."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "s4@x.com", full_name: "S4" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "P", brand: "H", concentration: "EDT" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 9000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/fulfill"
              payload: {}
              as: FulfillmentOps
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

  # =================================================================
  - section: calculations
    instances:
      - name: order_pricing_5pct_tier_correct_result
        claim_type: correct_result
        grounds: ["calculations.order_pricing", "entities.Order.fields.discount_cents"]
        distinguishing_aspect: "Subtotal 19000 sits in the 5% tier -> discount 950, net 18050, free shipping, total 18050."
        test_recipe:
          setup: ["Customer; two variants 12000 and 3500; an order of one 12000 line + a 3500 line x2."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "k1@x.com", full_name: "K1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "P", brand: "H", concentration: "EDP" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 12000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { v_big: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "DECANT", volume_ml: 10, unit_price_cents: 3500, on_hand_qty: 5 }
              as: Merchandiser
              captures: { v_small: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v_big}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v_small}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Order.${order_id}.subtotal_cents == 19000"
            - "Order.${order_id}.discount_cents == 950"
            - "Order.${order_id}.shipping_fee_cents == 0"
            - "Order.${order_id}.total_cents == 18050"

      - name: customer_tier_silver_boundary_via_shipment
        claim_type: constants_applied
        grounds: ["calculations.customer_tier", "entities.Customer.fields.tier", "entities.Customer.fields.lifetime_spend_cents"]
        distinguishing_aspect: "Fulfilling a shipment charging exactly 50000 drives lifetime_spend_cents to the SILVER_MIN_CENTS boundary (>=50000) -> tier SILVER."
        test_recipe:
          setup: ["Customer; ACTIVE subscription monthly_fee 50000; one PENDING shipment for 2026-07-01."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "k2@x.com", full_name: "K2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", tier: "PREMIUM", monthly_fee_cents: 50000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/shipments"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FulfillmentOps
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /shipments/${ship_id}/fulfill"
              payload: {}
              as: FulfillmentOps
          assert:
            - "Customer.${cust_id}.lifetime_spend_cents == 50000"
            - "Customer.${cust_id}.tier == SILVER"

  # =================================================================
  - section: validations
    instances:
      - name: insufficient_stock_on_place_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "Placing an order whose line quantity 3 exceeds variant on_hand 2 is rejected ERR_INSUFFICIENT_STOCK (409)."
        test_recipe:
          setup: ["Variant on_hand 2; order line qty 3, still CART."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "v1@x.com", full_name: "V1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "P", brand: "H", concentration: "EDT" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "DECANT", volume_ml: 10, unit_price_cents: 3500, on_hand_qty: 2 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 3 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_STOCK"

      - name: insufficient_points_redeem_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "Redeeming 5 points with a 0 balance is rejected ERR_INSUFFICIENT_POINTS (422)."
        test_recipe:
          setup: ["Customer with 0 points; a CART order with one in-stock line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "v2@x.com", full_name: "V2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "P", brand: "H", concentration: "EDT" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "DECANT", volume_ml: 10, unit_price_cents: 3500, on_hand_qty: 5 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_POINTS"

      - name: claim_non_exclusive_product_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_PRODUCT_NOT_EXCLUSIVE]"]
        distinguishing_aspect: "Claiming allocation against a non-exclusive product's window is rejected ERR_PRODUCT_NOT_EXCLUSIVE (422)."
        test_recipe:
          setup: ["Non-exclusive product with one OPEN window."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "v3@x.com", full_name: "V3" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Reg", brand: "H", concentration: "EDT", is_exclusive: false }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/allocation-windows"
              payload: { window_start: "2026-06-15T00:00:00Z", window_end: "2026-07-31T00:00:00Z", total_allocation: 10, per_customer_cap: 5 }
              as: Merchandiser
              captures: { win_id: $.data.id, wv0: $.data.version }
          trigger:
            - call: "POST /allocation-windows/${win_id}/claims"
              payload: { customer_id: "${cust_id}", units: 1, expected_window_version: "${wv0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PRODUCT_NOT_EXCLUSIVE"

      - name: per_customer_limit_claim_returns_409
        claim_type: aggregate_validation
        grounds: ["validations[priority=8]", "errors[ERR_PER_CUSTOMER_LIMIT]", "calculations.allocation_remaining"]
        distinguishing_aspect: "A single claim of 6 units exceeds product.per_customer_limit 5 -> ERR_PER_CUSTOMER_LIMIT (409)."
        test_recipe:
          setup: ["Exclusive product per_customer_limit 5; OPEN window total 100 cap 100."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "v4@x.com", full_name: "V4" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Excl", brand: "M", concentration: "PARFUM", is_exclusive: true, per_customer_limit: 5 }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/allocation-windows"
              payload: { window_start: "2026-06-15T00:00:00Z", window_end: "2026-07-31T00:00:00Z", total_allocation: 100, per_customer_cap: 100 }
              as: Merchandiser
              captures: { win_id: $.data.id, wv0: $.data.version }
          trigger:
            - call: "POST /allocation-windows/${win_id}/claims"
              payload: { customer_id: "${cust_id}", units: 6, expected_window_version: "${wv0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PER_CUSTOMER_LIMIT"

      - name: return_before_fulfill_returns_409
        claim_type: cross_entity_validation
        grounds: ["validations[priority=4]", "errors[ERR_ORDER_NOT_FULFILLED]"]
        distinguishing_aspect: "Requesting a return on a merely PLACED (not FULFILLED) order is rejected ERR_ORDER_NOT_FULFILLED (409)."
        test_recipe:
          setup: ["A PLACED (unfulfilled) order with a line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "v5@x.com", full_name: "V5" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "P", brand: "H", concentration: "EDP", hygiene_returnable: true }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "FULL_BOTTLE", volume_ml: 100, unit_price_cents: 10000, on_hand_qty: 5 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${var_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${order_id}", line_ids: ["${line_id}"], condition: "SEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ORDER_NOT_FULFILLED"

  # =================================================================
  - section: endpoints
    instances:
      - name: orders_list_pagination_envelope
        claim_type: listing
        grounds: ["endpoints", "entities.Order.fields.customer_id"]
        distinguishing_aspect: "GET /orders?customer_id&limit=1 returns a paginated array envelope with has_more true when the customer has 2 orders."
        test_recipe:
          setup: ["Customer with two CART orders."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e1@x.com", full_name: "E1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /orders"
              payload: { customer_id: "${cust_id}", limit: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "response.data length == 1"
            - "response.meta pagination has_more == true"
            - "response.meta pagination total_count == 2"

      - name: note_finder_filters_by_family
        claim_type: computed_read
        grounds: ["endpoints", "entities.Product.fields.notes"]
        distinguishing_aspect: "GET /products?family=WOODY returns only products carrying a WOODY note."
        test_recipe:
          setup: ["One WOODY product and one CITRUS product."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Woodsy", brand: "M", concentration: "EDP", notes: [{ name: "Cedar", family: "WOODY", level: "BASE" }] }
              as: Merchandiser
              captures: { woody_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Citrusy", brand: "M", concentration: "EDT", notes: [{ name: "Bergamot", family: "CITRUS", level: "TOP" }] }
              as: Merchandiser
          trigger:
            - call: "GET /products"
              payload: { family: "WOODY" }
              as: Customer
              as_user_id: "any"
          assert:
            - "response.data every item has a note with family == WOODY"
            - "response.data includes product ${woody_id}"

  # =================================================================
  - section: errors
    instances:
      - name: claim_closed_window_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_ALLOCATION_WINDOW_NOT_OPEN]", "state_machines.AllocationWindow.OPEN_to_CLOSED"]
        distinguishing_aspect: "After the clock is advanced past window_end, the window is CLOSED and a claim is rejected ERR_ALLOCATION_WINDOW_NOT_OPEN (409)."
        test_recipe:
          setup: ["Exclusive product; window 2026-07-01..2026-07-05; clock advanced to 2026-07-10 (CLOSED)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "er1@x.com", full_name: "ER1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Excl", brand: "M", concentration: "PARFUM", is_exclusive: true, per_customer_limit: 5 }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/allocation-windows"
              payload: { window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-05T00:00:00Z", total_allocation: 10, per_customer_cap: 5 }
              as: Merchandiser
              captures: { win_id: $.data.id, wv0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /allocation-windows/${win_id}/claims"
              payload: { customer_id: "${cust_id}", units: 1, expected_window_version: "${wv0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ALLOCATION_WINDOW_NOT_OPEN"

  # =================================================================
  - section: rbac
    instances:
      - name: customer_cannot_create_product_returns_403
        claim_type: rbac_denied
        grounds: ["roles", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Customer calling POST /products (a Merchandiser exclusive op) is denied ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rb1@x.com", full_name: "RB1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { name: "X", brand: "Y", concentration: "EDT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "response.http_status == 403"

      - name: merchandiser_cannot_approve_return_returns_403
        claim_type: rbac_denied
        grounds: ["roles", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Merchandiser calling POST /returns/{id}/approve (a FulfillmentOps exclusive op) is denied ERR_UNAUTHORIZED (403); role check precedes existence."
        test_recipe:
          setup: ["Empty DB (role check fires before existence)."]
          setup_api_calls: []
          trigger:
            - call: "POST /returns/00000000-0000-0000-0000-000000000000/approve"
              payload: {}
              as: Merchandiser
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "response.http_status == 403"

      - name: customer_cannot_place_others_order_returns_403
        claim_type: rbac_denied
        grounds: ["roles", "errors[ERR_NOT_ORDER_OWNER]", "entities.Order.fields.customer_id"]
        distinguishing_aspect: "Customer A placing customer B's order (X-User-ID != order.customer_id) is denied ERR_NOT_ORDER_OWNER (403)."
        test_recipe:
          setup: ["Customer A and customer B; B has a CART order with an in-stock line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "a@own.com", full_name: "A" }
              as: PlatformAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { email: "b@own.com", full_name: "B" }
              as: PlatformAdmin
              captures: { cust_b: $.data.id }
            - call: "POST /products"
              payload: { name: "P", brand: "H", concentration: "EDT" }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { kind: "DECANT", volume_ml: 10, unit_price_cents: 3500, on_hand_qty: 5 }
              as: Merchandiser
              captures: { var_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_b}" }
              as: Customer
              as_user_id: "${cust_b}"
              captures: { order_b: $.data.id }
            - call: "POST /orders/${order_b}/lines"
              payload: { variant_id: "${var_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_b}"
          trigger:
            - call: "POST /orders/${order_b}/place"
              payload: { redeem_points: 0 }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_ORDER_OWNER"
            - "response.http_status == 403"

      - name: customer_read_unauthenticated_returns_401
        claim_type: rbac_denied
        grounds: ["roles", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request bearing an unknown role is rejected ERR_UNAUTHENTICATED (401) before any business logic."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "response.http_status == 401"

  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: claim_stale_window_version_returns_412
        claim_type: occ_conflict
        grounds: ["concurrency_rules[claim-create-stale-window]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one claim advances the window version 1->2, a second create still carrying expected_window_version 1 is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Exclusive product; OPEN window (version 1); first claim of 1 unit advances it to version 2."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "occ@x.com", full_name: "OCC" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Excl", brand: "M", concentration: "PARFUM", is_exclusive: true, per_customer_limit: 100 }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/allocation-windows"
              payload: { window_start: "2026-06-15T00:00:00Z", window_end: "2026-07-31T00:00:00Z", total_allocation: 100, per_customer_cap: 100 }
              as: Merchandiser
              captures: { win_id: $.data.id, wv0: $.data.version }
            - call: "POST /allocation-windows/${win_id}/claims"
              payload: { customer_id: "${cust_id}", units: 1, expected_window_version: "${wv0}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /allocation-windows/${win_id}/claims"
              payload: { customer_id: "${cust_id}", units: 1, expected_window_version: "${wv0}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.http_status == 412"

      - name: claim_correct_window_version_succeeds
        claim_type: occ_conflict
        grounds: ["concurrency_rules[claim-create-stale-window]", "entities.AllocationWindow.fields.version"]
        distinguishing_aspect: "A second claim carrying the CURRENT window version (2, re-read after the first claim) succeeds and advances version to 3."
        test_recipe:
          setup: ["Exclusive product; OPEN window; first claim advances version 1->2; window re-read for current version."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "occ2@x.com", full_name: "OCC2" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Excl", brand: "M", concentration: "PARFUM", is_exclusive: true, per_customer_limit: 100 }
              as: Merchandiser
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/allocation-windows"
              payload: { window_start: "2026-06-15T00:00:00Z", window_end: "2026-07-31T00:00:00Z", total_allocation: 100, per_customer_cap: 100 }
              as: Merchandiser
              captures: { win_id: $.data.id, wv0: $.data.version }
            - call: "POST /allocation-windows/${win_id}/claims"
              payload: { customer_id: "${cust_id}", units: 1, expected_window_version: "${wv0}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /allocation-windows/${win_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wv1: $.data.version }
          trigger:
            - call: "POST /allocation-windows/${win_id}/claims"
              payload: { customer_id: "${cust_id}", units: 1, expected_window_version: "${wv1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim2: $.data.id }
          assert:
            - "AllocationWindow.${win_id}.claimed_units == 2"
            - "AllocationWindow.${win_id}.version == 3"

