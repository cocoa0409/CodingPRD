      - name: flag_green_rip_beats_understaffed
        grounds:
          - validations[priority=13]
          - validations[priority=17]
          - entities.Zone.fields.rip_current_level
        distinguishing_aspect: |
          Raising GREEN with rip_current_level HIGH and on_duty_guard_count 0 (< min 1) violates
          BOTH ERR_RIP_CURRENT_UNSAFE (business_safety, p13) and ERR_ZONE_UNDERSTAFFED
          (business_constraint, p17); ERR_RIP_CURRENT_UNSAFE wins — safety outranks constraint
          (a different error-category pair from state-vs-temporal).
        test_recipe:
          setup:
            - "Clock 2026-07-15T09:00:00Z; beach; one zone(min_guards=1) still RED with 0 on-duty guards; rip_current_level set HIGH via conditions."
          setup_api_calls:
