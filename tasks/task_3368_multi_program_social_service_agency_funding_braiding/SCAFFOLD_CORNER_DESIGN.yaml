            - call: "POST /api/enrollments/00000000-0000-4000-8000-000000000000/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /api/service-deliveries/00000000-0000-4000-8000-000000000000/document"
              payload: {}
              as: ProgramManager
            - call: "POST /api/outcome-reports/00000000-0000-4000-8000-000000000000/submit"
              payload: {}
              as: ProgramManager
          assert:
            - "first.code == 404 and first.data.error_id == \"ERR_ENROLLMENT_NOT_FOUND\""
            - "second.code == 404 and second.data.error_id == \"ERR_DELIVERY_NOT_FOUND\""
            - "third.code == 404 and third.data.error_id == \"ERR_OUTCOME_REPORT_NOT_FOUND\""

