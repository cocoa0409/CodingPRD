              captures: { s15: $.data.id }
            - call: "POST /appointments"
              payload: { student_id: "${s15}", start_utc: "2026-05-01T09:00:00Z", end_utc: "2026-05-01T10:00:00Z", meeting_type: "STRATEGY" }
              as: Counselor
              as_user_id: "${c15}"
              captures: { ap15a: $.data.id }
          trigger:
