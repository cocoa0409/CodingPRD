            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-CRIT-02", fault_class: "CRITICAL", detected_at: "2026-06-12T08:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "CRITICAL" }
