  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: expired_judgment_beats_garnishment_floor
        grounds:
          - validations[priority=15]
          - validations[priority=41]
          - errors[ERR_JUDGMENT_EXPIRED]
          - errors[ERR_GARNISHMENT_BELOW_FLOOR]
          - state_machines.Judgment.status.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Category pair `state` (priority 15) versus `business_fiscal` (priority 41): a single request violates
          both because the judgment expired on the clock sweep AND the debtor's 21750-cent disposable earnings
          sit exactly at the federal floor, and the response must be ERR_JUDGMENT_EXPIRED, never
          ERR_GARNISHMENT_BELOW_FLOOR.
        test_recipe:
          setup:
            - "A CA judgment entered 2018-01-01 (expires_on 2028-01-01) with a RECORDED CA county filing and a VERIFIED EMPLOYMENT finding."
            - "The debtor's weekly_disposable_earnings_cents is exactly 21750, i.e. exactly 30x the 725-cent federal minimum wage, so the withholding formula yields 0."
            - "A DRAFT WAGE_GARNISHMENT action exists, then the clock is advanced to 2028-01-01, expiring the judgment while leaving DRAFT actions untouched."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA", head_of_household: false, weekly_disposable_earnings_cents: 21750 }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2018-0501", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 1000, entered_on: "2018-01-01", filing_costs_cents: 0 }
              as: CaseManager
              captures: { jud_id: $.data.id, jud_exp: $.data.expires_on }
            - call: "POST /county-filings"
              payload: { judgment_id: "${jud_id}", county_code: "CA-LOS-ANGELES", state_code: "CA", filing_type: "ABSTRACT_OF_JUDGMENT", fee_cents: 0 }
              as: CaseManager
              captures: { cf_id: $.data.id }
            - call: "POST /county-filings/${cf_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /county-filings/${cf_id}/adjudicate"
              payload: { outcome: "RECORDED", recorded_on: "2026-08-01" }
              as: CaseManager
            - call: "POST /asset-findings"
              payload: { judgment_id: "${jud_id}", asset_type: "EMPLOYMENT", institution_name: "Atlantic Freight Co", identifier_last4: "7712", estimated_value_cents: 0, source: "PUBLIC_RECORD", weekly_disposable_earnings_cents: 21750 }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { af_id: $.data.id }
            - call: "POST /asset-findings/${af_id}/verify"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { jv1: $.data.version }
            - call: "POST /enforcement-actions"
              payload: { judgment_id: "${jud_id}", asset_finding_id: "${af_id}", action_type: "WAGE_GARNISHMENT", expected_judgment_version: "${jv1}" }
              as: CaseManager
              captures: { ea_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-01T00:00:00Z" }
              as: CaseManager
              captures: { expired_n: $.data.expired_judgment_count }
          trigger:
            - call: "POST /enforcement-actions/${ea_id}/request-writ"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { err: $.data.error_id }
          assert:
            - "${jud_exp} == 2028-01-01"
            - "${expired_n} == 1"
            - "${err} == ERR_JUDGMENT_EXPIRED"
            - "${err} != ERR_GARNISHMENT_BELOW_FLOOR"
            - "HTTP status == 409"
            - "Judgment.${jud_id}.status == EXPIRED"
            - "EnforcementAction.${ea_id}.status == DRAFT"

      - name: segregation_of_duties_beats_stale_finding
        grounds:
          - validations[priority=17]
          - validations[priority=30]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_FINDING_STALE]
          - concurrency_rules[skip-trace-stale-debtor]
        distinguishing_aspect: |
          A DIFFERENT category pair from the expired-judgment case: `business_safety` (priority 17) versus
          `business_referential` (priority 30). The requester's X-User-ID equals the finding's
          verified_by_user_id AND a superseding skip trace has already staled that finding, so both checks
          fail and the response must be ERR_SEGREGATION_OF_DUTIES, never ERR_FINDING_STALE.
        test_recipe:
          setup:
            - "A CA judgment with a RECORDED CA county filing (posture LIEN_PERFECTED)."
            - "A SKIP_TRACE-sourced BANK_ACCOUNT finding of 900000 cents VERIFIED by user inv-7, then staled by a second skip trace on the same debtor."
            - "A DRAFT BANK_LEVY action referencing that finding, created while it was still VERIFIED."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA", weekly_disposable_earnings_cents: 100000 }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-0502", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 1000, entered_on: "2026-01-01", filing_costs_cents: 0 }
              as: CaseManager
              captures: { jud_id: $.data.id }
            - call: "POST /county-filings"
              payload: { judgment_id: "${jud_id}", county_code: "CA-LOS-ANGELES", state_code: "CA", filing_type: "ABSTRACT_OF_JUDGMENT", fee_cents: 0 }
              as: CaseManager
              captures: { cf_id: $.data.id }
            - call: "POST /county-filings/${cf_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /county-filings/${cf_id}/adjudicate"
              payload: { outcome: "RECORDED", recorded_on: "2026-08-01" }
              as: CaseManager
            - call: "POST /asset-findings"
              payload: { judgment_id: "${jud_id}", asset_type: "BANK_ACCOUNT", institution_name: "First Pacific Bank", identifier_last4: "8811", estimated_value_cents: 900000, source: "SKIP_TRACE" }
              as: AssetInvestigator
              as_user_id: "inv-7"
              captures: { af_id: $.data.id }
            - call: "POST /asset-findings/${af_id}/verify"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-7"
              captures: { verifier: $.data.verified_by_user_id }
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { jv1: $.data.version }
            - call: "POST /enforcement-actions"
              payload: { judgment_id: "${jud_id}", asset_finding_id: "${af_id}", action_type: "BANK_LEVY", expected_judgment_version: "${jv1}" }
              as: CaseManager
              captures: { ea_id: $.data.id }
            - call: "GET /debtors/${dbt_id}"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-7"
              captures: { dv1: $.data.version }
            - call: "POST /debtors/${dbt_id}/skip-trace"
              payload: { vendor: "IDI", located: true, hits_count: 5, expected_debtor_version: "${dv1}" }
              as: AssetInvestigator
              as_user_id: "inv-7"
          trigger:
            - call: "POST /enforcement-actions/${ea_id}/request-writ"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "inv-7"
              captures: { err: $.data.error_id }
          assert:
            - "${verifier} == inv-7"
            - "AssetFinding.${af_id}.status == STALE"
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
            - "${err} != ERR_FINDING_STALE"
            - "HTTP status == 403"
            - "EnforcementAction.${ea_id}.status == DRAFT"

      - name: role_not_permitted_beats_judgment_not_found
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_JUDGMENT_NOT_FOUND]
        distinguishing_aspect: |
          A third distinct category pair, `auth` (priority 3) versus `existence` (priority 5): a CaseManager
          calls the ComplianceOfficer-only renew endpoint on a judgment id that does not exist, and the
          response must be ERR_ROLE_NOT_PERMITTED, never ERR_JUDGMENT_NOT_FOUND.
        test_recipe:
          setup:
            - "A creditor exists so the database is non-empty, but no judgment carries the id used in the trigger."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
          trigger:
            - call: "POST /judgments/00000000-0000-4000-8000-000000000000/renew"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ROLE_NOT_PERMITTED"
            - "${err} != ERR_JUDGMENT_NOT_FOUND"
            - "HTTP status == 403"

