  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: frozen_program_priority_12_beats_subsidy_exhaustion_priority_38
        category_pair: "state (priority 12) vs business_fiscal (priority 38)"
        grounds:
          - validations[priority=12]
          - validations[priority=38]
          - errors.ERR_PROGRAM_FROZEN
          - errors.ERR_SUBSIDY_POOL_EXHAUSTED
          - entities.AffiliateProgram.fields.program_posture
          - entities.AffiliateProgram.fields.subsidy_available_cents
          - concurrency_rules[mortgage-approve-stale-program]
        distinguishing_aspect: |
          Scaffold-declared PRIORITY CONFLICT PAIR A: one approve call violates
          BOTH the state row (program_posture == FROZEN, priority 12) and the
          business_fiscal row (subsidy_available_cents 1000000 < 1950000,
          priority 38). Because 12 < 38 the response is exactly
          ERR_PROGRAM_FROZEN with HTTP 409 and ERR_SUBSIDY_POOL_EXHAUSTED is
          never returned; the error-category pair here is state vs
          business_fiscal, which no other instance of this rule repeats.
        test_recipe:
          setup:
            - "One AffiliateProgram with subsidy_pool_cents 1000000, committee_quorum 2, sweat_equity_base_hours_required 12; suspended at the end of setup so status == SUSPENDED and program_posture == FROZEN, with subsidy_committed_cents 0 and subsidy_available_cents 1000000."
            - "One ApplicantHousehold SELECTED (composite_selection_score 91.0 on the FINAL basis) with verified_annual_income_cents 3000000 and documentation_status VERIFIED."
            - "One BuildSite READY_TO_BUILD with appraised_value_cents 15000000, assigned to that household by the application create."
            - "One MortgageApplication in status UNDERWRITING submitted by officer-1, whose pinned structure is escrow_monthly_cents 20625, affordable_pi_payment_cents 54375, term_months 240, first_mortgage_principal_cents 13050000, silent_second_amount_cents 1950000 — strictly greater than the 1000000 available."
