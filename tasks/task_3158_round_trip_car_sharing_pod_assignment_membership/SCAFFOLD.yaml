      - repair_cost_cents?
      - loss_estimate_cents?
    output: Incident
    side_effects: ["Incident.status = OPEN", "Incident.damage_fee_charged = false", "Incident.fee_version = 0"]
  - method: GET
    path: "/car-share/incidents"
    description: "Filtered list of incidents by reservation, vehicle, member or status."
    roles: [Member, PodOperator, FleetAdmin]
    code: 200
    input:
      - reservation_id?
      - vehicle_id?
      - member_id?
      - assigned_driver_member_id?
      - status?
      - limit?
      - offset?
    output: Incident[]
    side_effects: []
  - method: GET
    path: "/car-share/incidents/{id}"
    description: "Read an incident including both the estimate and the final damage fee."
    roles: [Member, PodOperator, FleetAdmin]
    code: 200
    input: []
    output: Incident
    side_effects: []
  - method: POST
    path: "/car-share/incidents/{id}/party-split"
    description: "Assess damage responsibility: assigns the driver, computes both C3 fee variants, and forks on the C9 severity branch. OCC-guarded on the incident version."
    roles: [PodOperator]
    code: 200
    input:
      - assigned_driver_member_id?
      - repair_cost_cents?
      - expected_incident_version
    output: Incident
    side_effects: ["Incident.status = ASSESSED, FEE_CHARGED or CLOSED", "derives Incident.damage_fee_estimate_cents and Incident.member_damage_fee_cents via the C3 calculation", "derives the C9 severity branch (>= 4 to FEE_CHARGED, <= 2 to CLOSED)", "posts the damage fee as Member wallet service credit", "freezes every ACTIVE or SUSPENDED membership for the incident's member on the high-severity branch, which in turn cancels that member's HELD and CONFIRMED reservations and returns their vehicles to AVAILABLE", "increments Incident.version by 1", "increments Member.version by 1", "increments Membership.version by 1 per frozen row"]
  - method: POST
    path: "/car-share/incidents/{id}/maintenance-orders"
    description: "Raise a maintenance order from an incident; a blocking order moves the vehicle to MAINTENANCE."
    roles: [PodOperator]
    code: 201
    input:
      - pod_id
      - reason
      - blocking
      - scheduled_start
      - scheduled_end
    output: MaintenanceOrder
    side_effects: ["MaintenanceOrder.status = BLOCKED or SCHEDULED", "Vehicle.use_status = MAINTENANCE when blocking", "recompute Pod.utilization_score and Pod.available_bays", "increments Vehicle.version by 1", "increments Incident.version by 1"]
  - method: POST
    path: "/car-share/incidents/{id}/waive-fee"
    description: "Waive a charged incident fee from the member's wallet; the conserving compensating action of the fee posting."
    roles: [PodOperator]
    code: 200
    input:
      - reason
    output: Incident
    side_effects: ["debits Member.wallet_credit_cents by Incident.member_damage_fee_cents", "sets Incident.damage_fee_charged = false", "supplies the C7 conserved-quantity waiver item", "increments Member.version by 1", "increments Incident.version by 1"]

  # ---- Maintenance ----
  - method: POST
