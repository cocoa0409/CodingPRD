# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1956: Sponsored Research Post-Award & Effort Reporting
# Breadth walk over §1.1–§1.7 claims not covered by §1.8 (stubs cite the
# covering difficulty instance). Default logical clock: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: award_create_copies_sponsor_terms_and_defaults
        claim_type: system_fields
        grounds: [entities.GrantAward.fields.salary_cap_annual_cents, entities.GrantAward.fields.posture]
        distinguishing_aspect: "Award creation pins sponsor terms (cap 20000000, F&A 5000 bps, LETTER_OF_CREDIT), sets status PENDING_SETUP, posture OPEN, version 1, current_end_date == original_end_date, and auto-creates the F_AND_A line at 0."
        test_recipe:
          setup: ["One FEDERAL LOC sponsor exists"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
          trigger:
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "C-001", title: "Create defaults", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id, st: $.data.status, cap: $.data.salary_cap_annual_cents, fa: $.data.f_and_a_rate_bps, pm: $.data.payment_method, post: $.data.posture, ver: $.data.version, ced: $.data.current_end_date } }
            - { call: "GET /api/budget-lines", payload: { award_id: "${aw}", category: "F_AND_A" }, as: GrantsAccountant, captures: { fa_n: "$.data[0].authorized_cents" } }
          assert:
            - "st == PENDING_SETUP and post == OPEN and ver == 1"
            - "cap == 20000000 and fa == 5000 and pm == LETTER_OF_CREDIT  (version-pinned copies from the sponsor)"
            - "ced == \"2026-12-31T00:00:00Z\"  (current_end_date initialized from original_end_date)"
            - "fa_n == 0  (system-managed F_AND_A line auto-created empty)"

      - name: expenditure_salary_amount_input_ignored
        claim_type: computed_fields
        grounds: [entities.Expenditure.fields.amount_cents, calculations.salary_charge_with_cap]
        distinguishing_aspect: "A SALARY create that passes amount_cents 999999 has the input ignored: the server computes 833334 from the cap formula."
        test_recipe:
          setup: ["Award G-like: SAL 3000000 + FRINGE 900000, obligated 5850000, ACTIVE; PA (IBS 24000000/12) committed 50%"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000, late_payment_apr_bps: 0 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "P. Alpha", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 24000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pa: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pa}", award_number: "C-002", title: "Computed amount", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 5850000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "PERSONNEL_SALARIES", authorized_cents: 3000000 }, as: GrantCoordinator, captures: { sal: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "FRINGE_BENEFITS", authorized_cents: 900000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/effort-commitments", payload: { award_id: "${aw}", person_id: "${pa}", committed_effort_pct: 50.0, is_key_personnel: true }, as: GrantCoordinator }
          trigger:
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${sal}", expenditure_type: "SALARY", person_id: "${pa}", effort_pct: 50.0, period_months: 1, amount_cents: 999999, transaction_date: "2026-02-15T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { amt: $.data.amount_cents } }
          assert:
            - "amt == 833334  (server-computed; the 999999 input was ignored)"

      - name: commitment_default_is_key_personnel_false
        claim_type: defaults
        grounds: [entities.EffortCommitment.fields.is_key_personnel]
        distinguishing_aspect: "Omitting is_key_personnel on commitment create stores false."
        test_recipe:
          setup: ["ACTIVE award with one line"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "C-003", title: "Defaults", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
          trigger:
            - { call: "POST /api/effort-commitments", payload: { award_id: "${aw}", person_id: "${pi}", committed_effort_pct: 25.0 }, as: GrantCoordinator, captures: { key: $.data.is_key_personnel } }
          assert:
            - "key == false"

      - name: get_award_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_AWARD_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_AWARD_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/awards/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: GrantsAccountant, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_AWARD_NOT_FOUND"

      - name: sponsor_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=13]"]
        distinguishing_aspect: "Omitting required name on sponsor create -> 400 ERR_INVALID_REQUEST (shape checked after auth/existence/state)."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /api/sponsors", payload: { sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: subaward_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Subaward.fields.risk_rating, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "risk_rating EXTREME is not in {LOW, MEDIUM, HIGH} -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One ACTIVE award (TRAVEL 100000, obligated 150000)"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "C-006", title: "Enum", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
          trigger:
            - { call: "POST /api/subawards", payload: { award_id: "${aw}", subrecipient_name: "Sub X", total_subaward_cents: 100000, risk_rating: "EXTREME", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z" }, as: SponsoredProgramsOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: commitment_immutability_no_version_field
        claim_type: immutability
        grounds: [entities.EffortCommitment]
        distinguishing_aspect: "EffortCommitment (common_fields: false) exposes id and created_at only: no version or updated_at keys, and no update endpoint exists."
        test_recipe:
          setup: ["ACTIVE award with one line"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "C-007", title: "Immutable", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
          trigger:
            - { call: "POST /api/effort-commitments", payload: { award_id: "${aw}", person_id: "${pi}", committed_effort_pct: 25.0, is_key_personnel: true }, as: GrantCoordinator, captures: { cid: $.data.id } }
          assert:
            - "EffortCommitment.${cid} response contains id and created_at but NO version and NO updated_at keys"
  # ===========================================================================
  - section: state_machines
    instances:
      - name: expenditure_initial_state_pending_review
        claim_type: initial_state
        grounds: [state_machines.Expenditure]
        distinguishing_aspect: "A newly created expenditure starts in PENDING_REVIEW with posted_at null; it is invisible to budget lines until posted."
        test_recipe:
          setup: ["ACTIVE award, TRAVEL 100000 (obligated 150000)"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "SM-001", title: "Initial state", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { travel: $.data.id } }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
          trigger:
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${travel}", expenditure_type: "TRAVEL", amount_cents: 40000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { st: $.data.status, pa: $.data.posted_at } }
            - { call: "GET /api/budget-lines/${travel}", as: GrantsAccountant, captures: { spent: $.data.spent_cents } }
          assert:
            - "st == PENDING_REVIEW and pa is null"
            - "spent == 0  (pending rows never touch the line)"

      - name: drawdown_settle_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DrawdownRequest, "errors[ERR_DRAWDOWN_NOT_ACTIONABLE]"]
        distinguishing_aspect: "settle on a DRAFT drawdown (never submitted) -> 409 ERR_DRAWDOWN_NOT_ACTIONABLE; no reservation or drawn movement."
        test_recipe:
          setup: ["ACTIVE LOC award, TRAVEL 100000 posted cash (pool 150000); draw d1 DRAFT 50000"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "SM-002", title: "Invalid transition", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { travel: $.data.id } }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw}", budget_line_id: "${travel}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "GET /api/awards/${aw}", as: GrantsAccountant, captures: { v: $.data.version } }
            - { call: "POST /api/drawdown-requests", payload: { award_id: "${aw}", amount_cents: 50000, expected_award_version: "${v}" }, as: GrantsAccountant, captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /api/drawdown-requests/${d1}/settle", payload: {}, as: SponsorOfficial, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DRAWDOWN_NOT_ACTIONABLE"
            - "GrantAward.${aw}.cumulative_drawn_cents == 0 and reserved_draw_cents == 0"

      - name: transfer_approve_from_approved_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CostTransfer, "errors[ERR_TRANSFER_NOT_ACTIONABLE]"]
        distinguishing_aspect: "APPROVED is terminal: a second approve on an approved transfer -> 409 ERR_TRANSFER_NOT_ACTIONABLE; ledger effects do not double-fire."
        test_recipe:
          setup: ["Source S: TRAVEL 200000 (obligated 300000) with posted e 100000; target T: TRAVEL 100000 (obligated 150000); transfer approved once"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "SM-003A", title: "Lock source", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 300000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw_s: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "SM-003B", title: "Lock target", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw_t: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_s}", category: "TRAVEL", authorized_cents: 200000 }, as: GrantCoordinator, captures: { l_s: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw_t}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator, captures: { l_t: $.data.id } }
            - { call: "POST /api/awards/${aw_s}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/awards/${aw_t}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/expenditures", payload: { award_id: "${aw_s}", budget_line_id: "${l_s}", expenditure_type: "TRAVEL", amount_cents: 100000, transaction_date: "2026-03-01T00:00:00Z", is_allocable: true, is_reasonable: true, is_consistent: true, cash_disbursed: true }, as: GrantCoordinator, captures: { e: $.data.id } }
            - { call: "POST /api/expenditures/${e}/post", payload: {}, as: GrantsAccountant }
            - { call: "POST /api/cost-transfers", payload: { source_expenditure_id: "${e}", target_award_id: "${aw_t}", target_budget_line_id: "${l_t}", justification: "reallocate travel to the correct award" }, as: GrantCoordinator, as_user_id: "gc-1", captures: { tr: $.data.id } }
            - { call: "POST /api/cost-transfers/${tr}/submit", payload: {}, as: GrantCoordinator, as_user_id: "gc-1" }
            - { call: "POST /api/cost-transfers/${tr}/approve", payload: {}, as: GrantsAccountant, as_user_id: "ga-1" }
          trigger:
            - { call: "POST /api/cost-transfers/${tr}/approve", payload: {}, as: GrantsAccountant, as_user_id: "ga-2", captures: { err: $.data.error_id } }
            - { call: "GET /api/budget-lines/${l_t}", as: GrantsAccountant, captures: { t_spent: $.data.spent_cents } }
          assert:
            - "err == ERR_TRANSFER_NOT_ACTIONABLE  (terminal APPROVED lockdown)"
            - "t_spent == 100000  (mirror effect fired exactly once)"

      - name: award_close_without_accepted_ffr_returns_closeout_incomplete
        claim_type: precondition_enforcement
        grounds: [state_machines.GrantAward.CLOSEOUT_PENDING_to_CLOSED, "errors[ERR_CLOSEOUT_INCOMPLETE]"]
        distinguishing_aspect: "close while the auto-created FFR is still DRAFT -> 409 ERR_CLOSEOUT_INCOMPLETE (the close precondition bundle is gated on FFR ACCEPTED first)."
        test_recipe:
          setup: ["Award CL: TRAVEL 100000 (obligated 150000), ACTIVE; clock advanced past 2026-12-31; initiate-closeout done (FFR DRAFT exists)"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
            - { call: "POST /api/awards", payload: { sponsor_id: "${sp}", pi_id: "${pi}", award_number: "CL-001", title: "Closeout gate", project_start_date: "2026-01-01T00:00:00Z", original_end_date: "2026-12-31T00:00:00Z", total_obligated_cents: 150000, fringe_rate_bps: 3000 }, as: SponsoredProgramsOfficer, captures: { aw: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { award_id: "${aw}", category: "TRAVEL", authorized_cents: 100000 }, as: GrantCoordinator }
            - { call: "POST /api/awards/${aw}/activate", payload: {}, as: SponsoredProgramsOfficer }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/awards/${aw}/initiate-closeout", payload: {}, as: GrantsAccountant }
          trigger:
            - { call: "POST /api/awards/${aw}/close", payload: {}, as: GrantsAccountant, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CLOSEOUT_INCOMPLETE  (FFR is DRAFT, not ACCEPTED)"
            - "GrantAward.${aw}.status == CLOSEOUT_PENDING"

      - name: report_double_submit_rejected
        claim_type: idempotency
        grounds: [state_machines.ReportRequirement, "errors[ERR_REPORT_NOT_SUBMITTABLE]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED report -> 409 ERR_REPORT_NOT_SUBMITTABLE; submitted_at is not overwritten."
        test_recipe:
          setup: ["ACTIVE award; MILESTONE report due 2026-09-01; one submission done"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
            - { call: "POST /api/persons", payload: { full_name: "Dr. Prime", role_type: "PRINCIPAL_INVESTIGATOR", institutional_base_salary_annual_cents: 12000000, appointment_months: 12 }, as: SponsoredProgramsOfficer, captures: { pi: $.data.id } }
