        distinguishing_aspect: "In lot LA the usable reels are 300, 400, 900 and 1000 ft; MINIMIZE_REMNANT best-fit takes the three smallest (300, 400, 900) as one 200 ft conductor each, leaves the 1000 ft reel untouched, and pins OrderLine.lot_code to LA."
