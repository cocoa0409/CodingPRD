            - call: "POST /api/channels/${ch_id}/streams"
              payload: { title: "S", scheduled_start: "2026-08-15T10:00:00Z", scheduled_end: "2026-08-15T11:00:00Z" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { s_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/streams/${s_id}/transition"
              payload: { action: "START" }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T10:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/deliverables/${del_id}/transition"
              payload: { action: "PERFORM", stream_id: "${s_id}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/streams/${s_id}/transition"
              payload: { action: "END", peak_viewers: 300, avg_viewers: 250 }
              as: Creator
              as_user_id: "${ch_id}"
            - call: "POST /api/deliverables/${del_id}/transition"
              payload: { action: "PERFORM", stream_id: "${s_id}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { del_perf: $.data.performance_status }
          assert:
            - "While stream LIVE: err == ERR_INVALID_STATE; deliverable stays SCHEDULED"
            - "After stream ENDED: PERFORM succeeds, performance_status == PERFORMED"

      - name: simulcast_start_requires_covering_grant
        grounds:
          - "state_machines.StreamSession.SCHEDULED_to_LIVE"
          - "state_machines.SimulcastGrant"
          - "errors[ERR_SIMULCAST_GRANT_MISSING]"
        distinguishing_aspect: |
          Entity pair StreamSession->SimulcastGrant: START of a simulcast=true stream is gated on
          an APPROVED grant fully covering the scheduled window; a merely-REQUESTED grant fails
          with ERR_SIMULCAST_GRANT_MISSING — third distinct entity pair.
        test_recipe:
          setup:
            - "Channel STANDARD (W9 verified); simulcast grant REQUESTED for KICK window 2026-08-01..2026-08-31; stream simulcast=true scheduled 2026-08-10 10:00-11:00; clock 2026-08-10T10:00:00Z"
