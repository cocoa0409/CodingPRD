  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_agreement_half_open_adjacency
        grounds:
          - validations[priority=8]
        distinguishing_aspect: |
          Half-open interval semantics on RateAgreement (resource: shipper+lane
          tariff): [valid_from, valid_to) windows may TOUCH (a new window
          starting exactly at the existing window's valid_to is allowed) but any
          strict overlap is rejected with ERR_RATE_AGREEMENT_OVERLAP.
        test_recipe:
          setup:
            - "Shipper ACME exists; agreement R1 for SFO->NRT valid 2026-01-01T00:00:00Z .. 2026-07-01T00:00:00Z already filed"
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 5.00 } ], min_charge_amount: 250.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2026-07-01T00:00:00Z" }, as: PricingManager, captures: { ra1: "$.data.id" } }
          trigger:
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 4.80 } ], min_charge_amount: 240.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0, valid_from_utc: "2026-06-01T00:00:00Z", valid_to_utc: "2026-12-01T00:00:00Z" }, as: PricingManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 4.80 } ], min_charge_amount: 240.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0, valid_from_utc: "2026-07-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager, captures: { ra3: "$.data.id" } }
          assert:
            - "overlapping window (2026-06-01 opens inside R1): captured ${err} == ERR_RATE_AGREEMENT_OVERLAP"
            - "touching window (new valid_from == R1's valid_to 2026-07-01T00:00:00Z): created with id ${ra3} (half-open adjacency allowed)"
            - "GET /air-freight/shippers/${sh1}/rate-agreements returns total_count == 2 (R1 + R3 only)"

      - name: tender_window_buffer_gap
        grounds:
          - validations[priority=8]
          - state_machines.MasterWaybill.OPEN_FOR_CONSOLIDATION_to_TENDERED
        distinguishing_aspect: |
          Buffered interval semantics on MasterWaybill tender slots (different
          resource and different semantics than the half-open rate window):
          touching is NOT enough — a new tender window must keep a 30-minute
          gap from every other TENDERED waybill on the same booking, so
          11:00-12:00 against an existing 10:00-11:00 conflicts while
          11:30-12:30 is accepted.
        test_recipe:
          setup:
            - "Base SFO->NRT fixture; booking 500/50 OPEN"
            - "MAWB-1 (180-11111111) with HWB-A (80.0/0.60) consolidated and measured 0.60"
            - "MAWB-2 (180-22222222) with HWB-B (10.0/0.05) consolidated and measured 0.05"
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 5.00 } ], min_charge_amount: 250.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-11111111" }, as: CapacityPlanner, captures: { mb1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-22222222" }, as: CapacityPlanner, captures: { mb2: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills/${mb2}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-A", origin_code: "SFO", destination_code: "NRT", pieces: 5, gross_weight_kg: 80.0, declared_volume_m3: 0.60, dg_flag: false }, as: ForwarderOps, captures: { hwa: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hwa}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwa}/screening-records", as: ForwarderOps, captures: { sra: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${sra}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwa}", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills/${hwa}/measure", payload: { measured_volume_m3: 0.60 }, as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-B", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { hwb: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hwb}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwb}/screening-records", as: ForwarderOps, captures: { srb: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${srb}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb2}", as: ForwarderOps, captures: { mv2: "$.data.version" } }
            - { call: "POST /air-freight/master-waybills/${mb2}/house-waybills", payload: { hwb_id: "${hwb}", expected_master_waybill_version: "${mv2}" }, as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills/${hwb}/measure", payload: { measured_volume_m3: 0.05 }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/tender", payload: { tender_window_start_utc: "2026-08-09T10:00:00Z", tender_window_end_utc: "2026-08-09T11:00:00Z" }, as: CapacityPlanner, captures: { mb1_st: "$.data.status" } }
          trigger:
            - { call: "POST /air-freight/master-waybills/${mb2}/tender", payload: { tender_window_start_utc: "2026-08-09T11:00:00Z", tender_window_end_utc: "2026-08-09T12:00:00Z" }, as: CapacityPlanner, captures: { err: "$.data.error_id" } }
            - { call: "POST /air-freight/master-waybills/${mb2}/tender", payload: { tender_window_start_utc: "2026-08-09T11:30:00Z", tender_window_end_utc: "2026-08-09T12:30:00Z" }, as: CapacityPlanner, captures: { mb2_st: "$.data.status" } }
          assert:
            - "MAWB-1 tendered at 10:00-11:00 (captured ${mb1_st} == TENDERED)"
            - "11:00-12:00 violates the 30-minute buffer (11:00 < 11:00 + 30min): captured ${err} == ERR_TENDER_WINDOW_CONFLICT; MAWB-2 stays OPEN_FOR_CONSOLIDATION"
            - "11:30-12:30 keeps exactly the 30-minute gap (inclusive boundary): captured ${mb2_st} == TENDERED"

  - rule_id: compensating_invariant
    instances:
      - name: booking_consumed_weight_conservation
        grounds:
          - state_machines.HouseWaybill.CLEARED_to_CONSOLIDATED
          - state_machines.HouseWaybill.CONSOLIDATED_to_CLEARED
          - entities.FlightBooking.fields.consumed_weight_kg
        distinguishing_aspect: |
          Conserved quantity: booking weight. consolidate then deconsolidate are
          compensating actions and FlightBooking.consumed_weight_kg ==
          SUM(chargeable_weight_kg of attached waybills) must hold after every
          hop: 100.0 after A, 500.0 after B, exactly 400.0 after removing A,
          0.0 after removing B.
