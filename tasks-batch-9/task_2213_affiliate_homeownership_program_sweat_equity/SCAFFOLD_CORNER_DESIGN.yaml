      - name: cost_entry_ledger_is_append_only_and_void_preserves_the_row
        claim_type: immutability
        grounds: [entities.CostEntry, "endpoints.POST /homeownership/cost-entries/{id}/void", "endpoints.GET /homeownership/cost-entries/{id}", calculations.development_cost_basis, entities.BuildSite.fields.cash_cost_cents]
        distinguishing_aspect: "CostEntry declares common_fields false: the response carries id and created_at but NO version and NO updated_at, there is no update endpoint, and voiding does not delete — the row survives with status VOIDED while both cost bases fall back to the pre-entry values."
        test_recipe:
          setup:
            - "Canonical program with a RAW_LAND site whose acquisition cost is 4000000; one 1000000-cent cash MATERIALS entry and one 750000-cent in-kind donation are appended, so cash_cost_cents is 5000000 and total_development_cost_cents is 5750000 before the trigger."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/cost-entries", payload: { build_site_id: "${site_id}", category: "MATERIALS", is_in_kind: false, amount_cents: 1000000 }, as: ConstructionManager, as_user_id: "cm-1", captures: { cash_entry_id: $.data.id } }
            - { call: "POST /homeownership/cost-entries", payload: { build_site_id: "${site_id}", category: "MATERIALS", is_in_kind: true, fair_market_value_cents: 750000, donor_name: "Cedar Lumber Co" }, as: ConstructionManager, as_user_id: "cm-1", captures: { kind_entry_id: $.data.id } }
          trigger:
            - { call: "GET /homeownership/cost-entries/${cash_entry_id}", as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/cost-entries/${kind_entry_id}/void", payload: { void_reason: "Donation receipt withdrawn by the donor" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "GET /homeownership/cost-entries", payload: { build_site_id: "${site_id}" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/build-sites/${site_id}", as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/programs/${prog_id}", as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "GET of ${cash_entry_id} returns HTTP 200 with $.data.id and $.data.created_at present and NO version field and NO updated_at field (common_fields false)"
            - "Void returns HTTP 200 with $.data.status == VOIDED and the same $.data.id == ${kind_entry_id}; $.data.fair_market_value_cents is still 750000 (the amount is preserved, only the status moved)"
            - "The cost-entry list for ${site_id} still reports total_count == 2 — voiding is not deletion"
            - "Site: $.data.cash_cost_cents == 5000000 (4000000 acquisition + 1000000 cash) and $.data.total_development_cost_cents == 5000000, the voided 750000 donation having left the FMV basis"
            - "Program: $.data.donated_material_fmv_cents == 0 after the void"

