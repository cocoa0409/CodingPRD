# =============================================================================
# SCAFFOLD.yaml — Member Eligibility Verification Tied to Military Service &
# Family Lineage (USAA-style)
#
# §1.0 Response Envelope + §1.1 Entities + §1.2 State Machines (+ §1.2.1
# Concurrency) + §1.3 Calculations + §1.4 Validations + §1.5 Endpoints +
# §1.6 Errors + §1.7 RBAC.
#
# Difficulty targeting (§1.8) and corner coverage (§1.9) live in the two
# sibling files — NOT here.
# =============================================================================

scenario: |
  Member Eligibility Verification Tied to Military Service & Family Lineage
  (USAA): eligibility determination from service records, discharge
  characterization and family relationship to an existing member, member
  number issuance and household linkage with generational eligibility
  inheritance, product availability differences by eligibility category across
  banking, insurance and investments, verification of service documentation
  with exception handling for lost records, eligibility loss events and
  grandfathering of existing policies, deployment-related service features
  including rate reductions and claim deferrals under servicemember
  protections, overseas address handling and duty station change processing,
  beneficiary and survivor support after a member's death.

domain_name: member-eligibility-military-lineage
api_prefix: /membership

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: access_control_matrix
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - scheduled_deferred_actions
    - conditional_feature_flags
  entity_topology: graph
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: EligibilityCase
    parent: null
    common_fields: true
    fields:
      - { name: applicant_legal_name, type: string, source: input, description: "Applicant full legal name as it appears on submitted documentation" }
      - { name: applicant_dob, type: datetime, source: input, description: "Applicant date of birth (ISO 8601 date)" }
      - { name: basis_type, type: enum, source: input, description: "Eligibility basis; one of DIRECT_SERVICE | FAMILY_DERIVATION | CADET_APPOINTMENT" }
      - { name: sponsor_member_id, type: string, source: input, description: "FK -> Member.id; required iff basis_type == FAMILY_DERIVATION, otherwise must be null" }
      - { name: claimed_relationship, type: enum, source: input, description: "Claimed relationship to sponsor; one of SPOUSE | WIDOW_WIDOWER | CHILD | STEPCHILD | FORMER_SPOUSE; required iff basis_type == FAMILY_DERIVATION, otherwise null" }
      - { name: eligibility_category, type: enum, source: computed, description: "Derived on transition to APPROVED; one of OFFICER_CADET | ENLISTED_ACTIVE | VETERAN_HONORABLE | FAMILY_SPOUSE | FAMILY_WIDOW | FAMILY_CHILD; gates product availability" }
      - { name: adoption_or_divorce_flag, type: boolean, source: input, default: false, description: "True when the claimed derivation runs through adoption or a divorce/remarriage event; selects the extended lineage-verification variant" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; minted Member row on APPROVED; null until then" }
      - { name: verification_officer_id, type: string, source: system, description: "X-User-ID of the VerificationOfficer who performed the APPROVED transition; segregation-of-duties anchor" }
      - { name: record_reconstruction_officer_id, type: string, source: system, description: "X-User-ID of the VerificationOfficer who performed the most recent RECORD_RECONSTRUCTION decision; null when none" }
      - { name: denial_reason, type: string, source: system, description: "Human-readable reason recorded on DENIED; null otherwise" }
      - { name: decision_note, type: string, source: system, description: "Note recorded on the most recent record-reconstruction decision" }
      - { name: status, type: enum, source: system, description: "INTAKE -> UNDER_REVIEW -> {APPROVED | DENIED | MORE_INFO_REQUIRED -> UNDER_REVIEW}" }

  - name: ServiceRecord
    parent: EligibilityCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> EligibilityCase.id; owning case" }
      - { name: branch, type: enum, source: input, description: "Service branch; one of ARMY | NAVY | AIR_FORCE | MARINES | COAST_GUARD | SPACE_FORCE | NOAA_CORPS | PHS_CORPS" }
      - { name: component, type: enum, source: input, description: "Component; one of ACTIVE_DUTY | RESERVE | NATIONAL_GUARD | CADET" }
      - { name: rank_grade, type: string, source: input, description: "Highest rank or grade (e.g. E-6, O-3)" }
      - { name: service_start_date, type: datetime, source: input, description: "Service period start (ISO 8601 date)" }
      - { name: service_end_date, type: datetime, source: input, description: "Service period end; null when period is ongoing (currently serving)" }
      - { name: discharge_characterization, type: enum, source: input, description: "One of HONORABLE | GENERAL_UNDER_HONORABLE | OTHER_THAN_HONORABLE | BAD_CONDUCT | DISHONORABLE | MEDICAL | ENTRY_LEVEL | STILL_SERVING" }
      - { name: service_verified, type: boolean, source: system, default: false, description: "True once the record has been accepted by verification (submitted evidence or approved reconstruction)" }
      - { name: service_days, type: integer, source: computed, description: "Calendar days from service_start_date to (service_end_date when set, else the logical clock date); 0 for a zero-length period" }

  - name: EvidenceDocument
    parent: EligibilityCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> EligibilityCase.id; owning case" }
      - { name: doc_type, type: enum, source: input, description: "One of DD214 | NGB22 | MARRIAGE_CERTIFICATE | BIRTH_CERTIFICATE | ADOPTION_DECREE | DIVORCE_DECREE | DEATH_CERTIFICATE | LEAVE_EARNINGS_STATEMENT | ORDERS" }
      - { name: issuing_authority, type: string, source: input, description: "Issuing body named on the document" }
      - { name: issued_on, type: datetime, source: input, description: "Issue date (ISO 8601 date)" }
      - { name: covers_service_record_id, type: string, source: input, description: "FK -> ServiceRecord.id; which service record this evidence supports; null for purely lineage evidence" }
      - { name: authenticity_channel, type: enum, source: system, default: SELF_DECLARED, description: "One of SELF_DECLARED | ISSUER_CONFIRMED | ARCHIVES_CONFIRMED; fixed at upload" }
      - { name: content_hash, type: string, source: input, description: "Client-computed SHA-256 hex digest; uniqueness anchor per case" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: member_number, type: string, source: system, description: "Zero-padded 10-digit sequential number assigned at approval (first member is 0000000001); permanent, never reassigned" }
      - { name: legal_name, type: string, source: system, description: "Copied from the approved case" }
      - { name: dob, type: datetime, source: system, description: "Copied from the approved case" }
      - { name: case_id, type: string, source: system, description: "FK -> EligibilityCase.id; the case whose approval minted this member (unique per member)" }
      - { name: eligibility_category, type: enum, source: system, description: "Copied from case at approval; same enum as EligibilityCase.eligibility_category" }
      - { name: sponsor_member_id, type: string, source: system, description: "FK -> Member.id (self-referential); sponsoring member for family-derived members; null for direct-service members" }
      - { name: claimed_relationship, type: enum, source: system, description: "Relationship to sponsor; same enum as EligibilityCase.claimed_relationship; null for direct-service members" }
      - { name: household_id, type: string, source: system, description: "FK -> Household.id; null until linked via /link-household" }
      - { name: lineage_depth, type: integer, source: system, default: 0, description: "0 for direct-service members; sponsor.lineage_depth + 1 for derived members; derivation rejected at MAX_LINEAGE_DEPTH" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | DECEASED | REVOKED (terminal: DECEASED, REVOKED)" }
      - { name: deployment_posture, type: enum, source: system, default: NONE, description: "Parallel state dimension; NONE | DEPLOYED" }
      - { name: product_matrix_cache, type: object, source: computed, description: "Cached 24-facet availability matrix; recomputed on category assignment, status transitions and posture transitions; recomputed on read when stale" }

  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: household_name, type: string, source: input, description: "Display label for the household" }
      - { name: primary_member_id, type: string, source: input, description: "FK -> Member.id; the member whose lineage anchors this household; immutable after creation" }
      - { name: aggregate_product_count, type: integer, source: computed, description: "Sum over linked members of that member's AVAILABLE facet count; recomputed on every link, delink, category change, status transition, posture transition and product-flag change" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISSOLVED (terminal: DISSOLVED)" }

  - name: AddressAssignment
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; address holder" }
      - { name: addr_type, type: enum, source: input, description: "One of DOMESTIC_RESIDENCE | MILITARY_APO_FPO_DPO | OVERSEAS_FOREIGN" }
      - { name: line1, type: string, source: input, description: "Street line 1" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: region_code, type: string, source: input, description: "State code, military AE/AP/AA region, or foreign region label" }
      - { name: postal_code, type: string, source: input, description: "Postal or ZIP code" }
      - { name: country_code, type: string, source: input, description: "ISO country code; US for domestic and military-post addresses" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage interval start (ISO 8601 date)" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage interval end; null when ongoing; must be strictly greater than effective_from when set" }
      - { name: is_duty_station, type: boolean, source: input, default: false, description: "True when this address is a duty station posting (PCS)" }

  - name: DeploymentOrder
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; deployed member" }
      - { name: orders_number, type: string, source: input, description: "Official orders identifier (unique)" }
      - { name: theater, type: string, source: input, description: "Deployment theater label" }
      - { name: start_date, type: datetime, source: input, description: "Deployment start (ISO 8601 date)" }
      - { name: end_date, type: datetime, source: input, description: "Deployment end; null while open; must be >= start_date when set" }
      - { name: scra_eligible, type: boolean, source: input, description: "Whether servicemember-protection rate relief applies to this deployment" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ACTIVE | COMPLETED | CANCELLED" }

  - name: ProtectionClaim
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; claiming member" }
      - { name: deployment_order_id, type: string, source: input, description: "FK -> DeploymentOrder.id; deployment this claim is tied to; null when the claim predates any order registration" }
      - { name: claim_type, type: enum, source: input, description: "One of RATE_REDUCTION | CLAIM_DEFERRAL | LEASE_TERMINATION" }
      - { name: obligation_label, type: string, source: input, description: "Label of the underlying obligation (e.g. AUTO_LOAN_1, HOMEOWNERS_PREM)" }
      - { name: base_rate_bps, type: integer, source: input, description: "Pre-claim annual rate in basis points (RATE_REDUCTION only)" }
      - { name: monthly_interest_cents, type: integer, source: input, description: "Monthly interest at the base rate in cents (RATE_REDUCTION only)" }
      - { name: periods_granted, type: integer, source: computed, description: "Months between approval_effective_date and the deployment end (cap 60); null until approval" }
      - { name: total_relief_cents, type: integer, source: computed, description: "Approved monetary relief per scra_rate_relief; null until approval" }
      - { name: approval_effective_date, type: datetime, source: system, description: "Approval date (= logical clock date at APPROVED transition)" }
      - { name: approved_by_officer_id, type: string, source: system, description: "X-User-ID of approving VerificationOfficer; must differ from claim.member_id under segregation of duties" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> {APPROVED | DENIED}; APPROVED -> SUPERSEDED (auto, on approval of a newer claim for the same obligation_label)" }

  - name: ProductOffering
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code (e.g. CK_BASIC, AUTO_INS, IRA_BROKERAGE)" }
      - { name: product_line, type: enum, source: input, description: "One of BANKING | INSURANCE | INVESTMENT" }
      - { name: product_name, type: string, source: input, description: "Display name" }
      - { name: allowed_categories, type: array, source: input, description: "Subset of the six eligibility categories permitted to hold this product" }
      - { name: requires_active_status, type: boolean, source: input, default: true, description: "When true the product is only AVAILABLE while Member.status == ACTIVE (denominator toggle for household aggregation)" }
      - { name: deployment_enhanced, type: boolean, source: input, default: false, description: "When true the product gains a deployment-only facet (DEPLOYMENT_RATE_CAP) while deployment_posture == DEPLOYED" }
      - { name: is_active_flag, type: boolean, source: system, default: true, description: "Retired offerings (false) stop contributing to aggregates" }

  - name: ProductEntitlement
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; holding member" }
      - { name: product_offering_id, type: string, source: input, description: "FK -> ProductOffering.id; held product" }
      - { name: opened_at, type: datetime, source: system, description: "Open timestamp (logical clock)" }
      - { name: closure_reason, type: enum, source: system, description: "One of MEMBER_LOSS | VOLUNTARY | GRANDFATHERED_RETIRE; null while open" }
      - { name: grandfathered, type: boolean, source: system, default: false, description: "True when the entitlement survived an eligibility loss event or category change under grandfathering" }
      - { name: exposure_cents, type: integer, source: input, default: 0, description: "Annualized premium/loan/book-value exposure feeding survivor_continuance and protection_relief_cap" }
      - { name: status, type: enum, source: system, description: "OPEN | GRANDFATHERED -> CLOSED (terminal: CLOSED)" }

  - name: SurvivorSupportCase
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the deceased member" }
      - { name: beneficiary_member_id, type: string, source: input, description: "FK -> Member.id; surviving spouse/child member who receives support" }
      - { name: continuance_months, type: integer, source: computed, description: "Protection continuance window per survivor_continuance; null until GRANTED" }
      - { name: continuance_amount_cents, type: integer, source: computed, description: "Support amount per survivor_continuance; null until GRANTED" }
      - { name: transfer_household_id, type: string, source: system, description: "FK -> Household.id; household the beneficiary was moved to by the grant cascade; null until GRANTED" }
      - { name: resolution_note, type: string, source: system, description: "Free-text note recorded at CLOSED" }
      - { name: status, type: enum, source: system, description: "OPEN -> GRANTED -> CLOSED (terminal: CLOSED)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: EligibilityCase
    initial_state: INTAKE
    terminal_states: [DENIED, APPROVED]
    transitions:
      - from: INTAKE
        to: UNDER_REVIEW
        trigger: "POST /membership/eligibility-cases/{caseId}/submit"
        actor: EligibilityApplicant
        preconditions:
          - "At least one ServiceRecord exists for the case when basis_type == DIRECT_SERVICE or CADET_APPOINTMENT (ERR_SERVICE_RECORD_REQUIRED)"
          - "At least one EvidenceDocument exists for the case (ERR_EVIDENCE_REQUIRED)"
          - "When basis_type == FAMILY_DERIVATION: sponsor Member exists, sponsor.status == ACTIVE, and sponsor.lineage_depth + 1 <= MAX_LINEAGE_DEPTH (ERR_LINEAGE_DEPTH_EXCEEDED)"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /membership/eligibility-cases/{caseId}/decide"
        actor: VerificationOfficer
        preconditions:
          - "decision == APPROVE"
          - "Every ServiceRecord of the case has service_verified == true (ERR_SERVICE_RECORD_UNVERIFIED)"
          - "Segregation of duties: officer X-User-ID != record_reconstruction_officer_id when the case passed through RECORD_RECONSTRUCTION (ERR_SEGREGATION_OF_DUTIES)"
          - "When basis_type == FAMILY_DERIVATION: sponsor still ACTIVE (ERR_SPONSOR_NOT_ACTIVE)"
          - "Eligibility derivation rule satisfied for the claimed basis (ERR_ELIGIBILITY_DERIVATION_FAILED)"
        side_effects:
          - "Compute eligibility_category per eligibility_category_assignment"
          - "Mint Member: member_number assigned by next member counter; lineage_depth = 0 for direct basis, sponsor.lineage_depth + 1 otherwise; case.member_id set; Member.case_id back-reference set"
          - "Compute initial Member.product_matrix_cache via product_availability_matrix"
          - "If sponsor has household_id != null: set new Member.household_id to the sponsor's household and recompute that household's aggregate_product_count"
          - "Verification officer X-User-ID recorded as verification_officer_id"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /membership/eligibility-cases/{caseId}/decide"
        actor: VerificationOfficer
        preconditions:
          - "decision == DENY"
        side_effects:
          - "denial_reason recorded; case becomes immutable"

      - from: UNDER_REVIEW
        to: MORE_INFO_REQUIRED
        trigger: "POST /membership/eligibility-cases/{caseId}/decide"
        actor: VerificationOfficer
        preconditions:
          - "decision == REQUEST_MORE_INFO"
        side_effects:
          - "decision_note recorded; applicant may upload further evidence"

      - from: MORE_INFO_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /membership/eligibility-cases/{caseId}/submit"
        actor: EligibilityApplicant
        preconditions:
          - "At least one additional EvidenceDocument has been uploaded since the case entered MORE_INFO_REQUIRED (ERR_NO_NEW_EVIDENCE)"
        side_effects: []
        note: "Revision loop UNDER_REVIEW -> MORE_INFO_REQUIRED -> UNDER_REVIEW is unbounded."

  - entity: Member
    initial_state: ACTIVE
    terminal_states: [DECEASED, REVOKED]
    note: "Two independent state dimensions evolve on the same row: status (ACTIVE | SUSPENDED | DECEASED | REVOKED) and deployment_posture (NONE | DEPLOYED)."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /membership/members/{memberId}/eligibility-loss"
        actor: VerificationOfficer
        preconditions:
          - "loss_type == DOCUMENTATION_REVOKED"
        side_effects:
          - "Every ProductEntitlement with status OPEN -> GRANDFATHERED with grandfathered := true (documentation loss grandfathers the whole book; entitlements already GRANDFATHERED stay GRANDFATHERED)"
          - "Member.product_matrix_cache recomputed via product_availability_matrix (suspended variant)"
          - "If household_id != null: recompute Household.aggregate_product_count"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /membership/members/{memberId}/eligibility-loss"
        actor: VerificationOfficer
        preconditions:
          - "loss_type == FRAUD_CONFIRMED"
        side_effects:
          - "Every OPEN and every GRANDFATHERED ProductEntitlement -> CLOSED with closure_reason := MEMBER_LOSS (grandfathering ends)"
          - "Every Member whose sponsor_member_id == this member and whose status == ACTIVE -> SUSPENDED (descendant cascade, one generation); product matrices of those members recomputed; their households' aggregates recomputed"
          - "Member.product_matrix_cache recomputed; household aggregate recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /membership/members/{memberId}/reinstate"
        actor: VerificationOfficer
        preconditions:
          - "Restoration evidence exists: an EvidenceDocument on the member's case uploaded after the loss event (ERR_REINSTATEMENT_EVIDENCE_REQUIRED)"
        side_effects:
          - "Member.product_matrix_cache recomputed; household aggregate recomputed (already-GRANDFATHERED entitlements stay GRANDFATHERED)"

      - from: ACTIVE
        to: DECEASED
        trigger: "POST /membership/members/{memberId}/deceased"
        actor: BenefitsOfficer
        preconditions: []
        side_effects:
          - "A SurvivorSupportCase (status OPEN) is created for the beneficiary: the request's beneficiary_member_id when provided, else the surviving spouse member, else the earliest-created surviving child member (created_at ASC); none created when no surviving family member exists"
          - "Member.product_matrix_cache recomputed (all facets UNAVAILABLE); household aggregate recomputed"
        note: "DECEASED is reachable only from ACTIVE; a SUSPENDED member must be reinstated before death processing."

      - from: NONE
        to: DEPLOYED
        trigger: "POST /membership/members/{memberId}/deployment-orders (auto when the new order start_date <= logical clock date and end_date is null or in the future)"
        actor: system
        preconditions:
          - "Member.status == ACTIVE"
        side_effects:
          - "Member.product_matrix_cache recomputed (deployment posture adds DEPLOYMENT_RATE_CAP facet to deployment_enhanced offerings)"
          - "Household aggregate recomputed"

      - from: DEPLOYED
        to: NONE
        trigger: "system (auto when the last ACTIVE DeploymentOrder completes or is cancelled)"
        actor: system
        preconditions:
          - "No remaining DeploymentOrder in status ACTIVE for the member"
        side_effects:
          - "Member.product_matrix_cache recomputed; household aggregate recomputed"

  - entity: DeploymentOrder
    initial_state: REGISTERED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REGISTERED
        to: ACTIVE
        trigger: "system (auto-activation on POST /membership/members/{memberId}/deployment-orders when start_date <= logical clock date)"
        actor: system
        preconditions: []
        side_effects:
          - "Member.deployment_posture NONE -> DEPLOYED (posture cascade)"

      - from: [REGISTERED, ACTIVE]
        to: COMPLETED
        trigger: "POST /membership/deployment-orders/{orderId}/complete"
        actor: VerificationOfficer
        preconditions:
          - "end_date is set (PATCH the order first when open-ended) (ERR_DEPLOYMENT_END_DATE_REQUIRED)"
          - "end_date <= logical clock date (ERR_DEPLOYMENT_NOT_ENDED)"
        side_effects:
          - "If no other ACTIVE order remains for the member: Member.deployment_posture DEPLOYED -> NONE"

      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /membership/deployment-orders/{orderId}/cancel"
        actor: VerificationOfficer
        preconditions:
          - "Order is REGISTERED (an ACTIVE order must be completed, not cancelled) (ERR_INVALID_STATE)"
        side_effects:
          - "If it had activated posture (it cannot, per precondition) — none; posture unchanged"

  - entity: ProtectionClaim
    initial_state: REQUESTED
    terminal_states: [DENIED, SUPERSEDED]
    note: "APPROVED is a stable non-terminal state; the only exit is SUPERSEDED when a newer claim for the same obligation_label is approved."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /membership/protection-claims/{claimId}/decide"
        actor: VerificationOfficer
        preconditions:
          - "decision == APPROVE"
          - "Segregation of duties: approving officer X-User-ID != claim.member_id (ERR_SEGREGATION_OF_DUTIES)"
          - "For RATE_REDUCTION: claim.deployment_order_id references an ACTIVE order with scra_eligible == true (ERR_SCRA_NOT_ELIGIBLE)"
          - "periods_granted per scra_rate_relief must be > 0 (ERR_NO_RELIEF_AVAILABLE)"
        side_effects:
          - "periods_granted, total_relief_cents, approval_effective_date, approved_by_officer_id populated via scra_rate_relief (RATE_REDUCTION) or deferral window (CLAIM_DEFERRAL)"
          - "Any other ProtectionClaim of the same member with the same obligation_label in status APPROVED -> SUPERSEDED (auto)"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /membership/protection-claims/{claimId}/decide"
        actor: VerificationOfficer
        preconditions:
          - "decision == DENY"
        side_effects: []

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (auto when a newer claim with the same member_id + obligation_label is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Newer claim's total_relief_cents recomputed from approval_effective_date forward; the superseded claim keeps its historical total_relief_cents"

  - entity: ProductEntitlement
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: GRANDFATHERED
        trigger: "system (auto during member eligibility-loss suspension or offering category gating change)"
        actor: system
        preconditions:
          - "Either the holding member transitioned ACTIVE -> SUSPENDED (documentation loss grandfathers the entire book), or the offering's allowed_categories changed to no longer contain the member's eligibility_category"
        side_effects:
          - "grandfathered := true; exposure continues to count for survivor_continuance"

      - from: [OPEN, GRANDFATHERED]
        to: CLOSED
        trigger: "POST /membership/members/{memberId}/entitlements/{entitlementId}/close (voluntary), POST /membership/members/{memberId}/eligibility-loss with loss_type == FRAUD_CONFIRMED (member loss), or PATCH /membership/product-offerings/{offeringId} retiring the offering (grandfathered retirement)"
        actor: "Member | VerificationOfficer | BenefitsOfficer"
        preconditions:
          - "Voluntary close: actor is the holding Member (ownership) or a BenefitsOfficer"
          - "Member-loss close: only reachable via the REVOKED cascade"
        side_effects:
          - "closure_reason := VOLUNTARY | MEMBER_LOSS | GRANDFATHERED_RETIRE respectively"
          - "Household aggregate recomputed when the member is linked"

  - entity: SurvivorSupportCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: GRANTED
        trigger: "POST /membership/survivor-cases/{caseId}/grant"
        actor: BenefitsOfficer
        preconditions:
          - "Deceased member status == DECEASED (ERR_INVALID_STATE)"
          - "beneficiary_member_id references an ACTIVE member (ERR_BENEFICIARY_NOT_ACTIVE)"
        side_effects:
          - "continuance_months + continuance_amount_cents computed via survivor_continuance (variant by beneficiary claimed_relationship)"
          - "Every GRANDFATHERED ProductEntitlement of the deceased member whose offering permits the beneficiary's category is re-keyed to beneficiary_member_id (ownership transfer); the rest -> CLOSED with closure_reason := MEMBER_LOSS"
          - "transfer cascade: beneficiary Member.household_id := deceased member's household_id (when set); both old and new household aggregates recomputed"

      - from: GRANTED
        to: CLOSED
        trigger: "POST /membership/survivor-cases/{caseId}/close"
        actor: BenefitsOfficer
        preconditions:
          - "resolution_note provided (ERR_INVALID_REQUEST)"
        side_effects: []

  - entity: Household
    initial_state: ACTIVE
    terminal_states: [DISSOLVED]
    transitions:
      - from: ACTIVE
        to: DISSOLVED
        trigger: "POST /membership/households/{householdId}/dissolve"
        actor: VerificationOfficer
        preconditions:
          - "No Member with status IN {ACTIVE, SUSPENDED} is currently linked to the household (ERR_HOUSEHOLD_NOT_EMPTY)"
        side_effects:
          - "aggregate_product_count frozen at its last computed value"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:

  - rule_id: household-link-stale-member
    parent_entity: Member
    write_endpoint: "POST /membership/members/{memberId}/link-household"
    occ_field: "expected_member_version"
    description: |
      Linking a Member into a Household with an expected_member_version that no
      longer matches the member's current version is rejected. This captures the
      case where another writer has legitimately re-linked the member to a
      different household (linking supersedes the prior linkage) or where an
      approval cascade has advanced the member's version, leaving the current
      writer's view of the member stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: deployment-order-stale-member
    parent_entity: Member
    write_endpoint: "POST /membership/members/{memberId}/deployment-orders"
    occ_field: "expected_member_version"
    description: |
      Registering a DeploymentOrder against a Member whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just registered an order (which legitimately
      supersedes the caller's assumption that no deployment exists) or a
      posture cascade has advanced the member version, so the current writer's
      view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: eligibility_category_assignment
    trigger: "EligibilityCase UNDER_REVIEW -> APPROVED transition"
    algorithm: constraint_propagation
    formula: |
      if basis_type == CADET_APPOINTMENT:
          category = OFFICER_CADET
      elif basis_type == DIRECT_SERVICE:
          r = the case's single service record (direct-service cases carry exactly one)
          if r.discharge_characterization in {OTHER_THAN_HONORABLE, BAD_CONDUCT, DISHONORABLE}:
              fail with ERR_ELIGIBILITY_DERIVATION_FAILED
          if r.discharge_characterization == STILL_SERVING or r.service_end_date is null:
              category = ENLISTED_ACTIVE
          else:
              category = VETERAN_HONORABLE
      else:  # FAMILY_DERIVATION
          if claimed_relationship == WIDOW_WIDOWER:      category = FAMILY_WIDOW
          elif claimed_relationship in {CHILD, STEPCHILD}: category = FAMILY_CHILD
          else:                                            category = FAMILY_SPOUSE
          if adoption_or_divorce_flag:
              extended variant applies (see variants)
    input_set: "The deciding EligibilityCase plus, for FAMILY_DERIVATION, the sponsor Member row"
    constants:
      MAX_LINEAGE_DEPTH: 3
    precision: "n/a (category assignment)"
    variants:
      - name: extended_lineage_verification
        when: "basis_type == FAMILY_DERIVATION and adoption_or_divorce_flag == true"
        difference: "Approval additionally requires evidence chain completeness: every EvidenceDocument of the case must satisfy authenticity_channel IN {ISSUER_CONFIRMED, ARCHIVES_CONFIRMED} and at least two distinct doc_type values must be present; failure -> ERR_LINEAGE_PROOF_INSUFFICIENT"

  - name: scra_rate_relief
    trigger: "ProtectionClaim REQUESTED -> APPROVED with claim_type == RATE_REDUCTION"
    algorithm: aggregation
    formula: |
      periods = whole months from approval_effective_date to deployment end_date,
                capped at 60; an open-ended order (end_date null) uses 12
      # per-period relief (integer cents), THEN sum — pinned order:
      capped_rate_bps = min(base_rate_bps, 600)
      per_period_cents = monthly_interest_cents * (base_rate_bps - capped_rate_bps) / base_rate_bps   # floor to integer cents per period
      total_relief_cents = sum over periods of per_period_cents
      # when base_rate_bps <= 600 the per-period relief is 0
    input_set: "The decided ProtectionClaim plus its referenced ACTIVE DeploymentOrder"
    constants:
      SCRA_CAP_BPS: 600
      MAX_RELIEF_PERIODS: 60
      OPEN_ENDED_PERIODS: 12
    precision: "integer cents; per-period floor, then sum (NOT sum-then-round)"
    variants:
      - name: obligation_proration
        when: "deployment end_date is null at approval time"
        difference: "periods_granted fixed at OPEN_ENDED_PERIODS (12) instead of months-to-end; relief computed over 12 periods regardless of later end_date entry"

  - name: survivor_continuance
    trigger: "SurvivorSupportCase OPEN -> GRANTED transition"
    algorithm: waterfall_allocation
    formula: |
      exposure = sum of exposure_cents over the deceased member's ProductEntitlements
                 whose status IN {OPEN, GRANDFATHERED} (CLOSED excluded)
      deductible = 50000 cents
      covered = max(0, exposure - deductible)
      member_share_rate: SPOUSE/WIDOW beneficiary -> 0.20; CHILD/other -> 0.30
      months: 3 for spouse-line beneficiaries, 2 otherwise
      continuance_amount_cents = floor(covered * member_share_rate) * months
      continuance_months = months
      # waterline interpretation: the deductible is absorbed first (bucket 1),
      # only overflow above it flows into the benefit bucket (bucket 2)
    input_set: "Deceased member's entitlements in status {OPEN, GRANDFATHERED} at grant time; beneficiary Member.claimed_relationship"
    constants:
      SURVIVOR_DEDUCTIBLE_CENTS: 50000
      SPOUSE_SHARE_RATE: 0.20
      CHILD_SHARE_RATE: 0.30
      SPOUSE_MONTHS: 3
      CHILD_MONTHS: 2
    precision: "integer cents; floor after rate multiplication, before month multiplication"
    variants:
      - name: lineal_descendant
        when: "beneficiary claimed_relationship IN {CHILD, STEPCHILD}"
        difference: "member_share_rate 0.30 with 2 months instead of 0.20 with 3 months — identical exposure inputs yield a different amount and a shorter window"

  - name: household_aggregate_recompute
    trigger: "Recomputed on every household link/delink, member approval-link, member category assignment, member status transition, posture transition, product-flag change, and entitlement close"
    algorithm: aggregation
    formula: |
      members = Members with household_id == this household AND status IN {ACTIVE, SUSPENDED}
      aggregate_product_count = sum over members of that member's available_facet_count
                                (output of product_availability_matrix; each contributing
                                member's matrix is recomputed BEFORE the sum is taken —
                                authoritative order pinned: member matrices first, then sum)
    input_set: "Members linked to the household with status IN {ACTIVE, SUSPENDED} (DECEASED and REVOKED members are excluded from the sum)"
    constants: {}
    precision: "exact integer"
    variants: []

  - name: product_availability_matrix
    trigger: "Member category assignment (approval), every Member status transition, every deployment_posture transition, and every ProductOffering flag/category change"
    algorithm: threshold
    formula: |
      groups = {BANKING, INSURANCE, INVESTMENT, DEPLOYMENT}, 6 facets each (24 total)
      for each ProductOffering o with is_active_flag == true:
          base = o.allowed_categories CONTAINS member.eligibility_category
          if member.status != ACTIVE and o.requires_active_status: base = false
          if base: all 6 facets of group o.product_line -> AVAILABLE
      DEPLOYMENT group: all 6 facets AVAILABLE iff there EXISTS an offering o with
          is_active_flag == true, base == true, o.deployment_enhanced == true,
          and member.deployment_posture == DEPLOYED
      available_facet_count = 6 * (number of groups whose facets are AVAILABLE),
                              always one of {0, 6, 12, 18, 24}
      matrix = per-facet-group availability flags plus per-offering base detail
    input_set: "All ProductOfferings with is_active_flag == true; the member's eligibility_category, status, deployment_posture"
    constants:
      FACET_GROUPS: 4
      FACETS_PER_GROUP: 6
    precision: "n/a (boolean matrix; available_facet_count is an exact integer)"
    variants:
      - name: suspended_member_matrix
        when: "member.status == SUSPENDED"
        difference: "requires_active_status offerings flip to UNAVAILABLE even when the category is allowed; DEPLOYMENT facet group always all-UNAVAILABLE"

  - name: protection_relief_cap
    trigger: "ProtectionClaim decide with decision == APPROVE (validation-time fiscal check)"
    algorithm: constraint_propagation
    formula: |
      # circular-looking dependency, evaluation order pinned 1..4:
      # 1. gross_relief = total_relief_cents proposed for the new claim
      # 2. bank_offset = sum of total_relief_cents over the member's OTHER claims
      #    in status APPROVED (SUPERSEDED and DENIED excluded)
      # 3. net_relief = max(0, gross_relief - min(bank_offset, gross_relief - 1)
      #    when the product offering mandates offset netting; else gross_relief)
      # 4. cap check: net_relief + sum over the member's APPROVED claims of
      #    total_relief_cents <= member_exposure_cap (= sum of exposure_cents
      #    over the member's OPEN/GRANDFATHERED entitlements); violation ->
      #    ERR_RELIEF_CAP_EXCEEDED. When the member holds no OPEN/GRANDFATHERED
      #    entitlements the cap does not apply (relief is a statutory
      #    protection, not a product benefit).
    input_set: "The member's ProtectionClaims in status APPROVED, the proposed claim, the member's OPEN/GRANDFATHERED ProductEntitlements"
    constants:
      NETTING_ENABLED: true
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 2
    category: auth
    check: "Ownership: for the entity_backed Member role, X-User-ID must equal the memberId path parameter on every /membership/members/{memberId}/... route"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all /membership/members/{memberId}/... endpoints when X-User-Role == Member"

  - priority: 3
    category: existence
    check: "Every id in the path resolves to an existing row (left-to-right); unknown id -> domain not-found"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Request body well-formed; every required input field present; enum fields carry a declared value"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: state
    check: "Target resource is in a state that lists this trigger in §1.2 (state precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (submit, decide, eligibility-loss, reinstate, deceased, link/delink-household, complete, cancel, grant, close, dissolve)"

  - priority: 6
    category: business_safety
    check: "Duplicate content: an EvidenceDocument with the same (case_id, content_hash) already exists"
    error_id: ERR_DUPLICATE_EVIDENCE
    http_status: 409
    applies_to: "POST /membership/eligibility-cases/{caseId}/evidence"

  - priority: 7
    category: business_safety
    check: "Duplicate order: a DeploymentOrder with the same orders_number already exists"
    error_id: ERR_DUPLICATE_ORDER
    http_status: 409
    applies_to: "POST /membership/members/{memberId}/deployment-orders"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: case decide — officer X-User-ID must differ from record_reconstruction_officer_id when the case passed RECORD_RECONSTRUCTION; claim decide — officer must differ from claim.member_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /membership/eligibility-cases/{caseId}/decide, POST /membership/protection-claims/{claimId}/decide"

  - priority: 9
    category: business_temporal
    check: "AddressAssignment interval validity: effective_to strictly greater than effective_from when set; address overlap — per member, intervals of the same addr_type must not overlap (half-open [from, to); touching intervals legal)"
    error_id: ERR_ADDRESS_OVERLAP
    http_status: 409
    applies_to: "POST /membership/members/{memberId}/addresses, PATCH /membership/addresses/{addressId}"

  - priority: 10
    category: business_temporal
    check: "DeploymentOrder interval validity: end_date >= start_date; per member, non-cancelled orders' [start_date, end_date] (inclusive) intervals must not overlap — adjacent days (end == other.start) conflict"
    error_id: ERR_DEPLOYMENT_OVERLAP
    http_status: 409
    applies_to: "POST /membership/members/{memberId}/deployment-orders, PATCH /membership/deployment-orders/{orderId}"

  - priority: 11
    category: business_referential
    check: "Every FK field in the request (sponsor_member_id, covers_service_record_id, deployment_order_id, product_offering_id, beneficiary_member_id) resolves to an existing row of the right type"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "endpoints taking FK fields"

  - priority: 12
    category: business_constraint
    check: "Lineage depth: sponsor.lineage_depth + 1 <= MAX_LINEAGE_DEPTH (3) on submit of a FAMILY_DERIVATION case"
    error_id: ERR_LINEAGE_DEPTH_EXCEEDED
    http_status: 422
    applies_to: "POST /membership/eligibility-cases/{caseId}/submit"

  - priority: 13
    category: business_constraint
    check: "Lineage proof (extended variant): adoption_or_divorce_flag cases need >= 2 distinct doc_type values and all documents at authenticity_channel >= ISSUER_CONFIRMED"
    error_id: ERR_LINEAGE_PROOF_INSUFFICIENT
    http_status: 422
    applies_to: "POST /membership/eligibility-cases/{caseId}/decide (decision == APPROVE)"

  - priority: 14
    category: business_constraint
    check: "Eligibility derivation rule for the claimed basis satisfied (discharge characterization acceptable, sponsor ACTIVE, category derivable)"
    error_id: ERR_ELIGIBILITY_DERIVATION_FAILED
    http_status: 422
    applies_to: "POST /membership/eligibility-cases/{caseId}/decide (decision == APPROVE)"

  - priority: 15
    category: business_constraint
    check: "Product category gate: entitlement open only when the offering's allowed_categories contains the member's current eligibility_category and the offering is_active_flag is true"
    error_id: ERR_PRODUCT_CATEGORY_FORBIDDEN
    http_status: 422
    applies_to: "POST /membership/members/{memberId}/entitlements"

  - priority: 16
    category: business_constraint
    check: "Household dissolve requires zero linked members with status IN {ACTIVE, SUSPENDED}"
    error_id: ERR_HOUSEHOLD_NOT_EMPTY
    http_status: 422
    applies_to: "POST /membership/households/{householdId}/dissolve"

  - priority: 17
    category: business_constraint
    check: "SCRA eligibility: RATE_REDUCTION claims require a referenced ACTIVE DeploymentOrder with scra_eligible == true and periods_granted > 0"
    error_id: ERR_SCRA_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /membership/protection-claims/{claimId}/decide (decision == APPROVE)"

  - priority: 18
    category: business_fiscal
    check: "Relief cap: protection_relief_cap net relief plus existing APPROVED relief must not exceed member exposure cap"
    error_id: ERR_RELIEF_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /membership/protection-claims/{claimId}/decide (decision == APPROVE)"

  - priority: 19
    category: state
    check: "Stale-version OCC: expected_member_version must equal the member's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /membership/members/{memberId}/link-household, POST /membership/members/{memberId}/deployment-orders"

  - priority: 20
    category: business_referential
    check: "Sponsor activeness: FAMILY_DERIVATION submit/decide requires sponsor.status == ACTIVE"
    error_id: ERR_SPONSOR_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /membership/eligibility-cases/{caseId}/submit, POST /membership/eligibility-cases/{caseId}/decide"

  - priority: 21
    category: business_referential
    check: "Beneficiary activeness: survivor grant requires beneficiary.status == ACTIVE"
    error_id: ERR_BENEFICIARY_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /membership/survivor-cases/{caseId}/grant"

  - priority: 22
    category: business_constraint
    check: "Service record presence: DIRECT_SERVICE/CADET submit requires >= 1 ServiceRecord; any submit requires >= 1 EvidenceDocument"
    error_id: ERR_SERVICE_RECORD_REQUIRED
    http_status: 422
    applies_to: "POST /membership/eligibility-cases/{caseId}/submit"

  - priority: 23
    category: business_constraint
    check: "Evidence presence at submit"
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /membership/eligibility-cases/{caseId}/submit"

  - priority: 24
    category: business_constraint
    check: "Resubmit requires new evidence since entering MORE_INFO_REQUIRED"
    error_id: ERR_NO_NEW_EVIDENCE
    http_status: 422
    applies_to: "POST /membership/eligibility-cases/{caseId}/submit (from MORE_INFO_REQUIRED)"

  - priority: 25
    category: business_constraint
    check: "All case ServiceRecords verified before approval"
    error_id: ERR_SERVICE_RECORD_UNVERIFIED
    http_status: 422
    applies_to: "POST /membership/eligibility-cases/{caseId}/decide (decision == APPROVE)"

  - priority: 26
    category: business_temporal
    check: "Deployment completion requires end_date set and <= logical clock date"
    error_id: ERR_DEPLOYMENT_NOT_ENDED
    http_status: 422
    applies_to: "POST /membership/deployment-orders/{orderId}/complete"

  - priority: 27
    category: business_temporal
    check: "Deployment completion requires an end_date on the order"
    error_id: ERR_DEPLOYMENT_END_DATE_REQUIRED
    http_status: 422
    applies_to: "POST /membership/deployment-orders/{orderId}/complete"

  - priority: 28
    category: business_fiscal
    check: "Rate reduction must yield positive relief (base_rate_bps > SCRA_CAP_BPS with at least one period)"
    error_id: ERR_NO_RELIEF_AVAILABLE
    http_status: 422
    applies_to: "POST /membership/protection-claims/{claimId}/decide (decision == APPROVE, RATE_REDUCTION)"

  - priority: 29
    category: business_referential
    check: "Reinstatement requires restoration evidence uploaded after the loss event"
    error_id: ERR_REINSTATEMENT_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /membership/members/{memberId}/reinstate"

  - priority: 30
    category: business_constraint
    check: "Duty-station change: a new is_duty_station address whose effective_from is earlier than the current open duty-station interval requires closing the previous duty interval in the same request set (retroactive PCS)"
    error_id: ERR_DUTY_STATION_CONFLICT
    http_status: 409
    applies_to: "POST /membership/members/{memberId}/addresses (is_duty_station == true)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Eligibility cases -----------------------------------------------------
  - method: POST
    path: "/membership/eligibility-cases"
    description: "Open an eligibility case (status INTAKE). sponsor_member_id and claimed_relationship required iff basis_type == FAMILY_DERIVATION."
    roles: [EligibilityApplicant]
    code: 201
    input: [applicant_legal_name, applicant_dob, basis_type, "sponsor_member_id?", "claimed_relationship?", "adoption_or_divorce_flag?"]
    output: EligibilityCase
    side_effects: [case persisted in INTAKE]

  - method: GET
    path: "/membership/eligibility-cases"
    description: "List eligibility cases (paginated; filterable by status, basis_type, sponsor_member_id)."
    roles: [EligibilityApplicant, VerificationOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "basis_type?", "sponsor_member_id?", "member_id?", "limit?", "offset?"]
    output: EligibilityCase[]
    side_effects: []

  - method: GET
    path: "/membership/eligibility-cases/{caseId}"
    description: "Fetch one eligibility case."
    roles: [EligibilityApplicant, VerificationOfficer, PlatformAdmin]
    code: 200
    input: []
    output: EligibilityCase
    side_effects: []

  - method: POST
    path: "/membership/eligibility-cases/{caseId}/service-records"
    description: "Attach a service record to an INTAKE or MORE_INFO_REQUIRED case."
    roles: [EligibilityApplicant]
    code: 201
    input: [branch, component, rank_grade, service_start_date, "service_end_date?", discharge_characterization]
    output: ServiceRecord
    side_effects: [service_days computed]

  - method: GET
    path: "/membership/eligibility-cases/{caseId}/service-records"
    description: "List the case's service records."
    roles: [EligibilityApplicant, VerificationOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ServiceRecord[]
    side_effects: []

  - method: POST
    path: "/membership/eligibility-cases/{caseId}/evidence"
    description: "Upload evidence to a case in INTAKE, MORE_INFO_REQUIRED, or APPROVED (post-approval uploads support reinstatement evidence and audit trails). Uploads to a DENIED case are rejected ERR_INVALID_STATE."
    roles: [EligibilityApplicant]
    code: 201
    input: [doc_type, issuing_authority, issued_on, "covers_service_record_id?", content_hash]
    output: EvidenceDocument
    side_effects: [ERR_DUPLICATE_EVIDENCE on (case_id, content_hash) collision]

  - method: GET
    path: "/membership/eligibility-cases/{caseId}/evidence"
    description: "List the case's evidence documents."
    roles: [EligibilityApplicant, VerificationOfficer, PlatformAdmin]
    code: 200
    input: []
    output: EvidenceDocument[]
    side_effects: []

  - method: POST
    path: "/membership/eligibility-cases/{caseId}/submit"
    description: "Submit for verification: INTAKE -> UNDER_REVIEW, or MORE_INFO_REQUIRED -> UNDER_REVIEW (resubmit loop)."
    roles: [EligibilityApplicant]
    code: 200
    input: []
    output: EligibilityCase
    side_effects: [state transition per §1.2]

  - method: POST
    path: "/membership/eligibility-cases/{caseId}/decide"
    description: "Officer decision: APPROVE (mints Member), DENY, or REQUEST_MORE_INFO. Enforces segregation of duties against record_reconstruction_officer_id."
    roles: [VerificationOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: EligibilityCase
    side_effects: ["on APPROVE: eligibility_category_assignment, Member mint with member_number, product matrix compute, sponsor household link + aggregate recompute"]

  - method: POST
    path: "/membership/eligibility-cases/{caseId}/record-reconstruction"
    description: "Archives reconstruction decision for a lost-records exception: decision APPROVE sets every case ServiceRecord.service_verified := true and records the acting officer; decision DENY moves the case to DENIED. Case must be UNDER_REVIEW."
    roles: [VerificationOfficer]
    code: 200
    input: [decision, decision_note]
    output: EligibilityCase
    side_effects: ["record_reconstruction_officer_id := actor X-User-ID", "on APPROVE: all case ServiceRecords verified", "on DENY: case -> DENIED"]

  - method: GET
    path: "/membership/service-records"
    description: "Filtered list of service records (case_id filter supported)."
    roles: [VerificationOfficer, PlatformAdmin]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: ServiceRecord[]
    side_effects: []

  - method: GET
    path: "/membership/service-records/{recordId}"
    description: "Fetch one service record."
