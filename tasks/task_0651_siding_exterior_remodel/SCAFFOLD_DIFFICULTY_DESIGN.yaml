  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: compensating_cash_release_then_clawback
        grounds:
          - state_machines.ProgressDraw.APPROVED_to_RELEASED
          - state_machines.ProgressDraw.RELEASED_to_CLAWED_BACK
          - entities.Project.fields.amount_released_cents
          - entities.Project.fields.retainage_held_cents
        distinguishing_aspect: "Conserved quantity CASH: releasing draw#1 then clawing it back leaves Project.amount_released_cents and retainage_held_cents exactly at their pre-release values (0 and 0) — release adds net_released to amount_released and retainage to retainage_held; clawback subtracts the identical amounts."
        test_recipe:
          setup:
            - "Project IN_PROGRESS, contract 1324980, one COMPLETED window, draw#1 30% APPROVED (gross 397494, retainage 39749, net 357745). FinanceOfficer releases then claws back."
