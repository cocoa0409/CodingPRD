            - { call: "POST /search-cases/${sc_sg}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /fiduciary-log-entries", payload: { termination_case_id: "${c_sg}", entry_type: SEARCH_PROTOCOL_SUMMARY, narrative: "Search in progress; locator and public-records steps returned no result; protocol not yet exhausted.", related_entity_id: "${sc_sg}" }, as: PlanAdministrator, as_user_id: "admin-1" }
