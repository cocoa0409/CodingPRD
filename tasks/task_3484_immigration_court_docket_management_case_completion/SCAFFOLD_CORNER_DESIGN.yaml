            - call: "POST /eoir/cases"
              payload: { court_id: "${court_n}", case_number: "G-1", respondent_full_name: "R Calm", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_n: $.data.id, case_n_v1: $.data.version }
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-GC", name: "Critical Court", city: "Laredo", annual_completion_goal: 4, detained_daily_hearing_capacity: 1 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_c: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_c}", case_number: "G-2", respondent_full_name: "R Det", custody_status: "DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_c: $.data.id, case_c_v1: $.data.version }
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-GD", name: "Dest Court", city: "Duluth", annual_completion_goal: 100, detained_daily_hearing_capacity: 1 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_d: $.data.id }
          trigger:
            - call: "POST /eoir/case-reassignments"
              payload: { case_id: "${case_n}", expected_case_version: "${case_n_v1}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err1: $.data.error_id }
            - call: "POST /eoir/case-reassignments"
              payload: { case_id: "${case_c}", expected_case_version: "${case_c_v1}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err2: $.data.error_id }
          assert:
            - "reassigning from calm court N fails 409 ERR_COURT_NOT_BACKLOG_CRITICAL (1 < ceil(0.25*100)=25)"
            - "reassigning the DETAINED case from critical court C fails 409 ERR_DETAINED_NOT_REASSIGNABLE (the custody gate is evaluated on its own)"
            - "both cases remain in their original courts with status FILED"

      - name: hearing_creation_case_guards
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CASE_STATE_FORBIDS_HEARING
          - errors.ERR_CASE_HAS_SCHEDULED_HEARING
        distinguishing_aspect: "Two case-side guards on hearing creation: the case must be docketed (CALENDAR/MERITS) — a FILED case rejects — and a case may hold at most one SCHEDULED hearing at a time."
        test_recipe:
