        payload:
          name: RB3 Fac
          total_spaces: 200
          monthly_capacity: 50
          event_pool_spaces: 40
        as: FacilityManager
        captures:
          fac: $.data.id
      - call: POST /ops/access-devices
        payload:
          facility_id: ${fac}
          device_label: E1
          device_kind: ENTRY_GATE
        as: FacilityManager
        captures:
          dev: $.data.id
      trigger:
      - call: POST /ops/rate-schedules
        payload:
          facility_id: ${fac}
