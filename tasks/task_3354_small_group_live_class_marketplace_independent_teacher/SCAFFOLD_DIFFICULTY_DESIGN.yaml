        grounds:
          - validations[priority=22]
          - errors[ERR_PAYOUT_PERIOD_OVERLAP]
          - entities.TeacherPayout.fields.period_start
          - entities.TeacherPayout.fields.period_end
        distinguishing_aspect: |
          The occupation is a half-open time interval [period_start, period_end) on the Teacher
          resource: a period starting exactly at the previous period's end is ADJACENT and is
          admitted, while a period starting one day inside it COLLIDES and is rejected, so the
          adjacency semantics are half-open rather than closed.
