      - name: corner_rbac_segregation_of_duties_binds_adjudicate_and_the_restatement_decision
        claim_type: Segregation of duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints[POST /ir/edit-checks/{edit_check_id}/adjudicate]
          - endpoints[POST /ir/restatements/{restatement_id}/approve]
          - complexity_profile.role_model
        distinguishing_aspect: |
          ERR_SEGREGATION_OF_DUTIES has three distinct anchors, and two of them are not the certify
          anchor covered in §1.8: adjudicate compares X-User-ID against the edit check's
          explained_by_user_id, and restatement approve/reject compares it against the request's
          requested_by_user_id. Because the acting role is IRDirector on all three, the role check
          passes and only the identity comparison can refuse the call — a naive implementation that
          only wires the certify anchor lets user "u-shared" both explain and adjudicate its own
          variance explanation, and both file and approve its own restatement.
        test_recipe:
          setup:
            - "A CENSUS_LOCKED IPEDS-2027 cycle whose ENROLLMENT component reports TOTAL_HEADCOUNT 1125 against a prior year of 1000, giving a 12.5% WARNING edit check; prepare was run by analyst-1 and the check was explained by u-shared."
          setup_api_calls:
