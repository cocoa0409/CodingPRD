  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: equipment_pool_unit_conservation
        grounds:
          - entities.EquipmentPool.fields.available_qty
          - state_machines.EquipmentCheckout.OUT_to_RETURNED
          - state_machines.EquipmentCheckout.OUT_to_LOST
        distinguishing_aspect: |
          Conserved quantity = equipment UNITS: available_qty + sum(OUT quantity) == total_qty must hold after every
          forward/compensating pair. Checkout(3)+return(3) restores available to 5 exactly (fine affects the member
          ledger, not units); checkout(2)+report-lost decrements total_qty to 3 and the invariant re-binds at 3+0 == 3.
        test_recipe:
          setup:
            - "Eligible member M; pool BASKETBALL total 5 (daily 150, replacement 900); clock 2026-09-01T09:00:00Z"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/members", payload: { email: "mm@x.edu", full_name: "Mem M", affiliation: "STUDENT" }, as: RecAdmin, captures: { mM_id: "$.data.id", mM_v: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${mM_id}", captures: { mM_v2: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${mM_v2}" }, as: Member, as_user_id: "${mM_id}" }
            - { call: "POST /v1/equipment-pools", payload: { item_type: "BASKETBALL", total_qty: 5, daily_late_fee_cents: 150, unit_replacement_cents: 900 }, as: RecAdmin, captures: { p_id: "$.data.id", p_avail0: "$.data.available_qty" } }
          trigger:
            - { call: "POST /v1/equipment-checkouts", payload: { equipment_pool_id: "${p_id}", member_id: "${mM_id}", quantity: 3, due_at: "2026-09-10T17:00:00Z" }, as: Member, as_user_id: "${mM_id}", captures: { co1_id: "$.data.id" } }
            - { call: "GET /v1/equipment-pools/${p_id}", payload: {}, as: FacilityManager, captures: { p_avail1: "$.data.available_qty" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T09:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/equipment-checkouts/${co1_id}/return", payload: {}, as: FacilityManager, captures: { co1_fee: "$.data.late_fee_cents" } }
            - { call: "GET /v1/equipment-pools/${p_id}", payload: {}, as: FacilityManager, captures: { p_avail2: "$.data.available_qty" } }
            - { call: "POST /v1/equipment-checkouts", payload: { equipment_pool_id: "${p_id}", member_id: "${mM_id}", quantity: 2, due_at: "2026-09-05T17:00:00Z" }, as: Member, as_user_id: "${mM_id}", captures: { co2_id: "$.data.id" } }
            - { call: "POST /v1/equipment-checkouts/${co2_id}/report-lost", payload: {}, as: FacilityManager }
            - { call: "GET /v1/equipment-pools/${p_id}", payload: {}, as: FacilityManager, captures: { p_avail3: "$.data.available_qty", p_total3: "$.data.total_qty" } }
            - { call: "GET /v1/members/${mM_id}", payload: {}, as: FacilityManager, captures: { mM_fines: "$.data.outstanding_fines_cents" } }
          assert:
            - "after checkout(3): available_qty == 2 and 2 + 3 (OUT) == 5 == total_qty"
            - "after on-time return: available_qty == 5, late_fee_cents == 0, invariant 5 + 0 == 5 (compensating action restores the exact initial state)"
            - "after checkout(2)+report-lost: total_qty == 3, available_qty == 3, invariant re-binds 3 + 0 == 3"
            - "Member.outstanding_fines_cents == 1800 (2 * 900 replacement) — money moved, units conserved; the two ledgers never mix"
      - name: class_seat_conservation_through_promotion
        grounds:
          - entities.FitnessClass.fields.registered_count
          - calculations.waitlist_promotion
          - state_machines.ClassRegistration.WAITLISTED_to_REGISTERED
        distinguishing_aspect: |
          Conserved quantity = occupied SEATS (different from equipment units): a REGISTERED cancel paired with its
          compensating waitlist promotion leaves FitnessClass.registered_count == 2 unchanged end-to-end, while the
          waitlist drains 1 -> 0. A WAITLISTED cancel (no promotion) is also covered as the asymmetric branch.
        test_recipe:
          setup:
            - "YOGA class 2026-09-08 18:00-19:00 capacity 2; members A, B REGISTERED; member C WAITLISTED; clock 2026-09-01T09:00:00Z"
          setup_api_calls:
