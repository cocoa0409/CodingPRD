            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "MA", full_name: "Mgr A", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgrA: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "MB", full_name: "Mgr B", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgrB: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgrA}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 100, reason_code: DELIVERY, message: "g", idempotency_key: "val-scope-1" }, as: Manager, as_user_id: "${mgrA}", captures: { nom: $.data.id, nom_v: $.data.version } }
          trigger:
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: Manager, as_user_id: "${mgrB}", captures: { err: $.data.error_id } }
