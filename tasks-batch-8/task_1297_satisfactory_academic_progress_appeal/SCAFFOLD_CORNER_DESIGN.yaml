# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_1297_satisfactory_academic_progress_appeal
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: program_create_applies_policy_defaults
        claim_type: defaults
        grounds: ['entities.Program.fields.min_gpa', 'entities.Program.fields.min_pace_pct', 'entities.Program.fields.appeal_window_days', 'entities.Program.fields.reminder_offset_days']
        distinguishing_aspect: "Omitting optional policy fields applies defaults: min_gpa 2.0, min_pace_pct 67.0, appeal_window_days 14, reminder_offset_days [7, 13]."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-DEF", name: "Defaults", required_credits: 120 }, as: Registrar, captures: { p_gpa: $.data.min_gpa, p_pace: $.data.min_pace_pct, p_win: $.data.appeal_window_days, p_rem: $.data.reminder_offset_days } }
          trigger: []
          assert:
            - "created Program.min_gpa == 2.0 and min_pace_pct == 67.0"
            - "created Program.appeal_window_days == 14 and reminder_offset_days == [7, 13]"

      - name: program_duplicate_code_returns_conflict
        claim_type: type_constraints
        grounds: ['validations[priority=19]', 'errors[ERR_PROGRAM_CODE_CONFLICT]']
        distinguishing_aspect: "Second program with the same code is rejected; first program unaffected."
        test_recipe:
          setup: ["Program BS-DUP exists"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-DUP", name: "First", required_credits: 120 }, as: Registrar }
          trigger:
            - { call: "POST /sap/programs", payload: { code: "BS-DUP", name: "Second", required_credits: 90 }, as: Registrar, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_PROGRAM_CODE_CONFLICT (409)"]

      - name: student_create_initial_state
        claim_type: creation
        grounds: ['entities.Student.fields.sap_status', 'state_machines.Student']
        distinguishing_aspect: "New student starts GOOD_STANDING with zeroed cumulatives, null GPA/pace, max_tf_exceeded false, version 1."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-INIT", name: "Init", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-0001", full_name: "Init Student", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id, s_status: $.data.sap_status, s_att: $.data.cumulative_attempted_credits, s_earn: $.data.cumulative_earned_credits, s_gpa: $.data.cumulative_gpa, s_pace: $.data.pace_pct, s_v: $.data.version } }
          trigger: []
          assert:
            - "sap_status == GOOD_STANDING; cumulative_attempted_credits == 0; cumulative_earned_credits == 0"
            - "cumulative_gpa is null and pace_pct is null (no posted enrollments)"
            - "version == 1 and id is a server-minted UUID without type prefix"

      - name: student_duplicate_number_returns_conflict
        claim_type: type_constraints
        grounds: ['validations[priority=20]', 'errors[ERR_STUDENT_NUMBER_CONFLICT]']
        distinguishing_aspect: "Duplicate student_number rejected even across different programs."
        test_recipe:
          setup: ["Two programs; student S-0002 exists in program 1"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-A", name: "A", required_credits: 120 }, as: Registrar, captures: { prog_a: $.data.id } }
            - { call: "POST /sap/programs", payload: { code: "BS-B", name: "B", required_credits: 90 }, as: Registrar, captures: { prog_b: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-0002", full_name: "First", program_id: "${prog_a}" }, as: Registrar }
          trigger:
            - { call: "POST /sap/students", payload: { student_number: "S-0002", full_name: "Second", program_id: "${prog_b}" }, as: Registrar, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_STUDENT_NUMBER_CONFLICT (409)"]

      - name: student_create_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: ['entities.Student.fields.sap_status', 'entities.Student.fields.cumulative_earned_credits']
        distinguishing_aspect: "Client-supplied values for system/computed fields (sap_status, cumulative_earned_credits) are ignored; server-computed values returned."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-IGN", name: "Ignore", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /sap/students", payload: { student_number: "S-0003", full_name: "Sneaky", program_id: "${prog}", sap_status: "SUSPENSION", cumulative_earned_credits: 999 }, as: Registrar, captures: { s_status: $.data.sap_status, s_earn: $.data.cumulative_earned_credits } }
          assert:
            - "response sap_status == GOOD_STANDING and cumulative_earned_credits == 0 (client values ignored)"

      - name: term_create_end_before_start_returns_invalid_request
        claim_type: type_constraints
        grounds: ['validations[priority=22]', 'entities.Term.fields.end_date']
        distinguishing_aspect: "end_date < start_date is a 400 shape error, distinct from the 409 overlap conflict."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sap/terms", payload: { code: "TBAD", seq: 1, start_date: "2026-05-08", end_date: "2026-01-12" }, as: Registrar, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST (400)"]

      - name: enrollment_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ['validations[priority=3]', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /sap/term-enrollments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: AidOfficer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_NOT_FOUND (404)"]

      - name: students_list_pagination_and_envelope
        claim_type: listing
        grounds: ['response_envelope', 'endpoints["GET /sap/students"]']
        distinguishing_aspect: "limit/offset/has_more/total_count interact correctly; envelope carries meta.api_request_id and response_type array."
        test_recipe:
          setup: ["Program with 3 students"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-PAG", name: "Paging", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-P01", full_name: "P One", program_id: "${prog}" }, as: Registrar }
            - { call: "POST /sap/students", payload: { student_number: "S-P02", full_name: "P Two", program_id: "${prog}" }, as: Registrar }
            - { call: "POST /sap/students", payload: { student_number: "S-P03", full_name: "P Three", program_id: "${prog}" }, as: Registrar }
          trigger:
            - { call: "GET /sap/students?limit=2&offset=0", as: AidOfficer }
            - { call: "GET /sap/students?limit=2&offset=2", as: AidOfficer }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true, response_type == 'array', meta.api_request_id present"
            - "page 2: 1 item, total_count == 3, has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: enrollment_post_from_posted_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.TermEnrollment.IN_PROGRESS_to_POSTED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "POSTED is not a valid from-state for post; second post rejected, no cumulative drift."
        test_recipe:
          setup: ["Program, T1, student, enrollment attempted 12 POSTED earned 12 QP 48.0 gh 12"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-PP", name: "PostPost", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-1001", full_name: "Post Twice", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 12 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 12, quality_points: 48.0, gpa_hours: 12 }, as: Registrar }
          trigger:
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 0, quality_points: 0.0, gpa_hours: 12 }, as: Registrar, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "GET /sap/students/${stu}.cumulative_earned_credits == 12 (second post had no effect)"

      - name: enrollment_amend_in_progress_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.TermEnrollment.POSTED_to_AMENDED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "IN_PROGRESS enrollment cannot be amended (amend requires POSTED|AMENDED)."
        test_recipe:
          setup: ["Program, T1, student, enrollment IN_PROGRESS"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-AI", name: "AmendInProg", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-1002", full_name: "Amend Early", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 12 }, as: Registrar, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /sap/term-enrollments/${e1}/amend", payload: { earned_credits: 12, quality_points: 48.0, gpa_hours: 12, amendment_reason: "too early" }, as: Registrar, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE (409); enrollment stays IN_PROGRESS"]

      - name: enrollment_amend_self_loop_allowed
        claim_type: valid_transition
        grounds: ['state_machines.TermEnrollment.AMENDED_to_AMENDED']
        distinguishing_aspect: "AMENDED -> AMENDED is a legal self-loop (cyclic machine); amendment_count increments each time."
        test_recipe:
          setup: ["Program, T1, student, enrollment POSTED earned 3 QP 9.0 gh 6"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-AS", name: "AmendSelf", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-1003", full_name: "Self Loop", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 9.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/term-enrollments/${e1}/amend", payload: { earned_credits: 6, quality_points: 24.0, gpa_hours: 6, amendment_reason: "first correction" }, as: Registrar }
          trigger:
            - { call: "POST /sap/term-enrollments/${e1}/amend", payload: { earned_credits: 6, quality_points: 18.0, gpa_hours: 6, amendment_reason: "second correction" }, as: Registrar, captures: { st: $.data.status, cnt: $.data.amendment_count } }
          assert:
            - "second amend succeeds: status == AMENDED and amendment_count == 2"
            - "GET /sap/students/${stu}.cumulative_quality_points == 18.0 (latest values win)"

      - name: appeal_decide_before_review_rejected
        claim_type: precondition_enforcement
        grounds: ['validations[priority=11]', 'errors[ERR_DECISION_REQUIRES_REVIEW]']
        distinguishing_aspect: "decide on a SUBMITTED appeal yields ERR_DECISION_REQUIRES_REVIEW, not generic ERR_INVALID_STATE."
        test_recipe:
          setup: ["Student suspended at T2 (T1 3/6 QP 6.0 gh 6, T2 3/6 QP 6.0 gh 6); appeal submitted (SUBMITTED, not screened)"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-DB", name: "DecideBefore", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-1004", full_name: "Skip Step", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "MEDICAL", statement: "s", documents: [{ doc_type: "NOTE", description: "n" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { ap: $.data.id } }
          trigger:
            - { call: "POST /sap/appeals/${ap}/decide", payload: { decision: "APPROVED", resolution: "PROBATION_ONLY", rationale: "too hasty" }, as: CommitteeMember, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DECISION_REQUIRES_REVIEW (409); appeal stays SUBMITTED; student stays SUSPENSION"

      - name: appeal_resubmit_from_under_review_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.Appeal.MORE_INFO_REQUESTED_to_SUBMITTED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "resubmit is only legal from MORE_INFO_REQUESTED; from UNDER_REVIEW it is ERR_INVALID_STATE."
        test_recipe:
          setup: ["Suspended student with appeal UNDER_REVIEW (same 2-term suspension world, appeal screened)"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-RR", name: "ResubmitReject", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-1005", full_name: "Resubmit Wrong", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "OTHER", statement: "s", documents: [{ doc_type: "NOTE", description: "n" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { ap: $.data.id } }
            - { call: "POST /sap/appeals/${ap}/screen", as: AidOfficer }
          trigger:
            - { call: "POST /sap/appeals/${ap}/resubmit", payload: { documents: [{ doc_type: "EXTRA", description: "x" }] }, as: Student, as_user_id: "${stu}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_STATE (409); appeal stays UNDER_REVIEW"]

      - name: appeal_screen_after_denied_rejected
        claim_type: terminal_state_lockdown
        grounds: ['state_machines.Appeal', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "DENIED is terminal: screen (and any other transition) on a denied appeal is rejected."
        test_recipe:
          setup: ["Suspended student; appeal screened then decided DENIED"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-DL", name: "DeniedLock", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-1006", full_name: "Denny Locked", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "OTHER", statement: "s", documents: [{ doc_type: "NOTE", description: "n" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { ap: $.data.id } }
            - { call: "POST /sap/appeals/${ap}/screen", as: AidOfficer }
            - { call: "POST /sap/appeals/${ap}/decide", payload: { decision: "DENIED", rationale: "Insufficient documentation" }, as: CommitteeMember }
          trigger:
            - { call: "POST /sap/appeals/${ap}/screen", as: AidOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /sap/appeals/${ap}/decide", payload: { decision: "APPROVED", resolution: "PROBATION_ONLY", rationale: "reconsider" }, as: CommitteeMember, captures: { err2: $.data.error_id } }
          assert:
            - "screen on DENIED appeal: ERR_INVALID_STATE; decide on DENIED appeal: ERR_INVALID_STATE"
            - "appeal remains DENIED; student remains SUSPENSION (denial does not change standing)"

      - name: term_evaluate_twice_rejected
        claim_type: invalid_transition
        grounds: ['state_machines.Term.GRADING_CLOSED_to_EVALUATED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "EVALUATED is terminal for a term: a second evaluate run is rejected; evaluation rows are not duplicated."
        test_recipe:
          setup: ["Program, T1, student with posted enrollment; T1 evaluated once"]
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-TE", name: "TwiceEval", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-1007", full_name: "Eval Twice", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 12 }, as: Registrar, captures: { e1: $.data.id } }
