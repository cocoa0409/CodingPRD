  - rule_id: resource_temporal_overlap
    instances:

      - name: methodology_windows_are_half_open_and_family_scoped
        grounds:
          - validations.priority_29_ERR_METHODOLOGY_WINDOW_OVERLAP
          - entities.MethodologyVersion.fields.effective_from
          - entities.MethodologyVersion.fields.effective_to
          - errors.ERR_METHODOLOGY_WINDOW_OVERLAP
        distinguishing_aspect: |
          Resource entity: MethodologyVersion. Interval semantics: HALF-OPEN
          [effective_from, effective_to) with no buffer, scoped per
          standard_family. A version starting exactly where the incumbent ends
          (2026-06-01T00:00:00Z) must be accepted - the closed-interval reading
          would reject it - while a version starting one second before that
          instant (2026-05-31T23:59:59Z) must be rejected. A third version whose
          window sits squarely inside the incumbent's but belongs to the
          SUITABILITY family is accepted, so the overlap test must be
          family-partitioned rather than global.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "Incumbent VIEWABILITY version VIEW-2026.1 with window [2026-01-01T00:00:00Z, 2026-06-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_v1_id: $.data.id }
          trigger:
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.2", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.6, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_v2_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.3", effective_from: "2026-05-31T23:59:59Z", effective_to: "2026-07-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.6, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-04-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
          assert:
            - "The first trigger call returns 201: an abutting window (previous effective_to == new effective_from) does not overlap under half-open semantics"
            - "The second trigger call returns 409 ERR_METHODOLOGY_WINDOW_OVERLAP: 2026-05-31T23:59:59Z falls inside [2026-01-01, 2026-06-01)"
            - "The third trigger call returns 201: the same calendar span is free for a different standard_family"
            - "GET /methodology-versions?standard_family=VIEWABILITY lists exactly 2 versions (${mv_v1_id} and ${mv_v2_id}) and all three created versions are in accreditation_status PROVISIONAL"

      - name: batch_windows_are_closed_with_a_sixty_second_buffer_per_page_and_format
        grounds:
          - validations.priority_30_ERR_BATCH_WINDOW_COLLISION
          - entities.MeasurementBatch.fields.window_start
          - entities.MeasurementBatch.fields.window_end
          - errors.ERR_BATCH_WINDOW_COLLISION
        distinguishing_aspect: |
          A different resource entity (MeasurementBatch) with deliberately
          different interval semantics: CLOSED [window_start, window_end] plus a
          BATCH_WINDOW_BUFFER_SECONDS 60 dead zone, keyed on (campaign_id,
          page_id, format) rather than on a family. A start 45 seconds after the
          incumbent's window_end collides even though the closed intervals do
          not intersect; 61 seconds after it does not; and the same colliding
          window on a DIFFERENT page of the same campaign is accepted. Half-open
          semantics, a missing buffer, or a campaign-wide key each break exactly
          one of those three outcomes.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z so all windows are in the past."
            - "Campaign format DISPLAY; two pages under the same publisher."
            - "Incumbent batch on page 1 with the closed window [2026-07-01T00:00:00Z, 2026-07-01T01:00:00Z]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/page-one" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page1_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/page-two" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page2_id: $.data.id }
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page1_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-01T01:00:00Z", measured_impressions: 4000, measurable_impressions: 3000, in_view_impressions: 2500, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_base_id: $.data.id }
          trigger:
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page1_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-07-01T01:00:45Z", window_end: "2026-07-01T02:00:00Z", measured_impressions: 4000, measurable_impressions: 3000, in_view_impressions: 2500, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page2_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-07-01T01:00:45Z", window_end: "2026-07-01T02:00:00Z", measured_impressions: 4000, measurable_impressions: 3000, in_view_impressions: 2500, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_other_page_id: $.data.id }
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page1_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-07-01T01:01:01Z", window_end: "2026-07-01T02:00:00Z", measured_impressions: 4000, measurable_impressions: 3000, in_view_impressions: 2500, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_clear_id: $.data.id }
          assert:
            - "The first trigger call returns 409 ERR_BATCH_WINDOW_COLLISION: window_start is only 45 seconds after the incumbent window_end, inside the 60-second buffer"
            - "The second trigger call returns 201: the same window on page ${page2_id} is a different (campaign_id, page_id, format) resource"
            - "The third trigger call returns 201: 61 seconds of separation clears the buffer"
            - "GET /measurement-batches?page_id=${page1_id} lists exactly 2 batches (${batch_base_id} and ${batch_clear_id}) and GET /measurement-batches?page_id=${page2_id} lists exactly 1 (${batch_other_page_id})"
            - "All three surviving batches are in scoring_status INGESTED and settlement_status UNBILLED"

  - rule_id: compensating_invariant
    instances:

      - name: ivt_retract_restores_impression_conservation_with_no_drift
        grounds:
          - calculations.ivt_dedup_rate
          - state_machines.IvtFinding.CONFIRMED_to_RETRACTED
          - entities.MeasurementBatch.fields.net_billable_impressions
          - entities.MeasurementBatch.fields.sophistication_flag
        distinguishing_aspect: |
          Conserved quantity: INVARIANT_IMPRESSION_CONSERVATION,
          net_billable_impressions + ivt_impressions == measured_impressions
          (10000) at every step. The compensation is a retract, and it is only
          correct if the batch counters are RECOMPUTED from the surviving
          CONFIRMED findings rather than decremented by the retracted amount:
          the GIVT family contributes max(400, 300) = 400, so subtracting the
          retracted SIVT 250 from a running total happens to work here while
          subtracting a confirmed GIVT 300 would not. After the retract every
          figure must equal its pre-confirm value exactly - ivt_impressions 400,
          ivt_rate 0.0400, net_billable 9600, sophistication_flag back to false.
        test_recipe:
          setup:
            - "One SCORED batch with measured 10000, measurable 8000, in_view 7000, avg_in_view_seconds 1.2 -> coverage_rate 0.8000, ivt_impressions 0, net_billable 10000."
            - "F1 DATACENTER (GIVT) 400 impressions at confidence 0.90, CONFIRMED -> ivt 400, rate 0.0400, net_billable 9600."
            - "F3 GENERAL_BOT (GIVT) 300 impressions at confidence 0.85, CONFIRMED -> the family max keeps ivt at 400, unchanged."
