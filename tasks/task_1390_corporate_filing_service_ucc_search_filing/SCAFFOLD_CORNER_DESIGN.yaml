        claim_type: correct_result
        grounds: ["calculations.priority_position"]
        distinguishing_aspect: "Two EXACT_MATCH competitors: one strictly earlier by date (2020-001) and one tied on filed_at with a lexicographically smaller filing_number (CA-2026-099 < CA-2026-100); a SIMILAR-named hit filed earliest of all must NOT count. Position = 1 + 2 = 3."
