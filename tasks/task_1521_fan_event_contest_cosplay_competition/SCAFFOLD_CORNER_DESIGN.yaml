            - { call: "POST /entries/${ea}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /entries/${eb}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
