  # ===========================================================================
  # RULE 4 — transitive cascades (one depth >= 3, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: grading_cap_reached_cascade_to_lane_committed_tons
        depth: 5
        grounds:
          - state_machines.WeighTag.PENDING_to_ACCEPTED
          - state_machines.SettlementLine.initial_state
          - state_machines.PickCall.ACKNOWLEDGED_to_SUSPENDED_CAP
          - state_machines.DeliveryAppointment.SCHEDULED_to_CANCELLED
          - entities.CrushPadLane.fields.committed_tons
          - calculations.tonnage_waterfall_allocation
        distinguishing_aspect: |
          Trigger family: a QUALITY GRADE. Five hops from one POST:
          (1) POST /weigh-tags/{tagId}/grades creates the QualityGrade and runs the waterfall,
          (2) a CONTRACT-bucket SettlementLine is created and GrapeContract.delivered_contract_tons
              reaches the 40.000 soft cap so tonnage_status becomes CAP_REACHED,
          (3) the ACKNOWLEDGED PickCall of that contract is suspended to SUSPENDED_CAP,
          (4) the still-SCHEDULED third appointment of that pick call is CANCELLED,
          (5) CrushPadLane.committed_tons and scheduled_appointment_count are recomputed and
              fall to 0.000 / 0. Nothing in the request body mentions the lane.
        test_recipe:
          setup:
            - "One producer, one block, the reference QualitySpec, lane L1 with daily_capacity_tons 80.000 and turnaround_buffer_minutes 30, one crew."
            - "ACTIVE TONNAGE contract GC-CASCADE, base 450000, committed_tons 40.000, over_delivery_tolerance_pct 10.0 so contract_cap_tons 40.000 and hard_cap_tons 44.000."
            - "One acknowledged pick call with estimated_tons 45.000 (deliberately ABOVE the cap so the ACKNOWLEDGED -> FULFILLED edge never fires and the SUSPENDED_CAP edge is the only one available)."
            - "Three appointments on L1: 14:00-16:00 planned 22.000, 17:00-19:00 planned 18.000, 20:00-22:00 planned 25.000; total 65.000 tons on 2026-08-25, under the 80.000 daily cap."
            - "The first two loads are weighed, tared and graded; the third appointment is never weighed, so it is still SCHEDULED when the cap is reached."
