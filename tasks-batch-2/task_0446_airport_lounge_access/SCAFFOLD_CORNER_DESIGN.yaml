        claim_type: pagination_with_filtering
        grounds: [endpoints, entities.Lounge]
        distinguishing_aspect: "GET /lounges?airport_code=SFO&limit=1 filters then paginates; total_count reflects the filtered set."
        test_recipe:
          setup: ["Two SFO lounges and one LAX lounge."]
