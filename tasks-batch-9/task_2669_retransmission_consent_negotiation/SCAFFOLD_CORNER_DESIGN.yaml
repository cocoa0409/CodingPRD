        claim_type: Violation → Error
        grounds:
          - validations[priority=29]
          - errors.ERR_DUPLICATE_ELECTION
          - endpoints[POST /retrans/elections]
        distinguishing_aspect: "Uniqueness is keyed on (station_id, distributor_id, cycle_label) and only over non-terminal rows, so the same slot for cycle 2030-2032 is accepted while a second 2027-2029 row is refused with 422."
