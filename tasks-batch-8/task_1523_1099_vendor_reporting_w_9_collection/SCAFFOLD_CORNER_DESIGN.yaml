  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: c_withholding_zero_when_flag_off
        claim_type: correct_result
        grounds: [calculations.backup_withholding_amount, entities.Vendor.fields.backup_withholding_flag]
        distinguishing_aspect: "With a MATCHED vendor (flag false) no withholding accrues: withheld_cents == 0 and zero ledger entries exist."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V MATCHED"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Zero V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "17 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Zero V", submitted_tin: "159159159", submitted_tin_type: "SSN", signature_name: "Z" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk, captures: { wc: $.data.withheld_cents } }
            - { call: "GET /tax1099/withholding-entries", payload: { vendor_id: "${v}" }, as: TaxSpecialist }
          assert:
            - "payment withheld_cents == 0"
            - "withholding-entries list total_count == 0 (no ledger row created when the flag is off)"

      - name: c_return_box4_aggregates_withheld
        claim_type: correct_result
        grounds: [calculations.reportable_box_aggregation]
        distinguishing_aspect: "Box 4 (federal tax withheld) aggregates per-payment withheld_cents across the same in-year POSTED set: 24000 + 12000 = 36000 alongside box_1 150000."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V MISMATCHED; SERVICE payments 100000c and 50000c"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Box4 V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "18 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Box4 V", submitted_tin: "357357357", submitted_tin_type: "SSN", signature_name: "B" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_2" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 50000, payment_date: "2025-06-02T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
          trigger:
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist }
          assert:
            - "$.data[0].box_amounts.box_1_cents == 150000"
            - "$.data[0].box_amounts.box_4_cents == 36000 (gross reportable is NOT reduced by withholding)"

      - name: c_aggregation_across_source_systems
        claim_type: input_set_filtering
        grounds: [calculations.reportable_box_aggregation, entities.Payment.fields.source_system, entities.Payment.fields.status]
        distinguishing_aspect: "Payments from all four source systems aggregate onto one return (30000+20000+10000+5000 = 65000), and a VOIDED payment (7000c) is excluded from the input set."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V MATCHED; five payments from four source systems, the 7000c one voided before generate"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
