              as: ProgramAdmin
              captures: { famb_id: $.data.id, famb_v: $.data.version }
            - call: "POST /api/referrals"
              payload: { family_id: "${fama_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { refa_id: $.data.id }
            - call: "POST /api/referrals"
              payload: { family_id: "${famb_id}", hospital_id: "${hosp_id}", treating_unit: "Oncology", care_type: "INPATIENT", acuity_level: "MODERATE", attending_clinician: "Dr. Patel" }
              as: HospitalReferrer
              as_user_id: "${hosp_id}"
              captures: { refb_id: $.data.id }
            - call: "POST /api/referrals/${refa_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /api/referrals/${refb_id}/verify"
              payload: { decision: "APPROVE" }
              as: HouseManager
              as_user_id: "hm-1"
