  - rule_id: boundary_precision_check
    instances:
      - name: adjustment_floor_at_exactly_twenty_percent_of_subtotal
        grounds:
          - validations[priority=15, error_id=ERR_ADJUSTMENT_LIMIT_EXCEEDED]
          - calculations.quote_price_pipeline.constants.MAX_ADJUSTMENT_FRACTION
          - entities.Quote.fields.adjustment_cents
        distinguishing_aspect: |
          Metric: adjustment_cents against the rounded 20 percent floor of the parts subtotal, exercised
          on POST /quotes. The subtotal is 9853859 so the floor is exactly
          -round_half_up(0.20 * 9853859, 0) = -1970772. One cent inside the floor is accepted and prices
          at 7807587; one cent outside is rejected. Truncating instead of rounding the floor gives
          -1970771 and wrongly rejects the accepted case.
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS; AUTHORIZED SILVER builder; configuration cfg1 with the reference geometry and both reference accessory kits, LOCKED, so subtotal_cents is 9853859."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /builders"
              payload: { jurisdiction_id: "${j1_id}", name: "Gulf Steel Builders", tier: "SILVER", credit_limit_cents: 200000000 }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /builders/${b1_id}/authorize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /building-configurations"
              payload: { builder_id: "${b1_id}", jurisdiction_id: "${j1_id}", clear_span_ft: 100, bay_spacing_ft: 25, bay_count: 4, eave_height_ft: 24, roof_pitch_rise_per_12: 1, panel_profile: "PBR", panel_color: "POLAR_WHITE", insulation_r_value: 19 }
              as: SalesEngineer
              captures: { cfg1_id: $.data.id }
            - call: "POST /building-configurations/${cfg1_id}/accessory-kits"
              payload: { kit_type: "OVERHEAD_DOOR", quantity: 2, unit_price_cents: 385075, unit_weight_lbs: 640.5, erection_stage: "TRIM_ACCESSORY" }
              as: SalesEngineer
            - call: "POST /building-configurations/${cfg1_id}/accessory-kits"
              payload: { kit_type: "VENTILATION", quantity: 3, unit_price_cents: 129933, unit_weight_lbs: 88.25, erection_stage: "ROOF_PANEL" }
              as: SalesEngineer
            - call: "POST /building-configurations/${cfg1_id}/lock"
              payload: {}
              as: SalesEngineer
          trigger:
            - call: "POST /quotes"
              payload: { builder_id: "${b1_id}", configuration_id: "${cfg1_id}", freight_distance_miles: 240, adjustment_cents: -1970772 }
              as: SalesEngineer
              captures: { q_floor_ok_id: $.data.id }
            - call: "POST /quotes"
              payload: { builder_id: "${b1_id}", configuration_id: "${cfg1_id}", freight_distance_miles: 240, adjustment_cents: -1970773 }
              as: SalesEngineer
          assert:
            - "the first call returns 201 and Quote.${q_floor_ok_id}.adjustment_cents == -1970772"
            - "Quote.${q_floor_ok_id}.subtotal_cents == 9853859"
            - "Quote.${q_floor_ok_id}.pre_discount_total_cents == 8049059"
            - "Quote.${q_floor_ok_id}.total_discount_rate == 0.03"
            - "Quote.${q_floor_ok_id}.quoted_price_cents == 7807587"
            - "the second call returns error_id ERR_ADJUSTMENT_LIMIT_EXCEEDED with HTTP status 422"
            - "no Quote row is persisted for the second call"

      - name: revision_limit_boundary_at_third_and_fourth_revise
        grounds:
          - validations[priority=14, error_id=ERR_REVISION_LIMIT_REACHED]
          - entities.EngineeringDesign.fields.revision_count
          - state_machines.EngineeringDesign.REVISION_REQUIRED_to_DRAFT
        distinguishing_aspect: |
          A different metric (revision_count, a counter, not money) on a different endpoint
          (POST /engineering-designs/{id}/revise). The gate is revision_count < 3, so the third revise
          must succeed and leave the counter at exactly 3 while the fourth must be rejected. An
          off-by-one gate written as revision_count <= 3 lets a fourth revision through; one written as
          revision_count < 2 blocks the legitimate third.
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z; jurisdiction TX-HARRIS; AUTHORIZED SILVER builder; LOCKED configuration cfg1."
            - "ASD design d4 on cfg1 with one PRIMARY_FRAME_MEMBER, already through two full submit / REQUEST_REVISION / revise cycles so revision_count is 2, and currently SUBMITTED for the third time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
