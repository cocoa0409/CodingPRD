# =============================================================================
# Task 1130: Nonprofit Grant Reporting to Funders — seed tables
# =============================================================================

scenario: |
  1130. Nonprofit Grant Reporting to Funders (nonprofit grants management office): award terms & reporting calendar per grant, restricted fund tracking & expense allocation, narrative report drafting & outcome data assembly, budget-vs-actual reporting & variance explanation, no-cost extension & budget modification request, matching/in-kind documentation, audit & site visit preparation, renewal application timing

domain_name: nonprofit-grant-reporting
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid          # Grant-rooted tree + ExpenseAllocation junction + Funder cross-aggregate refs
  state_machine_shape: cyclic      # Report revision loop, Grant suspend/reactivate loop, AuditFinding reopen loop
  relationship_patterns:
    - one_to_many
    - many_to_many                 # ExpenseAllocation joins Expense x BudgetLine x Fund
    - cross_aggregate              # Report gating reads BudgetLine/MatchContribution; AuditFinding mutates Grant
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

constants:
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"
  STANDARD_VOLUNTEER_RATE_CENTS: 3150
  DE_MINIMIS_INDIRECT_PCT: 10
  TRAILING_WINDOW_PERIODS: 1
  AUDITOR_MAX_CONCURRENT_ENGAGEMENTS: 2
  DEFAULT_INTERIM_DUE_DAYS: 30
  DEFAULT_FINAL_DUE_DAYS: 90
  DEFAULT_RENEWAL_WINDOW_DAYS: 60
  DEFAULT_VARIANCE_THRESHOLD_PCT: 10.0

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Funder
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Funder organization name" }
      - { name: funder_type, type: enum, source: input, description: "FEDERAL | STATE | FOUNDATION | CORPORATE" }
      - { name: contact_email, type: string, source: input, description: "Funder contact email" }
      - { name: requires_match, type: boolean, source: input, default: false, description: "Whether awards from this funder carry a match requirement" }

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - { name: funder_id, type: string, source: input, description: "FK -> Funder.id; awarding funder" }
      - { name: award_number, type: string, source: input, description: "Funder-assigned award identifier; unique per funder" }
      - { name: title, type: string, source: input, description: "Grant title" }
      - { name: award_amount_cents, type: integer, source: input, description: "Total awarded amount in cents" }
      - { name: start_date, type: datetime, source: input, description: "Award period start (date, UTC midnight)" }
      - { name: end_date, type: datetime, source: input, description: "Current award period end date; mutated by approved NO_COST_EXTENSION" }
      - { name: original_end_date, type: datetime, source: system, description: "End date snapshot at creation; never mutated" }
      - { name: reporting_frequency, type: enum, source: input, description: "MONTHLY | QUARTERLY | SEMIANNUAL | ANNUAL" }
      - { name: interim_report_due_days, type: integer, source: input, default: 30, description: "Days after period_end that an INTERIM report is due" }
      - { name: final_report_due_days, type: integer, source: input, default: 90, description: "Days after period_end that the FINAL report is due" }
      - { name: variance_threshold_pct, type: number, source: input, default: 10.0, description: "|period_variance_pct| >= this value forces a VarianceExplanation" }
      - { name: indirect_rate_pct, type: number, source: input, default: 0, description: "Negotiated indirect rate; 0 means unset (FEDERAL funders then use de minimis)" }
      - { name: indirect_cap_cents, type: integer, source: input, default: null, description: "Optional cap on indirect pool; null = uncapped" }
      - { name: renewal_window_days, type: integer, source: input, default: 60, description: "Days before end_date when the renewal window opens" }
      - { name: required_match_cents, type: integer, source: input, default: 0, description: "Match commitment the grantee must document" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | CLOSEOUT | CLOSED" }
      - { name: total_expended_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over all ExpenseAllocation with status ACTIVE on this grant" }

  - name: BudgetLine
    parent: Grant
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; owning grant" }
      - { name: category, type: enum, source: input, description: "PERSONNEL | FRINGE | TRAVEL | EQUIPMENT | SUPPLIES | CONTRACTUAL | INDIRECT | OTHER" }
      - { name: budgeted_cents, type: integer, source: input, description: "Original budget authority for this line" }
      - { name: adjusted_cents, type: integer, source: computed, description: "= budgeted_cents + sum of delta_cents from APPROVED BUDGET_REALLOCATION line_deltas" }
      - { name: expended_cents, type: integer, source: computed, default: 0, description: "= sum of amount_cents over ACTIVE ExpenseAllocation rows on this line" }
      - { name: period_budgets_cents, type: array, source: computed, description: "Per-period proration of adjusted_cents across the grant's report periods (see period_budget_proration); recomputed on every approved reallocation" }

  - name: Fund
    parent: Grant
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; owning grant" }
      - { name: fund_type, type: enum, source: input, description: "RESTRICTED | UNRESTRICTED" }
      - { name: purpose_restriction, type: string, source: input, default: null, description: "Free-text purpose restriction (RESTRICTED funds)" }
      - { name: allowed_categories, type: array, source: input, default: [], description: "BudgetLine.category values this fund may pay for; empty array = all categories allowed" }
      - { name: allocated_cents, type: integer, source: input, description: "Budget authority assigned to this fund" }
      - { name: expended_cents, type: integer, source: computed, default: 0, description: "= sum of amount_cents over ACTIVE ExpenseAllocation rows drawing on this fund" }
      - { name: remaining_cents, type: integer, source: computed, description: "= allocated_cents - expended_cents" }

  - name: Expense
    parent: Grant
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; owning grant" }
      - { name: expense_date, type: datetime, source: input, description: "Date the expense was incurred (determines report period membership)" }
      - { name: vendor, type: string, source: input, description: "Payee" }
      - { name: description, type: string, source: input, description: "Expense description" }
      - { name: amount_cents, type: integer, source: input, description: "Total expense amount; must be > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | POSTED | VOIDED" }
      - { name: unallocated_cents, type: integer, source: computed, description: "= amount_cents - sum of amount_cents over its ACTIVE ExpenseAllocation rows" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (segregation-of-duties anchor)" }
      - { name: posted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of poster; must differ from created_by_user_id" }

  - name: ExpenseAllocation
    parent: Expense
    common_fields: true
    fields:
      - { name: expense_id, type: string, source: system, description: "FK -> Expense.id; expense being split" }
      - { name: budget_line_id, type: string, source: input, description: "FK -> BudgetLine.id; line charged" }
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id; fund drawn down" }
      - { name: amount_cents, type: integer, source: input, description: "Allocated amount; must be > 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED (voided only via parent expense void cascade)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of allocator" }

  - name: Report
    parent: Grant
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; owning grant" }
      - { name: period_index, type: integer, source: system, description: "1-based index in the grant reporting calendar" }
      - { name: period_type, type: enum, source: system, description: "INTERIM | FINAL; last period of the current calendar is FINAL" }
      - { name: period_start, type: datetime, source: system, description: "Period start (inclusive)" }
      - { name: period_end, type: datetime, source: system, description: "Period end (inclusive date)" }
      - { name: due_date, type: datetime, source: system, description: "= period_end + interim/final_report_due_days" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DRAFT | SUBMITTED | UNDER_REVIEW | RETURNED | ACCEPTED" }
      - { name: narrative_draft, type: string, source: input, default: "", description: "Narrative report text" }
      - { name: outcome_entries, type: array, source: input, default: [], description: "Outcome data rows: objects {metric_name, target_value, actual_value, unit}" }
      - { name: frozen, type: boolean, source: system, default: false, description: "true while grant is SUSPENDED; blocks PUT and submit" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments by 1 on each RETURNED -> DRAFT revise transition" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Timestamp of latest successful submit" }
      - { name: submitted_late, type: boolean, source: computed, default: false, description: "= submitted_at > due_date end-of-day (23:59:59Z)" }
      - { name: prepared_by_user_id, type: string, source: system, default: null, description: "X-User-ID of last PUT editor" }
      - { name: returned_reason, type: string, source: system, default: null, description: "Funder's reason on the latest RETURNED transition" }

  - name: VarianceExplanation
    parent: Report
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> Report.id; owning report" }
      - { name: budget_line_id, type: string, source: input, description: "FK -> BudgetLine.id; line being explained; unique per report" }
      - { name: explanation_text, type: string, source: input, description: "Variance narrative; must be non-empty" }
      - { name: period_variance_pct_snapshot, type: number, source: computed, description: "period_only variance_pct of the line at the moment of creation" }
      - { name: status, type: enum, source: system, description: "DRAFTED | LOCKED | SUBMITTED" }

  - name: MatchContribution
    parent: Grant
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; owning grant" }
      - { name: source_name, type: string, source: input, description: "Contributor name" }
      - { name: contribution_type, type: enum, source: input, description: "CASH | IN_KIND_GOODS | IN_KIND_SERVICES | VOLUNTEER_TIME" }
      - { name: valuation_basis, type: enum, source: input, description: "FAIR_MARKET | ACTUAL_COST | STANDARD_RATE" }
      - { name: documented_value_cents, type: integer, source: input, default: 0, description: "Donor-documented value" }
      - { name: volunteer_hours, type: number, source: input, default: 0, description: "Hours donated (VOLUNTEER_TIME)" }
      - { name: recognized_value_cents, type: integer, source: computed, description: "Per match_recognition: VOLUNTEER_TIME => round(volunteer_hours x STANDARD_VOLUNTEER_RATE_CENTS); all other types => documented_value_cents" }
      - { name: status, type: enum, source: system, description: "PLEDGED | DOCUMENTED | VERIFIED" }
      - { name: documented_by_user_id, type: string, source: system, default: null, description: "X-User-ID that moved it to DOCUMENTED" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID that verified; must differ from documented_by_user_id" }

  - name: ModificationRequest
    parent: Grant
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; owning grant" }
      - { name: request_type, type: enum, source: input, description: "NO_COST_EXTENSION | BUDGET_REALLOCATION" }
      - { name: justification, type: string, source: input, description: "Request justification" }
      - { name: requested_end_date, type: datetime, source: input, default: null, description: "Required for NO_COST_EXTENSION; must be strictly after grant.end_date" }
      - { name: line_deltas, type: array, source: input, default: [], description: "For BUDGET_REALLOCATION: [{budget_line_id, delta_cents}]; deltas must sum to 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED | WITHDRAWN" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of drafter" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of submitter" }
      - { name: decided_by_funder_id, type: string, source: system, default: null, description: "Funder.id that approved/denied" }

  - name: AuditEngagement
    parent: Grant
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; grant under audit" }
      - { name: engagement_type, type: enum, source: input, description: "FINANCIAL_AUDIT | SITE_VISIT | DESK_REVIEW" }
      - { name: auditor_org, type: string, source: input, description: "Audit firm identifier (capacity resource)" }
      - { name: scheduled_start, type: datetime, source: input, description: "Engagement window start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Engagement window end (exclusive, half-open interval)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PREPARATION | READY | CONDUCTED | FINDINGS_ISSUED | CLOSED" }

  - name: AuditFinding
    parent: AuditEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> AuditEngagement.id; owning engagement" }
      - { name: severity, type: enum, source: input, description: "OBSERVATION | DEFICIENCY | MATERIAL_WEAKNESS" }
      - { name: description, type: string, source: input, description: "Finding text" }
      - { name: status, type: enum, source: system, description: "OPEN | RESPONSE_SUBMITTED | RESOLVED" }
      - { name: response_text, type: string, source: system, default: null, description: "Grantee response on respond" }

  - name: RenewalApplication
    parent: Grant
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; owning grant; at most one RenewalApplication per grant" }
      - { name: window_open, type: datetime, source: computed, description: "= grant.end_date - grant.renewal_window_days, at 00:00:00Z" }
      - { name: window_close, type: datetime, source: computed, description: "= grant.end_date at 23:59:59Z" }
      - { name: status, type: enum, source: system, description: "NOT_OPEN | ELIGIBLE | SUBMITTED | RENEWED | DECLINED | LAPSED" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Submission timestamp" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Grant
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /grants/{id}/activate"
        actor: ProgramDirector
        preconditions:
          - "at least one BudgetLine exists for the grant (ERR_INVALID_STATE)"
          - "at least one Fund exists for the grant (ERR_INVALID_STATE)"
        side_effects:
          - "generates the full Report calendar: one Report row (status SCHEDULED) per period per reporting_frequency covering [start_date, end_date]; last period gets period_type FINAL; due_date = period_end + interim_report_due_days (INTERIM) or final_report_due_days (FINAL)"
          - "recomputes every BudgetLine.period_budgets_cents"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when an AuditFinding with severity MATERIAL_WEAKNESS is created on an engagement of this grant)"
        actor: system
        preconditions: []
        side_effects:
          - "every Report of this grant in DRAFT or RETURNED gets frozen = true"
          - "every VarianceExplanation in DRAFTED on those reports transitions to LOCKED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic when the grant's last OPEN MATERIAL_WEAKNESS AuditFinding reaches RESOLVED)"
        actor: system
        preconditions:
          - "no other AuditFinding with severity MATERIAL_WEAKNESS and status OPEN or RESPONSE_SUBMITTED remains on any engagement of this grant"
        side_effects:
          - "every frozen Report of this grant gets frozen = false"
          - "every VarianceExplanation in LOCKED transitions back to DRAFTED"
      - from: ACTIVE
        to: CLOSEOUT
        trigger: "system (automatic when the FINAL Report of this grant reaches ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLOSEOUT
        to: CLOSED
        trigger: "POST /grants/{id}/closeout"
        actor: ProgramDirector
        preconditions:
          - "all Reports of the grant are ACCEPTED (ERR_INVALID_STATE)"
          - "no AuditFinding on any engagement of the grant is OPEN or RESPONSE_SUBMITTED (ERR_INVALID_STATE)"
          - "no ModificationRequest of the grant is DRAFT or SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: Report
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SCHEDULED
        to: DRAFT
        trigger: "POST /reports/{id}/start"
        actor: GrantsOfficer
        preconditions:
          - "grant.status == ACTIVE (ERR_GRANT_NOT_ACTIVE / ERR_GRANT_SUSPENDED)"
          - "current time >= period_start (ERR_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reports/{id}/submit"
        actor: GrantsOfficer
        preconditions:
          - "grant.status != SUSPENDED and report.frozen == false (ERR_GRANT_SUSPENDED)"
          - "narrative_draft non-empty AND outcome_entries has at least 1 entry (ERR_OUTCOME_DATA_REQUIRED)"
          - "every BudgetLine of the grant whose period_only |variance_pct| >= grant.variance_threshold_pct has a VarianceExplanation row (any non-empty text) on this report (ERR_VARIANCE_EXPLANATION_REQUIRED)"
          - "if period_type == FINAL: match_verified_only_cents >= grant.required_match_cents (ERR_MATCH_SHORTFALL)"
        side_effects:
          - "submitted_at = now; submitted_late recomputed"
          - "VarianceExplanation rows on this report in DRAFTED transition to SUBMITTED"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /reports/{id}/start-review"
        actor: Funder
        preconditions:
          - "acting Funder.id == grant.funder_id (ERR_FORBIDDEN)"
        side_effects: []
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /reports/{id}/accept"
        actor: Funder
        preconditions:
          - "acting Funder.id == grant.funder_id (ERR_FORBIDDEN)"
        side_effects:
          - "if period_type == FINAL: grant transitions ACTIVE -> CLOSEOUT"
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /reports/{id}/return"
        actor: Funder
        preconditions:
          - "acting Funder.id == grant.funder_id (ERR_FORBIDDEN)"
        side_effects:
          - "returned_reason set from payload"
          - "VarianceExplanation rows on this report in SUBMITTED transition back to DRAFTED"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /reports/{id}/revise"
        actor: GrantsOfficer
        preconditions:
          - "grant.status != SUSPENDED (ERR_GRANT_SUSPENDED)"
        side_effects:
          - "revision_count += 1"
        note: "revision loop: a report may cycle RETURNED -> DRAFT -> SUBMITTED repeatedly"

  - entity: Expense
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /expenses/{id}/post"
        actor: FinanceManager
        preconditions:
          - "grant.status == ACTIVE (ERR_GRANT_NOT_ACTIVE / ERR_GRANT_SUSPENDED)"
          - "acting X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "posted_by_user_id = acting X-User-ID"
      - from: POSTED
        to: VOIDED
        trigger: "POST /expenses/{id}/void"
        actor: FinanceManager
        preconditions:
          - "no ACTIVE allocation of this expense has expense_date inside a period whose Report status is SUBMITTED, UNDER_REVIEW, or ACCEPTED (ERR_EXPENSE_LOCKED_BY_REPORT)"
        side_effects:
          - "every ACTIVE ExpenseAllocation of this expense transitions to VOIDED"
          - "for each voided allocation: BudgetLine.expended_cents -= amount_cents and Fund.expended_cents -= amount_cents"
          - "Grant.total_expended_cents recomputed"
        note: "compensating action of post+allocate; see compensating invariants"

  - entity: ExpenseAllocation
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "system (cascade from parent Expense POSTED -> VOIDED)"
        actor: system
        preconditions: []
        side_effects:
          - "BudgetLine.expended_cents, Fund.expended_cents, Grant.total_expended_cents reconciled"

  - entity: MatchContribution
    initial_state: PLEDGED
    terminal_states: [VERIFIED]
    transitions:
      - from: PLEDGED
        to: DOCUMENTED
        trigger: "POST /match-contributions/{id}/document"
        actor: GrantsOfficer
        preconditions:
          - "grant.status == ACTIVE (ERR_GRANT_NOT_ACTIVE / ERR_GRANT_SUSPENDED)"
        side_effects:
          - "documented_by_user_id = acting X-User-ID"
      - from: DOCUMENTED
        to: VERIFIED
        trigger: "POST /match-contributions/{id}/verify"
        actor: FinanceManager
        preconditions:
          - "acting X-User-ID != documented_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by_user_id = acting X-User-ID"

  - entity: ModificationRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /modification-requests/{id}/submit"
        actor: ProgramDirector
        preconditions:
          - "grant.status == ACTIVE (ERR_GRANT_NOT_ACTIVE / ERR_GRANT_SUSPENDED)"
          - "NO_COST_EXTENSION: requested_end_date strictly after grant.end_date (ERR_EXTENSION_NOT_FORWARD)"
          - "BUDGET_REALLOCATION: sum of line_deltas.delta_cents == 0 (ERR_REALLOCATION_NOT_BALANCED)"
          - "BUDGET_REALLOCATION: for every delta, BudgetLine.adjusted_cents + delta_cents >= BudgetLine.expended_cents (ERR_REALLOCATION_BELOW_EXPENDED)"
        side_effects:
          - "submitted_by_user_id = acting X-User-ID"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /modification-requests/{id}/approve"
        actor: Funder
        preconditions:
          - "acting Funder.id == grant.funder_id (ERR_FORBIDDEN)"
          - "expected_grant_version == grant.version (ERR_STALE_VERSION, OCC)"
        side_effects:
          - "increments Grant.version by 1"
          - "NO_COST_EXTENSION: grant.end_date = requested_end_date; calendar regen — existing FINAL Report still SCHEDULED becomes INTERIM, new Report rows appended to cover [old end_date + 1 day, requested_end_date] with the last as FINAL; future SCHEDULED reports otherwise unchanged"
          - "BUDGET_REALLOCATION: each BudgetLine.adjusted_cents += delta_cents; each affected BudgetLine.period_budgets_cents recomputed"
          - "decided_by_funder_id = acting Funder.id"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /modification-requests/{id}/deny"
        actor: Funder
        preconditions:
          - "acting Funder.id == grant.funder_id (ERR_FORBIDDEN)"
        side_effects:
          - "decided_by_funder_id = acting Funder.id"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /modification-requests/{id}/withdraw"
        actor: GrantsOfficer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /modification-requests/{id}/withdraw"
        actor: GrantsOfficer
        preconditions: []
        side_effects: []

  - entity: AuditEngagement
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: PREPARATION
        trigger: "POST /audit-engagements/{id}/advance"
        actor: Auditor
        preconditions: []
        side_effects: []
      - from: PREPARATION
        to: READY
        trigger: "POST /audit-engagements/{id}/advance"
        actor: Auditor
        preconditions: []
        side_effects: []
      - from: READY
        to: CONDUCTED
        trigger: "POST /audit-engagements/{id}/advance"
        actor: Auditor
        preconditions: []
        side_effects: []
      - from: CONDUCTED
        to: FINDINGS_ISSUED
        trigger: "POST /audit-engagements/{id}/advance"
        actor: Auditor
        preconditions: []
        side_effects: []
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /audit-engagements/{id}/advance"
        actor: Auditor
        preconditions:
          - "all AuditFinding rows of this engagement are RESOLVED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESPONSE_SUBMITTED
        trigger: "POST /audit-findings/{id}/respond"
        actor: GrantsOfficer
        preconditions: []
        side_effects:
          - "response_text set from payload"
      - from: RESPONSE_SUBMITTED
        to: RESOLVED
        trigger: "POST /audit-findings/{id}/resolve"
        actor: Auditor
        preconditions: []
        side_effects:
          - "if severity == MATERIAL_WEAKNESS and no other OPEN/RESPONSE_SUBMITTED MATERIAL_WEAKNESS finding remains on the grant: grant SUSPENDED -> ACTIVE with its unfreeze cascade"
      - from: RESPONSE_SUBMITTED
        to: OPEN
        trigger: "POST /audit-findings/{id}/reopen"
        actor: Auditor
        preconditions: []
        side_effects: []
        note: "reopen loop: RESPONSE_SUBMITTED -> OPEN -> RESPONSE_SUBMITTED may repeat"

  - entity: RenewalApplication
    initial_state: NOT_OPEN
    terminal_states: [RENEWED, DECLINED, LAPSED]
    transitions:
      - from: NOT_OPEN
        to: ELIGIBLE
        trigger: "system (automatic on clock advance when current time >= window_open)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ELIGIBLE
        to: LAPSED
        trigger: "system (automatic on clock advance when current time > window_close and no submission occurred)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ELIGIBLE
        to: SUBMITTED
        trigger: "POST /renewal-applications/{id}/submit"
        actor: ProgramDirector
        preconditions:
          - "status NOT_OPEN -> ERR_RENEWAL_WINDOW_NOT_OPEN; status LAPSED -> ERR_RENEWAL_WINDOW_LAPSED"
        side_effects:
          - "submitted_at = now"
      - from: SUBMITTED
        to: RENEWED
        trigger: "POST /renewal-applications/{id}/decide with decision=RENEWED"
        actor: Funder
        preconditions:
          - "acting Funder.id == grant.funder_id (ERR_FORBIDDEN)"
        side_effects: []
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /renewal-applications/{id}/decide with decision=DECLINED"
        actor: Funder
        preconditions:
          - "acting Funder.id == grant.funder_id (ERR_FORBIDDEN)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: modification-approve-stale-grant
    parent_entity: Grant
    write_endpoint: "POST /modification-requests/{id}/approve"
    occ_field: expected_grant_version
    description: |
      Approving a SUBMITTED ModificationRequest against a Grant whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another modification approval has just mutated
      grant.end_date or BudgetLine.adjusted_cents (and bumped grant.version),
      so the current approver's view of the award baseline is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: period_budget_proration
    trigger: "on grant activation and on every approved BUDGET_REALLOCATION, per affected BudgetLine"
    algorithm: waterfall_allocation
    formula: |
      n = number of Report periods of the grant
      base = floor(adjusted_cents / n)                # integer cents, round DOWN per period
      remainder = adjusted_cents - base * n
      period_budgets_cents[i] = base for i in 1..n-1
      period_budgets_cents[n] = base + remainder      # residual assigned to the FINAL period
      # PINNED ORDER: per-period floor first, residual to the final period last.
      # round-each-period-to-nearest would give a different vector (e.g. 10000003/4).
    input_set: "the grant's Report rows (any status), ordered by period_index ASC"
    constants:
      ROUNDING: "floor per period, residual to final period"
    precision: "integer cents, no fractional rounding"
    variants: []

  - name: budget_variance_report
    trigger: "on GET /grants/{id}/summary, and evaluated during POST /reports/{id}/submit gating"
    algorithm: aggregation
    formula: |
      For BudgetLine L and Report R of grant G:
      period_actual(L,R)  = sum of amount_cents over ExpenseAllocation a where
                            a.budget_line_id == L.id, a.status == ACTIVE,
                            R.period_start <= a.expense.expense_date <= R.period_end
      cumulative_actual(L,R) = same but expense_date <= R.period_end (no lower bound)
      period_budget(L,R)     = L.period_budgets_cents[R.period_index]
      cumulative_budget(L,R) = sum of L.period_budgets_cents[1..R.period_index]
      variance_pct(actual, budget) = round( (actual - budget) / budget * 100, 2 )   # half-up; budget == 0 => null
      GATING: submit requires explanation for L iff period_actual(L,R) > 0 AND
              |period_variance_pct| >= G.variance_threshold_pct
              (zero-activity lines — period_actual == 0 — are exempt from the gate)
    input_set: "ExpenseAllocation rows with status ACTIVE only (VOIDED excluded); parent Expense may be POSTED only (DRAFT expenses have no allocations by rule); VOIDED expenses contribute nothing because their allocations are VOIDED"
    constants:
      THRESHOLD_COMPARATOR: ">= (inclusive)"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: period_only
        when: "used for the submit-gating decision and the per-period BvA row"
        difference: "actual and budget restricted to [period_start, period_end]"
      - name: cumulative
        when: "displayed in summary as award-to-date position"
        difference: "actual sums all allocations with expense_date <= period_end; budget sums period budgets 1..period_index — same data, different totals"

  - name: indirect_cost_pool
    trigger: "on GET /grants/{id}/summary"
    algorithm: tiered_pricing
    formula: |
      direct_base = sum of amount_cents over ACTIVE ExpenseAllocation whose
                    BudgetLine.category != INDIRECT
      rate = grant.indirect_rate_pct
      if rate == 0 and funder.funder_type == FEDERAL: rate = DE_MINIMIS_INDIRECT_PCT
      if rate == 0 and funder.funder_type != FEDERAL: rate = 0
      uncapped = floor(direct_base * rate / 100)      # integer cents
      pool = min(uncapped, grant.indirect_cap_cents) if cap is not null else uncapped
      # 3+ inputs (direct_base, rate source branch, cap) with nested min and a
      # conditional branch on funder_type — mode (a) combinatorial.
    input_set: "ACTIVE ExpenseAllocation rows on this grant, all funds, lines with category != INDIRECT"
    constants:
      DE_MINIMIS_INDIRECT_PCT: 10
    precision: "integer cents, floor"
    variants: []

  - name: match_commitment_progress
    trigger: "on GET /grants/{id}/summary, and during FINAL report submit gating"
    algorithm: aggregation
    formula: |
      recognized(c) = round(c.volunteer_hours * STANDARD_VOLUNTEER_RATE_CENTS) if c.contribution_type == VOLUNTEER_TIME
                      else c.documented_value_cents
      match_verified_only_cents      = sum recognized(c) over c.status == VERIFIED
      match_pledged_inclusive_cents  = sum recognized(c) over c.status in {PLEDGED, DOCUMENTED, VERIFIED}
      verified_only_pct     = round(match_verified_only_cents / grant.required_match_cents * 100, 2)     # 0 required => null
      pledged_inclusive_pct = round(match_pledged_inclusive_cents / grant.required_match_cents * 100, 2)
      GATING (FINAL report submit): match_verified_only_cents >= grant.required_match_cents
    input_set: "MatchContribution rows of the grant, filtered by status set per variant"
    constants:
      STANDARD_VOLUNTEER_RATE_CENTS: 3150
    precision: "integer cents; percentages 2 decimal places, round_half_up"
    variants:
      - name: verified_only
        when: "compliance position; gates FINAL report submission"
        difference: "only VERIFIED contributions count"
      - name: pledged_inclusive
        when: "pipeline position shown to development staff"
        difference: "PLEDGED + DOCUMENTED + VERIFIED count — same contributions, different total"

  - name: burn_rate_projection
    trigger: "on GET /grants/{id}/summary"
    algorithm: forward_looking
    formula: |
      closed = Reports of the grant with status ACCEPTED, ordered by period_index ASC
      if closed is empty: trailing = 0, cumulative = 0, pacing_ratio = null
      trailing_avg = mean of period totals (ACTIVE allocations by expense_date) over the
                     last TRAILING_WINDOW_PERIODS closed periods
      burn_trailing_cents = round(trailing_avg * total_periods)
      elapsed = count(closed)
      burn_cumulative_cents = round( (grant.total_expended_cents / elapsed) * total_periods )
      pacing_ratio = round( grant.total_expended_cents / (grant.award_amount_cents * elapsed / total_periods), 2 )
    input_set: "ACCEPTED Reports only; ACTIVE allocations; total_periods = count of all Report rows"
    constants:
      TRAILING_WINDOW_PERIODS: 1
    precision: "integer cents; pacing_ratio 2 decimal places, round_half_up"
    variants:
      - name: trailing_average
        when: "short-run momentum view"
        difference: "uses only the most recent 1 closed period"
      - name: cumulative_average
        when: "award-to-date average view"
        difference: "uses all closed periods — same ledger, different projection"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's roles; for Funder-actor endpoints, X-User-ID equals the grant's funder_id", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path resource ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_safety, check: "segregation of duties: expense poster != expense creator; match verifier != match documenter", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /expenses/{id}/post, POST /match-contributions/{id}/verify" }
  - { priority: 5, category: state, check: "state-machine from-state and cross-entity state preconditions (grant active/not-suspended, report editable/not frozen, expense POSTED for allocation, modification SUBMITTED for approve/deny, finding OPEN for respond, renewal window state, expense not locked by submitted report)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "grant.status == ACTIVE where required (activate-only resources, expense creation/posting, match document, modification submit)", error_id: ERR_GRANT_NOT_ACTIVE, http_status: 409, applies_to: "POST /grants/{id}/expenses, POST /expenses/{id}/post, POST /grants/{id}/match-contributions, POST /match-contributions/{id}/document, POST /modification-requests/{id}/submit, POST /reports/{id}/start" }
  - { priority: 5, category: state, check: "grant.status == SUSPENDED blocks report submit/revise, expense create/post, match document, modification submit", error_id: ERR_GRANT_SUSPENDED, http_status: 409, applies_to: "POST /reports/{id}/submit, POST /reports/{id}/revise, POST /grants/{id}/expenses, POST /expenses/{id}/post, POST /match-contributions/{id}/document, POST /modification-requests/{id}/submit" }
  - { priority: 5, category: state, check: "report frozen or not in DRAFT/RETURNED blocks edit; frozen report blocks submit", error_id: ERR_REPORT_NOT_EDITABLE, http_status: 409, applies_to: "PUT /reports/{id}, POST /reports/{id}/variance-explanations" }
  - { priority: 5, category: state, check: "expense must be POSTED before allocations are created", error_id: ERR_EXPENSE_NOT_POSTED, http_status: 409, applies_to: "POST /expenses/{id}/allocations" }
  - { priority: 5, category: state, check: "modification must be SUBMITTED for approve/deny; DRAFT or SUBMITTED for withdraw", error_id: ERR_MODIFICATION_NOT_PENDING, http_status: 409, applies_to: "POST /modification-requests/{id}/approve, POST /modification-requests/{id}/deny, POST /modification-requests/{id}/withdraw" }
  - { priority: 5, category: state, check: "finding must be OPEN for respond, RESPONSE_SUBMITTED for resolve/reopen", error_id: ERR_FINDING_NOT_OPEN, http_status: 409, applies_to: "POST /audit-findings/{id}/respond, POST /audit-findings/{id}/resolve, POST /audit-findings/{id}/reopen" }
  - { priority: 5, category: state, check: "renewal submit from NOT_OPEN rejected", error_id: ERR_RENEWAL_WINDOW_NOT_OPEN, http_status: 409, applies_to: "POST /renewal-applications/{id}/submit" }
  - { priority: 5, category: state, check: "renewal submit from LAPSED rejected", error_id: ERR_RENEWAL_WINDOW_LAPSED, http_status: 409, applies_to: "POST /renewal-applications/{id}/submit" }
  - { priority: 5, category: state, check: "expense void blocked when an allocation's period report is SUBMITTED/UNDER_REVIEW/ACCEPTED", error_id: ERR_EXPENSE_LOCKED_BY_REPORT, http_status: 409, applies_to: "POST /expenses/{id}/void" }
  - { priority: 5, category: state, check: "OCC: expected_grant_version must equal grant.version on approve", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /modification-requests/{id}/approve" }
  - { priority: 6, category: business_safety, check: "RESTRICTED fund: allocation's BudgetLine.category must be in fund.allowed_categories (empty = all allowed)", error_id: ERR_RESTRICTION_VIOLATION, http_status: 422, applies_to: "POST /expenses/{id}/allocations" }
  - { priority: 7, category: business_constraint, check: "award_number unique per funder; at most one RenewalApplication per grant; engagement windows on one grant must not overlap (half-open, adjacency allowed); auditor_org may have at most AUDITOR_MAX_CONCURRENT_ENGAGEMENTS overlapping active engagements; reallocation deltas sum to zero", error_id: ERR_DUPLICATE_AWARD_NUMBER, http_status: 409, applies_to: "POST /grants" }
  - { priority: 7, category: business_constraint, check: "engagement half-open window [scheduled_start, scheduled_end) overlaps another non-CLOSED engagement on the same grant (adjacent end==start is allowed)", error_id: ERR_ENGAGEMENT_OVERLAP, http_status: 409, applies_to: "POST /grants/{id}/audit-engagements" }
  - { priority: 7, category: business_constraint, check: "creating the engagement would give auditor_org a 3rd mutually-overlapping active engagement (capacity 2)", error_id: ERR_AUDITOR_CAPACITY, http_status: 409, applies_to: "POST /grants/{id}/audit-engagements" }
  - { priority: 7, category: business_constraint, check: "BUDGET_REALLOCATION line_deltas must sum to exactly 0", error_id: ERR_REALLOCATION_NOT_BALANCED, http_status: 422, applies_to: "POST /modification-requests/{id}/submit" }
  - { priority: 8, category: business_temporal, check: "NO_COST_EXTENSION requested_end_date must be strictly after current grant.end_date", error_id: ERR_EXTENSION_NOT_FORWARD, http_status: 422, applies_to: "POST /modification-requests/{id}/submit" }
  - { priority: 9, category: business_referential, check: "allocation's budget_line and fund must belong to the same grant as the expense", error_id: ERR_VALIDATION, http_status: 400, applies_to: "POST /expenses/{id}/allocations" }
  - { priority: 9, category: business_referential, check: "report submit: every line breaching the variance threshold has an explanation; narrative + at least one outcome entry present", error_id: ERR_VARIANCE_EXPLANATION_REQUIRED, http_status: 422, applies_to: "POST /reports/{id}/submit" }
  - { priority: 9, category: business_referential, check: "report submit: narrative_draft non-empty and outcome_entries non-empty", error_id: ERR_OUTCOME_DATA_REQUIRED, http_status: 422, applies_to: "POST /reports/{id}/submit" }
  - { priority: 9, category: business_referential, check: "FINAL report submit: match_verified_only_cents >= required_match_cents", error_id: ERR_MATCH_SHORTFALL, http_status: 422, applies_to: "POST /reports/{id}/submit" }
  - { priority: 9, category: business_referential, check: "BUDGET_REALLOCATION: adjusted_cents + delta_cents >= expended_cents per line", error_id: ERR_REALLOCATION_BELOW_EXPENDED, http_status: 422, applies_to: "POST /modification-requests/{id}/submit" }
  - { priority: 10, category: business_fiscal, check: "allocation amount <= expense.unallocated_cents", error_id: ERR_EXPENSE_OVERALLOCATED, http_status: 422, applies_to: "POST /expenses/{id}/allocations" }
  - { priority: 10, category: business_fiscal, check: "allocation would push BudgetLine.expended_cents above adjusted_cents", error_id: ERR_BUDGET_LINE_EXCEEDED, http_status: 422, applies_to: "POST /expenses/{id}/allocations" }
  - { priority: 10, category: business_fiscal, check: "allocation would push Fund.expended_cents above allocated_cents", error_id: ERR_FUND_EXCEEDED, http_status: 422, applies_to: "POST /expenses/{id}/allocations" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/funders", description: "Create a funder", roles: [SystemAdmin], code: 201, input: [name, funder_type, contact_email, "requires_match?"], output: Funder, side_effects: [] }
  - { method: GET, path: "/funders/{id}", description: "Get a funder", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: [], output: Funder, side_effects: [] }

  - { method: POST, path: "/grants", description: "Create a grant (status DRAFT); original_end_date snapshot taken", roles: [GrantsOfficer], code: 201, input: [funder_id, award_number, title, award_amount_cents, start_date, end_date, reporting_frequency, "interim_report_due_days?", "final_report_due_days?", "variance_threshold_pct?", "indirect_rate_pct?", "indirect_cap_cents?", "renewal_window_days?", "required_match_cents?"], output: Grant, side_effects: [] }
  - { method: GET, path: "/grants", description: "List grants, optional filters", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: ["funder_id?", "status?", "limit?", "offset?"], output: "Grant[]", side_effects: [] }
  - { method: GET, path: "/grants/{id}", description: "Get a grant", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: [], output: Grant, side_effects: [] }
  - { method: GET, path: "/grants/{id}/summary", description: "Computed read: BvA rows (period_only + cumulative per line), indirect pool, match progress (both variants), burn projections (both variants), pacing ratio", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: [], output: { grant_id: string, status: string, total_expended_cents: integer, indirect_pool_cents: integer, match_verified_only_cents: integer, match_pledged_inclusive_cents: integer, match_verified_only_pct: number, match_pledged_inclusive_pct: number, burn_trailing_cents: integer, burn_cumulative_cents: integer, pacing_ratio: number, bva: array }, side_effects: [] }
  - { method: POST, path: "/grants/{id}/activate", description: "Activate grant; generates Report calendar and recomputes period budgets", roles: [ProgramDirector], code: 200, input: [], output: Grant, side_effects: ["creates Report rows (SCHEDULED) per reporting_frequency over [start_date, end_date]", "recomputes BudgetLine.period_budgets_cents"] }
  - { method: POST, path: "/grants/{id}/closeout", description: "Move CLOSEOUT grant to CLOSED", roles: [ProgramDirector], code: 200, input: [], output: Grant, side_effects: [] }

  - { method: POST, path: "/grants/{id}/budget-lines", description: "Add a budget line (grant must be DRAFT)", roles: [GrantsOfficer], code: 201, input: [category, budgeted_cents], output: BudgetLine, side_effects: [] }
  - { method: GET, path: "/grants/{id}/budget-lines", description: "List budget lines of a grant (includes computed adjusted/expended/period budgets)", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: ["limit?", "offset?"], output: "BudgetLine[]", side_effects: [] }
  - { method: GET, path: "/budget-lines/{id}", description: "Get one budget line", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: [], output: BudgetLine, side_effects: [] }
  - { method: GET, path: "/budget-lines/{id}/variance-explanations", description: "List variance explanations recorded against this budget line (across reports)", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: ["limit?", "offset?"], output: "VarianceExplanation[]", side_effects: [] }

  - { method: POST, path: "/grants/{id}/funds", description: "Create a fund (grant must be DRAFT)", roles: [FinanceManager], code: 201, input: [fund_type, allocated_cents, "purpose_restriction?", "allowed_categories?"], output: Fund, side_effects: [] }
  - { method: GET, path: "/grants/{id}/funds", description: "List funds of a grant", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: ["limit?", "offset?"], output: "Fund[]", side_effects: [] }

  - { method: POST, path: "/grants/{id}/expenses", description: "Create an expense (grant must be ACTIVE, not SUSPENDED)", roles: [GrantsOfficer], code: 201, input: [expense_date, vendor, description, amount_cents], output: Expense, side_effects: [] }
  - { method: GET, path: "/grants/{id}/expenses", description: "List expenses of a grant", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "Expense[]", side_effects: [] }
  - { method: GET, path: "/expenses/{id}", description: "Get an expense (includes unallocated_cents)", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: [], output: Expense, side_effects: [] }
  - { method: POST, path: "/expenses/{id}/post", description: "Post a DRAFT expense (poster != creator)", roles: [FinanceManager], code: 200, input: [], output: Expense, side_effects: ["posted_by_user_id set"] }
  - { method: POST, path: "/expenses/{id}/void", description: "Void a POSTED expense; cascades allocations to VOIDED and reconciles line/fund/grant totals", roles: [FinanceManager], code: 200, input: [], output: Expense, side_effects: ["ExpenseAllocation ACTIVE -> VOIDED", "BudgetLine.expended_cents decremented", "Fund.expended_cents decremented", "Grant.total_expended_cents recomputed"] }
  - { method: POST, path: "/expenses/{id}/allocations", description: "Allocate part of a POSTED expense to a budget line and fund", roles: [GrantsOfficer], code: 201, input: [budget_line_id, fund_id, amount_cents], output: ExpenseAllocation, side_effects: ["BudgetLine.expended_cents incremented", "Fund.expended_cents incremented", "Grant.total_expended_cents recomputed", "Expense.unallocated_cents recomputed"] }
  - { method: GET, path: "/allocations", description: "Filtered list of allocations (multi-FK reverse reachability)", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Auditor], code: 200, input: ["expense_id?", "budget_line_id?", "fund_id?", "limit?", "offset?"], output: "ExpenseAllocation[]", side_effects: [] }
  - { method: GET, path: "/allocations/{id}", description: "Get one allocation", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Auditor], code: 200, input: [], output: ExpenseAllocation, side_effects: [] }

  - { method: GET, path: "/grants/{id}/reports", description: "The reporting calendar: list Report rows of a grant ordered by period_index ASC", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "Report[]", side_effects: [] }
  - { method: GET, path: "/reports/{id}", description: "Get a report", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: [], output: Report, side_effects: [] }
  - { method: PUT, path: "/reports/{id}", description: "Edit narrative_draft and/or outcome_entries (report DRAFT, not frozen)", roles: [GrantsOfficer], code: 200, input: ["narrative_draft?", "outcome_entries?"], output: Report, side_effects: ["prepared_by_user_id set"] }
  - { method: POST, path: "/reports/{id}/start", description: "Open a SCHEDULED report for drafting (period must have started)", roles: [GrantsOfficer], code: 200, input: [], output: Report, side_effects: [] }
  - { method: POST, path: "/reports/{id}/submit", description: "Submit report to funder; enforces variance-explanation, outcome-data, and FINAL match gates", roles: [GrantsOfficer], code: 200, input: [], output: Report, side_effects: ["submitted_at, submitted_late set", "VarianceExplanation DRAFTED -> SUBMITTED"] }
  - { method: POST, path: "/reports/{id}/start-review", description: "Funder begins review", roles: [Funder], code: 200, input: [], output: Report, side_effects: [] }
  - { method: POST, path: "/reports/{id}/accept", description: "Funder accepts; FINAL acceptance moves grant to CLOSEOUT", roles: [Funder], code: 200, input: [], output: Report, side_effects: ["if period_type == FINAL: Grant ACTIVE -> CLOSEOUT"] }
  - { method: POST, path: "/reports/{id}/return", description: "Funder returns report for revision", roles: [Funder], code: 200, input: [returned_reason], output: Report, side_effects: ["VarianceExplanation SUBMITTED -> DRAFTED"] }
  - { method: POST, path: "/reports/{id}/revise", description: "Reopen a RETURNED report for editing (revision loop)", roles: [GrantsOfficer], code: 200, input: [], output: Report, side_effects: ["revision_count += 1"] }
  - { method: POST, path: "/reports/{id}/variance-explanations", description: "Create/refresh the variance explanation for a budget line on this report", roles: [GrantsOfficer], code: 201, input: [budget_line_id, explanation_text], output: VarianceExplanation, side_effects: ["period_variance_pct_snapshot computed"] }
  - { method: GET, path: "/reports/{id}/variance-explanations", description: "List variance explanations of a report", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: ["limit?", "offset?"], output: "VarianceExplanation[]", side_effects: [] }

  - { method: POST, path: "/grants/{id}/match-contributions", description: "Record a match/in-kind contribution (grant ACTIVE)", roles: [GrantsOfficer], code: 201, input: [contribution_type, source_name, valuation_basis, "documented_value_cents?", "volunteer_hours?"], output: MatchContribution, side_effects: ["recognized_value_cents computed"] }
  - { method: GET, path: "/grants/{id}/match-contributions", description: "List match contributions of a grant", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "MatchContribution[]", side_effects: [] }
  - { method: POST, path: "/match-contributions/{id}/document", description: "Attach documentation (PLEDGED -> DOCUMENTED)", roles: [GrantsOfficer], code: 200, input: [documentation_ref], output: MatchContribution, side_effects: ["documented_by_user_id set"] }
  - { method: POST, path: "/match-contributions/{id}/verify", description: "Verify a DOCUMENTED contribution (verifier != documenter)", roles: [FinanceManager], code: 200, input: [], output: MatchContribution, side_effects: ["verified_by_user_id set"] }

  - { method: POST, path: "/grants/{id}/modification-requests", description: "Draft a no-cost extension or budget reallocation request", roles: [GrantsOfficer], code: 201, input: [request_type, justification, "requested_end_date?", "line_deltas?"], output: ModificationRequest, side_effects: [] }
  - { method: GET, path: "/grants/{id}/modification-requests", description: "List modification requests of a grant", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: ["status?", "limit?", "offset?"], output: "ModificationRequest[]", side_effects: [] }
  - { method: POST, path: "/modification-requests/{id}/submit", description: "Submit draft to funder (validates type-specific rules)", roles: [ProgramDirector], code: 200, input: [], output: ModificationRequest, side_effects: [] }
  - { method: POST, path: "/modification-requests/{id}/approve", description: "Funder approves (OCC on grant version); applies extension or reallocation side effects; increments Grant.version by 1", roles: [Funder], code: 200, input: [expected_grant_version], output: ModificationRequest, side_effects: ["increments Grant.version by 1", "NCE: grant.end_date extended and Report calendar regenerated", "REALLOCATION: BudgetLine.adjusted_cents updated and period budgets recomputed"] }
  - { method: POST, path: "/modification-requests/{id}/deny", description: "Funder denies", roles: [Funder], code: 200, input: ["denial_reason?"], output: ModificationRequest, side_effects: [] }
  - { method: POST, path: "/modification-requests/{id}/withdraw", description: "Withdraw a DRAFT or SUBMITTED request", roles: [GrantsOfficer], code: 200, input: [], output: ModificationRequest, side_effects: [] }

  - { method: POST, path: "/grants/{id}/audit-engagements", description: "Schedule an audit engagement or site visit (grant ACTIVE); overlap + auditor-capacity checks", roles: [ProgramDirector], code: 201, input: [engagement_type, auditor_org, scheduled_start, scheduled_end], output: AuditEngagement, side_effects: [] }
  - { method: GET, path: "/grants/{id}/audit-engagements", description: "List engagements of a grant", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: ["limit?", "offset?"], output: "AuditEngagement[]", side_effects: [] }
  - { method: GET, path: "/audit-engagements/{id}", description: "Get an engagement", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: [], output: AuditEngagement, side_effects: [] }
  - { method: POST, path: "/audit-engagements/{id}/advance", description: "Advance engagement one step: SCHEDULED -> PREPARATION -> READY -> CONDUCTED -> FINDINGS_ISSUED -> CLOSED", roles: [Auditor], code: 200, input: [], output: AuditEngagement, side_effects: [] }
  - { method: POST, path: "/audit-engagements/{id}/findings", description: "File a finding (engagement CONDUCTED or FINDINGS_ISSUED); MATERIAL_WEAKNESS suspends the grant", roles: [Auditor], code: 201, input: [severity, description], output: AuditFinding, side_effects: ["if severity == MATERIAL_WEAKNESS and grant ACTIVE: Grant -> SUSPENDED with report-freeze cascade"] }
  - { method: GET, path: "/audit-engagements/{id}/findings", description: "List findings of an engagement", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: ["limit?", "offset?"], output: "AuditFinding[]", side_effects: [] }
  - { method: POST, path: "/audit-findings/{id}/respond", description: "Grantee responds to an OPEN finding", roles: [GrantsOfficer], code: 200, input: [response_text], output: AuditFinding, side_effects: [] }
  - { method: POST, path: "/audit-findings/{id}/resolve", description: "Auditor accepts response; last MATERIAL_WEAKNESS resolution reactivates the grant", roles: [Auditor], code: 200, input: [], output: AuditFinding, side_effects: ["if last open MATERIAL_WEAKNESS on grant: Grant SUSPENDED -> ACTIVE with unfreeze cascade"] }
  - { method: POST, path: "/audit-findings/{id}/reopen", description: "Auditor rejects a response (RESPONSE_SUBMITTED -> OPEN)", roles: [Auditor], code: 200, input: [], output: AuditFinding, side_effects: [] }

  - { method: POST, path: "/grants/{id}/renewal-applications", description: "Create the renewal application for a grant (at most one per grant); windows computed from end_date", roles: [GrantsOfficer], code: 201, input: [], output: RenewalApplication, side_effects: ["window_open/window_close computed"] }
  - { method: GET, path: "/grants/{id}/renewal-applications", description: "List renewal applications of a grant (0 or 1 element)", roles: [SystemAdmin, GrantsOfficer, FinanceManager, ProgramDirector, Funder, Auditor], code: 200, input: [], output: "RenewalApplication[]", side_effects: [] }
  - { method: POST, path: "/renewal-applications/{id}/submit", description: "Submit renewal (window must be open: status ELIGIBLE)", roles: [ProgramDirector], code: 200, input: [], output: RenewalApplication, side_effects: ["submitted_at set"] }
  - { method: POST, path: "/renewal-applications/{id}/decide", description: "Funder decides renewal", roles: [Funder], code: 200, input: [decision], output: RenewalApplication, side_effects: [] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Server startup default is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock. Setting the clock fires time-based auto-transitions (renewal NOT_OPEN->ELIGIBLE, ELIGIBLE->LAPSED).", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["time-based auto-transitions"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not allowed for endpoint, or Funder acting on another funder's grant" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "same X-User-ID attempts both halves of a segregated pair (expense create/post, match document/verify)" }
  - { id: ERR_VALIDATION, http: 400, condition: "missing required field, bad enum value, malformed date, non-positive amount, cross-grant reference" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "generic state-machine rejection: trigger not valid from current state; also terminal-state lockdown, period not yet started, duplicate renewal application" }
  - { id: ERR_GRANT_NOT_ACTIVE, http: 409, condition: "operation requires grant ACTIVE but grant is DRAFT/CLOSEOUT/CLOSED" }
  - { id: ERR_GRANT_SUSPENDED, http: 409, condition: "operation blocked while grant is SUSPENDED" }
  - { id: ERR_REPORT_NOT_EDITABLE, http: 409, condition: "report not in DRAFT, or frozen, for edit/explanation operations" }
  - { id: ERR_EXPENSE_NOT_POSTED, http: 409, condition: "allocation attempted on an expense not in POSTED" }
  - { id: ERR_MODIFICATION_NOT_PENDING, http: 409, condition: "approve/deny on a request not SUBMITTED; withdraw on a terminal request" }
  - { id: ERR_FINDING_NOT_OPEN, http: 409, condition: "respond on non-OPEN finding; resolve/reopen on non-RESPONSE_SUBMITTED finding" }
  - { id: ERR_EXPENSE_LOCKED_BY_REPORT, http: 409, condition: "void blocked because an allocation's period report is SUBMITTED/UNDER_REVIEW/ACCEPTED" }
  - { id: ERR_DUPLICATE_AWARD_NUMBER, http: 409, condition: "award_number already used for this funder" }
  - { id: ERR_ENGAGEMENT_OVERLAP, http: 409, condition: "engagement window overlaps another non-CLOSED engagement on the same grant (half-open intervals; adjacency allowed)" }
  - { id: ERR_AUDITOR_CAPACITY, http: 409, condition: "auditor_org would exceed 2 mutually-overlapping active engagements" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_grant_version does not match grant.version (OCC)" }
  - { id: ERR_REALLOCATION_NOT_BALANCED, http: 422, condition: "BUDGET_REALLOCATION line_deltas do not sum to zero" }
  - { id: ERR_REALLOCATION_BELOW_EXPENDED, http: 422, condition: "reallocation would push a line's adjusted_cents below its expended_cents" }
  - { id: ERR_EXTENSION_NOT_FORWARD, http: 422, condition: "NO_COST_EXTENSION requested_end_date not strictly after current end_date" }
  - { id: ERR_RESTRICTION_VIOLATION, http: 422, condition: "RESTRICTED fund's allowed_categories does not include the budget line's category" }
  - { id: ERR_BUDGET_LINE_EXCEEDED, http: 422, condition: "allocation would push line expended above adjusted_cents" }
  - { id: ERR_FUND_EXCEEDED, http: 422, condition: "allocation would push fund expended above allocated_cents" }
  - { id: ERR_EXPENSE_OVERALLOCATED, http: 422, condition: "allocation amount exceeds expense.unallocated_cents" }
  - { id: ERR_VARIANCE_EXPLANATION_REQUIRED, http: 422, condition: "submit blocked: a line breaching variance_threshold_pct lacks an explanation" }
  - { id: ERR_OUTCOME_DATA_REQUIRED, http: 422, condition: "submit blocked: empty narrative_draft or empty outcome_entries" }
  - { id: ERR_MATCH_SHORTFALL, http: 422, condition: "FINAL submit blocked: verified match below required_match_cents" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 409, condition: "renewal submit before window_open (status NOT_OPEN)" }
  - { id: ERR_RENEWAL_WINDOW_LAPSED, http: 409, condition: "renewal submit after window_close (status LAPSED)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GrantsOfficer
    description: "Grants management office staff: builds grant structure, drafts reports, allocates expenses, documents match, drafts modification requests, responds to findings"
    identity: opaque
    exclusive_operations:
      - "POST /grants; POST /grants/{id}/budget-lines; POST /grants/{id}/expenses"
      - "POST /expenses/{id}/allocations"
      - "PUT /reports/{id}; POST /reports/{id}/start; POST /reports/{id}/submit; POST /reports/{id}/revise; POST /reports/{id}/variance-explanations"
      - "POST /grants/{id}/match-contributions; POST /match-contributions/{id}/document"
      - "POST /grants/{id}/modification-requests; POST /modification-requests/{id}/withdraw"
      - "POST /audit-findings/{id}/respond"
      - "POST /grants/{id}/renewal-applications"
    shared_operations: ["all GET list/detail endpoints"]
  - name: FinanceManager
    description: "Finance staff: creates funds, posts/voids expenses, verifies match; segregated from expense creation and match documentation"
    identity: opaque
    exclusive_operations:
      - "POST /grants/{id}/funds"
      - "POST /expenses/{id}/post; POST /expenses/{id}/void"
      - "POST /match-contributions/{id}/verify"
    shared_operations: ["all GET list/detail endpoints"]
  - name: ProgramDirector
    description: "Program leadership: activates/closes grants, submits modification and renewal requests, schedules audit engagements"
    identity: opaque
    exclusive_operations:
      - "POST /grants/{id}/activate; POST /grants/{id}/closeout"
      - "POST /modification-requests/{id}/submit"
      - "POST /renewal-applications/{id}/submit"
      - "POST /grants/{id}/audit-engagements"
    shared_operations: ["all GET list/detail endpoints"]
  - name: Funder
    description: "Funder-side reviewer: reviews/accepts/returns reports, approves/denies modifications, decides renewals; scoped to own grants (X-User-ID == Funder.id == grant.funder_id)"
    identity: entity_backed:Funder
    exclusive_operations:
      - "POST /reports/{id}/start-review; POST /reports/{id}/accept; POST /reports/{id}/return"
      - "POST /modification-requests/{id}/approve; POST /modification-requests/{id}/deny"
      - "POST /renewal-applications/{id}/decide"
    shared_operations: ["all GET list/detail endpoints"]
  - name: Auditor
    description: "External auditor: advances engagements, files findings, resolves/reopens responses"
    identity: opaque
    exclusive_operations:
      - "POST /audit-engagements/{id}/advance; POST /audit-engagements/{id}/findings"
      - "POST /audit-findings/{id}/resolve; POST /audit-findings/{id}/reopen"
    shared_operations: ["all GET list/detail endpoints"]
  - name: SystemAdmin
    description: "Platform operator: registers funders and drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /funders"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET list/detail endpoints"]
