  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: foreign_cost_center_leg_outranks_unbalanced_reclassification
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - entities.WorkpaperEntry.fields.legs
          - entities.CostCenter.fields.reclassified_amount_cents
        distinguishing_aspect: |
          Category pair business_referential (priority 11, ERR_COST_CENTER_FOREIGN_TO_REPORT) versus
          business_constraint (priority 13, ERR_RECLASS_NOT_BALANCED): one request violates both and
          must return the referential error, so a scaffold that checks the net-zero arithmetic before
          resolving the leg targets fails this instance.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with TWO DRAFT cost reports: report A for FY 2025-07-01..2026-06-30 and report B for FY 2024-07-01..2025-06-30"
            - "report A has cost centers 00100 (GENERAL_SERVICE) and 03000 (ROUTINE); report B has its own cost center 00100"
            - "report A has no workpaper entries yet, so every cost center's reclassified_amount_cents == 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_a: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2024-07-01", fiscal_year_end: "2025-06-30", total_charges_cents: 380000000, medicare_discharges: 480 }
              as: SystemAdmin
              captures: { report_b: $.data.id }
            - call: "POST /cost-reports/${report_a}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_a_ag: $.data.id }
            - call: "POST /cost-reports/${report_a}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_a_routine: $.data.id }
            - call: "POST /cost-reports/${report_b}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_b_ag: $.data.id }
          trigger:
            - call: "POST /cost-reports/${report_a}/workpaper-entries"
              payload: { entry_type: "RECLASSIFICATION", code: "A6-1", description: "Reclassify administration to nursing", legs: [ { cost_center_id: "${cc_a_ag}", amount_cents: -10000000 }, { cost_center_id: "${cc_b_ag}", amount_cents: 15000000 } ] }
              as: ReimbursementAnalyst
          assert:
            - "HTTP status is 422 and $.data.error_id == 'ERR_COST_CENTER_FOREIGN_TO_REPORT'"
            - "$.data.error_id is NOT 'ERR_RECLASS_NOT_BALANCED', even though the two legs sum to 5000000 and therefore also violate the priority-13 net-zero rule"
            - "GET /cost-reports/${report_a}/workpaper-entries returns total_count == 0"
            - "CostCenter.${cc_a_ag}.reclassified_amount_cents == 0 and post_reclass_direct_cost_cents == 0"
            - "CostCenter.${cc_b_ag}.reclassified_amount_cents == 0"
            - "CostReport.${report_a}.allocation_status == NOT_RUN (no cascade ran)"

      - name: filing_deadline_outranks_unmapped_trial_balance_on_file
        grounds:
          - validations[priority=10]
          - validations[priority=13]
          - calculations.filing_deadline_computation
          - state_machines.CostReport.DRAFT_to_FILED
          - entities.CostReport.fields.filing_deadline
        distinguishing_aspect: |
          A different category pair on a different endpoint: business_compliance (priority 10,
          ERR_FILING_DEADLINE_PASSED) versus business_constraint (priority 13,
          ERR_UNMAPPED_TRIAL_BALANCE and ERR_ALLOCATION_NOT_CURRENT) — three rules are violated by one
          POST /file and the compliance error must win over both constraint errors.
        test_recipe:
          setup:
            - "Provider 450123 with a DRAFT CostReport for FY 2025-07-01..2026-06-30, so filing_deadline == 2026-11-30"
            - "one UNMAPPED trial balance line of 1000000 cents and no stepdown run, so unmapped_tb_total_cents == 1000000 and allocation_status == NOT_RUN"
            - "the logical clock is then advanced to 2026-12-01T00:00:00Z, one day past the deadline"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6900", description: "Unassigned suspense account", amount_cents: 1000000 }
              as: ReimbursementAnalyst
              captures: { tb_orphan: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cost-reports/${report_id}/file"
              payload: {}
              as: ReimbursementManager
          assert:
            - "HTTP status is 422 and $.data.error_id == 'ERR_FILING_DEADLINE_PASSED'"
            - "$.data.error_id is NOT 'ERR_UNMAPPED_TRIAL_BALANCE' and NOT 'ERR_ALLOCATION_NOT_CURRENT', both of which are also violated at priority 13"
            - "CostReport.${report_id}.filing_deadline == '2026-11-30'"
            - "CostReport.${report_id}.unmapped_tb_total_cents == 1000000 and allocation_status == 'NOT_RUN'"
            - "CostReport.${report_id}.status == 'DRAFT' and filed_at == null"
            - "TrialBalanceLine.${tb_orphan}.status == 'UNMAPPED' and mapped_cost_center_id == null"

  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: dsh_patient_percentage_exactly_at_eligibility_threshold
        grounds:
          - calculations.dsh_and_ucc_compilation
          - entities.UccDataSet.fields.dsh_patient_percentage
          - entities.UccDataSet.fields.dsh_eligible
        distinguishing_aspect: |
          Boundary on the DSH patient percentage metric at POST /cost-reports/{id}/ucc-data-sets:
          7495/100000 twice rounds to 0.0750 + 0.0750 == 0.1500, exactly the 0.1500 threshold, so
          dsh_eligible is true; summing the raw quotients first (0.07495 + 0.07495 = 0.1499) would
          land one 4-dp tick below and flip eligibility.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport for FY 2025-07-01..2026-06-30, total_charges_cents 400000000"
            - "no cost centers and no stepdown run, so CostReport.cost_to_charge_ratio == 0.000000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /cost-reports/${report_id}/ucc-data-sets"
              payload: { medicaid_non_medicare_days: 7495, total_inpatient_days: 100000, ssi_days: 7495, medicare_part_a_days: 100000, charity_care_charges_cents: 40000000, non_medicare_bad_debt_cents: 10000000 }
              as: ReimbursementAnalyst
              captures: { ucc_id: $.data.id }
          assert:
            - "UccDataSet.${ucc_id}.medicaid_fraction == 0.0750"
            - "UccDataSet.${ucc_id}.ssi_fraction == 0.0750"
            - "UccDataSet.${ucc_id}.dsh_patient_percentage == 0.1500"
            - "UccDataSet.${ucc_id}.dsh_patient_percentage is NOT 0.1499 — 0.1499 is the value produced by summing the unrounded quotients"
            - "UccDataSet.${ucc_id}.dsh_eligible == true (the comparison is >=, so the exact threshold qualifies)"
            - "UccDataSet.${ucc_id}.cost_to_charge_ratio == 0.000000"
            - "UccDataSet.${ucc_id}.uncompensated_care_cost_cents == 6500000 (0 charity cost at a zero ratio plus 10000000 * 0.65)"
            - "UccDataSet.${ucc_id}.ucc_payment_cents == 1300000"

      - name: stepdown_zero_statistic_basis_returns_residual_without_dividing
        grounds:
          - calculations.stepdown_allocation
          - entities.StepdownRun.fields.residual_unallocated_cents
          - entities.CostCenter.fields.allocated_out_cents
          - endpoints[POST /cost-reports/{id}/stepdown-runs]
        distinguishing_aspect: |
          A different metric (the allocation basis denominator W, not a percentage) on a different
          endpoint (POST /cost-reports/{id}/stepdown-runs): every eligible receiver's MEALS_SERVED
          weight is 0, so the eligible set is empty, W is never formed, the run still COMPLETEs with
