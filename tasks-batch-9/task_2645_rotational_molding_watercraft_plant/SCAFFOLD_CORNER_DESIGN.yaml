              payload: { trim_waste_kg: 0.400 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu_b}/outfit"
              payload: { hardware_kit_serial: "HK-CVD2-B" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu_b}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
          assert:
            - "MoldingCycle.${cyc_a}.provisional_warpage_index == 1.691 — thermal round(88/40,3) = 2.200, cooling round(max(0, 30-10)/30, 3) = 0.667, rotation round(abs(3.000-4.000)/4.000, 3) = 0.250, so base = round(0.40*2.200 + 0.35*0.667 + 0.25*0.250, 3) = round(1.17595, 3) = 1.176 and the product 1.176 * 1.150 * 1.250 = 1.690500 rounds HALF_UP to 1.691"
            - "FinishedUnit.${fu_a}.wall_cv_pct == 12.09 (mean 10.000, population sd about the rounded mean 1.209) and final_warpage_index == 1.361 — actual_cooling_minutes 35 zeroes the cooling term, the distribution term is round((12.09-12.00)/10, 3) = 0.009, base = round(0.880 + 0.0625 + 0.0045, 3) = 0.947 and 0.947 * 1.4375 = 1.36131250 rounds to 1.361"
            - "FinishedUnit.${fu_a}.inspection_verdict == REWORK and rework_count == 1 — clause 5 (wall_cv_pct 12.09 > 12.00) fires before clause 6, and hardware_kit_serial is cleared to null"
            - "the cooling term and the distribution term can never be non-zero on the same evaluation: the cooling term needs cooling minutes below the minimum, which only the PROVISIONAL variant can see because demold rejects such a cycle, and the distribution term only exists at inspection"
            - "MoldingCycle.${cyc_b}.provisional_warpage_index == 5.000 — rotation ratio round(45.60/1.00, 3) = 45.600 gives round(41.600/4.000, 3) = 10.400, base = round(0.880 + 2.600, 3) = 3.480, the UNROUNDED product 3.480 * 1.150 * 1.250 = 5.00250000 exceeds WARPAGE_INDEX_CEILING so min() returns 5.000 exactly; rounding first would report 5.003"
            - "FinishedUnit.${fu_b}.final_warpage_index == 5.000 and inspection_verdict == SCRAP — 5.000 > WARPAGE_SCRAP_THRESHOLD 2.500 so clause 4 fires even though the wall statistics (mean 6.000, cv 1.08) are perfect"
            - "ProductionOrder.${po}.status == IN_PRODUCTION with completed_qty == 0 and scrapped_qty == 1 — the REWORK unit counts as neither"

      - name: calc_threshold_inspection_verdict_at_and_above_the_scrap_threshold
        claim_type: threshold
        grounds:
          - calculations.inspection_verdict
          - calculations.inspection_verdict.constants.WARPAGE_SCRAP_THRESHOLD
          - state_machines.FinishedUnit.build_status
        distinguishing_aspect: "One hull is inspected twice on the same cycle: a final_warpage_index of exactly 2.500 yields REWORK because clause 4 uses strict greater-than, and a re-inspection whose wall CV pushes the same index to 2.505 yields SCRAP — the boundary is crossed by five thousandths and by nothing else."
