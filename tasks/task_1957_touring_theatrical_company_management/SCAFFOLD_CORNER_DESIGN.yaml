      - name: daily_cap_third_show_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DAILY_SHOW_CAP]"]
        distinguishing_aspect: "Two same-day shows with exact-gap timing are legal; the third same-day show is rejected even though the weekly count (3) is under the cap of 8."
        test_recipe:
