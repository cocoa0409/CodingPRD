  # 4. VALIDATIONS
  # =====================================================================
  - section: validations
    instances:

      - name: request_body_violations_return_invalid_request
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.Field.fields.soil_group
          - entities.DataPacket.fields.coverage_pct
        distinguishing_aspect: "Seven distinct body defects — missing required field, unknown enum member, degenerate rectangle, negative acreage, percentage above 100, crop_year outside [2000, 2100] and an instant without the trailing Z — all collapse to ERR_INVALID_REQUEST (422) and none of them creates a row."
        test_recipe:
          setup:
            - "one ACTIVE grower, one MAPPED 1000.00-acre field, one ACTIVE COVER_CROP standard v1, and one DRAFT enrollment reachable for the packet leg"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /practice-standards"
              payload: { practice_code: "COVER_CROP", standard_version: 1, additionality_lookback_years: 5, max_prior_adoption_pct: 20.00, min_documented_years: 4, min_adoption_years: 3, uncertainty_base_pct: 15.00, sequestration_rate_per_acre: 0.3500, modeled_baseline_rate_per_acre: 0.2000, buffer_base_pct: 10.00, telemetry_required: false, effective_from: "2020-01-01" }
              as: ProgramAdmin
              captures: { std_id: $.data.id }
            - call: "POST /growers"
              payload: { legal_name: "Malformed Input Farms", operator_type: "LLC", tax_id: "TX-3001-A", mailing_state: "IA" }
              as: ProgramAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "Body 1", boundary_min_x: 0, boundary_min_y: 0, boundary_max_x: 2000, boundary_max_y: 2000, gross_acres: 1000.00, soil_group: "LOAM" }
              as: ProgramAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /fields/${f1_id}/map-confirm"
              payload: { surveyor_reference: "SUR-B1" }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { field_id: "${f1_id}", practice_standard_id: "${std_id}", commitment_years: 5, start_crop_year: 2026, enrolled_acres: 1000.00, payment_model: "PER_CREDIT", per_credit_share_pct: 60.00 }
              as: ProgramAdmin
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /growers"
              payload: { legal_name: "No Tax Id Farms", operator_type: "LLC", mailing_state: "IA" }
              as: ProgramAdmin
              captures: { e_missing: $.data.error_id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "Bad Soil", boundary_min_x: 4000, boundary_min_y: 4000, boundary_max_x: 5000, boundary_max_y: 5000, gross_acres: 250.00, soil_group: "MARS_REGOLITH" }
              as: ProgramAdmin
              captures: { e_enum: $.data.error_id }
            - call: "POST /growers/${g1_id}/fields"
              payload: { field_name: "Degenerate", boundary_min_x: 6000, boundary_min_y: 6000, boundary_max_x: 6000, boundary_max_y: 7000, gross_acres: 10.00, soil_group: "LOAM" }
              as: ProgramAdmin
              captures: { e_rect: $.data.error_id }
            - call: "POST /enrollments"
              payload: { field_id: "${f1_id}", practice_standard_id: "${std_id}", commitment_years: 5, start_crop_year: 2026, enrolled_acres: -1.00, payment_model: "PER_CREDIT", per_credit_share_pct: 60.00 }
              as: ProgramAdmin
              captures: { e_negative: $.data.error_id }
            - call: "POST /enrollments/${e1_id}/data-packets"
              payload: { crop_year: 2026, source: "FARM_RECORD", reported_acres: 1000.00, coverage_pct: 120.00 }
              as: ProgramAdmin
              captures: { e_pct: $.data.error_id }
            - call: "POST /fields/${f1_id}/practice-history"
              payload: { crop_year: 1999, practice_code: "COVER_CROP", adopted: true, evidence_source: "FARM_RECORD", acres: 100.00 }
              as: ProgramAdmin
              captures: { e_year: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01" }
              as: ProgramAdmin
              captures: { e_instant: $.data.error_id }
            - call: "GET /fields"
              payload: { grower_id: "${g1_id}" }
              as: ProgramAdmin
          assert:
            - "all seven triggers return HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "the missing-field leg is rejected for the absent tax_id even though every other required Grower field is present"
            - "the degenerate-rectangle leg is rejected by priority 5 (boundary_max_x == boundary_min_x) rather than being accepted with mapped_acres 0.00"
            - "the coverage_pct 120.00 leg is rejected before any qc_score is computed — no DataPacket row is created"
            - "the closing list returns total_count == 1 with data[0].id == ${f1_id} — none of the three rejected field creates persisted"
            - "GET /enrollments?field_id=${f1_id} still returns total_count == 1 and GET /practice-history?field_id=${f1_id} returns total_count == 0"

      - name: commitment_terms_bounds_are_enforced_with_inclusive_acreage_equality
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_COMMITMENT_TERMS_INVALID]
          - entities.Field.fields.mapped_acres
        distinguishing_aspect: "commitment_years below the standard's min_adoption_years (2 < 3), above MAX_COMMITMENT_YEARS (13 > 12), enrolled_acres above mapped_acres (1500.00 > 1000.00) and enrolled_acres == 0 all fail with the SAME error id, while enrolled_acres exactly equal to mapped_acres and commitment_years exactly 3 succeed — both bounds are inclusive."
        test_recipe:
          setup:
            - "one ACTIVE grower with one MAPPED field of exactly 1000.00 acres; one ACTIVE COVER_CROP standard v1 with min_adoption_years 3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
