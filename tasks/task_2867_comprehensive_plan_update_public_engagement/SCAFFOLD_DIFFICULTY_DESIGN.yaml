# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Task: 2867 Comprehensive Plan Update & Public Engagement
# Companion to SCAFFOLD.yaml (§1.1-§1.7). Every instance below grounds in an
# element already declared there; deleting this file would not change one word
# of the declared contract.
#
# Reference fixture (used by most instances, all literals pre-computed):
#   PlanUpdate            base_year 2025, horizon_year 2045
#   LAND_USE inventory    vacant 400, underutilized 250, infra_constrained 60,
#                         allowed_density 18 u/ac
#     -> GROSS_CAPACITY   (400 + 250) * 18                       = 11700
#     -> NET_CAPACITY     ((400-60) + 250*0.50) * 18 * 0.85
#                         = 465 * 15.3 = 7114.5 -> half-up       = 7115
#   Scenario inputs       base_households 60000, growth 0.008/yr, 20 years,
#                         job_growth_total 31000, demolition_replacement 1200
#     -> household_growth 10365.8426088288...  (never rounded early)
#     -> job_driven       31000 / 1.45 = 21379.3103448...
#     -> TREND  demand    (10365.8426... + 1200) * 1.05 -> 12144
#     -> POLICY demand    (21379.3103... + 1200) * 1.05 -> 23708
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: land_capacity_gross_vs_net_variant_divergence
        grounds:
          - calculations.land_capacity_units
          - entities.GrowthScenario.fields.capacity_variant
          - entities.GrowthScenario.fields.land_capacity_units
          - entities.InventoryDataset.fields.infrastructure_constrained_acres
        distinguishing_aspect: |
          This dual variant lives in the land-supply domain (GrowthScenario reading a LAND_USE
          InventoryDataset): one and the same certified acreage row yields land_capacity_units
          11700 under GROSS_CAPACITY (method TREND) and 7115 under NET_CAPACITY (method POLICY),
          a delta of 4585 units driven by infrastructure exclusion, the 0.50 realization factor
          and the 0.85 market factor.
        test_recipe:
          setup:
            - "One PlanUpdate in DRAFTING with base_year 2025 and horizon_year 2045."
            - "One CERTIFIED LAND_USE InventoryDataset with vacant 400 ac, underutilized 250 ac, infrastructure-constrained 60 ac, allowed density 18 u/ac."
            - "Its version is re-read from the API before each scenario write because scenario creation bumps referencing_scenario_count."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "LAND_USE", vintage_year: 2025, vacant_acres: 400, underutilized_acres: 250, infrastructure_constrained_acres: 60, allowed_density_units_per_acre: 18 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_land: $.data.id }
            - call: "POST /planning/inventory-datasets/${inv_land}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { land_v1: $.data.version }
          trigger:
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${inv_land}", expected_inventory_version: "${land_v1}", label: "Trend 2045", method: "TREND", horizon_year: 2045, base_households: 60000, annual_household_growth_rate: 0.008, job_growth_total: 31000, demolition_replacement_units: 1200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc_trend: $.data.id, cap_trend: $.data.land_capacity_units }
            - call: "GET /planning/inventory-datasets/${inv_land}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { land_v2: $.data.version }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${inv_land}", expected_inventory_version: "${land_v2}", label: "Policy 2045", method: "POLICY", horizon_year: 2045, base_households: 60000, annual_household_growth_rate: 0.008, job_growth_total: 31000, demolition_replacement_units: 1200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc_policy: $.data.id, cap_policy: $.data.land_capacity_units }
          assert:
            - "GrowthScenario.${sc_trend}.capacity_variant == GROSS_CAPACITY"
            - "GrowthScenario.${sc_trend}.land_capacity_units == 11700"
            - "GrowthScenario.${sc_policy}.capacity_variant == NET_CAPACITY"
            - "GrowthScenario.${sc_policy}.land_capacity_units == 7115"
            - "GrowthScenario.${sc_trend}.land_capacity_units - GrowthScenario.${sc_policy}.land_capacity_units == 4585"
            - "InventoryDataset.${inv_land}.referencing_scenario_count == 2"

      - name: activity_equity_standard_vs_outreach_weighted_divergence
        grounds:
          - calculations.activity_equity_share_pct
          - calculations.participation_record_weight
          - entities.EngagementActivity.fields.weighting_variant
          - entities.ParticipationRecord.fields.weight
        distinguishing_aspect: |
          This dual variant lives in a different entity domain - public-engagement participation on
          EngagementActivity, not land supply on GrowthScenario. The identical five-respondent
          roster (three underrepresented, two of whom used an interpreter) scores equity_share_pct
          60.0 on a WORKSHOP (STANDARD head-count weighting) and 71.4 on a TARGETED_OUTREACH
          activity (OUTREACH_WEIGHTED doubles interpreter records: 5.0 of 7.0 weight).
        test_recipe:
          setup:
            - "One PlanUpdate in DRAFTING."
            - "One Venue that is ADA-accessible and transit-served (required for TARGETED_OUTREACH) with a zero turnover buffer so the two activities can be booked back to back."
            - "Two activities in the past relative to the logical clock default 2026-08-01T00:00:00Z so both can be completed: a WORKSHOP and a TARGETED_OUTREACH session."
            - "Each activity receives the same five-respondent roster: LOW_INCOME + interpreter, LIMITED_ENGLISH + interpreter, RENTER without interpreter, GENERAL, SENIOR."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Room", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { v1: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v1}", activity_type: "WORKSHOP", title: "Draft Vision Workshop", start_at: "2026-07-10T18:00:00.000Z", end_at: "2026-07-10T20:00:00.000Z", interpretation_offered: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act_ws: $.data.id, var_ws: $.data.weighting_variant }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu}", venue_id: "${v1}", activity_type: "TARGETED_OUTREACH", title: "Renter Outreach Session", start_at: "2026-07-11T18:00:00.000Z", end_at: "2026-07-11T20:00:00.000Z", interpretation_offered: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act_out: $.data.id, var_out: $.data.weighting_variant }
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act_ws}", respondent_ref: "ws-r1", demographic_group: "LOW_INCOME", census_tract: "06001402100", interpreter_used: true }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act_ws}", respondent_ref: "ws-r2", demographic_group: "LIMITED_ENGLISH", census_tract: "06001402100", interpreter_used: true }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act_ws}", respondent_ref: "ws-r3", demographic_group: "RENTER", census_tract: "06001402200", interpreter_used: false }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act_ws}", respondent_ref: "ws-r4", demographic_group: "GENERAL", census_tract: "06001402200", interpreter_used: false }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act_ws}", respondent_ref: "ws-r5", demographic_group: "SENIOR", census_tract: "06001402300", interpreter_used: false }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act_out}", respondent_ref: "out-r1", demographic_group: "LOW_INCOME", census_tract: "06001402100", interpreter_used: true }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act_out}", respondent_ref: "out-r2", demographic_group: "LIMITED_ENGLISH", census_tract: "06001402100", interpreter_used: true }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act_out}", respondent_ref: "out-r3", demographic_group: "RENTER", census_tract: "06001402200", interpreter_used: false }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act_out}", respondent_ref: "out-r4", demographic_group: "GENERAL", census_tract: "06001402200", interpreter_used: false }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/participation-records"
              payload: { activity_id: "${act_out}", respondent_ref: "out-r5", demographic_group: "SENIOR", census_tract: "06001402300", interpreter_used: false }
              as: PlanningStaff
              as_user_id: "staff-1"
          trigger:
            - call: "POST /planning/engagement-activities/${act_ws}/complete"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { ws_share: $.data.equity_share_pct }
            - call: "POST /planning/engagement-activities/${act_out}/complete"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { out_share: $.data.equity_share_pct }
          assert:
            - "EngagementActivity.${act_ws}.weighting_variant == STANDARD"
            - "EngagementActivity.${act_ws}.total_weighted_count == 5.0"
            - "EngagementActivity.${act_ws}.underrepresented_weighted_count == 3.0"
            - "EngagementActivity.${act_ws}.equity_share_pct == 60.0"
            - "EngagementActivity.${act_out}.weighting_variant == OUTREACH_WEIGHTED"
            - "EngagementActivity.${act_out}.total_weighted_count == 7.0"
            - "EngagementActivity.${act_out}.underrepresented_weighted_count == 5.0"
            - "EngagementActivity.${act_out}.equity_share_pct == 71.4"
            - "EngagementActivity.${act_ws}.record_count == 5 and EngagementActivity.${act_out}.record_count == 5"
            - "EngagementActivity.${act_ws}.underrepresented_record_count == 3 and EngagementActivity.${act_out}.underrepresented_record_count == 3"

  # ===========================================================================
  # Rule 2 - combinatorial formulas across different modes
  #   instance 1 = mode (a) non-linear interaction over >= 3 inputs
  #   instance 2 = mode (b) nested rounding where the order changes the answer
  #   instance 3 = mode (c) circular-looking dependency with a pinned order
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: projected_demand_policy_max_driver_non_linear_branch
        grounds:
          - calculations.projected_demand_units
          - entities.GrowthScenario.fields.projected_demand_units
          - entities.GrowthScenario.fields.capacity_gap_units
        distinguishing_aspect: |
          Mode (a): five inputs (base_households, annual_household_growth_rate, horizon span,
          job_growth_total, demolition_replacement_units) interact non-linearly through a compound
          exponential, a max() over two independent demand drivers and a branch on
          scenario.method - TREND takes household growth (12144 units) while POLICY takes the
          larger job-driven pressure (23708 units) from the identical input row.
        test_recipe:
          setup:
            - "One PlanUpdate with base_year 2025 and horizon_year 2045, giving a 20-year horizon span."
            - "One CERTIFIED LAND_USE InventoryDataset so scenarios can be created."
            - "Two scenarios differing only in method: TREND then POLICY."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "LAND_USE", vintage_year: 2025, vacant_acres: 400, underutilized_acres: 250, infrastructure_constrained_acres: 60, allowed_density_units_per_acre: 18 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_land: $.data.id }
            - call: "POST /planning/inventory-datasets/${inv_land}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { land_v1: $.data.version }
          trigger:
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${inv_land}", expected_inventory_version: "${land_v1}", label: "Trend 2045", method: "TREND", horizon_year: 2045, base_households: 60000, annual_household_growth_rate: 0.008, job_growth_total: 31000, demolition_replacement_units: 1200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc_trend: $.data.id, dem_trend: $.data.projected_demand_units }
            - call: "GET /planning/inventory-datasets/${inv_land}"
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { land_v2: $.data.version }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${inv_land}", expected_inventory_version: "${land_v2}", label: "Policy 2045", method: "POLICY", horizon_year: 2045, base_households: 60000, annual_household_growth_rate: 0.008, job_growth_total: 31000, demolition_replacement_units: 1200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc_policy: $.data.id, dem_policy: $.data.projected_demand_units }
          assert:
            - "GrowthScenario.${sc_trend}.projected_demand_units == 12144"
            - "GrowthScenario.${sc_policy}.projected_demand_units == 23708"
            - "GrowthScenario.${sc_trend}.capacity_gap_units == 444"
            - "GrowthScenario.${sc_policy}.capacity_gap_units == 16593"
            - "GrowthScenario.${sc_trend}.projected_demand_units != 12145 (household growth 10365.8426... must NOT be rounded before the vacancy allowance is applied)"

      - name: housing_waterfall_per_tier_rounding_before_allocation
        grounds:
          - calculations.housing_allocation_waterfall
          - entities.HousingAllocation.fields.tier_capacity_units
          - entities.HousingAllocation.fields.carryover_in_units
          - entities.HousingAllocation.fields.accommodated_units
          - entities.PlanUpdate.fields.housing_shortfall_total
        distinguishing_aspect: |
          Mode (b): the rounding order is the whole game. With the NET_CAPACITY pool of 7115 the
          pinned order - round each tier's suitability share to whole units FIRST, then run the
          waterfall - yields tier capacities 2135 + 1423 + 1423 + 2135 = 7116, one unit more than
          the pool, and lets ABOVE_MODERATE accommodate 2781 units; the rejected order (sum the
          exact shares, then round) would cap it at 2780 and report shortfall 220 instead of 219.
        test_recipe:
          setup:
            - "One PlanUpdate with all four inventory types CERTIFIED (adoption requires the complete inventory set)."
            - "A POLICY scenario adopted, so the waterfall pool is the NET_CAPACITY value 7115."
            - "Four HousingAllocation rows assigned 2500 / 1000 / 1200 / 3000 units, created out of statutory order (MODERATE first) to prove the waterfall visits TIER_ORDER, not created_at order."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "DEMOGRAPHIC", vintage_year: 2025, record_count: 4200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_demo: $.data.id }
            - call: "POST /planning/inventory-datasets/${inv_demo}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "HOUSING", vintage_year: 2025, record_count: 3100 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_hous: $.data.id }
            - call: "POST /planning/inventory-datasets/${inv_hous}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "EMPLOYMENT", vintage_year: 2025, record_count: 2600 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_emp: $.data.id }
            - call: "POST /planning/inventory-datasets/${inv_emp}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
            - call: "POST /planning/inventory-datasets"
              payload: { plan_update_id: "${pu}", inventory_type: "LAND_USE", vintage_year: 2025, vacant_acres: 400, underutilized_acres: 250, infrastructure_constrained_acres: 60, allowed_density_units_per_acre: 18 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { inv_land: $.data.id }
            - call: "POST /planning/inventory-datasets/${inv_land}/certify"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { land_v1: $.data.version }
            - call: "POST /planning/growth-scenarios"
              payload: { plan_update_id: "${pu}", land_use_inventory_id: "${inv_land}", expected_inventory_version: "${land_v1}", label: "Policy 2045", method: "POLICY", horizon_year: 2045, base_households: 60000, annual_household_growth_rate: 0.008, job_growth_total: 31000, demolition_replacement_units: 1200 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { sc_policy: $.data.id }
            - call: "POST /planning/growth-scenarios/${sc_policy}/adopt"
              payload: {}
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pool: $.data.land_capacity_units }
          trigger:
            - call: "POST /planning/housing-allocations"
              payload: { plan_update_id: "${pu}", income_tier: "MODERATE", assigned_units: 1200, cycle_deadline: "2029-12-31T00:00:00.000Z" }
              as: StateReviewer
              as_user_id: "state-1"
              captures: { ha_mod: $.data.id }
            - call: "POST /planning/housing-allocations"
              payload: { plan_update_id: "${pu}", income_tier: "ABOVE_MODERATE", assigned_units: 3000, cycle_deadline: "2029-12-31T00:00:00.000Z" }
              as: StateReviewer
              as_user_id: "state-1"
              captures: { ha_above: $.data.id }
            - call: "POST /planning/housing-allocations"
              payload: { plan_update_id: "${pu}", income_tier: "VERY_LOW", assigned_units: 2500, cycle_deadline: "2029-12-31T00:00:00.000Z" }
              as: StateReviewer
              as_user_id: "state-1"
              captures: { ha_vlow: $.data.id }
            - call: "POST /planning/housing-allocations"
              payload: { plan_update_id: "${pu}", income_tier: "LOW", assigned_units: 1000, cycle_deadline: "2029-12-31T00:00:00.000Z" }
              as: StateReviewer
              as_user_id: "state-1"
              captures: { ha_low: $.data.id }
          assert:
            - "GrowthScenario.${sc_policy}.land_capacity_units == 7115"
            - "HousingAllocation.${ha_vlow}.tier_capacity_units == 2135 and carryover_in_units == 0 and accommodated_units == 2135 and shortfall_units == 365"
            - "HousingAllocation.${ha_low}.tier_capacity_units == 1423 and carryover_in_units == 0 and accommodated_units == 1000 and shortfall_units == 0"
            - "HousingAllocation.${ha_mod}.tier_capacity_units == 1423 and carryover_in_units == 423 and accommodated_units == 1200 and shortfall_units == 0"
            - "HousingAllocation.${ha_above}.tier_capacity_units == 2135 and carryover_in_units == 646 and accommodated_units == 2781 and shortfall_units == 219"
            - "HousingAllocation.${ha_vlow}.tier_capacity_units + HousingAllocation.${ha_low}.tier_capacity_units + HousingAllocation.${ha_mod}.tier_capacity_units + HousingAllocation.${ha_above}.tier_capacity_units == 7116"
            - "PlanUpdate.${pu}.housing_shortfall_total == 584"
            - "PlanUpdate.${pu}.compliance_posture == CAPACITY_HOLD"

      - name: alternative_mitigation_credit_keyed_on_raw_not_net_score
        grounds:
          - calculations.alternative_net_impact_score
          - entities.PlanAlternative.fields.raw_impact_score
          - entities.PlanAlternative.fields.mitigation_credit
          - entities.PlanAlternative.fields.net_impact_score
        distinguishing_aspect: |
          Mode (c): the dependency looks circular - the mitigation tier is keyed on a score, and the
          score net of mitigation is what the plan reports - so the scaffold pins the evaluation
          order (raw first, tier on raw, then net). An alternative scoring exactly 70.00 raw sits in
          the HIGH tier and lands at 59.50 net; keying the tier on the net score instead would drop
          it into the MID tier and report 63.00. A second alternative proves the four impact
          weights are unequal: indices (100, 50, 20, 30) give raw 57.50, not the unweighted mean
          50.00.
        test_recipe:
          setup:
            - "One PlanUpdate in DRAFTING and one EnvironmentalReview in DRAFT (alternatives may only be added while DRAFT)."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/environmental-reviews"
              payload: { plan_update_id: "${pu}", document_type: "EIR", title: "Horizon 2045 Draft EIR" }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { er: $.data.id }
          trigger:
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${er}", label: "Threshold Boundary Alternative", traffic_vmt_index: 70, ghg_index: 70, habitat_index: 70, water_index: 70 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { alt_70: $.data.id, raw_70: $.data.raw_impact_score, net_70: $.data.net_impact_score }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${er}", label: "Auto-Oriented Alternative", traffic_vmt_index: 100, ghg_index: 50, habitat_index: 20, water_index: 30 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { alt_mix: $.data.id, raw_mix: $.data.raw_impact_score, net_mix: $.data.net_impact_score }
            - call: "POST /planning/plan-alternatives"
              payload: { environmental_review_id: "${er}", label: "Low Impact Alternative", traffic_vmt_index: 49, ghg_index: 49, habitat_index: 49, water_index: 49 }
              as: EnvironmentalConsultant
              as_user_id: "consultant-1"
              captures: { alt_49: $.data.id, net_49: $.data.net_impact_score }
          assert:
            - "PlanAlternative.${alt_70}.raw_impact_score == 70.00"
            - "PlanAlternative.${alt_70}.mitigation_credit == 10.50"
            - "PlanAlternative.${alt_70}.net_impact_score == 59.50"
            - "PlanAlternative.${alt_70}.net_impact_score != 63.00 (the value produced by keying the tier on the net score)"
            - "PlanAlternative.${alt_mix}.raw_impact_score == 57.50"
            - "PlanAlternative.${alt_mix}.mitigation_credit == 5.75"
            - "PlanAlternative.${alt_mix}.net_impact_score == 51.75"
            - "PlanAlternative.${alt_49}.raw_impact_score == 49.00 and mitigation_credit == 0.00 and net_impact_score == 49.00"
            - "EnvironmentalReview.${er}.alternative_count == 3"

  # ===========================================================================
  # Rule 3 - non-linear state-machine shape on different entities
  #   PlanElement revision cycle / Hearing outcome fork / PlanUpdate resubmission cycle
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: element_revision_cycle_escalates_on_third_request
        grounds:
          - state_machines.PlanElement.IN_REVIEW_to_REVISION_REQUESTED
          - state_machines.PlanElement.REVISION_REQUESTED_to_DRAFT
          - state_machines.PlanElement.IN_REVIEW_to_ESCALATED
          - state_machines.PlanElement.ESCALATED_to_DRAFT
          - validations[priority=85]
        distinguishing_aspect: |
          PlanElement is cyclic: DRAFT -> IN_REVIEW -> REVISION_REQUESTED -> DRAFT can be walked
          repeatedly, and the loop terminates by shape rather than by error - the third
          REQUEST_REVISION lands in ESCALATED (revision_round 3) instead of REVISION_REQUESTED, and
          only PlanningDirector can re-enter the loop from there, resetting revision_round to 0.
        test_recipe:
          setup:
            - "One PlanUpdate in DRAFTING."
            - "One HOUSING PlanElement authored by staff-1 with policy_count 6 so submit-review passes the content-readiness check."
            - "All review decisions are recorded by director-1 (never staff-1) so the segregation-of-duties check at priority 60 never fires."
          setup_api_calls:
            - call: "POST /planning/plan-updates"
              payload: { title: "Horizon 2045", jurisdiction_code: "CA-0451", base_year: 2025, horizon_year: 2045 }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { pu: $.data.id }
            - call: "POST /planning/plan-elements"
              payload: { plan_update_id: "${pu}", element_type: "HOUSING", title: "Housing Element", draft_body: "Sites inventory and programs, first draft.", policy_count: 6 }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { el: $.data.id }
            - call: "POST /planning/plan-elements/${el}/submit-review"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/plan-elements/${el}/review-decision"
              payload: { decision: "REQUEST_REVISION", review_note: "Round 1: add the AFFH analysis." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { round1: $.data.revision_round }
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { draft_body: "Sites inventory, programs and AFFH analysis." }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/plan-elements/${el}/submit-review"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/plan-elements/${el}/review-decision"
              payload: { decision: "REQUEST_REVISION", review_note: "Round 2: quantify the constraints." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { round2: $.data.revision_round }
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { draft_body: "Sites inventory, programs, AFFH and constraints analysis." }
              as: PlanningStaff
              as_user_id: "staff-1"
            - call: "POST /planning/plan-elements/${el}/submit-review"
              payload: {}
              as: PlanningStaff
              as_user_id: "staff-1"
          trigger:
            - call: "POST /planning/plan-elements/${el}/review-decision"
              payload: { decision: "REQUEST_REVISION", review_note: "Round 3: unresolved, escalating." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { st3: $.data.status, round3: $.data.revision_round }
            - call: "PATCH /planning/plan-elements/${el}"
              payload: { draft_body: "Director rewrite of the housing element." }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { st4: $.data.status, round4: $.data.revision_round }
          assert:
            - "after the first REQUEST_REVISION: PlanElement.${el}.status == REVISION_REQUESTED and revision_round == 1"
            - "after the second REQUEST_REVISION: PlanElement.${el}.status == REVISION_REQUESTED and revision_round == 2"
            - "after the third REQUEST_REVISION: PlanElement.${el}.status == ESCALATED and revision_round == 3"
            - "PlanElement.${el}.status != REVISION_REQUESTED after the third decision (the loop does not run a fourth round)"
            - "after the PlanningDirector PATCH: PlanElement.${el}.status == DRAFT and revision_round == 0"
            - "PlanElement.${el}.reviewed_by_user_id == director-1"

      - name: hearing_outcome_fork_continue_versus_recommend_side_effects
        grounds:
          - state_machines.Hearing.OPEN_to_CONTINUED
          - state_machines.Hearing.OPEN_to_RECOMMENDED
          - state_machines.PlanUpdate.STATE_CERTIFIED_to_COMMISSION_RECOMMENDED
          - validations[priority=74]
        distinguishing_aspect: |
          Hearing (a different entity from PlanElement) forks four ways out of OPEN with divergent
          side-effect sets: CONTINUE closes the hearing as CONTINUED and leaves PlanUpdate.status at
          STATE_CERTIFIED, while RECOMMEND closes it as RECOMMENDED and drives the parent plan
