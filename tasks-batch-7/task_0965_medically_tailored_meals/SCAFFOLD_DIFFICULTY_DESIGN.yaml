            - { call: "POST /mtm/diet-prescriptions/${p_id}/activate", payload: { expected_member_version: "${m_v1}" }, as: Dietitian }
            - { call: "POST /mtm/menu-items", payload: { name: "Peanut Chicken", sodium_mg: 100, potassium_mg: 100, phosphorus_mg: 50, carbs_g: 10, protein_g: 15, allergen_codes: ["PEANUT"], base_cost_cents: 800 }, as: ProgramAdmin, captures: { i_d: $.data.id } }
            - { call: "POST /mtm/menu-cycles", payload: { member_id: "${m_id}", prescription_id: "${p_id}", week_start_date: "2026-05-04" }, as: Dietitian, captures: { mc_id: $.data.id } }
