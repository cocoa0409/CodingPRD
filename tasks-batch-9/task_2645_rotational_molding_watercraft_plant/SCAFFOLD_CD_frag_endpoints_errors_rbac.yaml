            - "immediately after the 412 FinishedUnit.${fu2}.logistics_status is still 'UNALLOCATED' and Warehouse.${wh}.committed_cube_m3 is still 2.0000"
            - "${sw_b} == ${sw_a} + 1 and the retry with ${sw_b} returns 200 with is_zone_anchor false and footprint_cube_m3 1.0000"
            - "the footprint summary read in the very next request reports zone Z-A committed_cube_m3 3.0000, remaining_cube_m3 17.0000, utilization_pct 15.00 and posture 'NORMAL', with one anchor for PM-CD-KM"
            - "${sw_c} == ${sw_b} + 1: exactly two successful stores produced exactly two version bumps"

      - name: occ_line_create_stale_shipment_version_before_the_nest_position_is_taken
        claim_type: immediate
        grounds:
          - concurrency_rules.line-create-stale-shipment
          - errors.ERR_STALE_SHIPMENT_VERSION
          - validations.priority_83
        distinguishing_aspect: |
          The trailer has 10.0000 m3 of cube and 100.000 kg of payload against a
          3.0000 m3 / 48.000 kg two-hull load, so neither ceiling binds: the
          refusal is purely the shipment version the first line advanced, and the
          refreshed retry takes nest_position 2 at the nested 1.0000 m3 rate.
        test_recipe:
          setup:
            - "Base plant with both hulls SELLABLE and STORED in WH-CD."
            - "Logical clock at 2026-08-01T10:35:00Z."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - *cd2_whv1
            - *cd2_store1
            - *cd2_whv2
            - *cd2_store2
          trigger:
            - call: "POST /shipments"
              payload: { shipment_code: "SHP-CD-O1", origin_warehouse_id: "${wh}", destination_zone: "Z1", carrier_code: "CARR-CD", trailer_cube_capacity_m3: 10.0000, trailer_max_payload_kg: 100.000 }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shpo: $.data.id }
            - call: "GET /shipments/${shpo}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { sh_a: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shpo}", finished_unit_id: "${fu1}", expected_shipment_version: "${sh_a}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shpo}", finished_unit_id: "${fu2}", expected_shipment_version: "${sh_a}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shpo}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { sh_b: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shpo}", finished_unit_id: "${fu2}", expected_shipment_version: "${sh_b}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shpo}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { sh_c: $.data.version }
          assert:
            - "the first line returns 201 with nest_position 1, line_nested_cube_m3 2.0000 and the shipment reporting nested_cube_m3 2.0000 and loaded_weight_kg 24.000"
            - "the second line with the pre-read version returns status 412 with data.error_id 'ERR_STALE_SHIPMENT_VERSION' — not ERR_TRAILER_CUBE_EXCEEDED and not ERR_TRAILER_PAYLOAD_EXCEEDED"
            - "immediately after the 412 GET /shipment-lines?shipment_id=${shpo} returns total_count 1 and FinishedUnit.${fu2}.logistics_status is still 'STORED'"
            - "${sh_b} == ${sh_a} + 1 and the retry with ${sh_b} returns 201 with nest_position 2 and line_nested_cube_m3 1.0000"
            - "the shipment then reports nested_cube_m3 3.0000 and loaded_weight_kg 48.000 with status 'LOADING'"
            - "${sh_c} == ${sh_b} + 1: the 412 consumed no version and the retry consumed exactly one"

      - name: occ_claim_approve_stale_product_model_version_across_an_intervening_patch
        claim_type: immediate
        grounds:
          - concurrency_rules.claim-approve-stale-product-model
          - errors.ERR_STALE_PRODUCT_MODEL_VERSION
          - calculations.warranty_payout
          - validations.priority_84
        distinguishing_aspect: |
          The intervening write is a PATCH that has nothing to do with money —
          min_cooling_minutes 30 to 31 — yet it invalidates the agent's
          expected_product_model_version, because the OCC token guards the whole
          funding parent; the refreshed approval then books exactly 165600 cents
          (gross 180000 at 100.00 pct pro-rata coverage, 8.00 pct admin fee
          14400, no storage deduction because the review VERIFIED) and leaves
          334400 cents of reserve.
        test_recipe:
          setup:
            - "Base plant with hull 1 delivered to CUS-CD-1 at 2026-08-02T09:00:00Z and CLM-CD-1 (HULL_DEFORMATION, reported_deformation_mm 4.50) UNDER_REVIEW."
            - "The storage review has been recorded VERIFIED, so storage_review_status is GUIDANCE_VERIFIED and the payout carries no storage deduction."
            - "ProductModel PM-CD-KM: msrp_cents 180000, warranty_basis PRO_RATA_AGE, warranty_reserve_cents 500000, warranty_paid_cents 0."
            - "Logical clock at 2026-08-02T09:00:00Z, so months_in_service is 0 and coverage_pct is 100.00."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - *cd2_whv1
            - *cd2_store1
            - *cd2_whv2
            - *cd2_store2
            - *cd2_cust
            - *cd2_ack
            - *cd2_shp
            - *cd2_shpv1
            - *cd2_line1
            - *cd2_shpv2
            - *cd2_line2
            - *cd2_seal
            - *cd2_clk1100
            - *cd2_depart
            - *cd2_clk0802
            - *cd2_deliver
            - *cd2_claim
            - *cd2_review
            - call: "POST /warranty-claims/${claim}/storage-review"
              payload: { outcome: "VERIFIED", storage_description: "stored on a cradle under cover" }
              as: WarrantyAgent
              as_user_id: "agent-1"
          trigger:
            - call: "GET /product-models/${pm}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { wm_a: $.data.version }
            - call: "PATCH /product-models/${pm}"
              payload: { min_cooling_minutes: 31 }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /warranty-claims/${claim}/approve"
              payload: { expected_product_model_version: "${wm_a}" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /product-models/${pm}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { wm_b: $.data.version }
            - call: "POST /warranty-claims/${claim}/approve"
              payload: { expected_product_model_version: "${wm_b}" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /product-models/${pm}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { wm_c: $.data.version }
          assert:
            - "the storage review leaves WarrantyClaim.${claim}.storage_review_status 'GUIDANCE_VERIFIED' with claim_status still 'UNDER_REVIEW'"
            - "the PATCH returns 200 with min_cooling_minutes 31 and ${wm_b} == ${wm_a} + 1"
            - "the approval with the pre-PATCH version returns status 412 with data.error_id 'ERR_STALE_PRODUCT_MODEL_VERSION' — not ERR_STORAGE_REVIEW_INCOMPLETE, not ERR_WARRANTY_TERM_EXPIRED and not ERR_WARRANTY_RESERVE_EXHAUSTED, all of which pass"
            - "immediately after the 412 ProductModel.${pm}.warranty_reserve_cents is still 500000, warranty_paid_cents is still 0 and WarrantyClaim.${claim}.claim_status is still 'UNDER_REVIEW'"
            - "the retry with ${wm_b} returns 200 with claim_status 'APPROVED' and net_payout_cents 165600, computed as gross 180000 minus admin fee 14400 minus storage deduction 0"
            - "ProductModel.${pm}.warranty_reserve_cents == 334400 and warranty_paid_cents == 165600 in that same response's aftermath, and ${wm_c} == ${wm_b} + 1"
            - "500000 == 334400 + 165600: the reserve ledger is conserved by the approval that the 412 had deferred"

      - name: occ_immediate_visibility_of_cascade_derived_fields_in_the_next_request
