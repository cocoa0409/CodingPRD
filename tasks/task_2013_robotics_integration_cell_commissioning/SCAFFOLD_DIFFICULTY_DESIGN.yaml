              captures: { mp_edge_id: $.data.id }
          trigger:
            - call: "POST /robotics/maintenance-plans/${mp_edge_id}/activate"
              payload: {}
              as: ServiceManager
              as_user_id: "${svc_id}"
              captures: { edge_status: $.data.plan_status }
            - call: "POST /robotics/maintenance-plans/${mp_id}/activate"
              payload: {}
              as: ServiceManager
