  # =============================================================================
  # RULE 8 — resource_temporal_overlap
  # Differentiation required by §0.5: DIFFERENT interval semantics AND different resource entities.
  # Instance 1 is the CLOSED interval [start, end] plus a mandatory cooldown GAP on the Destination
  # resource; instance 2 is the HALF-OPEN interval [start, end) with zero gap on the Profile
  # resource, where touching endpoints are explicitly legal.
  # =============================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: destination_cooldown_closed_interval_gap_boundary
        grounds:
          - validations[priority=46]
          - errors[ERR_ACTIVATION_COOLDOWN_VIOLATION]
          - entities.Destination.fields.cooldown_minutes
          - endpoints[POST /cdp/activations]
        distinguishing_aspect: |
          Interval semantics: CLOSED windows [window_start_at, window_end_at] on the DESTINATION
          resource, separated by a mandatory cooldown_minutes gap — a start 30 minutes after the
          previous end is refused even though the intervals are disjoint, and a start at exactly
          previous_end + cooldown_minutes is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem COOL_SRC and one PROMOTED batch of a single fully valid record in postal 10001 with an EMAIL/MARKETING OPT_IN signal."
            - "One ACTIVE EMAIL Destination DEST_COOL with cooldown_minutes 60, min_audience_size 1, max_concurrent_activations 2 and daily_hash_quota 1000."
            - "One APPROVED Segment SEG_COOL with criteria postal_code EQ 10001."
            - "One DRAFT Activation act_1 on DEST_COOL for the CLOSED window 2026-08-02T00:00:00Z..2026-08-02T02:00:00Z."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
