# §1.5 API Endpoint Table (55 endpoints)
# =============================================================================
endpoints:
  # --- Project ---
  - { method: POST, path: "/api/projects", description: "Create project", roles: [ProgramManager], code: 201, input: [name, rule20_credit_cents, estimated_total_cost_cents, target_cutover_on, "contingency_days?"], output: Project, side_effects: ["status PLANNING, posture CLEAR, delay/LD counters 0"] }
  - { method: GET, path: "/api/projects", description: "List projects", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: ["status?", "posture?"], output: "Project[]", side_effects: [] }
  - { method: GET, path: "/api/projects/{id}", description: "Get project (posture, LD, delay days, version)", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: [], output: Project, side_effects: [] }
  - { method: POST, path: "/api/projects/{id}/lifecycle", description: "Lifecycle actions MOBILIZE|START_TRENCHING|START_CONVERSION|START_RECONCILIATION|CLOSE|CANCEL", roles: [ProgramManager], code: 200, input: [action], output: Project, side_effects: ["per Project state machine; MOBILIZE computes provisional shares"] }
  - { method: POST, path: "/api/projects/{id}/replan", description: "Rebaseline the cutover date; successive replans supersede (OCC on project version)", roles: [ProgramManager], code: 200, input: [new_target_cutover_on, expected_project_version], output: Project, side_effects: ["target_cutover_on replaced", "project version incremented by 1"] }

  # --- UtilityParticipation ---
  - { method: POST, path: "/api/participations", description: "Invite a utility (creates participation, INVITED)", roles: [ProgramManager], code: 201, input: [project_id, utility_name, utility_type, cost_share_bp, sequence_order, "has_separation_waiver?"], output: UtilityParticipation, side_effects: [] }
  - { method: GET, path: "/api/participations", description: "List participations", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: ["project_id?", "status?"], output: "UtilityParticipation[]", side_effects: [] }
  - { method: GET, path: "/api/participations/{id}", description: "Get participation", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: [], output: UtilityParticipation, side_effects: [] }
  - { method: POST, path: "/api/participations/{id}/transition", description: "to COMMITTED|MOBILIZED|INSTALLED|WITHDRAWN", roles: [UtilityCoordinator], code: 200, input: [to], output: UtilityParticipation, side_effects: ["withdrawal cascade per state machine"] }

  # --- TrenchSegment ---
  - { method: POST, path: "/api/trench-segments", description: "Create segment (PLANNED)", roles: [ProgramManager], code: 201, input: [project_id, segment_code, length_ft, max_depth_inches, "parcel_ids?"], output: TrenchSegment, side_effects: [] }
  - { method: GET, path: "/api/trench-segments", description: "List segments (parcel_ids? matches segments containing the given parcel id)", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: ["project_id?", "status?", "parcel_ids?"], output: "TrenchSegment[]", side_effects: [] }
  - { method: GET, path: "/api/trench-segments/{id}", description: "Get segment (depth fields, frozen, version)", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: [], output: TrenchSegment, side_effects: [] }
  - { method: POST, path: "/api/trench-segments/{id}/schedule", description: "Set/replace excavation window (OCC on segment version)", roles: [ProgramManager], code: 200, input: [excavation_start_on, excavation_end_on, expected_trench_segment_version], output: TrenchSegment, side_effects: ["window set", "segment version incremented by 1"] }
  - { method: POST, path: "/api/trench-segments/{id}/transition", description: "to EXCAVATING|BACKFILLING|BACKFILLED|CLOSED (incl. reopen cycle)", roles: [ProgramManager], code: 200, input: [to], output: TrenchSegment, side_effects: ["gates per state machine"] }

  # --- OccupancySlot ---
  - { method: POST, path: "/api/occupancy-slots", description: "Reserve a depth band + install window", roles: [UtilityCoordinator], code: 201, input: [trench_segment_id, participation_id, depth_top_inches, depth_bottom_inches, install_start_at, install_end_at], output: OccupancySlot, side_effects: ["segment depth fields recomputed"] }
  - { method: GET, path: "/api/occupancy-slots", description: "List slots", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: ["trench_segment_id?", "participation_id?", "status?"], output: "OccupancySlot[]", side_effects: [] }
  - { method: GET, path: "/api/occupancy-slots/{id}", description: "Get slot", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: [], output: OccupancySlot, side_effects: [] }
  - { method: POST, path: "/api/occupancy-slots/{id}/transition", description: "to INSTALLING|INSTALLED|INSTALL_FAILED|VERIFIED|RELEASED", roles: [UtilityCoordinator, ProgramManager], code: 200, input: [to], output: OccupancySlot, side_effects: ["release recomputes segment depth"] }

  # --- Parcel / Easement / Permit ---
  - { method: POST, path: "/api/parcels", description: "Create parcel (computes panel_upgrade_required)", roles: [RightOfWayAgent, ProgramManager], code: 201, input: [project_id, address, owner_name, existing_panel_amps, load_calc_amps], output: Parcel, side_effects: [] }
  - { method: GET, path: "/api/parcels", description: "List parcels", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: ["project_id?"], output: "Parcel[]", side_effects: [] }
  - { method: GET, path: "/api/parcels/{id}", description: "Get parcel", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: [], output: Parcel, side_effects: [] }
  - { method: POST, path: "/api/easements", description: "Create easement (DRAFT)", roles: [RightOfWayAgent], code: 201, input: [parcel_id, easement_type], output: Easement, side_effects: [] }
  - { method: GET, path: "/api/easements", description: "List easements", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: ["parcel_id?", "status?"], output: "Easement[]", side_effects: [] }
  - { method: GET, path: "/api/easements/{id}", description: "Get easement", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: [], output: Easement, side_effects: [] }
  - { method: POST, path: "/api/easements/{id}/transition", description: "to REQUESTED|SIGNED|RECORDED|REFUSED", roles: [RightOfWayAgent], code: 200, input: [to], output: Easement, side_effects: ["posture recompute on REFUSED/RECORDED"] }
  - { method: POST, path: "/api/permits", description: "Create permit (APPLICATION)", roles: [RightOfWayAgent], code: 201, input: [project_id, permit_type, valid_from, valid_to], output: Permit, side_effects: [] }
  - { method: GET, path: "/api/permits", description: "List permits", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: ["project_id?", "permit_type?", "status?"], output: "Permit[]", side_effects: [] }
  - { method: GET, path: "/api/permits/{id}", description: "Get permit (lazy EXPIRED evaluation)", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: [], output: Permit, side_effects: ["may flip ISSUED -> EXPIRED when clock > valid_to"] }
  - { method: POST, path: "/api/permits/{id}/transition", description: "to SUBMITTED|ISSUED|REVOKED|CLOSED", roles: [RightOfWayAgent], code: 200, input: [to], output: Permit, side_effects: ["posture recompute on REVOKED"] }

  # --- ServiceConversion ---
  - { method: POST, path: "/api/service-conversions", description: "Create conversion (work PLANNED, temp NONE)", roles: [ConversionContractor], code: 201, input: [parcel_id, project_id], output: ServiceConversion, side_effects: [] }
  - { method: GET, path: "/api/service-conversions", description: "List conversions", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: ["project_id?", "parcel_id?", "work_status?"], output: "ServiceConversion[]", side_effects: [] }
  - { method: GET, path: "/api/service-conversions/{id}", description: "Get conversion (both state dimensions)", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: [], output: ServiceConversion, side_effects: [] }
  - { method: POST, path: "/api/service-conversions/{id}/work-transition", description: "Work axis transitions; PANEL_SET takes panel_capacity_amps; inspection takes outcome", roles: [ConversionContractor], code: 200, input: [to, "panel_capacity_amps?", "outcome?"], output: ServiceConversion, side_effects: ["rework cycle resets panel_capacity_amps"] }
  - { method: POST, path: "/api/service-conversions/{id}/temp-service-transition", description: "Temp axis: TEMP_INSTALLED|TEMP_ACTIVE|TEMP_REMOVED", roles: [ConversionContractor], code: 200, input: [to], output: ServiceConversion, side_effects: [] }

  # --- OutageWindow ---
  - { method: POST, path: "/api/outage-windows", description: "Propose outage (PROPOSED)", roles: [UtilityCoordinator, ProgramManager], code: 201, input: [project_id, feeder_id, start_at, end_at, "conversion_ids?"], output: OutageWindow, side_effects: [] }
  - { method: GET, path: "/api/outage-windows", description: "List outages (conversion_ids? matches outages affecting the given conversion id)", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: ["project_id?", "feeder_id?", "status?", "conversion_ids?"], output: "OutageWindow[]", side_effects: [] }
  - { method: GET, path: "/api/outage-windows/{id}", description: "Get outage", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: [], output: OutageWindow, side_effects: [] }
  - { method: POST, path: "/api/outage-windows/{id}/transition", description: "to APPROVED|NOTIFIED|EXECUTED|CLOSED|CANCELLED|PROPOSED(reschedule)", roles: [ProgramManager, UtilityCoordinator], code: 200, input: [to, "new_start_at?", "new_end_at?"], output: OutageWindow, side_effects: ["reschedule resets notified_at"] }

  # --- ChangeOrder ---
  - { method: POST, path: "/api/change-orders", description: "Create change order (PROPOSED)", roles: [ProgramManager], code: 201, input: [project_id, description, "segment_ids?"], output: ChangeOrder, side_effects: [] }
  - { method: GET, path: "/api/change-orders", description: "List change orders (segment_ids? matches change orders referencing the given segment id)", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: ["project_id?", "status?", "segment_ids?"], output: "ChangeOrder[]", side_effects: [] }
  - { method: GET, path: "/api/change-orders/{id}", description: "Get change order", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: [], output: ChangeOrder, side_effects: [] }
  - { method: POST, path: "/api/change-orders/{id}/transition", description: "to PRICED|PROPOSED(revise)|APPROVED|INCORPORATED|REJECTED|WITHDRAWN", roles: [ProgramManager], code: 200, input: [to, "delta_cost_cents?", "delta_delay_days?", "delay_cause?"], output: ChangeOrder, side_effects: ["freeze/unfreeze, cost + LD + share cascades per state machine"] }

  # --- ActualCostEntry ---
  - { method: POST, path: "/api/actual-cost-entries", description: "Append immutable actual cost (records submitted_by_user_id from X-User-ID)", roles: [FinanceAnalyst], code: 201, input: [project_id, cost_code, amount_cents, incurred_on, "participation_id?"], output: ActualCostEntry, side_effects: [] }
  - { method: GET, path: "/api/actual-cost-entries", description: "List actual costs", roles: [ProgramManager, FinanceAnalyst], code: 200, input: ["project_id?", "cost_code?", "participation_id?"], output: "ActualCostEntry[]", side_effects: [] }
  - { method: GET, path: "/api/actual-cost-entries/{id}", description: "Get actual cost entry", roles: [ProgramManager, FinanceAnalyst], code: 200, input: [], output: ActualCostEntry, side_effects: [] }

