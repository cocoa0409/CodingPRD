# =============================================================================
# Task 1871 — Dog Park Membership & Access Program
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: membership_fee_early_vs_lapsed_renewal
        grounds:
          - calculations.renewal_fee
          - calculations.initial_membership_fee
          - state_machines.Membership.ACTIVE_to_ACTIVE
          - state_machines.Membership.EXPIRED_to_ACTIVE
        distinguishing_aspect: |
          Fiscal domain on Membership: the SAME member with 2 VERIFIED dogs pays
          13500 (early-bird lines 10800 + 2700) renewing while ACTIVE vs 17500
          (full lines 12000 + 3000 + 2500 reinstatement) renewing while EXPIRED —
          distinct entity domain from the risk-scoring instance below.
        test_recipe:
          setup:
            - "Clock 2026-08-01; member Alice with 2 VERIFIED dogs; membership purchased (initial prorated fee 6288 = base 5030 + dog line 1258 at days_remaining=153), version 1"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Alice A", email: "alice@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /dog-park/dogs/${d1_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Bella", size_class: "SMALL", license_number: "LIC-2", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /dog-park/dogs/${d2_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_id: $.data.id, ms_v1: $.data.version, fee_initial: $.data.charged_fee_cents }
          trigger:
            - call: "POST /dog-park/memberships/${ms_id}/renew"
              payload: { expected_membership_version: "${ms_v1}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { fee_early: $.data.charged_fee_cents, ms_v2: $.data.version }
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-15T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/service-runs/nightly"
              payload: {}
              as: ParkAdmin
              captures: { n_expired: $.data.memberships_expired, n_lapsed: $.data.members_lapsed }
            - call: "GET /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_v3: "$.data[0].version" }
            - call: "POST /dog-park/memberships/${ms_id}/renew"
              payload: { expected_membership_version: "${ms_v3}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { fee_lapsed: $.data.charged_fee_cents, ms_term_end: $.data.term_end }
          assert:
            - "Membership.${ms_id}.charged_fee_cents after initial purchase == 6288"
            - "Membership.${ms_id}.charged_fee_cents after early renewal == 13500"
            - "nightly run summary: memberships_expired == 1 and members_lapsed == 1"
            - "Membership.${ms_id}.charged_fee_cents after lapsed renewal == 17500"
            - "Membership.${ms_id}.term_end after lapsed renewal == 2028-12-31T23:59:59Z"

      - name: strike_score_provisional_vs_confirmed
        grounds:
          - calculations.strike_score
          - entities.Member.fields.strike_points
          - entities.Member.fields.provisional_strike_score
          - state_machines.IncidentReport.UNDER_REVIEW_to_CONFIRMED
        distinguishing_aspect: |
          Risk-scoring domain on Member: identical report set (1 CONFIRMED MAJOR +
          1 FILED SEVERE) yields confirmed_score 20 (strike_points, no suspension)
          vs provisional_score 35 (adds round_half_up(0.5*30)) — distinct entity
          domain from the fiscal membership-fee instance above.
        test_recipe:
          setup:
            - "Clock 2026-08-01; member A active with 1 VERIFIED dog and ACTIVE membership"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Sub Ject", email: "subject@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_id: $.data.id }
            - call: "POST /dog-park/incident-reports"
              payload: { subject_member_id: "${m_id}", severity: "MAJOR", occurred_at: "2026-08-02T10:00:00Z", description: "fight at the gate" }
              as: ParkAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /dog-park/incident-reports/${r1_id}/advance"
              payload: { to: "UNDER_REVIEW" }
              as: ParkAdmin
            - call: "POST /dog-park/incident-reports/${r1_id}/advance"
              payload: { to: "CONFIRMED" }
              as: ParkAdmin
            - call: "POST /dog-park/incident-reports"
              payload: { subject_member_id: "${m_id}", severity: "SEVERE", occurred_at: "2026-08-03T10:00:00Z", description: "bite reported" }
              as: ParkAdmin
              captures: { r2_id: $.data.id }
          trigger:
            - call: "GET /dog-park/members/${m_id}"
              payload: {}
              as: ParkAdmin
              captures: { sp: $.data.strike_points, prov: $.data.provisional_strike_score, mst: $.data.status }
          assert:
            - "Member.${m_id}.strike_points == 20 (CONFIRMED MAJOR only)"
            - "Member.${m_id}.provisional_strike_score == 35 (20 + round_half_up(0.5 * 30))"
            - "Member.${m_id}.status == ACTIVE (20 < 30, no suspension)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: effective_capacity_peak_window_branch
        grounds:
          - calculations.effective_capacity
          - entities.ParkArea.fields.effective_capacity
          - errors[ERR_AREA_AT_CAPACITY]
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (capacity, peak_capacity, peak-window membership,
          ACTIVE-closure presence) combined by nested conditionals and min(); at
          17:30 inside the half-open window [1020,1140) effective_capacity collapses
          from 2 to 1 — distinct mode from the rounding-order instance below.
        test_recipe:
          setup:
            - "Clock Monday 2026-08-03 16:00 (off-peak); SMALL area capacity 2, peak_capacity 1, peak window 17:00-19:00; three members each with 1 VERIFIED SMALL dog and ACTIVE membership"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T16:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
              payload: { name: "Small Side", size_class_restriction: "SMALL", capacity: 2, peak_capacity: 1, peak_windows: [{ start_minute: 1020, end_minute: 1140 }] }
              as: ParkAdmin
              captures: { a_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "M One", email: "m1@x.com" }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /dog-park/members/${m1_id}/dogs"
              payload: { name: "Pip", size_class: "SMALL", license_number: "LIC-A", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dg1_id: $.data.id }
            - call: "POST /dog-park/dogs/${dg1_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m1_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /dog-park/members"
              payload: { full_name: "M Two", email: "m2@x.com" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /dog-park/members/${m2_id}/dogs"
              payload: { name: "Gus", size_class: "SMALL", license_number: "LIC-B", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { dg2_id: $.data.id }
            - call: "POST /dog-park/dogs/${dg2_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m2_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
            - call: "POST /dog-park/members"
              payload: { full_name: "M Three", email: "m3@x.com" }
              as: Anonymous
              captures: { m3_id: $.data.id }
            - call: "POST /dog-park/members/${m3_id}/dogs"
              payload: { name: "Ivy", size_class: "SMALL", license_number: "LIC-C", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { dg3_id: $.data.id }
            - call: "POST /dog-park/dogs/${dg3_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m3_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m3_id}"
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", dog_id: "${dg1_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", dog_id: "${dg2_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { v2_id: $.data.id }
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T17:30:00Z" }
              as: ParkAdmin
          trigger:
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", dog_id: "${dg3_id}" }
              as: Member
              as_user_id: "${m3_id}"
              captures: { err: $.data.error_id }
            - call: "GET /dog-park/areas/${a_id}"
              payload: {}
              as: ParkAdmin
              captures: { eff: $.data.effective_capacity, occ: $.data.current_occupancy }
          assert:
            - "off-peak check-ins for ${dg1_id} and ${dg2_id} both succeeded (occupancy 0,1 < 2)"
            - "check-in for ${dg3_id} at 17:30 rejected with ERR_AREA_AT_CAPACITY"
            - "ParkArea.${a_id}.effective_capacity == 1 (peak window derating)"
            - "ParkArea.${a_id}.current_occupancy == 2 (existing OPEN visits grandfathered)"

      - name: initial_fee_per_line_rounding_order
        grounds:
          - calculations.initial_membership_fee
          - entities.Membership.fields.charged_fee_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — pinned per-line
          round-then-sum yields 2506 (2005 + 501) at days_remaining=61 with 2
          dogs; the alternate sum-then-round order yields 2507 — distinct mode
          from the threshold/conditional instance above.
        test_recipe:
          setup:
            - "Clock 2026-11-01 (61 days remain through Dec 31); member Ned with 2 VERIFIED dogs"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Ned N", email: "ned@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /dog-park/dogs/${d1_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Bella", size_class: "SMALL", license_number: "LIC-2", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /dog-park/dogs/${d2_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
          trigger:
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { fee: $.data.charged_fee_cents, ms_id: $.data.id }
          assert:
            - "Membership.${ms_id}.charged_fee_cents == 2506 (base_line round_half_up(12000*61/365)=2005 + dog_line round_half_up(3000*1*61/365)=501)"
            - "sum-then-round would produce 2507; per-line-then-sum is the pinned order"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: member_suspension_reinstatement_cycle
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Member.SUSPENDED_to_ACTIVE
          - state_machines.Membership.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on Member: ACTIVE -> SUSPENDED (strike threshold) ->
          ACTIVE (reinstatement) with strike reset — distinct entity from the Dog
          resubmission cycle below.
        test_recipe:
          setup:
            - "Clock 2026-08-01; member A active; ParkAdmin-filed SEVERE report confirmed against A (30 points -> SUSPENDED)"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Sub Ject", email: "subject@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_id: $.data.id }
            - call: "POST /dog-park/incident-reports"
              payload: { subject_member_id: "${m_id}", severity: "SEVERE", occurred_at: "2026-08-02T10:00:00Z", description: "unprovoked bite" }
              as: ParkAdmin
              captures: { r_id: $.data.id }
            - call: "POST /dog-park/incident-reports/${r_id}/advance"
              payload: { to: "UNDER_REVIEW" }
              as: ParkAdmin
            - call: "POST /dog-park/incident-reports/${r_id}/advance"
              payload: { to: "CONFIRMED" }
              as: ParkAdmin
          trigger:
            - call: "POST /dog-park/members/${m_id}/reinstate"
              payload: {}
              as: ParkAdmin
              captures: { mst: $.data.status, sp: $.data.strike_points }
            - call: "GET /dog-park/members/${m_id}/memberships"
              payload: {}
              as: ParkAdmin
              captures: { msst: "$.data[0].status" }
          assert:
            - "Member.${m_id}.status == ACTIVE after reinstatement (cycle closed)"
            - "Member.${m_id}.strike_points == 0 (reset on reinstatement)"
            - "Membership.${ms_id}.status == ACTIVE (SUSPENDED -> ACTIVE cascade)"

      - name: dog_verification_resubmission_cycle
        grounds:
          - state_machines.Dog.SUBMITTED_to_REJECTED
          - state_machines.Dog.REJECTED_to_SUBMITTED
          - state_machines.Dog.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Cyclic machine on Dog: SUBMITTED -> REJECTED -> SUBMITTED -> VERIFIED
          via resubmission loop — distinct entity from the Member cycle above.
        test_recipe:
          setup:
            - "Clock 2026-08-01; member A registered; dog added (SUBMITTED)"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/members"
              payload: { full_name: "Own Er", email: "owner@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Rex", size_class: "LARGE", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "REJECTED", reason: "illegible license" }
              as: ParkAdmin
              captures: { s1: $.data.verification_status, rr1: $.data.rejection_reason }
            - call: "POST /dog-park/dogs/${d_id}/resubmit"
              payload: { vaccination_expires_on: "2027-06-01", license_number: "LIC-77" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s2: $.data.verification_status, rr2: $.data.rejection_reason }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
              captures: { s3: $.data.verification_status }
          assert:
            - "Dog.${d_id}.verification_status == REJECTED after reject, rejection_reason == 'illegible license'"
            - "Dog.${d_id}.verification_status == SUBMITTED after resubmit, rejection_reason == null"
            - "Dog.${d_id}.verification_status == VERIFIED after second verify"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: incident_confirm_suspension_cascade
        grounds:
          - state_machines.IncidentReport.UNDER_REVIEW_to_CONFIRMED
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Membership.ACTIVE_to_SUSPENDED
          - state_machines.ParkVisit.OPEN_to_FORCE_CLOSED
          - state_machines.GuestPass.ISSUED_to_VOID
        distinguishing_aspect: |
          Depth-4 chain triggered by incident CONFIRMED: strike_points += 30 ->
          threshold flips Member SUSPENDED -> that flips Membership SUSPENDED,
          force-closes the OPEN visit and voids the ISSUED pass; each link caused
          by the previous one — distinct trigger from the nightly-run cascade.
        test_recipe:
          setup:
            - "Clock 2026-08-01; SMALL area capacity 4; member A active with VERIFIED SMALL dog, ACTIVE membership, one OPEN visit, one ISSUED guest pass; SEVERE report at UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /dog-park/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ParkAdmin
            - call: "POST /dog-park/areas"
              payload: { name: "Small Side", size_class_restriction: "SMALL", capacity: 4, peak_capacity: 4 }
              as: ParkAdmin
              captures: { a_id: $.data.id }
            - call: "POST /dog-park/members"
              payload: { full_name: "Sub Ject", email: "subject@x.com" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /dog-park/members/${m_id}/dogs"
              payload: { name: "Pip", size_class: "SMALL", license_number: "LIC-1", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m_id}"
              captures: { d_id: $.data.id }
            - call: "POST /dog-park/dogs/${d_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { ms_id: $.data.id }
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", dog_id: "${d_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id }
            - call: "POST /dog-park/guest-passes"
              payload: { guest_dog_size_class: "SMALL", valid_on: "2026-08-03" }
              as: Member
              as_user_id: "${m_id}"
              captures: { gp_id: $.data.id }
            - call: "POST /dog-park/incident-reports"
              payload: { subject_member_id: "${m_id}", severity: "SEVERE", occurred_at: "2026-08-01T11:00:00Z", description: "bite near gate" }
              as: ParkAdmin
              captures: { r_id: $.data.id }
            - call: "POST /dog-park/incident-reports/${r_id}/advance"
              payload: { to: "UNDER_REVIEW" }
              as: ParkAdmin
          trigger:
            - call: "POST /dog-park/incident-reports/${r_id}/advance"
              payload: { to: "CONFIRMED" }
              as: ParkAdmin
            - call: "GET /dog-park/members/${m_id}"
              payload: {}
              as: ParkAdmin
              captures: { mst: $.data.status, sp: $.data.strike_points, gu: $.data.guest_passes_used_this_month }
            - call: "GET /dog-park/members/${m_id}/memberships"
              payload: {}
              as: ParkAdmin
              captures: { msst: "$.data[0].status" }
            - call: "GET /dog-park/visits/${v_id}"
              payload: {}
              as: ParkAdmin
              captures: { vst: $.data.status, vcr: $.data.close_reason }
            - call: "GET /dog-park/guest-passes/${gp_id}"
              payload: {}
              as: ParkAdmin
              captures: { gpst: $.data.status }
          assert:
            - "Member.${m_id}.strike_points == 30 (link 1: CONFIRMED recomputes points)"
            - "Member.${m_id}.status == SUSPENDED (link 2: threshold breach)"
            - "Membership.${ms_id}.status == SUSPENDED (link 3: membership cascade)"
            - "ParkVisit.${v_id}.status == FORCE_CLOSED and close_reason == MEMBER_SUSPENDED (link 3')"
            - "GuestPass.${gp_id}.status == VOID (link 3'')"
            - "Member.${m_id}.guest_passes_used_this_month == 0 (void refunds allotment)"

      - name: nightly_run_expiry_cascade
        grounds:
          - state_machines.Membership.ACTIVE_to_EXPIRED
          - state_machines.Member.ACTIVE_to_LAPSED
        distinguishing_aspect: |
          Depth-2 chain triggered by the nightly service-run: run flips the
          past-term Membership to EXPIRED and that flip lapses the ACTIVE member —
          distinct trigger (ops-run checkpoint) from the incident-review cascade.
        test_recipe:
          setup:
            - "Clock 2026-08-01; member A active with VERIFIED dog and membership whose term ends 2026-12-31"
          setup_api_calls:
