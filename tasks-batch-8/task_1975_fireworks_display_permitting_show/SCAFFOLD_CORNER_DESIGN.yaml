            - { call: "POST /pyro/magazines", payload: { name: "MAG-1", atf_magazine_permit: "P-1", magazine_type: "OUTDOOR", capacity_new_lbs: 100.00, inspection_due_at: "2027-01-01T00:00:00Z" }, as: Operator, as_user_id: "${op}", captures: { mag: $.data.id } }
            - { call: "POST /pyro/magazines/${mag}/batches", payload: { product_name: "Shell 4in", un_number: "UN0335", shell_diameter_in: 4, quantity_units: 10, new_per_unit_lbs: 0.50, lot_number: "L1" }, as: Operator, as_user_id: "${op}", captures: { b1: $.data.id } }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "CHECK_OUT", quantity: 10, display_event_id: "${ev}", driver_name: "Dan", vehicle_placard: "1.3G", cdl_hazmat_endorsed: true }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/operators/${op}/crew-members", payload: { full_name: "Lee", cert_level: "LEAD_OPERATOR", cert_expires_at: "2027-06-01T00:00:00Z", hazmat_endorsed: true }, as: Operator, as_user_id: "${op}", captures: { crew: $.data.id } }
            - { call: "POST /pyro/displays/${ev}/security-posts", payload: { post_label: "N", arc_degrees: 45, radius_ft: 300 }, as: Operator, as_user_id: "${op}", captures: { post: $.data.id } }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g1", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g2", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/security-posts/${post}/assign", payload: { guard_name: "g3", guard_company: "SEC" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/displays/${ev}/ready", payload: {}, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T20:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pyro/displays/${ev}/weather-readings", payload: { wind_speed_mph: 5.0, gust_mph: 12.0, wind_direction_deg: 180, precipitation: false, source: "NWS" }, as: CrewMember, as_user_id: "${crew}" }
            - { call: "GET /pyro/displays/${ev}", payload: {}, as: Operator, as_user_id: "${op}", captures: { v0: $.data.version } }
            - { call: "POST /pyro/displays/${ev}/go-no-go", payload: { decision: "GO", expected_display_event_version: "${v0}" }, as: Operator, as_user_id: "${op}" }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "EXPEND", quantity: 10, display_event_id: "${ev}" }, as: Operator, as_user_id: "${op}" }
          trigger:
            - { call: "GET /pyro/batches/${b1}", payload: {}, as: Operator, as_user_id: "${op}", captures: { st: $.data.status } }
            - { call: "POST /pyro/batches/${b1}/movements", payload: { movement_type: "EXPEND", quantity: 1, display_event_id: "${ev}" }, as: Operator, as_user_id: "${op}", captures: { err: $.data.error_id } }
          assert:
            - "batch status == DEPLETED after the 10th expend"
            - "further EXPEND -> err == ERR_INSUFFICIENT_PRODUCT"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_create
        claim_type: immediate_consistency
        grounds: [complexity_profile, response_envelope]
        distinguishing_aspect: "Create responses include computed fields in the SAME response (immediate consistency): the site plan creation response already carries required_spectator_distance_ft and the bumped parent version is visible on the next read."
        test_recipe:
          setup: ["operator; event DRAFT"]
          setup_api_calls:
            - { call: "POST /pyro/operators", payload: { legal_name: "Pyro Co", atf_license_number: "ATF-001", license_class: "DISPLAY_1_3G", license_valid_from: "2026-01-01T00:00:00Z", license_expires_at: "2027-01-01T00:00:00Z" }, as: SystemAdmin, captures: { op: $.data.id } }
            - { call: "POST /pyro/displays", payload: { venue_id: "VEN-1", venue_name: "Fairgrounds", scheduled_start_at: "2026-09-01T20:00:00Z", scheduled_end_at: "2026-09-01T23:00:00Z", declared_max_shell_diameter_in: 4 }, as: Operator, as_user_id: "${op}", captures: { ev: $.data.id, ev_v: $.data.version } }
          trigger:
            - { call: "POST /pyro/displays/${ev}/site-plans", payload: { diagram_ref: "D1", launch_area_width_ft: 200, launch_area_length_ft: 200, spectator_boundary_ft: 300, spectator_arc_center_deg: 0, nearest_structure_ft: 500, expected_display_event_version: "${ev_v}" }, as: Operator, as_user_id: "${op}", captures: { rsd: $.data.required_spectator_distance_ft, sps: $.data.status } }
            - { call: "GET /pyro/displays/${ev}", payload: {}, as: Operator, as_user_id: "${op}", captures: { v: $.data.version } }
          assert:
            - "creation response carries required_spectator_distance_ft == 280 and status == CURRENT"
            - "subsequent GET shows event version == 2 (mutation visible immediately)"

  # ---------------------------------------------------------------------------
  # Corners already covered by §1.8 difficulty instances (stubs)
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: permit_cycle_corner_covered
        claim_type: valid_transition
        grounds: [state_machines.PermitApplication]
        excluded_because:
          difficulty_instance: permit_application_info_request_cycle
          rationale: "The INFO_REQUESTED -> SUBMITTED loop, revision_count, and supersede side effects are asserted there."
      - name: dud_halt_cascade_corner_covered
        claim_type: side_effect_execution
        grounds: [calculations.c_dud_halt_threshold]
        excluded_because:
          difficulty_instance: dud_halt_cascade
          rationale: "Threshold breach cascade (counter -> status) asserted with fired_count 20 / halt at 2."

  - section: validations
    instances:
      - name: priority_state_vs_safety_corner_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=7]", "validations[priority=8]"]
        excluded_because:
          difficulty_instance: state_beats_safety_on_quarantined_movement
          rationale: "Dual-failure ordering between state and business_safety asserted there."
      - name: priority_safety_vs_temporal_corner_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=10]"]
        excluded_because:
          difficulty_instance: safety_beats_temporal_on_go_no_go
          rationale: "Dual-failure ordering between business_safety and business_temporal asserted there."

  - section: calculations
    instances:
      - name: wind_adjusted_branch_corner_covered
        claim_type: correct_result
        grounds: [calculations.c_wind_adjusted_fallout]
        excluded_because:
          difficulty_instance: wind_adjusted_fallout_downwind_branch
          rationale: "Downwind vs oblique angular branch values (504 vs 462) asserted there."
      - name: standby_fee_rounding_corner_covered
        claim_type: precision
        grounds: [calculations.c_standby_fee]
        excluded_because:
          difficulty_instance: standby_fee_line_item_rounding_order
          rationale: "Per-line minute-prorate rounding vs ceil-hours misreading asserted with literal 137683."
      - name: capacity_boundary_corner_covered
        claim_type: boundary_value
        grounds: [calculations.c_magazine_mass]
        excluded_because:
          difficulty_instance: magazine_capacity_exact_fit
          rationale: "Inclusive capacity boundary (exactly 100.00 accepted, 100.01 rejected) asserted there."
      - name: wind_limit_boundary_corner_covered
        claim_type: boundary_value
        grounds: [calculations.c_weather_windows]
        excluded_because:
          difficulty_instance: wind_limit_exact_20_no_go
          rationale: "Strict wind limit at exactly 20.0 mph asserted there."

  - section: cross_cutting_layers
    instances:
      - name: operator_suspend_cascade_corner_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Operator.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: operator_suspend_cascade
          rationale: "Depth-3 cascade (event cancel -> auto-RETURN -> magazine recompute) asserted there."
      - name: magazine_mass_invariant_corner_covered
        claim_type: derived_field_reconciliation
        grounds: [calculations.c_magazine_mass]
        excluded_because:
          difficulty_instance: checkout_return_restores_magazine_mass
          rationale: "CHECK_OUT/RETURN compensating invariant on current_new_lbs asserted there."
      - name: batch_partition_invariant_corner_covered
        claim_type: derived_field_reconciliation
        grounds: [calculations.c_batch_quantities]
        excluded_because:
          difficulty_instance: batch_unit_accountability_partition
          rationale: "Unit-count partition across CHECK_OUT/EXPEND/RETURN asserted there."

  - section: endpoints
    instances:
      - name: venue_buffer_endpoint_corner_covered
        claim_type: conditional_action
        grounds: ["errors[ERR_VENUE_CONFLICT]"]
        excluded_because:
          difficulty_instance: venue_booking_buffer_boundary
          rationale: "Buffered half-open overlap semantics and the exact 23:00 adjacency edge asserted there."
      - name: license_containment_corner_covered
        claim_type: conditional_action
        grounds: ["errors[ERR_LICENSE_EXPIRED]"]
        excluded_because:
          difficulty_instance: license_containment_inclusive_boundary
          rationale: "Closed-interval containment at exactly license_expires_at asserted there."
