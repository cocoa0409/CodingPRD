  - rule_id: resource_temporal_overlap
    instances:
      - name: proctor_exclusive_occupancy_rejects_14_minute_gap_allows_exactly_15
        grounds:
          - calculations.proctor_interval_conflict
          - validations[priority=47]
          - errors.ERR_PROCTOR_INTERVAL_CONFLICT
          - entities.Proctor.fields.reserved_minutes
        distinguishing_aspect: |
          Resource = Proctor, semantics = exclusive single-occupancy with a symmetric
          PROCTOR_BUFFER_MINUTES = 15 pad on both ends compared with strict `<`. The occupied window of
          the 09:00-11:00 sitting is therefore [08:45, 11:15]: a second sitting starting at 11:14 is
          rejected even though the raw intervals do not touch, while a start at exactly 11:15 is
          accepted because the comparison is strict, not inclusive. Seat capacity is deliberately
          non-binding here (seat_count 2, and neither pair of raw intervals overlaps), so only the
          proctor rule can fire.
        test_recipe:
          setup:
            - "Baseline jurisdiction TX-TRAVIS / provider 500000 credit / EN form (base_minutes 120) / site with seat_count 2."
            - "Two candidates and ONE REGISTERED proctor, plus a 2-unit EXAM_ONLY batch (total 7524, balance 492476) with one code assigned to each candidate."
            - "One IN_PERSON sitting already SCHEDULED for candidate A with that proctor at 2026-09-10T09:00:00Z, so allowed_minutes 120 and scheduled_end_at 2026-09-10T11:00:00Z; Proctor.reserved_minutes == 120."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"], accepts_remote_proctoring: true, requires_local_registration: true, posting_deadline_days: 30, recert_cycle_months: 60, exam_fee_surcharge_pct: 0.045 }
