# =============================================================================
# Scaffold: mobile-fuel-delivery benchmark seed tables
# Mobile Fuel & Gas Delivery (Yoshi / Booster style)
# Difficulty tier: Expert
# =============================================================================

scenario: |
  1078. Mobile Fuel & Gas Delivery (Yoshi/Booster style): order & vehicle/location,
  membership vs per-fill, delivery route & window, fuel type & price, fleet account &
  controls, safety/compliance, add-on (wash/oil), billing

domain_name: mobile-fuel-delivery
api_prefix: "/"

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # flat: peer entities linked by foreign keys; no deep URL nesting. Trucks own
  # compartments and orders own add-ons as the only sub-resources.

  state_machine_shape: cyclic
  # DeliveryOrder (reschedule loop) and Membership (pause/past-due loops) are the
  # two mandated non-linear machines; several supporting machines are branching.

  relationship_patterns:
    - one_to_many        # Customer -> Vehicle/Membership/Order; Truck -> Compartment
    - cross_aggregate    # Order references Vehicle, Route, Membership, FleetAccount

  role_model: peer_roles
  # Each role owns a distinct slice of the surface (admin/dispatch/driver/fleet/
  # member/billing); ownership on entity_backed roles is by customer_id / driver id.

  consistency_model: immediate

  entity_count: 10
  state_machine_count: 6
  calculation_count: 8
  validation_layers: 9
  endpoint_count: 49
  error_code_count: 34
  role_count: 6

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Account holder / business name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: customer_type, type: enum, source: input, description: "INDIVIDUAL | FLEET", constraints: "one of {INDIVIDUAL, FLEET}" }
      - { name: status, type: enum, source: system, description: "ACTIVE (set at registration; the only lifecycle state)", default: ACTIVE, constraints: "one of {ACTIVE}" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the individual subscriber" }
      - { name: tier, type: enum, source: input, description: "BASIC | PLUS | PRO (informational tier label)", constraints: "one of {BASIC, PLUS, PRO}" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring period fee in cents", constraints: ">= 0" }
      - { name: included_deliveries, type: integer, source: input, description: "Deliveries covered per period before overage fee applies", constraints: ">= 0" }
      - { name: price_lock_enabled, type: boolean, source: input, default: true, description: "When true the fuel price is locked at order creation for this member's orders" }
      - { name: deliveries_used_this_period, type: integer, source: computed, default: 0, description: "Count of DELIVERED orders charged to this membership in the current period" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | PAST_DUE | CANCELLED", default: ACTIVE, constraints: "one of {ACTIVE, PAUSED, PAST_DUE, CANCELLED}" }
      - { name: current_period_start, type: datetime, source: system, description: "Logical clock at creation or last renewal (ISO 8601 UTC)" }
      - { name: current_period_end, type: datetime, source: computed, description: "current_period_start + MEMBERSHIP_PERIOD_DAYS" }
      - { name: estimated_next_charge_cents, type: integer, source: computed, description: "Provisional variant: full monthly_fee_cents, ignores unused-delivery credit" }
      - { name: final_settlement_charge_cents, type: integer, source: computed, description: "Final variant: monthly_fee_cents minus unused-delivery credit at renewal/cancel; null until settled" }

  - name: FleetAccount
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; must be a FLEET customer" }
      - { name: monthly_budget_cap_cents, type: integer, source: input, description: "Account-wide spend ceiling per period", constraints: ">= 0" }
      - { name: allowed_fuel_types, type: array, source: input, description: "Subset of {REGULAR, PREMIUM, DIESEL} the fleet may order" }
      - { name: allowed_addons, type: array, source: input, description: "Subset of {CAR_WASH, OIL_CHANGE} the fleet permits" }
      - { name: committed_budget_cents, type: integer, source: computed, default: 0, description: "Sum of order totals reserved by non-terminal fleet orders" }
      - { name: settled_budget_cents, type: integer, source: computed, default: 0, description: "Sum of order totals of DELIVERED fleet orders in this period" }
      - { name: remaining_budget_cents, type: integer, source: computed, description: "monthly_budget_cap_cents - committed_budget_cents - settled_budget_cents" }
      - { name: active_vehicle_count, type: integer, source: computed, default: 0, description: "Count of linked Vehicles in status ACTIVE" }
      - { name: suspended_vehicle_count, type: integer, source: computed, default: 0, description: "Count of linked Vehicles in status SUSPENDED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", default: ACTIVE, constraints: "one of {ACTIVE, SUSPENDED, CLOSED}" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the owning account" }
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; null for individual vehicles", default: null }
      - { name: make_model, type: string, source: input, description: "Vehicle make/model label" }
      - { name: fuel_type, type: enum, source: input, description: "Required fuel grade: REGULAR | PREMIUM | DIESEL", constraints: "one of {REGULAR, PREMIUM, DIESEL}" }
      - { name: tank_capacity_gallons, type: number, source: input, description: "Total tank capacity in gallons", constraints: "> 0" }
      - { name: current_fuel_level_gallons, type: number, source: input, default: 0, description: "Approximate current fuel level; updated by delivery" }
      - { name: monthly_spend_cap_cents, type: integer, source: input, default: 0, description: "Per-vehicle period spend cap; 0 means unlimited (individual vehicles)" }
      - { name: committed_spend_cents, type: integer, source: computed, default: 0, description: "Order totals reserved by non-terminal orders on this vehicle" }
      - { name: settled_spend_cents, type: integer, source: computed, default: 0, description: "Order totals of DELIVERED orders on this vehicle this period" }
      - { name: remaining_budget_cents, type: integer, source: computed, description: "monthly_spend_cap_cents - committed_spend_cents - settled_spend_cents (only meaningful when cap > 0)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "one of {ACTIVE, SUSPENDED}" }

  - name: FuelTruck
    parent: null
    common_fields: true
    fields:
      - { name: plate, type: string, source: input, description: "Truck plate / identifier" }
      - { name: home_zone, type: enum, source: input, description: "Base service zone: ZONE_A | ZONE_B", constraints: "one of {ZONE_A, ZONE_B}" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ON_ROUTE | MAINTENANCE", default: AVAILABLE, constraints: "one of {AVAILABLE, ON_ROUTE, MAINTENANCE}" }

  - name: TruckCompartment
    parent: FuelTruck
    common_fields: true
    fields:
      - { name: truck_id, type: string, source: system, description: "FK -> FuelTruck.id; parent truck" }
      - { name: fuel_type, type: enum, source: input, description: "Fuel grade stored in this compartment", constraints: "one of {REGULAR, PREMIUM, DIESEL}" }
      - { name: gallons_capacity, type: number, source: input, description: "Compartment tank capacity in gallons", constraints: "> 0" }
      - { name: gallons_onboard, type: number, source: system, default: 0, description: "Physical gallons currently loaded; raised by restock, lowered by dispense" }
      - { name: gallons_reserved, type: number, source: computed, default: 0, description: "Gallons reserved by orders routed on this truck and not yet dispensed/released" }
      - { name: gallons_available, type: number, source: computed, description: "gallons_onboard - gallons_reserved; never negative" }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: truck_id, type: string, source: input, description: "FK -> FuelTruck.id; the truck running this route" }
      - { name: assigned_driver_id, type: string, source: input, description: "Opaque Driver user id permitted to execute stops on this route" }
      - { name: zone, type: enum, source: input, description: "Service zone this route covers: ZONE_A | ZONE_B", constraints: "one of {ZONE_A, ZONE_B}" }
      - { name: window_start, type: datetime, source: input, description: "Route service window start (ISO 8601 UTC), half-open lower bound" }
      - { name: window_end, type: datetime, source: input, description: "Route service window end (ISO 8601 UTC), half-open upper bound (exclusive)" }
      - { name: max_stops, type: integer, source: input, default: 8, description: "Maximum orders assignable to this route", constraints: ">= 1" }
      - { name: stop_count, type: integer, source: computed, default: 0, description: "Count of orders currently assigned (status ROUTED/EN_ROUTE/ARRIVED)" }
      - { name: status, type: enum, source: system, description: "PLANNING | DISPATCHED | COMPLETED | CANCELLED", default: PLANNING, constraints: "one of {PLANNING, DISPATCHED, COMPLETED, CANCELLED}" }

  - name: DeliveryOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the ordering account" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; the vehicle to fuel" }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; set for member (per-membership) pricing, null for per-fill", default: null }
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; set for fleet orders, null otherwise", default: null }
      - { name: route_id, type: string, source: system, description: "FK -> DeliveryRoute.id; assigned by dispatch, null while SCHEDULED", default: null }
      - { name: fuel_type, type: enum, source: computed, description: "Copied from Vehicle.fuel_type at creation", constraints: "one of {REGULAR, PREMIUM, DIESEL}" }
      - { name: zone, type: enum, source: input, description: "Delivery zone: ZONE_A | ZONE_B", constraints: "one of {ZONE_A, ZONE_B}" }
      - { name: delivery_address, type: string, source: input, description: "Free-text parking/delivery location" }
      - { name: requested_gallons, type: number, source: input, description: "Gallons requested; must fit tank headroom", constraints: "> 0" }
      - { name: is_priority, type: boolean, source: input, default: false, description: "Priority delivery window flag; adds a surcharge" }
      - { name: delivery_window_start, type: datetime, source: input, description: "Requested delivery window start (ISO 8601 UTC)" }
      - { name: delivery_window_end, type: datetime, source: input, description: "Requested delivery window end (ISO 8601 UTC)" }
      - { name: dispensed_gallons, type: number, source: system, default: null, description: "Actual gallons dispensed at delivery; set on deliver" }
      - { name: locked_price_per_gallon_cents, type: integer, source: system, description: "Fuel price per gallon captured at order creation" }
      - { name: estimated_fuel_cost_cents, type: integer, source: computed, description: "Provisional dual-variant: requested_gallons * price-at-creation" }
      - { name: final_fuel_cost_cents, type: integer, source: computed, default: null, description: "Final dual-variant: dispensed_gallons * effective delivery price; set on deliver" }
      - { name: service_fee_cents, type: integer, source: computed, description: "Tiered per-fill / membership delivery fee plus priority surcharge" }
      - { name: addon_total_cents, type: integer, source: computed, default: 0, description: "Sum of AddOnService.charged_price_cents for this order" }
      - { name: membership_discount_cents, type: integer, source: computed, default: 0, description: "Per-gallon member fuel discount applied at delivery" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Provisional order total at creation (uses estimated_fuel_cost_cents)" }
      - { name: total_cost_cents, type: integer, source: computed, default: null, description: "Final order total at delivery (uses final_fuel_cost_cents); set on deliver" }
      - { name: payment_status, type: enum, source: system, description: "UNCHARGED | CHARGED", default: UNCHARGED, constraints: "one of {UNCHARGED, CHARGED}" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ROUTED | EN_ROUTE | ARRIVED | DELIVERED | UNABLE_TO_ACCESS | CANCELLED", default: SCHEDULED, constraints: "one of {SCHEDULED, ROUTED, EN_ROUTE, ARRIVED, DELIVERED, UNABLE_TO_ACCESS, CANCELLED}" }

  - name: AddOnService
    parent: DeliveryOrder
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> DeliveryOrder.id; parent order" }
      - { name: addon_type, type: enum, source: input, description: "CAR_WASH | OIL_CHANGE", constraints: "one of {CAR_WASH, OIL_CHANGE}" }
      - { name: list_price_cents, type: integer, source: system, description: "Catalog price for the add-on type" }
      - { name: charged_price_cents, type: integer, source: computed, description: "list_price_cents after member add-on discount" }

  - name: FuelPrice
    parent: null
    common_fields: false
    fields:
      - { name: fuel_type, type: enum, source: input, description: "REGULAR | PREMIUM | DIESEL", constraints: "one of {REGULAR, PREMIUM, DIESEL}" }
      - { name: zone, type: enum, source: input, description: "ZONE_A | ZONE_B", constraints: "one of {ZONE_A, ZONE_B}" }
      - { name: price_per_gallon_cents, type: integer, source: input, description: "Posted price per gallon in cents", constraints: "> 0" }
      - { name: effective_date, type: datetime, source: input, description: "Instant from which this price applies (ISO 8601 UTC)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Membership: cyclic (pause/resume loop + past-due/recover loop) -------
  - entity: Membership
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /memberships/{id}/pause"
        actor: Member
        preconditions: ["Membership.status == ACTIVE"]
        side_effects: ["Member orders cannot be created while PAUSED (state precondition on order create)"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /memberships/{id}/resume"
        actor: Member
        preconditions: ["Membership.status == PAUSED"]
        side_effects: []
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /memberships/{id}/renew-charge with outcome=FAILED"
        actor: BillingOfficer
        preconditions: ["Membership.status == ACTIVE", "current logical clock >= current_period_end"]
        side_effects:
          - "final_settlement_charge_cents computed for the closing period (fee minus unused-delivery credit)"
          - "Member orders cannot be created while PAST_DUE (state precondition on order create)"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /memberships/{id}/renew-charge with outcome=SUCCEEDED"
        actor: BillingOfficer
        preconditions: ["Membership.status == PAST_DUE"]
        side_effects:
          - "current_period_start advances to prior current_period_end; current_period_end recomputed"
          - "deliveries_used_this_period reset to 0"
          - "estimated_next_charge_cents recomputed = monthly_fee_cents"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /memberships/{id}/renew-charge with outcome=SUCCEEDED"
        actor: BillingOfficer
        preconditions: ["Membership.status == ACTIVE", "current logical clock >= current_period_end"]
        note: "Successful renewal from ACTIVE stays ACTIVE (self-loop), rolls the period forward."
        side_effects:
          - "final_settlement_charge_cents computed for the closing period"
          - "current_period_start advances to prior current_period_end; current_period_end recomputed"
          - "deliveries_used_this_period reset to 0"
      - from: [ACTIVE, PAUSED, PAST_DUE]
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Member
        preconditions: []
        side_effects:
          - "final_settlement_charge_cents computed for the open period (fee minus unused-delivery credit)"
          - "CASCADE: every SCHEDULED or ROUTED DeliveryOrder with this membership_id transitions to CANCELLED"
          - "(each cascaded order cancel itself releases fuel reservation and fleet/vehicle budget commit per Order CANCELLED side effects)"

  # ---- DeliveryOrder: cyclic (reschedule loop) -----------------------------
  - entity: DeliveryOrder
    field: status
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ROUTED
        trigger: "POST /orders/{id}/assign-route"
        actor: Dispatcher
        preconditions:
          - "DeliveryOrder.status == SCHEDULED"
          - "DeliveryRoute.status == PLANNING (cross-entity: Order->Route)"
          - "DeliveryRoute.zone == DeliveryOrder.zone"
          - "DeliveryRoute.stop_count < DeliveryRoute.max_stops"
          - "Truck compartment of matching fuel_type has gallons_available >= requested_gallons"
        side_effects:
          - "route_id set; DeliveryRoute.stop_count += 1"
          - "reserve requested_gallons on the truck's matching-fuel compartment: gallons_reserved += requested_gallons"
      - from: ROUTED
        to: EN_ROUTE
        trigger: "system: DeliveryRoute dispatched (POST /routes/{id}/dispatch)"
        actor: system
        preconditions: ["DeliveryOrder.status == ROUTED"]
        side_effects: []
      - from: EN_ROUTE
        to: ARRIVED
        trigger: "POST /orders/{id}/arrive"
        actor: Driver
        preconditions: ["DeliveryOrder.status == EN_ROUTE", "caller is route.assigned_driver_id"]
        side_effects: []
      - from: ARRIVED
        to: DELIVERED
        trigger: "POST /orders/{id}/deliver"
        actor: Driver
        preconditions:
          - "DeliveryOrder.status == ARRIVED"
          - "caller is route.assigned_driver_id"
          - "dispensed_gallons <= requested_gallons"
          - "dispensed_gallons <= vehicle tank headroom (tank_capacity_gallons - current_fuel_level_gallons)"
        side_effects:
          - "dispensed_gallons recorded; final_fuel_cost_cents, membership_discount_cents, total_cost_cents computed; payment_status -> CHARGED"
          - "Vehicle.current_fuel_level_gallons += dispensed_gallons"
          - "compartment gallons_onboard -= dispensed_gallons; gallons_reserved -= (original requested_gallons reservation)"
          - "if member order: Membership.deliveries_used_this_period += 1"
          - "CASCADE(depth>=3): Vehicle.committed_spend_cents -= order estimate, Vehicle.settled_spend_cents += total_cost_cents; if Vehicle.settled_spend_cents >= Vehicle.monthly_spend_cap_cents (cap>0) then Vehicle.status -> SUSPENDED; that suspension increments FleetAccount.suspended_vehicle_count and decrements active_vehicle_count; if FleetAccount.active_vehicle_count reaches 0 then FleetAccount.status -> SUSPENDED"
          - "for fleet order: FleetAccount.committed_budget_cents -= order estimate, FleetAccount.settled_budget_cents += total_cost_cents"
      - from: ARRIVED
        to: UNABLE_TO_ACCESS
        trigger: "POST /orders/{id}/report-unable-access"
        actor: Driver
        preconditions: ["DeliveryOrder.status == ARRIVED", "caller is route.assigned_driver_id"]
        side_effects:
          - "removed from route: DeliveryRoute.stop_count -= 1; route_id set to null"
          - "compartment gallons_reserved -= requested_gallons (reservation released)"
      - from: UNABLE_TO_ACCESS
        to: SCHEDULED
        trigger: "POST /orders/{id}/reschedule"
        actor: [Member, FleetManager]
        preconditions: ["DeliveryOrder.status == UNABLE_TO_ACCESS"]
        note: "Cyclic return to SCHEDULED so the order can be re-routed onto a later route."
        side_effects:
          - "new delivery_window_start / delivery_window_end applied from request"
          - "locked_price_per_gallon_cents and estimated_fuel_cost_cents recomputed at the current clock price"
      - from: [SCHEDULED, ROUTED, UNABLE_TO_ACCESS]
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: [Member, FleetManager, Dispatcher]
        preconditions: ["DeliveryOrder.status in {SCHEDULED, ROUTED, UNABLE_TO_ACCESS}"]
        side_effects:
          - "if ROUTED: DeliveryRoute.stop_count -= 1 and compartment gallons_reserved -= requested_gallons (reservation released)"
          - "Vehicle.committed_spend_cents -= order estimate (budget commit released)"
          - "if fleet order: FleetAccount.committed_budget_cents -= order estimate"

  # ---- DeliveryRoute: branching (plan -> dispatch -> complete, or cancel) ---
  - entity: DeliveryRoute
    field: status
    initial_state: PLANNING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNING
        to: DISPATCHED
        trigger: "POST /routes/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "DeliveryRoute.status == PLANNING"
          - "FuelTruck.status == AVAILABLE (cross-entity: Route->Truck)"
          - "DeliveryRoute.stop_count >= 1"
        side_effects:
          - "FuelTruck.status -> ON_ROUTE"
          - "every assigned order (status ROUTED) transitions to EN_ROUTE"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /routes/{id}/complete"
        actor: Dispatcher
        preconditions:
          - "DeliveryRoute.status == DISPATCHED"
          - "no assigned order is still EN_ROUTE or ARRIVED (all DELIVERED / UNABLE_TO_ACCESS / removed)"
        side_effects: ["FuelTruck.status -> AVAILABLE"]
      - from: [PLANNING, DISPATCHED]
        to: CANCELLED
        trigger: "POST /routes/{id}/cancel"
        actor: Dispatcher
        preconditions: ["DeliveryRoute.status in {PLANNING, DISPATCHED}"]
        side_effects:
          - "if truck was ON_ROUTE for this route: FuelTruck.status -> AVAILABLE"
          - "CASCADE: each assigned order (ROUTED or EN_ROUTE) returns to SCHEDULED; stop_count -> 0; each such order releases its compartment reservation (gallons_reserved -= requested_gallons)"

  # ---- Vehicle: cyclic (suspend/reactivate) --------------------------------
  - entity: Vehicle
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vehicles/{id}/suspend or system (settled_spend >= monthly_spend_cap)"
        actor: [FleetManager, system]
        preconditions: ["Vehicle.status == ACTIVE"]
        side_effects:
          - "if vehicle belongs to a FleetAccount: FleetAccount.suspended_vehicle_count += 1, active_vehicle_count -= 1"
          - "new DeliveryOrders on this vehicle are blocked (state precondition on order create)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vehicles/{id}/reactivate"
        actor: FleetManager
        preconditions: ["Vehicle.status == SUSPENDED"]
        side_effects:
          - "if vehicle belongs to a FleetAccount: FleetAccount.suspended_vehicle_count -= 1, active_vehicle_count += 1; if FleetAccount was SUSPENDED and now active_vehicle_count >= 1 it may be reactivated separately"

  # ---- FuelTruck: cyclic (available/on-route/maintenance) ------------------
  - entity: FuelTruck
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_ROUTE
        trigger: "system: route dispatched"
        actor: system
        preconditions: ["FuelTruck.status == AVAILABLE"]
        side_effects: []
      - from: ON_ROUTE
        to: AVAILABLE
        trigger: "system: route completed or cancelled"
        actor: system
        preconditions: ["FuelTruck.status == ON_ROUTE"]
        side_effects: []
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /trucks/{id}/maintenance with in_maintenance=true"
        actor: PlatformAdmin
        preconditions: ["FuelTruck.status == AVAILABLE"]
        side_effects: []
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /trucks/{id}/maintenance with in_maintenance=false"
        actor: PlatformAdmin
        preconditions: ["FuelTruck.status == MAINTENANCE"]
        side_effects: []

  # ---- FleetAccount: cyclic (active/suspended) with close terminal ---------
  - entity: FleetAccount
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (active_vehicle_count reaches 0) or POST /fleet-accounts/{id}/suspend"
        actor: [system, PlatformAdmin]
        preconditions: ["FleetAccount.status == ACTIVE"]
        side_effects: ["new fleet orders blocked (state precondition on order create)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fleet-accounts/{id}/reactivate"
        actor: PlatformAdmin
        preconditions: ["FleetAccount.status == SUSPENDED"]
        side_effects: []
      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /fleet-accounts/{id}/close"
        actor: PlatformAdmin
        preconditions: ["no non-terminal DeliveryOrder references this fleet_account_id"]
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on FleetAccount.version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: fleet-account-update-stale-version
    parent_entity: FleetAccount
    write_endpoint: "PATCH /fleet-accounts/{id}"
    occ_field: "expected_fleet_account_version"
    description: |
      Updating a FleetAccount's controls (budget cap, allowed fuel types, allowed
      add-ons) against a version that has advanced since the client last read the
      account is rejected. A plain field overwrite is not gated by any state
      precondition, so without version checking a second update would silently
      clobber the first (lost update). OCC reduces this to a stale-version check
      triggerable by two strictly sequential requests.
    error_id: ERR_STALE_FLEET_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: current_fuel_price_selection
    trigger: "order creation (lock price); order reschedule (re-lock); delivery for non-locked orders"
    algorithm: selector_policy
    formula: |
      Candidate set: FuelPrice rows where fuel_type == order.fuel_type
                     AND zone == order.zone
                     AND effective_date <= current_logical_clock.
      Ranking: effective_date DESC (most recent applicable price first).
      Tie-break: created_at DESC (later-registered price wins when effective_date ties).
      Fallback: empty candidate set -> reject with ERR_NO_FUEL_PRICE_AVAILABLE.
      Chosen row's price_per_gallon_cents is the selected price.
    input_set: "All FuelPrice rows matching (fuel_type, zone) with effective_date at or before the clock."
    precision: "integer cents; no rounding in selection"

  - name: order_fuel_cost
    trigger: "creation computes estimated variant; POST /orders/{id}/deliver computes final variant"
    algorithm: dual_variant_pricing
    formula: |
      locked_price_per_gallon_cents := current_fuel_price_selection at creation clock.
      ESTIMATED (creation): estimated_fuel_cost_cents = round_half_up(requested_gallons * locked_price_per_gallon_cents)
      FINAL (delivery):
        effective_price = locked_price_per_gallon_cents
                          IF (order.membership_id is not null AND that Membership.price_lock_enabled == true)
                          ELSE current_fuel_price_selection at the delivery clock.
        final_fuel_cost_cents = round_half_up(dispensed_gallons * effective_price)
    input_set: "Single order; requested_gallons vs dispensed_gallons; locked vs delivery-time price."
    constants: {}
    precision: "2-place cents via round_half_up on the gallons*price product"
    variants:
      - name: estimated
        when: "order creation (requested_gallons, price-at-creation)"
        difference: "uses requested_gallons and the creation-time locked price"
      - name: final
        when: "delivery (dispensed_gallons, price-lock-aware effective price)"
        difference: "uses dispensed_gallons and, for non-price-locked orders, the delivery-time price; diverges from estimated whenever dispensed != requested or the price moved"

  - name: membership_period_charge
    trigger: "read (provisional); POST /memberships/{id}/renew-charge or /cancel (final)"
    algorithm: dual_variant_billing
    formula: |
      unused_deliveries = max(0, included_deliveries - deliveries_used_this_period)
      PROVISIONAL: estimated_next_charge_cents = monthly_fee_cents
                   (bills the full recurring fee, ignores unused-delivery credit)
      FINAL:       final_settlement_charge_cents = monthly_fee_cents
                                        - (unused_deliveries * UNUSED_DELIVERY_CREDIT_CENTS)
                   (never below 0; credit for deliveries the member paid for but did not use)
    input_set: "Single Membership: monthly_fee_cents, included_deliveries, deliveries_used_this_period."
    constants:
      UNUSED_DELIVERY_CREDIT_CENTS: 400
      MEMBERSHIP_PERIOD_DAYS: 30   # current_period_end = current_period_start + 30 days
    precision: "integer cents; final clamped at >= 0"
    variants:
      - name: provisional
        when: "any read before the period is settled"
        difference: "full monthly_fee_cents, no credit"
      - name: final
        when: "renewal or cancellation settles the closing period"
        difference: "subtracts unused-delivery credit; diverges from provisional whenever deliveries_used_this_period < included_deliveries"

  - name: service_fee
    trigger: "POST /orders/{id}/deliver (final); order creation (provisional estimate)"
    algorithm: tiered_conditional
    formula: |
      # >= 3 inputs with conditional branches (membership presence, usage tier, priority flag)
      if order.membership_id is not null:               # member (per-membership) pricing
          if Membership.deliveries_used_this_period < Membership.included_deliveries:
              base = 0                                   # covered by plan
          else:
              base = MEMBER_OVERAGE_FEE_CENTS            # plan quota exhausted
      else:                                              # per-fill (non-member / fleet)
          base = BASE_DELIVERY_FEE_CENTS
      surcharge = PRIORITY_SURCHARGE_CENTS if order.is_priority else 0
      service_fee_cents = base + surcharge
      # deliveries_used_this_period is read BEFORE this order's own increment; the
      # (included_deliveries)-th member delivery in a period is the last free one.
    input_set: "Single order + its Membership counters; boundary at deliveries_used == included_deliveries."
    constants:
      BASE_DELIVERY_FEE_CENTS: 1200
      MEMBER_OVERAGE_FEE_CENTS: 600
      PRIORITY_SURCHARGE_CENTS: 500
    precision: "integer cents"

  - name: addon_charged_price
    trigger: "POST /orders/{id}/addons (add-on attached)"
    algorithm: percentage_discount
    formula: |
      list_price_cents = CAR_WASH_PRICE_CENTS if addon_type == CAR_WASH else OIL_CHANGE_PRICE_CENTS
      if order.membership_id is not null:
          charged_price_cents = round_half_up(list_price_cents * (1 - MEMBER_ADDON_DISCOUNT_PCT))
      else:
          charged_price_cents = list_price_cents
    input_set: "Single AddOnService line; per-line member discount. Catalog prices are chosen so the 10% member discount yields a half-cent (x.5) that rounds up, making per-line rounding observably diverge from round-once."
    constants:
      CAR_WASH_PRICE_CENTS: 1595
      OIL_CHANGE_PRICE_CENTS: 6495
      MEMBER_ADDON_DISCOUNT_PCT: 0.10
    precision: "round_half_up per add-on line"

  - name: order_total
    trigger: "order creation (estimated_total); POST /orders/{id}/deliver (total_cost)"
    algorithm: nested_rounding_sum
    formula: |
      # Rounding order is PINNED: round each component line to whole cents FIRST,
      # THEN sum the already-rounded lines. Do NOT sum raw products and round once.
      #   fuel line   = order_fuel_cost (already round_half_up)
      #   service line= service_fee (integer)
      #   addon line  = addon_total_cents = SUM over add-ons of addon_charged_price
      #                 (each add-on rounded, then summed — never round(sum * (1-disc)))
      #   discount    = membership_discount_cents (see below, already rounded)
      #
      # membership_discount_cents (member orders only, else 0):
      #   estimate:  round_half_up(requested_gallons * MEMBER_DISCOUNT_PER_GALLON_CENTS)
      #   final:     round_half_up(dispensed_gallons * MEMBER_DISCOUNT_PER_GALLON_CENTS)
      #
      # estimated_total_cents = estimated_fuel_cost_cents + service_fee_cents
      #                         + addon_total_cents - membership_discount_cents(estimate)
      # total_cost_cents      = final_fuel_cost_cents + service_fee_cents
      #                         + addon_total_cents - membership_discount_cents(final)
      # total_cost_cents clamped at >= 0.
    input_set: "Single order: its fuel line, service line, per-line-rounded add-on total, member discount."
    constants:
      MEMBER_DISCOUNT_PER_GALLON_CENTS: 10
    precision: "each line round_half_up independently, then integer sum; total clamped >= 0"

  - name: vehicle_budget_conservation
    trigger: "order create/cancel/deliver; vehicle suspend/reactivate"
    algorithm: conservation_law
    formula: |
      For every Vehicle with monthly_spend_cap_cents > 0:
        committed_spend_cents + settled_spend_cents + remaining_budget_cents
          == monthly_spend_cap_cents
      committed_spend_cents and settled_spend_cents are each >= 0.
      Compensating pair: order creation commits estimated_total_cents to committed_spend_cents;
      order cancellation releases exactly that same estimated_total_cents. A create+cancel
      round trip leaves remaining_budget_cents unchanged (conserved quantity: budget cents).
      The parallel account-level law holds on FleetAccount:
        committed_budget_cents + settled_budget_cents + remaining_budget_cents
          == monthly_budget_cap_cents
    input_set: "Per-vehicle and per-fleet-account budget triad."
    precision: "integer cents; exact"

  - name: fuel_reservation_conservation
    trigger: "order assign-route (reserve); order cancel/report-unable-access/route-cancel (release); order deliver (dispense); truck restock"
    algorithm: conservation_law
    formula: |
      For every TruckCompartment:
        gallons_reserved + gallons_available == gallons_onboard
      gallons_available and gallons_reserved are each >= 0.
      Compensating pair: assign-route reserves requested_gallons (gallons_reserved += g);
      report-unable-access / cancel / route-cancel releases exactly requested_gallons
      (gallons_reserved -= g). A reserve+release round trip leaves gallons_available
      unchanged (conserved quantity: onboard gallons). gallons_onboard changes only on
      restock (+) and delivery dispense (-).
    input_set: "Per-compartment gallon triad."
    precision: "gallons to 1 decimal place; exact bookkeeping"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation; entity_backed role acting on a resource it does not own is denied"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body-referenced resources exist (validated left-to-right); unknown id -> not found"
    error_id: "ERR_CUSTOMER_NOT_FOUND / ERR_MEMBERSHIP_NOT_FOUND / ERR_FLEET_ACCOUNT_NOT_FOUND / ERR_VEHICLE_NOT_FOUND / ERR_TRUCK_NOT_FOUND / ERR_ROUTE_NOT_FOUND / ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path or FK ids

  - priority: 4
    category: state
    check: "Target/related resource in a valid state: order create requires Vehicle.status==ACTIVE and (member) Membership.status==ACTIVE and (fleet) FleetAccount.status==ACTIVE; route dispatch requires Truck.status==AVAILABLE; each action requires its from-state"
    error_id: "ERR_VEHICLE_SUSPENDED / ERR_MEMBERSHIP_NOT_ACTIVE / ERR_FLEET_ACCOUNT_SUSPENDED / ERR_TRUCK_UNAVAILABLE / ERR_INVALID_ORDER_STATE / ERR_INVALID_ROUTE_STATE / ERR_INVALID_MEMBERSHIP_STATE"
    http_status: 409
    applies_to: state-changing operations

  - priority: 5
    category: business_referential
    check: "Cross-reference validity: for fleet orders fuel_type (copied from the vehicle) must be in FleetAccount.allowed_fuel_types and each add-on type in allowed_addons; a fuel price must exist for (fuel_type, zone); route assignment requires Route.zone == Order.zone"
    error_id: "ERR_FUEL_TYPE_NOT_ALLOWED / ERR_ADDON_NOT_ALLOWED / ERR_NO_FUEL_PRICE_AVAILABLE / ERR_ROUTE_ZONE_MISMATCH"
    http_status: 422
    applies_to: order create, add-on create, assign-route

  - priority: 6
    category: business_safety
    check: "Requested/dispensed gallons must not exceed tank headroom (tank_capacity_gallons - current_fuel_level_gallons); dispensed_gallons must not exceed requested_gallons"
    error_id: "ERR_EXCEEDS_TANK_CAPACITY / ERR_DISPENSE_EXCEEDS_REQUESTED"
    http_status: 422
    applies_to: order create, order deliver

  - priority: 7
    category: business_temporal
    check: "No temporal overlap: a truck may not run two routes with overlapping [window_start, window_end) (half-open; touching endpoints where one end == other start do NOT overlap); a vehicle may not have two non-terminal orders whose delivery windows are within SERVICE_BUFFER_MINUTES (= 60) of each other, i.e. the gap between the closer endpoints must be >= 60 minutes (closed interval + buffer)"
    error_id: "ERR_TRUCK_ROUTE_OVERLAP / ERR_VEHICLE_WINDOW_CONFLICT"
    http_status: 409
    applies_to: route create, order create

  - priority: 8
    category: business_constraint
    check: "Capacity/quota constraints: route assignment requires stop_count < max_stops; compartment must hold enough available gallons"
    error_id: "ERR_ROUTE_AT_CAPACITY / ERR_INSUFFICIENT_COMPARTMENT_FUEL"
    http_status: 409
    applies_to: assign-route

  - priority: 9
    category: business_fiscal
    check: "Budget: estimated order total must not push Vehicle.settled+committed over monthly_spend_cap (cap>0), nor FleetAccount.settled+committed over monthly_budget_cap"
    error_id: "ERR_VEHICLE_BUDGET_EXCEEDED / ERR_FLEET_BUDGET_EXCEEDED"
    http_status: 402
    applies_to: order create (fleet/capped vehicles)

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customers ----
  - method: POST
    path: "/customers"
    description: "Register a customer (INDIVIDUAL or FLEET)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, email, customer_type]
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers"
    description: "List customers"
    roles: [PlatformAdmin, BillingOfficer]
    code: 200
    input: ["customer_type?", "status?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [PlatformAdmin, BillingOfficer, FleetManager, Member]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Memberships ----
  - method: POST
    path: "/memberships"
    description: "Subscribe an individual customer to a membership"
    roles: [Member]
    code: 201
    input: [customer_id, tier, monthly_fee_cents, included_deliveries, "price_lock_enabled?"]
    output: Membership
    side_effects: ["status=ACTIVE", "current_period_start=clock; current_period_end=start+30d", "estimated_next_charge_cents=monthly_fee_cents"]
  - method: GET
    path: "/memberships"
    description: "List memberships (filter by customer_id)"
    roles: [Member, BillingOfficer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "Membership[]"
    side_effects: []
  - method: GET
    path: "/memberships/{id}"
    description: "Get a membership"
    roles: [Member, BillingOfficer, PlatformAdmin]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: POST
    path: "/memberships/{id}/pause"
    description: "Pause an active membership"
    roles: [Member]
    code: 200
    input: []
    output: Membership
    side_effects: ["status ACTIVE -> PAUSED"]
  - method: POST
    path: "/memberships/{id}/resume"
    description: "Resume a paused membership"
    roles: [Member]
    code: 200
    input: []
    output: Membership
    side_effects: ["status PAUSED -> ACTIVE"]
  - method: POST
    path: "/memberships/{id}/cancel"
    description: "Cancel a membership"
    roles: [Member]
    code: 200
    input: []
    output: Membership
    side_effects: ["status -> CANCELLED", "final_settlement_charge_cents computed", "CASCADE: SCHEDULED/ROUTED orders on this membership -> CANCELLED (releasing reservations/commits)"]
  - method: POST
    path: "/memberships/{id}/renew-charge"
    description: "Billing officer settles the period and rolls it forward (or marks PAST_DUE)"
    roles: [BillingOfficer]
    code: 200
    input: [outcome]
    output: Membership
    side_effects: ["final_settlement_charge_cents computed for closing period", "SUCCEEDED: advance period, reset deliveries_used_this_period=0; FAILED: status -> PAST_DUE"]

  # ---- Fleet Accounts ----
  - method: POST
    path: "/fleet-accounts"
    description: "Create a fleet account for a FLEET customer"
    roles: [FleetManager]
    code: 201
    input: [customer_id, monthly_budget_cap_cents, allowed_fuel_types, allowed_addons]
    output: FleetAccount
    side_effects: ["status=ACTIVE", "committed/settled=0"]
  - method: GET
    path: "/fleet-accounts"
    description: "List fleet accounts (filter by customer_id)"
    roles: [FleetManager, PlatformAdmin, BillingOfficer]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "FleetAccount[]"
    side_effects: []
  - method: GET
    path: "/fleet-accounts/{id}"
    description: "Get a fleet account"
    roles: [FleetManager, PlatformAdmin, BillingOfficer]
    code: 200
    input: []
    output: FleetAccount
    side_effects: []
  - method: PATCH
    path: "/fleet-accounts/{id}"
    description: "Update fleet controls (OCC-guarded by expected_fleet_account_version)"
    roles: [FleetManager]
    code: 200
    input: [expected_fleet_account_version, "monthly_budget_cap_cents?", "allowed_fuel_types?", "allowed_addons?"]
    output: FleetAccount
    side_effects: ["applies provided fields", "increments FleetAccount.version by 1"]
  - method: POST
    path: "/fleet-accounts/{id}/suspend"
    description: "Suspend a fleet account"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FleetAccount
    side_effects: ["status ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/fleet-accounts/{id}/reactivate"
    description: "Reactivate a suspended fleet account"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FleetAccount
    side_effects: ["status SUSPENDED -> ACTIVE"]
  - method: POST
    path: "/fleet-accounts/{id}/close"
    description: "Close a fleet account (no non-terminal orders)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FleetAccount
    side_effects: ["status -> CLOSED"]

  # ---- Vehicles ----
  - method: POST
    path: "/vehicles"
    description: "Register a vehicle for an individual or fleet customer"
    roles: [Member, FleetManager]
    code: 201
    input: [customer_id, make_model, fuel_type, tank_capacity_gallons, "fleet_account_id?", "current_fuel_level_gallons?", "monthly_spend_cap_cents?"]
    output: Vehicle
    side_effects: ["status=ACTIVE", "if fleet-linked: FleetAccount.active_vehicle_count += 1"]
  - method: GET
    path: "/vehicles"
    description: "List vehicles (filter by customer_id, fleet_account_id)"
    roles: [Member, FleetManager, Dispatcher, PlatformAdmin]
    code: 200
    input: ["customer_id?", "fleet_account_id?", "status?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []
  - method: GET
    path: "/vehicles/{id}"
    description: "Get a vehicle"
    roles: [Member, FleetManager, Dispatcher, PlatformAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: POST
    path: "/vehicles/{id}/suspend"
    description: "Suspend a vehicle"
    roles: [FleetManager]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["status ACTIVE -> SUSPENDED", "if fleet-linked: FleetAccount.suspended_vehicle_count += 1, active_vehicle_count -= 1"]
  - method: POST
    path: "/vehicles/{id}/reactivate"
    description: "Reactivate a suspended vehicle"
    roles: [FleetManager]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["status SUSPENDED -> ACTIVE", "if fleet-linked: FleetAccount.suspended_vehicle_count -= 1, active_vehicle_count += 1"]

  # ---- Fuel Trucks & Compartments ----
  - method: POST
    path: "/trucks"
    description: "Create a fuel truck"
    roles: [PlatformAdmin]
    code: 201
    input: [plate, home_zone]
    output: FuelTruck
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/trucks"
    description: "List fuel trucks"
    roles: [PlatformAdmin, Dispatcher, Driver]
    code: 200
    input: ["status?", "home_zone?", "limit?", "offset?"]
    output: "FuelTruck[]"
    side_effects: []
  - method: GET
    path: "/trucks/{id}"
    description: "Get a fuel truck"
    roles: [PlatformAdmin, Dispatcher, Driver]
    code: 200
    input: []
    output: FuelTruck
    side_effects: []
  - method: POST
    path: "/trucks/{id}/maintenance"
    description: "Toggle a truck in/out of maintenance"
    roles: [PlatformAdmin]
    code: 200
    input: [in_maintenance]
    output: FuelTruck
    side_effects: ["AVAILABLE <-> MAINTENANCE"]
  - method: POST
    path: "/trucks/{id}/compartments"
    description: "Add a fuel compartment to a truck"
    roles: [PlatformAdmin]
    code: 201
    input: [fuel_type, gallons_capacity, "gallons_onboard?"]
    output: TruckCompartment
    side_effects: ["gallons_reserved=0; gallons_available=gallons_onboard"]
  - method: GET
    path: "/trucks/{id}/compartments"
    description: "List a truck's compartments (reverse lookup for TruckCompartment.truck_id)"
    roles: [PlatformAdmin, Dispatcher, Driver]
    code: 200
    input: []
    output: "TruckCompartment[]"
    side_effects: []
  - method: POST
    path: "/trucks/{id}/restock"
    description: "Add gallons to a compartment"
    roles: [PlatformAdmin]
    code: 200
    input: [compartment_id, gallons]
    output: TruckCompartment
    side_effects: ["gallons_onboard += gallons (must not exceed gallons_capacity)"]

  # ---- Routes ----
  - method: POST
    path: "/routes"
    description: "Create a delivery route for a truck (truck-window overlap checked)"
    roles: [Dispatcher]
    code: 201
    input: [truck_id, assigned_driver_id, zone, window_start, window_end, "max_stops?"]
    output: DeliveryRoute
    side_effects: ["status=PLANNING", "stop_count=0"]
  - method: GET
    path: "/routes"
    description: "List routes (filter by truck_id, status, zone)"
    roles: [Dispatcher, Driver, PlatformAdmin]
    code: 200
    input: ["truck_id?", "status?", "zone?", "limit?", "offset?"]
    output: "DeliveryRoute[]"
    side_effects: []
  - method: GET
    path: "/routes/{id}"
    description: "Get a route"
    roles: [Dispatcher, Driver, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []
  - method: POST
    path: "/routes/{id}/dispatch"
    description: "Dispatch a planned route (requires truck AVAILABLE)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["status PLANNING -> DISPATCHED", "FuelTruck.status -> ON_ROUTE", "assigned orders ROUTED -> EN_ROUTE"]
  - method: POST
    path: "/routes/{id}/complete"
    description: "Complete a dispatched route"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["status DISPATCHED -> COMPLETED", "FuelTruck.status -> AVAILABLE"]
  - method: POST
    path: "/routes/{id}/cancel"
    description: "Cancel a route (returns assigned orders to SCHEDULED)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["status -> CANCELLED", "FuelTruck.status -> AVAILABLE if it was ON_ROUTE", "CASCADE: assigned orders -> SCHEDULED, reservations released, stop_count -> 0"]

  # ---- Delivery Orders ----
  - method: POST
    path: "/orders"
    description: "Create a delivery order (member or fleet or per-fill); locks price and commits budget"
    roles: [Member, FleetManager]
    code: 201
    input: [customer_id, vehicle_id, zone, delivery_address, requested_gallons, delivery_window_start, delivery_window_end, "membership_id?", "fleet_account_id?", "is_priority?"]
    output: DeliveryOrder
    side_effects: ["fuel_type copied from Vehicle", "locked_price_per_gallon_cents + estimated_fuel_cost_cents + estimated_total_cents computed", "Vehicle.committed_spend_cents += estimated_total_cents; fleet: FleetAccount.committed_budget_cents += estimated_total_cents", "status=SCHEDULED"]
  - method: GET
    path: "/orders"
    description: "List orders (filter by customer_id, vehicle_id, membership_id, fleet_account_id, route_id, status)"
    roles: [Member, FleetManager, Dispatcher, Driver, BillingOfficer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "vehicle_id?", "membership_id?", "fleet_account_id?", "route_id?", "status?", "limit?", "offset?"]
    output: "DeliveryOrder[]"
    side_effects: []
  - method: GET
    path: "/orders/{id}"
    description: "Get an order"
    roles: [Member, FleetManager, Dispatcher, Driver, BillingOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []
  - method: POST
    path: "/orders/{id}/assign-route"
    description: "Assign a SCHEDULED order to a PLANNING route; reserves fuel"
    roles: [Dispatcher]
    code: 200
    input: [route_id]
    output: DeliveryOrder
    side_effects: ["status SCHEDULED -> ROUTED", "route_id set; DeliveryRoute.stop_count += 1", "compartment gallons_reserved += requested_gallons"]
  - method: POST
    path: "/orders/{id}/arrive"
    description: "Driver marks arrival at the vehicle"
    roles: [Driver]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["status EN_ROUTE -> ARRIVED"]
  - method: POST
    path: "/orders/{id}/deliver"
    description: "Driver dispenses fuel and completes the order"
    roles: [Driver]
    code: 200
    input: [dispensed_gallons]
    output: DeliveryOrder
    side_effects: ["status ARRIVED -> DELIVERED; payment_status -> CHARGED", "final_fuel_cost_cents, membership_discount_cents, total_cost_cents computed", "Vehicle.current_fuel_level_gallons += dispensed_gallons", "compartment gallons_onboard/gallons_reserved decremented", "member: Membership.deliveries_used_this_period += 1", "CASCADE: vehicle/fleet budget settle; vehicle auto-suspend at cap; fleet auto-suspend at 0 active vehicles"]
  - method: POST
    path: "/orders/{id}/report-unable-access"
    description: "Driver reports the vehicle was inaccessible"
    roles: [Driver]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["status ARRIVED -> UNABLE_TO_ACCESS", "removed from route: stop_count -= 1, route_id=null, compartment reservation released"]
  - method: POST
    path: "/orders/{id}/reschedule"
    description: "Reschedule an UNABLE_TO_ACCESS order back to SCHEDULED with a new window"
    roles: [Member, FleetManager]
    code: 200
    input: [delivery_window_start, delivery_window_end]
    output: DeliveryOrder
    side_effects: ["status UNABLE_TO_ACCESS -> SCHEDULED", "locked_price_per_gallon_cents + estimated_fuel_cost_cents recomputed at current clock price"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a non-dispatched order"
    roles: [Member, FleetManager, Dispatcher]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: ["status -> CANCELLED", "release reservation if ROUTED; release Vehicle.committed_spend_cents (and FleetAccount.committed_budget_cents) by estimated_total_cents"]
  - method: POST
    path: "/orders/{id}/addons"
    description: "Attach an add-on service (car wash / oil change) to an order"
    roles: [Member, FleetManager]
    code: 201
    input: [addon_type]
    output: AddOnService
    side_effects: ["charged_price_cents computed (per-line member discount)", "DeliveryOrder.addon_total_cents recomputed; estimated_total_cents recomputed and re-committed"]
  - method: GET
    path: "/orders/{id}/addons"
    description: "List an order's add-ons (reverse lookup for AddOnService.order_id)"
    roles: [Member, FleetManager, Dispatcher, Driver, BillingOfficer, PlatformAdmin]
    code: 200
    input: []
    output: "AddOnService[]"
    side_effects: []

  # ---- Fuel Prices ----
  - method: POST
    path: "/fuel-prices"
    description: "Post a fuel price for a (fuel_type, zone) effective at a date"
    roles: [PlatformAdmin]
    code: 201
    input: [fuel_type, zone, price_per_gallon_cents, effective_date]
    output: FuelPrice
    side_effects: []
  - method: GET
    path: "/fuel-prices"
    description: "List fuel prices (filter by fuel_type, zone)"
    roles: [PlatformAdmin, Dispatcher, Member, FleetManager]
    code: 200
    input: ["fuel_type?", "zone?", "limit?", "offset?"]
    output: "FuelPrice[]"
    side_effects: []

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # -- request / auth --
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, or invalid enum/type value" }
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID / X-User-Role header missing or invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or entity-backed role acting on a resource it does not own (incl. driver not assigned to the route)" }
  # -- not found --
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_MEMBERSHIP_NOT_FOUND, http: 404, condition: "Membership id does not exist" }
  - { id: ERR_FLEET_ACCOUNT_NOT_FOUND, http: 404, condition: "FleetAccount id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "Vehicle id does not exist" }
  - { id: ERR_TRUCK_NOT_FOUND, http: 404, condition: "FuelTruck id does not exist" }
  - { id: ERR_COMPARTMENT_NOT_FOUND, http: 404, condition: "TruckCompartment id does not exist or does not belong to the truck" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "DeliveryRoute id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "DeliveryOrder id does not exist" }
  # -- state --
  - { id: ERR_VEHICLE_SUSPENDED, http: 409, condition: "Order create on a SUSPENDED vehicle" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "Member order create while membership is PAUSED / PAST_DUE / CANCELLED" }
  - { id: ERR_INVALID_MEMBERSHIP_STATE, http: 409, condition: "Membership pause/resume/renew-charge/cancel from a state the transition does not allow" }
  - { id: ERR_FLEET_ACCOUNT_SUSPENDED, http: 409, condition: "Fleet order create while the FleetAccount is SUSPENDED or CLOSED" }
  - { id: ERR_TRUCK_UNAVAILABLE, http: 409, condition: "Route dispatch when the truck is not AVAILABLE (ON_ROUTE or MAINTENANCE)" }
  - { id: ERR_INVALID_ORDER_STATE, http: 409, condition: "Order action attempted from a state its transition does not allow" }
  - { id: ERR_INVALID_ROUTE_STATE, http: 409, condition: "Route action attempted from a state its transition does not allow" }
  - { id: ERR_FLEET_ACCOUNT_HAS_ACTIVE_ORDERS, http: 409, condition: "Close attempted while non-terminal orders reference the fleet account" }
  # -- referential --
  - { id: ERR_FUEL_TYPE_NOT_ALLOWED, http: 422, condition: "Fleet order fuel_type not in FleetAccount.allowed_fuel_types" }
  - { id: ERR_ADDON_NOT_ALLOWED, http: 422, condition: "Fleet order add-on type not in FleetAccount.allowed_addons" }
  - { id: ERR_NO_FUEL_PRICE_AVAILABLE, http: 422, condition: "No FuelPrice exists for (fuel_type, zone) with effective_date <= clock" }
  - { id: ERR_ROUTE_ZONE_MISMATCH, http: 422, condition: "assign-route where Route.zone != Order.zone" }
  - { id: ERR_CUSTOMER_NOT_FLEET, http: 422, condition: "FleetAccount create for a customer whose customer_type != FLEET" }
  # -- safety --
  - { id: ERR_EXCEEDS_TANK_CAPACITY, http: 422, condition: "requested_gallons (create) or dispensed_gallons (deliver) exceeds tank headroom" }
  - { id: ERR_DISPENSE_EXCEEDS_REQUESTED, http: 422, condition: "dispensed_gallons > requested_gallons at delivery" }
  # -- temporal --
  - { id: ERR_TRUCK_ROUTE_OVERLAP, http: 409, condition: "New route window [start,end) overlaps an existing non-terminal route on the same truck (half-open; adjacency allowed)" }
  - { id: ERR_VEHICLE_WINDOW_CONFLICT, http: 409, condition: "New order delivery window is within SERVICE_BUFFER_MINUTES of another non-terminal order window on the same vehicle (closed + buffer)" }
  # -- constraint --
  - { id: ERR_ROUTE_AT_CAPACITY, http: 409, condition: "assign-route when route stop_count == max_stops" }
  - { id: ERR_INSUFFICIENT_COMPARTMENT_FUEL, http: 409, condition: "At assign-route the truck has no compartment of the order's fuel_type, or the matching compartment gallons_available < requested_gallons" }
  - { id: ERR_COMPARTMENT_OVERFILL, http: 409, condition: "restock would push gallons_onboard above gallons_capacity" }
  # -- fiscal --
  - { id: ERR_VEHICLE_BUDGET_EXCEEDED, http: 402, condition: "estimated order total pushes vehicle settled+committed above monthly_spend_cap (cap>0)" }
  - { id: ERR_FLEET_BUDGET_EXCEEDED, http: 402, condition: "estimated order total pushes fleet settled+committed above monthly_budget_cap" }
  # -- concurrency --
  - { id: ERR_STALE_FLEET_ACCOUNT_VERSION, http: 412, condition: "PATCH /fleet-accounts/{id} with expected_fleet_account_version not equal to the current FleetAccount.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: manages customers, trucks, compartments, fuel prices, the logical clock, and fleet-account lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /customers"
      - "POST /trucks"
      - "POST /trucks/{id}/maintenance"
      - "POST /trucks/{id}/compartments"
      - "POST /trucks/{id}/restock"
      - "POST /fuel-prices"
      - "POST /fleet-accounts/{id}/suspend"
      - "POST /fleet-accounts/{id}/reactivate"
      - "POST /fleet-accounts/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across customers, memberships, fleet-accounts, vehicles, trucks, routes, orders, fuel-prices"

  - name: Dispatcher
    description: "Plans routes, assigns orders to routes, and dispatches/completes/cancels routes."
    identity: opaque
    exclusive_operations:
      - "POST /routes"
      - "POST /routes/{id}/dispatch"
      - "POST /routes/{id}/complete"
      - "POST /routes/{id}/cancel"
      - "POST /orders/{id}/assign-route"
    shared_operations:
      - "POST /orders/{id}/cancel (shared with Member, FleetManager)"
      - "GET reads across vehicles, trucks, routes, orders"

  - name: Driver
    description: "Executes route stops on the route they are assigned to (route.assigned_driver_id == X-User-ID)."
    identity: opaque
    exclusive_operations:
      - "POST /orders/{id}/arrive"
      - "POST /orders/{id}/deliver"
      - "POST /orders/{id}/report-unable-access"
    shared_operations:
      - "GET reads across trucks, routes, orders"

  - name: FleetManager
    description: "Acts as a FLEET Customer: manages the fleet account controls, fleet vehicles, and fleet orders."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /fleet-accounts"
      - "PATCH /fleet-accounts/{id}"
      - "POST /vehicles/{id}/suspend"
      - "POST /vehicles/{id}/reactivate"
    shared_operations:
      - "POST /vehicles (shared with Member)"
      - "POST /orders (shared with Member)"
      - "POST /orders/{id}/reschedule (shared with Member)"
      - "POST /orders/{id}/cancel (shared with Member, Dispatcher)"
      - "POST /orders/{id}/addons (shared with Member)"

  - name: Member
    description: "Acts as an INDIVIDUAL Customer: manages own membership, own vehicles, and own per-fill/member orders."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /memberships"
      - "POST /memberships/{id}/pause"
      - "POST /memberships/{id}/resume"
      - "POST /memberships/{id}/cancel"
    shared_operations:
      - "POST /vehicles (shared with FleetManager)"
      - "POST /orders (shared with FleetManager)"
      - "POST /orders/{id}/reschedule (shared with FleetManager)"
      - "POST /orders/{id}/cancel (shared with FleetManager, Dispatcher)"
      - "POST /orders/{id}/addons (shared with FleetManager)"

  - name: BillingOfficer
    description: "Runs membership period billing and settlement."
    identity: opaque
    exclusive_operations:
      - "POST /memberships/{id}/renew-charge"
    shared_operations:
      - "GET reads across customers, memberships, fleet-accounts, orders"
