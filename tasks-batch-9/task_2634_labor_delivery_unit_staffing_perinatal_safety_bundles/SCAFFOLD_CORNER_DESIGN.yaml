      - name: rework_request_clears_the_findings_and_extends_the_debrief_deadline_by_twenty_four_hours
        claim_type: Side Effect Execution
        grounds:
          - state_machines.NewbornComplicationReview.FINDINGS_SUBMITTED_to_REWORK_REQUESTED
          - entities.NewbornComplicationReview.fields.rework_count
          - entities.NewbornComplicationReview.fields.findings_summary
          - entities.NewbornComplicationReview.fields.contributing_factor_codes
          - entities.NewbornComplicationReview.fields.debrief_scheduled_for_utc
          - entities.NewbornComplicationReview.fields.debrief_held_at
          - entities.NewbornComplicationReview.fields.debrief_due_at
          - endpoints[POST /newborn-complication-reviews/{reviewId}/request-rework]
          - validations[priority=8.1]
          - validations[priority=10]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The cycle edge back out of FINDINGS_SUBMITTED is a COMPENSATION: it must clear all four
          fields the previous lap wrote (findings_summary, contributing_factor_codes,
          debrief_scheduled_for_utc, debrief_held_at) while advancing rework_count to 1 and REWRITING
          debrief_due_at to clock_now + 24h. Because clock_now is 2026-08-02T06:00:00Z, the new
          deadline is 2026-08-03T06:00:00Z — which is EARLIER than the original opened_at + 72h value
          of 2026-08-04T06:00:00Z. An implementation that "extends" by adding 24h to the existing
          deadline yields 2026-08-05T06:00:00Z and is caught; one that leaves the deadline alone
          keeps 2026-08-04T06:00:00Z and is also caught. opened_at must not move.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit with one AVAILABLE LDR bed and three
            credentialled staff: a facilitator RN who never holds a CareAssignment (so the SoD check
            at priority 10 passes at both creation and scheduling), an RN used as the ChargeNurse
            X-User-ID, and a PerinatalSafetyOfficer staff member used as the officer X-User-ID, who is
            NOT the facilitator (so the SoD requester check passes). One ANTEPARTUM encounter with no
            CareAssignments and no SafetyBundleActivations, so the submit-findings precondition
            "every activation CLOSED or RESCINDED" is vacuously satisfied. A review is opened at 06:00
            (debrief_due_at 2026-08-04T06:00:00Z), the debrief is booked for 2026-08-02T06:00:00Z —
            inside the inclusive clock_now..debrief_due_at window — the clock is moved to exactly that
            instant, and findings are submitted, landing the review in FINDINGS_SUBMITTED with
            rework_count still 0.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
