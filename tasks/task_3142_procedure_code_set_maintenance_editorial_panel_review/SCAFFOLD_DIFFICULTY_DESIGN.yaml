          Depth 3 from the licence termination trigger: the termination
          withdraws each released delivery order, that delivery withdrawal is
          what drives the licence's own scope recompute to INTERNAL_ONLY, and
          the territory withdrawal follows the scope recompute rather than the
          original termination.
