              as: ProgramCoordinator
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Slot Two", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T15:00:00.000Z", end_utc: "2026-08-12T16:00:00.000Z", attendance_target: 20, attendance_cap: 20, supply_sku: "KIT-GEN", supply_units_per_attendee: 0, materials_budget_cents: 5000, presenter_fee_budget_cents: 0 }
              as: ProgramCoordinator
              captures: { p2: $.data.id, p2_v: $.data.version }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Slot Three", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T16:00:00.000Z", end_utc: "2026-08-12T17:00:00.000Z", attendance_target: 20, attendance_cap: 20, supply_sku: "KIT-GEN", supply_units_per_attendee: 0, materials_budget_cents: 5000, presenter_fee_budget_cents: 0 }
              as: ProgramCoordinator
              captures: { p3: $.data.id, p3_v: $.data.version }
            - call: "POST /library/programs/${p1}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 0, teardown_minutes: 0, expected_program_version: "${p1_v}" }
              as: ProgramCoordinator
              captures: { resv1: $.data.id }
          trigger:
            - call: "POST /library/programs/${p2}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T15:00:00.000Z", end_utc: "2026-08-12T16:00:00.000Z", setup_minutes: 0, teardown_minutes: 0, expected_program_version: "${p2_v}" }
              as: ProgramCoordinator
              captures: { resv2: $.data.id }
            - call: "POST /library/programs/${p3}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T15:59:00.000Z", end_utc: "2026-08-12T17:00:00.000Z", setup_minutes: 0, teardown_minutes: 0, expected_program_version: "${p3_v}" }
              as: ProgramCoordinator
          assert:
            - "The first trigger call succeeds with HTTP 201: adjacency at exactly 15:00 is not a conflict"
            - "RoomReservation.${resv1}.occupancy_start_utc == 2026-08-12T14:00:00.000Z and occupancy_end_utc == 2026-08-12T15:00:00.000Z"
            - "RoomReservation.${resv2}.occupancy_start_utc == 2026-08-12T15:00:00.000Z, occupancy_end_utc == 2026-08-12T16:00:00.000Z, status == HELD, effective_capacity_seats == 30"
            - "The second trigger call fails with HTTP 409 and error_id ERR_ROOM_DOUBLE_BOOKED (occupancy [15:59, 17:00) overlaps [15:00, 16:00) by one minute)"
            - "GET /library/reservations?room_id=${room} returns total_count 2 — the rejected booking was not persisted"
            - "GET /library/reservations?program_id=${p3} returns total_count 0"
            - "Program.${p3}.operational_status == DRAFT"

      - name: presenter_closed_engagement_window_rejects_a_merely_touching_second_booking
        grounds:
          - calculations.presenter_engagement_window
          - validations[priority=27]
          - errors[ERR_PRESENTER_DOUBLE_BOOKED]
          - entities.PresenterContract.fields.status
        distinguishing_aspect: |
          The presenter resource is the opposite of the room: its engagement window is CLOSED on both
          ends and padded by a 90-minute travel buffer, so windows that merely touch DO conflict. The
          14:00-15:00 program yields 12:30-16:30 and the 18:00-19:00 program yields 16:30-19:30 — they
          share exactly the instant 16:30 and the second execute is refused, which is the inverse
          outcome of the room's adjacency case. A third program at 20:00-21:00 (window 18:30-21:30)
          then executes successfully, proving that the rejected contract holds no window of its own
          and that only EXECUTED or COMPLETED contracts occupy the presenter.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one branch (per_program_fee_cap_cents 150000, overlapping_program_capacity 3)."
            - "Three ADULT IN_BRANCH programs on Wednesday 2026-08-12 (no weekend premium, no escort fee), all left in DRAFT: X 14:00Z-15:00Z, Y 18:00Z-19:00Z, W 20:00Z-21:00Z."
            - "One presenter with insurance_certificate_expires_on 2027-06-30 (valid, and far outside the 30-day rider window)."
            - "Contract CX on X at 0 miles offered 50000 and EXECUTED, giving total_fee_cents 50000 and an engagement window 12:30Z-16:30Z."
            - "Contract CY on Y and contract CW on W both created at 0 miles and offered 50000, both still OFFERED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 3, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Afternoon Talk", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 20, attendance_cap: 20, supply_sku: "KIT-GEN", supply_units_per_attendee: 0, materials_budget_cents: 5000, presenter_fee_budget_cents: 60000 }
              as: ProgramCoordinator
              captures: { px: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Evening Talk", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T18:00:00.000Z", end_utc: "2026-08-12T19:00:00.000Z", attendance_target: 20, attendance_cap: 20, supply_sku: "KIT-GEN", supply_units_per_attendee: 0, materials_budget_cents: 5000, presenter_fee_budget_cents: 60000 }
              as: ProgramCoordinator
              captures: { py: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Late Talk", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T20:00:00.000Z", end_utc: "2026-08-12T21:00:00.000Z", attendance_target: 20, attendance_cap: 20, supply_sku: "KIT-GEN", supply_units_per_attendee: 0, materials_budget_cents: 5000, presenter_fee_budget_cents: 60000 }
              as: ProgramCoordinator
              captures: { pw: $.data.id }
            - call: "POST /library/presenters"
              payload: { legal_name: "Rosa Lindqvist", presenter_type: "INDIVIDUAL", insurance_certificate_expires_on: "2027-06-30", quoted_fee_cents: 50000 }
              as: ProgramCoordinator
              captures: { pres: $.data.id }
            - call: "POST /library/contracts"
              payload: { presenter_id: "${pres}", program_id: "${px}", round_trip_miles: 0 }
              as: ProgramCoordinator
              as_user_id: "user-coord-6"
              captures: { cx: $.data.id }
            - call: "POST /library/contracts/${cx}/offer"
              payload: { offered_fee_cents: 50000 }
              as: ProgramCoordinator
              as_user_id: "user-coord-6"
            - call: "POST /library/contracts/${cx}/execute"
              payload: {}
              as: ProgramManager
              as_user_id: "user-mgr-6"
            - call: "POST /library/contracts"
              payload: { presenter_id: "${pres}", program_id: "${py}", round_trip_miles: 0 }
              as: ProgramCoordinator
              as_user_id: "user-coord-6"
              captures: { cy: $.data.id }
            - call: "POST /library/contracts/${cy}/offer"
              payload: { offered_fee_cents: 50000 }
              as: ProgramCoordinator
              as_user_id: "user-coord-6"
            - call: "POST /library/contracts"
              payload: { presenter_id: "${pres}", program_id: "${pw}", round_trip_miles: 0 }
              as: ProgramCoordinator
              as_user_id: "user-coord-6"
              captures: { cw: $.data.id }
            - call: "POST /library/contracts/${cw}/offer"
              payload: { offered_fee_cents: 50000 }
              as: ProgramCoordinator
              as_user_id: "user-coord-6"
          trigger:
            - call: "POST /library/contracts/${cy}/execute"
              payload: {}
              as: ProgramManager
              as_user_id: "user-mgr-6"
            - call: "POST /library/contracts/${cw}/execute"
              payload: {}
              as: ProgramManager
              as_user_id: "user-mgr-6"
          assert:
            - "The first trigger call fails with HTTP 409 and error_id ERR_PRESENTER_DOUBLE_BOOKED (12:30-16:30 and 16:30-19:30 touch at exactly 16:30)"
            - "PresenterContract.${cy}.status == OFFERED, total_fee_cents == 0, agreed_fee_cents is null"
            - "Program.${py}.presenter_fee_committed_cents == 0 and compliance_status == UNVERIFIED"
            - "The second trigger call succeeds: PresenterContract.${cw}.status == EXECUTED and total_fee_cents == 50000 (window 18:30-21:30 touches nothing EXECUTED)"
            - "PresenterContract.${cx}.status == EXECUTED and total_fee_cents == 50000"
            - "Presenter.${pres}.executed_contract_count == 2 and engagement_status == ACTIVE"
            - "Program.${pw}.presenter_fee_committed_cents == 50000 and budget_variance_cents == 15000"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: prize_unit_and_cents_conservation_survives_an_award_revocation
        grounds:
          - state_machines.TierAward.RESERVED_to_REVOKED
          - calculations.prize_award_cost
          - entities.InventoryLot.fields.quantity_available
          - entities.ReadingChallenge.fields.prize_available_cents
          - calculations.participant_progress_ledger
        distinguishing_aspect: |
          Two conservation identities on the prize ledger must both survive a compensating transition.
          A LEDGER_TRUTH correction that drops the reader from 60 to 50 units revokes the award, and
          afterwards quantity_procured 50 == quantity_available 50 + quantity_reserved 0 +
          quantity_issued 0 and prize_budget_cents 100000 == prize_available_cents 100000 +
          prize_committed_cents 0 + prize_spent_cents 0. An implementation that revokes the award but
          forgets CASCADE-D link 3 or link 4 leaves the unit or the 100 cents stranded, which no
          single-field assertion on the award itself would notice.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one branch holding a local PRIZE lot for sku PRIZE-C1 (unit_cost_cents 100, quantity_procured 50, reuse_pool false)."
            - "One OPEN challenge (MINUTES, 2026-06-01..2026-08-31, correction_policy LEDGER_TRUTH, prize_budget_cents 100000) with one tier: tier_index 1, threshold_units 60, prize_units_per_participant 1."
            - "One participant who logged 60 units on 2026-06-10, which reserved one prize unit and committed 100 cents."
            - "The participant's current version was read back so the correction can carry expected_participant_version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "PRIZE", sku: "PRIZE-C1", unit_cost_cents: 100, quantity_procured: 50, reuse_pool: false }
              as: ProgramManager
              captures: { lot: $.data.id }
            - call: "POST /library/reading-challenges"
              payload: { name: "Ledger Truth Summer", logging_method: "MINUTES", unit_label: "minute", start_on: "2026-06-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 100000 }
              as: ProgramManager
              captures: { ch: $.data.id }
            - call: "POST /library/reading-challenges/${ch}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 60, prize_sku: "PRIZE-C1", prize_units_per_participant: 1 }
              as: ProgramManager
              captures: { tier: $.data.id }
            - call: "POST /library/reading-challenges/${ch}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /library/participants"
              payload: { challenge_id: "${ch}", home_branch_id: "${br}", display_name: "Careful Reader", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { p: $.data.id }
            - call: "POST /library/participants/${p}/log-entries"
              payload: { units: 60, logged_on: "2026-06-10", source: "STAFF_DESK" }
              as: ProgramCoordinator
              captures: { entry: $.data.id }
            - call: "GET /library/participants/${p}"
              payload: {}
              as: ProgramCoordinator
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /library/participants/${p}/log-corrections"
              payload: { corrected_entry_id: "${entry}", units_delta: -10, expected_participant_version: "${p_v}", note: "miscounted ten minutes" }
              as: ProgramCoordinator
          assert:
            - "Immediately after the log entry (setup), InventoryLot.${lot}.quantity_reserved == 1, quantity_available == 49 and ReadingChallenge.${ch}.prize_committed_cents == 100"
            - "Participant.${p}.cumulative_units == 50, eligible_tier_index == 0, awarded_tier_index == 0, entry_count == 2"
            - "The participant's single TierAward has status REVOKED"
            - "InventoryLot.${lot}.quantity_reserved == 0, quantity_issued == 0, quantity_available == 50, status == ACTIVE"
            - "Unit conservation: InventoryLot.${lot}.quantity_procured 50 == quantity_available + quantity_reserved + quantity_issued"
            - "ReadingChallenge.${ch}.prize_committed_cents == 0, prize_spent_cents == 0, prize_available_cents == 100000"
            - "Cents conservation: ReadingChallenge.${ch}.prize_budget_cents 100000 == prize_available_cents + prize_committed_cents + prize_spent_cents"
            - "IncentiveTier.${tier}.award_count == 0 and deferred_count == 0"

      - name: materials_cents_and_supply_units_conservation_across_confirm_then_weather_close
        grounds:
          - calculations.materials_commitment_with_contingency
          - calculations.supply_draw_allocation
          - state_machines.Program.operational_status.CONFIRMED_to_WEATHER_CLOSED
          - entities.Program.fields.materials_available_cents
          - entities.InventoryLot.fields.quantity_issued
        distinguishing_aspect: |
          A different ledger (program materials cents plus supply units across two lots) compensated by
          a different trigger (a weather closure rather than a reading correction), and with a distinct
          failure mode: the return path must move the drawn units back to quantity_available, NOT to
          quantity_issued the way close-out does. After confirm the identity reads
          12000 == 2014 + 9986 + 0; after the weather closure it must read 12000 == 12000 + 0 + 0 with
          both lots ACTIVE at their full procured quantities and materials_spent_cents still 0.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; branch H (overlapping_program_capacity 2, per_program_fee_cap_cents 150000) with a 60-seat room (min setup/teardown 15), plus branch O as the cross-branch reuse source."
            - "SUPPLY lots for sku KIT-SCI: L1 at H (unit_cost_cents 200, quantity_procured 30, reuse_pool false) and L2 at O (unit_cost_cents 150, quantity_procured 25, reuse_pool true)."
            - "One ADULT IN_BRANCH program on Saturday 2026-08-15T14:00Z-15:00Z with attendance_target 49, supply_units_per_attendee 1, materials_budget_cents 12000, presenter_fee_budget_cents 0 and no contracts at all, so materials are the only money in play."
            - "A CONFIRMED reservation 13:45Z-15:15Z; the program then CONFIRMED, which draws 30 units from L1 (6000, no surcharge) and 19 units from L2 (2850 + 228) for draw_subtotal 9078 and materials_committed_cents 9986 after the 10% contingency."
            - "The clock then moved to 2026-08-14T02:00:00.000Z, still before the program end instant so a weather closure is admissible."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Hill Branch", branch_code: "HIL", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br_h: $.data.id }
            - call: "POST /library/branches"
              payload: { name: "Oak Branch", branch_code: "OAK", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br_o: $.data.id }
            - call: "POST /library/branches/${br_h}/rooms"
              payload: { room_name: "Program Room A", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br_h}", category: "SUPPLY", sku: "KIT-SCI", unit_cost_cents: 200, quantity_procured: 30, reuse_pool: false }
              as: ProgramManager
              captures: { l1: $.data.id }
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br_o}", category: "SUPPLY", sku: "KIT-SCI", unit_cost_cents: 150, quantity_procured: 25, reuse_pool: true }
              as: ProgramManager
              captures: { l2: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br_h}", title: "Maker Saturday", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-15T14:00:00.000Z", end_utc: "2026-08-15T15:00:00.000Z", attendance_target: 49, attendance_cap: 49, supply_sku: "KIT-SCI", supply_units_per_attendee: 1, materials_budget_cents: 12000, presenter_fee_budget_cents: 0 }
              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-15T13:45:00.000Z", end_utc: "2026-08-15T15:15:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v}" }
              as: ProgramCoordinator
              captures: { resv: $.data.id }
            - call: "POST /library/reservations/${resv}/confirm"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog}/schedule"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog}/confirm"
              payload: {}
              as: ProgramManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T02:00:00.000Z" }
              as: ProgramManager
          trigger:
            - call: "POST /library/programs/${prog}/weather-close"
              payload: { closure_reason: "Regional flood warning" }
              as: ProgramManager
          assert:
            - "Immediately after the confirm call (setup), Program.${prog}.materials_committed_cents == 9986, materials_available_cents == 2014, InventoryLot.${l1} has quantity_reserved 30 / quantity_available 0 / status DEPLETED and InventoryLot.${l2} has quantity_reserved 19 / quantity_available 6"
            - "Program.${prog}.operational_status == WEATHER_CLOSED and closure_reason == 'Regional flood warning'"
            - "Program.${prog}.supply_draw_lines == []"
            - "Program.${prog}.materials_committed_cents == 0, materials_spent_cents == 0, materials_available_cents == 12000"
            - "Cents conservation: Program.${prog}.materials_budget_cents 12000 == materials_available_cents + materials_committed_cents + materials_spent_cents"
            - "InventoryLot.${l1}.quantity_available == 30, quantity_reserved == 0, quantity_issued == 0, status == ACTIVE (returned to availability, never issued)"
            - "InventoryLot.${l2}.quantity_available == 25, quantity_reserved == 0, quantity_issued == 0, status == ACTIVE"
            - "Program.${prog}.presenter_fee_committed_cents == 0, budget_variance_cents == 12000, budget_posture == WITHIN_BUDGET"
            - "Branch.${br_h}.programs_over_budget_count == 0"
            - "RoomReservation.${resv}.status == RELEASED and Program.${prog}.confirmed_room_capacity == 0"
