          assert:
            - "C's ballot principal_voted_cents == 250000000 (record-date snapshot from principal_history)"
            - "C's current Position.principal_amount_cents == 225000000 (post-redemption) — snapshot diverges from current"

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: aggregate_position_principal_cap_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_PRINCIPAL_EXCEEDS_POSITION]"]
        distinguishing_aspect: "Aggregate validation: positions may sum to EXACTLY Tranche.original_principal_cents (400000000 == 400000000 accepted); one cent more is rejected."
        test_recipe:
          setup: ["active indenture; tranche original 400000000; existing position 399999999"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 399999999 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 1 }, as: PlatformAdmin, captures: { pos_ok: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 1 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "position bringing the sum to exactly 400000000 is created (${pos_ok})"
            - "the next 1-cent position fails with error_id == ERR_PRINCIPAL_EXCEEDS_POSITION"

      - name: authorization_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_FORBIDDEN]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A Noteholder calling confirm on a NON-EXISTENT default case gets ERR_FORBIDDEN (authorization, priority 2), not ERR_NOT_FOUND (existence, priority 4)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /default-cases/00000000-0000-0000-0000-000000000000/confirm", payload: {}, as: Noteholder, as_user_id: "00000000-0000-0000-0000-000000000001", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (role check precedes existence)"

      - name: sod_declare_confirm_same_user_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES]", "state_machines.DefaultCase"]
        distinguishing_aspect: "The X-User-ID that declared a DefaultCase cannot confirm it, even with the TrustManager role: ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["active indenture with tranche; ALLEGED case declared by officer-1"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /default-cases", payload: { indenture_id: "${ind}", default_type: "PAYMENT", cure_deadline: "2026-12-31T00:00:00Z" }, as: TrustOfficer, as_user_id: "officer-1", captures: { dc: $.data.id } }
          trigger:
            - { call: "POST /default-cases/${dc}/confirm", payload: {}, as: TrustManager, as_user_id: "officer-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES"
            - "DefaultCase.${dc}.status == ALLEGED (unchanged)"

      - name: sod_verify_decide_same_user_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES]", "state_machines.CollateralReleaseRequest"]
        distinguishing_aspect: "The verifier of a release request cannot also decide it: decide with X-User-ID == verified_by_user_id fails ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["active indenture, position 1000000000; C2 REAL_ESTATE 500000000 with VERIFIED RELEASE request (verified by officer-1); C1 SECURITIES 1000000000 keeps coverage high"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 1000000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin, captures: { t1: $.data.id } }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /noteholder-accounts", payload: { holder_ref: "H-A", legal_name: "Holder A", contact_email: "a@x.com" }, as: PlatformAdmin, captures: { nha: $.data.id } }
            - { call: "POST /positions", payload: { tranche_id: "${t1}", noteholder_account_id: "${nha}", original_principal_cents: 1000000000 }, as: PlatformAdmin }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C1", collateral_type: "SECURITIES", appraised_value_cents: 1000000000, valuation_date: "2026-04-01" }, as: TrustOfficer }
            - { call: "POST /collateral-items", payload: { indenture_id: "${ind}", description: "C2", collateral_type: "REAL_ESTATE", appraised_value_cents: 500000000, valuation_date: "2026-04-01" }, as: TrustOfficer, captures: { c2: $.data.id, c2_v: $.data.version } }
            - { call: "POST /collateral-release-requests", payload: { collateral_item_id: "${c2}", request_type: "RELEASE", expected_collateral_item_version: "${c2_v}" }, as: Issuer, as_user_id: "issuer-1", captures: { rr: $.data.id } }
            - { call: "POST /collateral-release-requests/${rr}/verify", payload: {}, as: TrustOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /collateral-release-requests/${rr}/decide", payload: { decision: "APPROVE" }, as: TrustManager, as_user_id: "officer-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (decider id equals verifier id)"
            - "CollateralReleaseRequest.${rr}.status == VERIFIED (unchanged)"

      - name: sod_draft_issue_same_user_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES]", "state_machines.FeeInvoice"]
        distinguishing_aspect: "The drafter of a FeeInvoice cannot issue it: issue with X-User-ID == drafted_by_user_id fails ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["active indenture; ANNUAL_ADMIN invoice drafted by officer-1"]
          setup_api_calls:
            - { call: "POST /indentures", payload: { name: "I1", issuer_ref: "issuer-1", governing_law: "NY", initial_trustee_ref: "trustee-alpha", annual_admin_fee_cents: 2500000, extraordinary_hourly_rate_cents: 45000, default_hourly_rate_cents: 65000 }, as: PlatformAdmin, captures: { ind: $.data.id } }
            - { call: "POST /tranches", payload: { indenture_id: "${ind}", series_code: "T1", original_principal_cents: 400000000, interest_rate_bps: 500, day_count_convention: "ACT_360", payment_frequency: "SEMI_ANNUAL", maturity_date: "2030-12-15" }, as: PlatformAdmin }
            - { call: "POST /indentures/${ind}/activate", payload: {}, as: PlatformAdmin }
