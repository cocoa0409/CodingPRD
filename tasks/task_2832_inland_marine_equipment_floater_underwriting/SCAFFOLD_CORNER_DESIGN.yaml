              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
          trigger:
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
              captures: { err: $.data.error_id }
          assert:
            - "trigger HTTP status == 409"
            - "trigger response error_id == ERR_RATE_RULE_NOT_DRAFT"
            - "RateRule.${rr}.status == PUBLISHED (not RETIRED - a cell never retires itself)"
            - "RateRule.${rr}.published_at == 2026-08-01T00:00:00Z"

      - name: corner_jobsite_releases_only_when_last_floater_leaves
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Jobsite.SURVEYED_to_RELEASED
          - entities.Jobsite.fields.active_floater_count
          - state_machines.InstallationFloater.ACTIVE_to_TERMINATED_OCCUPANCY
        distinguishing_aspect: "The jobsite bubbles up to RELEASED only when active_floater_count reaches 0: terminating the first of two ACTIVE floaters drops the count from 2 to 1 and leaves status SURVEYED, and only the second termination flips it to RELEASED."
        test_recipe:
          setup:
            - "One Jobsite surveyed fenced/lighting/alarm true, guarded_24h false, so security_score 3 and security_tier TIER_2, status SURVEYED."
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 50000."
            - "One ACTIVE INSTALLATION_FLOATER CoveragePart, aggregate_limit_cents 200000000."
            - "Two ACTIVE InstallationFloaters on that jobsite with disjoint closed intervals: F1 2026-09-01..2026-12-01 limit 20000000 rated 70575, F2 2026-12-02..2027-03-02 limit 15000000 rated 52356; part premium 122931 and written premium 127848."
          setup_api_calls:
            - call: "POST /inland-marine/jobsites"
              payload: { name: "Two Floater Yard", territory_code: "T2_URBAN" }
              as: Underwriter
              captures: { js: $.data.id }
            - call: "POST /inland-marine/jobsites/${js}/security-survey"
              payload: { fenced: true, lighting: true, alarm_monitored: true, guarded_24h: false }
              as: Underwriter
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Bubble Up Installers", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 50000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "INSTALLATION_FLOATER", valuation_basis: "ACV", aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/coverage-parts/${cp}/installation-floaters"
              payload: { jobsite_id: "${js}", project_name: "Phase 1", installed_value_limit_cents: 20000000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-12-01" }
              as: Underwriter
