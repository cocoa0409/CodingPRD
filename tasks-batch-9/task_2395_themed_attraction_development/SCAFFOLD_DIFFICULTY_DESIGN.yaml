            - call: "POST /ride-systems/${rs}/select"
              payload: { expected_project_version: "${pv1}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /show-scenes/${sc1}/sequence"
              payload: { sequence_index: 1 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
            - call: "POST /show-scenes/${sc2}/sequence"
