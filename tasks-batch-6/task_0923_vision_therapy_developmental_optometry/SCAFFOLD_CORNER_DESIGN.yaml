              as: Optometrist
              as_user_id: "${od1}"
              captures: { ev1: $.data.id }
            - call: "POST /vision-therapy/assessments/${ev1}/measurements"
              payload: { metric_code: "NPC", eye: "OU", npc_break_cm: 12.0, npc_recovery_cm: 16.0 }
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/assessments/${ev1}/sign"
              payload: {}
              as: Optometrist
              as_user_id: "${od1}"
            - call: "POST /vision-therapy/occlusion-prescriptions"
              payload: { patient_id: "${pt}", source_assessment_id: "${ev1}", severity: "MILD", baseline_acuity_logmar: 0.30 }
              as: Optometrist
              as_user_id: "${od1}"
              captures: { rx: $.data.id, a0: $.data.adherence_pct, dose: $.data.prescribed_daily_hours }
          trigger:
            - call: "POST /vision-therapy/occlusion-prescriptions/${rx}/adherence"
              payload: { logged_days_delta: 3, adherent_days_delta: 2 }
              as: PatientUser
              as_user_id: "${pt}"
              captures: { a1: $.data.adherence_pct, ld: $.data.logged_days, ad: $.data.adherent_days }
