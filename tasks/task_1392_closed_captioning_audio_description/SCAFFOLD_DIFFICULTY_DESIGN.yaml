              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_a}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "B", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_b: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_b}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_b}/clear"
              payload: {}
