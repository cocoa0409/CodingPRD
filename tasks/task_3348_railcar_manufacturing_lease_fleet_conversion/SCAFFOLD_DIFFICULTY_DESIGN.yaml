        payload:
          part_number: CS-2000
          component_class: CASTING
          unit_cost_cents: 180000
          lead_time_days: 20
          on_hand_qty: 4
        as: SupplyChainCoordinator
        captures:
          comp_cs_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${comp_ws_id}
          qty_per_car: 1
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${comp_cs_id}
          qty_per_car: 1
        as: ProductionPlanner
      - call: POST /api/v1/lessees
        payload:
          legal_name: Capital Cascade Lessee
          credit_tier: A
          utilization_threshold_pct: 60
          credit_ceiling_cents: 50000000
        as: LeaseAdministrator
        captures:
          lessee_id: $.data.id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${lessee_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 45000
          liability_bearer: LESSOR
          term_start_date: '2026-01-01'
          term_end_date: '2027-12-31'
          fleet_car_cap: 2
        as: LeaseAdministrator
        captures:
          contract_id: $.data.id
      - call: POST /api/v1/lease-contracts/${contract_id}/activate
        payload: {}
        as: LeaseAdministrator
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 2
          planned_shop_days: 8
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-05-30'
          required_delivery_date: '2026-08-31'
          lessee_id: ${lessee_id}
        as: ProductionPlanner
        captures:
          order_id: $.data.id
      - call: POST /api/v1/production-orders/${order_id}/reserve-components
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${order_id}/release
        payload:
          lease_contract_id: ${contract_id}
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/BOX_LINE/changeover
        payload:
