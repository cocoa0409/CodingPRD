      - name: resident_cannot_create_guest_pass_for_another_unit
        claim_type: Violation → Error
        grounds:
          - roles.Resident.identity
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "A Resident is entity_backed, so X-User-ID must equal the host_resident_id; naming a different host resident yields 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Unit U with ACTIVE resident R1 (the caller identity) and a second resident R2 on the same property."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
