            - call: "POST /appeals/${appeal_1}/decide"
              payload: { outcome: "DENIED", decision_note: "Premature decision attempt" }
              as: Assessor
              as_user_id: "${assessor_2}"
              captures: { err_premature: $.data.error_id }
            - call: "POST /appeals/${appeal_1}/assign-reviewer"
              payload: { reviewing_assessor_id: "${assessor_2}" }
              as: StateOffice
              captures: { appeal_status_1: $.data.status }
            - call: "POST /appeals/${appeal_1}/order-retest"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_2}"
              captures: { rounds_1: $.data.retest_round_count }
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_2}", method: "SKINFOLD", assessed_at: "2026-11-01T11:00:00Z", measured_weight_lbs: 159.6, body_fat_pct: 14.6, urine_specific_gravity: 1.020, appeal_id: "${appeal_1}", retest_of_assessment_id: "${assess_x}" }
              as: Assessor
              as_user_id: "${assessor_2}"
              captures: { retest_1: $.data.id }
            - call: "POST /assessments/${retest_1}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_2}"
            - call: "GET /appeals/${appeal_1}"
              payload: {}
              as: StateOffice
              captures: { appeal_status_2: $.data.status, retest_link: $.data.retest_assessment_id }
            - call: "POST /appeals/${appeal_1}/order-retest"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_2}"
              captures: { rounds_2: $.data.retest_round_count, appeal_status_3: $.data.status }
            - call: "POST /assessments/${assess_x}/appeals"
              payload: { team_id: "${team_id}", reason: "Second bite at the same assessment" }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { err_round_limit: $.data.error_id }
            - call: "POST /appeals/${appeal_1}/order-retest"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_2}"
              captures: { err_third_round: $.data.error_id }
            - call: "GET /assessments/${assess_x}"
              payload: {}
              as: StateOffice
              captures: { x_status: $.data.status }
          assert:
            - "${appeal_status_0} == 'SUBMITTED' with ${rounds_0} == 0, filed_at == '2026-11-01T12:00:00Z' (inside the 5-day window from 2026-11-01T09:00:00Z)"
            - "${err_premature} == 'ERR_APPEAL_INVALID_STATE' (409): decide is only reachable from UNDER_REVIEW or RETEST_COMPLETED, and reviewing_assessor_id is still null"
            - "${appeal_status_1} == 'UNDER_REVIEW' and ${rounds_1} == 1 after the first order-retest, which moved the appeal to 'RETEST_ORDERED'"
            - "${appeal_status_2} == 'RETEST_COMPLETED' with ${retest_link} == ${retest_1} — finalizing the retest advanced the appeal, and ${x_status} == 'VALIDATED' (the contested assessment is exempt from the supersede rule while its appeal is live)"
            - "${rounds_2} == 2 with ${appeal_status_3} == 'RETEST_ORDERED' — the cycle RETEST_COMPLETED -> RETEST_ORDERED closed once"
            - "${err_round_limit} == 'ERR_APPEAL_ROUND_LIMIT' (409): 2 recorded rounds on an appeal of assessment ${assess_x} is not fewer than max_appeal_retest_rounds 2, so no new appeal may be filed against it"
            - "${err_third_round} == 'ERR_APPEAL_INVALID_STATE' (409) and retest_round_count is still 2 — the refused call neither incremented the counter nor bumped Appeal.version"
            - "GET /appeals?assessment_id=${assess_x} returns total_count == 1 — the refused filing created no second appeal row"

