            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S One", email: "s1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s1: $.data.id } }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "D One", email: "d1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${s1}" }, as: PlatformAdmin, captures: { d1: $.data.id } }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-d1-att", attested_sponsor_agent_id: "${r1}" }, as: PlatformAdmin, captures: { att: $.data.id } }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-d1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-d1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "R One", email: "r1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { r1: $.data.id } }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-r1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-r1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-r1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${d1}", as: PlatformAdmin, captures: { d1v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${d1}", gross_commission: 5000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-d1-1", expected_agent_version: "${d1v}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev: $.data.id } }
            - { call: "POST /commission-events/${ev}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /sponsorship-disputes", payload: { sponsored_agent_id: "${d1}", evidence_document_id: "${att}", reason: "Attestation names me" }, as: Agent, as_user_id: "${r1}", captures: { dsp: $.data.id } }
            - { call: "POST /sponsorship-disputes/${dsp}/open-review", as: RegionalDirector }
          trigger:
            - { call: "POST /sponsorship-disputes/${dsp}/resolve", payload: { outcome: "OVERTURNED" }, as: RegionalDirector }
            - { call: "GET /sponsorship-edges", as: PlatformAdmin, payload: { child_agent_id: "${d1}", status: "SUPERSEDED" } }
            - { call: "GET /sponsorship-edges", as: PlatformAdmin, payload: { child_agent_id: "${d1}", status: "ACTIVE" } }
            - { call: "GET /profit-share-distributions", as: PlatformAdmin, payload: { period_id: "${per}", status: "CLAWED_BACK" } }
            - { call: "GET /profit-share-distributions", as: PlatformAdmin, payload: { period_id: "${per}", status: "PROJECTION" } }
          assert:
            - "Hop 1: Agent.${d1}.sponsor_agent_id == ${r1}"
            - "Hop 2: exactly 2 SUPERSEDED edges (mca->d1 L2, s1->d1 L1) and exactly 2 new ACTIVE edges (r1->d1 L1, mca->d1 L2 via r1)"
            - "Hop 3: prior PROJECTION distributions for s1 (354.55) and mca (425.45) are CLAWED_BACK; regenerated PROJECTION set is exactly { r1: 650.00 (L1), mca: 130.00 (L2) } (entitlements 750.00 + 150.00 scaled by 780/900) — s1 has no PROJECTION distribution under the new closure"
            - "Period ${per}.distributed_total + center_retained_amount == 780.00 still holds after regeneration"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (DIFFERENT error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_departed_agent_commission
        grounds:
          - validations[priority=6]
          - validations[priority=20]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NONPOSITIVE_AMOUNT]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a commission posting that is BOTH
          state-invalid (agent DEPARTED) and fiscally invalid (gross -50.00) MUST
          return ERR_INVALID_STATE (priority 6) ahead of ERR_NONPOSITIVE_AMOUNT
          (priority 20).
        test_recipe:
          setup:
            - "Agent a1 joined 2026-09-01, ACTIVE, then departed 2026-09-10 (vesting FORFEITED)"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/depart", payload: { departure_date: "2026-09-10T00:00:00Z" }, as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av: $.data.version } }
          trigger:
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: -50.00, occurred_on: "2026-09-11T00:00:00Z", external_ref: "ref-bad", expected_agent_version: "${av}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (state precondition wins over the fiscal sign check despite both failing)"
            - "HTTP status 409, not 422"

      - name: existence_beats_temporal_on_dispute_filing
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_AGENT_NOT_FOUND]
          - errors[ERR_DISPUTE_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Category pair existence vs business_temporal (different pair from
          state/fiscal): a dispute filing whose sponsored_agent_id does not exist
          AND which is filed past any plausible window MUST return
          ERR_AGENT_NOT_FOUND (priority 4) ahead of ERR_DISPUTE_WINDOW_EXPIRED
          (priority 7).
        test_recipe:
          setup:
            - "ACTIVE agent r1 in center MC; logical clock advanced to 2026-12-15 (past any 2026-09-01 join's 90-day window)"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "R One", email: "r1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { r1: $.data.id } }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-r1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-r1-w9" }, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /sponsorship-disputes", payload: { sponsored_agent_id: "00000000-0000-0000-0000-000000000000", evidence_document_id: "00000000-0000-0000-0000-000000000000", reason: "late and bogus" }, as: Agent, as_user_id: "${r1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AGENT_NOT_FOUND (existence of body FKs is validated before the temporal window)"
            - "HTTP status 404, not 422"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (DIFFERENT metrics, DIFFERENT endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cap_crossing_at_exact_annual_cap
        grounds:
          - calculations.agent_cap_split
          - state_machines.Agent
        distinguishing_aspect: |
          Numeric threshold metric via POST /commission-events: the cap flip fires
          at accrued == 20000.00 exactly (inclusive >=), so the second 40000.00
          post caps at company_dollar 8000.00 and flips CAPPED at the exact
          boundary rather than one cent past it, and a subsequent post yields
          company_dollar 0.00 with full agent retention.
        test_recipe:
          setup:
            - "ACTIVE agent a1 with accrued 12000.00 after one 40000.00 post"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { v1: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 40000.00, occurred_on: "2026-09-05T00:00:00Z", external_ref: "ref-a1-1", expected_agent_version: "${v1}" }, as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { v2: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 40000.00, occurred_on: "2026-09-20T00:00:00Z", external_ref: "ref-a1-2", expected_agent_version: "${v2}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { ev2: $.data.id } }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { v3: $.data.version, acc: $.data.accrued_company_dollar, cap: $.data.cap_status } }
          trigger:
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 10000.00, occurred_on: "2026-09-25T00:00:00Z", external_ref: "ref-a1-3", expected_agent_version: "${v3}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { ev3: $.data.id, cd3: $.data.company_dollar, ar3: $.data.agent_retained } }
          assert:
            - "Second post: company_dollar == 8000.00 — accrued lands exactly on 20000.00 and cap flips at equality (>=, not >)"
            - "Agent.${a1}.accrued_company_dollar == 20000.00 and cap_status == CAPPED"
            - "Third post while CAPPED: CommissionEvent.${ev3}.company_dollar == 0.00 and agent_retained == 10000.00 (full retention after the threshold)"

      - name: dispute_window_day_90_inclusive
        grounds:
          - validations[priority=7]
          - entities.SponsorshipDispute.fields.window_deadline
        distinguishing_aspect: |
          Temporal-count metric via POST /sponsorship-disputes (different metric and
          endpoint from the cap threshold): filing at exactly join_date + 90 days
          (2026-11-30T00:00:00Z for a 2026-09-01 join) is ACCEPTED (inclusive
          boundary); filing one day later is rejected ERR_DISPUTE_WINDOW_EXPIRED.
        test_recipe:
          setup:
            - "mca sponsors r1 and s2 (all ACTIVE); s2's attestation att names r1; logical clock at the exact deadline"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "R One", email: "r1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { r1: $.data.id } }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-r1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-r1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${r1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-r1-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "S Two", email: "s2@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { s2: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-s2-att", attested_sponsor_agent_id: "${r1}" }, as: PlatformAdmin, captures: { att: $.data.id } }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-s2-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${s2}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-s2-w9" }, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-30T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /sponsorship-disputes", payload: { sponsored_agent_id: "${s2}", evidence_document_id: "${att}", reason: "at the deadline" }, as: Agent, as_user_id: "${r1}", captures: { dsp: $.data.id, dl: $.data.window_deadline } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /sponsorship-disputes", payload: { sponsored_agent_id: "${s2}", evidence_document_id: "${att}", reason: "one day late" }, as: Agent, as_user_id: "${mca}", captures: { err: $.data.error_id } }
          assert:
            - "Filing at 2026-11-30T00:00:00Z succeeds: SponsorshipDispute.${dsp}.status == FILED and window_deadline == 2026-11-30T00:00:00Z (inclusive)"
            - "A second filing (by mca, past the deadline) at 2026-12-01T00:00:00Z fails: error_id == ERR_DISPUTE_WINDOW_EXPIRED, HTTP 422"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (DIFFERENT entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: commission_requires_agent_active
        grounds:
          - validations[priority=6]
          - state_machines.Agent
          - entities.CommissionEvent.fields.agent_id
        distinguishing_aspect: |
          Pair CommissionEvent x Agent: POST /commission-events is rejected
          ERR_INVALID_STATE when the target Agent's membership_status is DEPARTED —
          a CommissionEvent write gated entirely by another entity's state.
        test_recipe:
          setup:
            - "Agent a1 ACTIVE then DEPARTED (departure 2026-09-10)"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/depart", payload: { departure_date: "2026-09-10T00:00:00Z" }, as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av: $.data.version } }
          trigger:
            - { call: "POST /commission-events", payload: { agent_id: "${a1}", gross_commission: 1000.00, occurred_on: "2026-09-11T00:00:00Z", external_ref: "ref-dep", expected_agent_version: "${av}" }, as: MarketCenterAdmin, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP 409 — CommissionEvent creation gated by Agent.membership_status"

      - name: transfer_complete_requires_both_centers_active
        grounds:
          - state_machines.TransferRequest
          - entities.MarketCenter.fields.status
          - errors[ERR_CENTER_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair TransferRequest x MarketCenter (different pair from
          CommissionEvent x Agent): completing an APPROVED transfer is rejected
          ERR_CENTER_NOT_ACTIVE when the destination center is SUSPENDED, and
          succeeds after reactivation — one transition gated by a third entity's
          state.
        test_recipe:
          setup:
            - "Centers MC1 (source, ACTIVE) and MC2 (destination); agent a1 ACTIVE in MC1 with an APPROVED transfer to MC2 effective 2026-09-10; clock at 2026-09-10"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC One", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc1: $.data.id } }
            - { call: "POST /market-centers", payload: { name: "MC Two", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc2: $.data.id } }
            - { call: "POST /market-centers/${mc1}/agents", payload: { full_name: "A One", email: "a1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { a1: $.data.id } }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-a1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${a1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-a1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { av: $.data.version } }
            - { call: "POST /agents/${a1}/transfer-requests", payload: { to_market_center_id: "${mc2}", effective_date: "2026-09-10T00:00:00Z", expected_agent_version: "${av}" }, as: Agent, as_user_id: "${a1}", captures: { tr: $.data.id } }
            - { call: "POST /transfer-requests/${tr}/approve", as: MarketCenterAdmin, as_user_id: "${a1}" }
            - { call: "POST /market-centers/${mc2}/suspend", as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /transfer-requests/${tr}/complete", as: MarketCenterAdmin, as_user_id: "${a1}", captures: { err: $.data.error_id } }
            - { call: "POST /market-centers/${mc2}/reactivate", as: PlatformAdmin }
            - { call: "POST /transfer-requests/${tr}/complete", as: MarketCenterAdmin, as_user_id: "${a1}", captures: { st: $.data.status } }
            - { call: "GET /agents/${a1}", as: PlatformAdmin, captures: { home: $.data.market_center_id } }
          assert:
            - "First complete attempt: error_id == ERR_CENTER_NOT_ACTIVE (destination SUSPENDED), HTTP 422"
            - "After reactivate: TransferRequest.${tr}.status == COMPLETED and Agent.${a1}.market_center_id == ${mc2}"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (DIFFERENT interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: transfer_effective_date_inside_closed_period_occupancy
        grounds:
          - validations[priority=8]
          - errors[ERR_TRANSFER_WINDOW_CONFLICT]
          - state_machines.ProfitSharePeriod
        distinguishing_aspect: |
          Interval-containment semantics on the market-center period resource: an
          effective_date anywhere inside the calendar month of a
          PRELIMINARY_CLOSED source-center period (2026-09-15 in month 2026-09) is
          rejected, while 2026-10-01 (adjacent month, zero gap at the boundary) is
          accepted — month-granularity occupancy, not point-in-window.
        test_recipe:
          setup:
            - "MC1 with mca ACTIVE, d1 sponsored by mca ACTIVE; d1 posts+settles 10000.00; period 2026-09 PRELIMINARY_CLOSED; MC2 ACTIVE destination"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC One", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc1: $.data.id } }
            - { call: "POST /market-centers", payload: { name: "MC Two", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc2: $.data.id } }
            - { call: "POST /market-centers/${mc1}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc1}/agents", payload: { full_name: "D One", email: "d1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { d1: $.data.id } }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "SPONSOR_ATTESTATION", document_ref: "doc-d1-att", attested_sponsor_agent_id: "${mca}" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-d1-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${d1}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-d1-w9" }, as: PlatformAdmin }
            - { call: "GET /agents/${d1}", as: PlatformAdmin, captures: { d1v: $.data.version } }
            - { call: "POST /commission-events", payload: { agent_id: "${d1}", gross_commission: 10000.00, occurred_on: "2026-09-10T00:00:00Z", external_ref: "ref-d1-1", expected_agent_version: "${d1v}" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { ev: $.data.id } }
            - { call: "POST /commission-events/${ev}/settle", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "POST /market-centers/${mc1}/profit-share-periods", payload: { period_month: "2026-09" }, as: MarketCenterAdmin, as_user_id: "${mca}", captures: { per: $.data.id } }
            - { call: "POST /profit-share-periods/${per}/preliminary-close", as: MarketCenterAdmin, as_user_id: "${mca}" }
            - { call: "GET /agents/${d1}", as: PlatformAdmin, captures: { d1v2: $.data.version } }
          trigger:
            - { call: "POST /agents/${d1}/transfer-requests", payload: { to_market_center_id: "${mc2}", effective_date: "2026-09-15T00:00:00Z", expected_agent_version: "${d1v2}" }, as: Agent, as_user_id: "${d1}", captures: { err: $.data.error_id } }
            - { call: "GET /agents/${d1}", as: PlatformAdmin, captures: { d1v3: $.data.version } }
            - { call: "POST /agents/${d1}/transfer-requests", payload: { to_market_center_id: "${mc2}", effective_date: "2026-10-01T00:00:00Z", expected_agent_version: "${d1v3}" }, as: Agent, as_user_id: "${d1}", captures: { tr: $.data.id } }
          assert:
            - "effective_date 2026-09-15 (inside the PRELIMINARY_CLOSED 2026-09 month): error_id == ERR_TRANSFER_WINDOW_CONFLICT, HTTP 422"
            - "effective_date 2026-10-01 (adjacent month, zero-gap boundary): accepted, TransferRequest.${tr}.status == REQUESTED"

      - name: dispute_rolling_window_membership_semantics
        grounds:
          - validations[priority=7]
          - entities.SponsorshipDispute.fields.window_deadline
        distinguishing_aspect: |
          Point-in-rolling-window semantics on the dispute resource (different
          geometry from month-occupancy): the window is the rolling 90-day span
          anchored at the sponsored agent's join_date with an INCLUSIVE end —
          membership is decided per filing instant, and a filing at deadline+1s
          falls outside even though no other dispute occupies the window.
        test_recipe:
          setup:
            - "mca sponsors r1 and s2; attestation att on s2 names r1; clock set to one second past the deadline"
          setup_api_calls:
            - { call: "POST /market-centers", payload: { name: "MC Alpha", region_code: "SW-TX" }, as: PlatformAdmin, captures: { mc: $.data.id } }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "MCA One", email: "mca1@x.com", join_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { mca: $.data.id } }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "ICA_SIGNED", document_ref: "doc-mca-ica" }, as: PlatformAdmin }
            - { call: "POST /agents/${mca}/onboarding-documents", payload: { document_type: "W9", document_ref: "doc-mca-w9" }, as: PlatformAdmin }
            - { call: "POST /market-centers/${mc}/agents", payload: { full_name: "R One", email: "r1@x.com", join_date: "2026-09-01T00:00:00Z", sponsor_agent_id: "${mca}" }, as: PlatformAdmin, captures: { r1: $.data.id } }
