            - "err == ERR_MULTIPLE_OPEN_PLAN_YEARS"
            - "HTTP status == 409"
            - "PlanYear.${py27_id}.status == DRAFT"
            - "PlanYear.${py26_id}.status == OPEN"

      - name: corner_unpaid_leave_cap_exceeded_rejected
        claim_type: Aggregate validation
        grounds:
          - validations[priority=43]
          - errors.ERR_LEAVE_CAP_EXCEEDED
          - entities.PlanYear.fields.unpaid_leave_day_cap
        distinguishing_aspect: "A single UNPAID leave spanning the whole plan year merges to 365 days, exceeding unpaid_leave_day_cap 180, and is rejected with 422 ERR_LEAVE_CAP_EXCEEDED before any LeaveEvent row is written."
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with unpaid_leave_day_cap 180."
            - "One Employee with no LeaveEvent rows."
          setup_api_calls:
            - call: "POST /plan-years"
