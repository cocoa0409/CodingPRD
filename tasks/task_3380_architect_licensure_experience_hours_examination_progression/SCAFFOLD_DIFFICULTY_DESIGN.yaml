scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: experience_credit_locked_vs_projected
        grounds:
          - calculations.experience_credit_tiering
          - entities.ExperienceReport.fields.credit_pct
          - endpoints.POST /licensure/experience-reports/{id}/submit
        distinguishing_aspect: |
          Dual variant in the ExperienceReport domain: the locked variant tiers
          a report once at submitted_at while the projected_preview variant
          re-tiers the same report against the current clock, so identical
          report data yields 80 projected vs 40 locked hours at T1 and
          converges to 40 vs 40 only after the clock crosses the 8-month
          boundary - while the stamped credit_pct stays 100.
        test_recipe:
          setup:
            - "jurisdiction J1 exists; candidate C (home J1); supervisor S ACTIVE"
            - "R1: PPD 40h, work 2026-01-05..2026-02-02, SUBMITTED at 2026-04-01 (locked 100%)"
            - "R2: PJM 40h, work 2026-02-02..2026-03-02, left DRAFT"
            - "clock then advanced to 2026-12-01, past both reports' 8-month windows"
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_PLANNING_DESIGN", hours: 40, work_period_start: "2026-01-05", work_period_end: "2026-02-02" }, as: Candidate, as_user_id: "${cand_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r1_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_MANAGEMENT", hours: 40, work_period_start: "2026-02-02", work_period_end: "2026-03-02" }, as: Candidate, as_user_id: "${cand_id}", captures: { r2_id: $.data.id } }
            - { call: "GET /licensure/candidates/${cand_id}/summary", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { proj_t1: $.data.projected_credited_hours, locked_t1: $.data.locked_credited_hours } }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: NcarbAdministrator }
          trigger:
            - { call: "GET /licensure/candidates/${cand_id}/summary", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "GET /licensure/experience-reports/${r1_id}", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
          assert:
            - "at T1 (clock 2026-04-01): captured proj_t1 == 80 and locked_t1 == 40 (variants diverge on identical report data)"
            - "at T2 (clock 2026-12-01): summary.projected_credited_hours == 40 (both reports re-tiered to 50%: 20 + 20)"
            - "at T2: summary.locked_credited_hours == 40 (unchanged; R1 keeps its stamped tier)"
            - "ExperienceReport.${r1_id}.credit_pct == 100 even though current date is past work_period_end + 8 months"
            - "ExperienceReport.${r1_id}.status == SUBMITTED"
      - name: ce_renewal_strict_vs_carry_over
        grounds:
          - calculations.ce_period_compliance
          - entities.Certificate.fields.ce_hours_current_period
          - endpoints.POST /licensure/certificates/{id}/renew
        distinguishing_aspect: |
          Dual variant in the Certificate/CEEntry domain (different entity
          domain from experience_credit_locked_vs_projected): with an identical
          CE history (period-2 total 18h + 6h prior-period excess), the
          period_strict variant rejects renewal with ERR_CE_HOURS_INSUFFICIENT
          while the carry_over variant - enabled by the same jurisdiction's
          live flag - accepts it because 18 + min(6, 12) = 24 >= 24.
        test_recipe:
          setup:
            - "certificate ACTIVE for candidate C under jurisdiction J1 (ce 24 total / 12 HSW, ce_carry_over_allowed false at issuance)"
            - "period 1 (2026-10-06..2028-10-06): 30 hours logged (18 HSW); renewed into period 2 (2028-10-06..2030-10-06), carry recorded = min(30-24, 12) = 6"
            - "period 2: 18 hours logged (12 HSW); clock inside renewal window at 2030-09-06"
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator, captures: { j1_id: $.data.id, j1_v: $.data.version } }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id } }
            - { call: "POST /licensure/candidates/${cand_id}/education-evaluations", payload: { path_type: "ACCREDITED_DEGREE", institution_name: "State U", semester_credit_hours: 150 }, as: Candidate, as_user_id: "${cand_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /licensure/education-evaluations/${ev_id}/review", payload: { decision: "SATISFIED" }, as: NcarbAdministrator }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PRACTICE_MANAGEMENT", hours: 160, work_period_start: "2026-01-05", work_period_end: "2026-01-30" }, as: Candidate, as_user_id: "${cand_id}", captures: { r_pm: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r_pm}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r_pm}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_MANAGEMENT", hours: 360, work_period_start: "2026-02-02", work_period_end: "2026-03-31" }, as: Candidate, as_user_id: "${cand_id}", captures: { r_pjm: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r_pjm}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r_pjm}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROGRAMMING_ANALYSIS", hours: 260, work_period_start: "2026-04-01", work_period_end: "2026-04-30" }, as: Candidate, as_user_id: "${cand_id}", captures: { r_pa: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r_pa}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r_pa}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_PLANNING_DESIGN", hours: 1360, work_period_start: "2026-05-01", work_period_end: "2026-06-30" }, as: Candidate, as_user_id: "${cand_id}", captures: { r_ppd: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r_ppd}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r_ppd}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROJECT_DEVELOPMENT_DOCUMENTATION", hours: 1520, work_period_start: "2026-07-01", work_period_end: "2026-07-31" }, as: Candidate, as_user_id: "${cand_id}", captures: { r_pdd: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r_pdd}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r_pdd}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "CONSTRUCTION_EVALUATION", hours: 80, work_period_start: "2026-08-03", work_period_end: "2026-08-14" }, as: Candidate, as_user_id: "${cand_id}", captures: { r_ce: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r_ce}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports/${r_ce}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/candidates/${cand_id}/exam-authorizations", payload: { jurisdiction_code: "J1" }, as: BoardAdministrator }
            - { call: "GET /licensure/candidates/${cand_id}/exam-progress", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { div_ce: "$.data[0].id", div_pa: "$.data[1].id", div_pcm: "$.data[2].id", div_pdd: "$.data[3].id", div_pjm: "$.data[4].id", div_ppd: "$.data[5].id" } }
            - { call: "POST /licensure/exam-progress/${div_ce}/schedule", payload: { scheduled_date: "2026-10-01" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/exam-progress/${div_pa}/schedule", payload: { scheduled_date: "2026-10-02" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/exam-progress/${div_pcm}/schedule", payload: { scheduled_date: "2026-10-03" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/exam-progress/${div_pdd}/schedule", payload: { scheduled_date: "2026-10-04" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/exam-progress/${div_pjm}/schedule", payload: { scheduled_date: "2026-10-05" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/exam-progress/${div_ppd}/schedule", payload: { scheduled_date: "2026-10-06" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-10-06T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_ce}/report-score", payload: { result: "PASS", scaled_score: 75 }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_pa}/report-score", payload: { result: "PASS", scaled_score: 75 }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_pcm}/report-score", payload: { result: "PASS", scaled_score: 75 }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_pdd}/report-score", payload: { result: "PASS", scaled_score: 75 }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_pjm}/report-score", payload: { result: "PASS", scaled_score: 75 }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_ppd}/report-score", payload: { result: "PASS", scaled_score: 75 }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates/${cand_id}/certificate", payload: {}, as: NcarbAdministrator, captures: { cert_id: $.data.id } }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2027-07-02T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/certificates/${cert_id}/ce-entries", payload: { hours: 18, hsw: true, completed_date: "2027-06-01", provider: "AIA" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/certificates/${cert_id}/ce-entries", payload: { hours: 12, hsw: false, completed_date: "2027-07-01", provider: "AIA" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/certificates/${cert_id}/renew", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2029-07-02T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/certificates/${cert_id}/ce-entries", payload: { hours: 12, hsw: true, completed_date: "2029-06-01", provider: "AIA" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/certificates/${cert_id}/ce-entries", payload: { hours: 6, hsw: false, completed_date: "2029-07-01", provider: "AIA" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2030-09-06T00:00:00Z" }, as: NcarbAdministrator }
          trigger:
            - { call: "POST /licensure/certificates/${cert_id}/renew", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { strict_err: $.data.error_id } }
            - { call: "PATCH /licensure/jurisdictions/${j1_id}", payload: { expected_jurisdiction_version: "${j1_v}", ce_carry_over_allowed: true }, as: NcarbAdministrator }
            - { call: "POST /licensure/certificates/${cert_id}/renew", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
          assert:
            - "first renew (period_strict variant): error_id == ERR_CE_HOURS_INSUFFICIENT because period-2 total 18 < 24"
            - "certificate remains ACTIVE with renewal_count == 1 after the failed renewal"
            - "second renew (carry_over variant, same CE history): succeeds because 18 + min(30-24, 12) = 24 >= 24 and HSW 12 >= 12"
            - "Certificate.renewal_count == 2, period_start == 2030-10-06, period_end == 2032-10-06, status == ACTIVE"
  - rule_id: combinatorial_formula
    instances:
      - name: experience_credit_per_report_rounding_then_sum
        grounds:
          - calculations.experience_credit_tiering
          - calculations.area_progress_aggregation
        distinguishing_aspect: |
          Mode (b) nested rounding: credited_hours rounds round_half_up to an
          integer PER REPORT before area summation, so two 50%-tier reports of
          7h and 9h credit 4 + 5 = 9, whereas the forbidden sum-then-round
          order would credit round_half_up(16 * 0.5) = 8.
        test_recipe:
          setup:
            - "jurisdiction J1, candidate C, supervisor S ACTIVE"
            - "R1: PROGRAMMING_ANALYSIS 7h, work 2025-05-01..2025-06-30, submitted at 2026-09-01 -> 50% tier"
            - "R2: PROGRAMMING_ANALYSIS 9h, work 2025-03-01..2025-04-30, submitted at 2026-09-01 -> 50% tier"
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/supervisors", payload: { full_name: "Sup One", license_number: "LIC-1", jurisdiction_code: "J1" }, as: NcarbAdministrator, captures: { sup_id: $.data.id } }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROGRAMMING_ANALYSIS", hours: 7, work_period_start: "2025-05-01", work_period_end: "2025-06-30" }, as: Candidate, as_user_id: "${cand_id}", captures: { r1_id: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r1_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/experience-reports", payload: { candidate_id: "${cand_id}", supervisor_id: "${sup_id}", practice_area: "PROGRAMMING_ANALYSIS", hours: 9, work_period_start: "2025-03-01", work_period_end: "2025-04-30" }, as: Candidate, as_user_id: "${cand_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /licensure/experience-reports/${r2_id}/submit", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
          trigger:
            - { call: "POST /licensure/experience-reports/${r1_id}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "POST /licensure/experience-reports/${r2_id}/verify", payload: {}, as: Supervisor, as_user_id: "${sup_id}" }
            - { call: "GET /licensure/candidates/${cand_id}/summary", payload: {}, as: Candidate, as_user_id: "${cand_id}" }
          assert:
            - "ExperienceReport.${r1_id}.credited_hours == 4 (round_half_up(7 * 0.5) = round_half_up(3.5))"
            - "ExperienceReport.${r2_id}.credited_hours == 5 (round_half_up(9 * 0.5) = round_half_up(4.5))"
            - "summary.area_progress.PROGRAMMING_ANALYSIS == 9 (per-report rounding then sum; sum-then-round would give 8)"
            - "summary.total_credited_hours == 9"
      - name: rolling_clock_window_membership
        grounds:
          - calculations.rolling_clock_validity
          - state_machines.ExamDivisionProgress.PASSED_to_EXPIRED
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: rolling-clock validity is a
          per-division comparison of (passed_at + 60 months) against the
          current date with a nested min over the pass set anchoring the
          effective window - after the sweep at 2031-10-15 the 2026-10-01 pass
          lapses while the 2027-10-01 pass survives, so validity is not a
          single global deadline.
        test_recipe:
          setup:
            - "jurisdiction J1, candidate C with exam authorization"
            - "division CE passed with sitting 2026-10-01 (expires 2031-10-01); division PA passed with sitting 2027-10-01 (expires 2032-10-01)"
            - "clock advanced to 2031-10-15"
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/candidates/${cand_id}/exam-authorizations", payload: { jurisdiction_code: "J1" }, as: BoardAdministrator }
            - { call: "GET /licensure/candidates/${cand_id}/exam-progress", payload: {}, as: Candidate, as_user_id: "${cand_id}", captures: { div_ce: "$.data[0].id", div_pa: "$.data[1].id" } }
            - { call: "POST /licensure/exam-progress/${div_ce}/schedule", payload: { scheduled_date: "2026-10-01" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/exam-progress/${div_pa}/schedule", payload: { scheduled_date: "2027-10-01" }, as: Candidate, as_user_id: "${cand_id}" }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_ce}/report-score", payload: { result: "PASS", scaled_score: 75 }, as: NcarbAdministrator }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2027-10-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/exam-progress/${div_pa}/report-score", payload: { result: "PASS", scaled_score: 75 }, as: NcarbAdministrator }
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2031-10-15T00:00:00Z" }, as: NcarbAdministrator }
          trigger:
            - { call: "POST /licensure/_maintenance/run_expiry_sweep", payload: {}, as: NcarbAdministrator, captures: { expired_n: $.data.expired_divisions } }
            - { call: "POST /licensure/exam-progress/${div_ce}/schedule", payload: { scheduled_date: "2031-11-01" }, as: Candidate, as_user_id: "${cand_id}" }
          assert:
            - "sweep result expired_divisions == 1 (only the CE pass lapsed)"
            - "ExamDivisionProgress.${div_ce}.status == EXPIRED after sweep, then == SCHEDULED: EXPIRED -> SCHEDULED is legal with no retake wait"
            - "ExamDivisionProgress.${div_pa}.status == PASSED and expires_at == 2032-10-01 (survives 25 days past its sibling's lapse)"
            - "Candidate.exam_status == AUTHORIZED (never reached ALL_PASSED; only 2 of 6 divisions hold passes)"
            - "Candidate.certificate_eligible == false"
  - rule_id: non_linear_state_machine
    instances:
      - name: education_evaluation_deficiency_cycle
        grounds:
          - state_machines.EducationEvaluation.DEFICIENT_to_SUBMITTED
          - state_machines.EducationEvaluation.SUBMITTED_to_SATISFIED
        distinguishing_aspect: |
          Cyclic machine on EducationEvaluation: SUBMITTED -> DEFICIENT ->
          SUBMITTED -> SATISFIED traverses the resubmit loop once; the cycle is
          on a different entity (EducationEvaluation) than the exam-division
          retake loop.
        test_recipe:
          setup:
            - "jurisdiction J1, candidate C; one ALTERNATIVE_PATH evaluation with 64 credits (boundary) under review"
          setup_api_calls:
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
            - { call: "POST /licensure/candidates", payload: { email: "c1@x.com", full_name: "Cand One", password: "pw", home_jurisdiction_code: "J1" }, as: Anonymous, captures: { cand_id: $.data.id } }
            - { call: "POST /licensure/candidates/${cand_id}/education-evaluations", payload: { path_type: "ALTERNATIVE_PATH", institution_name: "Night College", semester_credit_hours: 64 }, as: Candidate, as_user_id: "${cand_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /licensure/education-evaluations/${ev_id}/review", payload: { decision: "DEFICIENT", deficiency_notes: "missing structures coursework" }, as: NcarbAdministrator }
            - { call: "POST /licensure/education-evaluations/${ev_id}/resubmit", payload: { semester_credit_hours: 72 }, as: Candidate, as_user_id: "${cand_id}" }
          trigger:
            - { call: "POST /licensure/education-evaluations/${ev_id}/review", payload: { decision: "SATISFIED" }, as: NcarbAdministrator }
          assert:
            - "EducationEvaluation.${ev_id}.status == SATISFIED after one full DEFICIENT->SUBMITTED loop"
            - "EducationEvaluation.${ev_id}.review_count == 2"
            - "EducationEvaluation.${ev_id}.deficiency_notes == null (cleared at resubmit)"
            - "EducationEvaluation.${ev_id}.semester_credit_hours == 72 (resubmit replaced the field)"
            - "Candidate.education_status == SATISFIED"
      - name: exam_division_fail_retake_cycle
        grounds:
          - state_machines.ExamDivisionProgress.FAILED_to_SCHEDULED
          - calculations.retake_eligibility
        distinguishing_aspect: |
          Cyclic machine on ExamDivisionProgress (different entity than the
          education-evaluation loop): ELIGIBLE -> SCHEDULED -> FAILED ->
          SCHEDULED -> FAILED -> SCHEDULED -> PASSED runs the retake loop twice
