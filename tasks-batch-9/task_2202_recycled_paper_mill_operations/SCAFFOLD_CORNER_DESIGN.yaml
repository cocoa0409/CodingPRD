      - name: effective_yield_is_clamped_at_the_yield_floor_for_dirty_furnish
        claim_type: constants_applied
        grounds:
          - calculations.pulp_yield_provisional
          - calculations.pulp_yield_provisional.constants.YIELD_FLOOR_PCT
          - calculations.pulp_yield_provisional.constants.CONTAM_PENALTY_FACTOR
          - validations.priority_47
        distinguishing_aspect: "A 48.00% book-yield mixed-paper grade at 3.00% lot contamination gives 48.00 - 1.8 * 3.00 = 42.60, below YIELD_FLOOR_PCT, so the clamp must lift it to 45.00 and provisional_accepted_tons is 4.500, not 4.260. blend_contamination_pct is 3.000, which also proves priority 47's 3.500 ceiling is not tripped by this dirty-but-legal charge."
