scenario: |
  1819. Housing Choice Voucher Landlord Participation (participating landlord):
  unit eligibility & rent reasonableness determination, inspection scheduling &
  fail item repair timeline, HAP contract execution & payment start date,
  tenant portion vs housing authority portion calculation, annual
  recertification & rent increase request, abatement for failed inspection &
  repair verification, tenant move-out & contract termination, portability &
  payment standard changes

domain_name: "hcv-landlord-participation"
api_prefix: "/hcv"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: hierarchical
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Landlord's legal name"
      - name: tax_id
        type: string
        source: input
        description: "Landlord tax identification number; unique across Landlord"
        constraints: "unique"
      - name: status
        type: enum
        source: system
        description: "Registration lifecycle"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | TERMINATED"

  - name: Property
    parent: Landlord
    common_fields: true
    fields:
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; owning landlord"
      - name: address
        type: string
        source: input
        description: "Street address of the property"
      - name: zip_code
        type: string
        source: input
        description: "ZIP code; determines payment standard area"

  - name: Unit
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; containing property"
      - name: unit_label
        type: string
        source: input
        description: "Unit number/label within property"
      - name: bedroom_count
        type: integer
        source: input
        description: "Number of bedrooms; drives payment standard lookup"
      - name: status
        type: enum
        source: system
        description: "Unit lifecycle for voucher program"
        default: LISTED
        constraints: "LISTED | UNDER_CONTRACT | SUSPENDED_ABATEMENT | DELISTED"

  - name: VoucherFamily
    parent: null
    common_fields: true
    fields:
      - name: family_code
        type: string
        source: input
        description: "Unique family identifier code"
        constraints: "unique"
      - name: voucher_bedroom_size
        type: integer
        source: input
        description: "Bedroom size the family's voucher authorizes"
      - name: annual_income_cents
        type: integer
        source: input
        description: "Family annual income in cents; drives tenant portion"
      - name: status
        type: enum
        source: system
        description: "Voucher lifecycle"
        default: SEARCHING
        constraints: "SEARCHING | LEASED | PORTED_OUT | EXITED"

  - name: PaymentStandard
    parent: null
    common_fields: true
    fields:
      - name: zip_code
        type: string
        source: input
        description: "ZIP code this standard applies to"
      - name: bedroom_count
        type: integer
        source: input
        description: "Bedroom count this standard applies to"
      - name: amount_cents
        type: integer
        source: input
        description: "Payment standard amount in cents for (zip, bedrooms)"
      - name: effective_from
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) from which this standard is effective (inclusive)"
      - name: effective_to
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) until which this standard is effective (inclusive); null means open-ended"
        default: null

  - name: HAPContract
    parent: Unit
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; unit under contract"
      - name: family_id
        type: string
        source: input
        description: "FK -> VoucherFamily.id; voucher family housed"
      - name: contract_rent_cents
        type: integer
        source: input
        description: "Landlord-requested contract rent in cents"
      - name: approved_rent_cents
        type: integer
        source: system
        description: "Rent approved after rent-reasonableness review"
        default: 0
      - name: hap_portion_cents
        type: integer
        source: computed
        description: "Housing authority payment portion per month"
        default: 0
      - name: tenant_portion_cents
        type: integer
        source: computed
        description: "Tenant payment portion per month"
        default: 0
      - name: lease_start_date
        type: string
        source: input
        description: "ISO date (YYYY-MM-DD) lease begins"
      - name: status
        type: enum
        source: system
        description: "HAP contract lifecycle"
        default: DRAFT
        constraints: "DRAFT | PENDING_INSPECTION | APPROVED | ACTIVE | ABATED | TERMINATED"
      - name: next_recert_due_date
        type: string
        source: system
        description: "ISO date of the next annual recertification (lease anniversary); null until ACTIVE"
        default: null

  - name: Inspection
    parent: HAPContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> HAPContract.id; contract being inspected"
      - name: inspection_type
        type: enum
        source: input
        description: "Kind of inspection"
        constraints: "INITIAL | ANNUAL | REINSPECTION | COMPLAINT"
      - name: scheduled_date
        type: string
        source: input
        description: "ISO date the inspection is scheduled"
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle"
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED | REPAIR_VERIFICATION | CLOSED"
      - name: result_recorded_date
        type: string
        source: system
        description: "ISO date the result was recorded; null until PASSED/FAILED"
        default: null

  - name: RepairItem
    parent: Inspection
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; inspection that found the deficiency"
      - name: description
        type: string
        source: input
        description: "Deficiency description"
      - name: is_life_threatening
        type: boolean
        source: input
        description: "Life-threatening items have a 24-hour repair window"
        default: false
      - name: status
        type: enum
        source: system
        description: "Repair lifecycle"
        default: OPEN
        constraints: "OPEN | REPAIRED | VERIFIED | FAILED_VERIFICATION"

  - name: RentComparable
    parent: null
    common_fields: true
    fields:
      - name: zip_code
        type: string
        source: input
        description: "ZIP of the comparable unit"
      - name: bedroom_count
        type: integer
        source: input
        description: "Bedrooms of the comparable unit"
      - name: rent_cents
        type: integer
        source: input
        description: "Observed market rent in cents of the comparable"
      - name: survey_date
        type: string
        source: input
        description: "ISO date the comparable rent was surveyed"

  - name: RentIncreaseRequest
    parent: HAPContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> HAPContract.id; contract the increase applies to"
      - name: requested_rent_cents
        type: integer
        source: input
        description: "Requested new contract rent in cents"
      - name: effective_date
        type: string
        source: input
        description: "ISO date the increase would take effect; must be on or after the next recert anniversary"
      - name: status
        type: enum
        source: system
        description: "Increase request lifecycle"
        default: PENDING
        constraints: "PENDING | APPROVED | DENIED | WITHDRAWN"

  - name: Recertification
    parent: HAPContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> HAPContract.id; contract being recertified"
      - name: due_date
        type: string
        source: input
        description: "ISO date the recertification is due (lease anniversary)"
      - name: new_family_income_cents
        type: integer
        source: input
        description: "Updated family annual income in cents for the new period"
      - name: status
        type: enum
        source: system
        description: "Recertification lifecycle"
        default: OPEN
        constraints: "OPEN | COMPLETED | OVERDUE"

  - name: HAPPayment
    parent: HAPContract
    common_fields: false
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> HAPContract.id; contract this payment is for"
      - name: period_month
        type: string
        source: input
        description: "ISO date first-of-month (YYYY-MM-01) this payment covers"
      - name: hap_amount_cents
        type: integer
        source: computed
        description: "HAP disbursement amount after abatement/proration adjustments"
      - name: disbursement_status
        type: enum
        source: system
        description: "Payment disbursement lifecycle"
        default: SCHEDULED
        constraints: "SCHEDULED | PAID | ABATED_HELD | VOID"

  - name: PortabilityAction
    parent: VoucherFamily
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> VoucherFamily.id; family exercising portability"
      - name: destination_zip
        type: string
        source: input
        description: "ZIP code the family is porting to"
      - name: action_type
        type: enum
        source: input
        description: "Port-in or port-out"
        constraints: "PORT_IN | PORT_OUT"
      - name: status
        type: enum
        source: system
        description: "Portability lifecycle"
        default: INITIATED
        constraints: "INITIATED | BILLING_ACCEPTED | ABSORBED | TERMINATED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Landlord
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /hcv/landlords/{id}/suspend"
        actor: HousingAuthorityAdmin
        preconditions:
          - "Landlord.status == ACTIVE"
        side_effects:
          - "New HAPContract creation for landlord's units is blocked while SUSPENDED"
          - "increments Landlord.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /hcv/landlords/{id}/reinstate"
        actor: HousingAuthorityAdmin
        preconditions:
          - "Landlord.status == SUSPENDED"
        side_effects:
          - "increments Landlord.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /hcv/landlords/{id}/terminate"
        actor: HousingAuthorityAdmin
        preconditions:
          - "Landlord.status == ACTIVE"
          - "No HAPContract for any of landlord's units is in status ACTIVE or ABATED"
        side_effects:
          - "increments Landlord.version by 1"

  - entity: Unit
    initial_state: LISTED
    terminal_states: [DELISTED]
    transitions:
      - from: LISTED
        to: UNDER_CONTRACT
        trigger: "POST /hcv/contracts (create HAPContract for unit)"
        actor: Landlord
        preconditions:
          - "Unit.status == LISTED"
          - "Parent landlord's status == ACTIVE"
        side_effects:
          - "increments Unit.version by 1"
      - from: UNDER_CONTRACT
        to: SUSPENDED_ABATEMENT
        trigger: "system: HAPContract enters ABATED"
        actor: system
        preconditions:
          - "Unit's active HAPContract.status transitions to ABATED"
        side_effects:
          - "increments Unit.version by 1"
      - from: SUSPENDED_ABATEMENT
        to: UNDER_CONTRACT
        trigger: "system: HAPContract exits ABATED back to ACTIVE"
        actor: system
        preconditions:
          - "Unit's active HAPContract.status transitions ABATED -> ACTIVE"
        side_effects:
          - "increments Unit.version by 1"
      - from: UNDER_CONTRACT
        to: LISTED
        trigger: "system: HAPContract TERMINATED (move-out or termination)"
        actor: system
        preconditions:
          - "Unit's active HAPContract transitions to TERMINATED"
        side_effects:
          - "increments Unit.version by 1"
      - from: LISTED
        to: DELISTED
        trigger: "POST /hcv/units/{id}/delist"
        actor: Landlord
        preconditions:
          - "Unit.status == LISTED"
          - "acting landlord owns the unit's property"
        side_effects:
          - "increments Unit.version by 1"

  - entity: HAPContract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_INSPECTION
        trigger: "POST /hcv/contracts/{id}/submit"
        actor: Landlord
        preconditions:
          - "HAPContract.status == DRAFT"
          - "acting landlord owns the contract's unit"
          - "contract_rent_cents > 0"
        side_effects:
          - "runs calculation rent_reasonableness to set approved_rent_cents"
          - "runs calculation hap_split to set hap_portion_cents and tenant_portion_cents"
          - "auto-creates an INITIAL Inspection in SCHEDULED status"
          - "increments HAPContract.version by 1"
      - from: PENDING_INSPECTION
        to: APPROVED
        trigger: "POST /hcv/inspections/{id}/record-result with outcome PASS"
        actor: Inspector
        preconditions:
          - "Linked Inspection.status == SCHEDULED and inspection_type == INITIAL"
          - "HAPContract.status == PENDING_INSPECTION"
        side_effects:
          - "Inspection.status -> PASSED, result_recorded_date set"
          - "increments HAPContract.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /hcv/contracts/{id}/activate"
        actor: HousingAuthorityAdmin
        preconditions:
          - "HAPContract.status == APPROVED"
          - "lease_start_date <= current logical date"
        side_effects:
          - "sets next_recert_due_date = lease_start_date + 1 year"
          - "VoucherFamily.status SEARCHING -> LEASED"
          - "schedules first HAPPayment (payment_start rule: if lease_start_date day-of-month == 1 then first period is that month, else prorated first partial month is skipped and first HAPPayment period is the first day of the following month)"
          - "increments HAPContract.version by 1"
      - from: ACTIVE
        to: ABATED
        trigger: "system: repair deadline breach on a FAILED inspection"
        actor: system
        preconditions:
          - "HAPContract.status == ACTIVE"
          - "An Inspection with status FAILED has at least one RepairItem with status OPEN or FAILED_VERIFICATION whose repair deadline (result_recorded_date + REPAIR_WINDOW_DAYS, or +1 day if is_life_threatening) is earlier than the current logical date"
        side_effects:
          - "Unit.status UNDER_CONTRACT -> SUSPENDED_ABATEMENT"
          - "All HAPPayment rows for periods after the breach with disbursement_status SCHEDULED flip to ABATED_HELD"
          - "increments HAPContract.version by 1"
      - from: ABATED
        to: ACTIVE
        trigger: "POST /hcv/repair-items/{id}/verify (last open item verified)"
        actor: Inspector
        preconditions:
          - "HAPContract.status == ABATED"
          - "All RepairItems on the triggering failed inspection are in status VERIFIED"
        side_effects:
          - "Inspection.status REPAIR_VERIFICATION -> CLOSED"
          - "Unit.status SUSPENDED_ABATEMENT -> UNDER_CONTRACT"
          - "ABATED_HELD HAPPayments are recomputed with abatement proration: days under abatement are deducted from hap_amount_cents; recomputed rows return to SCHEDULED (period not yet disbursed) or stay PAID (already disbursed, delta recorded)"
          - "increments HAPContract.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /hcv/contracts/{id}/terminate"
        actor: HousingAuthorityAdmin
        preconditions:
          - "HAPContract.status == ACTIVE"
        side_effects:
          - "VoucherFamily.status LEASED -> SEARCHING"
          - "Unit.status UNDER_CONTRACT -> LISTED"
          - "Future SCHEDULED HAPPayments flip to VOID"
          - "increments HAPContract.version by 1"
      - from: ABATED
        to: TERMINATED
        trigger: "POST /hcv/contracts/{id}/terminate"
        actor: HousingAuthorityAdmin
        preconditions:
          - "HAPContract.status == ABATED"
        side_effects:
          - "VoucherFamily.status LEASED -> SEARCHING"
          - "Unit.status SUSPENDED_ABATEMENT -> LISTED"
          - "Future SCHEDULED or ABATED_HELD HAPPayments flip to VOID"
          - "increments HAPContract.version by 1"
      - from: PENDING_INSPECTION
        to: DRAFT
        trigger: "POST /hcv/contracts/{id}/withdraw"
        actor: Landlord
        preconditions:
          - "HAPContract.status == PENDING_INSPECTION"
          - "acting landlord owns the contract's unit"
        side_effects:
          - "Cancels the SCHEDULED INITIAL Inspection (Inspection.status -> CLOSED)"
          - "approved_rent_cents, hap_portion_cents, tenant_portion_cents reset to 0"
          - "increments HAPContract.version by 1"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, CLOSED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /hcv/inspections/{id}/record-result with outcome PASS"
        actor: Inspector
        preconditions:
          - "Inspection.status == SCHEDULED"
        side_effects:
          - "sets result_recorded_date = current logical date"
          - "if inspection_type == INITIAL and contract in PENDING_INSPECTION: contract -> APPROVED"
          - "increments Inspection.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /hcv/inspections/{id}/record-result with outcome FAIL"
        actor: Inspector
        preconditions:
          - "Inspection.status == SCHEDULED"
          - "At least one RepairItem must be created for the inspection before or with result FAIL"
        side_effects:
          - "sets result_recorded_date = current logical date"
          - "if contract is ACTIVE: contract will auto-abate when repair deadline breaches (checked on clock advance)"
          - "increments Inspection.version by 1"
      - from: FAILED
        to: REPAIR_VERIFICATION
        trigger: "POST /hcv/inspections/{id}/request-reinspection"
        actor: Landlord
        preconditions:
          - "Inspection.status == FAILED"
          - "All RepairItems on this inspection are in status REPAIRED"
          - "acting landlord owns the unit under inspection"
        side_effects:
          - "increments Inspection.version by 1"
      - from: REPAIR_VERIFICATION
        to: CLOSED
        trigger: "POST /hcv/repair-items/{id}/verify (when final item verified)"
        actor: Inspector
        preconditions:
          - "Inspection.status == REPAIR_VERIFICATION"
          - "All RepairItems on this inspection are in status VERIFIED"
        side_effects:
          - "if contract is ABATED: contract ABATED -> ACTIVE (see HAPContract side effects)"
          - "increments Inspection.version by 1"
      - from: REPAIR_VERIFICATION
        to: FAILED
        trigger: "POST /hcv/repair-items/{id}/verify with outcome FAIL (any item fails verification)"
        actor: Inspector
        preconditions:
          - "Inspection.status == REPAIR_VERIFICATION"
        side_effects:
          - "failing RepairItem.status -> FAILED_VERIFICATION; repair deadline clock restarts from the new verification date"
          - "increments Inspection.version by 1"
      - from: SCHEDULED
        to: CLOSED
        trigger: "system: contract withdrawn (cancels initial inspection)"
        actor: system
        preconditions:
          - "Parent HAPContract transitions PENDING_INSPECTION -> DRAFT"
        side_effects:
          - "increments Inspection.version by 1"

  - entity: RepairItem
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: REPAIRED
        trigger: "POST /hcv/repair-items/{id}/mark-repaired"
        actor: Landlord
        preconditions:
          - "RepairItem.status == OPEN"
          - "acting landlord owns the unit"
        side_effects:
          - "increments RepairItem.version by 1"
      - from: FAILED_VERIFICATION
        to: REPAIRED
        trigger: "POST /hcv/repair-items/{id}/mark-repaired"
        actor: Landlord
        preconditions:
          - "RepairItem.status == FAILED_VERIFICATION"
          - "acting landlord owns the unit"
        side_effects:
          - "increments RepairItem.version by 1"
      - from: REPAIRED
        to: VERIFIED
        trigger: "POST /hcv/repair-items/{id}/verify with outcome PASS"
        actor: Inspector
        preconditions:
          - "RepairItem.status == REPAIRED"
          - "Parent Inspection.status == REPAIR_VERIFICATION"
        side_effects:
          - "when this is the last non-VERIFIED item on the inspection: Inspection REPAIR_VERIFICATION -> CLOSED; if contract ABATED: contract ABATED -> ACTIVE with payment recompute cascade"
          - "increments RepairItem.version by 1"
      - from: REPAIRED
        to: FAILED_VERIFICATION
        trigger: "POST /hcv/repair-items/{id}/verify with outcome FAIL"
        actor: Inspector
        preconditions:
          - "RepairItem.status == REPAIRED"
          - "Parent Inspection.status == REPAIR_VERIFICATION"
        side_effects:
          - "Inspection REPAIR_VERIFICATION -> FAILED"
          - "increments RepairItem.version by 1"

  - entity: RentIncreaseRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /hcv/rent-increase-requests/{id}/approve"
        actor: HousingAuthorityAdmin
        preconditions:
          - "RentIncreaseRequest.status == PENDING"
          - "Parent HAPContract.status == ACTIVE"
          - "effective_date >= contract.next_recert_due_date"
          - "requested rent passes rent_reasonableness against PaymentStandard and RentComparables"
        side_effects:
          - "HAPContract.contract_rent_cents and approved_rent_cents updated; hap_portion_cents and tenant_portion_cents recomputed (effective from effective_date forward; prior periods unchanged)"
          - "increments RentIncreaseRequest.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /hcv/rent-increase-requests/{id}/deny"
        actor: HousingAuthorityAdmin
        preconditions:
          - "RentIncreaseRequest.status == PENDING"
        side_effects:
          - "increments RentIncreaseRequest.version by 1"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /hcv/rent-increase-requests/{id}/withdraw"
        actor: Landlord
        preconditions:
          - "RentIncreaseRequest.status == PENDING"
          - "acting landlord owns the contract's unit"
        side_effects:
          - "increments RentIncreaseRequest.version by 1"

  - entity: Recertification
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /hcv/recertifications/{id}/complete"
        actor: HousingAuthorityAdmin
        preconditions:
          - "Recertification.status == OPEN"
          - "Parent HAPContract.status == ACTIVE"
        side_effects:
          - "VoucherFamily.annual_income_cents updated to new_family_income_cents"
          - "hap_portion_cents and tenant_portion_cents on HAPContract recomputed with new income"
          - "HAPContract.next_recert_due_date += 1 year"
          - "a new Recertification row is auto-created with due_date = next_recert_due_date"
          - "increments Recertification.version by 1"
      - from: OPEN
        to: OVERDUE
        trigger: "system: clock advances past due_date while still OPEN"
        actor: system
        preconditions:
          - "Recertification.status == OPEN"
          - "current logical date > due_date"
        side_effects:
          - "increments Recertification.version by 1"

  - entity: HAPPayment
    initial_state: SCHEDULED
    terminal_states: [PAID, VOID]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /hcv/hap-payments/{id}/disburse"
        actor: HousingAuthorityAdmin
        preconditions:
          - "HAPPayment.disbursement_status == SCHEDULED"
          - "Parent HAPContract.status == ACTIVE"
        side_effects: []
      - from: SCHEDULED
        to: ABATED_HELD
        trigger: "system: contract enters ABATED"
        actor: system
        preconditions:
          - "Parent HAPContract transitions ACTIVE -> ABATED"
        side_effects: []
      - from: ABATED_HELD
        to: SCHEDULED
        trigger: "system: contract exits ABATED; amount recomputed with abatement proration"
        actor: system
        preconditions:
          - "Parent HAPContract transitions ABATED -> ACTIVE"
        side_effects:
          - "hap_amount_cents recomputed: full-month HAP minus (abated days / days in period month) * full-month HAP, rounded half-up to cents"
      - from: SCHEDULED
        to: VOID
        trigger: "system: contract TERMINATED"
        actor: system
        preconditions:
          - "Parent HAPContract transitions to TERMINATED"
        side_effects: []
      - from: ABATED_HELD
        to: VOID
        trigger: "system: contract TERMINATED while ABATED"
        actor: system
        preconditions:
          - "Parent HAPContract transitions ABATED -> TERMINATED"
        side_effects: []

  - entity: PortabilityAction
    initial_state: INITIATED
    terminal_states: [ABSORBED, TERMINATED]
    transitions:
      - from: INITIATED
        to: BILLING_ACCEPTED
        trigger: "POST /hcv/portability-actions/{id}/accept-billing"
        actor: HousingAuthorityAdmin
        preconditions:
          - "PortabilityAction.status == INITIATED"
        side_effects:
          - "increments PortabilityAction.version by 1"
      - from: BILLING_ACCEPTED
        to: ABSORBED
        trigger: "POST /hcv/portability-actions/{id}/absorb"
        actor: HousingAuthorityAdmin
        preconditions:
          - "PortabilityAction.status == BILLING_ACCEPTED"
        side_effects:
          - "if action_type == PORT_OUT: VoucherFamily.status LEASED -> PORTED_OUT; linked HAPContract ACTIVE -> TERMINATED (move-out cascade)"
          - "increments PortabilityAction.version by 1"
      - from: INITIATED
        to: TERMINATED
        trigger: "POST /hcv/portability-actions/{id}/terminate"
        actor: HousingAuthorityAdmin
        preconditions:
          - "PortabilityAction.status == INITIATED"
        side_effects:
          - "increments PortabilityAction.version by 1"

  - entity: VoucherFamily
    initial_state: SEARCHING
    terminal_states: [EXITED]
    transitions:
      - from: SEARCHING
        to: LEASED
        trigger: "system: HAPContract APPROVED -> ACTIVE"
        actor: system
        preconditions:
          - "Linked HAPContract activates"
        side_effects:
          - "increments VoucherFamily.version by 1"
      - from: LEASED
        to: SEARCHING
        trigger: "system: HAPContract TERMINATED (move-out)"
        actor: system
        preconditions:
          - "Linked HAPContract terminates"
        side_effects:
          - "increments VoucherFamily.version by 1"
      - from: LEASED
        to: PORTED_OUT
        trigger: "system: PortabilityAction PORT_OUT absorbed"
        actor: system
        preconditions:
          - "PortabilityAction with action_type == PORT_OUT reaches ABSORBED"
        side_effects:
          - "increments VoucherFamily.version by 1"
      - from: SEARCHING
        to: EXITED
        trigger: "POST /hcv/voucher-families/{id}/exit"
        actor: HousingAuthorityAdmin
        preconditions:
          - "VoucherFamily.status == SEARCHING"
        side_effects:
          - "increments VoucherFamily.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: contract-create-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /hcv/contracts"
    occ_field: "expected_unit_version"
    description: |
      Creating a HAPContract against a Unit whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. This captures
      the case where another writer has just created a contract for the same
      unit (which flips Unit.status LISTED -> UNDER_CONTRACT and bumps the
      version) and the current writer's view of the unit is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: recert-complete-stale-contract
    parent_entity: HAPContract
    write_endpoint: "POST /hcv/recertifications/{id}/complete"
    occ_field: "expected_contract_version"
    description: |
      Completing a Recertification against a HAPContract whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. The contract's version moves on every recertification
      completion and rent-increase approval, so a stale reader re-running the
      completion would double-apply the anniversary advance.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rent_reasonableness
    trigger: "HAPContract DRAFT -> PENDING_INSPECTION (submit); RentIncreaseRequest approve"
    algorithm: aggregation
    formula: |
      comparables = RentComparable rows where zip_code == unit's property zip_code
        AND bedroom_count == unit.bedroom_count
        AND survey_date within the 12 months preceding current logical date (inclusive)
      if comparables is empty:
        approved_rent_cents = min(contract_rent_cents, payment_standard.amount_cents)
      else:
        comparable_median = median of comparables.rent_cents
          (for even count: average of the two middle values, round_half_up to cents)
        cap = min(payment_standard.amount_cents, round_half_up(comparable_median * COMPARABLE_CAP_RATIO))
        approved_rent_cents = min(contract_rent_cents, cap)
      payment_standard = PaymentStandard row matching (property zip_code, unit bedroom_count)
        with effective_from <= lease_start_date (or request effective_date) <= effective_to,
        or effective_to null; if multiple rows match, pick the one with the latest effective_from;
        ties broken by created_at ASC
    input_set: "RentComparable rows filtered by zip/bedrooms/recency; PaymentStandard rows filtered by zip/bedrooms/effective window"
    constants:
      COMPARABLE_CAP_RATIO: 1.10
      COMPARABLE_RECENCY_MONTHS: 12
    precision: "integer cents, round_half_up"
    variants:
      - name: standard_cap
        when: "No comparables exist in the trailing 12 months"
        difference: "Cap is the PaymentStandard amount alone"
      - name: comparable_cap
        when: "At least one recent comparable exists"
        difference: "Cap is min(payment_standard, median comparable * 1.10)"

  - name: hap_split
    trigger: "HAPContract submit; RentIncreaseRequest approve; Recertification complete; PaymentStandard change applied to active contract"
    algorithm: threshold
    formula: |
      tenant_minimum = round_half_up(family.annual_income_cents * INCOME_RATIO / 12)
      base_tenant = max(tenant_minimum, approved_rent_cents - payment_standard.amount_cents)
      tenant_portion_cents = min(base_tenant, approved_rent_cents)
      hap_portion_cents = approved_rent_cents - tenant_portion_cents
    input_set: "HAPContract.approved_rent_cents, VoucherFamily.annual_income_cents, applicable PaymentStandard"
    constants:
      INCOME_RATIO: 0.30
    precision: "integer cents, round_half_up; tenant_minimum rounded before the max() comparison"
    variants:
      - name: standard_anniversary
        when: "Routine recertification or initial split"
        difference: "Uses the PaymentStandard effective on lease_start_date (or current anniversary)"
      - name: portability_restandard
        when: "Family ported from a different payment-standard area (PORT_IN absorbed)"
        difference: "Uses the destination area's PaymentStandard even if lower; landlord may receive a lower HAP than under the origin standard"

  - name: abatement_proration
    trigger: "HAPContract ABATED -> ACTIVE (abatement cured); monthly recompute of ABATED_HELD payments"
    algorithm: chronological
    formula: |
      For each HAPPayment row in ABATED_HELD for the contract, in period_month ASC order
        (ties impossible: one row per period_month):
        abated_days = number of calendar days within period_month where contract was in ABATED status
          (abatement window: [abate_start_date, abate_end_date), start inclusive, end exclusive)
        days_in_month = calendar days of period_month
        deduction = round_half_up(hap_portion_cents * abated_days / days_in_month)
        new_hap_amount_cents = hap_portion_cents - deduction
        if abated_days == days_in_month: new_hap_amount_cents = 0
    input_set: "HAPPayment rows with disbursement_status == ABATED_HELD for the contract, ordered by period_month ASC"
    constants: {}
    precision: "integer cents, round_half_up; per-day deduction computed per payment row (not aggregated)"
    variants:
      - name: cure_within_period
        when: "Abatement cured mid-month"
        difference: "Partial-month deduction; payment returns to SCHEDULED with reduced amount"
      - name: full_period_abated
        when: "Contract abated for the entire calendar month"
        difference: "hap_amount_cents becomes 0; row still returns to SCHEDULED for record-keeping"

  - name: first_payment_schedule
    trigger: "HAPContract APPROVED -> ACTIVE (activate)"
    algorithm: chronological
    formula: |
      if day-of-month(lease_start_date) == 1:
        first_period_month = first-of-month(lease_start_date)
      else:
        first_period_month = first-of-month(lease_start_date) + 1 month
        (the partial first month is landlord's responsibility; no prorated HAP is paid)
      create one HAPPayment row with period_month = first_period_month,
        hap_amount_cents = contract.hap_portion_cents, disbursement_status = SCHEDULED
    input_set: "HAPContract.lease_start_date, HAPContract.hap_portion_cents"
    constants: {}
    precision: "integer cents"
    variants:
      - name: month_aligned_start
        when: "lease starts on day 1"
        difference: "First payment covers the lease-start month"
      - name: mid_month_start
        when: "lease starts on day 2..31"
        difference: "First payment covers the following month; the partial month is unpaid by HAP"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a known role; X-User-ID present for entity_backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All path and body referenced resources exist (landlord, property, unit, family, contract, inspection, repair item, payment, request, recertification, portability action), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: state
    check: "OCC expected_*_version matches the parent entity's current version where required"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /hcv/contracts, POST /hcv/recertifications/{id}/complete"
  - priority: 6
    category: business_safety
    check: "Landlord ownership: acting Landlord's id equals the resource chain's landlord_id (unit->property->landlord)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /hcv/properties/{id}/units, POST /hcv/contracts, POST /hcv/contracts/{id}/submit, POST /hcv/contracts/{id}/withdraw, POST /hcv/units/{id}/delist, POST /hcv/repair-items/{id}/mark-repaired, POST /hcv/inspections/{id}/request-reinspection, POST /hcv/rent-increase-requests, POST /hcv/rent-increase-requests/{id}/withdraw"
  - priority: 7
    category: business_safety
    check: "Landlord.status == ACTIVE for new HAPContract creation and property/unit creation"
    error_id: ERR_LANDLORD_SUSPENDED
    http_status: 409
    applies_to: "POST /hcv/contracts, POST /hcv/properties, POST /hcv/properties/{id}/units"
  - priority: 8
    category: business_temporal
    check: "RentIncreaseRequest.effective_date >= HAPContract.next_recert_due_date"
    error_id: ERR_INCREASE_TOO_EARLY
    http_status: 422
    applies_to: "POST /hcv/rent-increase-requests, POST /hcv/rent-increase-requests/{id}/approve"
  - priority: 9
    category: business_temporal
    check: "Inspection.scheduled_date must not precede the current logical date"
    error_id: ERR_SCHEDULE_IN_PAST
    http_status: 422
    applies_to: "POST /hcv/contracts/{id}/inspections"
  - priority: 10
    category: business_referential
    check: "VoucherFamily.voucher_bedroom_size >= Unit.bedroom_count for HAPContract creation (family may under-occupy a smaller unit but not over-occupy)"
    error_id: ERR_VOUCHER_SIZE_MISMATCH
    http_status: 422
    applies_to: "POST /hcv/contracts"
  - priority: 11
    category: business_referential
    check: "Unit has no other HAPContract in status DRAFT, PENDING_INSPECTION, APPROVED, ACTIVE, or ABATED (one live contract per unit)"
    error_id: ERR_UNIT_ALREADY_UNDER_CONTRACT
    http_status: 409
    applies_to: "POST /hcv/contracts"
  - priority: 12
    category: business_fiscal
    check: "Requested/contract rent_cents > 0 and family income >= 0"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /hcv/contracts, POST /hcv/rent-increase-requests, POST /hcv/recertifications, POST /hcv/voucher-families"
  - priority: 13
    category: business_fiscal
    check: "Rent reasonableness ceiling: approve of RentIncreaseRequest requires requested_rent_cents <= min(payment_standard, median comparable * 1.10) when comparables exist, else <= payment_standard"
    error_id: ERR_RENT_NOT_REASONABLE
    http_status: 422
    applies_to: "POST /hcv/rent-increase-requests/{id}/approve"
  - priority: 14
    category: business_constraint
    check: "FAIL result on inspection requires at least one RepairItem already attached to the inspection"
    error_id: ERR_FAIL_REQUIRES_ITEMS
    http_status: 422
    applies_to: "POST /hcv/inspections/{id}/record-result"
  - priority: 15
    category: business_constraint
    check: "request-reinspection requires all RepairItems on the inspection in status REPAIRED"
    error_id: ERR_OPEN_REPAIR_ITEMS
    http_status: 409
    applies_to: "POST /hcv/inspections/{id}/request-reinspection"

