                captures: { past_status: $.data.status }
              - call: "GET /programs/milestones/${ms_future_id}"
                payload: {}
                as: Any
                captures: { future_status: $.data.status }
          assert:
            - "ProtocolMilestone.${ms_past_id}.status == MISSED with no clock call anywhere in the setup"
            - "ProtocolMilestone.${ms_future_id}.status == PENDING"
            - "the split proves the unset clock reads 2026-09-01T00:00:00Z rather than the real wall clock, since a real-time run would place both milestones in the past"
            - "neither milestone moved without an explicit write"

      - name: excluded_frozen_ledger_markup
