              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "PATCH /contacts/${c_id}/position"
              payload: { shares_held: 9999, expected_company_version: "${co_v1}" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "GET /companies/${co_id}"
