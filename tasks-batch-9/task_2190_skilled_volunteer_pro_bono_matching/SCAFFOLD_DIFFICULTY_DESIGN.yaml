      - name: valuation_restatement_conserves_lifetime_total
        grounds:
          - invariants.INV_VALUATION_CONSERVATION
          - state_machines.Engagement.valuation_status.PROVISIONAL_to_RESTATED
          - calculations.volunteer_hour_valuation
          - calculations.engagement_admin_overhead
        distinguishing_aspect: |
          The conserved quantity here is a MONEY aggregate that is not released but RESTATED: the
          compensating action posts a second record of the same amount and supersedes the first,
          so the naive implementer's failure is a double-count rather than a stranded hold. The
          summation predicate (superseded_at IS NULL, method == INDEPENDENT_SECTOR) is the whole
          difficulty, and it is driven by a FAIL quality decision rather than an explicit call.
          Arithmetic, approved TimeLogs DELIVERY 34.50h + ADMIN 3.50h + TRAVEL 2.00h = 40.00h:
            INDEPENDENT_SECTOR admits every class and rounds once:
                 hours_included   = round(34.50+3.50+2.00, 2) = 40.00
                 rate_applied_usd = INDEPENDENT_SECTOR_RATE_USD = 34.79
                 base_amount_usd  = round(40.00 * 34.79, 2) = 1391.60
                 1391.60 < OVERHEAD_TIER_MID_FLOOR_USD 2500.00 -> tier_rate 0.12
                 admin_overhead   = max(45.00, round(1391.60 * 0.12, 2)) = max(45.00, 166.99) = 166.99
                 total_amount_usd = round(1391.60 + 166.99, 2) = 1558.59
            after the PROVISIONAL post -> lifetime_valued_usd 1558.59 (one non-superseded record)
            quality score on the single 100.00-weight deliverable at review_score 2:
                 weighted_score = round(round(100.00/100.00, 6) * 2 * SCORE_SCALE 20, 2) = 40.00
                 40.00 < CONDITIONAL_THRESHOLD 60.00 -> outcome FAIL -> CASCADE-B
            after the FAIL decision -> the PROVISIONAL record gets superseded_at stamped and a
                 RESTATED record is recomputed from the SAME approved 40.00 hours, so it is again
                 1391.60 + 166.99 = 1558.59, and the sum over non-superseded INDEPENDENT_SECTOR
                 records is 1558.59, not 1558.59 + 1558.59 = 3117.18 and not 0.00.
          Three distinct naive outcomes are excluded: 3117.18 (both records summed), 0.00 (both
          records treated as superseded), and 1558.59 arrived at by leaving the original record
          non-superseded and skipping the restatement post entirely - which is why the recipe
          also asserts that exactly two records exist with exactly one of them superseded.
