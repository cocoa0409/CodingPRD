      - name: corner_pagination_and_unknown_field_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "response_envelope.pagination_defaults", "errors.ERR_INVALID_REQUEST"]
        distinguishing_aspect: "The schema rung also polices the envelope: limit 101 and offset -1 are ERR_INVALID_REQUEST (400), and a body-supplied agent_id on POST /farm-accounts is rejected as an unknown field rather than silently ignored."
        test_recipe:
          setup:
