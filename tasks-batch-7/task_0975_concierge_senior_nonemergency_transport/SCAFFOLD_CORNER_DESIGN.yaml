          assert:
            - "First offer: offered1 == ${d1} (zone match); after DECLINE, D1 is in excluded_driver_ids"
            - "Second dispatch: offered2 == ${d2} (D1 excluded), dispatch_round == 2"

      - name: selector_empty_pool_returns_null_and_stays_dispatching
        claim_type: selector_policy
        grounds: [calculations.driver_eligibility, state_machines.Ride.SCHEDULED_to_DISPATCHING]
        distinguishing_aspect: "Empty-pool fallback: with zero eligible drivers the dispatch call succeeds with data null, no assignment row is created, and the ride remains DISPATCHING for a later retry."
        test_recipe:
          setup: ["ACTIVE card; client; one ride; NO drivers exist"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
            - { call: "POST /rate-cards/${rc}/activate", as: PlatformAdmin }
            - { call: "POST /clients", payload: { full_name: "Ada L", mobility_aid: "NONE", assist_level_default: "DOOR_TO_DOOR", home_zone: "north", address: "1 Main St" }, as: Coordinator, captures: { cli: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /rides", payload: { client_id: "${cli}", kind: "GROCERY", scheduled_pickup_at: "2026-06-05T10:00:00Z", estimated_duration_minutes: 60, estimated_distance_miles: 10, origin_zone: "north" }, as: Client, as_user_id: "${cli}", captures: { ride: $.data.id } }
          trigger:
            - { call: "POST /rides/${ride}/dispatch", as: Coordinator, as_user_id: "coord-1" }
            - { call: "GET /rides/${ride}", as: Coordinator, captures: { st: $.data.status, round: $.data.dispatch_round } }
            - { call: "GET /assignments?ride_id=${ride}", as: Coordinator }
          assert:
            - "Dispatch response: http 200 with data == null (no offer created)"
            - "Ride.status == DISPATCHING and dispatch_round == 1"
            - "GET /assignments?ride_id=${ride} returns an empty list (total_count == 0)"

      - name: offer_timeout_expired_by_run_cycle
        claim_type: ops_run_checkpoint
        grounds: [state_machines.Assignment.OFFERED_to_EXPIRED, entities.Assignment.fields.offer_expires_at]
        distinguishing_aspect: "An offer made at 09:00 expires when the ops cycle runs at 09:31 (offer_expires_at 09:30 passed); the driver joins the ride's exclusion set, so a re-dispatch with no other drivers returns data null."
        test_recipe:
          setup: ["ACTIVE card; client; one ACTIVE driver; ride dispatched at clock 2026-06-01T09:00:00Z (offer expires 09:30)"]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { service_class: "STANDARD", effective_from: "2026-01-01", effective_to: "2027-01-01", hourly_rate_cents: 3000, per_mile_cents: 150, wait_per_minute_cents: 50, included_wait_minutes: 10, minimum_charge_cents: 2501, after_hours_multiplier_bp: 11000, after_hours_start_minute: 1080, wav_surcharge_cents: 0 }, as: PlatformAdmin, captures: { rc: $.data.id } }
