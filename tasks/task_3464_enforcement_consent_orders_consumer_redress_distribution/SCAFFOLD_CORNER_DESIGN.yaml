              as_user_id: "fa-1"
          trigger:
            - call: "POST /enforcement/claims/${claim_a_id}/checks"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "fa-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /enforcement/claims/${claim_a_id}/checks"
              payload: {}
              as: DisbursementOfficer
              as_user_id: "do-1"
              captures: { check_id: $.data.id }
          assert:
            - "the issue attempt by fa-1 (the approver) fails 403 with error_id == ERR_SOD_CHECK_ISSUE"
            - "the retry by do-1 succeeds 201 and RefundCheck.${check_id}.amount_cents == 500000"
            - "Claim.${claim_a_id}.approved_by_user_id == \"fa-1\" (the SoD comparison key)"

      - name: sod_penalty_confirm_by_assessing_user_rejected
        claim_type: optimistic_concurrency
        grounds:
          - validations[priority=7]
          - errors.ERR_SOD_PENALTY_CONFIRM
          - complexity_profile.role_model
        distinguishing_aspect: "The ComplianceMonitor who assessed a penalty cannot confirm it: cm-1's CONFIRMED attempt fails 403 ERR_SOD_PENALTY_CONFIRM, while cm-2 confirms with cured_on 2026-10-06 producing final_days 5 and final_amount_cents 21765000."
        test_recipe:
          setup:
            - "Order IN_MONITORING; AGGRAVATED penalty assessed by cm-1 with detected_on 2026-10-01."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
            - *c_inv_pr
            - *c_inv_eg
            - *c_inv_ng
            - *c_order
            - *c_propose
            - *c_clock_oct
            - *c_finalize
            - *c_monitor
            - call: "POST /enforcement/consent-orders/${order_id}/violation-penalties"
              payload: { severity: "AGGRAVATED", detected_on: "2026-10-01T00:00:00Z", description: "Billing disclosures still deceptive" }
              as: ComplianceMonitor
              as_user_id: "cm-1"
              captures: { penalty_id: $.data.id }
          trigger:
            - call: "POST /enforcement/violation-penalties/${penalty_id}/transition"
              payload: { target_state: "CONFIRMED", cured_on: "2026-10-06T00:00:00Z" }
              as: ComplianceMonitor
              as_user_id: "cm-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /enforcement/violation-penalties/${penalty_id}/transition"
              payload: { target_state: "CONFIRMED", cured_on: "2026-10-06T00:00:00Z" }
              as: ComplianceMonitor
              as_user_id: "cm-2"
          assert:
            - "the confirm attempt by the assessor cm-1 fails 403 with error_id == ERR_SOD_PENALTY_CONFIRM"
            - "the confirm by cm-2 succeeds: status CONFIRMED, final_days == 5, final_amount_cents == 21765000"
            - "ViolationPenalty.${penalty_id}.confirmed_by_user_id == \"cm-2\""

      - name: fund_open_threshold_boundary_999999_then_one_cent
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.redress_waterfall
          - state_machines.RedressFund.ACCUMULATING_to_OPEN_FOR_CLAIMS
        distinguishing_aspect: "The fund auto-opens at exactly FUND_OPEN_MINIMUM_CENTS: a collection of 999999 leaves the fund ACCUMULATING, and a follow-up collection of just 1 cent (total 1000000) flips it to OPEN_FOR_CLAIMS (>= semantics)."
        test_recipe:
          setup:
            - "Judgment 3000000 entered; fund ACCUMULATING; nothing collected yet."
          setup_api_calls:
            - *c_clock
            - call: "POST /enforcement/subject-companies"
              payload: { legal_name: "Acme Gadgets Inc", complaint_count_90d: 60 }
              as: PlatformAdmin
              captures: { company_id: $.data.id }
            - *c_inv
            - *c_inv_pr
            - *c_inv_eg
            - *c_inv_ng
            - call: "POST /enforcement/investigations/${inv_id}/consent-orders"
              payload: { monetary_relief_cents: 3000000, max_penalty_cents: 500000000, reporting_frequency_months: 6, monitoring_term_years: 5, conduct_prohibitions: ["NO_UNSUBSTANTIATED_CLAIMS"] }
              as: StaffAttorney
              captures: { order_id: $.data.id, order_v1: $.data.version }
            - *c_propose
            - *c_clock_oct
            - *c_finalize
            - *c_monitor
            - *c_judgment3m
            - *c_get_fund
          trigger:
            - call: "POST /enforcement/judgments/${judgment_id}/payments"
              payload: { amount_cents: 999999, kind: "COLLECTION" }
              as: CompanyRepresentative
              as_user_id: "${company_id}"
            - call: "GET /enforcement/redress-funds/${fund_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { fund_status_below: $.data.status }
            - call: "POST /enforcement/judgments/${judgment_id}/payments"
              payload: { amount_cents: 1, kind: "COLLECTION" }
              as: CompanyRepresentative
              as_user_id: "${company_id}"
            - call: "GET /enforcement/redress-funds/${fund_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-1"
              captures: { fund_status_at: $.data.status }
          assert:
            - "after collecting 999999 the fund is still ACCUMULATING (below the 1000000 minimum)"
            - "after collecting 1 more cent (total exactly 1000000) the fund is OPEN_FOR_CLAIMS"
            - "MonetaryJudgment.${judgment_id}.collected_cents == 1000000 and collection_status == PARTIALLY_COLLECTED"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_read_after_write_on_judgment_ledger
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.MonetaryJudgment.fields.collected_cents
        excluded_because:
          difficulty_instance: judgment_payment_and_reversal_conserve_principal_balance
          rationale: "That instance reads collected_cents/outstanding_cents from the payment responses and a same-test GET, which is exactly the immediate-consistency claim; duplicating it here adds no coverage."

  # ===========================================================================
  # Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN (stubs only)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: finalize_blocked_while_comment_period_open
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ConsentOrder.IN_PUBLIC_COMMENT_to_FINAL
          - errors.ERR_COMMENT_PERIOD_OPEN
        excluded_because:
          difficulty_instance: finalize_requires_latest_comment_period_closed
          rationale: "Asserted as the failure half of the named difficulty instance (409 ERR_COMMENT_PERIOD_OPEN while OPEN, success after the sweep closes the period)."

      - name: check_issue_blocked_until_fund_disbursing
        claim_type: Precondition Enforcement
        grounds:
          - errors.ERR_FUND_NOT_DISBURSING
        excluded_because:
          difficulty_instance: check_issue_requires_fund_disbursing
          rationale: "Asserted as the failure half of the named difficulty instance (409 while CLAIMS_CLOSED, 201 after DISBURSING)."

      - name: comment_period_auto_closes_at_closes_at
        claim_type: Valid Transition
        grounds:
          - state_machines.PublicCommentPeriod.OPEN_to_CLOSED
        excluded_because:
          difficulty_instance: finalize_requires_latest_comment_period_closed
          rationale: "The sweep-driven OPEN -> CLOSED transition at exactly closes_at is asserted inside the named difficulty instance (period status == CLOSED after the 2026-10-01 clock set)."

      - name: payment_cascade_opens_fund_and_notifies
        claim_type: Cascade down
        grounds:
          - state_machines.RedressFund.ACCUMULATING_to_OPEN_FOR_CLAIMS
          - state_machines.Claimant.IDENTIFIED_to_NOTIFIED
        excluded_because:
          difficulty_instance: payment_completion_satisfies_judgment_opens_fund_notifies_claimants
          rationale: "The full three-link cascade is the named difficulty instance's subject."

      - name: report_window_overlap_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_REPORTING_PERIOD_OVERLAP
        excluded_because:
          difficulty_instance: report_window_closed_interval_touching_counts_as_overlap
          rationale: "The touching-window 409 is asserted in the named difficulty instance; the wrong-company ordering variant is asserted in report_window_overlap_temporal_beats_company_mismatch_referential."

      - name: monitoring_overlap_rejected_for_same_subject
        claim_type: Violation → Error
        grounds:
          - errors.ERR_MONITORING_TERM_OVERLAP
        excluded_because:
          difficulty_instance: monitoring_term_half_open_adjacency_allowed_but_overlap_rejected
          rationale: "The 2027-09-15 attempt in the named difficulty instance asserts this exact 409."

  - section: calculations
    instances:

      - name: penalty_provisional_vs_final_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.civil_penalty_accrual
        excluded_because:
          difficulty_instance: penalty_provisional_projection_vs_final_cure
          rationale: "Variant divergence (130590000 provisional vs 43530000 final on identical inputs) is the named instance's assertion set."

      - name: claim_award_provisional_vs_final_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.redress_waterfall
        excluded_because:
          difficulty_instance: claim_provisional_award_shrinks_at_final_waterfall
          rationale: "Provisional 2500000 vs final 1892858 divergence and reconciliation are the named instance's assertion set."
