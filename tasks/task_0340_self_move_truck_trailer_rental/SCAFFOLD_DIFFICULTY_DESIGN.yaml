scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_vs_settlement_trip_cost_diverge
        grounds:
          - calculations.reservation_quote
          - calculations.contract_settlement
          - entities.Reservation.fields.quoted_total_cents
          - entities.RentalContract.fields.settlement_total_cents
        distinguishing_aspect: |
          reservation_quote (forward_looking, ESTIMATED_ROUND_TRIP_MILES=60) and contract_settlement
          (chronological, actual miles_driven=137) consume the SAME round-trip reservation but produce
          a different mileage component, so quoted_total_cents (13400) != settlement_total_cents (20330).
        test_recipe:
          setup:
            - "TRUCK_15 class: daily 4000, mileage 100, one_way_flat 9900, fuel_capacity 40, requires_coverage false."
            - "One location HUB with lot_capacity 5; one TRUCK_15 unit home at HUB, odometer 1000, fuel 8/8."
            - "SILVER customer with verified license."
            - "Round-trip reservation HUB->HUB, 2 planned days, coverage DECLINED, no add-ons, no supplies."
            - "Reservation confirmed (earmark), dispatched, returned on time at odometer 1137 (137 miles), fuel 8/8."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "silver@x.com", full_name: "Sil Ver", license_verified: true, loyalty_tier: "SILVER" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-03T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id, quote: $.data.quoted_total_cents }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id, ctr_v: $.data.version }
            - call: "POST /rental/contracts/${ctr}/return"
              payload: { return_odometer_miles: 1137, return_fuel_eighths: 8, actual_return_at: "2026-07-03T09:00:00Z" }
              as: LocationAgent
          trigger:
            - call: "POST /rental/contracts/${ctr}/settle"
              payload: { expected_contract_version: "${ctr_v}" }
              as: LocationAgent
              captures: { settle_total: $.data.settlement_total_cents }
          assert:
            - "Reservation.${resv}.quoted_total_cents == 13400"
            - "RentalContract.${ctr}.settlement_total_cents == 20330"
            - "RentalContract.${ctr}.settlement_total_cents != Reservation.${resv}.quoted_total_cents"

      - name: availability_dispatch_pool_vs_lot_occupancy_diverge
        grounds:
          - calculations.location_availability
          - entities.RentalLocation.fields.on_lot_count
          - entities.Equipment.fields.status
        distinguishing_aspect: |
          On the SAME RentalLocation, location_availability.dispatch_pool counts only status==AVAILABLE
          (=1) while location_availability.lot_occupancy (on_lot_count) counts AVAILABLE+RESERVED+MAINTENANCE
          (=3) — a different conserved subject (lot slots) than rule-1 instance 1 (trip cost on a contract).
        test_recipe:
          setup:
            - "Class TRUCK_15; location HUB lot_capacity 5."
            - "Three TRUCK_15 units home at HUB: one AVAILABLE, one put into MAINTENANCE, one earmarked RESERVED by a confirmed round-trip reservation."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq_avail: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq_maint: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq_resv: $.data.id }
            - call: "POST /rental/equipment/${eq_maint}/maintenance"
              payload: {}
              as: FleetManager
            - call: "POST /rental/customers"
              payload: { email: "rt@x.com", full_name: "Round Trip", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "GET /rental/locations/${hub}/availability"
              payload: { equipment_class_id: "${cls}" }
              as: FleetManager
          assert:
            - "GET availability classes[TRUCK_15].available_count == 1"
            - "RentalLocation.${hub}.on_lot_count == 3"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_nonlinear_multi_input_mode_a
        grounds:
          - calculations.contract_settlement
          - entities.RentalContract.fields.settlement_total_cents
          - entities.CoveragePlan.fields.daily_fee_cents
        distinguishing_aspect: |
          MODE (a): settlement_total combines >=3 interacting inputs with non-linear branches —
          rental_days (from actual return), tiered mileage discount, conditional fuel-shortfall
          (threshold on missing_eighths gating REFUEL_SERVICE_FEE), and conditional coverage —
          producing 19425 for the pinned inputs.
        test_recipe:
          setup:
            - "TRUCK_15 class requires_coverage true; SAFEMOVE coverage daily 1500 deductible 15000."
            - "GOLD customer, verified license; HUB lot_capacity 5; one TRUCK_15 home at HUB odometer 0 fuel 8."
            - "Round-trip 2 days; 1 UTILITY_DOLLY add-on; 3 BOX_MEDIUM (250 each, returnable) supplies; coverage SELECTED."
            - "Returned clean, on time, 80 actual miles, fuel 8/8 (no shortfall); 1 box refunded at settlement."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: true }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/coverage-plans"
              payload: { code: "SAFEMOVE", daily_fee_cents: 1500, damage_deductible_cents: 15000 }
              as: FleetManager
              captures: { cov: $.data.id }
            - call: "POST /rental/supplies"
              payload: { sku: "BOX_MEDIUM", unit_price_cents: 250, stock_qty: 100, returnable: true }
              as: FleetManager
              captures: { box: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}", odometer_miles: 0, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "gold@x.com", full_name: "Gold Member", license_verified: true, loyalty_tier: "GOLD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_plan_id: "${cov}", coverage_choice: "SELECTED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-03T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/addons"
              payload: { addon_type: "UTILITY_DOLLY", quantity: 1 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /rental/reservations/${resv}/supplies"
              payload: { supply_id: "${box}", quantity: 3 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id, ctr_v: $.data.version }
            - call: "POST /rental/contracts/${ctr}/return"
              payload: { return_odometer_miles: 80, return_fuel_eighths: 8, actual_return_at: "2026-07-03T09:00:00Z" }
              as: LocationAgent
          trigger:
            - call: "POST /rental/contracts/${ctr}/settle"
              payload: { expected_contract_version: "${ctr_v}" }
              as: LocationAgent
              captures: { total: $.data.settlement_total_cents }
          assert:
            - "RentalContract.${ctr}.settlement_total_cents == 19425"
            - "RentalContract.${ctr}.damage_charge_cents == 0"

      - name: supply_refund_round_per_line_then_sum_mode_b
        grounds:
          - calculations.contract_settlement
          - entities.SupplyLineItem.fields.refunded_units
          - entities.MovingSupply.fields.returnable
        distinguishing_aspect: |
          MODE (b): supply_refund rounds round_half_up PER returnable SupplyLineItem BEFORE summing —
          two lines of unit_price 333 refunding 1 unit each yield 167+167=334, whereas sum-then-round
          (333*0.5+333*0.5=333) would give 333; the scaffold pins per-component rounding (=334).
        test_recipe:
          setup:
            - "TRUCK_15 class (requires_coverage false); HUB lot_capacity 5; one TRUCK_15 home at HUB."
            - "Two returnable supplies ODDBOX_A and ODDBOX_B, each unit_price 333."
            - "STANDARD verified customer; round-trip 1 day; one line of each odd box, qty 1; returned clean on time, 0 miles, fuel 8."
            - "At settlement each returnable line refunds 1 unit."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/supplies"
              payload: { sku: "ODDBOX_A", unit_price_cents: 333, stock_qty: 50, returnable: true }
              as: FleetManager
              captures: { boxa: $.data.id }
            - call: "POST /rental/supplies"
              payload: { sku: "ODDBOX_B", unit_price_cents: 333, stock_qty: 50, returnable: true }
              as: FleetManager
              captures: { boxb: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}", odometer_miles: 0, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "std@x.com", full_name: "Stan Dard", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/supplies"
              payload: { supply_id: "${boxa}", quantity: 1 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /rental/reservations/${resv}/supplies"
              payload: { supply_id: "${boxb}", quantity: 1 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id, ctr_v: $.data.version }
            - call: "POST /rental/contracts/${ctr}/return"
              payload: { return_odometer_miles: 0, return_fuel_eighths: 8, actual_return_at: "2026-07-02T09:00:00Z" }
              as: LocationAgent
          trigger:
            - call: "POST /rental/contracts/${ctr}/settle"
              payload: { expected_contract_version: "${ctr_v}" }
              as: LocationAgent
              captures: { total: $.data.settlement_total_cents }
          assert:
            - "ChargeLedgerEntry rows for contract ${ctr} with kind SUPPLY_REFUND sum to -334 (each line refunds round_half_up(333*0.5)=167)"
            - "RentalContract.${ctr}.settlement_total_cents == 4332"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_parallel_dimensions_independent
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - state_machines.Reservation.AWAITING_DISPATCH_to_DISPATCHED
          - entities.Reservation.fields.booking_status
          - entities.Reservation.fields.fulfillment_status
        distinguishing_aspect: |
          Reservation carries TWO independent state axes: booking_status advances PENDING->CONFIRMED
          while fulfillment_status stays AWAITING_DISPATCH, then fulfillment_status advances
          AWAITING_DISPATCH->DISPATCHED while booking_status stays CONFIRMED — a parallel-dimension
          machine, distinct from instance-2's branching contract.
        test_recipe:
          setup:
            - "TRUCK_15 (requires_coverage false); HUB lot_capacity 5; one TRUCK_15 home at HUB; verified STANDARD customer."
            - "Round-trip reservation created (PENDING / AWAITING_DISPATCH)."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "p@x.com", full_name: "Par Allel", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
          trigger:
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id }
          assert:
            - "After confirm (before dispatch): Reservation.${resv}.booking_status == CONFIRMED AND Reservation.${resv}.fulfillment_status == AWAITING_DISPATCH"
            - "After dispatch: Reservation.${resv}.booking_status == CONFIRMED AND Reservation.${resv}.fulfillment_status == DISPATCHED"

      - name: contract_branching_clean_vs_damaged
        grounds:
          - state_machines.RentalContract.ACTIVE_to_RETURNED_CLEAN
          - state_machines.RentalContract.ACTIVE_to_RETURNED_DAMAGED
          - entities.RentalContract.fields.status
          - entities.DamageReport.fields.assessed_cost_cents
        distinguishing_aspect: |
          RentalContract forks at return into RETURNED_CLEAN vs RETURNED_DAMAGED based on whether a
          DamageReport exists, and the two branches carry divergent settlement side-effect sets
          (DAMAGE ledger line only on the damaged branch) — a branching machine on a DIFFERENT entity
          than instance-1's parallel Reservation.
        test_recipe:
          setup:
            - "TRUCK_15 requires_coverage true; SAFEMOVE coverage daily 1500 deductible 15000."
            - "HUB lot_capacity 5; one TRUCK_15 home at HUB; verified STANDARD customer."
            - "Round-trip 1 day, coverage SELECTED; dispatched; a DamageReport of 50000 filed before return."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: true }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/coverage-plans"
              payload: { code: "SAFEMOVE", daily_fee_cents: 1500, damage_deductible_cents: 15000 }
              as: FleetManager
              captures: { cov: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}", odometer_miles: 0, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "d@x.com", full_name: "Dam Aged", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_plan_id: "${cov}", coverage_choice: "SELECTED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id }
            - call: "POST /rental/contracts/${ctr}/damage-reports"
              payload: { assessed_cost_cents: 50000, description: "Dented rear door" }
              as: LocationAgent
          trigger:
            - call: "POST /rental/contracts/${ctr}/return"
              payload: { return_odometer_miles: 0, return_fuel_eighths: 8, actual_return_at: "2026-07-02T09:00:00Z" }
              as: LocationAgent
              captures: { status: $.data.status }
          assert:
            - "RentalContract.${ctr}.status == RETURNED_DAMAGED"
            - "A contract returned with NO DamageReport instead lands RETURNED_CLEAN (branch divergence)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: return_cascade_contract_to_equipment_to_location_depth3
        grounds:
          - state_machines.RentalContract.ACTIVE_to_RETURNED_CLEAN
          - state_machines.Equipment.IN_TRANSIT_to_AVAILABLE
          - entities.Equipment.fields.current_location_id
          - entities.RentalLocation.fields.on_lot_count
        distinguishing_aspect: |
          DEPTH-3 cascade from the RETURN trigger: contract return mutates RentalContract -> that mutation
          drives Equipment IN_TRANSIT->AVAILABLE at the drop-off location -> which itself recomputes the
          drop-off RentalLocation.on_lot_count (+1). Each link is caused by the prior link, originating
          from a DIFFERENT trigger than instance-2 (settle).
        test_recipe:
          setup:
            - "TRUCK_15 (requires_coverage false); two locations PICK (cap 5) and DROP (cap 5, accepts_one_way true)."
            - "One TRUCK_15 home at PICK; verified STANDARD customer."
            - "One-way reservation PICK->DROP, 1 day; dispatched (Equipment off-lot, DROP on_lot_count starts 0)."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "PICK", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { pick: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "DROP", state_code: "NV", lot_capacity: 5, accepts_one_way_dropoff: true }
              as: FleetManager
              captures: { drop: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${pick}", odometer_miles: 0, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "ow@x.com", full_name: "One Way", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${pick}", dropoff_location_id: "${drop}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id }
          trigger:
            - call: "POST /rental/contracts/${ctr}/return"
              payload: { return_odometer_miles: 25, return_fuel_eighths: 8, actual_return_at: "2026-07-02T09:00:00Z" }
              as: LocationAgent
              captures: { eqloc: $.data.equipment_id }
          assert:
            - "Equipment.${eq}.status == AVAILABLE"
            - "Equipment.${eq}.current_location_id == ${drop}"
            - "RentalLocation.${drop}.on_lot_count == 1"

      - name: settle_cascade_contract_to_ledger_to_reservation_depth2
        grounds:
          - state_machines.RentalContract.RETURNED_CLEAN_to_SETTLED
          - state_machines.Reservation.DISPATCHED_to_COMPLETED
          - entities.Reservation.fields.fulfillment_status
          - entities.ChargeLedgerEntry.fields.kind
        distinguishing_aspect: |
          DEPTH-2 cascade from the SETTLE trigger: settling the RentalContract emits ChargeLedgerEntry
          rows AND bubbles the linked Reservation.fulfillment_status DISPATCHED->COMPLETED — originating
          from a DIFFERENT trigger (settle) than instance-1's return cascade.
        test_recipe:
          setup:
            - "TRUCK_15 (requires_coverage false); HUB cap 5; one TRUCK_15 home at HUB; verified STANDARD customer."
            - "Round-trip 1 day reservation dispatched then returned clean on time, 0 miles, fuel 8."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}", odometer_miles: 0, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "s2@x.com", full_name: "Set Tle", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id, ctr_v: $.data.version }
            - call: "POST /rental/contracts/${ctr}/return"
              payload: { return_odometer_miles: 0, return_fuel_eighths: 8, actual_return_at: "2026-07-02T09:00:00Z" }
              as: LocationAgent
          trigger:
            - call: "POST /rental/contracts/${ctr}/settle"
              payload: { expected_contract_version: "${ctr_v}" }
              as: LocationAgent
          assert:
            - "Reservation.${resv}.fulfillment_status == COMPLETED"
            - "GET /rental/contracts/${ctr}/ledger contains at least one ChargeLedgerEntry with kind == BASE_DAYS"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_safety_dispatch_wrong_state_and_unverified
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_LICENSE_NOT_VERIFIED]
        distinguishing_aspect: |
          A dispatch request that violates BOTH the state precondition (reservation still PENDING, not
          CONFIRMED — priority 9 category state) AND the safety precondition (TRUCK class, license
          unverified — priority 10 category business_safety) returns ERR_INVALID_STATE, proving state
          (9) outranks business_safety (10). Category pair: state vs business_safety.
        test_recipe:
          setup:
            - "TRUCK_15 (requires_coverage false); HUB cap 5; one TRUCK_15 home at HUB."
            - "Customer with license UNVERIFIED; round-trip reservation left PENDING (not confirmed)."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "unv@x.com", full_name: "Un Verified", license_verified: false, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id, resv_v: $.data.version }
          trigger:
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (priority 9 state beats priority 10 business_safety)"
            - "response HTTP status == 409"

      - name: existence_before_stock_supply_bad_reservation_and_overstock
        grounds:
          - validations[priority=4]
          - validations[priority=13]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: |
          Adding a SupplyLineItem to a NON-EXISTENT reservation while ALSO requesting quantity above
          stock returns ERR_NOT_FOUND, proving existence (priority 4 category existence) outranks the
          stock check (priority 13 category business_constraint). Category pair: existence vs
          business_constraint — distinct from instance-1's state vs business_safety.
        test_recipe:
          setup:
            - "A supply TINYBOX with stock_qty 1 exists; no reservation with the queried id exists."
          setup_api_calls:
            - call: "POST /rental/supplies"
              payload: { sku: "TINYBOX", unit_price_cents: 100, stock_qty: 1 }
              as: FleetManager
              captures: { box: $.data.id }
          trigger:
            - call: "POST /rental/reservations/00000000-0000-4000-8000-000000000000/supplies"
              payload: { supply_id: "${box}", quantity: 99 }
              as: LocationAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (priority 4 existence beats priority 13 business_constraint)"
            - "response HTTP status == 404"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: late_return_grace_boundary_119_vs_120_minutes
        grounds:
          - calculations.contract_settlement
          - entities.RentalContract.fields.settlement_total_cents
          - validations[priority=12]
        distinguishing_aspect: |
          late_days uses LATE_GRACE_MINUTES=119: at exactly 119 minutes late (<=119) late_fee==0; at
          120 minutes late (>119) one late day applies (4000). Numeric threshold-crossing metric on
          the settle endpoint.
        test_recipe:
          setup:
            - "TRUCK_15 (requires_coverage false); HUB cap 5; one TRUCK_15 home at HUB; verified STANDARD customer."
            - "Round-trip 1 day, scheduled return 2026-07-02T09:00:00Z; dispatched; returned 0 miles fuel 8 at 2026-07-02T11:00:00Z (exactly 120 min late)."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}", odometer_miles: 0, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "late@x.com", full_name: "La Te", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id, ctr_v: $.data.version }
            - call: "POST /rental/contracts/${ctr}/return"
              payload: { return_odometer_miles: 0, return_fuel_eighths: 8, actual_return_at: "2026-07-02T11:00:00Z" }
              as: LocationAgent
          trigger:
            - call: "POST /rental/contracts/${ctr}/settle"
              payload: { expected_contract_version: "${ctr_v}" }
              as: LocationAgent
              captures: { total: $.data.settlement_total_cents }
          assert:
            - "RentalContract.${ctr}.settlement_total_cents == 12000 (rental_days=ceil(26h/24)=2 -> base 8000; plus late_fee 4000)"
            - "GET /rental/contracts/${ctr}/ledger contains a ChargeLedgerEntry with kind == LATE_RETURN and amount_cents == 4000 (120 min > 119 grace -> 1 late day)"

      - name: lot_capacity_full_boundary_on_return
        grounds:
          - validations[priority=16]
          - entities.RentalLocation.fields.lot_capacity
          - entities.RentalLocation.fields.on_lot_count
          - errors[ERR_RETURN_LOT_FULL]
        distinguishing_aspect: |
          Return is rejected with ERR_RETURN_LOT_FULL when the drop-off RentalLocation.on_lot_count is
          already == lot_capacity (>= comparison), an empty-slot/capacity metric reached through the
          return endpoint — a DIFFERENT metric and endpoint than the late-grace minute threshold.
        test_recipe:
          setup:
            - "TRUCK_15 (requires_coverage false); PICK cap 5; DROP cap 1 (accepts one-way) already holding 1 AVAILABLE TRUCK_15 (on_lot_count==1==capacity)."
            - "One-way reservation PICK->DROP dispatched (Equipment off-lot)."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "PICK", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { pick: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "DROP", state_code: "NV", lot_capacity: 1, accepts_one_way_dropoff: true }
              as: FleetManager
              captures: { drop: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${drop}", odometer_miles: 0, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { eq_at_drop: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${pick}", odometer_miles: 0, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "full@x.com", full_name: "Lot Full", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${pick}", dropoff_location_id: "${drop}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id }
          trigger:
            - call: "POST /rental/contracts/${ctr}/return"
              payload: { return_odometer_miles: 30, return_fuel_eighths: 8, actual_return_at: "2026-07-02T09:00:00Z" }
              as: LocationAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RETURN_LOT_FULL"
            - "RentalLocation.${drop}.on_lot_count == 1 (unchanged; return rejected at the == capacity boundary)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_blocked_by_customer_license_unverified
        grounds:
          - state_machines.Reservation.AWAITING_DISPATCH_to_DISPATCHED
          - entities.Customer.fields.license_verified
          - errors[ERR_LICENSE_NOT_VERIFIED]
        distinguishing_aspect: |
          A CONFIRMED round-trip TRUCK reservation cannot move AWAITING_DISPATCH->DISPATCHED while the
          OWNING Customer.license_verified == false (ERR_LICENSE_NOT_VERIFIED). Entity pair:
          Reservation depends on Customer.
        test_recipe:
          setup:
            - "TRUCK_15 (requires_coverage false); HUB cap 5; one TRUCK_15 home at HUB."
            - "Customer license UNVERIFIED; round-trip reservation CONFIRMED (confirm has no license gate)."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "nlic@x.com", full_name: "No Lic", license_verified: false, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
          trigger:
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LICENSE_NOT_VERIFIED"
            - "Reservation.${resv}.fulfillment_status == AWAITING_DISPATCH (unchanged)"

      - name: transfer_approve_blocked_by_destination_lot_full
        grounds:
          - state_machines.DropOffTransfer.REQUESTED_to_APPROVED
          - entities.RentalLocation.fields.on_lot_count
          - entities.RentalLocation.fields.lot_capacity
          - errors[ERR_RETURN_LOT_FULL]
        distinguishing_aspect: |
          A DropOffTransfer cannot move REQUESTED->APPROVED when the destination RentalLocation.on_lot_count
          is already == lot_capacity (no slot). Entity pair: DropOffTransfer depends on RentalLocation — a
          DIFFERENT pair than instance-1's Reservation->Customer.
        test_recipe:
          setup:
            - "TRUCK_15; FROM location OPEN cap 5 holds one AVAILABLE TRUCK_15; TO location OPEN cap 1 already holds one AVAILABLE TRUCK_15 (on_lot_count==1==capacity)."
            - "A transfer for the FROM unit -> TO is REQUESTED (create only checks TO is OPEN, not capacity)."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "FROM", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { from: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "TO_FULL", state_code: "NV", lot_capacity: 1 }
              as: FleetManager
              captures: { tof: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${tof}" }
              as: FleetManager
              captures: { eq_filler: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${from}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/transfers"
              payload: { equipment_id: "${eq}", to_location_id: "${tof}", reason: "FLEET_REBALANCE" }
              as: FleetManager
              captures: { t: $.data.id }
          trigger:
            - call: "POST /rental/transfers/${t}/approve"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RETURN_LOT_FULL"
            - "DropOffTransfer.${t}.status == REQUESTED (approve rejected at the == capacity boundary)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: equipment_buffered_window_overlap_blocks_second_roundtrip
        grounds:
          - calculations.equipment_window_overlap
          - validations[priority=18]
          - errors[ERR_EQUIPMENT_DOUBLE_BOOKED]
        distinguishing_aspect: |
          With only ONE TRUCK_15 at HUB, a first round-trip reservation [07-01..07-02] earmarks it; a
          second round-trip [07-02T10:00..07-03] whose start falls inside the first's buffer-extended
          window [07-01, 07-02 + 3h) is rejected ERR_EQUIPMENT_DOUBLE_BOOKED. Interval semantics:
          half-open buffered (TURNAROUND_HOURS=3).
        test_recipe:
          setup:
            - "TRUCK_15 (requires_coverage false); HUB cap 5; exactly ONE TRUCK_15 home at HUB; two verified STANDARD customers."
            - "First round-trip reservation [07-01T09:00..07-02T09:00] CONFIRMED (earmarks the only unit)."
            - "Second round-trip reservation [07-02T10:00..07-03T10:00] created (start 07-02T10:00 < 07-02T09:00 + 3h = 07-02T12:00 -> inside buffer)."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "a@x.com", full_name: "Cust A", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { custa: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "b@x.com", full_name: "Cust B", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { custb: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${custa}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${custa}"
              captures: { resva: $.data.id }
            - call: "POST /rental/reservations/${resva}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${custa}"
            - call: "POST /rental/reservations"
              payload: { customer_id: "${custb}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-02T10:00:00Z", scheduled_return_at: "2026-07-03T10:00:00Z" }
              as: Customer
              as_user_id: "${custb}"
              captures: { resvb: $.data.id }
          trigger:
            - call: "POST /rental/reservations/${resvb}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${custb}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_EQUIPMENT_DOUBLE_BOOKED"
            - "Reservation.${resvb}.booking_status == PENDING (confirm rejected; no earmark)"

      - name: equipment_open_transfer_lifecycle_overlap_blocks_second
        grounds:
          - calculations.equipment_window_overlap
          - validations[priority=19]
          - errors[ERR_TRANSFER_IN_PROGRESS]
        distinguishing_aspect: |
          An Equipment already encumbered by a REQUESTED DropOffTransfer cannot have a second transfer
          opened (ERR_TRANSFER_IN_PROGRESS). Interval semantics: NO time window — pure lifecycle
          set-membership occupancy {REQUESTED, APPROVED}, distinct from instance-1's buffered window.
        test_recipe:
          setup:
            - "TRUCK_15; FROM cap 5 holds one AVAILABLE TRUCK_15; two OPEN destinations TO1, TO2 with spare capacity."
            - "One transfer already REQUESTED for the unit FROM->TO1 (still open)."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "FROM", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { from: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "TO1", state_code: "NV", lot_capacity: 5 }
              as: FleetManager
              captures: { to1: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "TO2", state_code: "AZ", lot_capacity: 5 }
              as: FleetManager
              captures: { to2: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${from}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/transfers"
              payload: { equipment_id: "${eq}", to_location_id: "${to1}", reason: "FLEET_REBALANCE" }
              as: FleetManager
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /rental/transfers"
              payload: { equipment_id: "${eq}", to_location_id: "${to2}", reason: "FLEET_REBALANCE" }
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TRANSFER_IN_PROGRESS"
            - "GET /rental/transfers?equipment_id=${eq} returns exactly one transfer (the second was rejected)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_contract_conserves_location_lot_count
        grounds:
          - state_machines.RentalContract.ACTIVE_to_VOID
          - state_machines.Reservation.AWAITING_DISPATCH_to_DISPATCHED
          - entities.RentalLocation.fields.on_lot_count
          - entities.Reservation.fields.assigned_equipment_id
        distinguishing_aspect: |
          CONSERVED QUANTITY = pickup RentalLocation.on_lot_count. Dispatch decrements it by 1 (unit
          leaves the lot); voiding the contract restores the unit to the lot, returning on_lot_count to
          its pre-dispatch value. Invariant: on_lot_count_after_void == on_lot_count_before_dispatch.
        test_recipe:
          setup:
            - "TRUCK_15 (requires_coverage false); HUB cap 5; one TRUCK_15 home at HUB (on_lot_count==1); verified STANDARD customer."
            - "Round-trip reservation CONFIRMED then DISPATCHED (on_lot_count drops to 0, contract ACTIVE)."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/equipment"
              payload: { equipment_class_id: "${cls}", home_location_id: "${hub}" }
              as: FleetManager
              captures: { eq: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "v@x.com", full_name: "Vo Id", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { resv_v: $.data.version }
            - call: "POST /rental/reservations/${resv}/dispatch"
              payload: { expected_reservation_version: "${resv_v}" }
              as: LocationAgent
              captures: { ctr: $.data.id }
          trigger:
            - call: "POST /rental/contracts/${ctr}/void"
              payload: {}
              as: FleetManager
          assert:
            - "RentalLocation.${hub}.on_lot_count == 1 (restored to pre-dispatch value)"
            - "Equipment.${eq}.status == AVAILABLE AND Equipment.${eq}.current_location_id == ${hub}"
            - "Reservation.${resv}.fulfillment_status == AWAITING_DISPATCH AND Reservation.${resv}.assigned_equipment_id == null"

      - name: cancel_reservation_conserves_supply_stock_total
        grounds:
          - state_machines.Reservation.PENDING_to_CANCELLED
          - entities.MovingSupply.fields.stock_qty
          - entities.SupplyLineItem.fields.quantity
        distinguishing_aspect: |
          CONSERVED QUANTITY = MovingSupply.stock_qty. Adding a SupplyLineItem of qty 4 decrements
          stock_qty by 4; cancelling the reservation restores it, leaving stock_qty equal to its
          pre-add value (10) — a DIFFERENT conserved quantity (catalog stock) than instance-1's lot count.
        test_recipe:
          setup:
            - "Supply WARDROBE_BOX with stock_qty 10; a PENDING reservation with one SupplyLineItem qty 4 (stock_qty now 6)."
          setup_api_calls:
            - call: "POST /rental/equipment-classes"
              payload: { code: "TRUCK_15", category: "TRUCK", daily_rate_cents: 4000, mileage_rate_cents: 100, one_way_flat_cents: 9900, fuel_capacity_gallons: 40, requires_coverage: false }
              as: FleetManager
              captures: { cls: $.data.id }
            - call: "POST /rental/locations"
              payload: { name: "HUB", state_code: "CA", lot_capacity: 5 }
              as: FleetManager
              captures: { hub: $.data.id }
            - call: "POST /rental/supplies"
              payload: { sku: "WARDROBE_BOX", unit_price_cents: 1200, stock_qty: 10 }
              as: FleetManager
              captures: { wb: $.data.id }
            - call: "POST /rental/customers"
              payload: { email: "c@x.com", full_name: "Can Cel", license_verified: true, loyalty_tier: "STANDARD" }
              as: FleetManager
              captures: { cust: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust}", equipment_class_id: "${cls}", pickup_location_id: "${hub}", dropoff_location_id: "${hub}", coverage_choice: "DECLINED", scheduled_pickup_at: "2026-07-01T09:00:00Z", scheduled_return_at: "2026-07-02T09:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { resv: $.data.id }
            - call: "POST /rental/reservations/${resv}/supplies"
              payload: { supply_id: "${wb}", quantity: 4 }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /rental/reservations/${resv}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "MovingSupply.${wb}.stock_qty == 10 (restored to pre-add value)"
            - "Reservation.${resv}.booking_status == CANCELLED"
