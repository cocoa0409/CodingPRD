            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "Inv Co", state_code: "CA", class_code: "ARTISAN", exposure_units: 100, coverage_limit_cents: 500000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { pol: $.data.id } }
