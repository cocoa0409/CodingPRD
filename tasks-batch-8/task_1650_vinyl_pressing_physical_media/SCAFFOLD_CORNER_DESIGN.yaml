        captures:
          cust: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: SM1-001
          title: T
          format: LP
          weight_gram: 180
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      - call: POST /press-lines
        payload:
          line_code: L1
          tonnage_class: STANDARD
          hours_per_day: 16
          daily_unit_capacity: 5000
        as: ProductionPlanner
        captures:
          line: $.data.id
      - call: POST /plating-baths
        payload:
          bath_code: B1
          rinse_gap_minutes: 2
        as: ProductionPlanner
        captures:
          bath: $.data.id
      - call: POST /press-orders
        payload:
          release_id: ${rel}
          quantity_ordered: 1000
          sides: 2
          plating_route: TWO_STEP
          variants:
          - color_config: BLACK
            quantity: 1000
        as: CustomerServiceRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
      - call: POST /press-orders/${ord}/quotes
        payload:
          expected_press_order_version: ${ord_v}
        as: CustomerServiceRep
        captures:
          ord_v2: $.data.version
      - call: POST /press-orders/${ord}/confirm
        payload:
          expected_press_order_version: ${ord_v2}
        as: Customer
        as_user_id: ${cust}
      - call: POST /press-orders/${ord}/start-tooling
        payload: {}
        as: ProductionPlanner
      - call: GET /press-orders/${ord}/tooling-jobs
        as: Any
        captures:
          tool: $.data[0].id
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: START_CUT
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: CUT_DONE
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: START_PLATING
          plating_bath_id: ${bath}
          plating_start: 2
          plating_end: 6
        as: PressOperator
      - call: POST /tooling-jobs/${tool}/advance
        payload:
          event: PLATING_DONE
        as: PressOperator
      - call: POST /press-orders/${ord}/test-pressings
        payload:
          quantity: 5
        as: PressOperator
        captures:
          tp: $.data.id
      - call: POST /test-pressings/${tp}/ship
        payload: {}
        as: ProductionPlanner
      - call: POST /test-pressings/${tp}/review
        payload:
          decision: APPROVE
        as: Customer
        as_user_id: ${cust}
      - call: GET /press-orders/${ord}
        as: Any
        captures:
          ord_vq: $.data.version
      - call: POST /press-orders/${ord}/schedule-commits
        payload:
          expected_press_order_version: ${ord_vq}
          slots:
          - press_line_id: ${line}
            date: '2026-08-10'
            start_hour: 0
            end_hour: 8
            planned_units: 1000
        as: ProductionPlanner
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-10T00:00:00Z'
        as: PlatformAdmin
      - call: POST /press-orders/${ord}/production-events
        payload:
          event: START_PRESSING
        as: PressOperator
      trigger:
      - call: POST /press-orders/${ord}/cancel
        payload:
          reason: too late
        as: CustomerServiceRep
        captures:
          err: $.data.error_id
      - call: GET /invoices?press_order_id=${ord}
        as: Any
        captures:
          invn: $.data
      assert:
      - error_id == ERR_ORDER_INVALID_STATE (409); order stays PRESSING
      - no invoices exist for the order (fee never computed)
  - name: shipment_cancel_then_advance_rejected
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Shipment
    distinguishing_aspect: 'A CANCELLED shipment is terminal: advance and a second cancel both fail ERR_SHIPMENT_INVALID_STATE.'
    test_recipe:
      setup:
      - release with empty stock; shipment created PLANNED then cancelled
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /customers
        payload:
          name: SM2
          contact_email: sm2@x.com
          credit_limit_cents: 100000000
        as: CustomerServiceRep
        captures:
          cust: $.data.id
      - call: POST /releases
        payload:
          customer_id: ${cust}
          catalog_number: SM2-001
          title: T
          format: LP
          weight_gram: 180
          release_date: '2026-12-01'
        as: CustomerServiceRep
        captures:
          rel: $.data.id
      - call: POST /shipments
        payload:
          release_id: ${rel}
          distributor_customer_id: ${cust}
          quantity: 500
          requested_ship_date: '2026-08-15'
        as: CustomerServiceRep
        captures:
          ship: $.data.id
          st0: $.data.status
      - call: POST /shipments/${ship}/cancel
        payload:
          reason: x
        as: CustomerServiceRep
      trigger:
      - call: POST /shipments/${ship}/advance
        payload: {}
        as: WarehouseManager
        captures:
          e1: $.data.error_id
      - call: POST /shipments/${ship}/cancel
        payload:
          reason: again
        as: CustomerServiceRep
        captures:
          e2: $.data.error_id
      assert:
      - created status == PLANNED (no stock); after cancel both advance and re-cancel fail with ERR_SHIPMENT_INVALID_STATE
  - name: tooling_advance_wrong_stage_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.ToolingJob
    distinguishing_aspect: CUT_DONE on a QUEUED tooling job (skipping START_CUT) fails ERR_TOOLING_JOB_INVALID_STATE.
    test_recipe:
      setup:
      - order in TOOLING, job QUEUED
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
