scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: on_time_rate_as_paid_vs_as_reported_diverge
        grounds:
          - calculations.tenant_on_time_rate
          - entities.Tenant.fields.reported_on_time_rate_pct
          - endpoints["GET /api/tenants/{id}/credit-summary"]
        distinguishing_aspect: |
          On the Tenant credit domain the two variants read different inclusion sets: as_paid (all 3 RentPayments,
          2 on-time -> 67) vs as_reported (only the 2 furnished, both on-time -> 100); 67 != 100.
        test_recipe:
          setup:
            - "Tenant enrolled+ACTIVE on a plan; a VERIFIED lease; 3 RentPayments (2 on-time, 1 late); only the 2 on-time payments furnished."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/subscription-plans"
              payload: { name: "Plus", tier: "PLUS", monthly_fee_cents: 1499, back_reporting_included_months: 6 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { full_name: "Tara Tenant", email: "tara@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "1 Main St #2", rent_amount_cents: 200000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v2: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-04", due_date: "2026-04-05T00:00:00Z", paid_date: "2026-04-05T00:00:00Z", amount_paid_cents: 200000, expected_lease_version: "${lease_v2}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { pay1_id: $.data.id }
            - call: "GET /api/leases/${lease_id}"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v3: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-05", due_date: "2026-05-05T00:00:00Z", paid_date: "2026-05-05T00:00:00Z", amount_paid_cents: 200000, expected_lease_version: "${lease_v3}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { pay2_id: $.data.id }
            - call: "GET /api/leases/${lease_id}"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v4: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-06", due_date: "2026-06-05T00:00:00Z", paid_date: "2026-06-20T00:00:00Z", amount_paid_cents: 200000, expected_lease_version: "${lease_v4}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { pay3_id: $.data.id }
            - call: "POST /api/rent-payments/${pay1_id}/report"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /api/rent-payments/${pay2_id}/report"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "GET /api/tenants/${t_id}/credit-summary"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
          assert:
            - "GET /api/tenants/${t_id}/credit-summary .data.on_time_rate_as_paid_pct == 67"
            - "GET /api/tenants/${t_id}/credit-summary .data.on_time_rate_as_reported_pct == 100"
            - "GET /api/tenants/${t_id}/credit-summary .data.total_payments == 3"
            - "GET /api/tenants/${t_id}/credit-summary .data.effective_reported_items == 2"

      - name: cancellation_settlement_prorated_vs_accrual_diverge
        grounds:
          - calculations.cancellation_settlement
          - entities.Enrollment.fields.refund_cents
          - state_machines.Enrollment.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          On the Enrollment billing domain the pinned prorated_refund variant yields refund_cents=1015 (fee 1499,
          31-day period, cancel on day 10 -> earned 484), whereas the accrual_forfeit variant yields refund_cents=0;
          1015 != 0. Different entity domain than on_time_rate (Tenant).
        test_recipe:
          setup:
            - "Tenant with an ACTIVE enrollment on a 1499-cent/month plan; current period 2026-07-01..2026-08-01 (31 days); subscription invoice PAID; logical clock advanced to 2026-07-11 (day 10)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/subscription-plans"
              payload: { name: "Plus", tier: "PLUS", monthly_fee_cents: 1499, back_reporting_included_months: 6 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { full_name: "Cody Cancel", email: "cody@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/enrollments/${en_id}/cancel"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
          assert:
            - "POST /api/enrollments/${en_id}/cancel .data.status == CANCELLED"
            - "POST /api/enrollments/${en_id}/cancel .data.refund_cents == 1015"
            - "POST /api/enrollments/${en_id}/cancel .data.earned_cents == 484"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: back_report_fee_tiered_min_max_mode_a
        grounds:
          - calculations.back_report_fee
          - entities.BackReportRequest.fields.fee_cents
          - entities.BackReportRequest.fields.billable_months
        distinguishing_aspect: |
          Mode (a): fee = min(max(0, n - included) * PER_MONTH, CAP) over 3 inputs (n=3 requested, included=1,
          PER_MONTH=200) with a cap; billable_months = 2, fee_cents = 400. Nested max()/min() non-linearity.
        test_recipe:
          setup:
            - "Tenant ACTIVE on a plan whose back_reporting_included_months=1; VERIFIED lease with 3 RECORDED (unreported) payments for 2026-03/04/05."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/subscription-plans"
              payload: { name: "Plus1", tier: "PLUS", monthly_fee_cents: 1499, back_reporting_included_months: 1 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { full_name: "Bella Back", email: "bella@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "9 Oak Ave", rent_amount_cents: 150000, monthly_due_day: 1, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v2: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-03", due_date: "2026-03-01T00:00:00Z", paid_date: "2026-03-01T00:00:00Z", amount_paid_cents: 150000, expected_lease_version: "${lease_v2}" }
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "GET /api/leases/${lease_id}"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v3: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-04", due_date: "2026-04-01T00:00:00Z", paid_date: "2026-04-01T00:00:00Z", amount_paid_cents: 150000, expected_lease_version: "${lease_v3}" }
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "GET /api/leases/${lease_id}"
              payload: {}
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v4: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-05", due_date: "2026-05-01T00:00:00Z", paid_date: "2026-05-01T00:00:00Z", amount_paid_cents: 150000, expected_lease_version: "${lease_v4}" }
              as: Landlord
              as_user_id: "${ll_id}"
          trigger:
            - call: "POST /api/back-report-requests"
              payload: { lease_id: "${lease_id}", requested_months: ["2026-03", "2026-04", "2026-05"] }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { br_id: $.data.id }
          assert:
            - "POST /api/back-report-requests .data.billable_months == 2"
            - "POST /api/back-report-requests .data.fee_cents == 400"

      - name: cancellation_settlement_eval_order_mode_c
        grounds:
          - calculations.cancellation_settlement
          - entities.Enrollment.fields.earned_cents
          - entities.Enrollment.fields.refund_cents
        distinguishing_aspect: |
          Mode (c): earned_cents and refund_cents are mutually constrained by earned+refund==paid; the scaffold pins
          the evaluation order (round earned first = 484, then refund = 1499-484 = 1015, exact). Rounding refund
          first would repartition the cent; the pinned order is what makes the split well-defined. Distinct mode
          from back_report_fee's nested min/max (mode a).
        test_recipe:
          setup:
            - "Same as cancellation_settlement_prorated_vs_accrual_diverge: ACTIVE enrollment, fee 1499, 31-day period, cancel on day 10."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/subscription-plans"
              payload: { name: "Plus", tier: "PLUS", monthly_fee_cents: 1499, back_reporting_included_months: 6 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { full_name: "Eve Eval", email: "eve@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/enrollments/${en_id}/cancel"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
          assert:
            - "POST /api/enrollments/${en_id}/cancel .data.earned_cents == 484"
            - "POST /api/enrollments/${en_id}/cancel .data.refund_cents == 1015"
            - "earned_cents + refund_cents == 1499 (paid this period)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reported_item_cycle_reported_disputed_reported
        grounds:
          - state_machines.ReportedItem.REPORTED_to_DISPUTED
          - state_machines.ReportedItem.DISPUTED_to_REPORTED
          - entities.ReportedItem.fields.status
        distinguishing_aspect: |
          Cyclic on ReportedItem: filing a dispute drives REPORTED->DISPUTED, withdrawing drives DISPUTED->REPORTED,
          returning to the same state with an incremented version — a revision loop, not a linear pipeline.
        test_recipe:
          setup:
            - "A REPORTED ReportedItem on an ACTIVE enrollment / VERIFIED lease; clock at 2026-07-01 (within dispute window)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/subscription-plans"
              payload: { name: "Plus", tier: "PLUS", monthly_fee_cents: 1499, back_reporting_included_months: 6 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { full_name: "Cy Cycle", email: "cy@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "3 Pine Rd", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v2: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-06", due_date: "2026-06-05T00:00:00Z", paid_date: "2026-06-05T00:00:00Z", amount_paid_cents: 120000, expected_lease_version: "${lease_v2}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /api/rent-payments/${pay_id}/report"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { ri_id: $.data.id }
            - call: "POST /api/disputes"
              payload: { reported_item_id: "${ri_id}", reason_code: "PAID_ON_TIME" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/disputes/${d_id}/withdraw"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
          assert:
            - "GET /api/reported-items/${ri_id} .data.status == REPORTED"
            - "GET /api/disputes/${d_id} .data.status == WITHDRAWN"
            - "GET /api/reported-items/${ri_id} .data.version >= 3"

      - name: dispute_branching_investigating_to_corrected
        grounds:
          - state_machines.Dispute.INVESTIGATING_to_RESOLVED_CORRECTED
          - state_machines.Dispute.INVESTIGATING_to_RESOLVED_UPHELD
          - state_machines.ReportedItem.DISPUTED_to_CORRECTED
        distinguishing_aspect: |
          Branching fork on Dispute (different entity than ReportedItem): from INVESTIGATING the CORRECTED branch
          creates a superseding ReportedItem and drives the original to CORRECTED, whereas the UPHELD branch would
          reinstate to REPORTED — divergent side-effect sets from the same source state.
        test_recipe:
          setup:
            - "A dispute in INVESTIGATING (analyst-1) on a REPORTED item; officer-1 distinct from analyst-1."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
