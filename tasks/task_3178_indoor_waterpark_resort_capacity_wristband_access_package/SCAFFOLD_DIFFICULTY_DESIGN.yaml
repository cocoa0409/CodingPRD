              as: Group
              as_user_id: "${gb19_id}"
              captures: { cb19_id: "$.data[0].id" }
          trigger:
            - call: "POST /resorts/${r19_id}/cabana-bookings"
              payload: { cabana_id: "${cab19_id}", group_booking_id: "${gb19_id}", service_date: "2026-09-03", start_minute: 700, end_minute: 780, member_units: 3, expected_cabana_version: "${cab19_v}" }
              as: Group
