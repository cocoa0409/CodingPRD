        type: integer
        source: computed
        description: "max(0, guaranteed_kwh - measured_production_kwh) at evaluation (calc: production_shortfall_eval)."
        default: 0
      - name: payout_cents
        type: integer
        source: computed
        description: "Approved remediation payout in cents (calc: production_shortfall_eval)."
        default: 0

