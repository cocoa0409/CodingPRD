            - call: "POST /welder-qualifications"
              payload: { welder_stamp: "W-88", welder_name: "Ola Beck", wps_id: "${wps_a}", position_qualified: "2G", thickness_range_max_in: 2.0000, qualified_on: "2026-07-01" }
