  - { error_id: ERR_INVALID_ROLE,               http_status: 400, message: "X-User-Role is not a recognised role.", raised_by: "validation priority 2" }
  - { error_id: ERR_UNAUTHORIZED,               http_status: 403, message: "This role may not call this endpoint.", raised_by: "validation priority 3" }
  - { error_id: ERR_FORBIDDEN_RESOURCE,         http_status: 403, message: "An athlete may only act on their own deliverables.", raised_by: "validation priority 4" }
  - { error_id: ERR_SEGREGATION_OF_DUTIES,      http_status: 403, message: "The user who verified this deliverable may not initiate its payout.", raised_by: "validation priority 22" }

  # --- schema ---
  - { error_id: ERR_INVALID_REQUEST,            http_status: 400, message: "The request body is missing a required field or carries an invalid value.", raised_by: "validation priority 5" }

  # --- existence ---
  - { error_id: ERR_COLLECTIVE_NOT_FOUND,       http_status: 404, message: "Collective not found.",        raised_by: "validation priorities 6 and 7" }
  - { error_id: ERR_MEMBERSHIP_TIER_NOT_FOUND,  http_status: 404, message: "Membership tier not found.",    raised_by: "validation priorities 6 and 7" }
  - { error_id: ERR_DONOR_MEMBER_NOT_FOUND,     http_status: 404, message: "Donor member not found.",       raised_by: "validation priorities 6 and 7" }
  - { error_id: ERR_COMMITMENT_NOT_FOUND,       http_status: 404, message: "Commitment not found.",         raised_by: "validation priorities 6 and 7" }
  - { error_id: ERR_CONTRIBUTION_NOT_FOUND,     http_status: 404, message: "Contribution not found.",       raised_by: "validation priority 6" }
  - { error_id: ERR_ATHLETE_NOT_FOUND,          http_status: 404, message: "Athlete not found.",            raised_by: "validation priorities 6 and 7" }
  - { error_id: ERR_DEAL_CONTRACT_NOT_FOUND,    http_status: 404, message: "Deal contract not found.",      raised_by: "validation priorities 6 and 7" }
  - { error_id: ERR_DELIVERABLE_NOT_FOUND,      http_status: 404, message: "Deliverable not found.",        raised_by: "validation priorities 6 and 7" }
  - { error_id: ERR_PAYMENT_RELEASE_NOT_FOUND,  http_status: 404, message: "Payment release not found.",    raised_by: "validation priority 6" }
