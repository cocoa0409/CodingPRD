  # ===========================================================================
  # §1.9 / section: errors — claim-extraction-guide §6: every error code in the
  # §1.6 catalogue must be triggerable by at least one test. The fourteen
  # NOT_FOUND codes are swept in the entities section, the state codes in the
  # state_machines section, the fiscal codes in calculations and validations,
  # and the auth codes in the validations and rbac sections. What is left over
  # is the segregation-of-duties code — the only error in the catalogue that no
  # single-actor chain can reach — plus a uniformity claim over the envelope
  # itself, so that a 402 is not quietly shaped differently from a 404.
  # ===========================================================================
  - section: errors
    instances:

      - name: segregation_of_duties_blocks_file_decide_issue_and_revoke_reuse
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations.priority_9_ERR_SEGREGATION_OF_DUTIES
          - roles.GuestServices.exclusive_operations
          - state_machines[RefundException].transitions.REQUESTED_to_APPROVED.preconditions
          - endpoints.POST_/refund-exceptions/{id}/decide
          - endpoints.POST_/goodwill-credits
          - endpoints.POST_/goodwill-credits/{id}/revoke
        distinguishing_aspect: "ERR_SEGREGATION_OF_DUTIES is unreachable for any single GuestServices operator acting once: it needs a second call by an identifier already recorded in a prior step. Three arms are checked against three different recorded columns — requested_by_user_id on decide, decided_by_user_id on issue, issued_by_user_id on revoke — and each arm is immediately followed by the same call from a fresh operator to prove the 403 came from the identifier and not from the payload, the role or the entity state."
        test_recipe:
          setup:
            - "STD chain: restaurant (service_charge_bp 725, hold_ttl 20, offer_ttl 15, max_offer_rounds 2, goodwill cap 20000, prep_lead 45, scrutiny 300000), package (base 12000, DEPOSIT, deposit_bp 3000, STANDARD, DEPOSIT_BASIS, release_discount_bp 1500, prep 12/cover, band 1..8), service 2026-09-10 DINNER 22:00Z..02:00Z turn 150 capacity 20 STANDARD, class 20 seats band 1..8, published"
            - "guest G holds reservation R (party 2: unit 12000, subtotal 24000, service charge 1740, grand 25740, deposit 7722), pays exactly 7722 and confirms"
            - "the clock is moved to 2026-09-08T22:00:00Z — exactly 48h before seating_start — and R is cancelled: STANDARD band 5000 bp gives raw 3861 plus the 500 rebook fee, so forfeited_cents 4361 and refunded_cents 3361"
            - "the exception is filed by GuestServices operator cs_1 (not by the guest), so requested_by_user_id == cs_1 and the refundable head-room is amount_paid 7722 - refunded 3361 == 4361"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Duties House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /experience-packages"
              payload: { restaurant_id: "${r_id}", name: "Tasting Menu", course_count: 8, base_price_cents: 12000, prepayment_mode: "DEPOSIT", deposit_bp: 3000, forfeiture_schedule_code: "STANDARD", forfeiture_basis: "DEPOSIT_BASIS", release_discount_bp: 1500, kitchen_prep_minutes_per_cover: 12, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { pkg_id: $.data.id }
            - call: "POST /services"
              payload: { restaurant_id: "${r_id}", service_date: "2026-09-10", meal_period: "DINNER", seating_start_utc: "2026-09-10T22:00:00Z", seating_end_utc: "2026-09-11T02:00:00Z", turn_time_minutes: 150, seats_capacity: 20, demand_tier: "STANDARD", unsold_release_bp: 5000, release_lead_minutes: 180, waitlist_policy: "FAIR_QUEUE", kitchen_prep_capacity_minutes: 600 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { svc_id: $.data.id }
            - call: "POST /ticket-classes"
              payload: { service_id: "${svc_id}", package_id: "${pkg_id}", seats_allocated: 20, min_party_size: 1, max_party_size: 8 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { tc_id: $.data.id }
            - call: "POST /services/${svc_id}/publish"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
            - call: "POST /guests"
              payload: { email: "duties@corner.test", display_name: "Duties Guest" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "GET /ticket-classes/${tc_id}"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { v1: $.data.version }
            - call: "POST /reservations"
              payload: { ticket_class_id: "${tc_id}", guest_id: "${g_id}", party_size: 2, primary_guest_name: "Duties Guest", expected_ticket_class_version: "${v1}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/payments"
              payload: { amount_cents: 7722 }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-08T22:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /refund-exceptions"
              payload: { reservation_id: "${res_id}", reason_code: "MEDICAL", requested_cents: 4361 }
              as: GuestServices
              as_user_id: "cs_1"
              captures: { rx_id: $.data.id }
          trigger:
            - call: "POST /refund-exceptions/${rx_id}/decide"
              payload: { decision: "APPROVED", decision_note_code: "PARTIAL_GOODWILL", approved_cents: 1000 }
              as: GuestServices
              as_user_id: "cs_1"
              captures: { e_decide: $.data.error_id }
            - call: "GET /refund-exceptions/${rx_id}"
              payload: {}
              as: GuestServices
              as_user_id: "cs_1"
              captures: { st_after_denied_decide: $.data.status }
            - call: "POST /refund-exceptions/${rx_id}/decide"
              payload: { decision: "APPROVED", decision_note_code: "PARTIAL_GOODWILL", approved_cents: 1000 }
              as: GuestServices
              as_user_id: "cs_2"
              captures: { ok_decide: $.data.status }
            - call: "POST /goodwill-credits"
              payload: { refund_exception_id: "${rx_id}", issued_cents: 3361, expires_at_utc: "2027-01-01T00:00:00Z" }
              as: GuestServices
              as_user_id: "cs_2"
              captures: { e_issue: $.data.error_id }
            - call: "POST /goodwill-credits"
              payload: { refund_exception_id: "${rx_id}", issued_cents: 3361, expires_at_utc: "2027-01-01T00:00:00Z" }
              as: GuestServices
              as_user_id: "cs_3"
              captures: { gc_id: $.data.id }
            - call: "POST /goodwill-credits/${gc_id}/revoke"
              payload: { reason_code: "POLICY_REVIEW" }
              as: GuestServices
              as_user_id: "cs_3"
              captures: { e_revoke: $.data.error_id }
            - call: "POST /goodwill-credits/${gc_id}/revoke"
              payload: { reason_code: "POLICY_REVIEW" }
              as: GuestServices
              as_user_id: "cs_4"
              captures: { gc_status: $.data.status }
          assert:
            - "arm A: ${e_decide} == ERR_SEGREGATION_OF_DUTIES with HTTP 403, because cs_1 filed the exception and priority 9 outranks the priority 63 and 64 amount checks the same payload would otherwise pass"
            - "${st_after_denied_decide} == REQUESTED: the rejected decide left approved_cents 0, shortfall_cents 0 and decided_by_user_id null, so no side effect leaked"
            - "${ok_decide} == APPROVED: the identical payload from cs_2 succeeds, which is what makes the 403 attributable to the identifier alone"
            - "after cs_2's decision RefundException.${rx_id}.approved_cents == 1000, shortfall_cents == 3361 and decided_by_user_id == cs_2; Reservation.${res_id} gains a FORFEITURE_REVERSAL and a REFUND row of 1000 each with memo_code REFUND_EXCEPTION"
            - "arm B: ${e_issue} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 — the decider cs_2 may not also be the issuer"
            - "the third attempt by the untainted cs_3 returns 201 with GoodwillCredit.${gc_id}.issued_cents == 3361, remaining_cents == 3361, status == ISSUED, issued_by_user_id == cs_3, guest_id == ${g_id} and restaurant_id == ${r_id} copied from the exception's reservation"
            - "arm C: ${e_revoke} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 — the issuer cs_3 may not claw back its own credit"
            - "${gc_status} == REVOKED: cs_4's identical revoke returns 200 with revoked_cents 3361, remaining_cents 0 and redeemed_cents 0"
            - "no PaymentTransaction row is written by either revoke attempt, so Reservation.${res_id}.amount_paid_cents stays 7722 and refunded_cents stays 4361 (3361 cancellation refund + 1000 exception refund)"
            - "exactly three of the seven trigger calls returned 403 and all three carry error_id ERR_SEGREGATION_OF_DUTIES; none of them mutated any row"

      - name: error_envelope_shape_returns_400_402_403_404_409_and_412_uniformly
        claim_type: Error Triggerability
        grounds:
          - response_envelope.error
          - validations.priority_3_ERR_UNAUTHORIZED
          - validations.priority_8_ERR_INVALID_PAGINATION
          - validations.priority_17_ERR_RESERVATION_INVALID_STATE
          - validations.priority_10_ERR_STALE_TICKET_CLASS_VERSION
          - validations.priority_61_ERR_PAYMENT_BELOW_DEPOSIT
          - errors[ERR_RESERVATION_NOT_FOUND]
          - errors[ERR_PARTY_SIZE_OUT_OF_BAND]
        distinguishing_aspect: "One reservation is used to fire six different status classes — 400, 402, 403, 404, 409, 412 and 422 — and every response must carry the same two-field data object {error_id, message} under response_type error, with no partial entity body and no pagination block. A handler that returns a bare string for 404, or that leaks the reservation on the 409, fails even though its status code is right."
        test_recipe:
          setup:
            - "STD chain as above with the service published; guest G1 holds reservation R (party 2, deposit_due 7722) in fulfillment_status PENDING and payment_status UNPAID"
            - "the class version read before R was created is retained as the stale token; creating R bumped TicketClass.version, so replaying that token is a genuine 412"
            - "a second guest G2 exists with no reservations, used for the out-of-band party attempt so no duplicate-reservation rule can shadow it"
            - "the clock stays at 2026-09-01T00:00:00Z, well inside R's 20 minute hold"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Envelope House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
