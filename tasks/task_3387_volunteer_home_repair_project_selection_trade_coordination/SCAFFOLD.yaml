    input: [outcome, "notes?"]
    output: TradeWorkOrder
    side_effects: ["PASSED -> INSPECTED: covered items COMPLETED", "FAILED -> INSPECTION_FAILED: strike_count += 1, auto-suspend at 3 with cancellation cascade"]

  - method: PATCH
    path: "/rebuild/trade-work-orders/{workOrderId}"
    description: "Drive work-order transitions. TradePartner (own orders): QUOTED with quote_cents, INVOICED with invoice_cents. AffiliateStaff: APPROVED (permit_number when required) | IN_PROGRESS | PENDING_INSPECTION | PAID | CANCELLED"
    roles: [TradePartner, AffiliateStaff]
    code: 200
    input: [status, "quote_cents?", "invoice_cents?", "permit_number?", "cancellation_reason?"]
    output: TradeWorkOrder
    side_effects: ["PAID: spent += invoice, project reserved_balance -= invoice", "CANCELLED: posture recompute and possible READY demotion"]

  # --- MaterialOrder ---
  - method: POST
    path: "/rebuild/material-orders"
    description: "Place a material order for a project (lines rounded per-line, then fee)"
    roles: [AffiliateStaff]
    code: 201
    input: [project_id, lines, "supplier?"]
    output: MaterialOrder
    side_effects: ["status ORDERED; totals computed; ERR_INSUFFICIENT_FUNDING when total exceeds cycle available_cents; posture recompute"]

  - method: GET
    path: "/rebuild/material-orders"
