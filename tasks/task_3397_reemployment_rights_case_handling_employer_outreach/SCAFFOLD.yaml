# =============================================================================
# SCAFFOLD — Reemployment Rights Case Handling & Employer Outreach (ESGR)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Reemployment Rights Case Handling & Employer Outreach (Employer Support of the
  Guard and Reserve): informal case intake from service members reporting
  employment problems related to military service, ombudsman assignment with
  neutrality obligations and mediation between the employer and employee,
  statutory reemployment rights analysis covering notice, service duration
  limits, prompt application deadlines and escalator position placement,
  benefit continuation and pension accrual questions during service periods
  with employer education, employer recognition programs and statements of
  support with outreach events, referral to federal enforcement agencies when
  informal resolution fails, volunteer ombudsman training, certification and
  case documentation standards, trend reporting to identify employer sectors
  with recurring issues.

domain_name: reemployment-rights-mediation
api_prefix: /reemployment

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency      # OCC on ReemploymentCase.version (assign + analysis)
    - cascading_side_effects      # decertify / referral-submit / resolve cascades
    - rate_threshold_triggers     # service-duration bands, 5-year cap, caseload cap
    - scheduled_actions           # lazy clock-driven expiry: rounds, certifications, statements
  entity_topology: flat           # peer entities joined by body FKs; sub-resource reads
  state_machine_shape: cyclic     # Case reopen loop; Ombudsman leave/expiry loops; Referral return loop
  relationship_patterns:
    - many_to_many                # Ombudsman <-> Employer via Case assignments
    - cross_aggregate             # analyses span Case + ServicePeriod + Employer
  role_model: segregation_of_duties  # proctor may not certify; creator may not submit referral
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Service member legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: branch, type: enum, source: input, description: "Uniformed branch", constraints: "ARMY | NAVY | AIR_FORCE | MARINES | COAST_GUARD | SPACE_FORCE" }
      - { name: component, type: enum, source: input, description: "Reserve component", constraints: "ARMY_RESERVE | NAVY_RESERVE | MARINE_RESERVE | ARMY_GUARD | AIR_GUARD" }

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: sector, type: enum, source: input, description: "Industry sector used by trend reporting", constraints: "MANUFACTURING | RETAIL | HEALTHCARE | LOGISTICS | GOVERNMENT | CONSTRUCTION | HOSPITALITY | TECHNOLOGY" }
      - { name: size_tier, type: enum, source: input, description: "Headcount band", constraints: "SMALL | MEDIUM | LARGE" }
      - { name: resolved_case_count, type: integer, source: computed, description: "Count of this employer's ReemploymentCase rows in status RESOLVED_INFORMAL" }
      - { name: open_case_count, type: integer, source: computed, description: "Count of this employer's cases in status INTAKE, TRIAGE, ASSIGNED, IN_MEDIATION, AWAITING_RESPONSE or ESCALATION_PENDING" }
      - { name: recognition_tier, type: enum, source: computed, description: "Highest tier of any CONFERRED RecognitionAward; NONE when none", default: "NONE", constraints: "NONE | BRONZE | SILVER | GOLD" }

  - name: Ombudsman
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: employer_affiliation_id, type: string, source: input, description: "FK -> Employer.id; nullable; declared employment affiliation driving the neutrality conflict check at assignment", default: null }
      - { name: status, type: enum, source: system, description: "Volunteer lifecycle", constraints: "TRAINEE | CERTIFIED | ON_LEAVE | EXPIRED | DECERTIFIED", default: "TRAINEE" }
      - { name: certified_on, type: datetime, source: system, description: "Last certification instant; null until first CERTIFIED", default: null }
      - { name: certification_expires_on, type: datetime, source: system, description: "certified_on + 24 months; lazy expiry flips CERTIFIED to EXPIRED once the logical clock is strictly greater", default: null }
      - { name: active_caseload, type: integer, source: computed, description: "Count of ReemploymentCase rows with assigned_ombudsman_id == this id and status in ASSIGNED | IN_MEDIATION | AWAITING_RESPONSE | ESCALATION_PENDING" }
      - { name: total_training_hours, type: number, source: computed, description: "Sum of hours over all TrainingRecord rows for this ombudsman" }

  - name: ServicePeriod
    parent: null
    common_fields: false
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> ServiceMember.id" }
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the employer the service was performed away from" }
      - { name: start_date, type: datetime, source: input, description: "Service start, date precision at 00:00:00Z" }
      - { name: end_date, type: datetime, source: input, description: "Service end, date precision at 00:00:00Z; null = ongoing period", default: null }
      - { name: orders_type, type: enum, source: input, description: "Category of orders; NATIONAL_EMERGENCY and PRESIDENTIAL_CALLUP are exempt from the 5-year cumulative cap", constraints: "DRILL | ANNUAL_TRAINING | ACTIVE_DUTY | NATIONAL_EMERGENCY | PRESIDENTIAL_CALLUP" }
      - { name: notice_given_at, type: datetime, source: input, description: "When the member gave advance notice to the employer; null = no notice given", default: null }
      - { name: duration_days, type: integer, source: computed, description: "(end_date - start_date) in whole days; null while ongoing" }
      - { name: chargeable, type: boolean, source: computed, description: "true unless orders_type is NATIONAL_EMERGENCY or PRESIDENTIAL_CALLUP" }

  - name: ReemploymentCase
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> ServiceMember.id; must equal X-User-ID when the actor role is ServiceMember" }
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: issue_type, type: enum, source: input, description: "Primary complaint category", constraints: "REEMPLOYMENT | BENEFITS | PENSION | DISCRIMINATION | RETALIATION" }
      - { name: description, type: string, source: input, description: "Free-text problem statement" }
      - { name: application_submitted_at, type: datetime, source: input, description: "When the member applied for reemployment; null = never applied", default: null }
      - { name: excuse_claimed, type: boolean, source: input, description: "Member claims advance notice was impossible or unreasonable", default: false }
      - { name: excuse_category, type: enum, source: input, description: "Claimed excuse basis; honored only by the LENIENT analysis variant", default: null, constraints: "ORDERS_SHORT_FUSE | OPERATIONAL_NECESSITY | CLASSIFIED_MISSION" }
      - { name: assigned_ombudsman_id, type: string, source: system, description: "FK -> Ombudsman.id; null while unassigned", default: null }
      - { name: status, type: enum, source: system, description: "Case lifecycle (cyclic)", default: "INTAKE", constraints: "INTAKE | TRIAGE | ASSIGNED | IN_MEDIATION | AWAITING_RESPONSE | ESCALATION_PENDING | RESOLVED_INFORMAL | REFERRED | CLOSED_WITHDRAWN | CLOSED_UNRESOLVED" }
      - { name: open_round_count, type: integer, source: computed, description: "Count of this case's MediationRound rows in status PROPOSED" }
      - { name: documentation_complete, type: boolean, source: computed, description: "Documentation-standard predicate per calculations.documentation_completeness" }
      - { name: escalated_at, type: datetime, source: system, description: "Instant the case entered ESCALATION_PENDING; referral window anchor", default: null }
      - { name: closed_at, type: datetime, source: system, description: "Instant the case entered CLOSED_UNRESOLVED or CLOSED_WITHDRAWN", default: null }

  - name: MediationRound
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ReemploymentCase.id" }
      - { name: round_number, type: integer, source: computed, description: "Per-case sequence starting at 1; count of prior rounds for the case + 1" }
      - { name: proposal_text, type: string, source: input, description: "Ombudsman's proposed informal resolution" }
      - { name: addressed_to, type: enum, source: input, description: "Party that must respond", constraints: "EMPLOYER | MEMBER" }
      - { name: response_deadline, type: datetime, source: computed, description: "created_at + 14 days (RESPONSE_WINDOW_DAYS)" }
      - { name: status, type: enum, source: system, description: "Round lifecycle", default: "PROPOSED", constraints: "PROPOSED | ACCEPTED | COUNTERED | DECLINED | EXPIRED | CLOSED_MOOT" }
      - { name: response, type: enum, source: system, description: "Recorded response; null until a response is accepted", default: null, constraints: "ACCEPT | COUNTER | DECLINE" }
      - { name: counter_text, type: string, source: system, description: "Counter-proposal text supplied with a COUNTER response; null otherwise", default: null }
      - { name: responded_at, type: datetime, source: system, description: "Instant the response was recorded", default: null }

  - name: CaseNote
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ReemploymentCase.id" }
      - { name: note_type, type: enum, source: input, description: "Documentation category; AUDIT is reserved to system-generated entries and rejected on input", constraints: "INTAKE | CONTACT | EMPLOYER_EDUCATION | RESOLUTION | AUDIT" }
      - { name: body, type: string, source: input, description: "Note text" }
      - { name: author_role, type: string, source: system, description: "X-User-Role of the author" }
      - { name: author_id, type: string, source: system, description: "X-User-ID of the author; audit string, not an entity reference" }

  - name: EligibilityAnalysis
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ReemploymentCase.id; taken from the path of POST /cases/{id}/eligibility-analysis" }
      - { name: sequence_number, type: integer, source: computed, description: "Per-case sequence starting at 1; the current analysis is the one with the max sequence_number for the case" }
      - { name: variant, type: enum, source: input, description: "Interpretation of the notice requirement", constraints: "STRICT | LENIENT" }
      - { name: notice_hours_advance, type: number, source: computed, description: "Hours between notice_given_at and start_date of the disputed period; null when no notice was given" }
      - { name: notice_satisfied, type: boolean, source: computed, description: "STRICT: notice_hours_advance >= 24. LENIENT: that, or excuse_claimed with non-null excuse_category" }
      - { name: cumulative_chargeable_days, type: integer, source: computed, description: "Sum of duration_days over all completed chargeable ServicePeriod rows for (member, employer)" }
      - { name: service_limit_ok, type: boolean, source: computed, description: "cumulative_chargeable_days <= 1825 (exactly 1825 passes)" }
      - { name: disputed_period_duration_days, type: integer, source: computed, description: "duration_days of the disputed period selected per calculations.disputed_period_selection" }
      - { name: duration_band, type: enum, source: computed, description: "SHORT <= 30 days; MID 31..180; LONG >= 181", constraints: "SHORT | MID | LONG" }
      - { name: application_deadline_days, type: integer, source: computed, description: "1 for SHORT, 14 for MID, 90 for LONG" }
      - { name: application_deadline_date, type: datetime, source: computed, description: "disputed period end_date + application_deadline_days" }
      - { name: deadline_satisfied, type: boolean, source: computed, description: "application_submitted_at <= application_deadline_date (equality passes); false when application_submitted_at is null" }
      - { name: escalator_position_class, type: enum, source: computed, description: "SHORT -> SAME_POSITION; MID -> SENIORITY_ESCALATED; LONG -> ESCALATED_WITH_RETRAINING", constraints: "SAME_POSITION | SENIORITY_ESCALATED | ESCALATED_WITH_RETRAINING" }
      - { name: overall_eligible, type: boolean, source: computed, description: "notice_satisfied AND service_limit_ok AND deadline_satisfied" }

  - name: BenefitAssessment
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ReemploymentCase.id; at most one BenefitAssessment per case" }
      - { name: health_continuation_months, type: number, source: computed, description: "min(round_half_up(total completed service days / 30.44, 2), 24)" }
      - { name: pension_credit_months_official, type: number, source: computed, description: "Per-period rounding: round each period's days/30.44 to 2dp half-up, then sum, then round to 2dp half-up" }
      - { name: pension_credit_months_alternate, type: number, source: computed, description: "Aggregate rounding (informational): sum all days, divide by 30.44, round to 2dp half-up" }
      - { name: education_required, type: boolean, source: computed, description: "true when the case issue_type is BENEFITS or PENSION" }
      - { name: education_satisfied, type: boolean, source: computed, description: "Computed at read time: true when the case has at least one EMPLOYER_EDUCATION CaseNote" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> ReemploymentCase.id; case must be ESCALATION_PENDING" }
      - { name: agency, type: enum, source: input, description: "Federal enforcement agency", constraints: "DOL_VETS | DOJ_CIVIL_RIGHTS | OPM" }
      - { name: summary, type: string, source: input, description: "Referral narrative" }
      - { name: status, type: enum, source: system, description: "Referral lifecycle (cyclic return-for-info loop)", default: "DRAFT", constraints: "DRAFT | SUBMITTED | RETURNED_FOR_INFO | ACKNOWLEDGED | WITHDRAWN" }
      - { name: submitted_at, type: datetime, source: system, description: "Instant of first DRAFT -> SUBMITTED transition; window anchor", default: null }
      - { name: info_request_note, type: string, source: system, description: "Agency note recorded on RETURNED_FOR_INFO", default: null }
      - { name: created_by_ombudsman_id, type: string, source: system, description: "X-User-ID of the creating ombudsman; audit string, not an entity reference" }

  - name: StatementOfSupport
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; must equal X-User-ID when the actor role is Employer" }
      - { name: signer_name, type: string, source: input, description: "Signatory name" }
      - { name: signer_title, type: string, source: input, description: "Signatory title" }
      - { name: term_months, type: integer, source: input, description: "Pledge term in months", default: 24 }
      - { name: status, type: enum, source: system, description: "Pledge lifecycle (cyclic renewal)", default: "PLEDGED", constraints: "PLEDGED | SIGNED | LAPSED | REVOKED" }
      - { name: signed_on, type: datetime, source: system, description: "Instant of signing", default: null }
      - { name: expires_on, type: datetime, source: system, description: "signed_on + term_months; lazy lapse flips SIGNED to LAPSED once the logical clock is strictly greater", default: null }

  - name: RecognitionAward
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: tier, type: enum, source: input, description: "Nominated tier", constraints: "BRONZE | SILVER | GOLD" }
      - { name: rationale, type: string, source: input, description: "Nomination rationale" }
      - { name: nominated_by_id, type: string, source: system, description: "X-User-ID of the nominator; audit string (ombudsman id or coordinator id), not an entity reference" }
      - { name: nominated_by_role, type: string, source: system, description: "X-User-Role of the nominator" }
      - { name: status, type: enum, source: system, description: "Award lifecycle", default: "NOMINATED", constraints: "NOMINATED | VETTED | CONFERRED | DECLINED" }
      - { name: score_base, type: integer, source: system, description: "Base points snapshot computed at vetting per calculations.employer_recognition_score", default: null }
      - { name: tier_qualified, type: enum, source: system, description: "Tier derived from score_base ALONE at vetting (bonus never changes tier)", default: null, constraints: "BRONZE | SILVER | GOLD" }
      - { name: score_bonus, type: integer, source: system, description: "Tier bonus snapshot computed at vetting", default: null }
      - { name: score_final, type: integer, source: system, description: "score_base + score_bonus snapshot", default: null }

  - name: OutreachEvent
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: venue, type: string, source: input, description: "Venue identifier string; venue-level double-booking scope" }
      - { name: starts_at, type: datetime, source: input, description: "Event start (closed interval start)" }
      - { name: ends_at, type: datetime, source: input, description: "Event end (closed interval end); must be strictly after starts_at" }
      - { name: topic, type: enum, source: input, description: "Outreach topic", constraints: "RIGHTS_OVERVIEW | BENEFITS_BRIEFING | EMPLOYER_RECOGNITION | HIRING_FAIR" }
      - { name: status, type: enum, source: system, description: "Event lifecycle", default: "PLANNED", constraints: "PLANNED | OPEN | CONCLUDED | CANCELLED" }

  - name: TrainingRecord
    parent: null
    common_fields: false
    fields:
      - { name: ombudsman_id, type: string, source: input, description: "FK -> Ombudsman.id" }
      - { name: module_code, type: enum, source: input, description: "Completed module", constraints: "CORE_LAW | MEDIATION_SKILLS | DOCUMENTATION | ETHICS_NEUTRALITY | ELECTIVE" }
      - { name: hours, type: number, source: input, description: "Credit hours" }
      - { name: exam_score, type: integer, source: input, description: "Exam score 0..100; core modules require >= 80", constraints: "0 <= score <= 100" }
      - { name: completed_on, type: datetime, source: input, description: "Completion instant; recertification requires a record within the trailing 24 months" }
      - { name: proctor_id, type: string, source: system, description: "X-User-ID of the recording ProgramCoordinator; segregation-of-duties input, not an entity reference" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ReemploymentCase
    initial_state: INTAKE
    terminal_states: [RESOLVED_INFORMAL, REFERRED, CLOSED_WITHDRAWN]
    transitions:
      - from: INTAKE
        to: TRIAGE
        trigger: "POST /reemployment/cases/{id}/state {to_status: TRIAGE}"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []
      - from: TRIAGE
        to: ASSIGNED
        trigger: "POST /reemployment/cases/{id}/assign"
        actor: ProgramCoordinator
        preconditions:
          - "Ombudsman exists and current status is CERTIFIED (lazy expiry applied first; else ERR_OMBUDSMAN_NOT_CERTIFIED)"
          - "Ombudsman.employer_affiliation_id != case.employer_id (else ERR_CONFLICT_OF_INTEREST)"
          - "Ombudsman.active_caseload < 4 (MAX_ACTIVE_CASELOAD; at exactly 4 -> ERR_CASELOAD_FULL)"
          - "expected_case_version == case.version (else ERR_STALE_CASE_VERSION)"
        side_effects:
          - "assigned_ombudsman_id set; increments ReemploymentCase.version by 1"
          - "assigned ombudsman's active_caseload increases by 1 (derived)"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /reemployment/cases/{id}/assign (reassignment supersedes prior assignment)"
        actor: ProgramCoordinator
        preconditions: ["Same checks as TRIAGE -> ASSIGNED, including OCC on expected_case_version"]
        side_effects:
          - "previous ombudsman's active_caseload decreases by 1; new ombudsman's increases by 1 (derived)"
          - "increments ReemploymentCase.version by 1"
      - from: ASSIGNED
        to: AWAITING_RESPONSE
        trigger: "system — on MediationRound creation (POST /reemployment/mediation-rounds)"
        actor: system
        preconditions: []
        side_effects: ["open_round_count becomes 1"]
      - from: IN_MEDIATION
        to: AWAITING_RESPONSE
        trigger: "system — on MediationRound creation"
        actor: system
        preconditions: []
        side_effects: ["open_round_count increases by 1"]
      - from: AWAITING_RESPONSE
        to: IN_MEDIATION
        trigger: "system — on round terminal response COUNTERED/DECLINED or lazy EXPIRED"
        actor: system
        preconditions: []
        side_effects: ["open_round_count decreases by 1"]
      - from: AWAITING_RESPONSE
        to: RESOLVED_INFORMAL
        trigger: "system — on round response ACCEPT (POST /reemployment/mediation-rounds/{id}/respond)"
        actor: system
        preconditions:
          - "case.documentation_complete is true (else ERR_DOCUMENTATION_INCOMPLETE; round stays PROPOSED and no side effects fire)"
        side_effects:
          - "round -> ACCEPTED, responded_at set"
          - "employer.resolved_case_count increases by 1 and employer.open_case_count decreases by 1 (derived)"
          - "assigned ombudsman's active_caseload decreases by 1 (derived)"
          - "closed_at set to logical clock"
      - from: IN_MEDIATION
        to: ESCALATION_PENDING
        trigger: "POST /reemployment/cases/{id}/state {to_status: ESCALATION_PENDING}"
        actor: Ombudsman
        preconditions:
          - "actor X-User-ID == case.assigned_ombudsman_id"
          - "at least one of the case's rounds is DECLINED or EXPIRED (else ERR_NO_EXHAUSTED_ROUND)"
        side_effects: ["escalated_at set to logical clock"]
      - from: AWAITING_RESPONSE
        to: ESCALATION_PENDING
        trigger: "POST /reemployment/cases/{id}/state {to_status: ESCALATION_PENDING}"
        actor: Ombudsman
        preconditions: ["Same as IN_MEDIATION -> ESCALATION_PENDING"]
        side_effects: ["escalated_at set to logical clock"]
      - from: ESCALATION_PENDING
        to: REFERRED
        trigger: "system — on Referral DRAFT -> SUBMITTED (POST /reemployment/referrals/{id}/state)"
        actor: system
        preconditions: []
        side_effects:
          - "any PROPOSED round of the case -> CLOSED_MOOT"
          - "a system AUDIT CaseNote is appended to the case for each round so closed"
          - "assigned ombudsman's active_caseload decreases by 1 (derived)"
      - from: INTAKE
        to: CLOSED_WITHDRAWN
        trigger: "POST /reemployment/cases/{id}/state {to_status: CLOSED_WITHDRAWN}"
        actor: ServiceMember
        preconditions: ["actor X-User-ID == case.member_id"]
        side_effects: ["closed_at set"]
      - from: TRIAGE
        to: CLOSED_WITHDRAWN
        trigger: "POST /reemployment/cases/{id}/state {to_status: CLOSED_WITHDRAWN}"
        actor: ServiceMember
        preconditions: ["actor X-User-ID == case.member_id"]
        side_effects: ["closed_at set"]
      - from: ASSIGNED
        to: CLOSED_WITHDRAWN
        trigger: "POST /reemployment/cases/{id}/state {to_status: CLOSED_WITHDRAWN}"
        actor: ServiceMember
        preconditions: ["actor X-User-ID == case.member_id"]
        side_effects: ["closed_at set", "assigned ombudsman caseload decreases by 1 (derived)", "assigned_ombudsman_id cleared"]
      - from: IN_MEDIATION
        to: CLOSED_WITHDRAWN
        trigger: "POST /reemployment/cases/{id}/state {to_status: CLOSED_WITHDRAWN}"
        actor: ServiceMember
        preconditions: ["actor X-User-ID == case.member_id"]
        side_effects: ["closed_at set", "caseload decrement", "assigned_ombudsman_id cleared"]
      - from: AWAITING_RESPONSE
        to: CLOSED_WITHDRAWN
        trigger: "POST /reemployment/cases/{id}/state {to_status: CLOSED_WITHDRAWN}"
        actor: ServiceMember
        preconditions: ["actor X-User-ID == case.member_id"]
        side_effects: ["closed_at set", "caseload decrement", "PROPOSED rounds -> CLOSED_MOOT with AUDIT note each", "assigned_ombudsman_id cleared"]
      - from: ESCALATION_PENDING
        to: CLOSED_WITHDRAWN
        trigger: "POST /reemployment/cases/{id}/state {to_status: CLOSED_WITHDRAWN}"
        actor: ServiceMember
        preconditions: ["actor X-User-ID == case.member_id"]
        side_effects: ["closed_at set", "caseload decrement", "DRAFT referrals of the case -> WITHDRAWN", "assigned_ombudsman_id cleared"]
      - from: IN_MEDIATION
        to: CLOSED_UNRESOLVED
        trigger: "POST /reemployment/cases/{id}/state {to_status: CLOSED_UNRESOLVED}"
        actor: Ombudsman
        preconditions: ["actor X-User-ID == case.assigned_ombudsman_id"]
        side_effects: ["closed_at set", "caseload decrement", "assigned_ombudsman_id cleared"]
      - from: AWAITING_RESPONSE
        to: CLOSED_UNRESOLVED
        trigger: "POST /reemployment/cases/{id}/state {to_status: CLOSED_UNRESOLVED}"
        actor: Ombudsman
        preconditions: ["actor X-User-ID == case.assigned_ombudsman_id"]
        side_effects: ["closed_at set", "caseload decrement", "PROPOSED rounds -> CLOSED_MOOT with AUDIT note each", "assigned_ombudsman_id cleared"]
      - from: CLOSED_UNRESOLVED
        to: TRIAGE
        trigger: "POST /reemployment/cases/{id}/state {to_status: TRIAGE} (member reopen)"
        actor: ServiceMember
        preconditions:
          - "actor X-User-ID == case.member_id"
          - "logical clock <= closed_at + 60 days (REOPEN_WINDOW_DAYS; else ERR_REOPEN_WINDOW_PASSED)"
        side_effects: ["closed_at cleared"]
        note: "cyclic reopen edge — the case re-enters triage unassigned"

  - entity: Ombudsman
    initial_state: TRAINEE
    terminal_states: [DECERTIFIED]
    transitions:
      - from: TRAINEE
        to: CERTIFIED
        trigger: "POST /reemployment/ombudsmen/{id}/state {to_status: CERTIFIED}"
        actor: ProgramCoordinator
        preconditions:
          - "Core modules CORE_LAW, MEDIATION_SKILLS, DOCUMENTATION each have at least one TrainingRecord with exam_score >= 80 (else ERR_CERTIFICATION_REQUIREMENTS_UNMET)"
          - "total_training_hours >= 20 (CERT_MIN_HOURS; else ERR_CERTIFICATION_REQUIREMENTS_UNMET)"
          - "No TrainingRecord of this ombudsman has proctor_id == acting X-User-ID (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["certified_on = logical clock; certification_expires_on = certified_on + 24 months"]
      - from: CERTIFIED
        to: ON_LEAVE
        trigger: "POST /reemployment/ombudsmen/{id}/state {to_status: ON_LEAVE}"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []
        note: "ON_LEAVE retains existing assignments but fails the CERTIFIED precondition of new assignments"
      - from: ON_LEAVE
        to: CERTIFIED
        trigger: "POST /reemployment/ombudsmen/{id}/state {to_status: CERTIFIED}"
        actor: ProgramCoordinator
        preconditions: ["lazy expiry applied first: if clock > certification_expires_on the current status is EXPIRED and this transition is rejected with ERR_INVALID_STATE"]
        side_effects: []
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system — lazy, when logical clock > certification_expires_on, applied on any read or write of the ombudsman"
        actor: system
        preconditions: []
        side_effects: []
        note: "at clock == certification_expires_on the status is still CERTIFIED (strictly-greater comparison)"
      - from: EXPIRED
        to: CERTIFIED
        trigger: "POST /reemployment/ombudsmen/{id}/state {to_status: CERTIFIED} (recertification)"
        actor: ProgramCoordinator
        preconditions:
          - "At least one TrainingRecord with completed_on within the trailing 24 months of the logical clock and total hours over such records >= 8 (RECERT_MIN_HOURS; else ERR_CERTIFICATION_REQUIREMENTS_UNMET)"
          - "No TrainingRecord of this ombudsman has proctor_id == acting X-User-ID (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["certified_on = logical clock; certification_expires_on = certified_on + 24 months"]
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "POST /reemployment/ombudsmen/{id}/state {to_status: DECERTIFIED, reason}"
        actor: ProgramCoordinator
        preconditions: []
        side_effects:
          - "CASCADE link 1: every assigned ReemploymentCase in ASSIGNED | IN_MEDIATION | AWAITING_RESPONSE | ESCALATION_PENDING reverts to TRIAGE with assigned_ombudsman_id cleared (caseload derived drop)"
          - "CASCADE link 2 (from link 1): each reverted case's PROPOSED MediationRound -> CLOSED_MOOT"
          - "CASCADE link 3 (from link 2): a system AUDIT CaseNote is appended to the case for each round so closed"
          - "DRAFT referrals created by this ombudsman on reverted cases -> WITHDRAWN"
      - from: TRAINEE
        to: DECERTIFIED
        trigger: "POST /reemployment/ombudsmen/{id}/state {to_status: DECERTIFIED, reason}"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []

  - entity: MediationRound
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, COUNTERED, DECLINED, EXPIRED, CLOSED_MOOT]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /reemployment/mediation-rounds/{id}/respond {response: ACCEPT}"
        actor: "Employer or ServiceMember, matching addressed_to"
        preconditions:
          - "clock <= response_deadline (else round -> EXPIRED, case -> IN_MEDIATION, and the request fails ERR_RESPONSE_DEADLINE_PASSED)"
          - "case documentation gate (see ReemploymentCase AWAITING_RESPONSE -> RESOLVED_INFORMAL)"
        side_effects: ["responded_at set", "case -> RESOLVED_INFORMAL with its side effects"]
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /reemployment/mediation-rounds/{id}/respond {response: COUNTER, counter_text}"
        actor: "Employer or ServiceMember, matching addressed_to"
        preconditions: ["clock <= response_deadline (same lazy-expiry behavior)"]
        side_effects: ["counter_text stored; case -> IN_MEDIATION"]
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /reemployment/mediation-rounds/{id}/respond {response: DECLINE}"
        actor: "Employer or ServiceMember, matching addressed_to"
        preconditions: ["clock <= response_deadline"]
        side_effects: ["case -> IN_MEDIATION"]
      - from: PROPOSED
        to: EXPIRED
        trigger: "system — lazy, on any read or respond attempt when clock > response_deadline"
        actor: system
        preconditions: []
        side_effects: ["case -> IN_MEDIATION"]
        note: "at clock == response_deadline a response is still timely (inclusive boundary)"
      - from: PROPOSED
        to: CLOSED_MOOT
        trigger: "system — cascade from case referral, withdrawal, closure, or ombudsman decertification"
        actor: system
        preconditions: []
        side_effects: ["a system AUDIT CaseNote is appended to the case"]

  - entity: Referral
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reemployment/referrals/{id}/state {to_status: SUBMITTED}"
        actor: ProgramCoordinator
        preconditions:
          - "case is ESCALATION_PENDING"
          - "first submission only: clock <= case.escalated_at + 30 days (REFERRAL_WINDOW_DAYS; else ERR_REFERRAL_WINDOW_PASSED); resubmission after RETURNED_FOR_INFO is not window-checked"
        side_effects:
          - "submitted_at set on first submission"
          - "case ESCALATION_PENDING -> REFERRED (cascade per ReemploymentCase machine)"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /reemployment/referrals/{id}/state {to_status: ACKNOWLEDGED}"
        actor: AgencyReviewer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: RETURNED_FOR_INFO
        trigger: "POST /reemployment/referrals/{id}/state {to_status: RETURNED_FOR_INFO, info_request_note}"
        actor: AgencyReviewer
        preconditions: []
        side_effects: ["info_request_note stored"]
      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /reemployment/referrals/{id}/state {to_status: SUBMITTED}"
        actor: ProgramCoordinator
        preconditions: ["case is REFERRED (it transitioned on first submission)"]
        side_effects: []
        note: "cyclic resubmission edge; the 30-day window does not re-apply"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /reemployment/referrals/{id}/state {to_status: WITHDRAWN} or cascade (case withdrawn / ombudsman decertified)"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []

  - entity: StatementOfSupport
    initial_state: PLEDGED
    terminal_states: [REVOKED]
    transitions:
      - from: PLEDGED
        to: SIGNED
        trigger: "POST /reemployment/statements-of-support/{id}/state {to_status: SIGNED}"
        actor: "Employer (own statement) or ProgramCoordinator"
        preconditions: []
        side_effects: ["signed_on = logical clock; expires_on = signed_on + term_months"]
      - from: SIGNED
        to: LAPSED
        trigger: "system — lazy, when logical clock > expires_on, applied on any read"
        actor: system
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: SIGNED
        trigger: "POST /reemployment/statements-of-support/{id}/state {to_status: SIGNED} (renewal)"
        actor: "Employer (own) or ProgramCoordinator"
        preconditions: []
        side_effects: ["signed_on = logical clock; expires_on recomputed"]
        note: "cyclic renewal edge"
      - from: PLEDGED
        to: REVOKED
        trigger: "POST /reemployment/statements-of-support/{id}/state {to_status: REVOKED}"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []
      - from: SIGNED
        to: REVOKED
        trigger: "POST /reemployment/statements-of-support/{id}/state {to_status: REVOKED}"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []

  - entity: RecognitionAward
    initial_state: NOMINATED
    terminal_states: [CONFERRED, DECLINED]
    transitions:
      - from: NOMINATED
        to: VETTED
        trigger: "POST /reemployment/recognition-awards/{id}/state {to_status: VETTED}"
        actor: ProgramCoordinator
        preconditions:
          - "employer has at least one StatementOfSupport in status SIGNED (lazy lapse applied first)"
          - "employer.resolved_case_count >= tier gate: BRONZE 1, SILVER 3, GOLD 5 (else ERR_AWARD_ELIGIBILITY_UNMET)"
        side_effects: ["score_base, tier_qualified, score_bonus, score_final computed and stored per calculations.employer_recognition_score"]
      - from: VETTED
        to: CONFERRED
        trigger: "POST /reemployment/recognition-awards/{id}/state {to_status: CONFERRED}"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: ["employer.recognition_tier recomputed as the highest tier among the employer's CONFERRED awards (else NONE)"]
      - from: NOMINATED
        to: DECLINED
        trigger: "POST /reemployment/recognition-awards/{id}/state {to_status: DECLINED}"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []
      - from: VETTED
        to: DECLINED
        trigger: "POST /reemployment/recognition-awards/{id}/state {to_status: DECLINED}"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []

  - entity: OutreachEvent
    initial_state: PLANNED
    terminal_states: [CONCLUDED, CANCELLED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /reemployment/outreach-events/{id}/state {to_status: OPEN}"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CONCLUDED
        trigger: "POST /reemployment/outreach-events/{id}/state {to_status: CONCLUDED}"
        actor: ProgramCoordinator
        preconditions: ["logical clock >= ends_at (else ERR_INVALID_STATE — cannot conclude before the event ends)"]
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /reemployment/outreach-events/{id}/state {to_status: CANCELLED}"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: ["the event is removed from the venue overlap comparison set"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /reemployment/outreach-events/{id}/state {to_status: CANCELLED}"
        actor: ProgramCoordinator
        preconditions: []
        side_effects: ["removed from venue overlap comparison set"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: case-assign-stale-version
    parent_entity: ReemploymentCase
    write_endpoint: "POST /reemployment/cases/{id}/assign"
    occ_field: expected_case_version
    description: |
      Assigning or reassigning a ReemploymentCase whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another coordinator has just assigned the case (a legitimate
      supersede under the TRIAGE->ASSIGNED / ASSIGNED->ASSIGNED transitions)
      and the current coordinator's view of the case is therefore stale.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: case-analysis-stale-version
    parent_entity: ReemploymentCase
    write_endpoint: "POST /reemployment/cases/{id}/eligibility-analysis"
    occ_field: expected_case_version
    description: |
      Recording a new EligibilityAnalysis (which supersedes the prior one as
      the case's current analysis) against a stale observed case version is
      rejected; the client must re-read the case and rerun with the fresh
      version.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: disputed_period_selection
    trigger: "POST /reemployment/cases/{id}/eligibility-analysis; POST /reemployment/benefit-assessments"
    algorithm: aggregation
    formula: |
      candidate_periods = ServicePeriod where member_id == case.member_id
        AND employer_id == case.employer_id
        AND end_date IS NOT NULL AND end_date <= logical_clock   # completed only
      if candidate_periods is empty: abort with ERR_NO_COMPLETED_SERVICE_PERIOD
      disputed = candidate_periods sorted by end_date DESC, then start_date DESC,
        then created_at DESC  -- first element (never id)
    input_set: "Completed ServicePeriod rows of the (member, employer) pair"
    constants: {}

  - name: notice_hours_advance
    trigger: "eligibility analysis"
    algorithm: chronological
    formula: |
      if disputed_period.notice_given_at is null: notice_hours_advance = null
      else notice_hours_advance = (disputed_period.start_date - notice_given_at) in hours (may be negative)
      STRICT variant:  notice_satisfied = (notice_hours_advance IS NOT NULL AND notice_hours_advance >= NOTICE_MIN_HOURS)
      LENIENT variant: notice_satisfied = STRICT result OR (case.excuse_claimed == true AND case.excuse_category IS NOT NULL)
    input_set: "disputed period + case excuse fields"
    constants:
      NOTICE_MIN_HOURS: 24
    precision: "hours as exact number (datetime difference)"
    variants:
      - name: STRICT
        when: "analysis requested with variant STRICT"
        difference: "excuse_claimed is ignored; missing or short notice always fails"
      - name: LENIENT
        when: "analysis requested with variant LENIENT"
        difference: "a claimed, categorized excuse satisfies notice even when notice_hours_advance < 24 or null"

  - name: cumulative_chargeable_service_days
    trigger: "eligibility analysis"
    algorithm: aggregation
    formula: |
      chargeable_days = sum(duration_days) over ServicePeriod rows for (member, employer)
        where end_date IS NOT NULL AND end_date <= logical_clock   # completed only
        AND orders_type NOT IN {NATIONAL_EMERGENCY, PRESIDENTIAL_CALLUP}   # cap-exempt
      service_limit_ok = (chargeable_days <= FIVE_YEAR_CAP_DAYS)   # exactly 1825 passes
    input_set: "all completed periods of the pair, chargeable only; ongoing periods excluded"
    constants:
      FIVE_YEAR_CAP_DAYS: 1825
    precision: "integer days"

  - name: application_deadline_window
    trigger: "eligibility analysis"
    algorithm: threshold
    formula: |
      d = disputed_period_duration_days
      band:      d <= 30 -> SHORT; 31 <= d <= 180 -> MID; d >= 181 -> LONG
      deadline_days: SHORT -> 1; MID -> 14; LONG -> 90
      application_deadline_date = disputed_period.end_date + deadline_days days
      deadline_satisfied = (case.application_submitted_at IS NOT NULL
                            AND case.application_submitted_at <= application_deadline_date)   # equality passes
      escalator_position_class: SHORT -> SAME_POSITION; MID -> SENIORITY_ESCALATED; LONG -> ESCALATED_WITH_RETRAINING
    input_set: "disputed period + case.application_submitted_at"
    constants:
      BAND_SHORT_MAX_DAYS: 30
      BAND_MID_MAX_DAYS: 180
      DEADLINE_DAYS_SHORT: 1
      DEADLINE_DAYS_MID: 14
      DEADLINE_DAYS_LONG: 90
    precision: "date arithmetic in whole days"

  - name: eligibility_determination
    trigger: "eligibility analysis"
    algorithm: threshold
    formula: |
      overall_eligible = notice_satisfied AND service_limit_ok AND deadline_satisfied
      Evaluation order is pinned: (1) disputed period selection, (2) notice,
      (3) cumulative cap, (4) deadline band; all three booleans are always
      computed and stored even when an earlier one is false.
    input_set: "outputs of the three component calculations"
    constants: {}

  - name: pension_accrual_credit
    trigger: "POST /reemployment/benefit-assessments"
    algorithm: aggregation
    formula: |
      periods = completed ServicePeriod rows for (member, employer) -- same selector as disputed_period_selection
      OFFICIAL (pinned rounding order -- per-period first, then sum):
        credit_p = round_half_up(duration_days_p / DAYS_PER_MONTH, 2) for each p
        pension_credit_months_official = round_half_up(sum(credit_p), 2)
      ALTERNATE (informational -- aggregate then round):
        pension_credit_months_alternate = round_half_up(sum(duration_days_p) / DAYS_PER_MONTH, 2)
      The two variants differ whenever per-period rounding accumulates differently;
      e.g. periods of 10, 20, 30 days -> official 0.33+0.66+0.99 = 1.98 vs alternate 60/30.44 = 1.97.
    input_set: "completed periods of the pair (chargeable AND exempt both count for pension)"
    constants:
      DAYS_PER_MONTH: 30.44
    precision: "2 decimal places, round_half_up; per-period rounding BEFORE summation is the pinned official order"
    variants:
      - name: PER_PERIOD_ROUNDING
        when: "official credited value"
        difference: "round each period then sum"
      - name: AGGREGATE_ROUNDING
        when: "informational comparison stored alongside"
        difference: "sum days then round once"

  - name: health_continuation_months
    trigger: "POST /reemployment/benefit-assessments"
    algorithm: threshold
    formula: |
      total_days = sum(duration_days) over completed periods of the pair
      raw_months = round_half_up(total_days / DAYS_PER_MONTH, 2)
      health_continuation_months = min(raw_months, HEALTH_CAP_MONTHS)   # exactly 24 uncapped boundary
    input_set: "completed periods of the pair"
    constants:
      DAYS_PER_MONTH: 30.44
      HEALTH_CAP_MONTHS: 24
    precision: "2 decimal places, round_half_up"

  - name: ombudsman_caseload
    trigger: "derived on read of Ombudsman; consulted by assign"
    algorithm: aggregation
    formula: |
      active_caseload = count(ReemploymentCase where assigned_ombudsman_id == ombudsman.id
        AND status IN {ASSIGNED, IN_MEDIATION, AWAITING_RESPONSE, ESCALATION_PENDING})
      assign rejects when active_caseload >= MAX_ACTIVE_CASELOAD   # exactly 4 blocks
    input_set: "cases by assignment and status filter"
    constants:
      MAX_ACTIVE_CASELOAD: 4
    precision: "integer count"

  - name: documentation_completeness
    trigger: "derived on read of ReemploymentCase; enforced on ACCEPT response"
    algorithm: aggregation
    formula: |
      intake_ok   = count(CaseNote case_id, note_type == INTAKE) >= 1
      contact_ok  = count(CaseNote case_id, note_type == CONTACT) >= count(MediationRound of case, any status)
      resolution_ok = count(CaseNote case_id, note_type == RESOLUTION) >= 1
      education_ok  = case.issue_type IN {BENEFITS, PENSION}
                      IMPLIES count(CaseNote case_id, note_type == EMPLOYER_EDUCATION) >= 1
      documentation_complete = intake_ok AND contact_ok AND resolution_ok AND education_ok
      AUDIT notes never count toward any category.
    input_set: "CaseNote rows of the case (excluding AUDIT), MediationRound rows of the case"
    constants: {}

  - name: employer_recognition_score
    trigger: "RecognitionAward NOMINATED -> VETTED"
    algorithm: weighted_scoring
    formula: |
      Pinned evaluation order (circular-looking dependency resolved):
        (1) score_base = 10 * employer.resolved_case_count
                       + (15 if employer has >= 1 SIGNED statement else 0)
                       - 10 * employer.open_case_count
        (2) tier_qualified = tier from score_base ALONE: base >= 60 -> GOLD;
            base >= 40 -> SILVER; base >= 20 -> BRONZE; else vetting fails ERR_AWARD_ELIGIBILITY_UNMET
        (3) score_bonus = GOLD 30 | SILVER 15 | BRONZE 5, keyed on tier_qualified
        (4) score_final = score_base + score_bonus
      tier_qualified is NEVER recomputed from score_final; a final score crossing
      a higher threshold does not upgrade the tier (e.g. base 35 -> BRONZE, +5 = 40
      final, tier stays BRONZE even though 40 >= SILVER gate).
    input_set: "employer counters + statement statuses at vetting instant"
    constants:
      POINTS_PER_RESOLVED_CASE: 10
      POINTS_SIGNED_STATEMENT: 15
      PENALTY_PER_OPEN_CASE: 10
      TIER_GATE_BASE_BRONZE: 20
      TIER_GATE_BASE_SILVER: 40
      TIER_GATE_BASE_GOLD: 60
      BONUS_BRONZE: 5
      BONUS_SILVER: 15
      BONUS_GOLD: 30
      VET_RESOLVED_GATE: "BRONZE 1 | SILVER 3 | GOLD 5 (resolved_case_count minimums)"
    precision: "integer points"

  - name: sector_trend_aggregation
    trigger: "GET /reemployment/reports/sector-trends"
    algorithm: aggregation
    formula: |
      window = ReemploymentCase where created_at IN [period_start, period_end)   # half-open
        AND employer.sector == requested sector
      total_cases = count(window)
      resolved_count = count(window with status RESOLVED_INFORMAL)
      repeat_employer_count = count(distinct employer_id in window having >= 2 cases in window)
      top_issue_type = issue_type with max count in window; tie-break: the tied
        issue_type whose earliest-created case (created_at ASC) comes first wins
      empty window -> total_cases 0, repeat_employer_count 0, resolved_count 0, top_issue_type null
    input_set: "cases by created_at half-open window and employer sector"
    constants: {}
    precision: "integer counts; top_issue_type nullable"

  - name: lazy_expiry
    trigger: "any read or write of the entity, evaluated against the logical clock"
    algorithm: threshold
    formula: |
      Ombudsman:  CERTIFIED -> EXPIRED when clock > certification_expires_on (strictly greater)
      StatementOfSupport: SIGNED -> LAPSED when clock > expires_on (strictly greater)
      MediationRound: PROPOSED -> EXPIRED when clock > response_deadline (strictly greater),
        flipping its case AWAITING_RESPONSE -> IN_MEDIATION
    input_set: "entities with time-bounded statuses"
    constants: {}

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID header present and non-empty (except role Anonymous, which needs no X-User-ID)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is in the endpoint's roles list; transition-level actor rules (e.g. SUBMITTED only by ProgramCoordinator, ACKNOWLEDGED only by AgencyReviewer)"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Required fields present, enum members valid, AUDIT note_type rejected on input, intervals have end strictly after start — request-shape checks precede FK existence because an absent field cannot be resolved"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body FK fields validated in the endpoint's declared input order (member_id before employer_id, etc.)"
    error_id: "ERR_MEMBER_NOT_FOUND / ERR_EMPLOYER_NOT_FOUND / ERR_OMBUDSMAN_NOT_FOUND / ERR_CASE_NOT_FOUND / ERR_ROUND_NOT_FOUND / ERR_REFERRAL_NOT_FOUND / ERR_EVENT_NOT_FOUND / ERR_STATEMENT_NOT_FOUND / ERR_AWARD_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: auth
    check: "Ownership: entity-backed actors touch only their own rows (member_id/employer_id/assigned_ombudsman_id == X-User-ID as applicable per endpoint); evaluated only for resources that exist"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "endpoints with entity-backed roles"
  - priority: 6
    category: state
    check: "Target entity in a state from which the requested transition exists; cross-entity state gates (ombudsman CERTIFIED for assign; case ESCALATION_PENDING for referral create)"
    error_id: "ERR_INVALID_STATE / ERR_ROUND_NOT_OPEN / ERR_OMBUDSMAN_NOT_CERTIFIED"
    http_status: 409
    applies_to: "state/action endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_case_version equals the case's current version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /reemployment/cases/{id}/assign, POST /reemployment/cases/{id}/eligibility-analysis"
  - priority: 8
    category: business_safety
    check: "Neutrality conflict (ombudsman.employer_affiliation_id == case.employer_id); segregation of duties (proctor may not certify that ombudsman)"
    error_id: "ERR_CONFLICT_OF_INTEREST / ERR_SEGREGATION_OF_DUTIES"
    http_status: "409 / 403"
    applies_to: "assign; ombudsman certify/recertify"
  - priority: 9
    category: business_temporal
    check: "Response deadline; referral window; reopen window (interval shape itself is priority 4)"
    error_id: "ERR_RESPONSE_DEADLINE_PASSED / ERR_REFERRAL_WINDOW_PASSED / ERR_REOPEN_WINDOW_PASSED"
    http_status: 422
    applies_to: "respond; referral submit; case reopen"
  - priority: 10
    category: business_constraint
    check: "Caseload cap; one PROPOSED round per case; documentation completeness on ACCEPT; certification requirements; award vet gates; nomination qualification; completed-period presence; service-period overlap; venue double-booking"
    error_id: "ERR_CASELOAD_FULL / ERR_ROUND_ALREADY_OPEN / ERR_DOCUMENTATION_INCOMPLETE / ERR_CERTIFICATION_REQUIREMENTS_UNMET / ERR_AWARD_ELIGIBILITY_UNMET / ERR_NOMINATION_NOT_QUALIFIED / ERR_NO_EXHAUSTED_ROUND / ERR_NO_COMPLETED_SERVICE_PERIOD / ERR_SERVICE_PERIOD_OVERLAP / ERR_VENUE_DOUBLE_BOOKED"
    http_status: "409 / 422"
    applies_to: "domain rule endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/reemployment/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["lazy expiry transitions evaluate against the new clock on subsequent reads/writes"]

  - method: POST
    path: "/reemployment/members"
    description: "Register a service member (self-registration)"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, branch, component]
    output: ServiceMember
    side_effects: []

  - method: GET
    path: "/reemployment/members/{id}"
    description: "Read a service member"
    roles: [ServiceMember, ProgramCoordinator]
    code: 200
    input: []
    output: ServiceMember
    side_effects: []

  - method: POST
    path: "/reemployment/employers"
    description: "Onboard an employer"
    roles: [ProgramCoordinator]
    code: 201
    input: [legal_name, sector, size_tier]
    output: Employer
    side_effects: ["resolved_case_count = 0, open_case_count = 0, recognition_tier = NONE"]

  - method: GET
    path: "/reemployment/employers/{id}"
    description: "Read an employer including derived counters"
    roles: [Employer, Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: POST
    path: "/reemployment/ombudsmen"
    description: "Volunteer ombudsman signup"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, "employer_affiliation_id?"]
    output: Ombudsman
    side_effects: ["status = TRAINEE"]

  - method: GET
    path: "/reemployment/ombudsmen/{id}"
    description: "Read an ombudsman; lazy expiry of certification applied"
    roles: [Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: Ombudsman
    side_effects: ["lazy_expiry may flip CERTIFIED -> EXPIRED"]

  - method: POST
    path: "/reemployment/ombudsmen/{id}/state"
    description: "Ombudsman lifecycle: CERTIFIED (certify/recertify), ON_LEAVE, DECERTIFIED"
    roles: [ProgramCoordinator]
    code: 200
    input: [to_status, "reason?"]
    output: Ombudsman
    side_effects: ["per Ombudsman state machine, including the decertify cascade"]
  - method: GET
    path: "/reemployment/employers/{id}/affiliated-ombudsmen"
    description: "Ombudsmen declaring affiliation to this employer (conflict screening)"
    roles: [Employer, Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: "Ombudsman[]"
    side_effects: []

  - method: POST
    path: "/reemployment/service-periods"
    description: "Record a period of uniformed service (immutable once created)"
    roles: [ServiceMember, ProgramCoordinator]
    code: 201
    input: [member_id, employer_id, start_date, orders_type, "end_date?", "notice_given_at?"]
    output: ServicePeriod
    side_effects: ["duration_days and chargeable computed"]

  - method: GET
    path: "/reemployment/members/{id}/service-periods"
    description: "Service periods of a member (all employers)"
    roles: [ServiceMember, Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: "ServicePeriod[]"
    side_effects: []

  - method: GET
    path: "/reemployment/employers/{id}/service-periods"
    description: "Service periods naming this employer"
    roles: [Employer, Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: "ServicePeriod[]"
    side_effects: []

  - method: POST
    path: "/reemployment/cases"
    description: "File an informal reemployment-rights case"
    roles: [ServiceMember]
    code: 201
    input: [member_id, employer_id, issue_type, description, "application_submitted_at?", "excuse_claimed?", "excuse_category?"]
    output: ReemploymentCase
    side_effects: ["status = INTAKE"]

  - method: GET
    path: "/reemployment/cases/{id}"
    description: "Read a case (parties and assigned ombudsman only)"
    roles: [ServiceMember, Employer, Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: ReemploymentCase
    side_effects: []

  - method: GET
    path: "/reemployment/cases"
    description: "List cases with filters and envelope pagination"
    roles: [Ombudsman, ProgramCoordinator]
    code: 200
    input: ["member_id?", "employer_id?", "assigned_ombudsman_id?", "status?", "sector?", "issue_type?", "limit?", "offset?"]
    output: "ReemploymentCase[]"
    side_effects: []

  - method: POST
    path: "/reemployment/cases/{id}/assign"
    description: "Assign or reassign an ombudsman (OCC on case version)"
    roles: [ProgramCoordinator]
    code: 200
    input: [ombudsman_id, expected_case_version]
    output: ReemploymentCase
    side_effects: ["case TRIAGE/ASSIGNED -> ASSIGNED", "caseload adjustments", "increments ReemploymentCase.version by 1"]

  - method: POST
    path: "/reemployment/cases/{id}/state"
    description: "Case transitions: TRIAGE, ESCALATION_PENDING, CLOSED_WITHDRAWN, CLOSED_UNRESOLVED, reopen to TRIAGE"
    roles: [ServiceMember, Ombudsman, ProgramCoordinator]
    code: 200
    input: [to_status, "reason?"]
    output: ReemploymentCase
    side_effects: ["per ReemploymentCase state machine, including cascades to rounds and referrals"]

  - method: POST
    path: "/reemployment/cases/{id}/eligibility-analysis"
    description: "Run and store a statutory eligibility analysis (STRICT or LENIENT); supersedes prior analyses (OCC on case version)"
    roles: [Ombudsman, ProgramCoordinator]
    code: 201
    input: [variant, expected_case_version]
    output: EligibilityAnalysis
    side_effects: ["creates EligibilityAnalysis with sequence_number = prior count + 1", "increments ReemploymentCase.version by 1"]

  - method: GET
    path: "/reemployment/cases/{id}/eligibility-analyses"
    description: "All analyses of a case, newest sequence last"
    roles: [ServiceMember, Employer, Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: "EligibilityAnalysis[]"
    side_effects: []

  - method: POST
    path: "/reemployment/mediation-rounds"
    description: "Open a mediation round with the ombudsman's proposal (case must be ASSIGNED or IN_MEDIATION; only the assigned ombudsman)"
    roles: [Ombudsman]
    code: 201
    input: [case_id, proposal_text, addressed_to]
    output: MediationRound
    side_effects: ["case -> AWAITING_RESPONSE", "response_deadline = created_at + 14 days", "rejected with ERR_ROUND_ALREADY_OPEN when a PROPOSED round exists"]

  - method: POST
    path: "/reemployment/mediation-rounds/{id}/respond"
    description: "Respond to a proposal: ACCEPT | COUNTER | DECLINE, by the addressed party"
    roles: [Employer, ServiceMember]
    code: 200
    input: [response, "counter_text?"]
    output: MediationRound
    side_effects: ["per MediationRound and ReemploymentCase state machines, including documentation gate and resolution cascade"]

  - method: GET
    path: "/reemployment/cases/{id}/rounds"
    description: "Mediation rounds of a case"
    roles: [ServiceMember, Employer, Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: "MediationRound[]"
    side_effects: ["lazy round expiry may flip PROPOSED -> EXPIRED"]

  - method: POST
    path: "/reemployment/case-notes"
    description: "Append a documentation note (Ombudsman must be the case's assignee)"
    roles: [Ombudsman, ProgramCoordinator]
    code: 201
    input: [case_id, note_type, body]
    output: CaseNote
    side_effects: ["note_type AUDIT rejected with ERR_INVALID_REQUEST (system-reserved)"]

  - method: GET
    path: "/reemployment/cases/{id}/notes"
    description: "Documentation notes of a case (including system AUDIT notes)"
    roles: [Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: "CaseNote[]"
    side_effects: []

  - method: POST
    path: "/reemployment/benefit-assessments"
    description: "Compute benefit continuation and pension accrual for a case (one per case)"
    roles: [Ombudsman, ProgramCoordinator]
    code: 201
    input: [case_id]
    output: BenefitAssessment
    side_effects: ["second assessment for the same case rejected with ERR_INVALID_STATE"]

  - method: GET
    path: "/reemployment/cases/{id}/benefit-assessments"
    description: "Benefit assessment(s) of a case (0 or 1 element array)"
    roles: [ServiceMember, Employer, Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: "BenefitAssessment[]"
    side_effects: ["education_satisfied recomputed at read"]

  - method: POST
    path: "/reemployment/referrals"
    description: "Draft a referral to a federal enforcement agency (case must be ESCALATION_PENDING; only the assigned ombudsman)"
    roles: [Ombudsman]
    code: 201
    input: [case_id, agency, summary]
    output: Referral
    side_effects: ["status = DRAFT"]

  - method: POST
    path: "/reemployment/referrals/{id}/state"
    description: "Referral lifecycle: SUBMITTED (ProgramCoordinator), ACKNOWLEDGED / RETURNED_FOR_INFO (AgencyReviewer), WITHDRAWN (ProgramCoordinator)"
    roles: [ProgramCoordinator, AgencyReviewer]
    code: 200
    input: [to_status, "info_request_note?"]
    output: Referral
    side_effects: ["SUBMITTED cascades the case to REFERRED, moots PROPOSED rounds with AUDIT notes"]

  - method: GET
    path: "/reemployment/cases/{id}/referrals"
    description: "Referrals of a case"
    roles: [ServiceMember, Employer, Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: "Referral[]"
    side_effects: []

  - method: POST
    path: "/reemployment/statements-of-support"
    description: "Employer pledges a statement of support"
    roles: [Employer, ProgramCoordinator]
    code: 201
    input: [employer_id, signer_name, signer_title, "term_months?"]
    output: StatementOfSupport
    side_effects: ["status = PLEDGED"]

  - method: POST
    path: "/reemployment/statements-of-support/{id}/state"
    description: "Statement lifecycle: SIGNED (sign/renew), REVOKED (coordinator)"
    roles: [Employer, ProgramCoordinator]
    code: 200
    input: [to_status]
    output: StatementOfSupport
    side_effects: ["signing stamps signed_on and expires_on"]

  - method: GET
    path: "/reemployment/employers/{id}/statements-of-support"
    description: "Statements of support of an employer; lazy lapse applied"
    roles: [Employer, Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: "StatementOfSupport[]"
    side_effects: ["lazy_expiry may flip SIGNED -> LAPSED"]

  - method: POST
    path: "/reemployment/recognition-awards"
    description: "Nominate an employer for recognition (ombudsman nominators must have been the assignee on at least one RESOLVED_INFORMAL case for this employer, else ERR_NOMINATION_NOT_QUALIFIED)"
    roles: [Ombudsman, ProgramCoordinator]
    code: 201
    input: [employer_id, tier, rationale]
    output: RecognitionAward
    side_effects: ["status = NOMINATED"]

  - method: POST
    path: "/reemployment/recognition-awards/{id}/state"
    description: "Award lifecycle: VETTED (score snapshot), CONFERRED, DECLINED"
    roles: [ProgramCoordinator]
    code: 200
    input: [to_status]
    output: RecognitionAward
    side_effects: ["vetting stores score_base/tier_qualified/score_bonus/score_final; conferral recomputes employer.recognition_tier"]

  - method: GET
    path: "/reemployment/employers/{id}/recognition-awards"
    description: "Awards of an employer"
    roles: [Employer, Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: "RecognitionAward[]"
    side_effects: []

  - method: POST
    path: "/reemployment/outreach-events"
    description: "Schedule an outreach event; venue double-booking with a 60-minute buffer is rejected"
    roles: [ProgramCoordinator]
    code: 201
    input: [title, venue, starts_at, ends_at, topic]
    output: OutreachEvent
    side_effects: ["status = PLANNED"]

  - method: POST
    path: "/reemployment/outreach-events/{id}/state"
    description: "Event lifecycle: OPEN, CONCLUDED (only at/after ends_at), CANCELLED"
    roles: [ProgramCoordinator]
    code: 200
    input: [to_status]
    output: OutreachEvent
    side_effects: ["CANCELLED removes the event from the venue overlap set"]

  - method: POST
    path: "/reemployment/training-records"
    description: "Record a completed training module; proctor_id is stamped from the acting coordinator's X-User-ID"
    roles: [ProgramCoordinator]
    code: 201
    input: [ombudsman_id, module_code, hours, exam_score, completed_on]
    output: TrainingRecord
    side_effects: []

  - method: GET
    path: "/reemployment/ombudsmen/{id}/training-records"
    description: "Training records of an ombudsman"
    roles: [Ombudsman, ProgramCoordinator]
    code: 200
    input: []
    output: "TrainingRecord[]"
    side_effects: []

  - method: GET
    path: "/reemployment/reports/sector-trends"
    description: "Computed trend report per sector over a half-open created_at window: totals, repeat employers, top issue type"
    roles: [ProgramCoordinator]
    code: 200
    input: [sector, period_start, period_end]
    output: { sector: "string", period_start: "datetime", period_end: "datetime", total_cases: "integer", repeat_employer_count: "integer", resolved_count: "integer", top_issue_type: "string or null" }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role; missing X-User-ID for non-Anonymous roles" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list, or transition-level actor rule violated (e.g. AgencyReviewer attempting SUBMITTED)" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed actor touches a row it does not own (member/employer/assigned-ombudsman mismatch with X-User-ID)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown enum member, end not strictly after start, AUDIT note_type on input, malformed body" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "No ServiceMember with the given id" }
  - { id: ERR_EMPLOYER_NOT_FOUND, http: 404, condition: "No Employer with the given id" }
  - { id: ERR_OMBUDSMAN_NOT_FOUND, http: 404, condition: "No Ombudsman with the given id" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "No ReemploymentCase with the given id" }
  - { id: ERR_ROUND_NOT_FOUND, http: 404, condition: "No MediationRound with the given id" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "No Referral with the given id" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "No OutreachEvent with the given id" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "No StatementOfSupport with the given id" }
  - { id: ERR_AWARD_NOT_FOUND, http: 404, condition: "No RecognitionAward with the given id" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the requested transition exists (includes concluding an event before ends_at and duplicate BenefitAssessment)" }
  - { id: ERR_ROUND_NOT_OPEN, http: 409, condition: "Respond attempted on a MediationRound already in a terminal status" }
  - { id: ERR_OMBUDSMAN_NOT_CERTIFIED, http: 409, condition: "Assign target ombudsman is not currently CERTIFIED (after lazy expiry)" }
  - { id: ERR_CONFLICT_OF_INTEREST, http: 409, condition: "Ombudsman's employer_affiliation_id equals the case's employer_id (neutrality obligation)" }
  - { id: ERR_CASELOAD_FULL, http: 409, condition: "Ombudsman.active_caseload >= 4 (MAX_ACTIVE_CASELOAD); exactly 4 blocks" }
  - { id: ERR_ROUND_ALREADY_OPEN, http: 409, condition: "The case already has a MediationRound in PROPOSED" }
  - { id: ERR_DOCUMENTATION_INCOMPLETE, http: 409, condition: "ACCEPT response blocked: documentation_completeness predicate false" }
  - { id: ERR_NO_EXHAUSTED_ROUND, http: 409, condition: "Escalation requires at least one DECLINED or EXPIRED round on the case" }
  - { id: ERR_AWARD_ELIGIBILITY_UNMET, http: 409, condition: "Vetting without a SIGNED statement, below the tier's resolved-case gate, or score_base below every tier gate" }
  - { id: ERR_NOMINATION_NOT_QUALIFIED, http: 409, condition: "Ombudsman nominator was never the assignee on a RESOLVED_INFORMAL case for this employer" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version does not equal the case's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Certifying coordinator proctored at least one of this ombudsman's TrainingRecords" }
  - { id: ERR_RESPONSE_DEADLINE_PASSED, http: 422, condition: "Respond attempted when logical clock > response_deadline on a still-PROPOSED round (round flips EXPIRED, case back to IN_MEDIATION)" }
  - { id: ERR_REFERRAL_WINDOW_PASSED, http: 422, condition: "First submission attempted when logical clock > case.escalated_at + 30 days" }
  - { id: ERR_REOPEN_WINDOW_PASSED, http: 422, condition: "Reopen of CLOSED_UNRESOLVED attempted when logical clock > closed_at + 60 days" }
  - { id: ERR_SERVICE_PERIOD_OVERLAP, http: 422, condition: "Half-open [start_date, end_date) interval intersects another period of the same member (any employer); adjacency end == start is allowed; ongoing periods extend to infinity" }
  - { id: ERR_VENUE_DOUBLE_BOOKED, http: 422, condition: "Same venue, closed-interval overlap including a 60-minute teardown buffer after each event; CANCELLED events excluded" }
  - { id: ERR_CERTIFICATION_REQUIREMENTS_UNMET, http: 422, condition: "Core module / exam >= 80 / hours threshold for certify or recertify not met" }
  - { id: ERR_NO_COMPLETED_SERVICE_PERIOD, http: 422, condition: "Analysis or assessment requested but no completed ServicePeriod exists for the (member, employer) pair" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated self-registration caller"
    identity: opaque
    exclusive_operations:
      - "POST /reemployment/members"
      - "POST /reemployment/ombudsmen"
    shared_operations: []

  - name: ServiceMember
    description: "Guard/Reserve member filing and tracking own cases; withdraws and reopens own cases; responds to rounds addressed to MEMBER"
    identity: "entity_backed:ServiceMember"
    exclusive_operations:
      - "POST /reemployment/cases"
    shared_operations:
      - "GET /reemployment/members/{id} (self)"
      - "POST /reemployment/service-periods (own member_id)"
      - "GET /reemployment/members/{id}/service-periods (self)"
      - "GET /reemployment/cases/{id} (own)"
      - "POST /reemployment/cases/{id}/state (own: CLOSED_WITHDRAWN, reopen to TRIAGE)"
      - "POST /reemployment/mediation-rounds/{id}/respond (own case, addressed_to MEMBER)"
      - "GET sub-resource reads of own cases (rounds, analyses, benefit-assessments, referrals)"

  - name: Employer
    description: "Employer representative; signs statements of support, responds to rounds addressed to EMPLOYER"
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /reemployment/statements-of-support (own employer_id)"
    shared_operations:
      - "GET /reemployment/employers/{id} (own)"
      - "POST /reemployment/statements-of-support/{id}/state (own: SIGNED)"
      - "POST /reemployment/mediation-rounds/{id}/respond (own case, addressed_to EMPLOYER)"
      - "GET sub-resource reads of own cases and own employer aggregates"

  - name: Ombudsman
    description: "Certified volunteer neutral; mediates assigned cases, documents them, drafts referrals, nominates employers"
    identity: "entity_backed:Ombudsman"
    exclusive_operations:
      - "POST /reemployment/mediation-rounds (assigned case)"
      - "POST /reemployment/referrals (assigned case)"
    shared_operations:
      - "POST /reemployment/cases/{id}/state (assigned: ESCALATION_PENDING, CLOSED_UNRESOLVED)"
      - "POST /reemployment/cases/{id}/eligibility-analysis (assigned)"
      - "POST /reemployment/benefit-assessments (assigned)"
      - "POST /reemployment/case-notes (assigned)"
      - "POST /reemployment/recognition-awards (qualified nominator)"
      - "GET /reemployment/cases and case sub-resources"
      - "GET /reemployment/ombudsmen/{id} (self), GET training-records (self)"

  - name: ProgramCoordinator
    description: "ESGR staff; triages, assigns (OCC), certifies ombudsmen, submits referrals, vets awards, runs outreach and trend reports; sets the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /reemployment/employers"
      - "POST /reemployment/cases/{id}/assign"
      - "POST /reemployment/ombudsmen/{id}/state"
      - "POST /reemployment/outreach-events and their state"
      - "POST /reemployment/training-records"
      - "GET /reemployment/reports/sector-trends"
      - "POST /reemployment/_clock/set_current_utc"
      - "Referral SUBMITTED / WITHDRAWN; award VETTED / CONFERRED / DECLINED"
    shared_operations:
      - "GET reads across entities"
      - "POST /reemployment/cases/{id}/state (INTAKE -> TRIAGE)"
      - "POST /reemployment/cases/{id}/eligibility-analysis, POST /reemployment/benefit-assessments, POST /reemployment/case-notes"
      - "POST /reemployment/service-periods (any member)"

  - name: AgencyReviewer
    description: "Federal agency counterpart; acknowledges or returns submitted referrals"
    identity: opaque
    exclusive_operations:
      - "Referral ACKNOWLEDGED and RETURNED_FOR_INFO transitions"
    shared_operations: []
