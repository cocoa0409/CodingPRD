            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-NL3", product_type: "DEBIT", network: "MASTERCARD" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 40000, merchant_id: "M-NL3", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t1: "$.data.id" } }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 40000, merchant_id: "M-NL3", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t2: "$.data.id" } }
            - { call: "POST /fraudops/chargeback-cases", payload: { auth_transaction_id: "${t1}", reason_code: "4855", provisional_credit_cents: 15000 }, as: RecoverySpecialist, captures: { cb1: "$.data.id" } }
            - { call: "POST /fraudops/chargeback-cases/${cb1}/post-provisional-credit", as: RecoverySpecialist }
            - { call: "POST /fraudops/chargeback-cases/${cb1}/representment", as: RecoverySpecialist }
            - { call: "POST /fraudops/chargeback-cases", payload: { auth_transaction_id: "${t2}", reason_code: "4855", provisional_credit_cents: 15000 }, as: RecoverySpecialist, captures: { cb2: "$.data.id" } }
            - { call: "POST /fraudops/chargeback-cases/${cb2}/post-provisional-credit", as: RecoverySpecialist }
          trigger:
            - { call: "POST /fraudops/chargeback-cases/${cb1}/resolve", payload: { outcome: "WON" }, as: RecoverySpecialist }
            - { call: "POST /fraudops/chargeback-cases/${cb2}/resolve", payload: { outcome: "LOST" }, as: RecoverySpecialist }
            - { call: "GET /fraudops/accounts/${acct}", as: FraudOpsManager }
          assert:
            - "ChargebackCase.${cb1}.cb_status == RESOLVED_WON (credit retained)"
            - "ChargebackCase.${cb2}.cb_status == RESOLVED_LOST (credit reversed)"
            - "Account.${acct}.credit_balance_cents == 15000 (15000 kept from cb1; 30000 - 15000 reversed from cb2)"

  - rule_id: transitive_cascade
    instances:
      - name: compromised_event_confirm_depth4_cascade
        grounds:
          - state_machines.CompromisedCardEvent.RECEIVED_to_CONFIRMED
          - state_machines.Card.CLEAN_to_COMPROMISED
          - calculations.exposure_window_match
          - calculations.account_risk_tier
          - calculations.alert_priority
        distinguishing_aspect: |
          Trigger = POST /compromised-card-events/{id}/confirm. Causal chain of depth 4 where each
          link is caused by the previous one: confirm -> card fraud_flag COMPROMISED -> owning
          account risk_tier HIGH -> that account's pre-existing open alert escalated
          (25 -> 225). A control card whose only transaction lies outside the half-open window
          stays CLEAN, proving the input-set boundary.
        test_recipe:
          setup:
            - "Three accounts A1/A2/A3 with cards C1/C2/C3; GLOBAL ruleset active"
            - "A1 has one pre-existing MANUAL open alert M1 (priority 25: tier LOW + band 25)"
