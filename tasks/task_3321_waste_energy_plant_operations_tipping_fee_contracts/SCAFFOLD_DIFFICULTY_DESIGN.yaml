scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: tipping_fee_projection_diverges_after_amendment
        grounds:
          - calculations.compute_tipping_fee
          - state_machines.WasteSupplyAgreement.ACTIVE_to_ACTIVE
          - entities.WasteDelivery.fields.projected_fee_cents
        distinguishing_aspect: |
          Dual-variant on the WasteDelivery/commercial domain: the same SCHEDULED
          delivery shows projected_fee_cents computed at the amended rate (9000)
          while a control delivery accepted before the amendment persists
          tipping_fee_cents computed at the original rate (8000) — same entity
          domain, two variants, different cents for identical tonnes.
        test_recipe:
          setup:
            - "Municipality M1 (STANDARD), WSA A1 ACTIVE term 2026-01-01..2027-01-01 rate 8000 c/t"
            - "Delivery D1 (10 t) RECEIVED and ACCEPTED at rate 8000 -> tipping_fee_cents 80000"
            - "Delivery D2 (10 t) still SCHEDULED"
            - "Amendment AM (rate 9000) applied to A1 -> A1.tipping_fee_per_tonne_cents == 9000"
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 1000, tipping_fee_per_tonne_cents: 8000 }
              as: ContractsManager
              captures: { a1_id: $.data.id, a1_v: $.data.version }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsManager
              captures: { a1_v2: $.data.version }
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-D1", tonnes: 10, heating_value_mj_per_kg: 10, delivered_at: "2026-09-02T08:00:00Z" }
              as: PlantOperator
              captures: { d1_id: $.data.id }
            - call: "POST /wte/waste-deliveries/${d1_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/waste-deliveries/${d1_id}/accept"
              payload: { expected_agreement_version: "${a1_v2}" }
              as: PlantOperator
              captures: { d1_fee: $.data.tipping_fee_cents }
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-D2", tonnes: 10, heating_value_mj_per_kg: 10, delivered_at: "2026-09-03T08:00:00Z" }
              as: PlantOperator
              captures: { d2_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 1000, tipping_fee_per_tonne_cents: 9000, amendment_of_agreement_id: "${a1_id}", expected_base_agreement_version: "${a1_v2}" }
              as: ContractsManager
          trigger:
            - call: "GET /wte/waste-deliveries/${d2_id}"
              as: Regulator
              captures: { d2_proj: $.data.projected_fee_cents }
          assert:
            - "WasteDelivery.${d1_id}.tipping_fee_cents == 80000"
            - "WasteDelivery.${d2_id}.projected_fee_cents == 90000"
            - "WasteDelivery.${d2_id}.tipping_fee_cents == null"
            - "WasteSupplyAgreement.${a1_id}.tipping_fee_per_tonne_cents == 9000"

      - name: energy_billing_contracted_vs_merchant
        grounds:
          - calculations.compute_energy_billing
          - entities.EnergyDelivery.fields.billed_amount_cents
        distinguishing_aspect: |
          Dual-variant on the EnergyDelivery/billing domain (different domain from
          tipping fees): identical delivered_mwh (500) bills 3750000 cents under a
          PPA-kind agreement's contracted rate and 3450000 cents under a
          MERCHANT-kind agreement's price snapshot — variant is selected by the
          agreement's kind, not by request flags.
        test_recipe:
          setup:
            - "PPA-kind agreement P1 ACTIVE: energy rate 7500 c/MWh, capacity 200000 c/MW-month, contracted 60 MW, term 2026-01-01..2027-01-01"
            - "MERCHANT-kind agreement P2 ACTIVE: energy rate 7000 (unused), capacity 0, contracted 10 MW, same term"
          setup_api_calls:
            - call: "POST /wte/power-purchase-agreements"
              payload: { counterparty_name: "GridCo", kind: PPA, energy_rate_cents_per_mwh: 7500, capacity_payment_cents_per_mw_month: 200000, contracted_mw: 60, term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: EnergyTrader
              captures: { ppa1_id: $.data.id }
            - call: "POST /wte/power-purchase-agreements/${ppa1_id}/activate"
              payload: {}
              as: EnergyTrader
            - call: "POST /wte/power-purchase-agreements"
              payload: { counterparty_name: "SpotMart", kind: MERCHANT, energy_rate_cents_per_mwh: 7000, capacity_payment_cents_per_mw_month: 0, contracted_mw: 10, term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: EnergyTrader
              captures: { ppa2_id: $.data.id }
            - call: "POST /wte/power-purchase-agreements/${ppa2_id}/activate"
              payload: {}
              as: EnergyTrader
          trigger:
            - call: "POST /wte/energy-deliveries"
              payload: { ppa_id: "${ppa1_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-11T00:00:00Z", delivered_mwh: 500 }
              as: EnergyTrader
              captures: { ed1_billed: $.data.billed_amount_cents, ed1_id: $.data.id }
            - call: "POST /wte/energy-deliveries"
              payload: { ppa_id: "${ppa2_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-11T00:00:00Z", delivered_mwh: 500, merchant_price_cents_per_mwh: 6900 }
              as: EnergyTrader
              captures: { ed2_billed: $.data.billed_amount_cents, ed2_id: $.data.id }
          assert:
            - "EnergyDelivery.${ed1_id}.billed_amount_cents == 3750000"
            - "EnergyDelivery.${ed2_id}.billed_amount_cents == 3450000"
            - "EnergyDelivery.${ed2_id}.capacity_payment_cents == 0"
            - "3750000 != 3450000 (variant divergence on identical delivered_mwh)"
  - rule_id: combinatorial_formula
    instances:
      - name: capacity_payment_derated_proration
        grounds:
          - calculations.compute_capacity_payment
          - calculations.compute_thermal_input
        distinguishing_aspect: |
          Mode (a) — multi-input non-linear formula: the capacity payment nests
          min(contracted_mw, available_mw) with a calendar-month period fraction
          (10 of 31 days) and a boiler-state-conditioned available_mw (derated
          boiler counts at derated_capacity_mw), so each of the three inputs can
          independently clamp the result.
        test_recipe:
          setup:
            - "Boiler B1 ONLINE 50 MW; Boiler B2 DERATED to 30 MW (of 50) -> available_mw = 80"
            - "PPA P1 ACTIVE: contracted 60 MW, capacity rate 200000 c/MW-month"
            - "Delivery period 2026-10-01..2026-10-11 (10 of 31 October days) -> fraction 0.322581"
          setup_api_calls:
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-B", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
              captures: { b2_id: $.data.id }
            - call: "POST /wte/boilers/${b2_id}/derate"
              payload: { derated_capacity_mw: 30 }
              as: PlantOperator
            - call: "POST /wte/power-purchase-agreements"
              payload: { counterparty_name: "GridCo", kind: PPA, energy_rate_cents_per_mwh: 7500, capacity_payment_cents_per_mw_month: 200000, contracted_mw: 60, term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: EnergyTrader
              captures: { ppa_id: $.data.id }
            - call: "POST /wte/power-purchase-agreements/${ppa_id}/activate"
              payload: {}
              as: EnergyTrader
          trigger:
            - call: "POST /wte/energy-deliveries"
              payload: { ppa_id: "${ppa_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-11T00:00:00Z", delivered_mwh: 500 }
              as: EnergyTrader
              captures: { ed_id: $.data.id, cap_cents: $.data.capacity_payment_cents }
          assert:
            - "EnergyDelivery.${ed_id}.capacity_payment_cents == 3870972 (min(60,80) * 200000 * 0.322581, round_half_up)"
            - "EnergyDelivery.${ed_id}.billed_amount_cents == 3750000"

      - name: metals_settlement_per_line_rounding_order
        grounds:
          - calculations.compute_metals_settlement
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: recovered tonnes are rounded
          to 3 decimals per line BEFORE multiplying by price and each revenue
          line is rounded to whole cents before summing; the forbidden
          sum-then-round order yields different cents, so the instance pins
          gross 540000, fee 250000, net 290000 as the only correct result.
        test_recipe:
          setup:
            - "MetalsRecoveryContract C1 ACTIVE: ferrous 10%, non-ferrous 2%, fee 2500 c/t ash"
          setup_api_calls:
            - call: "POST /wte/metals-recovery-contracts"
              payload: { processor_name: "FerroProc", ferrous_recovery_pct: 0.10, nonferrous_recovery_pct: 0.02, processing_fee_cents_per_tonne: 2500 }
              as: ContractsManager
              captures: { mrc_id: $.data.id }
          trigger:
            - call: "POST /wte/metals-recovery-batches"
              payload: { contract_id: "${mrc_id}", ash_input_tonnes: 100, ferrous_price_cents_per_tonne: 30000, nonferrous_price_cents_per_tonne: 120000 }
              as: PlantOperator
              captures: { mrb_id: $.data.id }
          assert:
            - "MetalsRecoveryBatch.${mrb_id}.ferrous_tonnes == 10"
            - "MetalsRecoveryBatch.${mrb_id}.nonferrous_tonnes == 2"
            - "MetalsRecoveryBatch.${mrb_id}.gross_revenue_cents == 540000"
            - "MetalsRecoveryBatch.${mrb_id}.processing_fee_cents == 250000"
            - "MetalsRecoveryBatch.${mrb_id}.net_settlement_cents == 290000"

      - name: steam_output_pinned_evaluation_order
        grounds:
          - calculations.compute_thermal_input
          - calculations.compute_steam_output
          - entities.DailyThroughputReport.fields.capacity_check
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          capacity_check and steam_output_tph both derive from thermal_input_mw
          computed in step 1; the report must evaluate thermal input, then the
          capacity check, then steam capped by the steam cap — a
          wrong-order implementation that caps thermal before the check (or
          recomputes it after capping) produces a different capacity_check.
        test_recipe:
          setup:
            - "Boilers B1, B2 ONLINE 50 MW / 60 tph each -> effective capacity 100 MW, steam cap 120 tph"
          setup_api_calls:
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-B", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
          trigger:
            - call: "POST /wte/daily-throughput-reports"
              payload: { report_date: "2026-09-10", waste_processed_tonnes: 2400, avg_heating_value_mj_per_kg: 6.0, operating_hours: 24 }
              as: PlantOperator
              captures: { rpt_id: $.data.id }
          assert:
            - "DailyThroughputReport.${rpt_id}.thermal_input_mw == 166.667"
            - "DailyThroughputReport.${rpt_id}.capacity_check == EXCEEDS"
            - "DailyThroughputReport.${rpt_id}.steam_output_tph == 53.333"
            - "DailyThroughputReport.${rpt_id}.ash_generated_tonnes == 600"
            - "DailyThroughputReport.${rpt_id}.status == DRAFT"
  - rule_id: non_linear_state_machine
    instances:
      - name: metals_batch_dispute_resolve_cycle_recomputes
        grounds:
          - state_machines.MetalsRecoveryBatch
        distinguishing_aspect: |
          Cyclic machine on MetalsRecoveryBatch (RECORDED -> DISPUTED ->
          RECORDED loop, settle reachable only from RECORDED): the loop back
          recomputes settlement fields from current contract rates, so a batch
          that cycles is not a no-op.
        test_recipe:
          setup:
            - "Contract C1 ACTIVE (fer 10%, nonfer 2%, fee 2500); batch B RECORDED with net 290000"
          setup_api_calls:
            - call: "POST /wte/metals-recovery-contracts"
              payload: { processor_name: "FerroProc", ferrous_recovery_pct: 0.10, nonferrous_recovery_pct: 0.02, processing_fee_cents_per_tonne: 2500 }
              as: ContractsManager
              captures: { mrc_id: $.data.id }
            - call: "POST /wte/metals-recovery-batches"
              payload: { contract_id: "${mrc_id}", ash_input_tonnes: 100, ferrous_price_cents_per_tonne: 30000, nonferrous_price_cents_per_tonne: 120000 }
              as: PlantOperator
              captures: { mrb_id: $.data.id }
          trigger:
            - call: "POST /wte/metals-recovery-batches/${mrb_id}/dispute"
              payload: {}
              as: ContractsManager
            - call: "POST /wte/metals-recovery-batches/${mrb_id}/settle"
              payload: {}
              as: ContractsManager
              captures: { settle_err: $.data.error_id }
            - call: "POST /wte/metals-recovery-batches/${mrb_id}/resolve"
              payload: {}
              as: ContractsManager
            - call: "POST /wte/metals-recovery-batches/${mrb_id}/settle"
              payload: {}
              as: ContractsManager
          assert:
            - "settle attempt while DISPUTED rejected with ERR_INVALID_STATE (409)"
            - "MetalsRecoveryBatch.${mrb_id}.status == SETTLED after the full cycle"
            - "MetalsRecoveryBatch.${mrb_id}.net_settlement_cents == 290000 (recomputed, unchanged rates)"
            - "MetalsRecoveryBatch.${mrb_id}.version == 5 (create + 4 transitions)"

      - name: boiler_derate_restore_branching_vs_outage_path
        grounds:
          - state_machines.Boiler
        distinguishing_aspect: |
          Branching machine on Boiler (different entity from the batch cycle):
          ONLINE forks to DERATED (reversible via restore) or OFFLINE
          (irreversible), and OUTAGE is reachable only via an OutageWindow side
          effect, never via a direct boiler endpoint.
        test_recipe:
          setup:
            - "Boiler B1 ONLINE 50 MW"
          setup_api_calls:
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /wte/boilers/${b1_id}/derate"
              payload: { derated_capacity_mw: 30 }
              as: PlantOperator
            - call: "POST /wte/boilers/${b1_id}/restore"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/boilers/${b1_id}/derate"
              payload: { derated_capacity_mw: 25 }
              as: PlantOperator
            - call: "POST /wte/boilers/${b1_id}/decommission"
              payload: {}
              as: PlantOperator
              captures: { decom_err: $.data.error_id }
            - call: "POST /wte/boilers/${b1_id}/restore"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/boilers/${b1_id}/decommission"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/boilers/${b1_id}/derate"
              payload: { derated_capacity_mw: 10 }
              as: PlantOperator
              captures: { derate_err: $.data.error_id }
          assert:
            - "decommission while DERATED rejected with ERR_INVALID_STATE"
            - "after restore+derate(25)+restore+decommission: Boiler.${b1_id}.status == OFFLINE and derated_capacity_mw == null"
            - "derate while OFFLINE rejected with ERR_INVALID_STATE"
            - "Boiler.${b1_id}.version == 6"
  - rule_id: transitive_cascade
    instances:
      - name: outage_start_cascades_to_boiler_and_capacity_check
        grounds:
          - state_machines.OutageWindow.SCHEDULED_to_ACTIVE
          - calculations.compute_thermal_input
        distinguishing_aspect: |
          Depth-3 cascade triggered by OutageWindow start: outage ACTIVE ->
          boiler.status := OUTAGE (hop 2) -> effective boiler capacity drops out
          of the sum (hop 3) -> a report that was within capacity before the
          outage now computes capacity_check == EXCEEDS without any edit to the
          report itself.
        test_recipe:
          setup:
            - "Boiler B1 ONLINE 150 MW (sole boiler)"
            - "Report R1 DRAFT with thermal_input_mw exactly 150.000 (500 t, 9 MJ/kg, 30 h) and capacity_check OK"
            - "Outage O1 SCHEDULED on B1 (2026-09-05..2026-09-08) with approved plan (1 leg)"
          setup_api_calls:
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 150, max_steam_tph: 60 }
              as: PlantOperator
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /wte/daily-throughput-reports"
              payload: { report_date: "2026-09-04", waste_processed_tonnes: 500, avg_heating_value_mj_per_kg: 9.0, operating_hours: 30 }
              as: PlantOperator
              captures: { r1_id: $.data.id, r1_check_before: $.data.capacity_check }
            - call: "POST /wte/outage-windows"
              payload: { boiler_id: "${b1_id}", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-08T00:00:00Z", reason: "refractory repair", kind: PLANNED }
              as: PlantOperator
              captures: { o1_id: $.data.id }
            - call: "POST /wte/diversion-plans"
              payload: { outage_id: "${o1_id}", max_diversion_tpd: 200 }
              as: PlantOperator
              captures: { dp_id: $.data.id }
            - call: "POST /wte/diversion-plans/${dp_id}/legs"
              payload: { receiving_facility_name: "County Landfill 9", planned_tonnes: 400 }
              as: PlantOperator
            - call: "POST /wte/diversion-plans/${dp_id}/approve"
              payload: {}
              as: ContractsManager
          trigger:
            - call: "POST /wte/outage-windows/${o1_id}/start"
              payload: { expected_boiler_version: "${b1_v}" }
              as: PlantOperator
            - call: "PUT /wte/daily-throughput-reports/${r1_id}"
              payload: { waste_processed_tonnes: 500 }
              as: PlantOperator
              captures: { r1_check_after: $.data.capacity_check }
          assert:
            - "r1_check_before == OK"
            - "Boiler.${b1_id}.status == OUTAGE"
            - "r1_check_after == EXCEEDS (effective capacity is now 0)"
            - "finalize of ${r1_id} would be rejected with ERR_CAPACITY_EXCEEDED"

      - name: delivery_accept_cascades_to_settlement_base
        grounds:
          - state_machines.WasteDelivery.RECEIVED_to_ACCEPTED
          - calculations.compute_put_or_pay_settlement
        distinguishing_aspect: |
          Depth-3 cascade triggered by a different transition (WasteDelivery
          accept, not outage start): accept -> agreement
          .cumulative_delivered_tonnes grows (hop 2) -> the put-or-pay
          settlement run reads the grown base (hop 3) and the shortfall drops
          from 300 t / 2550000 cents to zero.
        test_recipe:
          setup:
            - "Municipality M1; WSA A1 ACTIVE 2026-01-01..2027-01-01, ANNUAL, guarantee 1000 t, rate 8500"
            - "700 t already ACCEPTED in September; delivery D1 (300 t) RECEIVED, delivered 2026-09-03"
            - "Boiler ONLINE so accepts are possible"
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 1000, tipping_fee_per_tonne_cents: 8500 }
              as: ContractsManager
              captures: { a1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsManager
              captures: { a1_v: $.data.version }
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-400", tonnes: 400, heating_value_mj_per_kg: 10, delivered_at: "2026-09-01T08:00:00Z" }
              as: PlantOperator
              captures: { da_id: $.data.id }
            - call: "POST /wte/waste-deliveries/${da_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/waste-deliveries/${da_id}/accept"
              payload: { expected_agreement_version: "${a1_v}" }
              as: PlantOperator
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-300", tonnes: 300, heating_value_mj_per_kg: 10, delivered_at: "2026-09-02T08:00:00Z" }
              as: PlantOperator
              captures: { db_id: $.data.id }
            - call: "POST /wte/waste-deliveries/${db_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/waste-deliveries/${db_id}/accept"
              payload: { expected_agreement_version: "${a1_v} + 1" }
              as: PlantOperator
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-FINAL", tonnes: 300, heating_value_mj_per_kg: 10, delivered_at: "2026-09-03T08:00:00Z" }
              as: PlantOperator
              captures: { d1_id: $.data.id }
            - call: "POST /wte/waste-deliveries/${d1_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/settlements/put-or-pay/run"
              payload: { agreement_id: "${a1_id}" }
              as: ContractsManager
              captures: { s1_short_t: $.data.shortfall_tonnes, s1_short_c: $.data.shortfall_cents }
          trigger:
            - call: "POST /wte/waste-deliveries/${d1_id}/accept"
              payload: { expected_agreement_version: "${a1_v} + 2" }
              as: PlantOperator
            - call: "POST /wte/settlements/put-or-pay/run"
              payload: { agreement_id: "${a1_id}" }
              as: ContractsManager
              captures: { s2_short_t: $.data.shortfall_tonnes, s2_short_c: $.data.shortfall_cents }
          assert:
            - "s1_short_t == 300 and s1_short_c == 2550000"
            - "s2_short_t == 0 and s2_short_c == 0 (same-period re-run supersedes)"
            - "WasteSupplyAgreement.${a1_id}.cumulative_delivered_tonnes == 1000"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_on_terminated_agreement_with_stale_version
        grounds:
          - validations[priority=6]
          - validations[priority=22]
        distinguishing_aspect: |
          Category pair state vs business_constraint: the request carries BOTH a
          stale expected_agreement_version (priority 22) AND an agreement whose
          state is TERMINATED (priority 6); the higher-priority state check must
          win and the response must be ERR_INVALID_STATE (409), not
          ERR_STALE_VERSION (412).
        test_recipe:
          setup:
            - "WSA A1 ACTIVE then TERMINATED (version advances to 3); delivery D1 RECEIVED before termination was impossible — instead D1 was created SCHEDULED, force-received via the pre-termination window"
            - "D1 is RECEIVED (received while A1 ACTIVE), A1 then TERMINATED; client still holds version 2"
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 1000, tipping_fee_per_tonne_cents: 8000 }
              as: ContractsManager
              captures: { a1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsManager
              captures: { a1_v2: $.data.version }
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-1", tonnes: 10, heating_value_mj_per_kg: 10, delivered_at: "2026-09-02T08:00:00Z" }
              as: PlantOperator
              captures: { d1_id: $.data.id }
            - call: "POST /wte/waste-deliveries/${d1_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/waste-supply-agreements/${a1_id}/terminate"
              payload: {}
              as: ContractsManager
          trigger:
            - call: "POST /wte/waste-deliveries/${d1_id}/accept"
              payload: { expected_agreement_version: "${a1_v2}" }
              as: PlantOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE with HTTP 409 (state priority 6 beats OCC priority 22)"
            - "WasteDelivery.${d1_id}.status still RECEIVED (no partial mutation)"

      - name: ash_complete_safety_gate_beats_capacity_and_occ
        grounds:
          - validations[priority=8]
          - validations[priority=19]
          - validations[priority=22]
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal (a different pair
          from state-vs-constraint): the completion request fails BOTH the
          failed-test safety gate (priority 8) and the landfill capacity check
          (priority 19) with a stale landfill version (22) also wrong; the
          safety error ERR_ASH_TEST_FAILED must win.
        test_recipe:
          setup:
            - "Landfill L1 ACTIVE remaining capacity 100 t, daily limit 50 t"
            - "Shipment S1 (200 t — exceeds remaining capacity) TEST_PENDING with one FAILED test"
            - "Client holds stale landfill version"
          setup_api_calls:
            - call: "POST /wte/landfills"
              payload: { name: "AshMonofill-1", permit_number: "P-100", remaining_capacity_tonnes: 100, daily_receipt_limit_tonnes: 50 }
              as: EnvironmentalOfficer
              captures: { l1_id: $.data.id, l1_v: $.data.version }
            - call: "POST /wte/ash-shipments"
              payload: { landfill_id: "${l1_id}", tonnes: 200, shipped_on: "2026-09-06", disposal_fee_cents_per_tonne: 4000 }
              as: EnvironmentalOfficer
              captures: { s1_id: $.data.id }
            - call: "POST /wte/ash-shipments/${s1_id}/submit-testing"
              payload: {}
              as: EnvironmentalOfficer
            - call: "POST /wte/ash-shipments/${s1_id}/tests"
              payload: { parameter: "TCLP-lead", measured_value: 5.5, limit_value: 5.0 }
              as: EnvironmentalOfficer
          trigger:
            - call: "POST /wte/ash-shipments/${s1_id}/complete"
              payload: { expected_landfill_version: "${l1_v} + 7" }
              as: EnvironmentalOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_ASH_TEST_FAILED with HTTP 422 (safety priority 8 beats fiscal priority 19 and OCC priority 22)"
            - "Landfill.${l1_id}.remaining_capacity_tonnes == 100 (unchanged)"
  - rule_id: boundary_precision_check
    instances:
      - name: capacity_check_equality_is_ok_and_one_unit_over_fails
        grounds:
          - calculations.compute_thermal_input
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Boundary on the thermal MW metric via the finalize endpoint: thermal
          input exactly equal to effective capacity (150.000 == 150) yields
          capacity_check OK and finalizes (<=, inclusive), while a report one
          step over (50.000 > 50 with a 50 MW boiler) yields EXCEEDS and is
          rejected — the >= vs > distinction flips the outcome.
        test_recipe:
          setup:
            - "Boiler B1 ONLINE 150 MW / 500 tph (steam cap non-binding)"
            - "Report R_EQ: 500 t @ 9 MJ/kg over 30 h -> thermal exactly 150.000 MW"
            - "Report R_OVER: 500 t @ 9 MJ/kg over 25 h -> thermal 180.000 MW"
          setup_api_calls:
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 150, max_steam_tph: 500 }
              as: PlantOperator
            - call: "POST /wte/daily-throughput-reports"
              payload: { report_date: "2026-09-11", waste_processed_tonnes: 500, avg_heating_value_mj_per_kg: 9.0, operating_hours: 30 }
              as: PlantOperator
              captures: { req_id: $.data.id }
            - call: "POST /wte/daily-throughput-reports"
              payload: { report_date: "2026-09-12", waste_processed_tonnes: 500, avg_heating_value_mj_per_kg: 9.0, operating_hours: 25 }
              as: PlantOperator
              captures: { rover_id: $.data.id }
          trigger:
            - call: "POST /wte/daily-throughput-reports/${req_id}/finalize"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/daily-throughput-reports/${rover_id}/finalize"
              payload: {}
              as: PlantOperator
              captures: { over_err: $.data.error_id }
          assert:
            - "DailyThroughputReport.${req_id}.thermal_input_mw == 150.000 and capacity_check == OK and status == FINALIZED"
            - "DailyThroughputReport.${rover_id}.thermal_input_mw == 180.000 and capacity_check == EXCEEDS"
            - "over_err == ERR_CAPACITY_EXCEEDED (422); R_OVER remains DRAFT"

      - name: emissions_limit_equality_is_not_a_breach
        grounds:
          - calculations.compute_emissions_average
          - entities.EmissionsReading.fields.exceedance
        distinguishing_aspect: |
          Boundary on a different metric (pollutant reading value) via a
          different endpoint (POST /wte/emissions-readings): a reading exactly
          AT the hourly limit (200 == 200) with the rolling daily average
          (133.333333) below the daily limit (150) is NOT an exceedance —
          strictly-greater comparison, so equality passes.
        test_recipe:
          setup:
            - "ACTIVE permit for NOx: hourly_limit 200, daily_limit 150, window 24h"
            - "Two prior readings of 100 each at 06:00 and 12:00 on 2026-09-02"
          setup_api_calls:
            - call: "POST /wte/emissions-permits"
              payload: { pollutant: "NOx", hourly_limit: 200, daily_limit: 150, rolling_avg_window_hours: 24 }
              as: EnvironmentalOfficer
              captures: { ep_id: $.data.id }
            - call: "POST /wte/emissions-readings"
              payload: { permit_id: "${ep_id}", value: 100, measured_at: "2026-09-02T06:00:00Z" }
              as: EnvironmentalOfficer
            - call: "POST /wte/emissions-readings"
              payload: { permit_id: "${ep_id}", value: 100, measured_at: "2026-09-02T12:00:00Z" }
              as: EnvironmentalOfficer
          trigger:
            - call: "POST /wte/emissions-readings"
              payload: { permit_id: "${ep_id}", value: 200, measured_at: "2026-09-02T18:00:00Z" }
              as: EnvironmentalOfficer
              captures: { er_id: $.data.id, er_exc: $.data.exceedance }
          assert:
            - "EmissionsReading.${er_id}.exceedance == false (200 not > 200; rolling avg 133.333333 not > 150)"

      - name: empty_test_set_blocks_ash_completion
        grounds:
          - validations[priority=9]
          - errors[ERR_TEST_REQUIRED]
        distinguishing_aspect: |
          Empty-collection boundary (a zero-COUNT edge, different metric class
          from the numeric thresholds above) via the complete endpoint: zero
          AshTests recorded blocks completion with ERR_TEST_REQUIRED; recording
          exactly one passing test flips the same request to success — the
          boundary sits between 0 and 1 elements.
        test_recipe:
          setup:
            - "Landfill L1 ACTIVE capacity 1000 t, daily limit 500 t; shipment S1 10 t TEST_PENDING with NO tests"
          setup_api_calls:
            - call: "POST /wte/landfills"
              payload: { name: "AshMonofill-1", permit_number: "P-100", remaining_capacity_tonnes: 1000, daily_receipt_limit_tonnes: 500 }
              as: EnvironmentalOfficer
              captures: { l1_id: $.data.id, l1_v: $.data.version }
            - call: "POST /wte/ash-shipments"
              payload: { landfill_id: "${l1_id}", tonnes: 10, shipped_on: "2026-09-06", disposal_fee_cents_per_tonne: 4000 }
              as: EnvironmentalOfficer
              captures: { s1_id: $.data.id }
            - call: "POST /wte/ash-shipments/${s1_id}/submit-testing"
              payload: {}
              as: EnvironmentalOfficer
          trigger:
            - call: "POST /wte/ash-shipments/${s1_id}/complete"
              payload: { expected_landfill_version: "${l1_v}" }
              as: EnvironmentalOfficer
              captures: { empty_err: $.data.error_id }
            - call: "POST /wte/ash-shipments/${s1_id}/tests"
              payload: { parameter: "TCLP-lead", measured_value: 4.0, limit_value: 5.0 }
              as: EnvironmentalOfficer
            - call: "POST /wte/ash-shipments/${s1_id}/complete"
              payload: { expected_landfill_version: "${l1_v}" }
              as: EnvironmentalOfficer
          assert:
            - "empty_err == ERR_TEST_REQUIRED (422) at zero tests"
            - "after one passing test: AshShipment.${s1_id}.status == DISPOSED and Landfill.${l1_id}.remaining_capacity_tonnes == 990"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: delivery_accept_blocked_when_all_boilers_down
        grounds:
          - state_machines.WasteDelivery.RECEIVED_to_ACCEPTED
          - validations[priority=11]
        distinguishing_aspect: |
          WasteDelivery -> Boiler pair: the delivery's own state (RECEIVED) and
          agreement state (ACTIVE) are both fine, yet acceptance is gated on
          the aggregate state of a DIFFERENT entity set (boilers); with the
          only boiler in OUTAGE the accept is rejected
          ERR_NO_BOILER_AVAILABLE, and completing the outage unblocks the very
          same request.
        test_recipe:
          setup:
            - "Boiler B1 ONLINE 150 MW; WSA A1 ACTIVE; delivery D1 RECEIVED"
            - "Outage O1 on B1 with approved plan; O1 started -> B1 OUTAGE"
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 150, max_steam_tph: 500 }
              as: PlantOperator
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 1000, tipping_fee_per_tonne_cents: 8000 }
              as: ContractsManager
              captures: { a1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsManager
              captures: { a1_v: $.data.version }
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-1", tonnes: 10, heating_value_mj_per_kg: 10, delivered_at: "2026-09-02T08:00:00Z" }
              as: PlantOperator
              captures: { d1_id: $.data.id }
            - call: "POST /wte/waste-deliveries/${d1_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/outage-windows"
              payload: { boiler_id: "${b1_id}", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-08T00:00:00Z", reason: "tube inspection", kind: PLANNED }
              as: PlantOperator
              captures: { o1_id: $.data.id }
            - call: "POST /wte/diversion-plans"
              payload: { outage_id: "${o1_id}", max_diversion_tpd: 200 }
              as: PlantOperator
              captures: { dp_id: $.data.id }
            - call: "POST /wte/diversion-plans/${dp_id}/legs"
              payload: { receiving_facility_name: "County Landfill 9", planned_tonnes: 400 }
              as: PlantOperator
            - call: "POST /wte/diversion-plans/${dp_id}/approve"
              payload: {}
              as: ContractsManager
            - call: "POST /wte/outage-windows/${o1_id}/start"
              payload: { expected_boiler_version: "${b1_v}" }
              as: PlantOperator
          trigger:
            - call: "POST /wte/waste-deliveries/${d1_id}/accept"
              payload: { expected_agreement_version: "${a1_v}" }
              as: PlantOperator
              captures: { blocked_err: $.data.error_id }
            - call: "POST /wte/outage-windows/${o1_id}/complete"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/waste-deliveries/${d1_id}/accept"
              payload: { expected_agreement_version: "${a1_v}" }
              as: PlantOperator
          assert:
            - "blocked_err == ERR_NO_BOILER_AVAILABLE (422) while B1 in OUTAGE"
            - "after outage complete (B1 ONLINE): WasteDelivery.${d1_id}.status == ACCEPTED and tipping_fee_cents == 80000"

      - name: batch_settle_blocked_when_contract_suspended
        grounds:
          - state_machines.MetalsRecoveryBatch.RECORDED_to_SETTLED
          - validations[priority=6]
        distinguishing_aspect: |
          MetalsRecoveryBatch -> MetalsRecoveryContract pair (different pair
          from delivery->boiler): a RECORDED batch cannot settle while its
          contract is SUSPENDED even though the batch itself is in a valid
          from-state; the gate is the parent's lifecycle, not the child's.
        test_recipe:
          setup:
            - "Contract C1 ACTIVE; batch B RECORDED; C1 then SUSPENDED"
          setup_api_calls:
            - call: "POST /wte/metals-recovery-contracts"
              payload: { processor_name: "FerroProc", ferrous_recovery_pct: 0.10, nonferrous_recovery_pct: 0.02, processing_fee_cents_per_tonne: 2500 }
              as: ContractsManager
              captures: { mrc_id: $.data.id }
            - call: "POST /wte/metals-recovery-batches"
              payload: { contract_id: "${mrc_id}", ash_input_tonnes: 100, ferrous_price_cents_per_tonne: 30000, nonferrous_price_cents_per_tonne: 120000 }
              as: PlantOperator
              captures: { mrb_id: $.data.id }
            - call: "POST /wte/metals-recovery-contracts/${mrc_id}/suspend"
              payload: {}
              as: ContractsManager
          trigger:
            - call: "POST /wte/metals-recovery-batches/${mrb_id}/settle"
              payload: {}
              as: ContractsManager
              captures: { settle_err: $.data.error_id }
          assert:
            - "settle_err == ERR_INVALID_STATE (409)"
            - "MetalsRecoveryBatch.${mrb_id}.status == RECORDED (unchanged)"
  - rule_id: resource_temporal_overlap
    instances:
      - name: outage_windows_half_open_adjacency
        grounds:
          - validations[priority=13]
          - errors[ERR_OUTAGE_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the Boiler resource: [S1) ending
          09-10 and [S2) starting 09-10 merely touch and are BOTH allowed,
          while [S3) starting one hour before S1 ends overlaps and is rejected
          ERR_OUTAGE_OVERLAP.
        test_recipe:
          setup:
            - "Boiler B1; outages S1 = 2026-09-05..2026-09-10 and S2 = 2026-09-10..2026-09-12 (touching at the boundary) both exist SCHEDULED"
          setup_api_calls:
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
              captures: { b1_id: $.data.id }
            - call: "POST /wte/outage-windows"
              payload: { boiler_id: "${b1_id}", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", reason: "S1", kind: PLANNED }
              as: PlantOperator
              captures: { o1_id: $.data.id }
            - call: "POST /wte/outage-windows"
              payload: { boiler_id: "${b1_id}", starts_at: "2026-09-10T00:00:00Z", ends_at: "2026-09-12T00:00:00Z", reason: "S2", kind: PLANNED }
              as: PlantOperator
              captures: { o2_id: $.data.id }
          trigger:
            - call: "POST /wte/outage-windows"
              payload: { boiler_id: "${b1_id}", starts_at: "2026-09-09T23:00:00Z", ends_at: "2026-09-11T00:00:00Z", reason: "S3", kind: EMERGENCY }
              as: PlantOperator
              captures: { ovl_err: $.data.error_id }
          assert:
            - "S2 creation succeeded (touching endpoints are not an overlap under half-open semantics)"
            - "ovl_err == ERR_OUTAGE_OVERLAP (422): S3 straddles the S1/S2 boundary"

      - name: host_agreement_closed_interval_touching_is_overlap
        grounds:
          - validations[priority=14]
          - errors[ERR_HOST_AGREEMENT_OVERLAP]
        distinguishing_aspect: |
          Closed-interval semantics on the Municipality resource (different
          entity AND different interval semantics from the half-open outage
          rule): an agreement whose effective_start EQUALS the existing
          agreement's effective_end IS an overlap — the exact configuration the
          outage rule permits is forbidden here.
        test_recipe:
          setup:
            - "Municipality H1 is_host_community; HCA1 effective 2026-01-01..2026-12-31 (closed)"
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "Host Town of Bracebridge", population_served: 20000, is_host_community: true, priority_group: HOST }
              as: ContractsManager
              captures: { h1_id: $.data.id }
            - call: "POST /wte/host-community-agreements"
              payload: { municipality_id: "${h1_id}", annual_payment_cents: 50000000, payment_due_month: 3, local_waste_priority_enabled: true, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }
              as: ContractsManager
              captures: { hca1_id: $.data.id }
          trigger:
            - call: "POST /wte/host-community-agreements"
              payload: { municipality_id: "${h1_id}", annual_payment_cents: 52000000, payment_due_month: 3, local_waste_priority_enabled: true, effective_start: "2026-12-31T00:00:00Z", effective_end: "2027-12-31T00:00:00Z" }
              as: ContractsManager
              captures: { hca_err: $.data.error_id }
          assert:
            - "hca_err == ERR_HOST_AGREEMENT_OVERLAP (422): touching endpoints overlap under closed-interval semantics"
  - rule_id: compensating_invariant
    instances:
      - name: landfill_capacity_conserved_through_failure_and_success
        grounds:
          - state_machines.AshShipment.TEST_PENDING_to_DISPOSED
          - state_machines.AshShipment.TEST_PENDING_to_REJECTED
        distinguishing_aspect: |
          Conserved quantity: Landfill.remaining_capacity_tonnes. Invariant —
          reject(S_i; TEST_PENDING) leaves remaining capacity bit-identical
          (no debit without disposal), while complete(S_i; TEST_PENDING) debits
          exactly S_i.tonnes, so capacity_after == capacity_before -
          sum(tonnes of DISPOSED shipments) + 0 * (REJECTED shipments).
        test_recipe:
          setup:
            - "Landfill L1 ACTIVE capacity 1000 t, daily limit 500 t"
            - "Shipment S1 10 t TEST_PENDING with a FAILING test; shipment S2 10 t TEST_PENDING with a PASSING test"
          setup_api_calls:
            - call: "POST /wte/landfills"
              payload: { name: "AshMonofill-1", permit_number: "P-100", remaining_capacity_tonnes: 1000, daily_receipt_limit_tonnes: 500 }
              as: EnvironmentalOfficer
              captures: { l1_id: $.data.id, l1_v: $.data.version }
            - call: "POST /wte/ash-shipments"
              payload: { landfill_id: "${l1_id}", tonnes: 10, shipped_on: "2026-09-06", disposal_fee_cents_per_tonne: 4000 }
              as: EnvironmentalOfficer
              captures: { s1_id: $.data.id }
            - call: "POST /wte/ash-shipments/${s1_id}/submit-testing"
              payload: {}
              as: EnvironmentalOfficer
            - call: "POST /wte/ash-shipments/${s1_id}/tests"
              payload: { parameter: "TCLP-lead", measured_value: 6.0, limit_value: 5.0 }
              as: EnvironmentalOfficer
            - call: "POST /wte/ash-shipments"
              payload: { landfill_id: "${l1_id}", tonnes: 10, shipped_on: "2026-09-07", disposal_fee_cents_per_tonne: 4000 }
              as: EnvironmentalOfficer
              captures: { s2_id: $.data.id }
            - call: "POST /wte/ash-shipments/${s2_id}/submit-testing"
              payload: {}
              as: EnvironmentalOfficer
            - call: "POST /wte/ash-shipments/${s2_id}/tests"
              payload: { parameter: "TCLP-lead", measured_value: 4.0, limit_value: 5.0 }
              as: EnvironmentalOfficer
          trigger:
            - call: "POST /wte/ash-shipments/${s1_id}/complete"
              payload: { expected_landfill_version: "${l1_v}" }
              as: EnvironmentalOfficer
              captures: { s1_err: $.data.error_id }
            - call: "POST /wte/ash-shipments/${s1_id}/reject"
              payload: { reject_reason: "failed TCLP" }
              as: EnvironmentalOfficer
            - call: "GET /wte/landfills/${l1_id}"
              as: EnvironmentalOfficer
              captures: { l1_cap_mid: $.data.remaining_capacity_tonnes, l1_v_mid: $.data.version }
            - call: "POST /wte/ash-shipments/${s2_id}/complete"
              payload: { expected_landfill_version: "${l1_v_mid}" }
              as: EnvironmentalOfficer
          assert:
            - "s1_err == ERR_ASH_TEST_FAILED (422) — failed completion"
            - "l1_cap_mid == 1000 — failed completion plus rejection conserved capacity exactly"
            - "Landfill.${l1_id}.remaining_capacity_tonnes == 990 after S2 completes (1000 - 10, zero contribution from REJECTED S1)"

      - name: agreement_tonnage_conserved_through_reject_cycle
        grounds:
          - state_machines.WasteDelivery.RECEIVED_to_ACCEPTED
          - state_machines.WasteDelivery.RECEIVED_to_REJECTED
          - calculations.compute_put_or_pay_settlement
        distinguishing_aspect: |
          Conserved quantity of a different type: accepted-tonnage ledger
          (WasteSupplyAgreement.cumulative_delivered_tonnes). Invariant —
          after any interleaving of accept and reject, cumulative tonnage ==
          sum(tonnes over deliveries in ACCEPTED) exactly, and reject
          contributes zero; the put-or-pay base derived from the ledger tracks
          it one-to-one.
        test_recipe:
          setup:
            - "WSA A1 ACTIVE ANNUAL guarantee 1000 t rate 8500; boiler ONLINE"
            - "D1 400 t and D2 300 t RECEIVED"
          setup_api_calls:
            - call: "POST /wte/municipalities"
              payload: { legal_name: "City of Alder", population_served: 50000 }
              as: ContractsManager
              captures: { m1_id: $.data.id }
            - call: "POST /wte/boilers"
              payload: { name: "Boiler-A", max_thermal_capacity_mw: 50, max_steam_tph: 60 }
              as: PlantOperator
            - call: "POST /wte/waste-supply-agreements"
              payload: { municipality_id: "${m1_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z", guaranteed_annual_tonnage: 1000, tipping_fee_per_tonne_cents: 8500 }
              as: ContractsManager
              captures: { a1_id: $.data.id }
            - call: "POST /wte/waste-supply-agreements/${a1_id}/activate"
              payload: {}
              as: ContractsManager
              captures: { a1_v: $.data.version }
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-A", tonnes: 400, heating_value_mj_per_kg: 10, delivered_at: "2026-09-01T08:00:00Z" }
              as: PlantOperator
              captures: { d1_id: $.data.id }
            - call: "POST /wte/waste-deliveries/${d1_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /wte/waste-deliveries"
              payload: { agreement_id: "${a1_id}", manifest_ref: "MAN-B", tonnes: 300, heating_value_mj_per_kg: 10, delivered_at: "2026-09-02T08:00:00Z" }
              as: PlantOperator
              captures: { d2_id: $.data.id }
            - call: "POST /wte/waste-deliveries/${d2_id}/receive"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /wte/waste-deliveries/${d1_id}/accept"
              payload: { expected_agreement_version: "${a1_v}" }
              as: PlantOperator
            - call: "POST /wte/waste-deliveries/${d2_id}/reject"
              payload: { reject_reason: "contaminated load" }
              as: PlantOperator
            - call: "GET /wte/waste-supply-agreements/${a1_id}"
              as: ContractsManager
              captures: { a1_cum: $.data.cumulative_delivered_tonnes }
            - call: "POST /wte/settlements/put-or-pay/run"
              payload: { agreement_id: "${a1_id}" }
              as: ContractsManager
              captures: { s_base: $.data.delivered_base_tonnes, s_short_t: $.data.shortfall_tonnes }
          assert:
            - "a1_cum == 400 (reject of D2 contributed exactly zero — no drift)"
            - "s_base == 400 and s_short_t == 600 (ledger and settlement base agree one-to-one)"
