          - state_machines.TaxProfile.transitions.REJECTED_to_DRAFT
          - "endpoints[POST /monetization/tax-profiles/{tax_profile_id}/revise]"
        distinguishing_aspect: "A REJECT decision stores the rejection_reason, and the Creator-exclusive revise then clears it, returns the profile to DRAFT and applies the supplied field edits."
        test_recipe:
          setup: ["One creator with a SUBMITTED W9 profile that declares no TIN."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
