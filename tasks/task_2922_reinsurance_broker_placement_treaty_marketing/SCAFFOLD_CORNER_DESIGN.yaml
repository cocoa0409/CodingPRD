            - "${sl_a_after} == RELEASED with ${sl_a_reason} == SECURITY_FAILURE and ${q_a_after} == LAPSED"
            - "${sl_b_after} == PROVISIONAL — Bravo's line is untouched, the cascade is market-scoped"
            - "${layer_after} == PARTIALLY_PLACED with ${layer_total_after} == 40.0000 and ${prog_after} == IN_MARKET"
            - "${restored_status} == APPROVED but ${restored_committed} == 0, ${sl_a_final} == RELEASED, ${layer_final} == PARTIALLY_PLACED and ${layer_total_final} == 40.0000 — restoring the flag is not an undo of the suspension cascade"
      - name: parent_scoped_child_collections_never_leak_a_sibling_parents_rows
        claim_type: Cross-reference link
        grounds:
          - endpoints.GET /cedents/{cedent_id}/programs
          - endpoints.GET /programs/{program_id}/layers
          - endpoints.GET /layers/{layer_id}/market-submissions
          - endpoints.GET /reinsurers/{reinsurer_id}/market-submissions
          - endpoints.GET /reinsurers/{reinsurer_id}/signing-lines
        distinguishing_aspect: |
          The same MarketSubmission row is reachable from two different parents — from its Layer and
          from its Reinsurer — so the two nested collections must partition the SAME table along two
          different axes: the layer-scoped read returns both markets on one layer, and the
          market-scoped read returns one submission per layer across two unrelated cedents. A
          filter applied inside a nested collection must intersect with the parent scope rather than
          replace it, and the flat `GET /market-submissions?layer_id=` form must agree row for row
          with the nested form.
