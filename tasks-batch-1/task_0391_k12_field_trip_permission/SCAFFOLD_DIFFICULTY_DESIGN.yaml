            - "PermissionSlip.${slip_a}.payment_status == PAID (payment dimension unaffected by signature revoke)"
            - "PermissionSlip.${slip_a}.net_paid_cents == 1000 (payment ledger untouched by signature change)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: trip_cancel_depth3_refund_booking_chaperone
        grounds:
          - state_machines.FieldTrip.APPROVED_to_CANCELLED
          - state_machines.PermissionSlip.PAID_to_REFUNDED
          - state_machines.TransportBooking.CONFIRMED_to_CANCELLED
          - calculations.collected_fees_reconciliation
          - calculations.vehicle_seat_reservation
        distinguishing_aspect: |
          Depth-3 cascade originating from FieldTrip cancel: (1) trip→CANCELLED
          causes (2) each PAID slip→REFUNDED which appends a REFUND FeeTransaction
          that (3) recomputes collected_fees_cents AND causes each CONFIRMED booking
          →CANCELLED which (4) releases Vehicle.seats_reserved. Each link is caused
          by the prior link, not the original cancel.
        test_recipe:
          setup:
            - "Trip APPROVED, deposit 0, base_fee 1000, transport 0; one slip SIGNED+PAID 1000; one CONFIRMED transport booking of 5 seats on a vehicle."
