  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: agreement_windows_are_half_open_so_adjacency_clears_and_intersection_conflicts
        grounds:
          - validations[priority=63]
          - errors[ERR_AGREEMENT_WINDOW_OVERLAP]
          - entities.ReciprocityAgreement.fields.effective_from
          - entities.ReciprocityAgreement.fields.effective_to
          - concurrency_rules[agreement-create-supersede-stale-partner]
        distinguishing_aspect: |
          The contended resource is a Partner, and the interval semantics are half-open
          [effective_from, effective_to): two agreements that share an instant end-to-start coexist,
          while a window that genuinely straddles an existing one is refused. The overlap predicate is
          new.from < other.to AND other.from < new.to, so equality at a boundary is not an
          intersection.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; every window used lies in the future, so all created agreements are ACTIVE and no ops-run expiry interferes."
            - "Partner NORTHU ACTIVE with no agreements yet, version 1 at creation."
            - "Each POST /ill/reciprocity-agreements carries expected_partner_version and bumps Partner.version, so a fresh GET /ill/partners/{id} precedes every create."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /ill/reciprocity-agreements"
              payload: { partner_id: "${northu_id}", expected_partner_version: "${pv0}", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", fee_waiver_mode: "NONE", settlement_mode: "GROSS", turnaround_guarantee_days: 5, balance_tolerance_items: 3 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { agr1_id: $.data.id, agr1_status: $.data.status }
            - call: "GET /ill/partners/${northu_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { pv1: $.data.version }
            - call: "POST /ill/reciprocity-agreements"
              payload: { partner_id: "${northu_id}", expected_partner_version: "${pv1}", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", fee_waiver_mode: "FULL", settlement_mode: "NET", turnaround_guarantee_days: 4, balance_tolerance_items: 5 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { agr2_id: $.data.id, agr2_status: $.data.status }
            - call: "GET /ill/partners/${northu_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { pv2: $.data.version }
            - call: "POST /ill/reciprocity-agreements"
              payload: { partner_id: "${northu_id}", expected_partner_version: "${pv2}", effective_from: "2026-12-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z", fee_waiver_mode: "CAPPED", capped_waiver_cents: 4000, settlement_mode: "GROSS", turnaround_guarantee_days: 6, balance_tolerance_items: 3 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { err_overlap: $.data.error_id }
            - call: "GET /ill/partners/${northu_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { pv3: $.data.version }
          assert:
            - "${agr1_status} == ACTIVE — the first window [2026-09-01, 2027-01-01) is accepted on an empty partner"
            - "${agr2_status} == ACTIVE — [2027-01-01, 2027-07-01) is accepted even though agr2.effective_from equals agr1.effective_to exactly; half-open adjacency is not an overlap"
            - "${pv1} == ${pv0} + 1 and ${pv2} == ${pv1} + 1 — each accepted agreement bumps Partner.version"
            - "${err_overlap} == ERR_AGREEMENT_WINDOW_OVERLAP with HTTP 409 — [2026-12-01, 2027-02-01) intersects agr1 (2026-12-01 < 2027-01-01) and agr2 (2027-01-01 < 2027-02-01)"
            - "${pv3} == ${pv2} — the refused create did not bump Partner.version, so no partial write occurred"
            - "GET /ill/reciprocity-agreements?partner_id=${northu_id} returns total_count == 2 with exactly ${agr1_id} and ${agr2_id}"
            - "GET /ill/reciprocity-agreements?partner_id=${northu_id}&status=ACTIVE returns total_count == 2 — neither accepted agreement was superseded by the refused one"

      - name: loan_windows_are_closed_so_touching_endpoints_breach_aggregate_loan_capacity
        grounds:
          - calculations.patron_loan_window_capacity
          - validations[priority=64]
          - errors[ERR_PATRON_LOAN_WINDOW_CAPACITY]
          - entities.Patron.fields.max_concurrent_loans
          - entities.LoanRecord.fields.received_at
          - entities.LoanRecord.fields.due_at
        distinguishing_aspect: |
          A different contended resource (a Patron's concurrent-loan capacity rather than a Partner's
          agreement timeline) under the opposite interval convention: loan windows are CLOSED
          [received_at, due_at], so two windows that merely touch at a single instant DO overlap and
          breach the cap. Advancing the clock by one more day makes the same receipt succeed.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z for both intakes and both shipments."
            - "Patron P-8015 with max_concurrent_loans 1 and max_open_requests 5."
            - "Partner SHORTL with loan_period_days 7, ships_physical true, on a single-entry LOAN rota quoted 2000 cents / 4 days."
            - "Request A on BibItem WIN-A with needed_by 2026-08-09, sourced, accepted, shipped and received on 2026-08-01 — LoanRecord L-A window is the closed interval [2026-08-01, 2026-08-08], custody AWAITING_PICKUP, pickup_expires_at 2026-08-08."
            - "Request B on BibItem WIN-B with needed_by 2026-08-20, sourced, accepted and shipped on 2026-08-01 but deliberately NOT received; Shipment S-B sits IN_TRANSIT."
            - "No ops-run is executed, so L-A stays AWAITING_PICKUP (still inside the counted set) and S-B stays IN_TRANSIT (well inside the 14-day transit SLA)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-8015", full_name: "Omar Undergrad", email: "omar@u.edu", patron_type: "UNDERGRAD", department: "MATH", max_open_requests: 5, max_concurrent_loans: 1, unpaid_balance_cap_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "SHORTL", name: "Short Loan Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: false, allows_renewals: false, loan_period_days: 7, max_renewals: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { shortl_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Short loan rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${shortl_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Elliptic Curves I", item_type: "BOOK", publication_year: 2012, isbn: "978-0-000-00010-3", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_a_id: $.data.id }
            - call: "POST /ill/bib-items"
              payload: { title: "Elliptic Curves II", item_type: "BOOK", publication_year: 2013, isbn: "978-0-000-00011-0", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
