            - call: "GET /campaigns/${c}"
              as: HousingDeveloper
              captures: { cv: "$.data.version" }
            - call: "POST /lottery-runs"
              payload: { campaign_id: "${c}", seed: "SEED-ONE", expected_campaign_version: "${cv}" }
              as: LotteryAdministrator
              as_user_id: "lot-1"
              captures: { run1: "$.data.id" }
