            - *dd_clock
            - *dd_school
            - *dd_teacher
            - *dd_verify
            - *dd_vendor
            - *dd_item
            - *dd_project
            - *dd_add
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v2: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
            - call: "POST /giving/donors"
              payload: { display_name: "Dana", email: "dana@example.org" }
              as: Anonymous
              captures: { d1: $.data.id }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 9000 }
              as: Donor
              as_user_id: "${d1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 5000 }
              as: Donor
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FUNDING_WINDOW_CLOSED (temporal, priority 8) — NOT ERR_DONATION_EXCEEDS_REMAINING (fiscal, priority 24), though 5000 > remaining 1959 also holds"
            - "Project.${p1}.status is still FUNDING (no sweep ran, so no state-level rejection was possible)"
            - "Project.${p1}.funded_cents == 9000 unchanged"

      - name: duplicate_discontinued_item_constraint_precedes_referential
        grounds:
          - validations[priority=17]
          - validations[priority=19]
          - errors.ERR_DUPLICATE_CATALOG_ITEM
          - errors.ERR_CATALOG_ITEM_UNAVAILABLE
        distinguishing_aspect: |
          Category pair (business_constraint, business_referential) — a different
          pair than the temporal/fiscal instance: re-adding an item that is already
          on the project AND has just been DISCONTINUED violates both p17 and p19;
          the duplicate constraint (priority 17) must win.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; verified teacher; DRAFT project already holding 1 unit of SM-BOOK-1; the catalog item has since been DISCONTINUED via PATCH."
          setup_api_calls:
            - *dd_clock
            - *dd_school
            - *dd_teacher
            - *dd_verify
            - *dd_vendor
            - *dd_item
            - *dd_project
            - call: "POST /giving/projects/${p1}/items"
              payload: { catalog_item_id: "${i1}", quantity: 1, expected_project_version: "${p_v}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "PATCH /giving/vendors/${v1}/catalog-items/${i1}"
              payload: { status: "DISCONTINUED" }
              as: PlatformAdmin
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v2: $.data.version }
          trigger:
            - call: "POST /giving/projects/${p1}/items"
              payload: { catalog_item_id: "${i1}", quantity: 2, expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_CATALOG_ITEM (constraint, priority 17) — NOT ERR_CATALOG_ITEM_UNAVAILABLE (referential, priority 19), though the item is also DISCONTINUED"
            - "GET /giving/project-items?project_id=${p1} still returns exactly 1 row"

  # ===========================================================================
  - rule_id: boundary_precision_check
