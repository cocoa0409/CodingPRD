              as_user_id: "director-1"
          assert:
            - "First call: HTTP status == 403 and response.error_id == \"ERR_SEGREGATION_OF_DUTIES\"; EditCheck.${ec1}.status is still EXPLAINED and adjudicated_by_user_id is null"
            - "Second call: HTTP status == 200, status == ACCEPTED, adjudicated_by_user_id == \"director-1\"; SurveyComponent.${comp}.edit_status == CLEARED"
            - "Third and fourth calls: HTTP status == 200 and 201; DashboardPublication.${pub}.published_value == 1125 and version == 1"
            - "Fifth call: HTTP status == 201, RestatementRequest.${rst}.requested_by_user_id == \"u-shared\", baseline_value == 1125, delta_pct == 0.44, public_notice_required == false, publication_status == RESTATEMENT_PENDING"
            - "Sixth and seventh calls: HTTP status == 403 and response.error_id == \"ERR_SEGREGATION_OF_DUTIES\" (approve and reject share the requested_by_user_id anchor); RestatementRequest.${rst}.status is still SUBMITTED"
            - "Eighth call: HTTP status == 200, status == APPLIED, approved_by_user_id == \"director-1\", publication published_value == 1120 and net_applied_delta == -5.0"

      - name: corner_rbac_segregation_of_duties_on_certify
        claim_type: Segregation of duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints[POST /ir/survey-components/{component_id}/certify]
        excluded_because:
          difficulty_instance: segregation_of_duties_outranks_collection_deadline_passed_on_certify
          rationale: |
            The certify anchor (X-User-ID == prepared_by_user_id) is exercised in §1.8 in its harder
            form, where the same call also violates the collection deadline and the identity check
            must still win. Repeating the plain single-violation case here would add no
            discriminating power.

  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_layer_stale_expected_cycle_version_is_refused_then_the_refreshed_write_lands
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[frozen-file-create-stale-cycle]
          - errors[ERR_STALE_CYCLE_VERSION]
          - validations[priority=10]
          - entities.ReportingCycle.version
        distinguishing_aspect: |
          The declared OCC rule guards exactly one write endpoint with exactly one field. A client
          that registered the first extract still holds version 1, but that very write moved the
          cycle to version 2, so its second registration must be refused with 412 and must leave
          frozen_file_count and active_record_count untouched. Re-reading the cycle and resubmitting
          the identical payload with version 2 then succeeds, proving the refusal was about staleness
          and not about the payload.
        test_recipe:
          setup:
            - "Clean system; an OPEN ReportingCycle IPEDS-2027 with one ACTIVE ENROLLMENT extract of 1000 records."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60169", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
          trigger:
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "HR", record_count: 400, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60170", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { e1: $.data.error_id }
            - call: "GET /ir/reporting-cycles/${cyc}"
              as: RegistrarOfficer
              captures: { cyc_v2: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "HR", record_count: 400, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60170", expected_cycle_version: "${cyc_v2}" }
              as: RegistrarOfficer
              captures: { ff2: $.data.id }
          assert:
            - "Setup: the cycle create returned version == 1 and the first extract's response left ReportingCycle.${cyc}.version == 2 (every write increments)"
            - "First call: HTTP status == 412 and response.error_id == \"ERR_STALE_CYCLE_VERSION\" (expected 1, current 2)"
            - "After the first call: ReportingCycle.${cyc}.version == 2, frozen_file_count == 1, active_record_count == 1000; no FrozenFile with checksum c1d2e3f4a5b60170 exists"
            - "Second call: HTTP status == 200 and version == 2"
            - "Third call: HTTP status == 201, FrozenFile.${ff2}.status == ACTIVE and supersedes_frozen_file_id is null"
            - "After the third call: ReportingCycle.${cyc}.version == 3, frozen_file_count == 2, active_record_count == 1400"

      - name: corner_layer_stale_expected_publication_version_is_refused_after_a_rejected_restatement
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[restatement-create-stale-publication]
          - errors[ERR_STALE_PUBLICATION_VERSION]
          - validations[priority=10]
          - state_machines.DashboardPublication.RESTATEMENT_PENDING_to_PUBLISHED
        distinguishing_aspect: |
          The second OCC rule uses a different field on a different parent, and the interesting stale
          window is a round trip that ends where it started: file, reject, and the publication is
          PUBLISHED again but at version 3, not 1. A client holding version 1 is therefore stale even
          though the status it remembers is correct, so 412 must fire ahead of the priority-11 status
          check and ahead of baseline capture — the refused request must leave restatement_count at 0
          and create no RestatementRequest row.
        test_recipe:
          setup:
            - "A CERTIFIED ENROLLMENT component publishes TOTAL_HEADCOUNT 1125; a first restatement was filed by analyst-1 and rejected by director-1, so the publication is PUBLISHED at version 3."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1125, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60171", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1125, prior_year_value: 1125, source_field_path: "sis.enrollment.headcount" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the enrollment component as reported to the federal collection." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/publications"
              payload: { component_id: "${comp}", metric_key: "TOTAL_HEADCOUNT", published_value: 1125, effective_from: "2026-12-01T00:00:00Z" }
              as: IRAnalyst
              as_user_id: "analyst-1"
              captures: { pub: $.data.id, pub_v: $.data.version }
            - call: "POST /ir/publications/${pub}/restatements"
              payload: { proposed_value: 1120, justification: "Five students were double counted across two majors.", expected_publication_version: "${pub_v}" }
              as: IRAnalyst
              as_user_id: "analyst-1"
              captures: { r1: $.data.id }
            - call: "POST /ir/restatements/${r1}/reject"
              payload: { rejection_reason: "The duplicate list was not reconciled against the census file." }
              as: IRDirector
              as_user_id: "director-1"
          trigger:
            - call: "POST /ir/publications/${pub}/restatements"
              payload: { proposed_value: 1118, justification: "Seven students were double counted across two majors.", expected_publication_version: "${pub_v}" }
              as: IRAnalyst
              as_user_id: "analyst-1"
              captures: { e1: $.data.error_id }
            - call: "GET /ir/publications/${pub}"
              as: IRAnalyst
              captures: { pub_v3: $.data.version }
            - call: "POST /ir/publications/${pub}/restatements"
              payload: { proposed_value: 1118, justification: "Seven students were double counted across two majors.", expected_publication_version: "${pub_v3}" }
              as: IRAnalyst
              as_user_id: "analyst-1"
              captures: { r2: $.data.id }
          assert:
            - "Setup: the publication response had version == 1; after the restatement it was 2 (RESTATEMENT_PENDING) and after the rejection 3 (PUBLISHED again, restatement_count == 0)"
            - "First call: HTTP status == 412 and response.error_id == \"ERR_STALE_PUBLICATION_VERSION\" (expected 1, current 3) — not ERR_INVALID_PUBLICATION_STATE, and not a 201"
            - "After the first call: GET /ir/restatements returns total_count == 1 (only ${r1}); DashboardPublication.${pub}.version == 3, publication_status == PUBLISHED, published_value == 1125"
            - "Second call: HTTP status == 200 and version == 3"
            - "Third call: HTTP status == 201, RestatementRequest.${r2}.baseline_value == 1125, delta_pct == 0.62, public_notice_required == false"
            - "After the third call: DashboardPublication.${pub}.version == 4 and publication_status == RESTATEMENT_PENDING; RestatementRequest.${r1}.status is still REJECTED (a terminal request is never superseded)"

      - name: corner_layer_cycle_reopen_cascade_reaches_four_levels
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.ReportingCycle.FROZEN_to_REOPENED
        excluded_because:
          difficulty_instance: cycle_reopen_cascades_component_then_publications_then_restatement
          rationale: |
            The deepest declared cascade (L1 cycle posture -> L2 component decertification and edit
            check voiding -> L3 publication RESTATEMENT_PENDING -> L4 restatement VOIDED, with
            SUBMITTED components deliberately not reverted) is verified end-to-end in §1.8, together
            with the ordering sensitivity that makes it hard. A shallower restatement here would be
            strictly dominated.

      - name: corner_layer_two_rate_variants_from_one_roster
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.cohort_rate_variants
        excluded_because:
          difficulty_instance: cohort_rate_federal_adjusted_vs_ranking_gross_diverge_15pp
          rationale: |
            The federal (exclusion-adjusted denominator) and ranking (gross denominator) variants and
            their rate_divergence_pp are exercised at a 15+ percentage point spread in §1.8, which
            also pins that the divergence is computed from the already-rounded variants. The corner
            probe would repeat the same two formulas with tamer numbers.

      - name: corner_layer_variance_thresholds_at_their_exact_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.edit_check_generation
        excluded_because:
          difficulty_instance: prior_year_variance_at_exactly_ten_and_twentyfive_percent_thresholds
          rationale: |
            Both declared thresholds (WARNING at >= 10.0, FATAL at >= 25.0) are probed exactly on the
            boundary in §1.8, including the rounding interaction that decides which side of 10.0 a
            9.96% change lands on. A corner instance could only re-test the same two constants.

  - section: consistency_model
    instances:
      - name: corner_consistency_every_computed_field_is_already_correct_in_the_mutating_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - calculations.prior_year_variance_pct
          - calculations.edit_check_generation
          - calculations.cycle_active_record_count
        distinguishing_aspect: |
          Under an immediate model the write's own response body must already carry the derived
          values; nothing may be deferred to a later read. Each call below is asserted on its own
          response payload, not on a follow-up GET: the cycle create returns its counters at zero,
          the extract registration returns the recomputed cycle counters, the metric create returns
          variance_pct 12.5, and prepare returns edit_status OPEN_EDITS with
          fatal_open_count 0 in the same body that reports prep_status PREPARED, while the generated
          EditCheck row is already listable.
        test_recipe:
          setup:
            - "Clean system; logical clock at 2026-08-01T00:00:00.000Z."
          setup_api_calls: []
          trigger:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1125, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60172", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1125, prior_year_value: 1000, source_field_path: "sis.enrollment.headcount" }
              as: IRAnalyst
              captures: { met: $.data.id }
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
          assert:
            - "Call 1 response: data.version == 1, data.snapshot_posture == \"OPEN\", data.frozen_file_count == 0, data.active_record_count == 0, data.reopen_count == 0, data.census_locked_at == null; envelope has success true and error_id null"
            - "Call 2 response: data.status == \"ACTIVE\", data.snapshot_taken_at == \"2026-08-01T00:00:00.000Z\", data.version == 1"
            - "Call 2 follow-through: the cycle's own counters are already updated when read, so GET /ir/reporting-cycles/${cyc} returns frozen_file_count == 1, active_record_count == 1125, version == 2 with no intervening write"
            - "Call 4 response: data.snapshot_posture == \"CENSUS_LOCKED\", data.census_locked_at == \"2026-11-01T00:00:00.000Z\", data.active_record_count == 1125, data.version == 3 — all in the census-lock response itself"
            - "Call 6 response: data.variance_pct == 12.5 and data.restated == false in the create response (not null-then-recomputed)"
            - "Call 7 response: data.prep_status == \"PREPARED\", data.edit_status == \"OPEN_EDITS\", data.fatal_open_count == 0, data.prepared_by_user_id == \"analyst-1\", data.version == 3"
            - "GET /ir/edit-checks?component_id=${comp} immediately after call 7: total_count == 1, the row's check_code == \"PY_VAR_TOTAL_HEADCOUNT\", severity == WARNING, sequence_no == 1, status == OPEN"

      - name: corner_consistency_cross_entity_cascades_are_visible_on_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ReportingCycle.OPEN_to_CENSUS_LOCKED
          - state_machines.ReportingCycle.CENSUS_LOCKED_to_FROZEN
          - calculations.cohort_rate_variants
        distinguishing_aspect: |
          Immediate consistency also binds the rows a transition touches indirectly. The census lock
          flips the extract to LOCKED and the freeze locks every eligible cohort and computes its
          rates; both must be readable on the first GET that follows, with the version bumps already
          applied. An implementation that queues cascade work (or recomputes rates lazily on the
          rate-summary read) fails the intermediate GETs even though the final state eventually
          matches.
        test_recipe:
          setup:
            - "An OPEN IPEDS-2027 cycle with one ACTIVE ENROLLMENT extract, a DRAFT GRAD_RATE_150 / FALL2020 cohort holding S001 (COMPLETED_150) and S002 (NO_LONGER_ENROLLED), and an ENROLLMENT component reporting TOTAL_HEADCOUNT 1000 against a prior year of 1000."
          setup_api_calls:
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60173", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff1: $.data.id }
            - call: "POST /ir/reporting-cycles/${cyc}/cohorts"
              payload: { cohort_type: "GRAD_RATE_150", entry_term: "FALL2020", publication_metric_key: "GRAD_RATE_150_FALL2020" }
              as: RegistrarOfficer
              captures: { coh: $.data.id }
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S001", entry_status: "FULL_TIME", outcome: "COMPLETED_150" }
              as: RegistrarOfficer
            - call: "POST /ir/cohorts/${coh}/members"
              payload: { student_local_id: "S002", entry_status: "FULL_TIME", outcome: "NO_LONGER_ENROLLED" }
              as: RegistrarOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff1}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1000, prior_year_value: 1000, source_field_path: "sis.enrollment.headcount" }
              as: IRAnalyst
          trigger:
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "GET /ir/frozen-files/${ff1}"
              as: IRAnalyst
            - call: "GET /ir/cohorts/${coh}"
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the enrollment component as reported to the federal collection." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/reporting-cycles/${cyc}/freeze"
              payload: {}
              as: IRDirector
            - call: "GET /ir/cohorts/${coh}"
              as: IRAnalyst
            - call: "GET /ir/cohorts/${coh}/rate-summary"
              as: IRAnalyst
          assert:
            - "Call 2 (the first read after the lock): FrozenFile.${ff1}.status == \"LOCKED\" and version == 2 — the cascade is not deferred"
            - "Call 3: CohortDefinition.${coh}.status == \"DRAFT\", locked_at == null, federal_rate_pct == null, ranking_rate_pct == null, version == 1 (the census lock does not touch cohorts)"
            - "Call 6 response: data.snapshot_posture == \"FROZEN\" and data.frozen_at == \"2026-11-01T00:00:00.000Z\""
            - "Call 7 (the first read after the freeze): status == \"LOCKED\", locked_at == \"2026-11-01T00:00:00.000Z\", initial_count == 2, adjusted_count == 2, completers_count == 1, federal_rate_pct == 50.0, ranking_rate_pct == 50.0, version == 2"
            - "Call 8: the computed read agrees with the stored variants (data.federal_rate_pct == 50.0, data.ranking_rate_pct == 50.0, data.rate_divergence_pp == 0.0, data.exclusion_count == 0) rather than recomputing a different answer"
            - "GET /ir/edit-checks?component_id=${comp} after call 5: total_count == 0 and SurveyComponent.${comp}.edit_status == \"CLEARED\" (a 0.0% variance emits no check)"
