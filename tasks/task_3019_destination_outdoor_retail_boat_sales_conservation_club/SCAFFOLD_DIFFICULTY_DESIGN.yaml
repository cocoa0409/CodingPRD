              captures: { so_id: $.data.id }
            - call: "POST /stores/${st_id}/bay-bookings"
              payload: { bay_no: 1, member_id: "${m_id}", service_order_id: "${so_id}", booked_start_utc: "2026-09-08T09:00:00Z", booked_end_utc: "2026-09-08T10:00:00Z" }
              as: ReceivingManager
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /stores/${st_id}/order-fulfillments"
              payload: { member_id: "${m_id}", order_kind: "OVERSIZE_CARRYOUT", pre_service_order_id: "${so_id}", booking_id: "${bk_id}", expected_booking_version: "${bk_v}" }
              as: ReceivingManager
              captures: { of_id: $.data.id }
            - call: "POST /stores/service-orders/${so_id}/schedule"
              payload: {}
              as: ServiceTechnician
            - call: "POST /stores/service-orders/${so_id}/start"
              payload: {}
              as: ServiceTechnician
            - call: "POST /stores/service-orders/${so_id}/complete"
              payload: {}
              as: ServiceTechnician
            - call: "POST /stores/bay-bookings/${bk_id}/check-in"
              payload: {}
              as: ReceivingManager
          trigger:
            - call: "POST /stores/order-fulfillments/${of_id}/release"
              payload: { rm_cross_check_code: "rm_7741" }
              as: ReceivingManager
              captures: { err: $.data.error_id }
            - call: "GET /stores/order-fulfillments/${of_id}"
              as: ReceivingManager
            - call: "POST /stores/service-orders/${so_id}/deliver"
              payload: {}
              as: ServiceTechnician
            - call: "POST /stores/order-fulfillments/${of_id}/release"
              payload: { rm_cross_check_code: "rm_7741" }
              as: ReceivingManager
            - call: "GET /stores/order-fulfillments/${of_id}"
              as: ReceivingManager
          assert:
            - "the first release attempt is rejected with data.error_id == ERR_FULFILLMENT_BLOCKED and http 409"
            - "OrderFulfillment.${of_id}.status == READY_FOR_RELEASE after the rejection and rm_cross_check_code is still null"
            - "after the service order reaches DELIVERED the identical release payload succeeds: OrderFulfillment.${of_id}.status == RELEASED"
            - "the bay booking also advanced as a consequence: LoadingBayBooking.${bk_id}.status == COMPLETED"

      - name: attraction_session_confirmation_requires_open_posture
        grounds:
          - state_machines.AttractionSession.transitions.REQUESTED_to_CONFIRMED
          - calculations.attraction_posture
          - validations[priority=8]
          - errors[ERR_POSTURE_FROZEN]
        distinguishing_aspect: |
          The AttractionSession-to-Store pair: the session's confirmation
          transition is legal only while Store.attraction_posture is OPEN, so the
          dependency crosses from a leaf booking up to an aggregate derived from
          every sibling session and published event in the store.
        test_recipe:
          setup:
            - "A store with dwell_capacity_minutes 120 and no venues yet, plus one member."
            - "An AQUARIUM of capacity_units 40 and dwell_cost_minutes 30."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 120, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
