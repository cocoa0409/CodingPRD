            - call: "POST /backcross-projects/${bc_id}/marker-cycle"
              payload: { target_marker_present: true }
              as: BreedingScientist
          assert:
            - "at creation BackcrossProject.${bc_id}.bc_generation == 1, target_marker_present == false, recurrent_genome_pct == 75.000 (base only, the MAS bonus needs a detected marker), status == ACTIVE"
            - "the three accepted cycles yield recurrent_genome_pct 90.000 then 96.250 then 99.375, with bc_generation 2, 3, 4"
            - "BackcrossProject.${bc_id}.status == ACTIVE after cycles 1-2 and CONVERTED after cycle 3"
