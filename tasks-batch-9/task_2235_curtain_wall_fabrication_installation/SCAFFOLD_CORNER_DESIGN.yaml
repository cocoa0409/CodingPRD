        captures:
          pkg_v: $.data.version
      - call: POST /fabrication-releases
        payload:
          package_id: ${pkg}
          submittal_id: ${sub}
          glass_order_id: ${go}
          zone_ids:
          - ${z1}
          panels_per_zone: 36
          lites_per_panel: 2
          expected_package_version: ${pkg_v} - 1
        as: CWProjectManager
        captures:
          e_stale: $.data.error_id
