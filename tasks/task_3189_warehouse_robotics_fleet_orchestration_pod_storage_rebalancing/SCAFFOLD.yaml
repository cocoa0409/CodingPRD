scenario: "Warehouse Robotics Fleet Orchestration & Pod Storage Rebalancing (Amazon Robotics): mobile robot fleet assignment to storage pods with traffic management across a gridded floor, inventory placement decisions distributing units across pods to reduce travel and congestion, pick station queuing where pods are delivered to workers with sequencing to smooth station workload, stow decisions placing incoming units into random storage locations with density and accessibility tradeoffs, robot charging and maintenance cycles removing units from service, floor exception handling for dropped items, blocked paths and stranded robots with human floor entry protocols, throughput planning against labor staffing and order cutoffs, software deployment and safety validation before floor release"

domain_name: warehouse-robotics-fleet
api_prefix: /fleet

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: FloorZone
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: "Unique human-readable zone code (e.g. Z-A1). Unique across all FloorZones."
        constraints: "unique; immutable after creation"
      - name: grid_x
        type: integer
        source: input
        description: "Grid X origin of the zone rectangle (cells)."
        constraints: ">= 0"
      - name: grid_y
        type: integer
        source: input
        description: "Grid Y origin of the zone rectangle (cells)."
        constraints: ">= 0"
      - name: width
        type: integer
        source: input
        description: "Zone width in grid cells."
        constraints: ">= 1"
      - name: height
        type: integer
        source: input
        description: "Zone height in grid cells."
        constraints: ">= 1"
      - name: posture
        type: enum
        source: computed
        description: "Derived floor posture gating robot traffic. OPEN = robots may enter and traverse; RESTRICTED = robots already inside must park, no new entries; FROZEN = all motion forbidden, human entry permit active."
        constraints: "one of {OPEN, RESTRICTED, FROZEN}; initial OPEN"
        default: OPEN
      - name: max_human_occupancy
        type: integer
        source: input
        description: "Maximum number of simultaneously ACTIVE HumanEntryPermits allowed covering this zone."
        constraints: ">= 1"

  - name: DriveUnit
    parent: null
    common_fields: true
    fields:
      - name: unit_code
        type: string
        source: input
        description: "Unique robot identifier code."
        constraints: "unique; immutable"
      - name: status
        type: enum
        source: computed
        description: "Fleet lifecycle status. ACTIVE = available for assignment; EN_ROUTE = executing a traffic reservation; AT_STATION = docked under a pod at a pick station; PARKED = immobile inside a RESTRICTED/FROZEN zone; CHARGING = on a charger; MAINTENANCE = removed from service; STRANDED = immobilized by a floor exception; RETIRED = terminal."
        constraints: "one of {ACTIVE, EN_ROUTE, AT_STATION, PARKED, CHARGING, MAINTENANCE, STRANDED, RETIRED}"
        default: ACTIVE
      - name: home_zone_id
        type: string
        source: input
        description: "FK -> FloorZone.id; the zone the unit is currently located in."
      - name: battery_pct
        type: integer
        source: computed
        description: "Current battery percentage 0-100. Decremented by travel_cost_actual on trip completion; reset to 100 when a ChargingSession completes."
        constraints: "0 <= battery_pct <= 100"
        default: 100
      - name: firmware_release_id
        type: string
        source: computed
        description: "FK -> SoftwareRelease.id; the release currently running on this unit. Advanced only by a successful deployment sweep."
      - name: odometer_cells
        type: integer
        source: computed
        description: "Cumulative grid cells traversed; incremented by travel_cost_actual on every trip completion."
        default: 0
      - name: charge_cycle_count
        type: integer
        source: computed
        description: "Number of completed ChargingSessions. Drives the maintenance_due threshold."
        default: 0

  - name: Charger
    parent: FloorZone
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> FloorZone.id; zone the charger sits in."
      - name: slot_count
        type: integer
        source: input
        description: "Number of simultaneous charging slots."
        constraints: ">= 1"
      - name: slots_in_use
        type: integer
        source: computed
        description: "Count of OPEN ChargingSessions on this charger. Recomputed on session open/close."
        default: 0

  - name: Pod
    parent: FloorZone
    common_fields: true
    fields:
      - name: pod_code
        type: string
        source: input
        description: "Unique pod identifier."
        constraints: "unique; immutable"
      - name: zone_id
        type: string
        source: input
        description: "FK -> FloorZone.id; zone the pod is stored in."
      - name: slot_capacity
        type: integer
        source: input
        description: "Maximum number of InventorySlots the pod can hold."
        constraints: ">= 1"
      - name: slots_used
        type: integer
        source: computed
        description: "Count of InventorySlot rows with quantity > 0 on this pod."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "IN_STORAGE = on the floor; RESERVED = claimed by an outstanding PickTask or StowTask; AT_STATION = physically at a pick station; QUARANTINED = blocked by an open FloorException on this pod."
        constraints: "one of {IN_STORAGE, RESERVED, AT_STATION, QUARANTINED}"
        default: IN_STORAGE

  - name: Sku
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: "Unique SKU identifier."
        constraints: "unique; immutable"
      - name: velocity_class
        type: enum
        source: input
        description: "Demand velocity bucket used by stow scoring."
        constraints: "one of {HIGH, MEDIUM, LOW}"
      - name: total_units_on_hand
        type: integer
        source: computed
        description: "Sum of quantity over all InventorySlots for this SKU. Recomputed on every stow/pick."
        default: 0
      - name: total_units_reserved
        type: integer
        source: computed
        description: "Sum of quantity over InventorySlots reserved by non-terminal PickTasks."
        default: 0

  - name: InventorySlot
    parent: Pod
    common_fields: true
    fields:
      - name: pod_id
        type: string
        source: input
        description: "FK -> Pod.id."
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id."
      - name: quantity
        type: integer
        source: computed
        description: "Physical units currently in the slot. Incremented by stow completion, decremented by pick completion."
        default: 0
      - name: quantity_reserved
        type: integer
        source: computed
        description: "Units claimed by non-terminal PickTasks. quantity - quantity_reserved = available."
        default: 0
      - name: accessibility_rank
        type: integer
        source: input
        description: "Slot ergonomics rank; 1 = most accessible (waist height), higher = worse."
        constraints: ">= 1"

  - name: PickStation
    parent: FloorZone
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: "Unique station identifier."
        constraints: "unique; immutable"
      - name: zone_id
        type: string
        source: input
        description: "FK -> FloorZone.id; zone the station is attached to (queue approach lane)."
      - name: max_queue
        type: integer
        source: input
        description: "Maximum number of PickTasks that may be queued at the station."
        constraints: ">= 1"
      - name: queue_length
        type: integer
        source: computed
        description: "Count of PickTasks in status QUEUED or DELIVERED at this station."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "OPEN = accepting tasks; PAUSED = accepting no new tasks; CLOSED = terminal for the shift."
        constraints: "one of {OPEN, PAUSED, CLOSED}"
        default: OPEN

  - name: CustomerOrder
    parent: null
    common_fields: true
    fields:
      - name: order_code
        type: string
        source: input
        description: "Unique customer-facing order code."
        constraints: "unique; immutable"
      - name: status
        type: enum
        source: computed
        description: "RECEIVED = accepted into the system; PLANNED = at least one PickTask created; IN_PROGRESS = at least one pick completed; COMPLETE = all lines picked; CANCELLED = terminal cancellation (only from RECEIVED or PLANNED); CUTOFF_MISSED = terminal, auto-set when the order is still RECEIVED at its cutoff."
        constraints: "one of {RECEIVED, PLANNED, IN_PROGRESS, COMPLETE, CANCELLED, CUTOFF_MISSED}"
        default: RECEIVED
      - name: cutoff_at
        type: datetime
        source: input
        description: "ISO8601 UTC. The order must reach COMPLETE strictly before this instant; an order still in RECEIVED at cutoff_at auto-transitions to CUTOFF_MISSED. An order whose cutoff_at equals the current logical clock exactly is NOT yet missed (strict inequality)."
      - name: priority
        type: integer
        source: input
        description: "Higher = more urgent; used as the primary ranking key in task assignment."
        constraints: ">= 0"
        default: 0

  - name: OrderLine
    parent: CustomerOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> CustomerOrder.id."
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id."
      - name: quantity
        type: integer
        source: input
        description: "Units demanded."
        constraints: ">= 1"
      - name: quantity_picked
        type: integer
        source: computed
        description: "Units picked so far. Line complete when quantity_picked == quantity."
        default: 0

  - name: PickTask
    parent: CustomerOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> CustomerOrder.id."
      - name: line_id
        type: string
        source: input
        description: "FK -> OrderLine.id; the order line this task partially or fully satisfies."
      - name: pod_id
        type: string
        source: input
        description: "FK -> Pod.id; the pod selected to supply the units."
      - name: station_id
        type: string
        source: input
        description: "FK -> PickStation.id; the station the pod will be delivered to."
      - name: drive_unit_id
        type: string
        source: computed
        description: "FK -> DriveUnit.id; assigned by the fleet selector on dispatch. Null until DISPATCHED."
      - name: quantity
        type: integer
        source: input
        description: "Units this task picks from the pod."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "CREATED = not yet sequenced; QUEUED = sequenced into a station queue; DISPATCHED = drive unit en route carrying the pod; DELIVERED = pod at station awaiting pick; PICKING = worker actively picking; COMPLETE = pick done and pod released; FAILED = terminal failure from an exception; CANCELLED = terminal cancellation."
        constraints: "one of {CREATED, QUEUED, DISPATCHED, DELIVERED, PICKING, COMPLETE, FAILED, CANCELLED}"
        default: CREATED
      - name: sequence_index
        type: integer
        source: computed
        description: "Position in the station queue assigned by the workload-smoothing sequencer. Lower = earlier. Null while CREATED."
      - name: est_cost
        type: number
        source: computed
        description: "Optimistic travel-cost estimate from travel_cost_estimate (planning variant)."
      - name: actual_cost
        type: number
        source: computed
        description: "Pessimistic actual travel cost from travel_cost_estimate (execution variant); set when the trip completes."

  - name: StowTask
    parent: null
    common_fields: true
    fields:
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id of the incoming units."
      - name: quantity
        type: integer
        source: input
        description: "Units arriving to be stowed."
        constraints: ">= 1"
      - name: pod_id
        type: string
        source: computed
        description: "FK -> Pod.id selected by the stow-placement scoring rule. Null until PLACED."
      - name: status
        type: enum
        source: computed
        description: "PENDING = awaiting placement decision; PLACED = pod selected, awaiting physical stow; COMPLETE = units physically in slot; REJECTED = terminal, no eligible pod."
        constraints: "one of {PENDING, PLACED, COMPLETE, REJECTED}"
        default: PENDING
      - name: placement_score
        type: number
        source: computed
        description: "Score of the selected pod under the active stow-density variant."

  - name: ChargingSession
    parent: Charger
    common_fields: true
    fields:
      - name: charger_id
        type: string
        source: input
        description: "FK -> Charger.id."
      - name: drive_unit_id
        type: string
        source: input
        description: "FK -> DriveUnit.id."
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the session opened."
      - name: ended_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the session closed. Null while OPEN."
      - name: status
        type: enum
        source: computed
        description: "OPEN = unit docked and charging; CLOSED = completed, unit released back to ACTIVE; ABORTED = session ended early by a maintenance pull."
        constraints: "one of {OPEN, CLOSED, ABORTED}"
        default: OPEN
      - name: charge_credit_pct
        type: integer
        source: computed
        description: "Battery percentage restored when the session closes, computed by charge_cycle_credit."

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - name: drive_unit_id
        type: string
        source: input
        description: "FK -> DriveUnit.id; unit removed from service during the window."
      - name: starts_at
        type: datetime
        source: input
        description: "Half-open interval start (inclusive)."
      - name: ends_at
        type: datetime
        source: input
        description: "Half-open interval end (exclusive). MUST be > starts_at."
      - name: status
        type: enum
        source: computed
        description: "SCHEDULED = future window; ACTIVE = current logical clock inside [starts_at, ends_at); COMPLETE = window elapsed and unit returned to ACTIVE; CANCELLED = window cancelled before starts_at."
        constraints: "one of {SCHEDULED, ACTIVE, COMPLETE, CANCELLED}"
        default: SCHEDULED
      - name: kind
        type: enum
        source: input
        description: "PREVENTIVE = scheduled by charge_cycle threshold; CORRECTIVE = reactive repair."
        constraints: "one of {PREVENTIVE, CORRECTIVE}"

  - name: FloorException
    parent: null
    common_fields: true
    fields:
      - name: kind
        type: enum
        source: input
        description: "DROPPED_ITEM = debris on the floor; BLOCKED_PATH = aisle obstruction; STRANDED_ROBOT = immobilized drive unit."
        constraints: "one of {DROPPED_ITEM, BLOCKED_PATH, STRANDED_ROBOT}"
      - name: zone_id
        type: string
        source: input
        description: "FK -> FloorZone.id where the exception occurred."
      - name: pod_id
        type: string
        source: input
        description: "FK -> Pod.id. Required only for kind=DROPPED_ITEM when the debris belongs to a pod; otherwise null."
      - name: drive_unit_id
        type: string
        source: input
        description: "FK -> DriveUnit.id. Required only for kind=STRANDED_ROBOT; otherwise null."
      - name: status
        type: enum
        source: computed
        description: "OPEN = reported, not triaged; TRIAGED_ROBOT = cleared for robotic cleanup branch; TRIAGED_HUMAN = requires human entry branch; RESOLVED = terminal, floor restored."
        constraints: "one of {OPEN, TRIAGED_ROBOT, TRIAGED_HUMAN, RESOLVED}"
        default: OPEN

  - name: HumanEntryPermit
    parent: FloorZone
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> FloorZone.id the human will enter."
      - name: exception_id
        type: string
        source: input
        description: "FK -> FloorException.id that authorizes this entry. The exception MUST be in TRIAGED_HUMAN."
      - name: starts_at
        type: datetime
        source: input
        description: "Closed interval start (inclusive)."
      - name: ends_at
        type: datetime
        source: input
        description: "Closed interval end (inclusive). MUST be >= starts_at."
      - name: status
        type: enum
        source: computed
        description: "REQUESTED = pending safety grant; ACTIVE = granted, zone FROZEN for the closed interval; RELEASED = human exited, terminal."
        constraints: "one of {REQUESTED, ACTIVE, RELEASED}"
        default: REQUESTED

  - name: ShiftPlan
    parent: null
    common_fields: true
    fields:
      - name: plan_date
        type: string
        source: input
        description: "ISO8601 date (YYYY-MM-DD) the plan covers. Unique across ShiftPlans."
        constraints: "unique"
      - name: staffed_pickers
        type: integer
        source: input
        description: "Number of pickers rostered for the day."
        constraints: ">= 0"
      - name: planned_units
        type: integer
        source: input
        description: "Total units management expects to pick."
        constraints: ">= 0"
      - name: projected_units
        type: integer
        source: computed
        description: "Output of throughput_projection for this plan date."
      - name: feasible
        type: boolean
        source: computed
        description: "true iff projected_units >= planned_units under the pessimistic throughput_projection variant."

  - name: SoftwareRelease
    parent: null
    common_fields: true
    fields:
      - name: release_code
        type: string
        source: input
        description: "Unique release identifier (semver string)."
        constraints: "unique; immutable"
      - name: status
        type: enum
        source: computed
        description: "DRAFT = authored; VALIDATING = safety validation running; VALIDATED = passed, eligible for promotion; FAILED = validation failed, returns to DRAFT after defect notes; FLOOR_LIVE = deployed fleet-wide; ROLLED_BACK = terminal rollback to previous release."
        constraints: "one of {DRAFT, VALIDATING, VALIDATED, FAILED, FLOOR_LIVE, ROLLED_BACK}"
        default: DRAFT
      - name: safety_check_passed
        type: boolean
        source: computed
        description: "Set true only by the validation sweep; gates promotion."
        default: false
      - name: defect_notes
        type: string
        source: input
        description: "Required when transitioning VALIDATING -> FAILED."

state_machines:
  - entity: DriveUnit
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: EN_ROUTE
        trigger: "POST /fleet/pick-tasks/{id}/dispatch selects this unit via the fleet selector"
        actor: system
        preconditions:
          - "DriveUnit.status == ACTIVE"
          - "DriveUnit.battery_pct >= BATTERY_MIN_DISPATCH (20)"
          - "no ACTIVE MaintenanceWindow covers this unit at the current logical clock"
          - "the unit's home zone posture != FROZEN"
        side_effects:
          - "PickTask.status CREATED->QUEUED->DISPATCHED chain updates PickTask.drive_unit_id"
          - "Pod.status -> RESERVED"
      - from: EN_ROUTE
        to: AT_STATION
        trigger: "POST /fleet/pick-tasks/{id}/deliver records pod arrival at the station"
        actor: FlowController
        preconditions:
          - "PickTask.status == DISPATCHED"
          - "PickTask.drive_unit_id == this unit"
        side_effects:
          - "battery_pct -= travel_cost_actual (execution variant of travel_cost_estimate)"
          - "odometer_cells += travel_cost_actual"
          - "PickTask.status -> DELIVERED"
          - "Pod.status -> AT_STATION"
      - from: AT_STATION
        to: ACTIVE
        trigger: "POST /fleet/pick-tasks/{id}/complete finishes the pick and releases the pod"
        actor: StationOperator
        preconditions:
          - "PickTask.status == PICKING"
        side_effects:
          - "InventorySlot.quantity -= PickTask.quantity and quantity_reserved -= PickTask.quantity"
          - "Pod.slots_used recomputed; Pod.status -> IN_STORAGE"
          - "Sku.total_units_on_hand and total_units_reserved recomputed"
          - "OrderLine.quantity_picked += PickTask.quantity; if all lines of CustomerOrder complete, CustomerOrder.status -> COMPLETE"
      - from: ACTIVE
        to: CHARGING
        trigger: "POST /fleet/charging-sessions opens a session"
        actor: FlowController
        preconditions:
          - "DriveUnit.status == ACTIVE"
          - "Charger.slots_in_use < Charger.slot_count"
          - "Charger.zone posture != FROZEN"
        side_effects:
          - "Charger.slots_in_use += 1"
      - from: CHARGING
        to: ACTIVE
        trigger: "POST /fleet/charging-sessions/{id}/close completes the session"
        actor: FlowController
        preconditions:
          - "ChargingSession.status == OPEN"
        side_effects:
          - "battery_pct = min(100, battery_pct + charge_credit_pct)"
          - "charge_cycle_count += 1"
          - "Charger.slots_in_use -= 1"
          - "if charge_cycle_count >= MAINTENANCE_CYCLE_THRESHOLD (5), a PREVENTIVE MaintenanceWindow is auto-created SCHEDULED at current_clock + 60 minutes with 30-minute duration"
      - from: CHARGING
        to: MAINTENANCE
        trigger: "POST /fleet/maintenance-windows with kind=CORRECTIVE covering a charging unit aborts the session"
        actor: MaintenanceTech
        preconditions:
          - "ChargingSession.status == OPEN on this unit"
        side_effects:
          - "ChargingSession.status -> ABORTED; ended_at set; Charger.slots_in_use -= 1"
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "POST /fleet/maintenance-windows activates a window covering this unit"
        actor: MaintenanceTech
        preconditions:
          - "DriveUnit.status in {ACTIVE, CHARGING}"
          - "window kind == PREVENTIVE or CORRECTIVE"
        side_effects:
          - "any QUEUED PickTask whose dispatch would have selected this unit is excluded from the fleet selector while MAINTENANCE"
      - from: MAINTENANCE
        to: ACTIVE
        trigger: "POST /fleet/maintenance-windows/{id}/complete closes the window"
        actor: MaintenanceTech
        preconditions:
          - "MaintenanceWindow.status == ACTIVE"
        side_effects:
          - "MaintenanceWindow.status -> COMPLETE"
      - from: ACTIVE
        to: PARKED
        trigger: "system cascade: FloorZone.posture -> RESTRICTED or FROZEN while the unit's home_zone_id is that zone and the unit is not EN_ROUTE"
        actor: system
        preconditions:
          - "DriveUnit.home_zone_id == the zone whose posture changed"
        side_effects:
          - "QUEUED PickTasks referencing pods in the same zone are recomputed by the sequencer"
      - from: PARKED
        to: ACTIVE
        trigger: "system cascade: FloorZone.posture -> OPEN"
        actor: system
        preconditions:
          - "FloorZone.posture == OPEN"
        side_effects: []
      - from: EN_ROUTE
        to: STRANDED
        trigger: "POST /fleet/floor-exceptions with kind=STRANDED_ROBOT and drive_unit_id == this unit"
        actor: FloorSupervisor
        preconditions:
          - "FloorException.kind == STRANDED_ROBOT"
        side_effects:
          - "the in-flight PickTask.status -> FAILED"
          - "InventorySlot.quantity_reserved released back for the failed task's quantity"
      - from: STRANDED
        to: MAINTENANCE
        trigger: "FloorException resolution transition RESOLVED with corrective_outcome=MAINTENANCE"
        actor: FloorSupervisor
        preconditions:
          - "FloorException.status -> RESOLVED for the exception that stranded the unit"
        side_effects: []
      - from: STRANDED
        to: ACTIVE
        trigger: "FloorException resolution transition RESOLVED with corrective_outcome=RESTORE"
        actor: FloorSupervisor
        preconditions:
          - "FloorException.status -> RESOLVED"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /fleet/drive-units/{id}/retire"
        actor: FleetAdmin
        preconditions:
          - "DriveUnit.status == ACTIVE"
          - "no non-terminal PickTask references this unit"
        side_effects: []

  - entity: PickTask
    initial_state: CREATED
    terminal_states: [COMPLETE, FAILED, CANCELLED]
    transitions:
      - from: CREATED
        to: QUEUED
        trigger: "POST /fleet/pick-tasks/{id}/sequence assigns the task into a station queue"
        actor: FlowController
        preconditions:
          - "PickStation.status == OPEN"
          - "PickStation.queue_length < PickStation.max_queue"
          - "Pod.status in {IN_STORAGE, RESERVED}"
          - "Pod.zone posture != FROZEN"
          - "InventorySlot on (pod_id, line.sku_id) has quantity - quantity_reserved >= PickTask.quantity"
        side_effects:
          - "sequence_index set by the workload-smoothing sequencer"
          - "PickStation.queue_length += 1"
          - "if Pod.status was IN_STORAGE: Pod.status -> RESERVED (it stays RESERVED while any non-terminal task references it)"
          - "InventorySlot.quantity_reserved += PickTask.quantity"
          - "Sku.total_units_reserved += PickTask.quantity"
          - "CustomerOrder.status -> PLANNED if still RECEIVED"
      - from: QUEUED
        to: DISPATCHED
        trigger: "POST /fleet/pick-tasks/{id}/dispatch assigns a drive unit"
        actor: FlowController
        preconditions:
          - "PickTask.status == QUEUED"
          - "fleet selector returns a non-empty candidate (see fleet_selector)"
        side_effects:
          - "PickTask.drive_unit_id set"
          - "DriveUnit.status ACTIVE -> EN_ROUTE"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /fleet/pick-tasks/{id}/deliver"
        actor: FlowController
        preconditions:
          - "PickTask.status == DISPATCHED"
        side_effects:
          - "DriveUnit.status EN_ROUTE -> AT_STATION with battery and odometer updates"
          - "PickTask.actual_cost set to the execution variant of travel_cost_estimate"
          - "Pod.status RESERVED -> AT_STATION"
      - from: DELIVERED
        to: PICKING
        trigger: "POST /fleet/pick-tasks/{id}/begin-pick"
        actor: StationOperator
        preconditions:
          - "PickTask.status == DELIVERED"
          - "the acting StationOperator's X-User-ID is rostered on the current ShiftPlan (staffed_pickers > 0 for the plan date)"
        side_effects: []
      - from: PICKING
        to: COMPLETE
        trigger: "POST /fleet/pick-tasks/{id}/complete"
        actor: StationOperator
        preconditions:
          - "PickTask.status == PICKING"
        side_effects:
          - "DriveUnit AT_STATION -> ACTIVE cascade (see DriveUnit machine)"
          - "PickStation.queue_length -= 1"
          - "CustomerOrder.status -> IN_PROGRESS or COMPLETE"
      - from: CREATED
        to: CANCELLED
        trigger: "POST /fleet/pick-tasks/{id}/cancel"
        actor: FlowController
        preconditions:
          - "PickTask.status in {CREATED, QUEUED}"
        side_effects:
          - "if previously QUEUED: PickStation.queue_length -= 1, Pod.status -> IN_STORAGE, InventorySlot.quantity_reserved -= quantity, Sku.total_units_reserved -= quantity"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /fleet/pick-tasks/{id}/cancel"
        actor: FlowController
        preconditions:
          - "PickTask.status in {CREATED, QUEUED}"
        side_effects:
          - "PickStation.queue_length -= 1"
          - "Pod.status RESERVED -> IN_STORAGE"
          - "InventorySlot.quantity_reserved -= quantity"
          - "Sku.total_units_reserved -= quantity"
      - from: DISPATCHED
        to: FAILED
        trigger: "system cascade: the assigned DriveUnit becomes STRANDED"
        actor: system
        preconditions:
          - "DriveUnit.status EN_ROUTE -> STRANDED while carrying this task's pod"
        side_effects:
          - "PickStation.queue_length -= 1"
          - "Pod.status -> QUARANTINED"
          - "InventorySlot.quantity_reserved -= quantity"
          - "Sku.total_units_reserved -= quantity"

  - entity: FloorException
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: TRIAGED_ROBOT
        trigger: "POST /fleet/floor-exceptions/{id}/triage with branch=ROBOT"
        actor: FloorSupervisor
        preconditions:
          - "FloorException.status == OPEN"
          - "kind == DROPPED_ITEM or BLOCKED_PATH"
        side_effects:
          - "FloorZone.posture -> RESTRICTED (cascade: DriveUnits in zone PARKED)"
      - from: OPEN
        to: TRIAGED_HUMAN
        trigger: "POST /fleet/floor-exceptions/{id}/triage with branch=HUMAN"
        actor: FloorSupervisor
        preconditions:
          - "FloorException.status == OPEN"
        side_effects:
          - "FloorZone.posture -> RESTRICTED"
      - from: TRIAGED_ROBOT
        to: RESOLVED
        trigger: "POST /fleet/floor-exceptions/{id}/resolve with corrective_outcome in {RESTORE}"
        actor: FloorSupervisor
        preconditions:
          - "FloorException.status == TRIAGED_ROBOT"
          - "no ACTIVE HumanEntryPermit covers the zone"
        side_effects:
          - "FloorZone.posture -> OPEN (cascade: PARKED DriveUnits -> ACTIVE)"
          - "if pod_id non-null: Pod.status QUARANTINED -> IN_STORAGE"
      - from: TRIAGED_HUMAN
        to: RESOLVED
        trigger: "POST /fleet/floor-exceptions/{id}/resolve after the covering HumanEntryPermit is RELEASED"
        actor: FloorSupervisor
        preconditions:
          - "FloorException.status == TRIAGED_HUMAN"
          - "every HumanEntryPermit with exception_id == this exception has status == RELEASED"
          - "corrective_outcome in {RESTORE, MAINTENANCE}; MAINTENANCE only valid when kind == STRANDED_ROBOT"
        side_effects:
          - "FloorZone.posture -> OPEN"
          - "if corrective_outcome == MAINTENANCE: the stranded DriveUnit STRANDED -> MAINTENANCE"
          - "if corrective_outcome == RESTORE and kind == STRANDED_ROBOT: DriveUnit STRANDED -> ACTIVE"
          - "if pod_id non-null: Pod.status QUARANTINED -> IN_STORAGE"

  - entity: HumanEntryPermit
    initial_state: REQUESTED
    terminal_states: [RELEASED]
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /fleet/human-entry-permits/{id}/grant"
        actor: SafetyOfficer
        preconditions:
          - "HumanEntryPermit.status == REQUESTED"
          - "FloorException referenced by exception_id has status == TRIAGED_HUMAN"
          - "count of ACTIVE HumanEntryPermits with zone_id == this zone_id and overlapping closed [starts_at, ends_at] < FloorZone.max_human_occupancy"
          - "the acting SafetyOfficer's X-User-ID differs from the X-User-ID that triaged the exception (segregation of duties)"
        side_effects:
          - "FloorZone.posture -> FROZEN"
          - "all DriveUnits in the zone not already CHARGING/MAINTENANCE/STRANDED -> PARKED"
          - "PickTasks QUEUED on pods in the zone are resequenced by the workload-smoothing sequencer to other stations if any exist, else remain queued (status unchanged)"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /fleet/human-entry-permits/{id}/release"
        actor: SafetyOfficer
        preconditions:
          - "HumanEntryPermit.status == ACTIVE"
          - "current logical clock >= permit.ends_at"
        side_effects:
          - "if no other ACTIVE permit covers the zone: FloorZone.posture -> RESTRICTED (the governing exception remains TRIAGED_HUMAN until resolved)"

  - entity: SoftwareRelease
    initial_state: DRAFT
    terminal_states: [FLOOR_LIVE, ROLLED_BACK]
    transitions:
      - from: DRAFT
        to: VALIDATING
        trigger: "POST /fleet/software-releases/{id}/validate"
        actor: ReleaseEngineer
        preconditions:
          - "SoftwareRelease.status == DRAFT"
          - "no other SoftwareRelease has status == VALIDATING"
        side_effects: []
      - from: VALIDATING
        to: VALIDATED
        trigger: "POST /fleet/software-releases/{id}/record-validation with outcome=PASS"
        actor: SafetyOfficer
        preconditions:
          - "SoftwareRelease.status == VALIDATING"
          - "the acting SafetyOfficer's X-User-ID differs from the ReleaseEngineer's X-User-ID that initiated validation (segregation of duties)"
        side_effects:
          - "safety_check_passed = true"
      - from: VALIDATING
        to: FAILED
        trigger: "POST /fleet/software-releases/{id}/record-validation with outcome=FAIL"
        actor: SafetyOfficer
        preconditions:
          - "SoftwareRelease.status == VALIDATING"
          - "defect_notes non-empty"
        side_effects:
          - "safety_check_passed = false"
      - from: FAILED
        to: DRAFT
        trigger: "POST /fleet/software-releases/{id}/revise"
        actor: ReleaseEngineer
        preconditions:
          - "SoftwareRelease.status == FAILED"
        side_effects: []
      - from: VALIDATED
        to: FLOOR_LIVE
        trigger: "POST /fleet/software-releases/{id}/promote"
        actor: FleetAdmin
        preconditions:
          - "SoftwareRelease.status == VALIDATED"
          - "safety_check_passed == true"
          - "no FloorException in status OPEN or TRIAGED_HUMAN anywhere on the floor"
          - "no DriveUnit in status STRANDED"
        side_effects:
          - "any prior FLOOR_LIVE release -> ROLLED_BACK"
          - "every DriveUnit.firmware_release_id -> this release id"
          - "every DriveUnit.version incremented (firmware mutation)"
      - from: FLOOR_LIVE
        to: ROLLED_BACK
        trigger: "POST /fleet/software-releases/{id}/rollback"
        actor: FleetAdmin
        preconditions:
          - "SoftwareRelease.status == FLOOR_LIVE"
        side_effects:
          - "every DriveUnit.firmware_release_id -> previous FLOOR_LIVE release if any, else unchanged"

  - entity: MaintenanceWindow
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system cascade: logical clock enters [starts_at, ends_at)"
        actor: system
        preconditions:
          - "current logical clock >= starts_at and < ends_at"
        side_effects:
          - "DriveUnit ACTIVE or CHARGING -> MAINTENANCE (per DriveUnit machine)"
      - from: ACTIVE
        to: COMPLETE
        trigger: "POST /fleet/maintenance-windows/{id}/complete"
        actor: MaintenanceTech
        preconditions:
          - "MaintenanceWindow.status == ACTIVE"
        side_effects:
          - "DriveUnit MAINTENANCE -> ACTIVE"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /fleet/maintenance-windows/{id}/cancel"
        actor: MaintenanceTech
        preconditions:
          - "MaintenanceWindow.status == SCHEDULED"
          - "current logical clock < starts_at"
        side_effects: []

  - entity: CustomerOrder
    initial_state: RECEIVED
    terminal_states: [COMPLETE, CANCELLED, CUTOFF_MISSED]
    transitions:
      - from: RECEIVED
        to: PLANNED
        trigger: "system cascade: first PickTask of the order reaches QUEUED"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "system cascade: first PickTask of the order reaches COMPLETE"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "system cascade: every OrderLine has quantity_picked == quantity"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /fleet/customer-orders/{id}/cancel"
        actor: FlowController
        preconditions:
          - "CustomerOrder.status in {RECEIVED, PLANNED}"
          - "no PickTask of this order in status PICKING or DISPATCHED or DELIVERED"
        side_effects:
          - "every PickTask of this order in CREATED or QUEUED -> CANCELLED with full reservation release"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /fleet/customer-orders/{id}/cancel"
        actor: FlowController
        preconditions:
          - "CustomerOrder.status in {RECEIVED, PLANNED}"
          - "no PickTask of this order in status PICKING or DISPATCHED or DELIVERED"
        side_effects:
          - "every PickTask of this order in CREATED or QUEUED -> CANCELLED with full reservation release"
      - from: RECEIVED
        to: CUTOFF_MISSED
        trigger: "system cascade: logical clock advances past cutoff_at while status == RECEIVED (strict: clock > cutoff_at)"
        actor: system
        preconditions:
          - "current logical clock > CustomerOrder.cutoff_at"
        side_effects: []

  - entity: StowTask
    initial_state: PENDING
    terminal_states: [COMPLETE, REJECTED]
    transitions:
      - from: PENDING
        to: PLACED
        trigger: "POST /fleet/stow-tasks/{id}/place runs the stow-placement selector"
        actor: FlowController
        preconditions:
          - "StowTask.status == PENDING"
          - "stow-placement selector returns a non-empty candidate (see stow_density_score)"
        side_effects:
          - "StowTask.pod_id set; placement_score recorded"
          - "Pod.status -> RESERVED if it was IN_STORAGE"
      - from: PLACED
        to: COMPLETE
        trigger: "POST /fleet/stow-tasks/{id}/confirm"
        actor: StationOperator
        preconditions:
          - "StowTask.status == PLACED"
          - "Pod.slots_used < Pod.slot_capacity when no existing InventorySlot row exists for (pod_id, sku_id); if such a row exists, the stow always fits"
        side_effects:
          - "InventorySlot.quantity += StowTask.quantity (create row with quantity=0 first if absent)"
          - "Pod.slots_used recomputed"
          - "Sku.total_units_on_hand += StowTask.quantity"
          - "Pod.status RESERVED -> IN_STORAGE"
      - from: PENDING
        to: REJECTED
        trigger: "POST /fleet/stow-tasks/{id}/place when the selector pool is empty"
        actor: system
        preconditions:
          - "no pod satisfies the stow-placement eligibility filter"
        side_effects: []

  - entity: FloorZone
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system cascade: a FloorException in this zone is triaged (either branch)"
        actor: system
        preconditions: []
        side_effects:
          - "DriveUnits in the zone with status ACTIVE -> PARKED"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system cascade: a HumanEntryPermit for this zone becomes ACTIVE"
        actor: system
        preconditions: []
        side_effects:
          - "all remaining non-CHARGING/non-MAINTENANCE/non-STRANDED DriveUnits in zone -> PARKED"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system cascade: the last ACTIVE HumanEntryPermit for the zone is RELEASED"
        actor: system
        preconditions:
          - "the governing FloorException is still TRIAGED_HUMAN"
        side_effects: []
      - from: RESTRICTED
        to: OPEN
        trigger: "system cascade: the governing FloorException -> RESOLVED"
        actor: system
        preconditions: []
        side_effects:
          - "PARKED DriveUnits in zone -> ACTIVE"

  - entity: ChargingSession
    initial_state: OPEN
    terminal_states: [CLOSED, ABORTED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /fleet/charging-sessions/{id}/close"
        actor: FlowController
        preconditions:
          - "ChargingSession.status == OPEN"
        side_effects:
          - "DriveUnit CHARGING -> ACTIVE with battery/cycle updates"
      - from: OPEN
        to: ABORTED
        trigger: "system cascade: a CORRECTIVE MaintenanceWindow covering the unit activates"
        actor: system
        preconditions: []
        side_effects:
          - "ended_at set; Charger.slots_in_use -= 1; DriveUnit CHARGING -> MAINTENANCE"

concurrency_rules:
  - rule_id: pick-task-sequence-stale-station
    parent_entity: PickStation
    write_endpoint: "POST /fleet/pick-tasks/{id}/sequence"
    occ_field: "expected_station_version"
    description: |
      Sequencing a PickTask into a PickStation whose version has advanced since
      the client last observed it is rejected. The queue snapshot the client
      used to pick a station is stale because another sequencing decision has
      already mutated queue_length and the sequencer state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: stow-place-stale-sku
    parent_entity: Sku
    write_endpoint: "POST /fleet/stow-tasks/{id}/place"
    occ_field: "expected_sku_version"
    description: |
      Placing a StowTask against a Sku whose version has advanced since the
      client observed it is rejected; velocity-class placement decisions depend
      on the current on-hand/reserved counters and the client's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: travel_cost_estimate
    trigger: "on PickTask dispatch (est_cost, planning variant) and again on deliver (actual_cost, execution variant)"
    algorithm: forward_looking
    formula: |
      base = manhattan(pod.zone.grid_x, pod.zone.grid_y, station.zone.grid_x, station.zone.grid_y)
      congestion = count of DriveUnits in status EN_ROUTE whose current PickTask's pod zone
                   intersects the straight-line corridor bounding box
      planning_variant:  cost = base * (1 + PLAN_CONGESTION_WEIGHT * min(congestion, CONGESTION_CAP))
      execution_variant: cost = base * (1 + EXEC_CONGESTION_WEIGHT * congestion)
                         with no cap applied and an additional DETOUR_FLAT added if the
                         carrying unit's home zone posture was RESTRICTED at dispatch time
    input_set: "PickTask + its Pod.zone + its PickStation.zone + all EN_ROUTE DriveUnits at evaluation instant"
    constants:
      PLAN_CONGESTION_WEIGHT: 0.10
      EXEC_CONGESTION_WEIGHT: 0.25
      CONGESTION_CAP: 3
      DETOUR_FLAT: 4
    precision: "2 decimal places, round_half_up"
    variants:
      - name: planning
        when: "PickTask dispatch, written to PickTask.est_cost"
        difference: "congestion term capped at CONGESTION_CAP; no DETOUR_FLAT"
      - name: execution
        when: "PickTask deliver, written to PickTask.actual_cost and applied to DriveUnit battery/odometer"
        difference: "congestion term uncapped; DETOUR_FLAT added when origin zone was RESTRICTED at dispatch"

  - name: stow_density_score
    trigger: "on POST /fleet/stow-tasks/{id}/place to rank candidate pods"
    algorithm: weighted_scoring
    formula: |
      For each candidate pod p (status IN_STORAGE or RESERVED, zone posture != FROZEN,
      and either has an existing InventorySlot for the sku or slots_used < slot_capacity):
        density_term   = (p.slots_used / p.slot_capacity)
        distance_term  = manhattan(p.zone.grid_x, p.zone.grid_y, 0, 0)
        access_term    = mean accessibility_rank over existing slots of this sku on p
                         (or NEW_SLOT_ACCESS_BASE when no slot exists)
        density_first_variant:      score = 0.6*density_term - 0.3*distance_term*0.01 - 0.1*access_term*0.1
        accessibility_first_variant: score = 0.6*(1 - access_term*0.1) - 0.3*distance_term*0.01 + 0.1*density_term
      Select the pod with the highest score; tie-break by Pod.created_at ASC; never by Pod.id.
    input_set: "all Pods with status IN_STORAGE or RESERVED whose zone posture != FROZEN"
    constants:
      NEW_SLOT_ACCESS_BASE: 3
    precision: "4 decimal places, round_half_up"
    variants:
      - name: density_first
        when: "Sku.velocity_class == LOW"
        difference: "weights favor filling pods densely"
      - name: accessibility_first
        when: "Sku.velocity_class in {HIGH, MEDIUM}"
        difference: "weights favor low accessibility_rank slots"

  - name: workload_smoothing_sequence
    trigger: "on PickTask CREATED -> QUEUED to assign sequence_index within a station queue"
    algorithm: weighted_scoring
    formula: |
      For candidate insertion positions k = 0..queue_length at the station:
        est_finish(k)   = station_base_rate_seconds * (k + 1)
        lateness(k)     = max(0, est_finish(k) - seconds_until(task.order.cutoff_at))
        disruption(k)   = sum over existing queued tasks t of |t.sequence_index - new_index(t, k)|
                          (reordering penalty)
        fatigue(k)      = station.tasks_completed_today * FATIGUE_WEIGHT per position walked
        score(k) = LATENESS_WEIGHT * lateness(k) + DISRUPTION_WEIGHT * disruption(k) + fatigue(k)
      Insert at the k minimizing score(k); ties break to the LARGER k (least disruptive).
    input_set: "the target PickStation's non-terminal PickTasks and the new task"
    constants:
      LATENESS_WEIGHT: 5
      DISRUPTION_WEIGHT: 2
      FATIGUE_WEIGHT: 1
      STATION_BASE_RATE_SECONDS: 120
    precision: "integer sequence_index"

  - name: charge_cycle_credit
    trigger: "on POST /fleet/charging-sessions/{id}/close to compute charge_credit_pct"
    algorithm: aggregation
    formula: |
      duration_minutes = (ended_at - started_at) in whole minutes, floor
      per_tier credits, computed per tier THEN rounded per tier THEN summed
      (round-per-tier-then-sum; the reverse order is forbidden):
        tier1 = round_half_up(min(duration_minutes, 30) * RATE_T1, 0)
        tier2 = round_half_up(max(0, min(duration_minutes, 90) - 30) * RATE_T2, 0)
        tier3 = round_half_up(max(0, duration_minutes - 90) * RATE_T3, 0)
        charge_credit_pct = tier1 + tier2 + tier3
    input_set: "the closing ChargingSession"
    constants:
      RATE_T1: 0.5
      RATE_T2: 0.3
      RATE_T3: 0.1
    precision: "integer percent, round_half_up per tier before summation"

  - name: throughput_projection
    trigger: "on ShiftPlan create and on any mutation to orders, stations, or fleet for the plan date"
    algorithm: forward_looking
    formula: |
      Evaluation order is pinned to break the circular-looking dependency:
        step 1: active_fleet   = count of DriveUnits in status {ACTIVE, EN_ROUTE, AT_STATION, PARKED}
        step 2: picker_capacity = staffed_pickers * PICKS_PER_PICKER_HOUR * HOURS_IN_SHIFT
        step 3: fleet_capacity  = active_fleet * UNITS_PER_TRIP * TRIPS_PER_HOUR * HOURS_IN_SHIFT
        step 4: open_demand     = sum of OrderLine.quantity - quantity_picked over orders
                                  in status {RECEIVED, PLANNED, IN_PROGRESS} whose cutoff_at's
                                  UTC calendar date equals the ShiftPlan.plan_date
        step 5: projected_units = min(picker_capacity, fleet_capacity, open_demand)
        step 6: feasible        = projected_units >= planned_units
      Step 5 references step 4 which references orders that may themselves depend on
      feasibility; the pinned order (demand computed BEFORE projection) makes it well-defined.
    input_set: "ShiftPlan + DriveUnits + CustomerOrders whose plan window falls on plan_date"
    constants:
      PICKS_PER_PICKER_HOUR: 120
      UNITS_PER_TRIP: 6
      TRIPS_PER_HOUR: 4
      HOURS_IN_SHIFT: 8
    precision: "integer units"
    variants:
      - name: pessimistic
        when: "used for ShiftPlan.feasible"
        difference: "fleet_capacity uses active_fleet minus units in CHARGING or MAINTENANCE"
      - name: optimistic
        when: "used for management reporting endpoint only"
        difference: "fleet_capacity counts CHARGING units at half rate"

  - name: fleet_selector
    trigger: "on POST /fleet/pick-tasks/{id}/dispatch to choose a DriveUnit"
    algorithm: weighted_scoring
    formula: |
      Eligibility filter: DriveUnit.status == ACTIVE AND battery_pct >= BATTERY_MIN_DISPATCH
        AND no ACTIVE MaintenanceWindow covers the unit at the current logical clock
        AND the unit's home_zone posture != FROZEN.
      Ranking expression: score = battery_pct * 2 - manhattan(unit.home_zone, pod.zone) * 1
        - (charge_cycle_count * CYCLE_PENALTY).
      Tie-break: highest score wins; on exact score tie, DriveUnit.created_at ASC; never DriveUnit.id.
      Empty pool: ERR_NO_ELIGIBLE_DRIVE_UNIT.
    input_set: "all DriveUnits at evaluation instant"
    constants:
      BATTERY_MIN_DISPATCH: 20
      CYCLE_PENALTY: 1
    precision: "selector only"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path-templated id resolves to an existing entity, evaluated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every body-referenced FK (pod_id, sku_id, station_id, zone_id, exception_id, charger_id, drive_unit_id, line_id, order_id) resolves to an existing entity"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints"
  - priority: 5
    category: state
    check: "target entity is in a status from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "no human-entry or release-promotion action may proceed while a safety interlock is engaged (FROZEN zone, open FloorException gating, stranded robot, segregation-of-duties violation)"
    error_id: ERR_SAFETY_INTERLOCK
    http_status: 422
    applies_to: "POST /fleet/human-entry-permits/{id}/grant, POST /fleet/software-releases/{id}/promote, POST /fleet/floor-exceptions/{id}/resolve"
  - priority: 7
    category: business_referential
    check: "entity references satisfy referential shape: PickTask.line belongs to PickTask.order; HumanEntryPermit.exception is TRIAGED_HUMAN; FloorException drive_unit_id required iff kind=STRANDED_ROBOT"
    error_id: ERR_REFERENTIAL_MISMATCH
    http_status: 422
    applies_to: "POST /fleet/pick-tasks, POST /fleet/human-entry-permits, POST /fleet/floor-exceptions"
  - priority: 8
    category: business_constraint
    check: "temporal intervals valid: ends_at > starts_at (half-open) or >= (closed); new MaintenanceWindow has at least MAINT_BUFFER_MINUTES=15 minutes gap to any existing non-cancelled window for the same unit (half-open semantics, adjacency with gap=15 exactly is allowed)"
    error_id: ERR_TEMPORAL_CONFLICT
    http_status: 422
    applies_to: "POST /fleet/maintenance-windows, POST /fleet/human-entry-permits, POST /fleet/charging-sessions"
  - priority: 9
    category: business_constraint
    check: "resource capacity: station queue_length < max_queue on sequence; charger slots_in_use < slot_count on open; pod has capacity for a new slot; zone ACTIVE permit count < max_human_occupancy"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /fleet/pick-tasks/{id}/sequence, POST /fleet/charging-sessions, POST /fleet/stow-tasks/{id}/place, POST /fleet/human-entry-permits/{id}/grant"
  - priority: 10
    category: business_fiscal
    check: "inventory availability: InventorySlot.quantity - quantity_reserved >= requested PickTask.quantity; Sku.total_units_on_hand - total_units_reserved >= line remainder"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 422
    applies_to: "POST /fleet/pick-tasks, POST /fleet/pick-tasks/{id}/sequence"
  - priority: 11
    category: state
    check: "optimistic concurrency: expected_<parent>_version matches the parent's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fleet/pick-tasks/{id}/sequence, POST /fleet/stow-tasks/{id}/place"

