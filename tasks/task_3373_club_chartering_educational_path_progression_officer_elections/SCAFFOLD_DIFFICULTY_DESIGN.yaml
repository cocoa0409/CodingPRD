  - rule_id: resource_temporal_overlap
    instances:
      - name: meeting_interval_intersection_with_one_sided_buffer
        grounds:
          - calculations.meeting_overlap_window
          - validations[priority=8]
          - state_machines.MeetingEvent.SCHEDULED_to_CANCELLED
          - entities.MeetingEvent.fields.scheduled_at
        distinguishing_aspect: |
          This overlap rule sits on MeetingEvent and uses half-open interval intersection plus a
          one-sided 30-minute buffer: a candidate that starts while meeting A is still running is
          refused, and once meeting A is CANCELLED the identical candidate is accepted because a
          cancelled meeting no longer occupies the window.
