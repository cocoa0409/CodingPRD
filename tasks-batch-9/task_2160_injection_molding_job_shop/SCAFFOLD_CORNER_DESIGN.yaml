            - { call: "POST /ppap-submissions/${ppap_id}/submit", payload: { fai_dimensional_pass: true, fai_sample_shots: 30 }, as: QualityEngineer, as_user_id: "qe-alice" }
          assert:
            - "the first submit returns status 422 and ${err_id} == ERR_FAI_NOT_PASSED"
            - "the second submit returns status 422 and ${err_id2} == ERR_FAI_NOT_PASSED"
