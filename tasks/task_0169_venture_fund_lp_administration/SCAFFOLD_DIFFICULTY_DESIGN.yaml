  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: fee_accrual_period_half_open_overlap
        grounds:
          - validations[priority=9]
          - entities.ManagementFeeAccrual.fields.period_start
          - entities.ManagementFeeAccrual.fields.period_end
        distinguishing_aspect: |
          On ManagementFeeAccrual, intervals are half-open [start,end): two periods that share only the
          boundary endpoint do NOT overlap, but a period whose interior intersects an existing one DOES —
          a strictly-interior-intersection rule, rejected with ERR_FEE_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "Fund with an ACCRUED accrual 2024-01-01..2024-04-01; a new accrual 2024-02-15..2024-05-01 intersects its interior."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP U", lp_type: "INSTITUTION", tax_id_last4: "9015" }
              as: FundAdministrator
              captures: { lpu_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "FeeOverlap Fund", vintage_year: 2024, target_size_cents: 6000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { fof_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${fof_id}", lp_id: "${lpu_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { foc_id: "$.data.id" }
            - call: "POST /commitments/${foc_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /funds/${fof_id}/fee-accruals"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2024-04-01T00:00:00Z" }
              as: FundAdministrator
              captures: { foaccr1_id: "$.data.id" }
          trigger:
            - call: "POST /funds/${fof_id}/fee-accruals"
              payload: { period_start: "2024-02-15T00:00:00Z", period_end: "2024-05-01T00:00:00Z" }
              as: FundAdministrator
              captures: { fo_err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_FEE_PERIOD_OVERLAP"

      - name: valuation_mark_strictly_later_date_conflict
        grounds:
          - validations[priority=10]
          - entities.ValuationMark.fields.as_of_date
          - state_machines.ValuationMark.DRAFT_to_FINAL
        distinguishing_aspect: |
          On ValuationMark (a different resource with point-in-time interval semantics rather than
          ranged periods): a new mark's as_of_date must be STRICTLY later than the current FINAL mark's
          date; an equal-or-earlier date collides with ERR_MARK_DATE_CONFLICT — a single-point boundary,
          not a ranged half-open overlap.
        test_recipe:
          setup:
            - "Investment with a FINAL mark dated 2024-06-30; a second DRAFT mark dated 2024-06-30 (equal) is finalized."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP V", lp_type: "INSTITUTION", tax_id_last4: "9016" }
              as: FundAdministrator
              captures: { lpv_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "MarkConflict Fund", vintage_year: 2024, target_size_cents: 5000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { mcf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${mcf_id}", lp_id: "${lpv_id}", committed_cents: 5000000 }
              as: FundManager
              captures: { mcc_id: "$.data.id" }
            - call: "POST /commitments/${mcc_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /portfolio-companies"
              payload: { name: "Eta", sector: "Media" }
              as: FundManager
              captures: { mcpc_id: "$.data.id" }
            - call: "POST /investments"
              payload: { fund_id: "${mcf_id}", portfolio_company_id: "${mcpc_id}", cost_basis_cents: 3000000, ownership_pct_bps: 1000 }
              as: FundManager
              captures: { mcinv_id: "$.data.id" }
            - call: "POST /valuation-marks"
              payload: { investment_id: "${mcinv_id}", as_of_date: "2024-06-30T00:00:00Z", fair_value_cents: 3500000, methodology: "LAST_ROUND" }
              as: FundAdministrator
              captures: { mcmark1_id: "$.data.id" }
            - call: "POST /valuation-marks/${mcmark1_id}/finalize"
              payload: {}
              as: FundAdministrator
            - call: "POST /valuation-marks"
              payload: { investment_id: "${mcinv_id}", as_of_date: "2024-06-30T00:00:00Z", fair_value_cents: 4000000, methodology: "DCF" }
              as: FundAdministrator
              captures: { mcmark2_id: "$.data.id" }
          trigger:
            - call: "POST /valuation-marks/${mcmark2_id}/finalize"
              payload: {}
              as: FundAdministrator
              captures: { mc_err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_MARK_DATE_CONFLICT"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: distribution_reverse_conserves_commitment_distributed
        grounds:
          - state_machines.DistributionEvent.DECLARED_to_REVERSED
          - entities.Commitment.fields.distributed_cents
          - entities.DistributionAllocation.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = each Commitment.distributed_cents. A DECLARED distribution that is
          REVERSED (forward declare + compensating reverse) leaves every Commitment.distributed_cents
          equal to its pre-declaration value (0 here), with no ledger drift — distributed_cents only
          counts DECLARED/PAID events and the reverse zeroes the allocations.
        test_recipe:
          setup:
            - "Fund with one funded commitment (drawn 5000000, distributed 0); a realized investment to back a distribution."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP W", lp_type: "INSTITUTION", tax_id_last4: "9017" }
              as: FundAdministrator
              captures: { lpw_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "ReverseInv Fund", vintage_year: 2024, target_size_cents: 5000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { rif_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${rif_id}", lp_id: "${lpw_id}", committed_cents: 5000000 }
              as: FundManager
              captures: { ric_id: "$.data.id" }
            - call: "POST /commitments/${ric_id}/accept"
              payload: {}
              as: FundManager
            - call: "GET /funds/${rif_id}"
              payload: {}
              as: FundManager
              captures: { rif_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${rif_id}", purpose: "INVESTMENT", called_amount_cents: 5000000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${rif_v1}" }
              as: FundManager
              captures: { ri_call_id: "$.data.id" }
            - call: "GET /capital-calls/${ri_call_id}/allocations"
              payload: {}
              as: FundAdministrator
              captures: { rial_id: "$.data[0].id", rial_amt: "$.data[0].allocated_amount_cents" }
            - call: "POST /capital-call-allocations/${rial_id}/fund"
              payload: { paid_amount_cents: "${rial_amt}" }
              as: FundAdministrator
            - call: "POST /portfolio-companies"
              payload: { name: "Theta", sector: "Travel" }
              as: FundManager
              captures: { ripc_id: "$.data.id" }
            - call: "POST /investments"
              payload: { fund_id: "${rif_id}", portfolio_company_id: "${ripc_id}", cost_basis_cents: 5000000, ownership_pct_bps: 1000 }
              as: FundManager
              captures: { riinv_id: "$.data.id" }
            - call: "POST /investments/${riinv_id}/realize"
              payload: { realized_proceeds_cents: 6000000 }
              as: FundManager
            - call: "GET /funds/${rif_id}"
              payload: {}
              as: FundManager
              captures: { rif_v2: "$.data.version" }
            - call: "POST /distribution-events"
              payload: { fund_id: "${rif_id}", source_investment_id: "${riinv_id}", gross_amount_cents: 2000000, distribution_type: "RETURN_OF_CAPITAL", expected_fund_version: "${rif_v2}" }
              as: FundManager
              captures: { ri_evt_id: "$.data.id" }
          trigger:
            - call: "POST /distribution-events/${ri_evt_id}/reverse"
              payload: {}
              as: FundManager
              captures: { ri_rev_status: "$.data.status" }
          assert:
            - "DistributionEvent.${ri_evt_id}.status == REVERSED"
            - "Commitment.${ric_id}.distributed_cents == 0"

      - name: recycling_recall_conserves_total_capital
        grounds:
          - state_machines.DistributionEvent.PAID_to_RECALLED
          - calculations.recycle_distribution
          - entities.Commitment.fields.drawn_cents
          - entities.Commitment.fields.unfunded_cents
        distinguishing_aspect: |
          Conserved quantity = total capital position per commitment (drawn_cents + unfunded_cents ==
          committed_cents). A recall (compensating against the prior draw) reduces drawn_cents by exactly
          the recalled share and restores unfunded_cents by the same amount, so committed_cents is unchanged —
          a different conserved quantity than distributed_cents in instance 1.
        test_recipe:
          setup:
            - "Fund recycling_cap 12000 bps; one commitment committed 5000000, fully drawn 5000000 (unfunded 0)."
            - "A PAID recyclable distribution of lp_share 2000000 to that single commitment."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP X", lp_type: "INSTITUTION", tax_id_last4: "9018" }
              as: FundAdministrator
