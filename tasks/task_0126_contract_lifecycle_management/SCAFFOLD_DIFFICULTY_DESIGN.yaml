  - rule_id: transitive_cascade
    instances:
      - name: redline_cascade_supersede_void_deny_depth3
        grounds:
          - state_machines.Contract.UNDER_REVIEW_to_REDLINING
          - state_machines.ApprovalWorkflow.PENDING_to_VOIDED
          - state_machines.DeviationApproval.PENDING_to_DENIED
          - state_machines.ContractVersion.PROPOSED_to_SUPERSEDED
        distinguishing_aspect: |
          DEPTH-3 cascade triggered by creating a new version while UNDER_REVIEW: (A) version-create
          -> (B) prior ContractVersion SUPERSEDED, which itself -> (C) the workflow pinned to it VOIDED,
          which itself -> (D) PENDING DeviationApprovals on the superseded version DENIED. Each hop is
          caused by the previous hop, not directly by the original create.
        test_recipe:
          setup:
            - "Contract UNDER_REVIEW on version v1 with a PENDING workflow and a PENDING DeviationApproval pinned to v1."
          setup_api_calls:
            - call: "POST /organizations"
              payload: { name: "CascOrg", risk_appetite_threshold: 60, auto_renew_lead_days: 30 }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /clause-templates"
              payload: { organization_id: "${org_id}", clause_key: "LIABILITY_CAP", category: "LIABILITY", standard_text: "std", risk_weight: 40, is_mandatory: false }
              as: ClauseLibrarian
              captures: { liab_id: $.data.id }
            - call: "POST /contract-templates"
              payload: { organization_id: "${org_id}", name: "T", clause_template_ids: ["${liab_id}"], default_term_months: 12, auto_renew_default: false }
              as: ClauseLibrarian
              captures: { ctpl_id: $.data.id }
            - call: "POST /contracts"
              payload: { organization_id: "${org_id}", contract_template_id: "${ctpl_id}", counterparty_name: "CP", title: "Casc", term_months: 12, auto_renew: false }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "INTERNAL", clauses: [ { clause_template_id: "${liab_id}", text: "edit", is_deviation: true } ], expected_contract_version: "${c_v0}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { ver1_id: $.data.id, c_v1: $.data.version }
            - call: "POST /contracts/${contract_id}/deviation-approvals"
              payload: { contract_id: "${contract_id}", contract_version_id: "${ver1_id}", clause_template_id: "${liab_id}", justification: "ok" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { dev_id: $.data.id }
            - call: "POST /contracts/${contract_id}/submit"
              payload: { expected_contract_version: "${c_v1}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { c_v2: $.data.version }
            - call: "GET /contracts/${contract_id}/approval-workflows"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { wf_id: $.data.0.id }
          trigger:
            - call: "POST /contracts/${contract_id}/versions"
              payload: { contract_id: "${contract_id}", authored_by_party: "COUNTERPARTY", clauses: [ { clause_template_id: "${liab_id}", text: "redline2", is_deviation: true } ], expected_contract_version: "${c_v2}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { ver2_id: $.data.id }
            - call: "GET /contracts/${contract_id}/versions"
              payload: { status: "SUPERSEDED" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { superseded0_id: $.data.0.id, superseded0_status: $.data.0.status }
            - call: "GET /approval-workflows/${wf_id}"
              payload: {}
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { wf_status: $.data.status }
            - call: "GET /contracts/${contract_id}/deviation-approvals"
              payload: { contract_version_id: "${ver1_id}" }
              as: ContractManager
              as_user_id: "mgr-1"
              captures: { dev_status: $.data.0.status }
          assert:
            - "ContractVersion v1 (${ver1_id}).status == SUPERSEDED (hop B)"
            - "ApprovalWorkflow ${wf_id}.status == VOIDED (hop C, caused by supersede)"
            - "DeviationApproval ${dev_id}.status == DENIED (hop D, caused by supersede)"

