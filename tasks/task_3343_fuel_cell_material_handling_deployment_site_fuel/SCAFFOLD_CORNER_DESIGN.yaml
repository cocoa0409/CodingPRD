              as: SiteManager
              captures: { st: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "CONSTRUCTION", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pc: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "FIRE", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pf: $.data.id }
            - call: "POST /api/stations/${st}/permits/${pc}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/permits/${pf}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/start-construction"
              payload: {}
              as: SiteManager
            - call: "POST /api/stations/${st}/commission"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/fueling-events"
              payload: { forklift_id: "FL-C3", occurred_at: "2026-10-05T08:00:00Z", kg_dispensed: 150, supply_contract_id: "${c}" }
              as: SiteManager
              captures: { fe: $.data.id }
            - call: "POST /api/invoices"
              payload: { site_id: "${site_id}", supply_contract_id: "${c}", period_start: "2026-10-01", period_end: "2026-11-01" }
              as: BillingOperator
              captures: { inv: $.data.id, v0: $.data.version }
            - call: "POST /api/invoices/${inv}/line-items"
              payload: { fueling_event_id: "${fe}", expected_invoice_version: "${v0}" }
              as: BillingOperator
          trigger:
            - call: "POST /api/invoices/${inv}/issue"
              payload: {}
              as: BillingOperator
          assert:
            - "line: 100 kg at 2.50 + 50 kg at 2.30 blended 2.4333 -> ROUND_HALF_UP(150 x 2.4333 x 100) = 36499.5 -> 36500 cents subtotal"
            - "after issue: credit_cents == 0 (no shortfall) and total_cents == subtotal_cents"
      - name: availability_no_agreement_zero_credit
        claim_type: input_set_filtering
        grounds:
          - calculations.availability_credit
        distinguishing_aspect: "Availability report for a month with no ACTIVE ServiceAgreement returns credit_cents 0 and guarantee_pct null even when availability is below any plausible threshold — the agreement is part of the input set."
        test_recipe:
          setup: ["Site with APPROVED assessment forklift_count 1, downtime 200 h for 2026-10, NO service agreement"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-CL3", name: "Calc Site 3", address: "3 Calc Rd", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments"
              payload: { forklift_count: 1, duty_cycle_hours_per_day: 8.0, peak_shift_hours: 8, safety_findings_json: "{\"ok\": true}" }
              as: SiteManager
              captures: { ass: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments/${ass}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/assessments/${ass}/approve"
              payload: {}
              as: SafetyOfficer
            - call: "POST /api/sites/${site_id}/downtime-reports"
              payload: { month: "2026-10", forklift_id: "FL-D1", downtime_hours: 200 }
              as: SiteManager
          trigger:
            - call: "GET /api/sites/${site_id}/availability-report"
              payload: { month: "2026-10" }
              as: BillingOperator
              captures: { pct: $.data.availability_pct, cred: $.data.credit_cents, guar: $.data.guarantee_pct }
          assert:
            - "availability_pct == 72.6 (ROUND_HALF_UP(100*(1-200/730),2))"
            - "credit_cents == 0 and guarantee_pct == null (no ACTIVE agreement)"
      - name: invoice_availability_component_added_at_issue
        claim_type: variant_divergence
        grounds:
          - calculations.invoice_availability_reconciliation
        distinguishing_aspect: "An issued invoice's final credit includes the availability component: DRAFT provisional credit is take-or-pay only (0 here), while ISSUED credit adds the 200000-cent availability credit — clamped to the 5000-cent subtotal so total_cents clamps at 0."
        test_recipe:
          setup:
            - "Site with APPROVED assessment forklift_count 1; ACTIVE agreement (guarantee 90, fee 2000000); 146 downtime hours in 2026-10; ACTIVE PIPELINE contract base 2.50 committed 10; invoice with one 20 kg line (no shortfall)"
          setup_api_calls:
