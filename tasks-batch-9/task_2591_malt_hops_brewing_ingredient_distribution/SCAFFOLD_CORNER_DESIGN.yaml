      - name: a_line_cannot_draw_on_another_brewers_contract
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=8]
          - errors.ERR_CONTRACT_BREWER_MISMATCH
        distinguishing_aspect: "Ownership is checked between the LINE's contract and the ORDER's brewer, not against the caller: an AllocationManager building an order for brewer A is refused when the named contract belongs to brewer B, even though the desk itself is entitled to touch both."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewers A and B; OPEN 2026 program; Citra; a 5000 lb FIXED_CROP_YEAR Citra contract owned by brewer B."
            - "A DRAFT order owned by brewer A, created by the allocation desk."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Mismatch Brewer A", brewery_license_no: "BR-1023", credit_terms_days: 30, credit_limit_cents: 9000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { mm_a_id: $.data.id }
            - call: "POST /brewers"
              payload: { name: "Mismatch Brewer B", brewery_license_no: "BR-1024", credit_terms_days: 30, credit_limit_cents: 9000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { mm_b_id: $.data.id }
            - call: "POST /crop-year-programs"
