# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2538 - Electric Vehicle Battery Warranty & State-of-Health Diagnostics
#
# 9 rule_id blocks x 2 instances = 18 instances.
# Every numeric literal in an `assert:` line below was computed by executing the
# corresponding §1.3 formula against the pinned setup, using the reference price-book
# defaults declared in §1.1 (labor rate 18333 c/h, module part 145000, reman pack 890000,
# UN3480 4000 / UN3481 2500 / UN3536 18000 per 100 kg, diagnostic fee 12000).
# Default logical clock before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: soh_retention_telematics_window_vs_bench_derated_basis
        grounds:
          - calculations.soh_retention
          - calculations.temperature_correction_factor
          - entities.SohAssessment.fields.nominal_basis_kwh
          - entities.SohAssessment.fields.estimated_capacity_kwh
          - entities.SohAssessment.fields.retention_pct
          - entities.SohAssessment.fields.qualifies_for_claim
          - entities.BatteryModule.fields.status
        distinguishing_aspect: |
          Both variants measure the SAME physical quantity - 56.000 kWh of usable pack capacity on
          a 16-module 80.000 kWh pack with modules 3 and 7 faulted - yet TELEMATICS_FLEET divides by
          the full beginning-of-life 80.000 kWh basis and returns 70.00 %, while
          BENCH_CAPACITY_TEST first derates the basis to 70.000 kWh for the two faulted modules and
          returns 80.00 %; the 10.00-point gap flips qualifies_for_claim from true to false.
        test_recipe:
          setup:
            - "A warranty program on the reference price book: coverage 96 months / 100000 miles, retention schedule [(48 mo, 50000 mi, 80.00 %), (96 mo, 100000 mi, 70.00 %)], snapshot_window_size 5, snapshot_min_count 3, snapshot_freshness_days 30."
            - "Two identical vehicles in service 2020-03-10 (76 elapsed months at the default clock), each with its own NEW 80.000 kWh 16-module pack installed."
            - "Vehicle A carries five fresh VALID telematics snapshots whose corrected capacities are 55.000 / 56.000 / 56.000 / 56.000 / 57.000 kWh at 20.0 C coolant (correction factor 1.00), so the trimmed mean of the middle three is exactly 56.000 kWh."
            - "Vehicle B carries one fresh VALID snapshot for odometer purposes only; its bench rig measured exactly 56.000 kWh."
            - "Both assessments fault modules 3 and 7, so the bench basis is derated to 80.000 * 14 / 16 = 70.000 kWh."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center", region_code: "US-WEST", hv_certification_level: "L3", has_pack_lift: true, hv_bay_count: 2, labor_rate_cents_per_hour: 18333, insulation_tester_cal_due_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/service-centers/${center_id}/technicians"
              payload: { full_name: "Tech A", hv_cert_level: "L3", cert_expires_at: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech_a_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000001", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10", model_code: "MX-90", region_code: "US-WEST" }
              as: ProgramAdmin
              captures: { veh_a_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000002", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10", model_code: "MX-90", region_code: "US-WEST" }
              as: ProgramAdmin
              captures: { veh_b_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-0001", pack_type: "NEW", nominal_capacity_kwh: 80.000, module_count: 16, gross_weight_kg: 483.296, stock_region_code: "US-WEST", installed_vehicle_id: "${veh_a_id}" }
              as: ProgramAdmin
              captures: { pack_a_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-0002", pack_type: "NEW", nominal_capacity_kwh: 80.000, module_count: 16, gross_weight_kg: 483.296, stock_region_code: "US-WEST", installed_vehicle_id: "${veh_b_id}" }
              as: ProgramAdmin
              captures: { pack_b_id: $.data.id }
            - call: "POST /battery-warranty/vehicles/${veh_a_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-20T00:00:00Z", odometer_miles: 71000, reported_capacity_kwh: 55.000, charge_cycles: 400, max_cell_delta_mv: 40, coolant_temp_c: 20.0, dcfc_session_count: 120 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_a_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-22T00:00:00Z", odometer_miles: 71200, reported_capacity_kwh: 56.000, charge_cycles: 402, max_cell_delta_mv: 40, coolant_temp_c: 20.0, dcfc_session_count: 121 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_a_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-24T00:00:00Z", odometer_miles: 71400, reported_capacity_kwh: 56.000, charge_cycles: 404, max_cell_delta_mv: 40, coolant_temp_c: 20.0, dcfc_session_count: 122 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_a_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-26T00:00:00Z", odometer_miles: 71600, reported_capacity_kwh: 56.000, charge_cycles: 406, max_cell_delta_mv: 40, coolant_temp_c: 20.0, dcfc_session_count: 123 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_a_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-28T00:00:00Z", odometer_miles: 71800, reported_capacity_kwh: 57.000, charge_cycles: 408, max_cell_delta_mv: 40, coolant_temp_c: 20.0, dcfc_session_count: 124 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_b_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-28T00:00:00Z", odometer_miles: 71800, reported_capacity_kwh: 56.000, charge_cycles: 408, max_cell_delta_mv: 40, coolant_temp_c: 20.0, dcfc_session_count: 124 }
              as: TelematicsGateway
            - call: "GET /battery-warranty/vehicles/${veh_a_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { veh_a_ver: $.data.version }
            - call: "GET /battery-warranty/vehicles/${veh_b_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { veh_b_ver: $.data.version }
          trigger:
            - call: "POST /battery-warranty/soh-assessments"
              payload: { vehicle_id: "${veh_a_id}", pack_id: "${pack_a_id}", technician_id: "${tech_a_id}", variant: "TELEMATICS_FLEET", expected_vehicle_version: "${veh_a_ver}", module_fault_positions: [3, 7] }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { asm_tele_id: $.data.id }
            - call: "POST /battery-warranty/soh-assessments"
              payload: { vehicle_id: "${veh_b_id}", pack_id: "${pack_b_id}", technician_id: "${tech_a_id}", variant: "BENCH_CAPACITY_TEST", expected_vehicle_version: "${veh_b_ver}", bench_measured_capacity_kwh: 56.000, module_fault_positions: [3, 7] }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { asm_bench_id: $.data.id }
          assert:
            - "SohAssessment.${asm_tele_id}.diagnostic_validity == VALID"
            - "SohAssessment.${asm_tele_id}.window_snapshot_count == 5"
            - "SohAssessment.${asm_tele_id}.estimated_capacity_kwh == 56.000"
            - "SohAssessment.${asm_tele_id}.nominal_basis_kwh == 80.000"
            - "SohAssessment.${asm_tele_id}.retention_pct == 70.00"
            - "SohAssessment.${asm_tele_id}.assessed_odometer_miles == 71800"
            - "SohAssessment.${asm_tele_id}.elapsed_months == 76"
            - "SohAssessment.${asm_tele_id}.coverage_position == IN_COVERAGE"
            - "SohAssessment.${asm_tele_id}.applicable_min_retention_pct == 70.00"
            - "SohAssessment.${asm_tele_id}.qualifies_for_claim == true"
            - "SohAssessment.${asm_bench_id}.diagnostic_validity == VALID"
            - "SohAssessment.${asm_bench_id}.estimated_capacity_kwh == 56.000"
            - "SohAssessment.${asm_bench_id}.nominal_basis_kwh == 70.000"
            - "SohAssessment.${asm_bench_id}.retention_pct == 80.00"
            - "SohAssessment.${asm_bench_id}.qualifies_for_claim == false"
            - "SohAssessment.${asm_bench_id}.retention_pct - SohAssessment.${asm_tele_id}.retention_pct == 10.00"

      - name: settlement_full_coverage_vs_goodwill_prorated_cost_share
        grounds:
          - calculations.claim_settlement
          - calculations.remedy_cost_estimate
          - calculations.elapsed_coverage_position
          - entities.WarrantyClaim.fields.settlement_variant
          - entities.WarrantyClaim.fields.proration_factor
          - entities.WarrantyClaim.fields.owner_share_cents
          - entities.WarrantyClaim.fields.admin_fee_cents
          - entities.WarrantyProgram.fields.accrued_liability_cents
        distinguishing_aspect: |
          This dual variant lives on a different entity domain from soh_retention: it allocates MONEY
          on a WarrantyClaim rather than measuring CAPACITY on a SohAssessment. Two claims with the
          identical remedy_cost_cents of 363092 settle differently - FULL_COVERAGE puts 0 on the
          owner and 370592 on the OEM (7500 admin fee), while GOODWILL_PRORATED at factor 0.5333
          puts 193637 on the owner and only 169455 on the OEM, whose lower oem_share_cents also
          drops it out of the 200000-cent admin-fee tier entirely.
        test_recipe:
          setup:
            - "One program on the reference price book (goodwill 12 months / 15000 miles, admin-fee tiers 0 / 7500 / 15000 at the 200000 and 500000 oem_share boundaries)."
            - "Vehicle A in service 2020-03-10, assessed odometer 71800 -> 76 elapsed months -> IN_COVERAGE."
            - "Vehicle B in service 2018-01-15, assessed odometer 108000 -> 102 elapsed months -> GOODWILL_BAND (6 months over on a 12-month allowance, 8000 miles over on a 15000-mile allowance)."
            - "Both packs are NEW 80.000 kWh 16-module 483.296 kg packs at a center whose labor rate is 18333 cents/hour; both assessments fault modules 3 and 7 and return retention 70.00 %, so each claim is recommended MODULE_REPLACEMENT with 2 faulted modules."
