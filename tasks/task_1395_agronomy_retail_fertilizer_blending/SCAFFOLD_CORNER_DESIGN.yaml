              payload: { season: "FALL", price_per_ton_cents: 44500, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_mop: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_mop}/publish"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/prepay-programs"
              payload: { name: "FALL-2026 PREPAY", season: "FALL", enrollment_open_on: "2026-07-01T00:00:00Z", enrollment_close_on: "2026-10-31T00:00:00Z", funding_deadline: "2026-11-15T23:59:59Z", deposit_pct: 0.30, discount_pct: 0.05, default_penalty_pct: 0.10 }
              as: BranchAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/prepay-contracts"
              payload: { prepay_program_id: "${pg_id}", product_id: "${p_mop}", committed_tons: 20, expected_grower_version: "${g_v}" }
              as: Grower
              as_user_id: "${g_id}"
