scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: retained_vs_contingent_fee_basis_diverge_on_identical_placement
        grounds:
          - calculations.engagement_fee_base
          - calculations.invoice_tranche_allocation
          - entities.Invoice.fields.gross_amount_cents
          - entities.Engagement.fields.billed_gross_cents
          - state_machines.SearchAssignment.PROGRESS_BILLED_to_COMPLETION_BILLED
          - state_machines.SearchAssignment.UNBILLED_to_COMPLETION_BILLED
        distinguishing_aspect: |
          Entity domain = fee accounting on Engagement/Invoice. Two RETAINED/CONTINGENT engagements
          are driven through an identical placement (target comp 24,000,000; actual comp 26,000,000):
          the RETAINED reading bills 3 invoices totalling 9,100,000 gross (tier flips to the premium
          rate on the ACTUAL basis), while the CONTINGENT reading bills a single invoice of 6,500,000
          gross. Same placement data, two algorithms, different money.
        test_recipe:
          setup:
            - "Two consultants: a Partner (approves offers) and a Consultant (runs the searches)."
            - "Three companies: client_r (RETAINED client), client_c (CONTINGENT client), target (both candidates' employer)."
            - "Two fee schedules with identical rates, differing only in engagement_type."
            - "Engagement E_R (RETAINED) and E_C (CONTINGENT), both ACTIVE."
            - "Assignment A_R under E_R and A_C under E_C, each positions_total=1, target_first_year_comp_cents=24,000,000."
            - "One candidate per assignment, both employed at `target`, each driven to a Placement with actual_first_year_comp_cents = 26,000,000 and start_date_at 2026-06-01."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Pat Partner", seniority: "PARTNER" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Cara Consultant", seniority: "PRINCIPAL" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Client R Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_r_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Client C Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_c_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Zenith Ltd", industry: "Industrials" }
              as: PlatformAdmin
              captures: { target_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "Retained Std", engagement_type: "RETAINED", base_fee_pct: 0.30, premium_fee_pct: 0.35, tier_threshold_cents: 25000000, contingent_fee_pct: 0.25, retainer_pct: 0.35, progress_pct: 0.35, admin_fee_pct: 0.02, guarantee_days: 180, off_limits_days: 365, client_protection_days: 730 }
              as: PlatformAdmin
              captures: { fs_r_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "Contingent Std", engagement_type: "CONTINGENT", base_fee_pct: 0.30, premium_fee_pct: 0.35, tier_threshold_cents: 25000000, contingent_fee_pct: 0.25, retainer_pct: 0.35, progress_pct: 0.35, admin_fee_pct: 0.02, guarantee_days: 180, off_limits_days: 365, client_protection_days: 730 }
              as: PlatformAdmin
              captures: { fs_c_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_company_id: "${client_r_id}", fee_schedule_id: "${fs_r_id}", fee_cap_cents: 20000000, min_offer_fit_score: 7.0 }
              as: Partner
              as_user_id: "${p_id}"
              captures: { eng_r_id: $.data.id }
            - call: "POST /engagements/${eng_r_id}/activate"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
            - call: "POST /engagements"
              payload: { client_company_id: "${client_c_id}", fee_schedule_id: "${fs_c_id}", fee_cap_cents: 20000000, min_offer_fit_score: 7.0 }
              as: Partner
              as_user_id: "${p_id}"
              captures: { eng_c_id: $.data.id }
            - call: "POST /engagements/${eng_c_id}/activate"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
            - call: "POST /search-assignments"
              payload: { engagement_id: "${eng_r_id}", role_title: "CFO", positions_total: 1, target_first_year_comp_cents: 24000000 }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { asg_r_id: $.data.id }
            - call: "POST /search-assignments"
              payload: { engagement_id: "${eng_c_id}", role_title: "CTO", positions_total: 1, target_first_year_comp_cents: 24000000 }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { asg_c_id: $.data.id }
            - call: "POST /target-companies"
              payload: { assignment_id: "${asg_r_id}", company_id: "${target_id}", rationale: "Peer set" }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "POST /target-companies"
