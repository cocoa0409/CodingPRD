              as: SellerRep
              as_user_id: "${sel_id}"
              captures: { f_id: $.data.id }
            - call: "POST /upfront/inventory-forecasts/${f_id}/publish"
              payload: {}
              as: SellerRep
              as_user_id: "${sel_id}"
            - call: "POST /upfront/negotiations"
              payload: { campaign_id: "${c_id}", seller_id: "${sel_id}", channel_allocation_id: "${al_id}", market: "UPFRONT", channel: "LINEAR_TV", requested_impressions: 1000000, opening_cpm_cents: 2000, guarantee_pct: 100, make_good_provision: "MAKE_GOOD_UNITS", option_pct_ceiling: 25 }
              as: AgencyBuyer
              as_user_id: "buyer-01"
              captures: { n_id: $.data.id, n_v1: $.data.version }
            - call: "POST /upfront/negotiations/${n_id}/counter"
