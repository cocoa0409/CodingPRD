            - "GET /msr/portfolios/${pf_id}/loans shows every loan back at escrow_balance_cents 100000 and suspense_balance_cents 25000 — the per-loan split, not just the pooled total"
            - "invariant after the rollback: 4 * (100000 + 25000) + 0 + 0 == 500000, byte-identical to the opening figure"
            - "re-running map-escrow reproduces exactly 400000 and 100000, so the cycle can be taken any number of times with no drift"
            - "POST /msr/servicing-transfers/${st_id}/reconcile in the rolled-back state returns 409 ERR_ESCROW_NOT_MAPPED"

      - name: holdback_clawback_rewinds_the_release_split_without_drift
        grounds:
          - state_machines.PurchaseAgreement.transitions[HOLDBACK_RELEASED -> SETTLED]
          - calculations.complaint_concentration_release
          - entities.PurchaseAgreement.fields.holdback_cents
          - entities.PurchaseAgreement.fields.holdback_retained_cents
          - entities.PurchaseAgreement.fields.holdback_released_cents
          - entities.PurchaseAgreement.fields.holdback_applied_cents
          - validations[priority=48]
          - concurrency_rules[holdback-release-stale-agreement]
        distinguishing_aspect: |
          The conserved quantity is a THREE-WAY CASH SPLIT on a single row — holdback_cents must always
          equal retained + released + applied — and the compensation also rewinds a STATE
          (HOLDBACK_RELEASED back to SETTLED), which the escrow instance does not do at the status
          level. It is also the only instance where the compensating call carries an amount and is
          therefore itself validated: a clawback must return the full released balance, so a partial
          amount or an amount above the released balance is refused and the invariant is never left
          straddling two states.
        test_recipe:
          setup:
            - "Fixture T is transferred and COMPLETED with no ErrorResolutionCase at all, so the concentration ratio is 0.00 and the tier permits a 100 percent release."
            - "holdback_cents is 28320, all retained; holdback_release_eligible_at is 2026-10-01 and the indemnification period runs to 2026-10-16."
            - "The clock is set to 2026-10-01, inside the release window but before indemnification expiry, so the release lands in HOLDBACK_RELEASED rather than CLOSED."
            - "The release is filed by co-002 and the clawback by co-002 as well; co-001 attested the notices."
