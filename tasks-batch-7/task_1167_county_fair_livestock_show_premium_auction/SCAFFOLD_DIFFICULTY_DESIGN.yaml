# =============================================================================
# Task 1167: County Fair Livestock Show & Premium Auction — §1.8 Test Targeting Index
# 2 instances per Difficulty Rule (18 total). Every ${var} is bound by an
# earlier captures: line in the same instance; all formula-derived asserts are
# precomputed literals.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: premium_provisional_vs_final_under_purse_shortfall
        grounds:
          - calculations.premium_award_amount
          - entities.PremiumAward.fields.provisional_amount_cents
          - entities.PremiumAward.fields.final_amount_cents
        distinguishing_aspect: |
          PremiumAward domain: identical placing data yields provisional 12000/10000 at
          placing time but final 5454/4545 at run-settlement because the purse
          (10000) is oversubscribed (outstanding 22000, scale 5/11, floor rounding).
        test_recipe:
          setup:
            - "Fair with premium_budget_cents=10000, large_class_min_entries=8 (no bonus), posture SETTLEMENT"
            - "Two MARKET_STEER entries placed rank 1 and rank 2 in one class; awards ACCRUED with provisional 12000 and 10000"
          setup_api_calls:
            - { call: "POST /v1/fairs", payload: { name: "Fair R1A", ownership_deadline_at: "2026-06-01T00:00:00Z", possession_deadline_at: "2026-06-15T00:00:00Z", premium_budget_cents: 10000, commission_rate: 0.05, buyer_premium_rate: 0.03, yardage_fee_cents: 1500, premium_cap_cents: 60000, large_class_min_entries: 8, large_class_bonus_rate: 0.10, premium_schedule: { MARKET_STEER: { grand_champion_cents: 50000, reserve_champion_cents: 30000, rank_1_cents: 12000, rank_2_cents: 10000, rank_3_cents: 8000, other_rank_cents: 4000 }, MARKET_SWINE: { grand_champion_cents: 40000, reserve_champion_cents: 24000, rank_1_cents: 10000, rank_2_cents: 8000, rank_3_cents: 6000, other_rank_cents: 3000 }, MARKET_LAMB: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 }, MARKET_GOAT: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 } }, state_qualify_rank: { MARKET_STEER: 2, MARKET_SWINE: 2, MARKET_LAMB: 2, MARKET_GOAT: 2 }, sale_rank_threshold: { MARKET_STEER: 3, MARKET_SWINE: 3, MARKET_LAMB: 3, MARKET_GOAT: 3 }, species_sale_order: [MARKET_STEER, MARKET_SWINE, MARKET_LAMB, MARKET_GOAT] }, as: FairBoardAdmin, captures: { fair_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_OPEN }, as: FairBoardAdmin }
            - { call: "POST /v1/exhibitors", payload: { fair_id: "${fair_id}", full_name: "Ann A", organization: FFA }, as: FairBoardAdmin, captures: { exh_a: $.data.id } }
            - { call: "POST /v1/exhibitors", payload: { fair_id: "${fair_id}", full_name: "Ben B", organization: FOUR_H }, as: FairBoardAdmin, captures: { exh_b: $.data.id } }
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_a}", species: MARKET_STEER, tag_number: "S-001", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_a}", captures: { entry_a: $.data.id } }
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_b}", species: MARKET_STEER, tag_number: "S-002", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_b}", captures: { entry_b: $.data.id } }
            - { call: "POST /v1/entries/${entry_a}/verify", payload: { decision: APPROVE }, as: FairBoardAdmin }
            - { call: "POST /v1/entries/${entry_b}/verify", payload: { decision: APPROVE }, as: FairBoardAdmin }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_LOCKED }, as: FairBoardAdmin }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: WEIGH_IN }, as: FairBoardAdmin }
            - { call: "GET /v1/entries/${entry_a}", as: FairBoardAdmin, captures: { ev_a: $.data.version } }
            - { call: "POST /v1/weigh-tickets", payload: { entry_id: "${entry_a}", weight_lbs: 1200, weighed_at: "2026-07-01T10:00:00Z", expected_entry_version: "${ev_a}" }, as: WeighMaster }
            - { call: "GET /v1/entries/${entry_b}", as: FairBoardAdmin, captures: { ev_b: $.data.version } }
            - { call: "POST /v1/weigh-tickets", payload: { entry_id: "${entry_b}", weight_lbs: 1250, weighed_at: "2026-07-01T10:05:00Z", expected_entry_version: "${ev_b}" }, as: WeighMaster }
            - { call: "POST /v1/classes", payload: { fair_id: "${fair_id}", species: MARKET_STEER, class_code: "STEER-A", weight_min_lbs: 1000, weight_max_lbs: 1500, capacity: 5 }, as: FairBoardAdmin, captures: { class_a: $.data.id } }
            - { call: "POST /v1/entries/${entry_a}/classify", payload: { class_id: "${class_a}" }, as: ShowClerk }
            - { call: "POST /v1/entries/${entry_b}/classify", payload: { class_id: "${class_a}" }, as: ShowClerk }
            - { call: "POST /v1/judges", payload: { fair_id: "${fair_id}", full_name: "Judge Jo", qualified_species: [MARKET_STEER] }, as: FairBoardAdmin, captures: { judge_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: SHOWING }, as: FairBoardAdmin }
            - { call: "POST /v1/ring-slots", payload: { fair_id: "${fair_id}", class_id: "${class_a}", ring_name: "MAIN", starts_at: "2026-07-10T09:00:00Z", ends_at: "2026-07-10T10:00:00Z" }, as: ShowClerk, captures: { slot_id: $.data.id, slot_v: $.data.version } }
            - { call: "POST /v1/ring-slots/${slot_id}/assign-judge", payload: { judge_id: "${judge_id}", expected_ring_slot_version: "${slot_v}" }, as: ShowClerk }
            - { call: "POST /v1/ring-slots/${slot_id}/start", as: ShowClerk }
            - { call: "POST /v1/ring-slots/${slot_id}/placings", payload: { placings: [ { entry_id: "${entry_a}", rank: 1, award: NONE }, { entry_id: "${entry_b}", rank: 2, award: NONE } ] }, as: Judge, as_user_id: "${judge_id}" }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: AUCTION }, as: FairBoardAdmin }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: SETTLEMENT }, as: FairBoardAdmin }
          trigger:
            - { call: "POST /v1/fairs/${fair_id}/run-settlement", as: FairBoardAdmin }
            - { call: "GET /v1/premium-awards?entry_id=${entry_a}", as: FairBoardAdmin, captures: { pa_prov: "$.data[0].provisional_amount_cents", pa_fin: "$.data[0].final_amount_cents" } }
            - { call: "GET /v1/premium-awards?entry_id=${entry_b}", as: FairBoardAdmin, captures: { pb_prov: "$.data[0].provisional_amount_cents", pb_fin: "$.data[0].final_amount_cents" } }
          assert:
            - "PremiumAward(entry_a).provisional_amount_cents == 12000"
            - "PremiumAward(entry_a).final_amount_cents == 5454 (floor(12000 * 10000/22000))"
            - "PremiumAward(entry_b).provisional_amount_cents == 10000"
            - "PremiumAward(entry_b).final_amount_cents == 4545 (floor(10000 * 10000/22000))"
            - "provisional != final for both awards (22000 outstanding vs 10000 purse)"
      - name: payout_provisional_vs_final_with_addon_sweep
        grounds:
          - calculations.exhibitor_payout
          - entities.AuctionLot.fields.provisional_payout_cents
          - entities.AuctionLot.fields.final_payout_cents
        distinguishing_aspect: |
          AuctionLot payout domain (different entity domain than PremiumAward): the
          provisional payout at close-sold excludes add-ons (93500), while the final
          payout at run-settlement includes the non-VOID add-on pledge (113500) —
          identical lot data, two valid algorithms, different results.
        test_recipe:
          setup:
            - "Fair (budget 100000) advanced to AUCTION; one MARKET_STEER entry SHOWN with rank 1"
            - "Buyer registered with credit_limit_cents=200000"
          setup_api_calls:
            - { call: "POST /v1/fairs", payload: { name: "Fair R1B", ownership_deadline_at: "2026-06-01T00:00:00Z", possession_deadline_at: "2026-06-15T00:00:00Z", premium_budget_cents: 100000, commission_rate: 0.05, buyer_premium_rate: 0.03, yardage_fee_cents: 1500, premium_cap_cents: 60000, large_class_min_entries: 8, large_class_bonus_rate: 0.10, premium_schedule: { MARKET_STEER: { grand_champion_cents: 50000, reserve_champion_cents: 30000, rank_1_cents: 12000, rank_2_cents: 10000, rank_3_cents: 8000, other_rank_cents: 4000 }, MARKET_SWINE: { grand_champion_cents: 40000, reserve_champion_cents: 24000, rank_1_cents: 10000, rank_2_cents: 8000, rank_3_cents: 6000, other_rank_cents: 3000 }, MARKET_LAMB: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 }, MARKET_GOAT: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 } }, state_qualify_rank: { MARKET_STEER: 2, MARKET_SWINE: 2, MARKET_LAMB: 2, MARKET_GOAT: 2 }, sale_rank_threshold: { MARKET_STEER: 3, MARKET_SWINE: 3, MARKET_LAMB: 3, MARKET_GOAT: 3 }, species_sale_order: [MARKET_STEER, MARKET_SWINE, MARKET_LAMB, MARKET_GOAT] }, as: FairBoardAdmin, captures: { fair_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_OPEN }, as: FairBoardAdmin }
            - { call: "POST /v1/exhibitors", payload: { fair_id: "${fair_id}", full_name: "Ann A", organization: FFA }, as: FairBoardAdmin, captures: { exh_a: $.data.id } }
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_a}", species: MARKET_STEER, tag_number: "S-001", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_a}", captures: { entry_a: $.data.id } }
            - { call: "POST /v1/entries/${entry_a}/verify", payload: { decision: APPROVE }, as: FairBoardAdmin }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_LOCKED }, as: FairBoardAdmin }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: WEIGH_IN }, as: FairBoardAdmin }
            - { call: "GET /v1/entries/${entry_a}", as: FairBoardAdmin, captures: { ev_a: $.data.version } }
            - { call: "POST /v1/weigh-tickets", payload: { entry_id: "${entry_a}", weight_lbs: 1200, weighed_at: "2026-07-01T10:00:00Z", expected_entry_version: "${ev_a}" }, as: WeighMaster }
            - { call: "POST /v1/classes", payload: { fair_id: "${fair_id}", species: MARKET_STEER, class_code: "STEER-A", weight_min_lbs: 1000, weight_max_lbs: 1500, capacity: 5 }, as: FairBoardAdmin, captures: { class_a: $.data.id } }
            - { call: "POST /v1/entries/${entry_a}/classify", payload: { class_id: "${class_a}" }, as: ShowClerk }
            - { call: "POST /v1/judges", payload: { fair_id: "${fair_id}", full_name: "Judge Jo", qualified_species: [MARKET_STEER] }, as: FairBoardAdmin, captures: { judge_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: SHOWING }, as: FairBoardAdmin }
            - { call: "POST /v1/ring-slots", payload: { fair_id: "${fair_id}", class_id: "${class_a}", ring_name: "MAIN", starts_at: "2026-07-10T09:00:00Z", ends_at: "2026-07-10T10:00:00Z" }, as: ShowClerk, captures: { slot_id: $.data.id, slot_v: $.data.version } }
            - { call: "POST /v1/ring-slots/${slot_id}/assign-judge", payload: { judge_id: "${judge_id}", expected_ring_slot_version: "${slot_v}" }, as: ShowClerk }
            - { call: "POST /v1/ring-slots/${slot_id}/start", as: ShowClerk }
            - { call: "POST /v1/ring-slots/${slot_id}/placings", payload: { placings: [ { entry_id: "${entry_a}", rank: 1, award: NONE } ] }, as: Judge, as_user_id: "${judge_id}" }
            - { call: "POST /v1/buyers", payload: { fair_id: "${fair_id}", business_name: "Packers Inc", credit_limit_cents: 200000 }, as: FairBoardAdmin, captures: { buyer_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: AUCTION }, as: FairBoardAdmin }
            - { call: "POST /v1/auction-lots/generate", payload: { fair_id: "${fair_id}" }, as: Auctioneer }
            - { call: "GET /v1/auction-lots?entry_id=${entry_a}", as: FairBoardAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /v1/auction-lots/${lot_id}/open", as: Auctioneer }
          trigger:
            - { call: "POST /v1/auction-lots/${lot_id}/close-sold", payload: { buyer_id: "${buyer_id}", hammer_price_cents: 100000 }, as: Auctioneer, captures: { prov_payout: $.data.provisional_payout_cents } }
            - { call: "POST /v1/add-ons", payload: { lot_id: "${lot_id}", buyer_id: "${buyer_id}", amount_cents: 20000 }, as: Buyer, as_user_id: "${buyer_id}" }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: SETTLEMENT }, as: FairBoardAdmin }
            - { call: "POST /v1/fairs/${fair_id}/run-settlement", as: FairBoardAdmin }
            - { call: "GET /v1/auction-lots/${lot_id}", as: FairBoardAdmin, captures: { fin_payout: $.data.final_payout_cents } }
          assert:
            - "AuctionLot.provisional_payout_cents == 93500 (100000 - round_half_up(100000*0.05) - 1500)"
            - "AuctionLot.final_payout_cents == 113500 (100000 + 20000 - 5000 - 1500)"
            - "provisional_payout_cents != final_payout_cents (delta exactly the 20000 add-on)"
  - rule_id: combinatorial_formula
    instances:
      - name: premium_tiered_conditional_bonus_and_cap
        grounds:
          - calculations.premium_award_amount
          - entities.Fair.fields.premium_schedule
          - entities.Fair.fields.large_class_min_entries
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — base selected by a
          conditional ladder on (award, rank), bonus gated on class placed_count,
          then nested min() against premium_cap_cents. GRAND_CHAMPION rank-1 in a
          2-entry class with large_class_min_entries=2 yields 50000 + 5000 = 55000;
          rank-2 yields 10000 + 1000 = 11000.
        test_recipe:
          setup:
            - "Fair with large_class_min_entries=2, large_class_bonus_rate=0.10, premium_cap_cents=60000, budget 100000"
            - "One MARKET_STEER class with exactly 2 classified entries; placings: entry_a rank 1 GRAND_CHAMPION, entry_b rank 2 NONE"
          setup_api_calls:
            - { call: "POST /v1/fairs", payload: { name: "Fair R2A", ownership_deadline_at: "2026-06-01T00:00:00Z", possession_deadline_at: "2026-06-15T00:00:00Z", premium_budget_cents: 100000, commission_rate: 0.05, buyer_premium_rate: 0.03, yardage_fee_cents: 1500, premium_cap_cents: 60000, large_class_min_entries: 2, large_class_bonus_rate: 0.10, premium_schedule: { MARKET_STEER: { grand_champion_cents: 50000, reserve_champion_cents: 30000, rank_1_cents: 12000, rank_2_cents: 10000, rank_3_cents: 8000, other_rank_cents: 4000 }, MARKET_SWINE: { grand_champion_cents: 40000, reserve_champion_cents: 24000, rank_1_cents: 10000, rank_2_cents: 8000, rank_3_cents: 6000, other_rank_cents: 3000 }, MARKET_LAMB: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 }, MARKET_GOAT: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 } }, state_qualify_rank: { MARKET_STEER: 2, MARKET_SWINE: 2, MARKET_LAMB: 2, MARKET_GOAT: 2 }, sale_rank_threshold: { MARKET_STEER: 3, MARKET_SWINE: 3, MARKET_LAMB: 3, MARKET_GOAT: 3 }, species_sale_order: [MARKET_STEER, MARKET_SWINE, MARKET_LAMB, MARKET_GOAT] }, as: FairBoardAdmin, captures: { fair_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_OPEN }, as: FairBoardAdmin }
            - { call: "POST /v1/exhibitors", payload: { fair_id: "${fair_id}", full_name: "Ann A", organization: FFA }, as: FairBoardAdmin, captures: { exh_a: $.data.id } }
            - { call: "POST /v1/exhibitors", payload: { fair_id: "${fair_id}", full_name: "Ben B", organization: FOUR_H }, as: FairBoardAdmin, captures: { exh_b: $.data.id } }
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_a}", species: MARKET_STEER, tag_number: "S-001", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_a}", captures: { entry_a: $.data.id } }
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_b}", species: MARKET_STEER, tag_number: "S-002", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_b}", captures: { entry_b: $.data.id } }
            - { call: "POST /v1/entries/${entry_a}/verify", payload: { decision: APPROVE }, as: FairBoardAdmin }
            - { call: "POST /v1/entries/${entry_b}/verify", payload: { decision: APPROVE }, as: FairBoardAdmin }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_LOCKED }, as: FairBoardAdmin }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: WEIGH_IN }, as: FairBoardAdmin }
            - { call: "GET /v1/entries/${entry_a}", as: FairBoardAdmin, captures: { ev_a: $.data.version } }
            - { call: "POST /v1/weigh-tickets", payload: { entry_id: "${entry_a}", weight_lbs: 1200, weighed_at: "2026-07-01T10:00:00Z", expected_entry_version: "${ev_a}" }, as: WeighMaster }
            - { call: "GET /v1/entries/${entry_b}", as: FairBoardAdmin, captures: { ev_b: $.data.version } }
            - { call: "POST /v1/weigh-tickets", payload: { entry_id: "${entry_b}", weight_lbs: 1250, weighed_at: "2026-07-01T10:05:00Z", expected_entry_version: "${ev_b}" }, as: WeighMaster }
            - { call: "POST /v1/classes", payload: { fair_id: "${fair_id}", species: MARKET_STEER, class_code: "STEER-A", weight_min_lbs: 1000, weight_max_lbs: 1500, capacity: 5 }, as: FairBoardAdmin, captures: { class_a: $.data.id } }
            - { call: "POST /v1/entries/${entry_a}/classify", payload: { class_id: "${class_a}" }, as: ShowClerk }
            - { call: "POST /v1/entries/${entry_b}/classify", payload: { class_id: "${class_a}" }, as: ShowClerk }
            - { call: "POST /v1/judges", payload: { fair_id: "${fair_id}", full_name: "Judge Jo", qualified_species: [MARKET_STEER] }, as: FairBoardAdmin, captures: { judge_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: SHOWING }, as: FairBoardAdmin }
            - { call: "POST /v1/ring-slots", payload: { fair_id: "${fair_id}", class_id: "${class_a}", ring_name: "MAIN", starts_at: "2026-07-10T09:00:00Z", ends_at: "2026-07-10T10:00:00Z" }, as: ShowClerk, captures: { slot_id: $.data.id, slot_v: $.data.version } }
            - { call: "POST /v1/ring-slots/${slot_id}/assign-judge", payload: { judge_id: "${judge_id}", expected_ring_slot_version: "${slot_v}" }, as: ShowClerk }
            - { call: "POST /v1/ring-slots/${slot_id}/start", as: ShowClerk }
            - { call: "POST /v1/ring-slots/${slot_id}/placings", payload: { placings: [ { entry_id: "${entry_a}", rank: 1, award: GRAND_CHAMPION }, { entry_id: "${entry_b}", rank: 2, award: NONE } ] }, as: Judge, as_user_id: "${judge_id}" }
          trigger:
            - { call: "GET /v1/premium-awards?entry_id=${entry_a}", as: FairBoardAdmin, captures: { pa_prov: "$.data[0].provisional_amount_cents" } }
            - { call: "GET /v1/premium-awards?entry_id=${entry_b}", as: FairBoardAdmin, captures: { pb_prov: "$.data[0].provisional_amount_cents" } }
            - { call: "GET /v1/fairs/${fair_id}", as: FairBoardAdmin, captures: { pool: $.data.available_premium_pool_cents } }
          assert:
            - "PremiumAward(entry_a).provisional_amount_cents == 55000 (base 50000 + round_half_up(50000*0.10)=5000 bonus, min(55000, 60000))"
            - "PremiumAward(entry_b).provisional_amount_cents == 11000 (base 10000 + 1000 bonus)"
            - "Fair.available_premium_pool_cents == 34000 (100000 - 55000 - 11000)"
      - name: invoice_per_line_premium_rounding_order
        grounds:
          - calculations.invoice_totals
          - entities.Invoice.fields.buyer_premium_cents
          - entities.Invoice.fields.total_due_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order (different mode than the tiered premium
          formula): per-line round_half_up(hammer * 0.03) then sum gives 30 + 31 = 61,
          while the alternative sum-then-round gives round_half_up(2050 * 0.03) = 62;
          the scaffold pins per-line-then-sum, so total_due_cents == 2111, not 2112.
        test_recipe:
          setup:
            - "Fair advanced to SETTLEMENT; one steer entry and one lamb entry each SHOWN with rank 1 and sold to the same buyer for hammer 1010 and 1040"
