  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: instant_pay_cascades_claim_payment_ledger_cohort_giveback
        grounds:
          - state_machines.Claim.FNOL_SUBMITTED_to_AUTO_APPROVED
          - state_machines.Claim.AUTO_APPROVED_to_PAID
          - calculations.retained_claims_and_giveback
