    input: ["action_type?", "incident_status?", "transfer_inclusion_state?", "limit?", "offset?"]
    output: DisciplineIncident[]
    side_effects: []
  - method: GET
    path: "/records-office/discipline-incidents/{id}"
    description: "Reads one discipline incident including its current transfer_inclusion_state."
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer, Parent, EligibleStudent]
    code: 200
    input: []
    output: DisciplineIncident
    side_effects: []

  # ---- inter-district records requests ----------------------------------------------------
  - method: POST
    path: "/records-office/records-requests"
    description: >
      Files an inter-district records request. The statutory window is computed immediately from the
      RESPONDING district's state rule and recomputed once at validation.
    roles: [ReceivingRegistrar, RecordsOfficer]
    code: 201
    input: [student_id, requesting_district_id, responding_district_id, "request_priority?", "includes_special_education?", "sped_consent_on_file?", "authorization_reference?"]
    output: RecordsRequest
    side_effects:
      - "status := RECEIVED; received_at := clock_now; reopen_count := 0; packet_status := NONE; is_overdue := false"
      - "request_priority defaults to STANDARD; includes_special_education and sped_consent_on_file default to false"
      - "statutory_days_allowed and statutory_due_at computed per calculations.records_request_due_at"
      - "responding District.open_request_count recomputed"
  - method: GET
    path: "/records-office/records-requests"
    description: >
      Lists records requests with filters. The single FK-reverse channel for all three of this
      entity's foreign keys (student, requesting district, responding district).
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer, ReceivingRegistrar]
    code: 200
    input: ["student_id?", "requesting_district_id?", "responding_district_id?", "status?", "is_overdue?", "limit?", "offset?"]
    output: RecordsRequest[]
    side_effects: []
  - method: GET
    path: "/records-office/records-requests/{id}"
    description: "Reads one records request including its packet snapshot counters and statutory window."
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer, ReceivingRegistrar]
    code: 200
    input: []
    output: RecordsRequest
    side_effects: []
  - method: POST
    path: "/records-office/records-requests/{id}/validate"
    description: "Verifies the receiving district's enrollment authorization and freezes the statutory window."
    roles: [RecordsOfficer]
    code: 200
    input: [authorization_verified]
    output: RecordsRequest
    side_effects:
      - "authorization_verified stored; status := VALIDATED"
      - "statutory_days_allowed and statutory_due_at recomputed from received_at (never from the validation instant) and frozen"
      - "the request immediately bubbles VALIDATED -> ASSEMBLING when the student's CumulativeFile.assembly_status IN {IN_ASSEMBLY, COMPLETE}"
  - method: POST
    path: "/records-office/records-requests/{id}/mark-ready"
    description: >
      Snapshots the transfer packet. Guarded by OCC against the student's CumulativeFile version, so
      any component mutation since the caller read the file invalidates the snapshot.
    roles: [RecordsOfficer]
    code: 200
    input: [expected_cumulative_file_version]
    output: RecordsRequest
    side_effects:
      - "both variants of calculations.discipline_inclusion_set run; included_incident_count, withheld_incident_count, receiving_state_inclusion_count stored and every DisciplineIncident.transfer_inclusion_state set"
      - "calculations.disclosure_packet_page_count runs; packet_page_count stored; packet_status := SNAPSHOT"
      - "CumulativeFile.last_packet_snapshot_at := clock_now and CumulativeFile.version += 1"
      - "status := READY_FOR_RELEASE"
  - method: POST
    path: "/records-office/records-requests/{id}/release"
    description: "Transmits the snapshotted packet and writes the FERPA disclosure log entry."
    roles: [RecordsOfficer]
    code: 200
    input: [transmission_method]
    output: RecordsRequest
    side_effects:
      - "status := RELEASED; released_at := clock_now; transmission_method stored"
      - "a DisclosureLogEntry is appended (INTERDISTRICT_TRANSFER / RECORDS_REQUEST / source_id := RecordsRequest.id / page_count := packet_page_count)"
      - "the student's RetentionSchedule.last_activity_at and destruction_eligible_at are recomputed and Student.records_disposition_date is re-mirrored"
      - "a WITHDRAWN student advances to TRANSFERRED_OUT; responding District.open_request_count recomputed"
  - method: POST
    path: "/records-office/records-requests/{id}/deny"
    description: "Denies the request from RECEIVED, VALIDATED or ASSEMBLING with a statutory reason."
    roles: [RecordsOfficer]
    code: 200
    input: [denial_reason]
    output: RecordsRequest
    side_effects:
      - "status := DENIED; denial_reason stored; responding District.open_request_count recomputed"
      - "no DisclosureLogEntry is written — a denial discloses nothing"

  # ---- parent / eligible-student inspection ----------------------------------------------
  - method: POST
    path: "/records-office/students/{id}/inspection-requests"
    description: >
      Files an inspection request. requester_role is derived from X-User-Role and requester_user_id
      from X-User-ID; the copy fee is priced and frozen at creation.
    roles: [Parent, EligibleStudent]
    code: 201
    input: [requested_categories, "copies_requested?"]
    output: InspectionRequest
    side_effects:
      - "status := SUBMITTED; copies_requested defaults to false"
      - "statutory_inspection_due_at := created_at + 45 calendar days"
      - "base_copy_fee_cents per calculations.inspection_copy_fee_cents (0 when copies_requested == false)"
      - "certification_fee_cents and fee_assessed_cents per calculations.inspection_fee_assessment; fee_collected_cents := 0, fee_waived_cents := 0, fee_outstanding_cents := fee_assessed_cents"
  - method: GET
    path: "/records-office/students/{id}/inspection-requests"
    description: "Lists the student's inspection requests (the FK-reverse channel from Student)."
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, Parent, EligibleStudent]
    code: 200
    input: ["status?", "requester_role?", "limit?", "offset?"]
    output: InspectionRequest[]
    side_effects: []
  - method: GET
    path: "/records-office/inspection-requests/{id}"
    description: "Reads one inspection request including its fee-custody counters and version."
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, Parent, EligibleStudent]
    code: 200
    input: []
    output: InspectionRequest
    side_effects: []
  - method: POST
    path: "/records-office/inspection-requests/{id}/appointments"
    description: >
      Books a review appointment. CREATE-with-supersede: the new appointment supersedes any prior
      SCHEDULED one, so the write is guarded by OCC on the InspectionRequest's version.
      Room occupancy uses CLOSED intervals padded by 15 minutes on each side.
    roles: [RecordsOfficer]
    code: 201
    input: [room_id, start_at, end_at, expected_inspection_request_version]
    output: ReviewAppointment
    side_effects:
      - "a ReviewAppointment is created with status SCHEDULED and duration_minutes := (end_at - start_at) in whole minutes"
      - "any prior SCHEDULED appointment of this request transitions to SUPERSEDED and releases its room interval"
      - "InspectionRequest.status := SCHEDULED and InspectionRequest.version += 1"
  - method: GET
    path: "/records-office/review-appointments"
    description: >
      Lists review appointments with filters. The single FK-reverse channel for both of this
      entity's foreign keys (inspection request, room).
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, Parent, EligibleStudent]
    code: 200
    input: ["inspection_request_id?", "room_id?", "status?", "limit?", "offset?"]
    output: ReviewAppointment[]
    side_effects: []
  - method: GET
    path: "/records-office/review-appointments/{id}"
    description: "Reads one review appointment."
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, Parent, EligibleStudent]
    code: 200
    input: []
    output: ReviewAppointment
    side_effects: []
  - method: POST
    path: "/records-office/review-appointments/{id}/attendance"
    description: "Records attendance at the review, completing the inspection and logging the disclosure."
    roles: [RecordsOfficer]
    code: 200
    input: [attended]
    output: ReviewAppointment
    side_effects:
      - "status := ATTENDED; attended_at := clock_now"
      - "parent InspectionRequest bubbles SCHEDULED -> COMPLETED with inspection_completed_at := clock_now"
      - "a DisclosureLogEntry is appended (PARENT_INSPECTION / INSPECTION_REQUEST / source_id := InspectionRequest.id)"
      - "when the student has a RetentionSchedule, last_activity_at and destruction_eligible_at are recomputed and Student.records_disposition_date is re-mirrored"
  - method: POST
    path: "/records-office/inspection-requests/{id}/fee-payments"
    description: >
      Records a copy-fee payment or a hardship waiver. The compensating pair PAYMENT/WAIVER must
      always leave fee_assessed_cents == fee_collected_cents + fee_waived_cents + fee_outstanding_cents.
    roles: [RecordsClerk, RecordsOfficer]
    code: 200
    input: [fee_transaction_type, amount_cents]
    output: InspectionRequest
    side_effects:
      - "PAYMENT: fee_collected_cents += amount_cents; WAIVER: fee_waived_cents += amount_cents"
      - "fee_outstanding_cents := fee_assessed_cents - fee_collected_cents - fee_waived_cents"
      - "fee_assessed_cents is never mutated; InspectionRequest.version += 1"

  # ---- amendment, hearing, statement of disagreement ---------------------------------------
  - method: POST
    path: "/records-office/students/{id}/amendment-requests"
    description: "Files an amendment request against one component of the student's cumulative file."
    roles: [Parent, EligibleStudent]
    code: 201
    input: [contested_component_id, contested_field, requested_change, rationale]
    output: AmendmentRequest
    side_effects:
      - "status := SUBMITTED; requester_user_id := X-User-ID; hearing_officer_id := null"
  - method: GET
    path: "/records-office/amendment-requests"
    description: >
      Lists amendment requests with filters. The single FK-reverse channel for all three of this
      entity's foreign keys (student, contested component, hearing officer).
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, Parent, EligibleStudent]
    code: 200
    input: ["student_id?", "contested_component_id?", "hearing_officer_id?", "status?", "limit?", "offset?"]
    output: AmendmentRequest[]
    side_effects: []
  - method: GET
    path: "/records-office/amendment-requests/{id}"
    description: "Reads one amendment request including both decision-maker ids and the hearing window."
    roles: [SystemAdmin, RecordsClerk, RecordsOfficer, ComplianceOfficer, Parent, EligibleStudent]
    code: 200
    input: [] 
    output: AmendmentRequest
    side_effects: []
  - method: POST
    path: "/records-office/amendment-requests/{id}/decisions"
    description: >
      Issues a decision. From SUBMITTED this is the initial decision (GRANT -> AMENDED,
      DENY -> DENIED). From HEARING_SCHEDULED it is the post-hearing decision (GRANT -> AMENDED,
      DENY -> UPHELD) and the acting X-User-ID must differ from initial_decided_by_user_id.
    roles: [RecordsOfficer]
    code: 200
    input: [outcome, "decision_note?"]
    output: AmendmentRequest
    side_effects:
      - "initial decision: initial_decided_by_user_id := X-User-ID; on DENY denied_at := clock_now and hearing_due_at := denied_at + rule.amendment_hearing_days calendar days"
      - "hearing decision: hearing_decided_by_user_id := X-User-ID"
      - "either GRANT path transitions the contested FileComponent CERTIFIED -> COLLECTED with amendment_count += 1 and fires the file/packet cascade"
  - method: POST
    path: "/records-office/amendment-requests/{id}/hearing-requests"
    description: "The rights-holder requests a hearing on a denied amendment, inside the statutory window."
    roles: [Parent, EligibleStudent]
    code: 200
    input: []
    output: AmendmentRequest
    side_effects:
      - "status := HEARING_REQUESTED"
  - method: POST
    path: "/records-office/amendment-requests/{id}/hearing-schedules"
    description: >
      Schedules or reschedules the hearing. Officer occupancy uses HALF-OPEN [start_at, end_at)
      intervals with no buffer — a hearing starting exactly when another ends is accepted — under a
      240-minute per-officer per-UTC-day cap.
    roles: [RecordsOfficer]
    code: 200
    input: [hearing_officer_id, hearing_start_at, hearing_end_at]
    output: AmendmentRequest
    side_effects:
      - "hearing_officer_id, hearing_start_at, hearing_end_at stored; hearing_duration_minutes := (hearing_end_at - hearing_start_at) in whole minutes"
      - "status := HEARING_SCHEDULED (a call from HEARING_SCHEDULED is a self-loop reschedule that first releases the previous interval)"
  - method: POST
    path: "/records-office/amendment-requests/{id}/statements"
    description: "Files the statement of disagreement after the hearing upheld the record."
    roles: [Parent, EligibleStudent]
    code: 200
    input: [statement_text]
    output: AmendmentRequest
    side_effects:
      - "statement_text stored; statement_filed_at := clock_now; status := STATEMENT_FILED"
      - "the contested FileComponent.statement_of_disagreement_present := true and its page_count += 1 (STATEMENT_PAGE_COUNT)"
      - "parent CumulativeFile page counters recomputed and version += 1"

  # ---- subpoenas and law-enforcement demands ----------------------------------------------
  - method: POST
    path: "/records-office/students/{id}/legal-demands"
    description: "Dockets a subpoena, grand-jury subpoena, law-enforcement request or ex parte order."
    roles: [LegalAffairsOfficer]
    code: 201
    input: [demand_type, issuing_authority, case_reference, production_scope, "notification_waived?", "waiver_basis?"]
    output: LegalDemand
    side_effects:
      - "status := RECEIVED; received_at := clock_now; notification_waived defaults to false"
      - "an EX_PARTE_ORDER in {RECEIVED, NOTIFIED} blocks release of any of the student's records requests"
  - method: GET
    path: "/records-office/students/{id}/legal-demands"
    description: "Lists the student's legal demands (the FK-reverse channel from Student)."
    roles: [SystemAdmin, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer]
    code: 200
    input: ["demand_type?", "status?", "limit?", "offset?"]
    output: LegalDemand[]
    side_effects: []
  - method: GET
    path: "/records-office/legal-demands/{id}"
    description: "Reads one legal demand including its notification and production timestamps."
    roles: [SystemAdmin, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer]
    code: 200
    input: []
    output: LegalDemand
    side_effects: []
  - method: POST
    path: "/records-office/legal-demands/{id}/notifications"
    description: "Notifies the parent or eligible student and opens the statutory waiting period."
    roles: [LegalAffairsOfficer]
    code: 200
    input: [notified_party]
    output: LegalDemand
    side_effects:
      - "notified_party recorded; notification_sent_at := clock_now"
      - "production_allowed_at := notification_sent_at + rule.notification_wait_days calendar days; status := NOTIFIED"
  - method: POST
    path: "/records-office/legal-demands/{id}/production"
    description: >
      Produces the records. Two branches: from NOTIFIED after the waiting period, or directly from
      RECEIVED when notification was lawfully waived.
    roles: [LegalAffairsOfficer]
    code: 200
    input: [produced_page_count]
    output: LegalDemand
    side_effects:
      - "status := PRODUCED; produced_at := clock_now; produced_page_count stored"
      - "a DisclosureLogEntry is appended (LEGAL_DEMAND / LEGAL_DEMAND / source_id := LegalDemand.id)"
      - "the student's RetentionSchedule.last_activity_at and destruction_eligible_at are recomputed and Student.records_disposition_date is re-mirrored"

  # ---- retention and destruction ----------------------------------------------------------
  - method: GET
    path: "/records-office/retention-schedules/{id}"
    description: "Reads one retention schedule, including both the governing and the advisory eligible dates."
    roles: [SystemAdmin, RecordsOfficer, ComplianceOfficer, LegalAffairsOfficer]
    code: 200
    input: []
    output: RetentionSchedule
    side_effects: []
  - method: POST
    path: "/records-office/retention-schedules/{id}/destruction"
    description: "Destroys the cumulative file under the retention schedule and certifies the method."
    roles: [ComplianceOfficer]
    code: 200
    input: [destruction_method, certification_note]
    output: RetentionSchedule
    side_effects:
      - "status := DESTROYED; destroyed_at := clock_now; destruction_method and certification_note stored"
      - "every FileComponent of the file has page_count := 0 and redacted_page_count := 0, so the file's total_page_count becomes 0"
      - "no DisclosureLogEntry is appended — destruction is not a disclosure"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- 400 payload -----------------------------------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "A required input field is missing or null, an enum value is outside its declared set, a numeric field is out of range, an instant is unparseable, or end_at <= start_at."
  - id: ERR_WAIVER_BASIS_REQUIRED
    http: 400
    condition: "notification_waived == true without a waiver_basis, waiver_basis supplied while notification_waived == false, or a waiver_basis that does not match the demand_type."

  # ---- 403 authorization -----------------------------------------------------------------
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is absent or is not listed in the endpoint's roles."
  - id: ERR_RIGHTS_TRANSFERRED
    http: 403
    condition: "A Parent acts on a student whose is_eligible_student == true; FERPA rights have transferred to the student."
  - id: ERR_RIGHTS_NOT_TRANSFERRED
    http: 403
    condition: "An EligibleStudent acts on a student whose is_eligible_student == false; rights still belong to the parent."
  - id: ERR_NOT_STUDENT_GUARDIAN
    http: 403
    condition: "X-User-ID does not match Student.guardian_user_id (Parent) or Student.student_user_id (EligibleStudent)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The post-hearing decision is issued by the same X-User-ID that issued the initial denial."
  - id: ERR_DISTRICT_MISMATCH
    http: 403
    condition: "A ReceivingRegistrar files a records request whose requesting_district_id is not their own district id."

  # ---- 404 existence ---------------------------------------------------------------------
  - id: ERR_DISTRICT_NOT_FOUND
    http: 404
    condition: "district_id in a path or body does not resolve."
  - id: ERR_STATE_RULE_NOT_FOUND
    http: 404
    condition: "No StateRecordsRule exists for the requested state_code, including when a District is created for an unconfigured state."
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student_id in a path or body does not resolve."
  - id: ERR_WITHDRAWAL_NOT_FOUND
    http: 404
    condition: "withdrawal_id does not resolve."
  - id: ERR_CUMULATIVE_FILE_NOT_FOUND
    http: 404
    condition: "cumulative_file_id does not resolve."
  - id: ERR_FILE_COMPONENT_NOT_FOUND
    http: 404
    condition: "component_id does not resolve, does not belong to the cumulative file in the path, or contested_component_id does not resolve."
  - id: ERR_DISCIPLINE_INCIDENT_NOT_FOUND
    http: 404
    condition: "discipline_incident_id does not resolve."
  - id: ERR_RECORDS_REQUEST_NOT_FOUND
    http: 404
    condition: "records_request_id does not resolve."
  - id: ERR_INSPECTION_ROOM_NOT_FOUND
    http: 404
    condition: "inspection_room_id or the body's room_id does not resolve."
  - id: ERR_INSPECTION_REQUEST_NOT_FOUND
    http: 404
    condition: "inspection_request_id does not resolve."
  - id: ERR_REVIEW_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "review_appointment_id does not resolve."
  - id: ERR_HEARING_OFFICER_NOT_FOUND
    http: 404
    condition: "hearing_officer_id in a path or body does not resolve."
  - id: ERR_AMENDMENT_REQUEST_NOT_FOUND
    http: 404
    condition: "amendment_request_id does not resolve."
  - id: ERR_LEGAL_DEMAND_NOT_FOUND
    http: 404
    condition: "legal_demand_id does not resolve."
  - id: ERR_RETENTION_SCHEDULE_NOT_FOUND
    http: 404
    condition: "retention_schedule_id does not resolve."

  # ---- 409 uniqueness --------------------------------------------------------------------
  - id: ERR_DUPLICATE_STATE_RULE
    http: 409
    condition: "A second StateRecordsRule is posted for a state_code that already has one."
  - id: ERR_DUPLICATE_DISTRICT_CODE
    http: 409
    condition: "district_code is already registered."
  - id: ERR_DUPLICATE_ROOM_CODE
    http: 409
    condition: "room_code is already registered."
  - id: ERR_OPEN_WITHDRAWAL_EXISTS
    http: 409
    condition: "The student already has a Withdrawal whose status != COMPLETED."
  - id: ERR_DUPLICATE_ACTIVE_REQUEST
    http: 409
    condition: "The student already has a non-terminal RecordsRequest from the same requesting district."

  # ---- 409 entity state ------------------------------------------------------------------
  - id: ERR_STUDENT_NOT_ENROLLED
    http: 409
    condition: "A withdrawal is opened for a student whose enrollment_status != ENROLLED."
  - id: ERR_WITHDRAWAL_ALREADY_COMPLETED
    http: 409
    condition: "A hold, hold release or completion is attempted on a COMPLETED withdrawal."
  - id: ERR_HOLD_ALREADY_ACTIVE
    http: 409
    condition: "The hold_type being placed is already in active_hold_types."
  - id: ERR_HOLD_NOT_ACTIVE
    http: 409
    condition: "The hold_type being released is not in active_hold_types."
  - id: ERR_COMPONENT_NOT_COLLECTED
    http: 409
    condition: "Certification is attempted on a component whose status != COLLECTED (including a PENDING component)."
  - id: ERR_COMPONENT_ALREADY_CERTIFIED
    http: 409
    condition: "Collection or certification is attempted on an already-CERTIFIED component."
  - id: ERR_COMPONENT_NOT_EXCLUDED
    http: 409
    condition: "Reinstatement to COLLECTED is attempted on a component whose status != EXCLUDED."
  - id: ERR_REQUEST_NOT_RECEIVED
    http: 409
    condition: "validate is called on a request whose status != RECEIVED."
  - id: ERR_REQUEST_NOT_ASSEMBLING
    http: 409
    condition: "mark-ready is called on a request whose status != ASSEMBLING, including one still parked in VALIDATED because the file has not started assembling."
  - id: ERR_REQUEST_NOT_READY
    http: 409
    condition: "release is called on a request whose status != READY_FOR_RELEASE, including one reopened to ASSEMBLING by a component change."
  - id: ERR_REQUEST_TERMINAL
    http: 409
    condition: "Any action is attempted on a RELEASED or DENIED request."
  - id: ERR_INSPECTION_ALREADY_COMPLETED
    http: 409
    condition: "An appointment is booked against a COMPLETED inspection request."
  - id: ERR_INSPECTION_EXPIRED
    http: 409
    condition: "An appointment is booked against an EXPIRED inspection request."
  - id: ERR_APPOINTMENT_NOT_SCHEDULED
    http: 409
    condition: "Attendance is recorded against an appointment whose status != SCHEDULED (SUPERSEDED, EXPIRED or already ATTENDED)."
  - id: ERR_AMENDMENT_NOT_SUBMITTED
    http: 409
    condition: "An initial decision is issued on an amendment request whose status != SUBMITTED."
  - id: ERR_AMENDMENT_NOT_DENIED
    http: 409
    condition: "A hearing is requested on an amendment request whose status != DENIED."
  - id: ERR_HEARING_NOT_SCHEDULED
    http: 409
    condition: "A hearing schedule or hearing decision is attempted from a status outside {HEARING_REQUESTED, HEARING_SCHEDULED}."
  - id: ERR_HEARING_NOT_HELD
    http: 409
    condition: "A post-hearing decision is issued while clock_now < hearing_end_at."
  - id: ERR_STATEMENT_ALREADY_FILED
    http: 409
    condition: "A second statement of disagreement is filed, or a statement is filed from a status other than UPHELD."
  - id: ERR_AMENDMENT_TERMINAL
    http: 409
    condition: "Any action is attempted on an AMENDED or STATEMENT_FILED amendment request."
  - id: ERR_DEMAND_NOT_RECEIVED
    http: 409
    condition: "A notification is sent for a demand whose status != RECEIVED."
  - id: ERR_NOTIFICATION_WAIVED
    http: 409
    condition: "A notification is sent for a demand whose notification_waived == true."
  - id: ERR_DEMAND_ALREADY_PRODUCED
    http: 409
    condition: "Notification or production is attempted on a PRODUCED demand."
  - id: ERR_RETENTION_NOT_ELIGIBLE
    http: 409
    condition: "Destruction is attempted on a schedule whose status == ACTIVE — the sweep has not marked it DESTRUCTION_ELIGIBLE."
  - id: ERR_ALREADY_DESTROYED
    http: 409
    condition: "Destruction is attempted on a DESTROYED schedule."
  - id: ERR_ROOM_CLOSED
    http: 409
    condition: "An appointment is booked in a room whose status == CLOSED."
  - id: ERR_OFFICER_INACTIVE
    http: 409
    condition: "A hearing is scheduled with a HearingOfficer whose status == INACTIVE."

  # ---- 409 cross-entity state ------------------------------------------------------------
  - id: ERR_WITHDRAWAL_NOT_CLEARED
    http: 409
    condition: "Completion is attempted while hold_count > 0, or while the Student is no longer WITHDRAWAL_PENDING."
  - id: ERR_FILE_NOT_COMPLETE
    http: 409
    condition: "mark-ready is attempted while the student's CumulativeFile.assembly_status != COMPLETE."
  - id: ERR_EX_PARTE_HOLD_ACTIVE
    http: 409
    condition: "Release is attempted while the student has an EX_PARTE_ORDER demand in {RECEIVED, NOTIFIED}."
  - id: ERR_COURT_SEALED_COMPONENT
    http: 409
    condition: "Release is attempted while a component is EXCLUDED with exclusion_reason SEALED_BY_COURT and the request was not denied as COURT_SEALED."
  - id: ERR_DESTRUCTION_HOLD_ACTIVE
    http: 409
    condition: "Destruction is attempted while the student has a non-terminal RecordsRequest or a LegalDemand in {RECEIVED, NOTIFIED}."

  # ---- 409 temporal conflict -------------------------------------------------------------
  - id: ERR_ROOM_DOUBLE_BOOKED
    http: 409
    condition: "The requested interval collides with another SCHEDULED or ATTENDED appointment in the same room once both are padded by 15 minutes on each side (closed comparison)."
  - id: ERR_OFFICER_DOUBLE_BOOKED
    http: 409
    condition: "The requested hearing window overlaps another HEARING_SCHEDULED window for the same officer under half-open [start, end) semantics."
  - id: ERR_OFFICER_DAILY_CAP_EXCEEDED
    http: 409
    condition: "The officer's booked minutes on that UTC date, including the new window, would exceed 240."
  - id: ERR_NOTIFICATION_WAIT_NOT_ELAPSED
    http: 409
    condition: "Production is attempted while clock_now < production_allowed_at."

  # ---- 412 optimistic concurrency --------------------------------------------------------
  - id: ERR_STALE_CUMULATIVE_FILE_VERSION
    http: 412
    condition: "expected_cumulative_file_version does not equal the student's CumulativeFile.version at mark-ready."
  - id: ERR_STALE_INSPECTION_REQUEST_VERSION
    http: 412
    condition: "expected_inspection_request_version does not equal InspectionRequest.version at appointment creation."

  # ---- 422 business rules ----------------------------------------------------------------
  - id: ERR_AUTHORIZATION_NOT_VERIFIED
    http: 422
    condition: "validate is called with authorization_verified == false, or on a request whose authorization_reference is null."
  - id: ERR_SPED_CONSENT_REQUIRED
    http: 422
    condition: "mark-ready is attempted with includes_special_education == true against a state whose sped_requires_consent == true while sped_consent_on_file == false."
  - id: ERR_OPTOUT_WINDOW_CLOSED
    http: 422
    condition: "A directory opt-out is filed after directory_optout_deadline_at (strictly later, to the millisecond)."
  - id: ERR_DIRECTORY_OPTOUT_ACTIVE
    http: 422
    condition: "A directory disclosure is logged for categories that are all covered by an effective opt-out."
  - id: ERR_APPOINTMENT_OUTSIDE_STATUTORY_WINDOW
    http: 422
    condition: "start_at is in the past relative to clock_now, or later than statutory_inspection_due_at."
  - id: ERR_HEARING_REQUEST_WINDOW_CLOSED
    http: 422
    condition: "A hearing is requested after hearing_due_at."
  - id: ERR_HEARING_WINDOW_EXCEEDED
    http: 422
    condition: "hearing_start_at is later than hearing_due_at."
  - id: ERR_FEE_OUTSTANDING
    http: 422
    condition: "Attendance is recorded while the inspection request still has fee_outstanding_cents > 0 and copies_requested == true."
  - id: ERR_FEE_OVERPAYMENT
    http: 422
    condition: "A payment or waiver exceeds fee_outstanding_cents."
  - id: ERR_COMPONENT_NOT_FOR_STUDENT
    http: 422
    condition: "contested_component_id belongs to another student's cumulative file, or the component is EXCLUDED."
  - id: ERR_NOTIFICATION_REQUIRED
    http: 422
    condition: "Production is attempted from RECEIVED on a demand whose notification_waived == false."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
# Every request carries X-User-Role and X-User-ID. The role model is segregation_of_duties: the
# RecordsOfficer who denies an amendment may not decide its hearing, so the two decision calls on
# one AmendmentRequest must come from two different X-User-ID values.
roles:
  - name: SystemAdmin
    description: "Configures the statutory reference data and the physical/human resources the office schedules against."
    identity: opaque
    exclusive_operations:
      - "POST /records-office/state-rules"
      - "POST /records-office/districts"
      - "POST /records-office/inspection-rooms"
      - "PATCH /records-office/inspection-rooms/{id}"
      - "POST /records-office/hearing-officers"
      - "PATCH /records-office/hearing-officers/{id}"
      - "POST /records-office/_clock/set_current_utc"
    shared_operations:
      - "POST /records-office/students (shared with RecordsClerk)"
      - "every GET listed in §1.5 except the parent-facing student-scoped reads"
  - name: RecordsClerk
    description: "Front-line clerk: enrolls students, opens withdrawals, manages exit holds, collects file components, takes fee payments."
    identity: opaque
    exclusive_operations:
      - "POST /records-office/students/{id}/withdrawals"
      - "POST /records-office/withdrawals/{id}/holds"
      - "POST /records-office/withdrawals/{id}/hold-releases"
    shared_operations:
      - "POST /records-office/students (shared with SystemAdmin)"
      - "PATCH /records-office/cumulative-files/{id}/components/{component_id} (shared with RecordsOfficer; only the clerk normally drives PENDING -> COLLECTED)"
      - "POST /records-office/students/{id}/discipline-incidents (shared with RecordsOfficer)"
      - "POST /records-office/students/{id}/directory-disclosures (shared with RecordsOfficer)"
      - "POST /records-office/inspection-requests/{id}/fee-payments (shared with RecordsOfficer)"
      - "reads across students, withdrawals, cumulative files, components, requests, appointments"
  - name: RecordsOfficer
    description: "Certifying official: completes withdrawals, certifies and excludes components, drives the whole records-request lifecycle, schedules inspections, decides amendments."
    identity: opaque
    exclusive_operations:
      - "POST /records-office/withdrawals/{id}/complete"
      - "POST /records-office/records-requests/{id}/validate"
      - "POST /records-office/records-requests/{id}/mark-ready"
      - "POST /records-office/records-requests/{id}/release"
      - "POST /records-office/records-requests/{id}/deny"
      - "POST /records-office/inspection-requests/{id}/appointments"
      - "POST /records-office/review-appointments/{id}/attendance"
      - "POST /records-office/amendment-requests/{id}/decisions"
      - "POST /records-office/amendment-requests/{id}/hearing-schedules"
    shared_operations:
      - "PATCH /records-office/cumulative-files/{id}/components/{component_id} (shared with RecordsClerk; certification, exclusion and reinstatement are officer work)"
      - "POST /records-office/records-requests (shared with ReceivingRegistrar, for requests received by mail or fax)"
      - "POST /records-office/students/{id}/discipline-incidents, POST /records-office/students/{id}/directory-disclosures, POST /records-office/inspection-requests/{id}/fee-payments (shared with RecordsClerk)"
      - "reads across every records entity"
  - name: ComplianceOfficer
    description: "Runs the periodic compliance sweep and executes certified destruction under the retention schedule."
    identity: opaque
    exclusive_operations:
      - "POST /records-office/compliance-sweeps"
      - "POST /records-office/retention-schedules/{id}/destruction"
    shared_operations:
      - "reads across students, files, requests, retention schedules, demands and disclosure logs"
  - name: LegalAffairsOfficer
    description: "Handles subpoenas, law-enforcement requests and ex parte orders, including the notification duty and production."
    identity: opaque
    exclusive_operations:
      - "POST /records-office/students/{id}/legal-demands"
      - "POST /records-office/legal-demands/{id}/notifications"
      - "POST /records-office/legal-demands/{id}/production"
    shared_operations:
      - "reads across students, files, demands and disclosure logs"
  - name: ReceivingRegistrar
    description: >
      Registrar of an enrolling (receiving) district. Files inter-district records requests in the
      name of their own district and tracks their progress.
    identity: "entity_backed:District"
    exclusive_operations: []
    shared_operations:
      - "POST /records-office/records-requests (shared with RecordsOfficer; requesting_district_id MUST equal X-User-ID)"
      - "GET /records-office/records-requests and GET /records-office/records-requests/{id}"
      - "GET /records-office/students, GET /records-office/students/{id}, GET /records-office/districts, GET /records-office/state-rules"
  - name: Parent
    description: >
      Parent or guardian of a student whose rights have NOT transferred. X-User-ID is matched
      against Student.guardian_user_id, which is an operator identifier and never a Student id.
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "PATCH /records-office/students/{id}/directory-optout (shared with EligibleStudent)"
      - "POST /records-office/students/{id}/inspection-requests (shared with EligibleStudent)"
      - "POST /records-office/students/{id}/amendment-requests (shared with EligibleStudent)"
      - "POST /records-office/amendment-requests/{id}/hearing-requests (shared with EligibleStudent)"
      - "POST /records-office/amendment-requests/{id}/statements (shared with EligibleStudent)"
      - "student-scoped reads: the student, the cumulative file and its components, discipline incidents, inspection requests, appointments, amendment requests and the disclosure log"
  - name: EligibleStudent
    description: >
      Student aged 18 or over, to whom FERPA rights have transferred. X-User-ID is matched against
      Student.student_user_id. Holds exactly the Parent operation set, and the two roles are
      mutually exclusive on any given student at any given instant.
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "the identical operation set listed under Parent, gated by is_eligible_student == true instead of false"
