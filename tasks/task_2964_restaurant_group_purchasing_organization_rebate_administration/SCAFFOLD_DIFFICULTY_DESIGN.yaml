      - name: mode_b_markup_rounding_order_per_line_then_sum
        mode: b
        grounds:
          - calculations.markup_overbilling
          - entities.PurchaseLine.fields.overbilled_cents
          - entities.PurchaseBatch.fields.overbilled_cents
          - entities.Distributor.fields.contracted_markup_bps
          - entities.ProgramTier.fields.markup_cap_bps
          - endpoints["POST /purchase-batches/{batch_id}/audit-markup"]
        distinguishing_aspect: |
          Mode (b) — order-of-operations / rounding-order sensitivity. The allowed
          unit cost is rounded per LINE and only then multiplied by cases and
          summed: 8533 -> allowed 9130 -> excess 10 * 30 = 300, and 8540 ->
          allowed 9138 -> excess 2 * 40 = 80, total 380. Summing base costs first
          (597590 -> allowed 639421 against invoice total 639800) yields 379, one
          cent short, and the cap itself is a nested min(900, 700) = 700 rather
          than the distributor's own 900 bps.
