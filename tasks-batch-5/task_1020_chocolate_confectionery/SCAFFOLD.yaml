# =============================================================================
# Chocolate & Confectionery Shop — seed tables (SCAFFOLD.yaml, §1.0–§1.7)
# =============================================================================

scenario: "1020. Chocolate & Confectionery Shop: SKU & batch/tempering, seasonal & holiday pre-order, custom/corporate & mold, gift & bundle, subscription, allergen & shelf-life, wholesale, inventory"

domain_name: chocolate-confectionery
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation            # finite lot inventory reserved/committed/released via FEFO
  secondary_archetype: workflow_orchestration    # tempering + custom-order negotiation pipelines
  complexity_layers:
    - optimistic_concurrency        # batch over-reservation resolved by OCC on Batch.version
    - cascading_side_effects        # quarantine and cancel cascades span 3+ entities
    - dual_variant_calculation      # quote-vs-invoice, estimate-vs-settled
    - derived_field_reconciliation  # batch available_units, order totals
  entity_topology: graph            # BundleComponent is a self-referential many-to-many over Product
  state_machine_shape: cyclic       # Batch tempering reseed loop; CustomOrder revision loop; Subscription pause/resume
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles            # Customer / SalesManager / ProductionManager own disjoint surfaces; Admin overrides
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Account holder / business name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: account_type, type: enum, source: input, description: "RETAIL | WHOLESALE | CORPORATE", constraints: "one of RETAIL, WHOLESALE, CORPORATE" }
      - { name: credit_limit_cents, type: integer, source: input, default: 0, description: "Max outstanding wholesale credit in cents; 0 for cash accounts" }
      - { name: loyalty_discount_pct, type: number, source: input, default: 0, description: "Per-unit retail discount fraction 0..0.5 applied to RETAIL/PREORDER line pricing" }
      - { name: allergen_restrictions, type: array, source: input, default: [], description: "Allergen codes the customer must never be sold, e.g. [MILK, NUT, SOY, GLUTEN]" }
      - { name: wallet_credit_cents, type: integer, source: system, default: 0, description: "Store credit balance in cents; only mutated by wallet adjust, order confirm (debit), order cancel (refund)" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Human SKU code, unique" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: product_type, type: enum, source: input, description: "SINGLE | BUNDLE", constraints: "one of SINGLE, BUNDLE" }
      - { name: base_price_cents, type: integer, source: input, description: "Catalog unit price in cents, > 0" }
      - { name: shelf_life_days, type: integer, source: input, description: "Days from batch produced_at to lot_expiry, > 0" }
      - { name: requires_tempering, type: boolean, source: input, default: false, description: "If true, a batch must pass RAW->TEMPERING->TEMPERED before RELEASED" }
      - { name: tempering_minutes, type: integer, source: input, default: 0, description: "Tempering-line occupation duration in minutes; must be > 0 when requires_tempering true" }
      - { name: unit_weight_g, type: number, source: input, description: "Net weight per unit in grams" }
      - { name: allergens, type: array, source: input, default: [], description: "Allergen codes present in this product, e.g. [MILK, NUT]" }
      - { name: status, type: enum, source: input, default: "ACTIVE", description: "ACTIVE | DISCONTINUED", constraints: "one of ACTIVE, DISCONTINUED" }

  - name: BundleComponent
    parent: null
    common_fields: false   # immutable junction: id, created_at only
    fields:
      - { name: bundle_product_id, type: string, source: input, description: "FK -> Product.id; the BUNDLE product this line belongs to" }
      - { name: component_product_id, type: string, source: input, description: "FK -> Product.id; a SINGLE product included in the bundle" }
      - { name: quantity, type: integer, source: input, description: "Units of the component per one bundle unit, > 0" }

  - name: Mold
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Mold display name" }
      - { name: cavity_count, type: integer, source: input, description: "Cavities per pour, > 0" }
      - { name: daily_capacity_units, type: integer, source: input, description: "Max total booked units per usage_date across all bookings, > 0" }
      - { name: allergens, type: array, source: input, default: [], description: "Residual allergen profile of the mold" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | MAINTENANCE | RETIRED", constraints: "one of ACTIVE, MAINTENANCE, RETIRED" }

  - name: TemperingLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tempering line / machine label" }

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the SKU this lot produces" }
      - { name: mold_id, type: string, source: input, default: null, description: "FK -> Mold.id; set for custom-order production lots", constraints: "nullable" }
      - { name: tempering_line_id, type: string, source: system, default: null, description: "FK -> TemperingLine.id; set on start-tempering, cleared on complete/reseed", constraints: "nullable" }
      - { name: initial_units, type: integer, source: input, description: "Units produced in this lot, > 0" }
      - { name: available_units, type: integer, source: system, default: 0, description: "Sellable units; 0 until RELEASED, then initial_units, decremented by ACTIVE reservations" }
      - { name: produced_at, type: datetime, source: input, description: "Production timestamp; defaults to current logical clock when omitted" }
      - { name: lot_expiry, type: datetime, source: computed, description: "produced_at + Product.shelf_life_days" }
      - { name: temper_start, type: datetime, source: input, default: null, description: "Tempering-line occupation start; set on start-tempering", constraints: "nullable" }
      - { name: temper_end, type: datetime, source: computed, default: null, description: "temper_start + Product.tempering_minutes; half-open interval end", constraints: "nullable" }
      - { name: reseed_count, type: integer, source: system, default: 0, description: "Number of TEMPERING->RAW reseed loops" }
      - { name: status, type: enum, source: system, default: "RAW", description: "RAW | TEMPERING | TEMPERED | RELEASED | QUARANTINED | DISCARDED | EXPIRED", constraints: "one of RAW, TEMPERING, TEMPERED, RELEASED, QUARANTINED, DISCARDED, EXPIRED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owner of the order" }
      - { name: order_type, type: enum, source: input, description: "RETAIL | WHOLESALE | PREORDER", constraints: "one of RETAIL, WHOLESALE, PREORDER" }
      - { name: is_gift, type: boolean, source: input, default: false, description: "If true, GIFT_WRAP_FEE_CENTS is added to the total" }
      - { name: fulfillment_window_start, type: datetime, source: input, default: null, description: "PREORDER earliest fulfil instant (inclusive)", constraints: "nullable" }
      - { name: fulfillment_window_end, type: datetime, source: input, default: null, description: "PREORDER latest fulfil instant (inclusive)", constraints: "nullable" }
      - { name: wallet_applied_cents, type: integer, source: system, default: 0, description: "Store credit consumed at confirm; refunded on cancel" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of OrderLine.line_total_cents (round-per-line-then-sum); 0 until confirm" }
      - { name: tax_cents, type: integer, source: computed, description: "round_half_up(subtotal_cents * TAX_RATE)" }
      - { name: gift_fee_cents, type: integer, source: computed, description: "GIFT_WRAP_FEE_CENTS when is_gift else 0" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + tax_cents + gift_fee_cents - wallet_applied_cents" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | CONFIRMED | ALLOCATED | FULFILLED | BACKORDERED | CANCELLED", constraints: "one of DRAFT, CONFIRMED, ALLOCATED, FULFILLED, BACKORDERED, CANCELLED" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; parent order" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; ordered SKU" }
      - { name: quantity, type: integer, source: input, description: "Units requested, > 0" }
      - { name: unit_price_cents, type: number, source: computed, description: "Per-unit price snapshot pinned at confirm (see calculations.line_unit_price); may be fractional cents before rounding" }
      - { name: line_total_cents, type: integer, source: computed, description: "round_half_up(unit_price_cents * quantity), pinned at confirm" }
      - { name: allocated_units, type: integer, source: system, default: 0, description: "Units currently covered by ACTIVE reservations; 0 until allocate" }

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the demand being satisfied" }
      - { name: batch_id, type: string, source: input, description: "FK -> Batch.id; the lot supplying units" }
      - { name: units, type: integer, source: input, description: "Units drawn from the batch, > 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | VOIDED | RELEASED | CONSUMED", constraints: "one of ACTIVE, VOIDED, RELEASED, CONSUMED" }

  - name: CustomOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; corporate/custom buyer" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; target SKU produced from the mold" }
      - { name: mold_id, type: string, source: input, description: "FK -> Mold.id; mold used for production" }
      - { name: units_estimated, type: integer, source: input, description: "Estimated units at quote time, > 0" }
      - { name: units_produced, type: integer, source: input, default: null, description: "Actual units at fulfil time", constraints: "nullable" }
      - { name: quote_round, type: integer, source: system, default: 0, description: "Number of quotes issued (increments each DRAFT/REVISION_REQUESTED -> QUOTED)" }
      - { name: usage_date, type: datetime, source: input, default: null, description: "Mold booking usage date set on accept", constraints: "nullable" }
      - { name: quoted_amount_cents, type: integer, source: computed, default: null, description: "Provisional amount (see calculations.custom_order_amount); pinned on quote", constraints: "nullable" }
      - { name: invoiced_amount_cents, type: integer, source: computed, default: null, description: "Final amount using actual units; pinned on fulfil", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | QUOTED | REVISION_REQUESTED | ACCEPTED | IN_PRODUCTION | FULFILLED | REJECTED | CANCELLED", constraints: "one of DRAFT, QUOTED, REVISION_REQUESTED, ACCEPTED, IN_PRODUCTION, FULFILLED, REJECTED, CANCELLED" }

  - name: MoldBooking
    parent: null
    common_fields: true
    fields:
      - { name: mold_id, type: string, source: input, description: "FK -> Mold.id; booked mold" }
      - { name: custom_order_id, type: string, source: input, description: "FK -> CustomOrder.id; owning custom order" }
      - { name: usage_date, type: datetime, source: input, description: "The production day the mold is reserved for (day-bucket)" }
      - { name: units, type: integer, source: input, description: "Units booked against daily_capacity_units, > 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RELEASED | CANCELLED", constraints: "one of ACTIVE, RELEASED, CANCELLED" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; subscriber" }
      - { name: box_product_id, type: string, source: input, description: "FK -> Product.id; the recurring box SKU" }
      - { name: cadence_days, type: integer, source: input, description: "Days between shipments, > 0" }
      - { name: next_ship_date, type: datetime, source: input, description: "Next scheduled ship instant; advanced by cadence_days on each advance" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | PAUSED | CANCELLED", constraints: "one of ACTIVE, PAUSED, CANCELLED" }

  - name: SubscriptionShipment
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; parent subscription" }
      - { name: period_index, type: integer, source: system, description: "1-based sequence number of this shipment" }
      - { name: scheduled_date, type: datetime, source: system, description: "The next_ship_date captured when this shipment was created by advance" }
      - { name: estimated_charge_cents, type: integer, source: computed, description: "box price at scheduling time (see calculations.subscription_period_charge)" }
      - { name: settled_charge_cents, type: integer, source: computed, default: null, description: "box price at ship time; pinned on ship", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | SHIPPED | CANCELLED", constraints: "one of SCHEDULED, SHIPPED, CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Batch
    initial_state: RAW
    terminal_states: [DISCARDED, EXPIRED]
    transitions:
      - from: RAW
        to: TEMPERING
        trigger: "POST /batches/{id}/start-tempering"
        actor: ProductionManager
        preconditions:
          - "Product.requires_tempering == true"
          - "batch not expired (current_clock < lot_expiry)"
          - "temper interval [temper_start, temper_start+tempering_minutes) does not overlap any other Batch occupying the same tempering_line_id (half-open; adjacency end==start allowed)"
        side_effects:
          - "set tempering_line_id, temper_start; compute temper_end = temper_start + Product.tempering_minutes"
      - from: RAW
        to: RELEASED
        trigger: "POST /batches/{id}/release"
        actor: ProductionManager
        preconditions:
          - "Product.requires_tempering == false"
          - "batch not expired"
        side_effects:
          - "available_units = initial_units"
      - from: TEMPERING
        to: TEMPERED
        trigger: "POST /batches/{id}/complete-tempering"
        actor: ProductionManager
        preconditions:
          - "current_clock >= temper_end"
        side_effects:
          - "clear tempering_line_id (free the line interval)"
      - from: TEMPERING
        to: RAW
        trigger: "POST /batches/{id}/reseed"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "increment reseed_count by 1"
          - "clear tempering_line_id, temper_start, temper_end (free the line interval)"
        note: "cyclic reseed loop back to RAW"
      - from: TEMPERED
        to: RELEASED
        trigger: "POST /batches/{id}/release"
        actor: ProductionManager
        preconditions:
          - "batch not expired"
        side_effects:
          - "available_units = initial_units"
      - from: RELEASED
        to: QUARANTINED
        trigger: "POST /batches/{id}/quarantine"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "for each Reservation with batch_id==this and status==ACTIVE: set status=VOIDED (cascade link 1)"
          - "each VOIDED reservation decrements its OrderLine.allocated_units by reservation.units (cascade link 2)"
          - "any Order in status ALLOCATED that now has an OrderLine with allocated_units < quantity transitions ALLOCATED->BACKORDERED (cascade link 3)"
          - "available_units set to 0 (units frozen under quarantine)"
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /batches/{id}/clear-quarantine"
        actor: ProductionManager
        preconditions:
          - "batch not expired"
        side_effects:
          - "available_units = initial_units - sum(units of ACTIVE reservations on this batch)"
      - from: QUARANTINED
        to: DISCARDED
        trigger: "POST /batches/{id}/discard"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "available_units = 0"
      - from: RELEASED
        to: EXPIRED
        trigger: "POST /_inventory/sweep-expired (system)"
        actor: system
        preconditions:
          - "current_clock >= lot_expiry"
        side_effects:
          - "available_units = 0"
        note: "auto/system transition driven by the logical clock"

  - entity: Order
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        actor: Customer
        preconditions:
          - "order has >= 1 OrderLine"
          - "no OrderLine product carries an allergen listed in Customer.allergen_restrictions (business_safety)"
          - "order_type matches account_type (WHOLESALE order requires WHOLESALE account; RETAIL/PREORDER requires RETAIL or CORPORATE)"
          - "for WHOLESALE: total_cents <= Customer.credit_limit_cents (business_fiscal)"
        side_effects:
          - "compute each OrderLine.unit_price_cents and line_total_cents (calculations.line_unit_price)"
          - "compute subtotal_cents, tax_cents, gift_fee_cents, total_cents (calculations.order_total)"
          - "wallet_applied_cents = min(wallet_apply_cents, Customer.wallet_credit_cents, subtotal_cents+tax_cents+gift_fee_cents); debit Customer.wallet_credit_cents by that amount"
      - from: CONFIRMED
        to: ALLOCATED
        trigger: "POST /orders/{id}/allocate"
        actor: SalesManager
        preconditions:
          - "no OrderLine product carries a restricted allergen (re-checked; business_safety)"
          - "for every OrderLine, RELEASED non-expired Batches of that product hold >= quantity available_units in aggregate (cross-entity dependency on Batch.status)"
        side_effects:
          - "FEFO allocation (calculations.fefo_allocation): create ACTIVE Reservations, decrement Batch.available_units, set OrderLine.allocated_units"
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "POST /orders/{id}/allocate"
        actor: SalesManager
        preconditions:
          - "every OrderLine can be fully covered by RELEASED non-expired Batches"
        side_effects:
          - "FEFO allocation re-runs for lines with allocated_units < quantity"
      - from: CONFIRMED
        to: BACKORDERED
        trigger: "POST /orders/{id}/allocate (insufficient path is rejected; BACKORDERED is reached via quarantine cascade)"
        actor: system
        preconditions: []
        side_effects: []
        note: "BACKORDERED is entered from ALLOCATED by the quarantine cascade, not directly from CONFIRMED"
      - from: ALLOCATED
        to: BACKORDERED
        trigger: "system: Batch quarantine cascade"
        actor: system
        preconditions: []
        side_effects:
          - "reservations voided upstream; allocated_units reduced below quantity on >=1 line"
      - from: ALLOCATED
        to: FULFILLED
        trigger: "POST /orders/{id}/fulfill"
        actor: ProductionManager
        preconditions:
          - "for PREORDER: fulfillment_window_start <= current_clock <= fulfillment_window_end (business_temporal)"
          - "every OrderLine.allocated_units == quantity"
        side_effects:
          - "set each ACTIVE Reservation on the order to CONSUMED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "refund wallet_applied_cents to Customer.wallet_credit_cents; set wallet_applied_cents = 0"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "for each ACTIVE Reservation on this order: set status=RELEASED (cascade link 1); restore its Batch.available_units by reservation.units (cascade link 2)"
          - "refund wallet_applied_cents to Customer.wallet_credit_cents; set wallet_applied_cents = 0"
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "release any remaining ACTIVE reservations and restore Batch.available_units; refund wallet_applied_cents"

  - entity: CustomOrder
    initial_state: DRAFT
    terminal_states: [FULFILLED, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /custom-orders/{id}/quote"
        actor: SalesManager
        preconditions: []
        side_effects:
          - "compute quoted_amount_cents (calculations.custom_order_amount, provisional variant)"
          - "increment quote_round by 1"
      - from: REVISION_REQUESTED
        to: QUOTED
        trigger: "POST /custom-orders/{id}/quote"
        actor: SalesManager
        preconditions: []
        side_effects:
          - "recompute quoted_amount_cents; increment quote_round by 1"
        note: "cyclic re-quote loop"
      - from: QUOTED
        to: REVISION_REQUESTED
        trigger: "POST /custom-orders/{id}/request-revision"
        actor: Customer
        preconditions: []
        side_effects: []
        note: "cyclic negotiation back-edge"
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /custom-orders/{id}/accept"
        actor: Customer
        preconditions:
          - "Mold.status == ACTIVE (cross-entity dependency)"
          - "booking units_estimated + sum(ACTIVE MoldBooking.units for this mold on usage_date) <= Mold.daily_capacity_units (business_temporal, aggregate day-capacity)"
        side_effects:
          - "set usage_date; create MoldBooking(mold_id, custom_order_id, usage_date, units=units_estimated, status=ACTIVE)"
      - from: QUOTED
        to: REJECTED
        trigger: "POST /custom-orders/{id}/reject"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: IN_PRODUCTION
        trigger: "POST /custom-orders/{id}/start-production"
        actor: ProductionManager
        preconditions:
          - "Mold.status == ACTIVE (cross-entity dependency; re-checked at production start)"
        side_effects:
          - "create Batch(product_id, mold_id, initial_units=units_estimated, status=RAW)"
      - from: IN_PRODUCTION
        to: FULFILLED
        trigger: "POST /custom-orders/{id}/fulfill"
        actor: ProductionManager
        preconditions: []
        side_effects:
          - "set units_produced; compute invoiced_amount_cents (calculations.custom_order_amount, final variant)"
          - "set the MoldBooking for this custom order to RELEASED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /custom-orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /custom-orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /custom-orders/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "set the MoldBooking for this custom order to CANCELLED (frees day-capacity)"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{id}/pause"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/resume"
        actor: Customer
        preconditions: []
        side_effects: []
        note: "cyclic pause/resume"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/advance (system)"
        actor: Admin
        preconditions:
          - "status == ACTIVE"
          - "current_clock >= next_ship_date"
        side_effects:
          - "create SubscriptionShipment(period_index=n+1, scheduled_date=next_ship_date, estimated_charge_cents via calculations.subscription_period_charge)"
          - "advance next_ship_date by cadence_days"
        note: "self-loop that emits a shipment child"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "set every SCHEDULED SubscriptionShipment of this subscription to CANCELLED"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Customer
        preconditions: []
        side_effects:
          - "set every SCHEDULED SubscriptionShipment of this subscription to CANCELLED"

  - entity: SubscriptionShipment
    initial_state: SCHEDULED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SHIPPED
        trigger: "POST /subscription-shipments/{id}/ship"
        actor: Admin
        preconditions:
          - "parent Subscription.status == ACTIVE"
        side_effects:
          - "compute settled_charge_cents at current box price (calculations.subscription_period_charge, settled variant)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: Subscription cancel cascade"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-over-subscribe-stale-batch
    parent_entity: Batch
    write_endpoint: "POST /batches/{id}/reservations"
    occ_field: "expected_batch_version"
    description: |
      Creating a Reservation against a Batch whose version has advanced since
      the client last observed it is rejected. A prior writer has already drawn
      units from the lot (legitimately reducing available_units and bumping the
      version); the current writer's view of the lot is therefore stale and its
      reservation could over-subscribe the lot. Reduced to a stale-version check
      on Batch.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_unit_price
    trigger: "Order confirm (POST /orders/{id}/confirm) — pins OrderLine.unit_price_cents"
    algorithm: tiered_pricing
    formula: |
      base = Product.base_price_cents
      if Order.order_type in {RETAIL, PREORDER}:
          unit_price_cents = base * (1 - Customer.loyalty_discount_pct)   # may be fractional
      elif Order.order_type == WHOLESALE:
          d = wholesale_tier_discount(total_units)                        # see wholesale_tier_discount
          unit_price_cents = base * (1 - d)                               # may be fractional
    input_set: "the OrderLine's Product, the owning Customer, and (for WHOLESALE) total_units = sum of quantity over all lines of the order"
    constants: {}
    precision: "unit_price_cents kept exact (fractional cents) until order_total rounds each line"
    variants:
      - name: retail
        when: "order_type in {RETAIL, PREORDER}"
        difference: "discount is Customer.loyalty_discount_pct, independent of quantity"
      - name: wholesale
        when: "order_type == WHOLESALE"
        difference: "discount is the volume tier keyed on total order units"

  - name: wholesale_tier_discount
    trigger: "inside line_unit_price for WHOLESALE orders at confirm"
    algorithm: threshold
    formula: |
      total_units = sum(OrderLine.quantity for all lines of the order)
      if total_units >= 500: return 0.25
      elif total_units >= 200: return 0.18
      elif total_units >= 50:  return 0.10
      else: return 0.00
    input_set: "aggregate order quantity across all lines; boundaries are inclusive (>=)"
    constants:
      TIER1_MIN_UNITS: 50
      TIER1_DISCOUNT: 0.10
      TIER2_MIN_UNITS: 200
      TIER2_DISCOUNT: 0.18
      TIER3_MIN_UNITS: 500
      TIER3_DISCOUNT: 0.25
    precision: "discount is an exact fraction; boundaries use >= (49 units -> 0%, 50 units -> 10%)"

  - name: order_total
    trigger: "Order confirm (POST /orders/{id}/confirm)"
    algorithm: aggregation
    formula: |
      # PINNED rounding order: round EACH line to whole cents, THEN sum.
      for each line: line_total_cents = round_half_up(unit_price_cents * quantity)
      subtotal_cents = sum(line_total_cents over all lines)          # NOT round_half_up(sum(exact line amounts))
      tax_cents      = round_half_up(subtotal_cents * TAX_RATE)
      gift_fee_cents = GIFT_WRAP_FEE_CENTS if Order.is_gift else 0
      total_cents    = subtotal_cents + tax_cents + gift_fee_cents - wallet_applied_cents
    input_set: "all OrderLines of the order; each line already priced by line_unit_price"
    constants:
      TAX_RATE: 0.0725
      GIFT_WRAP_FEE_CENTS: 500
    precision: "cents, round_half_up; per-line rounding BEFORE summation is authoritative (round-per-line-then-sum, not sum-then-round)"

  - name: custom_order_amount
    trigger: "quote (provisional) and fulfil (final) transitions of CustomOrder"
    algorithm: forward_looking
    formula: |
      surcharge = MOLD_SURCHARGE_PER_UNIT_CENTS
      provisional (quote): quoted_amount_cents  = units_estimated * (Product.base_price_cents + surcharge) + MOLD_SETUP_FEE_CENTS
      final (fulfil):      invoiced_amount_cents = units_produced  * (Product.base_price_cents + surcharge) + MOLD_SETUP_FEE_CENTS
    input_set: "the CustomOrder's Product base price; units_estimated at quote vs units_produced at fulfil"
    constants:
      MOLD_SURCHARGE_PER_UNIT_CENTS: 300
      MOLD_SETUP_FEE_CENTS: 25000
    precision: "integer cents; base_price already integer"
    variants:
      - name: provisional_quote
        when: "at QUOTED — uses units_estimated"
        difference: "estimate; can diverge from the final invoice when actual production differs"
      - name: final_invoice
        when: "at FULFILLED — uses units_produced"
        difference: "actual; equals the quote only when units_produced == units_estimated"

  - name: subscription_period_charge
    trigger: "advance (estimate) and ship (settle) of SubscriptionShipment"
    algorithm: dual_variant_calculation
    formula: |
      estimate (advance): estimated_charge_cents = Product.base_price_cents  # box price at scheduling time
      settle   (ship):    settled_charge_cents   = Product.base_price_cents  # box price at ship time
    input_set: "Subscription.box_product_id's current base_price_cents, read at two different clock positions"
    constants: {}
    precision: "integer cents"
    variants:
      - name: estimate_at_scheduling
        when: "at advance — box price snapshot when the shipment is created"
        difference: "provisional; frozen into estimated_charge_cents"
      - name: settle_at_ship
        when: "at ship — box price re-read; diverges from estimate when the SKU's base_price_cents changed in between"
        difference: "authoritative charge; equals the estimate only if the price did not change"

  - name: batch_available_units
    trigger: "reservation create/void/release, order allocate/cancel, batch release/quarantine/clear/discard/expire"
    algorithm: aggregation
    formula: |
      when RELEASED: available_units = initial_units - sum(r.units for Reservation r where r.batch_id==batch and r.status==ACTIVE)
      when QUARANTINED/DISCARDED/EXPIRED/RAW/TEMPERING/TEMPERED: available_units = 0
    input_set: "ACTIVE reservations on the batch only; VOIDED/RELEASED/CONSUMED excluded"
    constants: {}
    precision: "integer units; invariant initial_units == available_units + sum(ACTIVE + CONSUMED reservation units) for a RELEASED lot"

  - name: fefo_allocation
    trigger: "Order allocate (POST /orders/{id}/allocate)"
    algorithm: waterfall_allocation
    formula: |
      for each OrderLine (processed by OrderLine.created_at ASC):
        need = quantity - allocated_units
        candidates = Batches where product_id==line.product_id AND status==RELEASED AND lot_expiry > current_clock AND available_units > 0
        order candidates by lot_expiry ASC, tie-break created_at ASC   # First-Expiry-First-Out
        for each candidate until need == 0:
          take = min(need, candidate.available_units)
          create Reservation(order_line_id, batch_id=candidate.id, units=take, status=ACTIVE)
          candidate.available_units -= take ; allocated_units += take ; need -= take
        if need > 0 after exhausting candidates: reject whole allocate with ERR_INSUFFICIENT_INVENTORY (no partial commit)
    input_set: "RELEASED non-expired batches of each line's product with available_units > 0"
    constants: {}
    precision: "integer units; deterministic FEFO order by lot_expiry then created_at (never id)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for the endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body has all required fields, valid enum members, positive quantities where required"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "every path id and body FK references an existing resource (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
    note: "concrete ids: ERR_CUSTOMER_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_ORDER_LINE_NOT_FOUND, ERR_MOLD_NOT_FOUND, ERR_CUSTOM_ORDER_NOT_FOUND, ERR_SUBSCRIPTION_NOT_FOUND, ERR_SHIPMENT_NOT_FOUND, ERR_TEMPERING_LINE_NOT_FOUND, ERR_RESERVATION_NOT_FOUND"
  - priority: 5
    category: business_referential
    check: "acting Customer (entity_backed) owns the target Order/CustomOrder/Subscription (X-User-ID == resource.customer_id)"
    error_id: ERR_OWNERSHIP_FORBIDDEN
    http_status: 403
    applies_to: "Customer-role writes on Order, CustomOrder, Subscription"
  - priority: 6
    category: business_constraint
    check: "order_type is compatible with Customer.account_type (WHOLESALE order requires WHOLESALE account; RETAIL/PREORDER requires RETAIL or CORPORATE)"
    error_id: ERR_ACCOUNT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /orders/{id}/confirm"
  - priority: 7
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 8
    category: business_safety
    check: "no OrderLine product carries an allergen present in the owning Customer.allergen_restrictions"
    error_id: ERR_ALLERGEN_RESTRICTED
    http_status: 422
    applies_to: "POST /orders/{id}/lines, POST /orders/{id}/confirm, POST /orders/{id}/allocate"
  - priority: 9
    category: business_temporal
    check: "tempering interval [temper_start, temper_start+tempering_minutes) does not overlap another batch on the same tempering line (half-open; adjacency allowed)"
    error_id: ERR_TEMPERING_LINE_CONFLICT
    http_status: 409
    applies_to: "POST /batches/{id}/start-tempering"
  - priority: 10
    category: business_temporal
    check: "units_estimated + sum(ACTIVE MoldBooking.units for mold on usage_date) <= Mold.daily_capacity_units (aggregate day-bucket capacity)"
    error_id: ERR_MOLD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /custom-orders/{id}/accept"
  - priority: 11
    category: business_temporal
    check: "for PREORDER fulfil: fulfillment_window_start <= current_clock <= fulfillment_window_end"
    error_id: ERR_FULFILLMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /orders/{id}/fulfill"
  - priority: 12
    category: business_constraint
    check: "referenced Mold.status == ACTIVE"
    error_id: ERR_MOLD_INACTIVE
    http_status: 409
    applies_to: "POST /custom-orders/{id}/accept, POST /custom-orders/{id}/start-production"
  - priority: 13
    category: business_constraint
    check: "batch not expired (current_clock < lot_expiry) for tempering/release/reservation actions"
    error_id: ERR_BATCH_EXPIRED
    http_status: 409
    applies_to: "POST /batches/{id}/start-tempering, POST /batches/{id}/release, POST /batches/{id}/clear-quarantine, POST /batches/{id}/reservations"
  - priority: 14
    category: business_constraint
    check: "each line's RELEASED non-expired batches hold >= quantity available_units in aggregate; empty candidate pool or shortfall rejects the whole allocate"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /orders/{id}/allocate, POST /batches/{id}/reservations"
  - priority: 15
    category: business_constraint
    check: "quantity/units is a positive integer > 0"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "POST /orders/{id}/lines, POST /batches, POST /batches/{id}/reservations, POST /custom-orders"
  - priority: 16
    category: business_constraint
    check: "bundle component is valid: bundle_product_id.product_type==BUNDLE, component_product_id.product_type==SINGLE, component != bundle, quantity > 0"
    error_id: ERR_BUNDLE_COMPONENT_INVALID
    http_status: 422
    applies_to: "POST /products/{id}/bundle-components"
  - priority: 17
    category: business_constraint
    check: "an order cannot carry two lines for the same product_id"
    error_id: ERR_DUPLICATE_LINE
    http_status: 409
    applies_to: "POST /orders/{id}/lines"
  - priority: 18
    category: business_fiscal
    check: "for WHOLESALE confirm: total_cents <= Customer.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /orders/{id}/confirm"
  - priority: 19
    category: business_constraint
    check: "expected_batch_version matches current Batch.version (OCC); stale version rejected"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /batches/{id}/reservations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Products & bundles ----
  - { method: POST, path: "/products", description: "Create SKU", roles: [Admin], code: 201, input: ["sku", "name", "product_type", "base_price_cents", "shelf_life_days", "unit_weight_g", "requires_tempering?", "tempering_minutes?", "allergens?", "status?"], output: Product, side_effects: [] }
  - { method: GET, path: "/products/{id}", description: "Read product", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: [], output: Product, side_effects: [] }
  - { method: GET, path: "/products", description: "List products", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: ["product_type?", "status?", "limit?", "offset?"], output: "Product[]", side_effects: [] }
  - { method: PATCH, path: "/products/{id}", description: "Update price/status", roles: [Admin], code: 200, input: ["base_price_cents?", "status?"], output: Product, side_effects: ["increments Product.version by 1"] }
  - { method: POST, path: "/products/{id}/bundle-components", description: "Attach a component to a BUNDLE product", roles: [Admin], code: 201, input: ["component_product_id", "quantity"], output: BundleComponent, side_effects: [] }
  - { method: GET, path: "/bundle-components/{id}", description: "Read bundle component", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: [], output: BundleComponent, side_effects: [] }
  - { method: GET, path: "/bundle-components", description: "List/filter bundle components by bundle or component product", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: ["bundle_product_id?", "component_product_id?", "limit?", "offset?"], output: "BundleComponent[]", side_effects: [] }

  # ---- Customers ----
  - { method: POST, path: "/customers", description: "Create customer/account", roles: [Admin], code: 201, input: ["name", "email", "account_type", "credit_limit_cents?", "loyalty_discount_pct?", "allergen_restrictions?"], output: Customer, side_effects: [] }
  - { method: GET, path: "/customers/{id}", description: "Read customer", roles: [Customer, SalesManager, Admin], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: GET, path: "/customers", description: "List customers", roles: [Admin], code: 200, input: ["account_type?", "limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: PATCH, path: "/customers/{id}", description: "Update credit/loyalty/allergen restrictions", roles: [Admin], code: 200, input: ["credit_limit_cents?", "loyalty_discount_pct?", "allergen_restrictions?"], output: Customer, side_effects: ["increments Customer.version by 1"] }
  - { method: POST, path: "/customers/{id}/wallet/adjust", description: "Grant/deduct store credit", roles: [Admin], code: 200, input: ["amount_cents"], output: Customer, side_effects: ["Customer.wallet_credit_cents += amount_cents"] }

  # ---- Molds & tempering lines ----
  - { method: POST, path: "/molds", description: "Create mold", roles: [ProductionManager], code: 201, input: ["name", "cavity_count", "daily_capacity_units", "allergens?"], output: Mold, side_effects: [] }
  - { method: GET, path: "/molds/{id}", description: "Read mold", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: [], output: Mold, side_effects: [] }
  - { method: GET, path: "/molds", description: "List molds", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: ["status?", "limit?", "offset?"], output: "Mold[]", side_effects: [] }
  - { method: POST, path: "/molds/{id}/set-status", description: "Set mold ACTIVE/MAINTENANCE/RETIRED", roles: [ProductionManager], code: 200, input: ["status"], output: Mold, side_effects: ["increments Mold.version by 1"] }
  - { method: GET, path: "/mold-bookings/{id}", description: "Read mold booking", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: [], output: MoldBooking, side_effects: [] }
  - { method: GET, path: "/mold-bookings", description: "List/filter mold bookings by mold, custom order, or usage date", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: ["mold_id?", "custom_order_id?", "usage_date?", "status?", "limit?", "offset?"], output: "MoldBooking[]", side_effects: [] }
  - { method: POST, path: "/tempering-lines", description: "Create tempering line", roles: [ProductionManager], code: 201, input: ["name"], output: TemperingLine, side_effects: [] }
  - { method: GET, path: "/tempering-lines/{id}", description: "Read tempering line", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: [], output: TemperingLine, side_effects: [] }
  - { method: GET, path: "/tempering-lines", description: "List tempering lines", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: ["limit?", "offset?"], output: "TemperingLine[]", side_effects: [] }

  # ---- Batches (inventory lots) ----
  - { method: POST, path: "/batches", description: "Create production lot (RAW)", roles: [ProductionManager], code: 201, input: ["product_id", "initial_units", "produced_at?", "mold_id?"], output: Batch, side_effects: ["compute lot_expiry = produced_at + shelf_life_days"] }
  - { method: GET, path: "/batches/{id}", description: "Read batch", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: [], output: Batch, side_effects: [] }
  - { method: GET, path: "/batches", description: "List/filter batches by product, mold, tempering line, status", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: ["product_id?", "mold_id?", "tempering_line_id?", "status?", "limit?", "offset?"], output: "Batch[]", side_effects: [] }
  - { method: POST, path: "/batches/{id}/start-tempering", description: "RAW->TEMPERING; occupy a tempering line interval", roles: [ProductionManager], code: 200, input: ["tempering_line_id", "temper_start"], output: Batch, side_effects: ["set tempering_line_id, temper_start; compute temper_end"] }
  - { method: POST, path: "/batches/{id}/complete-tempering", description: "TEMPERING->TEMPERED", roles: [ProductionManager], code: 200, input: [], output: Batch, side_effects: ["free tempering line"] }
  - { method: POST, path: "/batches/{id}/reseed", description: "TEMPERING->RAW reseed loop", roles: [ProductionManager], code: 200, input: [], output: Batch, side_effects: ["reseed_count += 1; free tempering line"] }
  - { method: POST, path: "/batches/{id}/release", description: "TEMPERED->RELEASED (or RAW->RELEASED when no tempering)", roles: [ProductionManager], code: 200, input: [], output: Batch, side_effects: ["available_units = initial_units"] }
  - { method: POST, path: "/batches/{id}/quarantine", description: "RELEASED->QUARANTINED; cascade void reservations and backorder affected orders", roles: [ProductionManager], code: 200, input: ["reason?"], output: Batch, side_effects: ["void ACTIVE reservations; reduce OrderLine.allocated_units; ALLOCATED->BACKORDERED; available_units=0"] }
  - { method: POST, path: "/batches/{id}/clear-quarantine", description: "QUARANTINED->RELEASED", roles: [ProductionManager], code: 200, input: [], output: Batch, side_effects: ["available_units = initial_units - ACTIVE reservation units"] }
  - { method: POST, path: "/batches/{id}/discard", description: "QUARANTINED->DISCARDED (terminal)", roles: [ProductionManager], code: 200, input: [], output: Batch, side_effects: ["available_units=0"] }
  - { method: POST, path: "/batches/{id}/reservations", description: "Manually reserve units from a lot (OCC on Batch.version)", roles: [SalesManager], code: 201, input: ["order_line_id", "units", "expected_batch_version"], output: Reservation, side_effects: ["decrement Batch.available_units by units; increment Batch.version by 1; increment OrderLine.allocated_units"] }
  - { method: GET, path: "/reservations/{id}", description: "Read reservation", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: [], output: Reservation, side_effects: [] }
  - { method: GET, path: "/reservations", description: "List/filter reservations by order line or batch", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: ["order_line_id?", "batch_id?", "status?", "limit?", "offset?"], output: "Reservation[]", side_effects: [] }

  # ---- Orders ----
  - { method: POST, path: "/orders", description: "Create DRAFT order", roles: [Customer], code: 201, input: ["customer_id", "order_type", "is_gift?", "fulfillment_window_start?", "fulfillment_window_end?"], output: Order, side_effects: [] }
  - { method: GET, path: "/orders/{id}", description: "Read order", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET, path: "/orders", description: "List/filter orders by customer, type, status", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: ["customer_id?", "order_type?", "status?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: POST, path: "/orders/{id}/lines", description: "Add a line to a DRAFT order", roles: [Customer], code: 201, input: ["product_id", "quantity"], output: OrderLine, side_effects: [] }
  - { method: GET, path: "/order-lines/{id}", description: "Read order line", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: [], output: OrderLine, side_effects: [] }
  - { method: GET, path: "/order-lines", description: "List/filter order lines by order or product", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: ["order_id?", "product_id?", "limit?", "offset?"], output: "OrderLine[]", side_effects: [] }
  - { method: POST, path: "/orders/{id}/confirm", description: "DRAFT->CONFIRMED; price and apply wallet", roles: [Customer], code: 200, input: ["wallet_apply_cents?"], output: Order, side_effects: ["compute totals; debit wallet"] }
  - { method: POST, path: "/orders/{id}/allocate", description: "CONFIRMED/BACKORDERED->ALLOCATED via FEFO", roles: [SalesManager], code: 200, input: [], output: Order, side_effects: ["create reservations; decrement batch available_units; set allocated_units"] }
  - { method: POST, path: "/orders/{id}/fulfill", description: "ALLOCATED->FULFILLED", roles: [ProductionManager], code: 200, input: [], output: Order, side_effects: ["reservations -> CONSUMED"] }
  - { method: POST, path: "/orders/{id}/cancel", description: "Cancel order; release reservations and refund wallet", roles: [Customer, SalesManager], code: 200, input: [], output: Order, side_effects: ["release ACTIVE reservations; restore batch available_units; refund wallet"] }

  # ---- Custom / corporate orders ----
  - { method: POST, path: "/custom-orders", description: "Create DRAFT custom order", roles: [Customer], code: 201, input: ["customer_id", "product_id", "mold_id", "units_estimated"], output: CustomOrder, side_effects: [] }
  - { method: GET, path: "/custom-orders/{id}", description: "Read custom order", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: [], output: CustomOrder, side_effects: [] }
  - { method: GET, path: "/custom-orders", description: "List/filter custom orders by customer, mold, product, status", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: ["customer_id?", "mold_id?", "product_id?", "status?", "limit?", "offset?"], output: "CustomOrder[]", side_effects: [] }
  - { method: POST, path: "/custom-orders/{id}/quote", description: "DRAFT/REVISION_REQUESTED->QUOTED (provisional amount)", roles: [SalesManager], code: 200, input: [], output: CustomOrder, side_effects: ["set quoted_amount_cents; quote_round += 1"] }
  - { method: POST, path: "/custom-orders/{id}/request-revision", description: "QUOTED->REVISION_REQUESTED (negotiation loop)", roles: [Customer], code: 200, input: ["note?"], output: CustomOrder, side_effects: [] }
  - { method: POST, path: "/custom-orders/{id}/accept", description: "QUOTED->ACCEPTED; book mold day-capacity", roles: [Customer], code: 200, input: ["usage_date"], output: CustomOrder, side_effects: ["create MoldBooking"] }
  - { method: POST, path: "/custom-orders/{id}/reject", description: "QUOTED->REJECTED", roles: [Customer], code: 200, input: [], output: CustomOrder, side_effects: [] }
  - { method: POST, path: "/custom-orders/{id}/start-production", description: "ACCEPTED->IN_PRODUCTION; create batch", roles: [ProductionManager], code: 200, input: [], output: CustomOrder, side_effects: ["create Batch"] }
  - { method: POST, path: "/custom-orders/{id}/fulfill", description: "IN_PRODUCTION->FULFILLED; final invoice", roles: [ProductionManager], code: 200, input: ["units_produced"], output: CustomOrder, side_effects: ["set units_produced; compute invoiced_amount_cents; release mold booking"] }
  - { method: POST, path: "/custom-orders/{id}/cancel", description: "Cancel custom order; free mold booking", roles: [Customer], code: 200, input: [], output: CustomOrder, side_effects: ["cancel MoldBooking if any"] }

  # ---- Subscriptions ----
  - { method: POST, path: "/subscriptions", description: "Create ACTIVE subscription", roles: [Customer], code: 201, input: ["customer_id", "box_product_id", "cadence_days", "next_ship_date"], output: Subscription, side_effects: [] }
  - { method: GET, path: "/subscriptions/{id}", description: "Read subscription", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: GET, path: "/subscriptions", description: "List/filter subscriptions by customer, box product, status", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: ["customer_id?", "box_product_id?", "status?", "limit?", "offset?"], output: "Subscription[]", side_effects: [] }
  - { method: POST, path: "/subscriptions/{id}/pause", description: "ACTIVE->PAUSED", roles: [Customer], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: POST, path: "/subscriptions/{id}/resume", description: "PAUSED->ACTIVE", roles: [Customer], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: POST, path: "/subscriptions/{id}/cancel", description: "Cancel subscription; cancel scheduled shipments", roles: [Customer], code: 200, input: [], output: Subscription, side_effects: ["SCHEDULED shipments -> CANCELLED"] }
  - { method: POST, path: "/subscriptions/{id}/advance", description: "Emit next SubscriptionShipment (system); advance next_ship_date", roles: [Admin], code: 201, input: [], output: SubscriptionShipment, side_effects: ["create shipment with estimated_charge_cents; next_ship_date += cadence_days"] }
  - { method: GET, path: "/subscription-shipments/{id}", description: "Read shipment", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: [], output: SubscriptionShipment, side_effects: [] }
  - { method: GET, path: "/subscription-shipments", description: "List/filter shipments by subscription or status", roles: [Customer, SalesManager, ProductionManager, Admin], code: 200, input: ["subscription_id?", "status?", "limit?", "offset?"], output: "SubscriptionShipment[]", side_effects: [] }
  - { method: POST, path: "/subscription-shipments/{id}/ship", description: "SCHEDULED->SHIPPED; settle charge at current price", roles: [Admin], code: 200, input: [], output: SubscriptionShipment, side_effects: ["compute settled_charge_cents"] }

  # ---- System / test-driving ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-07-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock time.", roles: [Admin], code: 200, input: ["to_iso8601"], output: null, side_effects: ["logical clock set"] }
  - { method: POST, path: "/_inventory/sweep-expired", description: "Transition RELEASED batches with lot_expiry <= current_clock to EXPIRED (system)", roles: [Admin], code: 200, input: [], output: null, side_effects: ["RELEASED->EXPIRED for expired lots; available_units=0"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for the endpoint" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, bad enum, malformed body" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource-not-found umbrella (see concrete ids below)" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer_id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product_id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "batch id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "order_line_id does not exist" }
  - { id: ERR_MOLD_NOT_FOUND, http: 404, condition: "mold_id does not exist" }
  - { id: ERR_CUSTOM_ORDER_NOT_FOUND, http: 404, condition: "custom order id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "subscription id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "subscription shipment id does not exist" }
  - { id: ERR_TEMPERING_LINE_NOT_FOUND, http: 404, condition: "tempering_line_id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "reservation id does not exist" }
  - { id: ERR_OWNERSHIP_FORBIDDEN, http: 403, condition: "Customer acting on a resource they do not own" }
  - { id: ERR_ACCOUNT_TYPE_MISMATCH, http: 422, condition: "order_type incompatible with Customer.account_type" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_ALLERGEN_RESTRICTED, http: 422, condition: "A line product contains an allergen the customer restricted" }
  - { id: ERR_TEMPERING_LINE_CONFLICT, http: 409, condition: "Tempering interval overlaps another batch on the same line" }
  - { id: ERR_MOLD_CAPACITY_EXCEEDED, http: 409, condition: "Mold day-capacity would be exceeded by the booking" }
  - { id: ERR_FULFILLMENT_WINDOW_CLOSED, http: 422, condition: "PREORDER fulfil outside [window_start, window_end]" }
  - { id: ERR_MOLD_INACTIVE, http: 409, condition: "Referenced mold is not ACTIVE" }
  - { id: ERR_BATCH_EXPIRED, http: 409, condition: "Batch lot_expiry reached; action on expired lot" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Not enough RELEASED non-expired units to fully cover the allocate/reservation" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "quantity/units not a positive integer" }
  - { id: ERR_BUNDLE_COMPONENT_INVALID, http: 422, condition: "Bundle component fails type/self/quantity checks" }
  - { id: ERR_DUPLICATE_LINE, http: 409, condition: "Second line for the same product on one order" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Wholesale order total exceeds customer credit limit" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_batch_version does not match current Batch.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Retail/wholesale/corporate buyer acting on their own orders, custom orders, and subscriptions"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders (own)"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/confirm"
      - "POST /custom-orders (own)"
      - "POST /custom-orders/{id}/accept"
      - "POST /custom-orders/{id}/request-revision"
      - "POST /custom-orders/{id}/reject"
      - "POST /custom-orders/{id}/cancel"
      - "POST /subscriptions (own)"
      - "POST /subscriptions/{id}/pause"
      - "POST /subscriptions/{id}/resume"
      - "POST /subscriptions/{id}/cancel"
    shared_operations:
      - "POST /orders/{id}/cancel (with SalesManager)"
      - "all GET reads"
  - name: SalesManager
    description: "Sales-side operator: quotes custom orders, allocates orders, reserves inventory"
    identity: "opaque"
    exclusive_operations:
      - "POST /custom-orders/{id}/quote"
      - "POST /orders/{id}/allocate"
      - "POST /batches/{id}/reservations"
    shared_operations:
      - "POST /orders/{id}/cancel (with Customer)"
      - "all GET reads"
  - name: ProductionManager
    description: "Production-side operator: batches, tempering, quarantine, molds, tempering lines, custom-order production, order fulfilment"
    identity: "opaque"
    exclusive_operations:
      - "POST /molds, POST /molds/{id}/set-status"
      - "POST /tempering-lines"
      - "POST /batches and all /batches/{id}/* lifecycle except reservations"
      - "POST /custom-orders/{id}/start-production"
      - "POST /custom-orders/{id}/fulfill"
      - "POST /orders/{id}/fulfill"
    shared_operations:
      - "all GET reads"
  - name: Admin
    description: "Operator with catalog, customer, wallet, subscription-billing, and system-clock authority"
    identity: "opaque"
    exclusive_operations:
      - "POST /products, PATCH /products/{id}"
      - "POST /customers, PATCH /customers/{id}, POST /customers/{id}/wallet/adjust"
      - "POST /subscriptions/{id}/advance"
      - "POST /subscription-shipments/{id}/ship"
      - "POST /_clock/set_current_utc, POST /_inventory/sweep-expired"
    shared_operations:
      - "all GET reads"
