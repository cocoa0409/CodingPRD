        claim_type: correct_result
        grounds: [calculations.sampling_cadence_schedule, entities.SalmonellaTest]
        distinguishing_aspect: "A LAYING flock entering the W1 age window [40, 45] weeks with no ENVIRONMENTAL test gets one auto-created by the ops run: placement 2025-10-25 -> age 40 at clock 2026-08-01; scheduled_date pinned to the last day of the window (placement + 321 days == 2026-09-11)."
