          assert:
            - "the lines response returns 4 rows and no row carries a `version` or `updated_at` key"
            - "every line row has status == \"ACTIVE\" and gross_share_cents == 147500000"
            - "the ballots response returns 4 rows, none of which carries a `version` or `updated_at` key, and each has weight_bps == 10000 and status == \"CAST\""
            - "§1.5 declares no PATCH, PUT or DELETE endpoint whose path resolves to a DistributionLine, PostseasonUnit or Ballot"

      - name: corner_hybrid_topology_cross_aggregate_association_validated
        claim_type: Cross-cutting associations validated across the hierarchy
        grounds:
          - complexity_profile.entity_topology
          - entities.ChampionshipEvent.fields.host_member_id
          - entities.ChampionshipEvent.fields.revenue_pool_id
          - entities.ScheduleGame.fields.venue_id
          - validations[priority=42]
        distinguishing_aspect: |
          A ChampionshipEvent simultaneously points at a Conference-owned pool, a
          Conference-owned member and a globally-owned venue, and a ScheduleGame's
          venue must be the home member's own venue: the hybrid topology means the
          venue association is checked against a field of a sibling aggregate
          (Member.home_venue_id) rather than against the venue table alone.
        test_recipe:
          setup:
            - "The conference exists with four charter members: North and South are homed at the Northfield Dome, East and West at the Eastport Arena."
            - "An FY2027 MEDIA_RIGHTS pool exists in DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_pool
          trigger:
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "${m_e_id}", venue_id: "${v2_id}", game_date: "2026-09-05T19:00:00Z", fiscal_year: 2027, media_designated: true }
              as: ScheduleCoordinator
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "${m_e_id}", venue_id: "${v1_id}", game_date: "2026-09-05T19:00:00Z", fiscal_year: 2027, media_designated: true }
              as: ScheduleCoordinator
              captures: { gh_id: $.data.id }
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_s_id}", revenue_pool_id: "${rp_id}", sport: "WRESTLING", fiscal_year: 2027, window_start: "2027-03-01T00:00:00Z", window_end: "2027-03-05T00:00:00Z" }
              as: ScheduleCoordinator
              captures: { ce_id: $.data.id }
          assert:
            - "the first game create returns HTTP 422 with error.error_id == ERR_VENUE_NOT_HOME_VENUE, because the Eastport Arena is not North's home_venue_id"
            - "the second game create returns HTTP 201 and ScheduleGame.${gh_id}.venue_id == ${v1_id}"
            - "the event create returns HTTP 201 and ChampionshipEvent.${ce_id} links venue ${v2_id}, host ${m_s_id} and pool ${rp_id} even though the host is not homed at that venue, because a championship host is not bound by the home-venue rule"
            - "ChampionshipEvent.${ce_id}.status == \"SCHEDULED\", .ticket_revenue_cents == 0, .host_share_cents == 0 and .participant_pool_cents == 0"

  # ===================================================================
  - section: state_machines
    instances:

      - name: corner_budget_approval_transitions_conference_to_operating
        claim_type: Valid Transition
        grounds:
          - state_machines.BudgetProposal.VOTING_to_APPROVED
          - state_machines.Conference.FORMING_to_OPERATING
          - calculations.vote_tally
          - calculations.reserve_posture_derivation
        distinguishing_aspect: |
          Closing the ballot on a unanimously supported budget must move two
          entities in one call: the proposal to APPROVED and the conference from
          FORMING to OPERATING, writing a reserve target of 18000000 that
          immediately drops the posture to FROZEN because the reserve is still
          empty.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members at 10000 bps each."
            - "An FY2027 budget proposal for 120000000 operating and 20000000 governance cents is in VOTING with four FOR ballots cast."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
          trigger:
            - *c_bp_close
          assert:
            - "BudgetProposal.${bp_id}.status == \"APPROVED\" with approved_by_user_id == \"u_fin_1\""
            - "BudgetProposal.${bp_id}.eligible_weight_bps == 40000, .cast_weight_bps == 40000, .for_weight_bps == 40000, .against_weight_bps == 0, .quorum_met == true, .approval_ratio_bps == 10000 and .required_approval_bps == 6670"
            - "Conference.governance_status == \"OPERATING\", .approved_operating_expense_cents == 120000000 and .approved_governance_expense_cents == 20000000"
            - "Conference.reserve_target_cents == 18000000, .reserve_balance_cents == 0, .funded_ratio_bps == 0 and .reserve_posture == \"FROZEN\""

      - name: corner_initial_states_match_declared_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.RevenuePool.initial_state
          - state_machines.BowlAppearance.initial_state
          - state_machines.PostseasonUnit.initial_state
          - state_machines.MembershipAction.initial_state
          - state_machines.BudgetProposal.initial_state
          - state_machines.ScheduleGame.initial_state
          - state_machines.ProtectedRivalry.initial_state
          - state_machines.ChampionshipEvent.initial_state
          - state_machines.Member.initial_state
        distinguishing_aspect: |
          Nine entities declare nine different initial states, and a create call
          must land on the declared one rather than on the first state of the
          happy path: a pool starts DRAFT (not OPEN), a bowl appearance SUBMITTED
          with its claimed units already materialised as PROVISIONAL, and a
          PETITIONED member with 0 voting weight rather than a seated one.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and a reserve of 12000000 cents."
            - "Four charter members are seated at 10000 bps each."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_conf_read
            - *c_res12
          trigger:
            - *c_pool
            - &c_mc
              call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Central Plains University", institution_code: "CEN", admission_path: "PETITIONED", home_venue_id: "${v2_id}", grant_of_rights_through_fiscal_year: 2034, entry_fee_cents: 0 }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_c_id: $.data.id }
            - &c_ba_n
              call: "POST /members/${m_n_id}/bowl-appearances"
              payload: { fiscal_year: 2027, event_name: "North Prairie Bowl", event_tier: "TOURNAMENT", payout_cents: 12000000, submitted_expense_cents: 9500000, travel_miles: 1400, units_claimed: 2 }
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
              captures: { ba_n_id: $.data.id }
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_s_id}", revenue_pool_id: "${rp_id}", sport: "WRESTLING", fiscal_year: 2027, window_start: "2027-03-01T00:00:00Z", window_end: "2027-03-05T00:00:00Z" }
              as: ScheduleCoordinator
              captures: { ce_init_id: $.data.id }
            - call: "POST /protected-rivalries"
              payload: { conference_id: "${conf_id}", member_a_id: "${m_n_id}", member_b_id: "${m_e_id}", required_annual_meetings: 1, label: "Harbor Cup" }
              as: ScheduleCoordinator
              captures: { pr_init_id: $.data.id }
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "${m_e_id}", venue_id: "${v1_id}", game_date: "2026-09-05T19:00:00Z", fiscal_year: 2027, media_designated: true, protected_rivalry_id: "${pr_init_id}" }
              as: ScheduleCoordinator
              captures: { g_init_id: $.data.id }
            - &c_ma_admit
              call: "POST /membership-actions"
              payload: { conference_id: "${conf_id}", member_id: "${m_c_id}", action_type: "ADMIT", effective_fiscal_year: 2028, entry_fee_cents: 0, rationale: "Footprint expansion" }
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { ma_id: $.data.id }
            - call: "POST /budget-proposals"
              payload: { conference_id: "${conf_id}", fiscal_year: 2028, proposed_operating_expense_cents: 130000000, proposed_governance_expense_cents: 21000000 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { bp28_id: $.data.id }
          assert:
            - "RevenuePool.${rp_id}.status == \"DRAFT\" and .audited_expense_cents is null"
            - "Member.${m_c_id}.status == \"PETITIONED\", .distribution_phase_bps == 0, .voting_weight_bps == 0 and .phase_year == 0"
            - "BowlAppearance.${ba_n_id}.status == \"SUBMITTED\" with allowable_expense_cents 0, travel_allowance_cents 0, reimbursement_ceiling_cents 0, reimbursed_cents 0 and residual_to_pool_cents 0"
            - "GET /bowl-appearances/${ba_n_id}/postseason-units returns 2 rows, both with status == \"PROVISIONAL\", fiscal_year == 2027 and unit_index 1 and 2"
            - "ChampionshipEvent.${ce_init_id}.status == \"SCHEDULED\""
            - "ProtectedRivalry.${pr_init_id}.status == \"ACTIVE\""
            - "ScheduleGame.${g_init_id}.status == \"SCHEDULED\""
            - "MembershipAction.${ma_id}.status == \"PROPOSED\" with amend_count 0, eligible_weight_bps 0, cast_weight_bps 0 and quorum_met false"
            - "BudgetProposal.${bp28_id}.status == \"DRAFT\" with required_approval_bps == 6670"
            - "Conference.validated_postseason_unit_count == 0, because PROVISIONAL units are not yet validated"

      - name: corner_closed_pool_terminal_state_cannot_reopen
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.RevenuePool.terminal_states
          - validations[priority=22]
          - errors[ERR_POOL_STATE_INVALID]
        distinguishing_aspect: |
          CLOSED is a terminal state, so all four pool triggers - open, close-books,
          reopen and close - must be refused from it with the same
          ERR_POOL_STATE_INVALID, and no run may be computed against it either;
          reopen is the interesting one because it is legal from BOOKS_CLOSED, the
          state immediately preceding CLOSED.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and a reserve of 12000000 cents."
            - "The FY2026 EQUAL_SHARE pool has been opened, had its books closed at 4000000 audited cents, and then closed."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_conf_read
            - *c_res12
            - *c_p26
            - *c_p26_open
            - *c_p26_cb
            - call: "POST /revenue-pools/${p26_id}/close"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "GET /revenue-pools/${p26_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { p26_vc: $.data.version }
          trigger:
            - call: "POST /revenue-pools/${p26_id}/reopen"
              payload: { reason: "late restatement" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /revenue-pools/${p26_id}/open"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /revenue-pools/${p26_id}/close-books"
              payload: { audited_expense_cents: 5000000 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /revenue-pools/${p26_id}/close"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /revenue-pools/${p26_id}/distribution-runs"
              payload: { variant: "FINAL_AUDITED", expected_pool_version: "${p26_vc}", memo: "post-closure attempt" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
          assert:
            - "all five calls return HTTP 409 with error.error_id == ERR_POOL_STATE_INVALID"
            - "RevenuePool.${p26_id}.status is still \"CLOSED\" and .audited_expense_cents is still 4000000"
            - "GET /revenue-pools/${p26_id}/distribution-runs returns pagination.total_count == 0"

      - name: corner_repeated_action_endpoints_second_attempt_rejected
        claim_type: Idempotency
        grounds:
          - validations[priority=22]
          - validations[priority=26]
          - validations[priority=24]
          - validations[priority=27]
          - errors[ERR_PROPOSAL_STATE_INVALID]
          - errors[ERR_APPEARANCE_STATE_INVALID]
          - errors[ERR_GAME_STATE_INVALID]
        distinguishing_aspect: |
          None of the action endpoints are idempotent: replaying open, open-voting,
          begin-review and play each fails on the second attempt with that
          entity's own state-invalid code, so a retried request must not be
          silently absorbed as a no-op.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members."
            - "An FY2027 pool is OPEN, an FY2027 budget proposal is in VOTING, North's bowl appearance is UNDER_REVIEW and a North-South game has been PLAYED."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_pool
            - call: "POST /revenue-pools/${rp_id}/open"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - *c_bp
            - *c_bp_open
            - *c_ba_n
            - call: "POST /bowl-appearances/${ba_n_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_n_id}", away_member_id: "${m_s_id}", venue_id: "${v1_id}", game_date: "2026-09-05T19:00:00Z", fiscal_year: 2027, media_designated: true }
              as: ScheduleCoordinator
              captures: { g_idem_id: $.data.id }
            - call: "POST /schedule-games/${g_idem_id}/play"
              payload: {}
              as: ScheduleCoordinator
          trigger:
            - call: "POST /revenue-pools/${rp_id}/open"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /budget-proposals/${bp_id}/open-voting"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /bowl-appearances/${ba_n_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /schedule-games/${g_idem_id}/play"
              payload: {}
              as: ScheduleCoordinator
          assert:
            - "the pool replay returns HTTP 409 with error.error_id == ERR_POOL_STATE_INVALID and RevenuePool.${rp_id}.status is still \"OPEN\""
            - "the proposal replay returns HTTP 409 with error.error_id == ERR_PROPOSAL_STATE_INVALID and BudgetProposal.${bp_id}.status is still \"VOTING\""
            - "the appearance replay returns HTTP 409 with error.error_id == ERR_APPEARANCE_STATE_INVALID and BowlAppearance.${ba_n_id}.status is still \"UNDER_REVIEW\""
            - "the game replay returns HTTP 409 with error.error_id == ERR_GAME_STATE_INVALID and ScheduleGame.${g_idem_id}.status is still \"PLAYED\""

      - name: corner_triggers_from_undeclared_source_state_are_rejected
        claim_type: Invalid Transitions
        grounds:
          - validations[priority=23]
          - validations[priority=25]
          - validations[priority=28]
          - validations[priority=29]
          - validations[priority=30]
          - errors[ERR_RUN_STATE_INVALID]
          - errors[ERR_ACTION_STATE_INVALID]
          - errors[ERR_EVENT_STATE_INVALID]
          - errors[ERR_REPORT_STATE_INVALID]
          - errors[ERR_MEMBER_STATE_INVALID]
        distinguishing_aspect: |
          Each of six triggers is aimed at an entity sitting in a state the
          transition table does not list as a source - settle from SCHEDULED,
          reverse from COMPUTED, accept from DRAFT, execute from PROPOSED, rescind
          from FULL_SHARE and cancel from PLAYED - and each must produce that
          entity's own state-invalid code rather than a shared generic one.
        test_recipe:
          setup:
            - "The conference is OPERATING with an approved FY2027 budget and a reserve of 12000000 cents."
            - "The FY2026 pool is BOOKS_CLOSED with a COMPUTED FINAL_AUDITED run and a DRAFT audit report."
            - "Central is PETITIONED with a PROPOSED ADMIT action, a SCHEDULED championship event is hosted by South, and a North-East game has been PLAYED."
          setup_api_calls:
