            - "link 1 — MaintenanceDispatch.${d_id}.response_met == true (arrived 2026-06-12T08:00:00Z against response_deadline_at 2026-06-12T11:00:00Z)"
            - "link 2 — OutageEvent.${o_id}.state == RESOLVED"
            - "link 2 — OutageEvent.${o_id}.cleared_at == \"2026-06-12T14:00:00Z\""
            - "link 3 — ChargingPort.${p_id}.service_state == IN_SERVICE"
            - "link 3 — ChargingPort.${p_id}.maintenance_state == NONE"
            - "link 4 — Station.${st_id}.out_of_service_port_count == 0"
            - "link 4 — Station.${st_id}.status == OPERATIONAL and Station.${st_id}.suspension_source == NONE"
            - "link 4 — Station.${st_id}.gross_downtime_minutes_lifetime == 360"
            - "link 4 — Station.${st_id}.excluded_downtime_minutes_lifetime == 0"
            - "link 4 — Station.${st_id}.billable_downtime_minutes_lifetime == 360"

      - name: terminal_certification_revocation_cascades_three_levels_port_outage_station
        grounds:
          - endpoints[POST /charging-ports/{port_id}/terminal-certification]
          - state_machines.ChargingPort.transitions.IN_SERVICE_to_OUT_OF_SERVICE
          - entities.OutageEvent.fields.is_system_generated
          - state_machines.Station.transitions.OPERATIONAL_to_SUSPENDED
          - calculations.payment_interoperability_score
          - endpoints[GET /charging-ports/{id}/outage-events]
        distinguishing_aspect: |
          Depth 3, triggered by a completely different transition — a ComplianceAuditor
          revoking a payment-terminal certification, which is not a state transition on the
          cascading entities at all. (1) The ChargingPort's certification dimension flips to
          REVOKED and its service dimension is forced to OUT_OF_SERVICE; (2) that forced
          service change is what manufactures a system OutageEvent
          (is_system_generated true, MAJOR, fault_code TERMINAL_CERT_REVOKED) whose id the
          caller never supplied and can only discover through the port's sub-resource
          listing; (3) the new out-of-service port is what suspends the Station with
          suspension_source AUTOMATIC and re-scores payment_interop_score from 100.00 down
          to 90.00. Both the depth (3 vs 4) and the triggering transition differ from the
          dispatch-completion instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-18T10:00:00Z."
            - "HostSite HS-CR-1 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 800.00."
            - "Station ST-CR-1 (DCFC_150, declared_port_count 2) OPERATIONAL, out_of_service_port_count 0, payment_interop_score 100.00."
            - "ChargingPorts DS-CR-1 and DS-CR-2, both CERTIFIED with roaming_ocpi_version V2_2_1 and all three interoperability flags true, both IN_SERVICE."
            - "No OutageEvent exists on either port."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-18T10:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-CR-1", host_org_name: "Union Depot Ventures", committed_service_capacity_kw: 800.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-CR-1", power_class: "DCFC_150", declared_port_count: 2, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-CR-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p1_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "NACS", rated_power_kw: 150.00, dispenser_serial: "DS-CR-2", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p2_id: $.data.id }
            - call: "POST /charging-ports/${p1_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /charging-ports/${p2_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
          trigger:
            - call: "POST /charging-ports/${p1_id}/terminal-certification"
              payload: { certification_status: "REVOKED" }
              as: ComplianceAuditor
            - call: "GET /charging-ports/${p1_id}/outage-events"
              payload: {}
              as: NetworkOperator
          assert:
            - "link 1 — ChargingPort.${p1_id}.terminal_certification_status == REVOKED"
            - "link 1 — ChargingPort.${p1_id}.service_state == OUT_OF_SERVICE"
            - "link 2 — GET /charging-ports/${p1_id}/outage-events returns exactly 1 OutageEvent"
            - "link 2 — that OutageEvent.is_system_generated == true, fault_class == MAJOR, fault_code == \"TERMINAL_CERT_REVOKED\", state == DETECTED, detected_at == \"2026-06-18T10:00:00Z\", cleared_at == null"
            - "link 3 — Station.${st_id}.out_of_service_port_count == 1"
            - "link 3 — Station.${st_id}.status == SUSPENDED and Station.${st_id}.suspension_source == AUTOMATIC"
            - "link 3 — Station.${st_id}.payment_interop_score == 90.00 (was 100.00; only the roaming term lost one compliant port)"
            - "ChargingPort.${p2_id}.service_state == IN_SERVICE and ChargingPort.${p2_id}.terminal_certification_status == CERTIFIED (the cascade did not spill onto the untouched port)"

  # ===========================================================================
  # RULE 5 — Priority-pair validation conflicts across DIFFERENT category pairs
  #   instance 1: state (p8) vs business_constraint (p19)
  #   instance 2: business_safety (p11) vs business_referential (p13)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: commission_state_check_wins_over_interop_constraint
        grounds:
          - validations[priority=8]
          - validations[priority=19]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INTEROP_SCORE_BELOW_THRESHOLD]
          - endpoints[POST /stations/{station_id}/commission]
        distinguishing_aspect: |
          Category pair `state` (priority 8) vs `business_constraint` (priority 19). Both
          rules are violated by the same single call: the Station is still in DRAFT (never
          moved to COMMISSIONING) AND its payment_interop_score is 60.00, far below the
          90.00 gate. The implementation must return ERR_INVALID_STATE (409), never
          ERR_INTEROP_SCORE_BELOW_THRESHOLD (422) — a naive implementation that evaluates
          the cheap numeric gate before the state guard fails this test on both error_id and
          HTTP status.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-02T09:00:00Z."
            - "HostSite HS-PC-1 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 400.00 (so no commissioning gate at priority 18 is violated)."
            - "Station ST-PC-1 (DCFC_150, declared_port_count 1) still in status DRAFT."
            - "One ChargingPort DS-PC-1 with contactless_enabled true, plug_and_charge_enabled false, price_display_verified true, no roaming version and no certification, giving payment_interop_score 60.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-02T09:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-PC-1", host_org_name: "Foxglove Center LLC", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-PC-1", power_class: "DCFC_150", declared_port_count: 1, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-PC-1", terminal_model: "PT-4", contactless_enabled: true, plug_and_charge_enabled: false, price_display_verified: true }
              as: NetworkOperator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == \"ERR_INVALID_STATE\""
            - "response error_id != \"ERR_INTEROP_SCORE_BELOW_THRESHOLD\" even though that rule is also violated"
            - "Station.${st_id}.status == DRAFT (unchanged) and Station.${st_id}.commissioned_at == null"
            - "Station.${st_id}.payment_interop_score == 60.00 (the lower-priority condition really was violated)"

      - name: dispatch_technician_certification_check_wins_over_outage_port_mismatch
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - errors[ERR_TECHNICIAN_NOT_CERTIFIED]
          - errors[ERR_OUTAGE_PORT_MISMATCH]
          - endpoints[POST /maintenance-dispatches]
        distinguishing_aspect: |
          A DIFFERENT category pair from the first instance: `business_safety` (priority 11)
          vs `business_referential` (priority 13), both in the 400-family rather than a
          state-vs-constraint pair. One call violates both: the technician holds only an L2
          certification (rank 1) against a DCFC_350 station (rank 3), and the supplied
          port_id points at the station's second port while the outage sits on the first.
          The expected answer is ERR_TECHNICIAN_NOT_CERTIFIED (422); an implementation that
          resolves referential integrity first would emit ERR_OUTAGE_PORT_MISMATCH (409).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-19T12:00:00Z."
            - "HostSite HS-PD-2 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 1600.00."
            - "Station ST-PD-2 (DCFC_350, declared_port_count 2) OPERATIONAL, payment_interop_score 100.00."
            - "ChargingPorts DS-PD-2A and DS-PD-2B, both CERTIFIED with roaming V2_3_0."
            - "OutageEvent MAJOR in state CLASSIFIED on DS-PD-2A only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-19T12:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-PD-2", host_org_name: "Terrace Row Investors", committed_service_capacity_kw: 1600.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-PD-2", power_class: "DCFC_350", declared_port_count: 2, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "NACS", rated_power_kw: 350.00, dispenser_serial: "DS-PD-2A", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_3_0" }
              as: NetworkOperator
              captures: { p1_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 350.00, dispenser_serial: "DS-PD-2B", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_3_0" }
              as: NetworkOperator
              captures: { p2_id: $.data.id }
            - call: "POST /charging-ports/${p1_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /charging-ports/${p2_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p1_id}", fault_code: "EVSE-MAJ-11", fault_class: "MAJOR", detected_at: "2026-06-19T11:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "MAJOR" }
              as: NetworkOperator
          trigger:
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o_id}", port_id: "${p2_id}", technician_user_id: "tech-l2-1", technician_certification_class: "L2", window_start_at: "2026-06-19T13:00:00Z", window_end_at: "2026-06-19T18:00:00Z" }
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response error_id == \"ERR_TECHNICIAN_NOT_CERTIFIED\""
            - "response error_id != \"ERR_OUTAGE_PORT_MISMATCH\" even though port_id belongs to a different port than the outage"
            - "OutageEvent.${o_id}.state == CLASSIFIED (no partial transition to DISPATCHED)"
            - "ChargingPort.${p2_id}.maintenance_state == NONE (no dispatch was created)"
            - "GET /maintenance-dispatches?outage_event_id=${o_id} returns 0 rows"

  # ===========================================================================
  # RULE 6 — Boundary precision on DIFFERENT metrics at DISTINCT endpoints
  #   instance 1: payment_interop_score (2dp percentage) at commission
  #   instance 2: total_port_minutes (integer denominator) at compute-provisional
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: commission_accepts_interop_score_exactly_at_ninety_and_rejects_eighty
        grounds:
          - calculations.payment_interoperability_score
          - validations[priority=19]
          - errors[ERR_INTEROP_SCORE_BELOW_THRESHOLD]
          - endpoints[POST /stations/{station_id}/commission]
        distinguishing_aspect: |
          Metric: payment_interop_score, a 2-decimal weighted percentage, tested at the
          inclusive COMMISSION_MIN_SCORE boundary on POST /stations/{station_id}/commission.
          Station A scores exactly 90.00 (one of two ports roaming-compliant:
          0.40 + 0.20 + 0.20 + 0.20 * 1/2) and must be ACCEPTED, proving the comparison is
          `>=` and not `>`. Station B, differing only in that neither port is
          roaming-compliant, scores 80.00 and must be rejected. The pair pins the boundary
          from both sides on the same metric.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-03T09:00:00Z."
            - "HostSite HS-BD-1 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 1600.00."
            - "Station A ST-BD-A (DCFC_150, declared_port_count 2) in status COMMISSIONING; port A1 CERTIFIED with roaming V2_2_1, port A2 uncertified with roaming V2_2_1; both ports have all three interoperability flags true, so payment_interop_score == 90.00."
            - "Station B ST-BD-B (DCFC_150, declared_port_count 2) in status COMMISSIONING; ports B1 and B2 both uncertified with roaming V2_2_1 and all three flags true, so payment_interop_score == 80.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-03T09:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-BD-1", host_org_name: "Gateway Rest Stop Co", committed_service_capacity_kw: 1600.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-BD-A", power_class: "DCFC_150", declared_port_count: 2, corridor_designated: false }
              as: NetworkOperator
              captures: { sta_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${sta_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-BD-A1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { pa1_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${sta_id}", connector_type: "NACS", rated_power_kw: 150.00, dispenser_serial: "DS-BD-A2", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { pa2_id: $.data.id }
            - call: "POST /charging-ports/${pa1_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${sta_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-BD-B", power_class: "DCFC_150", declared_port_count: 2, corridor_designated: false }
              as: NetworkOperator
              captures: { stb_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${stb_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-BD-B1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { pb1_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${stb_id}", connector_type: "NACS", rated_power_kw: 150.00, dispenser_serial: "DS-BD-B2", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { pb2_id: $.data.id }
            - call: "POST /stations/${stb_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
          trigger:
            - call: "POST /stations/${sta_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /stations/${stb_id}/commission"
              payload: {}
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "Station A: payment_interop_score == 90.00, exactly at COMMISSION_MIN_SCORE"
            - "Station A: HTTP status == 200 and Station.${sta_id}.status == OPERATIONAL and Station.${sta_id}.commissioned_at == \"2026-06-03T09:00:00Z\""
            - "Station B: payment_interop_score == 80.00"
            - "Station B: HTTP status == 422 and error_id == \"ERR_INTEROP_SCORE_BELOW_THRESHOLD\""
            - "Station B: Station.${stb_id}.status == COMMISSIONING (unchanged) and Station.${stb_id}.commissioned_at == null"

      - name: compute_provisional_rejects_empty_eligible_port_minutes_denominator
        grounds:
          - calculations.station_uptime_percentage
          - validations[priority=23]
          - errors[ERR_NO_REPORTABLE_PORT_MINUTES]
          - endpoints[POST /uptime-reports/{uptime_report_id}/compute-provisional]
        distinguishing_aspect: |
          A DIFFERENT metric at a DIFFERENT endpoint: total_port_minutes, an integer
          denominator, tested at its degenerate zero boundary on
          POST /uptime-reports/{uptime_report_id}/compute-provisional rather than at a
          percentage threshold on commission. The station's only port was created
          2026-06-15T00:00:00Z, strictly after period_start 2026-06-01T00:00:00Z, so the
          `created_at <= period_start` eligibility filter yields the empty set,
          eligible_port_count 0 and total_port_minutes 0. An implementation that divides
          before checking raises ZeroDivisionError instead of returning the declared 422.
        test_recipe:
          setup:
            - "Logical clock walked from 2026-06-15T00:00:00Z to 2026-07-15T00:00:00Z."
            - "HostSite HS-BD-2 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 400.00."
            - "Station ST-BD-2 (DCFC_150, declared_port_count 1) OPERATIONAL."
            - "Its single ChargingPort DS-BD-2 has created_at 2026-06-15T00:00:00Z, strictly AFTER the reporting period start."
            - "UptimeReport over 2026-06-01T00:00:00Z .. 2026-07-01T00:00:00Z in state DRAFT (span 43200 minutes, comfortably above MIN_REPORTING_PERIOD_MINUTES)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-BD-2", host_org_name: "Cypress Landing Group", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-BD-2", power_class: "DCFC_150", declared_port_count: 1, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-BD-2", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /uptime-reports"
              payload: { station_id: "${st_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: NetworkOperator
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /uptime-reports/${rp_id}/compute-provisional"
              payload: {}
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response error_id == \"ERR_NO_REPORTABLE_PORT_MINUTES\""
            - "UptimeReport.${rp_id}.state == DRAFT (unchanged)"
            - "UptimeReport.${rp_id}.uptime_pct == null and UptimeReport.${rp_id}.methodology == null"
            - "no ZeroDivisionError or 500 is produced"

  # ===========================================================================
  # RULE 7 — Cross-entity state dependency over DIFFERENT entity pairs
  #   instance 1: Station depends on HostSite.agreement_status
  #   instance 2: ReimbursementClaim depends on UptimeReport.state
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: station_commission_blocked_until_host_site_agreement_is_executed
        grounds:
          - validations[priority=18]
          - errors[ERR_HOST_AGREEMENT_NOT_EXECUTED]
          - entities.HostSite.fields.agreement_status
          - endpoints[POST /stations/{station_id}/commission]
          - endpoints[PATCH /host-sites/{host_site_id}]
        distinguishing_aspect: |
          Entity pair Station -> HostSite: whether a Station may be commissioned is decided
          by a field on a DIFFERENT entity that the commission call never mentions. With
          agreement_status DRAFT the identical, otherwise-flawless commission call fails
          with ERR_HOST_AGREEMENT_NOT_EXECUTED (422); flipping only the parent HostSite to
          EXECUTED — touching nothing on the Station — makes the very same call succeed. The
          controlling entity is a parent site agreement, which is a different pair from the
          claim/report instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-04T09:00:00Z."
            - "HostSite HS-XD-1 with agreement_status DRAFT, power_upgrade_status ENERGIZED, parking_enforcement_mode TOWING_ENFORCED, committed_service_capacity_kw 400.00."
            - "Station ST-XD-1 (DCFC_150, declared_port_count 1) in status COMMISSIONING."
            - "One ChargingPort DS-XD-1 CERTIFIED with roaming V2_2_1 and all three interoperability flags true, so payment_interop_score == 100.00 and no other commissioning gate is violated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-04T09:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-XD-1", host_org_name: "Overlook Retail Trust", committed_service_capacity_kw: 400.00, agreement_status: "DRAFT", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-XD-1", power_class: "DCFC_150", declared_port_count: 1, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-XD-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
          trigger:
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
              captures: { err: $.data.error_id }
            - call: "PATCH /host-sites/${site_id}"
              payload: { agreement_status: "EXECUTED" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
          assert:
            - "first commission attempt: HTTP status == 422 and error_id == \"ERR_HOST_AGREEMENT_NOT_EXECUTED\""
            - "first commission attempt: Station.${st_id}.status == COMMISSIONING (unchanged) and Station.${st_id}.commissioned_at == null"
            - "first commission attempt: Station.${st_id}.payment_interop_score == 100.00, proving the block came from the parent site and not from the interoperability gate"
            - "after PATCH: HostSite.${site_id}.agreement_status == EXECUTED"
            - "second commission attempt: HTTP status == 200 and Station.${st_id}.status == OPERATIONAL and Station.${st_id}.suspension_source == NONE"
            - "second commission attempt: Station.${st_id}.commissioned_at == \"2026-06-04T09:00:00Z\""
            - "nothing on the Station itself changed between the two attempts — only the HostSite field the Station depends on"

      - name: claim_review_blocked_until_uptime_report_reaches_accepted
        grounds:
          - validations[priority=21]
          - errors[ERR_UPTIME_REPORT_NOT_ACCEPTED]
          - state_machines.ReimbursementClaim.transitions.PENDING_to_REVIEW
          - state_machines.UptimeReport.transitions.SUBMITTED_to_ACCEPTED
          - endpoints[POST /reimbursement-claims/{claim_id}/review]
          - endpoints[POST /uptime-reports/{uptime_report_id}/program-review]
        distinguishing_aspect: |
          A DIFFERENT entity pair — ReimbursementClaim -> UptimeReport — and the controlling
          attribute is the parent's STATE field rather than a plain configuration enum. The
          claim can be created while the report is only SUBMITTED, but it cannot enter
          REVIEW: the review call fails with ERR_UPTIME_REPORT_NOT_ACCEPTED (409, a
          different status class from the 422 in the Station/HostSite instance). Advancing
          only the report to ACCEPTED unblocks the identical review call, which then
          snapshots effective_uptime_pct from the parent.
        test_recipe:
          setup:
            - "Logical clock walked from 2026-05-01T00:00:00Z to 2026-07-15T00:00:00Z."
            - "HostSite HS-XD-2 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 400.00."
            - "Station ST-XD-2 (DCFC_150, declared_port_count 1) OPERATIONAL with one ChargingPort DS-XD-2 created 2026-05-01T00:00:00Z, CERTIFIED, IN_SERVICE."
            - "No OutageEvent at all on the station, so the report over 2026-06-01T00:00:00Z .. 2026-07-01T00:00:00Z scores uptime_pct 100.00 under both methodologies."
            - "UptimeReport in state SUBMITTED with finalized_by_user_id \"auditor-1\"."
            - "ReimbursementClaim in state PENDING with one 5000-cent line item, created against the SUBMITTED report."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-XD-2", host_org_name: "Sandhill Transit Authority", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-XD-2", power_class: "DCFC_150", declared_port_count: 1, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-XD-2", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /uptime-reports"
              payload: { station_id: "${st_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: NetworkOperator
              captures: { rp_id: $.data.id }
            - call: "POST /uptime-reports/${rp_id}/compute-provisional"
              payload: {}
              as: NetworkOperator
            - call: "POST /uptime-reports/${rp_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /uptime-reports/${rp_id}/submit"
              payload: {}
              as: NetworkOperator
              captures: { rp_ver: $.data.version }
            - call: "POST /reimbursement-claims"
              payload: { uptime_report_id: "${rp_id}", line_items: [{ port_id: "${p_id}", category: "OANDM", amount_cents: 5000 }], expected_uptime_report_version: "${rp_ver}" }
              as: NetworkOperator
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /reimbursement-claims/${cl_id}/review"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { err: $.data.error_id }
            - call: "POST /uptime-reports/${rp_id}/program-review"
              payload: { outcome: "ACCEPT" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /reimbursement-claims/${cl_id}/review"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
          assert:
            - "first review attempt: HTTP status == 409 and error_id == \"ERR_UPTIME_REPORT_NOT_ACCEPTED\""
            - "first review attempt: ReimbursementClaim.${cl_id}.state == PENDING and effective_uptime_pct == null and withhold_rate == null"
            - "after program-review: UptimeReport.${rp_id}.state == ACCEPTED and UptimeReport.${rp_id}.uptime_pct == 100.00"
            - "second review attempt: HTTP status == 200 and ReimbursementClaim.${cl_id}.state == REVIEW"
            - "second review attempt: ReimbursementClaim.${cl_id}.effective_uptime_pct == 100.00 and ReimbursementClaim.${cl_id}.withhold_rate == 0.00"
            - "ReimbursementClaim.${cl_id}.requested_amount_cents == 5000 (unchanged by either attempt)"

  # ===========================================================================
  # RULE 8 — Resource/temporal overlap with DIFFERENT interval semantics on
  #          DIFFERENT resource entities
  #   instance 1: HALF-OPEN windows keyed on ChargingPort
  #   instance 2: CLOSED-CLOSED periods keyed on Station
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: dispatch_windows_are_half_open_per_port_so_touching_endpoints_are_allowed
        grounds:
          - validations[priority=15]
          - errors[ERR_DISPATCH_WINDOW_OVERLAP]
          - endpoints[POST /maintenance-dispatches]
          - entities.MaintenanceDispatch.fields.window_start_at
          - entities.MaintenanceDispatch.fields.window_end_at
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [window_start_at, window_end_at), keyed on the
          ChargingPort resource. Because the upper endpoint is exclusive, a second dispatch
          starting at the exact instant the first one ends is LEGAL — the discriminating
          case that a naive closed-interval comparison rejects. A third window that genuinely
          straddles the shared endpoint is rejected with ERR_DISPATCH_WINDOW_OVERLAP (409).
        test_recipe:
          setup:
            - "Logical clock at 2026-06-10T09:00:00Z."
            - "HostSite HS-OV-1 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 400.00."
            - "Station ST-OV-1 (DCFC_150, declared_port_count 1) OPERATIONAL."
            - "ONE ChargingPort DS-OV-1 CERTIFIED and IN_SERVICE — the single contested resource."
            - "Three MINOR OutageEvents on that one port, all with detected_at 2026-06-10T08:00:00Z and all in state CLASSIFIED (MINOR does not take the port out of service, so the station stays OPERATIONAL)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-10T09:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-OV-1", host_org_name: "Quarry Bend Properties", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-OV-1", power_class: "DCFC_150", declared_port_count: 1, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-OV-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "OCPP-MIN-A1", fault_class: "MINOR", detected_at: "2026-06-10T08:00:00Z" }
              as: NetworkOperator
              captures: { o1_id: $.data.id }
            - call: "POST /outage-events/${o1_id}/classify"
              payload: { fault_class: "MINOR" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "OCPP-MIN-A2", fault_class: "MINOR", detected_at: "2026-06-10T08:00:00Z" }
              as: NetworkOperator
              captures: { o2_id: $.data.id }
            - call: "POST /outage-events/${o2_id}/classify"
              payload: { fault_class: "MINOR" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "OCPP-MIN-A3", fault_class: "MINOR", detected_at: "2026-06-10T08:00:00Z" }
              as: NetworkOperator
              captures: { o3_id: $.data.id }
            - call: "POST /outage-events/${o3_id}/classify"
              payload: { fault_class: "MINOR" }
              as: NetworkOperator
          trigger:
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o1_id}", port_id: "${p_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-06-10T10:00:00Z", window_end_at: "2026-06-10T12:00:00Z" }
              as: NetworkOperator
              captures: { d1_id: $.data.id }
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o2_id}", port_id: "${p_id}", technician_user_id: "tech-2", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-06-10T12:00:00Z", window_end_at: "2026-06-10T14:00:00Z" }
              as: NetworkOperator
              captures: { d2_id: $.data.id }
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o3_id}", port_id: "${p_id}", technician_user_id: "tech-3", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-06-10T11:00:00Z", window_end_at: "2026-06-10T13:00:00Z" }
              as: NetworkOperator
              captures: { err: $.data.error_id }
          assert:
            - "dispatch 1 [10:00, 12:00): HTTP status == 201 and MaintenanceDispatch.${d1_id}.state == CREATED"
            - "dispatch 2 [12:00, 14:00): HTTP status == 201 — its start equals dispatch 1's exclusive end, so touching endpoints do NOT overlap"
            - "dispatch 3 [11:00, 13:00): HTTP status == 409 and error_id == \"ERR_DISPATCH_WINDOW_OVERLAP\""
            - "OutageEvent.${o3_id}.state == CLASSIFIED (the rejected dispatch produced no transition)"
            - "GET /maintenance-dispatches?port_id=${p_id} returns exactly 2 rows"
            - "ChargingPort.${p_id}.maintenance_state == DISPATCH_PENDING (the aggregate repair posture, unchanged by the second live dispatch)"

      - name: uptime_report_periods_are_closed_per_station_so_adjacent_periods_collide
        grounds:
          - validations[priority=16]
          - errors[ERR_REPORTING_PERIOD_OVERLAP]
          - endpoints[POST /uptime-reports]
          - entities.UptimeReport.fields.period_start
          - entities.UptimeReport.fields.period_end
        distinguishing_aspect: |
          The OPPOSITE interval semantics on a DIFFERENT resource entity: reporting periods
          are CLOSED-CLOSED [period_start, period_end] and keyed on the Station rather than
          the ChargingPort. Adjacency therefore IS collision — the exact configuration that
          the half-open dispatch instance accepts is rejected here — and the smallest legal
          separation is one minute. Any implementation that shares one overlap helper between
          the two rules must fail one of the two instances.
        test_recipe:
          setup:
            - "Logical clock walked from 2026-04-01T00:00:00Z to 2026-07-15T00:00:00Z."
            - "HostSite HS-OV-2 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 400.00."
            - "Station ST-OV-2 (DCFC_150, declared_port_count 1) OPERATIONAL with one CERTIFIED port created 2026-04-01T00:00:00Z — the single contested resource."
            - "One existing UptimeReport on that station covering 2026-05-01T00:00:00Z .. 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-OV-2", host_org_name: "Bramble Creek Fuel Stop", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-OV-2", power_class: "DCFC_150", declared_port_count: 1, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-OV-2", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /uptime-reports"
              payload: { station_id: "${st_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z" }
              as: NetworkOperator
              captures: { rp1_id: $.data.id }
          trigger:
            - call: "POST /uptime-reports"
              payload: { station_id: "${st_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: NetworkOperator
              captures: { err: $.data.error_id }
            - call: "POST /uptime-reports"
              payload: { station_id: "${st_id}", period_start: "2026-06-01T00:01:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: NetworkOperator
              captures: { rp2_id: $.data.id }
          assert:
            - "adjacent period starting exactly at the existing period_end: HTTP status == 409 and error_id == \"ERR_REPORTING_PERIOD_OVERLAP\""
            - "period starting one minute later: HTTP status == 201 and UptimeReport.${rp2_id}.state == DRAFT"
            - "UptimeReport.${rp2_id}.period_start == \"2026-06-01T00:01:00Z\" and period_end == \"2026-07-01T00:00:00Z\" (span 43199 minutes, still above MIN_REPORTING_PERIOD_MINUTES 10080)"
            - "GET /stations/${st_id}/uptime-reports returns exactly 2 rows"
            - "UptimeReport.${rp1_id}.period_end == \"2026-06-01T00:00:00Z\" is untouched"

  # ===========================================================================
  # RULE 9 — Compensating invariants over DIFFERENT conserved quantities
  #   instance 1: conserved SPARE-PART UNITS (on_hand == unencumbered + reserved)
  #   instance 2: conserved SESSION MONEY (refund + retained == charged)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: part_reservation_release_restores_spare_part_unit_conservation
        grounds:
          - endpoints[POST /part-reservations/{reservation_id}/disposition]
          - state_machines.PartReservation.transitions.RESERVED_to_RELEASED
          - entities.SparePart.fields.on_hand_qty
          - entities.SparePart.fields.reserved_qty
          - entities.SparePart.fields.unencumbered_qty
          - entities.SparePart.fields.consumed_qty_lifetime
          - concurrency_rules[reservation-create-stale-spare-part]
        distinguishing_aspect: |
          Conserved quantity: SPARE-PART UNITS. The invariant
          on_hand_qty == unencumbered_qty + reserved_qty must hold before the reservation
          (10 == 10 + 0), while it is encumbered (10 == 6 + 4) and after the compensating
          RELEASE (10 == 10 + 0). RELEASE must restore unencumbered_qty to its exact
          pre-reservation value while leaving on_hand_qty and consumed_qty_lifetime
          untouched — the discriminating difference from CONSUME, which draws on_hand_qty
          down instead. No money is involved.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-16T08:00:00Z."
            - "HostSite HS-INV-1 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 400.00."
            - "Station ST-INV-1 (DCFC_150, declared_port_count 1) OPERATIONAL with one CERTIFIED port."
            - "SparePart SP-INV-1 (part_class DISPENSER, lead_time_days 3) restocked to on_hand_qty 10, so reserved_qty 0, backordered_qty 0, unencumbered_qty 10, consumed_qty_lifetime 0."
            - "One MaintenanceDispatch in state CREATED on a CLASSIFIED MAJOR outage for that port."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-16T08:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-INV-1", host_org_name: "Ridgeline Depot Corp", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-INV-1", power_class: "DCFC_150", declared_port_count: 1, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-INV-1", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-MAJ-11", fault_class: "MAJOR", detected_at: "2026-06-16T08:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /outage-events/${o_id}/classify"
              payload: { fault_class: "MAJOR" }
              as: NetworkOperator
            - call: "POST /maintenance-dispatches"
              payload: { outage_event_id: "${o_id}", port_id: "${p_id}", technician_user_id: "tech-1", technician_certification_class: "DCFC_BASIC", window_start_at: "2026-06-16T09:00:00Z", window_end_at: "2026-06-16T19:00:00Z" }
              as: NetworkOperator
              captures: { d_id: $.data.id }
            - call: "POST /spare-parts"
              payload: { part_number: "SP-INV-1", part_class: "DISPENSER", lead_time_days: 3 }
              as: NetworkOperator
              captures: { sp_id: $.data.id }
            - call: "POST /spare-parts/${sp_id}/restock"
              payload: { qty: 10 }
              as: NetworkOperator
              captures: { sp_ver: $.data.version }
          trigger:
            - call: "POST /part-reservations"
              payload: { dispatch_id: "${d_id}", spare_part_id: "${sp_id}", qty: 4, expected_spare_part_version: "${sp_ver}" }
              as: NetworkOperator
              captures: { pr_id: $.data.id }
            - call: "POST /part-reservations/${pr_id}/disposition"
              payload: { action: "RELEASE" }
              as: NetworkOperator
          assert:
            - "before reservation: SparePart.${sp_id}.on_hand_qty == 10, reserved_qty == 0, unencumbered_qty == 10, consumed_qty_lifetime == 0 (invariant 10 == 10 + 0)"
            - "after reservation: PartReservation.${pr_id}.state == RESERVED and PartReservation.${pr_id}.qty == 4"
            - "after reservation: SparePart.${sp_id}.on_hand_qty == 10, reserved_qty == 4, unencumbered_qty == 6, backordered_qty == 0 (invariant 10 == 6 + 4)"
            - "after RELEASE: PartReservation.${pr_id}.state == RELEASED"
            - "after RELEASE: SparePart.${sp_id}.on_hand_qty == 10, reserved_qty == 0, unencumbered_qty == 10, backordered_qty == 0 (invariant restored to exactly 10 == 10 + 0)"
            - "after RELEASE: SparePart.${sp_id}.consumed_qty_lifetime == 0 — a RELEASE is not a consumption and must leave no residue"
            - "SparePart.${sp_id}.unencumbered_qty after RELEASE equals its pre-reservation value exactly, with no drift"

      - name: refund_reversal_restores_session_money_conservation_and_station_liability
        grounds:
          - endpoints[POST /customer-complaints/{complaint_id}/refund-ledger-actions]
          - state_machines.CustomerComplaint.transitions.SETTLED_to_REVERSED
          - entities.CustomerComplaint.fields.refund_amount_cents
          - entities.CustomerComplaint.fields.retained_amount_cents
          - entities.Station.fields.refund_liability_cents
          - calculations.session_refund_amount
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: SESSION MONEY. The invariant
          refund_amount_cents + retained_amount_cents == session_charged_cents (1850) must
          hold at every observation from the first refund request onward — 1000 + 850 while
          requested/approved/settled, and 0 + 1850 again after the compensating REVERSE —
          while the separately maintained Station.refund_liability_cents rises from 0 to
          1000 on SETTLE and returns to exactly 0 on REVERSE. Two ledgers must unwind
          consistently, which is a distinct conservation law from the spare-part unit count.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-22T12:00:00Z."
            - "HostSite HS-INV-2 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 400.00."
            - "Station ST-INV-2 (DCFC_150, declared_port_count 1) with refund_liability_cents 0, currently SUSPENDED (AUTOMATIC) because a CRITICAL fault is open."
            - "ChargingPort DS-INV-2 CERTIFIED, OUT_OF_SERVICE."
            - "OutageEvent CRITICAL on that port, detected_at 2026-06-22T09:00:00Z, cleared_at null, state DETECTED."
            - "CustomerComplaint in state TRIAGED linked to that outage, session_charged_cents 1850, session_energy_kwh 12.500, session_price_per_kwh_cents 48, session_idle_fee_cents 250, refund_state NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-22T08:00:00Z" }
              as: NetworkOperator
            - call: "POST /host-sites"
              payload: { site_code: "HS-INV-2", host_org_name: "Kestrel Wayside Inc", committed_service_capacity_kw: 400.00, agreement_status: "EXECUTED", power_upgrade_status: "ENERGIZED", parking_enforcement_mode: "TOWING_ENFORCED" }
              as: NetworkOperator
              captures: { site_id: $.data.id }
            - call: "POST /stations"
              payload: { host_site_id: "${site_id}", station_code: "ST-INV-2", power_class: "DCFC_150", declared_port_count: 1, corridor_designated: false }
              as: NetworkOperator
              captures: { st_id: $.data.id }
            - call: "POST /charging-ports"
              payload: { station_id: "${st_id}", connector_type: "CCS1", rated_power_kw: 150.00, dispenser_serial: "DS-INV-2", terminal_model: "PT-9", contactless_enabled: true, plug_and_charge_enabled: true, price_display_verified: true, roaming_ocpi_version: "V2_2_1" }
              as: NetworkOperator
              captures: { p_id: $.data.id }
            - call: "POST /charging-ports/${p_id}/terminal-certification"
              payload: { certification_status: "CERTIFIED" }
              as: ComplianceAuditor
            - call: "POST /stations/${st_id}/status-transitions"
              payload: { target_status: "COMMISSIONING" }
              as: NetworkOperator
            - call: "POST /stations/${st_id}/commission"
              payload: {}
              as: NetworkOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-22T12:00:00Z" }
              as: NetworkOperator
            - call: "POST /outage-events"
              payload: { port_id: "${p_id}", fault_code: "EVSE-CRIT-02", fault_class: "CRITICAL", detected_at: "2026-06-22T09:00:00Z" }
              as: NetworkOperator
              captures: { o_id: $.data.id }
            - call: "POST /customer-complaints"
              payload: { station_id: "${st_id}", port_id: "${p_id}", complaint_type: "SESSION_FAILED", session_started_at: "2026-06-22T09:30:00Z", session_ended_at: "2026-06-22T10:00:00Z", session_energy_kwh: 12.500, session_price_per_kwh_cents: 48, session_charged_cents: 1850, session_idle_fee_cents: 250 }
              as: CustomerSupportAgent
              captures: { c_id: $.data.id }
            - call: "POST /customer-complaints/${c_id}/triage"
              payload: { disposition: "LINK_OUTAGE", linked_outage_event_id: "${o_id}" }
              as: CustomerSupportAgent
          trigger:
            - call: "POST /customer-complaints/${c_id}/refund-requests"
              payload: { refund_basis: "ENERGY_PRORATED" }
              as: CustomerSupportAgent
            - call: "POST /customer-complaints/${c_id}/refund-decisions"
              payload: { decision: "APPROVE" }
              as: ComplianceAuditor
            - call: "POST /customer-complaints/${c_id}/refund-ledger-actions"
              payload: { action: "SETTLE" }
              as: CustomerSupportAgent
            - call: "POST /customer-complaints/${c_id}/refund-ledger-actions"
              payload: { action: "REVERSE" }
              as: ComplianceAuditor
          assert:
            - "after refund-requests: CustomerComplaint.${c_id}.refund_state == REQUESTED, refund_amount_cents == 1000, retained_amount_cents == 850 (1000 + 850 == 1850)"
            - "after refund-decisions APPROVE: refund_state == APPROVED, refund_amount_cents == 1000, retained_amount_cents == 850 (sum still 1850)"
            - "after SETTLE: refund_state == SETTLED and refund_settled_at == \"2026-06-22T12:00:00Z\""
            - "after SETTLE: Station.${st_id}.refund_liability_cents == 1000"
            - "after REVERSE: CustomerComplaint.${c_id}.refund_state == REVERSED and refund_settled_at == null"
            - "after REVERSE: CustomerComplaint.${c_id}.refund_amount_cents == 0 and retained_amount_cents == 1850 (0 + 1850 == 1850, conservation preserved)"
            - "after REVERSE: Station.${st_id}.refund_liability_cents == 0 — back to its exact pre-settlement value, no drift"
            - "CustomerComplaint.${c_id}.state == TRIAGED throughout — the complaint dimension never moved while the refund dimension cycled"
