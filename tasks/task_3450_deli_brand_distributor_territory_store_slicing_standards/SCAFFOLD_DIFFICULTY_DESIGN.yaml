scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: distributor_performance_provisional_vs_final
        grounds:
          - calculations.distributor_performance_score
          - entities.Distributor.fields.performance_score_provisional
          - entities.Distributor.fields.performance_score_final
        distinguishing_aspect: |
          Dual variant on the Distributor domain: the provisional score is a plain mean that
          INCLUDES an unverified SUBMITTED visit (score 40), while the final score excludes it
          and blends verified visits with pull and fill components — 73.33 vs 85.50 for identical data.
        test_recipe:
          setup:
            - "distributor D1 (STANDARD) ACTIVE with territory T1 and approved account A1"
            - "product HAM base 5000, opened shelf 72h; plant PL1 run completed with actual 18 waste 0"
            - "order O1 requests 20 units, allocated 18 (PARTIAL) -> fill_pct 90"
            - "visits V1 score 80 VERIFIED, V2 score 100 VERIFIED, V3 score 40 SUBMITTED (unverified)"
            - "4 opened-product logs pulled: 3 on time, 1 late -> on_time_pull_pct 75"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One", service_level_tier: "STANDARD" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "HAM", name: "Ham", base_price_cents: 5000, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${p1}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_units: 100, planned_units: 18 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { r1: $.data.id } }
            - { call: "POST /api/production-runs/${r1}/complete", payload: { actual_units: 18, waste_units: 0 }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${p1}", qty_requested: 20 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { o1: $.data.id } }
            - { call: "POST /api/orders/allocate-week", payload: { delivery_week: "2026-09-07" }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T10:00:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { v1: $.data.id } }
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T10:30:00Z", window_end: "2026-09-02T11:30:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { v2: $.data.id } }
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T12:00:00Z", window_end: "2026-09-02T13:00:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { v3: $.data.id } }
            - { call: "POST /api/service-visits/${v1}/submit", payload: { score: 80, rotation_compliant: true, slicer_presentation_ok: true }, as: DistributorRep, as_user_id: "${d1}" }
            - { call: "POST /api/service-visits/${v2}/submit", payload: { score: 100, rotation_compliant: true, slicer_presentation_ok: true }, as: DistributorRep, as_user_id: "${d1}" }
            - { call: "POST /api/service-visits/${v3}/submit", payload: { score: 40, rotation_compliant: true, slicer_presentation_ok: true }, as: DistributorRep, as_user_id: "${d1}" }
            - { call: "POST /api/service-visits/${v1}/review", payload: { verdict: "VERIFY" }, as: SafetyOfficer }
            - { call: "POST /api/service-visits/${v2}/review", payload: { verdict: "VERIFY" }, as: SafetyOfficer }
            - { call: "POST /api/slicers", payload: { account_id: "${a1}", label: "S1" }, as: RetailManager, as_user_id: "${a1}", captures: { s1: $.data.id } }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-01T00:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g1: $.data.id } }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-01T00:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g2: $.data.id } }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-01T00:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g3: $.data.id } }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-01T00:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g4: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: BrandAdmin }
            - { call: "POST /api/opened-product-logs/${g1}/pull", payload: {}, as: RetailManager, as_user_id: "${a1}" }
            - { call: "POST /api/opened-product-logs/${g2}/pull", payload: {}, as: RetailManager, as_user_id: "${a1}" }
            - { call: "POST /api/opened-product-logs/${g3}/pull", payload: {}, as: RetailManager, as_user_id: "${a1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: BrandAdmin }
            - { call: "POST /api/opened-product-logs/${g4}/pull", payload: {}, as: RetailManager, as_user_id: "${a1}" }
          trigger:
            - { call: "GET /api/distributors", payload: {}, as: BrandAdmin }
          assert:
            - "Distributor.${d1}.performance_score_provisional == 73.33 (mean of 80, 100, 40 including the unverified SUBMITTED visit)"
            - "Distributor.${d1}.performance_score_final == 85.5 (0.5*90 + 0.3*75 + 0.2*90, VERIFIED visits only)"
            - "Distributor.${d1}.performance_score_provisional != Distributor.${d1}.performance_score_final"

      - name: promo_reserve_provisional_vs_final_settlement
        grounds:
          - calculations.promo_settlement
          - entities.PromoProgram.fields.reserved_cents
          - entities.PromoProgram.fields.spent_cents
        distinguishing_aspect: |
          Dual variant on the PromoProgram domain (different entity domain from Distributor):
          the provisional reserve prices 500 FORECAST units at authorization (29500 cents) while
          the final settlement prices 420 ACTUAL redeemed units (24948 cents) — same program, different money.
        test_recipe:
          setup:
            - "approved account A1 under distributor D1; product P base 999 cents"
            - "promo program: price 900, 2026-10-01..2026-10-07, budget 40000, estimated 500 units"
            - "markdown 99 cents; unit_allowance round_half_up(99*0.6)=59; reserve 500*59=29500 <= 40000 OK; floor round_half_up(999*0.85)=850 <= 900 OK"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Promo Item", base_price_cents: 999, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/promo-programs", payload: { account_id: "${a1}", product_id: "${p1}", promo_price_cents: 900, start_date: "2026-10-01", end_date: "2026-10-07", budget_cents: 40000, estimated_units: 500 }, as: DistributorRep, as_user_id: "${d1}", captures: { pp1: $.data.id } }
          trigger:
            - { call: "POST /api/promo-programs/${pp1}/authorize", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/promo-programs/${pp1}/settle", payload: { redemption_lines: [ { period: "2026-10-01", units: 420 } ] }, as: BrandAdmin }
          assert:
            - "PromoProgram.${pp1}.unit_allowance_cents == 59"
            - "PromoProgram.${pp1}.reserved_cents == 29500 (provisional, forecast 500 units)"
            - "PromoProgram.${pp1}.spent_cents == 24948 (final, actual 420 units: round_half_up(420*99*0.6))"
            - "PromoProgram.${pp1}.released_cents == 4552"
            - "PromoProgram.${pp1}.status == SETTLED"

  - rule_id: combinatorial_formula
    instances:
      - name: order_pricing_tier_fee_evaluation_order
        grounds:
          - calculations.order_total_pricing
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the volume tier reads the
          PRE-discount merchandise total while the delivery fee reads the POST-discount total, so an order
          at exactly 100000 cents of merchandise earns the 2% tier yet still pays the 1500-cent fee
          (98000 post-discount < 100000). Constants: tiers 8/5/2% at 500000/200000/100000, fee 1500, free >= 100000 post-discount.
        test_recipe:
          setup:
            - "distributor D1 ACTIVE; plant PL1 with product A (5000c) lot 100 and product B (3000c) lot 100"
            - "O1: A x60 + B x40 -> merchandise 420000; O2: A x20 -> merchandise 100000"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One", service_level_tier: "STANDARD" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "A", name: "Item A", base_price_cents: 5000, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/products", payload: { code: "B", name: "Item B", base_price_cents: 3000, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${pa}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_units: 200, planned_units: 100 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { ra: $.data.id } }
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L2", product_id: "${pb}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_units: 200, planned_units: 100 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { rb: $.data.id } }
            - { call: "POST /api/production-runs/${ra}/complete", payload: { actual_units: 100, waste_units: 0 }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "POST /api/production-runs/${rb}/complete", payload: { actual_units: 100, waste_units: 0 }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${pa}", qty_requested: 60 }, { product_id: "${pb}", qty_requested: 40 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { o1: $.data.id } }
            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${pa}", qty_requested: 20 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { o2: $.data.id } }
          trigger:
            - { call: "POST /api/orders/allocate-week", payload: { delivery_week: "2026-09-07" }, as: PlantScheduler, as_user_id: "${pl1}" }
          assert:
            - "Order.${o1}.merchandise_total_cents == 420000 and Order.${o1}.discount_cents == 21000 (5% tier: 200000 <= 420000 < 500000)"
            - "Order.${o1}.delivery_fee_cents == 0 and Order.${o1}.total_cents == 399000 (399000 >= 100000 post-discount -> free)"
            - "Order.${o2}.merchandise_total_cents == 100000 and Order.${o2}.discount_cents == 2000 (2% tier at the exact 100000 PRE-discount boundary)"
            - "Order.${o2}.delivery_fee_cents == 1500 and Order.${o2}.total_cents == 99500 (98000 post-discount < 100000 -> fee applies)"
            - "Order.${o1}.allocation_status == ALLOCATED and Order.${o2}.allocation_status == ALLOCATED"

      - name: promo_settlement_per_line_rounding_order
        grounds:
          - calculations.promo_settlement
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: settlement rounds each redemption line to integer
          cents FIRST then sums (3 x round_half_up(1*99*0.6) = 3 x 59 = 177); the rejected sum-then-round
          order would give round_half_up(3*59.4) = 178. A different mode from instance
          order_pricing_tier_fee_evaluation_order (mode c).
        test_recipe:
          setup:
            - "approved account A1; product P base 999; authorized program price 900, estimated 10, budget 40000"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Promo Item", base_price_cents: 999, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/promo-programs", payload: { account_id: "${a1}", product_id: "${p1}", promo_price_cents: 900, start_date: "2026-10-01", end_date: "2026-10-07", budget_cents: 40000, estimated_units: 10 }, as: DistributorRep, as_user_id: "${d1}", captures: { pp1: $.data.id } }
            - { call: "POST /api/promo-programs/${pp1}/authorize", payload: { decision: "APPROVE" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/promo-programs/${pp1}/settle", payload: { redemption_lines: [ { period: "2026-10-01", units: 1 }, { period: "2026-10-02", units: 1 }, { period: "2026-10-03", units: 1 } ] }, as: BrandAdmin }
          assert:
            - "PromoProgram.${pp1}.spent_cents == 177 (3 lines x round_half_up(59.4)=59, per-line rounding pinned)"
            - "PromoProgram.${pp1}.spent_cents != 178 (the sum-then-round alternative is rejected)"
            - "PromoProgram.${pp1}.reserved_cents == 590 and PromoProgram.${pp1}.released_cents == 413"

  - rule_id: non_linear_state_machine
    instances:
      - name: incident_contained_reopen_cycle
        grounds:
          - state_machines.Incident.CONTAINED_to_TRIAGED
          - state_machines.Incident.TRIAGED_to_CONFIRMED_RECALL
        distinguishing_aspect: |
          Cyclic machine on Incident: CONTAINED loops back to TRIAGED on new evidence and the incident can
          re-enter CONFIRMED_RECALL a second time; cascades are idempotent on entities already in the target
          state (plant already SHUTDOWN stays SHUTDOWN).
        test_recipe:
          setup:
            - "plant PL1 ACTIVE; incident I1 at PL1 with empty affected_run_ids"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/incidents", payload: { plant_id: "${pl1}", title: "Listeria environmental positive", severity: "HIGH", affected_run_ids: [] }, as: SafetyOfficer, captures: { i1: $.data.id } }
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "TRIAGED" }, as: SafetyOfficer }
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "CONFIRMED_RECALL" }, as: SafetyOfficer }
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "CONTAINED" }, as: SafetyOfficer }
          trigger:
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "TRIAGED" }, as: SafetyOfficer }
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "CONFIRMED_RECALL" }, as: SafetyOfficer }
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "CONTAINED" }, as: SafetyOfficer }
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "RESOLVED", resolution_outcome: "FALSE_ALARM" }, as: SafetyOfficer }
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "CLOSED" }, as: SafetyOfficer }
          assert:
            - "after the reopen trigger Incident.${i1}.status == TRIAGED (cycle CONTAINED -> TRIAGED succeeded)"
            - "second CONFIRMED_RECALL succeeds (cycle re-entry) and Plant.${pl1}.status stays SHUTDOWN (idempotent cascade)"
            - "after RESOLVED with FALSE_ALARM Plant.${pl1}.status == ACTIVE (compensation)"
            - "final Incident.${i1}.status == CLOSED and Incident.${i1}.resolution_outcome == FALSE_ALARM"

      - name: order_parallel_allocation_fulfillment_dimensions
        grounds:
          - state_machines.Order
          - entities.Order.fields.allocation_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Parallel state dimensions on one Order row (different entity from Incident): allocation_status
          reaches ALLOCATED while fulfillment_status is still UNSHIPPED, then fulfillment advances
          UNSHIPPED -> IN_TRANSIT -> DELIVERED without touching allocation; cancel is rejected once
          IN_TRANSIT even though the allocation dimension alone would allow it.
        test_recipe:
          setup:
            - "D1 ACTIVE; A1 APPROVED with 2 dual-module ACTIVE certifications; product HAM lot of 10; order O1 10 units ALLOCATED"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "HAM", name: "Ham", base_price_cents: 5000, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/account-product-authorizations", payload: { account_id: "${a1}", product_id: "${p1}" }, as: BrandAdmin }
            - { call: "POST /api/training-certifications", payload: { account_id: "${a1}", associate_name: "Ann", slicing_module_passed: true, allergen_module_passed: true }, as: DistributorRep, as_user_id: "${d1}" }
            - { call: "POST /api/training-certifications", payload: { account_id: "${a1}", associate_name: "Bob", slicing_module_passed: true, allergen_module_passed: true }, as: DistributorRep, as_user_id: "${d1}" }
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${p1}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_units: 100, planned_units: 10 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { r1: $.data.id } }
            - { call: "POST /api/production-runs/${r1}/complete", payload: { actual_units: 10, waste_units: 0 }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${p1}", qty_requested: 10 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { o1: $.data.id } }
            - { call: "POST /api/orders/allocate-week", payload: { delivery_week: "2026-09-07" }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "GET /api/lots", payload: { product_id: "${p1}", status: "AVAILABLE" }, as: PlantScheduler, as_user_id: "${pl1}", captures: { lot1: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/deliveries", payload: { order_id: "${o1}", account_id: "${a1}", lines: [ { lot_id: "${lot1}", qty: 10 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { del1: $.data.id } }
            - { call: "POST /api/orders/${o1}/cancel", payload: {}, as: DistributorRep, as_user_id: "${d1}", captures: { cancel_err: $.data.error_id } }
            - { call: "POST /api/deliveries/${del1}/confirm", payload: {}, as: RetailManager, as_user_id: "${a1}" }
          assert:
            - "after allocation Order.${o1}.allocation_status == ALLOCATED while Order.${o1}.fulfillment_status == UNSHIPPED (dimensions independent)"
            - "after delivery creation Order.${o1}.fulfillment_status == IN_TRANSIT and allocation_status still == ALLOCATED"
            - "cancel while IN_TRANSIT is rejected: cancel_err == ERR_INVALID_STATE (fulfillment dimension gates cancel)"
            - "after confirm Order.${o1}.fulfillment_status == DELIVERED and Delivery.${del1}.status == CONFIRMED"

  - rule_id: transitive_cascade
    instances:
      - name: late_pull_threshold_account_suspension_cascade
        grounds:
          - state_machines.OpenedProductLog.OPEN_to_PULLED_LATE
          - state_machines.Account.APPROVED_to_SUSPENDED
          - state_machines.AccountProductAuthorization.AUTHORIZED_to_SUSPENDED
          - calculations.freshness_pull_deadline
        distinguishing_aspect: |
          Depth-3 transitive chain from the pull trigger: pull -> log PULLED_LATE (link 1) ->
          account.late_pulls_30d reaches 3 so account auto-SUSPENDED (link 2, caused by the late pull) ->
          its AUTHORIZED authorization is SUSPENDED and the other OPEN log is FORCE_PULLED (link 3,
          caused by the suspension, not by the original pull).
        test_recipe:
          setup:
            - "A1 APPROVED with AUTHORIZED authorization for product P (opened shelf 1h); slicer S1"
            - "two late pulls already recorded within 30 days; logs G3 and G4 still OPEN past deadline"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Fast Item", base_price_cents: 500, shelf_life_opened_hours: 1, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/account-product-authorizations", payload: { account_id: "${a1}", product_id: "${p1}" }, as: BrandAdmin, captures: { auth1: $.data.id } }
            - { call: "POST /api/slicers", payload: { account_id: "${a1}", label: "S1" }, as: RetailManager, as_user_id: "${a1}", captures: { s1: $.data.id } }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-01T00:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T02:00:00Z" }, as: BrandAdmin }
            - { call: "POST /api/opened-product-logs/${g1}/pull", payload: {}, as: RetailManager, as_user_id: "${a1}" }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-01T02:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T04:00:00Z" }, as: BrandAdmin }
            - { call: "POST /api/opened-product-logs/${g2}/pull", payload: {}, as: RetailManager, as_user_id: "${a1}" }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-01T04:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g3: $.data.id } }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-01T04:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g4: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T06:00:00Z" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/opened-product-logs/${g3}/pull", payload: {}, as: RetailManager, as_user_id: "${a1}" }
          assert:
            - "OpenedProductLog.${g3}.status == PULLED_LATE (link 1)"
            - "Account.${a1}.approval_status == SUSPENDED (link 2: late_pulls_30d reached 3)"
            - "AccountProductAuthorization.${auth1}.status == SUSPENDED and suspension_source == ACCOUNT_SUSPEND (link 3)"
            - "OpenedProductLog.${g4}.status == FORCE_PULLED (link 3: cascade, not a manual pull)"

      - name: incident_quarantine_rejects_pending_delivery
        grounds:
          - state_machines.Incident.TRIAGED_to_CONFIRMED_RECALL
          - state_machines.Lot.AVAILABLE_to_QUARANTINED
          - state_machines.Delivery.PENDING_to_REJECTED
        distinguishing_aspect: |
          Depth-2 transitive chain from a DIFFERENT trigger (incident confirm-recall, not a pull):
          confirm-recall -> lots of the affected run QUARANTINED (link 1) -> the PENDING delivery
          containing a newly quarantined lot is auto-REJECTED with delivered->allocated compensation (link 2,
          caused by the quarantine).
        test_recipe:
          setup:
            - "D1 ACTIVE; A1 APPROVED with authorization; product HAM run R1 completed actual 10 waste 0 (lot L)"
            - "order O1 10 units ALLOCATED; delivery DEL1 PENDING with 5 units of lot L (allocated 5, delivered 5)"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "HAM", name: "Ham", base_price_cents: 5000, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/account-product-authorizations", payload: { account_id: "${a1}", product_id: "${p1}" }, as: BrandAdmin }
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${p1}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_units: 100, planned_units: 10 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { r1: $.data.id } }
            - { call: "POST /api/production-runs/${r1}/complete", payload: { actual_units: 10, waste_units: 0 }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${p1}", qty_requested: 10 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { o1: $.data.id } }
            - { call: "POST /api/orders/allocate-week", payload: { delivery_week: "2026-09-07" }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "GET /api/lots", payload: { product_id: "${p1}" }, as: PlantScheduler, as_user_id: "${pl1}", captures: { lot1: "$.data[0].id" } }
            - { call: "POST /api/deliveries", payload: { order_id: "${o1}", account_id: "${a1}", lines: [ { lot_id: "${lot1}", qty: 5 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { del1: $.data.id } }
            - { call: "POST /api/incidents", payload: { plant_id: "${pl1}", title: "Listeria in run", severity: "CRITICAL", affected_run_ids: [ "${r1}" ] }, as: SafetyOfficer, captures: { i1: $.data.id } }
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "TRIAGED" }, as: SafetyOfficer }
          trigger:
            - { call: "POST /api/incidents/${i1}/transition", payload: { to: "CONFIRMED_RECALL" }, as: SafetyOfficer }
          assert:
            - "Lot of run ${r1}.status == QUARANTINED (link 1)"
            - "the PENDING delivery of order ${o1} is REJECTED and Order.${o1}.fulfillment_status == REJECTED (link 2)"
            - "lot.allocated_units restored to 10 (delivered 5 compensated back: 5 remaining allocated + 5 returned)"
            - "Incident.${i1}.affected_account_count == 0 (rejected deliveries drop out of the scope projection)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_terminal_beats_safety_on_reconfirm
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_ALREADY_TERMINAL]
          - errors[ERR_LOT_EXPIRED]
        distinguishing_aspect: |
          Pair state (priority 6) vs business_safety (priority 8): the second confirm hits a terminal
          delivery AND an expired lot; the state-category error ERR_ALREADY_TERMINAL wins over
          ERR_LOT_EXPIRED because state is checked first.
        test_recipe:
          setup:
            - "full delivery chain confirmed at 2026-09-01; product shelf_life_unopened_days 1 so lot expires 2026-09-02T00:00:00Z"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "HAM", name: "Ham", base_price_cents: 5000, shelf_life_opened_hours: 72, shelf_life_unopened_days: 1, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/account-product-authorizations", payload: { account_id: "${a1}", product_id: "${p1}" }, as: BrandAdmin }
            - { call: "POST /api/training-certifications", payload: { account_id: "${a1}", associate_name: "Ann", slicing_module_passed: true, allergen_module_passed: true }, as: DistributorRep, as_user_id: "${d1}" }
            - { call: "POST /api/training-certifications", payload: { account_id: "${a1}", associate_name: "Bob", slicing_module_passed: true, allergen_module_passed: true }, as: DistributorRep, as_user_id: "${d1}" }
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${p1}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_units: 100, planned_units: 10 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { r1: $.data.id } }
            - { call: "POST /api/production-runs/${r1}/complete", payload: { actual_units: 10, waste_units: 0 }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${p1}", qty_requested: 10 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { o1: $.data.id } }
            - { call: "POST /api/orders/allocate-week", payload: { delivery_week: "2026-09-07" }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "GET /api/lots", payload: { product_id: "${p1}" }, as: PlantScheduler, as_user_id: "${pl1}", captures: { lot1: "$.data[0].id" } }
            - { call: "POST /api/deliveries", payload: { order_id: "${o1}", account_id: "${a1}", lines: [ { lot_id: "${lot1}", qty: 10 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { del1: $.data.id } }
            - { call: "POST /api/deliveries/${del1}/confirm", payload: {}, as: RetailManager, as_user_id: "${a1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/deliveries/${del1}/confirm", payload: {}, as: RetailManager, as_user_id: "${a1}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ALREADY_TERMINAL (state category, priority 6) and NOT ERR_LOT_EXPIRED (business_safety, priority 8), although both conditions hold"

      - name: safety_floor_beats_fiscal_budget_on_promo_authorize
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_PROMO_BELOW_FLOOR]
          - errors[ERR_PROMO_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Different category pair from the delivery instance: business_safety (regulatory price floor,
          priority 8) vs business_fiscal (budget cap, priority 11) — the authorize call violates both
          (price 800 < floor 850 AND reserve 12000000 > budget 100) and ERR_PROMO_BELOW_FLOOR must win.
        test_recipe:
          setup:
            - "approved account A1; product base 1000; program price 800, estimated 100000 units, budget 100"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 1000, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/promo-programs", payload: { account_id: "${a1}", product_id: "${p1}", promo_price_cents: 800, start_date: "2026-10-01", end_date: "2026-10-07", budget_cents: 100, estimated_units: 100000 }, as: DistributorRep, as_user_id: "${d1}", captures: { pp1: $.data.id } }
          trigger:
            - { call: "POST /api/promo-programs/${pp1}/authorize", payload: { decision: "APPROVE" }, as: BrandAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PROMO_BELOW_FLOOR (business_safety, priority 8) and NOT ERR_PROMO_BUDGET_EXCEEDED (business_fiscal, priority 11), although both hold"
            - "PromoProgram.${pp1}.status stays DRAFT"

  - rule_id: boundary_precision_check
    instances:
      - name: pull_at_exact_deadline_is_on_time
        grounds:
          - calculations.freshness_pull_deadline
          - state_machines.OpenedProductLog.OPEN_to_PULLED_ON_TIME
        distinguishing_aspect: |
          Time metric boundary (<= deadline is on time): a pull at exactly opened_at + 72h is
          PULLED_ON_TIME, one second later is PULLED_LATE. Reached via POST /opened-product-logs/{id}/pull.
        test_recipe:
          setup:
            - "A1 APPROVED; product shelf_life_opened_hours 72; slicer S1; logs G1 and G2 opened 2026-09-01T10:00:00Z (deadline 2026-09-04T10:00:00Z)"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/slicers", payload: { account_id: "${a1}", label: "S1" }, as: RetailManager, as_user_id: "${a1}", captures: { s1: $.data.id } }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-01T10:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g1: $.data.id } }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-01T10:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T10:00:00Z" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/opened-product-logs/${g1}/pull", payload: {}, as: RetailManager, as_user_id: "${a1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T10:00:01Z" }, as: BrandAdmin }
            - { call: "POST /api/opened-product-logs/${g2}/pull", payload: {}, as: RetailManager, as_user_id: "${a1}" }
          assert:
            - "OpenedProductLog.${g1}.status == PULLED_ON_TIME (pulled_at == pull_deadline exactly; <= boundary)"
            - "OpenedProductLog.${g2}.status == PULLED_LATE (one second past deadline)"
            - "Account.${a1}.approval_status == APPROVED (single late pull, below threshold 3)"

      - name: capacity_equality_allowed_excess_rejected
        grounds:
          - calculations.production_capacity_check
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Integer-capacity metric boundary (different metric and endpoint from the pull-deadline instance):
          planned_units == capacity_units is accepted (<=) while planned_units == capacity + 1 is rejected.
        test_recipe:
          setup:
            - "plant PL1 ACTIVE; product P1"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${p1}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_units: 100, planned_units: 100 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { r1: $.data.id } }
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L2", product_id: "${p1}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_units: 100, planned_units: 101 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { err: $.data.error_id } }
          assert:
            - "first run created: ProductionRun.${r1}.status == SCHEDULED (planned == capacity allowed)"
            - "err == ERR_CAPACITY_EXCEEDED for planned_units 101 > capacity_units 100"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_create_requires_distributor_active
        grounds:
          - state_machines.Distributor.ACTIVE_to_SUSPENDED
          - validations[priority=10]
          - errors[ERR_DISTRIBUTOR_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair Order -> Distributor: order creation is gated on the distributor's state, not on anything
          in the order payload; SUSPENDED blocks creation and reinstatement restores it.
        test_recipe:
          setup:
            - "distributor D1 ACTIVE via territory grant; product P1 exists"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/distributors/${d1}/suspend", payload: {}, as: BrandAdmin }
          trigger:
            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${p1}", qty_requested: 5 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { err: $.data.error_id } }
            - { call: "POST /api/distributors/${d1}/reinstate", payload: {}, as: BrandAdmin }
            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${p1}", qty_requested: 5 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { o1: $.data.id } }
          assert:
            - "err == ERR_DISTRIBUTOR_NOT_ACTIVE while Distributor.${d1}.status == SUSPENDED"
            - "after reinstate, order ${o1} created with allocation_status == PENDING"

      - name: service_visit_requires_account_approved
        grounds:
          - state_machines.Account
          - validations[priority=10]
          - errors[ERR_ACCOUNT_NOT_APPROVED]
        distinguishing_aspect: |
          Different entity pair (ServiceVisit -> Account, not Order -> Distributor): visit scheduling
          depends on the account's approval state; UNDER_REVIEW rejects, APPROVED accepts.
        test_recipe:
          setup:
            - "D1 ACTIVE; account A1 proposed but never reviewed (UNDER_REVIEW)"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T10:00:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { err: $.data.error_id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T10:00:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { v1: $.data.id } }
          assert:
            - "err == ERR_ACCOUNT_NOT_APPROVED while Account.${a1}.approval_status == UNDER_REVIEW"
            - "after approval, ServiceVisit.${v1}.status == SCHEDULED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: run_window_half_open_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_RUN_OVERLAP]
        distinguishing_aspect: |
          Plant-line resource with HALF-OPEN interval semantics [window_start, window_end): a run starting
          at 11:59:59 overlaps the 08:00-12:00 run (rejected) but a run starting at exactly 12:00:00 touches
          the boundary and is allowed.
        test_recipe:
          setup:
            - "plant PL1 ACTIVE; product P1; run R1 on line L1 08:00-12:00"
          setup_api_calls:
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${p1}", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_units: 100, planned_units: 50 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${p1}", window_start: "2026-09-01T11:59:59Z", window_end: "2026-09-01T13:00:00Z", capacity_units: 100, planned_units: 50 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { err: $.data.error_id } }
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${p1}", window_start: "2026-09-01T12:00:00Z", window_end: "2026-09-01T16:00:00Z", capacity_units: 100, planned_units: 50 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { r2: $.data.id } }
          assert:
            - "err == ERR_RUN_OVERLAP for the 11:59:59 start (overlaps [08:00, 12:00))"
            - "ProductionRun.${r2}.status == SCHEDULED for the 12:00:00 start (half-open adjacency allowed)"

      - name: visit_spacing_thirty_minute_buffer
        grounds:
          - validations[priority=9]
          - errors[ERR_VISIT_TOO_CLOSE]
        distinguishing_aspect: |
          Different resource (account service calendar, not plant line) with DIFFERENT interval semantics:
          not only is overlap rejected, a buffer of >= 30 minutes between windows is required — a 29-minute
          gap fails while exactly 30 minutes passes.
        test_recipe:
          setup:
            - "D1 ACTIVE; A1 APPROVED; visit V1 09:00-10:00 scheduled"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T10:00:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T10:29:00Z", window_end: "2026-09-02T11:00:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { err: $.data.error_id } }
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T10:30:00Z", window_end: "2026-09-02T11:30:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { v2: $.data.id } }
          assert:
            - "err == ERR_VISIT_TOO_CLOSE for the 29-minute gap"
            - "ServiceVisit.${v2}.status == SCHEDULED for the exactly-30-minute gap"

  - rule_id: compensating_invariant
    instances:
      - name: lot_units_conserved_across_allocate_and_cancel
        grounds:
          - calculations.weekly_allocation_waterfall
          - state_machines.Order.ALLOCATED_to_CANCELLED
          - entities.Lot.fields.available_units
        distinguishing_aspect: |
          Conserved quantity is UNIT COUNT: for each lot, available + allocated + delivered + waste ==
          run.actual_units at every step — allocation moves 20 units available->allocated (25/20), the
          compensating cancel moves them back (45/0), and the sum never drifts from 50.
        test_recipe:
          setup:
            - "run R1 completed with actual_units 50, waste_units 5 -> lot L available 45"
            - "order O1 for 20 units allocated"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 500, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/plants", payload: { code: "PL1", name: "Plant 1" }, as: BrandAdmin, captures: { pl1: $.data.id } }
            - { call: "POST /api/production-runs", payload: { plant_id: "${pl1}", line_code: "L1", product_id: "${p1}", window_start: "2026-09-01T06:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_units: 100, planned_units: 50 }, as: PlantScheduler, as_user_id: "${pl1}", captures: { r1: $.data.id } }
            - { call: "POST /api/production-runs/${r1}/complete", payload: { actual_units: 50, waste_units: 5 }, as: PlantScheduler, as_user_id: "${pl1}" }
            - { call: "POST /api/orders", payload: { delivery_week: "2026-09-07", lines: [ { product_id: "${p1}", qty_requested: 20 } ] }, as: DistributorRep, as_user_id: "${d1}", captures: { o1: $.data.id } }
            - { call: "POST /api/orders/allocate-week", payload: { delivery_week: "2026-09-07" }, as: PlantScheduler, as_user_id: "${pl1}" }
          trigger:
            - { call: "POST /api/orders/${o1}/cancel", payload: {}, as: DistributorRep, as_user_id: "${d1}" }
          assert:
            - "before cancel: lot available_units == 25 and allocated_units == 20 (25 + 20 + 0 delivered + 5 waste == 50 actual)"
            - "after cancel: Order.${o1}.allocation_status == CANCELLED, lot available_units == 45 and allocated_units == 0"
            - "invariant restored: 45 + 0 + 0 + 5 == 50 (no unit drift from the forward+compensating pair)"

      - name: promo_reserve_conserved_across_authorize_and_settle
        grounds:
          - calculations.promo_settlement
          - state_machines.PromoProgram.AUTHORIZED_to_SETTLED
          - entities.PromoProgram.fields.released_cents
        distinguishing_aspect: |
          Conserved quantity is MONEY (different from unit count): the reserve locked at authorization is
          exactly repartitioned at settlement — 17700 == 14850 spent + 2850 released — and budget_cents is
          untouched by the forward+compensating pair.
        test_recipe:
          setup:
            - "approved account A1; product base 999; program price 900, estimated 300, budget 40000 (reserve 300*59=17700)"
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/territories", payload: { code: "T1", name: "North", region: "NE" }, as: BrandAdmin, captures: { t1: $.data.id, t1v: $.data.version } }
            - { call: "POST /api/territories/${t1}/grant", payload: { distributor_id: "${d1}", expected_territory_version: "${t1v}" }, as: BrandAdmin }
            - { call: "POST /api/products", payload: { code: "P1", name: "Item", base_price_cents: 999, shelf_life_opened_hours: 72, shelf_life_unopened_days: 30, allergen_tags: [] }, as: BrandAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/promo-programs", payload: { account_id: "${a1}", product_id: "${p1}", promo_price_cents: 900, start_date: "2026-10-01", end_date: "2026-10-07", budget_cents: 40000, estimated_units: 300 }, as: DistributorRep, as_user_id: "${d1}", captures: { pp1: $.data.id } }
            - { call: "POST /api/promo-programs/${pp1}/authorize", payload: { decision: "APPROVE" }, as: BrandAdmin }
          trigger:
            - { call: "POST /api/promo-programs/${pp1}/settle", payload: { redemption_lines: [ { period: "2026-10-01", units: 250 } ] }, as: BrandAdmin }
          assert:
            - "PromoProgram.${pp1}.reserved_cents == 17700 (forward action: reserve locked)"
            - "PromoProgram.${pp1}.spent_cents == 14850 (round_half_up(250*99*0.6)) and released_cents == 2850"
            - "invariant: reserved_cents == spent_cents + released_cents (17700 == 14850 + 2850); budget_cents unchanged at 40000"
