      - name: submit_and_approve_are_not_idempotent
        claim_type: idempotency
        grounds:
          - state_machines.CategoryPlan.transitions.DRAFT_to_SUBMITTED
          - state_machines.CategoryPlan.transitions.SUBMITTED_to_APPROVED
          - validations[priority=9].ERR_INVALID_STATE
        distinguishing_aspect: "Replaying an accepted action is a rejection, not a silent no-op, and the second call must leave every field the first call wrote exactly as it was: a second submit does not overwrite submitted_by_user_id with the replaying planner's id, and a second approve does not re-run calculations.plan_receipt_budget nor bump CategoryPlan.version a third time."
