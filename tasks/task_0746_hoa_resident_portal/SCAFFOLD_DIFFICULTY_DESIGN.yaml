scaffold_difficulty_design:

  # -----------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # -----------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: assessment_prorate_full_vs_daily
        grounds:
          - calculations.assessment_prorate
          - entities.Assessment.fields.amount_due_cents
          - entities.Assessment.fields.prorate_from
        distinguishing_aspect: |
          Operates on the Assessment entity: FULL_MONTH (no prorate_from, or prorate_from
          <= billing_period_start) charges the flat $300 monthly dues (30000 cents);
          DAILY_PRORATE (prorate_from mid-cycle) charges 30000 * 17/31 = 16452 cents on the
          same billing window. Different result on the SAME billing inputs.
        test_recipe:
          setup:
            - "Two homeowners H_full and H_daily, each owning one property with monthly_dues_cents=30000"
            - "Clock at 2026-03-01T00:00:00Z (server default)"
            - "H_full's property gets an Assessment with no prorate_from over the March 2026 billing window"
            - "H_daily's property gets an Assessment with prorate_from=2026-03-15 over the March 2026 billing window (31 days; included = 17 days)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hfull@example.com", full_name: "H Full" }
              as: HOAManager
              captures: { hfull_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "hdaily@example.com", full_name: "H Daily" }
              as: HOAManager
              captures: { hdaily_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${hfull_id}", address: "1 Full Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_full_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${hdaily_id}", address: "2 Daily Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_daily_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { property_id: "${p_full_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { a_full_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_daily_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z", prorate_from: "2026-03-15T00:00:00Z" }
              as: HOAManager
              captures: { a_daily_id: $.data.id }
          assert:
            - "Assessment.${a_full_id}.amount_due_cents == 30000"
            - "Assessment.${a_daily_id}.amount_due_cents == 16452"
            - "Assessment.${a_full_id}.amount_due_cents != Assessment.${a_daily_id}.amount_due_cents"

      - name: delinquency_score_strict_vs_lenient
        grounds:
          - calculations.homeowner_delinquency_score
          - entities.Homeowner.fields.delinquency_score
          - entities.Homeowner.fields.standing
        distinguishing_aspect: |
          Operates on the Homeowner entity (different domain from prorate). STRICT counts
          every unpaid assessment including age<30d ones; LENIENT excludes age<30d rows
          entirely. Same portfolio (one 47-day-old and one 7-day-old assessment) yields
          delinquency_score=805 (MARGINAL) under STRICT vs 495 (GOOD_STANDING) under LENIENT.
        test_recipe:
          setup:
            - "One homeowner H with one property (monthly_dues_cents=30000)"
            - "Grace policy STRICT (server default assumption)"
            - "Clock advanced to 2026-06-01; A_old (due 2026-04-15) is 47 days overdue; A_new (due 2026-05-25) is 7 days overdue"
            - "A_old late_fee stamped at 3000 cents (tier 3, mult 1.0 at transition time); A_new late_fee stamped at 1000 cents (tier 1 floor)"
            - "STRICT score = round((33000*1.5 + 31000*1.0)/100) = 805; LENIENT score = round((33000*1.5)/100) = 495"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hscore@example.com", full_name: "H Score" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "3 Score Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /_config/grace-policy"
              payload: { grace_policy: "STRICT" }
              as: HOAManager
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-04-01T00:00:00Z", billing_period_end: "2026-05-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { a_old_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z", due_date: "2026-05-25T00:00:00Z" }
              as: HOAManager
              captures: { a_new_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: HOAManager
          trigger:
            - call: "GET /homeowners/${h_id}"
              payload: {}
              as: HOAManager
              captures: { strict_score: $.data.delinquency_score, strict_standing: $.data.standing }
            - call: "POST /_config/grace-policy"
              payload: { grace_policy: "LENIENT" }
              as: HOAManager
            - call: "GET /homeowners/${h_id}"
              payload: {}
              as: HOAManager
              captures: { lenient_score: $.data.delinquency_score, lenient_standing: $.data.standing }
          assert:
            - "strict_score == 805"
            - "strict_standing == 'MARGINAL'"
            - "lenient_score == 495"
            - "lenient_standing == 'GOOD_STANDING'"
            - "strict_score != lenient_score"

  # -----------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas in DIFFERENT modes
  # -----------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: late_fee_tiered_nonlinear_mode_a
        grounds:
          - calculations.late_fee
          - entities.Assessment.fields.late_fee_cents
          - state_machines.Assessment.OPEN_to_OVERDUE
        distinguishing_aspect: |
          Mode (a): formula has 4 inputs (outstanding, days_overdue, standing_multiplier,
          tier-specific floor/cap) with non-linear interaction — nested min/max, conditional
          tier selection, and multiplier switch on Homeowner.standing. On $300 outstanding
          at 30 days overdue with GOOD_STANDING, the tier-3 base 3000 * mult 1.0 = 3000 falls
          within [2500, 10000], so late_fee_cents = 3000.
        test_recipe:
          setup:
            - "One homeowner H (GOOD_STANDING) with one property (monthly_dues_cents=30000)"
            - "Clock at 2026-03-01"
            - "Assessment A created with due_date=2026-04-15, no prorate; amount_due_cents=30000"
            - "Clock advanced to 2026-05-15 (exactly 30 days past due) → A transitions OPEN→OVERDUE, late_fee stamped"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hlate@example.com", full_name: "H Late" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "4 Late Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: HOAManager
            - call: "GET /assessments/${a_id}"
              payload: {}
              as: HOAManager
              captures: { fee: $.data.late_fee_cents, st: $.data.status }
          assert:
            - "fee == 3000"
            - "st == 'OVERDUE'"

      - name: arc_fee_sum_then_round_mode_b
        grounds:
          - calculations.arc_finalization_fee
          - entities.ARCRequest.fields.fee_cents
          - state_machines.ARCRequest.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Mode (b): the arc_finalization_fee scaffold pins SUM_THEN_ROUND. With category
          MEDIUM (base 10000), weights [1,2,3] at rate 0.10725, per-review raw values are
          [1072.5, 2145.0, 3217.5]. SUM_THEN_ROUND yields fee_cents = round(10000 + 6435.0)
          = 16435. Round-then-sum would give 10000 + 1073 + 2145 + 3218 = 16436 — different
          cent by ordering; the scaffold rejects that ordering.
        test_recipe:
          setup:
            - "Board members BM1 (weight source), BM2, BM3 as three Homeowners with is_board_member=true"
            - "One submitting homeowner H owning property P"
            - "ARC request R (category MEDIUM) created and submitted; three APPROVE reviews cast with weights 1,2,3"
            - "Clock at 2026-03-01"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "bm1@ex.com", full_name: "BM1", is_board_member: true }
              as: HOAManager
              captures: { bm1_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "bm2@ex.com", full_name: "BM2", is_board_member: true }
              as: HOAManager
              captures: { bm2_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "bm3@ex.com", full_name: "BM3", is_board_member: true }
              as: HOAManager
              captures: { bm3_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "harc@ex.com", full_name: "H ARC" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "5 Arc Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /arc-requests"
              payload: { property_id: "${p_id}", submitter_homeowner_id: "${h_id}", category: "MEDIUM", description: "Repaint fence beige" }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r_id: $.data.id }
            - call: "POST /arc-requests/${r_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${h_id}"
            - call: "POST /arc-requests/${r_id}/reviews"
              payload: { reviewer_homeowner_id: "${bm1_id}", weight: 1, verdict: "APPROVE" }
              as: BoardMember
              as_user_id: "${bm1_id}"
            - call: "POST /arc-requests/${r_id}/reviews"
              payload: { reviewer_homeowner_id: "${bm2_id}", weight: 2, verdict: "APPROVE" }
              as: BoardMember
              as_user_id: "${bm2_id}"
            - call: "POST /arc-requests/${r_id}/reviews"
              payload: { reviewer_homeowner_id: "${bm3_id}", weight: 3, verdict: "APPROVE" }
              as: BoardMember
              as_user_id: "${bm3_id}"
          trigger:
            - call: "POST /arc-requests/${r_id}/finalize"
              payload: {}
              as: BoardMember
              as_user_id: "${bm1_id}"
              captures: { fee: $.data.fee_cents, st: $.data.status }
          assert:
            - "fee == 16435"
            - "st == 'APPROVED'"

  # -----------------------------------------------------------------------
  # Rule 3 — Non-linear state machines on DIFFERENT entities
  # -----------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: arc_request_cyclic_revision_loop
        grounds:
          - state_machines.ARCRequest.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.ARCRequest.REVISION_REQUESTED_to_SUBMITTED
          - entities.ARCRequest.fields.revision_count
        distinguishing_aspect: |
          ARCRequest state machine is cyclic: UNDER_REVIEW → REVISION_REQUESTED → SUBMITTED
          → UNDER_REVIEW loops on each revision, bumping revision_count. A pipeline
          A→B→C→D cannot express this — the row must return to a prior state.
        test_recipe:
          setup:
            - "One submitting homeowner H owning property P; one board member BM"
            - "ARC request R (category SIMPLE) created and submitted; BM casts one REVISE review; R finalized to REVISION_REQUESTED"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "bmcyc@ex.com", full_name: "BM Cyc", is_board_member: true }
              as: HOAManager
              captures: { bm_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "hcyc@ex.com", full_name: "H Cyc" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "6 Cyc Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /arc-requests"
              payload: { property_id: "${p_id}", submitter_homeowner_id: "${h_id}", category: "SIMPLE", description: "New mailbox" }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r_id: $.data.id }
            - call: "POST /arc-requests/${r_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${h_id}"
            - call: "POST /arc-requests/${r_id}/reviews"
              payload: { reviewer_homeowner_id: "${bm_id}", weight: 2, verdict: "REVISE" }
              as: BoardMember
              as_user_id: "${bm_id}"
            - call: "POST /arc-requests/${r_id}/finalize"
              payload: {}
              as: BoardMember
              as_user_id: "${bm_id}"
              captures: { first_status: $.data.status, first_rc: $.data.revision_count }
          trigger:
            - call: "POST /arc-requests/${r_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { second_status: $.data.status, second_rc: $.data.revision_count }
          assert:
            - "first_status == 'REVISION_REQUESTED'"
            - "first_rc == 1"
            - "second_status == 'SUBMITTED'"
            - "second_rc == 1"

      - name: work_order_parallel_dimensions
        grounds:
          - state_machines.WorkOrder.NEW_to_ASSIGNED
          - state_machines.WorkOrder.UNBILLED_to_INVOICED
          - entities.WorkOrder.fields.work_status
          - entities.WorkOrder.fields.payment_status
        distinguishing_aspect: |
          WorkOrder carries two independent state dimensions on the same row —
          work_status (NEW→ASSIGNED→IN_PROGRESS→COMPLETED) and payment_status
          (UNBILLED→INVOICED→PAID). After ASSIGN + START + INVOICE, work_status ==
          IN_PROGRESS while payment_status == INVOICED simultaneously; the two dimensions
          are orthogonal and cannot be modeled as a single linear pipeline.
        test_recipe:
          setup:
            - "One work order W created (title 'Fence repair', cost_estimate_cents=50000)"
            - "Clock at 2026-03-01"
          setup_api_calls:
            - call: "POST /work-orders"
              payload: { title: "Fence repair", cost_estimate_cents: 50000 }
              as: HOAManager
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${w_id}/assign"
              payload: { assigned_vendor_id: "vendor-abc" }
              as: HOAManager
            - call: "POST /work-orders/${w_id}/start"
              payload: {}
              as: HOAManager
            - call: "POST /work-orders/${w_id}/invoice"
              payload: {}
              as: HOAManager
              captures: { ws: $.data.work_status, ps: $.data.payment_status }
          assert:
            - "ws == 'IN_PROGRESS'"
            - "ps == 'INVOICED'"

  # -----------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # -----------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: payment_reversal_depth_3_cascade
        grounds:
          - state_machines.Assessment.PAID_to_OVERDUE
          - calculations.homeowner_delinquency_score
          - entities.Homeowner.fields.booking_privilege
          - entities.Property.fields.total_outstanding_cents
        distinguishing_aspect: |
          Depth-3 chain from a Payment.reverse action: (link 1) Payment.status becomes
          REVERSED; (link 2) triggered by that, Assessment.amount_paid_cents drops and
          Assessment.status transitions PAID → OVERDUE with late_fee re-stamped and
          Property.total_outstanding_cents recomputed; (link 3) triggered by the
          Assessment change, Homeowner.delinquency_score recomputes and — crossing the
          DELINQUENT threshold — Homeowner.booking_privilege flips ALLOWED→FROZEN. Each
          link is caused by the preceding link, not by the reverse action directly.
        test_recipe:
          setup:
            - "Homeowner H, property P (monthly_dues_cents=200000 = $2000)"
            - "Clock at 2026-03-01"
            - "Assessment A created (due_date=2026-04-15, amount_due_cents=200000)"
            - "Full payment $2000 posted → A=PAID; Homeowner remains GOOD_STANDING"
            - "Clock advanced to 2026-07-01 (77 days past due at reversal time)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hcasc@ex.com", full_name: "H Casc" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "7 Casc Ln", monthly_dues_cents: 200000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/pay"
              payload: { amount_cents: 200000, method: "MANUAL" }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HOAManager
          trigger:
            - call: "POST /payments/${pay_id}/reverse"
              payload: { reversal_reason: "Chargeback" }
              as: HOAManager
              captures: { pay_status: $.data.status }
            - call: "GET /assessments/${a_id}"
              payload: {}
              as: HOAManager
              captures: { a_status: $.data.status, a_paid: $.data.amount_paid_cents, a_fee: $.data.late_fee_cents }
            - call: "GET /homeowners/${h_id}"
              payload: {}
              as: HOAManager
              captures: { h_score: $.data.delinquency_score, h_standing: $.data.standing, h_book: $.data.booking_privilege }
            - call: "GET /properties/${p_id}"
              payload: {}
              as: HOAManager
              captures: { p_out: $.data.total_outstanding_cents }
          assert:
            - "pay_status == 'REVERSED'"
            - "a_status == 'DELINQUENT'"
            - "a_paid == 0"
            - "a_fee == 25000"
            - "p_out == 225000"
            - "h_score == 4500"
            - "h_standing == 'DELINQUENT'"
            - "h_book == 'FROZEN'"

      - name: arc_approval_depth_2_cascade
        grounds:
          - state_machines.ARCRequest.UNDER_REVIEW_to_APPROVED
          - entities.Property.fields.compliance_flag
          - entities.WorkOrder.fields.source
        distinguishing_aspect: |
          Depth-2 chain triggered by ARC finalize (APPROVED path), different from the
          payment-reverse trigger: (link 1) ARCRequest.status = APPROVED; (link 2)
          triggered by that status change, Property.compliance_flag transitions
          OPEN→APPROVED_MOD. A parallel side-effect (WorkOrder auto-created with
          source=AUTO_ARC) is verified but not counted as a chain link — it's a fan-out
          from link 1, not a transitive consequence of link 2.
        test_recipe:
          setup:
            - "Board member BM; homeowner H; property P (compliance_flag=OPEN)"
            - "ARC request R (SIMPLE) created and submitted; single APPROVE review cast by BM"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "bmarc@ex.com", full_name: "BM Arc", is_board_member: true }
              as: HOAManager
              captures: { bm_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "harc2@ex.com", full_name: "H Arc2" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "8 Arc Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /arc-requests"
              payload: { property_id: "${p_id}", submitter_homeowner_id: "${h_id}", category: "SIMPLE", description: "New shed" }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r_id: $.data.id }
            - call: "POST /arc-requests/${r_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${h_id}"
            - call: "POST /arc-requests/${r_id}/reviews"
              payload: { reviewer_homeowner_id: "${bm_id}", weight: 1, verdict: "APPROVE" }
              as: BoardMember
              as_user_id: "${bm_id}"
          trigger:
            - call: "POST /arc-requests/${r_id}/finalize"
              payload: {}
              as: BoardMember
              as_user_id: "${bm_id}"
              captures: { r_status: $.data.status }
            - call: "GET /properties/${p_id}"
              payload: {}
              as: HOAManager
              captures: { p_flag: $.data.compliance_flag }
            - call: "GET /properties/${p_id}/work-orders"
              payload: {}
              as: HOAManager
              captures: { wos: $.data }
          assert:
            - "r_status == 'APPROVED'"
            - "p_flag == 'APPROVED_MOD'"
            - "len(wos) == 1"
            - "wos[0].source == 'AUTO_ARC'"

  # -----------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across DIFFERENT category pairs
  # -----------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_pay_terminal_wins_state
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OVERPAYMENT]
        distinguishing_aspect: |
          Category pair {state, business_fiscal}: on POST /assessments/{id}/pay against
          a PAID assessment with an amount that would ALSO exceed outstanding, both
          priority-5 (state) and priority-14 (business_fiscal) fire. The scaffold pins
          state before business_fiscal, so the response is ERR_INVALID_STATE (409), not
          ERR_OVERPAYMENT (422).
        test_recipe:
          setup:
            - "Homeowner H with property P (monthly_dues_cents=30000)"
            - "Assessment A created; then paid in full (A.status=PAID)"
            - "Clock still at 2026-03-01 (before due_date so no OVERDUE risk)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hprio@ex.com", full_name: "H Prio" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "9 Prio Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { a_id: $.data.id }
            - call: "POST /assessments/${a_id}/pay"
              payload: { amount_cents: 30000, method: "MANUAL" }
              as: Homeowner
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /assessments/${a_id}/pay"
              payload: { amount_cents: 99999, method: "MANUAL" }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"
            - "err != 'ERR_OVERPAYMENT'"

      - name: constraint_vs_temporal_appeal_safety_wins_constraint
        grounds:
          - validations[priority=13]
          - validations[priority=17]
          - errors[ERR_APPEAL_NON_APPEALABLE]
          - errors[ERR_APPEAL_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Category pair {business_constraint, business_temporal} — DIFFERENT from the
          {state, business_fiscal} pair above. On POST /violations/{id}/appeal against a
          SAFETY violation that is ALSO past the 14-day appeal window, priority-13
          (business_constraint) precedes priority-17 (business_temporal). Response is
          ERR_APPEAL_NON_APPEALABLE (422), not ERR_APPEAL_WINDOW_EXPIRED (422).
        test_recipe:
          setup:
            - "Homeowner H with property P; SAFETY violation V reported, confirmed, and fined at 2026-03-05"
            - "Clock advanced to 2026-04-01 (25 days past fined_at, so appeal window also expired)"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hsaf@ex.com", full_name: "H Safety" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "10 Safety Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: HOAManager
            - call: "POST /violations"
              payload: { property_id: "${p_id}", category: "SAFETY" }
              as: ComplianceOfficer
              captures: { v_id: $.data.id }
            - call: "POST /violations/${v_id}/confirm"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /violations/${v_id}/fine"
              payload: { fine_amount_cents: 25000 }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HOAManager
          trigger:
            - call: "POST /violations/${v_id}/appeal"
              payload: {}
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_APPEAL_NON_APPEALABLE'"
            - "err != 'ERR_APPEAL_WINDOW_EXPIRED'"

  # -----------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # -----------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: late_fee_tier_boundary_days_30_vs_29
        grounds:
          - calculations.late_fee
          - state_machines.Assessment.OPEN_to_OVERDUE
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Numeric threshold boundary on days_overdue. At exactly 30 days the tier crosses
          from tier-2 (rate 0.05, cap 5000) to tier-3 (rate 0.10, floor 2500, cap 10000).
          On $300 outstanding, 29 days → late_fee_cents=1500; 30 days → late_fee_cents=3000.
          The boundary is precisely `>=` vs `<` at 30 days, exposed through clock
          advancement.
        test_recipe:
          setup:
            - "Two homeowners H29 and H30, each with a property (monthly_dues_cents=30000) and one assessment"
            - "Both assessments have due_date=2026-04-15"
            - "H29's clock hits 2026-05-14 (29 days past due) → tier 2; H30's clock hits 2026-05-15 (30 days) → tier 3"
            - "Since /_clock/set_current_utc is global we test by advancing to two different times against two DIFFERENT assessments held by the SAME server; here we run one at 29 days then another created later or use two separate assessments"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "h29@ex.com", full_name: "H 29" }
              as: HOAManager
              captures: { h29_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "h30@ex.com", full_name: "H 30" }
              as: HOAManager
              captures: { h30_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h29_id}", address: "29 Boundary Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p29_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h30_id}", address: "30 Boundary Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p30_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p29_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { a29_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-14T00:00:00Z" }
              as: HOAManager
            - call: "GET /assessments/${a29_id}"
              payload: {}
              as: HOAManager
              captures: { fee_29: $.data.late_fee_cents }
            - call: "POST /assessments"
              payload: { property_id: "${p30_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { a30_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: HOAManager
            - call: "GET /assessments/${a30_id}"
              payload: {}
              as: HOAManager
              captures: { fee_30: $.data.late_fee_cents }
          assert:
            - "fee_29 == 1500"
            - "fee_30 == 3000"
            - "fee_30 != fee_29"

      - name: amenity_capacity_boundary_equal_vs_over
        grounds:
          - calculations.amenity_capacity_check
          - validations[priority=11]
          - errors[ERR_AMENITY_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Different metric (integer guest count) on a different endpoint (POST
          /amenity-reservations). With amenity capacity=25 and one existing reservation
          for 20 guests over [10:00,12:00), a new reservation of 5 guests at
          [11:00,13:00) yields concurrent_guests_at_peak=25 == capacity — accepted
          (BOUNDARY equality allowed). A new reservation of 6 guests over the same
          overlap would yield 26 > 25 — rejected with ERR_AMENITY_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Amenity 'Pool' with capacity=25, reservation_window_start_hour=6, reservation_window_end_hour=22"
            - "Homeowner H (booking_privilege=ALLOWED, GOOD_STANDING)"
            - "Existing reservation R0: 20 guests over 2026-03-10T10:00:00Z..2026-03-10T12:00:00Z"
            - "Clock at 2026-03-01 (so R0 is still in the future)"
          setup_api_calls:
            - call: "POST /amenities"
              payload: { name: "Pool", capacity: 25, reservation_window_start_hour: 6, reservation_window_end_hour: 22 }
              as: HOAManager
              captures: { pool_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "hpool@ex.com", full_name: "H Pool" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /amenity-reservations"
              payload: { amenity_id: "${pool_id}", homeowner_id: "${h_id}", start_ts: "2026-03-10T10:00:00Z", end_ts: "2026-03-10T12:00:00Z", guest_count: 20 }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r0_id: $.data.id }
          trigger:
            - call: "POST /amenity-reservations"
              payload: { amenity_id: "${pool_id}", homeowner_id: "${h_id}", start_ts: "2026-03-10T11:00:00Z", end_ts: "2026-03-10T13:00:00Z", guest_count: 5 }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r_eq_id: $.data.id }
            - call: "POST /amenity-reservations"
              payload: { amenity_id: "${pool_id}", homeowner_id: "${h_id}", start_ts: "2026-03-10T11:30:00Z", end_ts: "2026-03-10T12:30:00Z", guest_count: 6 }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { err_over: $.data.error_id }
          assert:
            - "r_eq_id != null"
            - "err_over == 'ERR_AMENITY_CAPACITY_EXCEEDED'"

  # -----------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # -----------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: arc_submit_blocked_on_property_suspended
        grounds:
          - state_machines.ARCRequest.DRAFT_to_SUBMITTED
          - entities.Property.fields.compliance_flag
          - validations[priority=7]
          - errors[ERR_PROPERTY_SUSPENDED]
        distinguishing_aspect: |
          Entity pair {ARCRequest, Property}: ARCRequest can transition DRAFT→SUBMITTED
          ONLY when the referenced Property.compliance_flag != SUSPENDED. When Property
          is SUSPENDED (test-driven via an admin path — here simulated by a helper
          workflow), the submit is rejected with ERR_PROPERTY_SUSPENDED even though the
          ARCRequest itself is in a valid DRAFT state.
        test_recipe:
          setup:
            - "Homeowner H with property P"
            - "P has an unresolved FINED violation V older than 60 days AND unresolved (no appeal, no cure), yielding compliance_flag=SUSPENDED at the current clock"
            - "One ARCRequest R created in DRAFT against P"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hsus@ex.com", full_name: "H Sus" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "11 Sus Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: HOAManager
            - call: "POST /violations"
              payload: { property_id: "${p_id}", category: "STRUCTURAL" }
              as: ComplianceOfficer
              captures: { v_id: $.data.id }
            - call: "POST /violations/${v_id}/confirm"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /violations/${v_id}/fine"
              payload: { fine_amount_cents: 50000 }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: HOAManager
            - call: "POST /arc-requests"
              payload: { property_id: "${p_id}", submitter_homeowner_id: "${h_id}", category: "SIMPLE", description: "New gate" }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /arc-requests/${r_id}/submit"
              payload: {}
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_PROPERTY_SUSPENDED'"

      - name: amenity_reservation_blocked_on_homeowner_frozen
        grounds:
          - endpoints[POST /amenity-reservations]
          - entities.Homeowner.fields.booking_privilege
          - validations[priority=7]
          - errors[ERR_PROPERTY_SUSPENDED]
        distinguishing_aspect: |
          DIFFERENT entity pair {AmenityReservation, Homeowner}: an amenity reservation
          may be created ONLY when the acting Homeowner.booking_privilege == ALLOWED.
          When the homeowner's booking_privilege has flipped to FROZEN (because their
          delinquency_score has crossed 1500 and standing is DELINQUENT), the reservation
          create is rejected with ERR_PROPERTY_SUSPENDED even though the amenity itself
          has available capacity.
        test_recipe:
          setup:
            - "Homeowner H with property P (monthly_dues_cents=200000 = $2000)"
            - "Amenity 'Clubhouse' with capacity=50"
            - "Clock at 2026-03-01, three assessments created (all unpaid), then clock advanced to 2026-08-01 to push H into DELINQUENT with booking_privilege=FROZEN"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hfrz@ex.com", full_name: "H Frz" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "12 Frz Ln", monthly_dues_cents: 200000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /amenities"
              payload: { name: "Clubhouse", capacity: 50, reservation_window_start_hour: 6, reservation_window_end_hour: 22 }
              as: HOAManager
              captures: { cb_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { a1_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-04-01T00:00:00Z", billing_period_end: "2026-05-01T00:00:00Z", due_date: "2026-05-15T00:00:00Z" }
              as: HOAManager
              captures: { a2_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z", due_date: "2026-06-15T00:00:00Z" }
              as: HOAManager
              captures: { a3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: HOAManager
          trigger:
            - call: "POST /amenity-reservations"
              payload: { amenity_id: "${cb_id}", homeowner_id: "${h_id}", start_ts: "2026-08-10T10:00:00Z", end_ts: "2026-08-10T12:00:00Z", guest_count: 5 }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_PROPERTY_SUSPENDED'"

  # -----------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # -----------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: amenity_half_open_capacity_aggregation
        grounds:
          - calculations.amenity_capacity_check
          - entities.AmenityReservation.fields.start_ts
          - entities.AmenityReservation.fields.end_ts
        distinguishing_aspect: |
          Amenity interval semantics: HALF-OPEN [start, end) with capacity AGGREGATION —
          many reservations may coexist as long as their concurrent guest_count sum
          <= amenity.capacity. Adjacency at the boundary (one reservation ends at 12:00,
          the next starts at 12:00) does NOT overlap.
        test_recipe:
          setup:
            - "Amenity 'Sauna' capacity=10, window 6..22"
            - "Homeowner H with allowed booking_privilege"
            - "R_a: 2026-03-20T10:00Z..2026-03-20T12:00Z guest_count=6"
          setup_api_calls:
            - call: "POST /amenities"
              payload: { name: "Sauna", capacity: 10, reservation_window_start_hour: 6, reservation_window_end_hour: 22 }
              as: HOAManager
              captures: { s_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "hsn@ex.com", full_name: "H Sauna" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /amenity-reservations"
              payload: { amenity_id: "${s_id}", homeowner_id: "${h_id}", start_ts: "2026-03-20T10:00:00Z", end_ts: "2026-03-20T12:00:00Z", guest_count: 6 }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r_a_id: $.data.id }
          trigger:
            - call: "POST /amenity-reservations"
              payload: { amenity_id: "${s_id}", homeowner_id: "${h_id}", start_ts: "2026-03-20T12:00:00Z", end_ts: "2026-03-20T14:00:00Z", guest_count: 10 }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r_adjacent_id: $.data.id, r_adjacent_status: $.data.status }
            - call: "POST /amenity-reservations"
              payload: { amenity_id: "${s_id}", homeowner_id: "${h_id}", start_ts: "2026-03-20T11:00:00Z", end_ts: "2026-03-20T13:00:00Z", guest_count: 5 }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "r_adjacent_id != null"
            - "r_adjacent_status == 'BOOKED'"
            - "err_overlap == 'ERR_AMENITY_CAPACITY_EXCEEDED'"

      - name: motion_window_24h_buffer_conflict
        grounds:
          - validations[priority=10]
          - errors[ERR_MOTION_WINDOW_CONFLICT]
          - entities.Motion.fields.voting_window_start
          - entities.Motion.fields.voting_window_end
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource (Motion): CLOSED buffer
          windows — two OPEN motions of the same category may not have voting windows
          within 24 hours of each other. Motion M1 with window
          [2026-04-01T00:00Z, 2026-04-05T00:00Z]; creating M2 (same category) with window
          [2026-04-05T12:00Z, 2026-04-10T00:00Z] falls inside the 24-hour buffer past
          M1.voting_window_end and is rejected with ERR_MOTION_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Board member BM"
            - "Motion M1 (category BUDGET) with window 2026-04-01..2026-04-05, eligible=10, quorum_pct=50"
            - "Clock at 2026-03-01"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "bmmot@ex.com", full_name: "BM Mot", is_board_member: true }
              as: HOAManager
              captures: { bm_id: $.data.id }
            - call: "POST /motions"
              payload: { title: "Budget A", description: "Approve budget A", category: "BUDGET", voting_window_start: "2026-04-01T00:00:00Z", voting_window_end: "2026-04-05T00:00:00Z", eligible_voter_count: 10, quorum_pct: 50 }
              as: BoardMember
              as_user_id: "${bm_id}"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /motions"
              payload: { title: "Budget B", description: "Approve budget B", category: "BUDGET", voting_window_start: "2026-04-05T12:00:00Z", voting_window_end: "2026-04-10T00:00:00Z", eligible_voter_count: 10, quorum_pct: 50 }
              as: BoardMember
              as_user_id: "${bm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_MOTION_WINDOW_CONFLICT'"

  # -----------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # -----------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_reverse_restores_outstanding_money_conservation
        grounds:
          - state_machines.Assessment.PAID_to_PARTIALLY_PAID
          - entities.Property.fields.total_outstanding_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY (Property.total_outstanding_cents in cents). Forward
          action POST /assessments/{id}/pay reduces total_outstanding_cents by
          Payment.amount_cents; compensating action POST /payments/{id}/reverse (before
          due_date) MUST restore total_outstanding_cents to exactly its pre-payment
          value. Invariant: Property.total_outstanding_cents_pre == Property.total_outstanding_cents_post_reverse.
        test_recipe:
          setup:
            - "Homeowner H with property P (monthly_dues_cents=30000)"
            - "Clock at 2026-03-01"
            - "Assessment A created with due_date=2026-05-15 (well in the future so reversal happens before due_date, keeping A in PARTIALLY_PAID or OPEN — no OVERDUE re-stamp)"
            - "Full payment of 30000 posted → A.status=PAID"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hinv1@ex.com", full_name: "H Inv1" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "13 Inv Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-05-15T00:00:00Z" }
              as: HOAManager
              captures: { a_id: $.data.id }
            - call: "GET /properties/${p_id}"
              payload: {}
              as: HOAManager
              captures: { pre_out: $.data.total_outstanding_cents }
            - call: "POST /assessments/${a_id}/pay"
              payload: { amount_cents: 30000, method: "MANUAL" }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { pay_id: $.data.id }
            - call: "GET /properties/${p_id}"
              payload: {}
              as: HOAManager
              captures: { mid_out: $.data.total_outstanding_cents }
          trigger:
            - call: "POST /payments/${pay_id}/reverse"
              payload: { reversal_reason: "Compensating test" }
              as: HOAManager
            - call: "GET /properties/${p_id}"
              payload: {}
              as: HOAManager
              captures: { post_out: $.data.total_outstanding_cents }
          assert:
            - "pre_out == 30000"
            - "mid_out == 0"
            - "post_out == 30000"
            - "post_out == pre_out"

      - name: amenity_cancel_restores_capacity_conservation
        grounds:
          - state_machines.AmenityReservation.BOOKED_to_CANCELLED
          - calculations.amenity_capacity_check
        distinguishing_aspect: |
          DIFFERENT conserved quantity: CAPACITY (available guest-count slots on an
          Amenity for a given [start,end) window; NOT money). Forward action POST
          /amenity-reservations reduces available capacity by guest_count; compensating
          action POST /amenity-reservations/{id}/cancel (before start_ts) MUST restore
          the slot such that a subsequent reservation of the same guest_count for the
          same window succeeds. Invariant: available_capacity_pre == available_capacity_post_cancel.
        test_recipe:
          setup:
            - "Amenity 'Court' with capacity=4"
            - "Homeowner H with allowed booking"
            - "Clock at 2026-03-01"
          setup_api_calls:
            - call: "POST /amenities"
              payload: { name: "Court", capacity: 4, reservation_window_start_hour: 6, reservation_window_end_hour: 22 }
              as: HOAManager
              captures: { ct_id: $.data.id }
            - call: "POST /homeowners"
              payload: { email: "hinv2@ex.com", full_name: "H Inv2" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /amenity-reservations"
              payload: { amenity_id: "${ct_id}", homeowner_id: "${h_id}", start_ts: "2026-03-15T10:00:00Z", end_ts: "2026-03-15T12:00:00Z", guest_count: 4 }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { r_a_id: $.data.id }
            - call: "POST /amenity-reservations"
              payload: { amenity_id: "${ct_id}", homeowner_id: "${h_id}", start_ts: "2026-03-15T10:30:00Z", end_ts: "2026-03-15T11:30:00Z", guest_count: 1 }
              as: Homeowner
              as_user_id: "${h_id}"
