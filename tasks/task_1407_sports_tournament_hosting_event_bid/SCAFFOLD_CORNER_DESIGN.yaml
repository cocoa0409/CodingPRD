  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: errors_bid_requirement_domain
        claim_type: violation_to_error
        grounds: ["errors[ERR_REQUIREMENT_NOT_WAIVABLE]", "errors[ERR_REQUIREMENT_NOT_REVIEWABLE]", "errors[ERR_BID_NOT_EDITABLE]", "errors[ERR_BID_ALREADY_ACTIVE]"]
        distinguishing_aspect: "Battery over the bid domain: waive on mandatory PENDING, verify on PENDING, patch on SUBMITTED, and second bid create while SUBMITTED each return their pinned error ids."
        test_recipe:
          setup: ["Event E BIDDING; bid B with R1 (mandatory, weight 100, VERIFIED) and R2 (mandatory, weight 20, PENDING)"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { bid_id: $.data.id } }
            - { call: "POST /api/v1/bids/${bid_id}/requirements", payload: { kind: INSURANCE_CERT, is_mandatory: true, weight_points: 100 }, as: CommissionAdmin, captures: { rq1: $.data.id } }
            - { call: "POST /api/v1/bids/${bid_id}/requirements", payload: { kind: MEDICAL_PLAN, is_mandatory: true, weight_points: 20 }, as: CommissionAdmin, captures: { rq2: $.data.id } }
            - { call: "POST /api/v1/requirements/${rq1}/evidence", payload: { evidence_uri: "s3://ev/ins.pdf" }, as: CommissionAdmin, as_user_id: "ops-admin-1" }
            - { call: "POST /api/v1/requirements/${rq1}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "rev-9" }
          trigger:
            - { call: "POST /api/v1/requirements/${rq2}/waive", payload: { waiver_reason: "not needed" }, as: SanctioningReviewer, as_user_id: "rev-9", captures: { e1: $.data.error_id } }
            - { call: "POST /api/v1/requirements/${rq2}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "rev-9", captures: { e2: $.data.error_id } }
            - { call: "POST /api/v1/requirements/${rq2}/evidence", payload: { evidence_uri: "s3://ev/med.pdf" }, as: CommissionAdmin, as_user_id: "ops-admin-1" }
            - { call: "POST /api/v1/requirements/${rq2}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/submit", payload: {}, as: CommissionAdmin, captures: { bv: $.data.version, bst: $.data.status } }
            - { call: "PATCH /api/v1/bids/${bid_id}", payload: { expected_bid_version: "${bv}", notes: "late edit" }, as: CommissionAdmin, captures: { e3: $.data.error_id } }
            - { call: "GET /api/v1/events/${ev_id}", as: Any, captures: { ev_va: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_va}" }, as: CommissionAdmin, captures: { e4: $.data.error_id } }
          assert:
            - "e1 == ERR_REQUIREMENT_NOT_WAIVABLE (mandatory requirement cannot be waived)"
            - "e2 == ERR_REQUIREMENT_NOT_REVIEWABLE (verify on PENDING)"
            - "after evidence+verify: R2 VERIFIED, submit succeeds (status SUBMITTED, review_score == 120)"
            - "e3 == ERR_BID_NOT_EDITABLE (PATCH on SUBMITTED bid)"
            - "e4 == ERR_BID_ALREADY_ACTIVE (SUBMITTED bid blocks a new bid; only DRAFT is superseded)"

      - name: bid_award_score_gate_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_BID_SCORE_BELOW_THRESHOLD]", calculations.bid_completeness_score, state_machines.Bid.UNDER_REVIEW_to_REJECTED]
        distinguishing_aspect: "review_score 40 (30 VERIFIED + floor(20/2) WAIVED) is below the inclusive 80 gate: AWARDED is rejected; REJECTED then succeeds and drives Event to BID_LOST."
        test_recipe:
          setup: ["Event E BIDDING; bid SUBMITTED then UNDER_REVIEW with score 40"]
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { bid_id: $.data.id } }
            - { call: "POST /api/v1/bids/${bid_id}/requirements", payload: { kind: INSURANCE_CERT, is_mandatory: true, weight_points: 30 }, as: CommissionAdmin, captures: { rq1: $.data.id } }
            - { call: "POST /api/v1/bids/${bid_id}/requirements", payload: { kind: LEGACY_PLAN, is_mandatory: false, weight_points: 20 }, as: CommissionAdmin, captures: { rq2: $.data.id } }
            - { call: "POST /api/v1/requirements/${rq1}/evidence", payload: { evidence_uri: "s3://ev/ins.pdf" }, as: CommissionAdmin, as_user_id: "ops-admin-1" }
            - { call: "POST /api/v1/requirements/${rq1}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/requirements/${rq2}/waive", payload: { waiver_reason: "covered by city program" }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/submit", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/bids/${bid_id}/review", payload: {}, as: SanctioningReviewer, as_user_id: "rev-9" }
          trigger:
            - { call: "POST /api/v1/bids/${bid_id}/decide", payload: { decision: AWARDED }, as: SanctioningReviewer, as_user_id: "rev-9", captures: { err: $.data.error_id } }
            - { call: "POST /api/v1/bids/${bid_id}/decide", payload: { decision: REJECTED }, as: SanctioningReviewer, as_user_id: "rev-9", captures: { st: $.data.status } }
            - { call: "GET /api/v1/events/${ev_id}", as: Any, captures: { evp: $.data.posture } }
          assert:
            - "AWARDED attempt: HTTP 409, error_id == ERR_BID_SCORE_BELOW_THRESHOLD (score 40 < 80)"
            - "Bid stays UNDER_REVIEW after the failed award; REJECTED then succeeds"
            - "Event.${ev_id}.posture == BID_LOST"

