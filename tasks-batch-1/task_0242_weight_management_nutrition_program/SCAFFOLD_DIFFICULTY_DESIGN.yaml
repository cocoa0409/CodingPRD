            - { call: "GET /wm/enrollments/${enr_id}", payload: {}, as: ProgramAdmin, captures: { enr_v: $.data.version } }
            - { call: "POST /wm/eligibility-determinations", payload: { member_id: "${mem_id}", enrollment_id: "${enr_id}" }, as: Clinician, captures: { det_id: $.data.id } }
            - { call: "POST /wm/eligibility-determinations/${det_id}/approve", payload: {}, as: Clinician }
            - { call: "POST /wm/rx-authorizations", payload: { enrollment_id: "${enr_id}", eligibility_determination_id: "${det_id}" }, as: Clinician, captures: { rx_id: $.data.id } }
          trigger:
