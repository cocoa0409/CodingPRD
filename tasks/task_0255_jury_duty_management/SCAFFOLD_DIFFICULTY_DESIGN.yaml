  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: term_not_open_beats_pool_exhausted
        grounds:
          - validations[priority=30]
          - validations[priority=60]
        distinguishing_aspect: |
          On a DRAFT term, a draw of count 99 violates both ERR_TERM_NOT_OPEN (priority 30,
          business_constraint) and ERR_POOL_EXHAUSTED (priority 60, business_constraint). The
          higher-priority TERM_NOT_OPEN wins — category business_constraint × business_constraint
          pairing on the draw endpoint.
        test_recipe:
          setup:
            - "Term DRAFT (never opened) with zero qualified jurors."
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "TE", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: $.data.id, term_v0: $.data.version }
          trigger:
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 99, expected_service_term_version: "${term_v0}" }
              as: JuryAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409 and error_id == ERR_TERM_NOT_OPEN (priority 30 beats priority 60)."

      - name: role_mismatch_beats_invalid_state_on_decide
        grounds:
          - validations[priority=12]
          - validations[priority=21]
        distinguishing_aspect: |
          A CourtClerk (wrong role for DEFER) decides a DEFER disposition that is ALSO already
          GRANTED (no longer PENDING): this violates both ERR_DISPOSITION_ROLE_MISMATCH (priority 12,
          category auth) and ERR_INVALID_STATE (priority 21, category state). Auth priority 12 wins —
          an auth × state category pair, distinct from the first instance's business_constraint pair.
        test_recipe:
          setup:
            - "A DEFER disposition already GRANTED by the JuryAdministrator (decision != PENDING)."
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "TF", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /service-terms"
              payload: { name: "TF-next", report_date: "2026-12-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { next_term_id: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Ivy J", birth_year: 1991, round_trip_miles: 2.0 }
              as: JuryAdministrator
              captures: { juror_id: $.data.id }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: $.data.version }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
            - call: "POST /summonses/${summons_id}/dispositions"
              payload: { kind: "DEFER", reason_code: "HARDSHIP", requested_term_id: "${next_term_id}" }
              as: Juror
              as_user_id: "${juror_id}"
              captures: { disp_id: $.data.id }
            - call: "POST /dispositions/${disp_id}/decide"
              payload: { decision: "GRANTED" }
              as: JuryAdministrator
          trigger:
            - call: "POST /dispositions/${disp_id}/decide"
              payload: { decision: "DENIED" }
              as: CourtClerk
              captures: { err: $.data.error_id }
          assert:
            - "Response status 403 and error_id == ERR_DISPOSITION_ROLE_MISMATCH (priority 12 auth beats priority 21 state)."

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: fta_threshold_inclusive_boundary
        grounds:
          - calculations.fta_disqualification
          - entities.Juror.fields.fta_strike_count
          - entities.ServiceTerm.fields.fta_disqualify_threshold
        distinguishing_aspect: |
          Numeric '>=' boundary on the strike metric reached through POST /summonses/{id}/mark-fta:
          with fta_disqualify_threshold 1, the juror sits at fta_strike_count 0 (0 < 1, QUALIFIED,
          disqualified false) and the single FTA strike lands the count at exactly 1 (1 >= 1),
          flipping disqualified true. The inclusive '>=' boundary at the threshold is observable as
          the qualified→disqualified flip.
        test_recipe:
          setup:
            - "Term OPEN, fta_disqualify_threshold 1; one qualified juror with a QUALIFIED_PENDING summons (fta_strike_count 0, disqualified false before); clock past report_date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-13T08:00:00Z" }
              as: JuryAdministrator
            - call: "POST /service-terms"
              payload: { name: "TG", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3, fta_disqualify_threshold: 1 }
              as: JuryAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Jay J", birth_year: 1983, round_trip_miles: 2.0 }
              as: JuryAdministrator
              captures: { juror_id: $.data.id }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: $.data.version }
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 1, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { summons_id: "$.data[0].id" }
            - call: "POST /summonses/${summons_id}/qualification"
              payload: { is_citizen: true, is_resident: true, felony_conviction: false, english_proficient: true }
              as: Juror
              as_user_id: "${juror_id}"
            - call: "GET /jurors/${juror_id}"
              payload: {}
              as: JuryAdministrator
              captures: { count_before: $.data.fta_strike_count }
          trigger:
            - call: "POST /summonses/${summons_id}/mark-fta"
              payload: {}
              as: CourtClerk
            - call: "GET /jurors/${juror_id}"
              payload: {}
              as: JuryAdministrator
          assert:
            - "Before the strike: fta_strike_count == 0 and disqualified == false (0 < 1)."
            - "After the strike: fta_strike_count == 1 and disqualified == true (1 >= 1); Juror.qualification_status == INELIGIBLE."

      - name: pool_exhausted_empty_set_boundary
        grounds:
          - validations[priority=60]
          - calculations.random_draw_selection
          - entities.ServiceTerm.fields.pool_size
        distinguishing_aspect: |
          Empty-set / count boundary on a DIFFERENT metric (pool cardinality) reached through a
          DIFFERENT endpoint (POST /service-terms/{id}/draw): with exactly 1 eligible juror,
          drawing count 1 succeeds and count 2 fails ERR_POOL_EXHAUSTED — the boundary is
          eligible_pool_size >= count.
        test_recipe:
          setup:
            - "Term OPEN with exactly ONE qualified non-disqualified, not-yet-summoned juror (pool_size 1)."
          setup_api_calls:
            - call: "POST /service-terms"
              payload: { name: "TH", report_date: "2026-07-01T00:00:00Z", daily_pay_cents: 4000, half_day_pay_cents: 2000, full_day_hours: 6.0, mileage_rate_cents: 25, pay_day_cap: 3 }
              as: JuryAdministrator
              captures: { term_id: $.data.id }
            - call: "POST /service-terms/${term_id}/jurors"
              payload: { full_name: "Kim J", birth_year: 1986, round_trip_miles: 2.0 }
              as: JuryAdministrator
              captures: { juror_id: $.data.id }
            - call: "POST /jurors/${juror_id}/qualify"
              payload: {}
              as: JuryAdministrator
            - call: "POST /service-terms/${term_id}/open"
              payload: {}
              as: JuryAdministrator
              captures: { term_v_open: $.data.version }
          trigger:
            - call: "POST /service-terms/${term_id}/draw"
              payload: { count: 2, expected_service_term_version: "${term_v_open}" }
              as: JuryAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "Drawing count 2 against a 1-juror pool → 409 ERR_POOL_EXHAUSTED; no Summons created."

