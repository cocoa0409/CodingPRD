            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z for the build, then advanced to 2026-09-24 so the surviving car is exactly 20 days old at read time."
            - "Car type FLT-100 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family FLT_LINE) with one WS-310 WHEELSET bill-of-material row at qty_per_car 1 and on_hand_qty 1000."
            - "A RETAINED order of 2 cars is reserved, released, changed over on FLT-L1 for [2026-09-02, 2026-09-04) and completed on 2026-09-04, so committed_capital_cents stands at 2 * 71000 == 142000 and both cars are HELD with built_date 2026-09-04."
            - "Car A is sold on 2026-09-24 for 30000 cents with zero writeback and the sale is settled, leaving car B as the only live car."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "FLT-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "FLT_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-310", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 1000 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 2, planned_shop_days: 2, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/FLT-L1/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-04" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 2, completion_date: "2026-09-04" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_a: "$.data[0].id" }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-24T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/lease-fleet-sales"
              payload: { lease_fleet_car_id: "${car_a}", buyer_name: "Great Lakes Rail Leasing", sale_price_cents: 30000, writeback_liability_cents: 0, sale_date: "2026-09-24" }
              as: PortfolioManager
              captures: { sale_id: $.data.id, gain: $.data.gain_loss_cents }
            - call: "POST /api/v1/lease-fleet-sales/${sale_id}/settle"
              payload: {}
              as: PortfolioManager
              captures: { sale_status: $.data.status }
            - call: "GET /api/v1/portfolio-ledger/reconciliation"
              payload: {}
              as: PlatformAdmin
              captures: { oldest: $.data.oldest_basis_cents, newest: $.data.newest_basis_cents, drift: $.data.drift_cents, realized: $.data.realized_gain_cents }
          assert:
            - "The sale settled: LeaseFleetSale.${sale_id}.status == ${sale_status} == \"SETTLED\" and its gain_loss_cents == ${gain} == 9000 (30000 price minus the 21000 book at age 20)"
            - "oldest_basis_cents == committed_capital_cents 142000 - disposal_proceeds_net 30000 == 112000, so ${oldest} == 112000"
            - "newest_basis_cents == ceil(1 * max(0, 71000 - 20 * 2500)) == 21000, so ${newest} == 21000"
            - "drift_cents == 112000 - 21000 == 91000, so ${drift} == 91000"
            - "The divergence is structural: the oldest basis charges the full 30000 proceeds and applies no depreciation, while the newest basis ignores the proceeds and depreciates the live car by 20 * 2500 == 50000"
            - "The PENDING_SETTLEMENT sale would have been excluded from the disposal aggregate: only the SETTLED status moves committed_basis_cents, and PortfolioLedger.realized_gain_cents == ${realized} == 9000 confirms the settle hop ran"

      - name: scrape_or_retrofit_decision_variant_selection_life_end_inclusive
        claim_type: Variant Selection
        grounds:
          - calculations.scrape_or_retrofit_decision
          - entities.LeaseFleetCar.fields.regulatory_life_end_date
          - validations[priority=8]
          - state_machines.LeaseFleetCar.HELD_to_UNDER_REPAIR
        distinguishing_aspect: "A car whose regulatory_life_end_date equals the clock date still takes the RETROFIT path and gets a work order, while a car one day past its life end is forced onto SCRAP-only and the same call returns ERR_REGULATORY_LIFE_EXCEEDED, so the life-end comparison is inclusive."
        test_recipe:
          setup:
            - "Empty DB; clock starts at 2041-09-01T00:00:00Z so the cars can be built with the minimum 10-year regulatory life and then read at their life boundary."
            - "Car type LIFE-100 (BOXCAR, build_hours 1, regulatory_life_years 10, line_count_family LIFE_LINE) with one WS-310 WHEELSET bill-of-material row at qty_per_car 1 and on_hand_qty 1000."
            - "A RETAINED order of 2 cars is reserved, released, changed over on LIFE-L1 for [2041-09-02, 2041-09-03) and completed on 2041-09-03, so both cars carry built_date 2041-09-03 and regulatory_life_end_date 2051-09-03."
            - "Retrofit program MAND-400 (PLANNED, never started) covers car type LIFE-100, needs 10 shop days per car, consumes no component and has compliance_deadline_date 2051-12-31."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2041-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "LIFE-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 10, line_count_family: "LIFE_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-310", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 1000 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 2, planned_shop_days: 2, disposition: "RETAINED", priority_rank: 1, order_date: "2041-09-01", required_delivery_date: "2041-09-20" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/LIFE-L1/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2041-09-02", scheduled_end_date: "2041-09-03" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 2, completion_date: "2041-09-03" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_a: "$.data[0].id", car_b: "$.data[1].id" }
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "MAND-400", description: "Life-end retrofit mandate", compliance_deadline_date: "2051-12-31", required_shop_days_per_car: 10 }
              as: RegulatoryRetrofitist
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/retrofit-program-car-types"
              payload: { retrofit_program_id: "${prog_id}", car_type_id: "${ct_id}" }
              as: RegulatoryRetrofitist
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2051-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/retrofit-work-orders"
              payload: { retrofit_program_id: "${prog_id}", lease_fleet_car_id: "${car_a}", shop_line: "SHOP-400", scheduled_start_date: "2051-09-10", scheduled_end_date: "2051-09-20", component_qty_consumed: 1 }
              as: RegulatoryRetrofitist
              captures: { wo_a: $.data.id, wo_a_status: $.data.status }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2051-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/retrofit-work-orders"
              payload: { retrofit_program_id: "${prog_id}", lease_fleet_car_id: "${car_b}", shop_line: "SHOP-401", scheduled_start_date: "2051-09-10", scheduled_end_date: "2051-09-20", component_qty_consumed: 1 }
              as: RegulatoryRetrofitist
              captures: { err_life: $.data.error_id }
            - call: "GET /api/v1/lease-fleet-cars/${car_b}"
              payload: {}
              as: PlatformAdmin
              captures: { car_b_status: $.data.status }
          assert:
            - "Both cars carry regulatory_life_end_date 2051-09-03 (built_date 2041-09-03 plus regulatory_life_years 10)"
            - "At the clock date 2051-09-03 the life test is inclusive: POST /api/v1/retrofit-work-orders for car A returns 201 with RetrofitWorkOrder.${wo_a}.status == ${wo_a_status} == \"SCHEDULED\", so the car is not forced onto the SCRAP branch"
            - "One day later the same call for car B returns HTTP 422 with data.error_id == ${err_life} == \"ERR_REGULATORY_LIFE_EXCEEDED\", the life_expired variant forcing SCRAP regardless of the retrofit economics"
            - "The rejected call committed nothing: LeaseFleetCar.${car_b}.status == ${car_b_status} == \"HELD\" and no work order row exists for it"
            - "The economics are identical in both calls (10 * 185000 == 1850000, below the 2500000 allowance), so the divergence is caused only by the one-day life-end crossing"
            - "The accepted car moved to UNDER_REPAIR while the rejected one stayed HELD, so the decision's branch is observable on the car rather than stored on the program"

  - section: validations
    instances:
      - name: validation_p1_undeclared_role_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A write that names a role absent from §1.7 is rejected by priority 1 with ERR_UNAUTHENTICATED and HTTP 401 before any payload or state rule is evaluated, and no CarType row is written."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z; no car type exists."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/car-types"
              payload: { model_code: "AUTH-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 25, line_count_family: "AUTH_LINE" }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "The response is HTTP 401 with data.error_id == ${err_id} == \"ERR_UNAUTHENTICATED\""
            - "The rejection is priority 1 (category auth): it fires before the endpoint's role list and before any field validation, so a fully valid payload changes nothing"
            - "The role name Anonymous is not declared in §1.7, which is exactly the condition §1.6 attaches to ERR_UNAUTHENTICATED"
            - "No row was persisted: GET /api/v1/car-types returns an empty data array"
            - "The same request with X-User-Role ProductionPlanner succeeds, so the 401 is caused by the header rather than by the body"

      - name: validation_p2_declared_role_without_permission_returns_forbidden
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
          - roles.Lessee.exclusive_operations
        distinguishing_aspect: "A declared role that §1.7 does not grant POST /car-assignments is rejected by priority 2 with ERR_FORBIDDEN and HTTP 403, distinct from the priority-1 undeclared-role case."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Lessee is a declared §1.7 role (identity entity_backed:Lessee) whose only write surface is GET /lessees/{id}/outstanding-balance for its own id; POST /car-assignments is exclusive to LeaseAdministrator."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "00000000-0000-0000-0000-0000000000c1", lease_contract_id: "00000000-0000-0000-0000-0000000000c2", lessee_id: "00000000-0000-0000-0000-0000000000c3", start_date: "2026-09-04", end_date: "2026-10-04", mileage_allowance: 1000 }
              as: Lessee
              captures: { err_id: $.data.error_id }
          assert:
            - "The response is HTTP 403 with data.error_id == ${err_id} == \"ERR_FORBIDDEN\""
            - "The role is authenticated (it is declared in §1.7), so priority 1 passes and priority 2 is the rejecting rule — the error is not ERR_UNAUTHENTICATED"
            - "The role check precedes the path-id resolution: the call names non-existent UUIDs yet returns 403 rather than ERR_NOT_FOUND, because priority 2 < priority 3"
            - "The denial is per-operation: the same Lessee role is allowed GET /api/v1/car-assignments, which returns 200"
            - "No placement row was created: GET /api/v1/car-assignments returns an empty data array"

      - name: validation_p3_unresolvable_path_id_returns_not_found
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
          - "GET /api/v1/production-orders/{id}"
        distinguishing_aspect: "A path-templated id that resolves to no persisted row is rejected by priority 3 with ERR_NOT_FOUND and HTTP 404, while the identical call against a created order returns 200."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "One real production order exists so the 404 cannot be blamed on an empty store: car type FLT-100 with a WS-310 WHEELSET bill-of-material row, and a SOLD order of 5 cars."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "FLT-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "FLT_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-310", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 1000 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 5, planned_shop_days: 5, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_real: $.data.id }
          trigger:
            - call: "GET /api/v1/production-orders/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: PlatformAdmin
              captures: { err_missing: $.data.error_id }
            - call: "GET /api/v1/production-orders/${po_real}"
              payload: {}
              as: PlatformAdmin
              captures: { real_id: $.data.id }
          assert:
            - "The unresolvable id returns HTTP 404 with data.error_id == ${err_missing} == \"ERR_NOT_FOUND\""
            - "The control call on the created order returns HTTP 200 with data.id == ${real_id} == ${po_real}, so the 404 is id-specific rather than endpoint-wide"
            - "Resolution precedes payload and state checks: this GET carries no body, and priority 3 is the first rule that can fire"
            - "The read is side-effect free: the failed lookup leaves the ProductionOrder row count at 1"
            - "An id that is syntactically a UUID but names nothing is treated the same as any other unresolvable id"

      - name: validation_p4_unresolvable_body_fk_returns_component_not_found
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - errors[ERR_COMPONENT_NOT_FOUND]
          - entities.CarTypeComponentRequirement.fields.component_id
        distinguishing_aspect: "A body foreign key that resolves to no persisted row is rejected by priority 4 with ERR_COMPONENT_NOT_FOUND and HTTP 404 even though the sibling car_type_id in the same body resolves, and no bill-of-material row is written."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type FLT-100 exists so the car_type_id side of the body resolves; no Component exists at all."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "FLT-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "FLT_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
          trigger:
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "00000000-0000-0000-0000-0000000000b1", qty_per_car: 1 }
              as: ProductionPlanner
              captures: { err_fk: $.data.error_id }
            - call: "GET /api/v1/car-type-component-requirements?car_type_id=${ct_id}"
              payload: {}
              as: ProductionPlanner
              captures: { list_check: "$.data[0].id" }
          assert:
            - "The response is HTTP 404 with data.error_id == ${err_fk} == \"ERR_COMPONENT_NOT_FOUND\""
            - "The error_id is the FK-specific one, not the path-level ERR_NOT_FOUND: priority 4 owns unresolvable body foreign keys while priority 3 owns unresolvable path ids"
            - "The resolving car_type_id does not rescue the request: the check is per-reference, so one dangling FK fails the whole write"
            - "Nothing was written: GET /api/v1/car-type-component-requirements?car_type_id=${ct_id} returns an empty data array"
            - "The same payload with a component created first returns 201, so the 404 is caused by the missing row rather than by the body shape"

      - name: validation_p5_invalid_state_already_asserted_by_difficulty_design
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / suspend_assignment_gated_on_contract_status
          rationale: "Asserted as the failure path of the named §1.8 instance, which pins HTTP 409 with data.error_id == \"ERR_INVALID_STATE\" for a suspend on an ACTIVE assignment while its governing contract is AMENDMENT_DRAFTED; the sibling priority_pair_validation_conflict instance asserts the same error_id and status as the winning rule of a p5-versus-p18 conflict."

      - name: validation_p6_terminal_order_rejects_second_completion
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors[ERR_ALREADY_TERMINAL]
          - state_machines.ProductionOrder.terminal_states.COMPLETED
        distinguishing_aspect: "A second POST /production-orders/{id}/complete on an order already in the terminal COMPLETED state is rejected by priority 6 with ERR_ALREADY_TERMINAL and HTTP 409, and completed_qty does not move."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type FLT-100 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family FLT_LINE) with one WS-310 WHEELSET bill-of-material row at qty_per_car 1 and on_hand_qty 1000."
            - "SOLD order of 1 car (planned_shop_days 1) is reserved, released, changed over on FLT-L1 for [2026-09-02, 2026-09-03) and completed on 2026-09-03, so it stands in the terminal COMPLETED state."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "FLT-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "FLT_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-310", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 1000 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 1, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/FLT-L1/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-03" }
              as: ProductionPlanner
              captures: { status_first: $.data.status, qty_first: $.data.completed_qty }
          trigger:
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-03" }
              as: ProductionPlanner
              captures: { err_terminal: $.data.error_id }
            - call: "GET /api/v1/production-orders/${po_id}"
              payload: {}
              as: ProductionPlanner
              captures: { status_after: $.data.status, qty_after: $.data.completed_qty }
          assert:
            - "The first completion left the order terminal: ProductionOrder.${po_id}.status == ${status_first} == \"COMPLETED\" with completed_qty == ${qty_first} == 1"
            - "The repeat call returns HTTP 409 with data.error_id == ${err_terminal} == \"ERR_ALREADY_TERMINAL\""
            - "The terminal state is unchanged by the rejection: status == ${status_after} == \"COMPLETED\" and completed_qty == ${qty_after} == 1"
            - "No partial side effect fired: no second Lessee debit and no additional fleet car was created by the rejected call"
            - "COMPLETED is a declared terminal state of §1.2's ProductionOrder machine, so no trigger is legal from it"

      - name: validation_p7_stale_production_order_version_returns_stale_version
        claim_type: Violation → Error
        grounds:
          - validations[priority=7]
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[endorsement-supersede-stale-order]
        distinguishing_aspect: "An endorsement posted with expected_production_order_version one below the order's live version is rejected by priority 7 with ERR_STALE_VERSION and HTTP 412, while the same body carrying the live version returns 201."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type FLT-100 (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family FLT_LINE) with WS-310 WHEELSET qty_per_car 1 and a substitute WS-320 WHEELSET at unit_cost_cents 1000 with on_hand_qty 1000."
            - "SOLD order of 5 cars reserved, which bumps the order's version past its create-time value so a stale literal is genuinely stale."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "FLT-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 25, line_count_family: "FLT_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-310", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 1000 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-320", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 1000 }
              as: SupplyChainCoordinator
              captures: { ws2_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 5, planned_shop_days: 5, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "GET /api/v1/production-orders/${po_id}"
              payload: {}
              as: ProductionPlanner
              captures: { po_v: $.data.version }
          trigger:
            - call: "POST /api/v1/substitution-endorsements"
              payload: { production_order_id: "${po_id}", original_component_id: "${ws_id}", substitute_component_id: "${ws2_id}", substitute_qty_per_car: 1, decides_material: false, expected_production_order_version: "${po_v} - 1" }
              as: ProductionPlanner
              as_user_id: "planner_1"
              captures: { err_stale: $.data.error_id }
            - call: "POST /api/v1/substitution-endorsements"
              payload: { production_order_id: "${po_id}", original_component_id: "${ws_id}", substitute_component_id: "${ws2_id}", substitute_qty_per_car: 1, decides_material: false, expected_production_order_version: "${po_v}" }
              as: ProductionPlanner
              as_user_id: "planner_1"
              captures: { ok_status: $.data.status }
          assert:
            - "The stale write returns HTTP 412 with data.error_id == ${err_stale} == \"ERR_STALE_VERSION\""
            - "The rejection is priority 7 (category state) and is governed by concurrency_rules[endorsement-supersede-stale-order], whose occ_field is expected_production_order_version"
            - "The identical body carrying the live version ${po_v} succeeds with SubstitutionEndorsement.status == ${ok_status} == \"PENDING\", so only the observed version differs"
            - "No endorsement was persisted by the rejected call: GET /api/v1/substitution-endorsements?production_order_id=${po_id} returns exactly 1 row"
            - "The stale value is an expression over a captured version rather than a literal, so the test stays valid after any cascade bumps the order's version"

