  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: return_amend_blocked_by_open_audit
        grounds:
          - state_machines.TaxReturn.FILED_to_AMENDING
          - validations[priority=9]
          - errors[ERR_AUDIT_OPEN_ON_PERIOD]
          - entities.Audit.fields.status
        distinguishing_aspect: |
          TaxReturn->Audit dependency: amending a FILED return is rejected while an OPEN
          Audit exists for the same taxpayer+period => ERR_AUDIT_OPEN_ON_PERIOD.
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; a FILED 2026-Q1 return; an OPEN FIELD_AUDIT for 2026-Q1."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Nu", entity_type: "LLC", email: "n@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_v: $.data.version }
            - call: "POST /tax/audits"
              payload: { taxpayer_id: "${tp_id}", audit_type: "FIELD_AUDIT", period_key: "2026-Q1" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /tax/returns/${ret_id}/amend"
              payload: { expected_return_version: "${ret_v}", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 500000, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_AUDIT_OPEN_ON_PERIOD"

      - name: refund_approve_blocked_by_suspended_taxpayer
        grounds:
          - state_machines.RefundClaim.OPEN_to_APPROVED
          - validations[priority=5]
          - errors[ERR_ACCOUNT_SUSPENDED]
          - entities.Taxpayer.fields.account_status
        distinguishing_aspect: |
          RefundClaim->Taxpayer dependency: approving an OPEN refund is rejected when the
          owning taxpayer is SUSPENDED => ERR_ACCOUNT_SUSPENDED (different entity pair than the amend/audit case).
        test_recipe:
          setup:
            - "One taxpayer activated then SUSPENDED; a filed return; an OPEN refund claim on it."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Xi", entity_type: "LLC", email: "x@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_v: $.data.version }
            - call: "POST /tax/refund-claims"
              payload: { taxpayer_id: "${tp_id}", return_id: "${ret_id}", claim_amount_cents: 5000, reason: "TAXPAYER_ERROR", overpayment_date: "2026-04-01T00:00:00Z", expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/suspend"
              payload: { suspend_reason: "Delinquent" }
              as: TaxAdmin
          trigger:
            - call: "POST /tax/refund-claims/${claim_id}/approve"
              payload: {}
              as: TaxAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_ACCOUNT_SUSPENDED"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: return_period_overlap_closed_interval
        grounds:
          - validations[priority=9]
          - errors[ERR_PERIOD_OVERLAP]
          - entities.TaxReturn.fields.period_start_date
          - entities.TaxReturn.fields.period_end_date
        distinguishing_aspect: |
          TaxReturn resource, CLOSED interval [start,end] inclusive both ends: a new
          period [2026-03-31, 2026-06-30] sharing the boundary day 2026-03-31 with an
          existing [2026-01-01, 2026-03-31] overlaps => ERR_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; one existing return for period [2026-01-01, 2026-03-31]."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Omicron", entity_type: "LLC", email: "o@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q2", period_start_date: "2026-03-31T00:00:00Z", period_end_date: "2026-06-30T00:00:00Z", filing_due_date: "2026-07-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_PERIOD_OVERLAP"

      - name: exemption_certificate_overlap_half_open_interval
        grounds:
          - validations[priority=9]
          - errors[ERR_CERTIFICATE_OVERLAP]
          - entities.ExemptionCertificate.fields.effective_date
          - entities.ExemptionCertificate.fields.expiry_date
        distinguishing_aspect: |
          ExemptionCertificate resource, HALF-OPEN interval [effective,expiry): two same-type
          RESALE certs [2026-01-01,2026-07-01) and [2026-06-01,2026-12-01) overlap because
          2026-06-01 < 2026-07-01; an adjacency where expiry == other.effective would NOT
          overlap — different interval semantics from the closed-interval period rule.
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; one RESALE certificate valid [2026-01-01, 2026-07-01)."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Pi", entity_type: "LLC", email: "p@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/exemption-certificates"
              payload: { taxpayer_id: "${tp_id}", exemption_type: "RESALE", certificate_number: "R-A", effective_date: "2026-01-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { cert_a_id: $.data.id }
          trigger:
            - call: "POST /tax/exemption-certificates"
              payload: { taxpayer_id: "${tp_id}", exemption_type: "RESALE", certificate_number: "R-B", effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_CERTIFICATE_OVERLAP"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: assessment_abatement_conserves_account_balance
        grounds:
          - calculations.taxpayer_account_balance
          - state_machines.Assessment.ISSUED_to_ABATED
          - state_machines.Appeal.SUBMITTED_to_ALLOWED
          - entities.Taxpayer.fields.account_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Taxpayer.account_balance_cents (ledger identity). Issuing a
          113300 assessment then abating it via an ALLOWED appeal returns the balance to
          exactly 0 (the pre-assessment value) with no drift.
        test_recipe:
          setup:
            - "One ACTIVE taxpayer with zero balance; clock 2026-04-20; a LATE_FILING assessment total 113300 issued by aud-1; an appeal on it."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Rho", entity_type: "CORP", email: "r@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/assessments"
              payload: { taxpayer_id: "${tp_id}", assessment_type: "LATE_FILING", tax_deficiency_cents: 100000, original_due_date: "2026-01-20T00:00:00Z" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { asmt_id: $.data.id }
            - call: "POST /tax/appeals"
              payload: { assessment_id: "${asmt_id}", grounds: "Penalty disputed." }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /tax/appeals/${appeal_id}/decide"
              payload: { outcome: "ALLOW" }
              as: AppealsOfficer
              as_user_id: "off-1"
          assert:
            - "Before the appeal decision, Taxpayer.${tp_id}.account_balance_cents == 113300"
            - "Assessment.${asmt_id}.status == ABATED"
            - "After abatement, Taxpayer.${tp_id}.account_balance_cents == 0"

      - name: remittance_apply_unapply_conserves_amount_partition
        grounds:
          - calculations.remittance_application
          - state_machines.TaxReturn.FILED_to_AMENDING
          - entities.Remittance.fields.applied_amount_cents
          - entities.Remittance.fields.unapplied_amount_cents
        distinguishing_aspect: |
          Conserved quantity = Remittance principal partition (applied_amount_cents +
          unapplied_amount_cents == amount_cents == 100000). After applying 68000 (68000 +
          32000) and then un-applying via return amend (0 + 100000), the partition still
          sums to 100000 — a different conserved quantity than the account balance.
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; a FILED return with net due 68000 (filed late, no discount); a remittance of 100000."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Sigma", entity_type: "LLC", email: "s@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_v: $.data.version }
            - call: "POST /tax/remittances"
              payload: { taxpayer_id: "${tp_id}", remittance_type: "PAYMENT", amount_cents: 100000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { rem_id: $.data.id }
            - call: "POST /tax/remittances/${rem_id}/apply"
              payload: { applied_return_id: "${ret_id}", apply_amount_cents: 68000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax/returns/${ret_id}/amend"
              payload: { expected_return_version: "${ret_v}", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 500000, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "Before amend, Remittance.${rem_id}.applied_amount_cents == 68000 and unapplied_amount_cents == 32000 (sum 100000)"
            - "After amend, Remittance.${rem_id}.applied_amount_cents == 0 and unapplied_amount_cents == 100000 (sum 100000)"
            - "Remittance.${rem_id}.amount_cents == 100000"
