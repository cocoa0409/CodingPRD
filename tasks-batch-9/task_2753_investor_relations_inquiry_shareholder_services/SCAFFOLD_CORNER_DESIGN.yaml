scaffold_corner_design:
  # Breadth probe over §1.1-§1.7. Sections and claim_type values are taken from
  # references/claim-extraction-guide.md; corners already carried by an instance in
  # SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
  # Logical clock default is 2026-08-01T00:00:00Z; every recipe pins it explicitly.

  - section: entities
    instances:
      - name: company_creation_applies_declared_defaults
        claim_type: creation
        grounds:
          - entities.Company
          - endpoints[POST /companies]
          - entities.Company.fields.dividend_reserve_cents
          - entities.Company.fields.disclosure_posture
        distinguishing_aspect: "POST /companies with only the three required fields returns 201 and every optional/computed Company field takes its declared default: dividend_reserve_cents 0, dividend_paid_cents 0, disclosure_posture OPEN, open_inquiry_count 0, blackout window nulls."
        test_recipe:
          setup:
            - "Empty database, logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
          trigger:
            - call: "POST /companies"
              payload: { ticker: "CRE", legal_name: "Creation Defaults Corp", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
          assert:
            - "response is HTTP 201 with $.response_type == 'object' and $.meta.api_request_id present"
            - "$.data.ticker == 'CRE', $.data.legal_name == 'Creation Defaults Corp', $.data.shares_outstanding == 1000000"
            - "$.data.dividend_reserve_cents == 0 and $.data.dividend_paid_cents == 0"
            - "$.data.disclosure_posture == 'OPEN', $.data.open_inquiry_count == 0, $.data.posture_recomputed_at == null"
            - "$.data.blackout_window_start == null and $.data.blackout_window_end == null"
            - "$.data.version == 1 and $.data.id is a non-empty server-minted string"

      - name: company_retrieval_returns_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /companies/{id}]
          - entities.Company
        distinguishing_aspect: "GET /companies/{id} returns exactly the row written by POST /companies — same ticker, shares_outstanding, dividend_reserve_cents and version 1 — with no field re-derivation on read."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one company with an explicit reserve and blackout window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "RET", legal_name: "Retrieval Corp", shares_outstanding: 500000, dividend_reserve_cents: 25000, blackout_window_start: "2026-09-01T00:00:00Z", blackout_window_end: "2026-09-15T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
          trigger:
            - call: "GET /companies/${co_id}"
              payload: {}
              as: IRAnalyst
              as_user_id: "u_ira_1"
          assert:
            - "response is HTTP 200 with $.data.id == ${co_id}"
            - "$.data.ticker == 'RET', $.data.shares_outstanding == 500000, $.data.dividend_reserve_cents == 25000"
            - "$.data.blackout_window_start == 2026-09-01T00:00:00.000Z and $.data.blackout_window_end == 2026-09-15T00:00:00.000Z"
            - "$.data.disclosure_posture == 'OPEN' (the stored value; a read never recomputes posture) and $.data.version == 1"

      - name: contacts_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /contacts]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three contacts on one company, GET /contacts?company_id=..&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One company with exactly three contacts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "LST", legal_name: "Listing Corp", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "List One", email: "l1@funds.test", shares_held: 30000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "RETAIL_HOLDER", display_name: "List Two", email: "l2@retail.test", shares_held: 100 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "SELL_SIDE_ANALYST", display_name: "List Three", email: "l3@bank.test" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
          trigger:
            - call: "GET /contacts"
              payload: { company_id: "${co_id}", limit: 2, offset: 0 }
              as: IRAnalyst
              as_user_id: "u_ira_1"
            - call: "GET /contacts"
              payload: { company_id: "${co_id}", limit: 2, offset: 2 }
              as: IRAnalyst
              as_user_id: "u_ira_1"
          assert:
            - "trigger step 1 responds HTTP 200 with $.response_type == 'array', 2 contact rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger step 2 responds HTTP 200 with 1 contact row, total_count == 3, has_more == false, offset == 2"
            - "the union of the two pages contains all three contact ids exactly once"

      - name: unknown_company_and_contact_paths_return_typed_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_COMPANY_NOT_FOUND]
          - errors[ERR_CONTACT_NOT_FOUND]
        distinguishing_aspect: "A path id that matches no row returns the entity-specific 404 code — ERR_COMPANY_NOT_FOUND for GET /companies/{id} and ERR_CONTACT_NOT_FOUND for GET /contacts/{id} — never a generic 404."
        test_recipe:
          setup:
            - "Empty database apart from the clock pin; no company and no contact exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
          trigger:
            - call: "GET /companies/00000000-0000-0000-0000-0000000000c0"
              payload: {}
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "GET /contacts/00000000-0000-0000-0000-0000000000c1"
              payload: {}
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
          assert:
            - "trigger step 1 responds HTTP 404 with $.data.error_id == ERR_COMPANY_NOT_FOUND and $.response_type == 'error'"
            - "trigger step 2 responds HTTP 404 with $.data.error_id == ERR_CONTACT_NOT_FOUND"

      - name: inquiry_creation_missing_required_fields_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /inquiries]
        distinguishing_aspect: "topic_category and subject are input fields with no default: omitting topic_category returns ERR_INVALID_REQUEST (400) and no InquiryTicket row is created, so the company's open_inquiry_count stays 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one company with one retail contact."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "REQ", legal_name: "Required Fields Corp", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "RETAIL_HOLDER", display_name: "Req Holder", email: "req@retail.test", shares_held: 100 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /inquiries"
              payload: { company_id: "${co_id}", contact_id: "${c_id}", subject: "Where is my dividend cheque?" }
              as: IRAnalyst
              as_user_id: "u_ira_1"
            - call: "GET /companies/${co_id}"
              payload: {}
              as: IRAnalyst
              as_user_id: "u_ira_1"
          assert:
            - "trigger step 1 responds HTTP 400 with $.data.error_id == ERR_INVALID_REQUEST"
            - "trigger step 2 shows $.data.open_inquiry_count == 0 and $.data.version == 1 — the rejected intake wrote nothing"

      - name: contact_creation_defaults_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.Contact.fields.shares_held
          - entities.Contact.fields.nda_on_file
          - entities.Contact.fields.coverage_status
          - entities.Contact.fields.model_access_status
          - entities.Contact.fields.threat_level
        distinguishing_aspect: "Omitting shares_held, nda_on_file, coverage_status and activist_flag yields shares_held 0, ownership_pct 0.0, target_tier UNTIERED (never TIER_3), nda_on_file false, coverage_status NOT_COVERING, model_access_status NONE, threat_level NONE, dividend_received_cents 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one company with 1,000,000 shares outstanding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "DEF", legal_name: "Defaults Corp", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
          trigger:
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "RETAIL_HOLDER", display_name: "Default Holder", email: "def@retail.test" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
          assert:
            - "response is HTTP 201 with $.data.shares_held == 0 and $.data.ownership_pct == 0.0"
            - "$.data.target_tier == 'UNTIERED' (ownership_pct == 0 is UNTIERED, never TIER_3)"
            - "$.data.nda_on_file == false, $.data.coverage_status == 'NOT_COVERING', $.data.activist_flag == false, $.data.threat_level == 'NONE'"
            - "$.data.model_access_status == 'NONE' and $.data.dividend_received_cents == 0 and $.data.version == 1"

      - name: contact_creation_computes_ownership_pct_and_tier
        claim_type: computed_fields
        grounds:
          - calculations.ownership_pct_and_target_tier
          - entities.Contact.fields.ownership_pct
          - entities.Contact.fields.target_tier
        distinguishing_aspect: "A holder of 60,000 shares of 1,000,000 outstanding gets ownership_pct 6.0000 and target_tier TIER_1 computed at creation; ownership_pct and target_tier are not accepted as input at all."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one company with 1,000,000 shares outstanding."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "OWN", legal_name: "Ownership Corp", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
          trigger:
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Big Holder", email: "big@funds.test", shares_held: 60000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
          assert:
            - "response is HTTP 201 with $.data.ownership_pct == 6.0000 and $.data.target_tier == 'TIER_1'"
            - "$.data.shares_held == 60000 and $.data.version == 1"
            - "the Company row is untouched: GET /companies/${co_id} still shows version 1 and shares_outstanding 1000000"

      - name: response_draft_system_fields_come_from_the_actor_header
        claim_type: system_fields
        grounds:
          - entities.ResponseDraft.fields.author_user_id
          - entities.ResponseDraft.fields.reviewer_user_id
          - endpoints[POST /response-drafts]
        distinguishing_aspect: "author_user_id is stamped from the creating request's X-User-ID (u_ira_7) and is not an input field; reviewer_user_id, pinned_disclosure_version and blocked_reason stay null until a review happens."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One company, one retail contact, one inquiry routed to SHAREHOLDER_SERVICES."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "SYS", legal_name: "System Fields Corp", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "RETAIL_HOLDER", display_name: "Sys Holder", email: "sys@retail.test", shares_held: 100 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_id: "$.data.id" }
            - call: "POST /inquiries"
              payload: { company_id: "${co_id}", contact_id: "${c_id}", topic_category: "OTHER", subject: "How do I update my address?" }
              as: IRAnalyst
              as_user_id: "u_ira_7"
              captures: { inq_id: "$.data.id" }
            - call: "POST /inquiries/${inq_id}/route"
              payload: {}
              as: IRAnalyst
              as_user_id: "u_ira_7"
          trigger:
            - call: "POST /response-drafts"
              payload: { inquiry_id: "${inq_id}", body_text: "Please use the shareholder portal to update your address of record.", disclosure_class: "PUBLIC_DOMAIN" }
              as: IRAnalyst
              as_user_id: "u_ira_7"
          assert:
            - "response is HTTP 201 with $.data.author_user_id == 'u_ira_7'"
            - "$.data.reviewer_user_id == null, $.data.reviewer_note == null, $.data.pinned_disclosure_version == null, $.data.blocked_reason == null"
            - "$.data.status == 'DRAFT', $.data.revision_round == 1, $.data.version == 1, and created_at / updated_at are server-set non-null timestamps"

      - name: roadshow_event_enum_and_range_constraints_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.RoadshowEvent.fields.event_type
          - entities.RoadshowEvent.fields.window_start
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An event_type outside {CONFERENCE, NDR} and a window whose start is after its end are both refused with ERR_INVALID_REQUEST (400) by the priority-3 shape check, before any business rule runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one company."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "TYP", legal_name: "Type Constraints Corp", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
          trigger:
            - call: "POST /roadshow-events"
              payload: { company_id: "${co_id}", event_type: "SUMMIT", venue_city: "Paris", window_start: "2026-09-01T13:00:00Z", window_end: "2026-09-01T18:00:00Z", slot_minutes: 30, capacity_slots: 4 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /roadshow-events"
              payload: { company_id: "${co_id}", event_type: "NDR", venue_city: "Paris", window_start: "2026-09-01T18:00:00Z", window_end: "2026-09-01T13:00:00Z", slot_minutes: 30, capacity_slots: 4 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "GET /roadshow-events"
              payload: { company_id: "${co_id}" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
          assert:
            - "trigger step 1 responds HTTP 400 with $.data.error_id == ERR_INVALID_REQUEST (event_type not a member of the enum)"
            - "trigger step 2 responds HTTP 400 with $.data.error_id == ERR_INVALID_REQUEST (window_start >= window_end)"
            - "trigger step 3 responds HTTP 200 with total_count == 0 — neither rejected request created a row"

      - name: inquiry_body_foreign_keys_checked_in_declaration_order
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_COMPANY_NOT_FOUND]
          - errors[ERR_CONTACT_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "On POST /inquiries the body FKs are resolved in declaration order company_id then contact_id: when both are unknown the response is ERR_COMPANY_NOT_FOUND, and when only contact_id is unknown it is ERR_CONTACT_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one company with one contact."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "FKO", legal_name: "FK Order Corp", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "RETAIL_HOLDER", display_name: "FK Holder", email: "fk@retail.test", shares_held: 100 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /inquiries"
              payload: { company_id: "00000000-0000-0000-0000-0000000000c0", contact_id: "00000000-0000-0000-0000-0000000000c1", topic_category: "OTHER", subject: "Both parents missing." }
              as: IRAnalyst
              as_user_id: "u_ira_1"
            - call: "POST /inquiries"
              payload: { company_id: "${co_id}", contact_id: "00000000-0000-0000-0000-0000000000c1", topic_category: "OTHER", subject: "Contact missing only." }
              as: IRAnalyst
              as_user_id: "u_ira_1"
            - call: "POST /inquiries"
              payload: { company_id: "${co_id}", contact_id: "${c_id}", topic_category: "OTHER", subject: "Both parents present." }
              as: IRAnalyst
              as_user_id: "u_ira_1"
          assert:
            - "trigger step 1 responds HTTP 404 with $.data.error_id == ERR_COMPANY_NOT_FOUND (company_id is declared first)"
            - "trigger step 2 responds HTTP 404 with $.data.error_id == ERR_CONTACT_NOT_FOUND"
            - "trigger step 3 responds HTTP 201 with $.data.status == 'NEW' and $.data.company_id == ${co_id}"

      - name: self_referential_prior_inquiry_link_must_resolve
        claim_type: parent_relationships
        grounds:
          - entities.InquiryTicket.fields.linked_prior_inquiry_id
          - validations[priority=5]
          - errors[ERR_INQUIRY_NOT_FOUND]
          - calculations.inquiry_sensitivity_score
          - calculations.inquiry_sla_due_at
        distinguishing_aspect: "linked_prior_inquiry_id is a self-referential FK: an unknown value returns ERR_INQUIRY_NOT_FOUND, and a link to a prior inquiry that is only NEW (not ESCALATED) adds no followup term, leaving sensitivity_score at the GUIDANCE base of 40 with an IR_DESK 72-hour SLA."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One company, one institutional holder, one prior inquiry left in status NEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "SLF", legal_name: "Self Reference Corp", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Self Holder", email: "slf@funds.test", shares_held: 20000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_id: "$.data.id" }
            - call: "POST /inquiries"
              payload: { company_id: "${co_id}", contact_id: "${c_id}", topic_category: "GUIDANCE", subject: "First question about FY2026." }
              as: IRAnalyst
              as_user_id: "u_ira_1"
              captures: { prior_id: "$.data.id" }
          trigger:
            - call: "POST /inquiries"
              payload: { company_id: "${co_id}", contact_id: "${c_id}", topic_category: "GUIDANCE", subject: "Follow-up to a missing inquiry.", linked_prior_inquiry_id: "00000000-0000-0000-0000-0000000000f0" }
              as: IRAnalyst
              as_user_id: "u_ira_1"
            - call: "POST /inquiries"
              payload: { company_id: "${co_id}", contact_id: "${c_id}", topic_category: "GUIDANCE", subject: "Follow-up to my first question.", linked_prior_inquiry_id: "${prior_id}" }
              as: IRAnalyst
              as_user_id: "u_ira_1"
              captures: { follow_id: "$.data.id" }
          assert:
            - "trigger step 1 responds HTTP 404 with $.data.error_id == ERR_INQUIRY_NOT_FOUND"
            - "trigger step 2 responds HTTP 201 with $.data.linked_prior_inquiry_id == ${prior_id}"
            - "InquiryTicket.${follow_id}.sensitivity_score == 40 (base 40, followup_term 0 because the prior inquiry is NEW rather than ESCALATED)"
            - "InquiryTicket.${follow_id}.routing_queue == 'IR_DESK' and sla_due_at == 2026-08-04T00:00:00.000Z"
            - "Company.${co_id}.open_inquiry_count == 2"

      - name: disclosure_is_guidance_flag_derived_from_type_and_metric
        claim_type: computed_fields
        grounds:
          - entities.Disclosure.fields.is_guidance
          - entities.Disclosure.fields.status
          - endpoints[POST /disclosures]
        distinguishing_aspect: "is_guidance is derived, not accepted: a GUIDANCE_UPDATE row carrying metric EPS gets is_guidance true while a PRESS_RELEASE row with metric omitted gets is_guidance false, and both start in DRAFT with published_at null."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one company."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
