      - name: claim_requires_event_open
        grounds:
          - state_machines.MulchEvent.SCHEDULED_to_OPEN
          - errors[ERR_EVENT_NOT_OPEN]
          - endpoints["POST /mulch-claims"]
        distinguishing_aspect: |
          Pair MulchClaim -> MulchEvent (different entity pair than booking->zone):
          claim creation is gated on the EVENT's lifecycle state. A claim against a
          SCHEDULED event fails even inside the claim window; opening the event admits it.
        test_recipe:
          setup:
            - "Program ACTIVE; event created but still SCHEDULED; clock inside claim window; household H1 registered (GENERAL tier)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
              captures: { zid: $.data.id }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /mulch-events"
              payload: { program_id: "${pid}", name: "Mulch Day", claim_open_at: "2027-01-18T00:00:00Z", claim_close_at: "2027-01-22T23:59:59Z", pickup_start: "2027-01-23T09:00:00Z", pickup_end: "2027-01-23T15:00:00Z" }
              as: ProgramAdmin
              captures: { eid: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-18T12:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /mulch-claims"
              payload: { event_id: "${eid}", household_id: "${h1}", requested_cy: 1.0 }
              as: Resident
              as_user_id: "${h1}"
              captures: { e: $.data.error_id }
            - call: "PATCH /mulch-events/${eid}"
              payload: { status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /mulch-claims"
              payload: { event_id: "${eid}", household_id: "${h1}", requested_cy: 1.0 }
              as: Resident
              as_user_id: "${h1}"
              captures: { c1: $.data.id }
          assert:
            - "While event SCHEDULED: error_id == ERR_EVENT_NOT_OPEN (409)"
            - "After open: MulchClaim.${c1}.status == WAITLISTED with allocated_cy == 0 (pool is 0 — claim admitted, not rejected)"
            - "MulchClaim.${c1}.tier == GENERAL"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: volunteer_shift_adjacency_half_open
        grounds:
          - errors[ERR_SHIFT_OVERLAP]
          - endpoints["POST /volunteer-shifts"]
          - entities.VolunteerShift.fields.start_at
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the Volunteer resource: [09:00,12:00) then
          [12:00,15:00) are adjacent and both admitted; [11:00,13:00) overlaps the first
          and is rejected even though it merely touches the second's start... it overlaps
          both because 11:00 < 12:00 and 13:00 > 12:00 — rejected either way.
        test_recipe:
          setup:
            - "Program ACTIVE; site OPEN; volunteer V approved; no shifts yet"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
