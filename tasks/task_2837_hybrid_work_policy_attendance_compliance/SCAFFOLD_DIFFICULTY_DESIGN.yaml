      - name: data_residency_outranks_relocation_risk_ceiling
        grounds:
          - validations[priority=64, ERR_DATA_RESIDENCY_PROHIBITED]
          - validations[priority=80, ERR_RELOCATION_RISK_CEILING]
          - calculations.relocation_risk_score
          - state_machines.RemoteLocationRequest.UNDER_REVIEW_to_DENIED
        priority_pair: [64, 80]
        expected_error: ERR_DATA_RESIDENCY_PROHIBITED
        distinguishing_aspect: |
          A RESTRICTED-tier relocation to BR is doubly unapprovable: BR is outside
          ALLOWED_RESTRICTED_JURISDICTIONS (band 64) and its FINAL risk score of 100
          also reaches APPROVAL_RISK_CEILING (band 80). The cross-entity config check
          must win, so the answer names the residency rule and not the score. The
          companion request to US_NY isolates band 80 with identical review inputs.
        test_recipe:
          setup:
            - "One OPEN cycle, one team, one ACTIVE employee holding an APPROVED FULLY_REMOTE classification."
            - "Two SUBMITTED RemoteLocationRequests at data_classification_tier RESTRICTED: R-BR for jurisdiction BR (base 30 + 30 = 60) and R-NY for jurisdiction US_NY (base 12 + 30 = 42)."
            - "Both get identical reviews: tax CLEARED with licensing_gap_count 3 and tax_nexus_registration_cost_cents 5000000 (exactly the per-request budget, so ERR_TAX_NEXUS_BUDGET_EXCEEDED does not fire), security CLEARED with control_gap_count 3."
