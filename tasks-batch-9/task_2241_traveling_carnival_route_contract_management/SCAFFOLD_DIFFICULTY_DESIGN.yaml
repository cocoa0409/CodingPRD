  # ===========================================================================
  # RULE 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: contract_execute_cascades_four_hops_to_inspection_slots_and_posture
        grounds:
          - state_machines.Contract.SENT_to_EXECUTED
          - state_machines.RouteStop.PLANNED_to_CONFIRMED
          - state_machines.RideAllocation.RESERVED_to_COMMITTED
          - calculations.inspection_slot_selector
          - calculations.stop_compliance_posture
          - entities.Route.fields.total_guaranteed_cents
        distinguishing_aspect: |
          This cascade is FOUR hops deep and its third hop is ORDER-SENSITIVE: execute (hop 1) confirms the stop,
          the confirmed stop commits all three RESERVED allocations in created_at ASC order (hop 2), each commit
          consumes one of the jurisdiction's 2 daily inspection slots (hop 3) so the first two orders land on
          2026-09-01T14:00:00Z and the third is pushed to 2026-09-02T14:00:00Z, and only then is the posture
          recomputed to INSPECTION_HOLD (hop 4). Reversing hop 2's order would move which ride gets the later slot.
        test_recipe:
          setup:
            - "Jurisdiction OH_STATE: requires_state_ride_inspection true, inspection_slot_capacity_per_day 2."
            - "Venue V1 in OH_STATE with an APPROVED EVENT permit on stop A."
            - "Three rides that all require state inspection, created and allocated in this order: KIDDIE_A (905 sqft / 60 A), KIDDIE_B (101 sqft / 1 A), FLAT_C (1603 sqft / 90 A)."
            - "Route R1 SEQUENCED then COMMITTED; Contract C1 SENT with guarantee_cents 900000; stop A still PLANNED and all three allocations still RESERVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000, requires_state_ride_inspection: true, inspection_slot_capacity_per_day: 2 }
