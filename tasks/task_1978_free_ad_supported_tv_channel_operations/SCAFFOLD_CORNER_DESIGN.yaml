        distinguishing_aspect: "Cap boundary: with daily_impression_cap 1 and a 2-slot break, the house ad fills slot 0 (placements 0 < 1) but NOT slot 1 (placements 1 == cap); remaining slot goes slate."
        test_recipe:
          setup: ["Channel ch (600s); loop lp tiled (entry ct540 + 60s break br), VALIDATED; one house ad h1 (weight 5, cap 1); no campaigns"]
          setup_api_calls:
