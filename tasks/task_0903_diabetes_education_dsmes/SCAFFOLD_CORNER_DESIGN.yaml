# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of testable claims not in §1.8)
# Every active instance drives empty-DB -> precondition via §1.5 calls only.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: entity_program_create_and_retrieve
        claim_type: Creation
        grounds:
          - "entities.Program"
          - "endpoints"
        distinguishing_aspect: "POST /dsmes/programs with required fields returns 201 with accreditation_status defaulting to ACCREDITED; GET returns the same row."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /dsmes/programs", payload: { name: "Corner Prog", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { c_prog: "$.data.id" } }
          trigger:
            - { call: "GET /dsmes/programs/${c_prog}", payload: {}, as: ProgramCoordinator, captures: { c_prog_status: "$.data.accreditation_status" } }
          assert:
            - "Program.${c_prog}.accreditation_status == ACCREDITED"
            - "Program.${c_prog}.version == 1"

      - name: entity_patient_get_not_found
        claim_type: Not Found
        grounds:
          - "entities.Patient"
          - "errors[ERR_PATIENT_NOT_FOUND]"
        distinguishing_aspect: "GET /dsmes/patients/{unknown-uuid} returns ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /dsmes/patients/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramCoordinator, captures: { c_pnf: "$.data.error_id" } }
          assert:
            - "trigger response.data.error_id == ERR_PATIENT_NOT_FOUND"

      - name: entity_curriculum_missing_required_field
        claim_type: Required Fields
        grounds:
          - "entities.Curriculum"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /dsmes/curricula without required_hours returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dsmes/curricula", payload: { name: "No Hours", diabetes_type_focus: "TYPE_2", module_count: 8 }, as: ProgramCoordinator, captures: { c_cvf: "$.data.error_id" } }
          assert:
            - "trigger response.data.error_id == ERR_VALIDATION"

      - name: entity_dietitian_invalid_enum_credential
        claim_type: Type Constraints
        grounds:
          - "entities.Dietitian.fields.credential"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /dsmes/dietitians with credential not in {RD,RN,CDCES,PHARMD} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dsmes/dietitians", payload: { full_name: "Bad Cred", npi: "1000009999", credential: "WIZARD" }, as: ProgramCoordinator, captures: { c_dec: "$.data.error_id" } }
          assert:
            - "trigger response.data.error_id == ERR_VALIDATION"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: sm_session_cancel_from_cancelled_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Session.SCHEDULED_to_CANCELLED"
          - "errors[ERR_SESSION_INVALID_STATE]"
        distinguishing_aspect: "Cancelling an already-CANCELLED session returns ERR_SESSION_INVALID_STATE; no hours re-credited."
        test_recipe:
          setup: ["ACTIVE enrollment; one session SCHEDULED then CANCELLED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "SMA Prog", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { sma_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "SMA Cur", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { sma_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "SMA-1", full_name: "Sam A", date_of_birth: "1970-01-01", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.0 }, as: ProgramCoordinator, captures: { sma_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD SMA", npi: "1000000101", credential: "RD" }, as: ProgramCoordinator, captures: { sma_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${sma_prog}", patient_id: "${sma_pat}", referring_provider_npi: "2000000101", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { sma_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${sma_ref}/assess", payload: { assessed_a1c: 8.0 }, as: Dietitian, as_user_id: "${sma_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${sma_ref}", curriculum_id: "${sma_cur}" }, as: ProgramCoordinator, captures: { sma_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${sma_enr}/activate", payload: {}, as: ProgramCoordinator, captures: { sma_v2: "$.data.version" } }
            - { call: "POST /dsmes/sessions", payload: { enrollment_id: "${sma_enr}", dietitian_id: "${sma_die}", modality: "INDIVIDUAL", scheduled_start: "2026-05-23T09:00:00Z", scheduled_end: "2026-05-23T10:00:00Z", expected_enrollment_version: "${sma_v2}" }, as: Dietitian, as_user_id: "${sma_die}", captures: { sma_sess: "$.data.id" } }
            - { call: "POST /dsmes/sessions/${sma_sess}/cancel", payload: {}, as: Dietitian, as_user_id: "${sma_die}" }
          trigger:
            - { call: "POST /dsmes/sessions/${sma_sess}/cancel", payload: {}, as: Dietitian, as_user_id: "${sma_die}", captures: { sma_err: "$.data.error_id" } }
          assert:
            - "trigger response.data.error_id == ERR_SESSION_INVALID_STATE"

      - name: sm_referral_assess_from_assessed_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Referral.RECEIVED_to_ASSESSED"
          - "errors[ERR_REFERRAL_INVALID_STATE]"
        distinguishing_aspect: "Assessing an already-ASSESSED referral returns ERR_REFERRAL_INVALID_STATE."
        test_recipe:
          setup: ["Referral ASSESSED"]
          setup_api_calls:
            - { call: "POST /dsmes/programs", payload: { name: "SMB Prog", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { smb_prog: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "SMB-1", full_name: "Sue B", date_of_birth: "1971-02-02", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.0 }, as: ProgramCoordinator, captures: { smb_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD SMB", npi: "1000000102", credential: "RD" }, as: ProgramCoordinator, captures: { smb_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${smb_prog}", patient_id: "${smb_pat}", referring_provider_npi: "2000000102", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { smb_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${smb_ref}/assess", payload: { assessed_a1c: 8.0 }, as: Dietitian, as_user_id: "${smb_die}" }
          trigger:
            - { call: "POST /dsmes/referrals/${smb_ref}/assess", payload: { assessed_a1c: 7.9 }, as: Dietitian, as_user_id: "${smb_die}", captures: { smb_err: "$.data.error_id" } }
          assert:
            - "trigger response.data.error_id == ERR_REFERRAL_INVALID_STATE"

      - name: sm_enrollment_reinstate_from_active_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Enrollment.SUSPENDED_to_ACTIVE"
          - "errors[ERR_ENROLLMENT_INVALID_STATE]"
        distinguishing_aspect: "Reinstating an ACTIVE (not SUSPENDED) enrollment returns ERR_ENROLLMENT_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE enrollment (never suspended)"]
          setup_api_calls:
            - { call: "POST /dsmes/programs", payload: { name: "SMC Prog", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { smc_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "SMC Cur", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { smc_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "SMC-1", full_name: "Sid C", date_of_birth: "1972-03-03", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.0 }, as: ProgramCoordinator, captures: { smc_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD SMC", npi: "1000000103", credential: "RD" }, as: ProgramCoordinator, captures: { smc_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${smc_prog}", patient_id: "${smc_pat}", referring_provider_npi: "2000000103", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { smc_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${smc_ref}/assess", payload: { assessed_a1c: 8.0 }, as: Dietitian, as_user_id: "${smc_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${smc_ref}", curriculum_id: "${smc_cur}" }, as: ProgramCoordinator, captures: { smc_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${smc_enr}/activate", payload: {}, as: ProgramCoordinator }
          trigger:
            - { call: "POST /dsmes/enrollments/${smc_enr}/reinstate", payload: {}, as: ProgramCoordinator, captures: { smc_err: "$.data.error_id" } }
          assert:
            - "trigger response.data.error_id == ERR_ENROLLMENT_INVALID_STATE"

      - name: sm_device_return_from_requested_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.DeviceEnrollment.ACTIVE_to_RETURNED"
          - "errors[ERR_DEVICE_INVALID_STATE]"
        distinguishing_aspect: "Returning a REQUESTED (never activated) device returns ERR_DEVICE_INVALID_STATE."
        test_recipe:
          setup: ["ACTIVE enrollment; DeviceEnrollment in REQUESTED"]
          setup_api_calls:
            - { call: "POST /dsmes/programs", payload: { name: "SMD Prog", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { smd_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "SMD Cur", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { smd_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "SMD-1", full_name: "Sal D", date_of_birth: "1973-04-04", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.0 }, as: ProgramCoordinator, captures: { smd_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD SMD", npi: "1000000104", credential: "RD" }, as: ProgramCoordinator, captures: { smd_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${smd_prog}", patient_id: "${smd_pat}", referring_provider_npi: "2000000104", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { smd_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${smd_ref}/assess", payload: { assessed_a1c: 8.0 }, as: Dietitian, as_user_id: "${smd_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${smd_ref}", curriculum_id: "${smd_cur}" }, as: ProgramCoordinator, captures: { smd_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${smd_enr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /dsmes/device-enrollments", payload: { enrollment_id: "${smd_enr}", device_type: "CGM", serial_number: "SN-SMD-1" }, as: ProgramCoordinator, captures: { smd_dev: "$.data.id" } }
          trigger:
            - { call: "POST /dsmes/device-enrollments/${smd_dev}/return", payload: {}, as: Dietitian, as_user_id: "${smd_die}", captures: { smd_err: "$.data.error_id" } }
          assert:
            - "trigger response.data.error_id == ERR_DEVICE_INVALID_STATE"

      - name: sm_enrollment_suspend_cycle_covered
        claim_type: valid_transition
        grounds:
          - "state_machines.Enrollment.ACTIVE_to_SUSPENDED"
        excluded_because:
          difficulty_instance: nl_enrollment_suspend_reinstate_cycle
          rationale: "The ACTIVE->SUSPENDED->ACTIVE cycle and no_show retention are asserted by the named §1.8 non-linear instance."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: calc_device_glucose_stats_avg_latest
        claim_type: Correct Result
        grounds:
          - "calculations.device_glucose_stats"
          - "entities.DeviceEnrollment.fields.avg_glucose_mgdl"
          - "entities.DeviceEnrollment.fields.latest_glucose_mgdl"
        distinguishing_aspect: "Two accepted readings (100 @ earlier, 140 @ later) yield avg_glucose_mgdl 120.0, latest_glucose_mgdl 140, readings_count 2."
        test_recipe:
          setup: ["ACTIVE enrollment; ACTIVE CGM device; two readings ingested"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "CGA Prog", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { cga_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "CGA Cur", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { cga_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "CGA-1", full_name: "Gia A", date_of_birth: "1974-05-05", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.0 }, as: ProgramCoordinator, captures: { cga_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD CGA", npi: "1000000105", credential: "CDCES" }, as: ProgramCoordinator, captures: { cga_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${cga_prog}", patient_id: "${cga_pat}", referring_provider_npi: "2000000105", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { cga_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${cga_ref}/assess", payload: { assessed_a1c: 8.0 }, as: Dietitian, as_user_id: "${cga_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${cga_ref}", curriculum_id: "${cga_cur}" }, as: ProgramCoordinator, captures: { cga_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${cga_enr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /dsmes/device-enrollments", payload: { enrollment_id: "${cga_enr}", device_type: "CGM", serial_number: "SN-CGA-1" }, as: ProgramCoordinator, captures: { cga_dev: "$.data.id" } }
            - { call: "POST /dsmes/device-enrollments/${cga_dev}/activate", payload: {}, as: Dietitian, as_user_id: "${cga_die}" }
            - { call: "POST /dsmes/device-enrollments/${cga_dev}/readings", payload: { glucose_mgdl: 100, measured_at: "2026-05-02T08:00:00Z" }, as: Dietitian, as_user_id: "${cga_die}" }
            - { call: "POST /dsmes/device-enrollments/${cga_dev}/readings", payload: { glucose_mgdl: 140, measured_at: "2026-05-02T20:00:00Z" }, as: Dietitian, as_user_id: "${cga_die}" }
          trigger:
            - { call: "GET /dsmes/device-enrollments/${cga_dev}", payload: {}, as: Dietitian, as_user_id: "${cga_die}", captures: { cga_avg: "$.data.avg_glucose_mgdl", cga_latest: "$.data.latest_glucose_mgdl" } }
          assert:
            - "DeviceEnrollment.${cga_dev}.avg_glucose_mgdl == 120.0"
            - "DeviceEnrollment.${cga_dev}.latest_glucose_mgdl == 140"
            - "DeviceEnrollment.${cga_dev}.readings_count == 2"

      - name: calc_group_session_billing_group_rate
        claim_type: Correct Result
        grounds:
          - "calculations.session_billing"
          - "entities.Session.fields.charge_cents"
        distinguishing_aspect: "A completed GROUP session of 60 actual minutes bills 2 units at GROUP_UNIT_RATE_CENTS 1500 = 3000 (contrast individual rate 5000)."
        test_recipe:
          setup: ["ACTIVE enrollment; a GROUP session (60-min class) checked-in"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /dsmes/programs", payload: { name: "GBR Prog", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { gbr_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "GBR Cur", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { gbr_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "GBR-1", full_name: "Gus R", date_of_birth: "1975-06-06", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.0 }, as: ProgramCoordinator, captures: { gbr_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD GBR", npi: "1000000106", credential: "RD" }, as: ProgramCoordinator, captures: { gbr_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${gbr_prog}", patient_id: "${gbr_pat}", referring_provider_npi: "2000000106", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { gbr_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${gbr_ref}/assess", payload: { assessed_a1c: 8.0 }, as: Dietitian, as_user_id: "${gbr_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${gbr_ref}", curriculum_id: "${gbr_cur}" }, as: ProgramCoordinator, captures: { gbr_enr: "$.data.id" } }
            - { call: "POST /dsmes/enrollments/${gbr_enr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /dsmes/group-classes", payload: { curriculum_id: "${gbr_cur}", dietitian_id: "${gbr_die}", room_id: "ROOM-9", scheduled_start: "2026-05-24T13:00:00Z", scheduled_end: "2026-05-24T14:00:00Z", capacity: 5, topic: "Group Session" }, as: ProgramCoordinator, captures: { gbr_gc: "$.data.id", gbr_gcv1: "$.data.version" } }
            - { call: "POST /dsmes/group-classes/${gbr_gc}/sessions", payload: { enrollment_id: "${gbr_enr}", expected_group_class_version: "${gbr_gcv1}" }, as: Dietitian, as_user_id: "${gbr_die}", captures: { gbr_seat: "$.data.id" } }
            - { call: "POST /dsmes/sessions/${gbr_seat}/check-in", payload: {}, as: Dietitian, as_user_id: "${gbr_die}" }
          trigger:
            - { call: "POST /dsmes/sessions/${gbr_seat}/complete", payload: { actual_minutes: 60 }, as: Dietitian, as_user_id: "${gbr_die}", captures: { gbr_charge: "$.data.charge_cents", gbr_units: "$.data.billable_units" } }
          assert:
            - "Session.${gbr_seat}.billable_units == 2"
            - "Session.${gbr_seat}.charge_cents == 3000"

      - name: calc_enrollment_hours_dual_covered
        claim_type: Variant Divergence
        grounds:
          - "calculations.enrollment_hours_dual"
        excluded_because:
          difficulty_instance: dv_provisional_vs_final_benefit_hours
          rationale: "Provisional vs final hour divergence asserted by the named §1.8 dual-variant instance."

      - name: calc_a1c_outcome_dual_covered
        claim_type: Variant Divergence
        grounds:
          - "calculations.a1c_outcome_dual"
        excluded_because:
          difficulty_instance: dv_projected_vs_measured_a1c
          rationale: "Projected vs measured A1c divergence asserted by the named §1.8 dual-variant instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: val_program_not_accredited_on_activate
        claim_type: "Violation → Error"
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_PROGRAM_NOT_ACCREDITED]"
        distinguishing_aspect: "Activating an enrollment whose Program.accreditation_status is LAPSED returns ERR_PROGRAM_NOT_ACCREDITED (403)."
        test_recipe:
          setup: ["Program with accreditation_status LAPSED; ASSESSED referral; PENDING enrollment"]
          setup_api_calls:
            - { call: "POST /dsmes/programs", payload: { name: "NAC Prog", accreditation_body: "ADA", accreditation_status: "LAPSED" }, as: ProgramCoordinator, captures: { nac_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "NAC Cur", diabetes_type_focus: "TYPE_2", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { nac_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "NAC-1", full_name: "Nan C", date_of_birth: "1976-07-07", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.0 }, as: ProgramCoordinator, captures: { nac_pat: "$.data.id" } }
            - { call: "POST /dsmes/dietitians", payload: { full_name: "RD NAC", npi: "1000000107", credential: "RD" }, as: ProgramCoordinator, captures: { nac_die: "$.data.id" } }
            - { call: "POST /dsmes/referrals", payload: { program_id: "${nac_prog}", patient_id: "${nac_pat}", referring_provider_npi: "2000000107", referral_reason: "POOR_CONTROL" }, as: ProgramCoordinator, captures: { nac_ref: "$.data.id" } }
            - { call: "POST /dsmes/referrals/${nac_ref}/assess", payload: { assessed_a1c: 8.0 }, as: Dietitian, as_user_id: "${nac_die}" }
            - { call: "POST /dsmes/enrollments", payload: { referral_id: "${nac_ref}", curriculum_id: "${nac_cur}" }, as: ProgramCoordinator, captures: { nac_enr: "$.data.id" } }
          trigger:
            - { call: "POST /dsmes/enrollments/${nac_enr}/activate", payload: {}, as: ProgramCoordinator, captures: { nac_err: "$.data.error_id" } }
          assert:
            - "trigger response.data.error_id == ERR_PROGRAM_NOT_ACCREDITED"

      - name: val_curriculum_type_mismatch_on_enroll
        claim_type: "Cross-entity validation"
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_CURRICULUM_TYPE_MISMATCH]"
        distinguishing_aspect: "Creating an enrollment where curriculum focus TYPE_1 does not match patient diabetes_type TYPE_2 (and is not ANY) returns ERR_CURRICULUM_TYPE_MISMATCH (409)."
        test_recipe:
          setup: ["ASSESSED referral for TYPE_2 patient; TYPE_1-focused curriculum"]
          setup_api_calls:
            - { call: "POST /dsmes/programs", payload: { name: "CTM Prog", accreditation_body: "ADA" }, as: ProgramCoordinator, captures: { ctm_prog: "$.data.id" } }
            - { call: "POST /dsmes/curricula", payload: { name: "T1 Cur", diabetes_type_focus: "TYPE_1", required_hours: 10.0, module_count: 8 }, as: ProgramCoordinator, captures: { ctm_cur: "$.data.id" } }
            - { call: "POST /dsmes/patients", payload: { mrn: "CTM-1", full_name: "Cam M", date_of_birth: "1977-08-08", diabetes_type: "TYPE_2", payer: "MEDICARE", baseline_a1c: 8.0 }, as: ProgramCoordinator, captures: { ctm_pat: "$.data.id" } }
