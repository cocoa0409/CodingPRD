          assert:
            - "the transit interval is [2026-09-29T00:00:00Z, 2026-10-01T00:00:00Z) because TRANSIT_DAYS is 2, and its buffered end is 2026-10-02T00:00:00Z"
            - "the buffered interval overlaps the blackout interval [2026-09-30, 2026-10-06), so the ship is refused with error_id == ${err_i2} == \"ERR_TEMPERATURE_CHAIN_RISK\" and status 422"
            - "the identical interval would be accepted under the unbuffered_window variant because its end 2026-10-01 falls inside the blackout only after the buffer is applied"
            - "the priority-17 cadence rule tolerates the same adjacency: a 21-day window ending exactly at 2026-09-30 is accepted on this plan"
            - "the shipment stays PENDING and the site's cold_pack_committed_units stays 0"

