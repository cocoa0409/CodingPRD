            - "THE NOTICE WINDOW IS OCCUPIED: re-issuing a notice while ${dw_notice} is still ISSUED gives ${dw_e_window} == 'ERR_NOTICE_WINDOW_OPEN' at HTTP 409 — priority 12 passes because NOIC_ISSUED is an admissible stage for issuance, so the caller is told the precise reason rather than a generic stage error, and ${dw_notice_only} == ${dw_notice} with ${dw_notice_only_status} == 'ISSUED' and total_count == 1 (no second notice row, no re-snapshotted past_due_amount_cents, no restarted statutory clock)"
            - "TOO EARLY: on 2026-10-12 the power of attorney gives ${dw_e_early} == 'ERR_NOTICE_PERIOD_NOT_ELAPSED' at HTTP 422, because clock_date < 2026-10-22 — the statutory notice must run in full"
            - "on 2026-10-22, the same call succeeds: ${dw_requests} == 1, ${dw_gross} == 539650 == 502000 + 37650 (the pre-rebate gross), ${dw_rebate} == 37650 (r == 6 - 0 PAID, so round_half_up(37650 * 6 * 7 / 42), clamped by unpaid finance charge 37650) and ${dw_est} == 516164"
