# =============================================================================
# Task 1024 — Hydroponics & Indoor-Garden Store
# SCAFFOLD_DIFFICULTY_DESIGN.yaml  (§1.8 Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances.
# All literals below were computed against the §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_provisional_vs_final_on_tier_change
        grounds:
          - calculations.order_net_total
          - entities.Order.fields.provisional_total_cents
          - entities.Order.fields.final_total_cents
          - state_machines.Order.CONFIRMED_to_SHIPPED
        distinguishing_aspect: "On the Order domain: provisional_total_cents (540000, SILVER at placement) differs from final_total_cents (528000, GOLD at ship) because the discount_tier changed between the two evaluation moments."
        test_recipe:
          setup:
            - "Product priced 30000 cents, non-hazmat, ample stock."
            - "Commercial account, SILVER tier, credit_limit 10000000, ACTIVE."
            - "Commercial order for 20 units placed (subtotal 600000, provisional 540000)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku_code: "SYS-1", name: "Grow System", category: "SYSTEM", unit_price_cents: 30000 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-001", quantity_on_hand: 1000 }
              as: StoreAdmin
            - call: "POST /commercial-accounts"
              payload: { business_name: "Green Farms", credit_limit_cents: 10000000, discount_tier: "SILVER" }
              as: StoreAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /commercial-accounts/${acc_id}/activate"
              payload: {}
              as: StoreAdmin
              captures: { v_act: $.data.version }
            - call: "POST /commercial-accounts/${acc_id}/orders"
              payload: { lines: [ { product_id: "${p_id}", quantity: 20 } ], expected_commercial_account_version: "${v_act}" }
              as: CommercialBuyer
              as_user_id: "${acc_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /commercial-accounts/${acc_id}/set-tier"
              payload: { discount_tier: "GOLD" }
              as: StoreAdmin
            - call: "POST /orders/${order_id}/ship"
              payload: {}
              as: StoreAdmin
          assert:
            - "Order.${order_id}.provisional_total_cents == 540000"
            - "Order.${order_id}.final_total_cents == 528000"
            - "Order.${order_id}.total_cents == 528000"

      - name: consult_fee_estimate_vs_actual
        grounds:
          - calculations.consult_fee
          - entities.ConsultBooking.fields.estimated_fee_cents
          - entities.ConsultBooking.fields.actual_fee_cents
          - state_machines.ConsultBooking.CONFIRMED_to_COMPLETED
        distinguishing_aspect: "On the ConsultBooking domain: estimated_fee_cents (24000, 90 min ceiled up to 2 hours) differs from actual_fee_cents (15000, 75 min prorated) — a different entity domain from the Order dual-variant above."
        test_recipe:
          setup:
            - "Customer exists."
            - "Consultant with hourly_rate_cents 12000, buffer 30."
            - "Booking 14:00-15:30 (90 scheduled minutes), estimate 24000, then CONFIRMED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cust One" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /consultants"
              payload: { name: "Ada", specialty: "VERTICAL_FARM", hourly_rate_cents: 12000, buffer_minutes: 30 }
              as: StoreAdmin
              captures: { con_id: $.data.id }
            - call: "POST /consultants/${con_id}/bookings"
              payload: { customer_id: "${cust_id}", start_at: "2026-07-02T14:00:00Z", end_at: "2026-07-02T15:30:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /consult-bookings/${bk_id}/confirm"
              payload: {}
              as: Consultant
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /consult-bookings/${bk_id}/complete"
              payload: { actual_minutes: 75 }
              as: Consultant
              as_user_id: "${con_id}"
          assert:
            - "ConsultBooking.${bk_id}.estimated_fee_cents == 24000"
            - "ConsultBooking.${bk_id}.actual_fee_cents == 15000"
            - "ConsultBooking.${bk_id}.status == COMPLETED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: commercial_pricing_nested_min_max_with_hazmat_cap
        grounds:
          - calculations.order_net_total
          - entities.Order.fields.discount_cents
          - entities.Order.fields.hazmat_surcharge_cents
        distinguishing_aspect: "Mode (a): >=3 interacting inputs (subtotal 625000, GOLD+volume rate clamped by MAX_DISCOUNT_RATE to 0.12 -> discount 75000, hazmat 21500 clamped by HAZMAT_CAP to 5000) give net 555000 through two independent min-clamps."
        test_recipe:
          setup:
            - "Hazmat product 25000 cents, unit_weight_g 4000, ample stock."
            - "Commercial account GOLD, credit_limit 10000000, ACTIVE."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku_code: "NUT-9", name: "Bloom Nutrient", category: "NUTRIENT", unit_price_cents: 25000, is_hazmat: true, unit_weight_g: 4000 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-001", quantity_on_hand: 1000 }
              as: StoreAdmin
            - call: "POST /commercial-accounts"
              payload: { business_name: "Vert Co", credit_limit_cents: 10000000, discount_tier: "GOLD" }
              as: StoreAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /commercial-accounts/${acc_id}/activate"
              payload: {}
              as: StoreAdmin
              captures: { v_act: $.data.version }
          trigger:
            - call: "POST /commercial-accounts/${acc_id}/orders"
              payload: { lines: [ { product_id: "${p_id}", quantity: 25 } ], expected_commercial_account_version: "${v_act}" }
              as: CommercialBuyer
              as_user_id: "${acc_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.subtotal_cents == 625000"
            - "Order.${order_id}.discount_cents == 75000"
            - "Order.${order_id}.hazmat_surcharge_cents == 5000"
            - "Order.${order_id}.provisional_total_cents == 555000"

      - name: loyalty_points_floor_per_line_then_sum
        grounds:
          - calculations.loyalty_points_accrual
          - entities.Customer.fields.loyalty_points
          - state_machines.Order.UNPAID_to_PAID
        distinguishing_aspect: "Mode (b): floor is applied per line (floor(47.97)=47, floor(17.98)=17 -> 64) instead of floor of the summed total (floor(65.95)=65); the pinned rounding order changes the metric loyalty_points by 1."
        test_recipe:
          setup:
            - "Customer (BRONZE, multiplier 1.0)."
            - "Product A 1599 cents, Product B 899 cents, both stocked."
            - "Retail order lines A x3 (4797) + B x2 (1798), still DRAFT/UNPAID."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "loy@x.com", full_name: "Loyal" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "A-1", name: "Clay Pebbles", category: "CONSUMABLE", unit_price_cents: 1599 }
              as: StoreAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /products/${pa_id}/inventory-lots"
              payload: { lot_code: "LA", quantity_on_hand: 100 }
              as: StoreAdmin
            - call: "POST /products"
              payload: { sku_code: "B-1", name: "pH Buffer", category: "CONSUMABLE", unit_price_cents: 899 }
              as: StoreAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /products/${pb_id}/inventory-lots"
              payload: { lot_code: "LB", quantity_on_hand: 100 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${pa_id}", quantity: 3 }, { product_id: "${pb_id}", quantity: 2 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Customer.${cust_id}.loyalty_points == 64"
            - "Order.${order_id}.payment_status == PAID"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rma_review_info_cycle
        grounds:
          - state_machines.RMA.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.RMA.INFO_REQUESTED_to_UNDER_REVIEW
          - entities.RMA.fields.status
        distinguishing_aspect: "On the RMA entity: status re-enters UNDER_REVIEW from INFO_REQUESTED (a cycle), unreachable by any linear pipeline."
        test_recipe:
          setup:
            - "Customer, non-hazmat product warranty 12, stock, shipped retail order of that product."
            - "RMA submitted, moved to UNDER_REVIEW then INFO_REQUESTED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rma@x.com", full_name: "R Ma" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "LGT-1", name: "LED Panel", category: "LIGHTING", unit_price_cents: 10000, warranty_months: 12 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 50 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/ship"
              payload: {}
              as: StoreAdmin
            - call: "POST /rmas"
              payload: { order_id: "${order_id}", product_id: "${p_id}", return_quantity: 1, reason: "defective" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rma_id: $.data.id }
            - call: "POST /rmas/${rma_id}/review"
              payload: {}
              as: StoreAdmin
            - call: "POST /rmas/${rma_id}/request-info"
              payload: { note: "serial?" }
              as: StoreAdmin
          trigger:
            - call: "POST /rmas/${rma_id}/provide-info"
              payload: { note: "serial 123" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "RMA.${rma_id}.status == UNDER_REVIEW"

      - name: order_payment_and_fulfillment_axes_independent
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.DRAFT_to_CONFIRMED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "On the Order entity: payment_status advances to PAID while fulfillment_status is still DRAFT, then fulfillment advances to CONFIRMED while payment stays PAID — two parallel dimensions on the same row."
        test_recipe:
          setup:
            - "Customer, product with stock, a DRAFT/UNPAID retail order."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "par@x.com", full_name: "Par Allel" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "SYS-2", name: "DWC Kit", category: "SYSTEM", unit_price_cents: 8000 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 50 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 2 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Order.${order_id}.payment_status == PAID"
            - "Order.${order_id}.fulfillment_status == CONFIRMED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: confirm_reserves_lot_depletes_flips_reorder
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - calculations.inventory_reservation
          - entities.InventoryLot.fields.status
          - entities.Product.fields.reorder_flag
        distinguishing_aspect: "Depth-3 chain from order confirm: reservation debits lot L1 (link1) -> L1.quantity_available hits 0 so L1->DEPLETED (link2, caused by the debit) -> product recomputes total_available_units to 8 < threshold 10 so reorder_flag flips true (link3, caused by the depletion)."
        test_recipe:
          setup:
            - "Product reorder_threshold 10, two lots L1(on_hand 5, code A-001) and L2(on_hand 8, code A-002); total_available 13, reorder_flag false."
            - "Customer, retail order for 5 units, DRAFT."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cas@x.com", full_name: "Cas Cade" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "SYS-3", name: "NFT Channel", category: "SYSTEM", unit_price_cents: 4000, reorder_threshold: 10 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "A-001", quantity_on_hand: 5 }
              as: StoreAdmin
              captures: { lot1_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "A-002", quantity_on_hand: 8 }
              as: StoreAdmin
              captures: { lot2_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 5 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "InventoryLot.${lot1_id}.quantity_available == 0"
            - "InventoryLot.${lot1_id}.status == DEPLETED"
            - "Product.${p_id}.total_available_units == 8"
            - "Product.${p_id}.reorder_flag == true"

      - name: rma_approve_restock_clears_reorder
        grounds:
          - state_machines.RMA.UNDER_REVIEW_to_APPROVED
          - calculations.rma_refund
          - entities.Product.fields.total_available_units
          - entities.Product.fields.reorder_flag
        distinguishing_aspect: "Depth-2 chain from RMA approve (a different trigger than order confirm): approve creates a restock lot of 3 units (link1) -> product recomputes total_available_units to 5 >= threshold 4 so reorder_flag flips false (link2, caused by the restock)."
        test_recipe:
          setup:
            - "Product reorder_threshold 4, warranty 12; lot on_hand 5; customer; retail order of 3 units confirmed then shipped (on_hand 2, available 2, reorder_flag true)."
            - "RMA for 3 units submitted and moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "res@x.com", full_name: "Re Stock" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "LGT-2", name: "Bar Light", category: "LIGHTING", unit_price_cents: 10000, warranty_months: 12, reorder_threshold: 4 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 5 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 3 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/ship"
              payload: {}
              as: StoreAdmin
            - call: "POST /rmas"
              payload: { order_id: "${order_id}", product_id: "${p_id}", return_quantity: 3, reason: "wrong spectrum" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rma_id: $.data.id }
            - call: "POST /rmas/${rma_id}/review"
              payload: {}
              as: StoreAdmin
          trigger:
            - call: "POST /rmas/${rma_id}/approve"
              payload: {}
              as: StoreAdmin
          assert:
            - "RMA.${rma_id}.status == APPROVED"
            - "RMA.${rma_id}.within_warranty == true"
            - "Product.${p_id}.total_available_units == 5"
            - "Product.${p_id}.reorder_flag == false"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_account_hold_beats_fiscal_credit_over_limit
        grounds:
          - "validations[priority=31]"
          - "validations[priority=60]"
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: "state (ERR_ACCOUNT_NOT_ACTIVE, priority 31) outranks business_fiscal (ERR_CREDIT_LIMIT_EXCEEDED, priority 60): an ON_HOLD account whose next order would also exceed credit returns the state error."
        test_recipe:
          setup:
            - "Commercial account credit_limit 120000, STANDARD, activated; order for 120000 placed so credit_used == limit; account then placed ON_HOLD."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku_code: "SYS-4", name: "Ebb Table", category: "SYSTEM", unit_price_cents: 40000 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 100 }
              as: StoreAdmin
            - call: "POST /commercial-accounts"
              payload: { business_name: "Hold Co", credit_limit_cents: 120000, discount_tier: "STANDARD" }
              as: StoreAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /commercial-accounts/${acc_id}/activate"
              payload: {}
              as: StoreAdmin
              captures: { v_act: $.data.version }
            - call: "POST /commercial-accounts/${acc_id}/orders"
              payload: { lines: [ { product_id: "${p_id}", quantity: 3 } ], expected_commercial_account_version: "${v_act}" }
              as: CommercialBuyer
              as_user_id: "${acc_id}"
            - call: "POST /commercial-accounts/${acc_id}/hold"
              payload: {}
              as: StoreAdmin
              captures: { v_hold: $.data.version }
          trigger:
            - call: "POST /commercial-accounts/${acc_id}/orders"
              payload: { lines: [ { product_id: "${p_id}", quantity: 3 } ], expected_commercial_account_version: "${v_hold}" }
              as: CommercialBuyer
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACCOUNT_NOT_ACTIVE"

      - name: safety_hazmat_beats_referential_not_in_order
        grounds:
          - "validations[priority=40]"
          - "validations[priority=50]"
          - errors[ERR_HAZMAT_NOT_RETURNABLE]
          - errors[ERR_PRODUCT_NOT_IN_ORDER]
        distinguishing_aspect: "business_safety (ERR_HAZMAT_NOT_RETURNABLE, priority 40) outranks business_referential (ERR_PRODUCT_NOT_IN_ORDER, priority 50): an RMA naming a hazmat product that is also not on the referenced order returns the safety error — a different category pair than the state/fiscal conflict above."
        test_recipe:
          setup:
            - "Customer; non-hazmat product P shipped in a retail order; separate hazmat product H not on that order."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "haz@x.com", full_name: "Haz Ard" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "ACC-1", name: "Net Pot", category: "ACCESSORY", unit_price_cents: 500 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 100 }
              as: StoreAdmin
            - call: "POST /products"
              payload: { sku_code: "NUT-H", name: "Cal-Mag Acid", category: "NUTRIENT", unit_price_cents: 3000, is_hazmat: true }
              as: StoreAdmin
              captures: { h_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/ship"
              payload: {}
              as: StoreAdmin
          trigger:
            - call: "POST /rmas"
              payload: { order_id: "${order_id}", product_id: "${h_id}", return_quantity: 1, reason: "leak" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_HAZMAT_NOT_RETURNABLE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: commercial_credit_boundary_at_and_above_limit
        grounds:
          - "validations[priority=60]"
          - entities.CommercialAccount.fields.credit_used_cents
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: "On the credit metric via POST /commercial-accounts/{id}/orders: an order bringing credit_used exactly to credit_limit (1000000) is accepted (CONFIRMED); the next order for any positive amount is rejected — the check is strict >."
        test_recipe:
          setup:
            - "Commercial account credit_limit 1000000, STANDARD, activated; one order for 600000 already placed (credit_used 600000)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku_code: "SYS-5", name: "Vertical Rack", category: "SYSTEM", unit_price_cents: 40000 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 1000 }
              as: StoreAdmin
            - call: "POST /commercial-accounts"
              payload: { business_name: "Edge Co", credit_limit_cents: 1000000, discount_tier: "STANDARD" }
              as: StoreAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /commercial-accounts/${acc_id}/activate"
              payload: {}
              as: StoreAdmin
              captures: { v_act: $.data.version }
            - call: "POST /commercial-accounts/${acc_id}/orders"
              payload: { lines: [ { product_id: "${p_id}", quantity: 15 } ], expected_commercial_account_version: "${v_act}" }
              as: CommercialBuyer
              as_user_id: "${acc_id}"
            - call: "GET /commercial-accounts/${acc_id}"
              payload: {}
              as: StoreAdmin
              captures: { v_a: $.data.version }
          trigger:
            - call: "POST /commercial-accounts/${acc_id}/orders"
              payload: { lines: [ { product_id: "${p_id}", quantity: 10 } ], expected_commercial_account_version: "${v_a}" }
              as: CommercialBuyer
              as_user_id: "${acc_id}"
              captures: { ob_status: $.data.fulfillment_status }
            - call: "GET /commercial-accounts/${acc_id}"
              payload: {}
              as: StoreAdmin
              captures: { v_b: $.data.version }
            - call: "POST /commercial-accounts/${acc_id}/orders"
              payload: { lines: [ { product_id: "${p_id}", quantity: 1 } ], expected_commercial_account_version: "${v_b}" }
              as: CommercialBuyer
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Order (order B) fulfillment_status == CONFIRMED"
            - "CommercialAccount.${acc_id}.credit_used_cents == 1000000"
            - "order C response error_id == ERR_CREDIT_LIMIT_EXCEEDED"

      - name: workshop_seats_boundary_waitlist_at_capacity
        grounds:
          - entities.WorkshopSession.fields.seats_taken
          - entities.WorkshopRegistration.fields.status
          - state_machines.WorkshopRegistration.initial_state
        distinguishing_aspect: "On the seat-count metric via POST /workshop-sessions/{id}/registrations: with capacity 2, the 3rd registration lands WAITLISTED because seats_taken (2) >= capacity (2) — a different metric and endpoint than the credit boundary."
        test_recipe:
          setup:
            - "Room seat_capacity 20; session capacity 2, OPEN; three customers; two REGISTERED (seats_taken 2)."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Studio A", seat_capacity: 20 }
              as: StoreAdmin
              captures: { room_id: $.data.id }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Intro to Hydro", start_at: "2026-07-10T18:00:00Z", end_at: "2026-07-10T20:00:00Z", capacity: 2 }
              as: StoreAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /workshop-sessions/${sess_id}/open"
              payload: {}
              as: StoreAdmin
            - call: "POST /customers"
              payload: { email: "w1@x.com", full_name: "W One" }
              as: StoreAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "w2@x.com", full_name: "W Two" }
              as: StoreAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "w3@x.com", full_name: "W Three" }
              as: StoreAdmin
              captures: { c3_id: $.data.id }
            - call: "POST /workshop-sessions/${sess_id}/registrations"
              payload: { customer_id: "${c1_id}" }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { r1_status: $.data.status }
            - call: "POST /workshop-sessions/${sess_id}/registrations"
              payload: { customer_id: "${c2_id}" }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { r2_status: $.data.status }
          trigger:
            - call: "POST /workshop-sessions/${sess_id}/registrations"
              payload: { customer_id: "${c3_id}" }
              as: Customer
              as_user_id: "${c3_id}"
              captures: { r3_status: $.data.status }
          assert:
            - "registration 1 status == REGISTERED"
            - "registration 2 status == REGISTERED"
            - "registration 3 status == WAITLISTED"
            - "WorkshopSession.${sess_id}.seats_taken == 2"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: registration_requires_session_open
        grounds:
          - "validations[priority=32]"
          - entities.WorkshopSession.fields.status
          - errors[ERR_SESSION_NOT_OPEN]
        distinguishing_aspect: "WorkshopRegistration creation depends on WorkshopSession.status == OPEN: registering into a SCHEDULED (not-yet-opened) session is rejected with ERR_SESSION_NOT_OPEN (entity pair Registration->Session)."
        test_recipe:
          setup:
            - "Room; session SCHEDULED (never opened); customer."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Studio B", seat_capacity: 10 }
              as: StoreAdmin
              captures: { room_id: $.data.id }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Aquaponics 101", start_at: "2026-07-11T18:00:00Z", end_at: "2026-07-11T20:00:00Z", capacity: 5 }
              as: StoreAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "cx@x.com", full_name: "C X" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /workshop-sessions/${sess_id}/registrations"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SESSION_NOT_OPEN"

      - name: commercial_order_requires_account_active
        grounds:
          - "validations[priority=31]"
          - entities.CommercialAccount.fields.status
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        distinguishing_aspect: "Order placement depends on CommercialAccount.status == ACTIVE: placing against a PENDING (never-activated) account is rejected with ERR_ACCOUNT_NOT_ACTIVE (entity pair Order->CommercialAccount, a different pair than Registration->Session)."
        test_recipe:
          setup:
            - "Commercial account left PENDING; product with stock."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku_code: "SYS-6", name: "Cloner", category: "SYSTEM", unit_price_cents: 6000 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 100 }
              as: StoreAdmin
            - call: "POST /commercial-accounts"
              payload: { business_name: "Pend Co", credit_limit_cents: 500000 }
              as: StoreAdmin
              captures: { acc_id: $.data.id, v_create: $.data.version }
          trigger:
            - call: "POST /commercial-accounts/${acc_id}/orders"
              payload: { lines: [ { product_id: "${p_id}", quantity: 1 } ], expected_commercial_account_version: "${v_create}" }
              as: CommercialBuyer
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACCOUNT_NOT_ACTIVE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: consultant_buffer_gap_rejected_exact_buffer_allowed
        grounds:
          - "validations[priority=45]"
          - entities.Consultant.fields.buffer_minutes
          - errors[ERR_CONSULTANT_UNAVAILABLE]
        distinguishing_aspect: "Consultant interval semantics use buffer_minutes: with an existing [10:00,11:00) booking and buffer 30, a new [11:15,12:00) booking (gap 15 < 30) is rejected while [11:30,12:00) (gap exactly 30) is accepted — buffer-expanded intervals, on the Consultant resource."
        test_recipe:
          setup:
            - "Customer; consultant buffer 30; existing REQUESTED booking 10:00-11:00."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cb@x.com", full_name: "C B" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /consultants"
              payload: { name: "Ben", specialty: "AQUAPONICS", hourly_rate_cents: 10000, buffer_minutes: 30 }
              as: StoreAdmin
              captures: { con_id: $.data.id }
            - call: "POST /consultants/${con_id}/bookings"
              payload: { customer_id: "${cust_id}", start_at: "2026-07-02T10:00:00Z", end_at: "2026-07-02T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /consultants/${con_id}/bookings"
              payload: { customer_id: "${cust_id}", start_at: "2026-07-02T11:15:00Z", end_at: "2026-07-02T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
            - call: "POST /consultants/${con_id}/bookings"
              payload: { customer_id: "${cust_id}", start_at: "2026-07-02T11:30:00Z", end_at: "2026-07-02T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ok_status: $.data.status }
          assert:
            - "first new booking response error_id == ERR_CONSULTANT_UNAVAILABLE"
            - "second new booking status == REQUESTED"

      - name: room_halfopen_overlap_adjacency_allowed
        grounds:
          - "validations[priority=46]"
          - entities.WorkshopSession.fields.room_id
          - errors[ERR_ROOM_DOUBLE_BOOKED]
        distinguishing_aspect: "Room interval semantics are pure half-open [start,end) with no buffer: with an existing [09:00,12:00) session, a [12:00,14:00) session (adjacent, end==start) is accepted while a [11:00,13:00) session (true overlap) is rejected — different interval arithmetic than the Consultant buffer, on the Room resource."
        test_recipe:
          setup:
            - "Room seat_capacity 20; existing SCHEDULED session 09:00-12:00."
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Studio C", seat_capacity: 20 }
              as: StoreAdmin
              captures: { room_id: $.data.id }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Morning", start_at: "2026-07-12T09:00:00Z", end_at: "2026-07-12T12:00:00Z", capacity: 10 }
              as: StoreAdmin
          trigger:
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Adjacent", start_at: "2026-07-12T12:00:00Z", end_at: "2026-07-12T14:00:00Z", capacity: 10 }
              as: StoreAdmin
              captures: { adj_status: $.data.status }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Overlap", start_at: "2026-07-12T11:00:00Z", end_at: "2026-07-12T13:00:00Z", capacity: 10 }
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "adjacent session status == SCHEDULED"
            - "overlapping session response error_id == ERR_ROOM_DOUBLE_BOOKED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reserve_then_cancel_conserves_on_hand
        grounds:
          - state_machines.Order.DRAFT_to_CONFIRMED
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - calculations.inventory_reservation
          - entities.InventoryLot.fields.quantity_on_hand
        distinguishing_aspect: "Conserved quantity = physical units: after confirm (reserve 5) then cancel (release), InventoryLot.quantity_on_hand is unchanged at 5 and quantity_reserved returns to 0 (quantity_available back to 5); the lot un-depletes to ACTIVE."
        test_recipe:
          setup:
            - "Product reorder_threshold 10; single lot on_hand 5; customer; retail order of 5 units, DRAFT."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "inv@x.com", full_name: "In Var" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "SYS-7", name: "Bucket Kit", category: "SYSTEM", unit_price_cents: 3000, reorder_threshold: 10 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 5 }
              as: StoreAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 5 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "InventoryLot.${lot_id}.quantity_on_hand == 5"
            - "InventoryLot.${lot_id}.quantity_reserved == 0"
            - "InventoryLot.${lot_id}.quantity_available == 5"
            - "InventoryLot.${lot_id}.status == ACTIVE"
            - "Product.${p_id}.total_available_units == 5"

      - name: place_then_cancel_conserves_commercial_credit
        grounds:
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - calculations.commercial_credit_used
          - entities.CommercialAccount.fields.credit_used_cents
        distinguishing_aspect: "Conserved quantity = monetary credit (distinct from physical units): placing a commercial order draws credit_used to 200000, and cancelling it returns credit_used to 0."
        test_recipe:
          setup:
            - "Commercial account credit_limit 1000000, STANDARD, activated; product 20000 with stock; a commercial order for 10 units (net 200000) placed and CONFIRMED."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku_code: "SYS-8", name: "Res Tank", category: "SYSTEM", unit_price_cents: 20000 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 100 }
              as: StoreAdmin
            - call: "POST /commercial-accounts"
              payload: { business_name: "Cons Co", credit_limit_cents: 1000000, discount_tier: "STANDARD" }
              as: StoreAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /commercial-accounts/${acc_id}/activate"
              payload: {}
              as: StoreAdmin
              captures: { v_act: $.data.version }
            - call: "POST /commercial-accounts/${acc_id}/orders"
              payload: { lines: [ { product_id: "${p_id}", quantity: 10 } ], expected_commercial_account_version: "${v_act}" }
              as: CommercialBuyer
              as_user_id: "${acc_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: StoreAdmin
          assert:
            - "Order.${order_id}.fulfillment_status == CANCELLED"
            - "CommercialAccount.${acc_id}.credit_used_cents == 0"
