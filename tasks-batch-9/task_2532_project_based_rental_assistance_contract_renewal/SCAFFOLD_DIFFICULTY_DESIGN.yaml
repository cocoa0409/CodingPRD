      - name: finalize_opt_out_notice_period_outranks_the_unresolved_voucher_check
        grounds:
          - validations[priority=57]
          - validations[priority=65]
          - errors[ERR_OPT_OUT_NOTICE_PERIOD_INCOMPLETE]
          - errors[ERR_TENANT_VOUCHER_UNRESOLVED]
          - state_machines.RenewalCase.OPT_OUT_NOTICED_to_OPT_OUT_FINALIZED
          - calculations.assisted_unit_conservation
        distinguishing_aspect: |
          One finalize-opt-out call violates a `business_temporal` rule at priority 57 (clock
          2026-12-01 is before the one-year notice effective_date 2027-12-31) and a
          `business_referential` rule at priority 65 (two households still OPT_OUT_NOTICED with
          only PENDING vouchers); the response is ERR_OPT_OUT_NOTICE_PERIOD_INCOMPLETE, and
          advancing the clock alone flips the same call to ERR_TENANT_VOUCHER_UNRESOLVED. Error
          category pair is business_temporal vs business_referential — disjoint from the
          state/business_fiscal pair of the approve-rents instance.
