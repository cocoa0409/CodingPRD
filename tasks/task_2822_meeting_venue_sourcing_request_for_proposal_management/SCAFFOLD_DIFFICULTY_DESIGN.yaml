        - The venue's Proposal submitted with the 249.00 NET / 600-night / 145000.00 F&B grid and evaluated once on CONTRACTED_BASIS, so it is UNDER_REVIEW with total_cost_contracted_usd 447844.84.
        - The event awarded, both ApprovalSteps APPROVED, planner-signed and venue-countersigned, so the Contract is EXECUTED with contracted_total_usd 432170.27, contracted_room_revenue_usd 146163.00, contracted_paid_room_nights 587 and rebooking_credit_pct 0.60; Venue.blocked_room_nights is 587 and MeetingEvent.committed_spend_usd is 432170.27.
        - The deposit schedule generated (deposit_total_usd 129651.08 across 44081.37 / 42784.86 / 42784.85).
        - The clock moved to 2026-09-16T10:00:00.000Z and installment 1 paid in full at 44081.37, so deposit_paid_usd is 44081.37 and deposit_outstanding_usd is 85569.71.
        - The clock then moved to 2026-10-15T00:00:00.000Z - exactly 151 days before the 2027-03-15 arrival, inside the 91-day tier of the quoted cancellation schedule.
        setup_api_calls:
        - call: POST /_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00.000Z'}
          as: ProgramAdmin
        - call: POST /sourcing/rate-benchmarks
          payload: {destination_tier: TIER_1, program_type: USER_CONFERENCE, benchmark_adr_usd: 260.0, benchmark_service_charge_pct: 0.24, benchmark_tax_pct: 0.156}
          as: ProgramAdmin
          captures: {bm_t1_id: $.data.id}
        - call: POST /sourcing/venues
          payload: {name: Harborline Grand, city: Lisbon, country: PT, destination_tier: TIER_1, guest_rooms_total: 420, largest_space_sqft: 14000, preferred_supplier_status: PREFERRED}
