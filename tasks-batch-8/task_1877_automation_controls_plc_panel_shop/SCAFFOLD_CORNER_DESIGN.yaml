  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: jobs_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /jobs?limit=2&offset=1 over 3 jobs returns exactly 2 rows, total_count == 3, has_more == false for offset 1 + limit 2 (covers the last page exactly) — pagination fields come from the fixed envelope."
        test_recipe:
          setup: ["one customer with exactly 3 jobs"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Page Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_pg: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_pg}", job_number: "J-PG1", quoted_price_cents: 100 }
              as: ProjectManager
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_pg}", job_number: "J-PG2", quoted_price_cents: 100 }
              as: ProjectManager
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_pg}", job_number: "J-PG3", quoted_price_cents: 100 }
              as: ProjectManager
          trigger:
            - call: "GET /panel-shop/jobs"
              payload: { customer_id: "${c_pg}", limit: 2, offset: 1 }
              as: ProjectManager
          assert:
            - "response_type == array and data has exactly 2 items"
            - "meta-envelope pagination reports total_count == 3 and has_more == false (offset 1 + limit 2 covers the remainder)"

      - name: jobs_list_filter_by_status
