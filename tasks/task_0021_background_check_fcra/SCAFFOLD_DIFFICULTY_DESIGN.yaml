            - "crim_final_status == 'RESOLVED'"

      - name: adverse_action_finalized_count_unchanged_after_dispute_flip_pass
        grounds:
          - state_machines.AdverseAction.PRE_ADVERSE_SENT_to_CANCELLED
          - state_machines.Verification.DISPUTED_to_RESOLVED
          - calculations.compute_overall_result.variants.post_dispute_recompute
        distinguishing_aspect: |
          Conserved quantity (per application_id): count of AdverseAction rows with
          status==FINALIZED, formally `count(aa where aa.order_id IN
          orders_of(application_id) AND aa.status == FINALIZED)`. Forward action
          (REPORT FAIL on third verification → auto-create PRE_ADVERSE_SENT) does
          NOT increment this count (creation is PRE_ADVERSE_SENT, not FINALIZED).
