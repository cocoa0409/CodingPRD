  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: session_buffer_overlap_semantics
        grounds:
          - calculations.session_overlap_check
          - errors[ERR_SCHEDULING_CONFLICT]
        distinguishing_aspect: |
          Resource = the assigned consultant's calendar; semantics = half-open
          intervals with a mandatory 15-minute buffer and strict-< comparison.
          An 11:10 start (10-minute gap) conflicts with a 10:00-11:00 SCHEDULED
          session; an 11:15 start (gap exactly 15 minutes) is allowed.
        test_recipe:
          setup:
            - "Case ACTIVE_SUPPORT; STANDARD package ACTIVE [2026-08-01, 2026-08-28] with 3 calls"
            - "Session S1 SCHEDULED 2026-08-10T10:00:00Z-11:00:00Z on the case's consultant"
          setup_api_calls:
            - call: "POST /sleep-consulting/consultants"
