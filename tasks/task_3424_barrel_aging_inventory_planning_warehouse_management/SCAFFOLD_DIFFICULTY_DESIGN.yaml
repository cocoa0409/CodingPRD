              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
              captures: { slot_a: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 0 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels/${b_id}/dump"
              as: WarehouseManager
            - call: "POST /barrel-aging/bonded-reports"
              payload: { period_start: "2028-08-01T00:00:00Z", period_end: "2028-12-01T00:00:00Z" }
              as: BondedPreparer
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/bonded-reports/${rep_id}/reconcile"
              as: BondedPreparer
          trigger:
            - call: "POST /barrel-aging/barrels/${b_id}/withdraw"
              as: WarehouseManager
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_COVERING_REPORT_NOT_FILED (the covering report is RECONCILED, not in {FILED, ACCEPTED})"
            - "Barrel.${b_id}.custody_status == BONDED (unchanged)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: slot_occupancy_half_open_overlap_and_adjacency
        grounds:
          - errors[ERR_SLOT_OCCUPANCY_OVERLAP]
          - "state_machines.SlotOccupancy"
          - entities.SlotOccupancy.fields.end_at
        distinguishing_aspect: |
          Resource WarehouseSlot, half-open interval semantics: a second barrel into an
          occupied slot is rejected, but once the first barrel's occupancy CLOSES at
          2028-10-01, a new occupancy starting AT 2028-10-01 is adjacency ([start, end)
          touch, zero overlap) and MUST be accepted.
        test_recipe:
          setup:
            - "Rickhouse 1x1x2 commissioned; barrel B1 filled into slot 1 at 2028-09-01 (occupancy [2028-09-01, open))."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-OV", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 2, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/approve"
              as: OperationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/commission"
              as: OperationsDirector
            - call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}"
              as: PlatformAdmin
              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
              captures: { s1: "$.data[0].id", s2: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s1}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 100.0, min_maturation_months: 12 }
              as: WarehouseManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s1}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "RYE", fill_proof: 110.0, fill_volume_liters: 90.0, min_maturation_months: 12 }
              as: WarehouseManager
              captures: { err_overlap: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels/${b1}/rotations"
              payload: { to_slot_id: "${s2}", expected_barrel_version: "${b1_v}" }
              as: WarehouseManager
          trigger:
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s1}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "RYE", fill_proof: 110.0, fill_volume_liters: 90.0, min_maturation_months: 12 }
              as: WarehouseManager
              captures: { b2: $.data.id }
          assert:
            - "err_overlap == ERR_SLOT_OCCUPANCY_OVERLAP (second fill into the occupied slot rejected)"
            - "after rotation, slot ${s1} accepts the new barrel: adjacency allowed because occupancy [2028-09-01, 2028-10-01) does not overlap [2028-10-01, open)"
            - "Barrel.${b2} created (201) with maturation_status AGING"
            - "slot ${s1} now has 2 occupancies: one CLOSED with end_at 2028-10-01, one OPEN with start_at 2028-10-01"

      - name: quality_sample_thirty_day_buffer
        grounds:
          - errors[ERR_SAMPLE_BUFFER_VIOLATION]
          - entities.BarrelAssessment.fields.kind
          - entities.BarrelAssessment.fields.assessed_at
        distinguishing_aspect: |
          Resource Barrel, BUFFER semantics rather than half-open adjacency: two
          QUALITY_SAMPLEs on the same barrel must be at least 30 days apart; 20 days is
          rejected while exactly 30 days passes (>= boundary). Different interval
          treatment and different resource entity than the slot-occupancy instance.
        test_recipe:
          setup:
            - "Rickhouse 1x1x1 commissioned; barrel filled 2028-09-01 with 200.0 L."
            - "First QUALITY_SAMPLE (draw 1.0) recorded at 2029-03-01; ledger now 199.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-SB", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/approve"
              as: OperationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/commission"
              as: OperationsDirector
            - call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}"
              as: PlatformAdmin
              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
              captures: { slot_a: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels/${b_id}/assessments"
              payload: { kind: "QUALITY_SAMPLE", sample_draw_liters: 1.0, quality_score: 90 }
              as: WarehouseManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-03-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels/${b_id}/assessments"
              payload: { kind: "QUALITY_SAMPLE", sample_draw_liters: 1.0, quality_score: 91 }
              as: WarehouseManager
              captures: { err_buf: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-03-31T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /barrel-aging/barrels/${b_id}/assessments"
              payload: { kind: "QUALITY_SAMPLE", sample_draw_liters: 1.0, quality_score: 92 }
              as: WarehouseManager
          assert:
            - "err_buf == ERR_SAMPLE_BUFFER_VIOLATION (20 days < 30-day buffer)"
            - "the sample at exactly 30 days (2029-03-31) succeeds (inclusive >= boundary)"
            - "Barrel.${b_id}.current_volume_ledger_liters == 198.00 after the two successful 1.0 L draws"

  - rule_id: compensating_invariant
    instances:
      - name: rotation_round_trip_conserves_bonded_volume
        grounds:
          - calculations.barrel_volume_ledger
          - "state_machines.SlotOccupancy.OPEN_to_CLOSED"
          - entities.Barrel.fields.current_volume_ledger_liters
        distinguishing_aspect: |
          Conserved quantity: total bonded ledger volume (sum of
          current_volume_ledger_liters over custody == BONDED barrels). Forward action
          rotate slot1 -> slot3 paired with its compensating rotate slot3 -> slot1 leaves
          the quantity EXACTLY unchanged (350.00), and the barrel ends back on its
          original slot with three occupancy records.
        test_recipe:
          setup:
            - "Rickhouse 1x1x3 commissioned; barrel A filled 2028-09-01 into slot 1 with 200.0 L; barrel B into slot 2 with 150.0 L. Total bonded ledger volume = 350.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-RC", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 3, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/approve"
              as: OperationsDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/expansion-projects/${proj_id}/commission"
              as: OperationsDirector
            - call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}"
              as: PlatformAdmin
              captures: { rh_id: "$.data[0].id" }
            - call: "GET /barrel-aging/rickhouses/${rh_id}/slots"
              as: PlatformAdmin
              captures: { s1: "$.data[0].id", s2: "$.data[1].id", s3: "$.data[2].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s1}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_a: $.data.id, a_v1: $.data.version }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s2}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 150.0, min_maturation_months: 48 }
              as: WarehouseManager
              captures: { b_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /barrel-aging/barrels/${b_a}/rotations"
              payload: { to_slot_id: "${s3}", expected_barrel_version: "${a_v1}" }
              as: WarehouseManager
              captures: { a_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-11-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /barrel-aging/barrels/${b_a}/rotations"
              payload: { to_slot_id: "${s1}", expected_barrel_version: "${a_v2}" }
              as: WarehouseManager
            - call: "GET /barrel-aging/barrels/${b_a}/occupancies"
              as: WarehouseManager
          assert:
            - "Barrel.${b_a}.current_volume_ledger_liters == 200.00 and Barrel.${b_b}.current_volume_ledger_liters == 150.00 (rotation moves no liquid)"
            - "total bonded ledger volume == 350.00 before and after the rotate/rotate-back pair (invariant)"
            - "Barrel.${b_a} has 3 SlotOccupancy records: slot1 CLOSED [2028-09-01, 2028-10-01), slot3 CLOSED [2028-10-01, 2028-11-01), slot1 OPEN from 2028-11-01"
            - "Rickhouse.${rh_id}.occupied_slots == 2 and posture == OPERATING throughout"

      - name: reservation_create_release_conserves_available_slots
        grounds:
          - calculations.program_available_slots
          - "state_machines.BarrelReservation.ACTIVE_to_RELEASED"
          - entities.PrivateSelectionProgram.fields.available_slots
        distinguishing_aspect: |
          Conserved quantity: program quota available_slots = required_barrel_count -
          ACTIVE - CONSUMED (a count invariant, a different quantity type than the
          volume invariant of the rotation instance). The forward create (2 -> 1) paired
          with its compensating release (1 -> 2) leaves the quantity EXACTLY unchanged.
        test_recipe:
          setup:
            - "Rickhouse 1x1x1 commissioned; barrel filled 2028-09-01 with min_maturation_months 0 (MATURE_ELIGIBLE), BOURBON."
            - "Program created: required_barrel_count 2, reservation_window_days 45, min_quality_score 0; available_slots == 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
