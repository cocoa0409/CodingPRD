              payload: { enrollment_id: "${enr_11}", kind: "TUITION", amount_cents: 200000 }
              as: Registrar
            - call: "GET /institutions/enrollments/${enr_11}"
              as: Registrar
              captures: { enr11_v0: $.data.version }
            - call: "POST /institutions/enrollments/${enr_11}/activate"
              payload: { expected_enrollment_version: "${enr11_v0}" }
              as: Registrar
            - call: "POST /institutions/${inst_k}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00.000Z" }
              as: Registrar
          trigger:
            - call: "POST /institutions/enrollments/${enr_11}/run-delinquency"
              as: Registrar
            - call: "GET /institutions/holds?enrollment_id=${enr_11}"
              as: Registrar
              captures: { k_holds_total: $.data.0.id }
          assert:
            - "Enrollment.${enr_11}.delinquent_installment_count == 2"
            - "No Hold exists for enrollment ${enr_11} (count 2 < limit 3 and total 80000 < 150000)"
            - "Student.${stu_11}.has_active_hold == false"

      - name: activate_zero_charges_empty_set_boundary
        grounds:
          - validations[priority=9]
          - errors[ERR_NO_CHARGES_TO_FINANCE]
          - state_machines.Enrollment.PENDING_to_ACTIVE
          - entities.Enrollment.fields.gross_charges_cents
        distinguishing_aspect: |
          Zero/empty-set boundary on a DIFFERENT metric and endpoint: activating
          a PENDING enrollment whose charge set is empty (gross_charges_cents==0)
          is rejected with ERR_NO_CHARGES_TO_FINANCE; this is the empty-collection
          edge of the activate endpoint, distinct from the numeric count boundary
          above.
        test_recipe:
          setup:
            - "Institution INST_L clock 2026-09-15; Term FALL2026 OPEN; Student S12; Template 4PAY; Enrollment PENDING with NO charges posted."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst L", currency: "USD", refund_policy: "DATE_BASED" }
              as: Registrar
              captures: { inst_l: $.data.id }
            - call: "POST /institutions/${inst_l}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00.000Z" }
