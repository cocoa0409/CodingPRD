scenario: "Payer Audit & Appeal Management (RAC/commercial): audit request intake & records submission deadline, tracking by audit type & dollars at risk, clinical/technical denial categorization, appeal level progression with deadlines, ALJ/external review preparation, overpayment recoupment & offset accounting, success-rate analytics by payer/issue, corrective process improvement"

domain_name: payer-audit-appeal-management
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Payer display name" }
      - { name: payer_type, type: enum, source: input, description: "RAC | COMMERCIAL", constraints: "RAC or COMMERCIAL" }
      - { name: appeal_track, type: enum, source: computed, description: "MEDICARE | COMMERCIAL; derived: RAC->MEDICARE, COMMERCIAL->COMMERCIAL. MEDICARE track labels LEVEL_1..5 = REDETERMINATION, RECONSIDERATION, ALJ, COUNCIL, FEDERAL (max level 5); COMMERCIAL track labels LEVEL_1..3 = INTERNAL_1, INTERNAL_2, EXTERNAL_REVIEW (max level 3)" }
      - { name: records_submission_days, type: integer, source: input, description: "Days from audit received_at to records_due_at" }
      - { name: l1_deadline_days, type: integer, source: input, description: "Days from determination_issued_at to LEVEL_1 appeal filed_deadline_at" }
      - { name: l2_deadline_days, type: integer, source: input, description: "Days from LEVEL_1 decided_at to LEVEL_2 filed_deadline_at" }
      - { name: l3_deadline_days, type: integer, source: input, description: "Days from LEVEL_2 decided_at to LEVEL_3 filed_deadline_at (MEDICARE track)" }
      - { name: l4_deadline_days, type: integer, source: input, description: "Days from LEVEL_3 decided_at to LEVEL_4 filed_deadline_at (MEDICARE track)" }
      - { name: l5_deadline_days, type: integer, source: input, description: "Days from LEVEL_4 decided_at to LEVEL_5 filed_deadline_at (MEDICARE track)" }
      - { name: external_review_deadline_days, type: integer, source: input, description: "Days from LEVEL_2 decided_at to LEVEL_3 (EXTERNAL_REVIEW) filed_deadline_at (COMMERCIAL track)" }
      - { name: concurrent_audit_cap, type: integer, source: input, description: "Max audit cases for this payer with status NOT IN {CLOSED}; creating beyond cap rejected" }
      - { name: hold_levels, type: array, source: input, description: "Appeal levels (subset of [LEVEL_1, LEVEL_2]) during which this payer's recoupment demands move to ON_HOLD when such an appeal reaches PENDING_DECISION" }
      - { name: interest_rate_bps_tier1, type: integer, source: input, description: "Recoupment interest rate (basis points) per 30-day period, periods 1-2" }
      - { name: interest_rate_bps_tier2, type: integer, source: input, description: "Recoupment interest rate (basis points) per 30-day period, periods >= 3" }
      - { name: interest_cap_pct, type: integer, source: input, description: "Accrued interest cap as percent of principal_cents at issue" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }

  - name: IssueCode
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Short code, unique (e.g., MED_NECESSITY, AUTH_MISSING, TIMELY_FILING)", constraints: "unique across all issue codes" }
      - { name: category, type: enum, source: input, description: "CLINICAL | TECHNICAL" }
      - { name: description, type: string, source: input, description: "Denial issue description" }
      - { name: active, type: boolean, source: system, default: true, description: "Always true at creation; no deactivation endpoint" }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; payer that issued the audit" }
      - { name: audit_type, type: enum, source: input, description: "RAC_COMPLEX | RAC_AUTOMATED | COMMERCIAL_POSTPAY | COMMERCIAL_PREPAY | TARGETED_PROBE" }
      - { name: received_at, type: datetime, source: input, description: "Timestamp the audit request was received" }
      - { name: external_audit_ref, type: string, source: input, default: null, description: "Payer's external audit reference" }
      - { name: status, type: enum, source: system, description: "RECEIVED | RECORDS_SUBMITTED | UNDER_PAYER_REVIEW | DETERMINATION_ISSUED | MISSED_DEADLINE | CLOSED" }
      - { name: records_due_at, type: datetime, source: computed, description: "= received_at + payer.records_submission_days; inclusive deadline" }
      - { name: records_submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of first successful records submission" }
      - { name: late_submission, type: boolean, source: system, default: false, description: "True once any first submission lands after records_due_at; sticky (never returns to false)" }
      - { name: determination_issued_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when payer determination posted" }
      - { name: total_billed_cents, type: integer, source: computed, description: "Sum of billed_amount_cents over all claim lines of this case" }
      - { name: total_upheld_cents, type: integer, source: computed, description: "Sum over lines in {PAID_AS_BILLED, DENIED, PARTIALLY_DENIED, OVERTURNED, FINAL} of (billed_amount_cents - denied_amount_cents)" }
      - { name: total_denied_active_cents, type: integer, source: computed, description: "Sum of denied_amount_cents over lines in {DENIED, PARTIALLY_DENIED}" }
      - { name: total_overturned_cents, type: integer, source: computed, description: "Cumulative cents of denied_amount reversed by appeal decisions (each OVERTURNED line contributes the denied amount it had at decision time)" }
      - { name: total_final_denied_cents, type: integer, source: computed, description: "Sum of denied_amount_cents over lines in FINAL" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of case closure" }

  - name: AuditClaimLine
    parent: null
    common_fields: true
    fields:
      - { name: audit_case_id, type: string, source: system, description: "FK -> AuditCase.id; owning audit case" }
      - { name: claim_number, type: string, source: input, description: "Payer-assigned claim number" }
      - { name: patient_account_number, type: string, source: input, description: "Provider patient account number" }
      - { name: service_start_date, type: datetime, source: input, description: "Start of service interval (half-open lower bound, inclusive)" }
      - { name: service_end_date, type: datetime, source: input, description: "End of service interval (half-open upper bound, exclusive); must be > service_start_date" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Amount billed on the claim; must be > 0" }
      - { name: status, type: enum, source: system, description: "UNDER_AUDIT | PAID_AS_BILLED | DENIED | PARTIALLY_DENIED | OVERTURNED | FINAL" }
      - { name: denied_amount_cents, type: integer, source: system, default: 0, description: "Currently-outstanding denied amount; reduced by PARTIAL appeal decisions; 0 when OVERTURNED" }
      - { name: denial_category, type: enum, source: system, default: null, description: "CLINICAL | TECHNICAL; null until denied" }
      - { name: issue_code_id, type: string, source: system, default: null, description: "FK -> IssueCode.id; null for auto-denials (missed records deadline)" }
      - { name: auto_denied, type: boolean, source: system, default: false, description: "True when denial was produced by the missed-deadline auto-denial sweep" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: audit_claim_line_id, type: string, source: system, description: "FK -> AuditClaimLine.id; claim line being appealed" }
      - { name: audit_case_id, type: string, source: system, description: "FK -> AuditCase.id; denormalized from the claim line for filtering" }
      - { name: prior_appeal_id, type: string, source: system, default: null, description: "FK -> Appeal.id; the appeal at the previous level whose decision opened this level; null on LEVEL_1" }
      - { name: level, type: enum, source: system, description: "LEVEL_1 | LEVEL_2 | LEVEL_3 | LEVEL_4 | LEVEL_5; assigned as prior level + 1 (LEVEL_1 when no prior)" }
      - { name: level_label, type: enum, source: computed, description: "Track label: MEDICARE -> REDETERMINATION|RECONSIDERATION|ALJ|COUNCIL|FEDERAL; COMMERCIAL -> INTERNAL_1|INTERNAL_2|EXTERNAL_REVIEW" }
      - { name: filed_deadline_at, type: datetime, source: computed, description: "LEVEL_1: case.determination_issued_at + payer.l1_deadline_days; LEVEL_2: prior.decided_at + payer.l2_deadline_days; LEVEL_3: prior.decided_at + (MEDICARE ? payer.l3_deadline_days : payer.external_review_deadline_days); LEVEL_4/5 (MEDICARE): prior.decided_at + payer.l4/l5_deadline_days; inclusive deadline" }
      - { name: appealed_denied_cents, type: integer, source: system, description: "Snapshot of the claim line's denied_amount_cents at appeal creation" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_DECISION | DECIDED_FAVORABLE | DECIDED_PARTIAL | DECIDED_UNFAVORABLE | WITHDRAWN | EXPIRED" }
      - { name: filed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of filing" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of payer decision" }
      - { name: upheld_cents, type: integer, source: system, default: null, description: "Denied cents the payer keeps after decision; 0 on FAVORABLE, full appealed amount on UNFAVORABLE, strictly between on PARTIAL" }
      - { name: notes, type: string, source: input, default: null, description: "Free-text appeal notes" }

  - name: EvidencePacket
    parent: null
    common_fields: true
    fields:
      - { name: appeal_id, type: string, source: system, description: "FK -> Appeal.id; exactly one packet per appeal (1:1)" }
      - { name: status, type: enum, source: system, description: "ASSEMBLING | READY | SUBMITTED; READY when every required item is ATTACHED or WAIVED (empty required set -> READY at creation)" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of submission" }

  - name: PacketItem
    parent: null
    common_fields: true
    fields:
      - { name: evidence_packet_id, type: string, source: system, description: "FK -> EvidencePacket.id" }
      - { name: item_type, type: enum, source: input, description: "MEDICAL_RECORD | PHYSICIAN_LETTER | POLICY_CITATION | EXPERT_REVIEW | PRIOR_AUTH_DOC" }
      - { name: required, type: boolean, source: input, default: true, description: "Whether readiness gates on this item" }
      - { name: status, type: enum, source: system, description: "PENDING | ATTACHED | WAIVED" }
      - { name: document_ref, type: string, source: system, default: null, description: "Document reference set at attach time; cleared on detach" }

  - name: RecoupmentDemand
    parent: null
    common_fields: true
    fields:
      - { name: audit_case_id, type: string, source: system, description: "FK -> AuditCase.id" }
      - { name: payer_id, type: string, source: system, description: "FK -> Payer.id; denormalized from the audit case" }
      - { name: principal_cents, type: integer, source: input, description: "Demanded overpayment principal; must satisfy applied_principal_total <= principal_cents <= case.total_denied_active_cents" }
      - { name: issued_at, type: datetime, source: input, default: "logical clock now", description: "Demand issue timestamp; defaults to logical clock" }
      - { name: status, type: enum, source: system, description: "DEMANDED | ON_HOLD | PARTIALLY_RECOUPED | FULLY_RECOUPED | REVERSED | WRITTEN_OFF" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "= principal_cents - sum(APPLIED offsets' principal_portion_cents) - written_off_cents" }
      - { name: accrued_interest_cents, type: integer, source: computed, description: "Per recoupment_interest_accrual calculation; recomputed on read and on allocation" }
      - { name: written_off_cents, type: integer, source: system, default: 0, description: "Principal written off at write-off" }
      - { name: hold_started_at, type: datetime, source: system, default: null, description: "When current ON_HOLD began; null unless ON_HOLD" }
      - { name: accumulated_hold_seconds, type: integer, source: system, default: 0, description: "Total seconds spent in ON_HOLD; excluded from interest accrual" }
      - { name: rate_bps_tier1_snapshot, type: integer, source: system, description: "Payer tier1 rate captured at creation" }
      - { name: rate_bps_tier2_snapshot, type: integer, source: system, description: "Payer tier2 rate captured at creation" }
      - { name: interest_cap_pct_snapshot, type: integer, source: system, description: "Payer interest cap captured at creation" }

  - name: Remittance
    parent: null
    common_fields: true
    fields:
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; payer sending the remittance" }
      - { name: gross_amount_cents, type: integer, source: input, description: "Total remittance amount; must be > 0" }
      - { name: external_ref, type: string, source: input, default: null, description: "Payer remittance reference" }
      - { name: available_cents, type: integer, source: computed, description: "= gross_amount_cents - sum(APPLIED offsets drawn on this remittance)" }
      - { name: status, type: enum, source: system, description: "RECEIVED | PARTIALLY_ALLOCATED | FULLY_ALLOCATED; derived from available_cents (== gross -> RECEIVED, == 0 -> FULLY_ALLOCATED, else PARTIALLY_ALLOCATED)" }

  - name: OffsetTransaction
    parent: null
    common_fields: true
    fields:
      - { name: remittance_id, type: string, source: system, description: "FK -> Remittance.id" }
      - { name: recoupment_demand_id, type: string, source: system, description: "FK -> RecoupmentDemand.id" }
      - { name: amount_cents, type: integer, source: computed, description: "= interest_portion_cents + principal_portion_cents" }
      - { name: interest_portion_cents, type: integer, source: computed, description: "Portion applied to accrued interest (interest paid before principal)" }
      - { name: principal_portion_cents, type: integer, source: computed, description: "Portion applied to outstanding principal" }
      - { name: allocation_mode, type: enum, source: system, description: "AUTO_WATERFALL | MANUAL" }
      - { name: status, type: enum, source: system, description: "APPLIED | REVERSED" }
      - { name: applied_at, type: datetime, source: system, description: "Logical-clock timestamp of application" }
      - { name: reversed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of reversal" }

  - name: CorrectiveActionPlan
    parent: null
    common_fields: true
    fields:
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; payer whose denial pattern this plan corrects" }
      - { name: issue_code_id, type: string, source: input, description: "FK -> IssueCode.id; root-cause issue being corrected" }
      - { name: title, type: string, source: input, description: "Plan title" }
      - { name: root_cause, type: string, source: input, description: "Root-cause narrative" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | EFFECTIVENESS_CHECK | VERIFIED | FAILED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who created the plan" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the InternalAuditor who verified the plan" }
      - { name: check_started_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when EFFECTIVENESS_CHECK began" }
      - { name: cycle_count, type: integer, source: system, default: 0, description: "Number of times the plan looped EFFECTIVENESS_CHECK -> ACTIVE via mark-ineffective" }

  - name: AuditCaseEvent
    parent: null
    common_fields: false
    fields:
      - { name: audit_case_id, type: string, source: system, description: "FK -> AuditCase.id" }
      - { name: event_type, type: enum, source: system, description: "CASE_CREATED | RECORDS_SUBMITTED | REVIEW_BEGAN | DETERMINATION_ISSUED | CASE_MISSED_DEADLINE | LINES_AUTO_DENIED | DEMAND_CREATED | OFFSET_APPLIED | OFFSET_REVERSED | CASE_CLOSED" }
      - { name: actor_role, type: string, source: system, description: "Role that caused the event (system for auto-transitions)" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID that caused the event (system for auto-transitions)" }
      - { name: payload, type: object, source: system, description: "Event-specific details (e.g., denied totals, offset ids)" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock timestamp" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Payer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /payers/{id}/suspend"
        actor: RevenueCycleAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /payers/{id}/reactivate"
        actor: RevenueCycleAdmin
        preconditions: []
        side_effects: []

  - entity: AuditCase
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: RECORDS_SUBMITTED
        trigger: "POST /audit-cases/{id}/records-submissions"
        actor: HIMCoordinator
        preconditions:
          - "logical clock now <= records_due_at (inclusive); else the MISSED_DEADLINE path applies"
          - "OCC: expected_audit_case_version must equal current version (ERR_STALE_VERSION)"
        side_effects:
          - "records_submitted_at = now; late_submission = false"
          - "increments AuditCase.version by 1"
          - "append AuditCaseEvent RECORDS_SUBMITTED"
      - from: RECEIVED
        to: MISSED_DEADLINE
        trigger: "system (evaluated on POST /_clock/set_current_utc when now > records_due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade: every claim line in UNDER_AUDIT -> DENIED with denied_amount_cents = billed_amount_cents, denial_category = TECHNICAL, issue_code_id = null, auto_denied = true"
          - "each auto-denied line bubbles up: case total_denied_active_cents / total_upheld_cents recomputed"
          - "append AuditCaseEvent CASE_MISSED_DEADLINE, then LINES_AUTO_DENIED"
      - from: MISSED_DEADLINE
        to: RECORDS_SUBMITTED
        trigger: "POST /audit-cases/{id}/records-submissions (late submission accepted)"
        actor: HIMCoordinator
        preconditions:
          - "OCC: expected_audit_case_version must equal current version (ERR_STALE_VERSION)"
        side_effects:
          - "records_submitted_at = now; late_submission = true (sticky)"
          - "every claim line with auto_denied = true reverts DENIED -> UNDER_AUDIT, denied_amount_cents -> 0, auto_denied -> false; case totals recomputed"
          - "increments AuditCase.version by 1"
          - "append AuditCaseEvent RECORDS_SUBMITTED"
      - from: RECORDS_SUBMITTED
        to: RECORDS_SUBMITTED
        trigger: "POST /audit-cases/{id}/records-submissions (manifest amendment; allowed any number of times)"
        actor: HIMCoordinator
        preconditions:
          - "OCC: expected_audit_case_version must equal current version (ERR_STALE_VERSION)"
        side_effects:
          - "increments AuditCase.version by 1 (records_submitted_at and late_submission unchanged)"
      - from: RECORDS_SUBMITTED
        to: UNDER_PAYER_REVIEW
        trigger: "POST /audit-cases/{id}/begin-payer-review"
        actor: PayerAgent
        preconditions:
          - "ownership: X-User-ID == case.payer_id (ERR_PAYER_MISMATCH)"
        side_effects:
          - "append AuditCaseEvent REVIEW_BEGAN"
      - from: UNDER_PAYER_REVIEW
        to: DETERMINATION_ISSUED
        trigger: "POST /audit-cases/{id}/determination"
        actor: PayerAgent
        preconditions:
          - "ownership: X-User-ID == case.payer_id (ERR_PAYER_MISMATCH)"
          - "outcomes cover every claim line in UNDER_AUDIT exactly once (ERR_DETERMINATION_INCOMPLETE)"
          - "each outcome's claim_line_id belongs to this case (ERR_DETERMINATION_LINE_INVALID)"
          - "amount rules per determination_amounts validation (ERR_DETERMINATION_AMOUNT_INVALID)"
        side_effects:
          - "per line: UNDER_AUDIT -> PAID_AS_BILLED | DENIED | PARTIALLY_DENIED with denied_amount_cents, denial_category, issue_code_id set"
          - "determination_issued_at = now; case totals recomputed"
          - "append AuditCaseEvent DETERMINATION_ISSUED"
      - from: DETERMINATION_ISSUED
        to: CLOSED
        trigger: "POST /audit-cases/{id}/close"
        actor: DepartmentDirector | HIMCoordinator
        preconditions:
          - "all claim lines in terminal set {PAID_AS_BILLED, OVERTURNED, FINAL} (ERR_OPEN_APPEALS_EXIST covers non-terminal lines)"
          - "no appeal of the case in PENDING_DECISION and no DRAFT appeal with filed_deadline_at >= now (ERR_OPEN_APPEALS_EXIST; a stale DRAFT past its deadline does not block closure)"
          - "all recoupment demands of the case in {FULLY_RECOUPED, REVERSED, WRITTEN_OFF} (ERR_OPEN_APPEALS_EXIST)"
          - "if net_exposure_cents >= DIRECTOR_CLOSE_THRESHOLD_CENTS, caller role must be DepartmentDirector (ERR_REQUIRES_DIRECTOR)"
        side_effects:
          - "closed_at = now"
          - "append AuditCaseEvent CASE_CLOSED"

  - entity: AuditClaimLine
    initial_state: UNDER_AUDIT
    terminal_states: [PAID_AS_BILLED, OVERTURNED, FINAL]
    transitions:
      - from: UNDER_AUDIT
        to: PAID_AS_BILLED
        trigger: "POST /audit-cases/{id}/determination (outcome PAID_AS_BILLED)"
        actor: PayerAgent
        preconditions: []
        side_effects: ["denied_amount_cents = 0; case totals recomputed"]
      - from: UNDER_AUDIT
        to: DENIED
        trigger: "POST /audit-cases/{id}/determination (outcome DENIED) OR system auto-denial sweep on missed records deadline"
        actor: PayerAgent | system
        preconditions: []
        side_effects: ["denied_amount_cents = billed_amount_cents (determination) or billed (auto); denial_category and issue_code_id set (null issue on auto); case totals recomputed"]
      - from: UNDER_AUDIT
        to: PARTIALLY_DENIED
        trigger: "POST /audit-cases/{id}/determination (outcome PARTIALLY_DENIED)"
        actor: PayerAgent
        preconditions: []
        side_effects: ["denied_amount_cents = outcome amount; case totals recomputed"]
      - from: DENIED
        to: UNDER_AUDIT
        trigger: "POST /audit-cases/{id}/records-submissions (late submission while case MISSED_DEADLINE)"
        actor: HIMCoordinator
        preconditions: ["line.auto_denied == true"]
        side_effects: ["denied_amount_cents -> 0, denial_category -> null, auto_denied -> false; case totals recomputed"]
      - from: DENIED
        to: OVERTURNED
        trigger: "POST /appeals/{id}/decision (FAVORABLE, or PARTIAL with upheld_cents == 0 handled as FAVORABLE is impossible; FAVORABLE only)"
        actor: PayerAgent
        preconditions: []
        side_effects:
          - "total_overturned_cents += denied_amount_cents; denied_amount_cents = 0; case totals recomputed"
          - "if case.total_denied_active_cents == 0 after this line: every demand of the case in {DEMANDED, ON_HOLD, PARTIALLY_RECOUPED, FULLY_RECOUPED} -> REVERSED; each demand's APPLIED offsets -> REVERSED; each reversed offset credits its remittance available_cents and remittance status recomputed"
      - from: PARTIALLY_DENIED
        to: OVERTURNED
        trigger: "POST /appeals/{id}/decision (FAVORABLE)"
        actor: PayerAgent
        preconditions: []
        side_effects: ["same cascade as DENIED -> OVERTURNED"]
      - from: DENIED
        to: DENIED
        trigger: "POST /appeals/{id}/decision (PARTIAL with 0 < upheld_cents < denied, or UNFAVORABLE)"
        actor: PayerAgent
        preconditions: []
        side_effects: ["PARTIAL: total_overturned_cents += (denied_amount_cents - upheld_cents); denied_amount_cents = upheld_cents; UNFAVORABLE: unchanged; case totals recomputed"]
      - from: PARTIALLY_DENIED
        to: PARTIALLY_DENIED
        trigger: "POST /appeals/{id}/decision (PARTIAL or UNFAVORABLE)"
        actor: PayerAgent
        preconditions: []
        side_effects: ["same adjustment rules as DENIED -> DENIED"]
      - from: DENIED
        to: FINAL
        trigger: "system (evaluated on POST /_clock/set_current_utc: no appeal of this line in PENDING_DECISION, no DRAFT appeal with filed_deadline_at >= now, AND now > filed_deadline_at of the next appeal level)"
        actor: system
        preconditions: []
        side_effects: ["case total_final_denied_cents recomputed"]
      - from: PARTIALLY_DENIED
        to: FINAL
        trigger: "system (same sweep as DENIED -> FINAL)"
        actor: system
        preconditions: []
        side_effects: ["case total_final_denied_cents recomputed"]

  - entity: Appeal
    initial_state: DRAFT
    terminal_states: [DECIDED_FAVORABLE, DECIDED_PARTIAL, DECIDED_UNFAVORABLE, WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: PENDING_DECISION
        trigger: "POST /appeals/{id}/file"
        actor: AppealsSpecialist
        preconditions:
          - "logical clock now <= filed_deadline_at inclusive (ERR_APPEAL_DEADLINE_PASSED)"
          - "if level == LEVEL_3 (ALJ or EXTERNAL_REVIEW): the appeal's evidence packet must exist with status READY or SUBMITTED (ERR_EVIDENCE_PACKET_NOT_READY)"
        side_effects:
          - "filed_at = now"
          - "if level IN payer.hold_levels: every demand of the case in {DEMANDED, PARTIALLY_RECOUPED} -> ON_HOLD (hold_started_at = now)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /appeals/{id}/withdraw"
        actor: AppealsSpecialist
        preconditions: []
        side_effects: []
      - from: PENDING_DECISION
        to: WITHDRAWN
        trigger: "POST /appeals/{id}/withdraw"
        actor: AppealsSpecialist
        preconditions: []
        side_effects:
          - "release hold: demands of the case in ON_HOLD return to DEMANDED (no APPLIED offsets) or PARTIALLY_RECOUPED (some APPLIED offsets); accumulated_hold_seconds += now - hold_started_at; hold_started_at = null"
      - from: DRAFT
        to: EXPIRED
        trigger: "POST /appeals/{id}/file attempted when logical clock now > filed_deadline_at (lazy expiry: the attempt itself expires the appeal)"
        actor: AppealsSpecialist
        preconditions:
          - "now > filed_deadline_at (when now <= filed_deadline_at the normal DRAFT -> PENDING_DECISION path applies)"
        side_effects:
          - "the request is rejected with ERR_APPEAL_DEADLINE_PASSED (409) AND the appeal is moved to EXPIRED"
        note: "There is no clock-sweep for appeal expiry; a DRAFT appeal past its deadline stays DRAFT until a file attempt expires it. Such a stale DRAFT does NOT block claim-line finalization or case closure (their predicates only consider PENDING_DECISION appeals and DRAFT appeals whose filed_deadline_at >= now)."
      - from: PENDING_DECISION
        to: DECIDED_FAVORABLE
        trigger: "POST /appeals/{id}/decision (outcome FAVORABLE, upheld_cents = 0)"
        actor: PayerAgent
        preconditions:
          - "ownership: X-User-ID == case.payer_id (ERR_PAYER_MISMATCH)"
          - "upheld_cents == 0 (ERR_DETERMINATION_AMOUNT_INVALID)"
        side_effects:
          - "decided_at = now; upheld_cents = 0"
          - "claim line -> OVERTURNED (full cascade per AuditClaimLine machine)"
          - "release hold on the case's ON_HOLD demands (as withdraw)"
      - from: PENDING_DECISION
        to: DECIDED_PARTIAL
        trigger: "POST /appeals/{id}/decision (outcome PARTIAL)"
        actor: PayerAgent
        preconditions:
          - "ownership: X-User-ID == case.payer_id (ERR_PAYER_MISMATCH)"
          - "0 < upheld_cents < appeal.appealed_denied_cents (ERR_DETERMINATION_AMOUNT_INVALID)"
        side_effects:
          - "decided_at = now; claim line denied_amount_cents = upheld_cents; case totals recomputed (including total_denied_active_cents == 0 reversal cascade check)"
          - "release hold on the case's ON_HOLD demands"
      - from: PENDING_DECISION
        to: DECIDED_UNFAVORABLE
        trigger: "POST /appeals/{id}/decision (outcome UNFAVORABLE)"
        actor: PayerAgent
        preconditions:
          - "ownership: X-User-ID == case.payer_id (ERR_PAYER_MISMATCH)"
          - "upheld_cents == appeal.appealed_denied_cents (ERR_DETERMINATION_AMOUNT_INVALID)"
        side_effects:
          - "decided_at = now; claim line denied_amount_cents unchanged"
          - "release hold on the case's ON_HOLD demands"

  - entity: EvidencePacket
    initial_state: ASSEMBLING
    terminal_states: [SUBMITTED]
    transitions:
      - from: ASSEMBLING
        to: READY
        trigger: "system (readiness re-evaluated on packet creation and after every item mutation)"
        actor: system
        preconditions: ["every item with required == true has status IN {ATTACHED, WAIVED} (vacuous truth: zero required items -> READY at creation)"]
        side_effects: []
      - from: READY
        to: ASSEMBLING
        trigger: "system (revert when a required item enters PENDING: item added with required=true, or item detached)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: SUBMITTED
        trigger: "POST /evidence-packets/{id}/submit"
        actor: AppealsSpecialist
        preconditions: ["appeal status IN {DRAFT, PENDING_DECISION} (ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["submitted_at = now"]

  - entity: PacketItem
    initial_state: PENDING
    terminal_states: [ATTACHED, WAIVED]
    transitions:
      - from: PENDING
        to: ATTACHED
        trigger: "POST /evidence-packets/{id}/items/{itemId}/attach"
        actor: AppealsSpecialist
        preconditions: ["packet status != SUBMITTED (ERR_PACKET_IMMUTABLE)"]
        side_effects: ["document_ref = input; packet readiness re-evaluated"]
      - from: PENDING
        to: WAIVED
        trigger: "POST /evidence-packets/{id}/items/{itemId}/waive"
        actor: DepartmentDirector
        preconditions: ["packet status != SUBMITTED (ERR_PACKET_IMMUTABLE)"]
        side_effects: ["packet readiness re-evaluated"]
      - from: ATTACHED
        to: PENDING
        trigger: "POST /evidence-packets/{id}/items/{itemId}/detach"
        actor: AppealsSpecialist
        preconditions: ["packet status != SUBMITTED (ERR_PACKET_IMMUTABLE)"]
        side_effects: ["document_ref = null; packet readiness re-evaluated (READY -> ASSEMBLING if item required)"]

  - entity: RecoupmentDemand
    initial_state: DEMANDED
    terminal_states: [REVERSED, WRITTEN_OFF]
    transitions:
      - from: DEMANDED
        to: PARTIALLY_RECOUPED
        trigger: "system (offset applied with 0 < covered outstanding total)"
        actor: system
        preconditions: []
        side_effects: ["outstanding_principal_cents recomputed"]
      - from: DEMANDED
        to: FULLY_RECOUPED
        trigger: "system (offset applied covering outstanding_principal_cents + accrued_interest_cents exactly; outstanding hits 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_RECOUPED
        to: FULLY_RECOUPED
        trigger: "system (offset applied driving outstanding_principal_cents to 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEMANDED
        to: ON_HOLD
        trigger: "system (appeal on a claim line of this case reaches PENDING_DECISION with level IN payer.hold_levels)"
        actor: system
        preconditions: []
        side_effects: ["hold_started_at = now"]
      - from: PARTIALLY_RECOUPED
        to: ON_HOLD
        trigger: "system (same appeal-filed trigger)"
        actor: system
        preconditions: []
        side_effects: ["hold_started_at = now"]
      - from: ON_HOLD
        to: DEMANDED
        trigger: "system (the holding appeal is decided or withdrawn; no APPLIED offsets on this demand)"
        actor: system
        preconditions: []
        side_effects: ["accumulated_hold_seconds += now - hold_started_at; hold_started_at = null"]
      - from: ON_HOLD
        to: PARTIALLY_RECOUPED
        trigger: "system (the holding appeal is decided or withdrawn; some APPLIED offsets exist)"
        actor: system
        preconditions: []
        side_effects: ["accumulated_hold_seconds += now - hold_started_at; hold_started_at = null"]
      - from: DEMANDED
        to: REVERSED
        trigger: "system (case.total_denied_active_cents reaches 0 via appeal decisions)"
        actor: system
        preconditions: []
        side_effects: ["all APPLIED offsets -> REVERSED; remittances credited; outstanding_principal_cents restored to principal_cents - written_off_cents"]
      - from: ON_HOLD
        to: REVERSED
        trigger: "system (same full-vindication trigger)"
        actor: system
        preconditions: []
        side_effects: ["same as DEMANDED -> REVERSED"]
      - from: PARTIALLY_RECOUPED
        to: REVERSED
        trigger: "system (same full-vindication trigger)"
        actor: system
        preconditions: []
        side_effects: ["same as DEMANDED -> REVERSED"]
      - from: FULLY_RECOUPED
        to: REVERSED
        trigger: "system (same full-vindication trigger; models post-recoupment refund)"
        actor: system
        preconditions: []
        side_effects: ["same as DEMANDED -> REVERSED"]
      - from: DEMANDED
        to: WRITTEN_OFF
        trigger: "POST /recoupment-demands/{id}/write-off"
        actor: PFSAccountant | DepartmentDirector
        preconditions: ["no appeals of the case in {DRAFT, PENDING_DECISION} (ERR_OPEN_APPEALS_EXIST)"]
        side_effects: ["written_off_cents = outstanding_principal_cents; outstanding_principal_cents = 0"]
      - from: PARTIALLY_RECOUPED
        to: WRITTEN_OFF
        trigger: "POST /recoupment-demands/{id}/write-off"
        actor: PFSAccountant | DepartmentDirector
        preconditions: ["no appeals of the case in {DRAFT, PENDING_DECISION} (ERR_OPEN_APPEALS_EXIST)"]
        side_effects: ["written_off_cents = outstanding_principal_cents; outstanding_principal_cents = 0"]
    note: "principal adjustment (POST /recoupment-demands/{id}/adjustments) is an in-place mutation allowed in {DEMANDED, PARTIALLY_RECOUPED}, guarded by OCC; it does not change status"

  - entity: Remittance
    initial_state: RECEIVED
    terminal_states: []
    transitions:
      - from: RECEIVED
        to: PARTIALLY_ALLOCATED
        trigger: "system (offset applied drawing on this remittance; 0 < available_cents < gross)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: FULLY_ALLOCATED
        trigger: "system (offset applied; available_cents == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_ALLOCATED
        to: FULLY_ALLOCATED
        trigger: "system (offset applied; available_cents == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_ALLOCATED
        to: RECEIVED
        trigger: "system (offset reversed; available_cents == gross again)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULLY_ALLOCATED
        to: PARTIALLY_ALLOCATED
        trigger: "system (offset reversed; 0 < available_cents < gross)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OffsetTransaction
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "POST /offset-transactions/{id}/reverse OR system (demand reversal cascade)"
        actor: PFSAccountant | system
        preconditions: []
        side_effects:
          - "reversed_at = now"
          - "demand outstanding_principal_cents += principal_portion_cents; demand status recomputed (REVERSED offsets never counted; if demand was FULLY_RECOUPED it returns to PARTIALLY_RECOUPED or DEMANDED)"
          - "remittance available_cents += amount_cents; remittance status recomputed"
          - "append AuditCaseEvent OFFSET_REVERSED"

  - entity: CorrectiveActionPlan
    initial_state: PROPOSED
    terminal_states: [VERIFIED, FAILED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /corrective-action-plans/{id}/activate"
        actor: DepartmentDirector
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EFFECTIVENESS_CHECK
        trigger: "POST /corrective-action-plans/{id}/begin-effectiveness-check"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["check_started_at = now"]
      - from: EFFECTIVENESS_CHECK
        to: VERIFIED
        trigger: "POST /corrective-action-plans/{id}/verify"
        actor: InternalAuditor
        preconditions:
          - "X-User-ID != proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "now >= check_started_at + CAP_EFFECTIVENESS_WINDOW_DAYS (ERR_CAP_WINDOW_NOT_ELAPSED)"
        side_effects: ["verified_by_user_id = X-User-ID"]
      - from: EFFECTIVENESS_CHECK
        to: ACTIVE
        trigger: "POST /corrective-action-plans/{id}/mark-ineffective (when cycle_count + 1 < CAP_MAX_CYCLES)"
        actor: InternalAuditor
        preconditions: []
        side_effects: ["cycle_count += 1; check_started_at = null"]
      - from: EFFECTIVENESS_CHECK
        to: FAILED
        trigger: "POST /corrective-action-plans/{id}/mark-ineffective (when cycle_count + 1 >= CAP_MAX_CYCLES)"
        actor: InternalAuditor
        preconditions: []
        side_effects: ["cycle_count += 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: records-submission-stale-case
    parent_entity: AuditCase
    write_endpoint: "POST /audit-cases/{id}/records-submissions"
    occ_field: expected_audit_case_version
    description: |
      A records submission (initial, late, or manifest amendment) against an
      AuditCase whose version has advanced since the client last observed it is
      rejected. Amendment is legitimate from RECORDS_SUBMITTED, so a second
      sequential request observes an acceptable state; only the stale
      expected_audit_case_version distinguishes it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: demand-adjustment-stale-demand
    parent_entity: RecoupmentDemand
    write_endpoint: "POST /recoupment-demands/{id}/adjustments"
    occ_field: expected_recoupment_demand_version
    description: |
      A principal adjustment against a RecoupmentDemand whose version has
      advanced since the client last observed it is rejected. Adjustments are
      legitimate any number of times while the demand is DEMANDED or
      PARTIALLY_RECOUPED, so a second sequential request observes an acceptable
      state; only the stale expected_recoupment_demand_version distinguishes it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: records_due_at
    trigger: "audit case creation"
    algorithm: deadline_arithmetic
    formula: |
      records_due_at = received_at + payer.records_submission_days * 86400 seconds
      On-time submission: logical clock now <= records_due_at (INCLUSIVE equality).
      now == records_due_at is ON TIME; now == records_due_at + 1s is LATE.
    input_set: "the case being created and its payer"

  - name: appeal_filed_deadline
    trigger: "appeal creation"
    algorithm: deadline_arithmetic
    formula: |
      LEVEL_1: filed_deadline_at = case.determination_issued_at + payer.l1_deadline_days days
      LEVEL_2: filed_deadline_at = prior_appeal.decided_at + payer.l2_deadline_days days
      LEVEL_3: filed_deadline_at = prior_appeal.decided_at + (payer.appeal_track == MEDICARE ? payer.l3_deadline_days : payer.external_review_deadline_days) days
      LEVEL_4 (MEDICARE only): prior_appeal.decided_at + payer.l4_deadline_days days
      LEVEL_5 (MEDICARE only): prior_appeal.decided_at + payer.l5_deadline_days days
      Filing is on time when logical clock now <= filed_deadline_at (INCLUSIVE).
    input_set: "the new appeal, its prior appeal (if any), the case, and the payer"

  - name: dollars_at_risk
    trigger: "GET /audit-cases/{id}/exposure; recomputed from live state on every call"
    algorithm: weighted_scoring
    formula: |
      Both variants share the at-risk base per claim line:
        at_risk(line) = line.denied_amount_cents                    if line.status IN {DENIED, PARTIALLY_DENIED, FINAL}
                      = line.billed_amount_cents                    if line.status == UNDER_AUDIT AND case.late_submission == true
                      = 0                                           otherwise
      GROSS variant: gross_dollars_at_risk_cents = sum over lines of at_risk(line)
      NET variant: net_exposure_cents = sum over lines of
        round_half_up( at_risk(line) * (10000 - overturn_bp(line)) / 10000 )
      where overturn_bp(line) comes from the FROZEN success-rate snapshot (see below),
      and per-line rounding happens BEFORE the sum (pinned rounding order).
      Frozen snapshot (evaluation-order pin, breaks circularity):
        overturn_bp(line) = DOLLAR_WEIGHTED success rate (success_rate calculation) over
        appeals decided in the PRIOR COMPLETED CALENDAR QUARTER relative to now,
        grouped by (case.payer_id, line.issue_code_id).
        Lines with issue_code_id == null, or groups with zero decided appeals in the
        snapshot window, use DEFAULT_OVERTURN_BP. Decisions from the current quarter
        NEVER feed the snapshot used for exposure.
    input_set: "claim lines of the case; frozen prior-quarter decided appeals for (payer, issue)"
    constants:
      DEFAULT_OVERTURN_BP: 5000
    precision: "integer cents, round_half_up per line before summing"
    variants:
      - name: GROSS
        when: "exposure reporting where full contractual exposure is required"
        difference: "unweighted sum of at-risk amounts"
      - name: NET
        when: "management exposure view (net_exposure_cents)"
        difference: "each at-risk amount weighted by (1 - frozen overturn rate); differs from GROSS whenever any relevant snapshot rate != 0"

  - name: success_rate
    trigger: "GET /analytics/success-rates"
    algorithm: aggregation
    formula: |
      Input set: appeals with status IN {DECIDED_FAVORABLE, DECIDED_PARTIAL, DECIDED_UNFAVORABLE}
      (WITHDRAWN and EXPIRED are EXCLUDED), decided_at in [from, to) — from inclusive,
      to exclusive; omitted bounds are unbounded — optionally filtered by payer_id and/or
      issue_code_id (of the appeal's claim line; appeals on lines with issue_code_id null
      form the null-issue group and are excluded when an issue_code_id filter is given).
      Group rows by (payer_id, issue_code_id).
      SIMPLE variant:      success_rate_bp = round_half_up(10000 * (favorable + 0.5*partial) / decided_count)
      DOLLAR_WEIGHTED:     success_rate_bp = round_half_up(10000 * sum(appealed_denied_cents - upheld_cents) / sum(appealed_denied_cents))
      Groups with decided_count == 0 are omitted from the response.
    input_set: "decided appeals in [from, to), grouped by (payer_id, issue_code_id)"
    precision: "integer basis points, round_half_up"
    variants:
      - name: SIMPLE
        when: "variant=SIMPLE (default)"
        difference: "counts appeals; a PARTIAL decision counts as 0.5"
      - name: DOLLAR_WEIGHTED
        when: "variant=DOLLAR_WEIGHTED"
        difference: "weights by recovered cents; differs from SIMPLE whenever decided appeals have heterogeneous denied amounts"

  - name: recoupment_interest_accrual
    trigger: "demand read and offset allocation"
    algorithm: threshold
    formula: |
      eligible_seconds = (now - issued_at) - accumulated_hold_seconds
                       - (hold_started_at == null ? 0 : now - hold_started_at)
      periods = floor(eligible_seconds / (INTEREST_PERIOD_DAYS * 86400))
      if periods <= 0: accrued_interest_cents = 0
      elif periods <= 2: raw = outstanding_principal_cents * rate_bps_tier1_snapshot * periods / 10000
      else: raw = outstanding_principal_cents * (rate_bps_tier1_snapshot * 2 + rate_bps_tier2_snapshot * (periods - 2)) / 10000
      accrued_interest_cents = round_half_up( min(raw, principal_cents_at_issue * interest_cap_pct_snapshot / 100) )
      (principal_cents_at_issue is the principal_cents value at creation, before adjustments)
    input_set: "the single demand; clock now; hold intervals"
    constants:
      INTEREST_PERIOD_DAYS: 30
    precision: "integer cents, round_half_up after the min()"

  - name: offset_waterfall_allocation
    trigger: "POST /remittances/{id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      Candidate demands: same payer as the remittance, status IN {DEMANDED, PARTIALLY_RECOUPED}
      (ON_HOLD demands are EXCLUDED). Order: issued_at ASC, tie-break created_at ASC.
      remaining = remittance.available_cents
      For each demand in order while remaining > 0:
        interest_now = round_half_up(recoupment_interest_accrual(demand))   # rounded PER DEMAND before any summation
        interest_portion = min(remaining, interest_now)
        principal_portion = min(remaining - interest_portion, demand.outstanding_principal_cents)
        applied = interest_portion + principal_portion
        if applied > 0: create OffsetTransaction(interest_portion, principal_portion, AUTO_WATERFALL)
        remaining -= applied
      Pinned rounding order (mode b): interest is rounded to whole cents PER DEMAND
      (round_half_up) BEFORE portions are computed; never sum raw fractional interest
      across demands and round once. Per-demand 333.33 -> 333 + 333 = 666, not 667.
    input_set: "the remittance; eligible demands of the same payer ordered by (issued_at ASC, created_at ASC)"
    precision: "integer cents, round_half_up per demand"

  - name: case_totals_recompute
    trigger: "any claim line mutation (determination, auto-denial, late-submission revert, appeal decision, finalization)"
    algorithm: aggregation
    formula: |
      total_billed_cents        = sum(line.billed_amount_cents) over all lines
      total_denied_active_cents = sum(line.denied_amount_cents) over lines with status IN {DENIED, PARTIALLY_DENIED}
      total_final_denied_cents  = sum(line.denied_amount_cents) over lines with status == FINAL
      total_upheld_cents        = sum(line.billed_amount_cents - line.denied_amount_cents) over lines with status IN {PAID_AS_BILLED, DENIED, PARTIALLY_DENIED, OVERTURNED, FINAL}
      total_overturned_cents    = cumulative cents of denied_amount reversed by decisions (increment-only)
      Conservation invariant: total_billed_cents == total_upheld_cents + total_denied_active_cents + total_final_denied_cents
    input_set: "all claim lines of the case"

  - name: claim_overlap_detection
    trigger: "POST /audit-cases/{id}/claim-lines"
    algorithm: interval_merge
    formula: |
      Reject (ERR_DUPLICATE_CLAIM_IN_OPEN_AUDIT) when another claim line exists with:
        same payer (via its case), same claim_number, its case status != CLOSED, and
        [existing.service_start_date, existing.service_end_date) OVERLAPS
        [new.service_start_date, new.service_end_date)
      Half-open semantics: overlap iff new.start < existing.end AND existing.start < new.end.
      Adjacency is NOT overlap: new.start == existing.end is allowed.
      Lines within the SAME case are exempt (a case may legitimately hold one line per claim;
      the check targets OTHER cases only).

  - name: packet_readiness
    trigger: "packet creation; every PacketItem mutation"
    algorithm: aggregation
    formula: |
      required_items = items with required == true
      ready = for all i in required_items: i.status IN {ATTACHED, WAIVED}
      Empty required set -> READY (vacuous truth), evaluated at creation.
      READY -> ASSEMBLING when any required item enters PENDING.
      SUBMITTED is terminal for readiness evaluation.

  - name: concurrent_audit_capacity
    trigger: "POST /audit-cases"
    algorithm: threshold
    formula: |
      open_count = count of the payer's cases with status != CLOSED
      Reject (ERR_CONCURRENT_AUDIT_CAP) when open_count >= payer.concurrent_audit_cap
      (boundary: open_count == cap is rejected; open_count == cap - 1 is allowed).

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body well-formed: required fields present, enums valid, amounts positive, service_end_date > service_start_date, analytics from < to"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 3.5
    category: existence
    check: "Analytics window must satisfy from < to when both given"
    error_id: ERR_ANALYTICS_WINDOW_INVALID
    http_status: 422
    applies_to: "GET /analytics/success-rates"
  - priority: 4
    category: existence
    check: "Every path id and body FK reference must exist (left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: business_referential
    check: "PayerAgent ownership: X-User-ID must equal the payer id of the target resource (case.payer_id / demand.payer_id / appeal's case payer / body payer_id)"
    error_id: ERR_PAYER_MISMATCH
    http_status: 403
    applies_to: "PayerAgent endpoints: begin-payer-review, determination, decision, recoupment-demands create/adjust, remittances create"
  - priority: 6
    category: state
    check: "Target resource must be in a state that allows the transition (includes ERR_LINE_NOT_APPEALABLE, ERR_PACKET_IMMUTABLE, ERR_PACKET_ALREADY_EXISTS, ERR_DEMAND_ON_HOLD, ERR_OPEN_APPEALS_EXIST as domain-specialized state errors at this tier)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state transition endpoints"
  - priority: 7
    category: business_safety
    check: "Segregation of duties and authority: CAP verify requires verifier != proposer; case close with net_exposure_cents >= DIRECTOR_CLOSE_THRESHOLD_CENTS requires DepartmentDirector"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_REQUIRES_DIRECTOR"
    http_status: "409 | 403"
    applies_to: "CAP verify; case close"
  - priority: 8
    category: business_temporal
    check: "Deadlines and windows: appeal filing now <= filed_deadline_at; CAP verify now >= check_started_at + 14 days"
    error_id: "ERR_APPEAL_DEADLINE_PASSED | ERR_CAP_WINDOW_NOT_ELAPSED"
    http_status: 409
    applies_to: "appeal file; CAP verify"
  - priority: 9
    category: business_constraint
    check: "Uniqueness/overlap/capacity/track constraints: payer ACTIVE for new cases; concurrent audit cap; claim overlap; appeal next level exists in payer track and prior appeal decided; LEVEL_3 filing requires READY/SUBMITTED packet; determination completeness/amounts"
    error_id: "ERR_PAYER_SUSPENDED | ERR_CONCURRENT_AUDIT_CAP | ERR_DUPLICATE_CLAIM_IN_OPEN_AUDIT | ERR_APPEAL_LEVEL_NOT_AVAILABLE | ERR_EVIDENCE_PACKET_NOT_READY | ERR_DETERMINATION_INCOMPLETE | ERR_DETERMINATION_LINE_INVALID | ERR_DETERMINATION_AMOUNT_INVALID | ERR_DUPLICATE_ISSUE_CODE"
    http_status: "409 | 422"
    applies_to: "case create; claim-line create; appeal create/file; determination; issue-code create"
  - priority: 10
    category: business_referential
    check: "Cross-entity linkage: manual offset's remittance and demand must belong to the same payer"
    error_id: ERR_CROSS_PAYER_ALLOCATION
    http_status: 409
    applies_to: "POST /recoupment-demands/{id}/offsets"
  - priority: 11
    category: business_fiscal
    check: "Money ceilings: demand principal within denied active total and >= applied principal; manual offset amount <= min(remittance.available_cents, demand outstanding total)"
    error_id: "ERR_DEMAND_EXCEEDS_DENIED | ERR_OFFSET_EXCEEDS_OUTSTANDING"
    http_status: 409
    applies_to: "demand create/adjust; manual offset"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Setting the clock evaluates all auto-transitions: missed records deadlines, appeal expiry, claim-line finalization."
    roles: [RevenueCycleAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["case missed-deadline sweep + auto-denial cascade", "claim-line FINAL sweep"]

  # --- Payer ---
  - method: POST
    path: "/payers"
    description: "Create a payer"
    roles: [RevenueCycleAdmin]
    code: 201
    input: [name, payer_type, records_submission_days, l1_deadline_days, l2_deadline_days, l3_deadline_days, l4_deadline_days, l5_deadline_days, external_review_deadline_days, concurrent_audit_cap, hold_levels, interest_rate_bps_tier1, interest_rate_bps_tier2, interest_cap_pct]
    output: Payer
    side_effects: ["status=ACTIVE; appeal_track derived from payer_type"]
  - method: GET
    path: "/payers"
    description: "List payers"
    roles: [Any]
    code: 200
    input: ["payer_type?", "status?", "limit?", "offset?"]
    output: "Payer[]"
    side_effects: []
  - method: GET
    path: "/payers/{id}"
    description: "Get a payer"
    roles: [Any]
    code: 200
    input: []
    output: Payer
    side_effects: []
  - method: POST
    path: "/payers/{id}/suspend"
    description: "Suspend a payer (blocks new audit cases)"
    roles: [RevenueCycleAdmin]
    code: 200
    input: []
    output: Payer
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/payers/{id}/reactivate"
    description: "Reactivate a suspended payer"
    roles: [RevenueCycleAdmin]
    code: 200
    input: []
    output: Payer
    side_effects: ["status -> ACTIVE"]

  # --- Issue codes ---
  - method: POST
    path: "/issue-codes"
    description: "Create a denial issue code (clinical/technical taxonomy)"
    roles: [RevenueCycleAdmin]
    code: 201
    input: [code, category, description]
    output: IssueCode
    side_effects: ["active=true"]
  - method: GET
    path: "/issue-codes"
    description: "List issue codes"
    roles: [Any]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: "IssueCode[]"
    side_effects: []
  - method: GET
    path: "/issue-codes/{id}"
    description: "Get an issue code"
    roles: [Any]
    code: 200
    input: []
    output: IssueCode
    side_effects: []

  # --- Audit cases ---
  - method: POST
    path: "/audit-cases"
    description: "Intake a payer audit request"
    roles: [HIMCoordinator, RevenueCycleAdmin]
    code: 201
    input: [payer_id, audit_type, received_at, "external_audit_ref?"]
    output: AuditCase
    side_effects: ["status=RECEIVED; records_due_at computed; concurrent cap + payer-ACTIVE checks; append CASE_CREATED event"]
  - method: GET
    path: "/audit-cases"
    description: "List audit cases"
    roles: [Any]
    code: 200
    input: ["payer_id?", "status?", "audit_type?", "limit?", "offset?"]
    output: "AuditCase[]"
    side_effects: []
  - method: GET
    path: "/audit-cases/{id}"
    description: "Get an audit case"
    roles: [Any]
    code: 200
    input: []
    output: AuditCase
    side_effects: []
  - method: POST
    path: "/audit-cases/{id}/claim-lines"
    description: "Add a claim line under audit"
    roles: [HIMCoordinator]
    code: 201
    input: [claim_number, patient_account_number, service_start_date, service_end_date, billed_amount_cents]
    output: AuditClaimLine
    side_effects: ["status=UNDER_AUDIT; case totals recomputed; overlap check vs other payers' open cases"]
  - method: GET
    path: "/audit-cases/{id}/claim-lines"
    description: "List claim lines of a case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuditClaimLine[]"
    side_effects: []
  - method: GET
    path: "/claim-lines/{id}"
    description: "Get a claim line"
    roles: [Any]
    code: 200
    input: []
    output: AuditClaimLine
    side_effects: []
  - method: GET
    path: "/claim-lines"
    description: "List claim lines (filtered)"
    roles: [Any]
    code: 200
    input: ["audit_case_id?", "issue_code_id?", "status?", "limit?", "offset?"]
    output: "AuditClaimLine[]"
    side_effects: []
  - method: POST
    path: "/audit-cases/{id}/records-submissions"
    description: "Submit (or amend) the records manifest; OCC-guarded; late submissions accepted with late_submission=true"
    roles: [HIMCoordinator]
    code: 200
    input: [manifest_ref, expected_audit_case_version]
    output: AuditCase
    side_effects: ["RECEIVED/MISSED_DEADLINE -> RECORDS_SUBMITTED (or amendment); late flag; auto-denied line revert on late path; increments AuditCase.version by 1"]
  - method: POST
    path: "/audit-cases/{id}/begin-payer-review"
    description: "Payer begins review after records submission"
    roles: [PayerAgent]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["RECORDS_SUBMITTED -> UNDER_PAYER_REVIEW; REVIEW_BEGAN event"]
  - method: POST
    path: "/audit-cases/{id}/determination"
    description: "Payer posts per-line determination outcomes"
    roles: [PayerAgent]
    code: 200
    input: [outcomes]
    output: AuditCase
    side_effects: ["line transitions per outcome; determination_issued_at = now; totals recomputed; DETERMINATION_ISSUED event"]
  - method: POST
    path: "/audit-cases/{id}/close"
    description: "Close a fully-resolved audit case"
    roles: [DepartmentDirector, HIMCoordinator]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["DETERMINATION_ISSUED -> CLOSED; closed_at = now; CASE_CLOSED event"]
  - method: GET
    path: "/audit-cases/{id}/events"
    description: "Append-only audit trail of the case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuditCaseEvent[]"
    side_effects: []
  - method: GET
    path: "/audit-cases/{id}/exposure"
    description: "Computed read: GROSS and NET dollars at risk per dollars_at_risk calculation"
    roles: [Any]
    code: 200
    input: []
    output: "{ gross_dollars_at_risk_cents: integer, net_exposure_cents: integer, late_submission: boolean, snapshot_quarter_start: string }"
    side_effects: []

  # --- Appeals ---
  - method: POST
    path: "/claim-lines/{id}/appeals"
    description: "Open the next appeal level for a denied line (level derived from prior appeals)"
    roles: [AppealsSpecialist]
    code: 201
    input: ["notes?"]
    output: Appeal
    side_effects: ["status=DRAFT; level = prior+1 or LEVEL_1; filed_deadline_at computed; appealed_denied_cents snapshot"]
  - method: GET
    path: "/claim-lines/{id}/appeals"
    description: "List appeals of a claim line"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []
  - method: GET
    path: "/appeals"
    description: "List appeals (filtered)"
    roles: [Any]
    code: 200
    input: ["audit_case_id?", "claim_line_id?", "prior_appeal_id?", "status?", "level?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []
  - method: GET
    path: "/appeals/{id}"
    description: "Get an appeal"
    roles: [Any]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/appeals/{id}/file"
    description: "File an appeal (deadline-inclusive; LEVEL_3 requires READY/SUBMITTED packet)"
    roles: [AppealsSpecialist]
    code: 200
    input: []
    output: Appeal
    side_effects: ["DRAFT -> PENDING_DECISION; filed_at = now; recoupment hold side effect"]
  - method: POST
    path: "/appeals/{id}/withdraw"
    description: "Withdraw an appeal"
    roles: [AppealsSpecialist]
    code: 200
    input: []
    output: Appeal
    side_effects: ["DRAFT/PENDING_DECISION -> WITHDRAWN; hold release"]
  - method: POST
    path: "/appeals/{id}/decision"
    description: "Payer posts the appeal decision"
    roles: [PayerAgent]
    code: 200
    input: [outcome, upheld_cents]
    output: Appeal
    side_effects: ["-> DECIDED_FAVORABLE/DECIDED_PARTIAL/DECIDED_UNFAVORABLE; claim line update + reversal cascade; hold release"]

  # --- Evidence packets ---
  - method: POST
    path: "/appeals/{id}/evidence-packet"
    description: "Create the ALJ/external-review evidence packet for a LEVEL_3 appeal (1:1)"
    roles: [AppealsSpecialist]
    code: 201
    input: []
    output: EvidencePacket
    side_effects: ["status=ASSEMBLING then immediate readiness evaluation (empty required set -> READY)"]
  - method: GET
    path: "/appeals/{id}/evidence-packet"
    description: "Get the packet of an appeal (0 or 1 element)"
    roles: [Any]
    code: 200
    input: []
    output: "EvidencePacket[]"
    side_effects: []
  - method: GET
    path: "/evidence-packets/{id}"
    description: "Get a packet"
    roles: [Any]
    code: 200
    input: []
    output: EvidencePacket
    side_effects: []
  - method: POST
    path: "/evidence-packets/{id}/items"
    description: "Add a checklist item to the packet"
    roles: [AppealsSpecialist]
    code: 201
    input: [item_type, "required?"]
    output: PacketItem
    side_effects: ["status=PENDING; packet readiness re-evaluated (READY -> ASSEMBLING if required)"]
  - method: GET
    path: "/evidence-packets/{id}/items"
    description: "List packet items"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "PacketItem[]"
    side_effects: []
  - method: POST
    path: "/evidence-packets/{id}/items/{itemId}/attach"
    description: "Attach a document to a pending item"
    roles: [AppealsSpecialist]
    code: 200
    input: [document_ref]
    output: PacketItem
    side_effects: ["PENDING -> ATTACHED; readiness re-evaluated"]
  - method: POST
    path: "/evidence-packets/{id}/items/{itemId}/waive"
    description: "Waive a pending required item (director authority)"
    roles: [DepartmentDirector]
    code: 200
    input: []
    output: PacketItem
    side_effects: ["PENDING -> WAIVED; readiness re-evaluated"]
  - method: POST
    path: "/evidence-packets/{id}/items/{itemId}/detach"
    description: "Detach a document (returns item to PENDING)"
    roles: [AppealsSpecialist]
    code: 200
    input: []
    output: PacketItem
    side_effects: ["ATTACHED -> PENDING; document_ref=null; readiness re-evaluated"]
  - method: POST
    path: "/evidence-packets/{id}/submit"
    description: "Submit a READY packet"
    roles: [AppealsSpecialist]
    code: 200
    input: []
    output: EvidencePacket
    side_effects: ["READY -> SUBMITTED; submitted_at = now"]

  # --- Recoupment ---
  - method: POST
    path: "/audit-cases/{id}/recoupment-demands"
    description: "Payer issues an overpayment recoupment demand"
    roles: [PayerAgent]
    code: 201
    input: [principal_cents, "issued_at?"]
    output: RecoupmentDemand
    side_effects: ["status=DEMANDED; interest snapshots captured; DEMAND_CREATED event"]
  - method: GET
    path: "/audit-cases/{id}/recoupment-demands"
    description: "List demands of a case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "RecoupmentDemand[]"
    side_effects: []
  - method: GET
    path: "/recoupment-demands"
    description: "List demands (filtered)"
    roles: [Any]
    code: 200
    input: ["payer_id?", "status?", "limit?", "offset?"]
    output: "RecoupmentDemand[]"
    side_effects: []
  - method: GET
    path: "/recoupment-demands/{id}"
    description: "Get a demand (accrued_interest_cents recomputed on read)"
    roles: [Any]
    code: 200
    input: []
    output: RecoupmentDemand
    side_effects: []
  - method: POST
    path: "/recoupment-demands/{id}/adjustments"
    description: "Adjust demand principal (OCC-guarded; allowed in DEMANDED/PARTIALLY_RECOUPED)"
    roles: [PayerAgent]
    code: 200
    input: [new_principal_cents, expected_recoupment_demand_version]
    output: RecoupmentDemand
    side_effects: ["principal_cents updated; outstanding recomputed; increments RecoupmentDemand.version by 1"]
  - method: POST
    path: "/recoupment-demands/{id}/write-off"
    description: "Write off the outstanding principal"
    roles: [PFSAccountant, DepartmentDirector]
    code: 200
    input: []
    output: RecoupmentDemand
    side_effects: ["-> WRITTEN_OFF; written_off_cents = outstanding"]
  - method: POST
    path: "/recoupment-demands/{id}/offsets"
    description: "Manual targeted offset allocation from a specific remittance"
    roles: [PFSAccountant]
    code: 201
    input: [remittance_id, amount_cents]
    output: OffsetTransaction
    side_effects: ["OffsetTransaction APPLIED (MANUAL); interest portion first; demand + remittance recomputed; OFFSET_APPLIED event"]

  # --- Remittances / offsets ---
  - method: POST
    path: "/remittances"
    description: "Register a payer remittance available for offset"
    roles: [PayerAgent]
    code: 201
    input: [payer_id, gross_amount_cents, "external_ref?"]
    output: Remittance
    side_effects: ["status=RECEIVED; available_cents = gross"]
  - method: GET
    path: "/remittances"
    description: "List remittances (filtered)"
    roles: [Any]
    code: 200
    input: ["payer_id?", "status?", "limit?", "offset?"]
    output: "Remittance[]"
    side_effects: []
  - method: GET
    path: "/remittances/{id}"
    description: "Get a remittance"
    roles: [Any]
    code: 200
    input: []
    output: Remittance
    side_effects: []
  - method: POST
    path: "/remittances/{id}/allocate"
    description: "Auto-waterfall allocation across the payer's eligible demands (issued_at ASC, created_at ASC)"
    roles: [PFSAccountant]
    code: 201
    input: []
    output: "OffsetTransaction[]"
    side_effects: ["offsets created per waterfall; demands + remittance recomputed; OFFSET_APPLIED events"]
  - method: GET
    path: "/remittances/{id}/offset-transactions"
    description: "List offsets drawn on a remittance"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "OffsetTransaction[]"
    side_effects: []
  - method: GET
    path: "/recoupment-demands/{id}/offset-transactions"
    description: "List offsets applied to a demand"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "OffsetTransaction[]"
    side_effects: []
  - method: POST
    path: "/offset-transactions/{id}/reverse"
    description: "Reverse an applied offset"
    roles: [PFSAccountant]
    code: 200
    input: []
    output: OffsetTransaction
    side_effects: ["APPLIED -> REVERSED; demand outstanding + status recomputed; remittance credited; OFFSET_REVERSED event"]

  # --- Corrective action plans ---
  - method: POST
    path: "/corrective-action-plans"
    description: "Propose a corrective action plan for a payer+issue root cause"
    roles: [ComplianceOfficer]
    code: 201
    input: [payer_id, issue_code_id, title, root_cause]
    output: CorrectiveActionPlan
    side_effects: ["status=PROPOSED; proposed_by_user_id = X-User-ID; cycle_count=0"]
  - method: GET
    path: "/corrective-action-plans"
    description: "List corrective action plans"
    roles: [Any]
    code: 200
    input: ["payer_id?", "issue_code_id?", "status?", "limit?", "offset?"]
    output: "CorrectiveActionPlan[]"
    side_effects: []
  - method: GET
    path: "/corrective-action-plans/{id}"
    description: "Get a corrective action plan"
    roles: [Any]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: []
  - method: POST
    path: "/corrective-action-plans/{id}/activate"
    description: "Activate a proposed plan"
    roles: [DepartmentDirector]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["PROPOSED -> ACTIVE"]
  - method: POST
    path: "/corrective-action-plans/{id}/begin-effectiveness-check"
    description: "Begin the effectiveness-check window"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["ACTIVE -> EFFECTIVENESS_CHECK; check_started_at = now"]
  - method: POST
    path: "/corrective-action-plans/{id}/verify"
    description: "Verify plan effectiveness (segregation of duties enforced)"
    roles: [InternalAuditor]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["EFFECTIVENESS_CHECK -> VERIFIED; verified_by_user_id set"]
  - method: POST
    path: "/corrective-action-plans/{id}/mark-ineffective"
    description: "Mark the plan ineffective (loops back to ACTIVE, or FAILED at cycle limit)"
    roles: [InternalAuditor]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["EFFECTIVENESS_CHECK -> ACTIVE (cycle_count++) or -> FAILED when cycle_count+1 >= CAP_MAX_CYCLES"]

  # --- Analytics ---
  - method: GET
    path: "/analytics/success-rates"
    description: "Overturn success-rate analytics grouped by (payer_id, issue_code_id); SIMPLE or DOLLAR_WEIGHTED variant"
    roles: [Any]
    code: 200
    input: ["payer_id?", "issue_code_id?", "from?", "to?", "variant?", "limit?", "offset?"]
    output: "{ rows: array }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is not in the endpoint's allowed roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, non-positive amount, service_end_date <= service_start_date" }
  - { id: ERR_ANALYTICS_WINDOW_INVALID, http: 422, condition: "Analytics query with from >= to" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not exist" }
  - { id: ERR_PAYER_MISMATCH, http: 403, condition: "PayerAgent X-User-ID does not match the target resource's payer" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource is in a state that forbids the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_REQUIRES_DIRECTOR, http: 403, condition: "Case close with net_exposure_cents >= DIRECTOR_CLOSE_THRESHOLD_CENTS attempted by non-Director" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "CAP verify attempted by the same X-User-ID that proposed the plan" }
  - { id: ERR_CAP_WINDOW_NOT_ELAPSED, http: 409, condition: "CAP verify before check_started_at + CAP_EFFECTIVENESS_WINDOW_DAYS" }
  - { id: ERR_APPEAL_DEADLINE_PASSED, http: 409, condition: "Appeal filing when logical clock now > filed_deadline_at" }
  - { id: ERR_PAYER_SUSPENDED, http: 409, condition: "New audit case for a SUSPENDED payer" }
  - { id: ERR_DUPLICATE_ISSUE_CODE, http: 409, condition: "Issue code create reusing an existing code value" }
  - { id: ERR_CONCURRENT_AUDIT_CAP, http: 409, condition: "New audit case when payer's open (non-CLOSED) case count >= concurrent_audit_cap" }
  - { id: ERR_DUPLICATE_CLAIM_IN_OPEN_AUDIT, http: 409, condition: "Claim line overlaps (same payer + claim_number, half-open service interval) a line in another non-CLOSED case" }
  - { id: ERR_LINE_NOT_APPEALABLE, http: 409, condition: "Appeal creation on a line not in {DENIED, PARTIALLY_DENIED}, or while another appeal for the line is in {DRAFT, PENDING_DECISION}" }
  - { id: ERR_APPEAL_LEVEL_NOT_AVAILABLE, http: 409, condition: "Next appeal level exceeds the payer track maximum (MEDICARE 5, COMMERCIAL 3) or prior appeal not in a DECIDED_* state" }
  - { id: ERR_EVIDENCE_PACKET_NOT_READY, http: 409, condition: "LEVEL_3 appeal filing without an existing packet in READY or SUBMITTED" }
  - { id: ERR_PACKET_ALREADY_EXISTS, http: 409, condition: "Second evidence packet for the same appeal" }
  - { id: ERR_PACKET_IMMUTABLE, http: 409, condition: "Item mutation or creation on a SUBMITTED packet" }
  - { id: ERR_OPEN_APPEALS_EXIST, http: 409, condition: "Case close / demand write-off while appeals are in {DRAFT, PENDING_DECISION}, or close with non-terminal lines or unsettled demands" }
  - { id: ERR_CROSS_PAYER_ALLOCATION, http: 409, condition: "Manual offset whose remittance and demand belong to different payers" }
  - { id: ERR_DEMAND_ON_HOLD, http: 409, condition: "Manual offset targeting a demand in ON_HOLD" }
  - { id: ERR_DEMAND_EXCEEDS_DENIED, http: 409, condition: "Demand principal > case.total_denied_active_cents, or adjusted principal < already-applied principal" }
  - { id: ERR_OFFSET_EXCEEDS_OUTSTANDING, http: 409, condition: "Manual offset amount > min(remittance.available_cents, demand outstanding principal + accrued interest)" }
  - { id: ERR_DETERMINATION_INCOMPLETE, http: 422, condition: "Determination outcomes do not cover every UNDER_AUDIT line exactly once" }
  - { id: ERR_DETERMINATION_LINE_INVALID, http: 422, condition: "Determination outcome references a claim_line_id not belonging to this case" }
  - { id: ERR_DETERMINATION_AMOUNT_INVALID, http: 422, condition: "DENIED outcome with denied != billed; PARTIALLY_DENIED with denied <= 0 or >= billed; decision upheld_cents inconsistent with outcome (FAVORABLE must be 0, UNFAVORABLE must equal appealed_denied_cents, PARTIAL strictly between)" }

constants:
  DIRECTOR_CLOSE_THRESHOLD_CENTS: 2500000
  CAP_EFFECTIVENESS_WINDOW_DAYS: 14
  CAP_MAX_CYCLES: 3
  DEFAULT_OVERTURN_BP: 5000
  INTEREST_PERIOD_DAYS: 30
  CLOCK_DEFAULT: "2026-08-01T00:00:00Z"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RevenueCycleAdmin
    description: "Platform administrator: payer/issue-code configuration, logical clock, payer suspension"
    identity: opaque
    exclusive_operations:
      - "POST /payers, POST /payers/{id}/suspend, POST /payers/{id}/reactivate"
      - "POST /issue-codes"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /audit-cases (with HIMCoordinator)"
  - name: HIMCoordinator
    description: "Health information management: audit intake, claim lines, records submission"
    identity: opaque
    exclusive_operations:
      - "POST /audit-cases/{id}/claim-lines"
      - "POST /audit-cases/{id}/records-submissions"
    shared_operations:
      - "POST /audit-cases (with RevenueCycleAdmin)"
      - "POST /audit-cases/{id}/close (with DepartmentDirector; director-only above exposure threshold)"
  - name: AppealsSpecialist
    description: "Appeals team: appeal drafting/filing/withdrawal, evidence packet assembly"
    identity: opaque
    exclusive_operations:
      - "POST /claim-lines/{id}/appeals, POST /appeals/{id}/file, POST /appeals/{id}/withdraw"
      - "POST /appeals/{id}/evidence-packet, POST /evidence-packets/{id}/items, .../attach, .../detach, POST /evidence-packets/{id}/submit"
    shared_operations: []
  - name: DepartmentDirector
    description: "Director authority: plan activation, required-item waivers, high-exposure case closure, write-offs"
    identity: opaque
    exclusive_operations:
      - "POST /corrective-action-plans/{id}/activate"
      - "POST /evidence-packets/{id}/items/{itemId}/waive"
    shared_operations:
      - "POST /audit-cases/{id}/close (with HIMCoordinator)"
      - "POST /recoupment-demands/{id}/write-off (with PFSAccountant)"
  - name: PFSAccountant
    description: "Patient financial services: recoupment offsets, allocation, reversals, write-offs"
    identity: opaque
    exclusive_operations:
      - "POST /recoupment-demands/{id}/offsets"
      - "POST /remittances/{id}/allocate"
      - "POST /offset-transactions/{id}/reverse"
    shared_operations:
      - "POST /recoupment-demands/{id}/write-off (with DepartmentDirector)"
  - name: ComplianceOfficer
    description: "Compliance: proposes corrective action plans and runs effectiveness checks"
    identity: opaque
    exclusive_operations:
      - "POST /corrective-action-plans"
      - "POST /corrective-action-plans/{id}/begin-effectiveness-check"
    shared_operations: []
  - name: InternalAuditor
    description: "Internal audit: verifies or rejects corrective action plans (segregated from proposer)"
    identity: opaque
    exclusive_operations:
      - "POST /corrective-action-plans/{id}/verify"
      - "POST /corrective-action-plans/{id}/mark-ineffective"
    shared_operations: []
  - name: PayerAgent
    description: "Payer-side operator: reviews, determinations, appeal decisions, demands, remittances. X-User-ID MUST equal the Payer.id acted upon."
    identity: "entity_backed:Payer"
    exclusive_operations:
      - "POST /audit-cases/{id}/begin-payer-review, POST /audit-cases/{id}/determination"
      - "POST /appeals/{id}/decision"
      - "POST /audit-cases/{id}/recoupment-demands, POST /recoupment-demands/{id}/adjustments"
      - "POST /remittances"
    shared_operations: []
  - name: System
    description: "Automation role: clock-evaluated auto-transitions and cascades (no direct endpoint access)"
    identity: opaque
    exclusive_operations: []
    shared_operations: []
  - name: Any
    description: "Any authenticated role may call read endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
