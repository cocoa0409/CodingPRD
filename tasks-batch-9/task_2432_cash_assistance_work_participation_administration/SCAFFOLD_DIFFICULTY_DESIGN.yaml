  - rule_id: transitive_cascade
    instances:
      - name: verified_shortfall_report_cascades_to_episode_and_service_hold
        grounds:
          - state_machines.ParticipationReport.SUBMITTED_to_VERIFIED
          - state_machines.SupportiveServiceAuthorization.REQUESTED_to_HELD
          - state_machines.AssistanceCase.compliance_status
          - calculations.participation_credit
          - entities.WorkAssignment.fields.compliance_flag
          - entities.ComplianceEpisode.fields.origin
        distinguishing_aspect: |
          CASCADE A is four causal hops deep from one call: verifying the report
          (hop 1) recomputes the assignment's cumulative hours and raises
          compliance_flag SHORTFALL (hop 2), which auto-creates a
          SYSTEM_SHORTFALL ComplianceEpisode and moves the case to
          CONCILIATION_PENDING (hop 3), which puts the case's REQUESTED
          transportation authorization on HELD (hop 4) — an entity three
          relationship hops away from the report that was verified.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 with countable income 29000 is ACTIVE with benefit_amount_cents 17000, compliance_status ASSIGNED, required_monthly_hours 120 and required_core_monthly_hours 80; assistance issued for 2026-08."
            - "An ACTIVE core COMMUNITY_SERVICE assignment of 20 weekly hours runs 2026-08-01 up to 2026-12-01."
            - "A REQUESTED TRANSPORTATION authorization for 30000 covering 2026-08-01..2026-08-31 hangs off that assignment."
            - "A SUBMITTED TIMESHEET participation report for 2026-08 reports 40 hours."
