            - "call 9 returns HTTP 201"
            - "MileSaleAgreement.${agr_id}.drawn_miles == 0"
            - "AwardInventoryWindow.${win_id}.seats_held == 2"
            - "GET /mile-purchase-orders?agreement_id=${agr_id} returns total_count 2"
            - "GET /award-bookings?window_id=${win_id} returns total_count 2"
            - "GET /deferred-revenue-postings?program_id=${prog_id} returns total_count 1"

      - name: load_factor_crossing_nine_thousand_bps_lifts_the_demand_multiplier_to_sixteen_thousand
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.award_dynamic_pricing.constants.DEMAND_MULTIPLIER_LADDER_BPS
          - state_machines.AwardInventoryWindow
          - errors.ERR_AWARD_WINDOW_CLOSED
        distinguishing_aspect: "Nine of ten seats price at the 9000 bps floor multiplier (22500 per seat) because the ladder reads the PRE-booking load of 0; the tenth seat, quoted at a pre-load of exactly 9000 bps, jumps to 16000 bps and 40000 miles - a 78 percent step - and the eleventh request is refused with ERR_AWARD_WINDOW_CLOSED once load_factor_bps reaches 10000."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE (holds do not debit miles)."
            - "One empty AwardInventoryWindow JFK-CDG ECONOMY 2026-09-01..2026-09-30, authorized_seats 10."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Ladder", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-LADDER", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /award-inventory-windows"
              payload: { program_id: "${prog_id}", route_code: "JFK-CDG", cabin: "ECONOMY", window_start_date: "2026-09-01", window_end_date: "2026-09-30", authorized_seats: 10 }
              as: ProgramAdmin
              captures: { win_id: "$.data.id", win_v1: "$.data.version" }
          trigger:
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-10", seats: 9, fare_class: "FLEX", expected_window_version: "${win_v1}" }
              as: ProgramAdmin
              captures: { bk_nine: "$.data.id" }
            - call: "GET /award-inventory-windows/${win_id}"
              payload: {}
              as: ProgramAdmin
              captures: { win_v2: "$.data.version", load2: "$.data.load_factor_bps" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-11", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v2}" }
              as: ProgramAdmin
              captures: { bk_tenth: "$.data.id" }
            - call: "GET /award-inventory-windows/${win_id}"
              payload: {}
              as: ProgramAdmin
              captures: { win_v3: "$.data.version" }
            - call: "POST /award-bookings"
              payload: { member_id: "${mem_id}", window_id: "${win_id}", travel_date: "2026-09-12", seats: 1, fare_class: "FLEX", expected_window_version: "${win_v3}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "AwardBooking.${bk_nine}.demand_multiplier_bps_applied == 9000"
            - "AwardBooking.${bk_nine}.quoted_miles == 202500"
            - "AwardBooking.${bk_nine}.surcharge_band == SURCHARGE_LOW"
            - "AwardBooking.${bk_nine}.cash_surcharge_cents == 5040"
            - "after the first booking AwardInventoryWindow.${win_id}.load_factor_bps == 9000 and capacity_control_state == CONSTRAINED and demand_multiplier_bps == 16000"
            - "AwardBooking.${bk_tenth}.demand_multiplier_bps_applied == 16000"
            - "AwardBooking.${bk_tenth}.quoted_miles == 40000"
            - "AwardBooking.${bk_tenth}.surcharge_band == SURCHARGE_MID"
            - "AwardBooking.${bk_tenth}.cash_surcharge_cents == 1120"
            - "AwardInventoryWindow.${win_id}.load_factor_bps == 10000"
            - "AwardInventoryWindow.${win_id}.capacity_control_state == CLOSED"
            - "the fifth trigger returns HTTP 409 with data.error_id == ERR_AWARD_WINDOW_CLOSED"
            - "AwardInventoryWindow.${win_id}.seats_held == 10"

