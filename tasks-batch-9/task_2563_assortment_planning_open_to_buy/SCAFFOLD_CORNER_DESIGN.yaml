            - "the five entity types with zero stored rows still answer with their own specific code rather than an empty-table generic"

      - name: missing_caller_identity_is_401_before_anything_else
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1].ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 sits above every other check, so an empty X-User-ID must yield 401 even when the SAME request would otherwise fail with a 404, a 403 or a 400: the unknown path id, the wrong role and the malformed body are all invisible until identity resolves. A server that resolved the path id first would answer 404, and one that checked the role list first would answer 403."
        test_recipe:
          setup:
            - "one Department exists"
          setup_api_calls:
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
          trigger:
            - call: "GET /otb/departments/${dept_id}"
              payload: {}
              as: MerchandisePlanner
              as_user_id: ""
              captures: { e1: $.data.error_id }
