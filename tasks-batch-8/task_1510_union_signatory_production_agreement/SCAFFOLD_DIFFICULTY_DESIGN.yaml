            - { call: "POST /union-compliance/crew-assignments/${cam_id}/transition", payload: { to_state: "ACTIVE" }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/work-day-logs", payload: { crew_assignment_id: "${cam_id}", work_date: "2026-08-10", call_time_minutes: 480, wrap_time_minutes: 960, meal_breaks: [ { start_minutes: 600, end_minutes: 630 } ] }, as: ProducerRep, as_user_id: "${co_id}", captures: { log_id: $.data.id } }
