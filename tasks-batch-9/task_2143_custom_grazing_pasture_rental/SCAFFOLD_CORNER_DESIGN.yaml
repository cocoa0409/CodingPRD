# =============================================================================
# 1.9 Scaffold Corner Design (breadth coverage of every other testable claim)
# Custom Grazing & Pasture Rental — task 2143
# Sections and claim_types come from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_pasture_returns_draft_with_zero_ratings_and_open_posture
        claim_type: creation
        grounds:
          - endpoints[POST /grazing/pastures]
          - entities.Pasture.fields.operational_status
          - entities.Pasture.fields.rated_head_days
        distinguishing_aspect: "A freshly created Pasture is 201 CREATED with operational_status DRAFT, rated_aum 0, rated_head_days 0, effective_assessment_id null, stocked_head_count 0 and grazing_posture OPEN."
        test_recipe:
          setup: ["One Grazier is registered and no pastures exist."]
          setup_api_calls:
            - call: "POST /grazing/graziers"
              payload: { business_name: "Bitterroot Custom Grazing", state_code: "MT", liability_carrier: "Farm Mutual" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
          trigger:
            - call: "POST /grazing/pastures"
              payload: { name: "North Bench", acres: 1200, forage_type: "NATIVE_RANGE", water_source_type: "WELL", fence_class: "CLASS_B", prior_season_head_days: 5000 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { p1: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Pasture.${p1}.grazier_id == ${g1}"
            - "Pasture.${p1}.operational_status == DRAFT"
            - "Pasture.${p1}.rated_aum == 0"
            - "Pasture.${p1}.rated_head_days == 0"
            - "Pasture.${p1}.effective_assessment_id == null"
            - "Pasture.${p1}.stocked_head_count == 0"
            - "Pasture.${p1}.grazing_posture == OPEN"
            - "Pasture.${p1}.version == 1"

      - name: get_contract_by_id_returns_the_stored_row_with_both_dimensions
        claim_type: retrieval
        grounds:
          - endpoints[GET /grazing/contracts/{id}]
          - entities.GrazingContract.fields.lifecycle_status
          - entities.GrazingContract.fields.billing_status
        distinguishing_aspect: "GET /grazing/contracts/{id} echoes every stored input field plus the derived committed_head_days and both state dimensions."
        test_recipe:
          setup: ["A DRAFT contract K1 for 150 head over the 92-day window 2026-08-10 to 2026-11-10 exists on an AVAILABLE pasture."]
          setup_api_calls:
            - call: "POST /grazing/graziers"
              payload: { business_name: "Bitterroot Custom Grazing", state_code: "MT", liability_carrier: "Farm Mutual" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /grazing/cattle-owners"
              payload: { legal_name: "Sixteen Mile Cattle Co", state_code: "MT", brand_registration: "MT-4471", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /grazing/range-consultants"
              payload: { full_name: "Dana Reyes", certification_number: "RC-1102", state_code: "MT" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /grazing/pastures"
              payload: { name: "North Bench", acres: 1200, forage_type: "NATIVE_RANGE", water_source_type: "WELL", fence_class: "CLASS_B", prior_season_head_days: 5000 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { p1: $.data.id, p1_v0: $.data.version }
            - call: "POST /grazing/pastures/${p1}/capacity-assessments"
              payload: { expected_pasture_version: "${p1_v0}", method: "DRY_MATTER", forage_dry_matter_lbs_per_acre: 1800, utilization_pct: 25, assessment_date: "2026-07-15" }
              as: RangeConsultant
              as_user_id: "${c1}"
              captures: { a1: $.data.id }
            - call: "POST /grazing/pastures/${p1}/status"
              payload: { to_status: "AVAILABLE" }
              as: Grazier
              as_user_id: "${g1}"
            - call: "POST /grazing/contracts"
              payload: { cattle_owner_id: "${o1}", pasture_id: "${p1}", billing_mode: "PER_POUND_OF_GAIN", rate_cents: 85, shrink_pct: 3.5, out_shrink_pct: 0, head_count_committed: 150, head_value_cents: 140000, start_date: "2026-08-10", end_date: "2026-11-10", min_days: 60, treatment_cost_split_pct: 33, water_responsibility: "SHARED", fence_responsibility: "GRAZIER", infrastructure_owner_cap_cents: 100000, death_loss_terms: "GRAZIER_SHARE_ABOVE_THRESHOLD", death_loss_threshold_pct: 2.0 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { k1: $.data.id }
          trigger:
            - call: "GET /grazing/contracts/${k1}"
              payload: {}
              as: CattleOwner
              as_user_id: "${o1}"
          assert:
            - "HTTP status is 200"
            - "GrazingContract.${k1}.grazier_id == ${g1} and cattle_owner_id == ${o1} and pasture_id == ${p1}"
            - "GrazingContract.${k1}.committed_head_days == 13800"
            - "GrazingContract.${k1}.lifecycle_status == DRAFT"
            - "GrazingContract.${k1}.billing_status == UNBILLED"
            - "GrazingContract.${k1}.rate_cents == 85 and shrink_pct == 3.5"

      - name: list_contracts_returns_pagination_envelope_and_filters_by_owner
        claim_type: listing
        grounds:
          - endpoints[GET /grazing/contracts]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /grazing/contracts?limit=1&offset=0 returns exactly one row with total_count 2 and has_more true; adding cattle_owner_id narrows the set to that owner's single contract."
        test_recipe:
          setup: ["Two DRAFT contracts exist on the same pasture for two different cattle owners."]
          setup_api_calls:
            - call: "POST /grazing/graziers"
              payload: { business_name: "Bitterroot Custom Grazing", state_code: "MT", liability_carrier: "Farm Mutual" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /grazing/cattle-owners"
              payload: { legal_name: "Sixteen Mile Cattle Co", state_code: "MT", brand_registration: "MT-4471", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /grazing/range-consultants"
