  - rule_id: resource_temporal_overlap
    instances:

      - name: season_closed_interval_rejects_touching_endpoint_on_same_lease
        grounds:
          - validations[priority=34]
          - errors[ERR_SEASON_OVERLAP]
          - state_machines.OperatingPlan.SUBMITTED_to_APPROVED
          - entities.OperatingPlan.season_start
          - entities.OperatingPlan.season_end
        distinguishing_aspect: |
          The contended resource is a single Lease and the interval semantics are CLOSED on
          both ends, so a season whose start equals an approved season's end DOES collide:
          approving 2027-12-31..2028-03-31 against an approved 2027-03-01..2027-12-31 is
          refused on the shared 2027-12-31 endpoint, while 2028-01-01..2028-03-31 — one day
          later — is accepted. Only APPROVED plans occupy the resource; the SUBMITTED
          sibling does not block anything.
