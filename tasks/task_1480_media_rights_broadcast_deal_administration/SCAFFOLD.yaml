  - offset?
  - conflict_type?
  - left_entity_id?
  - right_entity_id?
  - asset_id?
  output: RightsConflict[]
  side_effects: []
- method: GET
  path: /rights-conflicts/{conflictId}
  description: Get a rights conflict
  roles:
  - RightsManager
  - BidCoordinator
  - FinanceController
  - ProductionAuditor
  - ComplianceOfficer
  code: 200
  input: []
  output: RightsConflict
  side_effects: []

