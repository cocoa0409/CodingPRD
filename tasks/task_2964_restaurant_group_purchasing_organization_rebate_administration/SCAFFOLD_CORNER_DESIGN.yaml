              payload: { name: "Sysco Northeast", dba_code: "SYSCO-02", contracted_markup_bps: 600 }
              as: GpoAdmin
              captures: { dist2_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa1_id: $.data.id }
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist2_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_ONLY" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa2_id: $.data.id }
            - call: "POST /authorization-letters/${loa2_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist2_id}"
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2028-01-01T00:00:00.000Z", effective_to: "2029-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_ONLY" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa3_id: $.data.id }
            - call: "POST /authorization-letters/${loa3_id}/countersign"
              payload: { decision: "DECLINE" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
          trigger:
            - call: "POST /members/${m1_id}/terminate"
              as: GpoAdmin
          assert:
            - "before the trigger: Member.${m1_id}.active_letter_count == 2, Distributor.${dist_id}.active_letter_count == 1, Distributor.${dist2_id}.active_letter_count == 1"
