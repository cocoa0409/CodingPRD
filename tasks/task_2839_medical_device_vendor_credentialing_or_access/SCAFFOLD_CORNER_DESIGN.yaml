              captures: { cred_fay_coi_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_fay_coi_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_fay_id}", credential_type: "BACKGROUND_CHECK", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BGC-FI-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_fay_bgc1_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_fay_bgc1_id}/decide"
              payload: { decision: "REJECT", rejection_reason: "Screening vendor could not confirm the identity documents" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_fay_id}", credential_type: "BACKGROUND_CHECK", issued_at_utc: "2026-07-15T00:00:00Z", expires_at_utc: "2027-07-15T00:00:00Z", document_reference: "BGC-FI-02" }
              as: CredentialingOfficer
