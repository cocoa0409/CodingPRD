              as: AuthorizerStaff
            - call: "POST /authorizer/schools/${school_id}/lotteries"
              payload: { academic_year: 2028, capacity: 5 }
              as: AuthorizerStaff
              captures: { lot_id: $.data.id }
            - call: "POST /authorizer/lotteries/${lot_id}/open"
              payload: {}
              as: AuthorizerStaff
            - call: "POST /authorizer/lotteries/${lot_id}/entries"
              payload: { student_ref: "stu_s5", grade_level: "K", preference_codes: [] }
              as: SchoolOperator
              as_user_id: "${school_id}"
          trigger:
            - call: "POST /authorizer/lotteries/${lot_id}/execute"
              payload: {}
              as: AuthorizerStaff
              captures: { err: $.data.error_id }
          assert:
            - "captured error_id == 'ERR_LOTTERY_INVALID_STATE'"
            - "Lottery.${lot_id}.status == 'OPEN' and its entry has rank_position == null"

      - name: sm_decline_entered_entry_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LotteryEntry, "errors[ERR_ENTRY_INVALID_STATE]"]
        distinguishing_aspect: "decline requires outcome OFFERED; declining an ENTERED entry (lottery not yet executed) fails with ERR_ENTRY_INVALID_STATE."
        test_recipe:
          setup: ["school OPEN (standard fixture); lottery 2028 OPEN with one entry still ENTERED"]
          setup_api_calls:
            - call: "POST /authorizer/applications"
              payload: { school_name: "SM Decline Academy", founding_group: "FG S6", cycle_year: 2027, proposed_grades: "K-8" }
              as: Applicant
              as_user_id: applicant_s6
              captures: { app_id: $.data.id }
            - call: "POST /authorizer/applications/${app_id}/accept-intake"
              payload: {}
