          setup: ["project P (SCHEMATIC_DESIGN); lod requirement STRUCTURAL/SCHEMATIC_DESIGN min 300; partner P1; models M299 (lod 299), M300 (lod 300); partner P4 PLUMBING with model MP (no requirement row for PLUMBING)"]
