            - { call: "POST /charters", payload: { casualty_id: "${cas_id}", equipment_asset_id: "${eq_id}", window_start: "2026-05-10T00:00:00Z", window_end: "2026-05-24T00:00:00Z", purpose: SALVAGE }, as: SalvageMaster, as_user_id: "sm-01", captures: { ch_id: $.data.id } }
