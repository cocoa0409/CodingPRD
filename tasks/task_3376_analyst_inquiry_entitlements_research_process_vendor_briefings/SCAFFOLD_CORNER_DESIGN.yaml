            - "the briefing request returns 403 and err_sep == ERR_BRIEFING_SEPARATION_FAILED"
            - "GET /research/vendor-briefings returns 0 rows"

      - name: finalize_include_below_the_criteria_floor_returns_inclusion_criteria_not_met
        claim_type: Violation → Error
