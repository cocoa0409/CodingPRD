            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "Q-0002", initial_custody_state: "QUARANTINED" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
