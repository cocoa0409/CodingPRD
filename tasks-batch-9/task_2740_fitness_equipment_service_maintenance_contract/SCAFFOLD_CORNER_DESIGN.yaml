            - "${after_prov} == 0 and ${after_closed} == 0 and open_event_count == 0 and reconciled_event_count == 0"
            - "the waived event keeps its audit numbers: downtime_minutes == 360 and provisional_credit_cents == 4800 on the row"
            - "Equipment.${e1_id}.downtime_minutes_ytd == 0 after the waive"
