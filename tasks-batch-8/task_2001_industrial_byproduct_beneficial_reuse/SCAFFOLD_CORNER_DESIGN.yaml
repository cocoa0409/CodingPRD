        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "Entity-backed ownership: a Generator whose X-User-ID differs from the agreement's generator_id gets 403 ERR_OWNERSHIP_MISMATCH at priority 3, before existence/state checks on the rest of the payload."
        test_recipe:
          setup: ["generators gA and gB; gA has a stream and a DRAFT agreement; offtaker with a DRAFT commitment on that stream"]
          setup_api_calls:
