            - "PERIOD NOT ENDED: HTTP 422 with error_id ERR_BILLING_PERIOD_NOT_ENDED, because date(clock_now) 2026-08-01 is not strictly greater than end_date 2026-08-31"
            - "DUPLICATE BILL: HTTP 409 with error_id ERR_DUPLICATE_BILL_FOR_PERIOD — the existing bill is ISSUED, not REBILLED, so it still occupies the meter-period slot"
            - "FUTURE READ: HTTP 422 with error_id ERR_READ_DATE_IN_FUTURE, because read_date 2026-09-01 is after date(clock_now) 2026-08-01"
            - "BACKWARD ACTUAL READ: HTTP 422 with error_id ERR_NEGATIVE_CONSUMPTION, because 99000 is below the latest live read 100000"
            - "GET /meter-readings?meter_id=${meter_y_id} returns total_count 1 after the two refusals — neither rejected read was persisted"
            - "The forward ACTUAL read of 104000 is accepted, and the CORRECTED read of 102000 is accepted even though 102000 is below the live 104000: read_type CORRECTED is exempt from the ERR_NEGATIVE_CONSUMPTION rule"
            - "After the correction GET /meter-readings?meter_id=${meter_y_id}&live_only=true returns total_count 2 and the 104000 row carries superseded_by_reading_id"

      - name: corner_error_leak_adjustment_without_a_verified_proof_is_refused
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REPAIR_PROOF_REQUIRED]
          - validations[priority 11 ERR_REPAIR_PROOF_REQUIRED]
          - state_machines.HighBillInvestigation
        distinguishing_aspect: |
          A determination of IRRIGATION_USE needs no verified plumber proof to be recorded, so the
          investigation legitimately reaches DETERMINED with a proof still sitting in SUBMITTED. That is
          the only state from which ERR_REPAIR_PROOF_REQUIRED is observable: the adjustment draft is
          refused at priority 11 because SUBMITTED is not VERIFIED, and because the determination is not
          METER_ERROR the exemption does not apply. The OCC token supplied is current, so a 412 cannot
          be mistaken for the business refusal.
        test_recipe:
          setup:
            - "CHAIN-BASE-A: RS-STD-2026, SUMMER periods 2025-06, 2025-07, 2025-08 and 2026-07, account ACC-1001 with master meter MTR-A-1 and reads 100000 / 104000 / 108000 / 112000 / 153000, and four ISSUED bills (5210, 5210, 5210, 44939). The clock is 2026-08-01T00:00:00Z."
            - "An investigation is OPEN on the 2026-07 bill, evidence has been requested, and one RepairProof of leak_type IRRIGATION sits in SUBMITTED, so the investigation is EVIDENCE_UNDER_REVIEW."
            - "The determination IRRIGATION_USE has been recorded, which requires no VERIFIED proof."
