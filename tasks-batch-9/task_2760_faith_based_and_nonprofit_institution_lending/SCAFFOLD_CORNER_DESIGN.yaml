      - name: seasoning_haircut_starts_one_day_past_the_seasoning_window
        claim_type: threshold
        grounds:
          - calculations.collateral_special_purpose_lending_value.constants.APPRAISAL_SEASONING_DAYS
          - calculations.collateral_special_purpose_lending_value.constants.SEASONED_APPRAISAL_FACTOR
          - entities.CollateralAsset.fields.appraisal_age_days
        distinguishing_aspect: "The seasoning test is strict: an appraisal_age_days of exactly 365 keeps factor 1.00 (60000000) while 366 applies 0.90 (54000000), so an off-by-one comparison is visible as a 6000000-cent gap between two otherwise identical halls."
        test_recipe:
          setup:
            - "One institution; clock pinned to 2026-08-01 so 2025-08-01 is exactly 365 days old and 2025-07-31 is 366."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
          trigger:
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "FELLOWSHIP_HALL", description_label: "North fellowship hall", appraised_value_cents: 100000000, appraisal_date: "2025-08-01T00:00:00Z", alternative_use_score: 3 }
              as: CreditAnalyst
              captures: { asset_365: $.data.id }
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "FELLOWSHIP_HALL", description_label: "South fellowship hall", appraised_value_cents: 100000000, appraisal_date: "2025-07-31T00:00:00Z", alternative_use_score: 3 }
              as: CreditAnalyst
              captures: { asset_366: $.data.id }
          assert:
            - "First response: data.appraisal_age_days == 365 and data.lending_value_cents == 60000000 (no haircut at the boundary itself)"
            - "Second response: data.appraisal_age_days == 366 and data.lending_value_cents == 54000000 (floor(60000000 * 0.90))"
            - "Neither asset is stale: 366 is far below APPRAISAL_STALE_DAYS 730, so both remain assignable"

