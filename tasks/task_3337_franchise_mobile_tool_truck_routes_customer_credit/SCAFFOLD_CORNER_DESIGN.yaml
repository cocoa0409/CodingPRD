            - "CreditApplication.${ap_id}.application_status == SUBMITTED"

      - name: validation_duplicate_route_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_ROUTE_CODE_DUPLICATE]"]
        distinguishing_aspect: "route_code is globally unique across franchisees: a second route carrying an already-used code is refused with ERR_ROUTE_CODE_DUPLICATE 409 even though it belongs to a different franchisee."
        test_recipe:
          setup: ["Two franchisees F1 and F2 exist; F1 already owns route code R1"]
