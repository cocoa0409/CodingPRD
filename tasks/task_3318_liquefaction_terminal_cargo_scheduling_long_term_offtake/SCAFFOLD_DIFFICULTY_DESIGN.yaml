            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-17T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot1: $.data.id } }
            - { call: "POST /api/adps/${adp}/cargo-slots", payload: { window_start: "2027-01-10T00:00:00Z", window_end: "2027-01-17T00:00:00Z", quantity_mmbtu: 3600000 }, as: CommercialManager, captures: { slot2: $.data.id } }
