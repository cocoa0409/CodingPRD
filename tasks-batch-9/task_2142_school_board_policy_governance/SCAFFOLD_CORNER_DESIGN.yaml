        claim_type: Authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication is checked before authorization and before existence: a POST with no X-User-Role header returns ERR_UNAUTHENTICATED at HTTP 401 and creates nothing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /governance/policies"
              payload: { code: "BP-4119", title: "Employee Conflict of Interest", category: "PERSONNEL", legal_requirement_level: "REQUIRED_BY_LAW", manual_section: "4000.19" }
              as: PolicyAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with NO X-User-Role and NO X-User-ID header despite the declared role"
            - "HTTP status == 401"
            - "response data.error_id == ERR_UNAUTHENTICATED"
            - "GET /governance/policies returns total_count == 0"

