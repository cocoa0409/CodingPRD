              as_user_id: "lo-1"
            - call: "POST /rehab/draw-requests/${draw1_id}/pay"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-1"
            - call: "POST /rehab/draw-requests"
              payload: { loan_id: "${loan_id}", contractor_id: "${c1_id}", requested_amount_cents: 1000000, is_final_draw: true }
              as: Contractor
              as_user_id: "${c1_id}"
              captures: { draw2_id: $.data.id }
            - call: "POST /rehab/inspections"
              payload: { application_id: "${app_id}", draw_request_id: "${draw2_id}", inspection_type: "DRAW", scheduled_start_at: "2026-11-20T13:00:00Z", scheduled_end_at: "2026-11-20T15:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp3_id: $.data.id }
            - call: "POST /rehab/inspections/${insp3_id}/record-result"
              payload: { result: "PASS", deficiency_count: 0 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /rehab/draw-requests/${draw2_id}/approve"
              payload: {}
