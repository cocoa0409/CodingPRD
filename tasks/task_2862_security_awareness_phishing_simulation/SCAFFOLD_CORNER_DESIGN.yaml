  - section: cross-cutting complexity layers
    instances:
      - name: stale_employee_version_rejected_on_both_employee_write_endpoints
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[assignment-create-stale-employee]
          - concurrency_rules[access-consequence-create-stale-employee]
          - errors[ERR_STALE_EMPLOYEE_VERSION]
          - complexity_profile.complexity_layers[optimistic_concurrency]
        distinguishing_aspect: "Both employee-scoped writes carry the same OCC field: a one-behind expected_employee_version returns ERR_STALE_EMPLOYEE_VERSION (412) on assignment creation and on consequence creation, the rejected calls leave Employee.version untouched, and a successful write bumps it by exactly one so the previously-current token goes stale."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE employee and one PUBLISHED ANNUAL module; the employee's current version is captured at creation."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "occ.probe@corp.example", full_name: "Otto Occ", department: "FINANCE", role_code: "FINANCE_APPROVER", hire_date: "2018-09-09" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "OCC-ANN", title: "OCC Probe Module", module_type: "ANNUAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "ANNUAL", expected_employee_version: "${e_v} - 1" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees/${e}/access-consequences", payload: { reason_code: "POLICY_BREACH_INVESTIGATION", expected_employee_version: "${e_v} - 1" }, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "ANNUAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
            - { call: "POST /awareness/employees/${e}/access-consequences", payload: { reason_code: "POLICY_BREACH_INVESTIGATION", expected_employee_version: "${e_v}" }, as: ProgramAdmin }
          assert:
            - "both one-behind calls return HTTP 412 with error_id ERR_STALE_EMPLOYEE_VERSION"
            - "after the rejected calls Employee.${e}.version is still ${e_v} and no assignment or consequence row exists"
            - "the assignment create with ${e_v} returns HTTP 201 and Employee.${e}.version becomes ${e_v} + 1"
            - "the consequence create replaying the now-stale ${e_v} returns HTTP 412 ERR_STALE_EMPLOYEE_VERSION"
            - "CurriculumAssignment.${a}.state == ASSIGNED and the employee still has access_posture NONE"

      - name: repeat_threshold_counts_deliveries_not_failure_events
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.repeat_clicker_tier
          - calculations.employee_risk_score
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        distinguishing_aspect: "The tier-2 threshold counts distinct failure deliveries, so a CLICK followed by a CREDENTIAL_SUBMIT on the SAME delivery leaves f == 1 and tier 1 with no intervention, while the risk score charges CREDENTIAL_WEIGHT once (18 x 1.10 == 19.80) instead of adding the click weight on top."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A RUNNING campaign on a capture-ENABLED template delivered 2026-08-02T09:00:00Z to one VETERAN employee."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "cass.cred@corp.example", full_name: "Cass Cred", department: "FINANCE", role_code: "FINANCE_APPROVER", hire_date: "2014-04-04" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Threshold Probe Template", pretext_category: "PASSWORD_EXPIRY", difficulty_tier: "TIER_2_TARGETED", theme_tags: ["URGENCY"], credential_capture_enabled: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "FIN Threshold Wave", template_id: "${tpl}", difficulty_tier: "TIER_2_TARGETED", target_departments: ["FINANCE"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-02T09:00:00Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${c}/launch", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c}", employee_id: "${e}" }, as: ProgramAdmin, captures: { d: "$.data[0].id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:31:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/simulation-deliveries/${d}/interactions", payload: { event_type: "CLICK", occurred_at: "2026-08-02T09:30:00Z", source: "LANDING_PAGE" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/simulation-deliveries/${d}/interactions", payload: { event_type: "CREDENTIAL_SUBMIT", occurred_at: "2026-08-02T09:31:00Z", source: "LANDING_PAGE" }, as: ProgramAdmin, captures: { seq: "$.data.sequence_index" } }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin, captures: { tier: "$.data.repeat_clicker_tier" } }
            - { call: "GET /awareness/interventions", payload: { employee_id: "${e}" }, as: ProgramAdmin }
          assert:
            - "the CREDENTIAL_SUBMIT returns HTTP 201 with sequence_index == 2"
            - "SimulationDelivery.${d}.state == CREDENTIAL_SUBMITTED (terminal) with first_click_at 09:30 and credential_submitted_at 09:31"
            - "Employee.${e}.repeat_clicker_tier == 1: two failure events on one delivery are one failure"
            - "the intervention list for ${e} is empty (the tier-2 threshold of 2 distinct deliveries was never reached)"
            - "Employee.${e}.risk_score_provisional == 19.80 and risk_score_settled == 0.00 (campaign still RUNNING)"

      - name: training_completion_cascade_lifts_consequences_and_expires_notices
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CurriculumAssignment.IN_PROGRESS_to_COMPLETED
          - state_machines.AccessConsequence.ACTIVE_to_LIFTED
          - state_machines.EscalationNotice.SENT_to_EXPIRED
          - complexity_profile.complexity_layers[cascading_side_effects]
        distinguishing_aspect: "Completion is the earned unwind of the whole four-hop chain: both ACTIVE consequences become LIFTED with lift_reason_code TRAINING_COMPLETED (not VOIDED, which is the compensated exit), all SENT notices become EXPIRED, and the employee returns to posture NONE and compliance COMPLIANT in one call."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A manager and a direct report; the report holds a REMEDIAL assignment due 2026-08-08T00:00:00Z on a module with passing_score_pct 80."
            - "The clock is advanced to 2026-08-22T00:00:00Z (14 days overdue) and one sweep drives the ladder to level 3: three notices and two consequences (ranks 2 and 3), posture SUSPENDED."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "mgr.cascade@corp.example", full_name: "Cara Manager", department: "IT", role_code: "MANAGER", hire_date: "2011-11-11" }, as: ProgramAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "rep.cascade@corp.example", full_name: "Carl Report", department: "IT", role_code: "IT_ADMIN", hire_date: "2019-12-12", manager_id: "${mgr}" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "CAS-REM", title: "Cascade Probe Remedial", module_type: "REMEDIAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "REMEDIAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { esc: "$.data.escalations_created_count", cons: "$.data.consequences_applied_count" } }
          trigger:
            - { call: "POST /awareness/curriculum-assignments/${a}/start", payload: {}, as: Learner, as_user_id: "${e}" }
            - { call: "POST /awareness/curriculum-assignments/${a}/submit", payload: { score_pct: 90 }, as: Learner, as_user_id: "${e}", captures: { st: "$.data.state" } }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/access-consequences", payload: { source_assignment_id: "${a}" }, as: ProgramAdmin }
            - { call: "GET /awareness/escalation-notices", payload: { assignment_id: "${a}" }, as: ProgramAdmin }
          assert:
            - "before the completion: escalation_level == 3, three notices SENT, two ACTIVE consequences with severity_rank 2 and 3, Employee.${e}.access_posture == SUSPENDED, active_suspension_count == 1, compliance_state == DELINQUENT"
            - "the submit returns HTTP 200 with state COMPLETED, completed_at == 2026-08-22T00:00:00Z, last_score_pct == 90, attempt_count == 1 and next_reminder_due_at == null"
            - "both consequences are now state LIFTED with lift_reason_code TRAINING_COMPLETED and lifted_at == 2026-08-22T00:00:00Z"
            - "all three notices are state EXPIRED with acknowledged_at == null"
            - "Employee.${e}.access_posture == NONE, active_suspension_count == 0, compliance_state == COMPLIANT, risk_score_provisional == 0.00 and risk_score_settled == 0.00"
            - "CurriculumAssignment.${a}.escalation_level is still 3: completion unwinds the consequences without rewriting the ladder history"

      - name: risk_score_settled_reconciles_when_the_campaign_closes
        claim_type: dual_variant_calculation
        grounds:
          - calculations.employee_risk_score
          - state_machines.PhishingCampaign.RUNNING_to_CLOSED
          - complexity_profile.complexity_layers[dual_variant_calculation]
        distinguishing_aspect: "Closing the campaign is the variant reconciliation event: the same click that scored 11.00 provisional and 0.00 settled while the campaign was RUNNING scores 11.00 in BOTH variants once the campaign is CLOSED, because the SETTLED input set only admits closed campaigns."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A single-member RUNNING campaign delivered 2026-08-02T09:00:00Z and clicked at 2026-08-02T09:30:00Z."
