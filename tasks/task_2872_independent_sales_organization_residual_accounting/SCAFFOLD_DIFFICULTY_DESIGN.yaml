              captures: { a1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A2 Regional", split_pct: 0.40, override_pct: 0.50, vesting_start_date: "2025-01-15", parent_agent_id: "${a1}" }
              as: IsoAdmin
              captures: { a2: $.data.id }
            - call: "POST /agents"
              payload: { name: "A3 Rep", split_pct: 0.45, override_pct: 0.45, vesting_start_date: "2026-02-01", parent_agent_id: "${a2}" }
              as: IsoAdmin
              captures: { a3: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a3}", processor_program_id: "${p1}", mid: "MID-1001", monthly_minimum_cents: 2500, per_transaction_fee_cents: 15, equipment_lease_monthly_cents: 3900, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m1}/chargebacks"
              payload: { amount_cents: 4500, occurred_on: "2026-07-12", period_month: "2026-07", liability: "AGENT_CHARGED" }
              as: ResidualAnalyst
            - call: "POST /merchants/${m1}/chargebacks"
              payload: { amount_cents: 12000, occurred_on: "2026-07-20", period_month: "2026-07", liability: "ISO_ABSORBED" }
              as: ResidualAnalyst
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:aaa1" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 1240, sales_volume_cents: 4812355, interchange_cents: 92140, assessments_cents: 6255, gross_income_cents: 168430 }
              as: ResidualAnalyst
              captures: { l1: $.data.id }
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
          trigger:
            - call: "POST /residual-batches/${b1}/reverse"
              payload: {}
              as: ResidualController
          assert:
            - "before the trigger: 1 profitability row, 3 allocations, 3 DRAFT statements (14643 / 1627 / 1627) and ProcessorProgram.${p1}.posted_batch_count == 1"
            - "GET /residual-allocations?merchant_id=${m1} returns total_count 0 and GET /merchant-profitability?residual_batch_id=${b1} returns total_count 0"
            - "GET /agent-statements?period_month=2026-07 still returns total_count 3, all DRAFT/UNSETTLED, each with direct_residual_cents 0, override_residual_cents 0, gross_after_trueup_cents 0, net_payable_cents 0 and carry_forward_deficit_cents 0"
            - "Agent.${a3}.trailing_residual_cents == 0, Agent.${a2}.trailing_residual_cents == 0, Agent.${a1}.trailing_residual_cents == 0"
            - "ResidualBatch.${b1}.state == REVERSED, iso_retained_cents == 0, posted_at == null, while line_count == 1, gross_volume_cents == 4812355 and total_normalized_net_revenue_cents == 40939 are preserved"
            - "ResidualLine.${l1}.normalized_net_revenue_cents == 40939 (the ingested file is not rewritten by the reversal)"
            - "ProcessorProgram.${p1}.posted_batch_count == 0"

      - name: statement_recall_conserves_advance_principal
        grounds:
          - state_machines.AgentStatement.lifecycle_ISSUED_to_DRAFT (COMPENSATION side effects)
          - state_machines.AgentAdvance.RECOUPED_to_ACTIVE
          - calculations.advance_recoupment_schedule
          - entities.Agent.fields.advance_outstanding_cents
        distinguishing_aspect: |
          The compensation has to walk backwards through an AUTO-transition: the single
          5000-cent final instalment drives outstanding_cents to 0 and flips the advance
          ACTIVE -> RECOUPED, so recall must restore outstanding_cents to 5000, undo
          cumulative_recouped_cents and months_recouped, and flip RECOUPED -> ACTIVE
          again. The invariant principal == outstanding + cumulative holds at all three
          observation points, and Agent.advance_outstanding_cents is re-derived twice.
        test_recipe:
          setup:
            - "Program P1, agent A1 (split 0.45) with merchant M1 (canonical July line, both chargebacks); the 2026-07 batch is POSTED, so A1's DRAFT statement is worth 14643."
            - "A single STRAIGHT_LINE advance: principal 5000, amortization_months 1, window 2026-07..2026-07, funded 2026-07-05 — its one instalment retires the whole principal."
            - "The statement is then ISSUED, which recoups 5000 and auto-transitions the advance to RECOUPED."
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "FirstAtlantic Core", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.45, override_pct: 0.45, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-1001", monthly_minimum_cents: 2500, per_transaction_fee_cents: 15, equipment_lease_monthly_cents: 3900, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m1}/chargebacks"
              payload: { amount_cents: 4500, occurred_on: "2026-07-12", period_month: "2026-07", liability: "AGENT_CHARGED" }
              as: ResidualAnalyst
            - call: "POST /merchants/${m1}/chargebacks"
              payload: { amount_cents: 12000, occurred_on: "2026-07-20", period_month: "2026-07", liability: "ISO_ABSORBED" }
              as: ResidualAnalyst
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:aaa1" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 1240, sales_volume_cents: 4812355, interchange_cents: 92140, assessments_cents: 6255, gross_income_cents: 168430 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
            - call: "GET /agents/${a1}"
              payload: {}
              as: IsoAdmin
              captures: { a1_v: $.data.version }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "STRAIGHT_LINE_AMORTIZATION", principal_cents: 5000, amortization_months: 1, first_recoupment_month: "2026-07", last_recoupment_month: "2026-07", funded_on: "2026-07-05", expected_agent_version: "${a1_v}" }
              as: IsoAdmin
              captures: { adv: $.data.id }
            - call: "GET /agent-statements"
              payload: { agent_id: "${a1}", period_month: "2026-07" }
              as: ResidualController
              captures: { st: "$.data[0].id" }
            - call: "POST /agent-statements/${st}/issue"
              payload: {}
              as: ResidualController
          trigger:
            - call: "POST /agent-statements/${st}/recall"
              payload: {}
              as: ResidualController
          assert:
            - "before the trigger (after issue): AgentAdvance.${adv}.outstanding_cents == 0, cumulative_recouped_cents == 5000, months_recouped == 1, state == RECOUPED; Agent.${a1}.advance_outstanding_cents == 0; AgentStatement.${st}.advance_recoupment_cents == 5000 and net_payable_cents == 9643"
            - "after the recall: AgentAdvance.${adv}.outstanding_cents == 5000, cumulative_recouped_cents == 0, months_recouped == 0 and state == ACTIVE again"
            - "after the recall: Agent.${a1}.advance_outstanding_cents == 5000"
            - "after the recall: AgentStatement.${st}.lifecycle_state == DRAFT, issued_at == null, minimum_true_up_cents == 0, advance_recoupment_cents == 0, gross_after_trueup_cents == 14643 and net_payable_cents == 14643"
            - "AgentAdvance.${adv}.principal_cents == outstanding_cents + cumulative_recouped_cents at all three observation points (before issue, after issue, after recall)"
            - "AgentStatement.${st}.settlement_state == UNSETTLED throughout   # the compensation touches only the lifecycle dimension"
