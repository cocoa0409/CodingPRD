              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob7_id}/complete_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob7_id}/activate"
              payload: {}
              as: PortfolioManager
