            - call: "POST /clerk/meetings"
              payload: { body_type: "BOARD_OF_ADJUSTMENT", meeting_type: "SPECIAL", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T20:00:00Z", quorum_required: 3 }
