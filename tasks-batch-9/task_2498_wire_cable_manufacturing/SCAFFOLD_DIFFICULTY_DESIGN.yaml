      - name: concentricity_exactly_at_sku_minimum_passes_extrusion
        grounds:
          - calculations.lot_dimensional_conformance
          - entities.ProductionLot.fields.concentricity_pct
          - endpoints.POST_/production-lots/{id}/process-steps
        metric: "ProductionLot.concentricity_pct against CatalogProduct.concentricity_min_pct = 85"
        boundary_endpoint: "POST /production-lots/{id}/process-steps (step=EXTRUSION)"
        boundary_triplet: "84.97 -> NONCONFORMING, exactly 85.00 -> PENDING (inclusive), 85.03 -> PENDING"
        distinguishing_aspect: |
          A third metric (a rounded ratio, not a raw measurement or a count) on a
          third endpoint. What makes it a precision check rather than a plain
          threshold check is that the comparison happens on the ROUNDED value:
          25.49 / 29.99... style inputs are chosen so that the unrounded ratio
          84.9666 rounds to 84.97 and fails, while 25.5 / 30.0 lands exactly on
          85.00 and passes. Both candidate lots clear the minimum-wall figure of
          25.20 mils, so concentricity is the only variable in play.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; copper 2026-07-30 at 4.10; QUALIFIED compounds; ACTIVE UL file."
            - "SKU THHN-12-CU with insulation_thickness_mils 28, min_wall_pct 90 (required minimum wall 25.20) and concentricity_min_pct 85."
            - "Order SO-CON for 10.000 kft; rod lot 20000 lbs; lots LOT-CON-OK (EXT-1) and LOT-CON-NG (EXT-2), both drawn and stranded and awaiting EXTRUSION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
