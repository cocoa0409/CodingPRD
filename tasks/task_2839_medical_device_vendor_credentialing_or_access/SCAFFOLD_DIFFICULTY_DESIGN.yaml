              payload: { case_rep_authorization_id: "${auth_9701_id}" }
              as: VendorRepUser
              as_user_id: "${rep_nia_id}"
              captures: { conflict_error_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and error_id == ERR_REP_ACCESS_REVOKED"
            - "the response is NOT ERR_BADGE_WINDOW_NOT_OPEN (422), even though 2026-09-10T19:00:00Z lies past badge_window_end_utc 2026-09-10T18:30:00Z"
            - "no KioskCheckIn row exists for CaseRepAuthorization.${auth_9701_id}"
            - "CaseRepAuthorization.${auth_9701_id}.status == APPROVED (the revocation did not cascade: the case started before the revocation instant)"
            - "VendorRep.${rep_nia_id}.access_status == REVOKED"
            - "VendorRep.${rep_nia_id}.revoked_at_utc == 2026-09-10T19:00:00Z"
            - "VendorRep.${rep_nia_id}.open_authorization_count == 1"

      - name: expired_product_referential_check_precedes_fee_hold_and_returns_422
        grounds:
          - validations.priority_36_ERR_PRODUCT_NOT_APPROVED
          - validations.priority_39_ERR_VENDOR_FEE_HOLD
          - errors.ERR_PRODUCT_NOT_APPROVED
          - errors.ERR_VENDOR_FEE_HOLD
          - state_machines.ApprovedProduct.ACTIVE_to_EXPIRED
          - calculations.loaner_late_fee
        distinguishing_aspect: |
          A different category pair on a different endpoint: business_referential (priority 36, 422)
          versus business_fiscal (priority 39, 402) on POST /vendor-access/loaner-sets/{id}/release.
          The vendor is simultaneously over the 100000-cent fee-hold threshold and holding an EXPIRED
          product approval. The expected answer is ERR_PRODUCT_NOT_APPROVED with 422, and 402 must not
          appear. This pair also proves the sweep's phase-6 expiry does NOT hold loaner sets, which is
          what keeps priority 17 from masking the conflict.
        test_recipe:
          setup:
            - "Facility FX-10 has spd_turnaround_hours 8 and spd_bay_count 2, so the two sets below fit even though their buffered SPD occupations collide once."
            - "Vendor MEGAI has one approved implant product, approved at the 2026-08-01T00:00:00Z default clock, so approval_expires_at_utc is 2027-08-01T00:00:00Z."
            - "Case CASE-9801 is an implant case 2026-09-25T10:00:00Z to 14:00:00Z with a 20-tray IMPLANT_SPECIALTY set: lead_hours = max(8 + 10 + 2, 24) = 24, deadline 2026-09-24T10:00:00Z."
            - "Case CASE-9802 is an implant case 2026-09-26T10:00:00Z to 14:00:00Z with a 4-tray SIMPLE set: lead_hours = max(8 + 2 + 0, 24) = 24, deadline 2026-09-25T10:00:00Z."
            - "The 20-tray set is received at 2026-09-25T06:00:00Z: 1200 late minutes, past the 120-minute hard-reject grace, so it is REJECTED_LATE with per-tray fee 5250 cents and a total of 105000 cents, putting the vendor over FEE_HOLD_THRESHOLD_CENTS."
            - "The 4-tray set is received at 2026-09-25T09:00:00Z, one hour early, so it is DELIVERED_ON_TIME and eligible for release on state grounds."
