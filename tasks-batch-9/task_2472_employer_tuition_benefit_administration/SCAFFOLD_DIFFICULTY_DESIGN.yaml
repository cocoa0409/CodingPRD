          assert: >-
            The two axes move independently. E1 (DIRECT_BILL, gross 120000 = 30000 * 4,
            employer_reserved_cents 120000): after confirm-registration it is
            (academic_status IN_PROGRESS, funding_status BILLED) with exactly one TuitionInvoice of
            amount_cents 120000 and due_date 2026-10-01; after pay it is (IN_PROGRESS, SETTLED)
            with employer_disbursed_cents 120000 while no AcademicOutcome exists at all; after the
            PASSED outcome it is (PASSED, SETTLED) and funding_status is unchanged by the outcome.
            E2 (REIMBURSEMENT, gross 120000, employer_reserved_cents 60000 =
            round_half_up(120000 * 0.50)): after confirm-registration it is (IN_PROGRESS, RESERVED)
            and GET /enrollments/${enrollment_2_id}/invoices returns total_count 0; after the
            PASSED outcome it is (PASSED, RESERVED) with employer_disbursed_cents 0. The trigger
            finally moves only the funding axis to (PASSED, SETTLED) with approved_amount_cents
