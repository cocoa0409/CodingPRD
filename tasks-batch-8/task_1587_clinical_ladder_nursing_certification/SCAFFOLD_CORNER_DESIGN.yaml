  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: occ_stale_application_version_on_decide
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[application-decide-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Decide carrying expected_application_version one behind the current version (because a return-for-revision bumped it) returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Application IN_REVIEW; admin captured version V; return-for-revision bumps version; decide replays V"]
          setup_api_calls:
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-OCC1", full_name: "Occ One", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { occ1_id: $.data.id, occ1_nv: $.data.version }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-OCCR", full_name: "Occ Rev", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { occr_id: $.data.id }
            - call: "POST /clinical-ladder/applications"
              payload: { nurse_id: "${occ1_id}", target_level: "CN_II", portfolio_narrative: "p", expected_nurse_version: "${occ1_nv}" }
              as: Nurse
              as_user_id: "${occ1_id}"
              captures: { occ_app: $.data.id }
            - call: "POST /clinical-ladder/applications/${occ_app}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${occ1_id}"
            - call: "POST /clinical-ladder/applications/${occ_app}/assignments"
              payload: { reviewer_nurse_id: "${occr_id}" }
              as: ProgramAdmin
            - call: "GET /clinical-ladder/applications/${occ_app}"
              payload: {}
              as: ProgramAdmin
              captures: { occ_v_pre: $.data.version }
            - call: "POST /clinical-ladder/applications/${occ_app}/return-for-revision"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /clinical-ladder/applications/${occ_app}/decide"
              payload: { outcome: "APPROVE", expected_application_version: "${occ_v_pre}" }
              as: ProgramAdmin
              captures: { occ_err: $.data.error_id }
          assert:
            - "occ_err == ERR_STALE_VERSION"

      - name: occ_stale_nurse_version_on_application_create
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[criterion-create-stale-nurse]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Application create carrying expected_nurse_version captured before any subsequent Nurse mutation returns 412."
        test_recipe:
          setup: ["Nurse OCC2 created (version 1); version captured; a second application create bumps version; replay create with stale version"]
          setup_api_calls:
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-OCC2", full_name: "Occ Two", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { occ2_id: $.data.id, occ2_v1: $.data.version }
            - call: "POST /clinical-ladder/applications"
              payload: { nurse_id: "${occ2_id}", target_level: "CN_II", portfolio_narrative: "first", expected_nurse_version: "${occ2_v1}" }
              as: Nurse
              as_user_id: "${occ2_id}"
          trigger:
            - call: "POST /clinical-ladder/applications"
              payload: { nurse_id: "${occ2_id}", target_level: "CN_II", portfolio_narrative: "second-stale", expected_nurse_version: "${occ2_v1}" }
              as: Nurse
              as_user_id: "${occ2_id}"
              captures: { occ2_err: $.data.error_id }
          assert:
            - "occ2_err == ERR_STALE_VERSION"

      - name: occ_stale_budget_line_on_update
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[budget-line-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PUT /budget-lines/{id} with a stale expected_budget_line_version after a cascade bumped it returns 412."
        test_recipe:
          setup: ["Budget line BL created; version captured; a claim approval cascade bumps the line version; PUT replays old version"]
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/budget-lines"
              payload: { unit: "ICU-4W", fiscal_year: 2027, allocated_cents: 9000000 }
              as: ProgramAdmin
              captures: { occbl_id: $.data.id, occbl_v: $.data.version }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-OCC3", full_name: "Occ Three", hire_date: "2021-01-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { occ3_id: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${occ3_id}", track: "BASIC", certifying_body: "ANCC", exam_fee_cents: 40000, obtained_on: "2026-01-01T00:00:00Z", expires_on: "2031-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { occ3_cert: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims"
              payload: { certification_id: "${occ3_cert}", claimed_amount_cents: 30000 }
              as: Nurse
              as_user_id: "${occ3_id}"
              captures: { occ3_claim: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims/${occ3_claim}/approve"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "PUT /clinical-ladder/budget-lines/${occbl_id}"
              payload: { allocated_cents: 8000000, expected_budget_line_version: "${occbl_v}" }
              as: ProgramAdmin
              captures: { occbl_err: $.data.error_id }
          assert:
            - "occbl_err == ERR_STALE_VERSION (cascade from claim approve bumped the line version)"

      - name: filtered_list_reverse_reachability
        claim_type: standard_crud
        grounds: [entities.ParticipationEvent.fields.nurse_id]
        distinguishing_aspect: "GET /participation-events?nurse_id=X returns only that nurse's events; GET /nurses/{id}/participation-events returns the identical set (both reverse-reachability forms agree)."
        test_recipe:
          setup: ["Nurses RR1 (2 events) and RR2 (1 event)"]
          setup_api_calls:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-RR1", full_name: "Rr One", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { rr1_id: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-RR2", full_name: "Rr Two", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { rr2_id: $.data.id }
            - call: "POST /clinical-ladder/participation-events"
              payload: { nurse_id: "${rr1_id}", event_kind: "QI_PROJECT", points: 5, occurred_on: "2026-01-01T00:00:00Z" }
              as: Nurse
              as_user_id: "${rr1_id}"
            - call: "POST /clinical-ladder/participation-events"
              payload: { nurse_id: "${rr1_id}", event_kind: "PRECEPTORSHIP", points: 5, occurred_on: "2026-02-01T00:00:00Z" }
              as: Nurse
              as_user_id: "${rr1_id}"
            - call: "POST /clinical-ladder/participation-events"
              payload: { nurse_id: "${rr2_id}", event_kind: "QI_PROJECT", points: 5, occurred_on: "2026-03-01T00:00:00Z" }
              as: Nurse
              as_user_id: "${rr2_id}"
          trigger:
            - call: "GET /clinical-ladder/participation-events"
              payload: { nurse_id: "${rr1_id}" }
              as: ProgramAdmin
              captures: { rr_flat: $.data }
            - call: "GET /clinical-ladder/nurses/${rr1_id}/participation-events"
              payload: {}
              as: ProgramAdmin
              captures: { rr_nested: $.data }
          assert:
            - "len(rr_flat) == 2 and len(rr_nested) == 2"
            - "sets of ids in rr_flat and rr_nested are equal"

      - name: decide_creates_append_only_decision_row
        claim_type: side_effect_execution
        grounds: [entities.AdvancementDecision, state_machines.Application.IN_REVIEW_to_DENIED]
        distinguishing_aspect: "DENY decision creates one AdvancementDecision row visible via GET /applications/{id}/decisions with outcome DENY and criterion_version_snapshot equal to the pinned criterion's version."
        test_recipe:
          setup: ["Application IN_REVIEW scored to 50 aggregate (< 75 min); criterion pinned at version 1"]
          setup_api_calls:
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-DEC", full_name: "Dec Nurse", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { dec_id: $.data.id, dec_nv: $.data.version }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-DECR", full_name: "Dec Rev", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { decr_id: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-DECRB", full_name: "Dec Rev B", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { decr_idb: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-DECRC", full_name: "Dec Rev C", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { decr_idc: $.data.id }
            - call: "POST /clinical-ladder/applications"
              payload: { nurse_id: "${dec_id}", target_level: "CN_II", portfolio_narrative: "p", expected_nurse_version: "${dec_nv}" }
              as: Nurse
              as_user_id: "${dec_id}"
              captures: { dec_app: $.data.id }
            - call: "POST /clinical-ladder/applications/${dec_app}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${dec_id}"
            - call: "POST /clinical-ladder/applications/${dec_app}/assignments"
              payload: { reviewer_nurse_id: "${decr_id}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${dec_app}/assignments"
              payload: { reviewer_nurse_id: "${decr_idb}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${dec_app}/assignments"
              payload: { reviewer_nurse_id: "${decr_idc}" }
              as: ProgramAdmin
            - call: "GET /clinical-ladder/applications/${dec_app}/assignments"
              payload: {}
              as: ProgramAdmin
              captures: { dec_asg: "$.data[0].id", dec_asgb: "$.data[1].id", dec_asgc: "$.data[2].id" }
            - call: "POST /clinical-ladder/review-assignments/${dec_asg}/score"
              payload: { dimension_scores: { leadership: 50, clinical_expertise: 50, professional_development: 50, outcomes: 50 } }
              as: Nurse
              as_user_id: "${decr_id}"
            - call: "POST /clinical-ladder/review-assignments/${dec_asgb}/score"
              payload: { dimension_scores: { leadership: 50, clinical_expertise: 50, professional_development: 50, outcomes: 50 } }
              as: Nurse
              as_user_id: "${decr_idb}"
            - call: "POST /clinical-ladder/review-assignments/${dec_asgc}/score"
              payload: { dimension_scores: { leadership: 50, clinical_expertise: 50, professional_development: 50, outcomes: 50 } }
              as: Nurse
              as_user_id: "${decr_idc}"
            - call: "GET /clinical-ladder/applications/${dec_app}"
              payload: {}
              as: ProgramAdmin
              captures: { dec_v: $.data.version }
          trigger:
            - call: "POST /clinical-ladder/applications/${dec_app}/decide"
              payload: { outcome: "DENY", expected_application_version: "${dec_v}" }
              as: ProgramAdmin
              captures: { dec_status: $.data.status }
            - call: "GET /clinical-ladder/applications/${dec_app}/decisions"
              payload: {}
              as: ProgramAdmin
              captures: { dec_rows: $.data }
          assert:
            - "dec_status == DENIED"
