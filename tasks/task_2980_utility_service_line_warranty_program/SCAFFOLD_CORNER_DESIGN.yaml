      - name: cc_cascading_side_effects_partner_termination_withdraws_products_and_in_flight_campaigns
        claim_type: cascading_side_effects
        grounds:
          - state_machines.UtilityPartner[ACTIVE -> TERMINATED]
          - endpoints[POST /partners/{partnerId}/status-changes]
          - validations.partner-must-be-active
          - errors[ERR_PARTNER_NOT_ACTIVE]
        distinguishing_aspect: "One status change fans out across two entity types with a status filter: every ServiceLineProduct is withdrawn, campaigns in DRAFT, PARTNER_REVIEW and APPROVED are withdrawn with a version bump each, the already-MAILED campaign is left alone because MAILED is terminal, and in-force coverage is deliberately untouched while every new marketing or enrollment write is now refused."
