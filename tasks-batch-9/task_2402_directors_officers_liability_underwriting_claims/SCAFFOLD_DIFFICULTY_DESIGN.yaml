              as: ComplianceOfficer
            - call: "POST /dno/policies/${policy_id}/claims"
              payload: { claim_type: "SECURITIES_CLASS_ACTION", claimant_name: "Meridian Pension Fund", claimant_capacity: "THIRD_PARTY", wrongful_act_date: "2026-06-10T00:00:00Z", alleged_damages_usd: 9000000 }
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /dno/claims/${claim_id}/coverage-decision"
              payload: { decision: "ACCEPT_WITH_ROR", allocation_method: "RELATIVE_EXPOSURE" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { claim_v: "$.data.version" }
            - call: "POST /dno/claims/${claim_id}/defense-invoices"
              payload: { law_firm_name: "Harrow & Blake LLP", invoice_reference: "HB-2026-0007", billed_amount_usd: 5250000, covered_matter_amount_usd: 5250000, uncovered_matter_amount_usd: 0, mixed_matter_amount_usd: 0, insured_person_defendant_count: 3, entity_defendant_count: 1 }
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { invoice_a_id: "$.data.id" }
            - call: "POST /dno/defense-invoices/${invoice_a_id}/allocate"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /dno/claims/${claim_id}/defense-invoices"
              payload: { law_firm_name: "Harrow & Blake LLP", invoice_reference: "HB-2026-0008", billed_amount_usd: 100000, covered_matter_amount_usd: 100000, uncovered_matter_amount_usd: 0, mixed_matter_amount_usd: 0, insured_person_defendant_count: 3, entity_defendant_count: 1 }
              as: RiskManager
              as_user_id: "${insured_id}"
              captures: { invoice_b_id: "$.data.id" }
          trigger:
            - call: "POST /dno/claims/${claim_id}/coverage-decision"
              payload: { decision: "DENY", denial_reason: "CONDUCT_EXCLUSION" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
          assert:
            - "before the trigger: GET /dno/policies/${policy_id} reads total_eroded_usd == 5000000.00, aggregate_remaining_usd == 0.00, tower_posture == ERODED, open_claim_count == 1; the conservation identity 5000000 == 5000000.00 + 0.00 holds"
            - "before the trigger: SIDE_B reads eroded_usd == 5000000.00, remaining_limit_usd == 0.00, status == EXHAUSTED while SIDE_A reads eroded_usd == 0.00, status == ACTIVE; the primary layer is EXHAUSTED and the excess layer is still ATTACHED (5000000 < 5000000 is false)"
            - "before the trigger: invoice A reads covered_allocated_usd == 5250000.00, retention_applied_usd == 250000.00, advanced_usd == 5000000.00, unfunded_excess_usd == 0.00, status == ADVANCED; the claim reads advanced_defense_usd == 5000000.00, retention_applied_usd == 250000.00, retention_remaining_usd == 0.00, status == DEFENSE_ADVANCING"
            - "the trigger returns 200 with data.status == DENIED and data.denial_reason == CONDUCT_EXCLUSION"
            - "after the trigger: invoice A reads status == CLAWED_BACK and invoice B reads status == VOIDED, so the never-allocated invoice is closed off rather than left available"
            - "after the trigger: the claim reads advanced_defense_usd == 0.00, retention_applied_usd == 0.00, retention_remaining_usd == 250000.00 (reset to policy.retention_usd), unfunded_excess_usd == 0.00"
            - "after the trigger: SIDE_B is back to eroded_usd == 0.00, remaining_limit_usd == 5000000.00 and status == ACTIVE — an EXHAUSTED part is restored, not merely credited"
            - "after the trigger: GET /dno/policies/${policy_id} reads total_eroded_usd == 0.00 exactly (its pre-advancement value, with no rounding drift) and aggregate_remaining_usd == 5000000.00, so 5000000 == 0.00 + 5000000.00 still holds"
            - "after the trigger: the primary layer is back to status == ATTACHED because its attachment_point_usd 0 >= the restored total_eroded_usd 0, the excess layer is unchanged at ATTACHED, and tower_posture is re-derived to CONTIGUOUS — not left at ERODED and not collapsed to INCOMPLETE"
            - "after the trigger: open_claim_count == 0 and a further POST /dno/defense-invoices/${invoice_b_id}/allocate returns 409 ERR_INVALID_CLAIM_STATE, so no second reversal can double-credit the ledger"
      - name: cancel_releases_side_c_capacity
        grounds:
          - state_machines.Policy.ACTIVE_to_CANCELLED
          - state_machines.CoveragePart.ACTIVE_to_RELEASED
          - calculations.cancellation_return_premium
          - calculations.entity_side_c_capacity
          - entities.Insured.fields.available_side_c_capacity_usd
          - entities.Policy.fields.return_premium_usd
        distinguishing_aspect: |
          Conserved quantity #2 — a different ledger on a different entity: the insured's Side C
          capacity identity entity_capacity_cap_usd == aggregate_bound_side_c_usd +
          available_side_c_capacity_usd, which must hold before the bind, while the policy is live,
          and after the cancellation returns to the starting split. The release must be real rather
          than cosmetic, which is proved by binding a fresh 5,000,000 Side C policy afterwards; the
          same call also has to produce the pro-rata return premium from a floored day count.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ELEVATED Vantiq Bio Inc insured with entity_capacity_cap_usd 6,250,000."
            - "One bound Policy: 10,000,000 limit, 250,000 retention, 5,000,000 Side C sublimit, period 2026-09-01 to 2027-09-01, gross_premium_usd 236,468.57."
            - "The clock is then moved to 2026-10-01T00:00:00Z and one ops run is taken, so the policy is ACTIVE (and its premium DELINQUENT, which does not affect cancellation)."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 6250000 }
              as: Underwriter
