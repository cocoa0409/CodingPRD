              as_user_id: "teller-1"
          assert:
            - "response error_id == ERR_KYC_NOT_VERIFIED"
            - "response http_status == 403"

      - name: transaction_post_requires_drawer_open
        grounds:
          - validations[priority=9]
          - entities.CashDrawer.fields.status
          - state_machines.CashDrawer.RECONCILING_to_CLOSED
        distinguishing_aspect: |
          Entity pair Transaction -> CashDrawer: a posting against a drawer in status==CLOSED is rejected
          with ERR_DRAWER_NOT_OPEN. The Transaction's valid transition depends on CashDrawer state — a
          DIFFERENT entity pair than Transaction->Customer above.
        test_recipe:
          setup:
            - "A VERIFIED customer; a drawer that was opened, begin-reconciled, and CLOSED with a matching count (variance 0)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ned Drawer", id_type: "DRIVERS_LICENSE", id_number: "DL-14", date_of_birth: "1987-07-17" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
