            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_a: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Okefenokee Nights", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 200000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_b: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_a}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_a: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_b}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 150000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_b: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T12:00:00Z" }, as: FilmOfficeAdmin }
          trigger:
            - { call: "POST /api/applications/${app_a}/submit", payload: {}, as: Producer, as_user_id: "${co_id}", captures: { sub_a: $.data.status, sub_at: $.data.submitted_at } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T12:00:01Z" }, as: FilmOfficeAdmin }
