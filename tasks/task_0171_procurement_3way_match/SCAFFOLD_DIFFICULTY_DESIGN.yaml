  # ===========================================================================
  # RULE 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: requisition_cyclic_revise_loop_increments_revision_count
        grounds:
          - state_machines.Requisition.transitions.PENDING_APPROVAL_to_REJECTED
          - state_machines.Requisition.transitions.REJECTED_to_DRAFT
          - state_machines.Requisition.transitions.DRAFT_to_PENDING_APPROVAL
          - entities.Requisition.fields.revision_count
        distinguishing_aspect: |
          CYCLE on Requisition: REJECTED -> DRAFT (revise) -> PENDING_APPROVAL (resubmit) is a
          true A->B->A loop, each revise bumping revision_count by 1 and re-creating a fresh
          ApprovalStep cycle. This is a different entity than the Invoice parallel-dimensions
          instance.
        test_recipe:
          setup:
            - "A Requisition is submitted (PENDING_APPROVAL) then rejected by an Approver who is not the requester (status REJECTED, revision_count 0)."
            - "Buyer revises it back to DRAFT (revision_count -> 1, prior ApprovalStep rows cleared)."
            - "Buyer resubmits -> PENDING_APPROVAL again with a fresh ApprovalStep set."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-5" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE5", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Pens", lines: [ { sku: "A", description: "Pen", quantity: 2, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/requisitions/${req_id}/reject"
              payload: {}
              as: Approver
              as_user_id: "approver-mgr"
          trigger:
            - call: "POST /procurement/requisitions/${req_id}/revise"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { st: $.data.status }
          assert:
            - "Requisition.${req_id}.revision_count == 1"
            - "Requisition.${req_id}.status == PENDING_APPROVAL"
            - "a fresh PENDING ApprovalStep at level 1 exists for the requisition after resubmit"

      - name: invoice_parallel_match_and_payment_dimensions_evolve_independently
        grounds:
          - state_machines.Invoice.transitions.UNMATCHED_to_MATCHED
          - state_machines.Invoice.transitions.PENDING_to_REJECTED
          - entities.Invoice.fields.match_status
          - entities.Invoice.fields.payment_status
        distinguishing_aspect: |
          PARALLEL dimensions on one Invoice row: match_status (UNMATCHED->MATCHED) and
          payment_status (PENDING->REJECTED) advance independently — rejecting payment leaves
          match_status untouched, and matching leaves payment_status untouched. A different
          entity than the Requisition cyclic loop.
        test_recipe:
          setup:
            - "An Invoice exists against a fully-received STANDARD PO whose lines exactly match the invoice (so a match would PASS)."
            - "The invoice starts match_status=UNMATCHED, payment_status=PENDING."
          setup_api_calls:
            - call: "POST /procurement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProcurementAdmin
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-6" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE6", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Tape", lines: [ { sku: "A", description: "Tape", quantity: 4, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/requisitions/${req_id}/approve"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "approver-mgr"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req_id}", open_at: "2026-03-01T00:00:00Z", close_at: "2026-03-02T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq_id: $.data.id }
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq_id}", vendor_id: "${v_id}", submitted_at: "2026-03-01T06:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 5 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote_id: $.data.id }
            - call: "POST /procurement/rfqs/${rfq_id}/award"
              payload: { awarded_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/purchase-orders"
              payload: { vendor_id: "${v_id}", spend_category_id: "${cat_id}", po_type: "STANDARD", requisition_id: "${req_id}", source_quote_id: "${quote_id}" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { po_id: $.data.id }
            - call: "POST /procurement/goods-receipts"
              payload: { purchase_order_id: "${po_id}", received_lines: [ { sku: "A", received_qty: 4 } ], received_at: "2026-03-02T00:00:00Z" }
              as: Receiver
              as_user_id: "receiver-r1"
              captures: { gr_id: $.data.id }
            - call: "POST /procurement/invoices"
              payload: { vendor_id: "${v_id}", purchase_order_id: "${po_id}", goods_receipt_id: "${gr_id}", invoice_number: "INV-2", lines: [ { sku: "A", billed_qty: 4, billed_unit_price_cents: 1000 } ] }
              as: PayablesClerk
              as_user_id: "clerk-c1"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /procurement/invoices/${inv_id}/reject-payment"
              payload: {}
              as: PayablesClerk
              as_user_id: "clerk-c1"
              captures: { pay_after_reject: $.data.payment_status, match_after_reject: $.data.match_status }
            - call: "POST /procurement/invoices/${inv_id}/match"
              payload: {}
              as: Matcher
              as_user_id: "matcher-m1"
              captures: { match_after_match: $.data.match_status, pay_after_match: $.data.payment_status }
          assert:
            - "after reject-payment: Invoice.${inv_id}.payment_status == REJECTED and Invoice.${inv_id}.match_status == UNMATCHED"
            - "after match: Invoice.${inv_id}.match_status == MATCHED and Invoice.${inv_id}.payment_status == REJECTED"

  # ===========================================================================
  # RULE 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: requisition_reject_cascades_rfq_cancel_then_quote_void_depth3
        grounds:
          - state_machines.Requisition.transitions.PENDING_APPROVAL_to_REJECTED
          - state_machines.RFQ.transitions.OPEN_to_CANCELLED
          - state_machines.Quote.transitions.SUBMITTED_to_VOIDED
          - entities.RFQ.fields.status
          - entities.Quote.fields.status
        distinguishing_aspect: |
          DEPTH-3 chain triggered by Requisition reject: rejecting the requisition (A) mutates
          its OPEN RFQ -> CANCELLED (B); the RFQ's own cancellation cascade then voids each
          SUBMITTED Quote -> VOIDED (C). Each hop is caused by the previous hop, not directly by
          the reject. Distinct trigger from the blanket-PO-cancel cascade.
        test_recipe:
          setup:
            - "A Requisition is PENDING_APPROVAL with an OPEN RFQ carrying one SUBMITTED Quote."
          setup_api_calls:
            - call: "POST /procurement/vendors"
              payload: { name: "Vendor V", tax_id: "TAX-V-7" }
              as: ProcurementAdmin
              captures: { v_id: $.data.id }
            - call: "POST /procurement/spend-categories"
              payload: { name: "Office", code: "OFFICE7", approval_threshold_cents: 100000000, director_threshold_cents: 200000000, preferred_vendor_id: "${v_id}" }
              as: ProcurementAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /procurement/requisitions"
              payload: { spend_category_id: "${cat_id}", title: "Cable", lines: [ { sku: "A", description: "Cable", quantity: 3, estimated_unit_price_cents: 1000 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { req_id: $.data.id }
            - call: "POST /procurement/requisitions/${req_id}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
            - call: "POST /procurement/rfqs"
              payload: { requisition_id: "${req_id}", open_at: "2026-03-01T00:00:00Z", close_at: "2026-03-10T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq_id: $.data.id }
            - call: "POST /procurement/quotes"
              payload: { rfq_id: "${rfq_id}", vendor_id: "${v_id}", submitted_at: "2026-03-02T00:00:00Z", unit_prices: [ { sku: "A", unit_price_cents: 1000, promised_lead_days: 5 } ] }
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /procurement/requisitions/${req_id}/reject"
              payload: {}
              as: Approver
              as_user_id: "approver-mgr"
            - call: "GET /procurement/rfqs/${rfq_id}"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { rfq_status: $.data.status }
            - call: "GET /procurement/quotes/${quote_id}"
              payload: {}
              as: Buyer
              as_user_id: "buyer-b1"
              captures: { quote_status: $.data.status }
          assert:
            - "Requisition.${req_id}.status == REJECTED"
            - "RFQ.${rfq_id}.status == CANCELLED"
            - "Quote.${quote_id}.status == VOIDED"

      - name: invoice_match_fail_cascades_exception_then_count_then_probation_depth3
        grounds:
          - state_machines.Invoice.transitions.UNMATCHED_to_EXCEPTION
          - entities.MatchException.fields.status
          - entities.Vendor.fields.exception_count
          - state_machines.Vendor.transitions.APPROVED_to_PROBATION
        distinguishing_aspect: |
          DEPTH-3 chain triggered by a failing 3-way match: match FAIL (A) creates a
          MatchException OPEN (B); creating that exception recomputes Vendor.exception_count (C);
          once exception_count exceeds VENDOR_PROBATION_THRESHOLD the Vendor transitions
          APPROVED->PROBATION (D). Each hop is downstream of the prior, not of the original match
          call. Three distinct failing invoices on the same vendor drive exception_count to exactly
          3 (a determinate ledger from the test's own actions), which exceeds the configured
          threshold and flips the vendor to PROBATION. A different trigger than the
          requisition-reject cascade.
        test_recipe:
          setup:
            - "ProcurementAdmin created Vendor V (APPROVED, exception_count 0) and category CAT (thresholds high so a single MANAGER approval suffices)."
            - "Three separate STANDARD POs are each fully received, then each invoiced with billed_unit_price_cents=2000 against an ordered unit_price_cents=1000 — every match FAILS price tolerance and opens one OPEN MatchException attributed to V."
            - "After the third failing match, exception_count == 3, which exceeds VENDOR_PROBATION_THRESHOLD (configured below 3), so V is on PROBATION."
