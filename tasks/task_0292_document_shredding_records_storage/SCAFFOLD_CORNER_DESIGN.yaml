# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Document Shredding & Records Storage — Expert band
# Breadth probe across claim-extraction-guide sections. Every grounds[] resolves
# into SCAFFOLD.yaml §1.1-§1.7; setup_api_calls reachable from empty-DB.
# Shared rate card: scheduled=5, onetime=8, onsite_trip=2500, console_swap=1000,
#   storage=300, retrieval=4000, rush=15000 bps.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.ServiceAccount.fields.status
          - entities.ServiceAccount.fields.current_period_index
          - entities.ServiceAccount.fields.storage_credit_cents
        distinguishing_aspect: "POST /accounts with the three required inputs returns 201; system fields default status=ACTIVE, current_period_index=0, storage_credit_cents=0, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { business_name: "Acme", compliance_regime: "FACTA", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id, st: $.data.status }
          assert:
            - "response status == 201"
            - "ServiceAccount.${acct_id}.status == ACTIVE"
            - "ServiceAccount.${acct_id}.current_period_index == 0"
            - "ServiceAccount.${acct_id}.storage_credit_cents == 0"
            - "ServiceAccount.${acct_id}.version == 1"

      - name: get_account_not_found
        claim_type: Not Found
        grounds: [entities.ServiceAccount]
        distinguishing_aspect: "GET /accounts/{id} with a non-existent UUID returns 404 ERR_ACCOUNT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_ACCOUNT_NOT_FOUND"

      - name: create_order_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.ServiceOrder.fields.service_mode
          - validations[priority=11]
        distinguishing_aspect: "POST /service-orders omitting service_mode (input, no default) is rejected with ERR_INVALID_FIELD_VALUE (422)."
        test_recipe:
          setup: ["ACTIVE account + ACTIVE rate card + location"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Req", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", cadence: "SCHEDULED", scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_FIELD_VALUE"

      - name: invalid_enum_compliance_regime
        claim_type: Type Constraints
        grounds: [entities.ServiceAccount.fields.compliance_regime]
        distinguishing_aspect: "POST /accounts with compliance_regime not in {STANDARD,FACTA,HIPAA} is rejected with ERR_INVALID_FIELD_VALUE (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { business_name: "Bad", compliance_regime: "GDPR", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_FIELD_VALUE"

      - name: weight_ticket_default_fields_only
        claim_type: System Fields
        grounds:
          - entities.WeightTicket.fields.tare_total_kg
          - entities.WeightTicket.fields.captured_by
        distinguishing_aspect: "WeightTicket (common_fields:false) exposes only id+created_at as common fields; tare_total_kg/net_weight_kg/captured_by are computed/system, ignoring any client-sent values for them."
        test_recipe:
          setup: ["ACTIVE account+rate card; ON_SITE order over one CONSOLE (tare 8.0), dispatched"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Sys", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "CONSOLE", capacity_kg: 50, tare_weight_kg: 8.0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "ON_SITE", cadence: "SCHEDULED", container_ids: ["${c1}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z", assigned_tech_id: "tech-1" }
              as: AccountManager
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /service-orders/${order_id}/weigh-in"
              payload: { gross_weight_kg: 30.0 }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { wt_id: $.data.id, cap: $.data.captured_by }
          assert:
            - "WeightTicket.${wt_id}.tare_total_kg == 8.0 (computed from container, not client-supplied)"
            - "WeightTicket.${wt_id}.net_weight_kg == 22.0"
            - "WeightTicket.${wt_id}.captured_by == tech-1 (system-set from X-User-ID)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: dispatch_from_at_plant_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceOrder.SCHEDULED_to_EN_ROUTE]
        distinguishing_aspect: "dispatch is only defined from SCHEDULED; invoking it on an order already AT_PLANT returns ERR_ORDER_NOT_SCHEDULED (409), no side effects."
        test_recipe:
          setup: ["ACTIVE account+rate card; OFF_SITE order over one BIN driven to AT_PLANT"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Inv", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "BIN", capacity_kg: 40, tare_weight_kg: 4.0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "OFF_SITE_PICKUP", cadence: "ONE_TIME", container_ids: ["${c1}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z", assigned_tech_id: "tech-1" }
              as: AccountManager
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /service-orders/${order_id}/confirm-pickup"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /service-orders/${order_id}/weigh-in"
              payload: { gross_weight_kg: 36.0 }
              as: PlantOperator
            - call: "POST /service-orders/${order_id}/receive-at-plant"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /service-orders/${order_id}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_ORDER_NOT_SCHEDULED"
            - "ServiceOrder.${order_id}.status == AT_PLANT (unchanged)"

      - name: terminal_destroyed_no_further_transitions
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ServiceOrder.AT_PLANT_to_DESTROYED]
        distinguishing_aspect: "From terminal DESTROYED no transition is defined; cancel returns ERR_ORDER_NOT_CANCELLABLE (409)."
        test_recipe:
          setup: ["ACTIVE account+rate card; OFF_SITE order driven to DESTROYED (witness != tech)"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Term", compliance_regime: "HIPAA", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "BIN", capacity_kg: 40, tare_weight_kg: 4.0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "OFF_SITE_PICKUP", cadence: "ONE_TIME", container_ids: ["${c1}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z", assigned_tech_id: "tech-1" }
              as: AccountManager
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /service-orders/${order_id}/confirm-pickup"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /service-orders/${order_id}/weigh-in"
              payload: { gross_weight_kg: 36.0 }
              as: PlantOperator
            - call: "POST /service-orders/${order_id}/receive-at-plant"
              payload: {}
              as: PlantOperator
            - call: "POST /service-orders/${order_id}/destroy"
              payload: { witnessed_by: "witness-9" }
              as: DestructionWitness
              as_user_id: "witness-9"
          trigger:
            - call: "POST /service-orders/${order_id}/cancel"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_ORDER_NOT_CANCELLABLE"

      - name: shred_on_site_requires_weigh_in
        claim_type: Precondition Enforcement
        grounds: [state_machines.ServiceOrder.EN_ROUTE_to_ON_SITE_SHREDDED]
        distinguishing_aspect: "shred-on-site from EN_ROUTE with no WeightTicket recorded fails with ERR_WEIGH_IN_REQUIRED (409)."
        test_recipe:
          setup: ["ACTIVE account+rate card; ON_SITE order over one CONSOLE, dispatched to EN_ROUTE, NOT weighed-in"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Wreq", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "CONSOLE", capacity_kg: 50, tare_weight_kg: 8.0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "ON_SITE", cadence: "SCHEDULED", container_ids: ["${c1}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z", assigned_tech_id: "tech-1" }
              as: AccountManager
              captures: { order_id: $.data.id }
            - call: "POST /service-orders/${order_id}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /service-orders/${order_id}/shred-on-site"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_WEIGH_IN_REQUIRED"

      - name: drop_off_confirm_pickup_wrong_mode
        claim_type: Precondition Enforcement
        grounds: [state_machines.ServiceOrder.SCHEDULED_to_PICKED_UP]
        distinguishing_aspect: "confirm-pickup from SCHEDULED is only valid for DROP_OFF orders; an ON_SITE order in SCHEDULED hitting confirm-pickup fails ERR_MODE_NOT_DROP_OFF (409)."
        test_recipe:
          setup: ["ACTIVE account+rate card; ON_SITE order over one CONSOLE still SCHEDULED"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Mode", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "HQ", address: "1 Main" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", container_type: "CONSOLE", capacity_kg: 50, tare_weight_kg: 8.0 }
              as: AccountManager
              captures: { c1: $.data.id }
            - call: "POST /service-orders"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", service_mode: "ON_SITE", cadence: "SCHEDULED", container_ids: ["${c1}"], scheduled_slot_start: "2026-07-01T09:00:00Z", scheduled_slot_end: "2026-07-01T10:00:00Z", assigned_tech_id: "tech-1" }
              as: AccountManager
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /service-orders/${order_id}/confirm-pickup"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_MODE_NOT_DROP_OFF"

      - name: service_order_branching_fork_covered_by_difficulty
        claim_type: Valid Transition
        grounds: [state_machines.ServiceOrder.EN_ROUTE_to_ON_SITE_SHREDDED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / service_order_branching_fork_onsite_vs_plant
          rationale: "The on-site fork's valid transition and certificate side-effect are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: retrieval_charge_rush_multiplier
        claim_type: Correct Result
        grounds:
          - calculations.retrieval_charge
          - entities.RetrievalRequest.fields.retrieval_charge_cents
        distinguishing_aspect: "A RUSH retrieval applies the 15000-bps multiplier: base 4000 -> retrieval_charge_cents 6000."
        test_recipe:
          setup: ["ACTIVE account+rate card; box shelved STORED; RUSH retrieval PENDING"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Rush", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "Vault", address: "2 Ave" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000, rush_retrieval_multiplier_bps: 15000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /retention-boxes"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", barcode: "BX-1" }
              as: AccountManager
              captures: { box1: $.data.id }
            - call: "POST /retention-boxes/${box1}/shelve"
              payload: {}
              as: PlantOperator
            - call: "POST /retrieval-requests"
              payload: { box_id: "${box1}", account_id: "${acct_id}", priority: "RUSH", requested_by: "mgr-1" }
              as: AccountManager
              captures: { rr_id: $.data.id }
          trigger:
            - call: "POST /retrieval-requests/${rr_id}/fulfill"
              payload: {}
              as: PlantOperator
              captures: { charge: $.data.retrieval_charge_cents }
          assert:
            - "RetrievalRequest.${rr_id}.retrieval_charge_cents == 6000"

      - name: storage_free_period_boundary_excludes_then_includes
        claim_type: Input Set Filtering
        grounds:
          - calculations.storage_invoice_total
          - entities.RetentionBox.fields.free_periods
          - entities.RetentionBox.fields.stored_at_period
        distinguishing_aspect: "A box stored at period 0 with free_periods 2 is excluded from the period-1 invoice (1 < 0+2) but included in the period-2 invoice (2 >= 0+2): the inclusive free-period boundary."
        test_recipe:
          setup: ["ACTIVE account+rate card (storage=300); one box shelved STORED at period 0 with free_periods 2; advance to close period 1 then period 2"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Free", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "Vault", address: "2 Ave" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { account_id: "${acct_id}", scheduled_purge_rate_cents_per_kg: 5, onetime_purge_rate_cents_per_kg: 8, onsite_trip_fee_cents: 2500, console_swap_fee_cents: 1000, storage_rate_cents_per_box_per_period: 300, retrieval_fee_cents: 4000 }
              as: ComplianceOfficer
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /retention-boxes"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", barcode: "BX-1", free_periods: 2 }
              as: AccountManager
              captures: { box1: $.data.id }
            - call: "POST /retention-boxes/${box1}/shelve"
              payload: {}
              as: PlantOperator
            - call: "POST /accounts/${acct_id}/advance-period"
              payload: {}
              as: ComplianceOfficer
              captures: { inv_p0: $.data.id, p0_storage: $.data.storage_line_cents }
            - call: "POST /accounts/${acct_id}/advance-period"
              payload: {}
              as: ComplianceOfficer
              captures: { inv_p1: $.data.id, p1_storage: $.data.storage_line_cents }
          trigger:
            - call: "POST /accounts/${acct_id}/advance-period"
              payload: {}
              as: ComplianceOfficer
              captures: { inv_p2: $.data.id, p2_storage: $.data.storage_line_cents }
          assert:
            - "StorageInvoice.${inv_p1}.storage_line_cents == 0 (period 1: 1 < 2, box in free window)"
            - "StorageInvoice.${inv_p2}.storage_line_cents == 300 (period 2: 2 >= 2, box now billable)"

      - name: destruction_charge_estimated_excluded
        claim_type: Variant Selection
        grounds: [calculations.destruction_charge]
        excluded_because:
          difficulty_instance: dual_variant_calc / destruction_charge_estimated_vs_actual_on_order
          rationale: "Estimated-vs-actual variant divergence asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: container_location_mismatch_on_order_create
        claim_type: Violation to Error
        grounds:
          - validations[priority=12]
          - entities.ServiceOrder.fields.container_ids
        distinguishing_aspect: "Creating a service order at location L1 listing a container placed at L2 fails with ERR_CONTAINER_LOCATION_MISMATCH (409)."
        test_recipe:
          setup: ["ACTIVE account+rate card; two locations L1 and L2; one container placed at L2"]
          setup_api_calls:
            - call: "POST /accounts"
