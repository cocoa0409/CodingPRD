  # =================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and >= 2, different triggers)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cycle_completion_threshold_suspends_license_and_voids_queue
        grounds:
          - state_machines.Ride."license_status=LICENSED_to_license_status=SUSPENDED"
          - state_machines.RideCycle.RUNNING_to_COMPLETED
          - calculations.queue_boarding
          - entities.Ride.fields.cycles_since_inspection
        distinguishing_aspect: |
          Trigger: ride-cycle completion. Depth-3 chain: complete bumps
          cycles_since_inspection (link 1); crossing the manufacturer interval flips
          license_status LICENSED -> SUSPENDED (link 2); the suspension force-closes
          daily_status and voids the ride's remaining QUEUED redemptions (link 3).
          A subsequent RIDE_AUDIT pass resets the counter and restores the license.
