            - call: "POST /pre-opening/programs"
              payload: { property_name: "Foundry Row Hotel", brand_code: "FRH", room_count: 160, construction_start_date: "2026-09-01", target_opening_date: "2027-02-01", storage_capacity_pallets: 120, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 500, contingency_liability_cap_cents: 90000000, licensing_buffer_days: 14, slip_tolerance_days: 10 }
              as: ProgramDirector
              captures: { prog_f_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_f_id}", code: "CONSTRUCTION_COMPLETE", name: "Construction complete", duration_days: 60, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              captures: { m_f1_id: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_f_id}/baseline-schedule"
              payload: {}
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_f1_id}/start"
              payload: {}
              as: ConstructionManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: ConstructionManager
            - call: "POST /pre-opening/milestones/${m_f1_id}/complete"
              payload: {}
              as: ConstructionManager
            - call: "POST /pre-opening/permit-applications"
              payload: { program_id: "${prog_f_id}", gating_milestone_id: "${m_f1_id}", permit_type: "FOOD_SERVICE", review_days: 21 }
              as: LicensingCoordinator
              captures: { permit_f_id: "$.data.id" }
            - call: "POST /pre-opening/permit-applications/${permit_f_id}/submit"
              payload: {}
              as: LicensingCoordinator
