  - rule_id: boundary_precision_check
    instances:
      - name: risk_score_exactly_at_class_c_floor_lands_in_class_c
        grounds:
          - calculations.builder_risk_score
          - endpoints.POST_/warranty/builders/{id}/review-intake
          - entities.Builder.fields.risk_class
        distinguishing_aspect: |
          Metric risk_score on endpoint POST /warranty/builders/{id}/review-intake. The band is
          lower-bound INCLUSIVE at CLASS_C_FLOOR 45.00, and two builders differing in one input unit
          (claims_history_score 94 vs 95) straddle it exactly: 50 + 3 + 2 - 10 = 45.00 -> class C,
          and 50 + 2.5 + 2 - 10 = 44.50 -> class B. An exclusive reading of the floor puts the first
          builder in class B, which changes BASE_RATE_BP from 71 to 52 and STRUCTURAL_LOADING from
          1.25 to 1.10 on every policy it later enrolls, so the one-hundredth-of-a-point boundary is
          observable in money as well as in the band letter.
        test_recipe:
          setup:
            - "two Builder rows identical except for claims_history_score - 94 and 95 - both with years_in_business 5, homes_closed_last_year 25 and financial_strength_tier TIER_3, both driven DRAFT -> SUBMITTED"
            - "logical clock advanced to 2026-08-15T00:00:00Z before enrollment so the 2026-08-15 closing date is not in the future"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Boundary Homes At", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 94, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b_at: $.data.id }
            - call: "POST /warranty/builders/${b_at}/submission"
              payload: { attestation_signed: true }
              as: BuilderPrincipal
              as_user_id: "${b_at}"
            - call: "POST /warranty/builders"
              payload: { company_name: "Boundary Homes Below", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 95, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b_below: $.data.id }
            - call: "POST /warranty/builders/${b_below}/submission"
              payload: { attestation_signed: true }
              as: BuilderPrincipal
              as_user_id: "${b_below}"
          trigger:
            - call: "POST /warranty/builders/${b_at}/review-intake"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { score_at: $.data.risk_score, class_at: $.data.risk_class }
            - call: "POST /warranty/builders/${b_below}/review-intake"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { score_below: $.data.risk_score, class_below: $.data.risk_class }
          assert:
            - "${score_at} == 45.00 and ${class_at} == \"C\" - the CLASS_C_FLOOR value itself qualifies for class C"
            - "${score_below} == 44.50 and ${class_below} == \"B\""
            - "${class_at} != \"B\" - an exclusive floor reading is the falsifier"
            - "both rows report risk_basis == \"INITIAL_UNDERWRITING\" and underwriting_status == \"UNDER_REVIEW\""
      - name: empty_affected_elements_defeats_structural_designation_at_the_deflection_threshold
        grounds:
          - calculations.structural_designation
          - endpoints.POST_/warranty/claims/{id}/structural-assessments
          - entities.StructuralAssessment.fields.designated_structural
          - entities.Claim.fields.designated_structural
        distinguishing_aspect: |
          A different metric (designated_structural) on a different endpoint (POST
          /warranty/claims/{id}/structural-assessments). Two boundaries are pinned in one instance:
          the empty-array boundary, where affected_elements [] gives load_bearing_hits 0 so the
          designation is false even with load_bearing_affected true and a deflection_ratio of 0.0500
          - fifteen times the threshold; and the inclusive numeric boundary, where a deflection_ratio
          of exactly DEFLECTION_THRESHOLD 0.0033 with one load-bearing element qualifies. An
          implementation that treats an empty array as "no restriction", or that compares deflection
          strictly greater than the threshold, gets the opposite answer on one of the two calls - and
          because the claim-level flag is a logical OR that is never lowered, the order of the two
          filings does not rescue it.
        test_recipe:
