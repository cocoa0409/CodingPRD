  - rule_id: cross_entity_state_dependency
    instances:

      - name: license_activation_depends_on_manufacturer_parity_state
        grounds:
          - state_machines.License.DRAFT_to_ACTIVE
          - validations[priority=35]
          - entities.Manufacturer.fields.parity_status
          - errors[ERR_PARITY_NON_COMPLIANT]
        distinguishing_aspect: |
          Entity pair License <- Manufacturer: the License DRAFT -> ACTIVE transition is gated on
          a field of a DIFFERENT entity (Manufacturer.parity_status) that the request never
          mentions, and flipping only that field — via PATCH /manufacturers/{id}/pricing, with the
          license untouched — turns the identical activate call from 409 into 200.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one SystemArea exists"
            - "Manufacturer OVERPRICE priced at independent 150000 / dealer 100000, i.e. parity_index 1.5000 and parity_status NON_COMPLIANT"
            - "One DRAFT License under that manufacturer"
