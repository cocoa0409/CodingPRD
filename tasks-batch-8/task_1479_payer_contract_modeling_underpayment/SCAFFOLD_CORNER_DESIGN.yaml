        distinguishing_aspect: "Aggregate money guard: posting 60000 against a claim billed 50000 would push the POSTED total over total_billed_charges_cents -> ERR_REMITTANCE_EXCEEDS_CHARGES (409)."
        test_recipe:
          setup: ["payer P; contract C ACTIVE CASE_RATE INPATIENT_MEDICAL 100000; claim CL-RX1 billed 50000 priced at expected 100000"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer RX", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "RX-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "CASE_RATE", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-RX1", patient_account_number: "PA-RX1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-02", total_billed_charges_cents: 50000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 50000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 60000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_REMITTANCE_EXCEEDS_CHARGES (60000 > 50000 billed)"
            - "Claim.${claim_id}.remittance_status still == AWAITING_REMITTANCE"

      - name: err_escalation_min_not_met_on_arbitration
        claim_type: triggerable
        grounds: ["errors[ERR_ESCALATION_MIN_NOT_MET]", "validations[priority=11]", "calculations.appeal_response_deadline.constants.ARBITRATION_MIN_OUTSTANDING_CENTS", "state_machines.UnderpaymentCase.MEDIATION_to_ARBITRATION"]
        distinguishing_aspect: "Arbitration money gate: after three DENIED levels the case reaches MEDIATION with outstanding 50000 < 100000 minimum, so the level-4 appeal is rejected ERR_ESCALATION_MIN_NOT_MET (409) even though level/open-appeal/evidence checks all pass."
        test_recipe:
          setup: ["case at MEDIATION (L1/L2/L3 appeals each FILED then DENIED same-day); outstanding 50000 (claim 200000, remittance 150000)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer AM", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "AM-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-AM1", patient_account_number: "PA-AM1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 150000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RecoveryManager
              captures: { case_id: "$.data[0].id" }
            - call: "POST /api/underpayment-cases/${case_id}/pick_up"
              as: RecoveryManager
              as_user_id: "rm-1"
            - call: "POST /api/appeals"
              payload: { case_id: "${case_id}", level: 1 }
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { a1: $.data.id }
            - call: "POST /api/appeals/${a1}/file"
              as: RecoveryManager
              as_user_id: "rm-1"
            - call: "POST /api/appeals/${a1}/record_outcome"
              payload: { outcome: "DENIED" }
              as: RecoveryManager
              as_user_id: "rm-2"
            - call: "POST /api/appeals"
              payload: { case_id: "${case_id}", level: 2 }
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { a2: $.data.id }
            - call: "POST /api/appeals/${a2}/file"
              as: RecoveryManager
              as_user_id: "rm-1"
            - call: "POST /api/appeals/${a2}/record_outcome"
              payload: { outcome: "DENIED" }
              as: RecoveryManager
              as_user_id: "rm-2"
            - call: "POST /api/appeals"
              payload: { case_id: "${case_id}", level: 3 }
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { a3: $.data.id }
            - call: "POST /api/appeals/${a3}/file"
              as: RecoveryManager
              as_user_id: "rm-1"
            - call: "POST /api/appeals/${a3}/record_outcome"
              payload: { outcome: "DENIED" }
              as: RecoveryManager
              as_user_id: "rm-2"
          trigger:
            - call: "POST /api/appeals"
              payload: { case_id: "${case_id}", level: 4 }
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 with ${err} == ERR_ESCALATION_MIN_NOT_MET (50000 < 100000)"
            - "UnderpaymentCase.${case_id}.status still == MEDIATION and escalation_level == 3"

      # --- errors already exercised as the primary assertion of a §1.8 instance
      - name: err_invalid_state_transition_covered_by_priority_instance
        claim_type: triggerable
        grounds: ["errors[ERR_INVALID_STATE_TRANSITION]"]
        excluded_because:
          difficulty_instance: write_off_from_queued_state_error_beats_cap_error
          rationale: "Asserted as the winning error of the state-vs-fiscal priority conflict in §1.8 (write_off on a QUEUED case)."

      - name: err_contract_not_active_covered_by_amendment_gate
        claim_type: triggerable
        grounds: ["errors[ERR_CONTRACT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: amendment_approval_gated_on_contract_active
          rationale: "Asserted as the rejection of amendment approval on a SUSPENDED contract in §1.8."

      - name: err_sod_write_off_self_covered_by_priority_instance
        claim_type: triggerable
        grounds: ["errors[ERR_SOD_WRITE_OFF_SELF]"]
        excluded_because:
          difficulty_instance: write_off_self_sod_error_beats_cap_error
          rationale: "Asserted as the winning error of the SoD-vs-fiscal priority conflict in §1.8."

      - name: err_contract_window_overlap_covered_by_boundary_instance
        claim_type: triggerable
        grounds: ["errors[ERR_CONTRACT_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: renewal_linked_contracts_share_exactly_one_boundary_date
          rationale: "Asserted on the two-shared-dates renewal pair in §1.8 rule 8."

      - name: err_network_agreement_overlap_covered_by_boundary_instance
        claim_type: triggerable
        grounds: ["errors[ERR_NETWORK_AGREEMENT_OVERLAP]"]
        excluded_because:
          difficulty_instance: network_agreement_overlap_rejected_even_at_shared_boundary
          rationale: "Asserted on the shared-boundary same-name agreement in §1.8 rule 8."

      - name: err_escalation_blocked_covered_by_appeal_gate
        claim_type: triggerable
        grounds: ["errors[ERR_ESCALATION_BLOCKED]"]
        excluded_because:
          difficulty_instance: appeal_level2_gated_on_level1_outcome
          rationale: "Asserted when creating level 2 with only a WITHDRAWN level-1 appeal in §1.8 rule 7."

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_auditor_cannot_create_payer
        claim_type: denied_operations
        grounds: ["roles[Auditor]", "endpoints[POST /api/payers]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Read-only Auditor hitting a ContractManager-exclusive endpoint gets 403 ERR_FORBIDDEN_FOR_ROLE and nothing is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/payers"
              payload: { name: "Payer X", payer_type: "COMMERCIAL" }
              as: Auditor
              captures: { err: $.data.error_id }
            - call: "GET /api/payers"
              as: Auditor
          assert:
            - "response is 403 with ${err} == ERR_FORBIDDEN_FOR_ROLE"
            - "GET /api/payers afterwards returns an empty list (total_count == 0)"

      - name: rbac_ria_cannot_approve_amendment
        claim_type: denied_operations
        grounds: ["roles[RevenueIntegrityAnalyst]", "endpoints[POST /api/rate-amendments/{id}/approve]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "RevenueIntegrityAnalyst is not in the approve endpoint's roles ([ContractManager]) -> 403 ERR_FORBIDDEN_FOR_ROLE; the amendment stays DRAFT."
        test_recipe:
          setup: ["payer P; contract C ACTIVE with term; DRAFT amendment A"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer RA", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "RA-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${contract_id}", effective_date: "2026-09-01", term_overrides: [ { service_category: "INPATIENT_MEDICAL", base_rate_cents: 110000 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              as_user_id: "ca-1"
              captures: { amendment_id: $.data.id }
          trigger:
            - call: "POST /api/rate-amendments/${amendment_id}/approve"
              as: RevenueIntegrityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 with ${err} == ERR_FORBIDDEN_FOR_ROLE"
            - "RateAmendment.${amendment_id}.status still == DRAFT"

      - name: rbac_finance_director_cannot_post_remittance
        claim_type: denied_operations
        grounds: ["roles[FinanceDirector]", "endpoints[POST /api/remittances]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "FinanceDirector (write-offs/reversals) cannot post remittances: 403 ERR_FORBIDDEN_FOR_ROLE fires at priority 2, before any existence check on the claim id."
        test_recipe:
          setup: ["empty DB (no claim needed — role check precedes existence)"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/remittances"
              payload: { claim_id: "00000000-0000-0000-0000-000000000000", paid_amount_cents: 100, remittance_date: "2026-08-01" }
              as: FinanceDirector
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 with ${err} == ERR_FORBIDDEN_FOR_ROLE"

      - name: rbac_contract_analyst_cannot_activate_contract
        claim_type: denied_operations
        grounds: ["roles[ContractAnalyst]", "endpoints[POST /api/payer-contracts/{id}/activate]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "The role that drafts contracts (ContractAnalyst) cannot activate them: 403 ERR_FORBIDDEN_FOR_ROLE; the contract stays DRAFT."
        test_recipe:
          setup: ["payer P; contract C DRAFT"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer CA", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "CA-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 with ${err} == ERR_FORBIDDEN_FOR_ROLE"
            - "PayerContract.${contract_id}.status still == DRAFT"

      - name: rbac_contract_manager_cannot_record_outcome
        claim_type: denied_operations
        grounds: ["roles[ContractManager]", "endpoints[POST /api/appeals/{id}/record_outcome]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "record_outcome is RecoveryManager-exclusive (segregation between negotiators and collections): ContractManager gets 403 ERR_FORBIDDEN_FOR_ROLE even for a nonexistent appeal id (role check precedes existence)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/appeals/00000000-0000-0000-0000-000000000000/record_outcome"
              payload: { outcome: "DENIED" }
              as: ContractManager
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 with ${err} == ERR_FORBIDDEN_FOR_ROLE"

      - name: rbac_system_admin_can_set_clock_but_cannot_create_claims
        claim_type: allowed_operations
        grounds: ["roles[SystemAdmin]", "endpoints[POST /api/_clock/set_current_utc]", "endpoints[POST /api/claims]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "SystemAdmin's only write scope is the logical clock: clock set succeeds (200 with the inline sweep summary), claim creation is denied 403."
        test_recipe:
          setup: ["payer P ACTIVE"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer SY", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: SystemAdmin
              captures: { now: $.data.current_utc }
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-SY1", patient_account_number: "PA-SY1", service_category: "LAB", admission_date: "2026-06-01", discharge_date: "2026-06-01", total_billed_charges_cents: 100 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "clock set succeeds: current_utc == 2026-08-03T00:00:00Z (${now})"
            - "claim create denied 403 with ${err} == ERR_FORBIDDEN_FOR_ROLE"

      - name: rbac_auditor_can_read_any_resource
        claim_type: allowed_operations
        grounds: ["roles[Auditor]", "endpoints[GET /api/payers/{id}]"]
        distinguishing_aspect: "Auditor (no exclusive operations) can still perform every GET: reading a payer returns 200 with the stored row."
        test_recipe:
          setup: ["payer P ACTIVE"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer AU", payer_type: "WORKERS_COMP", appeal_deadline_days: 60 }
              as: ContractManager
              captures: { payer_id: $.data.id }
          trigger:
            - call: "GET /api/payers/${payer_id}"
              as: Auditor
              captures: { nm: $.data.name, pt: $.data.payer_type }
          assert:
            - "GET returns 200 with name == Payer AU (${nm}) and payer_type == WORKERS_COMP (${pt})"

  # ===========================================================================
  # Section: endpoints (side-effect coverage)
  # ===========================================================================
  - section: endpoints
    instances:
      - name: ep_accept_proposal_materializes_successor_contract
        claim_type: conditional_action
        grounds: ["state_machines.ContractProposal.SUBMITTED_to_ACCEPTED", "endpoints[POST /api/contract-proposals/{id}/accept]"]
        distinguishing_aspect: "Accepting a SUBMITTED proposal creates the successor contract in DRAFT with prior_contract_id pointing at the current contract and one ContractTerm per proposed_terms entry (base 550000 here)."
        test_recipe:
          setup: ["payer P; contract C ACTIVE CASE_RATE OUTPATIENT_SURGERY 500000; proposal (proposed 550000, mix 2) modeled and submitted"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer AP", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "AP-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 500000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/contract-proposals"
              payload: { contract_id: "${contract_id}", proposed_terms: [ { service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 550000 } ], projected_volume_mix: [ { service_category: "OUTPATIENT_SURGERY", annual_units: 2 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              captures: { proposal_id: $.data.id }
            - call: "POST /api/contract-proposals/${proposal_id}/run_model"
              as: ContractAnalyst
            - call: "POST /api/contract-proposals/${proposal_id}/submit"
              as: ContractManager
          trigger:
            - call: "POST /api/contract-proposals/${proposal_id}/accept"
              payload: { successor_contract_code: "AP-2027", successor_effective_date: "2027-01-01", successor_expiration_date: "2027-12-31" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { pst: $.data.status }
            - call: "GET /api/payer-contracts"
              payload: { prior_contract_id: "${contract_id}" }
              as: FinanceDirector
              captures: { succ_id: "$.data[0].id", succ_st: "$.data[0].status", succ_code: "$.data[0].contract_code" }
            - call: "GET /api/contract-terms"
              payload: { contract_id: "${succ_id}" }
              as: FinanceDirector
              captures: { term_rate: "$.data[0].base_rate_cents" }
          assert:
            - "ContractProposal.${proposal_id}.status == ACCEPTED (${pst})"
            - "successor PayerContract.${succ_id}: status == DRAFT (${succ_st}), contract_code == AP-2027 (${succ_code}), window 2027-01-01..2027-12-31"
            - "successor carries exactly one ContractTerm: OUTPATIENT_SURGERY CASE_RATE base_rate_cents == 550000 (${term_rate})"

      - name: ep_new_proposal_withdraws_prior_open
        claim_type: standard_crud
        grounds: ["state_machines.ContractProposal.DRAFT_to_WITHDRAWN", "endpoints[POST /api/contract-proposals]"]
        distinguishing_aspect: "Create-with-supersede: creating proposal P2 on a contract withdraws the prior open proposal P1 (P1.status WITHDRAWN) and bumps the contract version once per create."
        test_recipe:
          setup: ["payer P; contract C ACTIVE CASE_RATE OUTPATIENT_SURGERY 500000"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer NP", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "NP-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 500000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/contract-proposals"
              payload: { contract_id: "${contract_id}", proposed_terms: [ { service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 550000 } ], projected_volume_mix: [ { service_category: "OUTPATIENT_SURGERY", annual_units: 2 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              captures: { p1: $.data.id }
            - call: "GET /api/payer-contracts/${contract_id}"
              as: ContractAnalyst
              captures: { cv2: $.data.version }
          trigger:
            - call: "POST /api/contract-proposals"
              payload: { contract_id: "${contract_id}", proposed_terms: [ { service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 560000 } ], projected_volume_mix: [ { service_category: "OUTPATIENT_SURGERY", annual_units: 3 } ], expected_contract_version: "${cv2}" }
              as: ContractAnalyst
              captures: { p2: $.data.id }
            - call: "GET /api/contract-proposals/${p1}"
              as: ContractAnalyst
              captures: { p1_st: $.data.status }
          assert:
            - "second create succeeds (${p2} exists, DRAFT) using the post-P1 contract version"
            - "ContractProposal.${p1}.status == WITHDRAWN (${p1_st}) — superseded by the newer open proposal"

      - name: ep_new_amendment_voids_prior_pending
        claim_type: standard_crud
        grounds: ["state_machines.RateAmendment.DRAFT_to_VOIDED", "endpoints[POST /api/rate-amendments]"]
        distinguishing_aspect: "Create-with-supersede on amendments: creating A2 voids the prior pending A1 (A1.status VOIDED, its version incremented)."
        test_recipe:
          setup: ["payer P; contract C ACTIVE with term; DRAFT amendment A1"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer NA", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "NA-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${contract_id}", effective_date: "2026-09-01", term_overrides: [ { service_category: "INPATIENT_MEDICAL", base_rate_cents: 110000 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              as_user_id: "ca-1"
              captures: { a1: $.data.id }
            - call: "GET /api/payer-contracts/${contract_id}"
              as: ContractAnalyst
              captures: { cv2: $.data.version }
          trigger:
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${contract_id}", effective_date: "2026-10-01", term_overrides: [ { service_category: "INPATIENT_MEDICAL", base_rate_cents: 115000 } ], expected_contract_version: "${cv2}" }
              as: ContractAnalyst
              as_user_id: "ca-1"
              captures: { a2: $.data.id }
            - call: "GET /api/rate-amendments/${a1}"
              as: ContractAnalyst
              captures: { a1_st: $.data.status, a1_v: $.data.version }
          assert:
            - "second create succeeds (${a2} exists, DRAFT)"
            - "RateAmendment.${a1}.status == VOIDED (${a1_st}) and version == 2 (${a1_v}) — voided by supersession"

      - name: ep_activation_supersedes_renewal_predecessor
        claim_type: action_endpoint
        grounds: ["state_machines.PayerContract.DRAFT_to_ACTIVE", "state_machines.PayerContract.ACTIVE_to_SUPERSEDED", "endpoints[POST /api/payer-contracts/{id}/activate]"]
        distinguishing_aspect: "Renewal cascade: activating B (prior_contract_id = A, sharing only the boundary date 2026-12-31) moves A from ACTIVE to SUPERSEDED and bumps A's version."
        test_recipe:
          setup: ["payer P; contract A ACTIVE (2026-01-01..2026-12-31) with term; contract B DRAFT renewal (2026-12-31..2027-12-31, prior A)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer RN", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "RN-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { ca: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${ca}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${ca}/activate"
              as: ContractManager
              captures: { cav: $.data.version }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "RN-2027", effective_date: "2026-12-31", expiration_date: "2027-12-31", prior_contract_id: "${ca}" }
              as: ContractAnalyst
              captures: { cb: $.data.id }
          trigger:
            - call: "POST /api/payer-contracts/${cb}/activate"
              as: ContractManager
              captures: { b_st: $.data.status }
            - call: "GET /api/payer-contracts/${ca}"
              as: ContractManager
              captures: { a_st: $.data.status, a_v: $.data.version }
          assert:
            - "B activates: status == ACTIVE (${b_st})"
            - "A is superseded by the renewal cascade: status == SUPERSEDED (${a_st}) and version == ${cav} + 1 (${a_v})"

      - name: ep_clock_sweep_term_expiring_alerts_deduped
        claim_type: computed_read
        grounds: [calculations.clock_sweep, entities.ContractAlert.fields.alert_type, "endpoints[GET /api/contract-alerts]"]
        distinguishing_aspect: "Alert windows are inclusive and deduped: at 2026-08-01 a contract expiring 2026-10-30 (exactly 90 days) gets TERM_EXPIRING_90 only; re-sweeping at 2026-09-30 (30 days out) adds TERM_EXPIRING_30 without duplicating the 90-day alert."
        test_recipe:
          setup: ["payer P; contract C ACTIVE expiring 2026-10-30"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer AL", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "AL-2026", effective_date: "2026-01-01", expiration_date: "2026-10-30" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              captures: { gen1: $.data.alerts_generated }
            - call: "GET /api/contract-alerts"
              payload: { contract_id: "${contract_id}", alert_type: "TERM_EXPIRING_90" }
              as: ContractManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /api/contract-alerts"
              payload: { contract_id: "${contract_id}" }
              as: ContractManager
          assert:
            - "first sweep (90 days out, inclusive boundary): exactly one TERM_EXPIRING_90 alert for ${contract_id}, none of type TERM_EXPIRING_30 (${gen1} == 1)"
            - "second sweep (30 days out): contract now has exactly 2 alerts — one TERM_EXPIRING_90 (deduped, not re-created) and one TERM_EXPIRING_30"
            - "all alerts status == TRIGGERED and contract still ACTIVE"

      - name: ep_clock_sweep_expires_contract_with_alert
        claim_type: action_endpoint
        grounds: ["state_machines.PayerContract.ACTIVE_to_EXPIRED", calculations.clock_sweep, entities.ContractAlert.fields.alert_type]
        distinguishing_aspect: "Expiry boundary: at 2026-08-16 a contract with expiration_date 2026-08-15 (today > expiration) transitions ACTIVE -> EXPIRED and emits exactly one TERM_EXPIRED alert."
        test_recipe:
          setup: ["payer P; contract C ACTIVE 2026-01-01..2026-08-15"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer EX", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "EX-2026", effective_date: "2026-01-01", expiration_date: "2026-08-15" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: SystemAdmin
              captures: { expired: $.data.contracts_expired }
            - call: "GET /api/payer-contracts/${contract_id}"
              as: ContractManager
              captures: { st: $.data.status }
            - call: "GET /api/contract-alerts"
              payload: { contract_id: "${contract_id}", alert_type: "TERM_EXPIRED" }
              as: ContractManager
          assert:
            - "sweep expired exactly 1 contract (${expired} == 1)"
            - "PayerContract.${contract_id}.status == EXPIRED (${st})"
            - "exactly one TERM_EXPIRED alert exists for ${contract_id}"

      - name: ep_clock_sweep_expires_filed_appeal
        claim_type: action_endpoint
        grounds: ["state_machines.Appeal.FILED_to_EXPIRED", calculations.appeal_response_deadline, calculations.clock_sweep]
        distinguishing_aspect: "The due date itself is still timely: a level-1 appeal filed 2026-08-01 (response_due 2026-08-31) is EXPIRED only when today > due — the 2026-09-01 sweep sets outcome EXPIRED and outcome_recorded_date 2026-09-01; the case stays APPEAL_L1 (non-level-4 expiry)."
        test_recipe:
          setup: ["case APPEAL_L1 with FILED level-1 appeal (claim 200000, remittance 100000)"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer AX", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "AX-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-AX1", patient_account_number: "PA-AX1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 100000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: RecoveryManager
              captures: { case_id: "$.data[0].id" }
            - call: "POST /api/underpayment-cases/${case_id}/pick_up"
              as: RecoveryManager
              as_user_id: "rm-1"
            - call: "POST /api/appeals"
              payload: { case_id: "${case_id}", level: 1 }
              as: RecoveryManager
              as_user_id: "rm-1"
              captures: { appeal_id: $.data.id }
            - call: "POST /api/appeals/${appeal_id}/file"
              as: RecoveryManager
              as_user_id: "rm-1"
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
              captures: { exp_n: $.data.appeals_expired }
            - call: "GET /api/appeals/${appeal_id}"
              as: RecoveryManager
              captures: { st: $.data.status, oc: $.data.outcome, ord: $.data.outcome_recorded_date }
            - call: "GET /api/underpayment-cases/${case_id}"
              as: RecoveryManager
              captures: { cst: $.data.status }
          assert:
            - "sweep expired exactly 1 appeal (${exp_n} == 1)"
            - "Appeal.${appeal_id}: status == EXPIRED (${st}), outcome == EXPIRED (${oc}), outcome_recorded_date == 2026-09-01 (${ord})"
            - "UnderpaymentCase.${case_id}.status == APPEAL_L1 (${cst}) — non-level-4 expiry does not end the case"

      - name: ep_clock_sweep_escalator_upcoming_alert
        claim_type: computed_read
        grounds: [calculations.clock_sweep, entities.ContractAlert.fields.escalator_id, "endpoints[GET /api/contract-alerts]"]
        distinguishing_aspect: "A SCHEDULED escalator effective 2026-08-20 (19 days out, within the 30-day window) yields exactly one ESCALATOR_UPCOMING alert keyed by contract + escalator, and the escalator itself is NOT applied early."
        test_recipe:
          setup: ["payer P; contract C ACTIVE with term; escalator E SCHEDULED effective 2026-08-20"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer EU", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "EU-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/rate-escalators"
              payload: { contract_id: "${contract_id}", effective_date: "2026-08-20", escalator_bp: 1000, compounding: true }
              as: ContractAnalyst
              captures: { esc_id: $.data.id }
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /api/contract-alerts"
              payload: { escalator_id: "${esc_id}" }
              as: ContractManager
              captures: { at: "$.data[0].alert_type" }
            - call: "GET /api/rate-escalators/${esc_id}"
              as: ContractManager
              captures: { est: $.data.status }
          assert:
            - "exactly one alert for escalator ${esc_id}, alert_type == ESCALATOR_UPCOMING (${at})"
            - "RateEscalator.${esc_id}.status still == SCHEDULED (${est}) — upcoming alert does not apply the escalator"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: xc_amendment_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[amendment-create-stale-contract]", "validations[priority=5]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        distinguishing_aspect: "OCC on PayerContract.version: after the first amendment create advances the contract version, a second create carrying the previously observed version is rejected 412 ERR_STALE_CONTRACT_VERSION and the still-current amendment is NOT voided."
        test_recipe:
          setup: ["payer P; contract C ACTIVE with term (version observed at activate); amendment A1 created with that version"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer OC", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "OC-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${contract_id}", effective_date: "2026-09-01", term_overrides: [ { service_category: "INPATIENT_MEDICAL", base_rate_cents: 110000 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              as_user_id: "ca-1"
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /api/rate-amendments"
              payload: { contract_id: "${contract_id}", effective_date: "2026-10-01", term_overrides: [ { service_category: "INPATIENT_MEDICAL", base_rate_cents: 115000 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              as_user_id: "ca-1"
              captures: { err: $.data.error_id }
          assert:
            - "response is 412 with ${err} == ERR_STALE_CONTRACT_VERSION (the ${cv} observation went stale when A1 bumped the contract)"
            - "RateAmendment.${a1}.status still == DRAFT — a failed create does not void the pending amendment"

      - name: xc_proposal_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[proposal-create-stale-contract]", "validations[priority=5]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        distinguishing_aspect: "The second OCC rule guards proposal creation: after the first proposal create advances the contract version, a second create with the stale observed version is rejected 412 ERR_STALE_CONTRACT_VERSION and the open proposal is NOT withdrawn."
        test_recipe:
          setup: ["payer P; contract C ACTIVE with CASE_RATE term; proposal P1 created with the version observed at activate"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer OP", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "OP-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 500000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
              captures: { cv: $.data.version }
            - call: "POST /api/contract-proposals"
              payload: { contract_id: "${contract_id}", proposed_terms: [ { service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 550000 } ], projected_volume_mix: [ { service_category: "OUTPATIENT_SURGERY", annual_units: 2 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /api/contract-proposals"
              payload: { contract_id: "${contract_id}", proposed_terms: [ { service_category: "OUTPATIENT_SURGERY", rate_model: "CASE_RATE", base_rate_cents: 560000 } ], projected_volume_mix: [ { service_category: "OUTPATIENT_SURGERY", annual_units: 3 } ], expected_contract_version: "${cv}" }
              as: ContractAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response is 412 with ${err} == ERR_STALE_CONTRACT_VERSION"
            - "ContractProposal.${p1}.status still == DRAFT — a failed create does not withdraw the open proposal"

      - name: xc_amendment_cascade_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: amendment_effective_reprice_case_restate_cascade
          rationale: "The amendment-application 3-link cascade is exercised end-to-end in §1.8 rule 4."

      - name: xc_escalator_void_cascade_covered
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: escalator_void_reprice_case_restate_cascade
          rationale: "The escalator-void 3-link cascade is exercised end-to-end in §1.8 rule 4."

      - name: xc_dual_variant_covered
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: prospective_vs_retrospective_repricing_diverges
          rationale: "Both dual-variant calculations (claim pricing PROSPECTIVE/RETROSPECTIVE and proposal SAME_STORE/MIX_SHIFTED) are covered by the two §1.8 rule-1 instances."

      - name: xc_rate_threshold_covered
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: variance_exactly_at_threshold_queues_case
          rationale: "Threshold boundary semantics (max of abs/rel legs, inclusive >=) are asserted in §1.8 rule 6; the volume-tier threshold is additionally covered by calc_volume_tier_inclusive_boundary in this file."

  # ===========================================================================
  # Section: consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: cm_immediate_visibility_after_remittance
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, "endpoints[POST /api/remittances]", calculations.variance_and_queue_threshold]
        distinguishing_aspect: "Immediate consistency: the remittance POST and the very next GET (same test, no clock move) already show paid 150000, variance 50000, remittance_status VARIANCE_FLAGGED, and the created case — variance evaluation is atomic within the request."
        test_recipe:
          setup: ["payer P; contract C ACTIVE PER_DIEM 100000/day; claim CL-IM1 priced 200000"]
          setup_api_calls:
            - call: "POST /api/payers"
              payload: { name: "Payer IM", payer_type: "COMMERCIAL", appeal_deadline_days: 45 }
              as: ContractManager
              captures: { payer_id: $.data.id }
            - call: "POST /api/payer-contracts"
              payload: { payer_id: "${payer_id}", contract_code: "IM-2026", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ContractAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /api/contract-terms"
              payload: { contract_id: "${contract_id}", service_category: "INPATIENT_MEDICAL", rate_model: "PER_DIEM", base_rate_cents: 100000 }
              as: ContractAnalyst
            - call: "POST /api/payer-contracts/${contract_id}/activate"
              as: ContractManager
            - call: "POST /api/claims"
              payload: { payer_id: "${payer_id}", claim_number: "CL-IM1", patient_account_number: "PA-IM1", service_category: "INPATIENT_MEDICAL", admission_date: "2026-06-01", discharge_date: "2026-06-03", total_billed_charges_cents: 500000 }
              as: RevenueIntegrityAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /api/claims/${claim_id}/lines"
              payload: { revenue_code: "0100", service_date: "2026-06-01", charge_cents: 250000, units: 1 }
              as: RevenueIntegrityAnalyst
            - call: "POST /api/claims/${claim_id}/price"
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /api/remittances"
              payload: { claim_id: "${claim_id}", paid_amount_cents: 150000, remittance_date: "2026-08-01" }
              as: RevenueIntegrityAnalyst
              captures: { rem_id: $.data.id, rst: $.data.status }
            - call: "GET /api/claims/${claim_id}"
              as: Auditor
              captures: { paid: $.data.paid_amount_cents, var: $.data.variance_cents, rs: $.data.remittance_status }
            - call: "GET /api/underpayment-cases"
              payload: { claim_id: "${claim_id}" }
              as: Auditor
              captures: { cvar: "$.data[0].original_variance_cents" }
          assert:
            - "Remittance.${rem_id}.status == POSTED in the creation response (${rst})"
            - "immediately after: Claim.${claim_id}.paid_amount_cents == 150000, variance_cents == 50000, remittance_status == VARIANCE_FLAGGED (${paid}/${var}/${rs})"
            - "the QUEUED case already exists with original_variance_cents == 50000 (${cvar})"
