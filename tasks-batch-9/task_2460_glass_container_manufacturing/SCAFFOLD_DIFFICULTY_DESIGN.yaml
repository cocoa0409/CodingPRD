      - name: color_change_closed_intervals_and_rolling_thirty_day_cap_on_furnace
        grounds:
          - validations.priority_36
          - validations.priority_37
          - errors.ERR_COLOR_CHANGE_WINDOW_CONFLICT
          - errors.ERR_COLOR_CHANGE_RATE_EXCEEDED
          - entities.ColorChange.fields.window_start_at
        distinguishing_aspect: |
          A different resource (the Furnace, not a forming machine) with the opposite interval
          semantics: colour-change windows are CLOSED [start, end], so a change starting exactly when
          another ends collides, which is precisely the case the half-open machine rule accepts. The
          same instance also pins the aggregate side: a fifth SCHEDULED change inside the rolling
          30-day window measured from the new change's window_start_at is refused even though its
          window overlaps nothing.
        test_recipe:
          setup:
            - "Furnace F-17 registered with current_color FLINT; no campaign is needed"
            - "ColorChange CC-17A SCHEDULED with the closed window 2026-08-01T00:00:00Z..2026-08-02T00:00:00Z"
            - "Logical clock left at its 2026-08-01T00:00:00Z default so every window stays in the future"
          setup_api_calls:
            - call: "POST /glass-plant/furnaces"
              payload: { code: "F-17", design_pull_tpd: 300.00, refractory_life_total_units: 100000.00 }
              as: PlantManager
              captures: { f: "$.data.id" }
            - call: "POST /glass-plant/color-changes"
              payload: { furnace_id: "${f}", to_color: "AMBER", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-02T00:00:00Z", transition_loss_tons: 90.00 }
              as: BatchHouseTech
              captures: { cc1: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/color-changes"
              payload: { furnace_id: "${f}", to_color: "GREEN", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-03T00:00:00Z", transition_loss_tons: 80.00 }
              as: BatchHouseTech
            - call: "POST /glass-plant/color-changes"
              payload: { furnace_id: "${f}", to_color: "GREEN", window_start_at: "2026-08-03T00:00:00Z", window_end_at: "2026-08-04T00:00:00Z", transition_loss_tons: 80.00 }
              as: BatchHouseTech
              captures: { cc2: "$.data.id" }
            - call: "POST /glass-plant/color-changes"
              payload: { furnace_id: "${f}", to_color: "FLINT", window_start_at: "2026-08-05T00:00:00Z", window_end_at: "2026-08-06T00:00:00Z", transition_loss_tons: 70.00 }
              as: BatchHouseTech
              captures: { cc3: "$.data.id" }
            - call: "POST /glass-plant/color-changes"
              payload: { furnace_id: "${f}", to_color: "AMBER", window_start_at: "2026-08-07T00:00:00Z", window_end_at: "2026-08-08T00:00:00Z", transition_loss_tons: 70.00 }
              as: BatchHouseTech
              captures: { cc4: "$.data.id" }
            - call: "POST /glass-plant/color-changes"
              payload: { furnace_id: "${f}", to_color: "GREEN", window_start_at: "2026-08-09T00:00:00Z", window_end_at: "2026-08-10T00:00:00Z", transition_loss_tons: 70.00 }
              as: BatchHouseTech
          assert:
            - "create starting at 2026-08-02T00:00:00Z (the first change's window_end_at): 409 with error id ERR_COLOR_CHANGE_WINDOW_CONFLICT"
            - "creates for 08-03..08-04, 08-05..08-06 and 08-07..08-08: 201 each, status SCHEDULED"
            - "create for 08-09..08-10: 409 with error id ERR_COLOR_CHANGE_RATE_EXCEEDED"
            - "final state: exactly 4 ColorChange rows on Furnace.${f} (CC-17A plus the three accepted changes), all SCHEDULED"
            - "the rate refusal is not a window conflict: 08-09..08-10 overlaps nothing, it is the fifth change inside the rolling 30 days from 2026-08-09T00:00:00Z"

  - rule_id: compensating_invariant
    instances:
      - name: job_cancel_returns_reserved_melt_tons_to_the_campaign_pull_pool
        grounds:
          - state_machines.ProductionJob.SCHEDULED_to_CANCELLED
          - calculations.furnace_pull_availability
          - entities.Furnace.fields.reserved_pull_tons
          - validations.priority_47
          - errors.ERR_PULL_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          The conserved quantity is melt tonnage: Furnace.reserved_pull_tons plus
          Campaign.melt_tons_charged must never exceed the campaign's 600.00 t pool. With the pool
          fully reserved a second identical job is refused; cancelling the first job must return
          exactly 600.00 t (not part of it, and not by also charging melt_tons_charged), which is
          proved by the identical re-create succeeding and reserved_pull_tons landing back on 600.00
          with melt_tons_charged still 0.00.
        test_recipe:
          setup:
            - "Furnace F-18: design_pull_tpd 300.00, refractory_life_total_units 100000.00"
            - "Campaign CMP-18 ACTIVE with target_pull_tpd 300.00 over 2026-08-01T00:00:00Z..2026-08-03T00:00:00Z, so the pull pool is exactly 600.00 t"
            - "ProductionJob PJ-18A SCHEDULED across the whole campaign window at planned_pull_tpd 300.00, reserving exactly 600.00 t"
            - "Two mold sets MS-18A and MS-18B on the same APPROVED design"
