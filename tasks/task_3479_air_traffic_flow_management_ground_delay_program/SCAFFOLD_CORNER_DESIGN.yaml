              as: FlowManager
              captures: { fc: $.data.id }
            - call: "POST /atfm/capacity-forecasts/${fc}/publish"
              as: FlowManager
            - call: "POST /atfm/facilities/${fac}/tmis"
              payload: { tmi_type: "GROUND_DELAY_PROGRAM", program_start: "2026-09-15T13:00:00Z", program_end: "2026-09-15T15:00:00Z", controlled_rate: 6 }
              as: FlowManager
              as_user_id: "fm-1"
              captures: { tmi: $.data.id }
            - call: "POST /atfm/tmis/${tmi}/publish"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "POST /atfm/tmis/${tmi}/activate"
              as: FlowManager
            - call: "POST /atfm/operators/${op_ga}/ga-requests"
              payload: { tmi_id: "${tmi}", requested_window_start: "2026-09-15T14:30:00Z", requested_window_end: "2026-09-15T15:00:00Z", priority_class: "STANDARD" }
              as: Operator
              as_user_id: "${op_ga}"
              captures: { gq: $.data.id }
          trigger:
            - call: "POST /atfm/tmis/${tmi}/cancel"
              as: CommandCenterAdmin
              as_user_id: "cc-1"
            - call: "GET /atfm/operators/${op_ga}/ga-requests"
              as: FlowManager
              captures: { gq_status: "$.data[0].status" }
          assert:
            - "gq_status == EXPIRED (auto-cascade; no adjudication call was made)"
            - "TMI status == CANCELLED"

      - name: waitlisted_ga_promoted_by_compression
        claim_type: side_effect_execution
        grounds:
          - state_machines.GAAccommodationRequest.WAITLISTED_to_ACCOMMODATED
          - calculations.compression_reallocation
        distinguishing_aspect: "A WAITLISTED GA request is promoted inside the compression run (promotion scan BEFORE carrier moves): cancelling the GA-holding flight frees the reserved slot and the waitlisted request takes it, creating a new flight with CTA 13:55 — while zero carrier moves occur."
        test_recipe:
          setup:
            - "ACTIVE GDP rate 12, 13:00-14:00Z (12 slots; 13:55 GA-reserved); carrier flights A1(13:02), A2(13:07) of op_a at 13:00/13:05"
            - "GA request gq1 ACCOMMODATED at 13:55 (its flight created); GA request gq2 WAITLISTED (quota exhausted)"
            - "gq1's flight cancelled, releasing the reserved slot"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
              as: SystemAdministrator
