  # ---------------------------------------------------------------------------
  # SECTION: validations  (guide "From Table 4 (Validations)")
  # One instance per §1.4 priority row, plus the priority-conflict, cross-entity,
  # temporal, aggregate, conditional and cascading patterns from the same table.
  # Priority 12 (ERR_STALE_DEAL_VERSION / ERR_STALE_PROGRAM_VERSION) is covered in
  # the optimistic_concurrency section below, as the complexity-layer table requires.
  # ---------------------------------------------------------------------------
  - section: validations
    instances:

      - name: request_without_user_id_header_returns_4xx
        claim_type: violation_to_error
        grounds:
          - validations.priority_1
          - errors.ERR_MISSING_AUTH_HEADERS
        distinguishing_aspect: "X-Role is present and valid and the body is fully valid; only X-User-ID is absent, so the answer must be 401 ERR_MISSING_AUTH_HEADERS rather than a successful 201 or any body-level error."
        test_recipe:
          setup: ["a pinned clock and no other state; the trigger call is sent with the X-Role header but with the X-User-ID header omitted entirely"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: null
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401"
            - "data.error_id == \"ERR_MISSING_AUTH_HEADERS\""
            - "no Program row was created (GET /programs/{any id} is impossible; the id was never returned)"

      - name: request_with_unknown_role_header_returns_4xx
        claim_type: violation_to_error
        grounds:
          - validations.priority_2
          - errors.ERR_UNKNOWN_ROLE
        distinguishing_aspect: "The role string is syntactically fine but is not one of the six declared roles, which is 401 ERR_UNKNOWN_ROLE (priority 2) — not 403 ERR_ROLE_NOT_PERMITTED (priority 3), which is reserved for known roles missing from the endpoint's list."
        test_recipe:
          setup: ["a pinned clock and no other state"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: AuditorGeneral
              as_user_id: aud-1
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 401"
            - "data.error_id == \"ERR_UNKNOWN_ROLE\""

      - name: sales_rep_creating_a_program_returns_4xx
        claim_type: violation_to_error
        grounds:
          - validations.priority_3
          - errors.ERR_ROLE_NOT_PERMITTED
          - rbac.ProgramAdmin.exclusive_operations
        distinguishing_aspect: "SalesRep is a declared role, so the failure is 403 ERR_ROLE_NOT_PERMITTED and not 401 ERR_UNKNOWN_ROLE; the body is valid, proving the role gate runs before body validation."
        test_recipe:
          setup: ["a pinned clock and no other state"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
          trigger:
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: SalesRep
              as_user_id: rep-77
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ROLE_NOT_PERMITTED\""

      - name: analyst_identity_outranks_frame_existence_returns_4xx
        claim_type: priority_ordering
        grounds:
          - validations.priority_4
          - validations.priority_5
          - errors.ERR_ANALYST_IDENTITY_INVALID
        distinguishing_aspect: "Two rules are violated at once — an X-User-ID that is not an Analyst (priority 4) and a frame id that does not exist (priority 5). The response must be 403 ERR_ANALYST_IDENTITY_INVALID, not 404 ERR_SAMPLING_FRAME_NOT_FOUND."
        test_recipe:
          setup: ["an ACTIVE program with one ACTIVE analyst; the trigger uses a random uuid for both the frame id and X-User-ID"]
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /programs
              payload: { name: "Q3 Win-Loss", fiscal_quarter: "2026-Q3", incentive_budget_usd: 10000.00, interview_incentive_cap_usd: 500.00, min_deal_value_usd: 50000.00 }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { p_id: $.data.id }
            - call: POST /programs/${p_id}/activate
              payload: {}
              as: ProgramAdmin
              as_user_id: admin-1
            - call: POST /analysts
              payload: { program_id: "${p_id}", full_name: "Ana One", linked_user_ref: "user-ana-1", employment_type: "INTERNAL", certified_until: "2027-01-01T00:00:00.000Z", sales_org_member: false }
              as: ProgramAdmin
              as_user_id: admin-1
              captures: { a1_id: $.data.id }
          trigger:
            - call: POST /sampling-frames/00000000-0000-4000-8000-000000000fff/seal
              payload: {}
              as: ResearchAnalyst
              as_user_id: not-an-analyst-uuid
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "data.error_id == \"ERR_ANALYST_IDENTITY_INVALID\""

      - name: deactivated_analyst_cannot_record_an_interview_response
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_4
          - state_machines.Analyst.ACTIVE_to_INACTIVE
          - errors.ERR_ANALYST_IDENTITY_INVALID
        distinguishing_aspect: "The same X-User-ID succeeded before deactivation and must fail with 403 ERR_ANALYST_IDENTITY_INVALID afterwards: the identity rule reads the Analyst row's live status, it is not a static allow-list."
        test_recipe:
          setup: ["an ACTIVE program, a SELECTED deal with a SCHEDULED interview run by analyst a1, one response already recorded by a1, and then a1 deactivated"]
          setup_api_calls:
