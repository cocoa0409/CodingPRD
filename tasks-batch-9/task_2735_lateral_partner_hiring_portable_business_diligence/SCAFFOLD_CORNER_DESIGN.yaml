      - name: candidate_read_exposes_the_derived_dates_and_the_clearance_dimension
        claim_type: computed_read
        grounds:
          - endpoints[GET /lateral-hiring/candidates/{candidate_id}]
          - endpoints[GET /lateral-hiring/candidates]
          - entities.Candidate.fields.earliest_start_date
          - entities.Candidate.fields.resignation_date
          - entities.Candidate.fields.open_offer_id
        distinguishing_aspect: |
          Four of the Candidate's readable fields are never supplied by any request body:
          resignation_date and hire_date are stamped from the logical clock by a cascade that
          starts two aggregates away (offer accept), earliest_start_date is derived from
          resignation_date plus notice_period_days, and clearance_status is a second state
          dimension driven only by ConflictCheck rows. The paired collection read then proves
          the same derived fields are filterable, not merely renderable: pipeline_status=HIRED
          plus clearance_status=CLEARED must return exactly this candidate.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup and one ACTIVE SearchFirmEngagement with exclusivity [2026-08-01, 2026-12-01)."
            - "One Candidate with notice_period_days 45 whose offer (guaranteed 500000.00 + signing 50000.00) was APPROVED and then ACCEPTED at the logical clock 2026-08-01T00:00:00.000Z, so pipeline_status == HIRED and clearance_status == CLEARED."
