scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: etf_in_window_vs_out_of_window_same_plan
    grounds:
    - calculations.early_termination_fee
    - state_machines.Subscription.ACTIVE_to_CANCELLED_IN_WINDOW
    - state_machines.Subscription.ACTIVE_to_CANCELLED_ETF
    distinguishing_aspect: "Identical subscription data (annual plan, 50% ETF, same monthly_charge_cents) yields\netf_amount_cents == 0 when finalized inside the 14-day window but 148715 cents when\nfinalized\
      \ 5.5 months later \u2014 a dual-variant billing outcome on Subscription driven only\nby the logical clock.\n"
    test_recipe:
      setup:
      - Bootstrap org B0 with admin BA0 (procedural; BA0.id used as primary_admin_id when creating real orgs)
      - Org O1 ENTERPRISE ACTIVE (primary_admin_id = OA1, an admin of O1)
      - Plan P1 ENTERPRISE ANNUAL_MONTHLY_BILLED monthly 5999 annual 4999 storage 100 seat_limit -1 modes [NAMED_USER] offline false max_devices 2 window 14d etf 50
      - Reseller R1 PLATINUM NA ACTIVE
      - Subscription S1 on P1 via R1, 10 seats, activated at clock default 2026-09-01 (monthly_charge_cents 42490)
      - Cancellation request CR1 created by OA1
      setup_api_calls:
      - call: POST /licensing/organizations
        payload:
          name: B0
          org_type: INDIVIDUAL
          primary_admin_id: 00000000-0000-0000-0000-000000000000
        as: SystemAdmin
        captures:
          b0: $.data.id
      - call: POST /licensing/admins
        payload:
          email: ba0@b0.com
          full_name: Boot
          admin_kind: SYSTEM_ADMIN
          org_id: ${b0}
        as: SystemAdmin
        captures:
          ba0: $.data.id
      - call: POST /licensing/organizations
        payload:
          name: O1
          org_type: ENTERPRISE
          primary_admin_id: ${ba0}
        as: SystemAdmin
        captures:
          o1: $.data.id
      - call: POST /licensing/admins
        payload:
          email: oa1@o1.com
          full_name: Admin One
          admin_kind: SYSTEM_ADMIN
          org_id: ${o1}
        as: SystemAdmin
        captures:
          oa1: $.data.id
      - call: POST /licensing/plans
        payload:
          code: P1
          segment: ENTERPRISE
          billing_model: ANNUAL_MONTHLY_BILLED
          monthly_price_cents: 5999
          annual_monthly_price_cents: 4999
          storage_gb_per_seat: 100
          seat_limit: -1
          deployment_modes:
          - NAMED_USER
          allows_offline_activation: false
          max_devices_per_seat: 2
          cancellation_window_days: 14
          etf_rate_pct: 50
        as: SystemAdmin
        captures:
          p1: $.data.id
      - call: POST /licensing/resellers
        payload:
          name: R1
          region: NA
          tier: PLATINUM
        as: SystemAdmin
        captures:
          r1: $.data.id
      - call: POST /licensing/subscriptions
        payload:
          org_id: ${o1}
          plan_id: ${p1}
          seats_purchased: 10
          reseller_id: ${r1}
        as: SystemAdmin
        captures:
          s1: $.data.id
      - call: POST /licensing/subscriptions/${s1}/activate
        payload: {}
        as: SystemAdmin
      - call: POST /licensing/cancellation-requests
        payload:
          subscription_id: ${s1}
          requested_by_admin_id: ${oa1}
        as: OrgAdmin
        as_user_id: ${oa1}
        captures:
          cr1: $.data.id
      trigger:
      - call: POST /licensing/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-10T00:00:00Z'
        as: SystemAdmin
      - call: POST /licensing/cancellation-requests/${cr1}/finalize
        payload: {}
        as: SystemAdmin
      assert:
      - CancellationRequest.${cr1}.status == REFUNDED
      - CancellationRequest.${cr1}.etf_amount_cents == 0
      - Subscription.${s1}.status == CANCELLED_IN_WINDOW
  - name: reseller_discount_direct_vs_gold_charge
    grounds:
    - calculations.monthly_billed_charge
    distinguishing_aspect: "Same plan price and seat count produce different monthly_charge_cents by variant: direct\ngives 5999x4 = 23996; GOLD-routed gives floor(5999*90/100)=5399 per seat x4 = 21596\
      \ \u2014\ndual-variant on the pricing domain (distinct entity subject from the ETF billing variant).\n"
    test_recipe:
      setup:
      - Bootstrap org B0/admin BA0; org O2 TEAM ACTIVE
      - Plan P2 TEAM MONTHLY monthly 5999 annual 5999 storage 20 seat_limit -1 modes [NAMED_USER] offline false max_devices 2 window 14d etf 0
      - Reseller R2 GOLD EMEA ACTIVE
      - Subscriptions S2a (direct, 4 seats) and S2b (via R2, 4 seats), both activated at default clock
      setup_api_calls:
      - call: POST /licensing/organizations
        payload:
          name: B0
          org_type: INDIVIDUAL
          primary_admin_id: 00000000-0000-0000-0000-000000000000
        as: SystemAdmin
        captures:
          b0: $.data.id
      - call: POST /licensing/admins
        payload:
          email: ba0@b0.com
          full_name: Boot
          admin_kind: SYSTEM_ADMIN
          org_id: ${b0}
        as: SystemAdmin
        captures:
          ba0: $.data.id
      - call: POST /licensing/organizations
        payload:
          name: O2
          org_type: TEAM
          primary_admin_id: ${ba0}
        as: SystemAdmin
        captures:
          o2: $.data.id
      - call: POST /licensing/plans
        payload:
          code: P2
          segment: TEAM
          billing_model: MONTHLY
          monthly_price_cents: 5999
          annual_monthly_price_cents: 5999
          storage_gb_per_seat: 20
          seat_limit: -1
          deployment_modes:
          - NAMED_USER
          allows_offline_activation: false
          max_devices_per_seat: 2
          cancellation_window_days: 14
          etf_rate_pct: 0
        as: SystemAdmin
        captures:
          p2: $.data.id
      - call: POST /licensing/resellers
        payload:
          name: R2
          region: EMEA
          tier: GOLD
        as: SystemAdmin
        captures:
          r2: $.data.id
      - call: POST /licensing/subscriptions
        payload:
          org_id: ${o2}
          plan_id: ${p2}
          seats_purchased: 4
        as: SystemAdmin
        captures:
          s2a: $.data.id
      - call: POST /licensing/subscriptions
        payload:
          org_id: ${o2}
          plan_id: ${p2}
          seats_purchased: 4
          reseller_id: ${r2}
        as: SystemAdmin
        captures:
          s2b: $.data.id
      - call: POST /licensing/subscriptions/${s2a}/activate
        payload: {}
        as: SystemAdmin
      - call: POST /licensing/subscriptions/${s2b}/activate
        payload: {}
        as: SystemAdmin
      trigger:
      - call: GET /licensing/subscriptions/${s2a}
        payload: {}
        as: SystemAdmin
      - call: GET /licensing/subscriptions/${s2b}
        payload: {}
        as: SystemAdmin
      assert:
      - Subscription.${s2a}.monthly_charge_cents == 23996
      - Subscription.${s2b}.monthly_charge_cents == 21596
- rule_id: combinatorial_formula
  instances:
  - name: monthly_charge_per_seat_floor_then_multiply_rounding_order
    grounds:
    - calculations.monthly_billed_charge
    distinguishing_aspect: 'Mode (b) nested rounding: per-seat floor BEFORE seat multiplication. annual 4999 with

      PLATINUM 15% gives floor(4999*85/100) = 4249 per seat, x10 = 42490; the opposite order

      (floor(49990*85/100) = 42491) differs by exactly 1 cent, so the pinned order is observable.

      '
    test_recipe:
      setup:
      - Bootstrap B0/BA0; org O1 ENTERPRISE ACTIVE
      - Plan P1 ENTERPRISE ANNUAL_MONTHLY_BILLED annual 4999; reseller R1 PLATINUM NA; subscription S1 via R1 10 seats PENDING_PAYMENT
      setup_api_calls:
      - call: POST /licensing/organizations
        payload:
          name: B0
          org_type: INDIVIDUAL
          primary_admin_id: 00000000-0000-0000-0000-000000000000
        as: SystemAdmin
        captures:
          b0: $.data.id
      - call: POST /licensing/admins
        payload:
          email: ba0@b0.com
          full_name: Boot
          admin_kind: SYSTEM_ADMIN
          org_id: ${b0}
        as: SystemAdmin
        captures:
          ba0: $.data.id
      - call: POST /licensing/organizations
        payload:
          name: O1
          org_type: ENTERPRISE
          primary_admin_id: ${ba0}
        as: SystemAdmin
        captures:
          o1: $.data.id
      - call: POST /licensing/plans
        payload:
          code: P1
          segment: ENTERPRISE
          billing_model: ANNUAL_MONTHLY_BILLED
          monthly_price_cents: 5999
          annual_monthly_price_cents: 4999
          storage_gb_per_seat: 100
          seat_limit: -1
          deployment_modes:
          - NAMED_USER
          allows_offline_activation: false
          max_devices_per_seat: 2
          cancellation_window_days: 14
          etf_rate_pct: 50
        as: SystemAdmin
        captures:
          p1: $.data.id
      - call: POST /licensing/resellers
        payload:
          name: R1
          region: NA
          tier: PLATINUM
        as: SystemAdmin
        captures:
          r1: $.data.id
      - call: POST /licensing/subscriptions
        payload:
          org_id: ${o1}
          plan_id: ${p1}
          seats_purchased: 10
          reseller_id: ${r1}
        as: SystemAdmin
        captures:
          s1: $.data.id
      trigger:
      - call: POST /licensing/subscriptions/${s1}/activate
        payload: {}
        as: SystemAdmin
      assert:
      - Subscription.${s1}.monthly_charge_cents == 42490
  - name: compliance_posture_four_way_precedence_branch
    grounds:
    - calculations.org_compliance_posture
    distinguishing_aspect: "Mode (a): posture is a >=3-input conditional branch (over-allocation count, open-audit\nexistence, findings flag) with pinned precedence FROZEN > OVER_ALLOCATED > UNDER_AUDIT\
      \ >\nCOMPLIANT \u2014 non-linear interaction across org aggregate state, not a rounding chain.\n"
    test_recipe:
      setup:
      - Bootstrap B0/BA0; org O3 TEAM ACTIVE; admin OA3 in O3
      - Plan P3 TEAM MONTHLY monthly 3000 storage 20; subscription S3 1 seat ACTIVE (seats_assigned == 0 <= 1, not over-allocated)
      - Compliance audit CA3 OPEN on O3 (posture -> UNDER_AUDIT)
      setup_api_calls:
      - call: POST /licensing/organizations
        payload:
          name: B0
          org_type: INDIVIDUAL
          primary_admin_id: 00000000-0000-0000-0000-000000000000
        as: SystemAdmin
        captures:
          b0: $.data.id
      - call: POST /licensing/admins
        payload:
          email: ba0@b0.com
          full_name: Boot
          admin_kind: SYSTEM_ADMIN
          org_id: ${b0}
        as: SystemAdmin
        captures:
          ba0: $.data.id
      - call: POST /licensing/organizations
        payload:
          name: O3
          org_type: TEAM
          primary_admin_id: ${ba0}
        as: SystemAdmin
        captures:
          o3: $.data.id
      - call: POST /licensing/admins
        payload:
          email: oa3@o3.com
          full_name: Admin Three
          admin_kind: SYSTEM_ADMIN
          org_id: ${o3}
        as: SystemAdmin
        captures:
          oa3: $.data.id
      - call: POST /licensing/plans
        payload:
          code: P3
          segment: TEAM
          billing_model: MONTHLY
          monthly_price_cents: 3000
          annual_monthly_price_cents: 3000
          storage_gb_per_seat: 20
          seat_limit: -1
          deployment_modes:
          - NAMED_USER
          allows_offline_activation: false
          max_devices_per_seat: 2
          cancellation_window_days: 14
          etf_rate_pct: 0
        as: SystemAdmin
        captures:
          p3: $.data.id
      - call: POST /licensing/subscriptions
        payload:
          org_id: ${o3}
          plan_id: ${p3}
          seats_purchased: 1
        as: SystemAdmin
        captures:
          s3: $.data.id
      - call: POST /licensing/subscriptions/${s3}/activate
        payload: {}
        as: SystemAdmin
      - call: POST /licensing/compliance-audits
        payload:
          org_id: ${o3}
          opened_by_admin_id: ${oa3}
        as: SystemAdmin
        captures:
          ca3: $.data.id
      trigger:
      - call: GET /licensing/organizations/${o3}
        payload: {}
        as: SystemAdmin
      assert:
      - Organization.${o3}.compliance_posture == UNDER_AUDIT
      - ComplianceAudit.${ca3}.status == OPEN
- rule_id: non_linear_state_machine
  instances:
  - name: seat_assign_reclaim_cancel_reassign_cycle
    grounds:
    - state_machines.Seat.ASSIGNED_to_PENDING_RECLAIM
    - state_machines.Seat.PENDING_RECLAIM_to_ASSIGNED
    - state_machines.Seat.PENDING_RECLAIM_to_RECLAIMED
    - state_machines.Seat.RECLAIMED_to_ASSIGNED
    distinguishing_aspect: "Seat is cyclic: ASSIGNED -> PENDING_RECLAIM -> ASSIGNED (grace cancel) and\nPENDING_RECLAIM -> RECLAIMED -> ASSIGNED (reuse) \u2014 a loop, not a linear pipeline,\non the Seat\
      \ entity.\n"
    test_recipe:
      setup:
      - Bootstrap B0/BA0; org O4 TEAM ACTIVE; admin OA4; plan P4 TEAM MONTHLY storage 20; subscription S4 1 seat ACTIVE; seat SE4 minted UNASSIGNED; user U4 ACTIVE in O4
      setup_api_calls:
      - call: POST /licensing/organizations
        payload:
          name: B0
          org_type: INDIVIDUAL
          primary_admin_id: 00000000-0000-0000-0000-000000000000
        as: SystemAdmin
        captures:
          b0: $.data.id
      - call: POST /licensing/admins
        payload:
          email: ba0@b0.com
          full_name: Boot
          admin_kind: SYSTEM_ADMIN
          org_id: ${b0}
        as: SystemAdmin
        captures:
          ba0: $.data.id
      - call: POST /licensing/organizations
        payload:
          name: O4
          org_type: TEAM
          primary_admin_id: ${ba0}
        as: SystemAdmin
        captures:
          o4: $.data.id
      - call: POST /licensing/admins
        payload:
          email: oa4@o4.com
          full_name: Admin Four
          admin_kind: SYSTEM_ADMIN
          org_id: ${o4}
        as: SystemAdmin
        captures:
          oa4: $.data.id
      - call: POST /licensing/plans
        payload:
          code: P4
          segment: TEAM
          billing_model: MONTHLY
          monthly_price_cents: 3000
          annual_monthly_price_cents: 3000
          storage_gb_per_seat: 20
          seat_limit: -1
          deployment_modes:
          - NAMED_USER
          allows_offline_activation: false
          max_devices_per_seat: 2
          cancellation_window_days: 14
          etf_rate_pct: 0
        as: SystemAdmin
        captures:
          p4: $.data.id
      - call: POST /licensing/subscriptions
        payload:
          org_id: ${o4}
          plan_id: ${p4}
          seats_purchased: 1
        as: SystemAdmin
        captures:
          s4: $.data.id
      - call: POST /licensing/subscriptions/${s4}/activate
        payload: {}
        as: SystemAdmin
        captures:
          s4v: $.data.version
      - call: POST /licensing/seats
        payload:
          subscription_id: ${s4}
          expected_subscription_version: ${s4v}
        as: SystemAdmin
        captures:
          se4: $.data.id
      - call: POST /licensing/end-users
        payload:
          email: u4@o4.com
          full_name: User Four
          org_id: ${o4}
        as: OrgAdmin
        as_user_id: ${oa4}
        captures:
          u4: $.data.id
      - call: POST /licensing/seats/${se4}/assign
        payload:
          end_user_id: ${u4}
        as: OrgAdmin
        as_user_id: ${oa4}
      - call: POST /licensing/seats/${se4}/reclaim
        payload: {}
        as: OrgAdmin
        as_user_id: ${oa4}
      trigger:
      - call: POST /licensing/seats/${se4}/reclaim/cancel
        payload: {}
        as: OrgAdmin
        as_user_id: ${oa4}
      - call: POST /licensing/seats/${se4}/reclaim
        payload: {}
        as: OrgAdmin
        as_user_id: ${oa4}
      - call: POST /licensing/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-02T00:00:01Z'
        as: SystemAdmin
      - call: POST /licensing/seats/${se4}/reclaim/finalize
        payload: {}
        as: OrgAdmin
        as_user_id: ${oa4}
      - call: POST /licensing/seats/${se4}/assign
        payload:
          end_user_id: ${u4}
        as: OrgAdmin
        as_user_id: ${oa4}
      assert:
      - Seat.${se4}.status == ASSIGNED after the full cycle
      - Seat.${se4}.end_user_id == ${u4}
  - name: enduser_deactivate_reactivate_and_departed_branching
    grounds:
    - state_machines.EndUser.ACTIVE_to_DEACTIVATED
    - state_machines.EndUser.DEACTIVATED_to_ACTIVE
    - state_machines.EndUser.DEACTIVATED_to_DEPARTED
    distinguishing_aspect: "EndUser is branching/cyclic: ACTIVE -> DEACTIVATED -> ACTIVE (reactivation loop) and\nDEACTIVATED -> DEPARTED (terminal-ish fork with different cascades) \u2014 a different entity\n\
      than Seat, exercising a fork where the DEACTIVATED state's exit determines whether seats\nroll back or finalize.\n"
    test_recipe:
      setup:
      - Bootstrap B0/BA0; org O5 TEAM ACTIVE; admin OA5; plan P5 TEAM MONTHLY storage 20; subscription S5 2 seats ACTIVE; seats SE5a, SE5b; users U5a, U5b ACTIVE
