            - "monitor; operator; flight OPERATED; on 2026-07-20: E1 day (10:00, SEL 100) CLASSIFIED_AIRCRAFT, E2 (SEL 110) CLASSIFIED_COMMUNITY, E3 (SEL 120) left SCREENING, E4 night (23:30, SEL 90) CLASSIFIED_AIRCRAFT"
