  - section: cross_cutting_layers
    instances:
      - name: reschedule_with_stale_expected_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-reschedule-stale-version]", "errors[ERR_STALE_BOOKING_VERSION]"]
        distinguishing_aspect: "After a successful reschedule bumps Booking.version, replaying the same captured version is rejected 412 ERR_STALE_BOOKING_VERSION — two strictly sequential requests, deterministic OCC."
        test_recipe:
