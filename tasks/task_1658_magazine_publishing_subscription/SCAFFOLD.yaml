      - "MailingLabel rows created (snapshot of address, postal_code, is_controlled_copy at generation)"
      - "postage_cents computed per label"
      - "expected_piece_count, total_postage_cents computed on batch"
      - "increments MailingBatch.version by 1"

  - method: POST
    path: "/publications/{publicationId}/issues/{issueId}/mailing-batches/{batchId}/verify-postal"
    description: "Postal verification (LABELS_GENERATED → POSTAL_VERIFIED); creates PostalStatement"
    roles: [PostalComplianceOfficer]
    code: 200
    input: []
    output: MailingBatch
    side_effects:
      - "PostalStatement created (immutable)"
      - "increments MailingBatch.version by 1"

  - method: POST
    path: "/publications/{publicationId}/issues/{issueId}/mailing-batches/{batchId}/tender"
    description: "Tender to USPS (POSTAL_VERIFIED → TENDERED)"
    roles: [FulfillmentManager]
    code: 200
    input: []
    output: MailingBatch
    side_effects:
      - "increments MailingBatch.version by 1"

  - method: POST
    path: "/publications/{publicationId}/issues/{issueId}/mailing-batches/{batchId}/confirm"
    description: "Confirm delivery to USPS (TENDERED → CONFIRMED)"
    roles: [PostalComplianceOfficer]
    code: 200
    input: []
    output: MailingBatch
    side_effects:
      - "increments MailingBatch.version by 1"

  # --- MailingLabel ---
  - method: GET
    path: "/publications/{publicationId}/issues/{issueId}/mailing-batches/{batchId}/labels"
    description: "List MailingLabels for a MailingBatch"
    roles: [PublishingDirector, FulfillmentManager, PostalComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "is_controlled_copy?"]
    output: "MailingLabel[]"
    side_effects: []

  - method: GET
    path: "/publications/{publicationId}/issues/{issueId}/mailing-batches/{batchId}/labels/{labelId}"
    description: "Get a MailingLabel"
    roles: [PublishingDirector, FulfillmentManager, PostalComplianceOfficer]
    code: 200
    input: []
    output: MailingLabel
    side_effects: []

  # --- PostalStatement ---
  - method: GET
    path: "/publications/{publicationId}/issues/{issueId}/mailing-batches/{batchId}/postal-statements"
    description: "List PostalStatements for a MailingBatch"
    roles: [PublishingDirector, PostalComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PostalStatement[]"
    side_effects: []

  # --- BackIssueOrder ---
  - method: POST
    path: "/publications/{publicationId}/subscribers/{subscriberId}/back-issue-orders"
    description: "Place a BackIssueOrder"
    roles: [CirculationManager, FulfillmentManager]
    code: 201
    input: [issue_id, quantity]
    output: BackIssueOrder
    side_effects:
      - "unit_price_cents computed via back_issue_unit_price"
      - "shipping_cents flat based on Subscriber.country_code"
      - "total_charged_cents computed"
      - "status = PENDING"

  - method: GET
    path: "/publications/{publicationId}/back-issue-orders"
    description: "List BackIssueOrders for a Publication"
    roles: [PublishingDirector, CirculationManager, FulfillmentManager]
    code: 200
    input: ["limit?", "offset?", "status?", "subscriber_id?", "issue_id?"]
    output: "BackIssueOrder[]"
    side_effects: []

  - method: GET
    path: "/subscribers/{subscriberId}/back-issue-orders"
    description: "List BackIssueOrders placed by a Subscriber"
    roles: [PublishingDirector, CirculationManager, FulfillmentManager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "BackIssueOrder[]"
    side_effects: []

  - method: GET
    path: "/publications/{publicationId}/back-issue-orders/{orderId}"
    description: "Get a BackIssueOrder"
    roles: [PublishingDirector, CirculationManager, FulfillmentManager]
    code: 200
    input: []
    output: BackIssueOrder
    side_effects: []

  - method: POST
    path: "/publications/{publicationId}/back-issue-orders/{orderId}/fulfill"
    description: "Fulfill (PENDING → FULFILLED)"
    roles: [FulfillmentManager]
    code: 200
    input: []
    output: BackIssueOrder
    side_effects:
      - "Decrement newsstand inventory"
      - "increments BackIssueOrder.version by 1"

  - method: POST
    path: "/publications/{publicationId}/back-issue-orders/{orderId}/ship"
    description: "Ship (FULFILLED → SHIPPED)"
    roles: [FulfillmentManager]
    code: 200
    input: []
    output: BackIssueOrder
    side_effects:
      - "increments BackIssueOrder.version by 1"

  - method: POST
    path: "/publications/{publicationId}/back-issue-orders/{orderId}/deliver"
    description: "Deliver (SHIPPED → DELIVERED)"
    roles: [FulfillmentManager]
    code: 200
    input: []
    output: BackIssueOrder
    side_effects:
      - "is_recognized_revenue := true"
      - "increments BackIssueOrder.version by 1"

  - method: POST
    path: "/publications/{publicationId}/back-issue-orders/{orderId}/cancel"
    description: "Cancel (PENDING → CANCELLED)"
    roles: [CirculationManager]
    code: 200
    input: []
    output: BackIssueOrder
    side_effects:
      - "increments BackIssueOrder.version by 1"

  - method: POST
    path: "/publications/{publicationId}/back-issue-orders/{orderId}/refund"
    description: "Refund (DELIVERED → REFUNDED)"
    roles: [CirculationManager]
    code: 200
    input: []
    output: BackIssueOrder
    side_effects:
      - "Refund total_charged_cents"
      - "Return inventory to newsstand"
      - "increments BackIssueOrder.version by 1"

  # --- DigitalEntitlement ---
  - method: GET
    path: "/publications/{publicationId}/subscriptions/{subscriptionId}/entitlements"
    description: "List DigitalEntitlements for a Subscription"
    roles: [PublishingDirector, CirculationManager]
    code: 200
    input: ["limit?", "offset?", "access_level?"]
    output: "DigitalEntitlement[]"
    side_effects: []

  - method: GET
    path: "/publications/{publicationId}/subscriptions/{subscriptionId}/entitlements/{entitlementId}"
    description: "Get a DigitalEntitlement"
    roles: [PublishingDirector, CirculationManager]
    code: 200
    input: []
    output: DigitalEntitlement
    side_effects: []

  - method: POST
    path: "/publications/{publicationId}/subscriptions/{subscriptionId}/entitlements/{entitlementId}/revoke"
    description: "Manually revoke a DigitalEntitlement"
    roles: [CirculationManager]
    code: 200
    input: [reason]
    output: DigitalEntitlement
    side_effects:
      - "revoked_at set; revocation_reason = reason (REFUND|CHARGEBACK|MANUAL)"

  # --- CirculationAuditRecord ---
  - method: POST
    path: "/publications/{publicationId}/circulation-audits"
    description: "Create a CirculationAuditRecord in DRAFT"
    roles: [CirculationManager]
    code: 201
    input: [audit_period_start, audit_period_end]
    output: CirculationAuditRecord
    side_effects:
      - "status = DRAFT"

  - method: GET
    path: "/publications/{publicationId}/circulation-audits"
    description: "List CirculationAuditRecords for a Publication"
    roles: [PublishingDirector, CirculationManager]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CirculationAuditRecord[]"
    side_effects: []

  - method: GET
    path: "/publications/{publicationId}/circulation-audits/{auditId}"
    description: "Get a CirculationAuditRecord"
    roles: [PublishingDirector, CirculationManager]
    code: 200
    input: []
    output: CirculationAuditRecord
    side_effects: []

  - method: POST
    path: "/publications/{publicationId}/circulation-audits/{auditId}/file"
    description: "File the audit (DRAFT → FILED); computes distributions"
    roles: [CirculationManager]
    code: 200
    input: []
    output: CirculationAuditRecord
    side_effects:
      - "Compute total/paid/controlled distributions; paid_percentage_bps; qualification_result"
      - "increments CirculationAuditRecord.version by 1"

  - method: POST
    path: "/publications/{publicationId}/circulation-audits/{auditId}/pass"
    description: "Mark audit passed (FILED → AUDIT_PASSED)"
    roles: [PublishingDirector]
    code: 200
    input: []
    output: CirculationAuditRecord
    side_effects:
      - "increments CirculationAuditRecord.version by 1"

  - method: POST
    path: "/publications/{publicationId}/circulation-audits/{auditId}/fail"
    description: "Mark audit failed (FILED → AUDIT_FAILED); may cascade Publication → SUSPENDED"
    roles: [PublishingDirector]
    code: 200
    input: []
    output: CirculationAuditRecord
    side_effects:
      - "If Publication.circulation_model == PAID: Publication → SUSPENDED; Subscriptions cascade"
      - "increments CirculationAuditRecord.version by 1"

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role does not permit this operation" }

  # --- Not Found ---
  - { id: ERR_PUBLICATION_NOT_FOUND, http: 404, condition: "Publication id does not exist" }
  - { id: ERR_ISSUE_NOT_FOUND, http: 404, condition: "Issue id does not exist on this Publication" }
  - { id: ERR_SUBSCRIBER_NOT_FOUND, http: 404, condition: "Subscriber id does not exist" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "Subscription id does not exist on this Publication" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "MailingBatch id does not exist on this Issue" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "BackIssueOrder id does not exist" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "CirculationAuditRecord id does not exist" }
  - { id: ERR_RENEWAL_EVENT_NOT_FOUND, http: 404, condition: "RenewalEvent id does not exist" }
  - { id: ERR_SERIES_NOT_FOUND, http: 404, condition: "RenewalSeries id does not exist" }
  - { id: ERR_DONOR_NOT_FOUND, http: 404, condition: "donor_subscriber_id references a Subscriber that does not exist or has no active paid subscription on this Publication" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in required lifecycle state for this operation" }
  - { id: ERR_PUBLICATION_NOT_ACTIVE, http: 409, condition: "Operation requires Publication.status == ACTIVE" }
  - { id: ERR_ISSUE_NOT_AT_PRINTER, http: 409, condition: "Label generation requires Issue.status == AT_PRINTER" }
  - { id: ERR_ISSUE_NOT_FINALIZED, http: 409, condition: "Back-issue fulfill requires Issue.status == FINALIZED" }
  - { id: ERR_ISSUE_PIPELINE_ACTIVE, http: 409, condition: "Publication suspend/cease blocked: Issues in AD_CLOSED/AT_PRINTER/MAILED" }
  - { id: ERR_ACTIVE_SUBSCRIPTIONS_REMAIN, http: 409, condition: "Publication cease blocked: active/grace subscriptions remain" }
  - { id: ERR_LABELS_ALREADY_GENERATED, http: 409, condition: "Labels already generated for this batch" }
  - { id: ERR_BATCH_ALREADY_GENERATED, http: 409, condition: "Cannot reopen ads: a MailingBatch has already left DRAFT" }
  - { id: ERR_BATCH_NOT_CONFIRMED, http: 409, condition: "Issue mark-mailed blocked: not all MailingBatches are CONFIRMED" }
  - { id: ERR_AD_CLOSE_LOCKED, http: 409, condition: "ad_pages_sold is frozen after AD_CLOSED" }
  - { id: ERR_AUDIT_NOT_QUALIFIED, http: 409, condition: "Cannot mark audit passed: qualification_result != QUALIFIED" }
  - { id: ERR_AUDIT_NOT_FAILED, http: 409, condition: "Cannot mark audit failed: qualification_result != NON_QUALIFIED" }

  # --- OCC ---
  - { id: ERR_STALE_SUBSCRIPTION_VERSION, http: 412, condition: "expected_subscription_version does not match current Subscription.version" }
  - { id: ERR_STALE_ISSUE_VERSION, http: 412, condition: "expected_issue_version does not match current Issue.version" }
  - { id: ERR_STALE_BATCH_VERSION, http: 412, condition: "expected_batch_version does not match current MailingBatch.version" }

  # --- Temporal ---
  - { id: ERR_EDITORIAL_NOT_CLOSED_YET, http: 409, condition: "current_utc < editorial_close_date" }
  - { id: ERR_AD_CLOSE_NOT_REACHED, http: 409, condition: "current_utc < ad_close_date" }
  - { id: ERR_PRINTER_DATE_NOT_REACHED, http: 409, condition: "current_utc < ship_to_printer_date" }
  - { id: ERR_MAIL_DATE_NOT_REACHED, http: 409, condition: "current_utc < mail_date" }
  - { id: ERR_TENDER_TOO_EARLY, http: 409, condition: "current_utc < mail_date - 1 day" }
  - { id: ERR_RENEWAL_WINDOW_NOT_OPEN, http: 409, condition: "current_utc has not reached the next renewal effort's offset window" }

  # --- Referential ---
  - { id: ERR_INVALID_START_ISSUE, http: 422, condition: "start_issue_id not on this Publication or already MAILED/FINALIZED" }

  # --- Business: subscription/payment ---
  - { id: ERR_PAID_REQUIRES_PAYMENT, http: 422, condition: "PAID subscription requires price_paid_cents > 0 and payment_method != NONE" }
  - { id: ERR_CONTROLLED_MUST_BE_FREE, http: 422, condition: "CONTROLLED subscription requires price_paid_cents == 0" }
  - { id: ERR_UNDELIVERABLE_ADDRESS, http: 422, condition: "Subscriber address is not deliverable" }

  # --- Business: postal ---
  - { id: ERR_PAID_RATIO_BELOW_MINIMUM, http: 422, condition: "PERIODICAL class requires paid_percentage_bps >= 5000" }
  - { id: ERR_AD_CONTENT_EXCEEDS_LIMIT, http: 422, condition: "PERIODICAL class requires advertising_percentage_bps <= 7500" }
  - { id: ERR_STANDARD_NO_CONTROLLED, http: 422, condition: "STANDARD class does not permit controlled copies" }

  # --- Business: issue ---
  - { id: ERR_NO_AD_PAGES, http: 422, condition: "PAID/MIXED publications require ad_pages_sold > 0 at close-ads" }
  - { id: ERR_PRINT_RUN_TOO_SMALL, http: 422, condition: "print_run_override < qualified_subscriber_count" }

  # --- Business: inventory / fiscal ---
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 422, condition: "Not enough newsstand inventory to fulfill BackIssueOrder" }
  - { id: ERR_UNRECOGNIZED_DEFERRED_REVENUE, http: 409, condition: "Cannot cease publication: SubscriptionTerms with deferred_balance_cents > 0 remain" }

  # --- Business: audit ---
  - { id: ERR_INVALID_AUDIT_PERIOD, http: 422, condition: "audit_period_end must be > audit_period_start" }
  - { id: ERR_DRAFT_AUDIT_EXISTS, http: 422, condition: "Only one DRAFT audit per publication at a time" }
  - { id: ERR_UNFILED_ISSUES_IN_PERIOD, http: 422, condition: "Cannot file audit: Issues in period are not FINALIZED" }

  # --- Generic ---
  - { id: ERR_INVALID_PAGINATION_PARAMETERS, http: 400, condition: "limit out of [1,100] or offset < 0" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing or malformed required input field" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PublishingDirector
    description: "Executive role; owns Publication lifecycle, audit pass/fail, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /publications"
      - "POST /publications/{id}/suspend"
      - "POST /publications/{id}/resume"
      - "POST /publications/{id}/cease"
      - "POST /publications/{id}/circulation-audits/{aid}/pass"
      - "POST /publications/{id}/circulation-audits/{aid}/fail"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (all list and detail endpoints)"

  - name: ProductionManager
    description: "Owns Issue production pipeline: editorial close, ad close, ship to printer, finalize"
    identity: opaque
    exclusive_operations:
      - "POST /publications/{id}/issues"
      - "POST /publications/{id}/issues/{iid}/close-editorial"
      - "POST /publications/{id}/issues/{iid}/close-ads"
      - "POST /publications/{id}/issues/{iid}/reopen-ads"
      - "POST /publications/{id}/issues/{iid}/ship-to-printer"
      - "POST /publications/{id}/issues/{iid}/finalize"
    shared_operations:
      - "GET (all list and detail endpoints)"

  - name: CirculationManager
    description: "Owns Subscriber, Subscription, RenewalSeries, RenewalEvent, BackIssueOrder cancel/refund, CirculationAuditRecord create/file"
    identity: opaque
    exclusive_operations:
      - "POST /subscribers"
      - "PATCH /subscribers/{id}"
      - "POST /publications/{pid}/subscribers/{sid}/subscriptions"
      - "POST /publications/{pid}/subscriptions/{sid}/activate"
      - "POST /publications/{pid}/subscriptions/{sid}/suspend"
      - "POST /publications/{pid}/subscriptions/{sid}/resume"
      - "POST /publications/{pid}/subscriptions/{sid}/renew"
      - "POST /publications/{pid}/subscriptions/{sid}/cancel"
      - "POST /publications/{pid}/renewal-series"
      - "POST /publications/{pid}/subscriptions/{sid}/renewal-events/fire-next"
      - "POST /publications/{pid}/subscriptions/{sid}/renewal-events/{eid}/decline"
      - "POST /publications/{pid}/back-issue-orders/{oid}/cancel"
      - "POST /publications/{pid}/back-issue-orders/{oid}/refund"
      - "POST /publications/{pid}/subscriptions/{sid}/entitlements/{eid}/revoke"
      - "POST /publications/{pid}/circulation-audits"
      - "POST /publications/{pid}/circulation-audits/{aid}/file"
    shared_operations:
      - "GET (all list and detail endpoints)"
      - "POST /publications/{pid}/subscribers/{sid}/back-issue-orders (shared with FulfillmentManager)"

  - name: FulfillmentManager
    description: "Owns MailingBatch creation, label generation, tender, Issue mark-mailed, BackIssueOrder fulfill/ship/deliver"
    identity: opaque
    exclusive_operations:
      - "POST /publications/{pid}/issues/{iid}/mailing-batches"
      - "POST /publications/{pid}/issues/{iid}/mailing-batches/{bid}/generate-labels"
      - "POST /publications/{pid}/issues/{iid}/mailing-batches/{bid}/tender"
      - "POST /publications/{pid}/issues/{iid}/mark-mailed"
      - "POST /publications/{pid}/back-issue-orders/{oid}/fulfill"
      - "POST /publications/{pid}/back-issue-orders/{oid}/ship"
      - "POST /publications/{pid}/back-issue-orders/{oid}/deliver"
    shared_operations:
      - "GET (all list and detail endpoints)"
      - "POST /publications/{pid}/subscribers/{sid}/back-issue-orders (shared with CirculationManager)"

  - name: PostalComplianceOfficer
    description: "Owns postal verification and confirmation; segregated from FulfillmentManager (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /publications/{pid}/issues/{iid}/mailing-batches/{bid}/verify-postal"
      - "POST /publications/{pid}/issues/{iid}/mailing-batches/{bid}/confirm"
    shared_operations:
      - "GET (all list and detail endpoints)"
