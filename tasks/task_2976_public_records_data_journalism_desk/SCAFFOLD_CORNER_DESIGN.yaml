      - name: self_referential_supersede_withdraws_the_target_and_refunds_its_commitment
        claim_type: graph
        grounds:
          - entities.RecordsRequest.fields.supersedes_request_id
          - state_machines.RecordsRequest.AWAITING_AGENCY_RESPONSE_to_WITHDRAWN
          - validations[priority=105]
          - errors[ERR_SUPERSEDE_TARGET_NOT_ACTIVE]
          - calculations.desk_fee_budget_ledger
        distinguishing_aspect: |
          The self-referential edge is not a comment field: creating the superseding request must itself
          withdraw the target, release the target's fee commitment to available and decrement
          open_request_count, so the desk ends with one open request rather than two. Re-pointing a
          third request at the now-WITHDRAWN target must then fail the priority-105 activity check -
          which is why the OCC token must be re-read after every create.
        test_recipe:
          setup:
            - "One Desk (total 500000) and one Agency (search_fee_cents_per_hour 3500, page_fee_cents 25)."
