  # ----------------------------------------------------- cross_cutting_layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_zone_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[approve-stale-zone]", "errors[ERR_ZONE_VERSION_CONFLICT]"]
        distinguishing_aspect: "A second approve carrying an expected_zone_version captured before the first approve (now stale because the first approve bumped Zone.version) returns ERR_ZONE_VERSION_CONFLICT (412)."
        test_recipe:
          setup: ["Capacity-2 zone; two reviewed applications from different households; zone_v captured at creation (=1)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "OCC1", zone_code: "RPZ-OC1", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id, zone_v: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "17 A", resident_name: "O1", contact_email: "o1@x.com" }, as: Anonymous, captures: { h1: $.data.id } }
            - { call: "POST /households/${h1}/vehicles", payload: { license_plate: "OC1-A", make: "A", model: "B" }, as: Resident, as_user_id: "${h1}", captures: { v1: $.data.id } }
            - { call: "POST /households/${h1}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${h1}", captures: { p1: $.data.id } }
            - { call: "POST /proof-submissions/${p1}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${h1}", vehicle_id: "${v1}" }, as: Resident, as_user_id: "${h1}", captures: { a1: $.data.id } }
            - { call: "POST /permit-applications/${a1}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "18 A", resident_name: "O2", contact_email: "o2@x.com" }, as: Anonymous, captures: { h2: $.data.id } }
            - { call: "POST /households/${h2}/vehicles", payload: { license_plate: "OC1-B", make: "A", model: "B" }, as: Resident, as_user_id: "${h2}", captures: { v2: $.data.id } }
            - { call: "POST /households/${h2}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${h2}", captures: { p2: $.data.id } }
            - { call: "POST /proof-submissions/${p2}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${h2}", vehicle_id: "${v2}" }, as: Resident, as_user_id: "${h2}", captures: { a2: $.data.id } }
            - { call: "POST /permit-applications/${a2}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${a1}/approve", payload: { expected_zone_version: "${zone_v}" }, as: PermitSupervisor, captures: { first_permit: $.data.id } }
          trigger:
            - { call: "POST /permit-applications/${a2}/approve", payload: { expected_zone_version: "${zone_v}" }, as: PermitSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "Permit.${first_permit}.status == ACTIVE"
            - "response.data.error_id == ERR_ZONE_VERSION_CONFLICT"
            - "response.status == 412"

      - name: occ_stale_permit_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[renew-approve-stale-permit]", "errors[ERR_PERMIT_VERSION_CONFLICT]"]
        distinguishing_aspect: "A renew-approve carrying expected_permit_version captured at issuance (=1) is stale after the renew request bumped Permit.version to 2, returning ERR_PERMIT_VERSION_CONFLICT (412)."
        test_recipe:
          setup: ["One ACTIVE permit (version 1 captured); clock moved into renewal window; renew requested (version now 2)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "OCC2", zone_code: "RPZ-OC2", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id, zv: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "19 A", resident_name: "Op", contact_email: "op@x.com" }, as: Anonymous, captures: { hid: $.data.id } }
            - { call: "POST /households/${hid}/vehicles", payload: { license_plate: "OC2-A", make: "A", model: "B" }, as: Resident, as_user_id: "${hid}", captures: { vid: $.data.id } }
            - { call: "POST /households/${hid}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${hid}", captures: { pf: $.data.id } }
            - { call: "POST /proof-submissions/${pf}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${hid}", vehicle_id: "${vid}" }, as: Resident, as_user_id: "${hid}", captures: { aid: $.data.id } }
            - { call: "POST /permit-applications/${aid}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${aid}/approve", payload: { expected_zone_version: "${zv}" }, as: PermitSupervisor, captures: { pid: $.data.id, pv1: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-15T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /permits/${pid}/renew", payload: {}, as: Resident, as_user_id: "${hid}" }
          trigger:
            - { call: "POST /permits/${pid}/renew-approve", payload: { expected_permit_version: "${pv1}" }, as: PermitSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "Permit.${pid}.status == RENEWAL_PENDING"
            - "response.data.error_id == ERR_PERMIT_VERSION_CONFLICT"
            - "response.status == 412"

