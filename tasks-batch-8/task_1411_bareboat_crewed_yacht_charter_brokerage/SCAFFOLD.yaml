# =============================================================================
# PRD Benchmark Seed Tables — Bareboat & Crewed Yacht Charter Brokerage
# =============================================================================

scenario: |
  Bareboat & Crewed Yacht Charter Brokerage (yacht charter brokerage): yacht
  listing & availability calendar across operators, client qualification &
  sailing resume, charter agreement, APA (advance provisioning) & escrow,
  crew gratuity & provisioning preferences, itinerary planning & port permit,
  damage deposit & insurance verification, commission split between central
  agent and retail broker, cancellation cascade & rebooking

domain_name: yacht-charter-brokerage
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing        # charter calendar: half-open intervals + turnaround buffers
  secondary_archetype: ledger_reconciliation   # escrow/APA: provisional vs final reconciliation
  complexity_layers:
    - optimistic_concurrency      # OCC on CharterRequest.version and Yacht.version
    - cascading_side_effects      # cancellation & settlement cascades, depth >= 4
    - dual_variant_calculation    # quote pricing variants; APA provisional vs final
    - rate_threshold_triggers     # cancellation penalty tiers, commission tiers, APA pct tiers
  entity_topology: flat                        # peer entities joined by foreign keys; no nested ownership URLs
  state_machine_shape: parallel                # CharterAgreement carries status x funds_status; other entities cyclic
  relationship_patterns:
    - one_to_many
    - self_referential           # CharterRequest.rebooked_from_request_id
    - cross_aggregate            # Agreement -> Operator/Broker/Client/Yacht/Escrow cross-links
  role_model: segregation_of_duties            # same Broker may not be central agent AND retail broker on one deal
  consistency_model: immediate                 # every mutation visible in its own response

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Operator (fleet company) display name" }
      - { name: home_port, type: string, source: input, description: "Operator home port" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED; SUSPENDED blocks new listings, blocks, submits and offers" }

  - name: Broker
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Broker display name" }
      - { name: broker_type, type: enum, source: input, description: "CENTRAL_AGENT | RETAIL_BROKER | BOTH; CentralAgent role requires CENTRAL_AGENT or BOTH, RetailBroker role requires RETAIL_BROKER or BOTH — a BOTH broker may never be on both sides of one deal (ERR_BROKER_CONFLICT_OF_INTEREST)" }
      - { name: license_no, type: string, source: input, description: "Brokerage license number" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Charter client full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: qualification_status, type: enum, source: system, default: UNVERIFIED, description: "UNVERIFIED | PENDING_REVIEW | QUALIFIED | REJECTED" }
      - { name: resume_class, type: enum, source: input, description: "Highest self-declared resume class: NONE | COASTAL | OFFSHORE | OCEAN; set on resume submit" }
      - { name: skippered_hours, type: integer, source: input, description: "Self-declared skippered hours; set on resume submit" }
      - { name: resume_submitted_at, type: datetime, source: system, description: "Timestamp of latest resume submission; null until first submit" }

  - name: Yacht
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; owning operator, set from authenticated Operator on create" }
      - { name: listing_central_agent_id, type: string, source: input, description: "FK -> Broker.id; central agent (listing broker) for this yacht; must reference a Broker with broker_type=CENTRAL_AGENT" }
      - { name: name, type: string, source: input, description: "Yacht name" }
      - { name: charter_type, type: enum, source: input, description: "BAREBOAT | CREWED" }
      - { name: home_port, type: string, source: input, description: "Yacht home port" }
      - { name: capacity_berths, type: integer, source: input, description: "Maximum guests allowed on a charter request (guests_count <= capacity_berths)" }
      - { name: weekly_base_rate_cents, type: integer, source: input, description: "Weekly base charter rate in cents; input to charter_fee_quote" }
      - { name: min_charter_days, type: integer, source: input, description: "Minimum charter length in days; requests shorter than this are rejected" }
      - { name: required_resume_class, type: enum, source: input, description: "NONE | COASTAL | OFFSHORE | OCEAN; minimum client resume class for BAREBOAT charter (class ordering NONE < COASTAL < OFFSHORE < OCEAN)" }
      - { name: security_deposit_cents, type: integer, source: input, description: "Refundable damage deposit, snapshotted onto the agreement" }
      - { name: pricing_mode, type: enum, source: input, description: "PRO_RATA | WEEKLY_PLUS_DAILY; selects charter_fee_quote variant" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | LISTED | DELISTED" }

  - name: AvailabilityBlock
    parent: null
    common_fields: true
    fields:
      - { name: yacht_id, type: string, source: system, description: "FK -> Yacht.id; yacht whose calendar is blocked" }
      - { name: charter_agreement_id, type: string, source: system, description: "FK -> CharterAgreement.id; set (and only set) for block_type=CHARTER blocks created by the accept cascade; null for manual blocks" }
      - { name: block_type, type: enum, source: system, description: "MAINTENANCE | OPERATOR_HOLD (manual, client-supplied) | CHARTER (system-created on request acceptance; may not be created via the manual endpoint)" }
      - { name: start_date, type: string, source: input, description: "Block start date YYYY-MM-DD; half-open interval [start_date, end_date)" }
      - { name: end_date, type: string, source: input, description: "Block end date YYYY-MM-DD, exclusive; must be > start_date" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RELEASED" }

  - name: CharterRequest
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; chartering client" }
      - { name: yacht_id, type: string, source: input, description: "FK -> Yacht.id; requested yacht" }
      - { name: retail_broker_id, type: string, source: system, description: "FK -> Broker.id; retail broker on the deal. When created as RetailBroker, set to the caller; when created as Client, set to optional input retail_broker_id or null" }
      - { name: rebooked_from_request_id, type: string, source: system, description: "FK -> CharterRequest.id; self-reference set when created via the rebook endpoint; null otherwise" }
      - { name: start_date, type: string, source: input, description: "Charter start date YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Charter end date YYYY-MM-DD, exclusive; charter_days = end_date - start_date in whole days" }
      - { name: guests_count, type: integer, source: input, description: "Number of guests; must satisfy 1 <= guests_count <= Yacht.capacity_berths" }
      - { name: quoted_charter_fee_cents, type: integer, source: computed, description: "Current offer's charter fee; null until first offer; computed by charter_fee_quote or overridden on offer" }
      - { name: apa_pct, type: number, source: computed, description: "APA fraction locked by the current offer (override or tiered default); null until first offer" }
      - { name: gratuity_pledged_cents, type: integer, source: computed, description: "Crew gratuity pledged in the current offer; null until first offer" }
      - { name: retail_pct_bps, type: integer, source: computed, description: "Retail broker share of commission in basis points, locked by the current offer; null until first offer" }
      - { name: round_count, type: integer, source: system, default: 0, description: "Number of client counters issued; incremented on each OFFERED -> COUNTERED; capped at MAX_NEGOTIATION_ROUNDS=4" }
      - { name: offer_expires_at, type: datetime, source: computed, description: "offered_at + OFFER_VALID_DAYS(7 days); null unless status == OFFERED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | OFFERED | COUNTERED | ACCEPTED | DECLINED | EXPIRED | CANCELLED" }

  - name: CharterAgreement
    parent: null
    common_fields: true
    fields:
      - { name: charter_request_id, type: string, source: system, description: "FK -> CharterRequest.id; source request (1:1), set by accept cascade" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; snapshotted from the request" }
      - { name: yacht_id, type: string, source: system, description: "FK -> Yacht.id; snapshotted from the request" }
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; snapshotted from the yacht" }
      - { name: retail_broker_id, type: string, source: system, description: "FK -> Broker.id; snapshotted from the request (may be null)" }
      - { name: central_agent_id, type: string, source: system, description: "FK -> Broker.id; snapshotted from Yacht.listing_central_agent_id" }
      - { name: start_date, type: string, source: system, description: "Charter start date YYYY-MM-DD, snapshotted from request" }
      - { name: end_date, type: string, source: system, description: "Charter end date YYYY-MM-DD exclusive, snapshotted from request" }
      - { name: charter_fee_cents, type: integer, source: system, description: "Charter fee locked at acceptance from CharterRequest.quoted_charter_fee_cents" }
      - { name: apa_pct, type: number, source: system, description: "APA fraction locked at acceptance" }
      - { name: apa_amount_cents, type: integer, source: computed, description: "= round_half_up(charter_fee_cents * apa_pct), computed at acceptance" }
      - { name: security_deposit_cents, type: integer, source: system, description: "Damage deposit snapshotted from the yacht at acceptance" }
      - { name: gratuity_pledged_cents, type: integer, source: system, description: "Crew gratuity locked at acceptance (0 for bareboat unless offered)" }
      - { name: retail_pct_bps, type: integer, source: system, description: "Retail broker commission share (basis points) locked at acceptance" }
      - { name: pricing_mode, type: enum, source: system, description: "PRO_RATA | WEEKLY_PLUS_DAILY; snapshotted from the yacht for audit" }
      - { name: signing_due_cents, type: integer, source: computed, description: "= round_half_up(charter_fee_cents * 0.50) + security_deposit_cents; see escrow_funding_schedule" }
      - { name: final_due_cents, type: integer, source: computed, description: "= (charter_fee_cents - round_half_up(charter_fee_cents * 0.50)) + apa_amount_cents + gratuity_pledged_cents" }
      - { name: client_signed_at, type: datetime, source: system, description: "When the client countersigned; null until signed" }
      - { name: central_agent_signed_at, type: datetime, source: system, description: "When the central agent countersigned; null until signed" }
      - { name: days_before_start, type: integer, source: system, description: "Whole days between cancellation date and start_date; set on cancel; null otherwise" }
      - { name: cancellation_penalty_cents, type: integer, source: system, description: "Penalty computed by cancellation_penalty; set on cancel; null otherwise" }
      - { name: status, type: enum, source: system, default: PENDING_SIGNATURES, description: "PENDING_SIGNATURES | SIGNED | IN_PREP | UNDERWAY | COMPLETED | CANCELLED | VOIDED (lifecycle axis)" }
      - { name: funds_status, type: enum, source: system, default: UNFUNDED, description: "UNFUNDED | DEPOSIT_HELD | FULLY_FUNDED | SETTLING | SETTLED | REFUNDING | REFUNDED (parallel funds axis, evolves independently of status except where transitions gate on it)" }

  - name: EscrowAccount
    parent: null
    common_fields: true
    fields:
      - { name: charter_agreement_id, type: string, source: system, description: "FK -> CharterAgreement.id; owning agreement (1:1)" }
      - { name: held_charter_fee_cents, type: integer, source: computed, default: 0, description: "Charter-fee bucket currently held" }
      - { name: held_apa_cents, type: integer, source: computed, default: 0, description: "APA bucket currently held" }
      - { name: held_deposit_cents, type: integer, source: computed, default: 0, description: "Damage deposit bucket currently held" }
      - { name: held_gratuity_cents, type: integer, source: computed, default: 0, description: "Gratuity bucket currently held" }
      - { name: total_funded_cents, type: integer, source: computed, default: 0, description: "Sum of all CLIENT_FUND movements" }
      - { name: total_released_cents, type: integer, source: computed, default: 0, description: "Sum of all outward movements (RELEASE_*/REFUND_TO_CLIENT)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | SETTLING | CLOSED; driven only by settlement/cancellation cascades" }

  - name: EscrowMovement
    parent: null
    common_fields: false
    fields:
      - { name: escrow_account_id, type: string, source: system, description: "FK -> EscrowAccount.id; owning escrow account" }
      - { name: movement_type, type: enum, source: system, description: "CLIENT_FUND | RELEASE_TO_OPERATOR | RELEASE_TO_CENTRAL_AGENT | RELEASE_TO_RETAIL_BROKER | REFUND_TO_CLIENT" }
      - { name: bucket, type: enum, source: system, description: "CHARTER_FEE | APA | DEPOSIT | GRATUITY; which held bucket the movement debits/credits" }
      - { name: amount_cents, type: integer, source: system, description: "Movement amount, always positive" }
      - { name: memo, type: string, source: system, description: "Human-readable memo (e.g., tranche name, settlement line)" }

  - name: ExpenseEntry
    parent: null
    common_fields: true
    fields:
      - { name: charter_agreement_id, type: string, source: system, description: "FK -> CharterAgreement.id; owning agreement" }
      - { name: bucket, type: enum, source: input, description: "APA (provisioning spend against held APA) | DAMAGE_CLAIM (operator damage claim against held deposit)" }
      - { name: description, type: string, source: input, description: "Expense description" }
      - { name: amount_cents, type: integer, source: input, description: "Expense amount, positive" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | DISPUTED | REJECTED" }

  - name: ItineraryLeg
    parent: null
    common_fields: true
    fields:
      - { name: charter_agreement_id, type: string, source: system, description: "FK -> CharterAgreement.id; owning agreement" }
      - { name: seq_no, type: integer, source: system, description: "Leg sequence number; server-assigned as (count of existing legs for the agreement) + 1" }
      - { name: port_name, type: string, source: input, description: "Port of call" }
      - { name: arrival_date, type: string, source: input, description: "Arrival date YYYY-MM-DD; must satisfy agreement.start_date <= arrival_date" }
      - { name: departure_date, type: string, source: input, description: "Departure date YYYY-MM-DD; must satisfy arrival_date <= departure_date <= agreement.end_date" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | PERMITTED; auto-derived: PERMITTED when the leg has >= 1 GRANTED permit and zero REQUESTED permits (DENIED and EXPIRED permits do not block)" }

  - name: PortPermit
    parent: null
    common_fields: true
    fields:
      - { name: itinerary_leg_id, type: string, source: system, description: "FK -> ItineraryLeg.id; leg this permit covers" }
      - { name: port_authority_ref, type: string, source: input, description: "Port authority application reference" }
      - { name: valid_from, type: string, source: input, description: "Permit validity start YYYY-MM-DD (closed bound)" }
      - { name: valid_until, type: string, source: input, description: "Permit validity end YYYY-MM-DD (closed bound); must satisfy valid_from <= valid_until" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | GRANTED | DENIED | EXPIRED; GRANTED -> EXPIRED auto-transitions when the logical clock passes valid_until" }

  - name: InsuranceCertificate
    parent: null
    common_fields: true
    fields:
      - { name: charter_agreement_id, type: string, source: system, description: "FK -> CharterAgreement.id; owning agreement" }
      - { name: insurer_name, type: string, source: input, description: "Insurer name" }
      - { name: policy_no, type: string, source: input, description: "Policy number" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Liability coverage; must be >= agreement.charter_fee_cents" }
      - { name: valid_from, type: string, source: input, description: "Coverage start YYYY-MM-DD (closed bound); must be <= agreement.start_date" }
      - { name: valid_until, type: string, source: input, description: "Coverage end YYYY-MM-DD (closed bound); must be >= agreement.end_date" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | VERIFIED | REJECTED" }

  - name: CommissionStatement
    parent: null
    common_fields: false
    fields:
      - { name: charter_agreement_id, type: string, source: system, description: "FK -> CharterAgreement.id; settled agreement" }
      - { name: basis, type: enum, source: system, description: "CHARTER_FEE (settlement after completion) | CANCELLATION_PENALTY (commission on retained penalty)" }
      - { name: basis_amount_cents, type: integer, source: system, description: "Amount the commission was computed on (charter fee or retained penalty)" }
      - { name: commission_total_cents, type: integer, source: system, description: "Total commission per commission_settlement" }
      - { name: retail_share_cents, type: integer, source: system, description: "= round_half_up(commission_total_cents * retail_pct_bps / 10000)" }
      - { name: central_share_cents, type: integer, source: system, description: "= commission_total_cents - retail_share_cents (residual reconciled to the central agent)" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Operator
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /operators/{id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /operators/{id}/reactivate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: Yacht
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: "POST /yachts/{id}/list"
        actor: Operator
        preconditions:
          - "caller owns yacht (yacht.operator_id == X-User-ID) else ERR_FORBIDDEN"
          - "operator.status == ACTIVE else ERR_OPERATOR_SUSPENDED"
        side_effects: ["increments Yacht.version by 1"]
      - from: LISTED
        to: DELISTED
        trigger: "POST /yachts/{id}/delist"
        actor: Operator
        preconditions:
          - "caller owns yacht else ERR_FORBIDDEN"
          - "no CharterRequest referencing this yacht in status IN {SUBMITTED, OFFERED, COUNTERED} else ERR_INVALID_STATE"
          - "no CharterAgreement referencing this yacht in status IN {PENDING_SIGNATURES, SIGNED, IN_PREP, UNDERWAY} else ERR_INVALID_STATE"
        side_effects: ["increments Yacht.version by 1"]
      - from: DELISTED
        to: LISTED
        trigger: "POST /yachts/{id}/list"
        actor: Operator
        preconditions:
          - "caller owns yacht else ERR_FORBIDDEN"
          - "operator.status == ACTIVE else ERR_OPERATOR_SUSPENDED"
        side_effects: ["increments Yacht.version by 1"]

  - entity: Client
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: PENDING_REVIEW
        trigger: "POST /clients/{id}/resume/submit"
        actor: Client
        preconditions:
          - "caller is this client (X-User-ID == client.id) else ERR_FORBIDDEN"
        side_effects: ["sets resume_class, skippered_hours, resume_submitted_at"]
      - from: REJECTED
        to: PENDING_REVIEW
        trigger: "POST /clients/{id}/resume/submit"
        actor: Client
        preconditions:
          - "caller is this client else ERR_FORBIDDEN"
        side_effects: ["sets resume_class, skippered_hours, resume_submitted_at (revision loop: a rejected client may resubmit)"]
      - from: PENDING_REVIEW
        to: QUALIFIED
        trigger: "POST /clients/{id}/resume/review with outcome=QUALIFIED"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /clients/{id}/resume/review with outcome=REJECTED"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: AvailabilityBlock
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /availability-blocks/{id}/release"
        actor: Operator
        preconditions:
          - "caller owns block's yacht else ERR_FORBIDDEN"
          - "block.block_type IN {MAINTENANCE, OPERATOR_HOLD}; CHARTER blocks are released only by the cancellation cascade — manual release returns ERR_INVALID_STATE"
        side_effects: ["increments Yacht.version by 1 (calendar changed)"]
      - from: ACTIVE
        to: RELEASED
        trigger: "system (cancellation cascade: fires when the linked EscrowAccount reaches CLOSED)"
        actor: system
        preconditions:
          - "block.block_type == CHARTER and block.charter_agreement_id references the cancelled agreement"
        side_effects:
          - "increments Yacht.version by 1"
          - "cascade hop: this release transitions the source CharterRequest ACCEPTED -> CANCELLED"

  - entity: CharterRequest
    initial_state: DRAFT
    terminal_states: [DECLINED, EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /charter-requests/{id}/submit"
        actor: Client | RetailBroker
        preconditions:
          - "ownership: caller is request.client_id (as Client) or request.retail_broker_id (as RetailBroker) else ERR_FORBIDDEN"
          - "yacht.status == LISTED else ERR_YACHT_NOT_LISTED"
          - "operator.status == ACTIVE else ERR_OPERATOR_SUSPENDED"
          - "if yacht.charter_type == BAREBOAT: client.qualification_status == QUALIFIED else ERR_CLIENT_NOT_QUALIFIED; and client.resume_class >= yacht.required_resume_class (ordering NONE < COASTAL < OFFSHORE < OCEAN) else ERR_RESUME_CLASS_INSUFFICIENT"
          - "no ACTIVE AvailabilityBlock on the yacht conflicts with [start_date, end_date) under the half-open + TURNAROUND_BUFFER_DAYS=1 rule else ERR_AVAILABILITY_CONFLICT / ERR_TURNAROUND_BUFFER_VIOLATION"
          - "no other CharterRequest with same client_id + yacht_id, overlapping [start_date, end_date) half-open, and status IN {DRAFT, SUBMITTED, OFFERED, COUNTERED} else ERR_DUPLICATE_ACTIVE_REQUEST"
        side_effects: []
      - from: SUBMITTED
        to: OFFERED
        trigger: "POST /charter-requests/{id}/offer"
        actor: CentralAgent
        preconditions:
          - "caller is the yacht's listing central agent (X-User-ID == yacht.listing_central_agent_id) else ERR_FORBIDDEN"
          - "operator.status == ACTIVE else ERR_OPERATOR_SUSPENDED"
        side_effects:
          - "computes quoted_charter_fee_cents via charter_fee_quote unless a positive override is supplied"
          - "locks apa_pct (override or tiered default per apa_pct_schedule), gratuity_pledged_cents, retail_pct_bps"
          - "sets offer_expires_at = now + OFFER_VALID_DAYS(7 days)"
          - "increments CharterRequest.version by 1"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /charter-requests/{id}/offer"
        actor: CentralAgent
        preconditions:
          - "caller is the yacht's listing central agent else ERR_FORBIDDEN"
        side_effects:
          - "recomputes/overrides terms exactly as SUBMITTED -> OFFERED"
          - "increments CharterRequest.version by 1"
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /charter-requests/{id}/counter"
        actor: Client | RetailBroker
        preconditions:
          - "ownership as submit else ERR_FORBIDDEN"
          - "OCC: expected_charter_request_version must equal current version else ERR_STALE_VERSION (412)"
          - "if now > offer_expires_at: transition to EXPIRED and reject with ERR_OFFER_EXPIRED"
          - "round_count < MAX_NEGOTIATION_ROUNDS(4) else ERR_NEGOTIATION_ROUND_LIMIT"
        side_effects:
          - "increments round_count by 1"
          - "clears offer_expires_at to null"
          - "increments CharterRequest.version by 1"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /charter-requests/{id}/accept"
        actor: Client | RetailBroker
        preconditions:
          - "ownership as submit else ERR_FORBIDDEN"
          - "OCC: expected_charter_request_version must equal current version else ERR_STALE_VERSION (412)"
          - "if now > offer_expires_at: transition to EXPIRED and reject with ERR_OFFER_EXPIRED"
          - "no ACTIVE AvailabilityBlock on the yacht conflicts with [start_date, end_date) under the buffer rule else ERR_AVAILABILITY_CONFLICT / ERR_TURNAROUND_BUFFER_VIOLATION"
        side_effects:
          - "cascade hop 1: creates CharterAgreement (status=PENDING_SIGNATURES, funds_status=UNFUNDED) snapshotting request terms and yacht/operator/central-agent references; computes apa_amount_cents, signing_due_cents, final_due_cents"
          - "cascade hop 2 (from hop 1): creates EscrowAccount (OPEN, all buckets 0) linked to the new agreement"
          - "cascade hop 3 (from hop 1): creates AvailabilityBlock block_type=CHARTER, status=ACTIVE, covering [start_date, end_date), linked to the new agreement; increments Yacht.version by 1"
          - "increments CharterRequest.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /charter-requests/{id}/decline"
        actor: Client | RetailBroker
        preconditions: ["ownership as submit else ERR_FORBIDDEN"]
        side_effects: ["increments CharterRequest.version by 1"]
      - from: OFFERED
        to: EXPIRED
        trigger: "system (lazy evaluation inside /counter and /accept when now > offer_expires_at; the transition fires and the request is rejected with ERR_OFFER_EXPIRED)"
        actor: system
        preconditions: ["now > offer_expires_at"]
        side_effects: ["increments CharterRequest.version by 1"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "system (cancellation cascade terminal hop: fires when the CHARTER AvailabilityBlock created for this request's agreement is released)"
        actor: system
        preconditions: ["the linked CharterAgreement transitioned to CANCELLED and its escrow closure released the CHARTER block"]
        side_effects: ["increments CharterRequest.version by 1"]

  - entity: CharterAgreement
    initial_state: PENDING_SIGNATURES
    terminal_states: [COMPLETED, CANCELLED, VOIDED]
    note: "Primary lifecycle axis (field: status). The parallel funds axis (field: funds_status) is the second CharterAgreement entry below."
    transitions:
      - from: PENDING_SIGNATURES
        to: SIGNED
        trigger: "POST /charter-agreements/{id}/sign (second of the two required signatures)"
        actor: Client | CentralAgent
        preconditions:
          - "a VERIFIED InsuranceCertificate exists for this agreement else ERR_INSURANCE_NOT_VERIFIED"
          - "each party signs exactly once: Client caller must be agreement.client_id, CentralAgent caller must be agreement.central_agent_id; the same party signing twice returns ERR_INVALID_STATE"
          - "the transition fires when the second distinct signature is recorded (client_signed_at and central_agent_signed_at both set); the first signature leaves status PENDING_SIGNATURES"
        side_effects: ["sets client_signed_at / central_agent_signed_at", "increments CharterAgreement.version by 1"]
      - from: PENDING_SIGNATURES
        to: VOIDED
        trigger: "POST /charter-agreements/{id}/void"
        actor: CentralAgent
        preconditions:
          - "caller is agreement.central_agent_id else ERR_FORBIDDEN"
          - "no signature has been recorded yet (client_signed_at IS NULL AND central_agent_signed_at IS NULL) else ERR_INVALID_STATE"
        side_effects:
          - "releases the CHARTER AvailabilityBlock (ACTIVE -> RELEASED) and increments Yacht.version by 1"
          - "source CharterRequest ACCEPTED -> CANCELLED (same terminal hop as the cancellation cascade)"
      - from: SIGNED
        to: IN_PREP
        trigger: "POST /charter-agreements/{id}/start-prep"
        actor: Operator
        preconditions:
          - "caller owns the yacht else ERR_FORBIDDEN"
          - "every ItineraryLeg of the agreement has status == PERMITTED else ERR_PERMIT_NOT_GRANTED"
          - "funds_status == FULLY_FUNDED else ERR_ESCROW_INSUFFICIENT"
        side_effects: ["increments CharterAgreement.version by 1"]
      - from: IN_PREP
        to: UNDERWAY
        trigger: "POST /charter-agreements/{id}/embark"
        actor: Operator
        preconditions:
          - "caller owns the yacht else ERR_FORBIDDEN"
          - "logical clock date >= start_date else ERR_INVALID_REQUEST"
        side_effects: ["increments CharterAgreement.version by 1"]
      - from: UNDERWAY
        to: COMPLETED
        trigger: "POST /charter-agreements/{id}/complete (settlement cascade trigger)"
        actor: Operator | CentralAgent
        preconditions:
          - "caller owns the yacht or is the central agent else ERR_FORBIDDEN"
          - "logical clock date >= end_date else ERR_INVALID_REQUEST"
        side_effects:
          - "cascade hop 1: funds_status FULLY_FUNDED -> SETTLING; apa_position FINAL reconciliation runs (all ExpenseEntry in PENDING or DISPUTED auto-transition to REJECTED; apa_actual = sum of APPROVED APA expenses)"
          - "cascade hop 2 (from hop 1): escrow settlement posts movements — RELEASE_TO_OPERATOR(APA, apa_actual); REFUND_TO_CLIENT(APA, held_apa - apa_actual); RELEASE_TO_OPERATOR(GRATUITY, held_gratuity); RELEASE_TO_OPERATOR(DEPOSIT, approved damage claims); REFUND_TO_CLIENT(DEPOSIT, held_deposit - approved damage claims); RELEASE_TO_OPERATOR(CHARTER_FEE, charter_fee - commission_total); RELEASE_TO_RETAIL_BROKER(CHARTER_FEE, retail_share); RELEASE_TO_CENTRAL_AGENT(CHARTER_FEE, central_share) — amounts per commission_settlement; escrow status OPEN -> SETTLING"
          - "cascade hop 3 (from hop 2): when all settlement movements are posted, creates CommissionStatement(basis=CHARTER_FEE) and escrow SETTLING -> CLOSED; all held buckets become 0"
          - "cascade hop 4 (from hop 3): funds_status SETTLING -> SETTLED"
          - "increments CharterAgreement.version by 1"
      - from: PENDING_SIGNATURES
        to: CANCELLED
        trigger: "POST /charter-agreements/{id}/cancel"
        actor: Client | RetailBroker | CentralAgent
        preconditions: ["caller is a deal party (client_id, retail_broker_id, or central_agent_id) else ERR_FORBIDDEN"]
        side_effects: ["same cancellation cascade as SIGNED/IN_PREP cancellation, with penalty tier evaluated (funded total is 0 from PENDING_SIGNATURES, so retained penalty is 0 and all movements are absent)"]
      - from: SIGNED
        to: CANCELLED
        trigger: "POST /charter-agreements/{id}/cancel (cancellation cascade trigger)"
        actor: Client | RetailBroker | CentralAgent
        preconditions: ["caller is a deal party else ERR_FORBIDDEN"]
        side_effects:
          - "cascade hop 1: computes days_before_start and cancellation_penalty_cents via cancellation_penalty; funds_status (any of UNFUNDED/DEPOSIT_HELD/FULLY_FUNDED) -> REFUNDING"
          - "cascade hop 2 (from hop 1): escrow settlement computes retained = min(penalty, held_charter_fee) and posts movements — REFUND_TO_CLIENT per bucket for (held bucket - retained share), RELEASE_TO_OPERATOR(CHARTER_FEE, retained - penalty_commission), RELEASE_TO_RETAIL_BROKER(CHARTER_FEE, retail share of penalty commission), RELEASE_TO_CENTRAL_AGENT(CHARTER_FEE, central share of penalty commission) per commission_settlement CANCELLATION_PENALTY variant; escrow OPEN -> SETTLING"
          - "cascade hop 3 (from hop 2): when all refund/release movements are posted, creates CommissionStatement(basis=CANCELLATION_PENALTY) iff retained > 0 and escrow SETTLING -> CLOSED; all held buckets become 0"
          - "cascade hop 4 (from hop 3): funds_status REFUNDING -> REFUNDED"
          - "cascade hop 5 (from hop 3): the escrow closure releases the linked CHARTER AvailabilityBlock (ACTIVE -> RELEASED), which increments Yacht.version by 1"
          - "cascade hop 6 (from hop 5): the block release transitions the source CharterRequest ACCEPTED -> CANCELLED"
          - "increments CharterAgreement.version by 1"
      - from: IN_PREP
        to: CANCELLED
        trigger: "POST /charter-agreements/{id}/cancel"
        actor: Client | RetailBroker | CentralAgent
        preconditions: ["caller is a deal party else ERR_FORBIDDEN"]
        side_effects: ["identical cancellation cascade as SIGNED -> CANCELLED; APPROVED DAMAGE_CLAIM expenses are first deducted from held_deposit before the deposit refund movement is computed"]

  - entity: CharterAgreement
    state_field: funds_status
    initial_state: UNFUNDED
    terminal_states: [SETTLED, REFUNDED]
    transitions:
      - from: UNFUNDED
        to: DEPOSIT_HELD
        trigger: "POST /charter-agreements/{id}/fund with tranche=SIGNING"
        actor: Client | RetailBroker
        preconditions:
          - "status axis == SIGNED else ERR_INVALID_STATE"
          - "amount_cents == agreement.signing_due_cents else ERR_FUNDING_AMOUNT_MISMATCH"
        side_effects:
          - "posts CLIENT_FUND(CHARTER_FEE, round_half_up(charter_fee_cents * 0.50)) and CLIENT_FUND(DEPOSIT, security_deposit_cents)"
          - "escrow held buckets and total_funded_cents increase accordingly"
          - "increments CharterAgreement.version by 1"
      - from: DEPOSIT_HELD
        to: FULLY_FUNDED
        trigger: "POST /charter-agreements/{id}/fund with tranche=FINAL"
        actor: Client | RetailBroker
        preconditions:
          - "status axis == SIGNED else ERR_INVALID_STATE"
          - "amount_cents == agreement.final_due_cents else ERR_FUNDING_AMOUNT_MISMATCH"
        side_effects:
          - "posts CLIENT_FUND(CHARTER_FEE, charter_fee_cents - round_half_up(charter_fee_cents * 0.50)), CLIENT_FUND(APA, apa_amount_cents) and, when gratuity_pledged_cents > 0, CLIENT_FUND(GRATUITY, gratuity_pledged_cents)"
          - "increments CharterAgreement.version by 1"
      - from: FULLY_FUNDED
        to: SETTLING
        trigger: "system (completion cascade hop 1, fired by POST /charter-agreements/{id}/complete)"
        actor: system
        preconditions: ["status axis transition UNDERWAY -> COMPLETED is executing"]
        side_effects: ["locks unresolved expenses (PENDING|DISPUTED -> REJECTED) and runs apa_position FINAL"]
      - from: SETTLING
        to: SETTLED
        trigger: "system (completion cascade hop 4: fires when the EscrowAccount reaches CLOSED)"
        actor: system
        preconditions: ["escrow status == CLOSED"]
        side_effects: []
      - from: UNFUNDED
        to: REFUNDING
        trigger: "system (cancellation cascade hop 1, fired by POST /charter-agreements/{id}/cancel)"
        actor: system
        preconditions: ["status axis transition -> CANCELLED is executing"]
        side_effects: ["computes days_before_start and cancellation_penalty_cents"]
      - from: DEPOSIT_HELD
        to: REFUNDING
        trigger: "system (cancellation cascade hop 1)"
        actor: system
        preconditions: ["status axis transition -> CANCELLED is executing"]
        side_effects: ["computes days_before_start and cancellation_penalty_cents"]
      - from: FULLY_FUNDED
        to: REFUNDING
        trigger: "system (cancellation cascade hop 1)"
        actor: system
        preconditions: ["status axis transition -> CANCELLED is executing"]
        side_effects: ["computes days_before_start and cancellation_penalty_cents"]
      - from: REFUNDING
        to: REFUNDED
        trigger: "system (cancellation cascade hop 4: fires when the EscrowAccount reaches CLOSED)"
        actor: system
        preconditions: ["escrow status == CLOSED"]
        side_effects: []
    note: "The funds axis is independent of the status axis except at the gates: fund requires status == SIGNED; start-prep requires funds_status == FULLY_FUNDED; cancel drives funds to REFUNDING/REFUNDED; complete drives funds to SETTLING/SETTLED."

  - entity: EscrowAccount
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SETTLING
        trigger: "system (hop 2 of the completion or cancellation cascade: settlement movements begin posting)"
        actor: system
        preconditions: ["owning agreement entered COMPLETED (SETTLING funds) or CANCELLED (REFUNDING funds)"]
        side_effects: []
      - from: SETTLING
        to: CLOSED
        trigger: "system (hop 3: all settlement/refund movements posted)"
        actor: system
        preconditions: ["every movement required by the settlement computation has been posted"]
        side_effects:
          - "all held buckets are 0; invariant: total_funded_cents == total_released_cents"
          - "triggers downstream hops: funds_status -> SETTLED/REFUNDED; on cancellation also releases the CHARTER AvailabilityBlock"

  - entity: ExpenseEntry
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]  # APPROVED is terminal except APPROVED -> DISPUTED reopens
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /expenses/{id}/review with outcome=APPROVED"
        actor: Client | RetailBroker
        preconditions:
          - "caller is the agreement's client or retail broker else ERR_FORBIDDEN"
          - "agreement.status IN {IN_PREP, UNDERWAY} else ERR_INVALID_STATE"
          - "bucket=APA: sum(APPROVED APA expenses) + amount <= escrow.held_apa_cents else ERR_ESCROW_INSUFFICIENT"
          - "bucket=DAMAGE_CLAIM: sum(APPROVED DAMAGE_CLAIM expenses) + amount <= escrow.held_deposit_cents else ERR_DEPOSIT_CLAIM_EXCEEDS_HELD"
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "POST /expenses/{id}/review with outcome=REJECTED"
        actor: Client | RetailBroker
        preconditions: ["caller is the agreement's client or retail broker else ERR_FORBIDDEN"]
        side_effects: []
      - from: APPROVED
        to: DISPUTED
        trigger: "POST /expenses/{id}/dispute"
        actor: Client | RetailBroker
        preconditions:
          - "caller is the agreement's client or retail broker else ERR_FORBIDDEN"
          - "agreement.status IN {IN_PREP, UNDERWAY} else ERR_INVALID_STATE"
        side_effects: ["the disputed amount leaves the APA final position until resolved"]
      - from: DISPUTED
        to: APPROVED
        trigger: "POST /expenses/{id}/resolve with outcome=APPROVED"
        actor: CentralAgent
        preconditions:
          - "caller is agreement.central_agent_id else ERR_FORBIDDEN"
          - "bucket caps re-validated as in PENDING -> APPROVED (ERR_ESCROW_INSUFFICIENT / ERR_DEPOSIT_CLAIM_EXCEEDS_HELD)"
        side_effects: []
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /expenses/{id}/resolve with outcome=REJECTED"
        actor: CentralAgent
        preconditions: ["caller is agreement.central_agent_id else ERR_FORBIDDEN"]
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "system (completion cascade hop 1: settlement locks all unresolved expenses)"
        actor: system
        preconditions: ["owning agreement is completing"]
        side_effects: []
      - from: DISPUTED
        to: REJECTED
        trigger: "system (completion cascade hop 1: settlement locks all unresolved expenses)"
        actor: system
        preconditions: ["owning agreement is completing"]
        side_effects: []

  - entity: ItineraryLeg
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: PERMITTED
        trigger: "system (bubble-up: evaluated whenever one of the leg's PortPermits transitions; fires when the leg has >= 1 GRANTED permit and zero REQUESTED permits — DENIED and EXPIRED permits do not block)"
        actor: system
        preconditions: ["count(permits of leg with status GRANTED) >= 1 AND count(permits of leg with status REQUESTED) == 0"]
        side_effects: []
      - from: PERMITTED
        to: PLANNED
        trigger: "system (bubble-up: a permit of this leg transitions GRANTED -> EXPIRED leaving zero GRANTED permits, or a new REQUESTED permit is created for the leg)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PortPermit
    initial_state: REQUESTED
    terminal_states: [EXPIRED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /port-permits/{id}/decide with outcome=GRANTED"
        actor: PlatformAdmin
        preconditions:
          - "closed-interval containment: permit.valid_from <= leg.arrival_date AND permit.valid_until >= leg.departure_date else ERR_PERMIT_WINDOW_INSUFFICIENT"
        side_effects: ["re-evaluates owning ItineraryLeg bubble-up (may flip PLANNED -> PERMITTED)"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /port-permits/{id}/decide with outcome=DENIED"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: DENIED
        to: REQUESTED
        trigger: "POST /port-permits/{id}/resubmit (updates valid_from/valid_until)"
        actor: CentralAgent
        preconditions: ["caller is the agreement's central agent else ERR_FORBIDDEN"]
        side_effects: []
      - from: GRANTED
        to: EXPIRED
        trigger: "system (evaluated by POST /_clock/set_current_utc: fires when the logical clock date > valid_until)"
        actor: system
        preconditions: ["clock date > valid_until"]
        side_effects: ["re-evaluates owning ItineraryLeg bubble-up (may flip PERMITTED -> PLANNED)"]

  - entity: InsuranceCertificate
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /insurance-certificates/{id}/verify with outcome=VERIFIED"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "POST /insurance-certificates/{id}/verify with outcome=REJECTED"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["a replacement certificate may then be created for the agreement"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: request-counter-stale-version
    parent_entity: CharterRequest
    write_endpoint: "POST /charter-requests/{id}/counter"
    occ_field: "expected_charter_request_version"
    description: |
      A counter-offer posted against a CharterRequest whose version has advanced
      since the client last observed it (e.g., the central agent has meanwhile
      posted a fresh offer with different terms) is rejected. The client must
      re-read the request and counter against the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: request-accept-stale-version
    parent_entity: CharterRequest
    write_endpoint: "POST /charter-requests/{id}/accept"
    occ_field: "expected_charter_request_version"
    description: |
      An acceptance posted against a CharterRequest whose version has advanced
      since the client last observed the offer (the terms on the server are no
      longer the terms the client read) is rejected; accepting unseen terms is
      never legitimate, so the client must re-read before accepting.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: block-create-stale-yacht
    parent_entity: Yacht
    write_endpoint: "POST /yachts/{id}/availability-blocks"
    occ_field: "expected_yacht_version"
    description: |
      A manual availability block posted against a Yacht whose version has
      advanced since the operator last observed the calendar (e.g., a CHARTER
      block was system-created by an accepted charter) is rejected; the operator
      must re-read the calendar before adding a manual block.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: charter_fee_quote
    trigger: "POST /charter-requests/{id}/offer (each offer recomputes unless a positive quoted_charter_fee_cents override is supplied)"
    algorithm: forward_looking
    formula: |
      days = (end_date - start_date) in whole days
      PRO_RATA variant:        fee = round_half_up(weekly_base_rate_cents * days / 7)
      WEEKLY_PLUS_DAILY variant:
        weeks = days // 7 ; rem = days mod 7
        extra_day_rate = round_half_up(weekly_base_rate_cents / 6)
        fee = weeks * weekly_base_rate_cents + rem * extra_day_rate
    input_set: "CharterRequest dates + Yacht.weekly_base_rate_cents; variant selected by Yacht.pricing_mode"
    constants:
      DAYS_PER_WEEK: 7
      EXTRA_DAY_DIVISOR: 6
    precision: "integer cents, round_half_up at each rounding step"
    variants:
      - name: PRO_RATA
        when: "yacht.pricing_mode == PRO_RATA"
        difference: "every day costs exactly weekly/7; partial weeks are linear"
      - name: WEEKLY_PLUS_DAILY
        when: "yacht.pricing_mode == WEEKLY_PLUS_DAILY"
        difference: "full weeks at the weekly rate; remaining days at the industry short-week daily rate weekly/6 (dearer than weekly/7), so identical dates and weekly rate yield a higher quote"

  - name: apa_pct_schedule
    trigger: "POST /charter-requests/{id}/offer when no apa_pct override is supplied"
    algorithm: threshold
    formula: |
      if quoted_charter_fee_cents < APA_TIER_THRESHOLD_CENTS: apa_pct = 0.30
      else:                                                    apa_pct = 0.25
      # boundary: quoted fee == threshold -> 0.25
    input_set: "the current offer's quoted_charter_fee_cents"
    constants:
      APA_TIER_THRESHOLD_CENTS: 2000000
      APA_PCT_BELOW_THRESHOLD: 0.30
      APA_PCT_AT_OR_ABOVE_THRESHOLD: 0.25
    precision: "exact decimal fraction"

  - name: apa_position
    trigger: "GET /charter-agreements/{id}/apa-position (both variants returned); FINAL variant also drives completion settlement"
    algorithm: aggregation
    formula: |
      provisional_apa_committed_cents = sum(amount_cents of ExpenseEntry where agreement matches AND bucket=APA AND status IN {PENDING, APPROVED})
      final_apa_spent_cents          = sum(amount_cents of ExpenseEntry where agreement matches AND bucket=APA AND status == APPROVED)
      projected_apa_return_cents = held_apa_cents - provisional_apa_committed_cents
      final_apa_return_cents     = held_apa_cents - final_apa_spent_cents
    input_set: "ExpenseEntry of the agreement with bucket=APA; PROVISIONAL includes PENDING+APPROVED (DISPUTED, REJECTED excluded), FINAL includes APPROVED only"
    constants: {}
    precision: "integer cents, no rounding"
    variants:
      - name: PROVISIONAL
        when: "forward-looking projection of committed APA spend"
        difference: "includes PENDING expenses, so with any pending expense the committed total is strictly greater and the projected return strictly smaller than FINAL"
      - name: FINAL
        when: "settlement basis at completion"
        difference: "counts APPROVED only; PENDING expenses excluded (and auto-REJECTED by the completion cascade)"

  - name: escrow_funding_schedule
    trigger: "computed at CharterAgreement creation (acceptance); enforced by POST /charter-agreements/{id}/fund"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned (circular-looking dependency made explicit):
      # 1) charter_fee_cents is locked from the accepted offer.
      # 2) apa_pct is resolved (offer override, else apa_pct_schedule tier keyed on charter_fee_cents).
      # 3) apa_amount_cents = round_half_up(charter_fee_cents * apa_pct).
      # 4) signing_charter_part = round_half_up(charter_fee_cents * SIGNING_SHARE_PCT)
      # 5) signing_due_cents = signing_charter_part + security_deposit_cents
      # 6) final_due_cents = (charter_fee_cents - signing_charter_part) + apa_amount_cents + gratuity_pledged_cents
      # Total required funding = signing_due_cents + final_due_cents.
    input_set: "agreement snapshot fields (charter_fee_cents, apa_pct, security_deposit_cents, gratuity_pledged_cents)"
    constants:
      SIGNING_SHARE_PCT: 0.50
    precision: "integer cents, round_half_up; the odd cent from an odd charter fee lands in signing_charter_part (final tranche gets the remainder)"

  - name: cancellation_penalty
    trigger: "POST /charter-agreements/{id}/cancel"
    algorithm: threshold
    formula: |
      days_before_start = (start_date - current clock date) in whole days
      tier_pct = 0.10 if days_before_start >= 90
                 0.30 if 60 <= days_before_start <= 89
                 0.50 if 30 <= days_before_start <= 59
                 1.00 if days_before_start <= 29
      penalty_cents = round_half_up(charter_fee_cents * tier_pct)
      retained_cents = min(penalty_cents, escrow.held_charter_fee_cents)
      refund_cents   = (held_charter_fee - retained) + held_apa + (held_deposit - approved_damage_claims) + held_gratuity
      penalty_commission_cents = round_half_up(retained_cents * PENALTY_COMMISSION_PCT)   # when retained > 0
      operator_release_cents   = retained_cents - penalty_commission_cents
    input_set: "agreement charter_fee_cents/start_date, logical clock date, escrow held buckets, APPROVED DAMAGE_CLAIM expenses"
    constants:
      TIER_FULL_NOTICE_DAYS: 90
      TIER_HIGH_NOTICE_DAYS: 60
      TIER_LOW_NOTICE_DAYS: 30
      PENALTY_COMMISSION_PCT: 0.20
    precision: "integer cents, round_half_up; boundary uses >=: days_before_start == 60 lands in the 0.30 tier, == 59 in the 0.50 tier"

  - name: commission_settlement
    trigger: "completion cascade hop 2/3 (basis CHARTER_FEE) and cancellation cascade hop 2/3 (basis CANCELLATION_PENALTY)"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is pinned: (1) round the total, (2) round the retail share,
      # (3) central share is the residual — never round the two shares independently.
      STANDARD variant (basis CHARTER_FEE):
        rate = 0.15 if charter_fee_cents < 1000000
               0.18 if 1000000 <= charter_fee_cents <= 4999999
               0.20 if charter_fee_cents >= 5000000
        commission_total_cents = round_half_up(charter_fee_cents * rate)
      CANCELLATION_BASIS variant:
        commission_total_cents = round_half_up(retained_cents * PENALTY_COMMISSION_PCT)
      retail_share_cents  = round_half_up(commission_total_cents * retail_pct_bps / 10000)
      central_share_cents = commission_total_cents - retail_share_cents
    input_set: "agreement charter_fee_cents (STANDARD) or retained penalty (CANCELLATION_BASIS); agreement retail_pct_bps"
    constants:
      COMMISSION_TIER1_MAX_CENTS: 999999
      COMMISSION_TIER1_RATE: 0.15
      COMMISSION_TIER2_MAX_CENTS: 4999999
      COMMISSION_TIER2_RATE: 0.18
      COMMISSION_TIER3_RATE: 0.20
      PENALTY_COMMISSION_PCT: 0.20
    precision: "integer cents, round_half_up per pinned order"
    variants:
      - name: STANDARD
        when: "agreement COMPLETED — basis is the full charter fee, tiered rate"
        difference: "tiered rate on the full fee"
      - name: CANCELLATION_BASIS
        when: "agreement CANCELLED with retained > 0 — basis is the retained penalty"
        difference: "flat 20% of retained penalty, no tiers; same fee data yields a different commission total and different broker shares"

  - name: deposit_settlement
    trigger: "completion cascade hop 2 (and IN_PREP cancellation)"
    algorithm: aggregation
    formula: |
      approved_damage_cents = sum(amount_cents of ExpenseEntry where agreement matches AND bucket=DAMAGE_CLAIM AND status == APPROVED)
      operator_damage_release_cents = min(approved_damage_cents, held_deposit_cents)
      deposit_return_cents = held_deposit_cents - operator_damage_release_cents
      # invariant: deposit_return_cents + operator_damage_release_cents == held_deposit_cents
    input_set: "APPROVED DAMAGE_CLAIM expenses; escrow held_deposit_cents"
    constants: {}
    precision: "integer cents; floor at 0 via the min()"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role; for entity_backed roles X-User-ID references an existing entity of the declared type; for Broker-backed roles the broker's broker_type must admit the role (CentralAgent: CENTRAL_AGENT or BOTH; RetailBroker: RETAIL_BROKER or BOTH)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is listed for the endpoint, and ownership rules hold (operator owns yacht; client/retail broker/central agent is a party to the request or agreement)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id in the path exists, validated left-to-right; body FK references (yacht_id, client_id, listing_central_agent_id, retail_broker_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target resource is in a from-state with a declared transition for this trigger (covers wrong-from, already-terminal, double-signature, manual release of CHARTER block, replacement insurance while one is PENDING/VERIFIED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 4
    category: state
    check: "cross-entity state: yacht LISTED on submit (ERR_YACHT_NOT_LISTED); insurance VERIFIED on sign (ERR_INSURANCE_NOT_VERIFIED, a business_safety-flavored state gate ordered here for sign); every leg PERMITTED on start-prep (ERR_PERMIT_NOT_GRANTED)"
    error_id: ERR_YACHT_NOT_LISTED
    http_status: 409
    applies_to: "submit, sign, start-prep"
  - priority: 5
    category: business_safety
    check: "operator.status == ACTIVE for yacht list/delist, block creation, request submit, offer"
    error_id: ERR_OPERATOR_SUSPENDED
    http_status: 422
    applies_to: "POST /yachts/{id}/list, POST /yachts/{id}/availability-blocks, POST /charter-requests/{id}/submit, POST /charter-requests/{id}/offer"
  - priority: 5
    category: business_safety
    check: "BAREBOAT submit: client.qualification_status == QUALIFIED"
    error_id: ERR_CLIENT_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /charter-requests/{id}/submit"
  - priority: 5
    category: business_safety
    check: "BAREBOAT submit: client.resume_class >= yacht.required_resume_class (NONE < COASTAL < OFFSHORE < OCEAN)"
    error_id: ERR_RESUME_CLASS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /charter-requests/{id}/submit"
  - priority: 5
    category: business_safety
    check: "segregation of duties: on POST /charter-requests, retail_broker_id (caller or supplied) must differ from yacht.listing_central_agent_id"
    error_id: ERR_BROKER_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /charter-requests"
  - priority: 5
    category: business_safety
    check: "sign requires a VERIFIED InsuranceCertificate for the agreement"
    error_id: ERR_INSURANCE_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /charter-agreements/{id}/sign"
  - priority: 5
    category: business_safety
    check: "start-prep requires every ItineraryLeg in status PERMITTED"
    error_id: ERR_PERMIT_NOT_GRANTED
    http_status: 422
    applies_to: "POST /charter-agreements/{id}/start-prep"
  - priority: 6
    category: business_temporal
    check: "calendar conflict on [start_date, end_date): true half-open overlap with an ACTIVE block -> ERR_AVAILABILITY_CONFLICT; no overlap but gap to an adjacent ACTIVE block < TURNAROUND_BUFFER_DAYS(1) -> ERR_TURNAROUND_BUFFER_VIOLATION"
    error_id: ERR_AVAILABILITY_CONFLICT
    http_status: 409
    applies_to: "POST /yachts/{id}/availability-blocks, POST /charter-requests/{id}/submit, POST /charter-requests/{id}/accept"
  - priority: 6
    category: business_temporal
    check: "buffer adjacency: new block's interval is disjoint but within 1 day of an ACTIVE block (gap == 0 days)"
    error_id: ERR_TURNAROUND_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /yachts/{id}/availability-blocks, POST /charter-requests/{id}/submit, POST /charter-requests/{id}/accept"
  - priority: 6
    category: business_temporal
    check: "accept/counter when now > offer_expires_at transitions the request to EXPIRED and rejects"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /charter-requests/{id}/accept, POST /charter-requests/{id}/counter"
  - priority: 6
    category: business_temporal
    check: "itinerary leg dates inside the charter window: agreement.start_date <= arrival_date <= departure_date <= agreement.end_date"
    error_id: ERR_LEG_OUTSIDE_CHARTER_WINDOW
    http_status: 422
    applies_to: "POST /charter-agreements/{id}/itinerary-legs"
  - priority: 6
    category: business_temporal
    check: "permit grant containment: valid_from <= leg.arrival_date AND valid_until >= leg.departure_date (closed interval)"
    error_id: ERR_PERMIT_WINDOW_INSUFFICIENT
    http_status: 422
    applies_to: "POST /port-permits/{id}/decide"
  - priority: 6
    category: business_temporal
    check: "embark requires clock date >= start_date; complete requires clock date >= end_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /charter-agreements/{id}/embark, POST /charter-agreements/{id}/complete"
  - priority: 7
    category: business_constraint
    check: "required fields present, types valid, enum members valid, dates well-formed, end_date > start_date, arrival <= departure, valid_from <= valid_until, amounts positive; block_type on manual creation restricted to MAINTENANCE | OPERATOR_HOLD"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH"
  - priority: 7
    category: business_constraint
    check: "1 <= guests_count <= yacht.capacity_berths (boundary: == capacity passes)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /charter-requests"
  - priority: 7
    category: business_constraint
    check: "charter_days = end_date - start_date >= yacht.min_charter_days"
    error_id: ERR_CHARTER_DURATION_INVALID
    http_status: 422
    applies_to: "POST /charter-requests"
  - priority: 7
    category: business_constraint
    check: "no other request with same client_id + yacht_id, half-open overlapping dates, status IN {DRAFT, SUBMITTED, OFFERED, COUNTERED}"
    error_id: ERR_DUPLICATE_ACTIVE_REQUEST
    http_status: 409
    applies_to: "POST /charter-requests, POST /charter-requests/{id}/submit, POST /charter-requests/{id}/rebook"
  - priority: 7
    category: business_constraint
    check: "counter allowed only while round_count < MAX_NEGOTIATION_ROUNDS(4)"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /charter-requests/{id}/counter"
  - priority: 7
    category: business_constraint
    check: "CREWED offer: gratuity_pledged_cents >= round_half_up(0.10 * quoted_charter_fee_cents); BAREBOAT: gratuity >= 0"
    error_id: ERR_GRATUITY_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /charter-requests/{id}/offer"
  - priority: 7
    category: business_constraint
    check: "insurance certificate: coverage_amount_cents >= agreement.charter_fee_cents"
    error_id: ERR_INSURANCE_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /charter-agreements/{id}/insurance-certificates"
  - priority: 7
    category: business_constraint
    check: "insurance certificate window contains the charter window: valid_from <= agreement.start_date AND valid_until >= agreement.end_date (closed)"
    error_id: ERR_INSURANCE_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /charter-agreements/{id}/insurance-certificates"
  - priority: 8
    category: business_fiscal
    check: "fund tranche sequencing: SIGNING requires funds_status == UNFUNDED, FINAL requires funds_status == DEPOSIT_HELD"
    error_id: ERR_FUNDING_TRANCHE_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /charter-agreements/{id}/fund"
  - priority: 8
    category: business_fiscal
    check: "fund amount must equal the computed tranche exactly (SIGNING: signing_due_cents; FINAL: final_due_cents)"
    error_id: ERR_FUNDING_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /charter-agreements/{id}/fund"
  - priority: 8
    category: business_fiscal
    check: "approving an APA expense must not push the APPROVED APA total above escrow.held_apa_cents"
    error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 422
    applies_to: "POST /expenses/{id}/review, POST /expenses/{id}/resolve"
  - priority: 8
    category: business_fiscal
    check: "approving a DAMAGE_CLAIM expense must not push the APPROVED damage total above escrow.held_deposit_cents"
    error_id: ERR_DEPOSIT_CLAIM_EXCEEDS_HELD
    http_status: 422
    applies_to: "POST /expenses/{id}/review, POST /expenses/{id}/resolve"
  - priority: 8
    category: business_fiscal
    check: "start-prep requires funds_status == FULLY_FUNDED"
    error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 422
    applies_to: "POST /charter-agreements/{id}/start-prep"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. After setting, evaluates time-based auto-transitions: GRANTED PortPermits with valid_until < new date become EXPIRED (with the ItineraryLeg bubble-up). Offer expiry is evaluated lazily by accept/counter, not by this sweep."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["permit expiry sweep + leg bubble-up re-evaluation"]

  # ---- operators / brokers / clients ----
  - method: POST
    path: "/operators"
    description: "Create an operator (starts ACTIVE)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, home_port]
    output: Operator
    side_effects: []
  - method: POST
    path: "/operators/{id}/suspend"
    description: "Suspend an operator (blocks new listings, blocks, submits, offers)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Operator
    side_effects: ["Operator ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/operators/{id}/reactivate"
    description: "Reactivate a suspended operator"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Operator
    side_effects: ["Operator SUSPENDED -> ACTIVE"]
  - method: POST
    path: "/brokers"
    description: "Create a broker (central agent or retail broker per broker_type)"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, broker_type, license_no]
    output: Broker
    side_effects: []
  - method: POST
    path: "/clients"
    description: "Create a client (qualification_status starts UNVERIFIED)"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email]
    output: Client
    side_effects: []
  - method: GET
    path: "/clients/{id}"
    description: "Read a client (qualification state, resume class)"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/clients/{id}/resume/submit"
    description: "Submit (or resubmit after rejection) a sailing resume"
    roles: [Client]
    code: 200
    input: [resume_class, skippered_hours]
    output: Client
    side_effects: ["Client UNVERIFIED|REJECTED -> PENDING_REVIEW"]
  - method: POST
    path: "/clients/{id}/resume/review"
    description: "Platform review of a submitted resume"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome]
    output: Client
    side_effects: ["Client PENDING_REVIEW -> QUALIFIED (outcome=QUALIFIED) | REJECTED (outcome=REJECTED)"]

  # ---- yachts & calendar ----
  - method: POST
    path: "/yachts"
    description: "Create a yacht listing (starts DRAFT); operator_id is the authenticated Operator"
    roles: [Operator]
    code: 201
    input: [name, charter_type, home_port, capacity_berths, weekly_base_rate_cents, min_charter_days, required_resume_class, security_deposit_cents, pricing_mode, listing_central_agent_id]
    output: Yacht
    side_effects: []
  - method: GET
    path: "/yachts/{id}"
    description: "Read a yacht"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: []
    output: Yacht
    side_effects: []
  - method: GET
    path: "/yachts"
    description: "List yachts with optional filters"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: ["operator_id?", "status?", "pricing_mode?", "listing_central_agent_id?", "limit?", "offset?"]
    output: Yacht[]
    side_effects: []
  - method: POST
    path: "/yachts/{id}/list"
    description: "List a DRAFT or DELISTED yacht"
    roles: [Operator]
    code: 200
    input: []
    output: Yacht
    side_effects: ["Yacht DRAFT|DELISTED -> LISTED; increments Yacht.version by 1"]
  - method: POST
    path: "/yachts/{id}/delist"
    description: "Delist a LISTED yacht (blocked while live requests or agreements reference it)"
    roles: [Operator]
    code: 200
    input: []
    output: Yacht
    side_effects: ["Yacht LISTED -> DELISTED; increments Yacht.version by 1"]
  - method: GET
    path: "/yachts/{id}/availability-blocks"
    description: "List availability blocks of a yacht (ACTIVE and RELEASED)"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AvailabilityBlock[]
    side_effects: []
  - method: POST
    path: "/yachts/{id}/availability-blocks"
    description: "Operator creates a MAINTENANCE or OPERATOR_HOLD block; OCC-guarded against a stale calendar view"
    roles: [Operator]
    code: 201
    input: [block_type, start_date, end_date, expected_yacht_version]
    output: AvailabilityBlock
    side_effects: ["creates block ACTIVE; increments Yacht.version by 1"]
  - method: POST
    path: "/availability-blocks/{id}/release"
    description: "Operator releases a manual block (CHARTER blocks reject with ERR_INVALID_STATE)"
    roles: [Operator]
    code: 200
    input: []
    output: AvailabilityBlock
    side_effects: ["block ACTIVE -> RELEASED; increments Yacht.version by 1"]

  # ---- charter requests (negotiation) ----
  - method: POST
    path: "/charter-requests"
    description: "Create a charter request (DRAFT). As Client, client_id must be the caller and retail_broker_id is optional; as RetailBroker, retail_broker_id is the caller and client_id selects the represented client"
    roles: [Client, RetailBroker]
    code: 201
    input: [client_id, yacht_id, start_date, end_date, guests_count, "retail_broker_id?"]
    output: CharterRequest
    side_effects: []
  - method: GET
    path: "/charter-requests/{id}"
    description: "Read a charter request"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: []
    output: CharterRequest
    side_effects: []
  - method: GET
    path: "/charter-requests"
    description: "List charter requests with optional filters (covers all request FK reverse lookups)"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: ["client_id?", "yacht_id?", "retail_broker_id?", "rebooked_from_request_id?", "status?", "limit?", "offset?"]
    output: CharterRequest[]
    side_effects: []
  - method: POST
    path: "/charter-requests/{id}/submit"
    description: "Submit a DRAFT request (qualification + calendar gates)"
    roles: [Client, RetailBroker]
    code: 200
    input: []
    output: CharterRequest
    side_effects: ["CharterRequest DRAFT -> SUBMITTED"]
  - method: POST
    path: "/charter-requests/{id}/offer"
    description: "Central agent issues an offer from SUBMITTED or COUNTERED; recomputes quote/terms unless overridden"
    roles: [CentralAgent]
    code: 200
    input: ["quoted_charter_fee_cents?", "apa_pct?", "gratuity_pledged_cents?", "retail_pct_bps?"]
    output: CharterRequest
    side_effects: ["CharterRequest -> OFFERED; runs charter_fee_quote + apa_pct_schedule; sets offer_expires_at; increments CharterRequest.version by 1"]
  - method: POST
    path: "/charter-requests/{id}/counter"
    description: "Client side counters the current offer (OCC on request version; round cap 4)"
    roles: [Client, RetailBroker]
    code: 200
    input: [expected_charter_request_version, "counter_charter_fee_cents?"]
    output: CharterRequest
    side_effects: ["CharterRequest OFFERED -> COUNTERED; round_count += 1; increments CharterRequest.version by 1"]
  - method: POST
    path: "/charter-requests/{id}/accept"
    description: "Client side accepts the current offer (OCC); cascades agreement + escrow + CHARTER block creation"
    roles: [Client, RetailBroker]
    code: 201
    input: [expected_charter_request_version]
    output: CharterAgreement
    side_effects:
      - "CharterRequest OFFERED -> ACCEPTED; increments CharterRequest.version by 1"
      - "creates CharterAgreement (PENDING_SIGNATURES / UNFUNDED) with snapshot terms; computes apa_amount_cents, signing_due_cents, final_due_cents"
      - "creates EscrowAccount OPEN"
      - "creates CHARTER AvailabilityBlock ACTIVE; increments Yacht.version by 1"
  - method: POST
    path: "/charter-requests/{id}/decline"
    description: "Client side declines the current offer"
    roles: [Client, RetailBroker]
    code: 200
    input: []
    output: CharterRequest
    side_effects: ["CharterRequest OFFERED -> DECLINED; increments CharterRequest.version by 1"]
  - method: POST
    path: "/charter-requests/{id}/rebook"
    description: "From a terminal request (CANCELLED, DECLINED, EXPIRED) create a fresh DRAFT request for the same client; rebooked_from_request_id links the two"
    roles: [Client, RetailBroker]
    code: 201
    input: [yacht_id, start_date, end_date, guests_count, "retail_broker_id?"]
    output: CharterRequest
    side_effects: ["creates new CharterRequest DRAFT with rebooked_from_request_id = source id"]

  # ---- charter agreements ----
  - method: GET
    path: "/charter-agreements/{id}"
    description: "Read a charter agreement (both state axes, computed funding schedule, penalty fields)"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: []
    output: CharterAgreement
    side_effects: []
  - method: GET
    path: "/charter-agreements"
    description: "List charter agreements with optional filters (covers all agreement FK reverse lookups)"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: ["charter_request_id?", "client_id?", "yacht_id?", "operator_id?", "retail_broker_id?", "central_agent_id?", "status?", "funds_status?", "limit?", "offset?"]
    output: CharterAgreement[]
    side_effects: []
  - method: POST
    path: "/charter-agreements/{id}/sign"
    description: "Record one countersignature (client or central agent); the second distinct signature transitions to SIGNED"
    roles: [Client, CentralAgent]
    code: 200
    input: []
    output: CharterAgreement
    side_effects: ["sets the caller's signed_at; PENDING_SIGNATURES -> SIGNED on second signature; increments CharterAgreement.version by 1"]
  - method: POST
    path: "/charter-agreements/{id}/void"
    description: "Central agent voids an unsigned agreement; releases the CHARTER block and cancels the source request"
    roles: [CentralAgent]
    code: 200
    input: []
    output: CharterAgreement
    side_effects: ["PENDING_SIGNATURES -> VOIDED; CHARTER block RELEASED; Yacht.version += 1; CharterRequest ACCEPTED -> CANCELLED"]
  - method: POST
    path: "/charter-agreements/{id}/fund"
    description: "Fund one escrow tranche (SIGNING then FINAL) with the exact computed amount; posts CLIENT_FUND movements per bucket"
    roles: [Client, RetailBroker]
    code: 200
    input: [tranche, amount_cents]
    output: EscrowAccount
    side_effects:
      - "requires agreement.status == SIGNED"
      - "posts CLIENT_FUND movements: SIGNING -> CHARTER_FEE round(fee*0.5) + DEPOSIT full deposit; FINAL -> CHARTER_FEE remainder + APA full + GRATUITY full pledge"
      - "funds_status UNFUNDED -> DEPOSIT_HELD -> FULLY_FUNDED; increments CharterAgreement.version by 1; updates escrow held buckets and total_funded_cents"
  - method: POST
    path: "/charter-agreements/{id}/start-prep"
    description: "Move SIGNED -> IN_PREP (permits + funding gates)"
    roles: [Operator]
    code: 200
    input: []
    output: CharterAgreement
    side_effects: ["increments CharterAgreement.version by 1"]
  - method: POST
    path: "/charter-agreements/{id}/embark"
    description: "Move IN_PREP -> UNDERWAY on or after start_date"
    roles: [Operator]
    code: 200
    input: []
    output: CharterAgreement
    side_effects: ["increments CharterAgreement.version by 1"]
  - method: POST
    path: "/charter-agreements/{id}/complete"
    description: "Complete the charter on or after end_date; runs the full settlement cascade (APA final reconciliation, escrow release movements, commission statement, funds SETTLED)"
    roles: [Operator, CentralAgent]
    code: 200
    input: []
    output: CharterAgreement
    side_effects: ["completion cascade hops 1-4 per CharterAgreement state machine; increments CharterAgreement.version by 1"]
  - method: POST
    path: "/charter-agreements/{id}/cancel"
    description: "Cancel from PENDING_SIGNATURES, SIGNED or IN_PREP; runs the cancellation cascade (penalty tiers, escrow refunds, block release, request cancellation)"
    roles: [Client, RetailBroker, CentralAgent]
    code: 200
    input: ["reason?"]
    output: CharterAgreement
    side_effects: ["cancellation cascade hops 1-6 per CharterAgreement state machine; increments CharterAgreement.version by 1"]

  # ---- escrow ----
  - method: GET
    path: "/charter-agreements/{id}/escrow"
    description: "Read the agreement's escrow account (array of length 0-1)"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: []
    output: EscrowAccount[]
    side_effects: []
  - method: GET
    path: "/escrow-accounts/{id}"
    description: "Read an escrow account by id"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: []
    output: EscrowAccount
    side_effects: []
  - method: GET
    path: "/escrow-accounts/{id}/movements"
    description: "List escrow movements in posted (chronological) order"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: ["movement_type?", "bucket?", "limit?", "offset?"]
    output: EscrowMovement[]
    side_effects: []

  # ---- APA expenses / provisioning ----
  - method: POST
    path: "/charter-agreements/{id}/expenses"
    description: "Operator records an APA expense or damage claim (PENDING); allowed while agreement IN IN_PREP or UNDERWAY"
    roles: [Operator]
    code: 201
    input: [bucket, description, amount_cents]
    output: ExpenseEntry
    side_effects: []
  - method: GET
    path: "/charter-agreements/{id}/expenses"
    description: "List expense entries of an agreement"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: ["bucket?", "status?", "limit?", "offset?"]
    output: ExpenseEntry[]
    side_effects: []
  - method: POST
    path: "/expenses/{id}/review"
    description: "Client side approves or rejects a PENDING expense (bucket caps enforced on approve)"
    roles: [Client, RetailBroker]
    code: 200
    input: [outcome]
    output: ExpenseEntry
    side_effects: ["ExpenseEntry PENDING -> APPROVED | REJECTED"]
  - method: POST
    path: "/expenses/{id}/dispute"
    description: "Client side disputes an APPROVED expense (reopens it)"
    roles: [Client, RetailBroker]
    code: 200
    input: []
    output: ExpenseEntry
    side_effects: ["ExpenseEntry APPROVED -> DISPUTED"]
  - method: POST
    path: "/expenses/{id}/resolve"
    description: "Central agent resolves a DISPUTED expense"
    roles: [CentralAgent]
    code: 200
    input: [outcome]
    output: ExpenseEntry
    side_effects: ["ExpenseEntry DISPUTED -> APPROVED | REJECTED (caps re-validated on APPROVED)"]
  - method: GET
    path: "/charter-agreements/{id}/apa-position"
    description: "Computed read: returns both APA variants side by side (provisional vs final committed/spent and returns)"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: []
    output: { held_apa_cents: integer, provisional_apa_committed_cents: integer, final_apa_spent_cents: integer, projected_apa_return_cents: integer, final_apa_return_cents: integer }
    side_effects: []

  # ---- insurance ----
  - method: POST
    path: "/charter-agreements/{id}/insurance-certificates"
    description: "Central agent submits an insurance certificate; rejected if a PENDING/VERIFIED one already exists (ERR_INVALID_STATE)"
    roles: [CentralAgent]
    code: 201
    input: [insurer_name, policy_no, coverage_amount_cents, valid_from, valid_until]
    output: InsuranceCertificate
    side_effects: []
  - method: GET
    path: "/charter-agreements/{id}/insurance-certificates"
    description: "List insurance certificates of an agreement"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []
  - method: POST
    path: "/insurance-certificates/{id}/verify"
    description: "Platform verifies or rejects a PENDING certificate"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome]
    output: InsuranceCertificate
    side_effects: ["InsuranceCertificate PENDING -> VERIFIED | REJECTED"]

  # ---- itinerary & port permits ----
  - method: POST
    path: "/charter-agreements/{id}/itinerary-legs"
    description: "Central agent appends an itinerary leg (seq_no auto-assigned); allowed while agreement IN PENDING_SIGNATURES, SIGNED or IN_PREP"
    roles: [CentralAgent]
    code: 201
    input: [port_name, arrival_date, departure_date]
    output: ItineraryLeg
    side_effects: ["creates leg PLANNED with seq_no = existing leg count + 1"]
  - method: GET
    path: "/charter-agreements/{id}/itinerary-legs"
    description: "List itinerary legs of an agreement in seq_no order"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: ItineraryLeg[]
    side_effects: []
  - method: GET
    path: "/itinerary-legs/{id}"
    description: "Read an itinerary leg"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: []
    output: ItineraryLeg
    side_effects: []
  - method: POST
    path: "/itinerary-legs/{id}/permits"
    description: "Central agent requests a port permit for a leg (REQUESTED); flips a PERMITTED leg back to PLANNED"
    roles: [CentralAgent]
    code: 201
    input: [port_authority_ref, valid_from, valid_until]
    output: PortPermit
    side_effects: ["creates PortPermit REQUESTED; leg bubble-up re-evaluation (PERMITTED -> PLANNED)"]
  - method: GET
    path: "/itinerary-legs/{id}/permits"
    description: "List permits of a leg"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PortPermit[]
    side_effects: []
  - method: POST
    path: "/port-permits/{id}/decide"
    description: "Platform grants (containment-validated) or denies a REQUESTED permit"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome]
    output: PortPermit
    side_effects: ["PortPermit REQUESTED -> GRANTED | DENIED; on GRANT, leg bubble-up re-evaluation (PLANNED -> PERMITTED)"]
  - method: POST
    path: "/port-permits/{id}/resubmit"
    description: "Central agent resubmits a DENIED permit with a new validity window"
    roles: [CentralAgent]
    code: 200
    input: [valid_from, valid_until]
    output: PortPermit
    side_effects: ["PortPermit DENIED -> REQUESTED"]

  # ---- commissions ----
  - method: GET
    path: "/charter-agreements/{id}/commission-statements"
    description: "List commission statements of an agreement (0-1 entries; created by completion or cancellation settlement)"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: CommissionStatement[]
    side_effects: []

  # ---- agreement-scoped calendar view ----
  - method: GET
    path: "/charter-agreements/{id}/availability-blocks"
    description: "List availability blocks linked to an agreement (the CHARTER block; array of length 0-1 ACTIVE plus history)"
    roles: [PlatformAdmin, Operator, Client, RetailBroker, CentralAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AvailabilityBlock[]
    side_effects: []

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID; role not declared; entity_backed id does not reference a matching entity (or broker_type mismatch)" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on the endpoint, or ownership rule violated (operator does not own yacht; caller not a party to the request/agreement; offer by non-listing central agent)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body FK does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, bad type, invalid enum member, end_date <= start_date, non-positive amounts, manual block_type=CHARTER, embark before start_date, complete before end_date, invalid tranche name" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "No declared transition from the current state for this trigger (wrong from-state, already-terminal, duplicate signature, manual release of CHARTER block, duplicate PENDING/VERIFIED insurance certificate, void after a signature)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_<parent>_version does not equal the parent's current version (counter, accept, manual block creation)" }
  - { id: ERR_OPERATOR_SUSPENDED, http: 422, condition: "Operator is SUSPENDED: yacht list, block creation, request submit, or offer attempted" }
  - { id: ERR_YACHT_NOT_LISTED, http: 409, condition: "Submit attempted for a yacht not in LISTED status" }
  - { id: ERR_CLIENT_NOT_QUALIFIED, http: 422, condition: "BAREBOAT submit by a client whose qualification_status != QUALIFIED" }
  - { id: ERR_RESUME_CLASS_INSUFFICIENT, http: 422, condition: "BAREBOAT submit where client.resume_class ranks below yacht.required_resume_class" }
  - { id: ERR_BROKER_CONFLICT_OF_INTEREST, http: 422, condition: "Request create where retail_broker_id == yacht.listing_central_agent_id (segregation of duties)" }
  - { id: ERR_INSURANCE_NOT_VERIFIED, http: 422, condition: "Sign attempted without a VERIFIED InsuranceCertificate for the agreement" }
  - { id: ERR_PERMIT_NOT_GRANTED, http: 422, condition: "start-prep attempted while some ItineraryLeg is not PERMITTED (no permit, permit REQUESTED/DENIED/EXPIRED)" }
  - { id: ERR_AVAILABILITY_CONFLICT, http: 409, condition: "True half-open interval overlap between the requested [start_date, end_date) and an ACTIVE AvailabilityBlock on the yacht" }
  - { id: ERR_TURNAROUND_BUFFER_VIOLATION, http: 409, condition: "No overlap, but the requested interval is adjacent to an ACTIVE block with gap 0 days (< TURNAROUND_BUFFER_DAYS=1)" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "accept/counter attempted when now > offer_expires_at; the request transitions to EXPIRED" }
  - { id: ERR_LEG_OUTSIDE_CHARTER_WINDOW, http: 422, condition: "Itinerary leg dates outside [agreement.start_date, agreement.end_date] (closed) or arrival > departure" }
  - { id: ERR_PERMIT_WINDOW_INSUFFICIENT, http: 422, condition: "Permit grant whose closed validity window does not contain the leg's [arrival_date, departure_date]" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "guests_count > yacht.capacity_berths (== capacity is allowed)" }
  - { id: ERR_CHARTER_DURATION_INVALID, http: 422, condition: "charter_days < yacht.min_charter_days" }
  - { id: ERR_DUPLICATE_ACTIVE_REQUEST, http: 409, condition: "Same client + yacht with half-open overlapping dates already has a request in {DRAFT, SUBMITTED, OFFERED, COUNTERED}" }
  - { id: ERR_NEGOTIATION_ROUND_LIMIT, http: 409, condition: "Counter attempted when round_count == MAX_NEGOTIATION_ROUNDS(4)" }
  - { id: ERR_GRATUITY_BELOW_MINIMUM, http: 422, condition: "CREWED offer with gratuity_pledged_cents < round_half_up(0.10 * quoted_charter_fee_cents)" }
  - { id: ERR_INSURANCE_COVERAGE_INSUFFICIENT, http: 422, condition: "Certificate coverage_amount_cents < agreement.charter_fee_cents" }
  - { id: ERR_INSURANCE_WINDOW_INVALID, http: 422, condition: "Certificate validity window does not contain [agreement.start_date, agreement.end_date] (closed)" }
  - { id: ERR_FUNDING_TRANCHE_OUT_OF_ORDER, http: 422, condition: "FINAL funded before SIGNING, or SIGNING funded twice" }
  - { id: ERR_FUNDING_AMOUNT_MISMATCH, http: 422, condition: "Fund amount_cents != computed tranche due (signing_due_cents / final_due_cents)" }
  - { id: ERR_ESCROW_INSUFFICIENT, http: 422, condition: "APA expense approval would push APPROVED APA total above held_apa_cents; or start-prep with funds_status != FULLY_FUNDED" }
  - { id: ERR_DEPOSIT_CLAIM_EXCEEDS_HELD, http: 422, condition: "Damage-claim approval would push APPROVED damage total above held_deposit_cents" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operations: onboards operators/brokers/clients, reviews resumes, verifies insurance, decides port permits, suspends operators, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /operators, /operators/{id}/suspend, /operators/{id}/reactivate"
      - "POST /brokers, /clients"
      - "POST /clients/{id}/resume/review"
      - "POST /insurance-certificates/{id}/verify"
      - "POST /port-permits/{id}/decide"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: Operator
    description: "Yacht operator/fleet company: owns yachts, manages calendar blocks, records APA expenses and damage claims, drives prep/embark/complete"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /yachts, /yachts/{id}/list, /yachts/{id}/delist"
      - "POST /yachts/{id}/availability-blocks, /availability-blocks/{id}/release"
      - "POST /charter-agreements/{id}/expenses"
      - "POST /charter-agreements/{id}/start-prep, /charter-agreements/{id}/embark"
    shared_operations: ["POST /charter-agreements/{id}/complete (with CentralAgent)", "all GET endpoints"]
  - name: Client
    description: "Charter client: submits sailing resume, creates/negotiates/accepts requests, signs, funds escrow, reviews/disputes expenses, may cancel"
    identity: "entity_backed:Client"
    exclusive_operations: ["POST /clients/{id}/resume/submit"]
    shared_operations:
      - "request lifecycle: POST /charter-requests, /submit, /counter, /accept, /decline, /rebook (with RetailBroker)"
      - "POST /charter-agreements/{id}/sign (with CentralAgent)"
      - "POST /charter-agreements/{id}/fund (with RetailBroker)"
      - "POST /expenses/{id}/review, /expenses/{id}/dispute (with RetailBroker)"
      - "POST /charter-agreements/{id}/cancel (with RetailBroker, CentralAgent)"
      - "all GET endpoints"
  - name: RetailBroker
    description: "Retail broker representing the client (X-User-ID must equal a Broker with broker_type RETAIL_BROKER or BOTH); acts on requests/agreements where it is the retail_broker_id; segregation of duties: may not act where it is also the listing central agent"
    identity: "entity_backed:Broker"
    exclusive_operations: []
    shared_operations:
      - "request lifecycle: POST /charter-requests, /submit, /counter, /accept, /decline, /rebook (with Client)"
      - "POST /charter-agreements/{id}/fund (with Client)"
      - "POST /expenses/{id}/review, /expenses/{id}/dispute (with Client)"
      - "POST /charter-agreements/{id}/cancel (with Client, CentralAgent)"
      - "all GET endpoints"
  - name: CentralAgent
    description: "Central agent / listing broker (X-User-ID must equal a Broker with broker_type CENTRAL_AGENT or BOTH matching the yacht's listing_central_agent_id): issues offers, builds itinerary, requests permits, submits insurance, resolves expense disputes, signs, may void or cancel"
    identity: "entity_backed:Broker"
    exclusive_operations:
      - "POST /charter-requests/{id}/offer"
      - "POST /charter-agreements/{id}/void"
      - "POST /charter-agreements/{id}/itinerary-legs"
      - "POST /itinerary-legs/{id}/permits, /port-permits/{id}/resubmit"
      - "POST /charter-agreements/{id}/insurance-certificates"
      - "POST /expenses/{id}/resolve"
    shared_operations:
      - "POST /charter-agreements/{id}/sign (with Client)"
      - "POST /charter-agreements/{id}/complete (with Operator)"
      - "POST /charter-agreements/{id}/cancel (with Client, RetailBroker)"
      - "all GET endpoints"
