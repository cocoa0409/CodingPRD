            - "each action row reads status ISSUED with points 2 for MINOR and 5 for MODERATE, and issued_by_user_id officer-1"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: permit_activation_gated_by_operating_plan_status
        grounds:
          - state_machines.Permit.ISSUED_to_ACTIVE
          - state_machines.OperatingPlan
          - errors.ERR_OPERATING_PLAN_NOT_APPROVED
        distinguishing_aspect: |
          ENTITY PAIR: Permit depends on OperatingPlan. The gate is walked across every non-approved
          status of the dependency — DRAFT, SUBMITTED, UNDER_REVIEW and REVISION_REQUESTED all
          refuse activation with the same error, and only APPROVED lets the permit move ISSUED ->
          ACTIVE. Nothing about the permit itself changes between the five attempts: insurance, bond
          and guide capacity are all in place from the start, so the only variable is the linked
          plan's state.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "UseArea BRW-01 with party_size_max 12 and max_clients_per_guide 8"
            - "Outfitter Alpine holding one ISSUED permit for 200 service days with term 2027-01-01 .. 2029-12-31 and indemnification_acknowledged true"
            - "the permit already carries an ACTIVE 100000000-cent liability certificate and an ACTIVE 1000000-cent bond, so insurance_current and bond_current are true"
            - "two QUALIFIED guides authorized — Rita Long (LEAD/WFR, 7 seasons, frozen capacity 8) and Ben Cruz (ASSISTANT/BASIC_FIRST_AID, 2 seasons, frozen capacity 4) — so authorized_client_capacity_total is 12, exactly party_size_max"
            - "an OperatingPlan for plan_year 2027 still in DRAFT"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
