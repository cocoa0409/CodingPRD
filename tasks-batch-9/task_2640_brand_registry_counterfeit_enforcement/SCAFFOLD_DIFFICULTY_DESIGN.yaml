          setup:
            - "Brand with enforcement_budget_cents 1000 and enforcement_spend_cents 0, so any 5635-cent order breaches the budget"
            - "Claim A on a FLAGGED listing has been DISMISSED by the analyst (no takedown ever existed)"
            - "Claim B on a second FLAGGED listing is still DRAFT, giving a clean control for the fiscal rule"
